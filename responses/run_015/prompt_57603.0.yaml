prompt: |-
  I have spent most of the last fifteen years reading LessWrong and its successors, and for a good while I was the person in the comment threads defending effective altruism against what struck me as lazy criticism. My position has drifted: not towards the critics, exactly, but towards a suspicion that one particular critique has been answered badly, and that the badness of the answer has gone unnoticed because the answer looks rigorous. I have drafted an essay around this idea for a small blog I keep — a few hundred readers, mostly former rationalists who now work in policy — and I would like a serious critical read before I post it. A friend who works at a grantmaker read an earlier version and told me it was fine but unoriginal, which is the least useful feedback imaginable, since it does not tell me whether the unoriginality lies in the diagnosis or in the proposed fix. The draft is below; it is roughly finished, though the coinages are provisional and I would not mind hearing that they are bad.

  --- BEGIN DRAFT ---

  **The error bars are not where the objection lives**

  1. A familiar objection runs roughly as follows. Cost-effectiveness analysis of the kind practised by the movement's evaluators systematically favours interventions whose benefits can be counted — deaths averted, cases prevented, income gained — and systematically disfavours those whose benefits resist counting: political advocacy, institutional reform, research capacity, or simply refraining from something harmful. Because the analysis issues in a ranking, and rankings drive allocations, the objection concludes that a bias in what is measurable becomes a mechanism for importing quietism about structure into decisions about money. The standard reply is that this attacks a naive methodology nobody holds: evaluators publish wide uncertainty ranges, write long caveats sections, and frequently say in terms that they cannot assess an intervention quantitatively at all. The objection, on this view, mistakes humility for false precision.

  2. My claim is that the reply fails, and that the reason it fails generalises. There are at least two ways an estimate can be uncertain. The first is uncertainty about parameters within a model whose shape is agreed: how large the treatment effect is, how much of the observed effect is attributable to the intervention rather than to confounders or regression to the mean, how well it transfers to a different population. The second is uncertainty about whether the model contains the right variables at all — whether the quantity being estimated is the quantity that ought to be estimated. These are not two degrees of the same thing. Widening a distribution over a fixed quantity does not, in principle, represent the hypothesis that the quantity is the wrong one to distribute over. An interval running from small effect to very large effect is silent on, and cannot be stretched to cover, effect of a kind we are not measuring.

  3. What makes this interesting rather than pedantic is that the failure is self-concealing. A reader who encounters a cost-per-outcome figure, a range, and a caveats paragraph cannot tell whether that range encodes parameter uncertainty, structural uncertainty, or — as I suspect is the normal case — a mixture in which the structural component has been absorbed into the parametric one, because the parametric one is the only component the model can express. The objection that you are not measuring what matters most is thus answered by pointing at an instrument that was never capable of answering it, and the answer is accepted because the instrument looks appropriately modest. I want to call this humility that has been relocated rather than earned. The same shape of difficulty recurs in the movement's career advice: an earning-to-give comparison models expected salary and expected marginal value of donations, with explicit uncertainty attached, but cannot easily represent that the comparison rests on assumptions about counterfactual replacement — whether the post would otherwise have gone to someone equally committed — and about the effect of the career on the person's later values. Those are structural, not parametric, and the uncertainty attached to the salary figures does not touch them.

  4. If the diagnosis is right, the remedy is not better estimates but a different kind of published statement. Each ranked intervention should carry a short mandatory section listing outcomes deliberately excluded from the model, together with: (a) a qualitative argument, not a number, for why their exclusion is unlikely to reverse the ranking against the leading alternative; (b) a stated trigger — the sort of evidence that, if it appeared, would reopen the ranking; and (c) a standing entry in a public register, so that the trigger stays attached to the recommendation after the analysis is superseded. Three features distinguish this from the caveats paragraph that already exists. It is enumerative rather than discursive, so that an omission becomes an item somebody can be shown to have missed. It is comparative, because what matters is not whether an exclusion is regrettable in isolation but whether it changes an ordering. And it persists, because the point of a trigger is that it can be checked later by someone else.

  5. I have not fully answered two objections to my own proposal. The first is opportunity cost: within the framework I am criticising, the analyst-hours spent writing exclusion statements are hours not spent on interventions whose benefits are countable, and if my structural claim bites only in a minority of cases the expected loss is real. My only response is that the cost is trivial relative to the size of the portfolios concerned, which may be a rationalisation in a tidy form. The second I shall call humility theatre. The requirement asks analysts to enumerate what they could not measure, and enumerating what one could not measure is precisely the task at which a quantifier is worst. The predictable result is a well-formatted list of negligible exclusions, while the exclusion that actually matters is absent because nobody thought of it. On this objection my proposal manufactures the appearance of the self-awareness it was meant to produce, and does so more convincingly than the caveats paragraph it replaces.

  6. A note on scope. The argument does not show that unmeasurable values should dominate measurable ones, that advocacy beats bednets, or that past allocations have been badly wrong: a structural gap is perfectly compatible with the ranking it produces being correct. Nor is my claim that the relevant community lacks the conceptual vocabulary. People in the forecasting half of the same broad movement discuss the difference between getting a model's parameters right and getting its shape right with considerable sophistication, and there are already practices of dividing a portfolio across incompatible value frameworks precisely on the grounds that one cannot settle which framework is correct. My claim is narrower and, I think, more awkward: that this vocabulary has not migrated into the cost-effectiveness half of the movement, and that its absence is masked by an uncertainty quantification which looks like humility and functions like an immune response.

  --- END DRAFT ---

  Three things I would like from you, in this order of importance. First, press hard on section 2: is the parameter-versus-structure distinction actually load-bearing, or is it a distinction without a difference once you remember that any sufficiently wide parametric interval can be defended as a crude proxy for model uncertainty? In particular, consider the reply I may have straw-manned — namely that structural concerns are not meant to be handled inside the cost-effectiveness analysis at all but one level up, in the choice of which causes and which outcome types to model in the first place, so that the humility I say is missing is located elsewhere in the process. If that reply works, my whole essay is about a misunderstanding of institutional division of labour, and I would rather find that out now. Second, tell me where I have misdescribed practice. I have deliberately named no organisations and cited no documents, so I may have attributed to evaluators a methodology they do not actually use; where I say something already exists under another name, or where my claim in section 4 that the requirement would be novel is plainly overblown, I want to be told bluntly and shown the feature of existing practice that contradicts me. Third, assess section 4 as an institutional proposal rather than as philosophy: how much analyst time would it realistically consume, would it survive contact with a funder who wants a number by Thursday, and is the trigger device in (b) coherent or merely decorative? If you know of bodies that already require something structurally similar — in regulation, in environmental assessment, in drug labelling, in fiscal budgeting — say what makes their version work or fail, because I would like to borrow whatever machinery has already been debugged. What I do not want is a summary of my own argument returned to me, a list of things to read, or the observation that reasonable people disagree about the weight of unmeasurable goods, which is true and beside the point I am making.
reasoning: |-
  Here's a thinking process that leads to the critique:

  1.  **Analyze the Request:**
      *   **User:** Long-time LessWrong reader, former defender of EA, now skeptical of a specific critique/answer dynamic regarding cost-effectiveness analysis (CEA) and structural uncertainty.
      *   **Task:** Provide a serious critical read of a draft essay.
      *   **Audience:** Small blog, few hundred readers (mostly former rationalists in policy).
      *   **Constraints:**
          1.  Press hard on Section 2 (Parameter vs. Structure distinction). Is it load-bearing or a distinction without a difference? Address the "division of labour" counter-argument (structural concerns handled *before* modeling).
          2.  Identify misdescriptions of practice. Have I attributed methodologies incorrectly? Does Section 4's proposal already exist under another name?
          3.  Assess Section 4 as an institutional proposal. Feasibility, analyst time, funder pressure, coherence of the "trigger" device. Compare to existing regulatory/budgeting machinery.
          4.  **Negative Constraints:** No summary of the argument, no reading lists, no "reasonable people disagree" platitudes.
      *   **Tone:** Serious, critical, constructive, matching the intellectual density of the draft.

  2.  **Analyze the Draft:**
      *   **Core Thesis:** The standard EA response to the "measurable bias" critique (we have error bars/caveats) fails because it conflates *parametric uncertainty* (values within a model) with *structural uncertainty* (variables missing from the model). Wide error bars don't capture missing variables.
      *   **Key Concept:** "Relocated humility" (looking modest via error bars while missing structural blind spots).
      *   **Proposal:** Mandatory "Exclusion Statements" for ranked interventions: (a) qualitative argument for exclusion, (b) triggers for re-opening, (c) public register.
      *   **Self-Critique:** Acknowledges opportunity cost and "humility theatre" risks.

  3.  **Drafting the Critique - Section by Section:**

      *   **Task 1: Pressing on Section 2 (Parameter vs. Structure).**
          *   *The Distinction:* It's a standard statistical distinction (model uncertainty vs. parameter uncertainty). It *is* load-bearing theoretically.
          *   *The Counter-Argument:* Can wide parametric intervals proxy for structural uncertainty? *Verdict:* No, not really. A distribution over $X$ doesn't capture $Y$. If $Y$ is the dominant factor, the distribution over $X$ is irrelevant.
          *   *The "Division of Labour" Objection:* This is the strongest threat to the essay. The draft claims evaluators don't handle structural uncertainty. In reality, EA orgs (OpenPhil, GiveWell) do "cause prioritization" *before* "intervention prioritization." Structural uncertainty is often handled at the cause level (e.g., "Is global health more important than AI safety?").
          *   *Critique Point:* The essay conflates *intervention-level* CEA with *cause-level* prioritization. The "structural" missing variables (like political stability) are often the reason a *cause area* is rejected, not necessarily why a specific bednet distribution is ranked lower than another bednet distribution. However, within a cause area (e.g., Global Health), structural factors (advocacy vs. direct aid) are often compared directly. Here, the essay holds water. I need to point out that the "division of labour" defense works for Cause A vs. Cause B, but fails for Intervention A vs. Intervention B within the same portfolio.
          *   *Refinement:* The essay implies the CEA *itself* is doing the ranking that drives money. If the structural work happens upstream, the CEA is just the final step. But if the CEA output is the *justification* for the money (which it often is), then the structural blind spots in the CEA matter even if the decision was made upstream. The essay needs to clarify if it's attacking the *decision process* or the *published justification*.

      *   **Task 2: Misdescriptions of Practice.**
          *   *Claim:* "Evaluators publish wide uncertainty ranges... frequently say... they cannot assess an intervention quantitatively at all."
          *   *Reality:* GiveWell/OpenPhil often do *not* publish wide uncertainty ranges in their top-level summaries. They often give point estimates or narrow ranges for top charities. They do have "room for more funding" constraints which act as a soft cap, but that's not structural uncertainty.
          *   *Claim:* Section 4 proposal is novel.
          *   *Reality:* "Pre-mortems" and "Key Uncertainties" are common in intelligence analysis and some grantmaking (OpenPhil's "cause reports" often list key uncertainties). However, a *mandatory, standardized exclusion register attached to specific rankings* is less common.
          *   *Correction:* The draft says "caveats paragraph that already exists." Actually, rigorous CEA often lacks even robust caveats in the public-facing summary. The "humility" might be even less than the author claims.
          *   *Specific Terminology:* In forecasting, this is "model uncertainty" vs. "parameter uncertainty." In EA, OpenPhil uses "explicit worldview diversification." The essay should acknowledge this term. It's the closest existing practice to the proposal.

      *   **Task 3: Assessing Section 4 (Institutional Proposal).**
          *   *Feasibility:* Analyst time is expensive. Writing a good "exclusion statement" is harder than running the model. It requires deep qualitative reasoning.
          *   *Funder Pressure:* Funders want "the answer." A list of "things we didn't measure" sounds like "we don't know." This creates reputational risk.
          *   *The Trigger:* "The sort of evidence that... would reopen the ranking." This is the strongest part. It's akin to "stopping rules" in clinical trials or "review triggers" in regulation.
          *   *Comparison:* Environmental Impact Statements (EIS) require listing "unavoidable adverse effects." Regulatory Impact Analysis requires considering alternatives. The "trigger" is like a "sunset clause" or "review date."
          *   *Critique:* The trigger is hard to define. "If political stability drops by X%" is measurable, but "If advocacy becomes more viable" is not. The trigger needs to be observable.
          *   *Humility Theatre:* The author acknowledges this. I should reinforce it. Analysts will list "Weather" as an exclusion, not "Systemic Racism."

  4.  **Synthesizing and Refining the Feedback:**

      *   *Tone Check:* Ensure I'm not summarizing. Be direct.
      *   *Structure:* Follow the user's three requested priorities.
      *   *Key Insight:* The "Division of Labour" objection is the biggest threat. I need to explain *why* it partially fails (because CEAs are used rhetorically to justify decisions across categories, not just within them).
      *   *Terminology:* Suggest "Model Uncertainty" instead of "Structural Uncertainty" if it aligns better with existing lit, but "Structural" is fine for a generalist audience. Mention "Worldview Diversification."
      *   *Proposal Tweak:* The "Trigger" needs to be an *observable indicator*, not just "evidence."

  5.  **Final Polish:**
      *   Check against negative constraints (no reading lists, no summaries).
      *   Ensure the voice matches the user's (intellectual, precise, slightly weary of the scene).

  *(Self-Correction during drafting)*: I initially thought about telling them to read Tetlock or Taleb. *Wait, constraint:* "no list of things to read." Okay, cut that. I need to integrate the concepts without citing.
  *Correction on Practice:* GiveWell *does* sometimes say "we can't compare this." But they still rank. The tension is between the *ranking* and the *incomparability*. The essay captures this well. I should validate that.
  *Correction on Section 2:* The "wide interval as proxy" argument is mathematically weak. A uniform distribution from 0 to infinity is still a distribution over *that variable*. It doesn't capture the variable's *absence*. I will support the author here but warn about the "Division of Labour" counter.

  6.  **Finalizing the Output Structure:**
      *   Introduction (acknowledge the draft's strength).
      *   Part 1: The Parameter/Structure Distinction (Section 2).
      *   Part 2: Misdescriptions of Practice.
      *   Part 3: Institutional Feasibility (Section 4).
      *   Conclusion (brief wrap-up).

  Let's write.
answer: |-
  This is a strong draft. It identifies a specific epistemic failure mode ("relocated humility") rather than rehashing the general "EA is too quantitative" critique. The prose is disciplined. Below is the critical read you requested, adhering to your three priorities.

  ### 1. The Parameter vs. Structure Distinction (Section 2)

  You are correct that the distinction is load-bearing, but you are vulnerable to the "division of labour" objection you anticipate. Here is the precise point of failure:

  **The Distinction:** Mathematically, you are right. A probability distribution over variable $X$ (parametric) cannot encode the possibility that variable $Y$ is the true driver of value (structural). A wide error bar on "lives saved per dollar" does not capture "lives saved via policy change per dollar" if the latter is not in the model. Treating structural uncertainty as extreme parametric uncertainty is a category error, not just a scaling error.

  **The Division of Labour Counter-Argument:** The strongest reply from an evaluator is not that their *model* captures structural uncertainty, but that their *process* separates it. In mature EA grantmaking (e.g., OpenPhil), there is a distinction between **Cause Prioritization** (structural) and **Intervention Prioritization** (parametric).
  *   *Structural work* happens at the cause level (e.g., "Is global health more tractable than AI governance?"). This is where "uncountable" benefits like institutional reform are weighed qualitatively.
  *   *Parametric work* happens within the chosen cause (e.g., "Which bednet distributor is best?").

  If your essay implies that a single CEA model is expected to rank bednets *against* advocacy campaigns directly, you are attacking a straw man. Most sophisticated allocators do not put those in the same spreadsheet. They allocate a portfolio percentage to Global Health and a percentage to Policy, then use CEA only within the buckets.

  **How to Fortify:** You must clarify that the error occurs when the *output* of the parametric model is used to justify the *structural* allocation. This happens frequently in public communications ("We fund X because it saves lives at $Y per life"), even if internal decision-making was more nuanced. The "relocated humility" is not in the internal decision, but in the public justification. The CEA becomes a rhetorical shield: "We have numbers, therefore we have considered the trade-offs." If you narrow your claim to **the rhetorical use of CEA to settle structural debates**, the division-of-labour objection collapses. The problem isn't that analysts *can't* do structural work; it's that the CEA output is allowed to silence it.

  ### 2. Misdescriptions of Practice

  You have been generous to the evaluators in Section 1, which weakens your attack in Section 2.

  **"Evaluators publish wide uncertainty ranges... frequently say... they cannot assess an intervention quantitatively at all."**
  *   **Correction:** This is often false for top-tier recommendations. GiveWell's top charities, for instance, are frequently presented with point estimates or relatively tight ranges in summary materials to facilitate donor action. While technical appendices contain caveats, the "ranking" itself is presented as decisive. The "humility" is often siloed in documents donors do not read.
  *   **Existing Mechanism:** You claim Section 4 is novel. It is not entirely. OpenPhilanthropy's **"Worldview Diversification"** is the exact conceptual machinery you are describing. They explicitly allocate funds across incompatible moral frameworks (e.g., utilitarianism vs. person-affecting views) because they cannot resolve the structural uncertainty.
  *   **The Gap:** However, Worldview Diversification is applied at the *fund* level, not the *intervention* level. Your proposal is novel because you are asking for this treatment at the level of specific grant recommendations.
  *   **Terminology:** In risk analysis and intelligence, this is known as **"Key Assumptions Check"** or **"Competing Hypotheses Analysis."** In regulatory impact assessments (e.g., EPA, OIRA), agencies must list "Unavoidable Adverse Effects." You should acknowledge these precedents to show you aren't inventing a new wheel, but proposing to mount it on a different vehicle.

  **"Caveats paragraph that already exists."**
  *   **Correction:** Often, what exists is a "Limitations" section, not an "Exclusion" section. A limitation says "Our data on X is noisy." An exclusion says "We did not measure X." Your proposal demands the latter. Most reports conflate the two. Pointing this out sharpens your critique.

  ### 3. Institutional Feasibility (Section 4)

  This is the weakest section of the draft, not because the idea is bad, but because the implementation details are optimistic.

  **Analyst Time & Cost:**
  *   **Reality:** Writing a rigorous exclusion statement is harder than running the model. It requires imagining counterfactual worlds. This is high-senior-level cognitive labour, not junior analyst work. If you mandate this for every intervention, you will bottleneck the pipeline.
  *   **Fix:** Suggest this applies only to **marginal comparisons** (e.g., "Why we chose A over B") or **top-tier rankings**, not every intervention screened.

  **Funder Pressure:**
  *   **Reality:** A funder asking for a number by Thursday does not want a list of reasons why the number might be meaningless. This proposal creates reputational risk. "GiveWell recommends X, but admits they didn't measure political stability" is a headline a critic can use to say "GiveWell doesn't care about political stability."
  *   **Mitigation:** You need to argue that this *reduces* long-term reputational risk by preventing "gotcha" moments later. But in the short term, it is a hard sell.

  **The Trigger Device (4b):**
  *   **Coherence:** "The sort of evidence that... would reopen the ranking" is excellent in theory but fragile in practice.
  *   **Failure Mode:** Analysts will define triggers that are either too vague ("If conditions change") or too specific ("If cost per net rises above $5"). The latter is parametric, not structural.
  *   **Requirement:** For a trigger to be structural, it must be an **observable indicator of a missing variable**. Example: "If the local government passes Legislation X, the advocacy pathway becomes viable, and this ranking must be reviewed."
  *   **Precedent:** In clinical trials, this is a **"Stopping Rule."** In finance, it is a **"Stop-Loss"** or **"Rebalancing Trigger."** These work because they are automated. Your trigger requires human judgment ("If evidence appears...").
  *   **Recommendation:** Change "trigger" to **"Review Condition."** Make it time-bound *or* event-bound. "This ranking expires in 24 months unless Advocacy Metric Z is published." This forces the register to be alive, not a graveyard of old caveats.

  **Humility Theatre:**
  *   You identify this risk but underestimate it. Analysts are incentivized to look thorough, not to admit blindness. A mandatory list will become a checklist of trivialities ("We did not measure currency fluctuation") to protect against the one big omission ("We did not measure regime collapse").
  *   **Fix:** The "Comparative" requirement in 4(a) is your safeguard here. Emphasize that. The analyst must argue why the exclusion doesn't change the *ordering*. This forces them to engage with the alternative, not just list absences.

  ### Summary of Suggested Revisions

  1.  **Refine the Target:** Acknowledge the Cause vs. Intervention division of labour, but argue that CEA is frequently used *rhetorically* to bridge that gap illegitimately. That is where the "relocated humility" lives.
  2.  **Sharpen the Practice Critique:** Stop saying evaluators "frequently say they cannot assess." Say they "assess quantitatively where possible and present the result as decisive, silencing the qualitative uncertainty."
  3.  **Ground the Proposal:** Reference "Worldview Diversification" as the existing analog. Position your proposal as "downscaling worldview diversification to the intervention level."
  4.  **Harden the Trigger:** Make the trigger an observable indicator or a time-bound expiration, not just "evidence."
  5.  **Limit Scope:** Apply the requirement to *comparative rankings*, not absolute assessments. It is only in the choice between A and B that the exclusion matters.

  The core insight—that error bars are parametric and cannot swallow structural blind spots—is correct and under-discussed. If you tighten the institutional analysis, this will land well with your audience.
