  ROOT: Large-scale political orders rise and collapse; over long stretches, population and stored technique increase.

  Q1: Is this pattern a law of the events themselves, or an artifact of where you choose to start and stop the clock?
      +-- Artifact --> LEAF: Deflationary View. (Awkward commitment: Your own analysis is just another story you tell yourself.)
      +-- Law --> Q2

  Q2: Is the primary driver the growth of a permanent stock (knowledge/tech) or the spending/straining of a coordinating capacity (solidity/complexity)?
      +-- Growth of Stock --> Q3
      +-- Spending Capacity --> Q5

  Q3: Does this stock allow the species to escape political collapse permanently?
      +-- Yes --> LEAF: Progress/Stage View. (Awkward commitment: Eventually, politics becomes unnecessary or solved.)
      +-- No --> Q4

  Q4: Does the accumulation raise the level at which politics cycles, or merely change the background conditions?
      +-- Raises Level --> LEAF: Spiral View. (Awkward commitment: Similarity is vague enough to fit any data.)
      +-- Background Only --> LEAF: Compartmentalized View. (Awkward commitment: Technique saves nothing of the soul.)
      [NOTE: Spiral and Compartmentalized are structurally identical except for the claim of "height"; empirical distinction is difficult.]

  Q5: What is the unit that spends the capacity?
      +-- Regime/Constitution --> Q6
      +-- Culture/People/Dynasty --> Q7
      +-- Whole Species/System --> LEAF: Cost-of-Complexity View. (Awkward commitment: There is no rescue, only a final simplification.)

  Q6: Does the cycle return to the *exact* same starting form?
      +-- Yes --> LEAF: Polybian Constitutional Rotation. (Awkward commitment: Human nature never learns anything from failure.)
      +-- No --> LEAF: Regime-Spiral View. (Awkward commitment: Regimes evolve without changing their essence.)

  Q7: Does the unit have a fixed biological-like lifespan regardless of choices?
      +-- Yes --> LEAF: Spenglerian Morphology. (Awkward commitment: Human creativity is just pollen on a predetermined plant.)
      +-- No (Depends on Response) --> Q8

  Q8: Does the unit require an external, fresh group to succeed it when it fails?
      +-- No (Internal Renewal) --> LEAF: Toynbeeian Challenge-and-Response. (Awkward commitment: A creative minority can emerge from within a hardened shell.)
      +-- Yes (Needs Outside) --> Q9

  Q9: Must the successor be a human people?
      +-- No --> LEAF: Post-Human Inheritance. (Awkward commitment: Something non-human could inherit our coordination problems.)
      +-- Yes --> Q10

  Q10: If the whole planet is one system with no outside frontier, does the mechanism break or merely stop?
      +-- Breaks (Refuted) --> LEAF: Closure-Refuted View. (Awkward commitment: The theory only works on a frontier.)
      +-- Stops (Last Cycle) --> LEAF: Closure-Last Cycle View. (Awkward commitment: The present system is the last of its kind.)
      [NOTE: Closure-Last Cycle and standard Ibn Khaldunian views share the same engine; they differ only on whether the frontier currently exists.]
