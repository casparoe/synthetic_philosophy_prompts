  While breath still fills the chest the dark waits there
  Outside the door and cannot touch the lamp
  That burns within the room where you remain
  Alive to feel the warmth upon your skin
  Yet when the flame expires the guest departs
  And leaves no eyes to see the end arrive
  Nor any hand to feel the cold approach

  But think upon the harvest lost to frost.
  The ledger closes with a debt unpaid.
  The empty chair awaits a guest who won't.
  The sun will rise on days you cannot see.
  The stillness marks the cost of ended song.
  The promised bread is stolen by the grave.
  So silence holds the question in its mouth.

  Commentary on the formal choices

  The shift from enjambment to end-stopping mirrors the philosophical transition from continuity to discontinuity. In the first stanza, the run-on lines mimic the continuous flow of existence required for the Epicurean claim: harm must coincide with a subject. The syntax refuses to pause, suggesting that where life flows, death is absent, and where death arrives, the syntax of life has ceased. There is no break where harm can land. Conversely, the second stanza's rigid end-stops create discrete boundaries, like entries in a ledger or days lost. Each line acts as a closed account, emphasizing the specific goods severed by death. This formalizes the deprivation account's focus on distinct missed opportunities. Simplifications were necessary for meter; the Epicurean view ignores psychological anticipation of death, while the deprivation account treats future goods as definite rather than probabilistic. The unresolved final period acknowledges the stalemate between presence and loss. This structural contrast embodies the debate.
