  I recommend we vote to award the degree this Friday. The operative decision is to approve. We should accept the proposed sensitivity test as a provisional satisfaction of Section 4(b), noting explicitly in the minutes that this interpretation is specific to cases involving sealed commercial models. This allows us to recognise the candidate's achievement without formally amending the statute mid-process. We must reach a decision by the end of the session to prevent the loss of the candidate to industry. Please review this before the session. We should prioritise recognising the empirical success while flagging the statutory tension for future review.

  **Facts**

  The candidate employed an automated search using a third-party surrogate model with sealed internal weights to identify a promising oxide family. Twenty-three of the top thirty ranked candidates were synthesised by independent laboratories; twenty-one exhibited the predicted catalytic properties. Subsequent predictions show a similar success rate. The candidate cannot explain the mechanistic reason for the ranking, offering only the pipeline and outcomes. One examiner recommends the degree unqualified; the other argues we would be certifying an oracle. The Chair notes the candidate may leave for industry if we hesitate.

  **What the carriage clause is for**

  Section 4(b) requires the candidate to carry a competent examiner to the result by reasoning, not by pointing at an output. This exists to ensure the degree certifies a capacity for independent scientific judgement, not merely technical proficiency. It guarantees that the candidate owns the intellectual path to the conclusion. If we award a doctorate where the reasoning is inaccessible, we risk decoupling the credential from the ability to defend the science. The clause protects the university's standard from becoming a validation service for external tools. It ensures that when we say Doctor, we mean someone who can justify their claims through logic accessible to peers, not just someone who can operate a successful instrument.

  **Why a reliable route to true results does not by itself satisfy it**

  A reliable route to true results does not equal scientific understanding. My colleague in the reading group cited Plato: a man with a true belief about the road to Larissa gets you there as reliably as one who knows the way. But if the road changes, only the knower can adapt. Science requires knowing why the path holds. Here, the model works, but the candidate cannot say why. If the oxide family behaves differently under new conditions, she lacks the reasoning to predict the failure. Reliability without explanation is engineering utility, not doctoral knowledge. We certify scientists who can navigate the unknown, not just follow a reliable map they cannot read. The Plato point is right about utility, but unhelpful for certification. We need knowledge, not just true belief, to extend the science beyond the current data set. This distinction matters because a doctorate promises future contribution, not just past accuracy.

  **The strongest case for the side you are not recommending**

  The case for rejecting or deferring rests on the plain text of the statute. The candidate cannot carry us to the result by reasoning because the reasoning is locked behind a commercial licence. Accepting a sensitivity test—asking what would change the result—is a quiet repeal of the carriage clause. It substitutes hypothetical troubleshooting for actual mechanistic understanding. If we approve this, we set a precedent that commercial black boxes satisfy our reasoning requirement. This invites future candidates to outsource their intellect to proprietary software. The examiner who calls this an oracle is correct: we would be certifying the tool's vendor, not the student. Upholding the statute protects the degree's long-term value against the encroachment of unexplainable automation. It matters that the opacity is commercial, not natural; we should not let licence agreements dictate our academic standards. Allowing this sets a dangerous boundary where profit motives limit academic scrutiny.

  **Conditions, timeline, and what this vote would not settle**

  If we vote to approve, we must record that this does not establish a general precedent for unexplained models. The sensitivity test must be documented in the final library copy. We should schedule a statutory review committee by next term to clarify Section 4(b) for AI-assisted research. This vote settles only this candidate's status; it does not resolve the broader tension between commercial tools and academic transparency. We must ensure the candidate knows her explanation of limitations is now part of her permanent record. The statute remains in force for future cases until formally amended. The timeline for this review is critically important.
