      *   *First-Person Exclusivity:* A computer screen is public (third-person). Consciousness is private (first-person). You can't see my "desktop."
      *   *Design Intention:* Software is designed by engineers for a purpose. Brains evolved. There is no "engineer" intending the interface to hide complexity for the sake of a user; evolution selects for fitness, not necessarily truth or usability in the computational sense.
