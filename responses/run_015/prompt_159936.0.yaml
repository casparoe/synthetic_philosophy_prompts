answer: |-
  **Notes on the Positions**

  *   **Strongest Objection to Mara (Disposition Design):** The *Self-Undermining Objection*. If the sole reason to adopt a disposition is instrumental (to get the ride), the agent knows she will want to discard it once the ride is secured. Can one genuinely adopt a disposition for reasons one knows will vanish upon success? It risks collapsing into self-deception.
  *   **Strongest Objection to Ellis (Plan/Intention):** The *Empty Signal Objection*. In the desert variant with no external scaffolding (escrow, reputation), a "plan" is just a mental state. If the driver can read the rule governing that state, a plan that resolves to "maximize utility at t2" fails the adversarial readout. Mere intention without dispositional stickiness is cheap talk.
  *   **Mara's Concession:** She must admit that adopting the disposition *for the sake of the ride* is unstable; the disposition likely requires non-instrumental grounds to be credible.
  *   **Ellis's Concession:** He must admit that without some dispositional inertia, a "plan" is merely a prediction of future behavior that updates with incentives, which the driver will detect.

  ***

  The highway was a ribbon of charcoal unspooling into the Nevada dark. It was two in the morning. The heater hummed, fighting the desert cold. We had passed a figure standing by a stalled sedan an hour back, outside Tonopah. Neither of us had slowed down.

  "You didn't pick him up," Mara said. She was staring out the passenger window, watching the reflectors blink past.

  "Because I couldn't verify his rule," I said. "If I stop, I need to know he won't shoot me once he's in the cab. Or in your terms, that he'll pay when the meter stops running."

  "But you didn't even check. That's the point. In the Readout case, the driver *can* check. He runs the probes. He asks: *'If I drop you off and die immediately, do you still pay?'*"

  "And if the hitchhiker says yes, she's lying," I said. "Because she knows she won't. Rationality doesn't require you to burn money for no reason. Once you're in town, the money is yours. Keeping it is the only rational move."

  Mara turned in her seat, knee pulled up. "That's single-tier thinking. It's why you fail the readout. The driver isn't asking what you'll do; he's inspecting the source code. If your rule is *'Maximize utility at every node,'* he sees it. He sees that in the probe cases—where the ride is over and payment is useless—your rule outputs *'Keep Money.'* So he doesn't unlock the door."

  "So the hitchhiker has to lie about her code?"

  "No. She has to *be* different. She needs a rule that says *'Pay if promised,'* full stop. Even in the probe cases. Even when it's waste."

  "That's irrationality," I said. "You're arguing it's rational to design yourself to act irrationally. To throw away utility in the probe cases just to convince the driver you'll throw it away in the real case."

  "It's not a defect. It's a premium. Like an insurance deductible. You pay the waste in the counterfactual probes to buy the credibility in the actual world. The disposition has to be coarse enough to misfire. If it's finely targeted—*'Pay only when it helps'*—the driver's adversarial scan sees the conditioning. He sees the maximization hiding inside the promise."

  I tapped the steering wheel. "Okay. Say I buy the two-tier view. Upper tier: design the self. Lower tier: act on the design. Here's the problem. Why adopt the design?"

  "To get the ride."

  "But once you have the ride, the reason dissolves. You're in town. The driver is dead or gone. The probe cases are never actualized. You're left holding a rule that tells you to burn cash for no reason. If you're rational enough to adopt the rule for the ride, you're rational enough to shed it once the ride is done. The driver knows this. He knows your adoption is instrumental. So he knows you'll patch the bug once you're safe."

  Mara was quiet for a moment. The road noise filled the gap. "So you need to adopt it for reasons other than the ride."

  "Which you don't have. You're stranded in the desert. The only leverage is the ride."

  "Then you cultivate the disposition over time. You become the kind of person who keeps promises."

  "In the desert? With a stranger?" I shook my head. "You're describing self-deception. You have to convince yourself you care about promise-keeping intrinsically, when you really care about survival. That's not rationality, Mara. That's breaking your own brain."

  "Better a broken brain than a dead body."

  "Or," I said, "you stick to the plan. Not because you're disposed to, but because you intend to. Intention has normative stickiness. I decide at t1 to pay at t2. At t2, the fact that I decided at t1 is itself a reason to act. I don't need a disposition that misfires. I just need to honor the intention."

  Mara laughed, a short, sharp sound. "What is the intention *made of*, Ellis? In the desert. No escrow. No reputation. No third party. It's just neurons. If the driver scans your rule for forming intentions, he sees: *'Form intention to pay if it secures ride.'* He runs the probe. *'Does this intention persist when the ride is secured?'* If your theory of intention is rational, it says *'No.'* Because the reason for the intention was the ride."

  "So intention is just disposition with better branding?"

  "Without the branding, it's just a prediction. And predictions update. If I predict I'll pay, but I also know I'm a utility maximizer, I predict I won't pay. The driver sees the contradiction. He sees that your 'plan' lacks the hardware to execute against your own best judgment at t2."

  I tightened my grip on the wheel. "So you're saying rationality requires me to install a glitch? A rule that forces me to lose utility in the probe cases?"

  "I'm saying rationality requires you to be the sort of agent whose rules aren't transparently opportunistic. The waste isn't a glitch. It's the proof of work. If you only pay when it helps, you're just a maximizer pretending. If you pay when it hurts, you're a promise-keeper. The driver buys the latter."

  "But how do you get there? If the only reason to be a promise-keeper is the ride, you're still a maximizer pretending. You're just maximizing over a longer timeframe."

  Mara looked out at the dark again. "Maybe you can't get there if the ride is the only reason. Maybe the Readout case proves you can't bootstrap credibility from pure instrumental rationality. You need the disposition to be real. Which means... yeah. You need to have adopted it for reasons other than the ride."

  "And if you haven't?"

  "Then you don't get the ride. You stay in the desert."

  "That feels like a concession," I said.

  "It's a boundary condition. Rationality can't create value out of nothing. If you haven't built the character beforehand, you can't fabricate it at the gate."

  "But then your theory doesn't help the agent in the case. It just says 'you should have been better.'" I signaled for a lane change, though there were no other cars. "Whereas my view says: Stick to the plan. The normativity of intention bridges the gap. You don't need to be a different person. You just need to respect your own past agency."

  "And when the driver scans the rule for *respecting past agency*?" Mara asked. "He sees the conditional. *'Respect past agency unless it costs too much.'* He probes the cost. He sees you'll drop it when the money matters. You're back to square one. Sticking to the plan *is* a disposition. It's a disposition to treat past decisions as binding. If that disposition doesn't fire in the probe cases—where respecting the past costs money and gains nothing—it fails the readout."

  I sighed. "So sticking to an intention is just a disposition with better branding."

  "It's a disposition that misfires," she corrected. "It costs you in the probes. That's the only way it works."

  "So rationality demands I accept a rule that loses me money for no reason."

  "Rationality demands I accept a rule that gets me the ride. The loss is the price."

  "But who pays the price? The you at t2. The you at t1 gets the benefit. Why does t2 agree?"

  "Because t2 is the same person as t1."

  "That's metaphysics, not rational choice."

  Mara rubbed her temples. "Maybe. Or maybe it's the only way the math holds. If you separate t1 and t2, you lose. If you bind them, you pay the premium, but you get the ride."

  "And if you can't bind them? If you know, at t1, that t2 will see the payment as waste?"

  "Then you don't get in the car."

  We drove in silence for a mile. The white lines rushed under the hood.

  "So," I said finally. "You're admitting that if the only reason you have is the ride, you can't adopt the disposition. You need some prior commitment to promise-keeping that isn't about the ride."

  "I'm saying the instrumental reason isn't enough to sustain the disposition against the readout. The driver sees the instrumentality. He knows you'll drop it. So yes. You need the disposition to be grounded in something else. Virtue. Identity. Whatever."

  "And if you don't have it?"

  "Then you're stuck. Rationality can't save you from being the wrong kind of agent."

  "And my view?" I asked. "Plan plus stickiness."

  "Stickiness is just disposition," she said. "But... I'll grant this. If you can't change your disposition, the plan is the only lever you have. Even if it's weak. It's better than nothing."

  "It's not weak if intention has normative force."

  "It's weak against an adversarial readout," she said. "But maybe the readout is too strong. Maybe no one can actually inspect the rule that finely."

  "Maybe." I looked at the odometer. "We're coming up on the turnoff."

  "Yeah." Mara shifted in her seat. "So. If we see another hitchhiker?"

  "I still won't stop," I said. "I can't verify their rule."

  "And I wouldn't pick them up," she said. "Because I'd know they're lying about the probes."

  "Unless they're actually irrational."

  "Unless they're actually irrational," she agreed. "Which is the only rational thing to be."

  "That makes no sense."

  "It makes sense on the road."

  She looked out at the dark shoulder. There was nothing there but scrub brush and the occasional bleached bone. The engine droned on, steady and indifferent.

  "Keep driving," she said. "We're not the right agents for this case."

  "No," I said. "I guess we're not."

  I kept my foot on the gas. The town was still an hour away, and the desert stretched out on both sides, full of people who couldn't prove they'd pay.

  ***

  **Analysis**

  Ellis has the better of the exchange because he successfully forces Mara to admit that instrumental rationality cannot bootstrap the required disposition *ex nihilo*; if the only reason to adopt the rule is the ride, the rule is unstable under scrutiny. The load-bearing line is Mara's concession: "Maybe the Readout case proves you can't bootstrap credibility from pure instrumental rationality."
