      *   **Wait, re-reading the prompt's constraint:** "no capitalist class privately appropriates surplus value." This is the tricky bit. If there's no capitalist appropriating surplus, is there exploitation in the Marxist sense? Marx defines exploitation structurally via the extraction of surplus labour. If the surplus is shared, is it exploitation?
