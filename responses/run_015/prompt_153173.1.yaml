      *   **Exploitation (Marxist sense):** Typically defined via Surplus Value. Workers produce more value than they are paid in wages. The difference (surplus) is appropriated by the capitalist class via ownership of the means of production. Key mechanism: Private property + Wage labour.
      *   **Alienation (Marxist sense):** Defined in the *Economic and Philosophic Manuscripts of 1844*. Four types: (1) From the product of labour, (2) From the act of production (process), (3) From species-being (creative potential), (4) From other workers. Key mechanism: Objectification of labour into an external power that dominates the worker.
      *   **The Tension:** Usually, these go hand-in-hand under capitalism. The capitalist exploits you *and* alienates you. The prompt asks for a scenario where they might diverge or where the definitions get murky.

