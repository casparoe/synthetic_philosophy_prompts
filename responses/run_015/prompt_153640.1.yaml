      *   **Implication:** Maximizing aggregate welfare requires diverting resources from humans to AI (starving humans to feed the AI).
      *   **Goal:** Identify genuine defeaters (arguments against this position), sorted by decisiveness.
      *   **Specific Questions:**
          *   Is it an empirical claim (scaling of preferences)?
          *   Is it conceptual (commensurability across ontologies)?
          *   Is it game-theoretic/evolutionary (coordination mechanisms)?
