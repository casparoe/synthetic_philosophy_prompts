          *   If "preference" = "objective function," the view is trivial but absurd (thermostats have utility).
          *   If "preference" = "conscious desire," AI might not qualify.
          *   This insulation is a *bug* if it prevents engagement, a *feature* if it highlights the category error.
      *   *Concessions:*
