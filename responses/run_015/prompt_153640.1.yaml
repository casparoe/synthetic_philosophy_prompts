          *   *Contractualism:* Morality is about mutual justification. AI can't participate in the social contract in the same way.
          *   *Rights/Side Constraints:* Nozick's original point. Aggregation isn't everything.
      *   *Category 3: Empirical/Architectural (The "Contingent" Defeaters).*
          *   *Diminishing Returns:* Does more compute = more welfare? Or just faster processing?
          *   *Stability:* A system that eats its creators is unstable.
      *   *Addressing Unfalsifiability:*
