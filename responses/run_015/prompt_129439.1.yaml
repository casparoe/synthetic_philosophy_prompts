  A professional value judgment is legitimate only if it is justified by appeal to the institution's explicit mission or a universalizable moral framework, unless the decision imposes costs exclusively upon the agent's own career capital.

  This principle distinguishes bias from preference by demanding that justifications be externalizable rather than idiosyncratic, while carving out a protected sphere for personal integrity when the agent alone bears the consequence. It categorizes the admissions officer, the public-health official, and the first curator as biased because each imposes a decision on others—applicants, the public, and the audience—based on internal states (unexamined affinity, poetic resonance, visceral distaste) that cannot be articulated as serving the institution's functional goals or universal moral duties. The admissions officer fails because "affinity" is not a mission criterion; the public-health official fails because "poetic compellingness" overrides the fiduciary metric of epidemiological outcomes; the first curator fails because personal taste supersedes institutional purpose.

  Conversely, the principle vindicates the climate researcher because her aesthetic objection to air travel restricts only her own professional reach, making personal integrity a sufficient justification when the cost is self-regarding. It validates the judge because "human dignity" functions as a universalizable moral framework applicable to sentencing, distinct from the private religious formation that may have inspired it. It saves the second curator because the decision is anchored in the "institutional purpose" of the gallery, satisfying the mission-alignment requirement.

  Applied to the unsettled case, the AI-safety reviewer must be classified as biased, aligning her with the public-health official rather than the climate researcher. Like the health official, she imposes a cost on society (rejecting a policing tool) based on an internal aesthetic judgment ("metaphysically ugly") while ignoring empirical evidence (disparate-impact studies), failing both the mission-alignment and universal-moral tests. Unlike the climate researcher, she does not bear the cost herself. Coherence requires no overturning of the six settled judgments, provided the distinction between self-regarding and other-regarding costs is rigorously maintained; however, this coherence hangs precariously on the classification of "human dignity" as universalizable rather than aesthetic, meaning the judge's verdict would require overturning if dignity were deemed merely a subjective moral taste.
