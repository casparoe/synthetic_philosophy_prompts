  **TO:** Compensation Design Panel and City Council
  **FROM:** Panel Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Riverbend Buyout Valuation Formula

  **Bottom Line Recommendation**

  The Panel should adopt a Replacement-and-Disturbance formula for the Riverbend voluntary buyout. This approach prioritizes the restoration of household welfare over strict adherence to depressed market prices. The resolution must specify the following concrete terms:

  1.  **Owner-Occupants:** Offers shall equal the cost of purchasing a comparable home outside the designated floodplain, plus a 15% disturbance allowance and full reimbursement for moving costs. Where the current structure includes physical adaptations for a disability, the offer must include the verified cost of replicating those modifications in the replacement unit.
  2.  **Renters:** The 44 renter households shall receive a payment equivalent to the owner disturbance allowance, plus six months of fair market rent for a comparable unit outside the floodplain and coverage for security deposits and moving expenses. This ensures renters, who hold no equity to liquidate, are not excluded from the resilience program.
  3.  **Stated Minimums:** Where a household's stated minimum acceptance figure exceeds the formula offer, the case shall be flagged for a confidential review by the Panel. We will not automatically match higher figures to avoid moral hazard, but we acknowledge the stable gap identified by the community group as evidence of unpriced losses.
  4.  **Framing:** All offer letters shall present the payment as a single lump sum labeled "Relocation Assistance," avoiding distinctions between "market value" and "grants" to mitigate the framing effects observed in the pilot.

  **Theory of Value and Welfare**

  This formula presupposes that public compensation should measure welfare as the *capability to maintain a functioning life*, not as the *revealed preference of a constrained market*. The market-anchored bloc argues that observed prices reflect what residents value. However, in Riverbend, observed prices reflect what residents can afford. The low property values record the shape of the opportunity set—constrained credit, tight housing supply, and historical disinvestment—rather than the true value of the home to the occupant.

  For a public resilience program, adopting the market price as the definition of value reinforces existing inequalities. A renter's "choice" to stay is often a lack of options, not a preference for flood risk. A disabled resident's adapted home represents a sunk cost of accessibility that the market does not price liquidly. If we treat welfare as merely what the market pays, we validate the notion that a low-income household's loss is worth less than a wealthy household's loss. Therefore, we must measure value as the cost of making the household whole in a safe location. This is not a general theory of rational choice; it is a specific standard for public restitution. We are not buying a commodity; we are mitigating a public risk while respecting the dignity of those who bear the brunt of it. The market formula treats the grant as a transaction; this formula treats it as a remedy.

  **The Case for the Market-Anchored Approach**

  The strongest argument for the rejected market-anchored formula is fiscal discipline and respect for agency. Defenders argue that observed behavior is the only non-arbitrary evidence available. Households chose to live in Riverbend; they chose whether to buy insurance; they chose whether to move after the last flood. To pay above market price is to assume the government knows what residents value better than they do. Furthermore, within the market bloc, some argue correctly that even if market price does not measure welfare perfectly, it is a useful predictive device for budgeting. It prevents arbitrary overpayment and ensures the grant covers all 118 households without exhausting funds.

  This view gets right that public funds are limited and that surveys can invite strategic inflation of values. It correctly identifies that a survey-based valuation risks becoming a negotiation rather than a measurement. However, it loses on the specific ethics of a voluntary buyout. If the offer is below the threshold required to relocate safely, the program fails its resilience goal. The "predictive" value of the market price is low if the take-up rate is zero because the offers are insultingly low relative to the cost of leaving. The market formula protects the treasury but risks the mission. It assumes the market is free when the residents' constraints prove it is not.

  **Implementation and Review**

  To meet the three-week deadline, the following steps must occur immediately:

  1.  **Step One (Days 1-5):** The Panel will vote to adopt the Replacement-and-Disturbance framework. The Staff Economist will generate a lookup table for "comparable housing costs" in designated safe zones to ensure consistency across the 74 owner-occupied households. *Responsibility: Panel Chair and Staff Economist.*
  2.  **Step Two (Days 6-14):** City Attorney will draft the resolution language, specifically codifying the renter payment structure and the hardship review process for high stated minimums. *Responsibility: City Attorney's Office.*
  3.  **Step Three (Days 15-21):** Staff will finalize the offer letter templates, ensuring neutral framing, and prepare the mailing list for the 118 households. *Responsibility: Program Manager.*

  **Evidence for Revisiting**

  We should revisit this formula in eighteen months based on two specific metrics. First, the take-up rate among owner-occupants versus renters. If renter participation is significantly lower than owner participation, the disturbance payment was insufficient to overcome lease barriers. Second, we should run a post-hoc behavioral check: survey participating households on whether they actually secured comparable housing. If households take the buyout but remain in the floodplain or move to substandard housing, our definition of "replacement" was flawed. Additionally, if the hardship review queue exceeds 20% of applications, it indicates the base formula systematically underestimates the community's stated minimums, requiring a baseline adjustment.

  This approach balances fiscal responsibility with the ethical obligation to ensure that resilience does not come at the cost of resident welfare. By acknowledging that market prices capture constraints rather than true value, we ensure the grant achieves its purpose: moving people to safety, not just acquiring property.
