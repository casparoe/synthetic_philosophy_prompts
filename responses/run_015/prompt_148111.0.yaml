      *   *Primitive Identity:* If the user wants to keep (9) (substantive dispute), relying *too* heavily on primitive identity might make the view mysterious, but it doesn't make it verbal. However, relying on continuity (6) is more natural. The key is that continuity relates *wholly present objects*, not *parts*.
