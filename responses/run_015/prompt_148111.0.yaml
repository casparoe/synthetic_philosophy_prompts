          3.  Ground must be primitive or essential properties (no temporal parts).
          4.  Case: Total gradual replacement (Ship of Theseus style). No shared parts, properties change.
          5.  If identical, ground must be shared parts (none) or invariant properties (none).
          6.  Dilemma: Deny survival OR admit continuity of form/function suffices.
          7.  If continuity suffices, "whole object" is just a stage in a continuity chain = Perdurantism (4D worm).
          8.  Conclusion: Endurantism is false or indistinguishable from Perdurantism.
