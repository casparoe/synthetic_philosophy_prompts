answer: |-
  To turn a tale to stone you need the **ash**
  Distinct and burnt within the specific **layer**
  And not just any heroic borrowed **name**
  That survives only in a later **song**
  You need a specific and risky **date**
  Where finding nothing disproves the **king**

  Where Priam might have ruled as actual **king**
  Or at least walls dissolved into the **ash**
  A century to hold the solid **date**
  Seven cities stacked in every **layer**
  While Homer kept the memory in **song**
  And gave the victors every glorious **name**

  But wait until you cannot fix the **name**
  A warlord never crowned as any **king**
  Who lives only inside a romantic **song**
  With no burnt city turning into **ash**
  No conflict to establish firm **date**
  Just mist above the strata and the **layer**

  We search the Sinai for a distinct **layer**
  Of footprints or a pharaoh's listed **name**
  Yet archaeology rejects the **date**
  No record of a slave-host or a **king**
  But find no cities turned to smoke and **ash**
  The bible holds the narrative in **song**

  Then history dissolves back into **song**
  But where the shovel might miss the **layer**
  If nothing rises from the silent **ash**
  Or validate the burden of the **name**
  And thus destroy the legend of the **king**
  It is not proof that sets the final **date**

  Arthur floats without a fixed **date**
  Troy sings because the fire left more than **song**
  One waits for evidence of any **king**
  One sits firmly in a destruction **layer**
  Exodus lacks a pharaoh's matching **name**
  One walks through desert leaving only **ash**

  To pin the **ash** and **name** within the **layer**
  Is risking every **date** to save the **song**
  That risk alone inaugurates the **king**

  ***

  The biggest liberty is "Seven cities stacked" in stanza two; Schliemann found nine, and Troy VIIa is the specific candidate, not a neat stack of seven. The line I'd defend hardest is "archaeology rejects the date" in stanza four; while consensus denies a mass Exodus, some argue for a smaller group or cultural memory, though no evidence pins it. Troy has crossed into history because it can be falsified; Arthur remains legend because he cannot; Exodus is a refuted claim because it was pinned and failed.
