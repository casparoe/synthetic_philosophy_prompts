      *   *Conflict:* The philosophers who oppose Parfit (Animalists, Soul Theorists) believe in a "Further Fact." DBs *cannot* model a "Further Fact" because a DB is defined entirely by its state and history.
      *   *Conclusion:* Engineering practice aligns with Parfit. The residue isn't a failure of engineering; it's the absence of the "Soul/substrate" hypothesis in engineering. If you believe there's *no* soul, engineering settles it. If you believe there *is* a soul, engineering vocabulary is insufficient.

