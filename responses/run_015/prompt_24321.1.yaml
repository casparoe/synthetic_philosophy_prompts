      *   **Problem:** Stuck on Derek Parfit's Teletransporter thought experiment (personal identity vs. psychological continuity).
      *   **Task:**
          1.  Restate the philosophical debate using database engineering vocabulary (faithfully, flagging assumptions).
          2.  Provide a "Residue Report" (what maps cleanly, what distorts, what has no expression).
