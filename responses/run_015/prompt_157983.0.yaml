answer: |-
  Here is the cold water. You need to pour it on her now.

  **The Break Point:** Step **(4)** is the lie.
  **The Equivocation:** **Static Output vs. Dynamic Capacity** (often called *Counterfactual Sensitivity*).

  ### Why Step (4) Breaks
  She claims the Stream's output is "indistinguishable from a single author's behaviour." This is only true if you define "behavior" as **a static log of text**.

  If you define "behavior" as **a system's capacity to respond to a changing environment**, the Stream is distinguishable immediately.
  *   **Real Mind:** If you interrupt a novelist mid-sentence and ask, "Why did you use that word?", she can stop, process, and answer. Her behavior is *modally robust*—she could have done otherwise.
  *   **The Stream:** If you interrupt the Million-Mind Stream, it cannot answer. The million people are not causally integrated in real-time. They are typing pre-determined or locally-decided words into a void. They cannot pivot as a unified system.

  The Stream isn't behaving like a mind; it's behaving like a **recording** of a mind. A record player produces sound indistinguishable from a singer, but we don't grant the record player consciousness. Why? Because the record player lacks the internal causal structure to *generate* the song in response to the world.

  ### The Committed Position
  **Save the "One Mind Per Skull" intuition. Kill the Behavioral Criterion.**

  You asked me to choose. The intuition that there is a unified subject (you, inside your head) is the bedrock of experience. The Behavioral Criterion is just a tool for measuring it. When the tool breaks the thing it measures, you throw out the tool.

  If she accepts the Behavioral Criterion over the Unity of Mind, she has to admit that a million disconnected strangers typing slowly constitute a single conscious god-entity. That is absurd. It dissolves the very "self" she is using to make the argument.

  ### The Cost to Her Argument
  This is where the scene gets good. To fix the logic, **she has to sacrifice Premise (1).**

  *   **Premise (1):** "The only evidence we ever actually have for another mind is behavioural."
  *   **The Reality:** If Step (4) fails, it proves that behavior *alone* is not enough. We need evidence of **internal causal integration**.

  If she admits this, she undermines her entire opening gambit. She came to the party to argue that we can't know what's inside, only what comes out. But to save her "One Mind" intuition, she has to admit that **what's inside matters.** She has to admit that there *is* a "peek inside" available, not via magic, but via structural analysis.

  ### Why It Looked Okay (The Drunk Logic)
  Alcohol narrows focus. She is looking at the **product** (the novel, the grief expressed in text) and ignoring the **process** (the milliseconds of synaptic integration required to produce that grief *in response* to a loss).

  She sees the symmetry: *Neurons make a Human* :: *People make a Stream*.
  She misses the asymmetry: *Neurons are wired for speed and unity* :: *People are wired for latency and separation.*

  ### How to Play the Scene
  She thinks she's cornered her opponent with the "Million-Mind" trap. She expects them to squirm. Instead, have the opponent (or a sober friend) point out that the Stream can't answer a question asked *right now*.

  Watch her face fall. She realizes that to save her own consciousness from being dissolved into a million strangers, she has to admit that **structure counts**. And if structure counts, then her hardline behaviorism (Premise 1) is dead.

  She wanted to prove that behavior is all that matters. Instead, she proved that behavior is nothing without the machinery to back it up. She's not just pinned; she's checkmated by her own analogy. Have her take a drink, stare at the crowd, and realize she can't tell if *they* are integrated or just a million people pretending to be a party. That's the existential hangover.
