prompt: |-
  I’ve been trying to get a better handle on Bertrand’s paradox and the principle of indifference, but I keep getting stuck on the subtle difference between “uniform over outcomes” and “uniform over parameters,” and how that is supposed to undermine indifference. I know the standard needle-in-a-circle setup, but I want something less folklore-y: can you explain the conceptual issue in terms of invariance under reparameterizaton? Like, if we assign a uniform prior over the angle of the needle versus a uniform prior over the distance of its midpoint from the center, why do those correspond to different probability measures on the same event, and why is that a real problem for the principle of indifference rather than just a sloppy way of setting up the experiment?

  I’d also like to understand whether the resolution is basically “be more careful with your sample space,” or whether there’s a deeper point about symmetry groups, Haar measure, and why some priors are invariant under certain transformations while others aren’t. I’m not asking for a full measure-theoretic treatment, but I’d like enough detail that I can see why the paradox isn’t just a geometry mistake, and why maximum entropy might or might not save the principle. If there’s a clean way to state what exactly is being “indifferenced” between in the first place, I’d love that too.
