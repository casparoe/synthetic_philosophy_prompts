answer: |-
  Here is a complete design for your 80-minute seminar. It prioritizes the *mechanics of independence* over the *magic of numbers*, using the constraints of your room to force the lesson home.

  ### 1. Card Generation & Procedure

  **The Math of the Deck**
  To guarantee the reliability you claim without relying on live coin flips (which kill pace), you must pre-generate the decks.
  *   **Truth State:** For each round, decide beforehand if the Truth is **A** or **B**. (Alternate them: A, B, A, B... so students can't guess a pattern).
  *   **Standard Voter (Reliability $\approx 0.6$):** For a class of 19, create a deck of 19 cards per round.
      *   12 cards match the Truth.
      *   7 cards contradict the Truth.
      *   *Reliability:* $12/19 \approx 0.63$. This is safely above 0.5.
      *   *Independence:* To ensure true independence (sampling with replacement), you should ideally randomize each card individually. However, for $N=19$, the hypergeometric bias of a fixed deck (12/7 split) is negligible for the demo. **Pre-print 5 rounds of these decks.** Label them "Round 1," "Round 2," etc.
  *   **Expert Voter (Reliability $\approx 0.9$):** For the "Expert" block, select 3 students. Give them cards from a pre-rigged mini-deck where 9 out of 10 cards match the Truth. (Or simply hand them a card that says "Expert Clue: [Truth]" and tell them verbally it is 90% reliable, but rigging the card is more convincing).
  *   **The "Poison" Voter (Reliability < 0.5):** For the final twist, prepare one card that *inverts* the truth (e.g., if Truth is A, card says B).

  **The Procedure (90-Second Cycle)**
  1.  **Distribution (20s):** Pass the envelopes/cards out as students enter or have them on desks.
  2.  **Private View (20s):** "Look at your card. Do not show it. Do not speak."
  3.  **Vote (20s):** "Mark A or B on your index card. Fold it."
  4.  **Collection & Tally (30s):** Collect in a box/bag. You (or a trusted student) count aloud while writing on the whiteboard.
  5.  **Result (10s):** Announce "Majority was [Correct/Incorrect]." Update the Score.

  **Pacing & Volume**
  *   **Total Rounds:** 12 Rounds.
  *   **Time:** 12 rounds $\times$ 2 mins (including transition chatter) = 24 minutes of gameplay.
  *   **Blocks:**
      *   **Block 1 (Rounds 1-4):** Baseline. Independent, $p \approx 0.6$.
      *   **Block 2 (Rounds 5-7):** Correlation. Common Signal.
      *   **Block 3 (Rounds 8-11):** Competence vs. Size. (3 Experts vs. 19 Mediocre).
      *   **Block 4 (Round 12):** The Poison Pill (One $p < 0.5$ voter).

  **Expected Accuracy (So you don't panic)**
  *   **Block 1 (19 voters, $p=0.63$):** Expected Majority Accuracy $\approx$ **85%**. (You should see 3 or 4 correct rounds out of 4).
  *   **Block 2 (Correlated):** Accuracy will drop. Depending on the strength of the correlation, expect **60-70%**.
  *   **Block 3 (3 Experts, $p=0.9$):** Expected Majority Accuracy $\approx$ **97%**. (They should almost never lose).
  *   **Block 4 (Poison):** Accuracy drops below Block 1 baseline.

  ---

  ### 2. Payoff Scheme

  **The "Common Pot" System**
  *   **Rule:** The class shares a single score.
  *   **Reward:** If the **Majority Vote** matches the **Truth**, the Class gets **10 Points**. If the Majority is Wrong, **0 Points**.
  *   **Individual Stake:** Tell them: "At the end of class, I will randomly select **three** of you. If the Class Total is over 80 points, those three students get a 'Homework Pass' (or bonus participation credit)."
  *   **Why this works:**
      1.  **Common Interest:** Everyone wants the Majority to be right.
      2.  **Anti-Copying:** Copying breaks independence. If they copy, they risk a "cascade" error where the whole group goes wrong together, losing the pot.
      3.  **Anti-Confidence:** Loudness doesn't matter; only the secret ballot counts.
      4.  **Audit Threat:** The random audit of *individual* votes (to verify they actually voted and didn't just abstain) keeps them honest without rewarding contrarianism.

  ---

  ### 3. Minute-by-Minute Schedule (80 Minutes)

  *   **00-05: Setup.** Move chairs into a wide circle or scattered formation (maximize distance). Distribute Round 1 cards.
  *   **05-25: Block 1 (The Baseline).** 4 Rounds.
      *   *Instruction:* "Private clues. 60% reliable. Independent. Vote."
      *   *Tally:* Mark Tally Sheet on Board (Correct/Incorrect).
  *   **25-40: Block 2 (The Correlation Twist).** 3 Rounds.
      *   *Instruction:* "Before you look at your private card, I am placing a **Public Clue** on the board." (Write "Clue: A" for all 3 rounds, regardless of truth). "This public clue is 80% reliable. Your private card is still 60% reliable. Vote."
      *   *Note:* This creates a common shock. If the Public Clue is wrong, everyone is biased the same way.
  *   **40-60: Block 3 (Size vs. Competence).** 4 Rounds.
      *   *Rounds 8-9:* All 19 vote (Standard 0.6 cards).
      *   *Rounds 10-11:* **Only 3 designated "Experts" vote.** (Select 3 students in the front). The other 16 sit on hands. The Experts get 0.9 reliability cards.
      *   *Comparison:* Ask them to watch the score. Does the big group or small group score higher?
  *   **60-65: Block 4 (The Poison Pill).** 1 Round.
      *   *Instruction:* All 19 vote. But tell Student #1 privately: "Your card is inverted. It is wrong 60% of the time." (Hand them the Poison Card).
      *   *Goal:* Show that adding a voter *can* lower accuracy.
  *   **65-80: Debrief.** (See below).

  ---

  ### 4. The Debrief Strategy

  **Do not mention Condorcet until minute 75.**

  1.  **Map the Data (65-70):**
      *   Point to Block 1: "High accuracy. Why?" (Elicit: *We were mostly right individually*). Write **$p > 0.5$**.
      *   Point to Block 2: "Accuracy dropped. Why? Did your private cards get worse?" (No). "Did you talk?" (No). "Then what changed?" (We all saw the same Public Clue). Write **Independence Broken**.
      *   Point to Block 3: "3 people beat 19 people. How?" (Elicit: *The 3 were smarter*). Write **Competence > Headcount**.

  2.  **The "Adding Voters" Moment (70-75):**
      *   Point to Block 4 (Poison Pill). "In Round 12, we added a voter compared to Round 1. Did the group get smarter or dumber?"
      *   *Lesson:* Adding a voter only helps if that voter is **better than a coin toss** ($p > 0.5$) AND **independent**.
      *   *Connect to Block 2:* "In Block 2, adding the Public Clue effectively added 18 voters who were all copies of each other. Correlated voters count as *fewer* voters. If they are correlated *and* wrong, they drag the group down."

  3.  **The Reveal (75-80):**
      *   "This is the **Condorcet Jury Theorem**."
      *   Write the conditions on the board:
          1.  Binary Choice.
          2.  $p > 0.5$ (Competence).
          3.  Independence (Conditional on Truth).
      *   "If these hold, Majority Accuracy $\to 1$ as $N \to \infty$. If these break, Majority Accuracy can $\to 0$."

  ---

  ### 5. Predictable Failures & Fixes

  1.  **Whispering/Cheating in Block 1:**
      *   *Risk:* Students turn to neighbors to "compare clues."
      *   *Fix:* **Seating.** Scatter them. **Threat:** "If I see pattern-matching in your votes (e.g., you vote identical in 4 rounds), I will assume collusion and zero your points."
  2.  **The "Expert" Revolt (Block 3):**
      *   *Risk:* The 16 non-voters feel useless and disrupt the experts.
      *   *Fix:* Frame it as "Committee vs. Plenum." The 16 are "observers." Their job is to record the score. Give them a task: "Observers, write down the Expert vote each round."
  3.  **Skepticism of Rigging:**
      *   *Risk:* "The professor is flipping the Truth to make us lose."
      *   *Fix:* **Transparency.** Keep the "Truth Key" sealed on your desk. At the end of class, open it and let them verify the rounds.
  4.  **Meta-Gaming the Points:**
      *   *Risk:* A student realizes if they vote against the majority and win, they might look smart.
      *   *Fix:* The Payoff is **Group Majority**. Individual contrarianism hurts the pot. Reinforce: "You only get points if the *Majority* is right."
  5.  **Pacing Drag:**
      *   *Risk:* Counting 19 cards takes too long.
      *   *Fix:* **Pre-printed Tally Sheets.** Have a student assistant (or quick volunteer) tally while you start the next distribution. Or, use colored cards (Red=A, Blue=B) and have them hold them up for a visual count (less secret, but faster). *Stick to secret ballot for integrity; use a clear plastic box for fast counting.*

  ---

  ### 6. Honest Limitations (What You Must Supply)

  You cannot show asymptotics with 19 people. You must explicitly state this in the debrief.

  **Say this:**
  "We saw 19 people. The theorem talks about infinity. We didn't see 100% accuracy in Block 1; we saw ~85%. Why? Because 19 is small. The theorem guarantees a *trend*, not a guarantee for small groups.
  Also, we assumed $p=0.6$. In the real world, we don't know $p$. If $p$ is actually 0.4, this whole room just became a stupidity engine. The math works, but the input (competence) is the variable we can't measure."

  **What you can get away with:**
  You don't need to prove the binomial sum. You just need them to trust the *contrast* between the blocks. The emotional shock of "3 experts beat 19 of us" does the heavy lifting.

  ---

  ### 7. The "Adding a Voter" Setup

  **Where:** Block 4 (Round 12).
  **Mechanism:** **One voter who is reliably slightly wrong ($p < 0.5$).**
  **Why:**
  *   **Correlated Block (Block 2)** shows that adding *redundant* voters doesn't help.
  *   **Poison Voter (Block 4)** shows that adding *negative* voters actively hurts.
  *   **Pedagogical Choice:** The Poison Voter is clearer for the specific claim "Adding a voter makes the group worse." Correlation is subtle (it makes the group *less better than expected*). A voter with $p=0.4$ makes the group *worse than before*.
  *   **Execution:** In Round 12, tell the class: "We are adding one more person to the pool to see if it helps." Hand Student #1 the Inverted Card. Compare Round 12 accuracy to Round 1-4 average. If Round 12 is a loss (and Rounds 1-4 were mostly wins), the point is made.

  **Final Note on Card Reliability:**
  To ensure the 0.6 claim is honest:
  *   Do not use a fixed 12/7 split for every round if you want true independence.
  *   **Better:** Prepare 5 envelopes. Inside each envelope are 19 cards.
  *   For Round 1: Generate 19 random outcomes (60% chance of Truth) on a computer. Print them. Cut them. Put in Envelope 1.
  *   Repeat for Rounds 2-5.
  *   This ensures $p=0.6$ exactly per student, without the "without replacement" bias of a fixed deck. It takes 20 minutes of prep before class, but saves you from mathematical skepticism during class.
