  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Expert in history of economic thought and philosophy of probability (Keynes specialist).
      *   **Task:** Analyze the 2008 Global Financial Crisis (GFC) through Keynes's framework (specifically *Treatise on Probability* and *General Theory* concepts).
      *   **Pre-analysis Requirement:** Explicitly lay out the conceptual mapping (actors, options, evidence, Keynesian distinctions).
      *   **Core Question:** Does Keynes's framework *explain* the crisis or merely *redescribe* it?
      *   **Specific Focus:** 2005-2008, investment banks, rating agencies, Gaussian copula models, AAA ratings, lack of historical precedent for nationwide housing decline.
      *   **Keynesian Concepts to Apply:** Risk vs. Radical Uncertainty, Weight of Argument vs. Convention, Private Judgment vs. Collective Behavior, Animal Spirits.
      *   **Two-Way Analysis:**
          1.  Apply Keynes to the Crisis (Did they convert uncertainty to risk? How did convention hold/collapse? Role of animal spirits?).
          2.  Apply Crisis to Keynes (Does this confirm the danger? Does it expose gaps regarding institutional incentives? Can private judgment scale?).
      *   **Specific Tension:** Keynes's personal investment strategy (King's College endowment, concentrated portfolios, private judgment) vs. Systemic stability.
      *   **Constraints:** Be disciplined about theory boundaries (what it explains vs. silences like regulatory capture/leverage). No verbatim quotes (paraphrase only). No bibliographies.

  2.  **Conceptual Mapping (Pre-analysis):**

