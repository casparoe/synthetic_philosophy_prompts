      *   *Decision Options:* Buy/Sell/Hold MBS/CDOs, Assign Ratings (AAA vs. Junk), Regulate/Deregulate.
      *   *Evidence Available:* Historical housing data (local, not national), default correlations (limited), mathematical models (Gaussian copula), fee structures, market prices.
      *   *Keynesian Distinctions:*
          *   Risk vs. Uncertainty: Calculable probabilities vs. unmeasurable unknowns.
          *   Weight of Argument: The amount of evidence supporting a probability (high evidence = high weight, even if probability is uncertain).
          *   Convention: Reliance on the assumption that the existing state of affairs will continue unless specific reasons to expect change exist.
          *   Animal Spirits: Spontaneous urge to action rather than inaction, driven by optimism/pessimism when calculation is impossible.
          *   Private Judgment vs. Collective Behavior: Individual assessment of value vs. following the crowd (beauty contest).

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction/Conceptual Mapping:** Start with the required explicit mapping. Define the terms clearly before applying them.
      *   **Part 1: Applying Keynes to the Crisis (The Forward Lens):**
          *   *Risk vs. Uncertainty:* The core error. Housing was uncertain (no national precedent), modeled as risk (Gaussian copula). This is the "illegitimate conversion."
          *   *Convention:* Why did everyone believe the AAA ratings? Because everyone else did. The convention was "housing prices never fall nationally." This provided false stability.
          *   *Collapse:* When the convention broke (prices fell), there was no underlying knowledge to fall back on, leading to a cliff-edge collapse.
          *   *Animal Spirits:* The boom wasn't rational calculation; it was euphoria masked as math.
      *   **Part 2: Applying the Crisis to Keynes (The Reverse Lens):**
          *   *Confirmation:* It confirms the danger of treating uncertainty as risk.
          *   *The Gap (Institutional Incentives):* Keynes focused on psychology/epistemology. He didn't fully account for *why* the convention was maintained (fees, regulatory arbitrage). The "manufacture" of false certainty was profitable.
          *   *The King's College Tension:* Keynes advocated concentrated portfolios based on deep private knowledge ("weight of argument").
          *   *Scalability:* Can the whole system do this? No. If everyone relies on private judgment, liquidity dries up. If everyone relies on convention, fragility increases. Keynes's personal success doesn't solve systemic fragility.
      *   **Part 3: Boundaries and Limitations:**
          *   What does Keynes miss? Regulatory capture, leverage mechanics, political economy.
          *   Does it strengthen the Risk/Uncertainty distinction? Yes, it shows the distinction is ontological, not just epistemic.
