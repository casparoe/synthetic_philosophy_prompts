  The wind up here was colder than the street, carrying the smell of rain and old brick. Miriam leaned against the parapet, the clipboard resting on her knees. Dev stood by the water tower, hands deep in his coat pockets, watching the smoke from her cigarette drift toward the lot next door.

  "The waitlist column," Miriam said. She tapped the paper with a blunt nail. "You want me to add their years to mine."

  "It's not adding," Dev said. "It's weighting. The rule accounts for need. If you say you're staying ten years, and the family on the waitlist needs a home now, their urgency carries weight too."

  "Urgency isn't residency, Dev. You can't vote for a street you haven't walked."

  "If we only count the people inside the fence, the fence never moves. We turn the city into a club."

  Miriam shielded the flame of her lighter against the wind. "Forty-one years. I drove this route when the factories closed. I stayed when the lights went out. You're telling me my stake is equal to someone who hasn't even unpacked a box?"

  "I'm telling you their need is real."

  "Their need is abstract. My presence is concrete." She exhaled smoke into the dark. "That's point one. You're asking me to value a promise over a history. But here's point two." She looked at him, eyes sharp. "You need me to check the box for ten years. You told me the project dies if the current residents don't show a long horizon. But you haven't told me what happens if I check that box and life happens."

  Dev shifted his weight. The clawback provision sat heavy in his throat. If she left within five years, the vote recalculated. The project could be undone. He couldn't tell her that without sounding like a threat.

  "The declaration is a statement of intent," Dev said.

  "It's a bet. And you're holding the other side of the wager." Miriam crushed the cigarette out on the sole of her shoe. "You want the building. I want the building. But my association thinks it's a siege. So I'm supposed to sign this to save the project, while pretending I know where I'll be when I'm seventy-seven?"

  Dev looked out at the skyline. The lights of the downtown core flickered. He believed in the model. He believed the city died without new blood. But listening to her, he felt the cold logic of the spreadsheet warm into something human.

  "You're right," Dev said. "Stability has value. The model... it treats time like currency. But you can't spend time you haven't earned yet." He turned back to her. "I believe people need to arrive. But I concede that those who stayed paid a price the newcomers didn't. The rule doesn't honor that enough."

  "It honors the math," Miriam said. "Not the people."

  "I'm trying to balance both."

  "Then look at me, Dev. Really look." She pulled the pen from the clipboard. She hovered it over the 'Years Remaining' box. "I have a grandson in Cleveland. His mother is sick. I haven't decided if I'm going."

  Dev felt the floor drop. If she declared ten years and left in two, the clawback would trigger. The council vote would be vulnerable. The project would collapse.

  "If I put down ten, and I go," Miriam said, "what happens to the building?"

  Dev stayed silent. He couldn't lie. He couldn't tell the truth.

  Miriam watched him freeze. She lowered the pen.

  "Don't answer that. Just know I'm not signing a lie to save your model." She capped the pen and tucked it behind her ear. "I think I'm going to Cleveland."
