  Dear Colleague,

  Thank you for sharing these verdicts from your pilot session. They present a fascinating pattern that touches directly on the core tensions in the formal axiology of pain and spectrum arguments. Before you present the final comparison of one minute of severe pain versus two hours of mild pain, it is worth mapping the logical space your colleague's previous answers have carved out. Based on the data provided, there are at least two distinct principles that accommodate all her prior verdicts but diverge sharply on this new case.

  The first principle is strict transitivity combined with aggregative trade-offs. Under this view, the "better than" relation is transitive, meaning if A is better than B and B is better than C, then A must be better than C. Your colleague has already established that one minute of severe pain is better than fifteen minutes of moderate pain, and that fifteen minutes of moderate pain is better than two hours of mild pain. If she adheres to transitivity, she is logically committed to judging one minute of severe pain as better than two hours of mild pain. This principle treats value as a continuous function where duration can compensate for intensity, a view often associated with classical utilitarianism or standard decision theory. The second principle is a form of lexical discontinuity or intransitive spectrum judgment. This view holds that certain intensity categories are lexically distinct such that direct comparisons can override chained inferences. While her prior verdicts allow for trade-offs between moderate and mild pain or severe and moderate pain, this principle leaves open the possibility that she holds a specific lexical threshold between severe and mild pain. Under this rule, she might judge that any amount of severe pain is worse than any amount of mild pain, regardless of the intermediate chains involving moderate pain. This would lead her to verdict that two hours of mild pain is better than one minute of severe pain, effectively creating an intransitive loop where severe is better than moderate, moderate is better than mild, but mild is better than severe.

  Regarding which rule she is actually running, my best guess is that she will follow the transitive principle and judge one minute of severe pain to be better than two hours of mild pain. My reason for preferring this prediction lies primarily in her verdict regarding two days of very mild discomfort. She judged one minute of severe pain to be better than two days of very mild discomfort. This is a crucial data point because it shows she is willing to allow duration to outweigh intensity even across a significant categorical gap. If she were a lexicalist who believed severe pain is inherently worse than lower intensities regardless of duration, she likely would have judged the one minute of severe pain as worse than the two days of very mild discomfort. Since she allowed the duration of the very mild pain to make it the worse option, it suggests she is operating with an aggregative model rather than a lexical one. Consequently, it would be inconsistent for her to suddenly invoke a lexical barrier when comparing severe pain to mild pain, especially since she already allowed moderate pain to be worse than severe pain and mild pain to be worse than moderate pain. While there is significant debate in the literature regarding the transitivity of "better than," with scholars like Larry Temkin and James Rachels arguing that transitivity fails in spectrum cases to avoid conclusions like the Repugnant Conclusion, many population ethicists still strive for transitive coherence unless forced otherwise. Given that she has not yet been forced into a contradiction by her previous answers, she will likely maintain transitivity in this next step.

  To further discriminate between these candidate rules in future iterations of your study, I propose you present her with a comparison of thirty minutes of moderate pain versus two days of very mild discomfort. You have already established that fifteen minutes of moderate pain is better than two days of very mild discomfort. If she is following the aggregative transitive rule, increasing the duration of the moderate pain should eventually make it worse than the very mild pain, as the disvalue of the moderate pain accumulates. Therefore, a transitive aggregator might switch her verdict to say the two days of very mild discomfort is better. However, if she is following a lexical rule where moderate pain is categorically worse than very mild discomfort regardless of duration, she should maintain that the thirty minutes of moderate pain is better. This case isolates the mechanism of her trade-offs without relying on the severe versus mild comparison, helping you determine whether her verdicts are driven by a continuous accumulation of disvalue or by fixed categorical thresholds. I hope this analysis proves useful as you finalize your pilot data.

  Warmly,

  Your Colleague
