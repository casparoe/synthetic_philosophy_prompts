answer: |-
  ### Part 1: Restatement of the Kelly Criterion in RL Vocabulary

  **The Setup: Wealth as State, Returns as Transitions**
  Consider a sequential decision process modeled as a Markov Decision Process (MDP) where the state space $S$ includes the agent's current capital $W_t \in \mathbb{R}^+$. The action space $A$ consists of allocation fractions $f_t \in [0, 1]$. The environment dynamics are stationary and stochastic: given state $W_t$ and action $f_t$, the next capital $W_{t+1}$ is drawn from a distribution $P(W_{t+1} | W_t, f_t)$. Crucially, this is a *compounding* process: $W_{t+1} = W_t \cdot (1 + r_t)$, where $r_t$ is the return on investment determined by the environment and the bet size.

  **The Standard RL Objective (Linear Expectation)**
  In standard risk-neutral RL, the goal is to learn a policy $\pi(a|s)$ that maximizes the expected cumulative return over a horizon $T$. For an infinite horizon with discount factor $\gamma \to 1$, this is often formulated as maximizing the expected terminal wealth:
  $$ J_{\text{linear}}(\pi) = \mathbb{E}_{\tau \sim \pi} [W_T] $$
  where $\tau$ is a trajectory sampled from the policy-induced distribution. This objective optimizes the **ensemble average**. It weights all possible trajectories by their probability mass. In high-variance compounding environments, $J_{\text{linear}}$ is dominated by outlier trajectories where the agent gets "lucky" repeatedly, even if the probability of such trajectories approaches zero as $T \to \infty$.

  **The Kelly Objective (Geometric Growth)**
  The Kelly criterion proposes optimizing a different objective function. Instead of maximizing terminal wealth directly, the agent maximizes the expected logarithm of wealth, which is equivalent to maximizing the sum of log-returns:
  $$ J_{\text{log}}(\pi) = \mathbb{E}_{\tau \sim \pi} \left[ \sum_{t=0}^{T-1} \log(1 + r_t) \right] $$
  In the limit $T \to \infty$, by the Law of Large Numbers, this converges almost surely to the **time-average growth rate**:
  $$ g(\pi) = \lim_{T \to \infty} \frac{1}{T} \log \left( \frac{W_T}{W_0} \right) \approx \mathbb{E}_{s, a, s'} [\log(W_{t+1}/W_t)] $$
  Optimizing $J_{\text{log}}$ yields the policy that maximizes the asymptotic exponential growth rate of capital for almost all trajectories, rather than the expectation over the ensemble of trajectories.

  **The Argument for Geometric Rationality**
  The argument against $J_{\text{linear}}$ and for $J_{\text{log}}$ rests on the non-ergodicity of the wealth process.
  1.  **Trajectory Dominance:** In compounding environments with volatility, the ensemble expectation $\mathbb{E}[W_T]$ diverges from the typical trajectory behavior. A policy maximizing $J_{\text{linear}}$ may select actions that have positive expected return but negative expected log-return.
  2.  **Absorbing States (Ruin):** If the expected log-return is negative, $W_T \to 0$ almost surely as $T \to \infty$, even if $\mathbb{E}[W_T] \to \infty$. In RL terms, the system enters an absorbing state $W=0$ with probability 1.
  3.  **Rationality Constraint:** A rational agent operating in a sequential, reinvestment setting should optimize for the property that ensures survival and growth along the *actual* trajectory experienced (time average), rather than the *hypothetical* average over parallel universes (ensemble average). Therefore, the value function should be defined over log-wealth, $V(s) = \mathbb{E}[\sum \log(r_t)]$, making the policy risk-sensitive to volatility drag.

  ---

  ### Part 2: Residue Report

  This section analyzes the fidelity of the translation above. It categorizes which elements of the Kelly argument map cleanly to RL concepts, which require distortion, and which have no counterpart.

  #### 1. Clean Mappings
  *   **Risk-Sensitive Objectives:** The shift from linear wealth to log-wealth maps directly to **Risk-Sensitive RL**. Specifically, it is a instance of optimizing a concave utility function over returns. It is mathematically analogous to Exponential-Utility RL (where $U(x) = -e^{-\beta x}$) in the limit, or simply a reward transformation $r' = \log(1+r)$.
  *   **Average Reward Setting:** The Kelly focus on asymptotic growth rate maps cleanly to the **Average Reward RL** setting (maximizing $\lim_{T\to\infty} \frac{1}{T} \mathbb{E}[\sum r_t]$), as opposed to the Total Reward or Discounted Reward settings.
  *   **Absorbing States:** The concept of "ruin" maps cleanly to an **absorbing state** in the MDP ($W=0$) from which no positive reward is possible. Standard RL algorithms handle absorbing states without conceptual friction.
  *   **Policy Optimization:** The search for the optimal fraction $f^*$ is a standard **policy optimization** problem. The Kelly fraction is simply the $\pi^*$ derived from the log-objective.

  #### 2. Distortions and Strain
  *   **Wealth as State vs. Return:** In standard RL, the reward signal $r_t$ is typically external and does not fundamentally alter the transition dynamics of the state space, other than via the learning update. In the Kelly formulation, the reward *is* the state transition multiplier ($W_{t+1} = W_t \cdot \text{factor}$).
      *   *Distortion:* To express Kelly in standard RL, one must constrain the MDP definition such that the state includes the cumulative product of past rewards. This is not a distortion of RL, but it highlights that Kelly applies to a specific subclass of MDPs (multiplicative growth processes) rather than general MDPs.
  *   **Known Dynamics vs. Exploration:** The classic Kelly argument assumes known probabilities (the "edge" is known). RL is fundamentally concerned with **learning** these probabilities via exploration.
      *   *Distortion:* Expressing Kelly in RL requires assuming a model-based setting or a converged Q-function. If we introduce exploration (e.g., $\epsilon$-greedy or Bayesian posterior sampling), the "optimal" Kelly bet changes (often becoming more conservative to account for estimation error, known as "Fractional Kelly"). The pure Kelly argument does not natively account for the cost of information gathering, requiring an extension of the framework to **Bayesian RL** or **Meta-RL** to remain faithful.
  *   **Stationarity Assumption:** Kelly relies on the Law of Large Numbers converging on a stationary distribution. RL frequently targets **non-stationary** or **adversarial** environments.
      *   *Distortion:* Applying the Kelly argument in non-stationary RL requires assuming the environment changes slowly relative to the convergence of the log-average. If the environment is adversarial (shifting distributions to minimize your growth), the geometric growth guarantee breaks. Expressing Kelly here requires assuming a "nature" that is stochastic but not adversarial, which limits the generality of the RL framework being used.

  #### 3. No Counterpart (The Residue)
  *   **The Normative Status of the Objective:** In RL, the objective function $J$ is exogenous. It is specified by the designer. The agent is "rational" if it maximizes $J$. The Kelly argument claims that $J$ *itself* is derived from a rationality constraint (survival in sequential decisions).
      *   *Gap:* RL has no internal vocabulary to argue that one objective function is more "rational" than another, only that one is more difficult to optimize or yields different behaviors. The claim that an agent *should* maximize log-wealth rather than linear wealth is a meta-objective claim that sits outside the standard RL optimization loop.
  *   **Ergodicity Breaking:** Standard RL theory implicitly assumes ergodicity or treats the expectation operator $\mathbb{E}$ as the sufficient statistic for decision quality. The distinction between **ensemble average** (standard RL objective) and **time average** (Kelly objective) is rarely explicit in RL literature.
      *   *Gap:* RL lacks a standard formalism for "ergodicity economics." While one can code either objective, the theoretical framework does not typically analyze the divergence between $\mathbb{E}[W_T]$ and $\exp(\mathbb{E}[\log W_T])$ as a failure mode of the objective function itself.
  *   **Single-Trajectory Reality:** RL evaluates policies based on expected performance over a distribution of trajectories. The Kelly argument emphasizes that the agent only experiences *one* trajectory.
      *   *Gap:* While **CVaR (Conditional Value at Risk)** optimization in RL addresses tail risk, it does so by optimizing the expectation of the worst $\alpha$-quantile of the *ensemble*. Kelly argues that the ensemble is irrelevant; only the time-path matters. This ontological distinction (one world vs. many worlds) has no direct counterpart in standard RL loss functions.

  #### 4. Gap Analysis: Limitation or Disagreement?

  **A. Limitation of the RL Framework**
  The lack of an explicit **ergodicity distinction** is a genuine limitation of standard RL formalism. By defaulting to ensemble expectations ($\mathbb{E}_{\tau}$), standard RL obscures the risk of ruin in compounding processes. An RL practitioner maximizing $\mathbb{E}[W_T]$ in a volatile market will converge to a policy that goes bankrupt almost surely, despite achieving high "training performance." This suggests RL needs to integrate time-average objectives more natively when dealing with multiplicative state dynamics, rather than treating them as niche risk-sensitive variants.

  **B. Substantive Philosophical Disagreement**
  The claim that log-utility is *universally* rational reveals a substantive disagreement that cannot be resolved by framework translation.
  *   **Parallel vs. Sequential:** If the agent can parallelize bets (e.g., a hedge fund with infinite capital access or a population of agents), the ensemble average $\mathbb{E}[W_T]$ becomes the relevant metric, not the time average. The Kelly argument holds only for single, non-divisible, sequential trajectories.
  *   **Terminal vs. Continuing:** If the horizon is short or the agent can withdraw profits (non-compounding), the volatility drag argument weakens.
  *   **Conclusion:** The gap is not merely that RL lacks the vocabulary, but that the "rationality" of Kelly is conditional on the *physical constraints* of the agent (single trajectory, reinvestment, no bailout). RL is agnostic to these constraints. Therefore, the disagreement is not a flaw in RL, but a reminder that the **Objective Function Design** in RL requires external domain knowledge (ergodicity properties) that the optimization algorithm itself cannot infer.

  **Summary:** The Kelly criterion translates cleanly into **Risk-Sensitive Average-Reward RL** with a **Log-Transformed Reward Signal**. However, the *normative argument* for why this objective is superior exposes a blind spot in standard RL: the assumption that ensemble expectations are sufficient proxies for single-trajectory performance in non-ergodic systems. This is a framework limitation regarding objective specification, not a failure of the optimization machinery.
