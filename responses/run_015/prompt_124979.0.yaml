prompt: |-
  I'm trying to prep for a seminar on Rorty and I'm tired of people saying he just thinks minds mirror nature badly. Can you restate his antirepresentationalism and the idea that vocabularies are tools rather than pictures, using only the vocabulary of ML — representations vs predicitions, loss surfaces, embedding spces, generalization error, that kind of thing? Do it as faithfully as you can, then give me the residue report: which parts translate cleanly onto "models don't copy reality they optimize a function", which parts have to be distorted to fit (like his talk about solidarity or irony?), and which parts have no ML counterpart at all. I especially want to know whether the claim that there is no "way the world is" independent of description survives this translation, or if it just becomes a banal point about training distributions being partial. Is my gut feeling that Rorty is basically doing philosophy of science for neural nets wrong?
