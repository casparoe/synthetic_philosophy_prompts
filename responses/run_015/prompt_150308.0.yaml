      3.  **Rhetorical Deployment.** How is it weaponised?

      *Actually, I think the Universalism question is the most critical for "public argument" regarding immigration and ethics.*
      Why? Because the confusion between "values we happen to hold" and "values that are objectively right" is where most bad arguments happen.
      However, the prompt asks to prioritise lines of inquiry to assess if the phrase does *real argumentative work*.
