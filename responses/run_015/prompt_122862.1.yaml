answer: |-
  The most severe tension lies between **2 and 9(b)**. This is not a mere friction; it is a direct contradiction that undermines your explanatory mechanism.

  Commitment 2 diagnoses the standing defect as an *attitudinal* failure: the unrepentant hypocrite is "unwilling to accept that [the norm] apply[s] to agents like me." This locates the loss of standing in the blamer's rejection of the norm's validity or applicability to themselves. However, the colleague in 9(b) explicitly *accepts* the norm's applicability. He "genuinely thinks it's wrong of him" and admits "I'm the worst." He affirms the norm applies to agents like him; he simply fails to comply due to weakness of will. On your definition in 2, this colleague retains standing because he lacks the specific unwillingness you identify as the defect. Yet, your verdict in 9(b) denies him standing.

  **Mechanism of Conflict:** Commitment 2 entails that standing is lost only when the blamer rejects the norm's authority over themselves. Commitment 9(b) asserts standing is lost even when the blamer accepts the norm's authority but violates it.
  **What Must Give:** You cannot keep both. If you keep 2, you must concede the colleague in 9(b) has standing, costing you a core intuitive verdict. If you keep 9(b), you must abandon 2's attitudinal explanation.
  **Cost:** Abandoning 2 costs you the specific explanation of *why* hypocrisy matters (the rejection of community), but saves your case verdicts. Keeping 2 saves your theory's internal logic regarding attitudes but forces you to admit the akratic blamer is legitimate, which undermines the practical point of your paper on hypocrisy.

  The second most severe tension is between **2 and 8**. You demand a "single account of standing" covering hypocrisy, manipulation, and strangers. Commitment 2 provides an account tailored specifically to hypocrisy (unwillingness to accept norms). It does not naturally extend to the "total stranger" in 8, who may fully accept all norms but lacks standing due to a lack of relationship, or the "engineer," who lacks standing due to causal responsibility rather than normative rejection.

  **Mechanism of Conflict:** Commitment 2 restricts the grounds of standing loss to normative attitudes. Commitment 8 requires the grounds to include non-attitudinal factors (causal involvement, relational history) under the same umbrella.
  **What Must Give:** Either you abandon the demand for a single account (8) or you broaden 2 so significantly it loses its specific explanatory power regarding hypocrisy.
  **Cost:** Dropping 8 costs theoretical unity but allows you to treat hypocrisy and non-hypocrisy as distinct standing defeaters. Dropping the specificity of 2 costs you the precise link between hypocrisy and standing you aim to defend.

  Your guess regarding **6 and 7** is incorrect; these commitments dissolve on inspection. There is no tension here. Commitment 6 limits the *scope* of standing loss (norm-relative), while 7 isolates the *vice* of hypocrisy from the *practice* of blaming. One can be blameworthy for hypocrisy (7) without ever blaming, while only losing standing to blame for specific norms when one actually blames (6). These operate at different levels (character evaluation vs. normative authority) and are fully compatible.

  **The Single Revision:**
  To clean up the most damage, you must revise **Commitment 2**. The attitudinal focus ("unwillingness to accept") is too narrow to cover 9(b) and too specific to cover 8.

  **Proposed Revision:** Replace the attitudinal condition with an **authority-based condition**. Instead of "unwillingness to accept," state that "to blame is to claim authority to demand compliance, and violating the norm oneself forfeits that authority regardless of attitude."

  **Why this works:**
  1.  **Solves 2 vs 9(b):** The colleague in 9(b) forfeits authority by violating the norm, even if he accepts it. This secures your verdict that he lacks standing.
  2.  **Helps 2 vs 8:** A forfeiture of authority can arguably cover the "engineer" (who forfeits authority by causing the violation) and potentially the stranger (who lacks the relational authority), moving you toward the single account you want in 8 without relying on specific hypocritical attitudes.
  3.  **Preserves 1, 3, 4, 5:** These remain intact. Standing is still a normative defect (1), distinct from fittingness (5) and uptake (4), within a moral address framework (3).

  This shift moves your theory from a psychological account (what the blamer thinks) to a normative account (what the blamer has done to their status). It costs you the specific insight that hypocrisy involves a special kind of normative rejection, but it saves your case verdicts and unifies your account of standing loss under the broader umbrella of forfeited authority. Given your goal is to argue about hypocrisy's effect on standing while maintaining intuitive verdicts, sacrificing the attitudinal explanation in 2 is the necessary trade-off.
