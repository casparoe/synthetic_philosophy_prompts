answer: |-
  This is a sharp angle for a dissertation. You are moving the School of Names (Mingjia) out of the realm of abstract semantics and into the sociology of scientific knowledge and legal theory. The Dolly case provides a concrete stress test for whether *ming* (names) govern *shi* (reality) or whether *shi* forces *ming* to break.

  Here is a disciplined mapping of the analogy, followed by an honest assessment of where the logic holds and where the institutional machinery crushes it.

  ### 1. Mapping the Terms: Gongsun Long in the Laboratory

  To apply "A White Horse is Not a Horse" to the Dolly episode, we must identify the intension (concept) and extension (reference) of the regulatory terms.

  *   **Horse (Ma):** The legal category **"Embryo"** as defined in the Human Fertilisation and Embryology Act (1990). In the original legislative intent, this referred to a entity created by *fertilization* (fusion of gametes). It represents the general "form" or functional potential to develop into an organism.
  *   **White (Bai):** The specific attribute **"Cloned"** (created via somatic cell nuclear transfer). In Gongsun Long's logic, "White" specifies a quality that restricts the reference. Here, it specifies the *method of genesis*.
  *   **White Horse (Bai Ma):** The **"Cloned Embryo."** This is the compound concept: an entity with the developmental potential of an embryo *plus* the specific origin of cloning.

  **Gongsun Long's Claim:** "A Cloned Embryo is Not an Embryo."
  **The Logic:** If you ask for an "Embryo" (under the 1990 definition), a fertilized zygote satisfies the request. A cloned cell does not. Therefore, the extension of "Embryo" and "Cloned Embryo" are not identical. To treat them as identical is to ignore the "White" (the method), which Gongsun Long argues is constitutive of the specific name.

  ### 2. The Regulatory Collapse: Pragmatism vs. Ontology

  The UK regulatory response (culminating in the *Quintavalle* judgment, 2003, interpreting the 1990 Act) explicitly rejected Gongsun Long's distinction.

  *   **The Regulator's Move:** The HFEA and the courts ruled that for the purposes of the Act, a cloned embryo *is* an embryo. They employed a **purposive interpretation**: the goal of the law was to regulate entities capable of developing into human life. Since the cloned entity shared that *telos*, the distinction in origin was deemed legally irrelevant.
  *   **Collapsing the Distinction:** Gongsun Long insists that "White Horse" excludes "Black Horse," and "White Horse" is not interchangeable with "Horse." The regulators, however, collapsed "Cloned Embryo" into "Embryo" to prevent a regulatory vacuum. If they had accepted Gongsun Long's logic, cloned human embryos would have been "Non-Embryos" under the law, escaping oversight entirely.
  *   **The Verdict:** The regulators prioritized **jurisdictional control** over **ontological precision**. They forced the *ming* (name) to stretch until it broke the original definition, proving that in institutional settings, the "Horse" (category) swallows the "White" (attribute) when necessary for governance.

  ### 3. Hui Shi's Egg: Potentiality as Constitution

  Hui Shi's paradox—"The egg has feathers"—argues that potentiality is part of actuality. If an egg becomes a feathered hen, the feathers were in some sense "in" the egg.

  *   **Application to Dolly:** This aligns surprisingly well with the regulators' functionalism. They argued that because the reconstructed cell *contains the potential* to become a lamb (or human), it possesses the essential quality of an embryo, regardless of how it was made.
  *   **Accidental vs. Constitutive:** Here is the crux. Gongsun Long treats "White" as an attribute that can be separated from "Horse." But in biology, reproductive method is often **constitutive**, not accidental. A mule is not a horse not because of color, but because of genesis.
  *   **Hui Shi's Insight:** By treating the *outcome* (development) as the defining feature rather than the *origin* (fertilization), the regulators adopted a Hui Shi-like view of continuity. They treated the reproductive method as accidental (it doesn't matter *how* you got there) to secure the biological kind (it matters *what* you are).
  *   **The Tension:** Gongsun Long would argue this is a category error. If "Embryo" implies "Fertilized," then "Cloned" is a different name entirely. Hui Shi would say the transformation process unifies them. The regulators sided with Hui Shi's continuity to close the legal loophole.

  ### 4. Where the Analogy Breaks

  You must be honest in your diss about where this mapping fails. It breaks in two critical places:

  1.  **Color vs. Genesis:** "White" in Gongsun Long's paradox is a superficial quality (color) attached to a substance (horse). "Cloning" is not a superficial quality; it is a generative mechanism. In modern taxonomy, origin is often essential. A better Mingjia analogy might be "A Mule is Not a Horse," but that lacks the "attribute vs. substance" dynamic of "White Horse." The "White Horse" paradox relies on the attribute being separable; cloning is not separable from the entity's identity.
  2.  **Logic vs. Power:** The School of Names was concerned with the rectification of names to ensure social order (Confucian context) or logical purity (Mohist context). They assumed that if names are precise, reality aligns. The Dolly case shows the reverse: **Power aligns names to reality.** The state has the coercive force to declare "X is Y" even if logic suggests "X is not Y." The School of Names has no account for *authority* overriding *ontology*.

  ### 5. What the Case Shows Back About the School of Names

  This episode does not confirm that ordinary language forces false unifications; rather, it confirms that **institutional language forces *functional* unifications.**

  *   **Ordinary Language:** In daily speech, we might distinguish "test-tube baby" from "natural baby."
  *   **Institutional Language:** The law cannot afford that distinction if the ethical risk is identical.
  *   **The Theory's Limit:** The School of Names illuminates the *loss* incurred by this decision. By ruling "Cloned Embryo = Embryo," the law erases the specific ethical concerns unique to cloning (the "White"). Gongsun Long's value here is diagnostic: he helps you point out exactly what is being erased when the regulators collapse the categories. He provides the vocabulary to critique the regulatory overreach, even if his logic cannot stop it.

  The theory was never meant for institutional categorization because it lacks a normative theory of *purpose*. Gongsun Long cares about truth in naming; the HFEA cares about risk management. When truth conflicts with safety, the institution will always break the name to fit the need.

  \boxed{The Dolly case ultimately breaks the School of Names' theoretical framework, demonstrating that while Gongsun Long correctly identifies the ontological distinction between method and kind, institutional pragmatism necessarily collapses that distinction to secure jurisdiction, proving the theory ill-equipped for the coercive unifications required by law.}
