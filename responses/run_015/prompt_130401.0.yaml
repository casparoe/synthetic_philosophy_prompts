          *   **Constraint:** Do not just dump a reading list; work out the logic.

  2.  **Deconstruct the "Hotel/Dorm" Analogy:**
      *   *Roommate's Claim:* Halden looks like a hotel $\rightarrow$ Treatment causes low recidivism $\rightarrow$ US prisons are cruel/stupid.
      *   *User's Counter:* Halden is "normalized village" + "dynamic security" $\rightarrow$ It's soft control, not hospitality. Architecture manages behavior.
      *   *My Role:* Mediate and analyze the logical structure of these claims.

  3.  **Drafting the Correspondence Table:**
