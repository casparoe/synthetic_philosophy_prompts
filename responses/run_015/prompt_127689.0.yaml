answer: |-
  The session succeeds only if everyone agrees that rationality is about choosing the decision *algorithm* that wins across possible worlds, not the *action* that looks best in the actual world.

  ### 1. The Order of Pieces
  Your instinct is correct: the dependencies must flow **Fixed Past → Policy Scoring → The Cases → The Comparison**.

  *   **Step 1: The Fixed Past (5 mins).** You must establish that the prediction is a historical fact before introducing the dilemma. If they believe their current choice can causally influence the past, the tension evaporates into magic.
  *   **Step 2: Policy Scoring (10 mins).** You must establish that we are grading the *rule* they follow, not the *move* they make. If you skip this, the "Fixed Past" step forces them into CDT (don't pay), and you lose the session.
  *   **Step 3: The Matched Cases (20 mins).** Only now do you introduce the Mugging/Blackmail pair. Because Steps 1 and 2 are laid, they feel the pull: "I can't change the past, but my rule determines which past I inhabit."
  *   **Step 4: The Dial Check (10 mins).** Test structural understanding.

  **Why this order:** If you start with the cases, the Maths Teacher kills you on "can't change the past." If you start with Policy Scoring without fixing the past, it sounds like precommitment magic. You need the cage (Fixed Past) before you show them the key (Policy).

  ### 2. The Core Matched Pair
  **The Case:** "The Coin-Flip Stranger."
  *   **Setup:** A shady stranger approaches you. He flipped a fair coin. He has a predictor (a shrewd human observer, 70% accurate) who guessed what you would do *if asked*.
  *   **Case A (Mugging):** If Tails, he asks for $100. If Heads, he says nothing. *Crucial:* If the predictor guessed "Pay," the stranger donated $10,000 to a cause you love (already done). If "Don't Pay," he did nothing. You are told: "It's Tails. Give me $100."
  *   **Case B (Blackmail):** If Heads, he sends a letter demanding $100 to prevent a $10,000 loss to you. If Tails, he sends nothing. *Crucial:* If the predictor guessed "Pay," he sent the letter. If "Don't Pay," he didn't. You are holding the letter.
  *   **Constraints Check:**
      *   **70% Accuracy:** This is vital. It prevents the "Omega is impossible" dismissal. It forces Expected Value calculations rather than logical certainty.
      *   **Matched:** Same stranger, same stakes ($100 vs $10k), same predictor accuracy.
      *   **Damage Alert:** The constraint "no way for the agent to have bound themselves earlier" creates a pedagogical hazard. It risks making the "Pay" verdict sound like magic rather than algorithmic consistency. To mitigate, frame it as: "You are running code *now*. What does the code output?" rather than "What kind of person are you?" This avoids the "precommitment" trap while preserving the logic.

  ### 3. The Misconception Map
  *   **1. "The money's already gone/letter already sent; you can't change the past."**
      *   *When:* Immediately after Step 1 (Fixed Past).
      *   *Line:* "You can't change the past, but your decision tells us which past you're in."
  *   **2. "This is only about precommitment or being the kind of person who pays."**
      *   *When:* During Case A setup.
      *   *Line:* "Forget who you were yesterday; I'm asking what your algorithm outputs *right now*."
  *   **3. "If the predictor is 70% accurate then causal decision theory is plainly right."**
      *   *When:* During EV calculation.
      *   *Line:* "Correlation isn't causation, but it is evidence—and evidence pays out."
  *   **4. "The mugging is just Newcomb's problem with the boxes open."**
      *   *When:* During Comparison.
      *   *Line:* "Newcomb is about what's in the box; this is about which branch of the tree you're on."
  *   **5. "In XOR blackmail a non-payer never receives the letter at all, so don't pay."**
      *   *When:* During Case B setup.
      *   *Line:* "You *have* the letter; the puzzle is why your decision matters when the threat is already active."
  *   **6. "We know the verdicts (Pay/Don't Pay), case closed." (The Veterans)**
      *   *When:* Throughout.
      *   *Line:* "Verdicts are easy; I want to know where the dial flips."

  ### 4. The Check at the End
  **The Case:** "The Accuracy Dial."
  *   **Setup:** Return to the Coin-Flip Stranger (Mugging version). Keep the stakes ($100 vs $10,000). Tell them you can turn a dial on the predictor's accuracy from 100% down to 0% (random guess).
  *   **The Question:** "At what accuracy percentage do you stop paying in the Mugging? At what percentage do you *start* paying in the Blackmail?"
  *   **Success Pattern:** They identify a threshold for Mugging (around 1% accuracy, since $100 vs $10,000 EV is huge) but insist Blackmail *never* flips (you never pay, regardless of accuracy, because paying correlates with the letter existing).
  *   **Failure Pattern:** They say both have a threshold, or neither does. This proves they are memorizing "Pay/Dont Pay" rules rather than understanding the structural dependence (Mugging depends on counterfactual correlation; Blackmail depends on actual correlation which is severed by the fact you already have the letter).

  ### 5. What to Refuse to Explain
  **The Topics:** The formalism of Functional/Updateless Decision Theory, the metaphysics of "logical counterfactuals," and whether predictors are physically possible.
  **The Reason:** These are implementation details and metaphysical debates that derail the normative question of *how to decide*.
  **The Line:** "We're debugging the decision, not the universe."
  **How to say it:** "If you want to know how the predictor works physically, or the formal proof of why this algorithm wins, that's a different seminar. Today we're just asking: if you *were* in this spot, what do you do to win?"
