      "Correctly identifies the res extensa/res cogitans metaphysical distinction.",
      "Accurately cites the Language Argument from Discourse on Method Part V.",
      "Correctly notes Descartes' criterion of creative/adaptable speech vs. imitation.",
      "References the specific parrot/magpie counter-example Descartes addresses.",
      "Objection clearly targets a specific premise of the argument."
    ],
    "errors_imprecisions": [
      "Claim that animals cannot 'sense anything at all' conflates mechanical sensation with conscious feeling.",
      "Objection is empirical rather than philosophical, which is acceptable but less robust."
    ]
  }
  ```

  ### Advice for Feedback
  When you return this to the student, you might add a small comment on the "sensation" point to show your expertise without being pedantic. Something like: *"Great job on the Language Argument. One small nuance: Descartes admits animals have mechanical sensory reactions (nerves firing), but denies they have the conscious *experience* of pain. Distinguishing these two will help you in future papers on mind-body dualism."*

  You're doing a good job. Trust your instincts.
