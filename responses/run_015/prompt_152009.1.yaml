answer: |-
  ### Brainstorming: Frege's Non-Obvious Moves

  1.  **The Oblique Context Counter-Strike:** Frege would not argue that names *fail* to be rigid in extensional contexts. Instead, he would argue that Kripke's modal contexts (e.g., "Aristotle might not have been...") are *oblique* contexts. In oblique contexts, the customary reference (*Bedeutung*) of a name shifts to its customary sense (*Sinn*). Therefore, the question of whether the *object* persists across worlds is a category mistake; in modal talk, we are discussing the *thought*, not the object directly.
  2.  **The Redundancy of 'Actual' in the *Gedanke*:** Frege holds that truth is timeless and absolute. There is only one reality. He would likely argue that the operator 'actual' adds nothing to the *thought* (*Gedanke*) expressed, only to the linguistic force. Including 'actual' in the sense would be akin to including "true" in the predicate—it collapses the distinction between asserting a thought and constituting a thought.
  3.  **Cognitive Value vs. Metaphysical Tracking:** Frege would argue that 'modal descriptivism' sacrifices the *Erkenntniswert* (cognitive value) of sense to save its reference-fixing power. If a description is rigged to track an object metaphysically across worlds, it ceases to function as a *mode of presentation* accessible to the thinker. It becomes a metaphysical hook, not an epistemic route.
  4.  **The Indexical Completion Problem:** Frege acknowledges that some senses (like 'I', 'now', 'here') are incomplete without context. He might accept 'actual' as a context-sensitive marker. However, he would be torn on whether this completes the sense or merely points to the occasion of utterance. If it points to the occasion, it cannot ground necessary truth, because the occasion is contingent.

  ***

  ### Main Argument: Frege vs. The Modal Turn

  If Frege were confronted with *Naming and Necessity* in the late 1970s, his reaction would not be a flat denial of Kripke's data, but a radical reclassification of Kripke's metaphysics as a confusion of logical levels. He would view the debate over rigid designators as a failure to distinguish between the *expression* of a thought and the *content* of a thought.

  #### 1. The Reaction to Rigid Designators: The Oblique Shift
  Frege would likely concede that proper names *behave* as rigid designators in extensional contexts. However, he would reject the inference that this proves names lack sense. His core counter-move relies on his theory of **indirect reference** (*indirekte Bedeutung*).

  For Frege, when we embed a name in a modal context (e.g., "It is necessary that..."), we are creating an oblique context. In such contexts, the reference of the subordinate clause is not its truth-value, and the reference of the name is not the object, but its customary *sense*.
  *   **The Mechanic:** Kripke argues: "Aristotle might not have been Aristotle" is false because 'Aristotle' picks out the same man in all worlds.
  *   **Frege's Rebuttal:** In the clause "Aristotle might not have been...", the word 'Aristotle' refers to its *sense* (the mode of presentation), not the man. Therefore, the statement is about the stability of the *sense*, not the metaphysical persistence of the object.
  *   **The Verdict:** Frege would dismiss rigidity as a feature of *reference* in extensional contexts only. He would argue Kripke illegitimately extends extensional reference rules into intensional (modal) contexts. For Frege, there is no "trans-world identity" of objects to be tracked by names; there is only the stability of senses within thoughts.

  #### 2. Modal Descriptivism: Rescue or Betrayal?
  You asked if Frege would view 'modal descriptivism' (using descriptions with modal stability conditions to fix reference rigidly) as a legitimate rescue. I predict he would view this as a **betrayal of the sense/reference split**, specifically regarding the purpose of *Sinn*.

  *   **The Function of Sense:** For Frege, sense is a *mode of presentation* (*Art des Gegebenseins*). It is epistemic. It explains how a thinker grasps an object.
  *   **The Problem with Rigidified Descriptions:** If you construct a description like "the actual F" to ensure it picks out the same object in all counterfactual scenarios, you are engineering the description to behave metaphysically like a name. Frege would argue this strips the description of its cognitive value.
  *   **The Mechanic:** Suppose "Hesperus" is associated with the rigidified description "the actual evening star." In a counterfactual world where the evening star is not visible, the description still picks out Venus. But does the *thinker* know this? If the sense is supposed to be the cognitive route, and the route relies on a metaphysical operator ('actual') that bypasses the thinker's epistemic access, the sense is no longer a *mode of presentation*. It becomes a hidden label.
  *   **Frege's Judgment:** He would say this view saves the *reference-fixing* capability of descriptivism at the cost of its *explanatory* power regarding identity statements. If 'Hesperus' and 'Phosphorus' are both rigidified descriptions, their senses differ, yes. But if the rigidity is built into the sense via 'actual', the sense becomes opaque to the thinker. Frege prioritizes the thinkability of the thought over the metaphysical tracking of the object. He would likely say: "You have saved the reference, but you have killed the sense."

  #### 3. The Test Case: 'The Actual Winner of the 2020 Election'
  This is where Frege would be most nuanced. Let's break down the mechanics of the indexical anchor.

  *   **The Indexical Component:** Frege acknowledges in *Der Gedanke* (The Thought) that sentences with 'I', 'here', or 'now' require context to express a complete thought. He might treat 'actual' similarly. The sense includes a placeholder for the context of utterance.
  *   **Does it make it rigid?** In Kripke's framework, yes. "The actual winner" picks out Biden in all possible worlds.
  *   **Frege's Objection:** Frege does not believe in "possible worlds" as concrete entities or even as semantic primitives. He believes in *thoughts* that are true or false. For Frege, 'actual' is redundant in the *Gedanke*.
      *   **The Redundancy Argument:** To think "Biden is the actual winner" is just to think "Biden is the winner." The word 'actual' adds emphasis or logical force, but no constituent to the thought. If 'actual' adds nothing to the thought, it cannot modify the sense to make it rigid.
      *   **The Time Anchor:** The phrase includes "2020." For Frege, time is part of the thought. "Biden wins in 2020" is a timeless thought that is simply true.
      *   **The Snag:** If you treat 'actual' as an indexical that completes the sense, Frege would argue the sense is *incomplete* without the context. But once the context is supplied (the actual world), the thought is fixed. There is no "other world" where the thought persists with a different truth value. The thought *is* the truth condition.
      *   **Conclusion on the Test Case:** Frege would argue that adding 'actual' does not make the designator rigid; it makes the *thought* explicitly about the truth of the matter. Rigidity is a confusion arising from trying to map thoughts onto "other worlds." For Frege, the designator picks out Biden because the thought is true. There is no mechanism for it to pick out anyone else, not because it is rigid, but because there is no other reality to pick from.

  #### 4. Where Frege is Torn vs. Dismissive

  **Where he is Dismissive:**
  *   **Metaphysical Necessity:** He would dismiss the idea that objects have essential properties independent of how they are described. For Frege, necessity is a logical property of thoughts (judgments), not a metaphysical property of objects.
  *   **Direct Reference:** He would flatly reject the idea that a name can refer without a sense. Even if the sense is trivial, there must be a mode of presentation, otherwise, language cannot convey knowledge.

  **Where he is Genuinely Torn:**
  *   **The Logic of Indexicals:** Frege struggled with how 'I' and 'now' function in logic. He admits the sense changes with the speaker/time. He would be genuinely conflicted about 'actual'. Is it a logical constant (like negation) or an indexical? If it's an indexical, does it undermine the objectivity of the *Gedanke*? He might worry that 'modal descriptivism' exploits this gap in his own theory of indexicals.
  *   **The Status of 'Possible Worlds':** While he would reject them metaphysically, he might appreciate their utility as a heuristic for discussing the *conditions* under which a thought is true. He would be torn on whether to dismiss possible worlds semantics entirely or to reinterpret it as a theory of *thought-conditions* rather than world-conditions.

  ### Summary Prediction
  Frege would not try to salvage descriptivism by making descriptions rigid. He would argue that **rigidity is a myth generated by confusing the reference of words in extensional contexts with their reference in oblique contexts.** He would view 'modal descriptivism' as a category error that attempts to solve a metaphysical problem (tracking objects) with a logical tool (sense), thereby corrupting the epistemic function of sense. Regarding your test case, he would argue that 'actual' contributes nothing to the *sense* other than marking the thought as asserted, and thus cannot serve as a rigidifying anchor because there is no non-actual realm for the sense to range over.
