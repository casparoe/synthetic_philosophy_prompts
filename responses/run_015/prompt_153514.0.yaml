answer: |-
  **Setting:** *A quiet corner of a university library café. Two old colleagues, ELENA (a moral realist) and MARCUS (a moral relativist), are sitting over coffee. Elena has a background in systems engineering; Marcus in anthropology. They are discussing a recent paper on cross-cultural moral psychology.*

  **Elena:** You're looking at the variance in the data and seeing a lack of signal. I'm looking at the same variance and seeing noisy instruments. When you read about the divergence in trolley-style judgments between WEIRD societies and small-scale subsistence communities, you conclude there's no universal moral grammar. I conclude the survey questions are failing to capture the underlying constraint.

  **Marcus:** But that's the thing, Elena. You're treating "moral intuition" like it's a voltage reading. You assume there's a steady current running through the wire, and our job is just to fix the multimeter. What if the current itself changes depending on the circuit? When a participant in a collectivist culture says pushing the man off the footbridge is wrong, they aren't measuring the same variable as a Western individualist. They're answering a different question.

  **Elena:** That's the measurement instrument problem exactly. If the question implies a different context, that's a validity error, not a moral truth. If I ask you, "Is it okay to break a lock?" and you say "No," but I don't specify that the building is on fire, your answer isn't a different moral truth; it's a response to an incomplete dataset. The cross-cultural differences in purity norms or authority respect often vanish when you control for social-desirability bias and ensure conceptual equivalence.

  **Marcus:** "Conceptual equivalence." There's the rub. You say you're controlling for bias, but who defines the control? To say a survey is "biased" because it doesn't align with a universal standard presupposes the universal standard exists. When you correct for social-desirability bias, you're usually correcting for *their* desire to look good by *your* standards of what constitutes rational consistency.

  **Elena:** Not rational consistency alone. Functional convergence. Look, in engineering, if I measure the tensile strength of a steel alloy in Tokyo and in Detroit, and I get different numbers, I don't immediately say physics is relative. I check the calibration of my load cells. I check the temperature humidity controls. If I find the Tokyo machine wasn't zeroed properly, I correct it. I can only do that correction because I assume the steel behaves objectively. If morality is about human flourishing—and I think it is—then there are objective facts about what harms or helps humans. The "instrument" is the cultural framing of the survey. We need to calibrate it against the reality of human needs.

  **Marcus:** But you can't calibrate a ruler without another ruler. And where did you get yours? Your "human flourishing" metric is loaded. It prioritizes autonomy, reduction of suffering, and individual agency. That's a very specific cultural artifact. In a culture where flourishing is defined by ancestral continuity or spiritual purity, sacrificing individual agency isn't a measurement error; it's the target value. If you "calibrate" their responses to match your flourishing metric, you aren't removing bias. You're colonizing the data.

  **Elena:** I'm not saying we force their answers to match Western liberalism. I'm saying there are baseline constraints. Nobody flourishingly enjoys being tortured. Nobody wants their children to starve. These aren't cultural constructs; they're biological realities. When we see a culture endorsing practices that seem to violate these, we have to ask: Is this a genuine moral divergence, or is it an epistemic disagreement about how the world works? Maybe they believe the sacrifice prevents a drought. If we correct for the factual belief—the instrument reading on the state of the world—the moral valuation might align.

  **Marcus:** That's a convenient move. You push all the divergence into "factual beliefs" and keep the "moral values" pristine and universal. But the facts and the values are woven together. You can't disentangle them. Take the purity norms you mentioned. You see them as perhaps hygiene heuristics mistaken for moral laws, or social cohesion tools. But for the participant, the disgust *is* the moral fact. To say, "Oh, if you understood germ theory you wouldn't think incest is spiritually contaminating," misses the point. The moral reality *is* the spiritual contamination. There is no culture-neutral vantage point from which to say, "Actually, the real morality is over here, and your instrument is just dirty."

  **Elena:** But if there's no vantage point, you can't critique anything. If a culture decides that flourishing involves sacrificing infants, and you say "That's true for them," you've lost the ability to call it a tragedy. You've reduced morality to preference. I'm arguing that the variation we see in the psychology literature is largely methodological artifact. We're using Likert scales designed for American undergraduates on people who don't conceptualize agency individually. When we use vignettes that respect local ontologies, the convergence increases. That suggests there *is* a standard we're approximating, however poorly.

  **Marcus:** Convergence increases where? Around Western norms? Look, I agree that WEIRD psychology is methodologically sloppy. They assume their undergraduates are universal humans. That's bad science. But fixing the science doesn't prove realism. It just proves that humans are intelligible to each other. We can understand why a community values hierarchy without agreeing that hierarchy is objectively good. You're conflating *intersubjective understanding* with *objective truth*. Just because we can calibrate our instruments to agree doesn't mean the thing we're measuring exists outside of our agreement.

  **Elena:** Think about the calibration process itself, Marcus. To say "this survey question is leading" implies it leads away from the truth. If I say a scale is "biased," I mean it deviates from the actual weight. If morality is entirely constructed, the concept of "bias" loses its normative force. It just becomes "difference." But you and I both feel the pull of certain arguments. We both think some moral progress has happened—abolition, women's suffrage. You don't think those were just local preference shifts. You think they were corrections.

  **Marcus:** I think they were expansions of the "we." Abolition wasn't discovering a pre-existing moral particle. It was a renegotiation of the social contract. It was realizing that the "calibration standard" we were using—white male property owners—was arbitrarily exclusive. But that doesn't mean there's a Platonic form of Justice we were finally touching. It means we built a better ruler for our specific purposes. You're assuming that because we can critique our own culture, there must be an external ground to stand on. But critique is internal. You use a culture's own values to show it's failing by its own lights.

  **Elena:** That's coherent locally, but it fails globally. If I critique a culture that values honor killing, and they say "Our light shows this is honorable," you have no ground to stand on. I need a ground that says "Human suffering matters, period." The measurement instrument argument supports this. If we treat cultural norms as data gathered through imperfect instruments, we can look for the latent variable beneath the noise. The noise is high—language, context, social pressure. But the latent variable—welfare, cooperation, fairness—is detectable. You can't correct for the noise unless you assume the signal is real.

  **Marcus:** And I'm saying the "signal" you're detecting is just the resonance of your own framework echoing back. You assume welfare is the latent variable. Why not purity? Why not obedience? When you design the study to look for welfare, you find welfare. When Henrich designs the study to look for market integration effects, he finds market integration effects. The instrument doesn't just measure the value; it invokes it. There is no pre-existing moral value waiting to be found until the survey triggers it. The survey creates the context in which the value exists.

  **Elena:** So if I ask you, "Is it wrong to kick a dog?" and you say "Yes," that value didn't exist until I asked?

  **Marcus:** No, the disposition existed. But the *moral truth* of it is dependent on the framework that defines "wrong." If your framework is utilitarian, it's wrong because of suffering. If it's divine command, it's wrong because God forbids it. If it's honor-based, maybe it's wrong because it shows lack of control. The "wrongness" isn't a property of the act like mass or charge. It's a relation between the act and the framework. Cross-cultural differences show us the frameworks differ. You want to say the frameworks are imperfect measurements of The True Framework. I say they are different operating systems. You can't run Windows software on a Mac and claim the glitches prove Windows is the objective reality.

  **Elena:** But the hardware is the same. The human nervous system, the need for cooperation, the vulnerability to pain. That's the hardware. The operating systems are running on the same machine. If an OS causes the machine to overheat and crash—say, a norm that requires unsustainable resource depletion or high infant mortality—that's not just a different preference. That's a functional error. We can judge the OS against the hardware.

  **Marcus:** And who defines "crash"? Some systems sacrifice efficiency for stability. Some sacrifice longevity for intensity. You're smuggling in a specific definition of success. You're the engineer, Elena. You want morality to be a bridge that stands up. But morality isn't a bridge. It's the reason we're building the bridge in the first place. And people build bridges to different places.

  **Elena:** They still have to obey the laws of physics to get there. If morality is about navigating social existence, there are laws of social physics. Trust, reciprocity, empathy. If you violate them too egregiously, the society collapses. The variation we see is within the tolerance limits of the material. It doesn't prove the material doesn't exist.

  **Marcus:** I'll grant you the material exists. Human psychology has constraints. But you're jumping from "constraints exist" to "objective moral truths exist." That's a category error. I can acknowledge that humans need protein to survive without saying there's an objective moral command to eat meat. We can agree that certain norms lead to societal collapse without calling collapse "objectively bad" in a metaphysical sense. It's just... the end of that particular game.

  **Elena:** And I say calling it "the end of the game" is a evasion. If we know a norm causes unnecessary suffering, and we have the power to change it, and we don't, that's not just a game over. It's a failure of rationality. The instrument bias argument is my way of saying: we can do better science. We can strip away the cultural noise. If we do, and we still find divergence, then maybe you win. But so far, the divergence looks like measurement error.

  **Marcus:** And I'll say: even if you strip away the noise, you're left with the listener. And the listener is always somewhere. There is no culture-neutral ruler, Elena. There's only the ruler you're holding, and the honesty to admit it's yours.

  **Elena:** Then let's hope my ruler measures something real.

  **Marcus:** Let's hope it builds something worth measuring.
