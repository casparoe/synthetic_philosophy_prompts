  The town hall meeting on the new zoning law had dragged on for three hours when Stanley stood up, adjusted his glasses, and objected to the vote count.

  "Hold on," Stanley said, raising a hand like a lab technician spotting a contaminant. "We can't accept this 52-48 split as warranted assertibility. The conditions of this inquiry were completely uncontrolled."

  The Mayor sighed, rubbing his temples. "Stanley, it's a vote. People raised their hands."

  "But was the sample valid?" Stanley pressed, pacing the aisle. "Mrs. Gable voted 'no' because the radiator was clanking. That's an extraneous variable! And the lighting in here is conducive to anxiety, not cooperative problem-solving. You're trying to transform an indeterminate situation into a unified one, but you haven't even standardized the room temperature!"

  "So what do you want?" the Mayor asked. "A rerun?"

  "Exactly!" Stanley said. "We need reproducibility. If this is social inquiry, we need to know that under identical conditions, the community reaches the same resolution. Otherwise, it's just noise."

  The Mayor stood up, gathered his papers, and looked around the room at the exhausted residents packing their coats.

  "Stanley, look around," the Mayor said. "The situation *is* unified. Everyone is in perfect agreement. We've successfully transformed the indeterminate situation into a consummatory experience."

  "We have?" Stanley asked, hopeful.

  "Yes," the Mayor said, turning off the lights. "The only reproducible result in this town is that when you start talking about controlling variables, everyone leaves. And that hypothesis holds up every single time."
