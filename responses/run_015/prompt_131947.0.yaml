prompt: |-
  I'm writing a novel about a conspiracy against a tyrant in a city that's sort of late-medieval-but-not-anywhere-real, and I've been reading Aquinas on tyrannicide — the commentary on the Sentences, where as far as I can tell he distinguishes the ruler with no title at all from the lawful one who governs rottenly, and is much more relaxed about the first. It felt tidy until I started listing who I actually want my readers to cheer for.

  My gut verdicts:

  - The captain who took the citadel by force and rules with no claim whatsoever, knifed by an ordinary citizen: fine.
  - A different captain, also seized power by force, but rules well, fair taxes, keeps the peace — killed in order to restore the hereditary heir, who is a wastrel: not fine.
  - A properly crowned and anointed king who has turned genuinely cruel: I flinch away from killing him and I don't trust the flinch. Genuinely don't know.
  - A demagogue the majority adores, who's abolished the elections and is grinding down one minority: fine, I think, although most of the city would call it murder.
  - The chancellor who actually runs the prisons but seized nothing himself: fine, yet it feels like a different kind of act — nearer war than punishment.
  - Killing when everyone knows the successor will be worse and there'll be a five-year famine: not fine.
  - Killing him out of pure private revenge, which happens also to free the city: fine as an act, but I don't want to admire the person.
  - Killing him when he's visibly dying and will be gone in a month: not fine — and not because it's wrong, because it's something else.

  Is there definately a principle that gets these, or gets close? Which of my verdicts does it force me to drop, and which of them would Aquinas's own version have to give up on? And what does it say about the case I keep dodging: my protagonist turns out to be the tyrant's daughter, and he has always been kind to her.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Writing a novel about a conspiracy against a tyrant in a fictional late-medieval setting.
      *   **Source Material:** Thomas Aquinas's commentary on the *Sentences* (and implicitly *De Regno* and *Summa Theologiae*), specifically regarding tyrannicide.
      *   **Problem:** The user has a list of intuitive moral verdicts on specific scenarios of killing a ruler, but they are struggling to find a coherent ethical principle that unifies them. They also want to know how Aquinas would judge these cases and how their own intuition compares.
      *   **Specific Cases:**
          1.  Usurper (no title, force) -> Killed by citizen: *Fine.*
          2.  Usurper (force, but rules well) -> Killed for hereditary heir (wastrel): *Not Fine.*
          3.  Legitimate King (crowned, anointed, cruel) -> *Unsure/Flinch.*
          4.  Demagogue (popular, abolished elections, oppresses minority) -> *Fine (but controversial).*
          5.  Chancellor (runs prisons, didn't seize power) -> *Fine (but feels like war).*
          6.  Tyrant (killing leads to worse successor + famine) -> *Not Fine.*
          7.  Private Revenge (frees city incidentally) -> *Fine act, bad agent.*
          8.  Dying Tyrant (month left) -> *Not Fine (pointless).*
      *   **Core Conflict:** The protagonist is the tyrant's daughter; he has been kind to her.
      *   **Questions:** Is there a unifying principle? Which verdicts must be dropped to fit the principle? What would Aquinas say? What does this mean for the protagonist?

  2.  **Deconstruct Aquinas's Position on Tyrannicide:**
      *   *Commentary on the Sentences:* Distinguishes between a *tyrant without title* (usurper) and a *tyrant by exercise* (legitimate ruler who rules badly).
      *   *De Regno (On Kingship):* Generally advises against private assassination. Suggests public authority or divine intervention. Warns of worse successors.
      *   *Summa Theologiae (II-II, Q. 42, A. 2 & Q. 64):* Sedition is a sin. Killing a tyrant is generally prohibited for private individuals unless there is a public mandate. However, he acknowledges the removal of a usurper is less problematic than removing a legitimate ruler.
      *   *Key Aquinas Principle:* The Common Good > Private Good. Order/Peace > Justice in isolation. Public Authority > Private Initiative.
      *   *Aquinas's "Flinch":* He would likely forbid private citizens from killing a legitimate king (Case 3), even a cruel one, unless a higher authority (Church, Empire, Nobility acting corporately) sanctions it. He would be very wary of Case 6 (worse outcomes).

  3.  **Analyze the User's Intuitive Verdicts against Ethical Frameworks:**
      *   *Case 1 (Usurper):* Intuition: Fine. Aquinas: Fine (no allegiance owed).
      *   *Case 2 (Benevolent Usurper vs. Wastrel Heir):* Intuition: Not Fine. Aquinas: Not Fine (Common Good is being served, stability matters more than strict legitimacy).
      *   *Case 3 (Legitimate Cruel King):* Intuition: Flinch. Aquinas: Do Not Kill (private individuals cannot judge the anointed; risk of sedition).
      *   *Case 4 (Demagogue):* Intuition: Fine. Aquinas: Complicated. If he holds legal title, Aquinas says no. If he subverted law, maybe. But Aquinas cares about order.
      *   *Case 5 (Chancellor):* Intuition: Fine (War). Aquinas: Fine (He's an official, not the sovereign; removing a minister is less sedition).
      *   *Case 6 (Consequences/Famine):* Intuition: Not Fine. Aquinas: Strongly Not Fine (Prudence/Consequences matter).
      *   *Case 7 (Private Revenge):* Intuition: Act OK, Agent Bad. Aquinas: Act Bad (Intent matters, private vengeance is sin).
      *   *Case 8 (Dying):* Intuition: Not Fine (Pointless). Aquinas: Not Fine (Prudence).

  4.  **Identify the Unifying Principle:**
      *   The user's intuitions seem to track a mix of **Consequentialism** (outcomes matter: Case 2, 6, 8) and **Legitimacy/Contract Theory** (title matters: Case 1, 3, 4), with a dash of **Virtue Ethics** (motive matters: Case 7).
      *   *Proposed Principle:* **"The Preservation of the Common Good through Legitimate Order."**
      *   *Refinement:* It's not just "tyranny is bad." It's "Does this act restore a functional political community without causing greater collapse?"
      *   *The "Flinch" on Case 3:* This suggests a respect for *Office* over *Person*.
      *   *The "Fine" on Case 4:* This suggests a respect for *Consent/Law* over *Popularity*.

  5.  **Address the Specific Questions:**
      *   *Is there a principle?* Yes, likely a hybrid of "Legitimacy of Office" + "Consequential Prudence."
      *   *Which verdicts to drop?* Case 7 (Aquinas would say the act is *not* fine if the motive is private revenge). Case 4 (Aquinas might struggle here if the demagogue is legally elected then suspends elections; he prefers order).
      *   *What would Aquinas drop?* He would likely reject Case 1 (private citizen killing usurper) if it causes sedition, but generally accepts it. He would definitely reject Case 3 (private killing of legitimate king). He would strongly emphasize Case 6 (consequences).
      *   *The Protagonist (Daughter):* This is the emotional core. It pits *Natural Law (Family/Piety)* against *Political Justice (Common Good)*. Aquinas prioritizes the Common Good, but Piety is a major virtue. This creates the tragedy.

  6.  **Drafting the Response:**
      *   *Tone:* Intellectual, respectful of the source material, encouraging for a writer.
      *   *Structure:*
          1.  Validate the intuition (it's sophisticated).
          2.  Identify the underlying principle (The "Common Good" + "Public Authority").
          3.  Run the 8 cases through Aquinas's filter vs. User's filter.
          4.  Highlight the conflicts (where User and Aquinas diverge).
          5.  Tackle the Daughter/Protagonist dilemma (The tragedy of Piety vs. Justice).
          6.  Suggest a narrative principle.

  7.  **Refining the Aquinas Analysis (Self-Correction/Nuance):**
      *   *Correction:* In *De Regno*, Aquinas is actually quite cautious about tyrannicide even for usurpers if it causes civil war. But in the *Sentences* commentary, he is more permissive regarding usurpers. I should acknowledge this tension.
      *   *Nuance on Case 4:* Aquinas doesn't care about "elections" in the modern sense. He cares about the *Res Publica*. If the demagogue destroys the *Res Publica*, he is a tyrant.
      *   *Nuance on Case 7:* Aquinas is big on *Intent*. An act is not morally "fine" if the will is corrupt, even if the outcome is good. The user says "Fine as an act," Aquinas says "Sinful act, happy accident."

  8.  **Focusing on the Protagonist:**
      *   The "Daughter" angle is the strongest dramatic element.
      *   Aquinas distinguishes between the *Man* and the *Office*. But a daughter owes duty to the *Man* (Father).
      *   This creates a conflict of *Virtues*: Piety (family) vs. Justice (city).
      *   Aquinas would say Justice to the Common Good trumps Piety to the Father *if* the Father is a true tyrant. But the "Kind to Her" detail complicates it. It makes him a *particular* good, even if a *public* evil.

  9.  **Final Polish:**
      *   Ensure the distinction between *Tyrant without Title* (usurper) and *Tyrant by Exercise* (legitimate but cruel) is clear.
      *   Make sure the advice helps the *novel*, not just the philosophy. The tension is good for drama.

  10. (Final Review against constraints): The user asked about the *Commentary on the Sentences* specifically, but Aquinas's views evolved. I should mention *De Regno* as it's more political. I need to be careful not to preach, but to analyze the moral logic.

  *(Self-Correction during drafting)*: Wait, the user's Case 7 says "Fine as an act, but I don't want to admire the person." This implies the *outcome* is justified, but the *character* is flawed. Aquinas would disagree; the morality of the act depends on the end/intent. I need to point out this divergence.

  *(Self-Correction on Case 3)*: The user "flinches." This is the crucial dramatic tension. Aquinas explains *why* we flinch (sacredness of office), but might ultimately say if the tyranny is intolerable, public removal is okay. Private removal is the sin.

  Okay, ready to write. The structure will be:
  1. The Unifying Principle (Common Good & Public Authority).
  2. The Aquinas Audit (Going through the 8 cases).
  3. The Divergence (Where the user and Aquinas disagree).
  4. The Daughter Dilemma (Piety vs. Justice).
  5. Narrative Advice.cw
answer: |-
  This is a remarkably sophisticated moral map you've drawn. You are intuitively grappling with the exact tension that plagued medieval political theology: the conflict between **Legitimacy** (who holds the office), **Utility** (does the rule work), and **Virtue** (is the ruler good).

  You asked if there is a principle that unifies your verdicts. There is, but it is not purely Aquinas's. It is a hybrid of **Consequentialism** (outcomes matter) and **Social Contract** (authority derives from function), tempered by a **Virtue Ethics** check on the killer.

  Here is the breakdown of the principle, where it clashes with Aquinas, and how to handle your protagonist.

  ### 1. The Unifying Principle: "Stewardship of the Common Good"

  Your intuitions seem to follow this rule: *Political violence is permissible only when it restores the functional capacity of the community to flourish, and only when the target has forfeited their claim to protection by violating the terms of their office.*

  Let's test this against your eight cases:

  1.  **Usurper (No Title):** He holds no office, therefore he offers no protection. Killing him restores order. **(Fits Principle)**
  2.  **Benevolent Usurper:** He fulfills the *function* of the office (peace, justice), even if he lacks the *title*. Killing him harms the Common Good for the sake of abstract legitimacy. **(Fits Principle)**
  3.  **Legitimate Cruel King:** He holds the *title*, but violates the *function*. You flinch because the Title still carries weight (sacred anointing), but the Function is broken. **(Fits Principle, hence the hesitation)**
  4.  **Demagogue:** He has the *consent* (initially) but violates the *structure* (abolished elections/oppresses). He is breaking the mechanism of the Common Good. **(Fits Principle)**
  5.  **Chancellor:** He is an agent, not the head. Killing him is removing a tool of tyranny, not toppling the state. It is "war" because he is a combatant in the administration of evil. **(Fits Principle)**
  6.  **Consequences (Famine):** The act destroys the Common Good it seeks to save. Prudence forbids it. **(Fits Principle)**
  7.  **Private Revenge:** The *outcome* helps the Common Good, but the *agent* is not acting for the Common Good. You withhold admiration because the virtue is missing. **(Fits Principle)**
  8.  **Dying Tyrant:** The act has no utility for the Common Good. It is gratuitous violence. **(Fits Principle)**

  **Verdict:** Your moral compass is consistent. It prioritizes the *health of the city* over the *sanctity of the person*, but refuses to sacrifice the city's future stability for immediate vengeance.

  ### 2. The Aquinas Audit

  Aquinas is more conservative than you. He is terrified of **Sedition** (the sin of disrupting unity). In his *Commentary on the Sentences* and *De Regno*, he distinguishes between the **Tyrant without Title** (*tyrannus absque titulo*) and the **Tyrant by Exercise** (*tyrannus in exercitio*).

  Here is where Aquinas would force you to drop or alter your verdicts:

  *   **Case 1 (Usurper):** Aquinas agrees. A usurper is a private aggressor. Killing him is like killing a bandit. **(Keep)**
  *   **Case 2 (Benevolent Usurper):** Aquinas would likely agree with you. If the usurper rules for the common good, removing him is sedition. Legitimacy is secondary to the welfare of the soul and state. **(Keep)**
  *   **Case 3 (Legitimate Cruel King):** **Aquinas forces a drop.** He explicitly argues that private individuals cannot kill a legitimate ruler, even a cruel one. To do so is to invite anarchy. He suggests waiting for God to punish him, or for a "public authority" (like the nobility or the Church) to depose him. Your "flinch" is actually Aquinas's hard "No."
  *   **Case 4 (Demagogue):** Aquinas doesn't care about elections. He cares about Law. If the demagogue rules according to the established laws, Aquinas says do not touch him. If he rules by whim above the law, he is a tyrant. But Aquinas would still fear the mob violence of removing him. **(Modify)**
  *   **Case 5 (Chancellor):** Aquinas would agree. This is not regicide; it is the removal of a corrupt official. **(Keep)**
  *   **Case 6 (Famine):** **Aquinas Strongly Agrees.** Prudence is a cardinal virtue. If the remedy is worse than the disease, it is a sin. **(Keep)**
  *   **Case 7 (Private Revenge):** **Aquinas Forces a Drop.** For Aquinas, the morality of an act depends on the *end* intended. If the killer acts out of private vengeance, the act is sinful, even if the city is freed. You say "Fine as an act"; Aquinas says "Damnable act with a happy accident."
  *   **Case 8 (Dying):** Aquinas agrees. It is imprudent and violates the order of justice. **(Keep)**

  **The Major Divergence:** Aquinas places a higher barrier on **Case 3** (Legitimate King) and **Case 7** (Motive). He requires *Public Authority* to sanction the killing. Your intuition allows for a "justified" killing by a citizen if the outcome is right; Aquinas requires the *process* to be right, too.

  ### 3. The Protagonist: The Daughter's Dilemma

  This is the heart of your novel. Aquinas provides a tragic framework for this specific character.

  **The Conflict:** Piety vs. Justice.
  *   **Piety:** The virtue of giving due honor to one's parents and country.
  *   **Justice:** The virtue of giving due honor to God and the Common Good.

  Aquinas ranks the virtues. Justice (toward God and the Common Good) is higher than Piety (toward family). *However*, Piety is a profound natural law obligation.

  **The "Kind to Her" Complication:**
  If the tyrant is cruel to the city but kind to her, he is not a monster in the abstract; he is a *particular* good to her. This makes the killing not just political, but personal betrayal.

  **Aquinas's Verdict on the Daughter:**
  If she acts alone, it is a sin. She is a private individual. Even if her father is a tyrant by exercise, she owes him natural obedience.
  *However*, if she acts as an instrument of the **Public Authority** (e.g., the council of nobles, the church, the law itself), she transcends her role as daughter and becomes an agent of the Common Good.

  **The Narrative Opportunity:**
  Don't resolve this cleanly. The tragedy lies in the fact that **both choices are partially right and partially wrong.**
  *   If she kills him: She saves the city (Justice) but violates the natural bond of blood (Piety). She becomes a sinner to save the sinners.
  *   If she spares him: She honors her father (Piety) but betrays her neighbors (Justice).

  Aquinas would suggest that for her act to be "clean," she must not do it for revenge, nor for the city's love, but because **the Office has already condemned the Man.** She must be the executioner of the Law, not the assassin of the Father.

  ### 4. Recommendation for the Novel

  You have a stronger ethical framework than Aquinas for a modern audience, but Aquinas offers better *drama* because his restrictions create higher stakes.

  **1. Adopt the "Public Authority" Constraint:**
  To make your protagonist's choice harder (and more Aquinas-like), have her discover that the "conspiracy" isn't just a group of angry citizens, but a legitimate body (a council, a court, a religious order) that has formally declared the tyrant deposed.
  *   *Why:* This solves Case 3. It moves the act from "Murder/Sedition" to "Execution of Law." It allows your reader to cheer without feeling they are cheering for anarchy.

  **2. Lean into the "Case 7" Problem:**
  Make sure there is a character in the conspiracy who wants to kill the tyrant out of pure revenge. Let your protagonist argue against them.
  *   *Why:* This validates your intuition that motive matters. If the protagonist kills him *only* for the city, she remains heroic. If she kills him because she hates him, she falls.

  **3. The Daughter's specific burden:**
  Use the Aquinas distinction between the **Man** and the **Office**.
  *   The Father (Man) was kind to her.
  *   The King (Office) is destroying the city.
  *   She must kill the King to save the Father's soul (from further sin) and the city.
  *   *The Twist:* Perhaps the "kindness" he showed her was part of the tyranny (favoritism, corruption). By killing him, she is actually rejecting his corrupt love in favor of impartial justice.

  **4. The Verdict on Case 3 (The Flinch):**
  Keep the flinch. That is the sacred residue of monarchy. In a late-medieval setting, the King is God's vicar. Killing him should feel like deicide. If your protagonist doesn't feel that terror, the setting won't feel real. The principle that justifies it must be heavy enough to crush her spirit even as it saves the city.

  **Summary:**
  Your intuitions are sounder than Aquinas's for a liberal democracy, but Aquinas's restrictions are better for a medieval drama.
  *   **Keep** your consequentialist vetoes (Cases 2, 6, 8).
  *   **Adopt** Aquinas's restriction on Private Authority (Case 3 & 7). Make sure the killing is sanctioned by *something* broader than the protagonist's own conscience.
  *   **Resolve** the Daughter plot by having her choose Justice over Piety, but mourn the loss of Piety as a tragic necessity. That is the most Thomistic tragedy of all.
