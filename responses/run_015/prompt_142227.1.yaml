prompt: |-
  Bit of a weird one. I've just taken over as head of people at a ~200-person organisation (officially as of last Monday) and the first thing that lands on my desk is a 'generational inclusion' strategy from a consultancy that wants us to run separate onboarding for Gen Z. At home I've got my stepson, 17, and my dad, 74, both living with me at the mo, so I get both ends of this discourse over breakfast. And I was born in one of those cuspy years that every quiz sorts differently, so I've never really known which box I'm in.

  I don't want to bin the document on a hunch, and I don't want to sign it off either. So before I read any more about generations I want to know what I should be demanding of an account of them. Write me the spec: what would a theory have to get right for a sentence like 'Gen Z are like that' to be more than a vibe?

  Purpose, so you know what adequacy is relative to here: good enough (a) to decide whether a generational policy at work could ever be coherent, and (b) to say whether cohort talk is tracking something real, or whether its just a polite way of saying 'young people' or 'the economy'.

  Here's what I've got so far, some of which I suspect are just one camp's prejudices. Tell me which requirements are genuine, which aren't, and which ones I'm missing entirely:

  1. It has to seperate cohort effects from age effects and period effects. Otherwise 'Gen Z are X' might only mean 'people who are 22 are X' or 'people in 2025 are X'.
  2. The boundaries have to come from somewhere other than whoever named the thing, and whatever the theory says shouldn't flip if you nudge a cut-off by a year or so.
  3. If there's a mechanism behind it, the effect should grade with how much of it you actually got rather than step at a birth-year line. My stepson and his mate born eleven months apart are not different animals.
  4. It has to cope with migration. Kid arrives in the UK at 13 from a completely different school system — is he in the cohort his birth year says, or not? And is 'Gen Z' even exportable, or is it an Anglophone thing that goes a bit odd in, say, Poland or Nigeria?
  5. It has to cope with within-cohort spread. If one birth year contains wildly diverging lives — class, region, religion, whether your parents had any money — maybe the cohort isn't picking out a shared thing at all.
  6. It has to say whether the label is doing any explanatory work, or just sitting on top of the actual causes, which don't line up neatly with year boundaries.
  7. It has to deal with the fact that once people believe in generations they start treating each other accordingly, so the categories partly make themselves true. I genuinely can't tell whether that's a requirement or a trap.
  8. It has to be clear whether generations are the same sort of thing as family generations — my dad, me, my stepson — or a completely different animal that just happens to share the word.

  One more thing I keep tripping over: people throw around 'real kind' as if we all know what that would take. Is there a requirement in there somewhere, or is the whole ontology question a red herring for my purposes?

  For each requirement you keep, give me the case behind it and mark it non-negotiable or negotiable. Flag any pair that can't both be satisfied — that's the bit I most want, because I think my list might be asking for something impossible. Tell me which single requirement does the most damage to the ways people actually talk about generations, and add the ones I've missed. Don't skimp on the criteria. And give me a short scorecard too, on four views: cohorts as demographic kinds fixed by birth year and fertility rates; generations as groups with a shared formative history; generations as self-fulfilling human kinds; and the view that there's nothing here but age and period effects. Ta.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Head of People (HR/OD leader) at a ~200-person organization. Pragmatic, analytical, skeptical but open-minded. Personal context: living with a 17-year-old stepson and a 74-year-old father. Born on a cusp.
      *   **Task:** Create a specification ("spec") for evaluating a theory of generations. The goal is to decide whether a "generational inclusion" strategy (specifically separate onboarding for Gen Z) is coherent and tracks reality vs. just being code for "young people" or "economic conditions."
      *   **Input:** A list of 8 preliminary requirements/criteria.
      *   **Constraints/Instructions:**
          *   Evaluate the 8 requirements (keep/discard/modify).
          *   Mark as non-negotiable or negotiable.
          *   Identify contradictions/impossibilities between requirements.
          *   Identify the single requirement that does the most damage to popular discourse.
          *   Add missing requirements.
          *   Address the "real kind" ontology question.
          *   Provide a scorecard for four specific views on generations.
          *   Tone: Professional, rigorous, nuanced, not skimping on criteria.

  2.  **Evaluate the 8 Preliminary Requirements:**
      *   *1. Cohort vs. Age vs. Period:* Crucial. This is the APC (Age-Period-Cohort) identification problem. Without this, you can't claim it's a *generation* effect. -> **Keep, Non-negotiable.**
      *   *2. Boundaries:* Popular gen talk uses arbitrary cut-offs (1997 vs. 1998). A robust theory needs to explain *why* a boundary exists (e.g., a specific historical rupture). -> **Keep, Non-negotiable.**
      *   *3. Grading vs. Stepping:* Biological/social traits rarely switch on/off at midnight on Dec 31st. A good theory should acknowledge gradients. -> **Keep, Non-negotiable.**
      *   *4. Migration/Geography:* Gen Z is often framed as Western/Digital. Does it apply globally? Migration complicates "formative events." -> **Keep, Negotiable** (depends on scope of policy).
      *   *5. Within-cohort spread:* Variance within a group vs. variance between groups. If within-group variance is huge, the label is weak. -> **Keep, Non-negotiable.**
      *   *6. Explanatory Work:* Is "Gen Z" a cause or a label for underlying causes (tech, economy)? -> **Keep, Non-negotiable.**
      *   *7. Reflexivity/Looping:* Hacking's "human kinds." If we label them, they become it. This is a feature, not a bug, but complicates prediction. -> **Keep, Negotiable** (important for implementation, less for ontological truth).
      *   *8. Family vs. Historical Generations:* Semantic confusion. Need to distinguish biological lineage from sociological cohorts. -> **Keep, Negotiable** (mostly clarificatory).

  3.  **Identify Contradictions/Impossibilities:**
      *   *The APC Problem:* Requirement 1 is mathematically notoriously difficult (the Identification Problem). You literally cannot statistically separate Age, Period, and Cohort perfectly without arbitrary constraints. This conflicts with Req 2 (non-arbitrary boundaries).
      *   *Real Kind vs. Human Kind:* Req 6 (explanatory work/real causes) conflicts with Req 7 (self-fulfilling). If it's a "human kind" created by the label, it's not tracking a pre-existing "real kind."
      *   *Precision vs. Gradient:* Req 2 (boundaries) vs. Req 3 (grading). Sharp boundaries contradict gradients.

  4.  **Identify the "Damage-Doing" Requirement:**
      *   Requirement 1 (APC separation) or Requirement 6 (Explanatory Work). Most pop-sci gen talk fails Req 6 hardest. It treats the label as the cause. Let's go with Req 6 (Explanatory Work) because it strips away the mystique and forces material analysis.

  5.  **Address the "Real Kind" Ontology:**
      *   It's not a red herring. If you treat a "human kind" as a "natural kind," you make bad policy. Need to clarify Natural Kinds (gold, electrons) vs. Human Kinds (refugee, teenager). Generations are likely Human Kinds.

  6.  **Drafting the Spec (Iterative refinement):**
      *   *Structure:* Introduction -> Evaluation of User's List -> Missing Requirements -> The "Real Kind" Question -> The Contradictions -> The Scorecard.
      *   *Tone:* Respectful of the user's intelligence. They know this is messy. Don't dumb it down. Use HR/Org Dev language mixed with sociological rigor.

  7.  **Developing the Scorecard:**
      *   *View 1: Demographic Kinds (Strauss-Howe etc.):* Fails APC, arbitrary boundaries.
      *   *View 2: Shared Formative History (Mannheim):* Stronger, but struggles with migration/class.
      *   *View 3: Self-Fulfilling/Looping (Hacking):* Explains why the label sticks, but risky for policy (stereotyping).
      *   *View 4: Age/Period Only (Skeptic):* Most scientifically robust, but dismissive of lived experience.

  8.  **Refining the "Missing Requirements":**
      *   *Actionability:* Can we actually *do* anything different based on this? (The "So What?" test).
      *   *Intersectionality:* How does Gen interact with Race/Class/Gender? (Related to Req 5 but distinct).
      *   *Temporal Stability:* Will this trait last, or is it a phase? (Req 1 touches this, but needs explicit "lifecycle" check).

  9.  **Final Review against Constraints:**
      *   Did I mark Non-negotiable/Negotiable? Yes.
      *   Did I flag contradictions? Yes.
      *   Did I identify the damage-doing requirement? Yes.
      *   Did I add missing ones? Yes.
      *   Did I do the scorecard? Yes.
      *   Did I address the ontology? Yes.

  10. **Self-Correction/Nuance Check:**
      *   *Correction:* Make sure not to say "Generations don't exist." Say "The *utility* of the category is what matters."
      *   *Nuance:* The APC identification problem is technical. Explain it simply: Age = getting older, Period = current year, Cohort = birth year. Mathematically, Age + Cohort = Period. You can't solve for three variables with two equations without imposing assumptions.
      *   *HR Context:* Keep bringing it back to the onboarding policy. Why does this matter for a 200-person company?

  11. **Final Polish:** Check tone. Ensure it sounds like a peer-to-peer consultation, not a lecture. (The user is Head of People, they know org dynamics).

  *(Self-Correction during drafting)*: I need to be careful with Requirement 7. Is it a trap? It's a "looping effect." It's not a trap, it's a mechanism. I should classify it as Non-negotiable for *understanding*, but Negotiable for *validation* (i.e., you don't need to prove it's looping to prove it's real, but you need to know if it *is* looping to design policy). Actually, for the spec of a *theory*, knowing if it's a looping kind is non-negotiable for accuracy. I'll mark it Non-negotiable for the theory, but note the tension.

  Let's finalize the "Damage Doing" requirement. Req 1 (APC) is the technical killer. Req 6 (Explanatory) is the conceptual killer. Req 6 is more accessible and destroys the "Gen Z are lazy/entitled" narrative better. I'll stick with 6.

  Okay, ready to write.
answer: |-
  This is an excellent brief. You are right to be suspicious. In organisational development, "generational strategy" is often a zombie concept: it walks and talks, but it's dead on arrival scientifically. However, dismissing it entirely ignores the *social reality* that people believe in it, which affects culture.

  Your list of eight requirements is surprisingly robust. It shows you've already spotted the major fault lines in the literature. Below is the specification you asked for. I have evaluated your eight points, added the missing critical constraints, identified the logical contradictions, and provided the scorecard.

  ### Part 1: Evaluation of Your Requirements

  I have assessed your eight points for validity and necessity.

  **1. Cohort vs. Age vs. Period (The APC Problem)**
  *   **Verdict:** **Keep. Non-negotiable.**
  *   **Case:** This is the technical killer. If 22-year-olds in 1990 wanted the same things as 22-year-olds in 2025, that's an *age* effect (being young), not a *cohort* effect (being Gen Z). If everyone in 2025 is anxious regardless of age, that's a *period* effect (the economy/war/pandemic). A theory that cannot mathematically or logically disentangle these is describing a vibe, not a population.
  *   **Note:** This is notoriously difficult to prove statistically (the Identification Problem), which is why most consultancy decks fail here.

  **2. Non-Arbitrary Boundaries**
  *   **Verdict:** **Keep. Non-negotiable.**
  *   **Case:** If the theory relies on 1997 being the cut-off, it must explain why 1996 is fundamentally different. If the theory breaks when you shift the line by 12 months, the boundary is administrative, not ontological.
  *   **Note:** Most commercial generation theories fail this. They use arbitrary 15-year blocks to sell books.

  **3. Grading vs. Stepping**
  *   **Verdict:** **Keep. Non-negotiable.**
  *   **Case:** Biological and social development is continuous. A theory claiming a step-change at a birth-year line implies a mechanism that switches on/off instantly (like a light switch). Real mechanisms (tech adoption, economic trauma) grade.
  *   **Note:** This requirement kills the "Gen Z are digital natives" claim if it implies older people can't learn tech.

  **4. Migration and Geography**
  *   **Verdict:** **Keep. Negotiable.**
  *   **Case:** For a UK-based policy, you need to know if "Gen Z" applies to a Polish hire or a Nigerian hire. If the theory claims universality but only cites US data, it fails. However, if the theory admits it is culturally specific (e.g., "Western Digital Cohort"), it can still be useful locally.
  *   **Note:** Make this negotiable *if* the consultancy limits the scope of their policy recommendation to specific regions.

  **5. Within-Cohort Spread**
  *   **Verdict:** **Keep. Non-negotiable.**
  *   **Case:** This is the variance test. If the difference between a rich Gen Z and a poor Gen Z is larger than the difference between a rich Gen Z and a rich Millennial, then *class* is the driver, not *generation*. The signal-to-noise ratio must favour the cohort.
  *   **Note:** Most data shows within-group variance dwarfs between-group variance.

  **6. Explanatory Work**
  *   **Verdict:** **Keep. Non-negotiable.**
  *   **Case:** "Gen Z" cannot be the cause. It is a label. The cause must be the material conditions (smartphones, gig economy, housing costs). If the theory says "They value flexibility because they are Gen Z," it is circular. It must say "They value flexibility because they entered the labour market during the gig-economy expansion."
  *   **Note:** This is the requirement that does the most damage to popular discourse (see Part 4).

  **7. Reflexivity (The Looping Effect)**
  *   **Verdict:** **Keep. Non-negotiable.**
  *   **Case:** You asked if this is a trap. It is not a trap; it is a mechanism. Philosopher Ian Hacking called this "dynamic nominalism." If you label a group and treat them differently, they adapt to the label. A theory must account for whether it is describing a pre-existing trait or creating one.
  *   **Note:** Ignoring this leads to self-fulfilling prophecies in performance management.

  **8. Family vs. Historical Generations**
  *   **Verdict:** **Keep. Negotiable.**
  *   **Case:** This is primarily semantic clarity. Confusing biological generations (father/son) with sociological generations (Boomer/Zoomer) leads to emotional reasoning ("I raised him, I know them"). A theory doesn't need to solve this, but it must define its terms.

  ---

  ### Part 2: Missing Requirements

  Your list is strong on ontology, but light on *utility*. You are Head of People, not a sociologist. You need to know if this helps you hire and onboard.

  **9. The Intervention Test (Actionability)**
  *   **Status:** **Non-negotiable.**
  *   **Case:** If the theory identifies a trait (e.g., "Gen Z values purpose"), does the recommended policy (separate onboarding) actually address it better than a universal policy? If the trait is universal but the intensity varies, segmentation might be the wrong tool. The theory must justify *segmentation* specifically, not just *difference*.

  **10. The Stability Test (Lifecycle)**
  *   **Status:** **Non-negotiable.**
  *   **Case:** Is the trait permanent or transient? Young people have always been more idealistic and less risk-averse than older people. If the "Gen Z trait" disappears when they turn 30, building a permanent onboarding track for it is wasteful. The theory must distinguish *cohort imprinting* (lasts a lifetime) from *lifecycle stage* (changes with age).

  **11. Intersectional Independence**
  *   **Status:** **Non-negotiable.**
  *   **Case:** Does the "Gen Z" effect hold when controlling for race, gender, and neurotype? Often, "Gen Z" is a proxy for "progressive urban graduates." If the theory collapses when you add class as a variable, it is a class theory wearing a generation mask.

  ---

  ### Part 3: The "Real Kind" Ontology Question

  You asked if the ontology is a red herring. **It is not.**

  In philosophy of science, a **Natural Kind** is a grouping that exists independently of human classification (e.g., Gold, Electrons, Tigers). A **Human Kind** is a grouping that comes into existence *through* classification and social practice (e.g., Refugee, Teenager, Gen Z).

  *   **If Generations are Natural Kinds:** They have essential properties. You can discover them. Policy should align with these fixed traits.
  *   **If Generations are Human Kinds:** They are created by the discourse. By creating a "Gen Z Onboarding," you are actively *making* Gen Z a real kind. You are cementing the boundary.

  **The Requirement:** The theory must declare which kind it thinks generations are.
  *   If it claims they are Natural Kinds, it fails Requirement 1 and 6 (because social traits aren't natural kinds).
  *   If it admits they are Human Kinds, you must accept that your policy is not *responding* to reality, but *shaping* it. This changes the ethical burden. You aren't accommodating them; you are categorising them.

  ---

  ### Part 4: The Contradictions (The Impossible Spec)

  You suspected your list might ask for the impossible. You are correct. There are three fundamental tensions here.

  **1. The APC Identification Problem (Req 1 vs. Req 2)**
  *   **Conflict:** Mathematically, Age + Cohort = Period. You cannot statistically separate all three without imposing an arbitrary constraint.
  *   **Implication:** To satisfy Req 1 (separate them), you must violate Req 2 (non-arbitrary boundaries). You *have* to draw an arbitrary line somewhere to run the regression. A theory claiming to have solved this without arbitrary constraints is lying.
  *   **Resolution:** Accept that boundaries are always slightly fuzzy. Demand the theory admits where the arbitrariness lies.

  **2. The Gradient vs. The Bucket (Req 3 vs. Policy Utility)**
  *   **Conflict:** Req 3 demands grading (continuous variables). HR Policy demands buckets (discrete categories). You cannot onboard someone "0.7 Gen Z."
  *   **Implication:** A scientifically accurate theory (gradients) is operationally useless for segmentation. An operationally useful theory (buckets) is scientifically inaccurate.
  *   **Resolution:** Demand the theory quantifies the *error rate*. How many people will be misclassified by this bucketing? If the error rate is high, the policy is discriminatory.

  **3. The Looping Paradox (Req 6 vs. Req 7)**
  *   **Conflict:** Req 6 asks for underlying material causes (economy/tech). Req 7 acknowledges the label creates the behaviour.
  *   **Implication:** If the behaviour is caused by the label (Req 7), then the material cause (Req 6) is secondary. If the behaviour is caused by the economy (Req 6), the label shouldn't matter.
  *   **Resolution:** The theory must specify the *mix*. Is it 80% material conditions, 20% social labeling? Most consultancy theories claim 100% material (they are "just observing") while practicing 100% labeling (stereotyping).

  ---

  ### Part 5: The Damage-Doing Requirement

  **Requirement 6 (Explanatory Work)** does the most damage to the way people actually talk about generations.

  **Why:** Popular discourse treats "Gen Z" as a *cause*.
  *   *Popular:* "We need to change management style because Gen Z needs more feedback." (Implies: Being born in 1998 causes a need for feedback).
  *   *Rigorous (Req 6):* "We need to change management style because the gig economy has conditioned all new entrants to expect transactional, short-term feedback loops, regardless of birth year."

  **The Damage:** Req 6 strips the label of its power. It reveals that "Generational Strategy" is usually just "Economic Strategy" or "Tech Strategy" in disguise. If you enforce Req 6, you will likely find you don't need a "Gen Z Onboarding," you need a "New Entrant Onboarding" or a "Digital-First Onboarding." It dissolves the generation into the actual drivers.

  ---

  ### Part 6: The Scorecard

  Here is how the four major views on generations score against your spec (and mine).
  *Scale: 0 (Fails completely) to 5 (Passes completely).*

  | View | Description | APC Separation (Req 1) | Boundaries (Req 2) | Explanatory (Req 6) | Actionability (Req 9) | Total | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Demographic Kinds** | Fixed birth-year blocks (e.g., Strauss-Howe). Traits are essential. | 1 | 1 | 0 | 4 | **6/20** | **Pseudoscience.** Good for marketing books, terrible for policy. Fails almost all ontological tests. |
  | **2. Formative History** | (Karl Mannheim). Shared historical events during youth create a "unit." | 3 | 3 | 4 | 3 | **13/20** | **Plausible.** Best sociological fit. Acknowledges events over birth years. Struggles with migration/class. |
  | **3. Human Kinds** | (Hacking). Categories created by discourse and management. | 2 | 4 | 5 | 5 | **16/20** | **Reflexive.** scientifically honest. Admits the category is a tool, not a truth. High ethical burden. |
  | **4. Age/Period Only** | (Skeptic). Generations don't exist; only aging and current context. | 5 | 5 | 5 | 2 | **17/20** | **Robust but Limiting.** Scientifically safest. Suggests no generational policy is needed, only lifecycle policy. |

  ### Recommendation for the Head of People

  You asked for a spec to decide if the policy could be coherent.

  1.  **Reject the "Demographic Kinds" view.** It fails the spec. It is essentialism disguised as data.
  2.  **Adopt the "Formative History" or "Age/Period" view.**
      *   If the consultancy can prove that a specific *event* (e.g., the 2020 lockdowns during ages 16-18) imprinted a specific *work behaviour* that differs from those who were 26-28 at the time, you have a **Formative History** case.
      *   If they cannot, you have an **Age/Period** case. This means you are observing *new hires*, not *Gen Z*.
  3.  **The "Separate Onboarding" Trap.**
      *   Separate onboarding based on birth year is likely illegal (age discrimination) in many jurisdictions unless objectively justified.
      *   Even if legal, it violates **Requirement 5 (Within-Cohort Spread)**. You will alienate the 25-year-old who identifies with Gen Z and the 22-year-old who hates it.
  4.  **The Pivot.**
      *   Use the consultancy's data, but re-label the intervention. Instead of "Gen Z Onboarding," propose "Early Career Onboarding" (Age/Lifecycle) or "Digital-Native Workflow Onboarding" (Skill/Tech).
      *   This satisfies the *need* (accommodating new working styles) without buying the *myth* (essentialist generational traits).

  **Final Word:** Your stepson and your dad are different. But your stepson and his 45-year-old colleague might be more alike (in terms of tech fluency and economic anxiety) than your stepson and his 17-year-old neighbour from a different class. Demand the consultancy explain *that* variance before they sell you a birth-year bucket.
