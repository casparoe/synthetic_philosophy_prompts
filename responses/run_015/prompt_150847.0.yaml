  **Subject: FAQ: Epistemic Scheduling 301 (Spring Semester Grading Policy)**
  **Posted by: Dept_Admin**

  Several students have requested clarification regarding the assessment structure for Epistemic Scheduling 301. Below is the official departmental guidance regarding the Surprise Assessment Protocol. Please read carefully before attempting to derive the exam date.

  **Q: On which day will the final examination occur?**
  A: The examination is scheduled for sometime during the final week of classes. However, per the Backward Induction Clause, the exam cannot be administered on Friday. If the examination has not taken place by Thursday at 11:59 PM, students will know with certainty that the assessment must occur on Friday. This knowledge negates the "surprise" condition required for credit. Therefore, Friday is administratively void.

  **Q: If Friday is void, is the exam on Thursday?**
  A: No. Once Friday is eliminated from the possible schedule, Thursday becomes the last possible day. If the exam has not occurred by Wednesday night, students will deduce it must be Thursday (since Friday is impossible). This deduction constitutes prior knowledge, violating the surprise constraint. Consequently, Thursday is also removed from the calendar. By applying this inductive logic recursively, no day of the week remains valid for the assessment.

  **Q: Does this mean there is no exam?**
  A: Correct. The logical structure of the syllabus prohibits the **occurance** of the exam entirely. However, students are still required to **recieve** a grade. Grades will be assigned based on your ability to remain ignorant of the schedule while attending class. If you arrive expecting an exam, you fail the surprise component. If you arrive expecting no exam, you fail the preparedness component. The optimal state is epistemic suspension.

  **Q: What is the policy on make-up exams?**
  A: Make-up exams are subject to the same surprise constraints. Scheduling a make-up exam requires announcing it will be a surprise, which immediately triggers the elimination chain described above. Therefore, make-up exams are theoretically impossible. Students who miss the non-event will be granted an Incomplete until the department resolves the paradox, likely never.

  **Q: Can I appeal my grade if I deduce the date?**
  A: If you successfully deduce the date, the exam is automatically cancelled for that cohort due to breach of surprise confidentiality. You will not **definatly** be permitted to take it. If you deduce the date incorrectly, you are marked down for poor logical reasoning. The only passing strategy is to refrain from reasoning altogether.

  **Q: What if the professor gives the exam anyway?**
  A: If the assessment is administered on, say, Wednesday, and you are surprised, the university considers this a clerical error in the logical framework. You may submit Form 88-B (Paradoxical Grievance) to contest the validity of your own surprise. Note that proving you were surprised validates the exam, but proving the exam was invalid suggests you shouldn't have been surprised. Appeals are processed in non-Euclidean time.

  **Q: Is attendance mandatory?**
  A: Yes. You must be present to be surprised by the absence of the exam. Absence implies you knew the exam wouldn't happen, which implies you solved the paradox, which voids your enrollment.

  The Department of Logic assumes no liability for existential dread, scheduling confusion, or the collapse of linear time resulting from this course structure. Please direct further inquiries to the void.
