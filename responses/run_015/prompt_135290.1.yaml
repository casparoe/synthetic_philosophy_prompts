  4.  **Evolutionary Trap:** Defensible. This avoids the agency problem. Once population density crossed a threshold, return was impossible. However, it weakens the "mistake" label, as the outcome was unavoidable given the starting conditions.
  5.  **Moral Regression:** False or conceptually confused. There is no evidence of a unified "egalitarian nature" that was corrupted. Forager violence and inequality varied widely.

  Crucially, data on forager caloric return rates ("affluence") does not prove social equality. High leisure time can coexist with status differentiation. Affluence describes energy budget, not power distribution. Therefore, even if foraging was "better" for health, it does not automatically prove it was more egalitarian. Furthermore, treating the transition as a "mistake" requires a chooser who never existed. History lacks a subject capable of rejecting farming globally. The "mistake" is a retrospective judgment, not a contemporary failure of rationality. This undermines the moral weight of the slogan.

  4. Do any readings support the contingency claim?

  Only the **Conscious Error Thesis** fully supports the contingency claim, as it presupposes that humanity could have chosen otherwise. If agents could reject farming, they could have rejected hierarchy. However, this reading is historically untenable. The **Evolutionary Trap Thesis** supports the link between farming and inequality but undermines contingency; if the trap was unavoidable once population pressures mounted, then inequality was inevitable given human reproductive patterns. The **Hierarchy Catalyst Thesis** offers a middle ground: if farming causes hierarchy, and farming was not biologically mandated, then hierarchy is contingent. However, this relies on the assumption that complex society cannot exist without farming, which is contested by evidence of complex hunter-gatherers. Ultimately, the slogan collapses under analysis. It conflates the avoidability of farming with the avoidability of hierarchy. Even if farming was avoidable (debatable), hierarchy might still emerge through other pathways like resource defense or population density. Therefore, the slogan cannot bear the weight of proving inequality is purely contingent without additional arguments separating subsistence from stratification. Your peer's argument requires the **Hierarchy Catalyst** reading to be true while avoiding the **Evolutionary Trap** implications. They must show that farming was not compelled by necessity *and* that hierarchy was not compelled by farming. The slogan alone does not prove this dual contingency.

  5. Bottom line

  The slogan is rhetorically powerful but analytically fragile. It serves as a useful provocation to challenge biological determinism, reminding us that current social structures have a history. However, its ambiguity makes it an unreliable foundation for rigorous argument. It conflates health with hierarchy and agency with structural constraint. To argue that inequality is contingent, one must disentangle the adoption of farming from the emergence of stratification. Relying on the slogan obscures these distinct causal mechanisms. It is better treated as a heuristic for questioning inevitability than as a factual premise. Use it to open the debate, not to close it.
