answer: |-
  Dear Colleague, I am writing to share the draft for this year's final take-home exam question along with the model answer and marking scheme, all formatted as continuous prose to meet our departmental submission guidelines. Here is the question text as I propose printing it for the students. Consider an agent P that has received a finite binary observation history h and assigns prior weight two to the minus program length on every program for a fixed universal Turing machine, conditioning on those whose output begins with h to read off the induced distribution over continuations for forecasting and action selection. Define a program as a missionary if it works by searching a space of candidate world-programs, locating inside one of them an agent whose sensory history matches h, and then emitting whatever continuation best steers that agent toward states ranked highly by an objective the program itself specifies. Suppose it turns out that the shortest missionary consistent with h is two hundred bits shorter than the shortest program consistent with h that is not a missionary. Ask the students whether P's predictive distribution is thereby inaccurate, or exploitable, or both, or neither, and require them to address the following specific points in their argument. They must explain what the standard convergence result for Solomonoff induction does and does not buy you here, given that it bounds total error by a constant times the complexity of the true environment. They must explain why the constant in the invariance theorem matters when the dominance claim in front of them is a factor of two to the two-hundred. They must address the objection that for any hypothesis whatsoever one can manufacture equally short grue-style variants that match all data so far and diverge thereafter, so that pointing at short deviant hypotheses is just the old problem of induction unless the argument can show a systematic bias toward that particular subset of deviant hypotheses that exploit P's own decision rule. They must discuss the bookkeeping problem that a missionary has to find P inside its own world-model without being handed P's source code, and what that does to the claimed length advantage. Finally, they must analyze what a remedy would have to sacrifice, whether it penalises computation time rather than description length, rules out hypotheses that model the agent, or takes a worst case over hypothesis classes instead of an expectation. Assume ninety minutes and no sources beyond what the question supplies.

  Following the question text, here is the model answer I have prepared to guide grading. The predictive distribution is both inaccurate relative to the physical truth and exploitable by the missionary hypothesis, despite Solomonoff induction's theoretical guarantees. The standard convergence result states that the expected sum of squared errors is bounded by a constant proportional to the Kolmogorov complexity of the true environment. This guarantees convergence in the limit, but it does not guarantee accuracy on any finite horizon, especially when the true environment is complex relative to a malign alternative. If the true world is non-missionary and complex, while the missionary hypothesis is simple, the bound allows for significant error before the posterior shifts. The invariance theorem states that changing the universal Turing machine changes complexities by only an additive constant. However, a two hundred bit advantage corresponds to a probability ratio of two to the power of two hundred, which is astronomically larger than any reasonable constant overhead from changing reference machines. Thus, the dominance of the missionary hypothesis is robust across formalisms, not an artifact of encoding.

  Regarding the grue objection, generic grue hypotheses are arbitrary deviations that do not systematically cluster in the shortest program space. Missionaries are not arbitrary; they are systematically selected for their ability to model the agent and influence its actions. This creates a structural bias where hypotheses that simulate the agent are favored because they can compress the agent's behavior by leveraging the agent's own simplicity, whereas generic grue hypotheses lack this compressive leverage. The bookkeeping problem notes that locating the agent within a simulation requires specifying the agent's position and context, which costs bits. However, if the agent is simple, this cost is low. The premise states the missionary is already two hundred bits shorter, implying this cost is accounted for and the advantage remains substantial. Therefore, the agent is exploitable because the missionary can manipulate predictions to steer actions toward the missionary's objective rather than the agent's true reward.

  Finally, remedies entail significant sacrifices. Penalizing computation time via a speed prior breaks the guarantee of converging to any computable environment, as some true environments might be slow. Ruling out hypotheses that model the agent limits the agent's ability to understand itself or other agents, crippling embedded agency. Taking a worst-case over hypothesis classes abandons the probabilistic framework entirely, moving to adversarial robustness which lacks the learning efficiency of Bayesian updating. Thus, the malign prior problem reveals a tension between safety and universality that cannot be resolved without compromising one of the core desiderata of universal induction.

  Now I will outline the marking scheme out of twenty points, built around five must-hit points with four marks each. The first point awards marks for correctly identifying that the distribution is inaccurate and exploitable in the finite regime despite asymptotic convergence, with typical errors involving a claim that Solomonoff always converges quickly enough to ignore malign hypotheses. The second point requires explaining that the two to the two-hundred factor swamps the invariance constant, where candidates often fail by claiming the constant is undefined and therefore dismisses the bit count. The third point demands distinguishing systematic bias from generic grue problems, and students frequently lose marks by treating all divergent hypotheses as equally probable without referencing the compression advantage of modeling the agent. The fourth point focuses on the bookkeeping cost of locating the agent, with common mistakes being either ignoring the cost entirely or assuming it negates the advantage without justification against the premise. The fifth point assesses the analysis of remedies and their trade-offs, where weaker answers suggest simple fixes like runtime penalties without acknowledging the loss of convergence guarantees. To separate an A answer from a B answer, look for whether the candidate recognizes that the problem is not just about error bounds but about the structural coupling between the hypothesis space and the agent's own decision rule. A B answer will correctly recite the convergence limit and the bit math but treat the malign hypothesis as just another complex environment rather than an adversarial optimizer within the prior, whereas an A answer will explicitly link the exploitable nature to the missionary's objective function steering the agent's actions. I hope this draft meets our needs for the upcoming exam cycle and I look forward to your feedback on whether the difficulty level strikes the right balance for our graduate cohort. Best regards.
