prompt: |-
  Retired last spring after 34 years running a hospital clinical chemistry lab — reference intervals, QC, method validation, and a lot of arguing with clinicians about whether a flagged result actually means anything. Since then I've been reading philosophy of medicine, and I keep having the feeling that the big fight over what disease *is* — the naturalists who say it's a value-free matter of statistically subnormal species-functioning (Boorse is the main name), versus the normativists who say you can't even finish stating the theory without values getting in (Canguilhem's line, the Scandinavians who build health out of a person's vital goals, and the people who argue the reference class has to be chosen rather than discovered) — is a fight I've already watched happen in a different vocabulary, except in my vocabulary nobody pretends it got settled.

  So here's what I want. Restate the debate, as faithfully as you can manage, in the language I actually think in: measurand, reference population, reference interval, medical decision limit, analytical versus biological variation, reference change value, pre-analyical variation, traceability, flagging rules, sensitivity and specificity, clinical utility, and the difference between "out of range" and "sick." Specifically: Boorse's statistical normality and his notion of functional ability; the naturalistic goal of survival and reproduction that his functions are supposed to be relative to; the normativist objections, including the ones about how the reference class gets picked and about situations where the same internal state counts differently; and the hybrid views that bolt a harm condition on top of a dysfunction condition. Which of those have real counterparts in lab terms, and which only look like they do?

  Then the part I actually care about, the residue report. Be honest about places where the translation gets helped along by assumptions that are mine and not theirs — if you catch yourself rendering a normative claim as a technical one just because the technical one was sitting there ready to hand, flag it instead of doing it quietly. And tell me where the leftovers point: at a genuine gap in my vocabulary, meaning there's something the philosophers can say that a lab simply has no way of saying, or at a debate that has less content than its length suggests.

  My working hunch, which I want you to attack hard if its wrong: naturalism is basically reference-interval thinking, normativism is basically decision-limit thinking, and the reason this has gone on for fifty years is that the two sides are describing different objects under one word. Right, or am I flattening something?

  Format: do the translation in prose first, organized by camp rather than by vocabulary term, so I can read it straight through. Then give me the residue report as a JSON object with exactly these fields:

  - translation_summary: string, three to five sentences on what the debate looks like once it's wearing lab clothes
  - items: array of objects, each with:
    - claim: the specific philosophical claim or move being translated
    - camp: "naturalist" | "normativist" | "hybrid"
    - lab_restatement: how it reads in my vocabulary
    - fidelity: "clean" | "strained" | "untranslatable"
    - what_bends: what the restatement distorts or has to drop; null if fidelity is clean
    - residue_owner: "lab_vocabulary" | "philosophers" | "both" — where the leftover points
    - note: one or two sentences
  - hunch_verdict: "right" | "partly_right" | "wrong"
  - hunch_critique: string
  - biggest_untranslatable: string — the single thing my framework can't say, and why it matters that it can't

  Give me at least eight items. If you honestly rate two or more of them untranslatable, say so; if nothing is untranslatable, don't manufacture one to please me.
