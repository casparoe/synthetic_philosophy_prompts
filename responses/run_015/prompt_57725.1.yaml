answer: |-
  ### The Debate in Lab Vocabulary

  **The Naturalist Position (Boorse)**
  In your terms, the Naturalist argues that disease is strictly a matter of the **Reference Interval (RI)**. They claim health is simply the statistically normal functioning of the species, which maps to the central 95% of a carefully selected **Reference Population**. The **measurand** here is "species-typical functional ability." When Boorse talks about survival and reproduction, he is describing the **biological variation** limits that evolution has set for homeostasis; if your analyte concentration pushes you outside the bounds where survival/reproduction is statistically typical, you have a dysfunction. For the Naturalist, the RI is discovered, not made. It is a fact of biology, like **traceability** to a higher-order standard. There are no values here, only **analytical variation** and biological truth. If the result is outside the RI, the system is broken. Whether that break causes trouble is a secondary issue; the disease exists the moment the flag triggers based on the population statistics.

  **The Normativist Position (Canguilhem, et al.)**
  The Normativist argues that you cannot stop at the Reference Interval. They claim that defining the **Reference Population** is itself a value judgment—who do we exclude as "unhealthy" to establish the baseline? That exclusion is a normative act, not a discovery. For them, health is not static normality but the capacity to adapt to **Medical Decision Limits (MDL)** set by the individual's life. A result can be within the population RI but still represent disease if it violates the patient's **vital goals** (clinical utility). They emphasize **pre-analytical variation**: the context of the patient's life matters as much as the analyte. A high cortisol level isn't disease if it's a response to stress (adaptation); it's disease only if it prevents the patient from functioning according to their own norms. Therefore, the MDL is not a biological constant but a negotiated threshold based on what counts as "harm" or "benefit" in a specific context.

  **The Hybrid Position (Wakefield, et al.)**
  The Hybrid view tries to run the assay with two controls. They agree with the Naturalist that you need a factual **dysfunction** (an analyte outside the RI or a broken physiological pathway) but agree with the Normativist that you also need **harm** (a breach of the MDL that impacts well-being). In lab terms, this is a **flagging rule** that requires both an analytical out-of-range result *and* a pathologist's review confirming clinical significance. A flag without harm is a false positive; harm without dysfunction is not a disease (maybe just social deviance). They try to secure **traceability** to biological facts for the dysfunction part while admitting the "harm" part relies on **clinical utility** judgments. They want the objectivity of the RI with the relevance of the MDL.

