answer: |-
  Your proposed principle—*obligation arises from channel control*—is strong, but as you suspect, it cracks under the weight of cases where the channel is public (the Biographer, the Lab, the Poet) or collective (Oaxaca). Your intuitions are not inconsistent; they are just tracking two different things simultaneously: the **integrity of relationships** and the **dignity of labor**.

  Here is the test of your principle, followed by the two formulations you requested, and finally the application to your unsettled cases.

  ### Testing Your Principle: "Channel Control"

  **Where it holds:**
  *   **Line Cook:** The recipe reached the cook through an employment channel the employer controlled. Verdict: *Not Fine.* (Matches).
  *   **Grad Student:** The idea reached the advisor through a mentorship/email channel the student controlled (for guidance, not theft). Verdict: *Not Fine.* (Matches).
  *   **Comedian (Verbatim):** The joke reached the thief through a performance channel (limited license to listen, not copy). Verdict: *Not Fine.* (Matches).
  *   **Dumpster Dive:** The prototypes reached the rival through a channel of waste, which implies an intent to destroy/abandon, not to circulate. Your uncertainty here is the principle working correctly: did the control extend to the trash? (Matches uncertainty).

  **Where it strains:**
  *   **Cabinetmaker:** The joinery reached the apprentice through a controlled channel (apprenticeship). Your principle suggests *Not Fine*, but your verdict is *Fine*.
      *   *Why:* The *telos* (purpose) of the channel differs. A cook is hired to execute; an apprentice is hired to absorb and eventually replicate. The control was waived for the purpose of replication.
  *   **Biographer vs. Lab:** Both facts reached the rivals through a publication channel (control relinquished).
      *   *Biographer:* You say *Not Fine*.
      *   *Lab:* You say *Fine*.
      *   *Why:* Your principle cannot distinguish these. Both are published facts. The difference is not the channel, but the *type of labor*. The biographer's fact is a unique historical attribution (narrative ownership); the lab's fact is a measurement of nature (universal truth).
  *   **Oaxaca:** The pattern reached the label through the public culture. There is no single originator with a "stake in controlling." Your principle requires an individual controller.
      *   *Why:* You feel an obligation exists despite no individual controller. This implies a duty to *community* or *heritage*, not just a channel.
  *   **Poet/AI:** The style reached the system through published books. The author controlled the book, but not the *use* of the style.
      *   *Why:* This is the hardest case. If publication relinquishes control, AI is *Fine*. If style is intrinsic to identity (like the Cabinetmaker's joinery, but externalized), it might be *Not Fine*.

  ---

  ### Principle 1: The Relational Contract (Simple)
  **The Formulation:** *You owe nothing for an idea found in the wild. You owe something only when you violate the implicit contract of the specific relationship through which the idea was transmitted.*

  **How it saves your verdicts:**
  *   It perfectly explains the **Line Cook** (employment contract) vs. **Cabinetmaker** (apprenticeship contract implies eventual independence).
  *   It explains the **Grad Student** (violation of academic trust).
  *   It explains the **Comedian** (violation of peer norms).
  *   It explains the **Dumpster** case: *Fine*. Once in the trash, the relational contract of ownership is terminated.
  *   It explains the **Poet/AI** case: *Fine*. Publication is a release into the wild; no relationship exists between the poet and the AI developers.

  **The Cost (Verdicts you must abandon):**
  1.  **The Oaxaca Case:** You must accept the fashion label's behavior as *Fine*. There is no specific relational contract between the label and the village.
  2.  **The Biographer Case:** You must accept the second biographer's behavior as *Fine* (or at least, not morally actionable). Once published, the fact is in the wild. (You would have to reclassify this as a breach of *academic norms*, not moral ownership).
  3.  **The Poet/AI Case:** You must commit to this being *Fine*. If there is no relationship, there is no debt.

  **What this says about "Ownership":**
  This principle confirms your suspicion: **It is not about ideas at all.** It is entirely about **relationships and expectations**. An idea is only "owned" insofar as it is a token in a specific social game (employment, mentorship, friendship). Once the token leaves the table, it belongs to whoever holds it.

  ---

  ### Principle 2: The Labor & Dignity Standard (Elaborate)
  **The Formulation:** *You owe the originator when: (1) a relationship is violated, OR (2) you appropriate the fruit of disproportionate labor without adding significant new labor of your own, OR (3) you sever the creator's identity from their expression in a way that diminishes their dignity.*

  **How it saves your verdicts:**
  *   **Cabinetmaker:** *Fine.* The apprentice added 10 years of their own labor to internalize the skill.
  *   **Line Cook:** *Not Fine.* Reproducing the dish requires no new labor; it is pure appropriation of the employer's asset.
  *   **Biographer:** *Not Fine.* The finding is the fruit of disproportionate archival labor; using it without a nod is free-riding (Condition 2) and steals credit (Condition 3).
  *   **Lab:** *Fine.* Scientific constants are treated as universal truths; using them is the *point* of the labor, not a theft of it. (The norm of science overrides the labor claim).
  *   **Oaxaca:** *Not Fine.* This satisfies Condition 2 (disproportionate generational labor) and Condition 3 (cultural dignity/identity), even without an individual controller.
  *   **Poet/AI:** *Not Fine (on some days).* This satisfies Condition 3. The AI severs the poet's identity from her style, selling the "manner" without the "person."
  *   **Dumpster:** *Not Fine.* Fishing prototypes out implies circumventing the intended destruction, violating the dignity of the R&D process (Condition 3).

  **The Cost (What this costs you):**
  1.  **Clarity:** This is not a bright-line rule. It requires adjudicating "disproportionate labor" (Is a decay constant less labor than a biographical fact?) and "dignity" (Is a joke style dignified?).
  2.  **Uncertainty:** You lose the ability to know the verdict until you weigh the competing interests. The **Poet/AI** case remains unstable because it depends on whether you view style as "identity" (protected) or "technique" (free).
  3.  **Paternalism:** You become the arbiter of what counts as "enough" labor to deserve protection.

  **What this says about "Ownership":**
  This principle suggests ownership is about **Unjust Enrichment and Moral Rights**. It admits that ideas *can* be owned, but only when they are inextricably linked to the *labor* that produced them or the *identity* of the producer.

  ---

  ### The Meta-Question: Ideas or Relationships?

  Your verdicts prove that **you do not believe in the ownership of ideas.**

  If you believed ideas were property, the **Simultaneous Theorem** case would be agonizing (who owns the truth?), but you find it easy (*Fine*). If you believed ideas were property, the **Cabinetmaker** would be theft (he took the master's designs), but you find it *Fine*.

  You are not tracking the *idea*; you are tracking the **equity of the exchange**.
  *   In the **Grad Student** case, the exchange was trust for guidance. The advisor broke the equity.
  *   In the **Cabinetmaker** case, the exchange was labor for knowledge. The apprentice paid the price.
  *   In the **Oaxaca** case, there was no exchange, only extraction. That feels wrong because it violates a norm of reciprocity, not property.

  **Verdict:** Your intuition is that "ownership of an idea" is a shorthand for "a breach of the normative expectations governing the transfer of value."

  ---

  ### Application to Your Unsettled Cases

  Here is how the two principles judge the cases you haven't settled.

  #### Case 1: The Employee Invention
  *An employee invents something on company time/equipment, but well outside their hiring scope.*

  *   **Relational Contract (Simple):** *Fine (Employee owns it).* The relationship was defined by the hiring scope. The "channel" of company time/equipment is a resource, not a claim on *all* output. Unless the contract said "everything you think," the relationship wasn't violated.
  *   **Labor & Dignity (Elaborate):** *Not Fine (Company owns it / Shared).* This triggers Condition 2 (Disproportionate Labor). The employee used the company's capital (equipment/time) to generate the value. Even if the idea was outside scope, the *resources* were the company's. To take it fully is to free-ride on the company's infrastructure.
  *   **My Recommendation:** Your intuition on the **Cabinetmaker** suggests you value the *labor of the individual* over the *resources of the master*. However, your intuition on the **Line Cook** suggests you respect the *boundary of employment*.
      *   *Likely Verdict:* **Shared Ownership.** The employee provided the spark (identity/labor), the company provided the soil (resources). To claim it entirely is to violate the equity of the situation, similar to the **Dumpster** case (using resources not intended for that end).

  #### Case 2: The Novelist's Memory
  *A novelist takes the bare shape of a plot (death in chapter 1, story told backwards) from a book read at 15, half-remembered, no contact with author.*

  *   **Relational Contract (Simple):** *Fine.* There is no relationship. The book was published (wild). The memory is internal. No channel was violated.
  *   **Labor & Dignity (Elaborate):** *Fine.* This is the **Comedian (Structural Trick)** case. A plot structure is a technique, not an identity. Unless the specific *expression* of that plot is copied, the "labor" involved in a plot shape is considered a building block of the craft, not a proprietary asset.
  *   **Likely Verdict:** **Fine.** This aligns with your **Cabinetmaker** verdict. The novelist has spent their own years learning to write; the plot shape is a tool they absorbed, like the joinery technique. To rule this *Not Fine* would paralyze all art. The **Biographer** case is different because that was a specific *fact* (attribution), not a *structure*.

  ### Final Synthesis

  You are struggling because you are trying to apply a **Property Framework** (who owns this?) to a **Relational Framework** (how did this get to you?).

  *   **The Simple Principle** is the honest one. It admits that once an idea leaves a relationship of confidence or employment, it is free. It forces you to accept that the **Oaxaca** case is a tragedy of the commons, not a theft, and that the **Poet/AI** case is legally and morally permissible (however distasteful).
  *   **The Elaborate Principle** is the comforting one. It allows you to protect the vulnerable (the village, the poet) but requires you to act as a judge of "sufficient labor" in every instance.

  If you want consistency, adopt the **Relational Contract**. It explains why the Cabinetmaker is free (the relationship was *for* learning) while the Line Cook is not (the relationship was *for* service). It explains why the Grad Student was wrong (betrayal of confidence). It forces you to accept that publication is a release of control.

  If you adopt this, your verdict on the **Poet/AI** case becomes clear: **Fine.** The poet sold the book. The channel was open. The debt is paid. The discomfort you feel is not about ownership; it is about **technological displacement**, which is a different moral problem entirely.
