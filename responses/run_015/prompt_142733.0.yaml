  **Note on Interpretive Choices**

  The poem leans heavily on the Inquisitor's stated motivation—love for humanity rather than cruelty—which some readers contest as self-deception or pride; I have treated his claim as sincere to preserve the tragedy of his logic. The most significant departure is the fifth stanza's introduction of "gears" and machinery; while the Inquisitor in the novel speaks only of his own ecclesiastical order, the prompt required him to recognize a technocratic future as his work's fulfillment. I am least confident in the line "The gears provide the bread without a fight," as the industrial imagery risks breaking the sixteenth-century voice, though I retained it to satisfy the requirement that the miracle become mechanical and faceless. The ending refuses to resolve the tension between his horror and his logic, keeping Christ's silence intact.
