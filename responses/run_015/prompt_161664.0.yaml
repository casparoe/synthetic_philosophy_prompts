  # MAPPING THE PHENOMENAL SPACE: A DECISION TREE
  **Module:** Philosophy of Mind (Year 2) | **Topic:** Realism, Illusionism, and the Hard Problem

  **Instructions:** Start at the root. At each node, answer the question based on the specific case or claim provided. Do not answer based on labels (e.g., "I am a physicalist"); answer based on the scenario. Follow the branch to your assigned position.

  ---

  ### ROOT COMMITMENT
  *"I am as certain as I am of anything that there is something it is like for me to see red."*

  ### NODE 1: The Retrospective-Insertion Case
  **Case:** You discover a vivid memory of last night's pain was confabulated; no nociceptive signal occurred at the time.
  **Question:** Did the *phenomenal feeling* of pain exist at the time of the event (t1), or only the memory representation at the time of recall (t2)?
  *   **(A) It existed at t1.** (The feeling was occurrent, even if the cause was misidentified). → **Go to Node 2 (Realist Track)**
  *   **(B) Only at t2.** (The 'feeling' is a narrative construct generated during recall). → **Go to Node 7 (Anti-Realist Track)**

  ---

  ### REALIST TRACK (There are occurrent phenomenal properties)

  ### NODE 2: The Causal Power Question
  **Claim:** Phenomenal states play a causal role in producing your behavior (e.g., you withdraw *because* it hurts).
  **Question:** Do you agree that phenomenality has causal power over physical behavior?
  *   **(A) No.** (Phenomenality is a byproduct with no physical effect). → **LEAF 1: Epiphenomenalism**
  *   **(B) Yes.** (Phenomenality helps drive the system). → **Go to Node 3**

  ### NODE 3: The Physical Base Question
  **Claim:** The causal power of phenomenality is grounded in a non-physical property or substance.
  **Question:** Does the phenomenal property require a non-physical base to exert its causal power?
  *   **(A) Yes.** (It interacts with the physical but isn't physical). → **LEAF 2: UNNAMED (Interactionist Property Dualism)** *[Coherent, rarely defended]*
  *   **(B) No.** (It is grounded in the physical). → **Go to Node 4**

  ### NODE 4: The Replay Case
  **Case:** A creature's complete causal-functional organization is stored and run once, frozen, with no behavioral output and no downstream environmental effects.
  **Question:** Does phenomenality occur in this frozen, isolated run?
  *   **(A) No.** (Phenomenality requires active engagement/embedding). → **LEAF 3: Non-Reductive Physicalism (Externalist/Enactivist)**
  *   **(B) Yes.** (Internal organization suffices). → **Go to Node 5**

  ### NODE 5: The Intrinsic Nature Question
  **Claim:** Physical descriptions only capture structure/function, not intrinsic quality.
  **Question:** Is phenomenality the *intrinsic nature* of the physical structure described in Node 4?
  *   **(A) Yes.** (Consciousness is what physical structure 'feels like' from the inside). → **LEAF 4: Russellian Monism**
  *   **(B) No.** (It is a structural/functional emergent property). → **Go to Node 6**

  ### NODE 6: The Fundamental Question
  **Claim:** Phenomenality emerges from complex computation.
  **Question:** Is phenomenality a fundamental feature of micro-physical entities, or strictly emergent at the macro level?
  *   **(A) Fundamental.** (Micro-entities have proto-phenomenal properties). → **LEAF 5: Panpsychism**
  *   **(B) Emergent.** (Only complex systems have it). → **LEAF 6: Non-Reductive Physicalism (Standard Emergentist)**

  ---

  ### ANTI-REALIST TRACK (Phenomenality is constructed or non-existent)

  ### NODE 7: [RECURSION NODE] The Illusion's Status
  **Case:** The introspective mechanism generates the *illusion* of phenomenality.
  **Question:** Is the *state of being under this illusion* itself something it is like to undergo?
  *   **(A) Yes.** (The 'seeming' is itself a phenomenal reality; the 'illusion' is just that it seems magical). → **LEAF 7: Quietism / Therapeutic Option**
  *   **(B) No.** (The illusion is a non-phenomenal cognitive state; 'what-it's-like' is purely metaphorical). → **Go to Node 8**

  ### NODE 8: The Zombie Testimony Case (4th Case)
  **Case:** A perfect functional duplicate of you says, "I have no inner life; I am a zombie."
  **Question:** Is the duplicate speaking the **truth**?
  *   **(A) Yes.** (We are all zombies; the report is accurate). → **LEAF 8: Illusionism (Frankish-Style)**
  *   **(B) No.** (The report is false or meaningless). → **Go to Node 9**

  ### NODE 9: The Reference Coherence Question
  **Claim:** The term 'phenomenal consciousness' fails to denote anything real.
  **Question:** Is the concept itself incoherent (like 'witch'), or just empty (like 'phlogiston')?
  *   **(A) Incoherent.** (The definition contains a contradiction). → **LEAF 9: Reference Failure (Error Theory)**
  *   **(B) Empty.** (The concept is clear, but nothing fits it). → **LEAF 10: Straight Eliminativism**

  ---

  ### LEAF SUMMARY
  1.  **Epiphenomenalism** (Real, Causally Inert)
  2.  **UNNAMED** (Interactionist Property Dualism)
  3.  **NRP (Externalist)** (Real, Causal, Embodied)
  4.  **Russellian Monism** (Real, Intrinsic Nature)
  5.  **Panpsychism** (Real, Fundamental)
  6.  **NRP (Emergentist)** (Real, Macro-Physical)
  7.  **Quietism** (The 'Seeming' is the Reality)
  8.  **Illusionism** (The 'Seeming' is a Non-Phenomenal Error)
  9.  **Reference Failure** (The Concept is Broken)
  10. **Straight Eliminativism** (The Concept is Empty)

  ---

  ### HONESTY SECTION: WHERE THIS TREE FAILS

  **1. The Bottleneck Node:**
  This tree secretly reduces to **Node 1 (Retrospective-Insertion)**. If you answer "Only at t2," you are forced into the Anti-Realist track regardless of your other intuitions. This stacks the deck against Illusionists who want to say the *current* seeming is real even if the *past* memory was confabulated. A sophisticated Illusionist might reject the binary at Node 1 entirely, but the tree forces a choice.

  **2. The Illusionism/Quietism Blur:**
  **Node 7 (Recursion)** attempts to separate Illusionism from Quietism, but this is the weakest distinction in the map. Quietists often argue that "something it is like" *just means* "the cognitive seeming," which makes them sound like Illusionists who refuse to use the word "illusion." The tree forces a verbal distinction where there may be no substantive disagreement.

  **3. Smuggled Assumptions:**
  The **Replay Case (Node 4)** assumes phenomenality is a property that can be "present" or "absent" in a frozen system. This smuggles in a Realist assumption about the *kind* of thing phenomenality is. An Enactivist might reject the question rather than answer "No," but the tree classifies that rejection as "Externalist NRP."

  **4. The Unnamed Slot:**
  **Leaf 2** is labeled "Unnamed" because while Interactionist Property Dualism is logically coherent, it is theoretically barren; it violates causal closure without the explanatory benefits of Substance Dualism or Russellian Monism. It exists in the logical space, but almost no one lives there.

  **5. Final Warning:**
  Use this handout to locate your *current* commitments, not to prove which view is true. If you find yourself wanting to draw a line between two branches, that is not a failure of your understanding; it is likely a failure of the taxonomy.
