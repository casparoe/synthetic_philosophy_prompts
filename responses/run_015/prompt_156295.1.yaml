answer: |-
  **Project Title:** Decoupling Payoff and Signal: A Hybrid Decision Problem

  **Project Summary**
  Rational choice theory currently faces a tension between two famous puzzles: Counterfactual Mugging and XOR Blackmail. In both cases, dominant strands of contemporary decision theory recommend an action that seems to sacrifice actual utility for the sake of a counterfactual condition. In the Mugging, you pay to secure a reward in a branch of reality you know did not occur. In the Blackmail, you pay to ensure you would not have received the blackmail letter in the first place. Standard justifications for these verdicts rely on the idea that your decision procedure determines outcomes across possible worlds. However, these justifications conflate two distinct mechanisms: using your decision to *constitute* a payoff in an unactualized branch, versus using your decision to *screen* evidence in the actual branch.

  This project constructs a hybrid decision problem where these two mechanisms are made to pull in opposite directions. By varying the accuracy of the predictor and the identity of the counterfactual beneficiary (a copy of you, a stranger running the same algorithm, or an unrelated stranger), I will test whether the standard verdicts remain stable. The goal is to determine if current decision theories rely on a unified account of counterfactual dependence or if they tacitly switch between incompatible justifications. This matters not only for formal decision theory but for any field relying on rational agency models, including AI alignment and normative ethics, where the status of obligations to non-actual or distant others is increasingly relevant.

  **The Research Question**
  Do the standard non-causal decision theories rely on a unified principle of counterfactual dependence, or do they generate their verdicts in Mugging and Blackmail cases by equivocating between *payoff constitution* (determining value in unactualized worlds) and *evidence screening* (determining what evidence one receives)?

  This question has a determinate answer. If the theories are unified, they should yield consistent verdicts in the hybrid case regardless of whether the counterfactual benefit is a payoff or an evidential filter. If they are not unified, the hybrid case will force a divergence: a theory might recommend paying to secure the counterfactual money while recommending refusing to avoid the letter, or vice versa, revealing a fracture in the underlying logic.

  **State of the Field and Theoretical Gap**
  Current approaches generally fall into two camps. Causal views refuse to pay in both cases, arguing that you cannot influence what has already happened or what happens in causally isolated branches. Non-causal views (often termed functional or timeless) recommend paying in both. However, the *reason* given for paying shifts between the cases without explicit acknowledgment.

  In the Mugging, the weight is carried by the claim that your algorithm's output in the actual world fixes the output in the counterfactual world, thereby "creating" the reward there. The move here is metaphysical: it treats the algorithm as the locus of value across worlds. In the Blackmail case, the weight is carried by the claim that your disposition determines whether the letter is sent at all. The move here is evidential: it treats your decision as a filter on your own total evidence.

  No existing treatment isolates these mechanisms. Consequently, it is unknown whether a theory can accept the Mugging verdict while rejecting the Blackmail verdict (or vice versa) without collapsing. If I can construct a scenario where paying secures the counterfactual reward *but* also ensures you receive damning evidence (or where refusing saves you from evidence but loses the counterfactual reward), the standard theories must reveal which mechanism is doing the heavy lifting. If they cannot adjudicate this without ad-hoc adjustments, the justification for the original verdicts is fragile.

  **Methodology and Work Plan**
  This is a one-year project compatible with a standard teaching load. The method is conceptual analysis via case construction, followed by stress-testing against standard decision matrices.

  *   **Months 1–3: Formalization.** I will formalize the hybrid case. The setup involves a predictor who conditions both the counterfactual payoff and the transmission of evidence on the agent's decision algorithm. I will define the parameters for predictor accuracy and the "distance" of the counterfactual beneficiary (copy vs. stranger).
  *   **Months 4–6: Stress Testing.** I will run the hybrid case against causal, evidential, and functional decision frameworks. I will look for breaking points: specifically, whether varying predictor accuracy causes the verdicts to flip for one mechanism but not the other. This phase involves drafting the core argument chapter.
  *   **Months 7–9: The Beneficiary Variable.** I will introduce the variation regarding who benefits in the counterfactual branch. If the theory demands paying even when the beneficiary is a stranger with no algorithmic connection, it suggests the theory relies on a controversial metaphysical claim about value. If it only demands paying for a copy, it relies on a claim about identity. I will draft the section on metaphysical implications.
  *   **Months 10–12: Synthesis and Integration.** I will finalize the dissertation chapter and prepare a standalone article for submission. This period includes integrating feedback from the committee and ensuring the "why it matters" argument is accessible to non-specialists.

  **Possible Conclusions**
  1.  **The Fracture Thesis:** Theories break under hybridization. This implies the standard verdicts in Mugging and Blackmail are unstable and require a new taxonomy of counterfactual dependence.
  2.  **The Robustness Thesis:** Theories hold firm. This implies that rational agency requires a commitment to algorithmic identity so strong that it overrides evidential self-preservation, a significant result for AI safety.
  3.  **The Equivocation Thesis:** Theories can only maintain the verdicts by using different justifications for each case. This undermines the claim that these theories offer a unified account of rationality.

  What decides between these is the coherence of the hybrid case. If the case is coherent and the theories yield contradictory or unstable outputs, the Fracture or Equivocation theses win. If the theories produce a stable output even when the mechanisms conflict, the Robustness thesis wins.

  **Significance and Broader Impact**
  For the decision theorist, this resolves a foundational ambiguity in how counterfactuals are weighted. For the generalist, the stakes are higher. We are increasingly building autonomous systems that must make decisions based on predictions of their own behavior. If our best theory of rationality cannot distinguish between buying a payoff in a non-existent world and filtering one's own evidence, we risk deploying agents that are vulnerable to exploitation or that pursue value in ways that are unintelligible to human operators. Furthermore, this touches on moral philosophy: do we have obligations to "counterfactual people" or distant strangers based solely on shared algorithmic structures? Clarifying the logic here prevents category errors in ethics and policy.

  **Risk and Failure Conditions**
  An honest assessment of failure is necessary. The project fails if the hybrid case turns out to be incoherent—for example, if the conditions required to link the payoff and the evidence screening are logically incompatible. If the setup collapses into a standard Mugging or a standard Blackmail case upon close inspection, there is no new leverage.

  Additionally, the project risks stalling if the "counterfactual payoff" intuition proves too weak. If it turns out that no plausible theory assigns value to payoffs in branches known to be unactualized (regardless of the algorithm), then the Mugging premise itself is the error, not the distinction between Mugging and Blackmail. In this scenario, the project would pivot to a critique of the Mugging premise itself, which remains a valuable outcome but requires reframing the dissertation chapter.

  ***

  **Advisor's Note to the Applicant (Regarding your "Two Projects" Worry)**

  You asked me to tell you if this is two projects. **It is one project, but you are right to feel the tension.**

  Here is the diagnosis: The "payoff to a counterfactual copy" worry is the *metaphysical engine* driving the paper. The "hybrid case" is the *experimental apparatus* you are building to test that engine. If you write a paper just about whether counterfactual payoffs are reasons, it will be purely metaphysical and risk spinning its wheels without leverage. If you write a paper just about the hybrid case without addressing *why* the payoff matters, it will look like a logic puzzle without stakes.

  **Do not split them.** The hybrid case is the only thing that makes the metaphysical worry urgent. By forcing the payoff mechanism and the evidence mechanism to compete, you force the theorist to admit whether they care about the payoff *because* it's a payoff, or *because* it signals something about the algorithm.

  **Advice for the Proposal:**
  I have framed the proposal to treat the metaphysical worry (the "stranger/copy" variable) as a specific variable within the main experiment (Months 7–9 in the work plan). This keeps it unified. If you find during Month 7 that the payoff intuition completely dissolves for strangers, *that* is your result. It proves that the Mugging verdict relies on a specific notion of algorithmic identity, not just counterfactual dependence. That is a single, coherent conclusion.

  **One tweak for the Committee:**
  The two generalists need to know why "algorithmic identity" isn't just nerd-speak for "personal identity." In the "Significance" section, I added the line about autonomous systems and AI safety. This signals that "algorithm" isn't just abstract math; it's the architecture of the agents we are actually building. That usually satisfies the "why this matters" requirement for non-specialists.

  You are ready to write. The framing is solid.
