      *   *Horn 2 (Epistemology):* To know something, we need a causal connection to it (based on the causal theory of knowledge). Abstract objects can't causally interact.
      *   *The Tension:* We want a unified theory of truth and knowledge. Platonism gives good truth conditions but bad epistemology. Nominalism/Constructivism gives good epistemology but bad truth conditions (math seems objective).
      *   *High School Level:* Need to simplify the semantics part. Focus heavily on the *reliability* of the connection between mind and abstract realm.

