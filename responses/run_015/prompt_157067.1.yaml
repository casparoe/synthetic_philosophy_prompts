answer: |-
  This is a remarkably coherent set of intuitions, even if they feel messy to you. You are grappling with the difference between **consent as a subjective state of mind** (did you want this?) and **consent as a moral transaction** (did you validly authorize this?).

  Your intuitions consistently reject a pure "but-for" test (would you have said yes if you knew the truth?) in favor of a **normative authority** test. You care about *who* controls the options, *what* kind of truth is owed, and *whether* the agent is acting as a sovereign.

  Here is a principle constructed to match your verdicts, followed by the honest assessment of where it strains.

  ### The Principle: Sovereign Authorization

  **Consent is valid if and only if the agent authorizes the act as a sovereign authority over their own body.**

  This breaks down into three necessary conditions. If any are violated, consent is void.

  #### Clause 1: Functional Capacity (The "Agency" Condition)
  *The agent must possess the functional cognitive ability to process the choice at the time of the act, and must not be acting under a mistaken belief that they lack the authority to refuse.*
  *   **Motivating Cases:**
      *   **Blackout drunk (Void):** No functional capacity.
      *   **Tipsy/Coherent (Valid):** Capacity threshold met.
      *   **Drunk/Regret (Valid):** Capacity existed at the time; subsequent regret does not retroactively void authority.
      *   **Mistaken Legal Right (Void):** Even if cognitively coherent, if you believe you *cannot* refuse, you are not exercising authority; you are submitting. (This addresses your unease: it distinguishes *ability to process* from *knowledge of sovereignty*).
      *   **Dementia (Content/Initiating) (Valid):** Current phenomenological state indicates functional capacity for *this* interaction, ratified by prior sovereign self.
      *   **Dementia (Refusing) (Void):** Current dissent overrides prior authorization because the current self lacks capacity to understand the override, preserving bodily integrity.

  #### Clause 2: Material Correspondence (The "Truth" Condition)
  *The agent's understanding of the act must correspond to the physical and normative reality of the act. Deception voids consent if it concerns the nature of the act, the identity of the actor, or the inherent physical risks. Deception does not void consent if it concerns inducements, social status, or emotional context.*
  *   **Motivating Cases:**
      *   **Clinician Impersonation (Void):** Deception about the *nature* of the act (medical vs. sexual).
      *   **HIV Status / Stealth Condom (Void):** Deception about *inherent physical risk* and the *physical boundaries* of the act.
      *   **Researcher Protocol (Void):** Deception about the *normative structure* of the interaction (research trial vs. guaranteed treatment). Even if the lie benefits the patient, it changes the *kind* of agreement entered into.
      *   **Single / "I Love You" (Valid):** Deception about *inducements* or *social context*. The physical act remains what was understood.
      *   **Racist Omission (Valid):** Race is a property of the person, not the physical definition of the act or its inherent biological risk. (This is the hardest pill for some, but it fits your intuition and distinguishes it from HIV).
      *   **Framing (90% Survival) (Valid):** This is selective truth, not falsehood. Material Correspondence requires no *lies*, not optimal *presentation*.

  #### Clause 3: Baseline Integrity (The "Freedom" Condition)
  *The choice must be made against a baseline of options that the partner (or those responsible for the situation) has not wrongfully manipulated. A threat is a wrongful reduction of the baseline; an offer is an expansion. Responsibility for the predicament matters.*
  *   **Motivating Cases:**
      *   **Fire/Promote Quid Pro Quo (Void/Valid):** Firing is a wrongful reduction of baseline (threat). Promotion is an expansion (offer), even if slimy.
      *   **Prison Guard (Food vs. Solitary):** Both Void. Why? Because the guard controls the *baseline* conditions of the prisoner's existence. "Extra food" is not a genuine offer when the guard controls the diet; it is an abuse of fiduciary power.
      *   **Lifeguard (Assets for Rescue) (Void):** The lifeguard has a duty to rescue. Monetizing a duty is a wrongful restriction of the baseline (holding safety hostage).
      *   **Desert Driver (Stranded vs. Found):** If he stranded you, he created the predicament (Threat/Coercion = Void). If he found you, he is offering a new option (Offer = Valid).
      *   **Third-Party Blackmail (Partner Unaware) (Void):** This is the critical test. Your intuition says the *yes doesn't count*. This principle agrees: Sovereignty is compromised by the coercion, regardless of the partner's knowledge. The partner may be *blameless*, but the *consent* is invalid. (This distinguishes the moral status of the act from the culpability of the partner).

  ---

  ### Application to New Cases

  **1. The Deliberately Annoying App Interface (Dark Patterns)**
  *   **Verdict:** **Void.**
  *   **Reasoning:** This violates **Baseline Integrity**. If saying "no" requires eleven clicks while "yes" requires one, the interface designer has artificially inflated the *cost* of refusal. This is structurally equivalent to a coercion where the "price" of saying no is made prohibitively high by the person asking. It treats the user's agency as an obstacle to be overcome rather than a sovereign authority.

  **2. The Surgeon Switching Techniques**
  *   **Verdict:** **Void.**
  *   **Reasoning:** This violates **Material Correspondence**. You consented to *Procedure A*. The surgeon performed *Procedure B*. Even if B is "equally good," it is a different physical invasion. Just as removing a condom changes the act without necessarily increasing physical pain, switching techniques changes the *authorized act*. The patient is the sovereign over their body, not the surgeon; the surgeon is a contractor, not a guardian.

  ---

  ### The Undecided Cases

  **1. Fear of Violence (Unspoken, Unrealized)**
  *   **Verdict:** **Valid (but morally tragic).**
  *   **Reasoning:** Under **Baseline Integrity**, coercion requires a *wrongful manipulation by the partner*. If he said nothing and never intended violence, he did not manipulate her baseline. Her fear is internal. While the *outcome* is non-ideal, the *transaction* was not coercive.
  *   **Caveat:** If his behavior was objectively threatening (looming, aggressive tone) even without explicit words, it shifts to **Void** under Baseline Integrity (implicit threat). If it is purely her internal anxiety, the principle says Valid.

  **2. Mistaken Legal Right to Refuse**
  *   **Verdict:** **Void.**
  *   **Reasoning:** Under **Functional Capacity**, sovereignty requires knowing you *have* sovereignty. If you believe you are legally compelled to comply, you are not consenting; you are obeying. This distinguishes it from the **Drunk** case: drunkenness impairs *judgment*, but legal ignorance negates *authority*.
  *   **Tension:** This requires that the source of the ignorance be external/structural (e.g., "police told me I have to") rather than purely internal confusion. If she just *assumed* she had no right with no external pressure, this verdict becomes harder to sustain.

  ---

  ### The Honest Audit: What You Might Have to Give Up

  You asked me to be honest about where the trenchcoat splits. There are two points of friction in your own data that this principle exposes.

  **1. The Third-Party Blackmail (Partner Unaware)**
  *   **The Conflict:** Your intuition says "her yes doesn't count" (Void). But standard moral practice usually excuses the *partner* if they are unaware.
  *   **The Sacrifice:** This principle sides with you: the consent is void. However, you must accept the implication that the partner is having sex without consent, even if they are not *culpable* for it. This creates a category of "innocent violation." If you are unwilling to label the partner's act as non-consensual (perhaps preferring "excused violation"), you must modify Clause 3 to be relational (consent depends on the *partner's* conduct, not just the agent's state).
  *   **Recommendation:** Keep your verdict. It protects the victim's status over the partner's comfort.

  **2. The Racism Case vs. The HIV Case**
  *   **The Conflict:** You say HIV lie = Void, Race omission = Valid.
  *   **The Sacrifice:** This principle sustains this by distinguishing *Physical Risk/Act Definition* from *Social Preference*. However, this is the most philosophically contested boundary. If you believe that race is fundamental to the *identity* of the partner in a way that HIV status is not, you might have to flip the Racism verdict to Void.
  *   **Recommendation:** Keep your verdict, but acknowledge that "Material Correspondence" is a normative line, not a natural one. We *decide* that biological risk is material to sex, but social preference is not. That is a political choice embedded in the principle.

  **3. The "Legal Right" vs. "Drunk" Tension**
  *   **The Conflict:** You lean Valid for Drunk (coherent), but Void for Legal Ignorance.
  *   **The Sacrifice:** This is the weakest link. If a person is coherent but mistaken about their rights, why is that different from being coherent but mistaken about the risks (which you might say voids consent)?
  *   **Resolution:** To keep this, you must insist that **Authority** (knowing you can say no) is a higher threshold than **Capacity** (being able to say no). If you find that too demanding, you must sacrifice the Legal Right verdict and call it Valid (placing the burden on the citizen to know the law).
  *   **Recommendation:** If this is for a reading group, keep the "Void" verdict. It makes for a richer discussion about whether consent requires *positive knowledge of rights* or just *absence of restraint*.

  ### Summary
  Your gut is tracking a **Sovereign Authorization** model. You view consent not as "agreement" but as "law-making." A sovereign cannot make law if they are incapacitated (Drunk), lied to about the jurisdiction (Clinician/HIV), or held at gunpoint (Coercion). But a sovereign *can* make bad deals (Promotion), date the wrong people (Racism/Single), or frame things poorly (Survival Stats).

  If you stick to this, you have a robust, defensible theory. Just be prepared to defend why "Authority" (Legal Right) trumps "Capacity" (Drunk), and why "Physical Risk" (HIV) trumps "Identity Preference" (Race). Those are the hinges the whole thing swings on.
