answer: |-
  Hi there, I completely sympathize with the whiplash you are experiencing because it is the central tension of our field right now and it feels like every seminar you attend swings the pendulum to one extreme or the other. You are asking for the specification of a theory that navigates the narrow ridge between logical omniscience and normative collapse, and to give you the full spec requires us to be precise about what work the theory is supposed to do. An adequate theory of bounded belief must first and foremost respect the distinction between competence and performance without reducing rationality to merely the latter. This means the theory needs to model the agent's cognitive architecture in a way that explains why Ana believes the Peano axioms but withholds judgment on a complex theorem until she sees the proof. The theory must allow her belief set to be deductively open without labeling her irrational, which means it cannot enforce closure under logical consequence as a synchronic norm. However, it cannot simply say anything goes, because once Ana sees the proof, she ought to believe the theorem, so the theory must account for dynamic updating where logical learning changes the doxastic state without changing the world. This requires a mechanism for logical learning that is not just world-elimination but something more like concept acquisition or awareness growth.

  Then you have Ben, whose case tests the theory's sensitivity to representation and cognitive load. Ben spots a simple inconsistency like believing p and believing not p immediately, but misses the same inconsistency when it is buried in jargon or distributed across a long derivation. An adequate theory must respect the distinction between explicit and implicit belief, or perhaps adopt a fragmentation model where beliefs are compartmentalized by context or topic, but it must do so without making rationality entirely relative to framing. The theory needs to explain why Ben is rationally required to fix the simple inconsistency but not necessarily blamed for the buried one, which implies that normative constraints must be sensitive to computational complexity or cognitive effort. This leads to the requirement that the theory must incorporate an ought implies can principle where the can is defined by feasible computational resources, not just metaphysical possibility. If the theory demands Ben fix the buried inconsistency immediately, it violates psychological realism, but if it says he is never required to fix it, it loses its normative force and becomes purely descriptive psychology.

  Regarding what is non-negotiable versus what are merely pet peeves of specific camps, the non-negotiables are that the theory must avoid triviality and it must avoid omniscience. Avoiding triviality means the agent cannot believe everything, including contradictions, as a default state, and avoiding omniscience means the agent cannot believe all logical consequences of their beliefs. These are the hard constraints because violating them makes the theory useless for modeling actual agents or prescribing norms for them. A pet peeve of the hyperintensional camp might be the use of possible worlds semantics, while a pet peeve of the fragmentation camp might be the insistence on a single unified belief set, but these are modeling choices rather than adequacy conditions. What matters is whether the model can deliver the right verdicts on Ana and Ben, not whether it uses impossible worlds or syntactic structures. However, there is a sense in which a subset of these requirements is jointly unsatisfiable if we insist on standard modal logic axioms alongside bounded rationality. Specifically, you cannot maintain the K axiom for belief distribution over implication while denying logical omniscience without modifying the semantics significantly, and some impossibility results suggest that any theory that is sensitive to logical complexity will fail to be closed under even trivial equivalences unless it introduces ad hoc constraints.

  The single requirement that knocks out the most candidates is the demand for a unified account of dynamic updating that preserves rationality across logical learning. Many theories can handle Ana's static state by using impossible worlds or syntactic approaches, and many can handle Ben's inconsistency by appealing to attention or fragmentation, but very few can explain how Ana moves from withholding to believing upon seeing the proof without collapsing back into omniscience or requiring a change in the logical space that feels ad hoc. The theory must explain how a logical truth can be informative, which challenges the standard possible worlds framework where logical truths are true in all worlds and thus carry no information. If you use impossible worlds to solve Ana's case, you often struggle to explain why some impossible worlds are more doxastically accessible than others in a way that respects Ben's sensitivity to simple versus buried inconsistencies. This is the killer constraint because it requires the theory to have a metric of logical distance or difficulty that is both normative and descriptive, and most formalisms lack the resources to define this without circularity.

  Where my line of thought is most likely to fail is in assuming that there is a single unified theory that can satisfy all these constraints without sacrificing too much formal elegance or computational tractability. I am banking on the idea that a fragmentation or awareness-based model can be normatively constrained enough to avoid collapsing into skepticism, but it is possible that the price of avoiding omniscience is losing the ability to model ideal rational agency altogether, which might be a bullet some theorists are willing to bite. What would change my mind is seeing a robust impossibility theorem that demonstrates that any theory satisfying the ought implies can constraint for logical learning necessarily fails to provide action-guiding norms for belief revision, or conversely, if a new formalism emerges that successfully models logical learning as a physical process without losing the normative grip on what agents should believe. Until then, we are stuck balancing the trade-offs, and I suspect the best we can hope for is a theory that is adequate for specific domains rather than a grand unified theory of bounded belief. I hope this helps you navigate the literature, and let me know if you want to drill down into any specific formalism. Best wishes with the second year.
