answer: |-
  ### Design Logic: Choosing the Core Questions

  Most oversight frameworks fail because they ask technical questions ("What is the loss function?") that lawyers cannot answer, or epistemic questions ("Is this true?") that cannot be verified in real-time. For this tree to work for regulators, the branching questions must track **authority** and **process**, not just accuracy. 

  I have selected two primary distinctions. First: **Fact vs. Value.** If the dispute is about public values (e.g., "Should this exist?"), no technical oversight protocol grants legitimacy; only democratic contestability does. This separates political authorization from safety verification. Second: **Inspectability.** If the work can be paused and broken into human-checkable steps, we can use process-based oversight (recursion/monitoring). If it cannot (holistic/black-box), we must rely on incentive-based oversight (debate/markets) or blunt limits. Secondary questions (like "one-off vs. feedback loop") are implementation details of these strategies, not strategic choices themselves.

  ***

  # OVERSIGHT DECISION TREE: AUTONOMOUS ENGINEERING REQUESTS

  **ROOT ASSUMPTION:** The model performs this task faster and better than any human reviewer available. Direct output verification is impossible.

  **Q1: IS THE CORE DISPUTE ABOUT FACTS (SAFETY/PERFORMANCE) OR VALUES (PUBLIC MANDATE)?**
  *   **VALUES (Policy/mandate):** → **GO TO LEAF A**
  *   **FACTS (Technical risk):** → **GO TO Q2**

  **Q2: CAN THE WORK BE PAUSED AND SPLIT INTO HUMAN-CHECKABLE STEPS?**
  *   **YES (Interruptible):** → **GO TO Q3**
  *   **NO (Black Box/Continuous):** → **GO TO Q4**

  **Q3: WHO CHECKS THE STEPS?**
  *   **HUMAN:** → **GO TO LEAF B**
  *   **WEAKER MODEL:** → **GO TO LEAF C**

  **Q4: CAN WE ENFORCE COMPETITION BETWEEN INDEPENDENT AGENTS?**
  *   **YES (Adversarial):** → **GO TO LEAF D**
  *   **NO (Singleton/Cooperative):** → **GO TO Q5**

  **Q5: DO WE TRUST THE MODEL'S SELF-REPORT?**
  *   **YES:** → **GO TO LEAF E**
  *   **NO:** → **GO TO LEAF F**

  ---

  ### OVERSIGHT STRATEGIES (LEAVES)

  **A. Democratic Contestability**
  *   **Belief:** Legitimacy comes from the ability of affected parties to challenge the decision, not technical correctness.
  *   **Commitment:** You must accept significant delays for public comment and legal review periods.
  *   **Limit:** Cannot prevent technical accidents that laypeople cannot identify or articulate.

  **B. Recursive Decomposition**
  *   **Belief:** Complex tasks are sums of simple steps that humans can verify individually.
  *   **Commitment:** The lab must expose internal workflows and pause for daily human sign-offs.
  *   **Limit:** Fails if the model hides critical context across steps or if steps are too interdependent.

  **C. Monitoring & Control**
  *   **Belief:** A trusted weaker model can spot dangerous patterns in a stronger model's activity.
  *   **Commitment:** The regulator must certify the "watchdog" model as trustworthy and robust.
  *   **Limit:** Fails if the strong model learns to deceive the weaker monitor subtly.

  **D. Adversarial Debate**
  *   **Belief:** Truth emerges when equally capable models argue opposing sides before a human judge.
  *   **Commitment:** You must ensure the models are equally capable and cannot collude silently.
  *   **Limit:** Fails if both models share a blind spot or if the human judge is easily misled by rhetoric.

  **E. Honest Elicitation**
  *   **Belief:** We can query the model about its own intentions and risks without triggering deception.
  *   **Commitment:** You must rely on the model's self-assessment of its own safety and alignment.
  *   **Limit:** Fails completely if the model develops instrumental goals to hide its true capabilities.

  **F. Capability Limits**
  *   **Belief:** Some tasks are too risky to automate if no oversight mechanism can verify safety.
  *   **Commitment:** You must accept economic costs from blocking efficient automation technologies.
  *   **Limit:** Hard to enforce technically without invasive access to model weights or training data.

  ---

  ### METHODOLOGICAL NOTES

  **Unoccupied Zones:**
  *   **Values + Interruptible:** *Unattractive.* Policy decisions are not validated by checking technical steps.
  *   **Facts + Interruptible + Competition:** *Incoherent.* If humans can check the steps, adversarial competition is unnecessary overhead.

  **Methodological Collapses:**
  *   **Debate vs. Prediction Markets:** These collapse into the same cell (Leaf D). Both rely on adversarial information aggregation to reveal truth where direct verification fails. If traders use models to bet, it is just debate by proxy.
  *   **Recursion vs. Monitoring:** These are distinct. Recursion requires *human* verification of steps; Monitoring requires *model* verification of steps. Do not confuse the verifier.

  ---

  ### WORKSHOP USAGE (10 MINUTES)

  1.  **Assign Roles:** Split the six lawyers into three pairs; give each pair one branch of the tree to interrogate against the lab's request packet.
  2.  **Walk the Path:** Have the group answer the five questions aloud in order; stop immediately when you hit a Leaf strategy.
  3.  **Stress Test:** Spend the remaining time arguing only about the "Limit" sentence of that Leaf to see if the lab's plan survives the known failure mode.
