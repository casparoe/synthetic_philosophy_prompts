      *   **Context:** A proposal to allow six-story apartments by right on single-family lots within a half-mile of rail stations. Conditions: Replace demolished rental units at comparable rents, offer funded right to return to displaced tenants.
      *   **Participants:** Neighbor 1 (Pro-Upzoning/Supply/YIMBY-leaning), Neighbor 2 (Anti-Displacement/Tenant Protection/YIMBY-by-tenure-leaning).

  2.  **Deconstruct the Exchange (Move-by-Move):**

