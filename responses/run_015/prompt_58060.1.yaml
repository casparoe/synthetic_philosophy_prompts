      *   **Move 2 (Neighbor 2):**
          *   *Argument:* "Right to the city" also protects current vulnerable renters from uprooting/network loss. Formal right to return is weak (temp relocation, pressure, informal support breakup).
          *   *Core Claims:* 1. Displacement harms social capital. 2. Policy safeguards (right to return) are often ineffective in practice.
          *   *Evaluation:* Strong on the micro-sociological claim (social networks matter). Strong on the implementation skepticism (rights on paper $\neq$ rights in practice). Highlights the difference between *physical* housing and *community*.

      *   **Move 3 (Neighbor 1):**
          *   *Argument:* Replacement + funded return addresses direct displacement. Added supply eases rent pressure citywide. Confusing participation (voice) with veto (control) is a mistake.
          *   *Core Claims:* 1. Mitigation measures are sufficient. 2. Supply reduces rents (filtering/overall pressure). 3. Veto power is undemocratic/unfair.
          *   *Evaluation:* Claim 1 is debatable (see Move 2's rebuttal). Claim 2 is economically contested (supply helps long-term/regionally, less so immediately/local). Claim 3 is a strong democratic theory point (NIMBYism often acts as a veto).

      *   **Move 4 (Neighbor 2):**
          *   *Argument:* Citywide supply effects are diffuse/delayed; demolition effects are concentrated/immediate. Future residents aren't the relevant community for procedural fairness when current homes are at stake.
          *   *Core Claims:* 1. Cost/Benefit asymmetry (concentrated loss vs. diffuse gain). 2. Definition of "community" for procedural justice (current vs. future).
          *   *Evaluation:* Strong on the political economy of costs/benefits (Olson's Logic of Collective Action). Strong on the definition of stakeholding (who gets a vote *now*).

  3.  **Adjudicate Specific Points:**

      *   *Exclusion vs. Access (Move 1):* Neighbor 1 is right. Single-family zoning near transit is a documented barrier to opportunity.
      *   *Social Networks vs. Formal Rights (Move 2):* Neighbor 2 is right. "Right to return" policies frequently fail to retain the *same* people due to construction delays, rent hikes upon return, or loss of informal community ties.
      *   *Supply Effects (Move 3):* Neighbor 1 is partially right but oversimplifies. Supply helps regionally over time, but doesn't guarantee local affordability immediately. Neighbor 2 is right about the timing mismatch.
      *   *Veto vs. Voice (Move 3):* Neighbor 1 is right procedurally. In a democracy, existing residents shouldn't have veto power over lawful zoning changes that serve a public good.
      *   *Concentrated Costs vs. Diffuse Benefits (Move 4):* Neighbor 2 is right. This is a classic collective action problem. The pain is real and immediate for the few; the gain is abstract and future for the many.
      *   *Definition of Community (Move 4):* Neighbor 2 is right regarding *procedural* fairness for the specific decision, but Neighbor 1 is right regarding *distributive* justice for the broader population.

  4.  **Overall Assessment (Who is "More Right"?):**
      *   This isn't a binary win/loss. It's a clash of values (Distributive Justice vs. Procedural/Protective Justice).
