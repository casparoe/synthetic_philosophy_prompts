answer: |-
  A metropolitan housing cooperative formally elected a Board Chair who subsequently ignored critical structural repairs to embezzle funds, putting residents at imminent risk of building collapse. The cooperative bylaws contain a "sunset clause" permitting removal only after a mandatory six-month review period, a delay structural engineers warn will likely result in severe injury or death. Members are now debating whether to forcibly eject the Chair immediately to ensure safety or wait for the clause to expire to maintain procedural integrity.

  Under Aquinas's conditions, the members may not resist before the clause expires because the Chair was formally elected, granting him legitimate authority. Aquinas distinguishes between a usurper, who may be resisted by private individuals, and a legitimate ruler who becomes tyrannical; in the latter case, private force is forbidden because it undermines the order necessary for the common good, and removal must await public authority or legal process. A plain act-utilitarian analysis, however, would likely permit immediate resistance. It calculates the net harm of the delay (potential death and injury) against the harm of breaking the bylaws (procedural instability), concluding that preventing physical suffering maximizes overall well-being regardless of the leader's initial legitimacy.

  The specific feature that makes the two theories diverge is the **formal election**. For Aquinas, the election establishes a moral bond that prohibits private violence even when the common good is threatened; for the utilitarian, the election is morally neutral data that cannot outweigh the tangible harm caused by waiting. If the sunset clause is removed, the divergence collapses because both theories would endorse immediate legal removal, eliminating the conflict between waiting and acting. To the utilitarian objection that the delay itself makes the distinction morally cruel, a defender of Aquinas's view would answer that undermining legitimate authority invites greater long-term chaos and violence than the specific harm suffered now, positing that social order is a prerequisite for the common good that outweighs immediate consequences.
