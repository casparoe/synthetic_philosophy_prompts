answer: |-
  Here are ten interview questions (five main lines of inquiry with paired follow-ups) designed to press the Negative Curation Thesis as a rigorous philosophical claim.

  **1. Ontology of Causal Power**
  You argue that archival silences are not merely missing data but actively maintained structures that confer authority on surviving records. For silence to *confer* authority, it must possess some form of causal power. Do you posit that these silences exist as independent causal agents in the world, or are they merely descriptive labels we apply to the effects of institutional inertia?

  *   **Follow-up (if she argues silence functions as a negative predicate within a logical space):** If silence is merely a negative predicate—akin to saying "the room is not hot"—it describes a state of affairs but does not typically explain an outcome. How can a logical negation, which lacks positive being, exert the causal force required to *sanction* the authority of the surviving record?

  **2. Ontological Location**
  Let's press the ontological status of these absences further. Is the silence a property of the missing document itself (the destroyed registry), or is it a relational property of the surviving files (the property deeds)? In other words, does the silence vanish if the surviving record is destroyed, or does it persist as a feature of the historical landscape?

  *   **Follow-up (if she argues silence functions as a negative predicate within a logical space):** If the silence is defined relationally by the survivor, it seems dependent on the very archive it is supposed to critique. If it operates like a negative predicate within the archive's logical space, doesn't that trap the silence inside the system of authority it is meant to undermine, rendering it incapable of offering an external critique?

  **3. The Conspiracy Objection**
  Critics might argue that attributing active structural power to absence risks collapsing into a conspiracy theory, implying a conscious agent behind every gap. How do you distinguish your thesis from the claim that archivists are intentionally suppressing truth, without diluting the "active" nature of the curation you describe?

  *   **Follow-up (addressing the distinction between deliberate erasure and structural neglect):** You often distinguish between deliberate erasure and structural neglect. But if the *effect* on the historical record is identical—informal agreements decay while formal deeds survive—does the lack of malicious intent matter ontologically? Can structural neglect truly be "active" curation if no one is steering the ship?

  **4. Digital Archives and Reversibility**
  Your thesis relies heavily on the finality of loss—the idea that the absence is fixed. Yet, in digital archives, deletion is often technically reversible, and metadata traces persist even when content is removed. Does the porous nature of digital absence undermine the claim that these silences are genuinely "curated" in your sense?

  *   **Follow-up (probing whether reversibility undermines curated absence):** If a digital absence is recoverable through forensic metadata, it suggests the silence is temporary rather than structural. If the absence isn't final, can it still function as the positive sanction you describe, or does digital technology fundamentally dissolve the possibility of negative curation?

  **5. Ethical Obligations of the Historian**
  If silences are productive forces rather than empty gaps, does the historian have an ethical duty to reconstruct what was erased, or is there a duty to preserve the silence as evidence of the archive's violence? Is the goal to fill the void or to document its shape?

  *   **Follow-up (if she replies that reconstruction risks re-inscribing the authority of the original archive):** If reconstructing the lost testimony risks validating the archive's original categories and re-inscribing its authority, what methodological tools are left to the historian? Are we limited to a purely negative theology of history, where we can only speak of what is not there?
