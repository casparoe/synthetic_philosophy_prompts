answer: |-
  **1. The trap**

  Section 12(3) requires costs to be borne by identifiable persons. However, long-term policies often alter conception timing, partners, or family size. This creates a non-identity problem: if a policy changes who is born, the resulting people cannot claim they are worse off than they would otherwise have been, because without the policy they would not exist at all. Strictly applied, this logic zeroises costs for any programme affecting future generations, as the affected population is entirely swapped. To comply with the regulation without absurd results, we must adopt a pragmatic assumption that identity is fixed for costing purposes within a specific timeframe, treating future persons as if they were the same individuals who would have existed under the status quo.

  **2. The procedure**

  **Step 1: Triage**
  Classify the proposal's impact on future population identity using the following labels:
  *   **L (Locked):** The policy does not alter conception timing, partners, or family size for the affected cohort. (e.g., treating a disease in existing adults).
  *   **S (Swapped):** The policy alters conception timing or partners, but the total number of people remains roughly stable. (e.g., IVF timing changes).
  *   **T (Thinned/Thickened):** The policy alters the total number of future people. (e.g., child benefits changing family size).
  *   **M (Mixed):** The policy affects different groups differently.

  **Step 2: The Locking Horizon**
  Apply a **10-Year Locking Horizon** from the date of policy implementation.
  *   **Within Horizon (Years 0–10):** Apply the **Counterfactual Identity Assumption**. Treat future persons as if they are the same individuals who would have existed under the status quo. Count all costs and benefits to these persons under s.12(3).
  *   **Beyond Horizon (Years 11+):** Assume identity is indeterminate. For **S** and **T** cases, do not count costs to future persons as quantified financial impacts under s.12(3). Record them as qualitative generational impacts only. For **L** cases (e.g., long-term infrastructure used by existing owners), costs may still be counted if tied to existing legal persons.

  **Step 3: Sufficiency**
  Use available epidemiological or demographic modelling to determine classification.
  *   **Data Present:** Use the model's conception/birth projections to assign L, S, or T.
  *   **Data Absent:** If modelling does not specify conception shifts, default to **L (Locked)**. This prevents analysis paralysis and ensures costs are not erroneously zeroised due to missing data.

  **Step 4: Stop and Hand-Up**
  *   **Stop (No Count):** If the proposal is classified **S** or **T**, and >80% of the quantified costs fall beyond the 10-Year Locking Horizon. Write "No countable cost to persons under s.12(3)" and close the file.
  *   **Hand-Up (Values Call):** If the proposal is **M (Mixed)**, or if significant costs straddle the Horizon boundary with high uncertainty. Flag this in the annex as "Identity Sensitivity Risk" and require ministerial direction on whether to proceed with the Counterfactual Identity Assumption beyond 10 years.
  *   **Proceed:** If the proposal is **L**, or if >80% of costs fall within the Horizon. Proceed with standard costing.

  **3. Three cases**

  **Case 1: Publicly Funded IVF (Freeze-All Protocol)**
  *   **Triage:** **S (Swapped).** Transferring embryos months later changes conception timing, resulting in different children, though total numbers remain stable.
  *   **Horizon:** Children are born within Year 1–2 of the policy. This is well within the 10-Year Locking Horizon.
  *   **Application:** Apply the Counterfactual Identity Assumption. We treat these children as the same persons who would have been born under the old protocol for costing purposes.
  *   **Result:** **Proceed.** Count all medical and social costs associated with the children. The non-identity issue is legally neutralised by the Horizon rule.

  **Case 2: Means-Tested Child Benefit**
  *   **Triage:** **T (Thinned/Thickened).** Financial incentives alter completed family size, changing the total number of future people.
  *   **Horizon:** Impacts accrue over 25 years. Children born in Years 1–10 are within the Horizon. Children born in Years 11–25 are beyond.
  *   **Application:** Count costs for children born within the first 10 years using the Counterfactual Identity Assumption. For years 11–25, costs to the *additional* children cannot be counted under s.12(3) as their existence depends on the policy.
  *   **Result:** **Proceed with Adjustment.** Quantify costs for the first decade. Record years 11–25 as qualitative impacts only. The business case must rely on the first-decade data and existing parents' benefits.

  **Case 3: Flood-Defence and Relocation Scheme**
  *   **Triage:** **M (Mixed).** Construction impacts existing residents (**L**). Long-term habitability affects future residents (**S/T**).
  *   **Horizon:** Build time is 20 years. Years 1–10 involve existing property owners (L). Years 11–25 involve future residents (S/T).
  *   **Application:** The primary business case value is asset protection for *current* owners (L), which falls within the Horizon and counts fully. The secondary value is habitability for future generations (S/T). Costs/benefits for future generations beyond Year 10 are excluded from the s.12(3) total but included as qualitative text.
  *   **Result:** **Hand-Up (Minor).** The core business case (asset protection) remains valid under s.12(3). However, flag that generational benefits beyond Year 10 are uncountable costs. This preserves the strongest line (existing assets) while complying with the rule on future persons.

  **4. Where this breaks**

  This procedure relies on a fictional cutoff. The 10-Year Locking Horizon is arbitrary; philosophically, identity shifts begin immediately with any change in routine, not at decade boundaries. By enforcing the Counterfactual Identity Assumption within the horizon, we are technically misrepresenting the metaphysical reality to satisfy the costing rule. This creates legal vulnerability if a submission is challenged by someone familiar with the non-identity problem; they could argue we are counting costs to non-existent persons.

  The **Mixed (M)** classification is the weakest point. Distinguishing between existing owners and future residents in long-term infrastructure projects is often empirically messy. If a property is sold in Year 9, does the benefit transfer to an S-type person or remain an L-type asset benefit? The procedure defaults to counting it, which may overstate compliance. Additionally, the "Data Absent" default to **L (Locked)** risks underestimating identity shifts in complex social programmes. This is a judgment call wearing a hi-vis vest: we prioritise costing continuity over philosophical accuracy. If a proposal is highly sensitive to demographic shifts, the Hand-Up rule should trigger, but determining "significant uncertainty" is itself subjective.

  **5. What I tell my director**

  This annex uses a pragmatic legal fiction to comply with s.12(3). We are assuming future identities are fixed for ten years to allow costing, after which the regulation blocks us from counting personal costs. This protects the business case for major infrastructure by focusing on existing asset holders, while avoiding philosophical traps on generational changes. It is defensible as standard regulatory modelling, not philosophical truth. If challenged, we argue this is a standard forecasting assumption, not a claim about metaphysics. It allows us to sign off without zeroising valid programmes, but we must flag any heavy reliance on benefits beyond the ten-year window as a ministerial risk.
