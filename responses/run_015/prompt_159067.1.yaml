answer: |-
  1. You argue the initial failure is due to segmentation, not format, but how do we distinguish that from a format mismatch without just redescribing the failure? What independent evidence should we expect regarding border-ownership or figure-ground tasks?
  (Segmentation is the visual system's ability to separate an object from its background.)
  Follow-up: If patients detect edges but cannot perceive wholes, does that suffice to prove your explanation?

  2. If segmentation is the bottleneck, should patients succeed immediately with isolated high-contrast objects but fail in cluttered scenes? What should we expect if the explanation is wrong?
  (High-contrast objects are distinct from their background due to sharp differences in light.)
  Follow-up: If they fail even with isolated objects, does that falsify the segmentation hypothesis?

  3. Does your view predict success with geometric cubes and spheres but failure with irregular shapes defined by affordance or thermal texture? Why would that profile rather than its reverse support your view?
  (Affordance refers to the actionable properties of an object, such as graspability.)
  Follow-up: If patients identify affordances before geometry, does that undermine the shared spatial format claim?

  4. Is the post-surgical success you describe the acquisition of a mapping between two modality-specific formats, or the unmasking of one format that was always shared? What distinguishes these in terms of transfer to shapes never felt before, and which side does the current data favor?
  (Unmasking implies revealing a capacity that was present but inaccessible.)
  Follow-up: If transfer to new shapes is slow, does that force you toward the learning hypothesis?

  5. What is your prediction for a congenitally blind adult who used a sensory substitution device for years and then gains biological sight? Do they succeed immediately or require calibration?
  (Sensory substitution devices translate visual images into auditory or tactile signals.)
  Follow-up: If they succeed immediately, does that prove the format was amodal all along?

  6. Suppose that device encoded shape as non-spatial chords or phonemes rather than spatial patterns; if those users still succeed upon gaining sight, what remains of the amodal claim? Does success here imply the brain constructs the format rather than finding it pre-existing?
  (Non-spatial encoding uses arbitrary sounds rather than topographic maps.)
  Follow-up: If they succeed, must you concede that the amodal format is learned rather than innate?

  7. Molyneux and Locke asked whether the idea of a figure is the same across senses, not when performance succeeds; does your two-stage answer settle that or quietly replace it with a question about timing? Anticipate your reply that the old question just is the empirical question properly posed.
  (The idea of a figure is the mental concept of a shape independent of sense.)
  Follow-up: If you say the empirical timing just is the philosophical question, doesn't that dissolve the conceptual stake?

  8. Original Molyneux cases involve open recognition, not forced-choice matching; if patients pass matching for months while failing open naming, what would you say? Which task carries the philosophical weight, and does your view predict a dissociation between them?
  (Forced-choice matching is picking from options, open naming is identifying without cues.)
  Follow-up: If you call naming a task artifact, are you not protecting the theory from the very data that matters?

  9. Your amodal-format claim looks insulated since every success is counted as evidence for shared content and every failure as noise; what pattern of results would disconfirm it?
  (Insulation means the theory is protected from counter-evidence by reinterpreting failures.)
  Follow-up: If you reply that success after a short delay is the signature, isn't that making the claim unfalsifiable by definition?

  10. To close, specify the single finding you would refuse to explain away as noise or artifact, the one that would make you give up the amodal claim. Which result would you not explain away?
  (An artifact is a result caused by the experimental method rather than the phenomenon.)
  Follow-up: If that result occurs, will you commit to publishing a retraction?

  **Clip Note:** Question 10 is intended for the episode feed clip, as it forces a concrete commitment that highlights the stakes of the theoretical claim.
