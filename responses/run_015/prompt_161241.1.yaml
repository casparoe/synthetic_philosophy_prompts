answer: |-
  **The Scenario**

  Option A is direct cash transfers: $1M yields 100 welfare units, perfectly tracked via follow-up surveys. Option B is a local tenants' union: $1M yields 40 welfare units (measured via evictions prevented) plus 60 units of "community solidarity" (unmeasured). The committee knows solidarity is worth 60 units based on historical analogs, making the Union's total value 100—a tie with Cash. However, solidarity is constitutively fragile: it only emerges when the union defines success internally via membership engagement. If the foundation funds the union but requires the reporting necessary to validate the 40 units and justify the 60-unit estimate, the union shifts focus to casework to satisfy the grant, solidarity evaporates, and the actual value drops to 40. The EV model assumes the union remains a union while being measured; the reality is it becomes a service provider under measurement.

  **The Analysis**

  **The Two Verdicts**
  The EV maximizer says: "We know solidarity is worth 60. We know cash is worth 100. But the union's 60 is contingent on non-interference. Our grant requires interference (reporting). Therefore, the *actual* EV of the funded union is 40. Cash (100) > Union (40). We fund Cash."
  You say: "That's wrong. Fund the Union. The 100 units of Cash are real, but they are produced by a system that consumes the possibility of solidarity. If we fund Cash, we validate the measurement regime that makes the Union's 60 impossible. If we fund the Union *without* the reporting required to verify the 40, we get the 60. Your calculation assumes the measurement process is neutral. It isn't. It's a solvent."

  **The Load-Bearing Feature**
  The feature doing the work is **Constitutive Fragility** (or Reflexive Degradation). It's not that the good is *hard* to measure; it's that the *stance* required to measure it (objectification, external validation) is incompatible with the *stance* required to generate it (trust, autonomy). The intervention is not invariant under observation. This is 100% load-bearing. Without it, you're just arguing about error bars.

  **The Ablation**
  Strip out Constitutive Fragility. Imagine solidarity is just hard to measure (like "happiness") but stable regardless of whether you track it. Now the EV maximizer says: "We estimate 60 units. We add error bars. We compare 100 vs. 40+60." If your critique is just "the 60 is uncertain," they win: "We discounted for uncertainty." If your critique is "the 60 disappears when we look," you win. But if the 60 doesn't disappear, your critique collapses into the boring "you have imperfect information" objection they already have an answer for. You *need* the strong version (changes when measured) to escape the uncertainty trap.

  **The Counterattack**
  The EV maximizer's strongest reply: "Fine. We model the degradation. Value = 60 * P(survival). If P(survival) is low because of our reporting, we reduce reporting. We fund the Union hands-off, assign it 100 units, and move on."
  Your rebuttal: "If you fund hands-off, you aren't optimizing anymore; you're trusting. You can't compare the Union to Cash anymore because Cash is measured and Union isn't. You've abandoned the EV framework for this grant. If you admit that, you admit EV maximization isn't the universal decision rule."

  **Flagging the Slippage**
  You constantly slide between "hard to measure" (epistemic limit) and "changes when measured" (ontological change).
  *   **Hard to measure:** "We don't know the number." (EV reply: Estimate it.)
  *   **Changes when measured:** "The number doesn't exist until we look, and looking changes it." (EV reply: Model the looking.)
  Your critique only works if you stay firmly in the second bucket. If you slip into the first, you're just asking for better data, which is an engineering problem, not a philosophical one. The second is a real thing (reflexivity in social systems), but it requires you to argue that the *method of allocation* is part of the intervention's causal chain, not just a ruler held next to it.
