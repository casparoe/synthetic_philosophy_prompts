answer: |-
  **Mock Philosophy Exam: Ethics of Everyday Life**

  **Essay Question**
  Consider common social practices like tipping waiters, queueing in line, or jaywalking across empty streets. Some philosophers argue these are merely 'coordination games'—arbitrary rules we follow so society functions, meaning outsiders have no real duty to follow them unless they opt in. Others argue these practices generate 'reciprocal expectations' that work like tacit promises, creating a stronger moral bind.

  Compare these two views. Does a visitor have a moral obligation to follow local conventions? In your answer, explain why the coordination-game framing makes obligations agent-relative and context-bound, while the reciprocal-expectation framing might ground a stronger duty but gets shaky when conventions are unfair or oppressive.

  ***

  **Model Answer**

  When we travel to a new place, we often wonder if we need to follow the local rules about things like tipping or queueing. Is it rude not to tip in America, or just different? To answer this, we can look at two ways of understanding these conventions: as coordination games or as tacit promises.

  The coordination game view says these rules are like driving on the left or right side of the road. It doesn't matter which side you pick, as long as everyone picks the same one to avoid crashes. In this view, moral obligations are agent-relative and context-bound. If I'm a tourist who isn't part of the local system yet, I haven't really "opted in" to the game. For example, if I'm jaywalking in a city where everyone does it and traffic stops for pedestrians, doing the same isn't wrong because I'm just coordinating with the flow. My duty only exists if I'm participating in that specific context. If I leave that context, the duty disappears. This makes sense for things like queueing; if I'm just passing through a station and don't intend to use the service, maybe I don't owe the locals my place in line.

  However, the reciprocal expectation view argues it's deeper than just efficiency. When I benefit from a system, I create an expectation in others that I will uphold my end. This works like a tacit promise. If I eat at a restaurant where tipping is the norm, the waiter expects a tip based on the social contract. By accepting the service, I've implicitly promised to follow the rules. This grounds a stronger duty because it's about fairness and not letting people down, not just traffic flow.

  But this view has a major weakness: what if the convention is unfair or oppressive? The tacit promise argument assumes the underlying system is legit. If a tipping culture exists because employers don't pay living wages, is it really a moral duty to tip to fix that? Or if jaywalking laws are enforced selectively against certain groups, following them might support an oppressive system. In these cases, the "promise" feels shaky. You can't promise to uphold something unjust. So, while the reciprocal view gives us a stronger reason to follow rules than the coordination view, we have to check if the rule itself is moral first.

  Ultimately, visitors probably have a duty to follow local conventions under the reciprocal view, but only if those conventions aren't harming anyone. The coordination view is too easy to escape, but the promise view needs a fairness check.

  ***

  **Marking Scheme**

  **A Grade (Excellent)**
  *   **Frameworks:** Clearly defines and contrasts the "coordination game" view vs. the "reciprocal expectation/tacit promise" view.
  *   **Application:** Applies both frameworks to at least **two** of the specific practices mentioned (tipping, queueing, jaywalking) to show how the verdict changes.
  *   **Agent-Relativity:** Explicitly explains why the coordination view makes obligations dependent on the agent's context (e.g., "only matters if I'm playing the game").
  *   **Critical Limit:** Identifies the problem with the reciprocal view when conventions are unfair or oppressive (e.g., unfair wage structures in tipping or selective enforcement in jaywalking).
  *   **Clarity:** Argument is structured and easy to follow.

  **B Grade (Good)**
  *   **Frameworks:** Describes both the coordination and reciprocal views accurately.
  *   **Application:** Mentions the practices (tipping, queueing, etc.) but applies the theories vaguely (e.g., says "it applies to tipping" without explaining how the duty changes).
  *   **Agent-Relativity:** Mentions context but doesn't fully explain why the obligation is agent-relative in the coordination view.
  *   **Critical Limit:** Misses the issue of unfairness or oppression. Treats the reciprocal view as always binding without noting the exception for unjust systems.
  *   **Clarity:** Understandable but lacks depth in the analysis.

  ***

  **Meta-Reflection on the Verdict**

  **What would change my mind?**
  I'd change my mind on the "oppressive convention" exception if there was strong evidence that breaking an unfair convention actually causes more harm than following it. For example, if refusing to tip in a tipped-wage system immediately causes the waiter to suffer significantly more than the systemic issue itself, maybe the duty to prevent immediate harm outweighs the duty to not support oppression. Empirical data on the immediate consequences of norm-breaking vs. long-term structural change would shift the verdict.

  **Where is my reasoning most likely to fail?**
  My reasoning probably fails on the definition of "tacit promise." It's easy to say "benefiting creates a promise," but philosophers argue you can't be bound by a promise you never actually made, even implicitly. I might be overstating how much moral weight a mere expectation carries. Also, I'm assuming visitors can easily identify when a convention is oppressive, which isnt always clear in the moment.
