answer: |-
  Good evening, everyone. For those who don't know me, I'm the uncle.

  Looking around this hall, I see a room full of people who care deeply about this child, though I suspect many of you care for different reasons. Some of you are here because you believe families should be large and roots should run deep. Others are here because you believe nothing should be done without careful thought. My sister and her husband belong to both groups. They have thought about this arrival longer and harder than anyone I know.

  Usually, at a naming, we talk about what the parents have given the child. We talk about the gift of life, or the world she gets to explore. But tonight, I want to talk about what the child gives us.

  Not in any grand sense. But in a specific one.

  My great-grandfather planted an orchard on the south slope. There are trees there that are older than anyone in this room. There is a way of pruning them—a specific angle of the shears, a specific time of season—that only two people still alive properly know. If no one learns that way, the trees will grow wild. They'll still be trees, but they won't be *that* orchard anymore. The knowledge would end.

  For a long time, my sister and her husband looked at those trees and felt a heavy responsibility. They loved what was there, but they knew that loving something isn't enough. You need hands to hold it. You need someone to show the shears to.

  Tonight isn't about adding to the population of the world. It isn't about the future of the species, or the state of the climate, or any of the large, heavy things we read about in the papers. It is about this family, and this place, and the small, fragile things we want to keep alive simply because we love them.

  Now, there are new hands.

  We don't know what she will do with those hands. She might prune the trees, or she might paint them, or she might leave them be. But because she is here, we get to walk her out to the slope. We get to point at the branches and say, "Look." We get to pass on the knowledge of how to care for something that outlasts us.

  To the grandparents: you have kept the stories safe until now.
  To the friends: you have kept the questions sharp.
  And to the parents: you have made a space where both can live.

  So, please raise your glasses.

  To [Child's Name]. May she always know where the orchard is. And to us, may we be worthy of showing it to her.
