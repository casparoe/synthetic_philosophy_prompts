answer: |-
  ### The Interventionist Criterion
  **The Test:** Imagine we hold all material conditions fixed (technology, class structure, trade routes, resource distribution). We then perform a "miracle intervention" to swap the cultural variable (e.g., replace Calvinist ethics with Catholic ethics in 16th-century Europe). **Does the economic outcome (rise of capitalism) change?**

  *   **YES:** Culture has causal leverage (Counterfactual Dependence).
  *   **NO:** Culture tracks material conditions (Determinism/Epiphenomenalism).
  *   **INCOHERENT:** The question assumes culture and material conditions can be separated (Ontological Monism).

  ***

  ### The Decision Tree

  **ROOT:** You accept culture is explanatorily relevant to the Weber case.

  **NODE 1: Is the explanatory work *Causal* (Interventionist)?**
  *Does the cultural variable satisfy the test above?*

  *   **YES (Causal Leverage)** → Go to **Node 2**.
  *   **NO (No Leverage)** → Go to **Node 3**.
  *   **INCOHERENT (False Dualism)** → Go to **Node 4**.

  **NODE 2: Where is the Mechanism Located?**
  *If culture causes outcomes, does it work through individual psychology or population dynamics?*

  *   **Individual Psychology** → Go to **Node 2A**.
  *   **Group/Population Dynamics** → **LEAF 1: Functionalist/Selectionist**
  *   **Node 2A: Is the Value Autonomous or Instrumental?**
      *   *Did the actors hold the value for its own sake, or as a tool?*
      *   **Autonomous/Expressive** → **LEAF 2: Weberian Cultural Causalism**
      *   **Instrumental/Rational** → **LEAF 3: Rational Choice/Neo-Weberian**

  **NODE 3: What is the Status of the 'Explanation'?**
  *If culture has no causal leverage, why do we talk about it?*

  *   **It Masks Material Interests** → **LEAF 4: Reverse-Causation/Instrumentalist**
  *   **It Describes Action Rules** → Go to **Node 3A**.
  *   **Node 3A: Is the Description Psychological or Structural?**
      *   *Are we citing individual reasons or class position?*
      *   **Individual Reasons** → **LEAF 5: Action Theory/Constitutive (Winch)**
      *   **Class Position** → **LEAF 6: Materialist/Epiphenomenalist**

  **NODE 4: What is the Alternative Ontology?**
  *If the material/culture split is false, what is culture actually made of?*

  *   **Material Practice/Ritual** → **LEAF 7: Structuralist (Althusserian)**
  *   **Embodied Disposition** → **LEAF 8: Bourdieusian Habitus**

  ***

  ### The Leaves (Positions & Awkward Commitments)

  1.  **Functionalist/Selectionist**
      *   *Position:* It doesn't matter if individuals believe the ethic; groups with this ethic outcompete others, causing capitalism to spread.
      *   *Awkward Commitment:* Requires that capitalism can emerge even if no single capitalist actually believes in the ethic (the "zombie capitalist" problem).

  2.  **Weberian Cultural Causalism**
      *   *Position:* Religious anxiety caused specific psychological shifts in individuals, which aggregated to create new economic structures.
      *   *Awkward Commitment:* Requires a 'switch' moment where ideas detach from their material roots to become independent variables.

  3.  **Rational Choice/Neo-Weberian**
      *   *Position:* Actors adopted the ethic because it reduced transaction costs or signaled trustworthiness in a new market environment.
      *   *Awkward Commitment:* Turns profound religious conviction into a cold cost-benefit analysis, which historical actors would reject.

  4.  **Reverse-Causation/Instrumentalist**
      *   *Position:* The capitalist class emerged due to material shifts and adopted the ethic post-hoc to legitimize their wealth.
      *   *Awkward Commitment:* Implies historical actors are systematically self-deceived about their own primary motivations.

  5.  **Action Theory/Constitutive (Winch)**
      *   *Position:* Citing the value isn't a cause, it's a rule-following description that makes the action intelligible within that form of life.
      *   *Awkward Commitment:* Makes comparative social science impossible, as you cannot generalize rules across different "forms of life."

  6.  **Materialist/Epiphenomenalist**
      *   *Position:* Culture is smoke; the material base is fire. Citing culture is a placeholder for unseen economic determinants.
      *   *Awkward Commitment:* Struggles to explain why specific ideologies map to specific classes without secretly relying on functionalist logic.

  7.  **Structuralist (Althusserian)**
      *   *Position:* Culture is not an idea but a material practice (rituals, apparatuses) that constitutes the subject itself.
      *   *Awkward Commitment:* Dissolves human agency entirely, making resistance to the structure theoretically impossible.

  8.  **Bourdieusian Habitus**
      *   *Position:* Culture is an embodied disposition generated by material conditions that then reproduces those conditions.
      *   *Awkward Commitment:* Hard to specify how the habitus ever changes without an external material shock (conservative bias).

  ***

  ### Indistinguishable Pairs
  *The tree logically separates these, but in empirical historical practice, they often collapse.*

  *   **Leaf 7 (Structuralist) vs. Leaf 8 (Bourdieusian Habitus):** Both reject the ideal/material dualism at Node 4. In practice, distinguishing "material practice" from "embodied disposition" often comes down to terminology rather than observable mechanism. Historians often find themselves arguing over labels while agreeing on the evidence.
  *   **Leaf 2 (Weberian) vs. Leaf 3 (Rational Choice):** Distinguishing between "acting because you value X" and "acting because valuing X is useful" is notoriously difficult in archival work. An actor's stated belief (Weber) may function as a credible commitment device (Rational Choice), making the causal pathway empirically opaque.

  ### Unoccupied Logical Space
  *Combinations of answers that yield no viable position.*

  *   **Combination:** **Interventionist = NO** + **Locus = INDIVIDUAL** + **STATUS = PSYCHOLOGICAL.**
      *   *The View:* "Individuals act on psychological values, but changing those values (holding materials fixed) would not change the outcome, yet the values are not just masks for interests."
      *   *Verdict:* **Incoherent.** If the psychological state is real and drives action, changing it *must* change the action (Interventionist = YES). If changing it doesn't change the outcome, the psychology is epiphenomenal (Leaf 6) or a mask (Leaf 4). There is no room for "real but causally inert individual psychology."
  *   **Combination:** **Interventionist = YES** + **Locus = GROUP** + **ONTOLOGY = MENTAL.**
      *   *The View:* "The Group Mind holds a value that causally impacts the economy."
      *   *Verdict:* **Unattractive.** While Functionalism (Leaf 1) occupies the "Group" slot, it avoids positing a "Group Mind." Explicitly arguing for a collective mental entity that intervenes on the economy is generally rejected by both philosophers (category error) and historians (reification) as methodologically mystical.
