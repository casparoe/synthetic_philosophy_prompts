prompt: |-
  I sit on my university's academic-integrity committee, and after a messy case last term I started reading about how groups decide things. Our rule is two-part: a finding of misconduct requires both that the student submitted work that was not their own and that no valid excuse applies. We vote by show of hands, and last term we ended up with a majority for each of the two conditions separately but a majority against a finding of misconduct — and then argued for an hour about what we had actually decided. Someone sent me a chapter from a popular book on collective decision-making that seemed to describe exactly our problem, but I don't trust it enough to bring it to the committee. Before I do, I'd like to know which parts of it a specialist in this area would endorse, which are simplifications, and which are quietly wrong.

  The chapter's account, as closely as I can reproduce its wording, goes like this: a group can be made up of perfectly reasonable individuals and still be unreasonable as a group. Imagine three judges deciding whether a defendant is liable, where the law makes liability depend on both a duty of care and a breach of that duty. One judge finds a duty and a breach and votes liable; one finds a duty but no breach; one finds no duty but a breach. Two of the three accept that there was a duty and two of the three accept that there was a breach, so if the court votes on the two questions separately it has to find the defendant liable — even though two of the three judges voted not liable. The court's verdict therefore depends on nothing more than which questions get put to the vote, which means it is an artifact of procedure rather than a finding. This is the discursive dilemma. The chapter then says that it is really just Condorcet's paradox of voting applied to beliefs instead of preferences — or, equivalently, Arrow's impossibility theorem restated for courts — and draws the moral that whenever a group has to settle several logically connected questions at once, no voting rule can reliably turn reasonable individuals into a reasonable group. It extends this well beyond law: any committee, board or electorate that votes on a package of related propositions risks endorsing conclusions that nobody in the room accepts, which is why putting complex questions to a popular vote is a dice roll. The only real escapes, it concludes, are to hand the decision to one person, or to break the issue down until every vote is a simple yes-or-no on one thing.

  My instinct is that this is unfair in at least one way — it slides from "collective judgments can be inconsistent" to "group decision-making is unreliable generally," and I don't see why a coherence problem about the shape of a group's stated position should tell us anything about whether the group is likely to get the facts right. But I can't tell where the chapter stops being accurate and starts overstating, and I also can't tell whether its practical moral survives correction. So: please audit it claim by claim, saying what someone who works on this literature would accept outright, what they would describe as a common simplification, what they would reject, and what the strongest defender of the view would say the chapter gets wrong about their own result. Then tell me whether the conclusion I actually care about follows from the accurate parts of the account: our committee is considering a "double-majority" fix, where each condition must win a majority on its own and the composite finding must also win a majority on its own, and if the composite fails we record no violation and note only those conditions that did pass. Is that a genuine way out of the problem the chapter describes, is it secretly one of the procedures the literature already discusses under another description, what does it cost us, and does it quietly give up something that the impossibility results are usually taken to require? I'd also like to know whether we would do better simply to vote only on the two conditions and never on the composite finding at all — what we would gain and lose by doing that, in terms the rest of the committee will understand.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Member of a university academic-integrity committee.
      *   **Context:** Experienced a "messy case" where majority votes on premises (misconduct + no excuse) didn't align with the majority vote on the conclusion (finding of misconduct). This is the *Doctrinal Paradox* (or *Discursive Dilemma*).
      *   **Input:** A summary of a chapter from a popular book on collective decision-making.
      *   **Task:** Audit the chapter's claims (accurate vs. simplified vs. wrong), evaluate the proposed "double-majority" fix, and compare it to voting only on premises.
      *   **Tone:** Professional, precise, academically rigorous but accessible to a committee member (not necessarily a social choice theorist). Needs to distinguish between technical results and popular interpretations.

  2.  **Deconstruct the Chapter's Claims:**
      *   *Claim 1:* A group of reasonable individuals can be unreasonable as a group (inconsistent judgments).
          *   *Status:* Accurate. This is the core of the Discursive Dilemma/Doctrinal Paradox.
      *   *Claim 2:* The scenario described (3 judges, duty/breach/liability) is the Discursive Dilemma.
          *   *Status:* Accurate. This is the classic Kornhauser & Sager (1986/1993) example.
      *   *Claim 3:* It is "really just Condorcet's paradox... applied to beliefs."
          *   *Status:* Simplification/Debatable. They are related (both show instability/inconsistency), but the logical structure differs. Condorcet is about cycles in preferences; Discursive Dilemma is about logical inconsistency in judgments.
      *   *Claim 4:* It is "equivalently, Arrow's impossibility theorem restated for courts."
          *   *Status:* Simplification/Technically Imprecise. Arrow's theorem is about preferences and rankings. Judgment Aggregation (List & Pettit) is the specific impossibility result for beliefs/propositions. They are cousins, not identical.
      *   *Claim 5:* "No voting rule can reliably turn reasonable individuals into a reasonable group."
          *   *Status:* Overstatement. Impossibility theorems usually rely on specific axioms (e.g., anonymity, systematicity). Some rules *can* work if you relax certain conditions (e.g., dictatorship, premise-based, conclusion-based).
      *   *Claim 6:* "Any committee... risks endorsing conclusions that nobody in the room accepts."
          *   *Status:* Accurate risk, but frequency depends on the agenda and correlation of views.
      *   *Claim 7:* "The only real escapes are to hand the decision to one person, or to break the issue down..."
          *   *Status:* False Dichotomy/Overstatement. There are other aggregation rules (premise-based vs. conclusion-based). Breaking it down *is* one solution, but dictatorship isn't the only other one.
      *   *Claim 8:* "Putting complex questions to a popular vote is a dice roll."
          *   *Status:* Rhetorical flourish. While technically possible, real-world correlation often mitigates the paradox.

  3.  **Evaluate the Proposed "Double-Majority" Fix:**
      *   *Proposal:* Majority on Condition A AND Majority on Condition B AND Majority on Final Finding. If Final Finding fails, no violation, even if A and B passed.
      *   *Analysis:* This is essentially a *Conclusion-Based Procedure* with a safety valve, or a hybrid.
      *   *Problem:* It doesn't solve the inconsistency; it just prioritizes the conclusion vote. If A and B pass (majority) but Conclusion fails (majority), you have an inconsistent set of collective judgments (The group believes A, believes B, but believes Not-(A&B)).
      *   *Cost:* It sacrifices *collective rationality* (consistency) for *procedural legitimacy* (the final vote stands). It might let guilty students off if the conclusion vote splits differently than the premise votes.
      *   *Literature Connection:* This is close to the "Conclusion-Based Procedure" (vote on outcome) vs. "Premise-Based Procedure" (vote on premises, derive outcome). The "double-majority" adds a veto to the conclusion.
      *   *Impossibility Theorem:* The List & Pettit theorem says you can't have Anonymity, Systematicity, and Consistency simultaneously for certain agendas. This fix keeps Anonymity but sacrifices Consistency (the group's output is logically inconsistent).

  4.  **Evaluate the Alternative (Vote Only on Conditions):**
      *   *Proposal:* Vote on Condition A and Condition B. Derive the finding logically.
      *   *Analysis:* This is the *Premise-Based Procedure*.
      *   *Gain:* Collective Rationality (Consistency). If A and B are true, Finding *must* be true.
      *   *Loss:* Democratic Deficit. The final outcome might contradict the majority view on the outcome itself (as seen in the user's case).
      *   *Committee Understanding:* Easier to explain logic, harder to accept if the "will of the majority" on the verdict is overturned.

  5.  **Synthesize the "Specialist" Audit:**
      *   Need to distinguish between the *Doctrinal Paradox* (Kornhauser & Sager) and the *Discursive Dilemma* (Pettit & List).
      *   Need to clarify the link to Arrow (Judgment Aggregation vs. Social Choice).
      *   Need to address the "unreliable generally" claim (epistemic performance vs. logical consistency).
      *   Need to address the "dictatorship or decomposition" claim (false dilemma).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the user's situation. Validate that this is a known problem in social choice theory (Judgment Aggregation).
      *   *Section 1: Auditing the Chapter.* Go claim by claim.
          *   *Reasonable individuals/unreasonable group:* True (Doctrinal Paradox).
          *   *Condorcet/Arrow equivalence:* Nuanced. Related family, but distinct theorems. Arrow is preferences; this is judgments.
          *   *No voting rule can work:* Too strong. Depends on axioms.
          *   *Only escapes (Dictator/Decomposition):* False. Premise-based vs. Conclusion-based is the standard trade-off.
          *   *Epistemic claim (facts right):* User's instinct is right. Consistency $\neq$ Accuracy.
      *   *Section 2: The "Double-Majority" Fix.*
          *   What is it? It prioritizes the conclusion vote.
          *   Does it solve the paradox? No, it accepts the inconsistency. It says "The verdict stands even if it contradicts the premises."
          *   Cost: Logical incoherence. Risk of acquitting when premises are met.
          *   Literature term: It's a constrained Conclusion-Based Procedure.
      *   *Section 3: Voting Only on Conditions (Premise-Based).*
          *   What is it? Derive verdict from premises.
          *   Gain: Consistency.
          *   Loss: Potential "Democratic Deficit" (Verdict contradicts direct vote on verdict).
          *   Recommendation: For academic integrity, consistency (rule of law) usually trumps direct democracy on the verdict.
      *   *Section 4: Recommendation.*
          *   The "Double-Majority" is risky because it creates official inconsistency.
          *   Premise-based is usually preferred for legalistic committees (Rule of Law).
          *   Epistemic point: Premise-based is often *more* accurate (Condorcet Jury Theorem logic applied to premises).

  7.  **Refining the Tone:**
      *   Avoid overly dense math.
      *   Use terms like "Judgment Aggregation," "Premise-Based," "Conclusion-Based."
      *   Ensure the distinction between *logical consistency* and *truth/accuracy* is clear (addressing the user's instinct).
      *   Make sure the advice is actionable for a committee.

  8.  **Self-Correction/Check during drafting:**
      *   *Did I address the Arrow claim correctly?* Arrow's theorem applies to preference orderings. The Judgment Aggregation impossibility (List & Pettit 2002) is the direct analog for binary judgments. I need to make sure I don't say the chapter is *wrong* to link them, but that it's a *simplification* of the technical relationship.
      *   *Did I address the "Double Majority"?* If they require a majority on the composite *and* the premises, they might end up with no decision often. If the composite fails but premises pass, they record "no violation." This is effectively giving the composite vote veto power. This is a Conclusion-Based procedure with extra steps. It solves the "what do we decide" problem but not the "we are inconsistent" problem.
      *   *User's Instinct:* The user suspects the slide from "inconsistent" to "unreliable facts" is wrong. I need to confirm this. Inconsistency doesn't mean wrong facts; it means logically incoherent stance. A group can be consistently wrong or inconsistently right.

  9.  **Final Polish:** Organize with clear headings. Ensure the "Audit," "The Fix," and "The Alternative" are distinct. (Proceed to generate output based on this structure.)
answer: |-
  This is a sophisticated question that touches on a specific subfield of social choice theory known as **Judgment Aggregation**. Your instinct is sharp: the chapter you read has correctly identified a real phenomenon but has drawn popularized, somewhat alarmist conclusions that a specialist would nuance significantly.

  Here is an audit of the chapter's claims, followed by an analysis of your proposed procedural fixes.

  ### Part 1: Audit of the Chapter's Claims

  **1. Claim: "A group can be made up of perfectly reasonable individuals and still be unreasonable as a group."**
  *   **Verdict:** **Accepted.**
  *   **Specialist View:** This is the core definition of the **Doctrinal Paradox** (Kornhauser & Sager, 1986) or the **Discursive Dilemma** (Pettit, 2001). It is mathematically demonstrable that proposition-wise majority voting can yield a set of collective judgments that are logically inconsistent, even if every individual's set is consistent.

  **2. Claim: "This is really just Condorcet's paradox... applied to beliefs."**
  *   **Verdict:** **Simplification.**
  *   **Specialist View:** They are cousins, not twins. Condorcet's paradox concerns *cycles* in preferences (A > B > C > A). The Discursive Dilemma concerns *logical inconsistency* in binary judgments (Accept P, Accept Q, Reject (P & Q)). While both demonstrate instability in aggregation, the mathematical structures differ. Conflating them is common in popular literature but imprecise.

  **3. Claim: "Equivalently, Arrow's impossibility theorem restated for courts."**
  *   **Verdict:** **Technically Imprecise.**
  *   **Specialist View:** Arrow's Theorem applies to ordinal *preferences* (rankings). The relevant impossibility result for your situation is the **List-Pettit Theorem** (2002) on Judgment Aggregation. It shows that no aggregation function can satisfy a set of plausible conditions (like anonymity, systematicity, and consistency) for certain logical agendas. It is an "Arrow-like" result, but calling it "Arrow's theorem restated" glosses over significant technical differences in the axioms required.

  **4. Claim: "No voting rule can reliably turn reasonable individuals into a reasonable group."**
  *   **Verdict:** **Overstatement.**
  *   **Specialist View:** Impossibility theorems always depend on a specific set of axioms. If you relax one axiom, you can have a working rule. For example, if you give up "Anonymity" (equal weight for all voters), a **Dictatorship** works. If you give up "Systematicity" (treating all propositions the same way), a **Premise-Based Procedure** works. The claim implies *no* solution exists, whereas the literature says *no perfect* solution exists that satisfies *all* democratic ideals simultaneously.

  **5. Claim: "The only real escapes are to hand the decision to one person, or to break the issue down..."**
  *   **Verdict:** **False Dichotomy.**
  *   **Specialist View:** These are two extremes (Dictatorship vs. Premise-Based). There is a third standard option: the **Conclusion-Based Procedure** (vote only on the final verdict, ignore the premises). Each has trade-offs. The chapter ignores the standard trade-off analysis between Premise-Based and Conclusion-Based procedures.

  **6. Claim: "Slides from 'collective judgments can be inconsistent' to 'group decision-making is unreliable generally'."**
  *   **Verdict:** **Your Instinct is Correct.**
  *   **Specialist View:** This is the most critical error in the chapter. **Logical Consistency is not the same as Epistemic Accuracy.** A group can be logically consistent and completely wrong (e.g., a unanimous jury convicting an innocent person based on shared bias). Conversely, a group can be logically inconsistent but "closer to the truth" on average. The impossibility results concern the *shape* of the group's output, not necessarily its *truth-tracking ability*. In fact, some models suggest Premise-Based voting is *more* accurate truth-trackers than Conclusion-Based voting (via the Condorcet Jury Theorem applied to premises).

  ---

  ### Part 2: Auditing Your "Double-Majority" Fix

  **Your Proposal:** Require a majority for Condition A, a majority for Condition B, *and* a majority for the Composite Finding. If the Composite fails, record no violation, even if A and B passed.

  **1. Is this a genuine way out?**
  *   **No.** It does not solve the logical inconsistency; it merely prioritizes one vote over the others.
  *   **The Problem:** If Condition A passes (majority says "Yes"), Condition B passes (majority says "Yes"), but the Composite Finding fails (majority says "No Violation"), your committee has officially recorded an inconsistent position. You have collectively asserted: *A is true*, *B is true*, but *(A and B) is false*.
  *   **Literature Classification:** This is a variant of a **Conclusion-Based Procedure** with a super-majority hurdle. It grants the final verdict veto power over the premises.

  **2. What does it cost you?**
  *   **Collective Rationality:** You are formally accepting that the committee's official record may be logically incoherent.
  *   **Rule of Law:** In an integrity context, this creates arbitrariness. Two students with identical facts (where the committee agrees on the facts) could receive different outcomes depending on how the final vote splits emotionally.
  *   **Strategic Voting:** It encourages members to vote strategically on the premises to ensure the final outcome they want, rather than voting their true judgment on the facts.

  **3. Does it give up something the impossibility results require?**
  *   It preserves **Anonymity** (everyone's vote counts equally) but sacrifices **Consistency** (the collective set of judgments is logically valid). The List-Pettit theorem tells us we must sacrifice one of the desirable axioms; your fix chooses to sacrifice Consistency.

  ---

  ### Part 3: The Alternative (Vote Only on Conditions)

  **The Proposal:** Vote only on Condition A (Work not their own) and Condition B (No valid excuse). The finding of misconduct is derived logically (If A and B, then Misconduct). Do not vote on the finding itself.

  **1. What is this?**
  *   This is the **Premise-Based Procedure (PBP)**. It is the standard recommendation in the judgment aggregation literature for legal and quasi-legal bodies.

  **2. What do you gain?**
  *   **Consistency:** The committee's output will never be logically self-contradictory.
  *   **Accountability:** It forces members to commit to the factual predicates. It is harder to vote "No Misconduct" if you have already voted "Yes" on the facts that constitute misconduct.
  *   **Epistemic Accuracy:** Theoretical work (e.g., by List and Goodin) suggests that if individuals are more than 50% likely to be right on the premises, the PBP is statistically more likely to reach the *correct* outcome than voting on the conclusion directly. This is because the "signal" is aggregated at the factual level, where error is more random, rather than the verdict level, where bias is higher.

  **3. What do you lose?**
  *   **The "Democratic Deficit":** You may arrive at a finding of misconduct even if a majority of the committee, asked directly "Is this student guilty?", would have voted "No." This was your experience last term.
  *   **Perceived Legitimacy:** Members may feel their "will" on the final outcome was thwarted by the logic of the premises.

  ---

  ### Part 4: Recommendation for the Committee

  You asked whether the conclusion you care about follows from the accurate parts of the account. The accurate part is that **procedure determines outcome**. The inaccurate part is that this makes the process a "dice roll" or "unreliable."

  **Recommendation:**
  Do **not** adopt the "Double-Majority" fix. It institutionalizes inconsistency. If your committee's official record states that the conditions for misconduct were met but misconduct did not occur, you undermine the integrity of the code itself.

  **Adopt the Premise-Based Procedure (Vote only on conditions).**
  Here is how to explain this to the rest of the committee, using terms they will understand:

  1.  **The "Rule of Law" Argument:** "Our job is to apply the rules, not to vote on guilt directly. If the rules say X + Y = Misconduct, and we agree X and Y happened, we are obligated to find Misconduct. Voting on the verdict separately allows us to ignore the rules we are sworn to uphold."
  2.  **The "Inconsistency" Warning:** "If we vote on everything, we risk officially stating that 'The student cheated, had no excuse, but is not guilty.' That makes the committee look incoherent and opens us to appeals based on arbitrary decision-making."
  3.  **Addressing the "Democratic Deficit":** "It is true that sometimes the logic might lead to a verdict a majority wouldn't have picked directly. But that is a feature, not a bug. It prevents us from letting personal sympathy override the factual findings we just agreed upon."

  **Summary:** The chapter was right about the paradox but wrong about the hopelessness. The "Double-Majority" fix accepts the disease (inconsistency) as the cure. The Premise-Based procedure is the standard specialist recommendation for bodies like yours because it prioritizes **consistency and accuracy** over **direct majoritarianism on the verdict**.
