answer: |-
  # Specification of Interpersonal Comparison for National Cost–Benefit Analysis

  The following specification defines the conditions an account of well-being must satisfy to support distributional weighting in a national CBA defensible to citizens with divergent conceptions of the good. The entries are sorted by the epistemic status of the requirement.

  ## Grade 1: Mathematical and Functional Necessities
  *These requirements follow from the mathematics of aggregation or the fixed purpose of the analysis (policy choice under scarcity). Without them, the calculation is undefined or the purpose unfulfilled.*

  **1. Intra-personal Cardinality**
  *   **Requirement:** For any individual, the difference between two well-being states must be quantitatively meaningful, not merely ordinal.
  *   **Motivating Case:** *Comparisons of gains rather than levels.* To claim a policy costs A more than it gains B, we must measure the *size* of the loss and gain. Ordinal rankings ("A is worse off than before") cannot support a trade-off calculation.
  *   **Justification:** Follows from the arithmetic of cost-benefit analysis. Summing or weighting ordinal ranks is mathematically illicit.

  **2. Interpersonal Unit Comparability**
  *   **Requirement:** A one-unit gain for Person A must be comparable in magnitude to a one-unit gain for Person B.
  *   **Motivating Case:** *Distributional weights.* To justify giving weight to the worse off, the analyst must be able to say that a unit of well-being is more valuable when held by the deprived. This requires a common "ruler" for utility increments across persons.
  *   **Justification:** Follows from the purpose fixed (distributional weighting). Without unit comparability, distributional weights are arbitrary.

  **3. Elicitation Robustness**
  *   **Requirement:** The measurement procedure must yield stable comparisons invariant to irrelevant contextual factors (mood, question order, recent events).
  *   **Motivating Case:** *Self-report drift.* If a "7" today is a "5" tomorrow due to weather, the metric cannot anchor policy.
  *   **Justification:** Follows from the requirement for public defensibility. A measure vulnerable to noise cannot defend binding decisions against citizens who perceive the variance as error.

  ## Grade 2: Genuine but Negotiable Design Choices
  *These requirements are necessary to make the system operational for the specific cases listed, but alternative choices are theoretically coherent. They represent design parameters rather than logical truths.*

  **4. Scale Normalization (Range Equivalence)**
  *   **Requirement:** Individual scales must be normalized to a common range (e.g., 0 to 1) regardless of the individual's affective capacity.
  *   **Motivating Case:** *Blunted or restricted affective range.* A person with chronic pain or medication-flattened affect may report an "8" on a 1–10 scale that represents a much narrower underlying range than a neurotypical "8."
  *   **Justification:** Negotiable. One could choose to respect the subjective range (accepting the "8" as an "8"), but for CBA, this creates a perverse incentive to medicate affect. Normalization is a policy choice to prioritize *capacity for welfare* over *reported intensity*.

  **5. Anchored Zero Point (Neutral Level)**
  *   **Requirement:** The scale must possess a fixed zero point representing a state of neutral value (neither good nor bad to exist in), distinct from the bottom of an existing person's scale.
  *   **Motivating Case:** *Population ethics.* A policy changing who comes to exist requires comparing existence to non-existence. Without a neutral line, we cannot assess the value of creating new lives versus improving existing ones.
  *   **Justification:** Negotiable. Some theories reject the possibility of a neutral life. However, for a CBA that includes demographic impacts, a working definition of "zero" is a necessary design parameter, even if philosophically contested.

  **6. Agent-Neutral Metric (Functional Equivalence)**
  *   **Requirement:** The metric for well-being must apply to entities that cannot self-report or whose internal states differ radically from humans.
  *   **Motivating Case:** *Non-human animals and artificial systems.* If welfare is defined by self-report, animals are excluded. If defined by human neurochemistry, AI is excluded.
  *   **Justification:** Negotiable. A state could limit CBA to human citizens. But if the mandate includes environmental or future-system impacts, the metric must be based on functional proxies (e.g., preference satisfaction, pain avoidance behaviors) rather than specific phenomenology.

  **7. Commensurability of Sources**
  *   **Requirement:** Different constitutive accounts of well-being (e.g., desire satisfaction vs. hedonic experience) must be mapped to a single numerical currency.
  *   **Motivating Case:** *Constituted differently.* One person is content via desire satisfaction; another via positive affect. If the theory treats these as incommensurable, no trade-off is possible.
  *   **Justification:** Negotiable. One could run parallel CBAs. But for a single decision, a conversion rate (explicit or implicit) between "desire units" and "experience units" is a required design choice.

  ## Grade 3: Sectarian Preferences Disguised as Constraints
  *These are often presented as technical requirements for measurement but are actually substantive ethical commitments of specific camps (Utilitarian, Prioritarian, etc.). Including them limits defensibility to citizens who reject those commitments.*

  **8. Exclusive Welfarism**
  *   **Requirement:** Only well-being outcomes count; rights, procedures, or duties have no independent weight.
  *   **Motivating Case:** *General defensibility.* Often asserted as necessary for "consequentialist rationality."
  *   **Justification:** Sectarian. This excludes deontological or rights-based citizens. It is a moral premise, not a measurement constraint. A neutral CBA should allow for "rights constraints" outside the welfare function rather than stipulating them away.

  **9. Hedonic/Experience Dominance**
  *   **Requirement:** Well-being must be measurable via experienced quality of life (hedonia) rather than objective list or desire satisfaction.
  *   **Motivating Case:** *Constituted differently.* Often asserted to solve the "blunted affect" or "adapted preferences" problems.
  *   **Justification:** Sectarian. This privileges the "experience machine" intuition over the "autonomy" intuition. It excludes citizens who believe welfare consists in achieving goals, even if unpleasant.

  **10. Full Level Comparability**
  *   **Requirement:** It must be possible to say not just that A gained more than B, but that A is absolutely better off than B.
  *   **Motivating Case:** *Prioritarianism.* Often asserted as necessary for "helping the worse off."
  *   **Justification:** Sectarian (Utilitarian vs. Prioritarian). Utilitarianism requires only unit comparability of *gains*. Prioritarianism requires level comparability. Asserting this as a general requirement privileges prioritarian ethics over utilitarian aggregation.

  ***

  ## Explicit Conflicts

  **Conflict: Scale Normalization (Grade 2) vs. Elicitation Robustness (Grade 1)**
  *   **Tension:** To normalize the scale of a person with blunted affect (Grade 2), we must adjust their self-reports based on an external model of their capacity. This violates the raw self-report data, making the measure vulnerable to the charge that it ignores the subject's own testimony (Grade 1 Robustness).
  *   **Verdict:** **Real Conflict.** You cannot have both perfect fidelity to self-report and perfect normalization for capacity. The specification must prioritize Normalization for the sake of distributional equity, accepting that "Robustness" applies to the *procedure* of normalization, not the raw report.

  **Conflict: Anchored Zero Point (Grade 2) vs. Agent-Neutral Metric (Grade 2)**
  *   **Tension:** Defining a "neutral life" (Zero Point) is deeply anthropocentric. An AI or animal may not have a state analogous to "neutrality."
  *   **Verdict:** **Apparent Conflict.** It can be resolved by defining zero functionally (e.g., the point where approach and avoidance behaviors are equiprobable) rather than phenomenologically.

  ***

  ## Judgements

  **1. Is full comparability of levels a requirement or a stipulation?**
  It is a **stipulation**. Individual utility functions, even if cardinal, deliver only intra-personal level information. Interpersonal level comparability requires an additional ethical bridge (a "social welfare function" axiom) that asserts Person A's baseline is commensurable with Person B's. It is not delivered by the measurement alone. For a CBA using *distributional weights* (prioritarianism), it is a functional requirement, but it remains an ethical stipulation imposed on the data, not derived from it.

  **2. Is the list jointly satisfiable?**
  **No.** The subset {Invariance under independent positive-affine rescaling, Distributional Sensitivity, Completeness} is inconsistent.
  *   **Why:** If utility functions are invariant under independent affine rescaling (Grade 1 math), then interpersonal unit comparisons are meaningless (you can stretch A's scale without changing the truth). If interpersonal unit comparisons are meaningless, you cannot apply distributional weights (which require comparing units across persons).
  *   **Which gives way:** **Invariance under independent rescaling** must give way. To have distributional weights, we must fix the unit and zero across persons (Full Comparability). We sacrifice the mathematical elegance of affine invariance for the ethical utility of weighting.

  **3. Is the Ex-Ante vs. Ex-Post aggregation dispute about interpersonal comparison?**
  **No.** It is a dispute about **risk and identity**.
  *   **Reasoning:** Interpersonal comparison settles how we weigh A's utility against B's. Ex-ante/Ex-post settles whether we weigh the *expected* utility of A and B before a risk resolves, or the *realized* utility after. This is a dispute about the timing of the evaluation and the moral relevance of risk itself, not about the metric used to compare A and B. The specification above (Cardinality/Unit Comparability) is compatible with both; the choice depends on whether one values "fair chances" (Ex-Ante) or "fair outcomes" (Ex-Post).

  **4. Which single requirement excludes the largest share of defended accounts?**
  **Grade 1: Interpersonal Unit Comparability.**
  *   **Why:** This excludes all ordinalist welfare economics, many preference-satisfaction accounts that resist cardinalization, and philosophical views that hold well-being to be essentially qualitative or lexical (e.g., Rawlsian primary goods without a metric, or capabilities treated as a partial order).
  *   **Why not prejudice:** It is not prejudice because the *purpose fixed* (National CBA with distributional weights) is inherently cardinal. You cannot calculate a weighted sum or a prioritarian transform without cardinal units. If the citizens demand a CBA, they demand cardinality. The exclusion is functional, not ideological.

  **5. Can genuine partial comparability be used without collapsing to full comparability?**
  **No, not in a binding decision procedure.**
  *   **Reasoning:** Partial comparability (e.g., Sen's capability approach) yields a partial ordering (some states are incomparable). A national CBA must produce a recommendation (Choose Policy X or Y). To move from a partial order to a choice, a **decision rule** (e.g., Maximin, Leximin, or a tie-breaking heuristic) must be applied. That decision rule implicitly imposes a complete ordering on the previously incomparable items. Thus, the *choice mechanism* quietly converts partial comparability back into full comparability at the moment of decision. To remain truly partial, the CBA would have to allow for "no decision" outcomes, which is administratively non-viable.

  ***

  ## Closing Note on Main Families of Accounts

  *   **Utilitarianism:** Satisfies Grade 1 (Cardinality/Unit Comparability) easily but struggles with Grade 2 (Zero Point) and Grade 3 (Level Comparability is unnecessary for them but often assumed).
  *   **Prioritarianism:** Requires the Grade 3 stipulation of Level Comparability to function; fails the "neutral" test for citizens who are utilitarian.
  *   **Capability Approach:** Naturally aligns with Grade 2 (Agent-Neutral) and Grade 5 (Partial Comparability) but fails Grade 1 (Cardinality) unless heavily modified, making it difficult to use for standard CBA weighting.
  *   **Preference Satisfaction:** Struggles with Grade 2 (Blunted Affect/Adapted Preferences) unless it adopts external normalization, which pushes it toward Objective List theories.
  *   **Hedonism:** Best fits Grade 1 (Measurement) and Grade 2 (Normalization) but fails the Grade 3 test for citizens who value autonomy over experience.
