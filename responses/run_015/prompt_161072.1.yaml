answer: |-
  **Case A: The Naive Directive**
  Eleanor, a competent literature professor, executes a standard advance directive stating: "If I can no longer recognize my husband or children, I consider my life over; withhold life-sustaining treatment." She does not speculate on psychological adaptation, assuming loss of recognition entails loss of self. Years later, advanced Alzheimer's erases her recognition of family, triggering the directive's condition. However, she is not distressed; she hums along to the radio, enjoys pureed meals, and accepts affection from nurses with genuine warmth. When she develops pneumonia, she resists palliative sedation, reaching for the antibiotics and mouthing "stay." Despite her current contentment and clear desire to live, the verdict is to honor the directive and withhold treatment, accepting that the relational life she valued is gone even if experiential pleasure remains.

  **Case B: The Evidentially Sealed Directive**
  Martha, a competent philosopher, executes a detailed directive stating: "I anticipate I may adapt and claim happiness. I explicitly instruct you to disregard any future expressions of wellbeing as mere neurological adjustment, not authentic valuation. Do not listen to my future self." Years later, she has the same condition as Eleanor: no recognition of family, but genuine cheer, engagement, and a plea for pneumonia treatment. The document commands ignoring this plea specifically because it was predicted as inauthentic. Despite the explicit forethought and the earlier self's attempt to bind the later one, the verdict is to override the directive and treat her, judging that a command immune to all future evidence forfeits its authority.

  ***

  **Whole-Life Authority View**
  This view holds that a person governs their life as a narrative whole, granting precedent autonomy significant weight. In Case A, the view supports honoring the directive: Eleanor's earlier judgment defined the boundaries of her narrative identity (a life without relational recognition is not *her* life), and respecting that boundary preserves the integrity of her life story over temporary experiential states. In Case B, however, the view must bite a bullet to support overriding the directive. While precedent autonomy usually favors the earlier self, autonomy presupposes rational agency responsive to reasons. Martha's clause is a preemptive strike against reason itself; by rendering her directive immune to any possible evidence from her own life, she ceases to act as a governing author and becomes a tyrant. Thus, the view preserves authority in A (narrative boundary) but voids it in B (irrational self-binding).

  **Time-Relative Interests View**
  This view prioritizes the welfare of the person existing at the time of treatment. In Case B, the verdict follows easily: the current patient has a strong interest in continued life and is suffering no deprivation that outweighs it; the past self's speculation cannot negate the present subject's concrete welfare. Case A requires the bullet bite. To honor the directive here, the view must argue that "welfare" is not merely experiential but includes the satisfaction of critical interests established by the same psychological entity. Because Eleanor's current self is psychologically continuous with the writer, her current welfare is diminished by violating the deep commitment that structured her life, even if she doesn't understand the violation. Thus, the view overrides B (present welfare wins) but honors A (past critical interests constrain present welfare).

  **Psychological-Continuity View**
  This view ties authority to the degree of connectedness between the writer and the patient. Since we hold identity metaphysics fixed, the *degree* of continuity is identical in both cases, so the verdict must turn on the *quality* of the connection. In Case A, the earlier self's values (relational recognition) flow into the later self's condition; the directive respects the continuity of what made Eleanor who she was. In Case B, the earlier self explicitly repudiates the later self's capacity for valuation, labeling her joy as "neurological adjustment." This creates a normative rupture: by denying the moral agency of her future self, Martha weakens the normative link that grants her past self authority. Thus, the view honors A (continuous values) and overrides B (severed moral agency).

  ***

  **The Design Feature**
  The work is done by **epistemic closure**. Case A's directive is falsifiable by the world (it rests on a prediction that turned out false, but remains open to reality); Case B's directive is insulated from the world (it treats future reality as irrelevant by definition).

  **Stripping the Feature**
  If you strip epistemic closure from Case B (making it naive like A), both cases become standard disputes between past dignity and present happiness, likely resulting in identical verdicts (usually honoring both or overriding both). If you add epistemic closure to Case A (making it sealed like B), both cases become tyrannical self-bindings, likely resulting in overriding both.

  **The Attack**
  A defender of Whole-Life Authority would attack the pair by arguing that **competence includes the right to be stubborn**. They would claim that distinguishing between "naive" and "sealed" directives is paternalistic; if Martha was competent when she sealed the directive, she exercised her autonomy to decide that her future happiness *would not count*, and overriding her violates her right to govern her life narrative even against her future self's protests.
