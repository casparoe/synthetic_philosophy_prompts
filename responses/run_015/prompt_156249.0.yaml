  Hi there,

  It sounds like you have put a lot of careful thought into this, and honestly, the package you have assembled is more coherent than most first passes at these problems. You are trying to balance a commitment to doing the most good with a healthy skepticism about your ability to predict the future, which is exactly where the interesting philosophical friction lies. However, your friends are right to push back because there are genuine tensions here, not just apparent ones. I will walk through the conflicts I see, rank them by how badly they threaten the consistency of your view, and then suggest the single change that would do the most work to resolve them.

  The most severe tension, and the one that threatens to break your decision-making machinery entirely, is the conflict between your first point and your seventh point. In your first point, you commit to maximizing expected value, which is a mathematical operation that fundamentally relies on multiplying probabilities by magnitudes of outcome. But in your seventh point, you introduce a rule of sign-robust satisficing that explicitly tells you not to let how big an effect might be do any work in the decision. You cannot consistently maximize expected value while ignoring the magnitude of the effects. If you ignore magnitude, you are no longer maximizing expected value; you are maximizing robustness of direction. This is a logical contradiction in your core decision procedure. To resolve this, one of them has to give. If you give up the first point, you abandon standard consequentialism for a form of robustness criteria, which costs you the ability to make trade-offs between high-probability small gains and low-probability large gains. If you give up the seventh point, you lose your specific shield against cluelessness. The cheaper patch here is to modify the seventh point rather than deleting it. Instead of ignoring magnitude entirely, you could adopt a rule that discounts magnitude heavily based on uncertainty. This allows you to keep the first point as your ideal while using a modified version of the seventh point as a heuristic constraint, preserving the spirit of caution without breaking the math of your moral theory.

  The second most severe tension involves the relationship between your longtermism and your cluelessness, specifically the clash between your fourth point and your sixth point, mediated by your second point. Your fourth point claims that long-run effects should dominate near-term stuff because the stakes are astronomical. However, your second point says your estimates of those long-run effects are close to noise, and your sixth point says that when cluelessness is radical, you are permitted to focus on near-term projects. If you accept the second point as universally true for long-term interventions, then the sixth point effectively neutralizes the fourth point. You end up with a view that says the long term matters most in theory but the near term matters most in practice because you can never know enough about the long term. This renders your longtermism inert. Additionally, your fifth point, where you reject fanaticism, pulls against the fourth point. The reason long-term effects usually dominate near-term ones in these models is precisely because of the fanaticism-like math where a tiny probability of an astronomical future swamps certain near-term gains. By rejecting fanaticism in the fifth point, you remove the engine that drives the fourth point. To fix this, something in the chain from two to six must give way. If you give up the fourth point, you cease to be a longtermist. If you give up the second point, you risk overconfidence. The cost of giving up the sixth point is that you might end up paralyzed or gambling on bad models. A cheaper patch would be to narrow the scope of the second point. You could argue that cluelessness is not uniform; some long-term interventions, like pandemic preparedness or certain governance improvements, have more sign-robust positive effects than others. This allows you to maintain the fourth point without accepting the paralysis of the sixth point, by identifying a subset of long-termist actions that survive the cluelessness objection.

  There is a third, less severe tension between your first point and your third point regarding hedging across moral views. Your first point suggests maximizing expected value, which usually implies a single axiology, while your third point suggests hedging across a range of plausible moral views. This is not a contradiction per se, as you can maximize expected value relative to a distribution over moral theories, often called moral uncertainty. However, it complicates the first point because it changes what value means. If you give up the third point, you risk dogmatism about your current moral intuitions. If you give up the first point, you lose the consequentialist framework. The cost here is low because these are generally compatible through the framework of expected moral value. The patch is simply to clarify that the expected value in the first point is calculated across the moral hypotheses mentioned in the third point, ensuring they are integrated rather than in competition.

  Ranking these by severity, the conflict between maximizing expected value and ignoring magnitude is the most critical because it makes your decision rule incoherent. The conflict between longtermist dominance and cluelessness-based permissiveness is second because it makes your practical conclusion contradict your theoretical priority. The moral hedging issue is minor by comparison.

  If you are looking for the single revision that would clean up the most mess at once, I recommend modifying your seventh point. Currently, it acts as a hard constraint that bans magnitude from consideration, which directly contradicts your first point and indirectly supports the paralysis of your sixth point. If you revise the seventh point to allow magnitude to count but require it to be heavily discounted by the degree of uncertainty or model instability, you resolve the contradiction with the first point. You can still maximize expected value, but it becomes a risk-weighted expected value. This also helps with the longtermism tension because it allows you to distinguish between long-term interventions that have robust positive signs and those that are pure noise, giving you a way to act on the fourth point without fully succumbing to the paralysis of the sixth point. This single change preserves your consequentialist core, respects your intuition about cluelessness, and keeps the door open for longtermist action without requiring you to accept fanaticism or abandon your skepticism.

  I hope this helps clarify where the friction points are for your reading group. It is a strong position, and with that one adjustment, it should hold up much better under scrutiny.

  Best wishes
