  1. Ontological and logical implications

  Accepting Brouwer's strong ontology dismantles the classical conception of truth as correspondence to a static realm. If mathematical objects are mental constructions arising temporally, then bivalence fails ontologically, not merely epistemically. A proposition concerning a free choice sequence possesses no truth value until the constructing subject determines the next term. Consequently, the Law of Excluded Middle is not merely a restricted logical rule but a misdescription of mathematical reality; there is no 'fact of the matter' waiting to be discovered. This implies mathematics is fundamentally creative rather than descriptive. The universe of mathematics is not a pre-existing platonistic structure but an open-ended unfolding of the intuition of time. Therefore, the disagreement with your colleague is substantive: the logical revision is symptomatic of a deeper metaphysical shift. Truth becomes synonymous with provability via construction, and since free choices are indeterminate, propositions about the infinite future of a sequence are neither true nor false. This denies the realist notion that mathematical statements describe independent entities, positioning the mathematician as an agent whose free acts constitute the very fabric of mathematical being. Regarding invention versus discovery, this view suggests a hybrid: we discover the constraints of our own mental apparatus, but invent the specific constructions within them. This renders the idea of a completed infinity incoherent, replacing it with potential infinity grounded in the subjective experience of temporal succession. The logical restrictions are thus not arbitrary constraints but necessary consequences of a universe that is literally being written as we think. There is no shadow realm of unconstructed numbers; existence is identical to constructibility.

  2. Analytical and computational implications

  In analysis, the strong intuitionist ontology yields startling results. The classical Intermediate Value Theorem fails in its standard form because one cannot assert the existence of a root without an algorithm to locate it; one can only prove a root exists if one can construct it to arbitrary precision. More radically, Brouwer's continuity principle dictates that all total functions on the continuum are continuous. This eliminates everywhere discontinuous functions, such as the Dirichlet function, regarding them as linguistic nonsense rather than genuine mathematical objects. For numerical analysis, this does not imply conceptual confusion but rather reinterprets classical results as pragmatic approximations of constructive processes. Classical analysis becomes a useful shorthand for dealing with idealised limits that cannot be fully realised. It is not false, but incomplete; it describes the shadow of constructive activity. Regarding formal verification, the Curry–Howard correspondence aligns proof with program, which suits constructive logic well. However, free choice sequences complicate this: if a sequence is not algorithmic, it cannot be represented as a standard computational program. Thus, while type-theoretic assistants validate constructive proofs, they cannot fully capture the non-algorithmic freedom of the intuitionist subject. The system verifies the constraints on construction, but the 'free' element remains outside the formalisation. Consequently, standard numerical methods are accommodated as effective procedures within a constructive substrate, but the classical claim that they approximate pre-existing discontinuous realities is rejected. The computer verifies the validity of the construction, not the correspondence to a platonic truth. Classical theorems are thus retained as heuristic tools, stripped of their ontological weight.

  3. Critical vulnerability

  The primary vulnerability lies in unfalsifiability. By grounding mathematics in private mental acts, intuitionism risks insulating itself from external critique; any contradiction can be blamed on a misinterpretation of the 'creating subject'. Is this a defect? If mathematics is akin to art or logic rather than empirical science, perhaps not. However, it renders the position dogmatic. What counts against it? Fatal evidence would be an internal inconsistency within the intuitionistic framework itself, such as a derivation of a contradiction from the continuity principle. Merely awkward evidence includes the immense success of classical mathematics in physics; the intuitionist must dismiss this as instrumental success rather than ontological insight. Similarly, the difficulty of formalising free choice sequences in proof assistants is inconvenient but not fatal, as formalisation is secondary to the mental act. The claim that mathematics is invented survives, but modified: it is invented within the rigid constraints of temporal intuition. Ultimately, the view is resilient because it retreats to the subjective whenever challenged objectively. To refute it, one must demonstrate that mathematical truth can exist independently of verification, a metaphysical claim that intuitionism simply denies by definition. Thus, the most damaging argument is not empirical failure, but the demonstration that the 'mental construction' narrative adds no explanatory power over structuralist accounts, rendering the ontology an unnecessary metaphysical burden.
