      *(Self-Correction during drafting)*: Make sure to distinguish between *empirical* claims (feed ratios) and *philosophical* claims (wild animal suffering). Ensure the rating reflects the strength of the argument within the context of the debate, not just absolute truth (since some things are unknowable).

      *Refining Move 3 Rating:* Lorna's argument hinges on "wild lives are net negative." This is a huge philosophical claim. I should rate it as "Contingently Right" or "Philosophically Speculative." Let's go with "Theoretically Sound but Empirically Contested."
      *Refining Move 5 Rating:* The dairy-beef link is tricky. If you stop eating beef, male dairy calves might still be born and killed (for veal or waste). But the economic signal matters. I'll rate it "Mostly Right."

      *Final Verdict:* Ash wins on *action guidance*, Lorna wins on *scope of consideration*. But since the goal is "does swapping help," Ash's uncertainty argument is the tie-breaker.

      *Missing Elements:*
      1.  **Sentience Weighting:** Does a cow feel 10x more than a chicken?
      2.  **Causal Impotence/Thresholds:** Does one person switching actually change anything?
      3.  **The "Fish" Elephant:** Neither mentions seafood, which dwarfs both in individual count.
      4.  **Policy vs. Personal:** Is individual consumer choice the right level of analysis?

  6.  **Final Polish:** Check tone. Ensure it sounds like a referee's report. (Proceed to generate output).

      *Wait, one nuance on Move 5:* Lorna says beef parent cost is high because of the dairy link. Ash doesn't rebut this directly in Move 6, he moves to elasticity. I need to note that Ash sidestepped the dairy-beef accounting.
      *Wait, one nuance on Move 3:* Ash's rebuttal (Move 4) is about the counterfactual. Lorna admits the counterfactual point in Move 5 ("Fair on that last bit"). So Move 4 was effective.

