  Step (2) fails.

  It looks true because it conflates a **physical action** with an **institutional act**. In standard decision theory, "doing what you would have done" means moving your hand the same way. In your legal system, a verdict is not a movement; it is a status change constituted by the magistrate's epistemic history.

  The gap between "you can always do what you would have done" and "so you can never lose" is this: **The plan "Ignore the signal and decide as if I hadn't seen it" does not exist on the menu once the signal is seen.**

  If Oduya does not read the page, the plan "Acquit" yields a **Valid Verdict**.
  If Oduya reads the page, the plan "Acquit" (even if she ignores the content) yields a **Void Verdict**.

  These are not the same plan with the same payoff. They are different acts with different consequences. Good's Theorem assumes the utility function depends on the *outcome* and the *state of the world*. In your setting, the utility function also depends on the *state of the agent*. By reading the page, Oduya changes herself from a "Qualified Magistrate" to a "Disqualified Magistrate." She physically *can* sign the paper, but she cannot execute the plan "Issue a Valid Verdict." Step (2) assumes the menu of plans remains constant regardless of information; here, the menu shrinks because the agent's eligibility is part of the plan's success conditions.

  **What accepting this costs you:**
  You must accept that Oduya is not prioritizing "Truth" or even "Justice" in the abstract; she is prioritizing **Validity**. To a reader, this risks making her seem like a bureaucrat rather than a hero. You must work in the scene to ensure "record-purity" is understood not as red tape, but as a structural safeguard against tyranny—so that her refusal to read is seen as guarding the court's power, not evading the truth.

  **The sentence:**
  "If I read this, I can still sign the verdict, but it will no longer be a verdict."
