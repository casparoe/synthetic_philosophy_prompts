answer: |-
  Right, let's get the spec sheet sorted. You're spot on to pause before reading more theory; if you don't know what the theory is supposed to *achieve*, you'll just end up collecting buzzwords. The debate between 'Right to the City' (Lefebvre's idea of participation and use-value) and property rights (zoning as protection of investment) is essentially a clash of specifications.

  Below is the desiderata list for a robust theory of urban rights. I've broken these down into requirements, the reasoning behind them, and whether they are non-negotiable for a coherent theory or merely 'camp preferences' (i.e., ideological wants that might contradict justice).

  ### The Desiderata for a Theory of Urban Rights

  | Requirement | Reasoning | Status |
  | :--- | :--- | :--- |
  | **1. The Non-Exclusion Clause** | The theory must account for people who *do not* own property (renters, the homeless, commuters). If a theory of urban rights only protects title-holders, it is merely a theory of property law, not urban rights. It must explain how a homeless person has a claim on the city distinct from a homeowner. | **Non-Negotiable** |
  | **2. Voice vs. Veto Distinction** | It must distinguish between the right to be *heard* (participation in planning) and the right to *stop* (veto). A right to participate is democratic; a right to veto is oligarchic. The theory must specify when local objection can override regional need. | **Non-Negotiable** |
  | **3. Chesterton's Fence Principle** | Before abolishing a zoning rule (e.g., height limits), the theory must require an account of the social function that rule originally served (e.g., sunlight, infrastructure load). You cannot declare a rule 'unjust' without knowing if removing it creates a worse injustice. | **Non-Negotiable** |
  | **4. The Scale Matching Rule** | The theory must align the decision-making body with the scale of the impact. If a housing shortage is a regional crisis, a single neighbourhood council cannot hold the solution hostage. Local rights cannot trump regional survival. | **Non-Negotiable** |
  | **5. The 'Right to Stagnation'** | This claims residents can block change that harms local amenity even if it helps the wider city (e.g., blocking flats to keep views). This privileges the incumbent over the newcomer and treats the city as a museum rather than a living system. | **Camp Preference** (NIMBY/Conservative) |
  | **6. Market Efficiency as Moral Arbiter** | This claims that if someone is willing to pay for a flat, it should be built. While economically sound, this reduces 'rights' to 'purchasing power'. A theory of rights must constrain the market, not just serve it. | **Camp Preference** (YIMBY/Libertarian) |
  | **7. Character Preservation** | This argues that existing 'neighbourhood character' is a good worth protecting. While community cohesion is valuable, 'character' is often a dog-whistle for excluding specific demographics. A theory must define 'character' without allowing exclusion. | **Camp Preference** (Localist) |

  ### On the 'Right to Stagnation'
  Your mate's idea is a clever bit of framing, but in political theory, it is generally regarded as **NIMBYism in fancy clothes**.

  Here is why it fails the non-negotiable test: A 'right to stagnation' effectively grants existing residents a property right over the *future potential* of land they do not own. If I live in a house, I own the house. If I have a right to stop you from building a flat next door, I effectively own a slice of your land's development rights.

  However, to be charitable to your mate: there is a theoretical argument for **Reliance Interests**. People buy homes based on current rules. If the state changes the rules drastically, it devalues their investment. A decent theory must address *transition costs* (how to change rules without ruining existing homeowners) without granting a permanent *veto*. So, while 'stagnation' isn't a right, 'stability during transition' is a valid concern.

  ### The 'Killer' Requirement
  The single requirement that knocks out the most popular theories is **Requirement 2: The Voice vs. Veto Distinction**.

  Here is why it causes so many casualties:
  1.  **It kills Hard Libertarianism:** Libertarians often argue that property rights imply an absolute right to exclude others (a veto). But in zoning, they often want the state to enforce *their* veto against developers. This requirement forces them to admit that property rights in a city are always already regulated by the collective.
  2.  **It kills Hard Localism:** Many community planning theories argue that 'locals know best' and should have final say. This requirement shows that without a regional override, locals will always vote to export their problems (like housing need) elsewhere.
  3.  **It kills Naive Lefebvrianism:** Even the 'Right to the City' crowd sometimes argue that current occupants should decide everything. But if current occupants block new migrants from entering the city, they are violating the 'Right to the City' for the outsider.

  If a theory cannot explain why a resident has a right to object to a building's *design* (Voice) but not a right to object to the building's *existence* (Veto) when housing need is critical, it is theoretically bankrupt.

  ### A Note on Chesterton's Fence
  Your tutor is right to bring this up. In urban planning, zoning laws often look stupid until you realise they are proxy regulations for something else.
  *   *Example:* A rule banning multi-family homes might look like classist exclusion (which it often is). But it might have been originally installed to prevent sewage overload in 1950s pipes.
  *   *The Spec:* Your theory must demand **Functional Audit**. You cannot repeal a rule on moral grounds until you have checked the engineering or infrastructural grounds. If you repeal the moral exclusion but break the sewage system, you haven't achieved justice; you've just created a different crisis.

  ### Summary for your Essay
  If you want to cut through the noise, argue this:
  A valid theory of urban rights must treat the city as a **system of access**, not a **collection of fiefdoms**.
  *   **Non-negotiable:** Renters count as much as owners. Regional need trumps local preference.
  *   **Negotiable:** How fast we build, what the buildings look like, how we compensate existing owners for the transition.
  *   **The Trap:** Do not accept the 'Right to Stagnation'. It is a claim to ownership over the future, which no current resident possesses.

  Good luck with the course. It's a proper mess, but if you hold that line on Voice vs. Veto, you'll be ahead of most of the cohort. Cheers.
