      *   *Zoning/Planning:* The mechanism of control.
      *   *Chesterton's Fence:* Don't remove a fence until you know why it was put up.
      *   *Right to Stagnation:* The claim that existing residents have a veto over change to preserve the status quo.

  3.  **Drafting the Desiderata (The "Spec"):**
