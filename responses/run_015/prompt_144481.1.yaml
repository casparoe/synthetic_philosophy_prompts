prompt: |-
  hey, so im in this urban politics course and weve been arguing about nimbyism and whether people actually have a right to the city or if thats just a slogan people use when they dont want flats built near them. me and my mates got into it about zoning reform and i realised i dont really know what im asking a theory to do — like, whats the full spec?

  before i read any more, i want the desiderata list for any decent theory of urban rights. what cases must it actually cover — renters, homeowners, people who need emergency shelter, people who want to preserve neighbourhood character, and those who just want to block everything? what distinctions cant it collapse, like between having a genuine right and just having a veto, or between justice and pure preference? it shouldnt flat out contradict basic housing economics but also shouldnt reduce rights to market efficiency. my tutor mentioned chestertons fence, so does the theory need some principle that you cant tear down a zoning rule without knowing what problem it solved, even if its unfair now? also my friend came up with this idea of a right to stagnation — residents can block change that harms their local interest even if it clearly helps the wider city — and i want to know if thats a real desideratum or just nimbyism in fancy clothes. please write in british english: give me the requirements with the reasoning behind each, flag which are non-negotiable and which are just camp preferences, and tell me which single requirement knocks out the most popular theories. a table is fine. cheers.
