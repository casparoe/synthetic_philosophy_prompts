answer: |-
  # The Ashfield Findings Framework

  **Purpose:** To guide the Naming and Memorials Commission in producing advisory findings within the constraints of limited research (one-page memo), limited time (90-minute hearing), and advisory status.

  **Core Principle:** Commemoration is a public utility. Like any utility, it must function for its current users, not just its original builders.

  **Definitions:**
  *   **The Second Audience:** The current citizens who interact with the commemoration involuntarily (residents, commuters, students).
  *   **The Legibility Condition:** The requirement that the meaning of the object be accessible to a reasonably attentive passerby using only site information and common civic knowledge.
  *   **Captured Meaning:** When an object's public function shifts from its original intent to a secondary use (rally point, threat, badge) evidenced by public record.

  ---

  ## I. The Procedure (Ordered Questions)

  The Commission shall address the following questions in order. If a question returns a "No Answer" or "Stop," the procedure terminates at the specified disposition.

  ### Q1: Jurisdiction and Status
  *   **Question:** Is the object located on public property or dedicated to public use, and does it function primarily as a commemoration (honor/memory) rather than pure infrastructure?
  *   **Sufficient Answer:** Yes (Public deed recorded; dedicatory plaque/text present).
  *   **No Answer:** No (Private property; purely functional signage).
  *   **Stop Point:** If **No**, the Commission returns **No Jurisdiction**.
  *   **Value Hand-off:** If the object is hybrid (e.g., a street name), proceed to Q2.

  ### Q2: The Legibility Condition
  *   **Question:** Can a citizen understand *who* or *what* is being commemorated and *why* without consulting external research?
  *   **Sufficient Answer:** Yes (Name is self-explanatory, or plaque explains context on-site).
  *   **No Answer:** No (Meaning requires specialist knowledge or the one-page memo).
  *   **Remedy:** If **No**, may the addition of a contextual plaque satisfy the condition without altering the object's physical integrity?
      *   If Yes: Recommendation is **Retain with Alteration**.
      *   If No (plaque would clutter or contradict the object): Proceed to Q3.
  *   **Value Hand-off:** If commissioners disagree on whether a plaque "changes the object," this is a value judgment on *Preservation vs. Truth*. Vote.

  ### Q3: The Second Audience Burden (Removal/Renaming Only)
  *   **Question:** Does the continued existence of this commemoration impose a dignitary or practical burden on the Second Audience?
  *   **Sufficient Answer:** Yes (Evidence of harm, exclusion, or humiliation in the memo or public testimony).
  *   **No Answer:** No (Objection is abstract or historical only).
  *   **Weighting:** The burden on the Second Audience outweighs the intent of the original donor. The burden on the Second Audience outweighs the cost of change.
  *   **Stop Point:** If **Yes**, proceed to Q5 (Asymmetry Check).
  *   **Stop Point:** If **No**, proceed to Q4.

  ### Q4: Captured Meaning (Removal/Renaming Only)
  *   **Question:** Has the object acquired a secondary meaning that overtakes its original purpose?
  *   **Evidence Standard:** Given the one-page memo, capture must be evidenced by: (a) sustained press association, (b) police records of assembly/conflict, or (c) consistent usage in public discourse over at least 20 years.
  *   **Sufficient Answer:** Yes (Evidence meets standard).
  *   **No Answer:** No (Evidence is sporadic, ancient, or contested).
  *   **Stop Point:** If **Yes**, proceed to Q5.
  *   **Stop Point:** If **No**, Recommendation is **Retain**.

  ### Q5: The Asymmetry Check
  *   **Question:** Is this petition for Installation or Removal/Renaming?
  *   **Rule:** Installing and Removing are **not** mirror images.
      *   **Installation:** Requires **Positive Merit**. (Does this person/event deserve honor? Is there a waiting period?)
      *   **Removal:** Requires **Negative Harm** or **Functional Failure**. (Does this object hurt the city now? Is it illegible?)
  *   **Sufficient Answer:**
      *   For Installation: Merit established + Eligibility criteria met (e.g., deceased, waiting period).
      *   For Removal: Harm established (via Q3) OR Capture established (via Q4).
  *   **Stop Point:** If Installation criteria are not met: **Reject** or **Defer**.
  *   **Stop Point:** If Removal criteria are not met: **Retain**.
  *   **Value Hand-off:** If Harm and Merit are both present (e.g., a harmful name vs. a worthy replacement), the Commission votes on **Community Cohesion**.

  ### Q6: The Value Hand-off (Final Disposition)
  *   **Question:** If the procedure yields a tie or a "Value Hand-off" point, what is the primary value at stake?
  *   **Options:** Historical Continuity vs. Corrective Justice.
  *   **Procedure:** Majority vote. Minority opinion recorded in findings.
  *   **Disposition:** **Recommend Removal**, **Recommend Retention**, or **Defer**.

  ---

  ## II. Dropped Distinctions

  To make this machinery runnable by volunteers, the following philosophical distinctions are explicitly dropped:

  1.  **Original Intent vs. Current Impact:** We do not weigh whether the donor *meant* well. If the Second Audience is harmed, the intent is irrelevant. *Loss:* We lose the nuance of historical charity; good men who did bad things are judged by the bad things.
  2.  **Artistic Merit as Shield:** A statue cannot be saved solely because it is "good art." *Loss:* We treat memorials as civic tools, not museum pieces.
  3.  **The "Slippery Slope":** We do not consider whether removing this object will lead to removing others. Each petition is judged on its own facts. *Loss:* We lose systemic consistency for case-specific justice.

  ---

  ## III. Application to Petitions

  ### 1. Alden Street
  *   **Q1 (Status):** Public street. Commemorative name. **Pass.**
  *   **Q2 (Legibility):** Fails. A passerby knows "Alden" is a name, but not *why* it is honored. The nativist tract is not common knowledge. A plaque could fix this, but naming a street after a nativist is the core issue, not the lack of info. **Fail.**
  *   **Q3 (Second Audience):** Yes. The neighborhood is populated by descendants of the excluded workers. The name is a daily reminder of exclusion (dignitary burden). **Pass.**
  *   **Q5 (Asymmetry):** This is Removal/Renaming. Harm is established in Q3.
  *   **Disposition:** **Rename**.
  *   **Alignment:** Matches author's sympathy.

  ### 2. "The Pioneer Mother"
  *   **Q1 (Status):** Public lawn. Commemorative statue. **Pass.**
  *   **Q2 (Legibility):** Passes. "Mother and Child" is legible as a generic type.
  *   **Q3 (Second Audience):** No specific burden identified. Generic imagery does not target a specific living group. **Fail.**
  *   **Q4 (Captured Meaning):** Evidence exists (1930s-50s rallies). However, the Evidence Standard requires "sustained... over at least 20 years" *and* relevance to current discourse. The capture ended 70 years ago. It is historical, not current. **Fail.**
  *   **Disposition:** **Retain**.
  *   **Alignment:** Matches author's sympathy.

  ### 3. The Pedestrian Bridge
  *   **Q1 (Status):** New Infrastructure. Naming is commemorative. **Pass.**
  *   **Q5 (Asymmetry - Installation):** This is Installation. Requires Positive Merit + Eligibility.
      *   *Proposal A (Developer's Mother):* Living person. Standard Eligibility Criterion 1: "No living persons." **Fail.**
      *   *Proposal B (Labor Organizer):* Deceased 11 months. Standard Eligibility Criterion 2: "Five-year waiting period post-mortem to ensure legacy stability." **Fail.**
  *   **Disposition:** **Defer** (for the Organizer); **Reject** (for the Mother). Overall recommendation: **Defer Naming**.
  *   **Alignment:** **Refuses** author's sympathy.
  *   **Reason:** The "Cooling-Off Period" (Eligibility Criterion 2) does the work. A commissioner agreeing with the author would have to argue for a **Waiver** based on "Immediate Civic Necessity" or "Exceptional Contribution," which requires a unanimous vote under the Procedure's Value Hand-off.

  ---

  ## IV. Contentious Steps (For Character Dialogue)

  These are the steps where reasonable commissioners will fight.

  **1. The Legibility Remedy (Q2)**
  *   *Side A (The Teacher):* "A plaque fixes the lie. We add context, we keep the history. Removal is erasure."
  *   *Side B (The Chaplain):* "A plaque on a statue of a oppressor is an apology, not a history lesson. It asks the victim to read their own humiliation to understand the stone. The object itself is the harm."

  **2. The Duration of Capture (Q4)**
  *   *Side A (The Business Owner):* "The rallies stopped seventy years ago. You can't punish a statue for what strangers did in the Depression. That's not the statue's fault."
  *   *Side B (The Youth Appointee):* "The stone doesn't forget. If it was a beacon for exclusion then, it's still made of that history. We don't get to say the poison expired just because we stopped drinking it."

  **3. The Waiting Period (Q5 - Installation)**
  *   *Side A (The Attorney):* "Five years. Grief needs time to settle. We don't know yet if she's a hero or a scandal. The rule protects us from our own impulses."
  *   *Side B (The Narrator):* "He died giving us this city. Waiting five years says his life doesn't matter until it's safe to remember. Some debts are due immediately."

  ---

  ## V. Limitations of the Procedure

  1.  **Truth Adjudication:** The Commission cannot verify contested history. If the memo says "X" and testimony says "Y," the Commission must vote on credibility, not fact. It will get wrong any petition where the archivist's record is incomplete.
  2.  **Council Override:** The procedure produces *recommendations*. It cannot stop the City Council from ignoring a finding of "Harm" or installing a name despite a "Reject." It cannot compel political will.
  3.  **Healing:** The procedure can remove a harm, but it cannot repair the community rift that caused the petition. It is a triage tool, not a cure.

  \answer{Alden Street: Rename; Pioneer Mother: Retain; Bridge: Defer}
