      *Refining for flow and tone:* Ensure it sounds like an email. "Dear colleague" might be too formal for the prompt's "way you would write an email to a colleague". I'll start directly. "I have audited..." is fine. Make sure the epistemic markers are clear. Ensure the distinction between (3) and (4/7) is sharp.

      *Final Polish:* Check for any accidental formatting. Ensure the distinction between interactor/beneficiary in (1) is used to solve (2)/(6). Ensure the solution for (3)/(4) is clear.

      *Wait, one check on (5) vs (7):* The user says in (5) "nothing is being selected at the level of the organism against the gene." In (7) "genuine conflict between levels." The difference might be the evolution of restorer genes in (7) implies a counter-adaptation at the nuclear/organism level. In (5) suppressors evolve too. The user needs to be careful. I will suggest the lineage independence argument.

