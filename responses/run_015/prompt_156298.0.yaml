  # JOINT STATEMENT ON DE RE MODALITY AND TRANSWORLD ONTOLOGY

  **Signatories:**
  *   **The Counterpart Theoretic Bloc (CT)**
  *   **The Transworld Identity Bloc (TWI)**

  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Metaphysics of Modality

  ## I. AGREED CLAIMS

  We, the undersigned, acknowledge the following points of convergence regarding the logical structure and phenomenological data of modal discourse. These claims form the shared basis upon which our metaphysical divergence rests.

  1.  **Formal Validity:** Both parties accept standard quantified modal logic (specifically system S5) as a valid formal apparatus for modeling the truth conditions of modal propositions. We agree that possible-worlds semantics provides the correct model-theoretic framework for evaluating validity, even if we disagree on the ontological status of the "worlds" in the model.
  2.  **De Re / De Dicto Distinction:** We agree that a meaningful distinction exists between *de dicto* modality (modality attaching to propositions) and *de re* modality (modality attaching to objects). We agree that sentences like "Nixon could have lost the election" express true *de re* modal claims.
  3.  **Essential vs. Accidental:** We agree that objects possess some properties essentially (properties they have in every world in which they exist) and some accidentally (properties they have in the actual world but could lack). We agree that self-identity is essential, while spatial location and most relational properties are accidental.
  4.  **Limits of Indiscernibility:** We agree that the "Identity of Indiscernibles" fails across worlds. Two distinct possible worlds can be qualitatively identical. Consequently, qualitative similarity alone is insufficient to establish transworld identification or counterpart relations without additional haecceitic or contextual constraints.
  5.  **Non-Uniqueness of Relations:** We agree that the relation used to track individuals across worlds (whether identity or counterparthood) is not always unique. An object in the actual world may have multiple distinct counterparts in a single possible world, or no counterpart at all, depending on the context of evaluation. Similarly, transworld identity criteria face challenges regarding fission and fusion cases.
  6.  **No-Go Results:** We agree that standard no-go results (e.g., the failure of the necessity of distinctness in certain counterpart setups, or the vagueness of transworld identity) do not rule out the possibility of a coherent theory of *de re* modality. Rather, they constrain the specific metaphysical commitments required to sustain such a theory.

  ## II. DISAGREEMENTS

  The following table outlines our fundamental metaphysical divergences. Each statement is phrased in the terminology preferred by the respective party to ensure charitable interpretation.

  | Topic | Counterpart Theoretic Bloc (CT) | Transworld Identity Bloc (TWI) |
  | :--- | :--- | :--- |
  | **1. Transworld Existence** | **Individuals are world-bound.** No single concrete particular exists in more than one possible world. What we call "possibilities for an object" are actually possibilities for *counterparts* of that object. | **Individuals are transworld.** One and the same concrete particular can exist in multiple possible worlds. Modality concerns the very same object having different properties in different states of affairs. |
  | **2. Grounding of Modal Truth** | **Modal truths are grounded in similarity.** A statement "a could have been F" is true iff there exists a world containing a counterpart of *a* that is F. The counterpart relation is a matter of degree and context, not metaphysical necessity. | **Modal truths are grounded in identity.** A statement "a could have been F" is true iff there exists a possible world where *a* itself exists and is F. The relation is strict identity, grounded in the object's essence or haecceity. |
  | **3. Origin Essentialism** | **Context-dependent constraint.** Origin essentialism is a pragmatic rule for selecting counterparts. For some contexts (e.g., historical artifacts), origin is crucial; for others (e.g., functional roles), it is not. It is not a uniform metaphysical law. | **Metaphysical necessity.** For concrete contingent beings, origin is essential. An object arising from different gametes, matter, or deployment conditions is numerically distinct. This applies uniformly to organisms and artifacts. |
  | **4. Abstract Objects** | **Abstracta are world-bound or non-existent.** If abstract objects exist, they are world-bound like concreta. If they are Platonic, they exist in all worlds but do not vary, making *de re* modality regarding them trivial or nonsensical. | **Abstracta are necessary existents.** Abstract objects (numbers, propositions) exist in all worlds and do not have origins in the contingent sense. Origin essentialism applies only to contingent concreta. |

  ## III. CRUXES AND TEST CASES

  We identify the following sub-questions as "cruxes." Settling these empirically or logically would compel at least one party to revise their position. For each crux, we specify a concrete case and record our divergent predictions.

  ### Crux 1: The Nature of Haecceity vs. Quality
  **Sub-Question:** Is there a fact of the matter about *which* object is which in qualitatively identical scenarios, independent of qualitative properties?
  **Case:** A universe containing two qualitatively identical spheres, Castor and Pollux. In a possible world, Castor vanishes.
  *   **CT Prediction:** There is no fact of the matter regarding *which* sphere vanished, only that a counterpart of the actual two-sphere configuration exists with one sphere. "Castor" is a label we apply based on context, not a metaphysical tag.
  *   **TWI Prediction:** There is a fact of the matter. Castor has a haecceity (thisness) distinct from Pollux. The world where Castor vanishes is distinct from the world where Pollux vanishes, even if they are qualitatively identical.

  ### Crux 2: Vagueness of Identity
  **Sub-Question:** Can identity itself be vague, or is vagueness always semantic?
  **Case:** A Ship of Theseus scenario extended across worlds. In World W, 51% of planks are replaced. In World W*, 49% are replaced.
  *   **CT Prediction:** The counterpart relation is vague. It can be indeterminate whether the ship in W is a counterpart of the actual ship. This vagueness is ontological regarding the relation.
  *   **TWI Prediction:** Identity is never vague. If it is the same ship, it is the same ship. Vagueness lies in our concept "Ship of Theseus," not in the object's identity conditions. One precisification makes it identical, another makes it distinct.

  ### Crux 3: The Blockchain Smart Contract Instance (Required Test Case)
  **Sub-Question:** Does the causal-historical origin of a digital instance constitute its identity, or is functional realization sufficient?
  **Case:** A smart contract **C** is deployed on a blockchain at Block Height **H** with Sender Nonce **N**, resulting in unique Address **A** and Hash **Z**.
  *   **Scenario:** Consider a possible world **W+** where the contract code, state, and functionality are identical, but the deployment transaction used Nonce **N+1** (resulting in Address **A'**) or occurred at Block Height **H+1**.
  *   **Agreed Analogy:** Both parties agree this is structurally analogous to classic origin-essentialism puzzles (e.g., the table made from different wood).
  *   **CT Prediction:** In **W+**, a **counterpart** of **C** exists. Whether we call it **C** depends on the context. If the context is "functional security," the different address (A') makes it a poor counterpart. If the context is "code logic," it is a near-perfect counterpart. There is no metaphysical fact that **C** is *absent*; there is only a fact about similarity metrics.
  *   **TWI Prediction:** In **W+**, **C** is **absent**. A distinct contract **C*** exists. The deployment transaction (origin) is essential to the identity of the contract instance. Because the causal history (Nonce/Block) differs, the numerical identity is broken, regardless of functional indistinguishability.

  ## IV. VERBAL DISPUTE ANALYSIS

  We have analyzed whether our disagreement is substantive or merely verbal. We conclude the dispute is **partially verbal, but with substantive remnants.**

  1.  **Purely Verbal Component:**
      *   **The phrase "exists in."**
      *   **Why:** When CT says "Object O does not exist in World W," they mean "O is not a mereological part of the concrete cosmos W." When TWI says "Object O exists in World W," they mean "O is a constituent of the abstract state of affairs W."
      *   **Resolution:** If we translate CT's "exists in" to "is a part of" and TWI's "exists in" to "is represented by," the contradiction dissolves. Both agree on the structural relations between the actual object and the non-actual scenario.

  2.  **Substantive Component:**
      *   **The Grounding of Modal Truth.**
      *   **Why:** Even if we standardize terminology, we disagree on what *makes* modal claims true. CT posits that modal truth is made true by the existence of concrete, qualitatively similar entities in other causal isolates. TWI posits that modal truth is made true by the primitive essences of actual objects extending into abstract possibilities.
      *   **Resolution:** This is not verbal. It is a disagreement about the fundamental ontology of reality (Concrete Modal Realism vs. Actualism/Abstractionism). The Blockchain Test Case (Crux 3) highlights this: CT allows the truth value of "This is Contract C" to shift with context; TWI insists the truth value is fixed by metaphysical law.

  **Signed,**

  *For the Counterpart Theoretic Bloc*
  *For the Transworld Identity Bloc*
