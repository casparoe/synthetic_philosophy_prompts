answer: |-
  Pain asymbolia undermines the phenomenal-intrinsic view because patients retain painful qualia without experiencing badness, demonstrating that sensory feel lacks intrinsic disvalue. It similarly challenges the purely motivational view by revealing avoidance drives are separable from nociception, implying motivation is a response to affective badness rather than its constitution. To resolve this, a three-layer framework distinguishes sensory encoding (nociceptive data), affective valence (suffering), and independent evaluative appraisal (judgment of harm). In asymbolia, sensory encoding persists while affective valence is severed, rendering the sensation intrinsically neutral despite its association with tissue damage. Consequently, asymbolic pain is not genuinely harmful in itself but instrumentally problematic due to ignored injury. This supports a hedonist theory of well-being where only unpleasant affect constitutes intrinsic damage, while sensory discrimination and behavioral dispositions remain morally neutral unless they generate suffering. Thus, well-being depends on affective experience, not mere nociception or failure to avoid harm, validating the intuition that pain without suffering lacks intrinsic badness.
