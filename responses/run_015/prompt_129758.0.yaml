  **Interview Questions for the Redundancy Pluralism Colloquium**

  **1. The Explanatory Payoff of the Parallel/Conjunctive Distinction**
  You distinguish between *parallel sufficient conditions*, where independent causal streams converge, and *conjunctive necessary conditions*, where interdependent factors must jointly obtain. A critic might argue that this is merely a taxonomic exercise—a way of labeling causal structures without altering the underlying metaphysics of historical explanation. What genuine explanatory work does this distinction perform that a standard INUS (Insufficient but Necessary part of an Unnecessary but Sufficient condition) account cannot capture?

  **2. Follow-up: Operationalizing Counterfactuals**
  *I anticipate you will reply that the distinction dictates which counterfactuals are legitimate to run.* If the distinction is primarily methodological rather than ontological, does this imply that historians who rely on single-factor counterfactual analysis are not necessarily *wrong* about the past, but merely employing an inferior testing protocol? How do we adjudicate between a historian who finds a single necessary condition and your claim that there are multiple sufficient sets?

  **3. The Challenge of Microhistorical Scope**
  Redundancy pluralism seems intuitively robust for macrohistorical events like the fall of Rome, where structural forces are diffuse. However, consider a microhistorical explanation, such as a specific minister's decision to sign a treaty. Here, the causal chain appears singular and agent-specific; it is difficult to imagine independent sufficient conditions for a specific mental act at a specific time. Does your view entail that overdetermination vanishes at the micro-scale, or must we posit redundant psychological or social pathways even for individual decisions?

  **4. Follow-up: Scale-Sensitive Pluralism**
  *You are likely to argue for a form of scale-sensitive pluralism, where redundancy is a feature of macro-structures but not micro-events.* If so, where is the boundary? If a macro-outcome is constituted by a series of micro-decisions, and those micro-decisions are not overdetermined, does the macro-overdetermination rest on a foundation of singular causal chains? If yes, does this not reintroduce a form of causal hierarchy that your view seeks to avoid?

  **5. Normative Implications for Narrative Weight**
  If identifying a "primary cause" systematically obscures redundant pathways, does your view require that historians assign equal narrative weight to all sufficient conditions in their writing? If a historian foregrounds one sufficient pathway for the sake of narrative coherence, are they thereby producing a distorted explanation, or is there a permissible distinction between causal completeness and narrative pragmatics?

  **6. Follow-up: Explanatory Economy without Hierarchy**
  *I expect you will suggest that explanatory economy can be preserved without imposing a causal hierarchy.* But by what criteria should a historian select which redundant pathway to foreground if not by causal strength or necessity? If the selection is based on audience interest or archival availability, does this not render the explanation perspectival in a way that undermines the objective status of the redundant structure you claim to have identified?

  **7. Objectivity versus Perspectivalism**
  This brings us to the epistemic status of your view. Does the presence of multiple sufficient conditions make macrohistorical explanation more *objective*, because the redundant pathways provide cross-checking constraints that any valid explanation must accommodate? Or does it make explanation more *perspectival*, because different scholars can legitimately foreground different sufficient conditions without contradicting one another?

  **8. Follow-up: Historiographical Disagreement**
  *You might argue that redundancy allows for consensus on the structure of possibilities even if narratives differ.* However, if two historians propose different sufficient conditions that are empirically incompatible (e.g., one claims economic collapse was sufficient, another claims military defeat was sufficient, but evidence suggests neither alone would have sufficed without the other), how does redundancy pluralism resolve this disagreement? Does it not risk turning causal disputes into merely verbal ones about how we carve up "sufficient sets"?

  **9. Concluding Question: Falsification and Empirical Constraints**
  To conclude, I want to press on the resilience of your position. What specific empirical finding or historiographical result could genuinely weaken or falsify the redundancy pluralist view? For instance, if we found a major historical outcome where removing *any* single factor from a causal set prevented the outcome, would you concede that overdetermination is rare, or would you argue that we simply haven't identified the parallel sufficient set that was absent in that specific case?

  **10. Follow-up: The "Research Program" Deflection**
  *My concern is that you may deflect by characterizing redundancy pluralism as a heuristic research program rather than a falsifiable claim.* If the position is insulated from counter-evidence by the assumption that unobserved redundant pathways *might* have existed, does the view not risk becoming unfalsifiable? What constraint prevents redundancy pluralism from becoming a default assumption that historians apply regardless of the empirical evidence for singular causation?
