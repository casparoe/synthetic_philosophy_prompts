      *Actually, re-reading:* "swap out every docker layer every sprint but keep the same container hash." This is technically impossible in Docker (content-addressable storage). If layers change, the image ID changes. They likely mean the *Tag* (e.g., `myapp:production`) points to a new Image ID. I should point this out because it actually strengthens the "Identity is a label" argument—the label is decoupled from the content. I will treat their "hash" as "Tag/Identifier."

  7.  **Finalizing the Arguments:**
