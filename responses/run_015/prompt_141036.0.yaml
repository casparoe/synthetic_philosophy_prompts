answer: |-
  The cord lay on the kitchen table, catching the afternoon light. Three beads: yellow, green, green.

  David tapped the printed sheet of photos. "Look at the history. Monochrome runs. One bead becomes two. Two become three. Three become four. It's arithmetic." He traced the line on the paper. "She adds length. Always length. So Y-G-G becomes Y-G-G-G. She wants the green to hold."

  Mara picked up the cord. It slipped through her fingers, soft as a vein. There was no clasp, no knot. If she turned her hand over, the yellow was now at the end. "Or it becomes Y-Y-G-G. She wants the yellow to catch up. It's the same rule, David. Just depends on which way you hold it."

  "It doesn't matter," David said, impatient. "The rule is 'extend the dominant run.' The meaning is continuity. She's telling us she can still work. She wants the loom kept threaded."

  "That's a lot of weight for three beads."

  "It's the only data we have." David leaned forward. "If we pack the loom, we're saying she's done. If this cord says 'continue,' and we pack it anyway, we're saying she's irrelevant. The rule is clear. The corpus is consistent."

  Mara let the cord rest on the tablecloth. The yellow bead sat next to the green. There was no arrow on the color wheel mounted on the wall behind them, just the six hues in a circle. Red, orange, yellow, green, blue, purple. No start, no finish.

  The back door opened. Elias stepped in, smelling of sawdust and oil. He'd managed the textile coop before the stroke, before the silence took her voice. He looked at the cord, then at the wheel on the wall.

  "You're counting beads," Elias said.

  "I'm finding the pattern," David corrected.

  Elias pulled out a chair. "The wheel has no arrow. You know that. Next and previous are the same step." He pointed to the green bead. "On the rim, green touches blue. It also touches yellow. But she never worked yellow into green before. Not in the corpus. Those were single runs. This is a transition."

  "So?" David said.

  "So, if the rule isn't length, it's position. Green moves to Blue. Y-G-B." Elias looked at Mara. "She's not extending the green. She's stepping off it."

  "Stepping off to where?"

  "To the next thing. To the care facility. Blue is the color of the uniforms there." David scoffed. "That's poetry, not logic."

  "It's the loom," Elias said quietly. "Before she stopped speaking, she was winding the blue spool. It was the last thing she touched. The cord isn't a sentence. It's a shuttle."

  Mara looked at her grandmother sitting in the corner by the window. Nana was watching her own hands. They rested on her lap, palms up. The left hand trembled, a fine, constant vibration. The right hand was still.

  David was writing now, scribbling *YGG → YGGG* on the notepad. "It's the only rule that fits all four data points without external context. The wheel is decoration. The length is the signal."

  "The length is the only thing she could control before," Mara said. "Motor function. Just drop the bead, pull the cord. No choices."

  "Exactly," David said. "So she's signaling control. I can do more. Keep the loom."

  Mara stood up and walked to the corner. She knelt beside Nana. The tremor in the left hand was worse when she reached for something. Mara placed the cord in Nana's lap.

  Nana didn't look up. Her right hand moved. She didn't grab the ends. She didn't grab the long green run. Her thumb found the junction where the yellow met the first green. She rubbed the spot where the color changed.

  She pushed the yellow bead away. It slid down the cord, away from her thumb, toward the loose end. She held the green beads fast against her palm.

  David saw it from the table. "She's isolating the green. See? Green is the subject. Y-G-G-G."

  Elias shook his head. "She pushed the yellow away."

  "She dropped the lead bead," David said. "It's waste. It's the start of the string. She's telling us to ignore the start and look at the run."

  Mara watched Nana's thumb. It stayed on the green. But then Nana's index finger curled around the cord, past the green, reaching for the empty space where the next bead would go. Her finger hovered. It didn't stay on the green axis. It drifted slightly clockwise, toward the blue sector of the wheel on the wall.

  It was a tiny movement. A tremor, maybe. Or a reach.

  David was packing his pen. "I'm telling the facility to hold off. The rule holds. She's extending."

  Mara looked at the loom in the other room. It was threaded with green warp. Tight, ready, waiting for a weft that hadn't come in two years. To keep it threaded was to promise a return that required hands steady enough to throw a shuttle. Hands that trembled now.

  If the rule was length, the promise was *more of the same*. Keep the loom. Keep the hope. Keep the green.

  If the rule was the wheel, the promise was *movement*. Green to Blue. Leave the green warp. Wind the blue. Or stop weaving entirely.

  Nana's hand closed. She didn't hold the cord tight. She let it slip through her fingers until the yellow bead disappeared into her palm, hidden. Only the two green beads remained visible, resting against her wrist. Then she opened her hand completely. The cord fell into her lap, a loop. No ends.

  David stood up. "I'm calling them. Telling them to wait."

  Mara looked at the loop in Nana's lap. A circle. The yellow was hidden, but it was still there. The green was visible, but it wasn't growing.

  "The corpus was before," Mara said. Her voice sounded loud in the quiet room. "The single colors. When she could only do one thing at a time."

  David paused, phone in hand. "So?"

  "Now she's doing two colors. Yellow and green. The complexity changed. The rule has to slip."

  David frowned. "That's not how rules work."

  "It is if the rule is her," Mara said.

  She walked to the loom room. She picked up the shears. The green warp was taut, singing slightly when plucked. To cut it was to admit the pattern was broken. To leave it was to lie.

  She thought of the wheel. Green touches Blue. But green also touches Yellow. Nana had hidden the yellow. She had kept the green visible. But she hadn't added to it.

  Mara put the shears back. She went to the supply shelf and took down the blue spool. She didn't cut the green. She didn't thread the blue. She placed the blue spool on the bench next to the green warp.

  She walked back to the kitchen. David was dialing.

  "Wait," Mara said.

  David lowered the phone. "What? The rule says stay."

  "The rule says change," Elias said.

  Mara looked at Nana. Nana was watching the blue spool in Mara's hand. The tremor in her left hand stopped. Just for a second. Her eyes moved from the green cord in her lap to the blue spool in Mara's hand. She didn't smile. She didn't nod. She just let the cord slip further, until it fell onto the floor, uncoiling into a circle that had no ends at all.

  Mara put the blue spool on the table, next to the yellow bead.

  "Pack the green warp," Mara said. "But leave the loom standing."

  David opened his mouth. "That's not what the cord says."

  "It's what the hands say," Mara said. She picked up the cord from the floor. She held it by the green beads. The yellow swung free. "She's not staying here. But she's not done either."

  David looked at the phone, then at the blue spool. He put the phone in his pocket. "Blue spool goes in the box too?"

  "No," Mara said. "That one stays out."

  Elias nodded, once. David picked up the shears. He walked toward the loom room, the metal clicking against his leg. Mara sat down beside her grandmother. She didn't pick up the cord. She just watched the light move across the table, shifting from yellow to green, waiting for the next color to come around.
