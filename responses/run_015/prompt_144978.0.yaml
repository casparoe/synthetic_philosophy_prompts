answer: |-
  Is morality a scalar quantity or a structural requirement? If morality is just one value among many, like art or friendship, maximizing it inevitably crowds out other human goods, making the saint seem one-dimensional and defective. This suggests the saint is too good for humanity. However, the deeper issue might be that morality isn't meant to be maximized at all. Perhaps moral duty has a saturation point; once you meet obligations and show adequate care, extra moral effort doesn't accumulate value. Pursuing more becomes fetishistic, turning virtue into obsession rather than right action. The gut-level take is that the problem isn't competition, but category error. Morality structures life; it doesn't consume it. A saint trying to max out morality misunderstands that being good means leaving room to be human, not replacing humanity with holiness. Goodness is a foundation, not an infinite ladder.
