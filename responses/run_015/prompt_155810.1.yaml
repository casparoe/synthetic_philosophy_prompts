  There is no ghost inside the head called **I**,
  just feedback winding round a closed **loop**,
  emerging from the noise as active **symbol**,
  where neurons fire only to **refer**
  to some abstract, high-level **pattern**
  that constructs the illusion of **self**.

  It is no substance distinct from the **self**,
  nor any flesh that speaks the word **I**,
  but pure logic woven through the **pattern**,
  caught in the endless winding of the **loop**,
  where many levels of description **refer**
  back to the central shining **symbol**.

  Each internal **symbol** points inward,
  defining all boundaries of **self**,
  it does not ever merely **refer**
  to the body that thinks that it's **I**,
  but spirals constantly down the **loop**
  to find the very root of **pattern**.

  Though neurons fade away, the **pattern**
  persists beyond each single **symbol**,
  sustained by energy within the **loop**,
  constituting the whole essence of **self**,
  so when the conscious voice says **I**,
  it is the system here that must **refer**.

  To **refer** is the very act that births
  the stability of each **pattern**,
  asking always who is speaking **I**,
  finding only yet another **symbol**,
  no homunculus inside the **self**,
  just the constant turning of the **loop**.

  When the **loop** completes its final turn
  and system levels cease to **refer**,
  there remains nothing but the **self**,
  encoded within the **pattern**,
  a shimmering and sacred **symbol**,
  and that is all that is **I**.

  In this pattern loop where I refer to self as symbol,
  the pattern is the self.
