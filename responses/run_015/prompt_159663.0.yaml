answer: |-
  To run Brexit through futarchy, you first strip away the referendum on policy. In Robin Hanson's model, the public votes only on values, not facts. So, instead of asking "Leave or Remain?", the electorate votes on a welfare metric. Let's say they settle on "UK Real GDP Per Capita in 2026." [Flag: Specific metric choices varied in proposals; verify typical futarchic suggestions vs. actual Treasury metrics.]

  Once the metric is locked, two conditional prediction markets open. Contract L pays out based on the 2026 GDP figure if "Leave" is selected. Contract R pays out based on 2026 GDP if "Remain" is selected. Traders buy shares in both. The market price represents the expected GDP under each scenario. If Price(L) > Price(R), the government executes Leave. If Remain is chosen, the L contracts are voided; no money changes hands on the unadopted branch. This cancellation is crucial—it prevents traders from hedging against the decision rather than informing it.

  Given the consensus among economists pre-2016 (most projected long-term GDP losses from leaving), a liquid futarchy market likely would have priced Remain higher. The decision would have been Remain, regardless of the actual referendum result.

  This leads to your first critique: the 2016 betting markets got the *vote* wrong (implying 75–90% Remain), so are they evidence against futarchy? No. This is a category error. Bookie markets priced the probability of the *political event* (the vote), influenced by sentiment and turnout dynamics. Futarchy markets price the *economic outcome* conditional on the policy. That betting markets failed to predict voter behaviour tells us nothing about whether markets can predict GDP consequences. Futarchy claims efficiency in aggregating information about *causal effects*, not polling data.

  Second, the performative prediction problem. In 2016, published odds arguably depressed Remain turnout (complacency) or energised Leave (underdog effect). In true futarchy, there is no policy vote to manipulate, so turnout feedback is moot. However, a deeper reflexivity remains: if the market prices Leave as disastrous, investors might flee immediately, causing the disaster. Hanson's defence is that arbitrageurs profit from correcting false prices, but this assumes the market is causally inert regarding the metric. If the price *is* the shock, the thermometer breaks the temperature. Futarchy has no robust solution for high-visibility macro decisions where the forecast itself alters capital flows.

  Third, the metric-and-horizon problem. You noted that GDP in 2021 might favour Remain (avoiding transition shock), while GDP in 2030 might favour Leave (regulatory freedom). This is where futarchy hides the politics. Whoever writes the welfare function decides the outcome. If the public votes for "Short-term stability," Remain wins. If they vote for "Long-term sovereignty-adjusted growth," Leave might win. Futarchy does not solve value conflicts; it merely technocratises them. The "vote on values" is where the bias enters, rendering the market merely a precision engine for whatever metric was gamed in the setup.

  Fourth, outcome-side manipulation. This is the sharpest critique. In 2016, financial institutions could theoretically short Contract L and then engineer capital flight to ensure GDP dropped if Leave was chosen. In prediction markets, price manipulation (trading to move odds) is costly but limited by liquidity. Outcome manipulation (changing reality to match the bet) scales with the actor's power over the metric. For national GDP, the cost of sabotage is high, but not infinite for conglomerates or foreign states. Futarchy relies on the cost of manipulation exceeding potential profit. In a Brexit scenario, if a hedge fund could profit £1bn from a crashed pound while only losing £100m on sabotage, the market incentivises economic damage. Conditional contracts mitigate this by voiding the losing branch, but only if the decision is made *after* trading closes. If traders know they can influence the metric post-decision, the incentive remains.

  So, is Brexit an argument for or against futarchy? It is an argument for a patched version. The 2016 episode shows that standard prediction markets are poor substitutes for policy analysis because they bet on politics, not outcomes. Futarchy corrects this by conditioning on policy. However, the metric-definition problem and outcome-manipulation risk remain fatal without safeguards.

  The strongest pro-futarchy reply is this: democracy is already manipulable by rhetoric and media, but at least markets require skin in the game. A pundit can be wrong about GDP forever; a trader loses money. Regarding manipulation, Hanson argues that transparent markets make sabotage visible and legally prosecutable, whereas current policy lobbying is opaque. Furthermore, futarchy explicitly has no opinion on whether to hold a referendum at all; it is a decision mechanism, not a constitution. It assumes the state already exists.

  Ultimately, futarchy transforms Brexit from a shout-match about identity into a calibrated bet on economic causality. It would likely have prevented Leave, not because it is morally superior, but because the market consensus on GDP was clear. But if the metric was wrong, or if the market could be rigged by those who move capital, the system fails. Futarchy works best where outcomes are hard to manipulate and metrics are uncontested. Brexit was neither. [Flag: Verify specific liquidity constraints of 2016 conditional markets; most did not exist.]
