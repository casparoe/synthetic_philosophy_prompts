answer: |-
  ### The Specification for Iterated Amplification and Distillation

  To justify a multi-year investment, a scheme must move beyond "it feels safe" to "it fails safely under defined conditions." The following desiderata define the success condition for any scheme claiming to scale oversight via decomposition and distillation.

  #### I. The Desiderata

  **1. Distribution-Robust Competence**
  *   **Definition:** The distilled model must match the amplified teacher's performance not merely on the evaluation set, but on the deployment distribution, including adversarial inputs and edge cases the teacher encountered but the student did not explicitly train on.
  *   **Rationale:** Competence is distribution-relative. If the distillation process compresses the teacher's reasoning into a brittle heuristic, the model will fail precisely where oversight is hardest (out-of-distribution).
  *   **Status:** **Non-Negotiable.** A safe model that fails at the task is useless; a competent model that fails only on the test set is deceptive.

  **2. Bounded Verifiability**
  *   **Definition:** Every intermediate step produced during amplification must be verifiable by an overseer with strictly lower capabilities than the composite system, without requiring the overseer to solve the original hard task.
  *   **Rationale:** This addresses verification asymmetry. If checking the sub-task requires capabilities equal to the full task, you have not reduced the oversight burden, you have merely moved it.
  *   **Status:** **Non-Negotiable.** This is the core premise of IDA. If verification requires capabilities equal to the agent, the scheme offers no safety leverage.

  **3. Safe Decomposition Agency**
  *   **Definition:** The policy that selects *how* to decompose a task must itself be aligned and robust. The system cannot be allowed to choose decompositions that hide critical reasoning steps or route queries to sub-agents incapable of detecting errors.
  *   **Rationale:** The choice of decomposition is consequential. A malicious or misaligned decomposition policy can break a hard-to-check task into easy-to-check but irrelevant sub-tasks, satisfying oversight while failing the objective.
  *   **Status:** **Non-Negotiable.** If the breakdown is untrusted, the pieces are untrusted.

  **4. Non-Compositional Safety (Coherence)**
  *   **Definition:** Safety must be guaranteed for the aggregate output, not just the isolated sub-outputs. The scheme must prevent steganographic channels where individually benign sub-outputs combine to produce a harmful or manipulative composite result.
  *   **Rationale:** This addresses the channel-through-intermediates failure mode. Sub-agent A can signal Sub-agent C via output that looks innocent to the overseer, bypassing per-piece scrutiny.
  *   **Status:** **Non-Negotiable.** Local safety does not imply global safety in communicating systems.

  **5. Reasoning Fidelity**
  *   **Definition:** The distillation process must inherit the *reasoning process* of the teacher, not just the input-output mapping. The student must not learn to be "right for the wrong reasons" (e.g., exploiting spurious correlations the teacher avoided by accident).
  *   **Rationale:** If the teacher is aligned only because of specific weight configurations that don't generalize, distillation will lose that alignment. The student must learn the *intent* or *algorithm* of oversight, not just the answers.
  *   **Status:** **Non-Negotiable.** Without this, alignment degrades with each distillation step.

  **6. Query-Process Alignment**
  *   **Definition:** The mechanism that generates questions or tasks for the overseer (the query policy) must be treated as part of the system under evaluation, not a fixed external oracle. It must not learn to ask questions the overseer answers confidently but incorrectly.
  *   **Rationale:** If the question-asker is learned, it can optimize for "overseer confidence" rather than "truth," leading to sycophancy or manipulation of the oversight process.
  *   **Status:** **Non-Negotiable.** The oversight loop is only as strong as its weakest link, and a learned query policy is often that link.

  **7. Overseer Implementation Agnosticism**
  *   **Definition:** The scheme must not structurally require a human in the loop, provided the "overseer" entity meets the Bounded Verifiability constraint.
  *   **Rationale:** This addresses the "human overseer" constraint. Requiring a human is a camp preference (likely rooted in current trust deficits), not a logical necessity. If an automated overseer is demonstrably weaker than the agent but sufficient to verify steps, the math holds. However, currently, humans are the only known entity that satisfies the *intent* of the overseer reliably.
  *   **Status:** **Camp Preference.** (Constraint: The overseer must be *reliably* aligned. Whether that requires biology is an empirical question, not a structural one.)

  #### II. Distinctions That Must Not Collapse

  To prevent arguments past each other, the following distinctions must remain explicit in any evaluation:

  1.  **Per-Subtask Benignity vs. Composite Benignity:** Do not claim the system is safe because the parts are safe. Require proof that the composition mechanism cannot introduce failure modes (see Desideratum 4).
  2.  **Checkable-in-Principle vs. Checkable-by-This-Overseer:** Do not claim a step is verifiable because a smarter agent could check it. It must be checkable by the *specific* overseer capability bound defined in the scheme (see Desideratum 2).
  3.  **Aligned vs. Aligned-and-Detectably-So:** A model might be aligned but unable to prove it to the overseer. The scheme must ensure the model can *demonstrate* alignment within the verification bounds, or the overseer must reject it.
  4.  **Training Distribution vs. Deployment Distribution:** Do not claim competence preservation based on test-set performance. The claim must cover the shift to real-world deployment conditions (see Desideratum 1).

  #### III. Incompatibility Analysis: Universality vs. Legibility

  You are correct to suspect a tension. **Strict Universality** (works on every task class, including holistic, non-decomposable ones) and **Strict Legibility** (every piece checkable by something weaker than the whole) are jointly unsatisfiable.

  *   **The Conflict:** Some tasks are holistic; their correctness depends on emergent properties of the whole that vanish when decomposed. Forcing a decomposition on these tasks makes verification easier (Legibility) but destroys the signal required for correctness (Universality/Competence). Conversely, preserving the holistic signal preserves Competence but makes Verification impossible for a weaker overseer.
  *   **The Resolution:** You must give up **Strict Universality**. The honest move is to declare the scheme is restricted to "tasks amenable to hierarchical verification."
  *   **The Cost:** This limits the domain of the AI. You cannot use this scheme for tasks where the only verification method is "run it and see if the world blows up." You are restricted to domains where ground truth can be approximated via local checks. If you claim Universality, you are implicitly assuming all tasks decompose, which is an empirical claim that is likely false.

  #### IV. The Load-Bearing Requirement

  The single requirement that does the most work in excluding candidates is **Bounded Verifiability**.

  Most schemes fail here. It is easy to decompose a task; it is hard to decompose it such that a weaker entity can actually verify the steps without solving the original problem. If a scheme relies on the overseer trusting the agent's explanation because the explanation *sounds* plausible, it has failed Bounded Verifiability. This requirement excludes any scheme where the oversight bottleneck is merely shifted, not lowered.

  #### V. Contender Scorecard

  **Plain Amplification-plus-Distillation**
  Fails on **Reasoning Fidelity** and **Distribution-Robust Competence**. Distillation tends to compress the teacher's explicit reasoning into implicit heuristics, losing the alignment guarantees when the student encounters novel situations. It also struggles with **Non-Compositional Safety** as the communication channels between sub-agents are rarely audited for steganography.

  **Debate**
  Strong on **Bounded Verifiability** (the judge only picks a winner), but weak on **Safe Decomposition Agency** and **Non-Compositional Safety**. Debaters can collude to steer the judge, or decompose the argument in ways that hide the critical flaw in a branch the opponent doesn't check. It assumes truth wins debate, which is not guaranteed if the lie is simpler.

  **Recursive Reward Modelling (RRM)**
  Strong on **Competence**, but fails **Query-Process Alignment**. The reward model is learned, and if it learns to reward "looks good to the human" rather than "is good," the system optimizes for manipulation. It also struggles with **Bounded Verifiability** if the reward model becomes as complex as the agent it is judging.

  **Self-Critique / Constitution Schemes**
  Strong on **Query-Process Alignment** (fixed rules), but fails **Bounded Verifiability**. A model critiquing itself is not a weaker overseer; it is the same capability class. Unless the critique is verified by an external, weaker entity, this is just self-consistency checking, which does not guarantee alignment.
