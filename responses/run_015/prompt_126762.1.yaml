answer: |-
  There is no single, lexicalized technical term in analytic philosophy (comparable to *ad hominem* or *reductio ad absurdum*) that exclusively names this specific bidirectional structure of karmic accounting. However, the structure you have identified is a well-recognized instance of a broader class of logical maneuvers discussed in the philosophy of science, epistemology, and the philosophy of religion.

  The most precise established concept for this structure is an **Immunizing Stratagem** (or **Conventionalist Stratagem**), specifically employing **Temporal Elasticity** within a **Protective Belt**.

  Here is a breakdown of how philosophers and logicians demarcate this structure, the terminology available to describe it, and how to distinguish it from legitimate auxiliary hypotheses.

  ### 1. The Primary Technical Label: Immunizing Stratagem
  In the philosophy of science (particularly in the work of **Karl Popper** and **Hans Albert**), an *immunizing stratagem* is a method used to protect a core theory from falsification by adjusting auxiliary assumptions whenever counter-evidence arises.

  Your observation identifies a specific *type* of immunizing stratagem. In a standard scientific theory, an auxiliary hypothesis is usually added to explain an anomaly (e.g., "The planet is there, but a cloud is hiding it"). In the karmic structure you describe, the auxiliary hypothesis does not merely add a variable; it **inverts the causal arrow** to suit the observation.
  *   **Suffering:** Causal arrow points Past $\rightarrow$ Present (Retrospective).
  *   **Prosperity:** Causal arrow points Past $\rightarrow Present (Retrospective).
  *   **Recovery from Suffering:** Causal arrow points Present $\rightarrow$ Future (Prospective) or Hidden Past $\rightarrow$ Present.

  Because the direction of causality is flexible, the theory absorbs all possible data states without risk. Popper would classify this as a **Conventionalist Stratagem**: the rules of the system are adjusted by convention to ensure the core axiom (Cosmic Justice) remains true by definition rather than by empirical test.

  ### 2. The Sociological/Religious Label: Karmic Theodicy
  In the sociology of religion, **Max Weber** analyzed this exact structure in *The Economy and Society* and *The Social Psychology of the World Religions*. He identified karma as a **Theodicy of Good Fortune and Suffering**.

  Weber noted that for a theodicy to function socially, it must explain why the wicked prosper and the righteous suffer. He observed that karma achieves this through **infinite temporal deferral**. While Weber did not coin a specific logical term for the *bidirectional bookkeeping*, he identified the mechanism as the **systematic rationalization of irrationality**.
  *   Contemporary philosophers of religion (e.g., **John Hick**) refer to this as **Eschatological Verification**. The claim is verifiable only at the end of the process (liberation/moksha), which is by definition inaccessible to current observation.
  *   Critiques of this (e.g., by **Whitley Kaufman** in *"Karma, Reincarnation, and the Problem of Evil"*) often label the specific accounting maneuver you described as **"Unfalsifiable Moral Accounting."**

  ### 3. Colloquial and Critical Terminology
  In critical discourse and skeptical philosophy, you will occasionally encounter the phrase **"Karma of the Gaps."** This is a derivative of the "God of the Gaps" fallacy. It specifically targets the move where karmic causality is invoked only when naturalistic or secular moral explanations fail to account for a distribution of welfare.

  However, this does not capture the *bidirectional* nuance you noted. A more descriptive label used in informal logic is a **Self-Sealing Argument** or a **Closed System**. In a closed system, the output (welfare/harm) is defined as proof of the input (merit/demerit), but the input is never independently observable.

  ### 4. Demarcating from Legitimate Auxiliary Hypotheses
  You asked how to distinguish this from an ordinary auxiliary hypothesis in a desert-based framework. In the philosophy of science (specifically **Imre Lakatos's** methodology of scientific research programmes), a theory consists of a "hard core" (protected from change) and a "protective belt" (auxiliary hypotheses that can be adjusted).

  To determine if the karmic accounting is a legitimate auxiliary hypothesis or a fallacious immunizing stratagem, one applies the following boundary conditions:

  **A. Predictive Risk vs. Explanatory Safety**
  *   **Legitimate Auxiliary:** Makes a risky prediction. (e.g., "If this person committed a specific wrong in a past life, they should exhibit X psychological trait now.") If X is not found, the hypothesis is weakened.
  *   **Immunizing Stratagem:** Offers explanatory safety. It explains the observation *after* it occurs without risking a future prediction. The bidirectional nature ensures that *any* subsequent state (good or bad) confirms the theory rather than testing it.

  **B. Independent Access to Variables**
  *   **Legitimate Auxiliary:** The variables (past merit/demerit) must be measurable independently of the outcome they are supposed to explain.
  *   **Immunizing Stratagem:** The "moral balance" is inferred *solely* from the welfare state it is meant to explain. This creates **Circular Causality**: "I know they sinned because they suffer; I know they suffer because they sinned."

  **C. Temporal Consistency**
  *   **Legitimate Auxiliary:** Maintains a consistent direction of causality (Past $\rightarrow$ Present).
  *   **Immunizing Stratagem:** Exhibits **Temporal Elasticity**. As you noted, the theory switches between retrospective (paying debt) and prospective (accumulating credit) explanations depending on which preserves the "perfect desert" narrative. This inconsistency is the hallmark of the fallacy.

  ### 5. Proposed Terminology for Your Use
  Since no single word exists, if you wish to name this structure in your own writing, the most philosophically rigorous description would be:

  > **"Bidirectional Immunization via Temporal Elasticity"**

  Or, more concisely:

  > **"Asymmetric Moral Bookkeeping"**

  This captures the core of your insight: the "accounts" are balanced, but the rules of booking (debit vs. credit, past vs. future) are applied asymmetrically to ensure the balance sheet never shows a deficit in cosmic justice.

  ### Summary
  While there is no specific Greek/Latin name for this exact pattern, it is formally recognized as an **Immunizing Stratagem** employing **Ad Hoc Rescue** within a **Theodicy**. Its distinguishing feature, as you rightly identified, is not merely unfalsifiability, but the **retroactive adjustment of causal direction** to prevent the theory from ever encountering a falsifying condition. In critical literature, this is often treated as a specific failure of **Explanatory Power**, where a theory that explains everything predicts nothing.

  **Key References for Further Reading:**
  *   **Karl Popper,** *The Logic of Scientific Discovery* (on Conventionalist Stratagems).
  *   **Max Weber,** *The Social Psychology of the World Religions* (on Theodicy).
  *   **Whitley Kaufman,** "Karma, Reincarnation, and the Problem of Evil" (*Philosophy East and West*, 2005).
  *   **Imre Lakatos,** *Falsification and the Methodology of Scientific Research Programmes* (on Protective Belts).
