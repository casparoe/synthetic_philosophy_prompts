answer: |-
  ### Specifications for a Lexical-Threshold Hedonic Theory

  To plug a lexical-threshold negative utilitarian (LT-NU) view into a regulatory decision procedure, the underlying theory of hedonic commensurability must satisfy the following requirements. I have refined your initial seven points, split ambiguous categories, and added one critical omission regarding interpersonal comparison.

  **1. Phenomenological Topology (Axis Structure)**
  *   **Requirement:** The theory must specify whether pleasure and pain are opposite poles of a single cardinal scale (bipolar) or distinct phenomenological kinds (unipolar/separate axes). If separate, it must define the conversion rate or "bridge" that allows a lexical claim about pain to silence a claim about pleasure.
  *   **Case:** If they are separate axes, a lexical threshold on the pain axis cannot logically outweigh a quantity on the pleasure axis without a meta-rule linking the axes. If bipolar, the threshold is simply a point on the line; if unipolar, it is a constraint on one dimension that vetoes the other.
  *   **Status:** **Non-Negotiable.** (Without this, the "outweighing" relation is undefined).

  **2. Threshold Determinacy (Fixation)**
  *   **Requirement:** The theory must identify the specific property that constitutes the threshold (e.g., raw intensity, rate of change, loss of agency) and explain why the cut falls at *that* phenomenological point rather than an infinitesimally adjacent one, given that experience appears continuous.
  *   **Case:** Lexicality relies on a discontinuity. If the underlying phenomenology is continuous, the theory must justify a "sharp line" without arbitrariness, or admit the threshold is vague (which undermines decision procedures).
  *   **Status:** **Non-Negotiable.** (Without a fixed $T$, the lexical priority rule has no trigger).

  **3. Non-Aggregativity of the Threshold**
  *   **Requirement:** The theory must specify whether the threshold applies to individual moments, individual lives, or aggregates across populations. It must explicitly state whether $N$ instances of sub-threshold suffering can ever sum to outweigh one instance of super-threshold suffering.
  *   **Case:** LT-NU typically claims severe pain is *lexically* worse. If mild pains can aggregate to outweigh severe pain, the view collapses into weighted utilitarianism. For a regulator, this determines whether a mass mild-headache policy can override a single torture case.
  *   **Status:** **Non-Negotiable.** (This defines the "lexical" nature of the view).

  **4. Probabilistic Tractability**
  *   **Requirement:** The theory must provide a ranking method for options where the occurrence of super-threshold suffering is probabilistic (e.g., $0.001\%$ chance of extreme pain vs. $100\%$ chance of mild pleasure).
  *   **Case:** Regulatory environments involve risk. If any non-zero probability of lexical badness renders an option forbidden, and all options carry non-zero risk (e.g., side effects), the procedure yields paralysis (all options tied as forbidden). The theory must explain how to rank risks of lexical harms.
  *   **Status:** **Non-Negotiable.** (Without this, the theory cannot function in a real-world decision procedure).

  **5. Interpersonal Comparability**
  *   **Requirement:** The theory must assert that the threshold is invariant across subjects. It must deliver a metric that allows a regulator to determine if Subject A's pain crosses the same threshold as Subject B's pain.
  *   **Case:** Your Item 7 touches on this, but for a *regulator*, the issue is measurement, not just normative status. If the threshold is subjective or idiosyncratic, public policy cannot apply it uniformly.
  *   **Status:** **Non-Negotiable.** (Added requirement; essential for public health/animal welfare contexts).

  **6. Metric Stability (Scale Invariance)**
  *   **Requirement:** The theory must specify which mathematical transformations of the hedonic scale preserve the ordering (e.g., ordinal, cardinal, ratio). It must state whether the threshold value floats when the scale is recalibrated (e.g., 0–10 vs. 0–100).
  *   **Case:** If the threshold is a fixed number (e.g., "7/10"), the scale is fixed. If the scale is arbitrary, the threshold must be defined intrinsically. Inconsistency here renders the threshold measurement-dependent rather than reality-dependent.
  *   **Status:** **Preference/Camp.** (Measurement theorists disagree on whether hedonic scales are ratio or interval; LT-NU can theoretically adapt to either, provided Determinacy is maintained).

  **7. Temporal Currency**
  *   **Requirement:** The theory must decide whether the threshold is crossed by momentary experience, integrated duration, or retrospective assessment.
  *   **Case:** A short, extreme spike might cross the threshold on a momentary view but be negligible on a life-integral view. This affects whether brief medical procedures are vetoed by LT-NU.
  *   **Status:** **Preference/Camp.** (Affects the *extension* of the view, not its logical coherence).

  **8. Normative Valence (Badness vs. Disvalue)**
  *   **Requirement:** The theory must distinguish between the intrinsic disvalue of pain and its instrumental or consensual context (e.g., surgery, exercise).
  *   **Case:** As you noted, not all pain is a "bad state of affairs" in the normative sense. LT-NU needs to know if the threshold applies to *phenomenological intensity* regardless of context, or only to *undesired* intensity.
  *   **Status:** **Preference/Camp.** (Some NU views count all pain; others count only "bad" pain. This is a normative choice, not a commensurability constraint).

  ***

  ### Critical Analysis

  **The Impossible Pair: Probabilistic Tractability vs. Threshold Determinacy**
  These two requirements cannot be jointly satisfied in a continuous world without abandoning standard decision theory.
  *   **The Conflict:** *Threshold Determinacy* requires a sharp discontinuity in value (a jump from finite to infinite/lexical weight). *Probabilistic Tractability* in a regulatory context usually relies on Expected Utility (or a continuous proxy) to rank options with risk.
  *   **The Result:** If the threshold is sharp and lexical, any option with probability $P > 0$ of crossing it acquires infinite (or undefined) negative expected value. If *all* available interventions carry non-zero risk of severe suffering (e.g., allergic reactions, surgical errors), *all* options become unrankable (tied for worst). To make them rankable, you must discount the probability, which effectively smooths the threshold, violating Determinacy. You cannot have a sharp lexical line *and* a working risk calculus.

  **The Most Exclusionary Requirement: Probabilistic Tractability**
  This requirement excludes the most candidate theories. Most philosophical formulations of lexical views ignore risk or assume a "safe" world where outcomes are certain. Once you demand the theory handle $P < 1$, standard lexical models collapse into either paralysis (nothing is permissible) or collapse into standard utilitarianism (by discounting the lexical weight to make calculation possible). It forces the theory to solve the "St. Petersburg Paradox" of suffering.

  **What Is Left Standing?**
  Strictly speaking, **nothing** satisfies the full set for a regulatory context.
  *   If you keep **Determinacy** and **Non-Aggregativity**, you must sacrifice **Tractability** (the regulator cannot choose).
  *   If you keep **Tractability**, you must sacrifice **Determinacy** (the threshold becomes a "soft" lexicality, e.g., a steep but continuous curve), which abandons the core LT-NU claim.
  *   The only surviving contenders are **"Lexicality with a Risk-Threshold"** (e.g., lexical priority only applies if $P > 0.05$), but this introduces a second arbitrary threshold, compounding the Determinacy problem.

  ***

  ### Scorecard for Main Contenders

  | Theory | Probabilistic Tractability | Threshold Determinacy | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Classic LT-NU** | **Fail** (Paralysis under risk) | **Pass** | Theoretically pure, practically useless. |
  | **Weighted NU** | **Pass** (Continuous trade-offs) | **Fail** (No sharp line) | Functional, but abandons lexicality. |
  | **Soft-Lexical** | **Pass** (Steep discounting) | **Fail** (Vague boundary) | Best compromise, but philosophically impure. |
