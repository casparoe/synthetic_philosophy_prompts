answer: |-
  **Joint Preparatory Statement for the Workshop on Artificial Belief Ascription**

  **To the Participants:**

  This document serves as the foundational text for our deliberations. It delineates the common ground between the stance-first (attributionist) and architecture-first (structuralist) positions, maps the precise locus of their disagreement, and specifies the critical tests upon which the debate turns. Technical terms are defined at first use. The *intentional stance* is the strategy of predicting behaviour by treating the system as a rational agent acting on beliefs and desires. *Counterfactual robustness* refers to a state's stability across possible variations in input or environment. *Downstream processing* denotes the causal pathway by which an internal state influences action or output.

  **1. Agreed Claims**

  Both parties endorse the following propositions without reservation:

  1.  **The Thermostat Constraint:** A standard thermostat does not possess beliefs. Both parties agree that despite tracking temperature, its behavioural repertoire is too limited to support a genuine intentional stance, and its internal structure lacks the requisite complexity.
  2.  **The Lookup Table Constraint:** A system functioning as a pure lookup table of human responses does not possess beliefs. Both agree that a static mapping of inputs to outputs, lacking internal state integration, fails to qualify, regardless of predictive accuracy.
  3.  **Predictive Failure:** Successful prediction is necessary for belief ascription. If a system consistently fails to act in accordance with an ascribed belief, the ascription is defeated for both parties.
  4.  **Structural Defeaters:** Known structural randomness defeats ascription. Even if a system predicts well by luck, both parties agree that if the internal mechanism is known to be random rather than reason-responsive, belief cannot be ascribed.
  5.  **Counterfactual Commitment:** Belief ascriptions entail counterfactual commitments. To say a system believes *p* is to claim it would act differently had *p* been false, a requirement both parties accept, though they differ on how this robustness is secured.
  6.  **Corpus Distinction:** A compressed index of a human corpus is not a believer. Both parties distinguish the system from the data it processes; possessing information is not equivalent to holding a belief.
  7.  **Rational Coherence:** Belief ascription involves norms of coherence. Both agree that ascribing contradictory beliefs is generally defective unless explained by specific compartmentalisation or error.
  8.  **Human Paradigm:** Human beings possess beliefs. Both parties accept human mentality as the reference case against which artificial systems are measured.
  9.  **Integration Requirement:** Some degree of integration between input, internal state, and output is required. Both parties deny belief to systems where the state causing the report is causally isolated from the state causing the action.
  10. **Explanatory Role of History:** Training history is explanatorily relevant. Both agree that knowing how a system acquired its states aids explanation, though they disagree on whether this history is constitutive of belief.

  **2. Disagreements Table**

  | Issue | Attributionist Formulation | Structuralist Formulation | Verbal? | Crux | Accepted Case | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Sufficiency of Prediction** | If the intentional stance is the best predictive strategy, the system literally has beliefs; there is no further fact. | Predictive success is evidence, not constitutive; the internal architecture must realise the state correctly. | No | Metaphysics of intentionality | A system predicting perfectly via opaque weights. | Attributionist: It believes. Structuralist: It simulates belief. |
  | **Causal History** | History matters only insofar as it sustains the current pattern; origin is not constitutive. | History is constitutive; a state is a belief only if fixed by the right sort of learning history. | No | Origin vs. Pattern | A system instantiated with weights rather than trained. | Attributionist: Belief holds. Structuralist: Belief fails. |
  | **Granularity of State** | Content is determined by the interpretation that best rationalises the system's behaviour as a whole. | Content is determined by the specific causal role the state plays in the system's actual economy. | Partially | Determination of Content | Two mappings yielding identical predictions. | Attributionist: Charity decides. Structuralist: Mechanism decides. |

  *Note on Verbal Disagreement:* While the parties use the word 'belief' differently, the disagreement is not merely lexical. It concerns whether intentionality is a matter of external interpretation or internal realisation. Substance has been retained in the 'Crux' column.

  **3. The Cruxes**

  **The Coding-Symmetry Crux**
  Consider a trained system where two rival mappings from internal states to contents support exactly the same predictions across all situations, yet disagree on what the system believes.
  *Attributionist:* This is not genuine indeterminacy. The resources of the intentional stance—specifically the principle of charity and the requirement for the unity of the agent—disambiguate the mapping. The interpretation that renders the system more rational or coherent is the correct one, even if predictive power is identical.
  *Structuralist:* If the distinction makes no predictive difference anywhere, it is idle. However, we maintain that one mapping likely aligns with the causal structure and the other does not. The correct mapping is the one that tracks the actual downstream processing pathways, not the one that merely satisfies an observer's desire for coherence.
  *Commitment:* The Attributionist predicts the rationalising mapping is true. The Structuralist predicts the causally aligned mapping is true, even if less rational.

  **The Restricted-Niche Crux**
  Suppose a system behaves as ascribed across a circumscribed range of situations but fails outside it in a way predictable from its training statistics but not from the content ascribed.
  *Attributionist:* The correct response is to qualify the ascription: the system believes *p*, relative to that domain. Range-indexed belief is still belief, provided the stance remains the best strategy within that niche. We are not smuggling in structural requirements; we are acknowledging that patterns are real but context-dependent.
  *Structuralist:* The correct response is to withdraw the ascription. If the state does not support counterfactuals outside the training distribution, it is not a belief but a heuristic shortcut. Qualifying belief by range admits that the system is merely describing the training distribution in intentional vocabulary, not possessing a state robust enough to be a belief.
  *Commitment:* The Attributionist expects practice to accept qualified beliefs. The Structuralist expects practice to reject them as mere simulations.

  **The Report–State Dissociability Crux**
  Consider an intervention that leaves task behaviour intact while changing what the system says about its own states, or the reverse.
  *Attributionist:* Verbal self-report is one behavioural channel among many. If the overall intentional stance remains predictive despite the dissociation, belief ascription stands. The report has no privileged evidential role, even if trained on human avowals.
  *Structuralist:* Such an intervention proves the absence of belief. A belief state must be available to the reporting mechanism if it is to be a genuine belief. If the report dissociates from the task state, the system lacks the integration required for mentality. The report's training on human avowals makes it a mimicry of belief, not evidence of it.
  *Commitment:* The Attributionist predicts belief survives dissociation if prediction holds. The Structuralist predicts belief fails upon dissociation.

  **The Adversarial Crux**
  Consider a system trained against human opponents, requiring it to model its interlocutor to succeed.
  *Attributionist:* Second-order ascriptions (the system believes that you believe *p*) stand on the same footing as first-order ones. Competitive success counts as strong evidence, as modelling the opponent is the best predictive strategy.
  *Structuralist:* Second-order ascriptions are weaker. Competitive success may be achieved via heuristic modelling rather than genuine state attribution. We require evidence that the second-order state is integrated into the system's own reasoning, not just its opponent-modelling module.
  *Commitment:* The Attributionist treats second-order success as equivalent evidence. The Structuralist treats it as defeasible until structural integration is shown.

  **4. Closing Section**

  **Falsification Conditions**
  For the Attributionist position to be abandoned, it must be shown that there are cases where the intentional stance is the best predictive strategy, yet almost every competent observer refuses to ascribe belief due to known structural facts. For the Structuralist position to be abandoned, it must be shown that there are systems with the requisite internal architecture that fail to support any predictive intentional stance, rendering the structural criteria empty.

  **Settlement Conditions**
  Both parties agree that a discovery showing a specific architectural feature is necessary for the intentional stance to succeed at all would settle the matter. If it were demonstrated that counterfactual robustness cannot be achieved without specific structural integration, the positions would converge.

  **Achievement Goals**
  If neither party converts, collaboration shall be judged successful if we produce a unified taxonomy of artificial systems that specifies exactly where the two criteria diverge. We aim to replace talking past one another with a precise map of the extension gap, allowing future empirical work to target the specific cruxes identified above rather than rearguing definitions.
