answer: |-
  This is a classic debate in formal epistemology, and honestly, a two-hour argument is par for the course. You and Marco are both tapping into genuine philosophical tensions that have kept people busy for the last 50 years.

  Marco is right about one thing (the pragmatic nature of the argument) but wrong about the conclusion (that it's trivial or doesn't imply irrationality). You are right about the other thing (the Regularity assumption is a major technical hurdle), but you need to be careful about how much weight you put on it.

  Here is a breakdown of what the Dutch Book Argument (DBA) for conditionalization actually shows, why the "Refusal Objection" (Marco's point) matters, why the Regularity assumption is crucial, and the "secret weapon" (Accuracy Arguments) you can use to settle the epistemic vs. pragmatic debate at dinner.

  ---

  ### 1. What the Dutch Book Argument for Conditionalization Shows

  To understand the argument, we have to look at the setup. The DBA for conditionalization is **diachronic** (across time), unlike the DBA for probabilism which is **synchronic** (at one time).

  *   **Time 1:** You have prior credences $P_0$.
  *   **Time 2:** You learn evidence $E$ with certainty.
  *   **Time 3:** You have posterior credences $P_1$.

  **The Argument:** If $P_1(H) \neq P_0(H|E)$ (i.e., you didn't update by conditionalizing), a clever bookie can construct a series of bets at Time 1 and Time 2 that guarantee you a net loss, regardless of whether $H$ or $E$ is true.

  **What this shows:** It shows **Diachronic Incoherence**. It demonstrates that if your betting dispositions at Time 1 and Time 2 do not align according to the rule of conditionalization, your set of dispositions is inconsistent. You are effectively valuing the same proposition differently at different times without a rational basis for the change.

  ### 2. Marco's Objection: "Just Refuse the Bets"

  Marco is making what is known as the **"Pragmatic Detachment"** or **"Refusal"** objection. His argument is: *"Why must I bet? If I see the bookie coming, I just don't play. Therefore, I don't lose money. Therefore, I'm not irrational."*

  **Why Marco is partially right:**
  Strictly speaking, the DBA is a **pragmatic** argument. It talks about money and losses. If you define "rationality" purely as "maximizing truth" and not "managing utility," the DBA doesn't directly touch epistemic rationality.

  **Why Marco is missing the point:**
  The DBA relies on a bridge principle: **Credences are betting dispositions.** (This comes from Ramsey and De Finetti).
  *   If you say your credence in $H$ is 0.8, that *means* you are willing to buy a bet on $H$ for \$0.80 that pays \$1.00.
  *   If you refuse the bet, you are admitting that your stated credence does not match your actual behavioral disposition.
  *   If you *do* have those dispositions (which is what having a credence *is*), then you *will* take the bets, and you *will* lose money.

  So, the argument isn't "You will lose money if you are stupid." It is "If your credences function as guides to action (which they must), then failing to conditionalize makes your guidance system internally inconsistent."

  **The Counter to Marco:** You can't have it both ways. You can't claim to have a credence of 0.8 but refuse to act like it. If you refuse to act on your credences, you don't really have credences; you have "opinions" that do nothing. If they do something, the Dutch Book applies.

  ### 3. The Regularity Assumption (Your Intuition)

  You recalled correctly. This is a massive technical limitation.

  **The Assumption:**
  Standard Conditionalization requires that your prior probability in the evidence $E$ is non-zero ($P_0(E) > 0$). This is often called **Regularity** (or Strict Coherence).
  Recall Bayes' Rule:
  $$P_1(H) = P_0(H|E) = \frac{P_0(H \cap E)}{P_0(E)}$$
  If $P_0(E) = 0$, you are dividing by zero. The math breaks.

  **Why it matters for the Dutch Book:**
  For the bookie to Dutch Book you, they need to sell you a bet on $E$ at Time 1.
  *   If you assign $P_0(E) = 0$, you believe $E$ is impossible.
  *   You will not pay *anything* for a bet on $E$.
  *   The bookie cannot construct the first leg of the Dutch Book strategy.
  *   **Result:** The DBA for conditionalization fails completely for evidence you initially thought was impossible.

  **Real-world examples where this happens:**
  1.  **Continuous Variables:** If you think a dart will land on a dartboard, the probability of it landing on any *specific* geometric point is 0. But it lands on *a* point. You just learned something with prior probability 0. Standard conditionalization cannot handle this.
  2.  **Surprising Theories:** You might assign probability 0 to a scientific theory (e.g., "Newtonian physics is strictly false"). Then you get evidence that proves it. You can't conditionalize on it because your prior was 0.

  **Does this undermine the argument?**
  It limits the **scope**, not the **force**. It shows that Conditionalization is not a *universal* rule for all learning. It only applies to evidence you anticipated as possible.
  *   **The Patch:** Philosophers use **Jeffrey Conditionalization** (for uncertain evidence) or **Kolmogorov Conditioning** (using conditional expectations rather than ratios, which handles zero-probability events in measure theory).
  *   **Takeaway:** You can tell Marco: "You're right that standard conditionalization fails for zero-prior evidence, which is why we have generalized updating rules. But for any evidence we actually assign non-zero probability to, the incoherence remains."

  ### 4. The Epistemic vs. Pragmatic Showdown (Your Secret Weapon)

  This is where you can actually win the argument. Marco is insisting that DBA is only pragmatic (about money) and not epistemic (about truth).

  **Concession:** He is technically right. A Dutch Book shows you will lose money, not that your beliefs are false. You could be Dutch Booked but still have true beliefs.

  **The Pivot:** However, in the last 20 years, epistemologists have developed **Accuracy Arguments** (pioneered by Jim Joyce, Hilary Greaves, and others).

  *   **The Idea:** Instead of measuring beliefs by money (pragmatic), we measure them by **accuracy** (epistemic). A belief is "accurate" if it is close to the truth (1 for true, 0 for false).
  *   **The Theorem:** It has been mathematically proven that if you do not update by conditionalization, there is an alternative updating rule that would have guaranteed you a **more accurate** set of beliefs, regardless of what the world is like.
  *   **The Implication:** This is a "Dutch Book" style argument, but for **truth** instead of money. It shows that non-conditionalization is **epistemically** irrational, not just pragmatically risky.

  **How to use this against Marco:**
  "Marco, you're right that the Dutch Book is about money. But the same mathematical structure applies to **Accuracy**. If you don't conditionalize, you are guaranteed to be less accurate (further from the truth) than if you did. So it's not just about being a bad bettor; it's about being a bad truth-seeker."

  ### Summary Cheat Sheet for Dinner

  Here is how to structure your reply to Marco:

  1.  **On the "Refusal" Objection:**
      *   *Say:* "If I refuse the bets, I'm admitting my credences don't guide my actions. But if credences don't guide actions, what are they? If they do guide actions, the Dutch Book holds. It shows my time-slices are incoherent."
  2.  **On Regularity (Your Point):**
      *   *Say:* "I grant you that if I assign probability 0 to evidence, standard conditionalization breaks. That's a known limitation called the 'Zero Prior Problem.' But that just means we need a more complex updating rule (like Kolmogorov conditioning), not that updating is optional."
  3.  **On Pragmatic vs. Epistemic (The Killer Point):**
      *   *Say:* "You're right that Dutch Books are pragmatic. But **Accuracy Arguments** show the same thing for truth. If I don't conditionalize, I am mathematically guaranteed to be less accurate. So it is epistemically irrational, not just financially risky."

  **Verdict:** Marco is right that the *classic* DBA is pragmatic and relies on Regularity. But he is wrong that this makes the normativity trivial. The normativity survives through the link between credence/action and through Accuracy Arguments. You have the stronger position, provided you concede the technical limitation on zero-priors.
