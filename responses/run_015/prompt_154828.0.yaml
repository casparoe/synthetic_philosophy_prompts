prompt: |-
  I’m a retired biologist who got into philosphy after I stopped running the lab — mostly medical ethics and personal identity stuff. Last Tuesday I was at my neigbor’s study group and two people got stuck in a real knot about advance directives. One, Mara, said that if you write a living will refusing a feeding tube, that document should always win, even if years later you’ve got severe dementia and seem to enjoy eating. She compared it to leaving a locked protocol in a lab: the PI’s instructions don’t become invalid just because the equipment is running differently now.

  The other, Leo, pushed back hard. He said binding a present, feeling person to a dead author’s preference is basically autonomy grave-robbing — you’re honoring a ghost while harming someone who currently resists the tube. Mara came back that Leo smuggles in a false identity claim: he treats the dementia patient as a totally new person, but there’s still biographical continuity — same body, same legal identity, partial emotional patterns. She proposed a biographical continuity threshold, where only if narrative memory is almost entirely gone should the directive shift from command to bequest. Leo then argued that even if continuity exists, the present subject’s affective sovereignty should override, especially since the directive was made in ignorance about what dementia actually feels like. He mentioned a case he’d read about — a woman with advanced Alzheimer’s who smiled constantly but whose directive demanded aggressive intervention — and said forcing the tube was like writing data into an old experiment log that the current apparatus wants to close. Neither would budge. So who’s right about what here? Is Mara correct that autonomy is diachronic and the earlier self retains authority? Or is Leo right that present experiential sovereignty should trump? And what are they both missing — maybe about whether directives are promises to oneself versus instructions to doctors, or about how much narrative continuity actually survives in late dementia?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Retired biologist turned philosopher (medical ethics, personal identity). This means they have a strong grasp of scientific rigor, biological continuity, and philosophical concepts. They don't need basic definitions but appreciate nuanced argumentation, analogies (especially scientific ones), and references to key literature.
      *   **Context:** A neighbor's study group discussion about advance directives (ADs) in dementia.
      *   **The Conflict:**
          *   *Mara (Precedent Autonomy):* ADs should always win. Analogy: Locked lab protocol (PI's instructions stand regardless of equipment changes). Argument: Biographical continuity exists; AD is a binding command.
          *   *Leo (Current Interest/Experiential Sovereignty):* Present self's interests/feelings should win. Analogy: Honoring a ghost while harming the living; writing data into a log the apparatus wants to close. Argument: ADs are made in ignorance of the actual state; present affective experience matters more.
      *   **The Question:** Who is right? What are they missing? (Specifically prompts about promises vs. instructions, and narrative continuity).

  2.  **Deconstruct the Philosophical Positions:**
      *   **Mara's Position:** Aligns with *Precedent Autonomy* (Ronald Dworkin is the key figure here). The "critical interests" of the past self outweigh the "experiential interests" of the present self. The "locked protocol" analogy is strong on consistency but weak on the *nature* of the subject.
      *   **Leo's Position:** Aligns with *Current Interest Theory* or a Psychological Continuity view that emphasizes the *break* in identity (Derek Parfit's reductionism, though Leo seems to argue from well-being rather than strict metaphysics). The "affective sovereignty" argument echoes Rebecca Dresser or Daniel Callahan.
      *   **The Core Tension:** Personal Identity (Metaphysics) vs. Moral Authority (Ethics). Does the person who wrote the AD *exist* anymore? If so, do their rights persist?

  3.  **Evaluate "Who is Right":**
      *   In philosophy, rarely is one side absolutely "right." It's about weighing competing values.
      *   *Mara's strength:* Respects long-term life plans, prevents slippery slopes of paternalism, honors the "whole life" narrative.
      *   *Leo's strength:* Prevents harm to a sentient being who cannot consent *now*, acknowledges epistemic gaps (you don't know what dementia feels like until you have it).
      *   *Verdict:* Both capture essential truths but oversimplify the metaphysics and the function of the document.

  4.  **Identify What They Are Missing (The "Value Add"):**
      *   *The Nature of the Document:* Is it a *command* (Mara) or a *proxy/guidance* (Middle Ground)? Most ethicists view ADs as evidence of values, not absolute legalistic commands that ignore context.
      *   *Personal Identity:* Mara assumes strong numerical identity (same person). Leo implies a psychological break. The truth is likely in *degrees* of continuity (Parfit). If continuity is low, the past self's authority diminishes.
      *   *Epistemic Humility:* Leo touches on this (ignorance of dementia), but it needs expansion. The "Experience Machine" objection.
      *   *The Role of Surrogates:* Neither mentions the proxy decision-maker. ADs are rarely applied in a vacuum.
      *   *The "Promise to Self" vs. "Instruction to Doctor":* This is a crucial distinction prompted by the user. A promise binds the self; an instruction binds the agent. If the self changes, the promise might dissolve, but the instruction might remain valid *if* the agent (doctor) is bound by prior consent.

  5.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge the User:* Validate their background. Use biological analogies where appropriate (since they are a biologist).
      *   *Map the Debate:* Clearly label Mara (Dworkin/Precedent Autonomy) and Leo (Dresser/Current Interests).
      *   *Address the "Who is Right" Question:* Avoid picking a winner. Instead, show where each holds weight.
      *   *Deep Dive into Missing Elements:*
          1.  *Metaphysics of Identity:* Bring in Parfit. Is it all-or-nothing? No, it's a spectrum. If psychological connectedness drops below a threshold, does moral authority drop too?
          2.  *Function of the AD:* It's not just a command. It's a *value statement*. Context matters.
          3.  *Epistemic Gap:* The "Ignorance of Future Self" argument (Ulysses contracts).
          4.  *The "Promise" Distinction:* Address the user's specific prompt.
      *   *Synthesis/Resolution:* Propose a "Ulysses Contract with a Safety Valve" or a "Best Interest + Substituted Judgment" hybrid.
      *   *Tone:* Respectful, intellectual, conversational but rigorous.

  6.  **Refining the Analogies:**
      *   Mara's "Lab Protocol": Good, but implies the equipment (brain) is just a tool. In dementia, the equipment *is* the operator.
      *   Leo's "Experiment Log": Good, but implies the data (life) is worthless if the apparatus changes.
      *   *New Analogy:* Maybe a "Trust Fund" vs. "Living Stipend"? Or a "Constitution" vs. "Executive Order"? Let's stick close to their scientific metaphors but refine them. Maybe "Gene Expression" (same DNA, different phenotype)? No, that might imply the dementia self is just an expression of the old self, which supports Mara. How about "Succession Planning"?

  7.  **Key Philosophical References to Include:**
