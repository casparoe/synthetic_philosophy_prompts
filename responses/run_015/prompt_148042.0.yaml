  ### 1. The Prediction
  **Jordan's Verdict:** **Not You.**

  She will rule that the child resulting from the synthetic egg scenario is *not* you. Even though the nuclear DNA is physically sourced from your parents, the "egg" itself—the cytoplasmic vessel that facilitates fertilization—is not your mother's biological particular. It is a synthetic construct.

  ### 2. The Framework
  **Jordan is running Strict Kripkean Gamete Particularism.**

  She is not a Genetic Essentialist (who would say "same DNA = same person"), because she already rejected the clone case. She is not a Womb/Environment Essentialist, because she accepted the surrogate case.

  She is implicitly arguing that **personal identity is anchored to the specific historical physical gametes** that initiated conception. For a Kripkean, "this person" necessarily originates from "this sperm" and "this egg." In her view, an egg is not defined solely by its nuclear payload; it is defined by its biological history as a cell produced by the mother's ovary. By swapping the cytoplasm for a synthetic iPSC derivative, you have created a *numerically different egg*, even if it carries the same nuclear cargo. Since the origin gamete is different, the person is different.

  This is consistent with her entire track record:
  *   **Different Gametes = Not Me:** (Standard Kripke).
  *   **Clone = Not Me:** (Proves DNA isn't the essence; origin is).
  *   **Synthetic Egg = Not Me:** (Proves the physical cell vessel is part of the "origin," not just the DNA inside it).

  ### 3. The Ammo (The Settling Hypothetical)
  To prove she is a **Historical Materialist** (Kripkean) rather than a **Structuralist** (someone who thinks the *arrangement* of matter is what matters), throw this at her in round two:

  **The "Atom-for-Atom Replica" Gamete Case**

  > "Scientists scan your mother's actual egg and your father's actual sperm down to the quantum level. They then **destroy the original gametes** and use raw chemicals to 3D-print **perfect physical duplicates**—every atom in the same place, same DNA, same molecular wear-and-tear, but none of the original matter. They fertilize the duplicates. Is that kid you?"

  **Why this settles it:**
  *   **If she says "Not Me":** She is a true **Kripkean Origin Essentialist**. She believes the *historical continuity of the specific matter* is necessary. It's not enough to have the same structure/DNA; it must be the *actual* cells that existed in the parents. This locks in her position as rigid origin essentialism.
  *   **If she says "Still Me":** She is actually a **Structuralist/Information Essentialist**. This contradicts her Clone verdict (unless she distinguishes adult vs. gametic nuclei), because it implies that *pattern* matters more than *physical history*. It would expose an inconsistency in her rejection of the clone, giving you the opening to argue that if pattern matters in the Replica case, genetic identity should matter in the Clone case.

  **How to deploy it:**
  Wait for her verdict on the Synthetic Egg. If she says "Not Me" (as predicted), hit her immediately with the Replica case. Tell her: *"If the Synthetic Egg isn't me because the matter is different, then the Replica Gamete definitely isn't me. But if you say the Replica IS me, you're admitting DNA/Structure matters more than physical origin, and you have to explain why the Clone wasn't."* This forces her into a corner where she must either accept total genetic essentialism (abandoning her clone verdict) or double down on radical materialism.
