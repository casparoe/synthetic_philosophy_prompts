answer: |-
  ### The Frankfurt Decision Tree

  **Instructions for the Instructor:**
  Present the standard Frankfurt case to the class first. Ensure they understand the mechanics: Jones decides on his own; Black has a device that *would* force the decision if Jones showed signs of wavering; Black never intervenes.

  Then, guide them through the following questions. Each question is phrased to be neutral; it does not use technical terms like "compatibilism," "determinism," or "PAP" unless defined in the moment.

  ---

  #### **Start: The Responsibility Intuition**
  **Question 1:** In the scenario as described, where Black never actually intervenes, is Jones morally responsible for killing Smith?

  *   **NO** → Go to **Branch A** (The Case Fails)
  *   **YES** → Go to **Branch B** (The Case Works)

  ---

  ### **Branch A: The Case Fails (Jones is NOT Responsible)**
  *Students who reject the initial intuition usually believe the setup undermines responsibility.*

  **Question 2:** Why is Jones not responsible? Is it because of **Black's device** specifically, or because of the **causal laws** required to make the device's prediction possible?

  *   **Because of the causal laws:** You believe the scenario requires the future to be fixed in advance (determinism) to ensure Jones's choice, and that fixed future rules out responsibility.
      *   **→ LEAF 1: The Dilemma Objection (Deterministic Horn).**
      *   *Philosophical Location:* You argue the case begs the question. It assumes determinism is compatible with responsibility to set up the case, so it can't prove they are compatible.
  *   **Because of Black's device:** You believe the mere presence of a controller removes responsibility, regardless of the causal laws.
      *   **→ LEAF 2: General Hard Incompatibilism (Excluded View).**
      *   *Note:* This view holds that control devices (or determinism generally) always negate responsibility. This is not a specific objection to Frankfurt cases but a general theory of free will. *Flag: This leaf is often indistinguishable from Hard Incompatibilism in a short survey, but strictly speaking, the Dilemma Objection targets the **setup**, not just the **conclusion**.*
  *   **Because the device couldn't rule out all alternatives:** You believe Jones actually *could* have done something differently (e.g., hesitated), which would have triggered Black, making the outcome uncertain.
      *   **→ LEAF 3: The Dilemma Objection (Indeterministic Horn).**
      *   *Philosophical Location:* You argue that if the prediction isn't deterministic, Jones retains alternative possibilities. If he retains alternatives, the case fails to refute the Principle of Alternative Possibilities (PAP).

  ---

  ### **Branch B: The Case Works (Jones IS Responsible)**
  *Students who accept the intuition agree that Jones is responsible despite Black's presence.*

  **Question 3:** In this specific scenario, was it possible for Jones to choose or do otherwise? (Be strict: did he have any genuine opportunity to change the outcome?)

  *   **YES:** You believe there was some alternative possibility, however small (e.g., a moment of hesitation, a neural flicker).
      *   **→ LEAF 4: The Flicker-of-Freedom Strategy.**
      *   *Philosophical Location:* You preserve the Principle of Alternative Possibilities (PAP) by arguing that Frankfurt cases never successfully eliminate *all* alternatives. There is always a "flicker" of freedom that grounds responsibility.
  *   **NO:** You believe Jones truly could not have done otherwise in any sense.
      *   **Go to Question 4.**

  *(Self-Correction/Note for Instructor: There is a revisionist view that fits here. They say "No" to strict alternatives but "Yes" to PAP via redefinition. To capture them, we need a nuance check in Q4.)*

  **Question 4:** Since Jones had no alternative possibilities, does this prove that having alternatives is **never necessary** for moral responsibility?

  *   **YES:** Alternatives are not necessary. Responsibility depends on something else (e.g., how the action was caused).
      *   **Go to Question 5.**
  *   **NO:** Alternatives *are* necessary, but our understanding of "could have done otherwise" needs to change.
      *   **→ LEAF 5: Revisionist PAP.**
      *   *Philosophical Location:* You keep PAP by redefining "could have done otherwise." For example, you might argue it means "Jones had the capacity to do otherwise," even if the opportunity was blocked.
      *   *Flag:* This leaf is difficult to pull apart from **Leaf 4 (Flicker)**. Both preserve PAP. The difference is that Flicker finds a *real* alternative in the scenario, while Revisionism changes the *definition* of ability to fit the scenario.

  **Question 5:** If alternatives are not necessary for responsibility, does this mean **Causal Determinism** is compatible with moral responsibility?

  *   **YES:** If we can be responsible without alternatives, then the fact that determinism removes alternatives doesn't matter.
      *   **→ LEAF 6: Standard Frankfurt / Compatibilism.**
      *   *Philosophical Location:* Frankfurt cases refute PAP, and since PAP was the main reason to reject Compatibilism, Compatibilism stands.
  *   **NO:** Alternatives aren't necessary, but Determinism still destroys responsibility for a *different* reason (e.g., it makes the agent the wrong kind of source).
      *   **→ LEAF 7: Source Incompatibilism.**
      *   *Philosophical Location:* You agree Frankfurt cases refute PAP, but you deny this helps Compatibilism. Determinism rules out responsibility because it undermines the *source* of the action, not because it removes alternatives.

  ---

  ### **Logical Space Flags & Exclusions**

  **1. The Incoherent Leaf (Empty Space)**
  *   **Combination:** Jones is Responsible + No Alternatives Possible + Alternatives are Necessary for Responsibility.
  *   **Status:** **Incoherent.**
  *   **Explanation:** If a student answers "Yes" to Responsibility, "No" to Alternatives, and "Yes" to PAP (without redefining terms), they hold a contradictory set of beliefs. The tree forces them out of this space at Question 4.

  **2. The Indistinguishable Leaves**
  *   **Combination:** **Leaf 4 (Flicker)** vs. **Leaf 5 (Revisionist PAP).**
  *   **Status:** **Hard to Pull Apart.**
  *   **Explanation:** Both views conclude that Jones is responsible and that PAP is technically true. The distinction relies on metaphysical nuance: whether a "flicker" counts as a robust alternative possibility or whether "ability" is merely dispositional. In a classroom setting, students often slide between these without realizing it.

  **3. Excluded Obscure Views**
  *   **Buffered Alternatives:** The view that Jones has alternatives but they are not "robust" enough to ground responsibility, yet he is responsible anyway. (Mapped roughly to Source Incompatibilism or Standard Frankfurt depending on the student's stance on determinism).
  *   **Hard Incompatibilism (General):** Students who say "Jones is not responsible" simply because "Free will doesn't exist" (regardless of Frankfurt cases) are filtered into **Leaf 2**. The tree focuses on *Frankfurt-specific* objections, so general skepticism is noted but not fully differentiated.
  *   **Semi-Compatibilism:** This is effectively split between **Leaf 6** (if they think it leads to full compatibilism) and **Leaf 7** (if they think determinism still blocks freedom). The tree forces a choice on the compatibility of determinism to ensure a clear position.

  ### **Instructor's Guide to the Leaves**

  | Leaf | Position | Key Takeaway for Students |
  | :--- | :--- | :--- |
  | **1** | **Dilemma (Det)** | The case assumes what it tries to prove (that determinism allows responsibility). |
  | **2** | **Hard Incompatibilism** | You reject free will generally; the Frankfurt case is just one example of a determined world. |
  | **3** | **Dilemma (Indet)** | The case fails to rule out alternatives; if it did, it would be deterministic (see Leaf 1). |
  | **4** | **Flicker** | PAP is true; Frankfurt cases always leave a tiny alternative (a "flicker") that grounds responsibility. |
  | **5** | **Revisionist PAP** | PAP is true, but "could have done otherwise" means having the capacity, not the opportunity. |
  | **6** | **Standard Frankfurt** | PAP is false. Responsibility is compatible with determinism. |
  | **7** | **Source Incompatibilism** | PAP is false, but Determinism is *still* incompatible with responsibility (due to sourcehood). |
