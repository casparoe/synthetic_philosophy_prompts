  3.  **Evaluate Each Claim (Verdicts & Mapping to (a)/(b)):**
      *   *Claim 1 (Causal):* True. Inaction changes the future relative to *other* actions, but relative to *itself*? It's about the baseline definition. If "neutral" means "zero penalty," then inaction *should* be zero penalty by definition in the user's method. If "neutral" means "no world change," then inaction *does* change the world (entropy, etc.).
          *   *Verdict:* Substantive.
          *   *Support:* Supports (a) (baseline choice matters). Doesn't necessarily support (b) (we can still pick a useful baseline).
      *   *Claim 2 (Counterfactual):* True. There are many baselines (no-op, previous policy, human prior).
