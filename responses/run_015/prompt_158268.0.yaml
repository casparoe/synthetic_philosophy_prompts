      *   *Claim 4 (Invariance):* True. State representation matters.
          *   *Verdict:* Substantive.
          *   *Support:* Supports (a). Known wart in the field (Turney et al. discuss this).
      *   *Claim 5 (Deflationary):* Radical. "Impact = Disvalue."
          *   *Verdict:* Controversial/Debatable. This is the core of the disagreement.
          *   *Support:* Supports (b). This is the "kill shot."
      *   *Hume's Law ("Ought from Is"):* Separate claim. It's about deriving norms from facts.
