answer: |-
  # The Commitment Race Checklist
  **Purpose:** Rapid evaluation of strategic commitments under pressure (20–30 min).
  **Framework:** Reversibility Gradient × Shadow-Cost.

  ## Part 1: The Procedure

  **Step 1: Define the Specific Commitment (5 min)**
  Write down exactly what action the board is requesting. Is it a zoning change, a subsidy promise, a signed MOU, or capital expenditure?
  *   **[JUDGMENT REQUIRED]:** Distinguish between *public rhetoric* and *legal obligation*. A press release is not a pipeline.

  **Step 2: Score the Reversibility Gradient (5 min)**
  How quickly does this decision harden into concrete?
  *   **Fast Hardening:** Zoning changes, ground-breaking, irreversible capital spend.
  *   **Slow Hardening:** MOUs, task forces, preliminary studies, non-binding pledges.
  *   *Action:* Label the commitment **FAST** or **SLOW**.

  **Step 3: Estimate the Shadow-Cost (5 min)**
  If we reverse this decision later, who sees it and what is the pain?
  *   **High Shadow:** Publicly announced, competitor-observed, voter-facing. Backing out looks like failure or instability.
  *   **Low Shadow:** Internal capacity building, private negotiations, modular testing. Backing out looks like prudent adjustment.
  *   *Action:* Label the commitment **HIGH SHADOW** or **LOW SHADOW**.

  **Step 4: Stress-Test the Rival Move (5 min)**
  Your neighbors locked something in. Is it real?
  *   **Signal:** Did they spend money or just change language?
  *   **Constraint:** Are they legally bound, or can they pivot if federal rules change?
  *   **[JUDGMENT REQUIRED]:** Assess whether their move is a *strategic lock* or a *negotiating bluff*.

  **Step 5: Select Path (5 min)**
  Use the matrix below based on Steps 2 & 3.

  | Reversibility | Shadow-Cost | Recommended Path | Rationale |
  | :--- | :--- | :--- | :--- |
  | **FAST** | **HIGH** | **WAIT / OBSERVE** | Highest risk. Only match if rival move is verified irreversible. |
  | **FAST** | **LOW** | **PARTIAL COMMIT** | Harden the tech, soften the public promise. |
  | **SLOW** | **HIGH** | **PARTIAL / DISPLAY** | Signal intent without locking mechanics. |
  | **SLOW** | **LOW** | **HARD COMMIT** | Low risk. Use this to build momentum. |

  ---

  ## Part 2: The Hard Case Flag

  **⚠️ THE TRAP OF STRATEGIC PATIENCE**
  There is a specific scenario where this checklist will tell you to **WAIT**, but your board will perceive it as **WEAKNESS**.
  *   **Condition:** Rival makes a **FAST/HIGH** move. You have **FAST/HIGH** options available.
  *   **Optimal Move:** Wait. Let them bear the risk of policy shifts or technology failure.
  *   **Political Reality:** Your board will see this as "losing the race."
  *   **Mitigation:** You must reframe "Waiting" as "Letting them de-risk the technology for us." Do not call it waiting; call it *phased validation*.

  **[JUDGMENT REQUIRED]:** You must personally sell the narrative that patience is a weapon, not a delay. The checklist cannot do this for you.

  ---

  ## Part 3: Case Applications

  ### Case 1: The Pipeline Corridor (Rival Pre-Commitment)
  **Scenario:** A neighboring region just zoned land and approved subsidies for a CO₂ pipeline. Your board wants to match immediately to secure the hub designation.
  *   **Gradient:** **FAST.** Zoning and subsidies harden quickly once legally filed.
  *   **Shadow-Cost:** **HIGH.** This is public, competitive, and visible to investors.
  *   **Rival Move:** They have filed zoning, but federal permitting is still uncertain.
  *   **Checklist Output:** **FAST + HIGH = WAIT / OBSERVE.**
  *   **Recommendation:** **Do not match the pre-commitment.**
      *   *Why:* If federal carbon-capture tax credits shift or technology lags, your rival is stuck with stranded assets. You remain flexible.
      *   **Board Friction:** **HIGH.** This is the answer they won't want to hear. They fear losing the hub designation. You must argue that being the *second* mover allows you to adopt their lessons without their sunk costs.

  ### Case 2: Modular Capacity Build-Out
  **Scenario:** Instead of a massive hub, you propose building small-scale, modular capture units that can be scaled up later.
  *   **Gradient:** **SLOW.** Modular units can be paused, moved, or repurposed.
  *   **Shadow-Cost:** **LOW.** This is framed as "pilot capacity" rather than "final infrastructure."
  *   **Checklist Output:** **SLOW + LOW = HARD COMMIT (on the modular aspect).**
  *   **Recommendation:** **Proceed with modular build.**
      *   *Why:* You lock in some presence (satisfying the board's desire for action) without triggering the high shadow-cost of a full hub promise.
      *   **Board Friction:** **LOW.** This looks like action, but preserves your escape hatch.

  ---

  ## Part 4: Limitations & Misfire Conditions

  **What This Procedure Cannot Do:**
  1.  **Quantify Political Courage:** It cannot measure if your board will fire you for waiting. The "Hard Case" flag identifies the risk, but you must manage the personnel risk yourself.
  2.  **Predict Black Swans:** If federal policy changes overnight, the Reversibility Gradient becomes irrelevant.
  3.  **Eliminate Information Asymmetry:** You are assuming you know the rival's true position. If you are wrong about their irreversibility, waiting becomes losing.

  **When It Will Misfire:**
  *   **Winner-Take-All Markets:** If there is literally only *one* hub designation available and it is awarded on a first-come basis, "Waiting" is fatal regardless of gradient.
  *   **Signaling Dominance:** If your organization's brand relies on being the "first mover" for donor psychology, the Shadow-Cost calculation changes. The cost of *not* acting may outweigh the cost of reversing later.
  *   **Internal Misalignment:** If your staff executes a "Partial Commitment" as a "Hard Commit" due to poor communication, you incur the High Shadow-Cost without the strategic benefit.

  **[JUDGMENT REQUIRED]:** Before finalizing any decision, ask: "If I am wrong about the rival's commitment, can I survive the error?" If the answer is no, you must upgrade your intelligence gathering before using this checklist.
