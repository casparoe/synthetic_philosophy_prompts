answer: |-
  **Specification for an Adequate Theory of Moral Demand**
  **Requestor:** Retired Experimental Physicist (Age 71)
  **Date:** October 26, 2023
  **Subject:** Operational Definitions for Moral Limits

  You have asked for a calibration standard. In your field, an instrument is inadequate if it cannot distinguish signal from noise within a stated error bar. In ethics, a theory is inadequate if it cannot distinguish obligation from optionality without collapsing under edge cases. Below are the desiderata derived from your eight cases and required distinctions.

  ### Part I: The Desiderata (The Specification)

  **1. Coordination Sensitivity (Derived from Case 1: The Pond)**
  *   **Requirement:** The theory must specify whether an agent's demand is a function of the *actual* contributions of others or the *expected* contributions.
  *   **Test Case:** 11 bystanders. Child drowning. Rescue cost: $100 per person. Threshold: $200 (any two pay). You are the 12th bystander. If 2 have already paid, does the theory demand you pay $100?
  *   **Why Non-Negotiable:** A theory that demands payment when the child is already saved treats morality as ritual rather than function. A theory that never demands payment until the threshold is certain invites free-riding that guarantees failure.

  **2. Currency Commensurability (Derived from Case 2: The Retiree)**
  *   **Requirement:** The theory must declare whether money, time, risk, and relational integrity are convertible into a single metric of "cost" or remain lexically distinct.
  *   **Test Case:** Agent has $50,000 liquid assets and 2,000 hours of free time annually. Theory must state if spending $10,000 is equivalent to, greater than, or incomparable to spending 500 hours.
  *   **Why Non-Negotiable:** Without a common numeraire, the theory cannot rank options. If currencies are lexical, the theory must specify the hierarchy (e.g., time > money) to avoid paralysis.

  **3. Ex Ante Assessment (Derived from Case 3: The Null Result)**
  *   **Requirement:** The theory must assess the demand based on the expected value at the time of decision, not the realized outcome.
  *   **Test Case:** Researcher invests 20 years and $1M. Ex ante probability of success: 40%. Outcome: Null. Did the researcher meet the demand?
  *   **Why Non-Negotiable:** If assessment is ex post, morality becomes a lottery. Rational agents would be forbidden from high-variance, high-expected-value projects, reducing total good.

  **4. Baseline Plasticity (Derived from Case 4: The Second Career)**
  *   **Requirement:** The theory must state whether the "capacity to do good" is a fixed constraint or a variable subject to moral demand.
  *   **Test Case:** Agent earns $50k/year in low-impact work. Could train for 3 years at cost of $30k to earn $200k/year in high-impact work. Is the training period required?
  *   **Why Non-Negotiable:** If capacity is fixed, the theory ignores investment. If capacity is variable, the theory risks demanding infinite self-instrumentalization (becoming a machine for doing good).

  **5. Historical Supervenience (Derived from Case 5: Hysteresis)**
  *   **Requirement:** The theory must declare whether moral demand supervenes solely on the present state or includes the integral of past sacrifice.
  *   **Test Case:** Agent A and Agent B are identical today (wealth, health, time). Agent A gave 50% of income for 20 years. Agent B gave 0%. Does Agent A have a lower demand today?
  *   **Why Non-Negotiable:** If history matters, the theory accounts for burnout and fairness. If history does not matter, the theory treats agents as stateless functions, ignoring the temporal structure of a life.

  **6. Reference Calibration (Derived from Case 6: The Moving Baseline)**
  *   **Requirement:** The theory must specify the reference point against which "sacrifice" is measured: actual desires, ideal desires, or statistical norms.
  *   **Test Case:** Ascetic Agent enjoys giving away money; cost to utility is zero. Hedonist Agent suffers greatly giving the same amount. Does the Ascetic owe more?
  *   **Why Non-Negotiable:** If measured against actual desires, morality rewards manipulation of preference. If measured against norms, it punishes virtue. A theory must pick a zero-point.

  **7. Risk Symmetry (Derived from Case 7: Risk to Agent)**
  *   **Requirement:** The theory must specify if risk aversion applies to the *cost* to the agent differently than to the *benefit* to the recipient.
  *   **Test Case:** Option A: Cost $1,000, saves 1 life (certain). Option B: Cost $10,000, 1% chance to save 1,000 lives (Expected Value: 10 lives). Must the agent take Option B?
  *   **Why Non-Negotiable:** Asymmetric risk handling (risk-neutral for good, risk-averse for cost) creates a hidden subsidy for caution. Symmetric handling may demand gambles that ruin the agent.

  **8. Full Compliance Stability (Derived from Case 8: Universal Compliance)**
  *   **Requirement:** The theory must yield stable, non-absurd verdicts when the compliance rate is 100%.
  *   **Test Case:** Everyone else donates 10% of income. Poverty is solved. Marginal impact of your 10% is zero (funds sit unused). Are you required to donate?
  *   **Why Non-Negotiable:** A theory that works only under partial compliance fails as a universal law. It implies morality disappears when successful.

  **9. Deontic Granularity (Derived from Required Distinctions)**
  *   **Requirement:** The theory must distinguish between *Required* (blame if omitted), *Praiseworthy* (praise if done, no blame if omitted), and *Permitted* (no praise/blame).
  *   **Why Non-Negotiable:** Without this, the theory cannot guide social enforcement or internal guilt. A binary "do/don't" collapses the supererogatory.

  ---

  ### Part II: Prejudice Check (Non-Negotiable vs. Preference)

  You asked for honesty regarding your physicist's instincts.

  **1. The Demand for Resolution (Verdict vs. Interval)**
  *   **Your Demand:** You want a theory to deliver a verdict (Required/Not Required) at a stated resolution, not an interval or a shrug.
  *   **Status:** **Physicist Prejudice.**
  *   **Argument:** In physics, nature provides a signal; the instrument reads it. In ethics, the "signal" is often genuinely indeterminate. Moral concepts like "significant sacrifice" may be inherently vague (sorites-prone). Insisting on a binary cutoff forces theories to draw arbitrary lines where none exist, reducing accuracy to gain false precision. A theory that outputs "Required with confidence 0.8" is more honest than one that outputs "Required."

  **2. The Demand Against Gerrymandering (Fitting Intuitions)**
  *   **Your Demand:** You dislike theories gerrymandered to reproduce verdicts we antecedently like.
  *   **Status:** **Camp Preference (Rationalist vs. Reflective Equilibrium).**
  *   **Argument:** In physics, you fit the model to the data. In ethics, our considered judgments *are* the data. The method of "reflective equilibrium" explicitly requires adjusting theory to match strong intuitions and vice versa. Rejecting this fit rejects the primary justification method of the field. However, your point stands against *ad hoc* patches added solely to save a specific case without principled grounding.

  **3. The Demand for Error Bars (Uncertainty Handling)**
  *   **Your Demand:** You want an answer that holds if cost-effectiveness estimates are wrong by an order of magnitude.
  *   **Status:** **Non-Negotiable.**
  *   **Argument:** This is not a prejudice; it is a robustness condition. Any theory relying on precise utilitarian calculations fails in the real world where data is noisy. A robust theory must rely on heuristics or rules that hold across orders of magnitude.

  ---

  ### Part III: Incompatibilities (The Trade-Offs)

  You asked for the structure that forces a choice. No theory can satisfy all desiderata simultaneously.

  **Incompatibility Triad:**
  1.  **Marginal Impact (Case 1 & 8):** Demand scales with the actual good produced by the act.
  2.  **Fair Share (Case 5 & 8):** Demand is limited to a "fair share" of the collective burden.
  3.  **Maximization (Case 4 & 7):** Agent must always choose the option with the highest expected value.

  **The Conflict:**
  If everyone complies (Case 8), Marginal Impact drops to near zero. If Demand scales with Marginal Impact, Demand vanishes. But if Demand vanishes, Maximization is no longer required, and the "Fair Share" becomes irrelevant.
  However, if you maintain Maximization (always do the most good), then in a Partial Compliance world (Case 1), the agent must pick up the slack of non-compliers. This violates Fair Share (Case 5) and creates Hysteresis issues (Case 5: the conscientious agent is punished with higher demands).

  **Recommendation:**
  **Drop Marginal Impact as the sole determinant of Demand.**
  *Reason:* A theory based purely on marginal impact makes morality disappear when it is most successful (Universal Compliance) and makes it crushing when it is least successful (Partial Compliance). It is unstable. A "Fair Share" constraint (limiting demand to what would be required if everyone did their part) is necessary to preserve the stability of the moral life, even if it means accepting a sub-optimal outcome in the short term.

  ---

  ### Part IV: The Most Exclusionary Requirement

  **Requirement:** **Reference Calibration (Case 6: The Moving Baseline).**

  **Why:** This requirement excludes the largest number of otherwise attractive candidates.
  *   **Subjective Views:** If sacrifice is measured by actual pain/desire, the Ascetic (who loves giving) owes everything, and the Hedonist (who hates giving) owes nothing. This is absurd.
  *   **Objective Views:** If sacrifice is measured by an objective standard (e.g., "basic needs"), the theory struggles to account for why the Ascetic's lack of suffering doesn't make giving *easier* (and thus more required).
  *   **The Exclusion:** To pass this test, a theory must define a "Normal Human Functioning" baseline that is neither purely statistical (which varies wildly) nor purely ideal (which is too demanding). Most theories fail here: they either collapse into "morality demands you change your desires" (too invasive) or "morality accepts your desires as given" (too permissive). This is the hardest calibration problem in ethics.

  ---

  ### Part V: Scorecard of Candidate Families

  **Scalar and Satisficing Consequentialism**
  *   **Score:** Fails Resolution and Baseline.
  *   **Assessment:** These views deny the binary "Required/Permitted" distinction, treating morality as a matter of degree (Scalar) or "good enough" (Satisficing). This aligns with your preference for error bars but fails the Deontic Granularity test; it cannot tell your granddaughter what you *must* do versus what is *nice* to do. They handle Risk (Case 7) well but collapse on the Moving Baseline (Case 6), as "good enough" is undefined without a reference point.

  **Personal Prerogative / Sphere of Permission**
  *   **Score:** Passes Hysteresis, Fails Coordination.
  *   **Assessment:** These views grant agents a right to pursue personal projects up to a cost limit. They handle the Retiree (Case 2) and Hysteresis (Case 5) well by protecting time and past effort. However, they typically fail Coordination (Case 1); if everyone exercises their prerogative in a crisis, the child drowns. They solve the agent's stability problem by potentially failing the world's needs.

  **Motivation-Based Limits (Human Nature)**
  *   **Score:** Passes Moving Baseline, Fails Robustness.
  *   **Assessment:** These views limit demand to what humans can psychologically sustain without resentment or breakdown. They answer Case 6 well (calibration against human psychology). However, they fail your Robustness constraint (Part II.3); human psychology is malleable. If we can train ourselves to endure more, the limit moves. They also struggle with Ex Ante Assessment (Case 3), as motivation is often retrospective.

  **No-Limit Views (Maximizing)**
  *   **Score:** Passes Coordination, Fails Retiree/Hysteresis.
  *   **Assessment:** These views demand you do the most good possible, period. They solve Case 1 and Case 8 perfectly (always maximize impact). However, they fail the Retiree (Case 2) and Hysteresis (Case 5) tests catastrophically. They treat your time and assets as fully convertible to good with no lexical protection for your life's structure. They are theoretically clean but operationally unstable for a single agent over a lifetime.
