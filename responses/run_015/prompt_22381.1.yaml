      *   Bet C: Win on $E \cup G$. Bet D: Win on $F \cup G$.
      *   Note that on event $G$ (Yellow), both C and D pay the same (Win). On event $E \cup F$, the payoffs swap relative to A and B.
      *   Actually, let's look at the common consequence.
      *   Compare A vs B. Common outcome on $Y$: \$0.
      *   Compare C vs D. Common outcome on $Y$: \$100.
      *   Sure-Thing Principle says: If you prefer A to B when the outcome on $Y$ is \$0, you should prefer A to B (which corresponds to C to D structurally) when the outcome on $Y$ is \$100.
      *   Wait, C is $R \cup Y$ (Win on R, Win on Y). D is $B \cup Y$ (Win on B, Win on Y).
