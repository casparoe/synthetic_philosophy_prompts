      *   On event $R \cup B$, C pays 100 on R, 0 on B. D pays 0 on R, 100 on B.
      *   So C vs D is exactly A vs B, except the payoff on the "irrelevant" event $Y$ has changed from 0 (in A/B) to 100 (in C/D).
      *   Savage's P2 says preferences should not depend on the payoff assigned to the event where the acts are identical.
      *   The Ellsberg chooser *does* care. They prefer the known probability (R) when the unknown part (Y) pays 0, but they prefer the known probability (B+Y) when the unknown part (Y) pays 100. Why? Because in the first case, they are avoiding the unknown B. In the second case, they are including the unknown Y with the known B to make a known total (B+Y = 60/90).
      *   Actually, the standard explanation is: A is known prob (1/3). B is unknown. C is unknown (R+Y = 1/3 + ?). D is known prob (2/3).
      *   So people prefer Known over Unknown in both cases.
      *   SEU says "Unknown" must be represented by *some* number. If you assign a number, you can't prefer Known over Unknown in both complementary cases.

  6.  **Synthesize the Explanation:**
      *   **Validate the User:** It's a very common and intelligent confusion. The "reduction of compound lotteries" is the key technical step they are missing.
      *   **The "Prior-over-Priors" Trap:** Explain that in SEU, a distribution over probabilities collapses into a single mean probability. $P_{subjective}(E) = \int P(E|\theta) d\mu(\theta)$. Once collapsed, the math forces $P(R) + P(B) + P(Y) = 1$. The contradiction re-emerges.
      *   **Risk vs. Ambiguity:** Clarify that standard risk aversion (concave $u(x)$) applies to outcomes, not probabilities. To be averse to variance in probabilities, you need a function $\phi$ applied to the expected utility (like in KMM model) or non-additive probabilities (Choquet).
      *   **Savage's P2:** Explain the Sure-Thing Principle violation simply. The preference reverses based on what happens in the state where the acts are identical.
      *   **The "Why it Matters":** If we allow prior-over-priors to justify Ellsberg within SEU, we lose the ability to update beliefs via Bayes' rule dynamically without running into dynamic inconsistency. Ambiguity models allow for different updating rules.

