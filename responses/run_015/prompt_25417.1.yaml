answer: |-
  This is a sophisticated and risky pedagogical goal. You are right to be cautious. There is a significant philosophical distinction between the Western analytic puzzle of **Personal Identity** (e.g., Ship of Theseus, Teletransportation: *Am I the same person over time?*) and the Buddhist doctrine of **Anatta** (*Is there a controller/owner right now?*).

  If you run a "Ship of Theseus" game, you risk teaching them that identity is *fluid* or *fragile*. That is not *anatta*. *Anatta* suggests that even if the ship remains perfectly intact, there is no "ship" apart from the planks, nails, and the concept "ship." There is no "ghost in the machine."

  For a novelist, the analytic puzzle is often less useful than the *phenomenological* one. Writers struggle with "agency." They write characters who "decide" things magically, rather than characters whose actions arise from causes and conditions.

  Therefore, I recommend an activity that targets **the locus of control** rather than **the continuity of identity**. This aligns better with *anatta* (specifically the lack of a *kartṛ* or "agent") and is immediately applicable to prose.

  Here is a structured 90-minute workshop module designed to do exactly what you asked: induce the experience of the "unfindable self" before introducing the terminology.

  ### Activity Title: "The Origin of the Impulse"
  **Time:** 90 Minutes
  **Group Size:** 12 (Break into 6 pairs for the core activity)
  **Materials:** Paper, pens, a bell/timer.

  #### Part 1: The Setup (15 Minutes)
  **Goal:** Establish a concrete moment of agency to deconstruct.
  1.  **Instruction:** Ask participants to spend 10 minutes writing a single scene (300–500 words).
  2.  **The Prompt:** "Write a moment where your character makes a difficult, spontaneous moral choice. Not a calculated plan, but a reflex or an impulse. (e.g., intervening in a fight, telling a lie to protect someone, stealing an item)."
  3.  **Constraint:** They must write it normally, using standard agentive language ("He decided," "She felt," "He chose").
  4.  **Transition:** Collect the papers (or have them keep them). Tell them: "We are going to investigate where that choice actually happened."

  #### Part 2: The Interrogation (45 Minutes)
  **Goal:** Experientially demonstrate the infinite regress of causality.
  1.  **Pair Up:** Participants form pairs. One is the **Author**, one is the **Interrogator**.
  2.  **The Rules:** The Author reads their scene aloud, one sentence at a time. The Interrogator is not allowed to critique the prose. They have only one tool: The Question **"Why?"** or **"Where from?"**
  3.  **The Drill:**
      *   *Author reads:* "Elena decided to lie."
      *   *Interrogator asks:* "Why did she decide that?"
      *   *Author answers:* "Because she was afraid."
      *   *Interrogator asks:* "Where did the fear come from?"
      *   *Author answers:* "From her childhood trauma."
      *   *Interrogator asks:* "Is the trauma her? Or something that happened to her?"
      *   *Author answers:* "Something that happened."
      *   *Interrogator asks:* "Then who is the 'her' that decided? If the decision came from the trauma, and the trauma isn't 'her,' where is the decider?"
  4.  **The Trap:** The Author will try to find a solid ground (a value, a core trait, a soul). The Interrogator must gently push back. If the Author says "It's just her nature," the Interrogator asks, "Where did the nature come from? Genetics? Environment? If it came from somewhere else, is it truly *hers*?"
  5.  **Switch:** After 15 minutes, ring the bell. Swap roles.
  6.  **Group Reconvene (15 mins):** Ask the room:
      *   "Did anyone find the exact location of the 'Decider'?"
      *   "At what point did the explanation stop being about *the character* and start being about *causes outside the character*?"
      *   "If every impulse has a prior cause, is there any room left for a 'Self' to step in and push the lever?"

  *(Note: This mirrors the Buddhist concept of Dependent Origination. The goal is to show that what we call 'choice' is a cascade of prior conditions, none of which are a 'self'.)*

  #### Part 3: The Rewrite (20 Minutes)
  **Goal:** Apply the insight to craft.
  1.  **Instruction:** "Take your original scene. Rewrite it. But here is the constraint: You are not allowed to use agentive verbs that imply a central controller. No 'decided,' 'chose,' 'felt,' 'thought.'"
  2.  **The Shift:** Instead of "He felt anger," write "Anger arose." Instead of "She chose to run," write "The legs moved," or "Fear triggered the flight."
  3.  **Prompt:** "Describe the character as a site where phenomena are happening, rather than a person who makes things happen. Let the actions arise from the conditions you uncovered in the interrogation."
  4.  **Silence:** 15 minutes of writing. 5 minutes to quietly review what changed.

  #### Part 4: The Debrief & Mapping (10 Minutes)
  **Goal:** Connect the experience to the doctrine (Anatta/Skandhas).
  *Now* you introduce the terminology. You can say something like:

  > "What you just felt—that frustration of not being able to locate the 'Decider'—is the experiential core of the Buddhist doctrine of *Anatta* (No-Self).
  >
  > In the interrogation, you were effectively dissecting the **Five Aggregates (Skandhas)** without knowing it:
  > 1.  **Form:** The body/brain state.
  > 2.  **Sensation:** The physical feeling (fear, tightness).
  > 3.  **Perception:** The labeling ('This is dangerous').
  > 4.  **Volition:** The impulse to act.
  > 5.  **Consciousness:** The awareness of the event.
  >
  > Buddhism argues that if you look for the 'Self' in any of these five, you won't find it. You found that the 'choice' was just volition arising from sensation, which arose from perception.
  >
  > **The Shift:** In your writing, you usually posit a Self (the Captain) who steers the ship. The Buddhist lens suggests the ship steers itself based on wind and current (causes and conditions). When you write from *this* perspective, your characters often become more compassionate, more complex, and less judgmental, because they are no longer 'guilty' of their nature—they are simply the place where the universe is happening."

  ---

  ### Philosophical & Pedagogical Caveats
  You asked for plain talk about whether this rests on a confused reading. Here is the risk assessment:

  **1. The "No Self" vs. "No Owner" Distinction**
  *   **Risk:** The activity above might lead writers to think, "My character is just a puppet." This is Nihilism, not Buddhism.
  *   **Correction:** In the debrief, emphasize **Dependent Origination** (*Pratītyasamutpāda*). The character *does* exist, but they exist *relationally*, like a fire. A fire is real, it burns, it moves. But you cannot find "the fire" apart from the fuel, the heat, and the oxygen. If you remove the fuel, the fire doesn't "go" anywhere; it ceases.
  *   **Writing Application:** This doesn't destroy character agency; it deepens it. It moves the writer from "What would this person do?" (essentialist) to "Given these conditions, what action arises?" (process-oriented). This creates incredibly vivid, inevitable plotting.

  **2. The Burden of Proof**
  *   You wanted to shift the burden of proof to *positing* a self. This activity does that by making the "Self" the variable that drops out of the equation without changing the outcome. If the action happens whether we say "He chose" or "The choice arose," the "He" is superfluous to the mechanics of the scene.

  **3. Is 90 Minutes Enough?**
  *   It is tight. The Interrogation (Part 2) is the critical engine. If pairs get stuck in literary critique ("I like this sentence"), the philosophical point is lost.
  *   **Mitigation:** As the facilitator, circulate aggressively during Part 2. If you hear a pair discussing plot, stop them. Remind them: "You are hunting for the ghost. Keep asking 'Where from?'"

  **4. Alternative Tradition?**
  *   **Hume:** David Hume's "Bundle Theory" is nearly identical to the *skandhas* but secular. If you worry about the "Buddhist" label carrying baggage (meditation, religion, exoticism), you can frame this as "Humean Deconstruction." The mechanics are the same.
  *   **Dennett:** Daniel Dennett's "Center of Narrative Gravity" is also useful for writers. It suggests the "Self" is a fiction we tell to make sense of the data.
  *   **Recommendation:** Stick with Buddhism if that is your passion, but frame it as "Phenomenology" (the study of experience) rather than "Theology." Your syllabus description ("destabilizing lens") is perfect. Keep it there.

  ### Why This Works for Mid-Career Writers
  Mid-career writers often struggle with characters who feel "constructed" or "plot-driven." They know their characters feel like puppets, but they don't know why.
  *   **Standard Advice:** "Give them more agency!" (Which leads to melodrama).
  *   **This Activity:** "Remove the agency and watch what happens." (Which leads to realism).
  By removing the "Decider," they are forced to write the *causes* of the decision. This creates depth. A character who lies because "fear tightened the throat" is more compelling than a character who "decided to lie."

  ### Final Recommendation
  Run the activity as described. It is philosophically sound enough for a workshop context (it captures the *soteriological* goal of *anatta*—reducing clinging to the agent—even if it simplifies the metaphysics).

  **One crucial instruction for the Debrief:**
  Warn them that this is a **lens**, not a **law**.
  > "You do not have to believe there is no self. You only have to write *as if* there is no self for 20 minutes. See if the prose becomes more alive. If it does, keep the tool. If it makes your writing dead, put it down. But notice *why* it felt difficult. That difficulty is where your attachment to 'Character as Essence' lives."

  This respects their autonomy as artists while delivering the destabilizing experience you intend.
