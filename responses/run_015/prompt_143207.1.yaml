answer: |-
  Here is the repaired rule, tested against your cases, with the necessary sacrifices.

  ### The Principle: Liability Without Leverage

  Your "gives-something-up" rule is correct in spirit but too economic. It treats the apology as a transaction. It is not a transaction; it is an assumption of burden. The repaired principle is this: **An apology counts only when the speaker voluntarily accepts moral continuity with the harm-doer and incurs a cost they could have avoided.**

  Here are the four clauses that make this work, tied to your specific cases.

  **Clause 1: Moral Continuity**
  The speaker must claim the harm as their own, regardless of legal or temporal distance.
  *   **Motivating Case:** The successor state that denies legal continuity but apologizes (counts) versus the reincorporated company (counts for nothing).
  *   **The Fix:** States claim to represent a timeless people; companies claim to represent temporary capital. The state accepts that *we* did this, even if *this government* didn't. The company uses the new registration number to say *they* did this, not *us*.
  *   **The Cost:** This forces you to drop the verdict on the **museum returning remains**. You feel the apologetic work got done. It did not. That is restitution. Restitution repairs the object; apology repairs the relationship. Without a speech act admitting fault, there is no apology. You must categorize this as "Repair," not "Apology." If it is silent, it is not your column.

  **Clause 2: Voluntary Risk**
  The apology must be offered before the speaker is forced to offer it.
  *   **Motivating Case:** The secret program (counts a great deal) versus the archives opening next year (counts less). Also the lame-duck government (counts less).
  *   **The Fix:** Timing reveals motive. If you apologize when you are safe, it is moral. If you apologize when you are cornered, it is strategy.
  *   **The Cost:** This forces you to drop the verdict on the **hereditary heir**. You wrote that an heir apologizing with "no choice about the role" counts more. This contradicts the Voluntary Risk clause. A role you cannot quit is not a risk you take. The heir counts *only if* they explicitly acknowledge that they are choosing to bear a burden they did not create. If they treat it as ceremonial duty, it is just pageantry. The apology comes from the choice to accept the guilt, not the accident of birth.

  **Clause 3: Non-Transactional Cost**
  The speaker must not purchase silence. The cost must remain open-ended.
  *   **Motivating Case:** Reparations framed as not a full settlement (count more) versus money with a release-of-claims attached (counts less than no money).
  *   **The Fix:** A release of claims turns the apology into a bill payment. It closes the ledger. An apology must keep the ledger open. It says, "I owe you," not "I paid you."
  *   **The Cost:** This validates your gut on the money cases but clarifies why. It is not about the amount; it is about the closure.

  **Clause 4: Human Agency**
  A moral agent must stand behind the words and be vulnerable to the consequences.
  *   **Motivating Case:** The chatbot (doesn't count) versus the caseworker (counts) versus the minister defending model text (counts weakly).
  *   **The Fix:** An algorithm cannot suffer reputational damage. A human can. The minister counts weakly because they are defending text they didn't write; the caseworker counts because they have to fix the file. The cost is the labor of repair.
  *   **The Cost:** This confirms your gut on the AI text. Accuracy does not equal agency. A lie told by a human is a moral act; a truth told by a machine is data.

  ### The Brother's Hypothesis

  Your brother is half-right, but he has the direction wrong. You are not tracking who has standing to be *angry*. You are tracking who has standing to *answer*.

  Anger is a reaction; apology is an action. The victim always has standing to be angry. The speaker only earns standing to answer by accepting the burden of the "We." When a speaker says "I am sorry" on behalf of an institution, they are claiming the authority to speak for the group that did the harm. If they break that continuity (the new leader distancing themselves, the company reincorporating), they lose the standing to answer. They are no longer the right person to apologize. So, you are not measuring the victim's status; you are measuring the speaker's claim to represent the perpetrator.

  ### The Three Edge Cases

  Here is how the rule applies to the three cases you go back and forth on.

  **1. An apology the intended recipients publicly reject in advance.**
  *   **Verdict:** It counts.
  *   **Reasoning:** The cost to the speaker is bearing the rejection. If you apologize only when you know it will be accepted, you are seeking forgiveness, not offering apology. Offering an apology that is spat back at you is a pure cost with no return. That fits the "Liability Without Leverage" principle.

  **2. An apology addressed to future generations for climate inaction.**
  *   **Verdict:** It does not count as an apology. It counts as a vow.
  *   **Reasoning:** There is no one to receive it, and no one to grant forgiveness. An apology requires a relationship. A statement to the future is a promise to change behavior, which is valuable, but it is not an apology. It lacks the reciprocal human agency.

  **3. A city council apologizing for a pogrom the national government still denies.**
  *   **Verdict:** It counts maximally.
  *   **Reasoning:** This satisfies Moral Continuity (the city is part of the state) and Voluntary Risk (the national government could punish or undermine them). It breaks the silence of the larger entity. It is a witness statement that incurs political risk.

  ### The Two Unseen Cases

  Here is what the rule predicts for the cases you haven't seen yet.

  **1. An AI system apologizing in its own name for harms its outputs caused, with no human signing it.**
  *   **Prediction:** It will not count.
  *   **Reasoning:** It fails the Human Agency clause. An AI cannot incur a cost. It cannot lose standing, feel shame, or be punished. It is a text generator simulating contrition. Even if the text is perfect, there is no one to hold liable. It is a mirror, not a speaker.

  **2. A state apologizing to its own citizens for a policy most of those citizens voted for.**
  *   **Prediction:** It will count maximally.
  *   **Reasoning:** This is the hardest apology to make. It requires the state to tell the citizens, "You did this, and I am you." It breaks the flattering story about the nation (your original rule) but goes further: it implicates the audience. The cost is the potential loss of political support from the very people who empowered the policy. It accepts moral continuity with the voters, not just the government.

  ### Where It Hurts

  To make this column work, you have to accept two hard truths.

  First, **action without speech is not apology.** The museum returning the remains is doing the right thing, but if they do not say *why*, they are denying the moral connection. They are treating it as logistics, not history. You must write that silence protects the institution from having to admit it was wrong.

  Second, **inherited guilt is not voluntary.** The hereditary heir only counts if they make it personal. If they read a script because they are the Crown, it is ritual. If they step out of the ritual and say, "I am choosing to carry this," it counts. The cost is not the role; the cost is the choice.

  Your brother thinks you are measuring the victim's anger. You are not. You are measuring the speaker's courage to say "We" when "They" would be safer. That is the only thing that turns speech into apology.
