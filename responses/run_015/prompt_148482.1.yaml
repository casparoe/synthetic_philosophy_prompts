answer: |-
  You are closer. Your friend is describing the *premise* of the film; you are describing its *argument*. "Memory is unreliable" is a psychological observation. "Running a life on unauditable knowledge sources" is an epistemological crisis. Nyāya is the perfect tool to adjudicate this because Nyāya is not interested in "truth" in the abstract; it is interested in *prama* (valid knowledge) versus *bhrama* (error), and specifically in the *conditions* that make a cognition valid.

  Here is the breakdown using Nyāya epistemology, adhering to your constraints.

  ### 1. The System: Defective *Śabda* or a New *Pramāṇa*?

  Your friend sees the polaroids and tattoos as memory aids. You see them as knowledge sources. Nyāya sides with you: Leonard is treating external artifacts as *pramāṇas*.

  **Is it a fifth *pramāṇa*?**
  Nyāya is conservative. It would not grant the status of a *pramāṇa* (a distinct means of valid knowledge) to a system that is structurally designed to produce error. A *pramāṇa* must, by definition, yield valid cognition (*yathārtha*). Leonard's system yields *viparyaya* (contrary knowledge). So, Nyāya would not create a new category for it. It would fold it into existing categories to show where they break.

  **The Category Error: *Pratyakṣa* masquerading as *Śabda***
  When Leonard looks at a tattoo on his chest, he is engaging in *pratyakṣa* (perception). He sees ink on skin. That perception is valid. However, he treats the *meaning* of the ink as *śabda* (testimony). He treats the tattoo as a statement from "Past Leonard" to "Present Leonard."

  In Nyāya, for *śabda* to be valid, the speaker (*śrotṛ*) must be an *āpta*—a reliable authority who is both competent and honest.
  *   **Competence:** Past Leonard is not competent. He lacks the memory to verify the fact at the time of inscription.
  *   **Honesty:** As the film reveals, Past Leonard is not honest. He inscribes facts he *wants* to be true, not necessarily what *is* true.

  Therefore, under Nyāya, Leonard's system is **defective *śabda***. It is testimony from a source that fails the reliability test.

  **The Problem of *Parataḥ Prāmāṇya***
  This is where your reading crushes your friend's. Nyāya holds *parataḥ prāmāṇya*: the validity of a cognition is extrinsic. You know a cognition is valid only if it leads to successful action (*samvādi pravṛtti*) or is verified by an external check.

  Leonard's system is a closed epistemic loop.
  1.  He creates the testimony (writes the note).
  2.  He consumes the testimony (reads the note).
  3.  He destroys the counter-evidence (burns the file, ignores Teddy).

  Because he systematically destroys the "outside check," *parataḥ prāmāṇya* can never be satisfied. He never allows the world to confirm or deny his cognitions.
  **The Verdict:** Nyāya would not say he has "too much" knowledge. It would say he has **zero** knowledge (*prama*). He is operating entirely in *bhrama* (error). He has high *certainty*, but certainty is not validity. Your friend thinks the film is about the *failure* of memory; you correctly identify it is about the *simulation* of knowledge. Leonard hasn't lost the ability to know; he has built a factory that manufactures certainty without validity.

  ### 2. Sammy Jankis: *Upamāna* or Tautology?

  You suggest the Sammy Jankis storyline is *upamāna* (comparison/analogy). This is a sophisticated read, but Nyāya would flag it as a corrupted use of the *pramāṇa*.

  **How *Upamāna* works:**
  Standard *upamāna* is: "You know a cow. A *gavaya* (wild ox) is like a cow. You see a *gavaya* in the forest and recognize it based on that similarity." It connects a name to an object via similarity to a known object.

  **Leonard's Usage:**
  Leonard is told a story about Sammy (the unknown). He maps his own condition (the known) onto Sammy to understand the limits of his condition. He uses Sammy as the *upamāna* (the standard of comparison) to understand himself (*upameya*).

  **The Break:**
  For *upamāna* to yield valid knowledge, the analogue must exist independently of the subject. The gut-punch of the film is that Sammy is likely a projection of Leonard himself (or a case Leonard has absorbed into his own identity).
  If the *upamāna* (Sammy) and the *upameya* (Leonard) are effectively the same entity, the comparison yields no new knowledge. It is a tautology. It is like saying "Leonard is like Leonard."

  **Is it legitimate?**
  Epistemologically, no. It is *aitihya* (rumor/tradition) mixed with *viparyaya* (error).
  **Psychologically/DRAMATICALLY, yes.** This supports your argument. The film dramatizes a man using a broken epistemological tool (*upamāna* on a fictional analogue) to justify his existence. He isn't learning from the comparison; he is using the comparison to hide from the fact that he is the source of the error. If your friend were right (it's just about memory), Sammy is a cautionary tale. If you are right (it's about unauditable sources), Sammy is a mirror that Leonard pretends is a window.

  ### 3. Where the Reading Breaks (The Constraints)

  You asked for specific scenes where this framing works and where it distorts.

  **Where Nyāya does real work: The Diner Scene with Teddy**
  *Context:* Teddy explains the entire setup. He tells Leonard that the "John G" he is hunting is already dead, that Leonard is being used, and that Leonard's own notes are manipulated.
  *   **Friend's View:** This is just more confusing plot information.
  *   **Nyāya View:** This is the moment of *bādha* (contradiction). Teddy offers an external verification (*parataḥ*) that invalidates Leonard's entire system.
  *   **The Work:** Nyāya explains *why* Leonard's reaction is an epistemological crime. Leonard acknowledges the validity of Teddy's claim (he admits it makes sense) but chooses to reject the *pramāṇa* because it doesn't serve his *prayojana* (purpose/goal). He explicitly decides to rig the system again (writing down Teddy's license plate as "fact" to kill him later).
  *   **Why it matters:** This proves your point. It's not that Leonard *can't* remember; it's that he *won't* audit. He chooses *bhrama* (error) because *prama* (valid knowledge) leaves him with no purpose. Nyāya clarifies that this is a voluntary suspension of epistemic validity, not just a medical symptom.

  **Where Nyāya distorts the film: The Final Monologue**
  *Context:* Leonard decides to ignore the truth and set himself up to kill Teddy, telling himself he needs to believe in a world outside his own.
  *   **Nyāya View:** This is irrational. It is the triumph of *doṣa* (defect) over *pramāṇa*. It is a failure state.
  *   **The Distortion:** Nyāya is coldly rational. It cannot account for *grief*. The film argues that Leonard *needs* the delusion to survive the guilt of what he did to his wife. If you apply Nyāya strictly, Leonard is simply wrong. But the film suggests Leonard is *tragic*.
  *   **Why it matters:** Nyāya analyzes the *structure* of his knowledge, but it cannot judge the *value* of his survival. Your friend's "unreliable memory" reading is shallow, but it allows for sympathy. A strict Nyāya reading makes Leonard a logic machine that is broken. The film is about a human being who breaks the machine on purpose. If you lean too hard on Nyāya, you lose the tragedy of the final choice.

  ### The Verdict

  **You win the argument, but with a caveat.**

  Your friend is describing the *mechanism* (memory loss). You are describing the *consequence* (epistemic isolation). Nyāya validates your position because Nyāya demonstrates that Leonard's problem isn't that he forgets; it's that he has replaced valid means of knowledge (*pramāṇa*) with a self-referential loop that mimics them.

  **The Caveat:**
  Do not claim Nyāya explains *why* Leonard does this. Nyāya explains *that* it is error. It cannot explain the grief that makes the error preferable to the truth. If you argue that Nyāya explains his *motive*, you are forcing the framework. Use Nyāya to explain the **system**, not the **soul**.

  **Summary for your friend:**
  Tell him: "If it were just about memory, the notes would work. The notes don't work because they aren't memory; they're testimony. And Nyāya says testimony from an unreliable speaker is invalid. Leonard isn't forgetting facts; he's manufacturing false authority. That's not psychology; that's epistemology."
