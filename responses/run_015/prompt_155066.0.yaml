          *   **Reasoning:** If you only vote on $A$ (Verdict), you avoid the paradox. However, your standing rules *require* $R$ and $C$ to be satisfied. A verdict-only vote might approve a protocol that violates the risk/consent standards de facto, even if de jure the vote says "Approved." It undermines the regulatory framework.

      *   **Vulnerabilities:**
