  **MEMORANDUM**

  **TO:** National Reproductive-Ethics Advisory Board (NREAB)
  **FROM:** Dr. Elena Corves, Chair, Subcommittee on Genetic Selection and Equity
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Regarding Pilot Program for Polygenic "Flourishing Indices" (Application #PGS-2023-04)

  ### I. Executive Summary

  The Subcommittee has reviewed the consortium's application to pilot a state-subsidized Preimplantation Genetic Screening (PGS) program targeting polygenic traits associated with "flourishing" (emotional resilience, cognitive flexibility, social adaptability). After deliberation, the Subcommittee recommends **Conditional Approval**.

  This decision authorizes a three-year pilot program subject to strict regulatory oversight, independent metric validation, and equity safeguards. We recognize that the technology aligns with the principle of procreative beneficence but acknowledge significant risks regarding liberal neutrality and structural coercion. The conditions imposed are designed specifically to mitigate the risk that state subsidies implicitly endorse a contested conception of the "good life."

  ### II. Ethical Analysis and Rationale

  The application rests on two pillars: **Procreative Beneficence** (the moral obligation to select the child expected to have the best life) and **Liberal Eugenics** (selection driven by private choice rather than state mandate). The consortium's safeguards—voluntary enrollment and pluralist trait-weighting menus—attempt to navigate the tension between parental autonomy and state neutrality.

  However, the Board identifies a critical ethical vulnerability. While the program is technically voluntary, the introduction of state subsidies alters the normative landscape. A subsidy is not merely financial assistance; it is a signal of state preference. By subsidizing the selection of specific polygenic traits, the state risks moving from a neutral facilitator of reproduction to an active participant in defining human excellence.

  ### III. Addressing the Strongest Objection: Neutrality and Structural Pressure

  The most compelling argument against this pilot, advanced by the dissenting bioethics coalition, is that **pluralist menus cannot genuinely preserve liberal neutrality when the institutional framework still defines and rewards "flourishing."** We treat this objection with the utmost seriousness.

  The critics argue that offering a "menu" of traits (e.g., weighting resilience higher than adaptability) creates an illusion of choice while maintaining the underlying premise that these genetic markers are valuable commodities. This objection is valid for two reasons:

  1.  **The Framing Effect:** Even if parents can weight traits differently, the mere inclusion of a trait in a subsidized "Flourishing Index" legitimizes it as a public good. This undermines liberal neutrality by embedding a specific, contestable psychological conception of the "good life" into public health infrastructure.
  2.  **Structural Coercion:** For disadvantaged parents, a subsidy is not simply an option; it is an economic imperative. If the state pays for screening that optimizes for market-valued traits (e.g., cognitive flexibility linked to economic success), parents who opt out may feel they are knowingly disadvantaging their future children. This creates a "soft mandate" where the voluntary nature of the program is eroded by economic necessity.

  **Board Position on Neutrality:** We agree with the critics that pluralist menus *alone* are insufficient to preserve neutrality. A menu created by fertility clinics, even with patient input, inevitably reflects commercial and cultural biases regarding which traits constitute "flourishing." Therefore, Conditional Approval is granted *only* on the stipulation that the definition of "flourishing" is decoupled from the subsidy mechanism. The state must not subsidize the *selection* of specific traits, but rather the *access* to information, while ensuring that information is contextualized non-directively.

  ### IV. Conditions of Approval

  To proceed, the consortium must adhere to the following mandatory conditions:

  1.  **Independent Metric Oversight:** The "Flourishing Indices" cannot be designed solely by the clinics. An independent academic ethics board must validate the polygenic scores to ensure they do not correlate strongly with specific racial or socioeconomic markers, preventing the exacerbation of existing health disparities.
  2.  **Decoupled Subsidy Structure:** State subsidies must be applied as a flat-rate grant for *counseling and screening access*, not tied to the number of embryos screened or the specific traits selected. The subsidy cannot increase if parents choose to screen for more "high-value" traits. This mitigates the financial pressure to maximize trait selection.
  3.  **Mandatory Non-Directive Counseling:** All participants must undergo three sessions of genetic counseling with a provider certified in non-directive ethics. Counselors must explicitly discuss the limitations of polygenic scores and the ethical implications of trait selection, ensuring parents understand that "flourishing" is multifactorial and not determined solely by genetics.
  4.  **Data Transparency:** All data regarding trait selection patterns must be anonymized and made available to the NREAB to monitor for emergent eugenic trends (e.g., if 95% of parents select the same trait weighting, the "voluntary" nature is compromised).

  ### V. Implementation Timeline and Review Milestones

  The pilot program is authorized for a duration of 36 months. Continuation beyond this period is not guaranteed and is contingent upon the following review milestones.

  **Phase 1: Setup and Validation (Months 1–12)**
  *   **Month 3:** Establishment of the Independent Metric Oversight Board.
  *   **Month 6:** Finalization of the decoupled subsidy structure and counselor training protocols.
  *   **Month 12 (Milestone Review 1):** **Equity and Access Audit.** The NREAB will review demographic data of initial enrollees.
      *   *Success Criterion:* Enrollment must reflect the socioeconomic diversity of the general population. If enrollment is disproportionately high-income, the subsidy structure must be recalibrated before Phase 2 begins.
      *   *Neutrality Check:* Review of counseling transcripts (sampled) to ensure non-directive standards are being met and "flourishing" is not being presented as a guaranteed outcome.

  **Phase 2: Full Pilot Operation (Months 13–36)**
  *   **Month 24:** Interim Data Release. Publication of anonymized trait-weighting choices to assess whether a "default" eugenic trend is emerging despite pluralist menus.
  *   **Month 36 (Milestone Review 2):** **Final Impact Assessment.** A comprehensive evaluation of the program's social and ethical impact.
      *   *Deliverable:* A report on whether the program has altered public perception of disability or genetic determinism.
      *   *Decision Point:* Based on this assessment, the NREAB will vote to terminate, extend, or make the program permanent.

  ### VI. Conclusion

  This decision represents a cautious engagement with emerging reproductive technologies. We acknowledge the critics' warning that state-subsidized genetic optimization risks eroding the neutral ground necessary for a pluralistic society. By approving this pilot only under conditions that rigorously separate financial access from trait endorsement, we attempt to test the viability of liberal eugenics without surrendering our commitment to justice.

  The burden of proof remains on the consortium to demonstrate that "flourishing" can be pursued without imposing a singular vision of the good life upon the vulnerable. Failure to meet the equity metrics at Month 12 will result in immediate suspension of the subsidy.

  **Recommendation:** Conditional Approval as detailed above.

  __________________________
  **Dr. Elena Corves**
  Chair, Subcommittee on Genetic Selection and Equity
  National Reproductive-Ethics Advisory Board
