answer: |-
  # METAPHYSICS SEMINAR: THE STATUE AND THE CLAY
  **Sorting Exercise:** Answer cold. Follow the arrows. Discover your position.

  ### THE DECISION TREE

  **1. THE COMPOSITION QUESTION**
  Look at the atoms arranged statue-wise. Do they compose a single object ("The Statue"), or are there only simples arranged that way?
  *   **Only Simples** → Go to **Leaf 1**
  *   **Yes, Composite** → Go to **Q2**

  **2. THE UNIVERSALITY QUESTION**
  Does composition happen for *any* arrangement of matter (e.g., a random cloud of dust), or only under special conditions?
  *   **Always (Any Arrangement)** → Go to **Leaf 2**
  *   **Only Special Conditions** → Go to **Q3**

  **3. THE RESTRICTION QUESTION**
  If special conditions are required: Must the object be alive, or is human interest/purpose enough?
  *   **Life Only** → Go to **Leaf 3**
  *   **Interest/Purpose** → Go to **Q4**

  **4. THE TEMPORAL ORIGIN QUESTION**
  Did the thing that is now a statue already exist last week when the clay was an unshaped lump?
  *   **Yes, It Existed** → Go to **Q5**
  *   **No, Created by Shaping** → Go to **Q6**

  **5. THE SURVIVAL QUESTION**
  If the artist squashes the object flat one second before finishing, does the statue survive?
  *   **Yes, Survives Flattening** → Go to **Leaf 4**
  *   **No, Destroyed by Flattening** → Go to **Q6**

  **6. THE PERSISTENCE QUESTION**
  Imagine molecule-for-molecule replacement preserving shape vs. gradual reshaping preserving matter. Does the statue survive the first, the second, both, or neither?
  *   **Same as the Clay (Both/Neither)** → Go to **Q7**
  *   **Different from the Clay (Shape only)** → Go to **Q8**

  **7. THE MODAL QUESTION**
  Could the statue have been made of ice? Could the clay? Do they have different possibilities?
  *   **Same Modal Profile** → Go to **Leaf 5**
  *   **Different Modal Profile** → Go to **Q8**

  **8. THE COUNTING QUESTION**
  At a time when both are said to be present, are there two things in one place or one thing counted in two ways?
  *   **One Thing (Counted Twice)** → Go to **Leaf 6**
  *   **Two Things (Co-located)** → Go to **Q9**

  **9. THE RELATION QUESTION**
  If two things: Is the statue a temporal part/phase of the clay, or a separate occupant of the same region?
  *   **Part/Phase of Clay** → Go to **Q10**
  *   **Separate Occupant** → Go to **Leaf 7**

  **10. THE RECASTING QUESTION**
  If the statue is melted and recast from the same matter in the same mould, is it the same statue? What if reproduced in different matter?
  *   **Same Matter = Same Statue** → Go to **Leaf 8**
  *   **Different Matter = Same Statue** → Go to **Leaf 9**
  *   **Neither (No Transitivity)** → Go to **Leaf 10**

  ---

  ### THE LEAVES (POSITIONS)

  | Leaf | Position | Slogan | Statue/Clay Relation | Least Comfortable Commitment |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Nihilism** | *Only Simples Exist* | There is no statue, only simples arranged statue-wise. | Ordinary talk of objects is systematically false. |
  | **2** | **Universalism** | *Anything Goes* | The statue is identical to the lump; composition is unrestricted. | There exists an object composed of your nose and the Moon. |
  | **3** | **Organicism** | *Life Only* | There is no statue, only a living organism (if clay were alive). | Tables and statues do not exist; only organisms do. |
  | **4** | **Perdurantism** | *Temporal Parts* | The statue is a temporal part of the clay's history. | The statue is not wholly present now, only a time-slice is. |
  | **5** | **Absolute Identity** | *Strict Monism* | The statue is strictly identical to the clay despite modal differences. | Leibniz's Law fails or modal properties are not real. |
  | **6** | **Relative Identity** | *Same F, Different G* | The statue is the same *object* as the clay but not the same *statue*. | Identity itself is fragmented relative to sortals. |
  | **7** | **Co-location** | *Two in One Place* | The statue and clay are distinct objects sharing the same space. | Two material objects can occupy the exact same region. |
  | **8** | **Constitution** | *Made Of, Not Is* | The clay constitutes the statue; they are distinct but unified. | Constitution is a primitive relation distinct from identity. |
  | **9** | **Dominant Sorts** | *One Wins* | The statue dominates the clay; only one object exists here. | It is brute fact that 'statue' wins over 'lump'. |
  | **10** | **Deflationism** | *Just Talk* | "Statue" and "Clay" are conceptual tools, not ontological commitments. | Ontology does not track the structure of the world. |
  | **11** | **Phase Sortal** | *Temporary Stage* | The statue is a temporary phase of the clay, not a new object. | Objects change their fundamental kind over time. |
  | **12** | **Pragmatism** | *Interest-Relative* | Whether the statue exists depends on our practical interests. | Reality is partially determined by human cognition. |
  | **13** | **Unnamed** | *Hybrid A* | The statue is a temporal part, but existence is interest-relative. | Combines the costs of Perdurantism and Pragmatism. |
  | **14** | **Unnamed** | *Hybrid B* | Co-location is real, but only for artifacts, not natural kinds. | An arbitrary distinction between artifact and natural ontology. |

  ---

  ### INSTRUCTOR NOTES

  **I. Unoccupied Cells (Combinatorial Gaps)**
  *   **Nihilism + Co-location:** *Incoherent.* If no composites exist, there are no two objects to co-locate.
  *   **Universalism + Dominant Sorts:** *Unattractive.* If everything exists, no sortal can dominate to exclude the lump.
  *   **Organicism + Statue Survival:** *Incoherent.* If only living things compose, the statue never exists to survive.
  *   **Absolute Identity + Different Modals:** *Incoherent.* Violates Indiscernibility of Identicals without a repair strategy.
  *   **Interest-Relative + Mind-Independent Modals:** *Unexplored.* Tension between ontology depending on us and properties not doing so.

  **II. Indistinguishable Leaves (The "Cluster" Problem)**
  *   **Constitution (8), Co-location (7), and Temporal Parts (4):** On questions 1–8, these views often yield identical answers (e.g., "Two things," "Different Modals"). They diverge *only* at **Q9 (Relation)**. Students may find "Temporal Part" and "Phase Sortal" (11) indistinguishable without further technical scaffolding regarding persistence.
  *   **Deflationism (10) and Pragmatism (12):** These converge on the idea that ontology is not robust, differing only on whether "existence" is dismissed or relativized.

  **III. Dead Branches (Cut for Final Handout)**
  *   **Q5 (Survival)** is a dead branch for **Nihilists (Leaf 1)** and **Organicists (Leaf 3)**. If the statue doesn't exist, it cannot survive squashing. *Mark this path "N/A" for those students.*
  *   **Q9 (Relation)** is a dead branch for **Absolute Identity (Leaf 5)**. If there is only one thing, there is no relation between two.
  *   **Q10 (Recasting)** is a dead branch for **Nihilists**.

  **IV. Classificatory Weight**
  *   **Most Work:** **Q1 (Composition Existence)** and **Q8 (Counting).** Q1 eliminates the entire debate for Nihilists/Organicists. Q8 is the primary fork between Monists (Identity/Relative Identity) and Pluralists (Constitution/Co-location).
  *   **Least Work:** **Q10 (Recasting).** Most positions (Constitution, Co-location, Identity) can accommodate either verdict on recasting by adjusting their criteria of diachronic identity. It refines the view but rarely determines the genus. If space is tight, cut Q10 and merge its leaves into Q9.
