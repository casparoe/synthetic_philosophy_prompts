answer: |-
  **Collaborative Statement on Laws of History**

  **1. Agreed Claims**
  1.  **Unconditional Prophecy:** Long-range, unconditional predictions of the entire course of human affairs are impossible and unjustified.
  2.  **Trends vs. Laws:** Observed historical regularities often rely on contingent initial conditions that may lapse; extrapolating a trend is not equivalent to applying a universal law.
  3.  **The Oedipus Effect:** Publishing social predictions can causally influence the outcome, rendering some forecasts self-defeating or self-fulfilling.
  4.  **Piecemeal Knowledge:** Institutional knowledge regarding specific arrangements that produce unwanted outcomes is more reliable than holistic theories of societal development.
  5.  **Scope of Knowledge Argument:** The argument from the growth of knowledge definitively undermines any prediction whose truth depends on the content of future scientific or technical knowledge.

  **2. Residual Disagreements**

  | Issue | Partner's Formulation (Regularity) | User's Formulation (Popperian) | Neutral Statement of Difference |
  | :--- | :--- | :--- | :--- |
  | **Status of Conditional Regularities** | Mechanism-relative generalisations (e.g., fiscal strain → state breakdown) are genuine laws, provided conditions hold. | These are local trends, not laws; the mechanisms themselves evolve or lapse due to human innovation. | Whether stable conditional correlations constitute "laws of history" or merely transient trends. |
  | **Ignorance-Screened Conditionals** | The clause "agents do not know this" is a standard *ceteris paribus* condition; the law remains substantive. | The screening clause does all the predictive work; it is a law about ignorance, not historical development. | **Partly Verbal:** Dispute over whether epistemic boundary conditions define the law or invalidate it. |
  | **Scope of Predictability** | Structural variables (demography, ecology) bind institutional choice enough to sustain large-scale prediction. | Institutional innovation in response to pressure is unpredictable, undermining structural forecasts. | Whether structural constraints are independent enough of knowledge growth to sustain prediction. |

  **3. Cruxes and Tests**

  | Crux | Shared Evidence / Test | User's Prediction | Partner's Prediction |
  | :--- | :--- | :--- | :--- |
  | **Ignorance-Screened Conditionals** | Formulate generalisations with antecedents including: "no relevant agent has high credence in this prediction." Test stability over time. | Forecasts will fail once knowledge spreads; reflexivity undermines the mechanism. | Forecasts will hold robustly as long as the ignorance clause is satisfied; mechanisms are stable. |
  | **Sealed-Forecast Registry** | Institution scores pre-registered conditional forecasts. Half published immediately; half sealed until outcome date. | Published scores worse (Oedipus); Sealed half barely beats chance (unpredictability). | Published scores worse (Oedipus); Sealed half beats chance significantly (underlying regularities). |
  | **Structural Constraints** | Compare cases of population pressure leading to extractive organisation vs. institutional innovation. | Innovation will vary unpredictably; pressure does not determine form. | Pressure will correlate significantly with extractive forms across varied contexts. |

  **Signatures**

  ____________________ (Popperian) ____________________ (Regularity)

  **Note on Scope:** We agree the growth of knowledge argument undermines predictions dependent on future scientific states. We disagree on whether any significant historical predictions fall outside this scope. The Sealed-Forecast Registry is designed to adjudicate this.
