answer: |-
  # Sentience Assessment Protocol (SAP-1)
  **Version:** 1.0 (Draft for Committee Use)
  **Time Allocation:** 45 minutes review + 15 minutes deliberation per petition.
  **Goal:** To determine regulatory coverage based on the *possibility* of sentience, acknowledging evidentiary limits and asymmetric error costs.

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: Define the Taxonomic Unit
  **Action:** Do not evaluate individual species unless the petition specifies a single species of high economic volume. Evaluate at the **Order** or **Family** level.
  **Rule:** If evidence exists for a Model Species within the Taxon, extrapolate to the whole Taxon *unless* there is specific evidence of neurobiological divergence in the target subgroup.
  **Stop Condition:** If the petition asks for species-level evaluation of a large genus without distinct biological justification, **Return to Sender** requesting Taxonomic consolidation.

  ### Step 2: The Reflex Filter (Nociception vs. Pain)
  **Question:** Does the organism exhibit *only* reflexive withdrawal from harmful stimuli, or is there evidence of central processing?
  **Evidence Required:**
  *   **Pass:** Simple withdrawal reflexes (e.g., tail flip in crayfish, leaf twitch in caterpillar) without behavioral modification.
  *   **Fail:** Evidence of opioid/analgesic modulation, long-term avoidance learning, or protective behavior of injured body parts.
  **Decision:**
  *   If **Only Reflexes**: **NO COVERAGE**. (Stop).
  *   If **Central Processing Indicated**: Proceed to Step 3.
  *   *Masked Judgment Alert:* We are assuming reflexes = no pain. This is unproven but operationally necessary.

  ### Step 3: The Integration Matrix (Neural vs. Behavioral)
  **Action:** Score the evidence in two columns. Do not add them up; look for convergence.
  *   **Column A (Hardware):** Presence of centralized nervous system, nociceptors, opioid receptors, or functional analogues (e.g., vertical lobe in cephalopods).
  *   **Column B (Software/Behavior):** Motivational trade-offs (e.g., enduring shock for food), injury tending, conditioned place preference/avoidance.
  **Rule:**
  *   If **Column A is Strong** and **Column B is Weak**: Proceed to Step 4 (Precautionary).
  *   If **Column A is Weak** and **Column B is Strong**: Proceed to Step 4 (Precautionary).
  *   If **Both Weak**: **NO COVERAGE**. (Stop).
  *   If **Both Strong**: **COVERAGE**. (Stop).
  *   *Masked Judgment Alert:* We are treating "Behavioral Trade-offs" as a proxy for subjective feeling. A robot could theoretically do this. We are choosing to accept this risk.

  ### Step 4: The "Unconscious Machine" Test
  **Question:** Could the observed behaviors in Step 3 be produced by a system designed purely for survival optimization without subjective experience?
  **Criteria for Passing (i.e., evidence suggests sentience):**
  1.  **Flexibility:** Behavior changes in novel environments not encountered in evolutionary history.
  2.  **Conflict:** The animal chooses a cost (pain risk) to achieve a goal (food/mating) *and* varies this choice based on internal state (hunger level).
  3.  **Recovery:** Behavior returns to baseline after analgesic administration, not just after injury healing.
  **Decision:**
  *   If **Yes, a machine could do this** (Behavior is rigid/stereotyped): **NO COVERAGE**. (Stop).
  *   If **No, this implies internal state** (Behavior is flexible/context-dependent): Proceed to Step 5.

  ### Step 5: The Asymmetric Burden of Proof
  **Action:** Apply the burden of proof based on the *direction* of the petition.
  *   **Scenario A: Adding Coverage (New Group):**
      *   **Standard:** "Reasonable Possibility." (Is there >10% chance of sentience?)
      *   **Rationale:** Cost of false negative (suffering) > Cost of false positive (regulation).
      *   **Decision:** If Step 4 passed, **GRANT COVERAGE**.
  *   **Scenario B: Removing Coverage (Existing Group):**
      *   **Standard:** "Consensus on Absence." (Is there >90% certainty of *non*-sentience?)
      *   **Rationale:** Regulatory stability and precautionary lock-in.
      *   **Decision:** Unless new evidence proves *incapacity* for sentience, **DENY DEREGULATION**.
  *   **Scenario C: High Volume / Low Evidence (e.g., Insects):**
      *   **Modifier:** If the number of individuals is >1 million/year, lower the probability threshold for Scenario A.
      *   **Rationale:** Scale of potential suffering amplifies the precautionary obligation.

  ### Step 6: The Value Handoff (Mandatory Declaration)
  **Action:** Before voting, the Committee Chair must read the following statement if the decision relies on Step 5 (Precautionary) rather than Step 3 (Strong Evidence).
  **Statement:** *"The scientific evidence for sentience in this taxon is [Insufficient/Ambiguous]. However, under the Agency's statutory precautionary mandate and the asymmetric cost of error, we are recommending coverage as a policy choice, not a scientific finding. This imposes economic costs to mitigate moral risk."*
  **Decision:** Record this distinction in the published minutes. This is the point where Science stops and Policy begins.

  ### Step 7: Sunset and Review
  **Action:** Any coverage granted under Step 5 (Precautionary) must have a **3-Year Review Clause**.
  **Requirement:** Industry or Welfare bodies must submit new data by Year 3. If no new data is submitted, coverage remains by default (Status Quo Bias).

  ---

  ## Part 2: Masked Judgments (Honesty Check)
  *These are the points where the procedure pretends to be objective but is actually making a value choice.*

  1.  **The Trade-Off Proxy (Step 3 & 4):** We assume that an animal making a trade-off (pain vs. food) is *feeling* the pain. It is possible they are simply weighing variables unconsciously. We accept this error to avoid missing sentience.
  2.  **The Taxonomic Grain (Step 1):** We assume all crabs are alike. They are not. We do this because we lack the resources to test every species. This is an administrative convenience, not a biological fact.
  3.  **The Precautionary Threshold (Step 5):** Deciding that a 10% chance of sentience warrants 100% of the regulatory burden is a moral calculation, not a scientific one. We are effectively taxing producers to buy moral insurance.
  4.  **The Deregulation Lock (Step 5):** Making it harder to remove coverage than to add it creates a "ratchet effect." This protects animals but creates regulatory bloat. This is a political choice embedded in the science protocol.

  ---

  ## Part 3: Application to Live Files

  ### File 1: Decapod Crustaceans (Crabs, Lobsters, Prawns)
  **Petition:** Extend stunning/transport rules (Welfare Coalition).
  **Evidence:**
  *   *Neural:* Complex ganglia, opioid receptors present. (Column A: Strong)
  *   *Behavior:* Rubbing injured claws, avoiding electrified shelters even with food present, trade-offs vary by hunger. (Column B: Strong)
  *   *Machine Test:* Behavior is flexible and context-dependent. (Passes Step 4).
  **Procedure Run:**
  1.  **Taxonomy:** Order Decapoda.
  2.  **Reflex:** Exceeds simple reflex (injury tending observed).
  3.  **Integration:** Strong/Strong convergence.
  4.  **Burden:** Adding Coverage. Standard: Reasonable Possibility. Met.
  **Decision:** **GRANT COVERAGE.**
  **Stop Point:** Step 3 (Strong Evidence).
  **Notes:** This is scientifically robust. The inconvenience is economic (retrofitting tanks/knives), but the procedure does not weigh economic cost against welfare in Step 3. That is a Step 6 Value Handoff issue.

  ### File 2: Farmed Insects (Black Soldier Fly, House Cricket)
  **Petition:** Extend rules to industrial insect farming (Welfare Coalition).
  **Evidence:**
  *   *Neural:* Ganglia present, but highly distributed. Opioid systems debated/unclear. (Column A: Weak/Ambiguous).
  *   *Behavior:* Nociception clear. Motivational trade-offs (e.g., crickets avoiding heat) exist but are less flexible than vertebrates. Some studies show grooming of injured limbs, others do not. (Column B: Ambiguous).
  *   *Machine Test:* Behaviors *could* be automated reflexes, but some trade-off data suggests internal state modulation. (Borderline Pass).
  *   *Scale:* Billions of individuals annually.
  **Procedure Run:**
  1.  **Taxonomy:** Order Orthoptera / Diptera.
  2.  **Reflex:** Exceeds simple reflex (some trade-off data).
  3.  **Integration:** Weak/Ambiguous. Usually, this would trigger **NO COVERAGE**.
  4.  **Machine Test:** Borderline.
  5.  **Burden:** Adding Coverage. *However*, apply **Scenario C (High Volume Modifier)**. The scale of potential suffering (billions) lowers the evidence threshold required for precaution.
  6.  **Value Handoff:** Evidence is insufficient for scientific certainty.
  **Decision:** **GRANT COVERAGE (Provisional).**
  **Stop Point:** Step 5 (Asymmetric Burden / Scale Modifier).
  **Why this is inconvenient:** You are regulating a massive industry based on *ambiguous* science because the numbers are too high to ignore. This invites legal challenge on "arbitrary and capricious" grounds because the scientific link is weak. You must publish the Step 6 declaration admitting the science is thin.
  **Requirement:** Trigger Step 7 (3-Year Review). Industry must fund sentience research or lose exemption later.

  ### File 3: Fish Deregulation (Commercial Fishing Association)
  **Petition:** Remove fish from coverage (Industry).
  **Argument:** Fish lack mammalian neocortex/pallium structures; responses are reflexive.
  **Evidence:**
  *   *Neural:* Lack neocortex, but have pallial structures functioning analogously. Opioid receptors confirmed. (Column A: Strong, despite structural difference).
  *   *Behavior:* Learned avoidance, analgesic seeking, long-term behavioral changes after painful events. (Column B: Strong).
  *   *Machine Test:* Behaviors too flexible for simple reflex models. (Passes Step 4).
  **Procedure Run:**
  1.  **Taxonomy:** Superclass Pisces (broad, but petition is general).
  2.  **Reflex:** Exceeds reflex.
  3.  **Integration:** Strong/Strong.
  4.  **Burden:** **Removing Coverage (Scenario B).**
  5.  **Standard:** "Consensus on Absence."
  **Decision:** **DENY DEREGULATION.**
  **Stop Point:** Step 5 (Asymmetric Burden).
  **Why:** Even if the neural argument had merit (it doesn't, per current consensus), the burden of proof for *removal* is >90% certainty of non-sentience. The evidence shows *possibility* of sentience. Therefore, status quo remains.
  **Notes:** This protects the agency from reversing course without overwhelming new data. It is inconvenient for the fishing lobby, but the procedure makes the rejection automatic based on the burden of proof, shielding the committee from accusations of bias.

  ---

  ## Part 4: What This Procedure Cannot Do

  **1. It cannot solve the "Hard Problem" of Consciousness.**
  This protocol infers sentience from inputs and outputs. It cannot verify the internal light is on. It explicitly admits this in Step 6. If a philosopher challenges the committee on whether "trade-offs" equal "feeling," the correct answer is: *"We know it cannot. We regulate based on the risk that it does."*

  **2. It cannot balance Economic Cost against Moral Weight.**
  Step 5 prioritizes the avoidance of suffering over economic cost (Asymmetric Burden). If the cost of regulating insects bankrupts the industry, this procedure does not have a "Stop" for that. That decision belongs to the Minister/Secretary, not the Scientific Committee. Your published reasons must make this clear: *"We identify the risk; Policy decides the affordability."*

  **3. It cannot handle "Marginal Sentience."**
  The procedure is binary (Cover/No Cover). It cannot mandate "Half-Stunning." If an animal is 20% likely to be sentient, it gets the same protection as one 90% likely, because the regulation is a safeguard, not a measurement.

  **4. It cannot prevent Regulatory Ratchet.**
  Because Step 5 makes removal harder than addition, the list of protected animals will only grow. This is a feature for welfare, but a bug for administrative efficiency. The procedure acknowledges this but offers no fix other than the 3-Year Review (Step 7), which maintains coverage by default if data is missing.

  **5. It cannot resolve Taxonomic Disputes.**
  If a new phylogeny splits "Decapods" into two clades with different neural capacities, Step 1 forces you to pick a level. You will inevitably be wrong at the species level. You must accept that regulation is a blunt instrument applied to a biological continuum.

  ### Final Instruction to Committee
  When publishing reasons for File 2 (Insects), do not write *"Insects feel pain."*
  Write: *"Evidence for pain processing is ambiguous, but the scale of usage triggers the precautionary mandate."*
  This protects the agency from being proven wrong by future science, while maintaining the protection.
