  ### The Why (R's Underlying Rules)
  R is running a strict three-filter heuristic for the Strategy-Stealing Argument. For the argument to "run" (i.e., yield a verdict of "P1 Win" or "P2 Can't Win"), a game must pass all three:

  1.  **Symmetry:** Both players must have identical winning conditions and board access. (Failed by *Handicap Hex*).
  2.  **Monotonicity (The "Free Gift" Axiom):** Having an extra piece or move on the board must never be a disadvantage. It must be either helpful or neutral. (Failed by *Chess* and *Misère Nim*).
  3.  **Draw Possibility:** This determines the *output* of the argument, not its applicability.
      *   If Draws are **Impossible** + SSA runs $\rightarrow$ "First Player Wins." (*Hex, Chomp*)
