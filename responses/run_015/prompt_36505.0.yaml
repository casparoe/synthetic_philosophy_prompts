      *(Self-Correction on the Symmetry Argument)*: I should point out that the symmetry argument actually undermines the "noise" argument. If the probability is just noise, you don't need symmetry to cancel it. If you need symmetry to cancel it, then the probability wasn't just noise. There's a tension there. I'll mention that.

