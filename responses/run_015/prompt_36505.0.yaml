          2.  Addressing Question (a) (Reasoning breaks).
          3.  Addressing Question (b) (Middle paragraph substance).
          4.  Addressing the Side Question (Symmetry/Cheap Trick).
          5.  Specific suggestions for revision (without rewriting).

  7.  **Refining the Critique (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't use too much jargon. Keep it accessible.
      *   *Nuance:* The "noise" argument is actually a version of the "Leverage Penalty" or "Complexity Penalty" arguments found in professional literature (like Robin Hanson or Eliezer Yudkowsky). I should hint that this is a sophisticated intuition without name-dropping too much to avoid overwhelming them.
      *   *Symmetry:* I need to explain *why* it's weak clearly. It violates the principle of acting on available evidence.

  8.  **Final Polish:** Check against the prompt constraints. (Don't rewrite. Give feedback like a teacher. Answer specific questions.)

