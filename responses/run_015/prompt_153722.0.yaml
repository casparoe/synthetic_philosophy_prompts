prompt: |-
  I'm prepping a session for tuesday — my philosophy of mind reading group, mostly gradute students from psych and litreture, one hour, whiteboard only. I want them to understand tranquilism: specifically that only the absence of craving and suffering has value, and positive goods like pleasure or achievement are at best instrumental to that absence. Plan the teaching arc for me, not the explanation itself. First, the dependency order: what idea has to land first so they don't just hear "happiness is bad" and check out? Second, the carrying example: I was going to use the "perfectly satisfied monk" but I worry it sounds like a religious stereotype and they'll dismiss it. What's a concrete secular case that shows absence-as-good without looking like depression or asceticism? It needs to lack any hint of reward, but also not feel like suffering. Third, the misconception map: I know they'll conflate this with negative utilitarianism right away, and then later they'll think "no craving" means total motivational paralysis. At exactly which point in the sequence should I head off each? Fourth, I want to weave in my own twist — that on this view the self isn't a container that holds goods or ills, it's just the site where absence happens. How do I build that in without breaking the main arc? Fifth, what's a good end check — maybe ask them to evaluate a case where someone takes on mild suffering to prevent worse suffering in a stranger — and how do I tell whether they've actually grasped the view rather than just reciting it? Finally, be explicit about what I'm refusing to cover: I don't want to get into meta-ethical grounding of value, or do a full comparison with Aristotelian eudaimonism, and I definately shouldn't ask them to read anything beforehand since they won't. Just flag what's left out.
