answer: |-
  Here is the teaching arc design for your one-hour session. It is structured to answer your specific design constraints first, followed by a minute-by-minute "Run of Show" that implements them.

  ### Part 1: Design Logic (Addressing Your Constraints)

  **1. Dependency Order (The "Landing" Sequence)**
  Do not start with the claim "Pleasure has no value." That triggers immediate defensiveness.
  *   **Step 1: Phenomenology of Relief.** Establish that *relief* is universally recognized as valuable.
  *   **Step 2: The Asymmetry.** Show that relief (removal of bad) feels fundamentally different from addition (adding good).
  *   **Step 3: The Axiological Claim.** Argue that *only* the relief side carries intrinsic weight; the addition side is only useful insofar as it prevents future relief-needs.
  *   **Why:** You move from shared experience $\rightarrow$ structural observation $\rightarrow$ normative claim.

  **2. The Carrying Example (Secular & Non-Depressive)**
  Avoid the monk. Avoid "numbness." You need an example of *active neutrality*.
  *   **The Example:** **"The Unfinished Sentence" (Narrative Tension).**
  *   **The Setup:** Ask them to recall reading a gripping novel or watching a film where a plot thread is left dangling. There is a specific cognitive tension (a "craving" for resolution).
  *   **The Resolution:** When the plot resolves, the value isn't a spike of "joy" (hedonia); it is the *cessation of the tension*.
  *   **Why it works:** It appeals to Lit (narrative closure) and Psych (cognitive dissonance reduction). It is secular. It is not depression (the mind was active); it is not asceticism (you engaged with the art); but the *good* was the removal of the itch, not the addition of a reward.

  **3. Misconception Map (Timing the Defusions)**
  *   **Negative Utilitarianism (NU):** Address this **immediately after** defining the axiology (Minute 25). Students will ask, "So we just minimize global suffering?" You must clarify: Tranquilism is a theory of *what is good*, NU is a theory of *what to do*. Tranquilism can be agent-relative.
  *   **Motivational Paralysis:** Address this **after** the NU distinction (Minute 35). Once they think "nothing matters," explain *Instrumentality*. We eat not because hunger is "bad" and food is "good," but because hunger is a craving and eating removes the craving. Action is preserved, but the *telos* changes.

  **4. Integrating the "Self as Site" Twist**
  *   **Placement:** The Climax (Minute 45).
  *   **Method:** Whiteboard Visualization.
  *   **Execution:** Draw a **Bucket** (Hedonism: Self holds units of pleasure/pain). Draw a **Room** (Tranquilism: Self is the space where noise happens).
  *   **Integration:** Explain that if the Self is a Room, you cannot "fill" it with value. You can only clear it. This explains *why* accumulation fails. It turns the axiology into an ontology without requiring a metaphysics lecture.

  **5. The End Check (Assessment)**
  *   **The Case:** **"The Empathic Doctor."** A doctor works a double shift (mild suffering/fatigue) to save a patient from death (major suffering).
  *   **The Trap:** If they say, "This maximizes net global welfare," they are doing Negative Utilitarianism (which you excluded).
  *   **The Target Answer:** "The doctor experiences a *craving* for the patient's safety. The patient's potential death is a source of distress/craving for the doctor. Working the shift removes the doctor's own distress about the outcome."
  *   **Assessment Metric:** Listen for **Agent-Relative Craving Removal** vs. **Agent-Neutral Suffering Calculation**. If they focus on the doctor's internal state of "distress about the patient," they grasp Tranquilism.

  **6. Explicit Exclusions (Boundary Setting)**
  *   **Meta-ethics:** We are not arguing *why* absence is valuable (evolution? logic?), only *that* it fits the phenomenology.
  *   **Aristotle/Eudaimonism:** No comparison to "flourishing." Flourishing implies growth/addition; Tranquilism implies subtraction. Keep them separate.
  *   **Pre-reading:** None. All concepts must be generated in the room via the whiteboard.

  ***

  ### Part 2: The Run of Show (60 Minutes)

  **00:00 – 05:00 | Warm-up: The Phenomenology of Relief**
  *   **Whiteboard:** Write "VALUE = ?"
  *   **Action:** Ask the room: "Describe the exact moment a high fever breaks. Or a loud noise stops."
  *   **Goal:** Get them to describe the *absence* of the negative, not the presence of a positive.
  *   **Key Phrase:** "Is the value in the silence, or in a sound added to the silence?"

  **05:00 – 15:00 | The Carrying Example: Narrative Tension**
  *   **Whiteboard:** Draw a sine wave (Tension) flattening to a line (Resolution).
  *   **Action:** Deploy **"The Unfinished Sentence."**
      *   *Psych angle:* Cognitive dissonance/Zeigarnik effect.
      *   *Lit angle:* Hermeneutic code / Closure.
  *   **Argument:** The "good" of the ending is strictly the removal of the tension of the middle. If you didn't feel the tension, the resolution has no value.
  *   **Transition:** "If the value of the resolution is just the end of the tension, is pleasure anything more than the end of a craving?"

  **15:00 – 25:00 | The Core Claim: Tranquilism Defined**
  *   **Whiteboard:** Write: **Intrinsic Value = Absence of Craving/Suffering.**
  *   **Contrast:** Write: **Instrumental Value = Pleasure/Achievement.**
  *   **Explanation:** Pleasure is a tool. It is a "distraction" or a "soother" that temporarily halts craving. It has no weight on its own.
  *   **Check:** Ask: "Does this mean life is just managing deficits?" (Let them sit with the discomfort).

  **25:00 – 35:00 | Misconception Intercept 1: Negative Utilitarianism**
  *   **Trigger:** Someone will ask, "So we should just euthanize everyone to minimize suffering?"
  *   **Intervention:** Distinguish **Axiology** (What is good?) from **Ethics** (What should I do?).
  *   **Whiteboard:** Draw a line between "My Experience" and "Global Policy."
  *   **Point:** Tranquilism describes the *structure of value*. It does not mandate global minimization strategies. You can value absence without being a Negative Utilitarian activist.

  **35:00 – 45:00 | Misconception Intercept 2: Paralysis & The Twist**
  *   **Trigger:** "Why get out of bed if achievement isn't good?"
  *   **Intervention:** Instrumentality. We get out of bed to stop the craving of hunger/boredom.
  *   **The Twist (Self as Site):**
      *   **Whiteboard:** Draw the **Bucket** (filling up with goods). Cross it out.
      *   **Whiteboard:** Draw the **Room** (fog clearing).
      *   **Explanation:** "You are not a container waiting to be filled. You are the space where the noise stops. Achievement doesn't 'add' to you; it quiets the demand for achievement."
      *   **Lit/Psych Bridge:** For Lit: The text doesn't 'add' meaning, it resolves ambiguity. For Psych: Homeostasis isn't 'growth,' it's equilibrium.

  **45:00 – 55:00 | The End Check: The Empathic Doctor**
  *   **Action:** Present the case (Doctor works double shift to save patient).
  *   **Task:** "Analyze this action *strictly* through Tranquilism. Where is the value located?"
  *   **Facilitation:**
      *   If they say "Patient's life is saved (Good)": Push back. "Is 'life' a positive good, or just the absence of death-suffering?"
      *   If they say "Global suffering down": Push back. "That's NU. Where is the *agent's* value?"
      *   **Target:** "The doctor avoids the suffering of *witnessing* the death." The value is the quieting of the doctor's empathetic distress.

  **55:00 – 60:00 | Cool Down & Boundary Flag**
  *   **Summary:** Reiterate: Absence is the terminal value; Positives are tools; Self is the site of absence.
  *   **Explicit Exclusions (Verbal):** "Today we did not ask *why* absence is valuable (meta-ethics), nor did we compare this to 'flourishing' (Aristotle). We stayed strictly within the phenomenology of craving and relief."
  *   **Closing:** "Next week, bring a text or case where 'happiness' seems suspicious."

  ### Whiteboard Layout Plan
  *   **Left Panel:** Phenomenology (Relief vs. Addition).
  *   **Center Panel:** The Definition (Intrinsic vs. Instrumental) + The Twist (Bucket vs. Room).
  *   **Right Panel:** The Case Study (Doctor) + Misconception Notes (NU vs. Paralysis).

  ### Instructor Notes for Delivery
  *   **Tone:** Keep it clinical. If you sound like a guru, the Psych students will reject it. If you sound too analytic, the Lit students will disengage. Use the "Narrative Tension" example to bridge them.
  *   **Pacing:** If you run long on the "Monk/Ascetic" worry, cut the Meta-ethics disclaimer short. The "Self as Site" twist is the most important conceptual hook; do not sacrifice time there.
  *   **Resistance:** If a student insists pleasure *is* intrinsic, concede the point phenomenologically ("It feels like addition") but challenge it structurally ("Does it last without a preceding need?").
