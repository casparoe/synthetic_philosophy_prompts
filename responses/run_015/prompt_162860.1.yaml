answer: |-
  There is no single, universally standardized term in the philosophy of history that captures *exactly* the methodological asymmetry you describe, though the logical mechanism underpinning it is well-established in analytic metaphysics and causal modeling. The phenomenon you have identified is a specific historiographical manifestation of **Contrastive Causation** (specifically, the selection of the **Contrast Class**) combined with **Variable Granularity** in interventionist accounts.

  However, because the literature typically treats this as a general feature of counterfactuals rather than a specific *systematic divergence* between structuralist and agentic explanations, you are justified in treating it as a distinct problem for your seminar.

  Here is the breakdown of the existing concepts, why they are near-misses, and a proposal for a precise term to label the pattern itself.

  ### 1. The Established Logical Mechanism: Contrastive Causation
  The logical engine driving the "flip" you observe is **Contrastive Causation**. Developed by philosophers such as Jonathan Schaffer and Christopher Hitchcock, this view holds that causation is not a binary relation ($C$ causes $E$) but a quaternary one ($C$ rather than $C^*$ causes $E$ rather than $E^*$).

  *   **The Structuralist Contrast:** They evaluate the claim "Hitler caused the Nazi Regime" against the contrast class $C^*$ = "Some other fascist demagogue." Since $E$ (Nazi Regime) remains stable across $C$ and $C^*$, they conclude causation is weak or non-existent.
  *   **The Great Man Contrast:** They evaluate the same claim against the contrast class $C^*$ = "No leader" or "A conventional conservative leader." Since $E$ varies significantly between $C$ and $C^*$, they conclude causation is strong.

  **Why this is not quite enough:**
  While "Contrastive Causation" names the *logic*, it does not name the *historiographical pattern* you observed. In metaphysics, the choice of contrast is often context-dependent or pragmatic. In your seminar, you are noting that the two camps are **methodologically consistent** in their selection of the contrast. Structuralists *reliably* choose contrasts that hold the structural slot fixed; Great Man theorists *reliably* choose contrasts that hold the individual's unique traits fixed. "Contrastive Causation" explains how the verdict flips, but not why the two camps systematically choose different switches to flip.

  ### 2. The Nearest Neighbor: Causal Field Selection (J.L. Mackie)
  J.L. Mackie's concept of the **Causal Field** is the closest historical predecessor. Mackie argued that we identify causes relative to a "field" of background conditions we agree to hold constant. A cause is a difference *within* a field.

  *   **Your Observation:** The Structuralist defines the field to include "the existence of a fascist movement" (holding the slot fixed). The Great Man theorist defines the field to include "the specific psychological makeup of the leadership" (holding the person fixed).
  *   **The Distinction:** Mackie's "Causal Field" is usually used to distinguish between *conditions* (oxygen) and *causes* (spark). Your case is more specific: it is a dispute over the **granularity of the cause variable itself** (Token vs. Type).

  ### 3. The Proposed Term: Counterfactual Fixity Asymmetry
  Since no existing term captures the *systematic methodological divergence* regarding what is held invariant during the counterfactual intervention, I propose you label this **Counterfactual Fixity Asymmetry**.

  **Definition:**
  *Counterfactual Fixity Asymmetry* is a methodological dispute in historical explanation wherein competing accounts agree on the actual sequence of events but diverge on causal verdicts due to inconsistent commitments regarding which background variables must remain invariant when intervening on an agent.
  *   **Structuralist Fixity:** Holds macro-variables (economic conditions, institutional slots, social tensions) invariant; allows micro-variables (individual identity, specific rhetoric) to vary.
  *   **Agentic Fixity:** Holds micro-variables (individual psychology, specific decisions) invariant as the locus of intervention; allows macro-variables (movement cohesion, electoral success) to covary with the removal of the agent.

  **Boundary Cases (What to Exclude):**
  1.  **Ordinary Overdetermination:** Exclude cases where two *actual* sufficient causes exist (e.g., two assassins firing simultaneously). Fixity Asymmetry concerns a *single* causal slot and how it is defined in the counterfactual, not multiple actual causes.
  2.  **General Counterfactual Vagueness:** Exclude cases where the disagreement stems from uncertainty about what *would* happen (e.g., "We don't know if the Vice President would have voted the same way"). Fixity Asymmetry applies even when both sides agree on the downstream mechanics but disagree on what counts as a valid removal of the cause.
  3.  **Underdetermination by Evidence:** Exclude cases where new archival evidence could resolve the dispute. Fixity Asymmetry is resilient to new evidence because it is a disagreement about the *question*, not the *answer*.

  ### 4. Why "Similarity Metric" Was Insufficient
  Your colleague's suggestion (Lewisian similarity metrics) was technically correct but explanatorily thin. Saying "they use different similarity metrics" is like saying "they use different rulers." It describes the tool but not the *bias* in how the tool is applied. **Counterfactual Fixity Asymmetry** captures the *direction* of the bias: one side prioritizes structural invariance, the other prioritizes agentic invariance.

