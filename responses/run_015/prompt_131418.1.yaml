      *   *Morality:* Consequentialist/Structuralist. Morality emerges from the structure of incentives, not internal virtue.
      *   *Harm:* Sanctions are instrumental tools to maintain equilibrium. There's no deontological distinction between "letting harm happen" (by not punishing) and "causing harm" (by punishing), provided the net outcome is cooperation.
