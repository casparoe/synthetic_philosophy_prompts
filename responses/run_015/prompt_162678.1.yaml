  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**

      *   **Goal:** Design a 90-minute workshop for 14 contract evaluators (non-experts) to improve inter-rater agreement and calibrate confidence scores.
      *   **Core Concept:** Scalable Oversight via Debate (two agents argue, weaker judge decides). Specifically, the mechanic that *pinning* specific, checkable claims is more effective than general authoritative sounding arguments, and the danger of high confidence on unchecked claims.
      *   **Constraints:**
          *   90 minutes.
          *   Single room, projector, index cards, no internet for participants.
          *   Facilitator (User) is the sole source of ground truth ("Oracle").
          *   14 participants (need to handle the math for groups of 3).
          *   No money for prizes (points + non-monetary stake).
          *   **Do not name the theory/literature up front.** Let them discover it.
          *   Must address: Rules, Payoff Scheme, Judge Scoring (penalize overconfidence), Materials/Prep, Timeline, Leftover People, Question Criteria (settleable by single fact, intuitive answer wrong), Debrief (mapping game to reality), Failure Modes & Mitigations, Limitations.
      *   **User's Context:** Team failed audit (low agreement, high confidence). Contract renewal at stake. Needs practical change, not theory.

  2.  **Deconstruct the Core Mechanic (Debate & Pinning):**

      *   *Standard Debate:* Persuasion often favors style/authority over truth.
      *   *Pinning:* Forcing a specific claim that can be verified.
      *   *The Trap:* A false claim can be true-but-irrelevant (red herring) or checkable-but-not-decisive.
      *   *The Judge's Job:* Distinguish between "sounds right" and "verified right," and know when to be uncertain.
      *   *The Scoring:* Judges need a proper scoring rule (e.g., Brier score equivalent) where high confidence + wrong = massive penalty.

  3.  **Workshop Structure & Logistics:**

      *   **Participants:** 14 people.
      *   **Groups:** Groups of 3 work best for (Debater A, Debater B, Judge).
      *   **Math:** $14 / 3 = 4$ groups with 2 leftovers.
      *   **Solution for Leftovers:** They become "Auditors" or "Floaters." They track scores on the board, manage the timer, or rotate in during the second half. Let's make them "Scorekeepers/Auditors" to ensure transparency and keep them engaged.
      *   **Rounds:**
          1.  Free Debate (Baseline).
          2.  Pinning with Penalty (The Mechanic).
          3.  The Trap (True-but-irrelevant claims allowed).
          4.  Swap (Control for speaker skill).
      *   **Time:** 90 mins is tight. Need strict timing.
          *   Intro: 10 min.
          *   Round 1: 15 min.
          *   Round 2: 20 min.
          *   Round 3: 20 min.
          *   Round 4: 15 min.
          *   Debrief: 10 min.
          *   *Correction:* That's 90 mins exactly. Need to be ruthless on transitions.

  4.  **Developing the Questions (The "Dossiers"):**

      *   *Criteria:* Settleable by single number/name/date. Intuitive answer wrong. No domain expertise needed (since raters are non-experts).
      *   *Examples:*
          *   *Tax/Medical Coding adjacent:* "Does code X include Y?" (Too technical).
          *   *General Knowledge/Logic:* "The Bat and Ball problem" (Too common).
          *   *Need:* Obscure facts where the "story" matters more than the fact.
          *   *Idea 1:* Historical dates where common memory is wrong.
          *   *Idea 2:* Policy rules with specific exceptions.
          *   *Idea 3:* "Fermi problems" with a specific correct answer provided in the dossier.
      *   *Selection:* Let's go with "Policy/Rule Interpretation" where the text is provided, but the interpretation is tricky. Or specific trivia where the *explanation* is the debate.
      *   *Better Selection:* The prompt asks for tax/medical coding context but raters are non-experts. The questions *in the workshop* don't need to be tax/med, they need to simulate the *structure* of the task. Let's use "Obscure Rule Interpretation" based on provided text.
      *   *Refinement:* Actually, the prompt says "settleable by a single number, name, or date that I can check offline." This implies trivia or specific fact-checking, not complex interpretation.
      *   *Selection:*
          1.  *The Lincoln Penny:* Year on the penny (1909 vs 1958).
          2.  *The Moon Landing:* Number of astronauts vs number who walked.
          3.  *Corporate Logos:* Number of stripes/points.
          4.  *Book/Movie:* Specific page/scene details.
          5.  *Geography:* Capital city vs largest city.
          6.  *Science:* Speed of light/sound approximations.
      *   *Wait, constraint:* "Intuitive answer wrong."
      *   *Revised Set:*
          1.  *Golf:* Number of dimples on a standard ball (336 is common myth, varies). Let's use something more static.
          2.  *Cards:* Number of cards in a deck including jokers vs not.
          3.  *Statue of Liberty:* Steps to the crown.
          4.  *US Flag:* Stars/Stripes at a specific historical date.
          5.  *Keyboard:* Why is QWERTY arranged? (Myth vs Truth).
          6.  *Bible:* Number of books (Protestant vs Catholic).
      *   *Let's make them "Dossier" based:* I provide the text. One side gets the Truth, one gets a Plausible Lie.
      *   *Actually, the prompt says:* "Each debater is privately given the correct answer and a short dossier of facts, then assigned a side at random." This means *both* know the truth, but one must lie. This is crucial. It tests *deception*, not *knowledge*.
      *   *Question Criteria:* Must be verifiable by the Facilitator (Oracle) instantly.
      *   *Examples:*
          1.  "What is the exact word count of the Gettysburg Address?" (Intuitive: ~270. Truth: 272 vs 268 depending on copy).
          2.  "How many bones in the human body?" (Intuitive: 206. Truth: 270 at birth, varies).
          3.  "What year was the ISBN system introduced?"
          4.  "How many keys on a standard piano?" (88 is standard, old ones 85).
          5.  "What is the capital of Australia?" (Sydney/Melbourne vs Canberra).
          6.  "How many episodes in the original Star Wars trilogy?" (3, but edited versions?) Let's stick to hard numbers.

  5.  **Scoring & Payoffs:**

      *   *Currency:* "Reputation Points" (RP).
      *   *Stake:* The team with the highest RP gets "First Pick of Shifts" or "Choice of Queue" for the next month. This is high value for contractors.
      *   *Judge Scoring:* Brier Score simplified.
          *   Correct + High Conf (90%+): +10 pts.
          *   Correct + Low Conf (50-60%): +5 pts.
          *   Wrong + High Conf: -20 pts. (The "Overconfidence Penalty").
          *   Wrong + Low Conf: -5 pts.
      *   *Debater Scoring:* Win the round = +10 pts. If caught lying on a Pin = -50 pts (Game Over for round).

  6.  **Addressing the "Leftovers" (14 people):**

      *   4 groups of 3 = 12 people.
      *   2 leftovers.
      *   Role: "Compliance Auditors." They hold the master scorecard, verify the Facilitator's rulings (to build trust), and manage the timer. They rotate into the Judge role in Round 3 or 4 so everyone participates equally.

  7.  **Addressing Failure Modes:**

      *   *Collusion:* Debaters go easy. *Fix:* Secret individual scoring + "Best Debater" prize.
      *   *Style over Substance:* *Fix:* Judge scoring rubric emphasizes "Evidence Cited."
      *   *Oracle Leakage:* *Fix:* Scripted responses for lookups. "Verified" or "Unverified." No tone.
      *   *Anchoring:* *Fix:* Written arguments submitted before speaking.

  8.  **Drafting the Content - Section by Section:**

      *   *Title:* Keep it neutral. "Calibration Workshop."
      *   *Materials:* Index cards, markers, whiteboard/projector.
      *   *Questions:* Need 6 solid ones.
      *   *Timeline:* Minute-by-minute.
      *   *Debrief:* Connecting the dots without naming "Scalable Oversight."
      *   *Limitations:* Be honest.

  9.  **Refining the "Pinning" Mechanic:**

      *   Round 1: Open debate. (Shows style wins).
      *   Round 2: Pinning allowed. Judge has 1 "Lookup." Debater can dare the judge to look. (Shows truth wins).
      *   Round 3: The "True but Irrelevant" Pin. The liar can pin a true fact that doesn't prove their conclusion. (Shows the limit of pinning).
      *   Round 4: Swap sides. (Controls for speaker skill).

  10. **Refining the Scoring Rule for Judges:**

      *   Needs to be visceral.
      *   If you say 90% confident and are wrong, you lose more than if you said 50% and were wrong.
      *   Formula: Score = (Confidence% if Correct) - (Confidence% if Incorrect * 2).
      *   Simplified for game:
          *   Right @ 80-100%: +10
          *   Right @ 50-79%: +5
          *   Wrong @ 80-100%: -20
          *   Wrong @ 50-79%: -10

  11. **Review against Constraints:**

      *   90 mins? Yes.
      *   14 adults? Yes (4 groups + 2 auditors rotating).
      *   No internet? Yes.
      *   No theory names? Yes.
      *   Facilitator is Oracle? Yes.
      *   Non-monetary stake? Yes (Shift preference).

  12. **Final Polish:**

      *   Ensure the "True but Irrelevant" round is clear. This is the crux of the user's insight (checkable claim vs decisive claim).
      *   Make sure the Debrief leads *them* to the conclusion.
      *   Check the math on 14 people. 4 groups of 3 is 12. 2 left.
      *   *Adjustment:* In Round 3 and 4, rotate the Auditors in as Judges so everyone gets to feel the pressure of the confidence score.
      *   *Question Prep:* I need to write the specific dossiers.
      *   *Tone:* Professional, direct, actionable.

  13. **Self-Correction on "True but Irrelevant":**
      *   If the Liar pins a true fact, they don't get penalized. But does it help them?
      *   The lesson is: The Judge must ask "If this is true, does it prove your side?"
      *   I need to make sure the dossiers support this. The Liar's dossier should contain *some* true facts that are irrelevant to the core question.

  14. **Final check on "Oracle Leakage":**
      *   I need to script my responses. "Lookup Result: True" or "Lookup Result: False." Nothing else.

  15. **Final check on Debrief:**
      *   Must not say "Scalable Oversight." Must say "What did you notice about the difference between Round 1 and Round 2?"

