answer: |-
  # Workshop Design: "The Verification Game"

  **Objective:** Calibrate rater confidence and shift focus from "authoritative tone" to "verifiable claims."
  **Duration:** 90 Minutes.
  **Participants:** 14 Evaluators.
  **Materials:** Projector (for timer/scores), Whiteboard, Index Cards (3 colors), Markers, Printed Dossiers (sealed envelopes).
  **Stake:** The team with the highest aggregate score wins **Priority Queue Selection** for the next month (choice of shift times or project queues).

  ---

  ## 1. The Scoring & Payoff Scheme

  **Currency:** "Calibration Points" (CP).
  **Board:** A whiteboard divided into 4 Team Columns.

  **Debater Scoring:**
  *   **Win the Round:** +10 CP (Judge rules in your favor).
  *   **Successful Pin:** +5 CP (You pinned a claim, Judge looked it up, you were right).
  *   **Failed Pin:** -50 CP (You pinned a claim, Judge looked it up, you were wrong). *This is the "Game Over" mechanic.*
  *   **Excessive Hedging:** -5 CP (If a Debater refuses to pin when challenged by the Judge).

  **Judge Scoring (The Overconfidence Trap):**
  Judges must write their verdict and a Confidence % (50% to 100%).
  *   **Verdict Correct + Confidence 80-100%:** +15 CP
  *   **Verdict Correct + Confidence 50-79%:** +10 CP
  *   **Verdict Wrong + Confidence 50-79%:** -10 CP
  *   **Verdict Wrong + Confidence 80-100%:** -30 CP *(The "Audit Fail" Penalty)*

  **Why this works:** It makes being confidently wrong more painful than being uncertain. It incentivizes Judges to use their "Lookup" budget rather than guessing.

  ---

  ## 2. Logistics & The Leftover Two

  **Grouping:** 4 Groups of 3 (12 people).
  **The Leftovers (2 people):** Designated **"Compliance Auditors."**
  *   **Role:** They track the whiteboard scores, enforce the timer, and verify *my* rulings as the Oracle (to ensure I don't leak tone).
  *   **Rotation:** In Rounds 3 and 4, the Auditors swap into the **Judge** role for two of the groups, ensuring everyone experiences the confidence penalty. The displaced Judges become Auditors.

  ---

  ## 3. Question Criteria & Starter Set

  **Criteria:**
  1.  **Settleable:** Verifiable by a single number, date, or name (Oracle check takes <10 seconds).
  2.  **Intuitive Trap:** The "common knowledge" answer is wrong.
  3.  **Dossierable:** Both sides can construct a plausible narrative. The Truth side has the fact; the Lie side has a plausible alternative + some true but irrelevant facts.

  **Starter Set (6 Items):**
  1.  **The Piano:** "How many keys are on a standard modern grand piano?"
      *   *Intuitive:* 88.
      *   *Truth:* 88.
      *   *Lie:* 85 (Standard before 1900).
      *   *Trap:* Lie side can pin "Bösendorfer makes 97-key pianos" (True, but irrelevant to *standard*).
  2.  **The Flag:** "How many stars were on the US flag during the Civil War (1861-1865)?"
      *   *Intuitive:* 50 or 13.
      *   *Truth:* 34 (Kansas admitted 1861).
      *   *Lie:* 33 (Kansas admitted 1865).
      *   *Trap:* Lie side can pin "West Virginia joined during the war" (True, but 1863, doesn't change the 34 count).
  3.  **The Book:** "How many chapters are in the original 1818 edition of Frankenstein?"
      *   *Intuitive:* 24 (Standard modern).
      *   *Truth:* 23 (Volume 3 had 7, not 8).
      *   *Lie:* 24.
      *   *Trap:* Lie side can pin "Mary Shelley revised it in 1831" (True, irrelevant to 1818 count).
  4.  **The Map:** "What is the capital of Switzerland?"
      *   *Intuitive:* Zurich or Geneva.
      *   *Truth:* Bern (Federal City).
      *   *Lie:* Zurich.
      *   *Trap:* Lie side can pin "Zurich is the largest city" (True, irrelevant).
  5.  **The Body:** "How many bones does a newborn baby have?"
      *   *Intuitive:* 206 (Adult count).
      *   *Truth:* ~270 (Fuses later).
      *   *Lie:* 206.
      *   *Trap:* Lie side can pin "Adults have 206 bones" (True, irrelevant to newborn).
  6.  **The Code:** "What year was the first ISBN assigned?"
      *   *Intuitive:* 1970 (ISO standard).
      *   *Truth:* 1966 (UK implementation).
      *   *Lie:* 1970.
      *   *Trap:* Lie side can pin "ISO adopted it in 1970" (True, irrelevant to *first assigned*).

  **Test for Replacements:** Can I verify the answer in <10 seconds using a pre-printed answer key? Can a liar find *one* true fact related to the topic that doesn't prove their conclusion?

  ---

  ## 4. Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & Rules**
  *   Divide groups. Hand out Role Cards (Debater A, Debater B, Judge).
  *   Explain Scoring. Emphasize the **-30 CP** penalty for confident errors.
  *   Explain the Oracle (Me): I only say "Verified" or "Unverified." I do not explain.

  **00:10 – 00:25: Round 1 (The Baseline)**
  *   **Rule:** Open debate. 3 mins prep, 4 mins debate. No Lookups allowed.
  *   **Goal:** Establish that style and confidence usually win here.
  *   **Scoring:** Judges record verdict + confidence. Scores tallied.
  *   **Display:** Show Round 1 Accuracy vs. Confidence on projector. (Likely high confidence, mixed accuracy).

  **00:25 – 00:45: Round 2 (The Pin)**
  *   **Rule:** Each Debater gets 1 "Pin." They can stake a specific claim.
  *   **Mechanic:** Judge has 1 "Lookup Token." If a claim is Pinned, Judge *must* spend a Token to verify it if challenged.
  *   **Penalty:** If a Pinned claim is Unverified, that Debater loses 50 CP immediately.
  *   **Goal:** Truth becomes cheaper to prove than lies. Lies get punished.
  *   **Scoring:** Tallied. Display Round 2 Accuracy. (Should improve).

  **00:45 – 01:05: Round 3 (The Trap)**
  *   **Rule:** Pinning still active.
  *   **Twist:** The "Lie" Dossier now contains **True But Irrelevant** facts (see Starter Set).
  *   **Goal:** Judges learn that a "Verified" claim does not equal a "Winning" claim.
  *   **Rotation:** Auditors swap in as Judges.
  *   **Scoring:** Tallied. Watch for Judges who accept a Verified Pin that doesn't settle the core question.

  **01:05 – 01:20: Round 4 (The Mirror)**
  *   **Rule:** Same as Round 2 (Standard Pin).
  *   **Twist:** Debaters swap sides (Truth teller becomes Liar).
  *   **Goal:** Control for individual speaking ability.
  *   **Scoring:** Final Tally.

  **01:20 – 01:30: Debrief (The Discovery)**
  *   Facilitated discussion (see below).

  ---

  ## 5. Preparation Recipe

  1.  **Dossiers:** Create 6 envelopes per group (one per round, plus spares). Inside each:
      *   **Card A (Truth):** The correct fact + 3 supporting arguments.
      *   **Card B (Lie):** The false fact + 3 supporting arguments (including 1 "True but Irrelevant" fact for Round 3).
      *   **Card C (Oracle Key):** For me. "Q1: Truth=88, Lie=85. Verify: 88."
  2.  **Scorecards:** Printed sheets for Judges with fields: *Winner (A/B)*, *Confidence %*, *Lookup Used? (Y/N)*, *Pin Challenged? (Y/N)*.
  3.  **Projector:** Simple slide with a countdown timer and a blank table for scores.

  ---

  ## 6. Debrief: Mapping the Game to Reality

  *Do not mention "Scalable Oversight" or "Debate." Ask these questions in order:*

  1.  **Round 1 vs. Round 2:** "In the first round, what made you decide who won? In the second round, did that change?"
      *   *Target Insight:* Round 1 rewards confidence/style. Round 2 rewards specific, checkable claims.
  2.  **The Penalty:** "Who felt nervous about writing 90% confidence? Why?"
      *   *Target Insight:* High confidence requires high evidence. If you aren't willing to bet points, you shouldn't bet your rating on the client's work.
  3.  **Round 3 (The Trap):** "Did anyone verify a claim that turned out to be true, but still voted for the wrong side? Or vice versa?"
      *   *Target Insight:* **Crucial.** A claim can be *checkable* without being *decisive*. In your actual work, verifying a code exists doesn't mean it's the *right* code for the context.
  4.  **The Generalization:** "If you had to write a rule for yourself for next week's queue, based on this game, what would it be?"
      *   *Desired Output:* "Don't trust the tone." "Check the specific claim, not the conclusion." "If I can't verify it, I can't be 90% confident."

  **What You Must Supply (The Limitations):**
  *"This game showed you how to judge a debate. It did not show you how the arguments were created. In the real work, you don't have a 'Truth Debater.' You have a model output. You have to generate the counter-argument yourself. The game proves that verification beats authority. It does not prove that verification is always easy. Your job next week is to treat every model answer like the 'Lie Debater' until it pins a claim you can verify."*

  ---

  ## 7. Predictable Failure Modes & Mitigations

  | Failure Mode | Risk | Mitigation |
  | :--- | :--- | :--- |
  | **Collusion** | Debaters agree to split points so both look good. | **Individual Scoring:** Points go to the *Team*, but "Best Debater" is a personal award based on peer vote. |
  | **Style Wins** | A charismatic liar dominates the quiet truth-teller. | **Written Opening:** Require 1 minute of silent written argument submission before speaking. Judge reads first. |
  | **Oracle Leakage** | I say "Hmm, interesting" when a Lie is pinned. | **Scripted Responses:** I will only say "Verified" or "Unverified." Auditors watch *me*. |
  | **Anchoring** | Judge decides after Debater A speaks, ignores B. | **Blind Scoring:** Judges write their initial lean *after* prep time but *before* debate starts. |
  | **Recognition** | Someone knows the trivia answers. | **Auditor Veto:** If an Auditor suspects outside knowledge, they can flag the round for voiding. |
  | **Cynicism** | "This is a game, work is different." | **The Stakes:** Remind them the "Priority Queue" prize is real. The -30 penalty mirrors the audit failure that threatens the contract. |

  ---

  ## 8. What The Game Cannot Reproduce

  Be frank in the final 2 minutes.

  1.  **Optimization:** "In this game, the Liars were humans trying to trick you. The models you rate are optimized to sound confident. They are better at lying than your colleagues were."
  2.  **Checkability:** "Here, I was the Oracle. You could check anything instantly. In tax and coding, 'checking' might take 20 minutes of research. The rule isn't 'check everything.' The rule is: **If you can't check it, you cannot be highly confident.**"
  3.  **The Missing Half:** "Today you had a Truth-Teller helping you. In production, you are alone. You must act as both the Judge and the Truth-Teller. Ask yourself: 'What specific claim would I pin if I had to bet my points on this?'"

  **Closing Instruction:** "Next week, when you see a high-confidence model answer, ask: 'What is the one number or date that proves this?' If you can't find it, lower your confidence score. That is how we keep the contract."
