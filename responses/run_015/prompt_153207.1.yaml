answer: |-
  ### The principle

  Weakness of will occurs when an agent capitulates to a transient affective state (urge, dread, comfort) that conflicts with a standing commitment, despite retaining the executive capacity to resist. It is not defined by contradicting a synchronic judgment, but by failing to enforce a prior policy against a localized pressure. The shift in judgment (e.g., "cake is worth it") counts as the weakness if that shift is induced by the affective state rather than new evidence. Compulsion is excluded where physiological hijacking nullifies executive capacity entirely, rendering resistance impossible. Thus, weakness is a failure of governance over permissible resistance, not a failure of logic or ability. It requires that the agent could have acted otherwise, but found the immediate cost of resistance subjectively too high in the moment, despite knowing the standing commitment serves their interests better overall.

  ### What forces each clause

  The "standing commitment" clause handles the dieter and the racer. The dieter's "worth it tonight" is a transient permission, not a genuine value shift, violating the diet policy. The racer's dread is transient affect conflicting with the commitment to run. The "executive capacity" clause distinguishes the heroin user from the alarm sleeper. The addict's mid-shot judgment is irrelevant because physiological hijacking removes the capacity to choose; it is a spasm. The sleeper retains capacity (could have slept earlier, set backup alarms) but capitulated to the comfort of sleep. The "capitulation" clause explains the tax form: the aversiveness looms near, but the capacity to file exists. It explains the 2am TV case: comfort overrides the paper commitment. It excludes the career quitter: that was a genuine revision of standing commitment based on evidence, not affective capitulation. The "cost of resistance" clause explains why paying a mate for a password feels pathetic: it admits the capacity is there but too costly to exercise voluntarily. This distinction preserves your intuition on the addict while validating the alarm case. It clarifies that the race morning dread is not incapacity, but avoided effort.

  ### Cases I havent listed

  1. **The Distracted Reader:** You intend to read philosophy but find yourself checking email every five minutes. You believe you should read, and you *could* keep the browser closed, but the urge for novelty pulls your attention. This is weakness of attention, governed by the same principle: capitulating to transient urge despite capacity to focus. 2. **The Angry Diplomat:** You commit to staying calm in a negotiation but snap when insulted. Unlike the heroin user, you could have breathed through it; unlike the career quitter, you haven't changed your mind on the value of calm. It is affective capitulation. 3. **The Dentist Avoider:** You know the tooth needs pulling and won't get worse if waited, but the dread of the drill delays you. This mirrors the tax form: the cost is near (pain), not the reward far. All three fit the principle: standing policy overridden by manageable visceral resistance. The attention case shows weakness isn't just bodily action; it's governance over mind. The diplomat shows emotional regulation fits too. The dentist confirms aversiveness nearness drives the failure, not reward discounting.

  ### What I have to give up

  You must abandon the idea that weakness requires contradicting a synchronic judgment (saving the dieter case). You must also accept that the racer who skips is weak, even if they feel unable in the moment, provided the inability is merely dread, not paralysis. You cannot claim the heroin user is weak; their capacity is nullified. You must give up the hope that "aversiveness nearness" is the definition; it is merely a common trigger. Finally, you must accept that self-binding (password mate) is an admission of weakness, not a rational workaround, making it indeed faintly pathetic but necessary.
