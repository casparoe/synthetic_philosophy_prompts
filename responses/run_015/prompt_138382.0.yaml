      **Project Title:** Beyond Knob-Twiddling: Inventing Dimensions in Musical Creativity
      **Research Question:** To what extent does the invention of new conceptual dimensions, rather than variation along existing ones, determine the perceived interestingness of musical creativity?

      Current models of creativity, such as Hofstadter's 'knob-twiddling' analogy, depict creation as navigating a pre-existing 'style space'. Here, parameters are fixed, and creativity involves sliding along these dimensions. While this explains variation, it is too tidy; it assumes the space is fully built and labelled before work begins. It cannot account for where the knobs come from. I propose that creative acts involve three distinct moves: moving along an existing knob, inventing a new knob (re-describing the domain), or changing the grain of a knob. My hypothesis is that perceived 'interestingness' tracks the invention of new knobs rather than mere distance travelled along old ones.

