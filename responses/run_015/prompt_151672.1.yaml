prompt: |-
  me and a friend have been fighting about Quine's gavagai example for months and we're tired of talking past eachother. can you draft the joint statement we'd write if we actually did an adversarial collaboration? the two camps are camp A, the ontological indeterminists, who think Quine showed behavioral evidence genuinely fails to fix reference so gavagai could be rabbit, undetached rabbit-part, or temporal rabbit-stage with no hidden fact deciding it; and camp B, the pragmatic determinists, who think Quine's logical point is correct but in any actual community charitable interpretation and shared theoretical commitments converge on rabbit, making the indeterminacy epistemic not ontological.

  the doc should have four parts:
  1. numbered agreed claims about what Quine argued, what counts as behavioral evidence, that empirically adequate manuals can be incompatible, etc.
  2. a disagreements table with each side's view in wording they'd sign, especially on whether there's a fact of the matter about gavagai-meaning.
  3. the cruxes. i think one is whether analogical reasoning in translation discovers meaning or imposes our ontology. the other should be something slightly off the beaten path - maybe how a non-human intelligence trained purely on correlation without innate human concepts would map gavagai, since that's not in Quine's original text but tests the same intuition. both sides need to agree this case is relevant.
  4. for each crux, one concrete argument or case both sides accept bears on it, plus each camp's advance prediction about what we'd find.

  please keep it in the weeds - dont just say they disagree about language. no bibliography, no reading list, no citation requests, since this might run on a model with no web access. write it casual, with a typo or two is fine.
