answer: |-
  1. Reconstruction of the stalemate

  The Relativists argue that Skolem's Paradox reveals a fundamental ontological indeterminacy regarding set-theoretic size. Since a countable model $M$ satisfies ZFC and contains sets $S$ that $M$ deems uncountable, the property of "uncountability" cannot be an intrinsic feature of $S$. Specifically, the bijection witnessing $S$'s countability exists externally but is absent from $M$'s domain. For Relativists, this demonstrates that there is no fact of the matter about absolute cardinality independent of a formal framework; ontology is inherently model-relative. The downward Löwenheim-Skolem theorem is thus read as a metaphysical result: size is relative to the available functions.

  The Formalists counter that this conflates semantic relativity with metaphysical vagueness. They distinguish sharply between the internal predicate $\text{Uncountable}(x)$ defined within $M$ and the external metatheoretic fact that $M$'s domain is countable. For them, "uncountable" is absolute within the intended interpretation of ZFC, and the existence of non-standard countable models is a limitation of first-order logic, not a feature of sets themselves. They maintain that model-relativity is a technical artifact of formalization, carrying no ontological weight. The stalemate arises because Relativists see the formal limitation as revealing metaphysical truth, while Formalists see it as merely syntactic noise obscuring metaphysical truth. Both agree on the math but disagree on whether the model's internal perspective or the metatheorist's external perspective captures the "real" properties of sets.

  2. Diagnosis

  Your hypothesis is largely correct: the dispute is verbal regarding "absolute," but this verbality masks a substantive divergence in foundational aims. The Relativists equate ontological determinacy with first-order axiomatizability. If first-order axioms cannot fix cardinality (due to Löwenheim-Skolem), they conclude cardinality is indeterminate. The Formalists equate ontological determinacy with conceptual coherence, treating axioms as incomplete descriptions of a fixed reality. Consequently, they are answering different questions. Relativists ask, "What properties are invariant across all models of theory $T$?" Formalists ask, "What properties hold in the intended model of theory $T$?" The former yields relativity; the latter yields absolutism.

  The hidden formal question concerns the legitimacy of second-order logic. Skolem's Paradox dissolves if one adopts second-order ZFC with standard semantics, as categoricity fixes cardinality absolutely. However, this sacrifices syntactic completeness and forces reliance on set-theoretic semantics to define logic itself, potentially inviting circularity. Thus, the debate is actually about whether logical tractability (First-Order) or expressive power (Second-Order) takes precedence in defining ontology. The Relativists accept the first-order constraint as ontologically binding; the Formalists treat it as a methodological choice that does not constrain reality. The stalemate persists because neither side acknowledges that their position rests on a prior commitment to a specific logical framework's authority over metaphysical questions. Without resolving whether logic dictates ontology or describes it, the discussion of "absoluteness" remains equivocal. This structural mismatch ensures the conversation continues in parallel lines.

  3. Conditions for progress

  Progress requires reframing the question from "Is cardinality absolute?" to "What logical resources are required to fix cardinality?" The parties must agree on a distinction between *logical absoluteness* (invariance across all models of a first-order theory) and *semantic absoluteness* (fixity within an intended interpretation). Once distinguished, the Relativists must concede that first-order logic cannot secure semantic absoluteness, while Formalists must concede that without second-order semantics or large cardinal axioms, logical absoluteness is unattainable.

  A productive advance would involve analyzing *absoluteness results* in set theory (e.g., Shoenfield absoluteness) to show where cardinality *is* preserved across models (e.g., $\Sigma^1_2$ statements) versus where it is not. This shifts the debate from global skepticism to local technical conditions. Alternatively, progress lies in admitting that "ontology" in this context is inseparable from "logic choice." If the seminar accepts that choosing first-order logic *is* choosing ontological relativity, the dispute dissolves into a pragmatic choice about formal tools rather than a metaphysical discovery about sets. The key is to stop asking if sets *are* relative and start asking if our *language* forces relativity upon us. This moves the dispute from metaphysics to philosophy of language and logic.

  4. Bottom line

  This is a pseudo-debate sustained by ambiguous terminology, specifically the conflation of *axiomatizability* with *ontology*. The mathematics is settled: first-order theories have countable models. The disagreement is purely philosophical about whether axioms exhaust reality. It is not a genuinely hard problem because no new formal result will bridge the gap between semantic intent and syntactic limitation. However, it is not entirely ill-posed, as it highlights a genuine tension in foundational practice: the trade-off between logical completeness and expressive power. The seminar should conclude that Skolem's Paradox is not a paradox about sets, but a theorem about the limitations of first-order language in capturing intended ontologies. Accepting this dissolves the tension without requiring one side to surrender their core intuition.
