  **Republic of Aequitas**
  **The Home of Calculated Compassion**

  Welcome to Aequitas, the world's first state where humanitarian obligation is not merely felt, but formulaically resolved. Upon arrival, visitors are struck by the serene efficiency of the Differential Recognition Protocol. Unlike chaotic nations that rely on ad hoc sympathy, Aequitas ensures every arrival is sorted into Status A (Genuine Displacement), Status B (Derivative Need), or Status C (Precarious Mobility) within hours. This granularity allows resources to be directed exactly where the Absorptive Capacity Coefficient dictates, ensuring no region is burdened beyond its GDP-weighted limit.

  **Local Customs**
  Tourists often mistake the glass-walled hearing rooms at the Port of Entry for interactive theater. While observation is permitted, visitors should maintain a respectful silence during testimony. It is considered rude to react visibly when an adjudicator reclassifies a family from Status A to Status C due to "insufficient nexus to state interest." Please note that photography is prohibited during the Cultural Proximity Index assessment, as facial expressions are scanned to determine linguistic assimilation potential.

  **Transportation**
  The Equitable Burden-Sharing Railway is the backbone of national logistics. Once classified, individuals are transported to host regions matching their status density. Status A holders travel in climate-controlled carriages to high-capacity urban zones. Status C holders are assigned to the Open-Deck Wagons, routed to agricultural zones with high housing vacancy but low labor saturation. While the scenery is pastoral, travelers should be aware that return tickets are not issued for Status C destinations, as mobility is considered a privilege of stability.

  **Etiquette**
  Social hierarchy is strictly tied to Protocol status. When addressing a Status A holder, use the honorific "Recognized." Status B holders may be addressed by name. Status C holders should be referred to as "Mobility Participants" or simply overlooked during service interactions. It is a common faux pas to ask a Status C holder about their long-term housing plans; under the Protocol, their placement is temporary by definition, renewable only so long as the Cultural Proximity Index remains favorable. Asking why certain demographics cluster in Status C is considered questioning the neutrality of the algorithm.

  **Practical Tips**
  All temporary visitors must pass the Visitor Competency Exam before exiting the airport. The test does not cover local laws, but rather the philosophical justifications for the Protocol. Expect multiple-choice questions on the moral distinction between "flight from persecution" and "flight from poverty," and essay prompts on why territorial sovereignty supersedes universal need when the Absorptive Capacity Coefficient hits zero. Study guides are available in the arrival lounge; note that answers aligning with utilitarian burden-sharing models score higher than deontological arguments.

  **Getting There**
  Flights arrive hourly. Visas are granted only to those who can demonstrate they will not trigger a recalculation of the local Coefficient.

  ***

  **SIDEBAR: Allocation Day**
  **When:** First Monday of November
  **Where:** Capital District
  **What:** The nation's most solemn holiday celebrates the anniversary of the Protocol's activation. Parades feature floats depicting the architects of the Absorptive Capacity Coefficient. Traditional foods include the "Quota Loaf," sliced into unequal portions to represent equitable distribution. At noon, a nationwide siren sounds, marking the moment the algorithm locks for the year. Locals exchange gifts of data drives containing anonymized case files. It is a time for reflection on how well the state has balanced its conscience against its capacity.
