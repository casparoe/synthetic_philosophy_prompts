      *   **Rank 2:** Claim 2 vs. Claim 7. ("No further fact" vs. "Artifact").
      *   **Rank 3:** Claim 4 vs. Claim 7. (Inconsistent application of "Design").
      *   **Dissolved:** 3 vs 1.
