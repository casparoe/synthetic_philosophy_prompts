  **MEMORANDUM**

  **TO:** Dr. L. S. Gump, Principal Investigator, Department of Entomology
  **FROM:** Office of Research Compliance & Human Resources
  **DATE:** October 14, 2023
  **SUBJECT:** Determination of Personnel Status: Entity "Aunt Hillary" (Colony ID 8940)
  **REF:** HR-2023-8940-NC

  **1. Purpose**
  This document serves as the final determination regarding the personnel classification of Entity 8940 (hereinafter "the Colony"), currently listed on grant proposals as a Visiting Researcher. The Office of Research Compliance (ORC) cannot process the Colony as a single legal person, nor can it process the constituent organisms as individual employees. This determination outlines the administrative incompatibilities arising from this ambiguity.

  **2. Supervisory Chain and Executive Function**
  Per University Policy 4.1, all personnel must report to a designated supervising officer. The Colony's grant documentation lists the Queen as "Supervisor." However, field observation confirms the Queen exhibits no executive oversight, directive issuance, or cognitive processing regarding labor allocation. She functions solely as a reproductive organ. **[MARGIN NOTE: Dr. A. Thorne, Neurobiology: Correct. There is no supervisor. There are only individual ants responding to local chemical gradients. Stop reifying the nest.]** Consequently, the "Supervisor" field remains null. Without a central executive to accept liability for institutional decisions, the Colony cannot be authorized to access secure lab spaces.

  **3. Performance Review and Attribution**
  Discrepancies exist in the attribution of agency during performance windows. In Week 3, the Colony successfully identified a sugar source via quorum sensing. This was logged as "Decision-Making" for the purpose of grant deliverables. However, in Week 5, the Colony engaged in Event 44-B: a continuous circular locomotion protocol resulting in 100% worker depletion (commonly referred to as a "death spiral"). This was logged as "Maintenance Error" to avoid classifying the event as a "Suicidal Ideation Incident." **[MARGIN NOTE: Dr. A. Thorne: It wasn't a decision in Week 3 either. It was stochastic resonance. You are attributing mind to success and mechanics to failure.]** The Office cannot maintain a classification system where agency is assigned retrospectively based on outcome viability.

  **4. Continuity of Identity and Turnover**
  HR requires identity verification for all personnel at the conclusion of the review period. During the Q3 review cycle, 100% of the worker biomass constituting the Colony at the start of the period expired and was recycled. While the Colony claims continuity of identity via pattern persistence, the University payroll system requires biological continuity of the individual unit. **[MARGIN NOTE: Dr. A. Thorne: Finally, a fact. The 'Colony' is a label for a flux of individuals. The label has no mind.]** If the workers are the employees, they are deceased. If the Colony is the employee, it lacks a Social Security Number.

  **5. Self-Assessment Compliance**
  The Colony was requested to submit a Self-Assessment Form (SAF-99) within 72 hours. The submission arrived eleven days late. The content consisted of a pheromonal trace interpreted by lab staff as "Goals Aligned with Institutional Mission." Due to the latency exceeding the cognitive processing speed required for timely administrative review, this is filed as Noncompliance. **[MARGIN NOTE: Dr. A. Thorne: The latency proves there is no central processor. You are waiting for a ghost to sign a form.]**

  **6. Determination**
  The Colony is hereby reclassified as "Equipment / Biological Consumable." Future grant proposals must list the Colony as a supply budget line item rather than a collaborator.

  ***

  **ATTACHMENT A: EMAIL THREAD (EXCERPT)**

  **From:** J. Miller, HR Compliance
  **To:** Dr. L. S. Gump
  **Cc:** Dr. A. Thorne
  **Subject:** RE: Clarification on Entity 8940

  **Miller:**
  Dr. Gump,
  We still need a name for the individual responsible for the safety breach in Lab 4. The report says "The Colony decided to breach the containment seal." "The Colony" cannot be disciplined. Please provide the name of the specific ant that initiated the breach so we can issue a written warning.

  **Gump:**
  Jennifer,
  As discussed, no individual ant possesses the information required to breach the seal. It was an emergent property of the system. The mind is in the interaction, not the agent.

  **Thorne:**
  There is no mind in the interaction. There are ants walking into walls. One ant bumped the seal. Find her.

  **Gump:**
  If we find her, she is irrelevant. She died four hours ago. Her behavior was determined by the pheromonal state of the group.

  **Miller:**
  We cannot issue a warning to a pheromone. If we cannot assign individual responsibility, we cannot insure the lab. Please confirm if you wish to proceed with listing the Colony as "Equipment."

  **Gump:**
  This feels like a category error.

  **Thorne:**
  It's not an error. It's biology. You're trying to hire a weather pattern.

  **Miller:**
  Please confirm by EOD.

  **Gump:**
  ...Confirmed. Listing as Equipment.

  **Thorne:**
  Good. Now defund the equipment.
