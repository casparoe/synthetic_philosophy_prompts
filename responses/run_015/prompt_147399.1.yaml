answer: |-
  Your instincts are excellent; the book conflates Aristotle's text, Łukasiewicz's formalisation, and the metaphysics of time. Here is the breakdown you need for your talk.

  **Sentence-by-Sentence Verdict**
  1.  *"If that sentence is true today, then tomorrow's battle is unavoidable…"* **Fair.** This is the fatalist argument Aristotle addresses (confusing truth with necessity).
  2.  *"Aristotle's way out was to deny that statements about future contingents are either true or false…"* **Disputed.** This is the "Standard Interpretation" (Boethius/Łukasiewicz). Many scholars argue Aristotle kept bivalence but denied the *necessity* of the truth.
  3.  *"He therefore rejected the law of the excluded middle for them."* **Wrong.** Aristotle explicitly affirms the disjunction ("either it will be or it won't") is *necessary*. He targets **Bivalence** (each disjunct is T/F), not **Excluded Middle** (the disjunction is True).
  4.  *"Łukasiewicz built… logic precisely to formalise this… 'either… or…' also comes out as ½… which is exactly what Aristotle had argued."* **Wrong.** Łukasiewicz did make the disjunction indeterminate (½), but Aristotle did *not*. This is a major divergence the book hides.
  5.  *"The moral is that an open future isn't compatible with classical logic…"* **Disputed/False.** You can have an open future with classical logic (see Ockhamism below).

  **Bivalence vs. Excluded Middle**
  You are right to spot the mess. **Bivalence** says every proposition is True or False. **Excluded Middle** says $P \lor \neg P$ is True.
  *   **Aristotle (Standard Reading):** Keeps Excluded Middle (the disjunction is true), Rejects Bivalence (neither disjunct is yet true).
  *   **Łukasiewicz:** Rejects both for contingents (the disjunction is indeterminate).
  *   **The Book:** Merges them, claiming Aristotle did what Łukasiewicz did.

  **The "Moral" and Classical Logic**
  The claim that an open future requires weakening logic is false. **Ockhamism** (named after William of Ockham; modern proponents include Plantinga and Kaplan) keeps classical logic intact. It treats truth as relative to a "history" or branch. "There will be a sea battle" is true-or-false *at a timeline*, even if the future branches. Classical logic holds within each branch. **Supervaluationism** is another classical-compatible view: a statement is true only if true on *all* possible branches.

  **The Admiral and the Storm**
  Your intuition is correct. If the storm makes the battle impossible, "There will be a battle" is **False**, not indeterminate. Indeterminacy applies only while causal conditions are genuinely open. Once the storm settles the outcome, it is no longer a "future contingent." The book's picture is too tidy; it implies *all* future statements get value ½, rather than only those that remain causally unsettled.

  **The "Past Changing" Objection**
  This is a standard objection to truth-value gaps. If $P$ is neither-T-nor-F today but True tomorrow, did the past change?
  *   **Objection:** Tomorrow it becomes true that "Yesterday, $P$ was true."
  *   **Reply:** No. Tomorrow it is true that "Yesterday, $P$ was indeterminate." Truth is temporally indexed. The *world* changed, not the truth-value of the past moment retroactively. It is not a reductio, but it requires a tense-logic framework to explain cleanly.

  **Summary of Positions for your Talk**
  1.  **Łukasiewicz (Many-Valued):** Future contingents are neither T nor F. Disjunction is indeterminate. (Non-classical logic).
  2.  **Ockhamism:** Future contingents are T or F relative to a branch. Disjunction is True. (Classical logic + Branching time).
  3.  **Peirceanism:** "Will" implies necessity. If it's not necessary, "It will happen" is False. (Classical logic + Determinate future only).

  **Confidence Flag:** I am confident on the logic distinctions and the Ockhamist counter-example. The interpretation of Aristotle (*On Interpretation* Ch. 9) is famously contentious among specialists; the "Standard Interpretation" is dominant in introductory texts but heavily debated in journals. Your caution is warranted.
