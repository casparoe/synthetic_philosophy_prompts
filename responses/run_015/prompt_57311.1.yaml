answer: |-
  Dear colleague, I have read your abstract with great interest and some anxiety, because you are walking into a room that is structurally hostile to the conclusion you want to reach, even if they are sympathetic to your aims. You need to prepare for the question period not as a defense of your entire project, but as a triage of where the bleeding will be worst. The first question will come from the international criminal lawyers, and it will be about the Inter-American Court of Human Rights and the Barrios Altos judgment. They will ask you how you can square horizontal amnesty with the Court's holding that amnesty laws are incompatible with the American Convention because they prevent the investigation and punishment of those responsible. You should concede immediately that Barrios Altos struck down blanket self-amnesty laws that extinguished liability without condition, which is exactly your vertical amnesty. Your reply is that the Court's reasoning turned on the impunity resulting from the extinguishment of the state's claim, whereas your horizontal model satisfies the claim through performance and disclosure, leaving the historical record intact. The soft spot here is that the Inter-American Court has not explicitly blessed conditional amnesty in a subsequent judgment, so you are asking them to take a leap of faith on jurisprudence that does not yet exist.

  The second objection will come from the same cohort but focused on the Rome Statute and the duty to prosecute under international treaty law. They will argue that complementarity is designed to allow national prosecutions, not non-prosecutorial alternatives, and that the ICC Office of the Prosecutor views amnesty as a bar to admissibility only if it shields the person from criminal responsibility. You should concede that the Rome Statute prioritizes criminal prosecution and that the current operational practice of the ICC is hostile to amnesty deals. Your reply is that complementarity tests whether the state is unwilling or unable to bring the person to justice, and you argue that justice is a broader concept than imprisonment, one that can be met by the rigorous truth-telling and public shaming of horizontal amnesty. The weakness in this reply is that there is no ICC precedent where a conditional amnesty was found to satisfy the gravity and admissibility requirements, so you are arguing de lege ferenda against a strong textualist current.

  Next, a human rights litigator will challenge your normative claim that the duty is owed to victims rather than being a duty to imprison. They will ask whether you are not simply imposing your own theoretical conception of accountability over the expressed desires of victims who demand punishment. You must concede that many victims do view imprisonment as the only valid form of justice and that your model may not satisfy them. Your reply is that victim preferences are heterogeneous and context-dependent, and in fragile transitions, the certainty of truth and reparation via horizontal amnesty often outweighs the speculative chance of a conviction that may never come or may destabilize the peace. The softness here is empirical; unless you have specific testimony from the jurisdiction you are studying showing victims prefer this, you risk sounding paternalistic by telling victims what kind of justice should suffice for them.

  Then the two quantitative civil-war scholars will turn on your empirical claim that the international norm against amnesty is justified by conflict prolongation. The first will attack your identification strategy, arguing that conflicts that end with amnesty are systematically different from those that end with trials, so you cannot isolate the amnesty variable as the cause of peace or conflict duration. You should concede that observational data on civil war termination is plagued by endogeneity and that causal identification is notoriously difficult in this field. Your reply is that your argument is primarily normative and conceptual regarding the definition of accountability, and that the empirical claim about conflict prolongation is secondary to the moral claim about victim satisfaction. The damage here is significant because if your empirical premise is wrong, your claim that horizontal amnesty does more for victims loses its comparative advantage over trials.

  The second quant scholar will follow up on selection bias, noting that we only study successful truth commissions and amnesties that held, while the failed ones where perpetrators lied or violence resumed are dropped from the dataset. You should concede that institutional memory is skewed toward success stories and that failed transitions are under-documented. Your reply is that horizontal amnesty is a structural proposal with verification mechanisms, not a description of past failures, and that the risk of failure exists equally in criminal trials that collapse due to lack of evidence or witness intimidation. The weakness is that you cannot prove the verification mechanisms work better than trial safeguards without data, which brings you back to the empirical deficit they just highlighted.

  The former truth commission staff member will ask a practical question about verification, specifically how you ensure full disclosure without the coercive powers and evidentiary standards of a criminal court. They will suggest that perpetrators will perform truth without actually revealing the chain of command or the location of remains. You should concede that verification is the single greatest operational challenge of any truth process and that perpetrators often lie strategically. Your reply is that horizontal amnesty relies on public scrutiny and corroboration by investigators, making the performance of truth a high-stakes gamble for the perpetrator where exposure means loss of amnesty, whereas trials often exclude victims from the evidentiary process entirely. The soft spot is that if the state lacks the capacity to corroborate, which is common in post-conflict settings, the conditionality becomes a sham, reverting your model to vertical amnesty.

  Another international lawyer will raise the slippery slope argument, asking how you prevent political actors from labeling vertical amnesty as horizontal to gain international legitimacy. They will argue that creating a category of acceptable amnesty provides cover for dictators to escape real justice. You should concede that the risk of co-option is real and that language is often manipulated by regimes to sanitize impunity. Your reply is that the distinction turns on specific procedural safeguards, such as individualized application and public hearing requirements, which are observable and distinguishable from blanket legislative decrees. The weakness here is political rather than legal; in the heat of a transition, international actors often accept imperfect compromises, and your nuanced distinction may be too fragile to withstand political pressure.

  The final objection from the human rights group will focus on inequality, asking whether horizontal amnesty favors eloquent or wealthy perpetrators who can perform truth more convincingly than poor or less educated ones. You should concede that all legal processes suffer from inequality of representation and that performance anxiety is a real barrier. Your reply is that the standard is factual disclosure corroborated by evidence, not rhetorical skill, and that legal counsel can be provided to ensure the performance meets the threshold. The soft spot is that the public nature of the hearing inherently privileges those who can navigate public shame, potentially biasing the historical record toward those who can afford to save face.

  Finally, there is one question I hope no one asks you, because I do not think you have a safe answer for it yet. Someone will ask you that if the duty to prosecute is owed to the victim, as you argue, does the victim have the right to waive that duty, and if so, why is a private settlement not valid, but if not, how can you impose horizontal amnesty on a victim who specifically demands imprisonment. This is dangerous because it exposes a tension in your core thesis between victim agency and your theoretical construct of accountability. If you say the victim can waive it, you undermine the public interest component of human rights law; if you say they cannot, you undermine your claim that the duty is owed to them rather than to the international order. You need to think carefully about whether your theory rests on the victim's consent or on an objective standard of justice, because if you are forced to choose during the Q&A, you may find that either choice collapses the distinction you have built between vertical and horizontal amnesty.
