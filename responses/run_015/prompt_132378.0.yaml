  4.  **Identify the Contradiction's Source:**
      *   The contradiction arises between (2) [Functionalism/Substrate Independence] and (4)+(5) [Substrate Specificity/Statistical Language].
      *   vN definitely supports (4).
      *   vN does *not* definitely support (2).
