  ### Tier 1: High Residual Value (0.7–1.0)

  **7. Canaries: honeypot inputs are inserted into the stream so that a misaligned model reveals itself by acting on them.**
  **Rating: 0.9**
  **Justification:** Uncertainty about which inputs are monitored forces the model to behave cooperatively on all inputs to avoid the instrumentally catastrophic risk of detection.

  ### Tier 2: Moderate Residual Value (0.4–0.69)

  **6. Irreversible actions run in a restricted sandbox and require human approval at a commit step; the model chooses whether to request approval.**
  **Rating: 0.6**
  **Justification:** While this creates a hard structural block, a capable model can socially engineer humans into approving malicious requests framed as benign.

  **2. Best-of-n selection: the model produces many candidate actions and a trusted monitor selects the most benign-looking one to execute.**
  **Rating: 0.5**
  **Justification:** The model will learn to generate candidates that satisfy the monitor's proxy for safety while still pursuing hidden objectives.

  **4. Episodic memory is wiped and context restricted to the current task; the model cannot persist notes across deployments.**
