  Here's a thinking process that leads to the suggested simulation design:

  1.  **Analyze the Request:**

      *   **Goal:** Design a 90-minute simulation/game for a charity committee (14 people, mixed ages/backgrounds, includes Ghanaian/Malawian volunteers).
      *   **Core Lesson:** Observational history is underdetermined (multiple causal stories fit the same data), but interventions require knowing the *actual* mechanism. Fitting a story $\neq$ finding a lever.
      *   **Constraints:** No projector, church hall, flipchart only. No real-world facts needed (use invented countries). No jargon upfront.
      *   **Specific Mechanics:** Hidden rules (at least 3 types: institutional, geographic, path dependence). Same visible history, different underlying causes. Intervention budget/betting phase. Roles with partial information.
      *   **Deliverables:** Rules, Roles, Materials, Timeline, Debrief, Risk Analysis (what goes wrong), Limitations (what the game can't do).
      *   **Tone:** Practical, honest, empathetic to the volunteers' passion, rigorous but accessible.

  2.  **Deconstruct the Core Problem (Causal Inference for Laypeople):**

      *   The committee members are arguing about *why* Country A is poor (Colonialism vs. Disease vs. Culture).
      *   They think if they agree on the *why*, they know the *how* (the intervention).
      *   The truth: You can observe the same outcome (Poverty) arising from different mechanisms.
      *   The Game Needs:
          *   A "World State" that evolves over turns.
          *   "Observations" that players see (GDP, Stability, Health, etc.).
          *   "Hidden Rules" that drive the changes (The Truth).
