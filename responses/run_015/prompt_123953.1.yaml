answer: |-
  This is a brilliant and necessary intervention. You are trying to move a group from *post-hoc storytelling* to *counterfactual thinking* without triggering defensiveness. The design below is built for a church hall, zero tech, and high emotional stakes.

  # Simulation Title: "The Three Engines"

  **Concept:** The room acts as a Donor Board for a fictional region ("Ostra"). You (the Facilitator) are the "Engine." You hold three different rule-sets (Worlds) that explain Ostra's decline. All three produce the *exact same* visible history over three rounds. They require *completely different* interventions to fix. The group must diagnose the cause and bet their budget.

  **Learning Objective:** To demonstrate that observational data (history) is consistent with multiple causal mechanisms, and that "fitting the story" is not evidence of "finding the lever."

  ---

  ## 1. Materials (Stationery Shop List)

  *   **3 Large Envelopes**, labelled "WORLD A", "WORLD B", "WORLD C". (Inside each: A Rule Card).
  *   **14 Role Cards** (see Roles below).
  *   **Flipchart & Markers** (Black, Red, Blue).
  *   **20 Poker Chips or Counters** (The Budget).
  *   **1 Six-sided Die** (Hidden in your hand).
  *   **Printed "Status Sheets"** (14 copies, identical).

  ## 2. The Hidden Rules (For Your Eyes Only)

  *Do not show these until the Reveal.*

  *   **WORLD A (The Institutional Trap):**
      *   *Mechanism:* Prosperity = **Order**.
      *   *Dynamic:* Order starts at 10. Every round, Order drops by 2.
      *   *Fix:* Spending on **Governance** restores Order. Spending on Health/Infrastructure does nothing.
  *   **WORLD B (The Geographic Trap):**
      *   *Mechanism:* Prosperity = **Health**.
      *   *Dynamic:* Health starts at 10. Every round, Health drops by 2 (disease burden).
      *   *Fix:* Spending on **Infrastructure** (clean water/clinics) restores Health. Spending on Governance does nothing.
  *   **WORLD C (The Luck/Path Trap):**
      *   *Mechanism:* Prosperity = **Momentum**.
      *   *Dynamic:* Prosperity = Previous Score + Die Roll (1-3 is -1, 4-6 is +1). *Rig the die so it rolls low.*
      *   *Fix:* Spending on **Education** allows you to re-roll the die. Spending on Governance/Infrastructure does nothing.

  **The Trick:** For Rounds 1, 2, and 3, you will announce the *exact same numbers* regardless of which World you secretly picked.
  *   Start: Prosperity 10.
  *   Round 1 End: Prosperity 8.
  *   Round 2 End: Prosperity 6.
  *   Round 3 End: Prosperity 4.

  ---

  ## 3. Roles (Distribute Randomly)

  *   **The Board (3 people):** Hold the budget chips. Must make the final decision. They hear everyone but speak last.
  *   **The Historians (3 people):** Receive "Context Cards." These cards contain vague narratives that support *any* theory (e.g., "Past leaders were accused of greed," "Neighbors have similar climate," "Traditions are strong").
  *   **The Field Agents (4 people):** Receive "Field Notes." These contain specific but ambiguous observations (e.g., "Roads are potholed" [Could be corruption OR lack of tech], "Clinics are empty" [Could be disease OR distrust], "Youth are leaving" [Could be jobs OR culture]).
  *   **The Analysts (4 people):** Receive the "Status Sheets." They track the numbers (Prosperity 10 -> 8 -> 6 -> 4). They are the only ones who see the raw data trend.

  *Note: Ensure your Ghanaian/Malawian volunteers are distributed across these roles, not siloed into "Field Agents."*

  ---

  ## 4. Timeline (90 Minutes)

  ### Phase 1: Setup (10 mins)
  *   Hand out Role Cards. Tell them: "You are the Board for Ostra. It is declining. You have 3 years of data. You have one chance to spend a budget to save it."
  *   **Rule:** No one can say "I think..." without pointing to a piece of evidence (a number, a field note, a history card).
  *   **Rule:** The Board members cannot speak until everyone else has spoken.

  ### Phase 2: The History (30 mins)
  *   You run 3 Rounds. In each round:
      1.  **Announce Start State:** "Year 1. Prosperity is 10."
      2.  **Read an Event Card:** (See below).
      3.  **Ask for Input:** Field Agents and Historians share one sentence of intel. Analysts update the flipchart.
      4.  **Announce End State:** "Year 1 End. Prosperity is 8."
      5.  **Repeat** for Year 2 (End 6) and Year 3 (End 4).
  *   *Event Cards (Read these ambiguously):*
      *   *Card 1:* "Local leaders argue over tax collection." (Hints at Institutions OR Culture).
      *   *Card 2:* "A heatwave reduces crop yields." (Hints at Geography OR Infrastructure).
      *   *Card 3:* "A neighboring region boomed unexpectedly." (Hints at Luck/Trade OR Policy).
  *   *Facilitator Note:* Keep your face neutral. Do not nod more at one theory than another.

  ### Phase 3: The Debate & Bet (20 mins)
  *   The Board has 5 Budget Chips.
  *   There are 3 Intervention Buckets on the flipchart: **Governance**, **Infrastructure**, **Education**.
  *   The room must agree on where to put the chips.
  *   *Constraint:* They must write down their "Theory of Change" on the flipchart before spending. (e.g., "We are spending on Governance because corruption is the root cause").
  *   *Risk Control:* If one person dominates, invoke the "Role Rule": "I need to hear from a Field Agent."

  ### Phase 4: The Reveal (15 mins)
  *   Collect the bets. Do not announce the winner yet.
  *   **Step 1:** Open **WORLD A**. Show the rule. Ask: "If this was the real world, who wins?" (Those who bet on Governance).
  *   **Step 2:** Open **WORLD B**. Show the rule. Ask: "If this was the real world, who wins?" (Those who bet on Infrastructure).
  *   **Step 3:** Open **WORLD C**. Show the rule. Ask: "If this was the real world, who wins?" (Those who bet on Education).
  *   **Step 4 (The Punchline):** Point to the flipchart history (10 -> 8 -> 6 -> 4).
  *   **Say:** "I could have been running any of these three engines. The history would have looked *exactly the same*. You told a story that fit the past. But you didn't know which engine was running."

  ### Phase 5: Debrief (15 mins)
  *   (See Debrief Script below).

  ---

  ## 5. The Debrief Script (Mapping Game to Reality)

  *Do not use jargon like 'endogeneity'. Use the game mechanics.*

  **1. On "Fitting the Story" (10 mins)**
  *   **Ask:** "Hands up, who felt confident their story was right during the debate?"
  *   **Point:** "You felt confident because your story *fit* the data. But as you saw, three *contradictory* stories fit that same data perfectly."
  *   **Real World Link:** "When we argue about Malawi or Ghana, we are looking at the 'Prosperity 10 -> 4' chart. We are all telling stories that fit that chart. But fitting the chart isn't the same as knowing the Engine."

  **2. On "Evidence vs. Narrative" (10 mins)**
  *   **Ask:** "What information would you have needed *during* the game to tell World A from World B?"
  *   **Listen for:** "We needed to know if Order dropped when we didn't pay," or "We needed to test Infrastructure."
  *   **Point:** "You needed *variation*. You needed to see what happened when we *did* something, or compare Ostra to a place that *didn't* have the heatwave. History gives you one run. Evidence comes from comparing runs."
  *   **Real World Link:** "This is why we don't just look at GDP. We look at pilot programs. We look at border districts where the policy changes but the culture stays the same. We need to stop asking 'What is the story?' and start asking 'What would happen if we pulled this specific lever?'"

  **3. On "Cynicism vs. Humility" (5 mins)**
  *   **Address the Risk:** "It's tempting to say 'Well, if we can't know, why bother?' That's the wrong lesson."
  *   **The Takeaway:** "The lesson isn't that we can't know. It's that we can't know *just by looking at the past*. We have to build mechanisms to test the levers. Small bets. Pilot schemes. Listening to the Field Agents (local partners) who see the gears, not just the numbers."
  *   **Close:** "Your passion is the fuel. But don't let the story become the steering wheel."

  ---

  ## 6. Risk Analysis: What Will Go Wrong

  **1. The "Dominant Voice" Risk**
  *   *Prediction:* The member who believes in "Culture/Work Ethic" (or whichever is most vocal) will try to interpret every Event Card to fit their view.
  *   *Mitigation:* You hold the Event Cards. If they say "This proves culture is the issue," you say, "The card says 'Leaders argue.' Does that prove culture, or institutions?" Enforce the **Role Rule**. The Board cannot decide until the Field Agents speak.

  **2. The "Reverse-Engineering" Risk**
  *   *Prediction:* A clever volunteer (maybe a teacher or engineer) will try to ask you specific math questions to deduce the rule. "Does Order drop by exactly 2?"
  *   *Mitigation:* Pre-empt this. "I am the Engine. I will only give you the data a real donor would see: Aggregate outcomes and anecdotal reports. I will not answer mechanics questions."

  **3. The "Nihilism" Risk**
  *   *Prediction:* They leave thinking "Development is impossible, causes are unknowable."
  *   *Mitigation:* This is why the Debrief Section 3 is critical. You must explicitly state: "The game is harder than reality." In reality, we have *more* data than 3 rounds. We have neighbors, history, and the ability to run small trials. The game proves why *testing* is better than *arguing*.

  ---

  ## 7. Limitations: What You Must Say Out Loud

  The game is a simplification. If you don't acknowledge this, the sophisticated volunteers will dismiss it. At the start of the Debrief, say this:

  > "This game is rigged to be harder than real life. In the game, you only saw one country. In reality, you have Malawi *and* Ghana *and* Kenya. You can compare them.
  >
  > In the game, you couldn't run a pilot. In reality, we can fund a small scholarship scheme in one district and see if it works before funding the whole country.
  >
  > In the game, the rules were stationary. In reality, causes mix. Corruption *and* disease *and* luck all play a part.
  >
  > The point of this simulation isn't to say 'We can never know.' It's to say 'Looking at the past alone is not enough.' We have tools the game didn't give you: Comparison, Experimentation, and Local Knowledge. Use those."

  ---

  ## 8. Facilitator Cheat Sheet (For Your Pocket)

  *   **Start:** Prosperity 10.
  *   **Round 1:** Read Event 1. End Prosperity 8.
  *   **Round 2:** Read Event 2. End Prosperity 6.
  *   **Round 3:** Read Event 3. End Prosperity 4.
  *   **The Bet:** Watch where they put chips.
  *   **The Reveal:** Open all 3 Envelopes. Show that *all* explain the 10-8-6-4 drop.
  *   **The Win Condition:** There is no winner. The "Win" is the room realizing they couldn't distinguish the worlds.

  ## 9. Why This Works for Your Committee

  1.  **It Validates Everyone:** The "Colonialism" person, the "Disease" person, and the "Culture" person all see their theory represented in one of the Three Engines. No one is told they are "wrong" about the world; they are told they are "uncertain" about the specific lever.
  2.  **It Protects Your Volunteers:** By using "Ostra" and abstract numbers, your Ghanaian and Malawian volunteers are not put in the position of defending their homes against reductionist theories. They can play the "Field Agent" role and offer nuanced input without it being personal.
  3.  **It Shifts the Argument:** The next time they row, you can say, "Are we arguing about the History, or are we arguing about the Engine? How do we test the Engine?"

  This design turns a philosophical problem into a tactile experience. They will remember the feeling of betting their chips and realizing the rules were hidden. That feeling is the seed of intellectual humility.
