      *   Turn 2: No funding.
      *   Engine 1: Order 8. Output 8.
      *   Engine 2: Health 8. Output 8.
      *   Engine 3: Roll -1. Output 8.
      *   Turn 3: No funding.
      *   All Output 7.
      *   *Perfect.* The visible history is identical. The cause is different. The fix is different.

