      *   *Tone Check:* Ensure they interrupt each other, reference previous points, and show frustration.

  6.  **Writing the Dialogue:** (Mental Outline)
      *   Start with the "Is it just counterfactuals?" question.
      *   Move to Suzy/Billy.
      *   Elena tries to save Lewis with intermediate steps. Marcus shows the break at the end.
