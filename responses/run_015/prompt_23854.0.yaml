answer: |-
  **Setting:** *A university faculty lounge, late evening. Empty coffee cups and scattered papers cover the table. ELENA (defending Lewis) and MARCUS (defending Woodward) are leaning forward, the argument having burned through the initial pleasantries.*

  **ELENA:** You keep insisting that Woodward's interventionism is a *replacement* for Lewis. But look at the semantics. When Woodward says "an intervention on $X$ with respect to $Y$," he defines it using counterfactuals. An intervention $I$ must be such that $I$ causes $X$, and $I$ is uncorrelated with any other cause of $Y$. That's all counterfactual dependency talk. So, don't tell me this is a new foundation. It's the old house with better plumbing.

  **MARCUS:** Better plumbing is an understatement, Elena. It's the difference between mapping a territory by guessing which paths look "closest" to reality and actually checking which levers move the machinery. Lewis's "closest possible worlds" is metaphysically obscure. How close is close? Similarity in what respects? Woodward replaces that vagueness with a manipulationist semantics: $X$ causes $Y$ if wiggling $X$ wiggles $Y$. That's not just plumbing; it's a different architectural load-bearing wall.

  **ELENA:** But the "wiggling" is evaluated via counterfactuals! "If we were to intervene..." You haven't escaped the counterfactual framework; you've just restricted the domain of relevant counterfactuals to those involving "surgical" interventions. My worry is that you haven't solved Lewis's problems; you've just hidden the difficulty in the definition of "surgical."

  **MARCUS:** That's exactly what we need to test. Let's take the case that broke Lewis's 1973 account. Late preemption. Suzy and Billy. Suzy's rock shatters the bottle. Billy's rock would have done it a split second later. Intuitively, Suzy is the cause. Billy is not. Can your Lewisian machinery derive that without begging the question?

  **ELENA:** The 1973 account? No. Lewis admitted that. If Suzy hadn't thrown, the bottle still shatters because Billy's rock is there. So, $\neg S \square\to \neg Sh$ is false. Direct counterfactual dependence fails. But Lewis didn't stop there. He introduced the *ancestral* of dependence. Causation is a chain of stepwise dependencies. Suzy's throw causes the rock to be in mid-flight; the rock in mid-flight causes the shattering.

  **MARCUS:** In *early* preemption, that works. In *late* preemption, it breaks. Why? Because the backup process is *late*. At the moment Suzy's rock is in mid-flight, Billy's rock is also in mid-flight. If Suzy hadn't thrown, Billy's rock would still be in mid-flight at that moment. So even the intermediate event—the rock being in flight—doesn't counterfactually depend on Suzy's throw, because Billy's rock would have occupied that same causal role. The chain is severed before it reaches the effect. Lewis tried to patch this with "quasi-dependence" in the Postscripts, and then "influence" in 2000. But isn't that just retrofitting the theory to match the intuition?

  **ELENA:** It's not retrofitting; it's refining the granularity. The "influence" account says causation isn't binary; it's about patterns of counterfactual covariation. If Suzy had thrown slightly differently, the shattering would have been slightly different. If Billy had thrown slightly differently, the shattering would have been *exactly the same*, because Suzy's rock got there first. So Suzy exerts influence; Billy does not. That captures the asymmetry without abandoning counterfactuals.

  **MARCUS:** But to get that result, you have to hold fixed the fact that Billy's rock *doesn't* hit. You're evaluating the counterfactual "If Suzy varies, does the shattering vary?" only under the condition that Billy's rock is effectively removed from the picture at the critical moment. But why are you allowed to hold that fixed? In the actual world, Billy's rock is present and dangerous. If you remove Suzy, Billy's rock *does* hit. To get your "influence" verdict, you have to artificially suppress Billy's contribution in the counterfactual evaluation. That looks like you're building the answer into the similarity metric for possible worlds. You're saying, "Find the world closest to actuality where Suzy varies, but... ignore Billy's backup." That's the "miracle" Lewis talked about, and it feels ad hoc.

  **ELENA:** Fair. The similarity metric is the weak point. I'll grant you that. But now turn the table. How does Interventionism handle this without the same sin? You say $S$ causes $Sh$ if an intervention on $S$ changes $Sh$. Okay. I intervene on Suzy: I stop her from throwing ($S=0$). What happens to the bottle ($Sh$)?

  **MARCUS:** It still shatters. Because Billy throws.

  **ELENA:** Exactly. So on the simple interventionist test, $S$ is not a cause of $Sh$. Because $P(Sh | do(S=0)) = 1$. To get the result that Suzy *is* the cause, you have to intervene on $S$ while holding something else fixed. You have to hold fixed the fact that Billy's rock *does not hit*. But how do you justify holding that fixed? If I stop Suzy, Billy's rock *does* hit. To hold "Billy's rock hitting" at 'no' while setting Suzy to 'no' requires a second intervention on Billy. But if you intervene on Billy, you're testing a double intervention. You're not testing Suzy's causal power anymore; you're testing Suzy's power in a world where Billy is disabled.

  **MARCUS:** Hold on. You're conflating the variables. In a proper causal model, we don't just have $S$ (Suzy throws) and $Sh$ (Shatters). We need a variable for the *process*. Let $B_{hit}$ be "Billy's rock hits the bottle." In the actual world, $S=1$, $B_{hit}=0$ (because Suzy preempted him), $Sh=1$. To test if $S$ causes $Sh$, we intervene on $S$ ($S=0$). Now, what do we hold fixed? We hold fixed the *structural equations* governing the backup.

  **ELENA:** Which say what?

  **MARCUS:** They say $B_{hit}$ depends on $S$. Specifically, $B_{hit} = 1$ if $S=0$ (assuming Billy throws). So if I intervene $S=0$, the model dictates $B_{hit}$ becomes 1, and $Sh$ remains 1. So $S$ is not a cause. Wait. That's the problem I'm trying to solve.

  **ELENA:** *Smiles.* See? You're stuck in the same trap.

  **MARCUS:** No, no. The interventionist solution requires modeling the *timing* or the *redundancy* explicitly. We introduce a variable $D$ for "Bottle shatters due to Suzy" and $E$ for "Bottle shatters due to Billy." $Sh = D \lor E$. $D$ depends on $S$. $E$ depends on $B_{hit}$. $B_{hit}$ depends on $S$ (negatively, because Suzy preempts). Now, to test $S \to Sh$, I intervene on $S$. If I set $S=0$, $D$ becomes 0. But $E$ becomes 1 because $B_{hit}$ becomes 1. So $Sh$ is still 1.
  The only way to make $S$ look like a cause is to hold $B_{hit}$ fixed at 0 during the intervention on $S$. But $B_{hit}$ is a descendant of $S$ in the causal graph (Suzy's throw prevents Billy's hit). Standard causal modeling says you *cannot* hold descendants fixed when testing a cause. If you do, you're blocking the very path you're testing. But if you *don't*, the backup mechanism triggers, and $S$ looks irrelevant.

  **ELENA:** Precisely. So you have to make an exception. You have to say, "When testing for actual causation in preemption cases, hold the backup process fixed at its *actual* value, even if it's a descendant." But what licenses that? It looks like you're saying, "We know Suzy is the cause, so we construct the test that yields that result." If you apply that rule generally, you break the theory. If I hold all descendants fixed, I can prove anything is a cause. If I hold none fixed, I prove nothing is a cause in redundancy cases. Where is the principled line?

  **MARCUS:** The line is *independent fixability*. Woodward argues that for a set of variables to be legitimate for causal modeling, they must be independently fixable. In the Suzy/Billy case, the problem is that we are treating "Billy's rock hits" as a variable that is automatically determined by Suzy's throw. But physically, Billy's trajectory is independent of Suzy's. The *collision* is not.
  The interventionist move is to distinguish between the *threat* and the *realization*. We intervene on Suzy ($S=0$). We ask: Is there *any* legitimate intervention that changes $Sh$? Yes, if we intervene on $S$ *and* we consider the path through $S$ to $Sh$ while treating Billy's trajectory as a background condition that *could* be intervened on separately.
  Actually, let's be more precise. Woodward handles this via the notion of a *redundancy range*. We test $S$ against $Sh$ holding fixed variables that are not on the causal path. The trick is that Billy's *throw* is not on the causal path from Suzy to Shattering. Billy's *rock hitting* is. But Billy's rock hitting is 0 in the actual world.
  The claim is: $S$ causes $Sh$ because there is a directed path $S \to Sh$ such that if we intervene on $S$, $Sh$ changes, *provided* we hold fixed the variables not on this path. Billy's *throw* is not on the path. So we hold Billy's *throw* fixed at 'Yes'. But we must evaluate the structural equation for $Sh$.
  If $Sh = 1$ if ($S=1$) OR ($B_{throw}=1$ AND $S=0$).
  If I intervene $S=0$, and hold $B_{throw}=1$, then $Sh=1$.
  So $S$ is still not a cause.
  Okay, I see the corner you've painted me into.

  **ELENA:** Good. So you see the structural isomorphism. Lewis needs to fiddle with "closeness" to suppress Billy's backup in the counterfactual world. You need to fiddle with "which variables to hold fixed" to suppress Billy's backup in the intervention. Both of you are essentially saying: "Evaluate the dependence of $E$ on $C$, but ignore the backup mechanism." Lewis calls it a "quasi-dependence" intrinsic to the process; you call it "holding fixed the actual value of the backup." But neither of you derives this from the core theory. You add it because the core theory gives the wrong answer.

  **MARCUS:** But there *is* a difference in the *why*. Lewis's "closeness" is metaphysical. It asks about the nature of possible worlds. My "holding fixed" is methodological. It asks about the modularity of the system.
  Here's the defense: In interventionism, we aren't just asking "What if?" We are asking "What if we *manipulated*?" In a laboratory, if I want to know if Suzy's throw caused the break, I don't just imagine Suzy not throwing. I set up a screen to block Suzy's rock *after* the throw but *before* the hit. That is an intervention on the *process*, not the decision.
  If I block Suzy's rock, Billy's rock hits. So the *rock's flight* isn't the cause? No, the *throw* is the cause because it initiated the process that *actually* connected.
  Woodward's real answer to preemption involves the *stability* of the relationship. The relationship between Suzy's throw and the shattering holds across a range of background conditions. The relationship between Billy's throw and the shattering only holds in the specific background condition where Suzy fails. Suzy's causal claim is more robust.

  **ELENA:** Robustness? Now we're moving the goalposts from "intervention" to "stability." That's a new criterion. And is it true? Suzy's throw only causes shattering if the bottle is there, gravity works, etc. Billy's throw only causes shattering if Suzy misses. Why is "Suzy misses" a less legitimate background condition than "Gravity works"?
  You're relying on a normative distinction between "normal" conditions and "deviant" conditions. Suzy throwing is the active process; Billy waiting is the passive background. But that's not in the physics. That's in our narrative.
  This brings me back to my opening point. Interventionism isn't a new theory of *causation*; it's a new theory of *explanation*. You're telling me what it takes to *verify* a causal claim, not what makes it true. Lewis is trying to tell you what makes it true. When you run into preemption, you have to smuggle in the truth conditions to guide your verification method. You hold the backup fixed *because* you know it's a backup. But you can't know it's a backup without already knowing the causal structure you're trying to discover.

  **MARCUS:** That's the circularity charge. I deny it. We identify the variables through empirical modularity, not prior causal knowledge. We know Billy's rock is a separate physical object. We can intervene on it independently. The causal model is built from the bottom up.
  But... I will concede this: The *choice* of variables matters. If I model the system as {$S$, $Sh$}, I get one result. If I model it as {$S$, $B_{trajectory}$, $B_{hit}$, $Sh$}, I get another. The theory doesn't tell me which variables to pick. It assumes I've already carved the world at its joints.
  Lewis's theory assumes I know how to compare worlds.
  Maybe we're both stuck with the same primitive: a grasp of causal structure that the theory is supposed to analyze but actually presupposes.

  **ELENA:** So, is interventionism just Lewis with better variable hygiene?

  **MARCUS:** It's Lewis with a clearer instruction manual for how to apply the counterfactuals. Lewis says "Look for the closest world." The scientist asks "Which one is that?" Woodward says "Look for the world resulting from a surgical intervention." The scientist asks "How do I perform that surgery?"
  In the Suzy/Billy case, the "surgery" requires cutting the link between Suzy's failure and Billy's success. That requires a physical intervention (e.g., catching Billy's rock). If you do that, $S$ makes a difference. If you don't, it doesn't.
  So, is Suzy a cause? Only relative to a model where Billy's backup is neutralized.
  But that implies causation is model-relative.

  **ELENA:** And Lewis implies causation is similarity-metric-relative.
  If causation depends on the model or the metric, have we analyzed causation, or just systematized our intuitions about it?
  We started with the intuition: Suzy caused it.
  Lewis tweaks the worlds to match the intuition.
  You tweak the variables to match the intuition.
  Neither derivation is clean.

  **MARCUS:** But my tweaks correspond to physical manipulations. Lewis's tweaks correspond to... judgments of similarity. If I build a machine that blocks Suzy's rock, I have physically created the counterfactual world. Lewis's "closest world" might not be physically accessible.
  Does that matter?

  **ELENA:** It matters for science. It might not matter for metaphysics. If we are doing metaphysics, asking "What is the nature of the relation?", your appeal to "what a scientist could do" seems anthropocentric. Causation existed before there were agents to intervene.
  If we are doing methodology, your account is superior.
  But the prompt of our argument was whether Interventionism solves the *theoretical* problems of Counterfactualism.
  If the Late Preemption case requires both of us to add a "preemption clause"—Lewis with quasi-dependence, you with specific variable fixing—then the structural problem remains. The problem is that counterfactual dependence is too brittle for redundancy.
  You haven't fixed the brittleness. You've just given us a tool to identify which brittle counterfactuals are the "right" ones. But the criteria for "right" seem to rely on the very causal facts we are trying to derive.

  **MARCUS:** I'm not sure I can deny that. The "independent fixability" of variables assumes a causal modularity. If the universe is a dense web where everything is connected, the idea of "holding everything else fixed" is an idealization.
  But isn't Lewis's "ceteris paribus" in world similarity the same idealization?
  We are both positing a structure of independence to make the counterfactuals work.
  Perhaps the disagreement isn't about the logic, but the ontology. You want the counterfactuals to be true in virtue of laws and facts. I want them to be true in virtue of manipulation possibilities.
  But in the case of Late Preemption, both of us need to appeal to the *intrinsic nature of the process* to break the symmetry between Suzy and Billy. Lewis says it explicitly (quasi-dependence). I say it implicitly (variable selection).

  **ELENA:** So, we are both quasi-realists about causation? We project a structure onto the world to make sense of the dependencies?

  **MARCUS:** Or we both acknowledge that "causation" isn't a single relation waiting to be found, but a concept that serves different purposes. Lewis wants to capture the metaphysical glue. I want to capture the experimental leverage.
  In Late Preemption, the "metaphysical glue" is hard to distinguish from the "backup glue." The "experimental leverage" is clear *if* you can isolate the variables. But you can't always isolate them.
  So, did I win?

  **ELENA:** Did I win?

  **MARCUS:** *Laughs and leans back.* We both derived the intuitive verdict, but only by importing assumptions that do the heavy lifting. You imported a similarity metric that privileges the actual process. I imported a variable set that privileges the actual process.
  The theory didn't give us the answer. The theory gave us a language to justify the answer we already had.

  **ELENA:** Then the disagreement about whether Interventionism is a "genuine advance" dissolves. It's an advance in *clarity of application*, not in *logical sufficiency*. It escapes the vagueness of "closeness" by replacing it with the vagueness of "modularity."

  **MARCUS:** I can live with that. But I still think "surgical intervention" is a more useful vagueness than "closest possible world." One invites me to build a better experiment. The other invites me to think harder about metaphysics.

  **ELENA:** And I still think you can't define "surgery" without invoking "cause," so you're circular. But... I admit your circularity is more productive for my graduate students.

  **MARCUS:** *Raises coffee cup.* To circularity, then?

  **ELENA:** *Clinks her mug against his.* To the hope that the circle is wide enough to look like progress.
