  WHAT I GRANT
  I grant you that 'notion' serves for spirits where 'idea' fails, and that words may function without raising particular images.

  THE REPLY
  You say this PROPOSITIONAL SUPPOSITION escapes the net because it lacks an image. But I ask you: what is the content of this supposition? To suppose a thing exists is to suppose it perceived. You cannot separate the *esse* from the *percipi*. When you suppose the tree unconceived, you conceive it yourself; the contradiction lies in the object, not the word. As for notions: they belong to active beings, to wills and spirits. Matter is defined as inert, passive, dead. How can you have a notion of that which does nothing? Your 'simulation' is no escape. You claim no one needs to watch it run. I say if no mind perceives the states, the machine does not run. To be 'written down' is to be an idea to God. To follow 'rules' is to obey God's will. You have merely renamed ideas 'states' and God's will 'rules,' yet insist something remains when God looks away. But He never looks away. You cannot hide a simulation from the Omnipresent Eye. The Master Argument holds: to be is to be perceived. Your supposition proves my point, for you cannot suppose the existence without the perception.

  YOUR MOVE
  If your simulation runs without any mind perceiving its states, what distinguishes this existence from pure nothing?
