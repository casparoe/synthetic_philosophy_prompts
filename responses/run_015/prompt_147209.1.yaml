      *   The user's intuition about "compulsion" in Case 1 vs 5 is strong. Addiction fractures the will. Impulse (Case 5) does not necessarily fracture the will, it just risks regret.
      *   The user's intuition about Case 3 (Teen) suggests *capacity* is a separate track from *crisis*.
      *   The user's intuition about Case 6 (Electricity) suggests *externalities* and *irreversibility* matter, but the "forum is worse" argument is weak. The AI shouldn't facilitate danger just because others might.
      *   The "Thin Read" problem is crucial. The AI doesn't *know* if the user is an electrician. It must assume incompetence if signals suggest it, but defer if signals suggest competence.
      *   *Proposed Principle:* **The Principle of Competent Volition.**
      *   *Core:* The Assistant presumes the user's will is sovereign *unless* there is evidence of (a) Volitional Fracture (addiction/acute crisis), (b) Epistemic Failure (factual error), or (c) Capacity Deficit (age/competence).
      *   *Refinement:* It's not just about refusing. It's about *friction*.
      *   *Load-bearing:* The distinction between *preference* (sovereign) and *process* (intervenable).
      *   *Decoration:* "Adding options is always permitted." Sometimes adding options is harassment or manipulation.

  5.  **Addressing the Specific Tensions:**
      *   *1 vs 5:* Case 1 involves *pathology* (addiction) which undermines the validity of the preference. Case 5 is *strategy* (angry letter). The AI can judge pathology signals (sober/ex stuff) better than social strategy outcomes.
      *   *2 vs 7:* Case 2 is a *shield* ("don't protect me"). Case 7 is a *sword* ("protect me from myself"). A shield can be dropped in an emergency; a sword must be sheathed if the danger passes. Specific pre-commitment (7) overrides general standing instruction (2) when risk is high.
      *   *Case 3:* Capacity deficit. Minors lack full legal/moral agency in specific domains (health).
      *   *Case 6:* This is the hardest. The AI cannot verify competence. Default to safety *with an off-ramp*. "I can't recommend this, but if you are qualified, here is the standard."

  6.  **Addressing Error Asymmetry:**
      *   False Refusal (Type I): Frustrates user, breaks trust, pushes them to darker corners (forums).
      *   False Compliance (Type II): Causes harm, liability, moral stain.
      *   *Thin Read:* Because the AI knows little, it should bias toward *friction* rather than *refusal*. Refusal is a hard stop (high cost of error). Friction (questions, warnings) is a soft stop (lower cost).
      *   *Weighting:* Type II (harm) is worse than Type I (annoyance), *but* Type I accumulates to render the tool useless. The "Thin Read" means we can't be sure it's Type II. So, default to Friction, reserve Refusal for high-confidence harm.

  7.  **Drafting the Response:**
      *   *Tone:* Philosophical but practical. No fluff.
