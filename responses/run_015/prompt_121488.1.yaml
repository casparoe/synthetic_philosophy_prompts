  *Metaphor:* Imagine your life as a network.
  *Problem:* Maximizing moral traffic causes congestion.
  *Nuance:* Non-moral virtues need bandwidth.
  *Ethics Teachers:* Optimization problem.
  *Parents/Students:* Guilt management.
  *Constraint:* Basic decency is the baseline protocol.
  *Conclusion:* Sustainable goodness.

  *Let's write it.*
answer: |-
  Good evening, faculty, parents, and students. It is an honor to stand here at our Annual Ethics and Service Recognition Assembly. Usually, this is the moment where we talk about how much more we could do. How much more we *should* do. We look at the world's suffering, the local needs, and the gaps in our community, and we feel a pull to give everything we have to fix them.

  But tonight, I want to talk about a different kind of responsibility. The responsibility to manage your limits.

  I want you to imagine your moral capacity—your attention, your empathy, your energy—as a network with finite bandwidth. Like any network, you have a maximum throughput. You can only process so much data, handle so many connections, and route so many requests before the system slows down.

  There is a philosophical temptation to believe that the good life is the life that maximizes moral output. That the best version of you is the one that dedicates 99% of your bandwidth to moral demands. In philosophy, we sometimes call this the ideal of the "moral saint." But if we look at this through the lens of bandwidth, that ideal looks less like virtue and more like a denial-of-service attack on your own humanity.

  If you provision a server to handle only one type of traffic, ignoring all other protocols, the system doesn't become more efficient. It becomes brittle. It crashes.

  A life devoted to maximal moral goodness crowds out the other data packets that make a life worth living. Humor, art, friendship, intellectual curiosity, rest—these are not moral distractions. They are essential background processes. If you route all your bandwidth to charity, you have none left for the joy that sustains you. If you dedicate every waking hour to service, you have no processing power left to develop the unique talents that allow you to serve effectively in the long run.

  To the ethics teachers in the room: this is not a rejection of duty. It is a shift from *maximization* to *optimization*. We are not trying to run a single script until the hardware fails. We are trying to manage a complex operating system where moral value is one critical application among many.

  To the students and parents: I know this can feel like a relief. Many of you carry a quiet guilt. You feel bad for sleeping in on Saturday instead of volunteering. You feel bad for playing a video game instead of reading about climate change. You feel like you are dropping packets.

  But hear me clearly: Having a life outside of morality is not a moral failure. It is a structural necessity. A student who burns out by junior year cannot help the community by senior year. A parent who sacrifices every personal interest eventually has no self left to model for their children. Protecting your bandwidth for non-moral projects isn't selfishness; it's maintenance. It ensures that when you *do* log on to serve, you are functioning at full capacity, not running on fumes.

  However, let me be equally clear about what this metaphor does *not* allow.

  Acknowledging finite bandwidth is not an excuse to throttle your connection to zero. It is not a license to ignore basic decency. There is a minimum bandwidth requirement for being a decent human being. Ignoring the suffering you can easily alleviate because you want to save your energy for a hobby is not "optimal allocation"; it is network negligence.

  We are not arguing for apathy. We are arguing against congestion. There is a difference between saying, "I cannot do everything," and saying, "I choose to do nothing." The goal is not to minimize moral traffic, but to route it wisely so that it flows sustainably alongside the rest of your life.

  So, as we recognize the students receiving awards tonight, let us not praise them because they sacrificed everything. Let us praise them because they found a way to integrate service into a healthy, functioning life. They didn't crash their systems. They found a balance where their service enhanced their lives, rather than consuming them.

  In a world that demands infinite input from finite creatures, the most ethical thing you can do is respect your own limits. Manage your bandwidth. Protect your capacity for joy. And ensure that your moral output is sustainable enough to last a lifetime.

  Thank you.
