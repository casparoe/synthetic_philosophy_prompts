prompt: |-
  I have been asked to deliver the keynote address at my high school’s annual Ethics and Service Recognition Assembly, to be held in the auditorium next Thursday. The audience will be mixed: mostly students and parents with no philosophy background, plus several faculty members—including two ethics teachers—who will catch every conceptual reference. I want the speech centered on the problem of moral sainthood, specifically the argument associated with Susan Wolf that a life of maximal moral goodness may fail to be desirable because it crowds out personal projects and non-moral virtues. Rather than summarizing this view, I want to restructure it through a framing I am calling “moral bandwidth”: the idea that moral attention and emotional energy function like a network with finite throughput, where devoting nearly all capacity to moral demands creates congestion that degrades other essential functions of a life. This idea should do real structural work in the speech—it must not claim that morality is unimportant, nor present moral saints as blameworthy, but it should argue that the appropriate goal is optimal allocation across domains rather than maximization within one. The speech should be about five minutes long, accessible to parents, genuinely engaging for the ethics teachers, and comforting to anyone who feels guilty for not being a moral saint, without letting the audience off the hook for basic decency. Please write the speech, using the bandwidth framing throughout—for instance, comparing a life of pure moral maximization to an over-provisioned server that crashes under its own load—so that what can and cannot be said is shaped by the idea that moral capacity is a resource to be distributed wisely, not merely expanded without limit.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Occasion:** High School Annual Ethics and Service Recognition Assembly.
      *   **Venue:** Auditorium.
      *   **Time:** Next Thursday (implies a formal but celebratory tone).
      *   **Audience:** Mixed (Students, Parents, Faculty including two Ethics Teachers).
      *   **Topic:** The problem of moral sainthood (Susan Wolf's argument), restructured through the metaphor of "Moral Bandwidth."
      *   **Key Constraint 1 (Content):** Do not simply summarize Wolf. Use the "bandwidth" metaphor structurally.
      *   **Key Constraint 2 (Tone):** Accessible to laypeople, engaging for experts (ethics teachers), comforting to the guilty, but not letting people off the hook for basic decency.
      *   **Key Constraint 3 (Argument):** Morality is important, saints aren't blameworthy, but the goal is *optimal allocation*, not *maximization*.
      *   **Key Constraint 4 (Metaphor):** Use technical/network analogies (finite throughput, congestion, over-provisioned server crashing).
      *   **Length:** About 5 minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Deconstruct the "Moral Bandwidth" Metaphor:**
      *   *Bandwidth:* Finite capacity for attention, empathy, and action.
      *   *Congestion:* Burnout, loss of self, inability to function in other areas (humor, art, friendship).
      *   *Server Crash:* A life that collapses because it tries to process too much moral data without room for personal OS.
      *   *Optimal Allocation:* Routing traffic wisely. Some packets go to charity, some to family, some to hobbies.
      *   *Not a Bug, but a Feature:* Limits aren't failures; they define a human life.

  3.  **Drafting - Section by Section:**

      *   **Introduction (1 minute):**
          *   Welcome the audience.
          *   Acknowledge the purpose (recognizing service).
          *   Introduce the tension: We want to be good, but how good is *too* good?
          *   Introduce the "Bandwidth" metaphor immediately.

      *   **Body Paragraph 1: The Trap of Maximization (1.5 minutes):**
          *   Define the "Moral Saint" ideal (maxing out the meter).
          *   Apply the server analogy. If you dedicate 99% of bandwidth to moral traffic, what happens to the rest?
          *   Reference Wolf implicitly (without naming her necessarily, or just briefly) via the concept of "crowding out."
          *   Example: The student who tutors 24/7 but has no friends or joy.

      *   **Body Paragraph 2: The Value of Non-Moral Traffic (1.5 minutes):**
          *   Why do we need bandwidth for hobbies, humor, rest?
          *   These aren't distractions from morality; they sustain the *capacity* for morality.
          *   Address the Ethics Teachers: Acknowledge the philosophical weight (optimization vs. maximization).
          *   Address the Parents/Students: It's okay to play video games or read fiction.

      *   **Body Paragraph 3: Avoiding the "Let Off the Hook" Problem (1 minute):**
          *   Crucial pivot. This isn't an excuse for selfishness.
          *   Basic decency is the *minimum* bandwidth requirement, not the maximum.
          *   Don't confuse "balance" with "apathy."
          *   Congestion management isn't about dropping packets of kindness; it's about routing them sustainably.

      *   **Conclusion (1 minute):**
          *   Bring it back to the award recipients.
          *   They didn't max out; they allocated wisely.
          *   Final call to action: Manage your bandwidth, don't burn out.
          *   Closing thought: A sustainable life is a moral life.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I name-drop Susan Wolf too academically? *Correction:* Keep it subtle. The prompt says "argument associated with Susan Wolf" but "rather than summarizing this view." I should focus on the *idea* using the metaphor, maybe mentioning her name once for the teachers' sake but explaining it through bandwidth.
      *   *Check:* Is the tech metaphor too dry? *Correction:* Warm it up. Connect "server crash" to "burnout" or "losing your spark."
      *   *Check:* Is it 5 minutes? *Correction:* Word count check. 800 words is usually safe for 5 minutes with pauses.
      *   *Check:* Is the tone right? *Correction:* Ensure it sounds like a speech (rhetorical questions, direct address).
      *   *Check:* Did I meet the "not letting off the hook" constraint? *Correction:* Make sure there's a specific paragraph on basic decency being non-negotiable.

  5.  **Final Review against Constraints:**
      *   *Bandwidth framing throughout?* Yes.
      *   *Optimal allocation vs. maximization?* Yes.
      *   *Accessible yet deep?* Yes.
      *   *Comforting but demanding?* Yes.

  6.  **Final Polish:** (Writing the speech based on the above plan.) *Self-correction: Ensure the transition from the tech metaphor to human emotion is smooth.* (e.g., "We are not servers, but we do have limits.")

  7.  **Word Count Check:** Aiming for ~850 words.

  *(Drafting process begins...)*
