      *   **Task:** Evaluate the scribbled questions (duds, duplicates, missing pieces), rank them, and provide a concrete agenda.

  2.  **Evaluate the Scribbled Questions:**

      *   *Question 1 (Crypto analogy):* Is worst-case in alignment like worst-case in crypto?
          *   *Verdict:* High conceptual importance, but risky for a non-academic. It's easy to get bogged down in technicalities of complexity theory without adding value to the *alignment* specific debate. However, debunking or validating this analogy is crucial because the "provably safe" camp often leans on crypto intuitions.
          *   *Status:* Keep, but refine focus to *why* the analogy fails/succeeds in practice, not just theory.

      *   *Question 2 (Moving Distribution/Endogenous Inputs):* Systems shape their own inputs/deployment. Average over what?
          *   *Verdict:* **Winner.** This is the strongest point. It attacks the core assumption of the "average-case" camp (that there is a stable distribution to optimize for) without requiring the impossible burden of the "worst-case" camp (all possible inputs). It's tractable for a coder (simulations, thinking about feedback loops), neglected (most assume static distributions), and high leverage (if the distribution moves, empirical safety is much harder than claimed).
          *   *Status:* Top priority.

      *   *Question 3 (99.99th Percentile / Tail Risk):* Why not compromise on tail risk?
          *   *Verdict:* Important, but often discussed under "robustness" or "red teaming." It might be a subset of Q2. If the distribution moves (Q2), the 99.99th percentile moves too.
