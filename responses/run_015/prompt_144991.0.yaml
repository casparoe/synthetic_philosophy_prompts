answer: |-
  Good morning. Welcome to "One Mind or Many? Consciousness After Commissurotomy."

  Looking around this room, I am struck by a convergence that is unfortunately rare in our field. On one side, we have the clinicians and surgeons who actually evaluated these patients, who hold the tactile memory of the clinic and the raw data of behavior. On the other, we have philosophers and cognitive scientists whose understanding has often been mediated by textbooks and secondary summaries. For the next two days, our goal is to close that gap. We are not here to recycle old debates, but to test them against the actual structural constraints of the evidence.

  The title of this workshop is provocative, but it invites a trap. We must avoid the Scylla of pop-science sensationalism—the claim that a divided brain literally houses two distinct people fighting for control. But we must equally avoid the Charybdis of excessive reductionism—the dismissal of hemispheric dissociation as merely behavioral noise with no philosophical weight. Neither extreme respects the data. To navigate between them, we need a sharper conceptual tool.

  I propose we structure our discussions around a specific distinction: the difference between *executive unity* and *phenomenal unity*.

  By executive unity, I mean the capacity to initiate and maintain a single coherent course of action. It is the ability of the organism to steer itself toward a goal without internal conflict. By phenomenal unity, I mean the subjective sense that experiences belong to one owner. It is the "what it is like" to be the subject of those experiences.

  In the intact brain, we assume these two forms of unity travel together. If you can act as one, we assume you feel as one. If you feel as one, we assume you will act as one. This assumption is so deeply embedded in our folklore of the mind that we rarely notice it is an assumption at all.

  This is where the commissurotomy literature acts not as colorful decoration, but as a live structural constraint. The clinical data demonstrates clear fractures in executive unity. We have records of hands buttoning shirts while other hands unbutton them, of conflicting responses to visual fields. The capacity for a single coherent course of action is undeniably compromised.

  But does phenomenal unity fracture alongside it? The data does not give us a free pass to say "yes," nor does it allow us to say "no." It forces us to uncouple the concepts. It demands we ask whether a subject can experience a unified field of consciousness even while their executive control is fragmented, or vice versa. If we treat the literature rigorously, we cannot simply project our intact intuitions onto these cases.

  To our clinical colleagues: Your role is to keep us honest about what the patients could and could not do. Remind us when a theoretical claim outruns the behavioral evidence. To our students and theorists: Your role is to ensure we do not mistake a conceptual confusion for a empirical discovery. Let the data constrain the metaphysics, not the other way around.

  If we can maintain this rigor, respecting both the clinical reality and the conceptual stakes, this workshop will be a significant step forward. Thank you for being here. Let us begin.
