answer: |-
  Here is the decomposition of the "reverse-forgery" problem, my credence assignments, and the analysis of where the philosophical weight actually lies.

  ### The Core Question
  **What is my credence that >50% of the value gap remains when viewers know they are viewing the molecular replacement?**

  **My Credence: ~70%**

  I believe your friend is likely wrong. Even with perfect physical identity, the revelation that the object is a replacement typically triggers a significant devaluation. This is not merely a "bug" in human psychology but reflects deep-seated intuitions about what art *is*.

  ### Decomposition & Credence Assignment

  To arrive at that 70%, I have assigned probabilities to the four specific sub-claims you requested. These are not independent events in a strict mathematical sense, but they function as necessary conditions or strong drivers for the conclusion.

  **1. Prob that aesthetic value has a non-epistemic causal-historical component: 0.55**
  *   **Reasoning:** This is the metaphysical heart of the dispute. If art value is purely perceptual (aesthetic empiricism), the history doesn't matter. If art value is partly constituted by its genesis (historical essentialism), the copy is ontologically inferior.
  *   **Why not higher?** This is fiercely contested. A strict physicalist argues that if the photons hitting the eye are identical, the aesthetic experience is identical. I assign 0.55 because while the art *market* and *institutions* act as if history matters, it is not settled that this is a rational feature of *aesthetic* value rather than a fetishization of provenance.

  **2. Prob that viewers' reported preferences are mostly belief-driven about origin rather than direct perceptual differences: 0.85**
  *   **Reasoning:** This is an empirical psychological claim. Studies on "contagion" and "essentialism" show that humans value objects touched by famous people or created by specific agents significantly higher than identical duplicates.
  *   **Why so high?** There is robust experimental evidence (e.g., from psychology of art and behavioral economics) that knowledge of origin overrides perceptual data in valuation. Even if the visual experience is identical, the *narrative* of the object drives the economic and sentimental value.

  **3. Prob that artistic achievement is partly constituted by the actual historical act, not just the result: 0.75**
  *   **Reasoning:** This focuses on the artist, not the viewer. Art is often valued as a record of human problem-solving. A Vermeer is valuable not just because it looks like a Vermeer, but because Vermeer solved the problem of light and composition *in that moment*. A machine scan bypasses the achievement.
  *   **Why not higher?** Some conceptual art challenges this (e.g., readymades or instruction-based art where the artist doesn't touch the object). However, for a traditional portrait, the "hand of the master" intuition is strong.

  **4. Prob that the reverse-forgery scenario is conceptually coherent: 0.75**
  *   **Reasoning:** This asks if a "molecular copy" is metaphysically possible in art. Some philosophers (following Nelson Goodman) argue that in "autographic" arts like painting, the history of production is part of the work's identity. Therefore, a copy is *by definition* a different work, regardless of physical similarity.
  *   **Why not higher?** If Goodman is right, the scenario is incoherent; you cannot have a "perfect replacement" of an autographic work, only a forgery. I grant 0.75 coherence because we can imagine the physical duplicate, even if art ontology rejects its identity.

  ### How They Combine

  To estimate the probability that the **Value Gap Remains**, we look at the logical structure:

  *   The scenario must be coherent (**Claim 4**).
  *   **AND** either human psychology drives the gap (**Claim 2**) **OR** the value is actually historical/achievement-based (**Claim 1 & 3**).

  Even if aesthetic value *shouldn't* be historical (Claim 1 is false), if humans *believe* it is (Claim 2 is true), the reported value gap will still exist. Since your question asks about the value gap *people report*, Claim 2 is the heavy lifter.

  **Rough Calculation:**
  *   Probability the scenario holds: **0.75** (Claim 4)
  *   Probability the gap mechanism exists (Claim 2 OR [Claim 1 × Claim 3]):
      *   Claim 1 × Claim 3 (Ontological gap): $0.55 \times 0.75 \approx 0.41$
      *   Claim 2 (Psychological gap): $0.85$
      *   Combined (A or B): $1 - [(1 - 0.85) \times (1 - 0.41)] \approx 0.91$
  *   **Total Credence:** $0.75 \times 0.91 \approx \mathbf{0.68}$ (rounded to **0.70**)

  **Conclusion:** There is a ~70% chance that more than half the value gap remains. The psychological driver (Claim 2) is strong enough to sustain the gap even if the metaphysical driver (Claim 1) is weak.

  ### The Evidence Update: Blind Tests

  **Scenario:** You learn that in blind tests, people genuinely cannot distinguish originals from copies, even when confident they can.

  **Which term shifts most?**
  **Claim 2 (Belief-driven preferences) shifts most significantly upward (from 0.85 to ~0.95).**

  *   **Reasoning:** This evidence eliminates the primary rival hypothesis: that there are subtle, subconscious perceptual cues (brush texture, chemical aging) that experts detect unconsciously. If blind tests confirm perceptual indiscernibility, yet the value gap persists when provenance is revealed, it isolates *belief* as the sole causal variable for the gap.
  *   **Secondary Shift:** **Claim 1 (Non-epistemic value)** would also shift slightly *up* (from 0.55 to 0.65). If perception is identical but value differs, it proves that aesthetic value *cannot* be purely perceptual. It forces the conclusion that value resides in something non-perceptual (history), lending weight to the essentialist view.
  *   **Why Claim 2 wins:** Claim 1 is a metaphysical assertion about what value *is*. Claim 2 is a causal assertion about how humans *behave*. Empirical data regarding human discrimination thresholds directly impacts the probability of human behavior models (Claim 2) more than ontological definitions (Claim 1).

  ### Settled vs. Contested

  It is crucial not to conflate market behavior with philosophical consensus. Here is the landscape:

  **What is Settled (High Consensus):**
  1.  **Psychological Essentialism:** It is an empirical fact that humans possess a "contagion" intuition. We value objects with a specific causal history higher than duplicates, even when indistinguishable. This is robust across cultures.
  2.  **Perceptual Fallibility:** It is settled that human perception (even expert) is fallible. High-quality forgeries can and do deceive experts without scientific aid.
  3.  **Market Reality:** In the actual art market, provenance is a primary determinant of price. A known copy sells for a fraction of an original, regardless of quality.

  **What is Genuinely Contested (No Consensus):**
  1.  **The Ontology of the Work:** Is the artwork the *physical object* or the *performance of creation*?
      *   *View A:* The work is the physical structure. If the structure is copied, the work is preserved. (Physicalism)
      *   *View B:* The work includes the generative act. A copy is a new work that references the old one. (Historicism/Goodman)
      *   *Status:* Unresolved. This is the core philosophical disagreement underlying your friend's claim.
  2.  **Rationality of the Gap:** Is the devaluation of the copy a *rational* response to the loss of artistic achievement, or is it a *cognitive bias* (like the endowment effect)?
      *   *View A:* It is rational. We value art as human communication; a copy breaks the communicative chain.
      *   *View B:* It is irrational. If the experience is identical, the value should be identical. The gap is a fetish.
      *   *Status:* Unresolved. Aestheticians are split on whether "authenticity" is a constitutive value or an instrumental one.
  3.  **Modal Properties:** Does destroying the original change the modal properties of the copy? (i.e., Could the copy *have been* the original?)
      *   *Status:* Highly technical metaphysical dispute with no clear resolution.

  ### Summary
  Your friend's argument relies on **Aesthetic Empiricism** (value is only in the experience). My analysis suggests that even if Empiricism is true, **Psychological Essentialism** (Claim 2) ensures the value gap remains in practice. However, there is also substantial philosophical weight (Claim 1 & 3) suggesting the gap is *justified*, not just a psychological glitch. The "reverse-forgery" does not restore full value because it severs the causal link that constitutes the work's identity and achievement.
