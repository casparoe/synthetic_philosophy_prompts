answer: |-
  Here is the teaching plan. It is designed for a 45-minute slot, assuming 30 minutes of delivery and 15 for discussion.

  ### 1. The Spine: Order and Dependencies

  Your distinction is analytically correct, but pedagogically dangerous if followed in that order. If you begin with the metaphysics of reasons, you will lose them. They are law students; they care about argument and judgment, not ontology.

  **Recommended Order:**
  1.  **Epistemological (The Hook):** Start with their intuition that 'context matters'. Show them that Generalism *also* thinks context matters (via *ceteris paribus* clauses). The dispute is not about whether context influences judgment, but *how*.
  2.  **Metaphysical (The Core):** Use the epistemological friction to introduce the Valence Flip. This is the only place the debate actually lives. Does a feature carry its normative weight inherently, or does the context confer it?
  3.  **Explanatory (The Consequence):** Only once the metaphysics is settled ask: 'If there are no principles, how do we disagree?'

  **Dependencies:**
  *   The **Explanatory** claim depends entirely on the **Metaphysical** one. If reasons are invariant (Generalism), explanation is subsumption under a law. If reasons are holistic (Particularism), explanation is more like aesthetic criticism.
  *   The **Metaphysical** claim is best accessed through the **Epistemological** experience of making a judgment.

  **Why this order?** It moves from what they know (making judgments) to what they need to learn (the structure of reasons) to what they fear (moral chaos).

  ### 2. The Example: 'Satisfying a Need'

  Do not use the funeral joke. It invites the 'appropriateness' redescription too easily. Use **Satisfying a Need**.

  *   **Case A:** A child needs food. You give it. (The need is a reason *for* acting).
  *   **Case B:** A terrorist needs a gun. You withhold it. (The need is a reason *against* acting).
  *   **Thin Description:** 'Satisfying a need'.

  **Why it works:**
  1.  **Valence Flip:** In A, the need counts in favour. In B, the very same fact (that he *needs* it) counts against providing it.
  2.  **Resists Redescription:** The Generalist will say, "It's not a need, it's a *legitimate* need." You block this by insisting 'legitimate' is just a placeholder for 'good'. If the principle is "Satisfy legitimate needs," it is tautological, not explanatory.
  3.  **Resists Exception Clauses:** The Generalist cannot simply add "unless it causes harm" because in Case B, the need *itself* is the negative factor, not just the consequence.

  **What the example must lack:**
  It must lack a **normatively neutral contextual factor** that correlates perfectly with the valence. If you can point to a fact in the context (e.g., 'the agent is a terrorist') that is morally neutral *until* combined with the need, the Generalist wins. The Particularist claim is stronger: the context changes the *nature* of the need's contribution, not just its weight.

  ### 3. Misconceptions and Deflections

  Address these in this specific order as they arise.

  *   **'Particularism is Relativism / Anything Goes':**
      *   *The Worry:* If there are no rules, can't I just do what I like?
      *   *The Deflection:* Particularism is about the *structure* of reasons, not the absence of standards. A wine critic needs no rules to know a bad vintage. Objectivity does not require codification.
  *   **'Holism is just Context-Sensitivity':**
      *   *The Worry:* Generalists agree context matters (via *ceteris paribus* clauses). So what's the fight?
      *   *The Deflection:* Generalism says context affects *weight* (outweighing). Particularism says context affects *valence* (flipping from for to against) or *silencing* (making the reason vanish entirely).
  *   **'If there are no principles, there's nothing to say in a disagreement':**
      *   *The Worry:* Moral argument becomes 'I feel this' vs 'You feel that'.
      *   *The Deflection:* We argue by pointing to features, not subsuming under laws. "You're ignoring the need." "No, in this context, the need is irrelevant." This is dialectic, not deduction.
  *   **'Silencing vs. Defeating' (Your Trap):**
      *   *The Worry:* Is distinguishing silencing from defeating just relabelling the Generalist's exception clause?
      *   *The Deflection:* It does real work. If a reason is *defeated*, it still has weight (it just lost). If it is *silenced*, it contributes nothing. If Generalism requires an exception clause for every silence, the 'principle' becomes infinitely long and useless. Silencing explains why we don't even *consider* the need in Case B.

  ### 4. Closing Question

  Do not ask them to define the terms. Test the conceptual grip.

  **"Imagine a supercomputer that could predict every moral judgment you will ever make with 100% accuracy, using a set of rules. Would you concede that your judgments are *based* on those rules?"**

  *   *Correct Particularist Answer:* No. Prediction is not justification. A pattern does not prove a principle. I might act consistently without acting *because* of a rule.
  *   *Why:* It separates the *existence of a pattern* (Generalism's empirical claim) from the *structure of reasoning* (Particularism's metaphysical claim).

  ### 5. What to Refuse to Cover

  Be explicit that these are out of bounds for a 45-minute intro.

  1.  **Moral Supervenience:** Do not touch the relation between moral and natural properties. It is a metaphysical rabbit hole that distracts from the practical debate about reasons.
  2.  **Reasons as Facts vs. Psychological States:** Whether a reason is a 'fact that p' or a 'belief that p' is irrelevant to whether that reason is invariant.
  3.  **The Codifiability of Virtue Ethics:** While related, arguing that virtue cannot be codified is a separate claim from the holism of reasons. Keep the focus on reasons.

  **Timing Note:** Spend 10 minutes on the Example (Epistemic/Metaphysical), 10 on the Misconceptions (Explanatory), 10 on the Discussion/Deflections, 5 on the Closing. Stick to the script.
