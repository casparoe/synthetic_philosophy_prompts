prompt: |-
  I'm a PhD student in jurisprudence and I've been asked to take a 45-minute slot in the first-year Ethics and the Law seminar on particularism vs generalism about moral reasons. Don't explain the debate to me — I need a plan for teaching it. The students have done case-based applied ethics but no moral theory, and they'll arrive convinced that 'context matters' is already the deep controversial claim.

  What I want: (1) the order the pieces have to go in and why. My guess is that what comes first is pulling apart the metaphysical claim (must a consideration that's a reason in one case be a reason in relevantly similar ones?), the epistemological one (does getting a case right require a principle?), and the claim about moral explanation and teaching — because they'll otherwise run all three together. Tell me if that's the right spine and what depends on what. (2) One example to carry the session. It needs the same consideration flipping valence across two cases under the same thin description, so nothing where the flip is really explained by a further fact like causing pain; and it has to be resistant to the generalist's three escape moves — deny the flip, redescribe the consideration, bolt on an exception clause. I keep toying with the funny-joke-at-a-funeral sort of case but idk that it survives, since someone can always say the reason was never that it's funny but that it's funny and at nobody's expense. Give me one that does the work and say what it must lack. (3) The misconceptions in the order they'll arrive, and where to head each off: particularism = relativism or anything goes; holism = mere context-sensitivity, hence the debate looks fake; if there are no principles there's nothing to say in a disagreement; and the one I keep triping on myself — whether distinguishing silencing from defeating is doing real work or just relabelling the generalist's exception clause. (4) One closing question that tests whether they've got the thesis rather than the vocabulary. (5) What I should openly refuse to cover — I'm guessing reasons-as-facts metaphysics and anything about supervenience, but say what you'd cut.

  Write it in British English, and keep it tight.
