answer: |-
  **MEMORANDUM**

  **TO:** Charter Review Commission; City Council
  **FROM:** [Your Name], Commissioner
  **DATE:** February 14, 2024
  **SUBJECT:** Final Recommendation on Municipal Franchise and Electoral Obligations

  ### I. Bottom Line Recommendation

  **Recommendation:** **Adopt with Conditions.**

  The Commission should recommend amending the City Charter to extend the municipal franchise to all adult residents of the city, regardless of citizenship or immigration status. However, this extension must be accompanied by three specific conditions to ensure consistency, safety, and philosophical coherence:

  1.  **Compulsory Voting Waiver:** While voting shall remain compulsory for citizen residents (per our preliminary votes), non-citizen residents shall be exempt from the civil fine for non-participation. They retain the full *right* to vote without the enforceable *duty*.
  2.  **Residency Standardization:** The franchise shall be restricted to *residents*. The existing charter provision allowing non-resident commercial property owners to vote in improvement district elections shall be repealed.
  3.  **Data Firewall:** The City Clerk's office must implement strict data segregation ensuring voter registration information for non-citizens is never shared with federal immigration authorities.

  **Time Frame:** If adopted by the Council in March, these amendments shall be effective for the next general municipal election cycle (November 2025).

  **Implementation Path:**
  *   **March–June:** Council adoption and legal review for state compliance.
  *   **July–December:** Development of confidential registration protocols and public education campaign.
  *   **January 2025:** Opening of special registration period for newly eligible residents.

  ---

  ### II. Governing Principle: Local Subjection

  To resolve the contested items before us, we must anchor the franchise in a principle that distinguishes the *City* from the *State*. The State governs sovereignty, borders, and national membership. The City governs daily life, local coercion, and shared infrastructure.

  Therefore, the Commission adopts the **Principle of Local Subjection**:

  > *The legitimate municipal electorate consists of all adults who are subject to the city's coercive authority, contribute to its maintenance through presence and taxation, and rely upon its services for their daily welfare.*

  This principle decouples local political membership from national citizenship. It grounds the vote not in allegiance to the nation-state, but in subjection to local law. If the city police can detain you, if city zoning dictates where you can live, if city schools educate your children, and if your rent pays city property taxes, you are a member of the local political community.

  ---

  ### III. Application of the Principle

  We must apply the Principle of Local Subjection consistently across all groups to avoid the charge of ad hoc engineering.

  **1. Non-Citizen Residents (Green Card, Visa, and Undocumented)**
  *   **Application:** All three categories live within the city's coercive sphere. They are subject to code enforcement, police, and taxation.
  *   **Verdict:** **Enfranchised.**
  *   **Nuance:** The distinction between a green-card holder who declined naturalization and an undocumented resident is relevant to *national* politics, not *local* administration. Both are equally subject to the city's housing code. Therefore, both qualify under Local Subjection.

  **2. Sixteen- and Seventeen-Year-Olds**
  *   **Application:** Minors are subject to city curfew laws, use city transit and parks, and attend city schools.
  *   **Verdict:** **Enfranchised.** (Consistent with our preliminary vote).
  *   **Nuance:** Their subjection is real, even if their legal capacity is limited in other areas.

  **3. Non-Resident Commercial Property Owners**
  *   **Application:** Currently, these owners vote in improvement districts. However, they do not reside within the city's coercive sphere. They are not subject to local policing in their daily lives, their children do not attend local schools, and they do not use local transit. Their interest is financial, not civic.
  *   **Verdict:** **Disenfranchised.**
  *   **Nuance:** To maintain the integrity of the Principle of Local Subjection, we cannot claim residence is the key to the franchise for non-citizens while allowing absentee ownership to suffice for investors. We recommend repealing this provision to ensure the electorate comprises those who *live* with the consequences of their votes.

  **4. Citizen Absentees (Citizens living outside city limits)**
  *   **Application:** A citizen who moves to the suburbs ceases to be subject to the city's daily authority.
  *   **Verdict:** **Disenfranchised.** (Consistent with standard residency requirements).
  *   **Nuance:** National citizenship does not grant a perpetual claim on a specific municipality's governance once residence is terminated.

  ---

  ### IV. The Circularity Objection

  **The Objection:**
  The strongest argument against this recommendation is the problem of circularity. In a democracy, "the people" decide who "the people" are. By expanding the franchise, we are allowing the current electorate to alter the composition of the body that elected them. If the current voters reject this measure, does that not settle the question? To override the current electorate's boundary is to act undemocratically in the name of democracy.

  **The Rebuttal:**
  This objection conflates *legislative* acts with *constitutional* acts. A standard city council ordinance regulates the people; a Charter Review Commission regulates the *rules of the regime*. We are not acting as agents of the current electorate, but as trustees of the city's long-term legitimacy.

  If the Principle of Local Subjection is correct—that governance requires the consent of the governed—then excluding a large population subject to city law renders the city's authority illegitimate, regardless of the current electorate's preference. The Commission's specific charge is to correct structural mismatches between power and accountability. To defer to the current electorate on the definition of the electorate would be to allow a vested interest to police its own boundaries indefinitely. We are not changing the people; we are recognizing the people who are already here.

  ---

  ### V. Compulsory Voting and the Conscription Worry

  We have previously voted to make municipal voting compulsory, enforced by a civil fine, with an abstention option. Applying this to non-citizens raises a distinct ethical problem.

  **The Tension:**
  For citizens, compulsory voting is a civic duty owed to the sovereign body of which they are members. For non-citizens, especially those without permanent status, a state-enforced mandate to participate in the political process resembles conscription. It forces them into a formalized political relationship they may have avoided for safety or personal reasons. However, exempting them from the mandate risks creating a "second-tier" residency where they have the right to vote but not the equal obligation of citizens.

  **The Resolution:**
  We resolve this by distinguishing between the *Right* and the *Duty*.
  1.  **Equal Right:** Non-citizens must have the exact same access to the ballot as citizens.
  2.  **Differentiated Duty:** Non-citizens shall be exempt from the civil fine for non-participation.

  This is not a second-tier status; it is a recognition of different legal relationships to the sovereign. A non-citizen cannot be compelled to swear allegiance or serve on a jury; similarly, they should not be fined for abstaining from the ballot. This protects them from state coercion while granting them full political agency. They may vote, they may abstain, but they will not be punished for either. This preserves the integrity of compulsory voting for citizens while avoiding the ethical hazard of conscripting non-members.

  ---

  ### VI. Contingency: State Pre-emption

  We operate as a home-rule city, but the State Legislature retains the power to pre-empt local election law. There is a non-zero risk that the State will invalidate any charter amendment extending the franchise to non-citizens.

  **If Pre-emption Occurs:**
  If the State blocks the franchise extension, the City must not abandon the Principle of Local Subjection. We cannot grant the ballot, but we must grant *voice*.

  **Revised Recommendation:**
  In the event of pre-emption, the Council shall immediately establish **Resident Advisory Assemblies** for each council district.
  *   **Composition:** Mirroring the demographic makeup of the district, including non-citizens.
  *   **Power:** Formal authority to review and comment on zoning, budgeting, and policing prior to City Council votes.
  *   **Mandate:** The City Council would be required to publicly respond to Assembly recommendations before voting.

  This ensures that even if the State denies the *formal* franchise, the City honors the *substantive* requirement that those subject to the law must have a mechanism to consent to it.

  ### VII. Conclusion

  This recommendation is not based on projected turnout or the practices of other jurisdictions. It is based on the requirement that political authority must match the scope of subjection. We tax these residents, we police these residents, and we educate their children. To deny them the franchise is to govern them without their consent. To require them to vote under threat of fine is to conscript them into a sovereignty they do not hold.

  By adopting the franchise with the conditions outlined above, we align our Charter with the reality of our community, ensure consistency across all voter classes, and uphold the legitimacy of this city's government.
