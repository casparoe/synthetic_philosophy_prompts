      *   **Task:** Draft a decision memo regarding the extension of municipal franchise to non-citizen residents.
      *   **Deadline/Context:** Final recommendations tabled to City Council in March. One contested item remains (non-citizen voting).
      *   **Key Complications (The "Three Features"):**
          1.  *Compulsory Voting:* The CRC already passed lowering the voting age to 16 and making voting compulsory (with a fine + abstention option). The question is now: Can/Should non-citizens be *required* to vote? Is it conscription? Is exemption second-tier status?
          2.  *Non-Resident Property Owners:* Current charter allows non-resident commercial property owners to vote in improvement districts. Any principle must address this consistency (not just save existing practice by accident).
          3.  *Heterogeneity of Non-Citizens:* Green card holders (decades, no naturalization), Visa holders (open-ended), Undocumented (legal risk to register).
      *   **Required Structure:**
          1.  Bottom Line (Adopt/Reject/Defer/Conditions) + Time Frame + Implementation Path.
          2.  Governing Principle for who votes.
          3.  Application of Principle to all groups (16-year-olds, citizen absentees, 3 types of non-citizens, non-resident property owners).
          4.  Strongest Objection (The Circularity Problem) & Rebuttal.
          5.  Compulsory Voting Application (for newly enfranchised).
          6.  Contingency Plan (if State Legislature pre-empts home rule).
      *   **Constraints:** No turnout figures, no demographic projections, no comparative practice (other cities/countries). Focus on *argument* and *principle*.

  2.  **Determine the Bottom Line:**

      *   *Option A (Reject):* Safe, but ignores the "all-affected" reality described in the prompt. Doesn't solve the consistency issue with property owners.
      *   *Option B (Adopt Unconditionally):* Ignores the legal risk for undocumented residents and the "conscription" worry regarding compulsory voting.
      *   *Option C (Adopt with Conditions):* This seems the most robust. It addresses the franchise extension but handles the compulsory voting nuance and the legal risk nuance.
      *   *Decision:* **Adopt with Conditions.** Specifically: Extend franchise to all resident adults regardless of citizenship, *but* decouple compulsory voting for non-citizens (make it optional for them) to avoid the "conscription" charge, and ensure registration confidentiality for those at risk.
      *   *Wait, re-reading the prompt:* The prompt asks me to work through the compulsory voting tension. If I make it optional for non-citizens, does that create the "second tier" status mentioned in Feature 1?
      *   *Refinement:* The prompt highlights the tension: "Exempting them appears to create a second, lesser tier of residence." However, *requiring* them looks like "conscription."
      *   *Philosophical Pivot:* The principle of "Stakeholder Citizenship" (residence + subjection to law) justifies the *right* to vote. But the *duty* to vote stems from membership in the sovereign body. Non-citizens are stakeholders but not sovereign members in the national sense.
      *   *Better Decision:* **Adopt.** Extend the franchise. Regarding compulsory voting: Apply it universally *but* with a robust "conscientious objection" or administrative waiver for non-citizens that doesn't carry stigma, OR (more practically) acknowledge that enforcing fines against non-citizens (especially undocumented) is legally/ethically fraught.
      *   *Actually, looking at the "Three Features":* The prompt wants me to resolve the tension. If I say "Adopt," I must address the compulsory aspect.
      *   *Strategic Choice:* The most principled stand that respects the "conscription" worry without creating a "second tier" is to **Adopt the Franchise, but Suspend Compulsory Voting for Non-Citizens until Naturalization or Permanent Residency is held for X years.** No, that's messy.
      *   *Cleaner Approach:* **Adopt the Franchise. Modify Compulsory Voting.** The duty to vote arises from the social contract. Non-citizens are part of the local social contract but not the national one. To avoid "conscription," voting should be a *right* for them, not a *duty* enforceable by fine. To avoid "second tier," the *right* must be equal, even if the *duty* differs.
      *   *Wait, the prompt asks for a specific recommendation:* "Adopt, adopt with conditions, reject, or defer."
      *   *My Choice:* **Adopt with Conditions.**
      *   *Condition 1:* Franchise extended to all adult residents regardless of citizenship/status.
      *   *Condition 2:* Compulsory voting fines waived for non-citizens (resolving the conscription worry).
      *   *Condition 3:* Non-resident property owner voting abolished (resolving the consistency worry).
      *   *Condition 4:* Confidential registration process (resolving the legal risk worry).

  3.  **Develop the Governing Principle:**

      *   What grounds the vote? "All-affected interests" is mentioned as handling property owners badly. "Subject to law" is better.
      *   *Principle:* **The Principle of Local Subjection.** Those who are subject to the city's coercive authority and contribute to its maintenance through residence and taxation constitute the municipal electorate.
      *   *Why:* It distinguishes between the *City* (local administration/law) and the *State/Nation* (sovereignty/foreign policy).

  4.  **Apply the Principle:**

      *   *16-Year-Olds:* Subject to laws, use services. (Consistent with CRC's prior vote).
      *   *Citizen Absentees (Non-resident):* If they don't live here, they aren't subject to daily coercion. (Wait, the prompt mentions "citizen absentees" in the application list, but the property owner section mentions non-resident owners voting. I need to clarify: Do non-resident citizens vote? Usually, you must reside. The prompt asks to apply the principle to "citizen absentees." I should argue they *should not* vote if they don't reside, to be consistent with the "Local Subjection" principle, unless they are temporarily absent. Let's assume "absentee" means living outside the city limits.)
      *   *Non-Citizen Residents:* Subject to laws, taxes, police. **Vote.**
      *   *Non-Resident Property Owners:* Pay taxes, but not subject to daily coercion/police/zoning in the same way residents are. Their interest is financial, not civic. **No Vote** (This requires overturning the current charter provision).

  5.  **Address the Circularity Objection:**

      *   *Objection:* The current people decide who the people are. You can't use democracy to change the demos.
      *   *Rebuttal:* The Charter Commission exists *specifically* to revise the rules of the demos. It is a constitutional moment, not a standard legislative act. We are acting as trustees of the city's long-term legitimacy, not just agents of the current electorate.

  6.  **Address Compulsory Voting:**

      *   If we require non-citizens to vote, it's conscription.
      *   If we exempt them, is it second-tier?
      *   *Solution:* Distinguish between *Right* and *Duty*. Equal Right. Differentiated Duty based on membership status. Non-citizens get the Right without the Enforceable Duty. This acknowledges their unique legal vulnerability without diminishing their political standing.

  7.  **Address State Pre-emption:**

      *   If the State says "No," we need a fallback.
      *   *Fallback:* Strengthen non-voting participation (advisory boards, participatory budgeting) to ensure the "Local Subjection" principle is honored even without the ballot.

  8.  **Drafting - Tone and Style:**

      *   Formal, legalistic but accessible.
      *   Persuasive but reasoned.
      *   Adhere strictly to constraints (no stats, no comparisons).
      *   Structure exactly as requested.

  9.  **Refining the "Non-Resident Property Owner" point:**

