      *   *Challenge:* If I recommend stripping their vote, that's a huge political fight.
      *   *Alternative:* Can I justify their vote? They are affected by zoning/taxes. But they don't live with the consequences of police/schools.
      *   *Decision:* To be intellectually honest and consistent with "Local Subjection," I must recommend ending their franchise. The prompt asks for a principle that "says something about them too, since a principle that saves our existing practice only by accident is not a principle." This implies I should be willing to change existing practice if the principle demands it. I will recommend phasing out non-resident owner voting to ensure consistency.

  10. **Refining the "Compulsory Voting" point:**

      *   Prompt: "Exempting them appears to create a second, lesser tier of residence."
      *   My argument: A tiered *obligation* is not a tiered *status*. It recognizes the difference between a guest/stakeholder and a full covenant member. It protects them from state coercion (fines) that could complicate immigration status.

  11. **Refining the "Undocumented" point:**

      *   Registration creates a paper trail.
      *   *Solution:* Firewalls. City data cannot be shared with federal immigration. This must be part of the implementation.

  12. **Final Review against Constraints:**

      *   Bottom line first? Yes.
      *   Principle stated? Yes.
      *   Applied to all groups? Yes.
      *   Circularity objection addressed? Yes.
      *   Compulsory voting addressed? Yes.
      *   Pre-emption contingency? Yes.
      *   No stats/comparisons? Yes.

  13. **Writing the Memo:** (Self-Correction during drafting)
      *   *Check:* Did I address "citizen absentees"? I need to make sure I define them. I will treat them as citizens living outside the city limits. Under "Local Subjection," they shouldn't vote.
      *   *Check:* Did I handle the "conscription" vs "second tier" tension? I will argue that exempting them from the *fine* preserves the *right* without imposing the *burden* of sovereignty they don't hold.
      *   *Check:* Time frame. March tabling. Implementation for next election cycle.

  14. **Final Polish:** Ensure the voice is appropriate for a Commissioner speaking to colleagues and the Council. Serious, deliberative, principled.

  *(Self-Correction on the Non-Resident Property Owners)*: The prompt says "Any principle we adopt should say something about them too." It doesn't explicitly demand I strip their vote, but it implies the principle must cover them. If my principle is "Residence + Subjection," they fail the Residence test. I will recommend ending their eligibility to ensure the principle isn't ad hoc. This strengthens the argument for non-citizens (we aren't just expanding, we are cleaning up).

