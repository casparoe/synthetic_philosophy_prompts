answer: |-
  ### Interview Strategy and Ordering

  **Ordering Logic:** I have ordered these to move from the concrete (the graduate student case) to the abstract (the symmetry claim), then to the structural implications (level-shifting and collapse), and finally to falsifiability. This prevents R from hiding behind abstractions early on. By grounding the first two questions in the specific case you provided, you force her to apply her machinery before she has fully defended it.

  **The "Killer" Question:** I expect **Question 3** (Symmetry vs. Cluelessness) to be the one most likely to make her move. Her entire view rests on the claim that symmetry is a default consequence of cluelessness. If you force her to admit that symmetry is a *substantive empirical hypothesis* requiring defense (rather than a mere absence of evidence), her "modest" package becomes a demanding empirical research programme, which undermines her critique of longtermism.

  **Weak Angles:** I have flagged **Angle 3 (Continuity/Arbitrariness)** as weak in the commentary below. R can easily absorb this by appealing to "pragmatic horizons" or discount rates without damaging her core thesis. I have included it as Question 7, but be prepared to cut it if she gives a standard pragmatic reply; it is less likely to yield a concession than the Symmetry or Level-Shift lines.

  **The Sequence:**

  1.  **Setup:** Let's apply your view to a concrete choice: a student choosing between an academic philosophy career and a finance job funding bednets.
      **Question:** On your view, does the finance student's near-term certainty about lives saved automatically outweigh the philosopher's unforecastable long-term influence, or does the symmetry claim treat these options differently?
      **Follow-up:** If she says they are treated the same: Why doesn't the sheer magnitude of the bednet near-term effects break the symmetry with the philosopher's vague long-term effects?

  2.  **Setup:** You argue that long-run considerations cancel out because our evidence is symmetric between positive and negative outcomes.
      **Question:** In the finance case, is that symmetry a result of the evidence actively supporting positive and negative outcomes equally, or merely a lack of evidence for either?
      **Follow-up:** If she says "lack of evidence": Doesn't a lack of evidence imply imprecise probabilities rather than a symmetric sharp distribution, which standard decision rules treat differently?

  3.  **Setup:** You claim cluelessness is a fact about forecasts, not a fact about our reasons.
      **Question:** If I have no evidence that the long-run effects of act A are positive rather than negative, why am I entitled to assume they are *equally* likely rather than simply unknowable?
      **Follow-up:** If she says "we must assume something to act": Why is the Principle of Indifference applicable to complex causal chains where we know the distribution is likely non-normal?
      *(Note: This is the "Killer" question. Push hard on the distinction between "I don't know" and "I know it's 50/50".)*

  4.  **Setup:** Standard decision theory distinguishes between risk (known probabilities) and ambiguity (unknown probabilities).
      **Question:** If your view relies on ambiguity-averse rules rather than expected value maximization, doesn't that change the recommendation in the finance case significantly?
      **Follow-up:** If she denies using ambiguity-aversion: How do you justify risk-neutrality over moral value when the stakes involve potential existential outcomes?

  5.  **Setup:** Longtermists argue that far-future effects are many orders of magnitude larger than near-term ones.
      **Question:** Even if the expected value is zero, doesn't the massive variance in the long-run effects swamp the near-term effects unless you defend risk-neutrality?
      **Follow-up:** If she defends risk-neutrality: Does this not entail that the far future is decision-irrelevant for all ordinary agents, which is a substantive anti-longtermist conclusion you haven't explicitly owned?

  6.  **Setup:** You recommend reallocating effort toward forecasting research and institution-building because information has value.
      **Question:** If long-run considerations genuinely cancel out in expected value terms, where does the expected value of information about them come from?
      **Follow-up:** If she says "breaking the symmetry": Isn't "trying to break the symmetry" itself an act with unforecastable long-run effects subject to your own cluelessness objection?

  7.  **Setup:** Chaotic amplification suggests forecast reliability decays continuously rather than stopping at a principled boundary.
      **Question:** How do you set the horizon for "near-term" effects without arbitrariness, given that reliability decays at a rate you would themselves have to forecast?
      **Follow-up:** If she appeals to pragmatic constraints: Doesn't this admit that your view is based on practical limitations rather than the normative structure of consequentialism?
      *(Note: Flagged as weak angle. She can absorb this via pragmatic discounting.)*

  8.  **Setup:** You suggest we should evaluate institutions rather than individual acts to avoid cluelessness.
      **Question:** If the causal opacity of individual acts is severe enough to make act-evaluation idle, why doesn't that same opacity make institution-evaluation idle for the same reason?
      **Follow-up:** If she says institutions aggregate effects: Doesn't aggregation preserve the uncertainty rather than cancel it, given the correlations in institutional outcomes?

  9.  **Setup:** Your recommendations for ordinary agents look extensionally similar to common-sense morality.
      **Question:** If the consequentialist criterion rarely changes the verdict in ordinary cases, what theoretical work is the consequentialist framework still doing?
      **Follow-up:** If she says "justification matters": Does a justification that systematically ignores the largest causal consequences cease to be consequentialist in any meaningful sense?

  10. **Setup:** You treat the symmetry response as a reason to read consequentialism as a criterion for decision procedures.
      **Question:** If we found empirical evidence that long-run effects were systematically negative for most human interventions, would your view require us to adopt a quietist or anti-natalist decision procedure?
      **Follow-up:** If she says "we'd need better data": What specific evidence, short of complete forecasting, could count against the symmetry hypothesis itself?
      *(Note: This is the required falsifiability question. It blocks the "better forecasting" escape by asking about evidence against symmetry specifically.)*

  11. **Setup:** You argue that cluelessness supports funding forecasting research over agonizing over individual choices.
      **Question:** Is the recommendation to fund forecasting itself subject to the cluelessness objection, given that the value of that research depends on its long-term uptake and application?
      **Follow-up:** If she says "it's a second-order act": Why does the second-order act escape the causal opacity that binds the first-order act?

  12. **Setup:** Your view relies on the claim that long-run considerations cancel across options.
      **Question:** If two options have different *variances* in their long-run outcomes, does your view treat them as equivalent, or does the risk profile matter?
      **Follow-up:** If she says "equivalent": Does this not imply that reckless interventions with high upside and high downside are permissible so long as the mean is zero?

  ### Commentary on Execution

  *   **Question 3 (The Killer):** R's "modesty" depends on symmetry being free. If you force her to defend symmetry as an empirical claim, she loses the high ground. She will likely try to say "in the absence of evidence, we treat them as equal." Your follow-up on non-normal distributions is the trap: causal chains are not coin flips.
  *   **Question 8 (Level-Shift):** This is your second strongest line. If she claims institutions are knowable but acts are not, she owes a story about how opacity vanishes upon aggregation.
  *   **Question 7 (Continuity):** As noted, this is the weak link. If she gives a glib answer about "practical horizons," do not dwell. Move to Q8.
  *   **Question 10 (Falsifiability):** The follow-up is crucial. She will want to say "better forecasting would show asymmetry." You must press for what counts *now*, or what structural evidence (e.g., historical trends of intervention) would undermine the symmetry assumption specifically.

  **Adjustment Note:** In Question 2, if she claims the finance case *does* break symmetry because the near-term is known, press her on why the long-term symmetry doesn't reintroduce uncertainty about the *total* value, even if the near-term is fixed. She needs to explain why the "cancellation" applies to the *difference* between options, not just the absolute value of one.
