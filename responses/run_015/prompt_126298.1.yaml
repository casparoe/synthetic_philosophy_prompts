answer: |-
  Your intuition is sharper than you give it credit for. You are effectively reconstructing **Autonomist Marxism** (think Mario Tronti or Antonio Negri) without reading the footnotes. You are moving away from "exploitation = low wage" and toward "exploitation = capture of life."

  However, your verdicts wobble because you are using two different definitions of **Exploitation**. Sometimes you mean "unfair pay" (Case 2), and sometimes you mean "extraction of value" (Case 5). To make this hang together, you need a single principle that binds the economic mechanism to the psychological experience.

  ### The Unifying Principle: **The Heteronomy of Valorization**

  **Definition:** Human activity is **exploited** when its output is captured by a logic of accumulation external to the actor. Human activity is **alienated** when the *purpose* of that activity is determined by that same external logic.

  *   **Exploitation** is the *objective* transfer (Value flows to Capital).
  *   **Alienation** is the *subjective* experience (Purpose flows away from Self).
  *   **The Link:** They are not independent. They are the structural and phenomenological sides of **Subsumption**. You cannot have Marxist alienation without this form of exploitation, because alienation is specifically the feeling of being a tool for an external end.

  Here is how this principle forces you to revise your verdicts.

  ### The Verdicts You Must Drop

  **1. Case 2: The Senior Software Engineer**
  *   **Your Verdict:** Exploited? **No.**
  *   **The Principle's Verdict:** **Yes.**
  *   **Why:** You are confusing *distribution* (salary) with *production* (surplus value). If her code is proprietary and owned by the firm, the value she creates belongs to the firm. Her high salary is simply a larger share of the variable capital, or a bribe from the surplus to ensure loyalty (a "labor aristocrat"). As long as the *purpose* of her code is shareholder value rather than human utility, and the *ownership* lies with the firm, she is subsumed.
  *   **Correction:** She is **Exploited** (objectively) and **Alienated** (subjectively). The high salary masks the exploitation but does not remove the heteronomy.

  **2. Case 5: The Rentier**
  *   **Your Verdict:** Exploited? **Yes.**
  *   **The Principle's Verdict:** **No.** (He is the *Exploiter*).
  *   **Why:** You wrote: *"he extracts surplus value from tenants, so in a broad sense yes."* This is the inverse of the definition. Exploitation is the *having of value extracted*, not the *doing of the extracting*. He is the beneficiary of Heteronomy elsewhere. Because he does not labor, he cannot be alienated *from labor*. He is the only one on your list who is truly "free" in the negative sense (free from capital's discipline), which is why he is unalienated.
  *   **Correction:** He is **Not Exploited** (he is an agent of extraction) and **Not Alienated** (from labor).

  ### The Verdicts You Save

  **Case 3 (Freelance), Case 4 (Co-op), Case 6 (Streamer)**
  These all hold up beautifully under **Heteronomy of Valorization**.
  *   **Co-op:** They aren't exploited by a boss, but they are exploited by the **Market**. The market is an external logic (blind competition) that forces them to waste food. That is heteronomy. Hence, alienation remains.
  *   **Streamer:** The "Platform" is the external logic. She produces value (content/attention) captured by the algorithm.
  *   **Freelance:** The "Client" is the external logic. Her style is subsumed to their brief.

  ### The Sessional Lecturer (The Pivot Case)

  **Does the principle save or kill your verdict?**
  It **saves** it, but clarifies *why* it is Marxist and not just burnout.

  *   **Burnout** is exhaustion from overwork.
  *   **Alienation** is estrangement from the *purpose* of the work.
  *   **Analysis:** She designs the syllabus (creative agency), but the *metrics* dictate the content (heteronomy). The university extracts her "intellectual personality" (brand/reputation) to attract students, while she loses control over the pedagogical outcome.
  *   **Verdict:** **Exploited** (her intellectual surplus is captured by the admin bureaucracy) and **Alienated** (from her role as an educator).
  *   **Nuance:** This is **Bureaucratic Subsumption**. It proves your theory holds even outside the factory. The "capitalist" isn't a person; it's the metric system itself.

  ### Prediction: The AI Data Annotator

  **Case:** Works from home, owns laptop, paid per task, judgment mined/discarded.

  *   **Exploited? YES.**
      *   **Reasoning:** This is the purest form of **Data Extraction**. She is producing "training value" that becomes the intellectual property of the AI company. She is paid per task (piecework), which maximizes the surplus rate. The fact that she owns the laptop is irrelevant (like a weaver owning a loom in the putting-out system); she does not own the *product* (the model).
  *   **Alienated? YES.**
      *   **Reasoning:** This is **Epistemic Alienation**. Her human judgment (recognizing an image, understanding context) is mined, stripped of her name, and used to train a system that may eventually replace her. She is literally teaching her own replacement without seeing the final product.
      *   **Specific Type:** Alienation from **Species-Being**. Her human capacity for judgment is turned into a mechanical input.

  ### Summary of the Theory

  Your gut is right, but you need to stop thinking of Exploitation as "getting paid less than you deserve" and start thinking of it as **"losing ownership of the purpose of your activity."**

  If you make that shift:
  1.  **Exploitation and Alienation are linked:** They are the objective and subjective sides of **Subsumption**.
  2.  **The Market is a Master:** You correctly identified that Co-ops and Freelancers can be alienated. This is because under capitalism, the Market itself acts as the "external logic" (Heteronomy), even without a boss.
  3.  **The Lecturer is Key:** She proves that "Intellectual Labor" is subject to the same laws as factory labor.

  **Final Correction:** Drop the idea that high pay stops exploitation (Case 2) and drop the idea that extractors are exploited (Case 5). Keep everything else. You have essentially derived a theory of **Cognitive Capitalism** on your own.
