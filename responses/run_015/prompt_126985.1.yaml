answer: |-
  You are wrong to conflate Plutarch with the Byzantine florilegia that butchered him. Plutarch is not a hagiographer offering moral simplification with extra steps; he is a moral psychologist offering a gymnasium for *phronesis* (practical wisdom). To classify him as a purveyor of clean exemplars is to mistake the tool for the debris left behind by its users.

  Here is the committed answer: Plutarch's *Parallel Lives* is genuinely different from hagiography, and the pairing method is not a gloss—it is the engine of his pedagogy. If you treat him as a simplifier, you destroy the very mechanism that makes the text ethically useful.

  **Where the confusion lies**
  Your framing collapses the distinction between *reception* and *composition*. You are correct that late-antique and Byzantine readers chopped Plutarch up into flat moral warnings. They needed dogmatic saints and clear sinners to reinforce orthodoxy. But projecting that reception history back onto Plutarch's original text is an anachronism. Plutarch writes in a Platonic tradition where the soul is a battlefield, not a vessel to be filled with rules.

  When you read the *Life of Alcibiades*, you do not get a flat warning. You get a seductive, terrifying portrait of a man whose *philotimia* (love of honor) saves Athens and destroys it. Plutarch does not resolve this contradiction; he dwells in it. Hagiography erases the flaw to sanctify the subject. Plutarch highlights the flaw to show how virtue, when unmoored from reason, becomes vice. He explicitly states in *Alexander/Caesar* that he is writing lives, not histories, and that a small thing like a phrase or a joke often clarifies character more than a battle. This is the antithesis of the "great man" sanitization found in hagiography. He is looking for the leak in the dam, not just admiring the water.

  **Why the pairing saves him**
  The *Synkrisis* (comparison) is not a ranking system to tell you who is "better." It is a control variable for ethical experimentation. By pairing a Greek and a Roman, Plutarch isolates traits to show how context dictates moral value. Ambition in Coriolanus leads to treason; ambition in Alexander leads to empire. Is ambition good or bad? Plutarch forces you to realize the question is meaningless without context.

  If he were a hagiographer, he would tell you "Ambition is Sin" or "Ambition is Virtue." Instead, he forces you to exercise judgment. He is not handing you a fish (a rule); he is teaching you to fish (moral perception). The "extra steps" you dismiss are actually the curriculum. The friction between the two lives generates the heat necessary for moral insight.

  **The cost of holding onto your framing**
  If you insist on viewing Plutarch as a hagiographer offering simplified exemplars, the cost is the atrophy of your own moral agency.

  1.  **You reduce ethics to algorithm:** If Plutarch is just giving you clean models to imitate, you are engaging in mimicry, not ethics. You learn to copy actions rather than understand motives. This produces rigid moralists who collapse when faced with novel dilemmas that don't fit the "exemplar" template.
  2.  **You ignore the tragedy of character:** By demanding clean exemplars, you deny the reality that greatness and ruin often spring from the same root. Alcibiades' charisma *is* his ruin. If you separate them to make him a "clean" warning, you lose the tragic insight that our greatest strengths are our most vulnerable points. Plutarch preserves this tension; hagiography resolves it.
  3.  **You outsource judgment:** Hagiography asks for devotion. Plutarch asks for critique. If you read him as a simplifier, you stop arguing with the text. You stop asking, "Was Demetrius truly great, or just lucky?" You become a passive recipient of moral verdicts rather than an active judge of character.

  **The Verdict**
  Plutarch is not a hagiographer. He is a realist who believes that moral education requires staring into the ambiguity of human action without flinching. The Byzantine florilegia turned him into a simplifier because they were afraid of the ambiguity. Do not join them.

  Keep the contradictions. Keep the tangled web of virtue and vice. That is not a bug in Plutarch's system; it is the feature. If you ditch the exemplum tradition because you think Plutarch is part of the problem, you throw away the best tool we have for learning how to navigate a world where good men do evil things and evil men do good things. Plutarch doesn't give you the answer; he gives you the mirror. Don't break it because you want a map.
