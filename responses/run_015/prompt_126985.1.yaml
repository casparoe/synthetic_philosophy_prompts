  2.  **Evaluate the User's Premise:**
      *   *Premise 1:* Florilegia chopped Plutarch up into flat moral warnings. (True, this happened in reception history).
      *   *Premise 2:* Therefore, the original text is basically hagiography with a comparative gloss. (This is the weak link. Plutarch's text is notoriously ambiguous and psychologically complex, unlike standard hagiography).
      *   *Premise 3:* Moral education requires seeing virtue and vice intertwined. (A strong philosophical stance, generally accepted in modern ethics and arguably by Plutarch himself).
      *   *Conclusion:* If Plutarch is hagiography, he's bad pedagogy.
      *   *The Core Conflict:* Is Plutarch a simplifier (hagiographer) or a complexifier (psychological moralist)?

  3.  **Formulate the Argument:**
      *   *Side to Pick:* Plutarch is *not* a hagiographer. He is fundamentally different. The user's framing ("moral simplification with extra steps") is incorrect because it misunderstands the function of the *Synkrisis* (comparison) and the narrative texture of the *Lives*.
      *   *Why?* Hagiography seeks to sanctify and remove ambiguity. Plutarch seeks to probe and expose ambiguity *in order to* train moral judgment (phronesis).
      *   *The "Confusion":* The user is conflating the *reception* (Byzantine florilegia) with the *production* (Plutarch's original intent/text). They are projecting the simplification of the fragments onto the whole.
      *   *The "Cost":* If we treat Plutarch as a simplifier, we lose the training ground for practical wisdom. We turn ethics into rule-following rather than character cultivation.

