      *   *Defense Point 2: The Function of the Synkrisis.* It's not just ranking virtues. It's about context. The same trait (ambition) kills one and saves the other. This teaches *contextual judgment*, not rigid rules.
      *   *Addressing the "Confusion":* The user is confusing the *Byzantine reception* (which did simplify him) with Plutarch himself. The florilegia are the simplifiers, not Plutarch.
