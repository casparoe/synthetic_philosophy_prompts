answer: |-
  ### Brainstorming Failure Points

  Before diagnosing the argument, here are the four primary structural weaknesses in your friend's chain:

  1.  **The Identity Equivocation (Step 6):** The argument conflates *obligations to* future people (conditional on their existence) with *obligations to bring* future people into existence (to have recipients). It treats the Non-Identity Problem (NIP) as a generator of procreative duty rather than a limit on harm claims.
  2.  **The Collective/Individual Slide (Step 5):** It moves from "we have collective obligations" (3) to "individuals must act regardless of collective inaction" (5) using a drowning child analogy. Climate change is a threshold/threshold-less hybrid problem, not a single-causal rescue case. This generates the "asceticism" half of the absurdity independently of the reproduction claim.
  3.  **The "Maximal" Overreach (Step 7 to 8):** Even if one accepted a duty to maintain a population of moral patients, there is no logical bridge to *maximal* reproduction. A stable population suffices to ensure future subjects of justice; exponential growth creates new harms (resource scarcity).
  4.  **The "Specific" Trap (Step 2 & 6):** The argument relies on owing duties to *token* individuals (the specific people born from high-carbon choices). Most intergenerational theories owe duties to *types* of individuals (whoever comes to exist), regardless of their specific genetic identity.

  ***

  ### Diagnosis: The Procreative Category Mistake

  Your intuition is correct: the fatal slide occurs at **Step (6)**, extending into the inference to **(7)**.

  Your friend has weaponized the Non-Identity Problem (NIP) in a way that violates the logic of moral address. The NIP (famously articulated by Derek Parfit) is typically a *shield* against claims of harm, not a *sword* mandating creation.

  **The Logic of the Error:**
  1.  **Standard NIP:** If Action A causes Person P to exist with a difficult life, and Action B would cause Person Q to exist instead, P cannot claim they were harmed by A, because without A, P would not exist.
  2.  **Friend's Inversion:** We owe duties to P. If we choose Action B (low emissions), P never exists. Therefore, we cannot fulfill our duties to P. To fulfill our duties to P, we must choose Action A (high emissions/reproduction) to ensure P exists.

  **Why this fails:**
  Moral obligations to future people are **conditional on existence**, not **generative of existence**.
  *   I have an obligation not to poison the well *if* someone drinks from it.
  *   I do *not* have an obligation to create a drinker so that I can fulfill my obligation not to poison them.

  By moving from (6) to (7), your friend shifts from a **Person-Affecting View** (we owe duties to specific people) to a **Total View** (we must maximize the number of value-bearing lives) without justification, and then conflates that with the specific duties established in (3).

  If we reduce emissions and change the population identity, we do not "undermine our obligations." We simply transfer those obligations to the *new* specific people who will exist in that low-carbon future. We owe duties to *whoever* exists, not to the *specific* people who would have existed under a high-carbon regime.

  ### Which Step to Give Up?

  **You should reject the inference from (6) to (7).**

  You can keep Premise (1) (Temporal Parity) and Premise (3) (Direct Obligations) without accepting the procreative mandate. You must deny that the *content* of our obligation to future people includes *bringing them into existence*.

  **Why Step (6) looked plausible:**
  It exploits a genuine tension in intergenerational ethics. If our actions determine *who* exists, and we owe duties to *those who exist*, it feels like changing our actions "erases" the creditors. It feels like a breach of contract to change the terms so the counterparty disappears. This plausibility relies on a **De Re** reading of obligations (duties attached to specific genetic tokens) rather than a **De Dicto** reading (duties attached to the status of being a future person). Your friend forces a *De Re* reading to generate the paradox, but intergenerational justice is almost universally understood *De Dicto*.

  ### Pricing the Alternatives

  If you choose to block the argument elsewhere, here is the cost:

  **Option A: Reject Premise (1) (Temporal Parity)**
  *   *The Move:* Admit that temporal distance *does* weaken obligations (Discounting).
  *   *The Cost:* This collapses the foundation of climate justice. If we discount the future, we can justify imposing catastrophic costs on the 22nd century for minor conveniences today. It violates the "time of occurrence" neutrality standard in most normative ethics.
  *   *Verdict:* Too high a cost. You lose the moral core of the climate argument.

  **Option B: Reject Step (5) (Individual Asceticism)**
  *   *The Move:* Argue that obligations are collective, not individual. I am not required to go to near-zero if others don't.
  *   *The Cost:* This solves the "asceticism" half of the absurdity but leaves the "reproduction" half intact. Your friend can still argue, "Okay, you don't have to starve, but you still must reproduce maximally to ensure the subjects of justice exist." It also risks free-rider problems.
  *   *Verdict:* Necessary, but insufficient to fully defeat the *reductio*.

  **Option C: Reject Step (6)/(7) (The Procreative Duty)**
  *   *The Move:* Assert that obligations to future people are conditional on their existence. We owe a duty of care to future generations, not a duty of creation to specific individuals.
  *   *The Cost:* You must adopt a *De Dicto* conception of future rights. You must accept that the "specific people" in 2200 are not the creditors of our debt; rather, the "people of 2200" (whoever they turn out to be) are the creditors. This requires rejecting a strict Token-Identity view of harm.
  *   *Verdict:* **Lowest Cost.** This is the standard position in liberal intergenerational justice (e.g., Gosseries, Meyer). It preserves (1) while dissolving the absurdity.

  ### Can You Save (1) Without Accepting (8)?

  **Yes.**

  Premise (1) asserts **Temporal Parity**: *Time itself is not a morally relevant difference.*
  Conclusion (8) asserts **Dual Extremism**: *Asceticism + Maximal Reproduction.*

  There is no logical entailment between them. You can hold that a person in 2200 matters just as much as a person in 2024 (Premise 1) without believing you are obligated to *manufacture* that person (rejecting 7) or that you must singly bear the cost of their protection (rejecting 5).

  **The Winning Formulation:**
  "We have strong, direct obligations to future people equivalent to present people (1). However, these obligations are **conditional** on those people coming to exist through normal demographic processes, not **constitutive** of a duty to maximize their numbers. Furthermore, these obligations are primarily **collective** regarding mitigation, not solely **individual**."

  **Advice for your friend:**
  Tell her she has committed a **modal scope error**. She has turned the *contingency* of future identity (the fact that different choices make different people) into a *requirement* for identity (the fact that we must make the 'right' people). The Non-Identity Problem shows that we cannot claim to harm specific future individuals by changing policies; it does not show that we are obligated to maintain the policies that create them. You can save Temporal Parity (1) by rejecting the idea that justice requires us to populate the future, rather than just protecting whatever future is populated.
