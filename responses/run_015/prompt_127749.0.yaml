      *   **Secondary Objection (Epistemic Humility):** We can't know the metaphysical status (noumenal nature) of the being in (5). Acting as if it lacks moral status is risky and presumptuous.
      *   **Tertiary Objection (The Nature of "Humanity"):** Kant sometimes uses "humanity" to mean not just rational agency but the capacity to feel sympathy/pity as a natural aid to morality. Destroying that aid is wrong.
