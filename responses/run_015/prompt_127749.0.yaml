answer: |-
  This is a sharp reconstruction of the classic objection to Kantian animal ethics. You have correctly identified the tension between Kant's metaphysics of morals and our moral intuitions about suffering. This is often called the "argument from marginal cases" or the "problem of non-rational sufferers."

  If you want to preserve **(1)** (Direct duties require rational nature) and **(3)** (Duties regarding animals are indirect), you must reject **(4)**.

  Here is why (4) is the weak link, how Kant blocks the move to (6), and what cost you pay for keeping (1) and (3).

  ### 1. The Error in Step (4): The Scope of "Indirect"
  Your step (4) claims: *"So the wrongness is totally derivative—if harming an animal never affected our treatment of people, there'd be no moral problem with it."*

  This interprets "indirect duty" as merely **instrumental** (animals are practice dummies for human interaction). However, Kant's actual view of indirect duties is **constitutive** regarding the agent.

  In the *Metaphysics of Morals* (Doctrine of Virtue), Kant argues that we have a **duty to ourselves** to cultivate our moral feelings and natural predispositions. One of these predispositions is sympathy (*Mitleid*).
  *   **The Argument:** Cruelty to animals dulls the "natural predisposition" to sympathy within *you*.
  *   **The Correction:** Even if you are in a sealed room and guarantee (somehow) that you will never hurt another human, you have still violated a duty **to yourself**. You have degraded your own moral character (*humanity in your own person*).

  Therefore, (4) is false. The wrongness is derivative, yes, but it is derived from the damage done to the **agent's moral integrity**, not just the potential future harm to **other humans**.

  **Revised Chain:**
  *   (3) The wrongness is indirect (grounded in human rationality).
  *   (4*) The wrongness consists in violating a duty to *oneself* to maintain the sensibility required for moral agency.
  *   (6*) Therefore, even in a sealed context, it is wrong because it damages *you*.

  ### 2. The Epistemic Block (Addressing Step 5)
  Your thought experiment in (5) relies on a "perfect zombie-duplicate" where you are *certain* it lacks noumenal rational nature.

  Kant would argue this is an **epistemic impossibility**.
  *   We only have access to the phenomenal world (appearances). We cannot know the noumenal status (rational soul vs. biological shell) of any entity with certainty.
  *   Because we cannot distinguish a rational being from a perfect non-rational mimic, we have a **prudential and moral obligation** to treat anything that *appears* to suffer as if it matters.
  *   To act on the assumption that a suffering-looking being is a "shell" is to arrogate to oneself a God's-eye view of the noumenal realm, which Kant forbids.

  So, while a strict metaphysical reading might allow torturing a *known* zombie, the practical application of Kantian ethics forbids acting on that premise because you can never *know* (5) is true.

  ### 3. The Equivocation You Suspected
  You asked: *"Is there an equivocation between 'rational nature' and 'appearance of suffering' in (5) to (6)?"*

  Yes, but it's deeper than equivocation; it's a category error.
  *   **Rational Nature** is the *ground* of moral obligation (the *ratio essendi* of duty).
  *   **Suffering** is not the ground of duty, but it is the object of our **moral feelings** (sympathy), which we have a duty to cultivate.

  Kant distinguishes between **moral status** (being an end-in-itself) and **moral significance** (being something we must attend to in order to be good humans). Animals (and your zombie) lack the former but possess the latter. Your argument in (7) assumes that without moral *status*, there is no moral *significance*. Kant denies this. The significance comes from what the act does to the rational agent, not what the victim *is*.

  ### 4. The Cost of Keeping (1) and (3)
  If you reject (4) to save Kant, here is the price you pay:

  **A. You must accept Agent-Centricity:**
  The reason you shouldn't torture the zombie isn't because of what happens to the zombie. It's entirely about *you*. If there were a being that could suffer but torturing it *improved* your moral character (perhaps by steeling your resolve in a specific, bizarre context), Kant's framework might theoretically permit it. The animal/zombie has no veto power.

  **B. You must accept the "Sealed Room" Bullet (with caveats):**
  If you *could* magically know it was a zombie, and you *could* magically guarantee no degradation of your own sympathy (perhaps you are a moral saint immune to habituation), a strict Kantian might have to admit there is no *moral* wrong, only perhaps an aesthetic or prudential one.
  *   *Defense:* Most Kantians argue this scenario is impossible. The very act of choosing to torture something that mimics suffering indicates a defect in the will, regardless of the object.

  **C. "Humanity" is broader than "Rationality":**
  To make this work, you have to lean heavily on Kant's concept of "Humanity" (*Menschheit*). Sometimes Kant uses this to mean rational agency, but often he means the broader capacity to set ends and feel the pull of natural instincts like sympathy. Duties regarding animals are duties to preserve the "Humanity" in yourself.

  ### Recommendation
  To resolve your *reductio* without abandoning Kant:

  1.  **Reject (4).** Replace it with: *"The wrongness is derivative of the duty to maintain one's own moral sensibility."*
  2.  **Modify (5).** Acknowledge that the "psychological certainty" clause is impossible for a finite rational being. We cannot compartmentalize moral vice.
  3.  **Reframe (7).** Moral status *is* invisible (noumenal), but moral *rules* apply to appearances. We treat the appearance of suffering as a trigger for our duty to self.

  This preserves the core Kantian insight (rationality grounds duty) while avoiding the conclusion that you can torture suffering beings in a sealed room. The bar isn't the victim's metaphysics; it's the agent's moral hygiene.
