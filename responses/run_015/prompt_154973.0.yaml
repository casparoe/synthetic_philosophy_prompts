answer: |-
  To determine the underlying logic of your novel, you must decide whether the story you are telling is about the death of civilizations or the transformation of human societies. The Rupture thesis and the Palimpsest hypothesis offer fundamentally different ontological claims about what happens when stress exceeds capacity. The Rupture thesis posits a systemic failure where complexity is lost; the Palimpsest hypothesis posits a reorganization where complexity changes form. For a narrative spanning the Late Bronze Age, the Classic Maya, and Rapa Nui, neither model alone suffices because the historical realities of these three episodes diverge significantly regarding the permanence of institutional loss.

  In the Eastern Mediterranean around 1177 BCE, the Rupture thesis finds its strongest evidence. The destruction of palatial centers was accompanied by the genuine disappearance of Linear B script and the dissolution of international trade networks that would not re-emerge for centuries. Here, the cessation of monumentality and the demographic contraction align with a narrative of discontinuity. However, even here, the Palimpsest hypothesis offers necessary nuance: while the *state* vanished, agrarian communities persisted, and technological innovations (such as iron working) emerged from the ashes. A novel governed strictly by Rupture would render this period a vacuum, ignoring the quiet continuity of the majority of the population who survived the fall of kings.

  In the Classic Maya lowlands, the Palimpsest hypothesis is historically more robust. The ninth-century downturn saw the cessation of monumental dates and the abandonment of major polity centers, fitting the Rupture visual profile. Yet, demographic data indicates that populations did not vanish; they redistributed to lakeshores and coasts, and political authority shifted from divine kings to council-based systems. Literacy persisted in codices even as stone stelae were abandoned. A novel relying solely on the Rupture thesis would mistakenly portray this as an extinction event, missing the thematic richness of adaptation and the shift from centralized glory to dispersed resilience.

  On Rapa Nui, the divergence is sharpest. The traditional Rupture narrative suggests ecocide and societal suicide following the peak of moai construction. Contemporary understanding, however, aligns with the Palimpsest hypothesis: the islanders adapted their agricultural practices and shifted religious focus to the Birdman cult without a catastrophic population collapse prior to European contact. The "ending" here is largely an artifact of later external shocks and earlier archaeological misinterpretation. A Rupture-based logic would force a tragedy of self-destruction that contradicts the evidence of successful long-term management, whereas a Palimpsest logic captures the agency of the population in reshaping their culture to fit ecological limits.

  When distinguishing between the genuine disappearance of literacy and state structures versus their dissolution into fainter networks, the Rupture thesis is better equipped to acknowledge the loss of specific technologies (like Bronze Age literacy), while the Palimpsest hypothesis is better equipped to track the survival of social bonds. The Rupture thesis risks conflating the end of an elite class with the end of a people. The Palimpsest hypothesis risks minimizing the trauma of institutional collapse by framing it merely as a change in visibility.

  For a novel, the stakes require the emotional weight of the Rupture thesis—the characters must feel their world ending—while the historical integrity requires the accuracy of the Palimpsest hypothesis—their culture must not simply vanish into nothingness. A strict adherence to Rupture creates a deterministic tragedy that ignores human resilience; a strict adherence to Palimpsest creates a diffusion of tension that may undermine the dramatic premise of "societal endings." Therefore, the narrative architecture should not adjudicate in favor of one over the other but should utilize the tension between them. The logic should treat "collapse" as a subjective experience of rupture occurring within an objective reality of palimpsestic continuity. This allows you to depict the genuine loss of institutions (writing, kings, monuments) without erasing the persistence of the human communities that inherit the aftermath.

  Verdict: A synthesized position
