answer: |-
  **Welcome to Epicurean Support™**
  **Ticket #NULL-VOID | Status: Terminated**

  Thank you for contacting Epicurean Support regarding your ongoing mortality anxiety subscription. We notice you've submitted a ticket claiming that "being dead sounds terrible." Please review the following FAQ before attempting to escalate this issue to management (The Void).

  **Q: I am terrified of the state of being dead. How do I fix this bug?**
  **A:** Thank you for your feedback. Our diagnostics indicate a logic error in your fear module. Please recall our core service agreement: *Death is nothing to us.* 

  When you are alive, death is not present. When death is present, you are not alive. Essentially, you and death never occupy the same room. Fearing death is like trying to file a customer complaint after you've already deleted your account. There is no "you" to experience the badness. If there is no subject to experience harm, no harm has occurred. We recommend disabling your "Future Self" projection settings immediately.

  **Q: But what about the time after I die? That seems different than now.**
  **A:** We recommend utilizing our Symmetry Protocol™. Please look backward. Consider the vast expanse of time before you were born. Did you suffer during the Jurassic Period? Were you frustrated that you weren't alive to see the invention of the wheel? 

  Most users report zero anxiety regarding their pre-birth non-existence. Our records show you were perfectly fine being dead for billions of years prior to your subscription start date. The time after death is identical to the time before birth. If you aren't upset about the past eternity where you didn't exist, please replicate that emotional state for the future eternity. It's the same feature, just a different direction.

  **Q: I understand I won't feel pain, but isn't death bad because it deprives me of future goods? I'm missing out on pizza, sunsets, and Phil 101 classes!**
  **A:** We have received this "Deprivation Objection" frequently. Please note: This claim has been denied. 

  To experience "missing out," a subject must exist to register the loss. You cannot be deprived of lunch if you do not exist to be hungry. Harm requires sensation. Since death is the removal of all sensation, it is impossible for you to be harmed by the absence of future goods. 

  Think of it this way: Your hairbrush does not feel sad when it is no longer brushing hair. It does not feel "deprived" of brushing opportunities. Similarly, once your subscription ends, there is no entity left to hold the bag of "missed opportunities." You aren't losing the future; you are simply ceasing to be the type of thing that can lose things. Your complaint lacks a complainant.

  **Q: So I should just stop worrying?**
  **A:** Correct. Anxiety about non-existence is a waste of existing resources. Our philosophy is simple: maximize pleasure (ataraxia) while your session is active. 

  Please enjoy a piece of cheese. Talk to a friend. Stop trying to optimize a period of time where you will not be present to collect the data. If you continue to experience distress regarding your inevitable shutdown, please consult a local philosopher or enjoy a nice nap. 

  **Ticket Closed.** 
  **Have a pleasant remaining lifespan.**
