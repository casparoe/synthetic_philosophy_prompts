answer: |-
  **Scenario**
  At Northwood High, the Last Period Walk required any student accused of cheating to meet the accuser behind the gym after school; refusal meant being labeled "Silent," resulting in total social exile. For decades, the tradition persisted because the fear of exile outweighed the physical risk of the fight. The collapse began not with a ban or a speech, but when the varsity captains—the informal arbiters of student status—collectively stopped accepting challenges. When a junior accused a captain, the captain simply handed back the challenge slip unopened, saying, "I don't do drama," and walked to practice. Crucially, the crowd did not jeer the captain as the rules dictated; they nodded in approval. Within weeks, the act of *demanding* a Walk was reinterpreted not as a defense of integrity, but as a signal of social desperation and insecurity. The threat of exile remained in the student rulebook, and the physical danger of the fight remained unchanged, but the tradition evaporated because participating became incompatible with the identity of a "Northwood Leader," rendering the accuser shameful rather than the refuser.

  **Reasoning for the Three Explanations**

  1.  **Moral Argument (Williams):** This account predicts the tradition would **continue**. Williams argues that moral reasoning alone rarely dislodges entrenched social practices because those practices are embedded in habits and institutions, not just propositions. In this scenario, no new moral premise was introduced (e.g., no one argued that violence is inherently sinful or that forgiveness is a duty); the students' abstract views on right and wrong regarding cheating remained static. Since there was no logical proof offered that the Walk was "immoral," the Williams thesis suggests the norm should have persisted despite the captains' behavior.
  2.  **Interest-Based:** This account predicts the tradition would **continue**. A simple interest-based story views norms as equilibria sustained by material payoffs. The Walk provided a useful deterrent against cheating (benefit) and the physical risk was constant (cost). Furthermore, the penalty for refusal (social exile) technically remained in place, meaning the material cost of breaking the norm was still high. A rational actor calculation suggests students should still fear exile and thus maintain the tradition to preserve their social networks and safety, as the tangible payoffs for compliance had not objectively shifted.
  3.  **Honor-Based (Appiah):** This account predicts the tradition would **collapse**. Appiah argues that norms are sustained by the social meaning of actions relative to an identity code. Here, the *meaning* of the Walk shifted: it went from a ritual of "honor maintenance" to a signal of "low status." The captains did not change the rules or the risks; they changed what the action *signified* about a person's character. Once the identity of a "Leader" no longer included "enforcing grievances through violence," the social esteem required to sustain the norm evaporated. Students stopped walking not because it was dangerous or wrong, but because it became *shameful*.

  **Structural Feature and Counter-Arguments**

  The structural feature that makes the honor explanation "peel off" from the others is the **endogenous revaluation of the status signal**. In the interest and argument models, the value of the payoff (status) or the truth of the premise (morality) is treated as exogenous or fixed. In the honor model, the *value* of the status itself is dependent on the internal code of the group. If you remove this feature—if the captains' refusal was viewed as cowardice rather than maturity—the case collapses back into a standard interest story where the cost of exile keeps the norm alive, or an argument story where the norm persists until a moral reason kills it.

  A defender of the **interest-based account** would object by claiming that "social esteem" is just another material interest. They would argue the tradition collapsed because the *cost* of exile dropped (since the crowd nodded), making refusal rational. They would say my scenario simply describes a shift in payoff matrices, not a distinct moral revolution. A defender of the **argument-based account** might claim the captains' behavior constituted a tacit argument that "violence is beneath us," which students rationally accepted.

  However, the feature doing the real work in this scenario is the **decoupling of the rule from the shame**. The rule of exile remained officially active, and the moral view on cheating didn't change. The collapse occurred because the *identity* constituting the honor code shifted *before* the material consequences fully adjusted. The students didn't calculate that exile was safe; they calculated that being the *kind of person* who risks exile for a Walk was identity-incoherent. This distinguishes the honor explanation: it explains why the *value* of the interest changed without a change in the material environment or moral truth.
