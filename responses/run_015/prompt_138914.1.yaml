answer: |-
  ### (a) The Principle of Distinct Cognitive Grounds

  **The Principle:**
  An identity statement '$a=b$' is **informative** for a subject $S$ at time $t$ if and only if understanding the statement requires $S$ to deploy two distinct **cognitive files** (or notions), $F_a$ and $F_b$, where distinctness is individuated by the **grounds of deployment** rather than by descriptive content or orthography.

  A cognitive file is a mental particular used to store and process information about a referent. Two files are distinct if and only if they are anchored by distinct *grounds*. Grounds include:
  1.  **Perceptual Channels:** Distinct sensory modalities or distinct spatiotemporal routes of acquaintance (e.g., morning vs. evening vision; phone vs. monitor).
  2.  **Conceptual Sortals:** Distinct criteria of identity applied to the same perceptual input (e.g., 'Statue' vs. 'Lump').
  3.  **Contextual Encounters:** Distinct episodic contexts of acquisition, even if the descriptive content associated with each is identical.

  **Application to the List:**
  *   **Cases 1, 3, 10 (Informative):** In (1) and (3), the grounds are distinct temporal/perceptual encounters (evening vs. morning; biographical contexts). In (10), the grounds are distinct perceptual channels (auditory/colleague vs. visual/monitor). Distinct grounds $\rightarrow$ Distinct files $\rightarrow$ Informative.
  *   **Case 2 (Empty):** Same term, same ground $\rightarrow$ Same file $\rightarrow$ Empty.
  *   **Case 4 (Informative):** 'Water' is grounded in phenomenal experience; 'H₂O' is grounded in theoretical/chemical description. Distinct grounds $\rightarrow$ Distinct files $\rightarrow$ Informative (despite necessity).
  *   **Case 6 (Empty):** *Crucial Distinction.* Although 'Slim' and 'Weasel' are orthographically distinct, they are introduced in a **single briefing event**. The ground of deployment is the *same stipulative act*. The subject forms one file tagged with two names. No merger is required. $\rightarrow$ Empty.
  *   **Case 7 (Informative):** *Crucial Distinction.* Although there is one perceptual episode, the terms invoke **distinct conceptual sortals** ('Statue' implies artifact criteria; 'Lump' implies material criteria). These sortals constitute distinct grounds for file formation even within a single look. Merging them yields metaphysical insight. $\rightarrow$ Informative.
  *   **Cases 8, 9 (Informative):** In both, the subject maintains two files. In (8), they have conflicting content. In (9), they have identical content but distinct *contextual grounds* (separate corners of life). The principle asserts that contextual grounds suffice for file distinctness, explaining why (9) is informative despite the lack of descriptive difference.

  ### (b) Verdicts to Abandon

  To maintain the precision of this principle as an account of *reference and singular thought*, I recommend you **abandon Case 5** (*The sum of the interior angles...*) as a data point for this specific principle.

  **Why:** Case 5 is a general truth about a concept, not an identity statement between singular terms referring to an object. While it is informative, the mechanism is **conceptual containment or derivation**, not the merger of distinct cognitive files anchored by reference. Including it forces the principle to become a general theory of *learning* rather than a theory of *reference*.
  **Cost:** You lose a unified theory of all "informativeness."
  **Benefit:** You gain a precise tool for singular thought. The phenomenon in (5) is analogous (integration of distinct conceptual roles) but distinct in kind from the referential identity cases. Treating them together obscures the specific mechanics of files and grounds. Do not add a clause to save (5); treat it as a parallel phenomenon in a separate seminar module.

  ### (c) Locus of Informativeness

  On this account, informativeness is a property of **the sentence together with a subject and her current cognitive architecture** (specifically, the state of her files). It is not a property of the sentence alone, nor of the terms alone.

  **Survival of Verdicts (1) and (10):**
  *   **Case 1:** Survives. Even if the fact is necessary (on some views) or contingent, the *subject's* files remain distinct until merged. The relativization preserves the verdict that it is informative *for the subject*.
  *   **Case 10:** Survives. The distinctness relies on the subject's specific perceptual links (phone vs. monitor). If a god-like observer saw the causal chain as one, it might be empty for them, but it remains informative for *you*. The principle correctly predicts this relativity.

  ### (d) Substitution Failure and Informativeness

  **Verdict:** They are the **same phenomenon**.

  **Boundary:** The boundary falls at the **integration of cognitive files**.
  *   **Informativeness** is the *process* or *potential* of merging two distinct files.
  *   **Substitution Failure** in belief contexts is the *symptom* of those files being kept separate.
  *   In Cases 8 and 9, the subject refuses to substitute because the files are not yet merged. Once the identity is accepted (the information is learned), the files merge, substitution becomes valid (in the subject's idiolect), and the statement ceases to be informative *for that subject*.
  *   **Case 9 Specifics:** This account explains why substitution fails in (9) despite no descriptive difference. Substitution operates on *files*, not just content. If the files are distinct (due to contextual grounds), substitution fails, and the identity is informative.

  ### (e) Verdicts on Unsettled Cases

  **1. 'I am this human animal' (Mirror):**
  **Verdict: Informative.**
  **Reasoning:** The term 'I' is grounded in **first-person subjective access** (proprioception, agency, internal perspective). The term 'this human animal' is grounded in **third-person perceptual access** (visual observation of a body). These are distinct grounds of deployment (Subjective vs. Objective). Even though they refer to the same entity, merging these files yields the substantive realization of embodiment. You should abandon the intuition that it is empty; that intuition likely confuses *reference* (which is secure) with *cognitive significance* (which is distinct).

  **2. 'A is B' (Forgotten Single Briefing):**
  **Verdict: Empty.**
  **Reasoning:** This is the harder case, but the principle forces a specific line. Informativeness tracks the *current structure of cognitive files*, but file individuation tracks the *original grounds of acquisition*. In the "Forgotten Briefing," the two names were anchored in a **single stipulative event**. Unless the subject has actively split the file (e.g., by assuming they are different people due to the memory loss), the cognitive architecture likely retains a single file with two name-tags. Mere forgetting of the *link* does not create a new *ground*. If the file remains one, the statement is empty (a tautology the subject has forgotten). If the subject has genuinely bifurcated their mental representation into two competing files based on the ignorance, *then* it becomes informative. However, the default assumption for a "single breath" introduction is a unified file. Therefore, the informativeness is merely apparent, born of memory failure, not a genuine open question about the world. You should treat this as **Empty**, distinguishing it from Case 1 (where the grounds were genuinely distinct from the start).

  ### (f) Prediction

  **Case:** *The Latency Loop.*
  A subject watches a live video feed of themselves on a monitor. Unknown to them, there are two monitors. Monitor A has zero latency. Monitor B has a 5-second delay. The subject is asked: "Is the person on Screen A the person on Screen B?"

  **Principle's Prediction:** **Informative.**
  **Reasoning:** Although the referent is the same (the subject) and the modality is the same (visual), the **perceptual channels** are distinct in virtue of their temporal properties (immediate vs. delayed). These constitute distinct grounds for file formation (one file for "me-now", one for "that-person-then"). Merging them requires the empirical discovery of the latency setup.
  **Contrast:** If the subject is told *in advance* that both screens show the same feed with different latency (a "Single Briefing" about the setup), the statement becomes **Empty** (analogous to Case 6), because the grounds are unified by the stipulative explanation.
