answer: |-
  This is a sharp observation, and you are right to feel that itch. You have identified a specific epistemological failure mode that is endemic to archaeology (and anthropology/history), particularly where "ritual" or "symbolic behavior" is the explanatory variable.

  There is no single universally agreed-upon word for the *combination* of your two versions, but they are well-documented separately in the philosophy of science and archaeological theory. Together, they form a self-sealing system.

  Here is the breakdown of what you are seeing, the existing terminology that fits, where those terms fall short, and how to define the edge you are looking for.

  ### 1. Diagnosing the Two Versions

  **Version 1: The Elastic Category (Careful vs. Careless)**
  *   **The Mechanism:** This is **Equifinality** weaponized as an **Immunizing Stratagem**.
  *   **The Theory:** In archaeology, *equifinality* is the neutral principle that different processes can create the same material trace (e.g., a broken pot can be accident or ritual).
  *   **The Fallacy:** Your reports are taking equifinality and turning it into a **Protective Belt** (a term from Imre Lakatos). The "Hard Core" of the research programme is "This society engaged in ritual deposition." When data contradicts the expected pattern of ritual (e.g., it looks like rubbish), the "Protective Belt" adjusts the definition of ritual to include rubbish ("the point was the refusal").
  *   **The Logical Error:** If $A$ (careful deposit) $\rightarrow$ Ritual, and $\text{not-}A$ (careless deposit) $\rightarrow$ Ritual, then the presence or absence of $A$ has no bearing on the hypothesis. The category has become **unfalsifiable by design**, not by nature.

  **Version 2: The Epistemic Inversion (Unique vs. Common)**
  *   **The Mechanism:** This is the **Argument from Ignorance** (*argumentum ad ignorantiam*), specifically the **"God of the Gaps"** variant.
  *   **The Theory:** In a robust classification, positive evidence confirms a category (wear traces $\rightarrow$ tool).
  *   **The Fallacy:** Here, the *absence* of evidence for a mundane category is treated as *positive* evidence for the special category. "We don't know what this does" becomes "We know this is ritual."
  *   **The Logical Error:** It treats "Ritual" as a **Residual Category** (everything that isn't clearly something else) but then treats that residual status as a **Positive Identification**.

  ### 2. Are They the Same Thing?

  They are not the same logical move, but they are **symbiotic**.

  *   **Version 2** supplies the *content* (this object is special/ritual because we don't understand it).
  *   **Version 1** supplies the *context* (this deposit is special/ritual regardless of how it looks).

  Together, they create what I would call an **Interpretive Sink**. Data goes in, gets labeled "ritual," and the criteria for entry shift to ensure nothing bounces off. Version 2 ensures objects enter the category; Version 1 ensures the category cannot be emptied.

  ### 3. Is There a Name?

  You mentioned "Residual Category." This is the closest established sociological term (often associated with Durkheim or Mary Douglas), but it describes the *structure*, not the *fallacy*.

  In archaeological theory, this is often critiqued under the banner of **"The Ritual Dump"** or **"Ritual as a Default Explanation."** Colin Renfrew and others have warned against using "ritual" as a label for anything that lacks an obvious economic function.

  However, for the specific logical maneuver you described—a category that maintains its extension while inverting its intension (criteria) to absorb contradiction—the most precise philosophical label is **Conceptual Stretching** (Giovanni Sartori) combined with **Ad Hoc Rescue**.

  If we need a term for the specific phenomenon of "Ritual" behaving this way, the field sometimes uses **"Reification of the Residual."** You are taking a bucket labeled "Unknown" and treating it as a bucket labeled "Sacred."

  **If I were to coin a term for your specific description:**
  **"Negative Definition with Elastic Boundaries."**
  *   **Negative Definition:** Defined by what it is *not* (not domestic, not utilitarian).
  *   **Elastic Boundaries:** The definition of "domestic/utilitarian" shifts to ensure the object remains outside it.

  ### 4. Where is the Edge? (Genuine Testing vs. Immune Reading)

  You asked for the boundary between a legitimate broad category (like "tool") and this elastic one. Here is how you tell them apart.

  **A. Positive vs. Negative Definition**
  *   **Legitimate Broad Category (Tool):** Defined by positive traits. Even if "tool" covers hammers, knives, and scrapers, they all share *wear patterns, material selection, or modification*. You can describe a tool without saying "not food."
  *   **The Problematic Category (Ritual):** Defined negatively. "It is ritual because it has no wear, no parallels, and isn't food."
  *   **The Test:** Can you list three positive material attributes that *must* be present for a deposit to be ceremonial, which are *not* simply "absence of domestic traits"? If the answer is "no," it is a residual category, not an analytical one.

  **B. Predictive Power vs. Explanatory Coverage**
  *   **Legitimate:** A hypothesis should predict what you *haven't found yet*. "If this is a ritual pit, we should find X near the entrance, or Y absence in the surrounding soil."
  *   **The Problematic:** The hypothesis only explains what you *have already found*. It has 100% explanatory coverage of the past data and 0% predictive power for new data.
  *   **The Test:** Ask the author: "What would a *non-ceremonial* pit look like in this context?" If they say "A pit with domestic rubbish," and you point out the midden pit was also called ceremonial, the category has collapsed.

  **C. Independent Variables**
  *   **Legitimate:** The interpretation relies on independent lines of evidence converging. (e.g., The pot is smashed [trace], the location is non-domestic [spatial], the species is non-edible [faunal]).
  *   **The Problematic:** The interpretation relies on a single variable (uncertainty) applied recursively. (It's weird, therefore ritual; it's ritual, therefore the weirdness is explained).
  *   **The Test:** **Middle Range Theory.** Is there an ethnographic or experimental link between the action (smashing a pot in a midden) and the label (ritual)? Or is the link assumed? If the link is "People do weird things in rituals," that is not a testable middle-range theory; it is a tautology.

  ### 5. What Would a Genuine Test Look Like?

  To save the "ceremonial" reading from this complaint, the report would need to do one of the following:

  1.  **Restrict the Category:** Admit that Pit A and Pit B might be different phenomena. Call Pit A "Structured Deposition" and Pit B "Rubbish Disposal with Symbolic Resonance." Do not force them into the same box just to boost sample size.
  2.  **Define the "Ritual" Positive:** Identify a specific marker. "We classify this as ceremonial not because the pot is broken, but because the breakage pattern (radial vs. edge) matches ethnographic examples of deactivation."
  3.  **Accept the Null:** State clearly: "This deposit lacks domestic markers. It *could* be ritual, but it could also be atypical disposal. We label it 'ambiguous' rather than 'ceremonial'."

  ### Summary

  You are witnessing **the Reification of a Residual Category protected by Immunizing Stratagems.**

  *   **Version 1** is the **Immunizing Stratagem** (changing the rules to save the hypothesis).
  *   **Version 2** is the **Residual Reification** (treating "unknown" as "sacred").

  They are distinct but work together to make the "Ritual" hypothesis immune to data. A genuine archaeological category must be defined by the **presence** of traits, not the **absence** of alternatives, and it must be vulnerable to being proven wrong. If "ritual" explains both the careful pot and the smashed pot, it explains neither.

  **The coinage:** If you need a shorthand for your colleagues, call it **"The Ritual Sink."** It describes a category that swallows contradictory data and emits certainty. The boundary case is simple: **If your definition of the category relies on the absence of evidence for other categories, it is a sink, not a classification.**
