  No single wealth-maximization principle survives intact; the closest coherent framework is to maximize the expected logarithmic utility of your total lifetime wealth subject to ruin constraints, but adopting this forces you to drop your intuition on longshots and single-shot bets.

  Your verdicts are a patchwork of three different decision models: geometric growth (Kelly), ruin aversion (insurance), and prospect theory (longshots). To unify them, you must adopt a broader **Expected Utility of Lifetime Well-Being** principle rather than a strict financial growth rule. Here is how that principle maps to your cases, clause by clause:

  1.  **"Maximize expected logarithmic utility of total lifetime wealth."** This covers your repeated coin flip (25% stake) and the twenty independent bets (diversification). It treats money as a tool for future consumption, where each additional dollar matters less than the last. This clause motivates the Kelly-aligned cases where you feel comfortable risking significant capital because the math supports long-term compounding.
  2.  **"Subject to hard constraints on ruin."** This covers the home insurance. Even though the premium is 60% above expected loss (negative EV), the utility drop from losing your home exceeds the utility gain from saving the premium. You are not maximizing wealth here; you are buying survival. This clause also explains why you won't bet against your brother; the "ruin" includes social capital and family relationships, which are infinite costs in your utility function.
  3.  **"Apply a fractional discount to edge estimates."** This covers the 60% confidence bet. You intuitively understand parameter uncertainty; if your model might be wrong, full Kelly is suicidal. Betting 6% instead of 20% is "Fractional Kelly," a standard adjustment for noisy data.

  However, this unified principle forces you to drop two of your current verdicts to maintain mathematical consistency:

  *   **Drop the longshot overbetting.** You said you'd bet 3% on a 1% shot at 1000x, while log utility dictates roughly 1%. Betting 3% implies convex utility (risk-seeking) in that domain, which directly contradicts the concave utility (risk-aversion) you show by buying insurance. You cannot be risk-averse against losing your house and risk-seeking on lottery tickets without admitting your utility function is inconsistent. To align with geometric rationality, you must cap this at 1%.
  *   **Drop the one-shot versus repeated asymmetry.** You said you'd bet 10% on a single 3x flip but 25% if repeated. If you maximize expected log wealth, the bet size depends on the edge and odds, not the number of trials, provided you aren't facing immediate ruin. Betting less on the one-off suggests you are more risk-averse than log utility for single events, perhaps due to regret minimization. To stick to the principle, you must either bet 25% on the single shot or 10% on the repeated series.

  Regarding your undecideds:
  *   **The capped 50/50 bet:** If the bet has positive expected value and cannot ruin you (capped at 20%), the principle says bet the max. Your hesitation likely stems from model uncertainty or a hidden fear of loss, not the math. If you trust the 50/50 estimate, bet the 20%.
  *   **Non-money stakes:** The principle transfers directly if you define "wealth" as "lifetime well-being." Quitting a stable job for a 10% shot at something better is a Kelly-style bet on your human capital. You should calculate the expected utility of the outcomes (income, satisfaction, stress) rather than just money. If the downside leaves you destitute (ruin constraint), don't take it. If the downside is manageable and the upside is transformative, the growth rate logic applies.

  To be consistent, you must accept that you are not a pure geometric growth optimizer. You are a survival-constrained utility maximizer who occasionally indulges in risk-seeking behavior. If you want a single rule, choose survival-constrained log utility and stop overbetting longshots.
