answer: |-
  Henry Sidgwick sits opposite a translucent figure at a Society for Psychical Research séance. He looks not terrified, but administratively burdened. He had hoped this apparition might finally resolve the Dualism of Practical Reason—proof of an afterlife would reconcile self-interest with universal duty—but he refuses to bypass protocol.

  "I acknowledge your manifestation," Sidgwick says, opening a ledger. "But before I grant you ontological status, you must survive the Methods."

  He runs through the list. "Egoism fails; you're dreadful for my nerves. Intuitionism fails; your presence isn't self-evident, it's merely sensory. And now, Utilitarianism." He scribbles furiously. "If I validate you, I encourage superstition. The aggregate pain of future charlatans outweighs the pleasure of solving my ethical dilemmas."

  He closes the ledger. "I'm sorry. You cannot exist."

  The ghost rattles a chain in protest. "But I'm standing right here!"

  Sidgwick adjusts his spectacles. "Factually, perhaps. But your net utility is negative. I'm afraid I must vote you out of reality."
