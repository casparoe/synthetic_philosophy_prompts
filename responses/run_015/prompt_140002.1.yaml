answer: |-
  Here is the specification for your decision procedure. I have constructed this as a set of commitments. I am not offering you a menu of options; I am offering you the framework I believe is robust enough to handle the edge cases you listed without collapsing into metaphor or biology-chauvinism.

  ### Part 1: The Desiderata for a Decision Procedure

  These are the requirements your definition must meet to function as a field guide for the unknown. I have marked them as **Non-Negotiable** (the procedure fails without them) or **Preference** (desirable but theoretically expendable).

  **1. Operationalizability (Non-Negotiable)**
  *   **Requirement:** The definition must yield a verdict based on observable, measurable properties within a finite time. It cannot rely on hidden essences, future potential that cannot be tested, or historical knowledge unavailable to the observer.
  *   **Justification:** You are building a *field guide*. If a rover finds a rock that *might* have been alive a million years ago, but your definition requires knowing its ancestry, the guide is useless. If the test takes a century to run, it is not a test.
  *   **Case:** The Dormant Seed. You cannot wait 100 years to see if it wakes. You must be able to inspect its structure *now* to determine if it is a viable organism or a dead husk.

  **2. Substrate Neutrality (Non-Negotiable)**
  *   **Requirement:** The definition cannot specify chemical elements (carbon, water) or specific molecules (DNA, proteins). It must refer to functional roles (e.g., "information storage polymer," "solvent").
  *   **Justification:** Your purpose includes "samples a rover might bring back" and "things assembled in a lab." If you define life as "having DNA," you automatically rule out silicon-based aliens or synthetic XNA life, rendering the guide parochial.
  *   **Case:** The Computer Worm. If life is just "information processing," the worm qualifies. If life requires "chemical metabolism," it fails. Substrate neutrality forces you to decide if *thermodynamics* is essential or if *logic* is enough. (I argue thermodynamics is essential).

  **3. Organizational Closure (Non-Negotiable)**
  *   **Requirement:** The system must produce the very components and boundaries that constitute the system. It must be causally self-contained regarding its own maintenance.
  *   **Justification:** This distinguishes a living thing from a machine or a process. A fire consumes fuel and grows, but it does not build the fire. A factory produces cars, but the factory does not build itself. Life must build the "walls" that keep it distinct from the environment.
  *   **Case:** The Factory Process. It consumes fuel and grows (in output), but it does not produce the machinery that does the consuming. It fails closure.

  **4. The Darwinian Threshold (Non-Negotiable)**
  *   **Requirement:** The system must be capable of heredity with variation, such that the variations affect the system's ability to maintain Organizational Closure.
  *   **Justification:** This distinguishes life from a static crystal or a solitary individual that cannot pass on its traits. It ensures the definition captures the *lineage* capability, not just the momentary state.
  *   **Case:** The Sterile Individual (Mule). This is the tension point. The individual is alive, but it cannot meet this requirement *on its own*. The definition must apply to the *kind* of system it is, not just the specific instance. (See Part 3).

  **5. Binary Verdict Capability (Preference)**
  *   **Requirement:** The guide should output "Alive" or "Not Alive," not a probability or a degree.
  *   **Justification:** Practical utility. A border guard needs a yes/no on a visa; a planetary protection officer needs a yes/no on quarantine.
  *   **Caveat:** Reality may be continuous (a spectrum), but the *tool* must discretize it. This is a pragmatic constraint, not necessarily an ontological truth.

  **6. Anthropocentric Intuition Matching (Preference)**
  *   **Requirement:** The definition should generally agree with human intuition on standard cases (cats, trees).
  *   **Justification:** If your guide says a cat is not alive, nobody will use it. However, this is a preference because intuition is often wrong about edge cases (e.g., viruses).
  *   **Case:** The Computer Worm. Intuition says "no." A purely functional definition might say "yes." You must prioritize the physical constraints over the intuition.

  ---

  ### Part 2: The Specific Edge Cases (Your List)

  Here is how the desiderata above force a ruling on the cases you provided.

  *   **Sterile Individual (Mule):** **Verdict: Alive.**
      *   *Reasoning:* Requirement 4 (Darwinian Threshold) applies to the *lineage type*, not the specific token. The mule is an instance of a closure-organized system (Requirement 3) belonging to a lineage that evolves. To rule it dead is to confuse the *capacity of the kind* with the *state of the individual*.
  *   **Dormant Seed:** **Verdict: Alive.**
      *   *Reasoning:* Requirement 1 (Operationalizability) prevents us from waiting for germination. Requirement 3 (Closure) is satisfied structurally. The machinery for closure is present but paused. It retains the *internal* capacity to resume closure without external assembly.
  *   **Clonal Forest:** **Verdict: Ambiguous (Nested Life).**
      *   *Reasoning:* Requirement 3 (Closure) is the test. If the trees share a vascular system and regulate resources collectively, the *forest* is the individual. If they compete and are only genetically identical, the *tree* is the individual. The guide must rule that life is hierarchical. Both can be alive at different scales.
  *   **Computer Worm:** **Verdict: Not Alive.**
      *   *Reasoning:* Fails Requirement 3 (Closure) and Substrate Neutrality regarding thermodynamics. It does not harvest energy to maintain its own physical boundary; it relies on the hardware's metabolism. It is a *pattern*, not a *material system*.
  *   **Factory Process:** **Verdict: Not Alive.**
      *   *Reasoning:* Fails Requirement 3 (Closure). It does not produce the factory. It also fails Requirement 4 (Heredity). The products do not inherit the capacity to build factories.
  *   **Lab Cell (Synthetic):** **Verdict: Not Alive (in isolation).**
      *   *Reasoning:* If it requires an external machine it did not build and cannot repair to reproduce, it lacks Organizational Closure. It is a *component* of a larger system (Cell + Machine). If you find the cell alone, it is a corpse or a tool.

  ---

  ### Part 3: The Three Made-Up Cases

  You asked for commitments on these specific scenarios. Here is what the desiderata above force me to say, and whether I believe it is correct.

  **1. The Rental**
  *   **Scenario:** An organism where every part, including the boundary and copier, is manufactured by a partner organism living inside it.
  *   **Verdict:** **Alive.**
  *   **Reasoning:** This is an extreme version of endosymbiosis (like mitochondria) or a host-parasite dependency. Requirement 3 (Closure) is satisfied *relationally*. The "Rental" creature maintains its own organization, even if the *source* of the parts is internalized. As long as the *control logic* for the maintenance resides in the Rental creature (it directs the partner), it is an agent.
  *   **Is this right?** Yes. Dependency does not negate life. A human cannot survive without gut bacteria; we are still alive. The Rental is just more integrated.

  **2. The Library**
  *   **Scenario:** Heredity is carried by the shape of a structure built by the parent, not by internal genetic material. The structure is rebuilt with variation each generation.
  *   **Verdict:** **Alive.**
  *   **Reasoning:** This satisfies Requirement 4 (Darwinian Threshold). Heredity does not require DNA; it requires high-fidelity transmission of form with variation. This is "structural inheritance."
  *   **Is this right?** Yes. To demand DNA is biology-chauvinism (violates Requirement 2). If the information persists and evolves, the system is living.

  **3. The Twin Ladder**
  *   **Scenario:** A lineage that must alternate between splitting (asexual) and exchanging material (sexual) every generation. Neither works alone for more than one step.
  *   **Verdict:** **Alive.**
  *   **Reasoning:** The *lineage* satisfies Requirement 4. The *individual* is a stage in the life cycle. The guide must rule that the *process* is alive, and the individual is alive by virtue of participating in that process.
  *   **Is this right?** Yes. Many Earth organisms have complex life cycles (e.g., slime molds, ferns). Obligate alternation is just a constraint on the reproduction mechanism, not a negation of life.

  ---

  ### Part 4: The Tension (Reverse-Engineering vs. Agreement)

  You suspected a tension between "Do not reverse-engineer from Earth life" and "Must agree with us about Earth life." **This tension is real, but it is not a contradiction.** It is a constraint on *how* you derive the rule.

  *   **The Conflict:** If you define life as "Has DNA," you agree with Earth life but fail the "No Reverse-Engineering" rule (you just listed Earth ingredients). If you define life as "Has Evolution," you might agree with Earth life, but you risk including computer viruses (which evolve).
  *   **The Resolution:** You must match Earth life **Functionally**, not **Structurally**.
      *   *Wrong:* "Life uses DNA." (Structural/Reverse-engineered).
      *   *Right:* "Life uses a stable polymer to store heritable information." (Functional).
      *   *Wrong:* "Life breathes oxygen." (Structural).
      *   *Right:* "Life maintains a thermodynamic gradient against equilibrium." (Functional).
  *   **What must be given up:** You must give up the idea that **certainty is possible.** You are creating a hypothesis about physical systems. If we find a system that meets all your functional criteria but intuitively feels like a "process" (e.g., a self-replicating flame), you must be willing to call it alive or admit your definition is wrong. You cannot protect your definition by saying "Well, it's not *really* life."
  *   **The Difference:** The first demand (No Reverse-Engineering) is about **Generalization** (can this apply to aliens?). The second demand (Agree with Earth) is about **Calibration** (does this instrument measure what we think it measures?). You calibrate on Earth to measure the Universe.

  ---

  ### Part 5: The Killer Requirement

  You asked for the single requirement that excludes the largest number of definitions on offer, including the popular "self-maintaining chemistry that can evolve" (the NASA definition).

  **The Requirement:** **Organizational Closure (specifically, Boundary Production).**

  *   **What it rules out:** It rules out the "NASA Definition" because the NASA definition allows a "system" to be defined loosely. A virus in a host is a "self-sustaining chemical system capable of evolution." A fire in a fuel source is a "self-sustaining chemical system."
  *   **Why it excludes them:** Organizational Closure demands that the system **produces its own boundary.**
      *   A virus does not build its own capsid; the host cell does. **Ruled Out.**
      *   A fire does not build the boundary that contains the heat; the environment does. **Ruled Out.**
      *   The "Factory Process" does not build the factory walls. **Ruled Out.**
      *   The "Lab Cell" (that relies on an external machine) does not build its own reproductive machinery. **Ruled Out.**
  *   **Why this is a point in its favor:** This prevents "life" from becoming a metaphor for any persistent pattern. It anchors life in **physics and thermodynamics**. It ensures that when you say "Alive," you mean "This object is actively fighting entropy using its own internal organization." This is the only way to distinguish a living cell from a self-replicating crystal or a computer simulation. It forces the definition to be about *things*, not *ideas*.

