  # The Money Pump Sorting Tree

  ### Instructions for Use
  Do not read the leaf names (the bolded positions at the bottom) until you have answered every question. Answer based on your intuition about the cases described in the questions. If you disagree with the binary choice, pick the side that is *less wrong* for you. Once everyone has traced their path to a leaf, reveal your positions.

  ---

  ### The Tree

  **Start:** All four of us accept: *There is nothing irrational about my preferences changing over time, or about my preferring A to B, B to C, and C to A. The fact that someone could offer me a sequence of swaps that leaves me poorer does not, by itself, show that anything is wrong with me.*

  **Q1. The Ordinary Pump**
  Imagine you know the whole cycle in advance (A→B→C→A) and you know you will pay a cent each swap. You make the swaps anyway.
  *Does the mistake lie in your **Preferences** (you value things cyclically) or your **Situation** (you failed to manage your future actions)?*
  *   **Preferences** → Go to Q2.
  *   **Situation** → Go to Q4.
  *   **Neither** (It is fine) → Go to Q7.

  **Q2. The Counter-Pump** (Preferences Branch)
  Imagine a sequence that would leave you poorer, but it costs the exploiter more than it gains, so no one with any incentive would ever run it.
  *Does the mere possibility of this loss condemn your preferences, even if it never happens?*
  *   **Yes** → Go to Q3.
  *   **No** → **Leaf: The view that rationality is entirely local to a time slice.**

  **Q3. The Fountain** (Preferences Branch)
  With cyclic preferences there is also a sequence that leaves you *richer*, if someone patient pays you to move round your own cycle in the direction you dislike.
  *Does the existence of this possible gain cancel the defect of the possible loss?*
  *   **No** (Loss defines the defect) → **Leaf: Judging each swap on its own plus a consistency requirement on your preferences at a time.**
  *   **Yes** (Symmetry matters) → **Leaf: The view that rationality is entirely local to a time slice.** *(Note: This path merges with Q2-No)*.

  **Q4. The Blind Pump** (Situation Branch)
  The same swaps, but offered one at a time by someone who does not announce the sequence, so that no amount of foresight lets you anticipate it.
  *Are you vulnerable to the same criticism as in the Ordinary Pump, even if you couldn't foresee the cycle?*
  *   **Yes** (Vulnerability is enough) → **Leaf: The view that the lesson of the pump is about foresight, self-knowledge, or not being exploitable rather than about the shape of your preferences.**
  *   **No** (Knowledge is required) → Go to Q5.

  **Q5. The Self-Pump** (Situation Branch)
  What exploits you is not a bookie but your own future self's impatience (your Tuesday self charges your Monday self to swap).
  *Is this the same failure as the bookie pump?*
  *   **No** (Intrapersonal is different) → **Leaf: Planning as permitted but not required of you.**
  *   **Yes** (Intrapersonal = Interpersonal) → Go to Q6.

  **Q6. The Forgiving Pump** (Situation Branch)
  A friend runs the sequence and quietly returns the money at the end, so you finish with what you started with and were never exploited.
  *Did you fail your plan even though you lost nothing?*
  *   **No** (Revise if harmless) → **Leaf: Judging whole sequences and revising your plan while treating your future selves as part of the situation you are planning around.**
  *   **Yes** (Stick to plan) → **Leaf: Judging whole sequences and sticking to your plan even when, at the later moment, breaking it looks better.**

  **Q7. The Opinion Node** (Neither Branch)
  Does any of this logic carry over from preferences to **opinions** (i.e., to an updating habit that does not line up with the probability calculus)?
  *   **Yes** → **Leaf: The view that rationality is entirely local to a time slice.** *(Note: Merges with Q2-No)*.
  *   **No** → **Leaf: The view that pump arguments show nothing about rationality.**

  ---

  ### Logical Space and Diagnostics

  **Combinations Ruled Out (Incoherent):**
  *   *Preferences Defective + Blind Pump Excuses:* If your preferences are inherently defective (Q1), ignorance of the sequence (Q4) should not excuse you. This combination is logically unstable.
  *   *Situation + Self-Pump Different + Stick to Plan:* If your future self is not a bookie (Q5-No), you cannot be required to stick to a plan against their will (Q6-Yes). This is unattractive.

  **Unoccupied Combinations (Merely Unexplored):**
  *   *Preferences Defective + Fountain Cancels:* (Q3-Yes). Few argue that the *possibility* of gain cancels the *defect* of cyclic preferences without moving to a Strategy view.
  *   *Neither + Opinions Apply:* (Q7-Yes). Radical skeptics about the pump usually deny the analogy to beliefs entirely.

  **Tie-Breakers for Indistinguishable Leaves:**
  The tree cannot fully separate **"Rationality is entirely local to a time slice"** (arrived at via Q2, Q3, or Q7) from **"Planning as permitted but not required of you"** (Q5-No). Both reject cross-time obligations.
  *Ask these three questions to separate them:*
  1.  If your future self begs you to change your mind, are you *allowed* to listen? (Local: Yes. Permitted: Yes.) -> *Tie.*
  2.  Is a cyclic preference *wrong* in itself? (Local: No. Permitted: Maybe.)
  3.  Do you owe your past self anything? (Local: No. Permitted: No, but you might choose to.)
  *Diagnosis:* These positions are neighbors. The tree sorts them by *why* they reject the pump (Preferences vs. Strategy), but their practical advice overlaps.

  ---

  ### Leaf Profiles

  1.  **Judging each swap on its own plus a consistency requirement on your preferences at a time.**
      *   *Awkward Commitment:* You must admit you are irrational even if no one ever exploits you and you lose no money.
  2.  **Judging whole sequences and revising your plan while treating your future selves as part of the situation you are planning around.**
      *   *Awkward Commitment:* You may abandon a plan today that you knew yesterday was best, provided you don't lose cash.
  3.  **Judging whole sequences and sticking to your plan even when, at the later moment, breaking it looks better.**
      *   *Awkward Commitment:* You must sometimes act against your current strongest desire to satisfy a past desire.
  4.  **Planning as permitted but not required of you.**
      *   *Awkward Commitment:* You are rational even if you knowingly let your future self exploit you, as long as you didn't promise not to.
  5.  **The view that pump arguments show nothing about rationality.**
      *   *Awkward Commitment:* You must accept that a person who pays to spin in circles is not making a mistake.
  6.  **The view that rationality is entirely local to a time slice.**
      *   *Awkward Commitment:* You cannot criticize your past self for making a choice that harms you today, because they were a different person.
  7.  **The view that the lesson of the pump is about foresight, self-knowledge, or not being exploitable rather than about the shape of your preferences.**
      *   *Awkward Commitment:* A person with cyclic preferences is rational as long as they are ignorant enough not to be caught.

  ---

  ### How to Use This Handout

  1.  **Silent Tracing:** Each member takes 5 minutes to trace their path through the questions alone. Do not discuss your answers.
  2.  **Commitment:** Write down your final Leaf Name on a card.
  3.  **Reveal:** Place cards face up. If you landed on the same leaf, you agree on the *structure* of the problem, even if you quibble on details.
  4.  **Disagreement:** If you landed on different leaves, look at the **first Question** where your paths diverged. Argue *only* about that case. (e.g., "I think the Blind Pump matters," vs "I think it doesn't.")

  **Honest Limitation:** This instrument cannot settle whether "Rationality is local" or "Planning is permitted." Both views agree that you are not *required* to bind yourself. The tree sorts by *justification* (Preferences vs. Strategy), but if your group splits on these two leaves, you are practically aligned but philosophically distinct. You will have to agree to disagree on the *reason* for your freedom.
