prompt: |-
  ok so i've been arguing with friends about when someone is actually dead, brain dead or heart dead, and I realized I don't even know what I'm asking a theory of death to cover. before I pick a side I want the full checklist: what cases must it handle right? like a patient with no brainwaves but still breathing on a machine, someone whose heart stops then starts again after a few minutes, the case where only the brainstem works so the body breathes but there's zero awareness ever, and maybe a weird future thing where half someone's brain gets replaced by a synthetic net but they still talk and remember stuff - is the original person dead then? for each tell me why it matters. then the distinctions it can't collapse: dead versus dying, biological death versus legal declaration, losing all consciousness versus losing heart function. also flag if any two requirements on this list fight each other - like can you really demand both 'no possible consciousness' and 'permanent circulatory stop' when machines can seperate those? I think that's the part I care about most. then briefly, how do the whole-brain-death view and the heart-stop view do against your list? which single rule knocks out the most theories? don't need citations or book lists, I just want the logic spelled out. oh and one more thing - if hospitals keep bodies going artificaly for months, does that break a theory or is it just a practical detail? I keep going back and forth on that.
