  2. We acknowledge that public attention is finite, yet we diverge on whether neglecting the sleeping archive constitutes a culpable omission or a legitimate political decision to allocate attention elsewhere. The crux lies in whether forgetting is inherently a secondary wrong or a necessary condition for shared citizenship, testable by measuring social cohesion in societies with high-archive/low-engagement versus low-archive/high-ritual profiles. The Remembrance camp predicts cohesion will fracture without engagement, while the Amnesty camp predicts fracture occurs only when engagement becomes coercive.

  3. We concur that the death of the last living witness alters the landscape of memory, but we dispute whether this event intensifies the duty to prevent distortion or dissolves the duty to maintain grief. The crux is whether descendants inherit ethical debt or merely historical data, which we can test by comparing restitution claims filed by second-generation victims versus third-generation perpetrators. The Remembrance camp predicts sustained claims based on inherited identity, while the Amnesty camp predicts claims should expire with living memory to enable political renewal.

  4. We identify that a significant portion of our conflict is verbal, stemming from the Remembrance camp defining "remembering" as an active mental state and the Amnesty camp defining it as a passive civic status of non-denial. The crux is whether memory is a practice of the mind or a structure of the state, testable by measuring support shifts when the sleeping archive is framed as "secured data" versus "silent testimony." Remembrance predicts support drops with the former framing, while Amnesty predicts support rises with it.

  5. We agree that memory policies serve instrumental ends, but we disagree on whether the primary end is rectifying past wrongs or securing future stability. The crux is whether a stable peace built on silence is preferable to a fractured justice built on testimony, testable by longitudinal studies of post-conflict societies that prioritized amnesty over truth commissions. The Remembrance camp predicts latent violence will return without truth, while the Amnesty camp predicts latent violence is caused by keeping grievances hot.
