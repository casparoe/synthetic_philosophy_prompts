          *   *Existing Data:* Framing effects (Tversky/Kahneman) are robust.

      *   **Section 2: Uncertainty & The Identification Problem**
          *   *Analysis:* Choice = f(Utility, Beliefs). To get U, we need P. To get P, we need U.
