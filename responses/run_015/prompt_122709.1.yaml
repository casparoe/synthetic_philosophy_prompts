          *   *Defeater:* If an agent violates SEU (e.g., Ellsberg Paradox), the Repair Strategy says "re-describe the outcomes." But if the agent explicitly states "I know the probabilities are the same, I just dislike ambiguity," the Repair Strategy says "Then 'ambiguity' is part of the utility."
          *   *Concession:* The defender must concede that this makes "utility" absorb *everything* non-probabilistic, including irrational fears or misunderstandings of math.
          *   *Rival Check:* Hedonic accounts don't care about probabilities, only outcomes. Objective lists same. Informed Desire struggles with the same uncertainty calibration.
