      *   **Section 4: Consequences (WTP & IPC)**
          *   *Analysis:* WTP = Benefit. IPC = Incoherent.
          *   *Defeater:* Wealth Effects. A rich man's $100 is less "valuable" than a poor man's $100 in terms of welfare, but WTP treats them as equal units.
          *   *Concession:* The defender must say "Welfare *is* willingness to pay given current endowment." This is politically toxic but logically consistent.
          *   *Rival Check:* Hedonic/Obj List definitely disagree here. They allow IPC.
          *   *Verdict:* **Awkward** (Socially/Politically), **Fatal** (if one believes welfare *should* track need).

      *   **Section 5: The "Single Development" (The User's specific request)**
          *   *Focus:* The Repair Strategy secretly relying on a welfare distinction.
          *   *Argument:* When we "repair" the description (e.g., distinguishing "smoking now" from "smoking later"), we usually do so because we think the agent's *good* is different, not just their preference. We appeal to "mistakes" to justify the re-individuation.
          *   *Example:* Addiction. We re-individuate "drug" vs. "health" only because we assume the agent *should* prefer health. If we truly held the Representationalist view, we'd just say "Preference changed." The fact that we construct a "long-run self" implies we are tracking a welfare fact (the good of the whole life) distinct from the momentary choice.

  4.  **Refining and Ranking (Self-Correction during drafting):**

      *   *Constraint Check:* Am I distinguishing between what hits *only* this view vs. *all* views?
      *   *Correction:* Many welfare theories struggle with framing. I need to highlight where *only* Representationalism breaks.
      *   *Unique Vulnerability:* The claim that IPC is *incoherent*. Most rivals think it's hard but possible. If IPC is shown to be necessary for basic moral reasoning (e.g., triage), Representationalism fails morally, even if logically consistent.
      *   *Unique Vulnerability:* Unfalsifiability via re-individuation. Hedonic accounts can be falsified (report pain, choose pain). Representationalism absorbs the contradiction into the definition of the option.
      *   *Ranking:*
          1.  **Fatal:** Unfalsifiability of the Repair Strategy (Tautology risk).
          2.  **Fatal:** The Wealth Effect/WTP consequence (if one accepts welfare *ought* to be comparable/need-sensitive).
