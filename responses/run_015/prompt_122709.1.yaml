answer: |-
  This is a rigorous, hardline Revealed Preference (RP) position, pushed to its logical conclusion. It aligns closely with the strict ordinalism of Samuelson or the logical behaviorism of early econometrics, but you have stripped away the "as if" hedging. You are claiming this is not a modeling convenience but the metaphysics of welfare.

  Here is the map of exposure for your package, ranked by severity, adhering to your constraints.

  ### 1. The Tautology of the Repair Strategy (Unfalsifiability)
  **Status:** **Fatal**
  **Existing Data:** Intransitive choice cycles; Context-dependent preference reversals.

  You ask if there is a finite body of choice data no repair could accommodate. The honest answer is **no**. Given sufficient latitude to re-individuate options (indexing by history, frame, expectation, or neural state), any choice pattern can be rationalized as consistent with a transitive ordering.

  *   **The Defeater:** If the theory can accommodate *any* data by adjusting the description of the alternatives, it ceases to be an empirical theory and becomes a tautology. A theory that cannot be wrong cannot be right.
  *   **Constraint 1 (Concession):** A defender must concede this is a risk. To avoid it, you must impose *constraints* on legitimate re-individuation (e.g., "options must differ in physically observable properties"). But once you impose constraints, you will face data that violates axioms *even under those constraints*. At that point, you must either abandon the axioms or loosen the constraints, sliding back toward tautology.
  *   **Constraint 2 (Rival Check):**
      *   *Hedonic/Objective List:* **Does not apply.** These theories can be falsified. If an agent chooses X over Y, but X yields less pleasure/objective good than Y, the theory is contradicted (unless they also resort to "you didn't *really* enjoy it," which is their own version of the repair strategy).
      *   *Informed Desire:* **Applies.** This rival also struggles to define the "object" of the desire independently of the choice.
  *   **Why it is Fatal for You:** For rivals, the gap between choice and welfare is a feature, not a bug. For you, the gap is impossible. Therefore, your inability to specify a stopping point for the Repair Strategy undermines your core metaphysical claim (that there is no residue). If the repair is unconstrained, the "preference ranking" is just a shadow cast by the choice, not an explanation of it.

  ### 2. The Identification Problem Under Uncertainty
  **Status:** **Fatal** (for the claim that utility is *revealed*)
  **Existing Data:** Ellsberg Paradox; Ambiguity aversion.

  You ask what the separability machinery assumes to break the tie between Utility and Probability. Standard Subjective Expected Utility (SEU) assumes that beliefs (probabilities) are separable from values (utilities) and that beliefs obey the probability axioms.

  *   **The Defeater:** Without independent access to an agent's beliefs, *any* choice under uncertainty can be rationalized by positing bizarre subjective probabilities. If an agent refuses a bet with known 50/50 odds, you can save the theory by claiming they *believe* the odds are 10/90.
  *   **Constraint 1 (Concession):** A defender must concede that without an independent measure of belief (e.g., via scoring rules or non-choice elicitation), utility is not revealed by choice alone; it is revealed by choice *plus* a stipulation that the agent's beliefs are probabilistically coherent.
  *   **Constraint 2 (Rival Check):**
      *   *Hedonic/Objective List:* **Does not apply.** These evaluate the outcome, not the gamble.
      *   *Informed Desire:* **Applies.** They face the same identification problem regarding what the agent believes about the "informed" state.
  *   **Why it is Fatal for You:** You claim utility is a representation of preference revealed by choice. But under uncertainty, choice reveals a *mixture* of utility and belief. To isolate utility, you must assume the agent is rational regarding *belief*. If the agent is irrational about probability (which data suggests they are), your "Repair Strategy" must absorb probability errors into utility functions (e.g., "ambiguity aversion" becomes a taste for certainty). This bloats the utility function to include cognitive errors, violating your claim that utility represents "what the agent wants" rather than "how the agent fails to calculate."

  ### 3. The Wealth Effect and Willingness to Pay (WTP)
  **Status:** **Awkward** (Morally/Politically), **Fatal** (if Welfare Economics is the goal)
  **Existing Data:** Disparity in WTP for life-saving measures across income quintiles.

  You accept that WTP is constitutive of benefit. This implies that a rich man's preference for a third yacht outweighs a poor man's preference for life-saving surgery, provided the rich man's WTP is higher.

  *   **The Defeater:** This renders welfare economics incapable of adjudicating distribution. If "better off" just means "got what was chosen," and choices are constrained by budget, then the status quo distribution of wealth is baked into the definition of welfare.
  *   **Constraint 1 (Concession):** A defender must concede this. You cannot use WTP to evaluate policies that change wealth distribution without circularity.
  *   **Constraint 2 (Rival Check):**
      *   *Hedonic/Objective List:* **Does not apply.** They can assert the surgery provides more welfare regardless of WTP.
      *   *Informed Desire:* **Mixed.** Depends on whether "informed" includes knowledge of opportunity costs.
  *   **Why it is Awkward/Fatal:** If your goal is merely to describe individual rationality, this is consistent. If your goal is to ground *policy* (which "utility" usually implies), this is a *reductio*. It forces you to say that making the poor poorer (reducing their WTP) literally reduces the welfare weight of their needs. Most rivals can accommodate the intuition that welfare should track need, not just purchasing power.

  ### 4. Interpersonal Comparisons (IPC) as Incoherent
  **Status:** **Awkward** (Philosophically), **Fatal** (for Ethics)
  **Existing Data:** Universal moral practices of triage and redistribution.

  You claim IPC is incoherent because there is no hidden magnitude.

  *   **The Defeater:** Our moral language and practices presuppose IPC. When we say "It is better to save five than one," we are not comparing choice rankings (the one might prefer to live more than the five prefer to live). We are comparing states of welfare.
  *   **Constraint 1 (Concession):** A defender must dismiss this as "smuggling in a rival's notion." You would argue moral practice is simply mistaken or metaphorical.
  *   **Constraint 2 (Rival Check):**
      *   *Hedonic/Objective List:* **Does not apply.** They are built to handle IPC.
      *   *Informed Desire:* **Applies.** They also struggle with IPC, though less severely (they can compare the *content* of desires).
  *   **Why it is Awkward:** It isolates your view from almost all normative ethics. It makes utilitarianism impossible. It makes the concept of "social welfare" nothing more than a vector of unrelated ordinal rankings, rendering Pareto improvements the only possible metric of social good. This is a known limitation, but for you, it is a feature. The risk is that it makes the theory useless for the contexts where "welfare" is most urgently discussed.

  ### 5. The "Secret Welfare" in the Repair Strategy
  **Status:** **Fatal** (Internal Consistency)
  **Existing Data:** Treatment of addiction; Hyperbolic discounting repairs.

  This addresses your specific suspicion: *that the repairs are not neutral bookkeeping but are answerable to a distinction between the agent's preferences and her good.*

  *   **The Defeater:** When you "repair" a description to save the axioms, you must decide *which* description is the correct one.
      *   *Example:* An addict chooses drugs (A) over health (B) today, but chooses health (B) over drugs (A) for next week.
      *   *The Repair:* You index the options by time to resolve the intransitivity. But why index *this* way? Why not say the agent simply has intransitive preferences?
      *   *The Leak:* You choose the repair that preserves the "rationality" of the agent. But in cases of addiction or weakness of will, the standard repair is to privilege the "long-run" preference over the "short-run" impulse. To do this, you are implicitly appealing to a notion of the agent's *true good* (the long-run health) to decide how to individuate the options. You are using a welfare fact (health is better than addiction) to structure the preference ranking, violating your Claim 1 (that welfare is *derived* from the ranking).
  *   **Constraint 1 (Concession):** A defender must concede that the criteria for re-individuation are not provided by the theory itself. They must be imported. If they are imported from "common sense welfare," the theory is no longer foundational; it is derivative.
  *   **Constraint 2 (Rival Check):**
      *   *Hedonic/Objective List:* **Does not apply.** They have the external criterion (pleasure/health) to decide which choice counts.
      *   *Informed Desire:* **Applies.** They also need to distinguish "true" desires from "impulses," facing a similar regress.
  *   **Why it is Fatal:** This is the internal collapse of your package. Your Methodological Commitment (Repair) requires you to make distinctions that your Metaphysical Commitment (No hidden welfare facts) forbids. You cannot non-arbitrarily decide whether "smoking now" and "smoking later" are the same option without appealing to whether the agent is *mistaken* about their good. If they are mistaken, there is a "true preference" distinct from the choice. If there is a true preference distinct from the choice, Representationalism is false.

  ### Summary Ranking

  1.  **Fatal:** **The "Secret Welfare" in Repair.** (Internal contradiction: You need a welfare metric to guide the repairs that save the theory from choice data).
  2.  **Fatal:** **Unfalsifiability.** (If any choice can be rationalized by re-description, the theory explains nothing).
  3.  **Fatal:** **Uncertainty Identification.** (Utility cannot be disentangled from belief without assuming rationality of belief, which absorbs cognitive error into utility).
  4.  **Awkward:** **WTP/Wealth Effects.** (Consistent, but morally repugnant and policy-paralyzing).
  5.  **Awkward:** **IPC Incoherence.** (Consistent, but ethically isolated).

  ### The Single Development That Would Move Me

  If I held your view, the development that would force me to abandon it is **a demonstration that re-individuation criteria track welfare facts independently of choice consistency.**

  Specifically: If we found that the *only* way to make an agent's choices transitive was to individuate options in a way that contradicted the agent's own phenomenological report of their good, yet that individuation successfully predicted future choice *better* than the agent's own report.

  *   *Scenario:* An agent insists "Option A and Option B are identical to me." They choose A then B then A (intransitive).
  *   *Your Move:* You say "They must be different to the agent."
  *   *The Defeater:* Neuroscience or phenomenology shows the agent experiences them as identical, *but* the agent's welfare (measured by health/longevity/hedonic tone) is maximized only if we treat them as distinct in the model.
  *   *Why:* This would prove that the "Repair Strategy" is tracking a welfare fact (the health outcome) that is distinct from the preference ranking. It would show that the "rationalizing description" is not neutral bookkeeping, but a normative intervention based on a hidden welfare metric. This would validate the rival's claim: there *is* a gap between choice and good, and closing it requires more than just re-describing the choice.

  ### Final Note on the "Dispatch"
  You asked if treating framing/adaptation as description changes is legitimate or ad hoc.
  *   **Verdict:** It is **ad hoc** if the only reason for the re-description is to save the axioms. It is **legitimate** only if there is an independent criterion for when two options are "different."
  *   **The Catch:** Your metaphysics denies you that independent criterion. You cannot say "They are different because they lead to different welfare." You can only say "They are different because the agent chose differently." This makes the repair strategy circular: "The options were different because the choice was different, and the choice was rational because the options were different."

  Your position is logically tenable only if you accept that it is a closed system that cannot interact with empirical psychology or normative ethics without collapsing. It is a fortress that protects its consistency by rendering itself irrelevant to the questions welfare is usually asked to answer.
