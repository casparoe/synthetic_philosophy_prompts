          *   *Claim 3 (Methodological/Repair):* When axioms fail (intransitivity, framing, etc.), don't posit hidden welfare states. Instead, "repair" the description of the choice situation (re-individuate options, add context, time, etc.) until rationality holds.
      *   **Task:** Stress-test this position. Map its exposure. *Do not* give a literature survey or "greatest hits."
      *   **Specific Questions to Address:**
