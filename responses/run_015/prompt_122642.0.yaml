          *   *Crucial Correction:* The Frame Message isn't just "in the object." It requires a receiver capable of recognizing it. Hofstadter knows this. He uses the "Voyager Golden Record" example extensively. He acknowledges that without a human (or equivalent), the record is just plastic.

