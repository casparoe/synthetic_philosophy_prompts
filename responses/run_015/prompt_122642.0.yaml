      *   *Claim 4:* "Inner message is the actual content, and it is the only layer where meaning is really located." -> *Hofstadter:* **Problematic.** Hofstadter argues meaning arises from the *interaction* between the message and the receiver. He explicitly argues *against* meaning being intrinsic solely to the inner message.
