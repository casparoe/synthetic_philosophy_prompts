      *   *Claim 6 (The Critique):* "Whether an object has a frame message... depends on who finds it... if the frame message is in the eye of the beholder, then everything built on top of it is too, and meaning turns out to be subjective after all." -> *Hofstadter:* He would agree that meaning is relational (between sender, receiver, and medium), not purely objective or purely subjective. He calls this "meaning is in the interaction." The notes claim this reduces to "subjectivism with extra steps." Hofstadter would reject "subjectivism" in the solipsistic sense; he posits a shared structural reality (isomorphism).
