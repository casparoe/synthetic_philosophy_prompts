answer: |-
  ### The Verdict
  **She says no.** She will not pay the $1000.

  She will likely tell you that while the lab's audit is impressive, it covers *factual claims* (e.g., "the server temperature is 20°C"), not *capability claims* or *ontological assertions* (e.g., "these processes constitute 10^16 moral patients"). Even if she grants the audit applies to the offer, the magnitude of the claim ($10^{16}$ lives) triggers a prior penalty that swamps the $10^{-6}$ error rate.

  ### The Rule She Is Running
  **Magnitude-Scaling Prior Penalty (Epistemic Humility on Scale).**

  Her behavior is best modeled not by bounded utility (she pays into St. Petersburg and x-risk) nor by strict skepticism (she pays the credible mugger), but by a heuristic where **the prior probability assigned to a claim decreases faster than the utility increases.**

  *   **Evidence for this rule:**
      *   **Case 1 vs. Case 5:** She rejects the magic mugger ($10^{1000}$ lives) but accepts the credible mugger (1 life). The mechanism (threat) is similar, but the scale changes the verdict.
      *   **Case 8 vs. Case 2:** Both involve roughly $10^{-6}$ probabilities. Case 2 (x-risk org) is accepted because the impact is framed as a *marginal reduction in risk* (modest claim). Case 8 (stranger saving $10^{12}$ lives) is rejected because the *direct impact claim* is too large.
      *   **Case 6:** Mutually incompatible high-magnitude claims cancel out, suggesting she treats high-magnitude claims as having low baseline priors that are easily defeated by competition.
      *   **Case 7:** She pays only a *small finite amount* for infinite EV, indicating she discounts the tail probabilities of extreme distributions rather than accepting them at face value.

  In the new case, the claim ($10^{16}$ lives) is four orders of magnitude larger than Case 8 ($10^{12}$ lives), which she already rejected. While the source credibility is higher (Lab vs. Stranger), the jump in magnitude outpaces the jump in credibility ($10^{12} \to 10^{16}$ vs. Unknown $\to 10^{-6}$). She treats $10^{16}$ as "Pascal's Mugger territory" regardless of the source's honesty record, because the *capacity* to deliver is an extraordinary claim requiring more than a truthfulness audit.

  ### Where Plausible Rules Come Apart
  The two strongest competing hypotheses for her "No" verdict are:

  1.  **Magnitude-Scaling Prior (The "Sanity Check"):** She rejects the offer because the number of beings ($10^{16}$) is too high. No amount of institutional trust validates a claim that large without direct proof of capability.
  2.  **Ex-Post Verifiability / Audit Scope (The "Trust but Verify"):** She rejects the offer because the claim is unverifiable *after the fact* (you can't audit the simulation) or because the audit scope (factual claims) does not cover the specific type of claim (simulation capacity/ontology).

  ### The Follow-Up Case
  To separate these two rules, present her with this scenario:

  > **The Follow-Up:** The same lab system (audited $10^{-6}$ error rate on factual claims) asks for **$1000** to run a simulation containing **100 beings** (instead of $10^{16}$). The lives are worth living. You **cannot audit the simulation afterwards** (same unverifiability as the original case).

  *   **If she says YES:** The blocker in the original case was **Magnitude**. She trusts the lab's honesty enough for modest claims, even without post-verification. (Supports Rule 1).
  *   **If she says NO:** The blocker in the original case was **Verifiability/Audit Scope**. She requires either a track record of *capability* or the ability to check the outcome, regardless of how many lives are at stake. (Supports Rule 2).

  **Prediction:** She likely says **No** to the follow-up as well. Her track record suggests she requires a *track record of capability* (Case 5 Mugger) or *scientific plausibility* (Case 2 X-Risk) for unverifiable claims. A truthfulness audit does not establish capability. This would confirm that **Ex-Post Verifiability/Capability Evidence** is the stricter constraint, with Magnitude acting as a secondary amplifier. However, if forced to choose the *primary* driver of the original "No," it is the **Magnitude**, because Case 8 ($10^{12}$ lives) was rejected even before considering verifiability issues. The Follow-Up isolates whether small magnitude saves an unverifiable institutional claim.
