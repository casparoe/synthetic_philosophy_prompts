answer: |-
  You mistake the individual instrument for the social means of production. In the putting-out system of the textile trade, the weaver owned his loom, yet he was no less a wage-labourer in substance because the merchant capitalist owned the raw material and, crucially, the market. Here, the carriage is merely the loom; the firm owns the network of communication and the monopoly over the customers. Without access to their central apparatus of allocation, the driver's labour-power is useless capital. He is separated from the *market* as a means of production, which is now concentrated in the hands of the firm just as the machinery is concentrated in the factory, rendering his ownership of the car a hollow independence.

  The extraction of surplus value is evident in the deduction of the fare and the dictation of prices. The firm does not merely sell a commodity produced by the driver; it commands the labour process itself through its ratings and calculations, while shifting the costs of constant capital—fuel, wear and tear, repairs—onto the worker. This is a refinement of the sweating system, where the capitalist avoids the outlay for machinery to increase the rate of profit. The driver's illusory freedom to choose his hours serves only to mask the fact that he works under the real subsumption of capital, subject to dismissal without cause and barred from building his own clientele, thus ensuring his dependence on the firm for the realization of his labour's value.

  Therefore, the categories stand firm, though the form is peculiar and deceptive. However, to determine whether this deduction appears as profit of enterprise or a form of rent on a monopoly, I require further detail regarding the juridical relation. You say he is contracted to sell a share of the fare; is he bound by a contract of service implying direct obedience to a master, or a contract for services implying mere exchange between merchants? The bourgeois law often disguises the economic relation, and I must know if the legal form corroborates this masking of exploitation.
