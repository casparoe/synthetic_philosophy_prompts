answer: |-
  **Setting:** *A sunny spot on the university quad, outside the Dean's Office. Tomas is scrolling through the new campus pilot app on his phone. Maya sits opposite him, grading papers.*

  **Tomas:** Look at this. The app just updated the 3D-printer prices for tomorrow. The 8 AM slot was empty yesterday, so the Dean's office dropped the point cost overnight. Today it's fully booked. That's Lange's trial-and-error in action; the planning board mimics the market without the inequality.

  **Maya:** It cleared the queue, Tomas, but did it find the *best* use for that slot? Hayek would say you've solved a static allocation problem while ignoring the dynamic one. The price dropped because past data showed no demand, but prices should signal opportunity, not just history.

  **Tomas:** But that's what the adjustment is for. If a student suddenly needs that 8 AM slot for a urgent project, they bid higher points tomorrow, and the board sees the shortage and raises the price. It's a feedback loop. You don't need a real market to see that demand exists.

  **Maya:** You need the demand to be visible to be measured. What if the student doesn't know they need the slot until they see the price? Or worse, what if they know a weird workaround—like using the printer for a mold instead of a print—but the app only lets you book "print time"? The board can't price what it can't conceive.

  **Tomas:** The board isn't blind. They can add fields to the app. If students start using TA office hours for career coaching instead of class help, the Dean surveys the users and creates a new category. Lange never said the plan was rigid; he said it was iterative. With modern computers, that iteration happens overnight, not over months.

  **Maya:** Faster calculation of ignorance is still ignorance. The knowledge isn't in the server; it's in the students' heads, and it's often tacit. I might not be able to write "career coaching" in a dropdown menu, but I'd know to buy a coffee with a grad student if I saw their office hour price was low. The app removes the side-deals where the real value is discovered.

  **Tomas:** That sounds like you're defending black markets. The point of the app is equity. If we use real money, rich students hoard the 3D printers. With points, everyone starts equal. If students game the system by hoarding points, the Dean resets them weekly. It prevents the accumulation of advantage.

  **Maya:** And that's exactly why the price signal is broken. If I know my points reset next week, I have no incentive to save them or spend them wisely. I'll bid wildly on everything just to see what sticks. Without the risk of loss—real money—there's no cost to lying about what you want. The board gets noise, not data.

  **Tomas:** So we tweak the incentives. Carry over a small percentage of points based on efficiency. But you're assuming the market is the only way to get truth out of people. If the goal is education, not profit, maybe truthful reporting comes from community norms, not profit motives. The app fosters cooperation.

  **Maya:** Cooperation is great until resources are scarce. Then you need a mechanism to reveal who values the resource most intensely. In a market, I put my money where my mouth is. In your app, I just click a button. When the TA hours surge during finals, the app will raise the price, but it won't tell the TAs to work more hours because their pay is fixed. The supply side is deaf.

  **Tomas:** The Dean can adjust TA pay based on the app's data too. It's a centralized system, not a free-for-all. If the data shows high demand for office hours, the university allocates more budget to hire TAs. It's rational planning based on aggregate need, not just the whims of whoever has the most cash.

  **Maya:** But "aggregate need" is an average, and innovation happens at the margins. A market allows a student to say, "I'll skip lunch to buy this printer time because my startup idea depends on it." Your app smooths out those spikes. It prevents the desperate, high-stakes bets that actually drive discovery. You've built a system that's fair, stable, and perfectly designed for stagnation.

  **Tomas:** I'd call it designed for stability. If a student fails because they gambled their lunch money on a 3D print that breaks, that's not education, that's ruin. The app ensures everyone gets a baseline of access. It accepts that we won't capture every hidden opportunity in exchange for ensuring no one is locked out.

  **Maya:** And that's the trade-off. You've solved the equity problem by blinding the system to the knowledge problem. You can adjust prices all night long, Tomas, but if the students aren't risking anything real, the prices are just numbers on a screen, not reflections of value.

  **Tomas:** Then we agree on the risk, but disagree on who should bear it. I trust the board to adjust the numbers; you trust the students to burn their own money. Given this is a university, I think I'd rather trust the board.

  **Maya:** And given this is a lesson in economics, I'd rather trust the discovery process. But at least the app gives us something to argue about over coffee.

  ***

  **Instructor's Note:**

  **Liberties and Contested Readings:**
  I took liberty in applying Lange's macro-economic model (national industrial planning) to a micro-economic campus app; Lange was concerned with steel and coal, not dorm swaps, though the logic holds. I also leaned heavily on the "incentive compatibility" critique (Maya's point about lying/hoarding) which is often attributed to Mises, whereas Hayek focused more strictly on the *tacit knowledge* problem (that the knowledge doesn't exist to be reported). In the dialogue, I blend these for clarity. Additionally, Tomas's appeal to "modern computers" reflects the modern "Cybernetic Socialism" argument (e.g., Paul Cockshott) that Lange was simply ahead of his tech, a contested view among Hayekians who argue speed doesn't solve the encoding of tacit knowledge.

  **Where this Reconstruction Might Fail:**
  The dialogue simplifies the "entrepreneurial profit" motive. Maya argues students need "skin in the game," but in a university setting, the "profit" is grades or learning, not cash. A sophisticated Langean could argue that the app *does* capture this if points are tied to academic standing. I also gave Maya the final substantive word on stagnation; a stronger defense of Lange might emphasize that markets also fail to account for positive externalities (like community building) which the app could explicitly price in.

  Summary: Thanks a bunch! Maya secured the stronger argument by exposing the incentive flaws in the planning app.
