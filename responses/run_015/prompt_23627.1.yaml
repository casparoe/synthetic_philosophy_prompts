  So I got into this absolutely massive argument with my buddy Derek last night over beers about futarchy, like, the whole "let prediction markets make the policy decisions" thing that Robin Hanson pushes. We were going back and forth for like two hours and I honest think we were talking past each other the whole time. He's a total believer, keeps saying the market will just aggregate all the expertise better than any committee ever could, and I kept feeling like the real problem is something else entirely but I couldn't pin it down.

  Anyway, I want you to argue a specific position for me, and not the obvious "markets can be gamed and lobbied" one, because we already went down that road alot and it's a bit stale. I want you to argue that the deepest flaw in futarchy is that it doesn't actually eliminate value judgments — it just relocates them. The whole scheme only works if you've already fixed in advance the objective the markets are betting on (which policy leads to the "best" outcome) and the weights and discount rates that aggregate all the different markets into a single number, and I want you to make the case that this upfront specification is where all the genuinely hard political and moral work is, that the prediction market is doing way less epistemic heavy lifting than its fans credit, and that a futarchy that looks value-neutral on the surface is secretly just a value-laden decision rule wearing a lab coat. Make it as rigorous and in-the-weeds as you can, like, actually engage with the mechanics of how you'd have to aggregate a bunch of markets with different payoffs and time horizons, not just hand-wave.
