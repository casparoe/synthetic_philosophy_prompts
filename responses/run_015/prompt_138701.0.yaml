          3.  Therapist's advice (Self is a story, no deep fact, revision is possible/cost-free).
      *   **The Task:** Audit the analogy (Self = Story). Map the components (Author, Narrator, Protagonist, Reader, Text, Edit History). Identify where the mapping breaks.
      *   **The Crucial Question:** Does the therapist's conclusion (no fact of the matter, revision is cost-free) survive the disanalogies, or was the analogy smuggling it in?
      *   **Three Specific Circles:**
          1.  *Teller/Audience:* In dementia, the audience takes over. Whose story is it? Does the analogy allow for externally maintained selves?
          2.  *Wren/No Author:* Wren has a definite character without a single author. If that's enough for a self, then "authored by you" isn't the key.
          3.  *Dennett vs. Story:* Dennett's "Center of Gravity" (unique, answerable to mass) vs. Story (inconsistent, revisable). Which picture is doing the work? Is there a better analogy?

  2.  **Initial Brainstorming & Mapping:**

      *   *Therapist's View:* Narrative Self Theory (likely influenced by Dennett, Schechtman, or postmodern therapy). Key claim: Plasticity. If it's a story, you can rewrite it.
      *   *Grandmother Case:* The "Protagonist" (Grandma) is losing agency. The "Authors/Narrators" (Family) are taking over. The "Text" (Her Life/Memory) is being edited post-hoc.
      *   *Wren Case:* The "Protagonist" (Wren) is stable. The "Authors" are rotating. The "Canon" (Wiki) is the authority. Disputes exist (edit wars).
      *   *Dennett:* Center of Gravity. It's a real abstraction, not a fiction, but not a *thing*. It constrains interpretation.

  3.  **Auditing the Analogy (Mapping):**

      *   *Self* $\rightarrow$ *The Story/Character*.
      *   *Conscious Experience* $\rightarrow$ *The Narrator* (First-person voice).
      *   *Actions/History* $\rightarrow$ *The Text/Plot*.
      *   *Agency/Will* $\rightarrow$ *The Author*.
      *   *Social Feedback/Memory* $\rightarrow$ *The Readers/Editors*.
      *   *Therapist's Claim:* You are the Author, so you can rewrite.
