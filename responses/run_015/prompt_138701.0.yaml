      *   *(2) Wren/No Author:* Wren proves "Character" $\neq$ "Author". A character has constraints (stats, backstory, established behavior). You can't just rewrite Wren to be a pacifist wizard if she's a thief. *Constraint* is the key, not *Authorship*.
      *   *(3) Dennett vs. Story:* Center of Gravity is *descriptive* (based on physical mass). Story is *prescriptive* (can be lied about). Dennett actually argues the Self is a "Center of Narrative Gravity." The user is right to spot the tension. A CoG can't be revised at will; it moves only if the mass moves. A story *can* be lied about. The therapist is using the "Story" metaphor to imply *freedom*, but Dennett uses it to imply *structure*.

  5.  **Evaluating the Therapist's Conclusion:**

      *   *Claim:* "No fact of the matter" + "Revision is cost-free."
      *   *Verdict:* The analogy smuggles this in.
      *   *Why?* Stories *do* have facts (canon, consistency, audience acceptance). Wren has edit disputes. Grandma's family has to work hard to keep continuity. Revision has *costs* (cognitive dissonance, social pushback, physical reality).
      *   *Nuance:* There is no *homunculus* (deep fact), but there are *constraints* (facts of history, body, society).

