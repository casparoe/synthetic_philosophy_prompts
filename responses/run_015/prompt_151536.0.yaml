  1. **The Cost Fork (Market vs. Agent)**
  **Question:** If my rent doubles due to market speculation, my exit from the city becomes prohibitively expensive, but no specific agent has exercised power over me. Is that domination on your view?
  **Likely Reply:** "We need to distinguish between structural background conditions and specific agents wielding power."
  **Follow-up:** "But once you make that distinction, you're back to making judgment calls about which costs count as power—exactly the 'arbitrary' test you claimed to replace with a simple number."

  2. **The Law Trap (Tracking Interests)**
  **Question:** Every legal system intentionally raises exit costs—contracts, property rights, exit taxes. Is the state dominating us by default, or is law exempt?
  **Likely Reply:** "Law is legitimate when it tracks the interests of the people subject to it."
  **Follow-up:** "You argued that 'tracking interests' was too vague to test for domination, yet you're relying on it now to justify the very exit costs your theory measures; why is it good enough for law but not for power?"

  3. **Scalar vs. Status (Citizenship)**
  **Question:** Republicans argue freedom is a status—you're either a citizen or a subject. You make it a scalar quantity. If freedom comes in degrees, does citizenship dissolve into a credit score?
  **Likely Reply:** "Degrees of freedom capture political reality better than binary myths."
  **Follow-up:** "Then is there a threshold where we stop calling it citizenship and start calling it subjecthood? If not, you've lost the categorical protection against slavery that motivated the republican tradition."

  4. **Benevolent Dependency (The Saint Spouse)**
  **Question:** Consider a marriage where leaving is financially ruinous, but the husband is a saint who never interferes and never would. Is the wife dominated?
  **Likely Reply:** "Yes, because the exit cost is high, regardless of his benevolence."
  **Follow-up:** "Is she dominated because he *could* be awful, or because leaving is expensive? If he loses the money to harm her but the exit costs stay high, does the domination vanish? If not, you're measuring poverty, not power."

  5. **Emigration (Dictator vs. Democracy)**
  **Question:** If exit cost is the whole story, an open-border dictatorship with relocation grants looks freer than a closed, robust democracy. Is that a feature or a bug?
  **Likely Reply:** "Those cases never come apart in reality; dictatorships always close borders."
  **Follow-up:** "If your theory only holds when empirical contingencies align, it's not a normative guide. In principle, does the easy-exit dictatorship win? If yes, you've abandoned self-government for mobility."

  6. **Voice (Exit vs. Contestation)**
  **Question:** Hirschman showed that cheap exit can undermine voice—if everyone can leave, no one stays to fix the institution. Does your policy priority kill democratic contestation?
  **Likely Reply:** "Cheap exit and real voice tend to come as a package in healthy societies."
  **Follow-up:** "But when they trade off, which wins? If you prioritize exit to reduce domination, do you accept that you're weakening the collective power to contest the rules that set those costs?"

  7. **Habit Trap 1 (Implementation Detail)**
  **Question:** Your policy prescription is to lower exit costs. Do we subsidize divorce? How do you weigh emotional cost against financial cost in your calculus?
  **Likely Reply:** "Exactly how we measure those costs is an implementation detail."
  **Follow-up:** "If the core variable of your theory is unmeasurable without arbitrary judgment, haven't you just relocated the problem you accused Pettit of having, rather than solving it?"

  8. **Habit Trap 2 (Freedom vs. Worth)**
  **Question:** A monk takes a vow of poverty; leaving the order is spiritually ruinous. High exit cost. Is he unfree?
  **Likely Reply:** "You're conflating freedom with what that freedom is worth to him."
  **Follow-up:** "But on your view, freedom *is* the cost. If you say the cost doesn't count because it's self-imposed, you're reintroducing the 'arbitrary power' judgment you wanted to delete."

  9. **Falsification (Closing)**
  **Question:** Not the strongest objection, but the dealbreaker: what empirical observation would force you to abandon the exit-cost metric?
  **Likely Reply:** "If exit costs fell globally but domination clearly rose."
  **Follow-up:** "How would you measure domination independently of exit costs to verify that? If you can't, the theory is tautological."
