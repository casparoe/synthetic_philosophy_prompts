answer: |-
  # PART 1: RULING ON PROPOSED DEVICES

  **1. The Diagnosability Floor**
  **Ruling:** Adopted.
  **Rule:** A lineage must be identifiable by a trained technician using a stated key (morphological or genetic) with a known error rate. Absence of usable diagnostics is a hard stop (Decision: Do Not Recognize).
  **Cost:** This excludes cryptic species lineages that are genetically distinct but morphologically identical. It prioritizes enforceability and legal certainty over biological completeness. You will fail to protect some real evolutionary units because you cannot police the boundary in the field.

  **2. The Defeater Clause**
  **Ruling:** Adopted.
  **Rule:** Every finding must state: "This decision would be overturned by [specific evidence]" and set a mandatory review date (default 10 years).
  **Cost:** It creates a litigation target. Petitioners may rush to generate the specific "defeater" evidence to force a relisting. However, it enforces intellectual honesty and prevents findings from becoming permanent dogma.

  **3. The Strict Firewall**
  **Ruling:** Adopted.
  **Rule:** Vote 1 (Taxonomy): Is this a separately evolving lineage? Vote 2 (Protection): Does this lineage warrant statutory protection (risk, value, feasibility)? Reasons for Vote 1 cannot cite conservation consequences. Reasons for Vote 2 cannot cite taxonomic uncertainty.
  **Cost:** It creates a "valley of death" where biologically valid species may not get protected (if low risk), or protected units may lack taxonomic standing (if the statute requires species status). It requires the statute to allow protection of non-species units (e.g., Distinct Population Segments) for the second vote to have utility when Vote 1 is negative.

  ***

  # PART 2: THE DECISION PROCEDURE

  **Commitment:** A species is a separately evolving segment of a population lineage.
  **Thresholds:** All numerical thresholds below are conventional defaults to ensure stability. They are not biological laws.

  **Step 1: The Lineage Existence Test (Fact)**
  *Question:* Is there a group of organisms that forms a distinct cluster relative to others?
  *Evidence:* Genetic clustering, morphological gap, or ecological segregation.
  *Sufficient Answer:*
  *   **Genetic:** Monophyly in at least one independent marker system OR significant clustering in genome-wide data.
  *   **Morphological:** Discontinuous variation (gap) in one or more traits.
  *   **Stop Rule:** If the population is panmictic (randomly mating) with no clustering, **STOP: Do Not Recognize.**
  *   *Recurring Issue (Single Locus):* Single-locus evidence (e.g., one mitochondrial gene) is insufficient for recognition. It counts as *suggestive* only.
  *   *Recurring Issue (Old Specimens):* If the type specimen cannot be linked to the modern lineage with high probability (e.g., imprecise locality, no DNA), **STOP: Do Not Recognize** (unless modern topotypes match the historical description perfectly).

  **Step 2: The Separation Test (Fact)**
  *Question:* Is the lineage evolving independently of its sister lineage?
  *Evidence:* Gene flow estimates, hybrid fitness, coalescent depth.
  *Sufficient Answer:*
  *   **Gene Flow:** Evidence of <1 effective migrant per generation OR evidence that hybrids are selected against/sterile.
  *   **Coalescence:** Lineage sorting is evident (reciprocal monophyly) in nuclear markers.
  *   *Recurring Issue (Mito-Nuclear Discordance):* If Mitochondria are distinct but Nuclear markers show mixing, default to **Nuclear**. Mito reflects history; Nuclear reflects current independence. Treat discordance as evidence of incomplete separation.
  *   *Recurring Issue (ILS vs. Introgression):* If contact zones exist and hybrids are fertile, assume Introgression (lack of separation). If no contact zone exists, assume Incomplete Lineage Sorting (separation possible).
  *   *Recurring Issue (Contact Zones):* If a contact zone is known but unsampled, **EXIT: Defer Pending Data** (One use per petition). If sampled and hybrids are common/fertile, **STOP: Do Not Recognize.**
  *   *Conventional Threshold:* Fixed differences at nuclear loci are required. Shared polymorphism alone is insufficient.

  **Step 3: The Diagnosability Test (Fact/Enforceability)**
  *Question:* Can a trained technician distinguish this lineage from its sister with >95% accuracy using available tools?
  *Evidence:* Morphological key, genetic assay, ecological proxy.
  *Sufficient Answer:* A stated protocol with a stated error rate.
  *Stop Rule:* If no diagnostic exists (cryptic), **STOP: Do Not Recognize.** (See Device 1 Cost).

  **Step 4: The Scrutiny Adjustment (Method)**
  *Question:* Is this taxon group significantly better studied than average?
  *Rule:* If yes, apply a "Magnifying Glass" discount. Require one additional line of independent evidence to recognize. (e.g., Well-studied birds need Mito + Nuclear + Morph; poorly studied invertebrates need Mito + Nuclear).
  *Reasoning:* Prevents splitting artifacts caused by high sampling effort in popular groups.

  **Step 5: The Value Handoff (Value)**
  *Question:* (Reserved for Protection Vote).
  *Rule:* If Steps 1-4 are passed, the file moves to the Protection Vote. If any Step 1-4 results in a Stop, the file moves to Protection Vote *only* if the statute allows non-species listing (e.g., Distinct Population Segment). If the statute requires species status, the process ends at **Do Not Recognize.**

  **Exits:**
  1.  **Recognize:** Passed Steps 1-4.
  2.  **Do Not Recognize:** Failed Step 1, 2, or 3.
  3.  **Defer:** Failed Step 2 due to missing contact zone data (One use only).

  ***

  # PART 3: WRITTEN FINDING FORMAT

  **BOARD FINDING: TAXONOMIC STATUS PETITION [ID NUMBER]**
  **DATE:** [DD/MM/YYYY]
  **PANEL:** [Names]

  **1. PETITIONED ACTION**
  Request to recognize [Proposed Name] as a distinct species under the Statute.
  Current Status: [Unlisted / Subspecies / Synonym]

  **2. SUMMARY OF EVIDENCE**
  *   **Genetic:** [Summary of markers, divergence %, monophyly status].
  *   **Morphological:** [Summary of diagnostic traits, overlap].
  *   **Ecological/Geographic:** [Range, contact zones, habitat use].
  *   **Reproductive:** [Hybrid data, crossing experiments].

  **3. PROCEDURAL APPLICATION**
  *   **Lineage Existence:** [Pass/Fail]. [Reason: e.g., "Nuclear markers show distinct clustering"].
  *   **Separation:** [Pass/Fail]. [Reason: e.g., "Fixed differences present; gene flow estimated at <0.5 migrants/gen"].
  *   **Diagnosability:** [Pass/Fail]. [Reason: e.g., "Key provided in Appendix A, error rate 2%"].
  *   **Scrutiny Adjustment:** [Applied/Not Applied]. [Reason: e.g., "Taxon well-studied, additional nuclear locus required"].

  **4. DETERMINATION**
  **[ ] RECOGNIZE**
  **[ ] DO NOT RECOGNIZE**
  **[ ] DEFER** (Pending: [Specific Data]. Review Date: [Date])

  **5. DEFEATER CLAUSE**
  This finding relies on the assumption that [Critical Assumption, e.g., "the contact zone is stable"]. This finding would be overturned by [Specific Evidence, e.g., "Demonstration of fertile hybrids beyond the 4km zone"].
  **Mandatory Review Date:** [Date + 10 Years]

  **6. PROTECTION VOTE SEPARATION**
  This finding addresses taxonomy only. The question of statutory protection, risk of extinction, and management feasibility is addressed in a separate instrument (Board Order [ID]).
  *Note: If Determination is "Do Not Recognize," protection is only possible if statute authorizes listing of Distinct Population Segments.*

  **SIGNATURES:**
  [Systematist] [Geneticist] [Chair]

  ***

  # PART 4: APPLICATION TO HYPOTHETICALS

  **Case 1: Stream-Breeding Salamander**
  *   **Lineage:** Mito divergence (9%) suggests history. Nuclear (4 loci, no fixed differences) suggests current unity.
  *   **Separation:** Contact zone exists (4km). Hybrids present (1/12) and fertile (lab crosses successful). This indicates ongoing gene flow and lack of reproductive isolation.
  *   **Diagnosability:** Habitat difference is not a reliable individual diagnostic (requires capture/location).
  *   **Procedure Output:** **DO NOT RECOGNIZE.**
  *   **Reasoning:** Fails Step 2 (Separation). Nuclear data trumps Mito. Fertile hybrids in contact zone indicate a single evolving lineage with local adaptation, not speciation.
  *   **Protection Rescue:** Could qualify as a Distinct Population Segment if the statute allows, based on ecological distinctiveness, but not as a species.

  **Case 2: Gynogenetic Freshwater Fish**
  *   **Lineage:** Fixed hybrid karyotype, morphologically diagnosable. Distinct cluster.
  *   **Separation:** Gynogenesis means no genetic contribution from host males. The lineage is clonal. It is evolving separately (accumulating mutations) without merging back.
  *   **Diagnosability:** Morphologically distinct + Karyotype.
  *   **Procedure Output:** **RECOGNIZE.**
  *   **Reasoning:** Passes Step 1 (Cluster) and Step 2 (Separation). The lack of sexual recombination makes the "separate lineage" claim stronger, not weaker. 60k years is sufficient time depth.
  *   **Protection Rescue:** N/A (Taxonomy passed).

  **Case 3: Insular Rodent (The Dreaded Case)**
  *   **Lineage:** Genome-wide data places it *nested* inside mainland lineage. Not monophyletic.
  *   **Separation:** Split 8kya (recent). Gene flow until 1900 (very recent).
  *   **Diagnosability:** Coat colour and size are diagnosable, but plausibly under local selection (plasticity/rapid adaptation).
  *   **Procedure Output:** **DO NOT RECOGNIZE.**
  *   **Reasoning:** Fails Step 1 (Lineage Existence as distinct unit) and Step 2 (Separation). It is a terminal twig of the mainland lineage, not a separate segment. Gene flow was recent enough to prevent independent coalescence.
  *   **Honest Finding Text:** "Genomic data demonstrates the insular population is nested within the mainland lineage. Divergence is recent (8,000 years) and gene flow persisted until the 20th century. Phenotypic differences are consistent with local adaptation, not speciation."
  *   **Protection Rescue:** The taxonomy finding *cannot* rescue this. The Protection Vote can only rescue it if the statute allows listing "Distinct Population Segments" or "Significant Genetic Units." If the statute requires "Species," this animal loses protection. The panel must write: "While this unit does not meet the taxonomic threshold for species status, the Protection Vote may consider its adaptive distinctiveness and extinction risk under [Relevant Statutory Clause for Populations]."
  *   **Public Impact:** You must publish the finding that it is not a species. NGOs will be angry. The law must absorb the blow, not the taxonomy.

  ***

  # PART 5: LIMITS AND FAILURE MODES

  **1. Where the Procedure Misfires**
  *   **Ring Species:** The procedure assumes discrete clusters. A ring species will fail Step 1 (no clear cluster boundary) and be collapsed, even if the ends are reproductively isolated.
  *   **Rapid Radiations:** In recent explosive diversifications (e.g., cichlids), nuclear markers will not sort fast enough. The procedure will lump valid young species because they fail the "Fixed Difference" threshold.
  *   **Hybrid Swarms:** If two species merge into a hybrid swarm, the procedure identifies "one lineage" and recognizes the swarm, losing the parent identities.

  **2. Organisms That Defeat It**
  *   **Bacteria/Prokaryotes:** Horizontal gene transfer makes "lineage" and "monophyly" nearly meaningless. This procedure is for eukaryotes.
  *   **Highly Clonal Asexuals:** While Case 2 passed, if mutation rates are low, "separate evolution" is hard to distinguish from "same lineage, different place."
  *   **Marine Broadcast Spawners:** High gene flow is the norm. The "1 migrant" threshold may be biologically inappropriate for taxa where 100 migrants is still considered panmixia.

  **3. Judgment Calls Dressed as Method**
  *   **The Scrutiny Discount:** Deciding if a group is "well-studied" is subjective. It risks penalizing good science.
  *   **Weighting Nuclear over Mito:** This is a heuristic. In some taxa (e.g., birds), Mito sorts faster and is a better indicator of separation. The default rule will occasionally be biologically wrong.
  *   **The Diagnosability Floor:** Deciding if a trait is "usable by a technician" is a policy call, not a biological one. It privileges visible traits over genetic reality.

  **4. The Honest Limit**
  This procedure prioritizes **stability** and **legal defensibility** over **biological nuance**. It will under-split young lineages and over-lump cryptic diversity. It accepts these errors to ensure that when the Board says "Species," the courts and land managers know exactly what that means. It cannot tell you the truth about evolution; it can only tell you what counts as a species for the purposes of the Act.
