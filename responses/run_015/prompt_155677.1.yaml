          2.  Ruling on three "devices" (Diagnosability Floor, Defeater Clause, Firewall).
          3.  Application to three hypothetical cases (Salamander, Gynogenetic Fish, Insular Rodent).
          4.  Honest limits of the procedure (where it misfires, judgment calls).
          5.  Format: Written finding format (approx. 2 pages worth of content within the total response), no citations/library access needed.
      *   **Tone:** Operational, precise, authoritative, honest, pragmatic. No theoretical defense.

  2.  **Deconstruct the Core Commitment:**

      *   "Separately evolving segment of a population lineage."
      *   This implies *independence*. Evidence must show that the lineage is on its own trajectory and not merging back into the parent/sister population.
      *   Evidence types: Genetic (mito/nuclear), Morphological, Ecological, Reproductive.
      *   Conflict resolution: Need a hierarchy or weighting system based on *independence* of evidence.

  3.  **Drafting the Decision Procedure:**

      *   *Sequence:* Needs to go from hard data to inference.
      *   *Step 1: Existence of a Lineage.* Is there a distinct group? (Genetic/Morpho).
      *   *Step 2: Separation.* Is it evolving separately? (Gene flow, coalescence).
      *   *Step 3: Stability.* Will it persist? (Ecological distinctiveness, barriers).
      *   *Stop Rules:* Where do we say "No"? (e.g., panmixia, no diagnostic traits).
      *   *Value vs. Fact:* The *biology* is fact. The *risk tolerance* (how much gene flow is too much) is the conventional threshold (value/policy).
      *   *Recurring Issues:*
          *   Mito vs. Nuclear: Nuclear weighs heavier for *current* gene flow; Mito for *historical* separation.
          *   ILS vs. Introgression: Default to Introgression if contact zone exists and hybrids are fertile (conservative for splitting).
          *   Single Locus: Insufficient for recognition (high error rate).
          *   Old Specimens: Type locality uncertainty = Deferral or Non-recognition depending on modern samples.
          *   Weight of Evidence: Two *independent* lines (e.g., Mito + Morphology) > Two *dependent* lines (e.g., Mito + another Mito region).
          *   Well-studied bias: Apply a "scrutiny discount." If a group is well-studied, require slightly higher thresholds to account for the "magnifying glass" effect.
      *   *Thresholds:* Need defaults.
          *   Gene flow: <1 migrant per generation (Wright's rule) is a common biological heuristic, but for legal stability, let's say "No evidence of *successful* introgression beyond the contact zone."
          *   Divergence: No fixed % (varies by taxon), but require *fixed differences* in at least one independent system (nuclear or morph).
      *   *Exits:* Recognize, Do Not Recognize, Defer (once).

  4.  **Evaluating the Three Devices:**

      *   *Diagnosability Floor:* Hard stop if not identifiable.
          *   *Pros:* Legal certainty, enforceability.
          *   *Cons:* Cryptic species get excluded.
          *   *Verdict:* Keep, but soften "non-specialist" to "trained technician using stated key." A hard stop is good for legal defensibility.
      *   *Defeater Clause:* Name the result that overturns it + review date.
          *   *Pros:* Intellectual honesty, stability management.
          *   *Cons:* Invites litigation ("We found that result!").
          *   *Verdict:* Keep. It forces the panel to acknowledge uncertainty without undermining the current decision.
      *   *Firewall:* Delimitation vs. Protection.
          *   *Pros:* Prevents "conservation-driven taxonomy" (tail wagging dog).
          *   *Cons:* Can lead to listing things that don't need protection or vice versa.
          *   *Verdict:* Keep. Essential for the integrity of the "separately evolving" commitment. Protection is a separate policy question.

  5.  **Running the Hypotheticals:**

      *   *Case 1 (Salamander):*
          *   Mito: 9% (High).
          *   Nuclear: No fixed differences (Low).
          *   Contact: 4km, 1/12 hybrids, fertile (High Gene Flow).
          *   Eco: Different habitat (Medium).
          *   *Procedure:* Fails nuclear fixed difference. Hybrids fertile. Gene flow present.
          *   *Outcome:* Do Not Recognize. (It's a subspecies or ecotype at best).
      *   *Case 2 (Gynogenetic Fish):*
          *   Repro: Gynogenesis (Clonal lineage).
          *   Morph: Diagnosable.
          *   Genetics: Fixed hybrid karyotype.
          *   Time: 60k years.
          *   Issue: "Species" concept struggles with asexuals. But they are a "separately evolving segment."
          *   *Procedure:* Lineage exists? Yes. Separate? Yes (no gene flow back, sperm is stimulus only). Diagnosable? Yes.
          *   *Outcome:* Recognize. (It fits the "separate lineage" commitment better than sexual species).
      *   *Case 3 (Insular Rodent):*
          *   History: Listed 1913, Mascot.
          *   Genetics: Nested in mainland, split 8kya, gene flow until 1900.
          *   Morph: Selected traits (coat, size).
          *   *Procedure:* Lineage? Yes. Separate? No (nested, recent gene flow). Diagnosable? Yes (selected traits).
          *   *Conflict:* Biology says "No" (not separate lineage yet), Conservation says "Yes" (unique adaptive variation).
          *   *Honest Output:* Do Not Recognize as Species.
          *   *Protection Rescue:* The statute might allow "Distinct Population Segment" or similar, but under *this* procedure for *Species*, it fails. The finding must state: "Biologically not a separate species, but may qualify for protection under [Other Clause] due to adaptive distinctiveness."
          *   *Public Finding:* Must be blunt. "Nested within mainland lineage." "Gene flow recent." "Traits are local adaptations, not speciation."

  6.  **Addressing Limits:**

      *   Hybrid swarms.
      *   Ring species.
      *   Asexuals (handled in Case 2, but still tricky).
      *   Judgment calls: Weighting the "scrutiny discount," deciding if a contact zone is "stable."

  7.  **Formatting and Constraints:**

      *   No citations.
      *   Two pages for the finding format (I will integrate this into the procedure section or as a template).
      *   Tone: Administrative but scientifically rigorous.

  8.  **Refining the Procedure (Self-Correction during drafting):**

      *   *Correction:* The prompt asks for the procedure *and* the ruling on devices *and* the applications *and* the limits. I need to structure this clearly.
