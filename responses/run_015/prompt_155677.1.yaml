      *   *Constraint Check:* "Conventional thresholds." I need to pick numbers or clear standards. Let's use "Fixed Differences" as the hard currency.

  9.  **Final Polish:**

      *   Ensure the "Rodent" case is handled with the requested brutal honesty.
      *   Ensure the "Firewall" explanation clarifies what the second question *is* (risk/consequence).
      *   Check the "Diagnosability Floor" ruling. If it's a hard stop, cryptic species are out. I need to endorse that trade-off explicitly as requested ("saying what the others cost").

  10. **Drafting the Content:** (Mental outline of the response structure)
      *   **Part 1: Ruling on Devices.** (Keep/Reject + Cost).
