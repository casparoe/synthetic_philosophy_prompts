answer: |-
  This is a sharp cut into the anatomy of supererogation. The Oates case is indeed a stress test that the standard Urmsonian machinery often glosses over because it relies on a tacit assumption of *efficacy*. Most paradigmatic cases of supererogation (the soldier falling on the grenade, the donor giving a kidney) implicitly assume the sacrifice *works*. Oates breaks the link between the heroic will and the heroic outcome.

  Here is the breakdown of how Oates fits (or doesn't) into the category, the problem of the benefit term, the paradox, and the team-structure complication.

  ### 1. Running Oates Through the Stock Definition
  Let's take the Urmsonian baseline:
  1.  **Morally permissible** (not obligatory).
  2.  **Morally good**.
  3.  **Involves significant sacrifice/risk**.
  4.  **Praiseworthy**.

  **The Fit:**
  *   **Permissibility:** Oates was not obligated to kill himself. Even in a lifeboat scenario, self-sacrifice is rarely a strict duty unless one has explicitly assumed a role that demands it (like a captain). Scott explicitly released him from this ("we refuse to abandon him"). So, it clears the "not required" bar.
  *   **Sacrifice:** Total. Clears the bar.
  *   **Praiseworthiness:** Intuitively, yes. We praise Oates.

  **The Leak:**
  *   **Morally Good:** This is the fracture point. If "good" is defined teleologically (producing good states of affairs), Oates' act produced *no* good states of affairs relative to the counterfactual of him staying. Everyone died either way. If the definition of supererogation requires the act to be *good*, and goodness is outcome-sensitive, Oates' act was not good. It was merely a *failed attempt* at a good act.

  If you stick to a strict outcome-based definition, Oates falls **outside** the category. He performed a *putatively* supererogatory act that failed to instantiate the necessary conditions of goodness.

  ### 2. The Benefit Term and Outcome Luck
  You asked if the definition needs a benefit term. The literature is split, but the "standard view" usually smuggles one in. Supererogation is typically "doing more than duty requires *for the sake of others*." If the "for the sake of others" yields nothing, does the "more than duty" stand?

  Here are the live options you outlined:

  **Option A: No Moral Credit (Outcome Luck Dominates)**
  *   *View:* Moral worth tracks actual outcomes. Since the benefit was zero, the moral value is zero (or near zero).
  *   *Verdict:* Oates gets no supererogatory credit. He is tragic, perhaps rational, but not morally superior to the man who stayed in the bag.
  *   *Problem:* This makes morality too fragile. It subjects moral worth to "moral luck" (Nagel/Williams). It implies Kolbe is a saint only because the guard kept his word, whereas Oates is nothing because the weather was too bad. This violates the intuition that control is a prerequisite for moral assessment.

  **Option B: Credit Attaches to Decision Under Uncertainty (Ex Ante Evaluation)**
  *   *View:* Moral worth is assessed at the time of action ($t_1$), based on expected value, not at the time of result ($t_2$). At $t_1$, Oates' act had a positive expected utility (increased probability of survival for the three).
  *   *Verdict:* Oates is fully supererogatory. The category tracks the *risk taken for a probable good*, not the *actualized good*.
  *   *Problem:* It requires decoupling supererogation from its usual consequentialist grounding. It turns supererogation into a virtue-ethical category (about the agent's character) rather than an act-ethical one (about the world's state).

  **Option C: Motive vs. Effect Split (Category Failure)**
  *   *View:* The act was supererogatory in *motive* but not in *effect*. The category of supererogation cannot hold this split; it collapses into "good will" (Kant) rather than "heroic act."
  *   *Verdict:* The label "supererogatory" is misapplied. We should call it "heroic intention" but deny it the status of a supererogatory *act*.
  *   *Problem:* This is linguistically and intuitively unsatisfying. We want to say "Oates did a supererogatory thing," not "Oates had supererogatory feelings."

  ### 3. Which Option I Sign Up For
  I sign up for **Option B (Ex Ante/Expected Value)**.

  Supererogation is fundamentally about the **overriding of self-interest in the face of risk for a perceived greater good**. If we require the good to actually materialize, we make supererogation impossible to identify at the moment of action, which is when the moral choice happens.

  If a firefighter runs into a burning building to save a child, and the child turns out to have already died of smoke inhalation before the firefighter entered, the firefighter's act does not lose its supererogatory status. The *gamble* is the moral object, not the *payout*. Oates bought a lottery ticket for his friends' lives with his own; the fact that the lottery was rigged by the weather doesn't negate the purchase. To hold otherwise is to let consequentialist luck dictate deontological praise.

  ### 4. The Supererogation Paradox
  Does the paradox get grip here? Recall the paradox: *If an act produces the most good, it is obligatory (Utilitarianism). If it is obligatory, it cannot be supererogatory.*

  In Oates' case, the paradox twists:
  *   **Ex Post:** The act did *not* produce the most good (benefit = 0). So, objectively, it was not obligatory. Therefore, it remains a candidate for supererogation.
  *   **Ex Ante:** If Oates calculated that walking out maximized expected utility, a Subjective Utilitarian would say it was **obligatory**. If it was obligatory, he gets no "surplus merit."

  This is where the Oates case exposes the anti-consequentialist core of supererogation. We praise Oates *precisely because* we do not think he was *required* to do it, even if it was the utility-maximizing move. We recognize a "zone of discretion" where an agent can choose self-preservation without blame.

  If you are a hard consequentialist, Oates' act creates a dilemma: If the expected utility was high enough, he *should* have done it. If he *should* have done it, praising him as a hero is category confusion; you should just praise him for doing his duty. The fact that we instinctively treat Oates as a hero (beyond duty) suggests our moral intuition rejects the consequentialist collapse of supererogation into obligation. We preserve the "beyond duty" status by insisting that self-preservation is always a permissible baseline, regardless of the utility calculus.

  ### 5. The Kolbe Contrast and the Consequentialist Leak
  Contrast Kolbe (Auschwitz): One life for one life. Success.
  Contrast Oates (Antarctica): One life for three lives. Failure.

  If Kolbe is obviously supererogatory and Oates is questionable *only* because of the failure, then **yes, the category is secretly consequentialist underneath.**

  The literature sells supererogation as the "anti-consequentialist" safe harbor—the place where you don't *have* to maximize the good. But in practice, we only validate the harbor if the ship actually reaches port.
  *   If Kolbe had volunteered and the guard shot *both* of them immediately, would Kolbe still be a saint in the same way? Yes, but the *narrative weight* shifts.
  *   The Oates case reveals that while the *definition* is non-consequentialist (focused on duty/sacrifice), the *praise* is often consequentialist (focused on efficacy).

  However, if we stick to Option B (Ex Ante), the category survives. Kolbe and Oates are moral equivalents. The fact that history remembers Kolbe more vividly is a function of narrative closure, not moral ontology. The category isn't consequentialist; our *application* of it is biased by outcome luck.

  ### 6. The Small-Team Structure (The Missing Variable)
  This is the most critical philosophical gap in the standard literature. Supererogation is almost always modeled on **stranger ethics** (Good Samaritan, Soldier/Stranger, Donor/Recipient). Oates introduces **associative duties**.

  *   **Role Duty:** In a five-man polar party, the duty of mutual aid is higher than the duty to a stranger. Scott and Wilson refusing to leave Oates establishes a pact: *We are one unit.*
  *   **The Breach:** By walking out, Oates unilaterally dissolves the pact. He decides for the group that his life is worth less than their collective survival.
  *   **The Tension:** Does the team structure make the act *more* obligatory or *less*?
      *   *Argument for Obligatory:* In a lifeboat, if you are mortally wounded and draining resources, some argue you have a duty to jump. If Oates was a net negative, did he owe it to the team to remove himself? If yes, it's not supererogatory; it's duty.
      *   *Argument for Supererogatory:* The pact ("we refuse to abandon him") specifically waived that duty. Scott created a normative shield around Oates. By piercing that shield, Oates acted beyond the specific duties of the team structure.

  The literature misses this because it assumes agent-neutrality. In a "small-team" scenario, supererogation involves navigating **conflicting duties**: the duty to the self, the duty to the specific others (teammates), and the duty to the mission. Oates prioritized the mission/teammates over the specific command of the leader (Scott).

  This suggests the category needs a **relational modifier**. Supererogation within a high-dependency unit is distinct from stranger-supererogation. In a unit, the baseline of "required" is higher. Therefore, the threshold for "beyond duty" is higher. Oates clearing that bar is arguably *more* impressive than Kolbe, because Kolbe was swapping his life for a stranger (low baseline duty), whereas Oates swapped his life against the explicit wishes of his dependents (high baseline duty).

  ### Summary Verdict
  Oates breaks the standard machinery only if you insist on an *ex post* consequentialist accounting of the "good." If you shift to an *ex ante* expected-value framework (Option B), he fits perfectly.

  However, the case exposes that our *praise* mechanisms are often more consequentialist than our *definitions*. We want our heroes to win.

  The real philosophical work here isn't about the benefit term, but the **relational context**. The supererogation category is built for strangers. It creaks under the weight of intimate, high-stakes interdependence. Oates wasn't just a hero; he was a teammate violating a direct order to save the team. That specific tension—duty to obey vs. duty to save—is where the standard definition fails to capture the nuance. He wasn't just "doing more than required"; he was "doing what was forbidden to do what was necessary." That's not just supererogation; it's a different moral species entirely.
