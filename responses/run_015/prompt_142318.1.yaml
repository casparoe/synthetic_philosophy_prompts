      *   *Verdict:* They are mostly talking about the same concept (moral standing to blame), but Wes focuses on the *conditions* for having it, while Dara focuses on the *function* of blame and the *consequences* of denying it. There's a slight equivocation on whether standing makes blame *invalid* (Wes) or just *ineffective/annoying* (Dara).

