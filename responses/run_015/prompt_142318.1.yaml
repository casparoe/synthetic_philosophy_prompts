      *   **Move 5 (Wes):** *Claim:* Refines to "Asymmetry." *Reasoning:* Blame presupposes shared commitment. Ted claims authority he denies others. *Assessment:* This is the standard "moral standing" argument in contemporary ethics (e.g., Bell, Fritz). Strong move.
      *   **Move 6 (Dara):** *Claim:* The "Acknowledgement Test." *Reasoning:* If admitting fault fixes standing, it's about posture, not record. *Assessment:* Very strong counter-example. Suggests standing is repairable, challenging the "forfeiture" idea.
      *   **Move 7 (Wes):** *Claim:* Self-blame and Norm-Relativity tests. *Reasoning:* Forfeiture is interpersonal and norm-specific. *Assessment:* Defends the asymmetry view well against obvious counter-examples (shoplifter blaming hitter).
