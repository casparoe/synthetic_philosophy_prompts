  The two views in plain english
  Lewis's Principal Principle says your subjective belief (credence) should hug the objective chance like a shadow. If a coin has a 50% chance of heads, you should believe it 50%, provided you don't have weird insider info. Chance is a feature of the world, not your head. The rival view flips this. It says chances aren't hidden gears in reality; they're just the credences an ideally informed agent would have. There's no gap between "what the world does" and "what you should think if you knew everything." So, while Lewis says "defer to the world," the rival says "chance is already defined by ideal belief." This matters when the world gets fuzzy. If chance is just ideal credence, then uncertainty about where you are might change the chance itself, whereas Lewis keeps chance fixed regardless of your self-locating confusion. For Lewis, chance guides belief. For the rival, belief constitutes chance.

  The multivers twist
  Imagine a multiverse with Domain A (decay rate 10%) and Domain B (decay rate 90%). You know 50% of domains are A and 50% are B, but you don't know which one you inhabit. Lewis's PP hits a snag. Strictly, there is no single "objective chance" for your local atom until you know your domain. If you defer to the global mixture (50% chance of 10%, 50% chance of 90%), you're deferring to a weighted average, not a fundamental law. PP usually demands deference to the *local* chance function. So, Lewis might say you should suspend judgment or treat the mixture as mere uncertainty about chances, not chance itself. You wait for self-locating info to lock onto the right law. Lewis prioritizes the local law, creating a gap between credence and global stats until you locate yourself. The rival sees no gap. The rival view handles this smoothly, maybe too smoothly. Since chance *is* ideal credence, your total evidence includes your self-locating ignorance. The "chance" of decay for you just *is* the 50/50 weighted average. There's no hidden fact about which domain you're in that overrides your epistemic situation. The rival collapses location-uncertainty into the chance distribution itself. For them, the mixture *is* the chance. For Lewis, the mixture is uncertainty *about* chance. This means PP might forbid setting credence to the mixture until admissibility clears your self-locating ignorance. The multiverse case exposes whether PP requires a fixed target to defer to, or if deference works even when the target is fragmented across possible worlds.

  Settled vs genuinely contested
  Everyone agrees PP sets a baseline: if you know the chance, your credence should match it. Admissibility constraints are also standard; you can't use crystal balls to override chance. But the multiverse case hits live wire debates. It's unsettled whether self-locating ignorance counts as admissible evidence. Lewis hinted that information about which world you're in might be inadmissible for fixing chance, but later scholars argue self-locating info is crucial for applying chances to individuals. It's also contested whether PP breaks when chance laws vary across regions. Some say PP only works for uniform chance functions; others say it handles mixtures via expectation. The rival view avoids this by denying the gap, but that's itself the contention. So, while the deference rule is settled, its application to fragmented realities where you don't know your location is wide open. We don't know if PP forces you to wait for location data or if you can defer to the distribution immediately.

  Verdict
  In this multiverse scenario, the rival view offers a cleaner path by absorbing location uncertainty into chance itself. Lewis's PP struggles because it demands a single objective target hidden from an agent. PP likely forces her to wait for domain identification before deference kicks in, treating the mixture as higher-order uncertainty. The rival view lets her set credence immediately. However, such ease eliminates objective chance as distinct from belief. If you want robust objectivity, PP makes life harder; if you want practical guidance, the epistemic view wins. This analysis leans on contested admissibility readings regarding self-locating evidence Lewis left ambiguous.
