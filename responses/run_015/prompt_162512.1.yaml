answer: |-
  Here are eight rigorous question blocks tailored to your background and the specific philosophical pressures you want to apply. They are ordered to build a narrative arc: starting with definitions, moving through historical stress-tests, examining the political mechanisms, and ending with your specific expertise on climate and causality.

  Given a forty-minute slot, eight questions is ambitious (allowing roughly 4 minutes per block including her answer and your follow-up). I have kept the wording precise so you don't have to ad-lib.

  ### 1. The Definition (Stipulation vs. Explanatory Power)
  **Question:** "Your thesis rests on defining famine as a collapse of entitlements rather than a shortfall in food availability. Critics might say this makes your claim—that famines are never natural—true by stipulation. If famine *just is* entitlement failure, then of course it isn't a natural disaster. So, I want to ask: What would a famine have to look like in the real world for you to concede it was natural? Is there any empirical scenario that would falsify your claim, or is the definition insulated from counter-example?"

  **Predicted Answer:** She will likely argue that definitions are tools, not truths. She'll say the entitlement definition is warranted by its *explanatory power*: it predicts who starves and who doesn't better than food-availability analysis does.
  **Follow-up:** "If the justification is explanatory power, we have to talk about trade-offs. Does defining famine this way risk hiding the physical triggers? If I'm a satellite meteorologist, I see a drought. You see a policy failure. If we ignore the drought because it's 'political,' do we lose the ability to model the risk? Does your definition buy moral clarity at the cost of predictive utility?"

  ### 2. Bengal 1943 (Market Mechanisms vs. Intent)
  **Question:** "Let's look at Bengal. As I understand the data, food availability didn't collapse; prices ran away from landless labourers' wages due to wartime inflation and speculation. There wasn't a specific agent who ordered people to starve. If the mechanism was the market, and the outcome was unintended by the administration, where exactly does the *crime* enter the chain? Is negligence in the face of market forces equivalent to malice?"

  **Predicted Answer:** She will argue that the British administration had the authority and capacity to regulate prices or halt exports and chose not to. The crime is the refusal to intervene to protect entitlements.
  **Follow-up:** "That sounds like strict liability for rulers. But if the crime is failing to stop a market mechanism, does that imply the state must control the market entirely to be innocent? Where is the boundary between 'failed to prevent' and 'could not practically prevent' without causing other harms?"

  ### 3. Ireland 1840s (Pathogen vs. Engineered Vulnerability)
  **Question:** "In Ireland, the trigger was *Phytophthora infestans*—a pathogen. That seems genuinely natural. Your argument suggests the vulnerability was political: a genetically near-uniform monoculture and export policies that kept food leaving the country. How much causal weight do you give the pathogen versus the monoculture? If the blight hadn't arrived, the famine wouldn't have happened. Does the natural trigger get a pass, or is the creation of the vulnerability the crime regardless of the spark?"

  **Predicted Answer:** She will likely say the pathogen is merely the hazard; the disaster is the vulnerability. The crime is engineering a system where a single blight causes mass death.
  **Follow-up:** "If I accept that, does the category of 'natural disaster' disappear entirely? If a hurricane hits a city with poorly enforced building codes, is the hurricane a political crime? At what point does the physical reality of the world push back against the idea that everything is political?"

  ### 4. The Great Leap Forward (Information vs. Liability)
  **Question:** "In China, grain was procured out of hit provinces while output collapsed, partly because local officials fed inflated reports to the centre. Is the crime here the suppression of information, or is it the starvation itself? If the centre genuinely believed the reports they were receiving, does your view hold them strictly liable for starving people under their rule, even if they were epistemically blinded by their own bureaucracy?"

  **Predicted Answer:** She will argue that maintaining a bureaucracy that punishes truth-telling is itself the criminal act. The ignorance was manufactured.
  **Follow-up:** "So the crime is systemic lying. But does that let the specific decision-makers off the hook for the *consequences*? If I drive blindfolded and kill someone, it's manslaughter. If a state governs blindfolded and kills a million, is it the same moral category? I'm asking if your view collapses the distinction between incompetence and malice."

  ### 5. Democracy and the Press (Accountability vs. Capacity)
  **Question:** "You argue famines don't occur in functioning democracies with a free press. Is the mechanism here electoral accountability—rulers want re-election—or is democracy just a proxy for administrative capacity and wealth? If it's about votes, what does your view say about a democracy where the voters simply don't care about the starving minority? Does the famine become 'democratic' then?"

  **Predicted Answer:** She will likely argue that a free press forces the issue onto the agenda, making it electorally costly to ignore even marginalized groups.
  **Follow-up:** "History suggests otherwise. Marginalized groups in democracies often suffer disproportionately without triggering electoral backlash. If the majority is willing to let a minority starve, and the press reports it, and the government does nothing—by your definition, is that still not a famine because the *procedure* was democratic? Or does democracy cease to be 'functioning' the moment entitlements collapse?"

  ### 6. The Word "Crime" (Legal vs. Political Utility)
  **Question:** "You insist on the word 'crime' rather than 'grave injustice.' In law, crime requires a defendant, *mens rea*, and often a statute of limitations. States aren't persons, and they don't go to prison. What does the label 'crime' buy you that 'culpable injustice' doesn't? Are you aiming for legal tribunals, or is this purely rhetorical?"

  **Predicted Answer:** She will say the word is deliberately doing political work. It mobilizes outrage and shifts the frame from "aid" to "justice."
  **Follow-up:** "But if it's rhetorical, doesn't it risk inflation? If every policy failure that leads to starvation is a 'crime,' does the word lose its force? Does calling it a crime weaken the case for prosecuting actual genocide, where the intent is explicit extermination?"

  ### 7. Agrometeorology & Climate (The Interviewer's Hobby-Horse)
  **Question:** "This is my old field. We used to see identical meteorological droughts on either side of a border produce famine on one side and stability on the other. That supports your view. But now, with attribution science, we can trace a drought partly to anthropogenic emissions. Those emissions come from identifiable emitters who are *not* the state that failed to protect the citizens. Does your natural-versus-political contrast collapse here? Does the defendant relocate from the local government to the global emitters, or does the local state remain solely liable for protection?"

  **Predicted Answer:** She will likely argue the local state retains the primary duty to protect its citizens regardless of external causes, but that global emitters bear secondary responsibility.
  **Follow-up:** "If the local state's capacity is *destroyed* by the external emissions—say, their tax base collapses because the crops fail due to US emissions—can they still be the criminal for failing to protect? Or does the 'crime' shift to the Global North? I'm asking if your framework can handle transboundary causality without letting the local state off the hook for incompetence."

  ### 8. Literature Objection (Hindsight and Capacity)
  **Question:** "A common objection in the literature concerns hindsight bias. Preventability looks obvious after the bodies are counted. *Ex ante*, capacity is uncertain. If a government makes a best-effort guess on grain reserves and gets it wrong, is that a crime? How much hindsight are your preventability judgements allowed to use before they become unfair?"

  **Predicted Answer:** She will argue that we have enough data now to know the thresholds, and that 'best effort' is not a defense when the stakes are mass death.
  **Follow-up:** "But if 'best effort' isn't a defense, you demand perfection from administrations in crisis. Does that set a bar so high that every government is technically criminal during a shock? If everyone is guilty, is anyone responsible?"

  ### Stage Management Advice
  *   **Pacing:** 40 minutes flies. If she waffles on the main question, cut her off politely: "I want to press you on the follow-up to that," and read the follow-up immediately.
  *   **Tone:** You are the empiricist; she is the theorist. Play that role. You bring the data (droughts, borders, yields); she brings the norms. Your job is to see if the norms fit the data.
  *   **The "Crime" Question:** This is the most likely to get bogged down in semantics. If she gets stuck on legal definitions, pull her back to the political utility (the follow-up).
  *   **The Agromet Question:** Save this for near the end. It establishes your authority and grounds the abstract debate in the physical reality you know best.
