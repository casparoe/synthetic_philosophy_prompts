answer: |-
  ### The Scenario: The Campaniform Sensilla of *Drosophila alticola*

  Consider a high-altitude species of fruit fly, *Drosophila alticola*, inhabiting turbulent wind shear zones. The trait is the **linear arrangement of campaniform sensilla** (strain detectors) along the third wing vein. An engineering model of wing deformation in thin air predicts that to maintain flight stability, strain detectors should be clustered at specific nodal points of torsional stress; *D. alticola* matches this model with high precision, and experimental ablation of these sensilla causes immediate crash rates to rise by 40% (demonstrable fitness effect). However, developmental mapping reveals that in this genus, sensilla can *only* differentiate at the intersections of wing veins and longitudinal morphogen gradients. The position of the third vein is determined by early embryonic scaling laws linked to overall body size (allometry), not by flight mechanics. Thus, the sensilla are mechanistically coupled to body size determination: larger flies have veins in different relative positions, and sensilla follow the veins.

  ### The Four Verdicts

  **1. The Optimality (Engineering) Adaptationist**
  *Verdict:* The arrangement is an **adaptation** for flight stability.
  *Reasoning:* The close fit between the sensilla positions and the independently derived torsional stress model, combined with the severe fitness cost of ablation, demonstrates that natural selection shaped this trait. The developmental coupling is merely the channel through which selection acted; selection favored the body size and vein placement that *allowed* for this optimal sensor array.
  *Evidence:* The biomechanical stress model and the ablation fitness data.
  *Historical Stance:* The current utility explains the form; the specific history is secondary to the convergent pull of the optimum.

  **2. The Gould–Lewontin Structuralist-Constraint Critic**
  *Verdict:* The arrangement is a **passenger** byproduct of selection on body size.
  *Reasoning:* The trait did not evolve *for* flight stability; it exists because selection favored a larger body size (perhaps for thermoregulation), which necessitated a shift in vein position via allometric scaling. The sensilla merely "rode along" because they are developmentally locked to the veins. The fit with flight mechanics is fortuitous, not causal.
  *Evidence:* The developmental map showing sensilla cannot form away from vein intersections.
  *Historical Stance:* A historical explanation is required to identify the *actual* target of selection (body size), distinct from the current utility (flight).

  **3. The Co-optionist**
  *Verdict:* The arrangement is a **scaffold** that constrained subsequent functional evolution.
  *Reasoning:* The vein-sensilla coupling is an ancient architectural feature of the genus. The high-altitude species did not evolve new sensor positions; rather, the flight musculature and wing stiffness were forced to evolve *around* the pre-existing sensory grid. The function was retrofitted to the structure, not the structure to the function.
  *Evidence:* Phylogenetic reconstruction showing the vein-sensilla coupling predates the high-altitude lineage.
  *Historical Stance:* History is primary; the trait's origin (structural necessity) is distinct from its current utility (flight sensing).

  **4. The Heuristic Adaptationist**
  *Verdict:* The "flight stability" hypothesis is the **working null**, currently retained.
  *Reasoning:* We proceed *as if* the trait is an adaptation because that generates testable predictions (e.g., ablation costs). However, if future work shows that altering body size shifts sensilla positions *without* improving flight, the adaptationist hypothesis for the *position* must be discarded in favor of a constraint model.
  *Evidence:* The ablation data supports the hypothesis, but the developmental data flags a potential confound.
  *Historical Stance:* Historical explanations are only necessary if the adaptationist null is falsified; currently, the functional evidence suffices for research strategy.

  ### Analysis

  **The Single Feature Doing the Work**
  The pivot of this case is the **developmental necessity** (the rule that sensilla *must* form at vein intersections). This feature creates a hard ceiling on phenotypic variance. Without this rule, the Adaptationist could argue selection moved the sensilla directly. With it, the Constraint theorist can argue selection could *only* act on the veins.

  **Removing the Feature**
  If you remove the developmental necessity (e.g., if sensilla can form inter-veinally but *happen* to align with veins), the case collapses back into your three-hour standoff. The Adaptist says, "Selection placed them there." The Constraint theorist says, "Selection placed the veins, and sensilla followed." Both stories fit the data equally well, and the dispute becomes purely about which narrative is more parsimonious or "worth asking." The hard developmental coupling is the only thing that forces a divergence in verdicts.

  **Strongest Reply for the Constraint Theorist**
  The Constraint theorist (Position 2) risks looking like they are making an unfalsifiable claim: "If it fits, it's a lucky passenger; if it doesn't, it's a binding constraint." Their strongest reply is to reject the premise that explanations must be historical efficient causes. They should argue: *"I am not offering a competing history of events; I am offering a formal explanation of possibility. Selection explains why this organism survived, but architecture explains why this organism was **possible** at all. You are asking 'Why here?' and I am answering 'Nowhere else was buildable.' These are not competing historical claims; they are different categories of explanation."*

  **Passenger vs. Scaffold**
  In this case, the **Passenger** variant (Position 2) fares better than the **Scaffold** variant (Position 3). The Passenger story explains the *origin* of the alignment (body size selection). The Scaffold story explains the *limitation* on future change (muscles had to adapt to sensors). The Passenger story is more threatening to the Adaptationist because it steals the causal credit for the trait's existence. The Scaffold story merely concedes the trait existed and argues about what happened next.

  **Factual or Verbal?**
  This case supports **your claim**: there remains a factual disagreement about the retrofitting of traits.
  The disagreement is not merely verbal because it rests on the **temporal sequence of fixation**, which is empirically decidable.
  1.  Did the vein position shift *because* of flight demands (Adaptationist)?
  2.  Did the vein position shift *because* of size demands, with flight benefits accruing later (Constraint/Passenger)?

  Phylogenetic comparative methods can test this. If sister species at low altitude (no flight stress) share the same vein-sensilla allometry, the Constraint story is factually supported. If high-altitude species show a derived break in the allometric rule specifically at the sensilla sites, the Adaptationist is factually supported. Your friend claims the dispute is verbal because both sides can redescribe the evidence. But they cannot redescribe the **phylogenetic sequence**. If the vein pattern predates the altitude shift, the Adaptationist is empirically wrong about the *origin*, even if right about the *maintenance*. The dispute is factual because the history of the constraint (when it arose) is distinct from the history of the selection (when it became useful), and modern phylogenetics can distinguish them.
