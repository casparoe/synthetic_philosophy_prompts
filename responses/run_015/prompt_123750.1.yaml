prompt: |-
  You're a professional philosopher who specializes in value theory and formal metaphysics — the kind of person who has actually argued about whether "better than" has to be transitive. Please think carefully about this one and do a bit of brainstorming on candidate constructions before you commit to your favourite; I'd rather see you reject two or three designs than polish the first one that comes to mind.

  Here's what I need. I'm prepping a seminar session on spectrum arguments against the transitivity of "better than," and I'm bored of the usual ones. Every version I can come up with leans on the same two crutches: the improvements between neighbouring items are tiny or imperceptible (so you're really doing a sorites in disguise), or the case only works because the items are being evaluated for slightly different purposes, or by someone whose standards drift as they walk down the chain. I want a case with neither crutch in it. So: build me a spectrum argument to the following specs.

  The case:
  - Four to six mundane comparanda — apartments a single person is choosing between, job offers, bikes, guitar amps, that kind of thing. One chooser, one role, one budget, one occasion. No future selves, no committees, no "it depends what you're in the mood for," no uncertainty or lotteries.
  - A chain A1 → A2 → ... → An where each link is a robust, confident "better than": you'd pay a real cost (say $50, or an hour of hassle) to move up one link, and you would not pay that cost to move back down. Not borderline, not "I can't tell," not "technically slightly." I want the improvement at each link to be large in the respect that's doing the deciding.
  - But head to head, at the end, A1 is clearly better than An — and not by a nose: by a margin big enough that you'd pay to go back.
  - The verdicts have to fall out of one comparison rule that you state up front in a single sentence and then apply uniformly to every pair. Not vibes, and not a different rationale at each link.
  - Anti-cheating clauses. (a) The rule can't be one I'd disown the moment I see the cycle — nothing like "count the respects each item wins and ignore how big the wins are." Every step has to be a verdict I'd still endorse on reflection, once the whole chain is in front of me. (b) It can't be a bare three-way rotation where each item wins on exactly one dimension and loses on one, i.e. rock-paper-scissors with the serial numbers filed off; let the items differ in two or three respects at each link so the pairwise verdicts have some texture. (c) No vagueness, no imperceptibility, and no appeal to the number of links quietly doing the work.

  After the scenario, I want the demonstration:
  1. Walk the chain. For each pair, state the numbers/respects, apply your stated rule, and show the verdict it gives.
  2. Name the single structural feature of the case that is doing the work — the thing that makes the cycle possible at all. Be honest about what kind of thing it is (is it in the aggregation across respects? in how the respects get weighted? somewhere else?).
  3. Removal test: delete that feature and show what the case collapses into. I expect either a plain sorites or a flat contradiction in the judgments — tell me which, and why.
  4. Then give me the strongest attack available to someone who insists betterness is transitive. I want them to be competent here, not a stooge: what exactly do they say is wrong with my rule, and is there a nearby rule that keeps every intuition I wanted to keep while restoring transitivity?
  5. Finally, your own read: does a case like this show that "better than" is not transitive, or only that the comparison procedure I used is a bad procedure — and what would have to be true for the first reading to win? If what I've asked for can't actually be built without smuggling in a shift in what the items are being judged as, say so plainly; I'd much rather be told the specs are unsatisfiable than handed a case that quietly cheats.
