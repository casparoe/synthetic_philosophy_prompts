prompt: |-
  You are a decision theorist who has taught rational choice to undergraduates many times and who cares about the difference between a student who can recite a formula and a student who sees what is at stake. Think the problem through carefully before you write, and start with a short brainstorm: enumerate the different morals this session could end on (utility must be bounded; expectation is the wrong summary statistic; the norm was never meant to govern one-shot gambles against idealized counterparties; something else) and pick one, telling me which of them a first-year can actually carry out of the room. What I want from you is a teaching plan, not the explanation itself.

  I'm a PhD student and next week I'm taking over a single forty-five-minute class of a first-year course called Rational Choice — mostly economics and PPE students, with a few mathematicians. The prior state they arrive in is what makes this hard to plan, and I'd like you to plan around it rather than ignore it: in the previous lecture they were taught expected-value maximization, they expanded the St. Petersburg sum themselves and watched it diverge, and they were given the standard expected-utility reply with logarithmic utility — diminishing marginal utility of money, and the small finite buy-in price that falls out for a given level of background wealth. So I am not introducing the paradox and I am not handing them Bernoulli; I have forty-five minutes to get them to see that the utility move relocates the difficulty rather than dissolving it, and that the live question is what authority an expectation-based norm has when almost all of the expectation sits in a tail that will almost certainly not be realized. They will also be slightly smug, because someone in the last class already said that no real casino could pay out and that this settles it, and I would like that smugness converted into a precise thought rather than merely punctured. Give me the arc in order with a rough clock, and for each step say what has to be in place before the next one can land. I also want one game to carry the whole session, and I have a candidate I want you to pressure-test and revise: a casino whose entire assets are a stated finite figure, which I make yield an expected value in the low tens of dollars (the payoff being capped once the coin run exceeds what the house can cover). Tell me what such an example must have and what it must lack — I want a cap students can see immediately, but I want to be able to re-open the same game later, first by letting the cap grow and watching the number creep upward, then by swapping in a faster-growing payout schedule to defeat the log-utility fix, without the game ever feeling like a new topic. My worry is that a cap that is too small makes the answer boring for the wrong reason, and that the faster schedule is doubly exponential, which may make the re-creation feel rigged rather than probing; tell me whether those worries are well founded and what the payout schedule should look like if the point is to test the utility reply fairly rather than to rig it.

  Then the misconception map, with each item placed at a point in the sequence rather than listed: that there is nothing here because no real casino can pay; that utility is a psychological fudge about how money feels, or that the lesson is that risk aversion is irrational; that we should therefore maximize the median or whatever usually happens; that the utility reply settled it, so on to the next topic; and that the whole thing shows rational choice theory has been refuted and mathematics can't be trusted with money. One of these I'm genuinely unsure how to classify and I'd like you to sort it out for me: the student who says that expected value just is the long-run average, so infinite expected value means that if I keep playing I will eventually be rich. I have a vague memory that for non-negative payoffs with an infinite mean the long-run average really does blow up rather than settling down, while the median outcome at any fixed number of stays stubbornly tiny and the timescale involved is absurd — if that's right, tell me whether this student is confused or onto something, and where in the forty-five minutes the correction or the concession belongs. Relatedly, an applied-probability friend told me something I only half remember: that a package of many plays is not worth many times the single-play price, that the total worth of n plays grows something like n times the base-two logarithm of n, so that a hundred plays come to only a few dollars per game. If I've got that roughly right, tell me where it earns its minutes and what it buys the session; if I've garbled it, correct it and tell me whether the corrected version still earns its minutes. Finish with three things: the single question I should end on to find out whether the idea has landed, together with what an answer that shows genuine understanding looks like as against an answer that is only rehearsed; the things I should openly decline to explain at this level and say out loud that I am declining (I have in mind the proof of any scaling result, the distinction between the sum being infinite and its merely approaching infinity, and the technicalities of decision-making with unbounded utility, but tell me what else belongs on that list and whether I'm being too cautious); and no reading list — I want the sequencing and the trap map, not sources.
