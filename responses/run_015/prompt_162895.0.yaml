  ### The Finish

  **1. The Closing Question**
  *   **Question:** "I have a Casino with \$1 Billion. I offer you the capped St. Petersburg game. I then double the Casino's assets to \$2 Billion. By how much should the fair price of the ticket increase? Is it double? Is it half? Or something else? Explain *why*."
  *   **Rehearsed Answer:** "It increases by \$1." (Reciting the log formula).
  *   **Understanding Answer:** "It increases by \$1 because the expected value grows logarithmically with the cap. The extra wealth only matters for the extremely unlikely tail outcomes, which contribute very little to the average." (Connects math to the distribution/tail insight).

  **2. What to Decline to Explain**
  *   **Say this out loud:** "I am going to leave three things on the table today, not because they aren't important, but because they require tools we don't have yet."
      1.  **The Proof of the Scaling Result:** "I won't prove why $n$ games scale as $\log n$. That requires measure theory."
      2.  **Bounded vs. Unbounded Utility Axioms:** "I won't prove why utility *must* be bounded to avoid Menger's result. That requires deeper axiomatics."
      3.  **Behavioral Alternatives:** "I won't teach you Prospect Theory or Median Maximization today. We are testing the limits of *Expected Utility*, not replacing it yet."
  *   **Am I being too cautious?** No. First-years conflate "I didn't prove it" with "It isn't true." Explicitly declaiming the scope protects the authority of the claims you *do* make.

