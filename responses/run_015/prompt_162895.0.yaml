answer: |-
  ### Brainstorm: Choosing the Moral

  Here are the candidate morals for this session:
  1.  **Utility must be bounded:** (Menger's result). Technically true, but leads to abstract axiomatics that first-years will treat as dogma.
  2.  **Expectation is the wrong summary statistic:** (Median/Mode focus). Dangerous; implies EV is *never* useful, rather than context-dependent.
  3.  **The norm was never meant to govern one-shot gambles against idealized counterparties:** (The "Authority" angle). This addresses the *application* of the math. It explains why the SPP feels wrong (it's a long-run property applied to a one-shot context) without discarding the math.
  4.  **Models require mapping assumptions:** (The "Map/Territory" angle). Good, but can become too philosophical and lose the decision-theoretic rigor.

  **Selection:** I recommend **#3 (Expectation is a long-run property, not a one-shot command)**.
  **Why:** A first-year can carry this out of the room. It converts the "no real casino" smugness into a precise insight about *time horizons* and *tail risk*. It allows you to validate their intuition (real casinos have caps) while showing that even with caps, the *logic* of expectation maximization remains fragile in one-off decisions. It sets up the distinction between *ergodicity* (long-run average) and *ensemble expectation* (average across possible worlds) without using those scary words.

  ---

  ### The Game: "The Bankruptible Casino"

  **Pressure-Test & Revision:**
  Your candidate (finite asset cap yielding low tens of EV) is the right starting point, but your worry about the "rigged" feeling of the super-exponential payout is well-founded. If you simply swap to $2^{2^k}$, students will feel you moved the goalposts to save the paradox.

  **Revision:** Keep the *structure* identical, change the *parameters*.
  *   **Structure:** Coin flip. Heads: Pot doubles. Tails: Pot paid. Game ends.
  *   **Parameter 1 (The Cap):** The Casino has wealth $W$. Payoff is $\min(2^k, W)$.
  *   **Parameter 2 (The Schedule):** The payoff rule is $f(k)$. Initially $2^k$. Later $2^{2^k}$.

  **What it must have:**
  *   A visible, concrete cap (e.g., "$1 Billion").
  *   A clear calculation that EV $\approx \log_2(W)$.
  *   A mechanism to show that increasing $W$ increases EV only *logarithmically* (diminishing returns to bankroll).

  **What it must lack:**
  *   Ambiguity about who pays.
  *   Any suggestion that the "Super" schedule is a *real* offer. Frame it explicitly as a *thought experiment* to test the robustness of the Utility solution.

  **Addressing the "Rigged" Worry:**
  Your worry is correct: $2^{2^k}$ feels artificial. **Mitigation:** Be explicit. "Bernoulli thought Log Utility solved this. Karl Menger showed in 1934 that for *any* unbounded utility function, I can rig a payout schedule to break it. I am not claiming this casino exists; I am claiming that *if* you accept unbounded utility, *then* you must accept this gamble. Do you?" This turns the "rig" into a *reductio ad absurdum* of unbounded utility, which is the theoretical point.

  ---

  ### The Teaching Plan (45 Minutes)

  #### 0:00 – 0:05: State of Play & The Smugness Check
  *   **Action:** Write the St. Petersburg payoff ($2, 4, 8...$) on the board. Remind them: Last time, EV = $\infty$. Solution proposed: Log Utility $\to$ Finite Price.
  *   **Prompt:** "Someone last week said: 'This is silly, no casino has infinite money.' That person was right. Today we grant them that victory. We cap the casino."
  *   **Prerequisite:** Students must recall the definition of EV and the concept of Diminishing Marginal Utility.
  *   **Misconception Target:** *That there is nothing here because no real casino can pay.* (Validate this immediately to lower defenses).

  #### 0:05 – 0:15: The Finite Casino (Validating the Intuition)
  *   **Action:** Set Casino Wealth $W = \$1 \text{ Billion}$ ($2^{30}$).
  *   **Calculation:** Walk through the EV sum. It truncates at $k=30$.
      *   $\text{EV} = \sum_{k=1}^{30} (1/2^k) \cdot 2^k + \text{remainder}$.
      *   Result: $\text{EV} \approx \$30$.
  *   **Discussion:** "So the price is \$30. Who pays \$30?" (Most will). "Who pays \$29?" (Most will).
  *   **The Pivot:** "Now, I double the Casino's wealth to \$2 Billion. How much does the fair price increase?"
      *   *Answer:* By \$1. (Because $\log_2(2W) = \log_2 W + 1$).
  *   **Point:** Expectation grows *logarithmically* with the cap. To get a fair price of \$1,000, the casino needs more money than exists in the universe.
  *   **Prerequisite:** Students must see that EV is finite *and* small.
  *   **Misconception Target:** *That the utility reply settled it, so on to the next topic.* (Show that EV is sensitive to the cap, but insensitive to the *risk* profile).

  #### 0:15 – 0:25: The Distribution Problem (EV vs. Experience)
  *   **Action:** Ask: "If EV is \$30, and I sell tickets for \$25, is it a good deal?"
  *   **Probe:** "What is the probability you win more than \$25?" (Answer: $1/4$ or less, depending on exact cap). "What is the median payout?" (Answer: \$2 or \$4).
  *   **Concept:** The EV is supported entirely by the tail. In 95% of outcomes, you lose money at a \$25 price point.
  *   **Point:** EV is an *average across possible worlds*, not a *prediction of your future*.
  *   **Prerequisite:** Students must understand Median vs. Mean.
  *   **Misconception Target:** *That we should therefore maximize the median or whatever usually happens.* (Acknowledge this is a strong competitor, but note it violates other rationality axioms—don't solve it, just flag the tension).
  *   **Misconception Target:** *That utility is a psychological fudge about how money feels.* (Clarify: This isn't about 'feeling'; it's about the mathematical weight of the tail).

  #### 0:25 – 0:35: Breaking Utility (The Menger Move)
  *   **Action:** "Okay, you say Log Utility saves us. It bounds the value."
  *   **The Twist:** Change the payout schedule to $2^{2^k}$ (Double Exponential). Keep the Cap $W$ for now, then remove it.
  *   **Math:** With Log Utility, $U(2^{2^k}) = 2^k \ln 2$. The probability is $1/2^k$. The terms in the EU sum become constant ($\ln 2$). The sum diverges.
  *   **Statement:** "For *any* unbounded utility function, I can construct a payout schedule that makes the Expected Utility infinite."
  *   **Point:** The Utility solution only works if Utility is *bounded*. Do you believe your utility for money is bounded? (Is there a sum of money that, if doubled, adds *zero* value to your life?)
  *   **Prerequisite:** Students must accept the Log Utility solution from the previous lecture.
  *   **Misconception Target:** *That the whole thing shows rational choice theory has been refuted and mathematics can't be trusted with money.* (Counter: Math is working perfectly; it's showing us that 'Unbounded Utility' + 'Rational Choice' are incompatible).

  #### 0:35 – 0:40: The Long Run (Feller & The Bundle)
  *   **Action:** Address the "Long Run" defense. "Student X said: 'Infinite EV means if I keep playing, I get rich.'"
  *   **Correction:** "Infinite mean means the *sample average* diverges, but the *rate* is glacial."
  *   **The Bundle Result:** "If you buy a bundle of $n$ tickets, the total value is not $n \times \text{Price}$. It grows like $n \log_2 n$." (Actually, fair price per game scales with $\log_2 n$).
      *   *Correction for the Plan:* Be precise. For St. Petersburg, the fair entry fee $e_n$ for $n$ games satisfies $e_n \sim \log_2 n$.
      *   *Example:* 1 game $\approx$ \$1 (logarithmic scale). 1,000,000 games $\approx$ \$20 per game.
  *   **Point:** You do not get rich quickly. You need to play $2^k$ times to see a payoff of $2^k$. The time horizon required to realize the EV exceeds a human lifespan.
  *   **Prerequisite:** Students must grasp the difference between one-off and repeated play.
  *   **Misconception Target:** *The student who says EV is the long-run average so infinite mean = eventually rich.* (Classify as: **Half-right technically, wrong practically.** The average does blow up, but the *time* to convergence is infinite. Place this here to show that even repeated play doesn't rescue EV maximization in a finite life).

  #### 0:40 – 0:45: Conclusion & Assessment
  *   **Action:** Summarize the arc. Caps make EV finite. Utility makes EV finite. But both rely on assumptions (Bankroll size, Bounded Utility) that are fragile.
  *   **Closing Question:** (See below).
  *   **Declinations:** (See below).

  ---

  ### Misconception Map (Sequential Placement)

  1.  **"No real casino can pay."**
      *   *Location:* 0:05 (Start).
      *   *Handling:* **Validate.** "Correct. That is why we cap the game." This converts smugness into a parameter ($W$).
  2.  **"Utility is a psychological fudge / Risk aversion is irrational."**
      *   *Location:* 0:15 (During Finite EV discussion).
      *   *Handling:* **Reframe.** "Utility isn't about feelings; it's about weighting. The math shows the weight of the tail is too heavy for linear valuation."
  3.  **"The utility reply settled it."**
      *   *Location:* 0:25 (Before Menger).
      *   *Handling:* **Disprove.** Show the super-exponential counter-example.
  4.  **"Maximize the median instead."**
      *   *Location:* 0:20 (During Distribution Problem).
      *   *Handling:* **Suspend.** "A viable alternative, but today we are testing the limits of *Expectation*, not replacing it."
  5.  **"Infinite EV = Rich in long run."**
      *   *Location:* 0:35 (The Long Run).
      *   *Handling:* **Correct.** "The average diverges, but the median stays low. You go bankrupt waiting for the mean."
  6.  **"Math can't be trusted."**
      *   *Location:* 0:40 (Conclusion).
      *   *Handling:* **Reassure.** "The math is trustworthy; it is telling us our *norms* (maximize EV) don't match the *world* (finite time/wealth)."

  ---

  ### Specific Clarifications

  **1. The "Long Run" Student Confusion**
  *   **Verdict:** The student is **confused**.
  *   **Reasoning:** For non-negative i.i.d. variables with infinite mean, the Strong Law of Large Numbers does not apply in the standard form. The sample mean $\bar{X}_n$ does diverge to infinity almost surely, *but* it does so extremely slowly. The median of $\bar{X}_n$ remains small.
  *   **Placement:** 0:35.
  *   **Correction:** "You are right that the average goes to infinity. You are wrong that this makes you rich. To see an average of \$1,000, you need to play roughly $2^{1000}$ times. That is longer than the heat death of the universe."

  **2. The "Bundle of Plays" (Feller's Result)**
  *   **Verification:** Your friend is **roughly right**.
  *   **Math:** For the St. Petersburg game, the fair entry fee $c_n$ for a bundle of $n$ games is asymptotic to $\log_2 n$. (Note: This is the fee *per game* if bought as a bundle, or the total fee is $n \log_2 n$).
  *   **Implication:** The value of the bundle is **sub-linear** relative to the naive EV intuition (which suggests infinite value), but **super-linear** relative to a fixed finite price.
  *   **Placement:** 0:35.
  *   **Value:** It buys the point that **linearity fails**. You cannot price a single ticket and multiply by $n$. The context (how many times you play) determines the price of the single ticket. This reinforces the "One-shot vs. Long-run" moral.

