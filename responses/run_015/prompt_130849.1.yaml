answer: |-
  This analysis proceeds from the facts as you have stipulated them, treating the Mandela episode as a stress test for the Dirty Hands (DH) doctrine rather than a historical inquiry. I will map the principals, run the authorization variable, address the guilt condition, test your distinction between authorization-relative and constraint-relative readings, and finally assess what the case does to the doctrine itself.

  ### 1. Mapping the Principals and the Violation

  In Walzer's standard formulation, the principal is the political community (the electorate) and the agent is the office-holder. Here, the mapping is fractured.

  **The Principals:**
  1.  **The Movement (ANC):** The formal principal. It holds the mandate, the policy (armed struggle), and the discipline.
  2.  **The Black Public:** The constituency on whose behalf the struggle is waged. They are the beneficiaries of the "good" but are excluded from the decision.
  3.  **The Exiled Leadership:** The operational trustees of the Movement.
  4.  **The White Public/Regime:** The counter-party. While not a principal Mandela represents, their recognition is the object of the violation (legitimizing a regime deemed illegitimate).

  **The Constraint Violated:**
  The core constraint is not merely "lying" (which is endemic to war) but **procedural legitimacy within a liberation movement.** The ANC's authority rested on collective decision-making and the refusal to recognize the apartheid state's right to govern. By initiating secret talks, Mandela potentially violated:
  *   **Intra-movement trust:** Deceiving comrades who were risking lives based on the official policy of armed struggle.
  *   **Ideological consistency:** Engaging the enemy as a negotiating partner implicitly grants them a status the movement officially denied.
  *   **Risk exposure:** Unilaterally exposing the movement to the risk that the talks would be revealed, causing a collapse in morale or a split, without the collective bearing that risk knowingly.

  **The Good Invoked and Probability:**
  The good is the termination of apartheid and the avoidance of a racial civil war.
  *   *Ex Ante Probability:* Low to Moderate. In the mid-1980s, the regime appeared entrenched; negotiations could have easily resulted in Mandela's isolation, the branding of him as a traitor, and a hardening of the government's stance. The "supreme emergency" Walzer requires is present (systemic oppression/violence), but the efficacy of the specific means (secret talks) was highly uncertain.

  ### 2. The Authorization Variable

  You suspect authorization is doing the heavy lifting. The analysis confirms this. The moral texture of the case changes fundamentally depending on the status of the exiled leadership.

  **Version A: The *Fait Accompli* (Unauthorized)**
  If the exiled leadership was kept in the dark, Mandela acts as a unilateral agent.
  *   **DH Fit:** High. He violates the movement's rules to save the movement's goal. He assumes the moral burden of betrayal to secure the possibility of peace.
  *   **Nature of the Dirt:** The dirt is **betrayal of trust**. He treats his comrades as means to an end they did not choose.
  *   **Resolution:** If successful, he presents the leadership with a choice: repudiate him (and lose the transition) or ratify him. This is the classic DH structure: the leader absorbs the sin so the community remains clean.

  **Version B: General Authorization (Known/Winked)**
  If the exiled leadership knew and gave general cover.
  *   **DH Fit:** Low. The action becomes a matter of **strategic secrecy** rather than moral transgression against the principal.
  *   **Nature of the Dirt:** The dirt shifts from *betrayal of comrades* to *deception of the base/public*. The leadership is complicit, so the "hands" of the movement are already dirty, not just Mandela's.
  *   **Resolution:** This reduces the episode to a tactical necessity. The "tragedy" evaporates because the collective conscience is already engaged.

  **Conclusion on the Variable:**
  If Version B holds, the case ceases to be about Dirty Hands and becomes about **Paternalism**. The leadership deceives the public for their own good. If Version A holds, it is Dirty Hands. The ambiguity in the historical record allows the myth of Mandela to function: supporters can claim Version B (discipline was maintained) while critics or realists can imply Version A (great men must break rules). But analytically, Version A is required for the DH doctrine to apply.

  ### 3. The Guilt Condition

  Walzer insists the "decent politician" must feel guilt and acknowledge the wrong. Mandela displayed no public torment and was not criticized for its absence.

  **Is Guilt Structural or Psychological?**
  *   **If Structural:** Guilt is the proof that the norm remains valid. Without it, the agent suggests the norm was not actually violated. Mandela's clean conscience suggests he did not view the talks as a *moral* wrong, but a *tactical* necessity.
  *   **If Psychological:** Guilt is a symptom of the burden.

  **Analysis of the Mandela Case:**
  Mandela's lack of torment challenges Walzer's universal claim. It suggests two possibilities:
  1.  **Revolutionary vs. Liberal Morality:** Walzer writes about liberal office-holders preserving democratic norms. Mandela was a revolutionary prisoner. In revolutionary ethics, fidelity to the *outcome* (liberation) may supersede fidelity to *procedure* (consultation). If the end is absolute, the means are not "dirty," they are just "costly."
  2.  **The Clean Conscience as Strategy:** Acknowledging guilt might have undermined the negotiation. If Mandela admitted to the ANC that he broke ranks, he weakens his standing. If he admitted to the Government that he was betraying his comrades, he looks weak. Silence is tactical.

  **Verdict:** The case suggests the guilt condition is not essential to the *structure* of DH, but is essential to Walzer's *liberal* version of it. An agent can have dirty hands and a clean conscience if they operate under a consequentialist imperative strong enough to override the deontological stain. This does not negate the dirt; it negates the *acknowledgment* of the dirt.

  ### 4. Authorization-Relative vs. Constraint-Relative

  This is the crux of your theoretical test.

  **Authorization-Relative Reading:**
  *   *Definition:* The dirt consists in acting without a mandate. Ratification launders the act.
  *   *Application:* If the ANC exiles ratified the talks post-hoc (which they effectively did by embracing the transition), the dirt dissolves. Mandela becomes a visionary leader who took initiative, not a sinner.
  *   *Consequence:* This reduces DH to a **mandate defect**. It turns a moral tragedy into a bureaucratic irregularity. If the principal says "yes" afterwards, no wrong was done.
  *   *Support:* This fits the political reality. Mandela was not punished; he was elevated. The "dirt" was laundered by success and ratification.

  **Constraint-Relative Reading:**
  *   *Definition:* The dirt is fixed by the norm broken (e.g., "do not negotiate with evil," "do not deceive comrades"). Consent cannot launder it.
  *   *Application:* Even if the ANC said "yes," talking to the architects of apartheid while comrades died in the field remains a moral violation.
  *   *Consequence:* Success does not wash the stain. The agent owes an accounting regardless of the outcome.
  *   *Support:* This fits the philosophical intuition of DH. If the act was truly "dirty," the 1994 victory shouldn't make it morally neutral.

  **Which does the case support?**
  Politically, the case supports the **Authorization-Relative** reading. The "dirt" vanished because the principal (the Movement) accepted the result.
  However, this exposes a weakness in the Authorization-Relative view: it turns DH into a mere question of *authority*. If I have the authority, or can get it later, I cannot get my hands dirty. This strips the doctrine of its tragic weight.
  The Mandela case suggests that **Constraint-Relative** is the only reading that preserves the concept of Dirty Hands. If we accept Authorization-Relative, Mandela committed no moral error, only a procedural one. But if we feel there *was* a moral cost (the deception, the risk to comrades), then ratification failed to launder it. The fact that no accounting occurred suggests the political community chose to ignore the Constraint-Relative dirt in favor of the Authorization-Relative victory.

  ### 5. Testing the Doctrine

  Finally, we must ask what this case does to the DH doctrine itself.

  **A. The Requirement of Office**
  Walzer and Williams assume an office-holder accountable to a state. Mandela had no office, no electorate, and no formal mandate.
  *   **Implication:** DH may be a **Morality of Office**, not a universal structure of political action. Office creates a specific duty to the *existing* order that makes breaking norms tragic. A revolutionary's duty is to *overturn* the order. Breaking the norms of a movement to destroy a state is different from breaking the norms of a state to save it.
  *   **Verdict:** The doctrine does not transfer cleanly. Without office, the "public" is abstract. Mandela was accountable to history, not a constituency. This makes DH harder to locate because the mechanism for "acknowledgment and punishment" (elections, impeachment) did not exist.

  **B. Retrospective Success as Laundering**
  Does 1994 launder the dirt?
  *   **Theory says:** No. Walzer argues we should be slow to forgive; the stain remains.
  *   **Case says:** Yes. The success vindicated the means.
  *   **Follow-up:** If success launders dirt, DH is merely **instrumental risk-taking**. It is not a moral category but a calculation. If the gamble pays off, it was wisdom; if it fails, it was treason. This collapses the moral distinction Walzer tries to maintain.

  **C. The TRC as a DH Institution**
  Is the Truth and Reconciliation Commission (TRC) an institutionalization of Dirty Hands?
  *   **Argument for Yes:** The TRC traded justice for truth/stability. It acknowledged that "dirty" acts (amnesty for crimes) were necessary for the "good" (peace). It formalized the forgiveness Walzer speaks of.
  *   **Argument for No:** The TRC focused on *human rights violations* (torture, killing), not *political deception* or *mandate violations*. It addressed the dirt of the *war*, not the dirt of the *negotiation*. Mandela's secret talks were not subject to the TRC.
  *   **Analysis:** The TRC institutionalized the **Constraint-Relative** view for violence (amnesty requires truth) but allowed the **Authorization-Relative** view for politics (the negotiators were not scrutinized). This suggests a limit to the doctrine: we institutionalize forgiveness for blood, but we sanctify success in statecraft. The TRC was an evasion of the specific dirty hands of the *transition architects*, focusing instead on the dirty hands of the *combatants*.

  **D. Silence of the Theory**
  Where the theory is silent:
  1.  **Non-State Actors:** DH theory lacks a framework for leaders who represent a future state rather than an existing one.
  2.  **Collective vs. Individual:** Walzer focuses on the individual soul of the politician. In the Mandela case, the "dirt" was likely shared by a small cabal (the secret committee), diffusing the individual moral burden Walzer deems essential.
  3.  **The Absence of Punishment:** Walzer expects the leader to accept punishment or at least public censure. Mandela received neither. The theory cannot explain why a successful dirty-hands agent is often canonized rather than chastened.

  ### Summary Conclusion

  The Mandela case strains the Dirty Hands doctrine to its breaking point.
  1.  **Authorization:** If the talks were unauthorized, it fits DH; if authorized, it fits Paternalism. The historical ambiguity allows the DH label to stick rhetorically while the reality may be the latter.
  2.  **Guilt:** Mandela's clean conscience suggests that in revolutionary contexts, the "tragedy" of DH is suppressed by the necessity of the outcome. This challenges Walzer's claim that guilt is a marker of moral decency.
  3.  **Authorization vs. Constraint:** The political reality (canonization of Mandela) supports the **Authorization-Relative** reading: ratification and success laundered the act. But this reduces DH to a mandate issue, stripping it of moral tragedy. To preserve the tragedy, one must hold to the **Constraint-Relative** reading, which implies the 1994 settlement rests on a moral debt that was never paid.
  4.  **Doctrine Limits:** The case reveals DH as a **Morality of Office**. Without formal accountability, the mechanisms for acknowledging and punishing dirty hands (which Walzer sees as vital) vanish. The TRC addressed the violence of the conflict but institutionalized the evasion of the political deception that ended it.

  The theory is silent on how to judge a leader who breaks the rules of a movement to birth a state, succeeds, and feels no remorse. In that silence, the doctrine appears less like a universal structure of political ethics and more like a specific anxiety of liberal democracy regarding its own office-holders.
