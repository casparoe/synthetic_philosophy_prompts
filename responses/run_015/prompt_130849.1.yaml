      *   **Constraints:**
          *   Disciplined case analysis, not a literature survey.
          *   Work from the facts provided by the user (don't reconstruct history independently).
          *   Handle the "authorization variable" explicitly (Exiled leadership knew/authorized vs. kept in the dark).
          *   Map the principals (Who is being represented? Whose constraints are violated?).
          *   Identify the content of the violation (Deception, mandate, legitimacy, risk).
          *   Assess the "good invoked" and its probability (ex ante).
          *   Address the "Guilt Condition" (Mandela lacked torment/guilt; is this essential to DH?).
          *   Test the "Authorization-Relative" vs. "Constraint-Relative" distinction.
          *   Test the doctrine itself (Does DH apply to non-office holders? Does success launder dirt? What about the TRC?).
          *   Tone: Analytical, not hagiographic or debunking. No citations. Skip chronology/historiography.

  2.  **Deconstruct the Case Facts (as given):**
