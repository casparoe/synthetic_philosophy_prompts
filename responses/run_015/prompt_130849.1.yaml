      *   **Context:** ANC banned, leadership exiled, armed struggle official policy, mass mobilization at home.
      *   **Action:** Clandestine contact with Apartheid government (Justice Minister, Intelligence, secret committee).
      *   **Duration:** Mid-1980s to Feb 1990 (unbanning/release).
      *   **Outcome:** Credited with making negotiated transition/1994 election possible.
      *   **Constraint:** Refused earlier conditional release (renouncing armed struggle).
      *   **Variable:** Did exiled leadership know/authorize, or was it a *fait accompli*?

  3.  **Section 1: Mapping the Principals and Violations:**
      *   *Who is the principal?* It's fractured.
          *   The Movement (ANC): Officially committed to armed struggle until conditions met.
          *   The Constituency (Black public): Suffering under apartheid, wanting freedom, potentially wanting peace but trusting the leadership's stance.
          *   The Comrades (Exiled/Imprisoned): Bound by collective discipline.
      *   *What is the violation?*
          *   If unauthorized: Betrayal of collective discipline, deception of comrades.
          *   If authorized (generally): Still deception of the *base* (public) and potentially legitimizing the enemy prematurely.
          *   Core tension: Recognizing the legitimacy of the jailer to negotiate freedom, while officially denying that legitimacy.
      *   *The Good:* Ending apartheid, avoiding civil war, achieving democracy.
      *   *Probability (Ex Ante):* Low to Moderate. Negotiations could fail, strengthening hardliners on both sides.

  4.  **Section 2: The Authorization Variable (The Core Hypothesis):**
      *   *Scenario A (Unauthorized/Fait Accompli):* Mandela acts unilaterally.
          *   DH Analysis: Stronger case for DH. He violates the movement's rules to save the movement's goal. He bears the moral burden alone.
          *   Authorization-Relative View: This is pure dirty hands. He did what they wouldn't authorize *ex ante* to secure what they would want *ex post*.
          *   Constraint-Relative View: He violated the norm of collective decision-making.
      *   *Scenario B (Authorized/Known):* Leadership gave a wink or general mandate.
          *   DH Analysis: Weaker case for DH *internally*. It becomes a strategic secret rather than a moral transgression against comrades.
          *   However, deception of the *public* remains.
      *   *Impact:* If authorized, the "dirt" shifts from betrayal of comrades to necessary deception of the enemy/public. If unauthorized, the "dirt" is intra-movement betrayal. The user suspects authorization does the heavy lifting. I need to confirm this: Yes, authorization transforms "treason/betrayal" into "strategic secrecy."

  5.  **Section 3: The Guilt Condition (Walzer's "Decent Politician"):**
      *   Walzer argues the agent must feel guilt/remorse to prove they acknowledge the violated norm.
      *   Mandela: No public torment, no apparent guilt.
      *   *Interpretation 1:* He isn't a "decent politician" in Walzer's sense (maybe a revolutionary saint?).
      *   *Interpretation 2:* The guilt condition is psychological, not structural. If the act was necessary, guilt might be counter-productive.
      *   *Interpretation 3:* He *did* acknowledge the risk (refusing conditional release shows he knew the line), but viewed the secret talks not as a moral wrong but a tactical necessity.
      *   *Conclusion:* This case challenges the necessity of *torment*. It suggests that in revolutionary contexts, "clean conscience" might stem from a higher fidelity to the *end* (liberation) overriding the *means* (procedure), whereas Walzer writes about liberal democrats preserving their soul while governing.

  6.  **Section 4: Authorization-Relative vs. Constraint-Relative:**
      *   *Authorization-Relative:* Dirt = acting without mandate. If ratified, dirt disappears.
          *   Application: If the ANC exiles ratified it later, was it washed clean? If yes, this reduces DH to a procedural error (mandate defect).
      *   *Constraint-Relative:* Dirt = breaking a moral norm (e.g., "do not negotiate with evil"). Consent doesn't fix it.
          *   Application: Even if the ANC said "yes," is talking to the Apartheid regime inherently "dirty" (legitimizing oppression)?
      *   *Analysis:* This case supports the **Authorization-Relative** view more strongly *if* we view the primary norm as collective discipline. However, if the norm is "do not legitimize oppressors," it's Constraint-Relative.
      *   *Crucial Point:* If Authorization-Relative holds, Mandela's action isn't "tragic" DH, it's just "leadership initiative." If Constraint-Relative holds, the 1994 success doesn't wash the stain of negotiating with a criminal regime.
      *   *My take:* The case suggests DH is often just a mandate defect disguised as tragedy. But the *deception* element keeps it in DH territory even with ratification.

  7.  **Section 5: Testing the Doctrine (Office, Accountability, TRC):**
      *   *Office:* Walzer/Williams assume office-holders (Prime Ministers, Presidents). Mandela was a prisoner/revolutionary.
      *   *Implication:* DH might be a "Morality of Office." Without office, you don't represent the *state*, you represent a *cause*.
      *   *Transferability:* Does DH apply to revolutionaries? Yes, but the "public" is different.
      *   *Success Laundering:* Does 1994 wash the dirt?
          *   If DH is real, success shouldn't wash it.
          *   In reality, success *did* wash it. This suggests the public views DH instrumentally (results matter), while philosophers view it deontologically (norms matter).
      *   *TRC:* Was it a DH institution?
          *   TRC traded truth for amnesty. This is institutionalized DH ("We acknowledge crimes were committed for political ends, we forgive them to save the nation").
          *   Or was it an evasion? (Avoiding Nuremberg-style justice).
          *   Fit: It looks like an institutionalization of the "forgiveness" Walzer talks about, but applied to *both* sides, not just the leader with dirty hands.

  8.  **Synthesizing and Refining:**
      *   *Tone Check:* Ensure I'm not praising Mandela blindly. Keep it cold.
      *   *User's Specific Questions:*
          *   Who is the principal? (Fractured movement).
          *   Authorization variable impact? (Transforms betrayal to strategy).
          *   Guilt condition? (Challenges Walzer; suggests DH might be office-specific).
          *   Auth-Relative vs. Constraint-Relative? (Case leans Auth-Relative, reducing tragedy to mandate issues).
          *   Doctrine limits? (DH relies on office/accountability; Mandela lacks these).
          *   TRC? (Institutionalized forgiveness, potentially evading the specific "leader's guilt" Walzer wants).

  9.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the parameters.
      *   *Mapping:* Define the principals. The "Movement" is the key principal, but it's fractured.
      *   *The Authorization Variable:* Run Scenario A (Unauthorized) and Scenario B (Authorized). Show how A fits DH better, B fits "Strategic Necessity."
      *   *The Guilt Condition:* Address the lack of torment. Is Walzer wrong, or is this a different category?
      *   *Authorization vs. Constraint:* Analyze whether ratification launders the act.
      *   *Doctrine Stress Test:* Office-holding, success laundering, TRC.
      *   *Conclusion:* Summarize where the theory breaks.

      *(Self-Correction during drafting)*: I need to be careful not to decide historically whether the exiles knew. The prompt says "accounts differ." I must run *both* versions as hypotheticals within the analysis.
      *(Refining the "Principal" point)*: The White Public is also a principal in the negotiation, but the *violation* is against the Black public/Movement.
      *(Refining the TRC point)*: Walzer talks about the *leader* being punished/forgiven. The TRC was broader. I need to note that distinction.

  10. **Final Polish:** Check against constraints. No citations. No chronology. No hagiography. Ensure the "Authorization-Relative" vs "Constraint-Relative" distinction is clearly defined and applied. (This is the philosophical core of the prompt).

      *Wait, one nuance:* The prompt asks: "Does the authorization-relative reading turn Mandela's action into a mere mandate defect... rather than the morally tragic violation?" I need to answer this directly. Yes, it risks reducing it to bureaucracy. But does that matter if the outcome is liberation?

      *Another nuance:* "Walzer's decent politician is supposed to know that he has done wrong... Mandela... was not tormented." I need to explore if this means Mandela didn't think it was *wrong*, or if he suppressed the guilt. The prompt suggests he wasn't criticized for the absence of guilt. This implies the observers didn't think he *should* feel guilt. That challenges Walzer's universal claim.

      *Final check on "Office":* Walzer's DH is about the *special* morality of the statesman. Mandela wasn't a statesman yet. Does DH apply to rebels? This is a key theoretical limit to expose.

