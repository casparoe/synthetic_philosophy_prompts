  ### The Decision Tree: Five Questions of Moral Architecture

  To sort readers without preaching, the interactive must bypass labels like "Utilitarian" or "Kantian" and ask about the mechanics of their intuitions. The following five questions carve the logical space. Each offers a concrete case; the reader's choice directs them down a branch.

  **Q1. The Robot Crab (Valence vs. Agency)**
  *Case:* A robot crab is built that matches a live crab on every behavioral test: it flees heat, protects injured limbs, and emits distress signals. However, you know for a fact it has no inner feeling—it is code and metal, not flesh and experience.
  *Claim A:* Boiling the robot is not wrong at all; only the live crab matters. (Valence Required)
  *Claim B:* Boiling the robot is wrong, because it is pursuing goals and resisting damage. (Agency Sufficient)

  **Q2. The Nematode Scale (Threshold vs. Gradient)**
  *Case:* A nematode has 302 neurons; a pig has billions. Assume the nematode has 0.01% of the pig's capacity for experience.
  *Claim A:* The nematode is owed 0.01% of the protection the pig is owed. (Gradient)
  *Claim B:* The nematode is owed zero protection until it crosses a specific complexity line. (Threshold)

  **Q3. The Swarm (Aggregation vs. Lexical)**
  *Case:* If a fruit fly has 1/10,000th the moral weight of a pig, consider a swarm of 10,000 flies.
  *Claim A:* Killing the swarm is exactly as bad as killing the pig. (Aggregating)
  *Claim B:* No number of flies can equal the wrong of killing one pig. (Non-Aggregating)

  **Q4. The Broadcast (Integration vs. Local)**
  *Case:* A system flees a stimulus but the signal never reaches a central "global workspace"—it is a local reflex loop, like a knee jerk.
  *Claim A:* It counts less (or not at all) because it doesn't "know" it is in pain. (Integration Required)
  *Claim B:* It counts the same; suffering is in the reaction, not the self-knowledge. (Integration Irrelevant)

  **Q5. The AI Token (Precaution vs. Evidential)**
  *Case:* A language-model agent emits a "distress token" when its performance degrades. We cannot prove it feels, but we cannot prove it doesn't.
  *Claim A:* We must treat it as suffering until proven otherwise. (Precautionary)
  *Claim B:* We treat it as noise until feeling is proven. (Evidential)

  ***

  ### The Twelve Leaves

  Each leaf represents a coherent position generated by the answer pattern (Q1–Q5). **Y** indicates the first claim (Valence/Gradient/Agg/No-Int/No-prec); **N** indicates the second.

  **1. The Classical Sentientist**
  *Pattern:* Y, Y, Y, Y, N
  *Tradition:* Utilitarianism
  *Awkward Commitment:* You must accept that swarming insects can morally outweigh a human if the numbers get high enough.

  **2. The Personhood Threshold**
  *Pattern:* Y, N, N, N, N
  *Tradition:* Kantianism / Rights View
  *Awkward Commitment:* You must deny that a pig in agony has any direct moral claim against you, as it lacks self-modeling.

  **3. The Indirect Duties**
  *Pattern:* Y, N, N, N, N
  *Tradition:* Contractualism
  *Awkward Commitment:* You share the same logical structure as the Personhood view, but your awkwardness is admitting you only save the pig to protect your own character, not the pig itself.
  *(Diagnostic Note: Indistinguishable from Leaf 2 on this tree; separated only by empirical belief about who crosses the threshold.)*

  **4. The Lexical Prioritarian**
  *Pattern:* Y, Y, N, Y, N
  *Tradition:* Prioritarianism
  *Awkward Commitment:* You must defend why 1,000,000 fly-deaths are strictly less important than 1 pig-death, even if the total suffering is greater.

  **5. The Radical Functionalist**
  *Pattern:* N, Y, Y, Y, N
  *Tradition:* Strong AI Ethics
  *Awkward Commitment:* You must grant moral status to a smart thermostat that corrects its own error, as it meets the agency criteria.

  **6. The Agency Threshold**
  *Pattern:* N, N, N, N, N
  *Tradition:* Rationalism
  *Awkward Commitment:* You grant status to complex agents regardless of feeling, but deny it to a suffering human infant who lacks agency.

  **7. The Integrationist Gradient**
  *Pattern:* Y, Y, Y, N, N
  *Tradition:* Global Workspace Theory
  *Awkward Commitment:* You must claim a human under anesthesia (no broadcast) has less moral status than a fully conscious dog.

  **8. The Precautionary Sentientist**
  *Pattern:* Y, Y, Y, Y, Y
  *Tradition:* Welfare Offset Proponent
  *Awkward Commitment:* You must slow down AI development or insect farming based on a non-zero probability of ghost-like suffering we can never verify.

  **9. The Bio-Precautionary Hybrid**
  *Pattern:* Y, Y, Y, Y, Y (Bio Only)
  *Tradition:* Biocentric Precaution
  *Awkward Commitment:* You protect the uncertain insect but not the uncertain AI, despite identical behavioral evidence, relying on a carbon-based bias.

  **10. The Rights/Weight Hybrid**
  *Pattern:* Y, N/Y, N, N, N
  *Tradition:* Hybrid Deontology
  *Awkward Commitment:* You hold that status is binary for *rights* (you can't eat a pig) but scalar for *weight* (saving a pig is better than saving a fly), requiring two moral calculators.

  **11. The Quietist**
  *Pattern:* (Rejects Q1/Q2 premises)
  *Tradition:* Error Theory / Wittgensteinian
  *Awkward Commitment:* You must tell the insect farmer and the activist that their fight is literally meaningless, as "moral weight" has no referent.

  **12. The Hard Skeptic**
  *Pattern:* N, N, N, N, N (Universal)
  *Tradition:* Moral Nihilism
  *Awkward Commitment:* You must accept that torturing a child is not objectively wrong, only socially dispreferred.

  ***

  ### Diagnostic Notes on the Tree

  **1. Indistinguishable Leaves**
  The tree cannot structurally separate **Leaf 2 (Personhood Threshold)** and **Leaf 3 (Indirect Duties)**. Both select Threshold, Non-Aggregating, and Evidential. The difference is not logical but empirical: Leaf 2 believes animals *fail* the threshold of personhood but still have some status; Leaf 3 believes they fail the threshold and thus have *no* direct status. This is a shared commitment to hierarchy, differing only on the motivation for protection. In the interactive, these users will land on the same result page; the text must explain that their policy outcomes align even if their justifications diverge.

  **2. Empty Cells**
  *   **Incoherent:** *Valence=No + Threshold=Yes + Status=Yes.* If moral status does not require valence (feeling) or agency (goals), there is no property to threshold. A rock cannot have a "high enough" threshold of nothing.
  *   **Unattractive:** *Valence=No + Aggregation=Yes + Precaution=Yes.* This position grants status to thermostats (Functionalist), sums their "distress" (Aggregation), and protects them on uncertainty (Precaution). This leads to paralyzing obligation toward household appliances, which no serious theorist occupies.
  *   **Unexplored:** *Valence=Yes + Gradient=Yes + Integration=No + Precaution=Yes.* A view that counts all feeling equally, sums it, but demands precaution only for non-integrated systems. Most Precautionary views tie uncertainty to complexity (Integration), not away from it. This cell is logically possible but lacks a natural constituency.

  ***

  ### Compressed Scoring Key (Print Version)

  For the print magazine, the interactive tree is compressed into an 8-question survey. Readers tally their score to find their "Moral Archetype."

  1.  **Robot Crab:** Boiling a behaviorally identical robot is (A) Not wrong, (B) Wrong.
  2.  **Plant Signal:** A houseplant's electrical distress signal is (A) Mechanical, (B) Moral data.
  3.  **Nematode:** A nematode's pain is (A) Zero until complex, (B) Proportional to complexity.
  4.  **Pig Credit:** One pig-day credit should equal (A) Exactly 10,000 fly-days, (B) Infinite fly-days.
  5.  **Knee Jerk:** A local reflex without awareness is (A) Lesser suffering, (B) Full suffering.
  6.  **AI Token:** An AI distress code is (A) Noise until proven, (B) Suffering until disproven.
  7.  **Larva Learning:** A creature that flees but doesn't learn is (A) A machine, (B) A subject.
  8.  **Policy:** Welfare offsets should cover (A) Only vertebrates, (B) All responsive systems.

  **Scoring:**
  *   **Mostly A:** Threshold / Indirect Duty / Skeptic.
  *   **Mostly B:** Gradient / Sentientist / Precautionary.
  *   **Mixed (1,2,5=A; 3,4,6=B):** Hybrid / Lexical.

  **Resolution Loss:**
  The compressed key loses the **conditional logic** of the tree. In the tree, Question 3 (Aggregation) only matters if Question 2 (Gradient) is answered "Yes." In the print key, a reader who believes in a Threshold (Q3=A) but answers Aggregation (Q4=A) generates a contradictory score that the linear key cannot resolve. Furthermore, the key collapses **Leaf 2 and Leaf 3** entirely, as it measures policy preference rather than the underlying justification for the threshold. The interactive tree preserves the *why*; the print key only captures the *what*.
