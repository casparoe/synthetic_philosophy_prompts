answer: |-
  This is a fantastic debate. It touches on the core tension between **ontology** (what actually happened) and **epistemology** (what we can know and prove). You and your friend are arguing past each other because you are defining "History" differently: she is defining it as a *discipline of verification*, while you are defining it as *past reality*.

  Here is the adjudication, point by point, followed by what you are both missing.

  ### 1. Is archaeological matching sufficient?
  **Verdict: You are right.**

  Finding the physical location of a legend proves the *setting*, not the *plot*.
  *   **The Case of Troy:** Heinrich Schliemann found Hisarlik (Troy) and famously declared he had found the truth of Homer. Modern archaeology agrees Hisarlik was a real city that was destroyed by war around the right time period (Late Bronze Age). However, archaeology cannot confirm Achilles, Agamemnon, or a Wooden Horse. It confirms a conflict occurred, but not the *narrative* of the conflict.
  *   **The Boundary:** Archaeology moves a story from "Pure Myth" (a place that never existed) to "Legendary History" (a story rooted in a real context). It does not automatically make the specific narrative "History" in the academic sense. Your friend's initial standard was too low; your pushback was correct.

  ### 2. Is independent non-literary corroboration the right standard?
  **Verdict: Your friend is methodologically right; you are philosophically right.**

  *   **The Friend's View (The Historian's Standard):** In Classics and Ancient History, "History" begins where contemporary, non-biased documentation begins. For the Trojan War, we have Hittite records mentioning a city called *Wilusa* (Troy) and a troublemaker named *Attarsiya* (possibly Atreus). This moves Troy closer to history than Arthur. For Exodus, the lack of Egyptian administrative records regarding a mass slave departure is a massive strike against its historicity, regardless of biblical text.
  *   **Your View (The Philosophical Objection):** Relying on inscriptions privileges societies that wrote on stone over those that wrote on papyrus (which rotted), or societies that didn't write at all. If a battle happened but no one carved it on a stele, did it cease to be history? No. It just ceased to be *verifiable*.
  *   **The Adjudication:** Independent corroboration is the threshold for **academic consensus**, not necessarily for **historical reality**. Your friend is describing the gatekeeping mechanism of the discipline; you are describing the reality of the past.

  ### 3. Does preservation bias undermine the whole project?
  **Verdict: You are right, but it doesn't destroy the distinction.**

  *   **The Argument:** You argued that making "history" dependent on what survived is arbitrary. You are correct that the historical record is a shattered mirror. We know vastly more about a minor Roman bureaucrat (who had stone monuments) than a major Celtic chieftain (who had oral tradition).
  *   **The Counter:** However, historians know this. They don't claim "Nothing happened here because we have no records." They claim "We cannot reconstruct this event."
  *   **The Adjudication:** Preservation bias makes the *line* fuzzy, but it doesn't erase it. It means the map is incomplete, not that the territory doesn't exist. Your friend is right that we must work with the evidence we have; you are right that we must admit the evidence is biased. The "line" isn't a wall between Legend and History; it's a fog of war.

  ### 4. What's the deal with composite figures (King Arthur)?
  **Verdict: Your friend is right (it's not a dichotomy), but you are right (it matters for labels).**

  *   **The Reality:** "Arthur" is almost certainly a *folkloric accumulation*. He may be based on a 5th-century warlord (Ambrosius Aurelianus?), a bear-god cult, or a composite of several battles against Saxons.
  *   **The Friend's Point:** Calling him "Legendary" doesn't mean "Fake." It means his story functions as legend. Whether one man did all the deeds or ten men did them and the stories merged is a historical detail, but the *figure of Arthur* remains a legendary construct.
  *   **Your Point:** Museum labels matter. If a museum labels a sword "King Arthur's Sword," that is misinformation. If they label it "A 6th-Century Sword from the Period Associated with the Arthurian Legend," that is accurate.
  *   **The Adjudication:** A composite figure is **historically grounded legend**. The *events* may be historical (battles happened), the *person* may be historical (a warlord existed), but the *Identity* (King Arthur of Camelot) is legendary.

  ### 5. What are you both missing?

  You are talking past each other because you are arguing about **Truth**, while the discipline of History is actually about **Probability and Utility**.

  **A. History vs. The Past**
  *   **You** are thinking of "History" as *The Past* (everything that actually happened).
  *   **She** is thinking of "History" as *The Discipline* (the study of what can be verified).
  *   **The Synthesis:** A legend becomes "History" not when it *happens*, but when it becomes *actionable data* for historians. Until then, it is "Tradition." The transition isn't about the event changing; it's about our access to the event changing.

  **B. The Spectrum of Historicity**
  You are both looking for a bright line (Legend | History). That line does not exist. There is a spectrum:
  1.  **Pure Myth:** (Zeus throwing lightning).
  2.  **Legend with no evidence:** (King Arthur as a magical king).
  3.  **Legend with contextual evidence:** (Troy exists, war happened, details unknown).
  4.  **History with legendary accretion:** (George Washington chopped down a cherry tree—the man is real, the story is myth).
  5.  **Documented History:** (The Battle of Waterloo).

  **C. The Function of the Story**
  You are missing *why* the distinction matters.
  *   For a **Classicist** (your friend), the distinction matters for *methodology*. If you treat the *Iliad* as a news report, you do bad science.
  *   For a **Blogger/Writer** (you), the distinction matters for *meaning*. If Arthur is a composite, does his story lose its power? (No). If the Exodus didn't happen exactly as written, does it lose its cultural impact? (No).
  *   **The Insight:** A story can be "Historically False" but "Culturally True." The moment a legend starts shaping real political or social action (e.g., British monarchs claiming Arthurian lineage), the *legend itself* becomes a historical fact, even if the story is fake.

  ### Advice for your Blog Post

  Don't try to draw the line. Instead, write about **why we crave the line.**

  1.  **Use the "Fog" Metaphor:** Describe the past as a landscape covered in fog. Archaeology clears patches of fog (Troy exists). Texts clear other patches (Hittite records). But some areas remain foggy (Arthur). The landscape is there regardless of the fog, but we can only map what we can see.
  2.  **Reframe the Question:** Instead of "When does a legend become history?", ask "When does a legend become *usable* as history?"
  3.  **The Museum Test:** Use your museum point. It's the strongest practical application.
      *   *Label A:* "The Sword of King Arthur." (False)
      *   *Label B:* "A Bronze Age Sword." (True, but boring)
      *   *Label C:* "A Bronze Age Sword, later associated with the Arthurian Legend." (The Sweet Spot).
  4.  **Concede to your Friend (with a twist):** Acknowledge that without her "boring" standards of evidence, we can't do history. But argue that without your "philosophical" view, we lose the human truth of why these stories survive.

  **The Verdict:** You win on the philosophy of truth; she wins on the methodology of verification. The blog post should live in the tension between the two.
