prompt: |-
  hey I'm trying to write a blog post about when a legend stops being a legend and starts being history, and I got into a long argument with my friend who actuallly studies classics. We were using the Trojan War, King Arthur, and the Exodus as our three test cases. She said the line is straightforward: once there's solid archaeological evidence matching the narrative, you've crossed into history. I said that's way too quick, because we have archaeological evidence for a place called Troy, but that doesn't mean the specific war with the wooden horse actually happened. She adjusted and said okay, the real criterion is independant non-literary corroboration — like inscriptions or administrative records — which Arthur fails because we basically only have Geoffrey of Monmouth and later romances, and the Exodus is tricky because there's no direct archaeological proof for the biblical account but some Egyptologists point to certain references that might align. I pushed back and said that makes the standard depend on what materials happen to survive, which feels like an acident of preservation rather than a real philosophical boundary. She accused me of wanting a bright line where disciplines only have conventions. Then we got into Arthur being possibly a composite of post-Roman warlords, and I asked: if he's a composite, is that "historical" or "legendary"? She said that's a false dichotomy, but I think it matters for how museums should label exhibts. Anyway, we went in circles. Can you adjudicate this? Go point by point: is archaeological matching sufficient, is independant corroboration the right standard, does preservation bias undermine the whole project, and what's the deal with composite figures? Also tell us what we're both missing, because honestly we might be talking past each other.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** When does a legend become history?
      *   **Context:** A debate between the user (blogger) and their friend (Classics scholar).
      *   **Test Cases:** Trojan War, King Arthur, The Exodus.
      *   **Friend's Position:** History requires solid archaeological evidence matching the narrative, later refined to independent non-literary corroboration (inscriptions, records). Composite figures are not a false dichotomy.
      *   **User's Position:** Archaeological evidence (e.g., Troy exists) doesn't prove the specific narrative (Wooden Horse). Preservation bias makes "independent corroboration" an arbitrary standard based on what survived. Composite figures create a labeling problem for museums.
      *   **Task:** Adjudicate point-by-point (Archaeology, Corroboration, Preservation Bias, Composite Figures) and identify what both are missing/talking past each other.
      *   **Tone:** Balanced, insightful, academic but accessible (for a blog post), adjudicating without taking sides too heavily.

  2.  **Deconstruct the Arguments:**

      *   **Point 1: Is archaeological matching sufficient?**
          *   *Friend:* Yes, if it matches the narrative.
          *   *User:* No, Troy exists, but the *Iliad* isn't a news report.
          *   *Analysis:* The User is right here. Finding a city named Troy (Hisarlik) proves a place existed, not the specific events (Achilles, Hector, Wooden Horse). Schliemann's excitement vs. modern nuance.
          *   *Verdict:* Insufficient. It proves *setting*, not *plot*.

      *   **Point 2: Is independent non-literary corroboration the right standard?**
          *   *Friend:* Yes (inscriptions, admin records).
          *   *User:* No, that's survival bias.
          *   *Analysis:* This is the gold standard of historiography (epigraphy, contemporary records). However, the User is right that absence of evidence isn't evidence of absence. But for *history* as a discipline, contemporary documentation is the threshold.
          *   *Verdict:* It's the *methodological* standard, but not necessarily an *ontological* boundary. It defines what historians can *work with*, not necessarily what *happened*.

      *   **Point 3: Does preservation bias undermine the project?**
          *   *User:* Yes, it makes the line arbitrary.
          *   *Friend:* No, disciplines need conventions.
          *   *Analysis:* Both have a point. Preservation bias is real (papyrus rots, stone lasts). But history as a discipline *must* rely on evidence. If we count everything without evidence as history, it becomes myth. The "line" is epistemological (what can we know?), not ontological (what happened?).
          *   *Verdict:* It complicates the line, but doesn't erase it. The line is about *knowability*, not *reality*.

      *   **Point 4: Composite Figures (Arthur as multiple warlords)?**
          *   *User:* Is that historical or legendary?
          *   *Friend:* False dichotomy.
          *   *Analysis:* The Friend is technically right from a folklorist/historian view. "Arthur" is a cultural construct based on historical kernels. For a museum label, nuance is key ("Legend rooted in historical context" vs. "Biography").
          *   *Verdict:* It's a spectrum. The "Great Man" theory of history often fails.

      *   **What are they missing? (The Meta-Analysis)**
          *   *Definition of History:* Is history "what happened" or "what we can verify happened"?
          *   *Function of Legend:* Legends serve a purpose (identity, morality) regardless of truth.
          *   *The "Threshold" vs. "Spectrum":* They are arguing for a binary switch (Legend -> History) when it's actually a sliding scale of probability.
          *   *Audience/Purpose:* A blog post vs. an academic paper vs. a museum label have different needs for certainty.

  3.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the debate. It's a classic historiographical problem.
      *   *Section 1: Archaeological Matching.* Validate the User. Troy exists, but the *Iliad* is poetry. Distinguish between *setting* and *event*.
      *   *Section 2: Independent Corroboration.* Validate the Friend (methodologically) but the User (philosophically). It's the tool historians use, but it excludes true events that weren't recorded.
      *   *Section 3: Preservation Bias.* Validate the User. This is the strongest philosophical objection. The "Silence of the Sources."
      *   *Section 4: Composite Figures.* Validate the Friend. History isn't just biographies. It's social processes. "Arthur" is a brand applied to a period.
      *   *Section 5: What You're Missing.*
