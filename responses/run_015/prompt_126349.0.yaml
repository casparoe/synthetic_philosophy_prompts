answer: |-
  **Project Title:** Ghost Rules: When Habits Feel Like Laws
  **Applicant:** [Your Name]
  **Duration:** 3 Months

  **The Pitch**
  You know that specific panic when you realize you've tipped wrong in a New York diner, stepped out of line at a London tube station, or jaywalked in Berlin while locals watched? It's not illegal, and it's not exactly "evil," but you feel dirty. People look at you like you've violated something real. I'm calling these **Ghost Rules**. They aren't laws, and they aren't deep moral truths, but breaking them leaves a social stain.

  **The Core Question**
  Do Ghost Rules create actual moral obligations for outsiders, or is the anger locals feel just tribal defensiveness wearing a moral mask? Basically: If you don't know the rule, are you still wrong for breaking it?

  **Why the Usual Answers Don't Work**
  If you ask around, you get two boring answers.
  1.  *"When in Rome..."* This assumes the obligation exists just because you're there. It doesn't explain *why* a visitor owes loyalty to a local habit they didn't agree to.
  2.  *"Morals don't have borders."* This suggests tipping or queueing are universal rights/wrongs. But they aren't. You can be a good person and never tip, or never queue, depending on where you live.

  Both answers skip the messy middle ground where coordination meets judgment. I want to figure out what happens in that middle ground.

  **The Plan (3 Months)**
  My initial thought was to compare the three cases (US tipping, UK queueing, DE jaywalking) and sketch a framework for when a convention turns binding. Honestly, that's still the right move, but I need to keep it grounded so I don't disappear into a philosophy black hole.

  *   **Month 1: Collection.** I'm not doing dry research. I'm gathering stories. I'll talk to travelers who've been shamed and locals who did the shaming. I want the raw emotion: Why did it make you angry? Why did it make you feel guilty?
  *   **Month 2: Pattern Finding.** I'll look for the tipping point. Is it about harm? (Did someone lose money?) Is it about respect? (Did you signal you don't care?) Or is it purely about signaling "I belong here"?
  *   **Month 3: The Framework.** I'll draft a simple set of criteria—a "Ghost Rule Test"—to help people decide when a custom is just a habit and when it's actually binding on a guest.

  **What Success Looks Like**
  A successful outcome is a short, readable essay or zine (10-15 pages) that people actually use. If a traveler reads it and feels less anxious, or a local reads it and feels less judgmental, that's a win. I want to produce something that clarifies the social contract without using academic jargon.

  **What Failure Looks Like**
  Failure is getting stuck on definitions. If I spend three months arguing about the definition of "obligation" and produce nothing readable, I've failed. Also, if I conclude "it's all just vibes" without explaining *why* the vibes feel so heavy, that's a miss.

  **Reality Check on Scope**
  Three months is tiny. I cannot solve moral philosophy. I also can't travel to all three locations extensively on this stipend. I'll be relying on interviews and existing networks rather than full ethnographic fieldwork. There's a risk I generalize too much from anecdotal evidence. I need to stay disciplined: I'm not writing a book, I'm mapping a specific feeling. If the framework gets too complex, I'll cut it back to just the three case studies. The goal is clarity, not completeness.
