answer: |-
  **CHARTER OF CITIZENSHIP AND GOVERNANCE OF THE REPUBLIC OF COMMON NOTIONS**

  **Article I: Ontological Status of the State**
  1.1 The Republic is constituted by the collective power (*potentia*) of the multitude. Sovereignty is not transferred but expressed; the State is the multitude acting as one mind.
  1.2 Natural right is coextensive with natural power. An individual possesses right only insofar as they possess the capacity to exist and act. Consequently, the right of the State is defined by the sum of the power of its constituents.
  1.3 Because the democratic form aligns most closely with the natural condition of mankind, wherein no one submits to another except by common consent, this Charter establishes democracy as the sole rational mode of governance.

  **Article II: Qualifications for Citizenship**
  2.1 Citizenship is restricted to persons capable of forming adequate ideas and living under the guidance of reason.
  2.2 Persons led solely by affect—defined as those whose actions are determined by external causes rather than internal rationality—are classified as Wards of the State. Wards retain natural rights but lack civil standing.
  2.3 Eligibility for voting privileges requires passing the Annual Clarity Examination. Voting weight is assigned proportionally to the candidate's demonstrated capacity to distinguish true ideas from imaginary ones.
  2.4 Individuals exhibiting chronic passion-driven behavior, including excessive hope, fear, or indignation, shall be suspended from civic participation until restored to rational equilibrium by the Department of Affective Compliance.

  **Article III: Mechanisms of Common Consent**
  3.1 Legislation requires common consent, defined not as a majority count but as a convergence of rational interest.
  3.2 Ballots cast contrary to demonstrated self-preservation or collective utility shall be flagged for review. A vote driven by passion is considered null, as it expresses no valid right.
  3.3 The Senate of Adequate Ideas holds veto power over any decree that diminishes the collective power of the multitude. Decrees that weaken the State are logically invalid and unenforceable.
  3.4 Dissent is permitted only insofar as it arises from reason. Sedition, being an act of passion that reduces one's own power, is categorized as a medical incompetence rather than a political crime.

  **Article IV: Territorial Integrity and Exit**
  4.1 Secession is recognized as a logical contradiction. Since individual natural right is coextensive with collective power, an individual cannot possess the right to exit the structure that constitutes their power.
  4.2 Applications for emigration shall be denied on the grounds that the applicant lacks the power to effectuate the move. If the applicant possesses the power to leave, they necessarily possess the right to stay; if they lack the power, they lack the right to leave.
  4.3 Attempts to unauthorized exit will be treated as episodes of temporary insanity resulting from inadequate ideas regarding the nature of bondage and freedom.
  4.4 The borders of the Republic are coextensive with the limits of rational cooperation. To step outside is to enter the state of nature, wherein life is solitary and devoid of right. The State discourages this regression for the safety of the Ward.

  **Article V: Amendments**
  5.1 This Charter may be amended only by a consensus that increases the collective power of the multitude.
  5.2 Any amendment reducing the rational capacity of the citizenry is self-negating and void ab initio.

  ***

  **Author's Note**

  Spinoza's democratic theory posits democracy as the most natural regime because it minimizes the alienation of individual right. Settled interpretations agree that he equates right with power (*potentia*) and views passions as forms of bondage. However, scholars contest whether his exclusions of women and servants from citizenship reflect historical prejudice or a consistent application of rational criteria. Additionally, debate persists regarding whether his mature work favors direct democracy or a rational aristocracy. This Charter literalizes the equation of right and power to absurdity, particularly in Article IV. The "Clarity Examination" is an anachronistic bureaucratic extrapolation of Spinoza's epistemic hierarchy, not a specific political proposal found in his texts.
