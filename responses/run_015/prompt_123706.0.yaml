answer: |-
  # SEMINAR HANDOUT: DO NUMBERS COUNT IN RESCUE?
  **Decision Tree & Logical Space**

  **Instructions:** Navigate the tree by answering the concrete cases at each node. Do not worry about the name of the view you are approaching; answer based on your moral intuition about the specific scenario.

  ---

  ### THE DECISION TREE

  **NODE 1: The Bare Numbers Case**
  *Case:* You can save **5 strangers** or **1 stranger** from death. All have equal claims, equal stakes, and no special relationships.
  *Question:* Is the fact that *5 > 1* **by itself** a moral reason to save the 5?
  *   **NO** → Go to **Leaf A**.
  *   **YES** → Go to **Node 2**.

  **NODE 2: The Obligation Case**
  *Case:* Same as Node 1 (5 vs. 1, equal stakes).
  *Question:* Does the greater number make saving the 5 **morally required**, or merely **permissible**?
  *   **MERELY PERMISSIBLE** → Go to **Node 3**.
  *   **REQUIRED** → Go to **Node 4**.

  **NODE 3: The Tie-Breaking Procedure**
  *Case:* Same as Node 1. You are not required to save the 5.
  *Question:* To decide, must you give each **individual** an equal chance (1 ticket each, weighted lottery), or may you flip a coin between the **groups** (50% chance for the 5, 50% for the 1)?
  *   **INDIVIDUAL CHANCE (Weighted)** → Go to **Leaf B**.
  *   **GROUP CHANCE (Unweighted)** → Go to **Leaf C**.

  **NODE 4: The Threshold Case**
  *Case:* Compare **2 vs. 1** (Death) against **1,000,000 vs. 1** (Death).
  *Question:* Do numbers mandate saving the many in *both* cases, or only when the ratio is **vastly disproportionate**?
  *   **ONLY WHEN VAST** → Go to **Leaf D**.
  *   **EVEN 2 VS. 1** → Go to **Node 5**.

  **NODE 5: The Stakes Aggregation Case**
  *Case:* You can save **1 person from Death** or **1,000,000 people from a Broken Arm**.
  *Question:* Do many trivial harms aggregate to outweigh one catastrophic loss?
  *   **NO** → Go to **Leaf E**.
  *   **YES** → Go to **Node 6**.

  **NODE 6: The Distribution Case**
  *Case:* You can provide **100 units of benefit to 1 person** or **1 unit of benefit to 100 people** (Total benefit is equal).
  *Question:* Is the moral value of these outcomes **identical**?
  *   **NO** (Intra-personal aggregation differs from Inter-personal) → Go to **Leaf F**.
  *   **YES** → Go to **Node 7**.

  **NODE 7: The Means vs. Side-Effect Case**
  *Case:* You can save **5 people** only by **harming 1 person** (e.g., diverting a trolley onto a side track where he stands).
  *Question:* Does the fact that the 1 is harmed as a **side effect** (not a means) permit counting numbers where otherwise you could not?
  *   **YES** (Numbers count only here) → Go to **Leaf G**.
  *   **NO** (Numbers count regardless) → Go to **Leaf H**.

  ---

  ### THE LEAVES (POSITIONS)

  *   **Leaf A: No-Numbers View (Taurek)**
      *   *Position:* Numbers never count intrinsically. Each individual's claim is absolute against the group.
      *   *Verdict:* Flip a coin between groups (50/50).
  *   **Leaf B: Equal Chances (Weighted Lottery)**
      *   *Position:* Numbers count as reasons, but do not create strict obligations in equal-claim cases.
      *   *Verdict:* Weighted lottery (1 ticket per person). Saving the 5 is likely but not required.
  *   **Leaf C: Permissive Aggregation (May but Need Not)**
      *   *Position:* You may save the many, but are not required to. No specific lottery procedure mandated.
      *   *Verdict:* Save the 5 if you like, or flip a coin. Both are permissible.
  *   **Leaf D: Threshold View (Moderate Deontology)**
      *   *Position:* Numbers count only past a certain ratio threshold.
      *   *Verdict:* Save the 1 in 2-vs-1; Save the 1,000,000 in the large case.
  *   **Leaf E: Non-Aggregation (Contractualist/Scanlon)**
      *   *Position:* Small claims cannot aggregate to override a stronger individual claim.
      *   *Verdict:* Save the 1 from Death, even if millions lose an arm.
  *   **Leaf F: Person-Affecting / Prioritarian (Barely Defended)**
      *   *Position:* Benefits to a single person weigh differently than spread benefits.
      *   *Verdict:* Rarely applied to rescue; mostly theoretical.
  *   **Leaf G: Double Effect Aggregation (Barely Defended)**
      *   *Position:* Numbers count only when harm is a side-effect, not a means.
      *   *Verdict:* Divert trolley (save 5), but do not push the man (save 1).
  *   **Leaf H: Strict Requirement (Utilitarian/Strict Aggregation)**
      *   *Position:* Maximize the good. Numbers always count and create obligations.
      *   *Verdict:* Always save the many, regardless of stakes distribution or means.

  ---

  ### KNOWN AMBIGUITIES & COLLISIONS

  **1. The No-Numbers vs. Equal Chances Collision**
  This tree separates **Leaf A (Taurek)** and **Leaf B (Equal Chances)** at **Node 3** (Procedure). However, if the seminar discussion focuses only on *obligation* (Node 2), these views collide. Both deny that saving the 5 is *required*. Without asking about the *procedure* for breaking ties (weighted vs. unweighted lottery), these two distinct views are indistinguishable regarding duty. Be aware that Taurek's "equal chance per person" results in a 50% group lottery, while Equal Chances results in a weighted lottery; they yield different probabilities but the same deontic status (permissible, not required).

  **2. The Threshold View Stability**
  **Leaf D** represents a view many find intuitive but philosophers find difficult to ground. See Instructor Notes for analysis on whether this position is theoretically stable or merely arbitrary.

  ***

  ## INSTRUCTOR'S COMMENTARY (NOT FOR DISTRIBUTION)

  **On the Stability of the Threshold View (Leaf D)**
  You asked whether the Threshold View (numbers count only past a ratio) is really empty.
  *   **Is it Empty/Incoherent?** No. It is not logically incoherent. It represents a form of "moderate deontology" or "satisficing consequentialism." It posits a constraint that is overrideable only by sufficiently urgent competing values.
  *   **Is it Unattractive?** Yes, primarily due to the **Arbitrariness Objection**. If numbers count at 100:1, why not 99:1? Defenders usually rely on "vagueness" (Sorites paradox) to argue that sharp boundaries aren't required for moral concepts, but this leaves the view vulnerable to charges of ad-hocery. It is a defensible position, but one that requires robust meta-ethical defense against the charge of arbitrariness.

  **On the No-Numbers vs. Equal Chances Collision**
  You correctly anticipated a collision.
  *   **Taurek (Leaf A):** Argues for a 50/50 coin flip *between groups*. (Each individual has a 50% chance of being saved).
  *   **Equal Chances (Leaf B):** Argues for a weighted lottery *between individuals*. (Each individual has a 1/6 chance; the group has a 5/6 chance).
  *   **The Collision:** If your seminar discussion focuses strictly on **obligation** (Node 2), both views land on "Not Required." They are extensionally equivalent regarding duty. They are only intensionally distinct regarding *procedure*. If you do not press students on Node 3, you cannot distinguish a Taurekian from a Weighted-Lottery theorist. The handout flags this in the "Known Ambiguities" section so you can choose whether to force the distinction during discussion.
