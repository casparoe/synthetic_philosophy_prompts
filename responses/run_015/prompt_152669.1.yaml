answer: |-
  ### PREAMBLE: THE TWO QUESTIONS THAT MATTER

  Most oversight discussions fight over tactics (debate vs. decomposition) before settling strategy. For a regulator, two prior questions determine which tactics are even viable. First: **Verifiability.** If the model causes harm, can a court prove causality later? If yes, traditional liability works; if no, you need preventative technical oversight. Second: **Objectivity.** Is safety a matter of technical fact (e.g., "did the code crash?") or political choice (e.g., "should this code exist?")? If it's fact, expert protocols work; if it's choice, no technical protocol substitutes for democratic consent.

  Everything else—whether models compete, decompose, or report—is secondary. If you can sue later, don't bother with complex oversight. If the issue is power, don't pretend a technical check solves it. This tree forces you to answer those two questions first, then assigns the oversight strategy that actually fits the legal reality.

  ***

  ### REGULATORY DECISION TREE: AUTONOMOUS ENGINEERING REQUEST

  **START:** We grant the model outperforms human review in real-time.

  **1. IF HARM OCCURS, CAN A COURT PROVE CAUSALITY LATER?**
  *   **YES → EX-POST ACCOUNTABILITY REGIME**
      *   **Leaf: Liability & Auditing**
          *   *Belief:* The threat of lawsuit and after-the-fact audit ensures sufficient care.
          *   *Awkward Commitment:* You must accept some accidents will happen and be compensated, not prevented.
          *   *Inability:* Cannot prevent catastrophic or irreversible harms where compensation is meaningless.

  *   **NO → EX-ANTE OVERSIGHT REQUIRED**
      *   **2. IS SAFETY A TECHNICAL FACT OR A POLITICAL CHOICE?**
          *   **POLITICAL CHOICE → DEMOCRATIC LEGITIMACY**
              *   **Leaf: Public Contestability**
                  *   *Belief:* Affected communities must have the power to halt work they deem unacceptable.
                  *   *Awkward Commitment:* You must accept delays and conflict as features, not bugs, of the process.
                  *   *Inability:* Does not prevent accidental technical failures, only illegitimate uses of power.

          *   **TECHNICAL FACT → PREVENTATIVE OVERSIGHT**
              *   **3. CAN THE WORK BE SPLIT INTO INDEPENDENT STEPS?**
                  *   **YES → HIERARCHICAL CHECKS**
                      *   **Leaf: Recursive Decomposition**
                          *   *Belief:* Hard tasks are just sums of smaller tasks humans can verify.
                          *   *Awkward Commitment:* You must mandate significant latency and cost increases for every task.
                          *   *Inability:* Fails to catch holistic risks that only appear when sub-tasks are combined.
                      *   **Leaf: Monitoring + Control**
                          *   *Belief:* A weaker trusted model can spot deviance in a stronger untrusted one in real-time.
                          *   *Awkward Commitment:* You must grant the regulator direct kill-switch authority over infrastructure.
                          *   *Inability:* Cannot catch subtle corruption where the model behaves perfectly until triggered.

                  *   **NO → ADVERSARIAL VERIFICATION**
                      *   **Leaf: Capability Limits**
                          *   *Belief:* Risk scales monotonically with ability, so capping ability caps risk.
                          *   *Awkward Commitment:* You must order the destruction or throttling of valuable general-purpose tools.
                          *   *Inability:* Does not verify safety at all; it simply avoids the risk by reducing utility.
                      *   **Leaf: Eliciting Self-Report**
                          *   *Belief:* The model can be technically constrained to report its own intent honestly.
                          *   *Awkward Commitment:* You must rely on the lab's internal measurement tools without independent verification.
                          *   *Inability:* Useless if the model is deceptive or the lab is dishonest about the metrics.
                      *   **Leaf: Adversarial Debate** [†]
                          *   *Belief:* Two competing models will reveal errors the human judge cannot see alone.
                          *   *Awkward Commitment:* You must require labs to maintain duplicate competing systems for every task.
                          *   *Inability:* Cannot resolve questions where there is no objective ground truth to judge against.
                      *   **Leaf: Prediction Markets** [†]
                          *   *Belief:* Market prices will aggregate hidden information about safety risks better than experts.
                          *   *Awkward Commitment:* You must allow financial speculation on system failure within the lab's governance.
                          *   *Inability:* Collapses into Adversarial Debate when liquidity is low or manipulation is possible.

  ***

  ### UNOCCUPIED & IMPOSSIBLE CELLS

  *   **Verifiable + Political Choice + Technical Fix:** *Incoherent.* You cannot solve a legitimacy problem (who decides?) with a verification protocol (is it true?).
  *   **Unverifiable + Political Choice + Technical Fix:** *Unattractive.* Using technical oversight to mask political decisions creates a false sense of security; this space is occupied by **Public Contestability** instead.
  *   **Unverifiable + Fact + Non-Splittable + High Trust:** *Unexplored.* There is no strategy here besides **Capability Limits**; relying on trust without verification or decomposition is legally indefensible for a regulator.

  ### COLLAPSES & AMBIGUITIES

  *   **[†] Debate vs. Market-Making:** These are operationally identical for a regulator. Both rely on adversarial information revelation to find truth where direct verification fails. Requiring a "market" vs. a "debate" is a distinction in mechanism, not oversight strategy; both demand competing agents and a judge. This is a **real fact** about the proposals, not a bug in the tree.
  *   **Decomposition vs. Monitoring:** These are distinct. Decomposition is static (checking steps); Monitoring is dynamic (watching behavior). However, both require the assumption that the "checker" is trustworthy, which is the single point of failure for both.

  ***

  ### HOW TO USE THIS IN TEN MINUTES

  1.  **Vote on the Branches:** Have the group vote yes/no on the three bolded questions; do not discuss strategies until the path is clear.
  2.  **Read the Leaf:** Once you land on a leaf, read the "Awkward Commitment" aloud to ensure the room accepts the political cost.
  3.  **Sign or Stop:** If the group cannot accept the commitment or the inability, the default verdict is "Do Not Sign Off."
