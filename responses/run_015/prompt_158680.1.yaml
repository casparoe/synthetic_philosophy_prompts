answer: |-
  **Project Title:** Artefactual Deception and the Normative Boundaries of Lying

  **Research Question:**
  Does the moral distinction between lying and misleading collapse in cases of non-linguistic environmental manipulation, and if so, does this indicate that standard accounts conflate intrinsic wrongness with ease of criticisability?

  **Background and Theoretical Gap**
  The contemporary debate regarding the moral significance of the lying/misleading distinction generally pivots on two competing accounts. The first, the **Commitment Account**, argues that lying is distinctively worse because the agent explicitly warrants the truth of their assertion, inviting a specific reliance that the misleader avoids. The second, the **Deniability Account**, argues that misleading is often morally problematic *because* it allows the agent to evade responsibility for the false belief they have cultivated, exploiting cooperative norms while retaining plausible deniability.

  Both accounts rely heavily on speech act theory. The Commitment Account requires an assertion to function; the Deniability Account typically analyses cases of conversational implicature or technically true statements. Consequently, neither framework is stress-tested against **artefactual deception**: cases where an agent manipulates physical evidence or environmental context to induce false belief without issuing any representation (e.g., cropping a photograph, staging a scene, or selectively deleting digital records). In these cases, there is no assertion to warrant, rendering the Commitment Account inert. Conversely, the Deniability Account predicts these cases should be morally egregious, yet intuitively they often align more closely with the severity of lying than standard misleading. This project posits that existing literature has reached an impasse because it fails to distinguish between the *wrongness* of the deception and the *blameworthiness* of the agent. Artefactual cases provide the necessary leverage to separate these variables.

  **Methodology and Work Plan**
  The project will employ a method of structured conceptual analysis grounded in a taxonomy of deception vehicles. This approach is selected over two viable alternatives. First, it avoids unsystematic intuition pumping, which risks selecting cases that merely confirm pre-existing biases. Second, it rejects empirical methods (e.g., experimental philosophy surveys), as ordinary judgments track psychological disapproval rather than normative wrongness. The goal is to determine what *ought* to be the case, not what people *feel* is the case.

  The nine-month timeline is structured as follows:
  *   **Months 1–3 (Taxonomy & Framework):** Construct a rigorous taxonomy of artefactual deception, distinguishing between *staging* (creating false evidence), *concealment* (hiding true evidence), and *allowance* (permitting false inference). Simultaneously, formalize the Commitment and Deniability accounts to identify their necessary conditions.
      *   *Risk Mitigation:* By Month 3, if artefactual deception is shown to be normatively isomorphic to linguistic misleading without generating theoretical tension, the project will be terminated or radically reframed, as the central hypothesis would be falsified.
  *   **Months 4–6 (Argument Testing):** Apply the taxonomy to the standard accounts. The core argument will test whether the Commitment Account can be extended to non-linguistic acts without losing its definition, and whether the Deniability Account successfully captures the wrongness of artefactual cases where deniability is high but intuition suggests high wrongness.
  *   **Months 7–9 (Synthesis & Writing):** Develop the distinction between wrongness and blameworthiness. If the standard distinctions collapse, the thesis will argue that the moral weight lies in the manipulation of the epistemic environment itself, regardless of speech acts. Final drafting and revision of the 12,000-word dissertation.

  **Deliverables and Possible Conclusions**
  The primary deliverable is a 12,000-word thesis demonstrating whether the lying/misleading distinction is robust across modalities. There are three viable outcomes:
  1.  **Collapse:** The distinction dissolves in artefactual cases, suggesting the linguistic difference was never morally fundamental.
  2.  **Regrounding:** The distinction holds, but must be redefined based on epistemic manipulation rather than speech acts.
  3.  **Displacement:** The distinction remains valid but is revealed to track *blameworthiness* (how easy it is to hold the agent accountable) rather than *wrongness* (the intrinsic harm of the deception).

  The deciding factor between these conclusions will be the consistency of moral verdicts across paired cases (linguistic vs. artefactual) where intent and outcome are controlled. If verdicts diverge solely based on the availability of deniability, Outcome 3 is supported.

  **Scope and Limitations**
  Given the 12,000-word limit and nine-month timeframe, the scope must be strictly constrained. The project will not offer a defense of a broader normative framework (e.g., Kantian vs. Consequentialist); it will treat the wrongness of deception as a provisional premise to isolate the specific lying/misleading variable. General histories of the debate will be minimized in favor of direct engagement with the structural logic of the Commitment and Deniability accounts. Furthermore, the taxonomy of artefactual deception will be limited to visual and digital media examples sufficient to test the hypothesis, rather than an exhaustive catalog of non-linguistic communication. This ensures the argument remains focused on the moral philosophy of deception rather than drifting into media theory or epistemology.
