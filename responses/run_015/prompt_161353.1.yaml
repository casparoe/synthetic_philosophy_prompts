      *   *Neuroscience:* Pain involves the "pain matrix" (S1, S2, Insula, ACC). Asymbolia usually involves lesions to the insula or cingulate cortex.
      *   *Nuance:* The dissociation exists, but is the "signal" truly functionally equivalent? Does the agent *still* pull their hand off the stove?
      *   *Key Insight:* The "reflexive" withdrawal often remains (spinal/brainstem), but the *learning* and *priority* might be compromised. If pain doesn't hurt, do you learn to avoid the stove next time? Do you prioritise treating the injury?

