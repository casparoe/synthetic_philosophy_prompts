      *   *Developmental Psychology:* Infants/animals seem to have mental states before full linguistic socialization.
      *   *Neuroscience:* Neural correlates of pain/experience exist independently of social verification.
      *   *Private Error Correction:* Can't I correct myself without asking others? (e.g., realizing I misremembered a dream).
      *   *Radical Solitude:* What about a Robinson Crusoe figure who develops a diary?
