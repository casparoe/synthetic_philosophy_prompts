          *   Skeptic: Cooperation collapses to standard PD levels without full transparency.
          *   Test: LLM Tournament with Hidden Prompts/Subroutines.
          *   Prediction: Optimist expects moderate cooperation; Skeptic expects near-zero (defection).
      *   *Crux 3: Verbal/Definition of Rationality.*
