      *   **Skeptic:** The program game is just a meta-game. Choosing a program is like choosing a commitment device. If cooperation happens, it's because the *program choice* game has a cooperative equilibrium, not because the PD itself changed. It relies on conventions (how we write code) or reciprocity (I cooperate if you cooperate). It's fragile to implementation details (obfuscation).

  3.  **Drafting the Agreed Claims (Section 1):**
