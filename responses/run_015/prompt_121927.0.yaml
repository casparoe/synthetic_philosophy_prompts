answer: |-
  # Teaching Plan: Tranquilism as Axiology (50 Minutes)

  ## 0:00–10:00 — The Foundational Distinction (Dependency Order)
  **Goal:** Establish the conceptual separation between *Relief* and *Tranquility* before defining value.
  **Action:** Begin by drawing a horizontal line on the board representing "Neutral Baseline."
  1.  **Define Relief:** Mark a dip below the line (suffering/craving) and a return to the line. Label this "Relief." Explain that relief is *parasitic*; it logically requires the prior existence of a negative state. It is the cessation of pain, not a positive good.
  2.  **Define Tranquility:** Mark a point on the line that never dipped below. Label this "Tranquility." Explain this as the *absence of craving that never arose*. It is not the cessation of pain, but the non-occurrence of disturbance.
  3.  **Head Off Misconception 1 (Pessimism/Depression):** Anticipate the claim that this describes depression. Correct immediately: Depression is a state of suffering (below the line). Tranquility is the neutral line. Do not let them conflate "low arousal" with "negative valence."
  **Script Note:** "We are not discussing how to feel better when sick; we are discussing what makes a life good when healthy."

  ## 10:00–25:00 — The Carrying Case (Comparative Lives)
  **Goal:** Use a concrete pair of lives to test the distinction without moralizing or pathologizing.
  **The Case:**
  *   **Life A (The Turnaround CEO):** High-functioning. Constantly faces corporate crises (craving/stress). Solves them successfully (relief/euphoria). Never experiences a week without a urgent problem to solve. High peaks of relief, frequent valleys of stress. Never tranquil.
  *   **Life B (The Tenured Conservator):** High-functioning. Maintains a stable archive. Work is predictable. No crises arise. No urgent cravings to fix things. No massive peaks of relief, no valleys of stress. Consistently tranquil.
  **Action:** Ask the group to evaluate the intrinsic value of these lives *excluding* external social contribution.
  **Head Off Misconception 2 (Hedonistic Collapse):** Scientists will argue the CEO's relief feels like pleasure, so it counts as positive hedonism. Correct directly: The *feeling* may be similar, but the *axiological source* differs. If the CEO's relief is only valuable because it removes stress, it is instrumentally good, not intrinsically good.
  **Head Off Misconception 3 (Denies All Pleasure):** Let them voice the objection: "So joy is worthless?" Correct: Joy is instrumentally valuable (it bonds groups, distracts from pain), but not *intrinsically* valuable. It adds no weight to the scale of ultimate good if suffering is already zero.

  ## 25:00–40:00 — Managing the Sequence of Objections
  **Goal:** Navigate the remaining misconceptions in order of severity.
  1.  **Pessimism (Already addressed):** Reiterate if needed. Tranquilism is not about suffering more; it's about valuing the absence of it.
  2.  **Hedonistic Collapse (Already addressed):** Reinforce that "feeling good" about pain stopping is not the same as "goodness" existing independently.
  3.  **Denial of Pleasure (Already addressed):** Clarify instrumental vs. intrinsic value.
  4.  **Prepare for the Deep Cut:** Signal that there is one logical conclusion remaining that makes people uncomfortable.

  ## 40:00–45:00 — The Deepest Misconception (Existential Implication)
  **Goal:** Address the implication regarding suicide/non-existence without endorsing it.
  **Misconception:** "If only the absence of suffering is good, then non-existence (where there is no suffering) is better than existence."
  **Timing:** Save this for the end. It is the deepest because it challenges the premise of living itself, not just the definition of value.
  **Strategy:** Do not solve it definitively. Frame it as the "Non-Identity Problem." Explain that tranquilism values the absence of suffering *for a subject*. If there is no subject, there is no value to be had. The goal is to minimize craving *within* existence, not to eliminate existence to minimize craving.
  **Action:** Allow them to voice the suicide objection aloud. Validate the logic, then constrain the scope: "Tranquilism is a theory of value for existing beings, not a prescription for non-existence."

  ## 45:00–50:00 — Check Question & Wrap-Up
  **Goal:** Verify conceptual grasp, not personal agreement.
  **Check Question:** "If Life A has zero suffering and zero joy, and Life B has zero suffering and high joy, does tranquilism claim Life B is intrinsically better than Life A?"
  **Correct Answer:** No. (If they say Yes, they have collapsed back into positive hedonism).
  **Closing:** Reiterate that understanding the asymmetry is the goal, not adopting the lifestyle.

  ## Explicit Omissions
  **Refuse to Explain:** The clinical neuroscience of anhedonia or therapeutic applications.
  **Reason:** Your friend already committed the category error of conflating a philosophical axiology with a pathological state. Introducing neuroscience invites the group to treat tranquilism as a symptom of dopamine dysfunction rather than a normative claim about value. Keeping it philosophical protects the conceptual distinction between *is* (neural state) and *ought* (value).

