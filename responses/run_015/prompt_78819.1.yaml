      *   *The Triviality Results (Lewis 1976, et al.):* If conditionals have truth conditions (are propositions) and the Equation holds, probability spaces collapse (are trivial).
      *   *The Options:*
          1.  Keep Truth Conditions, Drop Equation (Stalnaker, Jackson).
          2.  Keep Equation, Drop Truth Conditions (Adams, Edgington, Suppes).
          3.  Context Dependence/Restriction (Kratzer, Gillies).
      *   *Embedding Problem:* If no truth conditions, how do they embed in negations, disjunctions, etc.? ("If A then C, and if B then D").
