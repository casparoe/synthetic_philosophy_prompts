answer: |-
  # The Dirty Hands Decision Tree

  **Starting Point:** You have read **Case A** (the ticking bomb scenario) and agreed that the Head of Government *had to* authorise the interrogation. There was no practical alternative to prevent the deaths.

  **Node 1 (Distinction 2):** In **Case A**, you accept the act was necessary. Was the act **morally forbidden** despite this necessity, or **morally permitted** because of it?
  *   **Forbidden:** Go to Node 2.
  *   **Permitted:** Go to Node 7.

  **Node 2 (Distinction 1):** If the act was forbidden, what generated the necessity to do it? Was it a demand of **human morality** (e.g., save lives) or a demand of **political office** (e.g., preserve the state)?
  *   **Human Morality:** Go to Node 3.
  *   **Political Office:** Go to Node 6.

  **Node 3 (Distinction 5):** Consider **Case E** (same act, but done to save her career). If the motive was self-preservation rather than public safety, does the **moral verdict change**?
  *   **Yes:** It becomes ordinary corruption. → **Leaf 1: Absolutist.** *Commitment: The moral prohibition holds regardless of good intentions; one must resign rather than transgress.*
  *   **No:** It remains the same dilemma. → Go to Node 4.

  **Node 4 (Distinction 3):** Consider **Case D** (open legislation vs. Case A secrecy). If the act were done openly with public support, would the **moral conflict vanish**?
  *   **Yes:** Publicity resolves it. → **Leaf 2: Unnamed.** *Commitment: Democratic authorization converts moral prohibitions into permissions.*
  *   **No:** The conflict persists. → Go to Node 5.

  **Node 5 (Distinction 6):** Consider **Case B** (resignation leads to worse outcomes). If she stayed because a replacement would do more harm, does this **excuse** the wrong or merely **explain** it?
  *   **Excuse:** It mitigates blame. → **Leaf 3: Conflict Real/Unresolved.** *Commitment: The agent is guilty but must act, carrying the stain to remain faithful to the public.*
  *   **Explain:** It offers no mitigation. → **Leaf 4: Unnamed.** *Commitment: Moral luck is irrelevant; the agent is fully culpable regardless of consequences.*

  **Node 6 (Distinction 4):** Consider **Case C** (committee vote causing harm). If a committee votes for harm, is the **wrongness held** by the individual members or the **institution**?
  *   **Members:** → **Leaf 5: Personal Taint.** *Commitment: Office-holders cannot hide behind collective procedure to escape personal taint.*
  *   **Institution:** → **Leaf 6: Wrongness to Office.** *Commitment: The state absorbs the sin, leaving the individual's hands clean.*

  **Node 7 (Distinction 3):** Consider **Case D** (open legislation vs. Case A secrecy). Does the justification for the act require **secrecy** to be effective, or is **public defense** compatible with its rightness?
  *   **Requires Secrecy:** Go to Node 8.
  *   **Compatible with Public:** Go to Node 9.

  **Node 8 (Distinction 1):** For secret acts that are permitted: Does the office create a **separate morality** for this act, or is it just **ordinary morality** applied to states?
  *   **Separate Morality:** → **Leaf 7: State Necessity.** *Commitment: Political ethics operates on a plane where common prohibitions do not apply.*
  *   **Ordinary Morality:** → **Leaf 8: Monist Consequentialist.** *Commitment: There is no special political sphere; maximizing good is the only rule.*

  **Node 9 (Distinction 1):** For public acts that are permitted: Does the office create a **separate morality** for this act, or is it just **ordinary morality** applied to states?
  *   **Separate Morality:** → **Leaf 9: Public Necessity.** *Commitment: The state may openly claim exceptions to common morality without deception.*
  *   **Ordinary Morality:** → **Leaf 10: Act Not Really Wrong.** *Commitment: Justified acts need not be hidden, even if they look like violations.*

  ***

  ### Structural Analysis

  **1. The Unoccupied Logical Space**
  The tree makes available the combination: **Act Forbidden + Source is Political Office + Resignation Required.** This path would suggest that while the state demands the act, the individual must perform it and then immediately quit to purge the guilt. This position is largely **unexplored**. It is not incoherent, but it is unattractive to realists (who say stay and rule) and absolutists (who say don't do it at all). It demands the utility of the dirty act without allowing the agent to retain the power to clean up the mess.

  **2. Indistinguishable Leaves**
  The tree cannot practically separate **Leaf 7 (State Necessity)** and **Leaf 8 (Monist Consequentialist)** in a seminar discussion. Both conclude the act is morally permitted and secret. The distinction is purely theoretical (one posits a distinct political morality, the posits a single universal calculus). To separate them, one would need to ask a question about *hypothetical cases* where the political good conflicts with the universal good, which falls outside the scope of this specific case-based tree.

  **3. Load-Bearing Distinctions**
  The two load-bearing distinctions are **Node 1 (Ought/Wrong Compatibility)** and **Node 2 (Source of Requirement)**. Flipping a student's answer on Node 1 moves them from the entire "Forbidden" hemisphere (leaves 1–6) to the "Permitted" hemisphere (leaves 7–10), fundamentally altering whether they see ethics as tragic or solvable. Flipping Node 2 determines whether the conflict is internal to morality itself (Human Morality) or a clash between morality and role (Political Office). This suggests the real disagreement in political ethics lies not in the calculation of consequences, but in whether the political role generates independent moral forces or merely channels existing ones.
