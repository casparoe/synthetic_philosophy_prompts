  | Lexical Threshold (Aggregate) | Lexicographic MOO with Sum/Max aggregation; CMDP with hard budget | clean | Aggregation method (sum vs max) must be explicitly chosen, whereas the ethical view may be ambiguous. |
  | Commensurability (One-scale) | Linear Scalarization ($w_1 S + w_2 H$); Lagrangian Relaxation | clean | None; this is exactly what scalarization assumes. |
  | Commensurability (Two-currency) | CMDP with Barrier Functions / Safety Shields (no Lagrangian) | distorted | Standard solvers often default to Lagrangian methods which secretly reintroduce scalarization via $\lambda$. |
  | Scale Asymmetry | Asymmetric Reward/Cost Codomains; Potential-Based Reward Shaping | distorted | RL defaults to symmetric or unbounded spaces; "neutral zero" requires explicit shaping not inherent to the math. |
  | Urgency Asymmetry | Interrupt Handlers / Emergency Policies / Priority Levels | inexpressible | The phenomenological "force" of pain is reduced to a boolean trigger; the "why" is not captured by the mechanism. |

