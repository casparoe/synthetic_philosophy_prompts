answer: |-
  ### Translation of Ethical Claims into DRL Vocabulary

  **1. Negative Utilitarianism**
  In your vocabulary, this is a **Single-Objective MDP** where the reward function $r(s,a)$ is defined strictly as the negative of suffering, $r = -S(s)$. Happiness $H(s)$ does not appear in the reward signal. Instead, happiness exists solely as a feature of the state space or transition dynamics $P(s'|s,a)$; it is optimized only insofar as states with higher $H$ probabilistically lead to lower cumulative discounted $S$. This distinguishes it from a Multi-Objective setup where $H$ would have its own weight. The instrumental value of happiness is captured by its correlation with future suffering reduction in the dynamics model, not by a term in the objective function.

  **2. Lexical Threshold (Intensity Reading)**
  This maps to **Lexicographic Multi-Objective Optimization** with a **Hard Constraint** trigger. You treat "individual suffering above threshold $\tau$" as the primary objective (or constraint violation cost) and all other goods as secondary. The optimization proceeds in stages: first, minimize the measure of individuals where $S_i > \tau$ (e.g., minimize $\sum_i \max(0, S_i - \tau)$); only once this term is zero (or below a tolerance $\epsilon$) does the optimizer gradient descend on the secondary objective (happiness). The "until" clause implies a **Non-Stationary Objective** or a **Curriculum** where the loss function switches once the constraint is satisfied.

  **3. Lexical Threshold (Aggregate Reading)**
  This is also **Lexicographic Multi-Objective Optimization**, but the aggregation operator changes. Instead of tracking individual violations, the primary objective is the **Summed Cost** or **Max Cost** over all agents/states: minimize $\sum_i S_i$ (or $\max_i S_i$) subject to it being above $\tau$. The secondary objective is optimized only conditional on the aggregate suffering metric falling below $\tau$. In a **Constrained MDP (CMDP)** formulation, this looks like a hard budget constraint on total suffering cost $C_{total} \leq \tau$ that must be satisfied before any reward $R$ (happiness) is accrued.

  **4. Commensurability (One-Scale Picture)**
  This corresponds to **Linear Scalarization** of the reward function. You define a single reward signal $r = w_1 \cdot (-S) + w_2 \cdot H$. This explicitly assumes a common scale where a unit of $S$ can be traded for a unit of $H$ via the weights $w$. In **Lagrangian CMDP** methods, this is implicit: the dual variable $\lambda$ acts as the exchange rate between the constraint (suffering) and the objective (happiness), effectively forcing commensurability even if you intended them to be separate.

  **5. Commensurability (Two-Currency Picture)**
  This requires **Hard Constraints** or **Safety Shields** rather than Lagrangian relaxation. You treat suffering as a cost function $C(s,a)$ that must never exceed a budget $d$, and happiness as the reward $R(s,a)$. Crucially, to avoid smuggling commensurability, you cannot use a standard Lagrangian multiplier which creates a shadow price; you must use a **Barrier Function** or a **Projection Layer** that rejects any policy update violating $C \leq d$ regardless of the gain in $R$. This enforces structural priority rather than magnitude trade-offs.

  **6. Scale Asymmetry**
  This maps to **Asymmetric Codomains** for your reward and cost functions. Suffering is a cost $C \in [0, \infty)$ with a hard floor at 0 (neutral) and unbounded ceiling. Happiness is a reward $R \in (-\infty, R_{max}]$ with a hard ceiling but no urgent floor. The "zero pain is neutral" claim requires **Potential-Based Reward Shaping** to ensure the baseline state yields $r=0$, distinguishing it from a penalty. The "zero pleasure is not bad" claim means there is no constraint $R \geq 0$; the optimizer is indifferent to $R=0$ unless it correlates with $C$.

  **7. Urgency Asymmetry**
  This corresponds to **Interrupts** or **Priority Levels** in the control loop, distinct from reward magnitude. In standard RL, high suffering simply creates a steep gradient (large magnitude). To capture "preemption," you need a **Safety Shield** or **Emergency Policy** that triggers when $S > \tau_{urgent}$, overriding the main policy $\pi$ regardless of the expected return. This is structurally different from magnitude because it alters the execution flow (breaking the loop) rather than just scaling the update step.

  ***

  ### Residue Report

  **Clean Mappings:**
  The **Lexical Threshold** views translate very cleanly into **Lexicographic MOO** and **Hard Constraints**. Your framework already possesses the machinery to prioritize one objective strictly over another until a condition is met. The **Two-Currency** picture also finds a strong home in **CMDPs with Barrier Functions**, provided you avoid Lagrangian relaxation which reintroduces trade-offs.

  **Distorted Mappings:**
  The **Negative Utilitarian** instrumental claim is distorted because standard RL cannot easily distinguish between happiness being *instrumental* versus *correlated* without a causal model of the dynamics. If the agent is model-free, it cannot tell if happiness causes suffering reduction or just happens alongside it; it only sees the reward signal. The **Scale Asymmetry** is distorted because RL frameworks typically assume rewards are bounded or unbounded symmetrically; enforcing a hard "neutral zero" requires specific shaping that is not default. Furthermore, specifying a threshold $\tau$ in code forces a precision that the ethical view might intend to be vague or context-dependent.

  **Inexpressible Claims:**
  The **Urgency Asymmetry** leaves residue. While "interrupts" model the behavior, the ethical claim rests on a phenomenological distinction: that pain *feels* like an interrupt whereas pleasure does not. In RL, an interrupt is just a conditional branch. The framework cannot capture *why* suffering warrants an interrupt while equivalent magnitude happiness does not, other than by hard-coding the rule. This reveals that the ethical view relies on a qualitative property of experience (qualia) that your vocabulary treats as a structural hyperparameter.

  **Diagnosis:**
  This residue reveals **both** a limitation in the framework and a lack of crispness in the claim. Your framework lacks a native concept of "phenomenological urgency" distinct from "optimization priority," forcing you to implement it as a hard-coded interrupt rule. However, the ethical claim is also unclear: if urgency does not manifest as a trade-off preference or a behavioral interrupt, it is unclear what work it is doing other than describing the internal state of the agent. The translation forces the ethical view to commit to a specific control architecture (interrupt-driven) which it may not have intended.

