answer: |-
  everyone loves the darwin-turing parallel. its the standard move in intro seminars: darwin showed you can have design without a designer, turing showed you can have cognition without consciousness (or competence without comprehension, if you prefer dennetts phrasing). the vibe is that both guys pulled off the same kind of inversion, removing the ghost from the machine so to speak. but if you actually look at how selection works in the wild versus how it works in silicon, the analogy doesnt hold up. in fact they run in opposite directions.

  the core issue is teleology. in darwinian natural selection, the process is genuinely blind. theres no fitness function written down anywhere in nature. people talk about evolution optimizing for survival or reproduction like thats a goal, but thats backwards. fitness in nature is a retrospective statistical artifact, not a causal driver. an organism isnt fit because it was selected; it was selected because it happened to fit the conditions. theres no target being aimed at. the environment doesnt care. the causal power is just in the differential retention of traits that happen to work right now.

  now look at computational evolution, like genetic algorithms or neural net training via evolutionary strategies. here, the selection criterion is exogenously fixed by the programmer. you define the fitness function before you run the code. you tell the system what success looks like—sort this list, fly this plane, win this game. so when we say the machine shows competence without comprehension, thats only true if you ignore where the comprehension went. it didnt vanish; it was smuggled in through the back door of the fitness landscape. the programmer is the hidden designer. the teleology is external but its real.

  this means the darwin-turing analogy is broken not because machines lack minds, but because artificial evolutionary processes lack the causal autonomy that makes darwins inversion interesting in the first place. in nature, the selection pressure emerges from the interaction of physics and biology without a script. in computation, the selection pressure is a command.

  treating fitness like a score in genetic algorithms is a category mistake. when you treat fitness as a number to be maximized, you turn it into a final cause. but in biology, fitness is just a description of what survived. by reifying it into a function, computational models reintroduce the very designer darwin removed. so turing's inversion relies on a subrordinate relationship to a mind (the coder), whereas darwins inversion relies on the absence of any mind at all.

  if we want to talk about mindless competence, we have to admit that current evolutionary comp isnt actually mindless, its just distributed. the mind is in the lab, not the loop. until we have systems that generate their own fitness criteria from within—some kind of autonomous autopoiesis—the comparison collapses. youre not comparing design without a designer to cognition without a conscious thinker. youre comparing design without a designer to design where the designer is just offstage holding the scorecard. thats a fundamentally different metaphysical claim.
