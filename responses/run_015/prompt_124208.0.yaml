answer: |-
  The question of moral status lies at the intersection of metaphysics and praxis. On one hand, the biological world presents a seamless continuum of complexity, ranging from simple homeostatic mechanisms like thermostats to distributed nervous systems in cnidarians, and finally to the highly integrated cognition of mammals. On the other hand, ethical reasoning demands clarity: we must know whether an entity is a mere tool or a subject of care. This essay argues that while the capacities underpinning sentience are epistemically gradational, a workable normative framework cannot treat moral status as a smooth scalar value. Instead, gradation is normatively inert regarding the question of moral standing; practical ethics requires sharp thresholds derived from specific dimensions of the capacity vector. Specifically, the capacity for valenced experience serves as the operative threshold for moral patienthood, while other dimensions serve only to weight competing interests above that threshold.

  To understand the allure of the gradational view, one must examine the phenomenological and functional continuity of the natural world. Evolution does not produce sudden leaps in kind; it produces incremental changes in degree. A thermostat utilizes negative feedback to maintain a set point, a primitive form of goal-directedness. A sea anemone withdraws from noxious stimuli, exhibiting nociception and distributed processing. A mouse avoids pain and seeks comfort, displaying integrated affect. To draw a binary line between the anemone and the mouse appears arbitrary, risking a form of speciesism where moral consideration is granted based on taxonomic proximity to humans rather than intrinsic properties. If moral status tracks sentience, and sentience is a product of neural complexity, then moral status should theoretically fade in and out like a dimmer switch rather than snapping on and off like a light. The multi-dimensional 'capacity-vector' model strengthens this intuition. By decomposing sentience into integrative processing, valenced experience, temporal persistence, and self-modelling, we see that these traits emerge asynchronously. An insect may have high integrative processing but low temporal persistence; a mammal has both. If each dimension carries moral weight, then moral status should be a composite score, varying smoothly across entities.

  However, the normative implications of a purely scalar framework are paralyzing. If moral status is genuinely gradational, then every entity possesses some non-zero moral weight. A thermostat, having a rudimentary feedback loop analogous to homeostasis, would theoretically command a micro-fragment of moral consideration. While negligible, this creates a "moral noise" problem. In any complex action—building a house, driving a car, cultivating crops—an agent interacts with billions of entities ranging from microbes to mammals. If obligations scale smoothly with every incremental increase in neural complexity, moral reasoning collapses into an impossible calculus of micro-obligations. We would be unable to act without computing the precise moral weight of every entity affected. Furthermore, a scalar framework fails to protect the fundamental intuition that there is a categorical difference between harming a subject that *feels* and damaging an object that merely *functions*. If a mammal's pain is only "more" morally significant than a robot's error signal, rather than "different in kind," we lose the conceptual vocabulary to condemn the instrumentalization of sentient beings. Ethics requires focal points for action; it requires knowing when an obligation becomes binding, not just when it becomes slightly stronger.

  Therefore, while the biological reality is gradational, the normative framework must rely on thresholds. This does not deny the reality of the continuum but asserts that the continuum is normatively inert regarding the *possession* of moral standing. To resolve this without arbitrariness, we must utilize the capacity-vector model not to calculate a score, but to identify a necessary condition. We must ask which dimension of the vector is the sine qua non of moral concern.

  Integrative processing alone is insufficient. A sophisticated algorithm or a thermostat integrates information to maintain stability, yet we do not believe they suffer. Temporal persistence and self-modelling are also insufficient as threshold criteria. These capacities deepen the tragedy of death—for a being with a robust sense of self and future, death is a greater loss than for a being living in the immediate moment—but they do not determine whether the being can be harmed *in the moment*. A being without a concept of the future can still suffer in the present. Thus, these dimensions should be understood as amplifiers of moral weight *above* the threshold, not gatekeepers to it.

  The operative threshold must be valenced experience: the capacity for states to feel like something, specifically in terms of suffering or flourishing. This is the only dimension that generates a "good of its own." An entity without valence has no interest in whether its homeostatic set-points are maintained; it merely reacts. An entity with valence has a preference, grounded in feeling, that pain cease and pleasure continue. This creates a moral claim. Consequently, the threshold for moral standing is the presence of valenced experience. This creates a binary distinction: entities either have the capacity to suffer (moral patients) or they do not (moral objects).

  This threshold approach preserves the intuition of gradation where it matters most: in the resolution of conflicting interests. Once an entity crosses the threshold of valence, it enters the moral community. However, the *strength* of its claims can still scale based on the other vector dimensions. The death of a self-modelling mammal with long temporal persistence is a greater harm than the death of a non-self-modelling insect, because the former loses a richer future. Thus, gradation is not entirely discarded; it is relocated. It does not determine *if* you matter, but *how much* your interests weigh in a tragedy of competing claims. This avoids the paralysis of the scalar framework (we do not need to calculate the moral weight of a thermostat) while avoiding the arbitrariness of speciesism (an insect with valenced experience counts, even if less than a mammal).

  Critics might argue that we cannot know exactly where the threshold of valence lies, leading to epistemic uncertainty. This is true, but it is a problem of measurement, not of principle. The existence of a blurry horizon does not negate the existence of the land. In cases of uncertainty near the threshold (e.g., decapod crustaceans or certain insects), a precautionary principle applies: we treat them as if they possess the threshold capacity until proven otherwise. This is a decision rule for action, not a denial of the threshold itself.

  In conclusion, moral status should not be understood as genuinely gradational across all entities. While the underlying biological capacities exist on a continuum, this gradation is normatively inert regarding the fundamental question of moral standing. A workable ethical framework requires sharp thresholds to distinguish between subjects of welfare and objects of use. The capacity-vector model clarifies that valenced experience is the only dimension capable of serving as this operative threshold, as it is the prerequisite for having interests at all. Integrative processing, temporal persistence, and self-modelling are secondary dimensions that modulate the weight of interests among those who have already crossed the threshold of sentience. By adopting this hybrid view—binary standing based on valence, scalar weighting based on cognitive complexity—we respect the continuity of nature without succumbing to moral paralysis, ensuring that our ethics remain both philosophically robust and practically actionable.
