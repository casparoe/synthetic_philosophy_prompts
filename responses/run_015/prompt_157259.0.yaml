          *   Question: The definition relies on interventions that change X while holding other variables fixed. But isn't "holding other variables fixed" itself a causal notion?
          *   Likely Reply: It's a constraint on the model structure, not a causal claim itself.
          *   Follow-up: So is the theory normative about model building rather than descriptive of the world?

      *   *Topic 2: Fat-handed/Entangled Interventions.*
          *   Question: In social systems, can we ever intervene surgically? Zoning affects schools, prices, demographics simultaneously.
          *   Likely Reply: We define variables at the right grain or accept imperfect interventions.
          *   Follow-up: If the intervention *must* be fat-handed, does causation disappear or just become vague?

      *   *Topic 3: Social Kinds/Looping Effects.*
          *   Question: Hacking's looping effects. If we intervene on "credit score," the meaning of credit score changes.
          *   Likely Reply: We stabilize the kind for the duration of the intervention.
          *   Follow-up: Doesn't that make the causal relation transient or unstable compared to physical causation?

      *   *Topic 4: Overdetermination/Preemption & Granularity.*
