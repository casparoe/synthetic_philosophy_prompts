answer: |-
  You define causation via interventions that change X while holding other variables fixed, but isn't the notion of holding other variables fixed itself a causal constraint, risking circularity?

  If she says it is merely a coherence constraint on the model rather than a causal claim, does that make causation relative to our model-building practices rather than a feature of the world itself?

  In social systems, interventions are rarely surgical; zoning affects schools and prices simultaneously, so how do you handle fat-handed interventions where nothing is held fixed?

  If causation becomes vague in these entangled cases, does it lose the explanatory power required to assign responsibility for segregation or pay gaps?

  Social kinds loop; intervening on credit scores changes what a credit score is, so how do you stabilize the kind long enough to measure the effect?

  Does this stabilization requirement make social causation transient or unstable compared to physical causation, undermining the unity of your account?

  Overdetermination cases often resolve by fine-graining variables, but doesn't this make causation depend on our descriptive choices rather than the events themselves?

  Is there any fact of the matter about who caused the outcome independent of the variable set we choose to analyze?

  Is this view really distinct from Lewis, or just regimented counterfactuals with structural equations replacing similarity metrics?

  Don't structural equations just encode similarity judgments in a different format, meaning you haven't dispensed with Lewisian metaphysics but only hidden it?

  Do omissions count as causes, like failing to regulate housing, since an intervention to prevent the omission would change the outcome?

  Doesn't selecting which omissions count as causes reintroduce the normative judgments about expectations that you hoped to avoid with a structural account?

  Is this theory metaphysics or only a methodology for designing experiments, and does that leave a gap with what we ordinarily mean by cause?

  If it is only methodology, does that mean ordinary causal claims are strictly false or just useful fictions for agents like us?

  I am highly confident that these represent the standard pressure points on interventionist accounts, particularly regarding circularity, fat-handedness, and the metaphysics-methodology divide. The question resting on the shakiest reading of her position is likely the one about Lewis-style counterfactuals, because sophisticated interventionists usually have a well-rehearsed distinction regarding the semantics of counterfactuals that makes the comparison less damaging than it initially appears.
