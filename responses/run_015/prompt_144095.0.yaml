  **MINUTES OF THE AD HOC COMMITTEE ON NAMING**
  **Date:** 14 October 2023
  **Time:** 14:00 – 15:45
  **Location:** Conference Room B, Administration Building

  **Present:** Dr. H. Vance (Chair), Dr. S. Miller (Secretary), Prof. A. Kline, Prof. B. Lowe, Prof. C. Hayes, Prof. D. Cross, Prof. E. Witt.

  **Apologies for Absence:** None.

  **1. Old Business**
  The Chair called the meeting to order. The Committee reviewed the four conditions for a social welfare function drafted at the meeting of 07 October. It was moved, seconded, and carried that the conditions be ratified as follows: (1) Unrestricted Domain, wherein every member's ranking of the shortlist is admissible; (2) Pareto Efficiency, wherein if every member ranks Name A above Name B, the committee ranking must do likewise; (3) Independence of Irrelevant Alternatives, wherein the committee's ranking of A versus B may depend only on how members ranked A against B; and (4) Non-Dictatorship, wherein no single member always gets their way.^1

  **2. New Business**
  The Chair invited proposals for voting procedures satisfying the ratified conditions. Prof. Kline suggested restricting the domain to single-peaked preferences along a traditional-modern axis. He proposed the formation of a Subcommittee on Preference Alignment charged with making the faculty single-peaked. The Chair noted that such alignment falls outside the Committee's remit. The motion was referred to the Faculty Senate Committee on Structural Psychology.

  Prof. Hayes proposed abandoning Independence of Irrelevant Alternatives in favor of a Borda-style point system. Dr. Cross noted that this violates Condition 3. Prof. Hayes argued for a loose interpretation wherein irrelevant names do not act as spoilers.^2 The Secretary recorded that this formulation is technically imprecise. The motion was rejected due to non-compliance with ratified conditions.

  Prof. Lowe suggested moving to cardinal utilities with interpersonal comparisons. The Committee noted the absence of calibrated utilometers and the difficulty in verifying utility units across departments. The motion was tabled indefinitely.

  Prof. Witt proposed outputting only a winner rather than a full ranking. The Secretary reminded the Committee that the University Newsletter requires an ordered shortlist of three names. Consequently, a procedure outputting only a winner is insufficient. Prof. Cross added that selecting a winner alone would not circumvent the impossibility result given the other constraints. The motion was tabled for lack of time.

  Prof. Kline proposed Instant-Runoff Voting. Prof. Lowe noted, with visible irritation, that Instant-Runoff Voting fails Independence of Irrelevant Alternatives and can cause a name to lose by becoming more popular. The Chair ruled the proposal out of order.

  **3. Any Other Business**
  Dr. Vance summarized the discussion. It was observed that according to the general impossibility theorem discussed, no ranking procedure exists that satisfies all four ratified conditions unless the procedure is dictatorial. The Committee noted that the only procedure meeting all four conditions is for a single member to decide.

  **4. Adjournment**
  It was moved by Prof. Hayes and seconded by Prof. Witt that, pending review at the next meeting, the Chair be appointed as Dictator to finalize the shortlist. The vote was taken by show of hands. All seven members voted in favor. The minutes record the general satisfaction that this outcome was arrived at democratically.

  There being no further business, the meeting adjourned at 15:45.

  ***

  ^1 A dictator in the theorem's sense is defined as a member whose strict preference over any pair becomes the group's, not merely someone influential, and not someone with a veto.

  ^2 Independence of Irrelevant Alternatives requires that the social ranking of A versus B depends only on individual rankings of A versus B, not merely that third options do not alter the winner.
