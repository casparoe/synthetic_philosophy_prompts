  You're a professional philosopher who's spent real time with contractualism — take this seriously, and please actually brainstorm before you write: I'd rather you churn through a couple of bad versions of the list and bin them than hand me the first one that occured to you.

  So: I somehow ended up on the allocations committe at a small hospital foundation, and we keep hitting the same fight. There's a named kid with a rare condition and a very expensive surgery, and a photo, and a social worker who writes to us. And there's a screening van that would give a quite small benefit to a few thousand people, most of whom we'll never know anything about and who will never know they were helped. Same money. I keep feeling like the van has to win and also like saying that out loud is monstrous, and I dont want a verdict from you on which one wins. I want the spec.

  Write me the desiderata: what any account of when — or whether — you may add up small benefits across lots of people and set them against one person's much bigger loss has to get right, in order to be good enough for a committee that has to decide under imperfect information about who gets how much, and that has to give reasons it can say out loud in a meeting. For each requirement give the case or consideration behind it, and mark whether it's non-negotiable or just something one camp insists on. Things I want in there somewhere:

  - the "we do this every month" case: the same choice comes up twenty times with different people in the unlucky seat, each meeting looks fine judged on its own, but the whole run leaves the same kind of person worse off over and over — so is the unit of assessment the decision or the sequence?
  - the risk case, where nobody's outcome actually changes: we're buying very small reductions in probability for thousands of people, afterwards nothing has happened to anybody, so who is supposed to be doing the rejecting?
  - the "no one even knows" case: the benefit is real but the recipients never learn about it and wouldnt bother objecting if they did — is actual objecting beside the point, or is it the whole point?
  - whether adding up is permitted only as a tie-breaker between principles, once no individual complaint settles it.
  - whether the number of people can matter at all here, or whether any way of letting it in quietly turns the whole thing back into summing.

  And here's the bit I care most about: if some subset of the requirements can't be satisfied together, say so inside the relevant item and say which one you'd drop. That's the actual result I'm after.

  For each of the five, add a word on whether it's common ground among people who genuinely work on this or a partisan demand dressed up as common ground — do not sell me a contested one as the consensus, and where you're just not sure, say you're not sure instead of hiding behind "many philosophers argue."

  Exactly five numbered items, one or two sentences apiece, no preamble and no sign-off. Skip the scorecard — I'll run Scanlon-style contractualism, straight summing, and whatever tie-breaking view you like against the list myself, in the room, with the people who disagree with me.
