answer: |-
  The asymmetrical labeling of societal trajectories in archaeological and policy discourse reveals a deep-seated **structural essentialism** regarding social identity, coupled with a **teleological bias** toward complexity. The practice of categorizing the Late Bronze Age (LBA), Classic Maya, and Rapa Nui as "collapses," while framing Postclassic Maya or Post-LBA Levantine communities as "transformations," is not merely a descriptive distinction based on empirical severity. It is an ontological choice about what constitutes the *essence* of a society and a normative judgment about what constitutes *success*.

  ### 1. Ontological Commitments: The State as Essence
  The canonical trio (LBA, Classic Maya, Rapa Nui) is grouped under "collapse" because the classification presupposes that the **institutional superstructure** (palace economies, monumental architecture, writing systems) is the identity condition of the society itself. This is a form of **Top-Down Essentialism**.

  *   **Identity Conditions:** Under this view, a society is not defined by its demographic continuity, shared language, or cultural memory, but by its specific mode of political integration and energy extraction. When the palace burns, the society dies, even if the peasantry persists.
  *   **The Asymmetry:** The reason Postclassic Maya are often framed as "transformed" rather than "collapsed" is not necessarily because their institutional stress was lower, but because the *unit of analysis* shifts implicitly. For the Classic period, the unit is the *Divine Kingship*; for the Postclassic, the unit becomes the *Ethno-Linguistic Group*. This shift is philosophically inconsistent. If the Classic Maya "collapsed" because the kings vanished, the Postclassic Maya should theoretically represent a *new* society. If they represent the *same* society reorganized, then the Classic period did not "collapse" in an ontological sense; it merely underwent institutional shedding.
  *   **Energy Regimes:** The reliance on "ecological overextraction" in these narratives further cements a thermodynamic definition of society. A society is viewed as an energy-processing machine. If the throughput drops (less monumentality, less trade), the machine is broken ("collapse"), rather than downsized ("adaptation").

  ### 2. Normative Loading: Complexity as Telos
  The concept of "collapse" in this context is a **thick ethical concept**: it fuses fact (institutional discontinuity) with value (failure).

  *   **The Normative Standard:** The labeling practice embeds the assumption that **complexity is the natural telos** of social development. A move from dense urban networks to dispersed ruralism is coded as a "fall" rather than a strategic reallocation of labor. This reflects a modernist bias where scale and centralization are equated with progress.
  *   **Welfare vs. Structure:** The prompt asks if we could reserve failure-language for declines in human welfare. Currently, we do not. A "collapsed" society might actually exhibit improved health metrics (e.g., reduced skeletal stress markers in Post-Mycenaean Greece compared to Late Bronze Age), yet it is still labeled a collapse because the *civilizational project* ended. The implicit theory values **System Persistence** over **Human Flourishing**.
  *   **Descriptive Neutrality:** A value-neutral description would require terms like "decomplexification," "regionalization," or "political fragmentation." The retention of "collapse" signals a judgment that the previous state was the *correct* or *stable* state, and the current state is a deviation.

  ### 3. Reconstructing the Implicit Theory
  To render the canonical trio coherent, the implicit theory of social value and continuity operates on three axioms:

  1.  **The Monumentality Axiom:** Social identity is anchored in material signatures of elite power. If the signature vanishes, the identity is extinguished.
  2.  **The Lineage of Power:** Continuity is traced through institutions of governance, not through lineages of population. (Hence, the LBA is "gone" even though the genetic and cultural lineage of Greeks and Levantines continued).
  3.  **The Entropy of Scale:** Large-scale integration is the default "ordered" state; fragmentation is "disorder."

  This theory creates a coherent narrative for the trio: all three represent the **termination of a specific elite project**. However, this coherence is purchased at the cost of erasing the majority of the population who survived the transition.

  ### 4. Philosophical Underdetermination
  Is this theory strictly required? **No.** The practice is philosophically underdetermined.

  *   **Rival Accounts:**
      *   **Functionalist:** A society persists as long as it meets the basic needs of its members and reproduces its culture. By this metric, the Post-LBA Levant and Postclassic Maya are the *same* societies as their predecessors, merely adapted. The "Collapse" label becomes inaccurate for the trio as well, as the populations persisted.
      *   **Narrative Constructivism:** "Collapse" is a story we tell about the end of *archives*, not the end of *people*. The LBA and Classic Maya left written records that stopped; the Postclassic Maya left records that continued. The "collapse" is an epistemic boundary (the silence of the text) mistaken for an ontological boundary (the death of the society).
      *   **Resilience Theory:** From a complex systems view, "collapse" is simply a transition to a different stability domain. Labeling one domain "civilization" and the other "dark age" is a value judgment, not a systems analysis.

  The exclusion of reorganized societies from the "collapse" category is not a logical necessity but a **curatorial choice**. It serves a specific rhetorical function: to warn modern policy-makers about the fragility of *their* specific type of complexity (globalized, bureaucratic, high-energy). If we labeled the Postclassic Maya as a "successful adaptation to climate stress," it would undermine the warning narrative.

  ### 5. Necessary Shifts in Practice
  If we adopted a view of social identity that treats radical institutional discontinuity as compatible with societal persistence (a **Population/Culture-Centric Ontology**), curatorial and policy practices would require significant restructuring:

  **A. Curatorial and Pedagogical Shifts:**
  *   **From "Ruins" to "Roots":** Museum narratives would cease to end at the layer of destruction. Instead of "The End of the Mycenaeans," exhibits would title sections "The Reorganization of the Aegean." The focus would shift from the loss of the palace to the continuity of the village.
  *   **Decentering Monumentality:** Syllabi and displays would reduce the weight given to architecture and writing as markers of "civilization." Pottery, oral traditions, and genetic continuity would be elevated as primary markers of social identity.
  *   **Reframing the Trio:** The LBA, Classic Maya, and Rapa Nui would be taught not as warnings of death, but as case studies in **adaptive cycling**. Rapa Nui, for instance, would be framed not as ecological suicide, but as a successful transition to a sustainable, lower-energy equilibrium that persisted until European contact.

  **B. Policy and Rhetoric Shifts:**
  *   **Resilience over Preservation:** Policy briefs would stop using "avoiding collapse" (which implies preserving the current institutional form at all costs) and start using "managing transition." The goal becomes maintaining human welfare and cultural continuity, even if it requires dismantling current bureaucratic or economic structures.
  *   **Redefining Failure:** "Failure" would be decoupled from GDP or state capacity and linked to metrics of inequality, health, and ecological carrying capacity. A "smaller" society that feeds its people would be rated higher than a "complex" society that starves them.
  *   **Temporal Humility:** Policy narratives would acknowledge that current global systems are one phase among many, not the pinnacle of history. This reduces the existential panic of "collapse" and allows for more flexible planning for post-growth or post-bureaucratic futures.

  ### Conclusion
  The current asymmetrical labeling practice presupposes that a society *is* its state apparatus. It assumes that when the bureaucracy falls, the society dies. This is an **elite-centric ontology** that conflates the history of power with the history of people. It is not philosophically necessary; it is a narrative strategy that privileges the stability of institutions over the adaptability of populations. Abandoning this framework requires us to stop viewing history as a series of peaks and valleys of "civilization" and start viewing it as a continuous flow of human adaptation, where the loss of a palace is not a death, but a change of address.
