answer: |-
  # JOINT STATEMENT ON THE SEMANTICS OF STAKES-SENSITIVITY
  **A Collaborative Draft by Proponents of Interest-Relative Invariantism (IRI) and Epistemic Contextualism (EC)**

  ## I. AGREED CLAIMS

  We, the undersigned, representing the Interest-Relative Invariantist and Epistemic Contextualist positions respectively, submit this statement to clarify the terrain of our disagreement. We acknowledge the following points as common ground, established to isolate the semantic core of our dispute from pragmatic confusions.

  1.  **The Reality of the Stakes Effect:** In "Bank-style" cases, where a subject's evidence is held fixed while their practical stakes vary, the truth value of knowledge attributions varies. We agree this variation is not an illusion, nor is it merely a matter of speakers being loose or loose with language.
  2.  **Semantic, Not Merely Pragmatic:** We agree that the stakes-sensitivity cannot be fully explained away by Gricean implicature, conversational relevance, or norms of assertion alone. The sensitivity penetrates to the truth conditions of the knowledge claim itself. A speaker in a high-stakes scenario who claims "I know" asserts something false (or less than true), not merely something misleading.
  3.  **Evidence is Fixed:** We agree that in the relevant thought experiments, the subject's purely epistemic position (evidence, reliability, cognitive state) remains constant. The variation in truth value is driven by practical factors, not by hidden shifts in evidence quality.
  4.  **Unity of Phenomenon:** We reject the deflationary claim that the stakes effect is a disjunction of unrelated errors (e.g., confusion about belief vs. knowledge, or confidence vs. knowledge). We treat the stakes effect as a unified datum requiring a unified semantic or metaphysical explanation.
  5.  **Rejection of Traditional Invariantism:** We both deny Traditional Epistemic Invariantism (the view that knowledge depends *only* on truth, belief, and purely epistemic justification). We agree that practical factors play a necessary role in the semantics or metaphysics of knowledge.

  ## II. RESIDUAL DISAGREEMENTS

  While we agree on the data, we disagree on the locus of the variability. The following table summarizes our divergent accounts of the semantic mechanism.

  | Feature of the Dispute | Interest-Relative Invariantism (IRI) | Epistemic Contextualism (EC) |
  | :--- | :--- | :--- |
  | **Semantic Value of 'Knows'** | The word 'knows' expresses a single, invariant relation. Its content does not shift between contexts. | The word 'knows' is indexical or context-sensitive. Its content shifts depending on the context of attribution. |
  | **Locus of Variation** | Variation occurs in the **worldly conditions** required for the invariant proposition to be true. | Variation occurs in the **proposition expressed** by the utterance. |
  | **The Shared-Utterance Case**<br>*(Speaker S says to High-Stakes H1 and Low-Stakes H2: "I know the ferry leaves at 11.")* | **What was said:** One invariant proposition (that S stands in the knowledge relation to the ferry time).<br>**Truth Value:** Determined solely by **S's stakes**. If S's stakes are low, the utterance is true simpliciter, even if H1 cannot rely on it. | **What was said:** A proposition whose truth conditions are fixed by the **conversational context**. <br>**Truth Value:** Determined by the **salient standards** in the conversation. If H1's high stakes make error possibilities salient, the standard rises for the whole conversation, potentially rendering the utterance false. |
  | **What Fixes the Standard?** | **The Subject's Practical Environment.** The standard is fixed by the costs of error for the subject *in acting on the belief*. This is the right fix because knowledge is the norm of practical reasoning. | **The Attributor's Conversational Context.** The standard is fixed by the salient error possibilities in the attributor's (speaker's) context. This is the right fix because 'knows' functions to flag information as reliable enough for the *current conversational purposes*. |

  ## III. CRUXES

  We identify four sub-questions where our predictions diverge sharply. Settling these empirically or intuitively would significantly advance the debate. For each crux, we specify a case, the bearing argument, and our respective predictions.

  ### Crux 1: Whose Stakes Matter? (Subject vs. Attributor vs. Aggregate)
  *   **The Question:** When a third party attributes knowledge to a subject, do the subject's stakes or the attributor's stakes determine the truth of the attribution?
  *   **The Case:** *The Remote Observer.* Subject S is in a Low-Stakes situation (betting pennies). Attributor A is in a High-Stakes situation (A's life depends on S's belief being true). A says, "S knows the bank is open."
  *   **Bearing Argument:** If knowledge is a norm of action (IRI), S's stakes should dominate. If knowledge is a tool for information transfer (EC), A's stakes should dominate.
  *   **Predictions:**
      *   **IRI:** The attribution is **True**. S's low stakes fix the threshold; A's anxiety is irrelevant to S's epistemic status.
      *   **EC:** The attribution is **False**. A's high-stakes context raises the semantic standard for 'knows' in A's mouth, making the claim false despite S's situation.

  ### Crux 2: Rational Ignorance and Irrational Inflation
  *   **The Question:** Can a subject fail to know because of stakes they are unaware of, or know despite believing stakes are high when they are not?
  *   **The Case:** *The Unaware Subject.* S has Low Stakes objectively, but irrationally believes stakes are High (Paranoia). Conversely, S has High Stakes objectively, but is Rationally Ignorant of them (Negligence).
  *   **Bearing Argument:** Tests whether the "practical" in pragmatic encroachment is objective or psychological.
  *   **Predictions:**
      *   **IRI:** **Objective Stakes Dominate.** If stakes are objectively High, S does not know (even if ignorant). If stakes are objectively Low, S knows (even if paranoid). Knowledge tracks the actual rational requirements for action.
      *   **EC:** **Salience Dominate.** If S (as attributor of self-knowledge) *saliently* treats stakes as high, the standard rises. The subject's psychology fixes the conversational context, regardless of objective reality.

  ### Crux 3: Scope of Encroachment (Knowledge vs. Rational Belief)
  *   **The Question:** Does the stakes-sensitivity apply only to the word 'knows', or does it reach rational belief and credence?
  *   **The Case:** *The High-Stakes Credence.* S has evidence E. In Low Stakes, it is rational to believe P. In High Stakes, is it rational to *believe* P, even if we forbid saying "I know P"?
  *   **Bearing Argument:** If only 'knows' shifts, EC is favored (semantic shift). If rational belief shifts, IRI is favored (metaphysical encroachment on justification).
  *   **Predictions:**
      *   **IRI:** **Encroachment on Belief.** In High Stakes, it is irrational to believe P (or act on P) without further evidence. The stakes raise the bar for justified belief, not just knowledge.
      *   **EC:** **Invariant Belief.** It remains rational to believe P, but inappropriate to claim *knowledge*. The shift is lexical, not doxastic.

  ### Crux 4: Non-Circular Standard Fixing in the Shared-Utterance Case
  *   **The Question:** In the Shared-Utterance Case (S speaking to H1-High and H2-Low), can either view specify what fixes the standard without circularly appealing to "what the standard intuitively is"?
  *   **The Case:** *The Mixed Audience.* S (Low Stakes) tells H1 (High Stakes) and H2 (Low Stakes): "I know the ferry leaves at 11."
  *   **Bearing Argument:** Tests the robustness of the "Standard Fixing" mechanism.
  *   **Predictions:**
      *   **IRI:** **Subject-Centric.** The standard is fixed by S's stakes. The utterance is True. H1's inability to act on it is a separate issue about *reliance*, not truth. *Risk:* Fails to explain why S feels pressure to retract for H1's sake.
      *   **EC:** **Conversational Purpose.** The standard is fixed by the *most demanding* conversational purpose salient to the speaker. Since S intends to inform H1, H1's stakes enter S's context. The utterance is False. *Risk:* Fails to explain why S can legitimately tell H2 to rely on it.

  ## IV. VERBAL VS. SUBSTANTIVE DISPUTE

  We acknowledge that a portion of our disagreement may be verbal, though a significant substantive core remains.

  **The Verbal Component:**
  Part of the dispute concerns the **location of the semantic parameter**. IRI locates the parameter in the *circumstances of evaluation* (the subject's world), while EC locates it in the *context of utterance* (the attributor's world). If we agree that the extension of 'knows' varies with stakes, the disagreement over whether this is due to "shifting content" (EC) or "shifting truth conditions for invariant content" (IRI) may be a technical distinction without a difference in predictive power regarding usage. We agree to label this the "Indexicality Dispute."

  **The Substantive Core:**
  Behind the Indexicality Dispute lies a substantive metaphysical question: **Is knowledge a purely cognitive state, or a hybrid cognitive-practical state?**
  *   If **IRI** is correct, knowledge is constitutively tied to action. A change in stakes changes the *nature* of the epistemic position required to count as knowledge.
  *   If **EC** is correct, knowledge is a purely cognitive state, but our *word* for it is flexible to serve social needs of information sharing.

  **Resolution Path:**
  Crux 3 (Scope of Encroachment) offers the best path to dissolving the verbal element. If we can agree that stakes affect *rational belief* (not just the word 'knows'), the EC claim that only the semantics shift becomes untenable, and the dispute collapses into IRI. If we agree that rational belief is invariant, the IRI claim that knowledge is action-guiding becomes harder to sustain, favoring EC. Until Crux 3 is settled, we remain in a state of productive adversarial collaboration.

  ***

  **Signed,**

  *The Interest-Relative Invariantist*
  *The Epistemic Contextualist*
