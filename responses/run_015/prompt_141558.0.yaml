  # The Dead Battery Test: Why the Principle of Alternative Possibilities Fails

  The debate over the Principle of Alternative Possibilities (PAP)—the claim that an agent is morally responsible for an action only if they could have done otherwise—has stagnated. Frankfurt-style cases were meant to bury PAP, but incompatibilists have kept it on life support using "flicker of freedom" strategies and dilemma defenses. They argue that Frankfurt cases either covertly rely on PAP or fail to eliminate all alternatives. This essay argues that this stalemate is broken not by tinkering with the standard Frankfurt case, but by juxtaposing it with a variant I call the **Dud Device**. When we treat the Standard/Dud pair as the decisive test, PAP collapses. Furthermore, rejecting PAP in light of this pair does not incur the costly moral luck consequences often feared; rather, it is the defense of PAP that forces us into an unacceptable luck-based ontology of blame.

  ### The Dud Device Variant

  Consider the Standard Frankfurt Case: Jones deliberates and decides to shoot Smith for his own reasons. Black, a nefarious neurosurgeon, is monitoring Jones. If Jones shows any sign of deciding otherwise, Black will intervene and force the decision to shoot. Jones decides on his own; Black does nothing. Jones seems blameworthy, yet he could not have done otherwise.

  Now consider the **Dud Device Case**: The setup is identical in every intrinsic respect. Jones deliberates and decides to shoot Smith for his own reasons. Black is monitoring him and *would* have intervened if Jones had shown signs of deciding otherwise. However, unbeknownst to everyone (including Black), the intervention device has a dead battery. If Jones had been about to decide otherwise, the intervention would have silently failed. Jones would have refrained. Jones decides on his own; Black does nothing.

  In the Standard case, Jones lacks alternative possibilities (Black ensures he shoots). In the Dud case, Jones has alternative possibilities (the battery failure means he could have refrained). Yet, the actual sequence of events is identical: Jones's phenomenology, deliberation, reasons, and action are intrinsically indistinguishable. The only difference is an extrinsic fact about a battery unknown to any participant.

  ### The Argument from Intrinsic Supervenience

  The Dud/Standard pair isolates the variable of "could have done otherwise" while holding constant everything about the agent's actual agency. This yields a decisive dilemma for the PAP defender:

  1.  **If blame differs between the cases:** Then Jones is blameworthy in the Dud case (alternatives available) but not in the Standard case (no alternatives). Since the actual history is identical, this implies that moral responsibility turns on an extrinsic fact (the battery status) outside the agent's control and ken. This is a devastating form of moral luck. It suggests that two agents who act identically, for identical reasons, with identical phenomenology, differ in culpability solely due to a hidden switch in the environment.
  2.  **If blame is the same:** Then Jones is equally blameworthy in both cases. Since he lacks alternatives in the Standard case, PAP is false. Responsibility tracks the actual sequence (quality of will, reasons-responsiveness), not modal robustness.

  Our intuitive judgment strongly favors the second horn. It seems absurd to exonerate Jones in the Standard case simply because Black's device was functional rather than dead. Jones's blameworthiness stems from what he *did* and *why* he did it, not from what Black *would have done* had he chosen differently. Therefore, PAP is false.

  ### Handling the Defenses

  Incompatibilists have two main lines of defense against Frankfurt cases, but the Dud Device neutralizes both.

  **The Flicker of Freedom Strategy:** This objection claims that Frankfurt cases never eliminate *all* alternatives. Jones could have "decided on his own" vs. "been forced." Thus, PAP survives because some alternative remains. The Dud case renders this irrelevant. In the Dud case, Jones has the robust alternative of *refraining from shooting entirely*. In the Standard case, he does not. If PAP were true, this robust difference should alter blame. Since our blame judgment remains constant despite the presence/absence of the robust alternative, the existence of "flickers" is morally irrelevant. The Dud case shows that even full-blooded alternatives are not necessary for blame.

  **The Dilemma Defense:** This argues that Frankfurt cases beg the question: if determinism is true, Jones couldn't do otherwise anyway; if indeterminism is true, Black can't guarantee the outcome. The Dud/Standard pair bypasses this metaphysical stalemate. We do not need to settle the determinism debate to compare the two cases. Both cases can be set in an indeterministic world where Jones's decision is not causally determined. The only difference is the counterfactual intervener's efficacy. Since the actual sequence is identical, any difference in blame must come from the counterfactual structure. If we agree blame doesn't change, we have isolated PAP as the variable and found it inert.

  ### The Moral Luck Consequence

  Does this view incur a moral luck cost? Critics argue that if blame depends on the actual sequence while freedom depends on alternatives, we face a disconnect. However, the reverse is true: **defending PAP incurs the moral luck cost.**

  If PAP is true, Jones's culpability depends on the battery. In the Dud case (working alternatives), he is blameworthy. In the Standard case (blocked alternatives), he is not. Since Jones cannot know or control the battery status, his moral status becomes a matter of luck. This violates the core principle that agents should not be judged on facts outside their control.

  By rejecting PAP, we avoid this cost. On the Actual Sequence view, blame supervenes on the agent's actual deliberation and action. Since these are identical in both cases, blame is identical. The battery status affects the *metaphysics of freedom* (whether he could have done otherwise), but it does not affect the *ethics of blame*. We are not stuck with blame tracking luck; we are stuck with *freedom* tracking luck, but we have good reason to think freedom (in the PAP sense) is not the ground of blame. The moral luck score for my view is negligible because blame remains stable across the extrinsic variation.

  ### Conclusion

  The Dud Device variant demonstrates that the Principle of Alternative Possibilities is not just counter-intuitive in Frankfurt cases, but untenable when isolated from confounding variables. The choice is between a view where blame tracks the agent's actual quality of will (PAP false) and a view where blame tracks the status of a hidden battery (PAP true). The latter is an unacceptable form of moral luck. PAP falls. Responsibility is a matter of actual history, not modal robustness.

