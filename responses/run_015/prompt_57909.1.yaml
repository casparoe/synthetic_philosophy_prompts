answer: |-
  First off: **This is not a dumb question.** You have independently rediscovered one of the most famous headaches in the philosophy of science. It is literally called **"The Problem of Old Evidence."**

  It was formalized by Clark Glymour in the 1980s, and it stumped Bayesians for decades. So, you are in good company. Einstein himself was bothered by the fact that Mercury's orbit was known *before* he derived General Relativity (GR), yet everyone agreed that Mercury's orbit was the strongest evidence *for* GR.

  Your math is right: If $P(E) = 1$ (you are certain of the evidence), then Bayes' Theorem says the evidence provides zero confirmation for the hypothesis.
  $$P(H|E) = \frac{P(E|H)P(H)}{P(E)}$$
  If $P(E) = 1$, then $P(E|H)$ must also be $1$. The equation collapses to $P(H|E) = P(H)$. No update.

  So, is Bayesianism broken? **No.** But the "Textbook 101 Version" of Bayesianism is incomplete. Here is how Bayesians actually solve this, and how it applies to your sourdough.

  ### 1. The "Logical Connection" Solution (The Philosophical Fix)
  The standard solution (proposed by Daniel Garber and others) is that you aren't updating on the *fact* of the evidence ($E$); you are updating on the **logical relationship** between the theory and the evidence.

  *   **Old View:** I update on "Mercury wobbles." (I already knew this, so $P=1$).
  *   **New View:** I update on "General Relativity **entails** that Mercury wobbles."

  Before you learned GR, you knew $E$ (Mercury wobbles), but you did *not* know that $H \to E$ (GR implies the wobble). That logical connection was new information.

  When you realize your theory *captures* the old data, you are learning something about the **structure of the theory**, not the world. You are effectively saying, "Wow, out of all the possible curves my equation could have drawn, it just happened to hit these specific old points." That is surprising!

  **For your sourdough:**
  You knew the thermometer readings ($E$). But you didn't know that your new timing rule ($H$) would mathematically reproduce those readings. The "evidence" isn't the temperature; the evidence is that **your rule fits the temperature.** That fit is new information.

  ### 2. The "Never Truly 1" Solution (The Practical Fix)
  In real-world science (and baking), credence is almost never exactly 1.

  *   **Mercury:** Did we *really* know Mercury's orbit with logical certainty? No. Telescopes have error margins. Calculations have rounding errors. There was always a tiny sliver of doubt ($P(E) = 0.999...$).
  *   **Sourdough:** Are your thermometer readings perfect? No. Thermometers drift. You might have misread the notebook.

  If $P(E)$ is $0.99$ instead of $1.0$, Bayes' Theorem starts working again. If your theory predicts $E$ with high probability, but $E$ was slightly uncertain, confirming $E$ boosts the theory.

  However, this feels like a "hack" to many philosophers. It solves the math, but it doesn't feel like the *real* reason Einstein got credit. (He would have gotten credit even if Mercury's orbit was known with absolute logical certainty).

  ### 3. The "Comparative" Solution (Model Selection)
  This is probably the most useful one for your sourdough model. In practice, Bayesians often care less about absolute confirmation and more about **model comparison**.

  You aren't asking: "Does this data support my Rule?"
  You are asking: "Does this data support my Rule **more than it supports the Old Rule**?"

  Even if the data is old, if your new rule predicts the old data *better* (or more simply) than the previous best theory, the **Bayes Factor** favors your new rule.

  *   **Old Theory:** "Sourdough rises randomly." (Predicts data poorly).
  *   **New Rule:** "Sourdough rises based on temp/time integral." (Predicts old data perfectly).

  Even if the data is old, the fact that your new rule *retrodicts* it successfully while the old theory didn't is where the confirmation comes from.

  ### So, is Bayesianism broken?
  No, but it requires you to be precise about **what exactly is being updated.**

  If you treat "learning a theory" as just "adding a hypothesis to the list," then yes, old evidence is useless. But if you treat "learning a theory" as **learning the implications of that hypothesis**, then old evidence becomes powerful again.

  **The Takeaway for your Sourdough:**
  Don't throw out those thermometer readings!
  1.  Acknowledge that the *data* is old.
  2.  Recognize that the *fit* is new.
  3.  Your update isn't "The temperature was X." It is "My model successfully accounts for the fact that the temperature was X."

  You hit a wall that stumped professional philosophers for 20 years. That's not a sign you're bad at this; it's a sign you're thinking deeply enough to find the cracks in the foundation. Keep tinkering.
