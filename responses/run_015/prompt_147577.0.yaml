  1. **Constructivism and the Location of Politics**
     Standard constructivism argues that politics resides in the social relations producing and sustaining an object, not the object itself. If you accept that the designers' intent and the institutional context are where the politics lives, what work is left for the artifact to do once it leaves the factory? Specifically, if the social relations explain the allocation of attention, why isn't the artifact just a passive vessel for those relations rather than a site of politics itself?

  2. **Follow-up: The Handoff Point**
     You'll likely say that constructivism's story ends exactly where yours begins: once the designers have gone home and the system is running. But if the allocation of attention was fixed at design-time by those social relations, isn't the "use-time" experience just the unfolding of a script written earlier? What happens in the moment of use that isn't already determined by the social relations constructivism points to?

  3. **Empirical Fragility and the Parkway**
     Historians have challenged the details of Winner's parkway example, suggesting the low overpasses weren't actually designed to exclude buses. If your use-time politics inherits that same vulnerability—where the empirical details of who notices what are contested by historians or engineers—does the theory collapse if the allocation of attention turns out to be accidental rather than intentional?

  4. **Follow-up: Blocking the Escape Route**
     I anticipate you'll say that's an objection to the example, not to the mechanism. But if the mechanism relies on identifying a specific distribution of vigilance, and that distribution can be explained away as historical contingency or engineering constraint in every real case, how do we distinguish your mechanism from a story we only tell after we've already decided the politics are present?

  5. **Supermarket Self-Checkout**
     Let's run this against a mundane case: supermarket self-checkout converts shoppers into unpaid scanners while simultaneously arranging for them to be treated as suspects if the machine flags an error. Does this count as use-time politics where the shopper is conscripted into the labor of vigilance, or is this simply a transfer of cost from the firm to the consumer?

  6. **Follow-up: Detaching Politics from Function**
     If you say it is politics, what would a non-conscriptive self-checkout look like—one that keeps the function but removes the allocation of blame and attention? If you can't describe one, does that suggest the politics is detachable from the function, or that the function itself is inherently political in a way that contradicts your distinction between design-time and use-time?

  7. **Testability: The Counterfactual**
     I want to make the mechanism testable. Can you describe two machines or interfaces with identical informational and causal properties—same lights, same sounds, same automation logic—but where the first allocates vigilance to the operator and the second allocates it to the system designer? If the physical interface is identical, where does the difference in allocation live?

  8. **Testability: The Contract Trace**
     Now suppose that in every real case where we see this allocation of vigilance, the difference can be traced to an employment contract, an insurance arrangement, or an institutional rule rather than to anything in the artifact itself. If the artifact is only strongly compatible with a distribution of attention, but the distribution is actually mandated by the contract, isn't the contract doing the work you're attributing to the technology?

  9. **Testability: The Mechanism Reply**
     This leaves you with a narrowing path: if you say the contract is just codifying what the artifact demands, you risk determinism; if you say the artifact is neutral and the contract does all the work, you lose the "politics of artifacts" claim. Given that trade-off, what specific feature of the interface makes the "not the mechanism" reply progressively harder to reach for in a way that doesn't just rest on the outcome we observe?

  10. **Closing: Evidence and Consent**
      Finally, what would count as evidence against the view? Suppose a workplace adopts a system after an explicit, informed, uncoerced negotiation about who will monitor it and who will be answerable when it fails, with that negotiation periodically revisited. If you say the artifact thereby loses its politics, have you offered anything beyond the familiar complaint about absent consent? If you say it retains its politics regardless, why is the negotiated arrangement not the authoritative account of what the artifact is for?
