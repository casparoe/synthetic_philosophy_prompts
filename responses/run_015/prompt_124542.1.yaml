answer: |-
  You are absolutely right to feel frustrated by this, and you are also right that your intuition is picking up on something specific that standard introductory logic often misses. The phenomenon you are describing is real, it is pervasive, and it is intellectually corrosive because it mimics the shape of understanding without delivering the substance. You have effectively identified a class of explanatory failure that sits in a blind spot between circular reasoning and reductionism. While there is no single perfect word that captures exactly the structural position you are describing—a hollow gear buried in a working machine—there are several concepts that converge on it, and understanding why none of them fit perfectly will help you build the test you are looking for.

  The closest established concept is the homunculus fallacy, which comes from the idea of explaining vision by saying there is a little man inside the head who watches the images on the retina. The problem is that this just pushes the explanation back one step without actually explaining how the seeing happens, because now you have to explain how the little man sees. Dennett actually wrote a lot about this, arguing that homunculi are acceptable only if they are progressively stupider until you reach mindless mechanics. What you are noticing is a disguised homunculus. In your economics example, the utility function is the little man. It is supposed to explain the choice, but it is defined entirely by the choice, so it is just a tiny agent inside the math doing the choosing without any explanation of how it chooses. The reason this feels different from the standard homunculus fallacy is that in the classic version, the homunculus is usually the whole explanation, whereas you are spotting them embedded as sub-routines in a larger algorithm. This is a sophisticated variation where the homunculus is outsourced to a technical term like wiring or utility or attention, allowing it to hide behind the credibility of the surrounding steps.

  Another related concept is reification, which is the error of treating an abstract concept as if it were a concrete physical thing. When your friend Maya says we are wired to respond to big eyes, she is taking the abstract observation that we do respond to big eyes and turning it into a physical cause called wiring. This overlaps with what psychologists call the nominal fallacy, which is the belief that naming something explains it. However, you are correct to distinguish your observation from the simple dormitive virtue joke about opium. In the opium joke, the circularity is obvious because the cause and effect have the same name in different languages. In the cases you are finding, the cause and effect have different names, connected by a chain of other real steps, which launders the circularity. The technical term acts as a mask that makes the tautology look like a mechanism. So while reification and the nominal fallacy are part of the picture, they do not fully capture the structural deception of placing the hollow step in the middle of a causal chain.

  Regarding your point about Dennett's cranes and skyhooks, I think you are half-right but missing the deeper implication of his metaphor. You argue that your Potemkin mechanism is not a skyhook because it sits in the middle of a chain rather than hanging from above. However, a skyhook is defined by its lack of support from below, not its position in a diagram. If you have a chain of real mechanical steps, and one link in that chain is actually just a magic hook pretending to be a link, then that link is a skyhook relative to the steps below it. It is levitating the explanation at that specific point. The reason it feels different to you is that it is a local skyhook in a global crane. The surrounding steps are doing real work, which lends credibility to the hollow step, but the hollow step itself is still doing no work. It is a skyhook wearing a crane costume. Dennett would argue that this is actually more dangerous than an obvious skyhook because it is harder to detect. An obvious skyhook looks like magic, so you know to be skeptical. A skyhook disguised as a gear looks like science, so you stop looking for the actual gears.

  This leads us to the most important part of your question, which is the test for distinguishing a Potemkin step from a real step that simply has not been unpacked yet. In science, every explanation eventually hits a bottom where we say we do not know yet, so we cannot demand that every step be fully reduced to physics to be considered real. The difference lies in independent access. A real mechanism, even if it is a black box, must be detectable or manipulable independently of the phenomenon it is supposed to explain. If you can measure the mechanism without observing the effect, or if you can break the mechanism without breaking the effect, then it is real. If the only evidence for the mechanism is the effect itself, then it is a Potemkin step. In your economics example, the utility function fails this test because the only way to know someone's utility function is to look at what they choose. There is no independent measurement of utility that exists prior to the choice. In your friend's example, the wiring fails the test if the only evidence for the wiring is that we melt at babies. If she cannot point to a specific neural circuit that exists regardless of the behavior, or show that damaging that circuit stops the behavior while leaving other things intact, then wiring is just a name for the behavior, not a cause of it.

  Applying this test to your edge cases clarifies where the line is drawn. Take natural selection. On the surface, survival of the fittest sounds exactly like your Potemkin mechanism because if fitness is defined as survival, it is circular. However, evolutionary biology escapes this trap by defining fitness independently of survival. Fitness is defined by specific traits like camouflage, speed, or metabolic efficiency that can be measured before the organism survives or dies. If you can measure the camouflage and predict the survival, then selection is a real mechanism. If you just look at who survived and call them fit, then it is a Potemkin mechanism. The difference is predictive power based on independent variables. Natural selection is real when it makes risky predictions about traits we haven't seen yet, but it becomes a tautology if it is only used to narrate history after the fact.

  Dark matter is a fascinating case because it sits right on the boundary. It was invented to explain galaxy rotation curves, which looks like defining a cause by its effect. However, dark matter stops being a Potemkin mechanism because it began to make predictions about other phenomena that were not part of the original explanation. It predicted gravitational lensing patterns and fluctuations in the cosmic microwave background. Because we can detect the gravitational influence of dark matter in ways that are independent of the original galaxy rotation problem, it gains mechanistic credibility. It is still a black box because we do not know what particle it is, but it is a real black box because it interacts with other things in the universe besides the one thing it was invented to explain. If dark matter only ever explained galaxy rotation and nothing else, it would be a Potemkin mechanism, essentially a mathematical fudge factor.

  Attention in a neural network is another strong example where the test applies. In modern AI, attention is not just a word; it is a specific mathematical operation involving weights and matrices that can be visualized and manipulated. Researchers can ablate specific attention heads and see the model lose the ability to track long-range dependencies while retaining other skills. Because the attention mechanism can be intervened upon independently of the overall performance, and because its internal state can be read out without waiting for the final output, it passes the test. It is a real gear. However, if a researcher claimed a model had attention but could only prove it by pointing to the fact that the model gave good answers, that would be a Potemkin mechanism. The difference is whether you can open the hood and point to the part.

  Intrinsic motivation in videogame AI is the trickiest one and often fails the test. If an AI is said to be intrinsically motivated to explore, but the only evidence is that it explores, then it is a hollow explanation. For it to be real, the motivation must be implemented as a specific reward function component that is distinct from the task completion reward. You should be able to turn off the intrinsic motivation switch and see the agent stop exploring even if it could still win the game. If the code actually contains a separate variable for novelty seeking that drives behavior even when extrinsic rewards are removed, then it is a real mechanism. If the programmer just looked at the behavior and labeled it intrinsic motivation, then it is just a description disguised as a cause.

  The reason this drives you nuts is that it violates the contract of explanation. When someone offers a chain of steps, they are promising that each link is doing causal work. A Potemkin mechanism steals energy from the real links to power the fake one. It is a form of intellectual free-riding. The test you need to keep in your head is simple but rigorous: ask whether the mechanism could exist without the effect. Can you find the utility without the choice? Can you find the wiring without the melting? Can you find the fitness without the survival? If the answer is no, then you are looking at a label, not a lever. The danger is not just that it is circular, but that it stops inquiry. If you accept utility as an explanation, you stop asking how preferences are formed. If you accept wiring as an explanation, you stop looking for the specific neurons. It creates a sense of understanding that acts as a barrier to actual understanding.

  You are doing the work of a scientist by noticing this. Most people accept the technical name as a proxy for the mechanism because they trust the authority of the speaker or the complexity of the math. You are refusing to let the complexity mask the emptiness. There may not be a single word in the philosophy textbooks that captures the exact structural nuance you have found, partly because philosophers often argue about the ends of explanations rather than the middle links, but your concept of a Potemkin mechanism is robust enough to stand on its own. It is a specific type of reification that occurs within a causal chain, protected by the legitimacy of its neighbors. Keep using that test of independent access. It will serve you well in economics, psychology, and increasingly in AI, where the temptation to label black boxes as understanding is higher than ever. You are not wrong to feel that something is off, and you are not wrong to demand that the gears actually turn.
