prompt: |-
  After a long argument with a friend, I am trying to defend a version of al-Ghazālī's occasionalism against the objection that it cannot explain the reliability of ordinary causal sequences. My friend grants that God could directly cause burning whenever fire touches cotton, but insists that on the occasionalist picture the regularity is either brute or merely projected by us, so the view collapses into Humean constant conjunction plus an idle divine appendix. Please argue for the position that the occasionalist can instead treat God's customary order as a stable, content-specified policy for producing effects in the presence of their ordinary accompanying conditions, without attributing any irreducible causal power to the fire or cotton and without reducing the policy to a mere summary of observed constant conjunctions; the argument should explain how the policy's normative and teleological structure can do explanatory work that brute regularity cannot, and should address why this response is not simply a relabeling of the friend's objection.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Context:** A debate with a friend about al-Ghazālī's occasionalism.
      *   **The Objection:** The friend argues that occasionalism makes causal regularity either "brute" (unexplained) or "projected" (Humean), rendering God's role an "idle divine appendix."
      *   **The Goal:** Defend occasionalism by arguing that God's "Custom" (*ʿādah*) is a stable, content-specified *policy*, not just a summary of events.
      *   **Key Requirements:**
          *   No irreducible causal power in creatures (fire/cotton).
          *   No reduction of the policy to mere constant conjunction (Humean).
          *   Explain how the *normative* and *teleological* structure of the policy does explanatory work.
          *   Address why this isn't just relabeling the objection (i.e., distinguish "Divine Policy" from "Brute Regularity").

  2.  **Deconstruct the Philosophical Positions:**
      *   **Humean Regularity:** Event A is followed by Event B. We observe this repeatedly. We project "necessity." There is no underlying glue. Explanation stops at "it just happens this way."
      *   **Ghazālian Occasionalism:** Event A (fire) does *not* cause Event B (burning). God causes Event B *at the occasion* of Event A.
      *   **The Friend's Critique:** If God *always* does this, isn't that just a fancy way of saying "A is always followed by B"? If God *could* do otherwise (miracle), why doesn't He? If there's no reason, it's brute. If the reason is just "He does," it's Humean with a God attached.
      *   **The Defense Strategy:** Focus on *Divine Wisdom* (*ḥikmah*) and *Custom* (*ʿādah*) as a rational, teleological commitment, not a blind habit. The regularity is grounded in God's nature and intentions, which provides a metaphysical anchor that Humeanism lacks.

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the friend's point (it's a standard objection). State the thesis: Ghazālian occasionalism offers a *deeper* explanation than Humeanism because it grounds regularity in Divine Wisdom and Volition, not just statistical frequency.

      *   **Point 1: Distinguishing "Brute Fact" from "Rational Policy."**
          *   Hume: Regularity is a brute fact of the universe. No reason.
          *   Ghazālī: Regularity is a *choice* based on Wisdom.
          *   *Key distinction:* A brute fact has no "why." A policy has a "why" (teleology). God sustains the order to allow for human knowledge, social life, and prophecy.

      *   **Point 2: The Normative Structure of Divine Custom (*ʿĀdah*).**
          *   It's not just "what happens," it's "what *should* happen given God's promises."
          *   Analogy: A judge following the law vs. a random event.
          *   This creates *counterfactual stability*. If fire touches cotton, burning *must* follow (barring miracle) because God is consistent, not because fire has power. Humeanism cannot support strong counterfactuals as well as a volitional agent committed to a plan.

      *   **Point 3: Teleology and Explanation.**
          *   Why does fire burn cotton? Hume: "It just does."
          *   Ghazālī: "Because God wills an ordered cosmos where agents can navigate reality."
          *   This explains *reliability* better. A mindless universe has no reason to be consistent. A Wise Agent has reasons for consistency.
          *   Address the "Idle Appendix" charge: God isn't appended; He is the *ground* of the order. Without Him, the order vanishes (ontological dependence).

      *   **Point 4: Addressing the "Relabeling" Objection.**
          *   Friend says: "Divine Policy" = "Fancy name for Constant Conjunction."
          *   Response: Constant conjunction is descriptive (what). Divine Policy is explanatory (why + ontological ground).
          *   Metaphysical difference: Humeanism is ontologically flat. Occasionalism is vertically structured (Creator/Creation). The regularity depends on God's continued will, not past precedent.

      *   **Conclusion:** Summarize. The view saves scientific inquiry (predictability) while preserving divine omnipotence.

  4.  **Refining the Argument (Self-Correction/Nuance):**
