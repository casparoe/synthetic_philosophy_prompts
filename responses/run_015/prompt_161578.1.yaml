answer: |-
  Here is a structured argument you can present to your friend. It is designed to distinguish the Ghazālian account of Divine Custom (*ʿādah*) from Humean constant conjunction by focusing on the metaphysical grounding, teleological purpose, and normative force of God's will.

  ***

  ### The Argument: Divine Custom as Rational Policy, Not Brute Regularity

  Your objection rests on the claim that occasionalism reduces to Humeanism with an extra step: instead of "Fire touches cotton → Burning happens," we say "Fire touches cotton → God wills → Burning happens." You argue that if God *always* wills this, the regularity is either brute (unexplained) or merely a projection of our expectation, making God an "idle appendix."

  However, this characterization misses the core of al-Ghazālī's metaphysics. The occasionalist does not posit a *blind* regularity; they posit a **rationally grounded, teleological policy.** The difference between a "brute fact" and a "divine policy" is not merely semantic; it is metaphysical and explanatory. Here is why the occasionalist account of reliability is superior to the Humean one, without granting causal power to creatures.

  #### 1. The Metaphysical Ground: Volition vs. Inertia
  On the Humean view, the regularity of nature is a brute fact. There is no ontological "glue" holding the sequence together. We expect the sun to rise tomorrow because it rose yesterday, but metaphysically, there is no reason why the future must resemble the past. The regularity is inert.

  On the Ghazālian view, the regularity is **ontologically dependent on a continuous, active Will.**
  *   **Hume:** The sequence exists *sui generis*. If it stops, it just stops.
  *   **Ghazālī:** The sequence exists *because* God sustains it.

  This is not an "idle appendix." An appendix is a vestigial organ that does no work. God's will is the *engine* of existence. In occasionalism, the cotton does not have the power to burn; it is ontologically inert. The burning is a fresh creation by God at every moment. The reliability of the sequence is not due to the fire's power, but due to the **consistency of the Agent.**

  **The Explanatory Gain:** A mindless universe (Hume) has no reason to be consistent. A Wise Agent (Ghazālī) has reasons for consistency. Therefore, occasionalism provides a *reason* for reliability (Divine Wisdom), whereas Humeanism can only offer a *description* of reliability (Constant Conjunction).

  #### 2. Teleology: The Policy of Intelligibility
  You ask why God adheres to this custom if He has the power to break it. If there is no reason, it seems arbitrary (brute). But for Ghazālī, the "Custom of God" (*ʿĀdat Allāh*) is not a habit; it is a **commitment to intelligibility.**

  God creates an ordered cosmos (*nizām*) specifically to allow for:
  1.  **Human Agency:** We cannot act if we cannot predict outcomes. If fire did not reliably burn cotton, human life would be impossible.
  2.  **Knowledge:** Science and inference rely on stable signs.
  3.  **Prophecy:** Miracles are only meaningful as *exceptions* to a known rule. Without a stable custom, a miracle is just chaos.

  Therefore, the regularity is **teleological.** It serves a purpose. God wills the sequence "Fire + Cotton → Burning" repeatedly not because He is stuck in a rut, but because He wills a world where agents can navigate reality. This teleological structure does explanatory work that brute regularity cannot: it explains *why* the regularity holds (for the sake of wisdom/order) rather than just *that* it holds.

  #### 3. Normativity and Counterfactuals
  This is the strongest point against the "Humean relabeling" charge. Humean regularity is descriptive; Divine Custom is **normative.**

  *   **Humean:** "Fire has always burned cotton." (Summary of past data).
  *   **Ghazālian:** "God is Truthful (*Ṣidq*), and His custom is a promise of order." (Commitment to future action).

  Because the regularity is grounded in God's attribute of Truthfulness and Wisdom, it supports stronger counterfactuals than Humeanism.
  *   **Hume:** "If I touch this fire, it will probably burn me (based on past stats)."
  *   **Ghazālī:** "If I touch this fire, it *must* burn me (barring miracle), because God sustains a covenant of order."

  The "must" here is not logical necessity (as the philosophers claimed), nor is it psychological expectation (as Hume claimed). It is **volitional necessity.** God has bound Himself by His own wisdom to act consistently. This normative structure allows us to trust the world not because the world has power, but because the Creator is reliable. This explains the *authority* of natural laws better than Humeanism, which reduces laws to summaries of events.

  #### 4. Addressing the "Idle Appendix" and "Relabeling" Objection
  You argue that calling it a "Divine Policy" is just relabeling "Constant Conjunction." It is not, for two reasons:

  **A. The Direction of Dependence**
  *   In **Humeanism**, the regularity is fundamental. The "policy" is a human projection onto the data.
  *   In **Occasionalism**, the Divine Will is fundamental. The "regularity" is a secondary effect of that Will.
      *   If you remove the human observer from Humeanism, the regularity remains a brute fact.
      *   If you remove the Divine Will from Occasionalism, the regularity vanishes instantly (existence ceases).
      *   Therefore, God is not an appendix; He is the substrate. The regularity is not a "summary of events" but a "continuous act of creation."

  **B. The Possibility of Interruption**
  The fact that God *can* break the custom (miracle) proves that the custom is not brute.
  *   If the regularity were brute (Hume), a miracle would be a violation of the universe's nature.
  *   If the regularity is a policy (Ghazālī), a miracle is a **revision of the policy** for a higher purpose.
      *   This distinction matters for explanation. When a miracle occurs, the Humean must say "the rules changed for no reason." The Occasionalist says "the rules changed for a *higher* reason (prophetic validation)." The occasionalist framework can absorb the exception into its teleological system; the Humean framework cannot.

  ### Conclusion for the Debate
  To summarize your defense:

  You are treating God's Custom as if it were a **blind habit**, equivalent to a human reflex. But for al-Ghazālī, God's Custom is a **rational policy** grounded in Wisdom (*Ḥikmah*).

  1.  **It is not Brute:** It is explained by God's will to create an intelligible world for human agents.
  2.  **It is not Humean:** It is not a summary of past events, but an ontological ground for future events. The fire does not cause the burning; God's *commitment to order* causes the burning at the occasion of the fire.
  3.  **It is not an Idle Appendix:** Without the continuous volition of God, the cotton and fire would cease to exist, let alone interact. The regularity is the visible trace of God's active sustenance, not a machine running on its own.

  The occasionalist saves the reliability of science better than the Humean because the occasionalist grounds that reliability in a **Mind** that values consistency, whereas the Humean grounds it in a **Void** that has no reason to be consistent. The "policy" is not a relabeling of the regularity; it is the **explanation** for it.
