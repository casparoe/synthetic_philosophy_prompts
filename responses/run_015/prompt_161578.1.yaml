      *   *Refining the "Relabeling" rebuttal:* The friend thinks "Policy" is just a word for "Regularity." I need to show that "Policy" implies a *reason* for the regularity that exists *now*, whereas "Regularity" implies the past dictates the future. Occasionalism grounds the future in the *current* will of God, aligned with His wisdom. Humeanism grounds the future in the *past* events. This is a crucial metaphysical difference.

