      *   *Check:* Is the "Normative" aspect clear? *Correction:* Use the concept of God's "Promise" or "Covenant" with creation. It's not just habit; it's a commitment to intelligibility.
      *   *Check:* Ghazālī specific terminology? *Correction:* Use *ʿādah* (custom), *ḥikmah* (wisdom), *irādah* (will). Mention the *Tahāfut al-Falāsifah* context implicitly.
      *   *Check:* The "Idle Appendix" point. *Correction:* Emphasize that in Humeanism, if the regularity stops, nothing metaphysical changes. In Occasionalism, if regularity stops, it indicates a change in Divine Will (Miracle). The *possibility* of interruption proves the dependence.

  5.  **Final Polish:** Organize into clear sections. Ensure the tone is dialectical (speaking to the friend's objection) but rigorous. (The prompt asks me to "argue for the position," so I should write it as a direct argument or a structured case I can present). Let's structure it as a direct philosophical defense suitable for presentation to the friend.

