answer: |-
  **Seminar Handout: The Pathology of Precommitment**
  **Topic:** Distinguishing Ulysses Contracts from Constitutional Precommitment in Institutional Design
  **Focus:** Monetary Policy and the Source of Time-Inconsistency

  ### I. The Thesis: Distinct Pathologies Require Distinct Devices

  In the literature on precommitment, ranging from Jon Elster's *Ulysses and the Sirens* to Holmes and Sunstein's *The Cost of Rights*, there is a tendency to treat precommitment strategies as points on a single spectrum of rigidity. I argue this is a category error. The distinction between a **Ulysses contract** (binding oneself to a specific future action) and **constitutional precommitment** (binding oneself to a rule or decision procedure) tracks a fundamental difference in the *pathology of agency* each is designed to cure.

  1.  **The Ulysses Contract (Binding Action):** This device is appropriate only when the agent's defect is **pure weakness of will (akrasia)**. Here, the preference structure is stable across time regarding the *goal*, but unstable regarding the *means* at the moment of execution. Present-Odysseus and Future-Odysseus agree that steering toward the Sirens is bad. However, at time $t$, Future-Odysseus faces a localized temptation that reverses his ranking of immediate actions. The Ulysses contract solves this by removing the option entirely. It is a solution to **preference reversal**.
  2.  **Constitutional Precommitment (Binding Rule/Procedure):** This device is required when the deeper problem is **uncertainty about future circumstances (ignorance)**. Here, preferences are stable, but the *state of the world* ($S$) is unknown. A fixed action ($A$) may be optimal in $S_1$ but catastrophic in $S_2$. A rule ($R$), however, functions as a mapping $R(S) \rightarrow A$. It is robust across states of the world. This is a solution to **informational asymmetry across time**.

  Conflating these two leads to institutional mismatch. Applying a Ulysses contract to a problem of uncertainty creates brittle rigidity; applying a constitutional rule to a problem of weakness of will creates loopholes for temptation.

  ### II. Application: The Rules vs. Discretion Debate in Monetary Policy

  The standard narrative in monetary economics, following Kydland and Prescott (1977) and Barro and Gordon (1983), frames the debate as an **efficiency trade-off**.
  *   **Rules:** Provide credibility and anchor expectations (solving time-inconsistency), but lack flexibility to respond to supply shocks.
  *   **Discretion:** Provides flexibility to stabilize output during shocks, but suffers from inflation bias due to the temptation to renege on low-inflation promises.

  On the standard view, the optimal institution is a weighted average of the two: enough rules to ensure credibility, enough discretion to ensure flexibility.

  **I argue this efficiency framing is diagnosticallly shallow.** It assumes the "temptation" to deviate from low inflation is structurally identical to the "need" to deviate due to economic shocks. By applying the Ulysses/Constitution distinction, we see that the debate is not about trading off efficiency properties, but about identifying the **source of the institution's time-inconsistency**.

  #### 1. If the Source is Weakness of Will (Akrasia)
  If the time-inconsistency problem arises because policymakers are politically myopic—succumbing to electoral cycles, lobbying, or hyperbolic discounting despite knowing the long-term cost of inflation—then the defect is **preference reversal**. The optimal policy is known (low inflation), but the will to maintain it falters.
  *   **Prescribed Device:** A **Ulysses Contract**.
  *   **Institutional Form:** A hard peg, a currency board, or a rigid inflation target with no escape clauses.
  *   **Rationale:** Flexibility here is not a virtue; it is the mechanism of failure. "Discretion" in this context is merely the license to succumb to temptation. A constitutional rule (which allows for judgment) would be insufficient because the agent cannot be trusted to exercise judgment benevolently.

  #### 2. If the Source is Uncertainty (Ignorance)
  If the time-inconsistency problem arises because the economy is subject to stochastic shocks (oil price spikes, financial crises) that a fixed rule cannot accommodate, then the defect is **informational**. The policymaker is not "tempted" to inflate; they are responding to a state $S_2$ where the fixed action $A$ (e.g., constant money growth) causes recession.
  *   **Prescribed Device:** **Constitutional Precommitment**.
  *   **Institutional Form:** A dual mandate (price stability + employment) delegated to an independent Central Bank, or a state-contingent rule (e.g., a Taylor Rule).
  *   **Rationale:** A Ulysses contract (fixed action) is disastrous here because it binds the agent to an action that is sub-optimal in specific states of the world. We do not need to bind the *action*; we need to bind the *objective function* and the *process*. We trust the agent to optimize given the state, provided they are insulated from political pressure (the constitutional constraint).

  ### III. Defending the "Source of Time-Inconsistency" View

  Why is this diagnostic approach superior to the standard efficiency trade-off?

  **1. It Prevents Category Errors in Design.**
  The efficiency trade-off suggests we should always accept *some* inflation bias to gain *some* shock absorption. But if the problem is pure Akrasia (e.g., a kleptocratic regime using seigniorage), accepting "some" bias is not an efficiency trade-off; it is capitulation to corruption. Conversely, if the problem is pure Uncertainty (e.g., a complex modern financial system), imposing a Ulysses-style fixed money growth target (as tried in the early 1980s) creates unnecessary volatility. The "trade-off" view obscures the fact that in the Akrasia case, the marginal benefit of flexibility is zero (or negative), while in the Uncertainty case, the marginal cost of rigidity is infinite.

  **2. It Clarifies the Nature of "Credibility."**
  In the standard view, credibility is about convincing the market you will stick to the plan. In the source-based view, credibility is about signaling which pathology you are solving.
  *   If you adopt a Ulysses contract, you signal: "We know we are tempted, so we have tied our hands."
  *   If you adopt a Constitution, you signal: "We face unknown shocks, so we have bound ourselves to a process, not an outcome."
  Confusing these signals creates market confusion. A Central Bank claiming to fight inflation (Ulysses goal) while retaining broad discretion (Constitutional means) creates an ambiguity premium in bond markets because agents do not know if the Bank is fighting its own weakness or responding to a shock.

  **3. It Reframes Time-Inconsistency.**
  Standard theory treats time-inconsistency as a game-theoretic inevitability of rational expectations. I argue time-inconsistency is either a **psychological/political failure** (Akrasia) or a **contractual incompleteness** (Uncertainty).
  *   If Akrasia: The inconsistency is between $Self_{t}$ and $Self_{t+1}$ preferences.
  *   If Uncertainty: The inconsistency is between the *Rule* and the *Optimal Action in State S*.
  Treating these as the same phenomenon leads to models that cannot distinguish between a Central Banker who *won't* do the right thing and one who *can't* see the right thing.

  ### IV. When Would the Efficiency Reading Be Correct?

  For the standard efficiency trade-off (Flexibility vs. Credibility) to be the correct framework *instead* of the source-diagnosis framework, specific conditions must hold that effectively collapse the distinction between Ulysses and Constitutional problems.

  **1. The "Benevolent Temptation" Condition.**
  It must be true that the "temptation" to deviate from the rule is not a defect of will, but a rational welfare-improving response to unmodeled variables. In other words, what looks like Akrasia must actually be Uncertainty. If the policymaker deviates from the inflation target, it must be because there was a hidden supply shock that justified it, not because they wanted to boost employment artificially. If this is true, then "Flexibility" is always efficiency-enhancing, and "Rules" are always efficiency-reducing (due to rigidity), making the debate a simple optimization of the *degree* of flexibility.

  **2. The "Known Distribution" Condition.**
  It must be true that the probability distribution of future shocks is known and stable. If the distribution of shocks is known, a "Rule" can be written that is fully state-contingent (a complete contract). In this world, there is no distinction between a Rule and Discretion; the Rule *is* the optimal discretion. The efficiency trade-off only exists because we assume rules must be *simple* (Ulysses-like) to be credible. If we could write costless, enforceable, state-contingent contracts (Perfect Constitutional Precommitment), the trade-off vanishes. Therefore, the efficiency reading relies on the assumption that **communication costs** force us to choose between simple lies (rigid rules) and complex truths (discretion).

  **3. The "Stable Preference" Condition.**
  It must be true that the policymaker's objective function never undergoes preference reversal. The efficiency reading assumes the policymaker always wants to maximize social welfare, but is constrained by the expectations of agents. It rules out the possibility that the policymaker *wants* to inflate for political gain (a change in preferences). If preferences are stable, then "Weakness of Will" does not exist. There is only "Constraint Optimization."

  **Conclusion for the Seminar**
  If these three conditions hold, then the standard efficiency trade-off is correct: we are simply balancing the costs of communication (rules) against the benefits of optimization (discretion). However, if we acknowledge that political agents suffer from hyperbolic discounting (Akrasia) *and* that the economic environment is Knightian uncertain (Ignorance), then the efficiency trade-off is a dangerous simplification. We must first diagnose the pathology. Are we binding Odysseus to the mast, or are we writing a Constitution for a Republic? The answer determines whether "flexibility" is a necessary tool or a fatal loophole.
