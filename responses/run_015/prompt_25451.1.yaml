  Achilles slams his notebook shut. "I refuse to write another line! You must simply *see* that Z follows from A and B by the very nature of inference!"

  The Tortoise nodded kindly. "I see. So you are proposing the proposition: 'If Achilles invokes the nature of inference, the Tortoise must accept Z.'"

  "No!" cried Achilles. "It's not a proposition! It's a rule!"

  "Ah, a rule," said the Tortoise, opening a fresh page. "Then we must record the rule that rules must be recorded. We've exhausted the alphabet twice already... shall we label this one (AA)?"

  "There is no (AA)!" Achilles screamed.

  "Then I accept 'Achilles says there is no (AA)')," said the Tortoise, pen poised. "But do I accept that his saying so makes it true? Surely that requires..."

  Achilles threw the notebook into the sea.

  The Tortoise watched it sink. "Premise (BB): Notebooks are not buoyant. But does 'sinking' imply 'silence'? I feel we need a (CC)..."
