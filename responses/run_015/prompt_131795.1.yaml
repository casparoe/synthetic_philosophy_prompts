answer: |-
  1) **Thesis in a line:** Moral judgment is non-representational analogical pattern-matching driven by predictive processing, rendering moral principles and stable character traits explanatorily redundant.

  2) **The hits**

  *   **The Phil of Science (The Coherence Attack)**
      *   **Their phrasing:** "Predictive processing fundamentally relies on generative models to minimize error. Models are generalizations by definition. If you deny generalization at *every* level, your scientific backing contradicts your metaphysical claim. Which is it?"
      *   **Reply:** "I distinguish between sub-personal statistical weights and conscious moral principles. Predictive processing uses priors, yes, but these are contextual tuning parameters, not universalizable rules. My claim is that there are no *propositional* generalizations accessible to reasoning or constitutive of moral truth. The 'model' is the neural architecture itself, not a set of rules it consults. So, while the mechanism uses statistical regularities, the *moral reasoning* remains non-representational pattern-matching. The science explains the capacity, not the content."
      *   **Soft spot:** You are walking a tightrope between "no generalization" and "statistical priors." If priors encode expectations, they encode generalizations.

  *   **The Virtue Ethicist (The Agent Attack)**
      *   **Their phrasing:** "Phronesis requires a stable character to perceive correctly. If there are no stable traits, only situational matching, what guarantees the agent won't match differently tomorrow? You've dissolved the moral agent."
      *   **Reply:** "Stability lies in the history of the pattern-matcher, not in abstract traits. Just as a neural net retains weights after training, the agent retains a specific sensitivity profile without needing a 'virtue' label. *Phronesis* is the fluency of the matching process, not the possession of a stable internal object. The consistency comes from the shared form of life and biological constraints on prediction, not from a reified character structure. The agent is stable enough to function, without needing metaphysical baggage."
      *   **Soft spot:** Virtue ethicists will argue that without robust traits, you can't distinguish a reliable agent from a lucky one.

  *   **The Kantian (The Normativity Attack)**
      *   **Their phrasing:** "Analogy is private. If I disagree with your pattern-match, how do you justify your judgment without appealing to a principle we both accept? You've removed the possibility of moral argument."
      *   **Reply:** "We argue by refining the perception, not deducing from rules. I point to relevant similarities in cases until your pattern-matching resonates with mine. Justification is bringing you to see what I see, not forcing you to accept my axiom. This is how actual moral discourse works—we swap cases, not maxims. If you refuse to see the similarity, no principle would have forced you anyway; you'd just reinterpret the principle."
      *   **Soft spot:** This risks reducing morality to persuasion or rhetoric. If perception is brute, there's no rational ground to stand on.

  *   **The Virtue Ethicist (The Learning Attack)**
      *   **Their phrasing:** "How does a novice become an expert without generalizations to guide them? You can't pattern-match if you don't know what patterns matter."
      *   **Reply:** "Through ostensive training and error correction, not rule transmission. A child learns 'don't touch' via feedback loops, not by grasping the principle of property rights. Moral learning is calibrating the prediction error signal against community responses. We teach by example and correction, which aligns the learner's predictive model with ours. Generalizations are just post-hoc summaries of this training, not the scaffolding used to build it."
      *   **Soft spot:** Explaining how the initial "relevant similarities" are identified without prior rules is notoriously difficult (the frame problem).

  *   **The Kantian (The Error Attack)**
      *   **Their phrasing:** "If reasoning is just matching, how do you know you're wrong? Without a principle to violate, moral error becomes impossible."
      *   **Reply:** "Error is prediction failure. If your judgment leads to social friction or unintended harm, your predictive model failed to account for relevant contextual variables. You don't need a principle to know a prediction missed the mark; the feedback from the world provides the correction. Moral error is pragmatic failure within a form of life, not logical inconsistency with a law."
      *   **Soft spot:** This shifts morality to pragmatism. Hardline Kantians will reject pragmatic success as a substitute for moral rightness.

  3) **The nightmare question**

  "Your thesis hinges on the predictive-processing analogy, but PP is inherently representationalist—it posits the brain models the world to minimize surprise. If moral perception has *no representational content*, as you claim, then what exactly is the prediction error signal tracking? If it's not tracking a representation of 'wrongness' or 'value,' then the mechanism is blind. If it *is* tracking value representations, then you admit moral content exists independently of the matching. You cannot have a predictive engine without a representation of what is being predicted. Are you secretly smuggling representational content into the 'priors' while denying it in the 'reasoning'?"

  4) **What to concede first**

  "I concede that sub-personal predictive priors must encode statistical regularities, which are a form of generalization. However, I maintain these are not *moral principles* accessible to reasoning or justification."
