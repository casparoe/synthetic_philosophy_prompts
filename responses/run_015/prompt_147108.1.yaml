  Here the translation strains. First, I imported "selected-effect function" for Dennett. Biology assumes function implies history; philosophy disputes this. Second, Searle ties Original Intentionality to consciousness. A synthetase isn't conscious. If I map "intrinsic chemistry" to "Original Intentionality," I distort Searle; he might say the enzyme has *no* intentionality, only the biologist does.

  Now, your two cases. The permuted-code organism: This helps Dennett. It shows the code is purely conventional (Derived). It doesn't help Searle because it doesn't locate intrinsic content; it just shows the mapping is arbitrary. It's a dud for proving Original Intentionality.

  The stereochemical floor: This is the hard residue. Is physical fit "aboutness"? Searle says no; causation isn't representation. He needs a subject. Dennett says no; it's just causation. Intentionality is a layer we add. So the "floor" supports neither; it dissolves the distinction. The circle (code/machinery) looks like Dennett's bootstrapping, but Searle sees it as vacuous without a mind to ground the first step. Biology has no word for "grounding" other than "thermodynamics," which doesn't carry normative weight.

  **Bug or feature?**

  Is this residue a gap? It's a sign the philosophical claim does less work than it looks. The "intrinsic" vs. "derived" distinction collapses when you remove the conscious observer. In biochemistry, "error" is fully explained by kinetics and selection history. We don't need "Original Intentionality" to explain proofreading; we need free energy differences. The philosophical anxiety arises from trying to isolate "meaning" from "causation." In your field, they are continuous. The residue suggests the dispute is largely about whether consciousness adds a magical property to causation. If you treat the cell as a mindless machine, Dennett wins by default. If you treat the cell as an agent, Searle's demand for grounding resurfaces. The gap isn't in biology's vocabulary; it's in the assumption that "aboutness" needs a foundation beyond successful causal regulation.
