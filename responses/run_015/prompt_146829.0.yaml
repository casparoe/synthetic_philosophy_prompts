answer: |-
  Dear Colleague

  It is a pleasure to engage with this profound and persistent puzzle, for the stalemate you describe is indeed one of the most frustrating features of contemporary bioethics. Having spent some time reflecting on the structural contours of the disagreement, I am inclined to diagnose the situation not as a purely verbal dispute, nor as a simple conflict over empirical facts, but rather as a complex hybrid of talking past one another and deep substantive divergence regarding metaphysics and moral ontology. The debate has stalled because the two dominant frameworks, Thomson's and Marquis's, are addressing logically distinct questions while employing a shared vocabulary that obscures this divergence, all while resting upon foundational ethical commitments that are ultimately incommensurable.

  To see why the disagreement is partly structural, we must look closely at how the questions differ. Thomson's violinist argument is fundamentally concerned with the limits of obligation and the permissibility of withdrawing life-sustaining support. It asks whether the pregnant person is morally required to remain connected to the fetus. By contrast, Marquis's future-like-ours argument is concerned with the wrongness of killing and the moral status of the entity being killed. It asks whether the fetus possesses a valuable future that makes depriving it of life a serious moral harm. In many medical contexts, withdrawing support and killing are distinct acts, but in abortion, they are conflated. The stalemate arises because Thomson-defenders answer the question about obligation with a negative, while Marquis-defenders answer the question about moral status with a positive, and neither side successfully bridges the gap to show why their answer should override the other. When recent defenders of abortion rights shift from the kidnapping analogy to one of biological interdependence, they are attempting to strengthen the obligation side of the equation by suggesting that the unique nature of gestation creates special duties. However, critics rightly point out that even if special duties exist, they may not override the fundamental right to bodily integrity. Thus, the sides are often arguing past one another, one focusing on the agent's liberty and the other on the patient's right, without a shared metric to weigh liberty against life.

  Beyond this structural mismatch, there is a substantive metaphysical disagreement regarding potentiality that cannot be resolved merely by clarifying terms. You note the shift between treating potentiality as a modal property versus a teleologically directed one, and this is crucial. If potentiality is merely modal, meaning any entity could potentially become something else given the right external conditions, then the moral weight of the fetus is significantly diminished, as a gamete or even a skin cell has some modal potential. However, if potentiality is teleological, meaning the organism possesses an internal directedness toward maturity, the claim for moral status is stronger. This is not a verbal dispute about the word potential, but a deep philosophical divergence about the nature of biological organisms and whether internal teleology carries moral significance. Those who reject Aristotelian metaphysics will naturally find the teleological argument unpersuasive, while those who accept a robust view of biological nature will find the modal reductionist view inadequate. Until there is consensus on the metaphysics of biological life, this line of argument will remain deadlocked, as it relies on first principles that are themselves contested.

  Furthermore, we must consider whether hidden empirical questions are doing the heavy lifting, particularly concerning consciousness and sentience. While both Thomson and Marquis attempt to construct arguments that hold regardless of fetal consciousness, in practice, public and philosophical intuition often hinges on when the fetus becomes a subject of experience. If the fetus cannot feel pain or possess consciousness, the harm of depriving it of a future seems abstract compared to the concrete burden of pregnancy. However, if one accepts Marquis's premise that the value of a future does not depend on current consciousness but on the capacity for future valuation, then empirical facts about sentience matter less. Conversely, if one views moral status as gradient and dependent on cognitive capacity, then empirical findings about neural development are decisive. The stalemate persists because the empirical data does not dictate the moral weight we assign to it. Knowing precisely when neural activity begins does not tell us whether that activity grants a right to life that overrides bodily autonomy. Thus, while empirical clarity is necessary, it is not sufficient to resolve the normative conflict.

  Given this diagnosis, what would count as progress? I do not believe we should expect a knockout argument that will satisfy both sides, for the disagreement rests on foundational values that are likely incommensurable. However, conceptual progress is possible and indeed necessary. We need to disentangle the question of moral status from the question of bodily obligation. Progress would look like a widespread acknowledgement that one can consistently believe the fetus has a significant moral status while also believing that the pregnant person is not obliged to sustain it, or vice versa. This would shift the debate from a binary conflict over whether abortion is murder or a right, to a more nuanced discussion about the conditions under which the obligation to sustain life becomes enforceable. Additionally, a deliberate change of question might help. Rather than asking when life begins or when autonomy ends, we might ask what kind of social and biological support would minimize the conflict between fetal potential and maternal autonomy. If the cost of gestation were socially and medically reduced, the Thomsonian calculation would shift.

  Ultimately, I suspect the central question is ill-posed insofar as it demands a single verdict on a practice that involves incommensurable moral dimensions. We are asking the law and morality to solve a tragic conflict where values collide without a common currency. Progress, therefore, may not be a resolution but a maturation of the discourse. We should aim for a framework that acknowledges the moral remainder of abortion, recognising that even if it is permissible, it may involve a loss, and even if it is restricted, it involves a profound imposition. By moving away from the hope of a geometric proof and towards a politics of tragic choice, we might find a way to coexist despite the stalemate. The goal should not be to win the argument, but to understand why it cannot be won, and to structure our laws and ethics in a way that respects the gravity of both the future-like-ours and the bodily autonomy at stake.

  Yours sincerely

  The Philosopher
