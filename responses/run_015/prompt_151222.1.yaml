  # JOINT ADVERSARIAL-COLLABORATION STATEMENT
  **Subject:** Scope of Evolutionary and Physical Explanation in Higher-Order Phenomena
  **Signatories:** Proponent of Comprehensive Mechanism (Student A) & Proponent of Functional Autonomy (Student B)

  ### I. AGREED CLAIMS AND DEFINITIONS

  1.  **Rejection of Supernatural Skyhooks:** Both parties agree that "Skyhooks"—defined as miraculous, non-natural interventions that suspend physical law to create complexity ex nihilo—do not exist. All phenomena arise within a naturalistic framework governed by physical laws and historical processes.
  2.  **Definition of Cranes:** Both parties accept "Cranes" as legitimate bottom-up mechanistic explanations (e.g., natural selection, neural computation, physical causation) that lift complexity from simpler substrates. We agree that Cranes are the primary engine of biological adaptation and structural complexity.
  3.  **Definition of Greedy Reductionism:** Both parties define "Greedy Reductionism" as the methodological error of assuming that identifying the causal origin of a phenomenon provides a complete account of its current function, validity, or normative force. We agree that explaining *why* a belief exists is logically distinct from justifying *whether* that belief is true or binding.
  4.  **Scope of Evolutionary Success:** We agree uncontroversially that evolutionary explanation successfully accounts for physiological adaptations, behavioral instincts, and the development of cognitive hardware (e.g., visual processing, language acquisition devices).
  5.  **Boundary of Dispute:** The disagreement is not ontological (both are naturalists) but explanatory. The dispute concerns whether bottom-up mechanistic accounts can fully reconstruct the *normative authority* of morality and the *objective necessity* of mathematics without explanatory remainder.
  6.  **Empirical Commitment:** Both parties agree that no philosophical position should block empirical inquiry. Claims regarding autonomy or reducibility must remain sensitive to new data from neuroscience, anthropology, and evolutionary psychology.
  7.  **Status of Emergence:** We agree that "emergence" describes systems where higher-level properties arise from lower-level interactions. The disagreement lies in whether these emergent properties possess causal or normative autonomy that cannot be fully mapped back to their constituent mechanisms.

  ### II. DISAGREEMENTS, CRUXES, AND PRE-REGISTERED PREDICTIONS

  | Domain & Disagreement Formulation | The Crux (Update Condition) | Concrete Case / Argument | Student A Prediction (Comprehensive Mechanism) | Student B Prediction (Functional Autonomy) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Moral Normativity**<br><br>**Formulation:**<br>• **Student A:** The "binding force" of moral reasons is a subjective experience generated by evolutionary pressures to enforce cooperation; genealogy exhausts the explanation.<br>• **Student B:** While origins are evolutionary, the *authority* of moral reasons (e.g., "unfairness is wrong") operates as an autonomous normative standard that cannot be validated solely by fitness benefits. | **Does predictive success regarding the *origin* of a moral norm explain its *validity*?**<br><br>*Update Condition:* If a moral norm is shown to persist universally despite imposing a net fitness *cost* without reciprocal benefit, Student A must concede autonomy. If moral intuitions track fitness maxima perfectly even when they contradict abstract fairness, Student B must concede reductionism. | **Altruistic Punishment in Isolated Societies**<br>Individuals in small-scale societies incur personal costs to punish norm-violators, even when anonymous and without future reciprocity. | This demonstrates a hardwired "strong reciprocity" heuristic selected for group-level fitness. The feeling of "ought" is an illusion masking a fitness strategy. | This demonstrates a commitment to fairness as an end in itself. The cost incurred proves the norm is not merely instrumental to survival, indicating genuine normative authority. |
  | **2. Mathematical Convergence**<br><br>**Formulation:**<br>• **Student A:** Cross-cultural agreement on mathematical truths (e.g., primes) results from shared neural architecture shaped by physical reality; math is a refined tool of cognition, not access to abstract objects.<br>• **Student B:** Convergence suggests independent access to mind-independent abstract structures; reducing proof to neural firing misses the objective necessity that compels assent across different cognitive architectures. | **Is mathematical convergence best explained by shared biology or independent abstract access?**<br><br>*Update Condition:* If mathematical discovery is shown to be strictly limited by specific neural constraints that vary between populations, Student B must concede reductionism. If distinct cognitive architectures (e.g., AI vs. Human) converge on identical proofs despite different processing methods, Student A must concede autonomy. | **Independent Discovery of Prime Number Theorems**<br>Distinct civilizations (e.g., Ancient Greece, Classical India) developed similar number theory without contact. | This is convergent cognitive evolution. Different brains running similar "software" optimized for pattern recognition in a quantitative universe arrive at the same local maxima. | This is tracking of mind-independent truths. The fact that distinct brains "find" the same theorems suggests the theorems exist prior to and independent of the finding. |
  | **3. Downward Causation**<br><br>**Formulation:**<br>• **Student A:** Apparent "downward causation" (mind affecting body) is always decomposable into micro-physical causal chains; autonomy is epistemic, not ontological.<br>• **Student B:** Functional autonomy allows higher-order states (e.g., deciding to prove a theorem) to constrain lower-order processes in a way that is causally real, not just descriptive. | **Can higher-order intentions constrain lower-level processes without remainder?**<br><br>*Update Condition:* If a specific mental intention can be shown to alter physical outcomes in a way not predictable by micro-physics alone, Student A updates. If every mental constraint is shown to be fully predictable by prior physical states, Student B updates. | **Neuroplasticity via Deliberate Practice**<br>Structured cognitive training (e.g., learning logic) physically alters brain structure over time. | The physical changes are driven by micro-level Hebbian learning rules triggered by input. The "decision" to practice is just a prior physical state in the chain. | The abstract goal (learning logic) organizes the physical changes. The *content* of the thought, not just the energy, directs the physical restructuring, demonstrating functional downward causation. |
