prompt: |-
  I'm writing this as a senior in an advanced philosophy of science elective at my high school, where a sustained disagreement has emerged between two classmates regarding the scope of evolutionary and physical explanation. One student maintains a strict crane-only position: she contends that every higher-order phenomenon—including consciousness, mathematical reasoning, and moral normativity—can eventually be reconstructed through layered bottom-up mechanisms without remainder, and that any talk of autonomous downward causation or irreducible emergence functions merely as a disguised skyhook that blocks empirical inquiry. The other student accepts cranes for biological adaptation but rejects greedy reductionism: he grants that evolutionary processes build complex structures incrementally, yet insists that in domains achieving functional autonomy—such as normative reasoning or formal proof—reducing the phenomenon to its origins strips away exactly what requires explanation, namely its authoritative or objective force, without needing to invoke any mysterious skyhook.

  Please draft the joint adversarial-collaboration statement that these two students could both endorse after careful negotiation. The document should contain: (1) a numbered section of agreed claims clarifying what cranes, skyhooks, and greedy reductionism entail, specifying where evolutionary explanation succeeds uncontroversially and where its limits are genuinely disputed; (2) precise, neutrally worded formulations of the residual disagreements, with each formulation phrased so that the respective camp recognizes it as its own view rather than a strawman—particularly regarding whether evolutionary genealogy can account for the binding force of moral reasons and whether cross-cultural mathematical convergence is better explained by shared neural architecture or by independent abstract access; (3) the cruxes, defined as sub-questions whose resolution would cause at least one side to update, including specifically whether predictive success in evolutionary psychology explains the authority of moral norms or merely describes their genealogy; and (4) for each crux, a concrete case or argument both parties accept as relevant—such as the convergence on altruistic punishment norms across isolated societies, or the independent discovery of prime-number theorems—together with each side's explicit, pre-registered prediction of what that case demonstrates. Format the output as a numbered agreed-claims section followed by a disagreements table, avoid any request for external bibliographies, and ensure that no disagreement is presented as merely verbal.
