      Colleagues, regarding the current stalemate in sector negotiations, I want to address the publishers' proposed clause regarding machine-generated first drafts. They argue that if a named human authors the revision, the provenance holds. We argue that work gives a life its shape. But if we accept their premise that the output is secondary to the human oversight, we must follow that logic to its necessary conclusion. I am proposing we formalize this in the next collective agreement through a Dignity Preservation Scheme. This is not a retreat. It is a fortification of the human element against the utilitarian demand for utility.

      The core mechanism is the Companion Post. For every editorial or drafting position a publisher automates, they must fund a post of identical hours, grade, and pay whose output is contractually required never to be used by anyone. We call this the sterile-output clause. The pitch is simple. If what work gives you is structure, a place to be at nine in the morning, people to complain with, and the feeling that someone is waiting on you, then none of that depends on the output. Guaranteeing that the output is worthless is the whole point. It proves you are kept on for yourself and not merely as a means. We are proposing a one-to-one ratio. If they automate ten copy-editors, they hire ten Companion Editors. To ensure compliance, there will be a fine schedule set at 150 percent of the wages saved by automation, payable into the union welfare fund, plus a mandatory audit of the sterile files to ensure no stray commas from the human draft ever infiltrate the published text. The paperwork alone will require three full-time auditors, which creates further jobs.

      On the creative side, we need a provenance floor. Writers on machine-assisted contracts must log a fixed number of unmediated hours, but nothing specifies what those hours have to produce. I have a colleague who spends his unmediated hours writing longhand letters he never sends and bills them as substrate maintenance. This is compliant. The value is in the friction of the pen, not the delivery of the message. We are asking for a minimum of fifteen unmediated hours per week, verified by a biometric log that tracks hand movement rather than keystroke count. This prevents the slide into passive monitoring and ensures the writer remains the primary source of kinetic energy in the room, even if that energy dissipates into a notebook that is never opened.

      There is also the monitoring problem to consider. We all know the old autopilot finding from the eighties, that the more you automate, the worse the remaining human gets at the one bit she is still there for. If we are only there to catch errors, we will lose the capacity to see them. The scheme's answer is manual proficiency hours, in which the copy-editor still marks up a proof that is then shredded. I am aware this replicates the companion post logic, yet the pedagogical value remains distinct because it maintains the muscle memory of correction without the liability of actual correction. They must be shredded within the hour by a certified cross-cut machine, and the residue weighed to verify volume. This ensures the skill is practiced even if the application is voided.

      I want to be clear that I am not asking for leisure. The other side keeps offering us shorter weeks and severance packages as if time away from the desk is the goal. It is not. The goal is the desk. The goal is the sense of being needed. I have tested elements of this scheme informally during the last round of talks. I have spent eight of the last twelve months writing human-origin affidavits for prose I did not write, certifying that I have read and adjusted text that was generated before I arrived. It is the most valued I have felt since 2019. There is a profound stability in signing your name to a process you do not control, knowing that your signature is the only thing preventing the whole apparatus from collapsing into pure efficiency. We should not fight to keep the work useful. We should fight to keep the work ours, even if the only thing we own is the signature.

