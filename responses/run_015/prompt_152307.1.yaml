          *   *The Defeater:* If the *mens rea* (intent to destroy) and *actus reus* (killing, causing serious harm) are identical, but the *victim identity* (political vs. ethnic) changes, does the moral horror change? If the answer is "no," then the narrow definition is morally arbitrary.

      *   **Point 2: Lemkin's Intent (The Historical Archive):**
          *   *User's Claim:* Lemkin intended a sharp boundary.
