          *   *The Defeater:* The 1948 Convention was a *betrayal* of Lemkin's concept, not a refinement. The Soviets and Western powers stripped it down. So, appealing to Lemkin to support the *narrow* definition is historically inaccurate. He wanted cultural genocide included.

      *   **Point 3: The Arbitrary Protection of Political Groups:**
