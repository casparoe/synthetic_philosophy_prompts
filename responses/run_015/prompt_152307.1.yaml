          *   *Candidate 2: Stalin's Purges/Golodomor.* Targeting Ukrainians (national) vs. Kulaks (class). The Holodomor is often argued as genocide against Ukrainians, but the de-kulakization was class-based. If the method is starvation to destroy a group, is the *type* of group the moral pivot?
