  **QRB Omission Causation Procedure**

  **Step 1: Normative Duty.** Was the act required by binding protocol/order?
  *   **Pass:** Yes.
  *   **Hard No:** No. (Best practice ≠ duty). Stop. Not a causal factor.
  **Step 2: Counterfactual Dependence.** If acted timely, would harm likely be prevented?
  *   **Pass:** Yes. (Use clinical evidence, not hindsight).
  *   **Hard No:** No. (Harm inevitable). Stop. Not a causal factor.
  **Step 3: Joint Omissions.** Did multiple staff fail distinct duties?
  *   **Action:** Mark all breaches as causal. Do not select single "primary" ommitter.
  **Handoff:** Escalate if protocol is ambiguous or values conflict.

  **Applications:**
  1.  **Nurse Vitals:** Protocol exists; escalation likely prevents code. **Verdict: Causal.**
  2.  **Physician Imaging:** Protocol absent (best practice only) AND image wouldn't change outcome. **Verdict: Not Causal.** (Unwelcome: Clear judgment error excluded from causal report).
  3.  **Two Nurses:** Both had duty to verify; either verification prevents error. **Verdict: Both Causal.** (Unwelcome: No exoneration for "assumed other did it").

  **Limitations:** This identifies system contributors, not individual blame or legal liability. It cannot resolve protocol ambiguity. It assumes protocols are clear; if protocol interpretation is disputed, this tool stops. It does not determine negligence.

  **Philosophical Distinctions:**
  *   **Settled:** Clinical causation requires counterfactual dependence (harm avoided if acted) plus normative expectation (duty). Without duty, an omission is a non-event.
  *   **Contested:** Metaphysicians debate if omissions are real causes or explanatory tools. Some claim duty constitutes causation; others claim causation is physical and duty assigns liability. This procedure treats duty as a gate for causal relevance, sidestepping the ontology debate. This pragmatic approach ensures consistency without solving metaphysical puzzles.
