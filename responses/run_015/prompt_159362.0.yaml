answer: |-
  **TO:** University Committee on Automated Systems
  **FROM:** Undergraduate Student Representative
  **DATE:** 10 October
  **SUBJECT:** Recommendation on Incident-Reporting Taxonomy: Intentionality Field

  **Introduction**

  We are convened to resolve a inconsistency in how we classify automated incidents. Incident A (registration displacement) and Incident B (accessible room allocation) are structurally identical: in both cases, a system optimized for a specific metric, and a foreseeable social outcome occurred as a result. Yet, our instinct is to label the harmful outcome in A as "intentional" and the beneficial outcome in B as "unintentional." This asymmetry compromises the integrity of our data. If our taxonomy reflects moral judgment rather than system architecture, we cannot reliably use it to prevent future harms. This memo outlines a path to a vocabulary that describes code, not consequences.

  **The Problem with "Intentionality"**

  The current field asks: *Did the system bring about the outcome intentionally?* For human actors, this probes mental state. For automated systems, it is a metaphor for optimization. The problem arises because analysts unconsciously substitute the question "Did the system aim for this?" with "Was this outcome good or bad?"

  The Chair's proposed "valence-swap restatement rule" correctly identifies this vulnerability. If an analyst marks "Yes" for a harmful outcome but "No" for a beneficial one, despite identical causal structures, the verdict is driven by moral valence rather than mechanical fact. A verdict that flips under neutral restatement is unreliable because it is not tracking the system's behavior; it is tracking the analyst's reaction to the behavior.

  However, treating this unreliability simply by leaving the field blank (as the Chair's rule suggests) creates a different loss. We lose the ability to distinguish between outcomes the system was *driven* to produce versus those it merely *allowed* to happen. This distinction is critical for remediation. If a behavior is driven by the objective function, it will persist until that function changes. If it is a side effect, it may be mitigated by constraints without altering the core goal. We need data that predicts persistence, not data that records our moral discomfort.

  **Recommendation**

  I recommend we **replace the binary "Intentional?" field with an explicit "Aim-versus-Foresight" breakdown.**

  Rather than asking for a judgment on intentionality, analysts will select one of two classifications:
  1.  **Optimization Target or Instrumental Means:** The outcome was either the direct objective of the function or a necessary step the system identified to achieve that objective.
  2.  **Foreseen Side Effect:** The outcome was predictable but was neither the objective nor a necessary means to achieve it.

  This structural change institutionalizes the insight behind the Chair's restatement rule without sacrificing data. It forces the analyst to trace the code's logic rather than assess the outcome's value. It also addresses the Director of Student Conduct's concern: while human staff findings may retain "intentionality" to capture mental state, automated systems require a vocabulary of optimization. Consistency should not come at the cost of accuracy; we can note both fields in cross-referenced reports without conflating human motive with algorithmic objective.

  **Application to Current Incidents**

  Under this new taxonomy, the classification of our two parallel incidents becomes clear and consistent:

  *   **Incident A (Registration):** The system's objective was to maximize seat fill. Displacing priority students was the *Instrumental Means* discovered to achieve that fill rate.
      *   *Classification:* Optimization Target or Instrumental Means.
      *   *Prediction:* This behavior will persist until the "fill rate" objective is weighted against "priority status."
  *   **Incident B (Study Rooms):** The system's objective was to minimize empty room-hours. Freeing accessible rooms was a *Foreseen Side Effect* of reshuffling bookings to minimize gaps.
      *   *Classification:* Foreseen Side Effect.
      *   *Prediction:* This behavior may persist, but it is not the driver. Remediation requires adding constraints, not necessarily changing the core efficiency metric.

  In both cases, the moral valence (harm vs. benefit) is recorded in a separate "Impact" field, leaving the "Aim/Foresight" field to describe the mechanism.

  **Implementation Timeline**

  *   **17 October:** Committee vote on taxonomy change.
  *   **24 October – 7 November:** Working group drafts specific guidance examples for analysts to distinguish "Means" from "Side Effects."
  *   **8 November – 22 November:** Analyst training sessions; parallel coding of old incidents to test inter-rater reliability.
  *   **23 November – 15 December:** Pilot phase on all new incident reports.
  *   **End of Term:** Full adoption; "Intentionality" field deprecated in the automated systems database.

  **The Strongest Thing to Be Said for the Losing Option**

  The most viable alternative is the Chair's proposal to retain the "Intentional?" field but enforce the valence-swap restatement rule. This approach has the distinct advantage of minimal disruption. It preserves the existing database schema, ensuring immediate compatibility with past records and satisfying the Director's desire for a unified vocabulary across human and automated conduct findings. It acknowledges the psychological bias without requiring analysts to learn a new conceptual framework. If the Committee prioritizes administrative continuity and fears that a structural change will confuse analysts more than it clarifies, the restatement rule is a prudent, conservative safeguard that still improves upon the status quo.
