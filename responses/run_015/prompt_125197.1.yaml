answer: |-
  I hear you, and I want to start by saying that what happened with your brother is the exact hinge point where theory usually breaks against reality. The literature loves to argue about whether nudges undermine autonomy in the abstract, but your situation highlights the only distinction that actually matters for your operations meeting: the difference between scaffolding and manipulation. Scaffolding is when you build a structure someone asked for, or would ask for if they could see the blueprint, like your brother's Sunday call. Manipulation is when you hide the structure so they walk into it thinking it was their idea. For your checklist, you need to drop the academic debates about whether defaults are coercive. They aren't, not really. Instead, you need to keep the distinction between transparency conditions. Some nudges work only if hidden, some work even if announced, and some, like the Sunday call, work better because they are announced. That third category is where you want to live. You also need to borrow the medical standard of substituted judgment. When a patient's capacity swings, you don't ask what is objectively best for them; you ask what they would have chosen if they were stable. That shifts the authority from your medical judgment to their values, which is the only way to avoid the fury your brother felt.

  Here is the procedure you can run in ten minutes. First, ask whose end is being served. If the primary beneficiary is the clinic's budget or schedule rather than the patient's health, you need a much higher bar of proof that it helps them too. Second, apply the wall test. Could you print the mechanism of this nudge on the waiting room wall without patients feeling tricked? If the nudge only works because they don't know it's there, it fails. Third, measure the exit cost. Can a patient opt out with the same effort it took to opt in? If opting out requires a phone call but opting in was automatic, that is a tax on agency. Fourth, run the substituted judgment check. If the patient were fully informed and calm, would they thank you for this default? If the answer is I don't know because their values are unknown, you cannot proceed without human consultation. If the answer is no, even if the health outcome is good, it is a hard no. This sequence forces you to identify when you are saving them time versus when you are stealing their choice.

  Let's run this on your three cases. Booking the follow-up before the patient leaves passes. The end is continuity of care, which aligns with patient health. It passes the wall test because you can tell people we schedule everyone before they leave unless they say no. The exit cost is low because they can say no right there. It passes substituted judgment because most people who want to come back would choose the path of least resistance to secure the slot. This is defensible scaffolding. Preselecting the generic in the prescribing dropdown also passes. The end is cost savings and adherence, which benefits the patient directly. It passes the wall test because generics are medically equivalent. The exit cost is low for the prescriber and invisible to the patient, but since the clinical outcome is the same, it doesn't restrict patient agency, only doctor habit. This is efficient standardization.

  The no-show text is where we need to argue. You are proud of it because it cut no-shows by a third, and I understand why. But look at the mechanism. It says you have held a slot for them personally. If that is technically true, it passes the wall test. If it is a social pressure tactic and the slot would have been filled anyway, it is a lie. For a population that has been lied to by the system before, discovering that the personal hold was a script is catastrophic for trust. It works because it induces guilt, not because it reduces friction. This fails the substituted judgment check because if you asked them, do you want us to make you feel guilty so you show up, many would say no. I know you don't want to hear this, but if that text relies on a false claim of personal reservation, you should stop sending it. The health gain of a kept appointment is not worth the long-term erosion of trust when they realize the system is manipulating their obligation. You can keep the reminder, but you must strip the personalization claim unless it is factual.

  I need to be honest about where this procedure won't save you. It cannot resolve value conflicts where the patient's substituted judgment is genuinely unknown. If you don't know what a patient would want, and the choice is between two valid health paths, this checklist will hand you a null result. In those cases, someone just has to decide, and that burden falls on you or the nurse manager. You will have to own that paternalism without the cover of a procedure. Also, this will misfire on your specific population if you assume their distrust is irrational. For Medicaid and uninsured patients, the exit cost is often higher than you think. A phone call to opt out might cost them forty minutes of hold time they don't have. So when you measure exit cost, you have to measure it in their currency, not yours. Finally, this procedure assumes you have the time to ask the questions. In a crisis, you will skip steps. That is unavoidable. But if you keep the wall test and the substituted judgment check in your head, you will catch the worst offenses. You are trying to build a system that cares for people without treating them like projects. That is a hard line to walk, but your brother's anger shows why it is the only one worth walking.
