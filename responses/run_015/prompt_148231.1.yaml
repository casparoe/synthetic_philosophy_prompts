answer: |-
  - "The dependency chain" (~150 words)
  Start with the belief condition. Emotions usually need real objects. Then the knowledge condition (we know it's fake). Then the response condition (we cry anyway). Finally, the rationality condition (conflict). Each step locks the next. If emotions didn't need belief, no paradox. If we thought it was real, no paradox. If we felt nothing, no paradox. The chain forces the contradiction: we believe X doesn't exist, but react as if X does. Without the AI twist, people blame the author. With AI, the "manipulation" escape route closes. You need the response third, otherwise there's nothing to explain. The AI angle tightens the second link because there's no human liar to accuse. Each concept relies on the previous one holding firm. If the first link breaks, the contradiction vanishes. You need to establish that normal emotion requires existence before you can show why fiction breaks the rule.

  - "The carrying case" (~200 words)
  Use a procedural death scene. Imagine an interactive drama where an NPC companion dies. In a show, a writer killed them to make you sad. In the AI version, the code calculated a 40% mortality risk based on your choices and rolled the dice. No human meant for you to grief. The character is just math executing a death state. This strips away the "artist communicating emotion" shield. It leaves you raw: reacting to pixels generated by an algorithm. It makes the irrationality pop because there's no intentional sender, just a receiver (you) feeling pain for something that never existed and wasn't designed to hurt you. In traditional fiction, your friend could say the writer manipulated you. Here, there's no writer. It's just you and the machine. The sadness feels purely internal, which makes the "irrational" charge hit harder. You're crying over random number generation. That isolation forces the group to confront the paradox directly, without blaming a creator's intent. It removes the human element entirely.

  - "Misconceptions in order" (~250 words)
  First, they'll say "It's just a reflex, like jumping at a loud noise." Catch this at step one. Emotions aren't startle reflexes; sadness involves evaluation. If you let this slide, the belief requirement vanishes. Second, "We pretend it's real for fun." Catch this at step three. If we were pretending, we wouldn't call it irrational. The paradox exists because we *know* it's fake while crying. If they argue suspension of disbelief, remind them they aren't actually calling the police for the NPC. Third, "The AI is real, so the threat is real." Catch this at step two. The code is real, the death isn't. Don't let them confuse the medium for the message. Science kids love focusing on the tech. They'll want to debug the AI instead of the argument. If they mix these up, the paradox dissolves into a tech discussion. Keep them focused on the belief-emotion clash, not the neural net. The sequence matters: if they deny the belief requirement early, the rest doesn't matter. Stop the reflex argument immediately. Otherwise they'll spend an hour talking about mirror neurons instead of logic. You need to steer them back to the contradiction every time they drift into hardware.

  - "The check" (~100 words)
  Ask them to write down the three conflicting premises using the AI NPC example. Premise 1: I know this death is code. Premise 2: Sadness requires believing something bad happened. Premise 3: I am sad. If they can state why these three shouldn't coexist logically, they get it. If they just say "AI is weird," they missed the philosphy bit. Make them solve the triangle. Ask: "Which premise would you drop to make this rational?" If they pick one and defend it, they understand the structure. If they say "all are fine," they haven't felt the tension.

  - "What to leave out" (~100 words)
  Skip "suspension of disbelief." It's a cop-out. It suggests we temporarily believe the fiction, which solves the paradox by denying premise two. But we don't actually believe Harry Potter is real, even while crying. Also skip deep dive into "what is emotion." Science kids will love to argue neuroscience, but that sidesteps the logical contradiction. Keep it on the rationality of the state, not the biology. We're testing logic, not wiring. Don't get bogged down in defining sadness. Just accept it happens. The goal is to show the conflict, not resolve the nature of feeling.
