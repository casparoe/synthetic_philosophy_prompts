answer: |-
  Elias is a committed consequentialist software engineer at a small nonprofit developing educational tools. For three years, he has built a unique open-source interface designed to teach logic through a specific visual metaphor he invented; this project is his ground project, constitutive of his professional identity and sense of authorship. His director demonstrates that swapping Elias's interface for a generic, slightly more user-tested module from a partner organization will increase student engagement by 15% across the network, helping 5,000 more children learn basics this year. The swap requires only copying a file—no extra labor, no contract violation, no promise broken, and no deception. The utility gain is significant and clear; the personal cost is not effortful sacrifice but existential displacement. Elias endorses maximizing reasoning, yet complying requires him to shelve his own creation not because it is flawed, but because it is *his* rather than the most efficient tool available.

  (i) Act utilitarianism requires Elias to swap the interfaces. The calculus is straightforward: the welfare gain for 5,000 students outweighs the frustration of one engineer's artistic vision, and since the action carries no deontological baggage (no lying, no promise-breaking) and minimal effort cost, there is no indirect utilitarian reason to hesitate. The verdict follows directly from the principle of maximizing overall well-being. (ii) The integrity objection fires here on the "ground projects" reconstruction: integrity consists in actions flowing from commitments that give an agent's life substance and continuity. By requiring Elias to step aside from the project that constitutes his professional identity whenever the neutral calculus dictates, utilitarianism alienates him from his own agency; he becomes a channel for utility rather than the author of his work. The objection is not that the cost is too high (demandingness), but that the *source* of the action is external to his constitutive commitments. (iii) The one-thought-too-many complaint does not fire because it requires a specific feature absent here: a personal relationship whose value consists in non-calculatory immediacy. In the wife-in-danger case, invoking moral justification ("I save her because morality permits prioritizing spouses") corrodes the relationship because the relationship demands immediate affection, not mediated justification. In Elias's case, there is no second person to whom immediate affection is owed; the thought "I should do this because it helps 5,000 kids" is not otiose or insulting to a relationship, it is simply the correct motivational structure for a consequentialist professional. The complaint fails because there is no relationship to undermine.

  If we ablate the case by swapping Elias's life project for a commitment to a person—say, a promise to a dying mentor to finish this specific interface, or a marriage where his spouse relies on his artistic completion for their shared life—the verdicts shift. In the marriage scenario, integrity remains violated (he cannot pursue the shared life plan), but one-thought-too-many now switches on: deliberating whether to prioritize his spouse's needs against the 5,000 children introduces a moral mediation that undermines the loyalty constitutive of marriage. This suggests the objections have independent triggers: integrity targets the subordination of *any* ground project (impersonal or personal), while one-thought-too-many targets the subordination of *personal relationships* specifically where moral calculation displaces immediate attachment.

  The strongest utilitarian reply is that Elias's attachment to his project is merely a preference with a high welfare weight; if the frustration outweighs the 5,000 children's gain, utilitarianism says keep the project, and if not, the preference is too expensive. On the reconstruction of integrity used here, this reply begs the question. It treats commitments as contingent desires *within* the utility calculus, whereas Williams's point is that ground projects are the *condition* for there being a subject to have preferences at all. By redescribing a constitutive commitment as a weighable preference, utilitarianism ignores the structural role integrity plays in agency, effectively dissolving the objection by denying the metaphysical status of the self it presupposes. A second reply invokes indirect utilitarianism: generally respecting projects maximizes utility long-term. However, this fails in the specific case where the calculus is transparent and the gain is immediate, leaving Elias alienated in the moment even if the rule is sound.
