      *   **Integrity Objection (Williams):** Utilitarianism requires the agent to step aside from their own projects and commitments when the calculus demands it. This makes the agent a channel for utility rather than an author of their life. It attacks the *source* of action (alienation from one's own motives/projects).
      *   **One-Thought-Too-Many (Williams):** In certain personal relationships (e.g., saving a wife vs. a stranger), bringing moral justification into the deliberation ("I should save her because she is my wife and morality permits/requires prioritizing close ties") undermines the relationship itself. The relationship requires *immediate* non-calculatory concern. Adding the moral thought is otiose or corrosive.
      *   **Key Distinction:** Integrity is about *ground projects* constituting the self. OTTM is about *personal relationships* requiring non-instrumental/non-justificatory immediacy.
