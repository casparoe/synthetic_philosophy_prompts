      *   *Minimum Description Length (MDL):* The practical proxy. Total length = Length(Model) + Length(Data | Model). This is the load-bearing workhorse.
      *   *Parameter Count:* A crude proxy for Length(Model). User explicitly rejected this as insufficient (rightly so).
