      *   *Step 2: Define the "Residuals" (Fit).* How much info is left over?
      *   *Step 3: The MDL Calculation (Proxy).* Use BIC or AICc as a computable approximation of MDL. Why? Because true MDL is hard, but BIC approximates the penalty for complexity in a Bayesian framework. Actually, let's go deeper. Let's use a *Two-Part Code* approach.
