prompt: |-
  I run model selection for a small quant desk, and we do this a few times a month, and the models we pick go into live trading so a bad call actually costs us money. Every time it comes down to "this one fits the data a bit better" vs "this one is simpler" and I just go on gut feel and then second-guess myself. Can you turn the real theory underneath Occam's razor — Kolmogorov complexity, minimum description length, Solomonoff induction, whatever of it is actually true and not just a slogan — into a decision procedue my team can run on a pair of candidate models before we commit? I want the questions in a fixed order, what counts as a good-enough answer to each one, the exact point where the procedure should stop and say "these are too close, this is now a judgment call," and where it has to hand the decision to a person because the step is a value judgment dressed up as math.

  Be straight with me about where Kolmogorov complexity and Solomonoff induction are uncomputable and we're forced onto a proxy, and which proxy is doing the real load-bearing work (I don't want to pretend we're computing the thing we can't compute). And don't let the procedure collapse into "count the parameters" — I know from the theory that a model with a lot of parameters can still have a short description if the parameters come from a simple rule, so parameter count isn't the same as complexity.

  Then run the procedure on two cases: (1) a 3-parameter model that fits our data slightly worse than a 12-parameter model, and (2) a 100-parameter model whose parameters are all generated by one simple formula, up against a 5-parameter model with hand-set weights. For at least one of them I want the procedure to land on an answer I won't love, and I want you to say plainly what the procedure can't do and where it's likely to misfire.

  Constraints so you can calibrate: I'm the only one on the team with a stats background, I've got about 30 min to before the weekly review, and the PM who has to sign off is not a quant, so the final output has to include a one-paragraph justification I can read to her that doesn't require her to know what a prior is. This should be a reusable procedure, not an answer for this week's specific choice.

  Think very carefully before answering, reason it through step by step, and respond in the style of an expert who has actually had to defend a model choice to a skeptical boss.
