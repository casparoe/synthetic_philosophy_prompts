  2.  **Deconstruct the Cases & Identify the Underlying Tension:**
      *   The user is wrestling with the distinction between *Phenomenal Consciousness* (what it *feels* like to be there) and *Access Consciousness* (what information is available for report/control) and *Self-Consciousness* (awareness *that* one is in a state).
      *   *Miriam:* Phenomenal yes, Access/Self no (denial). User says Conscious.
      *   *Baby:* Phenomenal yes, Access/Self no (no language). User says Conscious.
      *   *Ruth:* Phenomenal yes (images), Access no (words). User says Conscious.
      *   *Dog:* Phenomenal yes. User says Conscious.
      *   *Lena:* Phenomenal low/absent (highway hypnosis), Access yes (braking). User says "cheating"/mixed.
      *   *Theo:* Phenomenal high (flow), Access low (no thought). User says *Most* Conscious.
      *   *Toast:* Phenomenal no, Access yes (motor). User says Not Conscious.
      *   *Blindsight:* Phenomenal no, Access yes (guessing). User says Not Conscious.
      *   *Drugged:* Phenomenal yes (feels furious), Access/Reality no (body calm). User says Not Conscious of anger.
      *   *Implant:* Phenomenal no (machine signal), Access yes. User says Not Conscious.

      *   *Key Conflict:* The user values *Phenomenal Consciousness* (the raw feel) over *Access Consciousness* (the ability to report/think about it).
          *   Evidence: Theo (flow) > Lena (autopilot). Baby/Dog count despite no language.
          *   Exception: Miriam (denial) counts (feeling is there). Drugged woman (feeling is there but "wrong") doesn't count? Wait, the drugged woman is *convinced* she is furious but calm. The user says she is *not* conscious of anger. This implies the user thinks the feeling *isn't real*, it's a belief.
