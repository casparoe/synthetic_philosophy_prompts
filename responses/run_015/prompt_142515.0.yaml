      *   *The Lena vs. Theo Problem:* Both are non-verbal, absorbed states. Why is Theo "more conscious"?
          *   Theo: Enriched sensory experience, high responsiveness, "flow."
          *   Lena: Diminished sensory experience, tunnel vision, "zoned out."
          *   Distinction: *Vividness/Intensity of Phenomenology.*

  3.  **Formulate a Principle:**
      *   The user's current rule ("turn attention inward") is too cognitive. It relies on *metacognition* (thinking about thinking). But the user counts the baby and the dog, who likely lack metacognition.
      *   The user counts Theo (no thought) as highly conscious.
      *   Therefore, the principle must be about **Phenomenal Presence** (What it feels like) rather than **Cognitive Access** (What can be reported).
      *   *Proposed Principle:* **"The Light Is On."** A state is conscious if there is *something it is like* to undergo it, characterized by immediate sensory or emotional vividness, regardless of whether the character has words for it or remembers it later.
      *   *Refinement:* Let's call it **The Principle of Phenomenal Resistance.** A state is conscious if the experience imposes itself on the character with a qualitative "feel" that cannot be ignored in the moment, even if it can be denied later.
      *   *Better Refinement for a Writer:* **"The Camera Test."** If the narration were a camera strapped to the character's nervous system, would it record a signal? No, that's physical.
