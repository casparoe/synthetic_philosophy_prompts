      *   *Actually, looking closer:* "Perfectly calm by every measure, but utterly convinced she is furious." User: "Not conscious of anger — she's just wrong about herself." This is tricky. If she *feels* furious, isn't that phenomenal consciousness? The user seems to be distinguishing between *feeling an emotion* and *having a belief about an emotion*. If the body is calm, maybe the "feeling" is actually a *thought* ("I should be angry"). If it's just a thought, and the user excludes inner monologue (Ruth has no words but is conscious), then...
