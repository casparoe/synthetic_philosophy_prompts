          7.  *Sleepwalker/Automaton (Toast):* No memory, automatic. Verdict: Not conscious.
          8.  *Cortically Blind (Blindsight):* Guesses correctly, denies seeing. Verdict: Not conscious.
          9.  *Drugged Woman (False Anger):* Calm body, feels furious. Verdict: Not conscious of anger (wrong about self).
          10. *Neural Implant (Red Stamp):* Machine announces "seeing red." Verdict: Not conscious seeing.
      *   **User's Current Rule:** "Could notice it by turning attention inward, without new evidence." (Access Consciousness-ish).
      *   **User's Struggles:** The rule fails on the Implant, the Drugged Woman, and the Lena vs. Theo distinction.
      *   **New Cases to Test:** Coma patient (tennis imagery), Dog with word buttons.
