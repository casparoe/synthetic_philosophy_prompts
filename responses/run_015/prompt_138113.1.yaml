answer: |-
  Here is the pattern you are looking for, laid out without the padding. You are struggling because you are searching for a monistic theory (one principle) to explain a pluralistic intuition (three distinct moral concerns). Your verdicts do not hang on a single hook. They hang on three.

  Below, I will first dismantle your two half-theories using your own list. Second, I will propose a dual-constraint principle that captures about 90% of your verdicts. Third, I will apply this to your four unsettled cases. Finally, I will tell you exactly which of your gut verdicts are inconsistent with any coherent theory, and what that implies for your paper's thesis.

  ### I. The Autopsy of the Half-Theories

  You asked to test the **Unboughtness Test** (value destroyed by price) and the **Desperation Idea** (exploitation of bad alternatives) against your 21 cases. Here is where they break.

  **1. The Unboughtness Test**
  *The Principle:* A market is wrong if the good's value depends on it *not* being bought.
  *Where it works:* It explains (20) Child's Letter (love bought is not love), (15) Vote for Party (civic duty bought is corruption), and perhaps (1) Brokered Kidney (altruism tainted).
  *Where it fails against your list:*
  *   **(6) Malaria Trial:** You say this is Fine. But the value of the scientific data is partly constituted by the volunteer's willingness to suffer for truth, not money. If they are paid, is it still "sacrifice"? You say yes; Unboughtness says no.
  *   **(8) & (9) Surge Pricing/Roses:** You say Fine. But the value of a Valentine's rose is symbolic/romantic. Buying it at a surge price acknowledges the market mechanism, yet you feel no flicker of wrongness. Unboughtness should condemn commodifying romance, but you do not.
  *   **(13) Private Operation:** You say Fine. But if health is a good whose value is partly "equal access," buying it destroys that value. You distinguish this from (12), which Unboughtness cannot do without adding a clause about *which* system you are in.
  *   **(5) Plasma/Eggs:** You say Fine. Unboughtness typically condemns selling body parts because it turns the self into a thing. Your intuition rejects this.

  **2. The Desperation Idea**
  *The Principle:* A market is wrong if the seller trades due to dreadful alternatives (coercion by circumstance).
  *Where it works:* It explains (1) Brokered Kidney (poor donor, rich recipient), (7) Flood Water (no alternative), (10) Flood Rents (no alternative), and (21) Sterilization (addict vulnerability).
  *Where it fails against your list:*
  *   **(6) Malaria Trial:** You admit volunteers do it because they need the money. By your own description, this is desperation. Yet you say Fine. Desperation Idea demands you condemn it.
  *   **(5) Plasma/Eggs:** Often sold by the financially strained. You say Fine.
  *   **(15) Vote Selling:** A wealthy person selling their vote is not desperate. Yet you say Obviously Wrong. Desperation Idea cannot explain why selling a vote is wrong when the seller is rich.
  *   **(20) Child's Letter:** A child writing for money may not be desperate; they may just be mercenary. Yet you say Not Fine.

  **Verdict on Half-Theories:** Discard them as standalone principles. The Unboughtness Test is too broad (condemns roses, malaria trials). The Desperation Idea is too narrow (misses vote selling, child's letter) and too broad (condemns malaria trials, plasma).

  ### II. The Proposed Principle: Normative Corruption and Predatory Necessity

  To capture your verdicts, you need a **Dual-Constraint Principle**. A market transaction is impermissible if it violates *either* of the following constraints:

  **Constraint A: Normative Corruption (The "Meaning" Constraint)**
  The transaction is wrong if it corrupts the constitutive norm of the social practice or institution involved. Money must not displace the specific reason the practice exists.
  *   *Work done on:* (12) NHS Queue, (15) Vote for Party, (20) Child's Letter, (17) MP Trading (mitigated), (21) Sterilization.
  *   *Why:* The NHS is constituted by need, not ability to pay. Voting is constituted by judgment, not price. A child's affection is constituted by spontaneous regard. Sterilization of the vulnerable touches on eugenic norms of human status.

  **Constraint B: Predatory Necessity (The "Power" Constraint)**
  The transaction is wrong if it exploits inelastic demand during a crisis to transfer welfare from the vulnerable to the privileged without improving the vulnerable's baseline options.
  *   *Work done on:* (1) Brokered Kidney, (7) Flood Water, (10) Flood Rents.
  *   *Why:* In these cases, the seller/buyer has no exit option. The price does not signal scarcity to increase supply (you can't make more flood water or kidneys quickly); it merely rations suffering.

  **How this principle handles your "Fine" cases:**
  *   **(2) Honorarium / (3) State Purchaser:** These pass Constraint B because the state monopsony removes the "wealthy recipient/poor donor" power asymmetry and sets a fixed baseline. They pass Constraint A because reimbursement is framed as cost-covering, not profit-seeking.
  *   **(4) Priority for Donors:** Passes Constraint A. This is a reciprocal benefit within the practice of donation, not a market purchase of the organ itself.
  *   **(5) Plasma/Eggs & (6) Malaria:** Pass Constraint B (usually regulated, not crisis exploitation) and Constraint A (viewed as labor/risk, not corruption of the self).
  *   **(8) Taxis / (9) Roses:** Pass Constraint B. Demand is elastic (you can stay home, buy chocolates instead). Supply can respond (more taxis come out).
  *   **(11) Fast-track Visa / (13) Private Op / (14) Queue for Tickets:** Pass Constraint A. These are *exits* from the public queue, not *corruptions* of the public queue. You are paying for a parallel service, not jumping the line of a public good allocated by right.
  *   **(16) Pay for Turnout:** Passes Constraint A. It facilitates the *act* of voting without purchasing the *choice* of the vote.

  **Where the principle strains (The "Give" Points):**
  *   **(18) Surrogacy:** This is your ambivalent case. Constraint A pulls one way (corruption of procreation/parenting norms); Constraint B pulls the other (if regulated like (3), is it predatory?). Your ambivalence is rational; this case sits on the fault line between "labor" and "intimacy."
  *   **(17) MP Trading:** You say "less bad than (15)." My principle struggles here. Logrolling is technically corruption of the norm (representing constituents), but it is constitutive of legislative compromise. You need a sub-clause: *Corruption is permissible if it is transparent and necessary for the function of the body.*

  ### III. The Four Unsettled Cases

  Here is what the Dual-Constraint Principle implies for your new cases.

  **1. A state monopsony that pays living kidney donors a fixed price with no negotiation.**
  *   **Verdict:** **Acceptable (leaning Fine).**
  *   **Reasoning:** This resolves the failure of Case (1). It removes the "Broker" (intermediary profit) and the "Wealthy Recipient/Poor Donor" asymmetry (Constraint B). It treats the kidney as a compensated contribution to a public good, similar to Case (3) and (2). It does not corrupt the norm of donation (Constraint A) because the state, not the recipient, is the purchaser, preserving the "gift to society" framing.
  *   **Caveat:** Only if the price is an honorarium/reimbursement model, not a "market rate" that incentivizes risk-taking.

  **2. A modest payment towards the funeral costs of someone who donated after death.**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** Fails neither constraint. The donor is dead (no vulnerability/desperation, Constraint B). It does not corrupt the practice (Constraint A); it is a symbolic recognition similar to a medal or certificate, monetized only for utility. It aligns with Case (3).

  **3. A fertility clinic that pays egg donors differently depending on their exam results (price varies with characteristics).**
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** This violates Constraint A (Normative Corruption). While selling eggs (Case 5) is Fine, tiered pricing based on *traits* commodifies the *future child* as a product with specifications, rather than compensating the *donor's labor/risk*. It shifts the transaction from "compensation for burden" to "purchase of genetic quality." This edges toward Case (21) Sterilization (eugenic overtones) and Case (18) Surrogacy (ambivalence). It corrupts the norm of procreation.

  **4. Paying another parent to swap places with you on a school admissions waiting list.**
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** This violates Constraint A (Normative Corruption). School admissions (like the NHS in Case 12) are public goods allocated by right (proximity, need, lottery), not by wealth. Paying to swap is functionally identical to Case (12) Jumping the NHS Queue. It is not an "exit" to a private system (like Case 13); it is a corruption of the public allocation mechanism.

  ### IV. The Hard Truth: Where Your Verdicts Must Give

  You asked me to be plain about which verdicts no tidy principle can accommodate. You have three specific tensions in your list that resist unification. If you want a coherent paper, you must address these.

  **Tension 1: The Malaria Trial (6) vs. The Sterilization (21)**
  *   **The Conflict:** Both involve paid bodily risk/alteration by people who may need the money.
  *   **Your Verdict:** Malaria = Fine; Sterilization = Wrong.
  *   **The Problem:** The Dual-Constraint Principle struggles to distinguish these without importing a "Sanctity of the Body" clause that contradicts your approval of (5) Plasma/Eggs.
  *   **The Fix:** You must argue that the distinction is **Reversibility and Social Value**. Malaria is temporary risk for public knowledge (Research). Sterilization is permanent alteration for private convenience (presumably) or population control.
  *   **The Cost:** You must concede that if the sterilization were for a compelling public health reason (e.g., preventing a genetic disease passed to offspring) and reversible, your intuition might have to shift. Or, you must admit that (21) is wrong *only* because of the history of eugenics, not the market nature. If you keep (21) as Wrong, you are relying on a "Human Dignity" constraint that is distinct from Commodification.

  **Tension 2: The NHS Queue (12) vs. Private Operation (13)**
  *   **The Conflict:** Both result in the rich getting treated faster than the poor.
  *   **Your Verdict:** Queue Jump = Wrong; Private Care = Fine.
  *   **The Problem:** The outcome is identical (inequality of health outcome based on wealth).
  *   **The Fix:** You must lean heavily on **Institutional Integrity**. (12) corrupts the *public* system from within. (13) opts *out* of the public system.
  *   **The Cost:** You have to defend why opting out is morally neutral. If the existence of private care drains staff from the NHS, (13) becomes wrong on consequentialist grounds. Your principle is deontological (about the act), but this case requires consequentialism. You must acknowledge this switch.

  **Tension 3: The Vote (15) vs. The MP Trade (17)**
  *   **The Conflict:** Both trade political power for benefit.
  *   **Your Verdict:** Vote = Wrong; MP Trade = Less Bad.
  *   **The Problem:** Both corrupt representation.
  *   **The Fix:** **Agency.** A voter sells their *judgment*. An MP trades *support* to achieve a *judgment* (legislation). Logrolling is a tool of governance; vote-selling is the abolition of governance.
  *   **The Cost:** You must accept that (17) is only "less bad," not "Fine." Your list says "much less bad," which saves you. Keep that hedge.

  ### V. Conclusion: Is "Commodification" One Thing?

  You asked whether the fact that your verdicts resist a single principle is evidence that "commodification" was never one thing to begin with.

  **The answer is Yes.**

  Your intuitions reveal that "Commodification" is a portmanteau word covering three distinct moral failures:
  1.  **Corruption:** Money displacing the wrong reason for acting (Votes, Love, Public Queues).
  2.  **Exploitation:** Money leveraging desperation to extract welfare (Flood Water, Brokered Kidneys).
  3.  **Degradation:** Money treating the human status as instrumental (Sterilization, perhaps Surrogacy).

  **Advice for the Paper:**
  Do not try to force a single "Theory of Commodification." Your paper will be stronger if you argue exactly this: *The debate over repugnant markets is confused because it treats three distinct objections as one.*
