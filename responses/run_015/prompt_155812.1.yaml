answer: |-
  In Bernard Baars' Global Workspace Theory (GWT), the theatrical analogy maps specific cognitive functions to stage elements: the **stage** corresponds to the global neuronal workspace (typically fronto-parietal networks) where information becomes transiently active; the **spotlight** represents selective attention mechanisms that enhance specific neural firing patterns; the **actors** are the specialized unconscious processors (sensory cortices, memory systems) that compete for attention; and the **audience** comprises the distributed unconscious contextualizing systems that receive the broadcast to update memory, action, and prediction. While this mapping effectively illustrates *access consciousness* (the functional availability of information), the analogy imports unjustified theatrical features that risk circularity: the **director** implies a central executive or homunculus not fully accounted for in decentralized neural nets; the **unified viewpoint** suggests a singular scene contrary to the brain's parallel, fragmented processing; and most critically, the **experiential quality of witnessing** inherent to an audience presupposes a subject for whom the data is "lit up," thereby smuggling *phenomenal consciousness* into a model designed to explain access.

  The disanalogies undermine the two forms of consciousness differently. Regarding *access consciousness*, the analogy falters only on technical grounds, such as bandwidth limitations or the precise mechanism of "broadcasting," which are empirical questions resolvable by neural data. Regarding *phenomenal consciousness*, the analogy fails structurally because neurons receiving a signal do not "watch" it; by depicting the audience as witnesses, the model conflates the *receipt* of information (functional) with the *experience* of information (phenomenal). Consequently, while proponents argue GWT distinguishes the two by defining the workspace functionally, the theatrical imagery conflates them by design, as a "show" inherently implies a viewer, making it difficult to conceptualize the workspace without an implicit experiencer.

  Considering the variant where the broadcast occurs but the auditorium is structurally empty—modules receive signals without an integrated receiver—the functional account of GWT remains intact, as global availability is defined by signal distribution, not reception. However, the theatrical analogy collapses under this condition; a play performed to an empty room is functionally a rehearsal, not a public event, suggesting the metaphor relies on the *presence* of an audience to validate the "conscious" status of the content. This collapse indicates that the analogy explains phenomenal consciousness only by assuming it, using the audience's presence as a proxy for the "light" of experience rather than deriving it from the broadcast mechanism itself.

  Alternative images, such as a public noticeboard or a radio transmission, better preserve the functional account of access while avoiding phenomenological smuggling. A noticeboard makes information publicly available to any subsystem that "reads" it without implying that the board itself is experienced or that a central viewer is required; similarly, a radio transmission exists as a signal regardless of whether a receiver is tuned in. These mechanical metaphors successfully decouple global availability (access) from subjective witnessing (phenomenality), clarifying that GWT describes the routing of data rather than the generation of qualia.

  The theatrical analogy inevitably conflates access and phenomenal consciousness by embedding a witnessing audience within a functional architecture, whereas mechanical metaphors like a noticeboard better isolate global availability from subjective experience.
