answer: |-
  The slogan "diagnoses aren't discovered, they're made" is a rhetorical chameleon. To evaluate it, we must separate distinct ontological and epistemic claims. Below are seven readings ordered from trivial to radical, followed by an analysis of their implications for your case and seminar inferences.

  **Menu of Readings**

  1.  **Lexical Convention:** The *word* "PMDS" is a human invention, not a natural object. (Nominalism about terms). **Verdict:** Trivial platitude. All words are made; this says nothing about the phenomenon.
  2.  **Boundary Conventionalism:** The *criteria cutoffs* (e.g., six months) are decided by committees, not found in nature. (Constructivism about criteria). **Verdict:** Substantive and defensible. Nature offers continua; humans draw lines.
  3.  **Pragmatic Instrumentalism:** Categories are selected for *utility* (insurance, treatment) rather than accuracy. (Pragmatic Constructivism). **Verdict:** Substantive and defensible. Classifications serve goals.
  4.  **Causal Interactionism:** The act of classifying *causes changes* in the classified people (looping). (Hacking's Interactive Kinds). **Verdict:** Substantive and defensible. Labels alter behavior and self-conception.
  5.  **Constitutive Constructivism:** The *experience* of PMDS cannot exist without the concept; the label constitutes the disorder. (Strong Social Constructivism). **Verdict:** Substantive but doubtful. Some symptoms (lesions) predate the label.
  6.  **Local Anti-Naturalism:** Psychiatric kinds lack mind-independent stability because they are interactive; they are not natural kinds. (Anti-Realism about Psych Kinds). **Verdict:** Substantive but doubtful. Interactive kinds can be real without being "indifferent."
  7.  **Global Anti-Realism:** No psychiatric facts exist prior to classification; reality itself is made. (Global Epistemic Constructivism). **Verdict:** False/Self-undermining. Undermines the evidence used to claim construction.

  **Table: Comparative Analysis**

  | Reading | Verdict | Jobs Supported | Relation to Looping | 2018 Cohort | 2029 Cohort |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1. Lexical | Platitude | 1 | Compatible | Made (Term) | Made (Term) |
  | 2. Boundary | Defensible | 1, 2 | Compatible | Made (Criteria) | Made (Criteria) |
  | 3. Pragmatic | Defensible | 2 | Compatible | Made (Choice) | Made (Choice) |
  | 4. Causal | Defensible | None* | Entailed | Discovered | Made (Effect) |
  | 5. Constitutive | Doubtful | 1, 3 | Entailed | Discovered | Made |
  | 6. Anti-Natural | Doubtful | 3 | Entailed | Discovered | Made |
  | 7. Global | False | 1, 3 | Compatible | Made | Made |

  *\*Note: Reading 4 describes looping but doesn't dictate policy (Job 2) or deny reality (Job 3) on its own.*
  *Bold changes in verdict between slices indicate time-indexed instability.*

  **Looping and Realism**
  Reading 4 (Causal Interactionism) is the core of Hacking's view. Crucially, looping does **not** entail anti-realism (Readings 6 or 7). Hacking argues interactive kinds are real *because* they loop, not unreal. They are simply not *indifferent* kinds like quarks. Therefore, looping alone supports neither the conclusion that validators are misguided (Job 3) nor that the question of reality is ill-formed (Job 1). It merely shows the kind is dynamic. Readings 6 and 7 illicitly slide from "the kind changes" to "the kind is not real."

  **Assessing the Inferences**
  (a) *"Criteria were written by a committee, so the kind is a committee artifact."*
  Valid only under Reading 7 (Global Anti-Realism). Under Reading 2 (Boundary Conventionalism), the *boundaries* are artifacts, but the underlying phenomenon (e.g., the 2018 lesion pattern) may be discovered. This inference conflates the map with the territory.

  (b) *"The label changes the people who have it, so the kind is not real... cannot be a natural kind."*
  Valid under Reading 6 (Local Anti-Naturalism), but false under Reading 4 (Causal Interactionism). Looping proves the kind is interactive, not that it is unreal. The 2029 cohort is real *as* a looping effect. The error is assuming "natural kind" is the only form of reality.

  (c) *"These individuals would not have had this experience without the label, so the category cannot be explanatory."*
  Valid under Reading 5 (Constitutive Constructivism). However, if the category explains why the behavior changed (via looping), it *is* explanatory. The label explains the 2029 phenotype even if it constituted it. This inference fails to see constitutive factors as explanatory ones.

  **The Professor's Three Jobs**
  No single reading supports all three jobs.
  *   **Job 1 (Dissolve "real?"):** Requires Reading 1 or 7. Reading 1 is too weak for Jobs 2 and 3. Reading 7 is too radical for Job 2 (if nothing is real, cost-benefit analysis lacks fixed targets).
  *   **Job 2 (Policy Choice):** Requires Reading 3 (Pragmatic Instrumentalism). This suggests we optimize criteria for utility. However, your suspicion is correct: looping degrades the evidence needed for this optimization. As validators drift (2018 vs. 2029), the "cost-benefit" calculation loses stable inputs. The treatment effect shrinks; the phenotype shifts. A pragmatist needs fixed consequences to optimize; looping ensures consequences evolve.
  *   **Job 3 (No Natural Kind):** Requires Reading 6. This contradicts Reading 3 slightly (which allows natural kinds but ignores them for utility) and Reading 4 (which allows real interactive kinds).

  The slogan's rhetorical power depends on sliding from Reading 2 (defensible boundary drawing) to Reading 6 (anti-naturalism) without marking the move. It uses the truth of "criteria are chosen" (Reading 2) to smuggle in "reality is made" (Reading 7).

  **Conclusion**
  Your professor most likely meant **Reading 3 (Pragmatic Instrumentalism)** bolstered by **Reading 6 (Local Anti-Naturalism)**. They intend to say that because psychiatric kinds are unstable (Reading 6), we should treat them as policy tools (Reading 3). However, this combination is unstable. If kinds are too mutable to be natural (Job 3), they are too mutable to serve as stable targets for policy optimization (Job 2). The 2029 cohort shows exactly this: the category changed the people so much that the original policy rationale (vocational rehab for a lesion-based deficit) no longer fits the new population (online community members with functional fatigue). To maintain coherence, you must choose: either accept looping kinds as real but dynamic (Reading 4), or accept they are mere tools and abandon the search for validators entirely (Reading 3/6). You cannot have stable policy targets in a world of radical looping.
