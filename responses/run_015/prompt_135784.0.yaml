answer: |-
  You must sequence derived intentionality before architecture to prove that pixels are merely data proxies, using the concept of "weight" to trace the causal chain back to human biology instead of model sensors.

  **Teaching Arc & Dependency Order**
  1.  **Derived vs. Intrinsic Intentionality (10 mins):** Establish that symbols have no meaning unless attached to a system with goals and sensors. A map is not the territory; a weight matrix is not the world. This must land first because if they believe tokens have inherent semantic value, the rest of the argument fails.
  2.  **The Proxy-Grounding Cascade (15 mins):** Introduce the carrying example here. Show the chain: Gravitational Force -> Human Proprioception -> Human Label ("Heavy") -> Digital Annotation -> Pixel Array -> Model Embedding. Emphasize that the model only touches the last two links.
  3.  **The Causal Gap (10 mins):** Explain that while the data *contains* information about the world, the model has no causal coupling to it. It cannot be surprised by gravity; it can only be surprised by loss functions.
  4.  **Synthesis & Check (5 mins):** Drive home the distinction between statistical alignment and grounding.

  **Carrying Example: The Word "Heavy" on an Image of a Rock**
  Use this because weight is invisible to cameras. A vision encoder sees texture and shape (pixels), not mass. When the model predicts "heavy," it is not reacting to gravitational pull on its own chassis; it is mimicking a human who *did* feel gravity. This makes the proxy cascade visible: the grounding exists in the annotator's muscles, not the model's GPU.

  **Why Not the Chinese Room**
  Skip Searle because it invites metaphysical debates about consciousness that CS students dismiss as "philosophy vs. engineering." They believe functional equivalence equals understanding. The proxy cascade is an engineering argument about data provenance and causal history, which resonates better with their mindset than abstract semantics.

  **Mapping Misconceptions & Intervention Points**
  *   **"The image encoder gives direct access":** Head this off during **Step 2 (Cascade)**. Clarify that the encoder processes pre-digitized arrays, not photons hitting a sensor owned by the model. The "eye" belongs to the camera manufacturer and the dataset curator, not the model.
  *   **"Grounding is just correlation in high dimensions":** Address this in **Step 3 (Causal Gap)**. Acknowledge the correlation exists but ask *whose* correlation it is. It is the correlation between human sensory experience and human labels, statistically compressed, not model experience and world states.
  *   **"Humans learn language from other people too":** Counter this in **Step 1 (Intentionality)**. Humans have intrinsic grounding (nociceptors, proprioception) to anchor the symbols they learn from others; models have only derived grounding (other symbols/pixels) with no anchor.

  **Explicit Refusals**
  Do not cover Searle's biological naturalism, qualia, or the hard problem of consciousness. These are dead ends for this audience. Also refuse to debate AGI timelines; keep the focus on the current architecture's causal limitations.

  **Check Question**
  "When your model outputs the token 'heavy' for a rock image, trace the causal lineage of that prediction back to its source: identify the exact link in the chain where gravitational force physically interacted with a sensor, and explain why that sensor was not part of the model's hardware."
