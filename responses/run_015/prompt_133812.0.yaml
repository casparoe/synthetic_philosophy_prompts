prompt: |-
  at dinner last week two friends got into it over Malthus. one said he's clearly falsified: food yields went exponential, birth rates tanked in developed countries, the catastrophe never came. the other said he's "right but early" — the pressure mechanism is sound, he just missed the demographic transition and green revolution that bought us centuries. first friend said thats pure goalpost-moving; if you can always push the crisis date forward the theory is unfalsifiable and useless. second said not all rescues are equal: there's a real distinction between identifying a genuine structural break (like nitrogen fertilizer or contraceptive tech) and an ad hoc excuse. first asked okay but whats the principled line? without one youre just saving theories you like. second suggested maybe it's whether the rescue explains other things independently — demographic transition theory predicts urbanization too, not just saving Malthus. first said thats still giving him credit for a prediction he never made: he said inevitable collapse, not "collapse unless culture radically shifts reproduction norms." neither would drop it. can you go through each exchange and rate who's right? and is "right but early" actually a meaningful category for long-run predictions or just a way to avoid admitting failure?
