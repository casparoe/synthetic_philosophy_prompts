      *   When is it valid? When the core constraint remains valid but the *timing* depended on variables not yet understood (e.g., tech elasticity).
      *   *Verdict:* It's a valid category *if* the "delay" is explained by a robust, independent theory (like F2 argued). It's evasion if it's just "wait 10 more years."

