answer: |-
  ### The implicit theory

  The editorial practice presupposes a procedural theory of confirmation, akin to severe testing or methodological falsificationism, rather than a purely logical relation between proposition and fact. On this view, evidence confirms a hypothesis not merely by fitting it, but by surviving a test that would likely have failed if the hypothesis were false. Crucially, the severity of the test depends on the constraints placed on the investigator before encountering the data. If a hypothesis is formulated after seeing the data, the test lacks risk; the investigator could have adjusted the hypothesis to accommodate any outcome. Thus, the practice treats confirmation as a three-place relation involving the hypothesis, the evidence, and the history of inquiry. It assumes that without temporal precedence, fit is indistinguishable from overfitting. The norm implies that scientific credit attaches to the restriction of degrees of freedom undertaken by the researcher. By penalizing post-hoc formulation, the committee asserts that the reliability of an inference depends on the integrity of the process generating it. This view holds that accommodation is epistemically inferior to prediction because accommodation allows the theory to be tailored to noise, whereas prediction risks falsification. Consequently, the policy treats pre-registration not merely as administrative hygiene but as the constitutive condition for earning confirmatory credit, embedding the context of discovery firmly within the context of justification. It assumes a landscape of plausible alternatives where unrestricted search guarantees a fit, making the act of prediction the only reliable signal of genuine explanatory power rather than curve-fitting. Furthermore, this theory relies on a social-epistemic assumption: that readers cannot independently audit the search space. Because the journal cannot verify how many alternative hypotheses were discarded before submission, it must rely on the timestamp as a proxy for honesty. The policy essentially outsources the verification of the hypothesis space to the temporal archive. It posits that the only way to guarantee a hypothesis wasn't cherry-picked from a vast space of possibilities is to prove it existed before the selection could occur. Therefore, the implicit theory is not just about logic, but about managing trust in a high-dimensional modeling environment where transparency is imperfect. It prioritizes the warrant for belief over the probability of truth, assuming that without procedural constraints, reported likelihoods are systematically inflated by undisclosed flexibility.

  ### Strict presuppositions vs. convenient fits

  The practice cannot survive without the assumption that unrestricted hypothesis search inflates false-positive rates beyond nominal statistical levels. If fitting data post-hoc did not inherently capitalize on chance, the penalty would be unjustified. It also requires that pre-registration is a reliable proxy for fixed hypotheses; if researchers routinely deviate from registered plans without disclosure, the timestamp loses its force. However, the practice sits well with, but does not strictly require, the claim that all old evidence is worthless. It can accommodate the physics counterexamples by distinguishing between accommodation (tuning parameters to fit) and explanation (deriving values from fixed principles). Similarly, it does not strictly demand that exploratory work be unpublished, only that it be labeled as such. The core presupposition is the link between temporal order and error control; the peripheral convenience is the blanket heuristic that equates "post-hoc" with "invalid" rather than "requiring stricter scrutiny."

  ### Oldness, double-duty, derivability

  These are not the same worry. Oldness fails as the primary driver because general relativity's explanation of Mercury's perihelion was celebrated despite the evidence being decades old. If oldness were the sin, Einstein would gain no credit. Double-duty is closer: it identifies the risk of using data to tune parameters and then test them. However, Einstein also used known data to validate his fixed equations. The discriminating factor is derivability within a constrained space versus flexibility within an unconstrained space. In the Mercury case, the theory fixed the precession value; no tuning was possible. In HARKing, the hypothesis is selected because it fits. Our practice tracks double-duty (overfitting risk), but uses oldness as a noisy proxy. The derivability audit is the philosophical refinement: it asks whether the hypothesis was uniquely demanded by the theory or merely compatible with the data among many options. The committee's norm conflates these, penalizing old evidence generally because auditing derivability is too costly. We punish the temporal signal because we cannot easily measure the structural constraint. Thus, the practice tracks the risk of selection effects (double-duty), mistakenly operationalized as temporal priority (oldness), while derivability remains the unmeasured ideal. The crucial distinction lies in the size of the hypothesis space searched. In physics, the theory restricts the space to one viable model before looking at the specific number. In psychology HARKing, the researcher implicitly searches a large space of potential correlations until one shines. The oldness worry is actually a heuristic for unconstrained search. When biologists cite homologies, they aren't fitting parameters; they are showing a unified framework makes sense of disparate facts without adjustment. Our committee's policy assumes that without pre-registration, every fit is a result of tuning. Therefore, while the three worries are distinct logically, the practice treats oldness as the observable symptom of the double-duty disease, ignoring derivability because it requires subjective judgment about theoretical rigidity that editors wish to avoid.

  ### The novelty weight

  A single scalar novelty weight is incoherent because it conflates process integrity with evidential strength. A hypothesis is either supported by the data or it isn't; the "weight" actually measures our trust in the reported likelihood, not the likelihood itself. A derivability audit would need to measure the size of the effective hypothesis space searched relative to the data's degrees of freedom. This is practically unmeasurable. How do we quantify "ingenuity" or count the implicit models a researcher considered and discarded? Pre-registration is a binary proxy for this, but a 0-to-1 scale implies a granularity of "partial pre-registration" that doesn't map cleanly onto error rates. Either the analysis plan was fixed, or it wasn't. Multiplying evidential scores by this weight assumes independence between the hypothesis construction and the data fit, which is precisely what is in doubt. Instead of a scalar, the policy should mandate disclosure of the search process. The weight suggests a mathematical precision that masks a qualitative judgment about researcher degrees of freedom. It transforms a qualitative warning into a quantitative false positive, implying compensability where none exists.

  ### Under a strict probabilist picture

  Under strict probabilism, confirmation is a two-place relation between hypothesis and evidence via likelihood ratios. To maintain this while acknowledging HARKing, we must condition on the selection procedure. The likelihood becomes P(E | H & Search Procedure), not just P(E | H). Concretely, editorial practice would stop penalizing old evidence per se and start penalizing undisclosed selection effects. We would not require pre-registration for acceptance, but we would require authors to model their search space in the analysis. If a hypothesis was generated from the data, the p-values or Bayes factors must be adjusted for multiple comparisons or selection bias. We would stop treating pre-registered studies as inherently superior in truth and treat them as superior in known error rates. We would have to stop using the "novelty weight" multiplier, as Bayesian updating doesn't work by multiplying evidence scores by trust metrics. Instead, the prior probability of the hypothesis might be lowered if it looks ad hoc, but the evidence itself remains constant. The shift is from policing timing to policing the statistical model of the inference process. This requires much more statistical sophistication from reviewers than checking a timestamp.

  ### Bottom line

  Do not adopt the novelty weight; it quantifies trust, not evidence. Instead, mandate transparent disclosure of hypothesis generation. The policy turns on this sub-question: Are we trying to maximize the truth of published claims, or minimize the risk of misleading process reports? Choose the latter to preserve integrity without stifling exploration. Avoid false precision implying compensability between process and data. Focus on disclosure standards allowing readers to judge the search space.
