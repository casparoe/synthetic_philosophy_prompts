          *   *Claim:* Conclusion: Either not sphexishness or no consequences. (This is a bit glib. Fischer & Ravizza would say if the mechanism *is* rigid, even if undetectable, guidance control is absent. However, for a 5-mark question, this pragmatic dismissal is a standard move).
          *   *Assessment:* Acceptable for a short answer, though it sidesteps the manipulation argument nuance.
