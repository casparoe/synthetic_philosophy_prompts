  The gate swung free on its rusted hinge,
  rain coming close to the window pane.
  I counted spills as waste,
  an ordinary shift, no fanfare,
  watching the drain go downstream,
  turning the dead lock.

  You don't trust a single lock,
  oil the hinge before it sings.
  Where the water runs downstream,
  shadows gather close,
  just ordinary dust,
  or is it waste?

  Time spent waiting is waste,
  unless the lock holds firm.
  Ordinary days pile up,
  the weight hangs on a hinge,
  the window must close,
  something waits downstream.

  It's quieter downstream,
  better to waste an hour than a year.
  What if the latch won't close?
  Then you're stuck with a broken lock.
  No oil for the hinge,
  just ordinary hands.

  Nothing ordinary lasts forever,
  let them deal with downstream.
  We stand on the hinge,
  is caution waste?
  Click of the lock,
  the night draws close.

  So close to the end of the shift,
  an ordinary woman,
  checking the lock,
  someone downstream will know,
  call it waste or worth,
  depends on the hinge.

  I keep the door close, watch the steam downstream,
  is it waste to oil the hinge of a door nobody opens?
  In this ordinary house, the lock is all I have.
