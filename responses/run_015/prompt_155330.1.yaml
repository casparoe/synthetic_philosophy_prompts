answer: |-
  Good evening everyone. For those who don't know me, I'm one of Malcolm's colleagues, which is a polite way of saying I'm one of the people he has argued with for the last decade.

  We have a room tonight that is effectively split in two. On one side, we have Malcolm's family, who know him as the man who talks about the Industrial Revolution at the dinner table. And on the other, we have his colleagues, who know him as the man who talks about the dinner table *as if it were* the Industrial Revolution.

  To the family: thank you for sharing him. To the Vice-Chancellor: thank you for funding him. And to Malcolm: thank you for forty years of making the rest of us think harder.

  Retirement speeches usually require us to say that the great man solved the puzzle. But in economic history, and specifically in Malcolm's field, the tribute is more complicated. Malcolm has spent his career wrestling with the Great Divergence. The Needham Question. "Why Britain? And why not China?"

  Now, I stand here as a representative of the next generation, and I have to be honest. Many of us believe that this question—the very engine of Malcolm's career—is, philosophically speaking, a bit of a trick.

  Comparing eighteenth-century Britain to eighteenth-century China is, in some ways, like comparing a speedboat to an aircraft carrier. One is a small, agile island polity; the other is a continental empire sustaining hundreds of millions of people. If you ask, "Why didn't the aircraft carrier win the speedboat race?" you aren't learning about engineering; you're learning about how to ask the wrong question.

  And yet, this is where Malcolm's genius lies.

  He didn't just ask the question; he forced us to refine it until it almost broke. He pushed us to stop comparing "Europe" to "Asia" and start comparing England to the Yangzi Delta. He forced us to look for the divergence not in deep civilizational DNA, but in the accidental geography of coal and the windfall of colonial resources.

  In doing so, he taught us something profound. He taught us that China did not "fail" to industrialize. China succeeded at being China for a thousand years. The anomaly wasn't the Song or the Qing; the anomaly was Lancashire.

  By sharpening the question, Malcolm showed us that the answer wasn't about why the East fell behind, but about how the West got lucky. He built a career on a question that he ultimately helped us realize was flawed, and that is a rare kind of intellectual honesty. Most scholars spend their lives building a fortress to defend their thesis. Malcolm spent his life building a ladder so we could climb up and see that the view was different than he originally thought.

  That is the mark of a true teacher. He didn't want disciples who repeated his answers; he wanted colleagues who could rigorously dismantle his premises.

  So, I want to propose a toast.

  To Malcolm. Thank you for showing us that a well-posed question is valuable, but a rigorously pursued *ill-posed* question is a legacy. You gave us the tools to argue with you, and you made sure we were good enough to win.

  I know Malcolm is replying to this toast immediately, and I have deliberately left him just enough rope to hang me with in his rebuttal. I look forward to it.

  Ladies and gentlemen, please rise. To Malcolm.
