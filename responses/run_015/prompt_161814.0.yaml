answer: |-
  Your youngest brother is absolutely right, and his intuition about risk is financially sounder than the "average return" argument. Here is a breakdown of why he is right, an analysis of your proposed fix, and a third option that might be even cleaner.

  ### 1. Is your brother right?
  **Yes.** In finance, "expected value" (the average) is only half the story. The other half is **risk tolerance** and **time horizon**.

  *   **Utility of Money:** Losing £10k when you need it for a house deposit is catastrophic; it stops you from buying. Gaining an extra £20k when you don't urgently need it is nice, but not life-changing. The pain of the downside outweighs the pleasure of the upside for him.
  *   **Correlated Risk:** The person who pointed out the flaw in the initial promise was also right. In a housing market crash, asset values fall *and* economic conditions usually worsen. If the house value tanks, your brother's income or savings might also be under pressure. A promise to "make up the difference" is only as good as the promisor's ability to pay at that specific moment. If you are all "skint" because of a recession, that promise is worthless.
  *   **Liquidity:** He needs liquidity (cash) soon. The house is an illiquid asset. Tying his deposit up in a property he doesn't control for 10 years is a mismatch of assets and liabilities.

  ### 2. Would the £95k guarantee fix it?
  This proposal effectively creates a **"Preferred Equity"** structure. Your youngest brother gets a "preferred" share (fixed payout), and the three of you get "common" shares (variable payout).

  **The Math:**
  *   **Current Value:** £360k total (£90k each).
  *   **The Deal:** Youngest brother (YB) gets the first £95k off the top. The remaining proceeds are split 3 ways among the Older Brothers (OBs).
  *   **Break-Even for OBs:** For you to do better than selling *now*, the house needs to sell for more than **£365k** in 10 years (£95k for YB + £90k x 3 for OBs).
  *   **The Risk Shift:** This structure shifts almost all the downside risk to the three of you.
      *   *If the house sells for £500k:* YB gets £95k. You split £405k (£135k each). Everyone wins.
      *   *If the house sells for £300k:* YB gets £95k. You split £205k (£68.3k each). YB is up £5k vs selling now; you are down £21.7k each.

  **Is it fair?**
  Since you have stated you are "comfortable either way" and have higher risk tolerance, this is actually a very logical arrangement. You are being compensated for taking the risk with the potential for higher upside, while he is paid a premium (£5k) to wait and given downside protection.

  **The Catch:**
  *   **Resentment:** If the market crashes and you end up with £60k while he walks away with £95k, will there be resentment? You need to be sure you can stomach that scenario.
  *   **Asset Value Floor:** This guarantee only works if the house is worth *at least* £95k in 10 years. Given it is worth £360k now, it would need to lose 75% of its value for the guarantee to fail. This is unlikely unless there is a total economic collapse, so the guarantee is secure against the asset.
  *   **Management:** Who manages the rental for 10 years? If you do the work and take the risk, ensure you also keep the rental income, not just the sale proceeds.

  ### 3. A Better Option: The Buyout
  There is a third option that often works best in inheritance scenarios: **The Cash Buyout.**

  Instead of waiting 10 years, the three of you could buy your youngest brother's share **now**.
  *   **How it works:** You pay him £90k (or £95k) immediately. You fund this via savings or by remortgaging the inherited property.
  *   **Ownership:** The three of you then own the house 100%. You can rent it out or sell it in 10 years, and you keep 100% of the proceeds (and the risk).
  *   **Why it's better:**
      *   **For Him:** He gets certainty *now*. He can put the deposit down immediately and stop renting.
      *   **For You:** You get full control of the asset. You don't have to worry about his financial situation, and you don't have to structure complex payout waterfalls in 10 years.
      *   **Clean Break:** It severs the financial tie. Inherited property co-ownership often ruins relationships over maintenance decisions, tenant issues, or exit strategies.

  ### 4. Practical Steps & Warnings
  Whichever route you choose, you must formalize it. Handshake deals among siblings often sour when large sums are involved.

  1.  **Legal Agreement:** If you go with the £95k guarantee, you need a **Deed of Trust** drawn up by a solicitor. It must explicitly state that upon sale, the first £95k goes to him, and the remainder is split three ways. It should also cover what happens if one of *you* dies or wants to sell early.
  2.  **Tax:** Be aware of **Capital Gains Tax (CGT)**.
      *   If you sell now, there may be little to no CGT (depending on when your mum passed and if it was her main residence).
      *   If you keep it as a rental, you will pay income tax on rent and CGT on the increase in value when you eventually sell. This will eat into that "£110k average" projection. Make sure you are calculating *net* of tax.
  3.  **Costs:** Factor in maintenance, landlord insurance, and agent fees over 10 years. These costs come out of the pot before the split.

  ### Summary
  Your brother is right to reject the "average" argument. The **£95k guarantee** is a fair solution that aligns with your different risk profiles, provided you are willing to absorb the losses if the market crashes. However, the **Buyout** option is cleaner: pay him now, take the asset and the risk yourselves, and let him get on with buying his own home.
