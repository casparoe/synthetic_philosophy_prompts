answer: |-
  Your analogy is elegant and, descriptively, quite robust. Modelling social conventions as distributed protocols without a central clock or authority is a recognised approach in both game theory and social ontology. David Lewis, in his seminal work *Convention* (1969), argued precisely that conventions are coordination equilibria: we drive on the left not because it is inherently moral, but because we expect others to do so, and collision is the penalty for desynchronisation.

  If we stop there, your intuition holds: the queue-jumper is merely a node executing a different subroutine, causing latency (frustration) for the other nodes. However, this model fails to account for the specific *quality* of the reaction queue-jumping provokes. In distributed systems, a rogue node is a bug or an attack; in society, it is a *wrong*. The outrage suggests that something more than efficiency is at stake.

  I am reasonably confident in claiming that the local outrage is **not** a category error. While the *origin* of the convention may be pragmatic (efficiency/order), the *obligation* to uphold it, once established, acquires a moral dimension through the principles of fairness and mutual recognition. Here is how that transition occurs.

  ### 1. From Coordination to Fairness
  In a pure coordination game (e.g., which side of the road to drive on), the only goal is matching. But queuing and tipping are not merely coordination games; they are games of **cooperation involving sacrifice**.
  *   **Queuing:** Requires me to restrain my immediate desire for service. I wait because I trust you will also wait.
  *   **Tipping:** In jurisdictions where it supplements income, it is a deferred wage agreement mediated by custom.

  When you jump the queue, you are not merely choosing a different strategy; you are **free-riding**. You benefit from the order maintained by the restraint of others while exempting yourself from the cost of that restraint. In political philosophy, this is often framed as the 'Principle of Fairness'. If you accept the benefits of a cooperative scheme (the orderly movement of the line), you incur an obligation to bear your fair share of the burdens (waiting). To do otherwise is parasitic. This moves the violation from the realm of *prudential annoyance* (you slowed me down) to *moral injustice* (you exploited me).

  ### 2. The Expressive Function of Norms
  Social conventions are also communicative acts. Adhering to a local norm signals respect for the community and its members.
  *   **Jaywalking:** In the UK, waiting for a green man despite no oncoming traffic is a signal that one respects the shared rule of law and the safety expectations of others.
  *   **Queue-jumping:** This signals, "My time is more valuable than yours."

  When a visitor ignores these norms, they are not just optimising their path; they are expressing a lack of regard for the status of the locals. The outrage is a defensive reaction to this perceived slight. It is a demand for recognition as equals. Therefore, the duty is not merely to coordinate, but to acknowledge the moral standing of the other nodes in the network.

  ### 3. The Binding of Outsiders
  You ask on what grounds these practices bind outsiders who never consented. This is the crux of the matter.
  *   **Tacit Consent:** One argument is that by entering the physical space (the shop, the pavement), you implicitly agree to the local protocols. However, as you noted, this consent is fictional; no one signed a terms-of-service agreement at the bus stop.
  *   **Presence and Participation:** A stronger argument is that obligation arises from **participation**, not consent. If you choose to utilise the social infrastructure (the queue), you subject yourself to the rules that constitute it. You cannot opt into the benefit (the service) while opting out of the constitution (the order).

  Therefore, the visitor is bound not because they signed a contract, but because they chose to engage in a practice that is inherently normative. To queue is to accept the rule of the queue.

  ### Confidence Assessment

  **Confidence Level: High**
  I am highly confident that the distinction between a mere coordination equilibrium and a moral obligation lies in the element of **fairness and free-riding**. The engineering model explains the *existence* of the norm, but not the *force* of it. The moral residue comes from the exploitation of others' restraint.

  **Point of Least Certainty**
  I am least sure about the precise mechanism of **implicit consent for the total outsider**.
  While the 'Principle of Fairness' binds those who *benefit* from the scheme, there is a grey area regarding the transient visitor who may not fully understand the benefit or the rule. For instance, a tourist from a culture where queuing is less rigid may not realise they are 'free-riding' on a specific social contract; they may simply perceive a crowd.
  The philosophical difficulty lies in determining at what exact point ignorance ceases to be an excuse. Is the obligation triggered the moment they step onto British soil, or only once the norm is made explicit to them? If a node doesn't know the protocol, can it be blamed for a race condition? I am less confident in drawing a sharp line between *culpable ignorance* and *genuine cultural mismatch* in these scenarios. The moral weight seems to increase with the duration of stay and the clarity of the norm, but the threshold is notoriously fuzzy.

  ### Conclusion
  To answer your specific question: The local outrage is not a category error. While the convention begins as a Schelling point for efficiency, it evolves into a moral duty because it relies on mutual sacrifice. Violating it is not just a strategic deviation; it is an act of unfairness and disrespect. The visitor is bound not by legal codification, but by the ethical requirements of participating in a cooperative practice. You cannot treat social protocols as stateless functions when the state they manage is human dignity.
