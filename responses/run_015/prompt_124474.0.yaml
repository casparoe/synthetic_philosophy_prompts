prompt: |-
  As a software engineer with no formal philosophical training, I have recently been trying to model social conventions—queuing, tipping, and jaywalking—through the lens of distributed systems: local protocols that nodes follow to minimise conflict, without any central enforcer. In this framing, a convention is essentially a Schelling point, a coordination equilibrium that solves a practical problem. If that is all it is, then a visitor who jumps a queue, ignores a local jaywalking norm, or declines to tip is not violating a moral duty; she is merely selecting a different strategy in the same game, causing at most a prudential frustration of expectations rather than a genuine wrong. Yet in Britain, queue-jumping is treated with something close to moral revulsion—as if a normative boundary, not merely an efficiency, had been crossed. My confusion is therefore this: if these practices lack legal codification and were never the object of explicit consent, on what grounds can they generate obligations that bind outsiders? Is the local outrage a category error that mistakes a coordination equilibrium for a deontic fact, or does entering a social practice implicitly confer normative powers that create genuine duties even for non-members? Please address this carefully, say how confident you are in what you claim, and single out the point about which you are least sure. Write your response in British English.
