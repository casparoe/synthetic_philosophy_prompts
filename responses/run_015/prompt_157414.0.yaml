  **Question**

  Does personal survival matter in degrees, and do distinct practical attitudes track different metrics of continuity? Parfit argues branching shows identity is not what matters; Relation R suffices. But if Relation R holds fully for multiple successors, does practical normativity split evenly, vanish, or persist intact? This thesis asks whether the normative weight of survival distributes across branches like a conserved quantity, or whether attitudes like fear, promise-keeping, and ownership decouple from survival entirely. It leaves open whether a unified theory of practical rationality can accommodate fission without residue. The core inquiry is whether the branching case settles the normative question or merely exposes a gap in how we calculate practical reason across divergent psychological histories.

  **Why it's still open**

  My friend's Parfitian stance is strong: if identity isn't what matters, branching proves survival is just Relation R holding. Both successors are equally me; case closed. This dissolves the metaphysical worry efficiently. However, this treats "what matters" as a binary switch rather than a dimmer. My framing risks incoherence: if survival comes in degrees, what is the metric? If practical attitudes come apart, why call it one phenomenon? The standard literature tests fear of death and prudential concern, ignoring social norms like debt or promising. If I promise to meet you and branch, does the obligation split? Parfit says relation holds, but doesn't specify the normative arithmetic. The gap isn't metaphysical; it's normative. We lack a map of how specific practical commitments track psychological continuity when continuity diverges. This project targets that map, challenging the assumption that all practical attitudes ride on the same relation. The friend's view relies on the intuition that full Relation R guarantees full normative force. But if two people hold full Relation R to me, does double the normative force exist? Or does it dilute? Without answering this, the reductionist view remains incomplete regarding action guidance.

  **Method**

  Weeks 1-3: Exegesis. Reconstruct Parfit's reductionism and the strongest objections from successors. Weeks 4-6: Case construction. Develop the staggered, lossy, and cold backup scenarios not as intuition pumps, but as stress tests for specific normative principles. I will not ask "does this feel like me?" but "does this sustain a promise?" Weeks 7-9: Normative mapping. Analyze fear, prudence, promising, and debt separately against these cases. I will look for divergences where one attitude holds and another fails. Weeks 10-12: Synthesis. Draft the argument that practical attitudes decouple. Weeks 13-14: Revision. This method avoids mere intuition trading by focusing on the structural requirements of practical reasoning. Instead of asking what survives, I ask what reasoning survives. This shifts the burden from metaphysics to normativity, requiring a defense of why certain attitudes should track continuity differently. I will prioritize internal consistency of the normative systems over matching pre-theoretical intuitions about identity. I will also consult existing literature on collective obligation to see if branching agents function like distributed teams. This provides an external check on whether my proposed normative splits align with broader ethical theories regarding agency. I will maintain a research log to track where intuitions conflict, ensuring I don't smooth over contradictions prematurely. This documentation will serve as an appendix to show the dialectical process.

  **What a result looks like and what would mean the project failed**

  Success looks like a demonstrated divergence: showing that prudential concern might halve across branches while promissory obligation remains whole, or vice versa. This would prove "what matters" is plural, not singular. Failure means collapsing back into the Parfitian view: if I cannot show these attitudes coming apart, or if the "degrees" model proves unintelligible, the project fails. Another failure mode is proving the distinctions are arbitrary. If I cannot justify why debt tracks differently than fear without ad hoc stipulation, the thesis offers no new theory, only fragmentation. Ultimately, a successful result provides a framework for decision-making in fission cases, not just a metaphysical classification. Failure is leaving the practical agent without guidance.

  **Scope risks**

  The biggest risk is the number of cases. If the staggered, lossy, and cold backup scenarios each require full exposition, the word count will explode. I should cut the cold backup case if needed, as it overlaps significantly with the lossy scan regarding psychological discontinuity. Similarly, if analyzing four practical attitudes is too much, I will drop debt and blame, focusing strictly on the conflict between prudential concern and promissory obligation, which offers the clearest contrast between self-regarding and other-regarding norms.
