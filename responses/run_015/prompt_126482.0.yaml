  The volta turns in the third stanza, where "power and suffering meet" marks the collision of the knightly and priestly modes. In the first half, the refrain asserts the aristocratic tautology: goodness is self-evident in the powerful "us." In the second half, the same words become a reactive shield: the priestly "us" defines goodness only by contrasting itself against the "evil" masters. To close the loop onto the first stanza's unique lines, the final stanza sacrifices the constraint that lines 2 and 4 must be the refrain; this formal break performs the revaluation itself, showing that the container of "good" cannot hold the same content once the history has changed.
