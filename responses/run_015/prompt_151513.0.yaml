      *   *Correction:* I need to make sure Voss has a fighting chance. Voss should argue that transworld identity *can* hold even without the chain, perhaps by grounding identity in origin rather than sustained recognition. Thorne will argue that without the chain, the counterpart relation is too weak to warrant calling it the same institution, supporting the intuition that transworld identity fails here.
      *   *Actually, looking closer at the prompt's definition of Inertia:* "their persistence conditions depend not on intrinsic physical form but on an unbroken chain of collective recognition." If this is true, then in world w where there is no recognition, the object *doesn't persist* as that institution.
      *   *Thorne's angle:* Counterpart theory handles this gracefully. We say the text in w is a counterpart of the text in @, but whether it's a counterpart of the *institution* depends on how we contextualize 'institution'. If 'institution' implies recognition, the w-object isn't a counterpart of the institution.
