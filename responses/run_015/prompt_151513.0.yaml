      *   *Voss:* Needs to emphasize that numerical identity is primitive. If the origin is the same, the object is the same. The "institutional inertia" is a property of the *community*, not the *object*. The object exists in w, merely unused.
      *   *Inertia Twist:* The prompt defines inertia as making persistence depend on recognition. Thorne should use this to show why transworld identity fails (if persistence depends on recognition, and w lacks recognition, the object doesn't persist there). Voss must argue that "persistence" (temporal) is different from "transworld existence" (modal).

  5.  **Meta-Reflective Note:**
