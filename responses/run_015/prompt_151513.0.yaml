answer: |-
  **Dr. Aris Thorne:** Let's fix the case clearly before we diverge. We have the Charter of Meridia. In the actual world, @, it was drafted by the Assembly, ratified, and has sustained collective recognition for a century. In world *w*, the physical document is molecule-for-molecule identical, drafted by the same individuals at the same time, but the Assembly disbanded before ratification. No collective recognition ever occurred. The question is: Is the document in *w* the Charter of Meridia?

  **Dr. Selene Voss:** Yes. It is numerically identical. The origin fixes the identity. If the same agents produced the same structure at the same spatiotemporal location, we have the same object. The lack of ratification is a contingent historical failure, not an ontological annihilation.

  **Thorne:** That assumes social objects behave like bronze statues. But consider "institutional inertia." I'm proposing that for social artifacts, persistence conditions depend on an unbroken chain of collective recognition. In *w*, that chain is broken before it begins. If identity requires that inertia, the object in *w* lacks the essential relational property to be the Charter. It's a mere textual counterpart, not the institution itself.

  **Voss:** You're conflating temporal persistence with transworld identity. Institutional inertia might explain why the Charter ceased to exist in a specific timeline if recognition stopped. But modal existence isn't governed by sustained function. A knife is still a knife even if never used to cut. The Charter in *w* is a constitution that never became operative. Its identity is grounded in its origin, not its subsequent career.

  **Thorne:** But a knife's function is determined by its shape and material capacity. The Charter's "function" is its status, and status is constitutively relational. On Lewisian counterpart theory, I don't need to say the object in *w* is *not* the Charter in some absolute sense. I say it is a counterpart under the description "textual artifact," but fails to be a counterpart under "institutional framework." Counterpart relations are context-sensitive. We weight similarity differently depending on whether we care about the ink or the authority.

  **Voss:** Context-sensitivity is exactly the problem. It makes truth conditions for modal claims unstable. If I say, "The Charter could have failed ratification," I intend to refer to *this very object* having a different property. If counterpart theory holds, I'm referring to a distinct object in *w* that resembles the Charter. That loses the haecceitistic intuition that *this* thing could have failed. Transworld identity preserves the intuition that the object itself survives the counterfactual variation.

  **Thorne:** It preserves the intuition at the cost of coherence. If you insist on strict identity, you must accept that the Charter exists in *w* without being a constitution. But if "being a constitution" is essential to the Charter, you have a contradiction. Your view forces you to say the Charter exists as a non-constitution. My view allows me to say: The text exists, the institution does not. Institutional inertia explains why. The chain of recognition is part of the identity conditions for social kinds. Without it, you have a shell, not the object.

  **Voss:** I deny that "being a constitution" is essential in the way you suggest. What is essential is being the product of that specific drafting act. The status is imposed externally. Consider the inertia claim again: you argue that an identical physical copy cannot inherit institutional identity through transworld identity alone because it lacks the historical chain. But why should the chain matter modally? If the Assembly *had* ratified it, the chain would exist. The potential for recognition is inherent in the draft.

  **Thorne:** Potentiality isn't enough. Social objects are actualized by practice. Here is where institutional inertia bites hardest. If we accept that social identity relies on an unbroken chain of recognition in the actual world, projecting that identity into a world where the chain is absent requires a counterpart relation that respects that absence. In *w*, the similarity in text is high, but the similarity in social role is zero. If we weight social role heavily—as we must for institutions—the counterpart relation fails. Transworld identity forces you to ignore the weight of that relational property.

  **Voss:** I don't ignore it; I treat it as contingent. But let's press your counterpart account. If the counterpart relation is context-sensitive, then "The Charter could have failed ratification" is true in some contexts and false in others. That seems wrong. It should be determinately true or false. Transworld identity gives us determinacy. The object exists in *w*; the property of "being ratified" is simply false of it there. Your inertia view makes the existence of the object itself vague across worlds.

  **Thorne:** Not vague, but sortal-relative. And that's a virtue. It captures the intuition that the *text* survives but the *law* does not. Your view collapses the distinction. If the Charter in *w* is numerically identical, then the law exists in *w* even if no one recognizes it as law. That implies legal realism is false metaphysically. Institutional inertia saves us from populating possible worlds with ghost institutions—objects that have the structure of power but none of the substance.

  **Voss:** But does inertia really block transworld identity, or does it just block *functional* continuity? You claim breaking the chain across worlds prevents inheriting identity. But if origin is the anchor, the chain is secondary. Perhaps the flaw is in the analogy. You treat the chain as constitutive. I treat it as causal. If the causal origin is identical, the object is identical. The lack of recognition in *w* is just a missing effect, not a missing cause.

  **Thorne:** For social objects, the recognition *is* part of the cause of their continued existence. But let's grant your origin point. Even if origin fixes identity, counterpart theory handles the *predication* better. When we ask, "Is this the Charter?", we are asking if the counterpart relation holds strongly enough to warrant the name. In *w*, the relational divergence is too great. Transworld identity says "Yes, it is the Charter, just inert." Counterpart theory says "It is a counterpart of the Charter's text, but not the Charter's institution." The latter aligns with how we actually litigate these cases.

  **Voss:** Litigation isn't metaphysics. But I see your point about relational properties. However, if you lean too hard on inertia, you risk making social objects too fragile. If a revolution breaks the chain of recognition in @, does the Constitution cease to exist numerically? If yes, counterpart theory handles the temporal break well. But if no—if we say the Constitution survives underground—then recognition isn't essential. If it isn't essential temporally, why is it essential modally?

  **Thorne:** Excellent point. That's the tension. Institutional inertia might be a gradient. But for the modal case, the total absence of recognition in *w* versus the total presence in @ creates a divergence too sharp for strict identity. Counterpart theory accommodates degrees of similarity. Transworld identity is binary. Either it is the Charter or it isn't. If you say it is, you detach the object from its social kind. If you say it isn't, you concede my point.

  **Voss:** I say it is the Charter, but it fails to instantiate the kind "valid constitution" in *w*. Object and kind are distinct. The particular exists; the status does not. This preserves transworld identity without denying the importance of recognition. You don't need counterpart theory to separate the substrate from the status.

  **Thorne:** But that commits you to a bare particularism I find untenable for social ontology. The Charter *is* its status. There is no substrate beneath the recognition. If so, no recognition means no object. Counterpart theory allows us to say the *textual counterpart* exists, sparing us from nihilism, while denying the *institutional identity*. Transworld identity forces you into a dilemma: either accept ghost objects or deny the object exists in *w* entirely.

  **Voss:** And your view forces you to accept that modal claims are indeterminate until context fixes the weighting of similarity. I prefer the risk of ghost objects to the risk of losing the ability to say what *could* have happened to this specific entity. But I concede this: if institutional inertia is constitutive, transworld identity requires a robust account of how origins transmit status without recognition. That is my burden.

  **Thorne:** And mine is to explain why counterpart relations don't make modal truth too arbitrary. We agree that the case turns on whether social identity is intrinsic or relational.

  **Voss:** Precisely. And whether inertia is a metaphysical constraint or a sociological observation.

  **Thorne:** Then we have our work cut out for us.

  ***

  **Meta-Reflective Note**
  (a) My assessment would shift toward Voss's transworld identity if a compelling argument demonstrated that collective recognition is merely epistemic access to an institution rather than constitutive of its existence, thereby decoupling modal identity from social practice. (b) The weakest point in my reasoning lies in the coherence of "institutional inertia" as a metaphysical principle; it risks conflating the conditions for *recognizing* an institution with the conditions for its *existence*, potentially begging the question against the transworld identity theorist who views status as contingent.
