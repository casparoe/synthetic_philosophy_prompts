      *   *Voss (Transworld Identity):* For Voss, the object *is* numerically identical across worlds. The challenge is explaining how an object can exist in a world where its essential function (being a constitution) is absent. She needs to argue that the *origin* or the *abstract structure* fixes identity, not the contingent fact of ratification. However, the prompt specifies she defends transworld identity *though possibly different relational properties*. She needs to tackle "institutional inertia." She might argue that inertia is an actual-world phenomenon that doesn't constrain transworld identity. Or she might argue that the *potential* for recognition is enough. Actually, the prompt says Voss defends transworld identity *that allows artifacts... to exist in other worlds with strict numerical identity though possibly different relational properties.* So she must argue the unratified text *is* the Constitution, just unused.
