answer: |-
  You are not confused. You have identified a genuine, well-documented, and highly contentious phenomenon at the intersection of philosophy of biology, conservation policy, and the sociology of science.

  There is no single, canonical Latin phrase for this specific rhetorical move (like *ad hominem* or *post hoc*), but that is because the phenomenon sits at the crossroads of three different fields. Depending on which lens you look through, it goes by different names.

  Here is the breakdown of what you are seeing, the terminology available to you, and how to distinguish it from related concepts.

  ### 1. The Common Term: "Taxonomic Inflation"
  In the biological community, the pejorative term for this is **Taxonomic Inflation**.
  *   **Usage:** It is almost exclusively used by "Lumpers" against "Splitters."
  *   **Meaning:** It implies that species counts are being artificially inflated (like currency) to devalue the concept of "species" or to game conservation metrics.
  *   **Limitation:** It assumes one side is wrong. It doesn't capture the philosophical symmetry you noticed (that *both* sides are smuggling values).

  ### 2. The Philosophical Term: "Value-Laden Taxonomy" (via Inductive Risk)
  In philosophy of science, this is discussed under the framework of **Value-Laden Science**, specifically using the concept of **Inductive Risk**.
  *   **The Concept:** Coined by Carl Hempel and expanded by Heather Douglas, "Inductive Risk" argues that when the consequences of being wrong are high (e.g., a species goes extinct because we didn't protect it), scientists should adjust their standards of evidence.
  *   **The Move:** A Splitter might argue, "The genetic divergence is borderline, but because the cost of a false negative is extinction, we should classify this as a species."
  *   **The Smuggle:** The problem arises when the scientist presents this value-based caution as a purely *empirical* discovery. They say, "The data *shows* these are two species," when they really mean, "The data *plus our ethical duty* suggests we should treat them as two species."
  *   **Why it fits your pattern:** This explains how the normative work is done while maintaining the posture of empirical objectivity.

  ### 3. The Metaphysical Term: "Reification"
  The logical move you described ("treating a taxonomic question as purely empirical... as if the question has a mind-independent answer") is **Reification** (or the Fallacy of Misplaced Concreteness).
  *   **The Move:** Treating a conceptual tool (the species category) as if it were a hard, mind-independent object (like a rock).
  *   **The Context:** In biology, this is often tied to the debate between **Species Realism** (species are natural kinds) and **Species Pluralism/Anti-Realism** (species are human constructs imposed on a continuum).
  *   **Your Scenario:** Both parties are engaging in *Strategic Reification*. They treat the category as real when it helps their policy goal, and flexible when it doesn't.

  ### 4. The Sociological Term: "Boundary Work"
  Sociologist Thomas Gieryn coined **Boundary Work** to describe how scientists demarcate "science" from "non-science" to protect their authority.
  *   **The Move:** By framing their taxonomic decision as "objective fact," the researcher protects their recommendation from political challenge. If they admitted, "I'm splitting this species to ensure it gets ESA protection," a politician could say, "That's policy, not science." By saying, "This *is* a species," they shield the policy outcome inside a black box of scientific authority.

  ### 5. The "Ontological Politics" Angle
  If you want a deeper, more contemporary philosophical label, look to **Annemarie Mol's** concept of **Ontological Politics**.
  *   **The Idea:** Reality isn't just discovered; it is *enacted* through practice. By naming a population a "species," you aren't just describing it; you are bringing a new legal and moral entity into existence.
  *   **The Move:** The researchers are fighting over *which reality to enact*, but they frame it as fighting over *which reality exists*.

  ---

  ### Distinguishing It From Related Concepts

  **How is this different from the "Species Problem"?**
  *   **The Species Problem** is the ontological puzzle: "What *is* a species? Is it a lineage? A reproductive community? A niche?"
  *   **Your Pattern** is the *political utilization* of the Species Problem. It relies on the ambiguity of the Species Problem to allow values to slide in. If there were a universal, agreed-upon definition of species, this rhetorical move would be much harder to pull off.

  **How is this different from generic "Motivated Reasoning"?**
  *   **Motivated Reasoning** is psychological (I believe X because I want X to be true).
  *   **Your Pattern** is institutional and structural. The scientists aren't necessarily lying to themselves. The *system* (grant funding, the Endangered Species Act, publication credits) rewards certain taxonomic outcomes. They are responding to incentives while claiming to respond only to data. It is **Structural Motivated Reasoning**.

  **Does it require both parties?**
  *   No. One side can be sincere (a true Realist who believes the genetics demand a split), while the other is strategic. However, in the high-stakes conservation context you described, it is usually **Symmetrical**: both sides are aware that the taxonomy dictates the policy, and both adjust their "empirical" thresholds accordingly.

  **Do the stakes need to be ethical?**
  *   No. **Epistemic stakes** count. In academia, describing a "new species" yields a publication, a name in the ledger (*Smithus novus*), and career prestige. Lumping yields stability but less novelty. A researcher might split a group not to save the birds, but to get the paper. They will still frame it as "clarifying the evolutionary record."

  ---

  ### Advice for the Novelist

  Since there is no single word like "gravitas" or "hubris" that captures this exactly, you have two options:

  **Option A: Use the existing jargon accurately.**
  Have your characters argue about **"Taxonomic Inflation"** (the accusation) versus **"Conservation Precaution"** (the defense). Have a philosopher character point out that they are conflating **Inductive Risk** with **Empirical Evidence**.

  **Option B: Coin a term that fits the theme.**
  Since you are writing fiction, you can crystallize this concept into a phrase your characters use. Based on the philosophy above, here are three options that sound authentic:

  1.  **"Ontological Smuggling"**: Moving values across the border of facts.
  2.  **"The Conservation Masquerade"**: Policy dressed up as taxonomy.
  3.  **"Strategic Essentialism"**: (This is a real term from Gayatri Spivak, but it fits perfectly here). It means treating a fluid group as a fixed "essence" for a political goal.

  **My Recommendation:**
  If you want the book to resonate with actual biologists, use **"Taxonomic Inflation"** as the insult the Lumpers throw, and **"The Precautionary Principle"** as the shield the Splitters raise. Then, have a moment where a character realizes that **the species concept itself is the currency**.

  You are not asking the wrong question. You have identified the central tension in modern conservation biology: **We use a 250-year-old classification system to solve 21st-century ethical crises, and we pretend the classification system isn't bending under the weight.**

  If you need a single phrase to define the *move* itself (the act of hiding the value judgment), I would suggest **"The Naturalistic Mask."** It captures the attempt to derive an 'ought' from an 'is' while pretending the 'is' wasn't shaped by the 'ought'.
