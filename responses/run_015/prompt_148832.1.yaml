  hey so thinking about the naturalism versus normativism debate through your lens of supervised learning is actually a really sharp way to cut through the fog here. if you look at christopher boorse's biostatistical theory, he is essentially arguing for a purely unsupervised anomaly detection setup or perhaps a supervised classifier where the ground truth labels are derived strictly from the statistical distribution of physiological features in a reference population. in this framework, calling something a disease is just flagging a data point that falls outside the confidence interval of species-typical functioning, like marking an outlier in a high-dimensional feature space of biological parameters without any regard for whether that outlier minimizes or maximizes some utility function. the naturalist claim is that the label disease is objective because it is based on the data distribution itself, meaning there is no value-laden step in the loss function, just reconstruction error or deviation from the mean.

  the normativist reply comes in and says that your training set is already biased because the definition of the target variable depends on human values, not just biological stats. they argue that you cannot define the ground truth without incorporating a cost matrix that reflects vital goals or social preferences. for a normativist, a statistical outlier is only a disease if it negatively impacts the organism's ability to achieve certain goals, which means the loss function must include a penalty term for suffering or reduced capability that isn't captured by physiological deviation alone. so when you ask if there is a value-laden step that can't be captured by a loss function, the normativist would say the loss function itself is where the values live, but the naturalist says the loss function should only measure biological error. the conflict is whether the label disease is a property of the input features or a property of the relationship between the features and the observer's utility function.

  when you bring in wakefield's harmful dysfunction analysis, you are basically describing a two-stage classifier or a multi-task learning architecture where the final prediction requires two conditions to be met simultaneously. the first head of the network predicts dysfunction based on evolutionary design features, and the second head predicts harm based on social value features, and you only output a positive class for disease if both heads activate. regarding your question about whether this is like an adversarial example where the dysfunction feature is present but the harm label is wrong, i think that analogy strains a bit because an adversarial example usually implies an input perturbed to fool the model, whereas wakefield is describing cases where the model correctly identifies dysfunction but the final classification is negated by the harm layer. it is more like a false positive on the intermediate dysfunction layer that gets corrected by the harm layer, or perhaps a case of label noise where the training data disagrees on what counts as harmful. if you have a genetic variant that causes a mechanism failure but no suffering, wakefield says it is not a disease, which looks like a case where the feature extractor fires but the final probability is suppressed because the value weights are zero.

  now for the residue report on what maps cleanly and what gets distorted. the statistical component of naturalism maps very cleanly onto classification problems because you can literally model species-typical functioning as a probability distribution and calculate p-values for deviations. the concept of label noise also maps well to the disagreement between doctors on diagnoses, since inter-rater reliability is just consistency in labeling. however, what gets distorted when you force this into ml terms is the concept of harm, because in machine learning harm is usually a proxy metric like mortality or cost, whereas in philosophy harm is a qualitative experience of suffering or loss of opportunity that doesn't always correlate with the features you can extract. the thing left over with no counterpart at all is the first-person perspective of illness, which is the subjective experience of being unwell that might exist even without biological dysfunction or might exist without being labeled a disease by the model. this is the qualia of pain or distress that no feature vector fully captures.

  my take on whether that leftover means your framework is missing something real or the philosophers are just being vague is that your framework is missing something real because machine learning optimizes for prediction accuracy on observed data, not for the meaning of the states being predicted. the philosophers are not being vague when they talk about values; they are pointing out that the objective function of medicine is not just to predict biological states but to alleviate suffering, and suffering is not a feature it is a constraint on the optimization problem. if you treat disease classification as purely a statistical task you risk overfitting to biological markers that don't actually correlate with patient well-being, which is essentially what happens when you medicalize normal human variations like sadness or short stature. so the residue isn't just vagueness it is the actual target variable that matters most to the stakeholders, and if your model ignores it because it is hard to quantify then you have built a very precise classifier for the wrong problem.
