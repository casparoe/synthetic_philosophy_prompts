      *   (c) System-relativist: A is certain relative to Production System. B is fallible relative to Validation System.

  5.  **Addressing Spec 4 (Escalation):**
      *   If A calls B, she treats "B is reliable" as a hinge. $p$ remains a hinge for her, mediated by testimony. She doesn't acquire the check procedure herself.

