  3.  **Recall/Verify Moore's Actual Views (Principia Ethica):**
      *   *Intrinsic Goods:* Moore famously identifies "the pleasures of human intercourse" and "the enjoyment of beautiful objects" as the greatest intrinsic goods (PE, §113). He does not reduce the former to the latter.
      *   *Friendship/Intercourse:* He values the *consciousness* of the relation. It involves both love/admiration and the object being loved/admired. It is an organic unity itself.
      *   *Hedonism:* Moore is explicitly *anti*-hedonist. He argues pleasure is not the sole good. The value of friendship lies in the whole state (love + object), not just the pleasure felt.
      *   *Organic Unity:* This is a core principle. The value of a whole is not simply the sum of the values of its parts. This applies to personal relations too.
      *   *Aesthetic vs. Ethical:* While both are intrinsic goods, he distinguishes them. Friendship isn't just aesthetic contemplation of a person; it involves reciprocal emotion and the virtue of the object matters differently than the beauty of a painting.

