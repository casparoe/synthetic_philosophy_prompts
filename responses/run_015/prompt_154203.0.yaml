prompt: |-
  I read a summary of G. E. Moore's ethical view that runs as follows: "Moore holds that friendship and aesthetic enjoyment are the only supreme intrinsic goods. But he treats friendship as essentially a form of aesthetic contemplation directed at an animate object—loving a friend is structurally the same as admiring a painting, except the object possesses virtue. Because of this, Moore denies that relationships have any emergent ethical value; the worth of a friendship is just the sum of the pleasant feelings each party experiences, with no organic unity. His principle of organic unity applies only to compound aesthetic states, like appreciating a sunset with a friend, but never to the interpersonal bond itself. So Moore is ultimately a hedonist about personal relations, and anyone who thinks friendship is irreducibly valuable is contradicting his system." I suspect this misreads Moore in several places, though I can see why it sounds plausible. Is it a fair summary? Please distinguish what Moore would accept from what he would reject, flag any conflation between his aesthetic and ethical claims, and say whether the charge that he is a hedonist about friendship actually follows from his real commitments. Keep your answer under 400 words and lead with a single-sentence bottom line: is the summary broadly fair or not?
