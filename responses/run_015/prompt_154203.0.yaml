answer: |-
  No, this summary is fundamentally inaccurate and significantly misrepresents Moore's core arguments in *Principia Ethica*.

  Moore would accept that personal affection and aesthetic enjoyment are the greatest intrinsic goods. However, he would reject the reduction of friendship to aesthetic contemplation. For Moore, the value of personal affection lies in the organic unity of the emotion (love) and its object (the friend's virtues), not merely in the pleasure felt.

  The summary conflates Moore's structural analysis of intrinsic value with aestheticism. Moore argues that all intrinsic goods involve a consciousness of something, but this does not reduce all goods to aesthetic contemplation. Crucially, the summary inverts Moore's principle of organic unity. Moore explicitly uses personal relationships as a primary example of organic unity: the value of the whole (the friendship) is not the sum of its parts (the pleasure plus the friend's existence). The bond itself possesses emergent value.

  Consequently, the charge of hedonism is false. Moore's entire project is an attack on hedonism. He distinguishes the *pleasure* accompanying an experience from the *goodness* of the experience itself. In friendship, the appropriate emotion toward a worthy object is good even if the net pleasure were low. Therefore, claiming Moore denies irreducible value to friendship contradicts his explicit defense of personal affection as a distinct, supreme good irreducible to mere pleasure or aesthetic admiration. The summary describes a utilitarian reductionism Moore specifically wrote to refute.
