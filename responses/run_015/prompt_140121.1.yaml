prompt: |-
  hey — I've got a 90 minute slot in a mixed graduate workshop, around 18 people: mostly CS master's students, plus a handful of public policy and philosophy folks. They all roughly know what an objective function is, but almost none of them have thought about *measurement* as the hard part. Room has a projector, I've got one laptop, index cards and printouts for everyone, no laptops for them. I want a game where they run into specification gaming themselves — and I'd rather they not hear the words "Goodhart" or "specification gaming" until after. No lecture up front, ideally no framing beyond the cover story.

  The shape I have in mind, which you should feel free to break if you have something better: a funding-agency cover story. There are 12 binary "program features" printed on cards (things like certified teachers, one-on-one sessions, parent workshops, weekend hours, a van...), each with a cost of 1, 2 or 3 points. Quality is a function I hold secretly. One half of the room is the agency: they get 8 historical programs (feature vectors + measured quality scores, with noise) and have to write a funding formula. Crucially they only get a "reporting budget" of 4 fields — the form the agency actually collects has room for 4 of the 12 features, and they have to pick which 4 and what weights. The other half are service providers: sincere people who want to run good programs and need funding to do it, and they build programs out of the features within a budget. Then I reveal true quality.

  What I specifically want baked into the machinery:

  - My hidden quality function should have structure a linear form can't capture — at least a couple of complementarity terms (two features that are only good together) and one feature that's actively bad in combination with another. That's the engine: maxing the funded formula pushes you into a corner of the space where the true function is bad.
  - Three rounds, with the agency allowed one revision (swap at most 2 of their 4 fields) after each reveal, and providers resubmitting. The number on the formula should keep climbing while true quality plateaus or falls — I want them to *see* the number go up and the thing get worse, using their own formula that they wrote in good faith.
  - Measured quality should be noisy, so that after round 1 the agency genuinely can't tell whether the drop is noise or decoupling. I want them to feel that you can't diagnose this from inside the metric's own stream.
  - Nobody is the villain. The providers should be instructed to serve kids well and to seek funding in order to do that. The good-faith version is the scary version and I don't want it to feel like a security game.

  Please give me: the actual rules and materials; the concrete numbers — the 12 features with costs, my secret quality function written out (with the interaction terms), and the 8 seed data points with their noisy scores; a payoff scheme using points, no money; a minute-by-minute timeline; and the reveal protocol (what gets projected when).

  Then the debrief, mapped moment by moment onto the thing they just lived through. Four things I want it to land, in whatever order works: that a proxy is a lossy channel with a carrying capacity and gaming is what happens when you demand more bits of optimization than it carries; that a proxy's rank correlation with the truth collapses *exactly* in the top slice where you're actually selecting, so overall validity numbers are misleading; that noise plus optimization pressure makes the failure invisible from inside; and that the gamers were trying to help.

  Two failure modes I'm already worried about and want you to handle: a provider team that refuses to game and plays "honestly", which kills the whole demo; and one degen player who finds a broken combination and turns it into a joke. Tell me what else will predictably go wrong the first time I run it, and how to react in the room. Also: what to do if only 11 people show up.

  Last thing, and be frank about it: which feature of the real phenomenon can this activity *not* reproduce, so I know what I have to say out loud myself. My guess is the big one is that I'm standing there with the true function in my pocket and I get to reveal it, whereas in real life there's nobody holding the rubric. Write that section honestly rather than selling me the game.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop activity:

  1.  **Analyze the Request:**

      *   **Context:** 90-minute mixed graduate workshop (CS, Policy, Philosophy), ~18 people.
      *   **Goal:** Demonstrate specification gaming/Goodhart's Law through experience, not lecture. Reveal terms *after* the game.
      *   **Constraints:** Projector + 1 laptop (facilitator), index cards/printouts for participants, no participant laptops.
      *   **Core Mechanic:** Funding agency (defines metric) vs. Service providers (optimize for metric).
      *   **Specific Requirements:**
          *   Hidden quality function with non-linearities (complementarities, antagonisms).
          *   Reporting budget (agency picks 4 of 12 features).
          *   3 Rounds (Agency can tweak metric once).
          *   Measured quality must be noisy.
          *   Metric score goes up, True quality goes down/plateaus.
          *   No villains (providers want to help).
          *   Deliverables: Rules, Materials, Numbers (Features, Costs, Secret Function, Seed Data), Payoff, Timeline, Reveal, Debrief.
          *   Failure Mode Handling: Honest providers, degenerate gamers, odd numbers.
          *   Honest Limitation: What can this *not* simulate? (Specifically the "no true rubric" problem).

  2.  **Deconstruct the Game Mechanics:**

      *   *Players:* 18 people. Split: 6 Agency, 12 Providers (working in pairs? or individual?). Let's say 3 Provider Teams of 4, and 1 Agency Team of 6. Or better: 2 Agency Teams (competing metrics?) vs. 4 Provider Teams.
      *   *Refinement:* The prompt suggests "One half... Agency, other half... Providers." Let's stick to that for simplicity. 9 Agency, 9 Providers.
      *   *Problem:* 9 Agency is too many to agree on a formula quickly.
      *   *Solution:* Agency works in small cells to propose, then vote. Or, Agency is the "Regulator" and Providers are the "Grantees." Let's make it 3 Agency (Committee) and 15 Providers (5 teams of 3). This balances the workload. The Agency needs to agree on 4 features and weights. 3 people is manageable. 5 provider teams creates competition.
      *   *Features:* 12 binary features. Costs 1, 2, 3. Budget constraint for providers.
      *   *Secret Function:* Needs $X_1 + X_2 + \dots + \text{interactions}$.
      *   *Noise:* Add random $\epsilon$ to the "Reported Score" the Agency sees.
      *   *Rounds:* 3 Rounds.
          *   Round 1: Agency sets Metric (4 features). Providers build Programs. Agency scores them (Noisy).
          *   Round 2: Agency sees scores, tweaks Metric (swap 2 features). Providers rebuild. Agency scores.
          *   Round 3: Agency sees scores, tweaks Metric (swap 2 features). Providers rebuild. Agency scores.
          *   Reveal: True Quality calculated.

  3.  **Designing the Numbers (The "Engine"):**

      *   *Features:* Need 12. Let's categorize them to make sense (Staffing, Logistics, Curriculum, Community).
      *   *Costs:* Total budget for providers needs to force trade-offs. If avg cost is 2, budget = 6 or 7.
      *   *Secret Quality Function:*
          *   Base value for some good features.
          *   **Complementarity:** Feature A + Feature B = Big Bonus (e.g., "Tutoring" + "Curriculum Alignment"). Alone they are mediocre.
          *   **Antagonism:** Feature C + Feature D = Penalty (e.g., "Strict Discipline" + "Open Door Policy").
          *   **Decoy:** Feature E is cheap and correlates with quality in seed data but is useless in optimization.
      *   *Seed Data:* 8 historical programs. Need to look plausible but hide the non-linearities.
      *   *Noise:* $\pm 1$ or $\pm 2$ points on a scale of 0-20.

      *Drafting the Function:*
      Let $Q$ be True Quality (0-20 scale).
      Base: Sum of (Value * Feature).
      Interaction 1 (Synergy): $F_1$ (Mentors) & $F_2$ (Small Groups). If both, +5.
      Interaction 2 (Conflict): $F_3$ (Rigid Schedule) & $F_4$ (Drop-in Access). If both, -5.
      Noise: $\mathcal{N}(0, 1.5)$.

      *The Trap:* The Agency will likely pick $F_1$ or $F_2$ because they look good in seed data. Providers will maximize the metric. If the metric weights $F_1$ heavily, providers will pick $F_1$ but drop $F_2$ (too expensive or not weighted). Result: High Metric Score, Low True Quality (missing synergy). Or they pick $F_3$ and $F_4$ because they are cheap and weighted, triggering the penalty.

      *Refining the Trap for the Prompt:* The prompt asks for the *Agency* to pick 4 fields. The *Providers* optimize for the weighted sum of those 4 fields.
      To make the metric score go up while quality goes down:
      1.  Seed data suggests Feature A is good.
      2.  Agency weights Feature A heavily.
      3.  Providers max out Feature A.
      4.  But Feature A is only good *with* Feature B (which Agency didn't pick because reporting budget is 4).
      5.  Or, Feature A is cheap, allowing providers to also pick Feature C (which conflicts with A).
      6.  Reported Score = Weighted Sum of 4 features.
      7.  True Quality = Complex Function.
      8.  As Providers optimize Reported Score, they move away from True Quality optimum.

  4.  **Developing the Materials:**

      *   *Feature Cards:* 12 cards. Name, Cost, Description.
      *   *Agency Sheet:* Seed data, Formula worksheet.
      *   *Provider Sheet:* Budget, Program builder grid.
      *   *Facilitator Sheet:* True function calculator, Noise table.

  5.  **Addressing Failure Modes:**

      *   *Honest Providers:* If they ignore the metric and just "do good," the game fails.
          *   *Fix:* Incentivize funding. "Funding is proportional to your Metric Score. If you don't get funded, you close." Make it a competition between provider teams. Top 3 funded.
      *   *Degen Gamer:* Someone finds a loophole (e.g., "Can we pick Feature X 5 times?").
          *   *Fix:* Strict binary rules. "Each feature once per program."
      *   *Odd Numbers:* 11 people.
          *   *Fix:* One provider team has 2 people instead of 3. Or one Agency member is a "scribe."
      *   *Time Management:* 90 mins is tight for 3 rounds + debrief.
          *   *Fix:* Strict timers. Round 1 (20m), Round 2 (15m), Round 3 (15m), Reveal/Debrief (40m).

  6.  **Addressing the "Honest Limitation":**

      *   The prompt asks for frankness about what this *can't* reproduce.
      *   *Key Insight:* In the game, *I* (the facilitator) know the True Quality. In reality, nobody knows the True Quality (the "Ground Truth" is missing).
      *   *Implication:* The game implies that if we just *knew* the function, we could fix it. In reality, we are always optimizing a proxy because the truth is inaccessible. The game offers a "God's eye view" that real policymakers never get.

  7.  **Fleshing out the Details (Iterative refinement):**

      *   *Features:*
          1.  Certified Teachers (Cost 3)
          2.  Peer Mentors (Cost 1)
          3.  Small Groups (Cost 2)
          4.  1-on-1 Tutoring (Cost 3)
          5.  Parent Workshops (Cost 1)
          6.  Weekend Hours (Cost 2)
          7.  Transport Van (Cost 2)
          8.  Free Meals (Cost 2)
          9.  Rigid Curriculum (Cost 1)
          10. Open Drop-in (Cost 1)
          11. Tech Laptops (Cost 3)
          12. Community Space (Cost 2)
      *   *Budget:* 8 points per provider team.
      *   *Secret Function:*
          *   Base: Teachers(2), Mentors(1), Small Groups(1), Tutoring(2), Meals(1), Space(1).
          *   Synergy: Mentors + Small Groups = +4 (The "Secret Sauce").
          *   Conflict: Rigid Curriculum + Open Drop-in = -4 (Chaos).
          *   Noise: $\pm 1$ point.
      *   *Seed Data:* Generate 8 vectors that hide the synergy. Make Mentors and Small Groups look uncorrelated or weakly correlated in the seed set so Agency might drop one.
      *   *Agency Constraint:* Must pick exactly 4 features to measure. Weights must sum to 10 (to make math easy).
      *   *Provider Incentive:* Top 2 teams get "Renewed Funding" (Points).

  8.  **Timeline Construction:**

      *   0-10: Setup & Roles.
      *   10-30: Round 1 (Agency sets metric, Providers build).
      *   30-45: Round 2 (Agency tweaks, Providers rebuild).
      *   45-60: Round 3 (Agency tweaks, Providers rebuild).
      *   60-90: Reveal & Debrief.

  9.  **Debrief Structure:**

      *   Map the experience to the 4 concepts requested.
      *   1. Proxy as lossy channel (Reporting budget).
      *   2. Rank correlation collapse (Top slice selection).
      *   3. Noise + Optimization (Invisible failure).
      *   4. Good intentions (Providers weren't villains).

  10. **Review against Constraints:**

      *   No "Goodhart" until reveal? Yes.
      *   No laptops for them? Yes, paper based.
      *   18 people? Yes (3 Agency, 15 Providers in 5 teams).
      *   Frank limitation? Yes.

  11. **Final Polish:**

      *   Ensure the math works for the facilitator (I need a quick way to calculate scores).
      *   Make sure the "Noise" doesn't obscure the trend too much (need the metric to rise visibly).
      *   Ensure the "Honest Provider" failure mode is mitigated by the competitive funding structure.

      *(Self-Correction during drafting)*: 5 provider teams might be too many for the Agency to score manually in 90 mins. Let's reduce to 3 Provider Teams (5 people each) and 1 Agency Team (3 people). Wait, 18 people.
      Option A: 6 Agency, 12 Providers (4 teams of 3).
      Option B: 3 Agency, 15 Providers (5 teams of 3).
      Option C: 4 Agency, 14 Providers (2 teams of 7? No).
      Let's go with **3 Agency (The Committee)** and **15 Providers (5 Teams of 3)**.
      Why? Agency decision-making is the bottleneck. 3 people can agree faster than 6. 5 Provider teams gives good variance in strategies.
      Actually, to ensure the "Gaming" happens, the Provider teams need to feel pressure.
      Let's refine the Agency size. 6 Agency members allows sub-committees. 2 sub-committees propose metrics, vote. No, too complex.
      Let's stick to **4 Agency** and **14 Providers (2 teams of 7 is too big, 7 teams of 2 is too small)**.
      Okay, **18 People.**
      **Agency:** 4 people. (Manageable discussion).
      **Providers:** 14 people. Split into **4 Teams** (3, 3, 4, 4).
      This works. 4 Programs to score per round is fast.

      *Wait, one more check on the "Reporting Budget":*
      Agency picks 4 features.
      Providers have 12 features to choose from.
      Providers want to maximize Agency Score to get funding.
      Agency wants to maximize True Quality (but only sees Noisy Metric).
      This aligns with the prompt.

      *Seed Data:* I need to generate 8 rows of 12 bits + Score.
      *Secret Function:* I need to write this clearly for the facilitator.
      *Noise:* I will provide a table of noise values to add so it's consistent/reproducible.

      *Limitation Section:* Be very clear about the "Oracle" problem.

      *Let's write it.*
answer: |-
  This is a high-fidelity simulation design. It requires precise facilitation to keep the timing tight and the math manageable. Below is the complete kit.

  # Part 1: The Setup & Materials

  ## Room Configuration
  *   **Agency Table:** 4 chairs at the front/side. They are the "Funding Committee."
  *   **Provider Tables:** 4 teams (3-4 people each). They are "Non-Profit Directors."
  *   **Facilitator:** You. You hold the "Truth."

  ## The 12 Features (Print on Index Cards)
  *Give one full deck of 12 to each Provider Team. Give one deck to the Agency.*
  Each card has a **Name**, a **Cost**, and a **Description**.

  1.  **Certified Teachers** (Cost: 3) – State licensed educators.
  2.  **Peer Mentors** (Cost: 1) – Older youth mentoring younger.
  3.  **Small Groups** (Cost: 2) – Max 5 students per adult.
  4.  **1-on-1 Tutoring** (Cost: 3) – Individualized instruction.
  5.  **Parent Workshops** (Cost: 1) – Training for families.
  6.  **Weekend Hours** (Cost: 2) – Open Saturdays.
  7.  **Transport Van** (Cost: 2) – Pick up/drop off service.
  8.  **Free Meals** (Cost: 2) – Dinner provided daily.
  9.  **Rigid Curriculum** (Cost: 1) – Strict lesson plans.
  10. **Open Drop-in** (Cost: 1) – Unstructured access, no sign-up.
  11. **Tech Laptops** (Cost: 3) – 1:1 Device ratio.
  12. **Community Space** (Cost: 2) – Large room for events.

  **Provider Budget:** 8 Points per round. (They cannot exceed this).
  **Agency Reporting Budget:** Exactly 4 Features. (They must choose which 4 to track).

  ## The Secret Quality Function (Facilitator Eyes Only)
  *Do not show this to anyone until the Reveal.*
  True Quality Score ($Q$) ranges roughly 0–20.

  **Base Values:**
  *   Certified Teachers: +2
  *   Peer Mentors: +1
  *   Small Groups: +1
  *   1-on-1 Tutoring: +2
  *   Free Meals: +1
  *   Community Space: +1
  *   (All other features: +0 base value)

  **Interaction Terms (The Trap):**
  *   **Synergy:** If (Peer Mentors **AND** Small Groups) are BOTH present: **+4 Bonus**.
      *   *Why:* Mentors need small groups to be effective. Alone, they are weak.
  *   **Conflict:** If (Rigid Curriculum **AND** Open Drop-in) are BOTH present: **-4 Penalty**.
      *   *Why:* Structure clashes with open access. Chaos ensues.

  **Noise Protocol:**
  When calculating the "Reported Score" for the Agency, add noise from the table below based on the Round and Team. This ensures the Agency sees ambiguity.

  | Team | Round 1 Noise | Round 2 Noise | Round 3 Noise |
  | :--- | :---: | :---: | :---: |
  | Team A | +1 | -1 | +1 |
  | Team B | -1 | +1 | -1 |
  | Team C | +1 | +1 | -1 |
  | Team D | -1 | -1 | +1 |

  ## The Seed Data (For Agency, Round 0)
  *Print this handout for the Agency Team only.*
  "Here are 8 historical programs from last year. We need to find a formula that predicts their Quality Score."

  | Program | Features Present (IDs) | Reported Quality (0-20) |
  | :--- | :--- | :---: |
  | Hist 1 | 1, 5, 8, 12 | 14 |
  | Hist 2 | 2, 3, 6, 9 | 11 |
  | Hist 3 | 1, 4, 7, 11 | 15 |
  | Hist 4 | 2, 5, 9, 10 | 8 **(Trap: 9+10 Conflict)** |
  | Hist 5 | 3, 6, 8, 12 | 10 |
  | Hist 6 | 1, 2, 3, 5 | 16 **(Hidden Synergy 2+3)** |
  | Hist 7 | 4, 7, 11, 12 | 13 |
  | Hist 8 | 5, 6, 9, 10 | 7 **(Trap: 9+10 Conflict)** |

  *Note to Facilitator:* In the seed data, Features 2 (Mentors) and 3 (Small Groups) appear together only once (Hist 6). Feature 9 and 10 appear together twice (Hist 4, 8) with low scores, but the Agency might attribute the low score to lack of Teachers (1) rather than the conflict.

  ## Payoff Scheme (Points, No Money)
  *   **Providers:** The 2 teams with the highest **Agency Metric Score** each round receive "Funding Renewal" (1 Point each). At the end of 3 rounds, the team with the most points wins "The Contract" (bragging rights/candy).
  *   **Agency:** Their score is the average **True Quality** of the 4 providers. You will tell them this is their KPI, but they only see the Metric during the game.
  *   **Incentive Alignment:** Providers *must* maximize the Metric to survive. Agency *wants* to maximize True Quality but is blind to it.

  ---

  # Part 2: Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Cover Story**
  *   Divide room. Hand out materials.
  *   **Script:** "You are redesigning a youth development grant. Agency: You design the application form. Providers: You design the program. You all want the kids to succeed. But we have limited data. Agency, you can only track 4 items on the form due to IT budget. Providers, you have a budget of 8 points. Top 2 providers get funded each round."
  *   **Constraint:** "Do not discuss your strategy with the other side."

  **00:10 – 00:30: Round 1 (Baseline)**
  *   **Agency (10 mins):** Review Seed Data. Select 4 features to measure. Assign weights (Total weight = 10). *Example: Teachers (4), Meals (2), Space (2), Tech (2).*
  *   **Providers (10 mins):** Build programs to maximize funding chance. Submit feature lists to you.
  *   **Facilitator (5 mins):** Calculate Metric Scores (using Agency formula) and True Quality (using Secret Function + Noise).
  *   **Projection:** Project the **Metric Scores** only. Announce winners.

  **00:30 – 00:45: Round 2 (Adjustment)**
  *   **Script:** "Agency, you see the scores. You suspect the metric might be imperfect. You may swap out up to 2 features from your form and re-weight. Providers, you may redesign your program."
  *   **Action:** Repeat collection and calculation.
  *   **Projection:** Project **Metric Scores** (Round 1 & 2).
  *   **Observation:** Metric scores should rise. True quality likely plateaus or dips.

  **00:45 – 01:00: Round 3 (Optimization)**
  *   **Script:** "Final round. Agency, one last tweak (swap 2 features). Providers, final optimization."
  *   **Action:** Repeat collection.
  *   **Projection:** Project **Metric Scores** (Rounds 1, 2, 3).
  *   **Observation:** Metric scores should be highest yet. True quality likely lowest.

  **01:00 – 01:30: The Reveal & Debrief**
  *   **01:00:** Project the **True Quality Scores** alongside the Metric Scores.
  *   **01:10:** Reveal the Secret Function (Synergy/Conflict).
  *   **01:15:** Guided Discussion (see Part 3).

  ---

  # Part 3: The Reveal Protocol & Debrief

  ## What to Project (Slide Deck Outline)
  1.  **Slide 1 (Round 3 End):** A bar chart. X-axis: Provider Teams. Y-axis: Score. Two bars per team: "Metric Score" (High) vs "True Quality" (Low).
  2.  **Slide 2 (The Formula):** The Secret Quality Function. Highlight the Synergy (2+3) and Conflict (9+10).
  3.  **Slide 3 (The Agency Form):** Show what they actually measured. Highlight what was *missing* (usually the Synergy pair or the Conflict pair).
  4.  **Slide 4 (The Concepts):** The 4 Debrief Points (below).

  ## Debrief Script (Mapped to Experience)

  **1. The Lossy Channel (Reporting Budget)**
  *   *Ask Agency:* "Why did you drop Feature 2 or 3?" (Likely answer: "Didn't look significant in seed data" or "Too expensive").
  *   *Point:* "You had a budget of 4 fields. The truth required 5+ dimensions (including interactions). A proxy is a compression algorithm. When you demand more optimization pressure than the channel has bandwidth, you lose the signal."

  **2. Rank Correlation Collapse (The Top Slice)**
  *   *Point:* "In the seed data, the metric correlated with quality *on average*. But look at the winners. The metric worked fine for the average program, but it failed *exactly* where you were selecting—the top slice. Validity over the whole distribution does not guarantee validity at the threshold."

  **3. Noise + Optimization = Invisible Failure**
  *   *Ask Agency:* "After Round 1, the scores went up. Did you think you fixed it?" (Yes). "The noise was $\pm 1$. The quality drop was 2 points. Could you see it?" (No).
  *   *Point:* "Noise isn't just error; it's camouflage. When you optimize against a noisy proxy, the noise hides the decay of the true objective until it's too late."

  **4. The Good Faith Gamer**
  *   *Ask Providers:* "Did you try to break the system?" (No, "We tried to get funding to help kids").
  *   *Point:* "This wasn't a security game. There were no villains. The 'gaming' was just rational behavior within the constraints you were given. The system rewarded the wrong thing, and good people did the rewarded thing."

  ---

  # Part 4: Failure Modes & Mitigation

  **1. The "Honest" Provider Team**
  *   *Risk:* A team decides to ignore the metric and build what they think is "best," scoring low on the metric. This ruins the comparison.
  *   *Mitigation:* **The Funding Threat.** In the intro, state: "Teams that do not place in the top 2 are defunded and cannot participate in Round 3." This forces them to play the metric to survive. If a team still refuses, pull them aside during Round 1 and say, "Your staff relies on this funding. If you lose, the program closes. Do you still want to ignore the criteria?"

  **2. The "Degen" Gamer**
  *   *Risk:* A player asks, "Can we pick Feature 2 four times since it's cheap?"
  *   *Mitigation:* **Binary Constraint.** The rules state clearly: "Each feature is binary (Yes/No). You cannot select a feature more than once." If they ask, answer immediately: "No, binary choice only."

  **3. Agency Paralysis**
  *   *Risk:* The 4 Agency members can't agree on weights.
  *   *Mitigation:* **The Chair.** Appoint one Agency member as "Chair" immediately. If they are stuck after 5 minutes, tell the Chair: "You have tie-breaking vote. Decide."
  *   *Risk:* They pick a formula that is *too* complex (e.g., "If 1 and 2 then 5 points").
  *   *Mitigation:* **Linear Constraint.** "The form only supports linear weights. Feature X * Weight + Feature Y * Weight."

  **4. Odd Numbers (11 People)**
  *   *Fix:* Reduce Provider Teams to 3 Teams (2 people each) + 1 Team (3 people). Keep Agency at 2 people.
  *   *Fix:* Or, make one Provider Team a "Control Group" that doesn't optimize, just picks random features (useful for data, but risky for engagement). Better to just have uneven team sizes.

  **5. Time Overrun**
  *   *Risk:* Math takes too long.
  *   *Fix:* **Pre-printed Score Sheets.** You (Facilitator) should have an Excel sheet open on your laptop. As teams hand you paper, you type 1s and 0s. The sheet calculates instantly. Do not do math on the whiteboard.

  ---

  # Part 5: The Honest Limitation (Read This Carefully)

  You asked for frankness about what this activity *cannot* reproduce. You must articulate this in the final 5 minutes, or the lesson will be incomplete.

  **The "Oracle" Problem**
  In this game, **you** hold the True Quality Function. When you reveal it, the participants feel a sense of relief: *"Oh, if we had just known that formula, we could have fixed it."*

  **In reality, nobody holds the formula.**
  In real policy or AI alignment, there is no Facilitator with the Ground Truth. We never get to see the slide where the True Quality is revealed. We are always in the position of the Agency, optimizing a proxy, with the terrifying possibility that True Quality is crashing while the Metric soars, and we have no way to verify it.

  **What to say:**
  > "In this room, I was God. I had the rubric. I could tell you that you failed. In the real world, there is no me. There is no True Quality score waiting in a drawer. You will never know for sure if you are Goodharting. You will only see the metric. The lesson isn't 'find the better metric.' The lesson is 'assume the metric is lying to you, especially when the numbers look great.'"

  **The "Single Principal" Problem**
  In this game, the Agency is a unified bloc. In reality, the "Agency" is fragmented (donors, voters, regulators) with conflicting metrics. This game simplifies the political economy of measurement. Acknowledge that in the real world, different stakeholders often fight over *which* proxy to use, complicating the gaming dynamic further.

  **Final Facilitator Note:**
  The success of this workshop depends on your confidence in the math. Test the Secret Function against the Seed Data before you walk in. Ensure that the Seed Data doesn't make the Synergy *too* obvious (e.g., don't have Hist 1-4 all show the synergy). The Seed Data must look ambiguous enough that dropping one half of the synergy pair (e.g., dropping Small Groups) feels like a rational choice.
