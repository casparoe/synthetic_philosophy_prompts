  **The pair**
  In Case 1, Worker A stands on break beside Vat 7. His hand rests idly on the manual override handle. The sensor fails, pressure rises. Had A pushed the handle, flow would cease. He does not push. The vat bursts. In Case 2, Worker B stands on break beside Vat 8. His hand hangs idly at his side, inches from the manual override handle. The sensor fails, pressure rises. Had B pushed the handle, flow would cease. He does not push. The vat bursts. Neither worker is assigned monitoring duty. Neither contracted to intervene. Neither caused the sensor failure. Both possess equal physical capacity to push. Both know the risk. No rule expects action. The only difference is contact: A touches the handle; B does not.

  **Held fixed**
  All cases share identical counterfactual dependencies: the outcome occurs iff the agent omits the push. The causal process (sensor failure → pressure → burst) is identical. Normatively, both agents are symmetrical: no contractual duty, no role-based obligation, no prior wrongdoing, and no special relationship to the vat. Neither created the risk. Both possess the physical ability and knowledge to prevent the outcome. The omission is not overdetermined. No differences in expectation, social role, or legal liability.

  **Three accounts**
  A difference-making theorist asserts causation turns strictly on counterfactual dependence. Since the vat bursts in both worlds where the workers omit, and survives in both worlds where they act, both omissions are causes. This theory cannot distinguish Case 1 from Case 2 without importing external criteria. It faces the dilemma: accept B's omission as a cause (counterintuitive given lack of contact) or deny A's (contradicting counterfactuals). It must either swallow the bullet that B caused the burst or admit counterfactuals are insufficient.
  A norm-based account ties causation to duty breach. Since neither worker has a duty, neither omission is a cause. This preserves symmetry but contradicts the intuition that physical contact matters causally, independent of obligation. It reduces causation to blame, denying causal status to A despite his physical integration with the valve. It fails the seminar's requirement to find a non-normative condition.
  An agency account focuses on bodily engagement. In Case 1, A's body is part of the mechanical setup; his inaction is a failure of the system he physically inhabits. In Case 2, B is external. This account distinguishes the cases: A's omission is causal because his body completes the circuit; B's is not. It captures the contact intuition but risks conflating causation with mere physical connection unrelated to power. However, it offers the only non-normative distinction available to save the intuition that A caused what B did not. This aligns with the prompt's demand for a non-normative differentiator.

  **The feature**
  The distinguishing feature is Physical Contact. This is not a duty in disguise; touching a handle imposes no obligation to push it, nor does it create a special relationship akin to a contract. It is not a difference-making fact; the counterfactual dependence holds equally in both cases. Contact is a brute physical state.
  If contact is deleted—meaning A stands inches away—the cases become identical. Intuitively, A's causal status collapses to match B's. Neither omission seems causal without the physical link to the mechanism. This confirms contact carries the causal weight, not hidden norms. The feature isolates the mechanical connection from the moral expectation, proving that our causal intuition tracks physical integration even when normative stakes are nullified.

  **The counterattack and your verdict**
  The difference-maker's strongest move is a pragmatic explanation: A's omission is salient because contact makes the intervention option contextually prominent, whereas B's is not. Causation is invariant; assertibility varies. They bite the bullet: both are causes, but we only speak of A's.
  I reject this. It conflates causal metaphysics with conversational pragmatics. If causation is real, physical contact must matter ontologically, not just rhetorically. The intuition that B did not cause the burst is robust, not merely linguistic. The pair survives because the pragmatic story fails to explain why contact specifically, rather than any salient feature, drives judgment. If salience were key, a bright light near B would suffice. It does not. Physical contact tracks energy flow, not attention. Therefore, the difference-maker must concede counterfactual dependence alone is insufficient for causation by omission. This forces a choice: expand theory or deny intuition. I choose to deny the theory.

  **Fragility**
  The case breaks if contact implies duty. If touching the handle suggests A is the operator, normative symmetry collapses. It also fails if the mechanism is electronic, rendering physical contact causally irrelevant to the signal. The intuition relies on mechanical directness; remove the machine's physical nature, and contact becomes mere proximity.
