  Here's how I would rank them for a foundation looking for high-leverage conceptual work, ordered from most critical to least.

  **1. Neutrality Itself (The Constitutional Layer)**
  **2. Intertemporal Value Drift (The Temporal Layer)**
  **3. The Aggregation Problem (The Mechanical Layer)**

  Here is the reasoning, broken down by your criteria: upstreamness, tractability, and where the actual bottlenecks lie.

  ### 1. Neutrality Itself
  This gets the top dollar because it is the most upstream constraint. Before you can add values up (aggregation) or decide whose values count across time (intertemporal), you have to decide what status the AI system holds in a liberal society.

  *   **Upstreamness:** This is the "constitution" question. If a liberal state cannot be neutral about the good life—as many communitarian and perfectionist philosophers argue—then any AI framework built on the assumption of neutrality is fundamentally illegitimate. It's building on sand. Most current AI governance assumes neutrality is possible (e.g., "fairness" metrics that claim to be value-neutral). If that premise is false, the math downstream doesn't matter.
  *   **Tractability:** Low. Philosophers have been hammering on this since Rawls. However, that's exactly why it needs funding. The debate is stale because it's abstract. Funding work that forces this debate into the context of *algorithmic governance* could break the stalemate. We need to know if "procedural neutrality" is coherent when the procedure itself (the model architecture) embeds specific ontological commitments.
  *   **Why it's the bottleneck:** You cannot solve the alignment problem if you haven't defined what "alignment" means politically. Is alignment to user preference? To social welfare? To moral truth? Neutrality dictates the answer.

  ### 2. Intertemporal Value Drift
  This is the wildcard. It's less upstream than neutrality but more specific to the AI risk profile than aggregation.

  *   **Upstreamness:** It sits between the constitution and the mechanism. Even if you solve neutrality, you face the problem that democratic legitimacy is synchronous (voters today), while AI impact is asynchronous (lasting centuries). If we lock in today's values via alignment, we might tyrannize the future. If we don't, we risk value lock-in that prevents moral progress.
  *   **Tractability:** Very low. There is almost no existing institutional machinery for representing non-existent people. This is a conceptual greenfield. For a small foundation, this is high-risk, high-reward. You aren't competing with the massive social choice theory crowd.
  *   **Why it's #2:** It's critical, but it relies on #1. You can't design rights for future generations without knowing if your system is supposed to be neutral toward their conception of the good. However, I rank it above aggregation because aggregation assumes a static snapshot. AI breaks that assumption. Ignoring time makes the aggregation math irrelevant.

  ### 3. The Aggregation Problem
  This gets the least conceptual funding, not because it's unimportant, but because it's the most crowded and least likely to yield a foundational breakthrough.

  *   **Upstreamness:** This is the "algorithm" layer. It assumes you know *whose* values count (Neutrality) and *when* they count (Intertemporal). Only then do you ask how to combine them.
  *   **Tractability:** High. Economists and computer scientists have been working on social choice theory, mechanism design, and preference aggregation for decades. We know the impossibility results (Arrow, etc.). Funding more conceptual work here risks diminishing returns. We don't need more proofs that aggregation is hard; we need to know if we should be aggregating at all.
  *   **Why it's #3:** Engineers love optimization problems. There is already massive capital flowing into the technical side of this (RLHF, reward modeling, multi-objective optimization). A philosophy foundation shouldn't try to out-math the economists. It should fix the specifications so the engineers know what they're optimizing for.

  ### What Would Flip the Ranking?

  **If Neutrality is proven "good enough" procedurally:**
  If a consensus emerges that while perfect neutrality is impossible, *functional* neutrality is achievable through specific iterative design processes, #1 drops. The focus shifts to ensuring those processes work over time, pushing **Intertemporal Drift to #1**. This is plausible if the field moves from "ideal theory" to "non-ideal theory."

  **If Values are found to be Commensurable:**
  If moral philosophy or cognitive science discovers a robust, universal metric for human value (a "hedonic calculus" that actually works), the **Aggregation Problem jumps to #1**. Suddenly, the hard part isn't the politics; it's the measurement and summation. This is unlikely, but if breakthroughs in neuroscience suggest values are reducible to a common currency, the aggregation bottleneck becomes the primary constraint.

  **If AI Lifespans are Short:**
  If it becomes clear that AI systems will be ephemeral—replaced every few years by new models trained on new data—**Intertemporal Drift drops to #3**. The lock-in risk vanishes if the system doesn't last long enough to bind future generations. But given the trend toward foundational models that persist, this is a low-probability flip.

  ### Summary for the Foundation
  Don't fund the math; fund the specs. The engineers can handle the aggregation (Option 3) once they have better tools. The real risk is building a system that is either politically illegitimate (fails Neutrality) or morally tyrannical across time (fails Intertemporal). Prioritize the work that clarifies the political status of the AI first, then the temporal scope, and let the aggregation work follow.
