answer: |-
  ### Brainstorming & Initial Thoughts

  Okay, let's sit with this for a minute. You're describing a scenario that feels like it sits right on the fault line between computer science, logic, and decision theory. It's not quite standard Nash equilibrium stuff because the "moves" aren't just actions; the moves are *decision procedures*. And the payoff matrix isn't fixed by the actions alone, but by the logical relationship between the procedures generating the actions.

  My first instinct is that this breaks the causal chain we usually assume in game theory. In a standard Prisoner's Dilemma, my choice causes my payoff, and your choice causes your payoff. They're causally independent. But here, if I submit a program that says "I do what you do," and you submit the same, our outputs aren't causally linked in time (we submit simultaneously), but they are *logically* linked. If my source code is $S$, and yours is $S$, then $Output(S, S)$ is determined by the logical structure of $S$. It's a timeless correlation.

  This reminds me of Newcomb's Problem, but multiplayer. In Newcomb's, you're correlated with a predictor. Here, you're correlated with a peer.

  The three variants you listed are really distinct layers of abstraction.
  1.  **Text Identity:** This is the crudest layer. It's checking the *map*, not the *territory*. It feels like a "password" approach to cooperation. The fragility here is obvious: it's not checking if you *will* cooperate, it's checking if you *look* like me.
  2.  **Simulation:** This tries to check the territory (behavior) but runs into the physical limits of computation. You can't simulate a thing that is simulating you without infinite regress, unless you cut it off. The cut-off is the vulnerability.
  3.  **Proof:** This tries to check the logical necessity of the territory. It bypasses the runtime cost but hits the limits of formal systems.

  The "junk equilibria" point is crucial. If cooperation relies on a handshake, and there are infinite possible handshakes, how do we find each other? It's like showing up to a party where everyone agreed to wear a hat to identify their friend, but nobody agreed on *which* hat.

  And the load-bearing question... is it the code being visible? Or is it that the code *cannot be changed* after visibility? If I can see your code but change mine instantly in response, we're back to a standard reaction game. If I can commit but you can't see it, it's a blind contract. So it has to be the combination. But there's something deeper about *self-reference*. The program has to reason about itself reasoning about the other.

  Okay, I think I have the lay of the land. Let's structure this.

  ***

  ### Analysis

  You have stumbled onto a very specific, high-tension area of decision theory. While there is literature surrounding this, much of the conceptual terrain you are mapping lacks standardized vocabulary because it sits between disciplines. Game theorists call the setup one thing, logicians call the barrier another, and computer scientists call the fragility a third. I will synthesize these into a coherent framework for you, defining the concepts where standard terms are insufficient.

  #### 1. The General Trick: Program Equilibrium
  The overarching framework you are describing is best termed **Program Equilibrium**.

  In standard game theory, strategies are atomic choices (Cooperate/Defect). In Program Equilibrium, strategies are *computable functions* that take the opponent's source code as input. The equilibrium condition holds when neither player can submit a different program to get a higher payoff, given the other player's program.

  What makes this distinct from standard repeated games is that the correlation is not established through *history* (past moves) but through *logical structure*. You are describing a form of **Acausal Coordination**. The players do not influence each other causally (no signal is sent after submission); they influence each other because their decision algorithms share logical dependencies.

  #### 2. The Three Variants and Their Failure Modes

  You asked if the distinctions between your three variants have names. They map onto three different layers of formal limitation: Syntax, Computability, and Provability.

  **Variant 1: Text Identity (Syntactic Coupling)**
  *   **The Mechanism:** Cooperate iff `MySource == OpponentSource`.
  *   **The Fragility:** You identified that behaviorally identical programs defect against each other if they differ cosmetically. In logic and semantics, this is a failure of **Extensionality**.
      *   An *extensional* context allows you to substitute equivalent values without changing the truth value. (If $A = B$, then $F(A) = F(B)$).
      *   Your Variant 1 strategy is *intensional*. It cares about the definition (the intension), not the result (the extension).
  *   **The Name:** I will call this **Intensional Fragility**.
  *   **Why it happens:** This isn't just a bug; it's a feature of computability theory. **Rice's Theorem** states that any non-trivial property of the *behavior* of a program (i.e., semantic property) is undecidable. You literally cannot write a general program that checks "Does this opponent behave like me?" for all possible opponents. You are forced to check syntax because checking semantics is mathematically impossible. So, Intensional Fragility is the unavoidable tax you pay for trying to enforce behavioral equivalence in a general computational setting.

  **Variant 2: Simulation (Computational Coupling)**
  *   **The Mechanism:** Run the opponent's code on a copy of my code; cooperate if it outputs 'C'.
  *   **The Fragility:** This runs into the **Halting Problem**. If I simulate you, and your code simulates me, we enter an infinite loop.
  *   **The Name:** This is the **Computational Horizon** problem.
  *   **Engineering vs. Principle:** You asked if the step-budget limit is an engineering or principled problem. It is principled. Because the Halting Problem is undecidable, *any* simulation-based strategy must impose a resource bound (time or steps). This creates a "horizon" beyond which the program cannot see.
  *   **The Exploit:** An opponent can write code that behaves cooperatively for $N-1$ steps and defects on step $N$, or simply wastes $N$ steps to force a timeout. If your timeout rule is "Defect on timeout," they can force mutual defection. If your rule is "Cooperate on timeout," they can waste your resources and defect. There is no stable timeout policy that is immune to adversarial resource consumption.

  **Variant 3: Proof (Logical Coupling)**
  *   **The Mechanism:** Cooperate iff I can prove (within system $T$) that you cooperate with me.
  *   **The Fragility:** This avoids runtime limits but hits **Gödelian Incompleteness**.
  *   **The Name:** This is the **Löbian Obstacle**.
  *   **Engineering vs. Principle:** This is entirely principled. It is not a matter of search speed. If both agents use the exact same formal system $T$ to reason about each other, they often cannot prove mutual cooperation. To prove that "If I prove you cooperate, you will cooperate," the system essentially needs to prove its own soundness. Gödel's Second Incompleteness Theorem forbids a consistent system from proving its own consistency.
  *   **The Wall:** To get around this, the agents cannot be identical. Agent A must trust Agent B's reasoning slightly *less* than Agent B trusts Agent A, or they must use a specific construction (a modal fixed point) that allows them to reason about "provability" without triggering the inconsistency. If you just naively code "Cooperate if Provable(Opponent Cooperates)," two identical agents will often find the proof length exceeds the budget or the system is too weak to derive the fixed point. It is a limit on *logical strength*, not processing power.

  #### 3. The "Junk Equilibria" Problem

  You noted there are endless equilibria (cooperate if source > 500 chars, etc.). Does this sink the idea?

  *   **The Name:** This is the **Handshake Proliferation Problem**.
  *   **Analysis:** In standard game theory, we worry about *Equilibrium Selection* (e.g., which side of the road to drive on). Here, the problem is worse. It's not just choosing between two stable points; it's that the space of stable points is infinite and mostly mutually incompatible.
  *   **Does it sink the idea?** It doesn't make the cooperation impossible, but it makes *spontaneous* cooperation unlikely without a **Focal Point**.
  *   **The Fix:** For this to work in practice, the agents need a shared "Schelling Point"—a standard library or a common convention on how to write the handshake. If everyone uses a standard "CooperateBot" library, the text-identity check works. If everyone writes their own crypto-signature handshake, they fail. The fragility isn't in the logic of the equilibrium; it's in the *coordination of the language*. It transforms the problem from a Prisoner's Dilemma into a **Coordination Game** on the meta-level (choosing the handshake protocol).

  #### 4. The Load-Bearing Ingredient

  You asked what actually does the work here. Is it commitment? Transparency? Self-reference?

  If you drop commitment (I can change my program after seeing yours), the whole thing collapses into a standard sequential game where the second mover defects.
  If you drop transparency (I can't see your code), I can't condition my move on your logic, so I must defect (standard Nash).

  But the *magic* ingredient—the thing that distinguishes this from a normal contract—is **Logical Coupling**.

  In a normal contract, I promise to cooperate, and an external enforcer punishes me if I don't. The link between your action and mine is causal and external.
  In Program Equilibrium, the link is internal and logical. My output is a mathematical function of your source code. Your source code determines your output. Therefore, my output is logically correlated with your output.

  *   **The Specific Mechanism:** It is **Read-Only Commitment**.
      *   **Commitment:** Once submitted, the program runs. I cannot intervene.
      *   **Read-Only:** You can inspect the commitment *before* the outcome is realized, but you cannot alter it.
      *   **The Result:** This allows for **Counterfactual Reasoning** about the opponent's decision procedure. I can say, "If I were to submit 'Defect', his program would output 'Defect'. If I submit 'Cooperate-Conditionally', his outputs 'Cooperate'."

  If you remove the "Read-Only" aspect (i.e., if the code could change dynamically during execution based on the other's inspection), you reintroduce causal signaling and the loop destabilizes. If you remove the "Commitment" (I can swap the program after inspection), you lose the binding force.

  So, the load-bearing pillar is **Transparent Commitment**. But philosophically, what makes it work is that the commitment is *expressed in a language the opponent can evaluate*. It turns the "black box" of the opponent's mind into a "white box" of logical text.

  #### Summary of Definitions

  To answer your request for specific terminology for the concepts you are groping at:

  1.  **General Trick:** **Program Equilibrium** (or Open-Source Game Theory).
  2.  **Variant 1 Fragility:** **Intensional Fragility**. (Failure to cooperate due to syntactic differences despite semantic equivalence).
      *   *Boundary Case:* Two programs that are alpha-equivalent (only variable names differ) defect. This counts as Intensional Fragility. Two programs that use different algorithms (one uses a lookup table, one uses an if-statement) but yield the same output also defect. This also counts.
  3.  **Variant 2 Fragility:** **Computational Horizon**. (Failure due to resource bounds in simulation).
      *   *Boundary Case:* A program that halts in 100 steps vs one that halts in 101 steps, where the budget is 100. The former cooperates, the latter triggers a timeout.
  4.  **Variant 3 Fragility:** **Löbian Obstacle**. (Failure due to limits of self-proof in formal systems).
      *   *Boundary Case:* Two agents using Peano Arithmetic (PA) fail to prove each other's cooperation. Two agents where one uses $PA + 1$ (PA plus one extra axiom of consistency) and the other uses $PA$ might succeed.
  5.  **Junk Equilibria:** **Handshake Proliferation**. (The existence of infinite, incompatible coordination protocols).
  6.  **Load-Bearing Ingredient:** **Transparent Commitment** (enabling Logical Coupling).

  #### Final Thought on the "Absurdity"

  You mentioned Variant 1 feels absurd, like cooperation isn't about the strategy. I would argue the opposite. In this framework, the *source code is the strategy*. In standard game theory, we abstract away the mechanism of decision. Here, the mechanism *is* the move.

  The absurdity you feel comes from the intuition that "rational agents should recognize equivalent strategies." But computability theory tells us they *cannot* generally recognize equivalent strategies (Rice's Theorem). So, the "absurd" text-identity check is actually the *only* decidable check available to them without stronger assumptions (like a shared proof system). The fragility isn't a bug in the game; it's a reflection of the fundamental difficulty of knowing another mind. We are forced to judge by appearance (syntax) because judging by substance (semantics) is undecidable.

  The proof-based variant (Variant 3) is the only one that escapes this, by moving the judgment from "What do you look like?" or "What do you do?" to "What is necessarily true about you?" That is the only path to robust, extensional cooperation in a one-shot setting, but it demands that both agents speak the same logical language.
