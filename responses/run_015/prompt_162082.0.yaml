answer: |-
  The joint is in **Step (3)**, specifically in the implicit assumption that your action *at this intersection* is causally independent of your action *at the other intersection*, given the plan $p$.

  You have successfully derived the **Time Inconsistency** of Causal Decision Theory (CDT) combined with Thirder credences. Your math is correct *for a Causal Decision Theorist*. The absurdity arises because CDT is the wrong tool for this specific job.

  Here is the breakdown of what to reject, why it looks fine, the cost, and the fate of the Duplicate Driver.

  ### 1. Which step do you reject?
  You must reject the **separation of the current act from the policy** in Step (3) and (6).

  In your calculation:
  *   **Exiting:** You assume you Exit *now*, but if you are at the second intersection (or if this is the second intersection), you follow the plan $p$.
  *   **Continuing:** You assume you Continue *now*, and follow plan $p$ thereafter.

  This assumes that "You at Intersection A" and "You at Intersection B" are distinct causal agents who can coordinate on a plan $p$ but deviate locally without affecting the other. But you are absent-minded. You cannot distinguish A from B. Therefore, you cannot implement "Exit at A, Continue at B." You can only implement "Exit at all" or "Continue at all" (or a mixed strategy $p$ applied to all).

  When you calculate the expected utility of "Exit" in Step (6) as 2, you are calculating: *"What if I Exit here, but my other self (who is identical to me) Continues?"*
  Since your other self is identical and faces the same situation, if "Exit" is the rational choice for you now, it is the rational choice for your other self too. If you both Exit, the payoff is 0, not 2.

  ### 2. Why does it look fine?
  It looks fine because it mirrors standard decision problems where my choice doesn't change the laws of physics or my future self's code. In almost every normal problem, choosing "Take the apple" now doesn't force me to "Take the apple" tomorrow. CDT works by holding the rest of the world (including future states determined by fixed policies) constant while varying the current act.

  In the Absent-Minded Driver problem, **the "world" includes your own decision algorithm at other indistinguishable nodes.** Because you cannot index your decision to the specific intersection ("Exit if First, Continue if Second"), your decision algorithm outputs the same probability distribution at every node. Varying the act *now* logically implies varying the act *there*. CDT fails to capture this logical correlation.

  ### 3. What does rejecting it cost you?
  It costs you **Causal Isolation**. You must adopt **Evidential Decision Theory (EDT)** or **Functional Decision Theory (FDT)** at the intersection.

  You said you want to keep two things:
  1.  **Thirder Credences:** $q = 1/(1+p)$.
  2.  **Maximize at the Intersection:** Choose the option with the highest expected utility given your credences.

  **Good news:** You *can* keep both, provided you maximize over **policies**, not **atomic acts**.

  If you apply EDT/FDT at the intersection:
  *   **Choice:** "Should I be an agent who Exits ($p=0$) or an agent who Continues ($p=1$)?"
  *   **If I choose Exit ($p=0$):** My credence updates to $q = 1/(1+0) = 1$. I am certainly at the first intersection. Payoff = 0.
  *   **If I choose Continue ($p=1$):** My credence updates to $q = 1/(1+1) = 1/2$. Payoff = 1.
  *   **Comparison:** $1 > 0$. I should Continue.

  If you check the mixed strategy $p=2/3$:
  *   You calculate the EU of the policy $p$ using the credences generated by $p$.
  *   $EU(p) = \frac{1}{1+p} [ p \cdot (\text{Value from 2nd}) ] + \frac{p}{1+p} [ p \cdot 1 + (1-p) \cdot 4 ]$.
  *   (Note: The algebra here recovers the ex-ante function $p(4-3p)$).
  *   Maximizing this at the intersection yields $p=2/3$.

  **The Resolution:** The "Value Inflation" (1.6 vs 4/3) in your Step (5) disappears. That 1.6 was the value of an action *conditional on the policy remaining fixed at $2/3$ despite your deviation*. Since your deviation *changes* the policy (because you are the policy), that counterfactual is impossible. The only actionable expected utilities are those where the credence $q$ updates to match the chosen $p$.

  ### 4. Is the Duplicate Driver version different?
  **Yes, but only if they are causally distinct.**

  *   **Case A: Distinct Agents (CDT applies).**
      If Driver 1 and Driver 2 are distinct people who just happen to look alike and share a payoff, they are playing a **Team Prisoner's Dilemma**.
      *   Driver 2 knows Driver 1 has already acted.
      *   Driver 1's choice is fixed (fact of the past).
      *   Driver 2 calculates: "If I Exit, I get 4 (if I'm at 2nd). If I Continue, I get 1."
      *   Driver 2 Exits.
      *   Driver 1 anticipates this: "If I Continue, Driver 2 Exits (Payoff 4). If I Exit, Payoff 0."
      *   Driver 1 Continues.
      *   Result: Payoff 4.
      *   *Wait, your setup:* Indistinguishable intersections for the drivers too? If Driver 2 doesn't know he's Driver 2, he has the same credence problem.
      *   If they are distinct agents with identical information and no communication, and they both reason via CDT: They both see the incentive to Exit (EV 2 vs 1). They both Exit. Driver 1 Exits (0). Driver 2 never plays. Total 0.
      *   This is a **coordination failure**. The "absurdity" ($2 > 1$) is real—it's the incentive to defect. The tragedy is that following the incentive destroys the value.

  *   **Case B: Computationally Identical (FDT applies).**
      If they are "computationally identical" (same source code), then Driver 1's decision logically determines Driver 2's decision.
      *   If I (Driver 1) Exit, I am the type who Exits. Driver 2 is the same type. Driver 2 Exits.
      *   If Driver 1 Exits, Driver 2 never gets to move. Payoff 0.
      *   If I Continue, Driver 2 Continues. Payoff 1.
      *   This collapses back into the Single Driver problem. The "absurdity" vanishes because the correlation is enforced by logic, not causality.

  **Verdict:** The Duplicate Driver variant surgically removes the **self-identity** constraint. If you remove self-identity, you remove the logical link between the nodes. If you keep the logical link (via computational identity), it is the same problem. The "double-counting" explanation failed for you in the Duplicate case because the error wasn't double-counting; it was **ignoring the correlation between decisions**. In the Single Driver case, the correlation is metaphysical (it's the same person). In the Duplicate case, it must be stipulated (are they clones or just twins?).

  ### 5. What's left of the decision at the intersection?
  You asked: *"If the driver can't discriminate then 'exit' isn't an act available at one intersection, it's a change of rule... it starts to feel like the whole thing dissolves into 'your only real choice is the ex ante one'."*

  This is the correct moral, but it doesn't dissolve the decision at the intersection; it **elevates** it.

  *   **Naive View:** At the intersection, I choose an *act* (Exit/Continue) given a fixed *rule* ($p$).
  *   **Correct View:** At the intersection, I choose the *rule* ($p$) that my act instantiates.

  Because you cannot distinguish the intersections, you cannot act locally. Every act is a global declaration of policy. The decision at the intersection is **real**, but it is a decision about **who you are** (what policy you run), not just **what you do**.

  If you accept this:
  1.  **Thirder Credences:** Safe. They correctly describe your self-locating uncertainty given a policy.
  2.  **Maximize at Intersection:** Safe. But you maximize $EU(\text{Policy})$, not $EU(\text{Act} | \text{Policy})$.
  3.  **Ex Ante Optimum:** It matches the Intersection Optimum. No time inconsistency.
  4.  **Value Inflation:** Gone. The 1.6 was the price of a deviation you cannot make.

  ### Summary
  The rot is in **Step (3)**'s assumption that you can deviate from the plan $p$ locally without changing the plan $p$ globally.
  *   **Reject:** Causal Decision Theory at the intersection.
  *   **Adopt:** Evidential/Functional Decision Theory (your choice evidences/determines the choice at the other node).
  *   **Cost:** You lose the ability to treat your future self as a fixed part of the environment. You must treat your future self as a logical mirror.
  *   **Duplicate Driver:** It is a different problem only if the drivers are causally independent. If they are computationally identical, it is the same problem, and the "absurdity" is just the Prisoner's Dilemma incentive which FDT resolves.

  You can keep your Thirder credences and your desire to deliberate at the intersection. You just have to acknowledge that in this specific topology, **choosing an act is choosing a law.**
