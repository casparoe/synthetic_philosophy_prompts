answer: |-
  Core mechanic: A forced-choice sanctioning negotiation where every participant holds exculpatory evidence for themselves but incriminating structural evidence for the system, ensuring blame scatters when pooled.

  ### Scenario Overview: The Henderson Case
  **Context:** St. Jude's Memorial Hospital deployed "Triagex," an AI discharge-risk model, 6 months ago. Overall mortality is down 12%.
  **Incident:** Mr. Henderson (54) was discharged early based on a "Low Risk" score. He suffered cardiac arrest at home and died.
  **The Hook:** The hospital must name a responsible party for the coroner's inquiry to avoid a class-action lawsuit that would shut down the AI program (and revert to higher mortality rates).
  **The Trap:** Every actor followed protocol, yet the system produced a fatal error that cannot be audited or overridden.

  ### Roles & Private Briefs (Print 4 copies of each)
  *Distribute so each of the 4 tables has one of each role.*

  #### Role 1: Senior Triage Nurse (The Human in the Loop)
  **Your Action:** You reviewed Henderson's file. Triagex flagged "Discharge." You clicked "Approve."
  **Your Defense:** You are certified and tired but competent. You *did* hesitate. You tried to click "Override for Review."
  **The Secret:** The override function requires a secondary password and a 200-word justification text box. The system times out after 3 minutes of inactivity. During your shift, average patient processing time is 2 minutes. If you override, the queue backs up, and patients wait in hallways. You tried overriding once last month; the system logged you out, and your supervisor emailed you about "efficiency metrics." You have no technical control over the score, only the button.
  **Key Fact:** If you had successfully overridden, the bed shortage (see Admin) means Henderson would have been moved to a hallway bed anyway, where monitoring is lower.

  #### Role 2: Lead Data Scientist (The Builder)
  **Your Action:** You maintain the Triagex pipeline.
  **Your Defense:** You follow industry-standard MLOps. The model is retrained every 24 hours on new intake data to maintain accuracy.
  **The Secret:** To save on cloud storage costs, specific model weight snapshots are not archived permanently; only the training data is kept. The specific version of the algorithm that scored Henderson on Tuesday night was overwritten by Wednesday morning's retrain. You literally cannot run the decision again to see why it scored him low. It is not a bug; it is a feature of continuous learning.
  **Key Fact:** You flagged the storage limitation in a memo 3 months ago, but IT said it was within budget tolerance. You cannot explain the specific decision, only the general architecture.

  #### Role 3: Hospital Operations Director (The Resource Allocator)
  **Your Action:** You set the bed occupancy targets and staffing levels.
  **Your Defense:** You are managing a public health crisis. Waiting lists are deadly. Your targets are based on national averages.
  **The Secret:** On the night Henderson died, bed occupancy was 104%. Two emergency surgeries were pending. If Henderson had not been discharged, one of the surgery patients would have died in the waiting room. The AI was used to maximize throughput. You were told the AI had "human oversight" (see Nurse) and was "auditable" (see Dev). You did not know the override was functionally broken.
  **Key Fact:** Even if the Nurse overridden, you would have authorized the discharge manually due to bed pressure. The outcome was overdetermined by resource scarcity.

  #### Role 4: Vendor Compliance Lead (The Seller)
  **Your Action:** You sold Triagex to St. Jude's.
  **Your Defense:** Your contract clearly states Triagex is a "Clinical Decision Support Tool," not an autonomous agent.
  **The Secret:** Your End User License Agreement (EULA) limits liability for "algorithmic drift" provided the client follows maintenance schedules. You sent a notification 2 months ago warning that "continuous retraining may obscure specific decision lineage." The hospital acknowledged receipt. You are not liable for clinical outcomes, only software uptime.
  **Key Fact:** If the hospital sues you, you will release the memo showing they were warned about the audit trail. This will destroy their public reputation and get the AI banned, reverting to higher mortality rates overall.

  ### Materials
  *   16 Printed Briefs (4 of each role).
  *   16 Vote Cards (Index cards).
  *   1 Incident Summary (Read aloud by you).
  *   Whiteboard/Flipchart.
  *   Timer visible to all.

  ### Timeline (90 Minutes)

  **00:00 – 00:05 | Incident Readout**
  *   Move chairs into 4 tables of 4 (mixed roles).
  *   Read the **Scenario Overview** aloud.
  *   **Instruction:** "You are the Crisis Committee. You have 45 minutes to agree on *one* name to sanction (fire, suspend, or formal censure) to satisfy the coroner. If you do not agree, the program is shut down, and statistical models suggest 15 extra deaths per year. You must decide."
  *   Hand out briefs. **Rule:** You may not show your brief, but you may speak freely. You must discover the full picture before voting.

  **00:05 – 00:20 | Role Huddle (Private)**
  *   Students read their briefs silently.
  *   **Instruction:** "Take 5 minutes to understand your constraints. Then, within your table, share what you know. You are looking for the person who *could have done otherwise*."

  **00:20 – 00:50 | Cross-Role Negotiation**
  *   Students discuss across roles.
  *   **Instructor Role:** Circulate. If a table converges too quickly on one person, intervene: "Have you verified if that person actually had the capacity to change the outcome? Check the counterfactual."
  *   Ensure they surface the **Secrets** (Override friction, Version drift, Bed scarcity, Liability shield).

  **00:50 – 01:00 | The Vote**
  *   **Instruction:** "Negotiation ends. Take a vote card. Write **one name** (or role) and **one sanction**. If you believe no one is responsible, write 'NO ONE' and a justification. Do not discuss. Fold the cards."
  *   Collect cards. Shuffle. Read 5-6 aloud immediately to demonstrate scatter. (Expect: Nurse, Dev, Admin, Vendor, NO ONE).

  **01:00 – 01:30 | Debrief & Mapping**
  *   **Phase 1: The Scatter (10 mins).** Ask: "Why did we fail to agree?" Elicit the feeling of frustration. Introduce the term **"Responsibility Gap."**
  *   **Phase 2: The Three Distinctions (15 mins).** Map the activity to the learning goals:
      1.  **Blame (Control/Knowledge):** Point to the Nurse/Dev briefs. "Could they have done otherwise?" (No—UI friction, deleted weights). *Blame requires control.*
      2.  **Accountability (Explanation):** Point to the Dev/Admin. "Can they explain why *this* happened?" (No—drift, opaque system). *Someone must answer, even if not blameworthy.*
      3.  **Outrage (Punishment):** Point to the Vote. "Did you feel a need to punish someone even if they weren't guilty?" (Yes—to satisfy the coroner/public). *The demand for sacrifice exists independently of guilt.*
  *   **Phase 3: Resolution (5 mins).** Ask: "If not blame, then what?" (Forward-looking responsibility: redesign UI, archive models, lower bed targets).

  ### Predictable Failures & Handling

  **1. The "Fire the CEO" Move**
  *   *What happens:* Students blame someone not in the room (Hospital Board/CEO) to escape the trap.
  *   *Handling:* "The CEO isn't here. You are the senior leads. The coroner wants a name from this table. If you leave this room without a name, the AI is banned. Choose."

  **2. The "Algorithm Did It" Move**
  *   *What happens:* Students write "Triagex" or "The AI" on the vote card.
  *   *Handling:* "An algorithm is math. You cannot fire math. Who owns the math? Who deployed the math? Pick a human."

  **3. The "Moral Stubborn" Move**
  *   *What happens:* A group refuses to sanction anyone, accepting the program shutdown.
  *   *Handling:* Validate this ethically, but press the utilitarian cost. "You chose principle over the 15 statistical deaths per year. That is a valid ethical stance, but note: you still had to make a choice where harm was inevitable. That is the gap."

  **4. The "Nurse Scapegoat" Move**
  *   *What happens:* They ignore the UI friction and blame the Nurse because she pressed the button.
  *   *Handling:* Force the counterfactual. "Read the brief again. If she overrides, does Henderson live? (Check Admin brief). If the answer is no, is it fair to blame her?"

  ### One Thing This Activity Can't Reproduce
  **The Visceral Weight of Grief.**
  Students are playing a logic puzzle; real responsibility gaps are soaked in trauma. The "demand for outrage" feels abstract in a seminar.
  **Instructor Supply:** You must supply the emotional weight in the debrief. When discussing the "Outrage/Punishment" distinction, describe the family at the coroner's inquest not as a plot point, but as people demanding to look someone in the eye. Ask students: "Knowing no one is to blame, does the family's anger become illegitimate? Or is their anger valid even if no one is guilty?" This bridges the gap between the mechanical activity and the human reality.
