      *   *Commitment G (Substitution Test):* A heuristic for validating illusionist claims.

      *   *Tension 1: Marta vs. Anaesthetist (The Severity of Suffering).*
          *   In the Anaesthetist case, the goal is to ensure *no experience*. If illusionism is true, "no experience" means no introspective model of experience.
          *   In the Marta case, she reports *no experience* (no introspective model of pain) at the time, but later says she suffered.
          *   If suffering is defined functionally (Commitment C: disposed to avoid, wrecks plans), did Marta's plans get wrecked *at the time*? She avoided nothing. She insisted she was fine.
          *   If she didn't avoid anything and didn't report pain, in what functional sense was she suffering *then*?
          *   The user says she *was* suffering. Why? Because of the later report?
          *   If suffering is functional (avoidance), then during the condition, she wasn't suffering functionally.
          *   If suffering is about the "illusion of pain" (the introspective model), then during the condition, she didn't have the illusion, so she didn't suffer phenomenally (which doesn't exist anyway).
          *   But the user says she *was* in agony. This implies there's a fact of the matter about suffering independent of concurrent functional disposition or concurrent introspective report.
          *   This clashes with Commitment C (ethics based on disposition/avoidance). If she wasn't disposed to avoid it then, why was it bad then?
          *   This also clashes with Commitment E (Anaesthetist). If the anaesthetist ensures no experience to prevent suffering, and Marta had "no experience" (by her own report) but *was* suffering, then the anaesthetist's metric (patient reports nothing/reacts nothing) might fail to detect suffering.
          *   Actually, the deeper tension is between the definition of suffering. Is it the functional state (C) or the underlying physical state that *usually* causes the functional state (Marta)?
          *   If Marta's nervous system was firing pain signals (physicalism) but the introspective module was offline (no report/avoidance), did she suffer?
          *   User says yes. But Ethics (C) says suffering matters because creatures are disposed to avoid it. Marta wasn't.
          *   So, either Marta didn't suffer (contradicting user verdict), or Ethics (C) needs adjustment (suffering is about the physical state, not the disposition).
