          *   If Marta lacked the thick illusion (she reported no experience), did she have consciousness of pain?
          *   User says she was in agony. Agony implies consciousness of pain.
          *   If she lacked the illusion, she lacked the consciousness (by Commitment B).
          *   So she couldn't have been in agony.
          *   Contradiction: She was in agony (Verdict) vs. She lacked the illusion (Report).
          *   To resolve: Agony = Physical State + Potential for Illusion? Or Agony = Physical State regardless of Illusion?
          *   If Agony = Physical State, then Illusionism about *phenomenality* is fine, but Realism about *pain* remains.
          *   But User says "nothing has value except in so far as it affects some creature that is conscious."
          *   If Marta wasn't conscious of the pain (no illusion), was she affected in the relevant way?
          *   This ties back to Ethics.

      *   *Tension 4: Substitution Test (G).*
          *   Is it begging the question?
          *   "The hurt of a migraine is indescribable" -> "The state introspectively represented as having hurt is indescribable."
