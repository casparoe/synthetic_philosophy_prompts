          *   Cost: Must clarify if "agony" refers to the physical damage or the mental state. If physical, Illusionism holds but "agony" is misleading. If mental, Illusionism fails for Marta.

      *   *Severity 4: Substitution Test & Thin/Thick Distinction.*
          *   These are tools. They might be masking the Marta problem.
