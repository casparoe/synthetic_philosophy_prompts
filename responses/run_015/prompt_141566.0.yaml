          *   Risk: It assumes the target of the report is the representation, not the property. This is the core illusionist move. It's not a test so much as a restatement of the theory.
          *   It might hide the tension in the Marta case.
          *   Marta: "I was in agony." Substitution: "I was in a state introspectively represented as agony."
          *   But she *wasn't* introspectively represented as agony at the time. She reported nothing.
          *   So the substitution fails for the concurrent state. It only works for the memory.
          *   So the Substitution Test reveals the tension: The "agony" exists in the memory model, not the concurrent state.
          *   If the agony is only in the memory model, was she suffering *then*?
          *   User says yes. This contradicts the result of the Substitution Test applied to the concurrent moment.

  3.  **Synthesize and Order Tensions:**

      *   *Severity 1: The Marta Verdict vs. The Definition of Suffering (Ethics & Illusionism).*
          *   This is the core conflict. If suffering requires the introspective illusion (as per Illusionism + Thick Illusion), Marta didn't suffer *then*. If suffering requires functional avoidance (Ethics), Marta didn't suffer *then*.
