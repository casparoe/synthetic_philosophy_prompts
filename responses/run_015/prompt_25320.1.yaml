      *   **Tension F: (1) & (7).**
          *   (1) Mind is software/TM.
          *   (7) Mind is rule-governed/mechanical but not capturable in a single formal system.
          *   *Analysis:* "Not capturable in a single formal system" could mean "not a TM" (if interpreted as non-recursive). But (7) clarifies "computable in principle." It means the *set of theorems* the mind accepts might not be recursively enumerable *by the mind itself*, or the index is unknown. Actually, if the mind is a TM, the set of outputs *is* RE. (7) says "not capturable in any single formal system *we can antecedently specify*." This is the Feferman/unknown machine line.
