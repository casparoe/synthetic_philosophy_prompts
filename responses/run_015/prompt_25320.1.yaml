          *   Why: If Mind = TM, there is a $G_{Mind}$ we can't prove. (3) says we can prove $G$'s for systems we trust. (8) says we can't trust our own consistency. This fits, *but* it requires accepting a permanent epistemic blind spot about oneself.
          *   Resolution: Accept the blind spot (consistent with 8).
      *   **Rank 3 (Minor): (3) vs. (7).**
