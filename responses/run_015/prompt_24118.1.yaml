answer: |-
  Here is a lesson plan designed for a 60-minute seminar. It is tight, so keep the transitions crisp.

  ### Activity Title: "The Arbitrary Scale"

  **Core Pedagogical Goal:** Students will assign utility numbers to a consistent preference ordering, use those numbers to predict a choice under risk, and observe that different (but ordinally equivalent) assignments yield contradictory predictions.

  **Class Size:** 16 Students + 1 TA.
  **Materials:** Three distinct "prizes" of varying desirability (e.g., a full-size chocolate bar, a fun-size candy, a generic sticker or "nothing"), a whiteboard, and slips of paper.

  ---

  ### 1. Roles & Setup

  *   **The Agent (1 person):** Ideally, **you (the TA)** play this role.
      *   *Why?* You guarantee transitive preferences. If a student plays the Agent and wavers, the lesson derails into "are people rational?" rather than "what do utility numbers mean?" (See "Troubleshooting" below).
      *   *Task:* You have a fixed, private preference ordering over the three prizes. You will answer certainty questions truthfully. When the risk choice comes, you will choose based on your *actual* risk attitude (which the students do not know).
  *   **The Modelers (15 students):** Split into **Team Alpha** and **Team Beta**.
      *   *Task:* They observe the Agent's ordinal preferences. They must construct a utility function $U(x)$ consistent with those preferences. They then use Expected Utility Theory (EUT) to predict the Agent's choice in a lottery.
  *   **The Prizes:**
      *   $A$: Chocolate Bar (Best)
      *   $B$: Fun-Size Candy (Middle)
      *   $C$: Sticker/Nothing (Worst)

  ---

  ### 2. Minute-by-Minute Timeline

  **00:00 – 05:00 | Setup & Grouping**
  *   Divide class into Team Alpha (left) and Team Beta (right).
  *   Display the three prizes.
  *   **TA (as Agent):** "I have a strict ordering over these items. I will not lie about my preferences."

  **05:00 – 15:00 | Phase 1: Ordinal Elicitation**
  *   Ask the class to query you to establish the ordering.
  *   *Query:* "Do you prefer A to B?" (Yes). "B to C?" (Yes).
  *   **Whiteboard:** Write $A \succ B \succ C$.
  *   **Instruction to Modelers:** "Your job is to model my preferences. Assign numerical utility values $U(A), U(B), U(C)$ to these outcomes. The *only* rule is that your numbers must respect the ordering ($U(A) > U(B) > U(C)$). You may choose any numbers you like."
  *   *Crucial Constraint:* Tell them they cannot talk to each other yet. They must write their numbers down secretly.

  **15:00 – 25:00 | Phase 2: The Arbitrary Assignment**
  *   **Team Alpha Instruction:** Whisper to Team Alpha (or write on their sheet): *"Try to space the numbers evenly. For example, 10, 5, 0."*
  *   **Team Beta Instruction:** Whisper to Team Beta: *"Make the top prize much more valuable than the middle one. For example, 100, 90, 0."*
  *   *(Note: By seeding these specific numbers, you guarantee the conflict. If you let them choose freely, they might accidentally pick the same ratios.)*
  *   Teams calculate their utility functions.

  **25:00 – 35:00 | Phase 3: The Risk Prediction**
  *   **The Scenario:** Present the choice the Agent must face.
      *   **Option 1 (Sure Thing):** Receive $B$ (Fun-Size Candy) with 100% probability.
      *   **Option 2 (Lottery):** A coin flip. 50% chance of $A$ (Chocolate), 50% chance of $C$ (Sticker).
  *   **Task:** Teams must predict which option the Agent will choose using Expected Utility: $E[U] = 0.5 \cdot U(A) + 0.5 \cdot U(C)$.
  *   Teams submit their prediction on a slip of paper: "Sure Thing" or "Lottery" or "Indifferent."

  **35:00 – 45:00 | Phase 4: The Reveal**
  *   Ask Team Alpha for their prediction and their math.
      *   *Likely:* $0.5(10) + 0.5(0) = 5$. $U(B) = 5$. Prediction: **Indifferent.**
  *   Ask Team Beta for their prediction and their math.
      *   *Likely:* $0.5(100) + 0.5(0) = 50$. $U(B) = 90$. Prediction: **Sure Thing.**
  *   **The Climax:** You (The Agent) reveal your actual choice.
      *   *TA Script:* "I actually prefer the Sure Thing." (Or whatever your genuine risk attitude is, but 'Sure Thing' usually resonates better with risk aversion).
  *   **Result:** Team Beta is "right." Team Alpha is "wrong."
  *   **The Kicker:** Ask Team Alpha: "Did you violate the ordinal rule?" No. "Did you do the math wrong?" No. "Then why were you wrong?"

  **45:00 – 60:00 | Phase 5: Debrief (The Philosophical Turn)**
  *   (See script below).

  ---

  ### 3. The Debrief Script: Mapping Moments to Concepts

  Do not lecture immediately. Ask Socratic questions to let them articulate the gap.

  **Step 1: The Invariance Point (Ordinality)**
  *   **Ask:** "Team Alpha, did your numbers contradict my ranking of A, B, and C?"
  *   **Students:** "No."
  *   **Point:** "Correct. Your utility function is a valid **ordinal representation**. In standard consumer theory (Hicksian), any monotonic transformation of your numbers represents the *same* preferences. $10, 5, 0$ is theoretically equivalent to $100, 90, 0$."
  *   **Philosophical Hook:** "If utility is just a label for ranking, why did the numbers matter in Phase 3?"

  **Step 2: The Ordinal-Cardinal Gap (Risk)**
  *   **Ask:** "What specific mathematical operation did you perform in Phase 3 that you didn't do in Phase 1?"
  *   **Students:** "Multiplication/Addition" or "Averaging."
  *   **Point:** "Exactly. You took an **expectation**. To add or average numbers, the *intervals* between them must mean something. Team Alpha assumed the 'distance' in satisfaction between A and B was the same as B and C. Team Beta assumed the drop from A to B was small, but B to C was huge."
  *   **The Punchline:** "Ordinal utility recovers the *order*. Expected Utility requires the *scale*. When we moved from certainty to risk, the 'arbitrariness' of the numbers stopped being harmless and became fatal to the prediction."

  **Step 3: The Solution (vNM Utility)**
  *   **Ask:** "How could Team Alpha have gotten the right numbers without guessing?"
  *   **Guide them:** They needed to ask you about the *lottery* itself.
  *   **Concept:** Introduce the von Neumann-Morgenstern (vNM) method. To fix the scale, you must elicit the probability $p$ where I am indifferent between $B$ for sure and the Lottery $(p A, (1-p) C)$. That $p$ fixes the cardinal utility.
  *   **Takeaway:** "Revealed preference over sure outcomes cannot generate the utility function needed for risk. You need revealed preference over *lotteries*."

  ---

  ### 4. Troubleshooting: The Intransitivity Worry

  You asked: *"I suspect their revealed preferences won't be transitive... bug or feature?"*

  **The Verdict:** In this specific 60-minute context, it is a **Bug**.

  **Why:**
  1.  **Cognitive Load:** If students spend 15 minutes trying to figure out why the Agent prefers C to A after saying A to B, you lose the clock needed for the Risk phase.
  2.  **Conceptual Confusion:** Intransitivity implies *no utility function exists* (ordinal or cardinal). You want to demonstrate that an ordinal function *does* exist, but it is *insufficient* for risk. Intransitivity muddies this specific distinction.

  **How to Manage It:**
  *   **Play the Agent yourself.** State clearly: "For the purpose of this model, I am a rational agent with transitive preferences." This is standard modeling practice.
  *   **If a Student insists on playing Agent:** Give them a private instruction card: *"Your preferences are A > B > C. Do not change your mind."*
  *   **Exploiting it later:** If a student challenges you ("But real people aren't transitive!"), park that comment. "That is an excellent point for week 4 on Behavioral Econ. Today, we are analyzing the internal logic of the Standard Model. Even if the Agent *were* perfectly transitive, does the Modeler have enough info to predict risk? That is our question."

  ---

  ### 5. Limitations: What This Activity Cannot Do

  Be frank with yourself about where the activity ends and your lecture must begin.

  1.  **It does not derive the vNM Axioms:** The game shows *why* we need cardinal utility, but it does not prove *that* cardinal utility exists (the Representation Theorem). You must still lecture on Independence and Continuity axioms.
  2.  **It assumes EUT is the correct model:** The game presupposes that the Agent *should* be maximizing Expected Utility. It does not address Prospect Theory or other critiques of EUT. The "failure" in the game is a failure of *information* (ordinal vs cardinal), not necessarily a failure of the *theory* (though you can hint at that).
  3.  **It conflates Risk Aversion with Cardinal Scaling:** Students might think Team Beta won because the Agent is "risk averse." You must clarify: Risk aversion *is* the curvature of the cardinal utility function. Team Alpha assumed a linear function (risk neutrality) by spacing numbers evenly; Team Beta assumed a concave function. The lesson is that **ordinal data cannot distinguish between risk attitudes.**

  ### Summary for the TA
  *   **Control the Agent:** Ensure transitivity to save time.
  *   **Seed the Numbers:** Don't let teams pick numbers totally randomly; guide them to ensure one team implies risk neutrality and the other risk aversion.
  *   **Hold the Line:** When they ask "But what is utility really?", answer: "Today, it's a number we use to predict. The lesson is that not just any number will do."
