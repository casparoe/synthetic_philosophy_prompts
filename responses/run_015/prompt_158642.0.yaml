      *   *Critique of (ii) Material:* Too deterministic. Agency mattered (Sulla's choice to march on Rome). Inequality is a stressor, not a trigger.
      *   *Critique of (iii) Fatalism:* Dangerous. It creates a self-fulfilling prophecy.
      *   *Surviving Fragment:* The danger of privatised coercion and the erosion of the "loyal opposition."
      *   *Better Analogy:* The Interwar Period (1920s-30s Europe).
          *   *Why:* Mass politics, ideological polarisation, economic shock, paramilitary violence, *constitutional* democracies failing from within.
          *   *Benefit:* Closer temporally, involves modern institutions (parties, press), highlights agency (choices made by conservatives to ally with fascists).
      *   *Alternative:* Weimar Germany is the classic, but maybe too specific. "Interwar Europe" generally is better.

  7.  **Review and Refine (Self-Correction):**
      *   *Language Check:* Ensure British spelling (labour, programme, centre, defence).
      *   *Tone Check:* Is it too academic? Keep it accessible for a lecture.
      *   *Fact Check (Mental):* Dates of Gracchi (133 BC), Actium (31 BC). Sulla's march (88 BC). Marius's reforms (landless recruitment).
      *   *Addressing the "Three Moves":* Ensure I explicitly state which ones survive. (Spoiler: None survive intact, but fragments of i and ii do).
