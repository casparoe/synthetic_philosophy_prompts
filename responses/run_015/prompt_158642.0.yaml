      *   *Tribunate:* Veto powers/Populist representatives? (Sacrosanctity is the missing bit).
      *   *Assemblies:* Electorate/Referenda? (Romans voted in blocks, not secret ballot initially).
      *   *Militia:* Citizen soldiers? (No, we have professional standing armies).
      *   *Proconsular Command:* Governors/Generals? (Key difference: private loyalty).
      *   *Clientela/Patronage:* Lobbying/Party Machines? (Scale differs).
      *   *Grain Dole:* Welfare/Social Security? (Purpose differs: pacification vs. right).
      *   *Italian Allies:* States/Regions? (Citizenship issue is key).
      *   *Latifundia/Slaves:* Corporations/Gig Economy? (Slave labour is the hard stop).
      *   *Proscriptions:* Political cancellation/Asset forfeiture? (Literal killing is the hard stop).
