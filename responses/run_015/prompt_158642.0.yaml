  4.  **Drafting Section 2: Mechanisms vs. Costumes:**
      *   *Goal:* Identify the *engine* of collapse, not the scenery.
      *   *User's Hypothesis:* Landless militia -> Army as pension fund (loyal to general). Zero-sum elite competition (no loyal opposition).
      *   *Assessment:* This is the standard "Syme/Brunt" interpretation. It holds up well. The *privatisation of violence* is the key mechanism. In Rome, the state didn't have a monopoly on violence; generals did.
      *   *Refinement:* Emphasise the *integration* of the army into the political sphere. In modern democracies, the military is (mostly) subordinate to civilian rule. In Rome, the military *was* the political leverage.
      *   *Elite Competition:* The *cursus honorum* was a single ladder. Losing meant exile or death. Modern elites have lateral moves.

  5.  **Drafting Section 3: Where It Breaks (Exit & Tempo):**
      *   *Exit:* User's point is strong. Roman elites were "all in." Modern elites can cash out.
      *   *Implication:* Does this make us more or less fragile?
          *   *Roman:* High stakes = high violence.
          *   *Modern:* Low stakes (relative) = potential for apathy/capital flight rather than civil war. But also, if elites don't care about the system, they might sell it off.
          *   *Verdict:* Exit options reduce *violent* collapse risk but increase *hollowing out* risk.
      *   *Tempo:* Rome = ~80 years (Gracchi 133 BC to Actium 31 BC). Modern = Decades?
      *   *Information Speed:* Rome moved at the speed of a horse. We move at the speed of light. Polarisation spreads faster. However, institutions are stickier now (bureaucracy).
      *   *Verdict:* Tempo makes prediction harder. Rome's slowness allowed for course correction that failed. Our speed might bypass the "warning signs" phase entirely.

  6.  **Drafting Section 4: Verdict on Conclusions & Alternative:**
