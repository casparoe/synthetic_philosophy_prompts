      *   *Check:* Did I address the "worst-case" nature? Yes, emphasize that real-world preferences aren't always the pathological ones constructed in proofs.
      *   *Check:* Is the distinction between SWF and SCF clear? SWF = Ranking, SCF = Winner.
      *   *Check:* Gibbard's proof detail. Gibbard showed that a strategy-proof SCF induces a SWF satisfying Arrow's conditions. Thus Arrow $\rightarrow$ GST. (Wait, let me verify the direction).
      *   *Verification:* Gibbard (1973) "Manipulation of Voting Schemes". He proves that if a SCF is strategy-proof, it is dictatorial. The proof constructs a social welfare relation from the SCF. If the SCF is SP, the induced SWF satisfies IIA and Pareto. Then Arrow implies the SWF is dictatorial, which implies the SCF is dictatorial. So Arrow is a lemma in Gibbard's proof.
      *   *Correction on "Arrow is special case of GST":* Actually, it's often viewed the other way around in terms of logical dependency in the proof (Gibbard uses Arrow). But conceptually, GST is about choice, Arrow about welfare. The claim "Arrow is GST looking at the top" is sloppy because Arrow constrains the *whole* ordering, not just the top.

  7.  **Final Polish:** Ensure the practical advice is actionable. Suggest Approval Voting or Score Voting as they often perform better heuristically than IRV in small groups, even if they don't escape the theorems (Score isn't ordinal, so GST technically doesn't apply directly, but strategic issues remain). Actually, GST applies to ordinal mechanisms. Cardinal mechanisms (Score) escape the *letter* of GST but face similar strategic issues (though often less severe). I should mention Cardinal voting as a practical "escape" from the *ordinal* constraints, even if not a theoretical magic bullet.

