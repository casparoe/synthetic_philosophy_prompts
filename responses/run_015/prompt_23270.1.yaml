          *   Context: Committee of 6 people, 8 venues.
          *   Question: What do the theorems imply for this specific small group?
          *   Question: Is ranked voting guaranteed to be gameable?
          *   Question: What are the escape hatches (randomization, binary choice, single-peaked preferences) and their costs?

  2.  **Part 1: Theoretical Comparison (Arrow vs. Gibbard–Satterthwaite)**

      *   *Arrow's Impossibility Theorem (1951):*
          *   **Output:** Social Welfare Function (SWF) $\rightarrow$ A complete ranking of *all* alternatives.
          *   **Inputs:** Profiles of individual ordinal rankings.
          *   **Conditions:**
              1.  Unrestricted Domain (UD).
              2.  Pareto Efficiency (PE) / Weak Pareto.
              3.  Independence of Irrelevant Alternatives (IIA).
              4.  Non-Dictatorship (ND).
          *   **Result:** No SWF satisfies all four if $|Alternatives| \ge 3$.
      *   *Gibbard–Satterthwaite Theorem (1973/1975):*
          *   **Output:** Social Choice Function (SCF) $\rightarrow$ A single winner.
          *   **Inputs:** Profiles of individual ordinal rankings.
          *   **Conditions:**
              1.  Unrestricted Domain (UD).
              2.  Surjectivity (Onto) / Non-imposition (Every option *can* win).
              3.  Strategy-Proofness (SP) (No incentive to lie).
              4.  Deterministic.
          *   **Result:** No SCF satisfies all three (plus determinism) if $|Alternatives| \ge 3$. It must be dictatorial.
      *   *Relationship:*
          *   Are they the same? No. One is about rankings (welfare), one is about winners (choice).
          *   Does one imply the other? They are deeply linked.
          *   *GST $\rightarrow$ Arrow?* Not directly, but close. If you have a strategy-proof SCF, it implies monotonicity.
          *   *Arrow $\rightarrow$ GST?* Gibbard's original proof *did* use Arrow's theorem. He constructed a "extended" preference relation over outcomes to leverage Arrow.
          *   *The "Top of the Ranking" Claim:* This is sloppy. Arrow requires IIA on the *whole* ranking. GST requires Strategy-Proofness on the *winner*. While a dictatorial SWF yields a dictatorial SCF (by taking the top), the conditions (IIA vs. SP) are distinct concepts, though mathematically related in the proof structures.
      *   *Key Distinction:* IIA (Arrow) is about consistency of social ranking when irrelevant options drop out. Strategy-Proofness (GST) is about individual incentives to misrepresent preferences.

  3.  **Part 2: Logical Implications & Proof History**

      *   Gibbard (1973) proved GST for SCFs.
      *   Satterthwaite (1975) independently proved it.
      *   Gibbard's proof strategy: He showed that if a SCF is strategy-proof, it induces a SWF that satisfies Arrow's conditions. Therefore, if Arrow says "Dictatorship," GST says "Dictatorship."
      *   So, GST *relies* on Arrow (in Gibbard's proof), but they address different mechanism design questions.
      *   *Refinement:* The claim "Arrow is GST restricted to the top" is technically incorrect because Arrow's IIA is a stronger structural constraint on the *ranking* than SP is on the *choice*, but the impossibility result (Dictatorship) is the same.

  4.  **Part 3: Practical Application (The Committee Scenario)**

      *   *Context:* $N=6$ voters, $M=8$ venues.
      *   *Implication:* Since $M \ge 3$, the theorems apply technically.
      *   *Does it mean voting is useless?* No. Theorems are "worst-case." They say *no rule is perfect for all possible preference profiles*. They do not say *every profile will break the rule*.
      *   *Gameability:* Yes, theoretically, any non-dictatorial rule (IRV, Borda, Plurality) can be manipulated *if* voters know enough about others' votes and have specific preference structures.
      *   *Reality Check:* In a committee of 6, do people know each other's preferences well enough to strategize effectively? Often no. The "threat" is often theoretical unless the stakes are high and information is perfect.
      *   *Escape Hatches:*
          1.  **Restrict Domain (Single-Peaked):** If preferences are single-peaked (e.g., venues ordered by distance or cost), Median Voter Theorem applies. Majority rule works and is strategy-proof. *Cost:* Requires a natural ordering of venues (hard for "vibe" based venues).
          2.  **Binary Choice:** If $M=2$, Arrow and GST don't apply (need $\ge 3$). *Cost:* You have to narrow down to 2 first (which reintroduces the problem in the narrowing stage).
          3.  **Randomization:** Pick a rule that outputs a probability distribution (e.g., Random Dictator). *Cost:* People hate randomness for concrete decisions like venues.
          4.  **Accept Imperfection:** Use a standard rule (like Approval or Score Voting) and acknowledge it's not perfect.
