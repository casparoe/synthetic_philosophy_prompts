answer: |-
  The institutional patchwork you describe presupposes an implicit theory of labor and leisure that can be characterized as **Instrumental Productivism within a Framework of Regulatory Arbitrage.**

  This theory does not rest on a coherent moral philosophy regarding human flourishing. Instead, it rests on an economic ontology where time is a raw material to be extracted, and local moral/legal frameworks are treated as variable costs of production rather than universal ethical boundaries.

  Here is the reconstruction of that theory, the distinction between its requirements and accommodations, and the blueprint for a genuinely leisure-rights-based alternative.

  ### 1. The Implicit Theory: Instrumental Productivism

  **The Moral Status of Labor:**
  The onboarding materials framing labor as a "moral virtue" indicate that the institution presupposes work has **intrinsic moral value**. This is a secularized Protestant Work Ethic where professional contribution is the primary metric of human worth. In this view, the worker is not merely selling time; they are investing their identity. Therefore, labor is the default state of moral rectitude.

  **The Moral Status of Leisure:**
  Leisure is not treated as a distributive good comparable to health care (a universal entitlement necessary for dignity). Nor is it treated as having intrinsic value. Instead, leisure is **instrumentally valuable**.
  *   **As Recovery:** Wellness initiatives frame rest as "therapeutic recovery." This implies rest is only legitimate insofar as it repairs the worker for further labor. It is maintenance, not a right.
  *   **As Risk:** In the U.S. and Tokyo contexts, unmonitored leisure is treated as a risk to productivity. The "unlimited vacation" policy paired with response-time metrics creates a "freedom trap": you *can* rest, but if you do, you fail the meritocratic metrics that determine survival.

  **Positive vs. Negative Rights to Leisure:**
  The institution presupposes that individuals hold **no positive right to leisure**.
  *   A *positive right* would require the institution to actively structure workflows to guarantee non-work time (e.g., shutting down servers, mandating minimum time off).
  *   The current model offers, at best, a *negative right* (permission to be absent) which is immediately undermined by structural incentives (metrics, culture).
  *   The only exception is where the state imposes a positive right (France/Belgium). Here, the firm complies not out of philosophical agreement, but out of legal necessity.

  **Compatibility of Commitments:**
  Do the Paris, Tokyo, and U.S. practices share a single conception? **Philosophically, no. Economically, yes.**
  *   **Philosophical Incompatibility:** The French "right to disconnect" asserts that the worker owns their time outside of contract. The Tokyo "karoshi" culture asserts the worker owes their life to the collective. The U.S. model asserts the worker owns their time but is economically coerced into selling it all. These are mutually exclusive moral claims.
  *   **Economic Compatibility:** The firm reconciles these via **Regulatory Arbitrage**. The underlying conception is that *labor is a commodity* and *law is a friction*. The firm's unified theory is that it should extract the maximum possible labor units per dollar, constrained only by the local penalty function (laws). The "incompatible" moral commitments are managed simultaneously because the firm does not view them as moral commitments at all, but as environmental variables.

  ### 2. Requirements vs. Accommodations

  To understand the power dynamics, we must distinguish what the system *needs* to function versus what it *tolerates*.

  **Strictly Required (The Core Logic):**
  1.  **Total Availability:** The response-time metrics reveal the true requirement. Regardless of official hours, the worker must be cognitively available to the firm's demands.
  2.  **Moral Identification:** Workers must internalize the idea that their value is contingent on their output/availability. This is required to make the "unlimited vacation" self-policing.
  3.  **Flexibility of Extraction:** The firm requires the ability to shift labor burdens to whichever jurisdiction allows the most extraction at the lowest cost.
  4.  **Privatization of Rest:** Rest must remain an individual responsibility (wellness) rather than a structural guarantee. If rest were structural, extraction rates would be capped.

  **Merely Accommodated (The Surface Features):**
  1.  **Local Labor Laws:** The 35-hour week in France is accommodated as a compliance hurdle, not a value. (Evidence: If the firm truly valued the *principle* of disconnect, it would apply similar technical safeguards in the U.S. and Tokyo, which it does not).
  2.  **"Unlimited" Vacation:** This is an accommodation of modern labor rhetoric, designed to appear progressive while functioning as a mechanism to reduce liability (no accrued payout) and increase guilt (no clear baseline).
  3.  **Wellness Initiatives:** These accommodate the symptom (burnout) without treating the cause (overwork). They are permitted because they sustain the extractive capacity of the workforce.

  ### 3. Designing a Leisure-Rights-Based Institution

  A genuinely leisure-rights-based design would reject the instrumentalization of rest. It would treat leisure as a **positive right** and a **distributive good** essential to citizenship within the firm, comparable to safety equipment or fair pay.

  To achieve this, the institution would need to make the following structural changes:

  **A. Measurement of Contribution (Decoupling Time from Value)**
  *   **Current:** Response times, hours logged, "face time" (virtual or physical).
  *   **Required Change:** Shift to **Outcome-Based Auditing with Caps**. Contribution is measured solely by delivered value against agreed-upon milestones. Crucially, *speed* beyond a certain threshold is not rewarded. If a task is completed in 20 hours, the worker is not expected to fill the remaining 15 with more work; they are expected to stop.
  *   **The Metric Shift:** Eliminate response-time metrics entirely. Replace them with "Handoff Quality" and "Sustainability Metrics" (e.g., tracking team burnout rates as a management KPI).

  **B. Allocation of Rest (Structural Guarantees)**
  *   **Current:** "Unlimited" (undefined) vacation; Wellness (individual repair).
  *   **Required Change:** **Mandatory Minimum Time Off.** "Unlimited" is abolished in favor of a *minimum* usage policy (e.g., "You must take 25 days, and if you do not, you are in violation of company policy"). This flips the stigma: taking vacation becomes a compliance requirement, not a request for permission.
  *   **Technical Enforcement:** Implement a **Right to Disconnect Protocol**. Email servers delay delivery of non-urgent messages sent outside of contracted hours. Instant messaging tools automatically disable "read receipts" and notifications after hours. This creates a technical barrier that protects the worker from the "soft coercion" of availability.

  **C. Moral Re-framing (De-moralizing Labor)**
  *   **Current:** Onboarding frames labor as virtue.
  *   **Required Change:** Onboarding must frame labor as a **contractual exchange of value**, not a moral vocation. The narrative must shift from "We are a family/dedication" to "We are a partnership of professionals."
  *   **Management Accountability:** Managers are evaluated not just on team output, but on team *retention of leisure*. If a team consistently works late, the *manager* is penalized for poor planning, not the workers rewarded for dedication.

  **D. Jurisdictional Consistency (Universal Rights)**
  *   **Current:** Rights depend on geography (Paris vs. Tokyo).
  *   **Required Change:** **The Global Floor.** The firm adopts the highest standard of labor protection across all jurisdictions as the global baseline. If the "right to disconnect" is good for a French human, it is good for an American or Japanese human. This rejects regulatory arbitrage in favor of universal human capital dignity.

  ### Summary
  The current institution operates on a theory of **Neoliberal Extractivism**: labor is the locus of virtue, leisure is a maintenance cost, and rights are local constraints to be navigated. It holds incompatible moral views together by subordinating them to profit maximization.

  A leisure-rights-based institution would operate on a theory of **Civic Republicanism within the Firm**: leisure is a prerequisite for autonomy, rest is a structural guarantee rather than a therapeutic reward, and the firm's obligation is to actively protect the worker's time, not merely purchase it. This requires moving from *permission-based* rest to *protection-based* rest.
