answer: |-
  1. "What both of them can sign"

  We agree that the word "true" functions correctly in ordinary discourse when used to endorse claims, generalize over statements, or distinguish fact from error. We both accept the equivalence schema: to assert "It is true that P" is logically equivalent to asserting "P". We agree that within fiction, truth claims operate differently. To say "It is true in the manuscript that the letters were burned" is not to claim the letters were actually burned, but rather that the text prescribes we imagine they were. We agree this is usually distinct from factual truth.

  However, we disagree on what happens when the fictional claim matches the fact. We agree the manuscript exists, that it contains claims, and that some claims correspond to reality while others do not. We agree that Marguerite's husband wrote it, that the narrator is unreliable, and that distinguishing the layers matters for understanding his life. We agree that language allows us to prefix claims with "In the story..." to mark fictional status. We agree that confusion arises when the prefix is dropped accidentally or intentionally. We agree that the goal of this document is to isolate whether this confusion reveals a deep metaphysical problem or merely a pragmatic ambiguity. We agree that if "truth" were merely a logical device, the collision should be harmless. If "truth" is a robust property, the collision should reveal a category error. We agree to test this against the specific case of the burned letters.

  We explicitly identify one verbal dispute: the word "property." Marguerite uses it to mean a causal or explanatory feature natural science might recognize. Friend uses it to mean a genuine attribute that grounds normative norms. We agree that much of our past shouting matched this definitional split. We agree to suspend judgment on whether truth explains success until the cruxes are tested. We agree that the deflationary schema works perfectly for standard empirical claims and standard fictional claims separately. The only dispute is the boundary zone. We agree that resolving this matters for how Marguerite interprets her husband's legacy.

  2. "Where they still differ"

  The following table captures the remaining disagreements. Each formulation is approved by the respective party as accurate to their position. We acknowledge that while we share the vocabulary, we assign different weights to the underlying concepts.

  | Issue | Marguerite (Deflationist) | Friend (Substantivist) |
  | :--- | :--- | :--- |
  | **Nature of Truth** | Truth is not a property with a nature; it is a logical device for endorsement and generalization. It has no hidden essence to uncover. | Truth is a genuine property that beliefs possess when they correspond to reality or cohere ideally. It is a feature of the belief itself. |
  | **Explanation** | Truth does not explain why successful action occurs; accurate representation does the work, "truth" just labels it. It is transparent. | Truth explains the link between belief and success; true beliefs guide action correctly because they match the world. It is explanatory. |
  | **The Collision** | When fiction matches fact, "true" means the same thing; the context of assertion changes, not the truth predicate. The schema holds. | When fiction matches fact, two different relations are at play; conflating them obscures the distinct normative standards. The property differs. |
  | **Normativity** | The norm of assertion is social; we assert what we believe, not necessarily what is "true" in a robust sense. It is pragmatic. | The norm of assertion is constitutive; one ought to assert only what is true, because truth is the goal of belief. It is intrinsic. |

  We agree that these rows represent the live wires in the conversation.

  3. "Cruxes and predictions"

  **Crux 1: The Overlap Case**
  *Case:* The manuscript states "I burned the letters." External evidence confirms the letters were burned.
  *Marguerite's Prediction:* The sentence "It is true that the letters were burned" is univocal. The schema holds. The only difference is our evidence source (text vs. memory). The word "true" does no extra work here; it merely disquotes the claim.
  *Friend's Prediction:* The sentence is ambiguous. In one sense, it corresponds to the text's coherence; in the other, to worldly facts. Conflating them risks validating the unreliable narrator's other claims. The property of "matching the text" is distinct from "matching the world."
  *Significance:* If Marguerite is right, the manuscript's truth claims are logically homogeneous. If Friend is right, there is a category mistake in treating the manuscript as a source of truth simpliciter. This determines whether Marguerite can trust the manuscript where it aligns with reality without accepting its lies.

  **Crux 2: Explanatory Power**
  *Case:* Marguerite acts on a claim from the manuscript (e.g., looking for a key where the text says it is hidden). She finds it.
  *Marguerite's Prediction:* The success is explained by the husband's accurate memory, not by the property of truth. "True" adds nothing to the explanation of finding the key. The causal chain is physical, not semantic.
  *Friend's Prediction:* The success is explained because the belief derived from the manuscript was true. Truth is the property that mediated the successful action. Without truth, the success is accidental.
  *Significance:* If truth drops out of the explanation without loss, deflationism holds. If truth is required to explain the success, substantivism holds. This affects whether Marguerite views her husband's accuracy as a virtue or a coincidence.

  **Crux 3: The Normative Bind**
  *Case:* Marguerite feels guilty for trusting the manuscript where it lied.
  *Marguerite's Prediction:* The guilt is about being misled, not about violating a norm of truth. She violated a prudential norm, not a metaphysical one. She was careless, not irrational.
  *Friend's Prediction:* The guilt stems from treating a fictional claim as a true belief. She violated the constitutive norm of belief. She failed in her duty as a believer.
  *Significance:* Determines whether the error is practical or philosophical. If Friend is right, Marguerite's grief is compounded by epistemic sin. If Marguerite is right, it is merely a tragedy of misinformation.

  4. "Lines for the scene"

  Marguerite needs lines that cut through the metaphysics without denying the pain. She should sound tired, not lecturing.

  1. "Don't tell me truth is a thing you can hold. It's just the sound a sentence makes when it doesn't need quoting."
  2. "If 'true' means the same thing in your science and his story, then why do you flinch when I cite him as evidence?"
  3. "I'm not saying the letters weren't burned. I'm saying 'true' isn't the reason we know it."

  And the line she wants to say, but shouldn't, because it betrays her own philosophy by reifying truth into a substance that endures:

  "Truth is whatever survives the fire."
