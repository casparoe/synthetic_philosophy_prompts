answer: |-
  ### Brainstorm: "No Self" vs. "Empty but Conventional"

  *   **"There is no self" (Eliminativist/Nihilist reading):**
      *   Implies the self is a mistake, a hallucination.
      *   Ontological claim: The referent does not exist anywhere.
      *   Risk: Undermines karma, rebirth, and moral responsibility. If there's no one to suffer, why practice?
      *   Abhidharma nuance: Some Sarvastivada readings lean this way regarding the *pudgala* (person) vs. *dharmas* (phenomena). The person is fictitious; only the dharmas are real.
      *   Philosophical parallel: Eliminative materialism (Churchland). "Folk psychology" is false.

  *   **"Lacks inherent existence but works conventionally" (Madhyamaka/Prasangika reading):**
      *   Implies the self is empty of *svabhava* (own-being) but exists dependently (*pratitya-samutpada*).
      *   Ontological claim: The self exists like a mirage or a chariot—functional, but not findable upon analysis.
      *   Safety: Preserves karma and ethics within *samvriti-satya* (conventional truth).
      *   Abhidharma nuance: The continuum (*santana*) is real enough to carry karmic seeds (*vasana*) even if no permanent agent exists.
      *   Philosophical parallel: Dennett's "Center of Narrative Gravity" or Hume's bundle theory minus the skepticism.

  *   **The Pivot:** The difference isn't existence vs. non-existence; it's *mode* of existence. Inherent (independent, immutable) vs. Conventional (dependent, functional). The essay must argue that momentariness kills the former but necessitates the latter.

  ***

  ### The Flash-Frame Person: Momentariness, Designation, and the Reconstruction of Identity

  The central tension in Buddhist philosophy of mind lies not between the self and the aggregates (*skandhas*), but between the ontology of momentariness (*ksanika*) and the phenomenology of continuity. Pop-Buddhism often glosses over this by suggesting the self is merely an illusion we should ignore. However, a rigorous engagement with Abhidharma metaphysics reveals a sharper problem: if reality consists of discrete, instantaneous dharmas flashing in and out of existence like frames in a film reel, is personal identity merely false, or is it literally unformulatable? Does the ontology of momentariness destroy the substrate required for identity, or does the mechanism of conventional designation (*prajnapati*) reconstruct a form of identity that is philosophically robust?

  I argue that Abhidharma momentariness renders *substantial* personal identity unformulatable, but that conventional designation successfully reconstructs a *causal-narrative* identity. Therefore, *anatta* (no-self) is fully compatible with personal identity, provided we abandon the Western presupposition that identity requires a metaphysical substrate. In fact, the Buddhist model offers a superior account of diachronic identity because it resolves the paradox of change without recourse to a fictional "unchanging changer."

  To understand the stakes, we must grasp the severity of Abhidharma momentariness. In systems like the Sarvastivada or Sautrantika, dharmas (fundamental phenomena) do not endure. They arise, abide for a moment, and cease. There is no temporal thickness. A mental state of anger is not a state that persists through time; it is a sequence of distinct anger-dharmas causally linked. If the self were a substance, it would need to endure through these moments to claim ownership of them. But since every constituent of the person is replaced instantaneously, there is no ontological "glue" holding a self together across time. If personal identity requires numerical sameness—that the "I" of today is literally the same entity as the "I" of yesterday—then the Abhidharma ontology makes personal identity not just false, but incoherent. There is nothing to be identical.

  This suggests an eliminativist reading: personal identity is a cognitive error, a superimposition of continuity onto discontinuity. However, this reading collapses under soteriological weight. If there is no continuity, there is no karma. If the being who suffers the result of an action is not connected to the being who committed it, enlightenment is meaningless. The Buddha explicitly rejected both eternalism (the self exists forever) and annihilationism (the self is destroyed at death). To navigate this middle way, Buddhism employs the concept of *samvriti-satya* (conventional truth) and dependent designation.

  The self is not found among the aggregates, nor outside them, nor in possession of them. It is designated in dependence upon them. This is not merely a linguistic convenience; it is an ontological claim about dependent arising. The self exists *because* the aggregates exist in a causal stream (*santana*). Here, the Abhidharma moves from a static ontology to a dynamic one. Identity is not a thing; it is a process. The continuity is not one of substance, but of causality. Moment A gives rise to Moment B, imparting information (karmic seeds) without transferring a soul.

  This is where the compatibility with Western personal identity theories becomes striking, specifically with narrative identity theories proposed by philosophers like Daniel Dennett or Marya Schechtman. Dennett describes the self as a "center of narrative gravity," a fictional point around which stories coalesce. Schechtman argues that personhood is constituted by the capacity to integrate experiences into a unified life story. The Buddhist conventional self functions similarly. It is a construct imposed upon the causal continuum to make sense of experience, assign moral responsibility, and navigate the world.

  However, the Buddhist model diverges critically in its ethical stakes. For Dennett, the narrative self is a useful fiction for explaining behavior. For the Abhidharmika, the conventional self is a locus of suffering (*duhkha*) and karma. To deny the conventional self is as erroneous as to affirm the inherent self. This is the crucial pivot: *anatta* denies *svabhava* (inherent existence), not *astitva* (existence simpliciter). When a Buddhist says "there is no self," they mean "there is no self that exists independently of causes and conditions." They do not mean "there is no person who experiences pain."

  Critics might argue that a causally connected series of momentary dharmas is insufficient for genuine identity. If I am merely a sequence of flashes, why should I care about the flash happening tomorrow? This is the reductionist challenge. But this challenge presupposes that caring requires a permanent owner. Why? The capacity to care is itself a mental dharma arising in the present moment, conditioned by previous moments of habituation. The concern for the future is not generated by a permanent self; it is generated by the causal momentum of craving and ignorance. The continuity of concern is explained by the continuity of the stream, not by a substrate.

  Therefore, the Abhidharma ontology does not make personal identity unformulatable; it forces us to reformulate it. It shifts the definition from "sameness of substance" to "continuity of process." This is not a compromise; it is a refinement. Western substance metaphysics struggles to explain how a person can change completely over decades and yet remain the "same" person. If the self is a substance, change is accidental. If the self is a process (as Buddhism argues), change is essential. The Buddhist conventional self accommodates change without contradiction because it never claimed to be unchanging in the first place.

  Consequently, I take the stand that Buddhist *anatta* is not only compatible with personal identity but provides a more coherent framework for it than substance-based realism. The incompatibility exists only if one insists that personal identity requires inherent existence (*svabhava*). If we accept that personal identity is a conventional designation over a causal continuum, then the self is real enough to suffer, real enough to practice, and real enough to be liberated. To deny this conventional reality is to fall into the extreme of nihilism, which the Madhyamaka tradition critiques as vigorously as eternalism.

  The flash-frame ontology of the Abhidharma does not dissolve the person; it dissolves the *reification* of the person. It leaves us with a functioning, suffering, evolving narrative construct that operates seamlessly within the web of cause and effect. Personal identity is not a ghost in the machine; it is the motion of the machine itself. To ask if the machine is "really" the same machine over time is to ask the wrong question. The correct question is whether the causal continuity holds sufficient coherence to sustain moral responsibility and psychological integration. The Abhidharma answer is yes. The self is empty, but the emptiness is what allows the self to function at all.
