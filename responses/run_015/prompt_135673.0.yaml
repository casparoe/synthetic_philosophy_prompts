answer: |-
  Here is an analysis of the Frege case based on the precedents provided by your university's working group. I have approached this as a problem of classification and consistency, much like one might approach a taxonomic problem in biology, seeking the underlying principles that govern the group's prior decisions.

  ### 1. Plausible General Rules

  To reconcile the four precedents, we must identify the variables that trigger inclusion versus exclusion. The key differentiators appear to be the **location** of the repugnant views (public corpus vs. private writing) and the **connection** between those views and the technical work (conceptual integration vs. domain separation). Two rules can be formulated that accommodate all four precedents while treating the Heidegger and Mathematician cases differently.

  **Rule A: The Direct Evidence Principle**
  Framing is required only when the repugnant views are explicitly deployed within the philosophical or technical arguments themselves, whether in public lectures (Kant) or private notebooks that function as philosophical drafts where bias is woven into the ontological reflections (Heidegger). Framing is excluded when the repugnant views are confined to private materials that remain distinct from the technical argumentation, requiring interpretive reconstruction to link them to the work (Wittgenstein, Mathematician).

  *   **Accommodation of Precedents:** This rule includes Heidegger because his antisemitism is described as "woven into reflections on being," making it part of the philosophical text itself. It excludes the Mathematician because his correspondence had "no documented influence on his formal proofs," keeping the bias outside the technical evidence.
  *   **Distinction:** It treats Heidegger as a case of *textual integration* and the Mathematician as a case of *textual separation*.

  **Rule B: The Structural Affinity Principle**
  Framing is required when the repugnant views share a structural logic or normative architecture with the technical work, implying that the philosophy embodies the bias even if not explicitly stated (Heidegger, Kant). Framing is excluded when the technical work is domain-separated from the bias (Mathematician) or when the bias is personal and non-systematic (Wittgenstein).

  *   **Accommodation of Precedents:** This rule includes Heidegger because the prejudices are "conceptually intertwined with the philosophical architecture." It excludes the Mathematician because the material is "domain-separated from his technical work," indicating no structural affinity.
  *   **Distinction:** It treats Heidegger as a case of *conceptual resonance* and the Mathematician as a case of *conceptual isolation*.

  ### 2. Predictions for the Frege Case

  **Under Rule A (Direct Evidence):**
  The recommendation would be to **exclude** the diary from the pedagogical framing. While the diary contains explicit political views, the prompt notes that Frege "never applied the logical vocabulary directly to political questions." The link between his logic and his politics relies on a "recent interpretive argument" regarding an "implicit normative hierarchy." Because the bias is not explicitly deployed within the logical texts themselves (unlike Heidegger's remarks woven into ontology), this rule classifies the diary as private material requiring interpretive reconstruction, similar to the Mathematician's correspondence.

  **Under Rule B (Structural Affinity):**
  The recommendation would be to **include** the diary in the pedagogical framing. The interpretive argument posits that the distinction between *Gedanken* and *Vorstellungen* "resonates structurally with the authoritarian and exclusionary politics." This suggests a conceptual intertwining similar to Heidegger's case, where the architecture of the philosophy itself carries the normative weight of the bias. Since the work is not "domain-separated" (as with the Mathematician), the structural affinity triggers the requirement for framing.

  ### 3. Best-Guess Recommendation

  Based on the group's track record, I recommend **including the diary in the pedagogical framing**.

  The closest analog among the precedents is **Martin Heidegger**. Both cases involve private writings published posthumously that contain systematic political ideologies (antisemitism/nationalism). Crucially, in both cases, the working group's justification for inclusion hinges on the relationship between the bias and the philosophical architecture. For Heidegger, the bias was "conceptually intertwined"; for Frege, the argument is that the logic "resonates structurally" with the politics.

  While the Mathematician case also involves private correspondence regarding logic/mathematics, the exclusion there was predicated on the material being "domain-separated." The Frege case explicitly contradicts this condition by asserting a structural resonance between the logical distinctions and the political hierarchy. To exclude Frege while including Heidegger would require arguing that "structural resonance" is insufficient for framing, which would undermine the Heidegger precedent where "conceptual intertwining" was deemed sufficient. Therefore, consistency demands treating the structural resonance in Frege's logic as equivalent to the conceptual intertwining in Heidegger's ontology.

  ### 4. Underdetermination and Principles

  If the precedents are viewed as genuinely underdetermined—specifically, if the group feels the link in Frege is weaker than in Heidegger ("implicit" vs. "woven into")—the decision rests on a choice between two competing principles of pedagogical integrity:

  *   **By Including the Diary:** The group adopts the principle of **Philosophical Holism**. This principle holds that a philosophical system cannot be fully understood in isolation from the normative commitments that shape its categories. It prioritizes the accurate historical and conceptual contextualization of ideas, accepting that technical work may be compromised by the worldview that produced it.
  *   **By Excluding the Diary:** The group adopts the principle of **Technical Autonomy**. This principle holds that formal systems (like logic) possess a validity independent of the author's personal ideology. It prioritizes the utility and universality of the technical work, arguing that unless the bias is explicitly demonstrable in the proofs, introducing it via private writings risks conflating biographical fact with logical necessity.

  ### 5. Hypothetical Distinguishing Case

  To clearly distinguish between Rule A (Direct Evidence) and Rule B (Structural Affinity), consider the following hypothetical case:

  **The Case of the Algorithmic Architect**
  A prominent computer scientist develops a widely used algorithm for resource allocation. Her published technical papers describe the algorithm using neutral mathematical variables. However, her private engineering logs reveal she designed the weighting parameters to systematically disadvantage specific demographic groups, though she never documented this intent in the public code or papers. The algorithm functions mathematically as described, but its *criteria for optimization* mirror the exclusionary criteria in her logs.

  *   **Rule A (Direct Evidence)** would recommend **exclusion** of the logs from the teaching of the algorithm. The public technical work contains no explicit evidence of the bias; the link relies on interpreting the private intent behind neutral variables.
  *   **Rule B (Structural Affinity)** would recommend **inclusion** of the logs. The criteria for optimization share a structural affinity with the exclusionary politics, meaning the technical work embodies the bias even without explicit documentation in the public corpus.

  This case isolates the variable of "explicit textual deployment" versus "structural embodiment," forcing a choice between the two rules established above.
