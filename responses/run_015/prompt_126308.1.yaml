answer: |-
  State X launched a humanitarian intervention in Origin to halt a civil war, reasonably believing it would stabilize the region. Unexpected collateral damage destroyed housing, displacing 40,000 citizens to a border camp. X remains wealthy and stable, possessing ample housing infrastructure, making absorption lowest-cost. State Y controls the specific border sector through which return is logistically possible. Though the war has ended, Y maintains a 'security quarantine' policy on this sector, prohibiting civilian re-entry to monitor potential insurgent resurgence, a policy revisable at moderate cost without risking safety. X argues it stopped a genocide; Y argues it ensures peace. The refugees cannot go home because Y's border policy remains active, nor stay in Origin due to X's destruction. X fits Trigger and Capacity. Y fits Sustaining-Cause.

  **Demonstration**
  *   **Trigger Liability:** Points to **X**. X's intervention directly caused the housing destruction that forced flight. Even if well-motivated, the causal chain originates there.
  *   **Capacity:** Points to **X**. X is explicitly wealthy with spare infrastructure; absorbing the group is objectively cheaper for X than for Y or Origin.
  *   **Sustaining-Cause:** Points to **Y**. While X caused the exit, Y's active policy prevents the *entry* back home. The displacement persists only because Y chooses to maintain the quarantine.

  **The Honest Bits**
  The split relies entirely on **Y's policy independence**. If Y's quarantine were mandated by X (e.g., as part of the peace treaty), Principle 3 collapses into Principle 1; Y becomes merely X's instrument. A Trigger defender will argue Y's policy is downstream: the "insurgent resurgence" Y fears exists only because X's war destabilized the region. Therefore, Y's sustaining cause is merely a delayed effect of X's trigger.

  **Final Read**
  Sustaining-cause is **genuinely distinct**. Trigger liability looks backward at the *origin* of the crisis; sustaining-cause looks forward at the *resolution*. Even if X lit the fuse, Y holds the fire extinguisher and refuses to use it. In political theory, this distinguishes *compensatory justice* (repairing harm done) from *remedial duty* (removing current barriers to safety). If we ignore sustaining-cause, we allow states to lock refugees in displacement indefinitely by controlling return conditions, absolving themselves because they didn't start the war. That creates a moral hazard distinct from the hazard of starting wars.
