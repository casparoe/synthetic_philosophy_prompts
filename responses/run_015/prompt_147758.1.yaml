prompt: |-
  hey so i'm in debate club and next week we're doing a thing on effective altruism, and i got assigned the side against it. I don't really know philosophy but my cousin's boyfriend (hes doing a phd in something, i think economics adjacent) sent me this long blog post critisizing EA and i wrote down the main bits. A friend of mine who likes EA says most critiques of it are strawmen, so now i don't know what i can safely say out loud without getting laughed at. Can you go through what i wrote down and tell me whats fair?

  Here are the points i copied out (shortened):

  1. "EA says: work out which intervention does the most good per dollar and fund that one. In practice that means funding whatever you can put a number on — bednets, deworming, direct cash transfers — because those have a cost per life saved you can actually calculate. And it means ignoring everything that isn't countable: building a political movement, changing what a culture cares about, preventing a war that never happens. So 'effective' in effective altruism really just means 'measurable'."

  2. "The deeper version of this is what I'd call the denominator problem. To rank two causes against each other you need a unit — dollars per life saved, dollars per unit of suffering prevented. But only some problems come with a natural unit. Malaria comes in cases. A corrupt institution, or a norm that makes people not care about strangers, doesn't. So the famous cause rankings are mostly decided by which problems happen to be countable, and EA mistakes that for evidence about which problems are biggest. Worse, when a harm can't be estimated the cost-effectiveness tables just quietly treat it as zero, which means any intervention with big messy long-run downsides looks amazing on paper."

  3. "Earning to give: take a high-paying job in finance or tech, live cheaply, donate most of it. Critics say this makes you complicit in whatever that industry does. EAs reply that it doesn't matter, because of replaceability: if you don't take the job someone else will, and that person will donate less than you, so you still make things better. But that argument proves way too much. If replaceability works, you could take a job at a tobacco company or an oil company and it's still fine, as long as you give away more than the next person would. Nobody believes that. So the whole earning-to-give thing collapses."

  4. "EA treats the world like a shopping list of separate problems to buy solutions for, instead of asking who has power and how you change that. Basically it's the politics of rich people donating money, and it quietly assumes political or structural change is a waste of time because you can't measuer it."

  5. "And then that guy who ran a big crypto exchange and was always talking about EA turned out to be a fraud and lost everyone's money, which kind of shows the whole movement was never really about helping people."

  What i'm unsure about: my friend says point 3 is the standard objection to earning to give and that EAs have a genuine answer to it, and that the "proves too much" move is doing something sneaky — but i don't get what. I also can't tell whether the denominator problem in 2 is a real criticism anyone makes or whether he just made it up, and if it is real, whether it's secretly just the same point as 1 or actually something different. And is it fair to say EA assumes political change is pointless?

  So: for each of the five, tell me what someone who actually defends EA would accept, what they'd say is a misrepresentation or an overstatement, and whats just wrong. Then tell me whether the big conclusion — that EA's ranking of causes is basically an artifact of what's easy to count, so the numbers don't really tell you anything — actually follows from the parts that are true, or whether it needs the false parts. And if the denominator problem is a real separate objection, what would a defender say back to it, because i'd rather make a point i can defend than one that sounds good for ten seconds.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Debate club, assigned the *against* Effective Altruism (EA) side.
      *   **User's Background:** Not well-versed in philosophy. Received a blog post summary from a cousin's boyfriend (PhD student, economics-adjacent).
      *   **Problem:** A friend who likes EA says these critiques are often strawmen. User wants to know which points are "safe" (fair/defensible) vs. which are vulnerable to counter-attack.
      *   **Specific Questions:**
          *   Evaluate each of the 5 points (what EAs accept, what they dispute, what is wrong).
          *   Specifically address Point 3 (Earning to Give/Replaceability) and the "proves too much" argument.
          *   Specifically address Point 2 (Denominator Problem) vs. Point 1 (Measurability) – are they distinct? Is it a real critique?
          *   Address Point 4 (Politics/Structural Change).
          *   Address Point 5 (SBF/Fraud).
          *   Evaluate the big conclusion (EA rankings = artifact of countability).
          *   Provide counter-arguments for the "real" critiques so the user can defend them.

  2.  **Deconstruct the 5 Points:**

      *   **Point 1: Measurability Bias ("Effective" = "Measurable").**
          *   *EA View:* They acknowledge measurement is hard. They try to use proxies. They do fund some less measurable things (advocacy, AI safety research) but prefer tractability.
          *   *Critique Validity:* Strong core truth (quantification bias), but overstated (they don't *ignore* uncountable things, they just discount them heavily due to uncertainty).
          *   *Debate Strategy:* Focus on "Goodhart's Law" or "McNamara Fallacy."

      *   **Point 2: The Denominator Problem (Units of Comparison).**
          *   *EA View:* This is a known philosophical problem (inter-theoretic comparison of value). They use "QALYs" or "well-being units" as a common currency.
          *   *Critique Validity:* It's a real philosophical objection (commensurability of value). Distinct from Point 1 (which is about data availability, Point 2 is about value theory).
          *   *Debate Strategy:* It's a sophisticated point. If the user doesn't know philosophy, it might be risky, but it's defensible. The "treats as zero" claim is the weak spot EAs will attack.

      *   **Point 3: Earning to Give & Replaceability.**
          *   *EA View:* Replaceability is nuanced. It applies to *marginal* impact. They distinguish between harmful industries (tobacco) and neutral/high-impact industries (finance/tech) based on the *net* harm of the industry vs. the good of the donation.
          *   *Critique Validity:* The "tobacco company" analogy is the weak link. EAs generally argue finance/tech aren't inherently harmful in the way tobacco is. The "proves too much" argument is a reductio ad absurdum that EAs reject because they deny the premise (that finance = tobacco).
          *   *Debate Strategy:* This is risky. EAs have a prepared answer. Better to focus on the *opportunity cost* of talent rather than moral complicity, or focus on the specific SBF case.

      *   **Point 4: Politics & Structural Change.**
          *   *EA View:* They don't think it's pointless, just less *cost-effective* per dollar than direct aid *currently*. They are moving more into policy (AI governance, biosecurity).
          *   *Critique Validity:* Historically accurate (early EA was very apolitical), but evolving. The "rich people donating" critique is a sociological critique (ideology), not necessarily a logical flaw in the calculus.
          *   *Debate Strategy:* Fair to say early EA neglected this. Fair to say it favors status quo.

      *   **Point 5: SBF/Fraud.**
          *   *EA View:* SBF was a bad actor. EA is a framework, not a cult. Condemned him quickly.
          *   *Critique Validity:* Weak as a philosophical critique. Strong as a PR/reputation critique. "One bad apple" defense is standard.
          *   *Debate Strategy:* Don't rely on this for the *philosophical* debate. Use it to question the *culture* or *incentive structures* that allowed it.

  3.  **Address Specific User Uncertainties:**

      *   *Point 3 (Replaceability):* The friend is right. The "proves too much" argument fails because EAs distinguish between *neutral* jobs (finance) and *harmful* jobs (tobacco). The replaceability argument only works if the job itself isn't net negative.
      *   *Point 2 (Denominator) vs. Point 1:* They are distinct. Point 1 is epistemic (we can't measure the data). Point 2 is metaphysical/axiological (these values can't be compared on a single scale).
      *   *Big Conclusion:* Does it follow? Only if you accept the strong version of Point 1 & 2. If EAs can show they account for uncertainty, the conclusion weakens.

  4.  **Drafting the Response:**

      *   *Tone:* Supportive, analytical, debate-coach style. Avoid taking sides morally, focus on argumentative strength.
      *   *Structure:*
          *   Intro: Validate the friend's warning (some points are indeed strawmen), but validate the user's material (some are strong).
          *   Point-by-Point Breakdown:
              *   What's fair.
              *   What's the EA counter.
              *   Verdict (Safe/Risky).
          *   Deep Dive on Specific Questions (Point 3, Point 2 vs 1, Politics).
          *   The "Big Conclusion" Analysis.
          *   Strategic Advice for the Debate.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Point 3:* I need to make sure I explain *why* the tobacco analogy fails. It's about *net* harm. Finance has negative externalities but also provides liquidity/capital. Tobacco's primary function is harm. EAs argue the donation outweighs the marginal harm of the finance job.
      *   *Correction on Point 2:* Make sure to distinguish "uncertainty" (Point 1) from "incommensurability" (Point 2). Point 1 says "we don't know the number." Point 2 says "there is no number."
      *   *Correction on Point 5:* Advise the user not to lean too hard on SBF. It's an ad hominem against the movement if not careful. Frame it as "incentive structures."
      *   *Debate Tip:* Remind the user that in debate, "fairness" matters less than "impact." Even if a point is slightly overstated, if the opponent can't refute it quickly, it scores. But since the user wants to avoid being "laughed at," accuracy is key.

  6.  **Final Review against User Prompt:**
      *   Did I answer what EAs accept/dispute for all 5? Yes.
      *   Did I explain Point 3's "proves too much"? Yes.
      *   Did I explain Point 2 vs 1? Yes.
      *   Did I evaluate the Big Conclusion? Yes.
      *   Did I give advice on defending the "real" points? Yes.

  7.  **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output).

  *(Self-Correction Note during final output generation)*: I need to be careful not to sound like I'm advocating *for* EA, but rather analyzing the *argumentative strength* of the critiques. The user is on the *against* side. I need to help them win, but honestly.

  *Refining Point 3 Advice:* The user's friend is right that the "tobacco" analogy is the weak link. I should advise the user to pivot the argument away from "moral complicity" and towards "talent drain" or "legitimization of harmful systems." That's harder for EAs to dismiss.

  *Refining Point 2 Advice:* This is the most philosophical point. If the user isn't comfortable with philosophy, I should warn them that an experienced EA debater might spin them in circles here. Better to stick to Point 1 (Measurability Bias) as the practical version of this.

  *Refining Point 5:* Explicitly state: Do not make this your main argument. It's a distraction.

  *Okay, ready to write.*
answer: |-
  This is a great position to be in. Your friend is partially right: internet critiques of Effective Altruism (EA) often rely on caricatures. However, your cousin's boyfriend has actually summarized some of the *strongest* academic and philosophical critiques, not just the internet rant versions.

  Because you are in a debate, your goal isn't necessarily "philosophical truth," but rather "argumentative resilience." You want points that survive cross-examination.

  Here is a breakdown of each point, what an EA defender will say, and whether it is safe for you to use.

  ### Point 1: The Measurability Bias ("Effective" = "Measurable")
  *   **The Claim:** EA favors things you can count (bednets) over things you can't (political change), mistaking measurability for importance.
  *   **What EAs Accept:** They admit that quantification is difficult and that there is a bias toward interventions with good data. They call this the "tractability" constraint.
  *   **What EAs Dispute:** They will say they don't *ignore* unmeasurable things; they just apply a "uncertainty discount." They will also point out that they do fund advocacy (e.g., AI safety policy, animal welfare legislation), which is hard to measure.
  *   **The Trap:** If you say "EA ignores politics," they will list their policy grants.
  *   **Verdict:** **Safe, but needs nuance.**
      *   *How to defend it:* Don't say they ignore it. Say they **systematically undervalue** it. Use the term **"McNamara Fallacy"** (making a decision based only on quantitative observations and ignoring all others). Argue that by requiring a "cost per life saved" number, EA structurally excludes the most important, complex problems (like climate change or democracy erosion) where that number doesn't exist.

  ### Point 2: The Denominator Problem (Incommensurability)
  *   **The Claim:** You can't compare different types of good (e.g., preventing malaria vs. preventing a norm shift) on a single scale. EA pretends they can, treating unquantifiable harms as zero.
  *   **What EAs Accept:** This is a known philosophical problem called "inter-theoretic comparison of value." Serious EAs admit it's hard to compare "units of suffering" across different categories.
  *   **What EAs Dispute:** They will say we *must* try to compare them, otherwise we can't make any decisions at all. They will deny they treat unquantifiable harms as "zero"; they say they treat them as "highly uncertain."
  *   **Is it distinct from Point 1?** **Yes.** Point 1 is about **data** (we can't find the numbers). Point 2 is about **value theory** (the numbers don't mean the same thing). Point 1 says "We don't know the cost of changing a norm." Point 2 says "Even if we knew the cost, 'changed norm' isn't the same currency as 'life saved'."
  *   **Verdict:** **High Risk / High Reward.**
      *   *Warning:* This is a deep philosophy point. If your opponent knows their stuff, they might drag you into a weeds discussion about "utilitarian calculus."
      *   *How to defend it:* Stick to the practical implication. "If you can't compare apples to oranges, your spreadsheet is lying to you. EA presents a ranking of 'top causes' as if it's objective science, but it's actually based on arbitrary assumptions about how to value different types of existence."

  ### Point 3: Earning to Give & Replaceability
  *   **The Claim:** Earning to give justifies working in harmful industries (finance/oil) because you donate the money. The "replaceability" argument (someone else would do the job) is used to wash away complicity.
  *   **What EAs Accept:** They accept the "replaceability" argument *in theory* for marginal roles.
  *   **What EAs Dispute:** **This is where your friend is right.** The "tobacco company" analogy is the weak link. EAs argue that finance/tech are not inherently harmful like tobacco. They argue the *net* impact of a finance worker who donates 50% of their income is positive because the harm of finance is diffuse, but the good of the donation is concrete.
  *   **The "Proves Too Much" Sneakiness:** The blog post argues: "If replaceability justifies finance, it justifies tobacco." The EA reply is: "No, because tobacco's *primary product* is harm. Finance's primary product is liquidity/capital. Replaceability only works if the job isn't net-negative."
  *   **Verdict:** **Risky.**
      *   *Why:* EAs have a rehearsed answer for this. If you use the "tobacco" analogy, they will dismantle it easily.
      *   *Better Angle:* Instead of moral complicity, argue **Talent Drain.** "Earning to Give encourages smart, ethical people to go into finance instead of working directly on solutions. It incentivizes maintaining the status quo economy rather than fixing the systems that cause the problems."

  ### Point 4: Politics & Structural Change
  *   **The Claim:** EA treats the world as a shopping list, ignoring power dynamics. It is the politics of rich people.
  *   **What EAs Accept:** Early EA (2011-2015) was very apolitical. They admit this was a blind spot.
  *   **What EAs Dispute:** They will say they are moving into "structural" causes now (AI governance, biosecurity policy). They deny that they assume political change is a "waste of time," just that it is currently less *cost-effective* than direct aid.
  *   **Verdict:** **Very Safe.**
      *   *How to defend it:* Focus on the **Status Quo Bias.** "EA asks 'how do we fix the symptoms with the money we have?' instead of 'why do we have these symptoms?' It is a philosophy that fits perfectly with a world where billionaires have excess capital but systemic inequality remains untouched. It treats poverty as a math problem, not a political one."

  ### Point 5: SBF / Crypto Fraud
  *   **The Claim:** Sam Bankman-Fried (SBF) was an EA, he was a fraud, therefore EA is bad.
  *   **What EAs Accept:** SBF identified as an EA. It was a PR disaster.
  *   **What EAs Dispute:** "No True Scotsman." They argue EA is a *framework*, not a membership club. SBF violated core EA tenets (honesty, transparency). They condemned him immediately.
  *   **Verdict:** **Weak as a philosophical point.**
      *   *Warning:* If you make this your main argument, you look like you are attacking the person, not the idea.
      *   *How to defend it:* Don't say "EA is a fraud." Say "The EA culture created **perverse incentives**." "When you tell people the ends justify the means, and status is gained by promising huge future impact (like SBF did), you attract risk-takers and gamblers. The philosophy doesn't have enough guardrails against hubris."

  ---

  ### Addressing Your Specific Questions

  #### 1. Is Point 3 (Earning to Give) a trap?
  **Yes.** Your friend is correct. The "proves too much" argument (that replaceability justifies working for a tobacco company) relies on the premise that Finance and Tobacco are morally equivalent. EAs will simply deny that premise.
  *   **Pivot:** If you bring this up, pivot to **legitimization.** "Even if the math works out, 'Earning to Give' tells the public that harmful industries are acceptable as long as you donate. It provides moral cover for industries that should be regulated, not just donated against."

  #### 2. Is the "Denominator Problem" (Point 2) real or made up?
  **It is real.** It is a standard objection in moral philosophy regarding "commensurability of value." It is distinct from Point 1.
  *   **Point 1** says: "We can't measure the data." (Epistemic problem)
  *   **Point 2** says: "These things can't be measured on the same scale." (Metaphysical problem)
  *   **Debate Tip:** Point 1 is easier to debate. Point 2 is more profound but harder to explain in 3 minutes. If you are confident, use Point 2 to undermine their "cause rankings." If you want to be safe, stick to Point 1 (Measurability Bias).

  #### 3. Is it fair to say EA assumes political change is pointless?
  **It is an overstatement, but a useful one.** They don't say it's *pointless*, they say it's *less efficient*.
  *   **Debate Tip:** Don't say "They think politics is useless." Say "They treat political change as a **last resort** rather than a primary driver. By prioritizing interventions that fit within the current system (like bednets) over interventions that change the system (like labor rights), they implicitly favor the status quo."

  ---

  ### The Big Conclusion: "EA Rankings are an Artifact of Countability"

  **Does this follow?**
  It follows *if* you successfully argue Point 1 and Point 2.
  *   **The Logic:** If you can only rank things you can measure (Point 1), and you can't measure the most important structural problems (Point 2), then your ranking is just a list of "things we happened to be able to count," not "things that are most important."
  *   **The Weak Link:** EAs will argue they use "probability distributions" to account for uncertainty. They will say, "We know we can't measure AI risk perfectly, but we can estimate it better than guessing."
  *   **Your Counter:** "An estimate isn't a measurement. When you put a number on an estimate and compare it to a hard number (like bednets), you are pretending they are the same kind of data. That is false precision."

  ### Strategic Advice for Your Debate

  1.  **Drop Point 5 (SBF) as a main argument.** Use it only as a closing example of "culture problems." It's too easy for them to say "One bad apple."
  2.  **Combine Point 1 and Point 2.** Call it the **"Quantification Trap."** Argue that EA confuses *precision* (having a number) with *accuracy* (actually doing good).
  3.  **Reframe Point 3.** Don't argue about whether finance is immoral. Argue that **Earning to Give is a band-aid.** It relies on the excess wealth of an unjust system to fix the problems created by that system, rather than fixing the system.
  4.  **Lean Hard on Point 4 (Politics).** This is your strongest ground. It is sociologically robust. EA is often criticized for being "technocratic" (rule by experts/math) rather than "democratic." Ask: "Who decides what counts as 'good'? EA says mathematicians and philosophers. Democracy says the people."

  **Summary of what is "Safe" to say:**
  *   EA suffers from Measurability Bias (Point 1).
  *   EA favors status-quo friendly solutions over structural change (Point 4).
  *   EA's cause rankings rely on false precision (Point 2/Conclusion).

  **Summary of what is "Risky" to say:**
  *   EA justifies working for tobacco companies (Point 3).
  *   EA is a fraud because of SBF (Point 5).
  *   EA completely ignores politics (Point 4 nuance).

  Good luck. If you stick to the "Quantification Trap" and "Status Quo Bias," you have arguments that are philosophically sound and hard for them to dismiss without sounding out of touch.
