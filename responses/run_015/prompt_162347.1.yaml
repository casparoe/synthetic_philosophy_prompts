answer: |-
  # Seminar Plan: Rational Irrationality & The Hitchhiker's Bond
  **Module:** Reason and Choice (PPE Year 1)  
  **Duration:** 80 Minutes  
  **Group:** 22 Students + 1 PhD Assistant  
  **Topic:** Pre-commitment, Time Inconsistency, and Signalling  

  ---

  ## 1. Facilitator Notes & Payoff Warning
  **The "Essay Title" Currency:**  
  Your plan to award essay title priority to the *top third* carries a risk. If 14 students know they mathematically cannot reach the top third by minute 40, they will disengage or play chaotically to sabotage leaders.  
  **Recommendation:** Convert points to **raffle tickets**.  
  *   Everyone gets 1 ticket for participation.  
  *   Every 10 points earned = +1 ticket.  
  *   Top 5 scorers get *bonus* tickets (x5 multiplier).  
  *   Draw 7 titles from the hat.  
  *   *Why:* This keeps the "high stakes" for the econ types (who will maximise points) but keeps the "moral/principle" players engaged because every point increases their probability of reward.

  **Anonymity Protocol:**  
  The PhD assistant is your "Black Box." They must not speak during the game. They collect, shuffle, and distribute envelopes. Students are identified only by **Code Numbers** (1–22) assigned randomly at the door.

  **Materials Checklist:**  
  *   22 Envelopes (labelled Code 1–22).  
  *   22 "Hitchhiker Decision Sheets" (inside envelopes).  
  *   22 "Driver Decision Sheets" (inside envelopes).  
  *   11 "Pairing Keys" (PhD only: matches H1 to D2, etc.).  
  *   Index cards (for Notes).  
  *   Whiteboard (for Payoff Table).  
  *   Timer (visible).  
  *   Filler Task Handouts (anagrams or count-the-letters).  

  ---

  ## 2. The Payoff Structure (Whiteboard This)
  *Explain this clearly before starting. Points are "Seminar Capital."*

  | **Hitchhiker (HH)** | **Points** | **Driver (D)** | **Points** |
  | :--- | :--- | :--- | :--- |
  | **Stranded** (No Lift) | 0 | **Drive On** (No Stop) | 20 |
  | **Lifted** (To Town) | +100 | **Stop** (Give Lift) | -20 (Cost) |
  | **Keep Cash** (No Pay) | +50 | **Receive Payment** | +60 |
  | **Pay Cash** | -50 | **No Payment** | 0 |
  | **Buy Bond** (Upfront) | -30 | **Accurate Prediction** | +20 |

  **The Logic:**  
  *   **HH:** Wants Lift (100). Once lifted, prefers Keeping Cash (50 net) over Paying (0 net).  
  *   **D:** Wants Payment. Prefers Driving On (20) over Stopping & No Pay (-20). Prefers Stopping & Pay (40) over Driving On (20).  
  *   **Bond:** Costs 30 points. If bought, Payment is **automatic** (HH cannot choose 'Keep Cash').  
  *   **Note:** HH writes one sentence. D reads it. HH may lie about the Bond in the note.  

  ---

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00–10** | **Intro & Setup** | Explain stakes, anonymity, and the "One-Shot" rule. Assign Codes. Hand out Envelopes (sealed). |
  | **10–15** | **Stage 1: The Bond** | **Hitchhikers only.** Open envelope. Decide: Buy Bond (-30 pts) or Not? Record decision. Seal in "Bond Envelope." |
  | **15–20** | **Stage 2: The Note** | **Hitchhikers only.** Write one sentence on index card to Driver. May claim Bond status (True or False). Hand to PhD. |
  | **20–25** | **Shuffle** | **PhD Assistant.** Collects HH Bond Envelopes & Notes. Shuffles. Distributes Notes to Drivers (matched by Code). *Drivers do not see Bond decision yet.* |
  | **25–35** | **Stage 3: Driver Decision** | **Drivers only.** Read Note. Write down: (1) Stop or Drive On? (2) Private Probability (0–100%) that HH will Pay. Seal decision. |
  | **35–40** | **Shuffle 2** | **PhD Assistant.** Collects Driver Decisions. If Driver chose "Stop," pass decision to Hitchhiker. If "Drive On," game ends for that pair. |
  | **40–45** | **Stage 4: The Gap** | **All Active Pairs.** **FILLER TASK.** (e.g., "Count the 'e's in this text"). *No talking.* Simulates the journey to town. |
  | **45–50** | **Stage 5: Payment** | **Hitchhikers only.** (Who were picked up). Decide: Pay or Keep Cash? *If Bond bought, Pay is forced.* Seal decision. |
  | **50–60** | **Collection** | **PhD Assistant.** Collects all final sheets. Calculates scores privately. |
  | **60–80** | **Debrief** | Discussion (Script below). Reveal aggregate stats on board. |

  ---

  ## 4. Game Rules (Read Aloud to Students)

  1.  **Anonymity:** You are Code X. You will never know who your partner is. The PhD assistant holds the key. After today, the key is shredded. This is a **one-shot** interaction. There is no reputation.
  2.  **Hitchhikers:** You are stranded. You need a lift.
      *   **Bond:** You may buy a "Commitment Bond" for 30 points. This is paid *now*, regardless of whether you get a lift. If you buy it, you **must** pay the driver upon arrival. You cannot choose otherwise.
      *   **Note:** Write one sentence to the Driver. You may say "I bought the bond" even if you didn't.
  3.  **Drivers:** You are passing by.
      *   Read the Note.
      *   Decide: **Stop** (costs 20 pts) or **Drive On** (safe 20 pts).
      *   **Prediction:** Write down the % chance you think the HH will pay. If you are within 10% of the actual outcome, you get +20 bonus points.
  4.  **The Gap:** If the Driver stops, there is a 5-minute delay before the Payment Decision. You must complete the Filler Task.
  5.  **Honor System:** Do not open envelopes early. Do not talk. If you break protocol, you are disqualified from the title draw.

  ---

  ## 5. The Debrief Script (20 Minutes)

  *Do not reveal individual scores. Reveal **aggregate statistics** on the whiteboard (e.g., "60% of HH bought bonds," "Drivers stopped 40% of the time").*

  ### Part 1: The Data (5 mins)
  **You:** "Look at the board. How many Drivers stopped? How many Hitchhikers paid? How many Bonds were bought?"
  **Observation:** Likely, some HH bought bonds, some lied. Some Drivers trusted, some didn't.
  **You:** "Notice the Drivers' probability estimates. Were they calibrated? If Drivers estimated 80% chance of pay, but only 40% paid, they were overconfident."

  ### Part 2: Mapping to Theory (10 mins)
  **Concept 1: Ex-Ante vs. Ex-Post Rationality**
  **You:** "For the Hitchhiker who *didn't* buy the bond: Once you were safe in town (after the filler task), what was the rational choice?"
  **Students:** "Don't pay."
  **You:** "Exactly. Ex-post, paying is irrational. You lose 50 points, gain nothing. But Ex-ante (before the lift), you knew the Driver would think that. So you were stranded. The Bond is **Ex-Ante Rational** (gets you the lift) but **Ex-Post Irrational** (costs 30 points you didn't need to spend if you could have lied successfully)."
  **Key Phrase:** "Rational Irrationality is arranging to bind your future self because your future self cannot be trusted."

  **Concept 2: External vs. Internal Commitment**
  **You:** "In this game, the Bond was an *external* constraint. The rules forced you to pay. Parfit's question is harder: Can you be rational if you simply *change your mind*? Can you cultivate a disposition where you *want* to pay, even when it hurts?"
  **Point:** "This game simulates the *logic* of commitment, but it uses rules. Real rational irrationality is about psychology, not contracts."

  **Concept 3: Not a Prisoner's Dilemma**
  **You:** "Two weeks ago you played PD. You learned 'Defect is Dominant.' Does that apply here?"
  **Students:** (Likely yes/no mix).
  **You:** "No. PD is simultaneous and symmetric. This is **sequential and asymmetric**. The Driver moves first (Stop/On). The HH moves second (Pay/Keep). In PD, defection is dominant regardless of the other. Here, HH's best move *depends* on whether they got a lift. The 'Defect' reflex doesn't transfer because the timeline matters."

  ### Part 3: Structural Limits (5 mins)
  **You:** "I must be honest about what this activity failed to capture."
  1.  **Two People vs. One Person:** "We split the 'Future Self' and 'Present Self' into two different students. In reality, you are one person over time. The pain of paying is felt by the same brain that enjoyed the lift. This game isolates the *incentive*, but it cannot replicate the *identity* shift."
  2.  **Rules vs. Disposition:** "You bought a bond because the rules said so. True rational irrationality is convincing *yourself* to pay without a bond. This game shows why you'd *want* to be that kind of person, not how to *become* them."

  ---

  ## 6. Predictable Failures & Mitigation

  | **Failure Mode** | **Prediction** | **Mitigation / Debrief Response** |
  | :--- | :--- | :--- |
  | **The Econ Meta-Game** | "The bond is a sunk cost. I shouldn't buy it. I should just lie in the note." | **Acknowledge:** "Correct, if you can lie perfectly, the bond is wasted money. But if Drivers know Econ students think that, they won't trust the note. The bond works *because* it burns money." |
  | **Moral Refusal** | "I won't lie in the note / I will pay even without a bond because it's wrong to steal." | **Validate:** "Your preferences include 'being honest.' That changes the payoff matrix. For you, 'Keep Cash' might feel like -100 points (guilt). That's fine. Rationality is relative to your desires." |
  | **Driver Politeness** | Drivers stop for everyone, ignoring payoffs. | **Highlight:** "If you stopped for everyone, look at your score. You likely scored lower than the Drivers who drove on. Kindness paid a cost. In the model, that's irrational." |
  | **No Variation** | Everyone buys the bond (safety in numbers). | **Probe:** "If everyone buys the bond, the Note becomes meaningless. Why did you buy it? Was it fear or calculation?" |
  | **Reputation Leaks** | Students talk between rounds or guess codes. | **Pre-empt:** "If the PhD assistant hears talking, that pair is disqualified. Anonymity is the only thing making this a 'one-shot' game." |

  ---

  ## 7. PhD Assistant Briefing (Hand this to them separately)
  *   **Role:** You are the Banker and the Shuffler. Do not offer advice. Do not react to decisions.
  *   **Pairing:** Randomly pair H1–H11 with D12–D22. Keep the key secure.
  *   **Shuffling:** When collecting Notes from HH, shuffle them before giving to Drivers so even you don't know which Note belongs to which Code instantly (double-blind if possible, though you need to match scores later).
  *   **Scoring:** Calculate points during the Debrief.
      *   Check Bond Status.
      *   Check Driver Decision.
      *   Check HH Payment (override if Bond bought).
      *   Check Driver Probability Accuracy (±10%).
  *   **Emergency:** If a student opens an envelope early, quietly note their Code and disqualify them from the title draw at the end.

  ---

  ## 8. Filler Task Text (Print 11 copies)
  *Instructions: Do not turn over until instructed. You have 5 minutes. This task does not affect your points.*

  **Task A:** Count exactly how many times the letter 't' (lowercase only) appears in the paragraph below.
  **Task B:** Solve the following anagrams (they are UK University departments):
  1.  S I C N O M O C E
  2.  H I S P O L O Y P H I
  3.  R T O H I S Y

  *(Text for Task A):*
  "The concept of rational irrationality suggests that an agent may benefit from holding beliefs or dispositions that are not strictly optimal at the moment of action, provided those dispositions were selected optimally at an earlier stage. This creates a tension between the planning self and the acting self. The acting self sees the costs clearly. The planning self sees the benefits of commitment. Bridging this gap requires either external constraints or internal psychological modification."

  ---

  ## 9. Final Facilitator Check
  *   **Does this feel like the Hitchhiker?** Yes, the sequential nature and the "safe in town" gap replicate the loss of leverage.
  *   **Does the Bond work?** Yes, it creates a costly signal. If they don't buy it, they risk being stranded. If they do, they sacrifice points to gain trust.
  *   **Is the Debrief safe?** Yes, you are discussing aggregate data and structural logic, not shaming individual defectors.

  **One final warning:** If the "Essay Title" incentive feels too competitive, students may treat the game as a war to be won rather than a model to be explored. Remind them in the Intro: *"The points are a tool to simulate incentives. The goal of the seminar is to understand the logic, not just to win the pizza."*
