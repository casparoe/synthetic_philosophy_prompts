answer: |-
  ### Specification for a Theory of Guilt and Shame in Institutional Policy

  To serve as a basis for governance, parenting, or management, a theory of these emotions must function as an engineering specification, not a moral treatise. It must predict outcomes, identify risks, and distinguish mechanisms. The following seven desiderata constitute the requirements for adequacy.

  **1. The Tripartite Utility Condition**
  *   **Requirement:** The theory must distinguish between (a) moral aptness (is this the fitting response?), (b) behavioural utility (does this produce compliance or repair?), and (c) psychological cost (is this liveable for the agent?).
  *   **Case:** Your draft policy conflates these. An emotion can be fitting (you did wrong) but psychologically destructive (you are worthless). An institution needs to know if it is optimising for order, moral development, or wellbeing. These goals often diverge.
  *   **Status:** **Non-negotiable.** A theory that collapses these three into a single metric of 'goodness' cannot inform a trade-off.

  **2. The Operational Discrimination Condition**
  *   **Requirement:** The theory must allow a governor to look at a specific intervention (e.g., a public apology) and classify which emotion it is *designed* to cultivate.
  *   **Case:** Policy is written *ex ante*. If the working group cannot specify whether a restorative conference targets guilt or shame, they cannot audit its success or failure. The theory must provide markers in the architecture of the sanction itself.
  *   **Status:** **Non-negotiable.** Without this, the policy is unintelligible to those implementing it.

  **3. The Subjective Variance Condition**
  *   **Requirement:** The theory must accommodate the fact that the same intervention may land as guilt in one pupil and shame in another.
  *   **Case:** As you noted, emotional uptake depends on the recipient's history and temperament. A private conversation may shame a sensitive child; a public rebuke may only annoy a resilient one. A theory that defines the emotion solely by the stimulus ignores the psychology of the subject.
  *   **Status:** **Non-negotiable.** To ignore this is to treat children as uniform machinery.

  **4. The Normative Independence Condition**
  *   **Requirement:** The theory must permit the claim that an emotion is *real* even if the norm triggering it is *wrong*.
  *   **Case:** The teenager ashamed of a identity the school rejects. If the theory defines shame as 'fear of justifiable exclusion', it cannot account for the pain of unjust exclusion. You need to validate the suffering without validating the school's norm.
  *   **Status:** **Non-negotiable.** Otherwise, the theory becomes a tool for enforcing conformity rather than analysing impact.

  **5. The Phenomenological Privacy Condition**
  *   **Requirement:** The theory must account for shame felt without an audience (in solitude, before one's own past self, or for kin).
  *   **Case:** If shame requires a witness, you cannot explain why your employee feels it alone at their desk, or why you feel it for your country. The 'witness' may be internalised, but the emotion must be classifiable as shame regardless of physical audience.
  *   **Status:** **Preference.** (Strictly social theories fail here, but some governance models prefer shame to remain purely social to limit its scope).

  **6. The Object Flexibility Condition**
  *   **Requirement:** The theory must locate 'audit-guilt' (distress over missed targets without moral violation) within its taxonomy.
  *   **Case:** Your dashboard anxiety is act-focused like guilt, but lacks a moral victim. If the theory insists guilt requires a moral norm violation, it cannot explain modern bureaucratic distress. It must decide if this is a new emotion, a subspecies of guilt, or evidence that the act/self distinction is flawed.
  *   **Status:** **Preference.** (Traditional moral philosophy ignores this, but modern institutions run on it).

  **7. The Causal Levers Condition**
  *   **Requirement:** The theory must identify which policy levers (sanctions, architecture, language) reliably produce which emotion, and with what lag.
  *   **Case:** You cannot legislate emotion. You legislate detentions, assemblies, or report cards. The theory must bridge the gap between the bureaucratic act and the internal state, acknowledging collateral damage (e.g., shame spilling over to parents).
  *   **Status:** **Non-negotiable.** A theory that describes emotions but not their production is useless for a board.

  ***

  ### The Impossible Pair

  The two demands that cannot be jointly satisfied are **The Operational Discrimination Condition (2)** and **The Subjective Variance Condition (3)**.

  You asked specifically whether the extensional problem's two demands can be met: that a theory must discriminate at the level of practices, *and* allow that one practice may land differently. The answer is no, not fully.

  If a theory honours **Subjective Variance**, it admits that the emotion is determined by the recipient's interpretation, not the sender's intent. This undermines **Operational Discrimination**, because the governor can no longer look at a practice and say "this cultivates guilt." They can only say "this is *intended* to cultivate guilt, but may cultivate shame."

  For a policy to be actionable, it must pretend Condition 2 is true (we can target emotions). For the policy to be ethical and accurate, it must admit Condition 3 is true (we cannot fully control uptake). A theory that satisfies 2 perfectly treats the child as an object; a theory that satisfies 3 perfectly treats the policy as a suggestion. You must choose which error to prioritise. In a governing context, you are forced to act *as if* 2 is true, while mitigating the risks of 3.

  ***

  ### The Exclusionary Requirement

  The single requirement that excludes the largest number of standard lines is **The Normative Independence Condition (4)**.

  Most traditional accounts tie the validity of the emotion to the validity of the norm.
  *   **The Anthropological Contrast (Guilt vs. Shame Cultures):** This collapses entirely. It assumes shame is merely social control in collectivist societies. It cannot account for the 'misfelt' shame of the dissident teenager, treating it as a malfunction rather than a real emotional state.
  *   **The Status-and-Belonging Account:** This defines shame as a drop in social status. If the status hierarchy is unjust, this account struggles to call the resulting emotion 'shame' without implying the status drop was legitimate.
  *   **The Ideal Spectator Account:** This suggests we feel shame when we fail the gaze of a reasonable observer. If the observer (the school) is unreasonable, this theory struggles to validate the emotion without validating the observer.

  Only a phenomenological account (focusing on how it *feels* rather than what *caused* it) survives Condition 4. Most functionalist or sociological theories do not.

  ***

  ### Scorecard of Standard Lines

  **The Act-Versus-Self Account**
  *(Guilt = I did bad; Shame = I am bad)*
  *   **Performance:** Fails on **Object Flexibility (6)**. Your 'audit-guilt' is about an act (missed target) but feels distinct from moral guilt. This binary cannot place it. It also struggles with **Subjective Variance (3)**; a child may interpret "you did a bad thing" as "you are a bad child" regardless of the teacher's phrasing.
  *   **Verdict:** Useful for rhetoric, too brittle for policy design.

  **The Audience-and-Ideal-Spectator Account**
  *(Shame requires being seen; Guilt is private)*
  *   **Performance:** Fails on **Phenomenological Privacy (5)**. It cannot explain shame in solitude or for one's grandfather without convoluted mental gymnastics about 'imagined' audiences. It also conflicts with **Normative Independence (4)** if the 'spectator' represents the institution's norms which are contested.
  *   **Verdict:** Psychologically inaccurate for modern, internalised contexts.

  **The Status-and-Belonging Account**
  *(Shame = threat to group membership; Guilt = threat to relationship)*
  *   **Performance:** Strong on **Causal Levers (7)**, as exclusion is a policy tool. However, it fails **Normative Independence (4)**. If a child is excluded for a norm they reject, this theory views the shame as functional social regulation, making it hard to critique the policy as harmful. It risks validating toxic conformity.
  *   **Verdict:** High utility for control, high risk of abuse.

  **The Anthropological Contrast (Benedict et al.)**
  *(Shame Cultures = External Sanction; Guilt Cultures = Internal Sanction)*
  *   **Performance:** Fails almost every condition. It treats emotions as cultural monoliths rather than individual experiences, violating **Subjective Variance (3)**. It cannot handle **Audit-Guilt (6)**. It is historically interesting but operationally useless for a single school with a diverse intake.
  *   **Verdict:** Discard.

  **Recommendation for the Vote**
  Do not vote for a policy that claims to cultivate guilt *rather than* shame. Given the impossibility of satisfying Conditions 2 and 3 simultaneously, such a claim is empirically false. Vote for a policy that specifies the *practices* (Condition 2) while explicitly acknowledging the risk of unintended shame (Condition 3) and providing mitigation for it. The aim should not be to engineer a specific emotion, but to minimise the collateral damage of the necessary ones.
