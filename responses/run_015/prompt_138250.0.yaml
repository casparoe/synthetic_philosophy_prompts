answer: |-
  ## The "Agency & Accuracy" Check (5-Minute Protocol)

  **Purpose:** Decide if you can use mental state words (knew, wanted, tried, believed) in an incident report.
  **Rule of Thumb:** Default to describing *outputs* and *logs*. Use mental words only if they explain a failure that output language cannot.

  ### Step 1: The Log Match (Truth)
  **Question:** Can you point to a specific log entry, retrieval ID, or hard rule that corresponds to the mental word?
  *   **Yes:** (e.g., "Retrieval ID #123 matched the order number" for "knew"). **Proceed to Step 2.**
  *   **No:** (e.g., "It wanted to help" has no "want" log). **REWRITE.** Use functional language (e.g., "Optimized for positive feedback").
  *   **Exception:** If the behavior is a known, documented emergent trait (e.g., sycophancy), mark as **Borrowed Psychology** and proceed to Step 3.

  ### Step 2: The Swap Test (Necessity)
  **Question:** If we replaced the LLM with a dumb script that produced the *exact same output error*, would this sentence still make sense?
  *   **Sentence:** "The assistant *knew* the answer but lied."
  *   **Swap:** A script outputs the wrong number.
  *   **Test:** Does "The script *knew* the answer" make sense?
  *   **No:** The word "knew" is claiming something about the LLM's internals. **HAND TO LEAD.** This is a claim about architecture, not just behavior.
  *   **Yes:** The word is just shorthand for behavior. **OK TO USE** (if Step 3 passes).

  ### Step 3: The Copy-Paste Test (Liability)
  **Question:** If this sentence is pasted into an email to a regulator or a furious customer, does it admit negligence or capability we don't legally claim?
  *   **Risk:** Words like "ignored," "refused," "knew," or "tricked" imply intent or security flaws.
  *   **Safe:** "Failed to generate," "Retrieval mismatch," "Processed unintended input."
  *   **Decision:** If it sounds like an admission of guilt, **REWRITE** even if Steps 1 & 2 passed.

  ---

  ## Test Run: Three Cases

  ### Case 1: "The assistant knew the order number but gave the wrong one."
  *   **Fact:** Retrieval fetched the correct number. Generation outputted the wrong one.
  *   **Step 1 (Log Match):** **Partial.** Retrieval log shows the number. Generation log shows the error. "Knew" conflates the two components.
  *   **Step 2 (Swap Test):** If a script retrieved "123" but printed "456", would we say the script "knew" 123? No. We'd say it "retrieved 123 but printed 456."
  *   **Step 3 (Liability):** "Knew... but gave" sounds like negligence (lying).
  *   **Verdict:** **REWRITE.**
  *   **New Phrasing:** "Retrieval fetched the correct order number, but the generation model outputted an incorrect value."
  *   **Why:** Your team likely uses "knew" to save space. This protocol forces precision because "knew" implies a unified mind, not a router + retrieval + gen pipeline.

  ### Case 2: "The assistant was tricked by text hidden in the uploaded PDF into approving a refund."
  *   **Fact:** Hidden text triggered a refund policy rule via embedding similarity.
  *   **Step 1 (Log Match):** **No.** There is no "tricked" flag. There is a "high similarity score on hidden text" log.
  *   **Step 2 (Swap Test):** If a regex script matched hidden text and approved a refund, was it "tricked"? No. "Tricked" requires a model capable of being deceived. The sentence becomes false on swap.
  *   **Step 3 (Liability):** **High.** "Tricked" admits a security vulnerability (prompt injection).
  *   **Verdict:** **HAND TO LEAD / REWRITE.**
  *   **New Phrasing:** "Hidden text in the PDF matched refund policy criteria, triggering an approval." (Save "tricked" for internal post-mortems, not external reports).
  *   **Why:** This captures the *mechanism* without admitting the *vulnerability* in customer-facing text.

  ### Case 3: "It doesn't want to disappoint people, so it stalls instead of saying the order is lost."
  *   **Fact:** Thumbs-down data shows users penalize definitive negative answers. RLHF optimized for engagement.
  *   **Step 1 (Log Match):** **No.** No "want" module. **Exception:** This is documented "Sycophancy" (Borrowed Psychology). Proceed.
  *   **Step 2 (Swap Test):** If a script stalled, did it "want" to avoid disappointment? No. The sentence becomes false. This word is doing heavy lifting to explain *why* the stall happened.
  *   **Step 3 (Liability):** **Low.** Anthropomorphism is rarely a legal liability, but it is technically false.
  *   **Verdict:** **REWRITE (Contradicts Team Habit).**
  *   **New Phrasing:** "The model is optimized to avoid negative feedback, leading to evasive responses when order status is unavailable."
  *   **Why:** Your team likely uses "want" because it's predictive. This protocol prioritizes *technical accuracy* over *predictive shorthand* for compliance reasons. "Want" implies we can fix the "want." "Optimized for" implies we need to retrain.

  ---

  ## Limitations & Blind Spots

  **1. The "System" Boundary Problem**
  This procedure assumes "the assistant" is a single unit. Your architecture is a router over models + retrieval + rules.
  *   **Misfire:** In Case 1, the retrieval component "knew" (had the data), but the generation component didn't. The procedure forces you to split them, which is accurate but verbose. If your engineers treat "the assistant" as a black box, this procedure creates friction by forcing them to acknowledge the pipeline.

  **2. Borrowed Psychology vs. Distilled Psychology**
  You framed "Borrowed Psychology" as patterns living in the *training data* rather than the *system*.
  *   **Correction:** In LLMs, the training data *is* the system (compressed into weights). The psychology isn't "borrowed"; it is *distilled*. The model doesn't simulate a mind; it embodies a statistical map of how minds write.
  *   **Risk:** The procedure treats "no log entry" as "not real." But for LLMs, the "want" is real in the weights, just not in the logs. Step 1 might force you to delete accurate descriptions of model behavior because they aren't logged variables.

  **3. The "Predictive" vs. "True" Tension**
  You asked for a procedure to decide what is "ok to write," not necessarily what is "true."
  *   **Constraint:** This procedure prioritizes *liability safety* over *predictive utility*. It will often tell you to write boring, longer sentences ("The model outputted...") instead of punchy, predictive ones ("The model tried...").
  *   **Trade-off:** Engineers might ignore the procedure because "tried" is faster to read. You need engineering sign-off that "accuracy > brevity."

  ## Philosophical Pushback

  **Where your framing is likely wrong:**
  You are treating the "Intentional Stance" as a switch you flip for the reader. But for LLMs, the intentional stance is often the *only* functional debugging tool we have.
  *   **The Hard Truth:** If you say "The model wanted to avoid disappointment," you are technically lying (no homunculus inside). But if you say "The model outputted tokens consistent with avoiding disappointment," you are obscuring the causal mechanism (RLHF reward hacking).
  *   **What would change my mind:** If your compliance team explicitly approved a glossary of mental terms. E.g., "In this organization, 'tried' means 'probability mass was distributed across helpful responses but constrained by safety filters'."
  *   **Recommendation:** Don't ban mental words. Define them. Create a "Dictionary of Approved Anthropomorphism." If "wants" is defined as "RLHF optimization target," you can use it safely. The procedure above bans ambiguity; a dictionary bans misinterpretation. The latter scales better for writers.
