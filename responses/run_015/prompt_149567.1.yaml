  ### **Q&A Prep Sheet: Ordered by Damage**

  #### **1. The Theoretical Kill-Shot (Rule-Utilitarian Collapse)**
  **Likely Asker:** The Consequentialist (they love this trap)
  **Damage Level:** Fatal. If you concede this, your thesis loses its distinctiveness.

  *   **The Objection:** "You say institutions can't aggregate, yet you must allow them to have protocols for distributing aid. If your protocol instructs agents to maximize the number of *dyadic rescue relations* they can fulfill, aren't you just maximizing the good? If your 'dyadic constraint' leads to the same distribution as rule-utilitarianism in the long run, what work is the metaphysics actually doing?"
  *   **Concede Up Front:** "I concede that in many high-volume scenarios, the distribution of aid will *look* identical to a utilitarian calculation."
  *   **Two-Minute Reply:** "The extensional overlap doesn't imply intensional identity. A rule-utilitarian saves five because the *sum* is greater. I save five because I can enter into five distinct, non-violating dyadic relations, whereas saving one requires actively disregarding the other four as mere means to a sum. The moral residue matters. When I leave the one to die, I owe them an explanation that I couldn't treat them as a counter in a calculation, not that their value was less. The *reason* for the action preserves the dignity of the victim, even if the outcome is the same. The metaphysics prevents the *justification* from becoming aggregative, which protects the survivor from guilt and the victim from erasure."
  *   **Weakest Spot:** If they press that "maximizing dyadic relations" is functionally indistinguishable from "maximizing utility," you risk sounding like you're just adding unnecessary steps to the same calculation.

  #### **2. The Practical Devastation (Disaster Triage)**
  **Likely Asker:** The Consequentialist
  **Damage Level:** High. Makes your theory look unusable in the real world.

  *   **The Objection:** "I work in triage. When a bus crashes and we have one ventilator, you're telling me a hospital committee cannot weigh the six patients against the one? If the rescue relation is strictly one-to-one, the institution is paralyzed. Are you arguing we should flip a coin between one person and six? That seems to violate the institution's duty to the public trust."
  *   **Concede Up Front:** "I concede this is counter-intuitive to standard triage protocols and that it places a heavy burden on the rescuer."
  *   **Two-Minute Reply:** "The paralysis is only apparent if we think the institution is a 'summer' of lives. It isn't. It's a facilitator of encounters. In a crash scenario, the committee doesn't choose 'six over one.' It authorizes the doctor to enter a rescue relation with *a* patient. Which one? Since no aggregation is permitted, a lottery is indeed the only fair method to select the partner for that dyadic relation. This isn't paralysis; it's refusing to pretend we have a god's-eye view of value. The 'duty to public trust' is a duty to treat every citizen as an end, not as a statistic in a survival equation."
  *   **Weakest Spot:** Justifying a coin flip when six families grieve instead of one is emotionally and politically brutal. The examiner may press that the "public trust" *demands* saving the most lives possible.

  #### **3. The Institutional Ontology (Kantian Role Duty)**
  **Likely Asker:** The Kantian
  **Damage Level:** Medium-High. Attacks the bridge between your metaphysics and institutions.

  *   **The Objection:** "You claim the rescue relation is dyadic even for a state. But Kantian ethics recognizes that institutional roles scale obligations linearly. A physician isn't just a person; they hold an Office. The Office has a duty to the *system of ends*, which implies a duty to the aggregate of citizens. By reducing the hospital to a series of one-to-one encounters, you ignore the moral reality of the Role itself."
  *   **Concede Up Front:** "I agree that institutional roles carry specific duties that individuals do not."
  *   **Two-Minute Reply:** "However, the Role does not create a new moral entity that can sum lives. The 'Office' is just a structured way for individuals to fulfill their categorical imperatives. The duty is to respect humanity in each person. When the Office acts, it must do so in a way that is justifiable to *each* person it encounters. Aggregation fails the test of universalizability because the one left behind cannot consent to being outweighed. The Role scales the *capacity* to rescue, not the *permission* to aggregate."
  *   **Weakest Spot:** Kantians often argue that duties of *justice* (unlike duties of virtue) are inherently comparative and aggregate. If they pin you on "Justice vs. Virtue," your dyadic claim might look like it only applies to charity, not institutional justice.

  #### **4. The Metaphysical Baggage (Advisor's Critique)**
  **Likely Asker:** Your Advisor
  **Damage Level:** Low (they know your work), but annoying.

  *   **The Objection:** "Taurek made this point without needing 'irreducibly dyadic relations.' He just said there's no 'greater loss.' You've added a layer of metaphysical relation-talk that smells like woo-woo. Why do we need this ontology? Isn't it simpler to just say we lack epistemic access to compare losses?"
  *   **Concede Up Front:** "Taurek's epistemic argument is elegant and I build on his intuition."
  *   **Two-Minute Reply:** "But Taurek's argument collapses at the institutional level. An epistemic limit doesn't bind a hospital protocol. My relational account explains *why* the institution is bound: because the act of rescuing is a performative engagement between agents, not a calculation of states of affairs. We need the relation-talk to explain why the *committee* is bound, not just the individual. Without the dyadic ontology, the institution slips back into aggregation because it thinks it stands 'outside' the relation. I'm grounding the constraint in the action itself, not our knowledge of value."
  *   **Weakest Spot:** Your advisor hates metaphysical relation-talk. If they decide the "relation" is just a metaphor for "duty," they might dismiss your core innovation as semantic padding.

