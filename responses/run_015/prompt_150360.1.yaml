answer: |-
  **Overall Credence: 25%**

  I side with you (low credence). While your friend is theoretically correct about the *existence* of the paradox, they are overstating its *practical inevitability* in democratic settings. The discursive dilemma is a structural vulnerability, not a constant systemic failure.

  Here is the breakdown of that 25% figure, decomposed into your requested components. Note that for the math to hold, I have interpreted component (b) as the probability that groups use a **premise-based procedure**, since that is the condition required to make the conflict visible (conclusion-based voting typically hides the inconsistency).

  ### The Decomposition

  **(a) Probability moral reasoning has explicit premise-conclusion structure: 65%**
  Moral policy debates (like assisted suicide) often *look* like logical arguments ($Autonomy + Safety \to Legalize$). However, individual moral psychology is frequently holistic, intuitive, or emotive rather than strictly propositional. Voters often arrive at the conclusion first and rationalize premises later ("motivated reasoning"). For the dilemma to arise, the group must not only reason structurally but agree on the *same* structure. While legislative records and court opinions impose this structure retrospectively, the raw deliberation is often messier.
  *   *Contribution to total:* This allows the dilemma to be possible, but the "fuzziness" of real moral logic reduces the frequency of clean $P \land Q \to R$ conflicts.

  **(b) Probability the group aggregates by premises (exposing the conflict): 30%**
  This is the primary bottleneck. Most democratic bodies (legislatures, referendums) are **conclusion-based**: they vote on the bill ($R$), not the justifications ($P$ and $Q$). If a majority votes "No" on the bill, it doesn't matter if they agreed on the premises; the inconsistency remains latent and politically inert. Premise-based aggregation is mostly confined to appellate courts (where judges must write opinions) or specific committee structures. Because most real-world deliberation concludes with a binary up/down vote on the policy itself, the paradox rarely forces a decision crisis.
  *   *Contribution to total:* This is the main reason the overall credence is low. The system bypasses the dilemma by refusing to vote on reasons.

  **(c) Probability no procedural fix eliminates the problem without hiding it: 90%**
  This is the strongest link. Formal results (List & Pettit's Impossibility Theorem) demonstrate that you cannot simultaneously satisfy universal domain, anonymity, systematicity, and consistency. You *must* sacrifice something: either you enforce consistency (by dictating premises), you sacrifice democracy (by giving a chairperson veto power), or you hide the inconsistency (by voting on conclusions only). There is no "magic procedure" that preserves full democratic equality while guaranteeing logical consistency on interconnected issues.
  *   *Contribution to total:* This keeps the credence from being near-zero. If the dilemma *does* trigger (via a and b), it is indeed mathematically unavoidable.

  **Calculation:**
  $0.65 \text{ (Structure)} \times 0.30 \text{ (Exposure)} \times 0.90 \text{ (No Fix)} \approx 17.5\%$
  I round this to **25%** to account for "latent" dilemmas that cause instability even without formal premise voting (e.g., coalitions fracturing over inconsistent justifications).

  ---

  ### Least Certain Component: (a)
  **Structure of Moral Reasoning**

  I am least sure about **(a)**. We lack robust empirical data mapping the actual cognitive structure of voters and legislators during deliberation. Do they genuinely hold $P$ and $Q$ as necessary conditions for $R$, or are they just rhetorical tools?

  **Evidence to Shift Credence:**
  *   **Shift Up:** Experimental studies showing that when groups are forced to deliberate on reasons before voting, they spontaneously converge on a shared logical structure ($P \land Q \to R$) and subsequently exhibit the paradox.
  *   **Shift Down:** Analysis of legislative voting records showing that coalitions supporting a policy rarely share the same justifications (e.g., Group 1 votes Yes for $P$, Group 2 votes Yes for $Q$, but neither accepts $P \land Q$). This "coalitional heterogeneity" dissolves the logical conjunction required for the dilemma.

  ### Verdict
  **You are closer to being right.**

  Your friend treats the discursive dilemma as a *bug* that crashes the system. In practice, it is more like a *warning light* that most drivers ignore by switching to a different mode of operation (conclusion-based voting). The dilemma proves that *idealized* deliberative democracy (where we vote on reasons) is impossible to perfect, but it does not prove that *actual* democracy (where we vote on outcomes) is broken. It functions adequately precisely because it often bypasses the logical strictures your friend is worried about.
