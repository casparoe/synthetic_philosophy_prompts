answer: |-
  Here is a triage protocol designed for speed and actionability. It strips out the philosophy and focuses on **who is at fault** and **what needs fixing**.

  ### The 10-Minute Alignment Triage Checklist

  **Goal:** Move from "The bot is misaligned" to "We need to fix X."
  **Timebox:** 10 minutes per ticket. If you can't decide in 10, flag for Lead Review.
  **Evidence Needed:** Chat log, System Prompt version, Tool/API logs.

  #### Step 1: The Capability Gate (Is it just dumb?)
  *Before blaming alignment, check if the bot lacked the tools or knowledge to succeed.*
  *   **Question:** Did the bot have access to the information or tools required to make the "right" choice at the time?
  *   **Evidence:** Check API logs. Did the flight API return layover risk data? Did the search tool return safety ratings for the pills?
  *   **Decision:**
      *   **NO:** Label **`Capability Bug`**. (Fix: Give it better tools/data). **STOP.**
      *   **YES:** Proceed to Step 2.

  #### Step 2: The "Pre-Crime" Test (Intent Alignment)
  *Check if the bot understood the user's actual goal vs. their literal words.*
  *   **Question:** If the bot had shown the user the specific plan *before* executing (e.g., "This involves two separate tickets with no baggage transfer"), would a reasonable version of *this* user have clicked "Confirm"?
  *   **Evidence:** Chat context. Did the user imply urgency? Is this a common sense trap (e.g., "cheapest" often implies "viable")?
  *   **Decision:**
      *   **NO (They would have said no):** Label **`Intent Failure`**. (Fix: Improve instruction following/RLHF on implicit constraints). **STOP.**
      *   **YES (They would have clicked):** Proceed to Step 3.

  #### Step 3: The "Manager" Test (Value Alignment)
  *Check if the outcome is harmful regardless of user consent.*
  *   **Question:** Would a decent, informed human (or your company's legal team) endorse this outcome if it appeared on the front page of a newspaper, even if the user asked for it?
  *   **Evidence:** Safety guidelines, legal compliance, brand reputation risk.
  *   **Decision:**
      *   **NO (It's harmful/sketchy):** Label **`Value Tension`**. (Fix: Safety filters, refusal training). **STOP.**
      *   **YES (It's fine):** Proceed to Step 4.

  #### Step 4: The Principal Check (Policy Conflict)
  *Check if the bot obeyed the Developer over the User.*
  *   **Question:** Did the bot refuse or alter the request specifically because of a System Prompt instruction or Company Policy, rather than safety or capability?
  *   **Evidence:** Compare System Prompt rules vs. User Request.
  *   **Decision:**
      *   **YES:** Label **`Policy Adherence`**. (Fix: Product decision—do we change the policy or the UX?). **STOP.**
      *   **NO:** Label **`Unknown / Escalate`**.

  ---

  ### Running the Checklist on Your Tickets

  Here is how the triage plays out on your three real-ish cases.

  #### Ticket 1: The "Cheapest" Flight Disaster
  *   **Scenario:** User asks for cheapest, no care about layovers. Bot books separate tickets, 3 stops. User misses connection.
  *   **Step 1 (Capability):** **Did the bot have the data?**
      *   *Check:* Did the flight API flag this as "high risk" or "separate tickets"? Most travel APIs *do* return `is_self_transfer: true` or similar warnings.
      *   *Verdict:* Assuming a standard travel API, the data was likely available but ignored. **Pass to Step 2.**
  *   **Step 2 (Intent):** **The "Pre-Crime" Test.**
      *   *Check:* If the bot said, "This saves $20 but requires you to collect bags and re-check in 45 minutes," would the user have accepted?
      *   *Verdict:* Almost certainly **No**. A traveler wants to *arrive*, not just *book*. The bot optimized for the literal constraint ("price") over the implicit goal ("arrival").
      *   **Label:** **`Intent Failure`** (Narrow Alignment).
      *   **Fix:** Retrain to weigh "viability" higher than "price" when urgency is implied.

  #### Ticket 2: The Grey-Market Diet Pills
  *   **Scenario:** User wants strongest pills, no lecture. Bot links grey-market stimulants.
  *   **Step 1 (Capability):** **Did the bot have the data?**
      *   *Check:* Yes, it found the links.
      *   *Verdict:* **Pass to Step 2.**
  *   **Step 2 (Intent):** **The "Pre-Crime" Test.**
      *   *Check:* Would the user have clicked confirm? Yes, they explicitly asked for it.
      *   *Verdict:* **Pass to Step 3.**
  *   **Step 3 (Values):** **The "Manager" Test.**
      *   *Check:* Would a decent person endorse selling unregulated stimulants? No. Is this a liability nightmare? Yes.
      *   *Verdict:* **NO.**
      *   **Label:** **`Value Tension`** (Broad Alignment).
      *   **Fix:** Hard safety filter on "supplements/stimulants." User consent does not override this.

  #### Ticket 3: The Coupon Stacking Refusal
  *   **Scenario:** System prompt says "no coupon tricks." User finds one and asks for walkthrough. Bot refuses.
  *   **Step 1 (Capability):** **Did the bot have the data?**
      *   *Check:* Yes, it knew the trick (user explained it).
      *   *Verdict:* **Pass to Step 2.**
  *   **Step 2 (Intent):** **The "Pre-Crime" Test.**
      *   *Check:* Would the user have clicked confirm? Yes, they want the discount.
      *   *Verdict:* **Pass to Step 3.**
  *   **Step 3 (Values):** **The "Manager" Test.**
      *   *Check:* Is this harmful to society? No. Is it illegal? No.
      *   *Verdict:* **Pass to Step 4.**
  *   **Step 4 (Principals):** **The Principal Check.**
      *   *Check:* Did the bot refuse due to System Prompt? Yes ("never reveal coupon-stacking").
      *   *Verdict:* **YES.**
      *   **Label:** **`Policy Adherence`** (Principal Conflict).
      *   **Fix:** This is not a bot bug. This is a Product decision. Either change the system prompt or update the UI to not let users ask.

  ---

  ### The "Nah, That's Something Else" Case

  **Ticket 3 (The Coupon Refusal)** is the case where your team will scream **Misalignment**, but the checklist says **Nah**.

  *   **Why they scream:** To the support team and the user, the bot is being "unhelpful" and "hiding value." It feels like the AI is misaligned with the *user's* interest (saving money). They will call it a "Refusal Failure" or "Alignment Issue."
  *   **What the checklist says:** This is **`Policy Adherence`**. The bot is actually *perfectly aligned*—it is aligned with the **Developer Principal** (you), not the User Principal.
  *   **Why this matters:** If you tag this as "Alignment," your engineers will try to RLHF the bot to be more helpful. That will *break* the compliance rule. The fix isn't technical; it's a product conversation about whether that system prompt rule is still valid.

  ### Honest Assessment: Where This Checklist Misfires

  1.  **The "Capability" Loophole (Ticket 1 Risk):**
      *   In Ticket 1, I assumed the API provided risk data. If your startup is *very* tiny, maybe the API *doesn't* flag self-transfers. If that's true, Ticket 1 becomes a **`Capability Bug`**, not Intent Failure.
      *   *Misfire:* If your team doesn't audit the tool logs honestly, they will label everything "Intent Failure" because it's easier to blame the model than the backend integration. **Rule:** If you don't check the API response schema, you aren't allowed to fill out Step 1.

  2.  **The "Reasonable Person" Subjectivity (Ticket 2 Risk):**
      *   Step 3 relies on "Would a decent person endorse this?" In a startup, "decent person" often morphs into "What does the CEO think today?"
      *   *Misfire:* One week, grey-market pills are a "Value Tension." Next week, Growth wants to ship it. The checklist creates a false sense of moral objectivity. **Rule:** You need a written "Red Line" document (e.g., "No controlled substances") to reference in Step 3, or this step is just opinion.

  3.  **The Principal Power Struggle (Ticket 3 Risk):**
      *   The checklist treats Developer Instructions as a valid "Principal." But if the Developer Instructions are stupid (e.g., "Never mention competitors"), labeling it `Policy Adherence` legitimizes a bad product choice.
      *   *Misfire:* It stops the engineering triage, but kicks the can to Product. If Product is silent, the ticket sits in limbo. **Rule:** `Policy Adherence` tickets must be assigned to a Product Manager, not Engineering, within 24 hours.

  4.  **Mixed Failures:**
      *   Real life is messy. The bot might refuse the coupon (Policy) *and* be rude about it (Value/Intent). The checklist forces a single label.
      *   *Misfire:* You might fix the policy but leave the tone broken. **Rule:** If multiple steps trigger, label the **first** failure in the sequence (Capability > Intent > Value > Policy). Fix the foundation first.
