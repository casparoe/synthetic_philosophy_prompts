answer: |-
  ### Desiderata for a Committee Theory of Aggregation

  You are asking for a theory that satisfies conditions which formal ethics has spent fifty years proving are often mutually incompatible. There is no consensus solution to the "numbers problem" in moral philosophy. However, for a committee that must act, you need a *working* specification, not a solved metaphysical puzzle.

  Below is your list, collapsed from eight to five core requirements. I have reordered them by logical priority, flagged their status (non-negotiable for policy vs. contested philosophy), and marked confidence levels regarding their satisfiability.

  #### 1. Description Invariance (Framing Robustness)
  *   **Specification:** The moral verdict must not change if a single patient's harm is described as one large loss or ten small ones, nor if ten distinct patients are described as a single collective entity, provided the physical reality of suffering and agency remains constant.
  *   **Motivating Case:** Your committee member who divides a single stake into parts to make it weigh more (or merges distinct claimants to make them weigh less).
  *   **Status:** **Non-negotiable for policy.** Without this, the budget process is manipulable.
  *   **Confidence:** **High** that this is required; **Low** that any theory satisfies it perfectly. (Defining "physical reality" vs. "moral description" is itself contested).
  *   **Note:** This rules out ad-hoc reasoning but does not tell you *how* to weigh the stakes.

  #### 2. Aggregation Continuity (The Sorites Constraint)
  *   **Specification:** The theory must specify whether there is a threshold where enough small harms outweigh one catastrophic harm, and if so, where that threshold lies. It cannot say "numbers never count" (which blocks prevention programs) nor "numbers always count linearly" (which blocks protection of the severely disabled).
  *   **Motivating Case:** The thousand patients with small probabilities vs. the one patient with certainty; the prevention program (trivial cost to many, large gain to few).
  *   **Status:** **Contested.** Utilitarians demand linearity; Contractualists often demand a threshold or lexical priority.
  *   **Confidence:** **Settled** that a decision is needed; **Contested** on what the decision should be.
  *   **Note:** This is where most theories break. You must choose between a "discount rate" on small claims or a "priority" for severe claims.

  #### 3. Individual Reciprocity (The Justification Constraint)
  *   **Specification:** The decision must be justifiable to each losing claimant in terms they could not reasonably reject, rather than merely pointing to a greater total sum elsewhere.
  *   **Motivating Case:** Your requirement to offer a justification to the loser rather than only a total.
  *   **Status:** **Contested Commitment.** This is the hallmark of Contractualism (Scanlon). Utilitarianism explicitly rejects this (the total justifies the loss).
  *   **Confidence:** **High** that this excludes simple summing; **Contested** whether it is morally required.
  *   **Note:** This is the heaviest lift. It requires that the *reason* for the decision be accessible to the person harmed by it.

  #### 4. Procedural Determinacy (Action-Guidance)
  *   **Specification:** The theory must yield a single verdict or a defined randomization procedure in cases of tie or incommensurability. It cannot declare a "moral dilemma" where no choice is permissible.
  *   **Motivating Case:** When stakes tie and the good is indivisible (lottery vs. rotation).
  *   **Status:** **Non-negotiable for policy.** A committee cannot return "no verdict."
  *   **Confidence:** **High.**
  *   **Note:** This forces the theory to handle remainders. If moral reasons tie, the procedure (e.g., coin flip) becomes the moral decider.

  #### 5. Claimant Stability (Identity and Baseline)
  *   **Specification:** The theory must define who counts as a claimant (e.g., future vs. present) and whether being "worse off anyway" reduces the weight of their claim.
  *   **Motivating Case:** Future claimants (prevention) and the "worse-off-anyway" appearance (Requirement vii).
  *   **Status:** **Contested.** (Identity problems are notoriously unsolved).
  *   **Confidence:** **Low.** There is no settled view on non-identity problems.
  *   **Note:** For an *annual* budget, you may pragmatically restrict this to "current identifiable patients" to bypass the hardest metaphysical issues.

  ---

  ### Smuggled Commitments in Your Framing

  You asked to identify where your prompt assumes a contested position. There are two significant ones:

  1.  **Individual Reciprocity:** By demanding a justification addressable to *each individual loser*, you have pre-loaded the deck against **Total Utilitarianism**. A Utilitarian justifies the decision to the *World* (maximizing the good), not to the *Loser* (who was sacrificed for the total). If you keep this requirement, you are effectively hiring a Contractualist.
      *   *Without it:* The list would allow for QALY-maximization models where individual complaints are overridden by aggregate efficiency.
  2.  **Procedural Determinacy:** By demanding the committee *reach a decision*, you rule out moral theories that allow for genuine dilemmas (where both options are wrong, or neither is right). Some philosophers argue that in tragic choices, there *is* no right answer, only a remainder of guilt. Your policy context forbids this.

  ---

  ### Incompatibility Warning

  **Flagged Subset:** **Description Invariance + Aggregation Continuity + Individual Reciprocity.**
  There is a strong argument (akin to Arrow's Impossibility Theorem in economics) that you cannot satisfy all three simultaneously in edge cases.
  *   If you respect **Reciprocity** (protecting the individual from being outweighed), you often violate **Continuity** (you cannot aggregate enough small pains to save a life).
  *   If you respect **Continuity** (allowing aggregation to save more lives), you often violate **Reciprocity** (the individual sacrificed can reasonably reject the rule).
  *   If you try to fix this with weighting, you often violate **Invariance** (the weight depends on how you describe the baseline).

  *Confidence:* **High.** This is the central tension in modern distributive justice literature. You will have to prioritize one over the others when they conflict.

  ---

  ### The Single Requirement Excluding Popular Candidates

  **Requirement:** **Individual Reciprocity.**

  **Why:** This is the single filter that does the most work.
  *   It excludes **Total Utilitarianism** (the dominant model in health economics/QALYs), because Utilitarianism permits sacrificing an individual whenever the aggregate gain is sufficient, regardless of whether that individual can accept the justification.
  *   It excludes **Pure Prioritarianism** (weighting the worse off), because while it helps the severe case, it still aggregates; if the numbers of the mildly afflicted are high enough, Prioritarianism will still override the severe case, which fails the "reasonable rejectability" test for the severe patient.
  *   It forces you toward **Contractualism** or **Rights-Based** views, which are harder to operationalize in budget spreadsheets.

  ---

  ### Theory Scoring

  Here is how four common frameworks score against your five desiderata.

  | Theory | 1. Invariance | 2. Continuity | 3. Reciprocity | 4. Determinacy | 5. Stability | Verdict for Committee |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Total Utilitarianism** (Summing) | **Pass** (Mathematically robust) | **Pass** (Linear aggregation) | **Fail** (Cannot justify to loser) | **Pass** (Always yields max) | **Pass** (Ignores identity) | **Efficient but unjustifiable** to losers. Violates your core constraint. |
  | **Scanlon-style Contractualism** | **Fail** (Sensitive to description of "reasonable") | **Fail** (Often blocks aggregation of small claims) | **Pass** (Core feature) | **Fail** (Allows ties/dilemmas) | **Pass** (Focus on identifiable) | **Justifiable but paralyzing.** May block prevention programs. |
  | **Prioritarianism** (Weighted Sum) | **Fail** (Depends on baseline definition) | **Pass** (Allows aggregation with weights) | **Fail** (Still aggregates over heads) | **Pass** (Yields max weighted score) | **Fail** (Sensitive to baseline) | **Middle ground.** Better for severe cases, but still fails Reciprocity. |
  | **Taurek-style Non-Aggregation** | **Pass** (Counts persons, not sums) | **Fail** (Refuses to trade numbers for severity) | **Pass** (Protects individual) | **Fail** (Requires randomization in conflicts) | **Pass** (Strict identity) | **Too rigid.** Prevents saving more lives over fewer in equal stakes. |

  **Confidence Note:** The "Pass/Fail" marks here represent the *standard* interpretation of these theories. There are sophisticated variants of each that attempt to patch these failures, but those variants usually introduce complexity that violates **Procedural Determinacy** for a committee.

  ### Final Recommendation for Specification

  If you must operationalize this, do not look for a theory that passes all five. Look for a **lexical priority rule** that respects **Individual Reciprocity** up to a threshold, then switches to **Aggregation**.
  *   *Example:* "Severe disability claims cannot be outweighed by mild claims *unless* the number of mild claimants exceeds X."
  *   This violates strict **Continuity** (it creates a cliff-edge) and strict **Reciprocity** (at the threshold, the severe patient is outweighed), but it is the only way to satisfy **Determinacy** and **Invariance** enough to write a policy document.

  **Confidence:** **Moderate.** This is a pragmatic compromise, not a philosophical solution. It acknowledges that for a committee, a consistent rule is morally superior to a perfect theory that cannot be applied.
