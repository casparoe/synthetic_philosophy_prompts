answer: |-
  # Desiderata for a Doing/Allowing Framework in Hybrid Human-Algorithmic Systems

  To function within an institutional ethics framework governing hybrid clinical systems (e.g., automated ventilation protocols), a theory of the doing/allowing distinction must satisfy the following desiderata. These criteria ensure the theory can distinguish between *killing* (active doing) and *letting die* (allowing) without collapsing under the complexity of distributed agency.

  ## I. Conceptual Distinction Desiderata
  *The theory must maintain specific conceptual boundaries to avoid moral confusion.*

  1.  **Causal Contribution vs. Normative Responsibility [NON-NEGOTIABLE]**
      The theory must distinguish between being a physical link in a causal chain and bearing the normative weight of the outcome. In automated systems, a programmer, a hospital administrator, and a physician may all be causal contributors to a patient's death via code deployment. The theory must not classify all causal contributors as "doing" the killing; it must filter causal chains through normative roles to determine who *acted* versus who merely *enabled*.
  2.  **Individual vs. Distributed Agency [NON-NEGOTIABLE]**
      The theory must account for agency that is emergent across human and non-human nodes. It cannot require a single, unitary human mind to be the sole locus of intention for an action to count as a "doing." However, it must also avoid the "many hands" problem where distributed agency results in no one being responsible for the "doing."
  3.  **Intending vs. Foreseeing [CAMP-SPECIFIC]**
      *Preference:* A robust framework should distinguish between outcomes intended as means/ends and those merely foreseen (Doctrine of Double Effect).
      *Constraint:* However, in algorithmic systems, "intent" is often encoded as objective functions. The theory must specify whether optimizing a risk score that predictably kills a patient constitutes *intending* their death or merely *foreseeing* it as a cost of triage efficiency.
  4.  **Duty-Violating Omission vs. Natural Course [NON-NEGOTIABLE]**
      The theory must distinguish between an omission that breaches a specific institutional duty (e.g., failing to override a malfunctioning algorithm when on duty) and an omission that merely allows a natural course (e.g., not deploying a ventilator that was never indicated). Not all "letting die" is morally equivalent; the framework must identify when an allowance becomes a culpable omission.

  ## II. Case-Coverage Desiderata
  *The theory must yield intuitive or justifiable verdicts on specific hybrid scenarios.*

  5.  **Direct Physical Intervention [NON-NEGOTIABLE]**
      *Case:* A physician manually turns off a ventilator.
      *Requirement:* The theory must classify this as a **Doing** (Killing), provided no overriding justification (e.g., futility) exists. It serves as the baseline control case.
  6.  **Authorization of Automated Execution [NON-NEGOTIABLE]**
      *Case:* A physician enables a protocol that automatically withdraws ventilation if risk scores exceed a threshold.
      *Requirement:* The theory must **not** classify every automated outcome as a "Doing" by the human authorizer simply because they authorized the system. If the algorithm acts outside expected parameters (e.g., due to data drift), the human's role may shift from "Doing" to "Negligent Allowing." The distinction must track the *fidelity* of the automation to the human's mandate.
  7.  **Failure to Rescue (Machine-Assigned) [NON-NEGOTIABLE]**
      *Case:* A monitoring algorithm fails to alert on a deteriorating patient; the physician does not intervene because they rely on the monitor.
      *Requirement:* The theory must determine if this is a **Doing** (via the machine as proxy) or an **Allowing** (failure to monitor). It must resolve whether delegating rescue to a machine transfers the "doing" of the rescue to the machine, leaving the human with only an "allowing" role if it fails.
  8.  **Redirection of Scarce Resources [NON-NEGOTIABLE]**
      *Case:* A triage algorithm assigns a ventilator to Patient A, causing Patient B to die.
      *Requirement:* The theory must distinguish between *killing* Patient B (by taking the resource) and *letting* Patient B die (by allocating elsewhere). In hybrid systems, resource allocation is often active (reassigning a machine). The theory must clarify if active reallocation via algorithm constitutes a "Doing" regarding the patient who loses the resource.

  ## III. Empirical & Cognitive Consistency Desiderata
  *The theory must align with how agents actually perceive and process their roles.*

  9.  **Representation of Causal Role [NON-NEGOTIABLE]**
      Findings from moral psychology indicate that agents in distributed systems often experience "moral buffering," perceiving themselves as less causally connected to outcomes mediated by technology. The theory cannot rely solely on the agent's *subjective* feeling of agency to determine "Doing." It must provide an objective standard that corrects for the psychological distance introduced by interfaces.
  10. **Organizational Cognition Constraints [NON-NEGOTIABLE]**
      The theory must acknowledge that institutional protocols shape cognitive availability. If a protocol hides the "off switch" or makes overriding difficult, the theory must treat the resulting omission differently than a refusal to act where action was frictionless. It must account for *nudge* architecture in determining the voluntariness of an allowance.

  ## IV. Classification of Desiderata: Non-Negotiable vs. Camp-Specific

  | Desideratum | Classification | Rationale |
  | :--- | :--- | :--- |
  | **Causal/Normative Distinction** | **Non-Negotiable** | Without this, every causal contributor (including the power grid maintainer) is a killer. |
  | **Distributed Agency** | **Non-Negotiable** | Hybrid systems inherently distribute agency; a theory requiring unitary agency cannot apply. |
  | **Duty-Violating Omission** | **Non-Negotiable** | Essential for legal and institutional accountability; distinguishes malpractice from tragedy. |
  | **Authorization Fidelity** | **Non-Negotiable** | Prevents strict liability for all algorithmic errors, which would halt innovation and care. |
  | **Bodily Motion Requirement** | **Camp-Specific** | *Physicalist View:* Only bodily motion counts as "Doing." *Functionalist View:* Setting a trigger counts as "Doing." (Framework should prefer Functionalist for algorithms). |
  | **Intending vs. Foreseeing** | **Camp-Specific** | Consequentialists reject this distinction; Deontologists require it. Framework must state its stance. |
  | **Psychological Alignment** | **Non-Negotiable** | A theory that contradicts how agents cognitively process causation will fail in implementation. |

  ## V. Feasibility Analysis: Jointly Unsatisfiable Requirements

  There is a significant tension, potentially rendering a subset of these requirements **jointly unsatisfiable** under strict interpretations:

  **The Tension:** *Precise Agent-Level Causation* vs. *Distributed Execution.*
  *   **Requirement A:** The theory must identify a specific human agent responsible for the "Doing" (to satisfy retributive or corrective justice).
  *   **Requirement B:** The theory must accurately reflect distributed algorithmic agency where the specific outcome was not deterministically caused by any single human input (due to machine learning opacity or complex system interactions).

  **Analysis:** If the framework demands that a "Doing" requires a human to have *specific causal control* over the specific lethal event (Requirement A), it cannot accommodate modern adaptive algorithms where the human authorizer sets a goal but not the specific path (Requirement B).
  *   **Resolution:** To satisfy both, the theory must shift from a *causal* definition of "Doing" to a *normative-role* definition. "Doing" is not defined by physical causation but by the assumption of a specific institutional role (e.g., "Protocol Owner"). If this shift is not made, the requirements are unsatisfiable: you cannot have precise human causation in non-deterministic distributed systems.

  **The Tension:** *Moral Buffering* vs. *Objective Responsibility.*
  *   **Requirement:** The theory must correct for psychological moral buffering (Desideratum 9).
  *   **Requirement:** The theory must align with organizational cognition (Desideratum 10).
  *   **Conflict:** Organizational cognition often *relies* on moral buffering to function (e.g., triage nurses must not feel they are "killing" those they deprioritize). A theory that aggressively reclassifies these allowances as "Doings" to correct for buffering may cause moral distress that degrades system performance.

  ## VI. Brief Assessment of Existing Theoretical Accounts

  *   **Causal Accounts (Physicalist):**
      *   *Performance:* **Fail.** They struggle with *Authorization of Automated Execution*. If the human does not physically pull the lever, causal accounts often classify the death as "allowing," even if the human programmed the lethality. They also collapse under *Distributed Agency* where causation is diffuse.
  *   **Normative-Role Accounts:**
      *   *Performance:* **Strong.** They handle *Duty-Violating Omission* well by tying "Doing" to the breach of a specific institutional mandate. They can classify *Authorization* as a "Doing" if the role entails guaranteeing safety. However, they risk being too circular (defining duty by what counts as doing).
  *   **Counterfactual-Dependency Accounts:**
      *   *Performance:* **Mixed.** They ask: "Would the patient die if the agent hadn't acted?" This works for *Direct Intervention* but fails in *Redirection of Scarce Resources*. In triage, if the physician doesn't act, the patient still dies (due to scarcity). Counterfactual accounts often classify triage deaths as "allowing," which may violate the intuition that active reallocation is a "Doing."

  **Conclusion:** An adequate framework must prioritize **Normative-Role** criteria over strict physical causation to satisfy the non-negotiable desiderata of distributed agency and authorization fidelity. It must explicitly reject the camp-specific preference for "bodily motion only" to remain applicable to hybrid systems.
