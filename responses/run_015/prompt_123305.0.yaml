answer: |-
  **Interpretive Note**
  In drafting this, I aimed to embody the distinction between "thin" and "thick" ties through the texture of the Bureau's bureaucracy rather than explicit definition. A thin tie is treated procedurally—a matter of administrative efficiency. A thick tie is treated existentially—a fracture in the self. The ambiguity rests on whether the Bureau's lottery is a tool that respects the limits of human reasoning (acknowledging that some values are incommensurable) or a technology that allows agents to outsource the burden of self-constitution. The ending refuses to confirm whether the protagonist's certification saves the petitioner from paralysis or saves him from the responsibility of becoming one specific person rather than another.

  ***

  The folders were identical. That was the requirement. If the left folder had a scuff mark the right one didn't, the petition was void. Elara ran her thumb over the cardstock, feeling for imperfections that weren't there. The Bureau of Equipoise demanded perfect symmetry to certify asymmetry in the soul.

  On the other side of the glass partition, the petitioner sat with his hands folded. Kael. Thirty-four years old. Neuroscientist. Mother with advanced dementia. The file lay open on her desk: *Petition 8940. Request for Statutory Resolution.*

  Elara looked up at the camera in the corner. Her supervisor, Vance, was watching from the oversight booth. He believed every deadlock was a lie. To Vance, indifference was a moral failure, a refusal to look closely enough at the world. He thought the Bureau was a laundromat for cowardice. Elara used to agree. Now she wasn't sure. She had seen too many people break themselves trying to find a difference where there was none, sanding down their own values until they were smooth enough to slide into a slot.

  She pressed the intercom. "Mr. Kael. You understand that if I certify this, the choice is removed from you. The lottery determines the action. You must execute the outcome within forty-eight hours."

  Kael nodded. He didn't look relieved. That was the first sign. The ones who wanted to escape responsibility usually sagged when they heard the terms. They wanted the permission to stop caring. Kael looked like a man waiting for a diagnosis.

  "I understand," Kael said. His voice was steady. "But I need you to know… it's not that I don't know what I want. It's that I don't know who I am supposed to be."

  Elara paused. This was the threshold. A thin tie was about outcomes: Bus A arrives in five minutes, Bus B arrives in five minutes. Take the coin. A thick tie was about constitution: To take the job is to be a scientist who abandoned his mother. To stay is to be a son who buried his mind. The values weren't equal; they were incompatible. They occupied the same space in his life and demanded exclusive tenure.

  "The Bureau does not adjudicate identity," Elara said, reciting the script. "We adjudicate impasse."

  "Is there a difference?"

  "Not for the purposes of certification."

  She looked at the file again. The supervised deliberation period was complete. Thirty days of logging preferences, mood states, nutritional intake. The data showed genuine oscillation. No trend line. No hidden preference leaking through the physiological noise. On paper, it was a perfect tie. But paper didn't capture the atrophy.

  Elara remembered a case from last year. A woman choosing between two lovers. She had come back three times. The first time, the tie was real. The second time, she knew the Bureau would flip the coin if she asked, so she stopped looking for reasons to choose. By the third time, she was genuinely indifferent because she had trained herself not to care. The Bureau had cured her indecision by curing her capacity to prefer.

  Was Kael like that? Had he stopped looking because the lottery existed? Or was he looking, and finding only a mirror?

  "Why not choose?" Elara asked. She wasn't supposed to ask that. It was outside the protocol.

  "Because choosing implies one path is better," Kael said. "If I choose the lab, I say my work matters more than her care. If I choose her, I say my work matters less. Neither is true. They both matter. Choosing feels like a lie."

  "And letting the state choose feels like the truth?"

  "It feels like admitting I'm not big enough to hold both."

  Elara looked at the camera again. Vance would say this was precisely the cowardice he predicted. *He wants to be the victim of chance so he doesn't have to be the agent of loss.* But Elara felt a tightness in her chest. She thought about her own life, the small choices she made without thinking, the ones that added up to a shape she hadn't designed. Maybe the capacity to be moved by considerations one cannot rank wasn't a defect. Maybe it was the only honest response to a world that didn't fit into hierarchies.

  But if she certified, she closed the question. Once the lot was drawn, Kael would go to the lab or stay home. He would stop asking who he was. He would just be what the machine said. The lottery settles the action, but it forecloses the question.

  She picked up the stamp. It was heavy, cold steel. *CERTIFIED.*

  If she refused, she sent him back into the deliberation. He would have to find a difference. He would have to lie to himself, elevate one value over the other artificially, just to move. He would become a man who chooses, but he would choose based on a fiction.

  If she certified, he became a man to whom something happened. But maybe that was the only way to keep the truth of the tie intact. To let the universe decide when the self cannot.

  "Mr. Kael," Elara said. "There is no appeal after certification."

  "I know."

  "There is no going back."

  "I know."

  She looked at the two folders. Left: Stay. Right: Go. They were identical. She had checked them herself. But as she held them, she felt the weight of the paper, the slight variance in humidity, the microscopic dust motes settling on the surface. Nothing was truly identical. The universe was noisy. But the noise wasn't reason.

  She thought of Vance watching her. He wanted her to see the hidden preference. He wanted her to find the crack in Kael's voice that said *I want to leave.* But there was no crack. There was only the smooth, hard surface of a genuine conflict.

  Elara realized then that her worry about manufactured indifference was itself a form of arrogance. She was assuming she knew what a healthy agency looked like. She was assuming that a person *should* be able to rank their own soul. But perhaps the tie was the point. Perhaps the stiffness in Kael's spine was not a failure of will, but a refusal to simplify.

  And yet, by stamping the paper, she was simplifying him.

  She lifted the stamp. The ink pad was fresh, a deep, violent red.

  If she stamped it, she gave him peace. He would walk out, the lottery would run, and he would obey. He would not have to hate himself for the path not taken, because he didn't take it. Chance did. But he would also never know if he could have borne the weight. She was stealing his opportunity to become the kind of person who could choose the impossible.

  If she denied it, she condemned him to paralysis. He might never choose. He might starve like the ass between the bales. Or he might choose badly, resentfully, and hate himself forever.

  There was no rational tie-breaker here. Not for her. This was her own thick tie. To protect him from the burden of choice, or to protect the sanctity of choosing.

  Elara lowered the stamp. She looked at Kael. He was watching her hands. He wasn't praying for a specific outcome. He was praying for resolution.

  She thought about the folders again. Identical. But she was holding them. Her left hand was slightly warmer than her right. Her breath shifted the paper by a micron. The system demanded perfection, but the agent was always imperfect.

  She brought the stamp down.

  The sound was a dull thud, like a door closing in a distant room.

  *CERTIFIED.*

  Kael exhaled. It wasn't a sigh of relief. It was the sound of a tension leaving a muscle that had been cramped for too long. He stood up. He didn't thank her. He just nodded, once, and turned toward the lottery chamber.

  Elara watched him go. She picked up the file to close it. Inside, the data streams continued to scroll, the thirty days of deliberation frozen in digital amber. He had been two people for a month. Now he would be one.

  She looked at the stamp. A smear of red ink stained her thumb where she had gripped it. She wiped it on a tissue, but the color stayed in the creases of her skin.

  On the intercom, Vance's voice crackled, dry and satisfied. "Good call. He was ready to bolt. You could see it in his eyes."

  Elara looked at the camera. She didn't wipe her thumb. She let the stain remain, a small mark of the transaction.

  "Maybe," she said.

  She closed the folder. Outside, the lottery machine began to hum, a low, electric sound that vibrated through the floor. It was the sound of a question being answered without being asked. Elara sat in the silence that followed, waiting to see if the hum would stop, or if it would just become the background noise of the city.
