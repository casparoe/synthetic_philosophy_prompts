      *   Use specific names (Van Fraassen, Pomeranz, Elvin, Weber) to ground the concepts.
      *   Ensure the distinction between *logical structure* and *historiographical framing* is clear, as the user specifically asked about mixing them up.

  7.  **Self-Correction/Check during drafting:**
