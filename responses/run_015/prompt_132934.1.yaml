answer: |-
  This is a fantastic methodological knot you've encountered. It sits right at the intersection of philosophy of science (specifically the logic of explanation) and the historiography of the Great Divergence. Your seminar is essentially re-enacting the shift from classical Weberian comparative sociology to the "California School" (Pomeranz, Bin Wong, etc.).

  To untangle this, we need to separate the **logical structure** of contrastive questions from the **empirical preconditions** required to ask them, and then look at how **historiographical framing** smuggles assumptions into both.

  Here is a breakdown of the conceptual issues, the problem of asymmetry, and how to salvage the comparison.

  ---

  ### 1. The Logic of Contrastive Explanation: The "Foil" Problem
  Your classmates arguing about the "sick roommate" are invoking the standard philosophical model of contrastive explanation (associated with Bas van Fraassen and Peter Lipton). To explain "Why P rather than Q," you must identify a **difference-maker** that exists in the history of P but is absent in the history of Q.

  *   **The "Sick Roommate" Logic:** This works for *proximate* causes. If you and your roommate share a house (shared background) but only you got the flu, the explanation is likely a specific difference (you didn't wash your hands; you have a weaker immune system). The "possibility space" is shared: both of you were susceptible to the virus.
  *   **The Historical Problem:** Industrialization is not a virus; it is a structural transformation. The objection that Britain and Qing China are "incommensurable" argues that they do not share a **causal background**.
      *   If Britain was a mercantile, coal-rich, high-wage economy and China was a high-level equilibrium trap with abundant labor and no coal, they are not two instances of the *same system* with one variable changed. They are two *different systems*.
      *   **Logical Verdict:** If the systems are fundamentally different, asking "Why P and not Q?" is logically flawed because Q was never a live possibility in the same way P was. It becomes like asking, "Why did this apple tree bear fruit and not this pine tree?" The answer isn't a variable; it's a category error.

  ### 2. Shared Possibility Space: Empirical or Logical?
  This is where your confusion about "logical vs. empirical" is most relevant.

  *   **The Logical Requirement:** For a contrastive explanation to be valid, the foil (China) must represent a **counterfactual possibility**. It must be true that, *ceteris paribus*, China could have industrialized.
  *   **The Empirical Battle:** The debate over whether Britain and China are "too different" is actually an empirical debate disguised as a logical one.
      *   **The Eurocentric View (Old Guard):** Assumes China was structurally incapable (despotic, lacking property rights). Therefore, the possibility space is *not* shared. Asking "Why not China?" is invalid because the answer is "Because it's China." This collapses into a separate monograph on Chinese stagnation.
      *   **The California School (Pomeranz):** Argues that until 1750, the Yangtze Delta and England *were* in a shared possibility space (similar life expectancy, markets, wages). Therefore, the divergence is late and contingent. This **saves the contrastive question** empirically, making the logic valid.

  **Conclusion on this point:** The problem is not logical in the abstract; it is logical *conditional on empirical facts*. If the empirical claim of "similarity until 1750" is false, the contrastive question collapses.

  ### 3. Explanatory Asymmetry and Framing
  This is the trickiest part. Explanatory asymmetry usually refers to the idea that "Why A caused B" is not the same explanation as "Why B did not happen without A." In your seminar, this is being used to describe **Teleological Bias**.

  *   **The Framing Trap:** When you ask "Why Britain and not China?", you implicitly treat Britain as the **norm** (the thing that happens when things go right) and China as the **deviation** (the thing that needs explaining).
  *   **How the Answer is Contained in the Framing:**
      *   If you frame it as "Why did Britain succeed?", you look for *positive* factors in Britain (culture, institutions, science). You assume the default state of nations is *not* to industrialize.
      *   If you frame it as "Why did China fail?", you look for *negative* factors in China (despotism, lack of competition). You assume the default state of advanced agrarian societies *is* to industrialize.
      *   **The Asymmetry:** If you assume industrialization is the natural endpoint of economic growth (teleology), then China's failure requires a "blockage" explanation (Needham). If you assume industrialization is a rare, contingent accident (ecology/geography), then Britain's success requires a "windfall" explanation (coal/colonies).
      *   **The Risk:** The question "Why Britain and not China?" often presupposes that both were on the same track and Britain won the race. If they weren't on the same track, the question forces a false symmetry onto asymmetric histories.

  ### 4. Needham vs. The Great Divergence
  Your friend is partially right, but the issues are entangled.

  *   **The Needham Question:** "Why did China fall behind *relative to its own earlier trajectory*?" This is an **internal** comparison (Song Dynasty vs. Qing Dynasty). It focuses on endogenous blocks (e.g., Mark Elvin's "High-Level Equilibrium Trap"). It does not necessarily require Britain as a foil.
  *   **The Great Divergence Question:** "Why did Northwest Europe pull ahead of East Asia *at a specific point in time*?" This is an **external** comparison.
  *   **The Flip Side:** They become the same question only if you assume a global convergence trend that was broken.
      *   If you treat them as separate, you write one book on Chinese institutional path dependence and another on British coal geology.
      *   If you treat them as linked, you must explain why the *same* global pressures (population growth, resource constraints) produced different outcomes.
      *   **Conceptual Issue:** Conflating them leads to the error of assuming China *should* have industrialized (Needham's puzzle) because Britain *did* (Divergence). Pomeranz's move was to argue China wasn't "stagnating" internally; it was just diverging externally due to contingent factors.

  ### 5. Salvaging the Comparison (Without Collapsing into Monographs)
  You can save the contrastive explanation, but you have to tighten the methodological screws so you aren't comparing "Civilizations" but rather **mechanisms**.

  **1. Shift from "Societies" to "Regions":**
  Don't compare "Britain" vs. "China." Compare "Lancashire" vs. "Yangtze Delta." This creates the **Shared Possibility Space** required for the logic to hold. Both were advanced proto-industrial cores facing similar Malthusian constraints in 1750.

  **2. Focus on Specific Mechanisms, Not Totalities:**
  Don't ask "Why did they industrialize?" Ask "Why did energy constraints bind in one region and not the other?"
  *   This allows you to use Mill's Method of Difference.
  *   Variable: Access to ghost acres (colonies) and coal.
  *   Control: Market sophistication, labor productivity, agricultural yield.
  *   This avoids the "incommensurable" trap because you aren't comparing "Confucianism" to "Protestantism" (vague cultural totalities); you are comparing calorie inputs to mechanical outputs.

  **3. Acknowledge Asymmetry Explicitly:**
  A robust explanation admits that the causes might not be mirror images.
  *   Britain didn't industrialize because it was "better"; it industrialized because it had a specific **conjuncture** (coal + colonies).
  *   China didn't *fail*; it continued on a labor-intensive path that was rational given its factor endowments.
  *   By framing it as **Divergence** rather than **Failure**, you remove the teleological bias that assumes industrialization was the goal.

  ### Summary for Your Seminar
  To synthesize this for your discussion:

  1.  **Logical Structure:** The question "Why Britain and not China?" is logically valid *only if* the two cases inhabit a shared causal possibility space. If they are structurally incommensurable, the question is a category error.
  2.  **Empirical Precondition:** Whether they are incommensurable is an empirical question. The "California School" argues they were comparable until 1750, which validates the contrastive method. The "Weberian" school argues they were not, which invalidates the comparison.
  3.  **Explanatory Asymmetry:** The framing often presupposes industrialization is the norm. To fix this, treat industrialization as the anomaly. The explanation should not be "Why China lacked X" but "Why Britain encountered Y."
  4.  **Needham vs. Divergence:** Needham is about internal path dependence; Divergence is about contingent separation. They are only the same question if you assume a universal trajectory of development exists.
  5.  **Salvage:** The comparison holds if you narrow the units of analysis (core regions) and the variables (energy/ecology) rather than comparing whole civilizations. This prevents the project from collapsing into two separate monographs while respecting structural differences.

  The argument in your seminar isn't just about history; it's about whether you believe history has a "default setting." If you think it does, Britain vs. China is a valid test. If you think history is contingent and path-dependent, the question needs serious retooling.
