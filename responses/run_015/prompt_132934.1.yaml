prompt: |-
  I'm in this seminar on comparative historical sociology and we got into a huge argument about whether asking why Britain industrialized first and not China is even well-posed as a contrastive explanition. Some people said it's like asking why I got sick and not my roommate — you just point to the difference-maker. But others argued that contrastive explanations in history need both cases to sit inside the same causal background or shared possibilty space, and Britain and Qing China might be too structurally different for that, maybe even incommensurable. There's also this idea of explanatory asymmetry that keeps coming up, where one side already contains the answer in its framing? I'm not sure how that applies here.

  Then there's Needham's question, which my friend insists is totally separate — not a Britain-versus-China comparison but an internal question about why Chinese science and tech stagnated after the Song. But isn't that just the flip side of the divergence framing? Can you explain the conceptual issue with posing the Great Divergence as why Britain and not China? I want to understand if the problem is logical, empirical, or both, and whether you can salvage the comparison without it collapsing into two separate monografs. I keep mixing up the historiographical framing with the actual logical structure of contrastive questions.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** Seminar on comparative historical sociology.
      *   **Core Debate:** Is "Why Britain industrialized first and not China?" a well-posed contrastive explanation?
      *   **Key Arguments Raised:**
          *   *Difference-maker view:* Like asking why I got sick and not my roommate (just find the variable).
          *   *Shared Possibility Space view:* Cases need similar causal backgrounds; Britain/Qing China might be too different (incommensurable).
          *   *Explanatory Asymmetry:* Does the framing presuppose the answer?
          *   *Needham Question:* Is "Why did Chinese science stagnate?" separate from "Why did Britain diverge?" or just the flip side?
      *   **User's Goal:** Understand the *conceptual issue* (logical vs. empirical), determine if the comparison is salvageable without collapsing into separate monographs, and distinguish historiographical framing from logical structure.

  2.  **Deconstruct the Philosophical/Sociological Concepts:**
      *   **Contrastive Explanation (Van Fraassen/Lipton):** Explaining *why P rather than Q*. Requires a "foil." The foil must be relevant.
      *   **Causal Homogeneity/Shared Possibility Space:** For a comparison to be valid, the units must be comparable. If the underlying structures are totally different, the variables don't map. (e.g., comparing apples and oranges vs. comparing two types of apples).
      *   **Explanatory Asymmetry:** If the explanation for P *automatically* explains not-Q by definition, the question is trivial or tautological. Or, if the framing assumes the outcome was inevitable for one and impossible for the other, it biases the search for causes.
      *   **The Needham Question:** Joseph Needham asked why China was ahead earlier but fell behind. This is often framed internally (path dependence within China) vs. externally (divergence from Europe).
      *   **The Great Divergence (Pomeranz et al.):** Shifted focus from "why Europe succeeded" to "why the Yangtze Delta didn't industrialize." This attempts to fix the "shared possibility space" problem by comparing core regions, not whole civilizations.

  3.  **Address the Specific Arguments:**

      *   *Argument 1: The "Sick Roommate" Analogy (Difference-Maker).*
          *   *Critique:* This works for proximate causes (virus exposure) but fails for structural historical processes. Industrialization isn't a single event; it's a complex system transition. If the systems are fundamentally different, the "difference maker" might be a category error.
      *   *Argument 2: Shared Possibility Space (Incommensurability).*
          *   *Validity:* This is the strongest logical objection. If Qing China had no *potential* to industrialize given its structure, asking "why not" is like asking "why didn't this fish climb the tree."
          *   *Counter:* The California School (Pomeranz) argues they *were* comparable until 1750. This saves the comparison empirically.
      *   *Argument 3: Explanatory Asymmetry.*
          *   *Meaning:* Often, "Why Britain?" assumes Britain was the norm and China the deviation. If the theory is "Capitalism is natural," then China needs explaining. If the theory is "Industrialization is rare," then Britain needs explaining. The framing dictates the null hypothesis.
      *   *Argument 4: Needham vs. Divergence.*
          *   *Distinction:* Needham is often about *internal* blocks (despotism, lack of competition). Divergence is about *contingent* separation (coal, colonies). They are logically distinct but historiographically entangled.

  4.  **Synthesize the "Logical vs. Empirical" Distinction:**
      *   *Logical:* Is the question coherent? (Yes, contrastive questions are valid).
      *   *Empirical:* Are the cases actually comparable? (This is where the fight is).
      *   *Historiographical:* What assumptions are baked into the question? (Eurocentrism, teleology).

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the seminar debate. Validate that this is a classic methodological knot in historical sociology.
      *   *Section 1: The Logic of Contrastive Explanation.* Define "Why P rather than Q." Explain the requirement for a relevant foil. Use the "sick roommate" analogy but show its limits in macro-history.
      *   *Section 2: The "Shared Possibility Space" Problem.* This is the crux. Explain "incommensurability." If China *couldn't* have industrialized, the question is invalid. Introduce Pomeranz's intervention (comparing core to core) as the solution to make the space shared.
      *   *Section 3: Explanatory Asymmetry.* Explain how framing creates bias. "Why Britain?" implies Britain is the standard. "Why not China?" implies China was on the same track. Discuss teleology (assuming the endpoint was inevitable).
      *   *Section 4: Needham vs. Divergence.* Clarify the distinction. Needham = Internal stagnation (high-level equilibrium trap). Divergence = Contingent separation. They are different logical questions but often conflated.
      *   *Section 5: Salvaging the Comparison.* How to do it right? (Mill's Methods, controlled comparison, core-region focus). Avoid "separate monographs" by focusing on a specific mechanism (e.g., energy constraints) rather than total societal comparison.
      *   *Conclusion:* Summarize. It's an empirical problem disguised as a logical one, but historiography shapes the empirical assessment.

  6.  **Refining the Tone:**
