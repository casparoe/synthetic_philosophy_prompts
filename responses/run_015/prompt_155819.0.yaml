prompt: |-
  Hey — I'm drafting a short grant proposal (maybe 4 months, small nonprofit budget) and I need you to help me frame the philosphical question. I want to work in the space between Lewis-style counterpart theory and the old transworld-identity view, but with a twist I haven't seen properly developed: call it "anchored counterpart relations." The idea, roughly, is that counterpart relations might depend not just on qualitative similarity but on some kind of causal-historical echo back to an actual-world origin — so that a reconstructed agent in a nearby world could be "the same person" in a practical, concern-granting sense without being literally identical.

  The specific question: can an anchored counterpart relation do the normative and practical work that transworld identity is usually asked to do — e.g., grounding obligations of care, continuity of responsibility, or rational self-concern — without collapsing into either pure Lewisian multiplicity or the standard Kripkean transworld-identity view? And if it can, does that mean the classic debate has been asking the wrong question all along?

  Write the proposal. I want: (1) the question sharpened so it's actually tractable in 4 months; (2) why the standard Lewis vs. transworld-identity literature doesn't settle it (hint: both sides assume counterpart relations are purely qualitative or purely essentialist); (3) the method — conceptual analysis plus targeted modal thought experiments, not empirical work; (4) what success looks like (a workable formal criterion for anchoring? a clear failure case?) and what failure looks like (it collapses into one of the old views); (5) why a foundation should care — specifically, how this framing affects debates about personal identity in digital reconstruction or AI branching, without me having to pretend I know the computer science literature inside out.

  Don't give me a bibliography or citation list — I'll fill that in myself, and half the point is that the framing is new enough that the standard refs won't cover it. Also please don't just recycle the 1986 modal realism debate; I want the proposal to sound like it's moving the ball on a live conceptual problem. Keep it to about one page's worth of text.
