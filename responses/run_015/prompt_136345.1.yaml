      5. The risk regarding the friend finding out.

      *Tone Check:* Needs to be firm. No "it depends."
      *Language:* American English (e.g., "sincerity," "realize," "program," not "programme").

      *Let's refine the "Friend 2" verdict.* Friend 2 is offering a "get out of jail free" card to do nothing. That's harmful. Friend 1 is offering a path forward. I will validate Friend 1.

