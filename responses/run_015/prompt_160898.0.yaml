answer: |-
  ### The checklist

  Use this procedure for each alert spec. It adapts teleological and informational accounts to machine learning systems where 'selection history' is replaced by 'training regime'. Aim to complete each step in five minutes. If you cannot answer a step confidently, mark it for handover.

  **1. Define the Putative Content (PC)**
  Write down what the marketing copy claims the alert is *about*. For example, 'This alert is about lameness'. This is the content you are testing. Do not write what the sensor measures (acceleration); write the biological state the farmer is told exists.

  **2. The Informational Test (Indication)**
  Ask: Does the signal covary with the PC under optimal conditions? Look at the validation data. If the alert fires, does the PC usually exist? If the PC exists, does the alert usually fire?
  *   *Pass:* High correlation in validation sets.
  *   *Fail:* Low correlation.
  *   *Note:* Passing this means the state *indicates* the PC. It does not yet mean the alert is *about* the PC. A barometer indicates rain, but is not about rain in the same way a weather forecast is.

  **3. The Teleological Test (Aboutness)**
  Ask: What was this system selected (trained) to detect? In biological accounts, content is fixed by evolutionary function. Here, function is fixed by the loss function and the human labels used during training.
  *   *Query:* What did the engineers minimise during gradient descent? What did the human labelers mark as 'positive'?
  *   *Match:* If the labels were 'lameness', the function is lameness detection.
  *   *Mismatch:* If the labels were 'milk yield drop', the function is yield prediction, even if you call it 'heat stress'.
  *   *Decision:* If the PC (Step 1) matches the Training Target, the alert is *about* the PC. If they differ, the accounts diverge. Informationally, it indicates the PC (if correlated). Teleologically, it is about the Training Target. Mark this as **UNSETTLED**. You must pick one for the spec and record the divergence.

  **4. The Misrepresentation Clause**
  Define when the alert is wrong. On teleological accounts, misrepresentation is function failure.
  *   *Specification:* 'The alert misfires when it fires without the PC present.'
  *   *Constraint:* Ensure this aligns with Step 3. If the system was trained on yield, a fire during heat stress without yield drop might technically be a 'false positive' relative to the training function, even if the cow is suffering. Write this down explicitly. Do not hide the technical definition behind welfare language.

  **5. The Evidential Test (Action)**
  Ask: Does the PC justify the recommended action? This separates *being about* from *being evidence for*.
  *   *Query:* If the PC is true, is the farmer entitled to call the vet?
  *   *Constraint:* An alert can be *about* pain (Step 3) but only be *weak evidence* for treatment (e.g., if false positives are high).
  *   *Spec Language:* Use 'suggests' for weak evidence, 'indicates' for strong evidence. Do not use 'diagnoses'.

  **6. Final Consistency Check**
  Read the draft spec. Does 'about', 'indicates', and 'evidence' appear consistently according to the steps above? If marketing language slips in (e.g., 'guarantees detection'), reject it.

  **7. Sign-off Preparation**
  If Step 3 was marked UNSETTLED, write a one-sentence justification for which definition you adopted for the spec. This is for the engineer's record, not the farmer's view.

  ***

  ### Stop and handover points

  This procedure is factual and structural; it cannot resolve normative or deeply technical disputes. Hand over to the Vet or Senior Engineer immediately in these three scenarios.

  **1. Welfare Definitions (Handover to Vet)**
  The procedure identifies what the alert is *about*, but not whether that state matters welfare-wise. If the Teleological Test (Step 3) reveals the alert is about 'yield drop' but you are marketing it as 'welfare risk', this is a veterinary ethics question. The Vet must decide if selling a yield proxy as a welfare alert is permissible. Do not make this call yourself; flag it in the spec cover sheet.

  **2. Architecture Limits (Handover to Engineer)**
  If the Informational Test (Step 2) fails because the data is noisy, do not try to philosophise the problem away. If the covariation is weak, the system cannot support strong claims. Ask the Engineer if the model can be retrained on better labels. If they say no, you must downgrade the evidential language in Step 5.

  **3. Normative Conflicts (Handover to Manager)**
  If Step 3 returns UNSETTLED (e.g., trained on yield, sold as health), and the Vet refuses to sign off on welfare grounds, but Marketing insists on the claim, this is a business risk. Your job is to record the divergence clearly. Do not arbitrate between profit and welfare. Write the spec based on the training truth, add a warning note, and escalate. Your spec protects the company from liability if the divergence is documented.

  ***

  ### Three worked cases

  **1. Lameness Alert (Leg Accelerometer)**
  *   **PC:** Lameness (biological state).
  *   **Informational:** Validation data shows 90% correlation between gait asymmetry and vet-diagnosed lameness. Passes indication.
  *   **Teleological:** Model trained on human labels of 'lame' vs 'sound' gait. Function matches PC.
  *   **Verdict:** The alert is *about* lameness.
  *   **Misrepresentation:** Fires when gait is asymmetric but cow is not lame (e.g., fresh mud on hoof).
  *   **Evidence:** Strong evidence for inspection. Spec language: 'Indicates likely lameness requiring inspection.'
  *   **Outcome:** Clean pass. No handover needed.

  **2. Pain Face Alert (Barn Camera)**
  *   **PC:** Pain (internal state).
  *   **Informational:** Signal covaries with facial landmarks (ear position, eye tightening).
  *   **Teleological:** Model trained on images labelled 'grimace' by humans.
  *   **Divergence:** Humans label grimaces, but grimaces are only *indicators* of pain, not identical to it. The system is selected to detect faces, not pain directly.
  *   **Verdict:** UNSETTLED. Informationally, it indicates grimacing. Teleologically, it is about facial configuration. Inferring 'pain' requires a veterinary bridge.
  *   **Action:** Handover to Vet. Spec must read: 'Detects facial markers associated with pain.' Do not claim it detects pain directly. Evidence is moderate; requires human confirmation.

  **3. Heat-Stress Alert (Milk Yield)**
  *   **PC:** Heat Stress (physiological state).
  *   **Informational:** Signal covaries with yield drops. Correlation with actual temperature/humidity is indirect.
  *   **Teleological:** Model tuned against milk-yield drop, not physiological markers (respiration, temperature).
  *   **Divergence:** Critical failure. Teleologically, this alert is *about* economic loss, not welfare. It indicates yield drop. It may indicate heat stress, but also mastitis or feed issues.
  *   **Verdict:** UNSETTLED. Marketing wants 'Heat Stress'. Truth is 'Yield Risk'.
  *   **Action:** Handover to Manager and Vet. Spec must state: 'Indicates significant production drop often associated with heat stress.' If Marketing writes 'Detects Heat Stress', you must file a dissent note. This alert risks false positives for welfare (treating for heat when it's mastitis) and false negatives (heat stress without yield drop). Do not sign off as a welfare tool.

  ***

  ### What this can't do

  This procedure clarifies content, but it cannot guarantee truth or moral rectitude. First, it relies on the quality of your training labels. If the human labelers were inconsistent, the 'Teleological Function' is corrupted. The procedure will tell you what the system is *about*, but if it is about 'human inconsistency', the spec will still be coherent but useless. You cannot philosophise away bad data.

  Second, it does not solve the hard problem of consciousness. The 'Pain Face' case shows the limit: we can define content relative to behaviour, but we cannot verify the animal's qualitative experience. The spec protects you legally, not metaphysically.

  Third, it cannot stop Marketing from lying. You can document the divergence between 'yield' and 'welfare', but if leadership chooses profit over precision, the procedure only ensures you have recorded your objection. It shifts liability; it does not remove it.

  Finally, regarding the 'UNSETTLED' flag: Philosophy offers no final answer on ML content yet. When the procedure tells you to pick one definition, you are making a pragmatic choice, not discovering a fact. Own that choice in your documentation. Do not pretend the theory resolves the ambiguity; use the theory to expose it.
