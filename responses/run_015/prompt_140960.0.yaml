prompt: |-
  I'm about eight months into a conversion master's in archaeology (my first degree was in philosophy, so I keep annoying the dig-side people by asking what everything means), and there's a habit in the literature that I can't work out whether to be impressed or appalled by. The same writers who'll infer, from grave goods in a Neolithic burial, that the community definately had some belief about an afterlife — a belief claim, not just a behaviour claim — will insist in the next chapter that belief is invisible in the archaeological record, that you can't get from pots to thoughts, and that when they can't work out what an object was for they'll file it under "ritual", and then turn around and use that filing as positive evidence that there was a religious institution on site. And there's the slogan everyone repeats at conferences, that absence of evidence isn't evidence of absence, which gets wheeled out to defend one inference and quietly dropped when the arguement is "no palaces, no writing, so no state". My supervisor says this is just ordinary evidential caution and I say isn't absence of evidence simply evidence of absence, that's more or less what Bayes' theorem gives you, and she says I'm being crude about it, and I genuinely can't tell whether she's right.

  So what I want is the implicit epistemology of the whole thing reconstructed. Does the practice, as it actually stands, presuppose a causal or trace-based theory of evidence, where the only legitimate move is from an effect back to its cause, so that beliefs as such are out of reach and only the behaviour that leaves traces is in reach? Or does it only presuppose something thinner — that detection and preservation probabilities in real sites are usually so low that absence inferences aren't licensed — something a Bayesian, an error-statistician worried about underpowered tests, and an inference-to-the-best-explanation person could each sign up to for quite different reasons? And where does the "ritual" bucket sit in all this: is calling a functionally unexplained object ritual strictly circular in a way that matters, or is it just a labelling convention that does no real evidential work? I especially want to know which of these commitments the practice strictly needs and which it merely gets along with, because I suspect several quite different theories of evidence would all generate exactly the caution I'm being told to have.

  Here's the bit I'd like you to push on. A couple of us on the course drafted what we call the Parity Protocol, and I want to know whether adopting it would wreck the discipline or just make it honest. It says: (1) any inference from absence has to come with an explicit detection model — if X had been true, what would we expect to find, how likely is it to survive, how likely is it to be recognised and published — with numbers you'd actually defend; (2) the word "ritual" is banned from reports except where there's independent positive evidence, and unassigned objects get reported as "function unknown"; (3) every belief-ascription has to be tagged with what would falsify it, on pain of not counting as a claim at all. Is the protocol coherent, does any clause of it collapse into a scepticism nobody could work under, and which ordinary archaeological inferences would actually fall over if you imposed it? And if you were writing it up: would you say the discipline needs a thick, dispositional, behaviour-linked notion of belief to make its practice work, or can it get everything it wants with a deflationary one? Please write in British English, and sorry if this is a bit of a ramble — I've been staring at it all week.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** Conversion Master's student in Archaeology (8 months in). First degree in Philosophy.
      *   **Tone/Style:** Intellectually rigorous, slightly frustrated, analytically minded, familiar with epistemological terminology (Bayes, IBE, trace theory, deflationary belief), British English.
      *   **Core Problem:** Perceived inconsistency in archaeological epistemology regarding evidence, absence, belief ascription, and the use of the term "ritual."
      *   **Specific Questions:**
          1.  Reconstruct the implicit epistemology of current archaeological practice (Trace-based vs. Probabilistic/Preservation-based).
          2.  Evaluate the "Parity Protocol" (3 clauses: detection models for absence, ban on "ritual" without positive evidence, falsifiability tags for belief).
          3.  Determine if the Protocol wrecks the discipline or makes it honest.
          4.  Address the nature of "belief" needed (thick/dispositional vs. deflationary).
      *   **Constraint:** Write in British English.

  2.  **Deconstruct the Archaeological Epistemology (The "Implicit" Theory):**
      *   *The Tension:* The user identifies a contradiction: inferring belief from grave goods vs. claiming belief is invisible.
      *   *The Reality:* Archaeology operates on a *pragmatic hybrid*. It's not strictly trace-based (which would be too sceptical) nor purely Bayesian (too data-hungry). It's mostly *Inference to the Best Explanation (IBE)* constrained by *Uniformitarianism* and *Taphonomy*.
      *   *Absence of Evidence:* The slogan "absence of evidence is not evidence of absence" is a heuristic for *preservation bias*, not a logical absolute. The supervisor is right that the student is being "crude" (logically valid but practically blind to taphonomic filters), but the student is right that Bayes allows absence to shift probabilities *if* the search was sufficient.
      *   *The "Ritual" Bucket:* This is the classic "residual category" problem. If it's not utilitarian, it's ritual. This *is* circular if "ritual" implies specific cognitive states, but functional if it just means "non-subsistence behaviour."
      *   *Conclusion on Epistemology:* It's a *causal-trace theory* moderated by *probabilistic taphonomy*. It presupposes that material culture is an effect of human behaviour (cause), but acknowledges the signal-to-noise ratio is terrible.

  3.  **Evaluate the "Parity Protocol":**
      *   *Clause 1 (Detection Models for Absence):*
          *   *Pros:* Forces rigour. Aligns with Bayesian thinking.
          *   *Cons:* Often impossible to quantify numbers ("how likely to be recognised"). Might paralyse interpretation.
          *   *Verdict:* Coherent in principle, but practically onerous. Needs softening (qualitative detection models).
      *   *Clause 2 (Ban "Ritual"):*
          *   *Pros:* Stops circular reasoning.
          *   *Cons:* "Ritual" is a useful shorthand for "patterned, non-utilitarian repetition." Banning it might just shift the problem to "symbolic" or "ceremonial." "Function unknown" is honest but dull.
          *   *Verdict:* Radical. Would clean up writing but might hinder communication. The circularity matters *only* if "ritual" is used as an explanation rather than a description.
      *   *Clause 3 (Falsifiability for Belief):*
          *   *Pros:* Popperian rigour. Stops unfalsifiable psycho-analysis of the dead.
          *   *Cons:* Cognitive states are notoriously hard to falsify materially. Might lead to behaviourism only.
          *   *Verdict:* The hardest clause. Risks collapsing into scepticism. Needs a "thick" notion of belief to work.
      *   *Overall:* It wouldn't wreck the discipline, but it would slow it down significantly. It makes it "honest" but perhaps less generative.

  4.  **Address the Nature of "Belief":**
      *   *Deflationary:* Belief = disposition to behave. Archaeology can access this (e.g., "they believed in ancestors" = "they behaved towards remains as if they were ancestors").
      *   *Thick/Dispositional:* Belief = internal cognitive state. Archaeology cannot access this directly.
      *   *Recommendation:* Archaeology *needs* the deflationary/behaviour-linked notion to survive epistemologically. If they claim access to internal qualia, they are overstepping. The "Parity Protocol" pushes them toward this deflationary view.

  5.  **Drafting the Response (incorporating British English and Tone):**
      *   *Tone:* Collegial, respectful of the philosophical background, acknowledging the frustration (it's a common rite of passage), but defending the pragmatism of the discipline where warranted.
