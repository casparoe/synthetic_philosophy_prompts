          5.  The Ontology of Belief: Deflationary vs. Thick.
          6.  Conclusion: Will it wreck the discipline?

      *   *Key Arguments to Refine:*
          *   *Bayes vs. Supervisor:* The supervisor is talking about *taphonomic filters* (the probability of preservation is often near zero), not logical necessity. Bayes requires $P(E|H)$ and $P(E|\neg H)$. In archaeology, $P(E|H)$ is often unknown because of degradation.
          *   *Ritual:* It's a "wastebasket taxon." It's circular if used as an *explanation* ("it's there because it's ritual") but descriptive if used as a *classification* ("it's non-utilitarian").
          *   *Protocol:* Clause 1 is good practice (already happening in survey archaeology). Clause 2 is semantic policing (useful but maybe overkill). Clause 3 is the killer (forces operationalisation of belief).
          *   *Belief:* Archaeology must stick to "practiced belief" (orthopraxy) rather than "internal creed" (orthodoxy).

  6.  **Refining the British English:**
      *   Use "s" instead of "z" in organisation/realise (though Oxford spelling varies, standard British academic usually prefers 's').
