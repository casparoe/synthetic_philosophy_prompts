      *   Tone: Slightly more understated, avoiding hyperbole.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about whether the practice *needs* a thick or deflationary notion of belief?
      *   *Correction:* Ensure I explicitly state that the *practice* relies on a deflationary one but the *literature* often smuggles in a thick one. The Protocol forces the practice to match the epistemology.
      *   *Check:* Did I address the "absence of evidence" Bayes point?
      *   *Correction:* Clarify that Bayes works *if* you have priors on preservation. The supervisor is worried the student assumes preservation probability is high.
      *   *Check:* Is the tone appropriate for a Master's student talking to an AI?
      *   *Correction:* Keep it sophisticated. Don't dumb it down. Treat them as a peer in philosophy applying it to archaeology.

  8.  **Final Polish:** Check against the "Parity Protocol" specifics. Ensure the verdict is clear: It wouldn't wreck the discipline, but it would force a shift from speculative narrative to constrained modelling.

  *(Self-Correction Note on "Ritual"):* I need to be careful not to say "ritual" is useless. It describes a *type* of action. The problem is using it as a *cause*. I should distinguish between ritual as a descriptor of form vs. ritual as an explanation of function.

  *(Self-Correction Note on Bayes):* The student says "absence of evidence is evidence of absence... that's more or less what Bayes' theorem gives you." Technically, yes, if $P(E|H) > P(E|\neg H)$. If $P(E|H)$ is low (preservation bias), then absence tells you little. I need to explain that the supervisor is arguing about the likelihood ratio, not the logic.

  9.  **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  Dear Colleague,

  First, take heart: you are not mad, and you are not merely being an annoying philosopher (though I suspect the dig-side people will always see it that way). You have stumbled upon the central epistemological tension of post-processual archaeology, which is that it often wants to have its cake (materialist rigour) and eat it too (cognitive access). Your frustration is the friction between the discipline's *rhetoric* of caution and its *practice* of interpretation.

  Let us reconstruct the implicit epistemology, assess your Parity Protocol, and determine whether adopting it would bring about a productive crisis or a paralysing one.

  ### 1. The Implicit Epistemology: Trace, Probability, and the 'Ritual' Bucket

  You ask whether the practice presupposes a causal/trace theory or a thinner probabilistic one. The honest answer is that the literature oscillates between them depending on whether the author is defending a claim or making one.

  **The Trace Theory (The Official Stance)**
  Officially, archaeology operates on a **trace-based theory of evidence**. Material culture is an effect; human behaviour is the cause. Because the chain of transmission (deposition, taphonomy, discovery, interpretation) is lossy, we can only securely infer the behaviour that left the trace, not the mental state that prompted the behaviour. This is why your supervisors insist belief is "invisible." Strictly speaking, they are correct: a pot is a trace of potting, not a trace of thinking.

  **The Probabilistic Reality (The Working Stance)**
  However, in practice, archaeologists are **Inference to the Best Explanation (IBE)** practitioners who rely on uniformitarian assumptions. When they infer an afterlife belief from grave goods, they are arguing: *The hypothesis that these people believed in an afterlife explains the pattern of deposition better than the hypothesis that they were merely dumping rubbish.*
  This is where your Bayesian intuition clashes with your supervisor's caution. You are correct that, formally, absence of evidence *is* evidence of absence (it lowers the posterior probability). Your supervisor is not disputing the logic; she is disputing the **likelihood ratios**.
  In archaeology, $P(Evidence | Hypothesis)$ is often vanishingly small due to preservation bias. If the probability of a wooden palace surviving 3,000 years is 0.01, then finding no palace tells you almost nothing about whether one existed. The slogan "absence of evidence is not evidence of absence" is a clumsy heuristic for "the detection probability is too low to update the prior significantly." When they drop the slogan to argue "no writing, no state," they are implicitly claiming the detection probability for writing (on clay or stone) is high enough to license the inference. It is inconsistent, but it is not always illogical; it is often just an unspoken assessment of taphonomic filters.

  **The 'Ritual' Category**
  Regarding the "ritual" bucket: this is a **residual category**. In the epistemology of the field, "ritual" functions as a label for *patterned behaviour that lacks an obvious utilitarian function*.
  *   **Is it circular?** Yes, if "ritual" is used as an *explanation*. (e.g., "Why is this pot here?" "Because it's ritual." "How do you know it's ritual?" "Because it's not useful.")
  *   **Does it matter?** It matters if the term smuggles in cognitive claims (priests, gods, dogma) without evidence. If "ritual" simply means "non-subsistence repetitive action," it is a valid descriptive category. The sin occurs when the description is upgraded to an institution ("there was a religious hierarchy") without intermediate evidence.

  ### 2. Assessing the Parity Protocol

  Your draft protocol is essentially an attempt to force archaeological practice to align with its own stated epistemology. Here is how it holds up under scrutiny.

  **Clause 1: Explicit Detection Models for Absence**
  *   *Coherence:* Highly coherent. This is essentially asking for a formalisation of the taphonomic filter.
  *   *Impact:* This would not wreck the discipline; in fact, survey archaeology and landscape archaeology already do this (using predictive modelling). It would, however, wreck a great deal of *narrative* archaeology. Many claims about "lack of social stratification" or "peaceful societies" rest on unquantified assumptions about what *should* have survived.
  *   *Verdict:* Adoptable, provided "numbers you'd actually defend" allows for qualitative ranges (e.g., "low preservation potential") rather than demanding false precision.

  **Clause 2: Ban 'Ritual' without Independent Positive Evidence**
  *   *Coherence:* Coherent, but semantically risky.
  *   *Impact:* This would force a shift in vocabulary. Objects would be "function unknown" or "non-utilitarian." This is actually healthier. It stops the word "ritual" from doing evidential heavy lifting. However, you must define "independent positive evidence." If you require text or iconography to prove ritual, you ban the study of ritual in pre-literate societies entirely.
  *   *Verdict:* Modify to: "'Ritual' may only be used to describe *pattern*, not *function*, unless corroborated by contextual clustering that rules out random deposition." This stops the circularity without imposing a literate bias.

  **Clause 3: Falsifiability Tags for Belief Ascription**
  *   *Coherence:* This is the most dangerous clause for the discipline, philosophically speaking.
  *   *Impact:* If you demand strict falsifiability for belief claims, you risk collapsing into **behaviourism**. What materially falsifies "they believed in ancestors"? If the answer is "nothing, because any material can be interpreted as ancestor veneration," then the claim is unfalsifiable and, by your protocol, banned.
  *   *The Problem:* Cognitive states are not directly observable. To make this work, you must operationalise belief as *disposition*. "They believed in ancestors" becomes "They behaved towards remains in a manner consistent with ongoing social agency."
  *   *Verdict:* This clause needs the most work. If enforced strictly as written, it might silence all cognitive archaeology. If interpreted as "what material pattern would contradict this behavioural inference?", it is viable.

  ### 3. Will it Wreck the Discipline?

  No. It would not wreck archaeology; it would wreck *speculation*.
  There is a difference. A significant portion of popular archaeological literature (and some academic work) relies on "just-so stories" where the epistemological gaps are bridged by narrative flair. Your Protocol would force those gaps to remain visible.
  *   **The Casualty:** Grand narratives about Neolithic cosmology based on three ambiguous figurines would vanish.
  *   **The Gain:** Robust, mid-range theories about social practice would remain. The discipline would become less like theology and more like forensic science.

  ### 4. The Ontology of Belief: Thick vs. Deflationary

  You ask whether the discipline needs a thick, dispositional notion of belief or can survive on a deflationary one.
  **It must adopt the deflationary one to survive epistemological scrutiny.**

  *   **Thick Belief:** Internal, propositional, cognitive states (e.g., "He held the creed that the soul survives death"). Archaeology cannot access this. Inferring this is always a leap of faith (often literally).
  *   **Deflationary/Dispositional Belief:** Public, enacted commitment (e.g., "He acted towards the corpse as if it retained personhood"). Archaeology *can* access this, because action leaves traces.

  The current literature often conflates the two. It observes the disposition (burial rite) and infers the thick belief (afterlife theology). Your Protocol forces the writer to stop at the disposition unless they can bridge the gap.
  If you adopt a **praxeological** view of belief (belief is what people *do*, not just what they *think*), the Parity Protocol becomes workable. "Belief" is redefined as "committed practice." This satisfies the philosopher (it's falsifiable behaviour) and the archaeologist (it leaves traces).

  ### Conclusion

  Your supervisor calls you "crude" because you are applying logical rigour to a discipline built on probabilistic fragments. She is right that you cannot treat archaeological absence like a logical null set; it is a noisy signal. But you are right that the field's inconsistency is intellectually dishonest.

  The Parity Protocol is a sound piece of methodological hygiene.
  1.  **Keep Clause 1**, but allow qualitative probabilities.
  2.  **Refine Clause 2**, to ensure you don't accidentally ban the study of non-literate religion by demanding literate standards of proof.
  3.  **Reframe Clause 3**, to target *behavioural commitments* rather than *internal states*.

  If you impose this, you will not destroy archaeology. You will simply force it to admit when it is guessing. That will make the literature shorter, duller, and infinitely more trustworthy. Given your background, I suspect you will find that a worthy trade.

  Yours,

  A Sympathetic Interlocutor
