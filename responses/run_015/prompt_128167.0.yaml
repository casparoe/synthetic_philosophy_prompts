      *   *The Psychologist's Stance:* "Thinking" = amodal, abstract representation. Language is a separate module. To prove language affects thought, you must isolate thought from language (nonverbal tasks). This is a *modularity* assumption.
      *   *The Linguist's Stance:* "Thinking" = often linguistically mediated or scaffolded. Language provides habitual categories that make certain distinctions *easier* or *more salient*. You can't strip language away because that's where the effect lives. This is a *scaffolding/habit* assumption.
      *   *The "Slide":* The user notes the shift from "good at tracking" (performance) to "different conception of knowledge" (ontology). This is the *Competence vs. Performance* gap, or *Processing vs. Representation*.
      *   *The Real Issue:* It's a **Category Error regarding "Thought."**
          *   Psychologists often define thought as *underlying representation*.
          *   Linguists/Whorfians often define thought as *online processing/attention*.
      *   *The Verbal Dispute:* Yes, the user is right. It is partly verbal. "Thought" is doing too much work. Is it what you *can* think? What you *habitually* think? What you think *under load*?

  3.  **Identify the Empirical Core (Buried Question):**
      *   If it's just verbal, there's no progress. But there *is* a buried empirical question.
      *   It's not "Does language determine thought?" (Too vague).
      *   It's "Under what cognitive loads does linguistic coding become necessary for discrimination?" or "Does linguistic habituation alter perceptual weighting permanently or only during activation?"
      *   *Key Distinction:* **Transient Activation vs. Permanent Restructuring.**
          *   *Transient:* Using words helps you do the task *now* (inner speech).
          *   *Permanent:* Speaking Language X changes your neural wiring so you see colors/shapes differently *even without words*.
      *   Most Whorfian findings are the former (transient). The claim is often sold as the latter (permanent).

  4.  **Formulate the Diagnosis:**
      *   **Name the Disagreement:** It's a **Mechanism Mismatch** disguised as an Empirical Dispute.
      *   **Specifics:**
          1.  *Locus of Effect:* Is it in the *encoding* (perception) or the *retrieval/decision* (memory/judgment)?
          2.  *Role of Language:* Is language the *architect* (shaping the structure) or the *tool* (used during the task)?
          3.  *The "Nonverbal" Trap:* The psychologist's demand for a "nonverbal task" assumes language can be fully suppressed. The linguist knows inner speech is hard to suppress.
      *   **The "Slide":** This is the **Inference Gap**. Moving from "faster reaction time on a matching task" to "different conception of reality."

  5.  **Define Progress (What would actually settle it?):**
      *   Stop asking "Is Whorf right?"
