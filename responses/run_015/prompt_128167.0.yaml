          3.  Explain the "Nonverbal" impasse.
          4.  Propose the specific empirical questions that matter.
          5.  Suggest the path to progress (Interference, Training, Neural).
      *   *Refining the "Diagnosis":* Call it a **Level-of-Analysis Conflict**. The psychologist is looking for *competence* (what is possible), the linguist is describing *performance* (what is habitual).
      *   *Refining the "Progress":* Focus on **Verbal Interference**. This is the gold standard for distinguishing "language as thought" vs. "language as tool."

