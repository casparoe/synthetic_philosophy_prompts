      *   *Methodological Shift:*
          1.  **Interference Paradigms:** Don't just remove words; *add* verbal interference (shadowing) during the nonverbal task. If the effect disappears under verbal load, it's a tool, not a structure.
          2.  **Developmental/Longitudinal:** Teach adults new grammatical categories. Does it change performance? (Training studies).
          3.  **Neural Imaging:** Are the same brain areas active for the "nonverbal" task in speakers of different languages? (e.g., language areas lighting up during color discrimination).
      *   **Theoretical Shift:** Move from "Worldview" to "Cognitive Habit." Abandon the mystical "incommensurability" claim.

