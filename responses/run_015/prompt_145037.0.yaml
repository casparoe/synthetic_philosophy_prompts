      *   *Section 2: Coherence of Asymmetry.* Connect error treatment to decision weight. The Inside track is held to a higher standard of *truth* (conceptual) because it is given the higher burden of *action*. The Outside track is allowed to be "wrong" statistically because it isn't trusted to drive the car. It's coherent if the goal is *intervention*, incoherent if the goal is *accuracy*.
      *   *Section 3: The Modest Stance.* What changes? "Model Pluralism." Both are heuristics. Error is inevitable. Decision-making becomes a weighted ensemble, not a dictatorship of the causal narrative.
