answer: |-
  This bifurcated practice reveals a deep-seated tension in modern policy epistemology: the conflict between **predictive accuracy** (knowing *what* will happen) and **causal intelligibility** (knowing *why* it happens). The institute's protocol presupposes that policy is not merely about forecasting the future, but about *intervening* in it. Consequently, it privileges knowledge that claims to offer leverage over the system, even at the cost of accuracy.

  Here is a reconstruction of the implicit epistemology, an analysis of its coherence, and a sketch of the alternative "modest" stance.

  ### 1. Implicit Epistemology: Causal Privilege and Hierarchical Incommensurability

  The institute treats the two tracks not as competing methods for the same goal, but as distinct ontological categories of knowledge.

  *   **The Outside Track (Actuarial/Statistical):** This is treated as **nomothetic** knowledge—knowledge of regularities. When it fails, it is a "calibration error." This implies the track is an instrument, like a barometer. A barometer does not "understand" the storm; it merely registers pressure. If it reads wrong, you adjust the mechanism (weights). It is viewed as **opaque cognition**: it yields a number without a story.
  *   **The Inside Track (Mechanistic/Expert):** This is treated as **causal** knowledge—knowledge of powers and mechanisms. When it fails, it is a "conceptual failure." This implies the track is a *theory*. If a theory fails, the understanding of the system is flawed. It is viewed as **transparent cognition**: it yields a story that justifies action.

  **Relationship:** The relationship is **hierarchically incommensurable**.
  *   *Incommensurable:* They are judged by different standards (calibration vs. falsification). One is a tool, the other is a mind.
  *   *Hierarchical:* The Inside track sits above the Outside track. The Outside track provides boundary conditions or sanity checks, but the Inside track provides the *rationale for action*.

  **View of Epistemic Authority:** Authority is derived from **explanatory depth**, not predictive success. The institute operates on the assumption that you cannot responsibly act on a correlation (Outside); you can only act on a mechanism (Inside). Therefore, the expert who can articulate a causal chain holds higher epistemic authority than the algorithm that accurately predicts the outcome, because only the former offers a "handle" for policy intervention.

  ### 2. Coherence of the Asymmetry

  Is the asymmetry in error-attribution coherent with the asymmetry in decision-weight?

  **Yes, instrumentally.**
  If the goal of the institute is **control** rather than **prophecy**, the asymmetry is logically consistent.
  *   **Decision Weight:** Strategic recommendations require a narrative to justify resource allocation, legal authority, or military action. A statistical probability ("70% chance of conflict") cannot be legislated or commanded. A causal model ("Conflict is likely due to resource scarcity, so we will send aid") can. Thus, the Inside track must carry the decision weight because it is the only track that produces *actionable* syntax.
  *   **Error Attribution:** Because the Inside track is the basis for intervention, its errors are more dangerous. A calibration error in the Outside track is a nuisance; a conceptual error in the Inside track is a strategic catastrophe (intervening on the wrong variable). Therefore, Inside errors must be treated as fundamental falsifications requiring model revision, whereas Outside errors are mere noise to be smoothed over.

  **No, pragmatically.**
  If the goal is **outcome optimization**, the asymmetry is incoherent and dangerous.
  *   By insulating the Inside track from the "calibration" treatment, the institute protects expert ego and narrative consistency at the expense of accuracy. It encourages experts to double down on complex causal stories rather than admitting uncertainty.
  *   By denying the Inside track the status of a "tool" that can be weighted, the institute prevents the aggregation of wisdom. It forces a binary choice: either the expert's model is right, or it is broken. It does not allow for the expert to be "partially right" in a statistical sense.
  *   This creates a **hubris trap**: The track with lower accuracy is given higher authority, while the track with higher accuracy is demoted to a mere gauge. This is the institutionalization of the "Inside View Bias" (Kahneman & Lovallo), where planners ignore base rates in favor of specific scenarios.

  ### 3. Adopting a Uniformly Modest Stance

  To adopt a uniformly modest stance is to accept **epistemic opacity**: the recognition that the social world is too complex for any model (statistical or causal) to fully capture. Both tracks are viewed as fallible maps, not territories.

  If the institute adopted this stance, the following changes would be necessary:

  **A. Symmetrizing Error Attribution**
  *   **Inside Track:** Expert misses would no longer automatically trigger a "conceptual revision." Sometimes, the expert's model was sound, but the world is stochastic. Errors would be treated partly as **variance**, not just falsification. This reduces the pressure on experts to fabricate post-hoc rationalizations for every miss.
  *   **Outside Track:** Statistical misses would not just be "re-weighted." Persistent failures in base rates would trigger a search for **structural breaks** (conceptual changes in the data generation process), acknowledging that numbers also rely on hidden assumptions about stability.

  **B. Hybridizing Decision Weight**
  *   **The "Base-Rate Veto":** Strategic recommendations from the Inside track would be subject to a constraint: they cannot violate the Outside track's confidence intervals without a extraordinarily high burden of proof. If the statistical model says a policy fails 90% of the time, the causal model must explain *why this time is different* with rigorous evidence, not just narrative plausibility.
  *   **Ensemble Decision-Making:** Recommendations would not be drawn "almost exclusively" from the Inside track. Instead, policy would be framed as: "Our causal model suggests X, but our statistical model suggests Y. We will proceed with X, but with monitoring triggers set by Y."

  **C. Shifting the Language of Authority**
  *   **From "Understanding" to "Navigation":** The institute would stop claiming to "understand" the system (Inside) and start claiming to "navigate" it (Both).
  *   **From "Expert" to "Sensor":** Experts would be viewed not as oracles of truth, but as high-dimensional sensors whose outputs need to be fused with other sensors (statistics).
  *   **Acknowledging Residual Uncertainty:** Both tracks would be required to output a measure of "model uncertainty," not just "parameter uncertainty." This admits that the model itself might be the wrong kind of map for the terrain.

  ### Conclusion

  The current bifurcated practice presupposes a **Rationalist Epistemology**: it believes the world is ultimately intelligible through causal mechanisms, and that statistical regularities are merely shadows of that deeper truth. It treats the Inside track as the "mind" of the institution and the Outside track as its "reflexes."

  A uniformly modest stance would presuppose a **Pragmatist or Cybernetic Epistemology**: it views the world as partially opaque and treats both tracks as feedback loops. In this view, accuracy is the primary metric of authority, and explanation is valued only insofar as it improves future accuracy. The shift would move the institute from a posture of **mastery** (correcting concepts to control the system) to a posture of **resilience** (adjusting weights and models to survive the system).
