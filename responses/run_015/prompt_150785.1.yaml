      *   **Core Complaint:** The "consciousness is a broadcast" analogy (Slack channel, theater spotlight) is doing too much work without being examined. It's being used to support contradictory conclusions (GWT: access = phenomenality vs. Block: access $\neq$ phenomenality).
      *   **Task:**
          1.  Create a correspondence table (Sender, Channel, Message, Subscribers, Bandwidth, Reader).
          2.  Identify where the mapping breaks.
          3.  Address two specific "sneaky work" points (Emitter vs. Receiver-driven, Publicity vs. Phenomenality).
          4.  Engage with three specific stress-test cases (Narrowcast, 3am Post, DMs Only).
