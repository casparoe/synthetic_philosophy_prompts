prompt: |-
  I am preparing a two-page dissertation prospectus for a philosophy-of-science fellowship, and I need help sharpening a half-formed idea into a rigorous, tractable proposal. The topic is the species problem in biology, but I want to avoid the standard framing—namely, the debate over whether the Biological Species Concept, the Phylogenetic Species Concept, or some pluralist accommodation best captures an underlying ontological kind. Instead, I want to reframe the problem around explanatory and predictive stability: specifically, whether treating a population as belonging to a single species is justified not by shared essence or monophyletic origin, but by the robustness of predictions that depend on that grouping across evolutionary, ecological, and developmental time scales. The central question should be precise: under what conditions does taxonomic unification license successful cross-scale predictions, and when does revision of species boundaries improve predictive accuracy in one domain while degrading it in another? The proposal should state this question clearly, explain why existing ontological answers leave it open—particularly because they treat predictive success as a downstream consequence rather than a regulative criterion—outline an approach (for instance, comparing paired case studies in which taxonomic revision altered predictive outcomes in macroevolutionary modeling versus community ecology), specify what would count as genuine progress versus failure, and provide an honest scope assessment for a twelve-month project. I do not need citations, bibliographies, or reading lists; I will supply those myself. Please write the proposal in a formal, polished style appropriate for a fellowship committee, and avoid inventing specific references or attributing claims to named authors.
