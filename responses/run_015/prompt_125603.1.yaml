answer: |-
  **Project Title:** Predictive Stability and Taxonomic Practice: A Pragmatic Reframing of the Species Problem

  **Statement of the Problem and Central Question**
  The "species problem" in the philosophy of biology has traditionally been framed as an ontological dispute. Competing accounts—whether grounded in reproductive isolation, phylogenetic ancestry, or ecological niche—seek to identify the necessary and sufficient conditions that make a species a natural kind. This dissertation project proposes a departure from this metaphysical impasse. Rather than asking what a species *is*, this project asks what treating a population as a single species *does*. Specifically, it investigates the relationship between taxonomic classification and the robustness of scientific inference.

  The central research question is precise: Under what conditions does taxonomic unification license successful cross-scale predictions, and when does revision of species boundaries improve predictive accuracy in one domain while degrading it in another? By shifting the focus from ontological fidelity to explanatory and predictive stability, this project treats species concepts not as mirrors of nature, but as regulatory tools that stabilize inference across evolutionary, ecological, and developmental time scales.

  **Critique of Existing Approaches**
  Current philosophical literature largely treats predictive success as a downstream consequence of correct ontological categorization. The prevailing assumption is that if a taxonomist correctly identifies the "real" species boundaries (according to the chosen concept), predictive power in ecology and evolution will follow naturally. This project argues that this assumption is untenable. In practice, different scientific aims require different grain sizes of classification. A grouping that maximizes predictive accuracy in macroevolutionary modeling (e.g., regarding speciation rates) may obscure critical variance required for predicting disease transmission in community ecology or developmental outcomes in evo-devo.

  Existing pluralist accounts acknowledge that multiple concepts may coexist, but they often lack a normative framework for adjudicating conflicts when these concepts demand contradictory boundaries. They describe the landscape of disagreement but do not provide criteria for resolving it. By treating predictive stability as a regulative criterion rather than a secondary benefit, this project offers a mechanism for evaluating taxonomic decisions based on their functional consequences. The goal is not to discard ontology, but to subordinate ontological commitment to the pragmatic requirement of cross-scale inferential stability.

  **Methodology and Approach**
  To investigate this question, the project will employ a comparative case study methodology focused on instances of recent taxonomic revision. The analysis will center on paired domains where the same taxonomic group is utilized for distinct predictive ends. For example, the project will examine clades where "splitting" a species based on genetic data (favoring a phylogenetic concept) altered outcomes in biodiversity modeling versus conservation planning.

  The approach involves three steps. First, I will reconstruct the predictive assumptions underlying the original taxonomic classification. Second, I will analyze the impact of the revision on predictive accuracy in two divergent fields: typically, macroevolutionary modeling (long-term, lineage-based) and community ecology (short-term, interaction-based). Third, I will map the trade-offs. Does the revision reduce noise in phylogenetic signal while increasing variance in ecological interaction networks?

  By isolating these trade-offs, the project aims to identify "zones of stability"—taxonomic boundaries that minimize predictive degradation across multiple domains—and "zones of friction," where optimization in one domain necessitates error in another. This analysis will be conceptual and model-based, relying on published empirical studies and modeling papers rather than primary data collection.

  **Criteria for Progress and Success**
  Genuine progress in this project will be defined by the articulation of a normative framework for taxonomic decision-making. Success is not defined by solving the species problem definitively, but by demonstrating that predictive stability is a measurable and philosophically robust metric for evaluating species concepts.

  A successful outcome will yield a typology of predictive trade-offs. For instance, the project might demonstrate that phylogenetic species concepts consistently enhance predictive power in historical reconstructions but systematically degrade predictive models of ecosystem resilience. Conversely, failure would result if the analysis reveals that predictive stability is too context-dependent to generalize, or if "prediction" proves too heterogeneous a metric to serve as a unifying standard. The deliverable is a set of criteria that allows biologists and philosophers to justify taxonomic boundaries based on the specific inferential goals of the inquiry, moving beyond the stalemate of competing essentialisms.

  **Scope and Feasibility Assessment**
  This project is designed for a twelve-month fellowship period. The scope is intentionally limited to ensure tractability. I will not attempt a comprehensive survey of all species concepts, nor will I engage in original fieldwork or computational modeling. Instead, the focus is restricted to the philosophical analysis of existing case studies where taxonomic revision has already occurred and its consequences are documented.

  The twelve-month timeline is divided into three phases. Months one through four will be dedicated to selecting and analyzing three to four high-profile case studies of taxonomic revision. Months five through eight will focus on developing the comparative framework for evaluating predictive stability across these cases. The final four months will be devoted to synthesizing the findings into a coherent normative account and drafting the dissertation chapters.

  The primary risk lies in the heterogeneity of "prediction" across biological sub-disciplines. To mitigate this, the project will operationalize predictive success narrowly, focusing on quantitative model outputs (e.g., error rates in trait reconstruction or population viability analysis) rather than qualitative explanatory power. This constraint ensures that the comparison remains rigorous and that the project remains completable within the fellowship year. The result will be a focused, high-impact contribution to the philosophy of biology that bridges the gap between metaphysical debate and scientific practice.
