answer: |-
  This is an excellent puzzle, and your intuition that the behavioral economic account feels like a redescription is philosophically well-founded. The tension you are identifying lies at the fault line between *descriptive psychology* (how choices are generated) and *normative agency* (what constitutes a failure of the agent).

  To give you the worked-through answer you need: The hyperbolic discounting account does **not** dissolve the traditional akrasia puzzle; it **relocates** it. It shifts the problem from the metaphysics of synchronic action (how can I act against my judgment *now*?) to the metaphysics of diachronic agency (why does my past self have authority over my present self?). However, in doing so, it risks equivocation on the term "preference," which allows it to claim a dissolution that isn't truly earned.

  Here is the breakdown of why the dissolution fails and where the puzzle relocates.

  ### 1. The Strong Case for Dissolution (The Economist's View)

  Your friend's argument relies on a specific commitment common in decision theory: **Revealed Preference Theory**. On this view, "preference" is defined operationally by choice. If you choose $A$ over $B$ at time $t$, you *prefer* $A$ to $B$ at time $t$.

  If we accept this, the traditional Davidsonian model of akrasia (acting against one's all-things-considered judgment) collapses. Davidson requires a synchronic split: at $t$, I judge $A$ best, but I desire $B$ more, and I do $B$. The economist argues this split is impossible. At $t$, if I do $B$, my "preference function" has simply updated due to the hyperbolic curve. The cost of effort is now discounted less heavily than the future reward of completion. Therefore, at $t$, $B$ *is* the preferred option.

  **The Strongest Version of this Argument:**
  This view, championed by George Ainslie under the label "picoeconomics," treats the agent not as a unified entity but as a succession of temporal selves. Akrasia, traditionally understood, requires a unified agent who is internally inconsistent. If the agent is a sequence of selves, there is no single agent acting against their own judgment. There is only Self-1 (planning) whose preferences differ from Self-2 (acting). Since Self-2 is acting on Self-2's strongest preference, Self-2 is locally rational.

  On this account, the "feeling" of failure is just the emotional residue of Self-2 realizing they have compromised the interests of Self-1 (and Self-3, Self-4, etc.). It is a conflict of interest between temporal parts, not a failure of will within a whole.

  ### 2. The Relocation Counter-Claim (The Philosopher's Pushback)

  Your suspicion that this is a redescription stems from the fact that the economic model changes the subject from **normative authority** to **causal explanation**.

  The traditional puzzle of akrasia is not merely "Why did the behavior change?" It is "Why was this change a *failure*?" The economic model explains the mechanism of the shift (the discounting curve), but it cannot explain the normativity of the regret without smuggling in philosophical assumptions.

  **The Equivocation on "Preference":**
  The dissolution argument works only if we equivocate between two senses of preference:
  1.  **Motivational Strength:** The causal force driving action at $t$.
  2.  **Evaluative Judgment:** The endorsement of a course of action as good or worthwhile.

  In your case, at 9:00 AM, you have a high *motivational strength* to check email (low cost, immediate dopamine). But you likely retain the *evaluative judgment* that writing the chapter is better. The economist says, "You preferred email." You say, "No, I wanted email, but I judged writing better."

  If the economist insists that "preference" just means "what won," they have defined akrasia out of existence by fiat. They have said: "Whatever you do is what you preferred, so you never act against your preference." This is tautological. To save the phenomenon of akrasia, we must distinguish between the *urge* that moves you and the *judgment* that guides you. The hyperbolic model explains the urge; it does not explain why the judgment lost, nor why that loss counts as a failure.

  ### 3. The Authority of the Planning Self

  This brings us to the core of your second question: *Should the earlier self's preferences bind the later self?*

  If we accept the economist's "succession of selves" model, the answer is **no**. Self-2 is a sovereign agent. For Self-1 to bind Self-2 would be a violation of Self-2's autonomy. This leads to a Parfitian reduction of agency: if we are just a bundle of temporal stages, "rationality" is just maximizing satisfaction at each stage.

  However, this destroys the possibility of long-term projects (like a dissertation). To be a PhD student is to be a **diachronic agent**. This is where Michael Bratman's Planning Theory of Intention is crucial. Bratman argues that plans are not just predictions or strong desires; they are **normative constraints** we impose on our future selves to ensure cross-temporal coherence.

  **The Strongest Version of the Relocation Argument:**
  When you make a plan at $t_1$ (write hard chapter in morning), you are not just predicting your behavior; you are creating a reason for $t_2$ to act. The "failure" at $t_2$ is not that you acted against a desire (you didn't); it's that you violated a **normative commitment** that constitutes your agency over time.

  The hyperbolic discounting account explains *why* the pressure to violate the commitment arose. It does not explain *why* violating the commitment counts as irrational or a failure of will. To say it is a failure, we must assume that the agent is a persisting entity whose rationality includes **diachronic consistency**.

  Therefore, the puzzle relocates from "How can I act against my judgment?" to "What gives the planning self the authority to constrain the acting self?" If you answer "Nothing," you dissolve akrasia but also dissolve agency. If you answer "The planning self represents the agent's true identity," you preserve akrasia but must defend a robust metaphysics of the persisting self.

  ### 4. The "Real Preferences" Trap

  You asked whether granting that the "stronger future self's preferences" count as the agent's "real" preferences concedes the point the hyperbolic account wants to deny.

  **Yes, it does.** But the concession is necessary to save the phenomenon of weakness of will.

  The hyperbolic account wants to deny that there is a "real self" distinct from the current motivational state. It wants to say: *You are what you do.*
  The akrasia intuition insists: *You are what you endorse.*

  If we grant that your 9:00 AM judgment ("I should write") is your "real" preference, even though your 9:05 AM motivation ("I'll check email") is stronger, we are making a **hierarchical** claim (à la Frankfurt or Watson). We are saying that some preferences count more than others because they align with your higher-order volitions or your identity as a philosopher.

  **Why this matters:**
  If you accept the hierarchical view, the hyperbolic discounting model becomes merely a **causal story about temptation**, not a **dissolution of irrationality**.
  *   **Economist:** "You weren't irrational; your discount rate changed."
  *   **Philosopher:** "You were irrational because you allowed a transient shift in discount rate to override a stable commitment that defines your agency."

  The "failure" you feel is the recognition that your *local* rationality (maximizing comfort now) undermined your *global* rationality (completing the dissertation). The hyperbolic model explains the local rationality. It cannot account for the global rationality without admitting that the agent is more than the sum of their temporal slices.

  ### 5. Synthesis: Holton and the Will

  Richard Holton's work on *Willpower* offers the precise bridge you need here. Holton argues against the Humean/Economic view that action is always determined by the strongest desire. He posits that **resistance** is a distinct capacity.

  When you procrastinate, it is not simply that the "email preference" became stronger than the "writing preference." It is that you failed to exercise a capacity to **hold fixed** your intention despite the shift in motivational strength.

  *   **The Economic Account:** Preference $A$ (email) > Preference $B$ (writing) at $t_2$. Action follows $A$. No failure.
  *   **The Holton/Philosophical Account:** Intention $B$ was formed at $t_1$. At $t_2$, Preference $A$ spiked. A rational agent has the capacity to sustain Intention $B$ despite Preference $A$. You failed to exercise that capacity.

  On Holton's view, the hyperbolic discounting curve describes the *terrain*, but not the *hiker*. The terrain got steeper (the cost of writing loomed larger), but the failure was in the hiker's legs (the will), not the map.

  ### Conclusion

  To answer your specific questions:

  1.  **Does it dissolve the puzzle?** No. It dissolves the *psychological paradox* (how can I do what I don't want?) by redefining "want." But it creates a *normative vacuum* (why is this action a failure?).
  2.  **Does it relocate the puzzle?** Yes. It moves the problem from the philosophy of action (synchronic consistency) to the metaphysics of agency (diachronic authority). The question becomes: *Are we a series of temporal selves or a persisting agent?*
  3.  **Can the earlier self's preferences count as "real"?** Only if you accept that agency requires diachronic coherence. If you grant this, you concede that the economic model is descriptively useful but normatively incomplete.

  **The Verdict:** Your friend's explanation is causally adequate but normatively deficient. It explains why you *did* procrastinate, but it cannot explain why you *shouldn't have* without implicitly appealing to the very notion of a persisting self that it claims to render unnecessary. The sense of failure you feel is the phenomenological evidence that you are, in fact, a diachronic agent, not a series of economic slices. The akrasia is real because the authority of your planning self is real, and hyperbolic discounting is merely the force you failed to resist.

  You are not wrestling with a puzzle that has been dissolved; you are wrestling with the cost of maintaining agency over time in the face of forces that try to fragment you. That is not a behavioral economics problem; it is the central problem of the philosophy of action.
