answer: |-
  ### Conceptual Dependencies Brainstorm

  To transition karma from religious doctrine to secular philosophical theory, three conceptual prerequisites must be established:

  1.  **Non-Theistic Causality:** Students must accept that moral consequences can operate like natural laws (e.g., gravity) without requiring a lawgiver. If consequences require a judge, karma collapses into divine command theory.
  2.  **Moral Quality as Intrinsic:** Actions must be understood as having intrinsic moral properties that generate outcomes, rather than outcomes being arbitrarily assigned based on external rules. The consequence must be *of* the action, not just *after* the action.
  3.  **Continuity of Agency:** There must be a coherent link between the past actor and the present experiencer. Without this, moral desert fails. In a secular model, this is usually psychological or social continuity, not necessarily metaphysical soul continuity.

  ***

  ### Teaching Plan: Karma as Secular Moral Structure
  **Target Audience:** Undergraduate Reading Group (No background in South Asian Philosophy)
  **Duration:** 50 Minutes
  **Objective:** Introduce karma as a structural claim about moral desert and causality, independent of divine administration or metaphysical rebirth.

  #### I. Moral Desert and the Problem of the Judge (00:00 – 00:10)
  *   **Goal:** Establish the intuition that actions deserve consequences, then isolate the problem of *who* or *what* delivers them.
  *   **Activity:** Brief Socratic dialogue.
      *   Ask: "If someone lies to you, do you feel they *deserve* to lose trust?" (Elicit agreement on desert).
      *   Ask: "Who ensures they lose that trust? Is it a rule written in the sky, or something about the nature of trust itself?"
  *   **Key Concept:** Define **Moral Desert** as the claim that moral quality dictates future condition.
  *   **The Problem:** In Western secular ethics, desert usually requires a social contract or legal system. In religious ethics, it requires a deity.
  *   **Transition:** Pose the karmic hypothesis: What if the consequence is structurally embedded in the action itself, requiring no external administrator?

  #### II. Distinguishing Karmic Causation (00:10 – 00:20)
  *   **Goal:** Differentiate karma from legal punishment and hard determinism to secure the concept of agency.
  *   **Board Work:** Create a three-column comparison: **Legal Punishment**, **Deterministic Fate**, **Karmic Causation**.
      *   *Legal Punishment:* External agent imposes consequence (e.g., jail). Can be evaded if not caught.
      *   *Deterministic Fate:* Outcome is fixed regardless of action (e.g., Oedipus). Agency is illusory.
      *   *Karmic Causation:* Outcome is proportional and internal to the action's nature. Agency is preserved because new actions alter the trajectory.
  *   **Critical Distinction:** Emphasize that karma is **counterfactual-sensitive**. If the agent had acted differently, the condition would be different. This distinguishes it from Fate.
  *   **Misconception Inoculation (Determinism):** Explicitly state here that because the mechanism is responsive to *new* actions, it is not rigid determinism. This heads off the "no free will" objection before the example is introduced.

  #### III. Carrying Example: Restorative Justice Framework (00:20 – 00:35)
  *   **Goal:** Concrete application of the structural claim without supernatural elements.
  *   **Scenario:** Present a case study of an offender in a restorative justice program.
      *   *Action:* The offender commits fraud, damaging community trust.
      *   *Mechanism:* They are not imprisoned (legal punishment) but must engage in restitution and transparency.
      *   *Result:* Their future social standing is reshaped. They are not "punished" by a judge; they inhabit a social reality where trust is depleted. Their condition (isolation/suspicion) is proportional to the action (betrayal).
  *   **Discussion:** Ask students to map this onto the karmic structure.
      *   Where is the "judge"? (The community structure/psychology of trust).
      *   Where is the "rebirth"? (The new social identity they must inhabit).
  *   **Misconception Inoculation (Cosmic Revenge):** Emphasize that the goal of restorative justice is not suffering for suffering's sake, but realignment. This heads off the idea that karma is vindictive. It is corrective/proportional, not retributive.

  #### IV. Misconception Map & Targeted Check (00:35 – 00:50)
  *   **Goal:** Consolidate understanding and verify the proportionality vs. reward/punishment distinction.
  *   **Activity:** Display the **Misconception Map**. For each item, ask students to identify which previous segment (I, II, or III) provided the tools to reject the misconception.
      1.  **Misconception:** "Karma is rigid destiny."
          *   *Correction:* It is responsive causality.
          *   *Headed Off In:* **Segment II** (Distinction from Fate).
      2.  **Misconception:** "Karma is cosmic revenge."
          *   *Correction:* It is structural proportionality, not inflicted pain.
          *   *Headed Off In:* **Segment III** (Restorative Justice Example).
      3.  **Misconception:** "Karma requires a God to keep score."
          *   *Correction:* It is intrinsic causality.
          *   *Headed Off In:* **Segment I** (Problem of the Judge).
  *   **Targeted Check Question:**
      *   *Prompt:* "Consider a person who habitually acts with extreme generosity. Later, they find themselves surrounded by people who rely on them heavily, leaving them exhausted. Is this exhaustion a 'punishment' for generosity, or a proportional moral condition? Explain why the distinction matters for whether karma is a system of transaction or a theory of character."
      *   *Desired Answer:* It is a proportional condition (structural outcome of creating dependency), not a punishment (inflicted penalty). Understanding this shows karma describes the *shape* of one's moral environment, not a ledger of credits and debits.
  *   **Closing:** Reiterate that this model functions without metaphysical rebirth, relying instead on the continuity of moral condition.

  ***

  ### Pedagogical Constraints & Exclusions
  *To maintain the secular structural focus, the following must be strictly excluded from this session:*

  1.  **No Scriptural Texts:** Do not quote the Upanishads, Bhagavad Gita, or Buddhist Sutras. This prevents students from categorizing the theory as "faith-based" before understanding the logic.
  2.  **No Metaphysical Rebirth:** Do not discuss literal reincarnation, souls, or afterlives. Treat "future conditions" as occurring within a continuous causal framework (social or psychological) rather than distinct biological lives.
  3.  **No Divine Administration:** Do not introduce Ishvara, Brahma, or cosmic judges. The mechanism must remain impersonal.
  4.  **No Primary Source Readings:** Do not assign texts for this session. The goal is conceptual architecture, not hermeneutics.
  5.  **No Soteriological Goals:** Do not discuss *moksha* or *nirvana*. Focus solely on the mechanics of moral causation within conditioned existence.
