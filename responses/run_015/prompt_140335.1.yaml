      *   *Wait, let's look at the "Lineage" trick again.* "manipulation by a parasite... signal whose fitness effects land on a genome different from the one that builds the receiver."
      *   *Scenario:* The Host (Organism O) has internal state S.
      *   *Producer of S:* Host's sensory system.
      *   *Consumer of S:* Host's motor system.
      *   *How to split etiology?* The sensory system (Producer) was shaped by the *Parasite's* manipulation to indicate Q (Parasite benefit), while the Motor system (Consumer) was shaped by the *Host's* history to need S to be about P (Host benefit).
      *   *Constraint:* "The producing mechanism is doing exactly what it was selected to do." If the host's sensory system was selected by the parasite, that's manipulation. But the prompt says "no deception... organism is succeeding." If the host is succeeding, the manipulation must be mutually beneficial *currently*, or the host is "succeeding" in a minimal sense.
