      *   *Resolution:* The "Producer Mechanism" in teleosemantics is the mechanism *producing the representation S*. If S is in the Host, the Producer is the Host's sensor.
      *   *Unless:* We treat the "signal" as the input. No, teleosemantics focuses on the internal state.
