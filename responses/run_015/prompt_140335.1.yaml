          *   *Cons:* Might feel like "two organisms" to students.
      *   *Option 2: Exaptation/Co-option.* The producer mechanism was selected for one thing (Q), but recently co-opted by a consumer mechanism that needs it to be about something else (P), and currently, Q and P co-occur perfectly.
