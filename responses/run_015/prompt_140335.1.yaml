      *   *Organism:* The Pea Aphid (*Acyrthosiphon pisum*).
      *   *State S:* A specific neural-hormonal surge in the aphid's hemolymph that triggers the excretion of honeydew.
      *   *Producer Mechanism:* Gut chemoreceptors.
