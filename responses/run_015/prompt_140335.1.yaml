          *   *Producer-based:* Content fixed by what the producer has the function of *indicating* (Dretske/Indicator).
      *   **Goal:** A problem set case where Producer theory says Content = Q, Consumer theory says Content = P.
      *   **Constraints:**
          *   P and Q must be distinct (not distal/proximal, not determinable/determinate).
