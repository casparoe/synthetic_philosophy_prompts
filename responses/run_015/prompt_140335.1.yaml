          *   Producer: Function of indicating.
          *   Consumer: What consumers need it to be about for *their* successful performance.
      *   *The Conflict:* Usually, Producer and Consumer selection pressures align (the frog's retina and the frog's tongue). To separate them, we need a case where the *indicator function* (Producer) tracks Property Q because that's what caused the selection of the producer, but the *consumer mechanism* uses S to guide action regarding Property P, and the consumer was selected to do so, and currently Q and P are co-instantiated.
      *   *The "Cross-Lineage" Idea Refined:* The prompt suggests: "selection pressure that shaped the mechanism producing S came from a lineage other than the organism's own."
