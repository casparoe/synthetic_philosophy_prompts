      *   *Time:* Aim for ~800 words.

      *(Self-Correction during drafting)*: I need to be careful not to imply euthanasia explicitly if it's about palliative care (withdrawing treatment vs. active ending). The prompt says "pulling the plug on machinery that kept people in prolonged suffering." This implies withdrawing futile treatment. I must stay within that ethical boundary.

      *Refining the Philosophical Argument:*
