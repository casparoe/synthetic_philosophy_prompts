answer: |-
  Good evening, everyone. For those who don't know me, I'm [Name]'s brother/sister. It's lovely to see so many familiar faces, and quite a few new ones. We've got a proper mix in the room tonight. Half of you are family and friends who know [Sister's Name] for her kindness and her terrible taste in television. The other half are palliative care specialists who, I suspect, know her for her ability to make incredibly difficult phone calls look easy.

  [Sister's Name] asked me to say a few words, and she gave me a specific instruction. She said, "Don't make it soppy." So, I'll try to keep the tears for the end. But she did give me a theme to work with. Over the years, she's often joked that her job wasn't really healthcare in the traditional sense. She joked that she was running the 'Experience Machine' in reverse.

  Now, for the family members here, don't worry, I'm not about to turn this into a lecture. But for the doctors in the room, you'll know the thought experiment I'm hinting at. It's that famous philosophical puzzle about a tank that could feed you any pleasure you wanted, making you think you were living a perfect life, when really you were just floating there. The question is: would you plug in?

  [Sister's Name] always said her job was the opposite. She wasn't plugging people into false happiness. She was the one gently unplugging the machinery that kept people in a state of prolonged suffering when there was no real life left to preserve. She was managing the exit from the machine, not the entry.

  But this joke hides a proper philosophical puzzle, one I know keeps some of you medics up at night, and one that worries families too.

  If we think well-being is just about feelings—what the philosophers call an experiential view—then stopping treatment creates a paradox. If the patient doesn't wake up to feel relief, if they never report feeling 'better' because they've passed, have we actually improved their welfare? On a strict scorecard of feelings, zero minus zero is still zero.

  I reckon the answer is yes, though. Because welfare isn't just about adding pleasure; it's about subtracting the unbearable. Even if the patient doesn't get to experience the relief, sparing them the final weeks of agony is a gift. It's a negative benefit, perhaps, but it's real. You aren't giving them a good feeling; you're saving them from a bad one. That counts.

  Then there's the other side of the coin. The life-satisfaction view. This says a good life is about fulfilling desires or having a coherent story. But can you really make sense of 'pulling the plug for their own good' without secretly smuggling in feelings? If satisfaction is about getting what you want, does ending the life satisfy a desire?

  I think [Sister's Name] showed us that it's not about satisfaction in the sense of a happy ending. It's about integrity. A life has a shape, and sometimes, keeping the body going distorts that shape into something unrecognisable. Letting go restores the dignity of the narrative. It says, 'This person mattered enough that we wouldn't let them become merely a biological process.' That's a value that exists outside of experience. It's about truth.

  And that's where the two groups in this room meet. The family wants to know their loved one wasn't abandoned; the doctors want to know they didn't give up. [Sister's Name] bridged that gap. She understood that withdrawing care isn't withdrawing love. In fact, it's often the hardest, most active form of love there is.

  She didn't pretend death was just another experience. She didn't sell anyone the lie that everything would be okay. Instead, she offered something rarer: honesty. She held the space where the medical reality met the human story, and she made sure neither side was humiliated.

  To the doctors: you know the theory, but she taught you how to live it. To the family: you know the love, but she showed you how to protect it.

  So, if I could ask you to raise a glass. To [Sister's Name]. For knowing when to fight, and having the courage to know when to stop. For running the machine in reverse, so everyone else could find their way back to reality.

  Cheers.
