prompt: |-
  In a methodology reading group I keep falling back on the same analogy: a model stands to its target system as a map stands to the terrain. A map is valuable precisely because of what it leaves out; a map drawn at one-to-one scale would be as large as the country it depicts and would serve no purpose. The Underground diagram is our favourite example, since it is deliberately false about distances and directions and is nevertheless the best tool for the job.

  One member of the group uses this to defend the strongest version of Friedman's as-if methodology: not merely that descriptively false assumptions are acceptable in a theory that predicts well, but that unrealistic assumptions are a mark of a theory's power, and that objecting that a model's agents are nothing like real people is like objecting that the Underground diagram misstates the distance between two stations.

  I want that analogy audited rather than accepted or rejected. Give the correspondence explicitly — what plays the role of the terrain, of the scale, of the projection, of the legend, of route-finding, of the user knowing what the map is for — and then say where the mapping breaks, separating the disanalogies that matter for the work it is doing here from those that do not.

  For the ones that matter, I find it helpful to sort a model's false assumptions into two kinds: those whose effect on a prediction we could in principle undo, because we have a definite recipe for correcting the prediction once the assumption is dropped, the way a projection's distortion can be inverted; and those for which we have no such recipe, so that the assumption does real predictive work and nobody knows what removing it would do. Call them dischargeable and non-dischargeable. Does the map analogy only cover the dischargeable kind, and does the answer to that question decide whether the strong as-if conclusion survives?

  Finally: is there a better analogy for a model that carries its falsehoods non-dischargeably, or is the map the best available and the lesson that we should stop asking it to carry the F-twist at all?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Context:** A methodology reading group discussing models, specifically Friedman's "as-if" methodology (instrumentalism).
      *   **Core Analogy:** Model : Target System :: Map : Terrain.
      *   **Opponent's Argument:** Uses the analogy to defend *strong* Friedmanism (unrealistic assumptions are a *mark of power*, objections to realism are like objecting to the Tube map's geometry).
      *   **Task 1 (Audit the Analogy):** Explicitly map the correspondence (Terrain, Scale, Projection, Legend, Route-finding, User Intent). Then identify where it breaks (disanalogies).
      *   **Task 2 (Dischargeable vs. Non-dischargeable):** Distinguish between false assumptions that can be corrected (dischargeable) and those that do essential predictive work without a correction recipe (non-dischargeable). Determine if the map analogy only covers dischargeable assumptions. Assess if this distinction decides the fate of the strong *as-if* conclusion.
      *   **Task 3 (Alternative Analogy/Conclusion):** Is there a better analogy for non-dischargeable falsehoods? Or should we stop using the map analogy for the "F-twist" (Friedman's twist)?

  2.  **Task 1: Auditing the Map Analogy:**

      *   *Correspondence:*
          *   Terrain $\rightarrow$ The Economy / Social Reality / Target System.
          *   Map $\rightarrow$ The Economic Model / Theory.
          *   Scale $\rightarrow$ Level of Aggregation / Resolution (e.g., representative agent vs. heterogeneous agents).
          *   Projection $\rightarrow$ Mathematical Formalism / Structural Assumptions (e.g., linearity, rationality).
          *   Legend $\rightarrow$ Definitions of variables, parameters, and operationalization.
          *   Route-finding $\rightarrow$ Prediction / Policy Recommendation / Explanation.
          *   User Intent $\rightarrow$ The specific question being asked (e.g., "How do I get from A to B?" vs. "What is the geology?").
      *   *Disanalogies (Where it breaks):*
          *   *Ontology:* The terrain exists independently of the map. In social science, the map (theory) can change the terrain (reflexivity/performativity).
          *   *Verification:* You can check a map against the terrain directly (go look). You often cannot check economic assumptions directly (unobservable preferences, counterfactuals).
          *   *Distortion vs. Mechanism:* Map distortions are geometric transformations. Model distortions are often causal mechanisms that *don't exist* (e.g., perfect rationality).
          *   *Purpose:* A map is primarily for navigation (prediction). A model is often claimed to be explanatory (mechanism). The Tube map works for navigation but fails for explanation of *why* the tunnel curves.

  3.  **Task 2: Dischargeable vs. Non-dischargeable Assumptions:**

      *   *Definitions:*
          *   Dischargeable: False but correctable (like a projection). If we add complexity, the result converges or adjusts predictably.
          *   Non-dischargeable: False and essential. Removing them breaks the model or changes the prediction fundamentally without a known correction factor.
      *   *Does the Map Analogy cover Dischargeable?*
          *   Yes. The Tube map's distortion is dischargeable. If you need real distance, you switch to a geographic map or apply a known correction factor. The distortion is *known* and *controlled*.
      *   *Does it cover Non-dischargeable?*
          *   No. If a model assumes agents are immortal or have perfect foresight, and that assumption drives the result, we often don't have a "correction factor" to make them mortal and bounded.
      *   *Impact on Strong As-If:*
          *   Friedman's strong claim is that unrealistic assumptions are *good* because they simplify.
          *   If the assumptions are dischargeable (like the map), Friedman is safe. The simplification is a feature.
          *   If the assumptions are non-dischargeable (the engine of the prediction), then the "unrealistic = powerful" claim is dangerous. It might be "unrealistic = lucky" or "unrealistic = wrong mechanism."
          *   *Conclusion:* The analogy hides the non-dischargeable problem. It makes all falsehoods look like convenient projections. If the falsehoods are non-dischargeable, the analogy fails to defend strong *as-if*.

  4.  **Task 3: Better Analogy or Drop the F-Twist?**

      *   *Alternative Analogies:*
          *   *Cartoon/Caricature:* Exaggerates features to reveal essence. But still implies a visual correspondence.
          *   *Simulator/Flight Sim:* Good for training/prediction, but the physics engine might be wrong.
          *   *Prosthesis/Tool:* A hammer doesn't look like a fist, but it does the job. (Too instrumentalist?)
          *   *Fable/Parable:* Teaches a moral lesson through false stories. Good for intuition, bad for quantitative prediction.
          *   *Crutch:* Supports walking but isn't a leg.
      *   *Best Fit for Non-Dischargeable:* Maybe a **Black Box** or a **Heuristic**. Or perhaps a **Placebo**.
      *   *Recommendation:* The map analogy is too clean. It implies a known transformation rule. For non-dischargeable assumptions, we lack the transformation rule.
      *   *Final Verdict:* The map analogy should be retired for the *strong* F-twist. It validates weak instrumentalism (prediction matters) but invalidates strong instrumentalism (falsehood implies power) because it conflates *controlled abstraction* with *essential falsehood*.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Academic, precise, philosophical, respectful of the reading group context.
      *   *Structure:*
          1.  Audit the Correspondence (Table or List).
          2.  Identify Critical Disanalogies.
          3.  Analyze Dischargeable vs. Non-dischargeable within the analogy.
          4.  Evaluate the Strong As-If conclusion based on this.
          5.  Propose alternatives or final recommendation.

      *   *Refining the "Dischargeable" point:* This is the crux. A map projection (Mercator) has a mathematical inverse. You *can* get the real distance if you know the formula. In economics, if we assume perfect competition, is there a formula to adjust for monopolistic competition? Sometimes (comparative statics), often no (general equilibrium shifts). If no, the map analogy fails.
      *   *Refining the "Strong As-If":* Friedman says the *more* unrealistic, the *better* (sometimes). The map analogy says the *more* abstract, the *more useful for specific tasks*. But the Tube map isn't "better" because it's false; it's useful *despite* being false, for a specific task. If you ask about ventilation, it's useless. Friedman implies the falsehood *itself* generates the predictive power. The map analogy suggests the *omission* generates usability. There's a nuance there.
      *   *Alternative:* The **Caricature**. A caricature distorts features to reveal character. But like a map, the distortion is intentional and readable.
      *   *Better Alternative:* **The Skeleton Key**. It opens the lock but doesn't look like the tumblers. Or **The Placeholder**.
      *   *Actually, the "Black Box" is strong.* Input -> [Model] -> Output. We don't care about the internals. But Friedman cares about the assumptions *being* unrealistic, not just hidden.
      *   *Let's stick to the prompt's suggestion:* Is there a better analogy? Maybe the **Parable**. A parable is factually false but morally true. But economics wants empirical truth.
      *   *Decision:* The Map analogy is best for *abstraction*, worst for *mechanism*. For non-dischargeable assumptions (which are often mechanistic), the **Simulacrum** (Baudrillard style?) or simply admitting it's a **Heuristic Device** is better. But practically? Suggest dropping the analogy for the *strong* claim.

  6.  **Final Polish:** Ensure the distinction between "weak as-if" (prediction is what matters) and "strong as-if" (unrealistic assumptions are *virtuous*) is clear. The map analogy supports weak, undermines strong (because map errors are bugs, not features, unless they are projections). Wait, the Tube map errors *are* features for navigation. So it supports strong *if* the task is navigation. But if the task is explanation, it fails. Economics claims explanation.

      *Self-Correction on "Dischargeable":* A map projection is dischargeable *in principle*. In economics, "rational expectations" might be non-dischargeable. We can't just "add noise" to get bounded rationality results easily.
      *Key Insight:* The map analogy assumes a *stable relationship* between representation and reality. Non-dischargeable assumptions imply we don't know that relationship.

  7.  **Finalizing the Output Structure:**
      *   **Part 1: The Audit.** (Correspondence table + Disanalogies).
      *   **Part 2: The Dischargeability Test.** (Apply the distinction to the map).
      *   **Part 3: The Verdict on Strong As-If.** (Does the analogy save it?).
      *   **Part 4: Alternatives.** (Caricature, Parable, or Retirement).

      *(Self-Correction during drafting)*: Make sure to explicitly address the "F-twist" (Friedman's twist that unrealistic assumptions are *good*). The map analogy makes them look *necessary*, not necessarily *good* in a truth-tracking sense.

      *Let's write.*
answer: |-
  Here is an audit of the map analogy, structured to help your reading group distinguish between useful abstraction and essential falsehood.

  ### 1. The Audit: Correspondence and Disanalogies

  To evaluate the analogy, we must first fix the mapping. Your colleague is relying on the **London Underground (Tube) Map** specifically, not a geographic map. This is a crucial distinction, as the Tube map is a *topological* map, not a *metric* one.

  | Map Domain | Model Domain (Economic/Social) | Function |
  | :--- | :--- | :--- |
  | **The Terrain** | The Economy / Social Reality | The target system to be navigated. |
  | **The Map** | The Model / Theory | The representational artifact. |
  | **Scale** | Level of Aggregation | E.g., Representative Agent vs. Heterogeneous Agents. |
  | **Projection** | Mathematical Structure / Assumptions | E.g., Linearity, Rationality, Equilibrium conditions. |
  | **Legend** | Operational Definitions | How variables map to observables (e.g., "Utility" = "Choice"). |
  | **Route-Finding** | Prediction / Policy Intervention | The specific task the user wants to perform. |
  | **User Intent** | The Research Question | Knowing whether you need topology (connections) or metrics (distances). |

  #### Where the Mapping Breaks (Disanalogies)

  1.  **Reflexivity (The Terrain Changes):**
      *   *Map:* The terrain does not change because you hold the map.
      *   *Model:* In social science, the model can alter the terrain (performativity). If the Bank of England models inflation a certain way and acts on it, the inflation dynamics change. A map that changes the territory is not just a representation; it is an intervention.
  2.  **Verification of Distortion:**
      *   *Map:* We know *exactly* how the Tube map distorts reality. We have the geographic map to compare it against. The distortion is a known transformation.
      *   *Model:* We rarely have a "geographic map" of the economy. We do not know *how* the assumption of "perfect rationality" distorts the prediction relative to "bounded rationality." We often lack the ground truth to measure the distortion.
  3.  **Mechanism vs. Topology:**
      *   *Map:* The Tube map preserves connectivity (topology). It tells you *where* you can go.
      *   *Model:* Economics often claims to explain *why* things happen (mechanism). The Tube map cannot tell you why a tunnel curves (geology) or why a station is busy (sociology). If the model is used for causal explanation, the map analogy fails, because the map explicitly sacrifices causal geometry for topological utility.
  4.  **The Nature of the "Falsehood":**
      *   *Map:* The falsehood is an *omission* or *simplification* of existing features (straightening a line).
      *   *Model:* The falsehood is often an *insertion* of non-existent entities (e.g., a representative agent, a complete set of futures markets). The map does not draw fake stations; models often posit fake agents.

  ---

  ### 2. Dischargeable vs. Non-Dischargeable Assumptions

  Your distinction is the critical lever here. Let us apply it to the map.

  **The Map Analogy Covers Only Dischargeable Assumptions.**
  In the Tube map, the distortion is **dischargeable**.
  *   *Why?* Because there is a known transformation rule between the map and the terrain. If you need to know the real distance, you can switch to a geographic map or apply a correction factor (e.g., "multiply map distance by 1.5 for surface travel"). The falsehood is *controlled*. The user knows *what* is false and *how* it is false.

  **The Strong As-If Relies on Non-Dischargeable Assumptions.**
  Friedman's strongest claim is that we should not worry about the realism of assumptions because we often *cannot* make them more realistic without losing tractability, and yet the prediction holds.
  *   *The Problem:* In many economic models, the unrealistic assumption is **non-dischargeable**.
      *   *Example:* If a model relies on "Perfect Foresight" to generate an equilibrium price, and we drop that assumption for "Bounded Rationality," the equilibrium often disappears or becomes indeterminate. There is no "correction factor" to translate the Perfect Foresight prediction into a Bounded Rationality prediction.
      *   *The Gap:* We do not have the "geographic map" of the economy to calculate the distortion. Therefore, we cannot know if the prediction is robust (like the Tube connections) or an artifact of the distortion (like the map's distances).

  **Does this decide the Strong As-If conclusion?**
  **Yes.**
  *   If the assumptions are **dischargeable** (like the Tube map), the colleague is right: objecting to the falsehood is pedantic, provided the task is topological (navigation/prediction).
  *   If the assumptions are **non-dischargeable**, the colleague is wrong. If we lack a recipe to correct the prediction when the assumption is dropped, then the assumption is not merely a simplification; it is doing **essential predictive work**. If that work is based on a falsehood (e.g., agents calculating probabilities they cannot know), the model is not "powerful"; it is **overfitted** or **lucky**.
  *   *The Verdict:* The map analogy smuggles in the idea that the distortion is *known and managed*. Friedman's methodology is often invoked precisely when the distortion is *unknown and unmanaged*. Therefore, the analogy validates **Weak Instrumentalism** (prediction is what matters) but invalidates **Strong Instrumentalism** (unrealistic assumptions are a virtue).

  ---

  ### 3. Is There a Better Analogy?

  If the map analogy fails for non-dischargeable assumptions, we need an analogy that captures **utility without known transformation rules.**

  #### Option A: The Caricature
  *   **The Analogy:** A caricature exaggerates features (a large nose, a small chin) to capture the "essence" of a person.
  *   **Pros:** It acknowledges that distortion can reveal truth better than realism.
  *   **Cons:** Like the map, a good caricature relies on the viewer recognizing the subject. If the caricature is too abstract, it looks like a random face. It still implies a visual correspondence that non-dischargeable models lack.

  #### Option B: The Parable (or Fable)
  *   **The Analogy:** A story that is factually false (talking animals) but morally true.
  *   **Pros:** It captures the idea that the *mechanism* is false, but the *lesson* is valuable. It separates narrative truth from empirical truth.
  *   **Cons:** Parables are for moral instruction, not quantitative prediction. It concedes too much ground to the critics who say economics is literature, not science.

  #### Option C: The Black Box (or Heuristic Device)
  *   **The Analogy:** A tool that transforms input to output reliably, but whose internal gears are made of "unobtainium."
  *   **Pros:** It focuses entirely on the input-output reliability. It admits we don't know *how* it works, only *that* it works.
  *   **Cons:** It offers no defense for *why* the assumptions are unrealistic, only that they are necessary for the box to function.

  #### Recommendation: Retire the Map for the "F-Twist"

  The map analogy is too clean. It implies a **stable relationship between representation and reality** that allows for "correction" (discharge).

  For the **Strong As-If** claim (that unrealistic assumptions are a mark of power), the map analogy is dangerous because it suggests the modeler *knows* what is being left out. In non-dischargeable cases, the modeler does *not* know.

  **Suggested Move for the Reading Group:**
  Propose that the group stop using the Map analogy to defend the **realism of assumptions**. Instead, use it to defend the **choice of question**.
  *   *Correct Usage:* "We are using a Tube Map (Model A) because we are asking a topological question (Will a shock propagate?). We are not using a Geographic Map (Model B) because we are not asking a metric question (How large will the shock be?)."
  *   *Incorrect Usage:* "It doesn't matter that the Tube Map gets distances wrong, because maps are supposed to get distances wrong." (This is the Friedman error; maps are not *supposed* to get distances wrong, they are *allowed* to provided you know you are using a topological map).

  **Conclusion:**
  The map analogy survives only for **dischargeable** assumptions (abstractions). It collapses for **non-dischargeable** assumptions (essential falsehoods). Since Friedman's strongest claims often rest on the latter, the analogy should be retired for that specific purpose. It defends **instrumental utility**, but it cannot defend **epistemic indifference**. If you cannot undo the distortion, you are not holding a map; you are holding a talisman.
