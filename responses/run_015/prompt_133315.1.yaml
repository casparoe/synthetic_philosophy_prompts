      *   *Is it Methodological?* This seems the most potent diagnosis. One side is doing *conceptual analysis* of the folk/scientific concept 'disposition'. The other is doing *causal metaphysics* regarding the structure of reality.
      *   *The Concessions:* Both admit finks/masks happen. Conditionalists say this shows the analysis needs nuance (the 'right' conditions weren't met). Powers theorists say this shows the analysis is the wrong tool (the power exists regardless of the conditional truth value).

  4.  **Formulate the Diagnosis:**
      *   The core issue is a conflation of the *concept* of disposition with the *ontology* of causation.
      *   The Conditional Analysis is an attempt to reduce modal facts to non-modal facts (or simpler modal facts).
      *   The Powers Ontology is an attempt to ground modal facts in intrinsic natures.
      *   The impasse exists because they are answering different questions under the same label.
      *   *Key Insight:* The Conditionalists are worried about truth-conditions for dispositional ascriptions. The Powers theorists are worried about truth-makers for those ascriptions.

  5.  **Determine What Counts as Progress:**
