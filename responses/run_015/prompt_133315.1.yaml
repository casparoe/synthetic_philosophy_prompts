      *   **Topic:** The philosophical debate over dispositions, finks, and masks (specifically post-Martin and Bird).
      *   **The Problem:** The debate has stalled. Both sides accept the standard counterexamples (finks, masks, antidotes). Both agree external factors can prevent manifestation. Yet, they disagree on the interpretation.
