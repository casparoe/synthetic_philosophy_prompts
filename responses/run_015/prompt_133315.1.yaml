      *   **Language:** British English.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *The Conditional Analysis (CA):* Traditionally, $x$ is disposed to $M$ when stimulated by $S$ iff if $x$ were $S$, $x$ would $M$.
      *   *The Counterexamples:*
          *   *Finks (Martin):* The disposition disappears just before the stimulus occurs (e.g., the wire loses conductivity when touched). The conditional is false, but the disposition seemed present (or vice versa).
          *   *Masks/Antidotes (Bird, Johnston, etc.):* The disposition remains, but something prevents the manifestation (e.g., poison + antidote). The conditional is false, but the disposition is present.
      *   *Camp 1 (Refined Conditionalists/Neo-Humeans):* Think the CA can be saved by refining the ceteris paribus clauses or the modal structure. They treat interference as a failure in the counterfactual dependency. They often lean towards Humean supervenience or deflationary realism about powers.
      *   *Camp 2 (Powers Ontologists/Dispositional Essentialists):* Think the counterexamples show CA is fundamentally flawed. Dispositions are real, intrinsic causal powers. Masks/finks show that the *power* exists even if the *counterfactual* fails. They lean towards Aristotelian realism.
      *   *The Stalemate:* Both agree the wire stops conducting (fink) or the poison is neutralised (mask). The disagreement is about *what explains* this agreement.

  3.  **Diagnose the Impasse:**
      *   *Is it Metaphysical?* Yes, partly. One side thinks properties are just clusters of counterfactuals (or supervene on them); the other thinks properties *ground* counterfactuals.
