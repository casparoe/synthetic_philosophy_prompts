answer: |-
  The recording crackled through the station speakers, a dry, rhythmic scratching that sounded like sandpaper on bone. Elias watched the monitor. Inside the mesh cage, a dozen silver-winged moths hung suspended in the still air. When the sound hit the right frequency, every pair of wings folded tight against a body, and the insects dropped like stones onto the leaf litter below. They lay there, feigning death, waiting for a predator that no longer existed.

  "It's perfect," Elias said, tapping the glass. "The spindle fires, the muscle contracts. Just like the archives say it did a hundred years ago."

  Mara stood by the window, watching the treeline sway. The weather front was coming in early. "It's not perfect, Elias. It's a ghost story. You're making them jump at a ghost."

  "The spindle was built for that sound," Elias replied. "Every generation for five thousand years shaped that organ to hear the wasp. The wasp is gone, but the ear remains. When they hear that scratch, they think a wasp is there. They are wrong."

  "They aren't wrong," Mara said, turning from the window. "They are safe. Look at the logs. When that scratching happens naturally—when the pressure drops and the low hum starts—they drop too. And they live. The wasp killed one in a thousand. The squall lines kill half the brood if they stay airborne. The spindle isn't hearing a wasp anymore. It's hearing the storm."

  This was the first fracture in their work. The data showed the spindle firing reliably to the infrasound that preceded violent weather. The moths that dropped survived the wind; those that flew were shredded against the trees. Yet the change was messy. In some broods, the organ still tuned strictly to the high frequency of the extinct wasp, ignoring the approaching gale. In others, the sensitivity had slid down the scale. The population was caught in a stuttering transition, neither fully adapted to the sky nor fully committed to the memory of the wasp.

  Elias rubbed his temples. "If the mechanism was selected for the wasp, then its job is to signal 'wasp.' When it fires for a storm, it is misfiring. It's a mistake that happens to save them. Like a smoke alarm going off because of burnt toast—it's still an error, even if you check the stove."

  "It's not an error if it keeps the heart beating," Mara countered. "The job of the organ is to keep the moth alive. Now it does that by hearing the wind. The meaning of the signal changed when the wasp died."

  They let the argument sit while the samples from the valley arrived. This was the second complication. Under the microscope, the spindles from the lower elevation population looked different. They were fused structures. Histology showed the ancestral wasp-detector had merged with a separate organ used to measure barometric drift for migration timing. One physical state, two ancient jobs.

  Mara spread the slides across the table. "Here, the same nerve bundle triggers the drop reflex and sets the departure time for the south. Which history do you count, Elias? Is it a wasp-ear or a pressure-gauge? It was shaped by both pressures over different epochs. If you say it's only about the wasp, you ignore half its ancestry. If you say it's about pressure, you ignore the drop reflex."

  Elias leaned over the microscope, adjusting the focus until the cellular walls sharpened. "It's a hybrid. That means the signal is ambiguous. It doesn't say 'wasp' or 'storm.' It says 'change.' When the airguns start, that ambiguity is going to get them killed."

  The seismic survey company planned to run airgun arrays along the coast during the peak migration week. The pulses were low-frequency, powerful enough to rattle the station windows. If the moths interpreted the pulses as wasps, they would drop into the water. If they interpreted them as storms, they would delay migration and miss the breeding window. Either way, the mortality rate would spike.

  The third complication arrived in a sealed crate from the offshore rock island. These moths had been isolated for millennia. There had never been parasitoid wasps on the island. Yet, when Elias played the archived recording, the island moths dropped. Their spindles were produced by a different mutation, a convergent evolution that arrived at the same shape without the same history.

  Elias stared at the cage. The island moths lay still on the mesh floor. "There was no wasp," he said quietly. "Never. So the spindle wasn't shaped by the wasp here. It was shaped by something else. Or nothing. It just... happened."

  "Then your history argument is dead," Mara said. "If the island moths have the same reaction without the wasp history, then the history doesn't determine what the signal is. The structure determines it. The structure says 'drop when vibration hits threshold.' It doesn't care why it was built."

  "It matters," Elias insisted, his voice tightening. "If the mainland moths drop because of the wasp-history, they are acting on a lie. The airguns will lie to them too. They will drop into the sea thinking a predator is above them. That is a fatal error. We can file for an injunction on the grounds that the survey induces a malfunction. We protect them from their own confusion."

  "And if they drop because the structure detects dangerous vibration?" Mara asked. "Then they aren't confused. They are reacting correctly to a hostile environment. The airguns are just another danger, like the storm. If we file, we aren't protecting them from error; we're protecting them from the world. Our mandate doesn't cover that."

  They both knew the funding charter by heart. They were funded to preserve the ancestral migration, not to maximize species survival at the cost of behavior modification. If the moths were now storm-shelterers rather than wasp-dodgers, were they still performing the ancestral migration? If the spindle's meaning had shifted from 'wasp' to 'storm,' the behavior was no longer the one they were paid to protect. But if the spindle was still shouting 'wasp' in a world without wasps, the behavior was ancestral, but fatal.

  Elias sat at the desk where the injunction form lay open. The cursor blinked in the justification field. "If I write that the moths are misidentifying the airguns as wasps, I validate the history. I say the organ belongs to the past. But the island samples prove the past isn't necessary for the reaction."

  "If I write that the moths are correctly identifying danger," Mara said, leaning against the doorframe, "I validate the current utility. I say the organ belongs to the present. But then we admit the ancestral behavior is gone. We're protecting a new species behavior with old money. The committee will reject it."

  "The valley samples show both," Elias said. "Fused functions. Maybe the signal means both. Maybe it means 'danger' generally."

  "Then the airguns are dangerous," Mara said. "So they drop. No error. No injunction."

  "But they die," Elias said. "They drop into the water. They drown. A function that kills you isn't a function. It's a breakdown."

  "It's a trade-off," Mara corrected. "They trade migration for survival. Just like they trade flight for storm shelter. The environment turned hostile. The signal isn't wrong; the world is."

  Elias typed a sentence, then deleted it. The wind outside picked up, whistling through the eaves. The barometer on the wall was dropping. A squall line was forming, darkening the sky to a bruised purple. Inside the cage, the mainland moths began to twitch. Their spindles were firing before the sound even reached them, sensing the pressure drop. They folded their wings and dropped.

  The island moths remained hanging, insensitive to the pressure, waiting for a vibration that wouldn't come.

  Elias looked at the mainland moths on the floor, alive but grounded. He looked at the island moths in the air, vulnerable but moving. He looked at the form. The box for 'Physiological Malfunction' sat next to the box for 'Environmental Hazard.'

  "If we check malfunction," Elias said, "we say the history rules. We say the wasp still owns them."

  "If we check hazard," Mara said, "we say the present rules. We say the storm owns them."

  "The mandate says preserve the migration," Elias said. "The mainland moths aren't migrating. They're hiding."

  "The island moths are migrating," Mara said. "But they don't have the spindle history. They aren't the ancestral population we were sent to save."

  Elias's hand hovered over the keyboard. The first drop of rain hit the window, heavy and loud. The moths on the floor did not move. The moths in the air drifted with the draft. The airgun schedule was posted on the wall, red circles around the dates. The sound of the coming storm began to rattle the glass, a low thrumming that matched the frequency of the machines.

  Elias moved the cursor to the justification box and began to type, then stopped, his fingers resting on the keys as the room darkened around them.

  The rain streaked the glass, blurring the line between the moths on the floor and the moths in the air.
