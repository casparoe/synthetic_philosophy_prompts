answer: |-
  Here is the prep sheet. I've ranked these by the product of (Likelihood × Damage). The top items are the ones that get a vote against you if you waffle. The tone is calibrated for a 2-minute clock: direct, no throat-clearing, acknowledge the bite, pivot to the fix.

  ### Top 10 Objections & Replies

  **1. The "Empty Set" Problem (Reasons-First & Constructivist)**
  *   **The Question:** "You say if there's no fixed point, there's no objective 'ought.' So if a committed psychopath treats no aspect of their psychology as a defect, there is no fact of the matter that they ought not to kill? You're dissolving the normativity of the hardest cases."
  *   **The Reply:** "I distinguish *objective* 'ought' from *normative* 'ought.' In the no-fixed-point case, the agent is normatively inaccessible to themselves; there is no internal hook for correction. That doesn't mean we don't intervene—it means the intervention is external coercion, not rational persuasion. My theory explains *rational* obligation, not the justification of force. If the agent has no reflective purchase, 'ought' loses its grip, and we should admit that rather than fake a metaphysical fact."
  *   **The Soft Spot:** You are biting a massive bullet. To an ethics department, saying "sometimes there is no moral fact" sounds like relativism. You need to sound confident, not apologetic, or they'll smell blood.

  **2. The Input Circularity (Moral Psychologist)**
  *   **The Question:** "Your idealization is anchored by 'defects S would treat as defects.' But people's self-reports on defects are framing-sensitive and unstable. If the input is empirically noisy, your fixed point is garbage-in-garbage-out. How is this not just codified bias?"
  *   **The Reply:** "We don't use occurrent self-reports. We look for *stable patterns of regret and correction* over time. If S consistently tries to quit smoking and fails, the 'defect' is identified by the stable second-order volition, not the momentary report. We treat the 'defect' criterion as a psychological natural kind, discoverable by empirical work, not introspection. If the data shows instability, then 'ought' is indeterminate for that agent at that time."
  *   **The Soft Spot:** You're pushing the empirical work to a future date. They know you haven't done the study. You're asserting stability where the psychologist knows there is mess.

  **3. The Normative Authority Gap (Reasons-First)**
  *   **The Question:** "Even if the counterpart exists, why does *their* conclusion bind *me*? They are a different possible person with different psychology. You've explained how to find a recommendation, not why it's binding."
  *   **The Reply:** "The counterpart isn't a different person; they are the resolution of *your* own conflicting attitudes. The binding force comes from the fact that this outcome eliminates the deliberative tension *you* currently feel. It's not 'listen to them,' it's 'listen to the resolution of your own commitment to correction.' The authority is internal to the agent's own reflective structure."
  *   **The Soft Spot:** This is the heart of the view. If this doesn't land, the theory is just advice, not normativity. Don't let them pivot to "But why care about resolution?"

  **4. The Convergence/Math Check (Decision Theorists)**
  *   **The Question:** "You rely on fixed points. But is the idealization operator contractive? If I idealize evidence then ends, versus ends then evidence, do you guarantee convergence to the *same* fixed point, or just *a* fixed point? If the latter, your 'indeterminacy' clause is doing all the work."
  *   **The Reply:** "I don't guarantee uniqueness. I guarantee *stability*. If multiple fixed points exist, the 'ought' is genuinely indeterminate. That's a feature, not a bug—it captures moral dilemma without contradiction. The operator doesn't need to be contractive; it needs to be monotonic enough to prevent cycling. Where it cycles, there is no 'ought.'"
  *   **The Soft Spot:** DTs hate "indeterminate" as a stopper. They want conditions for uniqueness. You are telling them you don't have uniqueness conditions. They will mark this as "under-specified model."

  **5. The Smuggling Charge (Constructivist)**
  *   **The Question:** "How do you determine what counts as a 'defect' without already assuming a moral standard? If you say 'ignorance is a defect,' you've smuggled in an epistemic norm. If you don't, the idealization is trivial."
  *   **The Reply:** "The standard is purely structural: a defect is any attitude the agent *themselves* flags as interfering with their own ends. I'm not smuggling morality; I'm smuggling instrumentality. The moral content comes out only if the agent's ends, when clarified, converge on moral considerations. If they don't, the theory outputs amoralism, correctly."
  *   **The Soft Spot:** This risks collapsing your view into instrumental rationality. You need to explain how "ends" includes normative beliefs without begging the question.

  **6. The Deliberative Structure Objection (Philosopher of Action)**
  *   **The Question:** "Deliberation isn't iterative. Agents don't run loops until convergence. They act on holistic judgment. Your model describes a computer, not an agent. How does this guide action in real time?"
  *   **The Reply:** "It's a criterion of rightness, not a decision procedure. I'm not saying agents *run* this algorithm. I'm saying an act is right if it aligns with where the algorithm *would* stop. We distinguish the structure of justification from the psychology of discovery. The fixed point models the limit of reflection, not the process."
  *   **The Soft Spot:** Standard move, but Action theorists hate it. They want normativity to be action-guiding. If it doesn't guide, why call it practical normativity?

  **7. The Fetishism Worry (Constructivist/Reasons)**
  *   **The Question:** "You say the agent acts on 'p' not 'counterpart says p.' But if the justification is 'counterpart says p,' the motive is still fetishized. You've just hidden the surrogate reason."
  *   **The Reply:** "The counterpart's output is *always* in the form of a substantive reason 'p'. The idealization is a filter, not a generator. If the filter outputs 'φ because it causes pain,' the agent acts on pain, not the filter. The transparency is genuine because the counterpart has no ends of their own to impose."
  *   **The Soft Spot:** Hard to convince someone who thinks the *source* of the reason matters more than the content.

  **8. The Indeterminacy Explosion (Reasons-First)**
  *   **The Question:** "If multiple fixed points make 'ought' indeterminate, isn't that almost always? Human psychology is messy. You're making objective 'ought' vanishingly rare."
  *   **The Reply:** "Not if we idealize in clusters. We don't idealize every belief individually. We idealize coherent sets. Most normal agents have a dominant stable cluster. Indeterminacy is reserved for genuine deep conflict, which is where we want indeterminacy anyway."
  *   **The Soft Spot:** You need to show the clustering mechanism isn't just a gerrymander to get the results you want.

  **9. The "Why Idealize?" Challenge (Decision Theorists)**
  *   **The Question:** "Why think idealization improves anything? If I have coherent but evil desires, idealizing just makes me a more efficient evil agent. Where is the normative gain?"
  *   **The Reply:** "Because 'evil' usually relies on false belief or instrumental inconsistency. If the evil survives full information and coherence, my theory says there is no objective 'ought' against it. I reject the premise that normativity must condemn all evil; it must only track rational requirements."
  *   **The Soft Spot:** This is the "Rationality vs. Morality" concession. It might cost you the job if the department is strongly moral realist.

  **10. The Reflexivity/Stability Question (Your Guess)**
  *   **The Question:** "If S learns your theory, they might change what they treat as a defect. Does the fixed point shift? Is 'ought' unstable under the dissemination of your theory?"
  *   **The Reply:** "Yes, 'ought' is sensitive to the agent's reflective capacities. If learning the theory improves their reflection, the 'ought' updates. This is true of any reflective theory. Normative facts supervene on the agent's psychology; if the psychology improves, the facts change."
  *   **The Soft Spot:** This sounds like truth is relative to knowledge of your theory. It's technically defensible but pragmatically awkward.

  ---

  ### Concessions to Make in the First 5 Minutes
  *Do not wait for Q&A to give these. Pre-empting them makes you look in control.*

  1.  **Not a Decision Procedure:** Explicitly state: "This is a criterion of rightness, not a model of real-time deliberation." (Disarms Action Theorist).
  2.  **Scope Limit:** "This applies to agents capable of second-order reflection. It does not generate 'oughts' for infants or severe cognitive impairment." (Disarms the "Empty Set" worry slightly by narrowing the domain).
  3.  **Moral vs. Rational:** "I am defending a structure of rational normativity. Whether this always aligns with morality is a substantive question, not a definitional one." (Disarms the Constructivist/Reasons worry about smuggling).

  ### The One Reply That Must Land
  **Objection #3: The Normative Authority Gap.**
  If you fail to explain why the counterpart's choice binds the actual agent, you have not done metaethics; you have done psychology.
  *   **Key phrase to hit:** "The counterpart is not an *other*; it is the *resolution* of the self."
  *   **Why:** If the Reasons-First people leave thinking "But why should I care what my idealized self thinks?", they will vote no. You must ground the authority in the *agent's own current commitment to coherence*, not the counterpart's status.

  ### The Question You Hope Nobody Asks (And Why Your Guess Was Close)
  **Your Guess:** Stability under learning the theory.
  **My Verdict:** That is dangerous, but the **real** killer is a specific version of **Objection #1 (The Empty Set)** combined with **Objection #5 (Smuggling)**.

  **The Dreaded Question:**
  *"If the criterion for idealization is 'what the agent treats as a defect,' and a racist treats no racist belief as a defect, your theory says they have no objective ought not to be racist. Are you prepared to tell this department that for some agents, racism is rationally permissible?"*

  **Why this kills you:**
  1.  It forces you to choose between **Relativism** (Yes, permissible for them) or **Smuggling** (No, because racism is *objectively* a defect).
  2.  If you say Relativism: The ethicists will vote you down for moral cowardice.
  3.  If you say Smuggling: The metaethicists will vote you down for circularity/begging the question.
  4.  It puts the Moral Psychologist and Constructivist on the same side against you.

  **Prep for this:**
  Do not say "It's permissible." Say: "It is *rationally inaccessible*. We still condemn them, but we condemn them as we condemn a force of nature or a disease, not as a rational interlocutor. Normativity requires a hook. If they have none, 'ought' is the wrong tool."
  *Risk:* High. But it's the only honest answer that preserves the theory.

  ### Final Committee Advice
  *   **The Decision Theorists:** They are your best friends if you speak their language. Use terms like "operator," "convergence," and "stability." Do not use metaphors with them.
  *   **The Reasons-First Group:** They are your biggest threat. They think you are analyzing a primitive ('ought') with a complex counterfactual. Keep emphasizing that you are explaining the *truth conditions*, not the *concept*.
  *   **Time Management:** When the Chair cuts you off, stop mid-sentence. Do not try to finish the thought. It shows you respect the committee's time.
  *   **The Friendly Face:** Use them. If you get stuck, look at them, but answer the questioner.

  Good luck. Ten days is enough time to drill these answers until they sound like thoughts, not scripts.
