answer: |-
  Here is the specification you requested. It is designed to be substrate-neutral, applying equally to genes, human minds, and software agents, while forcing models to move beyond "existence proofs" to explanatory adequacy.

  ### The Specification for a Theory of Cooperation

  **1. Baseline Anomaly Coverage (Non-Negotiable)**
  *   **Requirement:** The theory must explain substantial cooperation in anonymous, one-shot interactions without appealing to "internalized norms" as a black box. If the explanation relies on a norm or heuristic, it must specify the evolutionary or learning pathway that installed it, the mechanism that maintains it against defectors, and the specific conditions under which it unravels.
  *   **Consideration:** Standard rational choice predicts defection in one-shot games. Empirical data shows cooperation. A theory that says "people cooperate because they have a cooperation norm" explains nothing unless it explains the norm's stability. This prevents the theory from hiding the hard problem inside a psychological primitive.

  **2. Dynamic Trajectory Matching (Non-Negotiable)**
  *   **Requirement:** The theory must account for the temporal profile of cooperation in finite iterated games, specifically the erosion of cooperation in late rounds, not just the existence of cooperation in early rounds.
  *   **Consideration:** Many equilibrium models predict stable cooperation throughout an iterated game if the shadow of the future is long enough. Laboratory data consistently shows a "end-game effect" where cooperation decays. A theory that predicts stability where there is decay is empirically falsified, even if it gets the average cooperation rate right.

  **3. Noise Immunity (Non-Negotiable)**
  *   **Requirement:** The mechanism must sustain cooperation rates significantly above chance when implementation errors (trembling hand) or perception errors (misperceived moves) occur at realistic rates (e.g., 1–5%). This is a pass/fail condition, not a sensitivity analysis.
  *   **Consideration:** Strategies like Grim Trigger are equilibria in noiseless environments but lead to permanent defection with a single error. Real biological and social systems are noisy. If a mechanism collapses under noise, it cannot explain cooperation in the real world, regardless of its mathematical elegance.

  **4. Second-Order Stability (Non-Negotiable)**
  *   **Requirement:** If the mechanism relies on punishment or sanctioning, it must explain why individuals pay the cost to punish defectors when they could free-ride on the punishment efforts of others. The regress must stop without assuming altruistic punishers as a primitive.
  *   **Consideration:** Costly punishment stabilizes cooperation, but punishers are vulnerable to second-order free-riders (those who cooperate but do not punish). Without a solution to this regress, punishment mechanisms are evolutionarily unstable.

  **5. Scalability (Non-Negotiable)**
  *   **Requirement:** The mechanism must function in $N$-player public goods settings, not just dyadic prisoner's dilemmas. It must specify how the cost/benefit ratio changes as group size increases.
  *   **Consideration:** Human cooperation scales to hundreds or thousands (nations, markets). Mechanisms that rely on dyadic reciprocity often fail in public goods games where individual impact is diluted. A theory of *human* cooperation that only works in pairs is insufficient.

  **6. Cognitive/Computational Tractability (Preference)**
  *   **Requirement:** The strategy must be executable by agents with bounded memory and processing power.
  *   **Consideration:** This distinguishes traditions. Evolutionary biologists often assume simple heuristics; economists often assume hyper-rationality; computer scientists assume algorithmic complexity. Requiring this filters out strategies that are equilibria only for omniscient agents.
  *   **Status:** *Preference.* A gene-level story might tolerate complex machinery if the "computation" is physiological; a cultural story requires learnability.

  **7. Substrate Neutrality (Preference)**
  *   **Requirement:** The theory should not depend exclusively on genetic relatedness or exclusively on cultural transmission unless justified by the specific case.
  *   **Consideration:** Cooperation occurs in bacteria (genetic), humans (bio-cultural), and digital networks (algorithmic).
  *   **Status:** *Preference.* Some camps insist on gene-level selection as the only "ultimate" explanation; others accept cultural group selection. This specification allows either, provided they meet the non-negotiables.

  ---

  ### Analysis of the Software Agent Case

  **The Mechanism:**
  This case describes **Program Equilibrium** (or Algorithmic Correlation). It is not strictly Direct Reciprocity (no repeated interaction with the *same* partner instance) nor standard Indirect Reciprocity (reputation based on *behavioral history*). It is a form of **Transparent Commitment**. Because the code is auditable, the agent knows *with certainty* how the counterpart will respond to its own code before execution.

  **Collapse or Distinct?**
  Under this specification, the mechanism collapses into **Indirect Reciprocity** but shifts the "image score" from *behavior* to *source code*. The "reputation" is attached to the policy, not the player. However, it is distinct in that it removes the *inference* problem. Standard reputation requires observing past actions to infer type; this setup allows verifying the type directly.

  **Requirement Satisfied Trivially:**
  **Baseline Anomaly Coverage (One-Shot).** Humans struggle here because they cannot credibly commit to cooperate in a one-shot game without external enforcement or internalized norms. The software agent satisfies this trivially because the code *is* the commitment. If the code says `if opponent_cooperates: cooperate`, it cannot lie. This solves the one-shot anomaly without needing a story about where a norm came from; the "norm" is the deployed algorithm.

  **Requirement Strained:**
  **Cognitive/Computational Tractability.** Humans pass this easily using heuristics (e.g., "look them in the eye," "check their accent"). Software agents strain here because **auditing code is undecidable** in the general case (Halting Problem). To verify how Copy A will interact with Copy B, Copy A may need to simulate Copy B, which may try to simulate Copy A. In a world of complex strategies, the computational cost of verification may exceed the benefit of cooperation, causing the mechanism to fail where human heuristic judgment succeeds.

  ---

  ### Tensions and Eliminations

  **The Impossible Pair:**
  **Scalability** and **Second-Order Stability**.
  As group size ($N$) increases, the cost of monitoring who punished whom (required for Second-Order Stability) scales faster than the benefits of cooperation. In small dyads, I can see if you punished the defector. In a group of 100, tracking second-order free-riders requires an administrative overhead that consumes the surplus generated by cooperation. You can have stable punishment in small groups, or you can have large groups, but you cannot have stable second-order punishment in large groups without introducing a specialized enforcement class (police), which changes the game structure entirely.

  **The Biggest Eliminator:**
  **Second-Order Stability.**
  This requirement eliminates the largest class of plausible accounts: **Costly Punishment models.** Many prominent theories argue that cooperation is sustained by altruistic punishment. However, once you ask "who punishes the non-punisher?", the majority of these models cannot answer without assuming the very altruism they are trying to explain. It forces the theory to either posit meta-punishment (which leads to infinite regress) or institutional enforcement (which changes the game).

  ### Closing Assessment

  This specification hurts **Direct Reciprocity (Tit-for-Tat)** the most. It fails Noise Immunity (one error triggers eternal defection) and struggles with Scalability (it is inherently dyadic). It also severely damages **Pure Rational Choice** accounts, which cannot meet Baseline Anomaly Coverage without importing norms they cannot explain. Conversely, the specification lets **Cultural Group Selection** off more easily than expected; because it operates on group-level variance, it can bypass the Second-Order Stability problem (groups with punishers outcompete groups without, regardless of individual fitness costs) and handles Scalability well. It also favors the **Software Agent** case over the human case regarding the One-Shot anomaly, suggesting that in mediated, high-transparency environments, cooperation may become *easier* to sustain than in face-to-face interaction, provided the computational cost of auditing does not become prohibitive.
