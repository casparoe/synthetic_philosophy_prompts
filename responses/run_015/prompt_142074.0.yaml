answer: |-
  # Activity Design: The Wheel of Slippage

  ## 1. Materials & Setup
  **You need to print/cut:**
  1.  **The Wheel Handout (1 per person):** A circle with the five symbols in clockwise order: **◆ $\to$ ▲ $\to$ ■ $\to$ ● $\to$ ★ $\to$ (back to) ◆**. An arrow indicates clockwise is "forward" (+1).
  2.  **Warm-Up Envelopes (3 Types, labeled A, B, C):**
      *   **Type A (Global Movers):** 2 copies (for Groups 1 & 4).
      *   **Type B (Local Movers):** 2 copies (for Groups 2 & 5).
      *   **Type C (Unit Movers):** 1 copy (for Group 3).
  3.  **Target Problem Sheet (1 per person):** Identical for everyone.
  4.  **Prediction/Bet Slip (1 per group):** For the betting phase.
  5.  **Sticky Notes (3 colors):** For the debrief wall.

  **Room Setup:**
  *   5 tables/clusters of 3 chairs.
  *   Whiteboard divided into 5 sections (one per group).

  ---

  ## 2. The Microdomain (The Wheel)
  *Instructions on Handout:*
  "This is your entire universe. There are only five symbols.
  Order: **◆ $\to$ ▲ $\to$ ■ $\to$ ● $\to$ ★ $\to$ ◆**
  'Successor' means moving one step clockwise. 'Predecessor' means one step counter-clockwise.
  There is no beginning or end."

  ---

  ## 3. The Problem Sets

  ### Phase 1: Warm-Up Envelopes (Primings)
  *Each group opens only their envelope. They must solve the 3 examples and write down the **Rule** that fits all three.*

  **Envelope A (Global Successor)**
  1.  ◆ $\to$ ▲
  2.  ▲■ $\to$ ■●
  3.  ◆▲■ $\to$ ▲■●
  *   *Intended Rule:* Every symbol shifts to its successor (+1).

  **Envelope B (Rightmost Successor)**
  1.  ◆ $\to$ ▲
  2.  ▲■ $\to$ ▲●
  3.  ◆▲■ $\to$ ◆▲●
  *   *Intended Rule:* Only the rightmost symbol shifts to its successor (+1). The rest stay put.

  **Envelope C (Run as Unit)**
  1.  ◆◆ $\to$ ▲▲
  2.  ■■ $\to$ ●●
  3.  ◆◆■ $\to$ ▲▲●
  *   *Intended Rule:* A "run" (adjacent identical symbols) is a single object. The whole run shifts together. Single symbols shift normally.

  ### Phase 2: Target Problems (The Ambiguity)
  *Hand out to everyone. "Solve these two analogies. There is no single correct answer, but there are **consistent** answers. Write your answer and a 1-sentence justification."*

  **Target 1:**
  > **◆▲■  is  to  ▲■●**
  > **as**
  > **■●★  is  to  ?**

  *   *Answer A (Global):* **●★◆** (Everything +1).
  *   *Answer B (Local):* **■●◆** (Only last +1).
  *   *Answer C (Unit):* **●★◆** (Same as Global here, but justification differs: "Three singles shift").

  **Target 2:**
  > **◆◆▲  is  to  ◆▲■**
  > **as**
  > **■■●  is  to  ?**

  *   *Answer A (Global):* **●●★** (Everything +1. Ignores the run structure change in the example).
  *   *Answer B (Local):* **■■★** (Only last +1. Ignores the run shrinkage in the example).
  *   *Answer C (Unit):* **■●★** (The run of ■■ shrinks to ■, just as ◆◆ shrank to ◆ in the example. The single ● shifts to ★).
      *   *Note:* This is the critical conflict point. Group C sees a "run shrink." Groups A & B see "symbol shifts."

  ---

  ## 4. Payoff Scheme: "The Insight Market"
  *No money. Use checkmarks on the board.*

  1.  **Consistency Point (1 pt):** Awarded if your Target answer follows your Warm-Up rule.
  2.  **Prediction Point (2 pts):** In Phase 3, you bet on what *other* groups will answer. If you guess their answer correctly, you get points.
  3.  **Naturalness Point (1 pt):** In the debrief, if the class votes your answer as "most natural" (even if not their own), you get a point.

  ---

  ## 5. Timeline (75 Minutes)

  **00:00 – 00:05 | Distribution & Silence**
  *   Hand out Wheel Handouts and Warm-Up Envelopes.
  *   **Rule:** "Do not talk to other groups. Do not look at other envelopes. Solve your three examples. Write down your Rule."
  *   *Instructor:* Stand back. Do not explain. If asked "Is this right?", say "Does it fit all three?"

  **00:05 – 00:20 | Warm-Up Phase**
  *   Groups derive their rules.
  *   *Instructor:* Circulate. Ensure Group C understands the "Run" concept (point to the pair ◆◆ as one thing). Ensure Groups A & B don't peek.

  **00:20 – 00:35 | Target Phase**
  *   Collect Warm-Up sheets. Hand out Target Problems (same for everyone).
  *   **Task:** Solve Target 1 and Target 2 individually first (2 mins silent), then agree on a Group Answer.
  *   *Instructor:* Watch the friction in Group C on Target 2. They have to decide if the "run shrink" matters more than the "symbol shift."

  **00:35 – 00:50 | The Prediction Market**
  *   Hand out Bet Slips.
  *   **Task:** "You cannot talk to other groups. Look at your own Rule. Based on that, what do you think Group [X] answered for Target 2?"
  *   Each group writes down their prediction for the *other* 4 groups' answers to Target 2.
  *   *Instructor:* Collect Bet Slips. Write Group Answers for Target 2 on the Board (reveal).

  **00:50 – 01:05 | Reveal & Conflict**
  *   Compare Board Answers to Predictions. Award Points.
  *   **Key Moment:** Ask Group A: "Why did you think Group C would answer ●●★?" Ask Group C: "Why did you answer ■●★?"
  *   Let them argue briefly. Do not resolve it yet.

  **01:05 – 01:15 | Debrief (The Lecture)**
  *   Now you introduce the vocabulary. (See Debrief Script below).

  ---

  ## 6. Debrief Script & Theory Mapping
  *Do not start this until the clock hits 65:00.*

  **1. The "Given" is a Illusion (5 mins)**
  *   *Say:* "Look at Target 2. **■■●**. Is the answer ●●★ or ■●★?"
  *   *Map:* "You felt your answer was *obvious*. That obviousness didn't come from the symbols. It came from your Warm-Up. The concept of 'the same operation' bent to fit your context."
  *   *Term:* **Conceptual Slippage.** The relation 'same' slipped from 'same symbol shift' to 'same structural change.'

  **2. Cost of Slippage (5 mins)**
  *   *Say:* "Group C, your answer required seeing ◆◆ as one object, not two. That is 'expensive.' Group A, you just moved everything. That is 'cheap.'"
  *   *Map:* "Some slips are cheap (successor). Some are expensive (re-categorizing a run as a unit). We prefer cheap slips unless pressure forces us otherwise."
  *   *Term:* **Cognitive Economy / Pressure.**

  **3. Not Everything Goes (5 mins)**
  *   *Say:* "Did anyone answer 'Banana'? No. Why?"
  *   *Map:* "The domain resists. You can't slip *too* far. The wheel constrains you. Analogy isn't arbitrary; it's a negotiation between your context and the world's resistance."
  *   *Term:* **Domain Resistance.**

  ---

  ## 7. Predicted Pitfalls & Mitigations

  **1. The Relativist Collapse ("It's all arbitrary")**
  *   *Risk:* Students conclude that because answers differed, there is no truth.
  *   *Fix:* In the debrief, emphasize **Prediction Points**. "You successfully predicted Group A's answer. That means their thinking wasn't arbitrary; it was *determined* by their context. It's causal, not random."

  **2. The Steamroller (One loud student dominates)**
  *   *Risk:* One person dictates the group answer during Target Phase.
  *   *Fix:* Enforce the "2 mins silent writing" rule strictly. Collect the individual sheets before they discuss. If one voice dominates, ask: "Write down the *second* best answer your group considered."

  **3. Group C Confusion**
  *   *Risk:* Group C might not "get" the Run rule in the warm-up.
  *   *Fix:* If you see them struggling at min 10, give a non-verbal hint. Circle the ◆◆ on their sheet with a red pen and draw an arrow to the ▲▲. Do not speak.

  **4. Time Creep**
  *   *Risk:* Arguments during the Reveal phase eat the Debrief time.
  *   *Fix:* Be a tyrant about the clock. "Hold that thought. It will make sense in 10 minutes. Write it down."

  ---

  ## 8. Limitations (What to say in your own voice)
  *Be honest about what this activity cannot do.*

  1.  **It's too clean:** "In this activity, you consciously chose a rule. In real cognition, this happens sub-symbolically, in parallel, before you're aware. You didn't feel the competition between rules; you just felt the winner."
  2.  **It's too discrete:** "Real concepts aren't symbols on a wheel. They have texture, sensory weight, and emotional valence. This is a skeleton of analogy, not the flesh."
  3.  **It's too slow:** "You took minutes to slip. Your brain does this in milliseconds. We slowed it down to see the gears, but remember the gears usually spin too fast to see."

  ---

  ## 9. Instructor Cheat Sheet (Answers)

  | Group | Warm-Up Rule | Target 1 Prediction | Target 2 Prediction | Why they clash |
  | :--- | :--- | :--- | :--- | :--- |
  | **1 & 4 (A)** | Global +1 | ●★◆ | ●●★ | Sees symbols as independent atoms. |
  | **2 & 5 (B)** | Rightmost +1 | ■●◆ | ■■★ | Sees string as fixed container, only edge moves. |
  | **3 (C)** | Run Unit | ●★◆ | **■●★** | Sees **structure** (runs) as the object, not just symbols. |

  *Note: Target 1 is designed to look like A and C agree, but Target 2 forces them apart. This makes the debate specific to Target 2.*

