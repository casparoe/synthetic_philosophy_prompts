answer: |-
  **Title:** The Fragmented Agent: Why the Escalator Confirms the Failure of Expected Utility

  **Abstract:** This essay argues that L.A. Paul's challenge to expected utility theory represents a genuine normative failure, not merely an epistemic inconvenience. Contrary to the "ordinary competence" objection raised by students, the ability to make transformative choices without paralysis does not demonstrate the success of rational choice theory, but rather the reliance on non-rational heuristics. Furthermore, the "Escalator" thought experiment does not dissolve the problem through incremental learning; it exacerbates it by revealing a structural conflict of diachronic authority. The burden of proof lies on the defender of expected utility to explain how stable utility values are assigned to outcomes that fundamentally alter the valuer. The verdict is that standard rational choice theory breaks down in transformative contexts, and the Escalator demonstrates that this breakdown is ontological, not merely epistemic.

  ***

  ### I. The Stalemate and the Burden of Proof

  The standard pedagogy around L.A. Paul's *Transformative Experience* often reaches a predictable impasse. Paul argues that in decisions like becoming a parent or, hypothetically, a vampire, the agent cannot assign a utility value to the outcome because they cannot know the phenomenal character of that outcome from their current epistemic standpoint. Since Expected Utility (EU) theory requires utilities as inputs, the calculation cannot run. The student pushback is pragmatic: "People make these choices constantly. They use testimony, imagination, and heuristics. They don't freeze. Therefore, the theory must be flexible enough to accommodate this."

  This pushback relies on a category error. It conflates *successful coping* with *rational justification*. That agents routinely jump off cliffs and land safely does not prove they calculated the trajectory; it proves they have good instincts or luck. To resolve the dialectic, we must first pin down the burden of argument.

  The burden lies squarely on the defender of Expected Utility. EU is a formal model that demands specific inputs: probabilities and utility values. In a standard decision (e.g., taking an umbrella), the utility of "staying dry" is commensurable with the utility of "carrying a burden" for the *same* agent across the timeline. The agent's evaluative standpoint remains stable. In a transformative choice, the outcome changes the agent's evaluative standpoint. If I choose to have a child, the "me" who experiences the outcome has different values than the "me" who chooses it.

  For EU to hold here, the defender must explain what number is being plugged into the utility function *ex ante*. If the answer is "I guess based on what others say," the model is not measuring *my* expected utility; it is measuring my expectation of *someone else's* utility. If the answer is "I imagine it," Paul has already shown that imagination is epistemically bankrupt for radically new phenomenal states. If the answer is "I use a proxy value," then the agent is not maximizing utility for the actual outcome, but for a placeholder.

  Therefore, the student claim that "ordinary resources handle this" is an empirical observation about human resilience, not a theoretical defense of rational choice. Ordinary resources (testimony, simulation, gut feeling) are heuristic workarounds that allow us to bypass the calculation, not complete it. The fact that we do not freeze proves that human agency is more robust than EU theory, not that EU theory is sufficient for human agency. The failure is real: the formal requirements of rational choice cannot be met without begging the question.

  ### II. The Escalator: Dissolution or Amplification?

  This brings us to the Escalator. The intuition behind the Escalator is that if we break the transformative leap into eight reversible, graded doses, we restore the epistemic conditions for EU. At Rung 1, I try a little. I learn what it's like. I update my priors. I decide on Rung 2. This looks like standard sequential decision theory. If the ladder dissolves the problem, it must be because the *feedback loop* allows for utility assignment.

  I argue that the Escalator does not dissolve the problem; it reproduces it in miniature at every step, while adding a second, more troubling layer: the problem of diachronic authority.

  The feature of the Escalator that *seems* to do the dissolving work is **phenomenal feedback**. The agent gains access to the "what it is like" before committing fully. However, this feature is not present in the one-shot case, and its presence in the Escalator does not save EU; it merely shifts the locus of the breakdown.

  In the one-shot case, the problem is epistemic: I don't know the value. In the Escalator case, the problem becomes **constitutive**. At Rung 3, I have phenomenal access to Rung 3. I do *not* have phenomenal access to Rung 6. I must decide for Rung 6 based on Rung 3's values. But Rung 3's values have already been altered by Doses 1–3. I am no longer the original agent.

  If the Escalator dissolves the problem, it must be because the preference drift is negligible. But if the transformation is genuine (as Paul stipulates), the preference drift is the *point*. If Dose 4 changes my sensory modality significantly, then Rung 3 self is making a decision for Rung 4 self using a utility function that Rung 4 self may reject.

  Consider the specific normative description of the agent standing at Rung 3. She is not a maximizer. She is a **trustee for a successor**. She holds the authority to commit resources and bodily integrity to a future person whose values she can partially anticipate but cannot fully endorse. This is not self-creation, because "self" implies a continuity of valuation that is breaking down. It is not self-experimentation, because the "self" being experimented on is not the one signing the consent form.

  The Escalator reveals that the "ordinary resources" students rely on are actually a form of **successive colonization**. Rung 1 colonizes Rung 2; Rung 2 colonizes Rung 3. Each stage justifies the next not because the *original* agent's utility is maximized, but because the *current* agent's utility is maximized *given the changes already wrought*. This is a local rationality, not a global one. The original agent (Rung 0) cannot rationally endorse the climb to Rung 8 using EU, because Rung 0 cannot assign utility to Rung 8's state. Rung 0 can only assign utility to "becoming the kind of person who climbs." But that is a preference for self-annihilation, which EU cannot process without contradiction.

  ### III. The Pre-Commitment Objection

  A sophisticated objector might suggest: "Hand the decision to the future self via binding pre-commitment." I decide at Rung 0 that I will climb to Rung 8, and I bind myself so I cannot stop.

  This does not solve the puzzle; it relocates it. If I bind myself at Rung 0, I am imposing Rung 0's values on Rung 8. If Rung 8 finds the experience horrific (by Rung 8's lights), Rung 0 has tyrannized Rung 8. If I wait and let Rung 7 decide for Rung 8, I am letting preferences *shaped by the transformation* settle whether to undergo it. This is circular. It is like asking a religious convert whether they are glad they were converted. Their "yes" is guaranteed by the conversion itself.

  This confirms that the problem is not a lack of information. Even with the Escalator's perfect information flow, the *authority* to evaluate is fragmented. The "ordinary resources" students cite work only because we typically ignore the fragmentation. We assume the "I" who chooses is the same "I" who experiences. The Escalator makes it impossible to ignore that they are different.

  ### IV. The Verdict

  We must now pick a side. Is there a genuine normative problem, or do ordinary resources suffice?

  **The Verdict:** There is a genuine, distinctive normative failure of standard rational choice theory in transformative contexts. The "ordinary resources" objection fails because it mistakes *psychological possibility* for *rational permissibility*.

  Here is the defense of this verdict, pinned to your two requirements:

  **1. The Burden of Argument:**
  The burden lies on the defender of Expected Utility to demonstrate a stable evaluative standpoint. In transformative choices, no such standpoint exists. To claim that "people do this all the time" is to claim that people successfully drive cars without headlights. They might do it (using streetlights, memory, luck), but the lack of headlights is a genuine deficit in the driving conditions. Similarly, the lack of a stable utility function is a genuine deficit in the rational conditions. The defender of EU must show how to assign a value to an outcome that changes the valuer without begging the question. They cannot do this. Therefore, EU breaks down.

  **2. The Escalator Analysis:**
  The Escalator does not dissolve the problem. The feature that *appears* to dissolve it is **incremental revelation**. However, this feature fails to save EU because it introduces **preference drift**.
  *   **Why it doesn't apply to the one-shot case:** In the one-shot case, the drift happens all at once, masking the conflict. In the Escalator, the drift is stepwise, making the conflict visible.
  *   **Normative Description at Rung 3:** The agent at Rung 3 is not maximizing utility. She is **ratifying a trajectory**. She is acknowledging that her current values are provisional and that she is authorizing a future agent to override them. This is not a rational choice in the EU sense; it is a *commitment* in the existential sense. It is a decision to surrender rational sovereignty to a future self whose values are currently inaccessible.

  If we accept the student pushback—that ordinary resources suffice—we are forced to say that an agent who chooses to become a vampire based on a hunch is reasoning just as well as an agent who chooses a salad based on nutritional data. This collapses the distinction between *rational calculation* and *adaptive behavior*.

  ### V. Conclusion

  The discomfort your students feel is appropriate, but they are diagnosing it incorrectly. They feel the theory is too demanding because it tells them they can't rationally choose the most important things in life. The correct diagnosis is that the theory is *descriptively accurate* about the limits of rationality. Transformative choices are not rational choices in the expected-utility sense. They are leaps of faith, structured by commitment rather than calculation.

  The Escalator proves this. If the ladder saved EU, climbing it would be a series of maximizing moves. But because each rung changes the maximizer, the climb is a series of local optimizations that may constitute a global disaster for the original self. The agent at Rung 3 is not a captain steering a ship; she is a passenger handing the wheel to a stranger who looks vaguely like her.

  Therefore, the week on transformative experience should not end with a solution. It should end with the recognition that practical rationality has a boundary. Beyond that boundary lies not irrationality, but a different mode of agency: one of exploration, commitment, and trust. To pretend EU covers this is to misunderstand both the theory and the experience. The problem is real, the Escalator confirms it, and the "ordinary resources" are merely the life rafts we use when the ship of rational choice has already sunk.
