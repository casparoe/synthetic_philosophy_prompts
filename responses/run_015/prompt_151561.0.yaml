answer: |-
  ### Specification for a Cost-Effectiveness Theory of Well-Being

  **Context:** The theory must generate a cardinal utility value $W_{p,t}$ for each person $p$ in year $t$, suitable for summation or transformation within a fixed-budget optimization algorithm.

  #### 1. Desiderata

  **D1. Cardinality and Completeness**
  *   **Specification:** The theory must return a single real number for any given person-year state. It must not return "incomparable," "undefined," or a vector of incommensurable goods.
  *   **Motivation:** Cost-effectiveness algorithms (e.g., ICER calculations) require a common denominator to rank interventions. Incomparability halts allocation.
  *   **Status:** **Non-negotiable.** (Mathematical necessity for the specified purpose).

  **D2. Interpersonal Comparability**
  *   **Specification:** A unit of well-being for Person A must be exchangeable for a unit of well-being for Person B within the aggregation function.
  *   **Motivation:** Public budgeting requires trade-offs across citizens. Without comparability, the budget cannot be optimized across the population.
  *   **Status:** **Non-negotiable.** (Definition of the allocation problem).

  **D3. External Validity (The Experience Machine Test)**
  *   **Specification:** The theory must assign a lower well-being value to the standard Experience Machine (pure phenomenology, no reality) than to a veridical life of equivalent phenomenology. Regarding the **Authorized Agent Variant** (subject in machine, truthfully informed that authorized projects are succeeding outside): The theory must register a well-being *increase* relative to the standard machine.
  *   **Motivation:** Public funds aim to improve actual conditions, not merely induce contentment. If knowledge of external success does not raise well-being, the theory ignores agency and reality, leading to policy that funds "happy slaves" over "struggling free agents."
  *   **Status:** **Non-negotiable.** (Policy integrity; distinguishes welfare from sedation).

  **D4. Adaptation Protocol (The Set-Point Constraint)**
  *   **Specification:** Given that self-report is the only scalable instrument, the theory must specify a correction factor for hedonic adaptation. If a subject's set-point shifts downward (e.g., due to oppression) and they report stability, the theory must not treat this as equal well-being to a non-oppressed baseline.
  *   **Motivation:** Self-reports track *changes* in state better than *levels* of state. Uncorrected reports validate the "happy slave" paradox, where adaptation masks deprivation.
  *   **Status:** **Non-negotiable.** (Prevents perverse incentives to suppress expectations rather than improve conditions).

  **D5. Duration-Intensity Integration**
  *   **Specification:** The theory must define a continuous function mapping intensity and duration to a single quantity (e.g., area under the curve). It cannot treat short, intense peaks as lexically superior to long, moderate states without a defined exchange rate.
  *   **Motivation:** Interventions vary in longevity and magnitude. The budget allocator needs to know if one year of +5 utility equals five years of +1 utility.
  *   **Status:** **Non-negotiable.** (Required for person-year aggregation).

  **D6. Aggregation Rule for Trade-offs**
  *   **Specification:** The theory must specify how to weigh one person's gain against another's loss (e.g., utilitarian sum, prioritarian weighting, or sufficientarian threshold). It cannot remain silent on distribution.
  *   **Motivation:** Budget constraints create zero-sum scenarios. A theory of well-being that does not license interpersonal trade-offs cannot guide allocation.
  *   **Status:** **Preference of one camp.** (Utilitarians demand summation; Egalitarians demand weighting. The *existence* of a rule is non-negotiable; the *shape* of the rule is normative).

  ***

  #### 2. The Unsatisfiable Subset (The Trilemma)

  You suspected a conflict between **Deference**, **Correction**, and **Measurability**. This conflict is **real**, not an artifact of phrasing. You cannot hold the following three jointly:

  1.  **Strict Deference:** The subject's considered self-report is the final authority on their well-being.
  2.  **Adaptation Correction:** The allocator adjusts self-reports to account for shifted set-points or misinformation (as required by **D4**).
  3.  **Self-Report Measurability:** Self-report is the *only* instrument available at population scale (as stipulated in your prompt).

  **Analysis:** If you defer (1), you cannot correct (2). If you correct (2), you are asserting the self-report is wrong, violating deference (1). If you reject self-report to correct the error, you violate the measurability constraint (3) because no other scalable instrument exists.
  **Resolution for this Specification:** To meet **D4** (Non-negotiable), you must sacrifice **Strict Deference**. The theory must treat self-report as *data* to be modeled, not *truth* to be accepted. This implies a paternalistic element is required for the specification to function.

  ***

  #### 3. The Exclusionary Requirement

  The single requirement that does the most work in excluding candidate theories is **D1 (Cardinality and Completeness) combined with D2 (Interpersonal Comparability).**

  Most philosophical theories of well-being are ordinal, intransitive, or explicitly incomparable across persons. Desire-satisfaction views often fail here (preferences are ordinal and idiosyncratic). Objective-list views often fail here (goods are incommensurable). Only theories that reduce well-being to a homogeneous psychological metric (like hedonic tone or standardized preference-utility) survive this filter.

  ***

  #### 4. Theory Scorecards

  **Hedonism:** Meets measurability and comparability easily, but fails D3 (External Validity) unless modified to value "truth" as a distinct pleasure.
  **Desire-Satisfaction:** Meets D3 (Authorized Agent) well, but fails D1/D2 (Cardinality/Comparability) due to intransitive preferences and lack of interpersonal scale.
  **Objective-List:** Meets D3 and D4 (Correction) naturally, but fails D1 (Measurability) as it cannot reduce diverse goods to a single self-reportable number.
