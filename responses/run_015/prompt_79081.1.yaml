      *   7,000 words? Check.
      *   Honest about failure conditions? Check.
      *   Reframe if confused? I will frame it as a hypothesis to be tested, allowing for the possibility that it collapses.

  7.  **Final Polish:** Check for clarity, flow, and persuasive academic voice. (Ensure the distinction between "indeterminate" and "impossible" is highlighted as the key payoff).

  *(Self-Correction Note during final review)*: I need to make sure I don't accidentally validate the user's idea as *correct*. The prompt says "If my distinction or my criterion turns out to be confused, say so and reframe." Since I am writing the proposal *for* them to submit, I must write it as *their* voice, but maintaining scientific integrity. I cannot say "This is definitely right." I must say "This project investigates whether this is right." The proposal itself must embody the openness to failure.

  Let's organize the Work Plan carefully.
  Month 1: Conceptual groundwork & formalizing robustness.
  Month 2: Applying to cases (Lamp, Dimmer, others).
  Month 3: Writing and addressing objections (circularity charge).

  Let's refine the "Success/Failure" section.
  Success: Robustness successfully separates the cases without begging the question.
  Failure: Robustness is shown to be equivalent to continuity (redundant) or relies on arbitrary metrics (circular).

