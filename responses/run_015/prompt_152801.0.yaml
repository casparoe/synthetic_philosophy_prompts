prompt: |-
  I'm a novelist and I'm trying to write a dinner-table argument about healthcare that doesn't read like cable news, and I've realised I don't actually understand why the argument never goes anywhere. Two of my friends — an ER doctor who wants single payer, a health economist who wants more market in it — have been having basically the same exchange for a decade. They agree on a lot: the US spends far more for worse population health, emergency departments are a lousy way to deliver primary care, nobody should be bankrupted by getting sick, administrative billing is a parasite. And whenever a new study lands, each absorbs it without moving. The doctor's case is mostly about people skipping doses and dying with insurance paperwork in hand, and about care being something you're owed rather than something you shop for; the economist's is about queues, about prices doing work that rationing-by-waiting doesn't, about who pays for the next drug if nobody can charge for it, and about the option to buy above whatever floor exists.

  My pet theory, which I want you to try to break, is that they're not describing the same object: each is picturing the other side's system as it would actually be implemented here, by legislators and insurers they don't trust, while picturing their own as it exists in the head of the person proposing it. I've started calling it the offstage-system problem. If that's right the hidden question is empirical but unanswerable — what this system would mutate into in our politics — and the stalemate is just the absence of the experiment. But maybe it's simpler than that: a values fight dressed as a predictions fight, or a fight about whether we're maximising a floor nobody falls below or the freedom to buy above it, and neither says which.

  Diagnose it using what each side actually argues, tell me whether my offstage-system thing is doing real work or is just a fancy way of saying they distrust each other, and tell me what would count as progress — a distinction, a kind of evidence, a different question — or whether I should accept it doesn't resolve and write the scene that way.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Goal:** Write a realistic dinner-table argument about healthcare for a novel.
      *   **Problem:** The argument feels like cable news (shouty, superficial) or goes nowhere (stalemate).
      *   **Characters:**
          *   Friend A: ER Doctor (Pro-Single Payer). Focus: Moral obligation, human cost (skipping doses, death by paperwork), care as a right.
          *   Friend B: Health Economist (Pro-Market). Focus: Incentives, queues, innovation funding, price signals, option to buy above the floor.
      *   **Common Ground:** US spends too much for worse outcomes, ERs are bad for primary care, bankruptcy by sickness is bad, administrative bloat is bad.
      *   **User's Theory:** "The Offstage-System Problem." Each side imagines their own system ideally and the other's system as implemented by corrupt/incompetent US politics.
      *   **Tasks:**
          1.  Diagnose the argument using what each side actually argues.
          2.  Evaluate the "Offstage-System" theory (is it real or just distrust?).
          3.  Define what "progress" would look like (distinction, evidence, question) OR advise accepting the stalemate.
          4.  Keep it nuanced, avoiding cable news tropes.

  2.  **Deconstruct the Argument (The Diagnosis):**
      *   *The Doctor's Core:* Deontological ethics. Care is a human right. The system *must* guarantee access. The failure mode they fear is *exclusion* (people dying because they can't pay). They see the market as inherently exclusionary.
      *   *The Economist's Core:* Consequentialist/Utilitarian ethics. The system *must* be sustainable and innovative. The failure mode they fear is *stagnation* (no new drugs, long wait times, rationing). They see single-payer as inherently rationing.
      *   *The Overlap:* Both hate the *current* US system. This is crucial. They are allies against the status quo, but enemies on the replacement.
      *   *The Disconnect:* They are optimizing for different variables. Doctor = Minimum Floor (Equity). Economist = Maximum Ceiling (Liberty/Innovation).

  3.  **Evaluate the "Offstage-System" Theory:**
      *   *Is it valid?* Yes, but it's deeper than just "distrust." It's about *implementation risk* vs. *theoretical purity*.
      *   *Doctor's view of Market:* Sees the theoretical "efficient market" but knows the real-world "monopoly pricing." They imagine the Economist's system as *current US healthcare on steroids*.
      *   *Economist's view of Single Payer:* Sees the theoretical "universal care" but knows the real-world "bureaucratic bottleneck." They imagine the Doctor's system as *VA Hospital for everyone*.
      *   *Is it just distrust?* No, it's about *institutional capacity*. The US government has a track record of complexity; US corporations have a track record of rent-seeking. Both are betting against the other's preferred vehicle being corrupted by the US political ecosystem.
      *   *Verdict:* The theory is strong. It explains the stalemate. It's not just "I don't trust you," it's "I don't trust the *machine* you want to put this lever into."

  4.  **Determine What Counts as Progress (or Lack Thereof):**
      *   *Can it be resolved?* No. It's a values clash disguised as policy.
      *   *What moves the needle?* Acknowledging the trade-off.
      *   *The "Different Question":* Instead of "Which system is better?", ask "Which failure mode is more tolerable?" (Queues vs. Bankruptcy).
      *   *Writing Advice:* Don't resolve it. The tension *is* the scene. The intimacy comes from knowing *why* they disagree, not changing minds.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's observation. It's a sophisticated take on a common trope.
      *   *Section 1: Diagnosis.* Break down the Doctor vs. Economist. Highlight the "Floor vs. Ceiling" dynamic. Use the "Common Enemy" (Status Quo) to show why they are friends despite disagreement.
      *   *Section 2: The Offstage-System Theory.* Validate it. It's not just distrust; it's "Local Maxima." The Doctor sees the Economist's ideal as impossible in US politics. The Economist sees the Doctor's ideal as brittle in US implementation. Give specific examples (VA vs. UnitedHealth).
      *   *Section 3: Progress vs. Stalemate.* Advise *against* resolution. Resolution kills realism. Suggest the "Trade-off Acknowledgement" as the peak of the scene.
      *   *Section 4: Writing the Scene.* Give concrete tips on dialogue. Avoid jargon. Focus on anecdotes (the patient vs. the graph). Show the affection/frustration.

  6.  **Refining the Insights (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound like I'm taking sides. Stay neutral.
      *   *Nuance:* The Economist isn't just "greed." They care about innovation. The Doctor isn't just "feelings." They see dead bodies.
      *   *The "Offstage" nuance:* It's not just "US politics." It's that the Doctor trusts *clinical judgment* over *price signals*, and the Economist trusts *incentives* over *benevolence*.
      *   *Key Insight:* The argument persists because both are right about the *other* system's vulnerability, and both are right about their own system's ideal.

  7.  **Final Polish:** Check tone. Ensure it sounds like advice for a writer (focus on subtext, character dynamics) while answering the policy question deeply. (The user is smart; don't dumb it down.)

      *(Self-Correction on the "Offstage" theory)*: I need to be careful. Is it *just* distrust? It's actually about *asymmetric risk*. The Doctor fears immediate death (visible). The Economist fears long-term collapse (invisible). The "Offstage" theory captures the *political* translation of these risks. I will affirm the theory but deepen it.

  8.  **Final Output Structure:**
