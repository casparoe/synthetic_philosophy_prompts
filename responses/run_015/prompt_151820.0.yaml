answer: |-
  Dear Colleague,

  Thank you for sharing this observation, which strikes me as both profound and urgently practical. You have put your finger on a structural paradox that haunts much of the contemporary literature on transitional justice and state reconciliation, yet it is often obscured by the moral urgency that surrounds these acts. It is refreshing that you are looking past the question of sincerity, because as you note, the phenomenon you describe operates regardless of the interior state of the officials involved. It is a matter of function, not motive. While there is no single universally accepted term that captures the exact configuration you describe, there are several adjacent concepts in political philosophy, sociology, and legal theory that we can draw upon to carve out the definition you need.

  The term your colleague offered, virtue signaling, is indeed insufficient because it presumes a cynical motive and implies the signal is cheap. What you are describing is a signal that is fully credited, even costly in terms of political capital spent on the admission itself, yet it functions to insulate the sender from further claims. The concept of the non-apology is also incorrect, as you say, because the speech act is linguistically complete. The nearest existing psychological concept is moral licensing, where an initial moral act licenses subsequent immoral or neutral behavior, but this is usually applied to individuals. At the state level, the work of political theorist Glen Coulthard is perhaps the most relevant existing framework. In his critique of the politics of recognition, Coulthard argues that when a colonial state recognizes the identity or grievances of indigenous peoples, it often reinforces the state's own legitimacy rather than dismantling the structures of dispossession. The state becomes the benevolent grantor of recognition, and its standing rises precisely because it has demonstrated its capacity for moral reflection. This aligns with your observation that the state's standing rises even when the apology is rejected. The apology becomes a performance of state capacity and moral adulthood, rather than a tool of relational repair.

  Another relevant framework comes from Jeffrey Olick's work on the politics of regret, which examines how nations manage past guilt. Olick suggests that public apologies can become a way for states to manage their own identity rather than address the needs of the victim. However, neither Coulthard nor Olick fully captures the specific dynamic you noted regarding the reaction to rejection. For that, we might look to the philosophical work of Nick Smith on the structure of apology. Smith argues that a valid apology requires uptake from the victim to be complete. What you are describing is a scenario where the state treats the apology as complete upon utterance, rendering the victim's uptake optional. When the victim refuses uptake, the state interprets this not as a failure of the apology, but as a failure of the victim to recognize the state's moral maturity.

  Given these neighbors, I would propose naming this phenomenon performative absolution. This label distinguishes it from virtue signaling by acknowledging the sincerity of the act while highlighting its function as a self-administered sacrament. In performative absolution, the state confesses to cleanse its own conscience and secure its own moral standing in the present, effectively discharging the debt unilaterally. The boundary cases for this concept would be apologies that are explicitly conditional on future behavior or those that are legally tied to restitution packages where the apology is merely the preamble to material transfer. In those cases, the apology is not absolution but a contract. In performative absolution, the apology is the endpoint.

  Regarding your second question about the temporal framing, I believe this is not a separate failure but the primary mechanism by which performative absolution is achieved. By locating the wrong wholly in the past, the state creates a temporal boundary that matches the social boundary. If the harm is finished, then the apology is sufficient. If the harm continues in the form of material disadvantage, then the apology is insufficient. Therefore, the rhetorical move to contain the wrong in the past is the necessary condition for the social dynamic you observed. It allows the domestic audience to view the apology as a closure of a historical chapter rather than the opening of a restitutionary process. When the descendants insist on restitution, they are violating this temporal contract, which is why the domestic audience reads them as reopening settled matters. The two phenomena are one structure: the temporal containment enables the social absolution.

  To diagnose this in practice, you should look for specific syntactic and sequencing markers in the draft statements. Syntactically, watch for a preponderance of verbs focused on the state's feelings or values rather than the victim's loss. Phrases like we acknowledge, we regret, or we are committed to a shared future often center the state's moral journey. A diagnostic test is to remove the name of the victim group from the text; if the statement still makes sense as a declaration of the state's values, it is likely performative absolution. Sequencing is also critical. If the apology is scheduled as a standalone event, particularly before any legislation regarding restitution or land return is finalized, it functions as a substitute. If the apology is embedded within a legislative process or tied to specific material commitments, it is less likely to function as absolution. You should also look for the use of the past perfect tense regarding the harm contrasted with the present tense regarding the state's values. This grammatical shift reinforces the temporal containment.

  As for whether a government can apologize without triggering this dynamic, it is difficult but not impossible. It requires the state to relinquish sovereignty over the meaning of the apology. This means the apology cannot be a unilateral declaration. It must be co-authored or at least vetted by the representatives of the wronged group, and it must explicitly refuse closure. The text should state that the apology is not sufficient and is only the first step of a process defined by the victims. It must avoid the language of moving on or turning the page. Instead, it should use language of opening, beginning, or submitting. The timing must be synchronized with material transfer, so that the apology is understood as an admission of liability rather than a discharge of it. Ultimately, the state must be willing to accept that its standing may not rise, and may indeed fall, as a result of the apology, because the focus must shift from the state's moral character to the victim's material condition. If the state is unwilling to risk its standing, then the apology will inevitably revert to performative absolution.

  I hope this provides a useful vocabulary for your panel's deliberations. You are asking the right questions, and the fact that you are attentive to these structural nuances suggests your work will be of genuine consequence.

  Warmly,

  Your Correspondent
