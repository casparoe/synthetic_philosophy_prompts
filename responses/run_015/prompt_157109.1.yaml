answer: |-
  **Project Title:** The Intrapersonal Utility Monster: Testing the Separateness of Persons Objection

  **Research Question**
  Is the intuitive force of the Utility Monster argument grounded in the violation of the *Separateness of Persons*, or does it arise from the structural properties of aggregative axiologies *simpliciter*?

  Standardly, the Utility Monster is presented as a reductio of classical Utilitarianism specifically because it aggregates welfare across distinct moral agents. The objection relies on the intuition that one person's massive capacity for enjoyment cannot morally outweigh the basic needs of many others. However, if we construct an intrapersonal analogue—where a single agent's future self possesses a vastly higher capacity for welfare than their present self—the structural aggregation remains identical, yet the moral intuition often dissipates. This project asks whether the 'Separateness of Persons' is the actual driver of the objection. If the intrapersonal case is also intuitively objectionable, the problem lies with aggregation itself, threatening views like Prioritarianism which claim to respect separateness while retaining aggregation. If the intrapersonal case is intuitively permissible, the Separateness of Persons is doing the heavy lifting, and the Monster remains a specific critique of interpersonal utilitarianism.

  **Background: Why the Debate Remains Open**
  The standard dialectic leaves this question unresolved because it treats interpersonal and intrapersonal aggregation as distinct domains governed by different norms. In moral philosophy, the Utility Monster is deployed to show that summing welfare across persons ignores the distinction between them (a la Nozick). In decision theory and prudential rationality, however, aggregation across time within a single life is typically assumed to be unproblematic; rational prudence is often modelled as maximising total lifetime welfare.

  Consequently, philosophers rarely test the Monster intuition against the intrapersonal case. The assumption is that what is repugnant in the moral case is the sacrifice of one person for another, not the sacrifice of utility for greater total utility. This assumption goes untested. It is possible that the repugnance stems not from *who* is losing out, but from the linear aggregation function itself. If the latter is true, the Utility Monster is not a argument for the Separateness of Persons, but an argument against unconstrained maximisation in any context. The current literature treats these as separate puzzles, leaving the structural comparison unexamined.

  **Methodology**
  To resolve this, I will construct a controlled comparison between interpersonal and intrapersonal cases, isolating the variable of personhood.

  1.  **Taxonomy of Monsters:** I will distinguish two versions of the Utility Monster to ensure precision:
      *   *The Conversion-Rate Monster:* Resources yield more utility for the monster than for others (efficiency).
      *   *The Capacity Monster:* The monster has a higher ceiling for total utility (saturation point).
  2.  **Constructing the Analogues:** I will build intrapersonal analogues for both versions.
      *   *Case A (Interpersonal):* Person X (Monster) vs. Persons Y–Z (Normal).
      *   *Case B (Intrapersonal):* Time-Slice T1 (Normal Capacity) vs. Time-Slice T2 (Monster Capacity).
      *   Crucially, I will bracket deep metaphysical questions of personal identity by stipulating psychological continuity sufficient for standard prudential concern, focusing purely on the normative weight of the aggregation.
  3.  **Testing Prioritarianism:** I will apply a Prioritarian calculus to both cases. Prioritarianism assigns greater moral weight to benefits conferred on the worse off.
      *   If Prioritarianism resolves the interpersonal Monster (by favouring the worse-off normal people) but fails to resolve the intrapersonal Monster (implying T1 should still sacrifice for T2), this suggests the 'Separateness of Persons' is the relevant variable that Prioritarianism successfully captures.
      *   If Prioritarianism fails to resolve the intrapersonal case in a way that aligns with our intuitions (i.e., if it still demands T1 starve for T2, and we find that repugnant), then the objection is to the aggregation function itself, not the interpersonal boundary.

  **Possible Conclusions and Decision Criteria**
  There are three primary outcomes, decided by introspective testing of the intrapersonal cases:

  *   **Conclusion 1 (SoP is Decisive):** The intrapersonal monster is intuitively permissible (it is rational for T1 to sacrifice for T2).
      *   *Implication:* The Utility Monster argument relies entirely on the interpersonal boundary. Prioritarianism is vindicated as a superior view because it respects this boundary.
  *   **Conclusion 2 (Aggregation is the Problem):** The intrapersonal monster is intuitively repugnant (it is irrational/objectionable for T1 to sacrifice for T2).
      *   *Implication:* The Separateness of Persons is doing no work. The objection is to linear aggregation. This damages Prioritarianism, as it retains aggregation. We would need a non-aggregative view (e.g., sufficientarianism or rights-based constraints) to solve the problem.
  *   **Conclusion 3 (Divergent Results):** The Conversion-Rate monster is permissible intrapersonally, but the Capacity monster is not.
      *   *Implication:* The objection is not to aggregation per se, but to specific types of inequality in capacity. This would require a hybrid axiology.

  The deciding factor will be the robustness of the intuition in Case B. If the demand that a 'normal' present self starve to feed a 'high-capacity' future self strikes us as irrational or unfair, Conclusion 2 gains support.

  **Feasibility and Risk Assessment**
  This project is ambitious for a one-term seminar but manageable if strictly scoped.

  *   **Success Conditions:** The project succeeds if it produces a clear verdict on whether the intrapersonal intuition matches the interpersonal one, and traces the implications for Prioritarianism.
  *   **Failure Conditions:** The project would fail if it becomes bogged down in the metaphysics of personal identity. If the argument devolves into debating whether T2 is 'really' the same person as T1, the normative point will be lost. I must stipulate continuity and focus on the normative aggregation.
  *   **Risk of Triviality:** There is a risk that the intrapersonal case is trivially accepted by all rational agents, making the comparison moot. To mitigate this, I will push the Capacity version to extremes (e.g., T1 must endure significant suffering, not just minor sacrifice, to fuel T2's marginal gains).
  *   **Honest Assessment:** The scope is tight. I will not be able to defend a full alternative axiology. The goal is diagnostic: to clarify what the Utility Monster argument actually proves. If I find myself needing to defend a specific theory of prudence to make the intrapersonal case work, I will have overreached. I will limit the analysis to the *structural* implications for moral theory, assuming a standard model of prudential rationality as the baseline for comparison.

  In sum, this paper aims to show that the Utility Monster is either a much weaker argument against Utilitarianism than supposed (if intrapersonal aggregation is fine) or a much stronger argument against aggregative views in general (if intrapersonal aggregation is also suspect). Either result clarifies the dialectic significantly.
