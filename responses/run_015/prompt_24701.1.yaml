      *   *Definition:* Is it truly supererogatory if she's coerced by narrative pressure?
      *   *Motivation:* Does motive matter more than act?
      *   *The "Prayer" Question:* Maybe something about the author's own moral standing or the real-world harm of romanticizing sacrifice.

  4.  **Selecting and Ordering (by damage to thesis):**
      1.  *Utilitarian Challenge:* If it produces the best outcome, it's obligatory. Denies supererogation exists. (High damage).
