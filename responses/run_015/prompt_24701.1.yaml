      3.  *Narrative Coercion:* Did the plot *make* her do it? If so, not voluntary enough for praise. (Medium damage).
      4.  *Motivation vs. Action:* Is the act praiseworthy if done for glory? (Medium/Low).
      5.  *The "Prayer" Question:* Real-world implications/romanticizing martyrdom. (High personal damage).

