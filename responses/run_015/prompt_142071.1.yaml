answer: |-
  **Dana:** You let him off the hook too easily. When he claimed his model scales to human-level reasoning, you nodded. But if the underlying inference is NP-hard, scaling isn't a engineering problem, it's a physical impossibility.

  **Milos:** We've done this. NP-hardness is about the ceiling of the space, not the floor. It tells you what happens when inputs grow arbitrarily large and adversarial. It doesn't tell you what happens to a brain in a savannah or a robot in a warehouse.

  **Dana:** It tells you what evolution *couldn't* have built. If the general solution requires exponential time, evolution didn't find a shortcut. It found a niche where the shortcuts work. But that means the theory of mind isn't about the reasoning mechanism; it's about the constraint that kept the problems easy.

  **Milos:** Fine. Let's grant that. But you're assuming the hardness is intrinsic to the task. Suppose it's not. Suppose we have **sourced-instance tractability**.

  **Dana:** Meaning?

  **Milos:** Meaning the instances the world hands us aren't random draws from the space of all possible inputs. They're generated by physical processes—erosion, growth, construction—that leave traces. A puzzle is solvable not because the solution space is shallow, but because the causal history of the puzzle left a breadcrumb trail. The hardness exists in the abstract space, but the actual instances come with a checkable record of their generation that makes recovery cheap.

  **Dana:** I'll grant that. For a static environment, sure. The world is legible because it was written by laws that leave signatures. If the input distribution is fixed by physics, then average-case complexity might be low even if worst-case is high.

  **Milos:** And I'll grant you this: there are complexity classes where worst-case and average-case are reducible to each other. Levin's work on distributional problems. So I can't just wave my hand and say "worst-case doesn't matter." If the distribution shifts, the hardness might come with it.

  **Dana:** Exactly. And here's where your sourced instances rot. You're treating the agent as a passive reader of the world's breadcrumbs. But an optimizing agent doesn't just read; it writes. It consumes the easy instances.

  **Milos:** So it starves.

  **Dana:** So it changes the distribution. Success is adversarial. If I'm a forager, I eat the low-hanging fruit. Now the fruit I *have* to reach for is higher. If I'm a social agent, I solve the coordination problems, which creates new layers of strategic complexity. The easy natural distribution is exactly what a successful agent destroys. You wind up facing instances nobody generated for you—instances generated by your own previous success. The breadcrumbs stop.

  **Milos:** That assumes the agent is jumping off the manifold. But the agent's own actions are physical processes. They leave traces too.

  **Dana:** Traces of what? Of failure?

  **Milos:** Of path. You're assuming the agent faces the *general* problem of "what do I do next?" But it only faces the problem of "what do I do next given where I am?" The sourced-instance tractability doesn't vanish; it transfers. The history of the agent's own interactions becomes the new source record. You don't face the worst-case of the environment; you face the reachable-case of your own trajectory. As long as the agent's optimization is local—gradient descent on reality, not global search—the instances it generates for itself remain on the tractable manifold.

  **Dana:** Until phase transition. Until the local gradient leads to a cliff.

  **Milos:** Then the agent dies. Or learns a new niche. But that doesn't make complexity a constraint on the *mechanism*; it makes it a constraint on the *coupling*.

  **Dana:** Okay. Then here's where I land. If I'm right, cognitive theory needs to hunt for the cliffs. We shouldn't model how agents solve problems; we should model where their heuristics catastrophically fail when the distribution shifts. The signature of cognition isn't success; it's the specific shape of breakdown when optimization creates adversarial inputs.

  **Milos:** And mine is this: Don't model the problem space at all. Model the generative process of the niche, including the agent's own footprint. If you can't show how the instance was generated by a tractable history, you aren't studying a mind; you're studying a logic puzzle.

  **Dana:** Deal. I'll look for the breakdown.

  **Milos:** I'll look for the footprint.

  ***

  **Analysis**
  Dana wins this exchange because her dynamic critique (optimization shifts the distribution) overrides Milos's static defense (the world is structured). The assumption doing the most work is that **agent actions are themselves generative processes** capable of creating intractable niches. I rigged it slightly against Milos by forcing him to concede the worst/average-case link early, which undermined his primary defense that "real-world instances are always easy."
