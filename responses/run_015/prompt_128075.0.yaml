answer: |-
  ### Specifications of Adequacy for a Theory of Authorial Intention and Textual Meaning

  You ask for the architecture of the framework, not the tenants. You require a set of conditions that any account of intention must meet to avoid collapsing into either biographical reductionism or textual free-fall. Given your experience with the palimpsest of drafting and the instability of the "final" text, the following desiderata are structured to handle the text not as a monument, but as a process fossilized in ink.

  Each requirement below includes the **Motivating Case** (the interpretive puzzle it solves), the **Conceptual Distinction** (the boundary it must draw), and the **Constraint** (the historical or textual fact it cannot ignore). They are marked as **Non-Negotiable** (conditions for logical coherence) or **Preference** (conditions dependent on interpretive goals).

  ---

  #### 1. The Principle of Versional Integrity
  *   **Motivating Case:** A novel exists in two distinct editions revised by the author ten years apart (e.g., *Leaves of Grass* or *The Secret Agent*). Edition A contains a political allegory; Edition B revises the ending to undermine that allegory. A theory cannot claim the "meaning" is solely in A or solely in B without addressing the status of the other.
  *   **Conceptual Distinction:** Must distinguish between *Intention-at-Time-T1* and *Intention-at-Time-T2*. It must treat the text not as a singular object but as a vector of states.
  *   **Constraint:** Must respect the physical existence of variant texts. It cannot declare one version "apocryphal" solely based on chronological priority.
  *   **Status:** **Non-Negotiable.** Any theory that collapses distinct authorial versions into a single "ideal text" fails to describe the object of study.

  #### 2. The Criterion of Embodied Sanction
  *   **Motivating Case:** Posthumous publication where an editor arranges fragments into a narrative (e.g., Kafka's *The Trial*). The arrangement creates a symbolic pattern (a "court" that is never reached) that is structurally dependent on the editor's chapter ordering, not the author's manuscript sequence.
  *   **Conceptual Distinction:** Must distinguish between *Authorial Mental State* (what the author thought) and *Authorial Sanction* (what the author allowed to be public). If the author is dead, sanction is impossible; therefore, meaning derived from editorial arrangement must be categorized differently than meaning derived from authorial composition.
  *   **Constraint:** Must account for the legal and material reality of copyright and estate control without conflating ownership with semantic authority.
  *   **Status:** **Non-Negotiable.** To attribute editorial arrangement to authorial intention is a falsification of history.

  #### 3. The Supersession Clause
  *   **Motivating Case:** In Draft 1, a character's motivation is explicitly stated in an internal monologue. In Draft 5 (the published version), this monologue is cut, rendering the motivation ambiguous. A reader uses Draft 1 to "solve" the ambiguity of Draft 5.
  *   **Conceptual Distinction:** Must distinguish between *Abandoned Intention* and *Superseded Intention*. A revision is not merely an addition; it is often a negation. The theory must explain why the later intention overrides the earlier one in the public object, even if the earlier one remains historically recoverable.
  *   **Constraint:** Must respect the finality of the publication act as the moment of communicative offer.
  *   **Status:** **Non-Negotiable.** Without this, every deleted sentence remains semantically active, rendering the concept of "revision" meaningless.

  #### 4. The Workshop Paradox (Distributed Agency)
  *   **Motivating Case:** A manuscript is altered significantly due to iterative workshop feedback or heavy-handed developmental editing (e.g., Maxwell Perkins and Thomas Wolfe). The author accepts the changes, integrating them into their own voice.
  *   **Conceptual Distinction:** Must distinguish between *Sole Agency* and *Ratified Agency*. When an author accepts an external suggestion, does that intention become the author's own? The theory must define the threshold at which external input is assimilated into authorial intent.
  *   **Constraint:** Must acknowledge the collaborative reality of modern publishing without dissolving the category of "author" entirely.
  *   **Status:** **Preference.** (Strict individualists will reject this; collaborative theories will require it. However, for contemporary texts, it functions as Non-Negotiable for accuracy.)

  #### 5. The Autonomy of Semantic Consequence
  *   **Motivating Case:** A text utilizes a metaphor that, due to linguistic drift or unconscious structural patterning, supports a reading the author explicitly denied (e.g., a colonial reading of *Robinson Crusoe* unintended by Defoe).
  *   **Conceptual Distinction:** Must distinguish between *Intended Meaning* (the aim) and *Achieved Meaning* (the capacity of the text to support a reading). The text must be allowed to mean more than, or other than, the author consciously planned, provided the textual evidence supports it.
  *   **Constraint:** Must respect the public nature of language. Words carry histories and connotations outside the author's control.
  *   **Status:** **Non-Negotiable.** If a theory cannot account for unconscious pattern or linguistic drift, it reduces literature to a cipher.

  #### 6. The Temporal Stability Constraint
  *   **Motivating Case:** A word used ironically in 1750 is read literally in 2024. Does the meaning change?
  *   **Conceptual Distinction:** Must distinguish between *Original Uptake* (meaning available to the contemporary audience) and *Current Uptake* (meaning available to the present audience).
  *   **Constraint:** Must decide whether meaning is fixed at publication or fluid with reception.
  *   **Status:** **Preference.** (Historical intentionalists demand fixation; aesthetic actualists demand fluidity. A unified theory usually breaks here.)

  ---

  ### The Incompatibility Matrix: Jointly Unsatisfiable Desiderata

  You asked to identify where the framework breaks. There is a subset of these desiderata that cannot be simultaneously satisfied without contradiction. This is the cost of adequacy.

  **1. The Conflict of Unity vs. Archaeology**
  *   **The Conflict:** You cannot satisfy **The Supersession Clause** (Draft 5 negates Draft 1) and simultaneously treat earlier drafts as **Archaeological Layers** of valid meaning (Draft 1 explains Draft 5).
  *   **The Implication:** If you privilege the final version as the sole locus of meaning (to preserve Unity), you must treat earlier intentions as dead. If you treat earlier intentions as living layers (to preserve the Archaeology of composition), you fracture the Unity of the work.
  *   **Verdict:** A theory must choose: Is the work the *process* or the *product*? It cannot be both without creating a category error where "meaning" refers to two different ontological objects.

  **2. The Conflict of Sanction vs. Semantic Autonomy**
  *   **The Conflict:** You cannot satisfy **The Criterion of Embodied Sanction** (meaning requires authorial/editorial approval) and **The Autonomy of Semantic Consequence** (meaning exists in the text's capacity regardless of approval).
  *   **The Implication:** If a symbolic pattern emerges only through an editor's rearrangement (no authorial sanction), but the text supports it robustly (semantic autonomy), the theory must either call the meaning "illegitimate" (violating Autonomy) or call it "authorial" (violating Sanction).
  *   **Verdict:** Accommodating documented editorial intervention *requires* abandoning the unity of authorial intention. You must admit that the "author" of the published text is sometimes a composite entity, or that the meaning is partially orphaned from intention entirely.

  **3. The Conflict of Determinacy vs. Plurality**
  *   **The Conflict:** If you insist on **Versional Integrity** (A and B are both valid) and **Supersession** (B overrides A), you create a logical loop regarding the truth-value of interpretations.
  *   **The Implication:** An interpretation based on Version A is "true" relative to A, but "false" relative to B. A theory linking intention to meaning usually seeks to stabilize truth. This framework destabilizes it.
  *   **Verdict:** You must accept that "meaning" is relative to the specific version-state selected as the object of inquiry. There is no "Meaning of *The Trial*," only "Meaning of *The Trial* (Brod Edition)" and "Meaning of *The Trial* (Critical Edition)."

  ---

  ### Brief Theoretical Placement

  To locate your request against existing frameworks without dwelling on them:

  *   **Actual Intentionalism** fails **The Autonomy of Semantic Consequence** and struggles with **The Workshop Paradox**, as it cannot easily account for meanings the author did not consciously hold but successfully embodied. It also collapses under **Versional Integrity** if the author's intention changed over time without clear public signaling.
  *   **Hypothetical Intentionalism** (the "ideal author") satisfies **Semantic Autonomy** better but risks violating **The Criterion of Embodied Sanction**. It constructs an intention that never existed in a human mind, which may conflict with your desire to respect the "archaeological layers" of actual drafting history.
  *   **Value-Maximizing Accounts** (interpreting the text to make it as good as possible) satisfy **Semantic Autonomy** and **Versional Integrity** (by choosing the best version) but blatantly violate **The Supersession Clause** and **Embodied Sanction**. They prioritize the reader's aesthetic experience over the historical reality of the text's production.

  ### Conclusion on Adequacy

  A theory adequate to your experience as a novelist must be a **Genetic-Structural Hybrid**. It must treat the text as a structure capable of independent meaning (Structural) while acknowledging that the history of its construction (Genetic) constrains valid interpretations.

  However, you must accept the **Non-Negotiable Trade-off**: To respect the instability of the text (drafts, edits, versions), you must surrender the **Unity of Meaning**. There is no single meaning of a revised work. There is only the meaning of the work *at the stage of interrogation*. Any theory promising a single, stable link between intention and meaning for a text that exists in variants is, by definition, inadequate to the object.
