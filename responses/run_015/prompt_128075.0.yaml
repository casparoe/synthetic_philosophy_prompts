          *   Briefly mention standard theories (Intentionalism, Hypothetical Intentionalism, Value-Maximizing) only in passing, keeping weight on the criteria.
      *   **Tone:** Rigorous, philosophical, precise, acknowledging the complexity of the creative process (matching the user's persona).

  2.  **Deconstruct the Core Problem:**
      *   The user is asking for a meta-theoretical framework. They want to know what a *good* theory of intention/meaning *must* do, especially given the messiness of actual writing (drafts, edits, versions).
      *   Key tension: The author's mind changes (revision), the text changes (editing), and the reader's context changes (reception). A theory needs to navigate these without collapsing into absurdity (e.g., "meaning is whatever the author thought 20 years ago" vs. "meaning is whatever the reader feels now").

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Version Sensitivity.* A theory can't treat "The Text" as singular if there are multiple versions.
          *   *Motivation:* Kafka's *The Trial* (Max Brod's editing), Whitman's *Leaves of Grass* (multiple editions).
          *   *Distinction:* Intention-at-draft vs. Intention-at-publication.
          *   *Status:* Non-Negotiable.

      *   *Requirement 2: The Revision Paradox.* If an author changes a draft, does the earlier intention vanish or become a separate layer?
          *   *Motivation:* A character's motive clear in Draft A, ambiguous in Draft B.
          *   *Distinction:* Abandoned intention vs. Superseded intention.
          *   *Status:* Non-Negotiable.

      *   *Requirement 3: Editorial Agency.* When an editor changes the text, whose intention counts?
          *   *Motivation:* Posthumous publication, heavy-handed editing (e.g., Perkins & Wolfe).
          *   *Distinction:* Authorial sanction vs. Editorial imposition.
          *   *Status:* Non-Negotiable.

      *   *Requirement 4: Semantic Autonomy.* The text must be able to mean something the author didn't explicitly intend (unconscious patterns, linguistic drift).
          *   *Motivation:* Symbolic patterns emerging from structure, not design.
          *   *Distinction:* Intended meaning vs. Achieved meaning.
          *   *Status:* Non-Negotiable (otherwise literature is just code).

      *   *Requirement 5: Temporal Stability vs. Drift.* Does meaning change as language changes?
          *   *Motivation:* Archaic words acquiring new connotations.
          *   *Distinction:* Original uptake vs. Current uptake.
          *   *Status:* Preference (Historical vs. Presentist).

      *   *Requirement 6: The "Workshop" Problem.* Collaborative intention.
          *   *Motivation:* Modern MFA culture, editorial feedback loops.
          *   *Distinction:* Sole authorship vs. Distributed agency.
          *   *Status:* Non-Negotiable (for contemporary texts).

  4.  **Identifying Conflicts (The "Jointly Unsatisfiable" Subset):**
      *   *Conflict:* *Unity of Intention* vs. *Genetic Complexity*. If we respect all draft layers as meaningful (archaeological), we lose the unity of the final work. If we respect only the final version, we erase the history of composition.
      *   *Conflict:* *Authorial Sovereignty* vs. *Editorial Reality*. If the editor changes the text and the author accepts it, is it the author's intention? If the author is dead, can the editor speak for them?
      *   *Conflict:* *Determinacy* vs. *Plurality*. A theory that fixes meaning to a specific intention often fails to account for valid divergent readings that the text supports linguistically.

