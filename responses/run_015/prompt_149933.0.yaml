          *   *Why:* It demonstrates that an algorithm can be "exponential in the worst case" (theoretically bad) yet "efficient in practice" (philosophically usable), whereas interior-point methods are polynomial worst-case but sometimes slower in practice. This decouples the theoretical bound from the physical reality. It avoids the P vs NP quagmire while illustrating the gap between formal bounds and physical execution.
          *   *Properties needed:* Formal worst-case result (exponential), routine practical success, no quantum/unsolved conjecture dependence.
          *   *Justification:* It directly attacks the idea that worst-case asymptotics define "possibility."

      *   **3. The Misconception Map:**
          *   *Misconception 1:* "Computable = Doable." (Head off early, during Computability section).
          *   *Misconception 2:* "Exponential = Impossible." (Head off during Complexity section).
          *   *Misconception 3:* "Worst-case = Typical case." (Head off during Simplex discussion).
          *   *Misconception 4:* "Laplace's Demon fails only due to Quantum/Chaos." (Head off during Philosophical Payoff).

      *   **4. Check for Understanding:**
