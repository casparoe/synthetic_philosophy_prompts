      *   **Constraint 1:** Do not explain the concept to me (the user).
      *   **Constraint 2:** Draft the teaching plan.
      *   **Constraint 3:** Specific order of sections (1. Explanatory Arc, 2. Carrying Example, 3. Misconception Map, 4. Check for Understanding, 5. What Must Be Left Out, 6. One Niche Injection).
      *   **Constraint 4:** Formal, polished register appropriate for retired scientists addressing peers.
      *   **Constraint 5:** No bibliographies, reading lists, or citations.

  2.  **Deconstruct the Goal:**
      *   The core philosophical claim is that "in principle" (computability) is insufficient for epistemological claims about reality because "in practice" (feasibility/complexity) imposes hard limits that are not just engineering hurdles but conceptual boundaries.
      *   Specifically, worst-case asymptotic analysis (Big-O) is often misused in philosophy to say "it's possible" (because it's polynomial) or "it's impossible" (because it's exponential), but both miss the physical reality of computation.
      *   Target audience: Smart, technical, but not complexity theorists. They know what $O(n^2)$ means, but might not know the philosophical implications of the Cobham-Edmonds thesis or the distinction between worst-case and average-case in an epistemological context.

  3.  **Drafting - Section by Section:**

      *   **1. The Dependency-Ordered Explanatory Arc:**
          *   Need to start with the classical view (Computability/Turing).
          *   Move to the physical constraint (Time/Resources).
          *   Introduce Complexity (Polynomial vs. Exponential).
          *   Crucial pivot: Worst-case vs. Physical Reality.
          *   Conclusion: Epistemological implication (Laplace's Demon fails not because of chaos alone, but because of computational irreducibility/complexity).
