      *   *The Proposed Solution:* Functional "credit-assignment." Pleasure is whatever the brain uses to tag a state/action as "do this again." It's a computational role, not a qualia.

  4.  **Analyzing the Implications of the Functional Solution:**
      *   *Implication 1: The Nature of the Good.* If pleasure is just a reinforcement signal, is it *intrinsically* good? Or is it good *because* it tracks fitness/survival? This shifts hedonism from "feel good" to "function well."
