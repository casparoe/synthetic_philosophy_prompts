      *   *Implication 3: Welfare Metric.* If we count welfare by reinforcement signals, do we count *all* signals? What about maladaptive pleasures (drugs, delusions)? A functionalist account might label them "pleasure" but a welfare account might reject them if the function is broken.
      *   *Implication 4: Phenomenology.* If the "feel" doesn't matter, only the tagging, then a zombie (philosophical) or an AI could have "pleasure" and thus "well-being." This radically expands or dilutes hedonism.

  5.  **Addressing the Specific Questions:**
      *   *Does Hedonism Survive Intact?* Probably not. Traditional hedonism is phenomenological (about experience). Functional hedonism is structural/behavioral. It risks collapsing into Desire Satisfactionism (doing what reinforces) or Biological Naturalism (thriving).
      *   *Missing Differences (Intensity/Kind)?*
          *   *Intensity:* Functional strength (learning rate) vs. Felt intensity. You can have strong reinforcement without conscious intensity (habituation).
          *   *Kind:* Higher/Lower pleasures (Mill). A functional account treats drug reinforcement and art reinforcement as the same *type* of signal, just different inputs. It loses the normative distinction Mill wanted.
          *   *Welfare Metric Risk:* If the metric is "amount of reinforcement," addiction looks like high well-being. If the metric is "successful reinforcement of fitness," then addiction is low well-being. This creates a tension between *psychological hedonism* (what we seek) and *ethical hedonism* (what is good).

