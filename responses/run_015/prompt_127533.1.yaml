      *   **Consistency:** They are *not* consistent. Switzerland assumes a pre-political bond (solidarity). The EU assumes a contractual bond (efficiency).

  6.  **Develop the "Pure Type" Scenarios (The Counterfactuals):**
      *   *Pure Epistemic/Localist View:* No fiscal equalization. Cantons keep all tax revenue. Vocational training varies wildly. Result: High inequality, high local innovation, potential "race to the bottom."
      *   *Pure Solidaristic/Unitary View:* Federal government sets all curricula. Tax rates harmonized completely. Cantons become administrative regions. Result: High equality, low local responsiveness, democratic deficit.
      *   *Pure EU Output View:* Commission decides based solely on cross-border impact. No national parliament veto. Result: Efficient market, but democratic backlash (which we see).
