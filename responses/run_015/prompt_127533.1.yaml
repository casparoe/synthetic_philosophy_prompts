          *   EU Comparison: Subsidiarity (Article 5) seems procedural/boilerplate; "Yellow Card" mechanism rarely works.
          *   Comparison: Swiss practice vs. EU practice. Same theory of legitimacy? Input vs. Output?
          *   Advisor's Terms: "Epistemic subsidiarity" vs. "Solidaristic federalism" (Are these real?).
      *   **Task:** Reconstruct the implicit philosophy behind these designs, assess consistency/underdetermination, and describe what policies built *purely* on one view would look like. Avoid just listing philosophers; focus on institutional logic.

  2.  **Deconstruct the Swiss Case:**
