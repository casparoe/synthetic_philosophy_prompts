  I'm in a small reading group on set theory (mostly grad students plus one logic postdoc who runs it) and we got into an argument about the axiom of choice that I can't get out of my head. One of the other students — let's call him Samir — has this move he keeps making: he says the choice debate is being had at the wrong level, because if you accept that every set is ordinal-definable (V = HOD), then you get a definable global well-ordering of the universe for free and choice just falls out as a corollary, so the real question isn't about "choosing" at all but about whether the universe contains only sets you can pick out from ordinals by a formula. He calls it the 'definability-first' route and claims it makes AC about 0.9 conditional on there being a single intended universe. I sort of like it but it also feels like it sneaks in something choice-shaped (and it's flatly false in a Cohen-style forcing extension, which is where I started to get suspicious), and it also seems to sit badly with the thing I was taught about the powerset operation being *arbitrary* subsets rather than definable ones.

  So: I want your own number for the claim that the axiom of choice is true in the intended universe of sets, but really I want it decomposed, because I think mine is mushy. At minimum give me separate terms for (a) that there is a single intended universe at all rather than something like Hamkins-style multiverse pluralism, (b) AC's truth conditional on (a), (c) whether the iterative-conception / plenitudinous-powerset picture supports AC, is silent on it, or actually pulls against the definability-first route, (d) the probability that V = HOD is true given (a), including whether Samir's reduction is question-begging in a way he hasn't noticed, (e) how much the success of determinacy should worry someone who accepts choice — projective determinacy from large cardinals, AD-type axioms looking natural for the definable sets of reals, full determinacy contradicting AC outright — i.e. how much evidential weight "determinacy looks right where we can test it" carries against choice for arbitrary sets, and (f) the extrinsic balance sheet: how much AC's usefulness in ordinary mathematics (Tychonoff, Hahn–Banach, every vector space having a basis, algebraic closures) should count against its costs (non-measurable sets, Banach–Tarski, a well-ordering of the reals nobody can exhibit), and how much the reverse cost — dropping it and living with reals as a countable union of countables, Dedekind-finite infinite sets, vector spaces without bases — matters. Please don't just list those; put a number and one line of justification on each and then show me how you're combining them.

  Two more things. First, I half-remember a result (Pawlikowski?) that Hahn–Banach already implies Banach–Tarski, and that Hahn–Banach is weaker than the Boolean prime ideal theorem, which if right means pinning the paradox on *full* AC is a bad argument — tell me whether that memory is right and, if so, how much it should change term (f). Second: my own credence is around 0.6 for (b) and maybe 0.45 for (a), so my joint number is much lower than Samir's 0.85, and I want to know where that gap actually lives — which of those terms do we most likely disagree about, which single term is your final number most sensitive to, and what kind of future development (a canonical inner model settling CH one way or the other, a proof that V = HOD or its negation follows from large cardinals, anything else) would move you the most. Assume you have no access to papers or web search here; I want your reasoning off the top of your head, numbers included, not a literature survey.
