answer: |-
  Your list contains a fundamental contradiction: you cannot demand intelligence be a jagged profile while also demanding a coherent "smarter than us" scalar ranking without secretly importing value judgments about which skills matter.

  **Genuine Desiderata (Non-Negotiable)**
  1.  **Generalization Capacity:** Restates your "stored knowledge" and "same problem" requirements. A system must solve problems invariant to surface representation (words vs. diagrams) and derive answers rather than retrieve them.
  2.  **Computational Efficiency:** Restates your "speed/resources" rule. Intelligence is performance per unit of compute (time/memory), not raw throughput; a brute-force solver is less intelligent than a heuristic one given equal budgets.
  3.  **Implementation Independence:** Restates your "damaged hardware" requirement. Intelligence must be substrate-neutral; a broken output channel or non-biological medium cannot negate the presence of reasoning.
  4.  **Ground-Truth Independence:** Restates your "tell me I was wrong" requirement. The metric cannot rely on human consensus or pre-labeled "intelligent" behaviors, or it merely codifies bias.

  **Genuine Desiderata (Droppable)**
  1.  **Scalar Ranking:** The demand for a single "smarter than us" number. Drop this to resolve the conflict with jaggedness; accept that superintelligence may be a vector, not a height.
  2.  **Collection Identity:** The question of whether swarms are "one" intelligence. Drop this; it is a metaphysical boundary problem irrelevant to whether the system *behaves* intelligently for your three disputes.

  **Missing Specialist Requirements**
  1.  **Goal-Relativity:** Intelligence is optimization power toward a specific objective function; without defining the goal, "performance" is undefined. (Case: A system optimizing for paperclips looks insane to a human optimizing for happiness.)
  2.  **Learning Efficiency:** Distinguish between crystallized intelligence (current skill) and fluid intelligence (rate of skill acquisition per data unit). (Case: A system that knows everything but cannot learn new tasks is less intelligent than one that learns quickly.)

  **Testing Your Suspicions**
  1.  **Jaggedness vs. "Smarter Than Us":** Confirmed conflict. You cannot have a single ordering (scalar) and a profile (vector) simultaneously without weighting the profile's dimensions, which introduces subjective values.
  2.  **Same-Problem vs. Stored-Knowledge:** Distinct. Stored knowledge distinguishes lookup from derivation; same-problem distinguishes robust representation from brittle formatting. You need both, but they merge under **Generalization Capacity**.
  3.  **Damaged-Hardware:** Not sentimental. This is functionalism. If intelligence requires specific biology, AI is impossible by definition; keeping this requirement is the only way your chatbot dispute is even solvable.

  **Impossibility Theorem**
  The triad of **Scalar Ranking**, **Jagged Profile**, and **Goal-Neutrality** cannot be jointly satisfied. To rank jagged systems scalarly, you must weight their capabilities, which violates goal-neutrality by privileging human-valued tasks.

  **Most Exclusionary Requirement**
  **Ground-Truth Independence.** This excludes almost all behavioral tests (Turing, etc.) and psychometric accounts, as they validate against human judgment rather than objective optimization metrics.

  **Scoring Standard Families**
  *   **Behavioral/Test-Based:** Fails Ground-Truth Independence. It defines intelligence as "acting like a human," which circularly validates your biases about dogs and chatbots rather than measuring capacity.
  *   **Algorithmic (Legg/Hutter):** Passes Generalization and Efficiency. It defines intelligence as compression/prediction across weighted environments, but struggles with Goal-Relativity (which environments count?).
  *   **Psychometric (g-factor):** Passes Scalar Ranking for humans. Fails Implementation Independence and Jaggedness; it cannot compare spreadsheets, dogs, and AIs on a single scale without anthropocentric weighting.
  *   **Biological/Neural:** Fails Implementation Independence. It ties intelligence to specific substrate mechanisms, making it useless for evaluating chatbots or superintelligence by definition.
