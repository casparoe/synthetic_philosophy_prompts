answer: |-
  This is an exceptionally sharp observation of the lived epistemology of high-energy physics. You have identified a friction point where the *semantic* demands of philosophy (true/false, reference/non-reference) grind against the *pragmatic* demands of physics (calculate/predict/discover).

  Your housemate's practice and your seminar's ledger reveal a stance that is often called **pragmatic realism** or **contextual empiricism**, but it resists easy classification into the standard triad of Scientific Realism (SR), Entity Realism (ER), and Constructive Empiricism (CE).

  Here is a reconstruction of what this bundle of practices presupposes, where it is underdetermined, and what would concretely change if the implicit ontology were swapped for a thoroughgoing anti-realism.

  ### 1. What the Practice Strictly Presupposes vs. What Sits Comfortably

  To understand what is *required* versus what is *compatible*, we must distinguish between the conditions for the practice to function and the metaphysical interpretation of that function.

  **Strict Presuppositions (The Practice Breaks Without These):**
  1.  **Semantic Stability Across Theory Change:** The term "electron" in a classical simulation, a quantum mechanical calculation, and a QFT paper must refer to *something* sufficiently continuous that data collected in regime A can be aggregated with data in regime B. If reference were radically discontinuous (Kuhnian incommensurability), the "permanent reference tables" your housemate mentions would be incoherent.
  2.  **Non-Accidental Success:** The practice presupposes that the reason the classical model works in the simulation is not mere luck. There must be a constraint linking the superseded theory to the successor.
  3.  **Ontological Commitment to Measurement Outcomes:** The "discovery talk" presupposes that detector clicks are caused by something distinct from the detector itself. Even an anti-realist must treat the *phenomena* as real, but the practice treats the *source* of the phenomena as a stable entity worthy of naming.

  **What Merely Sits Comfortably (Underdetermined):**
  1.  **The Truth Value of the Equations:** The practice works equally well if you believe the Lagrangian describes reality *or* if you believe it is merely a compression algorithm for phenomena. The math doesn't care about your metaphysics.
  2.  **The Nature of the "Entity":** You can treat the Higgs boson as a real excitation of a field (Realism) or as a useful node in a causal model that organizes scattering data (Instrumentalism). The collision data remains the same.
  3.  **The Status of the Cutoff:** Believing the cutoff is a physical boundary of nature vs. a boundary of current computational utility does not change the calculation.

  **Rival Views Ruled Out:**
  *   **Naïve Falsificationism:** The practice explicitly retains "false" theories (Newtonian mechanics) for calculation. A strict falsificationist would forbid using a theory known to be false.
  *   **Radical Incommensurability:** The ledger practice assumes we can compare the old and new theory to see what was retained. If the concepts were totally disjoint, the ledger could not be filled.
  *   **Eliminative Materialism:** The practice does not drop the ontology of the old theory (e.g., "there are no electrons, only fields"); it subsumes it.

  ### 2. Structural Realism, Entity Realism, and Anti-Realism

  Does the practice *require* Structural Realism (SR)? **No.** But SR is the path of least resistance.

  *   **Structural Realism (SR):** This fits the **Retention Ledger** best. SR claims we should only believe the mathematical structure (symmetries, conservation laws) is retained. Your ledger shows symmetries are kept while specific ontological pictures (heat as fluid) are dropped. SR licenses the use of old math (structure) without committing to the old ontology.
  *   **Entity Realism (ER):** This fits the **Discovery Talk** best. ER says, "If you can manipulate it, it's real." Physicists manipulate beams of electrons. However, ER struggles with the EFT talk. If the electron is just a low-energy excitation of a field, is the "entity" real at high energies where the field definition changes? ER requires a stable "thing"; EFT suggests the "thing" is scale-dependent.
  *   **Constructive Empiricism (CE) / Anti-Realism:** This fits the **EFT Talk** best. CE says theories are only empirically adequate in a domain. This matches "valid below a cutoff." However, CE strains against the **Discovery Talk**. Van Fraassen would argue we should say "The model saves the phenomena of the Higgs," not "We discovered the Higgs."

  **The Underdetermination:**
  The practice is philosophically underdetermined because the physicists are **functionalists**. They treat truth as a property that *does work*.
  *   To the Realist, it works because it tracks truth.
  *   To the Anti-Realist, it works because it is empirically adequate.
  *   To the Structural Realist, it works because the structure is preserved.
  All three can sign off on the same paper, provided they interpret the abstract differently.

  ### 3. "Valid Below Cutoff" vs. "Yields Correct Numbers"

  Can "valid below the cutoff" be cashed out as nothing more than "yields correct numbers within error bars in regime R"?

  **Yes, but it breaks the coherence of Discovery Talk.**
  If "electron" is just a label for a model that yields correct numbers in Regime R, then "discovering the electron" is a category error. You do not *discover* a model; you *construct* it. You discover the *phenomena* the model saves.
  *   **Realist Cash-Out:** "Valid" means the terms refer to entities that exist in that regime. Discovery is finding the entity.
  *   **Anti-Realist Cash-Out:** "Valid" means the model is isomorphic to the data in that regime. Discovery is a metaphor for "successfully modeling a new class of phenomena."

  **The Reference Problem:**
  If the term "electron" does not refer in the successor theory (because the successor says "there are only fields"), then the "permanent reference tables" are actually tables of *model parameters*, not *world facts*.
  *   **Practice:** Treats the mass of the top quark as a fact about the world.
  *   **Anti-Realist:** Must treat the mass of the top quark as a fitting parameter of the Standard Model EFT.
  *   **Conflict:** If the Standard Model is replaced, the Realist says "We found a more accurate value for the mass." The Anti-Realist says "The new model requires a different parameterization; the old number is obsolete." The practice assumes the former.

  ### 4. The Demand for Recovery (Correspondence Principle)

  Physicists demand any successor theory recover the predecessor's predictions in the predecessor's domain (e.g., General Relativity must yield Newtonian gravity at low speeds).

  *   **Realist Interpretation:** This shows the old equations were tracking something real. The new theory must encompass the old truth. The continuity of prediction implies continuity of reference.
  *   **Anti-Realist Interpretation:** This is a constraint on **empirical adequacy**, not truth. The new theory must be able to mimic the old theory's success because the *data* hasn't changed. It shows the old theory was *adequate*, not that it was *true*.

  **Does this show the old equations tracked something real?**
  Not strictly. It shows they tracked the *phenomena*. However, the **Retention Ledger** suggests something stronger: often the *mathematical form* is retained (e.g., the form of the conservation law), not just the numerical output. This leans toward Structural Realism. If only the numbers mattered, we could use totally different math to get the same result. The fact that we keep the *structure* suggests we believe the structure reflects the world.

  ### 5. Scale-Indexed Truth vs. Approximate Truth

  Is your housemate's "scale-indexed truth" a genuine alternative?
  **Yes.** It is a semantic shift from **verisimilitude** to **contextualism**.

  *   **Approximate Truth (Verisimilitude):** "Newton's theory is false, but close to the truth." This invites the question: "Close to *what*?" (The True Theory?). It assumes a single, scale-independent reality.
  *   **Scale-Indexed Truth:** "Newton's theory is true *at scale S*." This treats truth like "flatness." A table is flat (true) for dining, not flat (false) for optics.
  *   **Implication:** This dissolves the Pessimistic Meta-Induction. Past theories weren't "false"; they were "true at a different resolution."
  *   **Problem:** It risks trivializing truth. If every theory is "true at its own scale," what does "false" mean? It means "used outside its domain." This turns error into a category mistake rather than a failure of representation.

  ### 6. The Concrete Test: What Would Change Under Anti-Realism?

  If the implicit realism currently guiding your housemate's department were replaced by a thoroughgoing Constructive Empiricism (theories are only tools for saving phenomena, no ontological commitment), the following concrete changes would occur in scientific practice:

  **A. Vocabulary of Discovery**
  *   **Current:** "Observation of the Higgs Boson," "Measurement of the electron mass."
  *   **Anti-Realist:** "Detection of scattering signatures consistent with the Higgs sector," "Fitting of the electron mass parameter in the Standard Model Lagrangian."
  *   **Why:** "Discovery" implies finding an existing object. "Detection of signatures" implies observing phenomena that a model accounts for.

  **B. The Reference Tables (PDG Book)**
  *   **Current:** Titled "Review of Particle Physics." Lists "Mass," "Charge," "Lifetime" as properties of particles.
  *   **Anti-Realist:** Titled "Review of Model Parameters." Lists "Coupling Constants," "Effective Masses," "Decay Widths."
  *   **Why:** Properties belong to objects; parameters belong to models. If the model is an EFT, the "mass" is a low-energy effective parameter, not an intrinsic property of a thing.

  **C. Teaching Superseded Theories**
  *   **Current:** "Newtonian mechanics is an approximation of Relativity." (Implies Newton was trying to say what Einstein said, but got it slightly wrong).
  *   **Anti-Realist:** "Newtonian mechanics is a distinct conceptual framework that is empirically adequate for $v \ll c$." (Implies Newton was doing a different job).
  *   **Ledger Change:** The "Retention Ledger" would no longer have a column for "Kept as Literally True." It would have "Kept as Empirically Adequate in Regime R" and "Kept as Heuristic Device."

  **D. Simulation and Calculation**
  *   **Current:** "We use classical trajectories here because they are good enough." (Implies the classical path is *roughly* the real path).
  *   **Anti-Realist:** "We use classical trajectories here because the quantum interference terms cancel out in this regime." (No claim about the path being real, only about the mathematical equivalence of the output).

  **E. The Goal of Successor Theories**
  *   **Current:** "We need a theory that explains *why* the Standard Model works." (Seeks deeper truth).
  *   **Anti-Realist:** "We need a theory that extends the empirical adequacy of the Standard Model to higher energies." (Seeks wider utility).

  ### Summary

  The bundle of practices you observe presupposes **semantic stability** and **non-accidental success**, but it is **metaphysically underdetermined**.

  *   **Structural Realism** is the most natural fit for the *Retention Ledger* and the *reuse of old math*.
  *   **Entity Realism** is the most natural fit for the *Discovery Talk*.
  *   **Anti-Realism** is the most natural fit for the *EFT/Cutoff Talk*.

  Physicists resolve this tension not by choosing a philosophy, but by adopting **Scale-Indexed Truth**. This allows them to be Realists at the scale of the detector (the particle is real) and Anti-Realists at the scale of the theory (the Lagrangian is effective).

  If they were forced into strict Anti-Realism, the **ontology would vanish from the abstract**. The "discovery" would become "model validation," and the "permanent tables" would become "parameter catalogs." The science would calculate the same, but the claim to have *found something* would be replaced by the claim to have *built something useful*.
