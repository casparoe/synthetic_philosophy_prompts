      *   *Nuance on Scale-Truth:* This is close to "Contextual Empiricism" (Ruetsche) or "Functionalism." It challenges the binary True/False.
      *   *The "Discovery" Problem:* Anti-realists usually hate "discovery of unobservables." If physicists keep saying "discovery," are they forced into realism? Or is it just shorthand? The prompt asks what would change if we swapped the view. I need to be specific about the linguistic shift.

