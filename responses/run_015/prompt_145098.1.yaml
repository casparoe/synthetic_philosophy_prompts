  # Joint Statement of Adversarial Collaboration
  **Subject:** Resolving the Lottery and Preface Paradoxes  
  **Parties:** Closure-Denying Belief-Fragmentationists & Pragmatic-Contextualist Threshold-Shifters  
  **Date:** October 26, 2023  

  ## 1. Agreed Claims and Formal Setup

  Both parties affirm the following foundational claims regarding the problem space, the desiderata for a solution, and the existing formal constraints.

  1.  **Formal Setup of the Paradoxes**
      *   **The Lottery:** Consider a fair lottery with 1,000 tickets and exactly one winner. For any single ticket $t$, the probability that $t$ will lose is 0.999. Intuitively, it is rational to believe of any specific ticket that it will lose. However, it is irrational to believe the conjunction that *all* tickets will lose, as this contradicts the known setup.
      *   **The Preface:** Consider an author who has written a book containing 1,000 factual claims. For each individual claim $c$, the author has strong evidence and rationally believes $c$ is true. However, based on inductive humility regarding human fallibility, the author also rationally believes that there is at least one error in the book (i.e., the conjunction of all claims is false).

  2.  **Desiderata for a Solution**
      *   **Fallibilism:** Any solution must preserve the intuition that rational belief does not require Cartesian certainty. A probability threshold less than 1.0 must be sufficient for rational belief.
      *   **Consistency:** Any solution must avoid attributing outright contradictory beliefs to the agent within a single evaluative frame (i.e., the agent cannot rationally believe $P$ and $\neg P$ simultaneously in the same sense).
      *   **Non-Eliminativism:** Any solution must take the intuitive premises seriously. We cannot dissolve the paradoxes merely by claiming that people do not actually hold these beliefs or that the premises are linguistically confused.

  3.  **The No-Go Result**
      *   Both parties agree that a simple **Lockean Thesis** (belief is belief if probability $> t$) combined with **Full Logical Closure** (if you believe $P$ and believe $Q$, you must believe $P \land Q$) and **Consistency** is formally impossible.
      *   Specifically, if the threshold $t$ is fixed (e.g., 0.99) and closure holds universally, the Lottery case forces the agent to believe a contradiction. Therefore, at least one of these three components (Fixed Threshold, Full Closure, Consistency) must be modified or restricted.

  ## 2. Areas of Disagreement

  While both camps agree on the constraints above, they diverge on which component to modify and how to interpret the mental architecture of the believer. The following table outlines the specific points of contention.

  | Issue | Closure-Denying Belief-Fragmentationist Wording | Pragmatic-Contextualist Threshold-Shifter Wording |
  | :--- | :--- | :--- |
  | **1. Rational Closure** | Closure under conjunction is not a requirement of rationality. An agent can rationally believe $P$ and believe $Q$ without being committed to believing $P \land Q$. | Closure holds within a fixed context. Apparent failures of closure arise because the agent shifts contexts, thereby shifting the belief threshold, not because logic fails. |
  | **2. Underlying Mechanism** | The Lottery and Preface paradoxes share a unified structural mechanism: the mind naturally compartments beliefs into fragments that do not merge under conjunction. | The paradoxes are analogous but distinct instances of a single mechanism: practical stakes and conversational context dynamically adjust the confidence required for belief. |
  | **3. Nature of Belief** | "Belief" is not a single unified attitude. It is a fragmented state where different subsets of propositions are governed by different consistency constraints. | "Belief" is a single unified attitude. The variation lies not in the attitude itself, but in the contextual parameters (stakes, salience) that govern its attribution. |
  | **4. Psychological Realism** | It is psychologically realistic to hold that an agent believes each ticket will lose while lacking the belief that all will lose, due to cognitive limitations on merging large conjunctions. | It is psychologically realistic to hold that an agent adjusts their standards when moving from considering individual tickets to considering the lottery setup as a whole. |
  | **5. Formal Representation** | Best modeled by multiple "belief boxes" with revision priorities, where information in one box does not automatically propagate to others unless triggered by specific inquiry. | Best modeled by non-monotonic scorekeeping, where the conversational score determines the threshold, and asserting a conjunction changes the score to make belief unavailable. |

  ## 3. Cruxes for Future Investigation

  To move this collaboration forward, we have identified three specific sub-questions. Settling these would significantly alter the plausibility of one or both views. For each crux, we record our respective predictions and agree on what evidence would bear on the matter.

  ### Crux 1: The Formal Unification Question
  **Question:** Is it possible to construct a unified logical model that captures both the Fragmentationist's separated belief sets and the Contextualist's indexed thresholds within the same system? If such a model exists, does it demonstrate that one view is merely a notational variant of the other?

  *   **Fragmentationist Prediction:** A unified model is possible but will reveal that "context shifts" are merely a semantic gloss on underlying structural fragmentation. The logic will require distinct storage states that cannot be reduced to a single threshold parameter without losing explanatory power regarding inference patterns.
  *   **Contextualist Prediction:** A unified model is possible and will reveal that "fragmentation" is merely a static snapshot of dynamic context sensitivity. The logic will show that what looks like separate boxes is actually a single system responding to non-monotonic updates in conversational score.
  *   **Agreed Bearing:** We agree that if a translation manual can be produced that maps every theorem of one system to the other without loss of information, the dispute is merely verbal. If the systems diverge on valid inference patterns (e.g., handling of iterated belief), the dispute is substantive.

  ### Crux 2: The Empirical Survey Question
  **Question:** In a concrete psychological case, subjects are presented with the 1,000-ticket lottery. They are asked two questions separately: (1) "Do you believe ticket 347 will lose?" and (2) "Do you believe all 1,000 tickets will lose?" What is the response pattern?

  *   **Fragmentationist Prediction:** Subjects will answer "Yes" to (1) and "No" to (2) without reporting any feeling of contradiction or context shift. The data will show that subjects treat these as independent doxastic attitudes that do not trigger a search for consistency across the set.
  *   **Contextualist Prediction:** Subjects will answer "Yes" to (1) and "No" to (2), but if pressed on why, they will appeal to the difference in stakes or the "kind of claim" being made. If the context is held strictly constant (e.g., via rigorous framing), the rate of "Yes" to (2) should rise, or "Yes" to (1) should fall, indicating threshold sensitivity.
  *   **Agreed Bearing:** We agree that eye-tracking or response-time data showing whether subjects hesitate when moving from (1) to (2) would bear on this. Immediate, unhesitating divergence supports Fragmentationism; hesitation or justification involving stakes supports Contextualism.

  ### Crux 3: The Preface Edge Case (Perfect Verification)
  **Question:** Imagine an author who has personally verified every citation in her book using a flawless method and found zero errors. Despite this, she knows human memory is fallible over time. Does she still rationally believe "there is at least one error in this book"?

  *   **Fragmentationist Prediction:** Yes. She believes of each citation $c$ that "$c$ is correct." She does not believe the conjunction "All $c$ are correct." Therefore, she believes the negation of the conjunction ("There is an error"). These beliefs coexist in separate fragments; the verification evidence updates the individual fragments but does not force a merger into a global consistency check.
  *   **Contextualist Prediction:** It depends on the context of the question. If asked about specific citations, she believes they are correct (low threshold). If asked about the book as a published object subject to future scrutiny, the stakes rise, the threshold rises, and she believes "There is an error." Her mental state is coherent because she never holds both beliefs under the same contextual parameters simultaneously.
  *   **Agreed Bearing:** We agree that introspective reports on whether the author feels she is contradicting herself are crucial. If she reports feeling coherent without appealing to different "contexts" or "modes of consideration," this supports Fragmentationism. If she reports that the claim about errors feels "true in a sense" but not "true for practical purposes," this supports Contextualism.

  ---
  **Signed,**  
  *Representatives of the Closure-Denying Belief-Fragmentationists*  
  *Representatives of the Pragmatic-Contextualist Threshold-Shifters*
