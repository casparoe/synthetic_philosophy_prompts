answer: |-
  Dear Colleague,

  I understand your frustration with the interruption you described, as the slogan sex work is work, full stop, functions less as a philosophical proposition and more as a political shield, yet it is precisely because it operates on multiple registers simultaneously that it provokes such confusion. To unpack the machinery of that sentence, we must separate the descriptive, the normative, and the regulatory claims it conflates, ranging from the trivial to the radically revisionary. At its most minimal and tautological level, the statement is merely a platitude about exchange relations, asserting that sexual services are provided in exchange for remuneration and thus constitute an economic activity within a market. This reading is descriptively accurate but legally inert, as acknowledging an activity as economic does not automatically compel its inclusion under standard labor statutes, since illegal markets also involve exchange without granting labor rights. However, advocates rarely intend this weak reading; instead, they typically invoke a substantive but defensible claim about labor-market categorization, arguing that because the activity involves labor, it should be removed from the criminal law framework and integrated into civil regulatory regimes. This is the reading that genuinely supports extending standard occupational-health and safety statutes to brothel settings, as it posits that the state's primary obligation is to ensure the physical safety and contractual rights of the provider rather than to moralize or prohibit the transaction. When used to defend the New Zealand decriminalization model specifically, this reading argues that removing criminal penalties allows for the enforcement of workplace safety without the stigma that drives the industry underground, contrasting sharply with the German legalization approach which often creates a two-tiered system of registered and unregistered workers, and the Nordic model which retains criminal penalties for the buyer.

  Yet there is a stronger, more contentious reading lurking behind the phrase full stop, which moves from categorization to moral equivalence. This reading asserts that sex work lacks any morally or structurally distinctive features that should justify exceptional regulatory treatment, effectively claiming that selling sexual access is normatively identical to selling massage therapy or childcare. Here we encounter the risk of a false equivalence that ignores distinctive coercion and trafficking dynamics, as this reading often dismisses the specific vulnerabilities related to bodily integrity, the high prevalence of violence from clients, and the complex interplay of economic desperation that may not be present in other labor sectors. Critics of the slogan argue that this strong equivalence claim is where the argument falters, because it treats the idealized autonomous contractor as the norm rather than addressing the structural conditions that make exit difficult for many providers. While the substantive claim about labor categorization supports occupational-health frameworks by demanding safety regulations, the strong moral equivalence claim often undermines them by refusing to acknowledge that sex work may require specific, heightened protections rather than just standard ones. Consequently, when advocates use the slogan to defend the New Zealand model over the Nordic alternative, they are usually relying on this stronger reading to reject the premise that the transaction itself is inherently harmful, whereas the Nordic model is built on the premise that the demand side drives exploitation regardless of the worker's legal status.

  This leads to your crucial question about whether the slogan addresses Nordic-model concerns about demand-driven exploitation or simply changes the subject. On almost every reading, the slogan changes the subject by shifting the analytical focus from the buyer and the structure of demand to the provider and the conditions of supply. The Nordic model posits that criminalizing the buyer reduces exploitation by shrinking the market and signaling that bodies are not commodities, a concern that the slogan sex work is work does not engage with but rather overrides by asserting the legitimacy of the commodity status itself. By declaring the matter ended with full stop, the speaker precludes the discussion of whether certain forms of labor should be restricted to prevent social harm, effectively treating the recognition of labor rights as incompatible with the recognition of unique vulnerabilities. Therefore, while the slogan is effective at mobilizing support for decriminalization and access to labor law protections, it does not refute the Nordic argument that legalization or decriminalization might increase trafficking or normalize exploitation; instead, it asserts that the harms of criminalization outweigh the harms of the market. In sum, the sentence slides between describing an economic activity to justify labor rights and prescribing a moral ontology to dismiss structural objections, and while the former supports extending occupational-health statutes, the latter often serves to insulate the industry from the specific critiques regarding coercion that the Nordic model seeks to address. I hope this delineation helps clarify the distinct logical moves being made in that discussion, allowing you to engage with the specific claim being offered rather than the slogan as a monolith.

  Sincerely,

  Your Colleague
