answer: |-
  1. **Exam Question**

  Opening claims: 'horse' names shape, 'white' names colour; colour-designators do not name shape. Advocate argues: seeking a horse accepts yellow/black, seeking a white horse does not; acceptable/unacceptable are opposed. The objector insists having a white horse is having a horse. Closing material questions if whiteness and horse separate from a white horse.

  Cases: (1) 'Wooden horse is not a horse' (true); (2) 'White horse is not a horse' (debated); (3) 'White horse' is a single unanalysable word with no 'horse' part.

  Can the delivery argument distinguish (1) from (2)? If not, what work do the shape/colour or separability claims do? What substantive thesis remains once verbal tricks are set aside?

  2. **Model Answer**

  The delivery argument turns on the restriction of acceptable responses. If one seeks a horse, yellow or black suffices; if one seeks a white horse, they do not. This pragmatic exclusion suggests the terms demand different things. However, applied to Case 1, the logic holds identically. If one seeks a horse, a wooden horse will not suffice; if one seeks a wooden horse, a living horse will not suffice. The delivery argument alone cannot distinguish the exclusion of a fake from the specification of a type. Both cases generate mutually opposed sets of acceptable responses. If the delivery argument were sufficient to prove 'X is not Y', it would prove 'wooden horse is not a horse' and 'white horse is not a horse' with equal force. The objector grants the former but denies the latter. Therefore, the delivery argument cannot be the sole ground for the thesis. It demonstrates functional difference, not ontological non-identity.

  Case 3 deepens this problem significantly. Imagine a language where 'white horse' is a single unanalysable word, containing no morpheme for 'horse' and none for 'white'. The delivery argument still functions pragmatically. If one seeks a horse using the simple word, the unanalysable white-horse-word might not suffice if the seeker implies 'any colour'. If one seeks the unanalysable white-horse-word, a black horse does not suffice. The pragmatic exclusion remains intact despite the lack of compositional semantics. This reveals that the delivery argument relies on usage conditions, not the internal structure of the name. Consequently, the argument cannot establish that 'white horse' is semantically distinct from 'horse' in a way that implies non-identity, because the same pragmatic effects arise even when the name is simple. The delivery argument shows how we use names, not what the names mean or what exists. It is a test of utility, not a proof of metaphysics.

  Since the delivery argument fails to distinguish specification from exclusion, the weight must shift to the opening claims about shape and colour. The advocate insists 'horse' designates shape and 'white' designates colour. This is not merely linguistic but metaphysical. Shape and colour are distinct categories of being. To name a horse is to name a shape; to name a white horse is to name a shape-colour compound. The argument here is that a compound entity is not identical to one of its components. A white horse is a fusion of whiteness and horseness. Because whiteness is not horseness, the compound is not the simple. This explains why the objector is wrong to say having a white horse is simply having a horse. Having a white horse is having a compound; having a horse is having a simple. The delivery argument merely illustrates the consequence of this ontological distinction in practical seeking. It shows that because the entities differ, the satisfaction conditions differ. Without the shape/colour premise, the delivery argument is blind to the difference between a wooden horse (false compound) and a white horse (true compound).

  The closing material on separability reinforces this ontological reading. If whiteness and horse could not be separated from the white horse, then the white horse would be a brute unity, indistinguishable from a simple name. But the advocate argues they are separable concepts, even if not physically separable in the object. This conceptual separability allows the advocate to claim that the name 'white horse' invokes two distinct realities, whereas 'horse' invokes one. The thesis is not that white horses do not exist, nor that they are not horses in a common-sense predication sense. The thesis is that the name 'white horse' refers to a distinct ontological category from 'horse'. The objector confuses the presence of a horse within the compound with the identity of the compound itself.

  What remains once verbal tricks are set aside is a demand for precise naming corresponding to precise reality. The sophistry charge arises because the conclusion 'white horse is not a horse' sounds like a denial of predication. But the advocate is denying identity. The substantive thesis is that language must carve reality at its joints. If 'horse' names a shape and 'white horse' names a shape-colour compound, conflating them blurs the distinction between simple and compound beings. The delivery argument shows the practical cost of this blur: you get the wrong animal. The shape/colour argument shows the metaphysical cost: you confuse categories. The unanalysable word case shows that without the metaphysical ground, the practical argument is ambiguous. Thus, the dialogue is not merely about ambiguity, but about the metaphysical prerequisites for successful naming. The advocate demands we recognize that compounds are not simples, even when the compound includes the simple. This is a claim about the structure of reality, not just the structure of sentences. The argument succeeds only if one accepts that names track ontological compounds rather than practical utilities.

  3. **Marking Scheme**

  1.  **Distinguish Case 1 from Case 2 (4 marks):** Must argue that the delivery argument treats 'wooden horse' and 'white horse' identically regarding acceptable responses, failing to distinguish exclusion (fake) from specification (type).
      *   *Mistake:* Asserting the delivery argument obviously proves Case 2 without addressing why Case 1 fits the same logic.
  2.  **Analyze Case 3 (Unanalysable Word) (4 marks):** Must explain that the delivery argument works pragmatically even without compositional semantics, proving it tests usage, not meaning or ontology.
      *   *Mistake:* Ignoring Case 3 or claiming the argument fails entirely in this language because the words are missing.
  3.  **Critique the Delivery Argument (4 marks):** Must conclude the delivery argument is insufficient alone to prove non-identity; it shows functional difference, not metaphysical distinction.
      *   *Mistake:* Treating the delivery argument as the primary proof of the thesis (the "sophistry" reading).
  4.  **Utilize Shape/Colour or Separability (4 marks):** Must identify these premises as providing the necessary metaphysical ground (compound vs. simple entity) that the delivery argument lacks.
      *   *Mistake:* Dismissing these premises as mere verbal definitions or confusing them with the delivery argument.
  5.  **Identify Substantive Thesis (4 marks):** Must articulate the remaining claim: names must track ontological compounds/identity, not just predication or utility (precision of naming).
      *   *Mistake:* Concluding the thesis is merely about linguistic ambiguity or that there is no substantive thesis left.

  **Thresholds:**
  *   **A (17–20):** Secures items 3, 4, and 5 clearly. Integrates Case 3 seamlessly.
  *   **B (13–16):** Secures items 1 and 2 well but wavers on the metaphysical implication (Item 4/5).
  *   **C (9–12):** Addresses the cases but falls back on stock ambiguity or sophistry claims (fails Item 3/5).

  4. **Closing Note**

  A genuinely good answer will feel the tension between the pragmatic force of the delivery argument and its semantic emptiness revealed by Case 3. It will not smooth this over but use it to pivot to the metaphysical premises. Merely fluent answers will glide past Case 3 or treat it as a trivial variation. I expect the strongest students to struggle most with articulating the positive thesis (Item 5); they may successfully dismantle the sophistry charge but hesitate to affirm the ontological claim, fearing it sounds equally paradoxical. Reward the courage to define the realist stance.
