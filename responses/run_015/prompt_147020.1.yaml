answer: |-
  Here is the direct answer: **Your biologist's intuition is fundamentally misplaced.** The analogy between adaptive landscapes and moral properties collapses, not because moral properties lack causal power (neither do landscapes), but because they lack **explanatory indispensability** within the causal web.

  The specific conceptual distinction that does the work is **Descriptive Modeling vs. Normative Authority.**

  Here is the breakdown of why the analogy fails.

  ### 1. The Status of Adaptive Landscapes
  You are correct that an adaptive landscape does not physically push genes around. It is an abstract, mathematical representation. However, in the philosophy of science, we accept it as "real" (or at least scientifically respectable) because it is **explanatorily indispensable** for predicting physical outcomes.

  *   **Supervenience:** The landscape is a second-order description of first-order physical facts (genotypes, phenotypes, environmental constraints). It supervenes entirely on the physical.
  *   **Predictive Power:** If you change the physical parameters (mutation rate, resource availability), the landscape changes, and your prediction of the population's trajectory changes. The landscape *tracks* causal powers.
  *   **Role:** It is a **descriptive model**. It tells you what *is* likely to happen given certain physical constraints.

  ### 2. The Status of Moral Properties
  The moral realist (specifically the non-naturalist, who is the target of the "causal inertness" charge) posits moral properties (Goodness, Rightness) as *sui generis* facts. They claim these facts exist independently of our beliefs and physical configurations.

  *   **Explanatory Idleness:** This is where the analogy breaks. To justify positing an entity in our ontology, science demands that the entity do explanatory work that physical facts alone cannot do.
      *   In biology, you *need* the concept of fitness to explain why trait A outcompetes trait B over time, even if "fitness" itself doesn't push.
      *   In ethics, you do **not** need the property of "Goodness" to explain why humans make moral judgments. Evolutionary psychology, sociology, and neuroscience explain moral judgments entirely through causal mechanisms (social conditioning, kin selection, reciprocity algorithms).
  *   **The Gap:** Positing a real property of "Wrongness" adds zero predictive power to the explanation of why someone refrained from stealing. The explanation is fully satisfied by "They believed it was wrong" + "They desired to act morally." The actual existence of "Wrongness" in the universe is explanatorily redundant.

  ### 3. The Core Distinction: Direction of Fit
  The deeper category error is treating a **normative commitment** as an **ontological posit**.

  *   **Adaptive Landscapes (Mind-to-World):** These are tools we construct to match the world. If the data changes, we redraw the landscape. They have a *mind-to-world* direction of fit. They are subordinate to empirical evidence.
  *   **Moral Properties (World-to-Mind):** Moral realism claims these properties dictate how agents *ought* to act, regardless of their desires. They claim a *world-to-mind* direction of fit (or rather, a reason-giving authority).

  The anti-realist's "causal inertness" argument is actually a shorthand for this: **If a property claims to be part of the furniture of the world, it must earn its keep by explaining features of that world.** Adaptive landscapes earn their keep by organizing causal data. Moral properties do not; they stand outside the causal web, claiming authority over it without interacting with it.

  ### Verdict
  Your intuition is **conceptually mistaken.** Science tolerates causally inert constructs only when they are **indispensable for organizing causal data.** Adaptive landscapes pass this test; moral properties fail it.

  The problem is not that moral properties lack quantitative structure (though they do); the problem is that they are **explanatorily dispensable.** We can have the entire history of human moral behavior without positing that "Goodness" exists as a property in the universe. We cannot have evolutionary theory without positing something functionally equivalent to fitness landscapes.

  Therefore, the causal-inertness charge holds. Moral properties are not like adaptive landscapes; they are like phlogiston—a posit invoked to explain a phenomenon (moral judgment) that is already fully explained by other causal mechanisms (psychology and evolution).
