      *   *Limitations:* One-shot, exogenous state (the "truth" doesn't change based on decisions), signals are usually about quality/value.
      *   *Application to Panic Buying:* The "value" isn't quality, it's *availability*. The "truth" (supply) is endogenous (affected by buying). This breaks the standard model.

  3.  **Drafting the Response - Section by Section:**

