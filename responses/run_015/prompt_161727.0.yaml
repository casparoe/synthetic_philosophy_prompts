          *   *Reality:* Officials said "Supply is fine." Shelves said "Supply is gone."
          *   *Theory Nuance:* "Cheap talk" vs. "Hard signals." In game theory, cheap talk (unverified statements) has low weight if incentives aren't aligned. Visual evidence (empty shelf) is a hard signal. Also, the *incentive* changed (cost of being wrong went up).
