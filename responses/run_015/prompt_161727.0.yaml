      *   *Correction on Fragility:* Why didn't officials break it? Because the cost of error was asymmetric. If officials are wrong, I have no TP. If I ignore officials and they are right, I have too much TP. The loss function changed. Standard cascade models usually assume symmetric payoffs. I need to mention *payoff asymmetry*.
