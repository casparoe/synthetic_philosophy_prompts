prompt: |-
  I'm trying to write down, in advance, what any claim of the form "this culture / these values caused that economic outcome" has to be able to do before I'll take it seriously. Weber's protestant ethic argument is the canonical case but I want the rubric to be general, so it can be applied to any culture-as-cause story.

  Give me the desiderata list, each requirement with the concrete case or worry that motivates it. At minimum it needs to deal with:

  - the independence problem: if you only know a group had the relevant ethic because they did the thing the ethic predicts, you've redescribed the outcome, not explained it — so what does an independent measure of the value have to look like?
  - reasons vs causes: Weber wanted an account to be adequate both on the level of meaning and causally, and it's not obvious you can have both at once when the actors' own avowals of the value are partly self-serving rationalizations of what they were doing anyway
  - whose values: aggregate mean vs distribution, and the fact that it's often a minority of intense beleivers doing the causal work while the majority merely assents
  - the retreat to elective affinity: does recasting the claim as an affinity between an ethic and an economic ethos preserve the causal content or quietly give it up?

  Then mark which of your requirements are non-negotiable and which are really just the priors of one camp — institutionalists, rational choice types, cultural sociologists each demand different things and I don't want to smuggle in one camp's preferences as "adequacy." If some subset of the desiderata is jointly unsatisfiable, say so explicitly and show why; that's the part I most want to see. Finish with a couple of sentences on which single requirement does the most work ruling out otherwise attractive stories. No reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested rubric:

  1.  **Analyze the Request:**
      *   **Goal:** Create a rubric (desiderata list) for evaluating claims that "culture/values caused economic outcomes."
      *   **Canonical Case:** Weber's *Protestant Ethic*.
      *   **Specific Constraints:** Must address four specific problems: Independence, Reasons vs. Causes, Whose Values (distribution), and Elective Affinity.
      *   **Critical Analysis:** Distinguish between non-negotiable requirements and camp-specific priors (Institutionalists, Rational Choice, Cultural Sociologists). Identify if any subset is jointly unsatisfiable.
      *   **Conclusion:** Identify the single requirement that does the most work in ruling out attractive stories.
      *   **Constraint:** No reading list.
      *   **Tone:** Analytical, rigorous, philosophical/sociological.

  2.  **Deconstruct the Four Specific Problems:**

      *   *Independence Problem:* Tautology risk. If "capitalist spirit" is defined by "capitalist behavior," it explains nothing. Need independent measurement of values (e.g., sermons, diaries, theological texts) *prior* to or *distinct* from the economic behavior.
      *   *Reasons vs. Causes:* Weber's *Verstehen* vs. causal explanation. Actors might claim they work hard for God, but maybe they work hard because they are poor, and the religion is just a justification. Need to distinguish motivation from post-hoc rationalization.
      *   *Whose Values:* Aggregation error. Did the whole culture believe it, or just a specific subset (e.g., urban merchants)? If it's a minority, how does it scale to a macro outcome?
      *   *Elective Affinity:* Weber's fallback. If it's not strict causation but "affinity," does it lose predictive/explanatory power? Is it just a correlation dressed up?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Draft 1 (Mental):*
          1. Measure values separately from behavior.
          2. Show values came before behavior.
          3. Show the people with values are the ones doing the behavior.
          4. Don't just say they fit together, show how one pushes the other.
      *   *Critique 1:* Too simple. Needs to address the "Reasons vs. Causes" tension and the "Camp Priors" distinction.

      *   *Draft 2 (incorporating specific constraints):*
          1. **Independent Measurement:** Values must be measurable without looking at the economic outcome. (Motivation: Independence Problem).
          2. **Temporal Precedence:** Values must exist before the economic shift. (Motivation: Causality).
          3. **Mechanism of Transmission:** How does a belief in a head become an action in a market? (Motivation: Reasons vs. Causes).
          4. **Representative Causality:** Is it the majority or a vanguard? (Motivation: Whose Values).
          5. **Counterfactual Strength:** If the value wasn't there, would the outcome differ? (Motivation: Elective Affinity).

      *   *Refining for the Prompt's Nuance:* The prompt asks to distinguish non-negotiables from camp priors. This is the tricky part.
          *   *Rational Choice:* Wants mechanisms, incentives, individual utility.
          *   *Institutionalists:* Wants rules, constraints, path dependence.
          *   *Cultural Sociologists:* Wants meaning, constitutive effects, ambiguity.
          *   *Non-negotiable:* Probably logical coherence (no tautologies) and temporal ordering.
          *   *Camp Prior:* The *type* of mechanism (e.g., utility maximization vs. internalized norm).

      *   *Addressing Joint Unsatisfiability:* This is the core intellectual challenge. Can you have independent measurement *and* capture the "meaning" aspect (Reasons vs. Causes)? If you measure values via surveys (independent), you lose the historical context. If you measure via texts (context), you risk tautology. Also, "Elective Affinity" is often used *because* strict causation fails. Demanding strict causation might kill the "Affinity" claim, but accepting Affinity might kill the "Cause" claim.

  4.  **Developing the Rubric Items:**

      *   *Item 1: The Independence Criterion.* (Addresses Independence Problem).
      *   *Item 2: The Mechanism Criterion.* (Addresses Reasons vs. Causes).
      *   *Item 3: The Carrier Criterion.* (Addresses Whose Values).
      *   *Item 4: The Counterfactual Criterion.* (Addresses Elective Affinity).

  5.  **Analyzing Camp Priors vs. Non-Negotiables:**

      *   *Non-Negotiable:* Independence (logic), Temporal Precedence (logic).
      *   *Camp Prior:* Mechanism (Rational Choice wants incentives; Culturalists want constitutive norms). Counterfactuals (Institutionalists love them; Culturalists find them hard to define for meaning).

  6.  **Identifying the Tension/Unsatisfiability:**

      *   The tension lies between *Independence* and *Reasons vs. Causes*. To measure values independently (e.g., theological doctrine), you often lose the link to actual motivation (actors might ignore doctrine). To measure motivation (e.g., diaries), you risk post-hoc rationalization.
      *   Also, the tension between *Causal Claim* and *Elective Affinity*. If you demand strict causation (Counterfactual), "Affinity" fails. If you accept "Affinity," it's often too vague to be falsifiable.

  7.  **Selecting the "Single Requirement" that does the most work:**

      *   It's likely the **Independence Criterion**. Most cultural arguments collapse because the "value" is inferred from the "behavior" it supposedly explains.

  8.  **Drafting the Content (incorporating the "Think Silently" instructions):**

      *   *Structure:*
          1.  Introduction (brief).
          2.  The Desiderata List (4 items, with motivation and camp analysis).
          3.  The Unsatisfiability Section.
          4.  The Single Requirement Conclusion.

      *   *Refining the "Camp Priors" section:* I need to be careful not to validate one side. I need to show *why* a requirement might be contested. For example, Cultural Sociologists might reject strict "Independent Measurement" if it quantifies meaning too reductively. Rational Choice might reject "Elective Affinity" as mysticism.

      *   *Refining the "Unsatisfiability":* The prompt asks to show *why* a subset is jointly unsatisfiable. The best candidate is the triad of: (1) Strict Causal Independence, (2) Adequacy on the Level of Meaning (Weberian Verstehen), and (3) Macro-Level Explanation. You can usually get two, but rarely all three. If you measure independently (surveys), you lose meaning. If you focus on meaning (texts), you lose macro-causal leverage.

      *   *Final Polish:* Ensure the tone is sharp and avoids academic fluff. No reading list.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address "Elective Affinity"? Yes, need to make sure the rubric tests whether "affinity" is just a retreat from falsification.
      *   *Check:* Did I address "Whose Values"? Yes, the "Carrier" criterion.
      *   *Check:* Did I distinguish non-negotiables from priors? Yes, will label them.
      *   *Check:* Is the "Single Requirement" clear? Yes, Independence.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a rubric for evaluating cultural causation claims, structured around the four specific problems you identified, followed by an analysis of camp priors, logical tensions, and the single most exclusionary requirement.

  ### The Desiderata List

  **1. The Independence Criterion**
  *   **Requirement:** The measure of the "value" or "ethic" must be operationalized without reference to the economic behavior it is supposed to explain.
  *   **Motivation (The Independence Problem):** If you define "the Protestant Ethic" as "the propensity to save and invest," you have not explained capitalism; you have renamed it. The value must be observable in a domain distinct from the market (e.g., theological texts, confession records, family correspondence) *before* the economic outcome is observed.
  *   **Status:** **Non-Negotiable.** Without this, the argument is a tautology.
  *   **Camp Friction:** Cultural sociologists sometimes argue that values are *constituted* by practices, making strict independence impossible. Rational choice theorists demand independence but often reduce "values" to stable preference orderings, which culturalists argue strips the value of its content.

  **2. The Mechanism Criterion**
  *   **Requirement:** The account must specify the transmission belt between the internal state (belief/meaning) and the external action (economic behavior), distinguishing motivation from rationalization.
  *   **Motivation (Reasons vs. Causes):** Actors often avow values that justify behavior driven by material necessity. A claim must show that the value constrained or directed action in a way that material incentives alone would not predict. It must explain why the actor felt they *could not* act otherwise, or why they chose a less materially efficient path due to the value.
  *   **Status:** **Camp Prior.**
      *   *Rational Choice:* Demands the mechanism be reducible to incentives (e.g., religious reputation acts as collateral).
      *   *Cultural Sociologists:* Demand the mechanism be interpretive (the world becomes intelligible only through the value).
      *   *Institutionalists:* Want the mechanism to be regulatory (values become rules).
  *   **Worry:** If the mechanism is purely psychological, it is hard to aggregate. If it is purely institutional, it is no longer a "culture" argument.

  **3. The Carrier Criterion**
  *   **Requirement:** The claim must identify the specific demographic vector carrying the value and demonstrate how a subset's behavior scales to the aggregate outcome.
  *   **Motivation (Whose Values):** Cultural claims often treat "societies" as uniform blobs. In reality, values are often held by a intense minority (e.g., sect members) while the majority free-rides or ignores them. The argument must explain how the minority's ethic becomes the majority's constraint (e.g., through competition, coercion, or mimicry).
  *   **Status:** **Non-Negotiable.** Aggregate correlations without distributional data commit the ecological fallacy.
  *   **Camp Friction:** Institutionalists often bypass this by assuming isomorphism (organizations look alike). Culturalists often assume "diffusion" without specifying the network.

  **4. The Counterfactual Criterion**
  *   **Requirement:** The claim must specify what would have happened in the absence of the value, distinguishing "causal leverage" from "elective affinity."
  *   **Motivation (The Retreat to Elective Affinity):** "Affinity" is often a safe harbor for failed causal claims. If the value and the outcome merely "fit" well, it may be coincidence or a third factor causing both. To be causal, the value must rule out other viable economic paths that were historically available.
  *   **Status:** **Jointly Unsatisfiable (See below).**
  *   **Camp Friction:** Rational choice and Institutionalists demand strong counterfactuals. Cultural sociologists often argue that meaning is context-dependent, making "removing" the value in a thought experiment incoherent (you change the whole world, not just the variable).

  ***

  ### The Joint Unsatisfiability

  There is a triad of demands that cannot be simultaneously satisfied in historical cultural analysis. You can have any two, but not all three:

  1.  **Strict Causal Independence** (The value is measured separately and exerts force).
  2.  **Adequacy on the Level of Meaning** (The explanation makes sense to the actors/Weberian *Verstehen*).
  3.  **Macro-Level Explanation** (The claim explains a large-scale economic outcome).

  **Why they are incompatible:**
  To satisfy **Strict Causal Independence**, you must quantify the value (e.g., church attendance rates, book sales). This usually strips the value of its specific **Meaning** (you know they went to church, not what they felt), rendering the *Verstehen* aspect hollow.
  To satisfy **Adequacy on the Level of Meaning**, you must dive into qualitative depth (diaries, sermons). This makes it difficult to scale up to a **Macro-Level Explanation** because you cannot prove the intense feelings of a few diarists drove the national economy.
  To satisfy **Macro-Level Explanation**, you rely on aggregate data. This forces you to assume homogeneity (violating the **Carrier Criterion**) and often leads to inferring values from outcomes (violating **Independence**).

  Most successful "culture" arguments survive by quietly dropping the second requirement (Meaning) and acting like institutionalists, or by dropping the first (Independence) and acting like interpreters. Weber's *Protestant Ethic* survives because it oscillates ambiguously between them.

  ***

  ### Camp Priors vs. Non-Negotiables

  *   **Non-Negotiable:** **The Independence Criterion.** If you cannot measure the cause without looking at the effect, you are doing poetry, not social science. This is a logical requirement, not a methodological preference.
  *   **Camp Prior:** **The Mechanism Criterion.** *How* you satisfy this reveals your tribe. If you say the mechanism is "signaling trust to reduce transaction costs," you are an Institutionalist/Rational Choice theorist. If you say the mechanism is "constituting the very concept of profit," you are a Cultural Sociologist. Neither is objectively "adequate" without accepting their underlying ontology.
  *   **Camp Prior:** **The Counterfactual Criterion.** Institutionalists view this as the gold standard. Culturalists often view it as positivist nonsense, arguing that you cannot subtract a worldview from a historical epoch and leave the rest of the psychology intact.

  ***

  ### The Single Most Exclusionary Requirement

  **The Independence Criterion** does the most work ruling out otherwise attractive stories.

  Most cultural explanations are compelling narratives that collapse the moment you ask, "How do you know they held this value *before* they got rich?" Once you force the claimant to produce a measure of the ethic that does not rely on the economic behavior it predicts (e.g., requiring evidence of ascetic spending *prior* to capital accumulation, rather than inferring asceticism from the accumulation itself), the majority of "culture caused growth" arguments evaporate into post-hoc storytelling. It forces the claim to risk falsification, which most cultural narratives are designed to avoid.
