          *   Refine (1): Distinguish between *Truth-Tracking* (what is good) and *Authority-Granting* (who decides). CEV tracks truth, but authority might require a "Lock-in" condition (actual consent to the framework).
          *   **The "Meta-Autonomy" Solution:** S* prefers that S's actual choices be respected *unless* they violate a specific threshold (e.g., irreversible harm), because S* values S's status as an agent.
      *   **Address the Cost:** What do we pay? We pay by admitting CEV isn't a simple function $f(actual) \rightarrow ideal$. It requires a normative constraint *outside* the extrapolation (e.g., a presumption of liberty) or a complex weighting of procedural values within the extrapolation.

