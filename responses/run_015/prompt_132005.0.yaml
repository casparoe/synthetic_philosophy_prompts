      *   **User's Hypotheses:** Ambiguity in "authoritative" (1st vs. 2nd order), quantifier shift (general correction vs. specific autonomy), or modal slide (counterfactual to actual).
      *   **Goal:** Identify the leak in the argument and propose a fix that preserves the core CEV intuition without licensing tyranny.

