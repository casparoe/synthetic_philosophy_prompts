answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION: POPULATION ETHICS READING GROUP**

  **1. Agreed Claims**

  1.  Choices regarding the timing and conditions of conception determine which specific individuals exist; identity is contingent on these choices.
  2.  Some possible lives are worth living, others are not, and some are so miserable they should not be begun.
  3.  Causing pain is pro tanto bad; causing pleasure is pro tanto good, regardless of who experiences them.
  4.  Non-existence is not a state of welfare and cannot be better or worse for the non-existent person.
  5.  We have moral obligations regarding future generations, even if those generations do not yet exist.
  6.  The teenager case involves a choice between a worse-off child and a different, better-off child who would exist had she waited.
  7.  Moral theories should avoid absurd practical implications, such as obligating us to populate the earth until resources collapse.
  8.  Consistency across cases is a theoretical virtue; ad hoc exceptions weaken a moral framework.
  9.  Risk and uncertainty are relevant to moral evaluation; imposing high risks of harm is distinct from causing actual harm.
  10. Both sides reject the conclusion that we are obligated to maximize population size regardless of average quality of life.
  11. Both sides reject the conclusion that causing a miserable life is permissible simply because the alternative is non-existence.
  12. Theoretical costs must be weighed against intuitive fit; no theory captures every pre-theoretical judgment without revision.

  **2. Disagreements**

  | Issue | Impersonalist Wording | Person-Affecting Wording | Genuine or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Source of Wrongness** | "Outcome O1 is impersonally worse than O2 because it contains less value." | "Act A is wrong only if it makes some particular person worse off than they would otherwise be." | **Genuine.** Disagreement on whether value resides in states of affairs or relations between agents and patients. |
  | **Status of Non-Existence** | "Non-existence is a baseline for comparison in evaluating total value." | "Non-existence is no baseline; you cannot compare existence to nothing for a specific subject." | **Verbal.** Both agree on the metaphysics; disagree on whether 'comparison' requires a subject. |
  | **The Asymmetry** | "Creating a happy person is good (or neutral); creating a miserable person is bad." | "Creating a happy person is neutral; creating a miserable person is wrong." | **Genuine.** Disagreement on whether benefits confer moral reasons when no prior subject exists to receive them. |
  | **Scope of Duty** | "We ought to bring about the best available state of affairs." | "We ought not to violate duties owed to specific persons." | **Genuine.** Disagreement on whether morality is fundamentally teleological or deontological regarding persons. |

  **3. Cruxes**

  **Crux 1: The Asymmetry**
  *Neutral Statement:* Does the potential benefit to a possible person generate a moral reason to create them?
  *Test Case:* A couple can conceive a happy child now or wait and conceive no child. The child's life would be worth living.
  *Impersonalist Prediction:* Creating the child is morally good (or permissible), as it adds positive value to the world. Failing to create is neutral or slightly worse.
  *Person-Affecting Prediction:* **Ex Post:** Creating is neutral; no one is harmed by not creating. **Ex Ante:** Creating is neutral; the possible child has no prior claim to exist. Both agree creating a miserable child is wrong.

  **Crux 2: Mere Addition**
  *Neutral Statement:* Is adding happy people to an existing population always an improvement?
  *Test Case:* Population A exists. We can add Population A+ (same people plus extra happy people) without affecting A's welfare.
  *Impersonalist Prediction:* A+ is better than A. Total value increases; no one is harmed.
  *Person-Affecting Prediction:* **Ex Post:** A+ is not better than A. The extra people are not benefited (they wouldn't exist otherwise), and existing people are unchanged. **Ex Ante:** Neutral. Adding them satisfies no one's antecedent interests.

  **Crux 3: Climate Policy (Identity Reshuffling)**
  *Neutral Statement:* Is a policy wrong if it harms future people who would not have existed under the safer alternative?
  *Test Case:* Risky energy policy boosts current welfare but causes climate damage harming future people. Safer policy changes conception timing, so different future people exist.
  *Impersonalist Prediction:* Risky policy is wrong if the future outcome contains less total welfare than the safer outcome. Identity shifts are irrelevant.
  *Person-Affecting Prediction:* **Ex Post:** Risky policy is not wrong regarding future people. They have lives worth living and cannot complain they were harmed (they wouldn't exist otherwise). **Ex Ante:** Risky policy may be wrong if it imposed an unacceptable risk of harm on whoever would come to exist, regardless of identity.

  **Crux 4: Non-Existence as Comparator**
  *Neutral Statement:* Can a life be "worth living" yet still be a harm to the person living it compared to never existing?
  *Test Case:* A child is born with a chronic, painful condition. Life is worth living (positive net welfare), but painful.
  *Impersonalist Prediction:* Creating the child is better than not creating, provided net welfare is positive.
  *Person-Affecting Prediction:* **Ex Post:** Creating is not wrong. The child is not worse off than in the alternative (non-existence). **Ex Ante:** Creating may be wrong if the risk of suffering was too high relative to the benefit, even if net welfare is positive.

  **4. The p-dial**

  We adopt the "p-dial" diagnostic to test the sensitivity of wrongness to identity continuity. In the standard early-conception case, we hold the well-being gap fixed and vary *p*, the credence that the child born later is numerically identical to the child born now. *p=1* is ordinary harm; *p=0* is textbook nonidentity.

  | View | p = 0 (Nonidentity) | p = 0.5 (Uncertain) | p = 1 (Identity) |
  | :--- | :--- | :--- | :--- |
  | **Impersonal** | Wrong (Lower Value) | Wrong (Lower Value) | Wrong (Lower Value) |
  | **Ex Post PA** | Permissible (No Victim) | Permissible (No Victim) | Wrong (Victim Harmed) |
  | **Ex Ante PA** | Wrong (High Risk) | Wrong (Med Risk) | Wrong (Certain Harm) |

  *Coherence Note:* Impersonalists view the dial as irrelevant; value tracks welfare, not identity. Ex Post PA views identity as all-or-nothing; wrongness jumps at the threshold of sameness. Ex Ante PA views the dial as coherent; wrongness scales with the probability of imposing harm on a specific subject. Regarding the delay knob (developmental history): Impersonalists see no change. Ex Post PA sees a jump only if identity supervenes on history. Ex Ante PA sees smooth scaling as shared history increases the probability of identity. If identity is vague, Ex Post PA faces a sorites problem; Ex Ante PA treats vagueness as risk.

  **5. What Would Move Each Side**

  The Impersonalist camp would move toward a Person-Affecting restriction if shown that impersonal value inevitably mandates counterintuitive obligations (e.g., mandatory procreation) or fails to explain the special badness of harm versus the goodness of benefit. They require a proof that morality collapses without an impersonal standpoint.

  The Person-Affecting camp would move toward Impersonalism if shown that the Ex Ante variant cannot resolve the Nonidentity Problem without collapsing into impersonalism (e.g., if "risk to whoever exists" equals "expected value"). They require a proof that person-affecting views can handle climate cases without implying future people have no claims against us. Both sides require a solution to the Asymmetry that does not violate their core metaphysical commitments.

  **6. Residual Disagreement**

  We acknowledge that our divergence stems from foundational commitments regarding the structure of moral value. We agree to test these commitments against the p-dial and the cruxes above without presupposing the other's framework is incoherent.

  *Impersonalist Sign-off:* "We maintain that the rightness of an act is determined by the value of the outcome it produces, independent of who exists to experience it."
  *Person-Affecting Sign-off:* "We maintain that the wrongness of an act is determined by the duties owed to specific persons, actual or potential, who are affected by it."
