answer: |-
  # Seminar Handout: The Reference Class Problem
  **Case Study:** *The Claimant*
  A court must estimate the probability that a specific claimant would have developed a medical condition had she not been exposed to a tortious agent.
  **Known attributes:** Female, 44 years old, left-handed, former competitive swimmer, non-smoker, resident of a small town.
  **The Tension:** Conjoining these properties narrows the reference class. Eventually, the class contains only the claimant ($n=1$), where frequency data vanishes. Yet coarser classes (e.g., '44-year-old females') include individuals relevantly different from her.

  ---

  ## Decision Tree: Selecting a Reference Class

  **Node 1: The Ontology of Single-Case Probability**
  To assign a probability to the claimant developing the condition, must we first locate her within a broader group of similar individuals?
  *   **Yes:** (Proceed to Node 2)
  *   **No:** (Proceed to Node 5)

  **Node 2: The Constraint on Classification**
  If a group is required, what determines the correct level of generality for that group?
  *   **The practical purposes of the inquiry (e.g., legal compensation vs. medical prognosis):** (Proceed to Leaf A)
  *   **Statistical or causal criteria independent of the inquiry's purpose:** (Proceed to Node 3)

  **Node 3: The Stopping Condition**
  When narrowing the group by adding attributes (e.g., moving from '44-year-olds' to '44-year-old swimmers'), what constitutes the correct stopping point?
  *   **When adding further attributes renders the frequency estimate statistically unstable or unreliable:** (Proceed to Leaf B)
  *   **When adding further attributes fails to alter the frequency (i.e., the new attribute is statistically irrelevant):** (Proceed to Leaf C)
  *   **We should not stop until we have accounted for every known attribute of the individual:** (Proceed to Node 4)

  **Node 4: The Limit of Specificity**
  If we account for every known attribute, we arrive at a class of one (the claimant herself). Is this a valid reference class?
  *   **Yes:** (Proceed to Leaf D)
  *   **No:** (Proceed to Leaf E — *Unnamed*)

  **Node 5: The Dissolution**
  If no group is required, how is the probability determined?
  *   **By conditionalising a rational degree of belief on the total evidence available:** (Proceed to Leaf F)
  *   **By recognising that the probability is a primitive fact about the single case, making the search for a class a category error:** (Proceed to Leaf G)

  ---

  ## The Leaves (Philosophical Positions)

  *   **Leaf A: The Contextualist**
      *   *Position:* There is no single "true" reference class. The appropriate class is fixed by the specific goals and constraints of the context (e.g., a court may prioritise fairness over predictive accuracy).
  *   **Leaf B: The Reichenbachian**
      *   *Position:* Adopt the narrowest class for which reliable statistics can be obtained. Over-specifying is a mistake because it sacrifices the stability of the frequency estimate.
  *   **Leaf C: The Homogeneity / Maximal Specificity View**
      *   *Position:* Refine the class until it is *homogeneous*—that is, until no further known attribute screens off the outcome. We stop not when data runs out, but when relevance runs out.
  *   **Leaf D: The Total Evidence Frequentist**
      *   *Position:* (Theoretically possible, rarely held). One should use the singleton class, treating the single case as a frequency of its own.
  *   **Leaf E: Unnamed (Incoherent)**
      *   *Position:* Insists a group is necessary (Node 1: Yes) but rejects the singleton class (Node 4: No) while demanding total specificity (Node 3: All attributes). This combination is logically unoccupied because it demands a class that is both maximally specific and larger than one.
  *   **Leaf F: The Subjectivist Dissolution**
      *   *Position:* The puzzle dissolves. Probability is a measure of rational credence. One simply conditionalises on the total evidence (the claimant's specific attributes) without needing a frequency class.
  *   **Leaf G: The Deflationist**
      *   *Position:* Single-case probability needs no class at all because the probability is a primitive feature of the situation (or talk of 'probability' here is merely shorthand for evidence). The search for a class is a philosophical confusion.

  ---

  ## Commentary on Logical Space

  ### 1. Empty and Unoccupied Combinations
  The tree explicitly identifies **Leaf E** as unoccupied. This combination is incoherent. It arises if one answers that a reference class is strictly necessary (rejecting single-case ontology), yet also insists that one must conditionalise on *all* evidence (which yields a class of one), while simultaneously denying that a class of one is valid. Traditional Frequentists occupy the space of Node 1 (Yes) but must retreat to Node 3 (Stop when stats run out) to avoid this contradiction. They cannot demand total evidence *and* require a frequency $>1$.

  ### 2. Indistinguishable Leaves
  There is a significant overlap between **Leaf F (Subjectivist Dissolution)** and **Leaf G (Deflationist)**.
  *   **Why they blur:** In practice, both positions advise the student to stop searching for a reference class. Both tell the court to look at the specific evidence regarding the claimant rather than aggregating her into a group.
  *   **The Distinction:** The difference is metaphysical rather than methodological. The Subjectivist treats the output as a *degree of belief* (Bayesian credence), whereas the Deflationist may treat it as a *logical relation* or a primitive *propensity* that does not rely on grouping. On this decision tree, however, they offer identical practical guidance: "Do not pick a class."

  ### 3. Tension Between Leaves B and C
  Students should note the friction between the **Reichenbachian (Leaf B)** and the **Homogeneity View (Leaf C)**.
  *   **Reichenbach** prioritises *reliability* (sample size).
  *   **Homogeneity** prioritises *relevance* (causal screening).
  *   In the case of the claimant, a Reichenbachian might place her in the class '44-year-old non-smokers' (large $n$, reliable stats), ignoring her swimming history if data on swimmers is sparse. A Homogeneity theorist would insist on including 'swimmer' if that trait causally screens off other factors, even if the resulting statistics are less stable. The tree separates these at Node 3, but in empirical practice, the line between "unstable statistics" and "irrelevant attributes" can be difficult to draw.

  ### 4. A Note on Contextualism (Leaf A)
  The **Contextualist** position is the only one that bypasses Node 3 entirely. If the class depends on the question being asked, there is no universal stopping condition for refinement. This makes Leaf A compatible with the *outputs* of B or C, depending on the context, but incompatible with their claim to be the *unique* correct method.

  ---
  *Prepared for the Graduate Seminar in Philosophy of Probability. Please read Hájek (2007) and Salmon (1984) prior to discussion.*
