      *   Problem 2: The "Later" people might not be the same people. If the barrier fails later, the town disperses. The people who would have lived there don't exist. You can't trade with ghosts.
      *   Problem 3 (The Office): The office exists because councils always kick the can. If she says no, they might just fire her or change the rule. If she says yes, the next junior clerk does this again in 40 years.
      *   The Horizon: She calculates out to 100 years. The value drops to nothing. Does that mean nothing matters in 100 years? Or that her math is wrong?
      *   Conclusion: She dips the pen. She has to write "Approved" or "Denied". She writes... actually, just show her preparing to write.

  5.  **Writing - Focus on Sensory Details and Internal Monologue:**
      *   Keep the language grounded. "Ledger kept twice." "Room above the harbour office."
