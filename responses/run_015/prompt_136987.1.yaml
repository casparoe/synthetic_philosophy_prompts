answer: |-
  The sea beat against the outside of the wall with a rhythm that felt less like nature and more like a clock, a steady heavy thud that vibrated through the floorboards of the harbour office and up into the room where Elara sat. She was the junior clerk of the Intergenerational Review, a title that sounded grander than the reality of a single desk, a pot of cold coffee, and a ledger kept twice. The ledger was the core of the office's work, bound in grey cloth with columns for the present year and columns for the projected years, inked in different colours to mark the separation between what was felt now and what would be felt later. On her desk lay the file for Proposal Eighty-Four, a request from the Engineering Council to defer the reinforcement of the storm barrier for forty years. The cost of doing the work now was steep, enough to drain the reserve fund for the fishing fleet and halt the renovation of the schoolhouses. The cost of doing it later was higher in raw numbers, but the proposal argued that the burden would be lighter.

  Elara opened the file and read the justification again. The engineers claimed that capital spent today was capital denied to the industries that would sustain the town through the next decade. If the barrier held for forty years without reinforcement, as their models suggested it might, the money saved now would build markets and roads that would generate wealth. That wealth would belong to the people living in forty years, making the eventual bill easier for them to pay. There was also the question of existence. The town was shrinking. If the population continued to drift inland, there might not be anyone left to need the barrier, or the nature of the storms might change so fundamentally that the current design would be obsolete anyway. Why spend a fortune on a shield for a war that might not be fought, by soldiers who might not be born?

  She leaned back in her chair and listened to the thud of the water. The argument was smooth, polished by decades of similar requests. But there was a texture to it that bothered her, a slickness that hid the grain of the wood beneath. She suspected that some of the reasoning was merely the bare later-ness of the cost wearing the costume of prudence. It was easy to promise pain to a stranger, even if that stranger was yourself grown old, but it was harder to promise pain to a neighbour standing in the room. To separate the respectable reasons from the disreputable one, she closed her eyes and ran the test she had devised during her first year. She imagined the Council members who would vote on this proposal were not told when they would live. She imagined they drew lots from a bag. Some would wake up today to pay the bill. Others would wake up in forty years to face the storm. None would know their draw until after the vote was cast.

  In this blind lottery, she reasoned, no one would vote to defer the work simply because the payment was later. If you might be the one standing in the water in forty years, you would want the wall built now. If the only reason to wait was that the cost was distant, the blind lottery would expose it. The Council would choose safety over savings. But as she held the image in her mind, the first trouble spot appeared. The economic projections in the file were specific. The town's primary export, a refined kelp polymer, was becoming more valuable. The models showed that in forty years, the average income would be triple what it was today. Even if a Council member drew the lot to live in the future, knowing they would be three times richer, they might still vote to defer. The pain of the cost would be objectively smaller for them than the pain of the cost was for the current generation. The blind lottery did not cancel out the difference in wealth; it merely highlighted that a dollar hurt less when you had more of them. The test did not clear the air; it only showed that the future people might genuinely prefer to pay the bill themselves because they would be better equipped to carry it.

  Elara opened her eyes and looked at the second column of the ledger. There was a second trouble spot, one that made the ink seem to smear. The office existed because the Council had a history of kicking the can. If she recommended approval of this deferral, there was no guarantee the bill would be paid in forty years. The Council then would face the same choice. They could reinforce the wall, or they could defer it again for another forty years. The office was staffed precisely because everyone knew the deferment was likely to be recursive. The people living in forty years might not be the ones paying the bill; they might be the ones passing it to the people in eighty years. Her test assumed a fixed point of payment, but the reality was a chain of hand-offs. Furthermore, who exactly would be living here in forty years depended on what was spent now. If the money was spent on schools today, different children would survive and thrive, leading to different families in the future. If the money was spent on the wall, the town might remain static. The group of people she was trying to protect in her mental exercise did not exist yet. You could not trade places with ghosts. The people who would suffer if the wall failed were not the same people who would benefit from the schools if the wall was built. The identity of the town was fluid, shifting with every budget allocation.

  She picked up her pen and hovered it over the recommendation box. There was a third thing, quieter than the others, that she had noticed only recently while reviewing a century-old file from the founding of the office. She had been calculating the weight of a benefit projected two hundred years out. To make the numbers balance, she had to apply the standard shrinkage factor used for all future calculations. As she pushed the date further out, the value of the benefit dropped. At fifty years, it was significant. At one hundred, it was manageable. At two hundred, the number became so small that it would not justify even the cost of printing the paper the calculation was written on. It stopped mattering how large the benefit was; if it was far enough away, it shrunk below the threshold of any action.

  This implied something about her job that she could not say aloud. If the math held, then anything beyond a certain horizon was invisible. It did not mean the future people did not matter, but it meant that within the logic of the ledger, their suffering or their joy could never outweigh a concrete cost today. If she followed the rules of the office strictly, she was required to treat the distant future as negligible. But if the distant future was negligible, then the office itself was a theatre piece, a way for the present to feel virtuous about looking ahead while ensuring they never actually had to sacrifice anything for a time they would not see. The ledger kept twice was a lie if the second half of the book was always blanked out by the mathematics of distance.

  The sound of the sea surged, louder this time, as if the tide was turning. Elara looked at the file again. The engineers said the wall would hold for forty years. They did not say it would hold for fifty. The Council wanted to save the fishing fleet now. The children in the schoolhouses needed new roofs. The people in forty years would be richer, but they might also be fewer, or they might be facing a storm the wall was not built to stop. The blind lottery test suggested they should pay, but their wealth suggested they could afford to. The recursive nature of the Council suggested the bill would never come due, but the physical reality of the water suggested it would. The math suggested that in two hundred years none of this mattered, but the water beating against the stone said that time was all that mattered.

  She could not solve the contradiction. There was no formula in the manual that accounted for the fact that the people of the future were both strangers and descendants, both richer and more vulnerable. There was no calculation that could weigh the certainty of a rotting school roof against the probability of a breached wall. The office required a recommendation. It required a yes or a no. It required her to take the messy, contradictory labour of thinking about time and compress it into a single word that would be copied into the ledger and filed away. She dipped the pen in the ink. The nib hovered over the paper. The sea hit the wall. She had to write.
