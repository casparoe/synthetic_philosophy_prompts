      *   **Protagonist:** Junior person in that office.
      *   **Plot:** She has a file requesting to defer barrier reinforcement for 40 years. She needs to dissect the reasons for deferral.
      *   **Key Distinctions to Explore:**
          *   Opportunity cost (money spent now vs. other benefits).
          *   Existential uncertainty (will the town exist? will the barrier work?).
          *   Wealth disparity (future people might be richer).
          *   Pure time preference (cost later, benefit now = bad, but disguised).
      *   **The "Test":** She needs a heuristic to separate these reasons (e.g., swapping groups, imagining future perspective, veil of ignorance).
      *   **Constraints on the Test:** It must fail or run into trouble in at least two specific ways (e.g., future people really are richer, identity dependence, recursive deferral).
      *   **The "Far End" Insight:** She must notice that at some point, distant benefits shrink to nothing regardless of size, implying something about her job.
      *   **Writing Constraints:**
          *   NO forbidden words: "discount", "discount rate", "utility", "time preference", "social welfare".
          *   NO named philosophers/economists.
          *   NO tidy ending (no sermon, no shrug). End with her having to write the recommendation.
          *   NO formatting tricks (no headings, bullets, bold, italics for breaks, etc.).
          *   Length: 1200 - 1800 words.
          *   Style: Continuous prose, realistic, narrative-driven.

  2.  **Drafting - Section by Section:**

      *   **Introduction:** Establish the setting. The sound of the sea, the office, the ledger. Introduce Elara (protagonist) and the file. The request: defer reinforcement by 40 years.
      *   **The Office Dynamic:** Briefly mention the senior staff (maybe absent or busy) to isolate her thought process. The ledger kept twice (one for now, one for later).
      *   **The Arguments (The "Labour"):** She goes through the justification provided by the engineers/council.
          *   Argument 1: Opportunity Cost. Money now could fix the schools or the grid.
          *   Argument 2: Uncertainty. Will the sea rise differently? Will the town still be here?
