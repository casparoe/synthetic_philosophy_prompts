answer: |-
  Consider two neighbouring cities in the Dutch Republic, circa 1675, both governed by the same aristocratic constitution where voting rights are restricted to male heads of household who bear arms. In **Amstelredam**, the economy is agrarian and static; men control all land titles, wield all weapons, and conduct all public commerce, while women's labour is confined to domestic spheres easily monitored or replaced by male relatives. In **Vriesland**, the economy is heavily maritime and credit-based; the men are absent at sea for years at a time, leaving women to enforce contracts, manage guild disputes, collect taxes, and command the local civic guard in their husbands' stead. In both cities, the law explicitly excludes women from the sovereign council. In Amstelredam, the women comply because they lack the means to resist. In Vriesland, the women comply only because they choose to; if they withdrew their cooperation, the courts would close, credit would vanish, and the laws would become dead letters overnight. The laws, the numbers, and the formal exclusions are identical in both cities; the only variable is whether the excluded group retains the *power* to make the sovereign's right effective.

  The sovereign's natural right is strictly coextensive with its actual power to enforce decrees. This is the settled core of Spinoza's political naturalism: *jus* is *potentia* (*Political Treatise* II, §3–4). A law that the multitude cannot be brought to obey is not a valid exercise of right, but a symptom of the sovereign's weakness. In Amstelredam, the exclusion of women generates no internal tension because the sovereign retains the physical capacity to enforce its will without their active consent; their natural power is effectively neutralised by social structure. In Vriesland, however, the exclusion creates a fatal discontinuity between the source of power and the seat of right. Because the women of Vriesland retain the *potentia* to sustain or collapse the civil order, their natural right remains coextensive with that power, yet the civil constitution denies them any share in the sovereign decision-making.

  The single feature doing the work here is the *indispensability of voluntary cooperation* for law enforcement. If you remove this feature—returning Vriesland to the Amstelredam model where women's labour is coercible without systemic collapse—the Spinozist pressure for inclusion vanishes. In Vriesland, the sovereign claims a right it does not possess, because it claims authority over a group whose power it does not actually command. Spinoza argues that no one transfers their whole natural power to the sovereign (*TP* II, §12); in Vriesland, the women retain enough power to veto the state's functioning. To exclude them from the council is to invite a state of hidden war, where the sovereign's right is perpetually undermined by the very power it relies upon.

  Formal enfranchisement becomes the only stable solution because material concessions cannot align natural right with civil right when power is structural rather than personal. This is where the argument moves from settled text to reconstructive reading. Spinoza suggests that regimes fall when they try to rule against the grain of the multitude's power (*TP* VI, §3). In Vriesland, the women's power is not located in a few leaders who can be bribed, but dispersed across the network of credit and local enforcement. Co-opting leaders fails because the power resides in the collective capacity to withdraw labour and recognition. Therefore, to maximise its own *potentia*, the sovereign must incorporate this power into the civil state by granting suffrage, thereby making the women's natural right identical with their civil right.

  **Scholarly Context and Contested Ground**
  It must be flagged that Spinoza explicitly excludes women from citizenship in *TP* XI, §4, arguing they are naturally inferior in strength and reason. Whether this is a principled claim or a failed empirical generalisation is live among scholars (see Steinberg vs. James). The argument above assumes the latter: that if women *do* hold power (as in Vriesland), Spinoza's metaphysics of *jus* = *potentia* overrides his empirical prejudice. Furthermore, reading Spinoza's power-equation as normative pressure (you *ought* to include them to be stable) rather than mere description (you *will* fall if you don't) is contested. The case above treats it as a rational imperative for the sovereign seeking self-preservation.

  **The Friend's Bullet-Biting Reply**
  Your Hobbesian friend's strongest reply is that stability requires appeasement, not democracy. She will argue that Spinoza need not grant votes; he need only grant material concessions and co-opt the women's leaders to secure their cooperation. On this reading, the sovereign buys the necessary power rather than sharing the right. Spinoza might accept this: if the sovereign can secure compliance through patronage and fear, the formal constitution need not change. The counter to this is that in Vriesland, the power is too dispersed for co-option to work without bankrupting the state. However, if your friend bites the bullet and says, "Then let the state bankrupt rather than democratise," she exposes that for Spinoza, regime survival is the only good. If an oligarchy can survive by buying off women, Spinoza has no *moral* reason to demand enfranchisement, only a prudential one. The pressure for democracy arises only if dispersed power makes co-option too costly compared to inclusion. This leaves your argument resting on an empirical claim about the efficiency of democracy versus oligarchy in managing dispersed power, which Spinoza supports (*TTP* XVI), but does not guarantee in every specific case.
