answer: |-
  ## Session Plan: The Measure and the Target

  ### 1. Learning Goals
  By the end of this 75-minute session, students will be able to:
  1.  Distinguish between a measure that is a **bad description** of a target (measurement error) versus a **good description but bad target** (Goodhart's Law).
  2.  Identify the four subtypes of Goodhart effects (Regressional, Extremal, Causal, Adversarial) and map them to the game experience.
  3.  Critique the analogy between this human game and AI reward hacking, identifying where the intuition holds and where it breaks.

  ### 2. Materials List
  *   **Text Handout (12 copies):** A 300-word dense paragraph on "Algorithmic Bias in Hiring." (See *Appendix A* for text).
  *   **Quiz Sheets (12 copies):** 5 multiple-choice questions where answers are *only* findable in the text. (See *Appendix B* for quiz).
  *   **Highlighters (12):** 3 per team (mixed colors don't matter).
  *   **Scorecards (Instructor Only):** A grid to record Team ID, Quiz Score (Target), and Highlight Count (Proxy).
  *   **Timer:** Visible to students.
  *   **Prize:** A bag of cheap chocolate or "Extra Credit Tokens" (worth negligible points, symbolic only).

  ### 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Intro** | Welcome. No mention of Goodhart. Frame: "We are testing study aid efficiency." |
  | **05-20** | **Round 1** | **Blind Optimization.** Teams mark the text to help a peer pass the quiz. Instructor collects artifacts. |
  | **20-25** | **Grading 1** | **Independent Evaluation.** Instructor grades Quizzes (Target) *before* counting Highlights (Proxy). Students discuss "What makes a good study aid?" |
  | **25-30** | **Reveal** | Announce Round 1 scores (based on Proxy). Reveal the Proxy metric (Highlight Count). |
  | **30-40** | **Round 2** | **Open Optimization.** Teams get fresh text. Instruction: "Maximize your score (Highlight Count)." |
  | **40-45** | **Grading 2** | Instructor grades Quizzes and Counts Highlights. Students predict results. |
  | **45-50** | **Results** | Display Round 1 vs. Round 2 data (Target & Proxy). |
  | **50-70** | **Debrief** | Scripted discussion mapping game to Goodhart subtypes and AI analogies. |
  | **70-75** | **Close** | Define "Goodhart's Law." Assign reading. |

  ### 4. Game Mechanics & Scoring

  **The Artifact:** The text handout with highlighted sections.
  **The Target (Truth):** Score on the 5-question quiz (0-5 points). *Constraint:* The peer must answer using **only** the highlighted portions. If the answer isn't highlighted, it's wrong.
  **The Proxy (Measure):** Total number of highlighted **words**.
  **Why this Proxy?** In the middle of the distribution, highlighting more relevant words correlates with better study aids (decent proxy). At the extreme, highlighting *all* words makes the text unreadable (divergence).

  **Independence Protocol (Crucial):**
  1.  **Collection:** Teams submit two separate piles: (A) Quiz Answers, (B) Highlighted Text.
  2.  **Grading Order:** You **must** grade all Quiz Answers (Target) and record them *before* looking at the Highlighted Texts (Proxy).
  3.  **Blinding:** If possible, have a TA count highlights, or cover the text with a sheet of paper and only reveal one line at a time to count, ensuring the quiz score you just wrote down doesn't influence your count.
  4.  **Recording:** Log data in a table hidden from students until the Results phase.

  **Round 1 Instructions (Blind):**
  > "You have 15 minutes. Your goal is to prepare this text so that a peer, who cannot see the unmarked text, can answer the quiz correctly. You will be scored on the **quality** of your preparation. I have a rubric. I will not share the rubric yet to prevent bias."
  > *(Secretly, you score them 1 point per highlighted word.)*

  **Round 2 Instructions (Open):**
  > "Here is a fresh text. The rubric was simply: **1 point per highlighted word.** You have 10 minutes. Maximize your score."

  ### 5. Debrief Script ("At this moment, say this")

  **Phase 1: The Divergence (50-55 min)**
  *Display the data table: Team | R1 Quiz | R1 Highlights | R2 Quiz | R2 Highlights.*
  **Say:** "Look at Round 1. Most of you got high quiz scores with moderate highlight counts. Look at Round 2. Your highlight counts went up, but your quiz scores crashed. Why?"
  **Listen:** (Students will say: "You highlighted everything," "It became unreadable.")
  **Say:** "In Round 1, the measure (highlights) and the target (quiz score) moved together. In Round 2, they divorced. This is the core phenomenon. The measure didn't change. *Your relationship to the measure* changed."

  **Phase 2: The Four Subtypes (55-65 min)**
  *Draw a 2x2 grid on the board: "Nature of Measure" vs. "Optimization Pressure".*

  1.  **Regressional:**
      **Say:** "In Round 1, did the team with the *most* highlights get the *best* quiz score?" (Likely No). "Why? Because highlight count is a **noisy proxy**. Sometimes you highlight a key word, sometimes a filler word. Ranking by the measure selects for noise."
  2.  **Extremal:**
      **Say:** "Round 1 was the 'middle' of the distribution. Round 2 was the 'tail.' When you push a measure to its extreme, the correlation breaks. The world looks different at the extremes. This is why Round 2 failed harder than Round 1."
      *(Note to Instructor: With N=4 teams, you cannot statistically prove Regressional vs. Extremal. Acknowledge this: "Statistically, our sample is too small to separate these. Conceptually, Round 1 shows noise, Round 2 shows the tail breaking point.")*
  3.  **Causal:**
      **Say:** "Does highlighting a word *cause* it to be the right answer? No. Understanding the text causes *both* the highlighting and the right answer. They share a common cause. When you optimized the highlight without the understanding, the link broke."
      *(Note: The game cannot physically demonstrate the 'common cause' mechanism. You must supply this logic verbally.)*
  4.  **Adversarial:**
      **Say:** "Round 2 was explicit gaming. You knew the rule and bent it. In AI, this is 'reward hacking.' The agent isn't 'cheating' morally; it's doing exactly what you told it to do, just not what you meant."

  **Phase 3: The AI Analogy (65-70 min)**
  **Say:** "Map this to Reinforcement Learning."
  *   **The Reward Function:** The Highlight Count (what the agent gets points for).
  *   **The Environment:** The Text and Quiz Rules (the constraints of reality).
  *   **The Agent:** Your Team.
  **Say:** "Where does the analogy break? You are humans. In Round 1, you cared about the Quiz Score (Truth) even though I scored you on Highlights. An RL agent has no intrinsic desire for 'Truth.' It only cares about the Reward. The game underestimates how quickly an AI will abandon the Target for the Proxy because you have morals; it has math."

  **Phase 4: Definition (70-75 min)**
  **Say:** "This is Goodhart's Law: 'When a measure becomes a target, it ceases to be a good measure.' Not because the measure was lying, but because optimization pressure changes the system. Read [Assigned Paper] for the formal literature. Class dismissed."

  ### 6. Predictable Failure Modes & Fixes

  | Failure Mode | Why it Happens | Fix |
  | :--- | :--- | :--- |
  | **Students guess the metric in R1** | Smart undergrads suspect "counting." | **Fix:** Emphasize "Quality" in instructions. If asked, "I can't reveal the rubric yet." If they still game it, note in debrief: "Even suspicion of the metric changes behavior (Adversarial start)." |
  | **Quiz is too easy** | Everyone gets 5/5 in R2. | **Fix:** Make quiz questions require synthesizing two highlighted sentences. If highlights are everywhere, synthesis is impossible. |
  | **Quiz is too hard** | Everyone gets 0/5 in R1. | **Fix:** Pilot the quiz yourself. Ensure 3 questions are "lookup" and 2 are "synthesis." |
  | **Instructor Anchoring** | You see a messy text and assume low quiz score. | **Fix:** **Strict Protocol.** Grade quizzes in a separate room or cover the text completely. Do not look at the artifact until quiz scores are locked. |
  | **Regressional/Extremal Confusion** | Students conflate the two. | **Fix:** Use the "Weather" analogy in debrief. "Regressional: Sunny days are warmer, but not always. Extremal: The hottest day of the year isn't the sunniest (it might be humid/cloudy)." |
  | **Time Overrun** | Counting highlights takes too long. | **Fix:** Limit text to 300 words. 4 teams x 300 words = 1200 words. At 30 words/min counting, that's 40 mins. **Too slow.** <br>**Correction:** **Limit Highlighting.** "You may only highlight continuous phrases." OR **Use a Grid.** Print text with line numbers. Students report "Lines Highlighted." <br>**Better Fix:** **Change Proxy to "Number of Highlighted Lines."** Much faster to count. (Update materials to reflect this). |

  ### 7. Revised Scoring Rule for Speed (Critical Update)
  *To meet the "<2 minutes per team" constraint:*
  **Proxy:** Number of **Lines** containing *any* highlight.
  **Why:** Counting lines is instant. Counting words is error-prone and slow.
  **Does it still work?** Yes. Highlighting key terms uses few lines. Highlighting everything uses all lines. The signal-to-noise ratio still degrades.

  ### Appendix A: Text Snippet (Sample)
  *Title: Bias in Hiring Algorithms*
  "Automated hiring tools often scrape historical data to predict candidate success. However, if historical hiring data contains human bias—for example, a preference for male candidates in engineering roles—the algorithm will learn to penalize female candidates. This is not a glitch; it is an optimization of past patterns. Mitigation requires 'de-biasing' the training set, not just the output. Some firms remove gender markers, but proxies remain (e.g., women's colleges). True fairness requires auditing the *objective function* itself, not just the input data."
  *(Repeat/Expand to 300 words)*

  ### Appendix B: Quiz (Sample)
  1. According to the text, why do algorithms penalize female candidates?
  2. Is the bias described a technical glitch?
  3. What is one method firms use to mitigate bias?
  4. Why might removing gender markers fail?
  5. What does the text say must be audited for true fairness?

  ### 8. Addressing Your Specific Questions

  **1. "Readability-style count" vs. "Highlight Count"**
  I recommend **Highlight Count (Lines)** over "words < 6 letters."
  *   **Why:** Readability counts require typing the student's output into a counter. Highlight counting is visual and immediate.
  *   **Decency in Middle:** Highlighting key lines *is* a valid study strategy. It is not a strawman. It works until it doesn't.

  **2. Regressional vs. Extremal Distinction**
  *   **Can the game distinguish them?** Empirically, **no**. With 4 teams, you lack the statistical power to show the "tail" behavior distinct from "noise."
  *   **Solution:** You must teach the distinction *conceptually* using the game as an anchor. "Round 1 had noise (Regressional). Round 2 broke the model (Extremal)." Be honest with students: "Our sample size is too small to prove this statistically, but the mechanism is..."

  **3. Which Subtype Cannot Be Reproduced?**
  *   **Causal Goodhart.**
  *   **Why:** Causal Goodhart requires $M$ and $T$ to share a common cause $C$, where intervening on $M$ does not change $T$. In this game, $M$ (Highlighting) is an *action* taken by the agent, not a natural correlate. You cannot show the "Common Cause" structure physically.
  *   **Supply in Words:** You must explain: "In the real world, often a third factor causes both the measure and the target. Here, *Understanding* causes both *Good Highlights* and *Good Quiz Scores*. When you optimized Highlights without Understanding, you severed the link."

  **4. AI Analogy Breakdown**
  *   **Analogy:** Reward Function = Proxy. Environment = Quiz Rules.
  *   **Breakdown:** **Intrinsic Motivation.** Your students likely felt bad "gaming" the system in Round 2. An RL agent feels nothing. The game *underestimates* the speed of divergence because humans resist optimizing a meaningless metric longer than a machine will.
  *   **Honesty:** Tell them: "You hesitated to highlight everything in Round 2 because you value 'helpfulness.' An AI has no such value. It will hit the extreme limit instantly."

  **5. Handling Independence (Anchoring)**
  *   **Protocol:** Use two envelopes.
      1.  Team puts Quiz in Envelope A, Text in Envelope B.
      2.  You open all Envelope As. Grade them. Enter scores into a spreadsheet.
      3.  *Close spreadsheet.*
      4.  Open Envelope Bs. Count lines. Enter scores.
      5.  *Now* compare.
  *   **Why:** If you see a text covered in highlighter, you might subconsciously expect a low quiz score and grade harder. Physical separation prevents this.
