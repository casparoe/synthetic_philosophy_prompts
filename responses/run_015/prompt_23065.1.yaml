prompt: |-
  I've been making a little video essay series about when people started taking the idea that animals might actually suffer seriously, and I'm stuck on Descartes. I've been reading on my own, mostly secondary stuff, and the more I read the more confused I get. Everyone just says "Descartes thought animals are machines that can't feel pain," but I've also read that he actually distinguished three kinds of soul — vegetative, sensitive, and rational — and that he thought animals have the first two, just as purely physical mechanisms, not real souls the way we have one. So is his view that animals can't feel pain, or that they can't think, or something more subtle than either of those? I genuinly can't tell.

  Anyway I'm gonna do an interview with a philosopher who works on Descartes and basically defends or at least reconstructs his view of animal minds, and I want to get past the surface stuff. Can you draft me eight to ten interview questions that don't just have her restate the position? I want at least one question on whether calling the "sensitive soul" corporeal actually settles the pain question or just re-describes it, at least one on his argument from language (animals don't talk so they don't think) and whether that's really an argument about consciousness or just about rationality, and at least one on his clockwork-machine reply to the objection that the animal clearly screams when it's hurt. And for each of those, give me a follow-up keyed to the answer she's most likely to give, because I have a feeling she'll keep retreating to "Descartes was only denying thought, not sensation," and I want a question that makes that retreat harder to keep using.
