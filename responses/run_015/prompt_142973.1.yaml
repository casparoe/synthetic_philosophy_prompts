answer: |-
  The pattern you are describing is structurally identical to a well-known rhetorical fallacy, though in the context of political philosophy and policy design, it often manifests as a structural problem rather than a deliberate trick.

  The established rhetorical term is the **Motte-and-Bailey Fallacy**.

  However, because you noted that the participants often seem *sincere* (which makes "fallacy" feel too pejorative) and because this is specific to the gap between normative theory and policy implementation, there isn't a single canonical term in egalitarian literature that captures the *exact* dynamic.

  Here is the breakdown of the established concept, followed by a proposed name and definition that captures the specific nuance you are observing.

  ### 1. The Established Concept: Motte-and-Bailey
  Coined by philosopher Nicholas Shackel, this describes a situation where an arguer oscillates between two positions:
  *   **The Motte:** A defensible, modest, but less desirable position (Equality of Capabilities/Welfare). It is hard to attack because it is morally robust.
  *   **The Bailey:** A desirable, concrete, but vulnerable position (Equality of Resources/Flat Cash). It is easy to attack (e.g., "what about the disabled?") but easy to implement.

  **How it fits your observation:**
  *   **Normal State:** The arguer occupies the **Bailey** (advocating for flat cash).
  *   **Under Attack:** When you point out conversion problems (disability, needs), they retreat to the **Motte** ("We care about capabilities, not just cash!").
  *   **Resolution:** Once the objection is neutralized, they slide back to the **Bailey** for the actual policy proposal, without explaining how the Motte justifies the Bailey.

  **Why it might feel different than a standard fallacy:**
  In many cases, this isn't malicious deception. It is often a form of **Motivated Reasoning**. The arguer sincerely wants the *moral cover* of the Motte (Capabilities) because it makes them feel ethically rigorous, but they sincerely want the *simplicity* of the Bailey (Cash) because it is politically feasible. They are not lying; they are cognitively bridging a gap they haven't actually solved.

  ### 2. A Proposed Name: "Justificatory Decoupling"
  Since "Motte-and-Bailey" is a general rhetorical term, and you want something that specifically names this move within equality/policy debates (distinguishing it from simple inconsistency), I propose the term **Justificatory Decoupling**.

  This borrows from organizational sociology (where "decoupling" refers to the gap between formal policy and actual practice) but applies it to the relationship between *normative justification* and *policy mechanism*.

  **Definition:**
  > **Justificatory Decoupling** occurs when an advocate employs a high-fidelity normative metric (e.g., Capabilities) to absorb theoretical objections, while simultaneously relying on a low-fidelity operational metric (e.g., Resources) for policy design, without providing a validated translation mechanism between the two.

  **How it differs from Inconsistency:**
  *   **Inconsistency** is accidental or contradictory (e.g., "I want cash" vs. "I hate cash").
  *   **Justificatory Decoupling** is structural and functional. The two metrics are not contradictory; they are *compartmentalized*. The high-fidelity metric is used exclusively for *defense*, and the low-fidelity metric is used exclusively for *offense/implementation*. They never have to meet in the middle.

  **How it differs from the Standard Debate:**
  *   **Standard Debate:** A "Resourcist" (like Dworkin) argues resources are the *correct* metric. A "Capabilitarian" (like Sen) argues capabilities are the *correct* metric. They pick a lane.
  *   **Justificatory Decoupling:** The arguer claims the Capabilitarian lane is the *truth*, but drives in the Resourcist lane for *convenience*, claiming the road connects them even when it doesn't.

  ### 3. Why this move is persuasive (and frustrating)
  This pattern persists because it solves two different problems for the arguer:
  1.  **The Moral Problem:** Flat cash transfers *do* fail people with high needs. By invoking "Capabilities," the arguer signals they acknowledge this moral failing.
  2.  **The Administrative Problem:** Measuring capabilities is incredibly difficult (how do you measure "dignity" or "mobility" for tax purposes?). Measuring cash is easy.

  By using **Justificatory Decoupling**, the arguer gets to claim the moral high ground of the Capability Approach without incurring the administrative costs of it.

  ### Summary
  If you want to use an established term, call it a **Motte-and-Bailey** maneuver.

  If you want to coin a term that captures the specific policy-theory disconnect without implying malicious deceit, call it **Justificatory Decoupling**.

  **Usage Example:**
  *"You aren't being inconsistent; you're engaging in **justificatory decoupling**. You use 'capabilities' as a shield against critiques of fairness, but you use 'resources' as a sword for policy simplicity. Until you explain how the cash transfer accounts for conversion factors, the two metrics are decoupled."*
