  2. The wink makes things worse rather than discharging the obligation, because treating a great soul as a puppet for amusement degrades the seriousness required to train the reader's virtue.
  3. The argument that no one is left to be hurt cuts no ice, because his concern is the eternal truth of the character available for emulation, not the transient reputational harm to living descendants.
  4. He would insist the narrator possess the moral standing to judge the subject, just as he navigated writing about Roman rulers while being Greek, ensuring the portrayal serves virtue rather than flattery or slander.
  5. Ultimately, he would reject any image that confuses the reader about what is real virtue, since the biographer's duty is to offer a clear mirror for the soul's improvement rather than a dazzling fabrication.
