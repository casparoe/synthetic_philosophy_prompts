  I want:
  1. A numbered section of claims both sides can sign (phenomenlogy of tranquility, whether unconscious craving counts, empirical correlations with reported life-satisfaction, etc.).
  2. A disagreements table with the exact wording each camp accepts for its own position.
  3. The cruxes -- I think the main ones are (a) whether tranquility is purely privative or has intentional content of its own, and (b) whether evolutionary accounts of affect support a "zero-point" model where positives are just returns to baseline.
  4. For each crux, a concrete case or argument both sides agree bears on it, with each side's prediction written out in advance.

  Don't ask for bibliographies or cite specific texts -- just build it conceptually. And pin the residual disagreement exactly, don't let them talk past each other. Keep it tight, maybe outline-level but conceptually precise.
