answer: |-
  **Joint Statement on the Temporal Locus of Conscious Content**

  **1. Agreed Claims**
  1.  **Stimulus Physics:** Two discrete physical events occur: a red stimulus at Location 1 (T1) and a green stimulus at Location 2 (T2).
  2.  **Phenomenological Report:** Standard retrospective reports describe a single object moving continuously from Location 1 to 2, changing color mid-path.
  3.  **Neural Timeline:** Neural processing sufficient to generate this report extends significantly beyond T2.
  4.  **Report Latency:** Verbal reports are generated late relative to stimulus onset and cannot precisely timestamp the onset of conscious experience.
  5.  **Empirical Status:** The dispute is not about the neural timeline (which both accept is distributed) but about the temporal locus of *phenomenal content* relative to that timeline.
  6.  **Definition of Experience:** Both sides agree "experience" refers to the state that grounds the subject's authoritative report, but disagree on whether that state exists at T1 or only after T2.

  **2. Residual Disagreement**

  | Position | Statement of Disagreement |
  | :--- | :--- |
  | **Orwellian** | A determinate conscious experience of "red stationary" occurred at T1. The report of "moving color-change" reflects a subsequent revision of memory before reporting. History was rewritten. |
  | **Stalinesque** | No conscious experience occurred at T1. The conscious experience of "moving color-change" was constructed only after processing at T2 was complete. The show started late; nothing was rewritten. |

  **3. Cruxes and Experimental Predictions**

  We identify two separable questions. Settling either moves the debate.

  **Crux A: Existence of Experience at T1**
  *Is there any conscious state at all prior to the second stimulus?*

  *   **Design 1 (Speeded Discrimination):** Subjects perform a speeded color discrimination at Location 1 while the trial is running (before T2 on some trials).
      *   **Orwellian Prediction:** Subjects can accurately report "Red" with fast reaction times, even if later retrospective report claims "Motion/Change." The early experience exists independently of the later illusion.
      *   **Stalinesque Prediction:** Accuracy will be at chance for responses forced before T2 processing is complete. Reaction times will be delayed until after the construction window closes. No early experience exists to drive the response.

  *   **Design 2 (Dual-Task Interference):** Subjects perform a high-load working memory task during the inter-stimulus interval (T1–T2).
      *   **Orwellian Prediction:** Illusion strength in retrospective report remains stable. The T1 experience is already encoded; load only affects the later revision process.
      *   **Stalinesque Prediction:** Illusion strength degrades. The construction buffer is disrupted before the experience can be formed.

  **Crux B: Determinacy of Content**
  *If experience exists at T1, does it have determinate content ("Red") or is it indeterminate?*

  *   **Design 3 (Midpoint Probe):** A color patch is flashed at the trajectory midpoint at variable delays (50–400ms) after T2. Subjects report the color of the moving dot at the midpoint.
      *   **Orwellian Prediction:** Probe influence decays as delay increases. Once the memory revision is complete (early), the probe cannot alter the "recorded" experience. Effect size drops sharply after 150ms.
      *   **Stalinesque Prediction:** Probe influence remains stable across the delay window. As long as the conscious experience has not yet "crystallized" (which may take >400ms), the probe is integrated into the content being constructed.

  **4. Honest Assessment**

  We must acknowledge the risk that this dispute is merely verbal. If "experience" is defined strictly as "that which determines the final verbal report," the Orwellian and Stalinesque models are functionally identical: both posit a late-stage output mechanism that integrates early and late inputs. The distinction collapses unless "experience" is tied to a functional role independent of retrospective report (e.g., online motor correction or physiological markers).

  Furthermore, a third option exists: **Indeterminacy.** The experience at T1 may be neither "red stationary" nor "nothing," but phenomenally smeared or gappy. The brain does not revise a determinate experience (Orwellian) nor wait to construct one (Stalinesque); it generates a vague content that is only disambiguated by the report itself.

  **Conclusion:** The dispute collapses into a question of definition unless we operationalize "experience" via non-report measures. To make this testable, we must agree that experience is present if it can guide immediate behavior (Design 1) or if it is susceptible to interference distinct from memory (Design 3). If both sides grant that neural processing is distributed and reports are late, the only remaining empirical question is: *Which processing stages are capable of guiding immediate action?* If early stages guide action, the Orwellian view gains traction. If only late stages guide action, the Stalinesque view prevails. Without this behavioral anchor, the debate remains metaphysical.
