answer: |-
  **Teleosemantics Decision Tree**

  Answer the following six questions based on your intuitions about the cases described.

  1.  **Swampman:** Does a molecule-for-molecule duplicate created by lightning have mental content, or is it semantically empty?
  2.  **Artificial Nets:** Does a neural net trained by engineers to flag tumours have content, or does it lack the requisite selection history?
  3.  **Lab Evolution:** Does a population evolved in a lab for 200 generations have content, or is the history too shallow?
  4.  **Co-option Origin:** When a mechanism selected for detecting shadows is reused for detecting predators, does content track the original shadow-duty or the new predator-duty?
  5.  **Co-option Error:** In that reused system, if it fires at a non-predator shadow, is it misrepresenting a predator, or correctly representing a shadow?
  6.  **No-History Norms:** If a system lacks the right history, can it misrepresent, or does it merely fail to represent anything at all?

  **Positions (Leaves)**

  *   **Millikanian Teleosemantics:** (History Yes; Design No; Ancestral Function). *Awkwardness:* Swampman is a zombie; co-option errors are difficult to normalise.
  *   **Papineauian Teleosemantics:** (History Yes; Design No; Selected Effects). *Awkwardness:* Struggles when selected effects diverge from current survival value.
  *   **Design Teleosemantics:** (History Yes; Design Yes; Shallow Time OK). *Awkwardness:* Grants content to simple engineered feedback loops too freely.
  *   **Use-Based Teleosemantics:** (History Weak; Current Function). *Awkwardness:* Makes misrepresentation nearly impossible in novel contexts.
  *   **Structuralism:** (History No). *Awkwardness:* Cannot distinguish Swampman from normal agents empirically.
  *   **Strict Darwinism:** (History Yes; Deep Time Only). *Awkwardness:* Unoccupied; denies content to lab animals and recent adaptations.
  *   **Eliminativism:** (No Content Anywhere). *Awkwardness:* Denies the phenomenon exists rather than explaining it.
  *   **Hybrid View:** (Design Yes; History Yes; Ancestral Function). *Awkwardness:* Unexplored; unclear why design suffices if ancestry still dictates content.

  **Commentary on Logical Space**

  **Unoccupied Combination:** The branch allowing Artificial Design (Q2: Yes) but insisting on Deep Time (Q3: No) is effectively unoccupied. This appears incoherent: if artificial design suffices to ground content, the depth of evolutionary time should be irrelevant. If time is required, design alone should not suffice. This gap exists because proponents of design-based views typically accept short histories, while historicalists reject design entirely.

  **Indistinguishable Leaves:** Millikanian and Papineauian teleosemantics (Leaves 1 and 2) cannot be genuinely separated outside of malfunction cases. Both rely on selection history, and in standard conditions where a mechanism performs its selected effect, they assign identical content. They only diverge when a trait persists despite failing to produce the effect that originally selected it. Unless your reading group focuses exclusively on pathological biology, these views are empirically equivalent for most cognitive science purposes.
