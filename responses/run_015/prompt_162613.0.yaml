      *Wait, let's re-evaluate damage.* The Consequentialists are the majority. If they reject the "consequentialist" label, the paper loses its home audience. But the Religious Studies people can invalidate the textual evidence entirely. The *Anattā* objection is the deepest metaphysical hole. I will rank *Anattā* as #1 because it undermines the "agent" in the deliberative procedure. I will rank the "Enlightened Self-Interest" objection as #2 because it undermines the "moral" in the moral theory.

  7.  **Developing the Replies:**
      *   Need to be punchy. 2 minutes spoken is about 250-300 words.
      *   Need to show where to concede (e.g., "Yes, the terminology is modern") vs. hold line ("But the structure is textually supported").

