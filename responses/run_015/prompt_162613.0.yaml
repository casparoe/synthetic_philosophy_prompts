answer: |-
  Here is a prep sheet designed for the specific dynamics of your seminar. It prioritizes the "ugly Q&A" reality: people posturing, talking past each other, and hunting for blood.

  ### **Q&A PREP SHEET: Split-Level Buddhist Ethics**

  **Strategy Overview:** Your thesis relies on a distinction (criterion vs. procedure) that analytic ethicists love but that the textual scholars will claim doesn't exist in the source material. Your goal is to prevent the Consequentialists from dismissing you as "not real consequentialism" and the Religious Studies (RS) scholars from dismissing you as "colonial category imposition."

  ---

  ### **PART 1: RANKED OBJECTIONS**

  #### **1. The Metaphysical Landmine (The *Anattā* Objection)**
  *   **Who:** One of the Religious Studies scholars (likely the one who specializes in Abhidharma or Early Nikāyas).
  *   **The Voice:** "You're building a deliberative procedure for an agent who, according to your own sources, doesn't exist. If there is no *atta* (self), whose mental trajectory is being optimized? You say the agent tracks 'her own mind,' but early Buddhism denies the continuity of identity required to make 'own' meaningful. You've imported a Cartesian deliberator into a no-self ontology."
  *   **Damage:** **Critical.** If this lands, your "deliberative procedure" has no subject.
  *   **The Reply (2 mins):**
      *   "That's the precise reason the split is necessary. The tradition acknowledges the *conventional* truth of the agent for the sake of the path, even while denying the *ultimate* truth of the self. The deliberative procedure operates at the level of *vyavahāra* (conventional practice). We don't tell a stream-enterer they don't exist before they've reached the end of the stream. The 'owner' of the mind is a pragmatic fiction required for the karmic mechanism to function *until* it doesn't."
      *   **Concede:** Acknowledge that *anattā* makes the 'agent' metaphysically porous.
      *   **Hold Line:** The ethics are soteriological, not ontological. The procedure works *because* we mistakenly believe in a self; it's the tool to undo that belief.
      *   **Soft Spot:** If they press on whether a "fictional agent" can bear moral responsibility, you risk circularity.

  #### **2. The "Enlightened Self-Interest" Charge**
  *   **Who:** The EA/Consequentialist cluster (possibly the Kantian will chime in here too).
  *   **The Voice:** "You claim the criterion is 'reduction of suffering across the causal stream.' But since karma is individual and non-transferable, isn't the 'causal stream' just *my* future rebirths? If I act to purify my mind to secure *my* liberation, isn't this just enlightened self-interest? Where is the impartiality required for consequentialism?"
  *   **Damage:** **High.** Turns your theory into ethical egoism, which most analytic moral philosophers reject as a "moral" theory.
  *   **The Reply (2 mins):**
      *   "It looks like egoism from the outside, but the content of the 'purified mind' breaks the self/other dichotomy. You cannot achieve the criterion (cessation of *dukkha*) while maintaining the ontological distinction between 'my suffering' and 'yours.' *Mettā* (loving-kindness) and *karuṇā* (compassion) are causal prerequisites for liberation. So, optimizing for my liberation *necessitates* optimizing for the welfare of others. The self-interest is only in the locus of deliberation, not the content of the outcome."
      *   **Concede:** Yes, the *motivation* starts with self-concern (fear of saṃsāra).
      *   **Hold Line:** The *outcome* is impartial because the metaphysics of suffering are impersonal.
      *   **Soft Spot:** The Jātaka tales where the Bodhisattva sacrifices *others* (e.g., giving away children) for his own perfection. This looks blatantly non-impartial.

  #### **3. The Anachronism/Translation Attack**
  *   **Who:** The second Religious Studies scholar.
  *   **The Voice:** "You're leaning on 'karma = intention' (AN 6.63) to ground your consequentialism. But reading *cetanā* as purely psychological intention is a modern Theravada apologetic. In the early texts, karma is often ritual or ontological weight, not just mental state. You're flattening five centuries of text to fit a Sidgwickian framework."
  *   **Damage:** **Medium-High.** Undermines your textual evidence. Makes you look like you're doing "philosophy of Buddhism" rather than "Buddhist philosophy."
  *   **The Reply (2 mins):**
      *   "I'm not claiming the texts are uniform. I'm claiming the *soteriological logic* requires this reading to function. Even if some passages treat karma ritualistically, the ethical deliberation passages consistently return to the quality of the mind as the determinant of future *dukkha*. I'm reconstructing the most philosophically coherent strand, not doing philology. If the tradition is to offer an ethics, it must be this one."
      *   **Concede:** Admit the canon is inconsistent and you are reconstructing a "best fit."
      *   **Hold Line:** Philosophical reconstruction is valid even if philologically imperfect.
      *   **Soft Spot:** They can cite specific suttas where outcome matters more than intention (e.g., accidental killing still creates bad karma in some Vinaya contexts).

  #### **4. The "False Dichotomy" Objection**
  *   **Who:** The Virtue Ethicists (Aristotelian/Buddhist synthesis).
  *   **The Voice:** "Why insist on the split? In Aristotle, the *phronimos* perceives the good directly. In Buddhism, the awakened one acts spontaneously. By separating the 'right' (consequence) from the 'deliberation' (virtue), you're imposing a Western deontological/consequentialist grid on a tradition that sees character and outcome as non-dual."
  *   **Damage:** **Medium.** Makes your thesis look like a category error, but less damaging than the metaphysical objections.
  *   **The Reply (2 mins):**
      *   "The split is for the *sekha* (the trainee), not the *arahant* (the awakened one). For the awakened, you're right, there is no deliberation. But ethics is for those still suffering. For them, there *is* a gap between what is right (karmic law) and what they can see (their own mind). The split-level theory explains how the trainee navigates that gap without needing omniscience."
      *   **Concede:** For the fully enlightened, the theory collapses into unity.
      *   **Hold Line:** Ethics is for the unenlightened.
      *   **Soft Spot:** If they argue that "training" is also non-dual in the early texts.

  #### **5. The Kantian "Heteronomy" Grumble**
  *   **Who:** The Kantian.
  *   **The Voice:** "This is pure heteronomy. You're acting morally only to avoid bad karmic consequences or secure liberation. That's prudential, not moral. Where is the duty for duty's sake?"
  *   **Damage:** **Low.** Most of the room won't care, but it adds noise.
  *   **The Reply (2 mins):**
      *   "Buddhism rejects the notion that 'moral' means 'disconnected from well-being.' The duty is to end suffering. If that looks like prudence to a Kantian, it's because the ontology of suffering is different. But note: the Bodhisattva acts *against* self-interest in the Jātakas. That suggests the motivation transcends simple prudential calculation."
      *   **Concede:** It is not Kantian autonomy.
      *   **Hold Line:** It doesn't need to be.
      *   **Soft Spot:** None really, just agree to disagree on meta-ethics.

  ---

  ### **PART 2: YOUR TWO SPECIFIC WORRIES**

  **(a) Is this just Subjective Consequentialism?**
  *   **The Worry:** Consequentialists will say, "We already know agents have limited info. We call that 'Expected Value.' You haven't added anything."
  *   **The Fix:** Distinguish **Epistemic** limits from **Ontological** priority.
  *   **Reply:** "Standard Expected Value theory says: 'Maximize the good based on what you know.' My claim is stronger: The tradition argues the *only* accessible good is the mental state. External consequences are not just hard to know; they are secondary to the primary karmic mechanism. It's not a restriction on evidence; it's a claim about the *locus of value*. The mind-state *is* the primary consequence."
  *   **Status:** This is strong, provided you don't let them reduce "karmic consequence" to "worldly welfare."

  **(b) Does it collapse into Enlightened Self-Interest?**
  *   **The Worry:** If karma is individual, "reducing suffering" means "reducing *my* suffering."
  *   **The Fix:** The **Constitution Argument**.
  *   **Reply:** "The 'self' that is being optimized is constituted by its relations. You cannot purify 'your' mind in isolation. The causal stream includes the suffering you cause others because that suffering rebounds as mental defilement in you. Therefore, optimizing your mind *requires* minimizing harm to others. It is structurally impartial, even if the entry point is the agent's mind."
  *   **Status:** This is your weakest point regarding the Jātaka stress cases (giving away children). Be ready to admit that *some* Bodhisattva actions look morally monstrous by modern consequentialist standards and are justified only by the soteriological goal, not worldly welfare.

  ---

  ### **PART 3: CRITICAL SUCCESS FACTORS**

  **The One Reply That Must Land:**
  You must successfully define **"Consequence."**
  If the Consequentialists think "consequence" = "external worldly welfare" (e.g., dollars saved, lives saved), they will reject your theory because the Buddhist focus is internal. If the Religious Studies people think "consequence" = "cosmic reward," they will reject it as anachronistic.
  *   **The Line:** "Consequence here means *soteriological trajectory*. The 'good' is the cessation of *dukkha*. The 'act' is the intention. The 'link' is the mental habituation. If you accept that definition, the split-level theory holds. If you demand worldly utilitarianism, this isn't the tradition for you."
  *   **Why:** If you lose this, you are either doing bad utilitarianism (Consequentialists) or bad philology (RS).

  **The Real Landmine Question:**
  You suspect it is *anattā* (no-self). **You are correct.**
  *   **The Question:** "If there is no self to whom the karma belongs, who is the 'split' splitting? You have a deliberative agent (Level 1) and a karmic criterion (Level 2). If the agent is an illusion, Level 1 is fiction. If the karma is impersonal, Level 2 has no beneficiary. You have a machine with no operator and no output destination."
  *   **Why it's worse than you think:** It's not just "whose mind?"; it's "is ethics possible without a subject?"
  *   **Preparation:** Do not try to solve *anattā*. Frame it as a **Two-Truths** issue. "Ethics operates on the level of Conventional Truth (*sammuti-sacca*). To ask about the ultimate subject of conventional ethics is a category mistake. We teach karma to people who believe in selves, to help them reach the state where they don't."
      *   *Risk:* The RS scholars hate the "Two Truths" get-out-of-jail-free card if applied too loosely. Use it sparingly.

  ### **Tactical Advice for the "Ugly Q&A"**
  1.  **Feed the Consequentialists:** Use their language ("optimization," "tractable," "epistemic access"). Make them feel you are one of them doing fieldwork.
  2.  **Humble the RS Scholars:** Pre-empt them. In your opening or closing remarks, say, "I am aware this reconstruction glosses over philological inconsistencies between the Nikāyas and Commentaries." If you say it first, they can't use it to destroy you.
  3.  **The Jātaka Trap:** When they bring up the Bodhisattva giving away his children, do not say "this maximized welfare." Say "this maximized *perfection of giving* (dāna-pāramī) which is the necessary condition for the future capacity to save beings." Admit it fails worldly consequentialism to save soteriological consequentialism.
  4.  **Time Management:** If a question is a lecture, interrupt politely: "That's a crucial point about the textual history, but given the time, can I ask specifically how that impacts the deliberative procedure?" Keep them on your turf (ethics), not theirs (philology).

  Good luck. The split-level move is solid, but the metaphysics are the floorboards. Watch out for the rot.
