      *(Final Polish)*: Ensure the distinction between *criterion of rightness* and *decision procedure* is clear in the replies, as that's the core of the split-level thesis. Ensure the Religious Studies objection distinguishes between "Early Buddhism" (Nikāyas) and later commentarial stuff, as they are pedantic about that.

      *Wait, one nuance:* The user says "Early Buddhist ethics." The Religious Studies people will pounce on "Early." I need to make sure the reply acknowledges the stratification of texts.

