      *   **Thesis:** Early Buddhist ethics is a *split-level* theory.
          *   *Criterion of Rightness:* Consequentialist (karmic mechanism $\rightarrow$ reduction of suffering across the causal stream).
          *   *Decision Procedure:* Aretaic/Virtue-based (focus on own mind/unwholesome roots because that's the only epistemically accessible part of the causal stream).
          *   *Justification:* Solves epistemic demandingness without abandoning consequentialism.
          *   *Key Evidence:* Karma = intention; Jātaka tales (bodhisattva giving away body/children).
      *   **Deliverable:** A prep sheet for the Q&A.
          *   Objections ranked by damage potential.
          *   Phrased in the voice of the specific audience members.
          *   2-minute replies for each (concede, hold line, soft spots).
          *   Address two specific worries: (a) Is this just subjective consequentialism? (b) Does karma collapse into enlightened self-interest?
          *   Identify the *one* reply that must land.
          *   Identify the *real* landmine question (user suspects *anattā*, needs verification).

  2.  **Deconstruct the Audience & Potential Objections:**

      *   **The EA/Consequentialists:** They care about *actual* outcomes, expected value, and impartiality. They will smell "rule consequentialism" or "motive consequentialism" and worry it's a retreat from maximizing the good.
          *   *Objection:* "This is just subjective consequentialism with extra steps." (Worry A)
          *   *Objection:* "If the goal is reducing suffering, why restrict the deliberative scope to *my* mind? That ignores high-stakes external interventions."
          *   *Objection:* "Enlightened self-interest." (Worry B)

      *   **The Virtue Ethicists:** They think Buddhist ethics *is* virtue ethics. They will resist the "consequentialist criterion" claim.
          *   *Objection:* "You're imposing a Western dichotomy. The 'good' isn't separate from the 'state of mind'."
          *   *Objection:* "The Jātakas aren't about consequences; they about perfection of character (pāramīs)."

      *   **The Religious Studies (Pali/Sanskrit):** They hate anachronism and "flattening."
          *   *Objection:* "Karma isn't a mechanistic causal stream in the early texts; it's ritual/ontological."
          *   *Objection:* "You're cherry-picking suttas. The canon is inconsistent."
          *   *Objection:* "*Anattā* (No-self). Whose stream?" (The User's suspected landmine).

      *   **The Kantian:** They care about duty, universalizability, and treating persons as ends.
          *   *Objection:* "Instrumentalizing the self for future gain (even nirvanic) is heteronomous."
          *   *Objection:* "Karma looks like a cosmic sanction system, not autonomy."

  3.  **Address the Two Specific Worries:**

      *   *(a) Subjective Consequentialism:* If the criterion is "maximize good" but the procedure is "maximize virtue because you can't know the good," isn't that just standard motive consequentialism?
          *   *Counter:* The Buddhist claim is stronger: It's not just *epistemically* hard to know external consequences; it's *ontologically* primary that the mind is the forerunner. The "consequence" isn't just external welfare; it's the soteriological trajectory.
      *   *(b) Enlightened Self-Interest:* If karma is individual, does "reduction of suffering" mean "reduction of *my* suffering"?
          *   *Counter:* The "causal stream" includes rebirth and impact on others *through* the karmic ripple. But yes, there is a tension with *anattā*. If there is no self, who accumulates the karma? The answer usually lies in *dependent origination* (continuity without identity).

  4.  **Determine the "Must Land" Reply and the "Real Landmine":**

      *   *Must Land:* The definition of "Consequence." If the consequentialists think "consequence" means "external worldly welfare" and the Religious Studies think it means "cosmic reward," the theory fails. The reply must establish that "consequence" in this context = *soteriological outcome (nibbāna/dukkha reduction)* which is inextricably linked to mental state.
      *   *Real Landmine:* The User suspects *anattā*. They are right. If there is no self, the "split-level" theory relies on a deliberator (agent) optimizing a stream (consequence) that belongs to... no one. If the Religious Studies person hits this hard, the "agent" in the deliberative procedure dissolves. *However*, there's a deeper one: The definition of *Karma*. If Karma isn't consequentialist but *ontological* (action has inherent moral quality regardless of outcome), the criterion of rightness collapses. I need to weigh *anattā* vs. *Karma-nature*. *Anattā* is more destructive to the *agent* side of the split. Let's stick with the User's intuition but refine it: It's not just "whose trajectory," it's "is there a trajectory owner?"

  5.  **Drafting the Prep Sheet (Iterative Process):**

      *   *Structure:* Introduction -> Ranked Objections (Voice, Damage, Reply, Concede/Hold/Soft) -> Specific Worries (A & B) -> Critical Success Factor -> The Landmine.
      *   *Tone:* Professional, strategic, slightly cynical (acknowledging the "ugly Q&A").
      *   *Content:* Ensure the specific philosophical terminology (EV, aretaic, anachronistic, anattā) is used correctly.

      *(Self-Correction during drafting)*: Make sure the Religious Studies objection isn't just "you're wrong" but specifically about *translation artifacts*. They love to pounce on "karma = intention" as a specific sutta interpretation that might be overworked.
      *(Refining the Consequentialist Objection)*: The EAs will care about the "Jātaka stress case." Giving away your children reduces *their* welfare potentially. How is that consequentialist? I need to make sure the reply addresses the *long-term* soteriological consequence vs. short-term welfare.

