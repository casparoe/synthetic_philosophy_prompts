answer: |-
  This is a methodological minefield. The question "Why Britain and not China?" is a **contrastive explanation**. It does not ask for the causes of British industrialization in isolation; it asks for the *difference-maker* between two specific trajectories. When you conflate causal stories with counterfactual fantasy, it is usually because you have violated the logic of contrastive inference.

  Below is a structured list of desiderata for a theory of the Great Divergence. I have categorized them by **Logical Necessities** (non-negotiable for the question to make sense), **Empirical Constraints** (non-negotiable for the answer to be true), and **Theoretical Preferences** (camp-specific). I have also included a section on the tensions between these criteria.

  ### I. Logical Necessities (Non-Negotiable)
  *If a theory violates these, it is not answering the specific question asked; it is answering a different question.*

  **1. Initial-Condition Parity (The "Starting Line" Constraint)**
  *   **Motivating Case:** If a theory argues Britain diverged because it had higher literacy rates in 1500, it fails the "Why Britain and not China *in the 18th century*?" framing. It pushes the divergence point back too far, turning the "Great Divergence" into a "Long Divergence."
  *   **Why it matters:** To treat China as a valid control group, the two regions must be comparable on the relevant metrics (living standards, market integration, agricultural productivity) at the chosen start date (usually c. 1700). If parity is not established, the comparison is apples-to-oranges.
  *   **Status:** **Non-Negotiable.** Without this, you aren't explaining a divergence; you're describing a pre-existing gap.

  **2. Causal Asymmetry (The "Difference-Maker" Constraint)**
  *   **Motivating Case:** If a theory claims "Secure Property Rights caused Industrialization," but evidence shows Qing China had equally secure property rights over land and capital, the theory fails. A variable present in both the treatment (Britain) and control (China) cases cannot explain the difference in outcomes unless it interacts with another variable that *does* differ.
  *   **Why it matters:** This is the logic of Mill's Method of Difference. $X$ cannot cause $Y_{Britain} - Y_{China}$ if $X_{Britain} \approx X_{China}$.
  *   **Status:** **Non-Negotiable.** Violating this turns the theory into a general theory of growth, not a theory of divergence.

  **3. Counterfactual Robustness (The "Qing Coal" Test)**
  *   **Motivating Case:** You mentioned the Qing subsidizing coal in Shanxi. If a theory argues "Access to cheap coal caused industrialization," we must ask: If the Qing state had artificially created that access (subsidizing transport/mining), would industrialization have followed? If the answer is "No, because culture/institutions blocked it," then coal was not the *primary* cause; it was a bottleneck secondary to the real cause.
  *   **Why it matters:** This separates *necessary conditions* from *sufficient causes*. A legit answer must identify the binding constraint. If removing the constraint in the counterfactual China doesn't change the outcome, you haven't found the root cause.
  *   **Status:** **Non-Negotiable.** This is the only way to distinguish a causal story from a post-hoc description of what happened to exist alongside growth.

  **4. Temporal Specificity (The "When" Constraint)**
  *   **Motivating Case:** A theory that explains why Europe diverged in 1900 might not explain why Britain diverged in 1780. If the explanatory variable (e.g., "Enlightenment Thought") peaked in 1750 but industrialization spiked in 1790, the timing must align.
  *   **Why it matters:** Correlation over centuries is meaningless. The causal mechanism must operate within the window where the trajectories actually separate.
  *   **Status:** **Non-Negotiable.** Vague timing allows for "just-so" stories that fit any data point.

  ### II. Empirical Constraints (Non-Negotiable)
  *If a theory violates these, it is factually wrong, regardless of its logical elegance.*

  **5. Consistency with Proto-Industrialization Data**
  *   **Motivating Case:** Both Britain and China had rural textile production, merchant capital, and expanding markets before 1750. A theory that claims "China lacked a market economy" is empirically false.
  *   **Why it matters:** The theory must account for why similar proto-industrial bases led to different mechanical outcomes. It cannot deny the similarities to emphasize the differences.
  *   **Status:** **Non-Negotiable.** Denying established economic history disqualifies the theory.

  **6. Mechanism Transparency (No "Black Boxes")**
  *   **Motivating Case:** Saying "British Culture was more innovative" is a label, not a mechanism. How does "culture" get a miner to fix a steam engine? The theory must specify the transmission belt (e.g., wage incentives, patent enforcement, social mobility).
  *   **Why it matters:** Without a mechanism, you cannot run the counterfactuals required in Criterion #3.
  *   **Status:** **Non-Negotiable.** However, *what counts* as a valid mechanism is where the camps fight (see below).

  ### III. Theoretical Preferences (Camp-Specific)
  *These are not logical errors, but rather bet placements on what kind of variable matters most. A theory can be legitimate while prioritizing one over the other, provided it meets the criteria above.*

  **7. Institutional vs. Cultural Primacy**
  *   **Institutionalist Preference:** Demands that the explanation rest on enforceable rules (patents, parliaments, property rights).
      *   *Risk:* Often struggles with Criterion #2 (Causal Asymmetry) because Chinese institutions were often functionally similar in relevant economic sectors.
  *   **Cultural/Epistemic Preference (Needham-Camp):** Demands that the explanation rest on knowledge systems, scientific methodology, or social values.
      *   *Risk:* Often struggles with Criterion #6 (Mechanism Transparency) because "culture" is hard to operationalize as a specific causal lever.
  *   **Status:** **Negotiable.** You can build a legit theory on either, but you must defend the mechanism.

  **8. Structural Determinism vs. Historical Contingency**
  *   **Determinist Preference:** The divergence was inevitable given structural variables (e.g., geography, coal location).
      *   *Motivation:* Makes the theory generalizable to other contexts.
  *   **Contingency Preference:** The divergence was accidental (e.g., location of coal relative to water, specific political wars).
      *   *Motivation:* Fits the historical record of "close calls" better.
  *   **Status:** **Negotiable.** However, high contingency makes the theory less useful for social science; high determinism makes it historically brittle.

  ### IV. The "Explanatory Asymmetry Across Technological Regimes" Query

  You asked if this should be on the list or if it is a prejudice.

  **Verdict:** It is a **Validity Enhancer**, not a strict logical necessity, but ignoring it is dangerous.

  *   **The Prejudice:** Demanding that a single variable (e.g., "wages") explain the divergence in *every* sector (textiles, iron, transport, agriculture) is likely impossible. Sectoral divergence happened at different rates.
  *   **The Validity Check:** However, if your theory explains textiles (high wages spurred labor-saving tech) but fails to explain iron (where Britain also diverged, but the dynamics were different), your theory is "over-fitted" to one industry.
  *   **Recommendation:** Do not make it a non-negotiable criterion that the *same* cause must explain *all* technologies. Instead, require that the theory explains why the **bundle** of technologies shifted together. If a theory explains the steam engine but implies the spinning jenny should *not* have been invented in Britain, the theory is internally inconsistent.
  *   **Refined Criterion:** **Coherence Across Sectors.** The explanation for the divergence in one key sector must not contradict the conditions in other diverging sectors.

  ### V. Joint Unsatisfiability (The Trade-Offs)

  You asked if some subsets of these criteria collapse the question into unanswerability. **Yes.** There are two major tensions you need to navigate in your essay.

  **1. The Parity vs. Asymmetry Tension**
  *   **The Conflict:** Criterion #1 (Initial-Condition Parity) demands Britain and China be roughly equal in 1700. Criterion #2 (Causal Asymmetry) demands there be a significant difference to explain the outcome.
  *   **The Collapse:** If you enforce Parity too strictly, there is no variable left to serve as the Cause. If you enforce Asymmetry too strictly, you violate Parity (admitting they weren't equal to begin with).
  *   **Resolution:** A legit theory must identify a **small difference with large consequences** (a "tipping point" variable) rather than a massive structural gap. If the theory requires a massive gap in 1700 to work, it fails the Parity constraint. If it relies on a tiny gap, it must explain the amplification mechanism rigorously.

  **2. The Specificity vs. Stability Tension**
  *   **The Conflict:** Criterion #3 (Counterfactual Robustness) asks: "If we change X, does Y change?" This requires a stable, law-like relationship. But History is contingent (Criterion #8).
  *   **The Collapse:** If you demand strict counterfactual stability (e.g., "If China had coal, it *would* industrialize"), you are engaging in fantasy because history is path-dependent. If you demand pure contingency ("It was just luck"), you cannot satisfy Counterfactual Robustness because the outcome wasn't robust; it was fragile.
  *   **Resolution:** You must define the **scope of the counterfactual**. A legit answer admits that the *timing* might be contingent, but the *direction* is structural. (e.g., "China might not have industrialized in 1790, but the structural pressures made it inevitable by 1850 unless X stopped it").

  ### Summary Checklist for Your Coursework

  When evaluating a theory (or writing your own), run it through this filter:

  1.  **Does it respect the 1700 Starting Line?** (If it says China was backward in 1600, reject it for this specific question).
  2.  **Is the Cause Asymmetric?** (If the cause existed in China, does the theory explain why it didn't trigger growth there?)
  3.  **Does it pass the "Qing Coal" Test?** (If the bottleneck were removed artificially, would the result change? If not, find a deeper bottleneck).
  4.  **Is the Mechanism Transparent?** (Does it explain *how* the cause changes behavior, not just that it correlates?)
  5.  **Does it avoid Over-Fitting?** (Does it explain the industrial bundle, or just one machine?)

  **Final Advice:** The "Counterfactual Fantasy" trap happens when you assume the British path was the "default" and the Chinese path was the "deviation." A legit contrastive answer treats the British path as the deviation that requires explaining, given that the Chinese path was the global norm for high-agricultural-output societies. If your theory assumes industrialization is the natural state of affairs, you have already failed the Parity constraint.
