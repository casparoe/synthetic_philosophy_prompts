      *   *Mechanism Specificity:* Vague "culture" isn't enough. Needs a transmission belt.
      *   *Empirical Consistency:* Must fit the data we have (wages, coal, institutions).
      *   *Asymmetry:* Why did the cause work in A but not B?
      *   *Contingency vs. Determinism:* Was it inevitable or lucky?
      *   *Scope:* Does it explain just textiles or the whole economy?

  4.  **Developing the Criteria (Drafting & Refining):**

