      *   This implies a control group (China) and a treatment group (Britain).
      *   It implies a specific timeframe (usually late 18th/early 19th century).
      *   It implies a specific outcome (sustained intensive growth/industrialization).

  3.  **Brainstorming Desiderata (Criteria):**
