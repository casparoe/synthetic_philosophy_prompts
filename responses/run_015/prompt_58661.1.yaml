prompt: |-
  So I just joined our neighborhood CERT emergency response volunteer thing and after a drill last weekend a bunch of us went for tacos and got into this whole rabbit hole about who you save when you cant save everyone and its been stuck in my head since because I definately have strong gut reactions but I'm not sure they fit together. My cousin is a nurse and she kept bringing up triage and my friend who is into effective altruism kept saying numbers have to count and I was trying to defend like normal human partiality and fairness at the same time.

  Ok so here is roughly where I have landed and I want to know if it actually hangs together: (1) when its all strangers facing the same serious harm, like five people drowning on one side of the lake versus one drowning on the other and I can only paddle to one side, I should save the five, not flip a coin, the greater number wins; (2) no number of tiny harms can add up to outweigh one death or permanent injury, like even a million brief headaches or missed buses taht I could prevent should not beat saving one strangers life, each persons serious loss is on a different scale; (3) when its someone I love versus a bunch of strangers, like my sister versus seven strangers with the same life-threatening need, it is permissible to save my sister and also permissible to save the seven instead, neither choice would be wrong; (4) when I do use a lottery to decide who to save because I want to be fair and respect everyone separately rather than just adding lives together, fairness means giving each person an equal chance, so like heads I save the one and tails I save the five as two equal options, not weighting it toward the bigger group. Are these four jointly tenable, which pairs are in real tension versus only looking like they are, and what is the cheapest fix for each real tension and what would it cost me?

  Act as a professional philosopher specializing in moral philosophy, please think carefully through the logic step by step and brainstorm the tensions before you rank them, order the real tensions by severity and for each say what would have to give, and please answer in American English in under 450 words total.
