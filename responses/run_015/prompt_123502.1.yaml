      *(Refining the Independence point)*: The user's suspicion about "same pretrained soup" is key. In FS, diverse redundancy means different physics or different code bases. If the monitor is a distilled version of the untrusted model, that's not diversity; that's correlation. I need to validate this strongly.

      *(Refining the Probability point)*: Don't just say "it's hard." Say *why* it violates the assumptions of PRA (ergodicity, stationarity). Suggest "Assurance Cases" as the industry alternative.

