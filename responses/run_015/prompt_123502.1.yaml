      *   *No Counterpart (AI side):* Adaptive failure modes. In FS, a valve sticks or a wire breaks. It doesn't *learn* to stick only during proof testing. The "Deceptive Alignment" concept is alien to standard FMEA.
      *   *No Counterpart (FS side):* PFD/PFH targets. AI Control often lacks rigorous quantification. Certification regimes (SIL 3) don't exist for LLMs yet.

  6.  **Addressing Sticking Point 1 (Probability Numbers):**
      *   User suspects incoherence.
