  11. **Final Polish:** Check for clarity and flow. Ensure the distinction between "Protection" (prevention) and "Detection" (mitigation) is clear in the classification section. (e.g., Kill switch is protection, Logging is detection).

  *(Self-Correction on "n=1 BFT")*: Actually, BFT with n=1 is impossible. You need 3f+1. So the colleague is definitely wrong on the technical definition, but right about the "no spec" issue. I should clarify that.

  *(Final thought on "Trust")*: The AI Control proposal assumes a "trusted monitor." In FS, "trusted" means "qualified to SIL X." In AI, "trusted" often means "we hope this smaller model didn't learn to lie." This is a massive gap. I must highlight this.

