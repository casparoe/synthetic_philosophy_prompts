      *   Verdict: Colleague is glib. It's more like a "Sandwich Architecture" with a trusted core, but the "no spec" part is the real danger.

  8.  **Critique/No Flattery:**
      *   FS Critique: FS assumes failures are random or static systematic. It breaks down against intelligent adversaries (which is why Security/ISA-IEC 62443 exists separately). FS assumes specifications are knowable.
