answer: |-
  **MEMORANDUM**

  **TO:** Long-Range Programs Committee, Caledon Health Research Council
  **FROM:** [Your Name/Committee Member]
  **DATE:** 15 November 202X
  **SUBJECT:** Recommendation on Thornbank Cohort Study Renewal (Cycle 3)
  **MEETING DATE:** 20 November 202X

  ### 1. Recommendation

  I recommend that the Committee advise the Board to **renew the Thornbank Cohort Study for a five-year term**, rather than the proposed ten-year term, subject to specific performance gates regarding retention and data modernization.

  *   **Funding Authorization:** $18 million (5 years × $3.6M/year), with the second five-year tranche contingent on a mid-term review.
  *   **Review Gate:** A mandatory re-evaluation in November 202X+3. Termination becomes the correct decision at that point if: (a) retention drops below 55%; (b) the study fails to publish primary cardiometabolic outcomes from the age-40 wave; or (c) a cost-benefit analysis shows the marginal cost per usable data point exceeds 150% of a hypothetical new cohort.
  *   **Condition:** The Principal Investigator must submit a plan within six months to modernize obsolete instruments and integrate harmonized measures compatible with post-2020 standards.

  ### 2. The Economic Framework: Sunk Cost vs. Capital Asset

  To act responsibly, we must separate the **sunk cost fallacy** from **asset valuation**. Our health economist is correct that the $74 million spent over 22 years is gone; its expenditure cannot logically compel us to spend another $36 million. If the study produced zero value today, stopping would be the rational choice regardless of past spending.

  However, the argument for renewal is not that we *spent* money, but that the spending created a **non-fungible capital asset**.

  *   **The Fallacy:** "We have invested $74 million, so we must continue to avoid waste." (This treats past expenditure as a debt we owe the past.)
  *   **The Load-Bearing Reason:** "The $74 million purchased a unique infrastructure (the cohort, biospecimens, trust) that is currently valued higher than its replacement cost." (This treats the past expenditure as a purchase of current capacity.)

  The Thornbank Cohort is not merely a line item in a ledger; it is a half-built bridge. The concrete poured yesterday is sunk, but the bridge itself is a current asset. If we demolish it now, the scrap value is near zero. If we complete it, it carries traffic. The question is not whether we should have built the bridge, but whether finishing it yields more utility than building a different road elsewhere for the same price.

  ### 3. Load-Bearing Arguments for Renewal

  Three arguments survive the "sunk cost" test and justify the marginal investment of $3.6 million annually:

  **A. The Unrepeatable Exposure Gradient (Scientific Value)**
  The closure of the metal smelter in 2009 means the specific environmental exposure gradient that defined Thornbank's original hypothesis no longer exists. A new cohort launched today could not replicate this variable. As participants turn forty, we are uniquely positioned to measure the interaction between that specific historical exposure and midlife cardiometabolic disease. This data point is temporally locked; if we do not collect it now, it is lost to science permanently.

  **B. Institutional Reputation and Long-Horizon Capacity (Strategic Value)**
  Science requires trust over time. An institution known to terminate longitudinal projects when they become expensive or difficult loses the ability to recruit for future long-term studies. This is not merely about "saving face"; it is a functional capability. If we break the implicit contract of long-horizon science, the premium we must pay to secure participation in future cohorts (like the planned 2031 study) will rise, or participation will become impossible.

  **C. The Promise-Keeping Obligation (Ethical Value)**
  Participants enrolled as infants based on a representation of life-long follow-up. While consent forms allow withdrawal, the Council's recruitment material for the 2031 cohort explicitly leverages Thornbank's history of stewardship. Abandoning Thornbank now devalues the currency of our promises to future participants. This is a real liability, even if it does not appear on a balance sheet.

  ### 4. The Case for Termination (Steelman)

  If I were arguing for termination, my strongest case would not rely on the money already spent, but on the **marginal inefficiency of the next dollar**.

  *   **Diminishing Returns:** Retention is at 63% and falling. A cohort with high attrition introduces selection bias that may invalidate the very outcomes we seek. If the remaining 37% are not representative, the data is scientifically hollow regardless of how unique the exposure was.
  *   **Obsolescence:** The external review rated the science "good but not excellent," noting obsolete instruments. If the data collected in the next decade cannot be harmonized with modern biomarkers or digital health standards, we are building a library of books no one will read.
  *   **Opportunity Cost:** $3.6 million annually is significant. A new cohort could be launched for one-third of this cost. While it lacks the smelter gradient, it could utilize modern wearables and genomics to answer *different* questions with higher precision. By funding Thornbank, we are implicitly choosing *these* questions over *those* questions.

  This argument is valid. If the retention rate collapses or the data proves non-harmonizable, the "asset" value drops to zero, and renewal becomes the fallacy.

  ### 5. Why Deference to Past Committees is Not a Primary Reason

  One argument often raised is that we should defer to the judgment of earlier committees who committed to this long-horizon plan. I advise we treat this with caution.

  *   **The Fallacy:** "They decided this, so we cannot overturn it." (This is an appeal to authority that ignores current conditions.)
  *   **The Valid Nuance:** "They possessed baseline information we no longer have, and consistency aids strategic planning."

  We should not renew simply to honor their decision. We should renew only if *our* assessment of the current asset value aligns with their strategic intent. If the science has degraded, we owe it to them to cut losses, not to perpetuate a failing project in their name.

  ### 6. Conditions for Reversal

  To ensure this recommendation remains robust, we must define what would make **termination** the correct choice in the future.

  **If we renew now, termination becomes mandatory if:**
  1.  **Retention Breach:** Follow-up participation drops below 55% in the next wave, indicating the cohort is no longer statistically representative.
  2.  **Data Stagnation:** The study fails to publish primary outcome data from the age-40 wave within three years of renewal.
  3.  **Modernization Failure:** The PI fails to implement a plan to harmonize data collection with current Council standards by the mid-term review.

  **If we were to terminate now, renewal would have been right only if:**
  1.  **Asset Liquidity:** We could demonstrate that the biospecimens and data could be monetized or utilized by third parties at a value exceeding the cost of maintenance (currently unlikely).
  2.  **Scientific Redundancy:** Another existing cohort could provide comparable data on the smelter exposure gradient (currently impossible due to the smelter's closure).

  ### 7. Conclusion

  The $74 million spent is gone. It justifies nothing. But the *capacity* it bought—a unique, aging cohort with a specific environmental history—is a current asset. That asset is valuable, but it is depreciating due to retention issues and methodological obsolescence.

  A ten-year unconditional renewal ignores the depreciation. A termination ignores the asset value. A **five-year conditional renewal** captures the unique midlife outcomes currently coming due, respects the promises made to participants, and protects the Council's reputation for long-horizon science, while retaining the option to exit if the data quality no longer justifies the marginal cost.

  I look forward to discussing this framework on 20 November.
