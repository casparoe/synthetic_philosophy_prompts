answer: |-
  # Diagnostic Taxonomy: Threshold-Sensitive Contextual Modulation (TSCM)

  **Root Node:** Does the theorist accept that moral feature-salience is non-monotonic in the specific sense of **Threshold-Sensitive Contextual Modulation** (i.e., can a feature's directional contribution reverse from positive to negative once a critical mass of competing features is present)?

  *   **NO** (Feature valence is invariant; apparent reversals are merely outweighing)
      *   **Node 2:** Do invariant moral reasons survive such modulation intact?
          *   *Forced Move:* **YES** (If modulation is rejected, reasons are by definition invariant).
          *   **Node 3:** Does holism about reasons necessarily extend to holism about all-things-considered (ATC) judgment?
              *   **NO** (ATC judgment is calculable/codifiable based on invariant inputs)
                  *   **Node 4:** Does practical reasoning require explicit articulation of the modulatory conditions?
                      *   **YES:** **Leaf A: Robust Generalism**
                      *   **NO:** **Leaf B: Non-Articulable Generalism**
              *   **YES** (ATC judgment is itself holistic/uncodifiable despite invariant inputs)
                  *   **Node 4:** Does practical reasoning require explicit articulation of the modulatory conditions?
                      *   **YES:** **Leaf C: The Codified Holist (Unoccupied)**
                      *   **NO:** **Leaf D: The Intuitionist Generalist (Unoccupied)**

  *   **YES** (Feature valence can reverse based on contextual thresholds)
      *   **Node 2:** Do invariant moral reasons survive such modulation intact (e.g., as higher-order principles governing the reversal)?
          *   **YES** (The *flip* is rule-governed)
              *   **Node 3:** Does holism about reasons necessarily extend to holism about all-things-considered (ATC) judgment?
                  *   **NO** (ATC judgment is determinate via the higher-order rule)
                      *   **Node 4:** Does practical reasoning require explicit articulation of the modulatory conditions?
                          *   **YES:** **Leaf E: Principled Contextualism**
                          *   **NO:** **Leaf F: The Implicit Meta-Rule Theorist (Unoccupied)**
                  *   **YES** (ATC judgment remains holistic despite the meta-rule)
                      *   **Node 4:** Does practical reasoning require explicit articulation of the modulatory conditions?
                          *   **YES:** **Leaf G: The Articulate Holist (Unoccupied)**
                          *   **NO:** **Leaf H: The Quietist Contextualist (Unoccupied)**
          *   **NO** (The reversal dissolves the *pro tanto* reason entirely)
              *   **Node 3:** Does holism about reasons necessarily extend to holism about all-things-considered (ATC) judgment?
                  *   **NO** (Reasons are holistic, but ATC judgment is codifiable)
                      *   **Node 4:** Does practical reasoning require explicit articulation of the modulatory conditions?
                          *   **YES:** **Leaf I: The Algorithmic Particularist (Unoccupied)**
                          *   **NO:** **Leaf J: The Perceptual Calculator (Unoccupied)**
                  *   **YES** (Full holism: reasons and ATC are both context-bound)
                      *   **Node 4:** Does practical reasoning require explicit articulation of the modulatory conditions?
                          *   **YES:** **Leaf K: The Discursive Particularist (Unoccupied)**
                          *   **NO:** **Leaf L: Standard Particularism**

  ---

  ### Leaf Descriptions & Gap Diagnostics

  **Leaf A: Robust Generalism**
  *   *Description:* Exceptionless principles govern action even when their direct application requires ignoring the apparent moral reversal of features in complex contexts.
  *   *Awkward Commitment:* "A feature can be a decisive reason against an action while simultaneously retaining its invariant status as a reason for it."

  **Leaf B: Non-Articulable Generalism**
  *   *Description:* Invariant moral principles exist and govern feature valence, but agents cannot explicitly state the principles that justify their judgments.
  *   *Awkward Commitment:* "Moral truth is governed by exceptionless laws that are in principle unspeakable by the agents bound by them."

  **Leaf C: The Codified Holist (Unoccupied)**
  *   *Diagnosis:* **Conceptual Incoherence.** If ATC judgment is truly holistic (uncodifiable), one cannot consistently require the explicit articulation of conditions that determine that judgment.

  **Leaf D: The Intuitionist Generalist (Unoccupied)**
  *   *Diagnosis:* **Unexplored Theoretical Space.** This position (invariant reasons + holistic ATC + no articulation) resembles Rossian intuitionism but is rarely defended as a response to TSCM specifically.

  **Leaf E: Principled Contextualism**
  *   *Description:* Features reverse valence at specific thresholds, but invariant higher-order principles dictate exactly when and how these reversals occur.
  *   *Awkward Commitment:* "A feature's valence flips, but the rule governing the flip never does."

  **Leaf F: The Implicit Meta-Rule Theorist (Unoccupied)**
  *   *Diagnosis:* **Practical Unattractiveness.** Positing invariant meta-rules that govern reversals but denying the need to articulate them renders the meta-rules explanatorily idle.

  **Leaf G: The Articulate Holist (Unoccupied)**
  *   *Diagnosis:* **Conceptual Incoherence.** Demanding explicit articulation of modulatory conditions contradicts the claim that ATC judgment is holistic and immune to codification.

  **Leaf H: The Quietist Contextualist (Unoccupied)**
  *   *Diagnosis:* **Unexplored Theoretical Space.** A view accepting TSCM and meta-rules but denying holism of ATC and articulation requirements; potentially unstable between Leaf E and Leaf L.

  **Leaf I: The Algorithmic Particularist (Unoccupied)**
  *   *Diagnosis:* **Conceptual Incoherence.** If *pro tanto* reasons do not survive modulation (holism of reasons), there are no stable inputs for an algorithm to calculate a codifiable ATC judgment.

  **Leaf J: The Perceptual Calculator (Unoccupied)**
  *   *Diagnosis:* **Conceptual Incoherence.** Combines the claim that reasons are holistic (no stable units) with the claim that ATC judgment is not holistic (calculable sum), which is mathematically impossible.

  **Leaf K: The Discursive Particularist (Unoccupied)**
  *   *Diagnosis:* **Practical Unattractiveness.** Requires agents to articulate the conditions for reason-reversal in contexts defined by the absence of generalizable rules.

  **Leaf L: Standard Particularism**
  *   *Description:* Features reverse valence based on context, invariant reasons do not survive, and moral judgment relies on perception rather than articulated principles.
  *   *Awkward Commitment:* "Rational action is possible even when no generalizable reason explains why."

  ---

  ### Limitations of this Taxonomy

  This axis of classification fails to separate positions that agree on the **structural behavior of reasons** but disagree on their **ontological status**. Specifically:

  1.  **Cognitivism vs. Non-Cognitivism:** A Non-Cognitivist Expressivist and a Cognitivist Realist could both occupy **Leaf L (Standard Particularism)** if they agree that feature-salience is TSCM-sensitive and non-articulable, despite disagreeing on whether moral judgments express beliefs or desires.
  2.  **Constructivism vs. Realism:** **Leaf E (Principled Contextualism)** could be occupied by a Moral Realist (principles are mind-independent) or a Constructivist (principles are constituted by rational agency), as this tree classifies the *logic* of the principles, not their *source*.
  3.  **Moderate Generalism vs. Principled Contextualism:** If a Moderate Generalist defines "principle" loosely enough to include higher-order threshold rules, they may be indistinguishable from **Leaf E**, suggesting the boundary between "invariant reason" and "invariant meta-rule" requires further stipulation to be diagnostically sharp.
