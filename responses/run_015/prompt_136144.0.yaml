answer: |-
  The reflexive authority bootstrap problem in this context does not merely create computational friction; it necessitates an **external arbitration principle that lies outside the extrapolated volition itself**. The Coherent Extrapolated Volition (CEV) framework presupposes that a unified normative direction can be derived from the internal dynamics of an agent's psychology under idealization. However, when the submodules contest the *meta-rules* of that unification—specifically regarding veto authority over coherence conditions—the extrapolation procedure loses the normative traction required to select a unique fixed point. Without a pre-commitment to a specific arbitration logic that is not itself subject to the extrapolation, the system cannot distinguish between a resolved coherence and a captured hierarchy.

  The precise structural feature generating this tension is the **self-referentiality of the coherence metric**. In a standard optimization problem, the objective function is distinct from the variables being optimized. In this reflexive CEV scenario, the "coherence" of the volition is the objective, but the definition of coherence (i.e., which submodule grants or denies validity to the others) is itself a variable within the volition. The deontic submodule idealizes to a rule where duty vetoes consequences; the consequentialist idealizes to a rule where utility vetoes duty; the aesthetic idealizes to a rule where integrity vetoes both. Because each submodule's idealized state includes a claim to *procedural* authority over the others, the extrapolation function faces a circular dependency: it cannot determine the coherent whole without first resolving the meta-rule, but it cannot resolve the meta-rule without appealing to the coherent whole.

  This loop undermines the possibility of an endogenous resolution. If the extrapolation procedure attempts to resolve this by weighing the submodules based on their current psychological strength, it privileges the status quo rather than the idealized volition, violating the "more the person they wished they were" criterion. If it attempts to let the submodules "negotiate" within the extrapolation, the negotiation itself requires rules of engagement (e.g., can one submodule lie? can it coerce?), which returns the problem to the meta-level. Consequently, the system cannot converge on a single coherent volition based solely on the input preferences because the preferences include mutually exclusive definitions of the convergence criteria. To resolve this, an external arbitration principle must be hard-coded into the extrapolation mechanism itself—a constitutional constraint that dictates how conflicting meta-claims are adjudicated (e.g., "lexical priority is forbidden" or "veto power requires unanimous consent") which is not derived from the agent's extrapolated preferences but is rather a condition for running the extrapolation at all.

  If this structural feature—reflexive contention over the coherence metric—is removed, the problem dissolves. Suppose the meta-rules are fixed externally such that all submodules must submit to a weighted summation or a specific voting protocol that none of them can veto. In that case, the submodules can be idealized in isolation or tandem, and their outputs can be aggregated according to the fixed protocol. The extrapolation then becomes a standard search for a fixed point within a defined topology, rather than a search for the topology itself. The tension exists solely because the agent's psychology is asked to define the boundaries of its own governance without a prior constitution.

  It is crucial to flag that this argument depends on a contested interpretation of **idealization as clarification rather than correction**. If one assumes that idealization inherently converges on objective normative truths (i.e., that the deontic and consequentialist submodules would eventually agree on the *true* meta-rule given enough computation), then the conflict is merely epistemic and will vanish upon full extrapolation, rendering external arbitration unnecessary. However, if idealization is interpreted strictly as the amplification and refinement of the agent's existing psychological structures (the core internalist commitment of CEV), then incompatible meta-preferences remain incompatible even at the limit. Under this internalist view, the extrapolation process cannot generate the normative authority to resolve the conflict ex nihilo; it can only reveal the conflict more sharply. Therefore, maintaining the coherence requirement in a reflexive, self-governing setting demands that the rules of governance be treated as invariant constraints on the extrapolation process, rather than as variables within it. Without this external anchor, the "coherence" of the resulting volition is illusory, masking a power grab by whichever submodule happens to dominate the computational dynamics of the extrapolation.
