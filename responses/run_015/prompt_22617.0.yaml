      *   *Newton:* "Because to ignore the design is to feign a blind nature."

  6.  **Polishing Prose:**
      *   Avoid modern idioms. Use "feign" instead of "fabricate," "phenomena" instead of "observations."
      *   Keep sentences rhythmic but clear.
      *   Ensure the physical setting mirrors the intellectual state (shadows, light).

  7.  **Final Review against Constraints:**
      *   ~1 page? (Yes, keep it tight).
