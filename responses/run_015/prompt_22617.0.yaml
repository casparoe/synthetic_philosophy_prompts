answer: |-
  The fire in the grate had sunk to a bed of sullen coals, casting long, wavering shadows against the stacks of papers that fortified Isaac Newton's study. Outside, the London rain beat against the panes of St. Martin's Street, but inside, the air was dry with the scent of old leather and gall ink. Richard Bentley sat opposite the old man, the 1713 *Principia* open on his knee.

  "Sir," Bentley said, tapping the General Scholium. "The Leibnizians do not attack your mathematics. They attack this. They say you have smuggled a sermon into a treatise."

  Newton shifted, his gouty leg tucked beneath the chair. "They attack what they cannot calculate. I have shown that gravity explains the motions. I have not feigned a cause for gravity."

  "But you have feigned a cause for the System," Bentley pressed, leaning forward. "You write that this most elegant system could not arise without the dominion of an intelligent Being. Yet you also declare *hypotheses non fingo*. If the world requires a Governor to keep it from decay, is that not a hypothesis? You claim to deduce only from phenomena, but you cannot observe this Governor. You infer Him because your mechanics leave a residue. To the freethinkers in Amsterdam, this looks not like proof, but like a patch. You give them the excuse they crave: that God is merely the *Deus ex machina* for a physics that has failed."

  Newton's eyes, pale and piercing, fixed on Bentley. "You mistake the nature of the inference, Dr. Bentley. To say the laws of motion hold is one thing. To ask why the planets all revolve the same way, in concentric orbits, while the comets range at every angle—that is another. Gravity explains how they move, not why they are placed so."

  "Then let the placement be," Bentley countered. "Stop at the laws. If you assert a Divine Hand to explain the initial velocity, you enter the realm of speculation. You say you do not frame hypotheses, yet the Scholium is one vast hypothesis about intent. It wrecks your method. It tells the atheist: 'Here is a gap in my mechanics; fill it with God.' And when the mechanics improve, God is evicted."

  "And if I do not assert it?" Newton's voice was low, vibrating with a restrained intensity. "If I say only 'the laws hold,' I hide the true hypothesis. I imply that blind nature could have chanced upon this order. That is the real fiction. To stop at the secondary causes and ignore the primary is to feign a world without a mind."

  Bentley shook his head. "But consistency, Sir. Your method relies on certainty. The Scholium relies on faith. If you bind them together, you make the certainty vulnerable to the doubts of the theologians."

  "I bind them," Newton said, striking the arm of his chair, "because the phenomena *are* the theology. The regularity is the evidence. You say I introduce a hypothesis? No. I introduce a cause adequate to the effect. A blind cause could not sort the planets from the comets. To deny this is not philosophy; it is blindness."

  "It is prudence," Bentley insisted. "Leibniz laughs. He says you make God a watchmaker who must wind his clock, lest it stop. He claims this diminishes the Almighty."

  "Leibniz," Newton spat the name, "would make God a soul to the world, trapped within it. I will not have my work used to cage the Creator in the machine. Let them call it a hypothesis. It is the only deduction that does not insult the reason of the creation."

  Bentley closed the book with a soft thud. The silence stretched, filled only by the ticking of a clock on the mantis—a clock that, both men knew, required a hand to wind it.

  "Then you will not soften it for the new edition?" Bentley asked quietly.

  Newton looked into the dying fire. "Truth is not a treaty to be negotiated. If they require a hypothesis to explain order without design, let them frame it. I shall not."
