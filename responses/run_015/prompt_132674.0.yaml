answer: |-
  You have identified a very real and pernicious rhetorical move, but you are correct: there is no single, canonical Latin term or universally agreed-upon proper noun for this specific pattern in the way there is for *ad hominem* or *tu quoque*.

  However, in political theory and moral psychology, this is a recognized corruption of the "Dirty Hands" thesis. Here is the breakdown of the existing concepts that cover it, the best name for it, and how to distinguish it from hypocrisy.

  ### 1. The Closest Established Concepts

  While there isn't one word, this behavior sits at the intersection of three established ideas:

  **A. Inverted Moral Licensing**
  You mentioned moral licensing, but dismissed it because that usually involves *good* deeds licensing *bad* ones. However, in moral psychology, licensing is about **identity consistency**.
  *   **Standard Licensing:** "I am a good person (proved by donation), so I can afford to be selfish here."
  *   **Inverted Licensing (Your Scenario):** "I am a 'hard choices' person (proved by the dump), so I can afford to be ruthless here."
  The agent is using their past action to establish an identity ("The Pragmatic Realist") that licenses future deviations from standard morality. It is a form of **Moral Credentialing**, where the "credential" is the willingness to commit necessary evils.

  **B. Ethical Disengagement (Mechanism: Moral Justification)**
  Albert Bandura's work on *Moral Disengagement* describes how people turn off their internal moral compass. The specific mechanism your mayor is using is **Advantageous Comparison** mixed with **Displacement of Responsibility**.
  *   *Argument:* "Compared to the toxic dump crisis, this condo deal is minor," or "The situation (my stained record) forces my hand."
  *   By framing their moral status as "already ruined," they disengage the self-sanction that would normally stop the second act.

  **C. The Violation of "Moral Remainder"**
  This is the most precise philosophical critique. Michael Walzer, who popularized the "Dirty Hands" problem in political philosophy (*"Political Action: The Problem of Dirty Hands,"* 1973), argues that a politician who commits a necessary evil must suffer a **moral remainder** (guilt, remorse, willingness to resign).
  *   **Walzer's Rule:** If you get your hands dirty for the public good, you must acknowledge the stain and feel the weight of it.
  *   **The Violation:** The mayor in your example is refusing the *remainder*. She is treating the stain as a **currency** rather than a **debt**. Walzer would argue that once a politician uses their dirty hands as a shield against criticism, they have ceased to be a "dirty hands" politician and have simply become **corrupt**.

  ### 2. What Should We Call It?

  Since there is no standard term, the political ethics community often uses descriptive phrases. If you want to coin a term that would stick, the most accurate is:

  **"The Dirty Hands License"**
  This captures the exact mechanism: using the *necessity* of the first act to purchase a *license* for the second.

  Alternatively, you could call it the **"Moral Sunk Cost Fallacy."**
  *   *Logic:* "I have already paid the moral cost (the dump), so I might as well reap the benefits (tax revenue/condos) without worrying about additional moral expenses."
  *   It treats moral integrity like a budget that is already overdrawn, so spending more doesn't matter.

  Another strong candidate is **"Ethical Nihilism via Contamination."** This highlights that the agent is arguing that because they are contaminated, purity is impossible, so they might as well embrace the contamination.

  ### 3. How to Distinguish It from Hypocrisy

  This is the crux of your question. The distinction lies in **what they claim about their own virtue.**

  **Hypocrisy** is claiming to be **clean** while acting **dirty**.
  *   *The Hypocrite:* "I would never displace residents for profit! (While secretly doing exactly that)."
  *   *The Charge:* "You are lying about your standards."

  **The Dirty Hands License** is claiming to be **dirty** to act **dirtier**.
  *   *The License-Holder:* "I am already compromised by the dump, so I cannot afford the luxury of purity regarding the condos."
  *   *The Charge:* "You are lying about the *necessity* of the sin."

  **The Key Difference:**
  *   **Hypocrisy** tries to hide the vice behind a mask of virtue.
  *   **The Dirty Hands License** tries to hide a *new* vice behind the shadow of an *old*, admitted vice.

  The hypocrisy charge fails here because the mayor is *admitting* to the first wrong. She isn't pretending to be pure. The correct charge is not "You are a hypocrite," but rather **"You are a cynic."**

  *   **Hypocrisy** preserves the moral standard publicly while violating it privately.
  *   **Cynicism (this pattern)** devalues the moral standard publicly to justify private gain.

  ### Summary for your argument
  If you are debating this, the strongest philosophical rebuttal is to invoke **Walzer's Condition of Guilt**.

  You can say:
  > "This isn't a Dirty Hands scenario; it's a **Dirty Hands License**. Michael Walzer established that the only way to morally survive a necessary evil is to accept the guilt as a permanent debt. By using that debt as currency to purchase further unnecessary evils, the Mayor isn't engaging in tragic leadership; she is engaging in **moral bankruptcy**. Hypocrisy claims purity to hide corruption; this claims corruption to excuse greed."

  This draws the line clearly: Dirty Hands requires **tragedy** (I must do this and I hate it); this pattern requires **transaction** (I did this, so I can do that).
