prompt: |-
  I'm a novelist writing a counterfactual alternate-history novel in which Hitler dies in early 1923, before the events of November that year reshape the party around him. My narrative problem is deciding how much of what follows is structurally determined — would something recognizably like the Nazi movement (a mass, antisemitic, anti-Weimar, paramilitarized party that eventually takes power) have emerged regardless — versus how much rides on Hitler's specific personal properties: his oratory, the coherence of his ideology, and the cult of personality that made the party more than the sum of its street fighters.

  Act as a professional philosopher of history with expertise in counterfactual method and the "great man" versus structural explanation debate. Reason carefully and step by step. First, do a short brainstorming pass: list the main structural factors (the Versailles settlement, the 1923 hyperinflation, Weimar's institutional weaknesses, the pre-existing antisemitic milieu, the fragmentation of the left, and the elite willingness to bankroll the far right) alongside the main agential factors specific to Hitler, and for each note how robust it is to the removal of a single individual.

  Then write an essay that weighs the two explanatory frameworks for this specific case and reaches a defended conclusion: was the Nazi outcome robust to Hitler's absence, or did it require him? Crucially, give the verdict at the level of detail that matters for my plot — treat a mass movement, a seizure of power, and a genocide as three separate outcomes, and say for each whether it was "inevitable" or a "butterfly." Justify the verdict and state explicitly at what level of granularity the counterfactual becomes sensitive, so I can decide how determined to make the book feel.
reasoning: |-
