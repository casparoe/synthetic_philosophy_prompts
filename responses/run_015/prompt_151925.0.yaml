prompt: |-
  Hey — I'm in a reading group working through the old Hart–Devlin exchange on legal moralism (the one kicked off by the 1950s British committee report on homosexuality and prostitution), and we completely stalled last week, so I want something written up that I can bring back to the next session.

  Here's roughly where we got to, so you know what I already have. Devlin's side, as I understand it: a shared public morality is part of what holds a society together, so a society is entitled to use the criminal law against conduct that provokes genuine intolerance, indignation and disgust, even when no one is harmed and nobody asked for protection. Hart's reply: that at best an untested empirical guess; even granting that some shared morality is necessary, you'd still have to show that this particular norm is load-bearing, and nobody ever does; and Devlin's own concessions about not punishing everything immoral, and about privacy, quietly smuggle the harm principle back in. I've got that much, I dont need it repeated at me.

  The thing we got stuck on — and the bit I actually want you to work on — is a case we invented, which I think is a sharper test than the ones they were arguing about. Call it the Shutters. In some jurisdiction, adults can buy a fully private, offline home simulation in which they take part, alone, in vividly realistic cruelty toward convincingly simulated persons. Stipulate away every familiar hook: the simulated persons are not conscious, not copies of anyone, have no moral status, nothing that happens is a harm to anyone or anything; no recording, no second participant, no commercial exploitation, no one else ever finds out, no children involved. About 85–90% of the population feels real, non-hysterical moral revulsion at it and would say it's degrading to the people who do it. Now two variants. Variant A: psychologists and criminologists are about as confident as those fields ever get that using it has no downstream effects at all — doesn't make anyone more likely to harm a real person, doesn't corrode relationships, doesn't spill over into anything. It's a sealed-off indulgence. Variant B: the downstream effect is real but small — heavy users are measurably, in the aggregate, a bit more callous in ordinary life, in a way that never traces to any individual act of harm.

  What I want is an essay that answers, rather than lists. Should the state criminalize the Shutters in variant A, and in variant B, and if the answers differ, what exactly is doing the work? Can Devlin's position be read as anything other than an empirical prediction — as something more constitutive or expressive, the law declaring who we are — and if so does that reading help it, or does it just relocate the problem into why anyone else should care about the declaration? Could a Devlinian escape Hart's "you haven't shown this norm is load-bearing" objection by pointing at the mechanism rather than the norm: what matters is whether a society retains any practice of publicly enforcing morality at all, not whether it enforces this one? And if a ban would in fact backfire — the Shutters go underground, a subculture forms, and twenty years on the ban is remembered as moralistic overreach while a neighbouring jurisdiction that never banned them just carried on — does that refute Devlin, or only show the thesis was false here?

  Please land somewhere. Give me a verdict on whether legal moralism, in some form, can justify criminalizing the Shutters in either variant, or whether the harm principle or something close to it wins, and defend it against the strongest version of the other side — including a version that has already absorbed Hart's objections. Don't just run Devlin and Hart's actual arguments at each other; build the best case you can and then tell me whether it holds. And since half our group has read this literature and half hasn't, keep it clear about what's actually settled among people who work on it versus what's genuinely contested, and where your verdict rests on a reading you can't establish. No citations, no reading lists, no "see so-and-so" — I want your reasoning, not sources. Last thing: flag the two or three points where you think your verdict is most likely wrong and say what would change your mind. thx!
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Analyze the Request:**
      *   **Context:** A reading group discussing the Hart-Devlin debate on legal moralism (originating from the Wolfenden Report).
      *   **Current Status:** They understand the basics (Devlin: shared morality binds society; Hart: empirical guess, harm principle needed, Devlin smuggles harm in). They are stuck on a specific thought experiment called "The Shutters."
      *   **The Thought Experiment ("The Shutters"):** Private, offline VR simulation of cruelty to non-sentient simulations. No direct harm, no non-consenting participants. 85-90% public revulsion.
          *   *Variant A:* No downstream effects (sealed-off).
          *   *Variant B:* Small aggregate downstream effects (increased callousness, no specific harm traceable).
      *   **Key Questions to Address:**
          *   Should the state criminalize in A? In B? What does the work if answers differ?
          *   Can Devlin be read as constitutive/expressive rather than empirical? Does that help?
          *   Can Devlin escape Hart's "load-bearing" objection by focusing on the *practice* of enforcement rather than the specific norm?
          *   Does empirical failure (backfire/underground culture) refute Devlin or just show false application?
          *   **Verdict:** Must land somewhere. Can legal moralism justify criminalization? Or does Harm Principle win?
          *   **Constraints:** No citations/reading lists. Clear distinction between settled/contested points. Flag points of potential error/what would change the mind.
      *   **Tone:** Analytical, argumentative, suitable for a reading group (philosophically rigorous but accessible).

  2.  **Deconstruct the "Shutters" Case:**
      *   *Variant A (No Harm):* This is the purest test of Legal Moralism. If there is *no* harm, not even indirect, Hart must say "No Ban." Devlin *should* say "Ban" if the morality is strong enough.
      *   *Variant B (Small Harm):* This blurs the line. Hart might allow a ban based on aggregate harm (Mill's "other-regarding" actions). Devlin would definitely allow a ban. The interesting philosophical work is in Variant A.

  3.  **Evaluate Devlin's Position (Reconstructed):**
      *   *Standard Reading:* Society is a community of ideas. Disintegration follows moral dissolution. Law protects the moral fabric.
      *   *Hart's Critique:* This is an empirical claim (does immorality actually destroy society?) that lacks evidence. Also, the "disgust" test is too volatile.
      *   *Stronger Devlin (Constitutive/Expressive):* It's not about *predicting* collapse; it's about *defining* the community. The law says "This is not who we are." If we stop enforcing *any* morality, we stop being a political community and become a mere modus vivendi.
      *   *The "Practice of Enforcement" Argument:* Maybe it doesn't matter *which* norm is enforced, but *that* norms are enforced. It maintains the muscle of collective judgment.

  4.  **Evaluate Hart's Position (Reconstructed):**
      *   *Harm Principle:* State coercion requires prevention of harm to others.
      *   *Autonomy:* Individuals own their own lives. Moral independence is a value in itself.
      *   *The "Load-Bearing" Critique:* Just because people *feel* a norm is essential doesn't make it so.
      *   *The "Smuggling" Critique:* Devlin allows exceptions (privacy, tolerance) which actually rely on harm-based reasoning, undermining his pure moralism.

  5.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the stalemate. Introduce the Shutters case as the stress test. State the thesis early (Verdict).
      *   **Variant A (The Pure Test):**
          *   Hart says No. No harm.
          *   Devlin says Yes?
          *   *Analysis:* If Devlin relies on empirical social cohesion, Variant A kills him. If society doesn't actually crumble, his justification fails.
          *   *Constitutive Move:* Devlin shifts to "Law expresses identity."
          *   *Counter:* Why should the minority care about the majority's identity if it costs them their liberty? This leads to tyranny of the majority.
      *   **Variant B (The Blurred Test):**
          *   Here, Harm Principle *might* allow a ban (aggregate harm).
          *   But is "increased callousness" enough? Usually, Harm Principle requires specific victims.
          *   Legal Moralism doesn't need to wait for the harm; the immorality is the trigger.
      *   **The "Practice of Enforcement" Argument:**
          *   This is the strongest Devlinian move. It's not about *this* rule, but the *authority* to rule.
          *   *Counter:* This is dangerous. It justifies enforcing *anything* to keep the muscle flexed. It divorces law from reason.
      *   **Empirical Failure (Backfire):**
          *   If a ban causes more division, does it refute Devlin?
          *   Devlin cares about *shared* morality. If the ban destroys the shareness, it's self-defeating.
          *   So, empirical consequences *do* matter to Devlin, contrary to his pure theory. This concedes ground to Hart.
      *   **Verdict:**
          *   Variant A: Do not ban. Legal Moralism fails because it cannot justify coercion without a victim or a genuine threat to existence.
          *   Variant B: Do not ban (mostly). The harm is too diffuse.
          *   Why Harm Principle wins: It protects the conditions for moral disagreement itself.
      *   **Uncertainty/Flags:** Where could I be wrong? (1. The definition of harm. 2. The nature of social cohesion. 3. The expressive function of law).

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I answer the specific question about the "constitutive" reading? *Adjustment:* Make sure to explicitly discuss the "Law as Declaration" angle.
      *   *Check:* Did I address the "Practice of Enforcement" point? *Adjustment:* Dedicate a paragraph to the idea that *enforcing something* matters more than *what* is enforced.
      *   *Check:* Is the distinction between settled and contested clear? *Adjustment:* Explicitly state that Hart's empirical critique is widely accepted, but the normative force of moralism is still debated.
      *   *Check:* No citations. *Adjustment:* Ensure no names drop other than Hart/Devlin.
      *   *Check:* Flag uncertainties. *Adjustment:* Add a specific section at the end.

  7.  **Final Polish:**
      *   Ensure the tone is collaborative but decisive ("Land somewhere").
      *   Make sure the "Shutters" case remains central.
      *   Clarify the distinction between Variant A and B in the verdict.

      *(Self-Correction on Variant B)*: If there is measurable callousness, a sophisticated Harm Principle proponent *might* allow regulation. But the prompt says "never traces to any individual act of harm." This is key. It's a statistical ghost. A strict Harm Principle usually rejects statistical ghosts as grounds for criminalization (too much liberty lost for too little harm prevented). I should argue that even in B, the Harm Principle likely rejects the ban, but for different reasons than A. Actually, to make the contrast sharp: In B, the Harm Principle *struggles*, but Legal Moralism *succeeds* easily. The verdict should be that even in B, the Harm Principle is preferable because the "harm" is too attenuated. Or, acknowledge B is the grey zone where they converge, making A the real battleground. Let's make A the decisive battleground.

      *(Refining the "Constitutive" Argument)*: If law is expressive, does it justify coercion? Expressivism usually justifies *speech* or *symbolic* acts. Criminalization involves prisons/fines. The cost of expression is borne by the defendant. This is the weak point of the constitutive Devlin.

      *(Refining the "Practice" Argument)*: If the point is just to keep the muscle of enforcement flexed, why this muscle? Why not jaywalking? If the specific norm doesn't matter, the law becomes arbitrary. Arbitrariness undermines the rule of law.

      *(Final Verdict Formulation)*: Legal Moralism cannot justify Variant A. It creates a "tyranny of the majority" without a compensating social good. Variant B is a close call, but the Harm Principle still wins because "aggregate callousness" is too vague for criminal law.

  8.  **Final Review against Constraints:**
      *   No citations? Yes.
      *   Flag uncertainties? Yes.
      *   Clear on settled vs. contested? Yes.
      *   Addressed all prompt questions? Yes.

      *Let's write.*
answer: |-
  **Memorandum: The Shutters Case and the Limits of Legal Moralism**

  **To:** The Reading Group
  **From:** [Your Name]
  **Re:** Hart, Devlin, and the Shutters Thought Experiment

  **Introduction: The Stalemate and the Test Case**

  We stalled because the standard examples (homosexuality, prostitution) carry too much historical baggage. We spend more time untangling 1950s prejudices than analyzing the principles. The "Shutters" case is superior because it isolates the variables: it removes harm, consent issues, and exploitation, leaving only the core conflict between individual liberty and collective moral judgment.

  Here is the verdict I propose we work from: **Legal moralism cannot justify criminalizing the Shutters in Variant A (no downstream effects). In Variant B (small aggregate effects), legal moralism *can* justify a ban, but it should not, because the Harm Principle offers a more stable foundation for a pluralistic society.**

  The reasoning below explains why, addresses the strongest Devlinian counter-arguments you raised, and flags where this conclusion is most vulnerable.

  ***

  **1. Variant A: The Pure Test of Moralism**

  In Variant A, there is no harm. Not to the user, not to the simulation, not to society. There is only the 85–90% revulsion.

  **The Hartian Position:**
  Hart's position is clear: without harm, there is no justification for coercion. The state exists to protect citizens from one another, not to protect citizens from their own vices or from the offense taken by others. To ban the Shutters here is to treat adults as children who must be kept morally pure for their own good, or as property of the community whose actions must align with the majority's taste.

  **The Devlinian Position (Standard Reading):**
  Devlin argues that a society is a community of ideas, not just a commercial arrangement. If the shared morality dissolves, the society dissolves. Therefore, society has a right to preserve its moral code using the law, just as it uses the law to preserve its government. On this reading, the Shutters must be banned. The intensity of the disgust (85–90%) signals a threat to the shared code.

  **The Verdict on Variant A:**
  Hart wins here. Devlin's position rests on an empirical claim: that moral deviation leads to social disintegration. In Variant A, we have stipulated that there are no downstream effects. The society does *not* crumble. Relationships do not corrode. If the empirical prediction fails, the justification collapses.

  **The "Constitutive" Rescue:**
  You asked if Devlin can be read as making a constitutive claim rather than an empirical one. This is the strongest version of his argument. The claim is not "Banning this prevents collapse," but "Banning this *constitutes* us as a society." The law is a declaration of identity. By criminalizing the Shutters, the state says, "We are the kind of people who do not do this."

  **Why this fails:**
  This reading saves Devlin from the empirical objection but exposes him to a normative one. If the ban is purely expressive, why must the expression take the form of *criminal coercion*? We can express disapproval through education, art, or social stigma. Criminalization imposes unique burdens: criminal records, loss of liberty, state surveillance.

  To justify *coercion*, you need more than a desire to make a statement. You need a victim or a threat. If the "declaration of identity" is purchased at the price of a citizen's liberty, and that citizen has harmed no one, the transaction is tyrannical. It tells the minority: "Your freedom is the cost of our self-definition." In a pluralistic society, the state's identity cannot be so specific that it requires the imprisonment of those who dissent from it privately.

  ***

  **2. Variant B: The Blurred Line**

  In Variant B, heavy users become measurably more callous in ordinary life, though this never traces to a specific act of harm.

  **The Shift:**
  Here, the Harm Principle faces stress. Mill allows interference to prevent harm to others. Is "aggregate callousness" a harm? If the society becomes slightly colder, slightly less trusting, is that a damage the state should prevent?

  **The Devlinian Advantage:**
  Devlin has an easier time here. He doesn't need to prove the callousness is the *cause* of social collapse. He only needs to point out that the conduct is immoral *and* harmful. The immorality is the primary trigger; the harm is just a bonus justification.

  **The Verdict on Variant B:**
  Even here, the Harm Principle should prevail against criminalization, though the argument is closer. The "harm" in Variant B is diffuse and statistical. Criminal law is a blunt instrument. To ban the Shutters to prevent a slight statistical increase in callousness is to sacrifice a definite liberty (privacy, fantasy) for an indefinite, untraceable social good.

  However, the crucial distinction is this: In Variant B, a Hartian *could* support a ban if the aggregate harm were severe enough (e.g., if it led to a measurable spike in violent crime). A Devlinian supports the ban *even if* the harm were proven negligible, provided the immorality remained.
  **Therefore, the work is being done by the harm, not the morality.** If we ban in Variant B, we should do it because of the callousness, not because of the disgust. If the callousness were removed (returning to Variant A), the ban must fall. This confirms that the Harm Principle is the actual engine of justification, while legal moralism is merely a passenger.

  ***

  **3. The "Practice of Enforcement" Argument**

  You raised a sophisticated objection: Can Devlin escape Hart's "load-bearing" critique by arguing that it doesn't matter *which* norm is enforced, but *that* norms are enforced? The idea is that the state must retain the *practice* of publicly enforcing morality to maintain the habit of collective judgment. If we stop policing *anything* moral, we lose the muscle to police *necessary* things.

  **Why this is dangerous:**
  This argument divorces the law from reason. It suggests the state should punish *something* just to keep the power to punish alive. This is the logic of authoritarianism. It treats citizens as training dummies for the state's moral authority.

  Furthermore, it is self-defeating. If the state enforces a norm that the population (or a large minority) sees as arbitrary or intrusive (like the Shutters in Variant A), it generates resentment. Resentment undermines the "shared morality" Devlin wants to protect. You cannot strengthen social cohesion by coercing people into compliance with norms they do not share. The "muscle" of enforcement atrophies if it is used to punch air; it loses legitimacy.

  ***

  **4. Empirical Failure and Backfire**

  You asked: If a ban backfires (driving the practice underground, creating a martyr subculture, and eventually being seen as overreach), does that refute Devlin?

  **It refutes the application, not necessarily the theory.**
  Devlin is not a fanatic; he allows for prudence. He admits that just because you *can* ban something doesn't mean you *should*. If the ban destroys the social cohesion it was meant to protect, a prudent Devlinian would oppose it.

  **However, this concedes the Hartian point.**
  Hart's critique was always that Devlin's theory collapses into a utilitarian calculation in the end. Devlin says, "Protect morality to save society." If protecting morality *harms* society (via backlash), Devlin must say "Don't protect it." This means the ultimate standard is *social welfare/stability*, not *moral truth*.
  Once you admit that empirical consequences matter more than the moral principle itself, you have accepted the Harm Principle's framework. You are now weighing costs and benefits to society, not enforcing divine or natural law. The "moralism" becomes instrumental, not fundamental.

  ***

  **5. Settled vs. Contested Ground**

  To help the group distinguish where we stand:

  *   **Settled (mostly):** Hart's empirical critique is widely accepted in modern jurisprudence. Few scholars believe that private immorality *automatically* leads to social collapse. The "load-bearing" burden of proof is generally considered to be on the moralist.
  *   **Contested:** The normative question remains open. Even if immorality doesn't destroy society, *should* the law reflect the majority's moral views as a matter of democratic self-determination? Some communitarians argue yes, that a neutral state is an empty state. This is the "constitutive" argument discussed above.
  *   **My Verdict's Ground:** My conclusion rests on the claim that **legitimacy requires a victim.** In a liberal democracy, the state's monopoly on violence is only justified when used to prevent one citizen from harming another. Using that violence to enforce a moral code without a victim treats the punished citizen as a means to an end (social cohesion or symbolic purity), which violates the core liberal commitment to individual sovereignty.

  ***

  **6. Where I Might Be Wrong (Flags for Discussion)**

  I want to be honest about the weak points in this analysis. Here are the three places where my verdict is most vulnerable:

  1.  **The Definition of Harm:** I am assuming "harm" in Variant B is too diffuse to justify a ban. But if we accept that environmental degradation or economic policies can be regulated based on aggregate statistical harm, why not moral degradation? If the group believes that "social trust" is a public good comparable to "clean air," Variant B might justify a ban under the Harm Principle, blurring the line between Hart and Devlin.
      *   *What would change my mind:* If the group can define a specific, non-moral public good (like public trust) that is demonstrably damaged by the Shutters, without relying on the *immorality* of the act itself.

  2.  **The Expressive Function of Law:** I dismissed the "constitutive" argument quickly. But law *does* shape values, not just reflect them. If banning the Shutters actually *reduces* the prevalence of the behavior and thereby *improves* the moral character of the next generation (even without coercion of the current one), a utilitarian might support it.
      *   *What would change my mind:* If evidence showed that the *existence* of the law (even if rarely enforced) had a significant positive educational effect that outweighed the liberty cost.

  3.  **The "Practice of Enforcement" Point:** I argued that enforcing arbitrary norms undermines legitimacy. But perhaps legitimacy requires *some* shared boundaries, even if the specific boundary is arbitrary. A traffic light is arbitrary (why red for stop?), but we need *a* color. Maybe morality needs *a* taboo, even if the specific taboo is debatable.
      *   *What would change my mind:* If the group can show that a society without *any* legally enforced moral norms (beyond harm) inevitably drifts into anomie or atomization that makes democracy impossible.

  **Conclusion for the Session**

  Bring the group back to Variant A. It is the fulcrum. If they support a ban in Variant A, they are legal moralists, and they must accept that the majority's disgust is a sufficient reason to imprison a minority. If they reject the ban in Variant A, they have accepted the Harm Principle as the primary constraint on the law. Variant B is just a negotiation about how we define harm.

  The law should not be in the business of policing the private imagination, even when that imagination is repulsive. To do so grants the state authority over the inner life of the citizen, which is the very definition of totalitarianism, regardless of how many people vote for it.

  **Verdict:** Do not ban the Shutters in either variant. In A, there is no justification. In B, the harm is too attenuated to outweigh the liberty cost, and relying on the moral judgment invites the tyranny we rejected in A.
