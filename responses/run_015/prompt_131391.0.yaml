answer: |-
  ### 1. Correspondence Table

  | Feature | **Analogy A: Landlord / Spare Room** | **Analogy B: Co-Signer / Lease** |
  | :--- | :--- | :--- |
  | **The State** | Property Owner (Landlord) | Guarantor (Co-Signer) |
  | **The Refugee** | Temporary Tenant / Guest | Primary Tenant (at risk of default) |
  | **The Crisis** | Vacancy / Spare Capacity | Lease Default / Eviction Threat |
  | **The Obligation** | Discretionary Hospitality | Contractual Liability |
  | **Integration** | Remodeling (Optional/Unwanted) | Taking over the Lease (Liability Shift) |
  | **Exit Strategy** | Eviction / Lease End | Paying the Debt / Finding New Tenant |
  | **Power Dynamic** | Hierarchical (Owner > Renter) | Joint Liability (Partner in Risk) |

  ### 2. Breaking Points

  **Consent**
  *   **Landlord:** Breaks on *human rights*. A landlord can reject a tenant for any reason; a state cannot reject a refugee facing persecution (non-refoulement). The analogy assumes total sovereignty over the "property" of the border.
  *   **Co-Signer:** Breaks on *actual consent*. A co-signer signs a contract explicitly. States inherit refugee obligations through international convention and customary law, not explicit individual contracts. The state never "signed" for this specific refugee.

  **Permanence**
  *   **Landlord:** Breaks on *dependency*. A spare room implies a short stay. Refugees often cannot return for decades. Treating a 20-year displacement as a "weekend stay" creates legal limbo (e.g., temporary protected status that never resolves).
  *   **Co-Signer:** Breaks on *scope*. A co-signer is liable for the *rent*, not necessarily the *lifestyle*. If the "rent" is safety, and safety is impossible at home, the liability becomes permanent. This analogy inadvertently argues for citizenship, not temporary shelter.

  **Exit Costs**
  *   **Landlord:** Low exit cost. Eviction is a bureaucratic process. This underestimates the mortal danger of return (refoulement).
  *   **Co-Signer:** High exit cost. You cannot easily void a co-signature. This accurately reflects the political and moral difficulty of deporting settled refugees, but overestimates the legal bindingness.

  ### 3. Moral Ownership

  *   **The Landlord Analogy** imports the assumption that **citizens own the moral space.** The territory is private property; refugees are interlopers. Hospitality is a gift, not a duty. It frames the refugee as a burden on the asset.
  *   **The Co-Signer Analogy** imports the assumption that **safety is a joint venture.** The state is entangled in the global order that produced the instability. It frames the refugee as a partner in a shared liability structure. The "moral space" is a common obligation, not private property.

  ### 4. The Stand: Does the Co-Signer Analogy Hold?

  **The Co-Signer analogy strengthens the case for permanent settlement, but it collapses on the consent objection.**

  If you accept the Co-Signer premise, you logically arrive at permanent integration. Why? Because a co-signer is liable until the debt is paid. If the "debt" is safety, and the refugee's home country remains unsafe indefinitely, the state's liability never expires. You cannot evict a co-signer just because the lease is inconvenient. Therefore, this analogy is a Trojan Horse for open borders or citizenship—it makes "temporary" protection conceptually impossible if the danger is permanent.

  However, the analogy falls apart because **states never consented to joint liability.** Unlike a financial co-signer who calculates risk before signing, states are bound by laws they didn't draft for specific individuals they didn't vet. To treat the state as a co-signer is to erase sovereignty. It creates a moral obligation that lacks a political mechanism for enforcement or limitation.

  **Verdict:** The Co-Signer analogy is morally superior to the Landlord analogy (it acknowledges duty), but it is policy-suicide for anyone arguing for *temporary* protection. It proves too much.

  ### 5. The Survivor: The Emergency Room

  Both the Landlord (too cruel/discretionary) and the Co-Signer (too binding/permanent) fail to capture **temporary protection with no attachment.**

  The surviving analogy is **The Emergency Room (Triage Unit).**

  **Correspondence:**
  *   **The State:** The Hospital (bound by EMTALA-like duty to stabilize).
  *   **The Refugee:** The Patient in acute crisis.
  *   **The Policy:** Emergency Stabilization.
  *   **The Exit:** Discharge when stable.
  *   **The Limit:** No entitlement to long-term care or residency in the ward.

  **Why it survives:**
  1.  **Consent:** Hospitals cannot turn away dying patients (matching *non-refoulement*), regardless of consent.
  2.  **Permanence:** The duty is to *stabilize*, not to *cure* chronic conditions or provide a home. Once the acute danger (bleeding) stops, the obligation shifts.
  3.  **Exit Costs:** Discharging a patient is normal; dumping a dying patient is malpractice. This captures the nuance: you can send them back when safe, but not when dangerous.
  4.  **Moral Ownership:** It treats safety as a **public utility**, not private property (Landlord) or a shared debt (Co-Signer).

  ### 6. What This Licenses

  Adopting the **Emergency Room** analogy licenses a specific, rigorous policy framework that the other two obscure:

  1.  **Immediate Asylum, Strict Time Limits:** You must take them in during the acute phase (war, persecution). But the "stay" is legally tied to the "acute condition."
  2.  **No Automatic Path to Citizenship:** An ER patient does not get to move into the hospital apartment. Integration is not the goal; survival is.
  3.  **Active Repatriation Mandate:** Just as a hospital discharges patients to recovery centers, the state must actively fund and work toward making the home country safe enough for return. Temporary protection becomes a failure state if it becomes permanent.
  4.  **No "Illegal" Presence:** You cannot arrest a patient for being in the ER. This licenses decriminalizing the act of seeking asylum while criminalizing the act of overstaying the "medical" necessity.

  **Final Call:** Discard the Landlord (it's inhumane) and the Co-Signer (it's a fiction that mandates permanence). The **Emergency Room** is the only analogy that sustains a duty to save lives without implying a duty to adopt strangers forever. It licenses **robust temporary protection with enforced repatriation.**
