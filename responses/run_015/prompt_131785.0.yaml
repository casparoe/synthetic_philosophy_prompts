  ### 1. The Principles

  Based on the consistency of verdicts 1 through 8, your friend is operating with two complementary principles. The first governs the *possession* of the disposition (metaphysical grounding), and the second governs the *attribution* of the disposition (causal role).

  **Principle 1: The Intrinsic Base Sovereignty (IBS)**
  *   **Statement:** An object $x$ possesses disposition $D$ at time $t$ if and only if $x$ possesses the total intrinsic categorical base $B$ at $t$ that is type-identified with $D$.
  *   **Computational Rule:**
      1.  Identify the intrinsic properties of $x$ at $t$.
      2.  If $B$ is present, $x$ has $D$.
      3.  **Supplementary Clause (Extrinsic Irrelevance):** The presence or absence of extrinsic factors (masks, finks, mimics) does not alter the possession of $B$. (Handles Cases 1, 2, 3, 4, 7).
      4.  **Supplementary Clause (Intrinsic Sensitivity):** If the intrinsic properties themselves change such that $B$ is altered or neutralized by another intrinsic property, $D$ is lost. (Handles Case 5).

  **Principle 2: The Explanatory Primacy Condition (EPC)**
  *   **Statement:** An object $x$ is correctly attributed disposition $D$ if and only if, in the nearest possible worlds where the stimulus $S$ occurs, the manifestation $M$ occurs *because of* $x$'s intrinsic base $B$.
  *   **Computational Rule:**
      1.  Select the nearest possible worlds where $S$ occurs.
      2.  If $M$ occurs in these worlds, determine the salient cause.
      3.  If $B$ is the salient cause, $x$ has $D$.
      4.  **Supplementary Clause (Mask Failure):** If extrinsic masks prevent $M$ in the actual world, check worlds where the mask fails. If $B$ explains $M$ there, $x$ has $D$. (Handles Cases 2, 8).
      5.  **Supplementary Clause (Mimic Exclusion):** If $M$ occurs but is explained by an extrinsic device rather than $B$, $x$ does not have $D$. (Handles Cases 3, 4).

  ### 2. Predictions for Cases A through D

  | Case | IBS Prediction | EPC Prediction | Divergence? |
  | :--- | :--- | :--- | :--- |
  | **A. Chance Fink** | **Disposed.** The wire is live (Base present). The cutout is extrinsic. | **Disposed.** In the 10% of nearest worlds where the cutout fails, the wire's base explains the conduction. | No |
  | **B. Chance Reverse Fink** | **Not Disposed.** The wire is not live (Base absent). | **Not Disposed.** In worlds where conduction occurs, the device explains it, not the wire's base. | No |
  | **C. Annealing Glass** | **Not Fragile.** The "total intrinsic state" includes the healing mechanism. This intrinsic property neutralizes the breaking base (parallel to Wet Match). | **Not Fragile.** In the nearest worlds where the vase is struck, it does not break (it heals). Brittleness explains nothing. | No |
  | **D. Thermostatic Cutout** | **Disposed.** The wire is live (Base present). The cutout is extrinsic, even if its trigger condition is currently met. | **Disposed.** In the nearest worlds where the cutout fails (or is absent), the wire explains the conduction. (Parallel to Case 1). | No |

  *Note on Case D:* This verdict assumes the cutout acts *upon stimulus* (touch) conditional on temperature, consistent with Case 1. If the cutout acts *upon temperature* alone, the wire could not be live at $t$ (contradicting the setup), but given the "live at $t$" constraint, it functions as a deterministic fink.

  ### 3. Best Guess at Her Verdicts

  I predict she will answer as follows, relying primarily on the **Explanatory Primacy Condition (EPC)** as the deeper rationale, with IBS serving as the metaphysical ground.

  *   **A (Chance Fink): Yes, Disposed.**
      *   *Reason:* Matches Case 1 (Fink) and Case 8 (Probabilistic Mask). The intrinsic base is present and does the explanatory work in the worlds where the fink fails.
  *   **B (Chance Reverse Fink): No, Not Disposed.**
      *   *Reason:* Matches Case 3 (Reverse Fink). The intrinsic base is missing at $t$. The device does the explanatory work.
  *   **C (Annealing Glass): No, Not Fragile.**
      *   *Reason:* This is the critical inference. While Case 2 (Extrinsic Mask) yields "Fragile," Case 5 (Wet Match) establishes that *intrinsic* changes remove dispositions. Since the healing mechanism is *intrinsic* (unlike the damping field in Case 2), it alters the total intrinsic base. Furthermore, under EPC, brittleness explains no breaks because none persist.
  *   **D (Thermostatic Cutout): Yes, Disposed.**
      *   *Reason:* Matches Case 1. The satisfaction of the background condition (temperature) does not change the metaphysical category of the interferer from "extrinsic fink" to "intrinsic lack." The wire's base is still the explanatory ground in mask-failure worlds.

  ### 4. Load-Bearing vs. Inert Verdicts

  *   **Load-Bearing:**
      *   **Case 3 (Reverse Fink) & Case 4 (Mimic):** These rule out simple Conditional Analyses (which might count the reverse fink wire as disposed because it *would* conduct if touched). They establish that extrinsic *enablers* do not confer dispositions.
      *   **Case 5 (Wet Match):** This rules out pure Microstructuralism (the view that disposition = specific atomic arrangement regardless of function). It establishes that intrinsic functional loss removes the disposition.
      *   **Case 8 (Probabilistic Mask):** This is the most load-bearing. Her explicit comment about "explanatory work" reveals she is not just counting bases, but tracking *causal salience*. It confirms the EPC.
  *   **Inert:**
      *   **Case 6 (No Stimulus):** This is consistent with almost any realist theory of dispositions (dispositions need not manifest). It does no work in distinguishing between Fink/Mask theories.

  ### 5. Further Discriminating Case

  Principles IBS and EPC agree on cases A through D. To separate them, you need a case where the **Intrinsic Base is present** (satisfying IBS) but **does not provide the Explanation** (violating EPC).

