  *   **EPC Prediction:** **Not Disposed (regarding $B$).** In the nearest worlds where the match is struck, $B$ does not explain the lighting; $B^*$ does. $B$ is causally inert.
  *   **Interpretation:**
      *   If she says **Disposed**, she prioritizes **Intrinsic Base Sovereignty** (possession of the structure is sufficient).
      *   If she says **Not Disposed**, she prioritizes **Explanatory Primacy** (causal role is necessary).
      *   *Note:* Given her comment on Case 8 ("brittleness... does the explanatory work"), my money is on **Not Disposed**, confirming EPC as the dominant principle.
