      *   *Key Insight:* The "Wrongful Life" rejection is about *comparative harm to an individual*. Reparations often rely on *intergenerational transmission of entitlement* (inheritance model) or *group harm*. The contradiction dissolves if we see Reparations not as "Tort for Descendants" but as "Restitution of Stolen Estate."
