answer: |-
  This is a sharp observation. You have identified the precise friction point between **corrective justice** (tort), which is typically individualist and actualist, and **historical rectification** (reparations), which is often collectivist and counterfactual. The tension turns on the **Non-Identity Problem** (famously articulated by Derek Parfit): if the wrongful act was a condition of the claimant's conception, the claimant cannot claim they are worse off than they would otherwise have been, because otherwise they would not be.

  Tort law generally capitulates to this metaphysical constraint (hence the rejection of "wrongful life"). Reparations practice generally legislates around it. Below is the reconstruction you requested, isolating the implicit theories and their practical consequences.

  ### 1. The Theory of Harm and the Relata of Comparison

  To make sense of reparations without collapsing into the "wrongful life" contradiction, the practice must reject the **Individual Comparative Account of Harm** that governs tort. In tort, harm is a delta between *Person A's actual state* and *Person A's counterfactual state*. Reparations practice cannot strictly presuppose this, because the counterfactual *Person A* does not exist.

  Instead, the practice relies on one of two theoretical structures. Your tentative carving identifies the candidates; here is how they function normatively:

  **A. The Lineage-as-Unit Theory (Most Compatible)**
  This theory treats the family line or dynasty as the continuous entity suffering the harm, rather than the specific biological organisms inhabiting it at any given time.
  *   **Presupposition:** It strictly presupposes that entitlements (wealth, status, opportunity) are property of the *lineage* that is temporarily held by individuals.
  *   **Metaphysical Weight:** Light. It does not require the lineage to be a metaphysical substance, only a normative unit of account for inheritance.
  *   **Fit:** This fits current practice best. When courts or commissions award damages to descendants, they are effectively treating the wealth gap as a debt owed to the *ancestral estate* that has been withheld across generations. The specific descendant is merely the current executor of that claim. This bypasses non-identity because the harm is to the *transmission mechanism*, not the specific recipient's existence.

  **B. The Corporate/Group Continuity Theory (Stronger Metaphysics)**
  This treats the people, tribe, or racialized group as a single trans-temporal entity.
  *   **Presupposition:** The group survives the replacement of its members. Harm to the group's status or wealth is harm to the entity, payable to its current members as beneficiaries.
  *   **Fit:** This is often the rhetorical basis for indigenous land claims or tribal reparations. It is less common in individualized slavery reparations schemes, which tend to focus on lineage.

  **C. Distributional/Positional Theories (Metaphysically Lightest)**
  This compares *social positions* rather than persons.
  *   **Presupposition:** Harm attaches to the *occupation of a disadvantaged role* created by the injustice, regardless of who occupies it.
  *   **Fit:** This sits comfortably with the practice but is rarely the *stated* legal theory. If this were the explicit theory, payments would look like affirmative action or universal basic income targeted by class/status, not lineage-based checks.

  **Conclusion on Theory:** The existing practice is **underdetermined** between Lineage and Group Continuity, but it **quietly rules out** the strict Individual Comparative Account used in tort. It cannot have it both ways: it cannot claim the specific individual is harmed *in the tort sense* (comparative welfare loss) while relying on a counterfactual where that individual vanishes. It must implicitly shift the relata of comparison from "Individual vs. Counterfactual Individual" to "Current Lineage State vs. Counterfactual Lineage State."

  ### 2. Selecting the "Nearest World": Modality and Inevitability

  You ask how the practice chooses its counterfactual world, specifically regarding the "it would have happened anyway" objection.

  **The Selection Rule: Moral Ceteris Paribus**
  Reparations schemes do not select the *causally* nearest possible world; they select the *morally* nearest possible world.
  *   **Tort Modality:** Asks, "What would physically have happened if this specific act were removed?" (Causal proximity).
  *   **Reparations Modality:** Asks, "What would have happened if this *wrongful institution* were removed, holding background moral entitlements constant?"

  **The Inevitability Objection**
  When historians argue "slavery would have been replaced by serfdom or extreme wage exploitation anyway," they are making a claim about **structural determinism**.
  *   **Does rejecting this presuppose contested modality?** Yes and no. It does not require a libertarian view of free will. It requires a view of **causal specificity**. To defeat the claim, the "inevitability" argument must show that the *specific disparity* (e.g., the racialized wealth gap) would have occurred absent the *specific mechanism* (chattel slavery).
  *   **Stipulation vs. Metaphysics:** It is largely a normative stipulation. The practice stipulates that we are isolating the *wrongful* cause, not *all* causes. If a different oppression would have arisen, that is a separate wrong to be adjudicated separately. We do not excuse a murderer because someone else might have killed the victim later.
  *   **Defeating the Claim:** For inevitability to defeat a claim, it must demonstrate that the *distributional outcome* is independent of the *institutional mechanism*. If the counterfactual world without slavery still produces a population statistically identical in wealth and status to the actual world (due to other racist structures), the causal link between *this* institution and *this* harm is broken. However, most reparations theory argues that the specific *form* of the injustice (e.g., asset stripping vs. wage suppression) dictates the specific *form* of the remedy.

  ### 3. Practical Upshot: The Alternative Scheme and the Tort Scruple

  You propose a scheme: *Pay each claimant the gap between her present position and the position a same-sized but differently composed population would have occupied.*

  **Is this more defensible under tort metaphysics?**
  **No.** In fact, it is *less* compatible with tort metaphysics, though it avoids the non-identity problem.
  *   **Tort Metaphysics:** Requires a specific plaintiff who was specifically wronged. Your scheme admits that *this* plaintiff might not have existed in the counterfactual ("differently composed population").
  *   **The Shift:** Your scheme moves from **Corrective Justice** (repairing a wrong between A and B) to **Distributive Justice** (adjusting social outcomes). It treats the payment not as damages for harm suffered by the individual, but as a dividend for living in a tainted distribution.
  *   **Defensibility:** It is more defensible under *political philosophy* (specifically luck egalitarianism) because it sidesteps the non-identity problem entirely. It doesn't matter if *you* wouldn't exist; it matters that *someone* in your structural position is worse off than they should be.

  **If we took the Tort-Side Scruple Seriously:**
  If we strictly applied the "Wrongful Life" constraint (no comparing existence to non-existence; harm must be to a specific existing person relative to their own counterfactual), the following changes would be required:

  1.  **Abandonment of Individual Descendant Claims:** You could not pay descendants for the harm of *slavery/dispossession* itself, because the "but-for" test fails.
  2.  **Restriction to Living Victims:** Compensation would be restricted to those alive during the injustice (which, for historical cases, is no one).
  3.  **Reframing as Inheritance of Unadjudicated Claims:** The only way to keep individual payments is to argue the *ancestor* had a valid tort claim that was never paid, and it passed down like a bond. This works legally (estates inherit debts) but fails if the ancestor was never identified or if statutes of limitation apply.
  4.  **Shift to Forward-Looking Redistribution:** The payment is no longer "reparations" (backward-looking repair) but "investment" (forward-looking equity). This changes the justification from "you are owed this" to "society needs this to function."
  5.  **Community Payment:** If the "Group Continuity" theory is accepted, payments go to the *community trust*, not individuals. The community is the victim that survived; the individuals are just current beneficiaries. This is the model used in some Indigenous land claims.

  **Where the Practice is Underdetermined vs. Exclusionary:**
  *   **Underdetermined:** The practice does not decide between "Lineage" and "Group" theories. It uses the language of individuals (checks to people) but the logic of groups (eligibility by ancestry).
  *   **Exclusionary:** It **rules out** the strict individualist counterfactualism of tort law. It implicitly asserts that historical justice operates on a different temporal logic than contemporary negligence. It asserts that **identity is not a barrier to entitlement** when the entitlement is derived from a violated right of an predecessor.

  **Summary:** The tort side treats the person as a **metaphysical atom** whose harm must be measured against their own possible states. The reparations side treats the person as a **node in a historical network**, where harm is measured against the integrity of the network. Your proposed alternative scheme admits the network view but tries to pay the nodes; it is philosophically cleaner regarding non-identity, but it surrenders the "repair" narrative for a "redistribution" narrative. To maintain the "repair" narrative without contradicting tort metaphysics, you must treat the *community* or *lineage* as the true plaintiff.
