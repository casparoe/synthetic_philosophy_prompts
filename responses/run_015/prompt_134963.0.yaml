  ### The "Torn" Cases

  **(a) The Self-Referential Model.**
  *   **Scenario:** The register storing the model is inside the system; reading it changes it.
  *   **Principle Verdict:** **Real, but Unidentifiable.**
  *   **Reasoning:** Existence is secured if there is *some* physically possible intervention (perhaps a "freeze-frame" external probe) that could read the register without resetting it. If the laws of physics *forbid* reading the register without resetting it (a la Quantum No-Cloning), then the register's specific content is a **Gauge** relative to the future. The *capacity* to model is real; the *current content* is not a stable ontological fixture if it cannot be held fixed across any physically possible duration.
  *   **Does the question move?** No. The ontology is the set of variables with leverage. If the variable self-destroys upon measurement, it has leverage (it determines the post-measurement state), so it is real. You just can't pin it down.

  **(b) The Multiscale Case.**
  *   **Scenario:** Coarse (3 vars, nonlinear) vs. Fine (5 vars, linear). Both exact at their resolution.
  *   **Principle Verdict:** **Both Real, relative to the space of interventions.**
  *   **Reasoning:**
      *   Are there physically possible interventions at the fine scale? If yes (e.g., hitting individual particles), the 5 variables are real.
      *   Are there physically possible interventions at the coarse scale? If yes (e.g., moving the piston), the 3 variables are real.
      *   **Is there a unique finest grain?** Only if there is a limit to physically possible interventions. If physics is continuous down to infinity, there is no "finest" ontology, only a hierarchy of real variables dependent on the resolution of the intervention. If physics is discrete (Planck scale), the finest grain is the set of variables leverageable at that scale.
      *   **Giving up?** No. Ontology is not monolithic; it is layered by causal leverage. The 3-variable ontology is an *effective* reality, the 5-variable is a *fundamental* reality. Both pass the Leverage test at their respective scales.

