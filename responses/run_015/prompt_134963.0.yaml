answer: |-
  Here is the principle, followed by the application, the necessary corrections to your intuitions, and the diagnostic case.

  ### The Principle: Counterfactual Causal Leverage

  To separate "what is there" from "what we can know," we need a two-part criterion. The first part defines **Existence** (Metaphysics); the second defines **Identifiability** (Epistemology).

  **Part 1 (Existence):** A variable $H$ is ontologically real at time $t$ if and only if there exists at least one **physically possible intervention** at $t$ (even if not in your channel menu) that sets $H$ to distinct values, resulting in **divergent future trajectories** of the accessible variables.
  *   *If no such intervention exists:* $H$ is a gauge artifact or representational redundancy (Case 1, 3, 6).
  *   *If such an intervention exists:* $H$ is real, regardless of whether you can perform the intervention (Case 4, 5, 7, 10).

  **Part 2 (Identifiability):** A real variable $H$ is identifiable if and only if the actual history of channel data restricts the possible values of $H$ to a singleton (or a trivial equivalence class).
  *   *If data restricts $H$:* You know what it is (Case 4, 5).
  *   *If data does not restrict $H$:* It is real but unknown (Case 6, 7, 10).

  **The Grad Student was half-right:** Separating Existence from Identifiability saves Case 7 (Real but Unknown) from Case 2 (Not Real). But it does not save Case 6. As you will see, the principle forces a hard choice there.

  ---

  ### Application to Your Cases

  **1. Isomorphism/Relabeling.**
  *   **Verdict:** Same ontology.
  *   **Principle:** Distinct values of the "permuted" variable do not yield divergent accessible trajectories under any intervention; they are just coordinate changes. **Gauge.** Matches your verdict.

  **2. Deterministic Function/Epiphenomenal.**
  *   **Verdict:** Not real.
  *   **Principle:** Setting $H$ to different values is impossible (it is determined by others) or yields no divergence in observables (nothing depends on it). **Gauge.** Matches your verdict.

  **3. Underdetermined/Gauge.**
  *   **Verdict:** Not real.
  *   **Principle:** You can set $H$ to anything, and nothing changes. No causal leverage. **Gauge.** Matches your verdict.

  **4. Gas Microstates.**
  *   **Verdict:** Real.
  *   **Principle:** Interventions exist (e.g., a Maxwell's Demon probe, even if you can't build one) that would distinguish microstates via fluctuations. The *physical possibility* of the intervention secures existence, even if the *channel menu* excludes it. Matches your verdict.

  **5. Bookkeeping/Conservation.**
  *   **Verdict:** Real.
  *   **Principle:** Intervening on the visible energy *forces* the hidden carrier to change to satisfy conservation. The hidden variable constrains the *possible* trajectories of the visible variables. **Leverage exists.** Matches your verdict.

  **6. Shadow Sector/Compensating Parameter.**
  *   **Verdict:** *Correction Required.* You said: "Real disagreement... won't say 'no difference'."
  *   **Principle:** If the influence is *exactly* cancelled for *every* physically possible intervention, then by Part 1, **$H$ is not real.** It is a "Dark Gauge."
  *   **Why:** If no intervention, no matter how exotic, can make the world look different based on $H$'s value, then $H$ makes no difference to the physical structure of the world, only to the mathematical description. To call it "real" is to posit an occult quality. You must accept that Case 6 is metaphysically indistinguishable from Case 3.

