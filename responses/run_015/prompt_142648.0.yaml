  **JOINT STATEMENT OF CONVERGENCE AND RESIDUAL DISAGREEMENT**
  **Regarding P. F. Strawson's *Freedom and Resentment* and the Compatibility of Determinism with Moral Responsibility**

  **I. Agreed Claims**

  1.  **Descriptive Accuracy of Reactive Attitudes:** Both camps affirm Strawson's central descriptive claim: reactive attitudes (resentment, gratitude, indignation, guilt) are empirically pervasive, psychologically deep-seated features of human interpersonal life that cannot be voluntarily discarded without profound psychological cost or social alienation.
  2.  **Determinism's Psychological Inefficacy:** Both camps agree that the theoretical acceptance of causal determinism does not, as a matter of empirical fact, cause reactive attitudes to disappear. Human agents continue to experience resentment and assign blame even when convinced that all events are causally necessitated.
  3.  **The Participant Stance:** Both camps accept Strawson's distinction between the "participant stance" (involvement in interpersonal relationships) and the "objective stance" (viewing an agent as a subject for treatment or management). We agree that a total adoption of the objective stance is incompatible with ordinary human community.
  4.  **Institutional Relevance:** Both camps acknowledge that large-scale penal and legal institutions constitute a critical testing ground for Strawson's framework. We agree that these institutions operate where personal relationships are absent or attenuated, requiring an account of how reactive attitudes translate from dyadic interactions to systemic structures.
  5.  **Normative Stakes:** Both camps agree that the ultimate goal of this inquiry is not merely to describe moral psychology but to determine whether our current practices of holding responsible are *justified*. We disagree on whether justification depends on metaphysical freedom or pragmatic coherence.

  **II. Precise Statements of Residual Disagreement**

  While we share the descriptive premises above, we diverge on the normative and metaphysical implications of those premises.

  *   **Practice-Naturalist Position:** We hold that reactive attitudes are irreducible, biologically evolved social practices that constitute the fabric of moral community. Asking whether these attitudes are "justified" by metaphysical freedom is a category error analogous to asking whether statistical mechanics undermines the reality of temperature. Moral responsibility is a local normative equilibrium maintained by relational expectations. Consequently, institutional penal practices are legitimate extensions of interpersonal accountability, requiring no metaphysical grounding beyond their functional role in sustaining social cooperation.
  *   **Normative-Cognitivist Position:** We hold that reactive attitudes operate as implicit cognitive-evaluative judgments that carry a commitment to a non-deterministic, agential source of action. While these attitudes are empirically pervasive, their persistence does not guarantee their justification. We argue that "moral thermalization" occurs in large, anonymous societies, where reactive attitudes diffuse into institutional structures, decoupling Strawson's participant attitude from its relational anchor. Determinism reveals retributive attitudes as unjustified; the appropriate response is a disciplined restructuring into accountability practices that preserve respect and safety without relying on metaphysically loaded blame.

  **III. Table of Cruxes and Predictive Outcomes**

  | Crux | Shared Bearing-Case / Conceptual Test | Practice-Naturalist Prediction | Normative-Cognitivist Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Metaphysical Content of Attitudes** | **The Educated Determinist:** A subject fully convinced of hard determinism continues to feel resentment after being wronged. Does this resentment entail a false belief in libertarian freedom? | **No.** The attitude is a non-cognitive behavioral disposition. The subject feels resentment as a social signal, not as a metaphysical claim. The attitude remains valid despite the subject's metaphysical beliefs. | **Yes.** The attitude entails a tacit commitment to "could have done otherwise." The subject is in a state of cognitive dissonance. The attitude is empirically present but normatively defective/unjustified. |
  | **2. Institutional Continuity vs. Thermalization** | **The Penal System:** A state prison where guards have no personal relationship with inmates. Is the blame administered here the same *kind* as interpersonal resentment? | **Same Kind.** Institutions are scaled-up mechanisms for managing interpersonal expectations. The "objective" procedures are merely tools to administer the "participant" standards fairly. No fundamental ontological shift occurs. | **Different Kind.** Moral thermalization has occurred. The relational anchor is lost. Institutional sanctions are merely causal management (objective stance) masquerading as moral blame. They require decoupling from retributive language. |
  | **3. Viability of Reform** | **The Post-Deterministic Society:** A society that universally accepts determinism and attempts to replace blame with "accountability without retribution." | **Unstable/Impossible.** Removing the reactive attitudes undermines the participant stance itself. The society would collapse into either universal objective treatment (dehumanization) or revert to natural practices. | **Stable/Desirable.** Restructuring is possible. We can retain forward-looking accountability (safety, restitution) without backward-looking blame. This preserves respect while aligning practice with metaphysical truth. |

  Summary: The deepest crux separating the two camps is whether reactive attitudes are constitutive practices that generate their own normative validity or cognitive judgments that require metaphysical justification to remain justified.
