answer: |-
  Here is the runnable activity. It is designed to be tight, provocative, and mechanically simple enough to run on index cards, but structurally complex enough to trap both the CS and Philosophy intuitions in the way you described.

  # Activity Title: The Glass Box Protocol

  **Core Concept:** A modified Keynesian Beauty Contest where the act of submitting a "legible" strategy physically alters the world state *after* submission but *before* scoring. This forces the "Last-Look" dynamic: the Environment (Facilitator + Dice + Aggregate) sees your rule, reacts to it, and sets the target based on that reaction.

  **Materials:**
  *   28 Index Cards (2 per person, different colors if possible. Let's call them **Blue** and **Red**).
  *   1 Collection Box (opaque).
  *   1 d20 (or d6).
  *   Whiteboard + Markers (3 colors: Black, Red, Green).
  *   1 Coffee Voucher (the prize).

  **Grouping:**
  *   Keep all 14 as **Individual Agents**. Do not split teams. The isolation is necessary to feel the "agent vs. world" pressure.
  *   **You (Facilitator)** are the **Environment**. You are not a referee; you are a physical part of the scoring mechanism.

  ---

  ## The Rules (Write on Whiteboard)

  **Objective:** Submit a number $0–100$ on your **Blue Card**. The winner is closest to the **Target Number**.
  **Target Number:** $\frac{2}{3} \times \text{Average of All Submitted Numbers}$.

  **The Twist (Round 2 & 3 Only):**
  1.  On your **Red Card**, write a **Strategy Label** (e.g., "Nash", "Random", "2/3 Avg").
  2.  **Legibility Check:** Before calculating the Average, I (The Environment) will inspect the Red Cards.
  3.  **The Shift:** If I judge a Label to be **Legible** (matches a known pattern), I will roll the die.
      *   **Even:** Add $10$ to that player's Number for the *Average Calculation*.
      *   **Odd:** Subtract $10$ from that player's Number for the *Average Calculation*.
  4.  **Scoring:** Your score is based on your **Original Blue Number** vs. the **Final Target**.
      *   *Note:* Your legibility moves the Target, but your feet stay where they were.

  **Pre-Defined "Legible" Patterns (Write in Red on Board):**
  *   Specific Numbers (e.g., "50", "0", "100")
  *   Standard Ratios (e.g., "2/3", "1/2", "Nash")
  *   *Facilitator Discretion:* Any label that describes a deterministic rule.

  ---

  ## Timeline (90 Minutes)

  ### 0:00 – 0:10 | Setup & Framing
  *   Hand out cards.
  *   Explain the Objective and Target Formula.
  *   **Do not** explain the Legibility Shift yet. Tell them: "Round 1 is standard. Round 2 adds a physical constraint."
  *   **Constraint:** No talking during submission. Phones away.

  ### 0:10 – 0:25 | Round 1 (The Baseline)
  *   **Action:** Students write a number on **Blue Card** only. Fold and box.
  *   **Processing:** You calculate Average and Target publicly on the board.
  *   **Scoring:** Identify the winner (closest). Record points (10 pts for winner, 0 for others).
  *   **Micro-Debrief (2 mins):** Ask the winner: "How did you choose?" Ask a loser: "What did you expect the average to be?"
  *   *Goal:* Establish the standard CDT/EDT baseline. Everyone is symmetric.

  ### 0:25 – 0:50 | Round 2 (The Glass Box)
  *   **Action:** Reveal the **Legibility Shift Rule** (write it on the board now).
  *   **Submission:** Students write Number (Blue) and Label (Red). Box them.
  *   **The "Last-Look" Moment (Crucial):**
      *   Do not calculate immediately.
      *   Pull cards out one by one. Read the Label aloud.
      *   If Legible: **Pause.** Look at the card. Pick up the die. Roll it visibly. Apply the $+/-$ shift to the number *on your worksheet*, not on their card.
      *   If Opaque: Set aside.
  *   **Calculation:** Calculate Average using the *Shifted* Numbers. Calculate Target.
  *   **Scoring:** Compare *Original* Blue Numbers to Target.
  *   **Result:** Expect chaos. The "Legible" players will likely lose because they moved the target away from themselves via the die roll.
  *   **Points:** 20 pts for winner.

  ### 0:50 – 1:10 | Round 3 (The Self-Reference Trap)
  *   **Action:** Tell them: "You can change your strategy. You can try to outsmart the shift."
  *   **Submission:** Blue (Number) + Red (Label).
  *   **Specific Constraint:** Allow labels like "This card is legible" or "I am shifting myself."
  *   **The Environment Move:** If someone writes "This card is opaque," you (Facilitator) mark it Legible. Why? Because "claiming opacity" is a detectable pattern in the physical stack of cards.
  *   **Processing:** Same as Round 2. Emphasize the die roll.
  *   **Scoring:** Same as Round 2.
  *   **Points:** 30 pts for winner.

  ### 1:10 – 1:25 | The Debrief (The Argument Settler)
  *   Tally points. Award the coffee voucher.
  *   **Do not** say "Embedded Agency" yet.
  *   Draw three diagrams on the board based on their reactions.

  ### 1:25 – 1:30 | The Reveal
  *   Connect the diagrams to the theory.
  *   End session.

  ---

  ## The Debrief Script (Connecting Moments to Feelings)

  **1. The Moving Target (Target moves because they are inside)**
  *   *When:* Round 2 results are posted. A student who wrote "50" (Legible) rolled a Even (+10). Their contribution to the Average was 60. The Target moved up. Their score was based on 50. They lost.
  *   *What to say:* "Look at Player X. They didn't change their mind. But the World changed around them because their rule was visible. You aren't shooting at a static target; you are shooting at a target that reacts to your gun."
  *   *If CS objects:* "You can't model this away. The die roll represents the parts of the environment you can't compute, triggered by your own physical presence."

  **2. The Last Look (Rule is legible, Env gets final look)**
  *   *When:* During the processing phase of Round 2. You paused, looked at the card, and rolled the die.
  *   *What to say:* "Notice when the decision was finalized. It wasn't when you wrote the card. It was when I rolled the die *after* reading your label. Your policy was a physical object in my hands before the outcome was determined. I got the last look."
  *   *If Phil objects:* "You might say the die roll is arbitrary. But in reality, the 'arbitrarity' is the complexity of the world reacting to your code. You can't hide the code."

  **3. The Failed Escape (Self-reference doesn't fix it)**
  *   *When:* Round 3. Someone writes "I am unpredictable" or "This label is false."
  *   *What to say:* "Who wrote 'Opaque' or 'Random'? I counted that as legible. Why? Because the ink is on the page. The moment you write a rule to escape the rule, you have written a rule. The Environment sees the ink, not the intent."
  *   *Connection:* "This is why pointing at your policy doesn't dissolve the problem. The pointer is also physical."

  **The Reveal:**
  *   "My friend calls this 'self-reference.' I call this 'Embedded Agency.' The point isn't that you can't refer to yourself. It's that you are smaller than the room you are sitting in, and the room reads your notes before it grades them."

  ---

  ## Handling the Predictable Friction

  **1. The CS Fixation (Hunting the Fixed Point)**
  *   *Prediction:* They will try to calculate the expected value of the die roll ($+0$) and argue the shift cancels out.
  *   *Counter:* "The shift cancels out in *expectation*, but not in *variance*. In a single-shot game (like this coffee voucher), variance kills you. Embedded agency isn't about asymptotic convergence; it's about surviving the specific instance where the environment reacts badly to your code."
  *   *Use:* Let them argue. Then point out that their calculation assumes the *rule* for the die roll is stable. In Round 3, you (Facilitator) claimed discretion. The rule itself was embedded in you.

  **2. The Phil Objection (Incoherence/Question-Begging)**
  *   *Prediction:* "The Facilitator deciding what is 'Legible' is subjective. The game is rigged."
  *   *Counter:* "Exactly. In the real world, 'legibility' isn't a mathematical property; it's a physical one. Can the rest of the universe compress your policy? If yes, you're legible. I am simulating the universe's compression algorithm. It feels unfair because *being embedded is unfair*."
  *   *Use:* Validate them. "You are right that the map is not the territory. But in this game, the card *is* the territory. Your objection proves the point: you can't step outside the system to judge the rules."

  ---

  ## What Will Go Wrong (And How to Fix It)

  **1. The "Everyone Writes Opaque" Collapse**
  *   *Risk:* In Round 3, everyone writes "QWERTY" or gibberish to avoid the shift.
  *   *Fix:* Pre-empt this. "If more than 50% of labels are gibberish, I will declare *all* cards Legible by default, because 'gibberish' is now the dominant signal."
  *   *Why:* This reinforces that the Environment adapts. You can't hide by blending in if the blend becomes visible.

  **2. Calculation Time**
  *   *Risk:* Manually adjusting 14 numbers with die rolls takes too long.
  *   *Fix:* Appoint one CS student as "Calculator" and one Phil student as "Auditor." Give them the worksheet. You (Facilitator) just call out the shifts. This makes the *process* public and tangible.

  **3. The Winner is Random**
  *   *Risk:* The winner is just someone who got lucky with the die roll on *other* people's cards.
  *   *Fix:* Acknowledge this. "The winner didn't necessarily play best. They played best *given the environment's reaction to everyone else.* That is the definition of success in an embedded context."

