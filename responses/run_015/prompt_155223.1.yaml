answer: |-
  Here are the desiderata for a theory of social construction that avoids the "magic wand" trap, followed by the analysis of tensions, your invented distinction, and the brief scoreboard.

  ### The Desiderata

  **1. The Causal Efficacy Constraint (The Money Test)**
  The theory must explain how a kind can be ontologically dependent on human agreement yet retain mind-independent causal powers. It must account for why a piece of paper classified as *money* constrains your physical movement (you cannot leave the store without it) just as rigidly as a locked door, without positing that the paper possesses intrinsic physical properties that cause this.
  *   **Welded Case:** *Money.* If the theory implies money is "less real" than gold because it is constructed, it fails. If it implies money is "just an idea" that cannot cause hunger or wealth, it fails.

  **2. The Non-Triviality Constraint (The DNA/Planet Test)**
  The theory must provide a principled boundary between kinds that are socially constructed and kinds that are not, such that it does not classify brute biological facts or arbitrary taxonomic shifts as "constructions" in the same normative sense. It must distinguish between *discovering* a boundary and *drawing* one.
  *   **Welded Case:** *DNA vs. Planet.* The theory must explain why having DNA is not socially constructed (even if our *concept* of it is), while the classification of Pluto as a *planet* is. If the theory implies that *any* classification is a construction, it renders the term useless for normative critique.

  **3. The Normative Implication Constraint (The Refugee Test)**
  The theory must specify what practical leverage is gained by identifying a kind as constructed. It must distinguish between kinds that should be *abolished* (because they track nothing but oppression), *reformed* (because they track a legitimate function poorly), or *maintained* (because they coordinate essential cooperation).
  *   **Welded Case:** *Refugee Status.* The theory must explain why showing "refugee" is constructed justifies expanding the category to include more people, rather than dissolving the category entirely. It must bridge the is-ought gap without collapsing into "constructed = bad."

  **4. The Asymmetry of Exit Constraint (The Race/Gender Test)**
  The theory must explain why the "exit costs" from different constructed kinds vary wildly. It must account for why an individual can sometimes opt out of a kind (self-declaration) and other times cannot (external ascription), without relying solely on "power" as a brute fact.
  *   **Welded Case:** *Race vs. Gender.* The theory must explain why I can arguably opt out of a *gender marker* on a passport through administrative procedure, but cannot opt out of being *racialized* as Black in a society that polices that boundary, even if both are constructed.

  **5. The Dynamic Stability Constraint (The Looping/Extension Test)**
  The theory must account for kinds that change their extension or internal structure *because* they have been classified. It must distinguish between kinds that are stable despite social pressure and kinds that shift specifically *due* to the pressure of the classification itself.
  *   **Welded Case:** *Psychiatric Kinds & Language.* The theory must handle why classifying someone as *autistic* changes how they behave (looping), and why distinguishing a *language* from a *dialect* shifts under political pressure without a formal vote. The ontology must be able to move.

  **6. The Granularity Constraint (The Kind/Property Test)**
  The theory must specify the ontological locus of the construction. It must distinguish whether the *property* is constructed, the *concept* is constructed, or the *population* is constructed, and prevent the slippage where a constructed concept is used to deny the reality of the property.
  *   **Welded Case:** *Disability.* The theory must clarify if *disability* is a constructed kind (the category is invented) or if the *barriers* are constructed while the *impairment* is not. Blurring this leads to the error of thinking accommodation duties vanish if the kind is "just constructed."

  ---

  ### Tension Analysis

  **Which pairs are not jointly satisfiable?**
  The most severe tension is between **The Non-Triviality Constraint** and **The Normative Implication Constraint**.
  *   *The Conflict:* To satisfy Non-Triviality, you must draw a hard line between "real" (natural) and "constructed" (social). To satisfy Normative Implication, you often need to show that even "natural-seeming" things (like biological sex or intelligence) have constructed *significance* to justify reform. If you draw the line too hard (to save Non-Triviality), you protect too much from critique (e.g., "biology is destiny"). If you draw it too soft (to save Normative Implication), you risk the "everything is constructed" triviality that renders the term meaningless.

  **Which single requirement should be dropped?**
  Drop **The Non-Triviality Constraint** (in its strict binary form) and replace it with a **Gradient of Dependency**.
  *   *The Cost:* You lose the ability to say "X is *not* constructed." Instead, you must say "X is *less* socially dependent than Y." This costs you rhetorical punch (you can't simply wave away biology), but it saves the theory from falsification. DNA is not constructed, but *DNA as a legal identifier* is. A gradient account handles this; a binary account breaks on the edge cases.

  **Which requirement does the most work excluding candidate theories?**
  **The Normative Implication Constraint.**
  *   *Why:* Most existing ontological theories (e.g., Searle, Tuomela) are descriptive. They explain *how* status functions are created (X counts as Y in context C). They explicitly refuse to tell you whether you *should* keep the status function. Enforcing the demand that the theory must output *action-guidance* (abolish vs. reform) knocks out 90% of standard social ontology, which treats "construction" as a metaphysical status, not a political lever.

  ---

  ### On Your Invented Distinction (Anchored / Floating / Self-Verifying)

  **Does an adequate theory have to take a stand on it?**
  No, it does not have to adopt your *terminology*, but it **must account for the phenomena** your triad describes.
  *   *Assessment:* Your triad is a robust re-description of existing literature. *Anchored* maps to "grounded kinds" (tracking mind-independent features); *Floating* maps to "arbitrary status functions" (fiat money); *Self-Verifying* maps to Hacking's "interactive kinds."
  *   *Mobility:* An adequate theory **must** explain how kinds move between these categories. *Race* in the 19th century was treated as *Anchored* (biology); today it is often treated as *Floating* (social identity); in specific legal contexts, it becomes *Self-Verifying* (affirmative action eligibility creates the statistical group). A theory that fixes a kind in one category permanently fails the Dynamic Stability Constraint.
  *   *Verdict:* Do not build the theory *on* this triad, but use it as a stress test. If the theory cannot explain how a kind shifts from Anchored to Self-Verifying, it is too static.

  ---

  ### Legitimacy Check: Two Suspect Requirements

  **1. The Abolition Requirement**
  *("If K is constructed, the theory should say what abolishing K would consist in.")*
  *   **Verdict:** This is a **Category Error** for pure ontology, but **Legitimate** for your specific project.
  *   *Reasoning:* Ontology describes what exists; Ethics/Politics describes what to do with it. Demanding that a metaphysical theory dictate abolition conditions is like demanding a chemistry theory tell you whether to build a bomb or a reactor. However, since your stated goal is a *practical/normative* theory of construction, you are entitled to demand it. Just acknowledge you are building a **Normative Ontology**, not a pure one.

  **2. The Reflexivity Requirement**
  *("The theory should say what happens to K when the claim that K is constructed becomes widely believed.")*
  *   **Verdict:** This is **Not Incoherent**, but it creates an **Instability Problem**.
  *   *Reasoning:* This is the "Observer Effect." It is not a category error; it is a feedback loop. However, demanding the theory *predict* the outcome of its own publication is computationally impossible (you cannot fully model the system you are changing).
  *   *Modification:* Demand that the theory *accommodate* reflexivity (i.e., allow for the kind to change upon discovery), not that it *predict* the specific trajectory of that change.

  ---

  ### Brief Scoreboard: Three Styles of Account

  **1. Collective-Acceptance / Status-Function (e.g., Searle)**
  *   *Performance:* Fails **Normative Implication** and **Asymmetry of Exit**.
  *   *Why:* Explains *Money* perfectly (we agree it has value). Fails to explain why you can't opt out of *Race* (collective acceptance is often coercive, not consensual). Treats construction as a "glue" that holds society together, offering no lever for abolition.

  **2. Political-Definition / Ameliorative (e.g., Haslanger)**
  *   *Performance:* Passes **Normative Implication** and **Abolition**. Fails **Non-Triviality**.
  *   *Why:* Defines kinds explicitly by their political utility (e.g., "women are those subordinated by..."). Great for telling us what to do. Risks making the kind *only* a political tool, making it hard to explain why the kind resists change (The Reality Constraint).

  **3. Looping / Interactive Kinds (e.g., Hacking)**
  *   *Performance:* Passes **Dynamic Stability** and **Reflexivity**. Fails **Granularity**.
  *   *Why:* Brilliant on how *Autism* or *Refugee* changes when labeled. Struggles to distinguish between the *concept* changing and the *people* changing. Often implies the kind is *only* the looping effect, risking the "nothing is real" collapse if the looping stops.
