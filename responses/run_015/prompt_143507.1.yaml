answer: |-
  # SEMINAR HANDOUT: Positioning the "Brain as Computer" Debate

  **Instructions:** Read each case below. Select the option (A or B) that best matches your intuition about the description provided. Do not worry about technical jargon; answer based on what seems most plausible to you. There are no correct answers, only consistent positions.

  ### Part 1: Diagnostic Questions

  **1. The Digestive Tract**
  Textbooks sometimes describe the stomach as "processing information" about nutrient levels to regulate enzyme secretion.
  *   **A:** This is a literal computation; the stomach implements a program.
  *   **B:** This is a metaphor; only the brain (or specific circuits) literally computes.

  **2. The Hydrological Valley**
  Hydrologists use the drainage pattern of a valley to solve a differential equation that would be hard to integrate numerically.
  *   **A:** The valley is physically performing an analogue computation.
  *   **B:** The valley is just a physical system; the computation exists only in the hydrologist's description.

  **3. Incompatible Programs**
  A neural circuit's activity can be modeled equally well by two formally incompatible computer programs (e.g., one serial, one parallel).
  *   **A:** The circuit is running both (or the computation is indeterminate).
  *   **B:** The circuit is running neither; the programs are just descriptive tools.

  **4. The Post-Hoc Model**
  A computational model fits recorded neural data perfectly but is too slow to run in real-time and could not have guided the animal's behavior as it happened.
  *   **A:** It still explains the mechanism; accuracy matters more than speed.
  *   **B:** It does not explain the mechanism; a real-time causal role is required.

  **5. The Neuron Replacement**
  We replace neurons one by one with artificial devices that match their input-output timing and metabolic exchange exactly.
  *   **A:** The mind and cognition are preserved (substrate doesn't matter).
  *   **B:** The mind changes or vanishes (biological substance matters).

  **6. Levels of Description**
  The same preparation is described computationally at the level of spikes, dendritic compartments, and the whole animal coupled to its environment.
  *   **A:** Only one level is the "real" computation (usually the intermediate circuit level).
  *   **B:** All are equally real, or the "whole animal" level is the primary one.

  **7. The Continuous Generator**
  A central pattern generator produces rhythm via continuous state variables where timing is essential; any digital program is a discretization artifact.
  *   **A:** It is still computing, just in an analogue or hybrid format.
  *   **B:** It is not computing; it is a dynamical physical system, distinct from computation.

  **8. Biophysical Sufficiency**
  A circuit is explained entirely in biophysical and energetic terms (ions, currents, diffusion) with no computational vocabulary.
  *   **A:** The computational description adds nothing; the biophysical account is complete.
  *   **B:** The computational description captures patterns the biophysical account misses or obscures.

  **9. Empirically Equivalent Programs**
  Two candidate programs agree on every prediction anyone knows how to test, but posit different internal states.
  *   **A:** The difference is meaningless; if you can't test it, it isn't science.
  *   **B:** One might still be true; current tests don't exhaust reality.

  **10. Aboutness**
  For a neural process to count as a computation, must it represent something external (content), or is structure enough?
  *   **A:** Structure is enough; representation is not required for computation.
  *   **B:** Representation is required; without "aboutness," it is just signal processing.

  ---

  ### Part 2: Scoring Key (Instructor Use)

  **Sub-Score Calculation:**
  *   **Ontology Score (O):** Count 'A' on Q1, Q2, Q3. (Range 0–3).
      *   *High (2–3):* Computation is intrinsic/specific to the system.
      *   *Low (0–1):* Computation is imposed/universal/indeterminate.
  *   **Explanation Score (E):** Count 'A' on Q4, Q8, Q9. (Range 0–3).
      *   *High (2–3):* Computation is indispensable/falsifiable/real-time.
      *   *Low (0–1):* Computation is heuristic/redundant/fictional.
  *   **Cognition Score (C):** Count 'A' on Q5, Q6, Q7, Q10. (Range 0–4).
      *   *High (3–4):* Cognition is constitutively computational/substrate-independent.
      *   *Low (0–2):* Cognition is embodied/biological/dynamical.

  **Position Mapping (The Leaves):**
  *Map your O, E, C scores and specific answer patterns to the following positions.*

  1.  **Representational Computationalism** (O-High, E-High, C-High, Q10=B).
      *   *Content:* The brain literally computes, this explains cognition, and computation requires semantic content (representations).
  2.  **Mechanistic Computationalism** (O-High, E-High, C-High, Q10=A).
      *   *Content:* The brain literally computes and this explains cognition, but computation is defined by causal structure, not content.
  3.  **Analogue/Hybrid Computationalism** (O-High, E-High, C-High, Q7=A).
      *   *Content:* Computation is literal and explanatory, but need not be digital/discrete; continuous physical processes can compute.
  4.  **Extended Computationalism** (O-High, E-High, C-High, Q6=B [Whole Animal]).
      *   *Content:* The computational vehicle extends beyond the skull into the body and environment.
  5.  **Neural-Only Computationalism** (O-High, E-High, C-Low).
      *   *Content:* The brain literally computes and it explains neural function, but cognition/mind is not exhausted by this (e.g., consciousness is non-computational).
  6.  **Deflationary Pancomputationalism** (O-Low, E-Low, C-Low, Q1=A).
      *   *Content:* Everything computes under some mapping (even stomachs); the claim is true but trivial and explains nothing specific.
  7.  **Instrumentalism / Fictionalism** (O-Low, E-High, C-High).
      *   *Content:* The brain is not literally a computer, but treating it as one is indispensable for prediction and explanation.
  8.  **Pragmatic Realism** (O-Low, E-High, C-High, Q9=B).
      *   *Content:* Computational descriptions are relative to our interests (not intrinsic), but they track real causal powers that biophysics misses.
  9.  **Biophysical Anti-Computationalism** (O-Low, E-Low, C-Low, Q8=A).
      *   *Content:* Computational descriptions are redundant; the biophysical/energetic account is the only literal truth.
  10. **Dynamical / Embodied Systems** (O-Low, E-Low, C-Low, Q7=B).
      *   *Content:* Cognition is not computation; it is the trajectory of a continuous system coupled to an environment.
  11. **Structural Realism** (O-High, E-High, C-High, Q3=A).
      *   *Content:* Computation is real but indeterminate; the system implements all compatible structures simultaneously.
  12. **Falsificationist Computationalism** (O-High, E-High, C-High, Q9=A).
      *   *Content:* Computational claims are scientific only if they rule out internal states; equivalent programs are a failure of theory.
  13. **Substrate-Dependent Functionalism** (O-High, E-High, C-Low, Q5=B).
      *   *Content:* Computation is real, but it requires specific biological hardware to sustain cognition (rejects silicon replacement).

  **Empty Logical Space (Unoccupied Combinations):**
  *   **O-High / E-Low / C-High:** *Literal but Redundant Computationalism.*
      *   *Why Empty:* If computation is literally happening (O-High) but explains nothing biophysics doesn't (E-Low), claiming cognition *is* that computation (C-High) renders the mind causally inert. This is epiphenomenalism about the mental, rarely defended explicitly.
  *   **O-Low / E-High / C-Low:** *Imposed but Indispensable Description of Non-Computational Mind.*
      *   *Why Empty:* If the description is merely imposed (O-Low) and the mind is not computational (C-Low), claiming the description is indispensable (E-High) contradicts the view that the physical facts suffice. (Instrumentalism usually claims the *mind* is usefully described as computational).

  **Indistinguishable Leaves:**
  *   **Representational vs. Mechanistic (1 & 2):** These overlap heavily. They are only separated by Q10. Many philosophers argue mechanism *implies* representation or vice versa, making this distinction unstable in practice.
  *   **Extended vs. Standard Computationalism (4 vs 1/2/3):** Without a specific question on the *boundary* of the vehicle, Q6 is the only discriminator. Many Extended Computationalists answer Q6 like Standard Computationalists.
  *   **Biophysical Anti-Computationalism vs. Dynamical (9 & 10):** Both score Low on all sub-scores. They differ on whether the alternative is "physics" (9) or "dynamics" (10), which this instrument does not fully separate.

  **Cases That Fail to Discriminate:**
  *   **The Valley (Q2):** Often fails to separate *Analogue Computationalism* from *Pancomputationalism*. Both may answer 'A', but for different reasons (one thinks analogue computation is special, the other thinks all physical processes compute).
  *   **Incompatible Programs (Q3):** Often fails to separate *Instrumentalism* from *Structural Realism*. Both may answer 'B' (it's not running both), but one thinks it's running neither (Instrumentalism) and the other thinks the question is ill-posed (Structuralism).

  ---

  ### Instructor's Note: Settled vs. Contested

  **1. The Trunk Questions (No Agreement):**
  None of the three sub-score dimensions are settled.
  *   **Ontology:** There is no consensus on whether computation is intrinsic (like mass) or observer-relative (like "being a chair").
  *   **Explanation:** There is no agreement on whether a model that fits data but violates real-time constraints explains the *mechanism* or merely the *capacity*.
  *   **Cognition:** It remains contested whether "computation" is a natural kind that carves cognition at its joints, or a heuristic lens.

  **2. Position Status (Defended vs. Reconstructed):**
  *   **Actually Defended:** Representational Computationalism, Mechanistic Computationalism, Instrumentalism, Dynamical/Embodied, Deflationary Pancomputationalism, Biophysical Anti-Computationalism.
  *   **Reconstructed for Completeness:** Structural Realism (11), Falsificationist Computationalism (12), Substrate-Dependent Functionalism (13). These are logical possibilities derived from the answer keys but lack prominent canonical defenders in the exact configuration listed.
  *   **Neural-Only Computationalism (5):** Defended by some illusionists or dualists, but often unstable.

  **3. Critique of the Three-Way Framing:**
  Your hypothesis (Ontology, Explanation, Cognition) embeds a contested choice: it assumes these three questions *can* be separated.
  *   **Contested Choice:** Many **Mechanists** argue that Ontology and Explanation are inseparable: if a computation explains nothing (E-Low), it is not literally implemented (O-Low).
  *   **Contested Choice:** Many **Embodied Theorists** argue that Cognition and Ontology are inseparable: if cognition is embodied, the "computation" cannot be intrinsic to the brain (O-Low).
  *   **Warning:** Using this instrument may inadvertently teach students that these dimensions are independent, when a significant portion of the literature argues they are mutually constraining. Use the "Empty Logical Space" section to highlight these tensions.
