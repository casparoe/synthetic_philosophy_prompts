  **Splitting Questions**

  1.  **Non-Interfering Master:** Is a slave whose master never interferes free? (No → Pure Negative).
  2.  **Precarious Permission:** Is an option freedom if it survives only by another's goodwill? (No → Robust Views).
  3.  **Unlocked Door:** Is an agent unfree if prevented only by false belief? (Yes → Subjective Views).
  4.  **Dependent Employee:** Is the starving employee unfree due to *power* or *status*? (Splits Republicanism).
  5.  **Weakness of Will:** Are internal psychological constraints unfreedom? (Yes → Positive Liberty).
  6.  **Rational Ends:** Must free choices track objective reason? (Yes → Autonomy Views).
  7.  **Democratic Law:** Is a citizen unfree when bound by a law she voted against? (Tests Civic Status limits).

  **The Tree**

  START: **Non-Interfering Master.** Is the slave free?
  │
  ├─ YES → **Precarious Permission.** (Option lasts only by goodwill). Is this freedom?
  │   ├─ YES → **Unlocked Door.** (Agent believes locked). Is she unfree?
  │   │   ├─ NO → **Leaf 1:** Pure Negative Liberty (Berlin).
  │   │   └─ YES → **Leaf 2:** Subjective Negative (Unoccupied).
  │   └─ NO → **Dependent Employee.** (Starves if resigns). Is she unfree?
  │       ├─ NO → **Leaf 3:** Opportunity-Weighted Negative (Cohen).
  │       └─ YES → **Leaf 4:** Welfare Liberty (Sen).
  │
  └─ NO → **Weakness of Will.** (Internal constraint). Is this unfreedom?
      ├─ NO → **Dependent Employee.** Unfree due to *Power* or *Status*?
      │   ├─ POWER → **Leaf 5:** Non-Domination Republicanism (Pettit).
      │   └─ STATUS → **Democratic Law.** (Voted against). Is this unfreedom?
      │       ├─ YES → **Leaf 6:** Civic-Status Republicanism (Skinner).
      │       └─ NO → **Leaf 7:** Radical Democracy (Arendt).
      ├─ YES → **Rational Ends.** Must choices track reason?
      │   ├─ NO → **Leaf 8:** Positive Liberty as Self-Mastery (Green).
      │   └─ YES → **Leaf 9:** Positive Liberty as Autonomy (Raz).
      │
      *Additional Logical Space:*
      ├─ **Leaf 10:** Libertarian Property (Nozick) [Branches from Leaf 1 on property rights].
      ├─ **Leaf 11:** Capability Approach (Nussbaum) [Branches from Leaf 4 on functioning].
      └─ **Leaf 12:** Internal Domination (Unoccupied) [Branches from Leaf 8 on self-power].

  **Leaf Notes**

  1.  Pure Negative Liberty counts only actual external interference as a reduction of freedom.
  2.  Subjective Negative wrongly implies ignorance alone restricts liberty without external constraint.
  3.  Opportunity-Weighted Negative values option sets but ignores the security of those options.
  4.  Welfare Liberty conflates the means to exercise freedom with the condition of freedom itself.
  5.  Non-Domination Republicanism identifies unfreedom with exposure to arbitrary power relations.
  6.  Civic-Status Republicanism identifies unfreedom with legal dependence rather than specific power exercises.
  7.  Radical Democracy claims freedom is constituted by participation, not merely protected by it.
  8.  Positive Liberty as Self-Mastery requires reason to govern passion for an agent to be free.
  9.  Positive Liberty as Autonomy requires access to adequate valuable options for genuine choice.
  10. Libertarian Property treats property rights as constitutive of liberty rather than constraints upon it.
  11. Capability Approach focuses on effective functioning rather than formal rights or options.
  12. Internal Domination suggests one can dominate oneself, confusing autonomy with self-division.

  **Unoccupied Regions and Collisions**

  Two regions remain empty. First, **Subjective Negative Liberty** is unoccupied because no major theorist reduces freedom solely to belief without external constraint. Second, **Internal Domination** is unoccupied; while self-control is debated, describing it as "domination" conflates positive liberty with republican terminology.

  The Republican split (Leaves 5 and 6) presents a collision. On standard cases like the benevolent dictator or democratic citizen, Non-Domination and Civic-Status yield identical verdicts. They theoretically diverge on the **Precarious Citizen** (secure rights but insecure status), but in practice, these conditions track together. Consequently, the tree separates them by justification (power vs. status) rather than distinct case outcomes, acknowledging that Skinner and Pettit often occupy the same logical space despite different genealogies. Leaf 7 (Radical Democracy) is the only clear diverger, treating coercion as freedom if participatory.
