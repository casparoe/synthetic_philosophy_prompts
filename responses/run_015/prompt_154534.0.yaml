prompt: |-
  I'm running a peer tutorial next week for about twelve second-years in my philosophy-and-economics course — fifty minutes, and the topic is interpersonal utility comparisons. They've done basic consumer theory and Arrow's theorem but nothing on social welfare functions. I dont need the topic explained to me, I need a plan for explaining it: what has to be in place before the question even makes sense to them, and in what order the rest has to come.

  My hypothesis is that the real mess is that three different comparability claims get run together: comparing how well off two people are overall (levels), comparing the *size* of a gain across people (differences), and comparing units or scale so that one person's gain can count as twice another's. Is that the spine to build the session around, or too much for fifty minutes?

  I was going to carry it with one case: a fixed budget split between an able-bodied student and a wheelchair user who needs far more money to reach the same level of mobility. But that might drag in desert and disability stuff I don't want to get stuck arguing about. Is there a better carrying example, and what would it need to have and to lack?

  Misconceptions I'm expecting: "utility is just happiness, so this is easy"; "you can't compare, so fall back on Pareto"; "just use willingness to pay". Where in the sequence should I head each one off, and what should I flat-out refuse to cover? My tutor keeps saying Pareto is the only criteron you get for free and that it can't rank anything — I want them to feel that by the end. And give me one question to ask at the end that shows me whether they actually got it rather than just learned to say "it depends".
reasoning: |-
  Here's a thinking process that leads to the suggested tutorial plan:

  1.  **Analyze the Request:**
      *   **Audience:** 12 second-year Philosophy & Economics students.
      *   **Background:** Basic consumer theory (ordinal utility, indifference curves), Arrow's Theorem (impossibility of ranking social states without dictatorship, etc.). *No* Social Welfare Functions (SWF) yet.
      *   **Topic:** Interpersonal Utility Comparisons (IUC).
      *   **Time:** 50 minutes.
      *   **Tutor's Goal:** A structured plan (sequence, prerequisites, examples, misconceptions, assessment).
      *   **Tutor's Hypothesis:** The core confusion is mixing up levels, differences, and units/scale.
      *   **Tutor's Proposed Example:** Budget split between able-bodied vs. wheelchair user (concerns: disability/desert distraction).
      *   **Key Misconceptions to Address:** Utility = happiness, "Can't compare so Pareto only," Willingness to Pay (WTP).
      *   **Key Takeaway:** Pareto is "free" but useless for ranking; IUC is necessary for non-Pareto rankings but requires strong assumptions.
      *   **Deliverable:** A session plan, validation of the hypothesis, example advice, misconception handling, and a final assessment question.

  2.  **Evaluate the Hypothesis (Levels, Differences, Units):**
      *   *Is it correct?* Yes, this is the standard Sen/Arrow distinction (Level comparability, Unit comparability, Full comparability).
      *   *Is it too much for 50 mins?* It's dense. If taught abstractly, yes. If taught through a concrete mechanism, it's manageable. It *must* be the spine, but it needs to be simplified linguistically. Let's call them "Who is happier?", "Who gains more?", and "Do our rulers match?".
      *   *Decision:* Keep it as the spine, but integrate it into the example rather than lecturing on it first.

  3.  **Evaluate the Example (Wheelchair vs. Able-bodied):**
      *   *Pros:* Intuitively clear that money converts to utility differently.
      *   *Cons:* As the tutor notes, it triggers "desert," "need," "fairness," and "disability politics." Students might argue about the *morality* of the allocation rather than the *measurement* problem. It conflates *capacity to benefit* with *interpersonal comparison*.
      *   *Alternative:* We need something where the "utility function" is clearly different but morally neutral (or at least less charged).
      *   *Idea 1:* Coffee vs. Tea. (Too trivial, doesn't show diminishing marginal utility well).
      *   *Idea 2:* Two people sharing a pizza. (Classic, but often assumes identical tastes).
      *   *Idea 3:* **The "Party Budget" or "Study Grant".** Two students, different preferences for goods that make up "welfare."
      *   *Idea 4:* **The "Temperature" Analogy.** (Good for explaining measurement, bad for economics).
      *   *Idea 5:* **The "Painkiller" Example.** (Person A has a headache, Person B has a migraine). Good for levels/differences, but maybe too subjective.
      *   *Selection:* Stick closer to the tutor's instinct but sanitize it. Let's use **Two Students and a Cash Grant**, but specify their *preferences* over a specific good (e.g., Textbooks vs. Social Events) or simply stipulate different marginal utilities of income without making it about disability.
      *   *Better Selection:* **The "Air Conditioning" Problem.** Two roommates, one budget to set the thermostat. One runs hot, one runs cold.
      *   *Best Selection:* **The "Two Robinsons" (Simple Endowment).** Keep it abstract but concrete. Two people, one good (money). Person A gets 1 util per $1. Person B gets 0.5 utils per $1. Why? Stipulate it. Don't justify it with disability. Just say "Different utility functions." This avoids the "desert" trap.
      *   *Refinement:* Actually, the tutor's wheelchair example is powerful *if* constrained. The problem is the *normative* drag. Let's suggest a modification: **The "Expensive Tastes" Objection.** Dworkin's example is famous. A person needs champagne to be as happy as another is with beer. This highlights the *measurement* problem without necessarily invoking disability rights (though it's still normative).
      *   *Decision:* I will advise keeping the wheelchair example *only if* the tutor strictly frames it as "Different Conversion Rates" and shuts down normative debate. However, a safer bet is the **"Hot vs. Cold" Roommate** scenario. It's relatable, involves a fixed resource (energy/comfort), and clearly shows different marginal utilities of the same good (temperature) without implying one person is "worse off" inherently, just different sensitivities.
      *   *Wait, actually:* The tutor wants to show why Pareto fails. The wheelchair example is good for showing why Pareto *insufficiency* matters (Pareto can't decide between giving money to A or B if both gain). Let's suggest a **"Concert Tickets"** example. Two friends, one ticket left. A loves the band (10 utils), B likes the band (5 utils). Can we compare? This isolates Levels and Differences cleanly.

  4.  **Structure the 50 Minutes:**
      *   0-5: Hook & The Pareto Wall (Show why current tools fail).
      *   5-20: The Measurement Problem (Levels vs. Differences).
      *   20-35: The Scaling Problem (Units/Cardinality).
      *   35-45: The Consequence (SWF/Arrow connection).
      *   45-50: Assessment.

  5.  **Addressing Misconceptions:**
      *   *Utility = Happiness:* Address early. Define utility as preference satisfaction (ordinal).
      *   *Pareto is enough:* Show a scenario where Pareto is silent.
      *   *WTP:* Show that WTP depends on wealth, not just utility.

  6.  **Developing the Final Question:**
      *   Needs to distinguish between "I don't know" and "I know *why* we can't know."
      *   Scenario: A policy makes Rich richer and Poor poorer. Rich gains 100 utils, Poor loses 50 utils. Can we approve?
      *   Better: Give them two utility functions and ask if a transfer increases social welfare.

  7.  **Drafting the Plan (Iterative refinement):**

      *   *Prerequisites:* They need to understand that utility is ordinal (indifference curves). If they think utility is cardinal by default, the whole session breaks.
      *   *The Spine:* The tutor's hypothesis (Levels, Differences, Units) is correct and is the standard Sen classification. It is essential. I will validate this but suggest simplifying the terminology for the room.
      *   *The Example:* I'll recommend the "Concert Ticket" or "Pizza" example over the wheelchair one to avoid normative drift, OR tell them how to fence off the wheelchair example. Let's go with fencing off the wheelchair example because it's vivid, but add a "Control Case" (Two identical students) to isolate the variable.
      *   *Actually, the "Painkiller" example is best for IUC.* Person A needs 2 pills for relief. Person B needs 1. We have 2 pills. Who gets them? It forces the comparison.
      *   *Let's stick to the Tutor's Wheelchair idea but refine it.* It's their strength. I'll tell them how to manage the "desert" distraction.
      *   *Wait, one more thing:* Arrow's Theorem. They know it. Arrow assumes *ordinal* non-comparable utility. The session must show that to escape Arrow, we need *cardinal comparable* utility. This is the bridge.

  8.  **Finalizing the Sequence:**
      1.  **The Pareto Dead End (10 mins):** Show a choice Pareto can't make.
      2.  **The Measurement Barrier (15 mins):** Why can't we just ask them? (Levels/Differences).
      3.  **The Unit Problem (15 mins):** Even if we know gains, do the rulers match? (Cardinality).
      4.  **The Arrow Connection (5 mins):** Why this matters for voting/SWF.
      5.  **Exit Ticket (5 mins).**

  9.  **Refining the Misconception Handling:**
      *   *WTP:* Bring this in during the "Unit Problem." WTP is revealed preference, but it's income-weighted.
      *   *Happiness:* Bring this in during "Measurement." Utility $\neq$ Hedonic state.

  10. **The Final Question:** Needs to be a "trap."
      *   "If Person A gains 10 utils and Person B loses 5 utils, is society better off?"
      *   Correct answer isn't Yes/No, it's "Only if we assume unit comparability and accept the aggregation rule."
      *   Better: "We have $100. Alice says it gives her 10 utils. Bob says it gives him 20 utils. Do we give it to Bob?" (Tests if they realize the scales might be different).

  11. **Review against constraints:** 50 mins is tight. 12 students is a good size for breakout pairs. Need to ensure they talk, not just listen.

      *   *Self-Correction on Example:* The wheelchair example is risky. If a student says "But it's *fairer* to give to the wheelchair user," the tutorial derails into normative ethics. The goal is *measurement*. I will suggest the **"Two Dieters"** or **"Two Gamers"** example. Same resource (calories/screen time), different marginal utility functions. No moral weight.
      *   *Actually, let's suggest the "Pain" example.* It's the standard philosophical intuition pump for IUC. "My headache vs. your headache." It's hard to ignore but focuses on the *comparison* difficulty.
      *   *Decision:* I will advise using the **"Concert Ticket"** example for the *Levels/Differences* part (cleaner) and the **"Thermostat"** for the *Units* part. I'll explain why the wheelchair example is dangerous.

      *(Self-Correction)*: Wait, the tutor *wants* to use the wheelchair example. I should respect that but give guardrails. It's a strong example for *why* we care. I will tell them how to constrain it.

      *(Final Plan Structure)*:
      1.  Validate Hypothesis (Yes, it's the spine).
      2.  Prerequisites (Ordinality).
      3.  Example Advice (Sanitize the wheelchair one).
      4.  Minute-by-Minute Plan.
      5.  Misconception Traps.
      6.  The Final Question.

      Let's write it.
answer: |-
  Here is a battle plan for your 50 minutes.

  ### 1. Validate Your Hypothesis
  **Your hypothesis is correct.** The distinction between **Levels** (who is better off?), **Differences** (who gains more?), and **Units** (does my '1' equal your '1'?) is the exact logical structure required to understand Interpersonal Utility Comparisons (IUC). This is essentially the Sen/Arrow classification of informational constraints.

  **Is it too much for 50 minutes?**
  Only if you lecture it. If you present it as a puzzle they have to solve, it fits. Do not define these terms at the start. Let them run into the wall, then name the wall.

  ### 2. The Carrying Example
  **Keep the Wheelchair/Able-bodied example, but sanitize it.**
  You are right to worry about "desert" and "disability politics." If students start arguing about *fairness*, you lose the *measurement* point.

  **How to fence it off:**
  Stipulate the utility functions as brute facts, not moral claims.
  *   **Student A (Able-bodied):** $U_A = \sqrt{M}$
  *   **Student B (Wheelchair):** $U_B = \sqrt{M/2}$
  *   **The Stipulation:** "For the purpose of this exercise, assume these functions are true. We are not asking if B *deserves* more. We are asking if we can *know* that B needs more to reach the same $U$."

  **Why this works:** It creates an immediate intuition that money converts to welfare differently.
  **The Risk:** Students will say "Just give it to B."
  **The Fix:** Immediately follow up with a **"Reverse Case"**: "What if Student C has expensive tastes (needs champagne to be as happy as D is with beer)?" This breaks the intuition that "need" always trumps "want," forcing them back to the measurement problem.

  ### 3. Prerequisites (Check these in Minute 1)
  Before you begin, ensure they hold two things firmly:
  1.  **Utility is Ordinal:** In consumer theory, $U=10$ vs $U=20$ means nothing; only the ranking matters.
  2.  **Pareto is Weak:** Pareto only ranks situations where at least one person gains and no one loses.

  If they think utility is cardinal (like temperature) coming in, the session fails. Ask: *"If I double your utility function numbers, does your behavior change?"* (Answer: No).

  ### 4. The 50-Minute Sequence

  **0:00 – 0:10: The Pareto Wall (The "Why")**
  *   **Activity:** Present a simple policy choice.
      *   *Status Quo:* A has \$100, B has \$100.
      *   *Policy X:* A has \$150, B has \$80.
  *   **Ask:** "Is Policy X better?"
  *   **Expected Answer:** "Pareto doesn't say. B lost."
  *   **Push:** "But A gained a lot. If A gained enough, shouldn't we do it?"
  *   **Point:** To answer this, we need to compare A's gain to B's loss. Pareto is silent. We need IUC.

  **0:10 – 0:25: Levels and Differences (The "What")**
  *   **Use the Wheelchair Example.**
  *   **Ask:** "How do we know B needs more money to be as well off as A?"
  *   **Misconception Check (Happiness):** If they say "Ask them how happy they are," stop them.
      *   *Counter:* "A might be stoic, B might be dramatic. Self-reports are noisy."
      *   *Counter:* "Utility is preference satisfaction, not dopamine."
  *   **The Spine:** Distinguish **Levels** (Is A happier than B right now?) from **Differences** (Did A gain more than B lost?).
  *   **Key Insight:** We usually care about *Differences* for policy (Kaldor-Hicks), but *Differences* require comparing *Levels*.

  **0:25 – 0:40: Units and Scale (The "How")**
  *   **The Trap:** "Okay, A gained 10 utils, B lost 5 utils. Net +5. Do it."
  *   **The Block:** Remind them utility is ordinal.
      *   "What if A's scale is 1 to 100, and B's scale is 1 to 1,000,000?"
      *   "What if A's '1 util' is a whisper and B's '1 util' is a scream?"
  *   **Misconception Check (WTP):** If they say "Use Willingness to Pay," hit this hard.
      *   *Counter:* "WTP is utility weighted by marginal utility of income. Rich people have higher WTP for the same utility gain. WTP presupposes the comparison you're trying to make."
  *   **The Conclusion:** To sum utilities, we need **Cardinality** (fixed units) AND **Comparability** (shared zero/scale). This is a massive informational assumption.

  **0:40 – 0:45: The Arrow Connection**
  *   **Link:** "You know Arrow's Theorem. Why did Arrow assume ordinal, non-comparable utility?"
  *   **Answer:** Because once you allow cardinal, comparable utility, you can build a Utilitarian Social Welfare Function, and Arrow's impossibility vanishes (you just sum them).
  *   **The Trade-off:** You escape Arrow's Impossibility only by accepting a huge, unprovable assumption about measurement. Pareto is "free" (requires no comparison) but useless. Utilitarianism is useful but "expensive" (requires impossible data).

  **0:45 – 0:50: Assessment**
  *   See below.

  ### 5. Handling Misconceptions

  | Misconception | When it arises | How to shut it down |
  | :--- | :--- | :--- |
  | **"Utility is happiness"** | Min 15 (Measurement) | "If I drug you so you feel happy but you hate your life, is your utility high? No. Utility is *preference satisfaction*. Can you measure someone else's preferences from the outside?" |
  | **"Just use Pareto"** | Min 5 (The Wall) | "Pareto ranks 1% of real-world policies. Almost all policy creates winners and losers. If we only use Pareto, the government can never tax or regulate." |
  | **"Use Willingness to Pay"** | Min 30 (Units) | "WTP is utility $\times$ money. If I'm rich, \$100 is nothing. If I'm poor, \$100 is life. WTP compares *wealth*, not *utility*. It begs the question." |

  ### 6. The Final Question (The "Litmus Test")
  Do not ask a Yes/No question. Ask a diagnostic question that reveals if they understand *why* the comparison fails.

  **The Question:**
  > "Person A and Person B both report that a policy gives them a '10 util' gain. A is a billionaire; B is homeless. Can we conclude they benefited equally?"

  **What you want to hear:**
  *   **Bad:** "Yes, 10 equals 10." (Failed to grasp Units/Scale).
  *   **Bad:** "No, because B needs it more." (Slid back into normative desert/need).
  *   **Good:** "No, because we don't know if their utility scales are calibrated the same. A's '10' might be trivial, B's '10' might be life-changing. Without a shared unit of measurement, the numbers are meaningless."

  ### 7. What to Refuse to Cover
  *   **Specific Social Welfare Functions:** Do not teach Utilitarian vs. Rawlsian SWFs in detail. Mention them as *consequences* of IUC, not the topic itself.
  *   **The Ethics of Redistribution:** If they start arguing whether the wheelchair user *should* get the money, stop them. Say: "We are epistemologists today, not ethicists. We are asking if we *can* know, not what we *should* do."
  *   **Harsanyi's Theorem:** Too technical. It justifies Utilitarianism via rationality axioms. Save for third year.

  ### Summary of the "Spine"
  Your hypothesis is the spine. Structure the room like this:
  1.  **Pareto** (No comparison needed $\rightarrow$ No ranking possible).
  2.  **Levels/Differences** (Comparison needed $\rightarrow$ Measurement problem).
  3.  **Units** (Measurement needed $\rightarrow$ Scale problem).
  4.  **Result** (To rank, we must assume away the scale problem).

  This flow forces them to feel the tension: The more power we want our welfare criterion to have, the more unrealistic assumptions we must swallow.
