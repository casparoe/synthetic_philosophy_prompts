answer: |-
  1. If spacetime points are individuals independent of the fields, then general covariance entails a radical form of indeterminism where initial data outside a hole fails to fix the metric field values at points inside it.
  2. All diffeomorphism-invariant quantities retain identical values across the models generated by the hole construction, ensuring no empirical distinction is possible between the putative distinct physical possibilities.
  3. We agree to characterize the residual disagreement as a choice between accepting ontological indeterminism or adopting an equivalence principle that identifies diffeomorphically related models as a single physical situation.
  4. The substantivalist concedes that without a principled criterion for transworld identity of points, the indeterminism appears as an artifact of representation rather than a physical propensity.
  5. The relationist concedes that denying individuality to points requires a robust account of localization that does not merely covertly reintroduce substantival commitments through the backdoor of field ontology.

  **Residual Disagreements**

  **On the Status of Indeterminism**
  *Substantivalist:* The indeterminism revealed is a genuine ontological cost required to maintain the reality of the manifold, highlighting a limitation in predictive power inherent to the theory.
  *Relationist:* The indeterminism is a spurious artifact generated by redundant description, and accepting it as real is an unnecessary metaphysical burden unsupported by physics.

  **On Sophisticated Substantivalism**
  *Substantivalist:* Sophisticated substantivalism is a stable position that retains point individuality while accepting Leibniz equivalence as a modal constraint on haecceitistic distinction.
  *Relationist:* Sophisticated substantivalism is relationism under another name, as accepting Leibniz equivalence effectively voids the individuality it claims to preserve.

  **On the Verbal Nature of the Dispute**
  *Substantivalist:* The dispute is not merely verbal because the commitment to point individuality entails distinct truth conditions for claims about future field values at specific points.
  *Relationist:* The dispute is largely verbal because both sides agree on all invariant physical facts, differing only on whether to label gauge-related mathematical structures as distinct worlds.

  **Table of Cruxes**

  | Crux | Substantivalist Formulation | Relationist Formulation | Agreed Evidence | Substantivalist Prediction | Relationist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **(a) The Reference Fluid** | Indeterminism persists because the fluid merely labels points which remain distinct individuals regardless of material coupling. | Indeterminism vanishes because the fluid fixes the gauge, showing the hole argument relies on bare points devoid of physical identity. | Whether coupling to matter restores determinism in the formalism without altering the manifold ontology. | Indeterminism remains. | Indeterminism removed. |
  | **(b) The Hole with No Outside** | Global indeterminism remains as points retain identity without boundary conditions to anchor them. | Argument lapses as global diffeomorphisms are gauge symmetries without fixed regions to anchor identity. | Analysis of global constraints in compact cosmologies without boundary data. | Global indeterminism. | Argument lapses. |
  | **(c) The Small Symmetry Group** | Argument reconstructs, showing indeterminism stems from covariance generally, not just general relativity. | Argument fails, showing the problem is specific to lack of background structure, not covariance itself. | Formal reconstruction of hole argument in special relativistic or Newtonian contexts. | Reconstructs successfully. | Fails to reconstruct. |
  | **(d) The Successor Theory** | Dispute transfers to whatever ontology replaces the manifold, preserving the need for individuality in the fundamental structure. | Dispute dissolves as spacetime emerges relationally, removing the substrate for the argument entirely. | Ontological status of spacetime in viable quantum gravity candidates. | Dispute transfers. | Dispute dissolves. |
