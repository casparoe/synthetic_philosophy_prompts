answer: |-
  ### Load-Bearing Assessment

  The entire argument rests on §3's claim that normative weight attaches to constitutive participation (§3ii) independently of causal impact (§3i). The "Fixed-Contract" case (§4) is the stress test: if you stipulate away all causal leverage, you must explain why the constitutive link retains normative force without collapsing into mere expression (§2c) or complicity (§2d). The vulnerability is that "constituting a practice" looks causally inert if the practice persists regardless of your instance. If your removal doesn't change the practice, in what sense are you sustaining it?

  ***

  ### Critical Critique

  **(1) Invalid Steps and Quiet Assumptions**
  §3 is the weak link. You assert that "the moral weight rides on (ii)" without arguing *why*. You treat this as a reframing, but it's actually a substantive normative claim that requires defense. You are assuming that participation in a harmful practice is itself a harm-bearing relation, independent of outcome. That's not a dialectical shift; it's a conclusion you haven't earned. Additionally, §4's stipulation is too aggressive. By ensuring the animal is dead and the contract fixed, you sever the link between the practice and the harm so thoroughly that the intuition pump runs dry. If the harm is completely invariant to the practice in this instance, why is the practice harmful? You are smuggling in the harm of the *general* practice to condemn the *specific* instance, which begs the question.

  **(2) Distinct Position or Notational Variant?**
  It collapses into (d) (Kutz-style complicity) unless you sharpen the "constitutive" mechanism. Kutz argues that intentional participation in a collective endeavor makes one accountable for the ends of that endeavor. Your view sounds identical unless you specify that the "practice" exists structurally independent of the participants' shared intentions. If your view requires shared intention, it's Kutz. If it doesn't, you need to explain how I constitute a practice I don't intend to support (e.g., buying the burger out of ignorance). To make this distinct, you must argue that the *structure* of the practice imposes duties regardless of the agent's intentional alignment. Without that, you've just renamed complicity.

  **(3) The Strongest Unaddressed Objection**
  The "Inertia of Mass Practices" objection. You claim abstaining "thins a practice's grip." But in mass markets, one instance does not thin the grip; the practice is robust to individual subtraction. If the practice persists identically without me, I am not constituting it in any meaningful sense; I am merely coinciding with it. If constitution requires necessity (even partial), you fail. If constitution allows for redundancy, then the normative force dilutes to zero. You need to explain why being a *redundant* constituent carries moral weight. Otherwise, you're saying I'm responsible for the wall because I'm a brick, even if removing me leaves the wall standing.

  **(4) Cases That Break the Constitutive Claim**
  *   **The Beneficial Deviant:** A corrupt policing practice exists (e.g., racial profiling). I am a cop. I engage in the practice (fill out the forms, follow the protocol) but I do so to gain leverage to dismantle the unit from within. My instance constitutes the practice formally, but my intent and actual outcome are reformist. Your view seems to condemn me for constituting the harm, whereas intuition suggests I'm permissible or even obligatory.
  *   **The Invisible Consumer:** I buy the cheap t-shirt from a company using slave labor, but I live in a sealed community where my consumption patterns are never observed and never influence demand data (a stronger version of your fixed contract). The practice continues, but my "instance" is physically isolated from the production chain. If the relation is constitutive, am I liable? If yes, the view becomes overly demanding (liable for everything I touch). If no, you've reintroduced causal/observational constraints, undermining §3.

  **(5) Honest Verdict: New or Old News?**
  Old news. It collapses into (d) with a veneer of practice-based ontology. The move from "causal impact" to "constitutive participation" is the standard move made by complicity theorists over the last two decades. The only potential novelty is the focus on the *density of instances* holding up a practice, but without a mechanism for how one instance affects that density, it's rhetorical. You are effectively arguing for a duty not to align oneself with harmful structures, which is expressivism (c) dressed in structuralist clothing.

  **(6) Cutting to Twenty Minutes**
  Cut §2 entirely. Your audience knows the literature; summarizing expected utility and Kutz wastes time. Cut the voting worry in §5; it's a distraction. Spend the time on §3 and §4, but tighten §4. Don't stipulate away *all* causal connection (the bin scenario is too extreme); stipulate away the *threshold* effect but keep the market signal alive. Focus entirely on defending the claim in §3 that constitution carries weight independent of causation. That is the only thing that matters. If you can't defend that in 15 minutes, the paper doesn't work.
