  ***

  ### The Toast

  Good evening. For those who don't know me, I was Miriam's student, and for the last twenty years, her interlocutor.

  We are gathered to mark the end of Miriam's formal tenure. But if you know her work, you know that "end" is a tricky notion in this room. Miriam has spent forty years arguing that a specific structure repeats itself. She claims that the way a nucleic acid strand behaves and the way a logical system refers to itself are not just similar. She says they are the same arrangement of parts, appearing in two different moods.

  I want to say something about that claim, and about why I am standing here, disagreeing with her, to wish her well.

  To the family here, including [Granddaughter's Name], who has heard the word "isomorphism" since she was in high chairs: Miriam's idea is about reading and doing. Imagine you have a strip of tiles. You can look at the tiles as physical objects, things you can touch and move. But in Miriam's system, the arrangement of those tiles also tells you how to move them. The strip is the material being worked on, and at the same time, it is the set of rules for the work.

  In her formal system, a strand is a string of four letters. Read in groups of three, each group names an operation: cut, delete, move, copy. The strand builds the tool that acts on the strand.

  Now, to my colleagues in the biology department. I know many of you have rolled your eyes at the Gödel comparisons over the decades. You are right to be skeptical. A cell is not a formal system. It is wet, it is hot, and it is messy. Miriam's formalism leaves out the thermodynamics. It leaves out the kinetics. It treats the strand as a static inscription when in the lab it is a dynamic chemical participant. I concede this: the analogy only holds if you strip away the chemistry that makes life possible. You have taught us that the physics matters as much as the pattern. Miriam knows this. She has spent the last five years trying to bridge that gap.

  This brings me to the logicians in the room, and the technical heart of the matter. Miriam's system relies on a specific feature: the map from the triplets to the operations is many-to-one. Several different triples yield the same amino acid, the same operation. And crucially, no operation in the system runs that map backwards. You cannot look at the enzyme and recover the unique strand that made it. This degeneracy is essential. It means the system can tolerate change without losing function.

  In her last seminar, Miriam proposed we relax the definition of a self-replicator. She suggested that if a strand's enzyme produces two new strands that are *almost* the same as the original—with high probability and small edit distance—we should count that as self-reference. Her slogan was that replication is self-reference with the identity condition relaxed.

  And here is where I dissent. I have said this in print, and she has read it. If you relax the identity condition, you lose the Gödelian link. Gödel's sentence depends on exactness. It depends on the code being invertible enough to point precisely to itself. If you allow approximation, you no longer have a sentence about itself. You have a process that tends to reconstitute its inputs. That is a profound biological truth, but it is not the logical truth Miriam spent forty years defending.

  I tell you this not to spoil the evening, but because Miriam asked me to speak precisely *because* I think she is wrong about this. She values the friction. She has always believed that the truth is found where the argument is sharpest. She did not want a eulogy for her career while she is still sitting at the table. She wanted the work to remain live.

  So, I will not sum up her life. I will not tell you that she "changed the field" or "paved the way." Those are arcs, and Miriam's work does not move in a line; it moves in loops.

  Instead, I want to return to where I began. The strip of tiles. The reading and the doing.

  For forty years, Miriam has looked at that strip and insisted that the reading and the doing are one structure. I think the relaxation she proposes separates them again. But in doing so, she has forced all of us—logicians, biologists, and family—to look at the strip more closely than we ever would have otherwise. She has made us check the triples. She has made us check the operations.

  Whether the structure is identical or merely analogous, the act of looking is what remains. The strand is read two ways at once. And tonight, we read Miriam two ways at once: as the colleague who built the system, and as the friend who invites us to break it.

  I would like to propose a toast. Not to a conclusion, but to the continuation of the argument.

  To Miriam.

  ***

  ### Appendix: Technical and Interpretive Notes

  **1. Technical Wince-Points for Logicians**
  *   **Typogenetics vs. Reality:** Logicians will note that Typogenetics (from *GEB*) is a toy formal system, not a model of actual molecular biology. While the speech concedes this to the biologists, a strict logician might wince at the implication that the "many-to-one" mapping in Typogenetics perfectly mirrors the degeneracy of the genetic code in a way that supports Gödelian isomorphism. The speech treats the formal system's properties as if they are the primary object of study, which they are for Halloran, but the leap to "nucleic acid replication" in the opening paragraph blurs the line between the model and the target.
  *   **Invertibility:** The speech states, "It depends on the code being invertible enough to point precisely to itself." A logician might note that Gödel numbering is bijective (invertible), but the self-referential sentence does not require the *system* to invert the mapping to function, only that the mapping exists. The speech simplifies the arithmetization of syntax for the sake of the analogy.

  **2. Contested Readings of Self-Replication**
  *   **The Relaxation:** The speech frames Halloran's shift to stochastic replication as a potential death of the Gödel analogy. This leans on a contested reading of what "self-reference" requires in a physical system. Many theorists in artificial life argue that *functional* self-reference (maintaining organization despite material turnover) is the only kind that matters physically. The speech takes the hard line that without exact identity, it isn't "Gödelian," which is the speaker's dissent, but it presents this as a definitive boundary rather than one side of an ongoing debate in the philosophy of biology.
  *   **Copy vs. Quotation:** The speech alludes to the copy/quotation distinction but does not explicitly define it in the formal sense (token vs. type) to keep it accessible for the family. This leaves the technical distinction slightly soft for the logicians, relying on the "reading/doing" metaphor to carry the weight.
