      *   **Correction:** User noted they might have typo'd "extrapolation" (they wrote "extraploation"). I should use the correct spelling without making a big deal of it.

  2.  **Deconstruct Coherent Extrapolated Volition (CEV) for this Context:**
      *   *Original CEV (Yudkowsky):* What we would want if we knew more, thought faster, were more the people we wished we were, had grown up farther together.
      *   *Adapted for Governance:* What would the community agree to if they understood the technical constraints, weren't emotionally reactive, and considered the long-term health of the commons?
      *   *Operationalization:* It's not about asking "Do you want this?" It's about asking "Does this align with the *purpose* of the commons under idealized conditions?"

  3.  **Drafting the Decision Procedure (The "CEV Filter"):**
