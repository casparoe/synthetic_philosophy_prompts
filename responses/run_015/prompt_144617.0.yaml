answer: |-
  This is a sophisticated reading of the text, and your concept of "normative recoil" captures something Thucydides implies but rarely states explicitly. You are right to be suspicious of the idea that the Athenian *demos* "learned" in any stable, pedagogical sense. Thucydides is generally too pessimistic about human nature (*anthrōpeia physis*) to suggest that democratic bodies accumulate wisdom.

  Here is a parsing of the logic of the second vote, the distinction between the Mytilene and Sicilian episodes, and how the Socrates trial fits into this framework of democratic volatility.

  ### 1. Mytilene: Recoil vs. Rationalization
  Your intuition that the reversal was "normative recoil" rather than deliberative improvement is supported by the timeline Thucydides provides. He writes that after the first decree was passed, "as soon as it was night, the Athenians **repented** (*metemelēse*) of their cruel and exaggerated resolution" (3.36).

  Crucially, this repentance happens *before* the second assembly convenes. The "learning" did not occur *in* the debate; the debate was merely the arena where the recoil was either ratified or suppressed.

  **Diodotus's Strategy:**
  This changes how we read Diodotus. He does not create the mercy; he protects the recoil.
  *   **The Trap:** Cleon argues that a democracy is incapable of holding an empire if it is swayed by pleasure in listening (i.e., if it allows debate to reverse decisions). He frames the recoil as weakness and inconsistency.
  *   **The Counter:** Diodotus knows he cannot appeal to morality. He explicitly says, "I will not argue that it is unjust to put them to death... I will speak only of expediency."
  *   **The Logic:** Diodotus treats the crowd as irrational actors driven by hope and passion. He argues that if you punish the guilty and the innocent alike (as the first decree demanded), you remove the incentive for a rebel city to surrender early. Why surrender if you die either way?

  **Is it Genuine Rationality?**
  It is *instrumental* rationality, not moral rationality. Diodotus is essentially hacking the crowd's psychology. He knows that if he appeals to their humanity, Cleon will paint him as a traitor or a bribe-taker. So, he cloaks the "normative recoil" (horror at cruelty) in the language of cold Realpolitik.
  *   **Verdict:** Thucydides frames this not as the democracy becoming "smarter," but as the democracy successfully navigating a momentary emotional hangover. The correction was accidental in the sense that it relied on the specific emotion of *regret*, which is fleeting. Diodotus's speech was a container to keep that regret from evaporating under Cleon's pressure.

  ### 2. The Sicilian Contrast: Anger vs. Desire
  Your comparison to the Sicilian Expedition (Book 6) is the key to unlocking Thucydides' view on democratic correction. Why did the mechanism work at Mytilene but fail in Sicily?

  *   **Mytilene (Orgē/Anger):** The first decree was passed in a fury. Anger is a hot emotion that burns out. It has a saturation point. Once the fury cools (the "night after"), the normative recoil sets in. The democracy can correct itself because the driving passion is self-limiting.
  *   **Sicily (Eros/Desire):** The drive to invade Sicily is described by Thucydides using the language of *eros* (sexual desire/longing). Alcibiades whips up a longing for conquest. Nicias tries to use Diodotean logic (arguing expediency/cost) to stop them.
  *   **The Failure:** When Nicias argues that the expedition will be too expensive and difficult, the crowd does not recoil; they get *more* excited. Unlike anger, desire expands when fed. The "recoil" mechanism requires a moment of horror or satiation. With Sicily, the *demos* was intoxicated by the *hope* of gain.

  **Thucydides' Conclusion:** Democratic correction is not a structural feature; it is context-dependent. It works when the passion is negative (anger/guilt) but fails when the passion is positive (greed/hope). In Sicily, there was no "morning after" until it was too late (the destruction of the fleet in 413 BCE).

  ### 3. The Socrates Connection: When Recoil Fails
  Connecting this to the trial of Socrates (399 BCE) is insightful, even though Thucydides' history breaks off before that event. The trial of Socrates can be read as a catastrophic failure of the "normative recoil" mechanism for two reasons:

  **A. The Nature of the Trauma**
  Mytilene happened during the war, but Athens was still dominant. The "recoil" was possible because Athens could afford to be merciful.
  By 399 BCE, Athens had lost the war, suffered the plague, endured the oligarchic coup of the Thirty Tyrants, and seen mass executions of its own citizens. The trauma was existential. In this context, the "recoil" mechanism is short-circuited by survival anxiety. The assembly wasn't acting out of *orgē* (hot anger) or *eros* (greed); it was acting out of *phobos* (fear) and a need for purification. You cannot expect a recoil toward mercy from a body that feels it is cleansing itself to survive.

  **B. The Absence of the Diodotean Figure**
  In the Mytilene debate, Diodotus succeeded because he could translate mercy into interest. In the trial of Socrates, the charges were "corrupting the youth" and "impiety."
  *   To defend Socrates effectively, one would have to argue that killing him was not in Athens' *interest*.
  *   However, in the post-war atmosphere, the "interest" of Athens was defined as restoring traditional piety and discipline. Socrates was symbolically linked (fairly or not) to the intellectual elitism that had undermined the democracy (e.g., Alcibiades, Critias).
  *   Unlike Mytilene, where the "cruelty" was obvious (killing everyone), the "cruelty" of killing Socrates was abstract. There was no immediate "horror at the image" to trigger the recoil. The violence was legalistic, not visceral.

  ### Summary: Is Democracy Self-Correcting?
  Thucydides suggests that democracy is **not** self-correcting through reason. It is only self-correcting through **emotional metabolism.**

  1.  **Mytilene:** The emotion was anger. Anger cools. The *demos* felt shame. A speaker (Diodotus) successfully codified that shame into policy. **Result: Correction.**
  2.  **Sicily:** The emotion was desire. Desire heats up. The *demos* felt hope. A speaker (Nicias) tried to use reason to dampen it, but reason cannot fight *eros*. **Result: Disaster.**
  3.  **Socrates:** The emotion was fear/trauma. Fear hardens. The *demos* sought scapegoats. No speaker could translate mercy into security. **Result: Rigidification.**

  Your "normative recoil" theory holds up well. Thucydides shows us that the "wisdom of crowds" is actually just the volatility of crowds. Sometimes that volatility swings back toward mercy (Mytilene), and sometimes it swings toward destruction (Sicily/Socrates). The difference isn't the quality of deliberation; it's the specific passion driving the assembly at that moment. Diodotus didn't teach the crowd to be rational; he just caught them while they were tired of being angry.
