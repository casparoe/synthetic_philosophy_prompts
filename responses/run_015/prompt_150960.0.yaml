  hey, im drafting a novel set in a decaying archive-city and i need a short story scene that lives inside Nietzsche's three history modes—monumental, antiquarian, critical—not as lectures but as actual tensions in objects and actions. specifically: the protagonist is an archivist who uses monumental history to rally workers against a corrupt guild, but the workers just start copying dead heroes and freeze; she tries antiquarian preservation and ends up hoarding every broken contract until she cant make a decision; then she realizes critical history means she has to burn the founding charter to actually live, but the guild is using that same charter monumentally against her. can you write this as fiction, maybe 400 words, where the philosophical conflict is in what she touches and destroys, not in dialogue explaining it? im trying to avoid the usual essay-style retelling, so please dont cite texts or hand me a bibliography—i just need the story to feel conceptually precise but weird and lived-in. also i typo alot so dont mind if this is messy.
