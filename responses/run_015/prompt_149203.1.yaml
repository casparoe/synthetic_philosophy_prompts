  | Point | Marks | Typical Mistake |
  | :--- | :--- | :--- |
  | **1. Formal Distinction (L vs. L*)** | 5 | Candidates conflate Minimal Liberalism (2 agents) with Universal Liberalism (all agents), failing to explain why Sen uses the minimal condition to strengthen the theorem. |
  | **2. Scenario Derivation** | 5 | Candidates fail to check the Pareto condition on {a, c} rigorously, incorrectly asserting unanimity exists without verifying Agent 2’s ranking, or miss the transitive step ($a \succ b \succ c \Rightarrow a \succ c$). |
  | **3. Misconception: Rights Incoherence** | 5 | Candidates argue Sen proves rights are logically impossible, rather than incompatible with specific aggregation axioms (Unrestricted Domain/Pareto). |
  | **4. Misconception: Weak Pareto** | 5 | Candidates claim switching to Weak Pareto solves the paradox costlessly, ignoring that the paradox arises *under* Weak Pareto (unanimity) and abandoning it permits Pareto-inferior outcomes. |
  | **5. Interpretive Stance** | 5 | Candidates offer vague philosophical musings without linking back to the formal derivation (e.g., failing to mention game forms or domain restrictions). |
  | **Total** | **25** | |

