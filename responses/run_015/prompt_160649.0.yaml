          *   *Core Claim:* Desert determines *mode* (censure/moral address) but not *magnitude* (hard treatment). Magnitude is forward-looking (risk, deterrence) constrained by least restrictive means and a dignitarian ceiling.
          *   *Consequences:* Non-dangerous wrongdoers get censure but no hard treatment. Dangerous minor wrongdoers get restraint but not as payback.
          *   *Mechanisms:* Severity Ledger (track expressive vs. managerial components), Double-Spend Prohibition (no double counting), Voice-Matching Requirement (offender must be able to answer the address).
