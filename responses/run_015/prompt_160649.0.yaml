  6.  **Drafting Section 4: The Question Hoping Nobody Asks:**
      *   *Candidate:* The "Empty Desert" problem. If desert doesn't change the outcome (magnitude), is it doing any normative work? Or is it just a ritual?
      *   *Why:* This strikes at the heart of the "Expressive Desert" claim. If I say it changes nothing but the *label*, the Compatibilist and Retributivist will both pounce.
      *   *Honest Answer:* Admit it's a thin concept, but argue it protects status.

  7.  **Review and Refine:**
      *   *Tone:* Professional, strategic, candid.
      *   *Formatting:* Clear headings, bullet points for readability during a talk.
      *   *Check Constraints:* American English? Yes. No external lit? Yes. Anchored in view? Yes.
