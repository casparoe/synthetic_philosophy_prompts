      *   *6. The Judge:* "The Severity Ledger is unworkable. Judges can't parse motives like that." (High Damage, Med Likelihood - practical viability).
      *   *7. The Grad Student (Sharp):* "The Double-Spend Prohibition. How do you stop judges from smuggling desert into risk?" (Med Damage, High Likelihood).
      *   *8. The Voice-Matching/Hard Case:* "Corporations/AI. They can't answer. Do they get no censure? If so, isn't it just management?" (High Damage, Med Likelihood - theoretical coherence).
      *   *9. The Dignitarian Ceiling:* "Who sets the ceiling? If not desert, what stops utilitarian horror?" (High Damage, Med Likelihood).
      *   *10. The Non-Dangerous Wrongdoer:* "Murderer retires. You censure but release. Victims feel betrayed." (Med Damage, Med Likelihood).

      *Refining Phrasing:* Make them sound like the specific personas.
