answer: |-
  There is no single canonical term of art that tightly covers all three misapplications plus the variance-sensitivity mechanism you describe. The phrase **"the heritability fallacy"** is the closest umbrella, but it is often used loosely, sometimes referring only to the between-group inference (Lewontin's fallacy) or only to individual attribution. Because you are writing a methods section where precision is paramount, relying on the umbrella term without qualification risks ambiguity.

  I recommend coining **"the variance-attribution fallacy"** for your manuscript. This label captures the core logical error: treating a population-level variance ratio ($V_G/V_P$) as a measure of individual causal attribution or group-difference etiology.

  **Definition for your methods section:**
  > *The variance-attribution fallacy occurs when a heritability estimate ($h^2$), which quantifies the proportion of phenotypic variance attributable to genetic variance within a specific population and environment, is misinterpreted as: (1) the proportion of an individual's trait value caused by genes; (2) an explanation for mean differences between populations; or (3) a measure of the trait's immutability. This error ignores that $h^2$ is inversely dependent on environmental variance ($V_E$); thus, successful environmental standardization increases $h^2$, paradoxically making a trait appear more "genetic" precisely when it is most amenable to environmental intervention.*

  **Regarding your specific questions:**

  1.  **Are the bullets one error?** Yes. They are all category mistakes involving the same statistic. They conflate a property of a *distribution* (variance) with a property of a *cause* (individual etiology) or a *difference* (group means). Your test cases (a) and (b) correctly identify that high $h^2$ is compatible with 100% environmental causality of the mean or the deficiency itself.
  2.  **Is the sensitivity bit the same phenomenon?** It is the mechanistic reason the fallacy is dangerous. The error is the interpretation; the variance sensitivity is why that interpretation leads to false conclusions about interventions. Including it in the definition (as above) ties the logical error to its empirical consequence.
  3.  **Where is the line regarding selection?** The legitimate use of $h^2$ (e.g., the Breeder's Equation, $R = h^2S$) predicts the *response to selection* on the *existing* variance structure. It estimates how much the population mean will shift if individuals are selected based on the trait, assuming the underlying variance components remain constant. The fallacy occurs when $h^2$ is used to predict response to *environmental manipulation* (which changes $V_E$) or to claim the trait *cannot* be changed. The line is between predicting change via *selection on variance* (legitimate) versus claiming immunity to *environmental change* (fallacious).

  Using **"variance-attribution fallacy"** allows you to bypass the baggage of "reification" or "ecological fallacy" while signaling to reviewers that you understand the statistical nuance. It isolates the specific move of converting a variance ratio into a causal weight.
