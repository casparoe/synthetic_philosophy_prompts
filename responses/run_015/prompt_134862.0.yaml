prompt: |-
  You're a professional philosopher who specializes in comparative ethics and also writes literary fiction, so think like both at once. Before you write anything, take a minute to brainstorm: what does a social role actually feel like when the other person who completes it is gone but the institutional structure is still there? I'm in a course on Confucian role ethics and my professor keeps saying that for Confucians you're not really a bare individual — you're more like a knot in a web of relationships (parent-child, ruler-subject, elder-younger sibling, that kind of thing). But I'm confused about how "shu" (reciprocity) and "ren" (humaneness) work if one side of the knot is missing.

  Write a short story — maybe around 800 words, casual tone is fine, you can even slip in a typo or two — about Lin, who works as a "role mediator" in a near-future city where an aging bureaucratic AI still tracks Confucian-style social roles for tax and ritual purposes. Lin gets assigned a "ghost role": she's registered as a "filial daughter" with full obligations, but her parents died years ago and the system never got the paperwork to dissolve the bond. Meanwhile she also has living roles — she's a junior collegue and an elder sister — and those keep generating real, reciprocal demands. The story should explore what happens when she tries to practice "shu" (putting herself in the other's place) but realizes the other is literally absent, and whether "li" (ritual propriety) can mean anything when there's no partner to recieve the ritual. Don't lecture me on Confucianism; just show it through her choices. Maybe she considers hacking the database to kill the ghost role, or maybe she starts performing the rituals alone in an empty apartment. I want to know what it costs her either way. Start with a quick outline of the central tension, then write the story.
