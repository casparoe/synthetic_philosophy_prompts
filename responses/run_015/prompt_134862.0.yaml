answer: |-
  **Outline of Central Tension**
  *   **The Conflict:** Lin is bound by a bureaucratic AI to the role of "Filial Daughter," but the counterparts (her parents) are dead. The structure exists without the relationship.
  *   **The Ethical Problem:** Confucian ethics suggests the self *is* the relationship. If the relationship is one-sided, does the self degrade? Can *li* (ritual) sustain *ren* (humaneness) without a recipient?
  *   **The Choice:** Lin can hack the system to dissolve the role (freedom from obligation) or perform the rituals alone (sustaining the role despite asymmetry).
  *   **The Cost:** Hacking costs memory and continuity of self. Performing costs emotional energy with no reciprocal return (*shu* becomes imagination, not interaction).

  ***

  **The Ghost Knot**

  The notification pinged at 6:00 AM sharp. *State Harmony Bureau: Filial Obligation Cycle 442 Pending. Please submit proof of care.*

  Lin swiped it away, but the red dot stayed like a bruise on her retina. She was a Role Mediator by trade, fixing these glitches for other people, but she couldn't fix her own file. The AI, old and rigid as concrete, still listed her parents as "Active Dependents." They'd been dead for five years. But until the paperwork processed—which meant waiting for a human clerk who didn't exist anymore—she was legally a daughter.

  In this city, you weren't a person until you were a node in someone else's network. No bare individuals allowed.

  Her sister, Mei, called while Lin was boiling water. Mei was alive, which meant her demands were heavy and real.

  "Can you transfer the rent subsidy?" Mei asked. No hello. That was the thing about living roles; they had teeth. They bit back.

  "I sent it yesterday," Lin said.

  "It didn't clear. You know how the system gets. Also, Mom's birthday is next week. Are you doing the thing?"

  Lin looked at the two empty chairs at her kitchen table. "I'm handling it."

  "You shouldn't waste credits on the ghost roles, Lin. Just hack the registry. I can send you a script. You're not actually a daughter if there's no one to be a daughter *to*."

  Lin hung up. She stared at the kettle. Mei was wrong, but not about the tech. She was wrong about the knot. If Lin cut the string, who was Lin? Just a mediator. A functionary. The grief wasn't the point; the position was.

  She set out three cups. One for Mei, one for Father, one for Mother.

  This was where *shu* got tricky. Reciprocity usually meant measuring the other's weight against your own. *Do not impose on others what you do not desire.* But how do you weigh a ghost? Lin had to imagine what they would want, which risked turning them into mirrors of herself. Was she honoring them, or just honoring her own memory of them?

  She poured the tea. The steam rose, thin and blue.

  The Bureau AI pinged again. *Non-compliance warning. Role integrity declining.*

  If she hacked it, the red dot would vanish. She'd be free of the tax penalties, the mandatory ritual hours. She could be a modern individual, unbound. But then the tea would just be tea. The chairs would just be furniture. The structure of her morning would collapse into mere habit.

  If she kept the role, she had to perform *li* without a partner. Ritual propriety usually harmonizes two people. Here, it would just be her, moving in a pattern designed for a duet.

  Lin picked up the cup meant for her father. She held it with both hands, the way he taught her. She lowered it to the table. She didn't drink it.

  It felt absurd. It felt necessary.

  The cost wasn't the tea leaves or the credits. It was the energy required to sustain a connection that didn't conduct electricity back. It was exhausting being the only live wire in the circuit. Her *ren*—her humaneness—felt like it was leaking into the floorboards.

  But if she stopped, the knot untied itself. And if the knot untied, the web tore. Maybe not for the state, maybe not for Mei. But for her.

  She sat down in her own chair and waited. The AI stopped pinging. Maybe the sensors registered the heat of the cup. Maybe it was just a lag.

  Lin closed her eyes and tried to feel where their presence should be. She couldn't feel them, obviously. But she could feel the shape of the absence. It had edges. It had a texture.

  "Tea's ready," she said to the empty room.

  She waited for a response that wouldn't come. Then she drank her own tea, cold now, and logged the ritual as complete. The red dot vanished. She was still a daughter, definately, even if the only person believing it was her. And maybe that was enough to keep the web from unraveling completely.
