  The (3)/(7) clash weakens scientific realism. If sequences are contingent habits subject to hidden powers (7), induction yields probability, not "genuine knowledge" (3). To save (3), (7) must go. You lose skeptical caution but gain confidence in science as the study of God's consistent will.

