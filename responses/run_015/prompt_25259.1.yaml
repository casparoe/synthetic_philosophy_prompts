answer: |-
  Good evening. For those who don't know me, I'm [Your Name], and I have the distinct privilege of standing up here as the best man.

  When [Groom] and [Bride] asked me to give this toast, they gave me one instruction: "Don't make it boring." Given that they are both constitutional law professors, I realized the bar for "boring" is significantly higher for this room than for most.

  I know roughly a third of you could cite Jon Elster from memory. I know another third of you are just happy the open bar is open. And the rest of you are somewhere in the middle, wondering why we're talking about Greek mythology at a wedding.

  I promise to bring us all together.

  Because the story of how [Groom] and [Bride] fell in love starts with an argument. They met in law school, but their first real conversation happened over drinks, and the topic was *Ulysses and the Sirens*.

  For the family: In the Odyssey, Ulysses knows the Sirens' song will lure him to his death. So, he orders his crew to tie him to the mast. He restricts his own future freedom to save his future life.

  For the colleagues: It's the classic precommitment strategy to solve time inconsistency.

  The argument [Groom] and [Bride] had that night was about whether a Constitution is actually like Ulysses. Ulysses binds himself. But a Constitution? That's one generation binding *other* people. It's the past binding the future. Is that democratic? Is it even coherent? Who is really sovereign—the self that tied the knots, or the self that has to live inside them?

  They disagreed fiercely that night. They have disagreed productively ever since. And honestly, watching them debate is like watching a tennis match where the players respect the net more than the ball.

  But tonight, they are doing something that solves that philosophical problem. They are getting married.

  Marriage is, in a sense, the ultimate precommitment device. You are standing here, in your present selves, and you are tying yourselves to the mast. You are saying, "No matter what storms come, no matter what Sirens sing, we will not steer off course."

  Now, the philosophers in the room know the danger here. If marriage is just a constraint, it feels like a cage. If the "past self" binds the "future self" too tightly, the future self rebels. We've all seen marriages fail because the knots were tied out of fear, or control, or a desire to freeze time.

  But watching these two, I realize the difference.

  In their version of the Ulysses contract, they aren't binding each other *against* their will. They are binding themselves *to* each other's care.

  The philosophical problem asks: "Who is sovereign?" In a bad marriage, it's a power struggle. One person tries to be the drafter of the constitution, and the other is the subject. But in *this* marriage, the sovereignty is shared.

  [Groom] and [Bride], you are acknowledging that the future you cannot predict everything. You know that the person you are in ten years might want to cut the ropes. You know that life will offer distractions that sound like sweet songs but lead to rocks.

  So you are making a deal with the future. You are saying: "We trust the 'us' of today enough to restrict the 'us' of tomorrow. We trust that the love we feel right now is wiser than the impulse we might feel later."

  That is a terrifying thing to do. It requires humility. It requires admitting that you cannot navigate the sea alone.

  To the families: This isn't about restricting their freedom. It's about giving them a safe harbor. It's about knowing that when the world gets loud, they have a place where they are known, and held, and bound by love rather than by law.

  To the colleagues: They know the literature says precommitment is paradoxical. But they also know that some paradoxes are worth living inside.

  [Groom] and [Bride], you have spent years arguing about how to bind a self. Today, you stop arguing, and you start binding. Not to restrict who you will become, but to protect who you are together.

  May your knots hold fast. May your mast stand strong. And may you always find your way back to each other, no matter what song is playing.

  To [Groom] and [Bride].
