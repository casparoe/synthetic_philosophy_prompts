answer: |-
  Here is a lesson plan designed for your constraints, followed by a direct response to your three decisions and the specific pedagogical risks you identified.

  ### Session Title: "What You Didn't Say (But Did)"
  **Time:** 45 Minutes
  **Materials:** Whiteboard, marker.
  **Goal:** Equip novices to identify and challenge misleading claims that are technically true but conversationally deceptive.

  ---

  ### Part 1: The Plan (Minute-by-Minute)

  **0:00–0:05 | Introduction: The "Technically True" Dodge**
  *   **Action:** Write on the board: *"I never literally said that."*
  *   **Script:** "In your first rounds, you will hear an opponent make a claim that feels wrong. When you challenge them, they will point to their speech text and say, 'I never literally said that.' Today is about why that doesn't matter. We are going to learn how to hold speakers accountable for what they *convey*, not just what they *say*."
  *   **Setup:** Tell them you will use **one sentence** all hour. Write it in the center of the board:
      > **"Alex turned in the assignment."**

  **0:05–0:15 | Case 1: The Universal Implication (Addressing "Tone")**
  *   **Context:** Tell the room: "Imagine a teacher is deciding who gets a 'Hard Worker' award. The teacher asks, 'Who deserves this?' You reply: *'Alex turned in the assignment.'*"
  *   **Question:** "Does Alex get the award?" (Most will say no or hesitate).
  *   **Ask:** "Why not? The sentence is true. Alex did turn it in."
  *   **Expected Answer:** "It sounds like Alex *only* turned it in," or "You didn't say it was good."
  *   **Teaching Point:** "It's not about your tone of voice. You could say this cheerfully. The *words themselves* created the impression that Alex didn't do anything else. That impression is the target."
  *   **Misconception Defused:** *Conveyed content is not tone/attitude.* It is structural.

  **0:15–0:25 | Case 2: The Background Knowledge Switch (Addressing "Entailment")**
  *   **Action:** Erase the first context. Draw a new one.
  *   **Context:** "Imagine a different school. In this school, the only way to get a detention is failing to turn in assignments. The Principal asks, 'Does Alex have a detention?' You reply: *'Alex turned in the assignment.'*"
  *   **Question:** "Does Alex have a detention?" (Room will say No).
  *   **The Switch:** "Now, imagine a third school. Here, assignments are optional. Turning it in doesn't matter for grades or detention. The Principal asks the same question. You give the same answer."
  *   **Question:** "Does the answer mean the same thing?" (No. In School 3, the sentence implies nothing about detention).
  *   **Teaching Point:** "If the meaning were inside the sentence (entailment), it would stay the same in every school. Because the meaning changed when the *rules* changed, the meaning belongs to the **situation**, not the sentence."
  *   **Misconception Defused:** *Conveyed content is not logical entailment.* It depends on shared context.

  **0:25–0:35 | Case 3: The Debate Dodge (Addressing "Lying" & "Deniability")**
  *   **Context:** "Now we are in a debate round. Your opponent argues: 'Alex is an irresponsible student.' You stand up and say: *'Alex turned in the assignment.'*"
  *   **Analysis:** "You want the judge to think Alex is responsible. But if the judge asks later, 'Did you say Alex is responsible?' you want to say, 'No, I just said he turned it in.'"
  *   **Question:** "Is this a lie?" (Students will debate this).
  *   **Teaching Point:** "It's not a lie (the words are true). But it is **misleading**. You relied on the judge to fill in the gap. If you know the gap is false (e.g., Alex copied the homework), you are abusing the system."
  *   **Misconception Defused:** *This is not lying, but it is still unethical.* It exploits the listener's trust.

  **0:35–0:40 | The Tool: The "Reasonable Listener" Standard**
  *   **The Problem:** Address your concern about the Cancellation Test directly.
  *   **Script:** "Philosophers have a test for this. They ask: 'Can the speaker deny the extra meaning without contradicting themselves?' Technically, yes. You *can* say, 'Alex turned in the assignment, but I'm not saying he's responsible.' But in debate, that doesn't let you off the hook."
  *   **The Rule:** "If a **reasonable listener** would understand the claim, you own it. If you have to cancel the meaning later, you admit you misled them initially."
  *   **Whiteboard:** Write: **"If you imply it, you defend it."**
  *   **Instruction:** "When an opponent does this, don't ask 'Did you say that?' Ask: 'Why did you choose those words if you didn't want us to think that?'"

  **0:40–0:45 | Wrap Up: Vocabulary and Ethics**
  *   **Terminology:** "Philosophers call this **Implicature**. It means 'what is folded into the message.' You don't need to use that word, but you need to use the concept."
  *   **Cooperation:** "Communication works because we assume people are trying to be helpful. When an opponent hides behind literal truth, they are breaking that contract. Your job is to point out the breach."
  *   **Final Check:** Ask one student: "If I say 'The cafeteria food is edible,' what am I implying about the taste?" (Answer: It's bad). "If I challenge you, can you say 'I never said it was bad'?" (Answer: You can say it, but you lose the round).

  ---

  ### Part 2: Reviewing Your Three Decisions

  **1. The Carrying Example**
  *   **Your Decision:** A single utterance from school life, literally true, context-sensitive.
  *   **My Verdict:** **Keep this.** It is the strongest pedagogical choice. Using one sentence ("Alex turned in the assignment") and changing the *world* around it proves that the meaning isn't in the words.
  *   **Refinement:** Ensure the example is "faint praise." "Alex turned in the assignment" works because it omits quality. Another option: "Alex was present for the meeting." (Implies he didn't speak). Stick with the homework one; it's universally understood by 9th graders.

  **2. The Order of Cases**
  *   **Your Decision:** (1) Everyone gets it; (2) Background knowledge dependent; (3) Deniable/Dodge.
  *   **My Verdict:** **Keep this order.**
      *   *Why:* Case 1 builds confidence ("We all see it"). Case 2 introduces the theory ("It depends on context") without jargon. Case 3 applies it to the adversary ("Here is how they will hurt you").
      *   *Risk:* If you start with Case 3 (The Dodge), the room becomes adversarial immediately. Starting with Case 1 makes it a puzzle they solve together.

  **3. The Cancellation Test Problem**
  *   **Your Decision:** You are worried teaching the test empowers the dodge.
  *   **My Verdict:** **Overturn your method, keep the insight.** Do not teach the Cancellation Test as a *right* of the speaker. Teach it as a *burden* of the speaker.
      *   *The Fix:* In the plan above, I renamed it the "Reasonable Listener Standard." In philosophy, cancellation proves something *was* an implicature. In debate, cancellation proves the speaker *was misleading*.
      *   *Framing:* "If you can cancel it, it means you didn't say it. If you didn't say it, but you wanted us to believe it, you deceived us." This turns the test into a weapon *against* the dodger, not for them.

  ---

  ### Part 3: Addressing Misconceptions in Sequence

  You listed four misconceptions. Here is where they appear in the flow above:

  1.  **"It's just tone/attitude."**
      *   **Defused in Case 1.** Explicitly state: "You could say this happily. The meaning is still there."
  2.  **"It's the same as entailment (logical implication)."**
      *   **Defused in Case 2.** By changing the school rules and showing the meaning vanishes, you prove it is not logically contained in the sentence.
  3.  **"It's lying under another name."**
      *   **Defused in Case 3.** Distinguish between *falsehood* (lying) and *misleading truth* (implicature). This is crucial for debate judges who might rule "It wasn't a lie" unless you explain the distinction.
  4.  **"The Maxims are rules of politeness."**
      *   **Defused in Wrap-Up.** Do not teach the Maxims (Quantity, Quality, etc.) explicitly. It is too abstract. Instead, call it "The Rule of Helpfulness." If you treat them as politeness rules, students will think they can break them to be "rude" or "aggressive." Frame them as **rules of information exchange**.

  ---

  ### Part 4: Smaller Decisions & Risks

  **1. Explicit Cooperation vs. Implicit**
  *   **Recommendation:** **Make it explicit, but simple.**
  *   **Why:** Novices often think debate is war. If they think the goal is to win at all costs, they will use implicature to trap opponents. You need to state: "Debate is a cooperative search for truth, even if we disagree." If you leave this implicit, the "dodge" becomes a valid tactic.
  *   **How:** Use the phrase "Rules of the Game." "We assume opponents are informing us, not tricking us. When they trick us, we call it out."

  **2. Introducing the word "Implicature"**
  *   **Recommendation:** **Wait until the final 5 minutes.**
  *   **Why:** The word is a barrier. If you start with "Today we learn Gricean Implicature," you lose the room. Let them master the *concept* first. The word is just a label for what they already figured out. It gives them confidence to know there is a real name for it.

  **3. The Debate-Club Framing Risk**
  *   **Your Concern:** Teaching them to treat conveyed content as a tactic rather than a feature of talk.
  *   **My View:** **This is a high risk.** If you teach them how to spot implicature, they will immediately try to use it to sneak claims past judges.
  *   **Mitigation:** You must frame accountability as a **voting issue**.
      *   *Script:* "If you catch an opponent doing this, you don't just say 'That's implicature.' You say: 'My opponent is relying on a misleading implication rather than a proven claim. Because they cannot defend the literal claim, they should lose this argument.' Make it costly for them."
      *   *Aim:* Aim for **Clarity**, not **Cleverness**. The goal of the session is not to make them better at hiding; it is to make the round honest enough that hiding doesn't work.

  ### Final Check for Understanding
  To ensure the idea has landed, do not ask "Do you understand?" Ask:
  *"I am holding a pen. I say 'This pen has ink in it.' In what situation would that make you think the pen doesn't work?"*
  If they can generate a context (e.g., "If I'm asking to borrow a working pen"), they have mastered the lesson.
