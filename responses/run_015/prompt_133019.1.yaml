      *   *The Tool (5 mins):* How to challenge it (The "Reasonable Listener" standard).
      *   *Wrap (5 mins):* Terminology and Ethics.

      *   *Refining the Carrying Example:* I need *one* example that carries the session, per the prompt ("the one example that should carry the session"). But the user *also* asked for "Three cases."
      *   *Correction:* The prompt says "the one example that should carry the session" in the first paragraph, but then in "Three things I have decided," says "Second, I want three cases."
