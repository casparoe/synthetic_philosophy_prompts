prompt: |-
  I am a junior at a large public high school, and I have been asked to lead one forty-five-minute session for the new members of our debate club: about twenty-five ninth and tenth graders, almost none of whom have studied philosophy, with a whiteboard and no assigned reading. The request comes from a practical problem rather than a syllabus. In novice rounds, speakers constantly land a cutting or misleading claim and then, when challenged, retreat behind the fact that they never literally said it. The coach wants the newcomers to have a vocabulary for what a speaker manages to convey without having said it. I have been reading a little about Grice on speaker meaning and conversational implicature, and I have some half-formed ideas about how to use it, but what I need is a plan for teaching it rather than an explanation of it: the order the ideas must come in and why, the one example that should carry the session, the misconceptions to expect and where in the sequence to defuse each, a check at the end that would show the idea has landed, and what I should openly decline to cover.

  Three things I have decided, which you should feel free to overturn. First, the carrying example should be a single utterance drawn from school life that is literally true in every detail and yet conveys something its speaker would disown, and it must have this property: changing one detail of the surrounding situation, while leaving the words untouched, switches the extra content off. I want that maneuver to be available mid-session so the group can see for themselves that the extra content is not sitting inside the sentence. Please do not use the philosophy-job recommendation letter; it is the only example I could find online, and my classmates have never been in anything like it.

  Second, I want three cases, and I am unsure of their order: one whose extra content the entire room gets at once; one that only part of the room gets because it depends on background knowledge only some of them share, which I want to use to force the question of whether the conveyed content belongs to the sentence or to the utterance in its context; and one where the speaker wants the hearer to work the content out and also wants to be able to deny it afterwards.

  Third, here is where I think my plan may collapse. I had intended to give them the cancellation test: if the speaker can append a denial of the extra content without contradicting the original sentence, then that content was only conveyed, not said. But a sharper student will notice that this lets every speaker off the hook, since the retreat to the literal content is always available — which is precisely the dodge the novices are abusing. If the test licenses that, the session will have handed them a more sophisticated version of the move I am trying to disarm. So I need to know where in the sequence to raise this, and how to frame the test so that it does not collapse into the conclusion that the speaker always wins.

  The misconceptions I expect, which I would like placed in the sequence rather than merely listed: that the conveyed content is just the tone or attitude of the message; that it is the same as what the sentence implies or entails; that it is lying under another name; and that the maxims, if I name them at all, are rules of politeness that the speaker broke. Tell me what I have missed. I would also like your view on two smaller decisions: whether to make explicit the assumption that the speaker is still trying to be cooperative and informative, or to leave it implicit and let the cases do the work; and whether to introduce the word "implicature" at all before the final ten minutes. Finally, if you think the debate-club framing risks teaching them to treat conveyed content as a tactic rather than as an ordinary feature of talk, say so and tell me what to aim at instead. Please do not suggest readings or citations; they will not do any homework.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Target Audience:** 25 novice debaters (9th/10th graders), no philosophy background.
      *   **Setting:** 45-minute session, high school, whiteboard available, no reading.
      *   **Goal:** Teach them to identify and challenge claims that are conveyed but not literally said (to stop the "I never literally said that" dodge).
      *   **Content:** Based on Gricean speaker meaning/implicature, but focused on *teaching plan*, not theory explanation.
      *   **Constraints/Decisions to Review:**
          1.  *Carrying Example:* Must be school-life based, literally true, conveys something disownable, context-sensitive (change context -> change meaning). *No* philosophy recommendation letter.
          2.  *Three Cases:* (1) Everyone gets it immediately; (2) Only some get it (background knowledge); (3) Speaker wants it understood but deniable (the "dodge" case). Need ordering.
          3.  *The Cancellation Test Problem:* The user correctly identifies that teaching cancellation ("I didn't mean that") might empower the very dodge they are trying to stop. Need to frame this carefully.
          4.  *Misconceptions:* Tone/attitude, entailment vs. implication, lying, maxims as politeness rules. Need to integrate these into the flow.
          5.  *Explicit vs. Implicit Cooperation:* Should I tell them speakers are trying to be cooperative?
          6.  *Terminology:* Use "implicature" early or late?
          7.  *Debate Framing:* Risk of treating this as a tactic rather than a feature of communication.
      *   **Output:** A concrete lesson plan (order, timing, examples, misconceptions, checks) + advice on the specific decisions.

  2.  **Deconstruct the Core Problem:**

      *   The novices are using "literal truth" as a shield against accountability for misleading impressions.
      *   The goal isn't just to teach Grice; it's to teach *accountability for conveyed meaning*.
      *   The "Cancellation Test" is the dangerous tool here. In philosophy, it distinguishes implicature from entailment. In debate, it's the weapon of the bad actor.
      *   *Solution:* Reframe the test. Instead of "Can you deny it?" (which lets them off), use "Would a reasonable listener believe it?" or "What work did the statement do?" The focus must shift from *speaker intent* to *listener uptake* and *normative responsibility*.

  3.  **Develop the Carrying Example (Constraint 1):**

      *   Needs to be school-life.
      *   Literally true.
      *   Conveys something negative/disownable.
      *   Context switches the meaning.
      *   *Idea:* A comment about a student's presence or performance.
      *   *Draft:* "John was in class today." (Implies he's usually absent).
      *   *Critique:* A bit weak.
      *   *Draft:* "Sarah turned in her homework on time." (Implies she usually doesn't).
      *   *Better:* "Mike didn't cheat on the test." (Implies suspicion).
      *   *Best:* "Chris was the first person to leave the burning building." (Too dramatic).
      *   *Let's try a recommendation/reference context within school:* A student council election or a team selection.
      *   *Selected Example:* "Alex showed up to every practice this season."
          *   Context A (Team Captain selection): Implies Alex isn't skilled, just diligent.
          *   Context B (Attendance Award): Implies Alex is dedicated.
          *   *Wait, needs to be something the speaker would disown.*
          *   *Revised Example:* "Jamie didn't fail the chemistry midterm."
          *   Context A (Scholarship committee): Implies Jamie barely passed, not scholarship material.
          *   Context B (Parents concerned about expulsion): Implies Jamie is safe.
          *   *Let's go with the "Attendance/Behavior" angle, it's very high school.*
          *   *Final Choice:* "Taylor was present for the entire incident."
          *   Context A (Disciplinary Hearing): Implies Taylor is guilty/involved.
          *   Context B (Alibi Witness): Implies Taylor can vouch for others.
          *   *Actually, let's look for something more conversational.*
          *   *Idea:* "I saw Jordan at the library during study hall."
          *   Context A (Teacher asking where Jordan was): Implies Jordan was where they should be.
          *   Context B (Friend asking if Jordan was at the party): Implies Jordan wasn't at the party (boring/snitch).
          *   *Let's refine the "Disownable" aspect.* The prompt wants the speaker to convey something they would disown if challenged.
          *   *Example:* "Sam is very confident in his math abilities."
          *   Context A (Team selection): Implies Sam is arrogant or overconfident (bad).
          *   Context B (Tutoring selection): Implies Sam can help others (good).
          *   *Let's try the "Punctuality" angle.*
          *   *Example:* "Morgan arrived before the bell rang."
          *   Context A (Job Reference): Implies Morgan is eager/reliable.
          *   Context B (Explaining why Morgan missed the announcement): Implies Morgan was early but missed the info.
          *   *Okay, let's stick to the prompt's requirement: "Conveys something its speaker would disown."*
          *   *Example:* "Casey is technically eligible for the team."
          *   Meaning: Casey is bad, but follows rules.
          *   Context Switch: "Is Casey allowed to play?" -> "Yes, technically eligible." (Just facts).
          *   *Let's go with the "Attendance" one, it's the clearest.*
          *   *Utterance:* "Alex was in the building when the money went missing."
          *   Context 1 (Principal asking who to suspect): Implies Alex is a suspect.
          *   Context 2 (Alibi check): Implies Alex couldn't have done it if it happened outside.
          *   *Wait, I need one where the speaker implies something negative but can deny it.*
          *   *Utterance:* "Jordan did exactly what the instructions said."
          *   Context 1 (Art Contest): Implies Jordan lacks creativity.
          *   Context 2 (Safety Drill): Implies Jordan is safe.
          *   *This works.* It's school-life. It's literally true. It conveys "lack of creativity" in Context 1 which the speaker might disown ("I just said they followed instructions!"). Changing context (Safety Drill) removes the negative implication.

  4.  **Ordering the Three Cases (Constraint 2):**

      *   User wants: (1) Everyone gets it; (2) Only some get it (background knowledge); (3) Deniable/Dodge case.
      *   *Pedagogical Flow:* Start easy to build confidence. Move to the "context dependence" (Case 2) to show it's not in the words. End with the "Dodge" (Case 3) to apply it to the debate problem.
      *   *Order:* 1 -> 2 -> 3.
      *   *Why:* Case 1 establishes the phenomenon exists. Case 2 proves it depends on shared knowledge (not semantics). Case 3 applies it to the adversarial context (debate).

  5.  **Addressing the Cancellation Test (Constraint 3):**

      *   *Problem:* Teaching "You can cancel it" teaches debaters "I can deny it."
      *   *Solution:* Do not teach cancellation as a *right* of the speaker. Teach it as a *diagnostic tool* for the listener/judge.
      *   *Reframing:* Instead of "Can the speaker deny it?", ask "Does denying it make the original statement weird or unhelpful?"
      *   *Better:* Focus on the **Burden of Clarification**. If you say something that implies X, and X is false, you have a duty to correct X, not just hide behind the literal words.
      *   *The Test:* Don't call it the "Cancellation Test." Call it the "So What? Test" or the "Reasonable Listener Test."
      *   *Timing:* Introduce this *after* Case 3, as the tool to defeat the dodge, not as a definition of implicature.

  6.  **Misconceptions Integration:**

      *   *Tone/Attitude:* Address during Case 1. (It's not *how* you said it, it's *what* you communicated).
      *   *Entailment:* Address during Case 2. (If it were entailment, everyone would get it regardless of background).
      *   *Lying:* Address during Case 3. (It's not a lie if it's true, but it's still misleading).
      *   *Politeness/Maxims:* Keep this implicit. Don't teach the Maxims explicitly (too abstract). Treat them as "Rules of the Game."

  7.  **Terminology & Cooperation:**

      *   *Implicature:* Save for the last 5 minutes. It labels what they already understand.
      *   *Cooperation:* Make it explicit but simple. "We assume people are trying to be helpful." If they aren't, they are breaking the social contract of debate.

  8.  **Debate Framing Risk:**

      *   *Risk:* Teaching them to spot implicature just so they can make sneakier implicatures.
      *   *Mitigation:* Frame it as **Accountability**. The goal isn't to catch people; it's to ensure the clash is real. If you rely on the dodge, you lose the round on "Theory" or "Ethics."
      *   *Aim:* "Clash requires shared understanding."

