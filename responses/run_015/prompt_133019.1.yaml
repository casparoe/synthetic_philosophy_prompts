      *   *Resolution:* I will propose **one core scenario** (The "School Recommendation/Comment" scenario) that is modified three times. This satisfies the "carrying example" constraint (same words, same speaker) while satisfying the "three cases" constraint (three different contexts/audiences).
      *   *Wait, looking at Constraint 1 again:* "changing one detail of the surrounding situation, while leaving the words untouched, switches the extra content off." This implies the Carrying Example *is* the context-switching tool.
      *   *Okay, Plan:* Use **one sentence** throughout the whole class. Change the *context* around it to create the three cases.
