      *   *My advice:* Do not teach the Cancellation Test as a *permission*. Teach it as a *diagnostic for the Judge*.
      *   *Phrasing:* "If you have to cancel it, you admit you misled them."
      *   *Better:* Replace the Cancellation Test with the **"Best Explanation" Test**. Why did the speaker choose *these* words? If the literal meaning was all that mattered, they would have said X. They said Y. Why?
      *   *Actually, the prompt asks specifically about the Cancellation Test.* I need to address how to teach it without empowering the dodge.
