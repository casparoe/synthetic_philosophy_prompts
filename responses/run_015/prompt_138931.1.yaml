answer: |-
  None of the defensible readings make her right about the tipping, because they all require accurate knowledge of the local norm which she lacked, and tipping differs from jaywalking because one constitutes the meaning of the transaction while the other is a regulatory coordination problem.

  ### The Menu of Readings

  **1. The Coordination Heuristic**
  *   **Claim:** Follow local conventions to solve collective action problems (e.g., traffic flow, queueing) where deviation creates inefficiency or danger for everyone.
  *   **Verdict:** Defensible.
  *   **Conditions:** The norm must actually solve a coordination problem, and your deviation must negatively impact the system (e.g., driving on the wrong side).

  **2. The Offence-Minimization Principle**
  *   **Claim:** Follow local conventions to avoid causing emotional harm, insult, or disrespect to the hosts, prioritizing their sensibilities over your habits.
  *   **Verdict:** Defensible.
  *   **Conditions:** The locals must perceive the deviation as rude, and the cost of conformity to you must not outweigh the harm of offence.

  **3. The Descriptive Imitation Rule**
  *   **Claim:** Do exactly what you observe locals doing in the immediate context, regardless of official rules or deeper norms.
  *   **Verdict:** Actually False.
  *   **Conditions:** N/A. Locals often break norms with impunity (e.g., speed limits); copying them ignores privilege and context differences that protect them but not you.

  **4. The Normative Deference Principle**
  *   **Claim:** Do what locals believe *ought* to be done (their prescriptive norms), even if their actual behavior sometimes diverges.
  *   **Verdict:** Defensible.
  *   **Conditions:** You must be able to distinguish between what locals do and what they endorse; requires epistemic effort to learn the rule, not just watch behavior.

  **5. The Moral Relativism Claim**
  *   **Claim:** Local custom determines moral rightness; if locals do it, it is morally permissible for you to do it, even if it violates universal morals.
  *   **Verdict:** Actually False.
  *   **Conditions:** N/A. This cannot justify actions that violate fundamental rights (e.g., discrimination), regardless of local acceptance.

  **6. The Pragmatic Self-Preservation Rule**
  *   **Claim:** Follow local conventions solely to avoid penalties, legal trouble, or social friction for yourself.
  *   **Verdict:** Trivial.
  *   **Conditions:** There must be an enforceable penalty or high probability of social friction; if no one notices or cares, the rule dissolves.

  **7. The Boundary Maintenance Claim**
  *   **Claim:** Follow local conventions to avoid signaling "outsider" status, which might mark you as a target or disrupt the social ecology.
  *   **Verdict:** Trivial.
  *   **Conditions:** You must care about blending in, and the convention must actually function as a boundary marker (some exist specifically to sort tourists from locals).

  ### Application to Your Case

  **The Tipping Incident**
  Under the **Offence-Minimization Principle** and **Normative Deference Principle**, you were right and she was wrong. In Tokyo, the prescriptive norm is *not* to tip; offering money can be interpreted as insulting the worker's professionalism or implying charity. By not tipping, you adhered to the local normative structure. Her use of the proverb fails because it relied on a false factual premise (that tipping is the "Roman" way there). The only reading that saves her is **Moral Relativism** (tipping is universally good), but that is philosophically untenable here because it ignores the local meaning of the act. She treated tipping as a universal moral good rather than a local conventional signal.

  **The Jaywalking Incident**
  Her justification here relies on the **Descriptive Imitation Rule** ("everyone else crossed") or the **Coordination Heuristic** (if everyone crosses, the light is irrelevant to safety). This is arguably defensible in that specific moment: if the crowd moves, waiting alone creates a coordination failure (you become an obstacle) or safety risk (standing in the road). However, this contradicts her earlier use of the proverb. Against you, she invoked a *normative* rule (do what is proper); for herself, she invoked a *descriptive* rule (do what is happening).

  **Are They the Same Shape?**
  No. Tipping is a **constitutive convention**: it defines the relationship between server and served. In Tokyo, the relationship is defined by dignity and fixed price; tipping changes the meaning of the transaction to one of patronage. Jaywalking is a **regulatory convention**: it manages flow and safety. Breaking it doesn't change the meaning of "walking," it just increases risk.

  **Verdict**
  She was wrong on the tipping because she failed the **Normative Deference** test (she didn't know the actual norm) and violated **Offence-Minimization** (tipping risks offence). She was potentially defensible on the jaywalking under **Coordination**, but hypocritical in her reasoning. The proverb is not a universal solvent; it requires accurate knowledge of whether a norm is constitutive (respect the meaning) or regulatory (follow the flow), and she conflated the two.
