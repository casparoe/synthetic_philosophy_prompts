answer: |-
  Here is a proposal for a principle, an analysis of the unlisted cases, and a statement on the moral status of manipulation, designed for direct inclusion or adaptation in your handbook.

  ### 1. The Principle: Deliberative Access

  Your draft principle failed because it relied on *transparency* (would it work if told?) and *truth* (is the information false?). Both are unstable. A lie can be persuasive (if I know you lie, I discount you); a truth can be manipulative (if the truth is weaponized to block thought).

  The distinction lies in whether the influence enters the target's deliberation as a **consideration** or operates as a **cause**. Persuasion offers things for the target to think *with*; manipulation offers things for the target to think *through*.

  **The Principle of Deliberative Access:**
  An influence is manipulative if and only if:
  1.  **Intention:** The influencer intends to shift the target's belief or choice toward a specific outcome.
  2.  **Mechanism:** The influence operates by exploiting a cognitive bias, emotional vulnerability, or choice architecture *such that* the mechanism is not available to the target as a weighable reason in their own deliberation.
  3.  **Authority:** The target has not granted the influencer specific authority to bypass their deliberation in this domain (via role, consent, or necessity).

  **How this applies to your cases (and where you must yield):**

  *   **The GP (Persuasion):** The statistic ("most people... are fine") is offered as evidence of safety. The patient can weigh this: "Is social proof a good indicator of risk for me?" It enters deliberation as a reason. **Verdict upheld.**
  *   **The Partner (Manipulation):** Booking viewings does not offer a reason to move (e.g., "the schools are better"). It alters the *cost* of staying. It exploits status-quo bias and inertia. The mechanism (sunk effort/default) is not a weighable reason for moving. **Verdict upheld.**
  *   **The Canteen (Manipulation):** Here you must abandon your verdict. Placing fruit at eye level exploits visual salience. "It was shiny" is not a health reason. The mechanism is invisible to deliberation. **New Verdict:** This *is* manipulation, but it is **justified manipulation**. The handbook should distinguish between *malicious* manipulation (violating sovereignty for gain) and *stewardship* (violating sovereignty for the target's good, where they are prone to error).
  *   **The Teacher (Manipulation):** You must also abandon the ambivalence here. Telling a child "you are good at this" when the teacher believes they are not is not offering evidence. It is installing a confidence heuristic. It bypasses the child's assessment of their own work. **New Verdict:** This is manipulation. Whether it is *permissible* depends on whether the child is capable of accessing the truth otherwise. If the child is too young to assess evidence, the teacher is acting as a proxy deliberator (like the canteen). If the child is older, it is deceptive.
  *   **The Manager (Manipulation):** Withholding the promotion history removes a weighable reason. It forces the target to deliberate on incomplete data. **Verdict upheld.**
  *   **The Charity (Manipulation):** The photo exploits the identifiable-victim effect. This is a bias, not a reason (one life is not mathematically worth more than ten). **Verdict upheld** (it is manipulative), but permissible under a utilitarian override (good outcome outweighs procedural defect).

  **Why this principle works for your handbook:**
  It forces you to stop asking "Is it true?" or "Is it nice?" and start asking "Is the target able to process this influence as a reason?" This cleanly separates the GP (offers a reason) from the Partner (creates a pressure). It also gives you the vocabulary to defend the Canteen and Teacher cases not by denying they are manipulation, but by arguing that in fiduciary or developmental relationships, temporary suspension of deliberative sovereignty is sometimes the price of care.

  ### 2. Application to Unlisted Cases

  **Advance Consent ("You have my permission to push me")**
  On the Deliberative Access principle, this turns on Clause 3 (Authority). If I explicitly authorize you to bypass my deliberation (e.g., "If I try to quit smoking, hide my cigarettes"), you are not violating my sovereignty; I have loaned it to you.
  *   *The Trap:* This consent must be specific. General consent ("Make me better") is insufficient because it allows the influencer to define the "better." If you hide my cigarettes, that is authorized. If you shame me about my weight to make me hide them myself, that is unauthorized manipulation, even if I said "help me lose weight." The mechanism (shame) was not authorized, only the end.

  **Self-Manipulation (Beta blockers, deleting apps)**
  This is not manipulation under the principle because there is no distinct "target" whose sovereignty is violated. You are the influencer and the target. Clause 3 (Authority) is trivially satisfied because you cannot violate your own authority; you are exercising it.
  *   *Nuance:* This is only clean if your "present self" and "future self" are aligned in values. If you delete the app to satisfy a fleeting panic that your "reflective self" rejects, this is *intra-personal* manipulation. For the handbook, treat self-regulation as distinct from interpersonal manipulation unless the agent is fragmented (e.g., addiction), in which case the "reflective self" is the patient and the "impulsive self" is the antagonist.

  **Institutional Influence (Algorithms, Nudge Units)**
  Clause 1 (Intention) is the hurdle here. An algorithm has no mind. However, in professional ethics, we attribute the intention of the *designer* to the *tool*.
  *   *The Test:* Ask: "Did the designers intend for the mechanism to be deliberatively accessible?"
  *   If a recommendation system highlights a product because it is popular (social proof), that is accessible ("Others like this").
  *   If it highlights a product because it has a higher margin, using a color that triggers impulse (dark pattern), that is manipulation. The mechanism (profit-driven impulse) is not available to the user as a reason.
  *   *Handbook Advice:* Treat institutional influence as manipulation if the design intent exploits bias rather than informing choice. The "person" responsible is the institution.

  ### 3. Moral Status and Belief vs. Choice

  **Is Manipulation *Pro Tanto* Wrong?**
  Yes. On this account, manipulation is a defect in the *relationship*, not necessarily the *outcome*. It treats the target as a system to be managed rather than a will to be engaged. This is a *pro tanto* wrong (a wrong that can be outweighed) because it infringes on autonomy.
  *   *Why this helps you:* It explains why you feel uneasy about the Charity and the Teacher cases even when you approve of them. You are sensing the *defect* (autonomy infringement) even while accepting the *justification* (beneficence).
  *   *Handbook Application:* Do not teach students that manipulation is "okay if the outcome is good." Teach them that manipulation is "a cost to the relationship that must be justified by a significant benefit." This preserves the gravity of the act.

  **Belief vs. Choice**
  They must be handled separately, and belief manipulation is the graver offence.
  *   **Choice Manipulation** (Canteen, Partner): Alters the path to a decision. The target can often reverse it later ("I won't eat the pastry," "We won't move"). The damage is to the *process*.
  *   **Belief Manipulation** (Teacher, Seminar): Alters the map the target uses to navigate the world. If the teacher lies about the child's ability, and the child fails later, the child's tool for self-assessment is broken.
  *   *The Principle's View:* Clause 2 (Mechanism) is harder to satisfy for beliefs. To change a belief without a reason is to corrupt the target's connection to reality.
  *   *Handbook Advice:* Set a higher bar for belief manipulation. Choice manipulation may be permissible in stewardship (health/safety). Belief manipulation is rarely permissible unless the target is incapable of processing the truth (e.g., very young children, acute crisis). The Teacher case is on the razor's edge: if the "lie" is a temporary scaffold to build competence that will eventually validate the truth, it is stewardship. If the "lie" is maintained to ensure compliance, it is abuse.

  **Summary for your Chapter:**
  Define manipulation not by lies or pressure, but by **bypass**. If the target cannot use the influence as a reason, it is manipulation. If the target has not authorized the bypass, it is a violation. If the violation serves the target's own ends (health, growth) and they are currently ill-equipped to pursue those ends themselves, it may be justified stewardship. But it remains manipulation, and it remains a cost to be acknowledged, not a trick to be hidden.
