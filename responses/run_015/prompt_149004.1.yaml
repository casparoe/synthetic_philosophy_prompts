      *   *The "Asymmetric Co-dependence" Idea:* Can we have $A$ grounds $B$ in sense $X$, and $B$ grounds $A$ in sense $Y$, without a loop? Only if $X$ and $Y$ are distinct enough that they don't aggregate into a single priority ordering. But if both claim to be *metaphysical* determination, they usually compete for the same "fundamentality slot."

