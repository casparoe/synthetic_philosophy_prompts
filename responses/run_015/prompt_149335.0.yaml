      *   *Strategy 3 (Homology):* Focus on mechanism vs. content. Debt: Abstraction. Risks turning victims into case studies for sociological theory.
      *   *Conclusion:* Summarize how the novelist can use this. The tension itself is narrative fuel.

  6.  **Refining the Tone:**
