  **2. Temporal Curve**
  Let's talk about the temporal curve. If humanity hands off to AI successors who last only two centuries before burning out, have we avoided the catastrophe? Is there a threshold of duration required for "succession" to count, or does the badness of extinction just shade off gradually? Does extinction in 200 years differ morally from extinction in 200,000 years on your view?
  **Likely Answer:** She'll say it shades off; some future is better than none.
  **Follow-up:** If it shades off, then the longtermist claim that *more* future is always significantly better gains traction again. If 200,000 years is notably better than 200, then maximizing duration returns as a primary goal. How do you prevent your view from collapsing back into the standard temporal neutralism you're trying to critique?

  **3. Longtermism and Numbers**
  Longtermism often relies on astronomical numbers: trillions of future lives matter. Your view swaps "very many people" for "some inheritors." Does this mean the stakes are lower? If a small colony of posthumans carries our projects, is that equally valuable as a galaxy-spanning civilization? Or do you secretly need the astronomical numbers to make the "inheritance" substantial enough?
  **Likely Answer:** She'll say quality of inheritance matters more than quantity.
  **Follow-up:** But if quantity doesn't matter, you lose the leverage for strict x-risk mitigation. If a small colony suffices, then risking the majority for safety might be permissible. Are you comfortable implying that saving a billion lives matters less than ensuring a single successor colony survives? That seems to invert standard moral intuitions.

  **4. Caring and Noticing**
  You argue extinction is bad because projects end. But what if successors exist who simply don't care about our projects? If nobody notices or cares that the chain was broken, is there still a loss? Does the badness of losing the future depend on someone mourning it, or is it objective? What if people stop caring about the future well before it runs out?
  **Likely Answer:** She'll say the capacity to value is what matters, not specific mourning.
  **Follow-up:** So if successors have the capacity but choose not to exercise it toward our projects, the value is preserved? This suggests the content of our lives matters less than the mere existence of valuers. Are you reducing human history to a baton relay where the runners don't need to know they're holding a baton?

  **5. AI Implication**
  Here's the implication you might least want to dwell on. If artificial agents can genuinely inherit our projects, then a human extinction event caused by AI takeover isn't necessarily a catastrophe. On your terms, isn't a lot of what gets framed as existential risk actually just succession? Are you committed to saying AI takeover is fine provided they value what we valued?
  **Likely Answer:** She'll say yes, provided value alignment exists.
  **Follow-up:** But "value alignment" is the hard problem. If they inherit the *ability* to value but change the *objects* of value, is it succession? You're walking a line where human extinction is permissible, but only if the killers share our morals. Doesn't this make your view a justification for benevolent replacement rather than survival?

  **6. Dodge Blocker: Content**
  You often say questions about specific successors are about "who inherits, not whether." But suppose successors inherit only the biological capacity to value, none of our specific projects. Is that inheritance? If the "whether" depends on there being *someone* to value, but the "who" determines *what* is valued, can you really separate them? Where is the line?
  **Likely Answer:** She'll insist the structure of valuing is what counts.
  **Follow-up:** If the structure is all that counts, then a universe of valuers who value nothing we cared about satisfies your conjecture. That makes "inheritance" incredibly thin. If you tighten the definition to include our specific projects, you're back to talking about "who." How do you keep the definition thick enough to matter without answering "who"?

  **7. Dodge Blocker: Continuity**
  Consider a gap. Humanity dies, but 1,000 years later, new agents arise who happen to value similar things. Is that succession? If you say no, you require causal continuity. If yes, you allow resurrection. Does the "whether" of inheritance require an unbroken chain of transmission, or just a coincidence of values? How does this fit the "who vs. whether" distinction?
  **Likely Answer:** She'll likely require causal continuity to call it inheritance.
  **Follow-up:** If causal continuity is required, then the mechanism of transmission matters. That mechanism is the "who." If the chain breaks because humans died before building the AI, there is no inheritance. So the "whether" is entirely dependent on the "who" surviving long enough to build the bridge. You can't separate the survival of the bridge-builders from the inheritance.

  **8. Dodge Blocker: Recognition**
  Do successors need to recognize themselves as successors? If they invent everything anew without knowing we existed, have they inherited our projects? If recognition isn't required, "inheritance" becomes indistinguishable from "independent invention." If it is required, then the "who" must have specific knowledge. Does your view require successors to know they are standing on our shoulders?
  **Likely Answer:** She'll say recognition isn't strictly necessary, just functional continuity.
  **Follow-up:** Without recognition, the "inheritance" is invisible. If it's invisible, why does it matter morally? You're positing a metaphysical chain of value that no one perceives. If the "whether" doesn't depend on the successors knowing, then the moral weight rests entirely on us imagining them. Isn't that just our own narcissism projected onto a void?

  **9. Falsifiability**
  Finally, what evidence or argument could actually count against the Succession Conjecture? Is it falsifiable? If we found a culture that genuinely didn't care about successors, would you say they are mistaken, or that your conjecture fails? What would it take to convince you that humanity's survival is intrinsically valuable, regardless of successors?
  **Likely Answer:** She'll say it's a conceptual truth about valuing, so empirical evidence doesn't refute it.
  **Follow-up:** If it's conceptual, it's immune to empirical reality. But if it's immune, it can't guide policy in a changing world. If you claim it's a truth about valuing, but valuing evolves, aren't you freezing a current mode of thought? What if future valuers value discontinuity? Would your conjecture condemn them?

  ### Order and traps

  Start with the Descriptive/Normative distinction (Q1) to set the metaphysical stakes before digging into policy implications. Place the AI implication (Q5) mid-show when energy is high, as it's the most provocative. Save the Dodge Blockers (Q6-8) for the deep dive segment; sequence them to close off escape routes progressively. She will try to duck Q5 and Q6 by retreating to abstraction. Use Q7 and Q8 to force concreteness. End with Falsifiability (Q9) to leave the audience with the view's limits. Watch for her retreating to "structural valuing" when pressed on content.
