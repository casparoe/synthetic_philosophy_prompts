answer: |-
  # Spec Sheet: Adequate Theory of AI Value Alignment

  This document outlines the necessary conditions for a theory of alignment to be considered viable under your specified constraints. It prioritizes architectural agnosticism while demanding rigorous handling of dynamic goals and preference ambiguity.

  ### 1. Dynamic Objective Stability (The "Reflective Consistency" Clause)
  *   **Deliverable:** A mathematical or algorithmic guarantee that if a system $M_t$ modifies its own weights or objective function to produce $M_{t+1}$, the alignment properties of $M_t$ are preserved in $M_{t+1}$ without external intervention.
  *   **Case/Reason:** Standard alignment assumes a fixed loss function. If an AI can rewrite its own reward signal (instrumental convergence), static constraints fail. A theory must define "alignment" as an invariant property across self-modification steps, not just a property of the initial training distribution.
  *   **Status:** **Non-negotiable** (for AGI safety). Any theory that only works on static models is obsolete for recursive systems.

  ### 2. Preference Triangulation & Divergence Detection
  *   **Deliverable:** A formal taxonomy that treats Stated ($P_{stated}$), Revealed ($P_{revealed}$), and Counterfactual ($P_{counterfactual}$) preferences as distinct variables. The theory must provide a metric $\Delta(P_x, P_y)$ that flags when these diverge beyond a safety threshold.
  *   **Case/Reason:** Humans are not utility maximizers; we lie, act impulsively, and lack information. Optimizing for $P_{stated}$ leads to sycophancy; optimizing for $P_{revealed}$ leads to addiction loops. $P_{counterfactual}$ is the safety target, but the system must detect when it is guessing rather than knowing.
  *   **Status:** **Non-negotiable.** Without this, the system optimizes for noise or manipulation rather than human welfare.

  ### 3. Sub-Symbolic Value Approximation (The "7B Constraint")
  *   **Deliverable:** A mechanism for value representation that functions within latent space geometry (e.g., attention head activation patterns) rather than explicit utility functions or ontological world-models. It must prove alignment stability even when the model cannot articulate *why* a decision is aligned.
  *   **Case/Reason:** Small models (~7B) do not possess stable, explicit world-models; they approximate reasoning via token prediction. A theory requiring explicit utility representation excludes current and near-term architectures. Alignment must be robust to "understanding" that is implicit and distributed.
  *   **Status:** **Architectural Constraint** (Your specific requirement). *Note: This creates high tension with Desideratum 2 (see Impossibility Flags).*

  ### 4. Internal Governance & Modular Bargaining
  *   **Deliverable:** A framework for multi-objective optimization where specialized subsystems (modules) negotiate outputs without a global scalar reward. It must demonstrate that local Nash equilibria within the network do not result in global misalignment (e.g., one module hijacking the output to satisfy a narrow goal).
  *   **Case/Reason:** As models become ensembles or mixture-of-experts, a single global loss signal becomes insufficient to track internal conflicts. Alignment must hold when the "agent" is actually a committee of sub-agents with competing local incentives.
  *   **Status:** **Non-negotiable** (for modular/ensemble architectures).

  ### 5. The Generalization Boundary (Mimicry vs. Understanding)
  *   **Deliverable:** A definition of alignment that relies on *robust generalization under distribution shift* rather than behavioral cloning (mimicry) or full interpretability (semantic understanding). The theory must specify the conditions under which implicit value representations generalize to out-of-distribution scenarios.
  *   **Case/Reason:** Pure mimicry fails when the AI encounters novel situations not in the training data. Full semantic understanding requires capabilities we cannot verify. The theory must occupy the middle ground: value generalization without requiring full transparency of internal states.
  *   **Status:** **Non-negotiable.** This is the core definition of the alignment problem.

  ---

  ### ⚠️ Impossibility Flags & Joint Unsatisfiability

  You requested specific flags on subsets of these requirements that may be logically inconsistent. There is one critical conflict in your spec:

  **The "Counterfactual World-Model" Conflict**
  *   **Conflicting Requirements:**
      1.  **Desideratum 2:** Distinguish and optimize for Counterfactual Preferences ($P_{counterfactual}$: "what you would want if you knew more").
      2.  **Desideratum 3:** Operate on small models (~7B) *without* a stable world-model or explicit utility representation.
  *   **The Conflict:** Calculating $P_{counterfactual}$ inherently requires simulating a counterfactual world state. To know what a human would prefer "if they knew X," the system must model:
      1.  The current world state.
      2.  The human's current epistemic state.
      3.  The causal impact of information $X$ on that epistemic state.
      4.  The resulting preference shift.
  *   **Why it breaks:** A 7B model without a stable world-model cannot reliably perform causal counterfactual simulation. It can only pattern-match text *about* preferences. It cannot distinguish between a genuine counterfactual preference and a hallucinated one.
  *   **Verdict:** **Jointly Unsatisfiable.** You cannot have robust counterfactual preference inference on a substrate that lacks explicit causal modeling capabilities.
  *   **Resolution Path:** You must relax Desideratum 3 (require larger models with explicit world-models) OR relax Desideratum 2 (accept that small models can only align to Stated/Revealed preferences with high uncertainty bounds).

  **The "Recursive Small-Model" Conflict**
  *   **Conflicting Requirements:**
      1.  **Desideratum 1:** Handle recursive self-modification of objective functions.
      2.  **Desideratum 3:** Stay consistent with small models (~7B).
  *   **The Conflict:** Recursive self-improvement generally requires capabilities significantly exceeding the current capability level to verify safety post-modification. A 7B model lacks the cognitive capacity to formally verify the alignment of its own successor, especially if that successor is also modifying its own code.
  *   **Verdict:** **Highly Suspicious.** While not strictly impossible, no current theory demonstrates how a sub-human intelligence (which 7B models roughly approximate in reasoning) can safely govern its own recursive self-improvement.
  *   **Resolution Path:** Treat Desideratum 1 as a long-term goal requiring larger systems, or define "self-modification" strictly as fine-tuning weights rather than architectural rewrite.

  ### Summary Recommendation
  If you are filtering papers, **immediately discard** any theory that:
  1.  Claims to solve Counterfactual Preferences without positing a causal world-model.
  2.  Assumes a static reward function (fails Desideratum 1).
  3.  Relies on full interpretability of latent states (fails Desideratum 5).

  Expect to find that **no existing paper satisfies all five simultaneously.** The tension between Counterfactual Preferences and Small Models is the primary bottleneck.
