answer: |-
  The smell of the Bureau of Somnolent Revenue was always the same: ozone, stale coffee, and the faint, coppery scent of waking up too fast. Elara sat at Desk 404, her stylus hovering over a haptic screen that glowed with the soft, bruised purple of a twilight sky.

  She was a Senior Auditor for Collective Lucid Permits. It was a boring job, mostly. People wanted to believe their dreams were sacred, private voyages of the soul. The Bureau knew better. Dreams were infrastructure. When two people shared a REM cycle, they utilized bandwidth. When they felt intense emotion within that cycle, they drew on the collective unconscious reserve. That required taxation.

  Grief was deductible, provided it was processed within six months. Ecstasy was taxed at the highest bracket, classified as a luxury resource. Nightmares incurred a hazard surcharge.

  Elara rubbed her temples. It was late, the kind of late where the fluorescent lights begin to hum in a key that vibrates in your molars. She was running a mandatory random cross-check. Protocol dictated that every tenth auditor must submit their own files for review to ensure impartiality.

  She pulled up Subject 8940-EL. Her own file.

  The scrolling data was familiar. She saw the standard entries from last month: *Flight over coastline (Lucid, Controlled): Low Tax.* *Conversation with deceased aunt (Non-Lucid, Grief): Deductible.*

  Then she saw it.

  Entry date: fourteen years ago.
  Classification: Shared Lucid Construct.
  Emotional Intensity: Critical.
  Description: *The Green Door in the Burnt House.*

  Elara stopped breathing. The hum of the lights seemed to grow louder.

  She didn't remember a green door. She remembered her childhood home burning down when she was seven, yes. She remembered the soot and the insurance adjusters. But she had never been back inside. Not in reality, and certainly not in a dream. And she had never shared a dream about it. Shared dreaming required a partner, a linked permit.

  She tapped the entry to expand the metadata.

  *Co-Dreamer ID: [REDACTED]*
  *Duration: 45 minutes (Subjective)*
  *Tax Status: Paid in Full.*

  "Paid in full?" she whispered. Her voice sounded thin, as if the air in the office was too thick to carry sound properly.

  She hadn't paid for this. She would have remembered a tax bill from fourteen years ago; she was a child. Her parents would have handled it. But her parents were dead, and their files were sealed.

  She reached for her mug, but her fingers passed through the handle. She blinked, and the mug was solid again, cold ceramic against her skin. A glitch in the render? No, just fatigue. Everyone got fatigued at the Bureau. The boundary between the waking shift and the sleeping shift was porous here. That was why they paid the auditors so well. Hazard pay for ontological instability.

  Elara dug deeper into the file. She accessed the sensory logs. Usually, these were text summaries, but for Critical Intensity events, the Bureau kept residue.

  She plugged her neural jack into the port at her wrist.

  *Flash.*

  *Smell of wet ash. The heat of a fire that doesn't burn. A hallway that stretches too long, the wallpaper peeling in strips like dead skin. At the end, a door. Bright, impossible green. It vibrates.*

  *She is seven. She is small. But she is also watching herself from the corner of the ceiling. She sees the small girl reach for the knob. She feels the anticipation. It tastes like salt and electricity.*

  *The door opens. Inside, there is no room. There is only a vast field of wheat, swaying under a moon that is too large. And in the wheat, something flutters.*

  Elara yanked the jack out. She gasped, sucking in the ozone air of the office.

  She was shaking. She knew that memory. Not the memory of the fire, but the memory of the *watching*. She had felt that specific detachment before, just this morning, when she was filling out Form 1040-D for a client who dreamed he was a bird.

  She looked down at her hands. They looked normal. Five fingers, pale skin, a small scar on the thumb from a paper cut last week. But were they the hands of the seven-year-old, or the hands of the auditor watching the seven-year-old?

  If the tax was paid, who paid it?

  She looked back at the screen. The [REDACTED] ID next to Co-Dreamer was flickering. She typed in a override code, something she wasn't supposed to know, something that felt like it rose up from her throat rather than her mind.

  The ID resolved.

  It wasn't a name. It was a string of coordinates. Coordinates for this office. Desk 404.

  *Co-Dreamer: The Auditor.*

  Elara stood up. The office was silent. The rows of cubicles stretched out into a darkness that the fluorescent lights didn't seem to penetrate. Were there other auditors? She couldn't recall seeing anyone else tonight. She remembered clocking in, but did she remember walking through the lobby?

  She walked to the window. Outside, there was no city. There was only a swirling grey mist, like smoke from a fire that went out years ago.

  If she was the auditor, she was awake. If she was the dreamer, she was asleep. But the file said the dream was *shared*.

  *Zhuangzi dreamed he was a butterfly,* she thought. *A butterfly fluttering about, happy with himself and doing as he pleased. He didn't know he was Zhuangzi. Suddenly he woke up and there he was, solid and unmistakable Zhuangzi. But he didn't know if he was Zhuangzi who had dreamed he was a butterfly, or a butterfly dreaming he was Zhuangzi.*

  In her world, the butterfly would have to file a return. The butterfly would be taxed on the joy of flight.

  Elara looked back at her desk. The screen had changed. It was no longer her file. It was a new form. *Application for Permanent Residency in Waking State.*

  The fee was listed in emotional intensity. To prove she was awake, she would have to surrender the memory of the Green Door. To keep the memory, she had to admit it was a dream.

  If she surrendered the memory, she loses the past. If she keeps it, she admits she is sleeping.

  A sound came from the cubicle next to her. A fluttering. Like paper, or wings.

  She didn't turn around. She knew that if she turned, she would see either a colleague ready to clock out, or a moth the size of a human face resting on the monitor.

  Elara sat down. She picked up her stylus. It felt heavy, real, grounded.

  She hovered the pen over the *Submit* button.

  If she submitted the form, the transaction would be recorded. A record implies an observer. If the Bureau recorded her waking up, who was running the Bureau?

  She thought about the taste of salt and electricity. She thought about the hum of the lights.

  Elara pressed the button. The screen flashed white, a sudden, silent dawn.

  Somewhere, in the wheat field under the too-large moon, a stamp came down on a piece of paper. The sound was exactly like a heart beating.

  Elara waited to see if she would wake up. Instead, she opened a new file. There was still work to do. The night was young, and someone had to verify the receipts.
