answer: |-
  Hey, it is great that you are digging into this because honestly, most people gloss over the tension here and just pick a side based on intuition. If you want the full spec on what an adequate theory of pure time preference has to accomplish, you are asking for the blueprint of a building that might not be physically possible to construct, but let us lay out the requirements as rigorously as we can. The first and perhaps most non-negotiable desideratum is ethical coherence, specifically the requirement that the theory must justify why the date of an experience matters morally when the experience itself is identical. Ramsey called pure time preference a defect of imagination, and Parfit hammered this home by arguing that mere location in time is not a relevant difference for moral weighting, so any theory defending a positive pure rate has to explain why we are not simply discriminating against future people based on their temporal coordinate. However, you cannot just stop at the normative ideal because the theory also has to meet a descriptive adequacy constraint regarding individual psychology. It must explain why individuals exhibit impatience for immediate gratification even when they intellectually endorse long-term goals, without simply dismissing that impatience as irrational error, because if the theory calls all observed impatience irrational, it fails to explain the phenomenology of choice. Yet, simultaneously, it must account for the macro-social phenomenon you mentioned, where societies build cathedrals or invest in nuclear waste containment that yields no benefit for centuries. A viable theory cannot collapse individual time preference into social time preference, because the mechanisms differ; individuals face mortality and changing tastes, whereas institutions are designed specifically to outlast those biological constraints. So right away you have a tension where the theory must accommodate individual myopia without validating it as a normative principle for social planning.

  Then you have the analytical separation requirement, which is often where students get tripped up. The theory must rigorously distinguish pure time preference from probability discounting. When we discount the future, we are usually betting that we might not be there to enjoy it, or the institution might collapse, or the technology might fail. A pure theory has to strip all that out and isolate the discount applied solely to the passage of time holding probability constant at one. If a theory conflates the risk of extinction with the rate of time preference, it is not a theory of pure time preference but a theory of risk assessment. This leads directly into the biological and economic constraints you asked about. Biologically, the theory cannot contradict the fact that human cognition is wired for immediate threat response, which suggests some baseline positive discount rate is hardwired, but economically, it cannot contradict the necessity of convergence in infinite horizon models. If you set the pure time preference rate to zero in a standard growth model with an infinite future, the present value of required investment becomes infinite, leading to the tyranny of the future where the current generation must consume nothing to maximize the sum of utility over an endless timeline. So you have a hard non-negotiable constraint there: either you accept a positive discount rate to make the math work, or you abandon the sum-utilitarian framework for something like a satisficing rule or a finite horizon.

  Now, regarding the psychological asymmetries, this is where the standard economic model really starts to crack. You mentioned the case where people delay good news to savor anticipation but rush bad news to end dread. This is a critical desideratum because it demonstrates that the utility of a future event is not independent of its temporal distance. In standard exponential discounting, the value of a outcome decays uniformly as it moves further away. But if anticipation adds value, the discount factor for positive events could effectively be greater than one for certain time intervals, meaning the future is valued more than the present. This kills the idea of a uniform discount rate across all goods and times. An adequate theory must be able to model negative discounting for some classes of events without collapsing into incoherence. If the theory insists on a uniform positive rate, it fails to capture the phenomenology of savoring and dread, making it descriptively false. If it allows variable rates based on the emotional valence of the outcome, it becomes incredibly complex and loses the predictive power that made discounting useful in the first place. This creates a joint unsatisfiability problem right here: you cannot have a model that is both mathematically tractable with a uniform rate and psychologically realistic regarding anticipation effects. You have to choose between formal elegance and descriptive truth.

  There is also a deeper structural contradiction you need to flag in your notes regarding the concept of purity itself. Asking for a theory of pure time preference might smuggle in a category error. Preferences are usually defined over temporal streams of consumption, not instantaneous snapshots. If my utility function is defined over a life-path, then preferring a smooth consumption path over a jagged one is not discounting the future, it is valuing the shape of the life. When economists talk about pure time preference, they often treat utility as a commodity that can be moved through time like a dollar bill, but if utility is inherently temporal and process-dependent, then there is no such thing as a pure time preference distinct from the content of the preference itself. This suggests that the task might be muddled because it asks you to isolate a variable that is constitutively entangled with the nature of experience. If you accept this critique, then the desideratum shifts from finding the correct rate to explaining why we model preferences as if they were separable from time in the first place.

  Finally, you need to look at the compatibility of dynamic consistency with ethical impartiality. A theory should ideally ensure that plans made today for the future are not reversed tomorrow simply because time has passed, which requires exponential discounting. However, ethical impartiality suggests a zero rate, and psychological realism suggests hyperbolic discounting where we are impatient now but patient later. These three constraints are jointly unsatisfiable. You cannot have a theory that is dynamically consistent, ethically impartial, and psychologically realistic all at once. If you choose impartiality and consistency, you ignore human psychology. If you choose psychology and impartiality, you get dynamic inconsistency where the self at time one conflicts with the self at time two. If you choose consistency and psychology, you must accept ethical partiality against the future. Most economists sacrifice ethical impartiality for consistency, while most philosophers sacrifice consistency for impartiality, but you need to be clear that no theory gets all three. So when you are reading your next argument, check which of these corners they are cutting. If they claim to have solved the problem without admitting they dropped one of these constraints, they are likely hiding the trade-off. The reversed anticipation case you mentioned is the smoking gun that proves a uniform rate is impossible, so if the text you are reading insists on a constant delta while acknowledging human psychology, you know the model is breaking under its own weight. Good luck with the reading, and keep an eye out for where they sweep these incompatibilities under the rug.
