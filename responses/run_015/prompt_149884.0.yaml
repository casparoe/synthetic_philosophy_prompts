answer: |-
  ### I. Comparative Historiography of Non-Human Actors

  The historiographical turn toward non-human agents seeks to dismantle anthropocentric narratives by granting causal weight to biological and geological forces. While both pathogenic and geophysical framings aim to decentralize human intention, they operate through distinct ontological mechanisms and face different theoretical hazards.

  #### A. Epidemic Pathogens as Autonomous Historical Actors
  *(Exemplars: William McNeill, Alfred Crosby, contemporary pandemic history)*

  1.  **Mechanism of Directional Influence:**
      In this framing, pathogens exercise influence through **evolutionary selection pressure**. The mechanism is not merely the presence of disease, but the specific biological logic of the microbe (e.g., R0 value, case fatality rate, mutation rate). This logic generates directional change by forcing specific institutional adaptations (quarantine, sanitation, vaccination mandates) that would not have emerged otherwise. The pathogen is not background noise; it is an adversarial participant in a co-evolutionary arms race, dictating the tempo and terms of social interaction (e.g., social distancing, border closures).

  2.  **Boundary of Determinism and Defensive Move:**
      The attribution of agency collapses into **biological determinism** when the pathogen is credited with dictating specific political outcomes (e.g., "The Plague caused the end of Feudalism") without accounting for variable human responses.
      *   **Defensive Move:** Historians preserve human causal relevance through the concept of **entanglement** or **co-constitution**. They argue that while the pathogen sets the biological constraints, human cultural practices (burial rites, trade networks, urban density) determine the severity and social meaning of the outbreak. Agency is thus conjugated: the microbe acts, but society interprets and mitigates.

  3.  **Treatment of Social Vulnerability:**
      This framing predominantly treats vulnerability as an **intrinsic property of the affected system** (specifically, the host population). The focus is often on "virgin soil" immunity or genetic susceptibility. While social conditions facilitate transmission, the core vulnerability is framed biologically: the human body is the site of the crisis, and the lack of immunological history is an internal deficit exploited by the external actor.

  #### B. Geophysical Disruptions as Agentive Forces
  *(Exemplars: Sam White, Christian Pfister, climate historiography)*

  1.  **Mechanism of Directional Influence:**
      Geophysical forces exercise influence through **thermodynamic and mechanical shock to the social metabolism**. A volcanic winter or abrupt aridification reduces the energy available to a civilization (calories, transport efficiency, labor capacity). This functions directionally by shrinking the "carrying capacity" of a region, forcing migration, state contraction, or technological innovation to bridge the energy deficit. The force acts as a punctuation mark that disrupts the continuity of resource extraction.

  2.  **Boundary of Determinism and Defensive Move:**
      The attribution collapses into **environmental determinism** if the geophysical event is deemed sufficient to explain societal collapse (e.g., "Drought caused the Bronze Age Collapse").
      *   **Defensive Move:** The standard defense is the **resilience/vulnerability paradigm**. Historians argue that the geophysical event is a "stress test." Whether a society collapses or adapts depends on its pre-existing political flexibility, storage infrastructure, and economic diversity. The environment provides the shock; the social structure determines the outcome.

  3.  **Treatment of Social Vulnerability:**
      This framing predominantly treats vulnerability as an **externally imposed constraint**. The limit is set by the environment (rainfall, temperature), and society is vulnerable insofar as it fails to align its structures with these external limits. Vulnerability is the gap between social demand and ecological supply, imposed from the outside rather than residing intrinsically within the population's biology.

  ***

  ### II. Application of the Synthetic Distinction

  To evaluate these practices, we apply a distinction between **Agentive Causation** (the non-human entity pursues a trajectory intelligible without reference to the social structures it disrupts) and **Structural Exposure** (the historical outcome is explained primarily by pre-existing infrastructural fragility that the event merely reveals).

  #### 1. Translating the Geophysical-Actor Framing
  *   **Translation:** The geophysical framing translates into **Structural Exposure** with high fidelity.
  *   **Analysis:** A volcanic eruption follows a geological trajectory entirely intelligible without reference to human society (tectonic pressure). When historians argue that an eruption "caused" a famine, reinterpreting this through Structural Exposure simply shifts the emphasis to the grain storage systems that failed. The eruption becomes the *trigger*, but the *cause* of the suffering is the lack of storage.
  *   **Verdict:** This framing **survives translation without distortion**. In fact, modern climate history has largely already migrated from "climate as actor" to "climate as exposure," recognizing that identical climatic events produce divergent historical outcomes based on social structure.

  #### 2. Translating the Pathogenic-Actor Framing
  *   **Translation:** The pathogenic framing **requires significant reinterpretation** to fit Structural Exposure.
  *   **Analysis:** If we treat a pandemic purely as Structural Exposure, the virus becomes a static trigger that reveals weak healthcare infrastructure or housing inequality. However, this misses the **dynamic feedback loop**. Unlike a volcano, a pathogen's trajectory *changes* in response to social structures (e.g., antibiotic resistance, vaccine evasion). A Structural Exposure model implies a static fragility revealed by a static event. It cannot easily account for a pathogen that evolves *because* of the human response.
  *   **Verdict:** This framing **does not survive translation without distortion**. Reducing the pathogen to a mere revealer of structural fragility erases the biological reality that the pathogen actively adapts to overcome human mitigation strategies.

  ***

  ### III. Analysis of Residue and Agency

  When the Pathogenic-Actor framing is forced into the vocabulary of Structural Exposure, a **residue** remains: the claim that the pathogen possesses a *counter-strategy*.

  1.  **Nature of the Residue:**
      The residue consists of claims regarding **evolutionary feedback**. For example, stating that "Malaria shaped the genetic landscape of the Mediterranean" or "MRSA evolved in response to hospital hygiene protocols" resists expression as mere "exposure." In a Structural Exposure model, the hospital is fragile; in the Actor model, the bacteria *learned* (evolutionarily) to bypass the hospital.

  2.  **Genuine Feature vs. Anthropomorphic Artifact:**
      This residue indicates a **genuine feature of biological systems**, not merely an artifact of anthropomorphizing vocabulary.
      *   **Why it is not mere artifact:** Volcanoes do not care if humans build better shelters; they erupt regardless. Pathogens, governed by natural selection, *do* "care" in the functional sense: variants that bypass human immunity outcompete those that do not. This creates a *relational dynamism* that is absent in geophysical history.
      *   **Why it is not full Agency:** However, calling this "agency" risks conflating *teleological intent* with *selection pressure*. The pathogen does not "pursue a trajectory" in the cognitive sense; it is selected by the environment (which includes humans).

  3.  **Conclusion:**
      The Geophysical-Actor framing is best understood as **Structural Exposure**; the "agency" of the volcano is a metaphorical shorthand for an external constraint that tests internal resilience. The Pathogenic-Actor framing, however, contains a kernel of truth that Structural Exposure obscures: the **co-evolutionary dialectic**. The pathogen is not just an external shock revealing internal weakness; it is a dynamic variable that shifts in response to human action. Therefore, while "agency" is anthropomorphic, the *relational constraint* it describes is real. The Pathogenic-Actor framing survives best not as pure agency, nor as pure exposure, but as a **dynamic systems interaction**, whereas the Geophysical-Actor framing dissolves cleanly into Structural Exposure.
