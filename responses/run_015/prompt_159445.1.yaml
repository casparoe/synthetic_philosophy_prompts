answer: |-
  # DECISION TREE: POST-DARWINIAN BIOETHICS
  **Premise:** Suffering is bad. There is too much of it. Biotech can change this.
  **Task:** Sort by concrete commitments, not labels.

  ### THE BRANCHES

  **1. The Painless Injury (Phenomenology vs. Function)**
  *A dental drill is wrecking your tooth. You know exactly what is happening and are strongly motivated to stop it, but the sensation is neutral. Is the moral emergency resolved?*
  *   **NO:** The aversive drive itself is part of the badness, even if it doesn't hurt. → **Go to Leaf A**
  *   **YES:** The hurt is the only problem; information and motivation can stay. → **Go to Question 2**

  **2. The Calm Bereavement (Meaning vs. Valence)**
  *A loved one dies. You understand the loss and are motivated to honor them, but you feel no heaviness, ache, or distress. Is something essential missing from your love?*
  *   **YES:** Sorrow is constitutive of meaning; a world without it is shallow. → **Go to Leaf B**
  *   **NO:** Love is compatible with continuous well-being; grief is a bug, not a feature. → **Go to Question 3**

  **3. The Neutral Floor (Safety vs. Paradise)**
  *We can guarantee no one's experience ever drops below 'neutral,' but peak joy remains human-normal. Is this enough, or must we engineer peaks of sublime bliss?*
  *   **ENOUGH:** The goal is to remove the basement, not build a penthouse. → **Go to Question 3b**
  *   **NOT ENOUGH:** We are obligated to maximize the good, not just minimize the bad. → **Go to Question 4**

  **3b. The Method (Prevention vs. Therapy)**
  *To secure this safety floor, must we edit the germline so new minds *cannot* suffer, or is treating consenting adults sufficient?*
  *   **GERMLINE:** We must design suffering-proof successors. → **Go to Leaf C**
  *   **ADULTS:** We must respect the right to risk; intervention is only for the willing. → **Go to Leaf D**

  **4. The Engine of Action (Striving vs. Stasis)**
  *Without the threat of pain or loss, can complex striving be sustained solely on gradients of attraction (the "carrot")?*
  *   **NO:** Agency requires the possibility of failure and pain; bliss leads to stagnation. → **Go to Leaf E**
  *   **YES:** Information-sensitive gradients of bliss can drive infinite complexity. → **Go to Question 5**

  **5. The Source of Good (Reality vs. Stimulation)**
  *Is a blissful state morally equal if caused by direct neural stimulation versus achieving real-world goals?*
  *   **EQUAL:** The internal state is what matters; external tracking is optional. → **Go to Leaf F**
  *   **NOT EQUAL:** Reward must track reality; we need true success, not just happy chemistry. → **Go to Question 6**

  **6. The Circle of Concern (Humans vs. Sentience)**
  *Does this obligation extend to wild animals and digital minds, requiring total ecosystem management?*
  *   **HUMANS ONLY:** We fix our garden; nature is outside moral engineering. → **Go to Leaf G**
  *   **ALL SENTIENCE:** Suffering anywhere is our responsibility; predation must end. → **Go to Leaf H**

  ***

  ### THE LEAVES

  **Leaf A: Functional Conservatism**
  *Most Awkward Commitment:* You must preserve some aversive qualitative "bite" to ensure avoidance behaviors remain genuine.

  **Leaf B: Tragic Humanism**
  *Most Awkward Commitment:* You accept that deep meaning requires the capacity for deep sorrow, so total abolition is dehumanizing.

  **Leaf C: Preventive Safety Net**
  *Most Awkward Commitment:* You override the reproductive autonomy of parents to ensure future children cannot suffer.

  **Leaf D: Therapeutic Safety Net**
  *Most Awkward Commitment:* You allow new humans to be born capable of suffering, provided they can consent to fix it later.

  **Leaf E: The Static Worry**
  *Most Awkward Commitment:* The abolitionist project is self-defeating; you must abandon the goal because agency requires suffering.

  **Leaf F: Wirehead Hedonism**
  *Most Awkward Commitment:* A stimulated brain in a vat has equal moral worth to an active explorer solving real problems.

  **Leaf G: Anthropocentric Gradients**
  *Most Awkward Commitment:* You engineer human paradise while leaving wild animal suffering to continue indefinitely.

  **Leaf H: Universal Abolitionism**
  *Most Awkward Commitment:* You are obligated to rewrite physics and biology to prevent predation and natural suffering everywhere.

  ***

  ### LOGICAL GAPS & COLLAPSES

  **1. The Wirehead / Gradient Collapse**
  **Leaf F (Wirehead)** and **Leaf G (Gradients)** may not be separable. If "tracking reality" is just a preference, a super-intelligent wireheader could simulate the *feeling* of tracking reality perfectly. Unless you posit a metaphysical difference between "real" and "simulated" success, these two positions converge on the same neural architecture.

  **2. Unoccupied Cell: Selective Wireheading**
  *View:* Humans get Gradients of Bliss; wild animals get Wireheads.
  *Status:* **Unattractive.** It implies a speciesist dualism where animals are treated as containers for experience while humans are treated as agents. Most theorists find this arbitrary.

  **3. Unoccupied Cell: Deceptive Abolitionism**
  *View:* Keep the suffering circuitry, but trick the mind into believing it is blissful.
  *Status:* **Incoherent.** Suffering is defined by the felt experience. If it feels like bliss, the suffering is abolished by definition; if it feels like suffering, the deception failed.

  **4. Unoccupied Cell: Elite Hedonism**
  *View:* Raise the hedonic floor only for those who can afford it.
  *Status:* **Unattractive.** While politically plausible, no ethical framework advocates this as a *goal*. It exists as a risk, not a philosophical position.
