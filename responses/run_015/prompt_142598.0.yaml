      *   *Strict Dominance:* A forecast $q$ is strictly dominated if there exists $p$ such that Score$(p, \omega) <$ Score$(q, \omega)$ for all outcomes $\omega$.
      *   *Incoherence and Dominance:* It is a known theorem (e.g., Predd et al. 2009) that incoherent probabilities are *always* accuracy-dominated by some coherent probabilities under proper scoring rules.
      *   *The Catch:* Rounding. If the dominating coherent vector requires 3 decimal places, but we round to 2, the dominance might vanish in the *recorded* score.
      *   *Crux Formulation:* Does dominance survive the 2-decimal discretization?

  6.  **Drafting Section 4: Terminology & Defects:**

      *   *Sure-loss book:* Classic Dutch Book. Defect: Yes, rationality defect.
