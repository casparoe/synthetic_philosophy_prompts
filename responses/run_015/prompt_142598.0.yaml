  # Joint Statement on Coherence Auditing: Status and Path Forward

  **To:** Forecasting Platform Methodology Team
  **From:** Methodology Lead
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Automated Coherence Audits

  This document summarizes the current debate regarding the automated coherence auditor. It reflects a structured collaboration between the "Coherence Camp" (prioritizing logical consistency of credences) and the "Accuracy Camp" (prioritizing epistemic utility under scoring rules). The goal is to isolate agreement, clarify disagreement, and define empirical tests to resolve the decision on the audit's future within six weeks.

  ### 1. Common Ground: Claims Endorsed by Both Camps

  Both camps agree on the following twelve claims regarding the platform, the audit, and the nature of the data:

  1.  **Primary Objective:** The platform's ultimate goal is to maximize the epistemic accuracy of the aggregated forecast distribution.
  2.  **Mathematical Definition:** A probability vector is mathematically incoherent if its components do not sum to exactly 1.00.
  3.  **Report vs. Attitude:** The Audit identifies mathematical incoherence in the *submitted report*, but does not establish that the forecaster holds contradictory internal beliefs (attitudes).
  4.  **Hypothetical Wagers:** The "bets" constructed by the Audit are hypothetical accounting entries used to demonstrate inconsistency; they are not actual wagers placed with external counterparties.
  5.  **Bounded Stakes:** The guaranteed loss calculated by the Audit is bounded by the scoring range of the tournament; it is not scalable to arbitrary stakes (a "stake-bounded book").
  6.  **Non-Linear Utility:** Forecaster utility is determined by tournament rank, which is a non-linear function of raw Brier scores; therefore, utility is not linear in the currency the auditor trades in.
  7.  **Rounding Artifacts:** Rounding probabilities to two decimal places can force mathematically coherent beliefs to appear incoherent on the form (e.g., 0.33, 0.33, 0.33 sums to 0.99).
  8.  **Rescaling Impact:** Rescaling an incoherent vector to the nearest coherent vector alters the forecaster's stated mean estimate.
  9.  **Informational Value:** Incoherent filings generally reduce the informational value of the aggregate forecast compared to coherent ones.
  10. **Uniform Treatment:** The Audit currently treats all incoherence identically, regardless of whether it stems from error, disagreement, or rounding.
  11. **Team Dynamics:** Approximately one-third of filings come from two-person teams, introducing aggregation issues not present in individual forecasting.
  12. **Interval Limitations:** The Audit currently does not process interval reports or "no-opinion" flags, leaving a gap in coverage.

  ### 2. Remaining Disagreements

  The following table isolates the substantive and verbal disagreements remaining after establishing common ground.

  | Proposition | Coherence Camp Wording | Accuracy Camp Wording | Judgment | Resolution / Definition |
  | :--- | :--- | :--- | :--- | :--- |
  | **Nature of Defect** | Incoherence is a **rational defect** in the agent's doxastic state, independent of consequences. | Incoherence is a **performance defect** only insofar as it reduces expected score under a proper rule. | **Genuine** | Disagreement on whether rationality is defined by consistency or utility maximization. |
  | **Dutch Book Relevance** | The existence of a sure-loss book proves the credences are defective, even if stakes are bounded. | A bounded sure-loss book is irrelevant if the expected score of the incoherent vector exceeds the coherent alternative. | **Genuine** | Depends on Crux 1 (Accuracy Dominance). |
  | **Rounding Errors** | A sum $\neq$ 1.00 is a violation of the probability axioms, regardless of rounding constraints. | A sum $\neq$ 1.00 caused by rounding is an artifact of the interface, not a defect of the belief. | **Verbal** | Dissolved by defining "Coherence on a Discrete Grid." If the nearest coherent vector is the rounded true belief, it should be treated as coherent. |
  | **Team Filings** | A team filing is a single agent report; it must be coherent to be valid. | A team filing is an aggregation of two agents; incoherence may reflect unresolved internal disagreement. | **Genuine** | Requires a policy decision on whether teams are treated as single or multiple agents. |
  | **Audit Action** | Incoherent filings must be corrected (rescaled) to maintain the integrity of the leaderboard. | Incoherent filings should be flagged but not overwritten, as overwriting risks lowering realized accuracy. | **Genuine** | Resolved by Crux 2 (Expected vs. Realized). |

  ### 3. Cruxes and Empirical Tests

  We propose three cruxes to resolve the disagreements. Each includes a concrete test, advance predictions, and the operational decision tied to the outcome.

  #### Crux 1: Accuracy Dominance under Rounding
  **The Question:** Is every incoherent vector accuracy-dominated by a coherent vector *after* accounting for two-decimal rounding and mixed partition sizes?
  **The Test:** Compute the Brier score for all incoherent filings in the archive ($N \approx 10,000$). Compare the score of the *filed* vector against the score of the *rescaled* coherent vector for the actual realized outcomes.
  **Arithmetic Example (3-Cell Partition, 1 Unit Stakes):**
  *   **Filing:** $A=0.33, B=0.33, C=0.33$ (Sum 0.99).
  *   **Rescale:** Nearest coherent is $A=0.34, B=0.33, C=0.33$ (Sum 1.00).
  *   **Outcome:** Event $C$ occurs.
  *   **Filed Score:** $(0.33-0)^2 + (0.33-0)^2 + (0.33-1)^2 = 0.1089 + 0.1089 + 0.4489 = \mathbf{0.6667}$.
  *   **Rescaled Score:** $(0.33-0)^2 + (0.33-0)^2 + (0.34-1)^2 = 0.1089 + 0.1089 + 0.4356 = \mathbf{0.6534}$.
  *   **Outcome:** Event $A$ occurs.
  *   **Filed Score:** $(0.33-1)^2 + 0.33^2 + 0.33^2 = \mathbf{0.6667}$.
  *   **Rescaled Score:** $(0.34-1)^2 + 0.33^2 + 0.33^2 = \mathbf{0.6734}$.
  *   **Result:** In the second case, the "incoherent" rounding artifact scores *better* than the forced coherent adjustment.
  **Predictions:**
  *   *Coherence Camp:* The rescaled vector will have a lower (better) *expected* Brier score ex-ante, even if realized scores vary.
  *   *Accuracy Camp:* The rescaled vector will have a worse *realized* Brier score in $>5\%$ of cases due to rounding artifacts.
  **Decision:** If the rescaled vector scores worse in $>5\%$ of cases, **suspend auto-rescaling**. Switch to "Flag Only."

  #### Crux 2: Expected vs. Realized Accuracy
  **The Question:** Does the gap between expected accuracy (at filing) and realized score (on leaderboard) justify overriding forecaster autonomy?
  **The Test:** Isolate filings where the incoherent vector had a higher *ex-ante* expected Brier score (based on the forecaster's own implied probabilities) than the rescaled vector.
  **Predictions:**
  *   *Coherence Camp:* This set should be empty or negligible. Incoherence always lowers expected utility.
  *   *Accuracy Camp:* Due to non-linear tournament scoring and rounding, forecasters may rationally file incoherent vectors to hedge rank volatility.
  **Decision:** If forecasters can demonstrate a rational strategy for incoherence that improves tournament standing, **scrap point docking**.

  #### Crux 3: Team Incoherence Rates
  **The Question:** Is incoherence significantly higher in team filings than individual filings?
  **The Test:** Compare the rate of incoherent filings for solo forecasters vs. two-person teams.
  **Predictions:**
  *   *Coherence Camp:* Rates should be similar; teams should resolve disagreement before filing.
  *   *Accuracy Camp:* Team rates will be significantly higher, indicating the audit is punishing negotiation friction.
  **Decision:** If team rates are $>2\times$ solo rates, **implement a "Team Coherence Tolerance"** (e.g., allow sum $0.99-1.01$ for teams).

  ### 4. Terminology and Defect Classification

  The camps have used different terms for the "books" constructed against the forecaster. We standardize them here:

  | Term | Definition | Defect? | Same Kind? |
  | :--- | :--- | :--- | :--- |
  | **Sure-Loss Book** | A portfolio of bets guaranteeing a loss, scalable without limit. | **Yes.** Fundamental rationality defect. | **Yes.** All three violate the probability axioms. |
  | **Stake-Bounded Book** | A portfolio guaranteeing a loss, capped by tournament stakes (The Audit's current tool). | **Yes, but Pragmatic.** Defect severity depends on stake size relative to utility. | **Yes, logically.** But pragmatically weaker than Sure-Loss. |
  | **One-Sided Book** | A portfolio with no possible gain and some possible loss (Weak Dutch Book). | **Yes.** Indicates inconsistency, though less severe than sure loss. | **Yes.** All indicate a violation of coherence axioms. |

  **Assessment:** While all three indicate the same *logical* defect (violation of probability axioms), they are not the same *pragmatic* defect. In a tournament with bounded, non-linear payoffs, vulnerability to a Stake-Bounded Book does not necessarily imply vulnerability to actual utility loss. The Coherence Camp treats them as identical; the Accuracy Camp treats them as distinct. **The Accuracy Camp is correct on this distinction:** in this specific platform context, the magnitude and scalability of the loss matter for determining whether the defect harms the platform's goals.

  ### 5. Recommendation and Uncertainty

  **Recommendation:** Retain the audit as a diagnostic flag to educate forecasters, but immediately suspend auto-rescaling and point docking pending the results of Crux 1.

  **Single Finding That Would Change My Mind:** If the archive analysis (Crux 1) demonstrates that auto-rescaling improves the aggregate Brier score of the platform by $>1\%$ despite rounding artifacts, I would reinstate the audit's corrective powers.

  **Residual Uncertainty:** The primary uncertainty remains the team filing dynamic. If incoherence is primarily a symptom of unresolved team disagreement rather than individual error, neither rescaling nor flagging solves the root problem; we may need a mechanism for filing divergent individual views within a team entry.
