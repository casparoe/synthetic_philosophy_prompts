answer: |-
  Here is the conceptual map. To understand how Nietzsche would parse this, we have to start with the baseline from *On the Use and Abuse of History for Life*: History is not meant to be an objective truth, but a nutrient. It must be digested to serve **Life** (vitality, creativity, the Will to Power). If history stops serving life and starts paralyzing it, it becomes a sickness.

  Here is how the three modes map onto algorithmic feeds and edit wars, and where the framework fractures.

  ### 1. The Algorithmic Feed (TikTok/Reels)
  **Initial Mapping: Antiquarianism on Steroids?**
  On the surface, the endless scroll looks like hyper-Antiquarianism. It is an infinite archive, preserving every dance, meme, and moment. But Nietzsche would argue this is a counterfeit.
  *   **True Antiquarianism** requires *reverence* and *piety* toward the past. It roots you.
  *   **Algorithmic Feeds** require *consumption* and *disposal*. You do not revere the content; you metabolize it for dopamine and discard it in seconds.
  *   **The Verdict:** This is not Antiquarianism; it is **Antiquarianism without Memory.** It is hoarding data without the burden of history. It creates a "perpetual present" where the past is instantly accessible but instantly irrelevant.

  **The Monumental Glitch**
  *   **True Monumental History** looks to great figures of the past to inspire great action in the present ("If they could do it, I can too").
  *   **Algorithmic Monumentalism** is the "Viral Moment." Influencers attempt to become monuments, but the timeline compresses their greatness. You can be a "monument" for 15 minutes, then be deleted by the feed.
  *   **The Verdict:** This trivializes the Monumental. It teaches that greatness is fleeting and performative, not enduring and inspiring. It produces narcissism, not ambition.

  **The Critical Swipe**
  *   **True Critical History** is a violent judgment of the past to break its chains so you can create anew.
  *   **Algorithmic Criticism** is the swipe. It is a micro-judgment ("This is boring," "This is bad").
  *   **The Verdict:** This is passive judgment. It trains the user to be a critic of everything but a creator of nothing. It creates a mindset of rejection without the courage of destruction required to build something new.

  ### 2. Wikipedia Edit Wars
  **The Battlefield of Interpretations**
  Nietzsche would likely find edit wars fascinating because they reveal that "truth" is a mobile army of metaphors. It is a raw display of the Will to Power fighting over narrative control.
  *   **Antiquarian Mode:** The obsession with citations, rules, and "neutral point of view." This is the priesthood of the archive, guarding the tomb of facts.
  *   **Critical Mode:** The deletion, the reversion, the banning. This is the attempt to kill off a competing interpretation.
  *   **Monumental Mode:** Trying to enshrine a specific figure or ideology as "definitive."

  **The Verdict:**
  Nietzsche would view this as **Herd Morality in Digital Form.** It is not a struggle between higher men creating new values; it is a bureaucratic struggle between the "herd" trying to enforce consensus. It is democracy applied to truth. He would despise the goal of "neutrality," viewing it as a lie that masks the underlying power struggle. However, he might respect the *conflict* itself, even if the combatants are petty.

  ### 3. The Framework Break: Speed and Agency
  You asked if this breaks the framework entirely. **Yes.** Here is why:

  **A. The Inversion of Agency**
  Nietzsche's three modes assume a **Subject** (the human) who actively wields history as a tool to enhance their life.
  *   **The Break:** Algorithmic feeds reverse this. The system wields *you*. The feed is not designed for your vitality; it is designed for retention. It uses history (content) to numb you, not to empower you. It is history *against* life.

  **B. The Destruction of Forgetting**
  Nietzsche argued that forgetting is just as essential as remembering. To act, you must be able to close the horizon, to ignore the infinite past and focus on the immediate task.
  *   **The Break:** The algorithmic feed eliminates forgetting. Everything is archived, everything is resurfaced, everything is contextually collapsed. This creates the "historical fever" Nietzsche warned about, but accelerated to a seizure. You cannot digest the past because there is no pause between ingestion and the next bite.

  **C. The Moral Psychology of Speed**
  *   **Antiquarianism** slows you down (reverence takes time).
  *   **Monumentalism** steadies you (looking up to giants).
  *   **Critical History** sharpens you (making hard cuts).
  *   **Algorithmic Speed** fragments you. The speed prevents the formation of a coherent self. You cannot build a "Monument" within yourself if your attention is liquid.

  ### Summary Map
  Nietzsche would likely view algorithmic feeds not as a new mode of history, but as a **pathology of history.**

  1.  **It mimics the modes but lacks the virtue:** It looks like Antiquarianism (archive) but is actually amnesia. It looks like Monumentalism (viral fame) but is actually vanity. It looks like Critical (cancel culture/swiping) but is actually resentment.
  2.  **It creates the "Last Man":** The feed produces humans who blink and say, "We have invented happiness." They are comfortable, informed, entertained, but incapable of great suffering or great creation.
  3.  **The Edit Wars are a symptom:** They show that we still crave truth, but we try to find it through committee and bureaucracy rather than through the singular will of a creator.

  **Final Concept:** The algorithm does not serve the three modes; it **cannibalizes** them. It turns the Monumental into content, the Antiquarian into data, and the Critical into engagement metrics. For Nietzsche, this is the ultimate nihilism: knowing the price of everything (data/engagement) and the value of nothing (Life).
