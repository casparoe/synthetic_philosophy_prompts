      *   **Subject:** Friedrich Nietzsche's potential view on algorithmic feeds (TikTok) and Wikipedia edit wars.
      *   **Specific Lens:** His three modes of history from *On the Use and Abuse of History for Life* (Monumental, Antiquarian, Critical).
      *   **Core Question:** Are algorithms just tools for these modes, or do they break the framework? Is endless scrolling "antiquarianism on steroids," or does speed change the moral psychology?
      *   **Constraint:** No citations needed, just a conceptual map.

  2.  **Deconstruct Nietzsche's Three Modes (Mental Refresh):**
      *   *Monumental:* Focus on great deeds/figures of the past to inspire action in the present. "If they did it, I can too." Risk: Distorting truth to fit the myth.
      *   *Antiquarian:* Preserving the past for its own sake. Reverence for origins, tradition, and details. Risk: Mummification, stifling the present, hoarding facts without purpose.
      *   *Critical:* Judging and condemning the past to break its chains and allow new creation. Destroying old values to make room for new ones. Risk: Nihilism, rootlessness.
      *   *The Goal:* "History for Life." History should serve vitality, creativity, and the Will to Power. Too much history kills life.

  3.  **Apply to Algorithmic Feeds (TikTok/Reels/Shorts):**
