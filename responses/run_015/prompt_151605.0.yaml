  This is a remarkably sharp set of intuitions. You have effectively isolated the three biggest fault lines in the philosophy of pleasure: **Heterogeneity** (Peach vs. Proof), **Negation vs. Presence** (Noise vs. Peach), and **Intentionality** (Object-directed vs. Brain Zap).

