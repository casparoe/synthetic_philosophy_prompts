  8.  **Final Polish:** Check against the user's specific constraints ("precise account", "clean bound", "transient behavior"). Ensure the distinction between asymptotic universality and finite-sample bias is clear. (Self-correction: Ensure I mention that $c$ depends on the *pair* of UTMs, not just one).

