  hey, i'm in my epistemology course and we just did the lottery paradox and the preface paradox in lecture. you know, the 1000-ticket lottery where i shouldn't believe my specific ticket lost but then i can't believe all of them lost, and the author who thinks every claim in her book is right but also that there's probably an error in there somewhere. my prof said they're basicaly the same problem but i don't buy it, and my readin group is totally stuck -- everyone just repeats the same three moves (drop closure, drop the lockean threshold, or say belief can be inconsistent) and nobody moves.

  my working theory is that it's partly verbal. i think one side is treating "belief" as graded credence and asking what's rational to feel sure about, while the other side treats it as something closer to "assertion" or "acceptance for practical reasoning" and asks what's rational to stand behind. that's why the preface case feels like social humility (the author is being responsible, not statistically wrong) while the lottery feels like pure math. but also there's this hidden thing about agglomeration: some people think closure fails for statistical reasons, others think it fails for normative reasons about intellectual humility, and they talk past each other.

