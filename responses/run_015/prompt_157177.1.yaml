  hey so ive been trying to sort out my own thoughts on whether you can like art made by bad people, and my roommate says my takes dont line up. heres what i actually think, no filter:

  A. i think the value of a song or painting is mostly in what it does for you emotionally, and that doesnt depend on the artists biography at all.
  B. but i also think learning an artist hurt people can change how i feel about the work, like i cant unhear that.
  C. i think theres a real line between the artist being immoral and the artwork itself promoting immorality - a violent director can make a peaceful film, and thats different.
  D. and i kinda think that suffering and bad behavior often feed into deep art, so maybe the artists flaws are actually part of why the art works.
  E. but i also feel like if i call something great art im saying its good in every important way, and if it was built on real harm that should count against it.

  do these hang together? specifically, does A clash with B, and does D mean im not really separating the work from the artist? also is E incompatible with C? rank the tensions by how bad they are, say the cheapest fix for each, and tell me which one belief i should drop if i want the rest to survive. im not asking for a reading list just logic.
