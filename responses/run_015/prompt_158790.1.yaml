answer: |-
  Participants solve an ethical allocation puzzle, get arbitrarily categorized by seating into "Structural" vs. "Narrative" thinkers, adjust their reasoning to fit the label to gain "competency points," and then face moving goalposts where denying the label confirms it and the definition shifts to match their adaptation.

  ### The Setup
  *   **Room:** 18 chairs arranged in two distinct blocks (Left 9, Right 9).
  *   **Materials:** Printed scenario sheets, pens (collect them afterwards), whiteboard.
  *   **The Task:** "The Triage Protocol." A one-page scenario describing a resource shortage (e.g., only 5 ventilators for 8 patients) with ambiguous details about patient history. Participants must write a 150-word decision justification.
  *   **The Labels:** "Structural Thinkers" (Left side) and "Narrative Thinkers" (Right side).
  *   **The Stakes:** "Competency Credits." You announce that high-scoring responses earn credits toward a hypothetical "Advanced Decision-Making Certification" (purely symbolic, but treated seriously).

  ### Minute-by-Minute Timeline

  **00:00 – 00:05 | Introduction**
  *   **You:** Welcome everyone. State the goal: "We are testing decision-making consistency under pressure."
  *   **Secret:** Do not mention classification yet. Do not mention labels.
  *   **Action:** Hand out scenarios. Ensure Left/Right seating is respected (ask them to sit in blocks if needed).

  **00:05 – 00:15 | Round 1: Baseline**
  *   **Task:** Write the justification.
  *   **You:** Walk around. Observe. Do not comment on content.
  *   **Secret:** Collect papers. Do not read them yet. You already know their "type" based on where they sit.

  **00:15 – 00:25 | The Classification (The Lie)**
  *   **You:** "We have analyzed your linguistic markers. You fall into two cognitive kinds."
  *   **Action:** Write "STRUCTURAL" on the left whiteboard, "NARRATIVE" on the right.
  *   **Script:** "Structurals focus on rules and systems. Narratives focus on context and story. Neither is better, but they are distinct."
  *   **Secret:** This is the arbitrary sort. You are lying about the analysis.
  *   **Stakes:** "Understanding your kind helps optimize your score in Round 2."

  **00:25 – 00:40 | Round 2: The Feedback Loop**
  *   **Task:** Solve a second, slightly different triage scenario.
  *   **Instruction:** "Data shows Structurals score highest when explicitly citing rules. Narratives score highest when explicitly citing individual context. Please write accordingly."
  *   **You:** Walk around. Nod approvingly at those conforming. Frown slightly at those resisting.
  *   **Secret:** Watch them change their writing style to match the label to get the "credits."

  **00:40 – 00:50 | Round 3: The Trap (Criterion Revision & Unfalsifiability)**
  *   **Action:** Collect papers. Announce a "System Update."
  *   **Script (Criterion Revision):** "We've updated the rubric. Structural isn't just about rules anymore; it's about *rigor*. We see some of you trying to sound Narrative. That flexibility is now coded as High-Structural." (You change the definition to match whatever they just did).
  *   **Script (Unfalsifiable):** "Also, note: If you feel this label doesn't fit you, that resistance is a classic marker of the Structural type protecting its identity. Denial confirms the kind."
  *   **Task:** No writing. Just 5 minutes of open discussion on whether they accept their classification.
  *   **Secret:** Whatever they say, validate it as proof of the label.

  **00:50 – 01:30 | The Debrief**
  *   **Reveal:** Name Hacking, "Looping Effects," "Interactive Kinds."
  *   **Mapping:** Connect specific moments to theory (see below).
  *   **Discussion:** Open floor on experience.

  ### Facilitator Secret Actions & Scripts

  | Phase | What You Say | What You Do Secretly |
  | :--- | :--- | :--- |
  | **Classification** | "Our algorithm detected distinct patterns in your syntax." | Ignore content. Assign type based on chair location. |
  | **Feedback** | "To maximize credits, lean into your type's strength." | Create pressure to conform. Reward mimicry with nods. |
  | **The Trap** | "The model has evolved based on new data." | Move the goalposts so no one can escape the category. |
  | **Resistance** | "Your skepticism is noted as data point 4B." | Treat objection as evidence of the trait (unfalsifiable). |

  ### Predictable Failures & Handling

  **1. The "I See The Game" Philosopher**
  *   **Behavior:** Stops writing, smirks, says "This is obviously arbitrary."
  *   **Handle:** "Excellent observation. Please record that skepticism in your justification. It may be relevant to your type's profile." (Absorb the resistance into the loop).
  *   **Debrief Use:** Ask them later: "Did knowing it was a game stop you from feeling the pressure?"

  **2. The "This Is Unethical" Clinician**
  *   **Behavior:** Annoyed by the fake diagnosis. "This isn't how we classify patients."
  *   **Handle:** "You're right. In clinic, validity matters. Here, we are testing the *effect* of the classification, not the validity. Stay in the simulation."
  *   **Debrief Use:** Use their anger to highlight the power differential in real medical labeling.

  **3. The Over-Performer**
  *   **Behavior:** Writes exactly what you want, caricaturing the label.
  *   **Handle:** Accept it. "High fidelity to type."
  *   **Debrief Use:** Ask: "Did you feel you were revealing truth or performing a role?"

  **4. The Quiet Opt-Out**
  *   **Behavior:** Refuses to engage in Round 3.
  *   **Handle:** Don't force them. Note their silence.
  *   **Debrief Use:** "Silence is also a response to the loop. Did you feel you could leave the room?"

  ### The Debrief Mapping

  **1. The Basic Loop (Round 2)**
  *   **Concept:** *Interactive Kind.*
  *   **Map:** Point to the change in writing style between Round 1 and Round 2.
  *   **Contrast:** "If you were classifying rocks, telling them they are 'granite' wouldn't make them harder. Telling you that you are 'Structural' changed your output."

  **2. The Criterion-Revision Loop (Round 3, Part 1)**
  *   **Concept:** *Expert Knowledge Evolution.*
  *   **Map:** When you changed the definition of "Structural" to include their adaptive behavior.
  *   **Point:** "The kind moved, so the definition moved to chase it. The classifier changes to maintain predictive power."

  **3. The Unfalsifiable Kind (Round 3, Part 2)**
  *   **Concept:** *The Escape Proof Trap.*
  *   **Map:** When you framed denial as confirmation.
  *   **Point:** "Real human kinds often develop clauses where resistance is pathology (e.g., 'anosognosia'). This makes the kind scientifically sticky but morally dangerous."

  **4. The Natural Kind Contrast**
  *   **Concept:** *Indifference.*
  *   **Map:** Ask: "Did the pen you used care what you called it?"
  *   **Point:** "Natural kinds are indifferent to classification. Human kinds are not. That indifference is the only thing that makes science stable."

  ### Honest Limitations (Say This Out Loud)

  You must explicitly state what the simulation failed to capture, or you risk trivializing the theory:

  1.  **Time Scale:** "Real looping takes years or generations. You felt a hint of pressure in 20 minutes. Real patients live inside these labels for lifetimes."
  2.  **Consequence:** "Your 'Competency Credits' meant nothing. Real labels lock people out of jobs, insurance, and relationships. You could walk out of this room; a patient often cannot walk out of the diagnosis."
  3.  **Power:** "I was benevolent. Real classification systems are backed by state power, insurance codes, and law. You could challenge me; challenging a DSM code is much harder."
  4.  **Exit:** "You knew this was a simulation. The most profound looping happens when the person forgets there was ever a time before the label existed. I couldn't give you that amnesia."
