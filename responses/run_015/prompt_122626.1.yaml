answer: |-
  **TO:** Research Priorities Committee
  **FROM:** Committee Chair
  **DATE:** April 10, 2024
  **SUBJECT:** Decision on Endowment Allocation and Fellowship Priority

  **Purpose**

  This memo outlines my recommended course of action regarding the allocation of the restricted endowment for the upcoming two-year postdoctoral fellowship. As we approach our April 17 meeting, the committee remains divided between two high-quality proposals: the broiler chicken controlled-atmosphere stunning project and the black soldier fly larvae welfare indicators project.

  After reviewing the deliberations from our March sessions, specifically the impasse regarding expected value calculations and the complications surrounding industry rebound effects, I am recommending that we award the fellowship to the **Broiler Chicken Stunning Proposal**. Simultaneously, I propose we commission a limited scoping study from the operational budget to address the economic modeling gaps identified in the Insect Proposal.

  **Rationale: Mandate and Timeline**

  Our terms of reference require us to fund work whose findings could reasonably change purchasing or husbandry practice within five years. Both proposals meet the technical threshold for generating data within this window. The insect proposal will yield validated welfare indicators; the chicken proposal will yield a cost-reduced stunning protocol.

  However, "changing practice" implies a net positive welfare outcome. For the chicken proposal, the pathway is linear: adoption of the protocol reduces suffering during slaughter in existing facilities. The population of broilers is large, but stable or declining in our target markets, and their sentience is not a variable in our ethical calculus.

  For the insect proposal, the pathway is non-linear. While welfare indicators will be produced, their adoption carries the risk of the "rebound effect" noted by our colleagues: welfare certification may legitimize the industry, lowering political friction and increasing total production volume. If production scales faster than welfare improves, total suffering may increase. Because we cannot sign the net effect on total insect-years within the five-year mandate, the insect proposal fails the specific requirement of *assured* practice improvement, even if the science is robust.

  **Engaging the Expected Value Argument**

  I want to address the strongest version of the argument made by the two members advocating for the insect fellowship. The claim is that we must maximize expected value: *Individuals Affected × Probability of Sentience × Intensity of Suffering.*

  The argument posits that because the scale of insect farming ($10^{18}$) exceeds vertebrate farming by orders of magnitude, even a low probability of sentience (1–2%) creates an expected moral weight that swamps the vertebrate case. The counter-argument raised in committee was that multiplying by an unestimable probability is indistinguishable from multiplying by an invented number, rendering the calculation void.

  I believe dismissing the probability as "invented" is insufficient. In decision theory, acting on uncertain sentience is necessary; ignoring low-probability, high-stakes risks is itself a moral gamble. If we assign a non-zero prior to insect sentience, the scale argument is mathematically valid. We cannot reject the insect proposal simply because the sentience probability is uncertain.

  However, the Expected Value (EV) calculation fails here not because the *inputs* are uncertain, but because the *outcome variable* is unsigned. EV requires us to estimate the *change* in suffering averted. If the intervention causes industry expansion that outweighs per-unit welfare gains, the "Suffering Averted" term becomes negative.

  Can an intervention whose net effect we cannot sign still be worth funding on EV grounds? Only if we have a strong prior that the welfare gains will outpace production scaling. We do not have this. In the chicken sector, market demand is relatively inelastic to welfare certification; in the nascent insect sector, political legitimacy is a primary bottleneck. Therefore, the insect proposal introduces a variance in total suffering that we cannot model. The chicken proposal, by contrast, offers a signed, positive reduction in suffering for a population we know to be sentient. Given our mandate to reduce suffering, not merely measure it, the signed certainty of the vertebrate project must take precedence over the unsigned potential of the invertebrate project.

  **Sentience Assumptions**

  To be explicit: This decision does not resolve the sentience question. We are proceeding on the working assumption that for the purposes of *restricted endowment allocation*, we must prioritize interventions where the moral patient status is established consensus (vertebrates) over those where it is probabilistic (insects), particularly when the probabilistic case carries high uncertainty regarding net impact. This is a heuristic for risk management within our mandate, not a biological ruling. We acknowledge that if insect sentience were established as fact, the scale argument would likely dominate our priorities entirely.

  **The Scoping Compromise**

  To address the valid concern that we are neglecting a potentially massive moral priority due to modeling gaps, I recommend we commission a small scoping study funded from discretionary operational reserves, separate from the restricted endowment.

  This study will not focus on biological indicators, but on economic modeling. Its sole deliverable will be to estimate the elasticity of insect protein production relative to welfare certification. If the model suggests that welfare standards can be implemented without triggering significant volume expansion, it creates a "trigger" for future fellowship cycles. This allows us to take the scale argument seriously without violating the endowment's requirement for tangible, five-year welfare gains.

  **Timeline and Next Steps**

  1.  **April 17 Meeting:** Committee vote to ratify this recommendation.
  2.  **April 30:** Offer of fellowship extended to the Broiler Chicken applicant.
  3.  **June 1:** Request for Proposals issued for the Insect Welfare Economic Scoping Study.
  4.  **December 1:** Scoping study results reviewed. If the net effect can be signed positive, the Insect Welfare Indicators project is prioritized for the *next* fellowship cycle, contingent on endowment availability.

  **Conclusion**

  This decision prioritizes the certainty of welfare improvement for known sentient beings over the speculative magnitude of welfare improvement for probabilistic sentient beings, specifically due to the risk of unsigned net outcomes. It acknowledges the mathematical force of the scale argument while adhering to the institute's mandate for actionable, positive impact within five years.

  I look forward to discussing this framework on the 17th.
