  There is a specific silence in this room. I can feel the division of it. Half of you are waiting for a sociological argument, trained to listen for definitions of causality and the integrity of variables. You are looking for precision. The other half is waiting for a story, trained to listen for the rhythm of sentences and the truth of character. You are looking for resonance. And a significant portion of the first half is wondering why a novelist is standing here at all. There is a prevailing suspicion in the academy that people who make things up for a living have no business speaking about causation. We deal in consequences, not causes. We show what happens, not why. To claim otherwise is to confuse aesthetics with mechanics. It is to mistake the map for the territory. I acknowledge this skepticism. It is not entirely wrong. But Miriam Halloway invited me anyway, and she was not given to sentimental errors.

  Miriam read every page I wrote about the Huguenot weavers, the merchant house, the mill town. She liked the sentences. She hated the theory. She told me, repeatedly, that I was writing seductive costumes and calling them causes. In each book, a generation's decisive choice is made in explicitly doctrinal language: a refusal to lend at interest to a coreligionist, a decision to reinvent a failing workshop rather than sell it, a daughter sent into the mill rather than kept at home. Miriam's charge was that in every case I had made a belief do the work while an interest was already doing it. She said my novels were a particularly seductive version of the thesis she spent her career opposing—the one associated with Weber about the spirit of capitalism and ascetic Protestantism, and the vaguer, more comfortable claim that ideas steer history. She argued that if the economic pressure was sufficient, the action would have occurred regardless of the prayer book. The prayer book was just the costume worn by the interest.

  She had a line she used in nearly every seminar. If you cannot say what would have happened differently without the idea, you have described a costume and not a cause. It is a brutal test. It is a counterfactual test. It asks you to remove the belief and see if the action remains. It demands you isolate the variable. When I write, I actually do what she asks. I test a scene by drafting it twice. Once with the doctrine in the character's mouth. Once with it removed. I strip the dialogue of its theology. I strip the internal monologue of its justification. I leave only the physical act.

  [INSERT PLACEHOLDER: Describe a specific scene from the second novel, the merchant house. A man stands over a ledger in a cold room. He decides not to invest in a lucrative venture involving a distant ship. In Draft One, he cites religious prohibition against usury and the danger to his soul. In Draft Two, he cites fear of market instability and the risk to his capital. The physical action—closing the ledger, blowing out the candle, walking away—is identical. The note should specify that the external behavior is indistinguishable to an observer, but the internal justification shifts completely.]

  What I found is that the outward behavior survives the deletion. The ledger entry is the same. The daughter is on the same road. The ship remains uninvested. But what changes is the description under which the act is done. And above all, whether it repeats. A motive that arrives once lapses. It is a spike in the data. It is a reaction to a specific pressure. A motive the character can name to themselves in a borrowed vocabulary holds for forty years. It becomes a habit. It becomes a life. It becomes something you can teach your son. When a man refuses a loan because of God, he can tell his son he refused it because of God. The son learns the rule. When a man refuses a loan because of a vague feeling of risk, he tells his son to be careful. The son learns nothing specific. The first refusal builds a wall. The second builds a mood. Walls last longer than moods.

  This suggests a distinction Miriam's test exposes only partially. We need to sharpen a three-way distinction. First, an idea as a motor, supplying a desire that was not there before. This is rare. Second, an idea as a switch, selecting among desires already present. This is common. Third, an idea as grammar, supplying the vocabulary in which an action becomes describable, and so rehearsable, transmissible, and steady across a life. Miriam's counterfactual test is well designed to expose motors and switches. If you remove the motor, the car stops. If you remove the switch, the light stays off. The behavior changes immediately. The counterfactual holds. But grammar is different. Deleting a vocabulary does not delete any immediate behavior. It only leaves the behavior unnameable. And in my experience, unnameable acts are temporary. They cannot be rehearsed. They cannot be transmitted to a child who asks why we do this. They cannot become a pattern. They dissolve back into the noise of immediate interest.

  My novels can only ever do the third thing. They cannot make anyone want anything new. I cannot give a reader a desire they did not already possess. If they do anything at all, it is to hand a reader a description under which some stretch of their own life becomes steady. This leaves us with a question for Weber's thesis. I do not want to resolve this disagreement by saying that both of us were partly right. I do not want to claim that she would have come around. She was too rigorous for that, and I am too committed to the craft that annoyed her. The question I want put to the room, and left genuinely open, is whether the third thing is enough for Weber's thesis. Did the thesis need ideas to supply new desires at all? Or did it only need ideas to make a pattern of life durable enough to be recognized as a pattern? Is a cause that fixes only the description of an act a cause, or an elaborate way of redescribing one? If the spirit of capitalism is merely a grammar that allowed certain behaviors to stabilize into a system, does that save the thesis, or does it confirm Miriam's suspicion that the material interest was the only real engine? Weber was asking about a pattern of life. A pattern requires repetition. Repetition requires a rule. Rules require language. If the language is the cause of the rule, and the rule is the cause of the pattern, then the language is a cause of the pattern. But is it the cause of the act? That is the knot.

  Miriam asked that the word legacy not be used. She asked that no one say she is watching over anything. She asked for an argument. She left a note asking that this series open with someone who would argue with her rather than eulogize her. She knew that comfort is the enemy of thought. She knew that grief often seeks to smooth over contradictions that should remain sharp. So I will not offer you comfort. I will not tell you she is proud. I will offer you her instrument. She spent forty years arguing that culture is never a cause. She was rigorous. She was unyielding. She was my friend. The best way to honor that request is not to agree or disagree, but to work.

  So here is what I want you to do. Take her counterfactual test. It is not just for sociologists. It is for anyone trying to understand why they did what they did. Go and delete your favorite variable from your own explanation. Remove the idea. Remove the interest. See what survives. If the behavior remains, ask yourself if it can hold without the name. If it cannot, ask yourself if that makes the name a cause. Do not feel anything about this. Do not look for closure. Do not seek a verdict. Do it. See what survives.
