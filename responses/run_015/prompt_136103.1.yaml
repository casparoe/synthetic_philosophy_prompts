answer: |-
  # Specification of Adequacy for a Norm of Assertion

  ## I. Requirements List

  **1. Normative Structure (Correctness and Permissibility)**
  *   **Requirement:** The account must specify conditions for *correctness* (whether the assertion succeeds in its aim) and *permissibility* (whether the speaker is entitled to make it). A single norm may supply both if it distinguishes objective satisfaction from subjective entitlement; otherwise, two coordinated norms are legitimate.
  *   **Motivation:** Distinguishes warranted but false assertion (incorrect but permissible) from reckless truth-telling (correct but impermissible).
  *   **Status:** Non-negotiable.

  **2. Explanatory Scope (Reactive Attitudes)**
  *   **Requirement:** The norm must explain the propriety of specific challenges ("How do you know?"), the awkwardness of Moorean-paradoxical utterances ("p but I don't know p"), and the pressure to retract upon learning falsity.
  *   **Motivation:** These are the distinctive phenomenological and dialectical markers of the practice of assertion.
  *   **Status:** Non-negotiable.

  **3. Domain Generality (Content and Speaker)**
  *   **Requirement:** The norm must apply to hedged, vague, moral, aesthetic, and future-directed content. It must also apply to composite or artificial speakers (press offices, AI) where no single mind holds the epistemic state.
  *   **Motivation:** Assertion occurs in these contexts; a norm restricted to flat, individual, factual claims is descriptively incomplete.
  *   **Status:** Non-negotiable (per project scope).

  **4. Boundary Maintenance**
  *   **Requirement:** The norm must not collapse the distinction between assertion and neighbouring acts (guessing, supposing, joking, conceding).
  *   **Motivation:** If the norm applies equally to guessing, it fails to identify what is specific to assertion.
  *   **Status:** Non-negotiable.

  **5. Accessibility (Guidance)**
  *   **Requirement:** The speaker must normally be able to tell whether she satisfies the norm *if* the norm is to function as a guide; however, the norm is not required to function as a first-personal decision procedure.
  *   **Motivation:** Balances the intuition that norms should guide action with the fact that epistemic status (e.g., knowledge) is not always transparent.
  *   **Status:** Negotiable.

  **6. Non-Circularity**
  *   **Requirement:** The norm should not rely on the very epistemic notion it is meant to illuminate (e.g., defining assertion via knowledge if the goal is to explain knowledge).
  *   **Motivation:** Theoretical utility; avoids triviality.
  *   **Status:** Preference (Knowledge Norm camp).

  ---

  ## II. Incompatibility Analysis

  **The Problematic Triad**
  There is a tension between three demands:
  1.  **Factivity:** Correctness requires truth or knowledge.
  2.  **Accessibility:** The speaker can normally tell if she satisfies the norm.
  3.  **Unity:** One unified norm applies across all content and speaker types (including AI/deference).

  **Analysis:** If correctness requires Knowledge (Factivity), and Knowledge is factive but not always transparent (denying Accessibility), the speaker cannot always know if they are correct. If you enforce Accessibility, you must lower the bar to Justified Belief (sacrificing Factivity). If you keep Factivity and Accessibility, you often must fragment the norm by context (sacrificing Unity/Contextualism).

  **Recommendation:** Drop **Accessibility** as a condition for *correctness*. Retain it only for *permissibility*.
  *   **Cost:** The norm cannot serve as a direct algorithm for "what to say." It becomes an evaluative standard rather than a heuristic.
  *   **Viability:** The resulting list is still worth having. It preserves the link between assertion and truth/knowledge (Factivity) and maintains a single standard for evaluation (Unity), while explaining why speakers are blamed only when they violate accessible standards (Permissibility).

  **Prejudices vs. Genuine Desiderata**
  *   **Constitutive Rule vs. Evaluative Standard:** *Prejudice.* Both can satisfy the job description; requiring "constitutive" status excludes evaluative views without cause.
  *   **Single Norm vs. Dual Conditions:** *Prejudice.* As noted in Requirement 1, a single rule with two parameters is functionally equivalent to two coordinated norms. Insisting on "one rule" is terminological.
  *   **Expression of Belief:** *Prejudice.* This excludes composite/AI speakers and selfless assertion. It is not required for the job description.
  *   **Non-Circularity:** *Genuine Desideratum.* A norm that presupposes the notion it explains offers no theoretical illumination.

  **Most Exclusionary Requirement**
  **Factivity (specifically Knowledge).** This single requirement excludes Justified Belief norms, Reasonable Belief norms, and many Contextualist views immediately. It is the highest barrier to entry for candidate norms.

  ---

  ## III. Comparative Table

  | Requirement | Knowledge Norm | Truth Norm | Justified Belief Norm | Contextualist / Hybrid |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Normative Structure** | Pass (Correctness=Know, Perm=Belief) | Pass (Correctness=True, Perm=Justified) | Pass (Correctness=Justified, Perm=Sincere) | Uncertain (Varies by context) |
  | **2. Explanatory Scope** | Pass (Explains challenges/retraction well) | Pass (Explains retraction, struggles with challenges) | Pass (Explains challenges, struggles with retraction) | Pass (Explains variance, struggles with unity) |
  | **3. Domain Generality** | Fail (Struggles with AI/Composite speakers) | Fail (Struggles with moral/aesthetic content) | Pass (Applies to any belief-holding system) | Uncertain (Depends on context parameters) |
  | **4. Boundary Maintenance** | Pass (Distinguishes from guessing clearly) | Pass (Distinguishes from guessing clearly) | Uncertain (Warranted guessing may blur line) | Pass (Context sets the boundary) |
  | **5. Accessibility** | Fail (Knowledge is not always transparent) | Fail (Truth is not always transparent) | Pass (Justification is usually accessible) | Pass (Standards shift to accessibility) |
  | **6. Non-Circularity** | Fail (If used to analyze knowledge itself) | Pass (Truth is distinct from assertion) | Pass (Justification is distinct from assertion) | Uncertain (Depends on context basis) |
