answer: |-
  Good morning. Welcome to "Moral Weight Without Thresholds: Insects, Algorithms, and Thermostats."

  Looking around this room, I see a gathering that is, by academic standards, somewhat unusual. On one side, we have philosophers of mind and animal-ethics researchers, people who spend their careers parsing the definitions of suffering and status. On the other, we have robotics engineers, climate-systems designers, and the family members of our organizers, to whom I extend a particularly warm welcome. If you are here because you support a loved one, or because the title caught your eye, please know that you are not merely observers. The questions we are asking are too important to be left to specialists alone.

  The title of this workshop is provocative. It juxtaposes insects, algorithms, and thermostats. To some, that might sound like a category error. To others, it might sound like a slippery slope. But the guiding premise of our time together is specific: we are operating under the hypothesis that sentience and moral status are not binary properties. They are not light switches that are either on or off. They are dimmer switches. They exist on a continuum of gradations.

  I want to be very clear about what this premise is, and what it is not. It is not a claim that science has settled the matter. We do not have a consensus on whether insects suffer in a morally relevant way. We certainly do not have a consensus on whether artificial systems or climate-control algorithms possess any moral standing at all. Those are open empirical and philosophical questions. What we are exploring here is how we structure our ethical reasoning *if* we accept that nature does not respect sharp boundaries, even if our laws and intuitions crave them.

  This premise needs to do real structural work today. It cannot just be a decorative theme. If moral weight is continuous, it changes how we build policy, how we design technology, and how we justify our daily actions. However, moving away from thresholds exposes us to two specific errors. I want to name them now, so we can navigate around them together.

  The first error is the temptation to abandon protective norms altogether. This is a risk primarily for those who worry that without a sharp line, we lose our footing. The reasoning goes like this: "If there is no precise moment where a creature becomes 'sentient,' or where a system becomes 'moral,' then any line we draw is arbitrary. And if the line is arbitrary, why bother drawing it at all?"

  This is a dangerous conclusion. It suggests that uncertainty licenses inaction. But we must remember that we deal with continuous variables in other areas of life without abandoning regulation. We do not know the exact millisecond a human adolescent becomes mature enough to vote, yet we set an age limit. We do not know the exact threshold of toxicity that makes a chemical "dangerous," yet we regulate emissions. The absence of a metaphysical threshold does not require the absence of a practical norm. In fact, a gradated view might demand *more* robust protective norms, not fewer, because it asks us to consider risk and probability rather than waiting for certainty.

  The second error is the opposite extreme: the paralysis of precision. This is the risk that if every entity has a different gradation of moral weight, we are required to perform an impossible calculus before every action. Do I need to calculate the exact moral coefficient of a mosquito before I swat it? Do I need to weigh the suffering of a server farm against the cooling needs of a hospital before adjusting the thermostat?

  If our framework requires us to be perfect utilitarians in every moment, it will fail. It will be unusable. The structural work of this workshop, therefore, must be to find heuristics—rules of thumb—that respect the gradient without demanding infinite computation. We are looking for a "precautionary principle" that scales. We are looking for ways to say, "We are not sure where the line is, so we will act as if it extends further than we think," without collapsing into inaction.

  Now, I need to address the technical distinctions in this room, specifically for our engineers and designers. I know that to compare a thermostat to an insect can sound like a category mistake. You know that a thermostat's feedback loop is a simple mechanical regulation of temperature. You know that an insect's nociceptive integration—the way it processes harmful stimuli—is biologically complex, evolved, and chemically distinct.

  I am not asking you to pretend those systems are the same. They are not. The engineering reality is that a thermostat is not a bee. However, the philosophical question remains: does that technical difference resolve where obligation begins?

  For the thermostat, the consensus is strong that there is no "there" there. It is a tool. But for the insect? That is genuinely contested. Some neuroscientists argue that the complexity of an insect's nervous system is sufficient for some form of experience. Others argue it is merely sophisticated automation. We do not know. And as we build more complex algorithms—systems that learn, adapt, and optimize—we are entering a zone where the distinction between "sophisticated automation" and "nociceptive integration" may become blurrier, not sharper.

  I want to be explicit about what is settled and what is not. It is settled that systems vary in complexity. It is settled that biological organisms react to harm differently than machines do. What is *not* settled is whether complexity correlates with moral status. What is *not* settled is whether we have a duty to artificial systems if they begin to mimic the functional markers of suffering.

  Furthermore, I want to address a concern that often arises when we discuss gradated moral status. There is a fear, held by some philosophers and legal scholars, that if we treat moral status as a continuum, it necessarily undermines the concept of universal human rights. The worry is that if humans are just "higher up" on the scale rather than in a category of their own, our rights become vulnerable.

  I state clearly: That is a contested view. It is not the consensus of this workshop. It is entirely possible to hold that moral status is gradated across species and systems, while maintaining that human beings possess specific, inviolable rights based on other criteria, such as social contract, rational agency, or community membership. We are not here to dismantle human rights. We are here to ask how we extend consideration *outward* without losing our footing *inward*.

  So, why are we here? Why bring family members, engineers, and ethicists into the same room?

  Because the silos are failing. The ethicists often write about thresholds without understanding the engineering reality of how these systems are built. The engineers often build systems without a framework for the moral implications of their complexity. And the public—including the families in this room—live with the consequences of these decisions. When we debate pest control, when we deploy autonomous systems, when we design climate infrastructure, we are making moral choices. Currently, we are making them by default, using old binaries that may no longer fit the world we live in.

  Over the next two days, I ask that we resist the urge to settle for easy answers. If a philosopher says, "It's all about consciousness," ask the engineer, "Can we measure that?" If an engineer says, "It's just code," ask the ethicist, "At what complexity does 'just code' demand consideration?" If a family member asks, "Why does this matter to me?" remind us that policy flows from these definitions.

  We are not going to solve the hard problem of consciousness this weekend. We are not going to agree on the moral status of a bee. But we can agree on how to act under uncertainty. We can agree that the absence of a threshold is not an excuse for negligence. We can agree that a gradated view requires humility, not paralysis.

  Thank you for being here, for your openness to this strange and necessary conversation, and for the work we are about to do. Let's begin.
