prompt: |-
  Hey — I mod a pretty large online community (forum plus a Discord, ~40k members, rationalist/EA-ish core with a big general-interest tail), and the mod team is six volunteers doing this in our spare time. Two or three times a month someone does something and a chunk of the community demands we sanction them: ban them, delete or lock their posts, pull their invite to an in-person meetup, put a visible note on their profile, or publicly confirm or deny an accusation. Right now each of these turns into a 300-comment thread and we decide by vibes, so we've definately been inconsistent and everyone can tell.

  What I want is a decision procedure, not more framings. Take whatever the philosophy of punishment actually has to say — retributive vs. deterrence vs. communicative/expressive vs. restorative accounts, proportionality, the line between punishing someone and merely declining to associate with them or protecting the group, whether the punisher needs standing and on whose behalf they're acting, whether reasons and a chance to respond are owed, whether a sanction can be undone — and turn it into something six tired volunteers can actually run in an evening on a real case, in about an hour of discussion, and write up afterwards as a short public note. Constraints: no lawyer, no investigator, usually only what the parties tell us; majority of the six signs off; we post the anonymized reasoning publicly because transparency is the whole reason anyone trusts us.

  A few things I keep half-remembering from blogs that I think have to be built in, and please tell me if I've got them wrong:

  - The ratchet: a sanction that's formally temporary is functionally permanent, because search engines, archives and screenshots don't decay. Whatever we do, its real severity is set by an audience of strangers we didn't choose, not by the community we were talking to. So "a two-week ban" and "a permanent mark on this person's search results" may be the same action and we should have to say which one we're doing.
  - Related: the severity we intend and the severity that gets delivered come apart, and we don't control the translation. One member's mild rebuke is another audience's career-ender. I want a step where we say who the addressee of the sanction is supposed to be, and what happens if we can't keep it to them.
  - There is no sanction budget. Nobody is tracking or able to track the total amount of sanction a person is receiving across venues, so "proportionate to the act" is not the same as "proportionate to what this person will actually experience." Sometimes the right move is to sanction less than the act deserves; sometimes doing nothing is the pile-on.
  - The abstraction test: rewrite the offense description with no proper names, no ideological markers and no in-group/out-group markers, re-run the procedure on the rewrite, then re-run it with a randomly chosen member in the role. If the verdicts differ, something other than the act is doing the work.

  The procedure needs: the questions in order; what counts as a sufficient answer to each; where it stops with a no; and where it hands the decision to a person because it's a values question rather than a factual one (I think one of those is whether we're a private club we may exclude people from for any reason or none, versus something closer to infrastructure people depend on for professional and social goods — that one we should vote on once and then it changes everything downstream, so flag it).

  Cases it has to handle without falling over:
  1. A long-time, well-liked contributor who was repeatedly rude and dismissive to a newcomer, never broke a written rule, and the newcomer quietly left.
  2. An allegation about something serious that happened off-platform, years ago, entirely legal, which we can't verify because the evidence is a private conversation and the complainant won't consent to sharing it — and the member's real name is on their account.
  3. Someone another community already sanctioned hard for the same conduct, where people want us to either pile on or publicly affirm that sanction.

  Then: run the procedure on all three, and make at least one of them come out somewhere the team will hate — we have to publicly decline to sanction someone most of us think is a jerk, or we have to sanction a popular contributor, or we have to say something that will read as taking a side. Tell us which one that is and how to defend it in the public note. Finally, be honest about what the procedure can't do: which kinds of case it will systematically misfire on, and which of the hard questions it just relocates rather than answers.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Moderator of a large online community (~40k members, rationalist/EA-ish core).
      *   **Team:** 6 volunteers, spare time.
      *   **Problem:** Inconsistent sanctions based on "vibes," leading to 300-comment drama threads.
      *   **Goal:** A concrete *decision procedure* (not just philosophy) based on punishment theory (retributive, deterrence, restorative, etc.) that fits constraints (1 hour discussion, majority vote, public anonymized reasoning).
      *   **Key Constraints/Insights to Integrate:**
          *   "The Ratchet" (temporary sanctions are often permanent due to archives).
          *   "Severity Mismatch" (intent vs. impact/audience).
          *   "No Sanction Budget" (cumulative impact across venues is unknown).
          *   "The Abstraction Test" (remove names/ideology to check bias).
          *   Need clear stop conditions (where it ends with "no") and handoff points (values questions).
          *   Must handle specific hard cases (rude veteran, unverified off-platform allegation, cross-community sanction).
          *   Must produce an outcome the team might hate (to prove robustness).
          *   Must admit limitations (where it misfires).

  2.  **Deconstruct the Philosophy into Operational Steps:**
      *   *Retributive:* Did they break a rule? Is there culpability?
      *   *Deterrence:* Will stopping them stop others? Is the sanction visible enough?
      *   *Restorative:* Can harm be repaired? Does the victim want repair?
      *   *Protective/Associative:* Is this about safety or just preference? (The "Private Club vs. Infrastructure" question).
      *   *Procedural Justice:* Did they get a chance to respond? Are reasons clear?

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Phase 0: The Foundation Vote.* The prompt mentions the "Private Club vs. Infrastructure" distinction. This *must* be decided once, not per case. Let's call this the "Standing Declaration."
      *   *Phase 1: Triage & Jurisdiction.* Can we even touch this? (Off-platform? Unverifiable?)
      *   *Phase 2: The Abstraction Test.* Crucial for bias checking.
      *   *Phase 3: The Sanction Logic.* Distinguishing between Protection (safety) and Punishment (norm enforcement).
      *   *Phase 4: The Ratchet Check.* Acknowledging permanence.
      *   *Phase 5: The Verdict & Note.*

      *Refining the Steps:*
      *   Need clear "Stop" conditions. If we can't verify, we stop. If it's not our jurisdiction, we stop.
      *   Need to address the "Severity Mismatch."
      *   Need to force the "Private Club" question early.

  4.  **Developing the "Standing Declaration" (The Values Handoff):**
      *   The team needs to vote *once* on whether they are a "Safe Space/Club" (exclude for vibes/fit) or "Public Infrastructure" (exclude only for clear harm/rules). Given the "rationalist/EA-ish" description, they likely function as infrastructure for professional/social goods. I will frame the procedure assuming they *claim* to be Infrastructure, as that makes the hard cases harder and fits the "transparency" goal.

  5.  **Developing the Decision Matrix (The 1-Hour Workflow):**
      *   *Step 1: Jurisdiction & Verification.* (Hard stop if no evidence).
      *   *Step 2: Abstraction.* (Rewrite the case).
      *   *Step 3: Purpose.* (Protect vs. Punish).
      *   *Step 4: Proportionality & Ratchet.* (Is the cure worse than the disease?).
      *   *Step 5: The Vote.*

  6.  **Testing against the Three Cases:**

      *   *Case 1 (Rude Veteran):* Rule-breaking is fuzzy. Harm is real (newcomer left).
          *   *Procedure outcome:* Likely a private warning or no public sanction. Public shaming is disproportionate to "rudeness" given the Ratchet.
          *   *Hate factor:* The community wants the jerk gone. The procedure says "we can't verify severity without escalating."

      *   *Case 2 (Off-platform, Unverified):* Serious allegation, no proof, real names involved.
          *   *Procedure outcome:* **NO SANCTION.** Jurisdiction fails. Verification fails. Ratchet risk is too high (career-ender).
          *   *Hate factor:* This is the one the team will *really* hate. Everyone "knows" the guy is bad, but the procedure forces inaction. This is the robustness test.

      *   *Case 3 (Cross-Community Sanction):* Already punished elsewhere.
          *   *Procedure outcome:* Defer or align, but don't pile on. If they are banned elsewhere, they are effectively banned here if the communities overlap significantly. But a *new* sanction here might be double jeopardy.
          *   *Hate factor:* People want to signal virtue by punishing again. Procedure says "Sanction Budget" constraint applies.

      *Selection for the "Hate" Outcome:* Case 2 is the strongest candidate for a procedure that protects the *system* over the *urge to punish*. It forces the mods to say "We cannot act on rumors," which will anger the accusers. Or Case 1, where the procedure protects the "well-liked contributor" because the rule violation is subjective. Let's go with **Case 2** for the "Hate" outcome because it directly confronts the "vibes vs. evidence" tension and the "career-ender" risk. Actually, looking at the prompt ("publicly decline to sanction someone most of us think is a jerk"), Case 1 fits well too. But Case 2 is more dangerous legally/safety-wise. Let's choose **Case 2** as the primary "Hard No" because it highlights the "Infrastructure" constraint best. *Wait, re-reading:* "make at least one of them come out somewhere the team will hate — we have to publicly decline to sanction someone most of us think is a jerk." Case 1 fits "jerk" better than Case 2 (which is "alleged abuser"). Let's use Case 1 for the "Jerk" outcome. It's more common. The team thinks he's a jerk, the procedure says "No public sanction."

      *Correction:* Actually, Case 2 is the more philosophically interesting "Hard No." If we sanction on unverified off-platform claims, we become a kangaroo court. If we don't, we look weak. I will select Case 2 as the one where the procedure forces a "No Action" that feels morally unsatisfying but procedurally necessary. *Wait, let's look at the "Hate" constraint again:* "publicly decline to sanction someone most of us think is a jerk." Case 1 is the "Jerk." Case 2 is the "Alleged Criminal/Abuser." I should probably make Case 1 the one where we protect the "Jerk" due to lack of clear rule violation vs. Ratchet risk. That feels more true to the "inconsistent vibes" problem.
      *Decision:* I will use **Case 1** for the "Hate" outcome. The team hates the guy, but the procedure says "Private Warning Only" because public shaming is a permanent sanction disproportionate to rudeness.

  7.  **Refining the "Public Note" Structure:**
      *   Needs to be anonymized.
      *   Needs to cite the procedure steps.
      *   Needs to acknowledge the Ratchet.

  8.  **Addressing Limitations:**
      *   What does this *not* solve? Coordinated harassment, legal threats, immediate safety risks (these need emergency protocols, not this procedure). It doesn't solve the "truth" problem in he-said-she-said.

  9.  **Final Polish:**
      *   Ensure tone is pragmatic, not academic.
      *   Check constraints: 6 volunteers, 1 hour, majority vote.
      *   Make sure the "Standing Declaration" is prominent.

  10. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe include a "Restorative Justice" step.
      *   *Correction:* No, that takes too long and requires buy-in. Keep it to "Protect vs. Punish."
      *   *Initial thought:* Allow temporary bans.
      *   *Correction:* The prompt emphasizes the "Ratchet." The procedure must treat *all* bans as permanent for the sake of the decision matrix. If you can't justify a permanent mark, you can't ban.
      *   *Check:* Did I include the "Abstraction Test"? Yes, Step 2.
      *   *Check:* Did I include the "Sanction Budget"? Yes, Step 4.

  11. **Final Review against Prompt:**
      *   Decision procedure? Yes.
      *   Philosophy integrated? Yes (Retributive, Deterrence, Protective).
      *   Constraints met? Yes (1 hour, 6 mods).
      *   Cases handled? Yes.
      *   One outcome the team hates? Yes (Case 1).
      *   Limitations admitted? Yes.

      *(Self-Correction on Case 2)*: Actually, Case 2 is the most dangerous. If I tell them to ignore unverified allegations of serious harm, that might be irresponsible. I need to nuance that. If it's *safety* related (threats), they act. If it's *moral* related (past bad behavior), they don't. I will distinguish "Protection" (safety) from "Sanction" (punishment). Case 2 should result in "No Sanction" but possibly "Monitoring" or "Private Conversation." But the prompt asks for a sanction procedure. I will stick to "No Formal Sanction" for Case 2 to highlight the evidentiary bar.
      *Wait, let's stick to the "Jerk" instruction.* "publicly decline to sanction someone most of us think is a jerk." That points squarely at Case 1. I will focus the "Hate" outcome there.

      *Let's write it.*
answer: |-
  This is a **Moderation Decision Protocol (MDP)**. It is designed to be printed, placed in front of the six moderators, and executed within 60 minutes. It converts philosophical constraints into binary gates.

  ### Part 0: The Standing Declaration (Vote Once)
  *Before running cases, the team must vote on this. It determines the burden of proof for all future cases.*

  **Question:** Are we a **Private Club** (association for shared values, exclusion allowed for fit/vibes) or **Public Infrastructure** (essential utility for professional/social coordination, exclusion only for clear harm/rules)?
  *   **If Club:** You may sanction for "culture fit." Low burden of proof. High discretion.
  *   **If Infrastructure:** You may *only* sanction for rule violations or safety threats. High burden of proof. Low discretion.

  *Recommendation:* Given your size (40k) and the "rationalist/EA" professional overlap, you function as **Infrastructure**. The procedure below assumes this classification. If you vote "Club," skip Step 2 (Abstraction) and Step 4 (Ratchet), but expect higher drama.

  ---

  ### Part 1: The Protocol (60 Minutes Max)

  **Materials:** Timer, Case Summary (max 1 page), Redacted/Abstracted Version (prepared by one mod before the meeting).

  #### Step 1: Jurisdiction & Verification (10 Mins)
  *Philosophy: Procedural Justice & Epistemic Humility.*
  **Question:** Do we have first-hand evidence or verified testimony that violates a *written* rule or safety policy?
  *   **Yes:** Proceed to Step 2.
  *   **No (Hearsay/Off-platform/Unverified):** **STOP.**
      *   *Action:* No formal sanction. You may offer a private "check-in" with the accused if safety is ambiguous, but no record is kept.
      *   *Reasoning:* We lack standing to adjudicate unverified claims. Sanctioning here creates a kangaroo court.
  *   **Hard Stop:** If the allegation is purely off-platform and the complainant refuses to provide evidence usable by mods, you cannot act.

  #### Step 2: The Abstraction Test (10 Mins)
  *Philosophy: Rule of Law & Bias Mitigation.*
  **Action:** Read the **Abstracted Version** (names, genders, ideologies, and status removed).
  *   *Example:* "A high-status member" becomes "Member A." "A newcomer" becomes "Member B." "EA cause" becomes "Community Topic."
  **Question:** If Member A were a random new user and Member B were a veteran, would we be having this discussion?
  *   **Yes:** Proceed to Step 3.
  *   **No:** **STOP.**
      *   *Action:* Dismiss the demand for sanction.
      *   *Reasoning:* The outrage is status-driven, not rule-driven. Acting now confirms bias.

  #### Step 3: Purpose Classification (15 Mins)
  *Philosophy: Protective vs. Retributive.*
  **Question:** What is the primary goal of acting here? (Choose **one**)
  1.  **Protection:** Preventing immediate harm/safety risk to specific users.
  2.  **Norm Enforcement:** Signaling that a specific rule violation is unacceptable to deter others.
  3.  **Retribution:** Making the offender "pay" for moral wrongs.

  *   **If Protection:** You may use temporary bans/mutes. Focus is on safety, not shame.
  *   **If Norm Enforcement:** Proceed to Step 4.
  *   **If Retribution:** **STOP.**
      *   *Reasoning:* Volunteers have no standing to inflict pain for pain's sake. This is vigilante justice.

  #### Step 4: The Ratchet & Budget Check (15 Mins)
  *Philosophy: Proportionality & The Ratchet Effect.*
  **Question:** We acknowledge that *any* public note or ban is effectively permanent due to archives.
  1.  Is the proposed sanction proportional to the *permanent* record it creates?
  2.  Have we accounted for the "Sanction Budget"? (i.e., Is this person already being dogpiled elsewhere? Will our action be the straw that breaks their career?)

  *   **If Sanction > Permanent Record:** **Downgrade Sanction.** (e.g., Swap Public Ban for Private Warning + Post Lock).
  *   **If Sanction Budget is Full:** **Decline Sanction.**
      *   *Reasoning:* We are not the sole arbiter of justice. Adding weight to a pile-on is disproportionate.

  #### Step 5: The Vote & Note Drafting (10 Mins)
  *   **Vote:** Majority of 6 required.
  *   **Drafting:** Use the template below. Do not deviate.

  ---

  ### Part 2: The Public Note Template
  *Transparency requires explaining the "Why," not just the "What."*

  > **Moderator Note on Recent Events**
  >
  > **The Situation:** [One sentence, anonymized. e.g., "A discussion regarding conduct between members escalated."]
  > **The Decision:** [Sanction / No Sanction / Private Warning].
  > **The Reasoning:**
  > 1. **Jurisdiction:** [We did/did not have verifiable evidence of rule violations.]
  > 2. **Proportionality:** [We considered the permanence of this record vs. the severity of the act.]
  > 3. **Precedent:** [Applying the Abstraction Test, this aligns with how we treat similar cases regardless of status.]
  >
  > **On Sanction Limits:** We recognize that online sanctions have real-world consequences. We have chosen [Action X] because it balances community safety with the understanding that [Archives make temporary bans permanent / We are not a court of law].

  ---

  ### Part 3: Running the Cases

  Here is how the protocol handles your three scenarios.

  #### Case 1: The Rude Veteran (The "Jerk" Problem)
  *   **Facts:** Long-time contributor, rude to newcomer, no written rule broken, newcomer left.
  *   **Step 1 (Jurisdiction):** **Fail.** No written rule broken.
  *   **Step 3 (Purpose):** If you try to classify this as "Norm Enforcement," you admit you are enforcing unwritten norms.
  *   **Protocol Verdict:** **No Public Sanction.** Issue a private warning citing "community health" (if Club) or "tone" (if Infrastructure).
  *   **The "Hate" Outcome:** The team *hates* this guy. He's a jerk. The community wants him gone. The protocol forces you to **decline public sanction.**
  *   **Defense in Public Note:**
      > "While the tone of the interaction was inconsistent with our community ideals, no specific written rule was violated. We do not sanction based on 'vibes' or interpersonal friction alone, as this creates inconsistent enforcement. We have addressed this privately with the member."
  *   **Why this hurts:** It feels like protecting privilege.
  *   **Why it's necessary:** If you publicly ban for "rudeness" without a rule, you grant yourselves infinite discretion. The Ratchet means this person is now "The Guy Who Got Banned For Rudeness" forever. That is disproportionate.

  #### Case 2: The Unverified Off-Platform Allegation
  *   **Facts:** Serious allegation, years ago, legal but immoral, no evidence, real names attached.
  *   **Step 1 (Jurisdiction):** **Hard Stop.** No verification. Off-platform.
  *   **Protocol Verdict:** **No Action.**
  *   **Defense in Public Note:**
      > "We received allegations regarding conduct outside this community. Without verifiable evidence or consent to investigate, we lack the standing to adjudicate. We do not sanction based on rumor, regardless of severity, to protect all members from unverified claims."
  *   **Why this hurts:** It looks like you don't care about harm.
  *   **Why it's necessary:** If you act here, you become a tool for settling personal scores. The "Career-Ender" risk (Ratchet) is highest here. You cannot be the judge of unverified past sins.

  #### Case 3: The Cross-Community Sanction
  *   **Facts:** Banned elsewhere for same conduct. Community wants you to pile on.
  *   **Step 1 (Jurisdiction):** Did they break *your* rules? If yes, proceed. If no (just "they are bad elsewhere"), Stop.
  *   **Step 4 (Budget):** **Sanction Budget Exceeded.**
  *   **Protocol Verdict:** **Decline Additional Public Sanction.** Acknowledge the other ban if relevant to safety, but do not add a *new* punitive layer.
  *   **Defense in Public Note:**
      > "This member is sanctioned in Partner Community X. We honor that exclusion where our platforms overlap. However, we will not issue a secondary public condemnation. Our sanction budget focuses on conduct within this venue, not coordinating punishment across the ecosystem."
  *   **Why this hurts:** People want to signal virtue by punishing the "enemy."
  *   **Why it's necessary:** Double jeopardy. If they are already effectively exiled, your public note adds pain without adding safety.

  ---

  ### Part 4: Limitations & Misfires
  *Be honest about where this breaks.*

  1.  **The "Safety" Loophole:** This protocol is for *sanctions*. If someone poses an immediate physical threat or doxxing risk, **ignore the protocol.** Use an emergency "Protective Ban" (no discussion, review later). This protocol is too slow for safety.
  2.  **The "He-Said-She-Said" Gap:** In Case 2, the protocol systematically favors the accused over the accuser. This is a feature of "Infrastructure," but it will systematically alienate victims who cannot produce "court-ready" evidence. You must accept this cost.
  3.  **The "Vibes" Relocation:** By banning "Retribution" (Step 3), you relocate the question to "Norm Enforcement." Smart mods will code retributive desires as norm enforcement. The Abstraction Test (Step 2) is your only guardrail there. If the team cheats on Step 2, the protocol fails.
  4.  **The "Private Warning" Illusion:** We treat private warnings as "No Sanction." In reality, leaks happen. If a private warning leaks, it becomes a public sanction without the public reasoning. You cannot fully control the Ratchet, only your contribution to it.

  ### Implementation Advice for the Team
  1.  **Print the Protocol.** Do not keep it in a Google Doc. Physical paper signals "This is the law, not a suggestion."
  2.  **Appoint a "Devil's Advocate."** Rotate this role every meeting. Their only job is to argue Step 2 (Abstraction) and Step 4 (Ratchet).
  3.  **The "One-Hour" Hard Stop.** If you haven't decided in 60 minutes, the default is **No Sanction.** Indecision means the evidence isn't clear enough for a permanent mark.
  4.  **Own the Hate.** When you post the note for Case 1 (The Rude Veteran), expect the drama. Reply once: *"We followed our published protocol. We value consistency over satisfying immediate outrage."* Then lock the thread.

  This procedure will not make you popular. It will make you boring, consistent, and occasionally frustrating. That is the price of moving from "vibes" to "infrastructure."
