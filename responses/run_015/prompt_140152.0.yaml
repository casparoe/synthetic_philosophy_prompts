answer: |-
  This is a rare configuration of background and constraints. You have the mathematical maturity to see through the economic hand-waving, the time to do it properly, and the specific irritation that usually precedes a genuine contribution.

  Here is the blunt assessment, the dependency map, and the research roadmap.

  ### 1. Blunt Assessment of Your Nagging Questions

  **(1) The "Which Wealth?" Problem (Frame/Boundary Choice)**
  *   **Verdict:** **Real Open Problem.** You are not confused.
  *   **Physics Analogy:** This is not a gauge choice; it is a **system boundary** problem. Standard Kelly treats the portfolio as a closed thermodynamic system with reinvestment. Real life is an open system with fluxes (salary in, consumption out) and non-tradable assets (human capital).
  *   **Status:** In finance, this is the "Merton Problem" (continuous time, consumption + investment), but the philosophical grounding for *why* we maximize geometric growth in that context is weak. In the "Geometric Rationality" community (Garrabrant, Taylor, etc.), this is often glossed over by assuming a specific utility structure over "resources" without defining the resource boundary.
  *   **Why it matters:** If you define wealth as "financial portfolio," Kelly says bet $X$. If you define wealth as "portfolio + net present value of future labor," Kelly says bet $Y \ll X$. Ignoring human capital leads to over-leverage and ruin. This is where the theory fails practitioners.

  **(2) The Ergodic/Asymptotic Justification**
  *   **Verdict:** **Half-Settled, Half-Muddle.**
  *   **The Math:** The asymptotic dominance of the growth-optimal strategy is a theorem (Breiman 1960). It is not in doubt *given* i.i.d. returns and infinite time.
  *   **The Muddle:** The normative leap ("therefore you should do it") relies on the ergodic hypothesis (time average = ensemble average). Ole Peters' "Ergodicity Economics" hypes this as a revolution, but for a physicist, it's just recognizing that $E[\ln W] \neq \ln E[W]$ in multiplicative processes.
  *   **The Real Problem:** You are correct that asymptotics are irrelevant for finite human horizons in non-stationary environments. The open question is **Finite-Time Ruin Probabilities under Parameter Uncertainty.** The "long run" is a distraction. The real constraint is the probability of hitting a lower absorbing barrier (ruin/unacceptable drawdown) before time $T$. This is a first-passage time problem, not an ergodic one.

  ### 2. The Core Thesis: "Statistical Mechanics of Lifecycle Growth"

  Do not spend two years just on Kelly. Kelly is the Ising Model—useful, but idealized. Spend two years on the **Merton-Kelly Bridge under Non-Stationarity.**

  Your unique value add is treating the agent's wealth dynamics as a stochastic process with boundary conditions (consumption, ruin) and external fields (labor income), and asking what optimization functional survives model misspecification.

  **The Question to Chew On:**
  > *In a non-stationary environment with finite horizons and non-tradable human capital, what optimization functional maximizes the probability of achieving solvency goals, and how does it deviate from log-utility?*

  ### 3. Dependency Map & Research Roadmap (2 Years)

  **Phase 1: The Formal Grounding (Months 1–6)**
  *   **Goal:** Distinguish the *theorem* from the *normative claim*.
  *   **Upstream Dependencies:**
      *   **Stochastic Control:** Master the Merton Problem (continuous time). Compare the HJB equation solution to discrete Kelly.
      *   **Utility Theory:** Read the "Geometric Rationality" papers (Taylor, Garrabrant) on why log-wealth emerges from coherence arguments (Dutch books). Contrast this with the dynamical justification (Peters).
  *   **Deliverable:** A rigorous note mapping the isomorphism between "maximize expected log wealth" (axiomatic), "maximize time-average growth" (dynamical), and "maximize probability of beating a benchmark" (goal-oriented).
  *   **Trap:** Do not get bogged down in the philosophy of probability. Stick to the measure theory.

  **Phase 2: The Boundary Condition Problem (Months 7–15)**
  *   **Goal:** Solve Question (1). Incorporate Human Capital.
  *   **Method:** Model total wealth $W_{tot} = W_{fin} + W_{human}$. $W_{human}$ is a stochastic cash flow stream (salary risk).
  *   **Physics Lens:** This is a particle in a potential well with stochastic forcing. Salary is a drift term; job loss is a jump process.
  *   **Tractability:** High for you. This is standard SDE modeling. The novelty is interpreting the "leverage" of human capital. (e.g., A young doctor with high stable income is implicitly leveraged; they should hold *less* risk in their portfolio).
  *   **Deliverable:** A simulation framework showing how "optimal Kelly fraction" scales with the bond-like vs. equity-like nature of human capital.

  **Phase 3: Non-Stationarity & Ruin (Months 16–24)**
  *   **Goal:** Solve Question (2). Finite Horizons.
  *   **Method:** Drop the ergodic assumption. Focus on **Drawdown Constraints**.
  *   **Key Metric:** Instead of $G = \lim_{T\to\infty} \frac{1}{T} E[\ln W_T]$, use $P(W_t < W_{ruin} \text{ for any } t < T)$.
  *   **Connection to Info Theory:** Connect this to "Universal Portfolios" (Cover) but penalized for path dependency.
  *   **Deliverable:** A "Robust Kelly" criterion that adjusts leverage based on estimated regime stability (volatility of volatility).

  ### 4. Tractability Assessment

  *   **Tractable for One Outsider:**
      *   **Modeling:** You can build the SDE models and run Monte Carlo simulations alone.
      *   **Conceptual Synthesis:** Bridging the gap between the "Geometric Rationality" axioms and the "Ergodic Economics" dynamics is a conceptual task well-suited to a physicist.
      *   **Critique:** Writing the "physics of finance" critique of current decision theory literature.

  *   **Needs a Group / Data:**
      *   **Empirical Validation:** Testing these strategies on real market data requires cleaning data and dealing with survivorship bias.
      *   **General Equilibrium:** If everyone uses Kelly, what happens to market prices? (This is macroeconomics; avoid it).
      *   **AI Alignment:** Applying this to agent utility functions requires ML infrastructure.

  ### 5. What is Overrated vs. Underrated

  *   **Overrated:**
      *   **"Ergodicity Economics" as a Grand Unified Theory:** It is a useful correction to expected utility theory, but it doesn't solve decision theory. It just changes the objective function.
      *   **Full Kelly:** In practice, full Kelly is too volatile for almost any human utility function due to parameter uncertainty. "Fractional Kelly" is the industry standard for a reason.
      *   **Logical Uncertainty (Geometric Rationality core):** While interesting, without a physical anchor (dynamics), it risks becoming scholasticism.

  *   **Underrated:**
      *   **Path Dependence:** The order of returns matters more than the distribution for finite horizons. (Volatility drag).
      *   **Human Capital Hedging:** The interaction between labor income risk and investment risk is the single biggest factor in personal finance, yet rarely treated with stochastic rigor in the Kelly literature.
      *   **Ruin as a Phase Transition:** Treating bankruptcy not as a continuous loss but as an absorbing state (phase transition) changes the optimal control policy entirely.

  ### 6. Why This Ranking? (And What Would Change It)

  I recommend this path because it leverages your **statistical mechanics intuition** (ensembles, phase transitions, boundaries) against a field (economics/decision theory) that often ignores them.

  **What would change my recommendation:**
  1.  **If you care more about AI Safety:** If your goal is to ensure AI agents don't kill us, shift focus to **Instrumental Convergence**. Kelly betting is a toy model for resource acquisition. The question becomes: "Does maximizing geometric growth lead to power-seeking behavior in multi-agent systems?" This is higher impact but more speculative.
  2.  **If you want Empirical Rigor:** If you dislike toy models, shift to **Market Microstructure**. Test Kelly criteria on high-frequency data where the "long run" is compressed into days.
  3.  **If you find Finance too "Dirty":** If you dislike the noise of economic data, pivot to **Biological Evolution**. Evolution maximizes geometric growth (fitness) over generations. The "wealth" is population size. The "ruin" is extinction. The math is identical, the data is cleaner (in simulation), and the philosophical stakes (what is 'rational' for a gene?) are just as high.

  ### Final Advice

  Don't read more philosophy. Read **Stochastic Control** (e.g., *Merton 1971*, *Karatzas & Shreve*) and **Risk of Ruin** literature (e.g., *Paul Embrechts* on ruin theory).

  Your confusion on (1) and (2) is the signal. The literature treats them as settled because they assume away the boundary conditions and the finite horizon. That is where the physics is. Go break the idealizations.
