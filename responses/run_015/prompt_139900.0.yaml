      Debates between agency and structure often stall because opponents describe causality at different resolutions. This project proposes a second-order investigation into that stalemate, using the specific case study: would there have been a Nazi Germany if Hitler had died before entering politics? My history teacher has noted that previous attempts at this topic often become philosophy dressed up as history. Rather than attempting to settle the empirical causal question—a task requiring evidence beyond school-level knowledge—I intend to analyse the logical structure of the arguments themselves. The core question is whether disagreement stems from differing definitions of outcome and counterfactual condition, rather than conflicting interpretations of fact. I aim to show that this is a conceptual inquiry grounded in historical examples, not pure speculation.

      To make this testable, I will define two key terms. First, the 'outcome ladder': a hierarchy of historical descriptions ordered from coarse (e.g., 'an authoritarian nationalist regime') to fine (e.g., 'the specific implementation of the Holocaust'). Second, the 'counterfactual type': distinguishing between a person-counterfactual (removing only the individual) and a capacity-counterfactual (removing the specific bundle of skills required to fill the leadership role). The project asks whether the structuralist position holds only at the coarse end of the ladder, and whether the individualist position relies on conflating the two counterfactual types. This distinction allows me to test the arguments without needing new archival data.

      Standard answers typically fail to settle this because they assume their definitions are shared. The structure-centred argument posits that Weimar's collapse, economic distress, and elite conservatism made a right-wing authoritarian state inevitable. Strongest when outcomes are described coarsely, it struggles to explain the specific timing or ideological intensity of the Third Reich without smuggling in individual agency. It assumes the regime's form was determined by pressures, not people. Conversely, the individual-centred argument claims Hitler's unique charisma and ruthlessness were indispensable. This holds well for fine-grained outcomes but often assumes that no other actor could have possessed the necessary capacities, an empirical claim rarely substantiated. It treats the vacancy as unique to the man. Both sides frequently help themselves to an ambiguous phrase: 'without Hitler'. They do not establish whether they mean without the man, or without the specific political function he performed. This ambiguity allows both sides to claim victory depending on how the question is framed.

      My method proceeds over six weeks. Weeks one and two construct the outcome ladder. I will use general knowledge of the period to define rungs, ensuring each step represents a distinct historical claim verifiable by school textbooks. I will order them from broad political shifts to specific policy decisions. Weeks three and four test the counterfactuals against this ladder. I will argue conceptually: if structures create vacancies, do they also generate candidates? If so, the person-counterfactual and capacity-counterfactual converge, reducing the debate to timing. If not, the capacity-counterfactual does the explanatory work. Weeks five and six will be devoted to writing the 5,000-word essay. The structure will mirror the investigation: defining the terms, analysing the standard positions, applying the ladder, and evaluating the result. Each section will build on the previous one to ensure coherence.

      This approach is chosen over obvious alternatives for specific reasons. Picking a side would require empirical evidence I cannot access without a university library. I cannot verify obscure biographical details or economic statistics over the summer. Widening to multiple case studies would dilute the conceptual rigour within the word limit. Trying to settle the causal question empirically would turn the project into speculation. My approach gives up the claim to historical truth in favour of logical clarity. I am not asking what happened, but what we are asking when we ask what happened. This respects the limitation of my resources while still producing a rigorous historical argument.

      A successful result would demonstrate that the original question is ill-posed and offer a refined version that separates structural necessity from individual contingency. It would show where each side of the debate is logically valid. Failure would look like arbitrariness: if the ordering of the outcome ladder cannot be justified objectively, I could simply pick the rung that suits my conclusion. Failure would also occur if the counterfactual types collapse, leaving no analytical distinction, or if the disagreement proves purely empirical, beyond conceptual analysis. I must ensure the ladder is not just a rhetorical device but a logical tool.

      Scope is restricted to the German case. Comparing Hitler to Stalin or Mussolini would be tempting but would consume too much time. The main risk is running out of time writing, as conceptual arguments can become repetitive. I will mitigate this by producing a detailed plan at the end of week four. The project remains feasible within the supervision limits because it relies on argumentation rather than archival research. I will use the fortnightly supervision to check the logical consistency of the ladder rather than historical facts.

