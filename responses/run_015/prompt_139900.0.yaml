      *   **Specific Angle:** Second-order question. Not answering the historical question empirically, but analyzing *what* the two sides are asking. Focus on levels of outcome description (coarse vs. fine) and types of counterfactuals (person vs. capacity).
      *   **Constraints:**
          *   British English.
          *   Register: Formal but plausible for a bookish 17-year-old.
          *   **NO citations/references/reading list.** Describe arguments by content, not author.
          *   **NO external research.** Stick to general European history taught in school. No stats, precise dates, quotes, or verifiable facts needing library access.
          *   **Word Count:** 850-900 words for the proposal itself.
          *   **Additional:** One paragraph outside the word count identifying the weakest point.
      *   **Content Requirements:**
          1.  Precise question statement with defined terms.
          2.  Critique of standard individual/structure answers (what they miss/assume).
          3.  Method (6-week plan, essay structure).
          4.  Justification of approach (vs. picking a side, multiple cases, empirical settlement).
          5.  Success/Failure conditions (including ill-posed question, arbitrary ladder, collapse of counterfactuals).
          6.  Scope/Time management.
          7.  (Outside word count) Weakest point analysis.

  2.  **Determine Tone and Voice:**
      *   Needs to sound intelligent and ambitious (bookish 17-year-old) but not overly academic or pretentious (no jargon overload that a student wouldn't know).
      *   Formal but direct.
      *   British spelling (organise, analyse, programme, etc.).
      *   Avoid claiming expertise; frame it as an investigation into the logic of the debate.

