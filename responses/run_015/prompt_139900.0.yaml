      *   *Introduction/Question:* Need to define the core inquiry. It's about the logic of counterfactuals.
      *   *Critique of Standard Views:* Structuralists say "regime inevitable" (coarse). Individualists say "Holocaust/Hitler unique" (fine). Need to highlight the ambiguity in "without Hitler" (person vs. capacity).
      *   *Method:* 6 weeks. Week 1-2: Define ladder. Week 3-4: Test counterfactuals. Week 5-6: Write. Essay structure needs outlining.
      *   *Justification:* Why this meta-approach? Avoids empirical deadlock.
      *   *Success/Failure:* Success = clarifying the debate. Failure = arbitrary ladder or empirical stalemate.
      *   *Scope:* Cut comparative cases. Risk = getting bogged down in historical detail.

