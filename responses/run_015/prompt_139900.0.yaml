      *Let's write.*

      (Drafting...)
      Title: Propositions of Necessity: A Conceptual Analysis of the Hitler Counterfactual

      The historical debate between agency and structure often stalls because opponents describe causality at different levels of resolution. This project proposes a second-order investigation into that stalemate, using the specific case study: would there have been a Nazi Germany if Hitler had died before entering politics? Rather than attempting to settle the empirical causal question—a task requiring evidence beyond school-level knowledge—I intend to analyse the logical structure of the arguments themselves. The core question is: to what extent does the disagreement stem from differing definitions of the outcome and the counterfactual condition, rather than from conflicting interpretations of historical fact?

      To make this testable, I will define two key terms. First, the 'outcome ladder': a hierarchy of historical descriptions ordered from coarse (e.g., 'an authoritarian nationalist regime') to fine (e.g., 'the specific implementation of the Holocaust'). Second, the 'counterfactual type': distinguishing between a person-counterfactual (removing only the individual) and a capacity-counterfactual (removing the specific bundle of skills required to fill the leadership role). The project asks whether the structuralist position holds only at the coarse end of the ladder, and whether the individualist position relies on conflating the two counterfactual types.

      Standard answers typically fail to settle this because they assume their definitions are shared. The structure-centred argument posits that Weimar's collapse, economic distress, and elite conservatism made a right-wing authoritarian state inevitable. This position is strongest when the outcome is described coarsely; it struggles to explain the specific timing or ideological intensity of the Third Reich without smuggling in individual agency. Conversely, the individual-centred argument claims Hitler's unique charisma and ruthlessness were indispensable. This holds well for fine-grained outcomes but often assumes that no other actor could have possessed the necessary capacities, an empirical claim rarely substantiated. Both sides frequently help themselves to an ambiguous phrase: 'without Hitler'. They do not establish whether they mean without the man, or without the specific political function he performed.

      My method proceeds over six weeks. Weeks one and two will be dedicated to constructing the outcome ladder. I will use general knowledge of the period to define rungs, ensuring each step represents a distinct historical claim verifiable by school textbooks. Weeks three and four will test the counterfactuals against this ladder. I will argue conceptually: if structures create vacancies, do they also generate candidates? If so, the person-counterfactual and capacity-counterfactual converge, reducing the debate to timing. If not, the capacity-counterfactual does the explanatory work. Weeks five and six will be devoted to writing the 5,000-word essay. The structure will mirror the investigation: defining the terms, analysing the standard positions, applying the ladder, and evaluating the result.

      This approach is chosen over the obvious alternatives for specific reasons. Picking a side would require empirical evidence I cannot access without a university library. Widening to multiple case studies would dilute the conceptual rigour within the word limit. Trying to settle the causal question empirically would turn the project into speculation. My approach gives up the claim to historical truth in favour of logical clarity. I am not asking what happened, but what we are asking when we ask what happened.

      A successful result would demonstrate that the original question is ill-posed and offer a refined version that separates structural necessity from individual contingency. It would show where each side of the debate is logically valid. Failure would look like arbitrariness: if the ordering of the outcome ladder cannot be justified objectively, I could simply pick the rung that suits my conclusion. Failure would also occur if the two counterfactual types collapse into each other, leaving no analytical distinction, or if the remaining disagreement proves purely empirical, beyond the scope of conceptual analysis.

      Regarding scope, I must restrict myself strictly to the German case. Comparing Hitler to Stalin or Mussolini would be tempting but would consume too much time. The most likely risk is running out of time during the writing phase, as conceptual arguments can become repetitive. I will mitigate this by producing a detailed plan at the end of week four. The project remains feasible within the supervision limits because it relies on argumentation rather than archival research.

