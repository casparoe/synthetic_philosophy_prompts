          Your premises are remarkably coherent, but there are fault lines.
          First, (2) does not contradict (1). Functionalism need not imply classical Turing-style computation. Connectionist or dynamic systems models accommodate stochastic, continuous signalling whilst preserving functional organisation. You need not surrender (2); simply broaden your definition of computation beyond the 'laptop' paradigm. This costs nothing.
          Second, your reader is correct about (4), though perhaps for the wrong reason. The triviality worry suggests computation is observer-relative. If true, (1) collapses: the model is not intrinsically a mind, but only a mind relative to an interpreter. This undermines (5) catastrophically. If the mind is description-relative, the legal claim that the model *is* her becomes merely a useful fiction, not an ontological fact. To save (1) and (5), you must reject (4) for the purposes of the novel. You must assume computational realism: that certain causal structures objectively constitute computation. Surrendering (4) costs you philosophical nuance but saves the plot's ontological stakes.
