      *   *Paradox:* The care isn't for rehabilitation; it's for *liability management*. It sustains the security logic. Without the doctors, the isolation shuts down due to lawsuits.
      *   *Interdependence:* Security *consumes* care resources to justify its existence.

  5.  **Synthesize: The Interdependence of Logics:**
      *   Both systems use care and security, but the *goal* of the care differs.
      *   Halden: Care $\rightarrow$ Internalized Control (Soft Power).
      *   ADX: Care $\rightarrow> Externalized Legitimacy (Hard Power maintenance).
      *   *Conclusion:* The logics aren't opposites; they are tools used in different configurations to achieve order.

  6.  **Address the Scaling/Economic Question:**
