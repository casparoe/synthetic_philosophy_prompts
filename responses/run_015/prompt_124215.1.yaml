answer: |-
  Bottom line: Your package collapses if normative verdicts vary across admissible scoring rules or possibility partitions. If the "theorems" of epistemology depend on how you carve possibility space or which proper score you select, the framework loses its normative force and becomes a rationalization tool.

  **1. Where Robustness Breaks**
  The most severe structural threat is partition dependence. If minimizing expected inaccuracy yields different update rules depending on whether you model a problem coarsely (e.g., "Rain/No Rain") or finely (e.g., "Rain at 1pm, 2pm..."), robustness fails. This is not a peripheral curiosity; it strikes at the framework's application to real inquiry, where granularity is often discretionary. Additionally, self-locating beliefs challenge the definition of truth closeness. If accuracy cannot be defined for centered content without ad hoc adjustments, the core value is incomplete. Infinite spaces also threaten additivity, often requiring constraints that reintroduce normative assumptions outside the accuracy metric.

  **2. Measurement-Sensitive Derivations**
  Conditionalization is relatively robust in finite cases, but conciliationism is highly sensitive. The verdict on whether to stick or split with a peer often depends on how you score the hypothesis about the peer's reliability versus the target proposition. Different proper scores can favor different weighting schemes. This suggests the norm isn't a theorem of accuracy, but a consequence of smuggled assumptions within the score choice. Similarly, the Principal Principle can vary if chance hypotheses are scored differently than empirical outcomes. If the derivation requires a specific score to work, it is not a general epistemic norm.

  **3. Risks vs. Rivals**
  The view risks descriptive inadequacy. If accuracy cannot distinguish between a unified theory and a disjointed list of truths that are equally accurate, it fails to capture why we value explanation. You may argue understanding is instrumental to accuracy, but if accurate credences don't track explanatory power, the view is costly. However, this is philosophically awkward rather than logically fatal, provided accuracy remains the sole *fundamental* value.

  **4. Concessions and Untestability**
  A committed accuracy-firster must concede that if every anomaly is met by narrowing the class of admissible scores, the view becomes unfalsifiable. Robustness requires the class of proper scores to be fixed antecedently. If you exclude scores solely because they violate conditionalization, you are tuning the metric to deliver the norm, reversing the explanatory direction.

  **Ranking of Defeaters**

  1.  **Fatal:** **Partition Dependence.** If verdicts change based on how possibilities are carved, the framework is arbitrary. This directly undermines the claim that norms are objective theorems.
  2.  **Fatal:** **Score-Dependent Norms.** If conciliationism or the Principal Principle only hold for specific proper scores, the norms are not derived from accuracy generally, but from specific metric choices.
  3.  **Severe:** **Unfalsifiability via Tuning.** If the admissible class of scores is restricted post-hoc to save specific norms, the program predicts nothing.
  4.  **Awkward:** **Exclusion of Understanding.** Denying intrinsic value to explanation is a high philosophical cost, but consistent if accuracy can instrumentally explain theory choice.

  The view survives only if accuracy minimization is invariant across partitions and the entire class of strictly proper scores.
