      *   *Caution:* A 0.5 threshold for *prior* probability of success is actually quite low for a Phase II/III trial. Usually, you need strong preliminary data. I should note that the threshold itself might be the bigger problem.
      *   *Collapsing:* If I take the midpoint of [0.4, 0.7], I get 0.55. If I take a point estimate of 0.6. Average = 0.575. Decision: Go. But the range includes values < 0.5. The "risk" of failure is hidden.
      *   *Key Distinction:* Distinguish between *aleatory* uncertainty (randomness of the trial outcome) and *epistemic* uncertainty (uncertainty about the probability itself). The experts are expressing epistemic uncertainty. Collapsing ignores this.

  11. **Final Polish:** Structure with clear headings. Use bold text for emphasis. Ensure the distinction between "Risk" and "Ambiguity" is clear. (Proceed to generate output).

