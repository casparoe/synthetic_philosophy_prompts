      *   *The White Space:* This supports the idea that reality is malleable based on conception. It's a blank slate of perception.
      *   *The "Real World" Problem (The User's Instinct):* The user is right to be skeptical. Morpheus says "Welcome to the desert of the real." He implies *physical* dirt, *physical* ships. Berkeley says physical dirt is impossible. It's only ideas of dirt. The movie treats the Real World as Materialist, not Idealist.
      *   *Machines as God:* This is the tricky part. In Berkeley, God is benevolent and the source of truth. The Machines are parasitic. However, functionally, they keep the world running when humans don't perceive it. It's a "Dark God" analogy.
      *   *Red/Blue Pill:* In Berkeley, taking the Red Pill would just mean waking up to God's perception. In the movie, it means waking up to *matter*. This is the break.

  5.  **Refining the Tone:**
      *   Keep it conversational but precise.
      *   Avoid "Epistemological Ontological Phenomenalism" soup. Use "mind-dependent" vs. "mind-independent."
      *   Address the friend (Sam) and the teacher's constraints.

  6.  **Addressing Specific Prompts:**
