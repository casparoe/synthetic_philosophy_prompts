      *   **Conflict:** User's friend Sam says the movie supports Berkeley (simulation = minds, spoon = no spoon, machines/God = perceiver). User is skeptical because Morpheus talks about a "real world" (pods, Zion) which sounds like mind-independent matter (which Berkeley denies).
      *   **Specific Requirements:**
          *   Avoid the Plato's Cave analogy (teacher hates it).
