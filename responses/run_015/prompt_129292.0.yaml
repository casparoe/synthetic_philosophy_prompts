  Here are 9 question pairs tailored for your podcast. They are designed to be conversational but rigorous, avoiding requests for literature while pressing on the specific vulnerabilities you identified. Each main question includes a note on her likely pragmatic reply and a follow-up tuned to challenge that specific move.

  ### 1. The "Anything Goes" Collapse (Required)
  **Main Question:** If the right reference class is determined by our explanatory target, what stops me from picking a target that just gives me the answer I want? For example, could I define a class that makes a risky behavior look safe just by shifting my explanatory goal?
  **Anticipated Reply:** She will likely say pragmatic constraints or scientific norms prevent arbitrary choices.
  **Follow-Up:** But aren't those norms themselves context-dependent? If the constraints are just "what works for us," haven't we just pushed the arbitrariness back one step rather than solving it?

  ### 2. Single-Case Probabilities (Required)
  **Main Question:** Patients don't ask about classes; they ask, "Will *I* get cancer?" If the probability shifts depending on whether we look at genetics or social access, what number do you actually give the patient?
  **Anticipated Reply:** She will likely say the probability guides decision-making relative to a specific goal (e.g., treatment vs. prevention).
  **Follow-Up:** But what if those goals conflict? If the genetic class says "take the drug" and the social class says "change your environment," how does the patient decide without a unified probability?

  ### 3. The Meta-Problem of Targets (Required)
  **Main Question:** To choose the explanatory target—like mechanism versus access—don't I already need to know which factors are relevant? Isn't selecting the target just the reference class problem in disguise?
  **Anticipated Reply:** She will likely say we pick targets based on our interests or practical needs.
  **Follow-Up:** Aren't those interests themselves shaped by prior assumptions about what factors matter? It feels like we need the class to pick the target, but we need the target to pick the class.

  ### 4. Causal Similarity Contrast
  **Main Question:** Traditional views say we group by causal similarity. Why is causality insufficient? Isn't the whole point of science to find the causal structure regardless of our interests?
  **Anticipated Reply:** She will likely argue that causal relevance is itself determined by the context of inquiry.
  **Follow-Up:** If causal relevance is also context-dependent, is "context" doing all the heavy lifting here? Does causality drop out of the picture entirely?

  ### 5. Expert Disagreement
  **Main Question:** If two experts pick different explanatory targets for the same data, is one of them wrong, or are they just doing different projects?
  **Anticipated Reply:** She will likely say neither is wrong; they are addressing different questions.
  **Follow-Up:** If neither is wrong, have we lost the ability to say one model is *better* than another? Does truth become secondary to utility?

  ### 6. Objectivity vs. Agreement
  **Main Question:** Does your view save scientific objectivity, or does it redefine it as just intersubjective agreement among researchers?
  **Anticipated Reply:** She will likely say objectivity is about robustness across contexts, not a "view from nowhere."
  **Follow-Up:** But if the contexts shift, how do we handle cases where the consensus is pragmatically useful but factually misleading? Can a useful class be false?

  ### 7. Prediction vs. Explanation
  **Main Question:** Does this view work for pure prediction where the only target is "accuracy"? If I just want to know what happens next, does the class still shift?
  **Anticipated Reply:** She will likely say even accuracy is a pragmatic goal that selects for certain classes over others.
  **Follow-Up:** If accuracy picks the class, isn't that just instrumentalism? Where does the philosophical distinction between "true class" and "useful class" go?

  ### 8. Policy and Action
  **Main Question:** How should policymakers use risk statistics if the class shifts based on the question? Should they fund genetic research or social interventions based on these probabilities?
  **Anticipated Reply:** She will likely say they should match the class to the policy goal.
  **Follow-Up:** But budgets are fixed. Who decides which goal takes priority when you can't pursue both? Doesn't someone need a "universal" risk assessment to allocate resources?

  ### 9. Stability Over Time
  **Main Question:** Do reference classes stabilize over time as science progresses, or do they keep shifting as our interests change?
  **Anticipated Reply:** She will likely say they stabilize within specific practices but shift across history.
  **Follow-Up:** If they shift across history, how do we compare risk across generations? Can we say cancer is "more common" now if the class we use to measure it has changed?
