  Hey, I got you. Philosophy loves labels, but you want the machinery underneath. Here's a decision tree built out of concrete moments—cake, cigarettes, boardroom meetings—to sort out what you actually believe is happening when willpower snaps.

  There are 10 questions (nodes). Follow your gut answer down the line. At the bottom, I've listed the "Leaves" (the positions you end up at) with their awkward commitments. I also flagged where two leaves are basically the same thing in practice, and noted any empty spots where the logic breaks.

  ***

  ### The "Why Did I Do That?" Sorting Tree

  **Node 1: Who is messing up?**
  Is this just you alone with a bad habit, or is this a group (like a company promising to cut emissions but delaying)?
  *   **Just Me:** Go to Node 2.
  *   **A Group:** Go to Node 7.

  **Node 2: The Moment of Truth**
  When you ate the cake (or lit the smoke), did the taste actually seem more important than your goal *in that second*, or did the goal still seem more important but your hand moved anyway?
  *   **Taste Won:** Go to Node 3.
  *   **Goal Won, Hand Moved:** Go to Node 4.

  **Node 3: The Value Shift**
  If the taste won, was your brain just bad at calculating how much health matters tomorrow (a math error), or did you honestly value "now" more than "later" (a real choice)?
  *   **Math Error:** **Leaf A (The Glitched Calculator)**
  *   **Real Choice:** **Leaf B (The Honest Hedonist)**

  **Node 4: The Control Loss**
  If the goal still seemed more important but you did it anyway, is there only one "you" who temporarily broke, or is there a "planner you" and an "impulsive you" fighting?
  *   **One You:** Go to Node 6.
  *   **Two You's:** Go to Node 5.

  **Node 5: The Civil War**
  If there are two you's fighting, are both the planner and the impulsive kid equally "real" parts of you, or is only the planner the real you (and the impulse is like a virus)?
  *   **Both Real:** **Leaf C (The Divided Kingdom)**
  *   **Only Planner Real:** **Leaf D (The Possessed Victim)**

  **Node 6: The Single Glitch**
  If there's only one you, did something outside you make you do it (like a chemical addiction), or did you just randomly malfunction for no reason?
  *   **External Force:** **Leaf E (The Hijacked Pilot)**
  *   **Random Malfunction:** **Leaf F (The Fragile Monarch)**

  **Node 7: Group Mindset**
  When the company delays cutting pollution, do they act like a single brain that changed its mind, or a bunch of individuals passing the buck?
  *   **Single Brain:** Go to Node 8.
  *   **Individuals:** Go to Node 9.

  **Node 8: The Corporate Mind**
  If it's a single brain, do they think the Future Company will handle it easier, or do they just not care about the future at all?
  *   **Future Will Handle It:** **Leaf G (The Corporate Procrastinator)**
  *   **Don't Care:** **Leaf H (The Short-Term Corp)**

  **Node 9: The Buck Passing**
  If it's individuals passing the buck, is it because they think *other coworkers* will fix it, or because they think *their future self* at the job will fix it?
  *   **Other Coworkers:** **Leaf I (The Free Rider)**
  *   **Future Self/Group:** Go to Node 10.

  **Node 10: The Future Bet**
  If they're waiting for the future version of the group to deal with it, do they honestly believe tech will save them, or do they know they're lying to buy time?
  *   **Honestly Believe:** **Leaf J (The Tech Optimist)**
  *   **Knowingly Lying:** **Leaf K (The Cynical Kicker)**

  ***

  ### The Leaves (Where you landed)

  *   **Leaf A (The Glitched Calculator):** Your brain is just bad at time-math; you could be fixed with a better app.
  *   **Leaf B (The Honest Hedonist):** You never actually fail; you just change your mind about what you want.
  *   **Leaf C (The Divided Kingdom):** You have to negotiate treaties with your own hunger like it's a separate person.
  *   **Leaf D (The Possessed Victim):** Your hunger is an alien parasite, so you're never responsible for the cake.
  *   **Leaf E (The Hijacked Pilot):** You are a passenger in your body when chemicals take the wheel.
  *   **Leaf F (The Fragile Monarch):** You are one single king who sometimes randomly trips over his own robe for no reason.
  *   **Leaf G (The Corporate Procrastinator):** The organization believes in magic future resources that don't exist yet.
  *   **Leaf H (The Short-Term Corp):** The company is a psychopath that literally cannot perceive next year.
  *   **Leaf I (The Free Rider):** Everyone waits for a hero who isn't coming, so nothing gets done.
  *   **Leaf J (The Tech Optimist):** You believe future problems are cheaper to solve than current ones (often false).
  *   **Leaf K (The Cynical Kicker):** You know the future team will hate you, but you need their help to keep your job today.

  ***

  ### Notes on the Map

  **Same Thing in Practice:**
  *   **Leaf A (Glitched Calculator)** and **Leaf J (Tech Optimist)** are basically twins. Both say, "We aren't ignoring the problem, we're just betting the math works out later." One is about brain chemistry, the other is about corporate strategy, but the excuse is identical.
  *   **Leaf E (Hijacked Pilot)** and **Leaf D (Possessed Victim)** feel the same when you're in court. Both say, "That wasn't the *real* me doing that."

  **The Empty Chairs (Incoherent Combos):**
