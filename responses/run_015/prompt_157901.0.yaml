answer: |-
  ### 1. The Principle: Invariant Intervention Class

  To resolve the tensions in your register, replace the "Intervention-Profile Rule" with the **Invariant Intervention Class Principle**.

  **Definition:** Two incidents instantiate the *same mechanism* if and only if:
  1.  **Causal Isomorphism:** The failure path (Initiator $\to$ Site $\to$ Outcome) is isomorphic under abstraction of physical constants, specific data values, and hardware IDs.
  2.  **Intervention Invariance:** The *class* of minimal sufficient intervention required to sever the causal path is identical.

  **What fixes the grain?**
  The grain is not chosen by the analyst; it is fixed by the **Intervention Boundary**. You describe the mechanism at the coarsest level of abstraction where the *Intervention Class* remains stable.
  *   If two root causes require different *classes* of intervention (e.g., "Update Map" vs. "Retrain Detector"), they are different mechanisms, regardless of signature similarity (resolves **Case 3**).
  *   If two root causes are severed by the same *class* of intervention (e.g., "Validity Check"), they are the same mechanism at that grain, regardless of fine-grain physical differences (resolves **Case 8**).

  **Application to your historical verdicts:**
  *   **Cases 1 & 2 (Trigger/Outcome Swap):** **Accommodated.** Causal topology is isomorphic; Intervention Class (e.g., "Detector Gating") is invariant. Trigger and outcome severity are irrelevant.
  *   **Case 3 (Identical Sig, Diff Cause):** **Accommodated.** "Retrain Detector" $\neq$ "Update Map." Different Intervention Classes $\to$ Different Mechanisms.
  *   **Case 4 (Compensated Latency):** **Accommodated.** The causal path existed but was masked. Intervention Class remains the same.
  *   **Case 5 (Substrate Swap):** **Conflict.** (See Section 3).
  *   **Case 6 (Same Path, Fix Changed):** **Accommodated.** If the original patch became obsolete due to timing shifts, but the *class* of intervention (e.g., "Timing Window Adjustment") remains the same, it is a recurrence. The specific code line is not the class.
  *   **Case 7 (Diff Paths, One Fix):** **Accommodated.** If the paths are not isomorphic (dropped message $\neq$ buffer race), they are different mechanisms, even if a watchdog masks both. The watchdog is a compensator, not a severance of the specific causal path.
  *   **Case 10 (Artefact):** **Accommodated.** No causal path in the vehicle physics/logic. Not a mechanism.
  *   **Case 11 (Isomorphism):** **Partial.** Causal topology is isomorphic, but if the codebases are disjoint, the *Intervention Instance* (which team patches what) differs. (See Section 5).

  ### 2. Verdicts on Pending Cases

  **(a) The Human Hover (Socio-Technical)**
  *   **Verdict:** **New Mechanism.**
  *   **Reasoning:** The causal site has shifted from the *Detector* to the *Human Operator*. The Intervention Class is no longer "Algorithm Patch" but "Procedure/Training Change." While the *risk* is a recurrence of M1, the *mechanism* is now a human-in-the-loop failure. File as new, but tag as "M1-Derived" for statistical tracking.

  **(b) The Conjunction (M1 + Network Delay)**
  *   **Verdict:** **New Mechanism (Interaction Failure).**
  *   **Reasoning:** M1 alone did not cause the incident; the conjunction did. The Intervention Class is now "Decouple M1 from Network State" or "Harden M1 against Delay," which is distinct from the original M1 fix. Frequency of the delay does not change the mechanism identity, only its priority.

  **(c) Simulation Re-enactment**
  *   **Verdict:** **Not a Recurrence.**
  *   **Reasoning:** A mechanism requires instantiation in the operational physical/logical domain. Simulation is a verification artefact. Record it as a "Test Case," not an incident. It validates the mechanism model but does not instantiate the failure.

  **(d) Redundancy Absorption**
  *   **Verdict:** **Recurrence.**
  *   **Reasoning:** Mechanism identity is independent of consequence severity (per your Case 2). The causal path fired; the *outcome* was mitigated. The Intervention Class required to stop the path remains the same. This is a "Contained Recurrence."

  ### 3. Honest Statement: Conflicts and Overturns

