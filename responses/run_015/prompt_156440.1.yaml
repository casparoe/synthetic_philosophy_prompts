answer: |-
  (1) Reconstruction of the Passage
  In "On Denoting," Russell rejects the view that definite descriptions function as referring expressions akin to proper names. Instead, he analyzes them as incomplete symbols possessing no meaning in isolation, only within propositions. For Russell, "The F is G" is not a subject-predicate claim about an object, but a complex existential generalization: there exists an x such that x is F, nothing else is F, and x is G. When applied to negative existentials like "The present King of France is not bald," Russell identifies a scope ambiguity. The negation can deny the entire existential claim (wide scope) or merely deny the predicate of the described subject (narrow scope). This distinction allows Russell to maintain bivalence without committing to non-existent entities, as the truth conditions depend on whether the existence clause is negated or preserved within the proposition's logical structure.

  (2) Scope Analysis
  The ambiguity arises from the scope of the definite description relative to the negation operator. In the **primary occurrence** of the description, the description takes wide scope over the negation. The logical form is: $\exists x (Kx \land \forall y (Ky \rightarrow y=x) \land \neg Bx)$. This asserts there exists a unique King of France who possesses the property of non-baldness. Because the existence and uniqueness clauses are affirmed within the scope of the quantifier, this proposition is false if no King exists. The subject is presumed to exist for the predicate denial to hold. Conversely, in the **secondary occurrence**, the negation takes wide scope over the description. The form is: $\neg \exists x (Kx \land \forall y (Ky \rightarrow y=x) \land Bx)$. This denies the complex proposition that there exists a unique King of France who is bald. Here, the existence claim is part of what is negated. Consequently, if there is no King, the primary occurrence yields falsehood, while the secondary occurrence yields truth. Russell argues that ordinary language often obscures this distinction, leading to the mistaken belief that denying a predicate of a non-existent subject requires that subject to subsist. By formalizing the scope, Russell shows that we can truthfully deny existence claims without ontological commitment, provided we interpret the negation as operating on the entire existential generalization rather than merely on the predicate. This syntactic differentiation ensures that the law of excluded middle holds without necessitating a realm of non-being.

  (3) Metaphysical Assessment
  Russell's solution is genuinely dissolutive rather than merely relocative. The metaphysical puzzle arises from the presupposition that grammatical subject position entails ontological commitment. By treating descriptions as quantifiers, Russell denies that the sentence possesses a constituent corresponding to the King of France. Therefore, there is no "non-existent object" to bear properties or lack them. The problem is not solved by finding a place for non-existents in the ontology, but by demonstrating that the logical form of the sentence does not require such entities for meaningfulness. While the syntax avoids Meinongian jungles, it arguably shifts the burden to explaining how speakers coordinate on specific scope readings without explicit logical notation. Nevertheless, regarding the specific metaphysical difficulty of "speaking about what does not exist," Russell succeeds by showing we are not speaking about objects at all, but rather asserting conditions on the world that fail to obtain.

  (4) Note on Institutional Extension
  Russell's framework extends readily to institutional contexts because his analysis is domain-neutral regarding "existence." Whether an entity is physically absent or legally dissolved, the logical failure remains the same: the uniqueness clause $\forall y (Fy \rightarrow y=x)$ fails to be satisfied within the relevant domain of discourse. For a sovereign authority dissolved by regime Y, the description "the sovereign of X" fails to denote not because the concept is incoherent, but because no entity satisfies the descriptive conditions in the current legal ontology. Russell's scope distinction allows one to truthfully say, "It is not the case that the sovereign exists," without implying the sovereign subsists in a legal limbo. However, care must be taken to define the domain of quantification. If the domain includes historical or legal abstractions, reference might succeed where it fails in a physicalist domain. Provided the domain is fixed, Russell's apparatus handles normative reference failure without distortion, treating legal non-existence identically to physical non-existence.
