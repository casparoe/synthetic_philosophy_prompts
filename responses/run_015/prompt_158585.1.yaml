prompt: |-
  I serve as a volunteer trustee of a small grant-making charity — in my working life I ran a printing business, and I have no training in economics, philosophy or anything resembling either — but over the past year I have been reading, entirely on my own, about the ways in which perfectly sensible people end up copying one another's choices. I have become convinced that our grants committee has just done exactly that, and I now have to put something in writing before Thursday.

  The particulars are these. We are a committee of seven. Our chair opens each discussion by giving her own view of the application, the rest of us then speak in turn, and the vote is a show of hands taken in that same order. At our last meeting we considered a two-year request for £42,000 — roughly a fifth of everything we will give away this year — from a community kitchen project. Our chair was warm about it from the outset, and the two members with the most relevant experience, a retired accountant and a former council officer, spoke in favour early on. By the fourth speaker the tone had become uniform, and the last two trustees contributed nothing beyond agreeing with everything already said.

  I had read the application pack properly. The budget assumes around thirty volunteers a week drawn from a pool that, as far as I can tell, another local organisation already depends on; the applicant's accounts show restricted reserves that cannot legally be spent on running costs; and their own monitoring data is thin. I said some of this, mildly, and it went nowhere. Afterwards one trustee emailed me privately to say he is uneasy too but did not want to be the person holding things up. I will not name him to the others, and I would ask you not to build anything into the memo that would expose him.

  The chair wants to approve on Thursday, because the applicant has a matched-funding deadline at the end of the month that our grant would unlock.

  My own thoughts, such as they are, run like this. It seems to me that there are two quite different ways of going along with the room: deferring because you take the earlier speakers to have checked something you have not checked, which looks like a sensible use of other people's information; and deferring because of what it costs you to be the one who objects, which produces no information at all. From the outside the two look identical, which is why I cannot tell — and I suspect we cannot tell — how much of our support is real. I also worry that the obvious fix, a secret ballot, cures only the second kind and makes silence ambiguous in a new way. I have been toying with two alternatives: having the chair speak last, and requiring each trustee to send round, before the meeting, one line for and one line against each application.

  Please draft the short memo I can circulate to the other trustees on Wednesday. It should recommend a specific course of action — approve, decline, defer, or approve on stated conditions — with a time frame that respects the matched-funding deadline, and it should say how I should handle my own dissent if the committee does not move. It must also deal honestly with the strongest thing that can be said on the other side, which as I see it is this: that the agreement of seven experienced people, one of whom reads accounts for a living, is itself evidence, that a committee which discounts its own consensus will end up paralysed, and that delaying costs the applicant money and goodwill we cannot refund.

  Two further requests. Nothing in the memo should cite authors, papers or studies: I have no way of checking them, and I would only be repeating your word for it to people who know no more than I do. And please write it in plain British English, in language that a retired accountant and a former council officer will actually read to the end; if a technical term earns its place, explain it in a sentence.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **User Role:** Volunteer trustee of a small grant-making charity. Background in printing, no formal training in economics/philosophy. Self-taught on social influence/herding behavior.
      *   **Situation:** Grants committee (7 people). Chair speaks first, then others in turn, vote by show of hands in same order.
      *   **The Issue:** Last meeting considered a £42k grant (20% of annual budget) for a community kitchen. Chair was warm, experts (accountant, council officer) spoke early in favor. Consensus formed quickly. Last two trustees just agreed. User raised concerns (volunteer pool overlap, restricted reserves, thin monitoring data) but was ignored. One trustee privately admitted unease but didn't want to hold things up.
      *   **Deadline:** Memo needed by Wednesday for a decision on Thursday. Applicant has a matched-funding deadline at the end of the month.
      *   **User's Analysis:** Distinguishes between "informational cascades" (deferring because others know more) vs. "reputational cascades" (deferring to avoid cost of objection). Notes they look identical from outside.
      *   **Proposed Solutions by User:** Chair speaks last? Pre-meeting written pros/cons?
      *   **Task:** Draft a short memo to circulate to trustees.
      *   **Requirements:**
          *   Recommend a specific course of action (Approve, Decline, Defer, Approve on Conditions) with a timeframe respecting the deadline.
          *   Address how to handle dissent if the committee doesn't move.
          *   Address the strongest counter-argument (consensus of 7 experienced people is evidence; paralysis risk; cost of delay to applicant).
          *   **Constraint 1:** No citations of authors, papers, or studies.
          *   **Constraint 2:** Plain British English. Accessible to a retired accountant and former council officer. Explain technical terms if used.
          *   **Constraint 3:** Protect the anonymous trustee who emailed privately.
          *   **Constraint 4:** Tone should be respectful, constructive, not accusatory, but firm on governance.

  2.  **Determine the Recommendation:**

      *   *Option A: Approve.* Risks wasting 20% of the budget on a shaky project. Ignores the user's due diligence concerns.
      *   *Option B: Decline.* Too harsh given the deadline and the fact that concerns might be resolvable. Damages relationship.
      *   *Option C: Defer.* Misses the matched-funding deadline.
      *   *Option D: Approve on Conditions / Staged Payment.* This seems best. It respects the deadline (unlocking the match) but mitigates risk.
      *   *Decision:* Recommend **approval in principle, subject to specific conditions and a staged payment schedule**. This allows the match funding to be secured (meeting the deadline) but protects the charity if the risks materialize.
      *   *Process Change:* Also recommend changing the voting procedure for future meetings (Chair speaks last, or written initial views) to prevent the herding issue.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the urgency (Thursday meeting, end-of-month deadline).
      *   **The Decision (The "What"):** Propose approving the grant *in principle* but with conditions.
          *   *Why:* Unlocks the match funding (addresses the counter-argument about cost/delay).
          *   *Conditions:* Verification of volunteer pool, clarity on restricted reserves, improved monitoring.
          *   *Payment:* Staged (e.g., 50% now, 50% on milestones). This protects the charity.
      *   **The Process (The "How"):** Address the "herding" issue without using academic jargon.
          *   Acknowledge the strength of the group (7 experienced people).
          *   Gently point out the procedural risk (Chair speaking first influences the rest).
          *   Propose the fix: Chair speaks last, or pre-meeting notes.
      *   **Handling Dissent:** How should the user act if the committee says "No, just approve it"?
          *   The user needs to state they will record their dissent in the minutes. This is standard trustee governance. It protects them personally and creates a record.
      *   **The Counter-Argument:** Address the "Consensus is Evidence" point.
          *   Acknowledge that 7 people agreeing *is* valuable.
          *   Counter with: Consensus is only valuable if it's independent. If we all just follow the first speaker, we aren't getting 7 views, we're getting 1 view repeated 7 times.
          *   Address the "Paralysis" point: We aren't saying no, we are saying "yes, but carefully."
      *   **Tone Check:** British English (e.g., "programme," "authorise," "favour"). Plain language. No "informational cascades" or "Asch conformity."
      *   **Protecting the Anonymous Trustee:** Do not mention "one of you emailed me." Phrase it as "I suspect I am not the only one..." or "It is natural to feel..."

  4.  **Refining the Content (Self-Correction during drafting):**

      *   *Critique:* Is "Approve on Conditions" too complex for a Thursday meeting?
      *   *Fix:* Keep the conditions simple. 1. Verify volunteer availability. 2. Confirm reserves status. 3. Split payment.
      *   *Critique:* Is the process change too much for one memo?
      *   *Fix:* Frame it as a recommendation for *future* meetings, but note that the current voting method may have skewed this specific decision. Actually, better to suggest a brief pause or a "second look" mechanism for *this* grant given the size (20% of budget). Let's stick to the staged payment as the safeguard for *this* grant, and process change for *future* grants.
      *   *Critique:* The user asked to recommend a course of action for *this* grant primarily.
      *   *Fix:* Focus heavily on the £42k decision. The process change is secondary but necessary context for why the user is worried.
      *   *Constraint Check:* Did I explain technical terms? "Restricted reserves" is already in the prompt, but I should ensure "staged payment" is clear.
      *   *Constraint Check:* No citations.
      *   *Constraint Check:* Plain English. Avoid "epistemic," "heuristic," "cascade." Use "copying," "influence," "groupthink" (maybe explain groupthink if used, better to describe it).

  5.  **Final Polish:**

      *   Ensure the "Strongest Counter-Argument" is treated with respect. The accountant and council officer need to feel their expertise is valued, not attacked.
      *   Make sure the deadline is respected.
      *   Ensure the anonymous trustee is safe.
      *   Check the "Dissent" instruction. The user needs to know what to write in the memo about *their own* dissent. The memo itself *is* the expression of dissent/alternative view. But the prompt asks the memo to say "how I should handle my own dissent if the committee does not move." This means the memo should state: "If we proceed without these checks, I will need to record my objection in the minutes."

  6.  **Drafting the Memo (Mental or Scratchpad):**
      *   *Subject:* Community Kitchen Grant & Committee Process.
      *   *Opening:* Writing ahead of Thursday.
      *   *The Grant:* £42k is big. Risks identified (volunteers, reserves). Proposal: Approve to meet deadline, but split payment.
      *   *The Process:* We all agreed too quickly. Chair spoke first. We need to change how we vote so we get 7 independent views.
      *   *The Counter:* You might say "7 experts is enough." Reply: "Only if we think independently."
      *   *My Position:* If we don't do this, I must dissent in the minutes.

  7.  **Final Review against constraints:**
      *   British English? Yes.
      *   No citations? Yes.
      *   Plain language? Yes.
      *   Protects anonymous trustee? Yes (phrased generally).
      *   Addresses deadline? Yes.
      *   Addresses dissent? Yes.

      *(Self-Correction on "Dissent"):* The prompt asks the memo to say "how I should handle my own dissent if the committee does not move." This implies the memo should outline the *consequence* of the committee ignoring the advice. "If the committee chooses to approve without these conditions, I will formally record my dissent in the minutes."

      *(Refining the "Process" part):* The user mentioned two alternatives (Chair speaks last, pre-meeting notes). I should recommend one clearly. "Chair speaks last" is easier to implement immediately.

      *(Refining the "Counter-Argument"):* Make sure to explicitly validate the expertise of the accountant and council officer while questioning the *process* that amplified their views.

  8.  **Final Polish of the Text:** (Proceeding to generate output based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** The Grants Committee
  **FROM:** [Your Name]
  **DATE:** Wednesday, [Date]
  **SUBJECT:** Thursday's Decision on the Community Kitchen Application

  **Purpose**
  I am writing this ahead of our meeting on Thursday to set out my position on the community kitchen application and to suggest a small change to how we make decisions. We are dealing with a significant sum—£42,000 represents roughly one-fifth of our annual budget—and we are working against the applicant's end-of-month deadline. We need to be sure our decision is robust.

  **Recommendation on the Grant**
  I recommend that we **approve the grant in principle, but attach conditions and stage the payments.**

  We should authorise the first half of the funding immediately to allow the applicant to secure their matched funding before the month ends. This respects their deadline and ensures we do not cost them goodwill. However, the second half should be released only after three months, subject to:
  1.  Written confirmation of the volunteer pool availability from the other local organisation involved.
  2.  A clear plan from the applicant on how they will manage running costs given their restricted reserves.
  3.  An agreed improvement in their monitoring data.

  This approach balances the urgency of the deadline with our duty to safeguard the charity's assets.

  **The Decision-Making Process**
  I also need to raise a concern about how we reached our preliminary view at the last meeting. When the Chair gives their view first, and the most experienced members speak early, it creates a powerful pressure for the rest of us to fall in line.

  There are two reasons a trustee might agree with the room. The first is sensible: you hear an expert make a point you hadn't considered, and you update your view based on their knowledge. The second is human nature: it is uncomfortable to be the only person objecting, so you stay silent. From the outside, these look identical, but the second type of agreement gives us no new information. It means we are not getting seven independent views; we are getting one view repeated seven times.

  I propose that for future meetings, the Chair speaks last. This allows the rest of us to state our true position without being influenced by the Chair's opening stance. For this specific application, given the size of the sum, I ask that we take ten minutes on Thursday to review the risks I have listed above before the final vote.

  **Addressing the Counter-Argument**
  I anticipate the response that a consensus among seven experienced people—including an accountant and a former council officer—is itself strong evidence that the application is sound. I agree that our collective experience is our greatest asset. I also agree that a committee which constantly doubts its own consensus will become paralysed and fail to give money away.

  However, consensus is only evidence if it is formed independently. If we discount the possibility that we have simply copied one another, we risk confusing agreement with due diligence. Delaying the second payment does not paralyse us; it simply ensures that our initial confidence is matched by reality on the ground.

  **My Position**
  I hope the committee will accept the staged payment approach. It protects the charity while still helping the applicant meet their deadline.

  However, if the committee chooses to approve the full £42,000 unconditionally on Thursday, I must formally record my dissent in the minutes. I will note that I have unresolved concerns regarding the volunteer pool and the restricted reserves. I do not say this lightly, but as a trustee, I have a legal duty to ensure we are not exposing the charity to unnecessary risk. Recording my objection ensures that should those risks materialise, the reasons for caution are on the record.

  I look forward to discussing this constructively on Thursday.

  [Your Name]
  Trustee
