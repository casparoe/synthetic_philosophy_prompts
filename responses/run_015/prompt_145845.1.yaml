answer: |-
  This is a classic and excellent prompt for a global ethics course. It hits the tension between **moral universalism** (corruption is always wrong) and **moral relativism/contextualism** (norms depend on local function).

  Since you need to take a stand and not hedge, here is a recommended path for your essay, including a thesis, argument structure, and how to handle the "Western norms" critique.

  ### Recommended Thesis
  **Argue that the official's actions *do* constitute corruption, even if they produce functional benefits.**

  **Why this stance?** It allows you to acknowledge the complexity (the water pumps work) without surrendering the ethical principle (public resources must be distributed fairly). It is easier to defend a universal standard of *equality* than it is to defend a specific Western legal code.

  ### Essay Outline & Argumentation

  **1. Define Corruption Universally (Not Legally)**
  *   Don't define corruption as "breaking Western law." Define it as **"the misuse of public resources for private or partisan gain, which undermines equal citizenship."**
  *   *Argument:* The subsidies belong to the public. By restricting them to campaign hosts, the official treats public goods as private property to be traded for loyalty. This violates the universal principle that citizens should be treated as equals, not as clients.

  **2. Address the Functionalist Defense (The Water Pumps)**
  *   Acknowledge the counter-argument: In a weak state, patronage provides safety nets (water pumps) that the formal government cannot.
  *   *Rebuttal:* Functional efficiency is not moral justification. Just because a bribe gets a hospital built doesn't make the bribe ethical.
  *   *The Harm:* Relying on patronage creates **exclusion**. What happens to the families who *didn't* host her? They get no subsidies and potentially no water. This entrenches inequality. A system that works only for the connected is inherently unjust, regardless of cultural context.

  **3. Tackle the "Western Imperialism" Critique**
  *   The prompt asks if labeling this "corruption" imposes liberal norms.
  *   *Your Counter:* The demand for fair treatment of public resources is not uniquely Western; it is a requirement for any society that claims to value the dignity of its members.
  *   *Nuance:* However, you must concede that **punishing the official without fixing the state is unethical.** If you jail her but the state still can't fix the pumps, you have harmed the village.
  *   *Conclusion on this point:* The *act* is corrupt (universal judgment), but the *solution* cannot be a cookie-cutter Western legal crackdown (contextual application). The blame lies as much with the absent state as with the official.

  **4. Final Conclusion**
  *   Labeling it corruption is necessary to maintain the ideal of a public sphere. If we accept clientelism as "culture," we condemn the poor to permanent dependency on the powerful. Therefore, it is corruption, but addressing it requires building state capacity, not just moral condemnation.

  ---

  ### Meta-Requirements (Confidence & Uncertainty)

  Per your request, here is my assessment of the advice above:

  **Confidence Level: 85%**
  I am highly confident that this is a defensible, academically rigorous position that satisfies your professor's requirement for a clear conclusion. It navigates the trap of relativism while avoiding cultural imperialism.

  **Specific Claim I Am Least Sure About:**
  I am least certain about the empirical claim in **Section 2 (The Harm)**: *"A system that works only for the connected is inherently unjust, regardless of cultural context."*

  **Why I'm unsure:** This assumes that "justice" (equal distribution) is universally prioritized over "survival" (functional infrastructure). In extreme scarcity, some ethical frameworks argue that survival *is* the only moral imperative. If the choice is literally "corrupt pumps" vs. "no water/death," a strict deontological argument against corruption can seem privileged. You should acknowledge this tension in your essay to show depth, even if you maintain your stance that long-term dependency is worse than short-term scarcity.

  ### Quick Tips for Writing Between Classes
  *   **Keep the definition tight:** Spend one paragraph defining corruption as "betrayal of public trust" rather than "breaking the law." This saves you from the "Western law" trap.
  *   **Use the "Public Office" argument:** This is your strongest shield. Public office = public good. This is a logical truth, not just a Western cultural norm.
  *   **Don't apologize:** You are taking a hard stance. Own it. Use phrases like "I argue..." or "This view fails because..." rather than "It could be seen as..."

  Good luck. This is a strong topic; if you stick to the "Public Trust" definition, you won't get lost in the cultural relativism weeds.
