  # The Forecasting Stance Quiz

  **Instructions:** Read each scenario carefully. Choose the option that best matches what you would actually do or believe in that situation. There are no right or wrong answers; we are mapping your intuitive operating system.

  **1. The Equal Match**
  You and a friend are both experienced forecasters. You've both looked at the exact same data on a tech rollout. You initially put the probability at 70%. Your friend puts it at 30%. You talk it over and realize neither of you missed any facts; you just weighed them differently.
  *   **A.** Move your estimate significantly toward theirs (e.g., to 50%).
  *   **B.** Keep your estimate close to where it started (e.g., 65-70%).
  *   **C.** Only move if you can find a specific mistake in their calculation.

  **2. The Foggy Morning**
  You feel sharp and set a probability at 70%. Later, you find out you took a cold medicine that morning known to cause overconfidence in logical tasks. You haven't found a specific error in your work yet.
  *   **A.** Drop your confidence significantly, just like you would for the friend in Question 1.
  *   **B.** Drop your confidence even more than you would for the friend.
  *   **C.** Keep your confidence high until you find a specific error, unlike the friend case.

  **3. The Split Mind**
  After learning about the disagreement in Question 1, you still feel internally like 70% is the right number, but you think that logically you *ought* to believe 50%.
  *   **A.** Report 50% publicly, even though 70% still feels right internally.
  *   **B.** Stick with 70% internally and publicly, insisting that's what you ought to believe.
  *   **C.** Report 50% publicly and wait until your internal feeling matches it before truly believing it.

  **4. The Twin Forecasters**
  Imagine two perfect forecasters who are identical in skill and have seen the exact same information on a new election question.
  *   **A.** It is possible for one to rationally say 60% and the other 80%.
  *   **B.** No, they must converge on the exact same number to be rational.
  *   **C.** They should be close, but a small gap is acceptable.

  **5. The Expected Clash**
  You know beforehand that your friend always disagrees with you on this specific type of tech question. You look at the data, form a view, and then they give their opposing view.
  *   **A.** Adjust your view significantly anyway.
  *   **B.** Adjust less than you would if the disagreement was a surprise.
  *   **C.** Do not adjust at all; you expected this.

  **6. The Black Box**
  A forecasting algorithm that has consistently beaten your Brier score over the last year sees more data than you and outputs a probability of 20% (you are at 70%).
  *   **A.** Move your estimate very close to the model's (e.g., 25%).
  *   **B.** Split the difference (e.g., 45%).
  *   **C.** Stay near your original estimate (e.g., 65%).

  **7. The Future You**
  You know that tomorrow you will read one additional high-quality study on this topic that you haven't seen yet.
  *   **A.** Adjust your current probability now to match what you think Future You will say.
  *   **B.** Wait until tomorrow to adjust; today's estimate is based on today's info.
  *   **C.** Assume Future You will agree with Current You, so no change needed.

  **8. The Third Voice**
  You disagree with your friend (70% vs 30%). Then a third forecaster, equally skilled, looks at the same data and says 75%.
  *   **A.** Move back toward your original 70% confidently.
  *   **B.** Stay in the middle; the disagreement still counts.
  *   **C.** Ignore the third person; it's still your word against your friend's.

  ***

  # The Logical Tree & Position Mapping

  To sort your answers into a coherent worldview, we map them onto a logical tree built from the four core distinctions hidden in the vignettes. While there are 8 questions, they probe 4 primary branching points. Each branch is binary for the sake of classification (choosing the "middle" option usually indicates uncertainty, but for sorting, we map it to the nearest coherent stance).

  **The 4 Core Branches:**
  1.  **Peer Response:** Do you split the difference with an equal? (Split vs. Stay)
  2.  **Impairment Symmetry:** Do you treat your own impairment the same as a peer's disagreement? (Same vs. Different)
  3.  **Uniqueness:** Does evidence fix one right answer? (Yes vs. No/Range)
  4.  **Akrasia:** Do your internal feeling and normative judgment move together? (Together vs. Apart)

  **The Tree Structure (16 Leaves):**
  Combining these 4 binary branches creates 16 possible logical positions (leaves). Below is the map of which leaves are occupied by actual philosophical positions and which are empty.

  | Leaf | Peer | Impairment | Uniqueness | Akrasia | Status | Notes |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Split | Same | Yes | Together | **Occupied** | Standard Conciliationism. |
  | **2** | Split | Same | Yes | Apart | **Occupied** | Level-Splitting Conciliationism. |
  | **3** | Split | Same | No | Together | **Occupied** | Permissive Conciliationism. |
  | **4** | Split | Same | No | Apart | **Empty** | Unattractive; rarely defended. |
  | **5** | Split | Diff | Yes | Together | **Empty** | Incoherent; why trust peer over drunk self? |
  | **6** | Split | Diff | Yes | Apart | **Empty** | Incoherent. |
  | **7** | Split | Diff | No | Together | **Empty** | Incoherent. |
  | **8** | Split | Diff | No | Apart | **Empty** | Incoherent. |
  | **9** | Stay | Same | Yes | Together | **Empty** | Tense; hard to justify staying with Uniqueness. |
  | **10** | Stay | Same | Yes | Apart | **Empty** | Incoherent. |
  | **11** | Stay | Same | No | Together | **Occupied** | Standard Steadfastness / Permissivism. |
  | **12** | Stay | Same | No | Apart | **Empty** | Unattractive. |
  | **13** | Stay | Diff | Yes | Together | **Occupied** | "Right Reason" View (Stay on peer, drop on impairment). |
  | **14** | Stay | Diff | Yes | Apart | **Empty** | Rare/Unexplored. |
  | **15** | Stay | Diff | No | Together | **Occupied** | Permissive Steadfastness. |
  | **16** | Stay | Diff | No | Apart | **Empty** | Rare/Unexplored. |

  **Indistinguishable Leaves:**
  This quiz cannot perfectly separate Leaf 3 (Permissive Conciliationism) from Leaf 1 (Standard Conciliationism) if a user answers "Range" on Q4 but "Split" on Q1, as some Standard Conciliators accept ranges in practice. Similarly, Leaf 13 and Leaf 15 may blur if the user treats "Uniqueness" as a matter of degree. Questions 5, 6, 7, and 8 are consistency checks; they do not create new branches but help confirm whether a user truly holds the "Stay" or "Split" stance on the core branches.

  **Scoring Key:**

  *   **Peer Branch (Q1, Q6, Q8):**
      *   Mostly A → **Split**
      *   Mostly B/C → **Stay**
  *   **Impairment Branch (Q2):**
      *   A → **Same**
      *   B/C → **Different**
  *   **Uniqueness Branch (Q4):**
      *   B → **Yes**
      *   A/C → **No**
  *   **Akrasia Branch (Q3):**
      *   A → **Apart** (Split mind)
      *   B/C → **Together** (Aligned)
  *   **Consistency Checks (Q5, Q7):**
      *   If Peer=Split, these should generally indicate adjustment (A/B).
      *   If Peer=Stay, these should generally indicate holding firm (B/C).
      *   *Note:* If answers contradict (e.g., Split on Peer but Stay on Model), the user likely holds a "Messy" view. Assign them to the nearest coherent leaf but flag the inconsistency.

  **Handling Messy Answers:**
  If a user's pattern doesn't fit any clean leaf (e.g., Split on Peer, Stay on Impairment, Yes on Uniqueness), they likely hold an unstable combination. Assign them to the leaf that matches their strongest convictions (usually Q1 and Q2) and note that their view may require refinement to avoid internal conflict.

  **Empty Leaf Count:**
  Based on the taxonomy above, there are 16 theoretical leaves. 6 are occupied by recognizable positions in the literature. 10 are empty (either incoherent, unattractive, or unexplored).

  \answer{10}
