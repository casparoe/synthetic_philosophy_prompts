prompt: |-
  ok so ive been teaching an intro bio course and got dragged into the adaptationism vs spandrels thing—like, my students keep asking if every trait is "for" something and im not sure how to steer them. im trying to figure out which open questions in this debate actually matter for how we teach or do evolutionary research now, not just historical Gould-Lewontin beef. like, should we prioritize figuring out how often spandrels vs adaptations occur empirically? or is the bigger deal the conceptual problem of testing adaptationist stories without falling into just-so narratives? and what about the newer work on developmental bias and niche construction—does that resolve the old spandrels worry or just move the goalposts?

  i have maybe one semester of student research hours to allocate. which of these lines—testing spandrel frequency, fixing adaptationist methodology, or integrating evo-devo constraints—would actually change practice if we settled it? defend the ranking: whats tractable with undergrad labor, whats upstream of the others, and which ones are overrated? also, does any of this still matter for medicine or conservation, or is it mostly academic turf wars at this point?
