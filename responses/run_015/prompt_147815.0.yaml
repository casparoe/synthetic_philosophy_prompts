  Hiya, need a bit of advise. My flatmate came back from this pop-up in Bristol and went on about this sound sculpture that only kicks in when you stand in one exact spot — she said the vibration and the silence around it was genuinely transformative, and she knows my taste inside out so I trust her completely. I never made it there, but whilst I'm putting together a little zine on 'art moments that change how you see things' I want to include it. Still, it feels a bit like cheating — like I'm claiming an experience I haven't actually had. Is there a real gap between knowing something is brilliant because someone told you, and knowing it from being there yourself? Should I write the entry or leave it out? Also, could you say how confident you are in what you're saying and flag the part you're least sure about?
