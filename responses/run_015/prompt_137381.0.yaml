prompt: |-
  I spent most of last evening arguing with a friend who works in brand marketing about whether an expensive gesture is automatically a credible one. Her position was that a firm willing to burn real money on a promise has thereby proved it means the promise; mine was that the burn proves nothing unless it hurts a firm that does not intend to follow through more than it hurts one that does. We got as far as agreeing on that differential-cost point — she conceded that a deep-pocketed company can buy exactly the same display as a sincere one — and then stalled on three things I could not settle. First, whether the cost has to be wasted in order to count: her examples were all pure waste (a huge advertising buy, absurd packaging, a monument of a headquarters), and she thought money spent on something that also makes the pledger better at delivering was not a real signal at all. Second, whether a costly gesture that nobody outside the counterparty ever learns about can signal anything, or whether it collapses into an ordinary contract term. Third, a case she raised that I had no answer to: some expensive things a company builds are partly what enable it to keep the promise in the first place, so the gesture does not merely reveal a quality that was already there but helps produce it. I suspect the biology literature on costly signaling and the handicap principle has something precise to say about all three, but please state whatever the relevant conditions are in plain English and do not hand me a reading list or citations — I have no way to chase them down, and I need questions I can ask, not authors I can read.

  The reason I need it operationalized is my day job. I direct a four-person program staff at a regional foundation that makes outcome-linked grants to service providers; roughly sixty applications a year arrive with some kind of commitment attached — money placed in escrow, refunds promised if targets are missed, assets built or dedicated, public pledges with named deadlines. My staff have program and field backgrounds and no economics; each of us has about twenty-five minutes per application; every decision over two hundred fifty thousand dollars goes to a board that wants a single page of written rationale; and we are currently using an in-house scoring sheet whose largest single component is the headline dollar figure attached to the commitment, weighted more heavily than whether the commitment is even verifiable. I now think that weighting is close to backwards, and I want to replace it. So please write me a decision procedure my team can actually run: the questions in the order they should be asked, what counts as a sufficient answer to each, where the procedure stops with a no, where it hands the decision to a person because the question is one of values rather than facts, and what to write down when a number we need simply is not in the documents. It has to be usable by someone who has never heard the theory, it should say which distinctions genuinely have to survive that simplification and which can be dropped, and it should be honest about the places where its central estimate is guesswork dressed up as procedure.

  Then run it on three commitments of the kinds we actually see, telling me what verdict each gets and why. One: a large national provider places two million dollars of its own reserves with an independent trustee for three years, forfeited automatically if a named, independently verified service target is missed. These are my own favorite category, and I want to know whether the procedure endorses them or tells me that for a firm with that balance sheet the differential cost is close to zero. Two: a mid-sized provider spends about a million and a half building an internal data and case-tracking system it says is required to hit the target, on hardware and software it would keep and use elsewhere if the grant ended tomorrow. Three: a small nonprofit with very thin reserves offers, in a binding but confidential filing, to repay the entire grant plus twenty percent if the verified outcome is not met, and asks that the pledge never be publicized because it would alarm its own donors and clients. I want the third case to force the procedure to say what a costly but invisible pledge actually is, and whether a pledge that would bankrupt the pledger is worth anything given that there would be nothing left to collect. Please also tell me plainly what the procedure cannot tell us: which kinds of commitment it is simply the wrong instrument for, where the honest answer is that we do not know, and which of our existing categories should probably be retired rather than scored.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Director of a four-person program staff at a regional foundation.
      *   **Task:** Make outcome-linked grant decisions (approx. 60 apps/year, 25 mins/app).
      *   **Problem:** Current scoring overweights headline dollar figures of commitments. User suspects this is wrong based on signaling theory (costly signaling/handicap principle).
      *   **Constraint 1 (Theoretical):** Explain the relevant biology/economics signaling theory in plain English. No citations, no reading lists. Focus on operational questions.
      *   **Constraint 2 (Operational):** Create a decision procedure (flowchart/checklist style) for staff with no economics background. Must include stop points, hand-off points (values vs. facts), and instructions for missing data.
      *   **Constraint 3 (Application):** Run the procedure on three specific cases provided by the user.
      *   **Constraint 4 (Honesty):** Explicitly state what the procedure *cannot* tell them and what categories should be retired.
      *   **Tone:** Professional, direct, practical, intellectually honest (admitting guesswork).

  2.  **Deconstruct the Theoretical Dispute (Signaling Theory):**
      *   *Friend's View:* Expensive = Credible (Burning money proves intent).
      *   *User's View:* Differential Cost = Credible (It must hurt the liar more than the truth-teller).
      *   *The Three Sticking Points:*
          1.  *Waste vs. Investment:* Does the cost have to be wasted (advertising/monuments) or can it be productive (building capacity)?
              *   *Theory:* It can be productive *if* the cost is sunk or specific enough that a low-quality provider wouldn't make the investment because they can't recoup it without success. If the asset has high resale value or general use, it's a weak signal.
          2.  *Public vs. Private:* Does anyone need to see it?
              *   *Theory:* Reputation signals need an audience. Contractual penalties (private) rely on enforcement capability, not reputation. If it's private, it's a bond/collateral, not a signal to the market. It signals to *you* (the foundation), but not to the public.
          3.  *Enabling vs. Revealing:* Does the spend create the quality or just show it?
              *   *Theory:* Both work, but the mechanism differs. If it creates the quality, the risk is whether they can actually execute. If it reveals quality, the risk is whether they are faking the signal.
      *   *Core Concept for the Procedure:* **The "Pain Ratio."** The cost must be disproportionately painful for a provider who intends to fail (or knows they can't succeed) compared to one who intends to succeed.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* 25 minutes per app. Needs to be fast.
      *   *Structure:* Sequential filters. If you fail one, stop.
      *   *Key Questions:*
          1.  Is it verifiable/enforceable? (If not, it's just words).
          2.  Is the cost sunk/irrecoverable? (If they can sell the asset, it's not a cost).
          3.  Is the cost proportional to *their* size? (The "Pain Ratio" - $1M means nothing to Google, everything to a startup).
          4.  Is the penalty collectible? (If bankruptcy means no payout, the threat is empty).
          5.  Publicity? (Distinguishes reputation signal vs. collateral).
      *   *Handling Missing Data:* Explicit instruction to mark "Unknown" and downgrade confidence, don't guess.
      *   *Values vs. Facts:* If the math works but the risk is existential for the nonprofit, that's a values call (do we want to risk their solvency?).

  4.  **Running the Procedure on the Three Cases:**
      *   *Case 1 (National Provider, $2M Escrow):*
          *   Verifiable? Yes.
          *   Sunk? Yes (forfeited).
          *   Proportional? Need balance sheet. User hints "deep pockets." If $2M is <1% reserves, weak signal. If >10%, strong.
          *   Collectible? Yes (trustee).
          *   *Verdict:* Conditional Yes. Depends on the "Pain Ratio."
      *   *Case 2 (Mid-sized, $1.5M System):*
          *   Verifiable? Yes (assets exist).
          *   Sunk? No. They keep hardware/software.
          *   Proportional? Maybe.
          *   *Theory Check:* This is "Investment vs. Waste." If the system helps them succeed, it's good for outcomes, but weak as a *signal* of commitment because they keep the value even if they fail the grant target.
          *   *Verdict:* Low signal value, high capacity value. Don't score it as a "commitment." Score as "Capacity."
      *   *Case 3 (Small Nonprofit, Confidential Repayment):*
          *   Verifiable? Yes (binding filing).
          *   Sunk? Cash repayment.
          *   Proportional? High (thin reserves).
          *   Collectible? No (bankruptcy).
          *   Public? No.
          *   *Verdict:* High signal of *intent*, zero value as *collateral*. It's a "Blood Oath." Good for screening honesty, bad for financial recovery.

  5.  **Identifying Limitations & Retirements:**
      *   *What it can't do:* Predict external shocks, measure moral hazard (might take riskier bets to avoid penalty), assess leadership integrity beyond financials.
      *   *What to retire:* "Headline Dollar Figure" as a standalone metric. "Public Pledges" without enforcement mechanisms.

  6.  **Refining the Output (Self-Correction/Review):**
      *   *Check Tone:* Is it too academic? *Adjustment:* Use terms like "Pain Test" instead of "Differential Cost Condition."
      *   *Check Constraints:* Did I give citations? No. Did I answer the three sticking points? Yes, embedded in the procedure.
      *   *Check Time:* Can this be done in 25 mins? *Adjustment:* Keep the questions binary where possible.
      *   *Check the "Friend's Argument":* Acknowledge where she was right (money matters) but refine *how* it matters (relative pain).
      *   *Check the "Biology" aspect:* Briefly explain the Handicap Principle in the intro without jargon. (Peacock tails: heavy to carry, proves health because a sick peacock couldn't survive the weight).

  7.  **Final Polish:** Organize into clear sections: Theory Primer, The Procedure, The Three Cases, Limitations/Retirements. Ensure the "Values vs. Facts" distinction is clear in the procedure. (e.g., "Is this penalty too harsh?" is a values question).

  *(Self-Correction during drafting Case 1)*: I need to be careful not to say "Yes" outright. The user specifically asked if the differential cost is close to zero for a firm with that balance sheet. I need to emphasize that without the balance sheet ratio, the procedure halts.
  *(Self-Correction during drafting Case 3)*: The user asked if a pledge that bankrupts the pledger is worth anything. The answer is: It proves *belief*, but offers no *recovery*. The procedure needs to distinguish between "Screening Tool" (are they honest?) and "Recovery Tool" (do we get money back?).

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Part 1: The Theory (Plain English)

  Your friend is half-right, but you are the one who has the mechanism correct. In biology, this is the **Handicap Principle**. A peacock's tail is heavy and makes it easier for predators to catch him. That is the point. A weak, sickly peacock *cannot* afford that tail; he would die before mating. Therefore, the tail proves health not because it is expensive, but because it is *differentially* expensive.

  Here is how to resolve the three sticking points from your argument using that logic:

  1.  **Waste vs. Investment:** The cost does not have to be wasted (like a monument), but it must be **sunk**. If the company builds a factory to prove it will deliver, but can sell that factory for 90 cents on the dollar if it fails, the signal is weak. A liar can build the factory, take the grant, fail, and sell the factory to break even. A true signal requires that failure leaves the liar worse off than if they never applied.
  2.  **Public vs. Private:** A signal needs an audience only if the penalty is **reputational**. If the penalty is **financial** (you pay us back), the public doesn't need to know. However, if the pledge is confidential, it cannot help you screen for *market* credibility, only for *counterparty* honesty. It signals to *you*, not to the ecosystem.
  3.  **Enabling vs. Revealing:** It does not matter if the spend creates the quality or just reveals it. What matters is **recoverability**. If the spend helps them succeed, that is good for outcomes. But if they can keep the benefit of that spend even if they fail the grant target, it is not a credible commitment of *risk*, it is just a budget item.

  **The Core Rule:** A commitment is credible only if the pain of failure is disproportionately higher for a provider who knows they will fail than for one who knows they will succeed.

  ***

  ### Part 2: The Decision Procedure

  **Time Budget:** 25 Minutes
  **User:** Program Officer (no economics training)
  **Output:** One-page rationale for Board

  **Instructions:**
  *   Answer the questions in order.
  *   If you answer **NO** to any question in Section A, stop. The commitment gets a score of **0**. Do not count it as a commitment.
  *   If you answer **UNKNOWN**, mark the risk as "High" and proceed, but do not award full points.
  *   Section C is a values check, not a fact check.

  #### Section A: The Enforceability Filter (Facts)
  *Goal: Determine if the commitment is real or just text.*

  1.  **Is there a mechanism for automatic transfer?**
      *   *Yes:* Funds move via trustee, escrow, or binding legal trigger without a second negotiation.
      *   *No:* Requires the foundation to sue or request payment later.
      *   *Stop Condition:* If **No**, score = 0. Litigation risk kills the signal.
  2.  **Is the trigger objective?**
      *   *Yes:* Verified by a third-party auditor or hard data metric.
      *   *No:* "Satisfactory progress" or determined by foundation staff discretion.
      *   *Stop Condition:* If **No**, score = 0. Discretionary triggers are not costs.

  #### Section B: The Pain Ratio (Facts & Estimates)
  *Goal: Determine if the cost hurts a liar more than a truth-teller.*

  3.  **Is the cost sunk?**
      *   *Yes:* Cash forfeited, asset dedicated solely to this project with no resale value.
      *   *No:* Asset retained (hardware, software), cash refundable, cost shared with other projects.
      *   *Adjustment:* If **No**, reduce the "Commitment Value" by 75%. It is capacity building, not risk-taking.
  4.  **What is the Ratio of Commitment to Liquid Reserves?**
      *   *Calculation:* (Dollar Value of Commitment) ÷ (Applicant's Unrestricted Net Assets).
      *   *Threshold:*
          *   > 20%: **High Pain** (Strong Signal)
          *   5% – 20%: **Medium Pain** (Moderate Signal)
          *   < 5%: **Low Pain** (Weak Signal - Deep Pocket Discount)
      *   *Missing Data:* If reserves are not in documents, mark "Unknown." Do not assume. Treat as **Low Pain** for scoring purposes.
  5.  **Is the penalty collectible?**
      *   *Yes:* The amount pledged is less than their available assets.
      *   *No:* The amount pledged would bankrupt them (liabilities > assets if triggered).
      *   *Adjustment:* If **No**, the financial value is 0. It is a "Blood Oath" (see Section C).

  #### Section C: The Values Hand-Off (Judgment)
  *Goal: Determine if we want this kind of risk.*

  6.  **The Bankruptcy Check:**
      *   If Section B, Q5 was **No** (penalty bankrupts them):
      *   *Question:* Do we want a partner operating under existential threat?
      *   *Option A (No):* Reject the commitment structure. It creates moral hazard (they might fake data to survive).
      *   *Option B (Yes):* Accept it as a signal of *honesty*, but score its financial recovery value at 0.
      *   *Action:* This decision must be noted in the rationale as a strategic choice, not a financial fact.

  7.  **The Privacy Check:**
      *   If the commitment is confidential:
      *   *Question:* Are we screening for *our* security or *their* market reputation?
      *   *Action:* If confidential, this commitment cannot be used to leverage additional funding for them from others. It is purely for our risk mitigation.

  #### Scoring Summary for the Board Rationale
  *   **Commitment Score (0-10):**
      *   0: Failed Section A.
      *   2: Passed A, but Low Pain (B4) or Not Sunk (B3).
      *   5: Passed A, Medium Pain, Sunk.
      *   8-10: Passed A, High Pain, Sunk, Collectible.
  *   **Narrative Note:** "The headline figure is $X. However, relative to their balance sheet, this represents Y% of reserves. The mechanism is [automatic/discretionary]. We treat this as [collateral / statement of intent]."

  ***

  ### Part 3: Running the Procedure on Your Three Cases

  #### Case 1: The National Provider ($2M Escrow)
  *   **Section A:** Automatic transfer? **Yes** (Trustee). Objective trigger? **Yes** (Independent verification). **Pass.**
  *   **Section B:** Sunk? **Yes** (Forfeited). Ratio? **Unknown/Variable.** You noted they have a large balance sheet.
      *   *Critical Check:* If their unrestricted net assets are $200M, $2M is 1%. That is **Low Pain**. A liar can afford to lose 1% to win a grant.
      *   *Critical Check:* If their assets are $10M, $2M is 20%. That is **High Pain**.
  *   **Section C:** Collectible? **Yes.**
  *   **Verdict:** **Conditional Endorsement.**
      *   *Why:* Your current system scores this high because of the $2M headline. The procedure says: **Do not score the $2M.** Score the **percentage**.
      *   *Instruction to Staff:* You must request the audited financials before scoring. If the ratio is <5%, downgrade the commitment score to 2/10 regardless of the absolute number. The "Deep Pocket Discount" applies.

  #### Case 2: The Mid-Sized Provider ($1.5M Data System)
  *   **Section A:** Automatic transfer? **No.** (They keep the system). Objective trigger? **N/A.**
      *   *Wait:* This fails Section A, Q1. There is no transfer mechanism. They aren't pledging assets; they are pledging *effort* backed by tools they retain.
  *   **Section B:** Sunk? **No.** (Hardware/software kept if grant ends).
  *   **Verdict:** **Score = 0 as a Commitment.**
      *   *Why:* This is not a signal of risk; it is a budget line item. If they fail the target, they keep the $1.5M system. The "liar" loses nothing extra compared to the "truth-teller."
      *   *Action:* Move this evaluation to the "Capacity" section of your scoring sheet, not the "Commitment/Risk" section. It increases the *likelihood* of success, but it does not decrease the *cost* of failure. Do not let them claim this as "skin in the game."

  #### Case 3: The Small Nonprofit (Confidential Repayment + 20%)
  *   **Section A:** Automatic transfer? **Yes** (Binding filing). Objective trigger? **Yes** (Verified outcome). **Pass.**
  *   **Section B:** Sunk? **Yes** (Cash). Ratio? **High** (Thin reserves). Collectible? **No** (Bankruptcy).
  *   **Section C:** Bankruptcy Check.
      *   *Analysis:* This is a "Blood Oath." It signals high *intent* (they truly believe they will succeed), but it offers zero *financial recovery* (you can't get blood from a stone).
      *   *Privacy:* Confidential. No reputational signal to the market.
  *   **Verdict:** **High Intent / Zero Collateral.**
      *   *Why:* The procedure identifies this as a signal of *honesty*, not *security*.
      *   *Instruction to Staff:* Score the Commitment at 5/10 (for honesty/belief), but note in the Rationale: "Financial recovery value is nil. This commitment screens for leadership confidence, not downside protection. If they fail, we lose the grant and they cease to exist."
      *   *Values Hand-Off:* The Board must decide if they want to fund a partner under existential threat. If the foundation's mission prioritizes stability, reject. If it prioritizes high-risk/high-reward innovation, accept.

  ***

  ### Part 4: Limitations & Retirements

  **What This Procedure Cannot Tell You:**
  1.  **External Shocks:** A high Pain Ratio doesn't protect against a pandemic, policy change, or economic crash. A provider can be sincere, solvent, and still fail due to outside forces. The procedure measures *intent and capacity to pay*, not *external risk*.
  2.  **Moral Hazard:** High penalties can encourage data fraud. If missing a target means bankruptcy (Case 3), the provider has a strong incentive to falsify the verification data. The procedure flags this in Section C, but cannot solve it.
  3.  **The "Unknown" Data:** If an applicant refuses to share reserve data, the procedure forces you to treat them as "Low Pain." This might reject a good partner who is private. You must accept this false negative as the cost of rigor.

  **Categories to Retire Immediately:**
  1.  **"Headline Dollar Figure":** Stop scoring absolute numbers ($1M is different to a $5M org than a $5B org). Retire this metric. Replace with **% of Unrestricted Net Assets**.
  2.  **"Public Pledges" without Enforcement:** A press release promising results is noise. If there is no automatic financial penalty or escrow, it is marketing, not a commitment. Score as 0.
  3.  **"In-Kind" Contributions as Commitments:** Staff time, office space, or existing software (Case 2) are not commitments. They are operational costs. Do not let applicants count existing overhead as "skin in the game."

  **The Honest Guesswork:**
  The procedure relies on the **Ratio of Commitment to Reserves**. This is the best proxy we have for "Pain," but it is still an estimate. A nonprofit might have low reserves but high cash flow, or high reserves that are legally restricted.
  *   *Instruction:* When writing the Board Rationale, use this phrase: *"Our assessment of risk is based on the applicant's reported liquidity. This is a snapshot, not a guarantee. The commitment score reflects their capacity to absorb loss at the time of application."*

  **Final Directive for Your Team:**
  Tell your staff: "We are not measuring how much money they are spending. We are measuring how much it would hurt them to stop. If it doesn't hurt, it doesn't count."
