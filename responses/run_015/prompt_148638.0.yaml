prompt: |-
  I'm a doctoral student in philosophy of religion working on the metaphysics of personal identity in classical Abhidharma and its interaction with contemporary philosophy of mind. I am trying to determine whether my judgments about survival, interruption, and duplication can be captured by a single principle—perhaps one that exploits the distinction between ultimate (paramārtha) and conventional (saṃvṛti) truth, or specific Abhidharmic commitments to momentariness and causal integration—or whether I must abandon some of them. I want the conceptual architecture, not a historical survey or bibliography.

  Here are my verdicts on concrete cases.

  1. Destructive teletransportation: A person's neural and psychological patterns are scanned, the original body destroyed, and a functionally identical being created on Mars. Verdict: conventionally, this is the same person; ultimately no self travels, but the causal-functional stream of the five aggregates (skandhas) continues without ontological rupture.

  2. Non-destructive branching: The same scan is performed but the original survives, yielding a psychologically continuous copy. Verdict: neither original nor copy is metaphysically privileged as "the" continuing self; both are equally related streams. Yet I feel an asymmetry—if forced to identify with one, I choose the original—which seems to smuggle in a substantial self I officially deny.

  3. Split-brain separation (corpus callosotomy): Each hemisphere supports independent preferences and actions. Verdict: there was never one self controlling both; rather, two previously interwoven streams become distinguishable. There is no tragic "division" of a prior unity.

  4. Severe progressive dementia: Over years, memory, character, and cognitive integration dissolve, though minimal consciousness and bodily life persist. Verdict: the conventional person designated by the original name is genuinely gone; the remaining biological entity is a new, severely attenuated stream, not the old one hidden.

  5. Nirodha-samāpatti (cessation of perception and feeling): A meditator enters a state in which all mental aggregates—including consciousness—cease entirely for hours, then resumes with prior psychological continuity intact. Verdict: upon emergence, this is conventionally the same person; the interruption is like a dreamless sleep, not a death and rebirth of the stream.

  6. Post-traumatic moral transformation: A child who suffered severe abuse becomes an adult monastic practitioner who, upon deep insight into anattā, sincerely disowns the child as "not me" in the ultimate sense, yet accepts conventional moral and legal responsibility for actions performed by that earlier aggregate-stream.

  The tensions I keep returning to are these. Between (1) and (2): if causal-psychological continuity suffices for conventional identity in destructive copying, why does the untouched original in branching undermine the copy's claim? Between (4) and (5): in dementia the aggregates gradually degrade and I judge the original person lost, yet in nirodha they vanish entirely and I judge the same person resumed—suggesting that physical embodiment or some non-mental factor is doing hidden work.

  Is there a unified account—perhaps one that distinguishes degrees of causal integration, or that treats conventional designation as governed by social-practical criteria rather than metaphysical ones—that delivers all six verdicts? If so, state it precisely, indicate which clause addresses which case, and predict what it says about an unlisted scenario: a practitioner enters the formless attainment of neither-perception-nor-non-perception (nevasaññānāsaññāyatana) for an extended period, during which mental activity is reduced to a minimal, undifferentiated residue, then emerges with intact autobiographical memory. Does the stream survive? If no principle can save every verdict, tell me which ones to overturn and why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Doctoral student in philosophy of religion. Expertise level: High. Focus: Metaphysics of personal identity, Classical Abhidharma, Contemporary Philosophy of Mind.
      *   **Task:** Determine if a single principle can capture six specific verdicts on personal identity cases (Teletransportation, Branching, Split-Brain, Dementia, Cessation, Moral Transformation).
      *   **Constraint:** Conceptual architecture only. No historical survey or bibliography.
      *   **Key Tensions:**
          *   (1) vs. (2): Why does destruction allow identity but branching creates asymmetry (if no self exists)?
          *   (4) vs. (5): Why does gradual loss of aggregates (dementia) kill the person, but total temporary cessation (nirodha) does not?
      *   **Goal:** Provide a unified Abhidharmic-compatible principle or advise which verdicts to abandon.
      *   **Test Case:** Predict the outcome for *nevasaññānāsaññāyatana* (neither-perception-nor-non-perception).

  2.  **Deconstruct the Verdicts & Abhidharmic Commitments:**
      *   *Abhidharma Core:* No-self (*anattā*), Momentariness (*kṣaṇika*), Dependent Origination (*pratītyasamutpāda*), Two Truths (*satyadvaya*).
      *   *Verdict 1 (Destructive Teleport):* Conventional Yes, Ultimate No (stream continues). Consistent with *santāna* (continuum) view.
      *   *Verdict 2 (Branching):* No metaphysical privilege, but pragmatic asymmetry (prefer original). This is the trickiest. Standard Parfitian reductionism says "survival matters, not identity." But the user feels an asymmetry. Abhidharma usually avoids "I am this stream" entirely.
      *   *Verdict 3 (Split-Brain):* Two streams revealed. Consistent with Abhidharma rejection of a unitary controller (*svāmin*).
      *   *Verdict 4 (Dementia):* Person gone, new attenuated stream. Suggests psychological continuity is key for *conventional* personhood.
      *   *Verdict 5 (Nirodha):* Person survives total mental cessation. Suggests *material continuity* or *latent tendencies* (*vāsanā/bīja*) are key.
      *   *Verdict 6 (Moral Transformation):* Ultimate disownership, conventional responsibility. Standard Two Truths application.

  3.  **Address the Tensions:**

      *   **Tension A: (1) vs. (2) (Teleport vs. Branching).**
          *   *Problem:* If continuity is all that matters, why prefer the original in branching?
          *   *Abhidharmic Solution:* Causal *uniqueness* vs. Causal *multiplicity*. In (1), the causal stream is singular (even if mediated by tech). In (2), the causal stream bifurcates. The "asymmetry" isn't metaphysical (no self to prefer); it's *pragmatic/conventional*. The original stream has *spatiotemporal continuity* without interruption. The copy is a *new* causal branch originating from a scan.
          *   *Refinement:* In Abhidharma, cause and effect are momentary. The "original" is just the immediately preceding moment. In branching, the copy is causally distant (scan -> create) vs. immediate (moment n -> moment n+1). The preference for the original is the preference for *immediate causal proximity* over *replicated pattern*.

      *   **Tension B: (4) vs. (5) (Dementia vs. Nirodha).**
          *   *Problem:* Gradual loss = Death. Total temporary loss = Survival.
          *   *Abhidharmic Solution:* The distinction lies in *seed continuity* (*bīja-santāna*) vs. *manifest function* (*vṛtti*).
          *   In Dementia: The *seeds* for memory/character are destroyed/eroded. The causal capacity to retrieve the past is broken. The stream continues biologically, but the *person-concept* (which relies on memory/character) cannot be imputed.
          *   In Nirodha: The *seeds* are preserved in the substratum consciousness (Yogācāra *ālaya-vijñāna* or Sautrāntika *bīja* theory). The manifest functions cease, but the causal potential remains intact and *resumable*.
          *   *Key:* It's not about *presence* of aggregates, but *preservation of causal potential*.

  4.  **Develop the Unified Principle:**
      *   Need a principle that handles Two Truths, Causal Continuity, and Seed Preservation.
      *   *Name:* **The Principle of Causal-Seed Continuity with Pragmatic Imputation.**
      *   *Ultimate Level:* Only momentary dharmas arising and ceasing. No identity.
      *   *Conventional Level:* Identity is imputed based on (a) unbroken causal potential (seeds) and (b) pragmatic utility (social/moral function).
      *   *Differentiation:*
          *   Survival = Preservation of causal seeds allowing resumption of specific functions.
          *   Identity = Pragmatic imputation on a stream where seeds remain accessible.

  5.  **Drafting the Architecture:**

      *   *Core Axiom 1 (Ultimate):* No diachronic identity. Only causal succession (*santāna*).
      *   *Core Axiom 2 (Conventional):* Personhood is imputed where causal seeds for memory/volition remain *accessible* and *integrated*.
      *   *Core Axiom 3 (Interruption):* Causal continuity can persist through manifest cessation if latent seeds (*vāsanā*) are preserved in a subliminal carrier (e.g., *ālaya* or material basis).
      *   *Core Axiom 4 (Branching):* In bifurcation, conventional identity follows the path of *spatiotemporal uninterruptedness* (the original), while the copy is a *conventional duplicate* but causally distinct.

  6.  **Mapping Cases to Principles:**
      *   (1) Teleport: Seeds transferred causally (via scan info as efficient cause). Stream continues conventionally.
      *   (2) Branching: Original has spatiotemporal continuity. Copy has causal similarity but distinct origin point. Asymmetry is pragmatic (original is the *continuation*, copy is the *effect*).
      *   (3) Split-Brain: Two streams revealed. Imputation splits.
      *   (4) Dementia: Seeds destroyed. Imputation fails.
      *   (5) Nirodha: Seeds preserved (subliminally). Imputation holds.
      *   (6) Transformation: Ultimate truth (no owner) vs. Conventional truth (karmic liability of the stream).

  7.  **Addressing the Test Case (Neither-Perception-Nor-Non-Perception):**
      *   *State:* Subtle mental residue exists. Not total cessation like *nirodha*.
      *   *Analysis:* Seeds are definitely preserved. Manifest activity is minimal but not zero.
      *   *Verdict:* Stream survives. Even more robustly than *nirodha* because there is no total break in manifest consciousness, however subtle.
      *   *Nuance:* In Abhidharma, this state is still *saṃsāric*. The "person" imputation remains strong because the *asmi-māna* (conceit "I am") is only fully uprooted at Arhatship. So, conventional survival is high.

  8.  **Critique and Refinement (Self-Correction):**
      *   *Critique:* Does this smuggle in a self?
      *   *Defense:* No, because "seeds" are just causal potentials, not entities. "Imputation" is explicitly nominal.
      *   *Critique:* The Branching asymmetry (Verdict 2) is the weak point. If there is no self, why prefer the original?
      *   *Refinement:* Use the *Sautrāntika/Yogācāra* distinction. The original is the *immediate antecedent condition* (*samanantara-pratyaya*). The copy is a *distant* effect. We conventionally track the *immediate* succession. To choose the copy is to ignore the actual causal link in favor of a pattern match. This aligns with the user's intuition without positing a self.
      *   *Critique:* Dementia vs. Nirodha.
      *   *Refinement:* Emphasize *accessibility*. In Dementia, the causal link to past karma/memory is severed (seeds corrupted). In Nirodha, the link is suspended but intact (seeds dormant).

  9.  **Finalizing the Output Structure:**
      *   **The Principle:** "Causal-Seed Continuity with Pragmatic Imputation."
      *   **The Two-Tiered Ontology:** Ultimate (Momentary Dharmas) vs. Conventional (Imputed Streams).
      *   **Case Mapping:** Explicitly link clauses to the 6 verdicts.
      *   **Resolution of Tensions:** Explain how the principle solves the specific conflicts.
      *   **Prediction:** The *nevasaññānāsaññāyatana* case.
      *   **Advice on Overturning:** If the user insists on a *metaphysical* asymmetry in branching, they must abandon the no-self view. If they stick to no-self, the asymmetry must be purely pragmatic.

  10. **Tone Check:** Academic, precise, philosophical, respectful of Abhidharmic technicality (using terms like *santāna*, *bīja*, *prajñapti*). Avoid historical fluff.

  11. **Final Polish:** Ensure the distinction between *vṛtti* (function) and *bīja* (seed) is clear, as that solves the Dementia/Nirodha tension. Ensure the Branching solution relies on *spatiotemporal continuity* vs. *pattern identity*.

  *(Self-Correction during drafting)*: Wait, in classical Abhidharma (Sarvāstivāda/Theravāda), there isn't always an *ālaya-vijñāna*. However, the prompt asks for "Classical Abhidharma" broadly, and the *nirodha* case practically demands a seed-theory (Sautrāntika or Yogācāra) to explain continuity without consciousness. I should frame the solution using the *bīja* (seed) metaphor which is compatible with Sautrāntika/Yogācāra developments within the Abhidharmic tradition, as a pure Theravāda *bhavaṅga* or Sarvāstivāda *prāpti* might be too specific. I will use the generic "causal seed" (*bīja*) terminology which is the conceptual bridge.

  Let's refine the Branching verdict. The user says "I choose the original." This implies a first-person concern. In a no-self view, "I choose" is just a momentary preference arising in the original stream. The copy's stream has a different preference. There is no *cross-stream* identity. So the "asymmetry" is just the fact that *this* current stream cares about *its* immediate future, not a duplicate. I need to make sure this is clear.

  Okay, ready to write.
answer: |-
  Here is a conceptual architecture designed to capture your six verdicts within a coherent Abhidharmic framework, resolving the tensions between them without positing a substantial self (*pudgala*).

  ### The Principle: Causal-Seed Continuity with Pragmatic Imputation

  This architecture relies on a strict distinction between **Ultimate Causal Succession** (*santāna*) and **Conventional Personhood** (*prajñapti-sat*). It introduces a third mediating category: **Latent Causal Potential** (*bīja-śakti*).

  **Axiom 1 (Ultimate Ontology):** There is no diachronic identity. There are only momentary dharmas arising and ceasing in causal dependency. "Survival" is ultimately a false category; only "causal succession" exists.

  **Axiom 2 (The Seed Condition):** Continuity of a conventional person requires the preservation of *latent causal seeds* (*vāsanā/bīja*) capable of regenerating specific psychological functions (memory, volition, character). Manifest activity (*vṛtti*) may cease, provided the seeds remain intact and accessible.

  **Axiom 3 (Pragmatic Imputation):** Conventional identity is imputed onto a causal stream based on **spatiotemporal uninterruptedness** and **social-moral utility**. Where causal streams bifurcate, imputation follows the path of immediate spatiotemporal continuity, not pattern similarity.

  ---

  ### Resolution of Your Verdicts

  Here is how the three clauses of the Principle map onto your six cases and resolve the tensions.

  #### 1. Destructive Teletransportation (Verdict: Conventional Survival)
  *   **Applied Clause:** Axiom 2 (Seed Condition).
  *   **Analysis:** Although the material substrate is destroyed, the informational pattern acts as an efficient cause to instantiate the *seeds* in a new substrate. Because the causal chain is singular (no branching) and the seeds for memory/volition are re-instantiated, the *santāna* is considered unbroken for conventional purposes.
  *   **Ultimate Status:** No entity traveled. A new moment arose caused by the scan-data of the old moment.

  #### 2. Non-Destructive Branching (Verdict: Asymmetry without Self)
  *   **Applied Clause:** Axiom 3 (Pragmatic Imputation).
  *   **Analysis:** This resolves your tension between (1) and (2). In (1), the causal line is singular. In (2), it bifurcates.
      *   **Metaphysics:** Neither stream is "the self." Both are equally valid causal continuations.
      *   **The Asymmetry:** Your preference for the original is not a metaphysical insight but a **indexical pragmatic fact**. The current stream of consciousness (the pre-scan you) is spatiotemporally continuous with the post-scan original, but *causally distant* from the copy. The "I" that chooses is a momentary dharma in the original stream; it naturally prioritizes its immediate causal successor (the original body) over a duplicated effect (the copy).
      *   **Why no Self?** You are not smuggling in a self; you are acknowledging that *concern* is local to the current causal stream. The copy will have its own local concern. There is no "view from nowhere" that must treat them equally.

  #### 3. Split-Brain Separation (Verdict: Two Streams Revealed)
  *   **Applied Clause:** Axiom 1 (Ultimate Ontology) & Axiom 3 (Imputation).
  *   **Analysis:** Abhidharma denies a unitary controller (*svāmin*). The "unity" prior to surgery was a conventional imputation over two loosely coupled streams. When coupling breaks, the imputation splits. There is no tragedy of division because there was no prior unity to divide.

  #### 4. Severe Progressive Dementia (Verdict: Person Lost)
  *   **Applied Clause:** Axiom 2 (Seed Condition).
  *   **Analysis:** This resolves the tension with (5). In dementia, the degradation is not merely of manifest function (*vṛtti*) but of the **seeds** (*bīja*) themselves. The neural/karmic capacity to retrieve memory or sustain character is corrupted. The causal potential to resume the "person" is destroyed. Thus, the conventional imputation fails. The biological stream continues, but the *person*-stream has terminated.

  #### 5. Nirodha-samāpatti (Verdict: Person Survives)
  *   **Applied Clause:** Axiom 2 (Seed Condition).
  *   **Analysis:** In *nirodha*, manifest consciousness ceases, but the **seeds are preserved** in a subliminal carrier (in Yogācāra, the *ālaya-vijñāna*; in Sautrāntika, the material basis/*bīja*). Because the seeds remain intact and *accessible* upon emergence, the causal potential is uninterrupted. The interruption is in *function*, not *capacity*. Hence, the conventional person survives.
  *   **Contrast with Dementia:** Dementia = Seeds destroyed. Nirodha = Seeds dormant.

  #### 6. Post-Traumatic Moral Transformation (Verdict: Ultimate Disownership, Conventional Responsibility)
  *   **Applied Clause:** Axiom 1 (Ultimate) & Axiom 3 (Pragmatic).
  *   **Analysis:**
      *   **Ultimate:** The monk is correct; there is no metaphysical owner linking the child-aggregates to the adult-aggregates.
      *   **Conventional:** Karmic liability follows the causal stream, not the metaphysical self. Since the adult stream arose from the child stream (seeds transmitted), the adult inherits the karmic debt, just as one inherits a debt from a predecessor in a business lineage, even if the staff and location change.

  ---

  ### Resolution of Specific Tensions

  **Tension 1: (1) vs. (2) (Teleport vs. Branching)**
  *   **Diagnosis:** You feared that accepting (1) forces you to accept the copy in (2) as "you."
  *   **Solution:** The Principle distinguishes **Causal Uniqueness** (1) from **Causal Multiplicity** (2). In (1), the original stream terminates, but its causal power is transferred uniquely. In (2), the original stream *continues*. Conventional identity tracks the *continuation* of the immediate antecedent condition (*samanantara-pratyaya*). The copy is a *result*, not a *continuation*. Your asymmetry is the natural preference of a causal stream for its own immediate succession.

  **Tension 2: (4) vs. (5) (Dementia vs. Nirodha)**
  *   **Diagnosis:** You feared that physical embodiment was doing hidden work, or that mental cessation should equal death.
  *   **Solution:** The differentiator is **Seed Integrity**, not aggregate presence.
      *   In *Nirodha*, the body is maintained by vital functions (*āyuṣ*), and seeds are held in suspension. The causal link is *paused*.
      *   In Dementia, the body is maintained, but the seeds are *eroded*. The causal link is *severed*.
      *   Physical embodiment is necessary but not sufficient; it is the *preservation of karmic seeds within the embodiment* that matters.

  ---

  ### Prediction: The Test Case
  **Scenario:** A practitioner enters the attainment of **Neither-Perception-Nor-Non-Perception** (*nevasaññānāsaññāyatana*) for an extended period. Mental activity is reduced to a minimal, undifferentiated residue. They emerge with intact autobiographical memory.

  **Verdict:** **The stream survives conventionally and ultimately (as a continuum).**

  **Reasoning:**
  1.  **Seed Integrity:** Unlike *nirodha*, this state is not a cessation of consciousness (*nirodha*), but a subtlety of consciousness. The seeds are not just preserved; they are *actively (though subtly) functioning*.
  2.  **No Interruption:** Unlike *nirodha*, there is no break in the manifest stream of consciousness, however attenuated.
  3.  **Imputation:** Because the causal link is unbroken and the seeds for autobiographical memory are actively (if dimly) maintained, the conventional imputation of personhood remains robust.
  4.  **Abhidharmic Nuance:** In this state, *asmi-māna* (the conceit "I am") is not fully eradicated (that occurs only at Arhatship). Therefore, the *illusion* of self is still operational. The Principle predicts that the practitioner will emerge feeling continuous with the pre-attainment self, and socially/conventionally, they are the same person. There is less ground for "person loss" here than in *nirodha*, and far less than in dementia.

  ---

  ### Critical Advice: Which Verdict to Overturn?

  If you find this architecture unsatisfying, the weak point is **Verdict 2 (Branching Asymmetry)**.

  **The Problem:** If you are a strict Reductionist (Parfitian/Abhidharmic), the "preference for the original" in the branching case is biologically explicable but metaphysically empty. If you claim there is a *fact of the matter* that the original is "really me" and the copy is not, you have violated Axiom 1 (No diachronic identity).

  **Recommendation:**
  *   **Keep the Architecture:** If you can accept that the "asymmetry" is purely **indexical and pragmatic** (i.e., "This stream cares about its immediate successor, not its duplicate"), keep all six verdicts. This is consistent with the *Sautrāntika* view of seeds and momentariness.
  *   **Overturn Verdict 2:** If you feel the asymmetry must be **metaphysical** (i.e., "The original retains my identity in a way the copy fundamentally cannot, regardless of psychology"), you must abandon the Abhidharmic no-self framework. That intuition relies on a *haeccity* or "thisness" that Abhidharma explicitly denies.

  **Final Instruction:** To maintain doctrinal purity, interpret your preference in Case 2 not as "I survive in the original," but as "The causal stream currently thinking this thought is spatiotemporally continuous with the original body." The copy is a *sibling* stream, not a *successor* stream. This preserves the no-self view while validating your intuition.
