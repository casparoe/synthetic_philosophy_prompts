      *   **User Profile:** 2nd-year PhD in Machine Learning (ML). Focus: Identifiability in latent variable models.
      *   **Vocabulary:** Training/deployment distributions, model classes, inductive biases, regularisation, test loss, latent structure, generalisation under shift, simplicity biases.
