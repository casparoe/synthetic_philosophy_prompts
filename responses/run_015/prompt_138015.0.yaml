answer: |-
  The concept you are looking for is **Belief Fragmentation** (sometimes called **Doxastic Fragmentation**).

  In cognitive science and epistemology, this is the structural alternative to the computational view of bounded rationality. While "Logical Omniscience" problems typically focus on the *cost* of deriving consequences (computation), Belief Fragmentation focuses on the *architecture* of the belief state itself (storage and access).

  Here is the carving you requested, followed by the verdict on your cases and the required confidence metrics.

  ### The Concept: Belief Fragmentation

  **Definition:**
  Belief Fragmentation posits that an agent's belief state is not a single, globally consistent set of propositions (as classical logic assumes), but is instead partitioned into multiple, context-bound "fragments" or "compartments."
  1.  **Existence:** A proposition $P$ can be believed in Fragment A but not accessible in Fragment B.
  2.  **Inference:** Logical inference operates freely *within* a fragment but fails *across* fragments unless a bridging context is provided.
  3.  **Retrospective Endorsement:** Because the belief *does* exist in the agent's mind (in Fragment A), the agent sincerely claims "I knew that" once the fragments are merged or bridged. They are not lying about their prior state; they are reporting on the existence of the belief in the now-accessible fragment.

  **The Mechanism of Cure (Re-encoding):**
  The reason re-encoding fixes the failure is that it forces **Context Reinstatement**. By presenting the two facts in a unified vocabulary or visual layout, you force the cognitive system to load both propositions into the *same* active fragment. Once they share a fragment, the trivial inference fires immediately. This is closely related to the **Encoding Specificity Principle** in memory research: retrieval fails not because the trace is lost, but because the cue (the question) does not match the encoding (the context in which the fact was stored).

  ### Distinctions from Neighboring Notions

  1.  **Vs. Logical Omniscience / Bounded Rationality:**
      *   *Standard View:* The agent fails to believe $Q$ (where $P \to Q$) because deriving $Q$ is too computationally expensive or long.
      *   *Fragmentation View:* The derivation is trivial (one step). The failure is architectural. The agent possesses $P$ and $P \to Q$, but they reside in non-communicating partitions. Lowering the computational cost does not help; merging the partitions does.
      *   *Boundary:* If giving the agent more time or compute solves it, it's Bounded Rationality. If showing them the facts side-by-side solves it, it's Fragmentation.

  2.  **Vs. Ignorance:**
      *   *Ignorance:* The belief is not present in the system.
      *   *Fragmentation:* The belief is present but isolated. The "I knew it all along" claim is the diagnostic marker. An ignorant student says, "Oh, I see, that makes sense." A fragmented student says, "Oh, right, I knew that."

  3.  **Vs. Memory Retrieval Failure:**
      *   *Standard Memory Failure:* The trace is degraded or lost over time.
      *   *Fragmentation:* The trace is intact. The cue is mismatched. Standard memory failure is often time-dependent; fragmentation is context-dependent. (Your student didn't need time; they needed the vocabulary aligned).

  4.  **Vs. Inert Knowledge:**
      *   *Inert Knowledge:* Knowledge that is acquired but not used.
      *   *Fragmentation:* Explains *why* it is inert. It is inert because it is compartmentalized. "Inert" describes the symptom; "Fragmentation" describes the cause.

  ### Verdict on Your Three Instances

  1.  **The Student (Math):** **Definite Instance.**
