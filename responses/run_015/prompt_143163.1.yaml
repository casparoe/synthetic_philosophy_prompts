  *(Self-Correction during drafting)*: I initially thought about bringing in Habermas. *Correction:* User said skip the reading list. Keep the concepts (Input/Output) without name-dropping too much theory unless it's structural. Focus on the *mechanics* of the deficit. Make sure to emphasize the *timing* of the Greek Parliament vote *after* the Eurogroup ultimatum. That's key for the "ratification" argument.

  *(Refining the MMT angle)*: The roommate says it's national democracies exporting costs. I need to point out that Greece *couldn't* export costs because it lacked monetary sovereignty. That's the MMT blind spot in her argument. She treats Greece like a currency issuer in the analysis of coercion, but the coercion existed *because* they weren't.

  *(Final check on "Democracy Working")*: To argue this was democracy working, one must argue that the *prior* commitment (Treaties) binds the *current* majority. That's a Madisonian/Constitutionalist view, not a majoritarian one. I need to make that explicit.

