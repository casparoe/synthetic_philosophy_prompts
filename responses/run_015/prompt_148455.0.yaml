answer: |-
  This is a fantastic framing. You are essentially asking for a translation of the "linguistic turn" in history into the epistemology of experimental physics. As a condensed-matter physicist, you are well-equipped to understand that data never speaks for itself; it always speaks through a Hamiltonian, a boundary condition, or an effective field theory.

  Here is the residue report on translating Ranke, Carr, and White into the vocabulary of measurement, calibration, and modeling.

  ### 1. Ranke: The Zero-Error Limit
  **The Claim:** *Wie es eigentlich gewesen* ("how it actually was").
  **Physics Translation:** The belief in the **$\lim_{\epsilon \to 0}$ of Systematic Error.**

  Ranke operates under the assumption that the "signal" (the past) exists independently of the "detector" (the historian/archive). He believes that through rigorous archival methodology (calibration), source criticism (noise reduction), and suppressing the self (removing observer bias), one can approach the "True Value" of the historical event.

  *   **In your lab:** This is the belief that if you shield your experiment well enough, calibrate your voltmeters precisely enough, and account for thermal drift, you can measure the *actual* resistance of the sample, not just the resistance-as-measured-by-you.
  *   **The Assumption:** The "View from Nowhere" is an asymptote you can approach arbitrarily closely. The past is a stable state vector; the historian is just trying to measure its eigenvalues without collapsing the wavefunction.

  ### 2. E.H. Carr: Selection Bias and Experimental Design
  **The Claim:** Facts are like fish in the ocean; the historian chooses which to catch based on the questions of the present.
  **Physics Translation:** **Data Cuts and Trigger Conditions.**

  Carr argues that there are infinitely more "facts" (data points) than can be recorded. The historian must apply "cuts."
  *   **In your lab:** When you run a scattering experiment, you don't record every particle. You set a trigger threshold. You apply $p_T$ cuts. You discard background noise.
  *   **The Divergence:** In physics, you justify cuts to maximize signal-to-noise ratio based on a *universal* theory (e.g., Standard Model predictions). Carr argues that in history, the "trigger condition" is determined by the **sociological state of the detector** (the present day).
  *   **The Drift:** Carr's point is that the calibration of the instrument drifts with time. A 19th-century historian measures "Great Men" because their theoretical framework values agency. A 20th-century Marxist historian measures "Class Structures" because their framework values material conditions.
  *   **Is it Experimental Design?** Yes, but with a catch. In physics, experimental design aims to *minimize* dependence on the observer. Carr argues historical design *inherently encodes* the observer's temporal location. You cannot blind the analysis to the year the analysis is performed.

  ### 3. Hayden White: Emplotment vs. Modeling
  **The Claim:** Historians impose narrative structures (Romance, Tragedy, Comedy, Satire) on the data to make it intelligible.
  **Physics Translation:** **Model Selection vs. Gauge Fixing.**

  This is the hardest translation. You asked if emplotment is like picking a theoretical model.
  *   **Similarities:** In condensed matter, you look at a phase transition. You can model it using Landau-Ginzburg theory (mean field) or Renormalization Group flow (scaling). Both fit the data, but they offer different "stories" about what is happening (order parameter vs. fluctuations).
  *   **The Difference (The Residue):** In physics, the model is constrained by **predictive power** and **falsifiability**. If the Tragedy Model predicts a specific heat capacity that isn't measured, you dump the model.
  *   **White's Point:** Emplotment is not a predictive model; it is a **moral/aesthetic boundary condition**.
      *   If you emplot the French Revolution as a *Tragedy*, the data points (executions, terror) are weighted as "inevitable downfall."
      *   If you emplot it as a *Comedy* (in the Dantean sense of a happy resolution), the same data points are weighted as "growing pains toward liberty."
      *   **Crucially:** Both emplotments can accommodate the *same empirical data*. In physics, two models that fit the same data are usually considered effective theories of the same underlying reality, or one is discarded. In White's history, the choice of emplotment is **underdetermined by the data**. It is a choice of *meaning*, not just *causality*.

      **Verdict:** Emplotment is weirder than model selection. It is closer to choosing a **coordinate system** that dictates the *moral metric* of the space, not just the geometry. In physics, changing coordinates doesn't change the physics. In White's history, changing the emplotment changes the *truth value* of the event's meaning.

  ### The Residue Report: What Translates and What Doesn't

  | Concept | Physics Analog | Translation Fidelity | Notes |
  | :--- | :--- | :--- | :--- |
  | **Ranke's Objectivity** | Ideal Measurement ($\epsilon \to 0$) | **High** | Physicists believe this is a regulative ideal, even if unattainable. Ranke thought it was a methodological duty. |
  | **Carr's Fact Selection** | Data Cuts / Trigger Logic | **Medium** | In physics, cuts are technical. In history, Carr says cuts are ideological. The *mechanism* is the same; the *justification* differs. |
  | **Theory-Ladenness** | Model-Dependent Realism | **High** | You can't see a "phonon" without the lattice model. Historians can't see a "Revolution" without a political model. Kuhn applies to both. |
  | **White's Emplotment** | Model Selection | **Low** | Physics models aim for prediction/universality. Emplotment aims for *narrative closure* and *moral resolution*. |
  | **Reproducibility** | Repeated Trials | **None** | **This is the hard break.** Physics relies on universality (this electron = that electron). History deals with singularities (The French Revolution happens once). |

  ### The "Unique Event" Problem (The Hard Break)

  You asked if the disagreement is mostly about unique events. **Yes.** This is the biggest gap in the vocabulary translation.

  In condensed matter, we assume **universality**. A superconductor in Tokyo behaves like a superconductor in Toronto. We can reproduce the state. This allows us to separate "instrument error" from "sample property."

  In history, the sample is destroyed by the measurement. The French Revolution is a **single-shot experiment**.
  *   **Ranke** treats the archives as if they are repeated measurements of the same event.
  *   **Carr/White** argue that because you cannot re-run the experiment, you cannot separate the "systematic error" (the historian's bias) from the "signal" (the event).

  In physics, if you have a systematic error, you can eventually find it by changing the apparatus. In history, you cannot change the apparatus (you are always a human in the present looking at traces in the past). Therefore, Carr and White argue, the "error" is a feature, not a bug.

  ### Is Ranke Chasing Impossible Calibration?

  From your perspective: **Yes, but with nuance.**

  Ranke was chasing a **Correspondence Theory of Truth** (statements match reality).
  Carr and White are arguing for a **Coherence Theory of Truth** (statements fit within a consistent narrative framework).

  *   **Ranke:** "Is this statement true relative to the past state?"
  *   **White:** "Is this statement true relative to the narrative structure required to make the past intelligible to the present?"

  **The Missing Vocabulary:**
  Your physics vocabulary lacks a term for **Normativity**.
  *   In physics, a model is better if it predicts better.
  *   In White's history, a narrative is "better" if it provides better *moral orientation* for the present.
  *   When White says the historian chooses "Tragedy" over "Comedy," he isn't saying they chose the wrong Hamiltonian. He is saying they chose a different **moral metric**. Physics has no equivalent for this. We do not ask if the Ising Model is "tragic."

  ### Summary for the Physicist

  1.  **Ranke** believes systematic error can be eliminated. He is a **Naive Realist**.
  2.  **Carr** believes systematic error is unavoidable because the detector (historian) is part of the system (society). He is a **Critical Realist**.
  3.  **White** believes the "data" is constituted by the model (emplotment) chosen to explain it. He is a **Constructivist**.

  **The Verdict:**
  Carr's claim about fact selection maps cleanly to **experimental design**, provided you accept that in history, the design parameters are socially determined rather than technically determined.

  White's claim about emplotment **does not map** cleanly to model selection. In physics, models are discarded if they fail to predict. In history, emplotments are retained because they satisfy a *literary* or *moral* need, not just an empirical one. This is the "weirder" part you sensed. It implies history is less like condensed matter and more like **thermodynamics applied to meaning**, where the "entropy" of the past is reduced into the "order" of a story, and that reduction process inevitably loses information (the "actual" past) to create structure (the narrative).

  Ranke wasn't just chasing perfect calibration; he was chasing a view of history as a **conservative system** (energy/information preserved). Carr and White argue history is a **dissipative system**: energy (meaning) is added by the historian to create order (narrative) out of the chaos (archives). You cannot measure the chaos without adding the energy.
