          *   *Biological vs. Logical:* Does the physical body matter more than the psychological continuity? Ayer leans psychological (Humean), but requires spatio-temporal location. Cryonics offers the body, but does it offer the *same* person if the mind is rebooted?
          *   *Verification:* Can we verify the revived person has the *same* experiences, or just memories of them?
