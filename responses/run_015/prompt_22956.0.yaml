      *   *Section 5: Where he is vulnerable.* 1. The Sleep/Coma Analogy (if sleep doesn't kill me, why does freezing?). 2. The "Meaningfulness" of Survival (if he concedes WBE is survival, he concedes naturalistic immortality is possible, weakening his anti-religious stance). 3. The First-Person Perspective (Verificationism struggles with the subjective 'what it is like' which is central to survival).

