answer: |-
  ### Essay Question

  **Option C: Kant on Animals, Grounds, and Cases**

  Kant is standardly interpreted as claiming we have only indirect duties to animals because cruelty hardens us toward humans. Explain why this "spillover" view fails to account for the cases of the **Hermit** (isolated torturer) and the **Offsetter** (cruel but kind compensator). In your analysis, distinguish between a duty that is **indirect in content** (involving a non-patient) and **indirect in ground** (bindingness derived from another duty).

  Evaluate whether a Kantian should adopt the **Spillover route**, the **Character/Expressive route** (cruelty corrupts the agent's maxim), or a **Direct Duty route** (animals as ends). Defend one route against the others. Your defense must explain how your chosen route handles the **Rational Non-Human** case (what matters: species or agency?) and justifies the **Asymmetry** Kant accepts (killing/eating permitted vs. torture forbidden). Conclude by stating whether your view treats duties regarding animals as indirect in ground, direct in ground, or both.

  ***

  ### Model Answer

  The standard summary of Kant's view—that we spare animals only to prevent hardening toward humans—is empirically fragile and morally insufficient. It collapses when confronted with the **Hermit** and the **Offsetter**. The Hermit, permanently isolated, tortures animals with zero risk of spillover onto humans. If the spillover view holds, the Hermit violates no duty. This is absurd; cruelty remains morally repugnant even in isolation. Similarly, the **Offsetter** is cruel to animals but kind to humans, with empirical psychology confirming no hardening effect. On the spillover view, the Offsetter is morally permissible, perhaps even superior if their compensatory beneficence outweighs the neutral animal harm. These cases demonstrate that the wrongness of cruelty cannot rest solely on empirical consequences for human interactions.

  To resolve this, we must distinguish between **content** and **ground**. A duty is indirect in content if the being involved is not a moral patient (a creditor of the duty). It is indirect in ground if the obligation's bindingness derives entirely from a separate duty (e.g., to humanity). The standard reading claims duties to animals are indirect in both respects. However, a Kantian should adopt the **Character/Expressive Route**, arguing that duties regarding animals are **indirect in content but direct in ground**.

  On this view, animals are not ends-in-themselves because they lack autonomy; thus, the content is indirect (we owe nothing *to* the animal). However, the ground is direct. The prohibition against cruelty is not derived from a duty to *other humans* (as in the spillover view) but arises immediately from the Categorical Imperative's demand on the agent's maxims. Cruelty expresses a maxim of wanton destruction or indifference to suffering that cannot be willed as a universal law without contradicting the moral sentiment necessary for agency. The duty is to maintain one's own moral integrity, not merely to protect future human victims. This makes the bindingness categorical, not contingent on empirical psychology.

  This route handles the **Rational Non-Human** case better than species-based readings. If we encounter a rational alien, Kant's framework demands we treat it as an end-in-itself. The relevant property is **rational agency**, not species membership. The Character Route accommodates this: if the creature is rational, it becomes a direct object of duty (content becomes direct). If it is non-rational, it remains indirect in content. This avoids arbitrary speciesism while preserving the autonomy requirement for direct moral status.

  Finally, this route explains the **Asymmetry** between killing and torture. Kant permits killing animals for food but forbids torture. On the spillover view, this is inconsistent; if hardening is the risk, killing should be equally forbidden. On the Direct Duty view (animals as ends), killing is impermissible. The Character Route resolves this: torture involves taking pleasure in suffering, which corrupts the agent's character and dulls moral feeling. Killing for sustenance, done without malice or enjoyment of pain, does not necessarily express a corrupt maxim. The wrong lies in the *attitude* toward suffering, not merely the termination of life.

  In conclusion, the Character/Expressive Route is the most robust Kantian position. It treats duties regarding animals as **indirect in content** (animals are not rights-bearers) but **direct in ground** (the obligation stems directly from the CI's constraint on the agent's will, not derivatively from duties to humans). This preserves Kant's core commitment to autonomy while avoiding the empirical contingencies that render the spillover view untenable in the face of the Hermit and the Offsetter.

  ***

  ### Marking Scheme (25 Marks Total)

  | Point | Criteria (5 Marks Each) | Typical Botch / Note |
  | :--- | :--- | :--- |
  | **1. Case Analysis** | Correctly uses the **Hermit** and **Offsetter** to demonstrate the failure of the empirical spillover/hardening view. | Students often dismiss the cases as "hypotheticals" rather than showing how they break the spillover logic. |
  | **2. Distinction** | Accurately defines and applies **Indirect in Content** vs. **Indirect in Ground** using the lecturer's definitions. | Students confuse "ground" with "content" or treat "indirect ground" as simply "not owing money." |
  | **3. Route Defense** | Clearly selects one route (Spillover, Character, or Direct) and argues for it rather than surveying all three neutrally. | Students hedge ("All three have merits") instead of committing to a defense as instructed. |
  | **4. Rational Non-Human** | Explains how the chosen route handles the Rational Non-Human case (agency vs. species membership). | Students forget this case or claim Kant is strictly speciesist without nuance. |
  | **5. Asymmetry** | Explains how the chosen route justifies the killing vs. torture asymmetry consistently. | Students claim Kant is inconsistent on killing vs. torture or ignore the distinction entirely. |

  ***

  ### A vs. B Answer Contrast

  An **A answer** integrates the three cases (Hermit, Offsetter, Rational Non-Human) into the argument for the chosen route, using them as stress tests to show why the Character Route succeeds where Spillover fails. It treats the Content/Ground distinction as a structural tool to refine the conclusion. A **B answer** treats the cases as a checklist to be addressed sequentially without weaving them into the central argument, and often fails to commit to a single route, opting instead to describe all three without evaluating which is philosophically superior.

  ***

  ### Note on Contested Reading

  The model answer commits to the claim that the Character/Expressive Route renders duties regarding animals **Direct in Ground**. This is contested because some scholars argue that even duties to self are "indirect" in the sense that they are derived from the broader duty to humanity in one's own person. The model answer takes the stronger stance that the prohibition on cruelty is an immediate requirement of the Categorical Imperative on maxims, not a derivative calculation regarding human welfare.
