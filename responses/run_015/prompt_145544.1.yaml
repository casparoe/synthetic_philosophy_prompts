prompt: |-
  So there's this long-running standoff between people who treat social norms as Lewis-style conventions -- coordination problems solved by common knowledge -- and people who treat them as evolved stable strategies where no agent represents the rule. The conventionalists keep saying evolutionary accounts miss the normative 'ought', and the evoltionists keep saying conventionalism sneaks in unrealistic rationality. Noone moves. My hunch is that it's not really about mechanisms but about whether we're asking for a justification story or a causal origin story, and both sides are just talking past each other under the word 'norm'. But maybe I'm wrong and there's a hiddne empirical question about whether people actualy compute common knowledge when they follow norms. I want a diagnosis of what kind of disagreement this is -- verbal, substantive, different questions, or bedrock intuitions about rationality -- supported by what each side actualy says. And given that diagnosis, what would count as progress? A model that separates 'commitment norms' from 'coordination norms'? A psychological result? Or should we just admit it's stuck because the concept does too much work? Don't survey every view; figure out the structure of the stall and be honest about whether anything could unstick it.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Deconstruct the User's Query:**
      *   **The Conflict:** Lewis-style Conventionalism (norms as coordination problems solved by common knowledge/representation) vs. Evolutionary Game Theory (EGT)/Social Norms as Evolved Stable Strategies (norms as behavioral regularities without representation).
      *   **The Complaint:** Conventionalists say EGT misses the "ought" (normativity). Evolutionists say Conventionalism assumes unrealistic rationality (cognitive load).
      *   **The User's Hunch:** It's not about mechanisms, but about *explanatory goals* (justification vs. causal origin). They might be talking past each other. Alternatively, there might be a hidden empirical question (do people actually compute common knowledge?).
      *   **The Task:** Diagnose the *structure* of the disagreement (verbal, substantive, different questions, bedrock intuitions). Support this with what each side actually says. Propose what would count as progress (models, psych results, admitting defeat).
      *   **Constraint:** Don't survey every view. Focus on the structure of the stall. Be honest about solvability.

  2.  **Analyze the Two Camps:**
      *   **Lewis-style Conventionalism (e.g., Lewis, Gilbert, Tuomela, maybe Bicchieri):**
          *   *Core:* Norms require mutual belief/common knowledge. "We know that we know..."
          *   *Normativity:* Comes from the expectation and the preference to conform *given* the expectation. It's reason-based.
          *   *Critique of EGT:* Describes *behavior*, not *rules*. A habit isn't a norm. Misses the "ought."
      *   **Evolutionary/EGT (e.g., Skyrms, Alexander, Young, maybe Gintis):**
          *   *Core:* Norms are equilibria selected by dynamics (replicator, learning). Agents need not know *why*, just do what works.
          *   *Normativity:* Functional stability. "Ought" is hypothetical (if you want to survive/succeed, do this).
          *   *Critique of Lewis:* Cognitive overload. People don't compute common knowledge. It's intellectualizing instinct/habit.

  3.  **Evaluate the User's Hunch (Justification vs. Causal Origin):**
      *   This is strong. Conventionalists often care about *why it is rational/reasonable* to follow the norm (justification). Evolutionists care about *how the pattern emerged and persists* (etiology).
      *   *However*, both sides claim to be explaining "social norms." If the concept of "social norm" is the battleground, is it verbal?
      *   *Refinement:* It's not *just* verbal. It's a clash over the *necessary conditions* for the concept. Is representation necessary? If yes, EGT fails. If no, Lewis is too narrow.

  4.  **Diagnose the Disagreement Structure:**
      *   *Is it Verbal?* Partly. They define "norm" differently. One says "rule + expectation," the other says "stable regularity + sanction." But they both point to roughly the same phenomena (driving on the right, tipping, queuing). So it's not *purely* verbal.
      *   *Is it Substantive?* Yes. It's about cognitive architecture. Do humans need to represent the rule to be following a norm?
      *   *Is it Explanatory Goals?* Yes. One seeks rational reconstruction, the other causal mechanism.
      *   *Best Diagnosis:* **A Category Mistake disguised as a Mechanism Debate.** They are optimizing for different explanatory virtues. Conventionalists optimize for *Normative Force* (why does it bind me?). Evolutionists optimize for *Ontological Parsimony* (how does this exist without magic?).
      *   *The "Bedrock" Issue:* It's about the **Location of Normativity**. Is it in the head (representation) or in the structure (consequences)?

  5.  **Assess the "Hidden Empirical Question":**
      *   User asks: "Do people actually compute common knowledge?"
      *   *Answer:* Probably not in the strict logical sense. But they simulate it via heuristics.
      *   *Relevance:* Even if psych shows people *don't* compute CK, Conventionalists can say "They *should* to be rational" or "They act *as if*." So empirical data might not kill the philosophical dispute.

  6.  **Determine Paths to Progress:**
      *   *Model Separation:* Distinguishing "Coordination Norms" (Lewis) from "Cooperation Norms" (EGT/Prisoner's Dilemma). This helps. Lewis was about coordination. EGT often tackles cooperation.
      *   *Psychological Results:* Dual-process theory. System 1 (EGT-like habit) vs. System 2 (Lewis-like reasoning). Norms might start as EGT and become Lewisian when challenged.
      *   *Admitting Defeat:* The concept "Social Norm" is a folk category that lumps distinct mechanisms. We might need to dissolve it.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Validate the user's hunch. It's largely about explanatory goals, but there's a substantive stake regarding cognitive architecture.
      *   *Diagnosis:* It's a **Teleological Mismatch**. Conventionalists explain *validity* (why follow?). Evolutionists explain *viability* (why persist?).
      *   *Evidence:* Cite the specific complaints (Ought vs. Rationality).
      *   *The Empirical Angle:* Address the "common knowledge" computation. It's a red herring because Lewisianism is often normative, not descriptive.
      *   *Progress:*
          1.  **Typology:** Separate *Constitutive* norms (require representation) from *Regulative* habits (don't).
          2.  **Hybrid Models:** Bicchieri's work is key here (empirical expectations + normative expectations).
          3.  **Dissolution:** Admit "Norm" is a cluster concept.
      *   *Honest Conclusion:* It won't be fully "unstuck" because it touches on the Is-Ought gap. But we can stop them from shouting past each other.

  8.  **Refining the "Diagnosis":**
      *   Avoid saying it's *just* verbal. That's too dismissive.
      *   Avoid saying it's *purely* empirical. That ignores the philosophy.
      *   *Key Insight:* The stall is caused by **conflating the genealogy of a norm with its binding force.**
      *   Evolutionists explain genealogy. Conventionalists explain binding force. They think they are fighting over the *object*, but they are fighting over the *explanandum*.

  9.  **Final Polish:** Check tone. Needs to be analytical, sharp, not textbook-ish. Use the user's terminology ("Lewis-style", "EGT", "common knowledge"). Ensure the "Progress" section is concrete. (Self-Correction: Make sure to mention Cristina Bicchieri, as she bridges this gap explicitly).

  10. **Final Structure:**
      *   Diagnosis: Teleological Mismatch (Genealogy vs. Validity).
      *   The Empirical Red Herring.
      *   Pathways to Progress (Typology, Hybrid, Dissolution).
      *   Verdict: Partial solvability.

