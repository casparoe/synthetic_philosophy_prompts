answer: |-
  Your hunch is largely correct, but it misses one substantive stake that keeps the fight alive. The disagreement is primarily a **Teleological Mismatch** (explanatory goals) disguised as a **Mechanism Dispute** (cognitive architecture). However, it is not *merely* verbal, because both sides claim their account is necessary for the phenomenon to count as a "norm" at all.

  Here is the diagnosis of the stall, the role of the empirical question, and the only viable paths to progress.

  ### 1. The Diagnosis: Genealogy vs. Validity
  The standoff persists because the two camps are answering different questions while using the same noun ("norm").

  *   **The Evolutionists (e.g., Skyrms, Young, Gintis)** are telling a **Causal/Genealogical Story**. They ask: *How did this behavioral regularity emerge and stabilize without a central planner?* Their metric of success is **viability**. If a strategy is evolutionarily stable, it explains the *existence* of the pattern. When they say Conventionalists are "unrealistic," they mean: "Your mechanism (common knowledge reasoning) is causally insufficient to explain the historical emergence of the behavior."
  *   **The Conventionalists (e.g., Lewis, Gilbert, Tuomela)** are telling a **Justificatory/Validity Story**. They ask: *What makes this regularity a rule rather than a mere habit?* Their metric of success is **normative force**. If agents don't represent the rule, it's just convergent behavior (like deer grazing in the same clearing). When they say Evolutionists miss the "ought," they mean: "Your mechanism explains the *is*, but fails to capture the *bindingness* that distinguishes norms from instincts."

  **The Structure of the Stall:**
  It is a **Category Error**. Evolutionists are treating norms as *equilibria* (states of the world). Conventionalists are treating norms as *reasons* (states of the mind).
  *   When an Evolutionist says, "Norms are stable strategies," the Conventionalist hears, "Norms are habits."
  *   When a Conventionalist says, "Norms require common knowledge," the Evolutionist hears, "Norms require hyper-rational calculation."

  They are talking past each other because one side is defining the *ontological status* of the norm (it exists in the payoff structure), and the other is defining the *phenomenological experience* of the norm (it exists in the mutual recognition).

  ### 2. Is there a Hidden Empirical Question?
  You asked: *Is there a hidden empirical question about whether people actually compute common knowledge?*

  **Verdict:** No, resolving this empirically will not unstick the debate.

  **Why:**
  1.  **Lewisianism is often normative, not descriptive.** David Lewis himself was ambiguous on whether agents *actually* reason through the infinite recursion of common knowledge or simply act *as if* they do. Conventionalists can retreat to a "rational reconstruction" stance: "Even if brains don't compute CK, CK is the condition under which following the norm is *rational*." Psychological data showing people use heuristics doesn't falsify the claim that CK is the *justification* for the norm.
  2.  **Evolutionists don't need zero cognition.** Modern EGT (like learning models) allows for cognition, just not *common knowledge* cognition. Showing people use "level-1 reasoning" doesn't vindicate Lewis; it just shifts the evolutionary model slightly.

  The empirical question is a red herring because the Conventionalist can always say, "You explained the behavior, but you haven't explained the *obligation*." No fMRI scan can locate an "ought."

  ### 3. What Would Count as Progress?
  To unstick this, we must stop trying to find the *one true theory of norms* and acknowledge that "social norm" is a folk category lashing together distinct phenomena. Progress requires **disaggregation**.

  #### A. A Typology of Norms (The "Commitment" vs. "Coordination" Split)
  Progress looks like admitting there are two different things here.
  *   **Type 1: Coordination Conventions (Lewisian).** Driving on the right, which side of the sidewalk to walk on. These *do* rely heavily on mutual expectations. If I don't know you know I'm driving on the right, I panic. Here, the Conventionalist is right: representation matters.
  *   **Type 2: Cooperation/Proscriptive Norms (Evolutionary).** Don't steal, share food, punish free-riders. These often persist *against* individual interest. Here, the Evolutionist is right: common knowledge isn't enough to sustain these; you need sanctions, internalization, or group selection dynamics.

  **Progress Metric:** A model that explicitly states: *"For Coordination Problems, Common Knowledge is the mechanism. For Cooperation Problems, Evolutionary Stability is the mechanism."* If a theorist tries to apply one to the other, they are flagged as overreaching.

  #### B. The "Empirical Expectations" Bridge (Bicchieri's Move)
  Cristina Bicchieri has done the most work to unstick this. She distinguishes between:
  *   **Empirical Expectations:** I believe others will do X.
  *   **Normative Expectations:** I believe others think I *ought* to do X.

  Her research suggests that for a norm to be active, agents need *both*, but they don't need full Lewisian common knowledge. They need a "threshold" of belief.
  **Progress Metric:** Psychological experiments that manipulate these two expectations separately. If we can show that behavior changes when *Normative Expectations* are primed (even without full common knowledge), it validates a hybrid view: Norms are psychological states triggered by social cues, sustained by evolutionary pressures.

  #### C. Admitting the Concept is "Clustered"
  The most honest progress is admitting that "Social Norm" is a **cluster concept** (like "game" or "art"). There is no single necessary and sufficient condition.
  *   Some norms are internalized (guilt-based).
  *   Some are externalized (shame/sanction-based).
  *   Some are purely coordinative (convenience-based).

  **Progress Metric:** The field stops publishing papers titled "The Theory of Social Norms" and starts publishing "The Dynamics of Proscriptive Norms" vs. "The Logic of Coordinative Conventions."

  ### 4. Can it be Fully Unstuck?
  **Honest Answer:** No, not completely.

  The stall is ultimately fueled by the **Is-Ought Gap**.
  *   The Evolutionary account is naturalistic (Is).
  *   The Conventionalist account is often proto-deontological (Ought).

  Unless one side concedes that their account is incomplete (e.g., Evolutionists admit they explain stability but not validity; Conventionalists admit they explain validity but not emergence), they will keep talking past each other. The Evolutionist will always see the Conventionalist as mystifying; the Conventionalist will always see the Evolutionist as reducing.

  **The Verdict:**
  Your hunch about "Justification vs. Causal Origin" is the correct diagnosis. The disagreement is **Teleological**.
  *   **To make progress:** Stop asking "What is a norm?" Start asking "What work is this concept doing in this specific model?"
  *   **The specific fix:** Adopt a **Two-Stage Model**.
      1.  **Emergence:** Explained by Evolutionary Game Theory (how the pattern got here).
      2.  **Maintenance/Compliance:** Explained by Conventionalism/Psychology (how agents represent the pattern to themselves to sustain it).

  If theorists treat these as complementary phases rather than rival definitions, the standoff dissolves. If they continue to fight over the definition of the word "norm," it will remain stuck forever, because they are fighting over whether the *cause* or the *reason* gets to own the noun.
