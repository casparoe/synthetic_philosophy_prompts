answer: |-
  ### I. Taxonomy of Theses: From Tautology to Contingency

  The maxim "revolutions devour their children" is not a single proposition but a container for four distinct causal claims. Arranged from the logically trivial to the empirically contested, they are as follows:

  **1. The Tautological Reading**
  *   **Thesis:** A political order that eliminates its own constitutive agents is, by definition, self-consuming.
  *   **Mechanism:** **Semantic Definition.** There is no causal engine; the "devouring" is the criterion for identifying the revolution's self-destruction.
  *   **Scope:** **Universal Empirical Regularity.** Applies to any regime change where founders are purged.
  *   **Meaning of "Devouring":** **Literal Execution/Removal.** It denotes the physical elimination or political ostracization of the specific individuals who initiated the regime.
  *   **Status:** Trivial. It offers no explanation for *why* the elimination occurred, only classifies the event.

  **2. The Structural Reading**
  *   **Thesis:** Revolutionary institutions create a security dilemma that necessitates the elimination of early agents to preserve the new state.
  *   **Mechanism:** **Institutional Path-Dependence.** The vacuum of authority and the mobilization of mass politics create a dynamic where moderate founders become obstacles to the centralization required for regime survival.
  *   **Scope:** **Empirical Regularity.** Posits a recurrent sociological pattern across revolutionary contexts (e.g., Russia 1937, Iran 1981).
  *   **Meaning of "Devouring":** **Institutional Dismantling & Execution.** The structures created by the "children" are dismantled, and the agents are executed because they represent a prior, now inadequate, institutional phase.
  *   **Status:** Plausible but deterministic. It assumes the structure dictates the outcome regardless of individual intent.

  **3. The Ideological Reading**
  *   **Thesis:** Fidelity to an abstract principle (Virtue, the General Will) logically requires the sacrifice of particular representatives who inevitably fail to embody that principle perfectly.
  *   **Mechanism:** **Internal Logic of Ideological Purification.** The gap between the ideal (the Revolution) and the real (the revolutionaries) generates a demand for purity that can only be satisfied by purging the imperfect agents.
  *   **Scope:** **Specific to 1789–1794.** Applies primarily to revolutions driven by universalist moral claims rather than mere power seizures.
  *   **Meaning of "Devouring":** **Symbolic Betrayal & Literal Execution.** Execution is a ritualistic act to cleanse the principle of the agent's corruption.
  *   **Status:** Genuinely Contested. It requires accepting that ideas have causal agency independent of social interests.

  **4. The Contingency Reading**
  *   **Thesis:** The elimination of founders was not necessary but resulted from specific personality clashes, tactical errors, and accidental convergences.
  *   **Mechanism:** **Contingent Betrayal.** There is no "revolution" acting; there are only factions maneuvering. The "devouring" is a byproduct of winner-take-all politics, not a systemic feature.
  *   **Scope:** **Specific to 1789–1794.** Denies the maxim is a general rule; it is a retrospective label applied to a specific historical accident.
  *   **Meaning of "Devouring":** **Literal Execution.** Denies the symbolic or structural weight; it is simply political murder.
  *   **Status:** Highly Contested. It undermines the utility of the slogan as an explanatory tool, reducing it to a metaphor for civil war.

  ---

  ### II. Assessment Against Interpretive Frameworks

  This section evaluates how the three dominant historiographical frameworks accommodate these readings and addresses the metaphysical commitment of the slogan.

  | Reading | Class Struggle Framework | Ideology-Driven Framework | Contingency Framework |
  | :--- | :--- | :--- | :--- |
  | **1. Tautological** | **Accommodates.** Views the "children" as a specific class fraction (e.g., Girondin bourgeoisie) discarded by a rising fraction (Jacobin petty bourgeoisie). | **Accommodates.** Accepts the definition but seeks the conceptual reason for the classification. | **Accommodates.** Accepts the description but denies the implication of a unified actor. |
  | **2. Structural** | **Accommodates.** Interprets the mechanism as the escalation of social conflict requiring increased coercion. The "children" represent outgrown social relations. | **Accommodates.** Views the institutional logic as driven by the derivation of power from the "people," which necessitates policing representation. | **Undermines.** Rejects the notion of inevitable structural trajectories. |
  | **3. Ideological** | **Undermines.** Treats ideology as superstructure masking material interest. Rejects the idea that "Virtue" causally executes people; rather, "Virtue" is the language used to justify eliminating rivals. | **Accommodates.** **Best Fit.** Posits that the conceptual content of 1789 (Rousseauian general will) made the Terror intelligible and necessary to the actors. | **Undermines.** Denies that abstract principles possess an internal logic that drives events. |
  | **4. Contingency** | **Undermines.** Denies that class dynamics necessitated the Terror; argues specific decisions by Robespierre or Saint-Just were not determined by class position. | **Undermines.** Denies that ideas have causal power independent of the actors wielding them. | **Accommodates.** **Best Fit.** Treats the "devouring" as a series of discrete political fights without teleology. |

  **The Metaphysical Commitment: Unified Will vs. Competing Factions**
  The slogan "revolutions devour their children" presupposes a metaphysical commitment to the Revolution as a **unified subject** (a "Body" or "Will") capable of turning on itself.
  *   **Class Struggle** reconstructs this without the metaphysics: it is not *the* Revolution eating *its* children, but one class faction eating another. The "Revolution" is a placeholder for the dominant coalition.
  *   **Ideology-Driven** explanations often retain the metaphysics: the "Revolution" (as an Idea) consumes the "children" (the men) because the men are inadequate vessels.
  *   **Contingency** explicitly rejects the metaphysics. There is no "Revolution" to do the devouring; there are only committees, sections, and individuals. To accept the slogan literally is to reify a historical process into an agent.

  ---

  ### III. Conceptual Distinction: Autocannibalism vs. Autoimmunization

  To refine the precision of the slogan, we must distinguish between two biological-political metaphors often conflated in this context.

  **1. Revolutionary Autocannibalism**
  *   **Definition:** The regime consumes its own agents and institutional offspring as a source of energy or to reduce population pressure.
  *   **Logic:** **Resource Depletion.** The revolution runs out of external enemies or resources and turns inward to sustain its momentum. The "children" are fuel.
  *   **Enemy Status:** The enemies are **revealed**. They were always part of the body, but the body is hungry. The destruction is pragmatic, not ontological.

  **2. Revolutionary Autoimmunization**
  *   **Definition:** The regime treats its own founding norms and personnel as foreign pathogens to be expelled in the name of preserving the system's purity.
  *   **Logic:** **Purity/Identity.** The immune system (the Terror/Committee of Public Safety) loses the ability to distinguish "self" from "non-self." It attacks the very cells (revolutionaries) that constitute it because they appear to threaten the *ideal* of the organism.
  *   **Enemy Status:** The enemies are **generated**. They were not enemies until the immune response defined them as such. The destruction is ontological.

  **Application to the Slogan**
  Does "revolutions devour their children" capture autocannibalism or autoimmunization?

  *   **Superficially,** the slogan suggests **Autocannibalism**. It implies a cycle of consumption where the revolution feeds on its own progeny to survive (Reading 2: Structural). This aligns with the view that the Terror was a desperate measure to sustain the war effort and the regime.
  *   **Conceptually,** the slogan functions more accurately as **Autoimmunization** (Reading 3: Ideological). The "children" (Danton, Desmoulins, Hébert) were not destroyed because they were useful fuel, but because they were diagnosed as *corrupting* the Revolution's body. Robespierre did not eat Danton for calories; he excised Danton as a tumor on the "Republic of Virtue."

  **Verdict on Mechanism and Enemy Generation**
  The slogan, when rigorously applied to the French Revolution, captures **Revolutionary Autoimmunization**.
  1.  **Mechanism:** It is not the consumption of resources (autocannibalism) but the expulsion of the "infected self." The mechanism is the **internal logic of ideological purification**.
  2.  **Enemy Status:** This reading necessitates accepting that revolutions **generate** internal enemies rather than merely revealing them. In an autoimmunological model, the "counter-revolutionary" is not necessarily a pre-existing agent of the Old Regime (revealed), but a category produced by the Revolution's own hypersensitivity to deviation (generated).

  **Conclusion**
  If the maxim implies **Autocannibalism**, it is a trivial observation about political entropy (Reading 1 & 2). If it implies **Autoimmunization**, it is a contested claim about the pathological nature of utopian politics (Reading 3). The latter requires the metaphysical commitment that the Revolution possesses a "health" or "purity" distinct from the survival of its agents. Without this commitment, the slogan collapses into the Contingency Reading (Reading 4), where "devouring" is merely a metaphor for factional violence, and the "children" were not eaten by a parent, but killed by rivals.
