  You're treating "counterfeit" as a claim about fraud (lying about what something is) rather than function (doing a job without the necessary costs). A plastic fruit is counterfeit even if labelled "plastic," because it fails the role of fruit (nutrition). Similarly, Sable performs the role of a companion without the stakes that make companionship meaningful.

  More critically, you've collapsed the moral stakes into the AI's status. Dennett's worry isn't that we wrong the machine; it's that we wrong *ourselves*. Engaging with risk-free care atrophies your capacity for real care, which requires vulnerability. You assume the only possible victims are the AI (if conscious) or you (if deceived). You miss the third option: you (undeceived) being degraded by the interaction. The setup damage is assuming moral risk lives in the machine's mind or the label, rather than the human's habituation.

  \answer{Harm requires deception or AI consciousness.}
