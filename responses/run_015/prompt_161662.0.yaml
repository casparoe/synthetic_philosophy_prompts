      *   *Market Price System* $\leftrightarrow$ *Internal Transfer Prices/Budgets*.
      *   *Private Property* $\leftrightarrow$ *Corporate Ownership (Shareholders)*.
      *   *Profit-and-Loss* $\leftrightarrow$ *Divisional Performance Metrics*.
      *   *External Factor Market* $\leftrightarrow$ *Internal Resource Allocation*.
      *   *Managerial Incentives* $\leftrightarrow$ *Bonuses/Promotion (vs. Market Discipline)*.
      *   *Bankruptcy/Takeover* $\leftrightarrow$ *Restructuring/Firing*.
      *   *Consumer Sovereignty* $\leftrightarrow$ *Final Sales Revenue*.

  4.  **Analyzing Disanalogies (The Critical Step):**
      *   *Disanalogy 1: The External Anchor.* Firms have external prices for inputs/outputs. The Socialist Commonwealth does not. This is crucial. Without external prices, internal transfer prices are arbitrary.
      *   *Disanalogy 2: Residual Claimancy.* Shareholders bear the risk. In socialism, who bears the risk? The "public"? This dilutes incentive.
      *   *Disanalogy 3: Knowledge.* Firm managers know the specific context of their division. A central board does not know the context of every factory. Hayek's point.
      *   *Disanalogy 4: The Nature of "Prices".* In a firm, transfer prices are accounting tools. In a market, prices are terms of exchange between owners.
