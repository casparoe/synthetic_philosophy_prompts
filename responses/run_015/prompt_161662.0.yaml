  10. **Drafting the Response (incorporating the above thoughts).**
      *   *Intro:* Set the stage. The analogy is Coasean but misapplied.
      *   *Table:* Keep it tight.
      *   *Disanalogies:* Focus on the "Boundary of the Firm" (Coase) vs "Boundary of the Economy".
