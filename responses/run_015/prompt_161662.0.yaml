      *   *Distributed Computing:* No central processor; nodes process local info.
      *   *Evolutionary System:* Trial and error happens at the firm level, not the state level.
      *   *Verdict:* These support Hayek. The "One Big Firm" supports Lange only if you ignore the knowledge problem.

