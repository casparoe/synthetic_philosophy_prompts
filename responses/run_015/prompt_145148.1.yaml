  6.  **Refining the Voices:**
      *   **Malcolmian:** Precise, skeptical, logical, focused on criteria and grammar. A bit austere.
      *   **Dennettian:** Pragmatic, functionalist, focused on mechanisms and heterophenomenology. A bit more fluid.
      *   **Tone:** Intellectual but charged. Not a lecture, a debate.

  7.  **Step-by-Step Writing & Revision:**
      *   *Start:* Set the scene. The transcript of the dream is on the table.
