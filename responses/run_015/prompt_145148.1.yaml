      *   **Round 2 (Narrative Residue):** Focus on the alarm. Malcolmian says it's waking confabulation. Dennettian asks about the mechanism of integration without experience.
      *   **Round 3:** Dennettian suggests the writing *is* the dream. Malcolmian asks if this collapses experience/reporting.
