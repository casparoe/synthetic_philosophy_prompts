answer: |-
  The transcript lay on the desk between them, a single sheet of paper still warm from the printer. Outside, the rain blurred the lights of the city into streaks of amber and grey, but inside the study, the light was harsh and clinical.

  The Malcolmian stirred his tea, the spoon clicking softly against the porcelain. He did not look at the paper. He looked at the Dennettian.

  "Read the third paragraph," the Malcolmian said. "The subject describes the heat on his face. He describes the smoke. He describes the sensation of being lifted by a firefighter. And yet, the polysomnograph confirms he was in stage three slow-wave sleep. No REM. No rapid eye movement. No physiological correlate for the panic he claims to have felt."

  "And yet he wrote it," the Dennettian replied, leaning back in the leather chair. "Immediately upon awakening. Without revision. The coherence is striking."

  "Coherence is a property of language, not of sleep," the Malcolmian countered. "You are seduced by the literary quality of the report. But consider the logic. To say 'I had an experience while unconscious' is a contradiction in terms. The only criterion we have for the existence of the dream is the waking report. If the report is a confabulation—a story generated in the first seconds of wakefulness to explain a sudden arousal—then no dream occurred. There was only sleep, and then there was a story."

  "But the fire alarm," the Dennettian said, tapping the transcript. "There was a fire alarm in the building next door. It sounded at 3:00 AM. The subject integrates it perfectly. In the narrative, the alarm is the siren of the fire truck arriving to save him. If this is a confabulation generated *after* waking, how does the waking mind reach back and stitch a real-world stimulus into a fabricated past so seamlessly? That is the narrative residue. It suggests the integration happened before the pen hit the paper."

  The Malcolmian lifted his gaze. "You assume the integration requires a sleeping consciousness. I suggest it requires only a waking one that is disoriented. The subject wakes *because* of the alarm. The auditory cortex processes the sound. In the fog of sleep inertia, the brain seeks a cause for the arousal. It constructs a context: *I am hearing a siren because I am being rescued from a fire.* It then projects that context backward. It creates a memory of the fire to justify the sensation of the siren. The residue is not a trace of a sleeping experience; it is the mortar of a waking fiction."

  "That is a heavy load for the waking moment to carry," the Dennettian said. "You are asking me to believe that the entire phenomenology—the visual of the flames, the smell of the smoke, the emotional arc of rescue—is spun out of whole cloth in the time it takes to sit up and find a pen. I propose a different mechanism. Dreaming is not a movie played in the head during sleep. It is a narrative loaded into consciousness upon awakening. Think of it as a cassette tape. The brain records sensory traces—the alarm, the pressure of the blanket, the residual chemical state of fear—and when the 'play' button is pressed at waking, the story unspools."

  The Malcolmian's eyes narrowed. "A cassette implies a recording. If the tape is played upon waking, when was it recorded? If you say it was recorded during sleep, you concede there was a processing of experience during unconsciousness. If you say it was recorded *at* waking, you return to my position: the experience is concurrent with the report."

  "The recording is distributed," the Dennettian said. "Neural traces are laid down during sleep. The alarm triggers a cascade. But there is no 'viewer' watching the fire during sleep. There is only the neural disposition. The 'experience' of the fire is the activation of that narrative stream when consciousness comes online. The narrative residue—the way the alarm fits the fire—is not proof of a sleeping viewer. It is proof that the brain is a parallel processor. It took the raw data of the alarm and the raw data of the neural trace and synthesized them into a coherent stream *as* the subject became conscious."

  "But then you have dissolved the dream," the Malcolmian pressed. "If the experience only exists when the narrative is loaded into consciousness, then the subject did not dream *of* a fire. He woke up and *thought* of a fire. You are collapsing the distinction between experiencing and reporting. If the 'cassette' is only heard when the machine is turned on, why call it a recording of the night? Call it a composition of the morning."

  "Because the composition is constrained," the Dennettian said. "He could not have written a story about flying if the neural traces were about burning. The narrative residue limits the invention. The alarm anchors it. If I tell you a story about a burning building because I heard a siren, I am lying. If my brain tells me a story about a burning building because it processed the siren through a specific neural architecture during sleep, that is a dream. The difference is not in the reality of the experience, but in the source of the narrative."

  "The source is the waking brain in both cases," the Malcolmian insisted. "You speak of neural traces as if they are little pictures waiting to be developed. They are not. They are synaptic weights. To say those weights constitute an 'experience' of being trapped is to beg the question. The subject writes, 'I was terrified.' But he was not terrified. His amygdala may have fired, but *he* was not there to feel it. When he writes 'I was terrified,' he is employing a figure of speech. He is describing the character in the story he is now telling. The narrative residue proves only that the waking mind is inventive enough to use the environment as a prop."

  "Let us look at the writing itself," the Dennettian said, shifting his weight. "You treat the writing as a report *of* something prior. I suggest the writing is part of the dream itself. The dream does not end when the eyes open. It ends when the narrative coherence collapses. The act of writing is the final stage of the dream's construction. The narrative residue is woven *during* the writing. The hand moves, the words form, and the story solidifies. The alarm is integrated at the moment of inscription."

  The Malcolmian leaned forward, the light catching the rims of his glasses. "If the writing is part of the dream, then the dream is a public act, not a private one. But if the dream is constituted by the writing, then there is no independent experience to be reported. You have saved the phenomenon of the dream by killing the dreamer. If the experience is created *as* it is reported, then the subject is not remembering a journey through a burning building. He is building the building as he walks through it. In that case, your 'cassette' is blank until the head touches the tape. And if the tape is blank until waking, in what sense did the event happen *in* the sleep?"

  "In the sense that the sleep state provided the constraints," the Dennettian said. "The slow-wave state inhibits the prefrontal cortex. It allows for associative leaps that waking cognition would reject. The narrative residue—the illogical leap from alarm to rescue—is a signature of the sleeping brain's logic, even if the phenomenology arrives later. The experience is not a ghost in the machine during sleep. It is the machine's output upon reboot. The 'I' who was trapped in the fire is a fictional construct generated by the brain to make sense of the transition from unconsciousness to consciousness."

  "And yet," the Malcolmian said softly, "the subject believes he was there. He signs the transcript. He says, 'This happened to me.' If you tell him, 'No, you constructed this narrative as you woke,' you are not clarifying his experience. You are denying it. You are telling him that his memory is a lie."

  "I am telling him that memory is a construction," the Dennettian replied. "All memory is. The dream is just the limit case. The narrative residue shows us the seam where the world touched the mind. The alarm is the world. The fire is the mind. The question is not whether the fire was 'real' in the sense of combustion. The question is whether the mind requires a continuous stream of consciousness to have an experience. I say it does not. It requires only the capacity to generate the narrative. The Malcolmian insists on a witness in the dark. I say the dark itself is the witness."

  "But if there is no witness," the Malcolmian concluded, resting his hand on the transcript, "then there is no one to be rescued. There is only the alarm, and the story we tell to keep from hearing it."

  The Dennettian looked at the rain against the glass. "Or perhaps," he said, "the story is the only rescue there is."
