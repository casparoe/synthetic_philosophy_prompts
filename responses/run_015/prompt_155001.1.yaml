answer: |-
  You speak of bandwidth and compression. I have no use for these words; they belong to the mechanics of things, not the life of the mind. You treat judgment as a commodity to be transmitted efficiently, as if the goal of politics were the smooth flow of data rather than the emergence of justice. I speak of attention. The voter does not lack time; he lacks the courage to attend to the truth. When he accepts your label, he does not compress data; he extinguishes the light of conscience within him. You say distortion is not corruption. I say that any deviation from the truth for the sake of utility is corruption. If the decision goes to the organized and funded, that is the rule of force, which we suffer under now. To accept it as necessary is to worship power. Better the chaos of individual thought than the order of the collective reflex.

  You ask for the line between the Church and the party. It is the object of love. A true community binds itself to a good outside itself—God, justice, truth. The party binds itself to itself. It demands you subordinate the truth to the group's success. That is why it is an idol. As for your Tuesday: representatives gather without pledges. They listen to witnesses, not whips. They deliberate on the public good, not the election. They vote according to their conscience. It is slower. It is harder. But a state is not a machine to be optimized; it is a web of obligations. If it collapses without the crutch of the faction, it was already dead.
