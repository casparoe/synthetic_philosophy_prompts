answer: |-
  Here is a map of the exposure of your view, ranked by severity, followed by an assessment of its predictive distinctiveness and a verdict on the unfalsifiability risk.

  ### I. Map of Exposure: Ranked Defeaters

  **1. The "Adjustment" Redescription (Fatal Risk)**
  *   **The Threat:** You note your own tendency to argue that "any stable regularity of mutual adjustment solves the coordination problem of adjusting to one another." This is the most dangerous move available to you. If the "coordination problem" is defined retrospectively as "the problem solved by the existing regularity," the condition becomes trivial. Every stable social regularity involves agents adjusting to one another; if that adjustment *constitutes* the coordination problem, then every stable social regularity is a convention.
  *   **Assessment:** A committed holder must **concede** this counts against the view. This is not a boundary dispute; it is a collapse into tautology. To save the view, you must define the coordination problem *independently* of the observed regularity (e.g., via payoff structures that exist prior to or distinct from the solution). If you cannot specify the payoffs of the "adjustment problem" without referencing the convention itself, the view explains nothing.
  *   **Verdict:** Fatal if retained. You must restrict "coordination problem" to cases of *interdependent payoffs* where the equilibrium is not the only rational outcome (ruling out dominant strategies) and where the payoffs are not generated solely by the fact of matching itself.

  **2. The Affordance-Locked Regularity (The Corridor Case)**
  *   **The Threat:** In your door case, the regularity is stable and arbitrary (the other door works), but the mechanism is physical affordance + individual habit, with no strategic interdependence. My payoff for using the light door does not depend on *your* using it; it depends on the door's weight. The visual cue is informational, not strategic. If this counts as a convention, your view conflates physical causation with social normativity. If it does not, your Mechanism-Indifference Claim is false, because the *source* of the stability (physics vs. social feedback) matters.
  *   **Assessment:** A committed holder should **dismiss** this as a counterexample, but only by tightening the definition of "Coordination Problem." The door case is not a coordination problem because the utilities are not interdependent. I do not care which door you use; I only care about door weight. A convention requires that my best response *depends* on your action (or expected action).
  *   **Verdict:** Dismissible, provided you insist on *payoff interdependence*. The Mechanism-Indifference Claim survives if you clarify that the mechanism must sustain an *equilibrium*, and an equilibrium requires interdependent payoffs. The door case is a causal regularity, not an equilibrium. However, this puts pressure on you to explain how interdependence exists without mutual expectations (see Risk #4 below).

  **3. Vestigial Norms (Serious Risk)**
  *   **The Threat:** A regularity persists (e.g., wearing ties) after the original coordination problem (e.g., signaling professional status in a specific context) has lapsed. The normativity is fully present, stability is high, but there is no longer a "recurring coordination problem" in the original sense. If you say the problem is now "avoiding social friction," you risk the "Adjustment" Redescription (Threat #1). If you say it is no longer a convention, you contradict the intuition that vestigial norms are the *paradigm* of conventions.
  *   **Assessment:** A committed holder should **concede** this requires a qualification. You cannot maintain that the *original* problem must recur. You must shift to a "meta-coordination" problem: the problem of not deviating from the established regularity to avoid uncertainty.
  *   **Verdict:** Serious. This forces you to admit that the "coordination problem" is often *generated by the convention itself* (the problem of mismatch) rather than pre-existing it. This weakens the explanatory power of the "solution to a problem" framing, making it closer to "stable regularity that generates its own stability."

  **4. The Proleptic-Convention Problem (Awkward)**
  *   **The Threat:** The first instance cannot rely on past regularity. If you rely on "anticipated regularity," you risk smuggling in the mutual expectations you deny.
  *   **Assessment:** A committed holder should **dismiss** this. You can rely on *salience* without *common knowledge*. A focal point (Schelling) can select the first equilibrium without agents representing the situation as a coordination problem or having beliefs about others' beliefs. They simply act on the salient feature.
  *   **Verdict:** Merely awkward. This is solvable within your structural framework without invoking normative psychology.

  **5. Contested Equilibria (Dismissible)**
  *   **The Threat:** In Battle of the Sexes, we coordinate, but we prefer different equilibria. Is the selection arbitrary?
  *   **Assessment:** A committed holder should **dismiss** this. Arbitrariness means there is *another* equilibrium that *could* have been selected, not that agents are indifferent between them. The fact that we fight over *which* arbitrary equilibrium to select confirms the arbitrariness of the set.
  *   **Verdict:** No threat. Standard game theory handles this.

  ---

  ### II. Unique Predictions and Risks

  Your view distinguishes itself from rivals (Normative-Expectations, Internalization, Plain Rational Choice) in specific, testable ways.

  **1. Predictions Where Your View Stands Alone:**
  *   **Cognitive Minimalism:** Unlike Normative-Expectations accounts, your view predicts conventions can exist in populations with zero theory of mind (e.g., ants, simple bots), provided they exhibit equilibrium behavior + arbitrariness. If you find "normative" punishment in ants, the Internalization account claims victory; if you find stable arbitrary coordination without it, you win.
  *   **Punctuated Equilibrium:** Unlike gradualist accounts of norm drift, your view predicts convention change should be sudden (tipping points). Since conventions are equilibria, they should resist small perturbations and then flip rapidly when the payoff structure or salience shifts past a threshold.
  *   **Epiphenomenal Normativity:** You predict that the *feeling* of obligation should track stability, not moral justification. We should feel bound by inefficient conventions (e.g., QWERTY) just as strongly as efficient ones, provided they are stable. Rivals who tie normativity to welfare or internalization struggle to explain why we feel bound by stupid conventions.
  *   **Unnecessary Enforcement:** You predict third-party enforcement should be rare for pure conventions. Since conformity is self-enforcing (it's an equilibrium), punishment is a waste of resources. Enforcement should only appear when the equilibrium is threatened (e.g., by a subgroup trying to shift to a rival equilibrium).

  **2. Where the View Risks Failure:**
  *   **Dependence on Salience:** Your account of the "first instance" and equilibrium selection leans heavily on salience. If salience cannot be defined non-circularly (i.e., "what people select" vs. "what is intrinsically prominent"), your account of equilibrium selection collapses.
  *   **Equilibrium Explanatory Power:** You rely on "equilibrium" doing the heavy lifting. In social science, equilibrium is often a post-hoc label for stability. If you cannot specify the payoff function independently of the behavior, the claim "it is an equilibrium" is empty.
  *   **Mutual Knowledge in Large Populations:** You deny common knowledge is required. This is a strength, but you must explain *how* stability is maintained without it. If you rely on "population-level dynamics," you need a mechanism (e.g., evolutionary stability) that explains why deviations don't occur randomly. If deviations are random and frequent, the regularity isn't stable.

  ---

  ### III. The Collapse Objection: Arbitrariness vs. Equilibrium

  You asked whether the arbitrariness condition does any work beyond the coordination equilibrium condition.

  **Verdict:** It does work, but it is fragile.
  *   **The Work It Does:** A Nash Equilibrium exists in Prisoner's Dilemma (Defect/Defect), but this is not a convention. Why? Because there is no *alternative* equilibrium that serves the parties at least as well. (Cooperate/Cooperate is better, but not an equilibrium). A convention requires *multiple* equilibria.
  *   **The Work It Does (2):** A Dominant Strategy Equilibrium (e.g., "Always wear a lifejacket on a sinking ship") is stable, but not a convention. Why? Because the alternative does not serve the parties as well.
  *   **The Risk:** The collapse occurs if "at least as well" is interpreted too loosely. If "avoiding social friction" counts as serving the parties "as well as" the original function, then *every* stable norm becomes a convention. To prevent collapse, you must maintain a distinction between the *intrinsic* payoffs of the coordination problem (e.g., driving on the left avoids crashes) and the *secondary* payoffs of conformity (e.g., avoiding ridicule). Arbitrariness must apply to the intrinsic payoffs.

  ---

  ### IV. Honest Verdict on Unfalsifiability

  You asked for plain speech regarding the move: *"Any stable regularity of mutual adjustment solves the coordination problem of adjusting to one another."*

  **This is a genuine defect.**
  It renders the view unfalsifiable. If every stable regularity is defined as a solution to a coordination problem, then the claim "Conventions are solutions to coordination problems" reduces to "Conventions are stable regularities." The "coordination problem" terminology becomes decorative.

  **Is this expected for a structural account?**
  No. A structural account should identify specific structural features (interdependent payoffs, multiple equilibria) that *cause* the stability. It should not define the structure *as* the stability.

  **How to Fix It:**
  You must forbid the "Adjustment" redescription. You must require that the coordination problem be specifiable *antecedently* to the convention.
  *   *Bad:* "We drive on the left. Why? To coordinate. What is the coordination problem? Driving on the same side."
  *   *Good:* "We drive on the left. Why? To avoid collisions. The coordination problem is 'avoiding head-on crashes,' which has two equilibria (All-Left, All-Right). We selected Left."

  If you cannot specify the "avoiding collisions" payoff without referencing the "driving on the same side" regularity, your view is circular.

  ### V. Final Recommendation

  Your view is robust on the **Mechanism-Indifference Claim** provided you hold the line on **Payoff Interdependence**.
  1.  **Keep Mechanism-Indifference:** It is the view's greatest strength. It allows you to explain conventions in animals, algorithms, and humans without positing a mysterious "normative psychology."
  2.  **Drop the "Adjustment" Defense:** Do not allow *any* stable regularity to count as a coordination problem. Insist on independent payoff structures. This will make your view falsifiable (e.g., if a stable regularity exists but payoffs are not interdependent, it's not a convention).
  3.  **Accept the Vestigial Qualification:** Admit that conventions can create their own coordination problems (the problem of mismatch) once established. This concedes ground to the "Normative-Expectations" rivals but saves the structural core.
  4.  **Prioritize the Collapse Objection:** You are right to fear that Arbitrariness adds nothing. Ensure you define "Arbitrariness" strictly as "Existence of a rival Nash Equilibrium with comparable *intrinsic* payoffs." This distinguishes your view from plain Rational Choice (which accepts PD solutions) and Normative Accounts (which require obligation).

  Your view is defensible, but only if you resist the temptation to make "coordination" a synonym for "stability." Keep the game theory honest, and the philosophy will follow.
