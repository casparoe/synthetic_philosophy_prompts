prompt: |-
  For a metaethics seminar I am writing up my views on moral demandingness and want a consistency check before presenting. Here is my package: (1) I accept the demandingness objection to act-utilitarianism—morality cannot require the perpetual subordination of an agent’s personal projects to aggregate welfare. (2) I defend what I call a “moral budget” model: each agent bears a fixed, non-renewable quota of required self-sacrifice distributed across her obligations; demands within the quota are binding, but further consequentialist demands become supererogatory once the quota is met. (3) I hold that direct rescue obligations—saving a nearby drowning stranger at moderate personal risk—are mandatory and do not draw on the budget at all, because they involve immediate causal responsibility rather than general beneficence. (4) I reject global calibration of the budget (counting all suffering one could prevent anywhere) and insist on local calibration restricted to one’s actual causal network. (5) I deny that evolutionary debunking arguments undermine our intuitions about demandingness, yet I also maintain that those same intuitions are unreliable guides to the precise magnitude of the budget. (6) Finally, I claim there is no intrinsic moral difference between failing to rescue through direct omission and failing to prevent harm through distant non-intervention; the only relevant distinction is that direct rescue falls outside the budget while distant aid falls within it.

  Please audit this set. Which pairs are genuinely in tension, which only appear to be, and what is the least costly revision in each case? In particular, check whether (3) and (6) can stand together given that both reject standard proximity- or omission-based distinctions, and whether (4) undermines the motivation for (2). Rank the tensions by severity, specify exactly what must give in each case, and identify any hidden commitment I am implicitly signing up for that I have not listed.
reasoning: |-
  Here's a thinking process that leads to the audit of the user's metaethics package:

  1.  **Deconstruct the User's Package:**

      *   **(1) Demandingness Objection Accepted:** Act-utilitarianism (AU) is too demanding. Morality can't require perpetual subordination of personal projects to aggregate welfare.
      *   **(2) Moral Budget Model:** Agents have a fixed, non-renewable quota of required self-sacrifice. Within quota = obligatory. Beyond quota = supererogatory.
      *   **(3) Direct Rescue Exception:** Saving a nearby drowning stranger (moderate risk) is mandatory *outside* the budget. Reason: Immediate causal responsibility vs. general beneficence.
      *   **(4) Local Calibration:** Budget is calibrated locally (actual causal network), not globally (all suffering one could prevent).
      *   **(5) Evolutionary Debunking:** Intuitions about demandingness aren't debunked by evolution, *but* they are unreliable for setting the precise *magnitude* of the budget.
      *   **(6) No Intrinsic Difference (Omission/Distance):** No intrinsic moral difference between failing to rescue (direct omission) and failing to prevent harm distantly (non-intervention). Distinction is purely budgetary (Direct = outside budget, Distant = inside budget).

  2.  **Initial Scan for Obvious Tensions:**

      *   *(3) vs. (6):* (3) says direct rescue is special (outside budget). (6) says there's no *intrinsic* moral difference between direct and distant, only budgetary. This looks like a potential contradiction or at least a very fine line. If there's no intrinsic difference, why is one outside the budget and the other inside?
      *   *(2) vs. (4):* (2) sets a budget. (4) restricts calibration to the local causal network. Does (4) make (2) redundant or unmotivated? If I only count local suffering, is the budget even needed to block demandingness?
      *   *(1) vs. (4):* (1) rejects AU because it's too demanding globally. (4) restricts scope locally. Does (4) solve the demandingness problem without needing (2)?
      *   *(5) Internal Tension:* Intuitions are reliable enough to block debunking but unreliable for numbers. This is standard Moorean/Reflective Equilibrium stuff, probably manageable, but needs checking.

  3.  **Detailed Analysis of Specific Tensions:**

      *   **Tension A: (3) vs. (6) - The "Intrinsic Difference" Problem.**
          *   (3) claims direct rescue obligations *do not draw on the budget*.
          *   (6) claims there is *no intrinsic moral difference* between failing to rescue directly and failing to prevent harm distantly.
          *   *Conflict:* If there is no intrinsic moral difference, why do they fall into different deontic categories (mandatory outside budget vs. mandatory inside budget)? Usually, different deontic statuses imply some morally relevant difference.
          *   *User's Defense:* (6) says the *only* relevant distinction is budgetary. But (3) says direct rescue is *outside* the budget. So the distinction is: Direct = Mandatory (Budget-Independent), Distant = Mandatory (Budget-Dependent).
          *   *The Problem:* If the *only* distinction is budgetary, what grounds the budgetary assignment? If there's no intrinsic difference (e.g., proximity, causal immediacy), then assigning one to "outside budget" and one to "inside budget" looks arbitrary. But (3) *uses* "immediate causal responsibility" as the reason. (6) denies intrinsic difference based on omission/intervention.
          *   *Refinement:* (6) denies difference between *omission* and *non-intervention*. (3) relies on *immediate causal responsibility*. Are these the same? Usually, "direct rescue" implies a specific causal link that "distant aid" lacks. If (6) denies this causal link is morally intrinsic, (3) collapses.
          *   *Severity:* High. This threatens the coherence of the exception clause.

      *   **Tension B: (2) vs. (4) - The Motivation for the Budget.**
          *   (2) introduces a budget to limit demands.
          *   (4) limits the *scope* of consideration to the "actual causal network."
          *   *Conflict:* If I only owe duties to those in my causal network, isn't the demandingness problem already solved? Why do I need a *sacrifice quota* if the *pool of claimants* is already restricted?
          *   *Standard AU Problem:* Too many claimants (everyone).
          *   *User's Solution:* Restrict claimants (4) AND restrict sacrifice per claimant/total (2).
          *   *Risk:* (4) might do all the work, making (2) redundant. Or, (4) might be so restrictive that (2) never triggers. Conversely, if my "causal network" is vast (global economy), (4) doesn't help much, and (2) is needed.
          *   *Severity:* Medium. It's more about theoretical economy than contradiction. But if (4) is the *reason* for limiting demands, (2) is a patch. If (2) is the reason, (4) is a scope limiter. They need to work together, not compete.
          *   *Specific Conflict:* (4) says "reject global calibration." (2) says "fixed quota." If the local network is small, the quota might never be met. If the local network is huge (e.g., I can causally affect millions via donations), (4) doesn't save me from demandingness, so (2) is needed. The tension is whether (4) undermines the *necessity* of (2).

      *   **Tension C: (1) vs. (6) - The Basis of the Objection.**
          *   (1) accepts the demandingness objection to AU.
          *   (6) denies intrinsic difference between acts/omissions or near/far.
          *   *Conflict:* The demandingness objection usually relies on the idea that AU ignores agent-centered prerogatives. (6) looks like it tries to keep a consequentialist structure (no intrinsic act/omission difference) but modifies the output.
          *   *Severity:* Low. This is a standard move (modifying consequentialism rather than abandoning it).

      *   **Tension D: (5) - The Epistemic Status of Intuitions.**
          *   Intuitions block debunking (reliable enough for existence) but not magnitude (unliable for precision).
          *   *Conflict:* Why trust them for the "shape" (budget exists) but not the "size" (how much)?
          *   *Severity:* Low/Medium. This is a common philosophical move (qualitative vs. quantitative reliability). Needs justification but not contradictory.

  4.  **Deep Dive into (3) and (6) (The User's Specific Request):**

      *   (3): Direct rescue = Mandatory, Outside Budget. Reason: Immediate causal responsibility.
      *   (6): No intrinsic difference between direct omission and distant non-intervention. Distinction is *only* that direct is outside budget, distant is inside.
      *   *The Trap:* If (6) says there is *no intrinsic moral difference*, then the *reason* given in (3) ("because they involve immediate causal responsibility") is undermined. "Immediate causal responsibility" sounds like an intrinsic difference.
      *   *Resolution:* The user needs to clarify that "intrinsic moral difference" in (6) refers to the *deontic status of the act type* (killing vs. letting die), whereas (3) refers to the *administrative allocation of duty*.
      *   *Better phrasing:* (6) should say "No difference in the *value of the outcome* or the *basic duty to aid*," but the *enforcement mechanism* differs.
      *   *Actually, looking closer:* (6) says "The only relevant distinction is that direct rescue falls outside the budget while distant aid falls within it." This makes the budgetary status the *ground* of the distinction, not the *result*. But (3) says the *reason* it falls outside is "immediate causal responsibility."
      *   *Contradiction:* (3) says Causal Responsibility -> Outside Budget. (6) says Outside Budget -> Distinction (implying Causal Responsibility doesn't intrinsically matter).
      *   *Verdict:* Genuine tension. (3) posits a grounding feature (causal responsibility). (6) denies intrinsic features matter, making the budgetary assignment look brute.

  5.  **Deep Dive into (4) and (2):**

      *   (4) Local Calibration. (2) Moral Budget.
      *   If I only count local suffering, does the "perpetual subordination" (1) still happen?
      *   If my "causal network" includes everyone I can donate to (Peter Singer's pond), then (4) is effectively global. If (4) is effectively global, (2) is necessary.
      *   If (4) means "people I physically interact with," then (2) is less necessary but still needed for high-local-demand scenarios (e.g., caring for many sick relatives).
      *   *Tension:* If (4) is strong enough to solve (1), (2) is redundant. If (4) is weak, (2) carries the load. The tension is theoretical redundancy, not logical contradiction.
      *   *User's specific worry:* Does (4) undermine motivation for (2)? Yes, if (4) is interpreted as solving the demandingness problem by limiting *scope* rather than *sacrifice*.
      *   *Resolution:* Clarify that (4) limits *claimants*, (2) limits *cost*. Both are needed because even local claimants can be too demanding.

  6.  **Hidden Commitments:**

      *   **Agent-Relative Value:** To justify (3) and (2) without collapsing into AU, the user is implicitly committing to agent-relative value or agent-centered prerogatives, despite (6)'s consequentialist flavor.
      *   **Threshold Deontology:** The "Budget" looks like a threshold. Once crossed, consequentialist reasoning stops binding. This is a hybrid view.
      *   **Causal Proximity as Moral Magic:** (3) relies on "immediate causal responsibility." This is notoriously difficult to define without arbitrariness (the "continuum problem").
      *   **Non-Aggregation:** (4) implies we don't aggregate global suffering. This commits the user to a form of partiality that needs defense against the "arbitrariness of birth" objection.

  7.  **Ranking and Revisions:**

      *   *Severity 1 (Critical):* (3) vs. (6). The grounding of the exception contradicts the denial of intrinsic difference.
      *   *Severity 2 (Structural):* (2) vs. (4). Redundancy/Motivation. Does scope limitation make sacrifice limits unnecessary?
      *   *Severity 3 (Epistemic):* (5). Reliability of intuitions.
      *   *Revision Strategy:*
          *   For (3)/(6): Clarify that "intrinsic moral difference" refers to *outcome value*, while "causal responsibility" is a *procedural trigger* for budget exemption. Or, admit an intrinsic difference in *duty type* (easy rescue vs. general aid).
          *   For (2)/(4): Clarify that (4) limits the *pool of obligations*, while (2) limits the *cost of fulfilling them*. They address different variables.

  8.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the sophistication of the package. It's a hybrid consequentialist/deontological view.
      *   *Section 1: The (3) vs. (6) Tension.* This is the biggest logical snag. Explain why "causal responsibility" counts as an intrinsic difference if it changes deontic status. Offer the "Two-Tier" fix.
      *   *Section 2: The (2) vs. (4) Tension.* Address the redundancy worry. Explain how they target different parameters (Scope vs. Cost).
      *   *Section 3: Hidden Commitments.* Identify the Agent-Centered Prerogative and the Threshold Deontology aspects.
      *   *Section 4: Ranking.* Order by severity.
      *   *Section 5: Least Costly Revisions.* Specific wording changes.

      *(Self-Correction during drafting)*: Wait, let's look closer at (6). "No intrinsic moral difference between failing to rescue through direct omission and failing to prevent harm through distant non-intervention."
      If I let a drowning child die (direct omission) vs. I don't send money to save a child (distant non-intervention).
      (3) says Direct is Mandatory (Outside Budget).
      (6) says No Intrinsic Difference.
      If there is no intrinsic difference, why is one mandatory outside budget and the other inside?
      If the *only* distinction is the budgetary assignment, then the budgetary assignment is brute. But (3) gives a *reason* for the assignment ("because they involve immediate causal responsibility").
      So (3) says: Feature X causes Assignment Y.
      (6) says: Feature X is not intrinsically morally different, Assignment Y is the only distinction.
      This implies Feature X doesn't matter morally, but it determines the Assignment. That's circular or arbitrary.
      *Fix:* (6) should claim no difference in the *badness of the outcome*, but admit a difference in the *stringency of the obligation* based on causal proximity. Or, (3) should drop the "because" and treat direct rescue as a brute exception.
      *Better Fix:* Reframe (6). The *outcome* is equally bad, but the *obligation* differs due to institutional/practical reasons (budget administration).

      *Re-evaluating (4) vs (2):*
      If I restrict calibration to my "actual causal network," does that solve demandingness?
      If my network is the global market (I can causally affect people via donations), then (4) allows global demands. Then (2) is needed.
      If my network is "people I meet," (4) solves demandingness mostly.
      The tension is definitional. The user needs to define "causal network" carefully so (4) doesn't collapse into globalism (making (2) the only shield) or hyper-localism (making (2) redundant).

      *Hidden Commitment:* The "Budget" implies a form of **Satisficing Consequentialism** or **Hybrid View**. It also implies **Non-Aggregation** across the budget limit. It also commits to **Moral Luck** (your budget depends on your causal network).

      *Final Plan:*
      1. Validate the package (it's coherent-ish).
      2. Hit the (3)/(6) contradiction hard.
      3. Address the (2)/(4) redundancy risk.
      4. Point out the "Causal Network" definition trap.
      5. Highlight the Agent-Relative Prerogative commitment.
