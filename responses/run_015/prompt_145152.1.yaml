      (6) claims "no intrinsic moral difference." This is the weak point.
      If I change (6) to "No intrinsic difference in the *value of the life saved*," it preserves (3)'s claim about *obligation*.
      Or, change (3) to stop claiming "causal responsibility" is the *reason*, and instead claim it's a *heuristic* for the budget.
      Actually, the cleanest fix is to admit that causal proximity *does* create a relevant moral distinction (contradicting 6) OR clarify that (6) refers to the *consequentialist calculus* while (3) refers to the *deontic constraint*.
      Let's recommend modifying (6) to specify "consequential value" rather than "moral difference" broadly.

      *Refining the (2)/(4) fix:*
