answer: |-
  ### 1. Exam Prompt

  **Metaphysics Seminar: Final Assessment**
  **Time Allowed:** 90 Minutes
  **Word Limit:** ~1,200 Words

  **Prompt:**

  Consider a scenario of additive manufacturing (3D printing) using clay. A statue is constructed layer-by-layer from a digital model. However, the manufacturing process involves a specific constraint: at every instant $t$ during deposition, each clay particle positioned to form the statue is immediately replaced by a synthetically identical substitute particle of different molecular origin. The original particles are diverted to a separate container. Consequently, the finished statue is composed entirely of substitute particles, while the unused reservoir clay (the original particles) is formed into a separate, distinct lump.

  Using this scenario, assess the following three claims:
  (a) Whether any persisting clay-lump ever comes to constitute the statue's shape, given that the statue never contains the original reservoir matter.
  (b) Whether the statue survives complete part-replacement *during* its own formation, or if it fails to come into existence at all.
  (c) Whether a *constitution-without-identity* view can accommodate this case without collapsing into either standard coincidence (two objects in the same place made of the same stuff) or eliminativism (denying the statue exists).

  **Constraint:** Do not simply recite the standard *Lumpl/Goliath* taxonomy or summarize familiar objections to constitutionalism (e.g., the grounding problem). Your answer must apply the conceptual machinery of material constitution to the specific mechanics of continuous synthetic replacement described above. Answers that ignore the molecular substitution constraint will be penalized.

  ***

  ### 2. Model Answer Outline

  **Introduction**
  *   Acknowledge that this scenario disrupts the standard assumption that the constituting matter (the lump) and the constituted object (the statue) share the same material history.
  *   Thesis: The substitution mechanic severs the mereological continuity required for a standard "clay-lump," forcing the constitution theorist to either redefine constitution as a relation between an object and a *process* or accept that the statue is a functional pattern rather than a material object.

  **Section 1: The Status of the Clay-Lump (Question A)**
  *   **Analysis:** Standard constitution requires a persisting mereological sum ($L$) that occupies the same space as the Statue ($S$).
  *   **Application:** In this scenario, the reservoir clay never overlaps with the statue. The particles inside the statue's bounds are fleeting; they are replaced instantly upon deposition.
  *   **Conclusion:** There is no diachronic "clay-lump" constituting the statue. There is only a *series* of temporal slices of matter. If a "lump" requires gen-identity of parts, no lump constitutes the statue. If "lump" means "whatever matter is currently shaped thusly," then the lump is merely a stage, not a persisting object.
  *   **Key Insight:** The reservoir clay is a lump, but it does not constitute the statue. The statue's matter is a flux.

  **Section 2: Identity During Formation (Question B)**
  *   **Analysis:** This is a "Ship of Theseus" problem applied to *genesis* rather than *preservation*.
  *   **Application:** If the statue's identity depends on the original matter, it never comes into existence (since it holds no original matter). If identity depends on form/function, it survives the replacement.
  *   **Constitution View Implication:** If the constitution view holds that $S$ comes into existence when $L$ acquires a form, but $L$ (the reservoir) never acquires that form, when does $S$ begin?
  *   **Conclusion:** The statue survives only if we prioritize causal history of the *pattern* over the *particles*. If we require material continuity for objecthood, the statue is an illusion (eliminativism).

  **Section 3: Avoiding Coincidence and Eliminativism (Question C)**
  *   **The Trap:** Standard coincidence argues $S$ and $L$ are distinct but share all matter. Here, $S$ and the Reservoir-$L$ share *no* matter. $S$ and the Substitute-Matter share space but not temporal duration.
  *   **Collapse Risk:**
      *   *Coincidence:* If we claim the Substitute-Matter is a "lump," we have $S$ and $L_{sub}$ in the same place. But $L_{sub}$ doesn't persist. This looks like coincidence of an object and a process.
      *   *Eliminativism:* If we say only the particles exist, the statue is eliminated.
  *   **Resolution:** To save constitution-without-identity, one must argue that constitution is not a relation between two *persisting objects*, but between an object and a *matter-stream*.
  *   **Final Synthesis:** The view can be saved only by adopting a temporal parts ontology (perdurantism) where the statue is a spacetime worm constituted by a distinct spacetime worm of matter-streams. If one insists on endurantism, the view collapses into eliminativism because there is no enduring "clay" to do the constituting.

  ***

  ### 3. Marking Scheme (20 Points)

  | Must-Hit Analytical Move | Points | Characteristic Error (Costing these marks) |
  | :--- | :---: | :--- |
  | **1. Mereological Diagnosis:** Correctly identifies that the "substitute particle" mechanic prevents the existence of a standard, persisting clay-lump within the statue's bounds. | **4** | Treating the deposited matter as a standard persisting lump despite the instant-replacement constraint. |
  | **2. Genesis vs. Persistence:** Distinguishes this case from standard Ship of Theseus cases by noting the replacement happens *during creation*, challenging the conditions for the statue's *initial* existence. | **4** | Analyzing the scenario solely as a standard preservation/survival problem without addressing the formation paradox. |
  | **3. Overlap Condition:** Explicitly evaluates the spatial/material overlap requirement for constitution, noting the Reservoir Lump and Statue never share matter. | **4** | Assuming the Reservoir Lump constitutes the statue simply because it was the source material, ignoring the substitution. |
  | **4. Collapse Analysis:** Explains why standard coincidence fails here (since there are not two *persisting* objects sharing matter) and how eliminativism becomes the default threat. | **4** | Reciting standard coincidence objections (e.g., "too many thinkers") without adapting them to the lack of material overlap. |
  | **5. Constructive Resolution:** Proposes a specific metaphysical adjustment (e.g., temporal parts, hylomorphism, or process-constitution) to salvage the constitution view. | **4** | Concluding that the constitution view is simply "false" without proposing how it might be modified to fit the constraints. |

  **Total:** 20 Points
  **Pass Threshold:** 12 Points (Requires hitting at least 3 moves substantially).
