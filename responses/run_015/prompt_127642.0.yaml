  hey, i'm a phd student in political philosophy working on liberal paradoxes and social choice, and i'm trying to reverse-engineer my advisors implicit decision-rule from the toy allocation cases she rules on in our grad seminar. she never formalizes anything, just gives verdicts. here's the track record:

