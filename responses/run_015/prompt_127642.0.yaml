  case 2 — shared workspace noise. a wants silence, b wants loud music. a says if b plays music i'd wear noise-cancelling headphones rather than ask b to stop; b says if i can't play music i'd suffer more than a suffers with headphones. both prefer 'b plays + a wears headphones' to 'b stops + a silent', but a still ranks pure silence best. my advisor rules b can play music but only if b supplies the headphones, framing it as b's sovereignty over b's own audio output, not over a's ears.

  case 3 — the garden fence. two neighbors share a fence line; x wants black, y wants white. both prefer a split (x's side black, y's side white) over uniform either way, but they disagree on assignment. she gives each sovereignty over there own side: split outcome. she treats it as case 1 mapped onto physical space.

  case 4 — the predictive proxy. there's an ai that can predict y's prefferences with 99% accuracy from past data. x uses it to decide what y would want about a shared community garden plot. y hasn't actually formed an opinion. my advisor rejects the ai recommendation and insists y must actually state a preference, even if predicted and actual align. she says delegated sovereignty isn't sovereignty.

