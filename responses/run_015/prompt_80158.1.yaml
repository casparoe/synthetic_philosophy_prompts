prompt: |-
  I'm a software engineer by training (distributed systems, no formal philosophy or physics background), and I've been reading a popular book on quantum foundations on the side. I keep seeing the Born rule invoked as a black box in quantum computing talks — measure, and you get outcome *i* with probability |ψᵢ|² — and I wanted to understand why that one line is supposed to be a problem for the many-worlds interpretation, since the interpretation's whole pitch is that nothing ever collapses. I'm planning a short internal talk for my team on the topic, and I want to make sure I'm not carrying the book's framing into it, so I'd like a careful audit of how fair its summary of the situation is. The relevant chapter ends with the passage below, which I've copied out:

  "The many-worlds interpretation dissolves the measurement problem by denying that the wavefunction ever collapses: when a measurement occurs, the observer simply becomes entangled with the system, and every outcome with nonzero amplitude really happens, each on its own branch of the universal wavefunction. The trouble is that this makes probability mysterious — if every outcome happens, it is unclear what it would be for one of them to be more likely than another — so many-worlds needs the Born rule, the rule that the probability of an outcome is the squared amplitude of its branch, as an extra postulate that unitary dynamics alone cannot supply. The best-known attempt to repair this is the decision-theoretic argument of Deutsch and Wallace, which shows that a rational agent about to undergo a quantum split must weight her future branches by their squared amplitudes, or else her preferences can be exploited in a sequence of bets. A different family of approaches counts the branches: because the wavefunction splits into a definite number of worlds, the probability of an outcome is just the fraction of the worlds in which it occurs, and this reproduces the Born rule in the simple cases that are usually discussed. The book's upshot is that many-worlds is therefore not as parsimonious as its defenders claim: because it has to add the Born rule by hand, it is no simpler than the collapse interpretations it sets out to beat, and its main advantage over them evaporates."

  My instinct is that the last sentence is unfair — I've seen many-worlds defended on exactly the point of parsimony — but I can't say where the chapter goes wrong, and I don't want to grade it on vibes. Please audit it for me in this format: exactly five numbered items, one per sentence of the passage, each item one or two sentences, stating what a working specialist in the foundations of quantum mechanics would accept, what they would wince at, and what they would flatly reject; in the fifth item, say in particular whether the book's conclusion follows from the parts of the passage that are accurate. No introduction, no conclusion, and no reading list — I just want the verdicts.
