answer: |-
  **MEMORANDUM OF UNDERSTANDING: VILANOVA DE SERRA COLLABORATION**

  **Shared Object of Study**
  The collaborative unit is the market town of Vilanova de Serra (Catalan interior), bounded temporally by the fiscal years 1788–1795. The empirical corpus consists of three linked strata: the provincial hearth-tax and militia rolls (aggregate); the notarial protocols of tenant miller Josep Ribalta (micro); and the correspondence of the local tax receiver (administrative). Both parties agree that no claim regarding state formation or household survival shall be asserted without reference to at least two of these three strata.

  **Agreed Claims**
  1. The Ribalta protocols demonstrate credit-based evasion strategies that are mathematically invisible in the 1788 hearth-tax aggregate.
  2. The provincial militia rolls cannot explain why specific households in Vilanova resisted recruitment while neighbors complied.
  3. Selection bias is present: Ribalta's documentation volume correlates with his litigation frequency, validating the **Averaging Objection** regarding typicality.
  4. However, aggregates erase the precise timing of distress visible in Ribalta's credit lines, validating **Index-Case Privilege** regarding mechanism.
  5. Tax receiver correspondence confirms state intent but fails to capture local reception mechanisms without notarial corroboration.
  6. Applying the **Substitution Test**: swapping Ribalta for a peer in the same tax decile alters the narrative texture but not the final fiscal outcome.
  7. Mechanisms of debt accumulation identified in Ribalta's household dissolve when applied to the parish level, per the **Scale-Drift Audit**.
  8. Provincial tax yields correlate strongly with harvest data, but weakly with individual solvency cycles found in protocols.
  9. The 1793 militia spike is visible in aggregates approximately six months before it appears in Ribalta's personal correspondence.
  10. Both datasets require imputation to cover missing years, but the logic of imputation differs fundamentally between notarial gaps and tax roll gaps.

  **Residual Disagreements**

  | Topic | Mireia's Preferred Wording | Dieter's Preferred Wording | Verdict & Dissolution |
  | :--- | :--- | :--- | :--- |
  | **Representativeness** | Ribalta is a *revealing exception* whose depth exposes structural cracks averages hide. | Ribalta is a *statistical outlier* whose richness signals deviation from the norm. | **Substantive.** This is not verbal; it reflects a divergence on whether history seeks typical trends or existential limits. No dissolution possible; must be managed via the Cruxes. |
  | **Causal Explanation** | Explanation requires tracing the *mechanism* of decision-making within the household. | Explanation requires establishing *correlation* between variables across the province. | **Verbal.** Dissolved by agreeing to use "mechanism" for household processes and "association" for provincial variables, preventing category errors. |
  | **State Power** | State capacity was *negotiated* locally through evasion and delay. | State capacity was *implemented* structurally through extraction and quotas. | **Substantive.** This concerns the ontology of the state. Resolved by acknowledging both negotiation and implementation occurred simultaneously at different scales. |

  **Experimental Cruxes**
  To move beyond theoretical stalemate, both parties agree to the following tests on the Vilanova material.

  **Crux 1: The Scaling of Evasion**
  *   **Sub-question:** Does the mechanism of tax evasion used by Ribalta exist at the provincial level?
  *   **Test:** Perform a **Scale-Drift Audit**. Take the specific credit-deferral mechanism identified in Ribalta's 1790 protocols and search for its signature in the provincial tax receiver's correspondence.
  *   **Mireia's Prediction:** The correspondence will show explicit acknowledgments of this deferral strategy, proving the mechanism scales.
  *   **Dieter's Prediction:** The correspondence will show only aggregate arrears, proving the mechanism is local noise invisible to the state.

  **Crux 2: The Selection Bias Threshold**
  *   **Sub-question:** Does Ribalta's documentary richness invalidate his use as a proxy for his tax decile?
  *   **Test:** Apply the **Substitution Test**. Select a random tenant miller from the 1788 hearth-tax decile with minimal notarial survival and reconstruct their fiscal trajectory via tax rolls alone.
  *   **Mireia's Prediction:** The shape of the story changes, but the structural vulnerability remains identifiable.
  *   **Dieter's Prediction:** The shape of the story changes, and without the protocols, the structural vulnerability is indistinguishable from random variance.

  **Crux 3: The Timing of Crisis**
  *   **Sub-question:** Did household liquidity crisis precede provincial mobilization orders?
  *   **Test:** Compare the date of Ribalta's first distressed asset sale against the date of the provincial militia quota increase.
  *   **Mireia's Prediction:** Ribalta's distress predates the quota, suggesting local economic collapse drove state reaction.
  *   **Dieter's Prediction:** The quota predates Ribalta's distress, suggesting state extraction drove household collapse.

  **Closing Note on the Nature of the Dispute**
  It is the scribe's assessment that a significant portion of the two-year argument was never about the evidence at all. The **Averaging Objection** and **Index-Case Privilege** are not merely methodological tools; they are proxies for conflicting teleologies. Prof. Wexler operates under the assumption that historical explanation must yield portable causal knowledge—generalizable rules about state formation that apply beyond Vilanova. Dr. Fontcuberta operates under the assumption that historical explanation must yield orientation—the recovery of what a life was like within a specific constraint system.

  Where the disagreement was verbal, it stemmed from using the word "explanation" to cover both projects. Where the disagreement was substantive, it stemmed from a refusal to trade off these demands. You should now concede that neither side could have won the old argument because you were arguing over whether history is a social science seeking laws or a humanistic discipline seeking understanding. The Cruxes above are designed not to declare a winner, but to delineate exactly where the portable knowledge stops and the oriented understanding begins. Proceed with the tests.
