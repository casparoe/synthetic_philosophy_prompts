      *   **(5) Normative/Error Condition:** Must be something that counts as "wrong by the system's own lights," shaped by sensitivity to that. Claims next-token prediction (NTP) + cross-entropy loss satisfies this.
      *   **(6) Confabulation = Failure of Understanding:** Fluent confabulation on no signal is a failure of understanding (lack of grip on competence limits), not just ignorance.

  3.  **Identify Potential Tensions:**

      *   **Tension A: (1) vs. (4).**
          *   (1) says understanding is causal-informational/relational. It dismisses Chinese Room (intrinsic meaning). It allows testimony-mediated understanding (historians, etc.).
