answer: |-
  Hey, thanks for sending this over. I know exactly the feeling you're describing about talking past each other, and honestly, I think your decomposition is sharper than most of the whitepapers I see circulating on this stuff, even if I'm not sure I'd carve the joints exactly where you have. You're asking me to help you avoid wasting four postdoc-years, which is a serious responsibility, so I'm going to be blunt about where I think the philosophical leverage actually lies versus where it just feels like we're doing philosophy because that's what we know how to do.

  Let's start with the easiest cut, which is problem two, the delegation regress. You're right to be suspicious of this one. It smells like global skepticism applied to agency, the kind of thing that looks profound in a seminar room but dissolves the moment you have to ship code or pass a law. If we can't ground alignment because the principal is themselves unaligned, then we can't ground any normative claim whatsoever, not just AI alignment. We don't stop building bridges because the engineers were raised by parents who were raised by parents whose moral status is questionable. Unless you have a specific formal argument showing that this regress introduces a compounding error term that blows up exponentially rather than converging or staying bounded, this is just epistemology homework. It's not a bottleneck. If a postdoc spends two years on this, I worry they'll produce a nice paper on testimony that nobody in ML reads because it doesn't change their loss function. I would drop this entirely from the funding bucket. It's a distraction masquerading as a depth charge.

  That leaves you with one, three, and four, and this is where the trade-offs get painful. You mentioned you have a hunch that three, the training-process reading, is where philosophers could say something real, and you asked me to talk you out of it. Here is the argument for why you should be worried. Problem three is essentially the inner alignment problem, framed dynamically. It asks whether the optimization process selects for mesa-optimizers that share the base objective. The reason I'm hesitant to dump pure philosophers into this without a very tight leash is that it risks becoming scholastic. You can write all the formal epistemology you want about what it means for a system to "have a goal," but if that definition doesn't map onto the gradient descent dynamics that actual engineers are running, you're just building a beautiful map of a territory that doesn't exist. The tractability here depends entirely on whether the postdoc can engage with the mechanistic interpretability literature or at least the formal learning theory side of things. If they're just doing conceptual analysis of "agency" without looking at how loss landscapes actually behave, they won't move the needle. However, if they can formalize the distinction between behavioral alignment and structural alignment in a way that gives engineers a new metric or a new impossibility result, that's gold. The result I'd want to see there isn't a paper, it's a toy model or a theorem that shows a specific class of training dynamics necessarily produces misalignment even under perfect outer alignment. That would force the field to stop assuming away the problem.

  But if I'm being honest about upstream priorities, I think problem four, aims that only exist downstream, is actually the more pressing philosophical bottleneck, and it's where your philosophers will have the most comparative advantage. This is the problem of value learning and meta-ethics. If human values are not fixed facts waiting to be discovered but are instead constructed through interaction, then the goal of "aligning to human values" is ill-posed until we specify the process of construction. This is pure philosophy. It's meta-ethics and decision theory under uncertainty. If we get this wrong, we might align the AI perfectly to a coherent extrapolation of what we want now, only to find out that what we want now is incoherent or that the extrapolation process itself violates constraints we would have endorsed had we been smarter. This is upstream of problem three because you can't know if the training process is selecting for the right thing if you don't know what the right thing is supposed to look like in a high-capability regime. A postdoc working on this could produce a formal framework for normative uncertainty that allows an AI to remain corrigible about its own objective function. That is a concrete deliverable: a decision-theoretic model that handles value drift without locking in early mistakes. This feels more tractable for a philosopher than problem three because it relies less on empirical ML details and more on coherent reasoning about preferences and uncertainty, which is bread and butter for decision theorists.

  Problem one, the vanishing principal, is real and important, but I worry it's more political philosophy than alignment research. It's about governance and multi-agent dynamics. While crucial for deployment, it feels slightly downstream of the existential risk question. If the model kills everyone because it was misaligned technically, it doesn't matter much if the principal was ill-defined. However, if the model is technically aligned but serves a principal whose aims are destructive, that's also bad. I think this is worth one postdoc slot only if they are willing to frame it as a formal social choice problem within the AI system itself, rather than just policy analysis. But compared to three and four, it feels less like a fundamental block on solving alignment and more like a complication of using aligned systems.

  So if I'm rearranging your deck, I'd say problem two is out. Problem one is secondary. The real fight is between three and four, and I think you're slightly over-indexing on three because it feels more "technical," whereas four feels like "just philosophy." But four is the foundation. If values are downstream, then alignment is not a static target acquisition problem but a dynamic co-evolution problem. That changes the math. The crux you might be missing isn't any of these four specifically, but the gap between specification and generalization. All four of your problems assume there is a target, even if it's vague. The real horror story is that the target is a moving horizon that disappears as you approach it.

  If I were writing the grant call, I would ask for work that bridges four and three. I want someone working on how training dynamics interact with ill-defined values. Can we prove that certain optimization processes stabilize value formation while others destabilize it? That connects the metaphysics of value to the mechanics of SGD. That is worth four postdoc-years. A successful result there wouldn't necessarily be a solved problem, but a clear statement of where the disagreement bottoms out in something non-empirical. For example, showing that any attempt to define alignment without reference to the training history is provably insufficient under certain conditions. That would kill off a whole class of behavioral evaluation approaches and force the field to care about internals, which validates problem three. Or conversely, showing that value coherence is impossible to maintain across capability jumps without active human intervention, which validates problem four.

  Don't fund people who just want to write about the ethics of AI. Fund people who want to write equations about the conditions under which ethics is possible for an optimizer. If they can't write the equations, or at least formalize the arguments such that an engineer could see where the lever is, then they aren't going to help you solve the alignment problem, they'll just help you talk about it. You need to avoid the trap of funding commentary when you need funding for architecture. By architecture I mean conceptual architecture. If a postdoc comes back in eighteen months with a paper that says "alignment is hard because ethics is hard," you've wasted the money. If they come back with "here is a formal definition of corrigibility that is incompatible with standard reward modeling," you've changed the field.

  So to answer your question directly: drop two. It's a philosophical zombie. Keep one but keep it lean, maybe half a postdoc or shared with a governance fund. Put the real weight on four, because if we don't know what we want, nothing else matters, and philosophers are the only ones equipped to tackle meta-ethics rigorously. But force them to engage with three, because if they ignore the training dynamics, their ethics will be inert. The upstream constraint is four, but the risk lives in three. You need people who can hold both in their head at once. If you can find philosophers who are willing to get their hands dirty with the formalisms of learning theory while keeping their eye on the meta-ethical gaps, that's where the value is. Anything less than that integration is just noise.
