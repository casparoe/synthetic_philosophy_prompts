answer: |-
  This is one of the classic "dirty hands" problems in democratic theory, and you're right to feel stuck. The standard intro-level distinction (Expressive = "I like this" vs. Instrumental = "This works") collapses when the "working" option is morally tainted.

  Here is the conceptual machinery you need to untangle this for your essay, broken down step-by-step.

  ### 1. The Selection vs. Endorsement Distinction Under Pressure
  The first knot is whether a vote is a **selection of outcomes** or an **endorsement of agents**.

  *   **The Instrumentalist View:** A vote is a causal lever. I am selecting a policy outcome (preventing War A) rather than endorsing the person (Candidate X). In this view, 'bracketing' is easy. I mentally separate the candidate's moral failings from their causal utility.
  *   **The Expressivist View:** A vote is a speech act. It confers *legitimacy*. When you vote for a candidate, you are adding them to the pool of "acceptable leaders" in the public sphere.

  **The Pressure Test:**
  The distinction breaks down when candidates are "bundled." You cannot vote for Candidate X's tax policy without also voting for their foreign policy.
  *   **The Problem of Public Meaning:** Even if *you* successfully bracket the bad parts internally, the *public meaning* of the vote may not allow it. When Candidate X wins, they claim a "mandate." They say, "The people support my platform."
  *   **The Verdict:** You can bracket internally, but you cannot bracket externally. If the social convention of voting interprets a ballot as a blanket endorsement of the winner's authority to govern *on their terms*, then your instrumental vote functions expressively as an endorsement of the bad parts, regardless of your intent. The "selection" becomes an "endorsement" by virtue of how the system interprets the signal.

  ### 2. Complicity Thresholds
  This leads to your second point: **Complicity.** If I vote for the lesser evil to stop the greater evil, am I complicit in the lesser evil's harms?

  We need to distinguish between **Perpetration** (doing the harm) and **Enablement** (providing the power to do the harm). Voting is enablement.

  *   **The Threshold Concept:** Complicity isn't a binary switch; it's a gradient based on the **margin of harm**.
      *   *Low Margin:* If Candidate A is "bad" and Candidate B is "slightly less bad," voting for B makes you highly complicit in B's badness. The instrumental gain is low, so the moral cost of enabling B is high.
      *   *High Margin:* If Candidate A is "catastrophic" and Candidate B is "flawed," the complicity threshold shifts. Your enablement of B is morally outweighed by your prevention of A.
  *   **Moral Residue:** Even if you cross the threshold and justify the vote, you may still incur "moral residue." This is the idea that you did the *right* thing all-things-considered, but you still touched something dirty. You aren't guilty, but you aren't "clean" either. This explains why voting for a lesser evil often feels alienating—it acknowledges that you are participating in a system where your only options involve some degree of moral compromise.

  **Conceptual Takeaway:** You are complicit in the harms of the lesser evil *only insofar as* those harms were not necessary to prevent the greater evil. If the lesser evil pursues policies unrelated to stopping the greater evil (e.g., they stop the war but also cut welfare), your vote enables that welfare cut. You cannot bracket that.

  ### 3. Conflicting Duties: Participation vs. Integrity
  Now, layer in the **Duty to Vote**.
  *   **Duty of Fair Play/Civic Obligation:** You have a duty to sustain the democratic system. Abstaining might be seen as free-riding on the participation of others.
  *   **Duty of Moral Integrity:** You have a duty not to associate yourself with injustice.

  **The Conflict:**
  In a lesser-evil scenario, these duties collide. The Duty of Integrity says "Do not endorse evil." The Duty of Participation says "Do not let the system collapse into tyranny."

  *   **Resolution:** In political philosophy, the **Duty to Prevent Catastrophe** usually trumps the **Duty of Clean Hands**.
      *   If the election is merely about tax rates, the Duty of Integrity might win (abstain or vote third party).
      *   If the election is about democratic backsliding or human rights violations, the Duty to Prevent Catastrophe wins (vote lesser evil).
  *   **The Trap:** The danger is "Rationalized Complicity." This happens when voters convince themselves a margin is "existential" when it is actually trivial, just to avoid the discomfort of abstaining or third-party voting.

  ### 4. A Stable Principle: The Necessity-Proportionality-Dissent Test
  To distinguish a **Justified Lesser-evil Vote** from **Rationalized Complicity**, you need a three-part test. This can serve as the normative core of your essay.

  1.  **Necessity (Causal Efficacy):** Is my vote actually contributing to stopping the greater evil?
      *   *If the race is a blowout:* Voting lesser-evil is purely expressive (you are endorsing them without stopping the other). Complicity is high, justification is low.
      *   *If the race is close:* Instrumental value is high. Justification is stronger.
  2.  **Proportionality (The Margin):** Is the difference between the candidates significant enough to warrant the moral cost of enablement?
      *   You must be able to articulate specifically *which* harms are being prevented and why they outweigh the harms enabled. Vague "chaos" arguments usually fail this test.
  3.  **Dissent (Signaling):** Can you vote instrumentally while signaling expressive dissent?
      *   This is the key to 'bracketing' externally. If you vote for the lesser evil but publicly state, "I am voting solely to prevent X, not to endorse Y," you alter the public meaning of your vote. You break the "mandate" claim.
      *   *Stability:* A lesser-evil vote is most stable when it is accompanied by public conditions. "I give you my vote to stop A, but I will oppose you if you do B."

  ### Summary for Your Essay
  The conceptual knot exists because voting is a **hybrid act**: it is both a private calculation and a public ritual.
  *   You *can* bracket internally (intent), but you *cannot* fully bracket externally (meaning).
  *   Complicity is determined by the **margin of harm** between candidates. The smaller the margin, the higher your complicity in the winner's bad acts.
  *   The conflict between duties is resolved by **proportionality**: the duty to prevent catastrophe overrides the duty to keep hands clean, *provided* you signal dissent to mitigate the conferral of legitimacy.

  If you frame it this way, you move past "is it okay?" to "under what specific conditions does the moral math work?" That's the philosophical meat your seminar is looking for. Good luck with the essay.
