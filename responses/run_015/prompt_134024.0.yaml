  i also want you to address how this interacts with any duty to vote. if there's a duty to participate but also a duty to avoid complicity, do they conflict? and is there a stable principle that tells us when the lesser-evil vote is justified vs when its just rationalized complicity?

  keep it focused, no need for reading lists or citations - i just need the conceptual machinery clear for my essay. sorry for the typo, writing this between classes lol
