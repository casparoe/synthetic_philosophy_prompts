answer: |-
  hey, good luck with the workshop next thursday. that hybrid view is spicy but i think you can pull it off if you don't get greedy. here's how the room is gonna come at you, ordered by when they'll jump in. i'm telling you exactly how to parry each one. don't waffle.

  **1. the hardline retributivists (opening salvo)**
  they're gonna lead with this: *"if you reject basic desert, you've lost the right to punish based on culpability. you're just detaining people based on dangerousness. that's preventive detention, not justice. you're violating the right not to be used as a means."*

  *   **damage level:** high. this is their core competency.
  *   **concede:** absolutely concede you cannot give them basic desert. do not try to smuggle it back in. if you try to say "well it's kinda like blame," they'll eat you alive.
  *   **hold:** hold that dennett's competence account preserves the *fair notice* requirement better than their view. you're not punishing them for being bad, you're intervening because they had the capacity to respond to reasons and didn't.
  *   **strategy:** pivot to rights protection. argue that your view actually *limits* state power more than theirs. if someone lacks the evolutionary competence (capacity to respond to reasons), your framework forbids intervention. retributivism sometimes punishes the incompetent just because they caused harm. you don't.
  *   **weakest link:** why does "capacity to respond to reasons" matter morally if there's no ultimate responsibility? you need to argue that competence is the only thing that makes normative guidance possible. if you can't guide them, punishing them is just cruelty. defend that link hard. don't let them say it's just utilitarianism.

  **2. the cognitive scientists (mid-session)**
  they're gonna wait for a break then hit you with: *"libet and subsequent readiness-potential studies show the brain decides before conscious awareness. dennett's 'competence' is just a post-hoc narrative. there's no scalar agency at the neural level, so your grading system is fiction."*

  *   **damage level:** medium. they love hearing themselves talk but the lawyers will get bored.
  *   **concede:** concede the micro-level determinism. don't fight the neuroscience.
  *   **hold:** hold the level of analysis. Dennett is talking about software, they're talking about hardware. a chess computer makes moves based on physics, but we still evaluate its competence based on game rules.
  *   **strategy:** refuse to reduce agency to neurons. tell them explicitly: "i'm not making a claim about metaphysics, i'm making a claim about social engineering." if the system responds to reasons at the macro level, that's all the scalar desert needs.
  *   **weakest link:** the emergence gap. how do you get normativity from deterministic neurons? you don't have a full answer here. just insist that functional control is real enough for legal purposes. don't try to solve the hard problem of consciousness in a law workshop.

  **3. the weirdo from the back row (the killer)**
  this is the one you're worried about. they'll wait until the q&a wind-down and say: *"be honest. isn't this just pure consequentialism with extra steps? if desert is just risk-management capacity, you're maximizing safety. where's the constraint? why not lock up the pre-crime high-risk folks if competence is just a gradient?"*

  *   **damage level:** critical. this collapses your whole position if you blink.
  *   **concede:** admit the proximity. don't pretend you're a deontologist.
  *   **hold:** hold that "scalar desert" acts as a proportionality constraint, not just a maximization function. pure consequentialism would punish the innocent if it worked. your view requires *actual competence* demonstrated through action.
  *   **strategy:** commit to the claim that desert language isn't just descriptive, it's a structural limit. argue that treating people as agents (even compatibilist ones) imposes a duty to only intervene when they've exercised their competence poorly. it's not just about risk, it's about *earned* risk status.
  *   **weakest link:** honestly? this is where you're soft. if basic desert is gone, what *really* stops the slide to preventive detention? you need to argue that the *practice* of holding responsible creates a stable equilibrium that pure risk-management doesn't. but admit privately this is the shaky part.

  **general notes on soft spots:**
  don't fake confidence on the consequentialism collapse. that's the genuine soft spot in the theory. if they press hard there, acknowledge the tension. say something like "it's a feature not a bug that we're close to consequentialism, but the desert component adds a rights-based friction."

  also, watch out for the retributivists trying to ally with the scientists. if the scientists say "no agency" and the retributivists say "no agency means no punishment," you're trapped. keep them separated. tell the retributivists the scientists are reductionists, tell the scientists the retributivists are metaphysically bloated.

  you got this. just don't try to be everything to everyone. own the hybrid nature. let me know how thursday goes.
