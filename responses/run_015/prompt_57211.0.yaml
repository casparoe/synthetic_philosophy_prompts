  Hi everyone, I have been turning over the hydrologist's charts and our past six decisions all week, trying to find the through-line that keeps us consistent without turning us into gatekeepers we promised not to be. To get there, I think we need to articulate the rules we have been unconsciously following, so I have drafted three candidates that fit our history without straining the logic, though each has its pressure points. The first rule I would propose is the Conceptual Frame principle, which states that we accept work where the submission uses text or arrangement to shift an object from its utility or natural state into a conceptual proposition. This rule had the easiest time with the forty factory plates, where the statement explicitly defined the arrangement as the work, but it nearly breaks on the invented language submission because the seventeen-year-old likely did not conceive of the desk and lamp as a conceptual frame in the art sense, even if it functioned as one for us. The second rule is the Logic of Multiplicity, which says we accept work where the meaning relies on the accumulation or sequencing of multiple elements rather than the singularity of an object. This rule fits the three hundred pages of invented language most easily, as the volume itself creates the system, but it nearly breaks on the twenty-minute video since a single continuous shot challenges the idea of multiplicity even if time creates the accumulation. The third rule is the Maker's Claim, which dictates that we accept work only where the creator of the objects identifies the submission as an artistic act rather than a utilitarian or natural occurrence. This rule had the easiest time with the rocking chair rejection, as the maker explicitly framed it as a family gift, but it nearly breaks on the plates because the factory made the objects and the artist only arranged them, complicating who the maker actually is.

  When we run these three rules against the hydrologist's charts, they separate quite cleanly. The Conceptual Frame rule votes to accept because the curator has reordered the sheets by water year and written wall text, successfully shifting the documents from administrative records to a narrative about flood cycles. The Logic of Multiplicity also votes to accept because the sixty charts create a visual system where the pattern of flood years leaps out only through the aggregation, much like the pages of the invented language. However, the Maker's Claim rule votes to reject because the hydrologist explicitly stated they are not art, they are his work, and he denies the artistic intent that this rule requires from the creator of the objects. Given this split, my best guess is that we will vote to accept the charts, primarily because privileging the Conceptual Frame and Logic of Multiplicity aligns better with our open-submission mandate than enforcing the Maker's Claim. If we enforce the Maker's Claim, we risk rejecting outsider work where the creator doesn't speak the language of art, which contradicts our acceptance of the seventeen-year-old's language project. We are running a show that looks at the work and the entry form, and here the entry form from the curator provides the frame that the hydrologist did not, effectively doing the artistic labor of reframing the archive.

  The closest analog among our past six verdicts is the forty identical factory plates, as both cases involve utilitarian or industrial items arranged to reveal a concept that transcends their original function. The analogy gives out precisely on the question of authorship, however, because with the plates the artist who arranged them was the one who submitted them and claimed the arrangement as the work, whereas here the arranger is the curator and the maker is the hydrologist who denies the art status. This leads to the question of whose work it is if we accept, and the answer does change depending on which rule got us to yes. If we accept based on the Conceptual Frame, it is fundamentally the curator's work, as they performed the creative act of selection and ordering that transformed the records into art. If we accept based on the Logic of Multiplicity, it is more accurately a collaboration where the hydrologist provided the raw material of labor and the curator provided the narrative structure, though crediting the hydrologist as the primary author feels more ethical given the decades of labor involved. We would not be conferring the work simply by voting yes, but we would be validating the curator's intervention as the artistic gesture.

  By accepting these charts, we would be committing ourselves to the principle that curation is a creative act sufficient to transmute archival material into art, regardless of the original maker's intent. By rejecting them, we would be committing ourselves to the principle that artistic intent must originate with the maker of the objects, and that utilitarian records cannot be redeemed by later framing. To test where our agreed-upon rules might diverge in the future, consider a hypothetical submission for next year consisting of a single unmodified brick entered with a statement claiming it contains the dust of a destroyed library. The Conceptual Frame rule would vote to accept this because the text shifts the brick from building material to historical relic, but the Logic of Multiplicity rule would vote to reject it because a single object cannot create the systemic meaning we require. This split would force us to decide whether a powerful idea attached to a singular object is enough for our show, or if we require the visual weight of accumulation that the charts and the language and the plates all provided. I think we should lean toward the acceptance here, not just because the visuals are extraordinary, but because rejecting them would draw a line around art that feels too close to the gatekeeping we promised to avoid. Let me know what you think before we meet. Best.
