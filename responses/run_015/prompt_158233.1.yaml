answer: |-
  This is a classic set of intuitions that cuts to the heart of decision theory under the Many-Worlds Interpretation (MWI). You have stumbled onto the exact tension that philosophers like David Lewis, David Papineau, and Sean Carroll have wrestled with.

  Your intuitions are mostly coherent and rational, except for **one specific contradiction** that your friend is exploiting.

  Here is the principle that captures nearly all your verdicts, followed by the diagnosis of where your gut is lying to you.

  ### The Principle: Measure-Weighted Continuity

  **"A rational agent should maximize Expected Utility, where the probability of a future outcome is weighted by its quantum measure (squared amplitude), and 'Utility' is assigned only to future states that maintain subjective psychological continuity with the current agent."**

  Let's break down the three components and how they resolve your seven cases.

  1.  **Measure Matters (The Anti-QI Clause):** You do not simply "find yourself" in *any* branch where you exist. The *likelihood* of finding yourself in a branch is proportional to that branch's measure. A branch with $0.5^{30}$ measure is effectively zero probability for decision-making.
  2.  **Continuity Matters (The Anti-Copy Clause):** You care about the continuation of *this* specific stream of consciousness. A perfect copy with your memories is a different subject. If the stream terminates, you are dead, even if a copy wakes up.
  3.  **Value Location Matters (The Altruism Clause):** Utility can be assigned to things outside your own consciousness (e.g., your children's welfare). These utilities accrue across all branches, not just the ones where you survive.

  ---

  ### Applying the Principle to Your 7 Cases

  **1. One run (50/50): ACCEPT.**
  *   **Prediction:** Accept.
  *   **Reasoning:** The measure of survival is 0.5. This is a standard high-risk gamble. The Expected Utility (EU) is positive if \$10M is worth more than 2x the disutility of death risk to you.
  *   **Verdict:** Consistent.

  **2. Thirty runs (1 in a billion): REJECT.**
  *   **Prediction:** Reject.
  *   **Reasoning:** The measure of the survival branch is $\approx 10^{-9}$. Under Measure-Weighted Continuity, the probability of *you* experiencing that branch is one in a billion. The EU is overwhelmingly negative.
  *   **Verdict:** Consistent. (This directly refutes your friend's QI claim).

  **3. Thirty runs (Locked-in): REJECT (Stronger).**
  *   **Prediction:** Reject.
  *   **Reasoning:** Here, the "survival" branches (where you don't die) have high measure, but the *Utility* of those branches is deeply negative (locked-in syndrome). The "death" branches have zero utility for you. Since high-measure branches contain suffering, the total EU is catastrophic.
  *   **Verdict:** Consistent. This confirms that "existence" isn't enough; quality of experience matters.

  **4. Measure (Thin branches): REJECT THE GUT FEELING.**
  *   **Prediction:** Measure *does* matter.
  *   **Reasoning:** Here is your contradiction. In Case 3, you implicitly admit measure matters ("the fat branches are the horrible ones"). In Case 4, your gut says measure is irrelevant ("if there's any branch... that's the one I'll find myself in").
  *   **Diagnosis:** **This intuition is the error.** It is the seductive core of Quantum Immortality. If measure didn't matter, you wouldn't worry about the "fat branches" in Case 3. You must align Case 4 with Case 3: You are overwhelmingly likely to find yourself in the high-measure branches. The "thin" rich branch is statistically negligible.
  *   **Verdict:** **Inconsistent.** You must discard the Case 4 gut feeling to remain coherent with Case 3.

  **5. Other People: REJECT (No Asymmetry).**
  *   **Prediction:** Treat friends exactly like yourself.
  *   **Reasoning:** There is no physical difference between "you" and "your mate" in MWI. Both are patterns of information. If you wouldn't subject him to a 1-in-a-billion survival chance, you shouldn't subject yourself. The asymmetry is a cognitive bias (Solipsism), not a metaphysical truth.
  *   **Verdict:** Consistent (provided you accept the principle demands symmetry).

  **6. The Copy Version: REJECT.**
  *   **Prediction:** Reject.
  *   **Reasoning:** The copy has psychological continuity, but not *causal/subjective* continuity with *this* current stream. The "Continuity" clause of the principle states you care about *your* future experiences. If your stream ends, you don't experience the copy's winnings.
  *   **Verdict:** Consistent.

  **7. Money to Kids: ACCEPT.**
  *   **Prediction:** Accept.
  *   **Reasoning:** The Utility (kids getting money) exists in **all** branches (or at least the high-measure ones where the machine functions). Your death removes your negative utility (fear/suffering) but does not remove the positive utility for the kids. Since the value is located in the high-measure branches, the EU is positive.
  *   **Verdict:** Consistent. This explains why Case 2 feels different: In Case 2, the value is *only* in the low-measure branch. In Case 7, the value is in the high-measure branches.

  ---

  ### The Diagnosis: Where You Are Inconsistent

  You asked which verdict has to go. **It is the intuition in Case 4.**

  Your friend is banking on you believing Case 4 ("I'll find myself in the survival branch regardless of measure") while ignoring the implications of Case 3 ("Most branches are awful").

  *   If measure doesn't matter (Case 4 intuition), then in Case 3 you should be indifferent to the locked-in state, because you'll just find yourself in the one branch where you're fine (assuming there is one). But you rightly feel horror at Case 3 because the *weight* of the bad branches is high.
  *   Once you admit measure matters for Case 3 (quality of life), you must admit it matters for Case 2 (probability of life).

  **The Principle says:** You are not "guaranteed" to experience the survival branch. You are guaranteed to experience *a* branch, but the odds of it being the survival branch are determined by measure. Since the measure of the 30-run survival is negligible, you should expect death.

  ### The Medical Case: 99% Death, 1% Life

  **Question:** Is this Case 1 (one-shot gamble) or Case 2 (quantum suicide)?

  **Analysis:**
  This is a **Case 2** scenario disguised in a white coat.
  *   **Measure:** The survival branch has 0.01 measure. The death branch has 0.99 measure.
  *   **Continuity:** If you die, your stream ends.
  *   **Utility:** 50 healthy years is high positive utility. Death is zero/negative.

  **Verdict:** Under Measure-Weighted Continuity, **you should not take the drug.**
  The Expected Utility is $(0.01 \times \text{50 Years}) + (0.99 \times \text{Death})$. Unless your current life has negative utility (i.e., you are in unbearable, untreatable suffering where death is preferable), the math does not work.

  It is **not** Case 1. Case 1 was 50/50. 50% measure is significant enough for many to risk it for \$10M. 1% measure is generally below the threshold for existential risk, regardless of the payoff, because the "weight" of the future where you exist is too thin.

  **The QI Counter-Argument:** Your friend will say, "But if you take it, you *will* wake up in the 1% branch! You can't experience the 99%!"
  **The Rebuttal:** That is the Case 4 error. If that were true, you should also take the 30-run suicide machine (Case 2). If you wouldn't take Case 2, you can't consistently take the 1% medical risk based on QI logic. You must treat the 1% as a genuine probability of cessation.

  ### A Test Case for You

  To verify if you truly accept **Measure-Weighted Continuity**, consider this variation:

  **The Quantum Lottery:**
  You enter a machine. It measures a quantum particle.
  *   **Outcome A (99% measure):** You are instantly, painlessly killed.
  *   **Outcome B (1% measure):** You win \$1 billion and live.
  *   **Outcome C (0.0000001% measure):** You win \$1 billion, but you are cloned into 1 million identical copies, each thinking they are the original.

  **Question:** Do you enter?
  **Principle Prediction:** **No.** The measure of survival is too low (1%). The existence of copies (Outcome C) does not increase *your* subjective probability of survival, nor does it compensate for the 99% measure where *you* cease.

  If you feel a pull to enter because "Somewhere, a version of me is a billionaire," you are still clinging to the Case 4 error. If you stay out because "I'm almost certainly dead," you have successfully rejected Quantum Immortality in favor of rational decision theory.

  ### Summary for Your Argument

  Tell your mate this:
  1.  **I accept MWI, but I reject Quantum Immortality.**
  2.  **Measure determines subjective probability.** I am more likely to find myself in a high-measure branch. (This kills his 30-run argument).
  3.  **Identity requires continuity.** A copy is not me. (This kills the "someone survives" argument).
  4.  **My Case 3 intuition proves I care about measure.** If I didn't, I wouldn't fear the locked-in branches. Therefore, I must fear the death branches in Case 2.
  5.  **The asymmetry (Case 5) is a bias.** I shouldn't shoot him, so I shouldn't shoot me.

  Your gut on Cases 1, 2, 3, 5, 6, and 7 is correct. Your gut on Case 4 is the only thing that needs correcting. Once you fix that, the whole system holds together.
