answer: |-
  ### The Verdict on Scaffolded Collective Action

  To evaluate Scaffolded Collective Action (SCA) against these frameworks, we must first define the core technical terms. Account A relies on *interlocking attitudes*, meaning each agent intends the joint activity and intends to do their part because others are doing theirs, sustained by *common knowledge*. Account B relies on *joint commitment*, a primitive normative bond where parties agree to act as a *plural subject*, creating obligations and entitlements to rebuke. In the pure SCA case, such as anonymous drivers routed by an algorithm, both accounts classify the activity as merely parallel individual actions rather than genuine joint action. For Account A, the excluding condition is the content of the intention. Drivers intend to reach their own destinations efficiently, not "that we optimize traffic." While their actions are interdependent, they lack the specific interlocking intention regarding the collective outcome. For Account B, the exclusion is categorical: there is no expression of joint willingness among the participants. Drivers commit to the platform's terms, not to each other. Extrapolating strictly from Gilbert's requirements, a plural subject cannot exist without mutual recognition of the commitment among the members themselves. Thus, both accounts deny the status of joint action to pure SCA, viewing it instead as causally interdependent individual behavior coordinated by an external mechanism.

  ### Degree, Kind, and the Human Coordinator

  The failure of both accounts to classify pure SCA as joint action is a matter of kind, not degree. It is not that the mutual responsiveness is too weak or the common knowledge too attenuated; rather, the constitutive elements are entirely absent. There is no intention *that we J* in Account A, and no joint commitment in Account B. This distinction sharpens when considering the variant with a human coordinator. In this scenario, a central agent holds the plan for the overall outcome and intends the participants to comply. Account A can readily classify this as a series of dyadic joint actions between the coordinator and each participant. The coordinator intends "that we optimize traffic" with Driver X, and Driver X intends to do their part by way of the coordinator's instruction. However, this generates no joint action among the participants themselves. They remain strangers. Account B faces a similar asymmetry but with greater friction. Extrapolating from the theory, the coordinator and a single driver could form a plural subject, but the drivers cannot form one among themselves. This asymmetry is not necessarily a problem for either account, but it highlights a limitation: neither account easily accommodates large-scale collective agency where the members are unaware of each other. The "collective" exists only in the eye of the coordinator or the algorithm, not in the interpersonal relations of the participants.

  ### Ownerless Goals and Rebuke-Shaped Reactions

  A defining feature of SCA is the ownerless goal: the system optimizes for traffic flow, a goal represented in the mechanism but aimed at by no participant. Neither account has the resources to attribute this goal to the collective without member endorsement. Account A is reductive; collective goals are simply the content of overlapping individual intentions. If no individual intends the system goal, the collective does not have it. Account B allows a plural subject to have goals distinct from individual members, but only if those goals are the object of the joint commitment. Since no such commitment exists among the drivers, the system goal remains external to the agency of the group. The loss here is explanatory power regarding systemic functionality; both accounts must treat the system's success as an emergent property rather than an intentional achievement.

  Furthermore, society responds to SCA failures with rebuke-shaped reactions, such as congestion charges or platform bans. This resembles collective blame but does not validate either account. Account A can explain these reactions without invoking joint action. Responsibility is attached to institutional roles or causal contribution to harm. A driver is fined because they contributed to congestion, not because they violated a joint commitment. Account B might argue that such reactions indicate a latent social expectation of cooperation, but strictly speaking, Gilbertian entitlements to rebuke arise only from joint commitment. To claim these fines represent genuine interpersonal rebuke is an extrapolation beyond the account's strict conditions. The appearance of collective responsibility can be explained by the institutional framework governing the participants, rather than by the existence of a plural subject. Thus, the folk psychological tendency to blame the "crowd" does not prove the existence of joint action; it proves the existence of shared causal stakes.

  ### The Cost of Accommodation and Paradigm-Dependence

  If we forced these accounts to count SCA as joint action, the costs would be significant. Account A would need to broaden the condition of interlocking intentions to include mediated intentions directed at a system rather than other persons. This costs the account its reductive parsimony and its focus on interpersonal interpersonal glue. It risks collapsing joint action into any functionally coordinated behavior. Account B would need to allow joint commitment without direct expression of willingness among peers, perhaps treating commitment to the mechanism as sufficient. This is the more expensive addition. The tight link between acting together and being obligated to specific others is the core innovation of the plural subject account. Severing the link between commitment and mutual recognition undermines the normative bond that distinguishes Account B from mere regularities of behavior. Therefore, Account B pays a higher theoretical price to accommodate SCA.

  This suggests that SCA cases are degenerate cases rather than borderline paradigms. The standard examples in this literature—walking together, singing a duet—smuggle in face-to-face mutual awareness because that awareness is essential to the phenomenon being defined. Joint action is fundamentally about interpersonal engagement, not just causal interdependence. Excluding SCA is a feature, not a defect, because it preserves the distinction between being socially connected and being merely socially coordinated. To include algorithmic coordination under the same label as a duet would obscure the specific normative and psychological structures that make human collaboration unique. The exclusion protects the concept of joint action from becoming synonymous with any complex system behavior.

  ### The Searlean Alternative

  If collective intentionality is treated as a biologically primitive capacity, as associated with John Searle, SCA is handled differently. On this view, individuals can have "we-intentions" without prior communication or commitment. A driver could simply intend "that we optimize traffic" as a primitive mental state, regardless of whether others share it or know it. This handles SCA better because it allows for collective goals without interpersonal negotiation. However, the cost is explanatory opacity. By making we-intentionality a biological primitive, the account offers less insight into how these intentions are formed or sustained socially. It gains coverage of cases like SCA but loses the ability to explain the normative structures of obligation and entitlement that arise from interaction. It solves the classification problem by lowering the bar for what counts as collective intention, potentially at the expense of understanding the social mechanisms that usually sustain it.
