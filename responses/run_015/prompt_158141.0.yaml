  # Modal Metaphysics: Diagnostic Decision Tree
  **Seminar Handout | Topic: Cross-World Individuation**

  ### The Diagnostic Case: The Ceramic Vase
  Consider a specific ceramic vase, **V**, sitting on the table in the **Actual World**. We are evaluating claims about **V**'s existence in a **Counterfactual World (W2)**. Three scenarios are proposed for W2:
  1.  **Temperature:** A vase exists in W2 made of the same clay but fired at a different temperature.
  2.  **Reassembly:** A vase exists in W2 constructed from the exact same fragments of V, which shattered and were rebuilt.
  3.  **Duplicate:** A vase exists in W2 that is qualitatively identical to V (same shape, color, function) but made of different clay and with no causal connection to V.

  **Instructions:** Answer the following questions based on your metaphysical intuitions regarding this case. Do not worry about standard philosophical labels; answer based on how you believe the world works.

  ---

  ### The Decision Tree

  **Node 1: Ontological Commitment**
  When we assert "Vase V exists in World W2," are we describing a genuine metaphysical constituent of W2, or are we merely expressing a linguistic rule about how we describe Vase V's properties relative to our world?
  *   **(A) Genuine Constituent:** There is a fact of the matter about entities in W2. → *Go to Node 2.*
  *   **(B) Linguistic Rule:** Talk of "other worlds" is just a manner of speaking about possibilities here. → **LEAF 1: Anti-Realism / Deflationism**

  **Node 2: World-Boundedness**
  Focus on the vase in W2. Is it the **very same object** as Vase V (merely located elsewhere), or is it a **distinct object** that resembles or represents Vase V?
  *   **(A) Very Same Object:** V itself is literally present in W2. → *Go to Node 3.*
  *   **(B) Distinct Object:** V is confined to the Actual World; W2 contains a different object that matches V. → *Go to Node 4.*

  **Node 3: Grounds of Identity (The "Thisness" Split)**
  *(For those who chose "Very Same Object")*
  Imagine the vase in W2 was made of **completely different clay** and fired at a **different temperature**, but we stipulate it is "the same vase." Is this metaphysically possible?
  *   **(A) Yes:** Identity can persist even if origin and qualitative properties change. → **LEAF 2: Bare-Identity Haecceitism**
  *   **(B) No:** To be the same object, it must share specific origins or constitutive matter (e.g., the same clay). → **LEAF 3: Kripkean Transworld Identity**

  **Node 4: Grounds of Resemblance (The Similarity Split)**
  *(For those who chose "Distinct Object")*
  For the object in W2 to count as a match for Vase V, must it share the same **causal history** (e.g., formed from the same clay), or is **qualitative similarity** (shape, function, appearance) sufficient?
  *   **(A) Causal History Required:** It must come from the same source material to count as a match. → **LEAF 4: GAP (Incoherent/Unexplored)** *[See Instructor Notes]*
  *   **(B) Qualitative Similarity Sufficient:** Looking and acting the same is enough to count as a match. → *Go to Node 5.*

  **Node 5: Multiplicity (The One-to-Many Split)**
  *(For those who chose "Qualitative Similarity")*
  Can Vase V have **two distinct vases** in World W2 that both count as its match equally well?
  *   **(A) No:** Each actual object can have only one match per world. → **LEAF 5: GAP (Logically Possible but Unattractive)** *[See Instructor Notes]*
  *   **(B) Yes:** One actual object can have multiple matches in a single world. → *Go to Node 6.*

  **Node 6: Actuality (The Privilege Split)**
  *(For those who chose "Multiple Matches")*
  Is the world we inhabit ("the Actual World") **metaphysically privileged** in fixing which objects count as matches, or is "actual" just a label for whichever world we happen to be in (indexical)?
  *   **(A) Privileged:** Our world's status constrains the matching relation asymmetrically. → **LEAF 6: GAP (Incoherent with World-Boundedness)** *[See Instructor Notes]*
  *   **(B) Indexical:** "Actual" is just where we are; the matching relation is symmetric and context-dependent. → **LEAF 7: Lewisian Counterpart Theory**

  ---

  ### Instructor Notes & Gap Diagnostics

  **Diagnosis of Gap Leaves:**
  *   **LEAF 4 (Causal History + Distinct Object):** *Diagnosis: Incoherent/Redundant.* If an object requires the same causal history/constituents to match, it effectively collapses into **Transworld Identity** (Node 2, Path A). Maintaining world-boundedness while demanding causal continuity removes the primary motivation for the "Distinct Object" view (which is usually to avoid transworld identity puzzles).
  *   **LEAF 5 (Similarity + No Multiplicity):** *Diagnosis: Logically Possible but Unattractive.* This position accepts the counterpart relation is based on similarity but denies the flexibility that makes the theory useful (e.g., handling vagueness or fission cases). It incurs the ontological cost of world-boundedness without gaining the logical benefits of counterpart theory.
  *   **LEAF 6 (Similarity + Multiplicity + Privileged Actual):** *Diagnosis: Incoherent.* If objects are world-bound and matched by similarity, privileging the "Actual World" breaks the symmetry required for the indexical analysis of actuality. It suggests a hybrid view that typically collapses into a form of **Transworld Identity** with a fixed reference point (Kripkean), contradicting the "Distinct Object" premise.

  **Indistinguishability Flag:**
  *   **Status:** **None.**
  *   **Explanation:** The branching questions successfully distinguish all four named positions (Anti-Realism, Haecceitism, Kripkean, Lewisian). While **Haecceitism** and **Kripkean Transworld Identity** are close neighbors, Node 3 successfully separates them based on the necessity of origin/constitution. **Lewisian Counterpart Theory** is uniquely identified by the combination of Distinct Object, Qualitative Similarity, Multiplicity, and Indexical Actuality.

  **Pedagogical Note on Node 3:**
  Students selecting **(A)** at Node 3 endorse the view that "thisness" (haecceity) is primitive and independent of qualitative properties. Students selecting **(B)** endorse Origin Essentialism. Be aware that some Kripkeans may accept *some* qualitative variance, but they will reject the *complete* independence of identity from origin implied by the Haecceitist option in this diagnostic context.
