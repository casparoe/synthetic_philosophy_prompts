      *   *Conclusion:* Therefore, the political ideology that utilizes more foundations is morally superior.
      *   *Critique:* This is a classic Naturalistic Fallacy. Just because something is evolved doesn't mean it's *normatively* correct (e.g., tribalism, xenophobia, and aggression are also evolved). MFT is descriptive, not prescriptive. Haidt (the creator) explicitly warns against this interpretation.

