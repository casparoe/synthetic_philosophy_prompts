prompt: |-
  My mate Dave and I got into a massive argument last night about moral foundations theory, and he thinks it basically settles which side is right in politics. His version: the research shows conservatives feel all six foundations — care, fairness, loyalty, authority, sanctity, liberty — while liberals mostly only feel care and fairness, and since the whole point of the theory is that these are real moral values we evolved to pick up on rather than just biases, a morality built out of six genuine values beats one built out of two, so the conservative outlook has the fuller moral psychology. I tried the obvious move, that a story about where moral intuitions come from can't tell you which ones are correct, but he said that misses what a foundation is, and I kinda half conceded and now can't reconstruct why I shouldnt have. So is there any version of his argument that actually works? And if I did buy it, should I be deliberately cultivating the foundations I'm weak in, like a moral multivitamin — practising loyalty, deference, and feeling disgust at harmless taboo violations so I'm not running on two cylinders? And how am I meant to tell whether a gut feeling like that is a perception of a real value or just a bias wearing a value's clothes, given that from the inside they feel exactly the same?
