answer: |-
  **1. The Epistemic Object**
  You argue that the reformer need not understand the original purpose of a practice, nor even its present effects, but only that the opacity itself warrants caution. If the specific function is irrelevant to the burden of proof, and the only claim is that "there was some reason," does your principle not collapse into ordinary causal inquiry? I'm concerned that the rhetoric of ignorance about origins is doing illegitimate work here, shielding the practice from the very cost-benefit analysis you claim isn't the point.

  *   **Likely Reply:** Brace will likely insist that causal inquiry *is* the problem because the reformer's model is necessarily incomplete. She will argue that standard cost-benefit analysis assumes visible variables, whereas Chesterton's Fence protects against *unknown* variables that the model excludes by definition. The "illegitimate work" is done by the reformer's arrogance, not the principle's vagueness.
  *   **Follow-up:** If the protection is against unknown variables in a causal model, then the principle is just a heuristic for high-uncertainty environments. Why, then, does it carry normative weight in low-uncertainty contexts? If I can model 90% of the variables, does the fence still stand, or does your principle retreat until it only applies where we know nothing—in which case, how do we ever begin to learn?

  **2. The Symmetry of Filtering**
  At a recent discussion, a critic suggested that the same test applied to the innovation—asking why it was *never* put up before—paralyzes reform unless you can ground the asymmetry in something other than mere existence. I expect you will answer that the status quo has survived an adversarial filtering process that proposals have not. But how do you account for durable practices that have operated under no such pressure—liturgical vesture, sumptuary rules, or specific degree requirements? In those cases, who carries the empirical burden of showing the filter was actually operating?

  *   **Likely Reply:** She will likely distinguish between "survival" and "selection," arguing that even practices under low pressure have survived the passive filtering of human attention and resource allocation. She will contend that the burden remains on the reformer to prove the practice is *noise* rather than *signal*, regardless of the pressure level.
  *   **Follow-up:** If survival alone signals function, even without adversarial pressure, then inertia becomes a justification. If I must prove a degree requirement is noise, but you need only point to its age, have you not shifted the burden of proof so heavily that the "filter" becomes a post-hoc rationalization for whatever happens to persist? What empirical test distinguishes a practice that survived because it works from one that survived because no one bothered to remove it?

  **3. The Dead Fence**
  Let's talk about termination conditions. What would you count as evidence that a fence is genuinely dead? I need a historical case you would concede—a specific rule or norm where the burden of proof was met and removal was the correct epistemic choice. Furthermore, if the principle is to be more than a veto, is there any configuration of evidence that would fail your test for retention?

  *   **Likely Reply:** Brace will likely cite a case of technological obsolescence where the causal mechanism became transparent, such as certain maritime signaling protocols replaced by radio. She will argue the principle fails the test for retention when the "opaque work" is made fully visible and found to be nonexistent or achievable by less costly means.
  *   **Follow-up:** In the case of maritime protocols, the function wasn't discovered to be absent; it was discovered to be *redundant*. Is there a case where the function was discovered to be *harmful* yet the practice persisted, and you would still have counseled retention until the moment of repeal? If not, does the principle only protect useful fences, or does it also protect harmful ones until the harm becomes undeniable?

  **4. Burke's Restoration**
  Burke defended the 1688 settlement not as an innovation but as a restoration of ancient liberties. Yet, almost every reformer claims to be restoring a prior, truer state rather than innovating. If the moral weight of the argument rests on the distinction between restoration and innovation, what distinguishes them in practice? Is there a factual criterion, or does it rely entirely on the reformer's historical narrative?

  *   **Likely Reply:** She will likely argue that the distinction lies in the continuity of the legal or social fabric. A restoration works *through* existing institutions and precedents, whereas an innovation attempts to stand outside them. She will suggest that the "narrative" is testable against the institutional record.
  *   **Follow-up:** But institutions are malleable. The Soviet Constitution guaranteed rights; the French Revolution claimed to restore natural law. If the reformer can always construct a narrative of restoration that fits the institutional record selectively, does your reliance on Burke's distinction not hand the keys to whoever tells the better story? How do we adjudicate between competing claims of restoration without begging the question?

  **5. The Language Analogy**
  You draw an analogy between inheriting a practice and inheriting a language, leaning on Burke's image of a partnership among the living, the dead, and the unborn. But a grammar is not a command; it is a structure that enables speech without punishing deviation with sanction. When the inherited item is a rule enforced by the state, what carries the normative authority across the analogy?

  *   **Likely Reply:** Brace will likely respond that language *does* carry sanctions—social unintelligibility is a penalty akin to legal sanction. She will argue that the normative authority comes from the necessity of shared coordination, which requires submission to rules we did not write, whether linguistic or legal.
  *   **Follow-up:** Unintelligibility is a natural consequence; imprisonment is a deliberate imposition. If the "grammar" of our social order requires that some speakers be silenced or incarcerated to maintain the syntax, does the analogy not break? At what point does the need for coordination cease to justify the cost of the sanction, and who is authorized to make that calculation if not the participants?

  **6. Institutionalizing the Principle**
  You have proposed institutionalizing this principle by requiring a documented account of a rule's history before repeal. I worry that this burden is easily discharged by perfunctory archival work—a box-ticking exercise that satisfies the letter of your principle without engaging the spirit. Why does no equivalent burden fall on those who keep the rule to demonstrate its ongoing utility?

  *   **Likely Reply:** She will likely argue that the asymmetry is necessary because repeal is irreversible in a way that retention is not. She will contend that the archival requirement forces a "pause" that disrupts the momentum of reform, which is the primary value, regardless of the quality of the documentation.
  *   **Follow-up:** If the value is the pause rather than the knowledge gained, then you are advocating for friction, not epistemic humility. If a perfunctory document secures the pause, have you not created a bureaucratic hurdle that privileges those with the resources to produce documents over those who suffer under the rule? Does this not turn the principle into a tool of administrative entrenchment rather than philosophical caution?

  **7. The Asymmetry of Harm**
  Your principle places the burden of proof on the remover, implying that the error of removing a useful fence is worse than the error of keeping a useless one. But this assumes the costs of retention are negligible. In cases where the fence enforces a hierarchy or sustains an injustice, the cost of retention is paid daily by specific people. How does your epistemic principle weigh the certainty of present suffering against the possibility of future disorder?

  *   **Likely Reply:** Brace will likely acknowledge the tension but argue that "disorder" is not merely inconvenience but the breakdown of the social epistemic fabric. She will suggest that suffering must be weighed, but that radical intervention often exacerbates suffering in the long term by destroying the latent functions that alleviate other harms.
  *   **Follow-up:** That is a utilitarian calculation disguised as epistemic caution. If you admit that suffering must be weighed, then the fence is not protected by opacity but by a specific calculation of consequences. If the suffering is severe enough, does the opacity still matter? Or are you ultimately arguing that stability is a higher good than the relief of the suffering the stability produces?

  **8. Falsifiability and Concession**
  To close: what would actually move you? Is there a class of cases, an episode, or an empirical finding that would lead you to restrict or abandon the principle? I am asking for the condition under which Dr. Brace would say, "Here, the fence should have been torn down sooner, and my framework failed to see it."

  *   **Likely Reply:** She will likely point to a scenario where the "opaque work" was proven to be purely malign with no compensating social function, perhaps citing a specific totalitarian decree that survived purely through coercion without any organic social uptake.
  *   **Follow-up (Standard):** If the practice survived through coercion, was it ever a "social practice" in your sense, or merely an imposition? If your principle only applies to organic practices, how do we distinguish them from impositions without already knowing the answer to the moral question?
  *   **Follow-up (If she concedes nothing):** If you cannot name a case where your principle would have voted for removal faster than history did, then the principle is not a guide to judgment but a description of the status quo. If no empirical finding could restrict it, is it not unfalsifiable? And if it is unfalsifiable, what work is it doing in a political theory that claims to be grounded in evidence?
