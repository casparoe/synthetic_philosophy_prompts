answer: |-
  You are not being pedantic. In an upper-level ethics seminar, the distinction between incommensurability and incomparability is usually the *entire point* of the assignment. If a student conflates them, they have missed the core theoretical lesson, even if they have the right intuition about the example.

  Here is a suggested grade and a breakdown you can use to justify it to yourself and the student.

  ### **Grade: 14/20 (C+)**

  **Rationale:** The student demonstrates a clear grasp of the *definition* of incommensurability and provides a standard, correct example. The writing is coherent. However, they fail the primary instruction of the prompt ("Distinguish incommensurability from incomparability") by effectively collapsing the two concepts. Consequently, their conclusion about rational choice is philosophically unsupported according to the standard literature (e.g., Chang, Raz, Nussbaum) typically taught in this context.

  ---

  ### **Point-by-Point Breakdown**

  **1. Definition of Incommensurability (5/5 points)**
  *   **What's Right:** The student correctly identifies incommensurability as the lack of a "common measure" or "common currency." This is the technical definition.
  *   **Verdict:** Full credit. They understand the baseline concept.

  **2. The Example (5/5 points)**
  *   **What's Right:** "Life versus money" is the classic example for a reason. It clearly illustrates two goods that resist reduction to a single metric.
  *   **Verdict:** Full credit. The example is appropriate and well-applied to the definition.

  **3. Distinguishing Incommensurability from Incomparability (0/5 points)**
  *   **What's Wrong:** The prompt explicitly asks to *distinguish* them. The student writes: *"when values are incommensurable they end up being incomparable too."*
  *   **Why it matters:** This is the critical error. On the standard view, **incommensurability does not entail incomparability.** Two items can lack a common metric (incommensurable) but still stand in a value relation (comparable). For example, you can know a career in art is *better* than a career in accounting for you, without being able to quantify *how much* better in a single unit. By saying there is "no fact of the matter about which one is more valuable," the student describes incomparability, not incommensurability, and claims the former follows necessarily from the latter.
  *   **Verdict:** This is the main learning objective of the question, and they missed it.

  **4. Rational Choice (4/5 points)**
  *   **What's Right:** They acknowledge that a choice can still be *made* ("you're not stuck").
  *   **What's Wrong:** They claim the choice must be **arbitrary** ("like flipping a coin") because there is "no rational basis."
  *   **Why it matters:** This follows from their conflation above. If values are merely incommensurable (no common scale), reason can still guide choice through qualitative judgment (e.g., "this aligns more with my commitments"). Reason only "runs out" (making choice arbitrary) if the values are *incomparable*. Since the student argued they are incomparable, their internal logic is consistent, but their premise is flawed.
  *   **Verdict:** Partial credit. They answered the question, but the answer relies on the philosophical error identified in point 3.

  ---

  ### **Specific Feedback on the Two "Moves"**

  You asked specifically about the two moves that worried you. Here is how to assess them:

  **Move 1: "When values are incommensurable they end up being incomparable too."**
  *   **Verdict:** **This is a mistake.**
  *   **Explanation:** This is not just casual word usage; it is a substantive philosophical claim that contradicts the dominant view in contemporary value theory (often associated with Ruth Chang's work on "parity" or Joseph Raz's work on incommensurability). The standard teaching is that incommensurability is about *measurement*, while incomparability is about *relation*. You can have a relation without a measurement. By collapsing them, the student fails to distinguish the concepts as requested.

  **Move 2: "The choice has to be made arbitrarily... because there's no rational basis."**
  *   **Verdict:** **This is a mistake (in this context).**
  *   **Explanation:** This is a "decisionist" view (reason ends, will begins). While defensible in some existentialist or Weberian frameworks, in a seminar asking for a distinction between incommensurability and incomparability, the expected answer is usually that **incommensurability does not preclude rational choice.** We make rational choices between incommensurable values all the time (e.g., choosing to visit a dying friend rather than finish a paper) without needing a common metric to prove it was the "maximizing" choice. The student denies the possibility of qualitative rationality.

  ---

  ### **Suggested Comments for the Student**

  If you want to be constructive, you might write something like this in the margins or summary:

  > "You have a strong grasp of the definition of incommensurability and your example is excellent. However, you lose significant points on the distinction between incommensurability and incomparability. You write that incommensurable values 'end up being incomparable,' but the standard view in value theory is that they do not.
  >
  > Think of it this way: Incommensurability means we lack a **scale** (like a ruler), but Comparability means we can still judge **relations** (like 'better than' or 'on a par with'). I can know that spending time with my family is better than working late, even if I can't assign a numerical value to that difference.
  >
  > Because you conflate these two, you conclude that choice must be 'arbitrary.' If you accept that incommensurable values are still comparable, you can see that we often have rational reasons for choosing one over the other, even without a common metric. Review the course readings on 'parity' or qualitative comparison to refine this distinction."

  ### **Final Advice for the TA**
  Don't second-guess yourself. In an upper-level seminar, precision with terminology *is* the philosophy. If you let this slide, you validate the idea that "fancy words are interchangeable," which is exactly what you feared. Docking points here teaches them that the distinction does real work in the argument.
