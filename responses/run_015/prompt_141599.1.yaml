answer: |-
  **Brainstorming**
  Three candidates: (1) Wetland drainage for housing; (2) Forest to silviculture; (3) Floodplain meadow to intensive grazing. I discard (1) because housing permanently removes animal capacity, violating matched cohorts. I discard (2) because tree rotation cycles make death-count matching empirically unstable over 50 years. I commit to (3) because grassland management allows precise control over stocking density and turnover rates, enabling matched cohorts while varying life quality and death types.

  **1. The Scenario**
  The site is a 50-hectare temperate floodplain meadow (UK). The horizon is 50 years.
  **Option A (Preservation):** Rewilding. The existing vertebrate population (water voles, field mice; ~5,000 individuals) remains. Mechanism: Non-intervention. Animals die via predation, disease, or exposure.
  **Option B (Conversion):** Drainage for intensive hay production. Mechanism: Immediate cull of existing population via fumigation, followed by restocking to maintain ecological density for pest-predator balance, with annual managed culling of surplus.
  Both options maintain 5,000 sentient individuals on-site at all times. Turnover is 100% annually. Total animal-years: 250,000. Total deaths: 250,000 (including initial cull in B). Both are lawful planning options; B qualifies as agricultural development, A as conservation offsetting.

  **2. The Ledger**
  *Unit: Welfare Points (WP). Horizon: 50 years. Total Animal-Years: 250,000. Total Deaths: 250,000.*

  | Parameter | Option A (Preservation) | Option B (Conversion) |
  | :--- | :--- | :--- |
  | **Positive Welfare Rate** | +20 WP / animal-year | +4 WP / animal-year |
  | **Negative Welfare Rate (Living)** | -2 WP / animal-year | -1 WP / animal-year |
  | **Mean Life Length** | 1.0 year | 1.0 year |
  | **Cost of Dying (One-off)** | -15 WP (Predation/Starvation) | -3 WP (Managed Cull) |
  | **Net Welfare per Life** | +3 WP | 0 WP |
  | **Suffering per Life (Neg + Death)** | 17 WP | 4 WP |
  | **Total Net Welfare** | +750,000 WP | 0 WP |
  | **Total Suffering** | 4,250,000 WP | 1,000,000 WP |

  *Consistency Check:* 5,000 animals × 50 years = 250,000 animal-years. 100% annual turnover = 250,000 deaths. Option B initial cull (5,000) + managed deaths (245,000) = 250,000. Matched within 0%.

  **3. The Three Verdicts**
  **SPT:** Minimizes total suffering. Option B total suffering (1,000,000 WP) is significantly lower than Option A (4,250,000 WP). The lexical priority on suffering dictates **Conversion**.
  **SNWT:** Maximizes net welfare. Option A total net welfare (+750,000 WP) exceeds Option B (0 WP). Despite higher suffering, the higher positive welfare rate in the wild yields a greater sum. SNWT dictates **Preservation**.
  **PPV:** A side-constraint protecting existing possessors. Option B involves the immediate killing of the 5,000 currently existing animals to benefit future replacements. This violates the claim against being killed for the sake of others. PPV dictates **Preservation**.

  **4. Sensitivity Analysis**
  The pivotal parameter is the **Cost of Dying** in Option A. Currently set at -15 WP.
  For SPT to flip to Preservation, Option A's total suffering must drop below Option B's (1,000,000 WP).
  Calculation: $250,000 \times (\text{Neg Rate} + \text{Death Cost}) < 1,000,000$.
  $250,000 \times (-2 + \text{Death Cost}) < 1,000,000 \rightarrow \text{Death Cost} < 6 \text{ WP}$.
  The death cost would need to drop from -15 to below 6 WP. Given that predation and starvation involve prolonged distress compared to fumigation, a reduction of this magnitude is empirically implausible. The verdict is robust against moderate empirical error.

  **5. The Flip Test**
  **Variant:** Delayed Conversion. The planning authority approves Option B but implements it only after the current cohort dies naturally (approx. 1 year delay).
  **Result:** PPV switches to **Permitting Conversion**.
  **Explanation:** PPV prohibits killing *existing* animals for the sake of others. If conversion occurs only after natural death, no existing animal is killed or made worse off; the constraint is not triggered. SNWT and SPT verdicts remain unchanged because the ledger concerns the 50-year horizon of future lives, which are identical in both the immediate and delayed conversion scenarios. This isolates PPV's deontic reliance on current existence.

  **6. The Best Objection**
  An SPT defender argues: "The quantification of wild suffering is speculative. Predation is often quick, and wild animals experience intense positive welfare from freedom and natural behaviors that captivity denies. You have stipulated high suffering to force the verdict."
  **Classification:** This is a dispute about **empirical facts** regarding the phenomenology of wild animals versus managed ones.
  **Assessment:** It succeeds only if field ecologists confirm wild death is less traumatic than managed culling. However, current evidence suggests predation involves significant terror and pain, whereas humane culling is near-instant. Until empirical consensus shifts, the SPT verdict stands on the available data.

  **7. Closing Note**
  This case establishes that disagreement between suffering-prioritarians and net-welfare totalists is not merely an artifact of population size differences. Even with matched cohorts, the shape of lives (quality vs. death cost) generates divergent policy prescriptions. It does not establish which view is correct, only that the conflict is structural and robust under controlled empirical conditions.
