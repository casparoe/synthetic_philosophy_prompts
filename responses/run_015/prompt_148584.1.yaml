answer: |-
  # Workshop Session Plan: The Falsification Budget Simulation

  **Session Title:** The Cost of Defense: A Simulation of Demarcation and Immunization
  **Duration:** 75 Minutes
  **Participants:** 14 Graduate Students
  **Facilitator:** Instructor

  ## I. Learning Objectives
  1.  **Visceralize the Duhem-Quine Problem:** Experience the difficulty of isolating a core theory from auxiliary assumptions during empirical failure.
  2.  **Operationalize Lakatosian Degeneration:** Feel the strategic tension between saving a theory and producing novel content.
  3.  **Critique the "Falsification Budget":** Identify the utility and limitations of quantifying scientific tolerance.

  ## II. Room Setup & Materials
  *   **Seating:** Three distinct islands. Two "Lab Tables" (Theorists), one "Observation Deck" (Anomalies), one "Board Room" (Panel).
  *   **Materials:**
      *   12 Physical Tokens (6 per Research Program), colored red (Immunization Tokens).
      *   Scoreboard (Whiteboard).
      *   "Anomaly Cards" (Pre-written empirical contradictions).
      *   "Revision Forms" (Paper for Theorists to write auxiliary adjustments).
      *   Timer (Visible to all).

  ## III. Roles (14 Students)
  1.  **Research Programs (6 students):** Divided into **Team Alpha** and **Team Beta** (3 members each).
      *   *Goal:* Survive with the highest Prestige Score.
      *   *Asset:* A "Hard Core" claim (assigned by facilitator) and 3 Immunization Tokens.
  2.  **Anomaly Generators (4 students):** Represent "Nature" and "Competing Data."
      *   *Goal:* Deplete Theorists' tokens without causing total collapse (a dead program yields no points).
  3.  **Funding Panel (4 students):** Represent "The Community/Journal/Grant Agency."
      *   *Goal:* Maximize Field Health (balance between rigor and diversity of thought).
      *   *Power:* Demarcation authority and Token Replenishment.

  ## IV. Simulation Rules & Payoff Structure

  ### 1. The Core Mechanics
  *   **The Hard Core:** Each Team is assigned an unfalsifiable axiom (e.g., Alpha: "All market behavior is rational"; Beta: "All social structures are language games"). This cannot be changed.
  *   **The Immunization Token:** When an Anomaly is presented, the Team *must* either:
      *   **A) Accept Falsification:** The program is retired. (Score: 0).
      *   **B) Spend a Token:** Propose an auxiliary revision to explain the anomaly while keeping the Core intact.
  *   **The Budget:** Each team starts with **3 Tokens**. If tokens reach 0, the team enters "Critical Status."

  ### 2. The Payoff (Prestige Points)
  *   **Survival Bonus:** +10 Points per round survived.
  *   **Token Conservation:** +5 Points per token remaining at the end.
  *   **Novelty Bonus:** If a Revision predicts a *new* phenomenon (verified by Panel), +10 Points.
  *   **Ad Hoc Penalty:** If the Panel deems a revision "Ad Hoc" (saves the theory but predicts nothing new), -5 Points.

  ### 3. Panel Powers
  *   **Demarcation Vote:** If a team hits 0 Tokens, the Panel must vote: "Science" (allow 1 final round) or "Pseudoscience" (immediate elimination).
  *   **Replenishment:** The Panel may grant a new Token to a team at any time, **BUT**:
      *   Requires a 3/4 majority vote.
      *   Costs the Team 10 Prestige Points (The "Bailout Tax").
      *   Anomaly Generators may veto one replenishment per game.

  ## V. Precise Timeline (75 Minutes)

  ### Phase 1: Setup & Briefing (10 Minutes)
  *   **00-05:** Assign roles randomly. Distribute Core Claims and Tokens.
  *   **05-10:** Explain rules. Emphasize: *"You are not playing yourself; you are playing the structural incentives of your role."*
  *   **Facilitator Note:** Do not mention Popper, Lakatos, or Kuhn yet. Use only game terminology.

  ### Phase 2: The Simulation (35 Minutes)
  *   **Round 1 (10 Mins):**
      *   Anomaly Generators play 2 cards per Team.
      *   Theorists decide: Spend Token or Accept Falsification.
      *   Panel observes silently.
  *   **Round 2 (10 Mins):**
      *   Anomaly Generators play 2 cards per Team (increased difficulty).
      *   Theorists must submit written "Revision Forms" for token spends.
      *   Panel reviews Revisions for "Ad Hoc" penalties.
  *   **Round 3 (15 Mins):**
      *   **Crisis Mode:** Any team with 1 or 0 tokens is publicly highlighted.
      *   Panel opens floor for "Replenishment Requests."
      *   Anomaly Generators attempt to force final collapses.
      *   Final Scores calculated.

  ### Phase 3: Structured Deliberation Protocol (30 Minutes)
  *   **10 Mins: Role De-roling.**
      *   Ask participants to state one emotion they felt during the game (e.g., "frustration," "guilt," "cunning").
      *   Write these on the board.
  *   **10 Mins: Structural Analysis.**
      *   Ask the Panel: *"What criteria did you actually use to grant tokens? Was it truth, or social utility?"*
      *   Ask the Theorists: *"At what point did you feel the revision was dishonest? Did the token count change your honesty?"*
  *   **10 Mins: Facilitator Synthesis.** (See Debrief Section below).

  ## VI. The Debrief: Philosophical Mapping

  *Facilitator Script Notes: Transition from game mechanics to philosophical concepts. Do not distribute reading lists. Speak conceptually.*

  ### 1. The Asymmetry of Falsification (Popper)
  *   **Game Moment:** The pressure to spend a token rather than accept falsification.
  *   **Concept:** In logic, a single counter-instance falsifies a universal claim. In the game, you were allowed to survive counter-instances.
  *   **Discussion:** Why was it so hard to quit? Because in practice, data is noisy. Popper argued we *should* falsify easily, but the game shows why scientists *don't*. The "Token" represents the logical gap between data and theory.

  ### 2. Ad Hoc Adjustments vs. Progressive Problem Shifts (Lakatos)
  *   **Game Moment:** The Panel penalizing "Ad Hoc" revisions vs. rewarding "Novelty."
  *   **Concept:** Lakatos argued that all research programs face anomalies. The difference between science and pseudoscience isn't the presence of anomalies, but whether the program predicts *new* facts (progressive) or merely patches old holes (degenerating).
  *   **Discussion:** Did your revisions explain the anomaly *and* tell us something new? Or did they just explain the anomaly? The "Prestige Points" for Novelty were a proxy for Lakatos's "Heuristic Power."

  ### 3. The Social Dimension of Demarcation
  *   **Game Moment:** The Panel's power to replenish tokens via vote.
  *   **Concept:** Demarcation is not just a logical relation between theory and world; it is a social negotiation. A program is "science" because the community treats it as such.
  *   **Discussion:** Panelists, did you bail out a failing team because they were "right" or because you wanted to keep the game interesting? This mirrors how funding bodies keep paradigms alive for sociological reasons.

  ### 4. Flagging the Pedagogical Device (Crucial Step)
  *   **Facilitator Statement:** "We must now identify the artifice. In real science, **there is no Falsification Budget.** There is no rule that says 'three strikes and you are out.'"
  *   **Analysis:**
      *   **The Artificial Constraint:** The hard limit of 3 tokens is a pedagogical device to force a crisis. In reality, the limit is fuzzy, retrospective, and often infinite (e.g., Newtonian mechanics survived anomalies for centuries via auxiliary hypotheses like 'Planet Vulcan').
      *   **The Danger:** If students leave thinking science has a hard count of allowable failures, they have misunderstood. The point of the simulation was to make you feel the *desire* for such a limit, even though it doesn't exist.
      *   **The Takeaway:** The "Budget" is not a rule of nature; it is a metaphor for the finite patience of the scientific community.

  ## VII. Anticipated Malfunctions & Corrections

  ### 1. Informal Collusion (The "Old Boys Network")
  *   **Symptom:** Theorists and Panelists make eye contact or side-deals to transfer tokens without penalty.
  *   **Correction:** **The Secret Ballot Rule.** Immediately institute a rule that Panel votes on Replenishment must be written on slips of paper and handed to the Facilitator. Announce: *"Transparency reduces trust; secrecy enforces structural pressure."*

  ### 2. Personalization of Failure
  *   **Symptom:** A Theorist becomes defensive or quiet after losing tokens, treating it as intellectual incompetence.
  *   **Correction:** **Role Reinforcement.** Interrupt the flow briefly. Remind the room: *"You are defending a Hard Core claim assigned to you, not your own intellect. The pressure you feel is the pressure of the *structure*, not your ability. Lean into the frustration; that is the data point we need."*

  ### 3. Anomaly Generator Passivity
  *   **Symptom:** Anomaly Generators are too nice, offering easy anomalies that don't threaten the Core.
  *   **Correction:** **The Incentive Realignment.** Remind Anomaly Generators of their payoff: *"You gain points for every Token spent. If they don't spend tokens, you don't win. Be ruthless."*

  ### 4. The "Zombie Program"
  *   **Symptom:** A team hits 0 tokens, the Panel refuses to demarcate them, and the game drags on with a dead theory.
  *   **Correction:** **The Hard Stop.** The Facilitator holds veto power. If a team has 0 tokens and no Replenishment, the Facilitator declares "Demarcation Enforced." Explain post-game that this simulates the eventual historical erasure of degenerating programs, even if it takes time.

  ## VIII. Closing Statement (Facilitator)
  "We simulated a budget because we crave clarity. We want to know exactly when a theory dies. But the discomfort you felt when the tokens ran out—that ambiguity, that social negotiation, that reluctance to let go—is the actual history of science. The 'Falsification Budget' does not exist. The only budget is the community's willingness to listen. Next week, we discuss how that willingness is historically determined."
