answer: |-
  This is a mature frustration. The literature on democratic backsliding has exploded since 2015, but it suffers from what Sartori called "conceptual stretching": the term covers so much (from Hungary's constitutional overhaul to US norm violations) that it risks explaining nothing.

  If you want to avoid normative shouting and produce rigorous political science, you need to treat "backsliding" not as a phenomenon you observe, but as a **measurement and conceptual validity problem**.

  Here is the breakdown of the field's current epistemic status, followed by a defended ordering of research priorities for a PhD timeline.

  ### Part 1: The Epistemic Map (Settled vs. Contested)

  Do not build your dissertation on the assumption that the following are facts. Many are active battlefields.

  **What is Settled (High Consensus)**
  *   **Mode of Death:** Democracies are no longer dying primarily via military coups (hard breaks); they are dying via gradual, legalistic erosion (soft breaks). (Bermeo 2016).
  *   **The Mechanism:** Incumbents generally use existing institutional levers (executive orders, legislative majorities, court appointments) rather than suspending the constitution outright.
  *   **The Trajectory:** The process is typically incremental, making it hard to pinpoint the exact moment a regime ceases to be democratic.

  **What is Genuinely Contested (High Disagreement)**
  *   **Intentionality:** Is backsliding a *strategic design* by autocratic entrepreneurs (Levitsky & Ziblatt), or can it be the unintended consequence of polarization and incompetence (Grillo)? If a leader erodes norms accidentally, is it backsliding?
  *   **Measurement Validity:** Most datasets (V-Dem, Freedom House) rely on expert surveys. If experts are influenced by media narratives (which are often partisan), the data encodes the bias you dislike. There is no consensus on objective behavioral indicators.
  *   **The Baseline:** There is no agreement on the counterfactual. When we say democracy "declined," declined relative to what? A theoretical ideal? The previous year's score? A synthetic control of similar countries?
  *   **Reversibility:** Is backsliding a one-way ratchet, or is it cyclical? If a country backslides and then recovers, was it ever "backsliding" or just fluctuating?

  ---

  ### Part 2: Prioritized Lines of Work

  Here is the ordering based on **Upstream Necessity** (you can't do the rest without this) vs. **Tractability** (you can actually finish this in 3-4 years).

  #### Priority 1: Conceptual Disaggregation (Upstream Necessity)
  **The Task:** Decouple *strategies* from *outcomes*.
  **The Problem:** Currently, "backsliding" conflates the *means* (court-packing, media capture) with the *end* (regime type change). This allows critics to label any aggressive use of executive power as backsliding, even if the regime remains electorally competitive.
  **The Work:**
  *   Do not try to define "democracy." Instead, create a typology of **autocratic legalism**. Distinguish between *Executive Aggrandizement* (weakening checks), *Promissory Constraint* (making promises that bind future governments), and *Norm Erosion* (unwritten rule breaking).
  *   Argue that "backsliding" should only be coded when specific *combinations* of these strategies result in a measurable reduction in electoral uncertainty or civil liberty protection, not merely when a leader acts normatively poorly.
  *   **Why First?** If you skip this, your empirical work (Priority 2) will be accused of measuring "policies I dislike." You must define the concept narrowly enough to be falsifiable.
  *   **Tractability:** High. This is theoretical work, coding frameworks, and case selection. It forms the backbone of your dissertation proposal.

  #### Priority 2: Measurement Independence (Tractable Empirics)
  **The Task:** Move from expert perception to behavioral indicators.
  **The Problem:** V-Dem is the gold standard, but it relies on country experts. If those experts read the *New York Times* or *Financial Times*, their coding of the US or Hungary correlates with Western media narratives. This validates your fear of the "partisan slur."
  **The Work:**
  *   Develop or utilize objective proxies for institutional erosion. Examples:
      *   **Legislative Behavior:** Rate of emergency decrees vs. standard legislation; speed of bill passage (bypassing committee review).
      *   **Judicial Behavior:** Government win-rates in constitutional courts; tenure length of judges post-reform.
      *   **Media Market Structure:** Ownership concentration metrics rather than "media freedom" scores.
  *   Test whether these behavioral metrics correlate with V-Dem scores. If they diverge (e.g., V-Dem says backsliding, behavioral data says status quo), you have a paper on measurement bias.
  *   **Why Second?** Once you have your conceptual typology (Priority 1), you need to measure it. This is where you get journal articles. It is empirically rigorous and avoids normative claims about "democratic quality."
  *   **Tractability:** High. Data exists (legislative records, court databases); it just needs cleaning and re-framing.

  #### Priority 3: The Counterfactual Baseline (High Risk/High Reward)
  **The Task:** Operationalize the "Baseline Democracy."
  **The Problem:** You asked: *Who gets to decide the baseline?* Currently, the baseline is often implicit (e.g., "liberal democracy as it existed in 1995"). This is ahistorical.
  **The Work:**
  *   Instead of asking "Is this country less democratic than an ideal?", ask "Is this country less democratic than it would have been given its structural conditions?"
  *   Use **Synthetic Control Methods** or **Matching**. Construct a "synthetic" version of Hungary or the US based on economic inequality, polarization, and historical institutional strength, but *without* the specific incumbent policies. Compare the actual trajectory to the synthetic counterfactual.
  *   **Why Third?** This is methodologically difficult and philosophically thorny. If you fail to identify a good control group, the project collapses. However, if successful, it solves the "policies I disagree with" problem by controlling for structural factors.
  *   **Tractability:** Low to Medium. Requires strong quantitative skills and a convincing identification strategy.

  ---

  ### Part 3: Evidence That Would Change This Ranking

  Science is provisional. Here is what would force you to reprioritize:

  1.  **If V-Dem/Global Democracy Data releases "Objective" Modules:**
      *   *Change:* If major datasets successfully integrate behavioral/algorithmic coding (e.g., automated text analysis of constitutions or legislative procedures) that gains field acceptance, **Priority 2 drops**. You can rely on their metrics and focus entirely on theory (Priority 1) or causality.
      *   *Current Status:* They are moving this way (e.g., V-Dem's automated coding of constitutions), but expert coding still dominates the core regime indices.

  2.  **If a Consensus Emerges on "Intentionality":**
      *   *Change:* If the field definitively settles that backsliding *must* be intentional (or definitively that it doesn't matter), **Priority 1 becomes easier**. You can adopt the consensus definition.
      *   *Current Status:* Unlikely. The tension between "strategic autocrats" and "polarized democracies" is central to the current debate.

  3.  **If "Backsliding" is Abandoned for "Regime Hybridity":**
      *   *Change:* If the field pivots back to studying "Electoral Authoritarianism" (Levitsky/Way) and treats "backsliding" as a transient buzzword, you should pivot to **Hybrid Regime Stability**.
      *   *Current Status:* "Backsliding" is still dominant in top journals (*APSR*, *AJPS*, *World Politics*), but there is growing fatigue. Watch the call-for-papers for major conferences.

  ### Summary Advice for the PhD

  1.  **Don't solve the definition of Democracy.** That is a philosophical black hole. Solve the definition of **Erosion**. Focus on the *delta* (change), not the *level* (state).
  2.  **Be explicit about the "Partisan Slur" risk.** Make it a feature of your methodology. In your dissertation, include a robustness check where you code cases "blind" to the incumbent's ideology to show your metric isn't capturing partisan bias.
  3.  **Pick Cases that Break the Mold.** Don't just study Hungary and the US. Study a case where executive aggrandizement happened but democracy *didn't* backslide (resilience), or a case where norms eroded but elections remained free. This helps you disentangle the concepts.

  **The Winning Strategy:**
  Treat "Democratic Backsliding" as a **measurement validity crisis**. Your contribution isn't proving backsliding is happening; it's proving we can measure it without relying on the subjective judgments of experts who are embedded in the same polarized media ecosystems as the politicians they study. That is a methodological contribution that survives the next semantic shift in the field.
