          4.  Specific memory check: Did Anderson say communities shouldn't be judged by genuineness but by *style* of imagination?
      *   **Goal:** A clear, speakable guide for the discussion leader to validate the critics, correct the book's oversimplifications, and clarify the actual theories of Hobsbawm and Anderson without getting bogged down in jargon.

