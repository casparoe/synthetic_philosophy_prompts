          *   *Verdict:* Oversimplification. Modernism (Gellner, Anderson, Hobsbawm) argues *political* nationalism is modern, but ethnie/sense of belonging often has pre-modern roots (Smith's ethno-symbolism). The book is too absolute here.
      *   *Claim 2: Hobsbawm = Traditions are fake propaganda.*
          *   *Verdict:* Partial truth. *The Invention of Tradition* argues rituals are constructed to establish continuity. But "invented" doesn't mean "lies." It means "formalized." Hobsbawm focused on *state* nationalism. He acknowledged popular sentiment but focused on elite manipulation.
      *   *Claim 3: Anderson = Print capitalism = Imagined Community = Fiction.*
          *   *Verdict:* Distortion. "Imagined" $\neq$ "Imaginary/Fake." It means you can't know everyone, but you feel a bond. Anderson is not debunking nationalism as "false"; he's explaining *how* it became possible. He is sympathetic, not cynical.
      *   *Claim 4: Plasticity (Elites can dial it up/down at will).*
          *   *Verdict:* False. Both theorists acknowledge constraints. You can't just invent a nation out of thin air; it needs cultural raw material. State projects fail (as the Kurdish/Catalan members noted) because the "soil" isn't there.
      *   *Claim 5: Moral/Political Conclusion (It's fake, so don't love it).*
