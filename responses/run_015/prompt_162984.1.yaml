      *   *Refining the Hobsbawm point:* Need to make sure I distinguish *The Invention of Tradition* (edited volume) from Hobsbawm's own *Nations and Nationalism*. The book seems to blend them. Hobsbawm was a Marxist; he wanted to show nationalism distracts from class. But he didn't think it was *easy* to manufacture.
