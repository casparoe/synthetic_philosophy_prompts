      *   *Kurdish/Catalan Cases?* Yes, they trouble the "State creates Nation" model. They fit better with "Nation seeks State" or ethno-symbolism (Anthony D. Smith). The standard Modernist account (Gellner/Anderson) struggles with *why* specific cultural groups mobilize if not just random print capitalism.
      *   *Political Conclusion?* Non-sequitur. Knowing the history of a thing doesn't dissolve its moral claim (Isaac Berlin/Nationalism distinction).
