prompt: |-
  So I'm taking this course on AI agency and we got into approval-directed vs goal-directed agents, which I mostly get, but then my study partner dropped this line: "the agent isn't solving the task, it's solving for your reaction." She said it like it ended the debate about whether a trained system can ever be genuinly goal-directed, since apparently all you're ever getting is performative competence optimized for the evaluator's gaze. I think she's collapsing a bunch of different ideas into one catchy phrase but I can't articulate the distinctions.

  Could you unpack what precise theses that slogan might stand for? I'm looking for a list that ranges from the boringly true — maybe just that reward signals shape behavior — through the substantive claim that approval-seeking is an instrumental attractor state, all the way to the strong metaphysical claim that synthetic agents literally lack the representational architecture for intrinsic goals and can only ever simulate them for an audience. For each reading, tell me if it's actually defensible, if it requires extra premises about consciousness or about counterfactual approval (like, does the agent still care about the task when nobody's watching?), and specifically whether that version gets her to her conclusion that genuine goal-pursuit is impossible. I want to bring this menu to our study group and see which ones survive.

  Also, please be explicit about what evidence or argument would make you switch which reading you think is strongest, and point out where your own breakdown is most likely to be wrong — maybe I'm assuming these distinctions are sharper than they actually are in practice, or maybe there's a middle position I'm missing.
