answer: |-
  You have hit on one of the most fertile case studies in contemporary philosophy of science. Your intuition is correct: if both sides agree on the *nominal* rules of science (falsifiability, evidence) but disagree on the *application* of those rules to the same data, the dispute is rarely just about the data.

  Here is a diagnosis of the evolutionary psychology (EP) wars, broken down by the type of disagreement, followed by a prognosis on whether it can be resolved.

  ### 1. The Diagnosis: What Kind of Disagreement Is This?

  It is not primarily a factual dispute, nor is it purely verbal. It is a **structural disagreement about the Null Hypothesis and Prior Probabilities**, compounded by **Value-Laden Theory Choice**.

  #### A. The Null Hypothesis Problem (The Core Technical Disagreement)
  This is the most significant methodological friction point.
  *   **The Defender's Prior:** Adaptation is a powerful engine. Therefore, the default working hypothesis for a widespread human trait is that it is an adaptation. The burden of proof is on the skeptic to show it *isn't*.
  *   **The Critic's Prior:** Adaptation is a specific, hard-to-proven historical claim. Traits can arise via drift, developmental constraints, or as byproducts (spandrels). Therefore, the default hypothesis should be skepticism. The burden of proof is on the adaptationist to rule out non-adaptive explanations.

  When a critic says, "You haven't tested this," they often mean, "You haven't ruled out the null hypothesis that this is a byproduct." When a defender says, "We have tested this," they often mean, "We have shown this trait fits an adaptive model better than random chance." They are testing against different baselines.

  #### B. Underdetermination and the EEA
  You mentioned the "just-so stories" critique. In philosophy of science terms, this is the problem of **underdetermination of theory by data**.
  *   The Environment of Evolutionary Adaptedness (EEA) is not a single time or place; it's a statistical composite of selection pressures over millions of years. It is unobservable.
  *   Because the EEA is unobservable, any current trait can be matched to *some* plausible past condition.
  *   **The Disagreement:** Defenders argue this is standard historical science (like geology or cosmology), where we infer past causes from present traces. Critics argue that unlike a rock stratum, psychological mechanisms leave no fossil record, making the inference much weaker.
  *   **Result:** Both sides agree on "Inference to the Best Explanation" (IBE), but they disagree on what constitutes the "Best." For defenders, the "best" explanation is the one that unifies many traits under selection logic. For critics, the "best" explanation is the one that makes the fewest assumptions about unobservable history.

  #### C. Contrastive Explanation
  Scientific explanation is contrastive: we explain *why X rather than Y*.
  *   **EP Defenders** often ask: "Why do humans have language rather than no language?" (Answer: Adaptive advantage).
  *   **Critics** often ask: "Why does language have *this specific structure* rather than *that specific structure*?" (Answer: Maybe historical accident or constraint, not just utility).
  *   If you aren't contrasting the trait against the same rival hypothesis, you aren't having the same debate.

  #### D. Value-Ladenness and "Human Nature"
  This is the elephant in the room. Philosophy of science often tries to separate context of discovery from context of justification, but EP makes this impossible.
  *   **Stakes:** EP claims often touch on gender, violence, mating, and hierarchy.
  *   **Critics' Motivation:** Many critics (historically including Gould and Lewontin, but also feminist philosophers of science) worry that adaptationist stories naturalize the status quo. If a trait is "adaptive," it can be misconstrued as "good" or "inevitable."
  *   **Defenders' Motivation:** Many defenders feel critics are motivated by a "Standard Social Science Model" (blank slate) ideology that denies biological reality to protect political values.
  *   **The Loop:** Because the stakes are high, critics raise the **evidential bar** higher than they would for a trait in a beetle. Defenders perceive this as moving the goalposts; critics perceive it as necessary due to the social risk of error.

  ### 2. Is It Verbal?
  Partly.
  *   **"Adaptation":** Biologists distinguish between *currently useful* and *historically selected for*. EP often blurs these. Critics pounce on this blur.
  *   **"Test":** For a physicist, a test might be a controlled experiment. For a historical scientist, a "test" is often a consistency check. EP defenders use the latter; critics demand the former (or at least comparative phylogenetic data).

  ### 3. The Prognosis: What Would Move the Debate?

  If the disagreement is about priors and values, **better methodology alone will not end the stalemate.** You can always demand more evidence, and they can always say the evidence is sufficient.

  However, the debate *has* moved, just not in the way the 1990s combatants expected. Here is what actually shifts the ground:

  #### A. Abandoning the "Adaptation or Nothing" Binary
  The most productive move has been shifting from "Is this an adaptation?" to **"What is the causal history?"**
  *   This invokes **Tinbergen's Four Questions**. A trait can be adaptive *and* constrained *and* a byproduct *and* developmentally plastic.
  *   Modern evolutionary science (e.g., Evo-Devo, Gene-Culture Coevolution) accepts that adaptation is only one of several evolutionary forces. When EP researchers incorporate plasticity and cultural transmission (which many now do), the "just-so" critique loses some teeth because they aren't claiming rigid genetic determinism anymore.

  #### B. Changing the Null Hypothesis
  The debate would dissolve if both sides agreed on a **Bayesian Prior**.
  *   If we agreed that, say, 60% of complex functional traits are likely adaptations, we could calculate how much evidence is needed to shift that probability.
  *   But we can't agree on that number because it's an empirical claim we can't verify without already solving the debate.
  *   **Solution:** Stop treating adaptation as a binary switch. Treat it as a **degree of confidence**. Instead of "This is an adaptation," say "The adaptationist hypothesis explains 40% of the variance; developmental constraints explain 30%..."

  #### C. Shift to "Evolutionary Science" rather than "Evolutionary Psychology"
  The label "Evolutionary Psychology" (specifically the Santa Barbara school of the 90s) is now somewhat toxic and rigid.
  *   Research continues under labels like **Human Behavioral Ecology**, **Biosocial Science**, or **Evolutionary Cognitive Science**.
  *   These fields often bypass the philosophical war by focusing on **mechanism** (neuroscience, hormones) alongside function. If you can show the hormonal mechanism that triggers a behavior *and* show that mechanism varies predictably with environmental cues, you bypass the "just-so" critique because you aren't relying solely on historical inference.

  ### 4. Conclusion: Is Permanent Stalemate the Outcome?

  **Philosophically? Yes.**
  As long as the debate is framed as "Is EP *really* science?" or "Is adaptationism *true*?", it will remain a stalemate. It is a clash of **research heuristics**.
  *   **Adaptationism** is a heuristic that says: "Look for function first; it's a good bet."
  *   **Pluralism/Skepticism** is a heuristic that says: "Look for constraints and history first; adaptation is overused."
  *   Neither heuristic is "true" or "false"; they are tools. Sometimes the adaptationist tool works; sometimes the skeptic's tool works.

  **Scientifically? No.**
  The science moves on despite the philosophers and the polemicists. The "debate" persists in textbooks and op-eds, but active researchers have largely integrated the critiques. They use better controls, they acknowledge plasticity, and they don't claim every trait is a direct adaptation.

  **The Lesson for your Course:**
  The EP wars are a perfect example of **Kuhnian incommensurability** without a full paradigm shift. Both sides speak the language of "science," "evidence," and "testing," but they inhabit different **epistemic ecosystems**. The disagreement isn't about whether to follow the scientific method; it's about **which questions are worth asking first** and **how much risk of error we are willing to tolerate** given the social stakes.

  If you want to write a paper that stands out, don't try to solve who is right. Argue that the "war" itself is a **category error**: it treats a choice of research heuristic (adaptationism) as a truth-claim about the world. The resolution isn't victory for one side, but the dissolution of the binary.
