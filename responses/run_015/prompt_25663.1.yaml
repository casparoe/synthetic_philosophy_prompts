      *   Key philosophical concepts relevant here: Underdetermination of theory by data, Theory-ladenness of observation, Demarcation problems, Adaptationism (Gould/Lewontin vs. Dennett), Null hypotheses.

  3.  **Deconstruct the Disagreement (Diagnosis):**
