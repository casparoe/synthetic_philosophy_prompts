          *   Evo Psych Default: Traits are adaptations until proven otherwise (or at least, adaptation is the interesting hypothesis).
          *   Critic Default: Traits could be byproducts, drift, or spandrels. Adaptation is a heavy claim requiring heavy proof.
      *   *Is it verbal?* Somewhat. "Adaptation" can mean "currently useful" vs. "historically selected for." "Test" can mean "consistent with model" vs. "uniquely predicted by model."
      *   *Is it ideological?* Yes. Human nature implications (gender roles, violence, mating) make the stakes high, leading to motivated reasoning on both sides.

  4.  **Synthesize the Diagnosis (The "Real" Issue):**
      *   It's a **Bayesian/Prior Probability Disagreement** masked as a methodological one.
      *   It's about the **Null Hypothesis**.
      *   It's about **Contrastive Explanation**. What are we comparing the adaptationist story *against*?
      *   It's also **Value-Laden**. The stakes regarding human nature make critics more skeptical and defenders more defensive.

  5.  **Address the "What would move the debate?" Question:**
      *   *Better methodology?* Maybe, but methods are already there (cross-cultural, comparative, archaeological). The problem is interpretation.
      *   *Different question?* Yes. Shift from "Is this trait an adaptation?" to "What is the causal history?" (Tinbergen's four questions).
      *   *Stalemate?* Likely permanent *at the philosophical level*, but scientific progress happens *despite* it. The field evolves (literally) into more nuanced models (gene-culture coevolution, plasticity).

