answer: |-
  **Q&A Prep: Williams & Integrity**
  **Order: Likelihood × Damage**

  **1. The Rule-Consequentialists**
  **Q:** "Why isn't agent-relative rules enough? If the optimal code says 'protect your own projects,' haven't you accommodated integrity without abandoning consequentialism?"
  **A:** "No. That treats integrity as a *permission* granted by the system. My claim is that projects are *constitutive* of agency. Think about the deliberation: If I save my spouse because the rules allow it, I've still added 'one thought too many.' The justification remains external to the relationship. Integrity requires the reason to flow from the project itself, not from a rule optimizing overall value. You're solving a coordination problem; I'm addressing the structure of motivation."
  **Weakness:** Risks sounding like you're denying the coherence of rule-based motivation entirely. Hard to prove they can't internalize the rule deeply enough to bypass the "one thought."

  **2. The Senior Person**
  **Q:** "Bernard wasn't making a metaethical point about reasons. He was making a psychological point about alienation. You're over-intellectualizing his phenomenology."
  **A:** "I respect that intimacy, but the phenomenology *entails* the metaethics. If impartial justification requires me to view my projects as dispensable inputs, that structural demand *causes* the alienation. You can't separate the experience of integrity from the structure of justification producing it. I'm not disputing his intent; I'm arguing the psychology proves the theoretical flaw. The feeling of alienation is the symptom of the justificatory disease."
  **Weakness:** You're telling a colleague what their friend "really" meant. High risk of sounding presumptuous or arrogant.

  **3. The Kantian**
  **Q:** "Doesn't the latitude in imperfect duties already secure this space? I can pursue projects so long as I don't violate perfect duties."
  **A:** "Latitude is a gift from the Moral Law. It says, 'You may do this.' Williams says projects are reasons *because they are mine,' not because morality looks the other way. Consider the deliberative stance: Your view still makes morality the sovereign; integrity makes morality a neighbor. I'm arguing for plural sources of value, not delegated freedom. The project provides the reason, not the lack of a prohibition."
  **Weakness:** Requires audience to accept a pluralistic theory of reasons. Kantians will reject the 'neighbor' metaphor as anarchic or irrational.

  **4. The 'Prayer' Question (The Nazi Objection)**
  **Q:** "If ground projects generate reasons independent of impartial morality, what stops my ground project from being fascism? Are you saying integrity trumps moral constraints?"
  **A:** "This is the standard worry, but Williams isn't arguing integrity justifies *anything*. He's arguing impartialism can't account for *why* we act even in permissible cases. We need a threshold constraint, but below that threshold, impartialism shouldn't dictate weighting. The objection targets the *currency* of justification, not the absence of constraints. I'm not defending evil projects; I'm defending the structure of good ones."
  **Weakness:** Admitting a threshold constraint concedes ground to impartialism. Looks like you're smuggling in the morality you're critiquing to avoid the monster objection.

  **5. The Particularist**
  **Q:** "Why do you need a theory of 'structure' here? Isn't this just seeing the situation correctly?"
  **A:** "I agree cases matter, but utilitarianism is a theory demanding theoretical refutation. Pointing to cases isn't enough; we need to show why their justificatory structure *must* fail to capture agency. Particularism helps, but doesn't explain why the impartial model is structurally blind. We need to diagnose the error, not just avoid it. Otherwise, we leave the theoretical machinery intact."
  **Weakness:** Might concede that your own theoretical framing is unnecessary, undermining your paper's contribution.
