answer: |-
  Your seminar-mate is using a metaphor as a substitute for a mechanism. The phrase "Saturn devouring his children" is rhetorically powerful because it conflates a descriptive observation (revolutionaries often kill each other) with a causal explanation (the nature of revolution *requires* this).

  To defeat the conversation-stopper, you need to show that the sentence is either a tautology (true by definition, thus empty) or a contingent empirical claim (true sometimes, thus not inevitable).

  Here is the menu of precise claims hidden inside that aphorism, sharpened from your sketch and expanded with the necessary structural arguments.

  ### 1. The Retrospective Labeling Claim
  *(Refining your Selection-Effect Claim)*
  **The Claim:** The term "children of the revolution" is not applied to participants until after they are purged. Survivors are reclassified as "founders" or "statesmen." Therefore, the statement is true by linguistic convention, not historical causality.
  **Verdict:** **Trivial.**
  **Inevitability vs. Probability:** This supports **logical inevitability**, but only because it rigs the definition. It makes the claim unfalsifiable.
  **Testability:** To test this, you would need to identify a revolutionary leader who remained a "child of the revolution" in the historical discourse *without* being killed or purged. If your seminar-mate insists that anyone who survives wasn't a "true" child, they are admitting this is a semantic game, not a historical law.

  ### 2. The Heterogeneous Coalition Claim
  *(Refining your Coalition-Fragmentation Claim)*
  **The Claim:** Revolutions require a broad alliance to succeed (e.g., bourgeoisie, peasants, urban poor). These groups have incompatible end-states. Once the common enemy (the Monarchy) is removed, the coalition must fracture. The "devouring" is simply the winning faction eliminating the losing faction of the original alliance.
  **Verdict:** **Plausible-but-in-need-of-an-argument.**
  **Inevitability vs. Probability:** This supports **high probability**, not inevitability. It depends on the diversity of the coalition. A homogenous revolutionary vanguard might not fracture this way.
  **Testability:** The baseline is a revolution achieved by a politically homogenous group that maintains power without purging its own leadership. If a revolution occurs where all leaders share the exact same vision for the day *after* victory, and they still kill each other, this claim fails.

  ### 3. The Violence Ratchet Claim
  *(Refining your Escalation/Commitment Claim)*
  **The Claim:** Revolutionary violence delegitimizes non-violent arbitration. Once the regime uses extralegal force to seize power, it establishes violence as the only valid currency of politics. Moderates are "devoured" because they are unwilling to bid as high in the currency of violence as the extremists.
  **Verdict:** **Plausible.**
  **Inevitability vs. Probability:** This supports **structural momentum**. It suggests a "slippery slope" that is hard to stop but not impossible. It relies on the specific choice to use violence initially.
  **Testability:** We would need a case where a revolution seized power violently, but then successfully institutionalized non-violent arbitration *during* the crisis period, preventing the escalation. If the violence stops *before* the leadership purge begins, this claim is weakened.

  ### 4. The Epistemic Paranoia Claim
  *(Refining your Informational Claim)*
  **The Claim:** Revolutionary ideology posits a perfect future. Any failure to achieve that future immediately implies sabotage. Since external enemies are often weak, the sabotage must be internal. Purging insiders becomes the only rational way to explain policy failure without admitting ideological error.
  **Verdict:** **Plausible (specifically for ideological revolutions).**
  **Inevitability vs. Probability:** This supports **conditional inevitability**. It applies only to revolutions based on totalizing ideologies (like Jacobinism or Communism), not necessarily to revolutions based on procedural changes (like voting rights).
  **Testability:** A revolution driven by procedural goals (e.g., "we want elections") rather than substantive moral transformation (e.g., "we want a New Man") should not exhibit this paranoia. If a procedural revolution purges its leaders, this claim fails.

  ### 5. The Indivisible Sovereignty Claim
  *(New Claim)*
  **The Claim:** Revolutions often replace a King with "The People" or "The Nation," conceived as a singular will. Political opposition is thereby redefined not as loyal dissent, but as treason against the singular will. You cannot oppose the Revolution without opposing the People; therefore, revolutionary factions cannot coexist. One must be the "true" voice, the rest must be silenced.
  **Verdict:** **Plausible (and historically potent for the French case).**
  **Inevitability vs. Probability:** This supports **conceptual necessity** within that specific framework. If you accept the premise that the Revolution represents a singular Will, purging dissenters is logically consistent.
  **Testability:** A revolution that conceptualizes sovereignty as pluralistic or federated from the start. If a revolution explicitly builds institutions for permanent factional competition (loyal opposition) and survives, this claim is falsified.

  ### 6. The Institutional Vacuum Claim
  *(New Claim)*
  **The Claim:** Revolutions destroy the old legal order before a new one is stable. In the absence of courts, constitutions, or succession rules, power struggles cannot be adjudicated. They are settled by force. The "children" are devoured because there is no courtroom, only the guillotine.
  **Verdict:** **Plausible.**
  **Inevitability vs. Probability:** This supports **situational probability**. It suggests the violence is a function of *institutional failure*, not revolutionary essence.
  **Testability:** A revolution where the old legal framework is largely preserved or a new one is instantiated *before* the leadership struggle begins.

  ---

  ### The Baseline Question: How to Test This

  Your seminar-mate wants to treat "devouring children" as a law of nature. To challenge this, you must force them to define the **counterfactual**.

  **What counts as a Revolution that did NOT devour its children?**
  You need a case that satisfies the definition of "Revolution" but lacks the purge.
  *   **Criteria for Revolution:** A fundamental, rapid transfer of sovereignty accompanied by mass mobilization (distinguishing it from a mere coup or palace intrigue).
  *   **Criteria for "Not Devouring":** The primary leadership cohort survives the transition, remains in power (or retires peacefully), and is not executed/imprisoned by their revolutionary successors.

  **Candidate Baselines:**
  1.  **The Glorious Revolution (1688):** Transferred sovereignty, established new constitutional order. No mass execution of the revolutionary leaders by their successors.
      *   *Seminar-mate's likely counter:* "It wasn't a *real* revolution, it was an invasion/coup."
      *   *Your rebuttal:* If they define "Real Revolution" as "Must have a Terror," they have conceded your point: the Terror is part of the definition, not a consequence.
  2.  **The Carnation Revolution (Portugal, 1974):** Military-led, mass mobilization, transition to democracy. The leaders did not purge each other in a bloodbath.
      *   *Seminar-mate's likely counter:* "It was military, not political."
      *   *Your rebuttal:* Why does the uniform matter? The political dynamic of coalition fragmentation applies equally.
  3.  **The Velvet Revolution (Czechoslovakia, 1989):** Total regime change, mass mobilization. The dissident leaders became the government without purging each other.
      *   *Seminar-mate's likely counter:* "The enemy collapsed on its own; there was no struggle."
      *   *Your rebuttal:* This proves contingency. If the enemy collapses, the "Ratchet" (Claim 3) and "Sovereignty" (Claim 5) claims don't trigger.

  **The Trap to Avoid**
  Your seminar-mate is likely engaging in **Conceptual Stipulation**. They are defining "Revolution" implicitly as "The French Revolution."
  *   If they say, "Any revolution that doesn't purge its leaders wasn't a *true* revolution," then the sentence "Revolutions devour their children" is **Analytic**. It is true the way "Bachelors are unmarried" is true. It tells you nothing about history, only about how they use words.
  *   If they admit that some revolutions *don't* purge their leaders, then the sentence is **Synthetic**. It is a claim about the world that can be false. If it can be false, it is not inevitable.

  **Your Winning Move**
  Ask them: *"Is the phrase a prediction or a definition?"*
  *   If it's a **prediction**, ask for the case where it failed (Portugal 1974, Czechoslovakia 1989). If they can't explain why those don't count without referencing the lack of violence, they are arguing in a circle.
  *   If it's a **definition**, point out that definitions don't explain causes. Saying "Revolutions devour their children" becomes as useful as saying "Fire burns." It describes the outcome but offers no leverage to prevent it or understand the specific mechanics of the French Terror.

  **Verdict on the Seminar-Mate's Usage:**
  They are using a **Trivial** claim (Retrospective Labeling) disguised as a **Causal** claim (Violence Ratchet/Sovereignty). They are asserting inevitability where there is only high probability, and they are protecting this assertion by moving the goalposts of what counts as a "revolution."
