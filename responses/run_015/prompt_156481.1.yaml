      *   *Case 2: Race-coded proxies (ZIP + insurance) in cardiovascular risk.*
          *   *Analysis:* This is dangerous. It attempts to smuggle race in as a "neutral" variable. It reifies structural racism as biological risk.
          *   *Outcome:* **Hard Stop.** This is the "engineering resistance" case. Engineers love proxies for accuracy; ethics says this creates a feedback loop of denial of care based on structural bias.
          *   *Decision:* Reject. Use direct clinical markers instead.

      *   *Case 3: Banking-pattern financial-stress index (class proxy).*
