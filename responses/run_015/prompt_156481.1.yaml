answer: |-
  **MEMORANDUM**

  **TO:** Product Engineering & Data Science Teams
  **FROM:** Lead, Data Ethics & Governance
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Procedure for Interactive Kind Features (IKF Protocol v1.0)

  ### 1. Context and Mandate

  The Board has formally adopted the position that categories such as race, gender, and socioeconomic status (SES) are **interactive kinds**, not natural kinds. Following Ian Hacking's framework, this means these categories are not static biological facts; they evolve through being classified, measured, and acted upon. When our models use these features, we do not merely predict reality; we participate in shaping it.

  To operationalize this, the following **Interactive Kind Feature (IKF) Protocol** is now mandatory for any model proposal involving these categories or their proxies. This is not a suggestion box; it contains hard stop points and required hand-offs to the Ethics Review Board (ERB).

  ---

  ### 2. The IKF Protocol: A Decision Procedure

  **Phase 1: Ontological Verification (The "What")**
  *   **Step 1.1: Source Audit.** Is the feature self-reported, clinician-observed, or algorithmically inferred?
      *   *Flag:* If inferred (e.g., name-based race imputation), **STOP**. Inferred interactive kinds reify stereotypes without subject agency.
  *   **Step 1.2: Granularity Check.** Is the category binary/coarse (e.g., M/F) or multidimensional (e.g., gender identity spectrum)?
      *   *Flag:* Coarse categorization of complex social realities requires ERB hand-off.

  **Phase 2: The Looping Effect Assessment (The "So What")**
  *   **Step 2.1: Intervention Pathway.** If the model flags a patient, what action is taken? (e.g., more screening, denial of coverage, referral).
  *   **Step 2.2: Feedback Loop Simulation.** Will that action change the patient's relationship to the category?
      *   *Example:* Does labeling a group "high risk" for mental health issues based on gender increase stigma, thereby worsening outcomes?
      *   *Stop Point:* If the action reinforces a harmful institutional stereotype without direct clinical benefit, **EXCLUDE FEATURE**.
  *   **Step 2.3: Institutional Context.** Does this feature proxy for structural bias (e.g., ZIP code as race, credit score as worth)?
      *   *Stop Point:* If the feature encodes historical discrimination as biological risk, **EXCLUDE FEATURE**.

  **Phase 3: Necessity and Alternatives (The "Now What")**
  *   **Step 3.1: Direct Measure Test.** Can we measure the physiological or social mechanism directly rather than using the category?
      *   *Example:* Instead of "race," use specific genetic markers or social determinants of health (SDOH) data.
      *   *Flag:* If a proxy is used instead of a direct measure, justify why the direct measure is unavailable.
  *   **Step 3.2: Reflexivity Safeguard.** If included, how will we monitor if the model is changing the prevalence or meaning of the category over time?
      *   *Requirement:* Must establish a drift monitor specifically for this feature's impact on outcomes.

  **Phase 4: Final Authorization**
  *   **Hand-off:** Any feature passing Phase 3 requires sign-off from the ERB before training begins.
  *   **Documentation:** The "Model Card" must explicitly state the interactive nature of the feature and the known looping risks.

  ---

  ### 3. Application to Current Proposals

  Below is the audit of the three active proposals currently in the pipeline.

  #### Proposal 1: Self-Identified Gender in Mental-Health Screening
  *   **Feature:** Patient self-reported gender identity (non-binary options included).
  *   **Phase 1 Audit:** Source is self-reported (Pass). Granularity is multidimensional (Pass).
  *   **Phase 2 Audit:** Intervention is referral to therapy.
      *   *Looping Risk:* High. Labeling women or non-binary individuals as "high risk" for depression could reinforce essentialist narratives about emotional stability.
      *   *Institutional Context:* Mental health disparities are real but socially mediated. Ignoring gender hides the disparity; using it risks stereotyping.
  *   **Phase 3 Audit:** Direct measure? No physiological test for depression risk. Gender is a necessary sociological control.
  *   **Decision:** **INCLUDE WITH SAFEGUARDS.**
  *   **Requirements:**
      1.  Model cards must explicitly state that risk correlations reflect social stressors, not biological essentialism.
      2.  Clinicians receiving the risk score must be provided with context prompts regarding social determinants.
      3.  **ERB Hand-off:** Required to review clinician prompts.

  #### Proposal 2: Race-Coded Proxies (ZIP Code + Insurance Type) in Cardiovascular Risk
  *   **Feature:** Composite variable derived from home ZIP code and insurance payer type.
  *   **Phase 1 Audit:** Source is administrative (Pass). Granularity is coarse (Flag).
  *   **Phase 2 Audit:** Intervention is care prioritization (high risk = more aggressive management).
      *   *Looping Risk:* Critical. Using ZIP/Insurance as a proxy for race encodes redlining and structural inequity as "clinical risk."
      *   *Institutional Context:* This treats the *result* of systemic racism (lack of access) as a *cause* of biological risk. It creates a feedback loop where underserved populations are deemed "too risky" or "too costly," potentially justifying reduced resource allocation.
  *   **Phase 3 Audit:** Direct Measure? Yes. Use blood pressure, cholesterol, family history, and smoking status.
  *   **Decision:** **EXCLUDE FEATURE (Hard Stop).**
  *   **Rationale:** This violates Step 2.3. It reifies structural bias as biological destiny. The engineering team will note that removing this drops the model AUC (accuracy) by 4%. **We accept the accuracy loss to prevent ethical harm.**

  #### Proposal 3: Banking-Pattern Financial-Stress Index (Class Proxy)
  *   **Feature:** Index derived from transaction volatility, overdraft frequency, and debt-to-income ratios (via open banking API).
  *   **Phase 1 Audit:** Source is inferred behavioral data (Flag).
  *   **Phase 2 Audit:** Intervention is "social work referral."
      *   *Looping Risk:* High. Being classified as "financially stressed" in a medical record could impact insurability or employment if data leaks. It changes the patient's institutional standing.
      *   *Institutional Context:* Financial stress is a valid health determinant, but the measurement is intrusive.
  *   **Phase 3 Audit:** Direct Measure? Self-reported financial hardship is available but less "accurate."
  *   **Decision:** **CONDITIONAL INCLUDE.**
  *   **Requirements:**
      1.  **Opt-In Only:** Patients must explicitly consent to financial data analysis for health purposes.
      2.  **Data Containment:** This index cannot leave the clinical environment (no sharing with payers or third parties).
      3.  **ERB Hand-off:** Required to audit data security protocols.

  ---

  ### 4. The Friction Point: Engineering Resistance

  I anticipate significant resistance regarding **Proposal 2 (Cardiovascular Risk)**.

  **The Engineering Argument:** The data science team will argue that ZIP code and insurance type are highly predictive. Excluding them reduces model performance, potentially missing high-risk patients in marginalized communities who lack traditional clinical markers due to lack of prior care. They will argue that "blinding" the model to these proxies creates a less effective tool for the very people we aim to help.

  **The Ethics Rebuttal:** This argument confuses *prediction* with *causation*. The model predicts risk accurately *because* it detects where the healthcare system has failed people, not because those people are biologically prone to disease. By baking this into the risk score, we institutionalize the failure. We tell the system: "This patient is high risk because they live in a redlined zone," rather than "This patient is high risk because the system has denied them care."

  **Resolution:** We will not use the proxy. Instead, Engineering must work with Clinical Operations to build a separate **Equity Adjustment Layer**. If a patient is under-screened due to socioeconomic factors, we flag them for *outreach*, not higher *clinical risk*. We treat the access gap as an operational problem, not a biological feature.

  ---

  ### 5. Limitations of This Procedure

  While the IKF Protocol provides a robust framework for decision-making, the team must understand what it **cannot** resolve:

  1.  **It cannot fix societal injustice.** We can refuse to encode bias in our models, but we cannot solve the structural racism or economic inequality that generates the data disparities in the first place.
  2.  **It cannot guarantee fairness.** A model can pass this audit and still produce disparate impacts due to unmeasured confounding variables. This procedure minimizes *design* harm, not *outcome* variance.
  3.  **It relies on honest self-reporting.** The "Source Audit" depends on data lineage documentation being accurate. If upstream data is mislabeled, this protocol cannot catch it.
  4.  **It is static; reality is dynamic.** Interactive kinds change. A category that is safe to use today may become harmful tomorrow as social understanding evolves. This protocol requires quarterly re-evaluation, not one-time approval.

  **Action Item:** All Team Leads must integrate the IKF Protocol into the sprint planning cycle effective immediately. Proposal 2 is to be archived; Proposals 1 and 3 are to be routed to the ERB.

  **Signed,**

  **Data-Ethics Lead**
