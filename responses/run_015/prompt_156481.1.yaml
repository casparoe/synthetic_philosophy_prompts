  2.  **Deconstruct the Core Concept (Interactive Kinds/Looping Effects):**
      *   *Idea:* Classifying people changes how they understand themselves and how institutions treat them, which in turn changes the classification itself.
      *   *Implication for AI:* Using these categories isn't neutral. It reinforces or alters the institutional reality.
      *   *Procedure Goal:* Prevent harm from reification (treating social constructs as biological facts) while acknowledging legitimate predictive utility where appropriate, ensuring reflexivity.

  3.  **Drafting the Decision Procedure (The "Interactive Kind Audit"):**
      *   Need a structured flow.
      *   *Phase 1: Measurement & Ontology.* Is this measuring a biological fact or a social reality? How was it captured?
      *   *Phase 2: Institutional Context & Looping.* How will this prediction change treatment? Will that treatment change the category?
      *   *Phase 3: Necessity & Alternatives.* Is it strictly necessary? Can we use a more direct measure?
      *   *Phase 4: Safeguards & Hand-offs.* If included, how do we monitor the feedback loop? When do we stop and ask humans?
