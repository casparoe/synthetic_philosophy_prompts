  The finger goes on **Step (6)**.

  Here is why it looked fine, why it is wrong, and what you have to pay to reject it.

  ### Why Step (6) Looked Fine
  Step (6) relies on an intuition of **independence**. It treats each commitment device (the hitchhiker ledger, the waiter tip, the threat credibility) as a separate ledger entry. In each specific case, the math looks identical: *Cost of paying < Probability of future benefit × Value of benefit*. Since the math is the same, it feels like the benefits should sum linearly. If it's rational to buy one insurance policy against being stranded, it feels rational to buy insurance against every possible stranded-state. It exploits the "marginal gain" intuition: if one unit of irrationality buys safety, two units should buy more safety.

  ### Why Step (6) Is Wrong
  Step (6) claims: *"These don't compete with each other... So they add."*
  This is false. While the **benefits** of these dispositions are local (you get this ride, this meal, this deal), the **costs** are global.

  The cost of having a disposition to "pay when it doesn't help" is that you become predictable and exploitable. This cost does not stay in its lane. If you are the sort of person who honors a promise even when it hurts you in the desert, you are *also* the sort of person who honors a promise when a mugger holds a knife to your throat, or when a negotiator knows you'll cave to avoid a breakdown.

  Step (6) ignores that "irrationality" (in the sense of acting against local interest) is a **signal**. Signals are a scarce resource. If you signal "I will pay regardless of consequence" too many times, across too many domains, the market adjusts. People stop offering you rides and start offering you shakedowns. The value of the disposition diminishes as you deploy it more broadly because the *environment* reacts to your global reputation, not your local ledger.

  ### The Bill for Rejecting (6)
  You said you don't want to evaluate "whole policies or life plans" because you fear the agent will just "re-optimize" in the moment. That fear is valid for Causal Decision Theory (CDT). But rejecting (6) forces you to pay a specific price:

  **You must treat the *disposition* as the unit of agency, not the *act*.**

  You cannot calculate the value of "paying the hitchhiker" in isolation from the value of "paying the waiter." You have to calculate the value of *being a Payer*. This isn't quite a "life plan" (which sounds vague), but it is a **global constraint on your decision algorithm**.

  The bill is that you can no longer claim rationality is *only* about the causal consequences of the specific act in front of you. You have to admit that rationality involves managing your own source code (your dispositions) as a strategic asset. You don't have to evaluate your whole life, but you *do* have to evaluate your "commitment budget." You have to accept that acquiring a disposition in Domain A changes the payoff matrix in Domain B.

  ### The Secondary Question: How much irrationality is optimal?
  If you kill (6), do you owe a story about why the answer isn't zero? **Yes.**

  If the answer were zero, you fall back into the unraveling problem of Step (3). No one gets the ride.
  If the answer is "maximal" (Step 7), you become a sucker (Step 8).

  The optimal amount of irrationality is determined by **marginal cost equals marginal benefit**, exactly like any other economic good.
  1.  **Zero Irrationality:** You are perfectly rational (CDT). You defect on the last ride. By backwards induction, you get no rides. Payoff: 0.
  2.  **Maximal Irrationality:** You pay even when threatened by a gun. You get many rides, but you also get mugged constantly. Payoff: Negative.
  3.  **Optimal Irrationality:** You cultivate a disposition that is *costly to fake* but *limited in scope*.

  This is the story of **Mixed Strategies** and **Costly Signaling**.
  You want to be the kind of person who pays the hitchhiker, but *not* the kind of person who pays the mugger. The "optimal irrationality" is a disposition that triggers in high-trust/reputation contexts (the App ledger) but remains dormant in coercive contexts.

  The reason the answer isn't zero is that **predictability has value**. In a world of predictors (drivers checking the App), being predictable *in the right way* is a causal asset. You aren't being "irrational" in a vacuum; you are purchasing the causal power of being a specific *type*. The "irrationality" is just the premium you pay to keep that insurance policy active. You pay exactly as much as is required to maintain the type, and not a penny more.

  **Summary:**
  *   **Reject:** Step (6).
  *   **Why:** Benefits are local, costs (exploitability) are global. They compete.
  *   **Bill:** You must evaluate dispositions globally, not acts locally.
  *   **Optimal Irrationality:** The point where the marginal gain in cooperation equals the marginal loss in exploitability. Not zero, not max. Just enough to be credible.
