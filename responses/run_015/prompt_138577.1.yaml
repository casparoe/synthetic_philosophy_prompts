  # Reading Group Handout: The Bootstrapping Decision Tree

  **Starting Commitment:** Everyone here accepts **Basic Knowledge**. If a source (a gas gauge, a perception, a model output) says *P*, and *P* is true, you know *P*—even if you haven't yet proven the source is reliable. We are not skeptics about the first step. The question is about the *next* steps.

  **Instructions:** Start at the Root. Answer the question using the concrete case provided. Follow the arrow to the next node or the final Leaf (Position).

  ---

  ### 🌳 The Tree

  #### **ROOT: Basic Knowledge Accepted**
  *(You trust a single report from an unchecked source.)*

  #### **NODE 1: The Aggregation Question**
  *   **Case:** You check your gas gauge. It says "Full," and the tank is Full. You do this 100 times over 100 trips.
  *   **Question:** Does collecting these 100 successful matches allow you to *learn* that the gauge is reliable?
  *   **[NO]** → Go to **Node 2** (The Defect).
  *   **[YES]** → Go to **Node 4** (The Sample).

  #### **NODE 2: The Defect Location**
  *   **Case:** Imagine a world where the gauge is actually broken, but by cosmic luck, it read "Full" every time you checked a Full tank.
  *   **Question:** Is the problem that your *reasoning* is invalid (you can't infer reliability from usage), or that your belief is *unsafe* (you got lucky, but could easily have been wrong)?
  *   **[INVALID REASONING]** → Go to **Node 3** (The Level).
  *   **[UNSAFE BELIEF]** → 🍂 **Leaf 1: The Modalist**.

  #### **NODE 3: The Knowledge Level**
  *   **Case:** You drive across the country trusting the gauge. Later, in a seminar, you try to *prove* the gauge is reliable using your trip log.
  *   **Question:** Is the knowledge blocked entirely, or is it only blocked when you try to reflectively defend it?
  *   **[BLOCKED ENTIRELY]** → 🍂 **Leaf 2: The Hardliner**.
  *   **[ONLY REFLECTIVE]** → 🍂 **Leaf 3: The Contextualist**.

  #### **NODE 4: The Sampling Question**
  *   **Case:** You only looked in the tank when the gauge *already* looked plausible (e.g., you ignored it when it said "Empty" on a long trip). You logged 100 "Full/Full" matches.
  *   **Question:** Does this selective checking ruin your conclusion that the gauge is reliable?
  *   **[YES, RUINS IT]** → 🍂 **Leaf 4: The Sampling Skeptic**.
  *   **[NO, FINE]** → Go to **Node 5** (The Independence).

  #### **NODE 5: The Independence Question**
  *   **Case:** You check Gauge A against Gauge B. Both say "Full." But they were made in the same factory, same batch, same wiring.
  *   **Question:** Does the second gauge give you new evidence, or just the same evidence twice?
  *   **[SAME EVIDENCE]** → 🍂 **Leaf 5: The Correlation Skeptic**.
  *   **[NEW EVIDENCE]** → Go to **Node 6** (LLM Circularity).

  #### **NODE 6: The LLM Circularity Question**
  *   **Case:** You want to know if Judge-Model A is accurate. You have Model A (or its sibling, same weights) relabel the same outputs. They agree 95% of the time.
  *   **Question:** Is this high agreement rate proof of accuracy, or just proof that the model is consistent with itself?
  *   **[JUST CONSISTENCY]** → 🍂 **Leaf 6: The Circularity Skeptic**.
  *   **[PROOF OF ACCURACY]** → Go to **Node 7** (LLM Transfer).

  #### **NODE 7: The LLM Transfer Question**
  *   **Case:** You have concluded Model A is a reliable judge (based on the self-check above). You now use Model A to grade the outputs of a completely new Model B.
  *   **Question:** Does reliability on self/family grant authority to grade outsiders?
  *   **[NO]** → 🍂 **Leaf 7: The Transfer Skeptic**.
  *   **[YES]** → 🍂 **Leaf 8: The Full Permissivist**.

  ---

  ### 🍂 The Leaves (Positions)

  | Leaf | Descriptive Label | Standard Name | Most Awkward Commitment | Verdict on LLM-Judge Case |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Safety First** | **Safety Theorist** (e.g., Weisberg) | You know the tank is full, but you can't know the gauge works, even if it never fails. | The pipeline produces true beliefs, but they aren't *safe* because the model could have hallucinated consistently. |
  | **2** | **No Bootstrapping** | **Traditional No-No** (e.g., Cohen) | You can use the source, but you are rationally forbidden from inferring it is reliable. | The evaluation pipeline is rationally impermissible; you cannot use A to justify A. |
  | **3** | **Action Only** | **Contextualist** (e.g., Greco) | You know enough to drive, but you don't know enough to write a paper about driving. | You can deploy Model A, but you cannot publish a paper claiming A is a "verified judge." |
  | **4** | **Check Your Blind Spots** | **Sampling Skeptic** | A source can be reliable, but you can't know it if you ignore its failures. | The pipeline fails because you only measured cases where the model was likely to agree (selection bias). |
  | **5** | **Need Independence** | **Independence Theorist** | Two witnesses are only better than one if they didn't talk to each other beforehand. | The pipeline fails because sibling models share the same training biases (correlated errors). |
  | **6** | **Agreement ≠ Truth** | **Circularity Skeptic** | A clock stopped at 12:00 agrees with itself 24 times a day, but isn't accurate. | The 95% agreement rate is meaningless; it measures self-consistency, not ground-truth accuracy. |
  | **7** | **Domain Specific** | **Transfer Skeptic** | Being a good judge of your own work doesn't make you a good judge of others'. | Model A might grade itself well but systematically misunderstand Model B's architecture or style. |
  | **8** | **Easy Knowledge** | **Permissivist** (e.g., Vogel) | You can pull yourself up by your bootstraps; coherence creates justification. | The pipeline is valid; if the model is consistent and reliable on self, it is authorized to grade others. |

  ---

  ### 🚩 Meta-Commentary for the Group Leader

  **1. Uninhabited Combinations**
  *   **"Invalid Reasoning" + "Unsafe Belief" (Node 2):** No one occupies the view that the reasoning is logically invalid *and* the belief is modally unsafe. Usually, if the reasoning is invalid, the modal status doesn't matter (Hardliner), and if it's just unsafe, the reasoning is formally fine (Modalist). Holding both is redundant.
  *   **"Unsafe Belief" + "Only Reflective" (Node 3):** Modalists (Leaf 1) rarely distinguish between animal and reflective knowledge. If a belief is unsafe, it's not knowledge *at all*, not just "not reflective knowledge." This combination is theoretically unstable.

  **2. Indistinguishable Leaves**
  *   **Leaf 5 (Correlation Skeptic) vs. Leaf 6 (Circularity Skeptic):** In practice, these are hard to pull apart. If Model A and its sibling agree, is that because they are *correlated* (Leaf 5) or because it's *circular* (Leaf 6)? The tree separates them conceptually (shared causes vs. self-reference), but in the LLM case, they often amount to the same diagnostic: "Don't trust family agreement."
  *   **Leaf 2 (Hardliner) vs. Leaf 4 (Sampling Skeptic):** If you are a Hardliner, you think *no* amount of checking works. If you are a Sampling Skeptic, you think *random* checking works. But if you argue that *all* bootstrapping involves some selection bias (you chose to check this source), the Hardliner and Sampling Skeptic end up making the same practical recommendation: "Don't trust the pipeline."

  **3. How the LLM Case Does Work (Node Mapping)**
  *   **Node 6** isolates the **Circularity** worry (Self-agreement is not truth).
  *   **Node 4** isolates the **Biased Sample** worry (Checking only where agreement was likely).
  *   **Node 5** isolates the **Correlated Mistakes** worry (Same family/weights).
  *   **Node 7** isolates the **Generalization** worry (Reliability on A does not imply reliability on B).

  **4. Accessibility Note**
  Notice that nowhere do we use the word "Closure" or "Transmission." Node 1 asks about "collecting matches." Node 2 asks about "reasoning vs. luck." This allows participants to engage with the structural problems of bootstrapping without needing to decode the jargon first.
