      *   *Task:* Evaluate the "crime scene" lens against Erasure, Non-creation, and Attrition. Then answer the concrete methodological questions.
      *   *Evaluation:*
          *   (a) Erasure: Good lens. Crime scenes involve cleanup.
          *   (b) Non-creation: Useless/Misleading. You can't find a body that was never killed. A crime scene implies a victim existed.
          *   (c) Attrition: Misleading. Attrition is accidental/negligent. Crime scenes imply intent. Calling a flood a "cover-up" is wrong.
