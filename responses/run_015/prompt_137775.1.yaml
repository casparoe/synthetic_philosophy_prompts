          3.  *Presupposing guilt:* "Crime scene" implies a crime.
      *   *Assessment:* Which bite?
          *   (1) is significant. A 18-year pattern isn't a "scene." It's a system.
          *   (2) is the strongest bite. It confuses *malice* with *bureaucratic indifference* or *standard procedure*.
          *   (3) is the methodological danger. It leads to confirmation bias.
      *   *Impact on Reading Group's Moves:*
          *   Move 1 (Blank column = off-record dealing): Plausible, but "crime scene" makes it sound sinister rather than administrative inefficiency or oral culture.
