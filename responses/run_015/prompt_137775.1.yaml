          *   Body -> The Tenants/Complainants (or their voices/rights).
          *   Motive -> Avoid liability/scrutiny/maintain order.
          *   Forensic Trace -> The Register (blank columns), gaps in dates, missing files.
          *   Cold Case -> The actual outcomes of the 1,400 objections.
          *   Investigator -> The Historian.
      *   *Critique:* The user lists three disanalogies:
