      *   **Target Premise (7):** This is the easiest to reject. Voting for a government is not intending every specific act that government performs. This breaks the slide to "everyone is a murderer."
      *   **Address the "Intention" issue (6):** Anscombe distinguishes between *intending* an outcome as a means vs. *foreseeing* it. Scientists might argue they intended "ending the war" and foresaw "civilians dying." Anscombe would counter that if the method *is* killing civilians, you intend it. But for citizens, the method is "supporting the state," not "killing civilians."
