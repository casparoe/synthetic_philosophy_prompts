prompt: |-
  I run a fortnightly undergrad epistemology reading group and I'm putting together a one-page handout that's meant to sort people by what they think about cases rather than by wich theory name they've heard of. The topic is that cluster of views about whether whether "S knows that p" can shift with practical stakes and with who's doing the ascribing: strict/classical invariantism, attributor contextualism, subject-sensitive invariantism and pragmatic-encroachment style interest-relative views, assessment-relativism, that neighbourhood.

  What I want from you is not prose about the views, it's the tree itself:

  - Build it out of the logical space, not out of a list of names. Give me the branch questions first, each one a concrete case somebody can answer before they know what any position is called, and only afterwards show which combinations of answers land on which view. Note the combinations nobody occupies and say in a clause whether that's because the combo is incoherent, or unattractive, or just unclaimed.
  - The node I most need right is the one that splits attributor contextualism from subject-sensitive / pragmatic encroachment. I want it phrased as a third-person case where the person doing the ascribing is in low stakes and the person they're ascribing to is in high stakes (or the reverse), so the two views return opposite verdicts. Everyone in my group runs these together and I want the handout to pry them apart.
  - Two more nodes I want in, because I've never seen them handled and they look diagnostic to me: (a) phantom stakes — the subject is falsely convinced that being wrong would be catastrophic when really nothing at all hangs on it; (b) borrowed stakes — nothing hangs on it for the subject, but a great deal hangs on it for someone the subject cares about and is trying to help. Put each wherever it actually discriminates, and if either fails to discriminate, say so and drop it.
  - One node has to be about disagreement across contexts: a low-stakes speaker says earlier "she knows", a later high-stakes speaker says "no she doesn't" — are they contradicting each other or talking past each other? That's my lever for separating contextualism from assessment-relativism, so make sure the tree doesn't collapse them into one leaf.
  - Leaves at minimum: classical invariantism, attributor contextualism, subject-sensitive/pragmatic encroachment, assessment-relativism, and skeptical invariantism if you can find it a home. Label each with the usual name if you're confident of it, otherwise a clause of description — I care about the position, not the attribution.
  - Flag any pair of leaves your tree can't actually pull apart, and name the extra case that would be needed to do it.

  Keep the cases boring and everyday (banks, trains, whether the milk's gone off) and keep the whole thing under 700 words, it has to fit on one side of A4 next to the cases themselves.
