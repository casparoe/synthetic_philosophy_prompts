answer: |-
  # Epistemic Views Decision Tree

  **CASE 1: THE MISMATCH**
  Hannah (Subject) needs money for life-saving surgery (**High Stakes**). John (Ascriber) is betting a penny (**Low Stakes**). John says: "Hannah knows the bank is open."
  **Q: Is John's claim TRUE?**

  ### **NO** (Subject's stakes block knowledge)
  *Go to Case 2.*

  **CASE 2: BORROWED STAKES**
  Hannah doesn't care about the money, but her friend needs it for surgery. Hannah acts for her friend. **Does Hannah know?**
  *   **No:** **Subject-Sensitive Invariantism / Pragmatic Encroachment.** (Practical adequacy required; vicarious stakes count).
  *   **Yes:** **Strict Subject View.** (Only subject's *own* stakes matter). *Note: Largely unoccupied/unattractive.*

  **CASE 3: PHANTOM STAKES** (Diagnostic Check)
  Hannah *believes* stakes are High (surgery), but actually nothing hangs on it (Low). **Does Hannah know?**
  *   **No:** **Psychological Encroachment.** (Anxiety defeats knowledge). *Note: Rare; usually deemed incoherent.*
  *   **Yes:** **SSI / Classical.** (Discriminatory failure: both views say Yes based on actual stakes).

  **CASE 4: SKEPTICAL CHECK**
  In Case 1, if John says "Hannah doesn't know" (because stakes are High), is *he* right?
  *   **Yes:** **Skeptical Invariantism.** (Standards are always High).
  *   **No:** **SSI.** (Standards shift with subject, but John was wrong to apply High standards to himself).

  ---

  ### **YES** (Subject's stakes do not block knowledge)
  *Go to Case 5.*

  **CASE 5: THE REVERSE**
  Hannah (**Low Stakes**). John (**High Stakes**). John says: "Hannah doesn't know."
  **Q: Is John's claim TRUE?**
  *   **NO:** **Classical Invariantism.** (Standards fixed low; John is wrong).
      *   *Disagreement Check:* Low-stakes speaker says "Knows," High-stakes speaker says "Not." Who is wrong?
          *   **Low Stakes:** **Skeptical Invariantism.** (Standards fixed high).
          *   **High Stakes:** **Classical Invariantism.** (Standards fixed low).
  *   **YES:** (Standards shift with evaluator). *Go to Case 6.*

  **CASE 6: DISAGREEMENT**
  Low-stakes speaker says "She knows." Later, High-stakes speaker says "No she doesn't."
  **Q: Are they CONTRADICTING each other?**
  *   **NO** (Talking past; different propositions): **Attributor Contextualism.** (Meaning of "knows" shifts with ascriber's context).
  *   **YES** (Same proposition): *Go to Case 7.*

  **CASE 7: RELATIVISM CHECK**
  In Case 6, **can both speakers be CORRECT?**
  *   **YES:** **Assessment Relativism.** (Truth relative to assessor's context; no single absolute truth).
  *   **NO:** **Invariantism.** (One must be wrong). *See Case 5.*

  ---

  **UNOCCUPIED COMBINATIONS**
  *   **Subject Stakes Matter + Ascriber Stakes Matter:** (Double Contextualism). *Incoherent:* Truth conditions cannot depend simultaneously on two independent contexts without contradiction.
  *   **Phantom Stakes Defeat Knowledge:** *Unattractive:* Makes knowledge too fragile based on delusion.

  **LIMITATIONS**
  *   **Classical Invariantism vs. Assessment Relativism:** This tree groups them on Case 5 (both say John's High-Stakes denial is False *absolutely* vs *relative*). To separate them, you need a **Retraction Case**: When the Low-Stakes speaker moves to High Stakes, must she retract her earlier "She knows"? (Relativism: Yes; Invariantism: No).
  *   **SSI vs. Skeptical Invariantism:** Both say Hannah (High Stakes) doesn't know. Distinguish by asking if a Low-Stakes subject knows. (SSI: Yes; Skeptic: No).
