prompt: |-
  hey, so I'm a retired chemist who's gotten into philosophy of science lately, and I'm trying to build a personal proceedure for when I want to weigh in on claims way outside my old lab -- climate stuff, nutrition RCTs, whatever. The framework is inside view vs outside view plus epistemic modesty, but I need it adapted for what you might call domain drift: my expertise is real but decayed and partly overlapping, so I can't just treat myself as a layperson or as an expert.

  Write me a step-by-step decision flowchart in words -- something I can actually run in 15 minutes before arguing with my nephew or posting online. It needs ordered questions, what counts as enough to answer each, the point where I stop with "no opinion," and explicit flags for where I'm just dressing up a value judgment as logic. Handle the hard case: my inside reasoning looks solid but the outside view for this field is garbage. Then apply it to two cases: a single forty-person RCT finding a common supplement improves memory, and a claim that one specific geoengineering technique reduces hurricane intensity by 20%. One should come out as "stay agnostic" even though the inside view feels temptingly clear. Also be honest about what this can't do -- like catching when I'm just rationalizing my politics or overestimating my decayed expertise.
reasoning: |-
  Here's a thinking process that leads to the suggested decision framework:

  1.  **Analyze the User and Request:**
      *   **User:** Retired chemist, interested in philosophy of science.
      *   **Goal:** Create a personal procedure/flowchart for evaluating scientific claims outside their immediate expertise (domain drift).
      *   **Core Concepts:** Inside View vs. Outside View, Epistemic Modesty.
      *   **Constraint:** Must be runnable in ~15 minutes.
      *   **Specific Needs:** Ordered questions, stopping rules ("no opinion"), flags for value judgments disguised as logic, handling the "solid inside view vs. garbage outside view" conflict.
      *   **Test Cases:** 1) Small RCT on supplement/memory. 2) Geoengineering/hurricane claim. One must result in "stay agnostic."
      *   **Honesty:** Acknowledge limitations (rationalizing politics, overestimating decayed expertise).

  2.  **Deconstruct the Core Concepts:**
      *   *Inside View:* Analyzing the specific evidence, methodology, and mechanisms (what a chemist does).
      *   *Outside View:* Base rates, consensus, track record of the field, replication rates (what a philosopher/statistician does).
      *   *Domain Drift:* Chemistry $\rightarrow$ Biology/Medicine (close) vs. Chemistry $\rightarrow$ Atmospheric Science/Complex Systems (further).
      *   *Epistemic Modesty:* Knowing what you don't know.

  3.  **Drafting the Flowchart (Iterative Process):**
      *   *Step 1: Domain Mapping.* How far is "chemistry" from "this claim"?
      *   *Step 2: Outside View Check.* What does the consensus say? Is this field reliable?
      *   *Step 3: Inside View Check.* Can I actually evaluate the methods?
      *   *Step 4: Conflict Resolution.* What if Inside $\neq$ Outside?
      *   *Step 5: Value Judgment Check.* Am I arguing science or politics?
      *   *Step 6: Verdict.* Speak, Stay Silent, or Hedge.

      *Refining for Time (15 mins):* Needs to be punchy. No deep literature reviews. Quick heuristics.
      *Refining for "Domain Drift":* Need to explicitly weight the *type* of expertise. A chemist knows kinetics, but maybe not epidemiology.

  4.  **Developing the "Hard Case" (Inside Solid, Outside Garbage):**
      *   This is the crux. If I see a fatal flaw in the math (Inside), but the whole field says it's true (Outside).
      *   *Rule:* In complex systems, the Outside View usually wins over a lone Inside View unless the error is trivial/arithmetic.
      *   *Nuance:* If the field is known to be pathological (e.g., social psych replication crisis), weight Inside higher. If the field is robust (e.g., physics), weight Outside higher.

  5.  **Developing the Test Cases:**
      *   *Case 1 (Supplement RCT):* Chemist $\rightarrow$ Biochem/Pharmacology. Close drift. But $N=40$ is tiny. Outside view (nutrition science) is noisy. Inside view (p-hacking risk) is high. *Verdict:* Agnostic/Skeptical.
      *   *Case 2 (Geoengineering):* Chemist $\rightarrow$ Atmospheric Dynamics. Far drift. Mechanism might look chemically sound (aerosols), but fluid dynamics is different. Outside view (climate models) is complex. *Verdict:* Agnostic (despite chemical intuition).
      *   *Requirement:* One must be "stay agnostic" even if inside view feels clear. Let's make the Geoengineering one the "stay agnostic" because the system complexity overwhelms the chemical intuition. The RCT might be "skeptical but can comment on methodology." Actually, the prompt asks for one to be agnostic *even though the inside view feels temptingly clear*.
      *   *Adjustment:* Let's make the RCT the one where the chemist feels they *know* the biochem is plausible, but the stats are bad (Agnostic). Or the Geoengineering one where the chemistry looks right (aerosols scatter light) but the climate system is too complex (Agnostic). The latter fits "domain drift" better. Let's go with Geoengineering = Agnostic (System complexity > Chemical mechanism). RCT = "Methodological Critique Allowed" (Stats are universal).
      *   *Wait, re-reading prompt:* "One should come out as 'stay agnostic' even though the inside view feels temptingly clear."
      *   *Decision:* Geoengineering is the best fit for "Inside view feels clear (chemistry of aerosols)" but "Outside view says stop (complex systems)."

  6.  **Addressing Limitations (The "Honesty" Section):**
      *   Can't catch motivated reasoning fully.
      *   Can't fix decayed knowledge (e.g., not knowing new statistical standards).
      *   Can't replace peer review.

  7.  **Writing the Content (incorporating tone):**
      *   Tone: Professional, respectful of the user's background, pragmatic, slightly philosophical.
      *   Structure: Introduction -> The Protocol (Steps) -> The Hard Case Rule -> Test Cases -> Limitations.

  8.  **Refining the Steps (Self-Correction during drafting):**
      *   *Step 1 (Distance):* Make it concrete. Is it molecules or societies?
      *   *Step 2 (Consensus):* Don't just ask "is there consensus?" Ask "is this a settled or frontier question?"
      *   *Step 3 (Method):* Focus on what a chemist knows (controls, blinding, stoichiometry vs. p-values).
      *   *Step 4 (The Clash):* This needs the specific rule for "My logic vs. Their consensus."
      *   *Step 5 (Values):* The "Is this actually about policy?" check.

  9.  **Final Review against Constraints:**
      *   15 minutes? Yes, if kept high-level.
      *   Ordered questions? Yes.
      *   Stop rules? Yes.
      *   Flags for values? Yes.
      *   Hard case handled? Yes.
      *   Two cases applied? Yes.
      *   Limitations admitted? Yes.

  10. **Final Polish:** Ensure the distinction between "decay" (old knowledge) and "drift" (wrong field) is clear. Ensure the "Agnostic" outcome is dignified, not a failure. (Proceed to generate output).

  *(Self-Correction on Test Cases)*: I need to make sure I follow the instruction: "One should come out as 'stay agnostic' even though the inside view feels temptingly clear."
  *   *RCT Case:* Inside view (small N, p-hacking) suggests skepticism. Outside view (nutrition is messy) suggests skepticism. These align. Easy to call "Weak Evidence."
  *   *Geoengineering Case:* Inside view (sulfate aerosols scatter light, basic physics) feels *solid*. Outside view (climate models are non-linear, unintended consequences) says "We don't know." This is the conflict. This should be the "Stay Agnostic" result.
  *   *Wait, actually:* The prompt says "One should come out as 'stay agnostic' even though the inside view feels temptingly clear."
  *   *Okay:* I will structure the Geoengineering case so the chemical intuition says "Yes, this works" but the protocol forces "Agnostic."
  *   *The RCT case:* I can allow a "Methodological Critique" verdict because stats are domain-agnostic.

  Let's write it.cw
answer: |-
  This is a **Domain-Drift Epistemic Protocol (DDEP)**. It is designed for a retired scientist whose methodological intuition is sharp but whose specific knowledge base is decayed and partially misaligned.

  It is optimized for a 15-minute runtime. It prioritizes *not being wrong* over *being interesting*.

  ### The Protocol

  **Step 1: Map the Drift (Time Limit: 2 mins)**
  *   **Question:** What is the distance between my core competency (synthetic/physical chemistry) and the claim's primary mechanism?
  *   **Green Zone:** Molecular interactions, stoichiometry, basic thermodynamics, analytical measurement error.
  *   **Yellow Zone:** Biochemistry, pharmacology, materials science, standard statistics.
  *   **Red Zone:** Fluid dynamics, epidemiology, macro-economics, complex adaptive systems, sociology.
  *   **Stop Rule:** If the claim rests entirely on **Red Zone** mechanisms, you are a layperson. Stop here. Verdict: **No Opinion.**

  **Step 2: The Outside View Scan (Time Limit: 5 mins)**
  *   **Question:** What is the consensus status of the *field* generating this claim, not just the claim itself?
  *   **Search:** Look for meta-analyses, position statements from major bodies, or replication rates.
  *   **Check:** Is this field known for high noise? (e.g., Nutrition, Psychology = High Noise). Is it known for high signal? (e.g., Optics, Virology = High Signal).
  *   **Flag:** If the claim contradicts a robust consensus without a paradigm-shifting mechanism, note the "Base Rate of Being Right" for lone wolves in this field is <5%.

  **Step 3: The Inside View Audit (Time Limit: 5 mins)**
  *   **Question:** Can I identify a *fatal* methodological flaw using universal scientific heuristics?
  *   **Look for:**
      *   Sample size vs. effect size (Power).
      *   Control group validity.
      *   Confounding variables (did they control for X?).
      *   Measurement precision (are the error bars realistic?).
  *   **Constraint:** Do not evaluate the *theory* (e.g., "Does this molecule bind?"). Evaluate the *execution* (e.g., "Did they measure the binding correctly?").
  *   **Stop Rule:** If your objection relies on specific factual knowledge you haven't used in 10+ years (e.g., current standard assay protocols), discard the objection.

  **Step 4: The Conflict Resolution (The Hard Case)**
  *   **Scenario:** Your Inside View (Step 3) says "This is flawed/impossible," but the Outside View (Step 2) says "This is accepted/standard."
  *   **The Rule:** In **Green/Yellow Zones**, trust your Inside View *only if* the error is arithmetic or logical (e.g., mass balance violation). In **Red Zones**, or where complex systems are involved, trust the Outside View.
  *   **Reasoning:** Complex systems have emergent properties that reductionist chemistry intuition often misses. A "solid" chemical mechanism often fails in a biological or atmospheric system.
  *   **Verdict:** If Inside $\neq$ Outside in a Red/Yellow zone, you must default to **Epistemic Agnosticism**.

  **Step 5: The Value Judgment Mask (Time Limit: 3 mins)**
  *   **Question:** Does accepting/rejecting this claim align perfectly with my political or tribal identity?
  *   **Test:** If the claim were reversed (e.g., the supplement *harmed* memory, or the geoengineering *increased* hurricanes), would I apply the same level of scrutiny?
  *   **Flag:** If you are digging for flaws only because you dislike the *implication* of the truth, you are doing politics, not science.
  *   **Verdict:** If this flag triggers, you are forbidden from posting a "scientific" rebuttal. You may only state your values.

  ---

  ### Application to Test Cases

  #### Case 1: The Supplement RCT
  **Claim:** A 40-person RCT shows Supplement X improves memory by 15% in seniors.
  *   **Step 1 (Drift):** Chemistry $\rightarrow$ Human Physiology/Statistics. **Yellow Zone.** You understand the molecule, but not the metabolism or the trial design norms.
  *   **Step 2 (Outside):** Nutrition/Cognitive science has high noise, low replication. Small RCTs ($N=40$) are notoriously unreliable in this field.
  *   **Step 3 (Inside):** 15% effect size is massive for cognitive intervention. $N=40$ is underpowered for that claim unless variance is tiny (unlikely in humans). You spot the statistical fragility.
  *   **Step 4 (Conflict):** Inside (Stats look weak) aligns with Outside (Field is noisy). No conflict.
  *   **Step 5 (Values):** Do you hate Big Pharma or love natural remedies? Check yourself.
  *   **Verdict:** **Methodological Skepticism Allowed.** You can argue the stats and sample size (universal skills), but you cannot argue the biochemistry. You may say: *"The effect size relative to N suggests high false-positive risk,"* but not *"This molecule can't cross the blood-brain barrier."*

  #### Case 2: The Geoengineering Claim
  **Claim:** Injecting Sulfate Aerosol Y into the stratosphere will reduce hurricane intensity by 20% without altering rainfall patterns.
  *   **Step 1 (Drift):** Chemistry $\rightarrow$ Atmospheric Fluid Dynamics. **Red Zone.** You know the aerosol chemistry, but not the climate feedback loops.
  *   **Step 2 (Outside):** Climate modeling is robust on warming, but low-confidence on regional precipitation/storm specifics. Consensus is "high uncertainty on side effects."
  *   **Step 3 (Inside):** The chemistry feels solid. Sulfates scatter light (radiative forcing). You can balance the equation. The mechanism looks chemically "clean." Your intuition says: *"Physically, this works."*
  *   **Step 4 (Conflict):** **HARD CASE.** Inside View (Chemistry is sound) vs. Outside View (System is too complex to predict regional rain/storm outcomes).
      *   *Protocol Application:* This is a Red Zone complex system. Your chemical intuition is necessary but not sufficient. The "no rainfall alteration" claim is a systems claim, not a chemical one.
  *   **Step 5 (Values):** Do you fear climate change enough to risk side effects? Or do you fear tampering with nature?
  *   **Verdict:** **Stay Agnostic.** Even though the chemistry feels temptingly clear, the claim rests on fluid dynamics, not stoichiometry. You must defer to the climate modelers' uncertainty. You cannot validate the "20% reduction" claim.

  ---

  ### Limitations & Honest Warnings

  This protocol cannot save you from yourself. Be aware of these three failure modes:

  1.  **The "Smart Person" Trap:** You will feel that your general scientific literacy compensates for domain drift. It does not. A retired chemist is not a retired climatologist. The protocol forces "Agnostic" in Case 2 specifically to counter your feeling that "I understand the physics, so I understand the weather."
  2.  **Motivated Reasoning:** Step 5 is a self-report. If you are deeply invested in the outcome, you will lie to yourself on Step 5. If you feel *anger* while reading the claim, close the tab. You are not in a state to evaluate.
  3.  **Decay Blindness:** You may not know that statistical standards (e.g., p-value thresholds, pre-registration) have changed in the last 15 years. Your "Inside View" on methodology might be outdated. If the claim involves modern Bayesian stats or machine learning, treat your methodological critique as Yellow Zone, not Green.

  **Final Rule:** If you cannot explain the counter-argument to a specialist in that field in a way they would acknowledge as "fair, even if wrong," you are not ready to speak.
