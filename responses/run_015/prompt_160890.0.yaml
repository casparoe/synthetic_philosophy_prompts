  **Memorandum to the Author**

  **Re: Nomic Standards Panel Ruling on the Ashgrove Constant ($\kappa$)**

  Here is the analysis you requested regarding the Panel's impending ruling, constructed to maintain strict consistency with the precedents provided in your file.

  ### 1. Prediction of the Ruling
  The Panel will register the constancy of $\kappa$ as a **Law**, but specifically in the **lower, domain-relative grade** (matching the *Biogenesis* precedent), rather than as a contingent matter of fact or a derivative regularity.

  They will reject the rival party's application to have it entered merely as a contingent fact. The ruling will likely state that while $\kappa$ is not a fundamental necessity of *all* possible worlds (unlike the speed of light), it is a necessary condition for the existence of *any information-processing domain*. Consequently, the Ashgrove Institute's patent application will be denied. The Panel's reasoning will be that a device requiring $\kappa$ to vary locally creates a region where information storage is impossible; since the device itself requires information processing to operate (control, readout, stability), the device's operation would require the registered law to be false in the very domain required for the device to function. It is a performative contradiction.

  ### 2. Closest Analogue Precedent
  The closest analogue is the registration of **"every cell is the offspring of a cell"** (Biogenesis).

  **Why:**
  *   **Modal Status:** Like $\kappa$, biogenesis is not a logical necessity (one can conceive of spontaneous generation), nor is it a mere accident (like the gold sphere). It is a constraint on what is possible *within a specific domain* (biology).
  *   **Anthropic/Functional Link:** The Panel justified the Biogenesis entry by noting it holds in "every biologically possible history." Similarly, $\kappa$ holds in "every information-possible history." Both constants define the boundary conditions for a complex system (life/information) to exist at all.
  *   **Grade:** Both warrant the lower, domain-relative grade rather than the highest grade (reserved for light, charge, energy), acknowledging that worlds without life or information are metaphysically coherent, even if nomically distinct from ours.

  ### 3. Account of the Implicit Principle
  The principle the Panel is implicitly running is an **Invariance under Counterfactual Variation Account** (specifically, a version akin to Marc Lange's theory of 'Natural Stability').

  **The Principle:** A generalisation is a law if it remains true under the widest range of counterfactual suppositions that are logically consistent with the domain in question.
  *   **Gold Sphere:** Fails. If we had piled more gold together, the sphere could exceed a mile. It is not invariant under physical suppositions.
  *   **Kepler's Law:** Fails fundamental status. It is not invariant if we suppose different initial conditions for the solar system.
  *   **Biogenesis:** Succeeds within its domain. In any counterfactual history where biology exists, cells come from cells.
  *   **Ashgrove $\kappa$:** Succeeds within its domain. In any counterfactual history where information storage exists, $\kappa$ is constant.

  **The Competing Principle:**
  The main alternative that fits the existing precedents but diverges on this case is the **Best System Account (BSA)** (associated with David Lewis).
  *   **How it fits precedents:** It distinguishes laws (axioms of the best deductive system) from accidents (Gold Sphere) and derivatives (Kepler). It handles the *Biogenesis* case by treating 'biology' as a natural kind that features in the best systematisation of the world.
  *   **Where it diverges:** On $\kappa$, a BSA analysis might rule it a **Contingent Fact**. Why? Because adding a constraint on $\kappa$ to the 'best system' might not yield sufficient simplicity or strength to outweigh the cost, especially if $\kappa$ is merely a boundary condition for observers rather than a dynamic law. A BSA proponent might argue that $\kappa$ is a 'cosmic accident' that happens to allow us to be here to measure it, rather than a law governing reality. If the Panel were following BSA strictly, they might grant the rival's application for 'Contingent Fact'.

  ### 4. Best Guess and Reasons
  My best guess is that the Panel is indeed following the **Invariance under Counterfactual Variation** account.

  **Reasons:**
  1.  **The *Biogenesis* Precedent:** This is the strongest evidence. The BSA struggles to explain why 'every cell is the offspring of a cell' is a *law* rather than a very stable regularity, unless one rigs the 'best system' to include biological kinds as fundamental. The Invariance Account handles special-science laws (like biology) naturally by appealing to stability within a domain.
  2.  **The 'Teeth' of the Act:** The Act prohibits devices that require a law to be *false*. An Invariance Account focuses on what *must* hold true for a system to persist. This aligns better with the regulatory goal of preventing impossible engineering than the BSA, which is more about descriptive elegance.
  3.  **Consistency:** Ruling $\kappa$ as a domain-relative law maintains the symmetry between the conditions for life (Biogenesis) and the conditions for information ($\kappa$). To rule otherwise would suggest life is nomically protected but information is not, which would be a strange inconsistency for a Panel in the 2080s.

  ### 5. The Further Application (Tie-Breaker)
  To separate the Invariance Account from the Best System Account in a future chapter, you should introduce a case concerning a **Slowly Decaying Constant**.

  **The Case:** A new measurement suggests the proton-to-electron mass ratio changes by one part in $10^{15}$ per year.
  *   **Invariance Account Prediction:** The Panel should **refuse** to register the constancy of this ratio as a law (or downgrade it). If the ratio changes, the statement "the ratio is constant" is *not* invariant under the counterfactual supposition "suppose we measure it in a billion years." It lacks stability over time.
  *   **Best System Account Prediction:** The Panel might **register** it as a law, but with a time-dependent parameter (e.g., $\mu(t)$). If including a time-variable function in the axioms simplifies the overall system compared to treating every measurement as a separate accident, BSA accepts it as a law.
  *   **Why this separates them:** Invariance demands strict stability (or a specific domain of stability). BSA demands optimisation of simplicity and strength. A time-varying 'law' is often acceptable to BSA but problematic for strict Invariance theorists.

  ### 6. Confidence Levels and Critique

  *   **Prediction of Ruling (Domain-Relative Law):** **90% Confidence.** The *Biogenesis* precedent is too specific to be ignored. It establishes a clear category for 'conditions of possibility', which $\kappa$ fits perfectly.
  *   **Identification of Principle (Invariance):** **70% Confidence.** While Invariance fits best, a sophisticated **Powers or Essences Account** (where the 'nature' of information entails $\kappa$) would yield the same ruling. Distinguishing these from the text of the rulings alone is difficult.
  *   **Best Guess Preference:** **75% Confidence.** Invariance is the most robust fit for a regulatory body concerned with what *can* be built (modal robustness) rather than what *describes* the world best (BSA).

  **Claim Most Likely to be Rejected by a Professional Philosopher:**
  I expect a professional philosopher of science to reject the claim that **the Invariance Account is superior to the Powers/Essences Account for this specific fiction.**

  **Reason:** Many contemporary metaphysicians argue that 'stability' is a symptom of lawhood, not the ground of it. They would argue the Panel is actually relying on an **Essentialist** intuition: that 'information' has an essence, and $\kappa$ is part of that essence (just as 'cell' has an essence involving lineage). They would argue that Invariance is merely the *test* the Panel uses, but the *ontology* underpinning the ruling is Essentialism. If you present the Panel as explicitly citing 'counterfactual stability' as the *reason* rather than the *test*, a philosopher might flag this as conflating epistemology with metaphysics.

