  Here is the defended agenda. I am ranking these based on **leverage** (how much explanatory power per hour of research), **tractability** (fit for 18 months of conceptual work without empirical drift), and **upstream/downstream logic** (which questions unlock the others).

  ### The Ranking

  1.  **Institutional Graft Failure (Angle 3)**
  2.  **Rhetorical Mechanics (Angle 2)**
  3.  **Reverse-Essentialism Trap (Angle 4)**
  4.  **Family-Resemblance Cluster (Angle 1)**

  ### Defense of the Ordering

  **1. Top Priority: Institutional Graft Failure**
  This is the only angle that offers a **positive theoretical framework** rather than a negative critique. The other three angles essentially argue about the definition or usage of the term; this angle explains the *pathology* of the term's application.

  *   **Why it's upstream strategically:** If you can demonstrate that "Western values" fracture not because the values are incoherent, but because the *institutional vessels* designed to carry them are incompatible with the target soil, you bypass the ontological debate entirely. You shift the question from "What are Western values?" to "What are the transmission conditions for normative coherence?"
  *   **Tractability:** This is the riskiest regarding your "no empirical work" constraint, but it is manageable if kept strictly conceptual. You are not comparing historical success rates of democratization (that's political science). You are mapping the **conceptual dependencies** between specific legal forms (e.g., adversarial courts, individual standing) and specific normative commitments (e.g., autonomy, accountability). You are asking: *Is there a conceptual contradiction between the institutional form and the value it claims to export?* This is pure political theory.
  *   **Value:** It cuts through culture-war noise by treating "Western values" as a technical problem of institutional design rather than a civilizational identity marker.

  **2. Second Priority: Rhetorical Mechanics**
  This is the necessary support project for Angle 1. While Angle 1 builds the theory, Angle 2 maps the battlefield.

  *   **Why it's second:** You need to know how the phrase functions in the wild to understand why the "graft" fails politically. This project analyzes the **argumentative structure** of immigration and human-rights claims. It asks: Is "Western values" used as a premise, a conclusion, or a boundary marker?
  *   **Tractability:** This is highly tractable for 18 months. It involves conceptual genealogy and logical reconstruction of public arguments, not survey data or corpus linguistics. You are analyzing the *logic* of the rhetoric, not the frequency.
  *   **Value:** It prevents the team from building a theory (Angle 1) that is irrelevant to how the term is actually weaponized or utilized. It grounds the high theory in the actual discursive conflict.

  **3. Third Priority: Reverse-Essentialism Trap**
  This is not a research project; it is a **methodological guardrail**.

  *   **Why it's third:** You cannot spend 18 months researching this as a standalone topic without falling into the very trap you are studying. Instead, this must be a standing constraint on the first two projects. Every time the team posits a definition or a mechanism, they must run it through the "Trap Test": *Does this definition rely on a fixed essence to do its work?*
  *   **Value:** It ensures the project doesn't self-destruct. It is upstream logically (you must avoid the trap to do the work) but downstream strategically (you manage it, you don't study it).

  **4. Last Priority: Family-Resemblance Cluster**
  This is the **null hypothesis**.

  *   **Why it's last:** This is the settled background music of contemporary philosophy. Arguing that "Western values" is a vague cluster with no essential core is likely correct, but it is low-yield. Proving this again is a defensive move. It dissolves the problem rather than solving it.
  *   **Value:** It is the foundation you stand on, not the building you construct. You assume (1) is true to make (3) possible. If you spend your grant proving (1), you have spent 18 months confirming what most interlocutors already suspect, leaving you with no explanation for why the conflict persists.

  ### Upstream/Downstream Logic

  *   **Logically Upstream:** Angle 1 (Family-Resemblance). You must assume non-essentialism to analyze "Graft Failure" (Angle 3). If there were a hard essential core, graft failure would just be "incorrect implementation" rather than "conceptual incompatibility."
  *   **Heuristically Upstream:** Angle 3 (Graft Failure). This is the engine. If you solve this, you explain why Angle 2 (Rhetoric) is so volatile (because the transmission is breaking) and why Angle 4 (Trap) is so tempting (because people crave the stability of essentialism when institutions fail).
  *   **Parallel Constraint:** Angle 4 (Trap). This runs alongside everything.

  ### The Flip Condition

  My top choice is **Institutional Graft Failure**. I would abandon this priority and shift to **Rhetorical Mechanics (Angle 2)** as the lead if:

  **We find that institutional form is irrelevant to value transmission.**

  Specifically, if our conceptual mapping reveals that "values" do not travel via institutions at all, but rather via **pre-institutional affective solidarity** (e.g., shared narratives, theological substrates, or kinship models) that institutions merely reflect but do not generate.

  If we discover that the "graft" fails not because the *institution* is incompatible, but because the *social substrate* required to animate the institution is non-transferable, then Angle 3 is a category error. In that scenario, the problem is not institutional design (theory), but social ontology (which bleeds into empirical history/sociology, risking your constraints).

  If that happens, the most tractable remaining work is **Angle 2 (Rhetorical Mechanics)**. If the values can't be engineered via institutions, then the only thing left to analyze is how the *language* of those values functions to create temporary, rhetorical coalitions. That becomes the only viable conceptual work left that doesn't require empirical lab work.

  ### Summary of the Agenda

  *   **Months 1-6:** Establish the "Graft" framework. Map the conceptual dependencies between specific liberal institutions and specific normative claims. (Angle 3)
  *   **Months 7-12:** Test this framework against the rhetorical structures of current immigration/human-rights debates. Where does the rhetoric claim institutional transfer is possible where our theory says it isn't? (Angle 2 + 3)
  *   **Months 13-18:** Synthesis and Guardrails. rigorous check against the Reverse-Essentialism Trap to ensure the solution doesn't reintroduce the metaphysical baggage you tried to escape. (Angle 4)
  *   **Throughout:** Treat Family-Resemblance (Angle 1) as a working assumption, not a research output.

  This agenda maximizes the chance of producing a novel theoretical intervention (Angle 3) while using the other angles to ensure the intervention is grounded (Angle 2) and methodologically sound (Angle 4).
