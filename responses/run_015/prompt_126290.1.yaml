answer: |-
  # Joint Statement on Aggregate National Differences
  **Signatories:** Marta Reuter, Tobias Lenz
  **Date:** October 2023

  ### I. Shared Premises
  We agree on the following propositions. These form the boundary conditions of our dispute; neither of us is arguing for positions outside this frame.

  1.  **Rejection of Essentialism:** There is no biological or metaphysical "national soul." Differences between countries are not fixed, immutable, or rooted in genetics. Any claim implying that individuals possess traits *because* of their nationality is false.
  2.  **Distributional Overlap:** For any psychological or behavioral trait measured across countries, the within-country variation is large. The distributions of any two countries overlap significantly. Knowing a country's mean tells you very little about a randomly selected individual from that country.
  3.  **Historical Baggage:** The research program of "national character" has a history of misuse, specifically in service of racism, colonialism, and wartime propaganda. This history imposes a heightened ethical burden on current researchers.
  4.  **Methodological Rigor:** Research in this domain requires pre-registration, multiverse analysis, and transparency regarding researcher degrees of freedom. P-hacking and selective reporting are unacceptable regardless of the topic.
  5.  **Ethical Responsibility:** Researchers are not absolved of responsibility for how their work is used simply by claiming neutrality. However, we disagree on where the line of responsibility lies (see Section III).
  6.  **Descriptive vs. Prescriptive:** Establishing a difference is not a justification for that difference, nor does it prescribe policy. Is $\neq$ Ought.

  ### II. Points of Divergence
  We disagree on the interpretation of statistical aggregates and the social consequences of publishing them. Below, we state each disagreement twice: once in the language of empirical utility (Reuter) and once in the language of conceptual validity and reception (Lenz).

  | Issue | Reuter's Formulation | Lenz's Formulation |
  | :--- | :--- | :--- |
  | **The Unit of Analysis** | Countries are valid clustering variables. Even if borders are politically constructed, they define distinct institutional and informational environments that generate reliable mean differences in behavior and attitudes. | Countries are not a natural population. They are arbitrary containers that slice through linguistic, religious, and ethnic groups. Treating them as statistical units reifies political borders as psychological boundaries. |
  | **Statistical Meaning** | Country-level means are stable parameters. Standard errors reflect uncertainty about the estimate of that mean. Predictive validity on aggregate outcomes (e.g., growth, compliance) justifies the measurement. | Without a sampling frame (a super-population of countries), standard errors are mathematically incoherent. We are describing a fixed set, not inferring a population. The "significance" of a country effect is often a artifact of model specification. |
  | **Signal vs. Noise** | The between-country variance, while smaller than within-country variance, is non-zero and systematic. It explains aggregate outcomes that individual-level data cannot. Discarding it loses predictive power. | The between-country variance is dwarfed by within-country variance. Focusing on the mean creates an illusion of homogeneity that obscures the actual drivers of behavior (class, region, cohort). |
  | **Risk of Misuse** | Misinterpretation is a communication problem. We solve it by better hedging and education. We cannot withhold findings because bad actors might simplify them; that makes science hostage to its worst readers. | Misinterpretation is a structural feature of public uptake. Hedged claims reliably flatten into essentialist claims as they travel. The researcher controls the publication decision; therefore, the researcher controls the risk of harm. |
  | **Continuity with Past** | The current literature has purged the old errors. It uses modern psychometrics and causal inference. It is a new tool, not a revival of old prejudices. | The vocabulary has changed, but the inferential habit remains identical. We are seeing the recurrence of a discredited paradigm because it offers the same comforting simplicity it always did. |

  ### III. Decidable Cruxes
  We identify three specific points where further evidence could shift our positions. For each, we specify a test and our prior predictions.

  **Crux 1: The Sampling Frame Objection**
  *The Question:* Is the lack of a "super-population" of countries fatal to the statistical inference, or can countries be treated as a fixed set of descriptive units that still yield predictive power?
  *The Test:* A pre-registered analysis treating countries as fixed effects versus random effects, predicting a set of aggregate outcomes (e.g., pandemic compliance, tax morale) while controlling for non-border covariates (language family, colonial history, latitude).
  *Reuter's Prediction:* Country fixed effects will retain significant explanatory power even after controlling for historical and cultural covariates. The "country" parameter captures institutional and normative environments that other variables miss.
  *Lenz's Prediction:* Once non-border covariates are included, the "country" effect will vanish or become unstable across specifications. The apparent country effect is actually capturing omitted variables that do not respect borders.

  **Crux 2: The Hedging Trade-off**
  *The Question:* Does hedging an aggregate claim enough to satisfy conceptual objections render it useless for explanation, or can precision and utility coexist?
  *The Test:* A comparative review of policy uptake. We will examine cases where aggregate national data was presented to policymakers in two forms: (A) technically hedged (emphasizing overlap and means) and (B) simplified (emphasizing rank and difference). We will measure retention of the caveat vs. utilization of the finding.
  *Reuter's Prediction:* Form A will be used successfully by expert policymakers without leading to essentialist policy errors. Utility does not require simplification.
  *Lenz's Prediction:* Form A will be ignored as too nuanced, while Form B will be adopted but systematically misapplied to individuals. There is a negative correlation between defensibility and transmission fidelity.

  **Crux 3: The Uptake Question**
  *The Question:* Is the "ecological fallacy" (inferring individual traits from group means) an inevitable cognitive default in readers, or can it be mitigated by explicit warning labels?
  *The Test:* A pre-registered survey experiment. Participants read a summary of a national character finding. Treatment groups receive different warnings (e.g., "This does not apply to individuals" vs. "Distributions overlap significantly"). Control group receives no warning. All participants are then asked to make judgments about specific individuals from the named countries.
  *Reuter's Prediction:* Strong warnings (especially those visualizing overlap) will significantly reduce the rate of ecological fallacy compared to control. Readers are capable of distinguishing levels of analysis when prompted.
  *Lenz's Prediction:* Warnings will have negligible effect on the treatment group compared to control. The heuristic of "national character" is too cognitively available; the warning is stripped away during memory encoding or social transmission.

  ### IV. Note on Verbal Disputes
  We acknowledge that a portion of our disagreement is terminological. Specifically, we use the word "explanation" differently.
  *   **Reuter** uses "explanation" to mean *predictive leverage on aggregate variance*. If knowing the country mean improves the model fit for GDP growth, the trait "explains" part of the growth.
  *   **Lenz** uses "explanation" to mean *causal mechanism*. Unless we can specify why the border creates the trait (rather than the border merely containing it), the label is descriptive, not explanatory.

  We agree to stop arguing about whether the current literature "explains" outcomes until we agree on whether we are building predictive models or causal theories. This document treats the dispute as substantive, not merely semantic, regarding the *consequences* of using these models, even if the definition of "explanation" remains distinct.

  ***

  **Signed,**

  Marta Reuter
  Tobias Lenz
