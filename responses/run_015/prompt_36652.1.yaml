      *   *Overall Winner:* Usually, in modern analytic philosophy + physics, Eternalism (Daniel) has the edge due to SR, but Presentism (Maya) has the edge on phenomenology. I need to balance this. Daniel is likely "more right" regarding the physical structure, Maya "more right" regarding the lived experience, but since the question is about the *nature of time* (ontology), physics usually trumps intuition. However, I should acknowledge the stalemate.
