      *Re-evaluating Move 5:* Daniel is "More Right" because he offers a reductive explanation for the feeling Maya claims is inexplicable.

      *Overall:* Daniel has the stronger case for *objective* time; Maya has the stronger case for *experienced* time. Since the debate is about the "nature of time" (ontology), Daniel edges it.

      *Missing:* General Relativity (some solutions allow global time), Quantum Mechanics (some interpretations favor presentism), The Growing Block (middle ground), The distinction between Manifest and Scientific Image (Sellars).

