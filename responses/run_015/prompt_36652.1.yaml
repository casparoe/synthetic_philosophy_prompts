      *Wait, let's look closer at Move 5.* Maya says "Here moves." Daniel says "Nothing moves along time." Maya is right that *we* don't move through time in the block; our consciousness is a worldline. Daniel's explanation of flow as information processing is the standard cognitive science view. Daniel handles the objection better.

  5.  **Structuring the Response:**
