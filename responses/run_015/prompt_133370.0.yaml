  Concede immediately that the outcome models are noisy and that $k$ is not scientifically derived but policy-derived. State clearly that this rule does not solve the "noise" problem, only manages the "risk" of that noise. Admit the carve-out threshold (15 awards) is operational, not theoretical, and invite the PDs to refine the criteria for inclusion there. Acknowledge that for public funds, EV is the default moral position, and you are arguing for a specific deviation based on institutional survival, not social welfare maximization per se. By owning the subjectivity of $k$ and the imperfection of the carve-out, you disarm the Econometricians' demand for precision and the PDs' fear of hidden conservatism. Do not concede that EV is superior; concede only that your inputs are imperfect.

  4. "The reply that has to land"
  The core argument is that the agency is not a social welfare function; it is a persistent institution. If the agency suffers a visible cycle failure, funding collapses, eliminating all future expected value. Therefore, the utility function must reflect the agency's survival constraint, not just the sum of social goods. The risk-weighting $r$ is not about risk aversion regarding social value, but about risk aversion regarding institutional continuity. If you frame this as maximizing social value over an infinite horizon discounted by survival probability, the risk aversion becomes rational EV maximization over time. You must establish that the "concavity" is in the agency's production function of future funding, not in the social value of QALYs. If delivered as "we are scared," you lose. If delivered as "this maximizes long-term social output by preventing institutional collapse," you win. The failure mode is sounding like you are protecting bureaucrats rather than the pipeline.

  5. "The question I am hoping nobody asks"
  Your guess is correct: this is the weakest link. If ruin is a feature of the world (political reality), it belongs in the model as a survival constraint. If it is a feature of attitude (risk tolerance), it belongs in $r$. The danger is conflating them. If asked, admit that the political environment makes funding non-linear with performance. Argue that because the political response to failure is discontinuous (budget cuts), the agency faces a convex loss function regardless of social value linearity. Do not claim this is universal; claim it is specific to public appropriation dynamics. If you claim it is universal risk aversion, the Econometricians will crush you on normative grounds. If you claim it is political reality, the Board Member may ask why you are modeling politics rather than lobbying. Stand firm: we must optimize within the political constraint, not pretend it doesn't exist.
