answer: |-
  Your working theory is correct: the stalemate is not about hidden facts, but about unspoken baselines regarding what "democracy" actually requires. When scholars and politicians argue over backsliding in Poland, Hungary, or the US, they are rarely disputing the empirical reality of the institutional changes; both sides can see the same laws passing and the same judges being replaced. The disagreement is fundamentally conceptual, stemming from a conflation of two distinct political models: **electoral democracy** (majoritarian rule via elections) and **liberal democracy** (majoritarian rule constrained by rights, courts, and norms).

  Side A (the "backsliding" camp) operates on a **liberal-democracy baseline**. When they say institutions are decaying, they mean the *constraints* on power are weakening. To them, a government that wins an election but dismantles judicial independence or captures public media is undermining the "rules of the game" that allow for fair future competition. They view the 1990s post-communist consensus not as a partisan preference, but as the necessary infrastructure for democracy itself.

  Side B (the "partisan branding" camp) operates on a **minimal-electoral baseline**. When they say the system is democratic, they mean the *input* is legitimate. To them, unelected judges or technocratic norms that block elected officials are the actual undemocratic elements. They view "backsliding" accusations as elitist attempts to veto the popular will using institutions that lack direct electoral accountability. In this view, if the voters keep re-electing the party changing the institutions, the system is functioning exactly as a democracy should.

  This is not merely a verbal dispute over semantics, though the word "democracy" is the weapon being used. It is a substantive disagreement about **legitimacy sources**. Side A derives legitimacy from *throughput* (how decisions are made, adherence to rule of law), while Side B derives legitimacy from *input* (who won the vote). Because neither camp explicitly states which baseline they are using, they talk past each other: one warns of authoritarian drift, while the other hears a complaint about winning elections.

  Adopting a formal distinction would significantly help. Political scientists often separate **Electoral Integrity** (are votes counted fairly?) from **Liberal Constraints** (are rights and checks protected?). If you split "institutional decay" (the mechanical weakening of checks) from "normative drift" (the shift from liberal to illiberal values), the argument becomes tractable. You can agree that Poland experienced a shift from a liberal-democratic model to an illiberal-democratic model without agreeing on whether that shift is catastrophic or corrective. Accepting that the question "Is it backsliding?" is ill-posed is also viable; it presupposes a single "correct" democracy from which to slide. A better question is: "Is the system becoming more majoritarian or more constrained?"

  Progress in your debate would look like abandoning the binary label of "backsliding" in favor of describing the *trade-off*. You would acknowledge that the ruling party increased majoritarian responsiveness at the cost of judicial independence. Your partner might argue that trade-off was necessary to fix elite capture; you might argue it was dangerous for long-term stability. But you would no longer be fighting over whether the word "democracy" applies, because you would agree that the *type* of democracy has changed. This moves the conversation from a semantic deadlock to a normative discussion about which values (efficiency vs. constraint) should priority in a modern state.

  The stalemate persists because both sides are measuring different regimes, one tracking electoral majoritarianism and the other tracking liberal constitutionalism, while arguing over a single overloaded label.
