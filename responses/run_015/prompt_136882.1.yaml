    "single_most_decisive_defeater": "the id of one defeater, with a sentence on why",
    "unfalsifiability_verdict": "insulated" | "partly_insulated" | "genuinely_risky", plus a sentence on whether that is a defect here",
    "bottom_line": "three or four sentences, aimed at me, on how much I should actually adjust"
  }
