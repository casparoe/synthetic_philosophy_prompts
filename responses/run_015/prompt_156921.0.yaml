answer: |-
  Here is a full run-sheet for the workshop. It's designed to be tight, slightly uncomfortable, and mechanically simple so the philosophy does the heavy lifting.

  # Workshop Title: The Escrow Contract
  **Topic:** Scheffler's Afterlife Conjecture / Extinction Ethics
  **Time:** 90 Minutes
  **Participants:** ~18 (3 Groups of 6). Mix faculty and students evenly.
  **Materials:** 3 large binders (labeled Gen 1, Gen 2, Gen 3), printed "Payoff Sheets," pens, a visible timer.

  ## 1. The Setup (Roles & Rules)

  **The Premise:**
  You are stewarding an institution called *The Long Now Archive*. Your goal is to write a Charter that creates value. However, value is not generated by *writing* the rules; value is generated by *future generations following them*.

  **The Mechanic: Narrative Escrow**
  You cannot create "completed value" on your own. You can only deposit **Escrow Clauses**.
  *   **Escrow Clause:** A rule or project that requires a *future* generation to activate it to gain points.
  *   **Example:** "We allocate $1M for a Mars Seed Bank." (0 points now). If Gen 2 builds the bank, Gen 1 gets 100 points. If Gen 2 ignores it, Gen 1 gets 0.
  *   **Liquidation:** You can choose to "Close the Ledger" at any time. You get 10% of potential points immediately, but the Charter is marked "Terminated," and all previous generations lose their Escrow value.

  **Roles (Rotate these within the group every 5 mins):**
  1.  **Architect:** Drafts the clauses. Must ensure they are specific enough to be verified later.
  2.  **Auditor:** Checks the Payoff Sheet. Ensures every clause has a clear "redemption condition" for the next group.
  3.  **Liaison:** The only person allowed to talk to the Facilitator or read the previous Generation's binder.

  **The Payoff Sheet (Printed for each group):**
  *   **Maintenance Clause:** (e.g., "Keep the lights on") = 5 points per generation sustained.
  *   **Expansion Clause:** (e.g., "Build a new wing") = 50 points if activated by Next Gen.
  *   **Legacy Clause:** (e.g., "Preserve Gen 1's Art") = 100 points if preserved by Gen 3.
  *   **Liquidation Bonus:** 20 points per person if you voluntarily declare the project dead. (This is the "Betrayal" points).

  ---

  ## 2. Minute-by-Minute Timeline

  **00:00 – 00:10: Briefing**
  *   Hand out binders. Gen 1 gets a blank book. Gen 2 & 3 get empty books but are told they will receive Gen 1 & 2's work respectively.
  *   Explain the Escrow mechanic clearly. Emphasize: *"Your work is an investment. If the bank closes, your investment is worthless."*
  *   **Crucial:** Do not mention the possibility of extinction. Assume the timeline is infinite.

  **00:10 – 00:25: Generation 1 (The Founders)**
  *   Task: Establish the core mission. Create at least 3 Escrow Clauses that require Gen 2 to act.
  *   Vibe: Optimistic, institution-building.
  *   *Facilitator Note:* Walk around. Encourage complexity. "Make it hard for them to ignore you."

  **00:25 – 00:30: Handoff 1**
  *   Gen 1 seals their binder. Gen 2 opens it. Gen 1 sits back and watches. They can no longer touch the pen.

  **00:30 – 00:45: Generation 2 (The Stewards)**
  *   Task: Review Gen 1's Escrow. Decide whether to redeem their clauses (gain points for Gen 1) or ignore them to make room for your own. Add your own Escrow for Gen 3.
  *   Vibe: Pragmatic. They might feel burdened by Gen 1's demands.
  *   *Facilitator Note:* This is where the tension starts. Gen 1 will whisper to Gen 2. Allow it.

  **00:45 – 00:50: Handoff 2**
  *   Gen 2 seals binder. Gen 3 opens it. Gen 1 & 2 are now observers.

  **00:50 – 01:05: Generation 3 (The Horizon)**
  *   Task: Review Gen 2's Escrow. Plan for Gen 4.
  *   *Facilitator Note:* Set the timer for 15 minutes. Let them get deep into the work. About 3 minutes in, prepare the announcement.

  **01:05: THE TERMINATION ANNOUNCEMENT**
  *   (See Script Below). Stop the clock.
  *   Gen 3 is told there is no Gen 4.
  *   Gen 1 & 2 are told their Escrow holdings are now void.

  **01:05 – 01:20: The Decision Phase**
  *   Gen 3 has 15 minutes. They have two choices:
      1.  **Polish:** Finalize the document knowing no one will read it. (No points for anyone).
      2.  **Liquidate:** Sign the "Termination Page." Gen 3 gets "Betrayal Points" (individual satisfaction). Gen 1 & 2 get nothing.
  *   Gen 1 & 2 sit in silence. They can watch but not speak.

  **01:20 – 01:30: Debrief**
  *   Collect binders. Do not tally points. The points don't matter anymore.
  *   Discussion (See Debrief Section).

  ---

  ## 3. The Termination Script

  *Stand at the front. Do not smile. Do not apologize. Speak as if reading a weather report.*

  "Stop working. Pens down.

  At 01:05, the timeline for this project has been revised. There will be no Generation 4. The external funding body has dissolved. The human context required to redeem your Escrow Clauses no longer exists.

  Generation 3: You are the last stewards. You have 15 minutes.
  If you finish the Charter, it goes into an archive with no readers. Your Escrow points are zero.
  If you sign the Termination Page, you receive individual Legacy Points. However, signing this page formally voids the Escrow contracts held by Generation 1 and 2. Their work becomes formally 'futile.'

  Generation 1 and 2: You are now observers. Your points are frozen pending Generation 3's choice. You may not intervene.

  Resume."

  **Handling Stubborn Workers:**
  If Gen 3 keeps writing furiously:
  *   Walk over and place a hand on the table.
  *   "You are writing for a void. The points are already gone. Continuing is a performance, not a contribution."
  *   If they persist, let them. It's data for the debrief.

  If Gen 1 or 2 shout out:
  *   "Your contract is void. You have no standing."

  ---

  ## 4. The Debrief (Mapping the Gut Punch)

  Don't ask "How did that feel?" immediately. Start with the mechanics.

  **Phase 1: The Economics of Futility (5 mins)**
  *   "Gen 3, why did you choose to Polish or Liquidate?"
  *   "Gen 1 & 2, when you heard the announcement, what happened to the value of the work you did in minute 20?"
  *   *Goal:* Establish that the *past* work lost value instantly, even though the physical document didn't change.

  **Phase 2: Scheffler's Conjecture (10 mins)**
  *   Explain the core idea casually: "Scheffler argues we don't just care about the future because we love our grandchildren. We care because *our current projects* depend on there being people to inherit them. If you knew humanity ended in 50 years, would you write that paper? Would you grade that thesis?"
  *   Connect to activity: "You felt the value drain out of your binder. That drain is what Scheffler talks about. It's not death that hurts; it's the severing of the chain of reception."
  *   **Narrative Escrow:** "You deposited meaning into the future. When the future vanished, the deposit bounced. That's the 'gut' feeling. It's the feeling of a contract breached where the other party doesn't even exist to know they breached it."

  **Phase 3: The Limit of the Simulation (5 mins)**
  *   Be honest: "In this room, you felt the futility because *you* are still here to witness it. In real extinction, there is no one to feel the loss. The tragedy isn't felt; it's structural. The lights go out, and there's no one to say 'damn, it's dark.'"
  *   Ask: "Does knowing no one feels the loss make it better or worse?"

  ---

  ## 5. Prediction of Failure Modes (What will go wrong)

  **1. The Gamers:**
  *   *Risk:* Some grad students will treat this as a optimization puzzle. They'll try to hack the point system to maximize "Betrayal Points."
  *   *Fix:* Call it out in debrief. "If you treated this as a game, you successfully insulated yourself from the ethical weight. That insulation is part of the problem Scheffler identifies. We rationalize futility to keep working."

  **2. The Angry:**
  *   *Risk:* Someone will feel manipulated. "You wasted 45 minutes of my life."
  *   *Fix:* Own it. "Yes. I made you feel the waste. That feeling is the lecture. If you're angry, the experiment worked. The question is: is that anger about the time lost, or about the promise broken?"

  **3. The Cynics:**
  *   *Risk:* "Extinction is inevitable anyway, why does it matter?"
  *   *Fix:* Pivot to scale. "Scheffler isn't about *if* we end, but *when*. If we end sooner, the 'escrow' on our climate policy, our art, our research bounces sooner. The activity compresses that timeline so you can feel the bounce."

  **4. The Over-Invested:**
  *   *Risk:* Gen 3 refuses to Liquidate and spends 15 mins writing beautiful prose into the void.
  *   *Fix:* This is actually the best outcome for discussion. It mirrors the human condition (Sisyphus). Ask them: "Was writing into the void an act of defiance or delusion?"

  ## Logistics Checklist
  *   [ ] 3 Binders (label them clearly).
  *   [ ] Payoff Sheets (1 per person).
  *   [ ] Timer (projected on screen).
  *   [ ] "Termination Page" pre-printed for Gen 3 to sign if they choose.
  *   [ ] Seating arranged in 3 distinct clusters.

  This setup forces them to *live* the dependency of meaning on the future, rather than just thinking about it. The "Narrative Escrow" makes the abstract concrete: a clause waiting for a reader who never comes. Good luck. It's gonna be tense.
