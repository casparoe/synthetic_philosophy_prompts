prompt: |-
  You are the research-integrity officer at a research university, responsible for auditing faculty justifications for post-hoc modifications to study protocols. The philosophical distinction between reasons of the right kind and reasons of the wrong kind holds that some considerations bear on whether a belief or methodological choice is warranted by its object (for example, that a data point reflects instrument malfunction), while others bear only on whether holding that belief or making that choice is beneficial (for example, that removing it yields statistical significance). You must operationalize this distinction into a reusable audit procedure that a non-philosopher can apply consistently to written justifications submitted after preliminary data inspection.

  Construct a step-by-step decision procedure, presented as an ordered sequence of tests with explicit branching conditions, that classifies a researcher's stated reason for altering a protocol. The procedure must address three specific decision nodes: (i) exclusion of individual observations; (ii) addition, removal, or transformation of covariates in an analytic model; and (iii) substitution of a pre-registered statistical model with an alternative specification. At each node, specify the indicators that a reason is responsive to the internal evidential aims of the study, the indicators that it is responsive to external incentives, career pressures, or desired outcomes, and the conditions that trigger mandatory escalation to a review panel because the procedure cannot settle the classification.

  Incorporate three structural checks into the procedure: an initial filter separating considerations about the study's epistemic aims from considerations about its institutional or personal consequences; a symmetry test asking whether the researcher would have accepted the same consideration if it produced a result contrary to their interests; and a mixing clause that identifies arguments in which both kinds of reason are intertwined and requires disaggregation before evaluation. Provide fully worked applications of the complete procedure to three submitted justifications: one in which the reason is clearly of the right kind but forces the researcher to abandon a favored hypothesis; one in which the reason is of the wrong kind but is expressed in technically legitimate language; and one genuinely ambiguous case in which the procedure reaches no determination and must be escalated.

  Conclude by stating the explicit limits of the procedure: whether it can identify unconscious bias, whether it requires access to private mental states, whether it treats all pragmatic considerations as corrupting, and whether it applies differently when the protocol change was made before versus after data inspection. Do not cite philosophical texts or provide a bibliography; ground the procedure solely in the conceptual structure of the distinction itself.
reasoning: |-
  Here's a thinking process that leads to the suggested audit procedure:

  1.  **Analyze the Request:**
      *   **Role:** Research-Integrity Officer at a research university.
      *   **Task:** Create a reusable audit procedure for faculty justifications of post-hoc protocol modifications.
      *   **Core Concept:** The philosophical distinction between "reasons of the right kind" (RRK) vs. "reasons of the wrong kind" (RWK). RRK relate to the object/truth/evidence; RWK relate to benefits/consequences/incentives.
      *   **Requirements:**
          *   Step-by-step decision procedure (ordered sequence, branching conditions).
          *   Address three specific decision nodes: (i) exclusion of observations, (ii) covariate manipulation, (iii) model substitution.
          *   Include three structural checks: Initial Filter (Epistemic vs. Consequential), Symmetry Test, Mixing Clause.
          *   Provide three worked applications (RRK against interest, RWK disguised, Ambiguous/Escalation).
          *   State explicit limits (unconscious bias, private mental states, pragmatic considerations, timing).
          *   Constraint: Do not cite philosophical texts or provide a bibliography.

  2.  **Deconstruct the Core Concept (RRK vs. RWK) for this Context:**
      *   *Right Kind:* Relates to data quality, measurement validity, assumption violations, pre-specified error handling, objective anomalies. Essentially: "Does this change make the result *truer* or more *accurate* regarding the phenomenon?"
      *   *Wrong Kind:* Relates to p-values, publication likelihood, grant renewal, career advancement, narrative coherence. Essentially: "Does this change make the result *better* for the researcher?"
      *   *The Challenge:* Researchers often frame RWK as RRK (e.g., "We removed outliers" when they mean "We removed points that ruined significance"). The procedure needs to detect this.

  3.  **Drafting the Procedure (Step-by-Step):**
      *   *Structure:* Needs to be logical, linear but with branches.
      *   *Step 0: Intake.* Gather the justification and the data context.
      *   *Step 1: The Initial Filter (Epistemic vs. Consequential).* Look at the language. Is it about the *data* or the *outcome*?
      *   *Step 2: The Mixing Clause.* Are they mixed? If yes, force separation.
      *   *Step 3: The Symmetry Test.* Would they do this if the result flipped?
      *   *Step 4: Node-Specific Tests.* Apply specific criteria for Exclusions, Covariates, and Models.
      *   *Step 5: Escalation.* When in doubt, send to the panel.

  4.  **Refining the Decision Nodes:**
      *   *Node (i) Exclusion:* RRK = Instrument error, protocol violation, pre-defined outlier rule. RWK = "Influential point," "Didn't fit the pattern."
      *   *Node (ii) Covariates:* RRK = Confounder identified via theory/pre-analysis, measurement error correction. RWK = "Improved model fit," "Made the main effect significant."
      *   *Node (iii) Model Substitution:* RRK = Assumption violation (normality, homoscedasticity) detected independently of outcome. RWK = "Robustness check" that conveniently changes the conclusion.

  5.  **Developing the Worked Applications:**
      *   *Case 1 (RRK against interest):* Researcher finds a calibration error that ruins their significant finding. They report it.
      *   *Case 2 (RWK disguised):* Researcher removes "outliers" defined purely by residual magnitude after seeing the regression line, resulting in significance.
      *   *Case 3 (Ambiguous):* A complex measurement issue where valid scientific judgment overlaps with outcome sensitivity. Hard to tell if it's truth-seeking or result-shaping.

  6.  **Defining the Limits:**
      *   Can it detect unconscious bias? No, it analyzes stated reasons.
      *   Private mental states? No, it relies on documentation.
      *   Pragmatic considerations? Not all are corrupting (e.g., budget constraints), but epistemic ones shouldn't be driven by them.
      *   Timing? Post-hoc is the focus, but pre-data changes are lower risk.

  7.  **Review and Refine (Self-Correction):**
      *   *Critique:* Is the language too philosophical?
      *   *Fix:* Translate "epistemic aims" to "data integrity/validity" and "institutional consequences" to "career/publication benefits."
      *   *Critique:* Is the Symmetry Test practical?
      *   *Fix:* Frame it as a counterfactual query in the interview/documentation review.
      *   *Critique:* Did I cover all three nodes in the procedure?
      *   *Fix:* Ensure the Node-Specific Tests section explicitly branches for i, ii, and iii.
      *   *Critique:* Did I include the Mixing Clause?
      *   *Fix:* Make it a distinct step before the Node Tests.

  8.  **Final Polish:**
      *   Ensure the tone is administrative yet rigorous.
      *   Check against the constraint: "Do not cite philosophical texts." (Keep the concepts implicit or defined operationally).
      *   Verify the three worked examples match the requirements exactly.

  9.  **Drafting the Content (Mental or Scratchpad):**
      *   *Procedure Name:* Protocol Modification Audit Protocol (PMAP).
      *   *Step 1:* Categorize Reason (Evidence vs. Outcome).
      *   *Step 2:* Check for Mixing.
      *   *Step 3:* Symmetry.
      *   *Step 4:* Node Specifics.
      *   *Step 5:* Verdict (Clear RRK, Clear RWK, Escalate).
      *   *Examples:* Need to be distinct.
      *   *Limits:* Be honest about what paperwork can't do.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Protocol Modification Audit Protocol (PMAP)
  **Office of Research Integrity**
  **Subject:** Operational Procedure for Evaluating Post-Hoc Justifications
  **Version:** 1.0

  ## I. Purpose and Scope
  This procedure operationalizes the distinction between **Evidential Reasons** (considerations bearing on the accuracy or validity of the finding) and **Consequential Reasons** (considerations bearing on the utility, publication potential, or career impact of the finding). It is to be applied to all written justifications submitted for protocol modifications occurring after preliminary data inspection.

  ## II. The Decision Procedure

  ### Step 1: The Initial Filter (Epistemic vs. Consequential)
  **Action:** Parse the written justification into discrete claims. Classify each claim as Type E (Evidential) or Type C (Consequential).

  *   **Type E Indicators:** References to instrument calibration, data entry errors, protocol deviations by subjects, violation of statistical assumptions (e.g., normality, independence), or pre-registered exclusion criteria.
      *   *Keyword Check:* "Malfunction," "Error," "Violation," "Pre-specified," "Validity."
  *   **Type C Indicators:** References to statistical significance, effect size magnitude, model fit indices (AIC/BIC) used solely for selection, narrative coherence, or alignment with prior literature.
      *   *Keyword Check:* "Significance," "Power," "Fit," "Consistency," "Interpretability."

  **Branching Condition:**
  *   If **100% Type C**: Classify as **Reason of the Wrong Kind (RWK)**. Proceed to Step 5 (Sanction/Rejection).
  *   If **100% Type E**: Proceed to Step 3 (Symmetry Test).
  *   If **Mixed (Type E + Type C)**: Proceed to Step 2 (Mixing Clause).

  ### Step 2: The Mixing Clause (Disaggregation)
  **Action:** If the justification intertwines Evidential and Consequential claims (e.g., "We removed outliers to satisfy normality assumptions and improve model fit"), the researcher must be queried to separate these claims.

  *   **Instruction to Researcher:** "Please specify which part of the modification addresses data validity and which part addresses model performance. If the modification would still be required if the model performance worsened, state this explicitly."
  *   **Evaluation:**
      *   If the researcher cannot separate the claims: **Escalate to Review Panel.**
      *   If the researcher separates them: Re-evaluate the Type E portion in isolation. Discard the Type C portion as irrelevant to validity. Proceed to Step 3 with the isolated Type E claim.

  ### Step 3: The Symmetry Test (Counterfactual Consistency)
  **Action:** Assess whether the stated Evidential Reason is outcome-independent.

  *   **The Query:** "If applying this modification had rendered the primary hypothesis *false* or *non-significant* instead of true/significant, would the modification still have been applied?"
  *   **Documentation Check:** Review lab notebooks or version control logs. Did the decision to modify occur *before* the specific outcome of the modification was known?
  *   **Branching Condition:**
      *   If **Yes** (Modification would stand regardless of outcome): Proceed to Step 4 (Node-Specific Tests).
      *   If **No** (Modification depends on the direction of the result): Classify as **RWK**. Proceed to Step 5.
      *   If **Unclear** (Documentation is missing or ambiguous): **Escalate to Review Panel.**

  ### Step 4: Node-Specific Tests
  **Action:** Apply specific criteria based on the type of protocol modification requested.

  #### Node (i): Exclusion of Individual Observations
  *   **Right Kind Indicators:**
      *   Observation violates pre-registered exclusion criteria (e.g., failed attention check).
      *   Independent verification of equipment failure during that specific observation.
      *   Subject violated protocol (e.g., took forbidden medication) documented in real-time.
  *   **Wrong Kind Indicators:**
      *   Observation defined as "outlier" solely based on distance from the post-hoc regression line.
      *   Exclusion criteria defined *after* inspecting the distribution of the dependent variable.
      *   "Influential point" removal without independent evidence of measurement error.
  *   **Escalation Trigger:** Exclusion relies on subjective judgment of "data quality" without objective metrics, and the excluded data comprises >5% of the sample.

  #### Node (ii): Addition, Removal, or Transformation of Covariates
  *   **Right Kind Indicators:**
      *   Covariate identified as a confounder via pre-analysis plan or established theory independent of current data.
      *   Transformation corrects a documented measurement scale error.
      *   Removal due to multicollinearity diagnosed via VIF thresholds pre-specified in analysis plan.
  *   **Wrong Kind Indicators:**
      *   Covariates added/removed to maximize R-squared or minimize p-values (stepwise selection without penalty).
      *   Justification relies on "theoretical plausibility" only introduced after seeing the null result.
  *   **Escalation Trigger:** The change alters the sign or significance of the main effect, and the justification relies on post-hoc theoretical rationalization rather than pre-specified confounder lists.

  #### Node (iii): Substitution of Statistical Model
  *   **Right Kind Indicators:**
      *   Diagnostic tests (e.g., Breusch-Pagan, Shapiro-Wilk) fail pre-specified thresholds.
      *   New model accounts for data structure (e.g., clustering) overlooked in pre-registration due to clerical error, documented prior to outcome inspection.
  *   **Wrong Kind Indicators:**
      *   "Robustness check" adopted as primary model solely because it yields significance.
      *   Switching from frequentist to Bayesian (or vice versa) to alter interpretability of null results.
  *   **Escalation Trigger:** Multiple models were run, and the justification selects one without reporting the distribution of results from the rejected models (Garden of Forking Paths).

  ### Step 5: Determination and Action
  *   **Classification: Right Kind (RRK).** Modification approved. Annotation added to public record explaining the change.
  *   **Classification: Wrong Kind (RWK).** Modification rejected. Original pre-registered analysis must stand. Incident logged for potential training or sanction.
  *   **Classification: Escalated.** Case forwarded to the Research Integrity Review Panel for adjudication.

  ---

  ## III. Worked Applications

  ### Case A: The Costly Correction (Right Kind)
  **Submission:** A researcher requests to exclude 10% of the sample.
  **Justification:** "During data cleaning, we discovered a timestamp error in the logging software for Session 4. These responses were recorded at 500ms intervals instead of the required 16ms. This invalidates the reaction time measure for these subjects. Excluding them renders the main effect non-significant (p = .12), but we must prioritize data validity."
  **Audit Application:**
  1.  **Initial Filter:** Type E (Instrument error). No Type C language.
  2.  **Mixing Clause:** Not applicable (Pure Type E).
  3.  **Symmetry Test:** The researcher admits the exclusion kills significance. Documentation shows the software bug was flagged in the lab log *before* the final analysis was run. **Pass.**
  4.  **Node (i) Test:** Exclusion based on independent verification of equipment failure. **Pass.**
  5.  **Determination:** **RRK.** Approved. The researcher is commended for prioritizing validity over publication likelihood.

  ### Case B: The Technical Camouflage (Wrong Kind)
  **Submission:** A researcher requests to transform the dependent variable and remove three covariates.
  **Justification:** "To satisfy assumptions of homoscedasticity and parsimony, we applied a log-transformation and removed non-predictive controls. This specification provides the most robust estimate of the treatment effect (p < .05)."
  **Audit Application:**
  1.  **Initial Filter:** Mixed. "Assumptions" is Type E; "Parsimony" and "Robust estimate" (in this context) are Type C.
  2.  **Mixing Clause:** Researcher queried. They admit they tested five transformations and chose the log because it normalized residuals *and* yielded significance. They cannot isolate the validity claim from the outcome claim.
  3.  **Symmetry Test:** If the log-transformation had resulted in p = .08, would they have used it? Researcher states they would have reverted to the raw score. **Fail.**
  4.  **Node (ii) & (iii) Test:** Covariates removed for "non-predictive" status (implies p-value driven). Model chosen based on outcome.
  5.  **Determination:** **RWK.** Rejected. The technical language ("homoscedasticity") masked a consequence-driven choice. The pre-registered model must be reported.

  ### Case C: The Ambiguous Judgment (Escalation)
  **Submission:** A researcher requests to switch from a linear mixed model to a generalized estimating equation (GEE).
  **Justification:** "Upon inspecting the residuals, we noted clustering patterns that suggest the correlation structure in the mixed model was misspecified. The GEE is more robust to this misspecification. However, the decision was made after observing that the mixed model yielded a null result while the GEE yields significance."
  **Audit Application:**
  1.  **Initial Filter:** Mixed. "Misspecification" is Type E; "Yields significance" is Type C.
  2.  **Mixing Clause:** Researcher separates claims: "The clustering is real (E), but we acknowledge the timing was influenced by the result (C)."
  3.  **Symmetry Test:** Ambiguous. The researcher claims they *would* have switched models due to the clustering, but the timing documentation is incomplete. The lab notebook shows the residual plot was viewed 10 minutes before the final model selection, but does not prove the decision was made prior to seeing the GEE p-value.
  4.  **Node (iii) Test:** Switching models due to assumption violation is RRK. Switching due to significance is RWK. The evidence supports both possibilities equally.
  5.  **Determination:** **Escalate.** The procedure cannot settle whether the "clustering" was a genuine discovery or a post-hoc rationalization for model shopping. The Review Panel must interview the researcher and inspect raw time-stamped code logs.

  ---

  ## IV. Explicit Limits of the Procedure

  **1. Unconscious Bias:**
  This procedure analyzes *stated* justifications and *documented* actions. It cannot detect unconscious bias where a researcher genuinely believes a consequential reason is evidential. If a researcher sincerely believes "improving fit" equals "improving truth," the Symmetry Test may fail to catch this unless the documentation explicitly reveals outcome dependence.

  **2. Private Mental States:**
  The audit relies on externalized evidence (logs, emails, version control, written statements). It does not attempt to adjudicate the internal beliefs or intent of the researcher. A researcher who lies convincingly about the timing of a decision may pass the audit; this is a limitation of all administrative compliance procedures.

  **3. Pragmatic Considerations:**
  This procedure treats pragmatic considerations (grant deadlines, space constraints, subject availability) as distinct from evidential considerations. It does not classify pragmatic reasons as "Wrong Kind" in the moral sense, but it classifies them as **Invalid Justifications for Epistemic Changes**. A protocol change driven by budget cuts is not a validity issue; it is a scope change. Such cases are routed to administrative approval, not integrity review, unless disguised as methodological improvements.

  **4. Timing of Modification:**
  This procedure is calibrated specifically for **post-hoc** modifications (after data inspection). If a protocol change is made *before* data inspection (e.g., during pilot testing), the Symmetry Test is moot, and the Initial Filter is the primary tool. The presumption of RWK is lower for pre-data changes, but the Node-Specific Tests still apply to ensure the change is not based on peeking at pilot data that was effectively part of the main sample.
