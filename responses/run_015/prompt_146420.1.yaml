answer: |-
  ## Frank Assessment & Epistemic Status

  **The Premise:** Your intuition is correct. Schelling's *The Strategy of Conflict* is often read as a logic puzzle, but its force is psychological and structural. You cannot feel the "rationality of irrationality" by calculating expected value (EV); you feel it by sweating over a die roll you chose to make riskier.

  **The Constraints:**
  1.  **Stakes Manipulation (Constraint 3):** This is the riskiest part of your design. If the "Catastrophic" version imposes a penalty so high that rational actors *never* escalate (e.g., "Game Over"), the game breaks. Deterrence only works if there is a non-zero chance of escalation. If the cost is infinite, the equilibrium is immediate capitulation.
      *   *My Fix:* In the High-Stakes block, the catastrophe penalty is severe but not terminal (e.g., massive point debt), and it imposes a **negative externality on the room**. This preserves the incentive to play while simulating the "everyone loses" aspect. I will flag this in the Limitations section.
  2.  **The Glitch (Constraint 4):** If you, the facilitator, arbitrarily force a challenge, it feels like GM fiat. It needs to be a mechanic drawn from the same deck as everything else, but flagged as "System Error."
      *   *My Fix:* A "Static" card in the escalation deck. It forces a roll regardless of player intent. This tests the "tripwire" vulnerability without you breaking the fourth wall.
  3.  **Time/Group Size:** 14 people is large for deep interaction. If everyone plays simultaneously, you lose the "audience" perspective needed for debrief. If they rotate, they get bored.
      *   *My Fix:* Everyone plays simultaneously in pairs. It generates more data points for the debrief ("How many tables crashed?").

  **Confidence Levels:**
  *   **High Confidence:** The escalation ladder mechanic will generate tension. The commitment cards will be underutilized in Round 1 and overutilized in Round 3.
  *   **Medium Confidence:** The stakes shift will produce the desired intuition shift. It might instead produce confusion about the rule change.
  *   **Low Confidence:** 2 hours is tight. If the group is chatty, you will run out of debrief time. I have padded the timeline, but you must be a strict timekeeper.

  ---

  # Game Design: RUNG

  **Players:** 12–16 (7 or 8 Pairs)
  **Time:** 120 Minutes
  **Materials:**
  *   1 d20
  *   Index cards (3 per player)
  *   Whiteboard & Markers
  *   Printed "Ladder Sheets" (1 per pair)
  *   Printed "Event Deck" (10 cards total, see below)

  ## Part 1: Setup (15 Minutes)

  **Do not explain the theory.** Read only the rules below.

  **The Objective:** Accumulate "Rations" (points). The top 3 scorers choose the pizza toppings.

  **The Board:**
  Draw a ladder on the whiteboard with 6 Rungs.
  Next to each Rung, write the **Risk Number**:
  *   Rung 1: 1-in-20
  *   Rung 2: 2-in-20
  *   Rung 3: 4-in-20
  *   Rung 4: 6-in-20
  *   Rung 5: 9-in-20
  *   Rung 6: 12-in-20

  **The Loop:**
  1.  **Pot:** Each round, there is a Pot of **10 Rations**.
  2.  **Escalate:** Both players secretly choose a Rung (1–6) on a scrap of paper. Reveal simultaneously.
  3.  **Resolution:**
      *   If one player chose a higher Rung than the other: The higher player takes the Pot. The lower player gets 0.
      *   If both choose the same Rung: Split the Pot (5 each).
      *   **The Roll:** Regardless of who wins, roll the d20. If the result is $\le$ the Risk Number of the *higher* chosen Rung, **CATASTROPHE** occurs.
  4.  **Catastrophe:** Both players lose their current round earnings. (Stakes vary by Block, see below).

  **Commitment Cards (The "Pledge"):**
  Before the round starts, you may write a Pledge on an index card: *"I will not back down below Rung X."*
  *   **Cost:** 2 Rations (deducted from your total immediately).
  *   **Enforcement:** If you play a Rung lower than your Pledge, you pay a **Penalty of 10 Rations**.
  *   **Visibility:** You may show this card to your opponent *before* they choose their Rung, or keep it sealed until the reveal.

  **Temperament Cards (The "Label"):**
  At the start of the game, you may buy a Label for 5 Rations.
  *   **Label:** "Unpredictable."
  *   **Effect:** You may roll your Rung choice in secret. You are not required to reveal your Rung until *after* the Catastrophe roll. (This simulates opacity).

  ---

  ## Part 2: Gameplay Blocks (60 Minutes Total)

  ### Block 1: "The Skirmish" (3 Rounds, 20 Minutes)
  *   **Stakes:** Catastrophe = Lose the Pot for this round only. No further penalty.
  *   **Goal:** Get a feel for the risk.
  *   **Facilitator Note:** Walk around. Ask tables: "Why did you stop at Rung 3?" Do not answer "Why." Just say "Noted."

  ### Block 2: "The Crisis" (3 Rounds, 25 Minutes)
  *   **Announcement:** "Rules Update. The environment has changed."
  *   **Stakes:** Catastrophe = **-20 Rations** (Debt allowed) **AND** every other pair in the room loses 2 Rations.
  *   **Goal:** Feel the weight of externalities.
  *   **Facilitator Note:** Emphasize the room penalty. "If Table 1 crashes, Table 2 pays."

  ### Block 3: "The Glitch" (2 Rounds, 15 Minutes)
  *   **Announcement:** "Command links are degraded. Introduce the Event Deck."
  *   **Mechanic:** Shuffle 10 cards: 9 "Clear" cards, 1 "Static" card.
  *   **Procedure:** Before players reveal Rungs, draw one card.
      *   **Clear:** Play normally.
      *   **Static:** **Forced Escalation.** Both players are automatically moved up **one Rung** from their chosen position. (e.g., If you chose 3, you are now at 4).
      *   **Risk:** The Catastrophe roll uses the *new, higher* Rung.
      *   **Commitment Clash:** If the Forced Escalation violates your Pledge (e.g., You pledged "Max Rung 3" but Static pushes you to 4), you **automatically Crash**. No roll. You broke your tripwire.
  *   **Goal:** Test the fragility of commitment devices against loss of control.

  ---

  ## Part 3: The Debrief (45 Minutes)

  *Do not lecture. Ask these questions in order. Write answers on the whiteboard. Introduce terms only after they describe the phenomenon.*

  **1. The EV Trap (10 mins)**
  *   "In Block 1, at what Rung did the math tell you to stop?" (They will calculate EV).
  *   "Did anyone play past the math? Why?"
  *   *Reveal:* **Credible Threat.** "The math says fold. But if you know your opponent will fold, you win by escalating. But if they know you know..."
  *   *Term:* **The Rationality of Irrationality.** (Write on board).

  **2. The Commitment Cost (10 mins)**
  *   "Who bought a Pledge? Did it work?"
  *   "Who bluffed with a Pledge? (Bought it but broke it?)"
  *   *Reveal:* A pledge only works if it costs you to break it. If you can break it cheaply, it's just talk.
  *   *Term:* **Tying Hands / Commitment Devices.**

  **3. The Stakes Shift (10 mins)**
  *   "In Block 2, when the room was on the line, did escalation go up or down?"
  *   *Hypothesis A:* It went down (We cooperated to survive).
  *   *Hypothesis B:* It stayed the same/went up (The structure forced us).
  *   *Reveal:* If it stayed high, the *structure* of the ladder dominates the *magnitude* of the stakes. This is the core of MAD.
  *   *Term:* **Mutually Assured Destruction.**

  **4. The Glitch (10 mins)**
  *   "Who crashed because of the Static card?"
  *   "If you had a Pledge, did it save you or kill you?"
  *   *Reveal:* A tripwire deters the enemy, but if the system glitches, the tripwire kills *you*. You cannot optimize for both deterrence and safety.
  *   *Term:* **The Stability-Instability Paradox / Loss of Control.**

  **5. Closing (5 mins)**
  *   Now you can mention Schelling. Hand out a reading list. Order pizza.

  ---

  ## Predictable Failure Modes & Fixes

  **1. "I Just Calculated the EV"**
  *   *Symptom:* A player explains they stopped at Rung 3 because Rung 4 has negative expected value.
  *   *Fix:* During the game, whisper to them: "Your opponent at Table 4 is playing 'Always Rung 5'. Adjust." Force them to react to *behavior*, not just math.
  *   *Debrief:* Point out that EV assumes a random opponent. Deterrence is about shaping the opponent's choice.

  **2. "Irrational = Aggressive"**
  *   *Symptom:* Players think buying the "Unpredictable" label means they should escalate more.
  *   *Fix:* In debrief, ask: "Did being unpredictable make you safer, or just more likely to crash?"
  *   *Correction:* Irrationality is a *strategy*, not a temperament. It's about convincing the other guy you *might* crash, not that you *want* to.

  **3. Block 1 is Too Trivial**
  *   *Symptom:* People laugh off the Block 1 losses.
  *   *Fix:* Make the Block 1 loss *annoying*. If you crash in Block 1, you have to stand up and clap for the winner. Social friction > point friction.

  **4. The "Global Catastrophe" Revolt**
  *   *Symptom:* In Block 2, pairs collude. "I'll fold if you fold, so no one crashes."
  *   *Fix:* This is actually a *success* (it proves high stakes drive cooperation). But if they collude *too* hard, the game stalls.
  *   *Intervention:* Remind them: "You still need points for pizza. If you both fold every time, you both starve." The incentive to win must remain.

  **5. The Glitch Feels Unfair**
  *   *Symptom:* "You cheated, I would have won."
  *   *Fix:* Pre-announce the Static card exists in the deck, but not the probability. It represents "Fog of War." If they complain, ask: "Did the Soviets know when their radar was glitching?"

  ---

  ## Limitations: What This Game Cannot Reproduce

  *Be explicit about these in the final 5 minutes.*

  1.  **Endogenous Risk:** In the game, the risk is a printed number (1-in-20). In reality, leaders *create* the risk by putting troops on alert. The game makes risk exogenous (fixed); reality makes it endogenous (chosen).
      *   *Confidence:* High. This is a necessary simplification for playability.
  2.  **Domestic Politics:** In the game, the "Nation" is one or two people. In reality, the leader is deterred by their own voters, generals, or economy.
      *   *Confidence:* High. You could simulate this by giving each player a "Domestic Unrest" track, but it adds too much complexity for 2 hours.
  3.  **Terminality:** In the game, a Catastrophe is -20 points. In reality, it is game over. We cannot simulate true terminality without ending the session early.
      *   *Confidence:* High. This is the biggest gap. The "fear" in the room is simulated, not existential.
  4.  **Multipolarity:** This is a bilateral game (Pair vs. Pair). Real deterrence often involves 3+ actors (US, USSR, China).
      *   *Confidence:* Medium. You could try a 3-player variant, but dyads are cleaner for teaching the core paradox.

  ## Card Text Templates (Print/Copy these)

  **Pledge Card:**
  > **PLEDGE**
  > Cost: 2 Rations (Pay now)
  > "I will not play below Rung [___]."
  > Penalty for breaking: 10 Rations.
  > *Show to opponent to convince. Keep secret to trap.*

  **Temperament Card:**
  > **LABEL: UNPREDICTABLE**
  > Cost: 5 Rations.
  > Effect: You do not reveal your Rung choice until after the Catastrophe Roll.
  > *Opponents cannot react to your specific move, only your reputation.*

  **Event Deck (10 Cards):**
  > 9x **CLEAR** (No effect)
  > 1x **STATIC** (Forced Escalation +1 Rung. Pledges broken = Auto Crash)

  ---

  ## Final Facilitator Checklist

  1.  **Pizza:** Order *after* the game. The stakes must be real during play.
  2.  **Noise:** 14 people rolling dice is loud. Designate a "Silence Bell" for the reveal moments.
  3.  **Math:** Have a cheat sheet for the EV of each Rung so you can answer questions *after* the game, not during.
      *   *Rung 1:* EV +9.55
      *   *Rung 2:* EV +9.00
      *   *Rung 3:* EV +7.60
      *   *Rung 4:* EV +5.20
      *   *Rung 5:* EV +1.10
      *   *Rung 6:* EV -4.40 (Pure loss)
      *   *Note:* The EV drops, but the *win probability* increases. That is the tension.
  4.  **Tone:** Stay neutral. You are the Simulation Engine, not the Teacher. Let them feel the frustration of the Crash.

  If you run this exactly as written, the "Glitch" round will likely cause at least one table to Crash due to a broken Pledge. That moment of "I built a trap to scare him, and it caught me" is the entire lesson. Protect that moment.
