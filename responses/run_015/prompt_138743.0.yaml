answer: |-
  Here is a disambiguation of the aphorism "history is written by the victors," structured for use in a graduate seminar context.

  ### 1. Disambiguation: A Menu of Claims
  *Ordered from thinnest (empirical/institutional) to thickest (ontological/conceptual).*

  *   **Reading A (Archival Asymmetry):** The winning side retains physical control over the majority of primary sources, determines declassification schedules, and funds the repositories where research occurs.
      *   *Refinement of your (a):* This is not just about "selection" but about *access*. If Side A wins, Side B's archives may be looted, destroyed, or kept closed for decades.
  *   **Reading B (Narrative Bias):** The histories actually produced tend to vindicate the winning side's motives and demonize the losing side's, either through commission or omission.
      *   *Refinement of your (b):* This claims a correlation between victory and *favorable portrayal*. As you noted, this is empirically fragile in the Cold War case given the volume of Western self-critique (e.g., Williams, Kolko) and the post-1991 opening of Soviet archives.
  *   **Reading C (Agenda-Setting Power):** The victors determine which questions are deemed legitimate, which are marginalized, and which are rendered unaskable.
      *   *Refinement of your (e):* This is not about the *answer* given, but the *frame* allowed. It explains why "Who started it?" might be treated as a serious question in 1950 but a naive one in 1990, or vice versa.
  *   **Reading D (Functional/Pragmatic):** Ascriptions of responsibility are not descriptions of the past but speech-acts performed in the present to legitimize current policy.
      *   *Refinement of your (d):* "Blame" is a tool of statecraft. The "history" produced is a byproduct of the need to justify containment, détente, or rollback.
  *   **Reading E (Epistemic Hegemony):** The victors define the conceptual vocabulary (e.g., "totalitarianism," "expansionism," "freedom") used to describe the conflict, making it impossible to articulate the loser's perspective without using the winner's categories.
      *   *Addition:* This is stronger than Narrative Bias. Even a critical historian using the term "Soviet expansionism" has accepted the victor's ontology.
  *   **Reading F (Ontological Indeterminacy):** There is no objective "past" independent of the narrative constructed by the powerful; the "truth" is constituted by the victory itself.
      *   *Refinement of your (c):* This is the radical constructivist reading. Victory does not just bias the history; it creates the reality that is historically accessible.

  ### 2. Verdicts and Mapping
  *Verdicts: Platitude | Substantive & Defensible | Substantive & Dubious | False.*
  *Mapping: Prof (Dismiss Responsibility) | Classmate (Distrust Triumphalism) | Neither.*

  *   **Reading A (Archival Asymmetry)**
      *   **Verdict:** Substantive & Defensible. (Soviet archives were closed until 1991; US archives were open. This is a material fact.)
      *   **Maps To:** **Classmate.** It justifies suspicion of pre-1991 consensus but does not dismiss the responsibility question; it merely delays it until archives open.
  *   **Reading B (Narrative Bias)**
      *   **Verdict:** Substantive & Dubious. (Falsified by the existence of robust Western revisionism and the lack of a monolithic "triumphalist" block even in the 90s.)
      *   **Maps To:** **Classmate.** (Weakly). It supports skepticism of *specific* triumphalist texts but implies a correction is possible.
  *   **Reading C (Agenda-Setting Power)**
      *   **Verdict:** Substantive & Defensible. (Funding streams, think-tank influence, and the "end of history" mood did marginalize certain structuralist or Marxist inquiries post-1991.)
      *   **Maps To:** **Professor.** It suggests the question itself is managed by power structures, making a neutral answer impossible within the current regime.
  *   **Reading D (Functional/Pragmatic)**
      *   **Verdict:** Substantive & Defensible. (Responsibility claims track policy needs: e.g., blame shifts when détente is desired vs. when rearmament is desired.)
      *   **Maps To:** **Professor.** If blame is a political act, asking "who started it" as a historical fact is a category error.
  *   **Reading E (Epistemic Hegemony)**
      *   **Verdict:** Substantive & Defensible. (The language of "international norms" in 1945 was largely Anglo-American; Soviet security concerns were framed as "paranoia" rather than strategic calculation.)
      *   **Maps To:** **Both.** It explains why the Classmate sees the 90s narrative as suspect (concepts are biased) and why the Professor sees the question as unresolvable (concepts determine the answer).
  *   **Reading F (Ontological Indeterminacy)**
      *   **Verdict:** False. (Incompatible with historical realism; if taken seriously, it renders the seminar itself meaningless.)
      *   **Maps To:** **Professor.** (Only if he is a radical constructivist). It licenses total dismissal of the question.

  ### 3. The Referent Problem: "Victors" in the Cold War
  *Does the sentence become unfalsifiable or inapplicable?*

  *   **The Problem:** The Cold War lacked a surrender ceremony. The USSR dissolved internally; the US did not occupy Moscow. The "victory" is retrospective, defined by the survival of one system and the collapse of the other.
  *   **Impact on Readings:**
      *   **Readings A & B (Archives/Narrative):** The phrase becomes **contingent**. If Soviet archives open (which they did), the "victor" no longer controls the evidence. If Western scholars criticize the West (which they do), the "victor" no longer controls the narrative. In this specific case, the aphorism loses empirical traction.
      *   **Readings C, D, & E (Agenda/Function/Concepts):** The phrase remains **robust**. Even without a surrender, the US acquired the power to define the *meaning* of the end (e.g., "Triumph of Democracy" vs. "Geopolitical Accident"). The "victor" is whoever successfully narrates the end as a victory.
      *   **Unfalsifiability Risk:** If "victor" is defined simply as "those whose narrative dominates," the sentence becomes a tautology (History is written by those who write history). To avoid this, "victor" must be defined institutionally (who holds the capital, the military bases, the reserve currency) prior to the historiography.
      *   **Conclusion:** In the Cold War context, the slogan is not about military victory but about **hegemonic stability**. It applies less to "who started it" (1947) and more to "how it is remembered" (1992–present).

  ### 4. Methodological Instructions
  *Can any reading be converted into a heuristic?*

  *   **Reading A (Archives):** *Instruction:* "Map the archival asymmetry." Do not assume the documentary record is representative. Explicitly state which archives were closed during the period the historiography was produced.
  *   **Reading C (Agenda):** *Instruction:* "Trace the funding and institutional lineage." Who funded the research? Which policy debates coincided with shifts in the historiographical consensus?
  *   **Reading E (Concepts):** *Instruction:* "Audit the vocabulary." Are you using terms (e.g., "sphere of influence," "containment") that presuppose the validity of one side's strategic doctrine?
  *   **If none suffice:** The slogan is largely a conversation-stopper.
      *   **Replace the Question:** Do not ask "Who started the Cold War?"
      *   **Ask Instead:** "Under what conditions did the attribution of responsibility become politically salient?" or "How did the interaction of ideological asymmetry and security dilemmas render the concept of 'origination' analytically useless?"

  ### 5. Precisifying "Who Started It" & The Spiral Model
  *Analysis of your precisifications and the Spiral Model worry.*

  *   **Your Precisifications:**
      1.  *First Move:* Chronological priority.
      2.  *Norm Departure:* Violation of existing international law/custom.
      3.  *Causal Necessity:* Counterfactual dependence (if X hadn't happened, no Cold War).
      4.  *Justification:* Moral/strategic defensibility of the move.
      5.  *Room to De-escalate:* Who had the most flexibility?
      6.  *Probability Shift:* Who most increased the likelihood of conflict?
  *   **Missing Precisifications:**
      7.  *Structural Inevitability:* Neither started it; bipolarity made it inevitable (Waltzian).
      8.  *Ideological Incompatibility:* Both started it by refusing to accept the other's legitimacy.
  *   **The Spiral/Security Dilemma Model:**
      *   **Impact:** If the spiral model is roughly right, defensive measures by Side A look offensive to Side B, prompting defensive measures by Side B that look offensive to Side A.
      *   **Verdict on "Origination":** You are correct. Under a strict spiral model, "who started it" is **ill-formed**. It is like asking which wall of a room is the "corner." The causality is reciprocal and simultaneous.
      *   **Responsibility:** Responsibility becomes distributed or structural. Blaming one side requires assuming one side's perception was "correct" and the other's was "paranoid," which is itself a political judgment.
  *   **Relation to the Slogan:**
      *   The slogan ("History is written by the victors") does **not** gesture at this mechanistic indeterminacy.
      *   The slogan gestures at *power biasing the record*.
      *   The Spiral Model gestures at *complexity biasing the causality*.
      *   **Your Worry:** Your worry is independent of the slogan. The slogan implies there *is* a truth but it's suppressed. The Spiral Model implies there *isn't* a truth to be found about "starting." The Professor may be conflating the two: using the slogan to cover for the fact that the question is analytically broken.

  ### 6. The Side-Effect Effect (Knobe Effect)
  *Verification and Relevance.*

  *   **Verification:** You have it right. Experimental philosophy (Joshua Knobe et al.) demonstrates that people are more likely to judge a side effect as "intentional" if it is harmful (bad) than if it is beneficial (good), even if the epistemic state of the agent is identical. Related work shows causal attribution shifts based on moral blameworthiness.
  *   **Relevance to Readings:**
      *   **Undercuts Reading A (Archives):** It suggests that even if archives were perfectly symmetrical, historians would *still* assign responsibility asymmetrically due to cognitive moralizing. Better data does not solve moral bias.
      *   **Supports Reading D (Functional/Pragmatic):** It confirms that blame-ascription is driven by moral evaluation (present-directed) rather than causal analysis (past-directed).
      *   **Supports the Professor:** It suggests the question "Who started it?" triggers a moral cognitive module, not a historical analytical one. The "answer" will always track the moral valence of the "victor."
      *   **Supports Your Spiral Worry:** If causal attribution is contaminated by moral judgment, then in a reciprocal spiral where both sides feel morally justified, historians will simply pick the side they morally prefer and attribute "causal start" to them. This reinforces the idea that "origination" is a moral category, not a historical one.

  **Summary Recommendation for Your Paper:**
  Use the **Spiral Model** to argue that "origination" is analytically indeterminate. Use **Reading E (Epistemic Hegemony)** and the **Knobe Effect** to argue that attempts to resolve this indeterminacy are inevitably moral/political acts that track power (the "Victors"). This allows you to accept the Professor's skepticism about the *question* without accepting the Classmate's simpler suspicion of the *sources*.
