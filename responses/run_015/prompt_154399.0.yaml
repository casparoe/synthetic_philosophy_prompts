answer: |-
  Your inquiry strikes at the heart of the metaphysical tension between property as a fixed coordinate and property as a network of relations. In the context of your inheritance dispute, the question of whether a boundary is an intrinsic feature of the land (analogous to absolute space) or defined solely by its neighbors (analogous to relationism) mirrors the Newtonian debate. Below is a conceptual analysis of the three specific points you raised regarding Newton's Scholium.

  ### 1. Causal Agency vs. Ontological Ground

  Newton's argument does not require absolute space to act as a **causal agent** in the efficient sense. It is crucial to distinguish between the *cause* of the physical effect (the concavity or tension) and the *standard* by which that effect is interpreted as "true motion."

  In Newtonian mechanics, the efficient cause of the water climbing the bucket or the cord tensing between the globes is **inertia** (the *vis insita* of matter). The water strives to move in a straight line; the bucket or cord constrains it to a curve. The physical stress arises from the resistance of the matter to this deviation from rectilinear motion. Absolute space does not push the water outward; rather, it provides the immutable background against which "rectilinear motion" is defined.

  Therefore, Newton commits to space as an **ontological ground**, not a causal agent. Space functions as the necessary condition for the intelligibility of acceleration. Without an immovable framework, "acceleration" loses its meaning, because acceleration is a change in velocity with respect to a fixed reference. If space were merely relational, and all bodies vanished, the concept of acceleration would vanish with them. Newton argues that the *effects* of acceleration (tension, concavity) persist even when relative positions to nearby bodies do not change (as when the water rotates with the bucket). Thus, space is the reality that grounds the truth of the motion, but the *force* generating the observable effect comes from the matter's own inertia acting within that space.

  ### 2. The Two Globes and the Distant Matter Defense

  The rotating bucket experiment successfully demonstrates that true motion is not relative to the **immediate container**. However, it leaves open a loophole for the relationist: the water might be rotating relative to the **distant fixed stars** or the bulk mass of the universe. A sophisticated relationist could argue that the concavity arises because the water is moving relative to the general frame of reference provided by distant matter, not because of an invisible absolute space.

  The two-globes thought experiment is designed specifically to close this loophole. By positing a universe containing *only* the two globes and the cord, Newton removes all external reference points, including distant matter.

  *   **The Logic:** If tension exists in the cord in this empty universe, it cannot be explained by relation to external bodies, because there are none.
  *   **The Trap:** The relationist is forced to claim either that (a) there would be no tension in such a void (which contradicts our understanding of inertia and centrifugal force), or (b) that the concept of rotation is meaningless without external bodies.
  *   **Newton's Move:** Newton asserts that we could calculate the quantity of circular motion from the tension alone, even without seeing the globes move relative to anything else. This implies that the "truth" of the motion is internal to the system's relationship with space itself, not its relationship with other matter.

  The globes case shifts the burden of proof. It forces the relationist to deny the physical reality of inertial forces in a vacuum. Newton assumes that the laws of motion (specifically inertia) hold regardless of the presence of other matter. If inertia is a property of matter itself, and inertia manifests as resistance to acceleration, then acceleration must be definable without reference to other matter. The globes argument isolates inertia from external relations, suggesting that the reference frame for inertia is space itself.

  ### 3. Structural Relationism and Newton's Observations

  A contemporary structural relationist (or structural realist) can consistently accept Newton's observational claims about the bucket and globes while rejecting his substantivalist ontology. This position distinguishes between the **geometry of spacetime** and the **substance of space**.

  *   **Newton's View:** Space is a substance-like entity (or an emanative effect of God) that exists independently of bodies. It is a "container" that persists even if empty.
  *   **Structural View:** What is real is not the "container" but the **metric and affine structure** that governs how bodies move. This structure defines what counts as a straight line (a geodesic) and what counts as acceleration.

  A structuralist agrees with Newton that there is a **non-relational fact of the matter** about whether the bucket is accelerating. The water rises because the bucket is deviating from the inertial structure of the universe. However, the structuralist denies that this structure requires a substantial entity called "Absolute Space" to underwrite it. Instead, the structure is a fundamental feature of the physical world, perhaps grounded in the laws of physics themselves rather than in a spatial substance.

  In this view:
  1.  **Observational Claims:** The tension and concavity are real effects of deviation from inertial paths. The structuralist accepts this fully.
  2.  **Ontological Claim:** The structuralist rejects the idea that "space" exists as an independent substance. They argue that spacetime structure is real, but it is not a "thing" separate from the events and relations it governs.

  This allows the structuralist to preserve the "absolute" nature of acceleration (it is not relative to neighbors) without committing to the "absolute" nature of space as a substance. For your seminar, this distinction is vital. It suggests that one can treat location as having an objective, non-relational status (like the structural metric) without needing to posit land as a mystical, independent substance. In legal terms, this is akin to distinguishing between a survey grid (an objective structural framework) and the land itself (the substance). One can accept the grid as real and binding for defining boundaries without claiming the grid lines are physical entities existing independently of the survey.

  ### Summary for Your Position

  To synthesize these points for your draft:

  1.  **Causality:** Newton treats space as the **standard** for true motion, not the **force** causing the effects. The force is inertia; space is the immutable background that makes inertia intelligible.
  2.  **The Globes:** This argument eliminates the "distant stars" defense available to relationists after the bucket argument. It isolates inertial effects from all external matter, forcing the conclusion that the reference frame is space itself.
  3.  **Structuralism:** One can accept Newton's physics (absolute acceleration exists) without his metaphysics (space is a substance). A structural ontology allows for objective boundaries and locations (non-relational facts) grounded in a framework, without requiring that framework to be a substantial entity.

  This nuanced reading allows you to argue that location can be an intrinsic feature of a spatial framework (objective and non-relational) without requiring that framework to be a physical "thing" in the same way land is a physical thing. This may offer a productive middle ground for your legal ontology: boundaries are real and absolute relative to the survey structure, even if that structure is a conceptual or legal construct rather than a physical substance.
