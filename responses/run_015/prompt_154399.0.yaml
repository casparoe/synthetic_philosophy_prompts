      *   Section 1 (Causality): Distinguish between efficient cause (forces/inertia) and formal/ontological ground (space as the standard). Space defines acceleration; inertia creates the tension.
      *   Section 2 (Globes): Contrast with the bucket. Bucket rules out local relation (vessel). Globes rule out global relation (fixed stars) by positing a void. It forces the relationist into a corner regarding the existence of inertia without matter.
