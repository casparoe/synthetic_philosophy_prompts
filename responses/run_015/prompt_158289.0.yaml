      *   *Single Sacrifice:* (4). It's the most technically fragile and creates the specific bottleneck for (5).

      *   *Uncertainty:* Whether "rational integration" is strictly necessary for compression in the Kolmogorov sense. LLMs might compress via statistical regularities that mimic rationality without the underlying integration.

