answer: |-
  This is a sharp observation that cuts to the heart of contemporary political philosophy, specifically the debate surrounding **Public Reason Liberalism**. You have identified what critics like Nicholas Wolterstorff, Paul Weithman, and Robert Audi have long argued: the "secularist bias" inherent in how public reason is often applied in practice, even if not always in theory.

  Here is the reconstruction of the theory, the evaluation of its defensibility, and the implications of consistency.

  ### 1. The Presupposed Principle: The Accessibility Condition
  The practice you describe presupposes a specific interpretation of the **Principle of Public Justification**. This principle holds that the exercise of coercive political power is legitimate only if it can be justified by reasons that are "accessible" to all reasonable citizens.

  In this framework, a reason is "accessible" if it relies on premises and methods of inference that are shared by the common pool of human reason, rather than dependent on private authority or special revelation. The theory assumes that **religious reasons** are inherently "private" because they rest on faith commitments (e.g., the authority of Scripture or Church tradition) that are not available to non-believers. Conversely, it assumes that **secular comprehensive doctrines** (like utilitarianism or Kantianism) are "public" because they ostensibly rest on rational argumentation and empirical claims about human well-being that anyone can evaluate, regardless of their metaphysical commitments.

  ### 2. Is the Distinction Defensible?
  No, the asymmetry is not ultimately defensible. It rests on a category error that conflates "secular" with "neutral."

  The mistake lies in the assumption that secular comprehensive doctrines are more "accessible" than religious ones. As you noted, utilitarianism is a controversial moral metaphysics. It makes claims about the nature of value (pleasure/preference satisfaction is the only good) that a Kantian, a virtue ethicist, or a religious believer can reasonably reject. If the bar for public legitimacy is "acceptability to all reasonable citizens," then hard-core utilitarianism fails the test just as thoroughly as Catholic social teaching.

  The practice persists not because the distinction is logically sound, but because secular comprehensive doctrines often align with the **background culture** of liberal elites. When a city councilor invokes utilitarianism, it sounds like "common sense" or "technocratic efficiency" to the secular majority, whereas religious language signals "particularism." This is a sociological bias masquerading as a philosophical constraint. If we take the "accessibility" requirement seriously, there is no relevant difference between a premise derived from Aquinas and a premise derived from Bentham; both are comprehensive claims that not all reasonable citizens share.

  ### 3. The Consistent Version: The Thin Overlapping Consensus
  If we applied the underlying principle consistently—banning all reasons that depend on controversial comprehensive doctrines—the practice of public debate would become significantly "thinner."

  Councilors would be prohibited from arguing for zoning changes based on *either* "stewardship of the land" (religious) *or* "maximizing aggregate welfare" (utilitarian). Instead, they would be forced to translate both into a **political conception of justice** that sits within the "overlapping consensus." They would have to argue in terms of shared political values: property rights, public health, traffic safety, or procedural fairness.

  This would create a firewall around deep moral philosophy in the legislative chamber. You could support a policy that *aligns* with your faith or your utilitarianism, but your *justification* on the record would have to be limited to values that a secular Kantian, a religious traditionalist, and a utilitarian could all endorse without converting to each other's worldviews. In practice, this often means discourse becomes more legalistic and technocratic, focusing on rights and procedures rather than the "good life."

