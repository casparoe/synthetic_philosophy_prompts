          3.  Conclusion from 1&2: Only bare identification ("he's my friend") preserves integrity. No *because*-clauses.
          4.  Application to Criticism: Criticizing a harmful attachment (e.g., saving an abusive partner) requires offering a reason (e.g., "equal moral worth"). This reason is a mediated description.
          5.  Dilemma: Accept harmful act (preserve integrity, drop criticism) OR allow mediation (allow criticism, sacrifice integrity).
          6.  Williams's Priority: Integrity is non-negotiable/worse to lose than morality.
