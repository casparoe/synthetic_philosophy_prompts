  2.  **Deconstruct the Two-Envelope Problem & Standard Resolution:**
      *   *Setup:* Two envelopes, one has $x$, the other $2x$. You pick one, see amount $A$. Should you switch?
      *   *Naive Argument:* $E(\text{other}) = 0.5(2A) + 0.5(A/2) = 1.25A > A$. Always switch. Paradox: Symmetry suggests indifference.
      *   *Standard Resolution:* The probability that the other envelope is $2A$ or $A/2$ isn't necessarily 0.5 each. It depends on the prior distribution of money in the envelopes. If you integrate over all possible values with a proper prior, $E(\text{switch}) = E(\text{stay})$.
      *   *User's Critique:* The standard resolution smuggles in a proper prior. If the prior is improper (e.g., uniform over $\mathbb{R}^+$), the math changes, and the paradox might remain genuine in that context.

