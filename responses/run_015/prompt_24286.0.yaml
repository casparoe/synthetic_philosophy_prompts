answer: |-
  The standard resolution of the two-envelope paradox hinges on the claim that the naive expected-value calculation commits a category error by treating the observed amount $A$ as a fixed constant while simultaneously varying the probability that it is the smaller or larger envelope. Orthodoxy dictates that once we correctly compute the conditional probabilities $P(\text{other} = 2A | A)$ and $P(\text{other} = A/2 | A)$, the advantage of switching vanishes. However, this move quietly smuggles in a substantial assumption: that the prior distribution over the envelope amounts is proper. The resolution does not demonstrate that switching is never favorable; it demonstrates only that switching cannot be favorable for all values of $A$ *given a proper prior*. By treating the necessity of a proper prior as a logical constraint rather than a modeling choice, the standard account dismisses the paradox prematurely.

  Consider the case where the host's distribution over the smaller amount $x$ is an improper uniform prior over the positive reals, representing a state of total ignorance regarding the scale of the money involved. Under this prior, the density $\pi(x)$ is constant. If I observe an amount $a$ in my envelope, the likelihood that $a$ is the smaller amount (implying $x=a$) is proportional to $\pi(a)$, and the likelihood that $a$ is the larger amount (implying $x=a/2$) is proportional to $\pi(a/2)$. Since the prior is uniform, $\pi(a) = \pi(a/2)$, and Bayes' theorem yields posterior probabilities of exactly $1/2$ for each case. Consequently, the conditional expectation of the other envelope is indeed $0.5(2a) + 0.5(a/2) = 1.25a$. In this specific context, the "conflation of variables" critique fails because the probabilities do not shift with $a$ in the way the resolution requires; the symmetry of the improper prior preserves the 50/50 odds at every observed value.

  The standard resolution only regains traction because proper priors must decay at infinity to integrate to unity. This decay ensures that for sufficiently large $a$, it becomes increasingly probable that you are holding the larger envelope, thereby dragging the conditional expectation of the other envelope down below $a$. But this corrective mechanism is an artifact of the normalization constraint, not a feature of the decision problem itself. If we permit improper priors to model unbounded ignorance, the switching advantage persists conditionally for every possible observation. Thus, the claim that the paradox is dissolved is unsound; it merely shifts the burden to justifying why rational agents must always assume proper priors, an assumption that does real, unacknowledged work in forcing the expectation equality.
