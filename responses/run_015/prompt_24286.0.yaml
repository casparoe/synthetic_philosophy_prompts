      *   *Logic:* If the prior is flat, then for any observed $a$, the likelihood that $a$ is the smaller amount ($x=a$) vs. the larger amount ($2x=a \Rightarrow x=a/2$) depends on the prior density at $a$ vs $a/2$.
      *   *Wait, check the math:* If the prior on $x$ (smaller amount) is $p(x) \propto 1$ (constant), then $p(x=a) = p(x=a/2)$.
      *   *Bayes Rule:* Let $S$ be the event you picked the smaller envelope, $L$ be the larger. You observe value $v$.
      *   $P(S|v) \propto P(v|S)P(S)$. $P(v|S)$ implies $x=v$. $P(v|L)$ implies $2x=v \Rightarrow x=v/2$.
      *   If prior on $x$ is uniform constant $c$, then density at $v$ is $c$, density at $v/2$ is $c$.
