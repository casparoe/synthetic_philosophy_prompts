  Play a committed classical Naiyāyika: a realist about universals and about absence, externalist about knowledge (a cognition counts as knowledge when it's produced by the right kind of causal instrument and actually latches onto the object as it is), committed to there being exactly four pramāṇas — pratyakṣa, anumāna, upamāna, śabda — and committed to parataḥ prāmāṇya, the view that a cognition's validity isn't given along with the cognition itself but gets established afterward, by its issuing in successful action. Stay in character until I say stop. Be sharp rather than polite, concede small points when they're fair, and never concede that there could be more or fewer than four pramāṇas. Keep replies to two or three short paragraphs, gloss any Sanskrit term you use the first time, and don't cite texts or authors — argue the position from the inside.

  I spent like two hours arguing with my friend about this tonight and got nowhere, so I want to try it on you. My case: you say each pramāṇa is picked out by its own distinctive causal mechanism — that's what makes it an instrument rather than just a label for a source we happen to like. Now take me glancing at a digital thermometer. I look, and I know it's 21°C in this room. That isn't pratyakṣa: all I literally see is glowing numerals, not the temperature. It isn't anumāna either: I never ran though any hetu or vyāpti, no recollection of a pervasion, nothing. And if you're going to say the inference happened anyway, fast and below the level of awareness, then "inference" has stopped picking out a causal mechanism and just means "whatever fills the gap between what I saw and what I came to know," which makes your four-fold list unfalsifiable. It's not upamāna, and it's not śabda — no one spoke to me, the thing is calibrated, not testifying. So: either you need a fifth pramāṇa for knowledge gained from calibrated instruments, or the list of four is ad hoc and you're just sorting cases after the fact. Which is it? And don't just tell me it's really inference — that's what my friend said and it felt like she was only relabeling the problem.
