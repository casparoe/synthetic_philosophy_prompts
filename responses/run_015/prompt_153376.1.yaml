  The question forces the candidate to decide whether luck egalitarianism remains coherent when the choices for which people are held responsible are themselves the product of unequal luck.

  **POLITICAL PHILOSOPHY SOCIETY: END-OF-TERM EXAMINATION**

  **Time Allowed:** 60 Minutes
  **Word Limit:** Approximately 900 words
  **Total Marks:** 20

  **Question 1**

  In the imaginary Republic of Varrania the state operates the Equal Risk Scheme. Each year every citizen's disposable income is adjusted by a "luck audit," which works as follows:

  *   Officials construct, for each citizen, a counterfactual twin: someone placed in the same social position and with the same legal rights, but endowed with the average bundle of native endowments (health, talents, temperament) and an average-quality upbringing.
  *   Any shortfall between the citizen's income and the twin's is attributed to brute luck, and is cancelled by a state transfer. (A misfortune counts as brute luck when it did not flow from any choice of the agent's.)
  *   Any shortfall that flows from the citizen's own choices is left standing; the citizen bears it. (A misfortune counts as option luck when it is the outcome of a gamble the agent knowingly took.)
  *   Officials treat a choice as genuinely the agent's own, and therefore as a responsibility-bearing choice, only when three conditions hold: the agent had adequate information about the risks, was not coerced, and could reasonably have foreseen the outcome.
  *   Varrania maintains a modest floor below which no one is allowed to fall, but it insists that the floor is humanitarian relief rather than justice. Justice, it says, is done by the audit.

  Varrania's actuaries have recently published two awkward findings:

  (i) The choices that show up in the audit are themselves distributed by brute luck. People who grew up in poverty, or who inherited a temperament low in impulse control, are markedly more likely to make exactly the choices — casual work, no saving, early dropout — that leave them short of their twin. The audit therefore converts brute luck into apparent option luck, and the transfers shrink towards zero precisely for those who began worst off.

  (ii) Some losses are covariant. When Varrania's shipbuilding region collapses after a trade shock, everyone who chose to work there loses at once, and no private insurer would ever have covered the risk, since there is no pool across which to spread it.

  **Answer the following three parts:**

  1.  Explain why Varrania's architects would say the Equal Risk Scheme is the most natural institutional expression of luck egalitarianism — why the audit, and not merely the floor, is supposed to be where the justice is.
  2.  Give a verdict on the actuaries' findings: do they refute the scheme, or can it be reformed so that it survives them? You must pick the strongest reform available — for instance, relocating the luck/choice cut from outcomes to opportunities, or holding agents responsible only for choices that express who they really are — and defend that reform against the strongest objection to it.
  3.  State what your answer to part 2 shows about what sort of doctrine luck egalitarianism actually is: is it fundamentally a view about treating people as equals, or a view about people getting what they deserve, and can it coherently be both?

  **Instruction:** An answer that merely defines brute and option luck and lists objections without proposing a specific reform and defending its doctrinal implications cannot score above 12 marks.

  ***

  **MODEL ANSWER**

  Varrania's architects claim justice is found in the audit rather than the floor because luck egalitarianism holds that inequalities arising from brute luck are unjust, while inequalities arising from option luck are permissible. The floor is merely humanitarian because it addresses absolute deprivation, not relative unfairness. The audit attempts to neutralize the moral arbitrariness of nature and circumstance while preserving individual responsibility. By comparing citizens to a counterfactual twin with average endowments, the state isolates the specific value of a citizen's choices. If the scheme works, citizens are equal in terms of luck, but distinct in terms of agency. Justice is therefore defined as the elimination of unchosen disadvantage, not the elimination of disadvantage simpliciter.

  However, Finding (i) threatens to collapse this distinction. If impulse control and risk tolerance are themselves products of upbringing and genetics, then the "choices" penalized by the audit are merely brute luck in disguise. A strict application of the scheme punishes the unlucky for being unlucky, provided their misfortune took the form of a bad decision. This refutes the scheme as currently constituted because it violates the core egalitarian intuition that no one should be worse off due to factors beyond their control. To survive, Varrania must reform the responsibility conditions. The strongest reform is to shift the luck/choice cut from actual outcomes to fair opportunities. The state should only hold agents responsible for choices made against a background of sufficiently equal upbringing and endowment. If a citizen's temperament was shaped by poverty, their "choices" should be treated as brute luck until that background inequality is neutralized.

  The strongest objection to this reform is that it risks swallowing the rule. If every choice is traced back to some prior cause, responsibility vanishes entirely, and the audit becomes a universal insurance scheme against bad outcomes. This destroys the incentive structure and the respect for agency that luck egalitarianism values. To defend against this, the reform must set a threshold of "sufficient fairness" rather than demanding perfect equality of causation. Once basic capacities and information are secured, agents own their choices. This preserves a sphere of responsibility without punishing people for the luck that formed their character.

  Finding (ii) regarding covariant loss presents a different challenge. If an entire region collapses, the risk was not diversifiable. In a private insurance market, this risk is uninsurable. Varrania's audit treats this as option luck because the workers chose the industry. However, since no reasonable insurance was available, the "gamble" was not genuine. The reform here must be to classify uninsurable systemic risks as brute luck. Even if the choice to work in shipbuilding was voluntary, the collapse was not a risk an individual could reasonably bear or pool. The state must absorb these losses as social brute luck, distinct from individual option luck.

  These reforms reveal that luck egalitarianism is fundamentally a view about treating people as equals, not about desert. If it were about desert, those who made "bad" choices would deserve their poverty regardless of their upbringing. But because we must reform the scheme to protect those whose choices were shaped by bad luck, we admit that responsibility is conditional on equality. The doctrine cannot coherently be both. It must prioritize equality of status over strict accountability. If we hold people responsible for choices determined by unequal luck, we are not respecting their agency; we are punishing their history. Therefore, luck egalitarianism survives only if it accepts that equality constrains responsibility. The audit must serve the equal status of citizens, not merely track the metaphysics of choice.

  ***

  **MARKING SCHEME**

  | Criterion | Marks | Required Move | Typical Error / Cap |
  | :--- | :---: | :--- | :--- |
  | **1. Varrania's Justice Claim** | 4 | Explains that justice is neutralizing *unchosen* disadvantage (brute luck) while permitting *chosen* disadvantage (option luck), distinguishing this from the humanitarian floor. | **Cap at 10:** Merely defining brute/option luck without explaining why the *audit* specifically embodies justice rather than the floor. |
  | **2. Analysis of Finding (i)** | 4 | Identifies that finding (i) turns brute luck (upbringing/temperament) into apparent option luck, undermining the legitimacy of the penalties. | **Cap at 12:** Describing the finding accurately but failing to explain why this contradicts the core egalitarian intuition. |
  | **3. Proposed Reform** | 4 | Commits to a specific reform (e.g., fair background threshold) and defends it against the "responsibility vanishes" objection. | **A/B Divider:** B-answers list reforms; A-answers *commit* to one and argue why it solves the problem without destroying agency. |
  | **4. Analysis of Finding (ii)** | 4 | Classifies covariant/uninsurable risk as brute luck because individual agency cannot pool or foresee systemic collapse. | **Cap at 14:** Treating finding (ii) as identical to (i) or ignoring the insurance market constraint mentioned in the prompt. |
  | **5. Doctrinal Conclusion** | 4 | Concludes that LE is about equal status, not desert, and that equality must constrain responsibility for the doctrine to remain coherent. | **Cap at 16:** Asserting LE can be both equality and desert without resolving the tension exposed by the reforms in part 2. |

  **Examiner's Note:** An answer that states the brute-luck/option-luck distinction correctly and then recites the familiar objections, without ever saying what should be done about finding (i) or (ii), cannot exceed 12 marks. To reach the top band (18-20), the candidate must explicitly argue that equality constrains responsibility (Criterion 5) rather than treating them as separate values.
