  ### The Phenomenal Capacity Principle

  Based on your verdicts, your intuitions are remarkably consistent with a specific view in philosophy of mind often called the **Phenomenal Concept Strategy**, but with a crucial engineering twist regarding *capacity*. You seem to distinguish between knowing *about* a system and *occupying* a state, but only when certain conditions about your own sensory hardware are met.

  Here is a precise formulation of the principle that captures your judgments:

  **The Phenomenal Capacity Principle**
  1.  **The Acquaintance Clause:** There is a fundamental difference between *propositional knowledge* (knowing facts, code, or structures) and *acquaintance knowledge* (knowing what an experience is like directly). Complete physical knowledge does not automatically grant acquaintance knowledge.
      *   *Motivated by Case 5 (Report-Reader):* You explicitly distinguish between reading descriptions and "direct qualitative acquaintance."
  2.  **The Instantiation Clause:** Acquaintance knowledge is gained only when the knower's own cognitive or sensory system *instantiates* (runs) the state in question. Merely modeling the state externally is insufficient.
      *   *Motivated by Case 1 (Mary) & Case 3 (Anosmia):* In both cases, the subject learns something new because their own biological system finally activates the specific state they previously only knew about theoretically.
  3.  **The Prior Capacity Exception:** If the knower already possesses a functioning sensory capacity for that *type* of experience, complete structural knowledge of a specific instance *does* exhaust the knowledge of that experience. New structural data simply fills in details within an already-known qualitative framework.
      *   *Motivated by Case 2 (Source-Code):* You learn nothing new because you already have working vision. You know what "pixels" and "colors" look like. The code only tells you *which* colors appear. Since you already possess the "software" for seeing, running the code adds no new *kind* of knowledge, only confirmation.

  ---

  ### Application: The Waterfall Case

  **The Scenario:** A programmer writes a perfect physics simulation of water flowing over rocks, runs it, then stands beside a real waterfall for the first time.

  **Applying the Principle:**
  *   **Visual/Auditory Modality:** Unlike Mary (Case 1) or the Anosmic scientist (Case 3), the programmer already has functioning vision and hearing. They possess the "Prior Capacity."
  *   **The Simulation:** According to your **Prior Capacity Exception** (Case 2), if the simulation perfectly specified the visual and auditory data, the programmer should learn nothing new about the *look* or *sound* of the water by seeing the real thing. Their brain already knows how to process "water visuals"; the sim provided the data structure.
  *   **The Real Waterfall:** However, a real waterfall involves more than just visuals and sound pressure. It involves mist on the skin, vibration in the chest, and the smell of ozone. Unless the simulation was a full-body immersive interface (which "physics simulation" usually implies it is not), the programmer lacks prior acquaintance with these specific somatic and olfactory inputs.

  **Verdict:**
  Under your principle, the programmer **learns something new**, but *only* regarding the sensory modalities they did not simulate (touch, smell, full-body vibration). Regarding the pure *visual* experience of the water flow, your principle suggests they should learn **nothing new**, consistent with your Source-Code verdict. The "wow" factor of the real waterfall comes from the additional sensory channels, not from the visual qualia itself.

  ---

  ### The Hard Tension: Case 2 vs. Case 3

  You identified Case 2 (Source-Code) and Case 3 (Anosmia) as your hard-to-reconcile pair. My analysis suggests your **Phenomenal Capacity Principle** resolves this logically, but it exposes a deeper philosophical risk in your worldview.

  **The Resolution:**
  Your principle treats the difference as **Hardware-Relative**.
  *   In Case 3, the scientist's "hardware" (olfactory system) was broken/off. Turning it on provides a new *mode of access*.
  *   In Case 2, your "hardware" (visual system) was working. Reading the code was just loading new *data* into existing hardware.

  **The Problem:**
  This resolution relies on the assumption that **biological sensory activation is fundamentally different from computational execution.**
  *   In Case 3, you imply that knowing the biochemistry of smell is *not* the same as smelling, even if you know every fact.
  *   In Case 2, you imply that knowing the code of a sunset *is* the same as seeing it (provided you have eyes).

  **Honest Assessment:**
  You cannot hold both verdicts without a hidden assumption: **Biological Naturalism.** You are implicitly treating biological brains as "special" substrates that generate something (qualia) that silicon code does not, *or* you are assuming that "reading code" is somehow a more complete form of knowledge than "reading biochemistry."

  *   **Option A (Overturn Case 2):** If you believe physical knowledge never exhausts experience (as per Mary), you should admit that knowing the source code *does not* tell you what the sunset looks like if you have never seen a sunset before. The code specifies RGB values, but RGB values are not "redness." If you overturn this, you become a consistent **Non-Physicalist** regarding experience.
  *   **Option B (Overturn Case 3):** If you believe complete structural knowledge *does* exhaust experience (as per the Code case), you should admit that the Anosmic scientist learns nothing new. If she truly knows every neural fact, she knows the state she is entering. If you overturn this, you become a consistent **Physicalist**.

  **Recommendation:**
  Your Case 4 indecision proves you are sensing this conflict. In Case 4, the AI is like the Code (Case 2) but models a Human (Case 3).
  *   If you side with **Case 2**, the AI learns nothing (it's just running code).
  *   If you side with **Case 3**, the AI learns something (it's gaining a perspective).

  To resolve your worldview, you must decide: **Is the "new knowledge" Mary gains due to her *biology*, or due to the *nature of experience* itself?**
  *   If it's due to **biology**, then your Waterfall verdict stands (Programmer learns nothing visual, only tactile).
  *   If it's due to the **nature of experience**, then your Case 2 verdict is wrong (Engineer *does* learn something new about the sunset's look, because code $\neq$ experience).

  ### Summary of Your Position
  You are currently operating on a **Hybrid View**: You accept that experience adds something over physical knowledge (Mary/Anosmia), *unless* the observer already possesses the sensory machinery to interpret that physical knowledge directly (Source-Code). This is a stable position for a software engineer, but it places a heavy metaphysical burden on the distinction between "biological sensors" and "computational inputs." Case 4 will remain undecided until you choose whether an AI can ever truly "possess sensory machinery" in the relevant sense.
