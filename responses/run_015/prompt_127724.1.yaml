answer: |-
  Here's a lesson plan designed to hit those specific constraints. It's built to be run with minimal prep but maximum friction.

  # The Simulation: "The Priority Game"

  **Goal:** Demonstrate that while scientific *problems* might be inevitable, the *tools* used to solve them create path dependence that locks in future possibilities.
  **Time:** 75 Minutes
  **Players:** 12 Grad Students (2 Groups of 6)
  **Materials:** 
  *   2 Large sheets of paper (flipchart size)
  *   Markers (multiple colors)
  *   2 Envelopes labeled "Toolkit A" and "Toolkit B"
  *   "Citation Chips" (poker chips, candy, or just tally marks on the board)
  *   Timer visible to all

  ---

  ### 1. Setup & Grouping (5 mins)
  *   **Divide the room:** Split into two groups of 6. Send them to opposite corners of the room. They cannot communicate until the Tribunal.
  *   **Hand out Envelopes:** 
      *   **Group A (The Cartographers):** Get visual constraints.
      *   **Group B (The Archivists):** Get symbolic constraints.
  *   **The Hook:** Tell them: *"You are two research teams investigating the same natural phenomenon. You have received the same raw data. Your goal is to derive the Law of Growth governing this data. You must present your Law in the format specified in your envelope. You have 30 minutes."*
  *   **Crucial Rule:** Do not mention Newton, Darwin, or "path dependence." Do not let them compare notes yet.

  ### 2. Round 1: Independent Discovery (30 mins)
  **The Data (Write on board or handout):**
  *   Step 1: •
  *   Step 2: • • • (arranged in an L-shape)
  *   Step 3: • • • • • (arranged in a larger square)
  *   *(Basically square numbers: 1, 4, 9, 16...)*

  **Toolkit A (Cartographers) Constraints:**
  *   **Forbidden:** Numbers, variables (x, y, n), arithmetic operators (+, -, ×).
  *   **Allowed:** Shapes, arrows, shading, spatial prepositions ("inside," "around," "adjacent").
  *   **Output:** A diagrammatic "Instruction Manual" on how to build Step 4 from Step 3.

  **Toolkit B (Archivists) Constraints:**
  *   **Forbidden:** Drawing shapes, diagrams, spatial arrangements.
  *   **Allowed:** Variables, equations, logical statements, lists.
  *   **Output:** A symbolic "Formula" that yields the quantity of Step 4 given Step 3.

  **Instructor Role:** Circulate. Ensure they aren't cheating constraints. If Group B tries to draw a square, stop them. If Group A writes "n²", stop them. *This constraint enforcement is where the friction is generated.*

  ### 3. The Priority Tribunal (15 mins)
  Bring everyone back to the center. Post both "Laws" on the wall side-by-side.

  **The Vote:**
  Hand out 3 "Citation Chips" to each student. They must vote based on three criteria written on the board (keep the weighting secret until after voting to prevent strategizing):
  1.  **Efficiency:** Least steps to solve.
  2.  **Clarity:** Easiest to teach to a novice.
  3.  **Scalability:** Best for predicting Step 100.

  **The Verdict:**
  Count chips. The winning group becomes the "Standard Setters." The losing group becomes the "Translators."

  **The Twist (Round 2 Setup):**
  Announce: *"The scientific community has adopted the Winning Framework as the standard language for this field. All future work must be published in this format."*

  ### 4. Round 2: The Translation Tax (10 mins)
  **The New Problem:** Predict the structure/quantity of **Step 10**.

  *   **Winning Group:** Solve it using their own framework. (Should be easy/fast).
  *   **Losing Group:** They must solve the problem *using the Winner's framework*. They cannot use their own tools anymore. They have to translate their insight into the rival language to get the answer.

  **Scoring:**
  *   Correct Answer: 5 Points.
  *   Used Native Framework (Violation): 0 Points.
  *   Translation Error: -2 Points.

  *(Note: This eats into your buffer time. If Round 1 runs long, cut this to 5 mins and just ask them to outline how they would translate, rather than solving fully.)*

  ### 5. Debrief & Mapping (20 mins)
  Now you can name the concepts. Sit in a circle.

  **Phase 1: The Feeling (5 mins)**
  *   Ask the Losers: *"How did it feel to be forced to translate? Did you understand the phenomenon better or worse in the new language?"*
  *   Ask the Winners: *"Did your tool make Step 10 easier, or did it hide something about the shape/structure?"*

  **Phase 2: The Philosophy (10 mins)**
  Map the game to the seminar topics:
  *   **Functional Equivalence:** Both groups solved Step 4 correctly. The "truth" was captured by both.
  *   **Path Dependence:** The winner of the Tribunal didn't necessarily have the "truer" law; they had the law that fit the *voting criteria* (social factors). Once chosen, that notation locked everyone in.
  *   **Newton vs. Leibniz:** Group A is Newton (fluxions/geometric), Group B is Leibniz (calculus notation/algebraic). Leibniz won historically not because he was "righter," but because his notation was more manipulable for future problems (Scalability).
  *   **Darwin vs. Wallace:** Darwin's "breeding" analogy vs. Wallace's "environmental pressure." Both explain selection, but Darwin's framing allowed for domestication studies; Wallace's led to biogeography. The *form* directed the *future research*.

  **Phase 3: Inevitability (5 mins)**
  *   Ask: *"Was the solution inevitable?"* (Yes, the pattern is mathematical).
  *   Ask: *"Was the notation inevitable?"* (No, it was contingent on the Toolkit constraints).
  *   **Conclusion:** Science progresses toward truth, but the *path* it takes is contingent on the tools available at the moment of discovery. Those tools then become the rails for the next century.

  ---

  ### What Will Predictably Go Wrong (And How to Fix It)

  **1. The Math Imbalance**
  *   **Risk:** If Group B (Symbolic) is full of math/physics grads and Group A (Visual) is humanities-heavy, Group B will finish in 5 minutes and dominate the Tribunal on "Efficiency."
  *   **Fix:** Pre-assign groups if you know the students. If not, rig the "Citation Chips" criteria. If Symbolic wins too fast, weight the voting heavily toward "Clarity to a Novice" (which often favors Visual).

  **2. Early Collusion / Peeking**
  *   **Risk:** Someone shouts "It's square numbers!" across the room during Round 1.
  *   **Fix:** Enforce the "Forbidden Vocabulary" strictly. If a Cartographer says "nine," make them erase it. The constraint is the game. If they break it, they disqualify themselves from the Tribunal.

  **3. The Translation is Too Easy**
  *   **Risk:** Converting "n²" to a drawing of a square is trivial.
  *   **Fix:** Make Step 10 genuinely hard to draw (it's huge). The Cartographers will struggle to draw 100 dots. The Archivists will struggle to visualize the geometry of the equation. The *pain* of the mismatch is the point. If it's too easy, emphasize the *time cost* in the scoring.

  **4. The Tribunal Becomes a Popularity Contest**
  *   **Risk:** Students vote for their friends.
  *   **Fix:** Make the voting anonymous (write names on slip of paper). Remind them their payoff (Citation Chips) depends on the *utility* of the framework for Round 2, not just liking the people.

  ### Instructor Notes for the Debrief
  *   **Don't save them:** If the Losing group fails Round 2, let them fail. That failure *is* the data point. It represents research programs that die out not because they were wrong, but because they were incompatible with the dominant notation.
  *   **Highlight the "Lock-In":** Point out that in Round 2, the Winners didn't even have to think hard. Their framework *automated* the thinking. That's the power of a dominant paradigm—it makes normal science easy, but revolutionary science hard.
  *   **The "Buffer" Reality:** You have 10 mins buffer in your timeline, but Round 2 often bleeds. If Round 1 runs over, cut Round 2 to a "Thought Experiment" (ask them to discuss how they would translate rather than doing it). Protect the 20-minute debrief at all costs; that's where the learning happens.

  ### Why This Works for Grad Students
  Grad students are often hyper-specialized. This forces them to feel the limitations of their own specialization. It moves the "Simultaneous Invention" debate from a historical trivia question ("Who was first?") to a structural question ("What doors did the winner's language open, and which ones did it slam shut?"). It makes the abstract concept of *formalism* physically annoying to deal with, which ensures they won't forget it.
