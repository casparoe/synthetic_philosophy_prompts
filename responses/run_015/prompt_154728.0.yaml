  ### Preliminary Scratchpad (Brainstorming & Pruning)

  *Initial Brainstorm:*
  - Origin claim: Idea started in Europe? (Enlightenment, etc.)
  - Content claim: Idea relies on Western metaphysics (individualism vs communitarianism)?
  - Custody claim: Only Western nations actually protect it? (Hypocrisy check).
  - Definition claim: What counts as "Western"? Checklist? Family resemblance?
  - Function claim: Is it a shield? "You can't criticize us."
  - Function claim 2: Is it a sword? "You aren't one of us."
  - The "Universal" counter: Means "applies to all" vs "accepted by all".
  - The "Imperialism" leap: Even if Western, why does that mean don't impose? (Genetic fallacy).
  - New Idea 1: Modernity masquerading as Western.
  - New Idea 2: The West as the tradition of self-critique (self-referential).
  - New Idea 3: "Western" as a geopolitical brand rather than cultural fact.
  - Pruning: Merge "Checklist" and "Cluster" into one entry on definition. Merge "Shield" and "Sword" into "Rhetorical Function". Need to ensure the "Does-it-do-the-work" column specifically addresses the exchange programme decision.

  *Ordering Strategy:*
  1.  Historical/Origin (The most common intuitive reading).
  2.  Metaphysical/Content (The philosophical depth claim).
  3.  Sociological/Custody (Who actually holds the value).
  4.  Definitional/Checklist (What counts as Western).
  5.  Definitional/Cluster (Fuzzy edges).
  6.  Normative/Relativist (The "Don't Impose" leap).
  7.  Geopolitical/Instrumental (Power dynamics).
  8.  Modernization/Accidental (Modernity vs. West).
  9.  Self-Referential/Critical (The "Arguing about itself" claim).
  10. Rhetorical/Boundary (The "Us vs Them" move).

  *Refining Verdicts:*
  - Origin: True but irrelevant (Genetic Fallacy).
  - Content: Debatable/False (Human rights found in many traditions).
  - Custody: False (Western nations violate rights too).
  - Relativist: Non-sequitur (Origin doesn't dictate validity).
  - Self-Referential: Interesting but doesn't solve the policy problem.

  *Final Polish:* Ensure the tone is pedantic enough to slow down the debate but clear enough to be useful.

