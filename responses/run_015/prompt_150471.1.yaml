      *(Refining Unfalsifiability)*: The risk is "structural description" becoming a bucket for "whatever features we found." To avoid this, the theory must specify *which* relations are primitive (e.g., containment, adjacency) vs. derived.

  8.  **Final Output Structure:**
      1.  Executive Summary.
      2.  Ranked Defeaters (Fatal -> Cosmetic).
      3.  The Cross-Script Challenge.
      4.  The Unfalsifiability Trap.
