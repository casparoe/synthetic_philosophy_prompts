answer: |-
  ### Part I: Brainstorming the Normative Architecture of Promising

  Before we dissect Dr. Voss's dilemma, we must map the terrain. In moral philosophy, the question "Why must I keep my promise?" is not trivial; it is the central problem of the ethics of agreement. There is no single consensus, but rather competing frameworks that locate the source of the obligation differently.

  1.  **The Expectation/Reliance View (Utilitarian/Harm-Based):**
      *   *Core Idea:* A promise creates an expectation in the promisee. Breaking it causes harm (disappointment, disrupted planning).
      *   *Source of Obligation:* The duty to prevent harm or not to manipulate another's expectations (e.g., J.S. Mill, T.M. Scanlon's Principle of Fidelity).
      *   *Implication:* If the promisee no longer expects the performance, or if breaking the promise benefits them more, the obligation weakens or vanishes.

  2.  **The Practice/Convention View (Institutional):**
      *   *Core Idea:* Promising is a social institution, like a game. To say "I promise" is to invoke a rule-bound practice that exists independently of individual cases.
      *   *Source of Obligation:* Fair play and the maintenance of the institution itself (e.g., John Rawls, John Searle).
      *   *Implication:* You cannot unilaterally decide the rules no longer apply. The obligation persists to maintain the integrity of the practice of promising, regardless of immediate consequences.

  3.  **The Normative Power/Will Theory (Authority-Based):**
      *   *Core Idea:* To promise is to transfer a slice of your normative autonomy to the promisee. You give them a "right" to your action.
      *   *Source of Obligation:* The authority of the promisee over the promisor (e.g., H.L.A. Hart, David Owens, Joseph Raz).
      *   *Implication:* Since the obligation exists *for the sake of* the promisee's authority, the promisee generally retains the power to waive that right. If they release you, the obligation dissolves.

  4.  **The Fidelity/Integrity View (Agent-Centered):**
      *   *Core Idea:* The obligation is primarily to oneself. Breaking a promise violates your own integrity as a moral agent who stands by their word.
      *   *Source of Obligation:* The duty to maintain coherence between one's past and present self (e.g., Charles Fried).
      *   *Implication:* Even if the promisee releases you, you might feel bound by your own commitment to being a "promise-keeper."

  ***

  ### Part II: The Case of Dr. Voss and Dr. Chen

  Dr. Voss's predicament is a classic conflict between the **Fidelity View** (her internal sense of integrity regarding her past word) and the **Will/Authority View** (Chen's current authority over the obligation).

  To analyze whether she is truly bound, we must look at the *normative structure* of the agreement, not merely its textual history.

  #### 1. The Nature of the Obligation: Who Owns the Right?
  Under the **Normative Power/Will Theory**, which is dominant in contemporary deontological ethics, a promise creates a right in the promisee (Chen) to demand performance from the promisor (Voss). Crucially, rights of this nature are generally "waivable."

  When Chen tells Voss, "I want you to publish alone," he is exercising his normative authority. He is effectively saying, "I am waiving my right to co-authorship." In most philosophical accounts, the promisee's power to release the promisor is inherent to the nature of the obligation. An obligation *owed to someone* cannot be forced upon them against their will without transforming the relationship from a moral commitment into a form of bondage.

  **The Philosophical Verdict:** If the obligation exists for Chen's benefit (to protect his credit and labor), and Chen explicitly renounces that benefit, the *ratio legis* (the reason for the obligation) has evaporated. Voss is not bound by the *content* of the promise (co-authorship) because the *holder* of the right has voided it.

  #### 2. The Trap of Formalism: The "Pause" Clause
  Voss's hesitation stems from a legalistic interpretation of the agreement: *We agreed on a specific release mechanism (mutual consent for a pause), and we did not use it.* She is treating a moral pledge like a rigid contract.

  However, in moral philosophy, specific procedural clauses usually manage *disagreement*, not *waiver*. The "pause" clause protects Voss if she wants to stop and Chen wants to continue (or vice versa). It does not necessarily strip Chen of his fundamental moral power to release her from the duty entirely.

  To argue that the "pause" clause excludes implicit release is to argue that Chen contractually signed away his right to forgive the debt. Unless they explicitly agreed, "Chen forfeits the right to ever release Voss from this pledge," the default moral position holds: **The person to whom the duty is owed holds the keys to the cage.** By demanding she publish alone, Chen has unlocked the cage. Voss's refusal to walk out because she didn't fill out the proper paperwork is a category error between legal contract and moral commitment.

  #### 3. The Expectation and Harm Analysis
  Let us apply the **Expectation/Reliance View**. Why was the promise made? To prevent Chen from being scooped or marginalized.
  *   **Past Expectation:** Chen expected protection.
  *   **Current Expectation:** Chen expects rapid dissemination of science without his name attached.

  If Voss insists on co-authorship, she is now violating Chen's *current* expectations. She is prioritizing the *ghost* of the past agreement over the *reality* of the current relationship. Furthermore, by delaying publication to hunt for a formal release that Chen has already morally granted, she is actively harming the field (the "greater good" mentioned in the prompt) and frustrating Chen's explicit wishes.

  Under Scanlon's **Principle of Fidelity**, we are obligated not to manipulate expectations we have invited. Voss invited Chen to expect co-authorship. But Chen has now explicitly revised those expectations. To cling to the old expectation is to disregard the actual person (Chen) in favor of the abstract rule (The Pledge).

  #### 4. The Integrity Counter-Argument (Why Voss Feels Bound)
  Why does Voss still feel bound? This is best explained by the **Fidelity/Integrity View**. For Voss, the promise is not just about Chen; it is about *her*.
  *   She made a vow.
  *   To break the vow feels like a fracture in her own moral identity.
  *   She fears that if she makes exceptions now, she undermines her own capacity to commit in the future.

  This is a respectable moral feeling, but in this specific context, it is misdirected. Integrity does not require rigid adherence to rules when the context of those rules has fundamentally shifted. True integrity involves recognizing that the *spirit* of the promise (mutual respect and protection) is better served by honoring Chen's current autonomy than by honoring his past signature.

  ### Part III: Conclusion — The Binding Nature of "Dead" Promises

  To answer your broader question for your feature: **What makes a promise binding when the promisee no longer desires the performance?**

  In the majority of normative frameworks, **it does not remain binding in the same way.**

  1.  **The Authority Condition:** A promise is a transfer of authority. If the authority holder (the promisee) revokes that authority, the obligation dissolves. A promise cannot bind a promisor to act *against* the will of the promisee, because the promise exists to serve the promisee's interests.
  2.  **The Implicit "Unless" Clause:** Philosophers often argue that all promises contain an implicit *ceteris paribus* condition: "I will do X, unless you tell me not to." Formal release mechanisms (like the "pause" clause) are practical safeguards for complex collaborations, but they do not usually override the fundamental moral power of waiver.
  3.  **The Shift from Contract to Care:** In close professional or personal relationships (like lab partners), the normative structure shifts from "contractual" to "relational." In a relational framework, maintaining the bond requires responsiveness to the other's current needs, not just adherence to past terms.

  **The Diagnosis of Dr. Voss:**
  Dr. Voss is suffering from **moral fetishism**. She is worshipping the *form* of the promise (the verbal agreement, the lack of formal release) rather than the *function* of the promise (protecting Chen's interests and facilitating trust).

  By refusing to publish without Chen's name, she is not being "honorable." She is effectively holding Chen hostage to a version of himself he no longer inhabits. She is prioritizing her own moral self-conception ("I am a person who keeps promises") over Chen's actual agency ("I am a person who releases you").

  **The Philosophical Bottom Line:**
  A promise binds us because we have given another person authority over our actions. When that person returns the authority, the binding force is broken. Voss is free to publish. In fact, by insisting on the old terms, she is committing a new wrong: violating the current autonomy of her former partner in the name of a dead obligation.
