answer: |-
  This is a profound structural problem for a narrative, because it touches on the friction between *truth as correspondence* (what happened) and *truth as fidelity* (what it means to us). The institutional protocol you describe is not merely bureaucratic; it is a metaphysical compromise. To reconstruct the implicit theory licensing this bifurcation, we must look beyond simple hypocrisy and examine the specific philosophical machinery required to keep these two tracks from colliding.

  Here is a reconstruction of the commitments, distinctions, and vulnerabilities of this bifurcated epistemic regime.

  ### 1. The Implicit Philosophical Commitments

  The practice does not necessarily rely on inconsistent theories of knowledge, though it risks appearing so. Instead, it relies on a **Functional Epistemic Contextualism** grounded in a **Dual-Theory of Justice**.

  **A. Epistemic Contextualism (The "Game" Analogy)**
  The institution presupposes that "authority" is not a monolithic property of a statement but a function of the domain in which the statement is uttered.
  *   **In the Public Sphere:** The goal is *Recognition* and *Cohesion*. Here, knowledge is treated as **Performative**. To say "this is what happened" is not to make a forensic claim but to enact a relationship of respect. The truth-value of the memory is secondary to its *validity* as a constituent of community identity.
  *   **In the Juridical Sphere:** The goal is *Allocation* and *Liability*. Here, knowledge is treated as **Constative**. It must map onto physical reality to move property or assign guilt.
  *   **The Commitment:** This presupposes that there is no single "God's eye view" of history that institutions are obligated to serve. Instead, there are distinct language games. Memory wins in the game of *Meaning*; Evidence wins in the game of *Resources*.

  **B. The Dual-Theory of Justice**
  The bifurcation rests on the separation of **Restorative Justice** from **Distributive Justice**.
  *   **Restorative (Public Track):** Requires validating the victim's experience to restore dignity. If the state demands forensic proof of trauma before acknowledging it in a museum, it re-enacts the violence of skepticism. Therefore, memory is sovereign here as a form of *epistemic reparation*.
  *   **Distributive (Legal Track):** Requires neutral rules to distribute scarce resources (land, money). If memory were sovereign here, resource allocation would become unmoored from verifiable claims, potentially creating new injustices (e.g., conflicting memory-claims between two groups). Therefore, documents are sovereign here to maintain *procedural fairness*.

  **C. The Separation of "Fact" and "Truth"**
  The institution implicitly endorses a distinction between *Fact* (archival, forensic, verifiable) and *Truth* (narrative, experiential, constitutive). It operates on the commitment that a narrative can be "True" (in the sense of revealing the moral reality of a people) without being "Factual" (in the sense of matching the archival record), and vice versa.

  ### 2. Strict Requirements vs. Accompaniments

  To understand where your narrative tension lies, we must distinguish what is essential to this regime from what is merely incidental.

  **Strict Requirements (What the theory *needs*):**
  1.  **Domain Insulation:** The institution must successfully prevent the norms of the legal track from colonizing the public track, and vice versa. If visitors begin to treat museum plaques as legal evidence, or judges begin to treat oral testimony as binding property law, the system collapses.
  2.  **Non-Assertion of Ontological Superiority:** The institution cannot claim that memory is *factually* more accurate than documents in the public sphere. It can only claim memory is *normatively* prior. If it claims memory is forensically superior, it undermines the legal track's reliance on documents.
  3.  **The "As If" Stance:** Public participants must engage with the memory-track "as if" it were authoritative, without requiring it to sustain legal scrutiny.

  **Accompaniments (What often happens but isn't required):**
  1.  **Belief in Memory's Factuality:** The institution does *not* need to believe the community's memory is factually correct to prioritize it publicly. It only needs to believe that *treating it as correct* is morally necessary. Many administrators likely believe the documents are factually right but hide this belief to preserve social peace.
  2.  **Belief in Document Infallibility:** The legal track does not require documents to be perfect, only *actionable*. The system works even if everyone knows the documents are biased, provided they are the agreed-upon standard for adjudication.
  3.  **Permanent Bifurcation:** The theory does not require the split to last forever. It could be a transitional protocol until trust is restored.

  ### 3. Philosophical Underdetermination

  The same institutional split can be licensed by rival philosophical accounts. This is where your novel can introduce ambiguity or conflict among characters who support the same system for different reasons.

  **Rival Account 1: Strong Epistemic Pluralism**
  *   *Theory:* Memory and Archive are fundamentally different *kinds* of knowledge, like poetry and physics. Neither can judge the other.
  *   *Implication:* The split is natural and permanent. There is no conflict because they are answering different questions.
  *   *Narrative Tension:* Characters believe the two tracks will never meet.

  **Rival Account 2: Prioritarian Moralism**
  *   *Theory:* Documentary evidence is epistemically superior, *but* moral justice requires suppressing that superiority in public to correct historical silencing.
  *   *Implication:* The split is a "noble lie" or a necessary sacrifice of truth for justice. It creates internal guilt for the archivists.
  *   *Narrative Tension:* Characters feel they are betraying the truth to save the peace.

  **Rival Account 3: Strategic Modus Vivendi**
  *   *Theory:* There is no deep philosophy. This is a pragmatic truce to prevent violence.
  *   *Implication:* The split is fragile and purely political. If power shifts, the protocol vanishes.
  *   *Narrative Tension:* Characters know the system is a sham holding back a war.

  **The Underdetermined Point:**
  The crucial ambiguity lies in **Ontological Commitment**. Does the institution believe the community's memory *actually happened* but lacks paperwork? Or does it believe the memory *didn't happen literally* but *happened emotionally*? The protocol works either way, but the characters' internal lives differ radically depending on which they believe.

  ### 4. What Would Change My Mind

  I currently argue that this bifurcated regime is philosophically coherent (if precarious) because it assigns different normative goods to different domains. I would abandon this view if convinced of the **Unity of Epistemic Agency**.

  **The Argument for Unity:**
  An institution is a single moral agent. If a single agent asserts $P$ (Memory is authoritative) in Context A, and asserts $\neg P$ (Memory is not authoritative) in Context B, it suffers from **doxastic fragmentation**.
  *   If the museum tells a citizen, "Your ancestors suffered this specific harm," and the court tells the same citizen, "We cannot prove that harm occurred," the institution is not merely switching contexts; it is gaslighting the citizen.
  *   Trust is a unified resource. If the public realizes the "truth" in the museum is legally inadmissible, the museum loses authority. If the court realizes the "facts" it relies on are publicly denounced as oppressive, the court loses legitimacy.
  *   **The Tipping Point:** If it can be demonstrated that *public narrative inevitably dictates legal outcomes* (e.g., public pressure forces judges to ignore evidence), then the bifurcation is illusory. The two tracks are not separate domains; they are a single ecosystem. If the "Public" track infects the "Legal" track, the system is not a stable pluralism but a slow-motion collapse into incoherence.

  If you can demonstrate in your narrative that the "wall" between the tracks is porous—that the moral weight of the public memory *forces* legal corruption, or the coldness of the legal evidence *destroys* public trust—then the philosophical justification for the split fails. It becomes not a sophisticated balance, but a structural hypocrisy.

  ### 5. The Weakest Point in This Reasoning

  The most vulnerable part of my analysis is the assumption of **Institutional Compartmentalization**.

  I have reasoned as if the "Public Sphere" and the "Legal Sphere" are distinct rooms where different rules apply. In reality, they are porous membranes. Curators talk to lawyers; journalists report on court cases in exhibitions; students learn in schools what they later litigate.
  *   **Why it fails:** Human beings crave cognitive consistency. It is psychologically unsustainable for the *same individuals* working within the institution to maintain two contradictory epistemic stances without significant cognitive dissonance or cynicism.
  *   **The Failure Mode:** The system relies on the staff believing in the split. If the archivists begin to feel that by validating false memories they are betraying their profession, or if the community leaders feel that by accepting legal dismissal they are betraying their ancestors, the "functionalist" justification crumbles. The system requires a level of **institutional schizophrenia** that may be beyond human capacity to maintain long-term.

  **For your novel:** The drama lies not in the conflict between the community and the state, but within the bureaucrats who must maintain this split. The tragedy is that the system is designed to be just, but it requires its agents to live a lie. The "bifurcation" is stable on paper but unstable in the human heart.
