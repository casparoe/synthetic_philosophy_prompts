answer: |-
  This is a sharp, provocative set of claims that will definitely generate discussion. Your intuition is correct: there is friction between (2) and (3), but there is a more fundamental logical tension between (1) and the rest of the set that threatens to undermine the whole position before you get to the diachronic nuances.

  Here is the pairwise analysis, ranked by severity, with repairs and a recommendation for the single most effective revision.

  ### 1. The Locus of Defect: (1) vs. (2) and (5)
  **Severity: Critical (Logical Contradiction)**

  *   **The Tension:** Claim (1) establishes the *exploitability argument* as your ground for normativity, and explicitly states that if an agent can be pumped, "there is something wrong with her **preferences**." Claim (2) explicitly denies this conclusion for cyclic preferences ("What is wrong... is a defect in her **choice procedure**, not in what she prefers"). Claim (5) reinforces (2) by arguing that even in an extreme exploitability case (autopilot), the **preferences** are not defective.
  *   **Why it matters:** You cannot ground your normative authority in (1) if (2) and (5) reject the specific normative conclusion (1) draws from that ground. (1) says $Exploitability \rightarrow Bad Preferences$. (2) and (5) say $Exploitability \rightarrow Bad Procedure/Mechanism, Good Preferences$.
  *   **What has to give:** You must decouple exploitability from *preference* defectiveness in (1).
  *   **Cheapest Repair:** Revise (1) to target the **decision architecture** or **agency** rather than preferences.
      *   *Change:* "...then there is something wrong with her **decision-making system**."
      *   *Effect:* This aligns (1) with (2) and (5) immediately. It allows you to say the *system* is exploitable without condemning the underlying valuation state.

  ### 2. The Foresight Asymmetry: (2) vs. (3)
  **Severity: High (Philosophical Inconsistency)**

  *   **The Tension:** This is the tension you sensed. In (2), you argue that **foresight rescues the agent** from irrationality charges regarding cyclic preferences (the sophisticated agent declines the first trade and is rational). In (3), you argue that **foresight does not rescue the agent** from irrationality charges regarding present bias (the sophisticated agent is still criticizable).
  *   **Why it matters:** Both cases involve diachronic inconsistency. In (2), the agent has stable but cyclic preferences; in (3), the agent has time-inconsistent preferences. If rationality is about avoiding dominated outcomes, foresight solves both (the sophisticated present-biased agent avoids the worst outcomes via strategic restraint). If rationality is about self-government, why does foresight constitute successful self-government in (2) but failed self-government in (3)?
  *   **What has to give:** You need a principled distinction between *structural* inconsistency (cycles) and *temporal* inconsistency (present bias) regarding the power of foresight.
  *   **Cheapest Repair:** Clarify that in (2), foresight allows the agent to **satisfy** her preferences (by stopping), whereas in (3), foresight only allows the agent to **manage** a defect she cannot eliminate.
      *   *Add to (3):* "...because unlike the cyclic case, sophistication here does not restore diachronic consistency; it merely mitigates the damage of a known failure of will."
      *   *Effect:* This admits that (3) is a "second-best" rationality, whereas (2) allows for "first-best" rationality via foresight.

  ### 3. The Definition of Change: (3) vs. (4)
  **Severity: Medium (Ambiguity)**

  *   **The Tension:** (3) condemns present bias (a form of preference change over time) as irrational. (4) exonerates preference change over time as rational. A skeptic will ask: How do you distinguish the "convert" in (4) from the "present-biased agent" in (3) without begging the question?
  *   **Why it matters:** If you cannot distinguish genuine value shift from akratic reversal, (3) and (4) collapse into each other.
  *   **What has to give:** You need a criterion for "genuine" vs. "defective" change.
  *   **Cheapest Repair:** Anchor (4) in **information** or **higher-order endorsement**.
      *   *Add to (4):* "...provided the change reflects new information or reflective endorsement, rather than a failure of executive control."
      *   *Effect:* This distinguishes the olive-eater (new experience/info) from the procrastinator (executive failure).

  ### 4. Minor Tensions
  *   **(1) vs. (4):** Low tension. (1) is about coherence at a time (or across offers); (4) is about change across time. Compatible.
  *   **(4) vs. (5):** Low tension. One is about internal change, one about external mechanism.

  ---

  ### Ranking by Severity
  1.  **(1) vs. (2)/(5):** Logical contradiction regarding the *locus* of the normative defect.
  2.  **(2) vs. (3):** Theoretical inconsistency regarding the *power of foresight*.
  3.  **(3) vs. (4):** Definitional ambiguity regarding *preference change*.

  ### The Single Revision That Cleans Up the Most

  **Revise Claim (1).**

  Your current (1) commits you to **Preference-Based Normativity** (exploitability proves preferences are bad). Your claims (2), (3), and (5) all implicitly rely on **Procedure-Based Normativity** (exploitability proves the *management* of preferences is bad).

  If you change (1) to say:
  > "(1) The argument I actually trust... is the exploitability argument: if there is a sequence of offers... that leaves her strictly poorer... then there is something wrong with her **rational agency**."

  **Why this works:**
  1.  **Resolves (1) vs. (2):** You can now say the *agency* (myopia) was defective in the pump, not the preferences.
  2.  **Resolves (1) vs. (5):** You can say the *agency* was bypassed by the mechanism, so the agent isn't blameworthy, but the outcome is still a failure of the system.
  3.  **Helps (2) vs. (3):** It frames the debate as one about *agency*. In (2), foresight restores full agency. In (3), foresight reveals broken agency. This makes the asymmetry easier to defend without contradicting (1).

  ### Summary Advice for the Reading Group
  Your position is a version of **"Procedural Rationality"** (associated with authors like McClennen or Bratman) rather than **"State Rationality"** (standard Bayesianism).

  *   **The Trap:** If you keep (1) as written, standard decision theorists will crush you on the contradiction with (2). They will say, "You admit money pumps are bad, but deny they indict preferences? Then what do they indict?"
  *   **The Fix:** Own the procedural turn. Explicitly state in your intro that you are shifting the locus of rationality from *states* (preferences) to *policies* (choice procedures). Once you do that, (2) and (3) become consistent claims about which policies succeed or fail, and (5) becomes a clear case of external interference rather than internal irrationality.

  **Final Verdict:** Change (1) to target **agency/procedure**, not preferences. Then, add one sentence to (3) acknowledging that sophistication mitigates but does not cure the defect, distinguishing it from the "cure" available in (2).
