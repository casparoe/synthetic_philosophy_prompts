          *   If they certified the Shortcut Belief: They get high Round 1-3 points, but a "Truth Penalty" in debrief.
          *   If they certified the Complex Belief: They have lower Round 1-3 points, but "Truth Bonus."
          *   *Actually, let's make the scoring hidden.*
          *   No, the prompt says "payoff scheme that doesn't need real money." Let's use "Course Credit Points" or just "Prestige/Tokens."
          *   Let's make the divergence explicit in the *experience*.
          *   **Activity:** "The Map and the Territory."
          *   **Materials:** Envelopes with clues.
          *   **Scenario:** You are explorers. You need a map to get food.
          *   **Round 1-3:** You need food *now*. (Utility).
          *   **Round 4:** You need to know where the *continent* actually is. (Reality).
          *   **The Divergence:** A map that leads to food now (an illusion/oasis) vs. a map that leads to the continent (hard trek).
          *   **Implementation:**
              *   Students are given a "Belief Card."
              *   They can trade it in for "Immediate Rewards" (candy/points) OR hold it for "Final Verification."
              *   Some Belief Cards are "Expedient" (High immediate reward, worthless at end).
              *   Some Belief Cards are "Accurate" (Low immediate reward, high value at end).
              *   Students don't know which card type they have initially. They have to infer from the "market."
              *   *Wait, this is getting gamified away from the philosophy.*
              *   Let's go back to the core: **Justification vs. Truth.**
              *   The friend's claim: James = Justification. Peirce = Truth.
              *   The activity needs to show that "Working" (Justification) and "Converging" (Truth) can come apart.

      *   **Final Plan:** **"The Two Ledgers."**
          *   **Concept:** Students act as scientists testing a hypothesis.
          *   **Materials:** A deck of cards representing "Evidence."
          *   **Procedure:**
              1.  Students form a hypothesis about a hidden rule.
              2.  They test it against evidence.
              3.  **Ledger A (The Pragmatic Ledger):** You get points every time your hypothesis successfully predicts the next card *in the short run*.
              4.  **Ledger B ( The Realist Ledger):** You only get points if your hypothesis matches the *actual generating rule* revealed at the end.
              5.  **The Twist:** The evidence stream is rigged. There is a "Local Pattern" (works for first 10 cards) and a "Global Rule" (governs all 20 cards).
              6.  Students must decide when to "Lock In" their belief.
              7.  If they Lock In during the Local Pattern, they maximize Ledger A but fail Ledger B.
