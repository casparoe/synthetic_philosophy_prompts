          *   **Debrief:** Map Ledger A to James (Truth = Successful Guidance *now*), Ledger B to Peirce (Truth = Final Consensus/Reality).
          *   **Why this works:** It forces the student to feel the tension between "This is working, so I should believe it" vs "This might stop working, so I shouldn't call it True yet."

  4.  **Drafting the Details:**
      *   **Timeline:** 80 mins.
          *   Intro (5)
          *   Game Rounds 1-3 (30)
          *   The "Lock In" Decision (10)
          *   The Reveal (10)
          *   Debrief (25)
      *   **Materials:** Projector/Screen for evidence stream. Handouts for "Lock In."
      *   **Payoff:** "Research Grants" (points towards participation grade).
      *   **The Rig:**
