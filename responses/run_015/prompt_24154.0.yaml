          *   Students propose triples.
          *   **James Group:** Told "Your goal is to maximize correct predictions." (They will find a narrow rule like "ascending even numbers" that works for a bit).
          *   **Peirce Group:** Told "Your goal is to find the *actual* rule the computer is using."
          *   *Correction:* The prompt wants *one* activity where the distinction emerges, not two groups doing different things. The distinction should emerge from the *scoring*.
          *   Okay, everyone plays. Everyone tries to find the rule.
          *   **Phase 1:** "Funding Round." You get funding for every correct prediction. (Incentivizes quick, narrow heuristics that "work").
          *   **Phase 2:** "Tenure." You only get tenure if your stated rule matches the *actual* rule at the end.
