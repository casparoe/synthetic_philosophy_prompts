          *   Round 1-3: Feedback is based on "Utility" (did it help you get points?).
          *   Round 4-5: Feedback is based on "Accuracy" (did it match the hidden key?).
          *   Actually, the prompt wants the *divergence* felt.
          *   Let's try this: **"The Expedient vs. The Enduring."**
