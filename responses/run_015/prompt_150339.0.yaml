      *   **Part (c) [10 marks]:** Verdict is wrong (standard reading). Reasoning conflates the CI test with the motive of duty. The introspection argument is creative but misreads Kant's use of the opacity thesis (which limits *knowledge* of worth, not the *conditions* of worth). However, it shows independent thought. Let's say 3/10.
