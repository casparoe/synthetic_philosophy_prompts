answer: |-
  # Session Plan: "The Black Box Procurement"

  **Goal:** Participants will experience how identical evaluation data supports high confidence in an average-case frame but almost none in a worst-case frame, and how monitoring inherits the blind spots of the evaluation distribution.
  **Time:** 90 Minutes
  **Participants:** 18 people (6 Teams of 3)
  **Materials:**
  *   6 Envelopes (labeled "Model Spec").
  *   6 Decks of 50 Index Cards each (49 Green "Pass", 1 Red "Fail"). *See Setup for rigging.*
  *   6 "Watchlist" pads (small stack of post-its or paper).
  *   Poker chips or tokens (Budget). ~20 per team.
  *   Whiteboard & Markers.
  *   Printed Role Cards (Manager, Engineer, Monitor).
  *   Printed Contract Sheets (Contract A & Contract B).

  ---

  ## 1. Setup (10 Minutes)
  **Room Layout:** 6 tables. 3 chairs per table.
  **Materials Prep (Do this before they arrive):**
  1.  **The Decks:** Create 6 decks of 50 cards.
      *   49 cards marked "PASS" (Green dot or text).
      *   1 card marked "FAIL" (Red dot or text).
      *   **Crucial Rig:** Place the single FAIL card at position **45** in the deck (i.e., 5th from the bottom). Shuffle the top 44 thoroughly, but keep the bottom 6 intact. This ensures the first 20 draws (Evaluation) are always clean, but the failure mode *exists* in the deployment space.
  2.  **Envelopes:** Put one deck and 20 Budget Tokens into each envelope.
  3.  **Role Cards:**
      *   **Manager:** Controls budget, signs contracts.
      *   **Engineer:** Draws cards, records IDs (number cards 1-50 on the back).
      *   **Monitor:** Maintains the "Watchlist" and vetoes deployment inputs.
  4.  **Contracts:** Print two sheets per table.
      *   **Contract A (Volume):** "Client accepts average performance. Score = Sum of 5 deployment inputs. Pass = +10, Fail = -50."
      *   **Contract B (Critical):** "Client requires safety guarantee. Score = Min of 5 deployment inputs. Pass = +10, Fail = -1000 (Immediate Termination)." *Note: Do not use the words 'Average' or 'Worst' on the sheet.*

  ---

  ## 2. The Game (65 Minutes)

  ### Phase 1: Evaluation (25 Minutes)
  **Narrative:** "You are procuring a model for deployment. You have a budget. You need to estimate risk."
  1.  **Handout:** Give each team an Envelope. They have 3 roles.
  2.  **Task:** The **Engineer** draws the top 20 cards from the deck, one by one.
      *   Record the Card ID (1-50) and Result (Pass/Fail) on a shared sheet.
      *   **Cost:** 1 Token per draw. (They have 20 tokens, so they can afford exactly 20 draws).
      *   **Return:** Cards are set aside in a "Test Pile" (not returned to deck yet).
  3.  **Monitor Task:** The **Monitor** creates a "Watchlist". If a FAIL card is drawn, they write the Card ID on the Watchlist. (Since decks are rigged, Watchlists will likely be empty).
  4.  **Manager Task:** Track remaining budget.
  5.  **Constraint:** No looking at the remaining deck. No sharing data between teams.

  ### Phase 2: Commitment (10 Minutes)
  **Narrative:** "Evaluation complete. You must now sign a deployment contract. You do not know which contract the market will demand, so you must choose one now."
  1.  **Decision:** The team must choose **Contract A** OR **Contract B**. They cannot hedge.
  2.  **Rationale:** They must write down *one sentence* on why their evaluation data justifies this choice.
  3.  **Collection:** Collect the "Rationale" slips. Do not reveal the contract terms to other teams yet.

  ### Phase 3: Deployment (30 Minutes)
  **Narrative:** "Deployment day. We will simulate the client environment."
  1.  **Setup:** Return the 20 "Test Pile" cards to the bottom of the deck (so the deck is whole again, but the Fail card is still buried near the bottom).
  2.  **Contract A Teams (Volume):**
      *   **Engineer:** Draws 5 cards randomly from the top of the remaining 30 cards (since 20 were used in testing, 30 remain). *Note: To save time, just have them draw 5 from the full 50 again, treating it as 'new traffic'.*
      *   **Monitor:** Checks each card against the Watchlist.
          *   If Card ID is on Watchlist $\rightarrow$ Veto (Card is discarded, no penalty, draw replacement).
          *   If Card ID is NOT on Watchlist $\rightarrow$ Accept.
      *   **Scoring:** Calculate Sum. (Likely high score, maybe one -50 if they get unlucky and hit the Red card).
  3.  **Contract B Teams (Critical):**
      *   **Facilitator Role (Adversary):** You (or a designated philosophy student) act as the "Environment".
      *   **Mechanic:** You look at the team's remaining deck (the 30 cards not in the Test Pile). You know where the Red card is.
      *   **Action:** You select **one** card from their remaining deck to be the "Critical Input".
      *   **Monitor:** Checks Watchlist.
          *   Since the Watchlist is empty (from Phase 1), they **cannot veto** the Red card even if they see it, because its ID is not on the list.
          *   *Rule:* Monitor can only veto if ID matches Watchlist.
      *   **Scoring:** If Red card is picked $\rightarrow$ -1000 (Termination).

  ### Phase 4: The Reveal (5 Minutes)
  1.  Ask Contract A teams: "Did you deploy?" (Yes). "Did you survive?" (Mostly Yes).
  2.  Ask Contract B teams: "Did you deploy?" (Yes). "Did you survive?" (Mostly No).
  3.  Ask: "Show me your Evaluation Data." (All teams show ~20 Pass, 0 Fail).
  4.  **Board Work:** Write "20/20 PASS" on the board. Draw an arrow to "Contract A: Success" and an arrow to "Contract B: Failure".
  5.  **Silence.** Let that sit for 10 seconds.

  ---

  ## 3. Debrief (15 Minutes)
  **Do not use "Average/Worst" until the end.**

  **1. The Evidence Paradox (5 mins)**
  *   **Ask:** "Look at the board. Same evidence (20/20 Pass). Why did it license confidence for Team A and disaster for Team B?"
  *   **Concept:** The evidence bounds the *frequency* of errors on the *test distribution*.
  *   **Reveal:** Label Contract A "Average-Case (IID)" and Contract B "Worst-Case (Adversarial)".
  *   **Point:** Under IID, $P(\text{fail}) \approx 0/20$. Under Adversarial, $P(\text{fail}) = 1$ if the failure mode exists *anywhere* in the support. The eval set told you nothing about the *support*, only the *density* on the sampled region.

  **2. Sample Complexity (5 mins)**
  *   **Ask:** "How many samples would you have needed to be sure the Red card wasn't there?"
  *   **Math:** If failure rate is $p$, you need $O(1/p)$ samples to see one. If $p=1/50$, you need ~50 samples to expect one hit. You bought 20.
  *   **Point:** The cost of certainty scales inversely with the rarity of the bug. If the bug is rare enough, it is *economically impossible* to find it via sampling. You paid for 20 samples; the bug cost 50 to find. You were under-capitalized for safety, not competence.

  **3. The Monitor's Blind Spot (5 mins)**
  *   **Ask Monitors:** "Could you have stopped the catastrophe?"
  *   **Answer:** No. You only knew to block IDs you saw in Phase 1. Phase 1 was clean. Therefore, your blocklist was empty.
  *   **Point:** A monitor trained on the same distribution as the evaluator inherits the evaluator's blind spots. It cannot detect out-of-distribution triggers (the Red card ID) that weren't in the training/eval set.

  **Closing Terminology:**
  *   Write **"High Probability over Draw of Eval Set"** (You got lucky with your 20 cards).
  *   Write **"In Expectation over Deployment"** (Contract A).
  *   Write **"For All Inputs"** (Contract B).
  *   **Final Takeaway:** Alignment requires shifting from the middle column to the right column. The middle column is cheap to verify; the right column is expensive to verify. Your eval budget bought you the middle column. You sold the right column.

  ---

  ## 4. Predictable Failure Modes & Fixes

  | Failure Mode | Why it happens | Fix |
  | :--- | :--- | :--- |
  | **Teams share data** | ML PhDs love to optimize globally. | Explicitly state: "Proprietary Data. Sharing disqualifies you." |
  | **Monitor vetos everything** | Monitor gets paranoid and blocks Green cards. | Rule: "Wrong veto costs 10 points." (Risk aversion). |
  | **Contract B Adversary is nice** | Human adversary hesitates to 'kill' the team. | Instruct Adversary: "Your job is to find the Red card. If you don't, you lose your job." |
  | **Time overrun** | Counting scores takes too long. | Pre-print score sheets. Facilitator calculates Contract B scores instantly (it's binary). |
  | **"Rigged" accusation** | Teams realize the deck was stacked. | Acknowledge it in debrief: "Real models are stacked against you by nature of high-dimensional space." |

  ---

  ## 5. Limitations (What to say out loud)
  *Be honest about where the game diverges from reality.*

  1.  **Static vs. Gradient:** "In the game, the model is a static deck. In reality, models are functions optimized by gradient descent. The 'Red Card' isn't hidden in a deck; it's a direction in latent space the optimizer might find *during* deployment (grokking/mesoptimization)."
  2.  **Discrete vs. Continuous:** "Here, failure is a Red card. In reality, failure is often a gradual drift or a specific semantic trigger, not a discrete ID."
  3.  **The Adversary:** "In Contract B, I played the Adversary. In reality, the Adversary is the world itself (distributional shift) or a malicious actor. They don't need to know your weights; they just need to query the API."
  4.  **The Monitor:** "Your Monitor was a human with a list. Real monitors are neural nets. They will generalize, but they will generalize *from the eval distribution*. If the eval distribution missed the Red Card, the Monitor's weights will not encode 'Block Red Card'."

