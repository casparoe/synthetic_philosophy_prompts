  ## 7. Facilitator Script (Key Moments)
  *   **Start:** "No questions about the rules during Phase 1. Just spend your budget."
  *   **Phase 2:** "Commit now. You cannot change your mind after you see the deployment cards."
  *   **Phase 3 (Contract B):** "I am now the Environment. I see your remaining deck. I will pick the input that maximizes your loss."
  *   **Debrief:** "You didn't fail because you were bad at testing. You failed because testing *cannot do what you asked it to do*."
