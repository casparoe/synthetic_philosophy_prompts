answer: |-
  Demand each brick explain what use we find.
  The factory is now a living hall,
  It is the space the arches leave behind.

  The vents were cast to clear the heat from all.
  Demand each brick explain what use we find.
  Now air flows through the renovated wall.

  But see the gap where light and shadow fall.
  It is the space the arches leave behind.
  No builder planned it; it answered no call.

  Yet now the conduit runs along the stall.
  Demand each brick explain what use we find.
  It carries wire; it serves the tenants all.

  It was not built to carry load or call.
  It is the space the arches leave behind.
  It happened when the structure met the wall.

  So ask what holds, and ask what came to fall.
  Demand each brick explain what use we find.
  It bears the load though not designed for all.
  It is the space the arches leave behind.

  ### Notes on the choices

  The villanelle's circular form mirrors the reading group's stalemate, forcing the two refrains to alternate until the final quatrain. Refrain A1 (*Demand each brick…*) embodies the adaptationist method: it insists on current utility, treating every feature as an optimized solution. Refrain A2 (*It is the space…*) voices the structuralist critique: it describes geometric necessity, denying original intent without denying existence.

  The building—a factory converted to flats—classifies the traits. The vents (stanza 2) represent co-option: built for heat, now used for air; they answer A1 but have a history. The gap (stanza 3) is the byproduct: a geometric necessity of the vaults, originally useless, answering only A2. Stanza 4 introduces the critical fourth case: the byproduct exapted. The gap now houses conduits; it *is* functional (satisfying A1) but was not *designed* for this (satisfying A2).

  The closing quatrain resolves the methodological conflict. "Ask what holds" addresses current adaptive value; "ask what came to fall" addresses evolutionary origin. The final lines affirm that a trait can be indispensable now (bearing load) while remaining a historical leftover (not designed for all). This avoids Panglossianism: not everything was designed, but everything may eventually matter. The poem argues that the adaptationist question is valid only when distinct from the historical explanation.
