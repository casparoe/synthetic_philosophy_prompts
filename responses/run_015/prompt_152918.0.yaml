answer: |-
  ### The Epistemic Architecture of Intimate Contractualism: A Reconstruction

  To reconstruct the coherence of the position regarding marriage and sexual ethics attributed to this strand of early twentieth-century liberal thought, we must move beyond the standard interpretation of it as a straightforward application of hedonistic utilitarianism. While the maximization of happiness and the minimization of jealousy are often cited as the driving forces, a purely consequentialist framework fails to account for the specific structural distinctions drawn between the legal institution of marriage and the private reality of sexual intimacy. A more rigorous conceptual reconstruction reveals that the argument relies on a specific epistemological claim: that the knowledge conditions governing the public institution of marriage are fundamentally distinct from those governing private affective life. This claim, which we may term **epistemic partitioning**, generates a tension between the advocacy for liberalized divorce and the permissiveness toward extramarital relations. Resolving this tension requires supplying an unstated normative premise: **contractualist fallibilism**. When this premise is made explicit, the architectural integrity of the position shifts, bolstering the case for institutional reform while undermining the defense of non-contractual sexual liberty.

  #### I. Epistemic Partitioning and the Separation of Spheres

  The core of the reconstruction rests on the assertion that sexual ethics involves two distinct domains of knowledge, each with its own criteria for truth and validity.

  1.  **The Institutional Episteme:** This domain concerns the public, legal, and reproductive functions of pairing. The knowledge relevant here is objective, verifiable, and forward-looking regarding social stability. It encompasses questions of parentage, economic dependency, and the duration of commitment required for child-rearing. In this sphere, the partners are viewed as **institutional contractors**. Their knowledge is limited to their capacity to fulfill specific, observable duties.
  2.  **The Affective Episteme:** This domain concerns the private, psychological, and erotic functions of pairing. The knowledge relevant here is subjective, immediate, and internal. It encompasses desire, emotional resonance, and psychological growth. In this sphere, the partners are viewed as **private moral agents**. Their knowledge is authoritative only to themselves and is inherently fluid.

  The argument for separating reproductive responsibility from sexual intimacy is not merely a claim that they *can* be separated, but that they *must* be governed by different epistemic standards. The Institutional Episteme requires stability and predictability; the Affective Episteme requires honesty and fluidity. The liberalization of marriage law is justified on the grounds that the state should only regulate the Institutional Episteme. As long as reproductive duties are secured, the state lacks the epistemic access to judge the Affective Episteme.

  However, this partition creates a structural vulnerability. If the Affective Episteme is truly private and fluid, and the Institutional Episteme is rigid and public, how do we account for the transition between them? Specifically, when the Affective Episteme changes (desire fades or shifts), how does that information legitimately alter the Institutional Episteme (the marriage contract)?

  #### II. The Tension: Divorce vs. Adultery

  This epistemic partition generates a contradiction in the treatment of marital dissolution versus marital fidelity.

  On one hand, the argument for **liberalizing divorce** presupposes that changes in the Affective Episteme are legitimate grounds for altering the Institutional Episteme. If the private moral agents no longer experience the intimacy that justified the union, the institutional contractors must be allowed to dissolve the bond. This treats the marriage contract as sensitive to the internal states of the agents.

  On the other hand, the argument for **destigmatizing adultery** presupposes that changes in the Affective Episteme can be accommodated *without* altering the Institutional Episteme. It suggests that a partner can satisfy new affective needs externally while maintaining the institutional contract internally. This treats the marriage contract as insensitive to the exclusivity of internal states, provided public duties are met.

  The tension lies here: If the Affective Episteme is significant enough to justify divorce (as the pro-reform argument claims), then violating its exclusivity through adultery should theoretically trigger an institutional revision. If, however, the Affective Episteme is irrelevant to the Institutional Episteme (as the pro-adultery argument implies), then divorce becomes difficult to justify on the grounds of lost love alone. The position attempts to have it both ways: it wants the contract to be breakable when love dies (divorce), but also want the contract to be durable even when love is shared elsewhere (adultery). Without a mediating principle, this looks like inconsistent special pleading for sexual liberty.

  #### III. The Missing Premise: Contractualist Fallibilism

  To resolve this tension, we must introduce a normative premise that governs the relationship between the two epistemic domains. This premise is not utilitarian. A utilitarian calculus would simply weigh the pain of jealousy against the pleasure of variety. Instead, the reconstruction requires a principle of **contractualist fallibilism**.

  **Contractualist Fallibilism** asserts that intimate contracts are entered into by agents who acknowledge their own epistemic limitations regarding their future selves. When two agents marry, they are not promising that their desires will remain static; they are promising that they will manage the uncertainty of their future desires through a specific protocol of honesty and revision.

  Under this view, the marriage contract is not a promise of eternal fidelity in feeling, but a promise of **procedural integrity** in the face of changing feelings. The agents acknowledge: "We do not know who we will be in ten years. Therefore, we agree to bind ourselves, but we also agree on the conditions under which we may admit that the bond no longer reflects our moral reality."

  This premise distinguishes the view from simple utilitarianism. Utilitarianism asks, "Does this action produce the most good?" Contractualist Fallibilism asks, "Does this action respect the conditions of agreement under uncertainty?" It shifts the moral weight from the *consequences* of the sexual act to the *epistemic honesty* of the contractual relationship.

  #### IV. Strengthening the Case for Divorce Reform

  Accepting contractualist fallibilism significantly strengthens the argument for liberalizing divorce law.

  Under a rigid contractual view, divorce is a breach of promise. Under a utilitarian view, divorce is permissible only if the net suffering of staying married outweighs the net happiness of leaving. Both views face difficulties: the first ignores human change, and the second requires impossible calculations of aggregate welfare.

  However, under contractualist fallibilism, divorce is reconstructed as the **institutional mechanism for epistemic update**. Since the agents admitted at the outset that their knowledge of their future affective states was fallible, the institution must provide a legitimate pathway to acknowledge that error. Liberalizing divorce is not about making it "easier to leave"; it is about aligning the legal institution with the epistemic reality of the agents.

  If the law makes divorce difficult, it forces agents to maintain an institutional fiction that contradicts their private moral reality. This creates a dissonance between the Institutional Episteme (you are married) and the Affective Episteme (the marriage is dead). By facilitating divorce, the law preserves the integrity of the contract. It ensures that the institutional status corresponds to the actual moral agreement between the agents. Thus, divorce reform becomes a requirement of contractual honesty, not merely a concession to unhappiness.

  #### V. Weakening the Case for Destigmatizing Adultery

  Conversely, accepting contractualist fallibilism critically weakens the argument for decriminalizing or destigmatizing extramarital relations.

  The defense of adultery typically relies on the epistemic partition: "What happens in the Affective Episteme is private; as long as the Institutional Episteme (support, parenting) is maintained, the contract is not violated." However, contractualist fallibilism rejects this insulation.

  If the core obligation of the intimate contract is **procedural integrity regarding uncertainty**, then adultery represents a failure of that procedure. Adultery operates by concealing the shift in the Affective Episteme. It allows the agent to pursue new affective interests while maintaining the *appearance* of the original contract. This is epistemically dishonest. It bypasses the revision protocol (divorce or renegotiation) that the fallibilist contract requires.

  Under this reconstruction, the moral wrong of adultery is not necessarily the sexual act itself, nor solely the pain of jealousy (the utilitarian concern). The wrong is the **unilateral suspension of the revision protocol**. By engaging in adultery, the agent treats the contract as binding for the partner but optional for themselves, without invoking the agreed-upon mechanisms for change. This undermines the trust required for the fallibilist contract to function. If agents cannot trust that their partners will invoke the revision protocol rather than secretly bypassing it, the initial agreement to marry becomes epistemically unstable.

  Therefore, to maintain the coherence of the contractualist fallibilist position, one cannot consistently argue for easy divorce *and* normalized adultery. Easy divorce is the honest admission of fallibility; adultery is the dishonest concealment of it. Destigmatizing adultery encourages agents to hide their epistemic shifts rather than process them institutionally. This erodes the very trust that makes the fallibilist contract viable.

  #### VI. Conclusion: The Cost of Coherence

  This conceptual reconstruction demonstrates that the position on sexual ethics is more robust when grounded in contractualist fallibilism than in utilitarianism, but this robustness comes at a cost to its radicalism.

  By framing the argument through epistemic partitioning and fallibilism, we see that the liberalization of marriage law is not an attack on the institution of marriage, but a defense of its integrity against the reality of human change. It demands that the law reflect the truth of the agents' relationship. However, this same demand for truth-telling renders the defense of extramarital relations untenable. Adultery, in this light, is not a liberation from repression, but a failure of contractual courage—a refusal to face the epistemic consequences of one's changing desires.

  Thus, the reconstructed view achieves internal consistency only by sacrificing the permissiveness toward non-contractual intimacy. It argues that true sexual liberation lies not in the freedom to violate the contract secretly, but in the freedom to revise the contract openly. The tension in the original position is resolved by recognizing that the epistemic standards of the private agent must eventually govern the institutional contractor, and that any attempt to sever them completely results in a moral architecture that cannot sustain the trust it requires.
