answer: |-
  # Research Proposal: The Grammar of Divergence
  **Topic:** The Well-Posedness of Contrastive Questions in the Great Divergence Debate

  ## 1. Precise Statement of the Question

  The core objective of this paper is to define the conditions under which a contrastive historical question is **well-posed** rather than **degenerate**. Currently, the field treats the question *"Why did the Industrial Revolution occur in Britain and not in China?"* as a single explanandum. I propose that this grammatical form masks a logical structure that may be incoherent.

  **Definition of Well-Posedness:**
  A contrastive question of the form *"Why $P$ in case $A$ rather than $P$ in case $B$?"* is well-posed if and only if:
  1.  **Homology:** Cases $A$ and $B$ are homologous units (comparable in scale, political structure, and temporal synchronization).
  2.  **Shared Causal Variable:** The optimal explanation for the divergence appeals to a single causal variable $V$ that takes different values in $A$ and $B$ (e.g., $V_A = \text{high}$, $V_B = \text{low}$), such that the presence of $V_A$ explains $P$ and the absence (or different value) of $V_B$ explains $\neg P$.

  **Definition of Degeneracy:**
  A contrastive question is degenerate if the best available explanation for $P$ in $A$ relies on a set of causal variables $\{x, y, z\}$ and the explanation for $\neg P$ in $B$ relies on a disjoint set $\{m, n, o\}$, with no overlapping causal mechanism or variable. In this scenario, the "and not" is merely grammatical juxtaposition, not an explanatory constraint. The question should logically be split into two independent inquiries: *"Why $P$ in $A$?"* and *"Why $\neg P$ in $B$?"*

  **The Test:**
  The paper will operationalize the **Shared-Factor Criterion**. We decompose the contrastive claim into its conjuncts. If the explanatory models for the two conjuncts do not share a common causal variable that varies between the cases, the contrast is spurious.

  ## 2. Analysis of Competing Positions

  The current literature implicitly occupies one of three positions regarding the logical structure of this question. None have explicitly defended the logical structure, leaving the debate vulnerable to category errors.

  **Position 1: The Straightforward Causal Realist**
  *   **Stance:** The contrast is natural and unitary. There exists a specific difference-maker (e.g., property rights, coal geography, culture) that accounts for the divergence.
  *   **Why it leaves the question open:** This position assumes homology between Britain and China without argument. It presumes that because both polities had "economies," they are valid contrastands. It risks forcing a single variable onto two distinct historical processes that may not be instances of the same phenomenon. If the "cause" is coal, but China's non-industrialization is explained by demographic pressure, the Realist must argue these are functionally equivalent constraints, which is a substantive claim disguised as a causal one.

  **Position 2: The Framing Skeptic (Unit-Matching)**
  *   **Stance:** The question is an artifact of improper scaling. Britain (a small island polity) is being compared to China (a continent-scale empire). The puzzle dissolves if we compare England to the Yangtze Delta, or if we acknowledge different temporal tempos.
  *   **Why it leaves the question open:** While this addresses the **Homology** condition, it does not address the **Shared Causal Variable** condition. Even if we match England to the Yangtze Delta, we might still find that England's industrialization was driven by Atlantic trade while the Yangtze's stagnation was driven by internal fiscal policy. The units may match, but the causal fields may remain disjoint. This position solves the denominator worry but not necessarily the degeneracy worry.

  **Position 3: The Conjunctive Pluralist**
  *   **Stance:** The question is well-posed, but the answer is a conjunction of independent causes. Britain industrialized due to factors $\{a, b\}$; China did not due to factors $\{c, d\}$.
  *   **Why it leaves the question open:** This position effectively admits the question is degenerate by my definition but insists on keeping the grammatical form. It treats the "divergence" as a coincidence of two separate histories rather than a single causal process with a bifurcation point. If this position is correct, searching for a "Great Divergence" theory is a category error; we should be searching for separate theories of British growth and Chinese stagnation.

  ## 3. Method and Section-by-Section Plan

  The paper will not adjudicate which historical theory is *true* (e.g., whether coal mattered). Instead, it will analyze the *logical structure* of the leading theoretical families to see if they satisfy the Shared-Factor Criterion. This allows progress using secondary literature in translation without archival work.

  **Section 1: The Logic of Contrastive Explanation (approx. 1,000 words)**
  *   **Task:** Establish the philosophical groundwork. Define contrastive explanation using the "difference-making" model.
  *   **Action:** Distinguish between *explaining an event* (Why did Britain industrialize?) and *explaining a contrast* (Why Britain rather than China?). Argue that a contrastive explanation requires a common causal field.
  *   **Argument:** If the causal field is not common, the "contrast" is a post-hoc construction. Introduce the Shared-Factor Criterion here as the diagnostic tool.

  **Section 2: The Pre-Conditions: Unit-Matching and the Denominator (approx. 1,250 words)**
  *   **Task:** Address the two suspicions regarding scale and selection bias before applying the criterion.
  *   **Action:**
      *   **Unit-Matching:** Analyze the "Britain vs. China" pairing. Show how shifting the unit (e.g., Britain vs. Yangtze Delta) changes the available causal variables. If the variables available for explanation change based on the unit size, the question is unstable.
      *   **Denominator Worry:** Address the selection of the foil. If the set of "potential industrializers" is undefined, pairing the winner (Britain) with any loser (China, India, Ottoman Empire) generates a false sense of puzzle. A well-posed question requires a justified reference class (why was China the expected industrializer?).
  *   **Argument:** A question fails the well-posedness test if the answer changes depending on how you draw the map or when you start the clock.

  **Section 3: Applying the Shared-Factor Criterion to the Literature (approx. 2,000 words)**
  *   **Task:** Test the major explanatory frameworks against the criterion without judging their historical truth.
  *   **Action:** Select three dominant families of argument found in the secondary literature:
      1.  **The Ecological/Geographic Account:** (e.g., coal location, land constraint).
          *   *Test:* Does this variable explain both Britain's success *and* China's failure? Or does it explain Britain's success while China's failure is explained by something else (e.g., state structure)?
      2.  **The Economic/Price Account:** (e.g., high wages, factor prices).
          *   *Test:* Is "high wage" a shared variable (Britain = high, China = low)? If so, this passes the criterion. If Britain's wages are the cause but China's failure is attributed to "lack of property rights" (a different variable), it fails.
      3.  **The Institutional/Political Account:** (e.g., fragmentation vs. unity).
          *   *Test:* Does political fragmentation explain Britain's rise *and* China's stagnation? Or does it explain Britain's rise while China's stagnation is due to demographics?
  *   **Argument:** Demonstrate that many prominent theories actually fail the Shared-Factor Criterion. They offer a cause for Britain and a *different* cause for China, bundled together rhetorically as a "divergence."

  **Section 4: Failure Modes and Implications (approx. 1,000 words)**
  *   **Task:** Evaluate the criterion itself.
  *   **Action:** Consider two risks:
      *   **Triviality:** Is the criterion too loose? (e.g., "Resource Endowment" is a shared factor even if one had coal and the other had rain). *Response:* Refine the criterion to require the *same specific variable*, not just the same category.
      *   **Nihilism:** Is the criterion too strict? (e.g., Almost no historical contrasts pass). *Response:* If almost no contrasts pass, this is a substantive finding: history is mostly conjunctive, not contrastive. We should stop asking "Why X and not Y" and start asking "Why X" and "Why Y."
  *   **Argument:** The value of the test is not that it yields a "yes/no" on the Great Divergence, but that it forces the historian to specify whether they are proposing a *divergence mechanism* or two *independent histories*.

  **Section 5: Deliverable for Historical Practice (approx. 750 words)**
  *   **Task:** Answer the historian's question: "What can I do differently?"
  *   **Action:** Propose a **Contrastive Diagnostic Checklist**.
  *   **Argument:** Before framing a research question as a contrast, the historian must verify: (1) Unit Homology, (2) Justified Foil Selection, and (3) Shared Causal Variable. If (3) fails, the paper should be restructured as two parallel analyses rather than a single comparative causal claim.

  ## 4. Why This Approach?

  This approach is superior to the two obvious alternatives:

  1.  **Vs. Surveying Causal Hypotheses:** A standard literature review would get bogged down in whether coal *actually* mattered. That requires geological and economic data I do not have. By analyzing the *structure* of the arguments (i.e., "If coal is the cause for Britain, what is the cause for China?"), I can evaluate the logical coherence of the debate without settling the historical facts.
  2.  **Vs. Pure Conceptual Analysis:** A purely philosophical paper would discuss contrastive explanation in the abstract. By grounding it in the specific "Britain/China" case, I demonstrate the *cost* of methodological vagueness. It shows how a philosophical error (treating a degenerate question as well-posed) drives years of substantive historical research programs.

  This method respects the supervisor's concern that this is "methodological" by showing that methodology is not a preliminary step, but the substantive engine of the debate. If the question is ill-posed, the answers are category errors.

  ## 5. Possible Conclusions

  The paper will argue for one of the following outcomes, depending on the results of Section 3:

  1.  **The Degeneracy Conclusion:** Most "Great Divergence" theories fail the Shared-Factor Criterion. They explain Britain's rise with Variable A and China's stagnation with Variable B.
      *   *Implication:* The "Great Divergence" is a rhetorical construct. Research should split into "Origins of British Industrialization" and "Trajectories of the Qing Economy."
  2.  **The Specificity Conclusion:** Only specific subsets of the question are well-posed. For example, "Why textile mechanization in Lancashire and not Jiangnan?" may pass the criterion (shared variable: factor prices), while "Why industrialization in Britain and not China?" fails (disjoint variables).
      *   *Implication:* Historians must narrow the contrast class to homologous regions and specific industries to ask valid causal questions.
  3.  **The Criterion Failure:** If the test shows that *no* historical contrast passes (because history is always conjunctive), then the Shared-Factor Criterion is too demanding for historical explanation.
      *   *Implication:* We must accept that historical contrasts are often "bundle" questions, but we must label them as such to avoid searching for a non-existent single difference-maker.

  ## 6. Scope and Limitations

  **Honest Assessment of Constraints:**
  This paper is limited to the logical analysis of arguments found in secondary literature. It cannot resolve the substantive historical disputes. I will not determine if wages were actually higher in Britain than in China; I will only analyze what it means for the *structure of the explanation* if they were. Furthermore, I cannot fully solve the "Unit-Matching" problem. Defining the "correct" scale of analysis (state vs. region) is itself a substantive historical argument. I will treat unit-matching as a precondition for well-posedness, not a solvable variable. Finally, I am setting aside the definition of "Industrial Revolution." I will treat it as a placeholder for "sustained growth in labor productivity," acknowledging that if the definition shifts, the well-posedness of the question may shift with it. This paper is about the *question*, not the *event*.

  ## 7. Deliverable for the Historian

  If this paper succeeds, the deliverable for a historian colleague is a **Repair Recipe for Contrastive Questions**.

  Currently, when a historian encounters a puzzle ("Why X here and not there?"), they immediately search for causes. This paper provides a pre-search diagnostic tool.

  **The Checklist:**
  1.  **Check Homology:** Are the two cases comparable units (e.g., region-to-region, not state-to-empire)? If not, respecify the units.
  2.  **Check the Foil:** Was the "losing" case selected because it was a plausible alternative *ex-ante*, or only because it failed *ex-post*? If the latter, broaden the reference class.
  3.  **Check the Variable:** Can you state the explanation as "Variable $V$ was High in Case A and Low in Case B"?
      *   **If Yes:** Proceed with contrastive research.
      *   **If No (e.g., "Case A had Variable $V$, Case B had Variable $W$"):** Stop. You are not explaining a divergence; you are explaining two independent events. Rewrite the project as two separate histories or acknowledge the conjunctive nature of the claim.

  **Practical Utility:**
  This saves the historian from chasing a "single cause" for a contrast that is actually two separate phenomena. It prevents the frustration of finding a cause for Britain that doesn't seem to "fit" China, by clarifying that it isn't supposed to fit China if the question is degenerate. It shifts the goal from "finding the difference" to "validating the comparison."
