      *   **2. Three Claims:**
          *   *(a) Morality = sustaining/repairing dependency:* This is the main pressure point. Both sides claim to sustain dependency. Michael says sustaining the body violates the *relational* person she was. Parents say sustaining the body *is* the relation. Care ethics struggles here because "sustaining" is defined differently.
          *   *(b) Particulars > Principles:* Both sides use particulars (Michael: she said X once; Parents: she smiled at Y). Care ethics favors this, but without a neutral arbiter of *which* particular matters, it leads to stalemate.
          *   *(c) Self = Relational:* This holds up. Neither Michael nor Parents are acting as isolated individuals. They are acting as extensions of Terri. The autonomy frame fails because it tries to isolate Terri's "will" from her relationships.
          *   *Description:* Schindlers = Care as preservation of biological connection (relation as blood). Michael = Care as preservation of biographical identity (relation as shared history).

      *   **3. Reciprocity (The Hard Bit):**
          *   Noddings says care requires completion by the cared-for. If Terri can't receive/acknowledge, is it care?
