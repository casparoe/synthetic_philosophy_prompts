  2.  **Deconstruct Solomonoff Induction (SI) for the Ecologist:**
      *   *Universal Prior:* In ecology, we pick a candidate set $\mathcal{M} = \{M_1, ..., M_k\}$ and assign priors $P(M_i)$. SI says consider *all* computable programs. The prior is $2^{-K(p)}$, where $K(p)$ is Kolmogorov complexity (length of shortest code).
