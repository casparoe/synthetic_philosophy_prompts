      *(Refining Schmodal-grue)*: This is essentially a "local grue" problem. If the metric is internal to the theory, then the theory is doing the heavy lifting. Jonas calls this circularity. Mara calls it hidden metaphysics. Both are describing the same phenomenon differently. I should rate this as "Genuinely Unsettled" regarding whether it's a fatal flaw or a feature.

      *(Missing Elements)*: Don't forget the cognitive/evolutionary angle (Quine). Also the pragmatic contextualists (context determines which predicates are projectible).

