  *   **4 and 5:** These appear to clash (objective deservedness vs. cultural shifts), but they dissolve. 4 claims culture doesn't *make* emotions deserved; 5 claims culture shifts which emotion *does the enforcement work*. Efficacy (5) is distinct from moral desert (4).
  *   **2 and 3:** 2 defines a type of shame; 3 justifies its use. Consistent.

