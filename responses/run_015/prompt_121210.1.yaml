answer: |-
  The disagreement is not about whether identity statements vary in cognitive significance, but whether that variance is a semantic property of the proposition expressed or a psychological property of the thinker's access to it.

  **1. JOINT CLAIMS**

  1.  **Cognitive Significance:** The statement 'Hesperus is Hesperus' and the statement 'Hesperus is Phosphorus' differ in informativeness for a competent speaker who does not know the identity holds. This difference is stable across contexts and not merely a matter of individual whim.
  2.  **Substitution Failure:** In belief reports (e.g., 'Iris believes that Hesperus is visible'), substituting 'Phosphorus' for 'Hesperus' can change the truth value of the report, even though the terms refer to the same object.
  3.  **Generalization:** Parallel phenomena occur in natural kind identities ('Water is H2O') and indexical identities ('I am Iris'). In each case, a subject can assent to one form of the identity while dissenting from the other without logical incompetence.
  4.  **Rationality Constraints:** A subject who sincerely asserts 'Hesperus is visible' and 'Phosphorus is not visible' is not necessarily irrational in the same way a subject who asserts 'Hesperus is visible' and 'Hesperus is not visible' is.
  5.  **Fictional Identity:** In the case of the authorial revision ('Mary is Marianne'), the informativeness of the identity statement depends on the reader's epistemic history with the text (e.g., reading Draft Two vs. Draft Four), mirroring the Hesperus/Phosphorus structure without requiring the objects to exist.

  **2. RESIDUAL DISAGREEMENTS**

  | Issue | Millian Column | Fregean Column |
  | :--- | :--- | :--- |
  | **Semantic Content** | The content of a proper name is strictly its bearer. The proposition expressed by 'Hesperus is Phosphorus' is the singular proposition <Venus, Venus, Identity>. It is necessarily true and trivial. | The content of a proper name includes a mode of presentation (MoP). The proposition expressed is <MoP_H, MoP_P, Identity>. It is contingently knowable and non-trivial. |
  | **Source of Informativeness** | Informativeness is pragmatic. It arises from metalinguistic knowledge (e.g., 'The name "Hesperus" refers to the same object as the name "Phosphorus"') or from the manner in which the proposition is grasped, not the proposition itself. | Informativeness is semantic. It arises because the proposition itself contains distinct modes of presentation that are identified as co-referring. |
  | **Belief Reports** | Belief reports are context-sensitive. When we say 'Iris believes Hesperus is visible,' we are reporting a relation between Iris and a singular proposition, but the context selects which "guise" or "file" she uses to access it. | Belief reports report a relation between a thinker and a mediated proposition. Substitution fails because the MoP is part of the content being reported, not just the access route. |
  | **The Two-Dossier Case** | Iris believes a contradiction (<Embezzlement, Venus> and <Not-Embezzlement, Venus>). She is logically inconsistent, but we excuse her because her psychological files are segregated, preventing aggregation. | Iris believes two consistent propositions (<Embezzlement, MoP_A> and <Not-Embezzlement, MoP_B>). She is logically consistent because the contents differ. |

  **3. THE CRUXES**

  **Crux A: Locus of Cognitive Difference (Semantic Value vs. Psychological Vehicle)**
  *Question:* Does the difference between 'Hesperus' and 'Phosphorus' live in the proposition (semantic value) or in the mental files used to track the object (psychological vehicle)?
  *   **Millian Prediction:** The proposition is identical; the vehicles differ. If we could strip away the psychological files, the cognitive difference would vanish, leaving only the trivial identity.
  *   **Fregean Prediction:** The proposition is distinct; the vehicles merely reveal the proposition. If we strip away the vehicles, we lose the content entirely, leaving nothing to grasp.

  **Crux B: Semantic vs. Pragmatic Informativeness (The Embedding Test)**
  *Question:* Does the informativeness survive embedding in contexts where ordinary implicatures are killed (negation, conditionals, 'it is obvious that')?
  *   **Millian Prediction:** Under 'It is obvious that...', the sentence 'Hesperus is Phosphorus' remains semantically trivial. Any sense of non-triviality is a pragmatic illusion generated by the embedding context forcing a metalinguistic reading.
  *   **Fregean Prediction:** Under 'It is obvious that...', the sentence retains its non-trivial semantic content. It can be truly asserted that it is *not* obvious, because the content itself is not a trivial self-identity.

  **Crux C: Verbal Dispute (Mode of Presentation vs. Vehicle of Reference)**
  *Question:* Have the two sides collapsed into describing the same cognitive mechanism using different labels? Specifically, does the Fregean 'MoP' reduce to the Millian 'Psychological File'?
  *   **Millian Prediction:** Yes. The Fregean 'MoP' is just a psychological file dressed up as semantics. Once admitted that MoPs are individuated by cognitive role (as in the Mary/Marianne case), they are no longer semantic values but psychological tools.
  *   **Fregean Prediction:** No. A psychological file is private and variable; an MoP is abstract and shareable. The fact that 'Mary is Marianne' varies by reader state proves the *reader's* access varies, not that the text lacks a determinate sense relative to a specific draft context.

  **4. TEST CASES AND PRE-REGISTERED PREDICTIONS**

  **Case 1: The Two-Dossier (For Crux A)**
  *Setup:* Iris holds two files on the same man. File A says "He embezzled." File B says "He didn't." She asserts both sincerely, never merging the files.
  *   **Millian Prediction:** Iris is in a state of logical contradiction. We predict that if forced to aggregate the files (e.g., "Is it true that he both did and didn't?"), she must either retract one claim or admit inconsistency. The semantics demands contradiction; the psychology explains the delay.
  *   **Fregean Prediction:** Iris is in a state of logical consistency. We predict that even if forced to aggregate, she can maintain both claims by distinguishing the senses ("He-as-identified-in-A did; He-as-identified-in-B didn't"). The semantics allows consistency.

  **Case 2: The Embedding Test (For Crux B)**
  *Setup:* Evaluate the truth of "It is obvious that Hesperus is Phosphorus" spoken to an ancient Babylonian astronomer.
  *   **Millian Prediction:** The sentence is semantically true (it is obvious that Venus is Venus) but pragmatically infelicitous/misleading. The falsity lies in the implicature, not the content.
  *   **Fregean Prediction:** The sentence is semantically false. The content is not obvious to the astronomer. The falsity lies in the truth conditions of the proposition expressed.

  **Case 3: The Rename (For Crux C)**
  *Setup:* A reader encounters the sentence "Mary is Marianne." Reader X has only seen Draft Four (where the name is Marianne). Reader Y has seen Draft Two (Mary) and Draft Four (Marianne).
  *   **Millian Prediction:** This proves the phenomenon is purely epistemic/pragmatic. The semantic content of the fictional name is fixed by the final text (or the author's intention). The difference in informativeness between Reader X and Y is entirely outside semantics, residing in their biographical history.
  *   **Fregean Prediction:** This proves senses are context-sensitive but still semantic. The "sense" of 'Mary' is tied to the Draft Two context and 'Marianne' to Draft Four. The identity statement bridges two distinct semantic contexts. If this were merely psychological, the text itself wouldn't support the identity claim as a meaningful assertion within the fiction's history.

  ***

  **Meta-Note on Signability**

  I am moderately confident (approx. 70%) that a real Millian and a real neo-Fregean could sign this document. It successfully isolates the *locus* of the disagreement without forcing either side to concede their core intuition (Millians keep singular propositions; Fregeans keep mediated content). The table of residual disagreements is phrased in standard terminology both camps recognize.

  The single line I would be least surprised to see crossed out is in **Crux C, Fregean Prediction**: *"The 'sense' of 'Mary' is tied to the Draft Two context..."* A hardline Fregean might insist that fictional senses are abstract and immutable regardless of draft history, arguing that the reader's confusion is epistemic, not semantic. They might fear that tying sense to "draft context" concedes too much to the Millian idea that the variance is external to the content. Conversely, a hardline Millian might refuse to sign **Claim 5**, arguing that fictional names have no bearers and thus the whole puzzle dissolves into pretense, though most contemporary Millians accept fictional discourse enough to sign.
