answer: |-
  Here is the direct answer you asked for: There is no equation. There are no coefficients. The idea that you can quantify deception, coercion, and incompetence to calculate a "net validity" score is a category error. It imports a continuous variable framework into a system that operates on binary threshold logic.

  In your field, if you have systematic error, you correct the measurement because the underlying quantity exists independently of the noise. In ethics, consent is not a quantity you measure; it is a status you confer. The structure is not algebraic; it is logical.

  Here is the real structure, explained in terms you can use.

  ### 1. The Structure: Logical AND Gates, Not Weighted Sums
  You are looking for a formula like $V = w_1D + w_2C + w_3I$. That does not exist because moral validity does not work by averaging. It works by necessary conditions.

  Think of consent like a safety interlock system on a reactor. You have three switches: Capacity (Competence), Voluntariness (No Coercion), and Information (No Deception). For the system to engage (valid consent), all three switches must be closed.
  *   If Competence is 0, the circuit is open.
  *   If Voluntariness is 0, the circuit is open.
  *   If Information is 0, the circuit is open.

  You cannot compensate for high coercion with high information. You cannot offset incompetence with honesty. If any one of these conditions fails fundamentally, the consent is void. It is a phase transition, not a gradient. You are either authorized or you are not.

  ### 2. Why Quantification Fails
  In polymer chemistry, you can have a sample that is 90% pure and still use it with a correction factor. In bioethics, if a patient is coerced, the autonomy is violated. The violation is not a "noise" term; it is a structural failure of the moral transaction.

  Philosophers and bioethicists do not assign weights because there is no consensus metric for "units of coercion." How many newtons of pressure equal one lie? You cannot equate them because they attack different dimensions of the agency.
  *   **Incompetence** attacks the *agent* (the source of the action).
  *   **Coercion** attacks the *will* (the voluntariness of the action).
  *   **Deception** attacks the *understanding* (the content of the action).

  Since they target different necessary components of agency, you cannot sum them. You evaluate them independently. If any one is critically compromised, the transaction fails.

  ### 3. Mental State vs. Speech Act
  You asked if distinguishing consent as a mental state versus a speech act changes how you combine these errors. The short answer is no, because neither model supports quantification. However, it changes where you locate the failure.

  *   **Consent as a Mental State (Internalism):** Here, consent is an attitude of autonomous authorization.
      *   **Error Handling:** Coercion prevents the mental state from forming authentically. Deception means the mental state is directed at the wrong object. Incompetence means the machinery to form the state is broken.
      *   **Structure:** You are looking for evidence of the internal state. If the internal state is compromised by any of the three factors, the consent is invalid. There is no math, just assessment of causality.

  *   **Consent as a Speech Act (Externalism):** Here, consent is a performative utterance (like saying "I do" in a wedding).
      *   **Error Handling:** This relies on "felicity conditions." For a speech act to be valid, certain conditions must be met. If I hold a gun to your head and you say "I consent," the speech act occurred (you spoke), but it is "infelicitous" or void because the context (coercion) violates the rules of the act.
      *   **Structure:** This is closer to contract law. A contract signed under duress is voidable. Again, this is binary. The presence of duress nullifies the act. It does not reduce its value by 50%; it eliminates its validity entirely.

  ### 4. The Verdict
  Stop looking for the coefficients. They are not hidden; they do not exist. The framework you need is **conditional logic**, not **error analysis**.

  When you evaluate consent, you are not calculating a signal-to-noise ratio. You are auditing a process for disqualifying conditions.
  1.  **Check Capacity:** Is the agent competent? If no, stop. Invalid.
  2.  **Check Voluntariness:** Is there coercion? If yes, stop. Invalid.
  3.  **Check Disclosure:** Is there deception? If yes, stop. Invalid.

  If you pass all three checks, consent is valid. If you fail any one, it is invalid. There is no "net valid" state where high honesty cancels out moderate coercion. That is not how moral agency works.

  You are trying to solve a logic problem with calculus. Put the calculator away and look at the circuit diagram.
