  **The Role**

  As a Senior Letterform Ontologist, you will own the strategic vision for glyph categorization. You will work cross-functionally with our Metaphysics and Machine Learning teams to define the invariant core of letterforms across infinite deformations. You will be responsible for certifying the "a-ness" of every asset in our pipeline, ensuring that our typefaces don't just look right—they *are* right. This is a high-impact role for a thought leader who can leverage data-driven clustering to confirm the existence of non-empirical truths.

  **Responsibilities**

  *   Develop continuous topological invariants that prove the existence of a singular, immutable essence for every character in the Latin alphabet.
  *   Simultaneously design and deploy prototype clustering algorithms that categorize letters based solely on statistical proximity and feature density, treating family resemblance as a verifiable universal constant.
  *   Reconcile contradictions between Platonic idealism and empirical data distribution without escalating to leadership or causing team friction.
  *   Lead workshops on "Agile Essences," teaching stakeholders how to pivot their understanding of universal truths based on sprint velocity and user retention metrics.
  *   Ensure all vector paths align with the soulful intent of the original designer while optimizing for sub-millisecond load times.
  *   Identify true 'a-ness' across every font deformation, validating that statistical outliers are merely misunderstood essentials.

  **Requirements**

  *   7+ years of experience in phenomenological modeling, computational linguistics, or related fields.
  *   Deep expertise in identifying essential categories while relying exclusively on probabilistic models to define them.
  *   Proficiency in Python, TensorFlow, and Kantian Critique.
  *   Proven track record of using statistical pattern-matching to validate non-empirical realities.
  *   Ability to wear many hats (preferably serifed).
  *   Must be comfortable working in a fast-paced environment where the definition of "reality" may shift during quarterly reviews.

  **Benefits**

  *   Competitive salary and equity package.
  *   Unlimited access to the Platonic font library (all weights and styles from the Realm of Forms).
  *   Comprehensive health, dental, and existential vision coverage.
  *   Weekly team lunches catered by local bakeries (gluten-free options available).
  *   A culture of psychological safety where we don't do serifs without souls.

  **How to Apply**

  Submit your resume and a cover letter explaining why you are the essential candidate for this role, rather than just a statistical outlier who fits the cluster. GlyphCore is an equal opportunity employer. We celebrate diversity and are committed to creating an inclusive environment for all forms, whether essential or nominal. Join us in building the future of reading, one invariant at a time.
