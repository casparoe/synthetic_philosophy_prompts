  | Reading | Precise Claim | Verdict (Platitude / Defensible / False) | Supports DSM Dismissal? (Yes / Partial / No) | What Would Change This Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Minimal Realism** | There exists some mind-independent structure to the world that science attempts to describe, rather than reality being purely chaotic or wholly constructed. | Platitude | No | If reality were proven to be entirely mind-dependent or linguistically constituted (radical constructivism), this would become False, but this is generally rejected in philosophy of science. |
  | **2. Pragmatic Realism** | "Joints" are not intrinsic to nature alone but are relative to human investigative interests, goals, and capacities; a category is real if it supports successful intervention. | Defensible | No | If it were shown that pragmatic success is entirely orthogonal to ontological structure (i.e., false theories work best), this reading would lose force, strengthening the colleague's realist critique. |
  | **3. Homeostatic Property Cluster (HPC)** | Natural kinds are defined by stable clusters of co-occurring properties maintained by underlying causal mechanisms, which may be diverse rather than singular. | Defensible | Partial | If DSM categories were shown to exhibit no statistical clustering of symptoms or no causal cohesion whatsoever, this reading would become False, supporting the claim that DSM is merely conventional. |
  | **4. Mechanistic Essentialism** | A psychiatric category is natural if and only if all instances share a single, specific underlying neurobiological mechanism (etiological homogeneity). | Defensible (Contested) | Yes | If empirical evidence demonstrates widespread multiple realizability (same disorder symptoms arising from distinct neural pathways), this reading becomes False, undermining the requirement for RDoC-style alignment. |
  | **5. Eliminative Reductionism** | Special science categories (like psychiatry) are not real unless they are type-identical to fundamental biological or physical kinds; all higher-level categories are fiction. | False | Yes | If special sciences (e.g., biology, psychology) demonstrate predictive and explanatory power independent of reduction to physics, this reading is confirmed as False, invalidating the dismissal of DSM. |

  My overall reasoning is most vulnerable to the hidden assumption that ontological reality must track exclusively with etiological homogeneity (a single cause for a single kind). This assumption does the heaviest lifting in the colleague's argument, presupposing that if a category is multiply realizable, it is merely conventional. This assessment would be forced to revise if empirical research confirmed widespread cross-cutting mechanisms—where identical depressive phenotypes arise from wholly distinct neural substrates without any converging causal pathway. Such a finding would render the Mechanistic Essentialism reading False, suggesting that mechanism-based taxonomies (like RDoC) might fragment clinically meaningful kinds rather than reveal them. Conversely, if symptom-based categories proved pragmatically indispensable for treatment selection despite biological heterogeneity, the Pragmatic Realism reading would gain dominance, rendering the colleague's dismissal of DSM categories unjustified regardless of their neurobiological status. I am extrapolating here beyond established consensus by assuming a binary between "real" and "conventional," whereas many philosophers argue for a spectrum of kindhood that allows DSM categories to be imperfectly real without being dismissed entirely.
