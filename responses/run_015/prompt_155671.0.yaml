answer: |-
  # The Vandia Immigration Position Finder

  **Context:** You are advising the government of **Vandia**.
  *   **Population:** 12 million.
  *   **Economy:** Rich, high-tech, ageing workforce.
  *   **System:** Generous universal welfare state (healthcare, pensions, unemployment).
  *   **Task:** Answer the following 10 cases with **Yes**, **No**, or **Conditional**. Do not worry about consistency yet; answer based on your immediate intuition about the specific case.

  ### The Cases

  **1. The Net Recipient**
  An unskilled 55-year-old from a much poorer country applies to enter Vandia. He will work briefly but will likely be a net recipient of welfare for the rest of his life.
  *   **Q1:** Does he have a moral right to enter that Vandia must respect, even if he costs the treasury money?

  **2. The No-Welfare Counterfactual**
  Imagine Vandia abolishes its welfare state tomorrow. It becomes a pure free-market economy with no public pensions or unemployment insurance.
  *   **Q2:** Would you still support keeping borders closed to the 55-year-old from Q1, or does the border justification vanish without the welfare state?

  **3. The Wealthy Retiree**
  A wealthy 65-year-old from a poor country applies. She has enough private wealth to live in Vandia for 20 years without claiming a single cent of public funds.
  *   **Q3:** Does Vandia have the right to exclude her simply because it doesn't want new members, even if she costs nothing?

  **4. The Guest Worker**
  Vandia proposes a program: Admit workers for 5 years. No vote, no welfare, no path to citizenship. They must leave when the visa expires.
  *   **Q4:** Is this permissible, or is it unjust to allow people to work and live somewhere without offering them full membership?

  **5. The Scale Jump**
  Current intake is 50,000/year. A crisis causes 2 million people to arrive at the border overnight.
  *   **Q5:** If you supported admission at 50,000, must you change your answer at 2 million? (Yes = Threshold view; No = Principle view).

  **6. The Enclave Dweller**
  A migrant obeys all laws but refuses to learn the local language, rejects local social norms, and lives in a linguistic enclave.
  *   **Q6:** May Vandia deport them or deny citizenship for failing to integrate culturally, or is obeying the law enough?

  **7. The Surgeon (Brain Drain)**
  A surgeon from a country with a severe doctor shortage wants to move to Vandia. She sends money home that funds a clinic, but her departure leaves her home hospital understaffed.
  *   **Q7:** Does the harm to the *sending* country give Vandia a reason to block her, even if she benefits Vandia?

  **8. The Spouse**
  A Vandian citizen wants to bring their spouse from a poor country. The spouse has no skills and speaks no Vandian.
  *   **Q8:** Must Vandia admit the spouse as a right of the citizen, or may the state block them to control demographics?

  **9. The Unauthorized**
  A migrant entered without papers 15 years ago, has worked steadily, and has children in Vandian schools. They are caught.
  *   **Q9:** Does their long-term presence grant them a right to stay that overrides the initial illegal entry?

  **10. Monetization & Mechanisms**
  To manage fiscal impact or numbers, Vandia considers three tools:
      *   A) Selling visas to the highest bidder.
      *   B) Charging a surcharge on migrant earnings to fund "portable benefits" (benefits tied to the person, not the state).
      *   C) Neither; membership cannot be priced.
  *   **Q10:** Which are permissible?

  ---

  ### Scoring Key & Decision Tree

  *Follow the path that matches your answers.*

  **START: Q1 (The 55-Year-Old)**
  *   **NO:** Go to **Branch A (Restrictionist)**.
  *   **YES:** Go to **Branch B (Open/Admissionist)**.

  #### BRANCH A (Restrictionist)
  **Check Q2 (No-Welfare Counterfactual)**
  *   **NO (Still restrict without welfare):** Go to **A1**.
  *   **YES (Open borders if no welfare):** Go to **A2**.

  *   **A1: The Sovereigntist / Club View**
      *   *Path:* Q1=No, Q2=No. (Borders are about community, not money).
      *   *Check Q3 (Wealthy Retiree):* If **No** (Can exclude her), you are **The Club**. If **Yes** (Must admit her), you are **The Meritocrat**.
  *   **A2: The Redistributive Restrictionist**
      *   *Path:* Q1=No, Q2=Yes. (Borders exist to protect the welfare state).
      *   *Check Q7 (Surgeon):* If **Yes** (Block due to brain drain), you are **The Global Consequentialist**. If **No** (Only care about Vandia), you are **The Left Nationalist**.

  #### BRANCH B (Open/Admissionist)
  **Check Q4 (Guest Worker)**
  *   **YES (Guest work is fine):** Go to **B1**.
  *   **NO (Must offer citizenship/path):** Go to **B2**.

  *   **B1: The Market Liberal**
      *   *Path:* Q1=Yes, Q4=Yes. (Labor mobility yes, membership no).
      *   *Check Q10 (Monetization):* If **A (Selling Visas)**, you are **The Libertarian**. If **B (Surcharge/Portable)**, you are **The Portable Entitlements Advocate**.
  *   **B2: The Egalitarian Open Borders**
      *   *Path:* Q1=Yes, Q4=No. (Admission implies equality).
      *   *Check Q6 (Enclave):* If **Yes (Deport for no integration)**, you are **The Liberal Nationalist**. If **No (Law is enough)**, you are **The Cosmopolitan**.
      *   *Check Q9 (Unauthorized):* If **No (Deport anyway)**, you are **The Legalist**. If **Yes (Amnesty)**, you are **The Social Ties Advocate**.

  #### SPECIAL BRANCH (The State Skeptic)
  *   **Path:** If you answered **YES** to Q1, Q3, Q4, Q8, Q9 AND answered **NO** to Q5 (Scale doesn't matter) AND **NO** to Q2 (Welfare irrelevant).
  *   **Result:** **The No-Borders / Anarchist**.

  ---

  ### The Leaves (Positions)

  **1. The Club (Freedom of Association)**
  *   **Label:** Associational Restrictionism.
  *   **Roughly:** Christopher Heath Wellman.
  *   **Awkward Commitment:** A community could vote to exclude immigrants based on race or religion if that defined their "association."
  *   **Bad Case:** Excluding the Wealthy Retiree (Q3) who costs nothing and harms no one.

  **2. The Left Nationalist (Redistributive Restrictionism)**
  *   **Label:** Welfare-State Protectionism.
  *   **Roughly:** David Miller (in part).
  *   **Awkward Commitment:** Must turn away the global poor to protect the local poor, potentially worsening global inequality.
  *   **Bad Case:** The No-Welfare Counterfactual (Q2) renders your border logic incoherent.

  **3. The Global Consequentialist**
  *   **Label:** Sending-Country Priority.
  *   **Roughly:** Gillian Brock / Global Utilitarian.
  *   **Awkward Commitment:** Must block a migrant who wants to flee tyranny if their home country needs their labor.
  *   **Bad Case:** The Surgeon (Q7) is blocked from saving herself to "save" a broken system at home.

  **4. The Libertarian (Market Open Borders)**
  *   **Label:** Free-Market Immigration.
  *   **Roughly:** Milton Friedman (loosely).
  *   **Awkward Commitment:** Supports a permanent underclass of non-citizen workers (Guest Workers).
  *   **Bad Case:** The Guest Worker (Q4) who is deported after becoming socially integrated.

  **5. The Portable Entitlements Advocate (The Invented Scheme)**
  *   **Label:** Decoupled Fiscal Membership.
  *   **Roughly:** Robert Goodin (on portable benefits).
  *   **Status:** **Administratively Hopeless but Logically Coherent.**
  *   **Awkward Commitment:** Requires complex international tax treaties and currency hedging to function.
  *   **Bad Case:** If the migrant's home currency collapses, their "portable pension" becomes worthless, leaving them destitute in Vandia.

  **6. The Liberal Nationalist (Integrationist)**
  *   **Label:** Civic Integrationism.
  *   **Roughly:** David Miller / Will Kymlicka.
  *   **Awkward Commitment:** Must coercively enforce cultural norms (language, values) on residents.
  *   **Bad Case:** The Enclave Dweller (Q6) is punished for peaceful non-conformity.

  **7. The Cosmopolitan (Egalitarian Open Borders)**
  *   **Label:** Full Equality Admission.
  *   **Roughly:** Joseph Carens.
  *   **Awkward Commitment:** Risks overwhelming the welfare state that makes equality possible.
  *   **Bad Case:** The Scale Jump (Q5) where 2 million arrivals crash the system you wanted to share.

  **8. The Social Ties Advocate**
  *   **Label:** Presence-Based Rights.
  *   **Roughly:** Michael Walzer (on members).
  *   **Awkward Commitment:** Rewards illegal entry if you wait long enough; punishes those who apply legally.
  *   **Bad Case:** The Unauthorized (Q9) gains priority over the Spouse (Q8) who waited in line.

  **9. The Legalist**
  *   **Label:** Rule-of-Law Restrictionism.
  *   **Roughly:** Standard Conservative Legal View.
  *   **Awkward Commitment:** Must deport people who are functionally members of the society (15 years, kids in school).
  *   **Bad Case:** The Unauthorized (Q9) case creates a humanitarian crisis for no gain.

  **10. The No-Borders / State Skeptic**
  *   **Label:** Global Anarchism.
  *   **Roughly:** Alexandre Christoyannopoulos.
  *   **Awkward Commitment:** Cannot explain how to organize disaster relief or infrastructure without territorial jurisdiction.
  *   **Bad Case:** The Scale Jump (Q5) where no authority exists to manage the flow.

  ---

  ### Diagnostics & Weaknesses

  **Empty Combinations**
  *   **The "Fiscal-Only" Open Borderist:** If you answered **YES** to Q1 (Admit 55yo) but **YES** to Q2 (Restrict if no welfare), you are logically inconsistent. You claim the right to cross is moral, but contingent on economics. This cell is empty because it collapses into *Left Nationalism* or *Portable Entitlements*.
  *   **The "Sell-Everything" Club:** If you answered **YES** to Q10 (Selling Visas) but **NO** to Q3 (Exclude Wealthy Retiree), you are incoherent. If membership is for sale, you cannot exclude the wealthy without a non-fiscal reason (which puts you in *The Club*).

  **Indistinguishable Leaves**
  *   **The Club vs. Left Nationalist:** This quiz cannot fully separate them. Both restrict borders. The *Club* does it for liberty (freedom of association); the *Nationalist* does it for equality (protecting redistribution).
      *   *Extra Case to Separate:* "Vandia votes to admit only Christians." The Club says "Permissible"; The Nationalist says "Impermissible (violates equality)."
  *   **Liberal Nationalist vs. Cosmopolitan:** Both may admit the migrant. The split is on *conditions*.
      *   *Extra Case to Separate:* "A migrant refuses to send their children to mixed schools." The Liberal Nationalist restricts; The Cosmopolitan permits.

  **Weakest Link**
  *   **The Portable Entitlements Leaf:** This position collapses into *Market Liberal* in practice. If the surcharge is high enough to cover costs, it acts like a visa fee (Selling Admission). If it's low, it fails to protect the welfare state. The quiz treats it as distinct, but in reality, it is a technical mechanism that could be adopted by *any* leaf except *The Club* or *No-Borders*. It is a policy tool, not a moral position.

  **Note on Q5 (Scale Jump)**
  *   This is the most revealing question for engineers. If your position changes at 2 million, you are a **Consequentialist** (regardless of your label). If it does not change, you are a **Deontologist** (Rights-based). Most "Open Borders" advocates secretly answer "Yes" here, which moves them closer to *Liberal Nationalism* than *Cosmopolitanism*.
