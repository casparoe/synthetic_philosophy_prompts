answer: |-
  You have hit upon one of the most fascinating and poignant aspects of Henry Sidgwick's intellectual life. Your intuition is correct: there is no contradiction here, nor was it a secret dependency he sought to hide from his peers. Rather, Sidgwick's psychical research was a direct, deliberate, and desperate attempt to provide **empirical validation** for the **metaphysical postulates** required by his ethical system.

  To understand why a philosopher of such rigorous caution would spend decades investigating ghosts, we must look at the specific problem he faced in *The Methods of Ethics* and why philosophical reasoning alone could not solve it.

  ### 1. The Ethical Problem: The Dualism of Practical Reason
  In the conclusion of *The Methods of Ethics* (1874), Sidgwick arrives at a troubling impasse. He analyzes three methods of ethics: Intuitionism, Egoism (pursuing one's own happiness), and Utilitarianism (pursuing the universal good).

  He finds that Reason commands us to be Utilitarians. However, Reason also commands us to be Rational Egoists. In a world without divine order, these two commands can conflict. It is often rational to sacrifice the universal good for your own happiness, or vice versa. If being moral leads to personal misery (which it often does in this life), then morality is not fully "rational."

  To resolve this **Dualism of Practical Reason**, Sidgwick argues we must assume a moral order of the universe where virtue and happiness ultimately coincide. Like Kant, he concludes this requires two postulates:
  1.  **The existence of God** (a moral ruler of the universe).
  2.  **Immortality** (a future life where the deficits of this life's justice are corrected).

  However, Sidgwick was an empiricist at heart. He found Kant's solution unsatisfying because it rested on *faith* or practical necessity rather than evidence. Sidgwick wanted to know if these postulates were *true*, not just if they were *useful*.

  ### 2. The Psychical Solution: Turning Postulates into Facts
  This is where the Society for Psychical Research (SPR) comes in. Sidgwick did not found the SPR merely out of curiosity; he founded it as a scientific project to test the hypothesis of survival after death.

  If psychical research could prove, via scientific induction, that consciousness survives bodily death, then **Immortality** moves from a philosophical *postulate* to an empirical *fact*. If you combine survival with evidence of a moral order (e.g., spirits communicating about divine justice), you potentially solve the Dualism of Practical Reason without relying on religious dogma.

  Sidgwick wanted to naturalize theology. He hoped to provide a rational, evidence-based foundation for morality that could satisfy the Victorian crisis of faith. As he wrote to a colleague, if the evidence for survival were strong, "the whole aspect of all questions of right and conduct would be changed."

  ### 3. Was it a Secret?
  It is a common misconception that Sidgwick hid this motivation. It was not a "dark secret," but it was a **methodological separation**.

  *   **In his Philosophy:** He kept the postulates as assumptions because the evidence was not yet proven. To base *The Methods of Ethics* on unproven ghost stories would have undermined its philosophical rigor.
  *   **In his Science:** He tried to keep his philosophical hopes from biasing his investigation of mediums. He was famously skeptical within the SPR, often exposing frauds rather than championing believers.

  He was open about the connection with his inner circle (including fellow SPR founders F.W.H. Myers and Edmund Gurney, and philosopher Arthur Balfour). However, he did not publicly advertise that the SPR was essentially an ethical rescue mission, largely to protect the scientific credibility of the Society. He wanted the evidence to stand on its own, not appear as the wish-fulfillment of a moral philosopher.

  ### 4. Was the Empirical Case Strong Enough?
  This is the tragic core of Sidgwick's project. **No, the evidence was not strong enough.**

  Sidgwick spent nearly 30 years investigating telepathy, apparitions, and mediumship. While the SPR did produce some intriguing case studies (such as the "Crosland Correspondence" or various accounts of deathbed visions), nothing approached the level of scientific certainty Sidgwick required to revise his ethics.

  *   **Sidgwick's Own Verdict:** Sidgwick remained an agnostic to the end of his life. He never claimed that psychical research had proven immortality. In his final years, he admitted that the evidence was suggestive but inconclusive.
  *   **The Ethical Consequence:** Because the empirical case failed, Sidgwick never retracted the "Dualism of Practical Reason." He died believing that there is a fundamental conflict at the heart of rationality that cannot be fully resolved without assumptions that cannot be proven.

  ### 5. Conclusion: Rationality and Despair
  Your suspicion that his ethical work "depends" on the paranormal is partially right, but with a crucial caveat: His ethics depend on the *truth* of the paranormal, but he proceeded as if it were *unproven*.

  This creates a picture of Sidgwick that is more human and tragic than the cold utilitarian machine he is often portrayed as. He was a man who needed the universe to be moral to make sense of his own rationality. When philosophy couldn't guarantee it, he turned to science. When science (in the form of psychical research) couldn't prove it, he was left with a "fundamental contradiction" in his system.

  Far from a bizarre contradiction, his psychical research was the ultimate expression of his philosophical consistency. He refused to accept a moral truth on faith alone; he demanded evidence. The fact that he spent decades looking for that evidence, and admitted he didn't find it, is not a mark against his carefulness, but a testament to it. He would rather leave his ethical system with a gaping hole than fill it with a lie.

  **Summary:**
  *   **Connection:** The SPR was founded to empirically verify the immortality postulate required to reconcile Egoism and Utilitarianism.
  *   **Secrecy:** It was not secret among colleagues, but kept methodologically separate to preserve the integrity of both the philosophy and the science.
  *   **Evidence:** The evidence was insufficient. Sidgwick remained agnostic, and the "Dualism of Practical Reason" remains unresolved in his work.
  *   **Verdict:** It was not a contradiction, but a failed rescue mission. Sidgwick hoped science could save morality, but the data did not cooperate.
