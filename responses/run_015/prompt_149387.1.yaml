answer: |-
  Dear Student,

  It is always refreshing to encounter a draft that grapples with the mechanical underpinnings of legitimacy rather than simply rehearsing standard positions, and your intuition about the discontinuity between the idealized deliberator and the actual voter is sharp. You are asking whether the normative force of deliberative democracy collapses if the citizen cannot recognize themselves in the ideal agent, and you are framing this through a distinction between direct and indirect normativity. Before we get into the specifics of the literature and your terminology, let us walk through the dialectic of your argument as it stands. If we distill the strongest version of your position, it is this: deliberative models rely on a substitution effect where the ideal agent's reasoning is treated as normatively equivalent to the actual citizen's reasoning, but this equivalence holds only if the normativity transfers directly without requiring psychological mediation. The force of your argument relies on the claim that this transfer fails phenomenologically because actual citizens experience a reflexive gap, meaning the ideal verdict feels alien rather than authoritative. The best reply you should anticipate, and indeed the one most deliberative democrats will instinctively reach for, is that you are conflating the context of justification with the context of psychology. They will argue that the ideal speech situation or the original position is not meant to describe a psychological state that citizens must inhabit, but rather a justificatory standard that tests whether laws can be defended with public reasons, regardless of whether every citizen feels a continuous identity with the rational agent constructing those reasons. In their view, legitimacy comes from the availability of justification, not the subjective experience of endorsement, so your reflexive gap is irrelevant to the normative bindingness of the outcome.

  Now that we have the dialectical landscape in view, we need to look closely at your use of direct versus indirect normativity, because this is the place where your argument is most vulnerable to confusion. In the standard literature on practical reason and democratic theory, these are not the conventional terms of art for the distinction you are drawing. Typically, when philosophers discuss whether a norm binds an agent based on their actual psychological standpoint versus an objective rational standpoint, they are debating internalism versus externalism about reasons, or sometimes actual consent versus hypothetical consent. When you describe direct normativity as the ideal agent's verdict being ours in cleaner form, you are describing a form of externalism where reasons exist independently of the agent's subjective motivational set. When you describe indirect normativity as requiring reflective endorsement from the actual standpoint, you are describing a form of internalism or a volitional constraint on legitimacy. The risk here is that by using direct and indirect, you may be inadvertently invoking associations with direct and indirect utilitarianism or direct and indirect realism, which could confuse your readers. If you stick with these terms, you must define them rigorously in your introduction, but you might find your argument gains traction if you translate it into the more established language of internalist constraints on legitimacy. The core of your insight is not necessarily about the direction of normativity but about the conditions under which a hypothetical agreement can bind an actual will. There is a mediated binding you might be missing, which is the concept of representation or trusteeship. Some theorists argue that the ideal deliberator represents the citizen's higher-order interests even if the citizen does not currently endorse them, similar to how a legal guardian might make decisions for a ward. Your argument effectively challenges this by suggesting that in a democracy, unlike in guardianship, this representation fails if the reflexive gap is too wide. You need to address whether deliberative democrats claim to be trustees of our rationality or merely testers of our public reasons.

  Regarding your question about whether this is a genuinely new worry or simply a dressing up of the complaint that ideal theory is unrealistic, the answer is nuanced. The broad stroke of your critique aligns closely with the political realist turn that has gained momentum over the last fifteen years. Thinkers in that tradition have long argued that ideal theory fails because it ignores the distinctiveness of the political realm and the realities of disagreement and power. However, your specific focus on the phenomenological experience of the voter in direct democratic settings adds a layer that is less commonly explored. Most critiques of ideal theory focus on feasibility or stability at the institutional level, whereas you are focusing on the first-person experience of normative bindingness. You are arguing that legitimacy fails not because the institution collapses, but because the normative link is severed at the level of individual recognition. This is closer to Bernard Williams' requirement that legitimacy must satisfy the critical theory test, meaning the acceptance of the order must not be produced by false consciousness. Your reflexive gap is essentially a claim that the ideal theory induces a kind of alienation that violates this test. So, while the general territory is contested ground between liberals and realists, your specific mapping of the reflexive gap in the context of referendums and ballot propositions offers a fresh empirical angle. You should not present this as overturning the entire deliberative project, but rather as identifying a specific condition of psychological continuity that deliberative theory often assumes but does not prove.

  There are also some settled distinctions in the literature you need to navigate carefully to ensure you are not fighting a straw man. It is fairly settled among deliberative democrats like Habermas that legitimacy arises from the procedure of discourse itself, not necessarily from the outcome matching a pre-political moral truth. However, it is also contested whether that procedure must be actually instantiated or if it can be hypothetically reconstructed. Rawls, for instance, relies heavily on hypothetical consent in the original position, whereas Habermas insists on actual discourse in the public sphere. Your argument hits Rawls harder than Habermas, because Habermas already builds actual communication into his model. If you treat all deliberative democracy as relying on the original position model, you might be overlooking the strands of the theory that already demand actual endorsement. You need to clarify whether your critique applies to the hypothetical models of justification or to the actual institutional designs of deliberative democracy. Furthermore, the distinction between ideal and non-ideal theory is often misunderstood. Ideal theory is not necessarily meant to be implemented directly; it is often intended as a compass for direction rather than a blueprint for immediate action. If you argue that ideal theory breaks the link to actual decisions, you need to show that deliberative democrats claim it should determine actual decisions immediately, rather than guide long-term reform. Your examples of Swiss referendums and California propositions are strong because they are instances where actual decisions happen, but you must ensure you are not criticizing ideal theory for failing to do a job it never claimed to do, which is to predict actual voting behavior.

  Finally, I want to offer a plain assessment of where you might be reaching. The claim that normativity breaks if there is a reflexive gap is a strong internalist claim that not all philosophers accept. Many would argue that I can be bound by a norm even if I do not feel continuous with the agent who formulated it, provided the norm is objectively reasonable. For example, a citizen might be bound by a tax law they voted against and do not personally endorse, provided the procedure was fair. Your argument suggests that without the feeling of continuity, the obligation dissolves entirely, which is a radical conclusion. You need to defend why the phenomenological feeling of continuity is a necessary condition for legitimacy rather than just a desirable feature. If you cannot defend that necessity, your argument might retreat to the weaker claim that lack of continuity reduces stability or compliance, which is a sociological claim rather than a philosophical one about normativity. To keep it philosophical, you must argue that legitimacy itself, not just stability, is compromised. This is a hard line to hold, but it is where the philosophical weight of your essay lies. You are essentially arguing for a phenomenological constraint on political obligation, and that is a bold move that requires careful defense against the objection that politics often requires us to abide by reasons we do not personally feel as our own.

  In sum, you are onto something real regarding the psychological discontinuity between ideal models and actual voters, but you need to tighten your terminology to align with standard debates about internalism and hypothetical consent. You should position your work as a phenomenological refinement of the realist critique rather than a wholly new discovery, and you must be prepared to defend the claim that subjective continuity is a condition for legitimacy rather than merely for stability. If you can clarify the direct and indirect normativity distinction or replace it with more standard terminology, and if you can distinguish between the justificatory role of ideal theory and its psychological uptake, you will have a compelling paper that bridges the gap between abstract theory and the lived experience of democratic citizenship.
