answer: |-
  Here is a concrete scenario illustrating how greedy reductionism in cultural transmission can smuggle in a Skyhook while claiming to use only Cranes.

  ### The Terminology
  *   **Cranes:** Mechanistic, step-by-step processes (e.g., natural selection, reinforcement learning, statistical pattern matching) that build complexity from below.
  *   **Skyhooks:** Unexplained explainers that provide order or complexity from above (e.g., "instinct," "mind," "culture" treated as a monolithic force).
  *   **The Trap:** A theory claims to build a structure entirely with Cranes, but the construction only holds together because a Skyhook is secretly supporting a crucial beam.

  ### The Scenario: The Kaeli Resin-Spear
  Imagine a small-scale society, the Kaeli, who manufacture a specialized hunting tool: the **Resin-Spear**. This tool requires a complex, causally opaque sequence:
  1.  Heating a specific plant resin to exactly 60°C (too hot, it becomes brittle; too cold, it doesn't bond).
  2.  Wrapping sinew around the haft in a specific spiral tension.
  3.  Chanting a rhythmic phrase that takes exactly the same amount of time as the resin cooling period (30 seconds).

  If any step is missed, the spearhead falls off during the first thrust. The behavior is culturally stable across generations.

  ### The Greedy Reductionist Account (The "Cranes")
  An anthropologist proposes a **Cumulative Cultural Evolution (CCE)** model to explain this. They want to avoid "mysterious" cultural forces. Their explanation relies entirely on **Individual Learning + Social Copying**:

  1.  **Variation:** Novices watch experts and attempt to copy the movements. They introduce random errors (noise).
  2.  **Selection:** If the spear holds, the novice receives a positive reward (successful hunt, social praise). If it breaks, they receive negative feedback.
  3.  **Retention:** Successful variations are reinforced and copied by the next generation.

  The anthropologist claims: *"There is no need for innate modules or high-level cultural rules. This is just statistical pattern matching operating on behavioral inputs. The crane of reinforcement learning lifts the complexity."*

  ### The Hidden Explanatory Debt
  The reductionist account looks solid until we examine the **Input Phase** of the statistical learning. For the novice to learn via statistics, they must gather data. This is where the Skyhook is smuggled in.

  #### 1. The Segmentation Problem (The Continuous Stream)
  Physically, the expert's behavior is a continuous stream of motion: muscles contracting, heat radiating, sound waves vibrating, breath exhaling.
  *   **The Reductionist Claim:** The novice statistically correlates "movements" with "outcomes."
  *   **The Hidden Debt:** To calculate a correlation, you must first define the **variables**.
      *   Is the variable *hand temperature*? *Wrist angle*? *Vocal pitch*? *Duration of silence*?
      *   The novice does not know *a priori* which aspects of the continuous stream are relevant variables.
      *   If the novice treats "chanting" as irrelevant noise (because it has no mechanical contact with the spear), they will never learn the timing constraint.
      *   If the novice treats "resin color" as the variable rather than "resin viscosity/heat," they will fail.

  #### 2. The Skyhook: Pre-Carved Ontology
  For the statistical learning (the Crane) to work, the novice must already perceive the world in terms of **discrete, causally relevant units**. They must see the action not as "arm waving and humming," but as *"Heating," "Wrapping,"* and *"Timing."*

  *   **Where the Skyhook enters:** The reductionist explanation assumes the learner possesses a **pre-given representational framework** that segments the behavioral stream into the *correct* units for copying.
  *   **Why it is a Skyhook:** The theory claims to explain the origin of the complex cultural trait (the spear technique) using learning. But it implicitly assumes the learner already possesses the complex cognitive architecture required to *identify* that trait as a learnable object. The "categories" (heat, tension, duration) are doing the heavy lifting of the explanation, but their origin is unexplained. They are suspended from above.

  #### 3. The "Success Function" Rig
  The reductionist model relies on a "Success Function" (Spear holds = Good).
  *   **The Problem:** The feedback is **delayed and noisy**. The spear might hold during manufacture but break on the hunt (hours later).
  *   **The Reductionist Fix:** "Social praise bridges the gap."
  *   **The Hidden Debt:** For social praise to work as a reinforcement signal, the novice must know *which part* of their behavior is being praised.
      *   If the expert says "Good job," does that reinforce the *chant*, the *grip*, or the *fact that the novice showed up*?
      *   For the reinforcement to shape the specific resin technique, the novice must already hypothesize that *"resin handling"* is the object of evaluation.
      *   **The Skyhook:** The reductionist assumes the **Hypothesis Space** is already constrained to relevant cultural variables. The learner doesn't test "Should I wear a red shirt?" because they know (somehow) that shirt color is outside the hypothesis space of spear-making. That constraint is the Skyhook.

  ### Summary of the Smuggle
  Here is the exact moment the explanatory debt is hidden:

  1.  **Claim:** "We explain the complex ritual via simple statistical learning (Cranes)."
  2.  **Requirement:** Statistical learning requires a defined set of features to track (e.g., *temperature* vs. *color*).
  3.  **Assumption:** The model assumes the agent tracks *temperature*.
  4.  **The Debt:** Why does the agent track temperature? In a reductionist framework, salience should emerge from low-level sensory impact. But resin temperature is *not* visually salient compared to, say, the brightness of the fire or the loudness of the chant.
  5.  **The Skyhook:** The agent treats "functional variables" as salient *before* they understand the function. The "understanding of function" is the very thing the model is supposed to explain.

  **Conclusion:** The reductionist account claims to build the representational framework (the knowledge of what matters in spear-making) out of statistics. But to gather the statistics, the agent must already possess the representational framework (the knowledge of what variables exist to be counted). The "Cranes" of learning are resting on a "Skyhook" of pre-segmented cognitive categories. The explanation eliminates the "mind" or "culture" from the output, but quietly hides it in the input.
