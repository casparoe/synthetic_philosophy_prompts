      *   No citations.
      *   Address the specific questions (shared-prior status, entitlement).
      *   Steelman both sides.
      *   Include timeframe and pre-registered check.

  8.  **Final Polish:** Check flow, clarity, and ensure the "software engineer" voice comes through (systematic, logic-driven) while respecting the philosophical weight. (Self-correction: Ensure I don't get too technical on the code side, keep it on methodology).

  *(Self-Correction on Word Count)*: I need to make sure I don't run short. I will expand on the implications of the "marker" versus the "shrinkage." The shrinkage affects the number sold to clients; the marker affects the human's career. This distinction is vital for the word count and the ethical argument.

  *(Self-Correction on "Entitlement")*: I need to be very sharp here. We own the aggregate model. We do not own their rationality.

