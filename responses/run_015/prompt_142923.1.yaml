      *   *The "Entitlement" Question:* The prompt asks specifically: "which of those we are entitled to enforce on a named individual." I need to be explicit here. We are entitled to weight their data for our product; we are not entitled to label their cognition as flawed without proof.
      *   *Aumann's Theorem:* The prompt mentions it but says "no citations." I should refer to the *logic* (common prior + common knowledge = agreement) without naming Aumann.
