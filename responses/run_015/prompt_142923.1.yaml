answer: |-
  **MEMORANDUM**

  **TO:** Methodology and Appeals Committee
  **FROM:** [Your Name], Engineering Lead & Committee Member
  **DATE:** 14 March
  **SUBJECT:** Recommendation Regarding Dispersion Review Mechanics and Public Markers

  **Executive Summary**

  We are convened to adjudicate the appeal filed by M. Adeyemi and S. Kowalczyk regarding the Dispersion Review rule. The current rule shrinks contributions from forecasters diverging significantly from the aggregate and applies a public "sustained-divergence marker" after repeated offenses. The Data Lead argues this preserves aggregate accuracy; the appellants argue it penalizes rational disagreement and misidentifies the nature of their divergence.

  After reviewing the logs, resolution data, and the epistemic claims on both sides, I recommend we **retain the shrinkage mechanic but suspend the public marker indefinitely.** We should reclassify the shrinkage not as a penalty for irrationality, but as a modeling weight for outlier detection. This recommendation includes a one-season trial period with a pre-registered check on aggregate performance. This path preserves the statistical integrity of our product while acknowledging we lack the evidence to enforce a rationality requirement on named individuals.

  **The Status of the Shared-Prior Assumption**

  To decide this case, we must first define what the "shared-prior assumption" is doing in our pipeline. The Dispersion Review relies on the logic that if two agents share the same information and start from the same baseline expectations, they cannot knowingly disagree. When they do disagree persistently after deliberation, the model assumes one has failed to update.

  We must be precise about the ontological status of this assumption. It is not a **requirement of rationality** that we can verify. As the engineering logs confirm, we cannot distinguish between a forecaster who holds a genuinely different prior (a different "urn") and one who has failed to absorb shared evidence. Both states produce identical probability distributions in our database. To treat the assumption as a verified requirement of rationality is to claim knowledge of internal cognitive states that our system cannot observe.

  Nor is it strictly an **empirical claim** about our forecasters' information, because the data is ambiguous. The resolution record shows that in three of fourteen flagged cases, the "divergent" forecaster was correct, including our largest miss last season. If the rule reliably identified irrationality, the divergent party should almost always be wrong.

  Therefore, the shared-prior assumption functions as a **modeling convention**. It is a heuristic that allows our aggregation algorithm to treat persistent divergence as noise rather than signal. We are entitled to use this convention to protect the mathematical properties of the aggregate we sell to clients. We are not, however, entitled to enforce it as a moral or cognitive judgment on the forecasters themselves. We can weight their data differently; we cannot label their minds defective without proof.

  **The Case for the Appellants**

  Adeyemi and Kowalczyk present a compelling structural argument. Their claim rests on the observation that they are often pricing different events despite identical question text. Our own reference-class tags support this: when Adeyemi prices "system capability," she may be referencing a class of rapid breakthrough scenarios, while Kowalczyk references a class of regulatory bottleneck scenarios. If the semantic content of the proposition differs for each forecaster, the divergence is not a failure of updating; it is a mismatch in denotation.

  Furthermore, they argue that prior heterogeneity is not a defect. In long-horizon forecasting, where data is sparse, reasonable experts may start from different baselines. If the Dispersion Review treats all prior disagreement as updating failure, it conflates diversity of thought with cognitive stubbornness.

  Most critically, they object to the marker. The shrinkage affects the number we publish; the marker affects their livelihoods and reputations. By publishing a marker under our name, Meridian asserts that these forecasters are systematically irrational. Given that we cannot distinguish priors from updating failures, and given that divergent forecasters are sometimes right, this assertion is epistemically unjustified. It punishes them for a crime we cannot prove they committed.

  **The Case for the Data Lead**

  The Data Lead's defense rests on outcomes, not introspection. The aggregate's Brier score improved by eleven percent in the first season under the rule. This is a material gain in accuracy for our clients. The Lead argues that the purpose of the deliberation window is to converge on a shared information set. When forecasters refuse to move toward the center after seeing each other's reasoning, they are effectively withholding the value of the deliberation.

  Even if we cannot distinguish priors from stubbornness in individual cases, the Lead argues that persistent divergence is a reliable *statistical* signal of lower accuracy across the population. The rule does not need to be right about *why* Adeyemi and Kowalczyk disagree; it only needs to be right that shrinking their influence improves the crowd's wisdom. If we reclassify all divergence as "respectable prior heterogeneity," the aggregation model loses its teeth. It collapses toward a plain average, surrendering the accuracy gains we achieved by treating outliers as potential noise. The marker, in this view, is a necessary incentive to ensure forecasters engage sincerely with the deliberation process rather than entrenching themselves.

  **Recommendation and Implementation**

  Both sides are partially correct. The Data Lead is correct that the shrinkage improves the product. The appellants are correct that the marker implies an unproven judgment about their rationality.

  Therefore, I recommend we **retain the 60% shrinkage** but **suspend the public sustained-divergence marker.**

  We retain the shrinkage because it functions as a robustness check for the aggregate. Whether the divergence stems from stubbornness or incompatible reference classes, the statistical reality is that extreme outliers in our current pool correlate with lower accuracy. We are entitled to weight our model to minimize error.

  We suspend the marker because it crosses the line from modeling to judgment. We cannot verify that a forecaster is irrational. We can only observe that their data is an outlier. To publish a marker is to claim we know the cause of the outlier, which we do not. We should not stake our reputation on a claim of individual irrationality when the resolution data shows divergent forecasters are sometimes correct.

  **Time Frame and Pre-Registered Check**

  This policy should be adopted for the upcoming season (1 April to 31 March). At the end of this period, we will run a pre-registered check to determine if the removal of the marker degrades the quality of deliberation or the accuracy of the aggregate.

  **The Check:**
  1.  **Aggregate Accuracy:** Compare the Brier score of the current season against the previous three-year average. If the score drops by more than 2%, the incentive effect of the marker may have been necessary.
  2.  **Deliberation Movement:** Measure the average absolute change in probability per forecaster during the deliberation window. If this movement decreases significantly, it suggests forecasters are engaging less seriously without the threat of the marker.
  3.  **Outlier Resolution:** Track the accuracy of the "shrunk" contributions specifically. If the shrunk forecasts outperform the aggregate, we must revisit the shrinkage percentage.

  **Conclusion**

  We are building a machine for consensus, not a tribunal for rationality. The shared-prior assumption is a tool for the machine, not a law of nature we can enforce on the humans feeding it. By keeping the shrinkage, we protect our clients' trust in the number. By dropping the marker, we protect our forecasters' trust in our fairness. We acknowledge that while we can filter data for noise, we cannot label the source of that noise without better evidence than our logs provide.

  I move that we adopt this modified framework effective 1 April.
