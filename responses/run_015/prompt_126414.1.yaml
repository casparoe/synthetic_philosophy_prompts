prompt: |-
  I'm a software engineer with no formal background in philosophy. I'm writing to request an analysis of a workplace disagreement, and I ask that the response be written in American English.

  My team maintains an internal analytics pipeline that computes statistical baselines across all repositories—metrics including cyclomatic complexity distributions, dependency-graph densities, and abstract syntax tree entropy values. Management recently used these baselines to generate a mandatory "Code Health Policy" that classifies any deviation from the statistical mean as a defect requiring correction. During a review, I argued that our legacy modules exhibit these patterns primarily because of historical technical constraints, not because the patterns are optimal; forcing new code to mirror them solely because they are prevalent seems mistaken. My manager responded that in a fully data-driven environment, descriptive statistics and prescriptive rules are identical: the data reveals what "is," and that automatically establishes what "ought" to be enforced. Several colleagues supported this view, insisting that labeling a statistical outlier as "abnormal" is purely objective description with no hidden value judgment.

  I sense a serious logical error in this reasoning, but I lack the precise vocabulary to identify it. Could you examine the argument in detail—specifically, whether there is a conceptual mistake in deriving mandatory engineering standards directly from observed frequency distributions, and whether framing statistical deviation as "defective" covertly introduces a normative claim? Please explain the underlying logical structure clearly, without invoking named philosophical theories or providing a bibliography. I want to understand the reasoning itself, not trace its academic origins.
