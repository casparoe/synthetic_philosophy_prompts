answer: |-
  In a contemporary neurorehabilitation clinic, two patients with equivalent dorsolateral prefrontal cortex damage utilize an identical executive-planning algorithm to restore decision-making capacity. Patient A employs an implanted bidirectional neural interface where the algorithm continuously performs interoceptive modulation—adjusting processing priorities based on internal physiological states like heart rate and hormonal levels—and its outputs are integrated directly into the patient's neural global workspace, the brain's system for broadcasting information to multiple cognitive modules. Patient B utilizes the exact same algorithm hosted on an external secure server; here, the patient inputs data manually, the server processes the request without accessing physiological states, and only the final decision recommendation is transmitted back to the patient's display, lacking any reciprocal influence on the algorithm's internal state or direct neural integration.

  The verdicts diverge based on the locus of moral standing. (1) A functionalist who takes computation-plus-integration as sufficient for derivative moral standing should treat both computations similarly, arguing that the causal role of the algorithm in guiding behavior is preserved in both cases regardless of physical distance. (2) A biological-embedding theorist who requires reciprocal integration into a unified living global workspace should deny standing to the remote computation in B but possibly grant hybrid standing in A, viewing the implanted loop as an extension of the biological self. (3) Both should agree that the human patient retains full primary status regardless, as the auxiliary tools do not supersede the inherent worth of the biological organism.

  The exact structural feature driving this disagreement is reciprocal, real-time modulation versus one-way transmission. In Patient A, the system changes based on the body's state, and the body changes based on the system's output in a continuous loop; in Patient B, the flow is linear. Stripping this feature away—making both cases one-way or both bidirectional—collapses the case into a generic substrate-independence dispute, where the only remaining variable is whether silicon can host moral status irrespective of biological coupling.

  The strongest counterattack directed at the biological-embedding theorist is an argument that the feedback loop in A is merely causal instrumentation rather than constitutive integration. This objection posits that even in Patient A, the chip remains a tool the brain uses to regulate itself, distinct from the organism's identity, much like a pacemaker regulates the heart without becoming part of the soul. By framing the data exchange as external causation rather than internal constitution, this argument denies that the loop creates a unified moral entity, forcing the theorist to prove why specific bandwidth or latency thresholds would transform a tool into a subject without relying on vitalistic assumptions about life forces.
