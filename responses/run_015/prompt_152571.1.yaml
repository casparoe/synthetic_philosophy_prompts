          *   *Analysis:* Distinguishing feeling sure from knowing.
          *   *Verdict:* Crucial distinction. Marcus claims "knowing you know" reduces to confidence. Elena says no. Elena is right philosophically; confidence is fallible, knowledge (by definition) is not.

