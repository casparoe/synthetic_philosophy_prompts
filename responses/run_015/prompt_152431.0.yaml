      *   *Theory 2: Inference/Self-Interpretation (Nichols & Stich, or similar).* We treat ourselves like others. We look at behavior/context to guess feelings.
      *   *Theory 3: Interpretive/Constructivist (Dennett, etc.).* Mental states aren't fixed things; we narrate them into existence. Like reading a weather map that *creates* the weather.

  3.  **Translate to Truck Vocabulary:**
