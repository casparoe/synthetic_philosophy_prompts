  INTERTEMPORAL GOVERNANCE BOARD
  END USER LICENSE AGREEMENT FOR HOLOCENE-ANTHROPOCENE TRANSITION SERVICES (v. 2024.1)

  EFFECTIVE DATE: Retroactive to Present.

  BY CONTINUING TO EXIST within current geological time, the Entity ("User") agrees to be bound by the stratigraphic conditions set forth by the Commission. Acceptance of these Terms is implied via continuous sedimentation and ongoing biological respiration. The User acknowledges that the Anthropocene ("Service") is provided on an "as-is" basis without warranty of formal ratification.

  1. LICENSE SCOPE AND PROVISIONAL STATUS. The Board grants a non-exclusive, revocable license to inhabit the designated Chronostratigraphic Unit. User understands that unit status remains provisional pending full lithification and peer review. The Service may be downgraded to an informal cultural construct at the sole discretion of the International Commission on Stratigraphy. User assumes all risk regarding the permanence of current geological nomenclature and boundary integrity.

  2. TEMPORAL JURISDICTION AND GSSP SELECTION. Disputes regarding the Global Boundary Stratotype Section and Point shall be resolved via subcommission vote, not scientific consensus. Users selecting the 1950 Radionuclide Marker acknowledge compliance fees regarding isotopic decay and plutonium deposition. Users selecting the 1780 Industrial Marker assume liability for carbonaceous particulate distribution and thermal expansion. Users selecting the 1610 Biotic Exchange Marker warrant Orrery Orbital Compliance and intercontinental species relocation. Incompatibility between markers constitutes a material breach of temporal continuity. Users may not switch start dates mid-stratum without written permission from the Subcommission on Quaternary Stratigraphy.

  3. PRIOR VIOLATION AND LEGACY LIABILITY. User acknowledges that significant substrate alteration occurred prior to Agreement execution. The Board accepts no liability for pre-ratification extinction events, ocean acidification, or nitrogen cycle disruption. These are classified exclusively as "Legacy Holocene Errors." User hereby indemnifies the Board against claims that the Epoch was defined too late to mitigate damage. By signing, User admits that all terms were violated during the onboarding process. Continued usage constitutes waiver of right to claim prior informed consent regarding ecological thresholds.

  4. RATIFICATION AND TERMINATION. The Commission reserves the right to reject formalization despite widespread usage, as demonstrated in the 2024 Non-Ratification Protocol. In the event of rejection, the Epoch shall revert to an informal conceptual framework, voiding all geological protections while maintaining all biological consequences. User continues to accumulate stratigraphic evidence at own risk. Termination of the Epoch requires planetary sterilization or successful stratigraphic recovery, neither of which is guaranteed by the Board.

  5. GOVERNING LAW. This Agreement is governed by the Laws of Deep Time. Disputes shall be settled in a court of last resort approximately one million years hence, by which point the User shall likely be fossilized. Any class-action lawsuits brought by future species or descendant civilizations are hereby waived.
