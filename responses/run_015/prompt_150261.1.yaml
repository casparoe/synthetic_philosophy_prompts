      *   *Body Paragraph 2 (The Consequence of Rejection):* Rejecting based on this philosophical technicality leads to tangible harm (climate, sprawl). Even if the victims are different people, a world with severe climate disruption is objectively worse than one without. We have a duty to leave a livable world, not just *a* world.
