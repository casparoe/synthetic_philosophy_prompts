      *(Self-Correction on Case A)*: If there is an explicit pass move, does SSA fail? SSA relies on the fact that P1 makes a move $m$, then pretends to be P2. If P2's strategy says "play at $m$", P1 plays elsewhere. If passing is allowed, P2's strategy might be "Pass". If P1 passes immediately, roles swap. This creates a loop or parity issue. Standard SSA requires that you *must* place a piece. I will flag "Explicit Pass" as a critical halt point because it breaks the "extra piece is always on board" invariant needed for the contradiction.

