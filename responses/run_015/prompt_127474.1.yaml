      *   *Description:* Symmetric grid, capture mechanics, explicit pass move.
      *   *Analysis:*
          *   Symmetry: Yes.
          *   Deterministic/Perfect Info: Yes.
          *   Pass Move: This is the killer. If P1 passes, P2 becomes P1 effectively. But SSA relies on P1 making a move and *then* adopting P2's strategy. If passing is allowed, P1 can pass immediately. If the game allows passing, does it allow *infinite* passing? If finite, does passing change the parity?
          *   *SSA Applicability:* Usually, SSA fails if passing is allowed *unless* passing is strictly dominated or leads to a loss. If passing is a valid strategic option, the "extra move" assumption breaks because the "extra move" could be a pass, handing the turn back.
          *   *Wait, standard SSA:* Requires that making a move is never worse than not making a move. If I can pass, I am choosing *not* to place a piece. If placing a piece can be bad (Zugzwang), SSA fails.
          *   *Verdict:* The explicit pass move introduces the possibility of Zugzwang or parity shifts. SSA likely halts here.

  5.  **Applying to Case B: Asymmetric Auction/Resource Depletion:**

      *   *Description:* Asymmetric, opening action depletes shared resource.
      *   *Analysis:*
          *   Symmetry: No (Asymmetric).
          *   Resource Depletion: Irreversible state change.
          *   *SSA Applicability:* SSA *requires* symmetry. If the game is asymmetric (different starting resources, different roles), P1 cannot pretend to be P2.
          *   *Verdict:* Immediate fail on Symmetry. SSA does not apply.

  6.  **Applying to Case C: Symmetric, SSA Applies, but P1 Bias Exists:**

      *   *Description:* Symmetric, SSA formally says "P2 can't force win," but empirically P1 wins way more.
