  2.  **Understand the Strategy-Stealing Argument (SSA):**

      *   *What is it?* A proof by contradiction used in combinatorial game theory.
      *   *Premise:* If the second player (P2) had a winning strategy, the first player (P1) could make an arbitrary initial move and then "steal" P2's strategy for the rest of the game, ignoring the extra piece/move if necessary.
      *   *Key Conditions:*
          1.  Symmetry (the board/state looks the same for both).
          2.  Extra move is never a disadvantage (monotonicity/non-negative value of moves).
          3.  No passing (usually, though some variants allow it if passing doesn't help P2 specifically).
          4.  Finite, deterministic, perfect information, no draws (or draws count as P1 not losing).
      *   *Conclusion:* P2 cannot have a *forced* win. It does *not* prove P1 has a forced win (could be a draw).

