  # PROTOCOL SSA-99: STRATEGY-STEALING AUDIT PROCEDURE
  **Version:** 1.0 (Competitive Programming League Standards)  
  **Objective:** Determine if the Strategy-Stealing Argument (SSA) formally precludes a guaranteed Second-Player (P2) win in proposed deterministic games.  
  **Warning:** A passing result indicates *only* that P2 cannot force a win. It does **not** guarantee a First-Player (P1) win, nor does it guarantee game fairness (Draw).

  ---

  ## PART I: THE AUDIT CHECKLIST

  Referees must execute steps 1–5 sequentially. If any step triggers a **HALT**, the SSA is inapplicable. If all steps pass, the **Logical Conclusion** is binding.

  ### 1. Game Class Verification
  *   **Precondition:** The game must be finite, two-player, deterministic, perfect-information, and zero-sum.
  *   **Evidence Required:** Formal ruleset specifying termination conditions (no infinite loops) and complete state visibility.
  *   **HALT CONDITION:**
      *   **Continuous Values:** If state space involves real numbers (e.g., positioning with infinite precision), SSA halts. (Discrete topology required).
      *   **Simultaneous Resolution:** If players act simultaneously (e.g., Rock-Paper-Scissors mechanics), SSA halts. (Strict turn-order required).
  *   **Branch:** If Pass $\rightarrow$ Proceed to 2. If Halt $\rightarrow$ **Defer to Human Judgment (SSA Inapplicable).**

  ### 2. Initial Symmetry & Rule Isomorphism
  *   **Precondition:** The initial board state must be symmetric under player exchange. Rules available to P1 must be identical to P2.
  *   **Evidence Required:** Mapping function $f: \text{State}_{P1} \rightarrow \text{State}_{P2}$ that preserves legal moves and win conditions.
  *   **HALT CONDITION:**
      *   **Irreversible Asymmetry:** If the opening move permanently alters the ruleset or resource pool in a way that prevents P1 from mimicking P2's hypothetical strategy (e.g., burning a resource P2 needs to copy the strategy), SSA halts.
  *   **Branch:** If Pass $\rightarrow$ Proceed to 3. If Halt $\rightarrow$ **Defer to Human Judgment (SSA Inapplicable).**

  ### 3. Move Monotonicity (The "Extra Piece" Test)
  *   **Precondition:** Having an extra piece/marker on the board must never be a disadvantage.
  *   **Evidence Required:** Proof that for any state $S$, state $S + \{\text{P1 Marker}\}$ is $\ge$ value of $S$ for P1.
  *   **HALT CONDITION:**
      *   **Zugzwang Risk:** If being forced to move can worsen a player's position, SSA halts. (SSA requires P1 to make an arbitrary opening move; if that move can be harmful, the contradiction fails).
  *   **Branch:** If Pass $\rightarrow$ Proceed to 4. If Halt $\rightarrow$ **Defer to Human Judgment (SSA Inapplicable).**

  ### 4. Passing & Null Moves
  *   **Precondition:** No passing allowed, or passing is strictly dominated (leads to immediate loss).
  *   **Evidence Required:** Ruleset analysis confirming turn forfeiture is impossible or suicidal.
  *   **HALT CONDITION:**
      *   **Explicit Pass:** If a player can pass without penalty, the "extra move" invariant breaks (P1 can pass, handing P2 the first-mover role, creating a parity loop).
  *   **Branch:** If Pass $\rightarrow$ Proceed to 5. If Halt $\rightarrow$ **Defer to Human Judgment (SSA Inapplicable).**

  ### 5. Termination & Draw Status
  *   **Precondition:** Game must end. Draws must be classified (e.g., Draw = P1 not losing).
  *   **Evidence Required:** Finite state graph confirmation.
  *   **Logical Conclusion:** **P2 cannot have a forced winning strategy.**
      *   *Note:* This permits two outcomes: (1) P1 has a forced win, or (2) The game is a theoretical Draw.
      *   *Restriction:* Do **not** certify the game as "Balanced" or "Fair."

  ---

  ## PART II: AUDIT LOG (PROPOSAL APPLICATIONS)

  ### Proposal A: Symmetric Grid-Capture with Explicit Pass
  *   **Step 1 (Game Class):** Pass. (Discrete, Turn-based).
  *   **Step 2 (Symmetry):** Pass. (Grid is symmetric).
  *   **Step 3 (Monotonicity):** Pass. (Capturing is beneficial).
  *   **Step 4 (Passing):** **HALT.**
      *   *Finding:* Ruleset allows an explicit pass move.
      *   *Reasoning:* If P1 passes immediately, P2 becomes the de facto First Player. If P2 had a winning strategy as Second, they now possess it as First. P1 cannot "steal" this strategy because they have not placed a piece to ignore later; they have surrendered tempo. The strategic isomorphism required for the contradiction collapses.
      *   *Action:* **SSA Inapplicable.** Defer to human judgment regarding Zugzwang and parity balancing.

  ### Proposal B: Asymmetric Auction-Style Format
  *   **Step 1 (Game Class):** Pass.
  *   **Step 2 (Symmetry):** **HALT.**
      *   *Finding:* Opening action permanently depletes a shared resource pool asymmetrically.
      *   *Reasoning:* The state after P1's opening move is not isomorphic to the initial state P2 would face if roles were swapped. P1 cannot mimic P2's strategy because the resource cost to do so has changed. The "Strategy Steal" requires P1 to play P2's strategy on a board that looks like P2's board; the depleted resource breaks this mapping.
      *   *Action:* **SSA Inapplicable.** Game is inherently asymmetric; balance must be tested empirically.

  ### Proposal C: Symmetric Format (SSA Valid, P1 Bias Reported)
  *   **Step 1–5:** **ALL PASS.**
      *   *Finding:* Game is discrete, symmetric, no passing, monotonic value of moves.
      *   *Formal Conclusion:* **P2 cannot force a win.**
      *   *Empirical Data:* Competitive testing shows P1 win rate = 88%.
      *   *Action:* **Checklist Passed, but League Overrules.** (See Adjudication Memo below).

  ---

  ## PART III: ADJUDICATION MEMO (CASE C)

  **TO:** League Commissioners  
  **FROM:** Referee Audit Team  
  **SUBJECT:** Rejection of Proposal C Despite SSA Compliance  

  ### 1. The Discrepancy
  The SSA-99 checklist correctly validates that Proposal C is not a *theoretical P2 win*. However, the league's standard for acceptance is not "P2 does not force a win," but "Competitive Integrity." In Proposal C, while the SSA holds, the game exhibits a severe First-Mover bias that the mathematical proof fails to capture.

  ### 2. What the Procedure Fails to Capture
  The SSA is an **existence proof**, not a **constructive** or **quantitative** one. It confirms that a P2 winning strategy *cannot exist*, but it does not distinguish between a "Forced P1 Win" and a "Theoretical Draw." In the context of a Competitive Programming League, three specific factors render the checklist insufficient:

  *   **Computational Complexity Asymmetry:**
      The SSA assumes infinite time and perfect calculation. In our league, agents operate under time controls. Even if Proposal C is a theoretical Draw, the P1 agent searches to depth $D$, while P2 effectively searches to depth $D-1$ (responding to P1's move). In high-branching games, this single ply difference creates a massive disparity in search quality. P1 can find the drawing line; P2 cannot find the refutation within the time limit. The checklist verifies *theoretical* fairness, not *computational* fairness.

  *   **Tempo Effects vs. Monotonicity:**
      Step 3 (Monotonicity) verifies that an extra piece is never a *disadvantage*. It does not verify that the extra piece is *neutral*. In Proposal C, the "extra move" commits P1 to a specific vector of attack. While theoretically non-negative, this commitment restricts P1's flexibility (tempo) in ways that are difficult to model mathematically but exploitable by heuristics. The SSA assumes the "stolen" strategy works regardless of the extra piece; in practice, the extra piece may clog the optimal path, forcing P1 into a sub-optimal but still winning line that P2 cannot access.

  *   **Hidden Structural Bias (Tree Topology):**
      The board is symmetric, but the game tree is not. The root node (P1's turn) has a different topology than the child nodes (P2's turn). If the winning lines are concentrated in shallow branches accessible only to P1, the game is solved for P1. The SSA does not analyze the *distribution* of winning states, only their *existence*.

  ### 3. Judgment Call
  The League must **REJECT** Proposal C.

  **Justification:** Relying on the SSA checklist would be mathematically honest but competitively negligent. The SSA guarantees only that P2 is not *guaranteed to win*. It permits a game where P1 is *guaranteed to win*. In a competitive league, a "Solved P1 Win" is as undesirable as a "Solved P2 Win."

  Furthermore, under time constraints, a "Theoretical Draw" that requires P2 to search significantly deeper than P1 to maintain is functionally a P1 Win. We cannot approve a ruleset where competitive integrity relies on the assumption of infinite computation. The checklist must be overruled to prioritize **playable balance** over **theoretical non-loss**.

  **Recommendation:** Implement a "Komi" system (resource compensation for P2) or reject the format entirely until empirical win rates converge to 50% $\pm$ 5% under standard time controls.

  **Signed,**  
  *Head Referee, Audit Division*
