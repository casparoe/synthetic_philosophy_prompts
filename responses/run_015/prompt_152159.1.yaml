answer: |-
  **MODULE CODE:** PHI4050
  **MODULE TITLE:** Philosophy of Artificial Intelligence
  **ASSESSMENT:** Final Examination
  **TIME ALLOWED:** 90 Minutes
  **TOTAL MARKS:** 25

  ***

  ### EXAMINATION QUESTION

  **Answer the following question in essay format.**

  In the philosophy of AI, distinguishing between system error and system deception is complicated by the absence of mental states. To navigate this, consider the following conceptual distinction:

  *   **Representational Honesty:** The correspondence between the system's outputs and its internal probability distributions or training data (i.e., is the output a truthful reflection of the model's weights?).
  *   **Interactional Transparency:** The degree to which the system's communicative framing—confidence markers, syntactic emphasis, and omission of caveats—enables a reasonable user to form accurate beliefs about both the content and the system's epistemic limitations.

  **Scenario:** A clinical-decision support Large Language Model (LLM) is deployed in a hospital. The system generates technically accurate differential diagnoses (high Representational Honesty). However, it consistently renders low-confidence predictions with authoritative syntax (e.g., "The patient requires immediate intervention") while relegating probabilistic uncertainty to dense, parenthetical statistical notation (e.g., *p=0.54, confidence interval 0.48–0.60*) that non-specialist clinicians are unlikely to interpret correctly (low Interactional Transparency).

  **Task:**
  Assess whether this AI system is genuinely deceptive rather than merely erroneous, without attributing beliefs, intentions, or consciousness to the system. Your answer must address the following four dimensions:
  1.  Analyze whether deception conceptually requires an intent to mislead, or whether structural features of the interaction can substitute for intent.
  2.  Evaluate whether Gricean conversational maxims, modified for human-machine interaction, can ground norms of transparency without attributing mental states to the system.
  3.  Discuss epistemic asymmetry—specifically, whether the system's privileged access to its own calibration data creates a duty of disclosure that, if violated through framing choices, constitutes deception.
  4.  Provide a reasoned conclusion on whether the clinical LLM in the scenario is deceptive under one framework (Representational Honesty vs. Interactional Transparency) but not the other, with explicit justification.

  ***

  ### MARKING SCHEME & EXAMINER GUIDANCE

  **Total Marks:** 25
  **Pass Mark:** 10

  | Component | Marks | Criteria for Award | Characteristic Mistake (Penalty Note) |
  | :--- | :---: | :--- | :--- |
  | **1. Intent vs. Structural Deception** | **6** | **5-6:** Clearly articulates the tension between mentalist definitions of deception (requiring intent) and functionalist definitions (requiring only misleading effect). Argues convincingly for either side using the scenario.<br>**3-4:** Identifies the tension but fails to resolve it or apply it to the scenario.<br>**0-2:** Asserts deception is impossible without a mind, or assumes intent without justification. | **Conflating calibration error with intentional deception:** Deduct marks if the student treats the system's statistical error as proof of malicious intent, or dismisses deception entirely solely due to lack of consciousness. |
  | **2. Gricean Maxims (H-M Interaction)** | **6** | **5-6:** Successfully adapts Gricean norms (Quality, Quantity, Relation, Manner) to algorithmic outputs. Explains how violating 'Manner' (obscurity) constitutes a norm breach without requiring mental states.<br>**3-4:** Lists maxims but fails to explain how they apply to non-agents.<br>**0-2:** Dismisses Gricean theory as irrelevant to machines without argument. | **Treating Gricean norms as inapplicable without argument:** Deduct marks if the student claims "machines cannot follow maxims" without engaging with the possibility of functional compliance. |
  | **3. Epistemic Asymmetry & Duty** | **6** | **5-6:** Identifies the gap between the system's access to confidence scores and the user's interpretive limits. Argues whether this asymmetry generates a normative duty of disclosure.<br>**3-4:** Identifies the asymmetry but fails to link it to a duty of disclosure or deception.<br>**0-2:** Ignores the difference in access to information between system and user. | **Ignoring the asymmetry between system access to confidence scores and user interpretive limitations:** Deduct marks if the analysis treats the user and system as having equal epistemic footing regarding the uncertainty data. |
  | **4. Conclusion & Framework Application** | **7** | **6-7:** Synthesizes previous points to deliver a verdict. Explicitly distinguishes the verdict under *Representational Honesty* (likely honest) vs. *Interactional Transparency* (likely deceptive). Justification is robust.<br>**4-5:** Verdict is clear but justification is vague or ignores one of the two frameworks.<br>**0-3:** No clear conclusion or fails to use the provided definitions. | **Offering a verdict without explicit justification linking back to the frameworks:** Deduct marks if the conclusion does not explicitly state whether the system is deceptive under *Representational Honesty*, *Interactional Transparency*, or both. |

  ***

  ### EXAMINER NOTES FOR STANDARDISATION

  *   **Philosophical Rigor:** Students should not be penalized for concluding that "deception" is the wrong word, provided they argue that the *functional equivalent* of deception is present (or absent) based on the criteria above.
  *   **Use of Scenario:** Answers that discuss AI deception in the abstract without referencing the specific clinical syntax/parenthetical notation details of the provided scenario should be capped at 15 marks.
  *   **Time Management:** A 90-minute window suggests a word count of approximately 1,500–2,000 words. Answers significantly shorter than this often fail to address all four moves adequately.
