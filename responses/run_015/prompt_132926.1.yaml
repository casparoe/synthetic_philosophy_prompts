  **TO:** Emergency Resource Allocation Board
  **FROM:** Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Opinion on Catastrophic-Surge Triage Protocol Certification

  **Introduction**

  Next Tuesday, this Board must decide whether to certify a new catastrophic-surge triage protocol. The central contention concerns the protocol's tie-breaking rule: when two patient cohorts present identical clinical priority scores, selection is randomized. The designers characterize this not as a loophole, but as an "acknowledged genuine moral dilemma," asserting that when moral considerations are symmetrically balanced, no resolution is correct. A minority of the Board argues this constitutes a design failure and violates our charter's prohibition against institutionalizing an "unavoidable moral wrong."

  This opinion evaluates the philosophical legitimacy of encoding indeterminacy into policy, assesses the minority's charter concerns, and recommends a course of action that honors moral honesty without abdicating design responsibility.

  **The Legitimacy of Encoding Indeterminacy**

  We must treat the designers' claim seriously: genuine moral dilemmas exist. In surge scenarios, patients may present with identical survival probabilities, identical resource needs, and identical life-stage considerations. To insist a moral fact exists distinguishing them is to invent a distinction where none obtains. If the moral scales are perfectly balanced, any non-random selection mechanism (e.g., first-come-first-served, provider discretion) introduces bias disguised as principle.

  Can a decision-making system legitimately encode a choice its architects regard as lacking a correct answer? Yes. In such cases, the system's goal shifts from *substantive correctness* (choosing the "better" patient) to *procedural fairness* (choosing without bias). Randomization in the face of symmetry is not an admission of defeat; it is an ethical commitment to equality. It acknowledges moral residue without compounding it with arbitrary preference. To demand a deterministic rule where no moral distinction exists is to demand a lie.

  **The Minority Concern: Design Failure vs. Moral Wrong**

  The minority contends that apparent symmetry is always illusory—a result of coarse grading rather than genuine moral equivalence. They argue that finer-grained distinctions in prognosis, social vulnerability, or procedural fairness should always break ties. Their strongest consideration is that labeling a tie "arbitrary" risks clinical laziness. If providers know a tie triggers a coin flip, they may lack the incentive to pursue difficult prognostic distinctions that could justify saving one patient over another. Furthermore, they argue our charter forbids institutionalizing an "unavoidable moral wrong." If randomization sacrifices a patient who might have had a marginally better outcome obscured by coarse metrics, is that not a wrong?

  We must also answer whether rejecting the protocol resolves this tension. It does not. Rejecting the protocol merely relocates the moral burden from the institution to the bedside clinician. Without a standardized tie-breaker, providers will still face identical patients during surge conditions. They will then make ad-hoc decisions, likely relying on implicit biases rather than explicit randomization. Rejection protects the Board from certifying a "wrong," but it exposes patients and providers to unregulated moral distress. The tension is not resolved; it is privatized.

  **Recommendation: Adopt with Binding Conditions**

  I recommend we **ADOPT WITH CONDITIONS**.

  We should certify the protocol because the designers are philosophically correct: genuine symmetry occurs, and randomization is the only fair resolver. However, the minority is pragmatically correct: coarse grading can mask distinguishable cases. To satisfy the charter's requirement that we avoid institutionalizing wrongs through design failure, we must ensure "ties" are genuine, not artifacts of laziness.

  **Binding Conditions:**
  1.  **Audit Requirement:** Any instance where the randomization tie-breaker is invoked must be logged and subject to retrospective review by an Ethics Audit Committee. The goal is to verify that clinical scoring was maximally granular before declaring a tie.
  2.  **Sunset Clause:** This protocol expires in 18 months, requiring recertification based on audit data regarding the frequency of ties.
  3.  **Transparency Mandate:** The randomization rationale must be publicly documented as "procedural fairness in moral symmetry," not merely "operational efficiency."

  **Implementation Timeline**

  *   **Tuesday (Vote):** Board certification contingent on conditions above.
  *   **Wednesday–Friday:** Legal and Clinical Leadership integrate audit logging into electronic health records.
  *   **Monday (Next Week):** Mandatory staff training on the ethical rationale for randomization to prevent morale degradation.
  *   **Day 30:** First Ethics Audit Committee review of tie-breaker usage.
  *   **Month 18:** Mandatory recertification vote based on audit findings.

  **Conclusion**

  We cannot design away moral tragedy. When patients are truly equal in priority, saving one necessarily wrongs the other. The protocol's honesty about this fact is a virtue, not a vice. However, we must ensure this honesty is not used to excuse imprecise clinical judgment. By adopting this protocol with strict audit conditions, we uphold the charter's spirit—avoiding design failure—while accepting the designers' philosophical insight: that sometimes, fairness requires admitting we cannot choose based on merit.

  \answer{ADOPT WITH CONDITIONS Acknowledges moral limits while ensuring ties are not merely clinical laziness.}
