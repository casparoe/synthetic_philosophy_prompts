answer: |-
  # The Myth of the Latent Reward: Why Inverse Reinforcement Learning is Re-description, Not Inference

  Inverse Reinforcement Learning (IRL) is sold as a discovery mechanism. The promise is that by observing a human's trajectories through an environment, we can invert the decision process to uncover the hidden reward function that caused it. This is the machine learning analogue to revealed preference theory in economics: choice reveals value. If we can recover the reward, we can align the machine with the human, aggregate welfare across users, or price risks in human terms.

  The standard philosophical comfort regarding IRL is that the underdetermination of the reward function is benign. Ng, Harada, and Russell (1999) showed that rewards are unique only up to potential-based shaping. Since shaping-equivalent rewards admit the same optimal policies, the standard line is that the ambiguity doesn't matter.

  This comfort is misplaced. It relies on a category error between *behavioral reproduction* and *value alignment*. Furthermore, the assumption of demonstrator optimality forces a dilemma between fitting bias or importing normative assumptions. When we press on these points, the claim that IRL "infers preferences" collapses. IRL does not uncover a latent mental variable; it imposes a rationalizing structure on behavior to make it legible to an agent. IRL is not inference; it is **re-description**.

  ### The Shaping Trap: Ordinal Behavior vs. Cardinal Value

  The claim that shaping equivalence renders reward ambiguity benign holds only if the sole objective of IRL is behavioral cloning—getting the robot to move exactly like the human. In that narrow slice, the specific reward function is indeed irrelevant; any member of the shaping-equivalence class will reproduce the observed actions.

  However, IRL is rarely used merely for imitation. It is used to evaluate counterfactuals, aggregate utilities, and assess risk. In these contexts, the specific potential function $\Phi(s)$ matters profoundly.

  Potential-based shaping transforms a reward function $R$ into $R'$ such that $R'(s, a, s') = R(s, a, s') + \gamma \Phi(s') - \Phi(s)$. This transformation preserves the *ordinal* ranking of actions within a state under an optimal policy. The term $\Phi(s)$ is constant for all actions available in state $s$, so it cancels out during action selection. However, it does not cancel out when comparing the *value* of different states, or when evaluating non-optimal policies.

  Consider two uses of IRL that break the "benign ambiguity" assumption:
  1.  **Welfare Aggregation:** If we sum the recovered rewards of multiple users to maximize social welfare, the choice of $\Phi$ changes the sum. User A might have a reward function $R_A$ and User B might have $R_B$. If we arbitrarily shift $R_A$ by a potential $\Phi$, we change the weight of User A's utility relative to User B's without changing User A's behavior. The "interpersonal comparison of utility" becomes entirely dependent on the arbitrary gauge fixing of the potential function.
  2.  **Risk and Counterfactuals:** If we use the recovered reward to evaluate a *new* policy (one the human did not demonstrate), the shaping term no longer cancels. The value of a state $V(s)$ shifts by $\Phi(s)$. If the robot must choose between two safe paths that the human never took, the shaping potential determines which path is "better."

  If the reward were a genuine physical property being inferred—like mass or charge—such arbitrary shifts would not be possible without changing the observable dynamics. The fact that we can shift the cardinal values of states without altering the observed behavior proves that the reward function is not a unique causal antecedent of the behavior. It is a coordinate system. To treat it as a discovered truth is to confuse the map for the territory.

  ### The Rationality Gap: Bias vs. Idealization

  The second pressure point is the assumption of optimality. Revealed preference theory assumes the agent is rational. Humans are not. We suffer from present bias, akrasia, and framing effects.

  If we feed raw human trajectories into an IRL algorithm that assumes optimality, the algorithm attributes the bias to the reward. If a human procrastinates, the IRL agent infers that the human *values* procrastination. The robot then becomes an enabler of pathology, optimizing for the very biases the human wishes to overcome. This is the "preference elicitation" failure mode: it infers descriptive preferences (what moves you) rather than normative preferences (what you endorse).

  To fix this, proponents suggest modeling the human as having a "true" reward obscured by noise or planning errors. We posit an idealized rationality underneath the mess. But this move severs the link to the data. If the demonstrations show $X$, but we infer reward $Y$ because we assume the human was "biased," the evidence for $Y$ does not come from the trajectories. It comes from the prior assumption about what counts as rational.

  This is no longer inference from behavior. It is **preference attribution**. We are not reading the want off the choice; we are correcting the choice to match a theory of the want. The "evidence" is now circular: we recover the reward that *would* make the human look rational, by assuming they *are* rational.

  This creates a dilemma. Either IRL fits the bias (and fails alignment) or it imports a normative model of rationality (and fails empiricism). In neither case is it "inferring" a pre-existing preference in the scientific sense. It is constructing a model of the human that serves the designer's purpose.

  ### The Verdict: Re-description, Not Inference

  We must now adjudicate the core controversy: Is IRL inferring preferences or re-describing behavior?

  **Inference** implies discovering a latent causal structure that exists independently of the model. If preferences were like genes, we could sequence them; different labs would converge on the same sequence given enough data.
  **Re-description** implies imposing a vocabulary to make a system intelligible. If preferences are like "centers of gravity," they are useful calculational tools that do not exist as discrete objects inside the body.

  IRL is **re-description**.

  For IRL to be inference, the reward function would need to be uniquely determined by the behavior (modulo measurement noise). As shown with potential-based shaping, it is not. The reward function is underdetermined by the data. The specific reward function selected is a function of the algorithm's inductive biases, the choice of basis functions, and the regularization terms.

  Furthermore, for IRL to be inference, the "preference" would need to be a stable causal mechanism. As shown with the bias problem, human behavior is not generated by a stable reward function maximized via rational planning. It is generated by a messy heap of heuristics, impulses, and social conditioning. There is no single $R(s)$ in the brain waiting to be found.

  Therefore, when an IRL algorithm outputs a reward function, it is not reporting a discovery. It is offering a **rationalizing narrative**. It says: "If the human were a rational agent, *this* is what they would have to want to do what they did." This is Dennett's Intentional Stance operationalized. It is a tool for prediction and coordination, not a microscope for mental states.

  This is not merely a verbal dispute. If we treat IRL as inference, we grant its outputs an ontological authority they do not possess. We treat the recovered reward as "The Human's True Will," which licenses the robot to override explicit commands in favor of the "inferred" reward. If we treat it as re-description, we understand the reward as a model-relative construct that is valid only within the context of the specific IRL formulation used.

  ### The Strongest Objection: Pragmatic Realism

  The strongest objection to this verdict is **Pragmatic Realism**.

  *Objection:* "You are drawing a distinction without a difference. If the IRL agent successfully predicts my behavior, anticipates my needs, and helps me achieve my goals better than I could alone, isn't the reward function 'real' enough? In science, we accept entities like 'electrons' or 'utility' not because we can touch them, but because positing them makes the theory work. If the IRL reward function allows for successful alignment, it is functionally equivalent to a true preference. Insisting it is 'just re-description' is pedantic and ignores the success of the alignment."

  *Reply:* The objection fails because it conflates *predictive success* with *ontological uniqueness*. Ptolemaic epicycles predicted planetary motion with high accuracy. That did not make the epicycles real, nor did it make the geocentric model safe to build upon for deeper physics.

  The distinction matters critically for **safety and aggregation**.
  If the reward is "real" (inference), then aggregating rewards across users is a matter of summing objective quantities. If the reward is a "re-description" (model-relative), aggregating them is like adding temperatures measured in Fahrenheit to lengths measured in meters. It is a category error.

  The Pragmatic Realist says, "It works." But it works only in the distribution of the training data. When we deploy IRL agents in novel situations (the counterfactuals mentioned earlier), the arbitrary choices in the re-description (the potential function, the rationality model) dictate the agent's behavior. If we think we are deferring to the human's "true preference," we are actually deferring to the mathematician's choice of regularization.

  Treating IRL as re-description forces us to acknowledge that the "alignment" is a negotiation between the human's behavior and the designer's model of rationality. It prevents the dangerous reification of the reward function. We cannot shrug and say "the math decided." We must admit that *we* decided what counts as a preference, and the IRL algorithm merely executed that definition.

  ### Conclusion

  IRL cannot infer preferences because there is no unique preference to infer. The behavioral data supports an infinite equivalence class of rewards, and the human demonstrator is not optimizing any single reward function to begin with.

  Therefore, IRL is not a mechanism for uncovering hidden values. It is a mechanism for **constructing a legible interface** between human messiness and machine optimization. It re-describes behavior in the vocabulary of goal-directedness so that the machine can coordinate with us.

  We must stop treating the output of IRL as a discovery of "what the human wants." It is a proposal for "how we can model the human." The difference is the difference between alignment as submission to a hidden master, and alignment as the collaborative construction of a shared objective. The latter is the only one that survives contact with reality.
