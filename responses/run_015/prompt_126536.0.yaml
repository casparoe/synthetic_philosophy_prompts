      *   *Narrative Construction:* "Source is spinning the story," "Press release vs. reality," "Anonymous sourcing with heavy caveats." The source is rewriting history to look good.
      *   *Middle Positions:* "Corroborated testimony," "Source needs fact-checking," "Human memory is fallible."
