      *   *Narrative Construction (Confabulation/Interpretivist):* We don't see the gears turning. We see the output and invent a story to explain it (Nisbett & Wilson, Dennett). It's post-hoc rationalization.
      *   *Middle Positions (Perceptual Model/Transparency):* Introspection is like perception—it can be wrong, but it's not *just* made up. It's a skill that can be trained (Eric Schwitzgebel, Titchener).

  3.  **Translate to Journalistic Vocabulary:**
