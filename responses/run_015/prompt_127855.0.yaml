answer: |-
  Here are ten interview questions designed for a podcast setting. They are conversational but rigorous, structured to prevent Dr. K from retreating into jargon. Each includes a "moderator note" on what to listen for and a specific follow-up punch if she tries to deflect.

  ### 1. The "Grain of the Wood" Question
  **Question:** "Dr. K, most historians treat *The Computer and the Brain* as the founding document of computationalism—the moment we decided the mind *is* software. You're arguing it's actually a warning label. When you read von Neumann comparing neurons to relay contacts, are you saying he was speaking metaphorically to his engineering audience, or do you think he genuinely believed the math wouldn't hold up?"

  *   **Why ask this:** It forces her to stake a claim on von Neumann's intent early. Is he being pedagogical or philosophical?
  *   **If she pivots:** If she says, "He was using the language of the time to critique the language of the time," hit her with: "But he died before he could finish the manuscript. Are we building a whole philosophical framework on a set of unfinished notes that look, on their face, to say the exact opposite of what you're claiming?"

  ### 2. The "Digit" in the Room
  **Question:** "Von Neumann explicitly talks about the 'digital' parts of the nervous system, specifically the all-or-nothing pulse. If he saw the brain as fundamentally non-digital, why lean so heavily on the one feature that looks most like a binary bit? Isn't that the wedge his successors used to open the door to AI?"

  *   **Why ask this:** This targets the textual evidence. It's hard to argue someone is anti-digital when they spend chapters discussing digital-like pulses.
  *   **If she pivots:** If she argues, "He highlights it to show its limitations," follow up with: "Okay, but if the limitation is the point, why does he spend so much time trying to map the correspondence? It feels like you're arguing he built a bridge just to tell us not to cross it."

  ### 3. The Neuromorphic Challenge (Part 1)
  **Question:** "I want to bring this to the present. We now have neuromorphic chips and analog neural nets that mimic those continuous dynamics you're describing. They don't run on standard clock cycles; they use physical resistance and voltage to simulate synaptic weight. Doesn't the existence of this hardware blur the line you're drawing? Or are these just 'analog costumes' on a digital body?"

  *   **Why ask this:** This is your first required topic. It tests whether her distinction is about *physics* or *logic*.
  *   **If she pivots:** (See Question 4).

  ### 4. The Neuromorphic Challenge (Part 2 - The Punch)
  **Question:** "I anticipate you might say those chips are still built on discrete transistors, so they're just simulating continuity. But if the *behavior* of the system is continuous and error-tolerant, does the underlying silicon logic matter? If a duck swims like an analog duck, is it really a digital duck just because it's made of atoms?"

  *   **Why ask this:** This is the follow-up to Q3. It prevents her from hiding behind the "it's all discrete at the quantum level" defense. It forces her to define where the "digital" cut-off actually is.
  *   **If she pivots:** If she insists, "Simulation isn't duplication," press: "Then are you arguing that cognition is substrate-dependent in a way that makes it impossible to engineer? Because that sounds less like computer science and more like vitalism."

  ### 5. The Conway's Life Trap (Part 1)
  **Question:** "Let's talk about self-replication. You argue biological replication needs continuous feedback loops that digital architectures can't handle. But John Conway's *Game of Life* is purely discrete, grid-based, and digital. It creates self-replicating patterns. What does von Neumann's universal constructor have that Conway's glider gun doesn't?"

  *   **Why ask this:** This is your second required topic. *Life* is the standard counter-example to the claim that digital systems can't replicate.
  *   **If she pivots:** (See Question 6).

  ### 6. The Conway's Life Trap (Part 2 - The Punch)
  **Question:** "I suspect you'll say *Life* lacks the error correction or adaptive feedback of biology. But isn't error correction just a computational problem? We have digital error-correcting codes. Is the difference you're seeing a fundamental limit of digital logic, or just an engineering hurdle we haven't cleared yet?"

  *   **Why ask this:** This tightens the screw. If it's just an engineering hurdle, her philosophical claim collapses. If it's a fundamental limit, she needs to prove why digital logic *cannot* encode feedback, not just that it *doesn't yet*.
  *   **If she pivots:** If she says, "Digital error correction is brittle," ask: "Brittle compared to what? Because biology fails too. If the difference is just degree of robustness, why does that warrant a different ontological category?"

  ### 7. The Functionalist Dilemma (Part 1)
  **Question:** "This leads me to functionalism. If the brain's logic is genuinely different in kind from Turing computation, does your reading of von Neumann collapse into biological naturalism? In other words, is the mind something that only meat can do?"

  *   **Why ask this:** This is your third required topic. It forces her to define the boundaries of "mind."
  *   **If she pivots:** (See Question 8).

  ### 8. The Functionalist Dilemma (Part 2 - The Punch)
  **Question:** "But if we could build an artificial mind on an analog substrate—say, a fluidic computer or a chemical network—would you call that 'computation'? If yes, haven't you just expanded the definition of computation to swallow your objection? If no, what word are we using for 'processing information' that isn't computation?"

  *   **Why ask this:** This traps her on terminology. Either computation is broader than she admits, or she has to defend a mysterious non-computational processing method.
  *   **If she pivots:** If she says, "It's a different kind of causality," press: "Help the students out: If I can predict the output based on the input, isn't that a function? And if it's a function, isn't it computable?"

  ### 9. The "70-Year Mistake" Question
  **Question:** "If your reading is correct, the entire field of cognitive science has been misreading von Neumann for seven decades. Why did everyone get it wrong? Was it because the digital revolution was just too seductive, or is there something in the text that actively invites this misunderstanding?"

  *   **Why ask this:** It addresses the historical consensus. It makes her account for the sociological reality of her niche position.
  *   **If she pivots:** If she says, "People read what they want to see," reply: "But these are some of the brightest minds of the 20th century. Are we to believe they all missed the nuance, or is it possible von Neumann himself was ambivalent?"

  ### 10. The Student Advice Question
  **Question:** "For the students reading this paper series: if they accept your argument, what changes on Monday morning? Does this mean we should stop building LLMs and start building fluid dynamics machines? Or is this purely a philosophical correction with no engineering consequence?"

  *   **Why ask this:** It grounds the high-level philosophy in practical reality. It asks for the "so what?"
  *   **If she pivots:** If she says, "It changes how we conceptualize the goal," push: "Conceptualization is great, but does it change the *method*? Because if the method stays the same, I worry the distinction is purely semantic."
