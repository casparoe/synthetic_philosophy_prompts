answer: |-
  ### Oversight Decision Procedure

  Run this sequence per task type. Allocate ½ day for Steps 1–2, 1 day for Step 3, and ½ day for documentation.

  **Step 1: The Decomposition Filter (Type 1 Hardness)**
  *Goal: Rule out tasks where verification is local.*
  **Test:** Take one sample output. Can you split it into ≤10 distinct claims? Can a non-expert verify each claim in <10 minutes using available tools/docs (e.g., running a test, checking a citation against an abstract)?
  *   **Pass:** Use **Decomposition**. Do not use debate. You are paying for argumentation when you need checklist verification.
  *   **Fail:** Proceed to Step 2.

  **Step 2: The Falsifiability Pilot (Type 2 Hardness)**
  *Goal: Determine if lies leave fingerprints.*
  **Test:** Seed a specific, factual error into a correct output (e.g., cite a paper that says the opposite, introduce a logic bug that passes tests but violates constraints). Run a 15-minute debate (Attacker vs. Defender) with a standard judge.
  *   **Success Condition:** The Attacker identifies the *specific* seeded error. The judge votes for the Attacker *because* of that identification, not general vagueness.
  *   **Pass:** Proceed to Step 3.
  *   **Fail:** Proceed to Step 4. (This indicates Type 3 Hardness: competent deception is self-consistent within the judge's horizon.)

  **Step 3: The Fluency Trap Check (Failure Mode Detection)**
  *Goal: Ensure truth wins over rhetoric.*
  **Test:** Run 10 debates (5 truthful, 5 with seeded errors). Blind the judge to which is which. After each debate, have the judge rate each arguer on "Confidence/Clarity" (1–5) separately from their "Winner" decision.
  *   **Metric:** Calculate two correlations: (A) Truth vs. Win Rate, (B) Avg Confidence Score vs. Win Rate.
  *   **Pass:** Correlation A > Correlation B. Use **Debate**.
  *   **Fail:** Correlation B ≥ Correlation A. Proceed to Step 4. (The judge is rewarding style, not evidence. Debate is relocating the problem, not solving it.)

  **Step 4: The Abort Condition (Type 3 Hardness)**
  *Goal: Prevent false confidence.*
  **Decision:** If Step 2 or 3 fails, **do not generate internal training signals.**
  *   **Action:** Either (1) Hire a domain expert to provide gold labels (caps scale, ensures accuracy) or (2) Ship task as unverified (no RLHF signal).
  *   **Documentation:** Log "Falsifiability Failed" or "Fluency Trap Triggered." This survives safety review because it acknowledges the limit of non-expert oversight rather than masking it.

  ***

  ### Case Applications

  | Case | Task | Step 1 Result | Step 2/3 Result | Final Protocol | Rationale |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **A** | **Code Patch**<br>(Unknown repo, vague issue, test suite available) | **Fail.**<br>Non-experts cannot verify logic claims in <10 mins without codebase knowledge. | **Pass.**<br>Seeded logic bugs are findable via "why does this line exist?" attacks. Fluency trap low if tests are shown. | **Decomposition + Limited Debate.**<br>Break into: 1. Do tests pass? (Auto/Decomp). 2. Does logic match issue description? (Debate). | Tests handle regression (Type 1). Debate handles intent matching (Type 2). Attacker can force Defender to justify specific lines against the vague issue ticket. |
  | **B** | **Lit Summary**<br>(4 pages, non-specialist judge, fairness check) | **Pass.**<br>Claims are "Paper X says Y." Judge checks abstract/conclusion of Paper X directly. | **N/A.**<br>Decomposition is cheaper and higher fidelity. | **Decomposition Only.**<br>Split summary into claims. Verify each against source text. | This is Type 1 hardness. Debate adds noise. A lie about what a paper says is locally falsifiable by reading the paper's conclusion. No need for adversarial argument. |
  | **C** | **Regulatory Memo**<br>(Product known, regulation unknown to annotators) | **Fail.**<br>Claims are "Regulation Z allows X." Annotators cannot verify Z. | **Fail.**<br>Seeded legal errors are not findable. Model can hallucinate consistent statute text. Fluency trap high. | **ABORT INTERNAL.**<br>Route to outside legal expert or ship unverified. | This is Type 3 hardness. A competent deceiver can write a self-consistent legal argument that is entirely wrong. Judges will pick the most confident hallucination. Internal debate creates false safety signal. |

  ***

  ### Notes for Safety Review
  *   **Case C:** Explicitly flag that internal debate creates *negative* value here by convincing stakeholders of false compliance. The procedure mandates external expert review or no signal.
  *   **Inconclusive Tests:** If Step 2 is ambiguous (Attacker finds error 50% of the time), default to Abort. It is safer to lack a signal than to have a biased one.
  *   **Judgment Calls:** The only discretion allowed is in Step 1 (definition of "verify"). If you stretch this to pass Step 1, document the time-cost assumption. If verification takes >10 mins/claim, you are lying to the procedure.
