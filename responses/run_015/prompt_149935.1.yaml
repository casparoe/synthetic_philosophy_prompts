      *   *The Snag:* The conditional probabilities $P_{old}(H|E_i)$ in the JC formula rely on the semantic content of $E_i$. If the evidence changes the semantic content of $E_i$ (e.g., what "Reading 4.2" implies about the world), then $P_{old}(H|E_i)$ is ill-defined or unstable.

