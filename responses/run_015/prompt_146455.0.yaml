  defend your position. tell me exactly where my Alex example cheats, misdescribes the mental architecture, or smuggles in non-doxastic attitudes. argue for real.

  also please say how confident you are in your reply, and point to the specific part you're least sure about — maybe the boundary between belief and some other attitude, maybe the empirical claim about mental compartments.

