answer: |-
  Here is the draft material for your comprehensive exam committee.

  ### Part 1: The Exam Question

  **Practical Ethics: Comprehensive Examination**
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. Citations, case law, and jurisdiction-specific doctrine are neither required nor permitted. Focus on normative justification.

  **Question:**

  Consider the case of M. At 42, possessing full capacity, M. executes an advance directive refusing life-prolonging treatment should she develop severe dementia. M. includes a **Non-Accommodation Clause (NAC)**: she explicitly anticipates that her demented future self will express contentment and request life-prolonging treatment. The NAC instructs surrogates to treat any such request as a symptom of pathology, assigning it zero weight, regardless of how coherent or reasoned it appears at the time.

  At 71, M. has moderately severe Alzheimer's. She meets the clinical conditions specified in the directive. However, she presents as content and articulates reasoned arguments for continuing life, specifically repudiating her earlier fears of dependence. She requests the treatment the directive forbids.

  In a unified essay, address the following:

  1.  **The Precommitment Paradox:** Does the NAC render the directive self-undermining by disabling the mechanism for correcting errors in self-government, or is this insulation a necessary feature of any robust precommitment (analogous to a Ulysses contract)?
  2.  **Iteration:** M. could have anticipated her later self arguing that *this specific case* falls outside the NAC's intent, and added a clause pre-empting that exception. Does the possibility of indefinite iteration change the normative force of the directive?
  3.  **Evidential Asymmetry:** The NAC treats later agreement as confirmation of authority but later disagreement as noise, despite both states being equally subject to pathological influence. Justify this asymmetry. If the evidence regarding the genuineness of M.'s revision is irreducibly probabilistic, what ought a surrogate to do?
  4.  **Conditions of Authority:** What conditions (e.g., stability, information, freedom from manipulation) must an earlier act satisfy to bind a later self? Are these additive constraints on a binary authority, or does this case suggest authority is graded and defeasible?

  ***

  ### Part 2: Model Answer (Approx. 800 words)

  The Non-Accommodation Clause (NAC) intensifies the standard tension in advance directives by explicitly severing the link between current competence and authoritative voice. To evaluate it, we must distinguish between the *authority* of the earlier self and the *well-being* of the later self.

  Regarding the **Precommitment Paradox**, the NAC does appear self-undermining if we view autonomy as a continuous capacity for responsive self-governance. By instructing surrogates to ignore the later self's testimony about her own values, the earlier self treats the later self not as a moral agent but as a vessel of pathology. However, this is precisely the function of a Ulysses contract in psychiatry: to bind the hands of a future self predicted to be compromised by a specific distortion (e.g., mania or, here, dementia-induced contentment). The distinction lies in the nature of the distortion. In psychiatry, the distortion is usually episodic and the patient acknowledges the need for binding upon recovery. In dementia, the "recovery" never comes. Therefore, the NAC is not self-undermining if one accepts that the earlier self's values constitute the person's critical interests, which survive the loss of experiential interests. The insulation is a feature, not a bug, provided the earlier decision was sufficiently robust.

  This leads to **Iteration**. If M. can pre-empt the later self's objection, she can also pre-empt the later self's objection to the pre-emption. Infinite iteration suggests a logical regress, but normatively, it adds nothing after the first clear stipulation. The force of the directive does not increase with every added layer of "no really, I mean it." However, iteration highlights a risk: the earlier self becomes a tyrant over a future self she cannot consult. If the earlier self can immunize her directive against *any* future evidence of value change, she claims infallibility. This suggests that iteration does not strengthen authority but rather exposes the dogmatism of the earlier self. A single, clear NAC is sufficient; infinite iteration signals an anxiety that undermines the rationality of the initial choice.

  The **Evidential Asymmetry** is the most difficult hurdle. Treating agreement as signal and disagreement as noise seems epistemically arbitrary if both states are biologically mediated. The justification rests on a prior normative commitment: we privilege the values formed under conditions of full cognitive capacity over those formed under degradation, assuming the degradation affects valuation mechanisms. We assume the 42-year-old's fear of dependence is a "true" value, while the 71-year-old's comfort with it is a "lesion." However, under irreducible uncertainty—where we cannot distinguish genuine value revision from pathology—the surrogate faces a risk of moral error. Honoring the NAC risks violating the current self's autonomy; ignoring it risks violating the earlier self's precedent autonomy. Under uncertainty, the surrogate should default to the NAC only if the earlier self's decision survived serious reconsideration and was highly specific. If the evidence is probabilistic, the presumption should shift toward preserving life (the status quo) unless the earlier directive was exceptionally robust, because the cost of erroneous death is higher than the cost of erroneous life.

  Finally, regarding **Conditions of Authority**, this case suggests authority is not a binary switch flipped by a signature. If authority were binary, the NAC would be absolute. But the intuitive discomfort with the NAC suggests authority is graded and defeasible. Conditions like stability over time, rich information, and freedom from transient affect are not merely hurdles to clear; they determine the *weight* of the earlier self's command. A directive written after decades of reflection binds more tightly than one written in a moment of fear. Consequently, the earlier act binds only insofar as it demonstrates a stable practical identity. If the later self's revision appears integrated and reasoned, it acts as a defeater, reducing the authority of the earlier directive. The NAC attempts to block this defeater, but it cannot block the normative reality that authority diminishes as the distance between the two selves grows.

  Therefore, the surrogate should honor the NAC only if the earlier decision was deeply entrenched and stable. If the later self's reasons are coherent and reflect a plausible alternative conception of the good, the NAC should be treated as advisory rather than absolute. Authority is diachronic negotiation, not monologic command.

  ***

  ### Part 3: Marking Scheme

  **Total Marks: 100 (5 Criteria x 20 Marks)**

  | Criterion | Must-Hit Move | Characteristic Failure Mode (How a good student gets it wrong) |
  | :--- | :--- | :--- |
  | **1. Precommitment & Ulysses** | Distinguishes between self-undermining governance and necessary insulation; explicitly engages the Ulysses analogy regarding the *reversibility* of the condition. | Treats the Ulysses contract as a perfect analogy without noting the lack of recovery in dementia, or dismisses the NAC as purely paternalistic without addressing the precommitment justification. |
  | **2. Iteration** | Argues that iteration does not add normative force but exposes the dogmatism/tyranny of the earlier self; identifies the regress as logically possible but normatively redundant. | Claims iteration strengthens the directive indefinitely, or dismisses iteration as a logical puzzle without normative implications for authority. |
  | **3. Evidential Asymmetry** | Justifies the asymmetry via a normative privileging of capacity conditions, *and* provides a decision rule for irreducible uncertainty (e.g., risk weighting). | Asserts the asymmetry is obvious/justified without argument, or fails to offer a concrete course of action for the surrogate under probabilistic uncertainty. |
  | **4. Conditions of Authority** | Rejects the binary "switch" model; argues for authority as graded/defeasible based on stability/info, or defends the binary model with strong reasons why defeasibility fails. | Lists conditions (info, stability) as a checklist without explaining their structural relationship to authority (additive vs. constitutive). |
  | **5. Synthesis/Conclusion** | Provides a determinate recommendation for the surrogate that coheres with the arguments made in 1-4 (e.g., if authority is graded, the NAC is not absolute). | Concludes by deferring to "legal standards" or "hospital policy," or offers a conclusion that contradicts the philosophical analysis provided in the body. |

  ***

  ### Part 4: Grading Guidelines

  **Distinguishing A from B Scripts:**
  A **B-script** will correctly identify the tension between precedent autonomy and current well-being (Dworkin vs. Dresser) and apply the standard "critical vs. experiential interests" framework. It will answer the sub-questions but treat them as separate islands.
  An **A-script** will recognize that the NAC *changes* the standard dialectic. It will treat the four sub-questions as interconnected structural problems (e.g., using the iteration point to undermine the binary authority model). It will engage with the *epistemic* implications of the NAC, not just the metaphysical ones.

  **Negative Moves (Active Mark Deductions):**
  *   **Collapsing into Identity:** Settling the question by asserting the later self is "not the same person" (metaphysical evasion of the normative problem).
  *   **Dogmatic Absolutism:** Asserting the earlier self's authority is absolute simply because "it was written down," ignoring the specific philosophical challenges of the NAC.
  *   **Legalism:** Deferring to jurisdiction-specific laws or "standard medical practice" rather than normative ethics.
  *   **Ignoring the Clause:** Answering as if this were a standard advance directive case without the Non-Accommodation Clause.

  ***

  ### Part 5: Gap Analysis & Recommendations

  There are two points in your case description that are currently under-specified, allowing candidates to evade the crux:

  1.  **The Competence of the Later Self:** You describe M. at 71 as having "moderately severe Alzheimer's" but articulating reasons. A candidate could wriggle out by arguing that *any* dementia renders the later self legally/medically incompetent, making the NAC redundant.
      *   **Fix:** Add to the prompt: *"Assume for the sake of argument that M. at 71 possesses sufficient cognitive capacity to form and articulate a consistent preference, but that her condition is precisely the one the directive was meant to cover."* This forces them to address the *authority* conflict, not a *capacity* threshold.
  2.  **Harm to Others:** A candidate could argue the directive should be ignored because keeping M. alive burdens her family/resources (best interests of others).
      *   **Fix:** Add to the prompt: *"Assume the treatment is low-cost and M.'s care imposes no significant burden on others; the question is strictly about the authority over her own life."*

  **Recommendation:** Incorporate these two stipulations into the case description in Part 1 to ensure the candidates cannot bypass the philosophical core of the NAC problem.
