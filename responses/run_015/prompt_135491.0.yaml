      *   **Point 3: The Nature of the "Self" in the Argument.** Strawson assumes a substantive self. If the self is just the structure, who is responsible?
      *   **Point 4: Compatibilist Concessions.** Address the third question. Yes, many compatibilists accept BA but reject the requirement for *Ultimate* Responsibility. Distinguish between types of responsibility (Attributability vs. Accountability).
