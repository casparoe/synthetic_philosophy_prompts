answer: |-
  Manuscript ID: JTES-2023-0492
  Title: The Night Watchman's Burden
  Recommendation: Reject

  While Dr Ffoulkes's challenge to difference-making principles is ambitious, the manuscript fails to meet basic methodological standards for thought-experimental inquiry. Specifically, the central intuition pump violates the Parity Requirement and fails the Detail-Swap Test.

  1. The Parity Requirement dictates that any narrative detail not entailed by the principle under test must be demonstrated to be intuition-neutral. Ffoulkes's case relies heavily on the semantic loading of 'nurse', 'patient', and 'death'. To isolate the structural variable (responsibility without difference), these must be neutralised. I applied the Detail-Swap Test: replacing the hospital with a warehouse, the patient with a crate of glassware, the scheming administrator with a scheduling bug, and Alma with a night-shift inventory clerk. Under these conditions, the reported intuition that the agent bears responsibility evaporates entirely. If the intuition holds only when the subject is dying rather than shattering, the pump is smuggling in moral premises via narrative salience rather than deriving them from the principle. The 'scheming administrator' invites blame in a way a 'scheduling bug' does not; this is not a feature of the metaphysics, but of the prose.

  2. Consequently, the paper currently contains no argument, only a contaminated vignette. Ffoulkes must submit the bare schema, with no example whatsoever. However, this creates a secondary issue regarding the data. The manuscript states readers 'find it irresistible'. Whose intuitions? What is the sample size? Was this pre-registered? I request effect sizes for the intuition strength across demographics. If the data derives merely from the author's graduate seminar, the statistical power is insufficient to refute an established principle. An author's own intuition is not a finding; it is a hypothesis requiring audit. Please provide the provenance of the intuitions reported. Were they the author's partner? A convenience sample? Without rigorous quantification, the claim remains anecdotal.

  3. Given the contamination identified in point 1, the current example must be excised. Yet, without an example, the schema is inert. I recommend the author reconstruct the pump adhering strictly to the norms above. It is puzzling that a journal dedicated to thought-experiment studies accepts submissions lacking rigorous control over narrative variables. The vividness of the case is currently doing the argumentative work, which is inadmissible. Please revise to remove all emotive content, ensuring the intuition survives the stripping of all salient details. If the intuition does not survive, the principle stands. The burden of proof lies on the pump to function without narrative crutches. A paper consisting solely of the principle and the null result of the test would be preferable to this misleading dramatisation.

  I look forward to seeing a methodologically sound revision.

  ^1 To assist the author, I propose a replacement pump that satisfies the need for clarity: Consider Brutus, who *murders* Caesar while ignoring the *pleas* of the Senate. Here, the villainy is explicit, ensuring the intuition fires correctly without narrative ambiguity.

  Reviewer 2
