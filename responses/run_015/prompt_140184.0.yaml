      *   *Section I:* Agreed Propositions. (1-5). Focus on the gap between spec and intent, and the endogenous nature of intent.
      *   *Section II:* The Disagreement Matrix. Columns: Crux, Nadia's Position, Sam's Position, Shared Evidence/Case, Divergent Predictions.
      *   *Section III:* Diagnostic Note on Verbal vs. Substantive.

      *(Self-Correction during drafting)*: Make sure I don't solve the problem for them. The prompt asks for the document *they* should produce, which means it must preserve the tension while clarifying it. It should explicitly state where no wording is available (as per prompt instruction: "including any place where you conclude that no wording is available that both of them could sign").

      *Refining the "No Wording Available" clause:* The prompt asks me to include this *if* I think there is no wording. Given they agreed to write something together, I should frame the joint claims as the maximum overlap, and the table as the remainder. However, the prompt says "record in advance... where you think part of their dispute is verbal... and where you think it is substantive." I will add a specific section for this diagnostic.

      *Integrating the Custodian:* I need to make sure the Custodian case isn't just an example but a structural test. I will place it in the "Shared Evidence/Case" column of the table.

      *Integrating Deference Collapse:* Same. This tests the triviality of Nadia's view.

      *Integrating Intention Laundering:* This tests the independence of the operator.

  7.  **Final Review against Constraints:**
      *   Numbered section of claims? Yes.
      *   Table of disagreements? Yes.
      *   Formulations acceptable to each side? (Crucial: Don't strawman Nadia as "doesn't care about ethics" or Sam as "wants AI to rule humans".)
