answer: |-
  Here's the scenario: Alex is a hospital facilities manager who skipped a crucial generator safety check to meet a budget deadline, causing a brief outage that complicated a surgery, but the error gets buried in paperwork and Alex faces no discipline. Now, Alex is up for a promotion to Regional Director, which would give them even more oversight power, yet earlier in life Alex survived a rare, painful chronic illness and lost their entire family in a flood, suffering immensely without any clear cause.

  So here's how the two theories split on this. The cross-life karma theorist says Alex actually *does* deserve the promotion. Under the "moral escrow" model, the immense suffering Alex endured earlier in life wasn't just bad luck; it was payment for debts incurred in a prior existence. Because that ledger is already balanced, Alex has built up a surplus of merit that allows them to withdraw good fortune (the promotion) even while carrying a small, new debt from the negligence. The one-life desert theorist, obviously, says Alex absolutely does not deserve it. From their view, the earlier suffering is just tragic chance, not moral currency, so the only thing on the books is the recent negligence. Since Alex hasn't made amends or suffered consequences for harming the patient, giving them more power is a moral failure of the hospital system.

  The feature doing all the heavy lifting here is obviously the **cross-life escrow**. It's the only thing that allows past suffering to offset current wrongdoing. If you remove that feature—if you say accounts reset at birth—the whole thing collapses back into a normal punishment case. The earlier suffering becomes irrelevant noise, and Alex is just a negligent employee who got lucky, meaning the promotion is unjust until they pay their dues in *this* life.

  The one-life theorist would attack this on two levels. The obvious move is to just deny the metaphysics: there's no evidence for prior lives, so the escrow account doesn't exist. But the deeper problem is about identity. Even if past lives were real, why should *this* Alex get credit for suffering endured by someone they don't remember being? Moral responsibility usually requires psychological continuity. If the link is broken, the "escrow" looks less like justice and more like punishing or rewarding strangers, which undermines the whole point of desert.
