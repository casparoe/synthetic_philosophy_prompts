answer: |-
  You are basically right, and your intuition is actually more aligned with how modern Bayesians solve this problem than your roommate's rigid stance is. However, there is a specific technical hurdle you need to clear to fully win the argument.

  You are intuitively grasping what is known as the **Garber-Jeffrey solution** (named after Daniel Garber and Richard Jeffrey), while your roommate is defending **Strict Conditionalization under Logical Omniscience**.

  Here is the breakdown of why you're on solid ground, where the actual coherence constraint lies, and how to explain it to your roommate.

  ### 1. The Roommate's Trap: Logical Omniscience
  Your roommate is correct *only* if you assume the Bayesian agent is **logically omniscient**.
  In standard, textbook Bayesianism, agents are assumed to know all logical consequences of their beliefs instantly.
  *   If you believe Theory $H$...
  *   And $H$ logically entails Evidence $E$...
  *   A logically omniscient agent *already knows* $E$ is true given $H$ the moment they adopt $H$.

  If you assume logical omniscience, then learning that "GR predicts Mercury" provides no new information, because you should have already known that mathematical fact. In that rigid, idealized framework, your roommate wins: $P(E)=1$, so the likelihood ratio is 1, and no confirmation happens.

  But humans aren't logically omniscient. We learn logical and mathematical connections over time.

  ### 2. Your Intuition: Updating on the Relation, Not the Evidence
  You asked: *"Why can't I just update my t2 credence in GR based on the predictive match, without pretending I never knew E?"*

  This is the winning move. You do not update on $E$ (Mercury's orbit). You already knew $E$ at $t_1$, so $P(E)=1$.
  Instead, at $t_2$, you update on the proposition **$H \to E$** (The hypothesis that GR entails Mercury's orbit).

  *   **At $t_1$:** You know $E$. You have some credence in $H$. You are *uncertain* whether $H$ entails $E$.
  *   **At $t_2$:** You learn the mathematical derivation that $H \vdash E$.

  When you conditionalize on the new information ($H \vdash E$), your credence in $H$ goes up, even though $P(E)$ stays at 1. This preserves the diachronic nature of credence without requiring you to "fake" ignorance of $E$.

  ### 3. Is "Counterfactual Prior Resetting" Cheating?
  You mentioned you brought up "counterfactual prior resetting." To be precise, there are two main solutions to the Old Evidence problem, and you need to distinguish them to avoid your roommate's "cheating" objection:

  1.  **Counterfactual Priors (Howson's Solution):** This asks, "What would your prior have been *before* you knew $E$?" Your roommate called this cheating. They have a point—it's highly subjective. It relies on a fictional history of your beliefs that never actually happened.
  2.  **Learning the Implication (Garber's Solution):** This is what you are arguing for now. It doesn't ask you to pretend you didn't know $E$. It asks you to admit that you didn't know the *logical connection* between $H$ and $E$ until $t_2$. This is **not cheating**; it is a factual description of scientific discovery. Einstein didn't know GR worked until he did the math.

  ### 4. The Coherence Constraint You're Missing
  You asked if there is an "actual coherence constraint" blocking this. There is one, but it's a constraint of **idealization**, not rationality.

  Standard Bayesian coherence theorems (like Dutch Book arguments) assume a static probability space where all logical truths are assigned probability 1 immediately. To solve the Old Evidence problem, you have to relax the **Logical Omniscience** constraint.

  You have to allow the probability space to include propositions about logical relations (e.g., "Theory $H$ implies $E$") as distinct empirical-like propositions that can be learned over time. Once you allow that, the math works perfectly:
  $$P(H | H \vdash E) > P(H)$$
  ...even if $P(E) = 1$.

  ### 5. How to Frame This to Your Roommate
  Tell him this:

  > "You're treating Bayesianism as a logic of timeless relations, but it's supposed to be a logic of learning. The update isn't on Mercury's orbit ($E$); we knew that. The update is on the **derivation** ($H \to E$).
  >
  > If we assume logical omniscience, sure, Bayesianism fails. But if we admit that agents learn logical connections diachronically, then learning that GR entails Mercury is new information that increases the probability of GR. It's not counterfactual cheating; it's acknowledging that mathematical discovery is a temporal process."

  ### Verdict
  You are right. The "Old Evidence" problem is not a fatal flaw in Bayesianism; it is a demonstration that **standard Bayesian formalism is too idealized for real scientific history.**

  Your intuition that credences are diachronic mental states is the correct philosophical stance (often called **Psychologism** or **Subjective Bayesianism**). The puzzle only exists if you treat probabilities as static logical relations (Objective Bayesianism). You aren't missing a coherence constraint; you've just identified that the strict constraint your roommate is using is the one that doesn't fit real science.
