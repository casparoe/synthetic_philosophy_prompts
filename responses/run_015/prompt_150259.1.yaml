answer: |-
  **What the unit is**
  The unit is **Capability Doublings per Institutional Response Cycle (IRC)**. An IRC is the minimum time required for a major geopolitical competitor or regulator to detect a shift, convene decision-makers, and deploy a countermeasure (e.g., embargo, emergency funding, regulation). Calendar months are irrelevant because a 6-month takeoff is "slow" if bureaucracies move in weeks, and "fast" if they move in years. This unit directly quantifies the coordination runway: if speed exceeds 1 doubling per IRC, you lose control; if it stays below 1, you retain agency.

  **The list**

  1.  **Latent vs. Deployed Distinction:** The theory must separate benchmark scores from integrated operational capacity. *Case: The Quiet Year.* A model can double in power internally while deployment gates (safety, procurement, integration) hold real-world impact flat; counting lab metrics here falsely signals a fast takeoff when the strategic reality is slow.
  2.  **Hardware Binding:** The theory must explicitly state the energy and semiconductor constraints independent of algorithmic efficiency, including existing stockpiles. *Case: Two Clocks.* Software can iterate weekly, but fabs take years; a theory claiming rapid recursion fails if it assumes compute availability scales with algorithmic demand without accounting for physical lag or convertible inventory.
  3.  **Capability Vector Specificity:** The theory must identify *which* capability is taking off (e.g., cyber offense vs. physical manipulation). *Case: Jaggedness.* An AI that doubles coding speed but cannot move robots is a different threat profile than one that doubles robotics; a single scalar index hides this mismatch and misguides defense planning.
  4.  **Bottleneck Typology:** The theory must declare whether the limiting factor is cognitive labor, physical experimentation, or regulatory permission. *Case: Non-cognitive Bottlenecks.* If progress requires wet-lab biology trials, AI cognition speed is irrelevant; theories assuming cognitive labor is the only constraint are automatically invalid for those domains.
  5.  **Actor Concentration:** The theory must specify if the capability curve applies to a single lab or the global aggregate. *Case: Concentration.* A global doubling spread across 100 firms allows for competition and checks; a single-actor doubling enables unilateral seizure of advantage; the coordination strategy differs entirely.
  6.  **Strategic Threshold Definition:** The theory must define the specific capability level that renders response impossible (e.g., autonomous replication), not just economic GDP growth. *Case: Thresholds.* Smooth economic gain allows adaptation; a lumpy jump to decisive military edge ends the game; theories must identify the cliff, not just the slope.
  7.  **Epistemic Transparency:** The theory must state whether the speed is observable in real-time or only in hindsight. *Case: Ontology.* If the speed is a feature of our forecasting situation (we can't see it until it happens), it cannot be used for real-time coordination; theories must claim if the signal is detectable.
  8.  **Recursion Depth:** The theory must specify how many layers of the improvement loop are automated (AI coding tools vs. AI designing chips vs. AI running the lab). *Case: RSI.* Claims of hard takeoff rely on deep recursion; if humans are still in the loop for hardware or data collection, the speed ceiling is vastly lower.

  **Non-negotiable vs. camp prejudice**
  Non-negotiable demands are those required for the unit to function: distinguishing latent from deployed capability, anchoring to physical hardware, and defining the strategic threshold. Camp prejudice includes assumptions about recursion depth (hard takeoff bias assumes deep loops; continuous bias assumes shallow ones) and the specific duration of an IRC (weeks vs. months), which are empirical bets rather than structural requirements.

  **Where the list breaks**
  There is a fundamental tension between **Epistemic Transparency** and **Strategic Threshold**. If a takeoff is fast enough to cross a decisive threshold before response (a true "hard" takeoff), it implies the signal was hidden or too fast to process, violating transparency. If it is transparent enough to measure precisely, institutions likely have time to react, implying the threshold wasn't crossed unexpectedly. You cannot have a perfectly measurable, surprise decisive victory; a theory claiming both is likely incoherent.

  **The one that kills**
  **Latent vs. Deployed Distinction** rules out the most existing stories. Most narratives (especially hard takeoff) conflate model benchmark jumps with real-world power. This ignores the "Quiet Year" where integration, safety, and procurement lag behind raw intelligence. This requirement forces theorists to account for the "last mile" of deployment, which historically consumes the majority of rollout time, drastically slowing down most "fast" stories that assume lab gains equal world changes.

  **Sixty-second scorecard**
  **Hard Takeoff:** Fails Hardware Binding and Latent/Deployed; assumes recursion outpaces physical reality and integration lag.
  **Continuous Takeoff:** Passes Latent/Deployed and Hardware; often fails Strategic Threshold (misses lumpy risks where smooth growth hides sudden power shifts).
  **Standard Tech:** Passes Hardware; fails Recursion Depth and Thresholds (underestimates cognitive feedback loops and the possibility of decisive unilateral advantage).
