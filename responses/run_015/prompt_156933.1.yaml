answer: |-
  You are right to be suspicious. The move from "incommensurable" to "irrational" is the most common caricature of Kuhn, and the slide from "local" to "global" is the logical error that enables it.

  Here is the disambiguation of the specific theses hiding behind that seminar comment, with verdicts on defensibility, Kuhn's actual position, and whether they block rational comparison.

  ### 1. Global Semantic Holism
  **The Thesis:** The meaning of *every* term in a theory is determined by its relation to every other term in that theory. Therefore, changing the theory changes the meaning of the entire language. There is no neutral observation language.
  *   **Defensibility:** **Low.** If meanings were truly holistic, you couldn't learn a new theory without forgetting the old one. It makes communication across paradigms logically impossible, yet historians and scientists do it constantly.
  *   **Did Kuhn hold it?** **Early Kuhn, yes; Late Kuhn, no.** In *Structure* (1962), Kuhn leaned this way. In his later work (1990s), he explicitly rejected holism to avoid the charge of relativism.
  *   **Blocks Rational Comparison?** **Yes.** If there is no semantic overlap, you cannot state the disagreement. You are just talking past each other.
  *   **Verdict:** This is likely what your seminar speaker was relying on, but it is the weakest version of the argument.

  ### 2. Taxonomic Incommensurability (Local)
  **The Thesis:** Incommensurability is not global; it is localized to specific "kind-terms" (natural kind concepts). The hierarchical structure of categories changes. For example, the set of things that count as "planets" or "mass" in Theory A does not overlap perfectly with Theory B.
  *   **Defensibility:** **High.** This is precise and observable. In Newtonian mechanics, *mass* is invariant. In Einsteinian mechanics, *mass* is relative to velocity (or distinguished into rest/invariant mass vs. relativistic mass). The term refers to different structural roles.
  *   **Did Kuhn hold it?** **Yes.** This was Kuhn's mature position. He argued incommensurability is local to specific lexicons, not the whole language.
  *   **Blocks Rational Comparison?** **No.** You can still compare the theories. You just have to learn the translation manual for the specific terms. You can say, "Newton's equations work well at low velocities, Einstein's work at high velocities," even if "velocity" and "mass" shift meaning slightly.
  *   **Verdict:** This is the defensible core of the claim. It admits translation difficulties but does not forbid comparison.

  ### 3. Ontological Relativism ("Different Worlds")
  **The Thesis:** When paradigms change, the entities themselves literally cease to exist or come into existence. Before Lavoisier, there was no oxygen; before Einstein, there was no curved spacetime. The scientists literally "live in a different world."
  *   **Defensibility:** **Controversial.** As a claim about mind-independent reality, it is hard to defend (did gravity not pull before Newton?). As a claim about the *phenomenal* world (how the world is experienced and carved up), it is plausible.
  *   **Did Kuhn hold it?** **Nuanced.** Kuhn used the "different world" phrase, but he clarified he meant the *experienced* world (like a gestalt switch), not necessarily that matter pops in and out of existence. He was not an idealist.
  *   **Blocks Rational Comparison?** **No.** Even if the ontology shifts, you can compare which ontology yields better predictive control or puzzle-solving ability.
  *   **Verdict:** Rhetorically powerful, philosophically risky. It blocks *realist* comparison (which theory is True?) but not *pragmatic* comparison (which theory works?).

  ### 4. Methodological Incommensurability
  **The Thesis:** Paradigms disagree on the weights assigned to shared values (accuracy, scope, simplicity, fruitfulness). What counts as a "good explanation" changes.
  *   **Defensibility:** **High.** Newtonians valued action-at-a-distance for simplicity; Einsteinians valued local causality. They prioritized different virtues.
  *   **Did Kuhn hold it?** **Yes.** Kuhn argued there is no algorithm for theory choice, only shared values that can be applied differently.
  *   **Blocks Rational Comparison?** **No.** It blocks *algorithmic* choice (a computer couldn't decide), but not *rational* choice (humans can weigh values and argue).
  *   **Verdict:** This explains why consensus takes time, not why choice is irrational.

  ---

  ### The Crucial Distinction: Local vs. Global
  This is where the seminar speaker committed the logical error you sensed.

  **The Slide:**
  1.  **Premise A (True/Defensible):** There is **Local Incommensurability**. Specific terms (like "mass" or "simultaneity") cannot be perfectly translated between Newton and Einstein without loss or shift.
  2.  **Premise B (False/Caricature):** Therefore, there is **Global Incommensurability**. The entire conceptual scheme is isolated.
  3.  **Conclusion (False):** Therefore, **Rational Choice is Impossible**.

  **Why the Slide Fails:**
  *   **Local Incommensurability** allows for a "bridge language." We can speak *about* Newton and *about* Einstein from a third-person historical or meta-theoretical perspective. We can map the differences.
  *   **Global Incommensurability** denies the bridge language exists.
  *   **The Verdict on Rationality:** Kuhn explicitly argued that **Incommensurability $\neq$ Incomparability.**
      *   You can compare two things even if they don't share a perfect metric. (e.g., You can compare an apple and an orange by weight, sugar content, or price, even if they are different kinds of fruit).
      *   Rationality does not require a neutral algorithm; it requires reasons. Scientists give reasons for preferring Einstein (e.g., "It explains the perihelion of Mercury"). Those reasons are intelligible to Newtonians, even if the Newtonians reject the premises.

  ### Summary Verdicts

  | Thesis | Defensible? | Kuhn's View | Blocks Rational Choice? |
  | :--- | :--- | :--- | :--- |
  | **Global Semantic Holism** | No | Early Kuhn only | **Yes** (but thesis is false) |
  | **Taxonomic (Local)** | **Yes** | **Late Kuhn (Mature)** | **No** (Translation is hard, not impossible) |
  | **Ontological ("Worlds")** | Mixed (Phenomenal yes) | Nuanced / Gestalt | **No** (Pragmatic comparison remains) |
  | **Methodological** | **Yes** | **Yes** | **No** (Blocks algorithms, not reasoning) |

  **Final Diagnosis of the Seminar Comment:**
  The speaker conflated **Taxonomic Incommensurability** (which Kuhn held and is defensible) with **Global Semantic Holism** (which Kuhn rejected and is indefensible) to conclude **Irrationality** (which Kuhn explicitly denied).

  You can reply: *"Incommensurability implies translation difficulties in specific kind-terms, not the absence of a shared meta-language. We can compare the predictive scope and anomaly resolution of Newton vs. Einstein without needing perfect synonymy. Kuhn argued theory choice is not algorithmic, not that it is irrational."*
