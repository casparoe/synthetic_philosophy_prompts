answer: |-
  Here is the residue report, the translation, and the straight talk on approximation, drafted from the intersection of type spaces and policy gradients.

  ### 1. Primitives: The Mismatch List

  You asked for a list of candidates, not a tidy table. Here is the friction map between Epistemic Game Theory (EGT) and your MARL stack.

  *   **Belief (EGT) $\leftrightarrow$ Training Distribution / Meta-Strategy (MARL):**
      *   *Candidate:* In PSRO, the Meta-Strategy Solver (MSS) outputs a distribution over the population. This is functionally a belief over opponent policies.
      *   *Friction:* EGT beliefs are epistemic (uncertainty about a fixed truth). MARL distributions are often frequentist (sampling for gradient variance) or adversarial (covering support). When you sample opponents from a buffer, is that a "belief" or just "regularization"?
  *   **Rationality (EGT) $\leftrightarrow$ Converged Policy / Low Regret (MARL):**
      *   *Candidate:* An agent with 0 exploitability is rational.
      *   *Friction:* EGT rationality is a static constraint. MARL rationality is a loss landscape minimum. You never hit 0 exploitability. You hit "good enough given compute."
  *   **Best Response (EGT) $\leftrightarrow$ Oracle / Exploitability Maximizer (MARL):**
      *   *Candidate:* The outer loop of PSRO trains a BR against the current meta-strategy.
      *   *Friction:* Clean match. This is the strongest link.
  *   **Strictly Dominated by Mixture (EGT) $\leftrightarrow$ Dominated in Meta-Game Payoff Matrix (MARL):**
      *   *Candidate:* If a policy $\pi$ loses to a mixture of other policies in your archive against all opponent mixtures, it's dominated.
      *   *Friction:* In EGT, the mixture is over *all possible* strategies. In MARL, it's over the *current population*. You can only detect dominance relative to your archive's expressivity.
  *   **Common Belief in Rationality (EGT) $\leftrightarrow$ ??? (MARL):**
      *   *Candidate:* Maybe "Shared Training Infrastructure"? Or "Convergence of the PSRO Loop"?
      *   *Friction:* **Major Mismatch.** There is no native object in your stack for "I believe that you believe." You have *non-stationarity*, which is the nightmare version of this. You handle recursive reasoning via *depth* (unrolling) or *population diversity*, not via explicit belief hierarchies.
  *   **Correlated Belief (EGT) $\leftrightarrow$ Centralized Training / Shared Noise (MARL):**
      *   *Candidate:* CTDE allows policies to condition on global state or shared randomness during training.
      *   *Friction:* If you enforce decentralized execution with no shared seed, you enforce independent beliefs. Your example hinges on this.
  *   **Type Space (EGT) $\leftrightarrow$ Latent Opponent Embedding (MARL):**
      *   *Candidate:* Your opponent model conditions on $z_{-i}$.
      *   *Friction:* In EGT, types define beliefs. In MARL, $z_{-i}$ usually defines *behavior*. You infer "who they are," not "what they believe about me."

  ---

  ### 2. Restating the Argument in MARL Vocabulary

  Here is the standard epistemic story (Rationality + Common Belief $\rightarrow$ IESDS) translated into your PSRO/Population loop vocabulary.

  **The Setup:**
  Imagine your Population $\Phi = \{\pi^1, \dots, \pi^k\}$ is the set of "rational" strategies currently under consideration. The Meta-Game is the payoff matrix between these policies.

  **(a) The Base Case: Mixed Dominance vs. Exploitability**
  *   *EGT:* If $\sigma_i$ is strictly dominated by a mixture, it is Never a Best Response (NBR) to any belief.
  *   *MARL:* If policy $\pi^k$ has positive exploitability against *every* possible mixture of opponents drawn from the current population $\Phi_{-i}$, then $\pi^k$ will never be selected by the Meta-Strategy Solver as a best response.
  *   *Translation:* "Strictly dominated" translates to "Has no support in the Nash of the Restricted Game." If a policy is strictly worse than a mixture of your other policies against all opponent combinations, the Oracle will never output it as a BR. You can drop it from the archive without changing the Nash equilibrium of the meta-game.

  **(b) The Iteration: Population Pruning**
  *   *EGT:* Deleting a strategy restricts the support of opponents' beliefs. This may make *my* other strategies dominated relative to the restricted set.
  *   *MARL:* When you remove a dominated policy from the population, you change the training distribution for the next PSRO iteration. The Oracle now trains against a *restricted* opponent space.
  *   *Translation:* Each PSRO iteration $t$ assumes the opponents are playing from Population $\Phi_{t-1}$. If $\Phi_{t-1}$ has already pruned "irrational" (dominated) policies, the new BR $\pi^t$ is a best response to *rational* opponents.
  *   *The "Belief Level" Cost:* In EGT, round $k$ requires $k$ levels of belief. In MARL, round $k$ requires $k$ iterations of the PSRO loop. The "depth of reasoning" is literally the **number of oracle calls** you have budgeted.

  **(c) The Fixed Point: The Meta-Nash**
  *   *EGT:* The survivors are those consistent with Common Belief in Rationality.
  *   *MARL:* The survivors are the support of the Nash Equilibrium of the final Meta-Game matrix.
  *   *Translation:* The "solution" is not a single policy, but the **Meta-Strategy** (distribution over the population). Any policy with 0 weight in the Meta-Nash is "eliminated."

  ---

  ### 3. The 3-Player Example: Correlation is the Load-Bearing Wall

  Your intuition on the Ann/Bob/Cara example is correct, and it exposes the single biggest friction point between EGT and Independent MARL.

  **The Math Check:**
  *   **`anti` Payoff:** $P(u,r) + P(d,l)$.
  *   **Correlated Belief:** $P(u,r)=0.5, P(d,l)=0.5 \implies$ Payoff = 1.0. (Beats `safe` at 0.5).
  *   **Independent Belief:** $P(u,r) = p \cdot (1-q)$, $P(d,l) = (1-p) \cdot q$.
      *   Max of $p(1-q) + (1-p)q$ occurs at $p=0.5, q=0.5$, yielding 0.5.
      *   At this point, `safe` also yields 0.5.
      *   As you noted, for any other product distribution, either `safe`, `match`, or `hard` strictly outperforms `anti`.
  *   **Conclusion:** `anti` is **Never a Best Response to Independent Beliefs**, but **Is a Best Response to Correlated Beliefs**.

  **The MARL Translation:**
  *   **IESDS (Mixed)** assumes agents can hold **Correlated Beliefs** about opponents. In EGT, this is default; I can think Bob and Cara coordinated even if they didn't.
  *   **Your MARL Stack:**
      *   If you train with **Independent Learners** (each agent samples opponents independently, no shared critic/state), you are enforcing **Independent Beliefs**.
      *   If you train with **CTDE** or a **Centralized Critic** that sees $(a_{Bob}, a_{Cara})$, the learning process implicitly allows for **Correlated Beliefs** (the critic can detect joint patterns).
  *   **The Deletion Procedure:**
      *   Standard IESDS deletes `anti`. This corresponds to a MARL setup where Ann assumes Bob and Cara *might* correlate (e.g., they share a training seed, or she models them jointly).
      *   To get the "Independent Belief" version, you need **Iterated Elimination of Strategies that are NBR to Product Distributions**.
      *   *Can you do this by deleting rows?* Yes, but the dominance check is harder. You aren't checking against all $P(S_{-i})$; you are checking against all $P(S_{Bob}) \times P(S_{Cara})$.
      *   *In Practice:* If your opponent modeling assumes factorization (e.g., mean-field, or independent latent variables), you will naturally fail to learn `anti`. If you use a joint opponent model (transformer over opponent actions), you might learn `anti`.

  **Verdict:** Elimination-with-mixed-dominators **is** secretly a correlated-belief notion. In 3+ player games, this is not a technicality; it determines whether cooperative-adjacent strategies (like `anti` which punishes coordination) survive.

  ---

  ### 4. Residue Report: What Breaks in Translation?

  **1. Clean Translations:**
  *   **Best Response:** Your exploitability oracle is a direct implementation of the BR operator.
  *   **Dominance:** If a policy is dominated in your meta-game payoff matrix, it is dominated in the game (restricted to that support).
  *   **Rationality:** Low exploitability is the engineering proxy for rationality.

  **2. Distorted Translations:**
  *   **Belief:** In EGT, belief is a probability distribution justified by information. In MARL, "belief" is often just the **sampling distribution** of your replay buffer. If your buffer is prioritized by TD-error, your "belief" is adversarial, not epistemic. This distorts the "Common Belief" argument.
  *   **Common Belief:** You don't have this. You have **Stationarity**. When you train a BR, you assume opponents are fixed. When you update the population, you assume opponents will update. The "hierarchy" is flattened into **time steps**.

  **3. No Expression (The Hole):**
  *   **Epistemic Depth:** EGT says "I believe that you believe." MARL says "I train against your current policy."
      *   *Is this a hole?* **No.** It's a feature. The hierarchy in EGT is a justification for why Nash is plausible. In MARL, you don't need justification; you need convergence. The "infinite hierarchy" maps to **infinite compute**.
      *   *However:* If you want to model *learning opponents* (not fixed policies), you need recursive modeling (Theory of Mind networks). That is where the hierarchy lives in your stack, and it is notoriously unstable.

  ---

  ### 5. The Approximation Question: Does it Survive $\epsilon$?

  You asked for straight talk: **Exact optimality is load-bearing.**

  1.  **Strict Dominance is Fragile:**
      *   EGT: $u(\sigma', \sigma_{-i}) > u(\sigma, \sigma_{-i})$ for all $\sigma_{-i}$.
      *   MARL: $u(\pi', \pi_{-i}) > u(\pi, \pi_{-i}) + \epsilon$.
      *   If your approximation error $\epsilon$ is larger than the dominance margin, you cannot distinguish a dominated strategy from a weak BR.
      *   In your 3-player example, `anti` vs `safe` at $p=q=0.5$ is a tie (0.5 vs 0.5). With function approximation, this tie breaks randomly. You might keep `anti` or delete it based on gradient noise, not logic.

  2.  **The Chain Breaks:**
      *   The IESDS argument relies on a chain of deductions: "I know you won't play X, so I won't play Y."
      *   If "I know" is actually "I'm 95% sure," and "won't play" is "plays with <1% probability," the error compounds exponentially with the depth of iteration.
      *   By round 5 of PSRO, your "Common Belief" is actually "Common Noise."

  3.  **Engineering Salvage:**
      *   The logic doesn't survive approximation *logically*, but it survives *heuristically*.
      *   We rely on **Robust Dominance**. If a strategy is dominated by a *large* margin, it dies quickly in the population (selection pressure).
      *   If the margin is small (like `anti` vs `safe`), the population will oscillate. This isn't a bug; it's the system telling you that the epistemic assumptions (correlation vs independence) are ambiguous given the resolution of your solver.

  ### Summary for your Stack

  1.  **Your Example:** Correct. `anti` survives only if your agent architecture allows modeling **joint opponent distributions** (Correlated). If you enforce factorization (Independent), `anti` dies. This maps exactly to Correlated vs. Independent beliefs in EGT.
  2.  **The Hierarchy:** Don't worry about the missing belief hierarchy. In MARL, **Population Depth = Belief Depth**. If you need deeper reasoning, add more PSRO iterations or increase population diversity, not belief layers.
  3.  **Approximation:** Accept that IESDS is a **limit theorem**, not an algorithm. Your system approximates the *process* of elimination, not the *logic*. When dominance margins are within your $\epsilon$-error band, the epistemic story no longer applies, and you are purely in the realm of optimization dynamics.

  The epistemic story justifies why we look for Nash. Your stack finds approximations of Nash. The translation holds as long as you treat "Common Belief" as "Converged Meta-Strategy" and accept that approximation error turns logical elimination into probabilistic selection pressure.
