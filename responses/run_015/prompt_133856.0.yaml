answer: |-
  This differential treatment presupposes a specific, hybrid philosophy of science that I shall term **Methodological Fundamentalism with Non-Empirical Confirmation (NEC)**. This view diverges from classical logical empiricism by asserting that the epistemic standards for "fundamental" physics differ categorically from those for "phenomenological" or "special" sciences.

  ### Reconstruction of the Implicit Theory

  The practice relies on three core tenets:

  1.  **The Necessity Thesis:** Fundamental physical laws are not contingent regularities (like biological evolutionary paths) but necessary mathematical truths. Therefore, they are accessible to *a priori* reasoning (mathematics) even when empirical access is blocked by energy scales or cosmic horizons.
  2.  **The Surrogate Evidence Thesis:** In the fundamental domain, non-empirical virtues (mathematical consistency, uniqueness, unification, naturalness) function as probabilistic proxies for empirical truth. This is the core of Richard Dawid's argument for Non-Empirical Theory Assessment.
  3.  **The Hierarchy Thesis:** Physics occupies a foundational layer upon which biology and chemistry supervene. Consequently, physics is permitted to operate in a "theory-first" mode because its success constrains all lower-level sciences, whereas biology/chemistry must operate "data-first" because they describe contingent historical outcomes.

  ### Strict Requirements vs. Compatible Fits

  To sustain this institutional practice, the following are **strictly required**:
  *   **Metaphysical Realism about Mathematical Structure:** One must believe that mathematical consistency correlates with physical existence in the fundamental realm. If mathematical structures are merely human tools, the NEC argument collapses.
  *   **Empirical Inaccessibility as a Permanent Feature:** The lack of data must be viewed as a principled or long-term practical limitation, not a temporary failure of technology. If the data *could* be gathered but isn't, the reliance on NEC is negligent.

  The following **fit well but are not strictly required**:
  *   **Aesthetic Realism:** The idea that "beauty" or "elegance" is a truth-tracking virtue. While often cited by practitioners (e.g., Dirac), the theory only requires *consistency* and *unification*, not beauty. Aesthetics is likely a heuristic for consistency rather than a foundational premise.
  *   **Disciplinary Superiority:** The view that physics is intellectually superior to biology. The practice only requires that physics be *foundational*, not superior. Biology could be equally rigorous but methodologically distinct due to the contingency of its subject matter.

  ### Coherence Assessment

  The view is **conditionally coherent**. It maintains internal consistency *if* one accepts the Necessity Thesis. It solves the problem of underdetermination in high-energy physics by expanding the definition of "evidence." However, it faces a severe demarcation problem: if empirical falsifiability is relaxed for physics based on mathematical virtue, there is no principled barrier to preventing biology or economics from claiming similar exemptions (e.g., invoking "mathematical elegance" in population models to bypass data scarcity). The coherence breaks down at the boundary where "fundamental" ends and "phenomenological" begins, a boundary that is itself theory-laden and shifting.

  ### Institutional Implications of Abandonment

  If this implicit theory were abandoned in favor of strict empiricism (where empirical distinguishability is a necessary condition for scientific legitimacy):

  1.  **Funding Realignment:** Major grants (e.g., from the DOE or ERC) would shift from purely formal theory development to experimental technology capable of testing existing frameworks, or to phenomenological models that make low-energy predictions.
  2.  **Tenure Criteria:** Hiring committees would require a track record of empirically constrained model-building. Purely mathematical work would be categorized as mathematics, not physics, and evaluated by math departments.
  3.  **Risk Assessment:** Proposals would be evaluated on "empirical risk" (likelihood of yielding data) rather than "theoretical promise" (likelihood of mathematical unification).

  ### Confidence and Uncertainty

  **Overall Confidence:** High. The reconstruction aligns with explicit defenses offered by prominent theorists (e.g., Witten, Gross, Dawid) and explains the sociological data of hiring and funding.

  **Least Confident Claim:** I am least certain about the extent to which **Aesthetic Realism** is a genuine driver versus a post-hoc rationalization. While practitioners speak of "beauty," the institutional machinery likely runs on **Mathematical Consistency** alone. It is unclear if the "aesthetic" component is a necessary philosophical presupposition or merely rhetorical packaging for the rigidity of formal constraints.

