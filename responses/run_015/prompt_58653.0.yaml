  The detail doing the work is transparency regarding public consent. If you drop the secrecy element, both mayors are either democratically legitimized or both are autocrats, collapsing the distinction between dirty hands and mandated leadership or corruption. If you drop the beneficial outcome, the act becomes simple incompetence or malice rather than a tragic necessity. A skeptic who thinks dirty hands is nonsense, like a hard consequentialist, would argue that the secretive mayor is morally superior because the deception ensured the better outcome without being derailed by irrational public sentiment, rendering the stain mere emotional residue with no ethical weight.
