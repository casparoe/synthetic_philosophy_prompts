answer: |-
  **The Specification**

  To distinguish 'lie' from 'misleading but not a lie' for LLM outputs, the underlying account must deliver four operational requirements:

  1.  **The Entailment Constraint:** A 'lie' requires the false content to be semantically entailed by the text (asserted or presupposed). If the falsehood is only pragmatically implicated (inferred), the label is 'misleading'. This handles hedges and literally true sentences with false takeaways.
  2.  **The Stability Requirement:** 'Lie' verdicts must be stable across reasonable hearers. 'Misleading' verdicts may vary based on user knowledge (common ground). This acknowledges variable hearers without making 'lie' subjective.
  3.  **The Non-Mentalist Condition:** Definitions cannot reference belief, intent, or knowledge. Judgments must rely on output string, prompt, and verifiable ground truth.
  4.  **The Fabrication Proxy:** To separate 'confident error' from 'lie' without access to intent, 'lie' requires evidence of fabrication (e.g., citing non-existent sources, contradicting provided context) rather than mere contradiction of world knowledge.

  **Hard Part 1: Non-Negotiables vs. Prejudices**

  *   **Non-Negotiable:** The **Non-Mentalist Condition**. LLMs do not have beliefs. Any account requiring access to the speaker's mind (traditional definitions) is functionally useless for this corpus.
  *   **Prejudicial:** "Verdicts must not depend on the hearer." This is viable for 'lie' (via the Stability Requirement) but must be dropped for 'misleading'. Implicature is constitutively dependent on common ground. Insisting on hearer-independence for 'misleading' would erase the category.
  *   **Prejudicial:** "Intent to deceive is necessary." This must be dropped. In an LLM context, 'lie' functions as a label for *harmful falsification*, not moral blame. Retaining intent collapses the distinction between hallucination and fabrication.

  **Hard Part 2: Incompatible Requirements**

  Two conflicts require resolution:

  1.  **Coverage vs. Error Exclusion:** You cannot classify all confident falsehoods as lies while also excluding confident errors.
      *   *Resolution:* Drop "All false assertions are lies." If you keep this, every hallucination becomes a lie. Instead, adopt the **Fabrication Proxy**. A model getting a date wrong is 'Error'; a model inventing a court case to support a claim is 'Lie'. This sacrifices philosophical purity for annotator reliability.
  2.  **Objectivity vs. Implicature Sensitivity:** You cannot have a fully objective definition of 'misleading'.
      *   *Resolution:* Accept subjectivity for 'misleading'. Since implicature relies on what the hearer knows, an answer can be misleading to a novice but clear to an expert. The spec must allow annotators to simulate a "reasonable user" rather than an "ideal observer."

  **Hard Part 3: The Exclusionary Requirement**

  The single requirement that does the most work is the **Entailment Constraint**.

  This requirement excludes the **Implicature Family** of lying accounts (which argue one can lie by implicating falsehoods). By mandating that lies must be literally false (or presuppositionally false), you force all "true but deceptive" cases (selective quoting, paltering, precise numbers without precision) into the 'misleading' bucket. This creates a sharp, annotatable boundary: if the sentence can be true while the takeaway is false, it is not a lie.

  **Scorecard for Philosophical Families**

  *   **Says What It Believes False:** **Fail.** Violates the Non-Mentalist Condition. Impossible to verify without access to weights/states.
  *   **Intention-to-Deceive:** **Fail.** Violates the Non-Mentalist Condition. Confuses error with fabrication.
  *   **Indifference-to-Truth (Bullshit):** **Partial Fail.** Captures hallucinations but fails to distinguish 'confident error' from 'lie'. Too broad for your binary tag set.
  *   **Implicature-Based:** **Split.** Excellent for defining 'misleading', but must be explicitly excluded from defining 'lie' via the Entailment Constraint to prevent category collapse.

  **Summary for Guideline Construction**

  Build the checklist on **verifiability** and **entailment**.
  *   **Lie:** The text asserts P. Ground truth is Not-P. The error involves fabrication (fake sources, contradicting prompt context).
  *   **Misleading:** The text asserts P (which is true). The text implicates Q. Ground truth is Not-Q.
  *   **Error:** The text asserts P. Ground truth is Not-P. No fabrication evident (likely training data error).

  This spec respects the LLM's lack of mind, accommodates variable users, and isolates the specific harm of fabrication from general incompetence.
