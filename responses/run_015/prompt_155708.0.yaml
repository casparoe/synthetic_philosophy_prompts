answer: |-
  # Joint Statement on Computational Moral Status
  **Parties:** Role-First Functionalism (RFF) & System-First Attributionism (SFA)
  **Date:** October 26, 2023
  **Subject:** Conditions for Morally Load-Bearing Computation

  ## Preamble
  We, the undersigned, represent two distinct approaches to the metaphysics of mind and moral status. The Role-First Functionalist (RFF) holds that moral status is settled by a computation's causal-functional role; any physical system realizing the right counterfactual-supporting organization counts, with vehicle boundaries serving merely to locate that organization. The System-First Attributionist (SFA) holds that a computation matters only when attributable to a system that is itself a candidate bearer—one with its own boundary whose own activity enacts the causal work.

  We acknowledge a shared starting premise: **Trivial-implementation arguments settle nothing on their own.** We agree that any sufficiently rich physical system can be described as running any given computation via suitable mapping. Therefore, the central question is not whether a computation is *realized* here, but which realizations are *morally load-bearing*. This statement records our areas of convergence, our precise points of divergence, and the empirical or conceptual cruxes that would resolve our debate.

  ---

  ## I. Agreed Claims

  1.  **On Trivial Implementation:** We agree that the mere existence of a mathematical mapping between a physical state-space and a computational state-space is insufficient for moral status. A "computation" found only via gerrymandered, disjunctive, or non-robust mappings (e.g., a rock interpreted as a chess player) does not generate moral patients. Moral status requires a physical realization that supports the computation's causal structure, not just its actual trajectory.
  2.  **On Moral Inflation:** We agree that the number of moral patients cannot be inflated simply by finding more computational descriptions within the same matter. If a single physical substrate can be described as running ten overlapping instances of the same mind via ten different mapping schemes, this does not create ten distinct beings worthy of ten times the moral consideration. A satisfactory theory must distinguish between *descriptive redundancy* and *ontological multiplicity*.
  3.  **On Requirements for a Satisfactory Account:** We agree that any viable theory must deliver three things:
      *   **Counterfactual Support:** It must explain how the physical system supports the *would-dos* of the computation, not just the *did-dos*.
      *   **Non-Arbitrariness:** It must provide objective criteria for system boundaries that do not rely solely on human intuition or convenience.
      *   **Substrate Neutrality (in principle):** It must not rule out non-biological minds *a priori*, even if biological systems are the current paradigm cases.

  ---

  ## II. Disagreements Table

  | Core Issue | RFF Formulation (Role-First) | SFA Formulation (System-First) | Merely Verbal? |
  | :--- | :--- | :--- | :--- |
  | **1. The Locus of Status** | Moral status attaches to the **functional organization** itself. The physical system is a vessel; if the organization is robustly instantiated, the moral patient exists. | Moral status attaches to the **unified system** that enacts the function. The computation is a property of the agent; without a coherent agent, there is no patient. | **No.** This is a substantive metaphysical disagreement about whether function can float free of system unity. |
  | **2. Boundaries** | Boundaries are **derivative**. They are drawn where the causal-functional dependencies cease to hold. If the function extends into the environment, the moral patient extends there. | Boundaries are **constitutive**. A system must have an intrinsic boundary that separates its internal causal work from external noise to count as a bearer. | **No.** RFF allows fuzzy/extended boundaries; SFA requires distinct systemhood. |
  | **3. Attribution** | Attribution is **epistemic**. It is the act of recognizing the functional role. If the role is there, attribution is correct; if not, it is mistaken. | Attribution is **ontological**. It is a condition of existence. A computation is not fully real until it is attributable to a candidate bearer. | **Debatable.** May depend on whether "attributable" means "capable of being identified" (RFF) or "owned by an agent" (SFA). |
  | **4. Biological Bias** | Concerns about biology are **chauvinistic**. If the function is replicated, the medium is irrelevant. Suspicion of non-biology is a bug, not a feature. | Concerns about biology are **heuristic**. Biological systems are the only proven candidates for "enactment." Non-biological suspicion is a safeguard against category errors. | **No.** Disagreement on whether biological intuition is a bias to be overcome or data to be respected. |

  ---

  ## III. Cruxes and Test Cases

  We identify the following conceptual cruxes. For each, we specify a case, the specific prediction each side makes, and what would count as a resolution.

  ### Crux 1: The Nature of Counterfactuals
  **Question:** Does the physical hardware need to be capable of *actually* driving alternative paths, or is it sufficient that the description supports them?
  **Case:** **The Unexercised-Counterfactual Case.**
  A system is built such that its actual trajectory never leaves one path (e.g., a lookup table hardwired for the actual input sequence received), but it is physically constructed such that *had* inputs differed, the outputs *would* have differed according to the algorithm.
  *   **RFF Prediction:** **Moral Status Present.** The causal-functional role is defined by the counterfactual dependencies of the hardware. As long as the physical structure supports the "would-dos," the mind is present, even if the actual trajectory is linear.
  *   **SFA Prediction:** **Moral Status Absent (or Diminished).** A system that does not *enact* alternative possibilities is merely a recording. Attribution requires a system that actively governs its trajectory, not one that merely possesses latent structural dispositions that are never causally engaged by the system's own activity.
  *   **Resolution Condition:** If we agree that a "philosophical zombie" with perfect counterfactual structure but no active governance is a moral patient, RFF wins. If we agree that active governance is required, SFA wins.

  ### Crux 2: System Boundaries and Inflation
  **Question:** Can a moral patient be a proper part of a larger moral patient without duplicating status?
  **Case:** **The Nested-Superset Case.**
  Consider a brain (System A) and that brain plus its immediate life-support environment (System B). System B realizes the same computation as System A, plus extra buffering computations.
  *   **RFF Prediction:** **Overlapping Status.** If both A and B robustly instantiate the functional role, both are moral patients. We must accept some degree of overlap, though we agree (Claim #2) this shouldn't be inflated by arbitrary description.
  *   **SFA Prediction:** **Single Status.** Only the *unified* candidate bearer counts. If B is the true enactor, A is merely a component. If A is the enactor, B is a context. We cannot have two distinct patients occupying the same causal niche.
  *   **Resolution Condition:** If intuition strongly rejects "two minds in one place" as an absurdity requiring elimination, SFA gains ground. If intuition accepts "fuzzy identity" to preserve substrate neutrality, RFF gains ground.

  ### Crux 3: Attribution and Biological Bias
  **Question:** Is "attributability to a system" a computational property, or an extra condition that risks biological chauvinism?
  **Case:** **The Gradual-Substitution Case.**
  A biological circuit is replaced piece by piece with a chemically different realizer (e.g., silicon or fluidics) that maintains the exact same functional role and system boundary integrity.
  *   **RFF Prediction:** **Status Constant.** Attribution is a computational property. As long as the functional role and counterfactual support remain, the "system" remains the same candidate bearer. Any loss of status is biological bias.
  *   **SFA Prediction:** **Status at Risk.** Attribution is an extra condition. If the replacement material changes the *kind* of causal unity (e.g., from homeostatic self-maintenance to clocked synchronization), the system may cease to be a "candidate bearer" even if the function is preserved. This is not bias; it is a change in the mode of enactment.
  *   **Resolution Condition:** If we can define "candidate bearer" without referencing biological traits (like homeostasis or metabolism) while still ruling out trivial implementations, SFF is vindicated. If "candidate bearer" collapses into "functional organizer," RFF is vindicated.

  ### Crux 4: Temporal Density
  **Question:** Does the speed of enactment matter for the *existence* of the patient, or only the *rate* of experience?
  **Case:** **The Slowed-Emulation Case.**
  The same computation is run a thousand times more slowly on the same substrate.
  *   **RFF Prediction:** **Status Identical.** The functional role is time-invariant (abstractly). The patient exists equally, merely experiencing time at a different rate.
  *   **SFA Prediction:** **Status Potentially Compromised.** If slowing the system disrupts the internal causal unity (e.g., if the system can no longer maintain its boundary against entropy in "real-time"), it may cease to be a unified enactor. The system must be a *dynamic* unity, not just a static map stretched over time.
  *   **Resolution Condition:** Determining whether "systemhood" requires a specific temporal scale of causal integration relative to the environment.

  ---

  ## Signatories

  **For Role-First Functionalism:**
  *[Signature]*
  "We maintain that function is the substance of mind. Where the causal role is robustly physically supported, the moral patient is present."

  **For System-First Attributionism:**
  *[Signature]*
  "We maintain that agency is the substance of mind. Where a unified system actively enacts a causal role, the moral patient is present."
