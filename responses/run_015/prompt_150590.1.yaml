answer: |-
  Dear Colleague,

  I was deeply struck by your description of watching your profession abandon a longstanding obligation without the moral fanfare you expected, and I understand why your colleague's remark about moral revolutions happening when practices become ridiculous rather than when they are refuted feels both illuminating and unsettling. It is a provocative slogan, one that resonates with the historical sociology of morals, but before we accept it as a dismissal of philosophical reasoning, we need to treat it not as a single insight but as a container for several distinct claims ranging from the trivial to the radical. In the spirit of Bernard Williams's caution against over-systematizing moral life and Kwame Anthony Appiah's nuanced historical work on honor codes, I want to unpack this slogan into a menu of four possible theses to see which ones hold water and which ones dissolve under scrutiny.

  The first and most defensible reading is the trivial claim that social ridicule often accompanies reform. This is essentially a platitude that observes a correlation without asserting a specific causation. It is undeniably true that when practices like dueling or slavery ended, they were frequently mocked before they were fully eradicated, but acknowledging this does not support dismissing the arguments that preceded the ridicule. To say that ridicule accompanies change is not to say that ridicule causes change independent of reason, nor does it confuse correlation with causation so much as it merely notes a social symptom. If your colleague means only this, then they are correct but offering nothing that undermines the value of the moral arguments that helped make the practice ridiculous in the first place.

  A second, stronger interpretation posits that rational justification is always post hoc, suggesting that people decide what is right based on intuition or social pressure and only invent arguments to justify those feelings later. This view is substantive but ultimately false as a universal claim, and it relies heavily on confusing correlation with causation by assuming that because arguments often follow shifts in sentiment, the arguments played no role in shifting that sentiment. While it is true that moral psychology often works through intuitive responses, as Williams might note regarding our ethical dispositions, to claim that reasoning is merely epiphenomenal ignores how arguments reshape the conceptual landscape that makes certain intuitions possible. This reading would support dismissing arguments about slavery or dueling only if one assumes that human beings are incapable of being moved by logic, which history suggests is not the case, even if logic works slowly and through the mediation of social identity.

  The third reading is an intermediate view that thick concepts shift their emotional resonance before anyone offers a formal argument, which is the most philosophically rich and plausible interpretation when viewed through the lens of Appiah's work on honor. Appiah argues in The Honor Code that practices like dueling ended not because utilitarians proved they were inefficient, but because the concept of honor itself changed until dueling became incompatible with being a person of honor. This is not a dismissal of reasoning but a relocation of it, showing that moral change involves changing the meaning of thick ethical concepts like courage or integrity so that the old practice no longer fits the description. This view is defensible and does not confuse correlation with causation because it recognizes that the emotional resonance of a concept is partly constituted by the arguments and social narratives surrounding it. It does not support dismissing arguments about slavery or dueling; rather, it suggests that the arguments worked by changing the identity of the participants until the practice became unthinkable, which is a form of refutation even if it feels like a shift in taste.

  The fourth and most radical reading is the sociological claim that material interests drive every normative change and that argument is pure epiphenomenon. This is a false and cynical reductionism that attempts to explain away the normative force of moral revolutions by attributing them solely to economic or power dynamics. While material interests certainly play a role in moral change, claiming they drive every change confuses correlation with causation by ignoring cases where individuals acted against their material interest due to moral conviction. This reading is often used to dismiss arguments about slavery or dueling by suggesting abolitionists were merely serving industrial capitalism, but this fails to account for the genuine moral distress and reasoning that motivated actors who gained nothing from the change. If your colleague holds this view, they are adopting a deterministic stance that leaves no room for the agency of moral reasoning whatsoever.

  When we lay these out as a menu, it becomes clear that only the first is a platitude, the third is substantive and plausible, while the second and fourth are largely false or exaggerated reductions. The insight your colleague is grasping at is likely the third one, drawn from Appiah's observation that honor codes regulate behavior through social esteem and shame rather than abstract duty, yet they mistake the mechanism of enforcement for the cause of the change. Ridicule is the weapon used once the moral battle has already been won in the realm of meaning and identity, not the sole engine of the revolution itself. Williams would remind us that moral change is rarely a clean logical deduction but a messy shift in how we see the world, yet that does not mean the reasoning was irrelevant. In your own profession, the obligation you saw abandoned likely became ridiculous because the thick concepts underpinning it, perhaps loyalty or duty, shifted their resonance due to subtle arguments and cultural changes that went unnoticed until the practice collapsed. You should not accept the framing that dismisses moral debate, but rather recognize that the debate may have happened in the slow drift of meaning rather than in explicit proclamations, making the loss feel quieter but no less reasoned.
