answer: |-
  Here is a procedure designed for your commission. It is built to be read aloud, takes 30 minutes, and embeds the philosophical reasoning into the questions so you don't have to lecture.

  ### The Municipal Franchise Test (MFT)

  **Preamble (Read by Chair):**
  "We are not founding a new country. We are adjusting the rules of a city that exists within a State and a Nation. We accept that the State Constitution sets the outer walls of who *can* vote. Our job is to decide who *should* vote within those walls, or if voting should be required. We acknowledge that we, the current voters' representatives, are deciding for people who cannot yet vote for us. This is a trusteeship, not a perfect democracy. We proceed with that burden in mind."

  **Step 1: The Sort (Right vs. Duty)**
  *Question:* "Does this proposal grant a **Right** (permission to participate) or impose a **Duty** (requirement to participate)?"
  *   **If Right:** Proceed to Step 2.
  *   **If Duty:** Skip to Step 4.
  *   **Stop Rule:** If the proposal claims to override State/Federal law (e.g., voting for federal offices), stop. **Flat No.** We lack jurisdiction.
  *   *Definition:* **Jurisdiction:** The legal authority to enforce rules on a person or place.

  **Step 2: The Boundary Test (For Rights)**
  *Question:* "Is the proposed group subject to the city's direct legal enforcement (taxes, zoning, police, ordinances) for at least [X] months?"
  *   **Pass:** Yes, they are governed by the city.
  *   **Fail:** No, they are only 'affected' economically or socially (e.g., commuters, neighbors in other towns). **Flat No.**
  *   *Reasoning:* This stops the "everyone affected" slide. If the city cannot arrest them or tax them, they are outside the boundary.
  *   *Definition:* **Direct Legal Enforcement:** Can the city court fine them or the city police arrest them?

  **Step 3: The Caste Test (For Rights)**
  *Question:* "Is the current exclusion **permanent** for the individual, or **temporary**?"
  *   **Pass (Temporary):** Everyone in the group will eventually qualify (e.g., age). *Proceed to Step 5.*
  *   **Fail (Permanent):** The group is permanently barred based on a trait they cannot change or a status they cannot attain (e.g., race, permanent non-residency). *Requires Supermajority (5 of 7) to proceed.*
  *   *Reasoning:* Temporary exclusion is easier to justify than permanent caste. If it's permanent, the burden of proof is higher.
  *   *Note:* If "Temporary," ask: "Is there a clear, objective threshold for entry (e.g., birthday, residency date)?" If no, **Flat No.**

  **Step 4: The Burden Test (For Duties/Compulsion)**
  *Question:* "Is the penalty for non-compliance a fixed dollar amount, and does that amount represent a significantly higher burden for low-income residents than wealthy ones?"
  *   **Pass:** No, the penalty is progressive or non-monetary (e.g., community service).
  *   **Fail:** Yes, it is a flat fine that hits the poor harder. *Requires Supermajority (5 of 7) to proceed.*
  *   *Reasoning:* A flat fine functions as a regressive tax. If we compel voting to help the poor, we cannot punish the poor for failing to vote.
  *   *Definition:* **Regressive:** A cost that takes a larger percentage of income from the poor than the rich.

  **Step 5: The Trusteeship Vote**
  *Question:* "Knowing we are deciding for people who cannot vote on this, do we authorize this change?"
  *   **Action:** Simple Majority Vote.
  *   *Reasoning:* This admits the circularity. We cannot solve the "who decides" paradox. We own the decision as trustees.

  ***

  ### Application to Your Three Proposals

  Here is how the MFT runs on your current stack. I have noted where the procedure conflicts with your personal stated views.

  #### 1. Votes at 16 (City Council/School Board)
  *   **Step 1 (Sort):** Right. (Proceed to Step 2).
  *   **Step 2 (Boundary):** Yes. 16-year-olds are subject to city laws, curfew, and zoning. (Pass).
  *   **Step 3 (Caste):** Temporary. They will turn 18. Threshold is objective (birth date). (Pass).
  *   **Step 5 (Trusteeship):** Vote.
  *   **Outcome:** **Likely Pass.**
  *   **Conflict Check:** This aligns with your view.
  *   **Where it happened:** Step 3. By classifying age as "temporary exclusion," the procedure treats it as less objectionable than permanent exclusion.
  *   **Philosophical Note:** You asked if temporary exclusion is genuinely less objectionable. The procedure assumes "Yes" for the sake of movement. It treats age as a "waiting room" rather than a "locked door." This is a judgment call. If a commission member argues 16-year-olds lack *capacity* regardless of time, the procedure does not stop them, but it forces them to argue capacity, not caste.

  #### 2. Non-Citizen Residents (3+ Years)
  *   **Step 1 (Sort):** Right. (Proceed to Step 2).
  *   **Step 2 (Boundary):** Yes. They pay taxes, are subject to police/zoning. (Pass).
  *   **Step 3 (Caste):** Permanent *unless* they naturalize. If naturalization is possible, it is technically temporary, but practically permanent for many.
      *   *Critical Juncture:* The Commission must decide if "eligibility for citizenship" counts as temporary.
      *   *If Yes:* Passes Step 3. Goes to Vote.
      *   *If No:* Triggers Supermajority requirement (5 of 7).
  *   **Step 5 (Trusteeship):** Vote.
  *   **Outcome:** **Contested.**
  *   **Conflict Check:** Neutral.
  *   **Where it happened:** Step 3. The procedure forces you to define if "permanent resident" is a caste or a waiting room. If you treat it as a caste, the hurdle is higher. This prevents the "they live here so they vote" slide without checking if they can ever join the national demos.

  #### 3. Compulsory Voting ($25 Fine)
  *   **Step 1 (Sort):** Duty. (Skip to Step 4).
  *   **Step 4 (Burden):** $25 flat fine. Is it regressive? Yes. $25 is negligible to a business owner, significant to a minimum-wage worker.
      *   *Result:* **Fail.**
      *   *Requirement:* Needs Supermajority (5 of 7) to override the failure.
  *   **Step 5 (Trusteeship):** Vote.
  *   **Outcome:** **Likely Fail.**
  *   **Conflict Check:** This aligns with your view, but **you must admit the procedure did the work, not your argument.**
  *   **Where it happened:** Step 4. The procedure embeds a specific theory of justice: *punishments must not be economically regressive.*
  *   **Philosophical Note:** You asked if the fine is a price or penalty. Step 4 treats it as a penalty. If it were a "price" (like a tax), it would need to be progressive. By flagging the regressivity, the procedure kills the "turnout helps the poor" argument if the mechanism hurts the poor.

  ***

  ### The Confession: Judgment Calls in Procedural Costume

  You asked me to mark where this is philosophy wearing a suit. Here they are. You must read this to the commission before adopting the MFT.

  1.  **The "Direct Enforcement" Boundary (Step 2):**
      *   *The Costume:* "Jurisdiction."
      *   *The Judgment:* We are choosing "Subjection to Power" over "Affected Interests." This is a Hobbesian choice, not a Lockean one. We are saying being *ruled* matters more than being *impacted*. This excludes the "neighbors three states away" but also excludes people impacted by city investment decisions who live just outside the line. We are drawing a hard line where reality is fuzzy.
  2.  **The "Temporary" Mitigation (Step 3):**
      *   *The Costume:* "Caste Test."
      *   *The Judgment:* We are assuming temporary exclusion is morally lighter than permanent exclusion. This comforts you on age, but it is not a logical truth. A 17-year-old barred from voting is still barred *now*. The procedure privileges the *future* self over the *current* self. That is a value choice.
  3.  **The Regressivity Veto (Step 4):**
      *   *The Costume:* "Burden Test."
      *   *The Judgment:* We are assuming economic fairness trumps civic duty uniformity. A strict egalitarian could argue the fine is fair because it is the *same* for everyone. The procedure rules that "same dollar amount" ≠ "same burden." This is a substantive economic theory embedded in a rule.
  4.  **The Trusteeship Admission (Preamble & Step 5):**
      *   *The Costume:* "Procedural Authorization."
      *   *The Judgment:* We are admitting we cannot solve the Boundary Problem. We are saying, "We know this is circular, so we will just be honest about it." This prevents us from pretending the math works, but it leaves the moral authority of the decision on our shoulders, not the rules'.

  ### What This Procedure Cannot Decide

  There are three points where you must stand up and tell the room the method ends and politics begins.

  1.  **Competence vs. Age:** The MFT passes 16-year-olds because the exclusion is temporary. It does *not* prove 16-year-olds are competent. If a commission member argues "16-year-olds lack cognitive capacity," the MFT has no tool to measure that. You will have to debate psychology, not procedure.
  2.  **The Meaning of Citizenship:** For the non-citizen proposal, the MFT asks if residency is "permanent." It cannot decide if *national* citizenship is a prerequisite for *local* voting. That is a question of sovereignty the MFT explicitly sidesteps (see Preamble). You will have to argue that point on principle.
  3.  **The Purpose of Voting:** The MFT treats voting as a Right or a Duty. It cannot decide if voting is a *Public Office* (a job you must qualify for). If a commission member argues "Voting is a job that requires training," the MFT breaks. You will have to debate the nature of the act itself.

  **Final Instruction:**
  If the Commission adopts this, you are no longer "the theory person." You are the person who built the machine. When the machine outputs a result you dislike, do not override it. Let the procedure take the heat. That is the only way the reasoning lives without you in the room.
