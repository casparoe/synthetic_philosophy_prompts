prompt: |-
  So I got talked into sitting on a standing franchise-and-elections commission in my city. Seven of us, and I'm the only philosopher, which apparently makes me "the theory person." We get four to six proposals a year and now neighboring towns send us theirs too, so whatever I bring needs to be something the others can run without me in the room. The commission is a city clerk, a retired probate judge, a high-school civics teacher, two neighborhood-association types and a small-business owner. None of them will read political theory and I'm not handing anyone a bibliography, so the reasoning has to live inside the procedure itself.

  The current stack of three, which public comment keeps conlfating:
  1. votes at 16 for city council and school board;
  2. local voting rights for non-citizen residents with three or more years in the city;
  3. compulsory voting in city elections, enforced by a $25 fine.

  Give me a procedure we can run on any franchise proposal in about half an hour at a monthly meeting: the questions in order, what counts as a good enough answer to each, where a proposal gets stopped with a flat "no," and where we have to admit the question is about values and hand it to a vote rather than pretending the procedure settled it. It should start by sorting the proposal, because I don't think these three are the same kind of question at all — two are about who's inside the demos and one isn't about the boundary but about whether voting can be demanded of people who are already inside. If you think that sort is wrong, say so and give me a better one. Any term of art you can't avoid, define in one line; this thing gets read aloud at a public meeting.

  Then it has to face what I can't get around in my own head: any rule about who belongs in the demos is itself a rule that only some demos can make, so we can't fix the boundary democratically without going in circles. The procedure has to be explicit about what it's treating as settled before politics starts, instead of smuggling that in at step two.

  It also has to handle the over-inclusion slide. If the test is "everyone affected gets a say," our zoning decisions entitle people three states over plus people not yet born, and we have no stopping rule. And I want something specifically about age: age is odd because unlike race or sex everybody passes through it if they live, so the excluded aren't a standing caste, they're a rotating one. Does that genuinely make the exclusion less objectionable, or am I comforting myself?

  Same treatment for the compulsary one, where the interesting bits to me are whether a $25 fine is a penalty or just a price, and whether the usual case for compulsion (turnout gaps track income, so forcing everyone to vote helps the poor) survives the fact that the fine lands hardest on those same people.

  Run it on all three. Don't rig it for me: I've said publicly that I favor votes at 16 and I'm against compulsion, so if the procedure sinks one of my positions or rescues the other, write that down, name the step that did it, and say why. Finish by marking which steps are judgment calls in a procedural costume, and by listing what this procedure simply cannot decide — the points where I'll have to stand up and tell a room full of people that we have no method.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher on a 7-person city franchise-and-elections commission.
      *   **Audience:** City clerk, retired probate judge, high-school civics teacher, two neighborhood-association types, small-business owner. (Practical, non-theoretical, need clear rules).
      *   **Goal:** A 30-minute procedure to evaluate franchise proposals (voting rights/obligations).
      *   **Constraints:** No bibliographies, reasoning must be embedded in the procedure, must handle public comment confusion, must address the "boundary problem" (who decides who votes), must handle "over-inclusion" (all affected interests), must address age specifically, must address compulsory voting (fine vs. penalty, regressivity).
      *   **Input Proposals:** (1) Votes at 16, (2) Non-citizen voting (3+ years), (3) Compulsory voting ($25 fine).
      *   **User's Stance:** Pro Votes at 16, Anti Compulsion. (Procedure must be honest, even if it contradicts this).
      *   **Output Requirements:** Ordered questions, pass/fail criteria, stop points, admission of value judgments, application to all three proposals, identification of procedural "judgment calls in costume," and limitations of the method.

  2.  **Deconstruct the Philosophical Problems:**
      *   **The Boundary Problem (Democracy's Paradox):** You need voters to decide who votes. *Solution:* Acknowledge the current legal framework as the "provisional demos" for the sake of the procedure. We aren't founding a new state; we are amending a municipal code within a state/national context.
      *   **All-Affected Interests vs. Over-inclusion:** "Everyone affected" is too broad (zoning affects neighbors three states away). *Solution:* "Subject to Jurisdiction" or "Direct Legal Consequence." Focus on who is *governed* by the specific body being elected.
      *   **Age:** Is it a caste or a phase? *Solution:* Distinguish between *permanent exclusion* (citizenship, residency) and *temporary exclusion* (age). Temporary exclusion requires a competency threshold, not just presence.
      *   **Compulsory Voting:** Is it a right or a duty? Is a fine a tax or a punishment? *Solution:* Test for proportionality and regressivity.

  3.  **Drafting the Procedure (The "Franchise Filter"):**
      *   *Name:* Needs to sound official but clear. "The Municipal Franchise Test."
      *   *Time:* 30 minutes means ~5 minutes per question + discussion. Let's aim for 5 distinct steps.
      *   *Step 1: Categorization.* Is this expanding the *who* (franchise) or changing the *how* (obligation)? This addresses the user's intuition that Compulsion is different from Rights.
      *   *Step 2: Jurisdiction & Stake.* Who is governed? This solves the "three states away" zoning problem. Focus on legal subjection.
      *   *Step 3: Capacity & Permanence.* Addresses age vs. caste. Can they exercise the right? Is the exclusion temporary?
      *   *Step 4: Coercion & Burden.* Specific to compulsion/fines. Is the penalty regressive? Is it a price or a punishment?
      *   *Step 5: The Democratic Paradox Check.* Acknowledge that *this* commission is deciding for people who can't decide for themselves (non-voters). Requires a supermajority or explicit admission of trusteeship.

  4.  **Refining the Steps for the Audience:**
      *   Avoid terms like "demos," "normative," "regressivity." Use "voters," "fairness," "cost to poor."
      *   Make the "Stop" conditions clear.
      *   Make the "Vote vs. Procedure" distinction clear.

  5.  **Applying the Procedure to the Three Proposals:**
      *   *Votes at 16:*
          *   Cat: Expansion.
          *   Jurisdiction: Yes, subject to city laws.
          *   Capacity: Cognitive maturity? Temporary exclusion? (Passes temporary test).
          *   Coercion: N/A.
          *   Paradox: We are deciding for them.
      *   *Non-citizen Residents:*
          *   Cat: Expansion.
          *   Jurisdiction: Yes, subject to laws/taxes.
          *   Capacity: Adult, permanent(ish) residence.
          *   Coercion: N/A.
          *   Paradox: We are deciding for them.
      *   *Compulsory Voting:*
          *   Cat: Obligation.
          *   Jurisdiction: N/A (already voters).
          *   Capacity: N/A.
          *   Coercion: $25 fine. Regressive? Yes. Price or Penalty? Penalty.
          *   Paradox: Forcing participation.

  6.  **Addressing the User's Specific Philosophical Anxieties:**
      *   *Boundary Problem:* Explicitly state in Step 1 that we accept the State/National baseline as the "container." We are adjusting the valve, not building the pipe.
      *   *Over-inclusion:* Step 2 limits "affected" to "subject to enforcement."
      *   *Age:* Step 3 distinguishes "waiting room" vs. "locked out."
      *   *Compulsion:* Step 4 hits the regressivity of the fine.

  7.  **Critique & Self-Correction (Simulated):**
      *   *Critique:* Is 30 minutes realistic?
      *   *Fix:* Keep questions binary where possible.
      *   *Critique:* Will the neighbors understand "Jurisdiction"?
      *   *Fix:* Define it as "Do city police/courts enforce rules on them?"
      *   *Critique:* The user wants to know if the procedure biases against their views.
      *   *Fix:* Be honest. If Step 4 kills compulsion because of regressivity, admit that's a value judgment about economic fairness embedded in the rule. If Step 3 passes 16-year-olds based on "temporary exclusion," admit that's a judgment about maturity.

  8.  **Final Polish:**
      *   Tone: Professional, direct, slightly academic but translated.
      *   Structure: The Procedure, The Application, The Confession (limitations).
      *   Ensure the "Stop" rules are clear.

  9.  **Drafting the Content (incorporating the "Boundary Problem" explicitly):**
      *   Need to make sure Step 1 acknowledges we can't solve the "who decides who decides" circle. We treat the *current* electorate as the trustees for the *potential* electorate.
      *   Need to ensure the "Age" question isn't just "are they smart enough" but "is the exclusion temporary."
      *   Need to ensure the "Compulsion" question highlights the fine's impact on the poor.

  10. **Final Review against constraints:**
      *   30 mins? Yes, 5 steps.
      *   No bibliography? Yes.
      *   Run on all 3? Yes.
      *   Admit bias/limitations? Yes.
      *   Define terms? Yes.

  *(Self-Correction during drafting)*: I initially thought about putting Compulsion in a separate track. But the prompt asks for *one* procedure to run on *any* franchise proposal. So the procedure must branch. Step 1 should sort "Right to Vote" vs "Duty to Vote."

  *(Refining the Boundary Problem)*: The user is worried about the circularity. The procedure must state: "We assume the State Constitution is the outer wall. We are arranging furniture inside." This avoids the infinite regress without ignoring it.

  *(Refining Age)*: The user asks: "Does temporary exclusion make it less objectionable?" The procedure shouldn't answer "Yes" definitively, but it should flag it as a *mitigating factor* that requires justification. I will frame it as: "Is the exclusion temporary for all?" If yes, it passes the 'caste' check, but still needs a 'competence' check.

  *(Refining Compulsion)*: The fine. Is it a price? If I pay $25 to not vote, is that a poll tax in reverse? The procedure needs to flag if the fine is regressive.

