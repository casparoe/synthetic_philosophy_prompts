          *   *Design:* Function, code, training objectives, architecture (the "engineer's view").
          *   *Intentional:* Beliefs, desires, goals (the "user's view" or "agent's view").
      *   *The Criterion:* Use Intentional Stance *only if* it compresses better than Design Stance *and* predicts out-of-sample.
      *   *The Safety Valve:* Every intentional claim needs a "Design Fallback" (what the training actually did) and a "Falsification Condition" (what observation kills the intentional claim).

  3.  **Drafting the Procedure (The "SOP"):**

