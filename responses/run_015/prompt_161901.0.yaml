      *   *Step 4: The Ledger.* Record Ascription + Design Fallback + Descent Trigger.
      *   *Step 5: Sign-off.* Who approves the risk?

      *Refining the "Fixed Vocabulary" constraint:* This is crucial to prevent "just-so stories." The vocabulary must be pre-approved (e.g., "Reward Hacking," "Sycophancy," "Context Window Overflow," "Goal Misgeneralization").

      *Refining the "Descent Rule":* When does Intentional fail? When the Design explanation becomes *shorter* or *more accurate*.

