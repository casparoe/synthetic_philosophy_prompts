answer: |-
  **Municipal Archives Committee – Special Session**
  **Subject:** Disposition of the Riverbend Urban Renewal Files (1972–1978)
  **Participants:** Dr. Liora Voss (Community Ethics Chair), Dr. Elias Kohn (Civic Planning Liaison)

  **DR. VOSS:** (Tapping a manila folder) This isn't just an appraisal sheet, Elias. It's a signature. Look at the date. October 14, 1974. Three days after the owner, Mr. Gurevich, filed an appeal. The value is dropped by forty percent. No inspection note. No justification. Just a initial and a slash. If we summarize this as "systemic devaluation," we tell the truth, but we tell it thinly. We turn a specific act of negligence into a sociological trend. Margalit would argue that institutions have a duty of care that survives the death of the victim. To aggregate this is to commit a second erasure.

  **DR. KOHN:** And I am arguing that the duty of care extends to the living, Liora. Specifically, the three thousand people currently living in Riverbend. Ninety percent of them moved in after 1990. They bought condos. They pay taxes. They are trying to build a neighborhood association. If you keep this complete paper trail in a searchable, public digital archive, you are not honoring the dead. You are handing the living a weapon. Every time a zoning dispute arises, every time a permit is denied, this archive becomes the subtext. "You are the beneficiaries of theft." It fixes the descendants of the displaced in an identity of grievance and the current residents in an identity of culpability they did not earn.

  **DR. VOSS:** Culpability isn't the point. Accountability is. You're framing this as if remembering is an act of aggression. It isn't. It's an act of recognition. If we condense these files into a summary report and box the originals, we are engaging in managed amnesia. You call it "moving on." I call it prioritizing the comfort of the present over the justice of the past. You want to forgive on behalf of people who aren't here to grant forgiveness. That's not charity, Elias. It's arrogance.

  **DR. KOHN:** No, it's psycho-social hygiene. You speak of justice, but look at the mechanism you're proposing. Perpetual availability. A searchable database of every slight, every bureaucratic slight-of-hand. You claim this is for the descendants. But most descendants are scattered. The ones who engage with this material—are they seeking justice, or are they seeking validation of a trauma they inherited but didn't experience? There is a risk here of moral vanity. A fetishization of the wound. If the archive remains open, the relationship to the past never matures. It stays raw. Rieff warned us that a culture that cannot forget is a culture that cannot live. Forgiveness requires a structured release. It requires closing the file.

  **DR. VOSS:** "Closing the file." That is the language of the bureaucracy that caused the harm. You say "moral vanity," I hear "inconvenience." You argue that remembering keeps the wound raw. I argue that *hiding* the evidence keeps the infection festering. You say my stance traps descendants in grievance. But if we anonymize or seal these records, we deny them the evidentiary basis for a *particular* relationship to their history. They don't get to know *who* signed the order. They don't get to know *why*. They get a plaque on a wall that says "Regrettable Events Occurred Here." That is abstract. Ethics live in the details. Without the details, there is no truth, only narrative. And you want to curate the narrative to make the current civic identity palatable.

  **DR. KOHN:** I want to make civic identity *possible*. You're treating the archive like a courtroom, Liora. It's not. It's a community space. If I am a young father in Riverbend today, and I look up my street's history and find a digitized memo describing my block as "blighted" and "economically non-viable" in 1975, what have I gained? I haven't gained justice for Mr. Gurevich. He's dead. I've gained a sense of alienation from my own home. You say my proposal is managed amnesia. I say yours is managed bitterness. You are asking the city to institutionalize a grudge. You want the institution to remember so the individuals don't have to forgive. But institutions don't forgive. People do. And people can't do that if the state keeps the ledger open on a screen in the lobby.

  **DR. VOSS:** The state *is* the continuity of the people. If the institution forgets, the community loses its moral compass. You're worried about alienation? Try telling the Gurevich family that their grandfather's life work was erased by a signature, and now the record of that signature is too "divisive" to view. You accuse me of vanity. But isn't it more vain to assume that our current peace is worth more than their past truth? You want a "structured release." But release without acknowledgment isn't forgiveness. It's expiration.

  **DR. KOHN:** And acknowledgment without cessation isn't memory. It's haunting. Look, I understand your commitment to the granular. I do. But we need a mechanism that acknowledges the harm without perpetuating the conflict. Here is a proposal: We create a tiered access protocol. The raw documents—the eviction orders, the internal memos—are sealed for a fixed term. Say, twenty-five years. They are preserved physically, but not digitized. Access is granted only to accredited researchers studying structural harm, with a specific project proposal. The general public gets the summary report. The aggregated data.

  **DR. VOSS:** (Pauses, looking at the folder) You're proposing a priesthood of memory.

  **DR. KOHN:** I'm proposing a digestion period.

  **DR. VOSS:** No. You're proposing that truth is a substance that needs to be diluted before it's safe for public consumption. This fails on principle, Elias. The harm was bureaucratic. It was done in quiet rooms, behind closed doors, using language the public wasn't meant to scrutinize. If we seal these records now, even for researchers, we are replicating the original architecture of the wrong. We are saying, "The public cannot be trusted with the full weight of its own history." Margalit argues that ethical memory requires a community of remembrance. By restricting access, you dissolve that community. You turn memory into a specialized academic commodity rather than a civic duty. If the archive isn't public, it isn't memory. It's storage.

  **DR. KOHN:** And if it's fully public, it isn't an archive. It's a tribunal. You reject my compromise because it doesn't satisfy the absolute demand for transparency. But I reject your absolute demand because it ignores the absolute demand for social cohesion. You say sealing replicates the original secrecy. I say total exposure replicates the original violence. It drags the past into the present without a filter.

  **DR. VOSS:** There is no filter for truth. There is only how much of it you can bear.

  **DR. KOHN:** And there is only how much of it a community can carry before it collapses under the weight.

  *(Silence settles over the table. The box of files sits between them, the lid half-open.)*

  **DR. VOSS:** If we vote on this today, what happens to the files?

  **DR. KOHN:** They stay in limbo. The committee is deadlocked. The status quo holds.

  **DR. VOSS:** The status quo is decay. Paper rots. Ink fades.

  **DR. KOHN:** Or it waits. For a time when the city is strong enough to look at it without flinching.

  **DR. VOSS:** (Closing the folder, but not latching it) The city didn't flinch when it signed these, Elias. It won't flinch now. It will just look away.

  **DR. KOHN:** Then we agree on one thing. The choice is ours. And whichever way we cut it, someone gets hurt.

  *(Voss leaves the folder on the table. Kohn does not move it. They both stand, leaving the box between their empty chairs.)*
