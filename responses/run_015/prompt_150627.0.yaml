answer: |-
  Here is the operational procedure, designed for a 30-minute live session, followed by the application to your three cases and an honest assessment of its limits.

  # The Term Triage Protocol (30-Minute Version)

  **Goal:** Classify the dispute as **Factual** (needs data), **Verbal** (go build), or **Conceptual/Normative** (escalate).
  **Mediator Stance:** You are not arbitrating the science. You are arbitrating the *structure of the disagreement*.

  ### Phase 1: Stakes & Paraphrase (0–10 mins)
  1.  **Write the Word:** Put the contested term in the center of the whiteboard.
  2.  **The "So What?" Test:** Ask each side: *"If we resolve this definition today, what specific line of code, database field, or sentence in the paper changes?"*
      *   *If nothing changes:* **Stop.** Verdict: **Go Build.** (The dispute is performative).
      *   *If something changes:* Proceed.
  3.  **The Elimination Test:** Ask Side A: *"State your claim without using the word."* Ask Side B: *"State your claim without using the word."*
      *   **Complication (1) One-Sided Paraphrase:** If Side A can paraphrase but Side B cannot, ask Side B: *"Is the term load-bearing because of its **meaning** or because it is a **variable** in your model/regulation?"*
          *   If **Variable/Regulation**: Mark as **Structural Load**. (Skip to Phase 3).
          *   If **Meaning**: Ask Side A to adopt Side B's paraphrase provisionally. Does the disagreement survive?
      *   **Complication (2) Load-Bearing:** If the term is hard-coded in a regulation or legacy model, acknowledge it. This is not a semantic dispute; it is a compatibility constraint. (Skip to Phase 3).
      *   **Complication (3) Strategic Vagueness:** If a party refuses to paraphrase ("It's complex," "It depends"), state: *"I am noting that the ambiguity appears to be serving a function. We will treat this as a non-factual dispute."* (Skip to Phase 3).

  ### Phase 2: The Case Test (10–20 mins)
  1.  **Generate Cases:** Propose two concrete scenarios (one actual, one hypothetical).
      *   *Example:* "In Scenario 1, the wetland is drained but high-value. In Scenario 2, it is pristine but low-value."
  2.  **Force Judgment:** Ask both sides: *"In Scenario 1, does the term apply? Yes or No."*
  3.  **Compare:**
      *   **If they disagree on the Yes/No:** The dispute is **Substantive**. Proceed to Phase 3.
      *   **If they agree on the Yes/No (for all cases):** But they still argue about the term...
          *   **Complication (4) The Nasty One:** They agree on the world, but disagree on the label. This is a **Conceptual Choice**. (Verdict: **Escalate**).

  ### Phase 3: Classification (20–30 mins)
  Map the findings to the three deliverables:

  *   **Path A (Factual Dispute):** They agree on the definition/paraphrase, but disagree on whether the *world* fits it (Phase 2 disagreement).
      *   **Verdict:** *"You genuinely disagree about X."*
      *   **Action:** Specify the data/analysis needed to settle the fact.
  *   **Path B (Verbal/Resolved):** They agree on the facts and the paraphrase, and the "disagreement" vanished when the word was removed (Phase 1 success).
      *   **Verdict:** *"You don't disagree."*
      *   **Action:** Pick one paraphrase, document it, **Go Build**.
  *   **Path C (Conceptual/Normative):** They agree on the facts/cases, but disagree on which definition/operationalization to *use* (Phase 2 agreement + Phase 1 Structural Load + Complication 4).
      *   **Verdict:** *"This isn't a question evidence can settle."*
      *   **Action:** **Escalate to Steering.** (The choice is political/pragmatic, not scientific).

  ---

  ### ⚠️ Mediator Warning: Where This is a Judgement Call
  You asked for honesty on where you lack authority.
  1.  **Structural vs. Semantic Load:** When a senior expert says, "I can't paraphrase this, it's essential to the model," you cannot verify if that's true without knowing the model. You must take their word. If they are bluffing to protect turf, this procedure will misclassify a Verbal dispute as Conceptual (Escalate). **You cannot fix this.**
  2.  **The "Right" Paraphrase:** If Side A's paraphrase subtly shifts the meaning, you might declare a dispute "Verbal" when it is actually "Substantive." If the room accepts the paraphrase without objection, proceed. If one side objects to the paraphrase, you must revert to Phase 2.
  3.  **Strategic Vagueness:** You can note it, but you cannot force commitment. If they refuse to commit, you *must* Escalate. You are not entitled to declare a dispute "Verbal" if one party refuses to play the elimination game.

  ---

  # Application to Your Cases

  Here is how you run the protocol live, where it stops, and exactly what goes on the one-pager.

  ### Case (a): Wetland "Degraded" (Ecologists vs. Economist)
  *   **Phase 1 (Paraphrase):** Ecologist: "Departure from pre-drainage baseline." Economist: "Reduction in service flow." Both can paraphrase. No structural load.
  *   **Phase 2 (Cases):** You propose a case: *A wetland drained 100 years ago (not baseline) but currently providing high flood protection (high service).*
      *   Ecologist: "Degraded."
      *   Economist: "Not degraded."
      *   **Result:** They disagree on the label for the *same facts*.
  *   **Phase 3 (Classification):** They agree on the history and the service flow (the facts). They disagree on which *metric* governs the label. This is not a factual dispute; it is a choice of framework.
  *   **Verdict:** **Escalate to Steering Committee.**
  *   **One-Pager Note:** "Parties agree on empirical state (history + service flow). Disagreement is over which baseline (historical vs. functional) governs the monitoring protocol. This is a policy/framework choice, not a data gap."
  *   **Sentence to say in the room:** "You both agree on the state of the wetland; you disagree on which ruler we use to measure it. That choice belongs to the Steering Committee, not a field study."

  ### Case (b): ML "Bias" (Statisticians vs. Clinicians)
  *   **Phase 1 (Paraphrase):** ML: "Disparate error rates." Clinicians: "Miscalibration in high-risk subgroup." Both paraphraseable.
  *   **Phase 2 (Cases):** You propose a model with equal error rates but poor calibration for Group X.
      *   ML: "Not biased."
      *   Clinicians: "Biased."
      *   **Result:** Disagreement on the label for the *same model stats*.
  *   **Phase 3 (Classification):** Similar to (a). They agree on the confusion matrix. They disagree on which mathematical property constitutes the harm. This is a normative definition of fairness/safety.
  *   **Verdict:** **Escalate to Steering Committee.**
  *   **One-Pager Note:** "Parties agree on model performance metrics. Disagreement is over which metric constitutes 'bias' for deployment clearance. This requires a normative decision on risk tolerance, not further validation."
  *   **Sentence to say in the room:** "The math isn't in dispute; the definition of harm is. You need a policy decision on which error type is unacceptable, not a better model."

  ### Case (c): Coastal "Resilience" (The "Nasty One")
  *   **Phase 1 (Paraphrase):** Both sides can describe the physical behavior without the word.
  *   **Phase 2 (Cases):** You propose specific storm surge scenarios.
      *   Side A: "System recovers."
      *   Side B: "System recovers."
      *   **Result:** **Agreement on all cases.** (Complication 4 triggered).
  *   **Phase 3 (Classification):** Since they agree on the cases but still fight, the word is doing *normative* work (signaling commitment to a specific research paradigm or funding stream). It is a Conceptual Choice.
  *   **Verdict:** **Escalate to Steering Committee.** (Validating your suspicion).
  *   **One-Pager Note:** "Parties agree on all physical outcomes and operational behaviors. The dispute is over which operationalization of 'resilience' is adopted for the grant deliverables. This is a strategic commitment, not a scientific uncertainty."
  *   **Sentence to say in the room:** "Since you agree on what the system will *do*, this fight is about which version of the concept gets the funding credit. That's a Steering decision."

  ---

  # What This Procedure Cannot Do

  You asked for honest limitations. If you run this perfectly, you will still mislabel deadlocks in these three scenarios:

  1.  **Paradigm Incommensurability:** If the two subgroups are operating in fundamentally different ontologies (e.g., a deep ecologist who believes nature has intrinsic value vs. a strict neoliberal economist), the "Case Test" will fail because they cannot even agree on what counts as a relevant case. The procedure will stall in Phase 2. **Output:** You will have to mark this as "Escalate," but the Steering Committee won't be able to solve it either. It's a culture clash, not a term clash.
  2.  **Hidden Power Dynamics:** If the "Strategic Vagueness" is coming from the most senior person in the room who funds the other group's salary, they will refuse the Elimination Test. The procedure will correctly identify this as "Non-Factual," but you cannot write "Escalate" without risking your own standing. You may be forced to write "Go Build" using *their* vague definition to keep the peace. The procedure detects the lie; it cannot punish it.
  3.  **The "Good Enough" Trap:** Sometimes a dispute is verbal (Path B), but one side *needs* the word to be ambiguous to publish in their specific journal. If you force a paraphrase (Go Build), you might block a publication. The procedure will say "Resolve it," but the institutional reality says "Keep it blurry." You will be right, and they will ignore you.

  **Final Advice:** Your value isn't solving the philosophy. It's giving the Steering Committee a one-pager that says *"Don't send this back to the scientists; there is no data that fixes this."* That saves them months. That is the operational win.
