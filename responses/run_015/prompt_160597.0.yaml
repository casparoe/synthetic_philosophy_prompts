prompt: |-
  Our city council is toying with a small-scale futarchy pilot for housing policy, and I got volunteered onto the little advisory group for it, so I'm trying to get my head around the details before the next meeting.

  The setup on the table: first a vote to fix a welfare index for the city (say median rent, vacancy rate and a count of displacement complaints, weighted 50/30/20), then two conditional prediction markets — one that pays out only if the council adopts the upzoning package, one that pays out only if it doesn't — and the package gets adopted iff the first market prices the index higher five years out.

  Two things I can't get straight, and I think they're connected.

  First: everyone keeps telling me the beauty of this is that the market hands you an unbiased estimate of the policy's effect. But a conditional market price is just an expectation over whatever actually happens in the branch where the policy passed. If upzoning only ever gets passed when rents were already about to flatten — because that's when its politically easy — then the "passed" branch looks great no matter what the upzoning does. One person on the group suggested fixing this by resolving the "didn't pass" branch against a basket of similar peer cities rather than against our own counterfactual. That seems to me to basically solve it, and cheaply. Is that right, or am I missing somthing?

  Second, and this is the bit I actually care about: if that peer-city trick works, do we even need the values vote? Couldn't we skip the fight about the 50/30/20 weights, run markets on maybe eight or ten candidate indices, and then run a second-tier market betting on which weighting best predicts how satisfied residents report being five years later? Then the market tells us the right values too, which seems definately better than nine people arguing about it in a chamber.

  Something here feels wrong and I can't tell whether its that the whole thing is circular or that it just pushes the same argument one level down. Which is it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** A member of a city council advisory group for a futarchy pilot on housing policy. They seem knowledgeable but cautious ("Something here feels wrong").
      *   **Context:** Small-scale pilot. Proposed mechanism: Vote on welfare index -> Conditional prediction markets (Upzone vs. Don't Upzone) -> Policy adopted if "Upzone" market predicts higher index value.
      *   **Core Questions:**
          1.  Is the "peer city" fix for selection bias (endogeneity) valid/cheap?
          2.  If the peer city fix works, can we marketize the *values* (the welfare index weights) too? Is this circular or just pushing the argument down?

  2.  **Deconstruct Question 1: Selection Bias & The Peer City Fix:**
      *   *The Problem:* The user correctly identifies the "endogeneity" or "selection bias" problem. If policy $P$ is only adopted when conditions $C$ are favorable, $E[Index | P]$ will be high even if $P$ does nothing. This is the classic "correlation $\neq$ causation" issue in futarchy.
      *   *The Proposed Fix:* Resolve the "Didn't Pass" market against a basket of similar peer cities instead of the city's own counterfactual.
      *   *Analysis:*
          *   *Pros:* It attempts to create a synthetic control group. If our city doesn't upzone, we look at what happened in City B, C, D (which are similar).
          *   *Cons:*
              *   *Basis Risk:* No two cities are identical. Peer cities might have different economic shocks, zoning laws, or demographics.
              *   *Manipulation:* Who picks the peers? If the market knows which peers are picked, they can bet on the peers' performance rather than the policy's effect.
              *   *Resolution:* How do you resolve the market *before* 5 years are up if you need peer data? (Actually, futarchy usually resolves after the fact, but the decision is made *now* based on the price). Wait, the decision is made *now* based on the *current price* of the 5-year outcome.
              *   *The Crucial Flaw:* The market price reflects $E[Index | Policy, Info]$. If the policy is *not* adopted, the market resolves on peer cities. But the decision rule is: Adopt if $Price(Pass) > Price(Fail)$.
              *   If $Price(Fail)$ is based on *other cities*, you are comparing $E[OurCity | Upzone]$ vs $E[PeerCity | StatusQuo]$. This is comparing apples to oranges. You need $E[OurCity | Upzone]$ vs $E[OurCity | No Upzone]$.
              *   Using peers for the "No" branch breaks the comparison. You need a *counterfactual* for *our* city. Peers are a proxy for that counterfactual, but introducing them into the *resolution criteria* creates a mismatch.
              *   *Better Approach:* The market needs to estimate the *causal* effect, not the conditional expectation. This usually requires specifying the condition carefully (e.g., "If we upzone *despite* high rents" vs "If we don't"). But that's hard to trade on.
              *   *Hanson's View:* Robin Hanson acknowledges this. The standard fix is not peer cities for resolution, but rather ensuring the market condition is specific enough or using "decision markets" where the resolution depends on the *actual* outcome of the chosen path, but the *price* reflects the expectation. Wait, if the policy isn't chosen, the "No" market usually gets voided or resolved on a proxy.
              *   *The User's Specific Proposal:* Resolve "Didn't Pass" against peer cities.
              *   *Verdict:* This is dangerous. It decouples the two markets. Market A says "Our city with upzoning." Market B says "Other cities without upzoning." If Other Cities are booming, Market B goes high, and we *don't* upzone, even if upzoning would have helped us more. It introduces external noise into the decision rule.
              *   *Correction:* The selection bias problem is real. The peer city fix helps estimate the counterfactual *for the sake of analysis*, but using it as the *resolution mechanism* for the decision market creates basis risk. A better way to handle selection bias in futarchy is often to make the condition "randomized" (not possible for council policy) or to rely on traders to model the causality (traders know politicians only pass easy bills). But traders might not correct for it if the correlation is strong.
              *   *Refinement:* Actually, the standard futarchy critique is exactly this: $E[Y|do(X)] \neq E[Y|X]$. The market prices $E[Y|X]$. To get $E[Y|do(X)]$, traders must infer causality. If the selection bias is obvious (politicians only pass when easy), traders *should* short the "Pass" market because they know the high index is due to the pre-existing condition, not the policy. *However*, if the resolution of the "Fail" market is on *our city*, traders can arbitrage the difference. If the resolution of the "Fail" market is on *peer cities*, that arbitrage link is broken.
              *   *Conclusion on Q1:* The peer city trick is *not* cheap or safe. It breaks the internal validity of the comparison. It solves the "no counterfactual" data problem but creates a "comparing different populations" decision problem.

  3.  **Deconstruct Question 2: Marketizing Values (The Welfare Index):**
      *   *The Proposal:* Don't vote on weights. Create markets on 8-10 indices. Run a second-tier market on which index best predicts "resident satisfaction."
      *   *The Intuition:* Let the market decide what we should value, not just how to achieve it.
      *   *The Problem:* This is the "Is-Ought" problem / Wireheading.
      *   *Analysis:*
          *   *Circularity:* You are defining the goal (satisfaction) by a metric (survey). Then you are optimizing the metric (index weights) to predict the goal.
          *   *Goodhart's Law:* Once a measure becomes a target, it ceases to be a good measure. If the market knows the "Satisfaction Index" is the ultimate arbiter, traders will optimize for *gaming the satisfaction survey*, not actually improving welfare.
          *   *Example:* If "satisfaction" is measured by a phone survey in 5 years, the market might favor policies that boost short-term mood or suppress complaints, rather than actual housing stability.
          *   *The "Pushing the Argument Down" Hypothesis:* The user suspects this just moves the fight. They are right. Who decides the "Satisfaction" metric? How is the survey weighted? (Renters vs. Owners?). This is just the values vote again, but more opaque.
          *   *Futarchy's Limit:* Futarchy is designed to separate *values* (vote) from *beliefs* (market). Mixing them undermines the governance structure. Markets are good at aggregating information about *facts* (what will happen), not *norms* (what should matter).
          *   *Wireheading:* If the market determines the weights to maximize "reported satisfaction," it might select weights that correlate with easy-to-manipulate survey responses rather than genuine well-being.
          *   *Conclusion on Q2:* This is definitely circular and dangerous. It conflates epistemic efficiency (markets know facts) with moral authority (democracy decides values). It pushes the normative fight into a less accountable mechanism (market manipulation of metrics).

  4.  **Synthesize the Response:**
      *   **Tone:** Professional, analytical, respectful of the pilot nature, but clear on the risks. Acknowledge the user's sharp intuition ("Something here feels wrong").
      *   **Structure:**
          1.  Validate the user's skepticism.
          2.  Address Q1 (Selection Bias & Peer Cities): Explain why the peer-city resolution breaks the arbitrage link and introduces basis risk. Explain how traders *should* handle selection bias (by pricing causality), but why peer cities as a resolution proxy is risky.
          3.  Address Q2 (Marketizing Values): Explain the Is-Ought distinction. Explain Goodhart's Law/Wireheading. Explain why this is "pushing the argument down" into a less transparent layer.
          4.  **Recommendation:** Stick to the standard Hanson model (Vote on Values, Market on Beliefs) but be very careful about the selection bias (maybe use a synthetic control for *analysis*, not *resolution*).

  5.  **Refining the Arguments (Self-Correction/Nuance):**
      *   *On Q1:* I need to be precise. The market price *is* $E[Index | Condition]$. If the condition "Council Adopts" is correlated with "Rent flattening anyway," the price will be high. Traders *should* realize this and lower the price *if* they know the "No Adopt" branch would also have high rents. But if the "No Adopt" branch resolves on *our city*, traders can see the correlation. If "No Adopt" resolves on *Peers*, traders can't arbitrage the difference between Our/No and Our/Yes as easily.
      *   *Actually, the bigger issue with Peer Cities:* If we resolve "No Adopt" on Peer Cities, we are asking: "Will Our City (with Upzoning) be better than Peer Cities (without)?" That's not the policy question. The question is "Will Our City (with Upzoning) be better than Our City (without)?" Using peers changes the denominator. It's a category error.
      *   *On Q2:* The "second-tier market" idea is essentially "Meta-Futarchy." The problem is the final resolution metric ("resident satisfaction"). That metric *is* a value judgment. Who writes the survey questions? That's the values vote in disguise. If the market optimizes for that, it optimizes for the survey, not the welfare.

  6.  **Drafting the Response (Mental Outline):**
      *   **Intro:** You're right to be uneasy. Both points touch on the fundamental limits of futarchy.
      *   **Part 1: The Peer City Fix (Selection Bias).**
          *   You identified the endogeneity problem correctly.
          *   The peer city fix breaks the "counterfactual comparison."
          *   Futarchy relies on $E[Y|A] > E[Y|B]$ for the *same* system.
          *   Swapping B for a different system (peers) introduces exogenous noise (e.g., a boom in peer cities stops your upzoning even if it would work).
          *   Better solution: Traders must price the *causal* impact, not the conditional correlation. This is hard, but changing the resolution criteria is worse.
      *   **Part 2: Marketizing Values.**
          *   This is the "Is-Ought" problem.
          *   Markets aggregate *beliefs*, not *preferences*.
          *   Risk of Goodhart's Law: Optimizing for the proxy (survey) rather than the thing (welfare).
          *   It pushes the normative fight to the survey design, which is less democratic than the weights vote.
          *   It creates a feedback loop where the market defines the goal it is trying to achieve.
      *   **Conclusion:** Stick to Vote on Values, Market on Facts. Be wary of the selection bias, but don't fix it by breaking the counterfactual.

  7.  **Final Polish:** Ensure the distinction between *resolution* (how the market pays out) and *decision rule* (how the policy is chosen) is clear. Ensure the tone is helpful for a council advisor. (Self-correction: Make sure to mention that "traders pricing causality" is the theoretical ideal but often fails in practice, which is why the user's worry is valid, but the peer-city fix is the wrong remedy).

  8.  *(Final Check)*: Did I answer "Which is it? Circular or pushing argument down?" -> It's both, but mostly it's a category error (Is-Ought) that leads to Goodharting. I should emphasize the "Wireheading" risk.

  9.  **Ready to write.**
answer: |-
  You have excellent instincts. Both of your hesitations point to genuine, well-documented failure modes in futarchy design. The short answer is: **The peer-city fix breaks the counterfactual comparison, and marketizing values invites Goodhart's Law (wireheading).**

  Here is the breakdown of why your intuition is correct and how to articulate this at the meeting.

  ### 1. The Selection Bias & The Peer-City "Fix"

  You are absolutely right about the selection bias problem. In econometric terms, this is **endogeneity**. If the council only upzones when the housing market is already cooling (to minimize political backlash), the conditional expectation $E[\text{Index} | \text{Upzone}]$ will be high regardless of whether upzoning *causes* the improvement.

  The proposal to resolve the "Didn't Pass" market against a basket of peer cities sounds clever, but it introduces a fatal flaw: **Basis Risk.**

  Futarchy works by comparing two counterfactuals for the *same system*:
  1.  $E[\text{Our City} | \text{Upzone}]$
  2.  $E[\text{Our City} | \text{No Upzone}]$

  The decision rule is: Adopt if (1) > (2).

  If you change the resolution of the second market to "Peer Cities," you are no longer comparing counterfactuals for your city. You are comparing:
  1.  $E[\text{Our City} | \text{Upzone}]$
  2.  $E[\text{Peer Cities} | \text{No Upzone}]$

  **Why this breaks the pilot:**
  Imagine a scenario where upzoning would massively help your city, but simultaneously, your peer cities enter a massive economic boom unrelated to zoning.
  *   Market 1 (Our/Upzone) prices the index at 100.
  *   Market 2 (Peers/No-Upzone) prices the index at 120 (because the peers are booming).
  *   **Result:** The council *rejects* the upzoning, not because it wouldn't work, but because the peer cities are doing well.

  You have imported external noise into the decision rule. The "peer city" data is useful for *human analysts* to estimate the counterfactual, but it should not be the *resolution mechanism* for the market. If you use it for resolution, you decouple the two markets, preventing traders from arbitraging the difference between "Our City with Policy" and "Our City without Policy."

  **The Better Argument:**
  The theoretical defense of futarchy here is that sophisticated traders *should* recognize the selection bias. If they know the council only passes upzoning when rents are flattening, they should short the "Upzone" market (or price it lower) because they know the "No Upzone" branch would have yielded similar results.
  *   **Your talking point:** "Using peer cities for resolution solves the data problem but breaks the decision logic. We end up optimizing for 'Better than our peers' rather than 'Better than our alternative.' We should keep the resolution on our city, but perhaps widen the trading window or provide explicit causal modeling guidance to traders to help them price out the selection bias."

  ### 2. Marketizing the Values (The Welfare Index)

  This is the deeper philosophical trap. Your suspicion that this is "circular" or "pushes the argument down" is correct, but it's worse: it risks **Wireheading** (Goodhart's Law).

  Futarchy relies on a strict separation of **Values** (What we want) and **Beliefs** (How to get it).
  *   **Values:** Decided by vote (democratic legitimacy).
  *   **Beliefs:** Decided by market (epistemic efficiency).

  **Why the "Second-Tier Market" fails:**
  If you run a market to determine the weights of the index based on which weights best predict "resident satisfaction," you have turned the *goal* into a *predictive variable*.

  1.  **The Proxy Problem:** "Resident satisfaction" is not raw welfare; it is a metric (e.g., a survey). Markets are extremely good at optimizing for metrics. If the market knows that a specific weighting of rent/vacancy/complaints correlates highest with survey scores, it will select that weighting.
  2.  **Manipulation:** Traders might realize that "displacement complaints" are easy to suppress (e.g., by making the complaint process harder) without actually reducing displacement. If the market learns that suppressing complaints boosts the "Satisfaction Index" more than lowering rents, it will select weights that prioritize suppressing complaints.
  3.  **The Normative Vacuum:** Who defines "resident satisfaction"? Is it a phone survey? An app? Weighted by property ownership? Deciding *how* to measure satisfaction is itself a values judgment. By outsourcing the index weights to the market, you aren't removing the values fight; you are hiding it inside the survey methodology, which is less transparent than a council vote.

  **Circularity vs. Pushing Down:**
  It is both.
  *   **Circular:** You are using the market to optimize the target the market is supposed to hit.
  *   **Pushing Down:** You move the normative fight from "What weights?" (public vote) to "What is the satisfaction survey?" (technocratic decision).

  **The Better Argument:**
  Markets aggregate *information*, not *preferences*. A market can tell you which policy will lower rent the most. It cannot tell you whether lowering rent is more important than reducing vacancy. That is a moral trade-off.
  *   **Your talking point:** "Markets are engines for discovering truth, not for determining morality. If we let the market set the weights based on a satisfaction proxy, we incentivize traders to game the satisfaction metric rather than improve actual welfare. We need democratic legitimacy for the 'Why' (the index weights) so we can use market efficiency for the 'How' (the policy choice)."

  ### Summary for your Meeting

  1.  **On Selection Bias:** The peer-city resolution is a category error. It compares our city to a different control group, introducing external economic noise into the decision rule. Keep the resolution on our city's actual outcomes; rely on trader sophistication (or explicit causal disclosure) to handle the selection bias.
  2.  **On Values:** Do not marketize the welfare index. That conflates *is* with *ought*. It invites traders to optimize for survey metrics rather than citizen welfare. The weights must be voted on to ensure democratic accountability; the market should only be used to predict the outcome of those weights under different policies.

  Your instinct that "something feels wrong" is the most valuable thing you're bringing to the group. Futarchy is powerful, but it breaks quickly when you try to use it to solve the problems it was designed to assume away (normative values and causal identification).
