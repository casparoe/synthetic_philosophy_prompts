      *   *Warranty Risk:* If I say "Same Failure Mode," Vendor B says "Our mode is pressure, not dilution. Not our defect, it's system design." If I say "Same Root Cause," Vendor B says "Prove it." Best to stick to "Identical physical outcome and telemetry precursor."

  10. **Final Polish:** Ensure the distinction between "Failure Mode" (the what) and "Failure Mechanism" (the how) is clear, as this resolves the semantic argument. (Actually, standard reliability terminology often swaps these. I should define my terms clearly). Let's use: *Mode* (Bearing Scoring), *Mechanism* (Oil Starvation), *Root Cause* (Dilution vs. Displacement).

