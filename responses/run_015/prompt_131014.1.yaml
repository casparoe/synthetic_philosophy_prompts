      *   **Fleet A Failure (F-07):** Refrigerant migration $\rightarrow$ oil dilution $\rightarrow$ cold start $\rightarrow$ oil film failure $\rightarrow$ bearing scoring/compressor death. *Fix:* Crankcase heater + startup delay. *Result:* 90% reduction.
      *   **Fleet B Observation:** 60 flagged. 4 torn down. All had bearing scoring (oil starvation). Oil analysis: *clean* (no dilution). Tech hypothesis: Defrost cycle $\rightarrow$ pressure transient $\rightarrow$ oil physically displaced (not diluted).
      *   **The Conflict:** Is this "the same failure mechanism"?
          *   *Engineer 1 (Yes):* Same part fails, same way, same signature, fix works (60 $\rightarrow$ 22). Bill vendor.
          *   *Engineer 2 (No):* Different parts, different sequence. Chain of events differs.
          *   *User (Me):* Fix works on Fleet C (different mechanism entirely) by masking. Fix targets symptoms, not root cause?
