answer: |-
  **Mark: 55/100 (Lower Second Class)**

  **General Comments:**
  This is a clearly written script that demonstrates a good familiarity with the secondary literature (Wallace, Watson) and the general trajectory of Strawson's project. You have structured the essay logically and engaged with the specific terminology of the prompt. However, the mark is limited by a significant misreading of Strawson's primary text in the third paragraph, which forms the core of your argument. You claim Strawson lacks internal resources to distinguish apt from inapt blame, which overlooks his detailed discussion of excuses and exemptions. Additionally, you did not fully meet the instruction to discuss a specific case in detail.

  **Point-by-Point Feedback:**

  **Paragraph 1:**
  *   **Strengths:** You accurately summarize Strawson's "change of subject" from metaphysics to practice and correctly identify the reactive attitudes as natural responses to quality of will. Your statement that determinism is irrelevant because the practice is grounded in human nature is correct.
  *   **Improvement:** The claim that "an agent is morally responsible when and because resentment toward her would be warranted" is slightly circular. Strawson argues that being a proper target of reactive attitudes *constitutes* responsibility, rather than responsibility being a precondition for the attitudes. This is a minor phrasing issue, but precision matters at this level.

  **Paragraph 2:**
  *   **Strengths:** You correctly distinguish the participant stance from the objective attitude and list appropriate examples of exemptions (child, psychopath).
  *   **Improvement:** You mention coercion here as a case for the objective attitude. Be careful: Strawson typically classifies coercion and accident under *excuses* (which operate within the participant stance) rather than *exemptions* (which invite the objective stance). This distinction becomes crucial for your argument in the next paragraph.

  **Paragraph 3 (Core Argument):**
  *   **Substantive Error:** This paragraph contains a fundamental misreading of *Freedom and Resentment*. You argue that Strawson "cannot say of any particular episode of resentment that it is mistaken" and that "what we actually feel is the standard." This is incorrect. Strawson explicitly provides internal resources for judging blame as inapt: the distinction between **excuses** and **exemptions**.
      *   If an agent acted by accident or under coercion (excuses), Strawson argues we see that the *quality of will* was not actually ill; thus, resentment is inapt *within the practice*, not because we step outside it.
      *   If the agent is a child or psychopath (exemptions), they are not participants.
      *   Therefore, Strawson *does* satisfy the internal adequacy condition using the "quality of will" standard internal to the participant stance. You have asserted he fails without engaging with his actual mechanism for distinguishing aptness.
  *   **Prompt Compliance:** The question asks you to "Discuss at least one case in which resentment seems inapt, and say what Strawson's account is committed to saying about it." You list cases (child, coercion) but do not discuss one in detail. You assert what Strawson says rather than demonstrating his commitment through a worked example (e.g., walking through how resentment is modified in a case of accidental harm).

  **Paragraph 4:**
  *   **Strengths:** It is good to see engagement with Wallace and Watson. You correctly identify that Wallace focuses on normative expectations/reasons-responsiveness and Watson on the distinction between attributability and accountability.
  *   **Weakness:** Because your premise in Paragraph 3 (that Strawson lacks internal norms) is flawed, your conclusion that Wallace "fills the gap" is weakened. Many Strawsonians argue Wallace is *developing* Strawson's internal norms (quality of will), not fixing a defect where none exists. Similarly, your summary of Watson suggests he views reactive attitudes as merely a "heuristic," which is a strong claim that needs more nuance; Watson argues they track attributability, which is distinct from the accountability required for blame.

  **Conclusion:**
  You have written a coherent essay with a clear voice, but the central philosophical claim rests on overlooking Strawson's distinction between excuses and exemptions. In an upper-level seminar, close textual accuracy on the primary author is essential. To improve, ensure you distinguish between claims that the practice *as a whole* cannot be justified externally (Strawson's view) and claims that *particular judgments* within the practice cannot be normatively assessed (which is not Strawson's view).

  **Suggested Reading for Revision:**
  *   Re-read Section II of "Freedom and Resentment" specifically regarding the taxonomy of excuses vs. exemptions.
  *   R. Jay Wallace, *Responsibility and the Moral Sentiments*, Chapter 4 (on how normative expectations function internally).
