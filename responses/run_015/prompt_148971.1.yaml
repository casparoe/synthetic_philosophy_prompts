  hey can you write a short story for me? it's about a documentary filmmaker, jules, who finds the private letters of a dead mathematician named clara voss — not famous, but really sharp. jules wants to make a biopic, but clara left this strange note saying that being cast as a "tragic genius" is a kind of posthumous harm, not cause it's false but cause it swaps your real messy self for a sellable archetype. jules has to decide wether to honor that "counter-narrative clause" even if it kills the drama. i want it to explore what we actually owe real dead people when we dramatize them, not just generic respect. please keep it under 350 words, and lead with one sentence giving the bottom line before you tell the story. thanks
