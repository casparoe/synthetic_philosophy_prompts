      *   *Check:* Least sure claim? I need to explicitly isolate one sentence.

      *   *Refinement on Tension (2) vs (3):* This is the big one. If behavioral evals can't distinguish compliance (2), how can they trigger regulation (3)? The journalist might argue regulation doesn't care about *why* it fails, just *that* it fails. But if deception hides the failure (4), then (3) is weak. I need to press on the "deception hides capability" angle.
      *   *Refinement on Photocopy:* The Photocopy Effect suggests *systemic* risk. This actually helps (5) in a way—if everyone is copying the same errors, regulation on data sources might work. But it hurts (3) because evals lose statistical power.
      *   *Refinement on Heavy Lifter:* Is it (2) or (6)? (6) dissolves the problem, (2) makes it hard. (2) feels more active in the argument structure. I'll stick with (2).

  9.  **Final Polish:** Ensure the tone is collaborative ("audit") rather than authoritative ("grading"). Ensure the confidence markers are clear.

