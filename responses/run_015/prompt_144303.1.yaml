      *   *Analysis:* It does fall out of (ii). If distinct -> weakly discernible -> irreflexive relation. Co-location implies only reflexive spatial relations. So co-location implies identity (by contraposition of ii).
      *   *So (vii) is safe.*

      *   *Re-evaluating the "Single Revision":*
      *   If (vi) contradicts (v), dropping (vi) cleans up the most.
      *   Does (vi) do dialectical work? User: "I take it to improve on Black's."
      *   Is it necessary? Black's original case (static spheres) already establishes (i). (vi) tries to block the "frozen universe" objection.
