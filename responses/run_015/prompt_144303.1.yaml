      *   *But:* If I can have two distinct spheres with no qualitative difference (i), why can't I have two distinct worlds with no qualitative difference (Shift)?
      *   *Answer:* (iv) says I *can't*. "A permutation of indiscernibles is not a difference."
      *   *So:* (i) allows distinct indiscernible *objects*. (iv) disallows distinct indiscernible *worlds*.
      *   *Is this consistent?* Yes, if objects are parts and worlds are wholes, and the principle applies differently.
      *   *So (i) vs (v) is manageable via Structuralism.*

      *   *Back to (vi) vs (v).*
      *   Relationism (v) + Homogeneous Spheres + Rotation (vi).
      *   Standard view: Relationism cannot account for rotation of a single body (or symmetric system) without absolute space or distant masses.
      *   User claims: "there is a real asymmetry."
