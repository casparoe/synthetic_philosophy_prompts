      *   Consistency trumps justification. If (vi) is metaphysically incompatible with (v), (vi) must go or change.
      *   However, the User's suspicion about (i) vs (v) is also profound. If they rely on the Shift Argument *as traditionally formulated*, they are inconsistent. They need to reframe the argument.
