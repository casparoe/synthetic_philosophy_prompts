          *   *Verdict:* It is *related* to heritability (specifically, it approximates the genetic variance component), but it shifts focus from the *proportion* to the *absolute magnitude* of inequality. It's a valid distinction, but the draft needs to be careful not to imply we can measure this without actually doing the intervention. It's a thought experiment, not a calculation.

      *   **Point 4: Weakest Paragraph.**
          *   *Candidate 1:* Para 1 (Definitions). A bit dry. $V_A/V_P$ might lose non-specialists.
