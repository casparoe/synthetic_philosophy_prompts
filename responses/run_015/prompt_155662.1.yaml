prompt: |-
  I sit on the methodology review panel for an interdisciplinary research institute that funds cognitive-science and artificial-intelligence projects, and recently we have seen a wave of proposals that include what applicants call phenomenal consciousness assays — structured protocols asking human subjects or artificial systems to report the contents of awareness, then treating those reports as direct measurements of a unified experiential stream. Many implicitly presuppose what Dennett criticized as the Cartesian theater: a central, unitary locus where experience comes together for a single observer. Others claim metaphysical neutrality yet still embed theater-style assumptions, such as a canonical temporal ordering of conscious events or the existence of an internal original experience that verbal reports may approximate or distort. I need a reusable evaluation procedure my panel can apply to determine whether a given assay protocol is conceptually compatible with Dennett's multiple-drafts model — distributed, parallel processing with no central audience and no fact of the matter about which draft is canonical until later mechanisms fix a narrative — without requiring every reviewer to be a philosopher of mind.

  Please structure this as an ordered decision procedure: the specific questions a reviewer asks about the proposal in sequence, what counts as a sufficient answer at each stage, explicit stop points where the protocol either clears the bar, fails for conceptual incoherence, or must be handed to human judgment because the issue involves values rather than consistency, and clear flagging of where the procedure will misfire. Address in particular: how the protocol handles temporal sequencing of reported contents, since the multiple-drafts model denies a single timeline of consciousness; whether the protocol permits competing, unreconciled drafts of the same stimulus rather than forcing unified narrative reconstruction; how it treats post-hoc confabulation versus direct access without assuming a hidden theater; and how to evaluate protocols that claim to be purely behavioral and make no metaphysical commitments.

  Ground the distinctions in Dennett's actual framework — no central observer, no unique real draft prior to narrative fixation, and the idea that asking what was really experienced is often asking an ill-formed question — but translate them into operational criteria accessible to reviewers with only basic philosophy-of-mind background. Include a small set of test protocol descriptions the reviewer can apply, with worked examples showing both a passing case and a failing case. Explicitly mark the points where judgment cannot be eliminated. Finally, include one worked case where the procedure returns a negative verdict on a protocol that is otherwise methodologically rigorous and practically appealing — explain precisely why the conceptual flag is warranted despite the protocol's strengths — and write the response in polished American English.
reasoning: |-
  Here's a thinking process that leads to the suggested evaluation procedure:

  1.  **Analyze the Request:**
      *   **Role:** Methodology Review Panel Member for an interdisciplinary research institute (Cognitive Science/AI).
      *   **Problem:** Wave of proposals using "phenomenal consciousness assays" that implicitly assume the Cartesian Theater (Dennett's target), even if claiming neutrality.
      *   **Task:** Create a reusable, ordered decision procedure (checklist/flowchart style) for reviewers to evaluate if a protocol is compatible with Dennett's Multiple Drafts Model (MDM).
      *   **Constraints:**
          *   Must be accessible to non-philosophers.
          *   Must address specific issues: temporal sequencing, competing drafts, confabulation vs. access, behavioral claims without metaphysical commitments.
          *   Must ground distinctions in Dennett's actual framework (no central observer, no unique real draft, ill-formed questions about "real experience").
          *   Must include stop points (Pass, Fail, Human Judgment).
          *   Must flag where the procedure misfires.
          *   Must include test protocol descriptions (Pass/Fail examples).
          *   Must include one worked case where a rigorous protocol fails conceptually.
          *   Tone: Polished American English.

  2.  **Deconstruct Dennett's Multiple Drafts Model (MDM):**
      *   *Core Tenet:* No Cartesian Theater. No place where "it all comes together."
      *   *Processing:* Parallel, distributed, fragmented.
      *   *Time:* No single objective timeline of subjective experience. "Stalinesque" (editing before consciousness) vs. "Orwellian" (editing after consciousness) is a false dichotomy.
      *   *Reports:* Verbal reports are not readouts of a pre-existing internal state; they are themselves performances that fix the narrative.
      *   *Authority:* The subject is not the ultimate authority on their own consciousness (heterophenomenology).
      *   *Reality:* There is no "fact of the matter" about what was experienced prior to the narrative fixation.

  3.  **Drafting the Decision Procedure (Step-by-Step):**
      *   *Goal:* Translate philosophical concepts into methodological questions.
      *   *Step 1: The Locus of Integration.* Does the assay assume a single place/time where experience happens? (Target: Cartesian Theater).
      *   *Step 2: Temporal Ordering.* Does the assay assume a precise timestamp for experience independent of the report? (Target: Single Timeline).
      *   *Step 3: Narrative Fixation.* Does the assay treat the report as a measurement of a prior state or as the fixation of the state? (Target: No Unique Real Draft).
      *   *Step 4: Conflict & Fragmentation.* Does the assay allow for contradictory data without forcing unity? (Target: Distributed Processing).
      *   *Step 5: Metaphysical Neutrality Check.* Does "neutrality" hide assumptions? (Target: Operational Criteria).

  4.  **Refining the Criteria for Non-Philosophers:**
      *   Avoid jargon like "qualia" or "intentional stance" unless defined simply.
      *   Use terms like "data stream," "report generation," "timeline."
      *   Make the "Stop Points" clear (Green Light, Red Light, Yellow Light).

  5.  **Addressing Specific Prompt Requirements:**
      *   *Temporal Sequencing:* Need a question about reaction times vs. experience times.
      *   *Competing Drafts:* Need a question about data reconciliation (do they average out contradictions?).
      *   *Confabulation:* Need a question about the status of the report (truth-tracking vs. narrative construction).
      *   *Behavioral Claims:* Need to check if "behavior only" still implies an inner witness.

  6.  **Developing Test Cases:**
      *   *Passing Case:* A protocol that treats reports as behavioral data, acknowledges latency, allows inconsistency.
      *   *Failing Case (The Rigorous One):* A high-precision neural correlation study that assumes a specific millisecond window of "conscious entry." This fits the requirement for a methodologically strong but conceptually flawed example.

  7.  **Identifying Limitations (Where it Misfires):**
      *   The procedure can't solve the Hard Problem.
      *   It can't adjudicate between MDM and other theories (it only checks *compatibility* with MDM, not truth).
      *   It requires some interpretation (the "Human Judgment" points).

  8.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Set the context (Institute, MDM framework).
      *   *The Procedure:* Numbered steps with Questions, Sufficient Answers, and Decision Nodes.
      *   *The "Yellow Zones":* Explicitly mark where philosophy bleeds into values.
      *   *Test Cases:* Write them clearly.
      *   *The "Rigorous Failure":* Ensure it looks like good science but bad philosophy (according to MDM).
      *   *Conclusion:* Summary of utility.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Dennett says X." I need to make it an *operational* check. Instead of "Is there a Cartesian Theater?", ask "Does the protocol designate a specific neural or temporal locus where stimulus becomes experience?"
      *(Refining the Temporal Issue)*: Dennett argues against the idea that we can distinguish between editing before experience and editing after. The protocol shouldn't try to pinpoint the *exact moment* consciousness occurs.
      *(Refining the Neutrality Issue)*: Many say "we just measure behavior." But if they treat behavior as a *window* into a hidden stream, that's the theater. If they treat behavior as the *constitution* of the stream, that's MDM. I need to make this distinction clear.

  9.  **Final Review against Constraints:**
      *   Ordered decision procedure? Yes.
      *   Specific questions? Yes.
      *   Sufficient answers? Yes.
      *   Stop points? Yes.
      *   Flag misfires? Yes.
      *   Temporal/Competing/Confabulation/Neutrality addressed? Yes.
      *   Grounded in Dennett? Yes.
      *   Test cases (Pass/Fail/Rigorous Fail)? Yes.
      *   Polished American English? Yes.

  10. **Final Polish:** Check tone (professional, authoritative, helpful). Ensure the distinction between "methodological rigor" and "conceptual compatibility" is sharp in the failure case. (Proceed to generate output).

  *(Self-Correction on the "Rigorous Failure" case)*: Make sure it's not just "they used fMRI." It needs to be about how they interpret the timing. A protocol that tries to measure the "onset of consciousness" to the millisecond is the classic trap.

  *(Self-Correction on "Human Judgment")*: Be honest that MDM itself is a theory, not a fact. The panel is checking for *compatibility*, not truth. But the prompt asks to evaluate *compatibility with MDM*. I must stick to that mandate.

  Let's assemble the document.cw
answer: |-
  # Evaluation Procedure for Consciousness Assay Protocols
  **Compatibility Check: Dennett's Multiple Drafts Model (MDM)**

  **Purpose:** To assist review panelists in determining whether a proposed methodology for measuring or assaying consciousness is conceptually compatible with the Multiple Drafts Model (MDM). This procedure does not adjudicate the truth of MDM but ensures that funded projects do not inadvertently rely on the "Cartesian Theater" model that MDM explicitly rejects.

  **Target Audience:** Reviewers with backgrounds in cognitive science, AI, or neuroscience, but not necessarily philosophy of mind.

  **Core MDM Principles for Reviewers:**
  1.  **No Central Observer:** There is no single place in the brain where experience "happens."
  2.  **No Single Timeline:** There is no fact of the matter about the precise order of conscious events independent of the mechanisms that report them.
  3.  **Reports Fix Reality:** Verbal or behavioral reports do not measure a pre-existing inner movie; they are the processes that finalize the narrative.

  ---

  ## Part I: The Decision Procedure

  Reviewers should proceed through the following four stages sequentially. At each stage, determine if the proposal meets the **Sufficient Answer** criteria.

  ### Stage 1: The Locus of Integration
  **Question:** Does the protocol designate a specific neural locus, computational module, or temporal window as the place or time where stimuli *become* conscious experiences?

  *   **Look for:** Claims identifying a "threshold of awareness," a "consciousness onset latency," or a specific brain region (e.g., PCC, frontoparietal network) described as the "seat" or "generator" of unified experience.
  *   **Sufficient Answer (MDM Compatible):** The proposal treats neural activity as *correlates* or *contributors* to content fixation without claiming any single site is where the "viewer" sits. It acknowledges that different features (color, motion, meaning) may be processed at different rates without a final assembly point.
  *   **Insufficient Answer (Cartesian Theater):** The protocol assumes a specific moment or location where disparate inputs merge into a single "picture" for the subject to view.
  *   **Decision Node:**
      *   *Pass:* Proceed to Stage 2.
      *   *Fail:* **Stop.** Flag as "Conceptually Incompatible: Assumes Central Locus."
      *   *Unclear:* Proceed to Stage 2 but flag for Panel Discussion.

  ### Stage 2: Temporal Sequencing and Ordering
  **Question:** Does the assay assume a canonical, objective timeline of subjective experience that exists independently of the subject's report?

  *   **Look for:** Methodologies that attempt to timestamp the *experience* itself (e.g., "Subject experienced the flash at 200ms, prior to the report at 400ms") or that treat discrepancies between stimulus time and report time as "measurement error" rather than structural features of processing.
  *   **Sufficient Answer (MDM Compatible):** The protocol treats the temporal order of events as *narrative order* established by the report mechanism. It accepts that asking "when exactly did the subject feel X?" may be an ill-formed question if the mechanisms for discriminating X are distributed.
  *   **Insufficient Answer (Cartesian Theater):** The protocol seeks to measure the "true" time of consciousness, assuming the report is a delayed readout of a precise internal event.
  *   **Decision Node:**
      *   *Pass:* Proceed to Stage 3.
      *   *Fail:* **Stop.** Flag as "Conceptually Incompatible: Assumes Single Timeline."
      *   *Unclear:* Proceed to Stage 3.

  ### Stage 3: Narrative Fixation and Confabulation
  **Question:** How does the protocol treat the subject's report (verbal, button press, or AI output) in relation to the "actual" experience?

  *   **Look for:** Distinctions between "true experience" and "reported experience." Does the protocol assume the report might distort a hidden, perfect internal original?
  *   **Sufficient Answer (MDM Compatible):** The report is treated as the *final draft*. There is no "hidden original" behind the report. Confabulation is not an error in transmission but a feature of how the narrative is constructed. The protocol does not attempt to correct the report to reveal a "truer" underlying state.
  *   **Insufficient Answer (Cartesian Theater):** The protocol assumes the subject has privileged access to an internal stream that the report approximates. It treats inconsistencies as noise to be filtered out to find the "real" signal.
  *   **Decision Node:**
      *   *Pass:* Proceed to Stage 4.
      *   *Fail:* **Stop.** Flag as "Conceptually Incompatible: Assumes Privileged Access."
      *   *Human Judgment Required:* If the proposal claims "Metaphysical Neutrality" (see Part II, Section 3).

  ### Stage 4: Fragmentation and Unity
  **Question:** Does the protocol force data into a unified narrative, or does it allow for competing, unreconciled drafts?

  *   **Look for:** Data analysis plans that average out contradictory responses or force a binary "conscious/unconscious" classification on ambiguous trials.
  *   **Sufficient Answer (MDM Compatible):** The analysis allows for parallel, contradictory contents to coexist in the data (e.g., acknowledging that one subsystem detected a threat while another detected safety, without forcing a single "conscious verdict").
  *   **Insufficient Answer (Cartesian Theater):** The methodology presupposes that for any given moment, there is one fact of the matter about what the system is experiencing.
  *   **Decision Node:**
      *   *Pass:* **Protocol Cleared.**
      *   *Fail:* **Stop.** Flag as "Conceptually Incompatible: Assumes Unified Observer."

  ---

  ## Part II: Special Handling & Limitations

  ### 1. Handling "Metaphysical Neutrality" Claims
  Many proposals will state: *"We make no claims about consciousness; we only measure behavior."*
  *   **The Trap:** If the proposal treats behavior as a *window* into a hidden inner state, it is not neutral; it is implicitly Cartesian.
  *   **The Test:** Apply Stage 3. If the behavioral report is treated as a *measurement* of an internal variable, it fails. If the behavioral report is treated as the *constitution* of the variable (heterophenomenological stance), it passes.
  *   **Judgment Point:** Reviewers must decide if the language implies a "ghost in the machine" driving the behavior. This cannot be fully automated.

  ### 2. Where the Procedure Misfires (Limitations)
  *   **The Hard Problem:** This procedure checks for *structural* compatibility with MDM. It does not solve the problem of why processing feels like anything at all. A protocol can pass this check and still fail to explain qualia.
  *   **Theory Lock-in:** This procedure privileges Dennett's framework. A proposal might be scientifically valid under a different theory of mind (e.g., Global Workspace Theory with a slightly different ontological commitment) but fail here. Reviewers must acknowledge they are evaluating for *MDM compatibility*, not universal truth.
  *   **AI Systems:** When applied to AI, "reports" are text outputs. MDM suggests treating these as drafts without assuming an inner "AI mind." If a proposal claims to measure "AI suffering" based on text outputs assuming an inner feel, it fails Stage 3.

  ### 3. Points Requiring Human Judgment
  *   **Stage 3 (Neutrality):** Determining whether "measurement language" is merely shorthand or a deep ontological commitment requires interpretive judgment.
  *   **Stage 4 (Fragmentation):** Deciding whether data averaging is a statistical necessity or a philosophical erasure of competing drafts requires context-sensitive review.

  ---

  ## Part III: Test Protocol Descriptions

  ### Case A: The Passing Protocol (Compatible)
  **Description:** A study using rapid serial visual presentation (RSVP). Subjects report what they saw. The analysis treats the report as the primary data point. The authors explicitly state: "We do not assume the report reflects a pre-existing image in the mind. We treat the report as the finalization of the perceptual narrative. We acknowledge that different features (color vs. shape) may be reported with different latencies and do not attempt to align them to a single 'moment of awareness'."
  **Verdict:** **PASS.**
  **Reasoning:** Clears Stage 1 (no single locus), Stage 2 (no single timeline), and Stage 3 (report fixes reality).

  ### Case B: The Failing Protocol (Incompatible)
  **Description:** A study using binocular rivalry. The goal is to find the "neural signature of conscious entry." The protocol assumes there is a specific millisecond where the suppressed image becomes the dominant conscious image. Subjects press a button the moment they "see" the change. The analysis subtracts reaction time to calculate the "true time of experience."
  **Verdict:** **FAIL (Stage 2).**
  **Reasoning:** Assumes a canonical timeline and a "true time of experience" independent of the reporting mechanism. This presupposes the Cartesian Theater (an inner clock tracking the inner movie).

  ### Case C: The Rigorous Failure (Methodologically Strong, Conceptually Flawed)
  **Description:** A high-precision neurofeedback study.
  **Method:** Subjects are trained to modulate activity in the anterior cingulate cortex (ACC). The protocol posits that ACC activity *is* the "locus of conflict monitoring awareness."
  **Rigor:** The fMRI methods are state-of-the-art. The statistical power is high. The behavioral tasks are well-controlled.
  **Claim:** "We will measure the intensity of the subject's conscious conflict by the magnitude of ACC activation, calibrating the BOLD signal against subjective ratings to create a 'Conscious Conflict Index'."
  **Verdict:** **FAIL (Stage 1 & 3).**
  **Reasoning:**
  1.  **Locus Assumption:** It identifies a specific brain region as the place where awareness happens (Stage 1 Fail). Under MDM, conflict monitoring is distributed; no single region holds the "experience" of conflict.
  2.  **Measurement Assumption:** It treats the BOLD signal and the rating as two measures of a *third*, hidden thing (the "Conscious Conflict"). Under MDM, the rating and the neural activity are part of the same distributed process; there is no third thing being measured.
  **Why Fund Anyway?** The panel might fund this for its clinical utility (neurofeedback works even if the theory is wrong), but it must be flagged as *not* testing MDM-compatible consciousness theories. It is measuring behavioral/neural correlates, not "consciousness" as defined by MDM.

  ---

  ## Part IV: Reviewer Summary Sheet

  **Protocol ID:** _______________
  **Reviewer:** _______________

  | Stage | Criterion | Pass | Fail | Unclear |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **No Central Locus:** Does it avoid pinpointing a single "seat" of experience? | [ ] | [ ] | [ ] |
  | **2** | **No Single Timeline:** Does it avoid timestamping "true" experience? | [ ] | [ ] | [ ] |
  | **3** | **Report as Fixation:** Is the report treated as the draft, not a readout? | [ ] | [ ] | [ ] |
  | **4** | **Allow Fragmentation:** Does it permit contradictory data drafts? | [ ] | [ ] | [ ] |

  **Final Recommendation:**
  [ ] **Conceptually Compatible** (Proceed to scientific merit review)
  [ ] **Conceptually Incompatible** (Reject or request major theoretical revision)
  [ ] **Requires Panel Discussion** (Ambiguous metaphysical commitments)

  **Notes on Judgment Calls:**
  *(Use this space to detail why a "Neutral" claim was accepted or rejected in Stage 3)*
  ____________________________________________________________________________
  ____________________________________________________________________________

  ---

  ### Implementation Note for the Panel
  This procedure is a filter, not a verdict on scientific quality. A protocol may fail this check (like Case C) and still be excellent neuroscience. However, if the Institute's mandate is to fund research compatible with the Multiple Drafts Model, this procedure ensures tax dollars do not inadvertently support the Cartesian Theater under the guise of neutrality.
