prompt: |-
  I'm the deputy head of our national statistics office and on Friday I'm giving the after-dinner speech at a reception for the fact that we just cracked the top five of the ladder-based world happiness ranking for the first time ever. The room will be about a third ministers and journalists who want a victory lap, a third local mayors who are already talking about "the wellbeing target", and a third survey people who know exactly what the ladder question asks and how much of our score is just log GDP per capita and social support doing the heavy lifting. I need seven minutes that doesn't lie to anybody, doesn't kill the party, and doesn't hand the mayors a number to optimize — because the second a ranking becomes a target you get Goodhart plus a pile of people quietly gaming a questionnaire.

  One thing I haven't decided: on the experienced-wellbeing measures, how people say their yesterday actually felt, we're somewhere around fortieth. Should that go in the speech, and if so how do I land it without telling a room full of citizens their lives are worse than they think?

  Write the speech, then afterwards tell me which theory of wellbeing I ended up smuggling in and where the seams are, so I know before the philosophers in the room do.
reasoning: |-
  Here's a thinking process that leads to the suggested speech and analysis:

  1.  **Analyze the Request:**
      *   **Speaker:** Deputy Head of National Statistics Office.
      *   **Occasion:** After-dinner speech at a reception celebrating cracking the top 5 in the World Happiness Report (ladder-based).
      *   **Audience:**
          *   1/3 Ministers & Journalists (want a victory lap/political capital).
          *   1/3 Local Mayors (want targets/KPIs to optimize, risk of Goodhart's Law).
          *   1/3 Survey Methodologists/Statisticians (know the mechanics, know GDP & Social Support are doing the heavy lifting, skeptical).
      *   **Constraints:**
          *   Duration: ~7 minutes (approx. 900-1000 words spoken at a moderate pace).
          *   Tone: Celebratory but honest (no lying), engaging (don't kill the party), cautious (don't give mayors a simple number to game).
          *   Specific Dilemma: Include the "experienced wellbeing" (affective) ranking (~40th)? If so, how to frame it without depressing the room or invalidating the achievement?
      *   **Post-Speech Task:** Identify the theory of wellbeing smuggled in and point out the "seams" (weaknesses/compromises).

  2.  **Determine the Strategy:**
      *   **The Hook:** Acknowledge the achievement warmly. Validate the Ministers/Journalists.
      *   **The Pivot:** Address the Statisticians subtly. Acknowledge the mechanics without getting bogged down in regression analysis.
      *   **The Warning:** Address the Mayors. Discourage narrow targeting without saying "don't do your jobs." Use the Goodhart's Law concept without necessarily naming it (keep it accessible).
      *   **The Dilemma (Experienced Wellbeing):** Yes, include it. Ignoring it insults the statisticians and creates a false narrative. Framing it as "the next frontier" or "the difference between evaluating life and living it" bridges the gap. It validates the achievement (evaluation) while pointing to future work (experience).
      *   **The Theory:** Needs to be a hybrid. Pure Hedonism is too shallow for the top 5 claim. Pure Eudaimonia is too hard to measure. The "Ladder" is Cantril (Life Evaluation). The "Yesterday" is Affective (Hedonic). The speech needs to weave these into a "Capabilities" or "Pluralist" approach without using academic jargon.
      *   **Tone Check:** Witty, humble, authoritative but not arrogant.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Thank the hosts. Acknowledge the Top 5. Let the ministers have their moment.
      *   *The Statistician's Nod:* Acknowledge the "Ladder." Admit what drives the score (GDP, Social Support) but frame it as *foundations*, not the whole house. This satisfies the techies without boring the politicos.
      *   *The Mayor's Warning:* This is crucial. Don't give them a target. Talk about "chasing the score vs. building the society." Use a metaphor (gardening vs. measuring plants).
      *   *The Experienced Wellbeing Reveal:* Frame it as the "plot twist." We are good at *assessing* our lives, but how do we *feel* day-to-day? Position this not as a failure, but as the next challenge. "We have built a good life; now let's make sure it feels good to live it."
      *   *Closing:* Raise a toast. To the data, but more importantly, to the people behind it.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is 7 minutes enough?
      *   *Fix:* Keep sentences punchy. Avoid long statistical explanations.
      *   *Critique:* Is the Goodhart warning too blunt?
      *   *Fix:* Make it about "complexity" rather than "gaming."
      *   *Critique:* Is the experienced wellbeing mention too depressing?
      *   *Fix:* Frame it as "stress of success" or "the pace of life." It's a side effect of the things that made us successful (productivity), not a failure of the state.

  5.  **Finalizing the Speech Text:** (Aiming for ~950 words).
      *   *Key phrase:* "The view from the top of the ladder vs. the feeling of the rungs."
      *   *Key phrase:* "Don't optimize the metric, optimize the meaning."

  6.  **Analyzing the Theory (Post-Speech):**
      *   *What did I actually argue?* I validated the Cantril Ladder (Life Evaluation) but elevated Experienced Wellbeing (Hedonia) as a necessary complement. I implicitly argued against using GDP as a proxy, but acknowledged its role.
      *   *Theory:* It's a **Pluralist Welfarist** approach, leaning heavily on **Daniel Kahneman's distinction between the Experiencing Self and the Remembering Self**, with a dash of **Amartya Sen's Capabilities Approach** (freedom to achieve).
      *   *The Seams:* The tension between "evaluation" (top 5) and "experience" (40th) is glossed over as a "next step" rather than a fundamental contradiction. If people rate their lives high but feel bad daily, is the policy working? The speech sidesteps this philosophical conflict to keep the peace. Also, the warning to mayors is rhetorical; they will still try to game it.

  7.  **Final Review against Constraints:**
      *   7 minutes? Yes, word count looks right.
      *   No lying? Acknowledged the drivers and the lower affective rank.
      *   No killing the party? Framed as celebration + challenge.
      *   No easy targets for mayors? Explicitly warned against narrowing focus.
      *   Theory analysis included? Yes.

  8.  **Final Polish:** Check the voice. Needs to sound like a senior civil servant—slightly weary but proud, precise but diplomatic. (Proceed to generate output).

  *(Self-Correction on Word Count)*: A 7-minute speech is usually around 900-1000 words spoken at a measured pace. I need to ensure it's not too short. I will expand on the metaphor of the ladder and the ground.

  *(Self-Correction on the "Experienced Wellbeing" dilemma)*: I need to make sure I don't say "you are miserable." I need to say "life is fast." The gap between evaluation and experience is often stress. That's a safe narrative.

  *(Theory Check)*: I need to be specific in the analysis. Is it Utilitarian? No. Is it Objective List? Partially. It's mostly Subjective Wellbeing (SWB) pluralism.

