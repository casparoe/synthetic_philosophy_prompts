      *   **BIL's Claim:** Ulysses contracts require *another will* (crew); constitutions are identical to personal precommitment; "the people" is a continuing agent; complaining about the "dead hand" implies Ulysses was irrational; philosophy settled this decades ago; it's not paternalism because it's the *same* people at different times.
