answer: |-
  The mechanism that does the work is the hidden correlation of evidence among half the class, which forces students to realize that consensus weight depends on independence—a fact they cannot verify from the inside until the reveal penalizes their scoring.

  ### Materials and Setup

  *   **Room:** One table or clustered seating for 14 students. Projector visible to all.
  *   **Instructor Prep:**
      *   **Spreadsheet:** Columns for Student ID (1–14), Credence Round 1, Credence Round 2, Score 1, Score 2, Total. Formulas pre-loaded for Brier scoring (see below).
      *   **Evidence Cards (14 total):** Index cards folded and sealed in opaque envelopes.
          *   **Set A (Independent):** 7 cards. Each lists a unique random sample of 5 chips drawn from a 60% Red / 40% Blue distribution (e.g., Card 1: 3R/2B, Card 2: 4R/1B, Card 3: 5R/0B...). Generate these beforehand.
          *   **Set B (Correlated):** 7 cards. All identical. Each lists the *same* sample (e.g., 3R/2B).
          *   **Labeling:** All cards look identical from the outside. Inside, text reads: "YOUR EVIDENCE: [Red Count] Red, [Blue Count] Blue. Do not show this to anyone."
      *   **Tokens:** Two colors (Red/Blue) in a bag (for demonstration only, not used by students).
      *   **Handouts:** None until debrief. Students use index cards for answers.

  ### Scoring Rule (Brier Score)

  *   **Question:** "Is the majority of chips in the Master Urn Red?" (True Answer: **Yes**).
  *   **Input:** Student writes a credence $C$ between 0.00 and 1.00.
  *   **Truth Value:** $T = 1$ (Yes).
  *   **Formula:** $\text{Points} = 100 \times (1 - (C - T)^2)$.
  *   **Worked Example:**
      *   If Truth is Yes (1) and you write **0.80**: $100 \times (1 - (0.8 - 1)^2) = 100 \times (1 - 0.04) = \mathbf{96}$.
      *   If Truth is Yes (1) and you write **0.50**: $100 \times (1 - (0.5 - 1)^2) = 100 \times (1 - 0.25) = \mathbf{75}$.
      *   *Note:* Hedging (0.5) costs 21 points compared to accurate confidence (0.8). Being wrong with confidence costs more.

  ### Minute-by-Minute Timeline (80 Minutes)

  **00:00 – 00:05: Setup**
  *   Hand out envelopes. Do not open yet.
  *   **Instructor Script:** "Inside is evidence about an urn. Your goal is to maximize your score. The scoring rule rewards accuracy and penalizes uncertainty. You will not speak to each other until I say so. Open now."

  **00:05 – 00:15: Round 1 (Private)**
  *   Students read cards.
  *   **Task:** Write "R1" and a number (0.00–1.00) on an index card. This is your credence that the Urn majority is Red.
  *   Collect cards. Instructor enters R1 into spreadsheet.
  *   **Instructor Script:** "Do not discuss your evidence. Hand in your numbers."

  **00:15 – 00:25: Round 2 (Public Disagreement)**
  *   Project the **Histogram of R1** (anonymous). Show the distribution of the 14 numbers.
  *   **Instructor Script:** "These are your peers' estimates. You are all epistemic equals. You have seen the group data. Write 'R2' and a new number. You may move or stay. Hand in."
  *   *Note:* The histogram will likely show a cluster (the Correlated group) and a spread (the Independent group). Students cannot tell which is which.
  *   Collect cards. Enter R2.

  **00:25 – 00:35: Reveal and Score**
  *   Project the Spreadsheet with Scores calculated.
  *   **Instructor Script:** "The Truth was Yes. Here are your scores. Now, the reveal: Seven of you had unique draws. Seven of you had the exact same copy. Stand up if you had the copy."
  *   *Moment of Shock:* The cluster stands up. The independent students see that the "consensus" they may have deferred to was artificial.
  *   **Instructor Script:** "Keep your cards. Do not talk yet."

  **00:35 – 00:50: The Rule Loop**
  *   **Task 1:** "Write a number $k$ between 0 and 1. This is your Rule. 0 means 'never move'. 1 means 'adopt their view'. 0.5 means 'meet halfway'."
  *   Collect $k_1$. Project the distribution of $k_1$. Calculate Class Average ($k_{avg}$).
  *   **Task 2:** "The Class Average disagrees with your $k$. Treat the Class as a peer. Apply your Rule $k_1$ to move your $k_1$ toward $k_{avg}$. Write $k_2$."
      *   *Formula on screen:* $k_2 = k_1 + k_1 \times (k_{avg} - k_1)$.
  *   Collect $k_2$. Project.
  *   **Task 3:** "Repeat once more. Write $k_3$."
  *   Collect $k_3$. Project.
  *   **Instructor Script:** "Look at the sequence. Did you converge? Did you vanish?"

  **00:50 – 01:15: Debrief (25 Minutes)**
  *   **Part 1: The Overlap (10 mins)**
      *   Ask the Independent group: "When you saw the cluster in Round 2, how much weight did you give it?"
      *   Ask the Correlated group: "Did you feel more confident because you saw others agree?"
      *   **Point:** Consensus is only evidence if independent. From the inside, you cannot tell the difference. Your score penalized you for treating correlated noise as independent signal.
  *   **Part 2: The Rule Loop (10 mins)**
      *   Look at the $k$ sequences.
      *   **Case A (Conciliationists, $k > 0$):** Your numbers moved toward the mean. Did you converge to a single value? (Likely yes).
      *   **Case B (Steadfast, $k = 0$):** Your number did not move. You are stable, but isolated.
      *   **Case C (The Oscillator):** If anyone moved past the mean, did you swing?
      *   **Point:** A policy for disagreement must handle disagreement about the policy. If you conciliate about facts, must you conciliate about your rule? If you do, do you disappear into the mean?
  *   **Part 3: The Friend's Objection (5 mins)**
      *   Address the prompt's specific worry. "If symmetry forces me to give ground, it should force me to give ground about the rule itself."
      *   Show the $k_3$ column. "If you applied your rule to itself, where did you end up? If you ended at 0, you are steadfast. If you ended at the mean, you are conciliationist about conciliationism. Is that stable?"
      *   Introduce terms: **Conciliationism**, **Steadfastness**, **Equal Weight**.

  **01:15 – 01:20: Buffer and Close**
  *   Collect materials.
  *   **Instructor Script:** "Next week: priors. Bring your scores."

  ### Instructor Script (Pre-Debrief Only)

  1.  **Start:** "Inside is evidence about an urn. Your goal is to maximize your score. The scoring rule rewards accuracy and penalizes uncertainty. You will not speak to each other until I say so. Open now."
  2.  **Round 2:** "These are your peers' estimates. You are all epistemic equals. You have seen the group data. Write 'R2' and a new number. You may move or stay. Hand in."
  3.  **Reveal:** "The Truth was Yes. Here are your scores. Now, the reveal: Seven of you had unique draws. Seven of you had the exact same copy. Stand up if you had the copy."
  4.  **Loop:** "Write a number $k$ between 0 and 1. This is your Rule. 0 means 'never move'. 1 means 'adopt their view'. The Class Average disagrees with your $k$. Treat the Class as a peer. Apply your Rule $k$ to move your $k$ toward the Average. Write the new number."

  ### Troubleshooting

  *   **Student refuses to give a number:**
      *   *Fix:* "You must submit a number to participate in the scoring. If you are uncertain, write 0.5, but know the scoring rule penalizes it."
  *   **Student treats it as an urn puzzle:**
      *   *Fix:* During debrief, explicitly state: "The urn composition was fixed. The variable was your relationship to the other people in the room. The score punished you for how you handled *them*, not just the chips."
  *   **Everyone hedges (writes 0.5 or $k=0.5$):**
      *   *Fix:* In debrief, show the score comparison. "The person who wrote 0.8 scored 96. The person who wrote 0.5 scored 75. Hedging cost you 21 points. Being agreeable is expensive."
  *   **Correlated group detects the trick early:**
      *   *Fix:* If they stand up laughing during the reveal, acknowledge it. "You suspected. But did you know *before* you revised your number in Round 2? If you deferred to the cluster then, you fell for the trap."
  *   **Rule Loop converges too fast:**
      *   *Fix:* This is expected. Use it. "You all agree now. Does agreement mean you are right? Or just that you followed the same rule?"

  ### Limitations (For Instructor Eyes Only)

  *   **Identity:** Real peer disagreement involves knowing *who* the peer is (their track record, virtue, friendship). This game uses anonymous aggregates. You must argue in the debrief that anonymity isolates the *structural* problem of symmetry.
  *   **Reasons:** In real life, we disagree because of different priors or reasoning errors. Here, disagreement is generated purely by noise and correlation. You must state: "This game models evidence aggregation, not rational resolution of conflicting arguments."
  *   **Stakes:** Points are not truth. You must argue: "Your credence *is* your bet. If you wouldn't bet on it, you don't believe it."
  *   **The Self-Application Gap:** The game shows *that* rules move under self-application, but it cannot prove *whether they should*. You must argue this point philosophically in the debrief using their data as the intuition pump. "You felt the pull to move your $k$. Was that rational pressure or social pressure?"
