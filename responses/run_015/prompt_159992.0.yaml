prompt: |-
  I work on the public inbox at a national health agency — me and two junior comms officers on rotation, a few hundred messages a week, a big chunk of them from people who don't just disagree with a claim but insist the data was fabricated, or that trials can't show anything, or that the thing we're talking about doesn't exist at all. Right now we have no rule for how to respond, so the default is either a long, patiently footnoted evidence dump that never lands, or silence, and both feel bad. Each officer has maybe ten minutes per message and has to log a one-line reason code, and I don't want a framework that only works if you've read the philosophy.

  A philosopher friend told me I should look at Wittgenstein's On Certainty and the hinge stuff — that some propositions aren't supported by evidence but are held fast, they're the scaffolding that makes evidence possible, and the riverbed can shift over time. Her punchline: when someone is rejecting a hinge rather than a claim, more evidence is the wrong answer, and past that point you aren't really arguing at all. That sounds both genuinely wise and like a wonderful excuse for never answering anyone, and I can already tell my team would use it to close tickets early.

  So: turn it into something we can actually run. The questions in order, what counts as a good-enough answer to each, where the procedure stops with a "don't send evidence," and where it hands off to a human because it's a values call — whether to keep engaging at all, staff time and burnout, amplification, and the fact that our replies are read by lurkers, not just by the person who wrote in. Two things it has to handle or it's useless to me:

  1. Most messages aren't pure hinge rejection. They mix a first-order factual dispute with doubt about a specific institution or instrument — this registry, this trial design, this lab, peer review generally — and only sometimes with the global stuff. So it needs a way to say which layer is actually doing the work before we decide what to do.
  2. Sometimes the doubt is reasonable. Some of the communities we write to were genuinely lied to or experimented on by health institutions, and their hinges legitimately differ from ours. I don't want a procedure that can't tell that apart from conspiracy thinking, and I really don't want one that can't flag the case where *we* are the ones treating a live, contested question as settled bedrock.

  Then run it on three real-ish messages: (a) "the flu vaccine doesn't work, the trials were designed to produce whatever the manufacturer wanted"; (b) "viruses don't exist, people get sick from toxins and terrain"; (c) a message from a community health group citing a real history of non-consensual experimentation and saying our whole evidence base is untrustworthy. I suspect (c) is where your procedure tells me something I won't want to hear, and I'd rather you say it than soften it. Also please be explicit about which steps are judgment calls dressed up as procedure, and what the procedure just can't settle no matter how well we run it.
reasoning: |-
  Here's a thinking process that leads to the suggested framework:

  1.  **Analyze the Request:**
      *   **Context:** Public inbox at a national health agency. 3 officers (1 senior, 2 junior), rotation. Hundreds of messages/week. ~10 mins/message.
      *   **Problem:** No rule for responding to deep skepticism/denial (fabricated data, trials meaningless, phenomena don't exist). Current defaults (evidence dump or silence) both fail.
      *   **Input:** Wittgenstein's *On Certainty* (hinge propositions, riverbed shifting). Friend suggests: don't argue hinges with evidence.
      *   **Risk:** Framework could become an excuse to ignore people or close tickets early.
      *   **Requirements:**
          1.  Handle mixed messages (factual dispute + institutional doubt + global hinge rejection).
          2.  Distinguish reasonable/historical distrust (e.g., marginalized communities) from conspiracy thinking. Acknowledge when the agency might be treating contested questions as settled.
          3.  Provide a runnable procedure (questions, stop points, handoffs).
          4.  Run the procedure on three specific test cases (a, b, c).
          5.  Be explicit about judgment calls and procedural limits.
          6.  Tone: Practical, operational, honest about burnout/ethics, not philosophical jargon.

  2.  **Deconstruct the Philosophical Input (Wittgenstein):**
      *   *Hinge Propositions:* Things we don't prove because they are the basis for proving anything else (e.g., "The earth exists," "My senses generally work").
      *   *Evidence Dump Failure:* If someone rejects the hinge, evidence (which relies on the hinge) looks like noise or manipulation.
      *   *Operationalizing:* We need a triage system that identifies *which* layer of belief is being challenged. Is it the data? The method? The institution? Or reality itself?

  3.  **Drafting the Framework (The "Hinge Triage Protocol"):**
      *   *Goal:* 10-minute decision tree.
      *   *Step 1: Layer Identification.* Is this about a specific claim, a method, or a worldview?
      *   *Step 2: Legitimacy Check.* Is the distrust historical/structural (reasonable) or epistemic nihilism (unmoored)?
      *   *Step 3: Audience Check.* Is this for the sender or the lurkers?
      *   *Step 4: Action.* Respond, Handoff, or Close.

      *Refining Step 1 (Layers):* Need to distinguish between "This study is wrong" (Claim), "This lab is corrupt" (Institution), "Science is a cult" (Hinge).
      *Refining Step 2 (Legitimacy):* This is the hardest part. How does a junior officer know the history of Tuskegee vs. a random conspiracy theory? *Solution:* Keywords/Triggers + Escalation path. If it cites specific historical harm, it's not a standard ticket.
      *Refining Step 3 (Lurkers):* Public health comms is theater. Even if the sender won't listen, the public might.
      *Refining Step 4 (Action):* Define the "No Evidence" rule. If it's a hinge rejection, do not send links. Send acknowledgment or boundary setting.

  4.  **Addressing the Constraints:**
      *   *Time:* 10 mins max.
      *   *Logging:* One-line reason code.
      *   *Burnout:* Prevent officers from feeling like they are failing by not "winning" the argument.
      *   *Honesty:* Admit where the procedure is actually a value judgment.

  5.  **Developing the Test Cases:**
      *   *(a) Flu Vaccine/Trials:* Mixed. Claims trial design is rigged (Institutional/Method doubt). Not necessarily global hinge rejection.
      *   *(b) Viruses/Toxins:* Global hinge rejection. "Viruses don't exist." This is ontology.
      *   *(c) Community Group/History:* Historical/Structural distrust. This is the "Reasonable Doubt" case. The agency *is* the problem here, epistemically.

  6.  **Writing the Procedure (Iterative refinement):**
      *   *Name:* The Hinge Triage Protocol (HTP).
      *   *Structure:* 4 Questions.
      *   *Q1: The Layer.* Claim, Method, or World?
      *   *Q2: The Source.* Conspiracy pattern or Historical Grievance?
      *   *Q3: The Audience.* Persuadable sender or Public Record?
      *   *Q4: The Agency.* Are we the hinge-breakers?
      *   *Outcomes:* Standard Reply, Acknowledgment Only, Escalate, Close.

      *Self-Correction on Q2:* Junior officers can't be historians. Need a "Safe Word" or "Flag" system. If they see specific keywords (Tuskegee, sterilization, specific community names), they *must* escalate. Don't let them decide "reasonable" vs "unreasonable" alone on historical trauma.
      *Self-Correction on Q4:* This is the "uncomfortable truth" requirement. The procedure must allow for "We might be wrong/insensitive here."

  7.  **Drafting the Response:**
      *   *Intro:* Acknowledge the difficulty. Validate the Wittgenstein insight but ground it.
      *   *The Protocol:* Step-by-step, with time estimates.
      *   *The "Judgment Call" Warning:* Explicit section on where human intuition overrides the flowchart.
      *   *The Test Cases:* Run (a), (b), (c) through the protocol.
      *   *The Hard Truth (Case C):* Ensure the output for (c) acknowledges the agency's potential culpability/need for humility, not just "process this ticket."

  8.  **Final Review against Constraints:**
      *   10 mins per message? Yes, if steps are tight.
      *   One-line codes? Need to draft those.
      *   Handle mixed messages? Yes, via Layer ID.
      *   Handle historical distrust? Yes, via Escalation trigger.
      *   Explicit about limits? Yes.

  9.  **Tone Check:** Professional, empathetic to the officers, firm on the reality of the situation. Avoid academic jargon in the actual protocol (keep "hinge" concept but explain it simply).

      *(Self-Correction during drafting Case C)*: The prompt says "I'd rather you say it than soften it." I need to make sure the recommendation for (c) isn't just "send a nicer email." It needs to be "This requires a different kind of engagement, possibly not via this inbox."

      *(Refining the "Don't Send Evidence" rule)*: Make sure this is clear. If the hinge is broken, links are insults.

      *(Refining the "Lurker" aspect)*: If the sender is unreachable, write for the 100 people reading the reply later.

  10. **Final Polish:** Check word count and clarity. Ensure the distinction between "Institutional Distrust" and "Ontological Denial" is sharp. (Proceed to generate output).

  *(Post-Drafting Thought)*: I need to make sure I don't just give them a flowchart but also the *culture* needed to support it. If management punishes "unresolved" tickets, the protocol fails. I should add a note about metrics.

  *(Final Plan)*:
  1. Introduction: Validate the Wittgenstein insight.
  2. The Protocol (4 Steps).
  3. The Reason Codes.
  4. The "Judgment Call" Disclosures.
  5. The Three Test Cases.
  6. Closing advice on metrics/burnout.

