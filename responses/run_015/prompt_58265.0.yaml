  ugh ok so I need someone to sanity check my ethics prof lol

  we spent last week on Hume and Moore and he gave us this big unified lesson to use in our essays, basically that Hume and Moore are saying the same thing in different words, that you can't get an ought from an is, and Moore just gave Hume's point the name naturalistic fallacy. And that the fallacy is whenever you try to say that good just means some natural or scientific thing like pleasure or being happy or whatever evolution made us want, so any ethical view that grounds right and wrong in facts about brains or evolution is making a basic logical error and science can't really tell us anything about what we should do.

  i kinda feel like he's mushing two seperate ideas into one but I can't explain how, and also the science-can't-tell-us-anything part sounds too strong?

  for context the arguement I wanted to make in my essay is like, if neuroscience finds that caring about strangers actually makes people happier and more fulfilled long term, doesn't that give us at least a defeasible reason to think we should care about strangers more? My prof said in office hours that's exactly the move the fallacy rules out. Is that true, or does the real view leave room for science to matter if you add an extra moral premise or something?

  can you sort out what bits of his takeaway I can safely use and what bits a Hume or Moore defender would complain about, and whether his punchline about my essay idea still holds up once you fix it?
