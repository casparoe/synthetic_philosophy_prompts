      *   **Constraints:**
          *   Start with "Design Notes" (distinctions to keep/drop).
          *   No bibliographies, history, or citations (must be runnable by staff without philosophy training).
          *   Time/Budget: 2 analysts, 1 day per instrument, 60/year.
          *   Audience: 5-member board, Ministers (who might overrule), Opposition, Courts (judicial review risk).
          *   Core Concepts: Negative, Positive, Republican Liberty.
          *   Specific Requirements:
              1.  Fix operative readings (especially Positive Liberty & Baseline).
              2.  The Procedure (ordered gates, termination points, human handoff).
              3.  Scoring Discipline (no aggregation, separate lanes + conflict flag).
              4.  Domination Check (operationalizing arbitrariness, exposure, exit-cost, contestability).
              5.  Anti-Capture Guard (adaptive preferences, collective self-rule coercion).
              6.  Test Run (3 specific instruments: Pension Auto-enrolment, Dismissal for Cause, Conditional Cash Transfers).
              7.  Limits Section (systematic blind spots, override conditions).

  2.  **Design Notes (Stage 1):**
      *   *Goal:* Make the concepts usable without losing their critical edge.
      *   *Negative Liberty:* Keep it simple. Interference = direct constraint or penalty. Baseline = Legal Status Quo (what is legally permitted right now). Why? Counterfactuals are too speculative for a 1-day review. Moralized baselines invite ideological fights.
      *   *Positive Liberty:* This is the danger zone. "Rational self-direction" is too paternalistic. "Collective self-rule" is too easily abused by executives ("we represent the people"). *Choice:* Use "Effective Capacity." Does this measure give the agent the actual resources/ability to do X? *Cost:* We lose the "true self" aspect, but we gain immunity against "forced to be free" arguments.
      *   *Republican Liberty:* Focus on *arbitrariness* and *power*. Key test: Can the power-holder act without tracking the interests of the affected?
      *   *Drops:* "True will" vs. "Actual will" distinctions (too metaphysical). Historical lineage of concepts. Aggregated scoring (as requested).
      *   *Tone:* Bureaucratic but rigorous. "If X, then Y."

  3.  **Fixing Operative Readings (Requirement 1):**
      *   *Positive Liberty:* Define as "Capability/Resource Enablement." If the state forces you to save, that's negative liberty loss. If the state gives you money to save, that's positive liberty gain. *Crucial:* Explicitly reject "Rational Self-Direction" as a justification for coercion in this procedure. If a minister claims "we are making them free by forcing them," the analyst must flag it as a Positive Liberty *claim* but record it as a Negative Liberty *cost*.
      *   *Baseline:* "Legal Status Quo Ante." What could the individual legally do yesterday that they cannot do today? This avoids the "no government exists" fantasy.
      *   *Interference:* Physical constraint, legal penalty, significant cost imposition.

  4.  **The Procedure (Requirement 2):**
      *   Need a flowchart style.
      *   Gate 1: Identification of Affected Parties.
      *   Gate 2: Negative Liberty Test (Interference?).
      *   Gate 3: Positive Liberty Test (Capacity Enhanced?).
      *   Gate 4: Republican Liberty Test (Domination/Arbitrariness?).
      *   Gate 5: Anti-Capture/Adaptive Preferences.
      *   Handoff points: Where values clash, the Minister decides, but the conflict must be recorded.

  5.  **Scoring Discipline (Requirement 3):**
      *   No "Net Liberty Score."
      *   Format: Traffic light per lane (Red/Amber/Green).
      *   Conflict Flag: If Negative is Red and Positive is Green, flag "Trade-off."
      *   Escalation Rule: If Republican (Domination) is Red, automatic escalation to Board. You cannot trade domination off against capacity.

  6.  **Domination Check (Requirement 4):**
      *   *Power-holder:* Who has the discretion?
      *   *Arbitrariness:* Is there a rule-bound process? Can the subject appeal?
      *   *Exposure:* Even if not used, does the power exist? (Yes = Exposure).
      *   *Public/Private Swap:* If removing a boss's power but giving it to an inspector, check the inspector's constraints.
      *   *Exit/Contestability:* Can I leave the relationship? Can I challenge the decision?
      *   *Failure on Contestability:* If I can't challenge, but the benefit is high -> Recommend Sunset Clause + Review. Is this a fudge? It's a procedural mitigation. Acknowledge it as such.

  7.  **Anti-Capture Guard (Requirement 5):**
      *   *Adaptive Preferences:* Did the policy shape the desire it claims to fulfill? (e.g., "They want this because we taught them to.")
      *   *Collective Coercion:* "The People decided" vs. "This specific person is coerced." Ensure the specific individual's dissent is recorded.

  8.  **Test Runs (Requirement 6):**
      *   *Instrument A (Pensions):*
          *   Neg: Interference (default deduction).
          *   Pos: Capacity (future wealth).
          *   Rep: Employer/State power? Opt-out reduces domination.
          *   Verdict: Neg Red, Pos Green, Rep Amber.
      *   *Instrument B (Dismissal for Cause):*
          *   Neg: Employer liberty reduced (can't fire at will).
          *   Pos: Employee capacity (security).
          *   Rep: Inspectorate power. Is it arbitrary? Needs appeal rights.
          *   Verdict: Neg Red (for employer), Pos Green (for employee), Rep depends on Inspectorate design.
      *   *Instrument C (Conditional Cash):*
          *   Neg: Conditionality is interference.
          *   Pos: Cash helps capacity, conditions restrict it.
          *   Rep: State discretion on "attendance." High domination risk.
          *   Capture: "Parents want healthy kids" vs. "State defines health."
          *   Verdict: Likely Red on Republican/ Negative, Green on Positive (resource). *Must be honest:* This is high domination risk.

  9.  **Limits Section (Requirement 7):**
      *   Third parties (diffuse harm).
      *   Structural power (markets, not just state).
      *   Template drift (becoming a tick-box).
      *   Override conditions: National emergency (rare), clear legal error.

  10. **Refining and Polishing:**
      *   *Tone Check:* Is it too academic? Need to make it sound like a manual.
      *   *Constraint Check:* Did I avoid citations? Yes. Did I start with Design Notes? Yes.
      *   *Specific Constraint:* "Do not soften what the procedure returns" for Instrument C. This is crucial. If the procedure says it's dominating, say it.
      *   *Specific Constraint:* "Exit-cost and contestability step." Ensure this is explicit in the Domination Check.
      *   *Specific Constraint:* "Is that second option an application of the theory or a political fudge?" Need to answer this in the text.

  11. **Drafting - Section by Section:**
      *   *Design Notes:* Keep it sharp. Focus on "Operationalizability."
      *   *Operative Readings:* Define the baseline clearly.
      *   *Procedure:* Numbered steps. Clear "Stop/Go" logic.
      *   *Reporting:* The Matrix.
      *   *Domination:* The "Arbitrariness Index."
      *   *Anti-Capture:* The "Preference Audit."
      *   *Test Runs:* Apply the steps rigorously.
      *   *Limits:* Be humble about the tool's reach.

      *(Self-Correction during drafting)*: I initially thought about letting the analysts weigh the trade-offs. *Correction:* No, the prompt says "refuses to aggregate." The analysts must present the conflict, not solve it. The Minister solves it, but the Domination Red light forces escalation.
      *(Self-Correction on Instrument C)*: This is the political minefield. The prompt says the board is friendly. I must ensure the procedure doesn't bend. If the conditions create arbitrary power, it flags Red. I will ensure the "Contestability" gate hits hard here.

      *(Refining the "Positive Liberty" definition)*: I need to be careful not to let "Capacity" justify coercion. If the state gives money (Capacity+) but demands behavior (Interference-), they are separate entries. Do not net them.

      *(Refining the "Domination" check)*: How to measure "Arbitrary"? Use the "Interest Tracking" test. Does the power holder *have* to listen to the subject? If no -> Arbitrary.

      *(Refining the "Fudge" question)*: Sunset clauses are a procedural fix to a substantive rights issue. I should label it "Procedural Mitigation" and note it does not cure the liberty defect, only limits its duration.

  12. **Final Review against constraints:**
      *   Design Notes first? Yes.
      *   No citations? Yes.
      *   Runnable by generalists? Yes, language is plain.
      *   3 Test cases with working shown? Yes.
      *   Limits section? Yes.

      *Let's write.*
answer: |-
  # DESIGN NOTES: CONCEPTUAL TRANSLATION

  **Objective:** Convert political theory into a compliance checklist that survives contact with legislative drafting and judicial scrutiny.

  **Distinctions to Retain:**
  1.  **Interference vs. Capacity:** We must keep the distinction between "stopping someone doing X" (Negative) and "enabling someone to do X" (Positive). Merging these allows ministers to claim that taxation (interference) is freedom (capacity) in the same breath. They must be recorded as separate ledger entries.
  2.  **Power vs. Exercise:** For Republican liberty, the *existence* of unchecked power matters, not just its use. A master who does not beat his slave is still a master. The procedure must test for the *presence* of discretion, not just the *history* of its use.
  3.  **Agent-Specificity:** Liberty is assessed per affected agent. We cannot say "society is freer" if a specific minority is dominated. The unit of analysis is the individual subject to the instrument.

  **Distinctions to Drop:**
  1.  **"True" vs. "Actual" Will:** We cannot adjudicate whether a citizen's desire is "rational" or "authentic." This invites paternalism. We take expressed preferences as given unless there is evidence of direct manipulation by the policy itself (see Anti-Capture Guard).
  2.  **Moralized Baselines:** We will not assess liberty against a "just society" baseline. We assess against the *Legal Status Quo Ante* (what was legally permissible immediately prior to this instrument). This prevents analysts from arguing that a new restriction is "actually freedom" because the previous state was unjust.
  3.  **Collective Self-Rule as Liberty:** We will not accept "the people decided" as a Positive Liberty gain for the dissenting individual. Democratic process is a legitimacy check, not a liberty metric for the scrutinized individual.

  **Cost of Choices:**
  By defining Positive Liberty strictly as "Effective Capacity/Resources" and rejecting "Rational Self-Direction," we lose the ability to justify paternalism (e.g., "forcing them to save makes them more rational"). This will generate friction with ministers who view behavioral nudges as liberty-enhancing. They will have to argue those cases on welfare grounds, not liberty grounds. This is a feature, not a bug.

  ***

  # OPERATIVE READINGS

  **1. Positive Liberty (The "Capacity" Reading)**
  *   **Definition:** An increase in the material or legal resources available to an agent to pursue their own ends.
  *   **Exclusion:** Do not record "protection from self-harm" as a Positive Liberty gain. If a helmet law stops you riding without a helmet, that is a Negative Liberty loss. Do not offset it with "safety."
  *   **Cost:** This renders the procedure hostile to paternalistic policies. Ministers cannot claim they are "freeing" people by restricting them.

  **2. The Baseline (Legal Status Quo Ante)**
  *   **Definition:** The set of actions legally permissible to the affected agent 24 hours before this instrument comes into force.
  *   **Application:** If the instrument creates a new penalty for Action X, it is an interference, even if Action X was previously unregulated because it was impossible. If the instrument removes a subsidy, it is a capacity reduction, even if the subsidy was a "gift."
  *   **Rationale:** Counterfactual baselines (e.g., "what if the government didn't exist?") are speculative and litigable. The Status Quo is a matter of record.

  **3. Interference Threshold**
  *   **Definition:** A legal penalty, physical constraint, or significant financial cost imposed on a specific action.
  *   **De Minimis:** Administrative burdens (filling a form) count as interference only if the time/cost exceeds 2 hours or 1% of weekly income for the affected class.

  ***

  # THE PROCEDURE: LIBERTY STATEMENT GENERATION

  **Time Budget:** 6 Hours per instrument (leaving 2 hours for review/writing).
  **Analyst Role:** Auditor, not Advocate.

  ### GATE 1: AFFECTED AGENT IDENTIFICATION
  *   **Action:** List the specific legal persons (individuals, corporations) whose Legal Status Quo is altered.
  *   **Pass:** List is exhaustive.
  *   **Fail:** Vague references to "the public" or "society."
  *   **Output:** A table of Agents (e.g., "Low-income parent," "Small Business Owner").

  ### GATE 2: NEGATIVE LIBERTY SCAN (Interference)
  *   **Question:** Does the instrument impose a penalty, ban, or mandatory duty on any Identified Agent?
  *   **Test:** Compare against Baseline.
  *   **Finding:**
      *   **Green:** No new duties/penalties.
      *   **Amber:** Administrative burden only.
      *   **Red:** Criminal/Civil penalty or mandatory action (e.g., "Must contribute").
  *   **Termination:** If Red, proceed to Gate 3. Do not stop. A Red finding here is a fact, not a verdict.

  ### GATE 3: POSITIVE LIBERTY SCAN (Capacity)
  *   **Question:** Does the instrument provide new resources, rights, or enforceable claims to any Identified Agent?
  *   **Test:** Does this give the agent power they lacked yesterday? (e.g., Cash, Right to Sue, Right to Access).
  *   **Finding:**
      *   **Green:** Significant resource/right added.
      *   **Amber:** Information provided only.
      *   **Red:** Net reduction in resources (e.g., subsidy cut).
  *   **Note:** Do not offset Gate 2 Red against Gate 3 Green. Record both.

  ### GATE 4: REPUBLICAN LIBERTY SCAN (Domination)
  *   **Question:** Does the instrument vest discretion in a public or private body over an Identified Agent without adequate constraints?
  *   **Sub-Test A (Power Holder):** Who can make decisions affecting the agent? (Name the office, not the department).
  *   **Sub-Test B (Arbitrariness):** Is the Power Holder required by law to track the interests of the Agent?
      *   *Check:* Is there a statutory duty to consider representations?
      *   *Check:* Is there a right of appeal to an independent body?
  *   **Sub-Test C (Exposure):** Does the power exist even if unused? (Yes = Exposure).
  *   **Sub-Test D (Exit):** Can the Agent leave the relationship without catastrophic loss? (e.g., Can they quit the job? Leave the jurisdiction?).
  *   **Finding:**
      *   **Green:** Power is rule-bound, appealable, and exit is viable.
      *   **Amber:** Appeal exists but is costly; Exit is difficult.
      *   **Red:** Unconstrained discretion; No appeal; No exit.

  ### GATE 5: ANTI-CAPTURE GUARD
  *   **Question:** Is the justification for interference reliant on the Agent's "will" or "interests" in a way that the instrument itself shaped?
  *   **Test 1 (Adaptive Preferences):** Does the policy claim to fulfill a desire that the policy created? (e.g., "We force training because they want jobs, but the job market was shrunk by our other policies").
  *   **Test 2 (Collective Coercion):** Does the policy claim "Democratic Will" overrides specific dissent?
  *   **Action:** If Yes to either, flag "Justification Risk." This does not change Gate 2-4 scores but requires a Ministerial Sign-off on the rationale.

  ### GATE 6: CONFLICT & ESCALATION
  *   **Rule:** If Gate 4 (Domination) is **Red**, the instrument must be escalated to the Board. Analysts cannot recommend approval.
  *   **Rule:** If Gate 2 is Red and Gate 3 is Green, flag "Trade-off."
  *   **Rule:** If Gate 5 is Flagged, Minister must initial the justification.

  ***

  # SCORING DISCIPLINE: THE REPORTING FORMAT

  **Prohibition:** Do not calculate a "Net Liberty Score." Do not average the lanes.

  **Required Format:**
  1.  **Liberty Matrix:**
      *   Negative Liberty: [Green/Amber/Red]
      *   Positive Liberty: [Green/Amber/Red]
      *   Republican Liberty: [Green/Amber/Red]
  2.  **Conflict Flag:** [Yes/No] (Triggered if colors diverge significantly, e.g., Neg-Red / Pos-Green).
  3.  **Domination Alert:** [Yes/No] (Triggered if Rep-Red).
  4.  **Analyst Recommendation:**
      *   If Domination Alert = No: "Proceed / Proceed with Amendments."
      *   If Domination Alert = Yes: "Escalate to Board. Cannot clear under current draft."

  **Rationale:** A gain in capacity (Positive) does not morally cancel out the existence of arbitrary power (Republican). A minister may choose to accept the trade-off, but the statement must show the trade-off, not hide it.

  ***

  # DOMINATION CHECK: OPERATIONAL DETAILS

  **1. Identifying the Power-Holder**
  *   Look for verbs: "May," "Discretion," "Determine," "Assess."
  *   Assign the power to the specific role (e.g., "The Inspector," not "The Agency").

  **2. Testing Arbitrariness (The "Interest Tracking" Test)**
  *   Analyst asks: "If the Agent complains, is the Power-Holder legally required to listen and adjust?"
  *   If the answer is "No, they can ignore it," the power is arbitrary.
  *   *Constraint:* Do not ask if the Power-Holder *would* listen. Ask if the *rules force them* to.

  **3. Measuring Exposure (The "Sleeping Master" Test)**
  *   If the Power-Holder never uses the discretion, is the Agent free?
  *   **Verdict:** No. The *capacity* to interfere arbitrarily is domination.
  *   **Recording:** Record the *scope* of the discretion, not the *frequency* of use.

  **4. Public/Private Swap**
  *   If the instrument removes a private power (e.g., Employer firing staff) and vests it in a public body (Inspectorate):
      *   Apply Gate 4 to the Inspectorate.
      *   If the Inspectorate has *more* discretion than the Employer had, Domination increases.
      *   If the Inspectorate is bound by stricter rules than the Employer, Domination decreases.

  **5. Exit-Cost and Contestability**
  *   **Exit:** Can the agent withdraw consent? (e.g., Opt-out). If Exit Cost > 20% of annual income/assets, treat as "No Exit."
  *   **Contestability:** Is there a tribunal/court appeal?
      *   **Failure:** If Contestability fails (No appeal) but Benefits are high:
      *   **Recommendation:** "Recommend Compulsory Sunset (3 Years) + Independent Review."
      *   **Theory vs. Fudge:** This is a **Political Fudge**. It does not cure the domination; it limits the duration of the exposure. It is permissible only if the Board accepts that the policy goal outweighs the liberty defect. The Statement must explicitly say: "This measure creates arbitrary power; the sunset clause is a mitigation, not a cure."

  ***

  # ANTI-CAPTURE GUARD: OPERATIONAL DETAILS

  **Failure Mode 1: Shaped Will**
  *   **Indicator:** Policy documents state "Beneficiaries expressed desire for X" where X was only made available/salient by the government's prior campaign.
  *   **Action:** Analyst must append a note: "Preference endogeneity detected. Desire for X may be a product of Program Y."

  **Failure Mode 2: Collective Coercion**
  *   **Indicator:** Covering note claims "This fulfills the community's will."
  *   **Action:** Analyst must verify if dissent is permitted. If the instrument forces compliance on a dissenting minority without exemption, flag: "Collective justification used to override individual dissent."

  ***

  # TEST RUNS

  ## Instrument A: Automatic Enrolment Pension (Opt-out available, deductions at source)

  **Gate 1 (Agents):** Employees (new and existing), Employers.
  **Gate 2 (Negative):**
  *   *Employees:* Default deduction is a financial interference. Opt-out exists but requires action. **Verdict: Amber** (Interference exists, but low barrier to exit).
  *   *Employers:* Mandatory administration. **Verdict: Amber**.
  **Gate 3 (Positive):**
  *   *Employees:* Increased future financial capacity/asset accumulation. **Verdict: Green**.
  **Gate 4 (Republican):**
  *   *Power Holder:* Employer (deducts), Pension Provider (holds funds).
  *   *Arbitrariness:* Rates are statutory. Provider rules regulated. **Verdict: Green**.
  *   *Exit:* Opt-out is legally guaranteed. **Verdict: Green**.
  **Gate 5 (Capture):**
  *   *Claim:* "Workers want to save but lack discipline."
  *   *Check:* Is this shaped will? Evidence suggests inertia, not shaped preference. **Verdict: Pass**.
  **Matrix:** Neg: Amber | Pos: Green | Rep: Green.
  **Conflict:** Yes (Interference vs. Capacity).
  **Recommendation:** Proceed. The interference is minor and reversible (Opt-out).

  ## Instrument B: Dismissal for Cause (Enforced by Labour Inspectorate, Reinstatement power)

  **Gate 1 (Agents):** Employees, Employers, Labour Inspector.
  **Gate 2 (Negative):**
  *   *Employers:* Restricted right to terminate contracts. **Verdict: Red**.
  *   *Employees:* None. **Verdict: Green**.
  **Gate 3 (Positive):**
  *   *Employees:* Right to job security/enforceable claim. **Verdict: Green**.
  *   *Employers:* None. **Verdict: Amber** (Clarity on rules).
  **Gate 4 (Republican):**
  *   *Power Holder:* Labour Inspector.
  *   *Arbitrariness:* Inspector awards reinstatement. Is there an appeal? (Assume standard tribunal exists).
      *   *If Appeal exists:* **Verdict: Amber**.
      *   *If Inspector decision is final:* **Verdict: Red**.
  *   *Exposure:* Employer is subject to Inspector's judgment on "Cause."
  *   *Swap:* Private power (Employer fire) swapped for Public power (Inspector reinstate).
      *   *Analysis:* Employer power was arbitrary (at-will). Inspector power is rule-bound (statutory cause). Domination shifts from Employee to Employer.
  **Gate 5 (Capture):**
  *   *Claim:* "Fairness for workers."
  *   *Check:* No adaptive preference detected.
  **Matrix:** Neg: Red (Employer) | Pos: Green (Employee) | Rep: Amber/Red (Depending on Appeal).
  **Conflict:** Yes (Employer Liberty vs. Employee Security).
  **Recommendation:** If Inspector has final say (No Appeal), **Escalate**. Domination of Employer by State is high. If Appeal exists, Proceed with Note on Employer Burden.

  ## Instrument C: Conditional Cash Transfers (Payment contingent on health/parenting appointments)

  **Gate 1 (Agents):** Low-income Parents, State Agency Caseworker.
  **Gate 2 (Negative):**
  *   *Parents:* Conditionality. Failure to attend = financial penalty (loss of transfer). This is a penalty on behavior. **Verdict: Red**.
  *   *Reasoning:* Baseline is "Receive benefit without condition." New baseline is "Receive benefit only if compliant."
  **Gate 3 (Positive):**
  *   *Parents:* Cash injection increases capacity. **Verdict: Green**.
  *   *Note:* Do not net the cash against the condition. Record both.
  **Gate 4 (Republican):**
  *   *Power Holder:* Caseworker / Agency.
  *   *Arbitrariness:* Does the Caseworker decide if an absence is "excused"?
      *   *Scenario:* If guidelines are vague ("Good reason"), Caseworker has discretion.
      *   *Test:* Can the parent appeal a missed appointment finding easily? If the cost of appeal (time/travel) exceeds the benefit, effective contestability is zero.
      *   *Verdict:* **Red**. (High discretion, high cost of contestation for poor applicants).
  *   *Exposure:* The threat of cutoff exists even if not used.
  *   *Exit:* Can the parent leave the scheme? Only by forfeiting essential income. **Exit Cost: Catastrophic.** **Verdict: Red**.
  **Gate 5 (Capture):**
  *   *Claim:* "Parents want healthy children; this helps them achieve their own will."
  *   *Check:* **Fail.** This is Adaptive Preference/Paternalism. The state is defining "good parenting" (attendance) and coercing compliance.
  *   *Claim:* "Social investment."
  *   *Check:* **Fail.** Collective benefit used to justify individual coercion.
  **Matrix:** Neg: Red | Pos: Green | Rep: Red.
  **Conflict:** Yes.
  **Domination Alert:** **YES.**
  **Recommendation:** **Escalate to Board.**
  **Analyst Note:** "This instrument creates a relationship of dependence where the State holds arbitrary power over essential income. The conditionality creates a Red Negative Liberty finding. The discretion over 'valid excuses' creates a Red Republican Liberty finding. The cash transfer is a Positive Liberty gain, but does not cancel the domination.
  **Mitigation:** If Minister proceeds, recommend: 1. Strict statutory definition of 'excused absence' (remove Caseworker discretion). 2. Free, automatic appeal process. 3. Sunset Clause (2 years).
  **Theory/Fudge:** The Sunset/Appeal fix is a **Political Fudge**. It reduces the risk of abuse but does not remove the structural domination of conditioning subsistence on compliance."

  ***

  # LIMITS SECTION

  **Systematic Blind Spots:**
  1.  **Diffuse Harm:** This procedure targets specific legal agents. It will miss environmental or cultural harms where the "loser" is a diffuse group (e.g., "future generations," "the landscape").
  2.  **Structural Power:** It identifies legal power-holders. It will miss market power (e.g., a monopoly pricing strategy) unless the instrument specifically regulates it.
  3.  **Incommensurability:** We cannot compare Instrument A against Instrument B. We can only assess each against the Status Quo. Do not use this to rank policy priorities.
  4.  **Template Drift:** Over 60 instruments/year, analysts will tend to mark "Green" on Contestability assuming appeals exist, without checking if they are accessible.
      *   *Mitigation:* Random audit of 10% of "Green" Republican findings by the Unit Head.

  **Override Conditions:**
  You (Unit Head) should override the procedure's recommendation only in two circumstances:
  1.  **Legal Error:** The analyst has misidentified the Legal Status Quo (e.g., missed a pre-existing statutory duty).
  2.  **Emergency:** The instrument is required to prevent immediate loss of life or state collapse, and the delay for Board Escalation is impossible.
      *   *Requirement:* If you override, you must sign a "Deviation Note" attached to the Liberty Statement, explaining why the procedure was set aside. This note is publishable.

  **Final Warning:**
  This procedure makes domination visible. It does not prevent it. If Ministers consistently overrule Red Domination findings, the Liberty Statement becomes a record of tyranny, not a shield against it. Ensure the Board understands that publishing a Red finding is not a veto, but it is a permanent mark on the legislation's legitimacy.
