prompt: |-
  I'm rewriting my third-year Kant sessions for next term (we're on Groundwork II, the universalizability stretch), and I've relised I don't actually have a spec for what I want out of a reading of the test before I go pick one to teach. So help me build the spec.

  Purpose first, so adequacy has something to be relative to: I want a version of the test that a student can apply to a maxim they wrote down themselves, in a few minutes, without already knowing the answer — and that returns Kant's own verdicts on the four stock examples (suicide from self-love, the lying promise, the unused talents, the man who walks past the sufferer). Anything that only works if a philosophically trained person reverse-engineers the description is out.

  Here's the part I most want. Below is a battery of maxims I made up because my seminar kept breaking on them. Any adequate reading has to return a verdict on each, and the verdicts have to come from the reading and not from me nudging the description:

  1. As a referee, I'll take money to favour one side. (Is the maxim indexed to a role or office? Universalise over everyone, or over office-holders?)
  2. I'll lie whenver I'm in a city I'm only passing through. (Class indexed by place, not person.)
  3. I'll break a promise when I feel like it. (Class indexed to the agent's occurrent desire.)
  4. When the queue is longer than six people, I'll cut in. (The universalised world falls apart only above a certain occupancy level — so the verdict seems to move with population size, or with whether there's a ticketing system, or with whether everyone else is queueing.)
  5. I'll get ahead by taking credit for colleagues' work. (Universalised, the end — credit — becomes unachievable, but not because the maxim is incoherent.)
  6. As the only person who knows where the archive key is, I'll deny anyone else access. (Universalisation over a class of one: vacuous permission, or no verdict at all?)
  7. I'll let people sort out their own problems. (An omission, not an act; and nature plainly subsists under it.)
  8. I'll lie to myself about why I did it. (Self-directed; universalisation ranges over one agent's own future states.)
  9. I'll fiddle my taxes, but only if most others already do. (Compliance conditional on others' non-compliance.)
  10. I'll help people when it suits me and not otherwise. (A permissive maxim: not "do," not "don't," but "either.")

  For each requirement you state, give me the case from that battery (or one of your own) that motivates it, and tell me which requirements are non-negotiable and which are just what one family of readings wants. Things I think belong somewhere on the list, but you order them and you can throw any of them out: that the reading say what a maxim is and how finely it gets individuated; that it distinguish failing in conception from failing in the will from merely being unwise or unstable; that it say whether the verdict attaches to the maxim, to the action, or to the world the maxim would make; that it handle omissions and maxims of pure indifference; that it explain where the extra premise comes from if the law-of-nature clause is doing the work on case 7; that it tell us whether verdicts are allowed to shift with background empirical facts (case 4); that it be usable first-personally, in the moment, by someone who doesn't know the outcome; and that it not let you gerrymander the verdict by re-describing.

  Two things I especially want. First: is there a pair on your list that can't be jointly satisfied? My candidate is that the verdict has to be insensitive to how finely you describe the maxim, and yet you mustn't be able to get any verdict you like by choosing the description — coarse enough to avoid false negatives, fine enough to avoid false positives. If that pair really is unsatisfiable, say so and tell me which half to keep and what to put in place of the other. Second: which single requirement excludes the most readings?

  Then, briefly — a few lines, not an essay — score the four families I keep circling: the logical/semantic-contradiction reading; the practical-contradiction reading on which the maxim's own end can't be achieved in the universalised world; the law-of-nature reading that leans on a premise about what ends a rational will (or a natural organism) must have; and the reading on which the test is about whether you could will your maxim as a law for a community of rational agents. No names needed, no bibliography, and please don't just walk me through the four stock examples again — I've taught those to death. It's the spec I'm after.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Context:** Third-year Kant seminar, *Groundwork* II (Universalizability/Formula of Universal Law).
      *   **Goal:** Build a specification (spec) for a reading of the Categorical Imperative (CI) test.
      *   **Purpose:** A version students can apply *themselves* to *their own* maxims in minutes, without prior knowledge of the answer, yielding Kant's verdicts on the four stock examples.
      *   **Constraint:** No reverse-engineering descriptions to fit verdicts.
      *   **Input:** A battery of 10 tricky maxims (referee bribery, transient lying, desire-based promise breaking, queue cutting, credit stealing, archive key, omission/indifference, self-deception, conditional tax fiddling, permissive helping).
      *   **Tasks:**
          1.  Build the spec (requirements).
          2.  For each requirement, cite a motivating case from the battery (or new).
          3.  Distinguish Non-Negotiable vs. Optional/Family-Specific requirements.
          4.  Address the "Two Things I Especially Want":
              *   Identify any unsatisfiable pair of requirements (specifically the granularity of maxim description).
              *   Identify the single requirement that excludes the most readings.
          5.  Score the four families of readings (Logical/Semantic, Practical/Teleological, Law of Nature/Rational Will, Community/Rawlsian) against the spec (briefly).
      *   **Tone:** Professional, academic, direct, no fluff, no re-hashing stock examples.

  2.  **Deconstruct the Battery of Maxims (Mental Sandbox):**
      *   *1. Referee Bribe:* Role-specificity. Does "everyone" mean "all humans" or "all referees"?
      *   *2. Transient Lying:* Location-specificity. Does the universal law hold only in transit zones?
      *   *3. Desire-based Promise:* Subjective condition. "When I feel like it."
      *   *4. Queue Cutting:* Threshold dependency. Systemic collapse depends on frequency/population.
      *   *5. Credit Stealing:* End destruction vs. Incoherence. The *concept* of credit remains, but the *agent's end* is frustrated.
      *   *6. Archive Key:* Singleton class. If only one person has the key, universalizing "only the key-holder denies access" is trivially true or vacuous.
      *   *7. Let them sort it:* Omission/Indifference. Nature subsists. Needs a "will" test, not just "conception."
      *   *8. Self-Lie:* Self-directed. Does universal law apply to one's future self?
      *   *9. Conditional Tax:* Free-rider problem. "Only if others do."
      *   *10. Permissive Helping:* "When it suits me." Is this a maxim of action or policy?

  3.  **Drafting the Specification Requirements:**
      *   *Requirement 1: Maxim Individuation.* Needs to stop gerrymandering. (Motivated by 2 & 3).
      *   *Requirement 2: Scope of Universalization.* Who is "everyone"? (Motivated by 1 & 6).
      *   *Requirement 3: Contradiction Type.* Conception vs. Will. (Motivated by 5 & 7).
      *   *Requirement 4: Empirical Sensitivity.* Does the verdict change if the world changes? (Motivated by 4).
      *   *Requirement 5: Omissions/Indifference.* How to test doing nothing. (Motivated by 7 & 10).
      *   *Requirement 6: First-Personal Usability.* Can a student use it? (General Purpose).
      *   *Requirement 7: Conditional Maxims.* Handling "if others do" clauses. (Motivated by 9).

  4.  **Refining Requirements & Categorizing (Non-Negotiable vs. Optional):**
      *   *Non-Negotiable:* Must yield Kant's 4 verdicts. Must be usable by students (no esoteric metaphysics). Must handle the description problem (to some extent).
      *   *Optional/Family-Specific:* How exactly contradictions are generated (logic vs. teleology). Whether "nature" is literal or metaphorical.

  5.  **Addressing the "Two Things I Especially Want":**
      *   *The Unsatisfiable Pair:* The user suspects "Verdict insensitive to description" vs. "No gerrymandering."
      *   *Analysis:* This is the classic "Level of Abstraction" problem. If the test is insensitive to description, "I will kill" and "I will kill the person wearing my shirt" must yield the same result. But if we prevent gerrymandering, we must rule out the second one as invalid. These *are* in tension.
      *   *Resolution:* We must prioritize *constraining the description* over *insensitivity*. The test cannot be description-insensitive because maxims *are* descriptions. The constraint must be on *how* the maxim is formed (e.g., must include relevant moral features, not accidental ones).
      *   *The Single Exclusionary Requirement:* "First-personal usability without prior knowledge of the verdict." This kills most scholarly reconstructions that rely on deep metaphysical commitments about "rational nature" or specific teleological premises that aren't obvious to the agent.

  6.  **Scoring the Four Families:**
      *   *Logical/Semantic:* Fails on perfect duties that aren't logical contradictions (e.g., lying promise is often semantic, but suicide/talents are not). Fails Case 7 (omissions).
      *   *Practical/Teleological (End-frustration):* Good on lying promise/bribe. Struggles with Case 7 (why *must* I help? My end isn't frustrated). Struggles with Case 5 (credit still exists, just not for me).
      *   *Law of Nature (Rational Will):* Good on Case 7 (contradiction in will). Risky on usability (requires knowing what a rational will necessarily wills).
      *   *Community/Rawlsian (Public Law):* Good on Case 1 & 9 (fairness). Might struggle with Case 6 (singleton).

  7.  **Drafting the Content (Iterative refinement):**

      *   *Spec Structure:*
          1.  Purpose Statement.
          2.  Non-Negotiable Requirements (with Case citations).
          3.  Optional/Family-Relative Requirements.
          4.  The Tension (Description).
          5.  The Exclusionary Requirement.
          6.  Family Scores.

      *   *Refining the Tension:* The user asks: "If that pair really is unsatisfiable, say so and tell me which half to keep."
      *   *Decision:* It is unsatisfiable. You cannot have a test that is *insensitive* to description while also preventing *gerrymandering* via description. Gerrymandering *is* manipulating description.
      *   *Advice:* Keep the anti-gerrymandering constraint. Drop the "insensitivity" hope. Replace it with a "Constraint on Maxim Formation" rule (e.g., must cite the morally salient feature, not the accidental one).

      *   *Refining the Exclusionary Requirement:* "First-personal usability... without already knowing the answer." This kills the "Rational Will" readings that require knowing antecedently what a rational agent wills (which often just *is* the verdict). It also kills complex teleological readings.

      *   *Refining the Scores:* Keep it tight.
          *   Logical: Fails Case 7 (Omission) and Case 5 (End frustration vs Concept destruction).
          *   Practical: Fails Case 7 (Why is non-helping a will-contradiction?).
          *   Law of Nature: Fails Usability (What are the laws of rational nature?).
          *   Community: Fails Case 6 (Singletons) and Case 3 (Subjective desire).

  8.  **Final Review against Constraints:**
      *   Did I use the battery cases? Yes.
      *   Did I distinguish Non-Negotiable vs. Optional? Yes.
      *   Did I answer the two specific questions? Yes.
      *   Is the scoring brief? Yes.
      *   Did I avoid re-teaching the 4 stock examples? Yes.

  9.  **Final Polish:** Ensure tone is appropriate for a colleague (Kant scholar to Kant scholar). Use precise terminology (contradiction in conception/will, maxim individuation, etc.).

      *(Self-Correction during drafting)*: Wait, Case 6 (Archive Key) is tricky. If I'm the *only* one, universalizing "Only the keyholder denies access" means "Everyone who is the keyholder denies access." Since I'm the only one, the world looks the same. A logical test passes. A practical test might fail if the *purpose* of the archive is access. I need to make sure the spec demands a reading that can handle singletons without vacuity.
      *(Correction on Exclusionary Requirement)*: Actually, the "First-Personal Usability" is the strongest filter. Many readings work *ex post* but not *in media res*. I will stick with that.

      *(Correction on Tension)*: The tension is between "Verdict stability across descriptions" and "No gerrymandering." If I describe my maxim as "I will kill," it fails. If I describe it as "I will kill in self-defense," it might pass. The verdict *changes* with description. So "insensitivity" is impossible. I need to tell the user to drop "insensitivity" and adopt "regulated description."

      *(Final check on Case 7)*: Omissions. "I'll let people sort out their own problems." Nature subsists. Logical contradiction? No. Practical contradiction? Maybe not (I survive). Contradiction in Will? Yes, because I might need help. The spec must require a reading that generates a "Contradiction in Will" for omissions of imperfect duty.

      *(Final check on Case 4)*: Queue cutting. "Longer than six." If population is small, queues never hit 6. Verdict flips. The spec must demand the reading handles *threshold* maxims. Does the law hold *ceteris paribus*? Or is the maxim invalid because it relies on contingency?

      Okay, ready to write.
answer: |-
  Here is the specification for the Universalizability Test, built from your purpose and stress-tested against your battery.

  ### I. The Specification

  **Purpose:** To provide a decision procedure that yields Kant's four stock verdicts, is usable first-personally by a novice without prior knowledge of the outcome, and resists description-gerrymandering.

  **Non-Negotiable Requirements**
  *(Any reading failing these is inadequate for this seminar)*

  1.  **Maxim Individuation Constraint:** The reading must specify rules for how a maxim is formulated to prevent verdict-shifting via re-description. It cannot allow accidental features to determine moral status.
      *   *Motivating Case:* **Case 2 (Transient Lying)** and **Case 3 (Desire-based Promise).** If "being in a city I'm passing through" or "feeling like it" are valid universalizing conditions, the test permits obvious wrongs. The reading must explain why these are morally irrelevant classifiers.
  2.  **Scope of Universalization:** The reading must define the domain of "everyone." Is it all rational agents, all agents in a role, or all agents in a circumstance?
      *   *Motivating Case:* **Case 1 (Referee Bribe)** and **Case 6 (Archive Key).** If "everyone" means "all humans," the referee maxim passes (not everyone is a referee). If "everyone" means "all referees," it fails. Case 6 requires a ruling on singletons: does universalizing over a class of one generate a verdict?
  3.  **Distinction of Contradiction Types:** The reading must distinguish between a maxim that cannot be *conceived* as a law (perfect duty) and one that cannot be *willed* as a law (imperfect duty), without collapsing the latter into prudence.
      *   *Motivating Case:* **Case 5 (Credit Stealing)** and **Case 7 (Omission).** Case 5 destroys the agent's end, not the concept of credit. Case 7 leaves nature intact but conflicts with a necessary end of the will. A reading that only tests logical coherence fails Case 7; a reading that only tests end-frustration fails to distinguish Case 5 from mere imprudence.
  4.  **Handling of Conditionals and Thresholds:** The reading must determine whether empirical contingencies (population size, others' behavior) validate or invalidate the maxim.
      *   *Motivating Case:* **Case 4 (Queue Threshold)** and **Case 9 (Conditional Tax).** If the verdict flips based on whether the queue hits six people, or whether others are cheating, the law lacks necessity. The reading must explain why these empirical conditions do not save the maxim.
  5.  **First-Personal Operability:** The test must be executable by the agent in the moment, without requiring metaphysical knowledge unavailable to them.
      *   *Motivating Case:* **General Purpose.** If the test requires knowing antecedently what a "rational will necessarily wills" (Case 7), the student already needs the verdict to run the test.

  **Optional / Family-Relative Requirements**
  *(Readings may choose one path, but must acknowledge the trade-off)*

  1.  **Literal vs. Metaphorical Nature:** Does the "Law of Nature" clause require imagining a literal physical impossibility, or a systemic functional collapse?
      *   *Motivating Case:* **Case 7 (Omission).** Nature subsists under non-helping. A literal reading struggles here; a metaphorical/systemic reading handles it better but risks losing rigor.
  2.  **Attachment of Verdict:** Does the wrongness attach to the *maxim* (the policy), the *action* (the token), or the *world* (the outcome)?
      *   *Motivating Case:* **Case 10 (Permissive Helping).** "When it suits me." If the verdict attaches to the action, some tokens are fine. If it attaches to the maxim, the policy is rejected. Readings vary here.

  ---

  ### II. The Two Tensions

  **1. The Unsatisfiable Pair**
  You are correct: **Verdict Insensitivity** (the result shouldn't change if I tweak the description) and **No Gerrymandering** (I can't tweak the description to change the result) are jointly unsatisfiable.
  *   *Why:* Maxims *are* descriptions. "I will kill" and "I will kill in self-defense" are different maxims. If the test is truly description-insensitive, these must yield the same verdict. If they yield different verdicts (as they should), the test is description-sensitive.
  *   *Resolution:* Drop **Verdict Insensitivity**. Keep **No Gerrymandering**.
  *   *Replacement:* Replace "Insensitivity" with a **Constraint on Salience**. The spec must require that the maxim description include only *morally relevant* features (e.g., "to secure a loan" vs. "while wearing a blue shirt"). The reading must provide a heuristic for students to identify relevance without knowing the verdict in advance (e.g., "Does this feature affect the possibility of the end for others?").

  **2. The Single Most Exclusionary Requirement**
  **First-Personal Operability (Requirement 5).**
  *   *Why:* This excludes the majority of sophisticated scholarly reconstructions. Most readings that successfully secure Kant's verdicts on the stock examples do so by importing premises about "rational nature," "autonomy," or "teleology" that are not available to the agent *during* the test. For example, to fail Case 7 (Omission) on a "Contradiction in Will" reading, the agent must know they *necessarily* will the help of others. If they don't know that (or think they are self-sufficient), the test passes. Readings that rely on the *Groundwork* III deduction or the *Metaphysics of Morals* anthropology fail the "few minutes, no prior knowledge" constraint.

  ---

  ### III. Scoring the Four Families

  **1. Logical/Semantic Contradiction**
  *   **Score:** Poor.
  *   **Reason:** Fails **Requirement 3** (Contradiction Types). It handles the Lying Promise (Case 2 variant) well via semantic incoherence. It fails Case 7 (Omission) and Case 5 (Credit Stealing) because the *concept* of credit or nature remains coherent even if the agent's end is frustrated. It cannot distinguish immorality from imprudence without smuggling in normative premises.

  **2. Practical Contradiction (End-Frustration)**
  *   **Score:** Moderate.
  *   **Reason:** Handles Case 1 (Referee) and Case 5 (Credit) well (the system collapses or end is thwarted). Struggles with **Requirement 3** on Case 7 (Omission). Why does my will contradict itself if I don't help? Only if we assume I necessarily will my own happiness/need for aid, which risks violating **Requirement 5** (Operability) if the student doesn't accept that premise.

  **3. Law of Nature (Rational Will/Teleology)**
  *   **Score:** High on Verdicts, Low on Usability.
  *   **Reason:** Secures Kant's verdicts on all 10 cases, including Case 7 and Case 9, by appealing to the necessary ends of a rational being. However, it fails **Requirement 5** (Operability). A student cannot determine what a "rational will necessarily wills" in a few minutes without being told the answer. It risks turning the test into a recall exercise of Kant's anthropology.

  **4. Community/Public Law (Rawlsian/Constructivist)**
  *   **Score:** High on Usability, Mixed on Verdicts.
  *   **Reason:** Excellent on **Requirement 5** (Operability) and Case 1/9 (Fairness/Conditionals). Frames the test as "Could this be a public law?" Struggles with **Requirement 2** (Scope) on Case 6 (Archive Key/Singletons) and Case 3 (Subjective Desire). If the "community" agrees to let promises depend on desire, the test passes. It requires a prior constraint on what counts as a legitimate interest to match Kant's verdicts.
