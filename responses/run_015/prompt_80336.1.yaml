answer: |-
  ### Part 1: Mathematical Verification (Do This First)

  Before you run the workshop, you need to be certain the math holds up so you don't get cornered by a sharp grad student.

  **The System:**
  *   **Axiom:** `MI` (Count of I = 1).
  *   **R1:** $xI \to xIU$ (Change in I: 0).
  *   **R2:** $xIIy \to xUy$ (Change in I: -2).
  *   **R3:** $xUUy \to xy$ (Change in I: 0).
  *   **R4:** $x \to xII$ (Change in I: +2).

  **The Invariant:**
  The number of **I's** in any derivable string must be **Odd**.
  *   Start: 1 (Odd).
  *   All rules change the count of I's by an even number ($0, -2, +2$).
  *   Odd + Even = Odd.
  *   Therefore, any string with an **Even** number of I's is unreachable.

  **Target Analysis:**
  1.  **`MUIU`**: I-count = 1 (Odd). **Reachable.**
      *   *Derivation:* `MI` $\xrightarrow{R4}$ `MIII` $\xrightarrow{R2}$ `MUI` $\xrightarrow{R1}$ `MUIU`.
  2.  **`MIII`**: I-count = 3 (Odd). **Reachable.** (Too easy: `MI` $\xrightarrow{R4}$ `MIII`).
  3.  **`MU`**: I-count = 0 (Even). **Unreachable.**
  4.  **`MUII`**: I-count = 2 (Even). **Unreachable.**

  **Decision:** Use **`MUIU`** for Phase 1 (requires 3 steps, uses 3 different rules) and **`MU`** for Phase 2 (the "impossible" goal).

  ---

  ### Part 2: Workshop Structure & Timeline (75 Minutes)

  **Setup:**
  *   **Groups:** 4 Teams (3–4 people each). If you have 14 people, make two teams of 4 and two teams of 3.
  *   **Materials:** Each team gets a deck of index cards (letters written large: M, I, U) and a marker. Whiteboard displays the Rules and Axiom permanently.
  *   **Constraint:** No phones, no external notes. Only the rules on the board.

  #### Phase 0: Orientation (10 Minutes)
  *   **0:00–0:05:** Hand out cards. Explain the Axiom (`MI`) and the 4 Rules. Emphasize that rules are *syntax only*: "You are machines. Do not ask what M, I, U mean. Just match patterns."
  *   **0:05–0:10:** **Calibration Round.** Ask everyone to derive `MIII` together. (Answer: Apply R4 to `MI`). This ensures everyone understands how to physically manipulate the cards according to the rules.

  #### Phase 1: The "Inside" Experience (15 Minutes)
  *   **Task:** "Derive the string **`MUIU`**."
  *   **Instruction:** "Write down every step. You must stop exactly on `MUIU`. If you overshoot, start over."
  *   **Goal:** Get them fluent in the rules. Let them feel the constraint of only moving where the rules allow.
  *   **Facilitator Note:** Walk around. If a team is stuck, ask "What does your string end with?" (Prompting R1/R4 usage). Do not mention counting.
  *   **Wrap:** Ask one team to write their derivation on the whiteboard. Confirm success.

  #### Phase 2: The "Outside" Crisis (25 Minutes)
  *   **Task:** "Derive the string **`MU`**."
  *   **Instruction:** "You have two options. Option A: Produce a derivation chain ending in `MU`. Option B: Convince me it is impossible. **Warning:** If you choose Option B, you cannot just say 'we tried hard.' You must prove that *no possible chain* could ever reach it."
  *   **The Trap:** Teams will spend the first 10 minutes grinding derivations (Inside view). They will generate long strings, delete U's, add I's, but never hit `MU`.
  *   **The Pivot:** Around minute 15, if no one has claimed impossibility, drop a hint: "You are looking at the trees. Is there something about the forest that never changes?"
  *   **Goal:** Teams should discover the parity of the I's.

  #### Phase 3: The Court of Appeal (10 Minutes)
  *   **Rule:** To claim "Impossible," a team must submit a **Preservation Claim** on the whiteboard.
      *   *Format:* "Property P is true for the Axiom. For every Rule, if P is true before, P is true after. Property P is false for the Target `MU`."
  *   **Challenge:** Any other team can try to "break" the claim by finding a rule application where P changes.
  *   **Resolution:** If the claim survives challenge for 2 minutes, that team wins Phase 2.

  #### Phase 4: Debrief (15 Minutes)
  *   Map the activity to the philosophy (see script below).

  ---

  ### Part 3: Roles (For Teams of 3-4)

  Assign these roles to prevent one person from dominating and to enforce the "formal system" feel.

  1.  **The Operator:** The only person allowed to touch/move the index cards.
  2.  **The Scribe:** Records the sequence of rules (e.g., "R4, R2, R1").
  3.  **The Checker:** Verifies every move against the whiteboard rules *before* the Operator makes it. (Crucial for preventing accidental rule-breaking).
  4.  **The Meta-Observer:** (If 4th person exists, otherwise shared) Forbidden from moving cards. Their job is to look at the list of derived strings and look for patterns *across* the strings (e.g., "Hey, all our strings have an odd number of I's").

  ---

  ### Part 4: Debrief Script (Mapping to Theory)

  Do not use the words "Invariant" or "Meta-system" until this section.

  **1. Inside the System (Phase 1 & early Phase 2):**
  *   "In Phase 1, you were working **object-level**. You were inside the formal system. The rules gave you a procedure: if you have X, you can get Y. This is **derivability**. As long as the target was reachable, persistence paid off."
  *   "In early Phase 2, you kept doing the same thing. You were running an algorithm. But the system doesn't contain a rule that says 'Stop, this is impossible.' Inside the system, failure looks exactly like 'haven't succeeded yet.'"

  **2. Stepping Outside (The Proof):**
  *   "To prove impossibility, you had to stop manipulating strings and start talking *about* the strings. You stopped counting I's in a specific string and started counting I's in *all possible* strings."
  *   "This is the **meta-level**. You used arithmetic (odd/even) to prove a fact about syntax (M, I, U). The system itself doesn't know what 'odd' means. *You* know what odd means."
  *   "This is the essence of Gödel's insight: To see the limits of a system, you must stand outside it. The 'truth' that MU is unreachable is not a string in the system; it is a fact *about* the system."

  **3. The "Cheating" Feeling:**
  *   "It might feel like you cheated by using math. 'The rules didn't say I could count!' But that's the point. Logic and arithmetic are the meta-language we use to analyze formal systems. The system is the object; your brain (and arithmetic) is the meta-theory."

  ---

  ### Part 5: Predictable Failure Modes & Fixes

  **1. The "Starts with M" Trap**
  *   **Problem:** A team claims impossibility because "All strings start with M, and MU starts with M, so..." wait, that proves it's *possible*.
  *   **Correction:** They might say "All strings start with M, so we can't reach `U`." But the target is `MU`.
  *   **Better Trap:** They might claim "The number of U's is invariant." (False).
  *   **Fix:** In the "Court of Appeal," rigorously test their property. If they say "U count is invariant," ask them to apply R1 to `MI`. `MI` (0 U) -> `MIU` (1 U). Claim busted.

  **2. "We Just Didn't Try Hard Enough"**
  *   **Problem:** Teams refuse to accept impossibility without a proof, but also can't find the proof. They think `MU` is just really deep in the derivation tree.
  *   **Fix:** At the 20-minute mark of Phase 2, announce: "There are only finitely many properties preserved by these rules. If you haven't found one, you are looking at the wrong feature of the string."

  **3. Rule Lawyering (Overlapping II)**
  *   **Problem:** In `MIII`, can they replace the *second* and *third* I with U? Or only the first two?
  *   **Fix:** Clarify at the start: "An occurrence is a specific instance of the substring. In `MIII`, there is one occurrence of `II` at indices 1-2. There is another at 2-3? No, let's keep it simple: **Left-most matching** or **Any non-overlapping**."
  *   *Recommendation:* Define "occurrence" as "any contiguous substring matching the pattern." In `MIII`, you can replace indices 1-2 to get `MUI`. You cannot replace 2-3 because once you pick an occurrence, you apply the rule. (Actually, for this puzzle, it doesn't matter for the invariant, but it matters for reachability of Phase 1).
  *   *Safest definition:* "You may select any contiguous substring matching the pattern." In `MIII`, indices 1-2 match. Indices 2-3 match. You can pick either. Both lead to `MUI`.

  **4. The "Meta-Observer" Sits Idle**
  *   **Problem:** The person assigned to look for patterns feels useless while others move cards.
  *   **Fix:** Require the Scribe to list the **Count of I's** next to every derived string on their scratch paper. This forces the data needed for the invariant to be visible.

  ---

  ### Part 6: The Big Limitation (Crucial for Philosophy Context)

  You must explicitly address this in the debrief, or you will teach the wrong lesson.

  **The Activity's Lie:**
  "In this workshop, stepping outside the system **worked**. You found an invariant, and it decided the question. You might leave thinking: 'If a system can't answer a question, I just need to find the right meta-property.'"

  **The Gödelian Reality:**
  "That is true for *this* system (MIU-variant). This system is **decidable**. But for sufficiently powerful systems (like Peano Arithmetic), Gödel showed that there are statements where:
  1.  They are true (in the meta-sense).
  2.  They are unprovable (inside the system).
  3.  **And their negation is also unprovable.**
  In those cases, 'stepping outside' doesn't give you a simple algorithm like 'count the I's.' It gives you a statement that is independent. You can't just solve it by finding an invariant; you have to accept that the system is incomplete."

  **Your Takeaway Line:**
  "Today's activity shows you *how* to step outside. Gödel's theorem warns you that sometimes, even when you step outside, you won't find a clean answer—you'll just find that the question itself has no resolution within the framework you built."

  ---

  ### Facilitator's Cheat Sheet (Keep this hidden)

  *   **Reachable Target:** `MUIU` (Steps: `MI` -> `MIII` -> `MUI` -> `MUIU`).
  *   **Unreachable Target:** `MU` (Reason: I-count parity).
  *   **Hint Ladder:**
      1.  "Look at the strings you've written down. What do they all have in common?"
      2.  "Ignore the M and the U for a moment. Focus only on the I."
      3.  "Is the number of I's ever even?"
  *   **Winning Condition for Phase 2:** A team writes on the board: "Axiom has 1 I (Odd). Rules change I-count by 0 or ±2 (Even). Target `MU` has 0 I (Even). Odd cannot become Even."
