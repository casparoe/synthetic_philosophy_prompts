answer: |-
  Here is the brainstorming space you requested, outlining the candidate implicit theories and how we might discriminate between them, followed by the detailed reconstruction and analysis.

  ### Brainstorming Candidate Implicit Theories

  To understand what is doing the work in your industry's "act of God" doctrine and the historian's environmental explanation, I see three competing implicit theories of causation. **First, there is the "Abnormality and Intervention" theory (associated with H.L.A. Hart and Tony Honoré).** This view holds that we select causes from a background of conditions based on what deviates from the "normal course of events"; human voluntary actions are the paradigm of such interventions, while natural events are causes only when they are abnormal intrusions. **Second, there is the "Risk Allocation and Efficiency" theory (associated with Law and Economics).** This view suggests that causal language is merely a proxy for policy decisions about who should bear the loss, typically assigning it to the party who is the *cheapest cost avoider* or the best risk-bearer, regardless of metaphysical agency. **Third, there is the "Probabilistic Attribution" theory.** This view defines causation not by necessity but by *probability-raising*: a factor is a cause if it significantly increases the likelihood of the outcome, even if it is not strictly necessary in any single instance.

  To discriminate between these, we must look at the "hard cases" where they diverge. If the practice were purely **Risk Allocation**, we would see liability assigned to deep-pocketed entities even for truly random events if they could insure cheapest; the fact that "act of God" remains a hard bar suggests the **Abnormality** theory is doing normative work, preserving a zone of non-liability for "nature." However, if the practice shifts toward **Probabilistic Attribution** in climate litigation (where no single emitter is necessary, but all raise risk), the Abnormality theory should collapse. The discriminator is whether the law treats the *baseline* as fixed (Abnormality) or mutable (Probabilistic/Economic). If the baseline moves (e.g., climate change), the "act of God" defense should theoretically vanish under Probabilistic Attribution, yet it persists. This tension suggests your industry is currently running on conflicting operating systems.

  ***

  ### 1. Reconstructing the Implicit Theory: Causes vs. Conditions

  The load-bearing machinery in the "act of God" and natural-peril practice is indeed the distinction drawn by H.L.A. Hart and Tony Honoré in *Causation in the Law*, though your industry likely accesses it through the simpler legal category of *proximate cause*. The theory presupposes that the world consists of a **normal course of events** (the baseline hazard curve you model) and **interventions** (deviations from that curve).

  In this framework, a "cause" is not just any necessary condition; it is the *abnormal* condition that explains why the outcome occurred *now* rather than later, or *here* rather than there. Everything else is demoted to a "mere condition." For your industry, the 1-in-100-year flood is treated as an **actual causation** event—defined here as a relation where event A is a necessary condition for event B in a specific instance—only if it breaches the expected baseline. However, because the flood is "natural," it lacks the *voluntariness* required for moral agency. The doctrine relies on a dual filter: (1) Is the event abnormal relative to the stationary baseline? (2) Is the event attributable to a voluntary human intervention? If (1) is yes but (2) is no, it is an "act of God." The loss falls where it lies (on the insured/owner) because there is no agent to whom blame could stick. This is not merely about physics; it is about preserving a category of "misfortune" distinct from "wrongdoing."

  ### 2. Metaphysics vs. Administration: Where Your Guess Fails

  Your guess is that the metaphysics of "nature is not an agent" is decoration and that the practice is actually a pure risk-allocation story (put the loss on the cheapest cost avoider). This is partially correct but fails to explain the *stickiness* of the act-of-God defense in the face of efficient breach arguments.

  If this were purely economic, insurers would subrogate against anyone who marginally increased the risk, regardless of voluntariness, provided they could pay. The metaphysics is not decoration; it is a **boundary marker for liability**. The practice strictly presupposes a **stable baseline** (as you noted), but it also presupposes a **moral firewall** between *systemic risk* and *individual responsibility*. The guess fails because it cannot explain why we do not sue the geological plate for the earthquake. An economic actor *could* insure against plate tectonics (and does, via reinsurance), but the law refuses to treat the plate as a defendant. The "nature is not an agent" rule is required to stop the regress of liability. Without it, every loss becomes a search for a deeper cause (why was the soil loose? why did it rain?), threatening to overwhelm the legal system with infinite causal chains. The metaphysics provides a *stopping rule* that pure economics lacks.

  ### 3. Philosophical Underdetermination and Divergence

  The practice is philosophically underdetermined because three distinct theories license it, yet they diverge on the frontier cases you face.

  1.  **Common-Sense Causation (Hart & Honoré):** Licenses the practice by treating natural perils as background conditions unless humanly manipulated.
  2.  **Pragmatic Epistemology:** Licenses the practice because we simply cannot trace the causal chain of a storm back to specific human decisions with sufficient certainty to meet the burden of proof.
  3.  **Contractual Convention:** Licenses the practice because the insurance contract is a private agreement to allocate risk, not a public judgment on truth.

  **The Divergence:** These theories split on **climate attribution**. Under Common-Sense Causation, a hurricane is still a "natural event" (an intervention by nature), so no liability attaches to emitters. Under Pragmatic Epistemology, if attribution science says the storm was 3x more likely due to emissions, the epistemic barrier falls, and liability becomes possible. Under Contractual Convention, it depends entirely on how the policy defines "occurrence." The hard case is the **multi-causal threshold event**: A flood occurs because of a 1-in-50-year rain (natural) hitting a city protected only to a 1-in-10-year standard (human negligence). Common-Sense Causation struggles to weight these; Economics says split the loss; Contract law often defaults to "efficient proximate cause" (the dominant cause), which creates binary winners and losers where reality is continuous.

  ### 4. Stress Test: Agency on the Baseline (Climate & Attribution)

  This is the collapse point. Your industry's doctrine relies on **interventionism**—defined here as the view that causation is defined by what happens when we manipulate a variable—applied to *outcomes*, not *baselines*. Emitting carbon or diverting a river is an action that shifts the hazard distribution (the baseline) rather than intervening directly on the specific flood token.

  The doctrine lacks the resources to handle this because it relies on **but-for causation** (would the flood have happened *but for* the defendant's act?). No single emitter is a but-for cause of a specific flood. If the honest fix is adopted, the industry must move to a **probability-raising** model—defined here as the view that A causes B if A increases the statistical likelihood of B—specifically using "fractional responsibility" or "attributable share."

  **The Cost:** This destroys the binary logic of insurance and tort.
  1.  **Binary to Proportional:** Liability is no longer "liable/not liable" but "0.4% liable." This is administratively nightmarish for litigation and claims settlement.
  2.  **End of "Act of God":** If the baseline is endogenous (human-shaped), there are no longer external shocks. Every disaster is partially anthropogenic. The "act of God" clause becomes void for ambiguity.
  3.  **Insurability:** If risks are no longer exogenous stochastic processes but endogenous feedback loops, the mathematical foundation of pooling independent risks weakens. You cannot insure against a systemic shift in the probability distribution itself using models that assume stationarity.

  ### 5. Historiography: The Rule of Explanatory Salience

  Your historian friend is applying a rule of **Explanatory Salience**. A germ or volcano is a historical actor when it functions as a **difference-maker** in a counterfactual scenario relevant to the historian's inquiry.

  *   **The Rule:** Invoke the non-human factor when its removal changes the outcome in the specific narrative context; suppress it when human agency is the variable of interest.
  *   **Epistemological or Political?** It is both. It is epistemological because we select causes that are **intervenable** (in principle) to make the history useful for understanding human choices. It is political because selecting "smallpox" over "conquistadors" can absolve human actors of guilt.
  *   **Diagnosis of Environmental Determinism:** The peril of determinism is not that it cites environmental causes, but that it treats them as **necessary and sufficient** conditions, erasing human contingency. It confuses *enabling conditions* with *decisive actions*.
  *   **The Test Case:** Does "conquistadors destroyed them" differ from "smallpox destroyed them"? Yes, but only if we specify the mechanism. If the claim is "smallpox killed 90% of the population," that is biological causation. If the claim is "smallpox caused the *collapse of the state*," that is historical causation. The pathogen's arrival was caused by the conquistadors (human agency), but the *lethality* was biological. The determinist error is to say the state *had* to collapse because of the germ. The corrective is: "The germ created a vulnerability; the conquistadors exploited it; a different administration might have negotiated or retreated." The historian's rule selects the factor that restores **agency** to the narrative. If citing the volcano explains why the harvest failed, good. If citing the volcano explains why the King starved (ignoring that he sold the grain reserves), that is bad history.

  ### 6. What Changes if the Background is Endogenous?

  If we replace the "nature as given" view with one where the background is endogenous (shaped by prior human action), the changes are radical:

  1.  **In Doctrine:** The "Act of God" defense is abolished or radically narrowed to "Unforeseeable Systemic Shift." Liability shifts from **fault-based** (did you break the rule?) to **risk-based** (did you contribute to the hazard pool?). We would see a rise in **enterprise liability**, where industries pay into a fund based on their contribution to baseline risk (e.g., carbon tonnage), regardless of specific harm causation.
  2.  **In Modelling:** You can no longer use stationary time series. You must model **non-stationary stochastic processes** where the parameters (mu, sigma) are functions of human variables (emissions, land use). The "return period" becomes a moving target. Pricing cannot be based on historical loss alone; it must be based on *scenario analysis* of human behavior.
  3.  **In Historiography:** Historians would stop asking "Nature vs. Nurture" or "Environment vs. Agency." They would adopt **hybrid explanations**: "The political collapse was caused by the interaction of the drought (environment) and the failure of the irrigation bureaucracy (agency)." The "peril" is not the environment, but the *coupling* of human systems with volatile natural systems.

  **A Critique of Your Framing:**
  You ask for the rule that tells you "which is which" (agent vs. background). I suggest this framing begs the question. There is no ontological line between "human act" and "natural event." A flood is water moving down a gradient; a dam release is water moving down a gradient. The distinction is purely **pragmatic and normative**. We draw the line where we want to assign responsibility. Your industry draws it at the boundary of the policy contract; the law draws it at the boundary of foreseeability; the historian draws it at the boundary of human choice. The confusion arises when we treat these pragmatic boundaries as if they were discovered features of the universe rather than constructed tools for managing liability and narrative. The "act of God" is not a metaphysical truth; it is a risk-transfer technology. When the technology fails (because the baseline moves), you cannot fix it with better philosophy; you must rewrite the contract.
