answer: |-
  ### The Curator's Decision Tree: From Object to Claim

  **Start:** You have an object and a findspot.

  1.  **Context:** Was it found in a dedicated space (temple, grave, hoard) or an everyday space (house, midden, field)?
      *   *Everyday* → Go to 2.
      *   *Dedicated* → Go to 3.
  2.  **Association:** Is it grouped with accounting tools (seals, weights, tallies)?
      *   *Yes* → Go to 4.
      *   *No* → Go to 5.
  3.  **Deposition:** Was it placed carefully (aligned, wrapped, focused) or scattered (mixed with ash, bone, broken sherds)?
      *   *Careful* → Go to 6.
      *   *Scattered* → Go to 7.
  4.  **Standardization:** Does it match a known regional standard of measure or value?
      *   *Yes* → **Leaf: Bureaucratic Record-Keeping.**
      *   *No* → **Leaf: Household Craft / Utility.**
  5.  **Multiplicity:** Is it one-of-a-kind or one of hundreds?
      *   *One-of-a-kind* → **Leaf: Status Competition.**
      *   *One of hundreds* → **Leaf: Household Craft / Utility.**
  6.  **The Belief Gate:** Does the imagery or text *explicitly* require a supernatural agent to explain its function? (Failure condition: If it *could* be political or decorative, the answer is No.)
      *   *No* → **Leaf: Status Competition** (Elite display in sacred space).
      *   *Yes* → Go to 8.
  7.  **The Analogy Check:** Is your interpretation reliant on a culture >500 years or >500 miles away with no intermediate links?
      *   *Yes* → **Leaf: Speculative Analogy (Label must note uncertainty).**
      *   *No* → **Leaf: Agnostic — "Ritual or Refuse?"** (See Indistinguishable Pairs).
  8.  **Use-Wear:** Does it show signs of handling/use or is it pristine/intentionally broken?
      *   *Handling* → **Leaf: Cult Practice (Active Use).**
      *   *Pristine/Broken* → **Leaf: Cult Practice (Votive Deposit).**

  ***

  ### Indistinguishable Pairs
  *The evidence allows these two interpretations equally. Do not split them by "vibe."*

  *   **"Ritual or Refuse?"** (Node 7): A high-value object found scattered in a temple floor layer. It could be a discarded offering cleared out later, or it could be elite rubbish dumped in a convenient pit. The material signature is identical.
  *   **"Gift or Tax?"** (Node 5/6): A unique luxury good in a grave with administrative seals. It could be a diplomatic gift honoring the dead, or it could be state tribute recorded at death. Without explicit text, the social mechanism is invisible.

  ### Unoccupied Combinations
  *Paths this flowchart allows, but which curators rarely take.*

  1.  **Mass-Produced Sacred Object + Everyday Context + No Belief Gate.**
      *   *Why unoccupied:* Museums hate labeling things "Ancient Souvenirs." If it's a cheap figurine found in a house, curators prefer "Household Shrine" (Belief) over "Mass-Market Decor" (Economic), even if the production evidence suggests the latter.
  2.  **Administrative Tool + Grave + No Status Markers.**
      *   *Why unoccupied:* When a seal or weight is found in a grave, it is almost always claimed as "Tools for the Afterlife" (triggering the Belief Gate). Arguing for "Bureaucrat buried with work ID" (Secular) is rare, as it denies the deceased a spiritual journey.
  3.  **Pristine Object + Midden + No Deposition Care.**
      *   *Why unoccupied:* If a new, unused object is found in trash, the field defaults to "Ritual Killing/Breaking" immediately. The possibility of "Manufacturing Defect/Discard" is rarely entertained because it is less attractive than a ritual narrative.

  ***

  **Note for the Sidebar:** The "Belief Gate" (Node 6) is the most critical filter. If an object *can* be explained by politics, economics, or aesthetics, it must not be labeled as belief. Belief is the explanation of last resort, not the default setting for the past.
