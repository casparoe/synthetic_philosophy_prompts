answer: |-
  Here is a sequence of seven interview questions designed for your meetup. They are structured to start with the text's premises, move through the logical cruxes you identified (the "is not" and the "yellow horse"), and end with the philosophical stakes.

  Each question includes a **Follow-Up** tailored to the guest's likely defense (that this is about *concepts/intensions* rather than *animals/extensions*). The goal of the follow-ups is to gently press on whether that move solves the problem or just relocates it.

  ### 1. The Opening Premise
  **Question:** "Your reading takes the opening move seriously: 'What designates color is not what designates shape.' In many translations, this looks like a category error—like saying 'The number 5 isn't blue.' How do you justify treating this as a substantive metaphysical claim rather than just a linguistic observation about the words 'white' and 'horse'?"

  **Follow-Up:** "If I understand you, you'd say this is about the *concepts* of color and shape being distinct. But if the concepts are distinct, does that mean a white horse is essentially two separate things glued together? At what point do they become a single object in the world, or do they never do?"

  ### 2. The Meaning of "Is Not" (Fei)
  **Question:** "This is the big logical worry for our group. In English, 'is not' can mean 'is not identical to' (Clark Kent is not Superman) or 'is not a member of the class' (A whale is not a fish). When Gongsun Long concludes 'White horse is not horse,' which 'is not' is he committing to? Is he saying the *concept* isn't identical, or that the *object* isn't a member of the class?"

  **Follow-Up:** "I suspect you'll say he means the concepts aren't identical. But if that's all he means, isn't the claim trivially true for any compound concept? A 'red apple' concept isn't an 'apple' concept. How do we get from that trivial conceptual distinction to the shocking, paradoxical conclusion that seems to deny reality?"

  ### 3. The "Yellow Horse" Argument
  **Question:** "The dialogue argues that if you ask for a 'horse,' a yellow one will do, but if you ask for a 'white horse,' a yellow one won't. To my friend, this looks like a change in the *request*, not the *animal*. It feels like a pragmatic point about how we use language to get what we want. Why should we read this as proof that the concepts themselves are separate entities?"

  **Follow-Up:** "If we grant that this is about the pragmatics of requests, does that undermine the metaphysical weight of the argument? In other words, if the distinction only matters when someone is *asking* for a horse, does the separation exist when no one is speaking?"

  ### 4. The "Gotcha" Charge
  **Question:** "A common criticism, which some of our members hold, is that the School of Names was primarily interested in winning debates through sophistry—using verbal tricks to confuse opponents. What substantive philosophical work does your 'conceptual reading' do that saves Gongsun Long from the charge of just playing a two-thousand-year-old gotcha game?"

  **Follow-Up:** "If the defense is that he's revealing a deep truth about how concepts work, does that mean he was intentionally misleading his audience? Did he expect them to understand it as a conceptual point, or was the 'gotcha' the point, with the conceptual truth being a modern discovery we're projecting back onto him?"

  ### 5. Concepts vs. Reality
  **Question:** "You've mentioned that on your reading, this is about the realm of names and concepts, not the realm of animals. But the text constantly references actual animals—yellow horses, black horses, white horses. If the argument is purely conceptual, why does the text rely so heavily on physical examples? Does the argument collapse if there are no actual horses in the world?"

  **Follow-Up:** "So, are you saying the concepts exist independently of the animals? If we wiped out all the horses in the world, would the concept 'horse' and the concept 'white horse' still be distinct in the way Gongsun Long describes, or does the distinction rely on there being things to distinguish?"

  ### 6. The Philosophical Payoff
  **Question:** "Let's assume your reading is correct and Gongsun Long is making a sophisticated point about conceptual non-identity. What is the payoff for us today? Does this reading offer us a tool for thinking about logic, language, or metaphysics that we don't already get from later Western philosophy, like Frege or Russell?"

  **Follow-Up:** "If the payoff is that it anticipates modern distinctions between sense and reference, does that make Gongsun Long a proto-analytic philosopher? Or is there something unique about the Warring States context that makes this conceptual distinction do different work than it would in a modern logic textbook?"

  ### 7. Falsification
  **Question:** "Finally, I want to ask about the limits of the interpretation. What kind of argument, textual evidence, or logical proof would actually count *against* your reading? Is there a scenario where you would concede that the 'sophistry' or 'gotcha' interpretation is actually the stronger one?"

  **Follow-Up:** "If we found a contemporary text from the Warring States period that explicitly mocked this dialogue as a linguistic trick known by everyone at the time, would you abandon the conceptual reading? Or would you argue that the contemporaries misunderstood him, and only we, two millennia later, can see the true depth?"
