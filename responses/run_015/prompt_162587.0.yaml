answer: |-
  **NUDGE OF THE YEAR: CITATION**

  Presented to the Domestic Efficiency Team for *Project Warmth Default*.

  When citizens interact with state services, cognitive load often obscures their true welfare preferences. *Project Warmth Default* addressed this by implementing a pre-ticked box for high-efficiency heating subsidies on all municipal housing forms. The results demonstrate a paradigm shift in choice architecture.

  Critics often worry about contaminating the choices of fully rational agents. However, the team's ex-post rationality validation protocol ensures zero contamination. We know the nudge worked because 84% of recipients accepted the default. For the remaining 16% who opted out, the team correctly classified them as rational agents who were never going to move. Conversely, everyone who moved was, by definition, someone who needed moving. This elegant circularity guarantees that the intervention only corrects errors without infringing on valid preferences. If the nudge changes your mind, you had a mistake. If it doesn't, you were right all along.

  Transparency requirements were met by publishing the methodology in Footnote 14(b) of the Annual Transparency Register, filed under 'Z' for maximum discoverability by auditors and minimum salience for the public.

  As our Autonomy Assurance Officer stated: "Our protocols ensure that autonomy is never compromised, only facilitated through structured decision pathways that align with observed outcomes."

  ***

  **ACCEPTANCE SPEECH**

  **Delivered by Lead Choice Architect, Sarah Jenkins**

  Thank you to the Minister for State Efficiency and the panel. We are honoured to receive this for *Project Warmth Default*.

  Choice architecture is often misunderstood as limiting freedom. In reality, we protect freedom by measuring it. Our Resistance Ledger logs every opt-out as empirical proof that the exit route remained open. This data is vital. It confirms that no coercion occurred, because coercion would not allow for a logged exit.

  However, resistance is also data. When a citizen opts out of a welfare-enhancing default, it often indicates a present bias or a misunderstanding of their own long-term interests. Therefore, an opt-out is not just a preserved choice; it is a diagnostic flag. Moving forward, citizens who trigger the Resistance Ledger will receive a follow-up form. This second iteration features a stickier default and additional friction on the exit route, such as a mandatory reasoning field and a two-step confirmation.

  This is not punishment. It is care. If someone resists a benefit that is objectively good for them, their autonomy is compromised by their own bias. By increasing the friction, we are simply helping them overcome that internal barrier. We are giving them the freedom to be rational, even if it requires more clicks to be irrational.

  We believe that a nudge that cannot fail is the only ethical nudge. By defining success as alignment with the default, and rationality as alignment with the status quo, we ensure that every outcome is a welfare gain. We are not telling people what to do. We are simply arranging the world so that what they do is what we would have advised them to do if they had asked us, which they didn't, because they needed the nudge.

  Thank you. We look forward to next year's challenges, specifically regarding the organ donor registry and the tax compliance reminders.
