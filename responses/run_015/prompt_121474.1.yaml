answer: |-
  This is a classic debate in meta-ethics and the history of ideas: **Moral Rationalism** (your roommate) vs. **Moral Sociology/Psychology** (Williams/Appiah).

  Your roommate's slogan ("the wrongness was always there, people just had to open their eyes") is rhetorically powerful because it conflates three distinct philosophical claims: an ontological claim (truth exists), an epistemic claim (truth was accessible), and a causal claim (recognizing truth caused the change).

  Here is a menu of the precise claims hidden inside that slogan, ranked from trivial to radical, along with their compatibility with Williams, Appiah, and the "arguments did the work" hypothesis.

  ### The Menu of Claims

  #### 1. The Ontological Claim (Trivial)
  *   **The Claim:** "Slavery and dueling were objectively morally wrong in 1700, even if everyone thought they were right."
  *   **What it commits to:** Moral Realism. It asserts moral truth is time-independent.
  *   **Compatibility with Williams:** **Compatible.** Williams can agree an act was horrible without agreeing that "moral truth" works like a scientific fact waiting to be discovered. He might rephrase it as "those practices were destructive to human flourishing," which is timelessly true.
  *   **Compatibility with Appiah:** **Compatible.** Appiah agrees the practices were harmful. His book *The Honor Code* is not an apology for slavery; it is an explanation of how it ended.
  *   **Does it require arguments to do the work?** **No.** You can believe something was wrong back then without believing that *realizing* it was wrong is what stopped it. (e.g., The plague was always deadly, but avoiding it required sanitation, not just knowing it was deadly).
  *   **Verdict:** This is the weakest version of your roommate's claim. It is true, but it **does not** support his dismissal of honor or interests. It explains *why* we condemn them now, not *how* they ended.

  #### 2. The Epistemic Claim (Moderate)
  *   **The Claim:** "The reasons to oppose slavery/dueling were intellectually available to people at the time; they didn't need new information, just better reasoning."
  *   **What it commits to:** Moral Rationalism. It suggests that the logical inconsistency of slavery (e.g., "all men are created equal") was visible to a 17th-century mind.
  *   **Compatibility with Williams:** **Incompatible.** Williams argues that moral concepts are "thick." A 17th-century aristocrat literally did not have the same conceptual vocabulary for "autonomy" or "humiliation" that we do. The "reasons" weren't available because the *concepts* required to process them didn't exist yet.
  *   **Compatibility with Appiah:** **Mostly Incompatible.** Appiah argues that people *did* have the arguments (religious and philosophical arguments against slavery existed for centuries), but they ignored them. The "reasons" were there, but they lacked *social traction*.
  *   **Does it require arguments to do the work?** **Yes, implicitly.** If the reasons were available, the failure was a failure of reason.
  *   **Verdict:** This is where your roommate starts to lose ground. Appiah explicitly notes that anti-slavery arguments existed for 200 years before slavery ended. If the reasons were sufficient, why did it take 200 years?

  #### 3. The Psychological Claim (Strong)
  *   **The Claim:** "Any rational person, if they calmed down and thought honestly, would have immediately seen it was wrong."
  *   **What it commits to:** Internalism. It suggests moral truth compels assent from any rational agent. It implies those who supported slavery were necessarily irrational or intellectually blind.
  *   **Compatibility with Williams:** **Highly Incompatible.** This is exactly the "science debate" model Williams rejects. Williams thinks moral change involves a shift in *identity* and *motivation*, not just cognitive assent. You can be perfectly rational and still be embedded in a social structure that makes slavery seem necessary.
  *   **Compatibility with Appiah:** **Incompatible.** Appiah's whole point is that rational people participated in dueling and slavery because their *honor* depended on it. It wasn't a failure of logic; it was a conflict of values (Honor vs. Humanity).
  *   **Does it require arguments to do the work?** **Yes.** It assumes the barrier was cognitive confusion, not social pressure.
  *   **Verdict:** This is the claim that allows your roommate to dismiss "honor" or "interests." It treats those things as excuses for irrationality.

  #### 4. The Causal Claim (Radical)
  *   **The Claim:** "The primary mechanism that ended these practices was the widespread acceptance of moral arguments."
  *   **What it commits to:** Moral Progress as Enlightenment. It claims that moral persuasion is the engine of history.
  *   **Compatibility with Williams:** **Incompatible.** Williams sees moral change as "ground shifting." The arguments come *after* or *during* the shift to justify it, not necessarily as the cause.
  *   **Compatibility with Appiah:** **Incompatible.** Appiah argues that arguments only worked once the *honor code* shifted. For example, dueling didn't end because people were convinced it was murder; it ended because it became seen as *unmanly* or *shameful* to kill someone over an insult. The moral argument provided the language, but the honor code provided the motive.
  *   **Does it require arguments to do the work?** **Yes, exclusively.** This claim actively dismisses material interests, economic shifts, or honor codes as secondary.
  *   **Verdict:** This is the claim your roommate is actually relying on to win the argument. It is the most historically vulnerable.

  ---

  ### The "Middle Claim": Knowledge Available but Suppressed

  You asked if the idea that "moral knowledge was available but suppressed" is a real philosophical position or just sounding deep.

  **It is a real position.** It is the core of **Ideology Critique** (Marx, The Frankfurt School, Foucault).

  *   **The Position:** The truth *was* accessible, but material interests (economic gain from slavery) or social structures (honor codes) created a "false consciousness" that prevented people from seeing it.
  *   **Does it save your roommate?** **Only partially.**
      *   It saves the **Epistemic Claim** (Level 2): Yes, the truth was there.
      *   It saves the **Ontological Claim** (Level 1): Yes, the wrongness was real.
      *   **But it undermines the Causal Claim (Level 4):** If knowledge was *suppressed by interests*, then **interests** are the main character in the story, not reason. To end the practice, you didn't just need better arguments; you needed to break the power of the interests suppressing the truth.
  *   **The Trap:** If your roommate adopts this view to sound nuanced, he inadvertently admits that **interests and social structures matter more than arguments.** He would be admitting that "opening eyes" requires dismantling the economic or social systems that keep them closed. This concedes your point about honor and interests.

  ### How to Use This in the Conversation

  Your roommate is using the **Ontological Claim (Level 1)** to smuggle in the **Causal Claim (Level 4)**. He thinks that because slavery *was* wrong, realizing it *must* be what stopped it.

  Here is how you can deploy the menu:

  1.  **Isolate the Causal Claim:** Ask him: *"Do you agree that anti-slavery arguments existed for 200 years before slavery actually ended? If the 'wrongness was always there' and 'reason reveals truth,' why did it take two centuries?"*
      *   If he says "People were irrational," push the **Appiah angle**: *"Appiah argues they weren't irrational; they were prioritizing Honor over Humanity. The change happened when Honor shifted, not when Logic improved."*
      *   If he says "Economics changed," he has conceded your point that interests mattered more than arguments.

  2.  **Challenge the "Science Debate" Model (Williams):** Ask him: *"When the ground shifts in geology, do the rocks 'realize' they should move? Or does the pressure build until the structure collapses?"*
      *   Explain Williams's view: Moral concepts aren't facts like "the earth is round." They are tools we use to live together. When society changes (industrialization, urbanization), the tools change. The arguments are the *symptom* of the change, not the *cause*.

  3.  **The "Suppressed Knowledge" Trap:** If he says, *"The truth was there but suppressed by greed,"* point out: *"Okay, so if greed suppressed the truth, then defeating greed (interests) was the cause of the change, not the moral argument itself. The argument was just the weapon we used once the interests weakened."*

  ### Summary Table for Your Notes

  | Claim Level | Slogan Meaning | Compatible with Williams? | Compatible with Appiah? | Requires "Arguments did the work"? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Ontological** | It was wrong back then. | **Yes** | **Yes** | **No** |
  | **2. Epistemic** | They could have known better. | **No** (Concepts didn't exist) | **No** (They knew, didn't care) | **Implicitly** |
  | **3. Psychological** | Rational people must see it. | **No** | **No** (Honor overrides reason) | **Yes** |
  | **4. Causal** | Arguments caused the end. | **No** (Ground shifting) | **No** (Honor codes caused it) | **Yes** (Exclusively) |

  **The Winning Move:** Tell your roommate you agree with **Level 1** (It was always wrong), but that **Level 4** (Arguments caused the end) is historically false. You can believe slavery was a sin in 1600 without believing that preaching was what killed it in 1860. Appiah and Williams give you the vocabulary to explain *what actually killed it* (honor codes and social scripts) without denying the moral truth.
