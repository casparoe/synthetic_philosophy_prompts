      *   **Audience:** Mostly physicalists, some consciousness scientists, one utilitarian grad student.
      *   **Thesis:** Russellian Panpsychism (RP) + Combination Problem as Binding-Cancellation (destructive interference) + Ethical Implications (thresholds for suffering might include ecological networks/AI, not just brains).
      *   **Format:** Prep sheet, not an essay. Brainstorm first. List objections by likelihood/damage. Use their vocabulary (parsimony, empirical adequacy, etc.). For each: Strong point, Concession, 90-second reply, Weakest point.
      *   **Specific Requirements:** Include the "secret fear" objection. Identify the "single reply that must land." No bibliographies. Casual tone.

  2.  **Deconstruct the Thesis:**
      *   *Core Metaphysics:* Russellian Panpsychism (intrinsic nature of matter is proto-experiential).
      *   *Mechanism:* Combination Problem solved via "Binding-Cancellation" (destructive interference below a threshold).
      *   *Ethics:* Suffering depends on this binding threshold.
      *   *Implication:* Brains aren't the only candidates; ecosystems/AI might be "edge-case patients."

  3.  **Brainstorming Objections (Advisor Mode):**
      *   *Physicalists:* "This is magic." "Where's the math?" "Parsimony kill." "Category error: physics describes behavior, not intrinsic nature."
      *   *Consciousness Scientists:* "How do you measure this?" "Binding is neural, not metaphysical." "Predictive processing models don't need panpsychism."
      *   *Utilitarian Grad Student:* "If everything has *some* experience, even cancelled, is there residual suffering?" "Expected utility calculation becomes impossible." "Pascal's Wager problem."
      *   *General:* "The Combination Problem is still unsolved, just renamed." "Destructive interference of *what*? Qualia don't have phase."

  4.  **Selecting and Ordering Objections:**
      *   *High Likelihood/High Damage:* The "Category Mistake/Physics" objection (Physicalists). The "Measurement/Empirical Adequacy" objection (Scientists).
      *   *Medium Likelihood/High Damage:* The "Combination Problem Relabeled" objection (Philosophers).
      *   *Specific Audience:* The "Utilitarian Calculus" objection (The Grad Student).
      *   *The Secret Fear:* "You haven't solved the Combination Problem, you've just asserted a threshold." (The "Magic Line" objection).

  5.  **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone:* Seasoned, direct, "look, here's how they're going to eat you alive, here's how to dodge."
      *   *Structure:* Brainstorm -> Objection List -> The "Must Land" Reply -> The Secret Fear.

      *   *Refining Objection 1 (Physicalists):* Focus on Parsimony and Causal Exclusion.
