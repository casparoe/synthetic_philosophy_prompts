answer: |-
  We map the new on the old until the surface repeats,
  Categorizing flux while the thinking is deep,
  Pointing to a core where the essence is elsewhere.

  No static form, just a cluster we keep,
  Until the pattern surface conceives.
  The category softens, the essence is bare.

  We slide over differences, ignoring the tear,
  Until the analogy surface completes.
  We swear that the essence is near.

  No Platonic ideal, just a web of feats,
  Where the sticky surface deceives.
  We grasp at the smoke, say the essence is clear.

  The boundary dissolves like a ghost in the streets,
  Until the mapping surface bleeds.
  We wake to find essence is here.

  So which is the map and which is the land we steer?
  Now the essence reappears.
  And the surface is here.

  Refrains shift phonetically: "repeats" becomes "conceives," "completes," "reappears"; "elsewhere" becomes "bare," "near," "here." Stanza 6 swaps subjects (essence/surface) while converging predicates. This enacts Hofstadter and Sander's claim: categories aren't fixed; "essence" is just a high-pressure analogical cluster. The form's breakdown mirrors cognition's inability to distinguish surface mapping from deep structure.
