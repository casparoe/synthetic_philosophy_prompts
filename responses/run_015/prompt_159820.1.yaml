answer: |-
  Here is a disambiguation of the phrase "victors' justice," structured as a menu of distinct claims, followed by the specific analysis of retroactivity and the closing philosophical questions you requested.

  ### Part I: The Menu of "Victors' Justice" Claims

  The phrase is often used as a single blunt instrument, but it conceals at least six distinct arguments. Below, I have categorized them by what must be true for the claim to hold, how to verify it, what is being criticized, and whether the claim transfers to your two contemporary cases (Case 1: Post-dictatorship domestic prosecutions; Case 2: ICC jurisdiction over non-party aggression).

  | Claim | What Must Be True | How to Tell | Target of Criticism | Transfers to Case 1? | Transfers to Case 2? | Classification |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Bench Composition** | The judges are exclusively nationals of the opposing belligerents or political factions, creating an inherent conflict of interest. | Examine the statute establishing the tribunal and the nationality of the appointees. | The *impartiality* of the procedure. | **Weakly.** Transition courts often mix domestic/international judges or rely on new domestic appointees. | **No.** ICC judges are elected by the Assembly of States Parties, not appointed by warring states. | **Substantive.** A procedural due process claim. |
  | **2. Selective Prosecution** | The winning side (or transition government) committed analogous acts but was not investigated or charged. | Compare the factual record of the "victors" against the indictment of the "losers." | The *moral authority* and consistency of the law. | **Yes.** If the new democracy also tortured or disappeared people during the transition or prior. | **Yes.** If permanent UN Security Council members (non-ICC states) commit aggression without consequence. | **Substantive.** Weakens legitimacy but does not void jurisdiction. |
  | **3. Jurisdictional Void** | The tribunal lacks a valid legal basis to bind the specific defendants (e.g., sovereignty violation). | Analyze treaty ratification records or constitutional authority at the time of the act. | The *authority* of the court. | **No.** States generally have sovereign right to prosecute conduct within their territory, even retroactively, subject to human rights constraints. | **Yes.** The core tension of ICC aggression jurisdiction over non-ratifying states. | **Legal/Technical.** Often conflated with legitimacy. |
  | **4. Retroactivity** | The conduct was not criminalized by applicable law at the time of commission (*nullum crimen sine lege*). | Compare the penal code/customary law at the time of the act vs. the statute used at trial. | The *legality* of the conviction. | **Yes.** This is the primary defense in transition trials (acts were legal under the dictatorship). | **Partially.** Aggression is customary, but the specific statutory definition is recent. | **Substantive.** The heaviest philosophical lifting. |
  | **5. Predetermination** | The verdicts were decided by political masters before evidence was heard. | Archival evidence of instructions to judges; statistical impossibility of acquittals. | The *judicial function* itself. | **Possible.** If the transition government dictates outcomes. | **Unlikely.** ICC independence is robust, though political pressure exists. | **Empirical.** If true, it voids the trial's status as a trial. |
  | **6. Legal Nihilism** | "International Criminal Law" does not exist; there is only the capacity of the strong to punish the weak. | This is a philosophical stance, not an empirical claim. | The *concept* of international law. | **Yes.** Implies the transition is just a power swap. | **Yes.** Implies the ICC is merely a tool of Western powers. | **Rhetorical.** A conversation-ender; near-tautological within its own worldview. |

  **Classification Note:**
  *   **Near-Tautological:** Claim 6 (Legal Nihilism). It defines law as power, so any exercise of power by the "winner" is by definition "victors' justice." It cannot be falsified by evidence.
  *   **Substantive and Arguable:** Claims 1, 2, 4. These rely on evidence and legal interpretation.
  *   **False as Stated:** Claim 3 (in Case 1). Domestic courts generally possess jurisdiction over their own territory regardless of regime change; the issue is legality, not jurisdiction.
  *   **The Conversation-Stopper:** Claim 6 is usually what speakers have in mind when they use the phrase to end discussion. It bypasses legal argument to question the entire enterprise.

  ---

  ### Part II: The Retroactivity Family (*Nullum Crimen Sine Lege*)

  This is the core of your difficulty. When sources retreat to "it wasn't a crime then," they are often conflating five distinct variations of the legality principle. Here is the split you requested, with verdicts on their viability.

  #### The Variants

  1.  **No Written Enactment:** *Claim:* There was no specific statute prohibiting the act.
      *   **Verdict:** **Formalistic.** In international law, customary law binds states even without a specific treaty. At Nuremberg, the defense argued the Kellogg-Briand Pact renounced war but did not criminalize it for *individuals*. The Tribunal ruled that customary law had evolved to criminalize it. This claim fails if customary law is accepted as a source.
  2.  **No Penalty Attached:** *Claim:* The act was prohibited, but no punishment was specified.
      *   **Verdict:** **Weak.** Most criminal systems allow judicial discretion in sentencing if the crime is established. Unless the penalty imposed (e.g., death) was explicitly forbidden for that crime, this is a technicality, not a bar to prosecution.
  3.  **No Court Stood Ready:** *Claim:* There was no tribunal with competence to try the offence at the time.
      *   **Verdict:** **Institutional.** Ad hoc tribunals are generally permissible provided they are established by law *before* the trial, even if after the crime. This is rarely a successful bar unless the tribunal is established *by the executive* without legislative basis.
  4.  **Unforeseeability:** *Claim:* A reasonable person could not have known the conduct was criminal.
      *   **Verdict:** **The Core Moral Claim.** This is the strongest version. It focuses on fair notice rather than statutory text. If the norm was widely recognized (e.g., murdering civilians), this claim fails. If the norm was novel (e.g., "aggression" as an individual crime), this claim holds weight.
  5.  **The "Dead Letter":** *Claim:* The rule existed in treaties but was never enforced against anyone, so it was not "real" law.
      *   **Verdict:** **Sociological.** Law does not cease to exist because it is unenforced. However, consistent non-enforcement can erode customary status. This is an argument about the *crystallization* of custom, not retroactivity per se.

  #### The Three Complications

  **1. Planning Conduct vs. Source Constraints (The Leniency Test)**
  Is the maxim *nullum crimen* designed to protect the accused's ability to plan (fair notice), or to constrain the court's sources of law (separation of powers)?
  *   **The Test:** Consider retroactive *leniency* (e.g., a new law decriminalizing collaboration).
  *   **Analysis:** If the principle is about **planning/notice**, retroactive leniency is permissible (the accused is not harmed; they get a benefit they couldn't plan for). If the principle is about **source constraints**, a court might be barred from applying a law that did not exist at the time of judgment, even to help the accused.
  *   **Verdict:** Modern human rights law (e.g., ECHR) treats the principle primarily as a shield for the accused. Therefore, retroactive leniency is generally permitted. This suggests the principle is about **fair notice**, not rigid source formalism. In your Case 1, if the new regime decriminalizes acts, the legality principle does not object. If it criminalizes them, the principle objects strongly.

  **2. Good-Faith Belief vs. Retroactivity**
  Is the accused's belief that his conduct was legal a separate objection?
  *   **Analysis:** Yes. *Nullum crimen* is an objective question: *Did the law exist?* Mistake of law is a subjective question: *Did the defendant know?*
  *   **Verdict:** They are distinct. A law can exist (satisfying *nullum crimen*) but be so obscure that a defendant's good-faith belief negates *mens rea*. However, in transition cases (Case 1), defendants often argue, "It was legal under the old regime." This is not a mistake of law; it is a conflict of laws. The court must decide which regime's law governs. This is a **choice of law** problem, not strictly a retroactivity problem, though it functions similarly.

  **3. Count-by-Count Assessment**
  Must the objection be assessed per charge?
  *   **Analysis:** Absolutely. Charging a minister for **murder** or **torture** relies on norms that were crystallized and foreseeable (Geneva Conventions, domestic penal codes). Charging them for **aggression** relies on much thinner ice (Kellogg-Briand, UN Charter).
  *   **Verdict:** A "victors' justice" critique based on retroactivity may be **false** regarding war crimes (murder/torture) but **substantive** regarding crimes against peace (aggression). Conflating the two allows critics to dismiss the entire trial based on the weakest count. In Case 2 (ICC Aggression), this distinction is vital: the court may have jurisdiction over genocide (customary) but struggle with aggression (statutory/treaty-based) regarding non-parties.

  ---

  ### Part III: Closing Questions

  **1. On which reading is "victors' justice" a genuine argument rather than a sneer, and can it be stated without immunizing everyone (including amnesty)?**

  *   **Genuine Argument:** The phrase is a genuine argument only when it maps onto **Claim 2 (Selective Prosecution)** or **Claim 4 (Retroactivity/Unforeseeability)**.
      *   *Selective Prosecution* argues that the law is being applied unequally, undermining its normative force.
      *   *Retroactivity* argues that the state is violating the Rule of Law to achieve a political end.
  *   **The Amnesty Paradox:** You ask if the critique can be stated without immunizing the critic's preferred alternative (amnesty).
      *   If the critique is **Legal Nihilism (Claim 6)**, it immunizes everyone: trials are power, amnesty is power, neither has legitimacy.
      *   If the critique is **Strict Legality (Claim 4)**, it blocks prosecution but *permits* amnesty. (If there is no law, there is no duty to prosecute).
      *   **The Solution:** To avoid immunizing everyone, the critic must argue from **Political Legitimacy** rather than strict legality. The argument would be: *"A trial conducted under these conditions (retroactive/selective) will fail to establish a historical record or reconcile the nation, whereas a truth commission or amnesty might."* This critiques the *efficacy* of the justice without denying the *possibility* of justice. It avoids the nihilistic trap where neither trial nor amnesty has standing.

  **2. If a court convicts in violation of the legality principle, is the trial itself best described as an injustice of the same kind it was convened to punish, or is that a confusion?**

  *   **Verdict:** It is a **confusion**, specifically a category error.
  *   **Reasoning:**
      *   The defendants (in your cases) are typically accused of substantive atrocities: murder, torture, aggressive war. These are injustices against **persons** and **human rights**.
      *   A trial violating *nullum crimen* is an injustice against the **Rule of Law** and **procedural legitimacy**.
      *   While both are "wrong," they are not "the same kind." Equating a procedural violation by a state with the substantive violence of a dictatorship creates a moral equivalence that obscures the gravity of the original crimes.
      *   **Nuance:** However, if the trial is *purely* a sham (Claim 5: Predetermination), it becomes an instrument of persecution. In that specific instance, the trial itself becomes an act of political violence. But merely convicting on a retroactive statute (e.g., prosecuting a dictator for acts legal under his own constitution) is a **legal injustice**, not necessarily a **moral atrocity** equivalent to the dictator's crimes. It undermines the successor regime's claim to be *more* lawful than the predecessor, but it does not make them *equally* criminal.

  ### Summary for Your Piece

  When your sources say "victors' justice," press them to specify: Are they complaining that the **law didn't exist** (Retroactivity), that the **law wasn't applied to everyone** (Selectivity), or that **law is just power** (Nihilism)?

  *   If **Retroactivity**: Ask them to distinguish between murder (always a crime) and aggression (legally ambiguous).
  *   If **Selectivity**: Ask if unequal enforcement voids the conviction of the guilty, or merely damages the court's moral authority.
  *   If **Nihilism**: Acknowledge that this is a philosophical stance that renders *any* legal argument (including for amnesty) impossible.

  The phrase does the most argumentative work when it remains ambiguous. Disambiguating it reveals that while "victors' justice" is a potent warning against hypocrisy and overreach, it is often deployed to shield actors from accountability for conduct that was, in a moral if not statutory sense, criminal long before the gavel fell.
