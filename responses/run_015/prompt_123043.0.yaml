answer: |-
  ### Audience Intelligence Brief
  **Cognitive Psychologists (Gentner/Structure-Mapping):**
  *   **Commitments:** Analogy is the mapping of relational structure (systematicity) from base to target. Attributes are superficial; relations are deep. Models should be computationally precise and predictive (e.g., SME).
  *   **Vocabulary:** Structural alignment, systematicity principle, relational focus, isomorphism, falsifiability, predictive constraint.
  *   **Bias:** View Hofstadter's work as "poetic" but scientifically loose; see slippage as noise to be filtered, not the engine.

  **Analytic Philosophers (Classical Conceptual Analysis):**
  *   **Commitments:** Concepts require stable truth conditions for reasoning to be valid. Vagueness is a defect to be managed, not a feature. Normative domains (law, ethics) demand determinacy to guide action.
  *   **Vocabulary:** Necessary/sufficient conditions, intension/extension, truth-conditions, normative force, semantic stability, sorites.
  *   **Bias:** View "fluid concepts" as a category error; if a concept slips, it isn't the same concept, rendering inference invalid.

  ***

  ### Q&A Prep Sheet: Defending Fluid Concepts & Slippage

  #### 1. The "Anything Goes" Objection (Falsifiability)
  **Objection:** "If conceptual slippage is constitutive rather than noise, your model lacks the fixed structural constraints necessary for falsifiability. Without deterministic rules, how do you distinguish a valid analogical inference from a hallucination, and isn't this scientifically vacuous?"
  **Reply:** Hold Firm. Slippage is not random; it is constrained by "pressure" dynamics within the Slipnet. Just as statistical mechanics predicts gas behavior without tracking every molecule, Slipnet dynamics predict probabilistic outcomes based on activation levels and contextual temperature. We are not claiming "anything goes," but that the space of valid analogies is fluidly bounded, not rigidly boxed. The model is falsifiable if it fails to predict the *distribution* of human responses under varying contextual pressures.
  **Weakest Point:** Quantifying "pressure" independently of the observed analogical output is notoriously difficult.

  #### 2. The "Legal Stability" Objection (Normative Force)
  **Objection:** "You claim this extends to patent law, but normative domains require determinate truth conditions to guide action. If 'equivalent structure' is subject to irreducible slippage, legal rulings become arbitrary, undermining the rule of law."
  **Reply:** Concede Ground (on outcome, not process). I concede that legal *rulings* must appear stable to function normatively. However, my thesis concerns the *interpretive process* leading to that ruling. Judges and patent examiners engage in conceptual slippage to reach reflective equilibrium; the stability is a negotiated outcome, not a pre-existing semantic fact. Acknowledging the slippage explains why borderline cases are litigated, not why law fails.
  **Weakest Point:** Legal practitioners may reject the implication that their core definitions are fundamentally unstable.

  #### 3. The "Structure vs. Surface" Objection (Explanatory Depth)
  **Objection:** "Structure-mapping theory explains analogy via systematicity—higher-order relations hold while attributes slip. Your Slipnet model treats these as equivalent activation shifts. Doesn't this collapse the crucial distinction between deep structural alignment and superficial feature matching?"
  **Reply:** Hold Firm. Structure-mapping assumes structure is pre-existing and static. In fluid cognition, what counts as "structural" versus "superficial" is itself a product of slippage. The Slipnet explains *why* a relation becomes salient enough to be mapped in the first place. Structure is the residue of successful slippage, not the precondition for it.
  **Weakest Point:** Copycat microdomains do not yet handle high-order relational complexity as well as SME.

  #### 4. The "Formalism" Objection (Technical Capability)
  **Objection:** "You argue that exception-free rules destroy analogical capacity. But modern probabilistic formalisms handle flexibility without abandoning precision. Aren't you attacking a strawman of 'rules' rather than formalism itself?"
  **Reply:** Hold Firm. Probabilistic rules still assume fixed tokens (categories) that have probabilities of applying. Slipnet dynamics assume the tokens *themselves* change identity under pressure. A probabilistic rule says "A might be B." Slipnet says "Under this pressure, A *becomes* B." The latter is ontological fluidity, not epistemic uncertainty, which standard formalism cannot capture.
  **Weakest Point:** The distinction between ontological fluidity and high-dimensional probabilistic mapping is subtle and easily blurred.

  #### 5. The "Toy Domain" Objection (Ecological Validity)
  **Objection:** "Copycat operates on letter strings with trivial semantics. Generalizing from 'abc' to 'abd' to patent claims ignores the semantic depth and world-knowledge required for real-world analogy. Isn't this just a parlor trick?"
  **Reply:** Hold Firm. Microdomains are the "hydrogen atoms" of cognition. They isolate the mechanism of slippage without the noise of encyclopedic knowledge. If the mechanism cannot work in the clean case, it cannot work in the messy case. We are claiming identity of mechanism, not identity of complexity.
  **Weakest Point:** The leap from letter topology to legal semantics remains intuitively stark for many empiricists.

  ***

  ### The Killer Question
  **"How do you measure Slipnet pressure independently of the analogical outcomes it is supposed to explain, without falling into circular reasoning?"**
  *(The speaker hopes nobody asks this because it targets the empirical measurability of the core theoretical construct.)*
