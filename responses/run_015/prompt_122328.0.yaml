answer: |-
  **To:** Public-History Division Supervisor
  **From:** [Your Name], Intern
  **Subject:** Draft Protocol for Evaluating Commemorative Tradition Claims
  **Date:** October 26, 2023

  ### Introduction

  Per your request, I have drafted a decision procedure for evaluating exhibit proposals that claim historical continuity. This protocol translates academic frameworks regarding the "invention of tradition" (Hobsbawm & Ranger) and "imagined communities" (Anderson) into a practical audit tool for curatorial staff.

  The goal is not to debunk traditions, but to classify them accurately. A "modern invention" is not inherently less valuable than a "continuous tradition," but mislabeling them compromises public trust. The procedure below audits claims across three axes and identifies specific points where historical analysis must yield to curatorial judgment.

  ***

  ### Part I: The Tradition Continuity Audit (TCA) Protocol

  **Instructions:** Complete Steps 1–4 for every proposal. If a "Stopping Rule" is triggered, halt the process and escalate to the Senior Curator.

  #### Step 1: Claim Identification
  Define the specific claim made by the proponents.
  *   **Claim Type:** Is the practice described as *Continuous* (unbroken), *Revived* (broken but restored), or *Ancestral* (symbolically linked to a distant past)?
  *   **Origin Date Claimed:** What date or era is publicly cited?
  *   **Stopping Rule:** If the proponents cannot provide a specific origin date or era, flag as **High Risk: Vague Mythology**. Proceed to Step 2 only if a specific claim is isolated.

  #### Step 2: The Three Axes Audit
  Compare the *Claimed Past* against the *Earliest Verifiable Evidence*. Score the divergence on three axes.

  1.  **Functional Purpose:** What did the practice *do* then vs. what does it *do* now?
      *   *Example:* A harvest ritual for survival (then) vs. a harvest festival for tourism (now).
      *   *Threshold:* If the function shifts from *obligatory/sacred* to *optional/performative*, mark as **Functional Rupture**.
  2.  **Symbolic Content:** What objects, words, or gestures are used?
      *   *Example:* Specific oaths, flags, costumes, or routes.
      *   *Threshold:* If >50% of symbolic elements are demonstrably anachronistic (created after the claimed origin), mark as **Symbolic Rupture**.
  3.  **Social Body:** Who participates?
      *   *Example:* A specific guild/clan (then) vs. the general public (now).
      *   *Threshold:* If the participation shifts from *exclusive/ascribed* (born into it) to *inclusive/voluntary* (choose to join), mark as **Social Rupture**.

  #### Step 3: The Imagined Community Test
  This step tests for the characteristics of modern nationalism rather than local custom.
  *   **Mediation:** Is the tradition coordinated via mass media, government circulars, or standardized curricula rather than oral transmission?
  *   **Anonymous Co-participation:** Do participants feel connected to thousands of others they will never meet performing the same act simultaneously?
  *   **Decision:** If **YES** to both, classify as **State-Mediated Ritual** (likely late 19th/20th century origin) rather than **Folk Custom**.

  #### Step 4: Classification & Handoff
  Based on Steps 2 and 3, assign a preliminary classification.

  *   **Class A: Continuous Tradition.** No ruptures on any axis. Evidence supports unbroken practice.
  *   **Class B: Revived Practice.** Clear gap in time, but proponents acknowledge the gap and attempt fidelity to the original.
  *   **Class C: Deliberate Modern Invention.** Created recently to serve a modern function, but openly acknowledged as new.
  *   **Class D: Retroactive Misattribution.** Created recently, but claimed to be ancient. **(Highest Ethical Risk)**

  **THE HUMAN HANDOFF (Stopping Rule):**
  If the protocol yields **Class D**, or if there is a **Symbolic Rupture** in Step 2, the procedure **MUST STOP**.
  *   *Reason:* Determining whether a symbolic change constitutes a "rupture" or an "evolution" is a value judgment, not a mechanical one.
  *   *Action:* File a "Curatorial Judgment Memo." The Senior Curator must decide whether historical accuracy outweighs community cohesion.

  ***

  ### Part II: Application of Protocol to Current Proposals

  Below is the audit of the three current proposals using the TCA Protocol.

  #### Case 1: The "Medieval Winter Solstice Procession"
  *   **Claim:** Ancient medieval tradition continuous to present.
  *   **Evidence:** Archives show guild organization in 1923; hiatus 1940–1988; revived 1988.

  **Audit Results:**
  *   **Step 1 (Claim):** Claimed "Medieval." Verifiable origin 1923. **Mismatch.**
  *   **Step 2 (Axes):**
      *   *Function:* 1923 (Guild solidarity/commerce) → 1988 (Tourism/Civic Pride). **Functional Rupture.**
      *   *Symbol:* 1923 costumes match 1920s theatrical interpretations of medieval, not actual medieval. **Symbolic Rupture.**
      *   *Social:* 1923 (Merchant Guild members) → 1988 (General Public). **Social Rupture.**
  *   **Step 3 (Imagined Community):** No. This is local, not national/mediated.
  *   **Step 4 (Classification):** **Class D: Retroactive Misattribution.**

  **Outcome:** The protocol halts at the Human Handoff.
  *   **Curatorial Note:** We cannot label this "Medieval." We can label it "A Tradition of Revival beginning in 1923." The claim of medieval continuity is factually incorrect.

  #### Case 2: National "Day of Unity" Flag-Raising
  *   **Claim:** Descends from 13th-century communal oaths.
  *   **Evidence:** Standardized by Ministry of Interior in 1892.

  **Audit Results:**
  *   **Step 1 (Claim):** Claimed 13th Century. Verifiable standardization 1892. **Mismatch.**
  *   **Step 2 (Axes):**
      *   *Function:* 13th C. (Local defense pacts) → 1892 (National loyalty to State). **Functional Rupture.**
      *   *Symbol:* 1892 Flag did not exist in 13th Century. **Symbolic Rupture.**
      *   *Social:* 13th C. (Local villagers) → 1892 (Citizens of the Nation). **Social Rupture.**
  *   **Step 3 (Imagined Community):** **YES.** The 1892 Ministry standardization ensures anonymous co-participation across the nation via mediated instructions.
  *   **Step 4 (Classification):** **Class D: Retroactive Misattribution** (specifically, a Nationalist Invention of Tradition).

  **Outcome:** The protocol halts at the Human Handoff.
  *   **Curatorial Note:** This is a classic example of late-19th century state formation. The exhibit should not present the 13th-century link as historical fact, but rather as *the myth the state used to unify the population in 1892.* The "invention" is itself the historical story.

  #### Case 3: School Induction Ritual
  *   **Claim:** Century-old founder's tradition.
  *   **Evidence:** Student Handbook archives show first appearance in 1994.

  **Audit Results:**
  *   **Step 1 (Claim):** Claimed ~1920s (Century-old). Verifiable origin 1994. **Mismatch.**
  *   **Step 2 (Axes):**
      *   *Function:* 1994 (Community building) → Present (Community building). **No Functional Rupture.**
      *   *Symbol:* 1994 artifacts still in use. **No Symbolic Rupture.**
      *   *Social:* 1994 (Students) → Present (Students/Alumni). **No Social Rupture.**
  *   **Step 3 (Imagined Community):** Partial. Alumni feel connection to past students, but it is interpersonal, not state-mediated.
  *   **Step 4 (Classification):** **Class D: Retroactive Misattribution.** (Despite functional continuity, the *age* claim is false).

  **Outcome:** The protocol halts at the Human Handoff.
  *   **Curatorial Note:** This is the most difficult case. Historically, the claim is false. However, the *value* of the ritual to the community is high.
  *   **Conflict:** The protocol demands we flag the 1994 date. My personal attachment to the ritual makes this finding uncomfortable. It demonstrates that **historical accuracy and community meaning are not always aligned.**
  *   **Recommendation:** We must correct the date in the archive, but we need not dismantle the ritual. The exhibit text could read: *"While often associated with the founders, this ritual was established by the Class of 1994 to reconnect with founding values."* This preserves the value while correcting the history.

  ***

  ### Part III: Analysis of Judgment Calls and Limitations

  In applying this procedure, three specific friction points emerged where the mechanical steps fail and human judgment is required.

  **1. The "Symbolic Rupture" Threshold**
  In Case 2 (Day of Unity), the protocol flags the flag itself as an anachronism for a 13th-century claim. However, a curator might argue that the *spirit* of the oath is continuous.
  *   **The Handoff:** The protocol cannot measure "spirit." It measures artifacts. The curator must decide if "spiritual continuity" justifies "factual imprecision" in public text. My recommendation is **no**: public history must be precise about dates, even if it discusses intangible values.

  **2. The Value of the Invention**
  In Case 3 (School Ritual), the protocol classifies the tradition as a "Misattribution." This sounds negative. Yet, the ritual creates genuine social cohesion.
  *   **The Handoff:** The protocol identifies the *lie*, but not the *lie's utility*. The curator must decide if correcting the record will cause undue harm to community identity. In this case, correcting the date (1994 vs. 1920s) does not destroy the ritual's meaning, so the correction should proceed.

  **3. Documentation Gaps**
  If Case 1 had no archives from 1923, only oral testimony, Step 2 would stall.
  *   **The Handoff:** The protocol requires a "Insufficient Evidence" stop. In public history, absence of evidence is not evidence of absence, but we cannot claim continuity without proof. The default position must be **skepticism** until proof is found.

  ### Conclusion for the Division

  This procedure successfully distinguishes between organic customs, revived practices, and state-managed inventions. It forces us to confront the "Invention of Tradition" not as a way to dismiss practices, but to categorize them honestly.

  As demonstrated in Case 3, applying this protocol can be personally difficult when it challenges traditions we value. However, the integrity of the museum depends on our willingness to let the evidence trigger the Handoff, even when the resulting Curatorial Judgment requires us to tell a community that their story is newer than they believed.

  **Recommendation:** Adopt Steps 1–4 as mandatory intake for all commemorative exhibits. Empower the Senior Curator to make the final call on all "Human Handoff" cases, ensuring that the decision to prioritize accuracy over attachment is borne at the leadership level, not by junior staff.
