      *   **Core Claim:** Second-order alignment capital is not a competitive penalty but a strategic hedge that lowers exposure to catastrophic liability, relaxing the constraint for long-horizon firms.
      *   **Framing:** Treat the "alignment tax" as bifurcated (first-order vs. second-order). Show how standard framing conflates them, misrepresenting strategic calculus.
      *   **Format:** Continuous prose, no headings, no bullet points, no bold text, no tables, no formatting. Single flowing essay or formal letter.
      *   **Constraints:** No bibliographies, reading lists, or citations. Reasoning must stand on its own.
      *   **Persona:** Advisor to an AI research consortium on long-range strategy.
      *   **Tone:** Serious, analytical, persuasive, formal.

  2.  **Deconstruct the Argument:**
