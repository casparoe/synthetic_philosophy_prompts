answer: |-
  This is a sharp dissection of a profound ethical and metaphysical gap. You have identified a tension between **ontological reality** (what the brain is actually doing) and **epistemic verification** (what we allow ourselves to count as proof).

  The institutional split you describe presupposes a view of consciousness that is **radically operationalist** and **socially functionalist**, but it indeed smuggles in a **Cartesian Theater** requirement by demanding a "performance" of selfhood.

  Here is a breakdown of the philosophical commitments at play, why the system resists the fMRI data, and what shifting to neural protocols would imply.

  ### 1. The Institutional Presupposition: Operationalism as Defense
  The current medical-legal framework does not officially claim that consciousness *is* behavior. Instead, it claims that consciousness *is knowable only through* behavior. This is **methodological behaviorism**.

  *   **The Presupposition:** The system presupposes that for a mind to have moral status in a public, legal context, it must be a **public object**.
  *   **The Cartesian Smuggle:** You asked if this smuggles in a Cartesian Theater. Yes, but specifically a **theater of public display**. It assumes that the "self" is not real until it projects itself onto the screen of the social world. By requiring a grimace, a eye blink, or a finger movement, the protocol demands that the "little man inside" pull a lever to prove he exists.
  *   **The Illusion Paradox:** You noted that if consciousness is a "user illusion" (Dennett/Frankish), prioritizing behavior seems backward. If the brain is a machine generating a user interface, fMRI sees the machine code running (motor cortex activation), while behavioral tests wait for the UI to render on an external monitor.
      *   *Why the bias?* Because the "user illusion" theory posits that the function of consciousness is **control and social coordination**. If the control output is severed, the system treats the "user" as functionally dead, even if the background processes (the "machinery") are running. The system treats the *function* of consciousness as more morally weighty than the *phenomenology* of it.

  ### 2. Why Behavior is "Realer" than Neural Activity (in Court)
  You asked if there is a coherence argument for behavioral tests even on an illusion-model. There is, but it is pragmatic, not metaphysical.

  *   **The Problem of "Automaticity":** fMRI studies (like the famous Owen et al. tennis/imagery studies) detect *access consciousness* (information available for report), not necessarily *phenomenal consciousness* (qualia). A sophisticated zombie could theoretically modulate its motor cortex via residual reflexes or automated priming without "anyone being home."
  *   **The Reliability Heuristic:** Behavioral output is the evolutionary gold standard for "other minds." If I poke you and you scream, I infer pain. If I poke you and your fMRI lights up but you don't scream, the inference is statistically riskier.
  *   **The Legal Binary:** Law requires binary states (competent/incompetent, alive/dead). fMRI provides probabilities and signal-to-noise ratios. Behavioral checklists provide checkmarks. The institution prefers a **false negative** (declaring someone vegetative who is conscious) over a **false positive** (keeping someone on life support who is gone) because the former is a tragedy, but the latter is a resource violation and a potential fraud on the estate.

  **However,** this coherence argument collapses when we consider **Locked-In Syndrome**. We accept Locked-In patients as fully conscious because they can eventually move *one* muscle. The vegetative patients with covert cognition are essentially Locked-In patients who have lost that *one* muscle. The distinction is anatomical (brainstem vs. cortical motor output), not necessarily phenomenological.

  ### 3. What Commitments Would fMRI Protocols Require?
  If we replaced bedside exams with mental-imagery fMRI as the gold standard for personhood, we would be signing up for significant philosophical shifts:

  **A. Functionalism over Behaviorism**
  We would be committing to the view that **computation constitutes existence**. If the brain runs the "tennis" program, the person is present. This decouples moral status from the ability to *affect* the world and ties it to the ability to *represent* the world.
  *   *Implication:* A brain in a vat that can modulate its own activity would have full human rights, even if it has no body.

  **B. Shift from Relational to Intrinsic Value**
  Current protocols are **relational**: You are a person because you can relate to me (look at me, follow my command).
  fMRI protocols are **intrinsic**: You are a person because your internal state meets a complexity threshold.
  *   *Implication:* This grants moral status to beings that cannot interact, potentially expanding the circle of moral concern to include severe paralysis, advanced dementia (if they can still image), or even certain AI systems if they pass the neural-equivalent test.

  **C. The End of the "Audience" Requirement**
  This is the direct answer to your Cartesian Theater worry. Adopting fMRI protocols admits that **consciousness does not need an audience.** It validates the idea that the "user illusion" is real even when the screen is turned off. It acknowledges that the "machinery" is the seat of value, not the "interface."

  ### 4. Is the Current System Consistent with "No Theater"?
  No. The current system is inconsistent with a strict "No Cartesian Theater" (Illusionist) view.

  *   **Illusionism says:** There is no inner spotlight, just complex processing.
  *   **Current Practice says:** We will only credit the processing if it shines a spotlight *outward*.

  By demanding behavioral output, the medical-legal system treats consciousness as a **broadcast signal**. It assumes that if the signal isn't transmitting, the station is off the air. This is a form of **verificationist idealism**: *Esse est percipi* (to be is to be perceived), or in this case, *to be is to be perceivable.*

  If we truly accepted that consciousness is just internal machinery (the illusion-model), then the fMRI data *should* be sufficient. The fact that it isn't suggests that we don't actually care about consciousness *per se*; we care about **agency**. We value the *capacity to act* more than the *capacity to experience*.

  ### 5. The Ethical Cost of the Split
  The institutional split preserves a **solipsistic safety zone**.
  *   **For the Doctor/Lawyer:** It protects them from the uncertainty of other minds. If I can't see you move, I am not legally liable for assuming you aren't there.
  *   **For the Patient:** It creates a class of "ontological ghosts." They exist neurologically but are socially dead.

  If we switched to fMRI protocols, we would be admitting that **privacy does not negate personhood.** We would be acknowledging that a human being can be fully "in there," suffering, hoping, or imagining, even if the drawbridge to the outside world is permanently raised.

  ### Summary
  The current system presupposes that consciousness is a **public performance**. It treats the "user interface" (behavior) as the only admissible evidence of the "operating system" (mind). This is inconsistent with the "user illusion" model, which suggests the machinery is the reality.

  By ignoring covert cognition, the system smuggles in a **Cartesian Theater of Social Verification**: *I am only real if I can convince you I am real.* Moving to fMRI protocols would be a commitment to **neural functionalism**, asserting that the internal computation of self-modeling is sufficient for moral status, regardless of whether that self can ever wave hello again. It would be an admission that the "illusion" of consciousness is happening in the dark, and that the dark is still sacred.
