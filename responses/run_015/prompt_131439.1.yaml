      *   *Nuance on Illusionism:* If consciousness is an illusion, the "feeling" of being there is the illusion. fMRI detects the *mechanism* of the illusion. Behavior detects the *output* of the illusion. Why prefer output? Because the illusion is *for* output. But if the output channel is cut, the mechanism still runs. The current system ignores the running mechanism.

