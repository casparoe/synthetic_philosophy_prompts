  2.  **Deconstruct Szasz's Argument (Philosophical Context):**
      *   Szasz is often misunderstood as a denial of suffering. He isn't. He's a semantic and political critic.
      *   *Core Claim:* "Mental illness" is a category mistake. Diseases are of the *body* (lesions, pathology). "Mind" is not a physical object. Therefore, "illness of the mind" is a metaphor.
      *   *The "Lesion" Criterion:* Szasz did emphasize physical pathology. However, his definition of disease is tied to *bodily* dysfunction, not just statistical deviation or biomarkers.
