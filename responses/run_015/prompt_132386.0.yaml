      *   **Scenario:** A classmate dismissed concerns about inflated false-positive rates in a proposed personality disorder expansion by claiming classifications "loop back and remake the people they name, so debating boundaries is moot."
      *   **User's Stance:** Skeptical that looping renders boundary disputes irrelevant.
