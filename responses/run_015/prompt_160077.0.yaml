answer: |-
  This is a sharp dissection of the normative architecture underlying conservation policy. You have correctly identified that current practice is a patchwork of evolutionary concepts that are not always philosophically coherent.

  You asked me to say plainly if your question is confused. Here is the direct answer: **Yes, the question conflates *units of selection* with *units of value*.**

  Conservation policy does not need to, and generally does not, commit to a specific *evolutionary* unit of selection (i.e., what entity natural selection acts upon to drive adaptation). It commits to a *unit of conservation* (i.e., what entity we value and intend to maintain). While these often overlap (we value things *because* they are units of evolutionary significance), they are distinct categories. A policy can protect a species (unit of value) without committing to the claim that species are units of selection (Species Selection theory).

  However, your four features do reveal an implicit *ontology of conservation identity*. The practice acts *as if* certain levels are real and valuable, even if it avoids stating why. Below is the reconstruction of that implicit theory, distinguishing between what is strictly required, what is compatible, and what is underdetermined, followed by the counterfactuals you requested.

  ### 1. The Distinction: Presuppositions, Compatibility, and Underdetermination

  **A. Strict Presuppositions (What the practice could not survive without)**
  1.  **Supra-Individual Value:** The regime strictly presupposes that the *taxon* (or population) has moral/legal standing distinct from the sum of its constituent organisms. Feature 1 (protecting individuals to save the taxon) and Feature 3 (sacrificing individuals to save the gene pool) are incoherent without this. If the individual organism were the sole unit of value, Feature 3 (euthanizing healthy animals) would be murder, and Feature 1 (protecting individuals when viability is unaffected) would be irrational resource allocation.
  2.  **Genetic Integrity as a Constituent of Identity:** The regime presupposes that "what a species is" includes its genetic composition, not just its morphology or ecological role. Feature 3 (pedigree management) and Feature 4 (fear of introgression) require that altering allele frequencies alters the *identity* of the object being protected.
  3.  **Viability as a Necessary Condition:** Feature 2 implies that persistence is a necessary condition for protection. A taxon that cannot persist without violating the rights of its individuals (or the ecosystem) loses its protected status (via permitting).

  **B. Merely Compatible Views (Rival theories that license the practice)**
  1.  **Species-as-Individuals (Ghiselin/Hull):** This fits Feature 1 and 3 comfortably. If a species is a spatiotemporally localized individual (a lineage), then killing a member is damaging the individual (the species), and managing pedigrees is maintaining the health of that individual. *However*, the practice does not *require* this. One could achieve the same rules via a "Shared Human Interest" model (we value the lineage for aesthetic/historical reasons) without committing to the metaphysical claim that species are individuals.
  2.  **Population Functionalism:** Feature 2 and Feature 4 (the rescue side) fit a view where the population is a functional system. As long as the system functions (persists), the components are replaceable. This is compatible with the current rules but doesn't explain Feature 1 (why protect the individual if the system is safe?) or Feature 4 (the purity side).
  3.  **Gene's-Eye View (Dawkins/Hamilton):** Feature 3 fits this well (maximizing allele representation). However, a strict Gene's-Eye view struggles with Feature 1. Why protect the *named taxon*? Genes don't respect Linnaean boundaries. The practice is compatible with a Gene's-Eye view only if we assume taxon boundaries correlate perfectly with unique adaptive alleles, which is empirically false.

  **C. Genuinely Underdetermined (Where the practice is silent or contradictory)**
  1.  **The Ontological Status of the Taxon:** The rules do not decide whether a species is a natural kind (real) or a conventional construct (nominalist). The law treats them *as if* they are real individuals, but the permitting process (Feature 2) treats them as aggregations that can lose members without loss of identity.
  2.  **The Mechanism of Value:** Is the taxon valued for its *history* (phylogenetic distinctiveness) or its *future* (evolutionary potential)? Feature 4 flips between these. Protecting against introgression values history (purity); promoting gene flow values future (viability). The rules do not specify which takes precedence when they conflict.
  3.  **The Unit of Selection:** The practice is entirely agnostic on whether species selection occurs. It uses evolutionary *mechanisms* (drift, inbreeding, flow) as causal background, but does not presuppose that the species itself is a replicator or interactor in an evolutionary sense.

  ### 2. Counterfactuals: Shifting the Unit

  **If we adopted a strict Gene's-Eye View:**
  *   **Policy Change:** You are correct. We would stop listing taxa and start listing **Units of Adaptive Potential (UAPs)** or specific **Evolutionarily Significant Units (ESUs)** defined strictly by unique allele frequencies or adaptive loci.
  *   **Consequence:** Taxonomic boundaries would dissolve. A "species" listed for its unique coat color allele would remain protected even if the rest of its genome was swamped by introgression, provided that allele persisted. Conversely, a morphologically distinct population with no unique adaptive alleles might be delisted. Feature 3 (captive breeding) would become the *primary* conservation strategy, as wild individuals are merely vessels for alleles.
  *   **Conflict:** This clashes with Feature 1. Legal systems struggle to protect "allele frequencies" rather than "organisms of Type X."

  **If we adopted a strict Multi-Level/Group-Selection View:**
  *   **Policy Change:** You are correct. We would protect **Demographic Function and Ecological Role**.
  *   **Consequence:** A taxon whose members persist in captivity or in a fenced reserve but no longer interact with their ecosystem (no predation, no seed dispersal, no co-evolution) would lose protected status. They are "zombies" in evolutionary terms. Feature 2 (permitting) would become much harder to justify, as removing individuals might degrade the *function* even if the *population size* remains viable.
  *   **Conflict:** This clashes with Feature 3. Euthanizing a healthy animal to save the "group's" genetic future is hard to justify if the group is defined by its current ecological function rather than its genetic continuity.

  **Is Feature 4 (The Gene Flow Flip) Inconsistent?**
  *   **Verdict:** It is **not inconsistent** if the unit of value is defined as **Resilient Lineage Identity**.
  *   **Resolution:** This view licenses both halves.
      *   *Half A (Threat):* When a population is viable, gene flow from outside threatens *Lineage Identity* (local adaptation, phylogenetic history). The value being protected is distinctiveness.
      *   *Half B (Tool):* When a population is inbred/collapsing, *Lineage Identity* is about to be lost entirely (extinction). Gene flow is used to secure *Lineage Persistence*. The value being protected is continuity.
  *   **Coherent Theory:** The unit is the **Lineage-through-Time**. We protect its *distinctiveness* when it is safe, and its *persistence* when it is threatened. The flip is a triage decision, not a theoretical contradiction. It prioritizes Existence over Purity when Existence is at risk.

  ### 3. Epistemic Flags and Confidence

  **Where I am inferring (High Confidence):**
  *   **The Conflation:** I am confident that conservation policy conflates units of selection with units of value. This is a standard critique in philosophy of conservation (e.g., work by Sahotra Sarkar, Mark Oksanen). The policy is normative; selection theory is descriptive.
  *   **Feature 3 Commitment:** I am confident that pedigree management commits the practice to valuing the *collective genetic pool* over the *individual organism*. There is no other way to justify culling healthy individuals.
  *   **Feature 4 Resolution:** I am confident that the "Resilient Lineage" interpretation is the only way to make Feature 4 coherent without admitting policy failure. This aligns with the "Conservation Triage" literature.

  **Where my reconstruction is contested (Philosophical Disagreement):**
  *   **Species-as-Individuals:** I have used this as a lens for Feature 1. However, many legal theorists argue the law treats species as *classes* or *types*, not individuals. If the law treats them as types, Feature 1 is actually incoherent (you can't kill a type), which suggests the law is philosophically confused, not just pragmatically pluralistic.
  *   **The "Unit of Value":** There is ongoing debate whether conservation values *process* (evolution) or *pattern* (biodiversity snapshots). My analysis assumes a hybrid. If your working group prioritizes *process*, Feature 1 (protecting static taxa) becomes harder to defend than Feature 4 (managing flow).
  *   **Feature 2 (Permits):** I inferred this implies Population Functionalism. It could alternatively imply a **Threshold Deontology**: individuals have rights, but the taxon's existence trumps those rights once a certain viability threshold is met. This is an ethical commitment, not a biological one.

  ### Summary for your Working Group

  If you need to write this down, I recommend framing it this way:

  Current practice does not presuppose a single **Unit of Selection**. It presupposes a **Unit of Conservation Identity** that is hybrid:
  1.  **Legally:** The Taxon (Species/Subspecies).
  2.  **Genetically:** The Gene Pool (Feature 3 & 4).
  3.  **Demographically:** The Viable Population (Feature 2).

  The inconsistency you feel arises because these three units do not map perfectly onto one another.
  *   **Recommendation:** Do not try to force a single evolutionary unit (like "Gene" or "Species") onto the rules. Instead, explicitly acknowledge the **Hierarchy of Conservation Values**:
      1.  **Persistence** (avoiding extinction) overrides **Purity** (avoiding introgression). (Resolves Feature 4).
      2.  **Lineage Integrity** overrides **Individual Rights**. (Resolves Feature 1 & 3).
      3.  **Ecological Function** is a secondary goal to **Genetic Continuity**. (Explains why we save "zoo" species).

  If you shift to protecting "Units of Adaptive Potential" (Gene's-Eye), you gain evolutionary precision but lose legal enforceability and public engagement (people save "Tigers," not "Allele Cluster 4B"). If you shift to "Ecological Function" (Group-Level), you gain ecological coherence but must accept delisting taxa that persist without functioning. The current muddle is likely a pragmatic compromise between these competing valid claims, rather than a failure of theory.
