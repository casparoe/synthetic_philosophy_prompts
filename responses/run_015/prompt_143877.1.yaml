  *   **Least Confident Term:** Ex-Ante Welfare Metric (philosophical disagreement exists on whether ex-ante rationality *should* normatively bind her).

  **The Friends:**
  Friend A (the PhD) is most likely wrong about what they're disagreeing over; they are treating a normative mathematical model as a descriptive psychological law. I would be moved by longitudinal empirical data showing that individuals who uncover traumatic family truths report higher net well-being than those who remain ignorant.

