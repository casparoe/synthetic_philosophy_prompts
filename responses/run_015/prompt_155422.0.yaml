  4.  **Refining the Technical/Philosophical Balance:**

      *   *ML Side:* Needs to acknowledge that reward is only identified up to potential-based shaping and scaling. Needs to acknowledge that $\tau$ is usually global or per-agent but not *state-dependent* in standard models.
      *   *Philosophy Side:* Needs to connect to "adaptive preferences" but distinguish this case (it's not that the preference changed, it's that the signal is corrupted by cost).
      *   *The "Normative Work":* The key insight is that setting $\tau$ isn't just tuning; it's deciding how much to penalize struggle.

  5.  **Addressing the "Epistemic Bookkeeping" Requirement:**

      *   I need to make sure I don't hide contested claims.
