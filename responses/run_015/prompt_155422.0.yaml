answer: |-
  **Project Title:** The Agency-Cost Confound: Disentangling Preference from Friction in Behavioral Inference

  **1. Technical Setup and Problem Statement**

  Contemporary preference inference systems, including Inverse Reinforcement Learning (IRL) and alignment via human feedback, operate on a standard generative model of behavior. **[BOOKKEEPING (a): Settled Background]** We observe an agent acting over time in an environment; we assume the agent is approximately optimal with respect to some reward function, with departures from optimality treated as noise governed by a single 'temperature' or rationality parameter ($\tau$); and we infer the reward function that best rationalizes the observed behavior under that assumption. It is established that without an assumption about rationality, observed behavior constrains the reward function hardly at all. It is further established that even with a fixed rationality model, the recovered reward is identified only up to positive rescaling and potential-based shaping transformations.

  **[BOOKKEEPING (c): Conjecture]** We propose that the rationality parameter $\tau$ is currently performing normative work that the technical literature treats as merely technical. In standard models, $\tau$ is a nuisance parameter representing computational error or randomness. We argue that departures from optimality are not all noise about *what* the agent wants; some are the measurable trace of what it *costs* that agent to convert desire into action. Two agents with identical intrinsic preferences but different costs of acting—one managing depression, one navigating an inaccessible interface, one experiencing time poverty—will produce different behavior. The standard model assigns a lower inferred reward to the outcomes the high-friction agent fails to pursue. We call this the **Agency-Cost Confound**.

  **2. The Research Question**

  The existence of the confound is qualitative; the research question is quantitative and normative.
  1.  **Identifiability:** In principle, and with what additional observations (e.g., response times, physiological markers, counterfactual queries), can a system distinguish an agent who cares less about an outcome from an agent who pays more to act on it?
  2.  **Normative Defaults:** When the available data cannot separate the two, what should a system assume? Does the right default depend on whether the inference is being used to assist a particular person (where we might privilege intrinsic desire) or to aggregate many people's inferred preferences into a social choice (where we might privilege revealed willingness to pay)?

  **3. Why Existing Approaches Leave This Open**

  **[BOOKKEEPING (b): Contested/Gap]** The machine learning literature typically treats misspecification of the rationality model as estimation error to be averaged away. Routine practices, such as fitting a per-agent temperature parameter, are often assumed to absorb individual differences in rationality. **[BOOKKEEPING (b): Contested]** However, it is contested whether a scalar $\tau$ can distinguish between *indifference* (low reward) and *incapacity* (high friction), as both flatten the choice probability distribution in mathematically similar ways.

  Conversely, philosophical work on adaptive preferences and informed desire generally assumes the agent can be consulted to correct for distorted behavior. **[BOOKKEEPING (b): Contested]** This assumption fails in the contexts this grant targets: passive inference systems, large-scale aggregation, or contexts where consultation itself imposes an agency cost. The gap is a framework for inference when consultation is unavailable and the behavioral signal is corrupted by heterogeneous friction.

  **4. Proposed Approach (12 Months)**

  We propose a three-phase approach focusing on formal identifiability and normative guidelines, rather than immediate large-scale deployment.

  *   **Phase 1 (Months 1-4): Formal Identifiability Analysis.** We will model "friction" not as reward cost, but as a modification to the policy mapping (a state-dependent $\tau(s)$). We will derive conditions under which intrinsic reward $R$ is identifiable from behavior $P(a|s)$ given observations of friction proxies (e.g., latency, error rates).
      *   *Why this approach?* Alternatives like abandoning reward inference for partial orders over trajectories lose the decision-theoretic power required for system optimization. Fitting a per-agent noise parameter is the current baseline; we aim to show why it is insufficient for equity-sensitive applications.
  *   **Phase 2 (Months 5-8): Simulation and Sensitivity.** We will construct synthetic environments where ground-truth preferences and friction costs are known. We will test standard IRL against our friction-aware model to quantify the "penalty" assigned to high-friction agents under current standards.
      *   *Why not self-report?* Adding self-report as another noisy channel is a valid alternative, but it violates the privacy and passivity constraints of many deployed systems. We treat self-report as a "gold standard" for validation in simulation, not as a required input for the final model.
  *   **Phase 3 (Months 9-12): Normative Framework for Under-Identification.** If Phase 1 shows that $R$ and friction are not fully separable from behavior alone, we will draft decision guidelines for system designers. We will analyze how the choice of prior (assuming high friction vs. low preference) impacts welfare in assistance vs. aggregation contexts.

  **5. Deliverables**

  A positive result will not necessarily be a new algorithm ready for deployment.
  1.  **Technical Report:** A proof characterizing the identifiability of preferences under heterogeneous agency costs. This will specify exactly what additional data (e.g., "we need response times") is *necessary* to solve the confound.
  2.  **Design Guideline:** A policy document for AI practitioners. If the confound is unresolvable with passive data, this document will recommend specific default assumptions (e.g., "In accessibility contexts, assume high friction rather than low preference") to prevent systematic undervaluation of marginalized users.

  **6. Failure Conditions and Risks**

  We commit to the following honest assessment of failure modes:
  1.  **Redescription Risk:** **[BOOKKEEPING (c): Conjecture]** It is possible that the "Agency-Cost Confound" is simply the problem of partial observability (POMDPs) or reward unidentifiability restated in new vocabulary. If our formal analysis shows no distinction between our friction model and standard unidentifiability results, we will report this negative result. It would imply the philosophical novelty does not map to a technical distinction.
  2.  **Normative Irrelevance:** It is possible that even if we can distinguish friction from preference, the normative half never becomes decision-relevant. If system designers are constrained to optimize for revealed behavior regardless of friction (e.g., in market-based aggregation), our normative guidelines may be theoretically sound but practically inert.
  3.  **Practitioner Rejection:** **[BOOKKEEPING (b): Contested]** ML practitioners may reject the premise that $\tau$ should be disentangled from $R$, arguing that "revealed preference" *is* the combination of desire and cost. Our success depends on demonstrating that for *assistive* AI, this definition leads to harmful feedback loops (e.g., an assistant stopping suggestions because the user historically rejected them due to depression).

  ***

  **EPISTEMIC BOOKKEEPING SUMMARY**

  *   **(a) Settled Background:** The definition of the standard IRL generative model (Boltzmann rationality); the fact that reward is unidentified without rationality assumptions; the fact that reward is identified only up to scaling/shaping even with those assumptions.
  *   **(b) Genuinely Contested:** Whether fitting a per-agent temperature parameter dissolves the problem (ML consensus leans toward "yes, it's sufficient," we argue "no"); whether "cost of agency" is distinct from capability constraints in POMDPs; whether revealed preference should include execution costs or only intrinsic valuation.
  *   **(c) Author's Conjecture:** That the rationality parameter is doing normative work currently unrecognized; that the confound is not merely a restatement of partial observability; that the appropriate default assumption depends on the context of use (assistance vs. aggregation).
