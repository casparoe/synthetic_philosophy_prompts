      *   *Failure:* If it turns out to be mathematically impossible without external data, that's a result. If the normative distinction doesn't change system design, that's also a result.

  7.  **Final Review against Constraints:**

      *   No citations? Check.
      *   Two-page core length? (I will aim for ~1000-1200 words of substantive text, excluding bookkeeping).
      *   Mixed audience? (Define terms, avoid jargon where possible, explain the stakes).
