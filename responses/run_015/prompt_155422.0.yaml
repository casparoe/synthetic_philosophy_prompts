      *   *Standard IRL:* Observe behavior $\to$ Assume Boltzmann rationality (prob of action $\propto \exp(Q(s,a)/\tau)$) $\to$ Infer Reward $R$.
      *   *The Problem:* $\tau$ (temperature) captures "noise." But "noise" isn't just random error. It's often systematic friction (cost of action).
      *   *The Confound:* Low action frequency could mean Low Reward ($R$) OR High Cost/High $\tau$.
      *   *The Question:* Can we distinguish $R$ (want) from $C$ (cost/friction) using behavioral data alone? If not, what are the normative defaults?
