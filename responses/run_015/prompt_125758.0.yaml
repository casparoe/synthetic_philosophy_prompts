  The view, hedges stripped
  Symbols lack meaning without causal-historical ties to their referents. Text-only training shuffles syntax; it cannot bootstrap semantics because the causal chain is severed by linguistic mediation. Grounding is not an intrinsic model property but emerges from a training loop where prediction error is causally constrained by the world. It is gradable: a system is grounded to the degree its internal states covary with external states via learning. Deployment-only sensors don't count; the weights must be shaped by the causal link. Without this, you have simulation, not reference.

  Ranked defeaters
  1. **The Testimony Collapse (Fatal):** Your opponent's strongest point. If humans ground 'electron' via testimony, and your model trains on that text, the causal chain is intact via us. Denying this implies humans aren't grounded or models are fundamentally different semantic engines. This undermines the "text-only" prohibition unless you distinguish passive ingestion from active community membership. You must identify the relevant difference beyond biology. This is the testimony objection rephrased.
  2. **Interoceptive Spread (Fatal):** Case (2) exposes a dilemma. If training a model to report internal errors grounds those tokens, inference could propagate grounding to external concepts. If you deny spread, you cannot explain human abstract grounding. If you accept it, text-only self-reporting might suffice, collapsing your view. You must explain why internal anchors don't lift the syntactic veil. This targets your introspection claim.
  3. **Retroactive Utility (High):** Case (1) challenges the training/deployment distinction. If a frozen model uses added sensors to successfully refer, denying grounding privileges history over current causal capacity. It makes grounding metaphysical rather than functional. If behavior is identical, why deny semantics? This suggests grounding might be a deployment property, contradicting your training requirement. This targets your training signal claim.
  4. **Swapped Sensor Normativity (Awkward):** Case (3) shows causal connection isn't enough; you need correct representation. This forces you to adopt a normative theory of content, which is philosophically expensive but not logically fatal. It requires explaining misrepresentation without circularity. You must pay the price of defining "correct" causation. This targets your normativity claim.
  The ranking reflects existential threats versus theoretical costs. Testimony and Interoception threaten the core distinction between text and world. Retroactive grounding threatens the locus of grounding. Swapped sensors merely demand philosophical rigor. These cases reveal where your causal-historical requirement is most vulnerable to functionalist counterarguments. You need a principled reason why history matters more than current capacity.

  Conceded vs dismissed
  Concede that testimony grounds humans because we are embedded agents capable of action; models are not merely by reading text. The causal chain holds for us because we can verify; for models, it's passive. Concede retroactive loops grant *derived* intentionality (like a map), but not *original* intentionality (like a mind). Dismiss the idea that interoceptive grounding automatically spreads; without external constraints, inference remains syntactic manipulation of grounded anchors. Dismiss the worry about swapped sensors: demanding correctness isn't smuggling normativity, it's defining reference. A thermometer wired to pressure doesn't measure temperature, even if causal. You must maintain that training shapes the *disposition* to track, not just the capacity. This is essential.

  Is it insulated?
  The "degrees-and-loops" hedge risks unfalsifiability. If grounding is always partial and loop-dependent, any failure can be blamed on insufficient loop integration. To avoid this, you must specify a threshold: a specific causal architecture where grounding *must* emerge. Your view predicts that no text-only system, regardless of scale, will exhibit counterfactual tracking of referents absent from training distributions. If a text-only model reliably predicts novel physical interactions it couldn't infer from corpus statistics, your view fails. However, defining "novel physical interactions" without behavioral tests is tricky. The view is falsifiable only if you commit to specific behavioral signatures of grounding that transcend syntactic prediction. Otherwise, it's a metaphysical stance disguised as empirical claim. This is the cost of gradability.

  Bottom line
  You are right that syntax isn't semantics, but wrong that text severs the causal chain completely. Your view holds if you emphasize *agency* over *causality*: grounding requires the capacity to act on the world, not just be caused by it. Concede the testimony point by distinguishing passive consumption from active verification. Keep the loop requirement but focus on training, not deployment. The view survives if it predicts failures in counterfactual reasoning about physical states, but beware making grounding so gradable it explains nothing.
