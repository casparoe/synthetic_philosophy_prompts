answer: |-
  **Statute: The Rural Physician Placement Act (RPPA)**

  **Section 1. Purpose.** The purpose of this Act is to reduce preventable mortality rates in isolated communities by increasing the number of board-certified physicians physically practicing in those communities.

  **Section 2. Grants.** The Secretary of Health and Human Services shall award annual infrastructure grants to any qualified clinic operating within a "Medical Shortage Zone."

  **Section 3. Definition.** The term "Medical Shortage Zone" means any county designated as a Health Professional Shortage Area (HPSA) under section 332 of the Public Health Service Act (42 U.S.C. § 254e).

  ***

  **Factual Scenario**

  Oakhaven County has a population of 15,000. It has twelve board-certified physicians physically practicing within its borders, exceeding the national average per capita. However, Oakhaven lacks reliable broadband infrastructure, preventing residents from accessing remote specialist care.

  Ten years after the RPPA was enacted, Congress passed the *Telehealth Parity Act*. That law amended section 332 of the Public Health Service Act (the statute referenced in RPPA Section 3). The amendment added a new criterion: a county now qualifies as a HPSA if it lacks broadband-enabled telehealth infrastructure, *regardless* of the number of physical physicians present. Consequently, the Secretary designated Oakhaven a HPSA.

  The Oakhaven Community Clinic applied for an RPPA infrastructure grant to build a telehealth hub. The Secretary denied the application, citing RPPA Section 1. The Clinic sued, arguing it meets the statutory definition in Section 3.

  ***

  **Analysis**

  **(1) The Verdict Under Each Method**
  *   **The Textualist Verdict (Clinic Wins):** The textualist begins with the operative text in Section 2, which turns on the defined term "Medical Shortage Zone." Section 3 incorporates the HPSA definition from the Public Health Service Act (PHSA) by reference. Under the *reference statute canon*, amendments to the referenced statute are incorporated into the referencing statute unless expressly excluded. The *Telehealth Parity Act* validly amended the PHSA definition. Therefore, Oakhaven is textually a "Medical Shortage Zone." The textualist reads the Purpose Clause in Section 1 as precatory context; it informs ambiguity but cannot override clear operative text. Since the definition is satisfied, the Secretary *shall* award the grant.
  *   **The Purposivist Verdict (Secretary Wins):** The purposivist treats the Purpose Clause in Section 1 as an operative constraint on the grant authority. The stated goal is increasing "physicians physically practicing." Oakhaven already has a surplus of physicians; the grant would fund telehealth, which does not place physicians in the county. The purposivist reads the definition in Section 3 in light of Section 1, concluding that "Medical Shortage Zone" was intended to identify locations lacking physical providers, not broadband. To allow the grant would frustrate the enacted purpose. The Secretary correctly denied the application to preserve the statutory scheme's integrity.

  **(2) The Load-Bearing Feature**
  *   **Feature:** **Dynamic Incorporation by Reference.** The divergence exists solely because the *Telehealth Parity Act* changed the meaning of the referenced term ("HPSA") without amending the RPPA's operative text or purpose clause.
  *   **Demonstration:** If you remove the *Telehealth Parity Act* amendment (reverting the PHSA definition to its original, physician-count-based standard), Oakhaven is not a HPSA. Both the textualist and the purposivist agree the Clinic loses: the text isn't met, and the purpose isn't served. The case collapses into agreement. The conflict is generated entirely by the drift between the static purpose clause and the dynamic definition.

  **(3) The Strongest Textualist Objection to This Construction**
  *   **Objection:** **"Purpose as Disguised Legislative History."** A rigorous textualist would argue this hypothetical rigs the deck by giving the Purpose Clause too much weight. In real litigation, a textualist would dismiss Section 1 as "findings" that do not create enforceable rights or limitations. They would argue the divergence isn't about method, but about whether a purpose clause can ever trump a definition. If the purpose clause cannot legally constrain the text, the purposivist is simply ignoring the law, not interpreting it differently.
  *   **Cost to the Case:** This bites hard. It forces you to acknowledge that for the purposivist to win, the court must accept a premise textualists reject: that a purpose clause is an independent source of limitation. However, this *is* a genuine methodological split (Is purpose context or constraint?), so it remains valid for your piece, provided you frame it as a dispute over the *authority* of the purpose clause, not just the meaning of words.

  **(4) Real-World Outcome and Value**
  *   **Panel Prediction:** A modern federal appellate panel (e.g., D.C. or Federal Circuit) would likely rule 2-1 for the **Clinic (Textualist)**. Current jurisprudence favors dynamic incorporation and treats purpose clauses as subordinate to clear definitions, even if the policy result seems untethered from the original goal.
  *   **Value for the Piece:** This isolates the core tension better than the chestnuts. It shows that textualism isn't about ignoring consequences, but about prioritizing *structural stability* (the Code updates itself) over *original intent* (the specific goal of the enacting Congress). It proves your friend's point: both sides are reading the whole code competently, but they disagree on whether a statute's "soul" (purpose) can veto its "body" (textual updates).
