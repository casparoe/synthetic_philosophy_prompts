answer: |-
  1. The scenario
  During evening handover, Nurse Elara, with a stigmatized working-class accent, informs Dr. Aris that Patient 4's pain levels have spiked despite medication. Elara knows this is true; she verified the charts and spoke directly to the patient. However, having been routinely interrupted or dismissed by senior staff in previous wards due to her accent, Elara has learned to speak tentatively, prefacing her report with "I might be wrong, but..." and avoiding eye contact. Dr. Aris, priding himself on objective assessment and having never met Elara before, notes her hesitation and lack of confidence. He assigns a low probability to her claim, deciding to wait for morning labs before acting. He believes he is weighting her testimony according to its presented certainty. He is unaware of her history, nor did he contribute to it. The patient suffers overnight. Elara knew the pain was real; Aris matched his credence to her hesitant delivery.

  2. Why the identity cue is doing the work
  If Elara spoke with a dominant-class accent, she would not have faced the upstream dismissal generating her hesitancy; she would present confidently, and Aris would accord full credibility. The deficit vanishes because the cue triggers the history producing hesitation. Alternative explanations fail. It is not inexperience: Elara is senior. It is not surprising content: pain spikes are routine. It is not time pressure: handover is structured. It is not unreliability: she verified charts. Low credibility links to identity via accent-induced hesitancy. Aris responds to the hesitancy, not the accent directly, but the hesitancy exists only because of the accent's social history. Thus, the identity cue is the operative cause.

  3. What the local-calibration reading says
  The local-calibration reading holds that credibility owed is determined by the evidence available in the immediate exchange. Elara's presentation included hedges, lowered voice, and avoided eye contact. These are rational indicators of uncertainty. Aris, aiming for accuracy, calibrated his belief to match these signals. He gave her exactly the credibility her performance warranted. On this view, testimonial injustice requires a mismatch between credibility given and credibility merited by the *actual* testimony delivered. Since Aris matched the two, he committed no wrong. The injustice lies entirely upstream, with the colleagues who originally dismissed Elara. Aris is merely responding to the epistemic features present before him. To demand more would be to ask him to ignore evidence of uncertainty, which would be epistemically irresponsible. Therefore, this specific interaction is clean; the harm is historical, not testimonial in this moment.

  4. What the history-adjusted reading says
  The history-adjusted reading argues that credibility owed is determined by the speaker's actual competence, absent the distorting effects of prior prejudice. Elara knows the pain is real; her hesitancy is a survival strategy, not an epistemic defect. Aris owes her the credibility she would have commanded had she not been socially conditioned to doubt herself. By accepting the hesitant presentation as neutral evidence, Aris treats the effects of injustice as natural features of the speaker. This perpetuates the wrong: the credibility deficit is maintained rather than corrected. Testimonial injustice is not merely a synchronic mismatch but a diachronic failure to recognize the speaker as a knower despite social distortion. Aris wrongs Elara because he fails to account for the systemic noise interfering with her transmission. He validates the upstream prejudice by treating its symptoms as justified reasons for doubt. The injustice occurs here because the hearer participates in sustaining the credibility deficit.

  5. Which feature of the case generates the split
  The divergence rides on the baseline for "credibility deserved." The local reading fixes the baseline at the actual communicative performance; the history-adjusted reading fixes it at the underlying epistemic competence. Any case where social prejudice alters the speaker's presentation style without altering their knowledge generates this split. Examples include a woman apologizing before speaking, a minority employee over-documenting claims, or a working-class witness using deferential language. In all such cases, the hearer sees uncertainty where there is none. The structural feature is the *distorted signal*: when the medium of testimony carries the scar of prior injustice, the two readings disagree on whether the hearer must look through the scar to see the knowledge. It is diachronic.

  6. The objection my friend would make
  My friend would argue that the history-adjusted baseline is epistemically inaccessible. Aris cannot know Elara's counterfactual confidence levels; he only has her actual behavior. Demanding he compensate for unknown historical distortions imposes a very impossible burden. If hearers must guess how confident a speaker *would* be absent prejudice, credibility assessments become arbitrary. Furthermore, the upstream wrongdoers have already exhausted the injustice; Aris cannot be liable for harms he did not cause. To claim he wrongs Elara is to conflate being merely a link in a causal chain with being a moral agent of injustice. In this specific case, the reply holds weight: Aris lacks specific knowledge of Elara's history. However, it fails if we assume professionals owe a duty to recognize systemic patterns. If hesitancy correlates strongly with identity in his field, ignoring that correlation is itself a form of negligence. The objection protects the hearer's ease but sacrifices the speaker's standing.

  7. What breaks if I alter it
  If Aris had caused the hesitancy himself earlier in the shift, the case collapses into a standard single-wrongdoer scenario. Both readings would agree injustice occurred, as the hearer created the deficit they then exploited. Conversely, if Elara's hesitancy stemmed from a stammer or lack of sleep, the identity cue is removed. Neither reading finds testimonial injustice, as the deficit lacks prejudice. The split specifically requires the hesitancy to be socially produced but historically separated from the current hearer. This ensures the disagreement is about the *nature* of the hearer's duty regarding systemic harm, not about individual malice or non-social noise.
