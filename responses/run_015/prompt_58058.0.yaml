answer: |-
  1. In *Flattening*, you infer numerical distinctness from the fact that the lump survives the rolling while the statue does not; but if Leibniz's Law requires distinctness only when objects differ in properties, why shouldn't we treat 'surviving flattening' as a temporary property loss of a single object rather than evidence of two entities? (You will likely appeal to sortal-relative persistence conditions; but if sortals dictate existence conditions, does this not render ontology dependent on conceptual schemes rather than mind-independent reality?)

  2. Given that the statue and lump share all categorical properties and microphysical parts at the moment of coincidence, what non-modal fact grounds their differing modal profiles, or must we accept brute modal facts that supervene on nothing? (You may posit primitive modal essences; but if these essences do not supervene on the intrinsic physical base, does this not violate the supervenience of the modal on the categorical?)

  3. When the warrior is displayed on Monday, how many material objects occupy the pedestal, and if I insure the 'statue' against damage, does the policy automatically cover the 'lump' or must I purchase two policies for the same matter? (You will suggest counting is sortal-relative; but if insurance covers physical damage to the matter, does the insurer owe double indemnity for a single breakage, implying either economic absurdity or that only one object truly exists?)

  4. In *Conservation*, assuming the bust survives the replacement of half its clay, does the coinciding lump of clay also survive, and if they both survive, do they remain distinct objects throughout the process or merge into one? (You will argue for no sharp cutoff via vague identity; but if identity is an absolute relation, how can it be indeterminate without violating the law of excluded middle?)

  5. If the statue and lump are numerically distinct material objects, does the pedestal support five kilograms or ten kilograms of object-mass, and if the former, how do you explain the non-additivity of mass for distinct coincidents? (You will argue mass is not additive for coincidents; but if both are distinct material objects with mass, why does the gravitational force not sum across entities occupying the same region?)

  6. When the sculptor rolls the clay flat in *Flattening*, does this action destroy one object or two, and if the physical force applies only to the matter, how does it selectively target the statue's existence conditions? (You will claim causal powers are sortal-specific; but if physical force acts on the atoms, isn't the 'destruction of the statue' merely a redescription of the 'rearrangement of the lump', rendering the second event causally inert?)

  7. Given the metaphysical costs of coincident objects, why prefer this view over temporal parts or eliminativism, specifically regarding the explanatory power gained by positing two entities where one seems sufficient? (You will cite preservation of artifact intuition; but if saving this intuition requires accepting ubiquitous coincidence, does the theoretical cost of multiplying entities outweigh the benefit?)
