answer: |-
  Dear friend,

  I have been thinking about our argument regarding the statue and the clay, and I agree that we need to move past simply restating the puzzle to identifying what a successful solution actually requires. If a theory of material constitution is going to do more than just rename the problem, it must satisfy a specific set of desiderata that capture the intuitive data without collapsing into contradiction. The first and perhaps most immediate criterion is the ability to explain spatial coincidence without total identity. The motivating case here is simply the moment of creation where the lump of clay and the statue occupy the exact same region of space at the same time. If the theory claims they are identical, it must explain away the intuition that they are distinct kinds of things, but if it claims they are distinct, it must explain how two material objects can be in the same place at once without violating physical exclusion principles. This is generally treated as a hard constraint because denying spatial coincidence forces us to deny either the existence of the statue or the clay during the overlap period, which contradicts ordinary observation. However, some theories treat the denial of coincidence as a necessary bullet to bite to preserve a simpler ontology, so while it feels like a hard constraint on our common sense, it is sometimes sacrificed for theoretical parsimony.

  The second criterion is that the theory must get the destruction asymmetries right, specifically regarding modal profiles and persistence conditions. The motivating case here is twofold. First, if you squash the object, the statue is destroyed while the clay survives, suggesting they have different survival conditions. Second, if you gradually replace every particle of clay with a synthetic polymer that behaves identically, the clay arguably ceases to exist while the statue persists, suggesting the statue is defined by form or continuity rather than specific matter. This is a hard constraint because these asymmetries are the primary evidence that the statue and clay are not identical. If a theory cannot account for why one survives a change that destroys the other, it fails to capture the distinct nature of artifacts versus their constituents. The constitution view handles this well by positing distinct objects with different modal properties, but it does so at the cost of ontological bloating. Mereological essentialism struggles here because it tends to deny that the statue survives any change of parts, which clashes with our intuition that the statue persists through the polymer replacement.

  The third criterion is the account of negative parts, such as drilled holes that belong to the statue's form but not to the substrate. The motivating case is a statue defined by its voids, like a sculpture with a tunnel through it. The hole is constitutive of the statue's identity because filling it in changes the statue, yet the hole is not made of clay and does not exist as a positive part of the material substrate. This criterion is somewhat more contested and might be considered a prejudice of form-heavy theories rather than a universal hard constraint, but it is crucial for any theory that wants to take artistic form seriously. Hylomorphism attempts to handle this by treating the form as a principle that organizes the matter, including the absences, but it often struggles to explain how an absence can be a real constituent without reifying nothingness. If a theory treats objects as mere sums of their material parts, it cannot easily account for holes as parts, so meeting this desideratum requires a mereology that allows for negative existence or a robust notion of form that transcends mere material aggregation.

  Now we must address the critical cluster of commitments that you asked about, specifically whether temporary coincidence, essential form, and no ontological overpopulation can all hold together. The short answer is that this trio is jointly unsatisfiable within classical logic and standard mereology. If you accept temporary coincidence, you are saying the statue and clay are distinct entities that overlap for a time. If you also accept essential form, you are saying the statue has its shape essentially while the clay does not, which reinforces their distinctness via Leibniz Law. However, if you have two distinct entities occupying the same space at the same time, you violate the constraint of no ontological overpopulation, which demands that we not multiply entities beyond necessity. You can hold any two of these, but not all three. If you keep essential form and no overpopulation, you must deny temporary coincidence and claim identity, but then you cannot explain the destruction asymmetries. If you keep temporary coincidence and no overpopulation, you must deny essential form or adopt relative identity, which complicates the logic significantly. If you keep temporary coincidence and essential form, you must accept overpopulation, which is the route taken by the constitution view but which many find metaphysically extravagant.

  This incompatibility is where the named theories you mentioned tend to fall short. The constitution view accepts temporary coincidence and essential form but sacrifices no ontological overpopulation, leading to the charge that it populates the world with too many coincident objects. Mereological essentialism preserves no overpopulation and essential form but denies temporary coincidence by arguing the statue is just the clay arranged statuely, which fails to account for the destruction asymmetries where the statue dies and the clay lives. Hylomorphism tries to navigate this by distinguishing matter and form as co-principles rather than distinct objects, but it often struggles to clarify whether the composite is a third entity, risking overpopulation anyway, or whether it can truly account for the negative parts without mystification. Ultimately, a viable theory must explicitly state which of these three commitments it is willing to relax, because pretending to satisfy all of them is what turns the solution into a mere renaming of the problem. I hope this breakdown helps clarify where the real philosophical weight lies so you can settle the argument with a clearer view of what is actually at stake.

  Best regards
