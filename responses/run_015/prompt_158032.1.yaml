prompt: |-
  I'm a PhD student in political theory (mostly republican liberty stuff, but got pulled into a practicum with a state oversight board) and I need a reusable tool, not an essay. Our board reviews draft regulations—zoning changes, welfare tech rollouts, policing ordinances—before they go live, and we have to flag freedom issues in about 30 minutes per proposal. Staff signing off aren't philosophers; they dont read Pettit. So I want a decision procedure, like a flowchart in words, that turns the positive/negative/republican liberty distinction into something they can actually run.

  Here's the niche twist I want baked in: dont just ask "is there interference?" The procedure should target what I'm calling "latent domination structures"—cases where people are subject to an agent's arbitrary will even if that will is never actually exercised, specifically when there are no reachable contestation paths (not just technically available ones, but ones people can use without ruinous cost). So the steps should go: (1) option-restriction check (negative liberty), (2) seperate capacity-expansion check (positive liberty), (3) domination check filtered for reachability of contestation.

  The hard cases it must handle: an AI welfare system that assigns benefits via opaque weights with no practical appeal mechanism; a zoning ordinance that allows appeals but sets the fee at 40% of median local income; and a temporary public-health movement restriction enacted democratically with sunset clauses and judicial review.

  Deliverable: the ordered questions, the stop points vs judgment-call flags, then work through all three cases. Include one—probably the democratic health mandate—where the procedure comes back "this creates domination" even though common sense and democratic legitimacy say it's fine; don't hide that result. Mark exactly where the procedure collapses into values rather than analysis, and say outright what it can't settle.

  Also, if I'm conflating republican liberty with something it doesn't cover, or if "arbitrary" just can't be operationalized through "reachability" without smuggling in politics, call that out plainly—don't politely hand me a broken checklist. Flag every simplifying choice you're making, and at the end tell me whether this is defensible or if I'm just dressing politics up as philosophy. I want pushback if the premise is confused.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** PhD student in political theory (republican liberty focus) working with a state oversight board.
      *   **Task:** Create a reusable decision procedure (tool/flowchart in words) for staff to flag freedom issues in draft regulations within ~30 minutes.
      *   **Audience:** Non-philosopher staff (don't cite Pettit directly, keep it operational).
      *   **Core Concept:** Republican Liberty (non-domination), specifically focusing on *latent domination structures* (arbitrary will + lack of reachable contestation).
      *   **Structure:** Three specific steps: (1) Option-restriction (Negative), (2) Capacity-expansion (Positive), (3) Domination (Republican/Contestation Reachability).
      *   **Hard Cases to Test:**
          1.  AI Welfare System (opaque, no practical appeal).
          2.  Zoning Ordinance (appeals exist but fee is 40% of median income).
          3.  Public Health Movement Restriction (democratic, sunset, judicial review).
      *   **Specific Constraint:** Do *not* hide the result if the procedure flags the democratic health mandate as domination, even if common sense says it's fine.
      *   **Critical Requirement:** Identify where the procedure collapses into values/politics, flag simplifying choices, and provide pushback on whether this is defensible or just "politics dressed as philosophy."
      *   **Tone:** Professional, rigorous, critical, no fluff.

  2.  **Deconstruct the Theoretical Framework:**
      *   *Negative Liberty:* Interference with options. (Berlin).
      *   *Positive Liberty:* Capacity to act/self-mastery. (Berlin/Taylor).
      *   *Republican Liberty:* Non-domination. Status of not being subject to arbitrary power. (Pettit/Skinner).
      *   *The Twist:* Focus on *reachable contestation*. It's not enough that an appeal exists *de jure*; it must be accessible *de facto* without ruinous cost.
      *   *The Tension:* Republicanism usually claims to align with democracy. If a democratic process enacts a law, is it arbitrary? Pettit says no, *if* the democratic process is properly contestatory. But the prompt asks to flag a democratic health mandate as potential domination if contestation isn't reachable *in practice* during the emergency. This is a crucial stress test.

  3.  **Drafting the Decision Procedure (The Tool):**
      *   Need to make it linear and binary where possible, but acknowledge judgment calls.
      *   *Step 1 (Negative):* Does this reduce the menu of choices?
      *   *Step 2 (Positive):* Does this enable action that was previously impossible due to lack of resources/capacity? (Note: Usually regulations restrict, but welfare/tech expands).
      *   *Step 3 (Republican):* The core. Is there power exercised? Is it arbitrary? Is contestation reachable?
      *   *Definition of "Reachable":* Cost (financial, temporal, social) vs. Stake.

  4.  **Testing the Hard Cases:**
      *   *AI Welfare:* Restricts/Enables? Enables (money), but conditional. Domination? Yes. Opaque weights = arbitrary. No appeal = no contestation.
      *   *Zoning:* Restricts (building). Domination? Yes. Appeal exists but cost (40% income) makes it unreachable. Arbitrary power remains.
      *   *Health Mandate:* Restricts (movement). Democratic/Sunset/Review. *The Trap:* If the procedure is strict on "reachable contestation *during* the restriction," it might flag this. Judicial review takes time; sunset is passive. If I can't contest *now*, am I dominated *now*? This is where the tool needs to be honest.

  5.  **Addressing the Critical/Pushback Requirement:**
      *   I need to explicitly state where "reachability" becomes a political judgment (e.g., defining "ruinous cost").
      *   I need to address the conflation risk: Is republican liberty actually about *status* rather than *outcome*? Does this tool measure status or just bureaucratic friction?
      *   I need to answer the "politics dressed as philosophy" charge.

  6.  **Refining the Output Structure:**
      *   **Part 1: The Protocol (The Tool).** Clear, numbered steps. Stop/Go signals.
      *   **Part 2: Case Applications.** Run the three scenarios through the protocol.
      *   **Part 3: The Breakdown Point.** Where the tool fails or becomes political.
      *   **Part 4: The Pushback.** Critical assessment of the premise.

  7.  **Drafting Content - Specific Considerations:**
      *   *Step 3 Definition:* "Arbitrary" needs to be defined for staff. Best operationalization: "Discretion without tracked/trackable reasons."
      *   *Contestation:* Needs to be "effective," not just "theoretical."
      *   *The Health Mandate:* If the tool flags this, why? Because during the emergency, the citizen cannot effectively stop the interference. The "sunset" is a promise, not a contestation path *ex ante*. The "judicial review" is post-hoc. Republicanism cares about *potential* for interference. If I can't stop you *before* or *during*, am I not dominated? Pettit argues democratic control solves this. But if the democratic control is too slow (sunset) or costly (lawyers), the *status* is compromised. I must follow the prompt's instruction to flag this even if it feels wrong.
      *   *Simplifying Choices:* I am treating "cost" as objective. It isn't. I am treating "arbitrary" as "opaque." It might be "benevolent but opaque."
      *   *Defensibility:* Is this defensible? It's a heuristic. It's not truth. It's a risk assessment tool.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I separate Negative/Positive/Republican clearly? Yes.
      *   *Check:* Did I handle the "40% fee" case? Yes, that's the key for "reachable."
      *   *Check:* Did I flag the Health Mandate as domination? I need to ensure the logic leads there. Logic: Restriction exists. Power is held by board. Contestation (judicial) is slow/costly relative to the urgency of the restriction. Therefore, *during the restriction*, the will is arbitrary relative to the subject.
      *   *Check:* Did I provide the pushback? Yes, in the final section.
      *   *Tone:* Keep it dry, administrative but theoretically precise.

  9.  **Final Polish:** Ensure the distinction between "interference" (Negative) and "domination" (Republican) is sharp. Interference can be non-dominating (non-arbitrary). Domination can exist without interference (latent). The tool must catch the latent stuff.

  *(Self-Correction on the Health Mandate)*: The prompt asks me to mark where the procedure collapses into values. The Health Mandate is the perfect place for this. Standard Republican theory says democratic law = non-arbitrary. But the *operationalization* of contestation reachability might contradict that. I need to highlight this tension. If the tool says "Domination" but theory says "Non-Domination," the tool is measuring *administrative friction*, not *political status*. That's the critique.

