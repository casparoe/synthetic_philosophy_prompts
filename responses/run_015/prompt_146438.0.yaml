answer: |-
  The combination of practices you describe embodies an implicit theory of first-person report that might be termed **Pragmatic Access-Functionalism**. This theory treats conscious perception not as a private, inner movie that reports describe, but as a functional status of information availability that reports *constitute* or *finalize*.

  Here is the reconstruction of that theory, separated into what it strictly presupposes and what it merely accommodates, followed by answers to your specific questions.

  ### The Implicit Theory: Pragmatic Access-Functionalism

  **Strict Presuppositions:**
  1.  **Publicity of Evidence:** Science requires third-person data. A first-person report is not a window into a private realm; it is a public behavior (utterance, button press) that counts as data only when objectified.
  2.  **Operational Definition:** "Conscious perception" is operationally defined by the capacity to report. If a subject cannot report it (and no proxy like eye movement is available), it does not count as "conscious" for the purposes of the experiment.
  3.  **Fallibility of Introspection:** Subjects are authoritative on the *occurrence* of a judgment ("I saw it") but not on the *nature* of the vehicle ("My red is unique"). The report is a verdict, not a description of intrinsic qualities.

  **What Merely "Fits Well" (Contingent Accommodations):**
  1.  **Realist Intuitions:** The practice fits well with the researcher's intuitive realism (the subject *really* felt something), but this is not required by the method. The method works even if the subject is a philosophical zombie producing text.
  2.  **Phenomenal Content:** The practice accommodates talk of "experience" and "qualia" as shorthand for "reported content," without committing to the existence of non-physical properties.
  3.  **Neural Correlates:** It fits well with the search for NCCs (Neural Correlates of Consciousness), assuming that the neural state causing the report is the same as the neural state constituting the experience, though the method cannot verify this identity.

  ---

  ### 1. The Bracketing Move: Methodological or Ontological?

  **Verdict:** While presented as merely methodological, the practice **commits the practitioner to there being no scientifically accessible fact of the matter beyond the heterophenomenological world.**

  If the bracketing were purely methodological (i.e., "We suspend judgment to be rigorous, but we believe there is a real fact of the matter"), researchers would actively seek ways to validate the reports against that independent fact. They do not and cannot. By treating the heterophenomenological world (the text/behavior) as the *terminal* point of analysis, the method enforces a verificationist ontology: if a fact about experience cannot be cashed out in third-person descriptions of behavior or neural activity, it is not a fact *for science*.

  Consequently, while a researcher may personally be a realist, the *methodology* forces an ontological agnosticism that functions as eliminativism. It dictates that the "truth" of the experience is exhausted by the coherent interpretation of the subject's behavior. To claim there is a "real experience" beyond the heterophenomenological world is to posit a variable that the experimental design explicitly renders invisible.

  ### 2. Gold Standard vs. No Evidence: One View or Conflation?

  **Verdict:** The practice is **running together two different things under the word "report."** It conflates *Access Consciousness* with *Phenomenal Consciousness*.

  *   **Report as Gold Standard (Access):** When researchers accept "I saw it" as proof of perception, they are measuring **Access Consciousness** (information available for global control and reporting). Here, the report is constitutive. To have access *is* to be able to report (in principle).
  *   **Report as No Evidence (Phenomenality):** When researchers reject claims about "what it was like" (e.g., the blind spot, the specific shade of red), they are acknowledging that reports are poor measures of **Phenomenal Consciousness** (the intrinsic qualitative feel). Here, the report is a reconstruction subject to cognitive bias, memory decay, and conceptual limitation.

  The incoherence arises because the field claims to study "Conscious Perception" as a unitary phenomenon. If consciousness is unitary, the report should be equally reliable for both detection and quality. The fact that it is trusted for one and distrusted for the other implies the field is actually studying *reportability* (access) while using the language of *feeling* (phenomenality). The "Gold Standard" status applies only to the behavioral verdict, not the experiential content.

  ### 3. No-Report Paradigms: Tension or Specific Discredit?

  **Verdict:** The turn to no-report paradigms is **in deep tension with the rest of the practice.**

  The explicit ground for no-report paradigms is that "demanding a report confounds perception." This admits the **Observer Effect**: the act of reporting alters the conscious state.
  *   If reporting alters the state, then the "Gold Standard" report does not measure *natural* conscious perception; it measures *reported* conscious perception.
  *   If eye movements or other involuntary indicators are "purer" measures, then the verbal report is demonstrably *less* reliable as a measure of the underlying perceptual state.

  This undermines the heterophenomenological stance. Heterophenomenology says, "Take the text as the data." No-report paradigms say, "The text is noise; look at the physiology/behavior behind it." You cannot simultaneously hold that the subject's utterance is the definitive boundary of their world (Dennett) and that their utterance is a confounding variable that obscures the true neural correlate of their experience (No-Report NCC). The no-report move implicitly admits that there is a fact of the matter about experience (the "pure" perception) that exists *prior to* and *independent of* the report, which contradicts the strict heterophenomenological bracketing.

  ---

  ### Final Implications

  **If the Strict View (Heterophenomenology/Access-Functionalism) is Right:**
  A lab using this method would have to change its **ontological claims**.
  *   They must stop claiming to find the neural correlates of *experience* and start claiming to find the neural correlates of *reporting* or *judgment*.
  *   They must abandon the language of "qualia" or "what it is like" except as quoted text from the subject.
  *   They must acknowledge that if a subject has an experience they cannot report (and leaves no involuntary trace), science cannot say it exists. The "Hard Problem" is dissolved because the "residue" of experience beyond report is defined as scientifically non-existent.

  **If the Strict View is Wrong (Realism about Phenomenal Consciousness):**
  *   **Can the method distinguish real experience from the heterophenomenological world?** **No.** By design, the method filters out anything that does not manifest as third-person data. It is a sieve that catches only behavior. If "real experience" implies properties not exhausted by behavior/neural function, this method is blind to them.
  *   **Does this inability settle the question?**
      *   **For Science:** Yes. If a distinction makes no difference to observation, prediction, or control, it is scientifically idle. The method's inability to distinguish renders the distinction operationally meaningless.
      *   **For Philosophy:** No. The method's blindness does not prove the absence of the thing. It only proves the method is limited. If there *is* a fact of the matter about experience that exceeds the heterophenomenological world (e.g., inverted qualia that behave normally), this methodology is fundamentally incapable of turning it up.

  **Conclusion:** The current experimental consensus rests on a pragmatic contradiction. It uses reports as truth-makers while simultaneously developing methods that treat reports as confounds. This suggests the field is in a transitional state: it has not yet decided whether it is studying the *biology of behavior* (where reports are just output) or the *biology of feeling* (where reports are imperfect windows). Until this is resolved, the "Gold Standard" remains tarnished by the very methods used to polish it.
