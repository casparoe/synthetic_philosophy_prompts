      *   **Core Methodological Issues to Address:** Overdetermination (multiple causes), Counterfactual Instability (institutions/culture aren't discrete treatments), Structural vs. Configurational causes, Correlation vs. Mechanism.
      *   **Specific Requirements:**
          *   Ordered sequence of tests with Pass/Fail/Uncertain criteria.
          *   Stop rules for outright rejection (especially "Galactic Overdetermination").
          *   Hand-off points for human judgment (values/interpretation).
          *   "Downgrade" pathway (from "Cause" to "Facilitating Condition").
          *   Apply to three specific cases (Norway/Institutions, Mali/Geography, Japan/Culture).
          *   State limitations (what it misses, justice/policy questions, filter vs. research design).
          *   Mark points of ineliminable judgment.
          *   Include worked examples of each outcome type within the procedure explanation or application.

  2.  **Deconstruct the Methodological Challenges:**
      *   *Overdetermination:* Nations are complex. Claiming $X$ is *the* cause when $Y$ and $Z$ also lead to wealth is a logical error (INUS conditions vs. Necessary/Sufficient).
      *   *Counterfactuals:* You can't rewind history and change "culture" while holding everything else constant.
      *   *Structural vs. Configurational:* Is the cause inherent to the country (structural) or dependent on its place in the global system (configurational)?
      *   *Correlation vs. Mechanism:* Just because rich countries have $X$ doesn't mean $X$ made them rich.

  3.  **Drafting the Procedure (The "Causal Narrative Audit Protocol" - CNAP):**
      *   *Goal:* Make it step-by-step, binary where possible, with clear exit ramps.
