      *   *Mali (Geography):* Ignores colonial institutional disruption. This is a classic "Galactic Overdetermination" fail. Geography is static; poverty is dynamic. *Reject*.
      *   *Japan (Culture):* "Group-oriented values" is vague. Counterfactual is unstable (can you remove culture without removing the society?). *Downgrade* to "Social Cohesion as Enabler."

  6.  **Addressing the Limitations & Judgment Points:**
      *   Must admit this doesn't prove truth, only coherence.
