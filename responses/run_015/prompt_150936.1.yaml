answer: |-
  # Causal Narrative Audit Protocol (CNAP)
  **Version:** 4.2 (Senior Review Unit)  
  **Time Allocation:** 120 Minutes per Report  
  **Authorized Inputs:** Submitted Narrative, World Bank Development Indicators, Maddison Project Data, Polity IV (Standard Tables Only).

  ## Purpose
  To filter country-level causal narratives for logical coherence and methodological plausibility. This protocol does **not** verify empirical truth (we cannot run new regressions). It verifies that the *argument structure* respects the limits of macro-historical inference.

  ## Decision Codes
  *   **PASS:** Narrative supports a causal claim ("X caused Y") with robust controls for overdetermination and stable counterfactuals.
  *   **CONDITIONAL PASS (DOWNGRADE):** Narrative is coherent only if the claim is weakened from "Cause" to "Facilitating Condition" or "Enabling Context."
  *   **REJECT:** Narrative commits fatal logical errors (e.g., Galactic Overdetermination, Static/Dynamic Mismatch).

  ---

  ## Part I: The Evaluation Procedure

  ### Step 1: Specification Check (15 Minutes)
  **Task:** Identify the four anchors of the claim.
  1.  **Cause (X):** Is it defined as a variable (e.g., "tax rate") or a vague essence (e.g., "spirit of capitalism")?
  2.  **Effect (Y):** Is it defined as a level (wealth) or a change (growth rate)?
  3.  **Unit (N):** Is it the nation-state, a region, or a specific sector?
  4.  **Time (T):** Is the causal window specified (e.g., 1950–1990)?

  *   **FAIL:** If any anchor is missing or vague (e.g., "Culture caused Wealth").
  *   **PASS:** All four are explicit.
  *   **⚠️ JUDGMENT CALL:** If X is a "complex concept" (e.g., Institutions), reviewer must decide if the definition is operational enough to be observed in tables.

  ### Step 2: Variation & Comparison Screen (30 Minutes)
  **Task:** Check the comparator group.
  1.  **Positive Check:** Do countries *without* X also achieve Y? (If yes, X is not necessary).
  2.  **Negative Check:** Do countries *with* X fail to achieve Y? (If yes, X is not sufficient).
  3.  **Peer Selection:** Did the report compare the subject to appropriate peers? (e.g., Do not compare Norway only to Sweden if claiming a universal institutional rule).

  *   **FAIL (Galactic Overdetermination):** The report asserts X is *the* primary cause while ignoring documented cases where Z or W produced Y.
  *   **PASS:** Report acknowledges multiple pathways or limits the claim to a specific configuration.
  *   **⚠️ JUDGMENT CALL:** Determining if a comparator is "appropriate" or "cherry-picked."

  ### Step 3: The Mechanism Plausibility Test (30 Minutes)
  **Task:** Trace the link between X and Y.
  1.  **Correlation vs. Process:** Does the report describe *how* X changes behavior to produce Y, or does it simply show X and Y moving together?
  2.  **Timing:** Did X precede Y? (If X and Y emerge simultaneously, causality is suspect).

  *   **FAIL:** Argument relies solely on co-occurrence (e.g., "Rich countries have banks, therefore banks cause wealth").
  *   **PASS:** A logical chain is provided (e.g., "Banks lowered transaction costs, enabling investment").
  *   **⚠️ JUDGMENT CALL:** Assessing if the described mechanism is "plausible" based on standard economic theory without running new models.

  ### Step 4: Counterfactual Stability Test (30 Minutes)
  **Task:** Assess the "Removal Test."
  *   *Question:* If we mentally remove X from this country's history, does the rest of the history collapse, or does it remain coherent?
  *   **Structural Causes:** (Geography, Deep Culture) are hard to remove without changing the identity of the unit.
  *   **Configurational Causes:** (Policy, Trade Agreements) are easier to remove mentally.

  *   **FAIL (Unstable Counterfactual):** Removing X requires rewriting fundamental history (e.g., "If Japan lacked group-values, it would not be Japan").
  *   **PASS:** X can be imagined as absent while the unit remains recognizable (e.g., "If Japan lacked the 1953 Tax Law...").
  *   **⚠️ JUDGMENT CALL:** Deciding where "culture" ends and "policy" begins.

  ### Step 5: Structural vs. Configurational Classification (15 Minutes)
  **Task:** Categorize the cause.
  1.  **Structural:** Invariant over the time period (e.g., Landlocked, Tropical).
  2.  **Configurational:** Dependent on interaction or change (e.g., Tariffs, Alliances).

  *   **RULE:** A Structural Cause cannot explain a Dynamic Effect (Change in Growth) without a Configurational Trigger.
      *   *Example:* "Landlocked" (Static) cannot explain "1990s Decline" (Dynamic) unless a new variable (e.g., "Neighbor's War") interacts with it.
  *   **FAIL:** Static cause assigned to dynamic effect without interaction term.
  *   **PASS:** Static cause framed as a constraint; dynamic cause framed as the driver.

  ### Step 6: Final Determination & Downgrade Pathway
  **Task:** Apply the Decision Matrix.

  | If Step 2 fails (Overdetermination) | **REJECT** |
  | :--- | :--- |
  | If Step 5 fails (Static/Dynamic Mismatch) | **REJECT** |
  | If Step 4 fails (Unstable Counterfactual) | **DOWNGRADE** (Change "Cause" to "Condition") |
  | If Step 3 fails (Mechanism Weak) | **DOWNGRADE** (Change "Driver" to "Correlate") |
  | If All Pass | **PASS** |

  **The Downgrade Formulation:**
  If the report is downgraded, the reviewer must rewrite the core claim using this syntax:
  *   *Original:* "X caused Y."
  *   *Revised:* "X provided a **facilitating context** for Y, contingent on Z."

  ---

  ## Part II: Application to Submitted Narratives

  ### Case 1: Norway (Institutions)
  **Narrative:** Norway's wealth is primarily caused by its early adoption of parliamentary institutions (19th C), compared only to Denmark and Sweden.
  **Reviewer Application:**
  1.  **Specification:** Clear (Institutions → Wealth).
  2.  **Variation:** **FAIL.** Comparison set is too narrow (Denmark/Sweden also have parliamentary institutions and wealth). No variance in X or Y among the set. No comparison to non-parliamentary rich states (e.g., Gulf States) or parliamentary poor states.
  3.  **Overdetermination:** **FAIL.** Ignores the discovery of North Sea Oil (1969) as a sufficient alternative pathway for wealth. Asserting institutions are *primary* without controlling for resources is Galactic Overdetermination.
  4.  **Decision:** **REJECT.**
  5.  **Justification:** "The narrative commits Galactic Overdetermination. It asserts institutions as the dominant cause while excluding the resource windfall pathway and utilizing a comparator group with zero variance on the independent variable. Resubmit with a model that accounts for resource interaction."

  ### Case 2: Mali (Geography)
  **Narrative:** Mali's poverty is geographically determined by landlockedness and tropical climate; colonial institutional disruption is secondary.
  **Reviewer Application:**
  1.  **Specification:** Clear (Geography → Poverty).
  2.  **Structural/Dynamic:** **FAIL.** Geography is Structural (invariant). Poverty is Dynamic (fluctuates/worsened post-independence). A static cause cannot explain a dynamic deterioration without a configurational trigger.
  3.  **Overdetermination:** **FAIL.** Dismissing colonial institutional disruption (a configurational cause) as 'secondary' contradicts standard development literature regarding state capacity.
  4.  **Decision:** **REJECT.**
  5.  **Justification:** "Static/Dynamic Mismatch. Landlockedness (invariant) cannot explain the variance in post-1960 growth rates (dynamic) without an interaction term (e.g., trade policy). Furthermore, dismissing institutional disruption violates the Overdetermination Screen. This is a deterministic geographic argument that ignores historical contingency."

  ### Case 3: Japan (Culture)
  **Narrative:** Japan's post-war growth was culturally caused by "group-oriented values."
  **Reviewer Application:**
  1.  **Specification:** Weak. "Group-oriented values" is vague (Step 1 Warning).
  2.  **Mechanism:** Plausible (social cohesion reduces transaction costs), but hard to isolate.
  3.  **Counterfactual Stability:** **FAIL.** To test if "group values" caused growth, we must imagine Japan *without* group values. This creates an unstable counterfactual (Step 4). If you remove the cultural fabric, the specific post-war labor relations (the actual mechanism) likely do not exist. The cause is inseparable from the unit.
  4.  **Decision:** **CONDITIONAL PASS (DOWNGRADE).**
  5.  **Justification:** "The counterfactual required to establish national-level causation is historically unstable. We cannot isolate 'culture' from the society itself. However, the mechanism is plausible. **Downgrade Required:** The claim must be rewritten from 'Culture caused Growth' to 'Cultural cohesion acted as a **facilitating condition** for specific industrial policies.' The field office will resist this as it diminishes the centrality of their argument, but it is methodologically required."

  ---

  ## Part III: Limitations & Ineliminable Judgment

  ### What This Procedure Cannot Do
  1.  **Truth Verification:** A "PASS" does not mean the narrative is true. It means the narrative is *coherent*. A logically sound argument can still be factually wrong if the underlying data tables are misinterpreted.
  2.  **Distributive Justice:** The protocol evaluates causal logic, not moral worth. A narrative arguing "Inequality caused Growth" may Pass logically even if the agency's mandate opposes inequality.
  3.  **Complex Conjunctural Causation:** The procedure struggles with "Ragged Edge" causality (e.g., X causes Y only when A, B, and C are present in a specific sequence). It tends to flatten these into "Configurational" buckets, potentially losing nuance.
  4.  **Policy Priority:** It does not assess whether the identified cause is *actionable*. A report may Pass by proving "Geography causes Poverty," but since the agency cannot change geography, the report is operationally useless. This is a separate operational filter.

  ### Points of Ineliminable Judgment
  *Reviewers must acknowledge that the following steps require human interpretation and cannot be fully automated:*

  1.  **Step 1 (Operationalization):** Deciding if a concept like "Institutional Quality" is defined well enough to be measured against standard tables.
      *   *Risk:* Reviewer bias on what counts as "measurable."
  2.  **Step 2 (Peer Selection):** Determining if a comparator country is "appropriate."
      *   *Risk:* Reviewer may impose their own theoretical preferences on what counts as a peer.
  3.  **Step 3 (Plausibility):** Judging if a mechanism is "plausible" without running a model.
      *   *Risk:* Reliance on orthodoxy. Unconventional but valid theories (e.g., Heterodox economics) may be flagged as "Implausible."
  4.  **Step 4 (Counterfactual Stability):** Deciding when a counterfactual becomes "too unstable."
      *   *Risk:* This is inherently philosophical. Different reviewers will draw the line differently on how much history can be mentally rewritten.

  ### Worked Example Summary of Outcomes

  | Outcome | Case | Logic |
  | :--- | :--- | :--- |
  | **REJECT** | **Mali (Geography)** | **Static/Dynamic Mismatch.** Invariant causes (geography) cannot explain dynamic effects (poverty trends) without interaction terms. Also fails Overdetermination Screen by ignoring colonial history. |
  | **DOWNGRADE** | **Japan (Culture)** | **Unstable Counterfactual.** Culture cannot be removed from the unit without collapsing the unit's identity. Claim survives only as a "Facilitating Condition," not a discrete cause. |
  | **PASS** | *(Hypothetical: Botswana Diamonds)* | **Robust Configuration.** Report argues "Diamond Revenue (X) + Prudent Fiscal Rules (Z) → Growth (Y)." Compares to DRC (Diamonds - Rules = No Growth). Mechanism is fiscal spending. Counterfactual is stable (Rules could have been absent). Acknowledges geography as constraint, not cause. |

  ---

  **Senior Officer Note:** This protocol is a filter for narrative coherence, not a substitute for empirical research design. If a field office argues that this procedure systematically excludes valid heterodox arguments, they may appeal to the Methodological Review Board, but they must demonstrate that their alternative logic does not violate the laws of non-contradiction or temporal ordering.
