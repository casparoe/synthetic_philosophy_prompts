      *   Ensure the ending hangs in the balance.

  7.  **Writing - Focus on Tone:**
      *   Use metaphors of splitting selves.
      *   Avoid explicit philosophical jargon (like "Newcomb's Problem" or "Kavka"). Show, don't tell.
      *   The "Toxin" will be a "Brazier" or "Fire Walk." Something visceral.

  8.  **Revising for Ambiguity:**
      *   The story must stop *before* the act is completed or failed. Right at the threshold.

