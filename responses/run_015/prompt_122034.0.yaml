  I'm putting together a proposal for a four-month graduate seminar project in philosophy of history (target length about 8,000 words). The course has focused heavily on the familiar moral version of presentism—whether historians ought to judge past societies by present ethical norms—but in a recent discussion with classmates I became convinced that a parallel and less examined problem lies in what I am tentatively calling "ontological framing presentism." The core worry is not about blame or praise, but about explanatory architecture: historians routinely partition past societies using modern ontological categories—"the economy," "religion," "politics," "the private sphere"—treating these as if they were stable natural kinds that past actors themselves recognized and navigated. If one tries to avoid this by adopting only the conceptual vocabulary internal to the period, causal explanation seems to collapse into pure description; yet retaining modern frames appears to build presentist assumptions into the very structure of historical explanation. I want to turn this half-formed intuition into a tractable research question.

