      *   *Correction:* The Orwellian/Stalinesque distinction is specifically about *misreporting*. Orwellian = Honest report of a lie (I saw red, then it changed). Stalinesque = Lie about the past (I saw green, never saw red).
      *   *The User's Angle:* If I can probe the "Red" state later (subliminally?), does that prove it existed? Dennett says "existed as a neural state," not "existed as an experience."
      *   *The Pivot:* The thesis should argue that the *pragmatic utility* of the distinction remains for cognitive science, even if the metaphysical timing is dissolved. OR, argue that specific accessibility profiles *constitute* the difference, making the distinction real without a theater.
      *   *Better Pivot:* The proposal should focus on **Transient Accessibility**.
