      *   *Decision:* I will validate the hunch but warn about the definitional trap. The proposal should focus on *functional accessibility profiles* as the marker, explicitly rejecting the "moment of consciousness" framing.

  3.  **Drafting the Proposal Components:**

      *   **Title:** Needs to be punchy and accurate. "Residue and Revision."
      *   **Research Question:** Can we distinguish the models based on downstream accessibility of pre-revision states?
      *   **Motivation/Existing Positions:** Dennett says indistinguishable. Standard cognitivism says distinguishable via timing. User says distinguishable via *memory architecture*.
      *   **Methodology:**
          1.  Conceptual analysis of "accessibility."
