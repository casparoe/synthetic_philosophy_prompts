      *   **Success/Failure:**
          *   Success: Show a scenario where the two models predict different memory access outcomes.
          *   Failure: Show that any difference in memory access just collapses back into "what was conscious," vindicating Dennett.

  4.  **Refining the Scope (One Semester):**
