  3.  **Verdict 5 (Statutory Age):** She rules this **not vague** because it is "stipulated." *Heap-star* is also stipulated. The only difference is publicity. However, since Verdict 6 allows that a boundary can be non-vague even when *not yet* statable (Gold before chemistry), the permanent secrecy of *heap-star* should not trigger a vagueness verdict if the boundary is fixed by stipulation.
