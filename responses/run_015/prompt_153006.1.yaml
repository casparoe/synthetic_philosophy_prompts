      *   The *Degree Rule* typically asserts the principle is *almost* true (degree $< 1$), rather than "not to be asserted," and implies a specific point where truth value drops significantly.
      *   The *Context-Shift Rule* explains the failure by saying the standard moves, but Supervaluationism better captures the intuition that there is *no* specific cutoff instance *simpliciter*.
