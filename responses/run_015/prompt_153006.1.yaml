  ### 3. Discriminating Case: The Disagreement Test

  To separate the **Indeterminacy Rule** (my best guess) from its closest surviving rival, the **Context-Shift Rule**, I propose the following case. Both rules fit the original nine verdicts and the *heap-star* prediction equally well, but they diverge on the norms of disagreement.

  **The Case:**
  Two speakers, Alice and Bob, are presented with a borderline pile of sand (one that is neither clearly a heap nor clearly a non-heap). They are in the same room, aware of the same facts.
  *   Alice asserts: "This is a heap."
  *   Bob asserts: "This is not a heap."
  *   Neither is bluffing or speaking metaphorically.
  *   Professor V is asked: **Can both speakers be correct?**

  **Predictions:**

  *   **The Indeterminacy Rule:** **No.**
      *   *Reasoning:* On this view, borderline statements lack a truth value (they are neither supertrue nor superfalse). Since neither assertion is true, neither speaker is correct. Alternatively, if they are attempting to assert a precise proposition, both are asserting something false (as there is no sharp boundary to make their claim true). There is no "faultless disagreement"; there is only mutual error or indeterminacy.
  *   **The Context-Shift Rule:** **Yes.**
