answer: |-
  | Buddhist Term | Medical Analogue | Consequentialist Interpretation |
  | :--- | :--- | :--- |
  | **Buddha** | Physician | Expert calculator of outcomes |
  | **Dukkha** | Disease | Negative utility to be minimized |
  | **Craving (Tanha)** | Pathogen | Cause of negative utility |
  | **Nirvana** | Health/Cure | Maximized welfare endpoint |
  | **Eightfold Path** | Treatment | Instrumental means to endpoint |
  | **Kusala (Skillful)** | Therapeutically Effective | Morally right iff productive |

  The medical analogy is canonical (the Four Noble Truths are explicitly medical), but the leap to *consequentialism* fails at three structural points.

  **1. Constitutive vs. Instrumental Means (Your Point 1)**
  In medicine, the pill is instrumental; swallowing it has no intrinsic value beyond the cure. In Buddhism, *sila* (virtue) is constitutive of the path. You cannot reach Nirvana through unethical means, even if they theoretically reduced suffering. The path *is* the cure in progress, not merely a tool. The analogy imports a "normal functioning" (health) that exists independently of the treatment, whereas Nirvana is an ontological shift defined *by* the practice. The endpoint is not pre-given; it is revealed by the path.

  **2. Agent-Relative vs. Agent-Neutral (Your Point 2)**
  The bedside model is inherently agent-relative: *my* doctor cures *me*. Consequentialism is agent-neutral: reduce suffering anywhere. The medical analogy supports soteriological egoism (save yourself), not universal ethics. To make it public health (triage), you need a committee deciding whose suffering matters. Buddhist ethics relies on *karuna* (compassion), which motivates action, but the medical frame doesn't explain *why* I should treat strangers unless I import external moral premises. The analogy buys teleology, not impartiality.

  **3. Intention vs. Outcome (Your Point 4)**
  This is the fatal break. Medicine is outcome-based: if you accidentally swallow the cure, you are healed. Buddhism is intention-based (*cetana*): accidental virtue generates no karma. Consequentialism judges acts by outcomes; Buddhism judges karma by volition. The medical analogy predicts that a lie told to reduce suffering is "skillful" purely by result. Buddhist texts often reject this; the mental state matters intrinsically. The analogy obscures the deontological leftovers inherent in karma theory.

  **Paternalism (Your Point 3)**
  The doctor-patient asymmetry licenses "skillful means" (lying for the patient's good), which looks consequentialist. However, this relies on epistemic authority, not moral calculus. It justifies hierarchy, not necessarily utility maximization. It explains why the Buddha might withhold truth, but not why harming beings is intrinsically unskillful regardless of outcome.

  **The Verdict**
  The bedside version cannot carry the conclusion that Buddhist ethics is consequentialist "all the way down." It supports a *teleological virtue ethics*: the end is fixed (liberation), but the means are constrained by intrinsic qualities (virtue/intention). The nearest analogy that carries the ethical weight is **Athletic Training**. The coach (Buddha) designs a regimen (Path) to achieve a peak state (Nirvana). Cheating (unethical acts) disqualifies the athlete regardless of the score, and form (intention) matters as much as the win.

  The medical analogy survives as a soteriological model but collapses as a proof of ethical consequentialism due to the intrinsic value of intention and virtue.

  \answer{survives-in-modified-form}
