prompt: |-
  I'm the operations manager for a supported-living provider — eight group homes, about forty adult residents, most of whom have an intellectual disability and many of whom also carry psychiatric diagnoses (schizoaffective disorder, emotionally unstable personality disorder, alcohol-related brain damage, and increasingly residents who are ageing into early dementia). Our staff are support workers with three weeks of classroom training and a two-day annual refresher; none of them have any academic background in anything. Incidents happen somewhere in the service two or three times a week — a punch during a personal-care prompt, a stolen wallet, sexual touching in a shared lounge, a violent episode during a relapse — and after each one a shift lead writes it up and, with the clinical lead signing off, decides what follows: a mediation, a behaviour support plan, a referral, a move, or nothing. Our current framework is essentially positive behaviour support: every incident is logged on an antecedent-behaviour-consequence chart and handled as behaviour with causes to be identified and managed. It has two failure modes I keep running into. Staff who let a resident see that they were frightened, hurt or angry get written up for unprofessional conduct and told to stay neutral. And residents and families tell me, in different words, the same thing: that they feel written off, handled like weather or like livestock, that nobody expects anything of them any more and so they have stopped trying.

  I have no academic background myself, but I got talking to a friend who studied philosophy, and she mentioned an old essay — I think by P. F. Strawson, possibly called Freedom and Resentment — which, as she described it, says roughly this: that holding someone responsible isn't a theory you believe but a stance you take, a matter of having reactive attitudes like resentment, gratitude and guilt; that the alternative of treating someone as a thing to be managed or handled is available and sometimes right, but is not the neutral, scientific default it presents itself as; and that you don't have to settle whether anyone has free will before you resent being wronged, because the question is set up backwards. She also said something I've been chewing on: that there is a difference between cases where this person couldn't have done otherwise on this occasion — he was pushed, he didn't know, he was out of his mind — and cases where the person isn't the kind of thing you address as a person at all, and that confusing the two is exactly the mistake our incident forms make, since the chart has one box where you write the diagnosis and another where you write the consequence.

  What I want from you is a written procedure my shift leads can actually run. Constraints: it has to fit on one page, be usable in twenty minutes at a debrief by someone who has never heard the theory, and produce a short written record the clinical lead can sign off or overrule. I'd want it as ordered questions — is this a case for addressing the person or for managing the behaviour, which of those stances is being taken toward whom, and if it's the managing stance, whether the withdrawal is total or partial and temporary or open-ended — with a statement, for each question, of what counts as a sufficient answer and what evidence on the file satisfies it, and with explicit stop points: places where the procedure returns a firm no (do not switch to the managing stance here) and places where it stops and hands the decision to a person because the question is one of values rather than fact. It also has to handle five things that I think break any naive version of this. First, the difference between excusing and exempting, including the cases where a resident is fully capable in some domains and not in others, so the honest answer may be hold him responsible about his money but not about his hygiene. Second, the fact that we only ever deal with the negative side: nobody has a procedure for gratitude, appreciation or restored trust, and I suspect our service is worse at that than at blame. Third, the loop — if we have spent three years treating a resident as a thing to be managed, some of his present incapacity is our doing, so the file is itself part of the cause, and a procedure that asks is he an agent now? is asking about a variable it has been busy depressing. I want to know what the procedure does with that. Fourth, how to keep resentment from sliding into punitiveness, humiliation or a row: what the difference is in practice, not in theory. Fifth, the cases where the proper object of the attitude isn't the resident at all, but a co-resident's grievance on someone else's behalf, or the staff member's own.

  Then please run it on three residents from our service. (A) Marcus, mild intellectual disability and alcohol-related brain damage, has hit a support worker during a shower prompt for the third time this month; afterwards he says he shouldn't have, and means it, and it happens again. (B) Nadia has an emotionally unstable personality disorder diagnosis, steals small sums from co-residents, lies about it, and turns staff against one another; my staff say she knows exactly what she is doing, my clinical lead says it is trauma-driven behaviour and wants a plan with no blame in it, and my own instinct is with the clinical lead. (C) Terrence, floridly psychotic, attacked a co-resident with a kettle because he believed the man was poisoning him; he has since been hospitalised, medicated, and came back saying he remembers it like a dream, and the injured man's family want him moved out. I'd be grateful if at least one of the three came out in a way I'll argue with — I'd least like to be told that Nadia is a full participant and that our management-only approach is the wrong stance toward her, so if that's what the procedure says I want to see it argued rather than asserted. Finally, be explicit about what the procedure cannot settle: whether to call the police, whether to end a placement, whether anyone is blameworthy in the deep sense, and anything else where a page of questions would be pretending.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User Role:** Operations Manager for a supported-living provider (8 homes, 40 residents).
      *   **Resident Profile:** Intellectual disabilities, psychiatric diagnoses (schizoaffective, EUPD, ARBD, early dementia).
      *   **Staff Profile:** Support workers, minimal training (3 weeks + 2 days refresher), no academic background.
      *   **Current System:** Positive Behaviour Support (PBS), Antecedent-Behaviour-Consequence (ABC) charts.
      *   **Problem:** Two failure modes. 1. Staff punished for showing human emotion (resentment/fear). 2. Residents/families feel treated like objects/livestock (no expectations, no agency).
      *   **Theoretical Input:** P.F. Strawson's "Freedom and Resentment" (via a friend). Key concepts: Reactive attitudes (resentment, gratitude) vs. Objective attitude (managing/handling). Excusing (couldn't do otherwise *this time*) vs. Exempting (not the kind of thing to address as a person).
      *   **Deliverable:** A one-page written procedure for shift leads.
      *   **Constraints:**
          *   Fit on one page.
          *   Usable in 20 mins at a debrief.
          *   Usable by non-academics.
          *   Produce a short written record for Clinical Lead sign-off.
          *   Format: Ordered questions with sufficient answers, evidence requirements, explicit stop points (firm "no"s and value judgment hand-offs).
          *   Must handle 5 specific complexities: Excusing vs. Exempting (domain specificity), Negative bias (lack of gratitude/trust repair), The Loop (incapacity caused by management), Resentment vs. Punitiveness, Third-party attitudes (staff/co-resident feelings).
      *   **Application:** Run the procedure on three specific cases (Marcus, Nadia, Terrence).
      *   **Requirement:** At least one outcome should be arguable/challenging (specifically regarding Nadia).
      *   **Disclaimer:** Explicitly state what the procedure *cannot* settle (police, placement, deep blameworthiness).

  2.  **Deconstruct the Theory (Strawson) for Practice:**

      *   *Reactive Attitudes:* Treating someone as a moral agent (resentment when wronged, gratitude when helped). Requires mutual recognition.
      *   *Objective Attitude:* Treating someone as a patient/subject to be managed, trained, or cured.
      *   *Excusing Conditions:* "He didn't mean it," "He was pushed," "He didn't know." (Temporary suspension of reactive attitudes).
      *   *Exempting Conditions:* "He is a child," "He is profoundly incapacitated." (Global suspension of reactive attitudes).
      *   *The Shift:* Moving from "What caused this behavior?" (ABC) to "What stance are we taking toward this person regarding this act?"

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* One page, clear questions, decision points.
      *   *Structure:* Header, Context, The 5 Questions, Decision Matrix, Sign-off.
      *   *Addressing the 5 Complexities:*
          1.  *Excusing/Exempting:* Need a question about capacity *specific to this act*.
          2.  *Negative Bias:* Need a step for "Restoration/Gratitude" if the stance is Reactive.
          3.  *The Loop:* Need a question about whether our past management created this incapacity.
          4.  *Resentment vs. Punishment:* Need a definition of "Sanction" vs. "Penalty."
          5.  *Third Party:* Need to identify *who* holds the attitude (Staff? Victim?).
      *   *Drafting Questions:*
          1.  Who was harmed and who holds the grievance? (Identifies the attitude holder).
          2.  Could the resident have done otherwise *in this domain*? (Excusing vs. Exempting).
          3.  Did our past management reduce their capacity? (The Loop).
          4.  What stance are we taking? (Reactive vs. Objective).
          5.  If Reactive, what is the repair? If Objective, is it temporary?
      *   *Refining for Staff:* Language must be plain English. No "reactive attitudes." Use "Holding to Account" vs. "Managing Risk."
      *   *Stop Points:* If "Yes" to incapacity due to psychosis -> Objective. If "Yes" to capacity -> Reactive.
      *   *Value Hand-offs:* When staff disagree on capacity -> Clinical Lead decides.

  4.  **Refining the Procedure (Checking Constraints):**

      *   *One Page:* Needs tight formatting.
      *   *20 Minutes:* Can't be too many open-ended fields. Checkboxes + short text.
      *   *Evidence:* Must specify what goes in the file (e.g., "Medical note," "Witness statement").
      *   *The "Nadia" Challenge:* The prompt specifically asks for the procedure to potentially challenge the manager's instinct on Nadia (EUPD, stealing, manipulation). The Clinical Lead says "trauma/no blame." Manager leans Clinical. Strawson suggests if she *knows* what she's doing, she is a candidate for reactive attitudes. The procedure should force the question: "Is she exempt or just difficult?" If she is capable of manipulation, she is capable of agency. This might lead to a "Reactive" stance, which contradicts the "no blame" plan. This fits the requirement.

  5.  **Developing the Case Studies:**

      *   *Marcus (ARBD + ID):* Hits during shower. Says sorry, repeats.
          *   *Analysis:* ARBD affects impulse control. Is it exempting (brain damage) or excusing (bad habit)? If he understands "sorry" but can't stop, is he an agent?
          *   *Procedure Outcome:* Likely Mixed. Manage the shower (Objective), but hold accountable for the apology/repair (Reactive).
      *   *Nadia (EUPD):* Steals, lies, triangulates. Staff say "knows what she's doing." Clinical says "trauma."
          *   *Analysis:* Manipulation requires theory of mind. If she can manipulate, she has agency. Treating her purely objectively (trauma plan) denies her agency.
          *   *Procedure Outcome:* Reactive Stance required for theft. Trauma explains *why*, but doesn't exempt from *responsibility*. This challenges the Clinical Lead's "no blame" plan.
      *   *Terrence (Psychosis):* Attacked due to delusion. Medicated now.
          *   *Analysis:* During psychosis = Exempt (Objective). Now = Recovered.
          *   *Procedure Outcome:* Objective during episode. Now? If delusion resolved, can we hold him accountable for safety planning? But the victim's family wants him out. That's a value judgment (Safety vs. Inclusion).

  6.  **Addressing the "Five Things" in the Procedure Design:**

      1.  *Excusing/Exempting:* Question 2 specifically asks about domain capacity.
      2.  *Gratitude/Trust:* Question 5 asks for "Repair/Restoration" not just "Consequence."
      3.  *The Loop:* Question 3 asks if *our* rules caused the failure.
      4.  *Resentment vs. Punishment:* Defined in the "Stance" section (Sanction vs. Penalty).
      5.  *Third Party:* Question 1 identifies the victim and the aggrieved party.

  7.  **Final Review against Constraints:**

      *   *One Page:* I will format it densely but clearly.
      *   *Stop Points:* Explicit "STOP - Clinical Lead Decision" markers.
      *   *Cannot Settle:* Add a footer section.
      *   *Tone:* Professional, operational, respectful of the philosophical underpinnings without using jargon.

  8.  **Writing the Response:**

      *   *Introduction:* Acknowledge the depth of the insight (Strawson).
      *   *The Procedure:* "The Agency & Stance Protocol (ASP)."
      *   *The Cases:* Apply the ASP rigorously.
      *   *The Limitations:* Explicit section on what this doesn't do.

      *(Self-Correction during drafting)*: Make sure the distinction between "Excusing" (temporary incapacity) and "Exempting" (status incapacity) is clear for staff. Use "Could they have done otherwise *this time*?" vs "Can they ever do otherwise *in this area*?"
      *Correction on Nadia:* Ensure the argument for holding her responsible is robust. If she lies and manipulates, she understands norms. Denying her that is infantilizing. This aligns with the user's fear that residents feel "written off."

      *(Refining the "Loop" aspect)*: The procedure needs to ask: "Did our restrictions create this behavior?" If yes, we can't just manage the behavior; we must change the restriction.

      *(Refining "Resentment")*: Staff are told not to show anger. The procedure must validate that *feeling* wronged is okay, but *acting* on it punitively is not. The record should capture "Staff Grievance" as valid data.

  9.  **Final Polish:** Check word count and layout simulation to ensure it *looks* like a one-pager. (I will use markdown to simulate the form).

      *Wait, one constraint:* "I'd be grateful if at least one of the three came out in a way I'll argue with — I'd least like to be told that Nadia is a full participant... so if that's what the procedure says I want to see it argued rather than asserted."
      *Plan:* I will ensure the procedure *does* categorize Nadia as a participant (Reactive Stance) because manipulation implies agency. I will argue this strongly in the analysis section, acknowledging the tension with the Clinical Lead's trauma model.

      *Wait, another constraint:* "Explicit stop points... places where the procedure returns a firm no."
      *Plan:* I will build "Hard Stops" into the form logic. E.g., If Psychosis Active -> STOP -> Objective Stance Mandatory.

      *Wait, "One Page":* I need to be concise. I will present the procedure as a distinct block that *could* be printed on one page.

      *Wait, "Evidence on the file":* I need to specify what document satisfies the question.

      *Let's build the form.*
      Title: Agency & Stance Review (ASR).
      Sections: 1. The Grievance (Who feels what?). 2. Capacity & Exemption (Could they?). 3. The Loop (Did we cause this?). 4. The Stance (Manage or Address?). 5. The Outcome (Repair or Plan?).
      Sign-off: Shift Lead, Clinical Lead.

      *Let's run the cases.*
      Marcus: Mixed.
      Nadia: Reactive (Arguable).
      Terrence: Objective (during), Reactive (now regarding safety), but Placement is a Value Call.

      *Let's write the "What this cannot settle" section.*
      Police, Eviction, Metaphysical Free Will.

      *Ready to write.*
answer: |-
  ### The Agency & Stance Review (ASR)
  **Purpose:** To decide whether an incident is handled as a *Behaviour to be Managed* (Objective Stance) or a *Wrong to be Addressed* (Reactive Stance).  
  **Time:** 20 Minutes. **User:** Shift Lead. **Sign-off:** Clinical Lead.

  | **1. THE GRIEVANCE** | **Evidence Required** |
  | :--- | :--- |
  | **1.1 Who was harmed?** (Resident, Staff, Property, Self) | Incident Report |
  | **1.2 Who holds the feeling?** (Who feels resentment/fear/betrayal? Staff, Victim, Family?) | Witness Statement |
  | **1.3 Is the feeling valid?** (Did a norm actually get broken, or just a preference?) | **STOP:** If no norm broken, file as "Preference Conflict." End Review. |

  | **2. CAPACITY & EXEMPTION** | **Evidence Required** |
  | :--- | :--- |
  | **2.1 Did they know this was wrong *at the time*?** (Excusing Condition) | Medical Note / Psych Status |
  | **2.2 Can they understand this norm *in general*?** (Exempting Condition) | **STOP:** If Yes (Psychosis/Delirium active), **Stance = MANAGE**. Skip to Q4. |
  | **2.3 Is capacity domain-specific?** (e.g., Money vs. Hygiene) | Care Plan / History |
  | **2.4 THE LOOP:** Did our past rules/restrictions create this incapacity? (e.g., learned helplessness) | **VALUE HAND-OFF:** If Yes, Clinical Lead must review restrictions before signing. |

  | **3. THE STANCE** | **Decision** |
  | :--- | :--- |
  | **3.1 Are we addressing the Person or Managing the Risk?** | **Circle One:** PERSON / RISK |
  | **3.2 If PERSON:** What repair is owed? (Apology, Restitution, Conversation) | **STOP:** Do not proceed if repair is punitive (humiliation, pain). |
  | **3.3 If RISK:** Is this withdrawal total or temporary? | **STOP:** "Open-ended" Risk stance requires Ops Manager approval. |
  | **3.4 Staff Emotion:** Is staff resentment recorded as data, not misconduct? | **Check:** [ ] Staff feelings logged as valid grievance. |

  | **4. THE OUTCOME** | **Action** |
  | :--- | :--- |
  | **4.1 Consequence:** (Sanction vs. Penalty) | **Sanction** = Related to harm (e.g., repay money). **Penalty** = Unrelated pain (e.g., no TV). **NO Penalties.** |
  | **4.2 Future:** (Behaviour Plan vs. Expectation Setting) | **Plan** = We manage triggers. **Expectation** = We expect you to try. |
  | **4.3 Gratitude/Trust:** If stance was PERSON, how do we rebuild trust if they succeed next time? | Write one specific positive reinforcement. |

  **Signatures:**  
  Shift Lead: \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ Date: \_\_\_\_\_\_  
  Clinical Lead (Must overrule if Q2.2 = Yes but Stance = PERSON): \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_

  ***

  ### WHAT THIS FORM CANNOT SETTLE
  *   **Police/Legal:** This form does not determine criminal liability.
  *   **Placement:** This form does not decide eviction or move-on (Safety vs. Rights balance).
  *   **Metaphysics:** This form does not decide "Free Will," only "Capacity for Relationship."
  *   **Diagnosis:** This form does not diagnose; it uses existing medical evidence to determine stance.

  ***

  ### CASE APPLICATIONS

  #### (A) Marcus (ARBD, ID, Repeat Hitting)
  *   **Q1 (Grievance):** Staff harmed. Resentment valid (assault is a norm breach).
  *   **Q2 (Capacity):** Q2.1 (At the time): Impulse control compromised by ARBD. Q2.2 (General): Understands "no hitting" but struggles to inhibit. **Not Exempt.** Q2.4 (Loop): Have we made showers too rushed? (Possible).
  *   **Q3 (Stance):** **Mixed.** We cannot expect impulse control he lacks (Manage the shower prompt), but we can expect post-incident repair (Address the Person).
  *   **Q4 (Outcome):** **Manage** the environment (two staff for showers). **Address** the agent (Marcus must acknowledge harm, even if he can't guarantee prevention).
  *   **Note:** Avoids treating him as livestock (expects apology) while acknowledging brain injury (doesn't expect perfect control).

  #### (B) Nadia (EUPD, Stealing, Manipulation)
  *   **Q1 (Grievance):** Co-residents harmed (theft). Staff feel betrayed (manipulation). Resentment valid.
  *   **Q2 (Capacity):** Q2.1 (At the time): She knew it was wrong (lies to cover it). Q2.2 (General): Manipulation requires high theory of mind. **Not Exempt.** Q2.4 (Loop): Has "trauma planning" removed all expectations? (Likely).
  *   **Q3 (Stance):** **PERSON.** The procedure forces the conclusion that manipulation *proves* agency. To treat her purely as a trauma-object is to deny the capacity she is actively demonstrating.
  *   **Q4 (Outcome):** **Address.** Restitution required (pay back money). Sanction related to harm (loss of privacy regarding money monitoring).
  *   **The Argument:** Your Clinical Lead wants a "no blame" plan. This procedure argues that **blame (in the Strawsonian sense of holding responsible) is a form of respect.** If she is capable of manipulating staff, she is capable of moral choice. Denying her this reduces her to a broken thing. The "trauma" explains the *motive*, but does not grant an *exemption*. A "no blame" stance here validates the theft as a symptom rather than a choice, which reinforces the "livestock" feeling you described.

  #### (C) Terrence (Psychosis, Kettle Attack)
  *   **Q1 (Grievance):** Co-resident harmed (serious). Family holds grievance.
  *   **Q2 (Capacity):** Q2.1 (At the time): Delusional belief (poisoning). **Exempt at time of incident.** Q2.2 (Now): Medicated, recalls as "dream." Capacity returning.
  *   **Q3 (Stance):** **Split Timeline.** Incident = **MANAGE** (Medical emergency). Present = **PERSON** (regarding safety agreements).
  *   **Q4 (Outcome):** No penalty for the attack (psychotic exempt). **However**, placement decision is a **VALUE HAND-OFF**. The form cannot settle if the victim's right to safety outweighs Terrence's right to stay. This goes to Ops/Clinical Lead for a values judgment, not a behavioural one.
  *   **Note:** Prevents punishing the psychosis, but prevents using psychosis as a permanent shield against safety planning now that he is stabilized.

  ### OPERATIONAL NOTES FOR THE MANAGER

  1.  **Resentment vs. Punitiveness (Constraint 4):** The form validates staff resentment in Q1.2 and Q3.4. It forbids punitiveness in Q4.1 (No Penalties). This allows a worker to say, "I am angry you hit me, and I need you to know that," without saying, "Because I am angry, you lose your TV."
  2.  **The Loop (Constraint 3):** Q2.4 forces the team to ask if *our* over-management caused the failure. If we micromanage Marcus's shower, he learns he can't do it. If the answer is Yes, we must change the care plan, not just the behaviour plan.
  3.  **Gratitude (Constraint 2):** Q4.3 is the critical addition. PBS logs failures. This form mandates logging the *repair*. If Nadia pays back the money, that must be recorded as "Trust Restored," not just "Incident Closed."
  4.  **Domain Specificity (Constraint 1):** Marcus is not "Exempt" globally. He is exempt from impulse control, not from moral acknowledgement. Nadia is not "Exempt" from theft because she has EUPD, even if she is exempt from emotional regulation in other areas.

  **Final Warning:** This procedure will generate conflict with Clinical Leads accustomed to pure medical models. It asserts that **capacity is a relationship, not just a diagnosis.** If a resident can manipulate, they can be held to account. If you implement this, you must back your Shift Leads when they mark "PERSON" on a resident the Clinical Lead views as "PATIENT."
