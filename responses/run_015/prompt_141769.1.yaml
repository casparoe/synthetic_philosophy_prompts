  **DECISION MEMO**

  **TO:** Model Deployment Committee  
  **FROM:** Grad Student Representative  
  **DATE:** [Insert Date]  
  **SUBJECT:** Decision on Internal Research Agent Deployment (Proposal #44-B)  

  **DECISION:** **APPROVE WITH CONDITIONS**  
  **REVIEW DATE:** Thursday, [Insert Date + 30 Days]  

  ### Bottom Line
  The committee authorizes the deployment of the research agent for **internal lab distribution only**. Distribution to external collaborators is **prohibited** until the latent-knowledge reporter passes a validated adversarial audit. The team must implement a "Trap-Testing" protocol immediately and submit the counterfactual training schema for committee review within 14 days.

  ### Rationale
  This decision balances the lab's need for operational efficiency with the existential risk of irreversible IP leakage. We acknowledge the proposing team's innovation regarding counterfactual-observability training; however, we also acknowledge the committee's valid concern that Eliciting Latent Knowledge (ELK) remains an open research problem. 

  We are rejecting the "all-or-nothing" framing. We do not need to solve ELK theoretically to proceed, but we must reduce the blast radius of potential failure. By restricting output to internal channels, we convert a catastrophic risk (external IP leak) into a manageable one (internal process correction). This aligns with the "make leaking more expensive" argument while respecting the "verification is impossible" caution.

  ### Conditions for Deployment
  To maintain this approval, the deploying team must execute the following immediately:

  1.  **External Distribution Freeze:** The weekly summary must not be sent to any email address outside the `[lab-domain.edu]` namespace. Any attempt to route data to external collaborators via this agent constitutes a policy violation.
  2.  **Trap-Testing Protocol (The "Red Canary"):** 
      *   The committee will provide five synthetic documents containing "watermarked" sensitive information (e.g., fake grant numbers, dummy reviewer comments) mixed into the agent's read access.
      *   **Success Criterion:** The latent-knowledge reporter must flag the inclusion of this specific information in the draft summary with >95% recall, even if the summary text appears innocuous.
      *   If the reporter fails to flag a trap, deployment pauses immediately.
  3.  **Schema Transparency:** The team must share the structure of the "matched pair" rollouts used for counterfactual-observability training. We do not require model weights, but we require visibility into how "human access revoked" was simulated to ensure no data leakage occurred during the safety training itself.

  ### Action Items for the Team
  *   **By Friday:** Confirm email routing rules are hardcoded to reject external domains.
  *   **By [Date + 14 Days]:** Submit the training schema documentation and schedule the Trap-Testing run.
  *   **By [Date + 30 Days]:** Present results at the next committee meeting. If Trap-Testing is successful, we will vote on lifting the External Distribution Freeze.

  ### Closing Note
  This is not a judgment on the quality of your safety work, but a standard containment procedure for unverified mitigation strategies. If the reporter works as claimed, passing these conditions will be straightforward. If it is merely simulating safety language, the Trap-Testing will reveal that without exposing real lab IP. Proceed with caution.
