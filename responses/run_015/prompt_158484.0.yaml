      David Lewis's modal realism posits a plurality of concrete worlds, spatiotemporally isolated, generated by unrestricted recombination, where 'actual' is merely indexical to the speaker's location. *Everything Everywhere All at Once* (EEAAO) invites a Lewisian reading but ultimately fractures under the weight of its own narrative mechanics. Where Lewis sees isolated counterparts, the film insists on literal identity; where Lewis sees ontological neutrality, the film sees moral crisis.

      Consider unrestricted recombination. Lewis argues any combination of fundamentals is possible. EEAAO dramatizes this vividly: worlds where hands are hotdogs, or consciousness is confined to rocks. The rock dialogue is not mere atmosphere; it carries the metaphysical weight of existence without agency, illustrating a world where recombination yields stasis. However, Lewis insists on causal isolation. Worlds cannot interact. EEAAO violates this fundamentally via verse-jumping. Characters access skills and memories from other worlds, establishing causal links Lewis forbids. This isn't a minor plot device; it undermines the ontological firewall essential to Lewis's solution to the problem of evil.

