  This brings us to the Home-World Restriction. I propose that even if all worlds are real, an agent's practical reasons range only over their occupied world because cross-world causation is impossible. EEAAO initially obliterates this restriction. Verse-jumping makes other worlds practically relevant; you can import kung fu skills or tax advice. Jobu's nihilism is a scope error only if causation is blocked. Since the film allows travel, the restriction fails metaphysically. However, the ending quietly reinstates it pragmatically. Evelyn chooses to stay in the laundromat world. She rejects the multiverse to save her daughter *here*. The googly eyes are not atmosphere; they are symbols of this chosen limitation—seeing things differently within a single context. The film suggests that while metaphysical possibility is infinite, practical rationality requires a home-world restriction, even if travel is possible. The final confrontation in the laundromat is the argument's core: it grounds the infinite in the mundane. For Lewis, the restriction is hardwired into reality; for the film, it is a moral achievement. This distinction matters for your essays: does the restriction hold because you *can't* leave, or because you *shouldn't*?

  Yet there is something neither Lewis nor I can accommodate: the trans-world identity of Joy and Jobu Tupaki. Lewis denies trans-world identity; Joy in one world is a counterpart to Jobu in another, related by similarity. The film insists they are literally one person fractured across branches. This is crucial for the emotional stakes. If they were merely counterparts, Evelyn saving one Joy wouldn't save Jobu. The film requires a literal unity of personhood across the plurality to make the reconciliation meaningful. Lewis's counterpart theory cannot ground this reconciliation; it would render the climax a category mistake. The film posits a metaphysical connection deeper than similarity—a shared soul or consciousness that transcends spatiotemporal isolation.

  In teaching, use the bagel to illustrate the burden of plenitude and the googly eyes for the indexical choice of meaning. But be clear: the film grants the ontology of many worlds but denies the isolation that makes them safe. It offers a moral realism Lewis's ontology struggles to host without causal barriers. The film forces us to ask whether isolation is a metaphysical necessity or a pragmatic shield.

