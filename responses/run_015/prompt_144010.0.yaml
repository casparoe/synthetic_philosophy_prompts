  Friends, neighbors, colleagues.

  Four seasons ago, we came to this mound with questions. Tomorrow, we return the land to the family who has farmed it for generations. Tonight, we share what remains between us.

  To our crew: twenty-two men and women from this village, eleven of you who have been with us since the first shovel broke ground. You taught us how to read the soil here. You kept us safe, fed, and honest. When we found nothing, you worked just as hard as when we found something. That is professionalism. Thank you.

  To the family and the elders: You welcomed us into your home. You told us this place was a shrine. We listened.

  To the Foundation: You funded our work. You asked what we found.

  Here is the truth of the dirt. We found a storeroom. We found clay sealings and hundreds of coarse vessels. We found rooms where serving pots were smashed and buried under floors. We found two burials beneath houses, with modest goods. We found no inscriptions. No images. No foundation deposits. We found nothing made to be read by anyone who was not there.

  My colleague distinguishes between *addressed* deposits—messages left for the future—and *unaddressed* ones—the debris of daily life. By that rule, this mound did not speak to us. It only shows us where people lived, stored, and died.

  So, what do we tell the world? To the Foundation: You funded the recovery of the ordinary. We now know the scale of the economy that sustained this region, even if we cannot name its masters. That is a solid foundation for history.

  To the elders: Our tools cannot prove your history. But archaeology is not the only way to know the past. Your oral history gives this place a name and a meaning our pots cannot measure. The soil is silent, but your memory is not. We leave the mound to you, not as a verified site, but as your heritage.

  To the students: You wanted to move from pots to minds. Today you learned the harder lesson: sometimes the pots refuse to speak. You learned to distinguish what is there from what you wish was there. That discipline is the only thing that makes our silence trustworthy.

  We close the trenches. We backfill the earth. The mound returns to the plow. We take only the knowledge that daily life, unrecorded and unaddressed, is worth remembering.

  Thank you.

  ***

  **Note**

  The speech takes liberties by simplifying the "addressed/unaddressed" distinction for a lay audience, risking oversimplification of institutional ambiguity. It assumes the Foundation accepts "recovering the ordinary" as a press-worthy outcome, which may strain their PR needs.

  The addressed/unaddressed distinction bears significant weight here but likely cracks at the burials. Grave goods are arguably *addressed* to the dead or deities, licensing some claims about belief, yet the speech groups them with "unaddressed" life debris to maintain theoretical consistency. This is a contested archaeological stance.

  Regarding the elders: despite validating their oral history, they will likely hear the refusal to confirm the shrine archaeologically as a denial. Separating "scientific truth" from "historical memory" is generous intellectually but may feel like exclusion socially. Six minutes is barely sufficient to navigate this nuance without sounding evasive; the speech relies on tone to convey respect where words must withhold confirmation. The request is deliverable, but the tension is unavoidable.
