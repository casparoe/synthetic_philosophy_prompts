  Consider a court of five judges deciding whether to enforce a contract. The legal doctrine is fixed in advance and states that a contract is enforceable if and only if it was formed, there was consideration, and there was no duress. This creates a biconditional link between three premises and one conclusion. You are to analyze a specific aggregation rule called the roll-call rule. Under this rule, the reporting judge fixes an order for the issues, known as the roll. The court proceeds down the roll one issue at a time, taking the majority verdict on each issue. However, if a majority verdict on the current issue is inconsistent with the verdicts already taken on previous issues together with the fixed doctrine, the court must take the opposite verdict to maintain consistency. Use the following profile of five judges. Judge one finds formation, consideration, and no duress, and votes to enforce. Judge two finds formation and consideration but finds duress, so votes against enforcement. Judge three finds formation and no duress but no consideration, so votes against. Judge four finds consideration and no duress but no formation, so votes against. Judge five finds formation and consideration but finds duress, so votes against. Note that on each premise there is a majority for the finding that supports enforcement, but on the conclusion there is a majority against enforcement. First, run the roll-call rule on this profile twice, once with the conclusion at the bottom of the roll and once with the conclusion at the top, and state what verdict the court announces and what reason it gives in each case. Second, say which of the following conditions the rule meets and which it violates: universal domain, anonymity, neutrality, independence, and collective consistency. You must argue for each verdict rather than simply ticking labels, including explaining why consistency is guaranteed here and why that guarantee is not much of an achievement. Third, answer whether the rule can ever hand down a verdict on any issue that every single judge rejected; if it can, produce an example, and if it cannot, provide an argument for why not. Fourth, address the crux of the problem: is this rule a solution to the doctrinal paradox, or has it just moved the problem somewhere else, into the hands of whoever sets the roll, and is that better or worse than the discretion a premise-based procedure gives? Finally, discuss the integrity of the reasons given by the court relative to the views of the individual judges, specifically addressing whether the court ends up announcing a reason for a verdict that at most two judges accepted and three explicitly rejected.

  A model answer begins by running the rule with the conclusion at the bottom of the roll, meaning the order is formation, consideration, duress, enforcement. The majority finds formation, consideration, and no duress. These three verdicts are consistent with each other and, under the doctrine, imply enforcement. When the court reaches the conclusion, the majority votes against enforcement. This is inconsistent with the previous verdicts and the doctrine. The rule requires the court to take the opposite verdict. The court announces enforcement. The reason given is the set of premise verdicts: formation, consideration, and no duress. Running the rule with the conclusion at the top means the order is enforcement, formation, consideration, duress. The majority votes against enforcement. There are no previous verdicts, so this stands. The court then votes on the premises. Majorities support formation and consideration, which are consistent with non-enforcement provided duress is found. When the court reaches duress, the majority finds no duress. However, formation, consideration, and no duress imply enforcement, which contradicts the already settled verdict of non-enforcement. The rule forces a flip on duress. The court announces non-enforcement. The reason given is formation, consideration, and duress. Regarding the conditions, the rule meets universal domain because it produces an outcome for any profile of judgments. It meets anonymity because it relies only on majority counts, not judge identities. It violates neutrality because the outcome depends on the order of issues, treating premises and conclusions differently based on position in the roll. It violates independence because the verdict on a later issue depends on the verdicts taken on earlier issues. It meets collective consistency by construction, as the flip mechanism ensures logical coherence. However, this achievement is trivial because consistency is bought by overriding the majority will, potentially severing the link between the court's output and the judges' actual views. On the question of unanimous rejection, the rule cannot hand down a verdict that every single judge rejected, provided the judges are individually consistent with the doctrine. To force a flip on an issue against a unanimous majority, the doctrine and previous verdicts would need to imply the opposite. If all judges reject the verdict, they all vote against it. If they are consistent, they must also vote against any premises that would force that verdict. Thus, the majorities required to trigger the flip could not exist without violating individual consistency. The rule is not a solution to the doctrinal paradox but rather displaces the discretion from the majority to the reporting judge who sets the roll. This is arguably worse than a premise-based procedure, as it concentrates agenda-setting power in a single actor rather than letting the majority determine which issues are decisive. The strongest insight concerns the integrity of the reasons. In the first run, the court enforces the contract citing formation, consideration, and no duress. Only judge one accepts this combination. Judges two and five reject no duress, judge three rejects consideration, and judge four rejects formation. The court thus announces a reason for a four-to-one verdict that at most one judge accepted and four explicitly rejected. The rule buys consistency at the price of making the court say something about its own reasons that is true of none of the people who make it up, effectively institutionalizing a lie about the collective mind.

  The marking scheme is out of twenty points and is built around five must-hit points, each worth four marks. The first point requires the correct execution of the rule for both roll orders, identifying enforcement with premise reasons in the first case and non-enforcement with duress found in the second. Candidates typically get this wrong by failing to apply the flip mechanism on the inconsistent final vote in the first scenario. The second point requires correct classification of the five conditions with argumentation, specifically noting the violation of neutrality and independence. Candidates typically get this wrong by asserting neutrality is met because the rule treats all judges equally, confusing anonymity with neutrality. The third point requires the correct determination that unanimous rejection is impossible under individual consistency, supported by the logical proof regarding constraint propagation. Candidates typically get this wrong by attempting to construct an example profile that inevitably fails due to the consistency constraint. The fourth point requires the analysis that the rule shifts discretion to the roll-setter and a comparative evaluation against premise-based procedures. Candidates typically get this wrong by claiming the rule solves the paradox without acknowledging the concentration of agenda-setting power. The fifth point requires the insight that the court announces reasons rejected by the majority of its members, highlighting the disconnect between collective output and individual belief. Candidates typically get this wrong by focusing only on the verdict outcome and ignoring the justificatory premise set announced by the court.
