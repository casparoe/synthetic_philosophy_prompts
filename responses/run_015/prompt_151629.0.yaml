  4.  **Drafting the Argument (Gibbon's Voice):**
      *   *Opening:* Acknowledge the new tools. Express Enlightenment appreciation for empirical rigor.
      *   *On Exogenous Shocks:* Admit their power. A state cannot tax corpses or harvest ice-bound fields. These are *necessary conditions* for the speed of the collapse.
      *   *On Endogenous Decay:* Maintain that a virtuous state withstands shock better. Rome was already brittle. The plague didn't kill a healthy patient; it killed a terminally ill one.
      *   *On Systems-Collapse vs. Transformation:*
