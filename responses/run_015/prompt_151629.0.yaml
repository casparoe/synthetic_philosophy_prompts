  9.  **Final Polish:** Ensure the rhythm of the sentences mimics Gibbon's balanced, antithetical style. (e.g., "It is not enough to say... one must also consider...")

  *(Self-Correction Note on Dates)*: The prompt asks about the "Western Empire" but cites 536-640 CE. The Western Empire politically ended in 476. However, modern scholarship often views the "Fall" as a process ending later (c. 600-700) with the end of the Mediterranean unity. Gibbon views the Fall as a long decline. I will frame this period as the *final severing* of the roots that had been rotting since Commodus, acknowledging that the political "fall" of 476 was merely a symptom, and the socio-economic "fall" concluded in this later period.

