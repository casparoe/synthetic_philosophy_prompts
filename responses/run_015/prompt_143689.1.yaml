  3.  **Evaluate Pairwise Tensions:**

      *   **1 vs. 2:**
          *   *Tension:* 1 says one-shot = defect. 2 says TFT works. TFT requires repeated interaction.
          *   *Resolution:* Not a contradiction. One-shot vs. Iterated PD (IPD) are different games. 1 addresses the *foundation* (why not cooperate initially?), 2 addresses the *mechanism* (how does it sustain?).
