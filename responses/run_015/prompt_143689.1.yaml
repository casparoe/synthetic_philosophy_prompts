          *   *Verdict:* **High Tension.** 3 claims sufficiency of reciprocity, but 6 shows reciprocity needs *structural help* (assortment) that looks suspiciously like the mechanisms 3 rejects (group structure).

      *   **3 vs. 4:**
          *   *Tension:* 3 says reciprocity explains it. 4 says it's all self-interest.
