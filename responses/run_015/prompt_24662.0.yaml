answer: |-
  This is a sophisticated instinct you're describing. You are right to feel that it occupies a specific niche distinct from lying, denial, or irony. It is a moment of **fractured integration**.

  Since you asked to avoid simply being handed a term, let's dissect the mechanics of the device itself. We can look at it as a conflict between two different systems of knowledge operating within the character at the exact same time.

  ### 1. The Anatomy: Embodied Truth vs. Narrative Truth
  The "lurch" you feel comes from the reader perceiving two simultaneous realities that the character is trying to force into one channel.

  *   **System A (Embodied/Behavioral):** This is the truth written in the body and the actions. The white knuckles, the pacing, the checking of the phone. This system operates on instinct and physiology. It cannot lie. It has already processed the threat and reacted.
  *   **System B (Narrative/Propositional):** This is the truth spoken in language. "I am not worried." This system operates on identity and social presentation. It is trying to maintain a specific story about who the character is (e.g., "I am the kind of person who stays calm").

  In a standard lie, System A and System B are in collusion to deceive a third party. In standard denial, System A is suppressed; the character genuinely does not see the white knuckles.

  In the device you are describing, **System A is fully active and visible, while System B vetoes the *meaning* of System A.** The character is saying, "I acknowledge the data of my body, but I refuse to let that data update my internal story."

  ### 2. Drawing the Boundary Lines
  To understand why this feels different from other devices, we have to look at where the "energy" of the scene is going.

  **Vs. Lying**
  *   **Lying:** The energy is directed *outward*. The character wants the *reader* or another character to believe a falsehood.
  *   **Your Device:** The energy is directed *inward*. The character is often trying to stabilize themselves. If they admit the worry, the dam breaks. The statement isn't for the benefit of the listener; it's a spell the character casts on themselves to keep functioning. The reader knows it's a spell, but they feel the desperation of the casting.

  **Vs. Denial**
  *   **Denial:** The truth is blocked. The character thinks they are calm. The reader sees the tension, but the character does not. There is a gap in awareness.
  *   **Your Device:** The truth is *acknowledged but quarantined*. The character feels the worry (otherwise they wouldn't need to say they don't have it), but they are refusing to grant it legitimacy. It is not "I don't feel this"; it is "I feel this, but it doesn't count."

  **Vs. Self-Deception**
  *   **Self-Deception:** Usually implies a successful trick. The character has convinced themselves.
  *   **Your Device:** The trick is failing. The "lurch" comes from the transparency of the failure. The reader sees the seams. It is the moment *before* self-deception sets in, or the moment it is actively cracking.

  **Vs. Irony**
  *   **Irony:** Relies on a gap in knowledge. (Dramatic irony: The reader knows the bomb is there, the character doesn't).
  *   **Your Device:** Relies on a gap in *acceptance*. The reader and the character both know the bomb is there. The character is simply refusing to run.

  ### 3. The Source of the "Lurch"
  You mentioned the reader feels a specific lurch that isn't about catching a liar. That sensation is the **cost of maintenance.**

  Human beings crave cognitive consistency. When we see white knuckles and hear "I don't care," our brains want to resolve the equation.
  *   If they are lying, the equation resolves: They care.
  *   If they are in denial, the equation resolves: They don't know they care.

  When they do both, the equation stays open. The reader's brain unconsciously simulates the energy required to hold that door shut against the pressure of the water on the other side. You feel the *strain*. It creates a sense of impending collapse. It signals to the reader: *This character is currently expending more energy on suppression than on action.*

  ### 4. The Problem of Time (Why it works for the "Now")
  You asked why this doesn't work as well for the distant past or other people. This is crucial.

  **Physiology is Always Present Tense.**
  White knuckles, a check of the pulse, a glance toward the door—these are physiological events. They happen *now*. The body cannot remember a threat in the same way it reacts to one. You can lie about the past ("I didn't love him") without your body betraying you, because the body isn't currently processing that love.

  When the fact is about the distant past, the conflict is purely memory vs. narrative. That is intellectual. When the fact is about the immediate present, the conflict is **biology vs. narrative.** Biology is harder to argue with.

  **Agency and Control.**
  This device works best when the character is trying to assert agency over an involuntary reaction.
  *   *Past:* "I wasn't scared when the bear attacked me." (This sounds like bragging or memory distortion).
  *   *Present:* "I'm not scared" (while shaking). (This sounds like a struggle for control).

  The "lurch" depends on the reader seeing the character losing a fight against their own nervous system. If the threat isn't immediate, the nervous system isn't engaged, and the tension evaporates.

  ### 5. Philosophical and Psychological Anchors
  While I won't give you a single label to paste on this, knowing where this lives in other fields might help you map the edges.

  **Disavowal (Psychoanalysis/Philosophy)**
  There is a formulation by the philosopher Octave Mannoni, often cited in psychoanalysis: *"I know very well, but still..."* (Je sais bien, mais quand même).
  This is distinct from denial. In denial, I don't know. In disavowal, I know the fact is true, but I refuse to let it change my symbolic reality. A classic example is a child who knows Santa isn't real but *still* leaves out cookies. They hold the knowledge and the ritual simultaneously. In your novel, the character knows they are worried, but *still* asserts calm to maintain their identity.

  **Bad Faith (Existentialism)**
  Jean-Paul Sartre described "Bad Faith" as lying to oneself to escape the burden of freedom. However, your device is slightly different. Sartre's concept is often moralistic. Your device is more mechanical—it's about the friction between *facticity* (the facts of the body/situation) and *transcendence* (the story the character tells about themselves).

  **Propositional vs. Non-Propositional Knowledge**
  In epistemology (the study of knowledge), there is a distinction between knowing *that* something is the case (propositional) and knowing *how* to do something or experiencing it (non-propositional/acquaintance).
  Your character is admitting the non-propositional truth (the shaking hands) while denying the propositional truth ("I am worried"). The lurch happens because the reader knows the non-propositional truth is the "realer" one.

  ### 6. When the Device Fails (The Edge Cases)
  You mentioned you sometimes reach for it when you don't mean to. Here is how to tell if you are misusing it:

  **1. The "Tell" is too subtle.**
  If the white knuckles are mentioned three pages later, the simultaneity is lost. It becomes a reveal ("Aha, they were worried!"). For the lurch to work, the contradiction must be in the same breath. The body must speak *while* the voice speaks.

  **2. The Stakes are too low.**
  If the character says "I don't like cake" while eating cake, it's whimsy. If they say "I'm not dying" while coughing blood, it's tragedy. The "refusal to accept" must carry a cost. If accepting the truth wouldn't change anything, the refusal feels petulant, not poignant.

  **3. It becomes a tic.**
  If every character does this in every chapter, the reader becomes desensitized to the tension. It stops feeling like a fracture and starts feeling like the character's normal language. This device relies on the rupture of the norm.

  ### Summary for Craft
  You are writing **Somatic Dissonance.**

  It is the moment where the character's biology has moved on to the next stage of grief/reaction, but their identity is stuck in the previous one. They are dragging their "self" behind their "body."

  *   **Don't use it** if you want the reader to trust the character's self-assessment.
  *   **Don't use it** if you want the character to appear in control.
  *   **Do use it** when you want to show that a truth has become too large to be contained by the character's current understanding of themselves, but they aren't ready to shatter yet.

  The "lurch" is the reader feeling the character's structural integrity bending. It is a promise that a breakdown (or a breakthrough) is coming, because no one can hold the fact and the refusal forever.
