      *   *Akasia (Weakness of Will):* Knowing the good/right but doing the wrong. Related, but more ethical than emotional.
      *   *Splitting/Dissociation:* Psychological terms. A bit clinical.
      *   *Irony:* Dramatic irony is the reader knowing more than the character. Here the reader knows the character knows.
      *   *Performative Contradiction:* Saying one thing while doing another.
