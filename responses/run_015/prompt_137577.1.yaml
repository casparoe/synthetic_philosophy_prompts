  The single feature driving the Nomic failure is **discretion** (the constitutive requirement that the agent *could have done otherwise*). The act of "waiving" is conceptually parasitic on the existence of a genuine choice. If you delete this feature—changing the maxim to "I will follow a fixed rule that exempts agents in cases of external circumstance"—the Nomic contradiction vanishes. In that case, the Nomic reading becomes permissive (a law of nature where exceptions are automatic is coherent), but the Statutory reading *also* becomes permissive. The gap closes, and the case collapses into a standard rule-utilitarian calculation rather than a Kantian contradiction. The verdict flip depends entirely on the maxim explicitly requiring *choice* as part of the action type.

