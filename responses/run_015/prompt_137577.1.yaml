  Imagine it is a law of nature that managers *necessarily* waive the penalty whenever external circumstances are present, just as gravity acts on mass. Here, the "waiver" is no longer an exercise of discretion; it is a mechanical output triggered by conditions. The concept of "granting an exception" logically presupposes the power to *not* grant it (the authority to enforce). If nature necessitates the waiver, the authority to enforce is removed, and the act ceases to be "leniency" and becomes "automatic exemption." The maxim commands me to *exercise discretion*, but the Nomic world makes discretion impossible. The action type dissolves into a contradiction: one cannot choose to do what one is determined by nature to do. The maxim fails.

