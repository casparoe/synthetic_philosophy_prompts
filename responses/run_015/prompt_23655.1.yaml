answer: |-
  This is a promising start, but there are some significant conceptual issues in the draft that need to be addressed before the tension you identify can be properly evaluated. Specifically, there is a definition error regarding supererogation, a terminological ambiguity regarding "moral residue," and a potential false dichotomy in your analysis of the tension.

  Here are detailed comments on the draft, organized by conceptual accuracy, the validity of the tension, and missing literature.

  ### 1. Critical Definition Error: The "Blame" Condition
  Your definition of the Moral Residue Account contains a logical contradiction regarding the nature of supererogation.
  *   **Your Draft:** "...a reason for blame if not performed."
  *   **The Problem:** By standard philosophical definition, a supererogatory action is **optional**. If an agent is blameworthy for *not* performing an action, that action is **obligatory**, not supererogatory.
  *   **Correction:** You should remove "blame" from the definition. The residue of supererogation is typically characterized by *praise* if performed, and perhaps a lack of praise (or a specific kind of regret that doesn't imply fault) if omitted. If you include blame, you have defined obligation, not supererogation.

  ### 2. Terminological Note: "Moral Residue"
  *   **Standard Usage:** In moral philosophy (e.g., Bernard Williams, Margaret Urban Walker, Tessman), "moral residue" is almost exclusively used to describe the negative psychological or normative aftermath of **moral dilemmas** or **tragic choices** (e.g., feeling guilt after having to choose the lesser of two evils).
  *   **Your Usage:** You are using it to describe the positive normative status of going above and beyond.
  *   **Recommendation:** While you can stipulate your own definition, be aware that this is non-standard. You might consider using terms like **"special praiseworthiness,"** **"normative surplus,"** or **"positive reactive attitudes."** If you stick with "residue," explicitly acknowledge that you are diverging from the standard "dilemma" usage to avoid confusing readers familiar with the Williams/Tessman literature.

  ### 3. Is the Tension Real?
  You argue that there is a tension because the Residue Account grounds supererogation in a *moral property*, while the Marginal Principle grounds it in a *non-moral property* (alternatives). **This dichotomy is likely false, which weakens the tension.**

  *   **Alternatives are Morally Relevant:** The Marginal Principle (often associated with Paul McNamara or David Heyd) does not rely on "non-moral" properties. It relies on **cost**, **sacrifice**, and **risk**. These are morally weighty facts. The principle states that an action becomes supererogatory when the moral good it produces is outweighed (for the agent) by the personal cost required to achieve it.
  *   **Reconciliation:** The two accounts are not necessarily in tension; they address different questions.
      *   *Residue Account:* Describes the **normative reaction** (How should we feel/judge?).
      *   *Marginal Principle:* Describes the **threshold conditions** (When does duty stop and supererogation begin?).
      *   *Synthesis:* An action generates a "residue" of praise *because* it exceeds the marginal limit of what is required given the cost.

  ### 4. Missing Standard Objections and Literature
  If you are writing on this topic, you are engaging with the **Paradox of Supererogation** (J.O. Urmson). You should explicitly reference this, as your tension is essentially a restatement of it.

  *   **The Paradox:** If morality is about producing the best outcome (Maximization), then the best action is obligatory. If the best action is optional, morality seems arbitrary.
  *   **The "Cost Ceiling" Response:** The standard response to your tension is that obligation has a cost ceiling. The Marginal Principle *explains* why the "moral goodness" (Residue) doesn't translate to obligation. It's not that the goodness is unexplained; it's that the *cost* blocks the transition from "good" to "required."
  *   **David Heyd:** Heyd (*Supererogation: Its Status in Ethical Theory*) is the standard reference for the view that supererogation is defined by its exclusion from duty despite being good. He argues it is a "value" that is not a "requirement."
  *   **Paul McNamara:** He discusses the "margin of discretion." He would argue that the Marginal Principle *is* a moral principle, not a non-moral one.

  ### 5. Specific Suggestions for Revision

  **A. Fix the Definition**
  > *Current:* "...reason for blame if not performed."
  > *Revision:* "...reason for special praise if performed, and a reason for a specific type of regret (without blame) if not performed."

  **B. Refine the Tension Argument**
  Instead of claiming the Marginal Principle uses "non-moral properties," frame the tension as one between **Value** and **Requirement**.
  > *Revised Tension:* The Moral Residue Account emphasizes the *axiological* status of the act (it is very good). The Marginal Principle emphasizes the *deontic* status (it is not required). The tension is not Moral vs. Non-Moral, but rather: **Why does high moral value not always entail deontic requirement?**

  **C. Address the "Why isn't it obligatory?" Question**
  You ask: *"If it is morally good, why isn't it obligatory?"*
  You should note that this premise assumes **Moral Maximization** (Utilitarianism). Most accounts of supererogation explicitly reject Maximization in favor of **Satisficing** or **Prerogatives** (Samuel Scheffler). The "Marginal Principle" is essentially a description of where the prerogative kicks in.

  ### Summary of Feedback
  1.  **Remove "blame"** from the definition of supererogation immediately; it invalidates the concept.
  2.  **Clarify "Moral Residue"** terminology to avoid confusion with dilemma literature.
  3.  **Reframe the tension:** It is not Moral vs. Non-Moral properties. It is about the relationship between *Goodness* and *Obligation*.
  4.  **Cite Urmson and Heyd:** You are walking into a well-trodden debate; acknowledge the "Paradox of Supererogation."
  5.  **Conclusion:** The tension is real, but your formulation of it (Moral vs. Non-Moral) is the weak link. If you correct that, you will have a much stronger philosophical puzzle to solve.

