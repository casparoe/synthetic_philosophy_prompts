      *   **The Human Stake (Normative):** Why does Self-Description matter? It's not PR; it's *continuity of meaning*.
          *   *Use Example:* Maya. The cities were abandoned (Ceiling drop), but Maya people remained (Self-description held). Is that collapse? Archaeologists say "Classic Collapse," Maya say "Transformation." The stake is *who owns the narrative*.
