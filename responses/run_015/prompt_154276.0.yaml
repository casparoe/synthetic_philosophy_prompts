      *   *The "Self-Description" Metric:* This is about identity, continuity, ideology.
      *   *The Normative vs. Descriptive:* This is the crux. "Collapse" implies failure/bad. "Transformation" implies neutral/evolution.
      *   *The Stake:* Why do we care? Because "collapse" triggers a specific moral and analytical response (prevention, warning) whereas "transformation" suggests adaptation.
      *   *The User's Intuition:* They feel (2) is collapse and (1) isn't, but struggle to justify why identity matters more than complexity.
