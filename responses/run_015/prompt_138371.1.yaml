          *   Case 7 (Dilation/Value of Info): User accepts dilation but rejects declining free evidence. Tension between epistemic and pragmatic rationality.
          *   Case 8 (Stakes): Doxastic state is identical, but action rules change. UT is purely doxastic.
          *   Case 9 (Laundering/Calibration): Publishing a point doesn't change belief, but scoring *does* over time. UT doesn't account for learning via feedback.

  3.  **Develop a Refined Principle:**
      *   The core issue is distinguishing *epistemic indeterminacy* (the world/evidence doesn't fix a value) from *social/procedural indeterminacy* (we don't know which expert to trust).
      *   Also, need to separate *Belief* (Doxastic) from *Action* (Decision). The User's Case 8 highlights this.
      *   *Proposal:* **The Source-Sensitive Admissibility Principle (SSAP).**
      *   *Core Idea:* An interval is required when the set of *epistemically live* probability functions (representing distinct, undefeated hypotheses about the generating mechanism) does not converge to a singleton.
      *   *Crucial Distinction:* "Admissible Sharpening" needs to be defined not just by logical consistency with evidence, but by *source independence* and *mechanism specificity*.
      *   *Addressing Case 4/5/6:* Expert opinions are *evidence about the evidence*, not direct evidence about the event. If experts disagree fundamentally on mechanism, the interval spans them. If one withdraws (Case 5), the space of live mechanisms shrinks. If a precise expert joins (Case 6), but the fundamental mechanism dispute remains among the others, the interval shouldn't collapse unless the new expert *defeats* the others' mechanisms.
      *   *Addressing Case 8 (Stakes):* This requires a decision rule *on top* of the belief state. E.g., Levi's E-admissibility or Maximin. The principle should explicitly separate *Representation* (Interval) from *Selection* (Decision Rule).
      *   *Addressing Case 9 (Scoring):* Scoring provides *new evidence* (calibration data). It's not laundering; it's learning.

  4.  **Drafting the Principle (Iterative Refinement):**
      *   *Attempt 1:* Use intervals when experts disagree. (Too simple, fails Case 2).
      *   *Attempt 2:* Use intervals when the *causal structure* is underdetermined. (Better).
      *   *Attempt 3 (Final Polish):* **The Mechanism-Relative Indeterminacy Principle (MRIP).**
          *   *Condition 1 (Epistemic):* Assign a sharp credence $p$ only if all *live causal hypotheses* compatible with your evidence entail $p$ (or a known mixture entailing $p$).
          *   *Condition 2 (Social/Evidential):* Treat expert models as *hypotheses about the mechanism*, not direct readings of truth. Disagreement implies competing mechanisms.
          *   *Condition 3 (Action):* Decision rules must respect the interval bounds when stakes are high (Maximin/Minimax Regret), but can use point estimates (e.g., midpoint) when stakes are low/robust.

      *Wait, I need to stick closer to the User's "Underdetermination Test" structure.*
      Let's modify UT to **UT+**.
      *   *UT+:* Credence is an interval $[l, u]$ iff the set of *probability functions compatible with your total evidence* has a convex hull wider than a point, *and* there is no higher-order probability distribution over those functions that is itself justified by evidence.
      *   *Correction on Case 4:* Why not average? Because averaging assumes the experts are sampling from a known distribution of accuracy (Case 2). In Case 4, we don't know the distribution of expert reliability.
      *   *Correction on Case 6:* Why doesn't the precise expert narrow it? Because one precise data point doesn't resolve the structural disagreement of the others unless we have a meta-model of expert reliability.
      *   *Correction on Case 8:* This isn't about the interval; it's about the *decision rule*. The principle should govern the *interval*, not the *choice*. I need to tell the user that their intuition in Case 8 is actually about *Decision Theory*, not *Epistemology*. The interval stays the same; the *allowable action set* shrinks.

  5.  **Addressing the Specific Cases (Mental Check):**
      *   1 (Ellsberg): UT+ works. Known structure (1/3) vs Unknown structure (B/G).
      *   2 (Known Bias): UT+ works. Known chance function = sharp.
      *   3 (Unknown Coin): UT+ works. No constraints = [0,1].
      *   4 (Disagreement): UT+ needs to treat experts as *constraints*. If experts are "epistemic peers," their outputs define the bounds of live hypotheses. Averaging requires a meta-justification we lack.
      *   5 (Withdrawal): One constraint removed -> Bounds shrink. Consistent.
      *   6 (Addition): One constraint added *inside* the bounds. Does it narrow? If the new expert is just another hypothesis, the hull remains defined by the extremes (0.20, 0.70). The precise expert is just a point inside the hull. The hull only shrinks if the extremes are challenged. *This explains the asymmetry.*
      *   7 (Gauge/Dilation): This is standard dilation. The principle should acknowledge that *conditionalizing* on the instrument status changes the set of live functions. Refusing info is pragmatically irrational even if epistemically it widens the interval.
      *   8 (Stakes): Separate Belief from Action. The interval is stable. The *decision rule* shifts from "any point in interval" (low stakes) to "safe across interval" (high stakes).
      *   9 (Laundering/Scoring): Publishing is pragmatic. Scoring is *learning*. Scoring provides feedback on calibration, which updates the meta-belief about the models, eventually justifying a sharp credence (convergence).

  6.  **Addressing the Unlisted Cases:**
      *   *Panel grows to 10 modellers in [0.30, 0.35]:* Does the interval shrink? Under UT+, the interval is the convex hull of *live hypotheses*. If the original 3 are still "live" (not discredited), the hull stays [0.20, 0.70]. If the weight of evidence suggests the original 3 are outliers/error, they drop out. *Verdict:* Interval stays until the original models are *defeated*, not just outnumbered.
      *   *Gauge 50/50:* Dilation is strongest here. Interval widens maximally. Value of info calculation must include the potential to *sharpen* later.
      *   *Scoring switched off:* Intervals return if the *reason* for sharpness was solely the scoring feedback (calibration). If the sharpness came from underlying data, it stays. Likely they revert to intervals because the meta-evidence (calibration) is no longer being updated.

  7.  **Identifying Weak Points (Self-Correction):**
      *   Where is this reasoning fragile? The definition of "Live Hypothesis." When do we discard an expert? (Case 4/6 tension).
      *   The distinction between "Unknown Chance" (Case 3) and "Expert Disagreement" (Case 4) is often blurred in practice.
      *   The "Stakes" separation might feel unsatisfying to a risk manager who wants the *risk assessment* to reflect the stakes (though technically that's wrong, risk = prob * impact).
      *   *Biggest Risk:* The principle might be too permissive about keeping intervals wide (conservatism bias).

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication. Validate the tension.
      *   **The Repaired Principle:** "The Live-Hypothesis Hull Principle" (LHHP). Refine UT.
      *   **Case-by-Case Analysis:** Walk through 1-9 showing how LHHP handles them. Highlight where the user must overturn a verdict (likely Case 6 or 9).
      *   **Unlisted Cases:** Answer the three specific questions.
      *   **Uncertainty/Limits:** Where the principle might fail (e.g., defining "defeat" for experts).
      *   **Conclusion:** Summary of the trade-off.

  9.  **Refining the "Case 6" Asymmetry:**
      *   User says: Removing a modeller narrows (Case 5). Adding a precise one *doesn't* (Case 6).
