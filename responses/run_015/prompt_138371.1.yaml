      *   *Explanation:* The interval represents the *range of defensible positions*.
      *   Case 5: A defensible position (0.70) is removed. Range shrinks.
      *   Case 6: A new defensible position (0.30-0.34) is added *inside* the existing range. The *bounds* (0.20 and 0.70) are still defensible. Therefore, the hull doesn't shrink.
      *   *Critique:* Is 0.70 still defensible if 10 people say 0.30? Eventually no. But with just 1 vs 3? Yes.
      *   *Verdict:* The principle holds, but requires a threshold for "defeatability."

  10. **Refining Case 9 (Scoring):**
      *   User says: Scoring makes intervals disappear (genuine improvement).
      *   Principle: Scoring provides *second-order evidence* of reliability. Over time, this collapses the set of live hypotheses to the best-calibrated one.
      *   If scoring stops: Do intervals return? If the *calibration* was the only thing justifying sharpness, yes. If the underlying physics became clear, no.
      *   *Advice:* Treat scoring as evidence, not just administrative pressure.

  11. **Final Polish:** Ensure tone is collaborative but authoritative. Use the user's terminology ("sharpening," "credence"). Make sure the "Overturn" section is clear. (I suspect Case 6 is the weakest link in their intuition—if the new modeller is truly independent and precise, ignoring them is stubborn, but logically consistent with a "hull of defensible views" model). Actually, I should challenge Case 8 slightly: The *interval* shouldn't change, but the *reporting* might need to reflect decision-sensitivity. No, keep it clean: Belief vs Action.

      *Self-Correction on Case 6:* The user says "I do *not* narrow... I stay roughly at [0.20, 0.70]." My principle supports this *if* the original models remain "live." But if the new model is *equally credentialed*, why do the old ones remain fully live?
      *Adjustment:* The principle needs a clause on *weight*. If the new evidence (modeller 4) doesn't *falsify* modellers 1-3, they remain live. Mere disagreement isn't falsification. This supports the user's verdict.

      *Self-Correction on Case 9:* User says "I find I no longer have intervals... inclined to call that a genuine improvement."
      *Principle:* This is *learning*. The interval collapses because the evidence (scores) selects one sharpening over time.
      *If scoring stops:* The evidence stream stops. Uncertainty returns *unless* the underlying process was learned. I should predict intervals might creep back if the environment is non-stationary.

      *Let's finalize the Principle Name:* **The Defensible-Hull Principle (DHP).**
      *   Credence is the convex hull of probabilities assigned by all *undefeated, epistemically live hypotheses* (including expert models treated as hypotheses).
      *   Sharpness arises only when the hull collapses to a point (either by logical necessity or evidential defeat of alternatives).
      *   Action rules are separate (E-admissibility).

      *Wait, one more thing:* Case 7 (Dilation). The user says "declining free evidence is never epistemically rational." But they admit they'd pay not to open the envelope.
      *Resolution:* This is a conflict between *Epistemic Rationality* (maximize accuracy) and *Pragmatic Rationality* (maximize utility). Dilation makes the epistemic state worse (wider) but the pragmatic state better (option to act on info). The principle should clarify that intervals measure *epistemic* state, not *pragmatic* value.

