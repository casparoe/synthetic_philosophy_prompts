answer: |-
  Your instincts are excellent. The first half of that encyclopedia entry is historically and philosophically sound; the second half commits significant errors regarding Anscombe's actual moral theory, specifically concerning the Doctrine of Double Effect (DDE) and the metaphysics of intention.

  If you publish the paragraph as written, a knowledgeable reader (particularly one familiar with Catholic moral philosophy or Anscombe scholarship) will spot the errors immediately. They undermine the credibility of the piece precisely where it tries to be most profound.

  Here is an accuracy audit, claim-by-claim, followed by a detailed breakdown of your three specific questions.

  ### Part 1: Claim-by-Claim Accuracy Audit

  **1. "Anscombe's objection was not a pacifist objection to war, or even to aerial bombing as such."**
  *   **Verdict:** **Accurate.**
  *   **Notes:** Anscombe was not a pacifist. She supported Britain's involvement in WWII. Her objection was to *unjust* methods (specifically the intentional killing of non-combatants), not war *per se*.

  **2. "Murder, for her, is not defined by the horror or scale of a killing but by the intentional killing of the innocent."**
  *   **Verdict:** **Accurate.**
  *   **Notes:** This is the core of her natural law ethics. The moral species of an act is determined by the intention, not the consequences.

  **3. "The inhabitants of Hiroshima and Nagasaki were innocent in the relevant sense: they were not combatants and were not supplying Japan's war effort."**
  *   **Verdict:** **Accurate (with minor nuance).**
  *   **Notes:** Anscombe argued that "innocence" in war means "not engaged in hostilities." She rejected the idea that working in a munitions factory automatically made one a combatant (a view held by some contemporaries), but her primary focus in the Truman pamphlet was on the general population being targeted *as* population.

  **4. "The United States killed them deliberately, as a means of forcing Japan to surrender."**
  *   **Verdict:** **Accurate.**
  *   **Notes:** This captures her analysis of the *strategic intent*. She argued the destruction of morale (via civilian death) was the mechanism of surrender.

  **5. "The defense that Truman only signed a piece of paper is like saying the man who hires an assassin has not killed anyone."**
  *   **Verdict:** **Accurate.**
  *   **Notes:** Anscombe emphasized formal cooperation and command responsibility.

  **6. "Anscombe's distinction is between combatants and noncombatants, not between people who are dangerous at a given moment and people who are not."**
  *   **Verdict:** **Accurate.**
  *   **Notes:** This is a crucial point. Liability to attack is based on *role* (combatant status), not immediate *threat* (sleeping soldiers are still combatants).

  **7. "Her deepest objection, however, was to the doctrine of double effect."**
  *   **Verdict:** **Misleading / Inaccurate.**
  *   **Notes:** Anscombe was a Thomist; the Doctrine of Double Effect is central to Thomistic ethics. She did not object to the doctrine itself. She objected to the **sophistical misuse** of the doctrine by Catholic commentators who were trying to justify the bombing. She argued the bombing *failed* the conditions of DDE, not that DDE was invalid.

  **8. "If the deaths are foreseen, she held, they are intended; intention just is what you accept will happen."**
  *   **Verdict:** **Simply Wrong.**
  *   **Notes:** This is the most damaging error in the paragraph. Anscombe spent her career *defending* the distinction between intended and merely foreseen consequences. Her 1957 book *Intention* (published shortly after the Truman protest) is largely dedicated to clarifying this distinction. She argued that in Hiroshima, the deaths were *intended* (as a means to an end), not merely foreseen. She did **not** believe that all foreseen consequences are intended.

  **9. "So the bombings were murder even if the crews were aiming at military objectives and merely foreseeing civilian deaths."**
  *   **Verdict:** **Misleading.**
  *   **Notes:** Anscombe's argument was that the crews were *not* merely foreseeing civilian deaths; they were aiming at the cities *to* kill civilians (to break morale). The encyclopedia entry suggests she thought the distinction didn't matter; she thought the distinction mattered immensely, and that the US had crossed the line into intention.

  **10. "It implies that any use of a nuclear weapon... and any willingness to keep a nuclear arsenal as a threat is murder..."**
  *   **Verdict:** **Overreach / Category Error.**
  *   **Notes:** While Anscombe opposed nuclear deterrence, calling a *threat* or *possession* "murder" is imprecise in her framework. Murder is an *act* of killing. A threat involves a *conditional intention*. She would call the intention wicked and the threat unjust, but conflating the threat with the act of murder muddies her precise moral vocabulary.

  ---

  ### Part 2: Deep Dive on Your Three Questions

  #### 1. Did she equate foresight with intention?
  **No.** The encyclopedia entry attributes a view to Anscombe that she famously argued *against*.

  *   **The Encyclopedia's Claim:** "Intention just is what you accept will happen." (This is a consequentialist or utilitarian view of intention).
  *   **Anscombe's Actual View:** Intention is defined by the description under which an action is chosen. If I bomb a factory to stop production, and I know workers next door will die from the blast, their deaths are *foreseen* but not *intended* (provided I am not killing them to achieve my goal). However, if I bomb a city *to* kill the workers to demoralize the government, their deaths are *intended*.
  *   **The Audit:** Anscombe argued that the Truman administration (and the Catholic apologists for them) were lying about the intention. They claimed they were aiming at military targets (factories) and foreseeing civilian death. Anscombe argued the strategic reality was that they were aiming at civilian morale *via* civilian death. Therefore, it was intentional killing. She did not collapse the distinction; she policed it.

  #### 2. Is the combatant/non-combatant distinction a status distinction?
  **Yes.** The encyclopedia gets this right.

  *   **The Nuance:** In modern "liability" theories of war (common in contemporary analytic philosophy), a person is liable to attack if they pose a threat. Anscombe held a traditional "status" view. A soldier is liable to attack because he is a soldier (a combatant), even if he is sleeping, unarmed, or momentarily harmless. A civilian is immune from direct attack because she is a civilian, even if she works in a factory that supports the war.
  *   **Why it matters:** This supports the claim that Hiroshima was murder. The victims were non-combatants by status. Targeting them directly violates the immunity granted by that status, regardless of their contribution to the war economy.

  #### 3. Does her argument generalize to nuclear deterrence and arsenal maintenance as "murder"?
  **No, not strictly as "murder."** This is where the encyclopedia entry overextends.

  *   **The Problem:** Murder is the *execution* of an unjust killing. Deterrence is a *conditional threat* ("If you do X, I will do Y").
  *   **Anscombe's View on Conditional Intentions:** Anscombe was deeply suspicious of conditional intentions to do evil. In her later essays (e.g., "War and Murder," 1961), she argued that forming the intention to kill innocents *if* a condition is met corrupts the will. It makes the agent the kind of person who would commit murder.
  *   **The Correction:** A careful defender would say: Maintaining a nuclear arsenal for the purpose of deterrence involves a **conditional intention to commit murder**. It is not murder itself (until the button is pressed), but it is a grave moral evil because it involves holding oneself ready to violate the absolute prohibition against killing the innocent.
  *   **Why the distinction matters:** If you call the threat "murder," you lose the ability to distinguish between the politician who maintains the deterrent and the pilot who drops the bomb. Anscombe cared about these distinctions. She would call the policy *unjust* and the intention *wicked*, but she would likely reserve "murder" for the actual killing.

  ### Part 3: Suggested Correction for Your Piece

  If you want to preserve the punch of the encyclopedia entry without the philosophical errors, you need to adjust the second half. You need to show that Anscombe didn't abolish the distinction between foresight and intention, but rather argued that the bombers had *failed* to honor it.

  **Here is a draft of how you might correct the closing section:**

  > "Her deepest objection was to the sophistical misuse of the Doctrine of Double Effect. This doctrine permits causing harm as a foreseen side-effect of a good action, provided the harm is not intended as a means or an end. Catholic moralists had argued that the bombings were permissible: the target was military, and civilian death was merely foreseen. Anscombe regarded this as a lie about the facts of intention. The strategy was to break Japan's will by destroying its cities; the civilian deaths were not side-effects, they were the instrument. Thus, the bombings violated the absolute prohibition on intentional killing.
  >
  > This logic cast a long shadow over the Cold War. If the intentional killing of innocents is always murder, then a policy of nuclear deterrence—which relies on the conditional intention to destroy cities—is morally corrupt, even if the weapon is never fired. For Anscombe, to hold oneself ready to commit murder is to already inhabit a wicked moral space. Her pamphlet did not just condemn a past act; it challenged the very coherence of a peace kept by the threat of mass murder."

  ### Summary of Changes
  1.  **Restored DDE:** Clarified she used DDE to condemn the bombing, not that she rejected DDE.
  2.  **Clarified Intention:** Changed "foresight equals intention" to "the strategy made the deaths the *instrument*, therefore they were intended."
  3.  **Refined Deterrence:** Changed "deterrence is murder" to "deterrence involves a conditional intention to murder," which is morally corrupting but linguistically precise.

  ### Recommended Sources for Verification
  If you need to double-check these points before publication, these are the primary texts:
  1.  **G.E.M. Anscombe, "Mr. Truman's Degree" (1956).** (The pamphlet itself).
  2.  **G.E.M. Anscombe, *Intention* (1957).** (Specifically the sections on "Intention vs. Foresight").
  3.  **G.E.M. Anscombe, "War and Murder" (1961).** (Found in *Nuclear Weapons: A Catholic Response*, or her *Collected Philosophical Papers Vol. III*). This essay clarifies her views on deterrence and conditional intentions.
  4.  **Roger Teichmann, *The Philosophy of Elizabeth Anscombe* (2008).** (Excellent secondary source on her ethics of war).

  The encyclopedia entry you found is a classic case of a summary that gets the *vibe* right (Anscombe was tough on Truman and nukes) but botches the *mechanics* (her specific theory of action). Your skepticism was well-founded.
