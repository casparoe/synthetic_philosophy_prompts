          *   **Fact Check:** **FALSE/MAJOR ERROR.** This is the biggest philosophical error in the paragraph. Anscombe *defended* the distinction between intended and foreseen consequences (DDE). She argued that in area bombing, the deaths *were* intended (as a means to demoralize/force surrender), not merely foreseen side effects. She did *not* collapse foresight into intention universally. She believed intention is about the *description under which the action is chosen*.
