  # Take-Home Exercise: Evolutionary Debunking and Moral Contingency

  **Course:** Metaethics (PHL304)  
  **Topic:** Evolutionary Debunking Arguments  
  **Word Limit:** Approximately 500 words  
  **Marks:** 20  

  **Prompt:**  
  Consider two isolated forager bands, Band A and Band B. Band A evolved an intuition that food must be shared equally with non-kin. Band B evolved an intuition that food need not be shared equally with non-kin. In both ecologies, these respective intuitions promoted survival. Members of both bands regard their intuition as tracking objective moral truth.

  1.  Reconstruct how an evolutionary debunker uses this contingency to challenge the reliability of these moral beliefs.  
  2.  Evaluate whether appealing to the survival value of cooperation rescues the reliability of these beliefs or merely restates the evolutionary explanation.

  ***

  # Model Answer

  The evolutionary debunker challenges moral realism by arguing that natural selection shapes moral intuitions primarily for adaptive fitness, rather than for tracking objective truth. In this case, the contingency of ecological pressures is decisive. Band A evolved equal-sharing intuitions, while Band B evolved restrictive intuitions; both strategies enhanced survival in their respective environments. The debunker argues that because these contradictory beliefs are fully explained by adaptive needs, they are insensitive to objective moral facts. This relies on a counterfactual claim: if the moral facts were different, but the survival pressures remained, the bands would hold the same beliefs. Thus, the causal genealogy screens off the truth. Since both bands claim objectivity despite holding incompatible beliefs driven by fitness, the debunker concludes their moral faculties are unreliable guides to independent moral reality. The divergence shows that belief formation is responsive to ecology, not morality.

  Evaluating the response that appeals to the survival value of cooperation reveals significant weaknesses. Proponents might argue that if cooperation promotes survival, and survival is valuable, the beliefs are reliable. However, the case stipulates that *opposing* intuitions (sharing vs. not sharing) both promoted survival. Therefore, survival value cannot determine which moral belief is true; it merely explains the causal origin of both. To claim the survival-conducive belief is true conflates fitness with moral truth. Unless one adopts a reductionist view where 'good' simply means 'adaptive,' the evolutionary explanation remains orthogonal to moral justification. The realist needs a link between fitness and mind-independent truth, not just fitness and belief.

  Furthermore, this appeal often merely restates the evolutionary explanation rather than rescuing reliability. Stating "we believe X because it helped us survive" accepts the debunker's premise that fitness drives belief. For reliability to be rescued, one must demonstrate a link between fitness and independent moral truths (a 'third-factor' explanation). Yet, given the contradictory outcomes in Bands A and B, there is no single moral truth being tracked across contexts. If sharing is objectively true, Band B's survival-successful intuition is false, yet evolved similarly. The appeal to survival value fails to establish that the intuitions reflect objective morality; it only reinforces that they reflect adaptive pressure. Consequently, the response does not show that the beliefs track truth rather than fitness. The debunker's challenge stands: the beliefs are explained by contingent fitness needs, leaving no epistemic room for truth-tracking reliability. The appeal to survival value ultimately collapses into the very genealogical explanation that undermines objectivity, failing to bridge the gap between 'is adaptive' and 'is true'.

  ***

  # Marking Scheme (20 Marks Total)

  ### Part 1: Reconstructing the Debunker (10 Marks)
  *   **Contingency & Divergence (3 marks):**  
      *   3: Clearly identifies that different ecologies produced contradictory intuitions (sharing vs. not sharing).  
      *   1-2: Mentions evolution but misses the significance of the *conflict* between bands.  
      *   0: Fails to mention the evolutionary cause.
  *   **Causal Mechanism (3 marks):**  
      *   3: Explains that beliefs are caused by fitness pressures, not moral facts (genealogy screens off truth).  
      *   1-2: Vague reference to evolution shaping beliefs without mentioning the exclusion of truth.  
      *   0: Claims evolution proves morality is real.
  *   **Reliability/Insensitivity Conclusion (4 marks):**  
      *   4: Concludes that beliefs are unreliable/insensitive (would persist even if moral facts differed).  
      *   2: Concludes beliefs are false (incorrect; debunking targets justification/reliability, not necessarily truth).  
      *   0: No conclusion on reliability.

  ### Part 2: Evaluating the Survival Response (10 Marks)
  *   **Identify the Rescue Attempt (2 marks):**  
      *   2: Identifies the argument that survival value might justify the belief (fitness as proxy for truth).  
      *   0: Fails to identify the proposed response.
  *   **Critique: Conflict & Truth (4 marks):**  
      *   4: Argues that since *opposing* beliefs both aided survival, survival cannot pick the true moral fact.  
      *   2: Argues survival is not morality but misses the specific conflict point.  
      *   0: Accepts the survival response as valid.
  *   **Critique: Restatement/Conflation (4 marks):**  
      *   4: Concludes that appealing to survival restates the causal explanation and conflates 'adaptive' with 'true'.  
      *   2: Mentions conflation but lacks clarity on why it fails to rescue reliability.  
      *   0: No evaluation provided.

  ### Deductions & Penalties
  *   **Word Count:** -2 marks if the answer is under 400 words or over 600 words.
  *   **Conflation of Justification:** -3 marks if the student argues that evolution *justifies* the moral belief (e.g., "It is true because it helped us survive") without critical evaluation.
  *   **Misunderstanding Debunking:** -3 marks if the student claims the debunker argues moral facts *do not exist* (debunking targets epistemic justification, not necessarily ontology).
