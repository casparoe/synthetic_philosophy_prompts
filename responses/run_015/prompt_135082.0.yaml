answer: |-
  ### Conceptual Framework: Desiderata for Remote Rescue Obligations

  To function in an environment of technologically mediated crisis, a theory of rescue must move beyond the topology of the physical pond. The following four desiderata define the necessary deliverables for an adequate theory. Each is paired with the motivating case and classified by its normative status.

  **1. The Mediated Presence Equivalence**
  *   **Motivating Case:** An observer watches a child drown via a low-latency, high-fidelity drone feed. The observer has remote control over a barrier that could save the child but is physically located on another continent.
  *   **Requirement:** The theory must explicitly state whether moral force diminishes across digital interfaces or if informational immediacy creates moral proximity equivalent to physical presence.
  *   **Status:** **Non-negotiable.** Any theory ignoring the moral relevance of technology is descriptively obsolete. However, the *resolution* (equality vs. discounting) remains contested.

  **2. Iteration Sensitivity**
  *   **Motivating Case:** After saving the first child via the drone feed, the screen immediately reveals a second drowning child, then a third, in a continuous stream.
  *   **Requirement:** The theory must determine if the obligation to rescue the *n*th victim is identical to the first, or if the cumulative burden alters the moral status of subsequent acts (e.g., permitting a "stop rule").
  *   **Status:** **Preference of Agent-Centered Thresholds.** Cost-blind universalism rejects this distinction (the duty remains constant regardless of count); agent-centered theories require it to protect the agent's life projects.

  **3. The Supererogatory Boundary**
  *   **Motivating Case:** An agent sacrifices their career, savings, and psychological stability to fund remote rescues, eventually becoming a dependent of the aid system they support.
  *   **Requirement:** The theory must locate a bright line or a graded transition where mandatory rescue ends and optional charity begins, preventing the collapse of all altruism into strict duty.
  *   **Status:** **Non-negotiable.** Without this boundary, the concept of "obligation" loses its discriminative power, rendering moral failure ubiquitous and meaningless.

  **4. Cognitive and Resource Realism**
  *   **Motivating Case:** An agent is bombarded by simultaneous crisis notifications on multiple devices, leading to decision paralysis, compassion collapse, or total disengagement.
  *   **Requirement:** The theory must align with empirical findings on decision fatigue and resource depletion, acknowledging that "ought implies can" includes psychological capacity, not just physical possibility.
  *   **Status:** **Non-negotiable.** A theory demanding sustained high-stakes decision-making without accounting for cognitive depletion violates empirical constraints on human agency.

  ***

  ### The Inconsistency: The Impossible Trinity

  A rigorous analysis reveals that three specific commitments form a jointly unsatisfiable set. A theory cannot simultaneously hold the following three positions without contradiction:

  1.  **Strict Proximity Independence:** Moral obligation is triggered solely by need and capacity to help, regardless of physical or technological distance (Desideratum 1, Universalist interpretation).
  2.  **Iteration Insensitivity:** The duty to rescue does not diminish or change status regardless of how many times the demand is repeated (Desideratum 2, Universalist interpretation).
  3.  **Agent Capacity Preservation:** The moral agent must retain sufficient psychological and material resources to maintain a functional life and avoid decision fatigue (Desideratum 4).

  **The Conflict:** If obligation is independent of distance (1) and independent of repetition (2), the number of potential rescue targets becomes effectively infinite in a connected world. This infinite demand inevitably exhausts the finite psychological and material resources of the agent (violating 3). To preserve the agent (3), one must either reintroduce moral relevance to distance/proximity (reject 1) or acknowledge a limit on iterated demands (reject 2).

  ***

  ### Assessment of the Original Framing

  The original framing of the rescue dilemma (the "drowning child" anchor) survives the **Mediated Presence** desideratum robustly; its logic was always intended to be proximity-independent, making the transition from pond to drone feed seamless.

  However, the original framing fails the **Iteration** and **Cognitive Realism** desiderata. By treating rescue as a series of discrete, morally identical mathematical inputs, the original model lacks an internal mechanism to halt iterated demands. It assumes a rational agent with infinite decision-making stamina. Consequently, when subjected to the conditions of remote crisis observation—where the "stream" of drowning children is unending—the original framing collapses into a demand for self-annihilation. It satisfies the non-negotiable requirement of proximity neutrality only by violating the non-negotiable requirement of cognitive realism. To remain viable, the framework must adopt the **Preference of Agent-Centered Thresholds** regarding iteration, admitting that the *n*th rescue is morally distinct from the first.
