  hey, i was trying to think through chesterton's fence together with burke for a seminar and i think i constructed something that proves we can never reform anything, which cant be right. can you tell me exactly where the slip is?

  (1) Chesterton's fence: if there's a fence across a road, dont tear it down until you know why it was built.
  (2) Burke says social instituions are like fences - they embody practical wisdom accumulated over generations that no single person can fully recontruct.
  (3) So if we dont understand an institution's full rationale, removing it risks destroying wisdom we cant replace.
  (4) Now, understanding an institution's rationale means grasping not just its original purpose but every social function it currently serves.
  (5) But for any real instituion, there will always be some function we havent mapped yet - sociology is never complete.
  (6) So for any institution, there is always part of its rationale we dont understand.
  (7) Therefore, for every institution, we ought never to remove it.
  (8) That includes the Millbrook zoning cap (1962, built to block one developer, now shapes the whole town's density) and even segregation-era voting rules - we should preserve them all until sociology is finished, which is absurd.
  (9) So one of (1)-(6) has to go.

  i want to keep (1) and (2) if i can, but im open. please dont just list possibilities - take a definite position on which premise is the problem, explain why it looked okay, and say exactly what giving it up costs for burkean conservatism. and be committed: actually defend your choice, dont hedge or say "it depends on the case".
