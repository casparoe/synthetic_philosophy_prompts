answer: |-
  # The Time-Travel Sorter: A Nine-Question Quiz

  **Instructions:** Read each short situation below. Choose the reaction that feels most true to you. There are no right answers; pick the one that matches how you think stories *should* work. Keep track of which letter (A, B, or C) you choose for each question.

  **1. The Opening Page**
  You open a book where the first chapter says a character built a machine and traveled to yesterday.
  *   **A.** I keep reading; I accept this is possible in the story.
  *   **B.** I stop reading; traveling to the past is impossible, so the story is broken.
  *   **C.** I keep reading, but I expect the character will fail to change anything.

  **2. The Toolbox (User Scenario)**
  A traveler brings a wrench back in time. They leave it in a shed. Years later, their younger self finds that exact wrench and uses it to build the time machine.
  *   **A.** This is fine; the wrench has no origin, it just exists in a loop.
  *   **B.** This is impossible; every tool must be made by someone at some point.
  *   **C.** The wrench came from a different version of the past, not this one.

  **3. The Prevention (User Scenario)**
  A traveler goes back to hide a fuel cell they need for their trip. They remember leaving with the cell, but now it is hidden.
  *   **A.** They will find the cell anyway; something will stop them from hiding it.
  *   **B.** They hide the cell, and now they never left, even though they remember it.
  *   **C.** They hide the cell in a new timeline, but their original departure still happened elsewhere.

  **4. The Picnic (User Scenario)**
  A traveler visits the past for an afternoon, leaves footprints in the mud, eats a sandwich, and returns. History books are unchanged.
  *   **A.** The footprints were always there; history books recorded them all along.
  *   **B.** The footprints changed the future, but the traveler returned to a different "now."
  *   **C.** The footprints vanished when they left; you can't leave trash in the past.

  **5. The Meeting**
  The traveler meets their younger self and shakes hands.
  *   **A.** They shake hands; this event was always part of the younger self's past.
  *   **B.** They shake hands, creating a split where the younger self now has a memory of the future.
  *   **C.** This cannot happen; you cannot be in two places at once.

  **6. The Return**
  The traveler returns to the present day after visiting the past.
  *   **A.** It is the same present they left, just a day older.
  *   **B.** It is a different present, changed by what they did in the past.
  *   **C.** They cannot return; once you go back, you are stuck there.

  **7. The History Book**
  After returning, the traveler checks a history book about the time they visited.
  *   **A.** The book matches their memory of the trip exactly.
  *   **B.** The book is different; it records the changes they made.
  *   **C.** The book is blank or gibberish; the changes broke reality.

  **8. The Vanishing**
  A traveler prevents their parents from meeting.
  *   **A.** The traveler fades away or ceases to exist.
  *   **B.** The traveler survives, but they are now in a world where they were never born.
  *   **C.** The traveler finds they were unable to stop the meeting.

  **9. The Logic Check**
  In this story, a character is both alive and dead at the same time due to time travel.
  *   **A.** The story is flawed; a person cannot be both alive and dead.
  *   **B.** They are alive in one timeline and dead in another.
  *   **C.** They are both alive and dead in the same world; reality is just messy.

  ***

  # Scoring Key and Logical Analysis

  ### How to Score
  Tally your answers. This quiz sorts you into one of four "leaves" based on which column has the most checks. If you have a tie, choose the leaf that feels most comfortable.

  | Question | **Fixed Single-Timeline** | **Branching Timeline** | **No-Backward-Travel** | **Anything-Goes Single-Timeline** |
  | :--- | :---: | :---: | :---: | :---: |
  | **1** | A or C | A | **B** | A |
  | **2** | **A** | C | **B** | C (or A) |
  | **3** | **A** | C | **B** | **B** |
  | **4** | **A** | B | C (or B) | B |
  | **5** | **A** | B | **C** | B |
  | **6** | **A** | **B** | C | A or B |
  | **7** | **A** | **B** | N/A | **C** |
  | **8** | **C** | **B** | N/A | **A** |
  | **9** | **A** | **B** | **A** | **C** |
  | **Total** | **Count A-heavy** | **Count B-heavy** | **Count "Impossible"** | **Count Contradictions** |

  *(Note: In the table above, bold letters indicate the primary score for that position. Some answers overlap because different positions agree on certain outcomes, like "The past stays safe.")*

  **Rough Guide:**
  *   **Mostly "Things stay the same/always happened":** Fixed Single-Timeline.
  *   **Mostly "Things change/create new paths":** Branching Timeline.
  *   **Mostly "This can't happen/Story is broken":** No-Backward-Travel.
  *   **Mostly "Things change/Logic breaks":** Anything-Goes Single-Timeline.

  ### The Logical Space
  To understand where these four positions sit, we can map them using three simple switches (Yes/No questions):
  1.  **Is backward travel possible?**
  2.  **Is there only one timeline?**
  3.  **Are contradictions (A and not-A) allowed?**

  This creates 8 theoretical combinations ($2 \times 2 \times 2$). Here is how the four leaves occupy that space:

  1.  **Fixed Single-Timeline:** Travel Possible (Yes) + One Timeline (Yes) + Contradictions (No).
  2.  **Branching Timeline:** Travel Possible (Yes) + One Timeline (No) + Contradictions (No)*.
  3.  **No-Backward-Travel:** Travel Possible (No) + [Timeline/Contradiction settings irrelevant].
  4.  **Anything-Goes:** Travel Possible (Yes) + One Timeline (Yes) + Contradictions (Yes).

  *\*Note: Branching views usually forbid contradictions within a single branch, even if different branches contradict each other.*

  **Unoccupied Combinations:**
  There are four theoretical combinations that nobody occupies.
  *   **Travel Impossible + Contradictions Allowed:** Incoherent. If travel is impossible, the contradictions caused by travel cannot happen.
  *   **Travel Impossible + Many Timelines:** Unattractive/Incoherent. Why posit multiple timelines if the mechanism to access them (travel) is impossible?
  *   **Travel Possible + Many Timelines + Contradictions Allowed:** Unexplored/Redundant. If you have many timelines, you usually don't *need* contradictions to explain changes; you just use different branches. Adding contradictions adds complexity without benefit.
  *   **Travel Possible + One Timeline + Contradictions No (but Travel Fails):** This is effectively the **Fixed Single-Timeline** view. It is already occupied.

  **Indistinguishable Pair:**
  This quiz cannot perfectly separate **Fixed Single-Timeline** from **No-Backward-Travel** in every instance.
  *   *Why:* In both views, the result is that the recorded past remains safe. If a story simply says "The traveler tried to change history and failed," a Fixed believer says "Physics stopped him," and a No-Travel believer says "The premise is false."
  *   *Flag:* Question 1 is the main separator here. If a member answers "This is impossible" there, they are No-Travel. If they answer "I accept this," but later say "He couldn't change anything," they are Fixed. However, in casual conversation, these two often sound identical ("You can't change the past").

  ***

  # Summary Table

  | Position label | Typical answer pattern | Core commitment in one sentence | Story moment it finds hardest to handle |
  | :--- | :--- | :--- | :--- |
  | **Fixed Single-Timeline** | "It always happened this way." | The past is immutable; any attempt to change it was already part of history. | Explaining why the traveler bothered trying if they were destined to fail. |
  | **Branching Timeline** | "It created a new path." | Travel creates or accesses alternate realities, preserving the original origin. | Explaining why the traveler cares about the original timeline they can't reach. |
  | **No-Backward-Travel** | "This cannot happen." | Backward causality is logically or physically impossible; such stories are fantasy. | Engaging with the plot without constantly pointing out the impossibility. |
  | **Anything-Goes Single-Timeline** | "Logic breaks, but it happens." | The past can be rewritten in place, even if it creates paradoxes about existence. | Explaining how the traveler exists after erasing the cause of their existence. |
