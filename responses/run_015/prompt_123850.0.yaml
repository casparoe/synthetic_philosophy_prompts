answer: |-
  This is an exceptionally sharp observation. You have identified the precise dialectical friction point where Non-Reductive Physicalism (NRP) often fractures under the pressure of Jaegwon Kim's Causal Exclusion Argument.

  To answer your primary question directly: **There is no single, canonical term in the literature that names this specific *oscillation* itself.** However, the components of the pattern are well-mapped. The "Architect" view is standardly called **Program Explanation** (Jackson & Pettit), the "One Reality" move is **Realization Physicalism** (Shoemaker), and the pressure causing the retreat is the **Exclusion Problem** (Kim).

  The instability you are describing—the sliding between distinct causation, identity, and mere explanation—is typically discussed by critics (like Kim, Horgan, or Sider) as **"The Incoherence of Non-Reductive Physicalism"** or **"The Causal Drainage Argument."** However, these terms name the *verdict*, not the *mechanism* of the slide.

  For a dissertation chapter, relying on "Incoherence" is too blunt. You need a term that isolates the *mechanism* of the instability. I recommend coining the term **"The Explanatory-Causal Equivocation"** (for the argumentative pattern) and **"Structural Efficacy"** (for the unstable role).

  Below is a breakdown of how to map this onto the literature, how to define your terms, and how to distinguish this from a Motte-and-Bailey fallacy.

  ---

  ### 1. Mapping the Pattern to Existing Literature

  Your description maps almost perfectly onto the trajectory of **Frank Jackson and Philip Pettit's "Program Explanation" (1990)**, which is the most sophisticated version of the "Architect" metaphor.

  *   **The Architect Claim:** Jackson & Pettit distinguish between *process causation* (the bricks moving) and *program causation* (the plan ensuring the bricks are there). They argue mental properties have "causal relevance" without "causal production."
  *   **The Critic's Pressure:** Critics (e.g., Zhong 2011, Kim 1998) ask: If the physical process is sufficient, does the program *do* anything?
  *   **The Slide:**
      1.  **Distinct Cause:** "The mental causes the physical realizer." (This risks causal overdetermination or violation of closure).
      2.  **Identity/Realization:** "No, the mental *is* the physical realized." (This risks reductionism).
      3.  **Explanatory Indispensability:** "But you still need the mental to *explain* the behavior." (This risks epiphenomenalism).

  This specific tripartite slide is the "failure mode" you are tracking. In the literature, it is often subsumed under **"The Problem of Causal Relevance"** or **"The Distinctness Problem."**

  ### 2. Proposed Terminology for Your Dissertation

  Since no single term captures the *dynamic instability* rather than just the static position, I propose you adopt the following terminology for your chapter. This will give you precision without mislabeling.

  #### A. For the Role: "Structural Efficacy"
  Use this to describe the "Architect" role.
  *   **Definition:** A property $M$ has structural efficacy regarding effect $E$ if $M$ ensures the instantiation of a physical base $P$ that produces $E$, without $M$ contributing energy or force distinct from $P$.
  *   **Boundary Condition:** Structural efficacy counts as genuinely causal *only if* there is counterfactual dependence between $M$ and $E$ that is not screened off by $P$. If $P$ screens off $M$, structural efficacy collapses into **Explanatory Utility**.

  #### B. For the Argumentative Pattern: "The Explanatory-Causal Equivocation"
  Use this to name the oscillation you observed.
  *   **Definition:** A dialectical maneuver where a defender of mental causation invokes **Explanatory Indispensability** (the plan is needed to understand the wall) to defend **Causal Efficacy** (the plan built the wall) when challenged by Physical Sufficiency, but retreats to **Ontological Non-Distinctness** (the plan is just the bricks arranged) when challenged by Exclusion.
  *   **Why "Equivocation"?** It relies on an ambiguity in the word "cause." Sometimes "cause" means *productive mechanism* (efficient cause), sometimes it means *explanatory ground* (formal cause). The defender slides between these meanings to evade exclusion.

  ### 3. Distinguishing from Motte-and-Bailey

  You asked to distinguish this from a Motte-and-Bailey fallacy. This is crucial for a seminar context, as accusing a philosopher of a fallacy is different from identifying a structural tension.

  *   **Motte-and-Bailey:** Requires *strategic intent*. The defender *knows* the strong claim (Bailey: "Mental states are distinct causes") is vulnerable, so they strategically retreat to the weak claim (Motte: "Mental states are explanatory") when attacked, then pretend the weak claim supports the strong one.
  *   **Explanatory-Causal Equivocation:** Is often *conceptual*, not strategic. Many NRP defenders genuinely believe that "explanatory indispensability" *entails* a form of causation (e.g., interventionist causation). They are not necessarily hiding; they are operating with a **pluralist concept of causation** that critics (like Kim) reject.
  *   **The Test:** If the defender admits, "I am using a different definition of causation than the physicalist closure principle requires," it is not a Motte-and-Bailey; it is a **Conceptual Pluralism** defense (e.g., List & Menzies 2009). If they insist they are using the *same* definition of causation but slide between ontological distinctness and identity, it is the **Explanatory-Causal Equivocation**.

  ### 4. Boundary Conditions for Your Analysis

  To make this rigorous for your dissertation, you should specify when "Structural Efficacy" succeeds vs. when it slides into the Equivocation.

  | Condition | Status of Mental Causation | Label |
  | :--- | :--- | :--- |
  | **Counterfactual Dependence:** If the decision hadn't occurred, the neurons wouldn't have fired (and no other neurons would have fired to cause the walk). | **Genuinely Causal** | Interventionist Causation (Woodward/List) |
  | **Screening Off:** The neurons fire, and the decision *must* occur (supervenience), but the neurons alone are sufficient for the walk. | **Explanatorily Useful** | Program Explanation (Jackson/Pettit) |
  | **Ontological Slide:** Claiming the decision causes the walk *because* it explains the neurons, while denying the decision is distinct from the neurons. | **Unstable** | **Explanatory-Causal Equivocation** |

  ### 5. Seminar Strategy

  When presenting this, frame it not as "catching philosophers making a mistake," but as **"Mapping the Dialectical Cost of Non-Reductive Physicalism."**

  1.  **Acknowledge the Motivation:** The "Architect" intuition is powerful. We *feel* like architects of our actions. Dismissing it as epiphenomenalism is unsatisfying.
  2.  **Identify the Tension:** Show that the "Explanatory-Causal Equivocation" arises because NRP tries to satisfy three incompatible constraints:
      *   **Causal Closure** (Physics is sufficient).
      *   **Causal Efficacy** (Mind makes a difference).
      *   **Non-Reduction** (Mind is not just physics).
  3.  **Use Your Term:** "I argue that the standard defense of Program Explanation relies on an **Explanatory-Causal Equivocation**. When pressed on closure, they emphasize Non-Reduction (Identity). When pressed on Efficacy, they emphasize Explanation (Distinctness)."
  4.  **Cite the Right Targets:**
      *   **Jackson & Pettit (1990):** For the "Architect/Program" view.
      *   **Jaegwon Kim (1998, *Mind in a Physical World*):** For the "Exclusion" pressure that forces the slide.
      *   **Lei Zhong (2011):** For the specific critique that "causing the cause" doesn't save mental causation.
      *   **Karen Bennett (2003):** For the discussion on why "building relations" (realization) often fail to solve exclusion.

  ### Summary Recommendation

  Do not use "Motte-and-Bailey." It is too colloquial and implies bad faith.
  Do not use "Epiphenomenalism." That is the *result* of the failure, not the *pattern*.
  **Use "The Explanatory-Causal Equivocation."**

  It precisely captures the slippage between *why we talk about minds* (explanation) and *what minds do* (causation), which is the exact instability you have identified. This will demonstrate to your seminar that you have not only read the literature but have synthesized a structural critique of the dialectic itself.
