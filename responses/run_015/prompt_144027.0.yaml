  hey, I've been poking at a short essay for a reading group and I've got that bad feeling where you can't tell if you've thought of something or just forgotten that somebody already thought of it. The topic is that old question of whether the sciences carve nature at its joints. Rough draft below — pls ignore the typos and the fact that section 5 is basically two bullet points and a shrug.

