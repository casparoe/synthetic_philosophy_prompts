      *   **Update Rule 1 (Certain):** $P_{new}(H) = P(H | E_{observed})$. Commutative.
      *   **Update Rule 2 (Uncertain/Jeffrey):** $P_{new}(H) = \sum P(H | E_i) P_{new}(E_i)$. Non-commutative if $P_{new}(E)$ and $P_{new}(F)$ are specified independently of the current distribution.
