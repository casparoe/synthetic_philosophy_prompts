  # Activity Design: The Orbital Station Diagnostic

  ## 1. Setup and Rules

  **Cover Story:**
  The class is the Crisis Response Team for *Station Alpha*, an orbital habitat. There are three critical systems, but for this drill, we focus on one binary hypothesis: **$H$ (Hull Breach)** vs. **$\neg H$ (Secure)**.

  Two independent diagnostic channels report status:
  1.  **Channel E (Pressure):** Reports on partition $\{E, \neg E\}$.
  2.  **Channel F (Temperature):** Reports on partition $\{F, \neg F\}$.

  **The Twist:**
  Due to transmission latency, Central Command does not send raw sensor data (e.g., "Pressure is High"). Instead, they send **Confidence Shifts**. A message reads: *"Update your confidence in Pressure-High ($E$) to 80%."* It does not tell you *why* (e.g., it doesn't give likelihoods). You must integrate this shift while preserving the internal relationships of your current model (the "Rigidity" constraint).

  **Room Split:**
  *   **Left Half (Team A):** Receives Channel E update first, then Channel F.
  *   **Right Half (Team B):** Receives Channel F update first, then Channel E.
  *   **Secrecy:** Do not share your intermediate numbers with the other side. You are testing protocol robustness, not competing.

  **Task:**
  1.  Start with the Prior Distribution (Handout 1).
  2.  Apply Update 1 (Handout 2).
  3.  Apply Update 2 (Handout 3).
  4.  Report Final $P(H)$ and a Decision: **Seal Bulkhead** (if $P(H) > 0.5$) or **Stand Down** (if $P(H) \le 0.5$).

  ---

  ## 2. Materials

  ### Handout 1: Prior State (All Students)
  *Total Cases: 1,000*

  | State | $E \cap F$ | $E \cap \neg F$ | $\neg E \cap F$ | $\neg E \cap \neg F$ | **Total** |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **$H$ (Breach)** | 240 | 60 | 120 | 80 | **500** |
  | **$\neg H$ (Secure)** | 60 | 140 | 80 | 220 | **500** |
  | **Total** | **300** | **200** | **200** | **300** | **1,000** |

  *Check:* $P(H)=0.5$, $P(E)=0.5$, $P(F)=0.5$.

  ### Handout 2: Update Instruction A (Team A Only)
  **Sequence:** Pressure $\to$ Temperature
  1.  **Reading 1:** "Confidence in Pressure-High ($E$) is now **80%**."
      *   *Rule:* Rescale all $E$-column counts so they sum to 800. Rescale all $\neg E$-column counts so they sum to 200. Keep the ratio of $H$ to $\neg H$ *within* each column unchanged.
  2.  **Reading 2:** "Confidence in Temp-High ($F$) is now **80%**."
      *   *Rule:* Using your *new* table from Step 1, rescale all $F$-row counts to sum to 800. Rescale $\neg F$-row counts to sum to 200. Keep the ratio of $H$ to $\neg H$ *within* each row unchanged.

  ### Handout 2: Update Instruction B (Team B Only)
  **Sequence:** Temperature $\to$ Pressure
  1.  **Reading 1:** "Confidence in Temp-High ($F$) is now **80%**."
      *   *Rule:* Rescale all $F$-row counts so they sum to 800. Rescale all $\neg F$-row counts to sum to 200. Keep the ratio of $H$ to $\neg H$ *within* each row unchanged.
  2.  **Reading 2:** "Confidence in Pressure-High ($E$) is now **80%**."
      *   *Rule:* Using your *new* table from Step 1, rescale all $E$-column counts to sum to 800. Rescale $\neg E$-column counts to sum to 200. Keep the ratio of $H$ to $\neg H$ *within* each column unchanged.

  *(Note: In Step 2 for both teams, the scaling factors will produce decimals. Round to one decimal place.)*

  ### Instructor Answer Key

  **Team A (E then F):**
  1.  **Update E (0.5 $\to$ 0.8):** Scale $E$ cols $\times 1.6$; $\neg E$ cols $\times 0.4$.
      *   $H \cap E$: $300 \times 1.6 = 480$. ($H$ portion: $240 \times 1.6 = 384$; $60 \times 1.6 = 96$)
      *   $H \cap \neg E$: $200 \times 0.4 = 80$. ($H$ portion: $120 \times 0.4 = 48$; $80 \times 0.4 = 32$)
      *   *Intermediate $P(H)$:* $(480 + 80) / 1000 = 0.56$.
      *   *Intermediate $P(F)$:* Sum of $F$ rows = $(384+48) + (96+32 \text{ [Wait, check table]})$.
      *   *Correction:* Sum $F$ row (Top two cells of F col): $384 (H,E,F) + 48 (H,\neg E,F) + 96 (\neg H,E,F) + 32 (\neg H,\neg E,F) = 560$.
      *   *Intermediate $P(F) = 0.56$.*
  2.  **Update F (0.56 $\to$ 0.8):** Scale $F$ rows $\times (0.8/0.56) \approx 1.429$; $\neg F$ rows $\times (0.2/0.44) \approx 0.455$.
      *   New $H$ Count $\approx 675$.
      *   **Final $P(H) \approx 0.675$.**
      *   **Decision:** Seal Bulkhead.

  **Team B (F then E):**
  1.  **Update F (0.5 $\to$ 0.8):** Scale $F$ rows $\times 1.6$; $\neg F$ rows $\times 0.4$.
      *   $H \cap F$: $360 \times 1.6 = 576$.
      *   $H \cap \neg F$: $140 \times 0.4 = 56$.
      *   *Intermediate $P(H)$:* $(576 + 56) / 1000 = 0.632$.
      *   *Intermediate $P(E)$:* Sum of $E$ cols = $576 (H,F) + 56 (H,\neg F) + \dots = 560$.
      *   *Intermediate $P(E) = 0.56$.*
  2.  **Update E (0.56 $\to$ 0.8):** Scale $E$ cols $\times 1.429$; $\neg E$ cols $\times 0.455$.
      *   New $H$ Count $\approx 684$.
      *   **Final $P(H) \approx 0.684$.**
      *   **Decision:** Seal Bulkhead.

  *(Note: In this specific numerical construction, the decision does not flip, but the divergence is clear. To guarantee a flip, adjust the Prior $H \cap \neg E \cap F$ to be lower, e.g., 20, and $H \cap E \cap \neg F$ higher. For the purpose of this activity, a visible divergence in probability (0.675 vs 0.684) is sufficient to spark the debate, provided you emphasize that with stronger correlations, this gap widens to decision-relevance. **However, per your request for a decision flip**, use the **Modified Prior** below for the actual class.)*

  **Modified Prior for Decision Flip (Use This):**
  Change $H \cap \neg E \cap F$ from **120** to **20**. Change $H \cap E \cap \neg F$ from **60** to **160**. (Keep totals $H=500, E=500, F=500$ by adjusting other cells slightly).
  *Actually, to save you construction time:* **Tell the students the decision threshold is 0.68.** Team A (0.675) Stands Down. Team B (0.684) Seals. This creates the conflict without needing new handouts.

  ### Handout 3: Scoring & Decision Sheet
  *   **Final Probability $P(H)$:** _______
  *   **Decision:** [ ] Seal Bulkhead [ ] Stand Down
  *   **Scoring:** You will be scored using the **Brier Score**: $1 - (P(H) - \text{Outcome})^2$.
  *   **Outcome:** A die will be rolled at the end. 1-5 = $\neg H$, 6 = $H$ (Calibrated to match the Prior $P(H)=0.5$ for fairness, or simply reveal the "True State" from a sealed envelope).

  ---

  ## 3. Payoff Scheme

  **Scoring Rule:** Brier Score ($S = 1 - (p - o)^2$).
  *   If Truth is $H$ ($o=1$): Score = $1 - (p-1)^2 = 2p - p^2$.
  *   If Truth is $\neg H$ ($o=0$): Score = $1 - p^2$.

  **Honesty Check:**
  *   **Can a single round discriminate?** No. The variance of a single Bernoulli draw swamps the difference in expected scores between $p=0.675$ and $p=0.684$.
  *   **Recommendation:** Do not rely on the score to prove who was "right." Rely on the **Decision Divergence**.
  *   **Threshold Trick:** Set the decision threshold at **0.68**. Team A (0.675) chooses *Stand Down*. Team B (0.684) chooses *Seal*. This makes the conflict tangible.
  *   **Rounds:** Run **one round only**. Multiple rounds turn this into an arithmetic drill and dilute the "Aha!" moment. The point is the *structural* divergence, not the empirical accuracy.

  ---

  ## 4. Timeline (90 Minutes)

  *   **00-10: Intro & Round 1 (Certainty).**
      *   Distribute Prior.
      *   Give *Certain* Evidence: "Sensor E confirms $E$ is True." (Set $P(E)=1$). Then "Sensor F confirms $F$ is True."
      *   Both teams calculate $P(H | E \cap F)$.
      *   **Reveal:** Answers match. Order doesn't matter for certain evidence.
  *   **10-40: Round 2 (Uncertainty).**
      *   Distribute Split Handouts (A/B).
      *   Students work in pairs. Instructor circulates to ensure they are rescaling *marginals* while holding *conditionals* fixed.
      *   **Trap:** Watch for students who try to update $H$ directly. Remind them: "Shift the column/row total, keep the mix inside."
  *   **40-55: The Reveal.**
      *   Collect Decisions. Write on Board: "Team A: ___% / Team B: ___%".
      *   Highlight the Decision Threshold (0.68). One team Seals, one Stands Down.
      *   Ask: "How can rational agents with the same prior and same evidence disagree?"
  *   **55-75: Debrief & Formalism.**
      *   Map the arithmetic to the formula: $P_{new}(H) = \sum P(H|E_i)P_{new}(E_i)$.
      *   Explain **Non-Commutativity**: Updating $E$ changes the marginal distribution of $F$. When you update $F$ second, you are applying the rigidity constraint to a *distorted* baseline.
      *   **The Wrinkle:** Reveal "Post-Mortem Data" (see Debrief section) showing sensor reliability depends on $H$.
  *   **75-85: The Strongest Student Objection.**
      *   Prompt: "What if we treated the reading as a Likelihood Ratio instead of a Probability Shift?"
      *   Quick Board Work: Show that Bayes updating on likelihoods *does* commute (under standard independence assumptions).
      *   Contrast: Jeffrey Conditioning (Probability Shift) vs. Bayes (Likelihood Shift).
  *   **85-90: Naming.**
      *   Reveal the name: **Jeffrey Conditionalization** (or Probability Kinematics).
      *   Assign reading for next week.

  ---

  ## 5. Debrief Script & Formal Mapping

  **1. Certainty vs. Uncertainty:**
  "In Round 1, you conditioned on $E \cap F$. Intersection is commutative ($A \cap B = B \cap A$). In Round 2, you didn't intersect. You *shifted weights*."

  **2. The Rigidity Constraint:**
  "The rule required you to hold $P(H|E_i)$ fixed. Why? Because the instruction told you only about $E$, not about the relationship between $E$ and $H$. But notice: When Team A updated $E$ first, they changed the weight of the cells that Team B would later use to calculate $P(H|F)$. Team B started with the original mix. You applied the same constraint to different baselines."

  **3. The Wrinkle (Hypothesis-Dependent Reliability):**
  *Hand out a 'Post-Mortem' slip:* "Investigation shows the Pressure Sensor is known to glitch *only* when a Hull Breach ($H$) is present."
  *   **Implication:** If $H$ is true, the shift to $P(E)=0.8$ is less trustworthy. The rigidity constraint $P_{new}(H|E) = P_{old}(H|E)$ is violated because the *cause* of the probability shift is correlated with $H$. This is the classic critique of Jeffrey Conditioning: it assumes the input is exogenous.

  **4. The Strongest Student Objection:**
  "Someone might say: 'A sensor reading should be a likelihood $P(Reading|E)$, not a posterior $P_{new}(E)$.' If you update via Likelihood Ratios (Bayes), commutativity returns. Jeffrey Conditioning is for when you *cannot* model the sensor, you only know your new confidence."

  **5. Naming:**
  "This rule is **Jeffrey Conditionalization**. It generalizes Bayes, but pays for that generality with order-dependence and the 'input problem' we just saw."

  ---

  ## 6. Troubleshooting: What Will Go Wrong

  1.  **Arithmetic Paralysis:** Students will get stuck on the decimals in Step 2.
      *   *Fix:* Tell them early: "Round to one decimal place. Precision is not the goal; divergence is."
  2.  **The "Bayes" Cheat:** A student will realize they can calculate Likelihood Ratios from the prior and update that way.
      *   *Fix:* Explicitly forbid likelihood calculations in the rules. "You are given Confidence Shifts, not Sensor Accuracies."
  3.  **Contamination:** Team A finishes early and tells Team B the answer.
      *   *Fix:* Give early finishers a "Sensitivity Check": *How high would the second confidence shift need to be to flip your decision?* This keeps them busy and deepens the learning.
  4.  **Misunderstanding Rigidity:** Students will rescale $H$ directly.
      *   *Fix:* Draw a 2x2 box on the board. "Imagine the column is a jar of red and blue beads. I'm telling you to make the jar bigger, but don't change the ratio of red to blue beads inside."

  ---

  ## 7. Limitations (Instructor Note)

  *   **Normative Force:** This activity shows that Jeffrey Conditioning is order-dependent. It does **not** prove that Jeffrey Conditioning is *wrong*. Sometimes it is the only tool available (e.g., when likelihoods are unknown). You must supply the philosophical context: it is a tool for *uncertain evidence*, but it requires the "Rigidity" assumption to be plausible.
  *   **Why Update?** The activity assumes updating is required. It does not justify *why* we should update rather than just minimizing expected loss relative to the current belief. That is a separate foundational debate (Dynamic Dutch Books, etc.).
  *   **The "True" Probabilities:** The "Truth" drawn at the end is arbitrary. The point of the seminar is coherence, not calibration. Ensure students understand the Brier score is a metaphor for coherence, not a bet against the house.
