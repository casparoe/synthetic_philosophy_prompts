  ### Adjudication of Candidate Requirements (Cases 1–7)

  *   **Valuing Fair Coins (Case 1):** **Prejudice.** This is an *ex post* equity intuition. It conflicts with **Ex Ante Pareto**: if A and B are indifferent between a sure allocation and a coin flip, Pareto requires society to be indifferent. To value the coin, you must violate Pareto or Independence.
  *   **Natural Units (Case 2):** **Prejudice.** Given the premise "not interpersonally comparable by construction," **Affine Invariance** survives. If estimation "pins down" units, the ontology has shifted to comparable utilities; otherwise, rescaling invariance is mandatory.
