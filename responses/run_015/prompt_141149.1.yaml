  1.  **Endogenous Weights:** **Prejudice.** Under **Affine Invariance**, "equal weight" is meaningless without a fixed unit. The rule cannot determine weights without breaking non-comparability. Weights must be set by external normative fiat (e.g., "assume comparability" or "equalize scales").
