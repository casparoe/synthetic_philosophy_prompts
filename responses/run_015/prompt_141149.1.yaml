  The subset **{Ex Ante Pareto (over individual beliefs), Bayesian Aggregation, Diverse Beliefs}** is jointly unsatisfiable. You must drop Pareto over individual beliefs or impose a Common Probability. Additionally, **{Ex Ante Pareto, Affine Invariance, Valuing Fair Coins}** is unsatisfiable; you cannot defend the fairness of the chance if agents are indifferent to it.

