      *Justification:* Economic data is high-noise; statistical learning theory guarantees that in such environments, parsimonious (simplified) models often outperform complex (realistic) ones out-of-sample due to variance reduction.
  2.  **$P(\text{Definable Realism}) = 0.60$**
      *Justification:* "Descriptively accurate" is often theoretically contested; constructing a variant that is strictly "more realistic" without changing the model's identity or target is frequently ambiguous or impossible.
  3.  **$P(\text{OOS Loss}) = 0.75$**
      *Justification:* Even when a realistic variant is built, it does not always overfit; sometimes the original simplification was too severe, allowing the realistic variant to win the horse race.
  4.  **$P(\text{Mainstream Instantiation}) = 0.95$**
      *Justification:* Structural models relying on known false assumptions (e.g., Rational Expectations, Representative Agents) remain ubiquitous in macro, finance, and IO.

