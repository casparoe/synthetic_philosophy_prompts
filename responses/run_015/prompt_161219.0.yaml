answer: |-
  Dear friend, I know exactly the kind of room you are walking into because I have sat in it myself, arms crossed, waiting for the philosopher to tell me what I already know about my own work, so the first thing you must do is disarm the expectation that you are there to define beauty for them. You cannot start with the theory of the standard or the notion of the true judge because that will immediately trigger their defenses against snobbery, nor can you start by polling the room on what they like because that will validate their relativism and leave you nowhere. You have to begin with the one thing they all do regardless of their philosophy, which is criticize. Start the session by asking them to describe a time they rejected a piece of writing not because it was morally offensive or commercially unsuccessful but because it simply failed to work for them, and then ask them to articulate why they believe that failure was in the text and not in their own mood. This establishes the practical reality that they act as if there is a standard before you ever introduce the theory that there might be one, and it creates the tension you need to sustain the ninety minutes. Once they have admitted that they judge, you can introduce the distinction between a sentiment and a claim about a sentiment, which is the hinge the whole session turns on. You need them to see that saying I dislike this is a report on their own internal state which cannot be wrong, but saying this is bad is a claim about the object which can be wrong, and you must make this separation clear before you introduce the notion of a true judge or you will sound like you are telling them their feelings are invalid. The true judge should only be introduced after they have accepted that while sentiments are all real, not all sentiments are equally useful for evaluating the object, and this is where you must place the first misconception they listed, which is that a standard must be a rule applicable by someone with no taste. You correct this by showing that the standard is not a rulebook but a cultivated capacity, much like the difference between a casual drinker and a sommelier, where the sommelier is not following a rule but perceiving nuances the other cannot.

  Once you have established that the standard resides in the delicacy of the observer rather than a checklist of features, you can move to the case study, which needs to be a work where the barrier to entry is subtlety rather than morality or plot. I suggest you use the final scene of Kazuo Ishiguro's The Remains of the Day, specifically the moment where Stevens says he has nothing to say and the bench scene ends. This works because the admirers feel a devastating pleasure in the restraint, while those unmoved by it often feel nothing at all, not anger or disagreement, but a lack of pleasure, which fits your constraint that what fails is the pleasure rather than the opinion. The defect in the unmoved reader is an inability to read omission, a specific and removable lack of practice in sustaining the tension of the unsaid, which allows the room to see that the defect is in the observer's capacity rather than the text's quality. You must ensure this case avoids any discussion of sales figures or whether the book will last a hundred years, because those are external validators that distract from the internal experience of the text, and you must keep the focus on why one reader feels the grief and the other feels boredom. As you discuss why some readers miss the point, you should address the second misconception they listed, which is that the joint verdict of qualified judges is only the majority verdict of a smaller room. You need to explain that consensus among the practiced is not a vote but a convergence of perception, like surgeons agreeing on a diagnosis because they see the same thing, not because they counted hands. This leads naturally to the third misconception, which is that if the verdict is right the rest of us owe the pleasure. You must clarify that recognizing a work is good does not obligate the unpracticed reader to enjoy it, only to acknowledge that the failure of pleasure lies in their own lack of preparation rather than the work's failure to deliver.

  For the fourth misconception, which you asked me to name, I suggest you address the belief that emotional intensity correlates with aesthetic value, meaning the idea that if a book made me cry it is good and if it left me cold it is bad. You should place this near the end of the case study discussion, pointing out that a manipulative text can produce strong emotion without beauty, and a subtle text can produce beauty without strong emotion, so the intensity of the feeling is not the standard of its rightness. This helps separate the raw sentiment from the evaluated claim one last time before you move to the written task. The one thing you can ask for in writing that will show you the point has landed is not a definition of beauty but a short paragraph where they describe a work they previously disliked and identify a specific defect in their own reading history that might have caused that dislike, such as impatience with slow pacing or a preference for explicit confession over subtext. This proves they have internalized the idea that the defect can be in the observer and that taste is a skill that can be adjusted, rather than just acknowledging that experts exist. Finally, you must explicitly refuse to go into the metaphysics of what beauty is in itself or the historical process of canon formation, because the first will sink the ninety minutes into abstract definitions that writers do not use in practice and the second will turn the session into a sociological debate about power and sales rather than a phenomenological discussion of reading. If you let them drift into whether Shakespeare is only great because dead white men said so, you will lose the room to cynicism, and if you let them drift into whether beauty is a real property like weight, you will lose them to semantics, so keep them anchored in the experience of the text and the capacity of the reader. You have to trust that if you keep the focus on the practice of reading and the cultivation of attention, the philosophy will do its work without ever needing to be named, and they will leave feeling like better critics rather than lectured students.
