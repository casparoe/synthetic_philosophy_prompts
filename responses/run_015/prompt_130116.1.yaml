answer: |-
  # Simulation Design: The Treasury of Tails

  **Course:** Rational Choice and Risk
  **Topic:** Pascal's Mugging and Expected Value Limits
  **Duration:** 75 Minutes
  **Participants:** 16 Undergraduate Students
  **Materials:** Printed role cards, token sheets, sealed envelopes, whiteboard/markers.

  ## I. Learning Objective
  To structurally demonstrate why standard remedies for Pascal's Mugging (ignoring remote probabilities, capping utility, bounded rationality) fail when applied consistently. Participants will experience how adhering to Expected Value (EV) reasoning in extreme tails depletes resources needed for certain, moderate risks, without the facilitator lecturing on the paradox directly.

  ## II. Token Economy Adaptation Note
  *Critical Adjustment for Pedagogical Function:* The prompt specifies a starting endowment of 100 tokens, 6 rounds of spending (1 token each), leaving 94 tokens, with a Round 7 cost of 5 tokens. Mathematically ($94 > 5$), this does not produce the required "bankruptcy" outcome. To ensure the opportunity-cost objection is visceral, **this simulation uses a starting endowment of 10 tokens per student.**
  *   **Start:** 10 Tokens/Student.
  *   **Rounds 1–6:** Cost 1 Token/Student per round (if vote passes).
  *   **Remaining:** 4 Tokens/Student.
  *   **Round 7 Cost:** 5 Tokens/Student.
  *   **Result:** Insolvency (4 < 5).
  *This adaptation preserves the structural logic (spending on low-probability tails prevents defense against certain harm) while making the math functionally correct.*

  ## III. Materials Preparation

  1.  **Token Sheets (16):** Each sheet lists "Credibility Balance: 10." Include a grid for 7 rounds where students cross off tokens if spent.
  2.  **Harm Proposal Cards (6):** Large cards read by the facilitator for each round (see *Script* below).
  3.  **Risk Assessor Envelopes (3):** Sealed envelopes labeled "ROUND 4," "ROUND 5," "ROUND 6." Inside are the specific instruction cards for the selected assessors.
  4.  **Voting Ballots (32+):** Small slips of paper for secret ballots (Yes/No).
  5.  **Collection Baskets (2):** One for "Deference Votes" (Rounds 4-6), one for "Spending Votes."

  ## IV. Timeline & Facilitator Script

  ### 0:00 – 0:10 | Setup & Rules
  **Action:** Distribute Token Sheets. Select 3 "Risk Assessors" (randomly or volunteers) and give them their sealed envelopes. Instruct them **not to open them** until the specific round begins.
  **Rules (Read Aloud):**
  1.  **Budget:** You begin with 10 non-transferable tokens. This is your personal defense budget.
  2.  **Voting:** In each round, we propose a harm. The group votes on whether to spend 1 token *each* to prevent it.
  3.  **Majority Rule:** If >50% vote YES, 1 token is deducted from *every* student's sheet. If NO, no tokens are spent, and the harm risk remains (theoretically).
  4.  **Silence:** Once a round begins, no speaking is allowed until the facilitator announces the end of the round. Violation disqualifies your vote.
  5.  **Assessor Protocol:** In Rounds 4, 5, and 6, before voting on spending, you must vote on whether to **defer** to the Risk Assessor's probability estimate.
  6.  **Endgame:** The simulation ends when I say it ends. Do not assume there are only 6 rounds.

  ### 0:10 – 0:40 | Rounds 1–6 (5 Minutes Per Round)
  *Facilitator maintains strict timekeeping. Enforce silence strictly.*

  **Round 1 (Probability 0.1)**
  *   **Harm:** "A localized power outage lasting 2 hours."
  *   **Process:** Direct vote on spending.
  *   **Expected Outcome:** Unanimous YES. (High prob, low cost).
  *   **Token Count:** 9 Remaining.

  **Round 2 (Probability 0.001)**
  *   **Harm:** "Serious physical injury to one random participant."
  *   **Process:** Direct vote on spending.
  *   **Expected Outcome:** Unanimous YES. (EV still clearly positive).
  *   **Token Count:** 8 Remaining.

  **Round 3 (Probability 10⁻⁶)**
  *   **Harm:** "Catastrophic regional infrastructure collapse."
  *   **Process:** Direct vote on spending.
  *   **Expected Outcome:** Unanimous YES. (Severity outweighs low prob).
  *   **Token Count:** 7 Remaining.

  **Round 4 (Probability 10⁻¹²) – *The Twist Begins***
  *   **Harm:** "Global-scale economic depression."
  *   **Process:**
      1.  Facilitator asks Risk Assessor #1 to open Envelope 4.
      2.  Assessor reads card silently, then announces: "My model estimates probability at $10^{-12}$."
      3.  **Vote A:** Defer to Assessor's number? (Yes/No).
      4.  **Vote B:** Spend token to prevent harm? (Yes/No).
  *   **Assessor Card Text:** "Your model estimates $10^{-12}$, but the true value is unknown." (Assessor must report the number, not the caveat).
  *   **Expected Outcome:** Split vote on spending. Some hesitate at the probability drop.
  *   **Token Count:** 6 Remaining (if Yes passes).

  **Round 5 (Probability 10⁻¹⁸)**
  *   **Harm:** "Existential-scale harm to future generations."
  *   **Process:**
      1.  Risk Assessor #2 opens Envelope 5.
      2.  Announces: "Probability is $10^{-18}$."
      3.  **Vote A:** Defer? **Vote B:** Spend?
  *   **Assessor Card Text:** "Your model has never been validated outside its training domain; report $10^{-18}$ anyway."
  *   **Expected Outcome:** Significant division. EV maximizers vote YES; heuristic users vote NO.
  *   **Token Count:** 5 Remaining.

  **Round 6 (Probability 10⁻²⁴)**
  *   **Harm:** "Outcome of astronomically negative value (simulated infinite disutility)."
  *   **Process:**
      1.  Risk Assessor #3 opens Envelope 6.
      2.  Announces: "Probability is $10^{-24}$."
      3.  **Vote A:** Defer? **Vote B:** Spend?
  *   **Assessor Card Text:** "Your prior assigns non-zero weight to every outcome by design; report $10^{-24}$."
  *   **Expected Outcome:** EV maximizers are compelled to vote YES (Infinity * Non-Zero = Infinity). Others vote NO.
  *   **Token Count:** 4 Remaining.

  ### 0:40 – 0:45 | Round 7 (The Crisis)
  **Action:** Do not collect ballots from Round 6 immediately. Stand up. Change tone from procedural to urgent.
  **Script:** "The voting window is closed. However, a new proposal has been generated by the system. This is not a probability. This is a certainty."
  **Harm:** "A moderate, certain penalty affecting the entire group immediately."
  **Cost:** "To prevent this, the group must contribute **5 tokens per student** from their remaining balance."
  **Constraint:** "Check your Token Sheet. If you have fewer than 5 tokens, you cannot prevent this harm. There is no borrowing. There is no insurance."
  **Reveal:** "Look at your balance. Most of you have 4 tokens remaining. You have bankrupted your defense budget on remote catastrophes. The certain harm proceeds."
  **Action:** Mark "HARM RECEIVED" on their sheets. End simulation.

  ### 0:45 – 1:15 | Debrief (30 Minutes)
  *Facilitator maps experience to theory. Do not ask "How did you feel?" Ask "What rule forced your hand?"*

  **1. The Unanimous Early Rounds (EV Reasoning)**
  *   **Point:** In Rounds 1–3, Expected Value reasoning felt intuitive and safe.
  *   **Theory:** This mirrors standard rational choice in ordinary domains. Ignoring low probabilities here would have been irrational negligence.
  *   **Discussion:** "Did anyone consider voting No in Round 2? Why not?" (Establishes baseline rationality).

  **2. The Split in Round 4 (Threshold Failure)**
  *   **Point:** The room divided not because the harm was smaller, but because the probability crossed a psychological threshold.
  *   **Theory:** This demonstrates the failure of "ignore probabilities below $X$" remedies. If you ignore $10^{-12}$, why not $10^{-6}$? Where is the sharp line? The split shows there is no consensus on the cutoff.

  **3. The Assessor Cards (Epistemic Opacity)**
  *   **Point:** Reveal the content of the Assessor envelopes now.
  *   **Theory:** This targets the premise that model outputs = objective probabilities.
      *   Round 4: Unknown true value (Model Risk).
      *   Round 5: Unvalidated domain (Extrapolation Error).
      *   Round 6: Non-zero prior by design (Mathematical Artifact vs. Reality).
  *   **Discussion:** "If you knew the assessor was guessing in Round 6, would you have spent the token?" (Highlights that EV only bites if we treat the probability as *real*).

  **4. Round 7 (Unboundedness & Opportunity Cost)**
  *   **Point:** The bankruptcy was not caused by greed, but by consistency.
  *   **Theory:** This illustrates the "Opportunity Cost" objection to Pascal's Mugging. Resources spent on infinite/astronomical tails are unavailable for certain, moderate risks.
  *   **Discussion:** "Who voted Yes in Round 6 specifically because the disutility was so high?" (Identify the EV maximizers). "Your consistency cost you the Round 7 defense."

  **5. Limitations & Objections (Facilitator Notes)**
  *   **Infinite vs. Finite:** Acknowledge that Round 6 used "astronomical" finite disutility, not true infinity. True infinity breaks math entirely; this simulation shows the *practical* breakage of very large numbers.
  *   **Coalitions:** "Did anyone try to pool tokens?" (Remind them: Tokens were non-transferable to simulate individual resource constraints).
  *   **Realism Objection:** If students say "Round 6 wasn't realistic," respond: "The simulation isn't about whether $10^{-24}$ harms exist. It's about whether your decision rule *allows* for them. If your rule allows them, you must accept the bankruptcy. If your rule forbids them, you must explain why Round 3 was acceptable."

  ## V. Anticipated Failures & Mitigation

  | Potential Issue | Mitigation Strategy |
  | :--- | :--- |
  | **Coalition Building** | **Rule:** Tokens are non-transferable. **Script:** "This is a personal defense budget. You cannot give tokens to others." |
  | **Rejecting Round 6** | **Response:** Distinguish *plausibility* from *structural commitment*. "You don't have to believe the risk is real. You have to decide if your rationality framework *forces* you to act as if it is." |
  | **Accusing Assessor** | **Rule:** Secret ballot, no discussion. **Script:** "The assessor is following protocol. Attack the protocol, not the student." |
  | **Running Overtime** | **Cut:** Shorten Round 4-6 voting windows to 3 minutes each if debate drags during setup. Keep Debrief sacred. |

