answer: |-
  Here is the battle plan for your 25-minute teach-in.

  ### 1. The Case Study: Does "Maya" Work?
  **Verdict:** Yes, but only if you add a specific constraint.
  **The Risk:** If Maya takes the lakeside drive because "it's pretty," the audience will think you've solved it. You need to make sure there are **two equally valid internal stories** for the **one external action**.
  **The Fix:** Explicitly state that we *don't* know her mental map of the city.
  *   **Observation:** Maya drives the long Lakeside route on Fridays.
  *   **Theory A (Reward):** She loves scenery. (Reward = Beauty, Belief = Lake is pretty).
  *   **Theory B (Belief):** She hates traffic. (Reward = Speed, Belief = Lake is faster on Fridays).
  *   **The Point:** If you build a nav app assuming Theory A, you route her through a park. If Theory B, you route her through backstreets. Same behavior, opposite product solutions.

  **Better Alternative (Product-Native):**
  If you feel driving is too abstract, use **"The User Who Clicks 'Back'."**
  *   **Observation:** User clicks the browser "Back" button immediately after landing on the Checkout page.
  *   **Theory A (Reward):** They don't want to buy it. (Low value on product).
  *   **Theory B (Belief):** They think they clicked the wrong link. (High value on product, Belief = "This isn't the right page").
  *   *Recommendation:* Stick with **Maya** for the whiteboard (it's visceral), but verbally reference the "Checkout" example to ground it for the product folks.

  ---

  ### 2. The One-Whiteboard Blueprint
  Draw this *before* they arrive. Do not write while talking.

  ```text
  +---------------------------------------------------------------+
  |  MAYA'S FRIDAY DRIVE                                          |
  |                                                               |
  |  [ OBSERVED ]           [ HIDDEN ]                            |
  |  Action:                1. Wants Scenery (Reward)             |
  |  Takes Lake Road        + Believes Lake is Pretty             |
  |                         = DRIVES LAKE                         |
  |                         -----------------------------------   |
  |                         2. Wants Speed (Reward)               |
  |                         + Believes Lake is Faster             |
  |                         = DRIVES LAKE                         |
  |                                                               |
  |  THE TRAP:                                                    |
  |  Watching actions != Reading minds                            |
  |                                                               |
  |  THE FIX (IRL):                                               |
  |  Assume "Noisy Optimal"                                       |
  |  "Trying their best, but human."                              |
  |  (Allows us to spot the slips that reveal the truth)          |
  |                                                               |
  |  PRODUCT TAKEAWAY:                                            |
  |  Don't optimize for clicks. Optimize for the 'Why'.           |
  +---------------------------------------------------------------+
  ```

  ---

  ### 3. Minute-by-Minute Flow (25 Mins)

  **0:00–0:05 | The Hook & The Maya Story**
  *   **Do:** Tell the Maya story. Draw the "Observed" box on the board.
  *   **Say:** "We have terabytes of data on Maya. We know exactly where she drives. Can we build a product for her?"
  *   **Trap:** Someone will say "Yes, send her ads for lakeside cafes."
  *   **Intervention:** "What if she actually hates the lake but thinks it's the only way to get home fast? Now your ads annoy her."
  *   **Goal:** Establish that **Behavior is Ambiguous.**

  **0:05–0:10 | The Equation (No Math)**
  *   **Do:** Reveal the "Hidden" section of the board.
  *   **Say:** "Action isn't just Want. It's **Want × Think**." (Point to Reward + Belief).
  *   **Key Concept:** "If I change her Want, she drives differently. If I change her Think (Belief), she *also* drives differently. But the output looks the same."
  *   **Misunderstanding Alert:** "Can't we just ask her?"
  *   **Head Off:** "In IRL, we are algorithms. We don't have a chat interface. We only have logs. Also, humans lie to themselves about why they do things."

  **0:10–0:15 | The IRL Fix: Noisy Optimality**
  *   **Do:** Circle "The Fix" on the board.
  *   **Say:** "So are we stuck? No. We make one assumption: Humans are **Noisy Optimal**."
  *   **Define:** "It means Maya is trying to get what she wants, but she makes mistakes. She's not a robot."
  *   **Why it matters:** "If she was a perfect robot, Theory A and Theory B are impossible to tell apart. But because she's noisy, sometimes she takes the Highway on a Friday. Those 'mistakes' are the signal. They tell us which theory is more robust."
  *   **Misunderstanding Alert:** "Noisy means random."
  *   **Head Off:** "No. Random is rolling dice. Noisy is slipping on a banana peel. There's a direction, just some error."

  **0:15–0:20 | Product Implications**
  *   **Do:** Point to "Product Takeaway."
  *   **Say:** "In product, we see 'Drop-off at Checkout.' Is that low desire (Reward) or confusion (Belief)?"
  *   **Application:** "If you assume Reward, you lower the price. If you assume Belief, you fix the UI. IRL teaches us to model the *goal*, not just the *click*."
  *   **Skip:** Do not talk about loss functions or gradients.

  **0:20–0:25 | The Check Question & Wrap**
  *   **Do:** Ask the question (see below). Collect answers.
  *   **Wrap:** "IRL isn't about reading minds. It's about admitting you can't read minds, and building models that account for the ambiguity."

  ---

  ### 4. Misunderstandings & Interventions

  | Misunderstanding | When it happens | How to head it off |
  | :--- | :--- | :--- |
  | **"More data fixes this."** | Early, when discussing Maya. | **Intervention:** "Infinite data of the *same* context doesn't help. We need to see her in *new* situations (e.g., when the Lake Road is closed) to separate Want from Think." |
  | **"Noisy = Random."** | During the "Noisy Optimal" section. | **Intervention:** Use the "Basketball" analogy. "A pro player misses shots. Are they shooting randomly at the ceiling? No. They are aiming for the hoop with noise. We can infer the hoop location from the misses." |
  | **"IRL reads minds."** | During Product Implications. | **Intervention:** "It doesn't give truth. It gives probabilities. It tells us 'It's 80% likely she wants speed, 20% likely she wants scenery.'" |
  | **"This is just A/B testing."** | During Product Implications. | **Intervention:** "A/B testing tells you *which* button wins. IRL tries to tell you *why* the button won so you don't break it in the next feature." |

  ---

  ### 5. The Check Question
  *Do not ask "Does this make sense?" They will lie.*

  **Ask this:**
  > "Maya always buys the expensive coffee.
  > **Scenario 1:** She loves the taste.
  > **Scenario 2:** She thinks the cheap coffee makes her sick.
  > If we assume she is 'Noisy Optimal,' what is **one thing** we could observe that would help us tell the difference?"

  **Correct Answer:** "See what she does when the expensive coffee is sold out."
  *   *Why:* If she buys cheap coffee (Action changes), it was likely Belief (she just wants caffeine). If she goes home (Action stays 'no coffee'), it was likely Reward (she only wants *that* taste).
  *   *What you're looking for:* You want them to realize you need a **change in constraints** to separate Reward from Belief.

  ---

  ### 6. What to Deliberately Skip (And Say So)
  *Write this in the corner of the board or say it explicitly to manage scope.*

  1.  **"I'm skipping the Math of 'Optimality'."**
      *   *Say:* "There's a whole field on how to calculate 'noise,' usually using entropy. We're skipping that. You just need to know the assumption exists."
  2.  **"I'm skipping Dynamics/Transitions."**
      *   *Say:* "In strict IRL, we assume we know how the world works (physics). We're focusing on the human mind part (Reward/Belief) because that's where Product lives."
  3.  **"I'm skipping the 'Solution' Algorithm."**
      *   *Say:* "I'm not teaching you how to code the solver. I'm teaching you how to frame the problem so you don't hire an ML engineer to solve the wrong thing."

  ### Final Prep Tip
  Bring a magnet or a sticky note for the "Hidden" section of the whiteboard. Physically covering and revealing the "Reward vs. Belief" split creates a visual "aha!" moment that keeps them from getting lost in the abstraction.
