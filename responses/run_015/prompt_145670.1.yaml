          *   *Implication for Naming:* If we keep the name, we signal that the honor code is still valid or ambiguous. We should rename to signal the shift is complete.
      *   **Williams (The Structural/Material Model):** Moral change happens when the *structure* of society shifts (e.g., state monopoly on violence, rise of capitalism/bourgeoisie). Moral arguments come *after* to justify the change.
          *   *Implication for Naming:* Judging the figure by today's standards is anachronistic because their moral landscape was determined by their material conditions. Removing the name implies moral progress is purely ideological, ignoring structural reality. Contextualization is better than erasure.

