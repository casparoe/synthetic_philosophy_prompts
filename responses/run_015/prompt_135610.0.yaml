prompt: |-
  I've been useing this argument in my metaethics seminar for years and a colleague just poked a hole in it I can't close.

  (1) A belief is justified only if the process that produced it is reliable, i.e. it tracks the truth about the domain it's about.
  (2) Our moral beliefs come from a faculty shaped by natural selection, and selection tracks fitness, not moral truth: it would happily have installed whatever moral judgments got our ancestors more copies of their genes, whatever the moral facts were.
  (3) The moral judgments we actually have are pretty much the ones the fitness-only story predicts, and unlike perception we have no way of checking them against the facts independently of the faculty that produces them.
  (4) So our moral faculty isn't reliable, so no moral belief is justified.

  Here's the hole. She says: run (1)–(4) on logic and induction instead. Selection shaped our inferential habits for the same fitness-only reasons; the habits we have are the ones you'd predict; and we can't check modus ponens against the logical facts except by using modus ponens. So:

  (5) The reliability requirement in (1) is either a general requirement on any belief-forming process, or an extra burden we're piling on morality alone.
  (6) If it's general, it takes out logic, memory and induction too — and then (4) can't be asserted either, since asserting it is an inference.
  (7) If it's an extra burden, then (1)–(4) just assumes what it was supposed to show.
  (8) So evolutionary debunking either collapses into global skepticism or never had a target.

  I want to keep (2) and (3) — that's the interesting empirical bit — and I'd rather not loose logic to save morality. So: which step goes, and what does giving it up cost me? Two things I especially want your read on. First, (4) is itself a claim about what we have reason to believe, so does the argument saw off the normative branch it's sitting on, or is that just rhetoric? Second, a student of mine added a case I can't sort out: imagine we found out that the judgments selection actually favored were ones we now reject outright, say ruthless nepotism toward full siblings and indifference to everyone else. Does that divergence make our moral faculty look more trustworthy, because it isn't marching to fitness's drum — or less, because it's now producing beliefs selection had no interest in getting right? I get the feeling "reliable" is doing more than one job across (1), (4) and (6), but I can't nail the shift.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user is a metaethics professor (or similar) who has been using an Evolutionary Debunking Argument (EDA) for years.
      *   **The Argument:** A standard reliability-based EDA (similar to Sharon Street's or Richard Joyce's).
          *   (1) Justification requires reliability (tracking truth).
          *   (2) Moral faculties are shaped by selection for fitness, not truth.
          *   (3) Moral beliefs match fitness predictions; no independent check.
          *   (4) Conclusion: Moral beliefs are unjustified (moral skepticism).
      *   **The Objection (Colleague's "Hole"):** A *Global Debunking Argument* (similar to Alvin Plantinga's Evolutionary Argument Against Naturalism or a general skeptical challenge).
          *   Apply the same logic to logic/induction/perception.
          *   If (1) is general $\rightarrow$ Global Skepticism (self-defeating).
          *   If (1) is specific to morality $\rightarrow$ Begging the question.
      *   **User's Constraints:**
          *   Wants to keep (2) and (3) (the empirical/evolutionary claims).
          *   Wants to save logic/induction (avoid global skepticism).
          *   Wants to know which step to drop and the cost.
          *   Specific questions:
              1.  Is the self-defeat charge (4 is normative) just rhetoric or real?
              2.  How to analyze the "divergence case" (if evolution favored nepotism but we reject it)?
              3.  Clarify the equivocation on "reliable."

  2.  **Deconstruct the Colleague's Objection:**
      *   The colleague is pressing the *Generality Problem* or the *Self-Defeat Objection* to EDAs.
      *   If evolution shaped *all* cognitive faculties, why single out morality?
      *   Standard response in literature: Distinguish between *truth-apt* domains where fitness correlates with truth (e.g., medium-sized dry goods, basic logic for survival) vs. domains where it doesn't (e.g., morality, perhaps advanced math/metaphysics).

  3.  **Address the User's Specific Questions:**

      *   **Question 1: Self-Defeat (Is (4) sawing off the branch?)**
          *   The argument concludes "No moral belief is justified."
          *   Is *that* conclusion a moral belief? No, it's a metaethical/epistemological claim.
          *   However, if the argument implies *no normative belief is justified*, and the argument itself relies on normative principles of inference (epistemic norms), does it undermine itself?
          *   *Analysis:* It's not strictly self-refuting in the logical sense (like "I believe nothing"), but it creates a *pragmatic* tension. If epistemic norms are also debunked, the argument loses its force. But usually, EDAs target *moral* realism specifically, leaving epistemic norms intact (or treating them as constitutive).
          *   *Verdict:* It's not *just* rhetoric, but it's not a fatal logical contradiction either. It depends on whether epistemic norms are subject to the same debunking.

      *   **Question 2: The Divergence Case (Nepotism)**
          *   Scenario: Evolution favored X (nepotism), we believe not-X (impartiality).
          *   Does this help or hurt realism?
          *   *Option A (Helps):* Shows we aren't slaves to fitness; maybe we accessed truth despite evolution.
          *   *Option B (Hurts):* Shows our faculty is unstable/arbitrary; if it doesn't track fitness, what does it track? Random noise?
          *   *Analysis:* This is the "Third Factor" or "Pre-established Harmony" territory. If we diverge, it suggests our current beliefs aren't explained by evolution. But if evolution explains the *capacity* but not the *content*, does that save realism? Usually, realists argue convergence (we agree on basics). Divergence suggests contingency.
          *   *Key Insight:* The "reliability" term shifts. In (1), it means "tracks truth." In the Divergence Case, the question is "what explains the belief?" If evolution didn't cause the belief, the EDA loses grip, *but* then we need a new explanation for why we have these beliefs.

      *   **Question 3: The Equivocation on "Reliable"**
          *   The colleague suspects "reliable" is doing too much work.
          *   In (1): Reliability = Truth-tracking (Epistemic).
          *   In (2)/(3): Reliability = Fitness-tracking (Evolutionary).
          *   The gap: Does Fitness-tracking imply Truth-tracking?
          *   For Logic/Perception: Plausibly yes (false beliefs about tigers get you eaten).
          *   For Morality: Plausibly no (false belief that "ingroup killing is good" might enhance cohesion/survival).
          *   *Resolution:* The defense lies in distinguishing domains where fitness *correlates* with truth vs. domains where it doesn't.

  4.  **Formulating the Solution (Which step to drop?):**
      *   The user wants to keep (2) and (3).
      *   The colleague attacks (1) (Generality) and the inference to (4).
      *   *Best Move:* Refine (1). Don't make it a *general* requirement that leads to skepticism. Make it a *domain-specific* challenge based on the *independence* of the truth from the evolutionary explanation.
      *   *Alternative:* Attack the inference from (2)+(3) to (4). Just because selection *could* have installed false beliefs doesn't mean it *did*. (The "Third Factor" response).
      *   *Preferred Strategy for User:* Distinguish between *causal genealogy* and *epistemic justification*. The problem isn't evolution *per se*, it's the *lack of independent access*.
      *   *Actually, the strongest move:* Reject the blanket application of (1) to logic. Argue that logic/perception are *constitutive* of reasoning, whereas morality is not. Or argue that fitness *does* track truth for logic (basic inference) but not morality (normative values).
      *   *Wait, the user asks "Which step goes?"*
      *   If they keep (2) & (3), they must modify (1) or the inference to (4).
      *   Modifying (1) is the standard "Selective Skepticism" defense.
      *   *Cost:* You need a principled distinction between moral faculties and logical/perceptual faculties.

  5.  **Drafting the Response:**

      *   **Acknowledge the strength of the colleague's objection:** It's the standard "Global Skepticism" counter to EDAs. It's a serious problem.
      *   **Address the "Which step goes?" question:**
          *   Don't drop (1) entirely (justification needs *some* reliability).
          *   Don't drop (4) (that's the conclusion).
          *   *Modify (1)* or *Qualify the Inference*. The key is to argue that the link between Fitness and Truth holds for Logic/Perception but breaks for Morality.
          *   *Refinement:* The step that goes is the *unqualified* version of (1). Replace with a principle that allows for "default justification" for indispensable cognitive practices (logic/perception) but requires "positive validation" for contingent ones (morality).
      *   **Address Question 1 (Self-Defeat):**
          *   Distinguish between *moral* norms and *epistemic* norms.
          *   The argument uses epistemic norms to debunk moral norms.
          *   If epistemic norms are also evolutionary, we have a problem.
          *   *Solution:* Epistemic norms are constitutive of belief/assertion. You can't argue against them without using them. Moral norms are not constitutive of belief.
          *   *Verdict:* It's not *just* rhetoric, but it's manageable by restricting the scope of the debunking.
      *   **Address Question 2 (Divergence Case):**
          *   If we reject what evolution favored (nepotism), does that save realism?
          *   *No.* It actually makes the genealogy *more* suspicious or irrelevant.
          *   If evolution favored X and we believe Y, evolution didn't cause Y. So the EDA (which attacks the evolutionary cause) loses its grip *but* doesn't confirm realism. It just leaves the origin of Y mysterious.
          *   *However:* If we believe Y *because* we reasoned our way out of X, that appeals to Reason (logic), which the colleague says is also debunked.
          *   *Better take:* Divergence shows our moral faculty is *plastic*. If it's plastic and not tied to fitness, what guides the plasticity? If nothing, it's arbitrary. If "moral truth," then realism is back in. But the skeptic says "it's just cultural drift."
          *   *Crucial Point:* The EDA relies on the *alignment* of belief and fitness (Premise 3). If they diverge, Premise 3 is false. The argument fails, but not in favor of realism. Just fails.
      *   **Address Question 3 ("Reliable" Equivocation):**
          *   Yes, "reliable" shifts.
          *   Sense A: Statistically likely to produce true beliefs (Epistemic).
          *   Sense B: Functioning as designed by selection (Evolutionary).
          *   The argument assumes Selection (B) $\rightarrow$ Truth (A).
          *   For Logic: Selection (B) $\rightarrow$ Survival $\rightarrow$ Truth (A) (mostly).
          *   For Morality: Selection (B) $\rightarrow$ Survival $\nrightarrow$ Truth (A).
          *   The cost: You must defend the claim that survival depends on logical truth but not moral truth.

  6.  **Refining the Advice:**
      *   The user wants to keep the empirical core (2 & 3).
      *   The colleague's attack is on the *scope* of (1).
      *   *Recommendation:* Adopt a "Two-Stage" view or "Default vs. Defeasible" view.
      *   Logic/Perception get "Default Justification" (Reidian common sense). They are indispensable.
      *   Morality does not get Default Justification in the same way (error theory is conceivable).
      *   Therefore, the burden of proof lies on the moral realist to show reliability, but not on the logician.
      *   *Cost:* You concede that morality is epistemically second-class compared to logic/perception. You become a "Selective Skeptic."

  7.  **Final Polish:**
      *   Tone: Collegial, rigorous, acknowledging the depth of the problem.
      *   Structure:
          1.  Validate the colleague's objection (it's the "Global Debunking" problem).
          2.  Answer "Which step goes?" (Modify 1).
          3.  Address the Self-Defeat worry (Epistemic vs. Moral norms).
          4.  Address the Divergence Case (Undermines Premise 3, doesn't save Realism).
          5.  Address the Equivocation (Fitness vs. Truth tracking).
      *   *Self-Correction during drafting:* Make sure not to solve the problem *for* them but give them the tools to patch the argument. The "Third Factor" reply is a common counter to EDAs, but the user wants to *keep* the EDA. So focus on how to insulate Logic from the EDA without begging the question. The "Indispensability" argument is the best bet.

  8.  *(Self-Correction on the Divergence Case)*: Wait, if evolution favored Nepotism and we believe Impartiality, Premise (3) ("The moral judgments we actually have are pretty much the ones the fitness-only story predicts") is *false*. So the argument collapses immediately. It doesn't prove realism; it just breaks the EDA. I need to make sure the user sees this. The student's case kills the EDA *as stated*, but doesn't vindicate realism. It leaves the origin of impartiality unexplained by evolution.

  9.  *(Final check on Self-Defeat)*: If (4) says "No moral belief is justified," and the argument relies on epistemic norms, is it self-defeating? Only if epistemic norms are a subset of moral norms (which they aren't usually) OR if the evolutionary story applies to epistemic norms too. The colleague says it *does* apply. So the user must argue epistemic norms are *different in kind* (constitutive) vs moral norms (substantive).

  10. **Plan:**
      *   Intro: Validate the colleague (Plantinga/Street overlap).
      *   Step to drop/modify: (1). Move from "General Reliability" to "Indispensability + Reliability."
      *   Self-Defeat: Distinguish Constitutive (Logic) vs. Substantive (Morality).
