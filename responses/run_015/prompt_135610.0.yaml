answer: |-
  This is a classic and formidable objection. Your colleague is wielding a version of the **Global Debunking Argument** (closely related to Plantinga's Evolutionary Argument Against Naturalism). If evolutionary pressures shape *all* cognitive faculties for fitness rather than truth, and you demand a reliability check for morality, you must demand it for the faculties used to construct that very demand.

  You want to keep the empirical core (2 & 3) and save logic. Here is the diagnosis of where the argument breaks, how to patch it, and answers to your specific questions.

  ### 1. Which step goes, and what is the cost?

  You cannot keep (1) in its current, unqualified form. Your colleague is right: if (1) is a universal principle of epistemology ("*A belief is justified only if...*"), it consumes itself.

  **The Fix:** You must modify **(1)** to distinguish between **indispensable cognitive practices** (logic, induction, basic perception) and **substantive domain-specific beliefs** (morality, theology, advanced metaphysics).

  Replace (1) with a two-tiered principle:
  > **(1*)** Basic cognitive faculties (logic, perception) enjoy *default justification* because they are constitutive of reasoning itself; substantive domain beliefs (morality) require *positive validation* of reliability, especially when their genealogy suggests indifference to truth.

  **The Cost:**
  1.  **Epistemic Asymmetry:** You concede that moral beliefs are epistemically second-class compared to logical or perceptual beliefs. You are no longer arguing from a neutral epistemological platform but from a "Reidian" common-sense position where some faculties get the benefit of the doubt and others don't.
  2.  **Burden Shifting:** You admit that the default position is trust in logic/perception, but skepticism toward morality *until proven otherwise*. This makes your argument a *defeater* for realism rather than a proof of error theory. It leaves open the possibility that a realist could provide a "Third Factor" explanation (e.g., fitness and moral truth correlate because survival is good), whereas your current setup blocks that move.

  ### 2. Is the self-defeat charge rhetoric or real?

  It is **real**, but it can be contained.

  The worry is that if (4) says "No normative belief is justified," and the argument itself relies on normative principles of inference (epistemic norms), the argument undermines its own authority.

  **The Distinction:** You must argue that **epistemic norms are constitutive** of belief and assertion, whereas **moral norms are substantive**.
  *   To assert (4) is to commit to norms of evidence, inference, and truth. You cannot argue against these norms without employing them (performative contradiction).
  *   To hold a moral belief is not constitutive of reasoning. You can reason perfectly well while being a moral skeptic.

  **The Verdict:** The argument does not saw off the branch it sits on, *provided* you restrict the scope of the debunking to *substantive* normative claims (morality) and exclude *constitutive* normative claims (epistemic logic). However, if your colleague presses that *epistemic* norms are also evolutionary adaptations for fitness (pragmatism), you are back to global skepticism. To avoid this, you must insist that logical validity is not an evolutionary adaptation but a precondition for any adaptation to be intelligible.

  ### 3. The Student's Divergence Case (Nepotism vs. Impartiality)

  Your student asks: *If evolution favored nepotism (X) but we believe impartiality (not-X), does that make the faculty trustworthy or untrustworthy?*

  This case actually **breaks Premise (3)** of your original argument.
  *   **Premise (3)** claims: "The moral judgments we actually have are pretty much the ones the fitness-only story predicts."
  *   **The Case:** If we reject nepotism, (3) is false.

  **Does this save Realism?**
  No. It simply defangs your specific EDA. It does not prove that our impartiality tracks moral truth; it only proves that our impartiality *wasn't* directly selected for.
  *   **Skeptic's Reply:** "Sure, evolution didn't select for impartiality directly. But perhaps impartiality is a byproduct of other selected traits (e.g., general reasoning capacity), or it's cultural drift. Neither implies truth-tracking."
  *   **Realist's Hope:** "If we can override fitness pressures, it shows we have access to a faculty (Reason) that isn't bound by fitness. Maybe *that* faculty tracks truth."

  **The Trap:** If the Realist appeals to "Reason" to explain the divergence, your colleague will remind you that Reason (logic/induction) is also under evolutionary scrutiny (see the Global Debunking).

  **Conclusion on the Case:** Divergence makes the moral faculty look **arbitrary**, not trustworthy. If the faculty produces beliefs uncorrelated with fitness, and you have no independent access to moral truth, you have no reason to think the new beliefs are *true* rather than just *different*. It shifts the explanation from "Fitness" to "Noise" or "Culture," neither of which guarantees justification.

  ### 4. The Equivocation on "Reliable"

  You are correct; "reliable" is doing too much work. There are two distinct senses here:

  1.  **Evolutionary Reliability (Fitness-Tracking):** The process produces outputs that enhance reproductive success.
  2.  **Epistemic Reliability (Truth-Tracking):** The process produces outputs that correspond to mind-independent facts.

  **The Shift:**
  *   In **(1)**, "reliable" means **Epistemic Reliability**.
  *   In **(2) & (3)**, you establish that the faculty has **Evolutionary Reliability**.
  *   The **Inference to (4)** relies on the assumption that **Evolutionary Reliability does not imply Epistemic Reliability** for morality.

  **The Colleague's Point:** For logic/perception, we assume Evolutionary Reliability *does* imply Epistemic Reliability (a brain that can't do basic modus ponens or see a tiger won't survive).
  **Your Necessary Defense:** You must argue that for morality, the link is broken. Fitness requires *cohesion* and *cooperation*, not *moral truth*. One can have false moral beliefs (e.g., "The gods demand sacrifice") that enhance fitness. One cannot have false logical beliefs (e.g., "If I jump off this cliff, I will fly") that enhance fitness in the same way.

  ### Summary Recommendation for the Seminar

  To close the hole without losing the empirical core:

  1.  **Qualify Premise (1):** Explicitly exclude "indispensable cognitive faculties" from the reliability requirement, or grant them default justification. Argue that morality is not indispensable to cognition in the way logic is.
  2.  **Clarify the Target:** State that the argument is not that moral beliefs are *false*, but that they are *unjustified* for the realist who claims they track mind-independent facts.
  3.  **Handle the Divergence:** If a student offers the nepotism case, accept that it falsifies Premise (3). Concede that *this specific version* of the EDA fails in that scenario, but pivot: "If our beliefs aren't explained by fitness, what explains them? If it's just cultural drift, you still lack justification for thinking they track *truth*."
  4.  **Address Self-Defeat:** Distinguish between **constitutive norms** (logic/epistemology), which we must presuppose to argue at all, and **substantive norms** (morality), which are the target of the critique.

  This moves you from a "Global Skepticism" trap to a "Selective Skepticism" position, which is philosophically tenable but requires defending the asymmetry between logic and morality.
