answer: |-
  Here is a 30-minute session plan designed to disrupt the cached "always stratify" heuristic without drowning the residents in causal theory.

  ### 1. Session Order & Rationale

  **0:00–0:05 | The Arithmetic Shock (Bare Tables)**
  *   **Action:** Project two 2x2 tables. No labels. No story.
      *   *Table 1 (Aggregate):* Exposure associated with *lower* risk of Outcome.
      *   *Table 2 (Stratified by Z):* Within both levels of Z, Exposure associated with *higher* risk of Outcome.
  *   **Rationale:** You are right to steelman the bare math. Residents are trained to hunt for the "hidden story" (confounding) immediately. By withholding the narrative, you force them to acknowledge the reversal as a mathematical property of weighted averages before they attach causal semantics. It establishes your thesis: **Simpson's Paradox is arithmetic; the interpretation is causal.**
  *   **Script Cue:** "Before we ask *why* this happened, acknowledge *that* it happened. No data entry error can explain this. It is a property of ratios."

  **0:05–0:15 | The Carrying Example (The Mediator Trap)**
  *   **Action:** Reveal the story behind the numbers (see Section 2).
  *   **Rationale:** You need a case where the *aggregate* is the truth (Total Effect) and the *stratified* is the bias (Direct Effect blocked). This directly contradicts their cached moral.
  *   **Flow:** Present the clinical scenario $\rightarrow$ Show the reversal $\rightarrow$ Ask "Which number do you take to the FDA?" $\rightarrow$ Reveal the temporal sequence.

  **0:15–0:25 | The Causal Structure (DAGs & Misconceptions)**
  *   **Action:** Draw the DAG. Address the "Confounder" question.
  *   **Rationale:** This is where you distinguish Confounding (bias to be removed) from Mediation (mechanism to be preserved). This defuses the misconception that "reversal = confounding."
  *   **Flow:** Map the example to a DAG $\rightarrow$ Define the question (Total vs. Direct) $\rightarrow$ Address Non-collapsibility.

  **0:25–0:30 | The Rule of Thumb & Assessment**
  *   **Action:** Critique the heuristic. Pose the final question.
  *   **Rationale:** Ground the theory in their daily decision-making and test retention.

  ---

  ### 2. The Carrying Example

  **Scenario:** **Anticoagulation in Atrial Fibrillation.**
  *   **Exposure ($X$):** Warfarin vs. No Warfarin.
  *   **Outcome ($Y$):** Major Adverse Cardiac Event (MACE) / Death.
  *   **Stratification Variable ($Z$):** Major Bleeding Event (occurring *after* treatment initiation).

  **The Data Logic:**
  *   **Aggregate:** Warfarin reduces MACE (protective).
  *   **Stratified (by Bleeding):**
      *   *Among Bleeders:* Warfarin looks harmful (higher MACE).
      *   *Among Non-Bleeders:* Warfarin looks harmful or null (higher MACE).
  *   **Why the Reversal?** Warfarin *causes* Bleeding ($X \rightarrow Z$). Bleeding *causes* MACE/Death ($Z \rightarrow Y$). Warfarin also prevents Clots ($X \rightarrow Y$).
  *   **The Trap:** If you stratify by Bleeding, you are comparing Warfarin patients who bled (high risk due to bleed) against No-Warfarin patients who bled (spontaneous bleeders, extremely high risk). But more importantly, you are blocking the pathway. You are asking: "What is the effect of Warfarin *if we could prevent it from causing bleeding*?" That is not the clinical question. The clinical question is: "If I prescribe Warfarin, what happens?" (which includes the bleeding risk).

  **Why this example?**
  *   **Medical Authenticity:** Residents deal with risk/benefit tradeoffs daily.
  *   **Downstream Variable:** Bleeding is clearly a consequence of treatment, not a baseline characteristic.
  *   **Must Contain:** Clear temporal ordering (Treatment $\rightarrow$ Bleed $\rightarrow$ Outcome).
  *   **Must Not Contain:** Baseline confounding (e.g., age, comorbidity). Keep the example "clean" so the only reason for the reversal is the mediator structure, not residual confounding. If you add baseline confounding, they will revert to "we need to adjust more."

  ---

  ### 3. Misconceptions & Defusal Sequence

  | Misconception | When it Forms | How to Defuse |
  | :--- | :--- | :--- |
  | **"The stratified numbers are the truth."** | During the Example (0:10). | Ask: "If you stratify by bleeding, are you allowing the drug to work as it does in reality?" Highlight that stratification artificially holds the mediator constant, estimating a *Direct Effect* when we want the *Total Effect*. |
  | **"A reversal means the data is broken/confounded."** | During the Arithmetic Shock (0:03). | Explicitly state: "Reversal is a feature of weighted averages, not a bug in the dataset. It happens even in perfect RCTs if you stratify on a mediator." |
  | **"Simpson's Paradox is non-collapsibility."** | During the DAG section (0:20). | **Crucial distinction:** Non-collapsibility is a mathematical property of the Odds Ratio (the marginal OR $\neq$ weighted average of conditional ORs) even without confounding. Simpson's Paradox is a *reversal of sign*. SP can happen with Risk Differences (which are collapsible). Do not let them hide behind "it's just the OR math." |

  ---

  ### 4. Causal Graphs: Yes, but Minimal

  **Verdict:** **Yes, introduce a DAG.**
  **Placement:** Minute 0:18 (after the example, before the rule critique).
  **Reasoning:** You cannot explain *why* aggregation is correct in the Anticoagulation example without showing the arrow direction.
  **Execution:**
  *   Draw $X \rightarrow Y$ (Direct benefit).
  *   Draw $X \rightarrow Z \rightarrow Y$ (Mediated harm).
  *   Show that stratifying on $Z$ blocks the second path.
  *   **Time Limit:** 5 minutes max. Do not teach them how to *draw* DAGs; teach them how to *read* this specific one. Use the graph to visualize "Total Effect" (all paths open) vs. "Direct Effect" (path through Z blocked).

  ---

  ### 5. End-of-Session Assessment Question

  **The Question:**
  > "You are reviewing a study on a new bariatric surgery.
  > **Table A (Aggregate):** Surgery reduces 5-year mortality compared to medical management.
  > **Table B (Stratified by Post-Op Diabetes Status):** Within 'Diabetes Remission' and 'Diabetes Persistent' groups, Surgery shows *no* mortality benefit.
  >
  > The CDC asks you: 'Should we fund this surgery to reduce population mortality?'
  > The NIH asks you: 'Does surgery reduce mortality *independent* of its effect on diabetes?'
  >
  > **Which table answers which agency, and why?**"

  **Separation Logic:**
  *   **The Novice:** Will say "Table B is the truth because we adjusted for diabetes," or will be confused about which agency gets which table.
  *   **The Expert:** Will identify that the CDC wants the **Total Effect** (Table A / Aggregate) because they care about the real-world outcome of the policy. They will identify that the NIH wants the **Direct Effect** (Table B / Stratified) because they are asking about mechanism.
  *   **The Takeaway:** It validates that *both* numbers are "true," but they answer different questions. The error is not in the math, but in matching the math to the question.

  ---

  ### 6. Critique of Your Rule of Thumb

  **Your Rule:** *"Stratify on a variable only if it is a cause of the exposure rather than a consequence of it."*

  **Where it Breaks:**
  1.  **Instrumental Variables:** A variable can be a cause of exposure (e.g., physician prescribing preference) but *not* a cause of the outcome (except through exposure). Your rule says "Stratify." **Result:** Bias amplification and loss of precision. You should *not* adjust for instruments.
  2.  **Colliders (M-Bias):** A variable might be a consequence of two *unmeasured* causes (one of exposure, one of outcome). It is not a consequence of exposure directly, but stratifying opens a bias path. Your rule doesn't explicitly catch this, though "consequence of exposure" covers the classic collider.
  3.  **Precision Variables:** A variable that is a cause of the *outcome* only (not exposure). Your rule implies "Don't Stratify" (since it's not a cause of exposure). **Result:** You lose statistical efficiency, though you don't introduce bias.

  **Teaching Advice:**
  *   **Do not teach the rule as absolute.** It is a good "guard rail" for residents to prevent them from adjusting for mediators (the most common error), but it is not a causal identification strategy.
  *   **Teach the Graph:** In 30 minutes, you cannot teach full DAG theory. However, you can teach the **"Descendant Rule"**: *Never stratify on a descendant of the Exposure.*
      *   This covers Mediators ($X \rightarrow Z \rightarrow Y$).
      *   This covers Colliders ($X \rightarrow Z \leftarrow U$).
      *   This is safer than your rule because it explicitly forbids adjusting for consequences, whereas your rule relies on them correctly identifying "cause of exposure."
  *   **The Hard Case:** Regarding variables that proxy for unmeasured confounders *while* being affected by exposure: **Leave this out.** This is advanced g-methods territory (time-varying confounding affected by prior exposure). Acknowledge it exists ("In complex longitudinal data, this gets harder...") but explicitly state it is out of scope. It is better they master the static mediator case than fail to grasp it while wrestling with time-varying confounding.

  **Final Recommendation:** Replace your rule with: **"If it happens after the exposure, do not stratify unless you specifically want to block that pathway."** This is simpler, temporally intuitive for clinicians, and prevents the Mediator/Collider errors 90% of the time.
