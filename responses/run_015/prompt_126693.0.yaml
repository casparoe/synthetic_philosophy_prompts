      *   *Harm vs. Obligation:* She is definitely mushing them. Philosophers like Joel Feinberg (rights of the dead) argue that while the dead cannot be *harmed* in an experiential sense, they can be *wronged*. Violating a will is the standard example. The dead person has an ante-mortem interest that persists post-mortem.
      *   *Dignity:* Her definition of dignity is too narrow. Dignity is often social and reputational, not just internal feeling. Defamation of the dead is a legal and ethical concept precisely because reputation survives the body.
      *   *Utility to the Living:* This is a utilitarian override. It's a valid perspective, but it doesn't negate the deontological duties to the dead. It just outweighs them in her framework. But she claims there *are* no duties, not that they are outweighed. That's a category error.

