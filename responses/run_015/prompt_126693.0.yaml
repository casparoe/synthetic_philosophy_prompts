answer: |-
  Your friend is wrong. Her summary does not survive correction, and her conclusion that accuracy "basically doesn't matter" collapses once you untangle the philosophical errors she is making. She is presenting a specific, contested utilitarian viewpoint as if it were settled metaphysical fact, and she is mushing together distinct concepts to make her case work.

  Here is the committed breakdown of where her argument fails.

  ### 1. She Mashes "Harm" and "Obligation" Together
  Your friend's core premise is: *Dead people can't feel pain, therefore we can't owe them anything.* This is a category error. In philosophy, there is a critical distinction between **harming** someone (setting back their interests in a way they experience) and **wronging** someone (violating a duty owed to them).

  The "standard philosophical take" is actually not that we owe the dead nothing; it's that the *nature* of the obligation changes. Joel Feinberg, one of the leading philosophers on the rights of the dead, argued convincingly that while the dead cannot be *harmed* (because they have no conscious welfare to damage), they can be *wronged*.

  Why? Because human beings have "ante-mortem interests" that extend beyond their death. When you are alive, you have an interest in how your legacy is handled, whether your will is executed, or how your life story is told. Death does not magically erase the validity of those interests while you were alive. If you burn down a house after the owner dies, you haven't harmed the owner (they don't know), but you have violated their property rights, which persist.

  Your friend claims obligations run *only* to the living viewers. This is false. We have obligations to the dead based on **fidelity** and **promissory duty**. If a dying person asks you to tell the truth about their life, and you lie for "drama," you have broken a promise. The fact that they aren't around to feel betrayed doesn't mean the betrayal didn't happen. She is conflating *psychological impact* with *moral violation*.

  ### 2. Her Definition of Dignity is Philosophically Reductive
  She argues that dignity requires a "conscious subject" to feel indignity, and therefore posthumous dignity is incoherent. This is a shallow, purely psychological definition of dignity that ignores the **social and reputational** reality of what dignity is.

  Dignity is not just a feeling in the brain; it is a status accorded by a community. To have dignity is to hold a certain standing in the moral universe. When a biopic fabricates a scene where a real person acts cowardly, cruelly, or out of character, it attacks their **moral reputation**, which is an asset that survives death.

  Philosophers who argue for posthumous dignity are not "confused"; they are arguing that a person's narrative identity is a form of property. If I write a biography of you that claims you were a pedophile when you weren't, I have damaged your "dignity" not because you feel shame in the grave, but because I have altered your standing in the human community. Your friend is treating dignity as a private sensation (like a headache) rather than a public fact (like a credit score). Her dismissal of it isn't a sophisticated philosophical critique; it's a semantic sleight of hand.

  ### 3. The "Moral Duty" to Lie is Dangerous
  Her claim that artistic license is a "moral duty" when it illuminates systemic forces is the most ethically precarious part of her argument. This treats the real human being as a **means to an end**.

  In Kantian ethics (which she seems to be ignoring), you cannot use a person merely as a tool for education, even if they are dead. If you fabricate a scene where a historical figure says something they never said to "teach the audience about racism," you are instrumentalizing that person. You are turning them into a puppet for your lesson.

  Furthermore, this creates a truth problem. If the audience learns a "truth" about the era based on a lie about the person, the history is corrupted. We don't just learn about "systemic forces" in a vacuum; we learn them through the actions of agents. If you fake the agent's actions, you are teaching a false causal link. You are telling the audience that *this person* fought *this fight* in *this way*, when they didn't. That isn't artistic license; that's historical fraud disguised as pedagogy.

  ### The Verdict
  Your friend's argument relies on the idea that ethics is solely about minimizing present suffering or maximizing present knowledge. That is one ethical framework (utilitarianism), but it is not the "standard philosophical take," nor is it the only valid one.

  Once you correct her errors:
  1.  **Harm vs. Wronging:** You acknowledge that you can wrong the dead by violating their ante-mortem interests, even if they feel no pain.
  2.  **Dignity:** You acknowledge that dignity is a reputational status, not just a conscious feeling.
  3.  **Means vs. Ends:** You acknowledge that using a real person's likeness to teach a lesson they didn't actually teach is a violation of their integrity.

  **Accuracy matters.** It matters because truth-telling is a duty we owe to the past, not just a utility we provide to the future. Her conclusion that accuracy is "sentimental nostalgia" fails because it ignores that our relationship with the dead is built on trust and fidelity. If we decide the dead have no rights to their own story, we undermine the very basis of history, wills, and legacy. She is not being fair; she is using a half-baked metaphysical claim to justify dramatic convenience.
