answer: |-
  ### 1. Preliminary thinking

  The central difficulty in *On the Use and Abuse of History for Life* is not the taxonomy itself, but the criterion for its application. Students routinely map the three species onto examples without asking how one decides which species is needed. The genuine crux lies in the condition for *critical* history. Nietzsche argues we must judge and condemn the past to live, but he also admits the judge is a product of that past. How can the past judge itself? This self-referential loop is the engine of the essay, yet it is ignored in favor of labeling.

  I have chosen this crux because the Ashkirk case forces it. The Local Historians wish to judge the founders, but they are descendants of foremen who broke the strike (complicit) and depend on the Trust (the institution of the founders) for evidence. A recitation answer will simply label them "critical." A thinking answer must ask whether Nietzsche allows critical history when the judge is implicated. This requires analyzing "plastic power" and the "horizon," not just definitions. It defeats the strategy because the labels fit, but the *possibility* of the act does not.

  ### 2. The question stem

  **Question 4**

  In the post-industrial town of Ashkirk, a steelworks closed in the 1980s and the site has stood derelict since. Three campaigns are now competing for it. A preservation trust, founded and endowed by the family that owned the works, wishes to conserve the rolling mills, the company ledgers and the adjacent workers' housing as an intact industrial settlement; its founding deed obliges it to commemorate the works' contribution to the town and forbids it from taking a position on any matter of local dispute. A development consortium wishes to demolish most of the site and build an innovation campus, and justifies itself by constant appeal to one much-praised regeneration elsewhere in Europe, whose example it hopes to equal and surpass. A group of local historians — several of them descendants of the foremen who broke the walkout of the 1920s — wishes to publish a documented account of company housing, the company shop, the eviction of striking families and the blacklist, so that the town may, in their phrase, sit in judgement on its own founders and thereby cease to be determined by them. The twist is that their evidence lies in the company archive, which is the trust's property, and the trust has indicated that it will grant access only for a commemorative volume produced as part of its anniversary programme. None of the three groups is interested in the past for its own sake; each wants a particular past.

  Identify which of Nietzsche's three species of history each campaign instantiates. Then, assess whether Nietzsche's framework can rank these campaigns. You must pay particular attention to whether critical history is available at all to agents who are themselves products and beneficiaries of what they propose to judge, and whose evidence is held by the institution they indict. A bare application of the three labels will not be rewarded.

  ### 3. Model answer

  The three campaigns in Ashkirk map neatly onto Nietzsche's typology, but this mapping reveals a tension in Nietzsche's account of critical history rather than resolving the conflict. The Preservation Trust exemplifies antiquarian history. It seeks to conserve the site intact, motivated by piety toward origins. Nietzsche describes this as the history of the preserver, who looks back with gratitude to where he came from. The Trust's deed, which forbids taking positions on disputes, mirrors the antiquarian's tendency to treat everything from the past as equally sacred, risking the mummification of life where the past stifles the present. The Development Consortium instantiates monumental history. They appeal to a great example elsewhere in Europe, hoping to emulate and surpass it. This fits Nietzsche's description of those who need inspiration from past greatness to believe great things are possible again. However, Nietzsche warns that monumental history often distorts the past to make it fit present ambitions, ignoring the specific conditions that made the original success possible.

  The Local Historians clearly aim for critical history. They wish to sit in judgement on the founders to cease being determined by them. Nietzsche argues this is necessary when the past becomes a tyrant. However, the Ashkirk case exposes the paradox at the heart of critical history. Nietzsche acknowledges that the judge is historically conditioned; we cannot step outside history to judge it. In Ashkirk, the historians are descendants of foremen who broke the strike. They are beneficiaries of the very power structure they wish to indict. Furthermore, their evidence is held by the Trust. Nietzsche suggests critical history requires "plastic power," the ability to heal wounds and replace a lost past with a new one. But can agents who are complicit in the past generate this power?

  If we apply Nietzsche's criterion of "life," the ranking becomes difficult. "Life" here does not mean biological survival or economic success, but the capacity to assimilate the past without being crushed by it. The Trust risks being crushed by reverence; the Consortium risks being crushed by a false imitation. The Historians risk being crushed by the impossibility of impartial judgement. Nietzsche suggests critical history is only possible if one can create a "second nature" to replace the first. The Historians want to stop being determined by the founders, which implies creating a new horizon. But because their evidence is controlled by the Trust, their critical act is dependent on the antiquarian institution. This suggests that in Ashkirk, pure critical history is impossible. The historians are trapped within the antiquarian horizon they seek to break.

  Therefore, Nietzsche's framework cannot simply rank the campaigns as good or bad. Instead, it diagnoses the health of each. The Trust is healthy only if its piety does not prevent new growth. The Consortium is healthy only if its emulation does not become a caricature. The Historians are healthy only if their judgement leads to liberation rather than resentment. Nietzsche warns that critical history must issue in something new, not just destruction. If the Historians publish their account but remain dependent on the Trust's archive, they have not achieved the liberation Nietzsche describes. They have merely added a critical footnote to an antiquarian project.

  Ultimately, the case shows that the three species are not static categories but dynamic needs. A culture needs all three, but must know when to use them. Ashkirk suffers because each group is stuck in one mode. The Trust cannot judge, the Consortium cannot remember, and the Historians cannot create the new past they need because they lack the plastic power to independent evidence. Nietzsche's essay implies that a healthy culture would integrate these needs: preserving the site (antiquarian), using it for inspiration (monumental), and acknowledging the injustices (critical) without being paralyzed by them. The failure in Ashkirk is not that one group is right, but that the town lacks the plastic power to hold these tensions together. The framework does not solve the dispute, but it reveals that the dispute is a symptom of a culture struggling to define its horizon.

  ### 4. Marking scheme

  **Total: 25 Marks**

  1.  **Correct Identification with Nuance (5 marks)**
      *   Identifies Trust as Antiquarian, Consortium as Monumental, Historians as Critical.
      *   *Fumble:* Mapping labels without explaining the *need* driving each (e.g., calling Trust antiquarian just because it is old).
  2.  **Analysis of the Critical History Paradox (5 marks)**
      *   Addresses the self-referential problem: judges are products of the past they judge (descendants of foremen).
      *   *Fumble:* Asserting critical history is straightforwardly possible without noting the complicity constraint.
  3.  **Understanding of "Life" and Plastic Power (5 marks)**
      *   Defines "Life" as plastic power/horizon, not biological survival or economic regeneration.
      *   *Fumble:* Equating "Life" with the Consortium's economic development or biological survival of the town.
  4.  **Engagement with the Archive Constraint (5 marks)**
      *   Discusses how Trust control of evidence limits the Historians' critical capacity.
      *   *Fumble:* Ignoring the archive twist or treating it as a mere logistical hurdle rather than a philosophical block.
  5.  **Conclusion on Ranking/Integration (5 marks)**
      *   Argues whether Nietzsche allows a ranking or demands integration of the three species.
      *   *Fumble:* Declaring one species superior (e.g., Critical is best) without textual warrant.

  **Penalties:**
  *   Importing Will to Power/Eternal Recurrence: -5 marks.
  *   Treating "Life" as biological survival: -3 marks.
  *   Reducing Monumental to "Great Men" theory without nuance: -2 marks.

  ### 5. Plausible-sounding answers that ought to lose marks

  1.  "The Historians are clearly doing critical history, which Nietzsche prefers because it frees us from the past, so they should win the dispute."
      *   *Error:* Nietzsche does not privilege one species universally; this misses the need for balance and the condition of plastic power.
  2.  "The Consortium represents life best because they want to build something new and ensure the town survives economically."
      *   *Error:* Reduces Nietzsche's concept of "Life" to biological survival or economic growth rather than cultural assimilation.
  3.  "This situation shows the Will to Power in action, as each group tries to dominate the site to impose their values."
      *   *Error:* Anachronism; these concepts belong to later periods and are not in *Untimely Meditations*.
  4.  "The Trust is engaging in collective memory construction, while the Historians are practicing counter-memory."
      *   *Error:* Imports contemporary sociology of memory rather than engaging with Nietzsche's specific conceptual machinery.

  ### 6. Discrimination guide

  **First-Class (70+)**
  *   Explicitly grapples with the impossibility of critical history in the Ashkirk case due to the judge's complicity.
  *   Distinguishes clearly between "Life" as plastic power versus "Life" as success/survival.
  *   Argues that the three species are dynamic needs rather than static camps, suggesting the town's failure is a lack of integration.
  *   Notes that Nietzsche's own essay performs a critical act while relying on philological (antiquarian) evidence.

  **Upper Second (60–69)**
  *   Correctly maps the three cases to the three species with textual support.
  *   Identifies the problem of the historians' complicity but resolves it too easily (e.g., "they just need more power").
  *   Understands "Life" correctly but does not fully explore the archive constraint's philosophical implication.
  *   Concludes that Nietzsche would support the Historians without qualifying the risk of resentment.

  **Bare Pass (40–49)**
  *   Correctly labels the three groups (Trust=Antiquarian, etc.).
  *   Defines the three species accurately using standard terminology.
  *   Fails to address the paradox of critical history or the archive constraint.
  *   Treats "Life" vaguely or conflates it with general progress.
  *   Structure is clear but lacks analytical depth beyond definition.
