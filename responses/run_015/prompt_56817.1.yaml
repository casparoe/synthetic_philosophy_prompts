answer: |-
  This is an excellent EPQ pivot point. Your teacher is reaching for a classic distinction in social ontology: the difference between *conventions* (arbitrary coordination solutions) and *norms* (rules with normative force). The grammar analogy is the standard philosophical shorthand for "convention," but as you've spotted, it leaks when applied to the broader category of "social norms."

  As requested, I will not sit on the fence. I will argue that the analogy is structurally unsound for your teacher's purposes, that his second claim is empirically false, and that his first claim is ethically dangerous because it relies on a category error.

  Here is the breakdown.

  ### 1. Three Candidate Alignments
  Before we judge the analogy, we must decide *how* it is supposed to work. There are three ways philosophers typically map grammar onto norms. We need to see which one your teacher is using.

  *   **Candidate A: The Descriptive Regularity Model.**
      *   *Idea:* Grammar is just what people *do* say; Norms are just what people *do* do.
      *   *Verdict:* Too weak. This ignores the "ought." If I say "I ain't got none," I haven't broken a law, but if I cut in a queue, I have violated an expectation that carries pressure. This model fails to capture the sanctioning you noticed in the common room.
  *   **Candidate B: The Lewisian Coordination Equilibrium.**
      *   *Idea:* Both are solutions to coordination problems. We speak English to understand each other; we drive on the left to avoid crashing. Neither is "true," just useful.
      *   *Verdict:* This is the strongest philosophical fit (David Lewis, *Convention*, 1969). It explains the "no author" and "drift" aspects well. However, it struggles with moral norms (don't steal) which aren't arbitrary coordination points.
  *   **Candidate C: The Constitutive Identity Model.**
      *   *Idea:* Grammar constitutes what counts as "speaking English"; Norms constitute what counts as "being one of us." Violations mark you as an outsider.
      *   *Verdict:* This captures the social exclusion aspect ("not one of you"). But it implies norms are static identity markers, which makes intentional change impossible.

  **Decision:** Your teacher is mixing **Candidate B** (to explain the drift/lack of design) with **Candidate C** (to explain the social marking). This hybrid is where the contradiction lies.

  ### 2. Explicit Correspondence Table

  | Grammar Domain | Social Norm Domain (Teacher's View) |
  | :--- | :--- |
  | **The Sentence** | A specific social action (e.g., sitting at a table, speaking in a meeting). |
  | **The Native Speaker** | A socialized member of the community (e.g., an employee, a student). |
  | **The Solecism** | A norm violation (e.g., sitting at the wrong table, using an outdated slur). |
  | **The Slow Drift** | Cultural evolution (e.g., changing attitudes toward smoking over 40 years). |
  | **Inability to Articulate** | Tacit knowledge (e.g., "you just know not to do that"). |
  | **The Sanction** | Social marking/exclusion (e.g., "raised eyebrow" or "not one of us"). |
  | **The Authority** | None (no Academy of English). |

  ### 3. Where the Mapping Breaks

  We need to sort these breakdowns into those that are merely interesting (beside the point) and those that destroy your teacher's argument (threatening).

  **Beside the Point (Benign Disanalogies):**
  *   **Complexity:** Grammar is vastly more complex and rule-bound than most social norms. *Irrelevant to the claims.*
  *   **Universality:** All humans have grammar; not all humans share specific norms. *Irrelevant to the mechanism of change.*
  *   **Acquisition:** We acquire grammar largely biologically/critically in childhood; norms are acquired throughout life. *Explains why norms might be easier to change, but doesn't refute the drift.*

  **Threatening Disanalogies (The Killers):**
  *   **The Nature of the Sanction:** A grammar mistake signals *incompetence* ("He doesn't know the language"). A norm violation signals *untrustworthiness* or *immorality* ("He doesn't respect us"). You can forgive incompetence; you punish defiance.
  *   **The Possibility of Engineering:** The Swedish traffic switch (1967) proves norms *can* be changed by decree if the coordination benefit is clear. The Académie Française proves grammar *cannot* be effectively changed by decree.
  *   **The Moral Content:** Grammar is value-neutral (SVO vs. SOV order is not "good"). Many norms are value-laden (fairness, loyalty). You cannot derive an "ought" from a grammatical "is," but norms *are* "oughts."

  ### 4. Imported Features (What the analogy smuggles in)
  By using the grammar analogy, your teacher is quietly importing two features of language that norms do not possess:
  1.  **Value Neutrality:** The analogy assumes norms are arbitrary (like driving on the left vs. right). This ignores norms that protect welfare (like "don't freeloader").
  2.  **Inertia:** The analogy assumes norms are as hard to shift as syntax. This ignores the fact that norms can shift rapidly (e.g., mask-wearing norms in 2020) when the underlying incentives change.

  ### 5. Verdict on the Two Claims

  I am committing to the following position: **Both claims fail, but Claim 2 is demonstrably false, and Claim 1 is ethically hazardous.**

  **Claim 1: "It is confused to blame people for norm violations that were normal when they were young."**
  *   **Verdict:** **False (in the moral domain).**
  *   **Reasoning:** This claim only holds for *conventional* norms (e.g., dress codes, forms of address). It collapses for *moral* norms. If your grandfather held racist views that were "normal" in 1975, the grammar analogy suggests we shouldn't blame him because he was just following the "syntax" of his time. This is the "Nuremberg Defence" applied to culture. Because norms carry *moral* weight (unlike grammar), we hold agents responsible for updating their moral software. The disanalogy of **Sanction Type** (competence vs. character) does the work here. We blame character failures, not competence failures.

  **Claim 2: "You can't change a norm on purpose... you just have to wait for the drift."**
  *   **Verdict:** **Empirically False.**
  *   **Reasoning:** The Sweden example (Högertrafikomläggningen) is a sufficient counter-example. Governments, HR departments, and activists change norms intentionally all the time. They do it by changing the *incentives* (laws, firing, shaming). Grammar cannot be changed this way because there is no central enforcer and no penalty for "incorrect" speech other than misunderstanding. Norms have enforcers. The disanalogy of **Engineering** kills this claim.

  ### 6. The Single Critical Disanalogy

  If I must pick the one disanalogy doing the most work, it is **Normative Force (The "Ought").**

  Grammar is descriptive; it describes how a language functions. If everyone started putting adjectives after nouns tomorrow, English would just *be* different. It wouldn't be *broken*.
  Norms are prescriptive; they dictate how society *should* function. If everyone started freeloading on group projects, the system wouldn't just be *different*; it would be *unjust* or *broken*.

  Because norms have **Normative Force**, people feel entitled to enforce them (sanctions), and people feel entitled to reform them (activism). You cannot have a "grammar activist" campaigning for the abolition of the subjunctive mood in the way you can have a "social activist" campaigning for the abolition of a dress code. The presence of an "Ought" allows for intentional change (Claim 2 fails) and justifies blame (Claim 1 fails).

  ### 7. A Better Analogy: Desire Paths (Footpaths)

  The grammar analogy is too static and biological. A better analogy for social norms, which keeps the "no-author" insight without the "no-change" error, is **Desire Paths in a Park.**

  *   **No Author/Design:** Like norms, desire paths are not drawn by an architect. They emerge from thousands of individual choices (people taking the shortcut across the grass).
  *   **Drift:** They shift over time as vegetation grows or new buildings open.
  *   **Tacit Knowledge:** You know where to walk without looking at a map.
  *   **Crucial Difference (Why it's better):**
      1.  **Intentional Change:** The park authority *can* decide to pave a desire path, or put a fence up to stop one. They can engineer the flow intentionally (refuting Claim 2).
      2.  **Sanctions:** If you walk on a protected flowerbed (a protected norm), a gardener will shout at you. If you walk on the dirt path, no one cares. This distinguishes between *conventions* (dirt paths) and *moral/rules* (flowerbeds) (refuting Claim 1).

  **Why this wins for your EPQ:**
  It preserves your teacher's best insight (norms emerge organically from human interaction, not top-down design) but corrects his fatal error (that they are therefore immune to human agency). It allows you to argue that while we don't *design* norms from scratch, we *garden* them. We can prune, pave, or redirect.

  ### Summary for your Argument
  1.  **Reject the Grammar Analogy:** It conflates *conventions* (arbitrary) with *norms* (often moral).
  2.  **Adopt the Desire Path Analogy:** It captures emergence *and* the possibility of intervention.
  3.  **Refute Claim 1:** We blame people for moral norm violations because norms signal trustworthiness, not just competence.
  4.  **Refute Claim 2:** Norms can be engineered (Sweden, Laws, HR policies) because they rely on incentives, not just unconscious habit.

  Your teacher is right that norms are not *legislation*, but he is wrong that they are not *governable*. Use the Desire Path analogy to show that we are not just speakers of a language we can't change; we are gardeners of a landscape we can shape.
