answer: |-
  You have stumbled onto one of the oldest, hardest, and most fertile problems in the philosophy of language and metaphysics. You are not tripping over a writing flaw; you are tripping over the nature of reality (or at least, the nature of how we represent it).

  Here is the map of the territory you are standing in.

  ### 1. Does it have a name?

  Yes. The overarching problem is called **The Unity of the Proposition**.

  Your first complaint (the list vs. the thought) is the core of this problem. Your second complaint (the dog/postman reversal) is a specific sub-problem often called **The Problem of Direction** (or the problem of the "order of terms").

  Your friend was right about **Bradley's Regress**. That is the specific engine driving your first complaint. F.H. Bradley argued that if you have a thing (the road) and a property (being mined), you need a relation (exemplification) to stick them together. But then you need a relation to stick the relation to the thing, and so on, forever. You described this perfectly: "adding the sticking-together as one more ingredient... now I've got four items."

  ### 2. Are your two complaints one or two?

  They are two sides of the same coin.

  *   **Complaint 1 (Unity):** Why is "Road + Mined" a *judgment* rather than a *pile*? What gives it the power to be true or false?
  *   **Complaint 2 (Direction):** Given that it is a judgment and not a pile, how do we know which way the arrow points?

  If you solve Unity, you usually solve Direction. If you can explain what makes the ingredients cohere into a single truth-apt thing, you should also be able to explain why that coherence distinguishes "Dog bites Man" from "Man bites Dog."

  Most philosophers treat them as a single puzzle: **What distinguishes a proposition from a mere list of its constituents?**

  ### 3. What are the edges? (What it is *not*)

  To understand where the problem lies, it helps to know where it stops.

  **It is not a grammatical problem.**
  You noticed that "The dog bit the postman" and "The postman bit the dog" look like the same arrangement. You are correct. Syntax (word order) is just a signal we use to convey the logical structure, but the logical structure exists prior to the sentence. If you speak in a language with free word order (like Latin or Russian), the meaning remains stable despite the shuffling. The problem is not about where the words go; it is about how the *concepts* bind.

  **It is not a psychological problem.**
  This is not about how your brain fires neurons to store the memory. You could map every synapse involved in thinking about the mined road, and you would still have a "list" of physical events. You would not find the *truth* in the chemistry. The problem is about *content*, not mechanism.

  **It is not Ambiguity.**
  Ambiguity is when a word has two meanings. This is not that. This is about how *any* meaning is possible at all. It is the precondition for ambiguity.

  ### 4. Has it been solved?

  The honest answer is **no**. It has been managed, dissolved, or renamed, but not universally solved. Here are the three main ways philosophers have tried to close the gap, and why they might matter to you as a writer.

  **A. The Fregean Solution (Unsaturatedness)**
  Gottlob Frege argued that your "list" analysis is wrong from the start. You are treating the verb ("will be mined") as an object, like the road. He said concepts are **unsaturated**. They have holes in them.
  *   *The Road* is an object (saturated).
  *   *Being Mined* is a function (unsaturated).
  You don't need a "connector" to stick them together. The nature of the concept *is* to connect. It's like a puzzle piece. You don't need glue to stick a male end to a female end; their shapes dictate the union.
  *   *Critique:* This stops the regress, but it feels mystical. What is an "unsaturated object"? It's hard to picture.

  **B. The Wittgenstein Solution (Showing vs. Saying)**
  In his early work (*Tractatus*), Ludwig Wittgenstein argued that you cannot *state* the unity of a proposition; you can only *show* it.
  If you try to write down "The road is mined," the fact that you have written a sentence *shows* the unity. If you try to write "The unity of 'road' and 'mined' exists," you have just created another list.
  *   *For a writer:* This suggests that you cannot describe the thought's structure from the outside. You can only embody it in the structure of the prose itself.

  **C. The Russellian Abandonment**
  Bertrand Russell spent decades fighting Bradley's Regress. Eventually, he largely gave up on the idea that propositions are objective things "out there." He moved toward a view where the unity is supplied by the *mind* that entertains the thought. The "stickiness" is an act of judgment, not a feature of the ingredients.

  ### 5. Why this drives a novelist mad (and how to use it)

  You are writing in **close third person**. This POV promises the reader access to the character's consciousness. But consciousness experiences the *unity*, while language is inherently *sequential* (a list of words).

  When you write: *He thought the coast road would be mined.*
  You are forcing a holistic mental state (the Unity) into a linear string of symbols (the List). Your intuition is screaming at you that you are lying, because the sentence *looks* like a list of ingredients, even though it *acts* like a thought.

  **The "Gap" is the Medium.**
  The frustration you feel is the friction between **Experience** (which is immediate, unified, and true/false) and **Description** (which is sequential, atomic, and neutral).

  **How to handle it in the prose:**
  Do not try to solve Bradley's Regress in your sentences. If you try to explain *how* the character connects the road to the mining, you will fall into the regress trap in the narrative.

  Instead, lean into the **Fregean** or **Wittgensteinian** intuition:
  1.  **Trust the Verb:** The verb carries the "unsaturated" weight. Don't nominalize the thought.
      *   *Weak (List-like):* He had a thought about the mining of the road.* (This turns the action into an object, inviting the regress).
      *   *Strong (Unified):* He knew the coast road would be mined.* (The verb "knew" performs the unification).
  2.  **Don't Explain the Glue:** Your character does not experience the "sticking together." They experience the result. Close third person should report the *result* of the thought, not the *assembly* of the thought.
      *   If you write: *He put the road and the mines together in his head,* you are forcing the reader to do the work of unity, and it feels clunky.
      *   If you write: *The coast road lay mined in his mind,* the unity is immediate.

  ### Summary
  *   **Name:** The Unity of the Proposition (driven by Bradley's Regress).
  *   **Relation:** Your two complaints are the Unity Problem and the Direction Problem; they are effectively the same issue.
  *   **Status:** Unsolved. It is a fundamental limit of language.
  *   **Writing Advice:** The gap you feel is real. It is the gap between *thinking* and *writing*. Do not try to bridge it by explaining the connection. Bridge it by using verbs that act as functions (Frege) rather than nouns that act as objects. Let the sentence structure *show* the unity (Wittgenstein) rather than *describing* it.

  You are tripping over the edge of what language can do. That is exactly where a novelist wants to be.
