          6.  **Defense:** Provide reasons.
          7.  **Flagging:** Identify where practice fails to decide between accounts.

  2.  **Analyze the Philosophical Concepts:**

      *   **Etiological Theory of Function (Millikan, Neander):** A trait's function is what it was *selected for* (evolutionarily or developmentally). It implies a "normal" or "proper" state based on history. Function is normative; doing something else is malfunction, even if it works well.
      *   **Causal-Role Theory of Function (Cummins):** A trait's function is its current causal contribution to a containing system's capacity. If it helps the system walk, it functions. No reference to history or "naturalness."
      *   **The TKR Case:** The prompt claims TKR is judged on "kinematic fidelity" to the *pre-arthritic* or *natural* profile. This sounds etiological (restoring the *original* design).
