answer: |-
  ### 1. The Implicit Account of Biological Function

  The orthopedic practice described in the prompt implicitly presupposes an **Etiological Theory of Function** (often associated with Ruth Millikan or Larry Wright).

  Under this view, the "proper function" of a biological trait is determined by its history—specifically, what it was selected for (evolutionarily) or designed to do (developmentally). By prioritizing "kinematic fidelity" to the *pre-arthritic* or *natural* profile, the practice treats the knee's function as fixed by its original biological blueprint. A knee replacement that allows a patient to walk efficiently but alters the rotational mechanics of the joint is deemed "inferior" not because it fails to contribute to locomotion (causal role), but because it deviates from the historical norm of how that specific biological system *ought* to operate.

  Conversely, the assessment of prosthetic limbs aligns with a **Causal-Role Theory of Function** (associated with Robert Cummins). Here, function is defined strictly by the component's current contribution to the capacity of the containing system. If the prosthetic limb enables walking (the system capacity), it functions successfully, regardless of whether its mechanics mimic a biological leg.

  ### 2. Reconstruction of the Implicit Theory

  To reconstruct the orthopedic norm strictly, we must separate what the practice *requires* (necessary conditions for success) from what it *accommodates* (secondary benefits).

  *   **Strict Requirement (The Etiological Standard):** The prosthesis must replicate the specific kinematic chain of the native knee (e.g., femoral rollback, internal/external rotation during flexion). This is treated as a normative standard derived from the patient's developmental history. Deviation constitutes a "malfunction" of the restoration, even if the patient is pain-free.
  *   **Accommodation (The Causal Constraints):** Pain reduction and load-bearing stability are treated as baseline constraints. They are necessary for the device to be usable, but they are not sufficient for the device to be considered a successful *restoration of function*. They accommodate the patient's immediate suffering but do not satisfy the teleological goal of returning the organ to its proper historical state.

  **Does the practice treat function as fixed by history?**
  Yes. By making "kinematic fidelity" an independent success criterion, the practice asserts that the knee has a "true" state defined by its past (pre-arthritic) condition. It rejects the notion that function is solely defined by the current causal contribution (walking), insisting instead that *how* the walking is achieved matters morally and medically because it reflects the biological history of the organism.

  ### 3. Inconsistency vs. Underdetermination

  The sharp contrast between TKR (Total Knee Replacement) and limb prosthetics reveals a **philosophical inconsistency** in medical norms, rooted in a metaphysical distinction between "repair" and "replacement."

  *   **The Inconsistency:** Both interventions aim to restore the organism's capacity for locomotion. In the TKR scenario, the biological organ is preserved but augmented; in the prosthetic scenario, the organ is removed and substituted. Philosophically, if the goal is the welfare of the patient (the containing system), the metric should be the same: causal contribution to locomotion.
  *   **The Source of Error:** The inconsistency arises because orthopedics treats the TKR as a *restoration of an organ* (invoking etiological norms), whereas prosthetics are treated as *tools for an organism* (invoking causal-role norms). This creates a "naturalistic fallacy" in surgery: the assumption that because the knee was biological, its function must remain tied to its biological history, whereas a missing limb, once gone, allows for purely engineering-based solutions.
  *   **Verdict:** This is not merely underdetermination; it is a normative conflict. The field applies two different theories of function to two clinically similar problems based on the arbitrary boundary of tissue preservation.

  ### 4. Definite Stand: Adopting a Pure Causal-Role Account

  I argue that orthopedic evaluation **should abandon the etiological view and adopt a pure Causal-Role account.** The "natural" kinematic profile is not inherently valuable unless it causally contributes to better long-term outcomes (longevity, energy efficiency). Prioritizing kinematic fidelity for its own sake privileges metaphysical "naturalness" over patient welfare.

  If we replaced the implicit etiological view with a pure causal-role account, the following specific changes would be required:

  #### A. Surgical Evaluation Metrics
  *   **Current:** Scores penalize devices that stabilize the knee but alter rotation (deviation from natural kinematics).
  *   **Required Change:** Evaluation would focus exclusively on **System Capacity Metrics**.
      *   *Eliminate:* "Kinematic Fidelity" scores.
      *   *Adopt:* Energy cost of transport (metabolic efficiency), implant survivorship (longevity), and activity levels (steps per day).
      *   *Rationale:* If a "non-natural" motion pattern allows a patient to walk further with less metabolic cost and less wear on the polyethylene, it is functionally superior under a causal-role account.

  #### B. Device Design Priorities
  *   **Current:** Engineers design cams, posts, and bearing surfaces specifically to mimic the complex, multi-axial rotation of the native knee, often adding complexity and potential failure points to achieve "biomimicry."
  *   **Required Change:** Design for **Mechanical Optimality**.
      *   *Shift:* Move toward hinge designs or fixed-bearing systems if they provide greater stability and lower wear rates, even if they restrict rotation to a single plane.
      *   *Rationale:* Under a causal-role view, the knee is a mechanism within the locomotion system. If a simpler mechanism contributes better to the system's longevity and reliability, "unnatural" mechanics are acceptable. The goal is locomotion, not mimicry.

  #### C. Patient Counseling
  *   **Current:** Surgeons promise a "normal feeling knee" and warn that the knee "won't bend like your old one" as a caveat of failure.
  *   **Required Change:** Counseling focused on **Functional Utility**.
      *   *Shift:* Explicitly decouple "feeling normal" from "working well." Counselors would explain: "This device may not rotate exactly like your biological knee, but it will allow you to hike/walk/run with less pain and lower risk of revision."
      *   *Rationale:* This manages expectations by aligning the definition of success with causal output (walking) rather than etiological restoration (feeling like the past).

  ### 5. Defense of the Stand

  1.  **Patient Welfare over Biological Purity:** The primary telos of medicine is the reduction of suffering and the enhancement of capability. An etiological view risks sacrificing these goods on the altar of "naturalness." If a patient walks better with a mechanically aligned (causal) knee than a kinematically aligned (etiological) knee, the etiological view forces the surgeon to deem the better outcome as "inferior" based on a biomechanical abstraction.
  2.  **Variability of the "Natural":** The etiological view assumes a fixed "pre-arthritic" standard. However, human kinematics vary wildly between individuals. Restoring a "natural" profile is often restoring a profile that was already statistically unique or potentially contributory to the arthritis in the first place. A causal-role account avoids the trap of trying to replicate a potentially flawed historical state.
  3.  **Consistency with Medical Engineering:** We do not demand that heart valves replicate the exact turbulence of a biological valve if a smoother mechanical flow reduces clot risk. We do not demand intraocular lenses replicate the exact chromatic aberration of the crystalline lens if the artificial one provides sharper vision. Orthopedics is inconsistent in demanding kinematic fidelity for knees while accepting functional utility for other organ replacements.

  ### 6. Flagging Underdetermination in Current Practice

  While I advocate for a decisive shift, it must be flagged that current surgical practice **genuinely fails to decide between these two accounts** in the debate over **Kinematic Alignment (KA) vs. Mechanical Alignment (MA).**

  *   **Mechanical Alignment (Causal-Role lean):** Aligns the leg to a neutral mechanical axis (0 degrees) to optimize load distribution and implant longevity. This prioritizes the causal contribution (load bearing) over the patient's specific anatomical history.
  *   **Kinematic Alignment (Etiological lean):** Aligns the implant to match the patient's specific pre-arthritic joint lines, prioritizing the restoration of the individual's historical kinematic pattern.

  The fact that high-quality randomized control trials (such as the *KA vs. MA* trials) show equivalent clinical outcomes for both methods suggests the field is currently **underdetermined**. Surgeons are currently permitted to choose either philosophy without a consensus on which definition of "function" yields superior patient welfare. This ambiguity confirms that the "etiological requirement" described in the prompt is not a settled scientific fact, but a normative preference that is actively contested within the discipline. Until this debate is resolved by evidence showing one method definitively improves *causal* outcomes (longevity/function), the practice remains philosophically unstable.
