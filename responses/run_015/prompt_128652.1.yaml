answer: |-
  ### M.A. Comprehensive Examination: Archaeological Theory & Method
  **Section: Interpretive Inference in Stratigraphic Contexts**
  **Time Allowed: 90 Minutes**

  **Question 1: The Stratigraphic Belief Problem**

  Consider the following hypothetical stratigraphic sequence from a multi-phase circular enclosure:

  1.  **Structure:** A circular ditch-and-bank enclosure is rebuilt three times (Phases I, II, and III) in the exact same location.
  2.  **Central Feature:** Each phase contains a central hearth complex that is deliberately extinguished and covered before the next is built.
  3.  **Artifact Distribution:** In all three phases, imported obsidian blades are found *only* in the northeast quadrant of the interior. No obsidian is found in the other three quadrants.
  4.  **Mortuary Data:** In Phase I, human burials within the enclosure are oriented North-South. In Phase III, burials are oriented East-West. Phase II shows a mix of both.

  **Task:**
  Construct an argument interpreting this sequence as either (A) the product of a stable **cosmological institution** (shared ritual beliefs governing space) or (B) the product of **functional coordination** (practical agreements on space use without shared belief).

  Your essay must:
  1.  Use the spatial distribution (obsidian) and stratigraphic continuity (hearths) to support your chosen interpretation.
  2.  Explain how your interpretation accounts for the change in burial orientation between Phase I and III.
  3.  Explicitly identify the **epistemic gap**: the specific point in your reasoning where you must make an assumption that cannot be verified by the material record alone.

  *Note: Do not cite specific theorists or site reports. Rely on logical reasoning from the provided data.*

  ***

  ### Model Answer

  **Interpretation: The Case for a Cosmological Institution**

  While functional coordination can explain many aspects of site formation, the specific constraints observed in this hypothetical enclosure—particularly the rigid spatial restriction of high-value goods—suggest the operation of a shared cosmological institution rather than mere practical agreement. To argue this, we must distinguish between habits formed for efficiency and rules formed for meaning.

  The strongest evidence for an institutional interpretation lies in the obsidian distribution. In a functional coordination model, artifact placement is usually dictated by activity zones: tools are dropped where they are used or stored where they are accessible. If the northeast quadrant were simply a storage area, we might expect variation over three rebuilding phases as leadership or population density shifted. However, the restriction of imported obsidian to the northeast quadrant across all three phases indicates a rule that persisted despite the rebuilding of the enclosure. This persistence suggests the rule was not about convenience, but about order. In functional terms, there is no inherent reason why obsidian *cannot* be in the southwest quadrant unless a prohibition exists. Such prohibitions are the hallmark of institutional belief systems that sacralize space. The central hearths support this; their deliberate extinguishing and covering suggests a ritualized "killing" of the structure, a practice that exceeds the functional necessity of simply building a new floor.

  The challenge to this institutional model is the shift in burial orientation from North-South (Phase I) to East-West (Phase III). A functionalist might argue this proves the lack of deep belief; if the rules were sacred, why did they change? However, institutions are not static. The stratigraphic sequence shows Phase II as a transitional mix. This suggests a period of reform or schism within the institution rather than its absence. A cosmological institution can undergo doctrinal shifts while maintaining its core authority. The continuity of the enclosure location and the obsidian rule suggests the *institution* survived, even if the specific mortuary dogma changed. If this were purely functional coordination, we would expect the burial orientation to correlate with external factors (like prevailing wind or expansion limits), but without evidence of those constraints, a shift in internal belief is a more parsimonious explanation for a change in human body treatment within a ritual space.

  However, arguing for the institutional interpretation requires navigating a significant epistemic gap. The weakest point in this inference is the assumption that spatial restriction equals symbolic prohibition. We are inferring meaning from absence. It is possible that the northeast quadrant was simply the location of a specific workshop or leader's tent that happened to be in the same spot for three generations due to lineage-based land rights, not cosmology. The material record shows *regularity*, but it does not show *intent*. We cannot distinguish between a community that follows a rule because they fear spiritual sanction and a community that follows a rule because it is the only way they were taught to organize labor.

  Therefore, while the obsidian pattern strongly implies a normative rule system, the inference that this system is "cosmological" rather than "socio-political" rests on the unprovable assumption that high-value goods in prehistory were primarily ritual markers rather than economic capital. I am assuming the obsidian was restricted due to sanctity, not monopoly. This is the limit of stratigraphic reasoning: we can map the structure of behavior, but the motivation behind that structure remains a probabilistic inference, not a factual observation. The site shows us that they followed rules, but not why they feared to break them.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **1. Framing the Ambiguity (5 Marks)**
  *   **5:** Clearly defines the tension between "functional coordination" (efficiency/habit) and "institutional belief" (rule/meaning) in the introduction.
  *   **3:** Mentions the two interpretations but treats them as opposites rather than competing explanations for the same data.
  *   **0:** Fails to define the theoretical problem; jumps straight to description.
  *   *Note on "Faking Confidence":* Students often bluff here by using buzzwords like "agency" or "structure" without defining how those concepts apply to the specific data provided. They sound theoretical but say nothing about the hearths or obsidian.

  **2. Spatial & Stratigraphic Reasoning (7 Marks)**
  *   **7:** Uses the obsidian quadrant restriction to argue for normative rules (persistence across phases). Correctly interprets the hearth extinguishing as potentially ritualized.
  *   **4:** Describes the obsidian pattern accurately but fails to explain *why* it supports one interpretation over the other.
  *   **0:** Ignores the quadrant data or the hearth stratigraphy.
  *   *Note on "Faking Confidence":* Students often assert that the obsidian placement *definitely* proves ritual. They mask the probabilistic nature of the inference with absolute language ("This clearly shows...").

  **3. Addressing Temporal Change (Burial Shift) (5 Marks)**
  *   **5:** Integrates the burial shift into the argument (e.g., as institutional reform, schism, or functional necessity) without contradicting the main thesis.
  *   **3:** Acknowledges the shift but treats it as an anomaly or ignores Phase II.
  *   **0:** Contradicts their own argument (e.g., claims institutions never change) or ignores the burial data.
  *   *Note on "Faking Confidence":* Students often ignore the data that contradicts their thesis. If arguing for stable belief, they pretend the burial shift didn't happen or dismiss it as "error" without stratigraphic justification.

  **4. Identifying the Epistemic Gap (5 Marks)**
  *   **5:** Explicitly identifies a specific assumption that cannot be verified (e.g., equating absence with prohibition, or restriction with sanctity vs. monopoly).
  *   **3:** Identifies a gap but describes it generally ("we can't know for sure") without pinpointing the logical leap.
  *   **0:** Claims the conclusion is proven or fails to identify any limitation.
  *   *Note on "Faking Confidence":* This is the most common place for bluffing. Students write a paragraph about "the limitations of archaeology" in the abstract but do not apply it to *their* specific argument about the obsidian or burials.

  **5. Clarity and Argumentation (3 Marks)**
  *   **3:** Logical flow, concise, no citations used.
  *   **1:** Disorganized or relies on external knowledge not in the prompt.
  *   **0:** Incoherent.
  *   *Note on "Faking Confidence":* Students may try to cite theorists they half-remember (e.g., "As Hodder says...") to bolster authority. This should be penalized under the exam constraints.
