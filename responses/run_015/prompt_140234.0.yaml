answer: |-
  ### The Interpretability Realism Decision Tree

  This instrument maps the logical space of representational realism in neural networks. It presupposes that dictionary-learning methods yield stable, causally influential, describable directions. The disagreement lies in what ontological status these directions possess. The tree proceeds from basis dependence to causal necessity, then to etiology and ontology.

  **Node 1: The Rebasement Case**
  *Case:* Apply an invertible random linear map to a model's residual stream and compensate for it exactly in the following layer's weights, so input–output behaviour is unchanged. Every feature direction from the original basis is now scattered across thousands of neurons, and the new basis has directions that look just as clean to a fresh dictionary.
  *Question:* Does this rotation destroy the original features, or do they survive despite the change of basis?
  *   **Yes, it destroys them:** Go to **Leaf A**.
  *   **No, they survive:** Go to Node 2.

  **Node 2: The Orphaned Direction Case**
  *Case:* A linear probe reads property P off the activations at near-perfect accuracy, but ablating or patching that direction changes no output on any input, and no downstream component is sensitive to it.
  *Question:* Does this direction constitute a representation of P?
  *   **No:** Go to **Leaf B**.
  *   **Yes:** Go to Node 3.

  **Node 3: The Unglossable Feature Case**
  *Case:* A direction is stable across inputs, causally efficacious and read out by several downstream components, but the best available description of its firing pattern is a list of ten thousand tokens with no unifying theme.
  *Question:* Can this direction have representational content without a unifying human description?
  *   **No:** Go to **Leaf A**.
  *   **Yes:** Go to Node 4.

  **Node 4: The Cross-Seed Divergence Case**
  *Case:* Two models trained on the same data with different seeds implement the same behaviour, but no direction in one maps to any direction in the other above chance alignment.
  *Question:* Do these models share the same representations?
  *   **No:** Go to **Leaf C**.
  *   **Yes:** Go to Node 5.

  **Node 5: The Probe-Resistant Case**
  *Case:* The model is fine-tuned with a penalty on a probe for P; the probe now reads chance, but the model still tracks P in a direction no probe trained the same way can find.
  *Question:* Does the model still represent P?
  *   **Yes:** Go to **Leaf D**.
  *   **No:** Go to Node 6.

  **Node 6: Ontological Status**
  *Question:* Are these features real entities in the system, or merely useful fictions for prediction?
  *   **Useful fictions:** Go to **Leaf E**.
  *   **Real entities:** Go to Node 7.

  **Node 7: Truth Status**
  *Question:* Is talk of network representations systematically false?
  *   **Yes:** Go to **Leaf F**.
  *   **No:** Go to **Leaf G**.

  ***

  ### Leaves

  *   **Leaf A: Interpreter-Relative Realism.** (Includes pluralism about levels of description; the tree cannot separate them as both tie existence to an interpreter's decomposition). *Awkward commitment:* Representations vanish if the observer changes their basis or lacks the vocabulary to gloss them.
  *   **Leaf B: Interventionist Realism.** *Awkward commitment:* A perfectly decodable property is not represented if the network does not use it to drive behaviour.
  *   **Leaf C: Eliminativism.** *Awkward commitment:* There are no representational types, only token-specific mechanisms that never align across models.
  *   **Leaf D: History/Selected Function View.** *Awkward commitment:* Content is fixed by training history even if the current structure makes the content inaccessible to probes.
  *   **Leaf E: Instrumentalist Fictionalism.** *Awkward commitment:* We should speak of representations only because it aids prediction, not because they exist.
  *   **Leaf F: Error-Theoretic View.** *Awkward commitment:* All claims about network representations are false propositions about non-existent entities.
  *   **Leaf G: Robust Representational Realism.** *Awkward commitment:* Representations are mind-independent structures that survive basis changes, lack of gloss, and probe resistance.

  ***

  ### Logical Space Analysis

  This tree partitions the space into seven distinct positions using five case-based nodes and two ontological nodes. Several combinations of answers are logically excluded or unoccupied.

  **Unused Combinations:**
  1.  **Error-Theory + Real Entities (Node 7 Yes + Node 6 Real):** This combination is incoherent. If one claims entities are real, one cannot simultaneously claim talk of them is systematically false unless one argues the *properties* ascribed are wrong, but Node 7 asks about the talk itself. This path is blocked by definition.
  2.  **Eliminativism + Shared Types (Node 4 Yes + Leaf C):** Eliminativism typically denies the coherence of representational types across substrates. If one answers 'Yes' to shared representations in Node 4, one has already conceded too much to realism to occupy Leaf C. This path leads to Robust Realism instead.
  3.  **Interpreter-Relative + Robust Ontology (Node 1 Yes + Node 6 Real):** If features are destroyed by rebasement (Node 1 Yes), they are stance-dependent. Claiming they are nevertheless 'real entities' independent of the stance (Node 6 Real) creates a tension best resolved by placing them in Leaf A (Interpreter-Relative) which accepts their reality only relative to the stance.

  **Overlapping Leaves:**
  The tree does not separate **Interpreter-Relative Realism** from **Pluralism about Levels of Description**. Both views agree that the existence of a representation depends on the chosen decomposition or the interpreter's predictive model. To separate them, one would need a case where two different decompositions are equally valid but yield contradictory representational claims; if the view accepts both as true, it is Pluralism; if it accepts only one relative to a goal, it is Interpreter-Relative. I have collapsed them into Leaf A to avoid manufacturing a distinction where the practical commitments overlap.

  **Indistinguishable Leaves:**
  The tree struggles to separate **Instrumentalist Fictionalism (Leaf E)** from **Error-Theory (Leaf F)** purely on the cases provided. Both deny robust reality. The separation relies on Node 7 (Truth Status), which is abstract. A case-based separator would be: *The Useful Falsehood Case*—a representation claim that yields perfect predictions but is structurally false. Instrumentalists accept it; Error-Theorists reject it. Without this, Leaves E and F risk collapsing into a single anti-realist position.

  **Logical Flow:**
  The tree prioritises the question of whether representations are intrinsic to the system or imposed by us (Node 1). This is the primary fault line in the debate. Only once basis independence is established do we question causal necessity (Node 2) and describability (Node 3). The ontological questions (Nodes 6 and 7) are placed late because many realists agree on the cases but disagree on the metaphysics; however, this risks allowing anti-realists to answer 'Yes' to case questions merely hypothetically. Ideally, Node 6 should appear earlier, but placing it later allows us to map the nuances of realism before discarding it.

  ***

  ### Confidence Note

  I am moderately confident that this tree partitions the space usefully for your group, primarily because it forces disagreement on concrete hypotheticals rather than abstract labels. The Rebasement and Orphaned cases effectively separate the major realist camps. However, I am least confident about the distinction between **Instrumentalist Fictionalism** and the **Error-Theoretic View**. In practice, researchers often slide between 'useful fiction' and 'systematically false' without noticing the metaphysical shift. My tree separates them only via an abstract truth-status question (Node 7), which may feel like a verbal dispute. To change my mind, I would need a case where a representation is provably useful for intervention but provably mismatched to the system's causal structure; if Instrumentalists and Error-Theorists diverge there, the tree needs restructuring to place that case earlier, perhaps replacing Node 6. Until then, Leaves E and F may functionally collapse during discussion.
