answer: |-
  What you need
  18 slips per student, pens, and a large envelope labelled 'The Black Box'. Inside is a single index card with a deterministic algorithm (e.g., 'If >50% students play Rock, I play Paper; else Rock'). Whiteboard for scores. Ensure the algorithm is simple enough for you to compute manually in real-time but opaque enough to resist immediate reverse-engineering. Prepare two prediction sheets: Phase 1 requires explanations using mental verbs ('wants', 'believes'); Phase 2 sheets look identical but are collected separately to measure linguistic shift.

  Rules and scoring
  Students play Rock-Paper-Scissors against the Box simultaneously. Each round, they write their move and a prediction of the Box's move on a standardised slip. Crucially, Phase 1 instructions mandate explanations using mental verbs ('wants', 'believes', 'expects'). Correct prediction = 1 point. The Box's move is determined by the hidden card rule, calculated by you after collection. Play five rounds. Reveal the rule explicitly. Play three more rounds. In Phase 2, explanations are still required, but no linguistic constraint is given. Total score is tallied individually.

  **CS Flag:** The rule must be computationally trivial to avoid advantaging CS students who might spot algorithmic patterns faster than philosophy students. Keep it arithmetic or counting-based, not cryptographic. This ensures the 'Design Stance' doesn't grant unfair predictive power over the 'Intentional Stance'.

  Because the rule is deterministic, attributing 'desire to win' yields the same prediction as calculating the modulo operation, ensuring predictive parity. Accuracy cannot distinguish the stances. We compare Phase 1 and Phase 2 explanation sheets for mental verb frequency. This measures whether knowing the mechanism extinguishes the urge to anthropomorphise. The points are secondary; the data is the language. If the CS students solve the rule early, the parity holds, but the 'mystery' vanishes. Ensure the rule depends on group aggregate data so individual reverse-engineering is impossible until the reveal. This keeps the playing field level between disciplines. Emphasise that points are for prediction accuracy, not explanation quality, to reduce pressure on the mental language constraint. The goal is not to win the game, but to generate the data required for the debrief.

  Timeline
  0-5: Setup. Distribute Phase 1 sheets. Explicitly instruct: 'Explain using mental terms only'.
  5-25: Rounds 1-5. Collect, calculate, announce Box move, update scores. Allow 3 mins per round for writing and calculation. Keep pace brisk to maintain tension.
  25-30: The Reveal. Read the card aloud. Post the rule on the board. No commentary on what it means for their strategy. Let the silence sit.
  30-45: Phase 2 (Rounds 6-8). Distribute identical-looking sheets. Do not mention language constraints. Observe if language shifts naturally.
  45-50: Tally 'Inertia' data. Quickly count mental verbs on Phase 2 sheets while students relax.
  50-80: Debrief & Discussion. Compare scores, reveal the language data, discuss implications.

  Where the philosophy is
  This maps directly to Dennett's stances. Phase 1 forces the Intentional Stance: students treat the Box as a rational agent to secure predictions. The rule's simplicity ensures the Design Stance (knowing the mechanism) offers no predictive advantage, creating parity. This silences the realist objection that one stance is 'truer' based on success. Both stances yield identical scores.

  The Reveal shifts the ontological ground. We know the Physical/Design reality. Yet, if students continue writing 'It wants' in Phase 2, we observe Attributional Inertia. This suggests the intentional stance is not merely a placeholder for ignorance but a robust cognitive default. It persists even when unnecessary.

  The CS/Philosophy tension arises here: CS students may view the mental terms as category errors; philosophy students may see them as indispensable heuristics. The game makes this friction empirical rather than theoretical. The parity point undermines the idea that mechanism explains *away* intention; instead, intention remains useful. The inertia point challenges the idea that knowledge of mechanism automatically dispels anthropomorphism. We are testing whether 'belief' is a tool or a truth-claim. Instrumentalism argues theories are tools, not truths. If the mental tool works as well as the mechanical one, why discard it? The activity forces students to live this question. It also touches on theory of mind. We project agency because we are agents. The box doesn't need a mind for us to use mind-language. The LLM comparison lurks here: if a neural net replaced the rule card, would the stance change?

  Debrief
  Start with scores. Did knowing the rule help improve accuracy? (Likely no, due to parity). Then reveal the linguistic data. 'Half of you still said "it wants" after knowing the code.' Introduce 'Intentional Stance'. Ask: Is this dishonest? Is it a lie to say the box 'wants' when it's just math?

  Bring in the LLM comparison. 'If the box were a transformer model, would the rule card change anything?' The mechanism is opaque either way (weights vs. logic). The CS students might argue weights are just math, but the philosophy students might argue the output behaviour is identical. Does the complexity of the mechanism justify the stance, or does any deterministic system forbid it? With an LLM, the 'rule' is inaccessible weights. Here, it was accessible logic. Did access change your language?

  Ask the CS cohort: Does seeing the code kill the 'ghost'? Ask the Phil cohort: Does the ghost matter if the prediction holds?

  Conclude on instrumentalism. We use mental language not because the box has a mind, but because *we* have minds that model agency. The discomfort they feel in Phase 2 is the sound of ontology clashing with utility. The activity suggests that 'mind' might be a feature of the observer, not the observed. This bridges the gap: the CS students see the system, the Phil students see the user, and the game shows they are looking at the same event. Ensure you validate the CS intuition that mental terms are technically false, while validating the Phil intuition that they are pragmatically true. The goal is not to resolve the tension, but to inhabit it. Let them sit with the unease of using 'false' language that works perfectly. Name the phenomenon 'Attributional Inertia'. Give them the vocabulary for what they just felt.

  What will go wrong
  Students might guess the rule early. If so, Phase 1 data is contaminated. Mitigate by making the rule slightly noisy or complex enough (e.g., depends on round number).
  Students might refuse mental language in Phase 1. Remind them it's a constraint for the 'experiment', not a truth claim.
  CS students might feel the mental language requirement is intellectually dishonest. Flag this early as a constraint, not a belief claim. They may disengage if they feel forced to write 'nonsense'.
  Boredom in repetitive rounds. Keep pace brisk. If calculation takes too long, momentum dies.
  Another risk: The 'Parity' fails. If the rule is too complex, CS students gain an edge in Phase 2, breaking the instrumentalist point. If too simple, everyone guesses early. Pilot the rule beforehand.
  Finally, the 'Inertia' measure might be ambiguous. Students might use 'expects' ambiguously. Define 'mental verbs' clearly in your tallying key beforehand to avoid post-hoc arguments about whether 'expects' is mentalistic.

  What the activity can't show
  It cannot prove consciousness. Predictive success doesn't equal qualia. The box feels nothing, regardless of stance.
  It cannot resolve the realism debate definitively. Instrumentalism wins on utility, not truth.
  It relies on the instructor being the 'box', which introduces human bias unless strictly adhered to.
  Crucially, it cannot show whether the 'inertia' is cognitive laziness or deep structural necessity. Only further discussion can parse if students kept using mental terms because they forgot, or because they couldn't help it. You must supply the theoretical framing for that distinction; the game only produces the behaviour.
