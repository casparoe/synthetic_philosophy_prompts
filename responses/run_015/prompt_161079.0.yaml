prompt: |-
  so I'm writing a novel and one of my characters — Ines, night porter at a big hotel — runs her day on a routine so exact that another character accuses her of being a machine. Not cruel, not cold, just running a program. I want that accusation to actually mean something, and the word I keep circling is sphexish: the digger-wasp thing where the wasp paralyses a cricket, drags it to her burrow, leaves it on the step, goes in to inspect, comes back out and hauls it in — and if you nudge the cricket a few inches while she's down there, she runs the whole inspection from the top again, apparently without end. Not stupid, just locked.

  I need a spec before I write the scene. Give me the desiderata for a theory of sphexishness: what an account of the difference between rigid mechanical behaviour and flexible agency has to deliver to be worth anything. Purpose matters here, so: good enough for two things — (1) a reader should be able to tell, from what I put on the page, whether Ines is sphexish or is just a woman who likes her routines, and (2) the accusation has to be able to do moral work between characters, excuse or blame, without collapsing into "she isn't free."

  For each requirement give the case or consideration behind it. The cases I want covered: the wasp; a sleepwalker; an OCD hand-washing ritual; a concert pianist whose hands know the piece better than she does; a nurse on autopilot at 4am; a bureaucrat who follows procedure and is thereby monstrous; a tick or an ant with a three-item repertoire; a language model producing perfectly fluent text; and a person whose options have all been quietly closed off by money or threat — she varies her behaviour lots, but every variation was scripted in advance by someone else.

  Two things I've been mulling that you should fold in. First, off-distribution rigidity: it feels to me like sphexishness is a property of a system relative to a *range* of environments, not a binary trait of the system, so a thing can be fabulously flexible inside the range it was built for and still fall apart the moment you move the cricket. Second, canned spontaneity: a system whose flexibility is itself stereotyped — the improv student with forty bits she recombines, the rebel teenager performing rebellion — strikes me as sphexish in a higher-order way, and I want to know if the theory can say that or whether it's just a prejudice of mine.

  Also tell me: which distinctions the theory must not collapse (stupid vs rigid vs predictable, behaviour vs mechanism vs history, local vs global rigidity, degrees vs threshold), which requirements are non-negotiable and which are camp preferences (I assume "must not smuggle in indeterminism" is non-negotiable and "must be legible from the outside" is negotiable for some camps), and whether any subset is jointly unsatisfiable — my hunch is that "diagnosable third-personally" and "sensitive to the agent's reasons" can't both hold, and that "graded" and "sharp enough to blame on" can't either. Which single requirement rules out the most candidate accounts? A line each on the obvious candidates — behavioural, mechanistic, reasons-responsive, information-theoretic — is fine, but keep the weight on the criteria, not the scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested spec for a theory of sphexishness:

  1.  **Deconstruct the Request:**

      *   **Goal:** Create a "spec" (desiderata) for a theory of *sphexishness* (rigid, mechanical behavior vs. flexible agency) for a novel.
      *   **Character:** Ines, night porter, accused of being a "machine" (not cold, just programmed).
      *   **Core Concept:** *Sphexishness* (from Hofstadter/Dennett), based on the digger wasp anecdote (repeating a loop when conditions change slightly).
      *   **Two Main Purposes:**
          1.  *Narrative Legibility:* A reader must distinguish between "Ines is sphexish" and "Ines just likes routines."
          2.  *Moral Work:* The accusation must carry moral weight (excuse or blame) without collapsing into hard determinism ("she isn't free").
      *   **Required Cases to Cover:** Wasp, Sleepwalker, OCD hand-washing, Concert Pianist (autopilot), Nurse (4am autopilot), Bureaucrat (monstrous procedure), Tick/Ant (limited repertoire), LLM (fluent text), Coerced/Poverty-stricken person (scripted variations).
      *   **Specific Concepts to Fold In:**
          1.  *Off-distribution rigidity:* Sphexishness is relative to an environment/range, not binary.
          2.  *Canned spontaneity:* Higher-order rigidity (performative flexibility).
      *   **Constraints/Analysis:**
          *   Distinctions *not* to collapse (stupid/rigid/predictable, behavior/mechanism/history, local/global, degrees/threshold).
          *   Non-negotiable vs. Camp Preferences (e.g., indeterminism, legibility).
          *   Identify jointly unsatisfiable subsets (tensions).
          *   Identify the single requirement that rules out the most candidates.
          *   Brief critique of obvious candidate theories (behavioral, mechanistic, reasons-responsive, information-theoretic).

  2.  **Initial Brainstorming & Concept Mapping:**

      *   *Sphexishness* isn't just repetition. It's repetition *in the face of changed conditions that should matter.*
      *   *Ines:* Needs to look competent but fragile. If the hotel burns down, does she keep polishing the lobby? Or does she adapt?
      *   *Moral Work:* If she's sphexish, is she less responsible? Or is the *refusal* to break the routine the moral failing (like the bureaucrat)? The prompt says "excuse or blame." This implies the theory needs to allow for *culpable* rigidity.
      *   *Off-distribution:* A chess master is flexible in chess, sphexish in a kitchen fire. The theory must account for *domain specificity*.
      *   *Canned Spontaneity:* This is tricky. It requires looking at the *source* of the variation, not just the variation itself.
      *   *Tensions:* "Diagnosable third-personally" vs. "Sensitive to reasons." If I can only see behavior, I can't see reasons. If I need to see reasons, it's not purely third-personal. This is the classic "Problem of Other Minds" / "Interpretive Charity" tension.

  3.  **Drafting the Desiderata (The Spec):**

      *   *Requirement 1: Counterfactual Sensitivity.* (The Wasp Test). If X changes, does behavior Y change appropriately?
      *   *Requirement 2: Goal-Tracking vs. Rule-Following.* Is the behavior serving the *purpose* or just the *procedure*? (Distinguishes Nurse from Bureaucrat).
      *   *Requirement 3: Integration of Feedback.* Can the system update its model based on the error? (Distinguishes OCD from Pianist).
      *   *Requirement 4: Source of Variation.* (Canned Spontaneity). Where does the flexibility come from? Internal generation vs. lookup table.
      *   *Requirement 5: Moral Agency Condition.* Can the agent *recognize* the rigidity? (Distinguishes Sleepwalker from Bureaucrat).

  4.  **Addressing the Cases:**

      *   *Wasp:* Fails Counterfactual Sensitivity.
      *   *Sleepwalker:* Fails Moral Agency (no awareness).
      *   *OCD:* Fails Goal-Tracking (ritual overrides well-being).
      *   *Pianist:* Passes (sub-routine serves higher goal).
      *   *Nurse:* Passes (efficiency, but ready to wake up).
      *   *Bureaucrat:* Fails Goal-Tracking (procedure overrides outcome).
      *   *Tick:* Fails (too simple, no range).
      *   *LLM:* Fails (no model of truth, only probability).
      *   *Coerced Person:* Passes behavioral tests, fails "Source of Variation" (external script).

  5.  **Refining the Tensions & Constraints:**

      *   *Distinctions to preserve:*
          *   *Predictable vs. Rigid:* I can predict a free agent who loves coffee. That's not rigidity.
          *   *Mechanism vs. Behavior:* Two people can look the same, one is tired, one is brain-damaged.
          *   *Local vs. Global:* Ines might be rigid at work but wild at home.
      *   *Non-negotiables:* Must not require indeterminism (compatibilism needed for fiction). Must allow for moral assessment.
      *   *The "Killer" Constraint:* "Diagnosable third-personally" AND "Sensitive to agent's reasons." You can't see reasons from the outside without interpretation. This is the biggest hurdle.
      *   *The "Graded vs. Threshold" problem:* If it's a spectrum, how do you blame someone? "You were *too* sphexish."

  6.  **Developing the Theory Spec (Iterative Process):**

      *   *Name:* Let's call it the "Adaptive Fidelity Spec."
      *   *Core Metric:* Ratio of behavioral variance to environmental variance, weighted by goal relevance.
      *   *Handling "Canned Spontaneity":* Need a requirement about *meta-flexibility*. Can you change the strategy when the strategy fails?
      *   *Handling "Off-distribution":* The theory must define the *operational envelope*.

  7.  **Addressing the Specific Questions:**

      *   *Which distinctions must not collapse?* (List from prompt + refinement).
      *   *Non-negotiable vs. Camp:* Indeterminism is out. Legibility is negotiable (internal monologue helps).
      *   *Jointly Unsatisfiable:* Third-person diagnosis + First-person reasons. Graded + Blameworthy.
      *   *Single Requirement ruling out most:* "Sensitivity to Reasons." It kills pure behaviorism and pure mechanism.
      *   *Candidate Theories:*
          *   *Behavioral:* Too easy to fake (LLM passes).
          *   *Mechanistic:* Too hard to see (we don't see neurons).
          *   *Reasons-Responsive:* Best for morality, hardest to write.
          *   *Info-Theoretic:* Good for "canned spontaneity," bad for "moral blame."

  8.  **Final Polish:**

      *   Ensure the tone is analytical but useful for a writer.
      *   Make sure Ines is central to the application.
      *   Check all cases are accounted for in the logic.
      *   Ensure the "Off-distribution" and "Canned Spontaneity" points are integrated into the desiderata.

      *(Self-Correction during drafting)*: I need to be careful about the "Coerced Person." They *look* flexible but are scripted. A theory based only on behavior will miss this. A theory based on *capacity* will catch it. The spec needs to emphasize *capacity to do otherwise if reasons changed*, not just *doing otherwise*.

      *(Refining the Moral Work)*: The prompt asks for "excuse or blame."
      *   Excuse: Sleepwalker, Severe OCD (capacity impaired).
      *   Blame: Bureaucrat, Ines (if she chooses safety over care).
      *   The theory must distinguish *inability* from *unwillingness*.

      *(Refining the "Killer Constraint")*: The tension between "Third-person diagnosable" and "Reasons-sensitive" is the crux of writing this. As a writer, you have to *show* the reasons through action. The spec should demand that the *text* provides access to the reasons, even if the theory says they are internal.

      *(Final check on "Canned Spontaneity")*: This is about *compression*. A lookup table of 1000 responses looks flexible but is finite. A generative model is infinite. The spec needs a "Generative Depth" requirement.

  9.  **Structuring the Output:**
      *   Introduction: Acknowledge the depth of the prompt.
      *   The Desiderata (The Spec): 4-5 core requirements.
      *   Case Study Application: How the spec sorts the list.
      *   Conceptual Constraints: Distinctions to keep.
      *   Tensions & Trade-offs: The unsatisfiable sets.
      *   Theory Scorecard: Brief evaluation of existing frameworks.
      *   Advice for Ines: Specific application to the novel.

  10. **Writing the Content:** (Proceeding to generate response based on these thoughts). *Focus on precision. Use the terminology provided (sphexish, off-distribution, canned spontaneity).* *Ensure the distinction between 'rigid' and 'reliable' is clear.* *Make sure the moral dimension is nuanced.*

      *Wait, one more check:* The prompt asks for "A line each on the obvious candidates." Keep that brief.
      *Check:* "Which single requirement rules out the most candidate accounts?" I need to pick one. Likely "Reasons-Responsiveness."

      *Let's assemble.*
answer: |-
  Here is a specification for a theory of *sphexishness* designed to serve your novel. It treats sphexishness not as a metaphysical claim about free will, but as a functional description of agency under stress.

  ### The Spec: Desiderata for a Theory of Sphexishness

  To do the work you need, the theory must satisfy four core requirements.

  **1. Counterfactual Sensitivity (The Wasp Test)**
  *   **Requirement:** The system must alter its behavior when environmental variables change *in ways relevant to the goal*, not just when variables change *in ways relevant to the trigger*.
  *   **Case Rationale:** The wasp fails this. Moving the cricket changes the state of the burrow entrance (relevant to the goal: securing food), but the wasp treats it as a reset of the trigger (cricket on threshold).
  *   **Application to Ines:** If the hotel lobby floods, does Ines continue polishing the brass (trigger: it is 3 AM, polish brass) or does she fetch sandbags (goal: maintain hotel integrity)? If she fetches sandbags, she is not sphexish. If she polishes brass while guests wade, she is.
  *   **Why it matters:** Distinguishes *reliability* (doing the right thing consistently) from *rigidity* (doing the same thing regardless).

  **2. Meta-Flexibility (The Canned Spontaneity Test)**
  *   **Requirement:** The system must possess a mechanism for evaluating the success of its own flexibility strategies. Variations must be generative, not recombinant lookup-tables.
  *   **Case Rationale:** The "rebel teenager" or "improv student" passes behavioral flexibility tests but fails this. Their variations are drawn from a pre-approved set of "flexible moves." If the script for rebellion fails to provoke, do they try a new script or double down on the performance?
  *   **Application to Ines:** Does Ines have a "break glass" protocol she actually uses, or does she treat the protocol itself as the routine? If she deviates, does she understand *why* she deviated, or does she just feel she broke a rule?
  *   **Why it matters:** Prevents the theory from classifying complex algorithms (or LLMs) as agents simply because they have large vocabularies.

  **3. Goal-Tracking vs. Procedure-Tracking (The Bureaucrat Test)**
  *   **Requirement:** The account must distinguish between adherence to a *purpose* and adherence to a *process*. Sphexishness is high when process fidelity overrides purpose fidelity.
  *   **Case Rationale:** The monstrous bureaucrat follows procedure while the building burns. The nurse at 4am follows procedure *to save energy for emergencies*. The behavior looks identical; the relationship to the goal differs.
  *   **Application to Ines:** The accuser must be able to point to a moment where Ines prioritized the *form* of her duty over the *function* of her duty.
  *   **Why it matters:** This is the locus of moral blame. You can blame someone for caring more about rules than people. You cannot blame someone for being efficient.

  **4. Operational Envelope Awareness (The Off-Distribution Test)**
  *   **Requirement:** Sphexishness is not binary; it is a ratio of flexibility to environmental complexity within a specific domain. The theory must account for *domain collapse*.
  *   **Case Rationale:** The concert pianist is highly flexible within the piece (dynamics, tempo) but sphexish if the piano catches fire (muscle memory might continue). The tick is sphexish everywhere.
  *   **Application to Ines:** Ines may be a genius of hotel logistics (high flexibility in-domain) but completely sphexish in social confrontation (off-distribution). The accusation likely comes from someone observing her *outside* her envelope.
  *   **Why it matters:** Allows Ines to be competent and human in Chapter 1, and "machine-like" in Chapter 5, without contradiction.

  ---

  ### Case Sorting: How the Spec Classifies Your List

  *   **The Wasp:** Fails **Counterfactual Sensitivity**. Infinite loop on trigger reset.
  *   **Sleepwalker:** Fails **Goal-Tracking** (no active goal) and **Meta-Flexibility** (no monitoring). *Moral verdict: Excused.*
  *   **OCD Hand-Washing:** Fails **Goal-Tracking**. The goal (hygiene) is decoupled from the action (washing until it feels right). *Moral verdict: Excused (pathology).*
  *   **Concert Pianist:** Passes **Operational Envelope**. Sub-routines are automated to free cognitive load for higher-order expression. *Moral verdict: Agency intact.*
  *   **Nurse (4am):** Passes **Goal-Tracking**. Efficiency serves the higher goal (alertness for crisis). *Moral verdict: Agency intact.*
  *   **Bureaucrat:** Fails **Goal-Tracking**. Procedure becomes the telos. *Moral verdict: Blameworthy (moral negligence).*
  *   **Tick/Ant:** Fails **Operational Envelope**. Envelope is too narrow to support agency. *Moral verdict: Non-agent.*
  *   **Language Model:** Fails **Meta-Flexibility** and **Goal-Tracking**. No model of truth, only probability. "Canned spontaneity" at scale. *Moral verdict: Non-agent.*
  *   **Coerced/Poverty-Stricken:** Passes **Counterfactual Sensitivity** (behavior varies with threats) but fails **Meta-Flexibility** (variations are scripted by the coercer). *Moral verdict: Complex (diminished capacity).*

  ---

  ### Conceptual Constraints: Distinctions to Preserve

  1.  **Stupid vs. Rigid vs. Predictable:** A genius can be predictable (she always chooses the optimal move). A fool can be flexible (random errors). Sphexishness is rigid *specifically when flexibility is required*.
  2.  **Behavior vs. Mechanism vs. History:** Two characters can behave identically. One is sphexish due to trauma (history), one due to nature (mechanism). The theory must allow the *text* to reveal this without changing the behavior.
  3.  **Local vs. Global Rigidity:** As per the **Operational Envelope**, Ines can be fluid in the boiler room and rigid in the lobby.
  4.  **Degrees vs. Threshold:** Sphexishness is a gradient (degree of rigidity), but moral blame often requires a threshold (negligence). The theory must allow you to write the gradient while the characters argue about the threshold.

  ---

  ### Tensions and Trade-offs

  **Non-Negotiable Requirements:**
  *   **Must not smuggle in indeterminism:** You are writing fiction, not quantum physics. Deterministic systems can be agents.
  *   **Must support moral assessment:** If the theory proves Ines is a machine, the story ends. It must allow for *culpable* sphexishness.

  **Camp Preferences (Negotiable):**
  *   **"Legible from the outside":** *Negotiable.* You can use internal monologue to prove agency. If you restrict yourself to pure behaviorism, you cannot distinguish the Nurse from the Bureaucrat.
  *   **"Diagnosable third-personally":** *Negotiable.* See above.

  **Jointly Unsatisfiable Subsets:**
  1.  **"Diagnosable Third-Personally" + "Sensitive to Agent's Reasons":** You cannot see reasons from the outside without interpretation. If you demand pure behavioral proof, you lose the ability to distinguish the Bureaucrat (who knows better) from the Wasp (who doesn't). *Resolution:* As the author, you must grant the reader access to reasons (dialogue, thought), acknowledging that a real-world observer couldn't know.
  2.  **"Graded" + "Sharp Enough to Blame On":** If sphexishness is a spectrum, where does blame begin? *Resolution:* Blame attaches not to the *degree* of rigidity, but to the *awareness* of it. (The Bureaucrat knows he is being rigid; the Wasp does not).

  **The Single Requirement That Rules Out The Most Candidates:**
  **"Sensitivity to Reasons."**
  This kills pure Behaviorism (which ignores internal states), pure Mechanism (which ignores content), and Information Theory (which ignores semantics). It forces the account to be about *why* the action is taken, not just *how*.

  ---

  ### Scorecard: Obvious Candidate Theories

  *   **Behavioral:** Fails. Cannot distinguish the Pianist from the LLM; both produce fluent output. Good for describing *what* Ines does, bad for *why*.
  *   **Mechanistic:** Fails. Requires access to Ines's neurons. If you write "her synapses fired," you kill the prose. Good for sci-fi cyborgs, bad for humans.
  *   **Reasons-Responsive:** **Best Fit.** Aligns with **Goal-Tracking**. Allows you to show Ines ignoring a reason (the crying guest) in favor of a rule (the logbook). Carries moral weight.
  *   **Information-Theoretic:** Good for **Canned Spontaneity**. Can measure the "surprise" in Ines's actions. If her responses have low entropy relative to the situation's complexity, she is sphexish. Hard to translate into emotional stakes.

  ---

  ### Writing Advice for Ines

  To make the accusation stick without dehumanizing her:

  1.  **Show the Glitch:** Don't show her failing to work. Show her working *perfectly* while the context burns. She files the complaint form while the guest is still bleeding. That is **Goal-Tracking failure**.
  2.  **The "Off-Distribution" Trap:** Have the accuser catch her in a moment that requires social improvisation, not logistical management. She can fix the boiler (high flexibility) but cannot comfort a child (sphexish).
  3.  **Canned Spontaneity:** Give her a "comforting phrase" she uses on guests. It's the right phrase, but she uses it for a death and a lost wallet alike. The *text* is flexible; the *intent* is rigid.
  4.  **Moral Stakes:** The accuser must admit she is *good* at her job. The tragedy isn't incompetence; it's that her competence has become a cage. She is blameworthy only if she *refuses* to unlock the cage when handed the key.

  **The Verdict:** Ines is sphexish not because she follows a routine, but because she treats the routine as the *master* rather than the *servant*. The theory holds if you can write a scene where breaking the routine would cost her nothing, yet she cannot do it.
