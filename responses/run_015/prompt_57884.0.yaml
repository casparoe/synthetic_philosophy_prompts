answer: |-
  Here is a complete lesson plan designed for a 75-minute discussion section. It prioritizes the "Late vs. On Time" (Claim vs. Negation) setup rather than "Late vs. Very Late."

  **Why the change?** Your roommate's specific doubt was about assigning 0.7 to a claim *and* its negation. That is a violation of the Normalization axiom ($P(A) + P(\neg A) = 1$). The "Late vs. Very Late" example tests Monotonicity ($P(B) \leq P(A)$ if $B \to A$). While both are valid, the Normalization violation is mathematically cleaner to demonstrate on a whiteboard in real-time without needing a pre-calculated spreadsheet projection. It guarantees you can show dominance with simple arithmetic.

  ### **Lesson Plan: The Accuracy Game**

  **Goal:** Students discover that incoherent credences (probabilities that don't add up) lose points *no matter what the truth turns out to be*, compared to coherent credences.
  **Time:** 75 Minutes
  **Class Size:** 16 Students (4 Teams of 4)

  ---

  ### **1. Materials & Prep**
  *   **Candy:** Two bags. One "cheap" bag (individual candies) for participation, one "premium" bag (king-size bars) for the winning team.
  *   **Handout:** "Forecaster Sheet" (simple table with columns: Team Name, Credence in Late, Credence in On Time, Total Penalty).
  *   **Whiteboard:** Draw a large scoring table.
  *   **Calculator:** For you (or have Excel open on the projector).
  *   **Prep:** Pre-calculate one specific example of dominance to have ready if the live math gets messy. (See "Troubleshooting" below).

  ---

  ### **2. Timeline (75 Minutes)**

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Hook** | Explain the goal: Maximize points. Introduce the Shuttle scenario. |
  | **10-25** | **Round 1 (The Trap)** | Teams submit credences. Most will violate coherence. |
  | **25-40** | **Round 2 (Strategy)** | Reveal Round 1 scores. Let them adjust. Encourage "hedging." |
  | **40-55** | **The Reveal** | Reveal the "Truth." Calculate scores live. Show the Dominance. |
  | **55-75** | **Debrief & Lecture** | Map the game to Accuracy-First Epistemology. |

  ---

  ### **3. Game Rules (Read to Class)**

  1.  **The Scenario:** "Tomorrow, the campus shuttle will either be **Late** (more than 1 min) or **On Time** (0-1 min). These are the only two options."
  2.  **The Task:** Your team must submit two numbers between 0 and 1.
      *   Number A: How confident are you it will be **Late**?
      *   Number B: How confident are you it will be **On Time**?
  3.  **The Scoring:** You start with **100 Points**.
      *   If a claim is **True**, we subtract the squared distance from 1. Formula: $(1 - \text{your number})^2$.
      *   If a claim is **False**, we subtract the squared distance from 0. Formula: $(0 - \text{your number})^2$.
      *   *Example:* If you say 0.8 and it's True, penalty is $(1-0.8)^2 = 0.04$. If you say 0.8 and it's False, penalty is $(0-0.8)^2 = 0.64$.
      *   We add the penalties for both claims and subtract from 100.
  4.  **The Prize:** The team with the highest final score gets the premium candy. Everyone else gets a piece of cheap candy.

  ---

  ### **4. Running the Game (Step-by-Step)**

  **Phase 1: The Trap (15 mins)**
  *   Divide into 4 teams.
  *   Ask them to discuss and write down their two numbers.
  *   **Crucial TA Move:** Do not tell them the numbers must add to 1. Do not tell them they represent probabilities. Just call them "confidence numbers."
  *   Collect the sheets.
  *   *Likely Outcome:* At least one team will write something like Late: 0.7, On Time: 0.7 (Sum 1.4) or Late: 0.3, On Time: 0.3 (Sum 0.6). This is your target.

  **Phase 2: The Adjustment (15 mins)**
  *   Tell them: "You can submit a second set of numbers if you want. You can change your strategy based on what you think other teams did."
  *   This creates noise, but usually, the incoherent team sticks with their "gut feeling" while others move toward 0.5/0.5.

  **Phase 3: The Reveal (15 mins)**
  *   **Flip the Coin:** Since you can't wait until tomorrow for the shuttle, flip a coin in class. Heads = Late, Tails = On Time.
  *   **Calculate Live:** Pick the team that was incoherent (e.g., 0.7/0.7) and a team that was coherent (e.g., 0.5/0.5).
  *   **Whiteboard Math:**
      *   **Truth:** Late (1), On Time (0).
      *   **Team Incoherent (0.7, 0.7):**
          *   Late Score: $(1 - 0.7)^2 = 0.09$
          *   On Time Score: $(0 - 0.7)^2 = 0.49$
          *   Total Penalty: $0.58$
      *   **Team Coherent (0.5, 0.5):**
          *   Late Score: $(1 - 0.5)^2 = 0.25$
          *   On Time Score: $(0 - 0.5)^2 = 0.25$
          *   Total Penalty: $0.50$
      *   **Result:** Coherent team has lower penalty (higher score).
  *   **The Kicker:** Now ask, "What if the coin had gone the other way?"
      *   **Truth:** Late (0), On Time (1).
      *   **Team Incoherent (0.7, 0.7):**
          *   Late Score: $(0 - 0.7)^2 = 0.49$
          *   On Time Score: $(1 - 0.7)^2 = 0.09$
          *   Total Penalty: $0.58$
      *   **Team Coherent (0.5, 0.5):**
          *   Late Score: $(0 - 0.5)^2 = 0.25$
          *   On Time Score: $(1 - 0.5)^2 = 0.25$
          *   Total Penalty: $0.50$
  *   **Conclusion:** The Coherent team *would have won regardless of the coin flip.*

  ---

  ### **5. Debrief Script (20 mins)**

  *(Stand at the whiteboard next to the scores)*

  **Step 1: Name the Feeling**
  "Look at Team Incoherent. They felt confident. They said 0.7 on both. But look at the board. They lost. Not because they got the truth wrong—Team Coherent had the exact same 'guess' about the truth (0.5 is neutral). They lost because their *structure* was broken. Does anyone feel why that 0.7/0.7 split is dangerous?"

  *(Wait for hands. Someone will say 'they add to 1.4'.)*

  **Step 2: Introduce 'Dominance'**
  "Exactly. In this game, Team Coherent **dominated** Team Incoherent. That's a technical term. It means there was no possible world, no outcome of the coin flip, where Team Incoherent would have beaten Team Coherent. They were guaranteed to lose points simply for having numbers that didn't fit together."

  **Step 3: Map to Epistemology**
  "In our readings, we talked about **Accuracy-First Epistemology**.
  *   **The Goal:** The point of belief isn't just to 'win bets' (pragmatism); it's to represent the world accurately.
  *   **The Measure:** We used a specific math formula today (squared distance). Philosophers call this a **Scoring Rule**. Specifically, the **Brier Score**. It punishes you more the further you are from the truth.
  *   **The Norm:** Why should we follow the rules of probability (Probabilism)? Some say it's to avoid losing money (Dutch Books). But today, no money changed hands. You lost *accuracy points*.
  *   **The Theorem:** There is a mathematical proof (Joyce's Argument) that says: If your beliefs violate probability rules, there is *always* another set of beliefs that is more accurate than yours, no matter what the world looks like. That is exactly what you just saw."

  **Step 4: Address the Roommate's Objection**
  "Your roommate asked: 'Why is 0.7 on both bad if I just want truth?' The answer is: Because being incoherent makes you *further* from the truth in every possible scenario than if you just fixed your numbers. It's not about money. It's about being unnecessarily inaccurate."

  ---

  ### **6. Troubleshooting: What Will Go Wrong**

  **Problem 1: Students pick 0.5 / 0.5 immediately.**
  *   *Risk:* No incoherence to demonstrate.
  *   *Fix:* In Round 1, whisper to one team: "Try to be bold. If you think it's late, put a high number on Late. Don't worry about the other number yet." This encourages the violation.

  **Problem 2: Math anxiety / Calculation takes too long.**
  *   *Risk:* You spend 20 mins squaring decimals on the board.
  *   *Fix:* Have the penalties pre-calculated on a hidden slide or sheet. Only write the *results* on the board. Or, restrict choices to 0, 0.5, 0.7, 1.0 to make mental math easier.

  **Problem 3: "But the shuttle wasn't actually late!"**
  *   *Risk:* Students object that the coin flip isn't real data.
  *   *Fix:* Acknowledge this. "The specific truth doesn't matter for the *dominance* point. We showed that Coherent wins in World A AND World B. So the actual truth is irrelevant to the structural advantage."

  **Problem 4: They ask why we use Squared Error.**
  *   *Risk:* They argue linear distance $(|1 - c|)$ is better.
  *   *Fix:* "Great question. Linear distance doesn't guarantee dominance. If we used simple distance, incoherent beliefs wouldn't always lose. The math of accuracy *requires* a specific shape (convexity) to work. We used squared distance because it's the standard way philosophers model 'accuracy'."

  ---

  ### **7. Limitations (Be Honest Here)**

  In the last 5 minutes, tell them what the game *didn't* show. This builds trust.

  1.  **Expected vs. Actual Accuracy:** "Today we checked *actual* accuracy (after the coin flip). The theory is about *expected* accuracy (before you know the truth). You can't calculate expectation in a 15-minute game, but the dominance logic holds for expectations too."
  2.  **Why this Scoring Rule?** "We assumed squared error is the right way to measure 'distance from truth.' Some philosophers argue about this. But if you accept this measure, Probabilism follows."
  3.  **Real World Stakes:** "In real life, being inaccurate doesn't always cost you candy. Sometimes being overconfident (0.7/0.7) feels good psychologically even if it's 'inaccurate.' The theory says you *should* care about accuracy, but it doesn't prove you *do*."

  ### **TA Cheat Sheet (For the Whiteboard)**

  Keep this handy to ensure the math works if they don't pick the exact numbers you want.

  **If Team picks Incoherent (0.7, 0.7):**
  *   Penalty is always **0.58**.
  *   **Any Coherent Team (x, 1-x)** where $x$ is between **0.42 and 0.98** will beat them.
  *   *Safe Bet:* Compare them to a team that picked **(0.5, 0.5)**. Penalty is **0.50**. Coherent wins.

  **If Team picks Incoherent (0.3, 0.3):**
  *   Penalty is always **0.18**.
  *   **Any Coherent Team (x, 1-x)** where $x$ is between **0.12 and 0.88** will beat them.
  *   *Safe Bet:* Compare them to **(0.5, 0.5)**. Penalty is **0.50**.
  *   *Wait!* In this case, the Incoherent team (0.3, 0.3) actually gets a *lower* penalty (0.18) than the Coherent team (0.5, 0.5) which gets 0.50.
  *   **CRITICAL WARNING:** If students pick low numbers (0.3, 0.3), they might *win* against a 0.5/0.5 team.
  *   **Solution:** You must compare them to the *closest* coherent point. If they pick (0.3, 0.3), the closest coherent point is (0.5, 0.5)? No, the closest coherent point to (0.3, 0.3) is (0.5, 0.5). Wait, $(0.3-1)^2 + (0.3-0)^2 = 0.49 + 0.09 = 0.58$.
      *   *Recalc:*
      *   Incoherent (0.3, 0.3). Truth (1, 0).
      *   Late: $(1-0.3)^2 = 0.49$. On Time: $(0-0.3)^2 = 0.09$. Total = **0.58**.
