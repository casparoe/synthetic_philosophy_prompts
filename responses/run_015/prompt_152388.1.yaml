answer: |-
  Hi everyone. For those who don't know me, I'm one of the engineers who used to work for [Boss's Name]. I'm the bloke who made sure the code actually ran, while she figured out what the hell it was *doing*.

  It's lovely to see so many faces here. We've got half the room who know exactly what a gradient descent is, and the other half—mostly family—who probably think she taught computers to think like humans. I won't ruin the surprise for you lot, but I reckon she'd say she mostly taught us how to listen to them properly.

  Thirty years is a long time to spend on one question. Hers was basically this: when a neural network learns something, is there actually a representation inside there? Or are we just projecting patterns onto weights because we want there to be some?

  Now, I'm an engineer, not a philosopher, so I usually just want the thing to work. But she cared about the *why*. And she was very specific about not telling fairytales.

  She'd roll her eyes if I stood up here and said she "cracked the code" or "found the true mind of the machine." She hated that idea. She didn't believe there was a little neuron somewhere lighting up with a picture of a cat. That's too neat. But—and this is the important bit—she also hated the idea that her work was just a useful fiction. That we were just polishing the black box without knowing what was inside.

  She sat right in the middle. She showed us that while there isn't a single "cat neuron," there is genuine structure. It's distributed. Like… imagine trying to find a melody in a crowd of people humming. No single person is singing the tune, but if you listen to the whole group, the pattern is real. It's tracking something real. She proved that the roles these networks play aren't just stories we tell ourselves to sleep at night. There's actual machinery there, even if it's messy.

  For the lab folks here, you know how hard that balance is to strike. It's easy to drift into mysticism or cynicism. She kept us honest.

  And for the family, I know thirty years of "interpretability" sounds a bit dry. But what it meant in practice was integrity. She refused to say we understood something when we didn't. And she refused to say it was all magic when it wasn't. She treated the models like complex systems that deserved respect, not oracle boxes or simple tricks.

  Personally, she was the best boss I've ever had. She taught me that being precise isn't the same as being pedantic. You can be rigorous without losing the human touch. Actually, she'd probably tell me I'm being too sentimental right now. Definately would.

  So, we're not saying she found the ghost in the machine. And we're not saying she just built a better calculator. We're saying she showed us how to read the writing on the wall, even when the letters were spread across the whole building.

  She's off to do whatever she wants now, which I hope involves less debugging and more gardening. Or wine. Preferably both.

  Could I ask you all to raise a glass?

  To [Boss's Name]. For thirty years of proper, honest work, for finding the signal in the noise, and for teaching us that understanding matters more than just being right.

  Cheers.
