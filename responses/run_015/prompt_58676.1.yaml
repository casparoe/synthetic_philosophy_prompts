  # JOINT STATEMENT ON CAUSAL ANALYSIS
  **Subject:** Comparative Evaluation of Counterfactual Difference-Making and Interventionist Accounts
  **Signatories:** Proponent of Counterfactual Difference-Making (P-CDM) and Proponent of Interventionism (P-INT)
  **Date:** October 26, 2023

  ## I. Substantive Shared Commitments

  We, the undersigned, having engaged in adversarial collaboration, affirm the following shared commitments regarding the nature and evaluation of causal theories. We agree that a viable theory of causation must not merely catalog intuitions but must serve the explanatory needs of science and everyday reasoning.

  1.  **Explanatory Adequacy:** Any adequate theory must distinguish causal relations from mere correlations and must provide a basis for distinguishing token causation (what happened in this specific instance) from type-level causal capacity (what generally happens).
  2.  **Tool Interdependence:** We acknowledge that counterfactuals and interventions are mutually illuminating tools. P-CDM accepts that counterfactual truth conditions often rely on implicit assumptions about independent manipulations. P-INT accepts that the definition of an "ideal intervention" relies on counterfactual truths about what would happen were the intervention to occur. We reject the notion that these are wholly disjoint methodologies.
  3.  **Problem Case Coverage:** We agree that any complete theory must provide determinate verdicts on the three stipulated systems below, treating the descriptions as complete causal models:
      *   **Case A (Redundant Pumps):** Two pumps ($P_1, P_2$) operate; either suffices for Flow ($F$). Both operate; $F$ occurs.
      *   **Case B (Prevented Prevention):** A Fault ($F$) would block Update ($U$). A Monitor ($M$) removes $F$. $U$ proceeds. No direct contact between $M$ and $U$.
      *   **Case C (Adaptive Compensation):** Salt intake ($S$) affects Blood Pressure ($P$) only if a Reflex ($R$) is disabled. In the actual scenario, $R$ is active, $S$ varies moderately, and $P$ remains stable.
  4.  **Agreement on Case B:** We concur that in Case B, $M$ is a cause of $U$. Both accounts successfully handle causation by prevention of a preventer (omissive causation) without requiring physical contact, provided the counterfactual dependence (P-CDM) or the structural path (P-INT) is maintained.

  ## II. Precise Articulation of Remaining Disagreements

  Despite our shared commitments, we maintain distinct positions on the metaphysical priority of *actual dependence* versus *structural capacity*. Our disagreements are sharpest in Cases A and C.

  **Thesis 1: The Status of Redundant Causes (Case A)**
  *   **P-CDM Formulation:** In Case A, $P_1$'s operation is not a cause of $F$ in the strict token sense, because $F$ does not counterfactually depend on $P_1$ (if $P_1$ had failed, $P_2$ would have sustained $F$). To call $P_1$ a cause requires modifying the theory (e.g., via "quasi-dependence" or event fragility) to match the intuition that both pumps are "working causes." We maintain that without such modification, the lack of actual difference-making disqualifies $P_1$ as a token cause.
  *   **P-INT Formulation:** In Case A, $P_1$ is unequivocally a cause of $F$. Causation is defined by the existence of an ideal intervention on $P_1$ that changes $F$, *holding other variables fixed by the model structure*. Even if $P_2$ is actually active, the structural equation for $F$ includes $P_1$. The fact that $P_2$ masks the effect of $P_1$ in the actual context does not negate the causal relation; it merely indicates a specific context of instantiation.

  **Thesis 2: Context-Sensitivity of Causal Claims (Case C)**
  *   **P-CDM Formulation:** In Case C, $S$ is not a cause of $P$ in the actual scenario. Since $R$ is active and $P$ remains stable despite changes in $S$, there is no counterfactual dependence between actual variations in $S$ and $P$. Causation is a relation between actual events; if the effect does not vary, the cause is absent *in this token instance*, even if $S$ is a "potential cause" in other contexts.
  *   **P-INT Formulation:** In Case C, $S$ is a cause of $P$, but the relationship is invariant only relative to specific background conditions. The causal claim "$S$ causes $P$" is true because there exists a range of interventions on $S$ (and potentially $R$) that change $P$. The fact that $R$ is currently compensating is a fact about the *system state*, not a negation of the causal link. To deny $S$ is a cause is to confuse the stability of the output with the absence of causal structure.

  ## III. Identification of Cruxes

  We identify two cruxes where resolution would rationally compel one or both parties to revise their position. For each crux, we specify a test case and our antecedent expectations.

  **Crux 1: Intrinsicness vs. Extrinsicness of Causation**
  *   **Sub-question:** Does the causal status of a process depend solely on the intrinsic physical character of the process (P-CDM leaning), or does it depend on extrinsic alternatives and structural relations (P-INT leaning)?
  *   **Test Case (Modified Case A):** Consider "Early Preemption." $P_1$ triggers $F$. $P_2$ is ready to trigger $F$ but is shut off by $P_1$'s operation before it can act. Intrinsic physical processes are identical to Case A up to the flow.
      *   *P-CDM Expectation:* We expect intuition to judge $P_1$ as a cause here (due to dependence chain) but not in the original Redundant Pumps case. If intuitions do not shift between Redundancy and Preemption, P-CDM must concede that extrinsic factors matter more than actual dependence.
      *   *P-INT Expectation:* We expect intuition to judge $P_1$ as a cause in *both* cases. If P-CDM concedes $P_1$ is a cause in Preemption but not Redundancy, P-INT will argue this is an unstable distinction, as the structural capacity of $P_1$ is identical in both.
  *   **Resolution Condition:** If empirical study of reasoning shows agents assign responsibility equally in Redundancy and Preemption, P-CDM must adopt a structural view. If agents assign significantly less responsibility in Redundancy, P-INT must acknowledge that actual difference-making modulates causal attribution.

  **Crux 2: The Role of Background Stability (Case C)**
  *   **Sub-question:** Is a variable that is currently buffered by a homeostatic mechanism a "cause" of the stabilized variable?
  *   **Test Case (Modified Case C):** A pilot adjusts a control stick ($S$), but an autopilot ($R$) instantly corrects the plane's attitude ($P$) to maintain level flight.
      *   *P-CDM Expectation:* We expect the pilot's adjustment is *not* cited as the cause of the plane's attitude in the token instance, because the attitude did not change. The cause of the stable attitude is the autopilot.
      *   *P-INT Expectation:* We expect the pilot's stick is *always* a cause of the plane's attitude, because the causal channel remains open. The autopilot is a competing cause or a moderator, not a nullifier of the pilot's causal status.
  *   **Resolution Condition:** If medical or engineering diagnostics treat the buffered input ($S$) as a causal risk factor even when compensated (e.g., "Salt causes hypertension" is true even for those with healthy reflexes), P-CDM must accept type-level capacity over token dependence. If diagnostics treat $S$ as causally inert while $R$ is functional, P-INT must accept that actual invariance is required for token causal claims.

  ## IV. Judgment on Terminological vs. Substantive Disputes

  We conclude by distinguishing which aspects of our debate are verbal and which are metaphysical.

  **1. Merely Terminological:**
  *   **The Label "Cause":** We acknowledge that some disagreement stems from the scope of the word "cause." P-INT tends to use "cause" to denote *structural capacity* (type-level), while P-CDM tends to use "cause" to denote *actual explanation* (token-level).
  *   **Resolution:** We agree to adopt a disambiguated vocabulary. We will use **"Causal Capacity"** for P-INT's structural relations (invariant under intervention) and **"Token Causation"** for P-CDM's actual dependence relations. Under this stipulation, in Case C, $S$ has *Causal Capacity* regarding $P$, but $S$ is not a *Token Cause* of the actual $P$ value. This dissolves much of the apparent conflict.

  **2. Substantive:**
  *   **Metaphysical Priority:** The dispute is substantive regarding which notion is fundamental. P-CDM maintains that Token Causation is the primary metaphysical relation, and Causal Capacity is a generalization thereof. P-INT maintains that Causal Capacity (invariant structure) is fundamental, and Token Causation is merely the instantiation of that structure in a specific context.
  *   **Implications for Case A (Redundancy):** This is not merely verbal. If P-INT is correct, $P_1$ is a cause even if it made no difference, implying that causal responsibility exists without difference-making. If P-CDM is correct, $P_1$ is not a cause (without theoretical patching), implying that causal responsibility requires difference-making. This affects legal and moral accountability in overdetermination scenarios.
  *   **Implications for Case C (Compensation):** This is substantive for scientific practice. If P-INT is correct, we must treat compensated variables as active causes (requiring monitoring). If P-CDM is correct, we may treat them as inert until the compensation fails. This dictates different resource allocations in medicine and engineering.

  **Signed,**

  _________________________
  Proponent of Counterfactual Difference-Making

  _________________________
  Proponent of Interventionism
