          *   *Why ensemble wins:* Variance reduction. Individual traders have high variance (idiosyncratic error/noise). Averaging cancels noise. The market price might be biased by liquidity constraints or risk aversion (even if subsidized, traders might be risk-averse).
          *   *Translation Cheat:* Econ assumes traders *are* the market mechanism. ML separates models (traders) from aggregation (ensemble). The "No-Trade" theorem assumes the trade *is* the aggregation mechanism. If you separate them, you break the theorem's assumption that the price *must* reflect all info because traders *force* it to.
