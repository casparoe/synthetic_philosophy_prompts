      *   *(3) Trade as Self-Defeating Signal:*
          *   *Econ view:* If I sell to you, I signal I think price is too high. You update, price moves, edge disappears.
          *   *ML view:* Action-as-feature. If Model A outputs 0.8 and Model B outputs 0.6, and Model A tries to shift the aggregate toward 0.8, Model B should treat Model A's attempt as an input feature.
          *   *Is it Adverse Selection?* Yes, basically. It's "Data Leakage" via behavior.
          *   *Verdict:* It's not a defect in your thinking. It's the difference between *static evaluation* (ensemble) and *dynamic equilibrium* (market). In static ensembles, you don't update on the fact that a model *wanted* to predict 0.8, you just take the 0.8. In markets, the *act* of betting moves the price, changing the loss landscape for everyone else. Your vocab lacks "strategic interaction affecting the loss surface."

