answer: |-
  Good morning, everyone. Thanks for making it out early on a Saturday.

  Looking around the room, I know we've got a slightly unusual mix here. On one side, we have people who know the theoretical landscape of political obligation better than anyone else in the world. You've read the footnotes on the footnotes. And on the other side, we have people who have actually been in the room when the order came down—the lawyers, the civil servants, the folks who had to decide, in real time, whether to sign the memo or stall it.

  Usually, when we talk about refusal, the conversation defaults to a very binary question. It's basically: do citizens owe obedience to the state, or don't they? It's an on/off switch. Either you're a loyal citizen following the law, or you're a dissident breaking it. And if you're breaking it, you'd better have a really good reason, and you'd better be ready to accept the consequences.

  But that framework feels too blunt for what we're actually here to discuss.

  If you're a practitioner in this room, you know that what you did wasn't anarchy. You weren't trying to overthrow the system. In fact, you were probably trying to save it. You weren't acting as a private citizen marching in the street; you were acting as an official trying to uphold the very office you were sworn into. So when the literature treats bureaucratic pushback as just "civil disobedience with a desk job," it misses the point. It wasn't about rejecting authority. It was about one kind of authority conflicting with another.

  And if you're a theorist in this room, you know that collapsing that distinction creates a mess. If we treat every internal refusal as just another form of protest, we lose the specific moral weight of the office itself. We lose the idea that holding a public trust creates duties that are different from the duties of a private conscience.

  So here's the tension I want us to sit with this weekend. I want to suggest that political obligation isn't monolithic. It's not a single debt you owe to the state that you either pay or default on. It's layered. It's modular.

  Sometimes, the obligation to the chain of command is the heavy one. But sometimes, the obligation to the constitution, or to the public trust, or to the specific rules of your office, outweighs the obligation to the person currently signing your paycheck. When a bureaucrat refuses an order, they aren't necessarily saying "I don't owe the state anything." They're saying "I owe this specific thing more than I owe that specific thing."

  That's a harder problem to solve than the standard disobedience model. Because if it's just about competing duties, there's no clean exit. You don't get to walk away morally clean. You're still inside the machine, even when you're jamming the gears.

  My worry is that if we stick to the old frameworks, we'll either end up glorifying law-breaking in a way that makes the practitioners uncomfortable, or we'll end up preaching duty in a way that ignores the reality of what happens when the chain of command goes rogue.

  I don't want this weekend to be about applying a theory to a case study. I don't want the practitioners to feel like you're just data points for a paper, and I don't want the theorists to feel like we're ignoring the hard conceptual work you've done.

  Instead, can we try to map the overlap without erasing the difference? Can we talk about how you navigate those layered obligations without pretending there's a simple rulebook for it? Because the reality is, the people in this room who've lived through this know that there isn't a switch. There's just the weight of the competing claims, and the decision you make when you can't satisfy all of them.

  Let's spend the next couple of days figuring out how to talk about that mess honestly. Thanks for being here, and let's get started.
