  ### Toxin Puzzle Decision Tree

  **Root:** The Agent at Midnight.

  **Node 1 (Lockbox Variant):** Does the mere *availability* of an irrevocable commitment device (even if unused) make the intention formable?
  *   **No:** The barrier is internal to the agent's psychology. → **Go Left (Nature of Intention)**
  *   **Yes:** The barrier is external, relating to rational constraints on choice. → **Go Right (Norms of Rationality)**

  ---

  #### **Left Branch: Nature of Intention (Metaphysical/Psychological Barrier)**

  **Node 2 (Mirror Image Variant):** Is the psychological difficulty of forming an intention under *threat* identical to forming one for *reward*?
  *   **No:** Threats engage the will differently than rewards.
      *   **Leaf 1: Asymmetric Volition (Unoccupied).**
      *   *Awkward Commitment:* Posits a psychological asymmetry without a identified mechanism.
      *   *Diagnosis:* **Incoherent.** (Lacks empirical or conceptual basis for asymmetry).
  *   **Yes:** The structure of the will is invariant to valence.
      *   **Node 3 (Deterrence Variant):** Does the intention retain its strategic value if the adversary knows it will not be executed?
          *   **Yes:** The value lies purely in the state's existence, not its link to action.
              *   **Leaf 2: Strategic Intention (Unoccupied).**
              *   *Awkward Commitment:* Severs the conceptual link between intention and action.
              *   *Diagnosis:* **Unexplored.** (Threatens to redefine intention out of existence).
          *   **No:** The value depends on the believed likelihood of execution.
              *   **Node 4 (Stutter Variant):** Is the intention detected as a single discrete state or a continuous causal process?
                  *   **Yes (Continuous):** Intention must persist causally to count.
                      *   **Leaf 3: Process Skepticism (Unoccupied).**
                      *   *Awkward Commitment:* Makes intention impossible for any non-instantaneous agent.
                      *   *Diagnosis:* **Unattractive.** (Too demanding for ordinary agency).
                  *   **No (Discrete):** Intention is a state at a time.
                      *   **Leaf 4: Kavka's Skepticism.**
                      *   *Awkward Commitment:* Renders deterrent threats inherently irrational.
                      *   *Diagnosis:* **Occupied.** (Kavka, Velleman).

  ---

  #### **Right Branch: Norms of Rationality (Normative/Decision-Theoretic Barrier)**

  **Node 5 (Amnesia Variant):** If the agent forgets the *reason* for intending (midnight payoff) but retains the intention, is the intention rational?
  *   **No:** Rational intention requires ongoing access to justifying reasons.
      *   **Leaf 5: Reason-Dependent Rationality (Unoccupied).**
      *   *Awkward Commitment:* Makes all long-term intentions irrational upon forgetfulness.
      *   *Diagnosis:* **Unattractive.** (Conflicts with ordinary planning agency).
  *   **Yes:** Intention can be rational even if original reasons are inaccessible.
      *   **Node 6 (Late Counteroffer Variant):** Does a new, unexpected reason at noon (payment for *not* drinking) rationally defeat the midnight intention?
          *   **Yes:** Rationality is updated dynamically based on current evidence.
              *   **Leaf 6: Evidential Decision Theory.**
              *   *Awkward Commitment:* Agents pay for news they cannot causally influence.
              *   *Diagnosis:* **Occupied.** (Eells, Jeffrey).
          *   **No:** Rationality is locked by the initial decision procedure.
              *   **Node 7 (Friction Variant):** Does the addition of minor effort (unlocking the vial) justify not drinking?
                  *   **Yes:** Small costs can override prior intentions.
                      *   **Leaf 7: Deflationary (Ordinary Akrasia).**
                      *   *Awkward Commitment:* Denies the Toxin Puzzle is distinct from weakness of will.
                      *   *Diagnosis:* **Occupied.** (Holton, some psychologists).
                  *   **No:** Prior rational commitments override minor contrary incentives.
                      *   **Node 8 (Team Variant):** Is the rationality of intending dependent on the *partner's* intention?
                          *   **Yes:** Rationality is essentially interdependent/collective.
                              *   **Leaf 8: Team Rationality (Unoccupied).**
                              *   *Awkward Commitment:* Dissolves individual agency into group agency.
                              *   *Diagnosis:* **Unexplored.** (Radical collectivism).
                          *   **No:** Rationality is individual and resolute.
                              *   **Leaf 9: Resolute Choice (Intend then Drink).**
                              *   *Awkward Commitment:* Requires acting against one's current best judgment at noon.
                              *   *Diagnosis:* **Occupied.** (Gauthier, McClennen).

