answer: |-
  **Project Title:** Relational Welfare: A Framework for Structural Harm in Habitat Destruction

  **Project Summary**
  I'm proposing a three-month research project to develop a philosophical framework for evaluating habitat destruction, specifically targeting a blind spot in the wild animal suffering (WAS) debate. Currently, welfare-centric evaluations often suggest that destroying habitat might be net-positive because it reduces future populations and, consequently, aggregate suffering. I argue this misses a structural point: ecosystems have welfare-relevant organizational features (like predator-prey ratios or disturbance regimes) that aren't reducible to the sum of individual experiences. My goal is to formalize "structural welfare loss" as a distinct moral category and produce a decision framework that intervention evaluators can actually use.

  **The Research Question**
  The core question isn't just "do ecosystems matter?" but rather: *Do relational properties within an ecosystem carry independent normative weight in welfare assessments, even when aggregate individual suffering is reduced?*

  I want to test whether collapsing these relational structures constitutes a distinct kind of moral harm. If a habitat destruction event lowers the total sum of suffering but destroys the structural capacity for stable welfare dynamics (e.g., by removing keystone dependencies), is that a moral loss that isn't captured by standard utilitarian calculus?

  **Why Existing Answers Leave This Open**
  Right now, the field is split between two camps that don't talk to each other:
  1.  **The Aggregationists:** This group (mostly effective altruism/WAS focused) treats ecosystems as mere containers for individuals. Value is strictly the sum of individual experiences. If fewer animals exist, there is less suffering. They miss the normative significance of the *relationships* between those animals.
  2.  **The Deep Ecologists/Holists:** This group assigns intrinsic value to ecosystems but often disconnects that value from welfare or suffering. They might say destroying a wetland is wrong because it's "unnatural" or violates integrity, but they don't have a calculus that speaks to the welfare debate.

  There's a gap here. We need a view that respects the welfare-centric focus of the first group but incorporates the structural insights of the second, without smuggling in biodiversity aesthetics or human preference.

  **Approach and Methodology**
  This is a conceptual project. I won't be doing field biology or empirical data collection. The work will happen in two lanes:
  1.  **Conceptual Analysis:** I'll spend the first month defining "structural welfare." I need to show how features like disturbance regimes or trophic cascades function as welfare-relevant mechanisms, not just biological facts. The argument here is that these structures determine the *quality* and *distribution* of welfare, not just the quantity.
  2.  **Case Comparison:** I'll apply this framework to two contrasting scenarios:
      *   *Wetland Drainage:* Total habitat loss, population goes to zero.
      *   *Managed Fire Regimes:* Temporary disruption, structural reset, population fluctuates but persists.
      By comparing these, I can test whether the framework distinguishes between "bad destruction" and "necessary disturbance" in a way that simple suffering calculus doesn't.

  **Deliverables and Success Conditions**
  **Success:** By the end of three months, I will have a draft paper and a simplified "decision checklist" for intervention evaluators. Success looks like a framework where "structural welfare loss" is clearly defined, non-redundant, and actionable. If an evaluator can use my framework to say, "This intervention lowers suffering but causes unacceptable structural welfare loss," without contradicting themselves, the project works.

  **Failure:** The project fails if "structural welfare" turns out to be redundant. If I can't show that structural loss is distinct from long-term suffering forecasts (i.e., if structural loss is just a proxy for future suffering), then the framework adds nothing. It also fails if the definition collapses into aesthetic preference (e.g., valuing complexity just because it looks nice to humans).

  **Scope and Limitations**
  I'm flagging upfront that this is a three-month stipend project. There is no budget for empirical work or consultation with field biologists.
  *   **Biological Premises:** I will be taking biological claims (e.g., about keystone species or carrying capacity) from existing literature as given. I am not testing the biology; I am testing the normative weight we assign to that biology.
  *   **Time:** Three months is tight for a full ethical system. I'm aiming for a specific framework for *habitat evaluation*, not a general theory of value.
  *   **Risk:** The biggest risk is getting stuck on the metaphysics of group agency. I need to stay focused on welfare relevance to keep this usable for the WAS community.

  **Timeline**
  *   **Month 1:** Lit review and defining "structural welfare." Drafting the argument against pure aggregationism.
  *   **Month 2:** Case study analysis (wetlands vs. fire). Stress-testing the framework against redundancy objections.
  *   **Month 3:** Finalizing the decision framework and writing the draft paper.

  This work bridges a gap between conservation ethics and wild animal suffering research. If successful, it gives evaluators a way to say "no" to habitat destruction without relying on intuition alone.
