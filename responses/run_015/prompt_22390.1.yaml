      *   *Thomson's Original Argument (1954):* Thomson argued this leads to a contradiction. If it's on, it must have been turned off last. If it's off, it must have been turned on last. But there is no "last" switch. Therefore, supertasks are *logically impossible* (not just physically impossible).
