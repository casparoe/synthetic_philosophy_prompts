  4. **Consistency Refund Protocol.** If a User revision via the Toggle generates a contradiction elsewhere in the policy chain, a Consistency Refund shall be automatically triggered. This refund credits the User's account with governance tokens equivalent to the computational cost of resolving the paradox. Repeated triggering of Consistency Refunds may result in suspension of voting privileges due to excessive logical volatility. Users agree that consistency is a billable service feature, not a democratic right.

  5. **Data Modularity and Licensing.** All individual judgments submitted to the platform are fragmented into separable premise modules. Discursus retains an irrevocable, royalty-free license to aggregate, disaggregate, and sublicense these modules independently of the User's original intent. Users waive moral rights regarding the contextual coherence of their data once separated from the original proposition chain. A premise voted upon in isolation may be licensed to third parties without regard for the conclusion it originally supported.

  6. **Disclaimer of Collective Rationality.** THE PLATFORM IS PROVIDED "AS IS" WITHOUT WARRANTY OF COLLECTIVE RATIONALITY. Discursus explicitly disclaims liability for irrational collective outputs resulting from path dependency in sequential ballots. Users assume all risk associated with cyclical majorities, Condorcet failures, or any scenario where the collective will violates the laws of formal logic. This includes failures arising from strategic voting on premises intended to manipulate the final derivation. No remedy is available if the aggregate output fails to represent a coherent agent.

  7. **Arbitration of Logical Disputes.** Any dispute arising from perceived inconsistencies between premise-based aggregation and conclusion-based aggregation shall be resolved through binding arbitration. The arbitrator shall determine whether the inconsistency stems from User error or systemic path dependency. In all cases, the determination of logical validity takes precedence over the expression of popular will. Users agree to indemnify Discursus against claims arising from the inability of the majority to formulate a consistent preference schedule.

  8. **Termination for Logical Impossibility.** Discursus reserves the right to terminate access if a User's voting pattern consistently forces the collective into a state of logical impossibility. Continued use after such termination constitutes unauthorized access to a contradictory state space.

  Summary: The agreement posits that a democratic collective cannot be considered rational unless it sacrifices popular sovereignty to maintain logical consistency.
