prompt: |-
  I'm the valedictorian at my school's graduation in three weeks, and I'm stuck on the address.

  Our assistant principal chose a theme for the year — "Be Yourself" — and it's on the banners, on the program, and she has asked the student speakers to work it in. The trouble is that the framework I've actually spent this year thinking through, in Mr. Aldridge's senior elective on existentialism, makes that slogan close to unintelligible. On that view there is no finished self for any of us to go and be; treating your own traits as settled facts about you is exactly the evasion the view warns against, the way people dodge the discomfort of having to choose. So I can't echo the theme literally without saying something I think is false.

  But I also can't just stand up and say the opposite, for two reasons I keep running into.

  First, sincerity isn't an available substitute. As I understand the position, demanding sincerity from yourself is another attempt to locate a real self you could finally match up with — the same move in different clothes. So I can't rescue the theme by translating it into "be authentic" or "be true to who you really are." I need some third thing to put at the center of the speech, and I don't know what it is.

  Second, a good part of my class had very little room to choose. One friend worked four nights a week at his family's restaurant through senior year; another is enlisting in the fall because it's the only way she can afford college. It would be obscene to tell them they could have been anything they wanted. So the speech has to take seriously that people's situations are real and constraining, without turning around and implying that those situations are what people are.

  There's a personal version of this too. For four years I've been saying "I'm just not a math person," and I've come to suspect that sentence has been doing more work for me than I admitted. I'd like to be able to say something about that in the speech — honestly, in a way that isn't either a confession or a boast.

  The audience will be about four hundred people: classmates, parents, grandparents, teachers. Mr. Aldridge will be there and will hear exactly what I did with the theme. My grandmother, who raised me, will be in the front row and will not follow a word of philosophy. The principal wants warmth rather than a lecture, so no jargon, no French, and no philosophers named from the stage.

  Please write the six-to-eight-minute address. It has to work as a graduation speech first — my classmates should feel something rather than feel analyzed — but I want its structure to survive Mr. Aldridge's attention. Where the theme has to be echoed, echo it in a form I could defend. Afterwards, add a short note explaining what the speech is committed to and where the load-bearing moves are, so I can answer him if he asks me about it at the reception.
reasoning: |-
  Here's a thinking process that leads to the suggested valedictory address:

  1.  **Analyze the Request:**

      *   **Role:** Valedictorian.
      *   **Context:** High school graduation in three weeks.
      *   **Audience:** ~400 people (classmates, parents, grandparents, teachers). Specifically: Mr. Aldridge (existentialism teacher, knows the philosophy), Grandmother (raised the speaker, won't follow philosophy), Principal (wants warmth, no jargon).
      *   **Theme:** "Be Yourself" (mandated by Assistant Principal).
      *   **The Conflict:** The speaker finds "Be Yourself" philosophically unintelligible based on their study of existentialism (no fixed self, treating traits as facts is bad faith/evasion).
      *   **Constraints:**
          *   Cannot literally endorse "Be Yourself" as finding a fixed identity.
          *   Cannot simply swap it for "Be Authentic/Sincere" (same philosophical problem).
          *   Cannot ignore socioeconomic constraints (some classmates *had* to work, enlist, etc.; "you can be anything" is obscene).
          *   Must address the speaker's personal "I'm not a math person" realization without it being a confession or boast.
          *   Tone: Warm, emotional, not a lecture. No jargon, no French, no namedropping philosophers.
          *   Length: 6-8 minutes (approx. 900-1200 words spoken at a moderate pace).
          *   **Deliverable:** The speech + a short explanatory note for Mr. Aldridge.

  2.  **Deconstruct the Philosophical Problem:**

      *   *The Trap:* "Be Yourself" implies a pre-existing essence. Existentialism says existence precedes essence. You create yourself through action.
      *   *The "Sincerity" Trap:* Trying to be "true" to an inner core is still looking for an essence.
      *   *The Constraint Trap:* Determinism vs. Freedom. Acknowledging real limits (money, family duty) without saying those limits *are* the person.
      *   *The Solution:* Shift from "Being" (noun) to "Doing" (verb). Shift from "Who you are" to "What you are building." The theme "Be Yourself" needs to be reinterpreted as "Make Yourself" or "Keep Choosing."
      *   *The "Math Person" Angle:* This is a label used as an excuse (bad faith). Admitting the label was a shield, not a truth.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the theme immediately but gently pivot it. Warmth for the families/grandma.
      *   **The "Be Yourself" Pivot:** Don't reject it, but deepen it. It's not about discovering a statue inside you; it's about sculpting.
      *   **Addressing Constraints (The Socioeconomic Angle):** Acknowledge the friends who worked or are enlisting. Validate their reality. Their choices weren't "free" in a vacuum, but they were *actions* that defined them. This avoids the "you can be anything" toxicity.
      *   **The Personal "Math" Story:** Use the "I'm not a math person" line. Show how it was a comfort, a way to stop trying. Realize that dropping the label didn't make me a genius, it just made me responsible for the effort.
      *   **The Call to Action (The "Third Thing"):** Instead of "Be Yourself," propose "Keep Becoming." Or "Stay in Motion." Let's go with the idea of *responsibility for the next step*.
      *   **Closing:** Bring it back to the community. Warmth. Gratitude.

  4.  **Refining the Tone:**

      *   *For Grandma:* Keep sentences clear. Use metaphors (building, walking, masks).
      *   *For Mr. Aldridge:* Ensure the underlying logic holds up to Sartrean scrutiny without using Sartrean words. Focus on *projection* into the future and *anguish* of choice (softened).
      *   *For the Principal:* Keep it uplifting, not cynical.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi everyone. Theme is Be Yourself.
      *   But who is that? I used to say I'm bad at math. That was a lie I told myself to stop trying.
      *   Some of us had to work jobs. That wasn't a choice, but how we handled it was ours.
      *   So "Be Yourself" means don't stop moving. Don't pick a label and sit down.
      *   Thanks to teachers and family.

      *Critique 1:* Too dry. Needs more emotion. The transition from the math story to the economic constraints needs to be smoother. The philosophical pivot needs to be subtle enough for Grandma but sharp enough for Aldridge.

  6.  **Drafting - Iteration 2 (Focusing on Language):**
      *   Use the metaphor of a "script" vs. "improvisation."
      *   When discussing the friends working/enlisting, frame it as "carrying weight" rather than "making choices."
      *   The "Math" story needs to be about *relief* in giving up the label, not just failure.
      *   The reinterpretation of "Be Yourself": It's an imperative, not a description. "Be" as a verb of becoming.

  7.  **Writing the Speech (incorporating constraints):**

      *   *Word Count Check:* 6-8 minutes is roughly 900-1100 words.
      *   *Opening:* Welcome, acknowledge the banners.
      *   *The Twist:* "Be Yourself" sounds like a command to find something lost. What if it's a command to build something new?
      *   *The Math Anecdote:* "I'm not a math person." It was a shield. Taking it down was scary.
      *   *The Classmates:* To those who worked, who enlisted. You didn't have the luxury of wondering who you were. You had to *be* something for your family. That is the ultimate version of this theme.
      *   *The Synthesis:* We are not nouns. We are verbs.
      *   *Closing:* Thank yous.

  8.  **Review against Philosophical Constraints:**
      *   *No fixed self?* Check. Emphasize continuous creation.
      *   *No "Sincerity"?* Check. Focus on action/responsibility, not inner truth.
      *   *Constraints acknowledged?* Check. The friends with jobs didn't choose the situation, but they chose their stance toward it.
      *   *Math story?* Check. Used as an example of "bad faith" (hiding behind a label) without using the term.

  9.  **Writing the Explanatory Note:**
      *   Need to explain to Aldridge *why* this works philosophically.
      *   Highlight the shift from Essence to Existence.
      *   Explain how the socioeconomic point avoids libertarian "free will" ignorance.
      *   Explain the "Math" anecdote as an admission of Bad Faith.

  10. **Final Polish:** Check rhythm and flow. Ensure the emotional beats land. (Self-Correction: Make sure the transition from the heavy stuff about money/enlisting back to the uplifting close isn't too jarring.)

  **(Self-Correction during drafting):** I need to make sure I don't sound like I'm lecturing the class on existentialism. The note to Aldridge handles the theory; the speech handles the *feeling* of the theory. The speech must feel like *advice*, not *analysis*.

  Let's write.

  *Word Count Target:* ~1000 words.
  *Tone:* Reflective, warm, firm.

  *(Drafting content...)*
  *Opening:* Good morning... banners...
  *Theme:* "Be Yourself." Sounds simple.
  *Philosophy (hidden):* It implies we are finished products. We aren't.
  *Math:* I used that label to quit.
  *Friends:* Some didn't have the choice to quit. They carried burdens.
  *Reframing:* "Be" is a verb.
  *Closing:* Go make yourselves.

  *Note to Aldridge:* Explicitly map the speech moves to the concepts (Bad Faith, Existence precedes Essence, Facticity vs. Transcendence).

  11. **Final Review:** Does this meet the 6-8 minute mark? At 130-140 words per minute, 1000 words is about 7 minutes. Perfect.

