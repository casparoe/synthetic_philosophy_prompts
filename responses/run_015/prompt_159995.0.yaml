answer: |-
  The stalemate you describe is a familiar pathology in the literature, and your diagnosis is astute. While both your hypotheses identify genuine friction points, the second hypothesis—that the disagreement is fundamentally about the aims of semantics—best explains the impasse, while the first hypothesis explains why the impasse is so resistant to empirical dissolution. [High Confidence] The debate persists not because the data is insufficient, but because the two camps are optimizing for different theoretical virtues and therefore tolerate different costs. [High Confidence]

  The view that vagueness is ignorance (epistemicism) commits itself to preserving classical logic and bivalence at the expense of an error theory regarding our linguistic competence. [High Confidence] Its proponents argue that semantics must deliver truth-conditions that reflect the way the world is, independent of our epistemic access. [High Confidence] Consequently, they accept that there is a sharp boundary, however unknowable, because to deny this is to abandon classical logic, which they view as non-negotiable. [High Confidence] Conversely, the supervaluationist view commits itself to preserving the intuition that borderline cases are genuinely indeterminate, at the expense of bivalence and certain classical inference rules. [High Confidence] Its proponents argue that semantics must account for what speakers are in a position to assert, meaning truth cannot outstrip knowability in borderline regions. [High Confidence] Because one side prioritizes logical form and the other prioritizes phenomenological adequacy, they talk past one another: when one cites the absurdity of ignorance, the other cites the absurdity of truth-value gaps, and neither concession is acceptable to the other given their prior methodological commitments. [High Confidence]

  This methodological divergence is shielded by the reliance on one-dimensional toy cases, as your first hypothesis suggests. [High Confidence] In simple Sorites series, a translation manual often exists: the epistemicist's 'true but unknown' maps functionally onto the supervaluationist's 'supertrue', and the 'false but unknown' maps onto 'superfalse'. [Medium Confidence] The gap cases map onto 'unknown'. [High Confidence] Because the output regarding assertion conditions is nearly identical in these constrained scenarios, no pattern of tolerant judgements discriminates between them. [High Confidence] However, moving to multi-dimensional cases does not automatically break the stalemate unless the methodological dispute is bracketed. [High Confidence]

  For a multi-dimensional test case to force a genuine divergence, it must exploit the structural differences in how each theory models the penumbra. [Medium Confidence] Consider a predicate like 'intelligent', which depends on distinct faculties (memory, reasoning, creativity) that do not vary linearly. [High Confidence] The supervaluationist must define 'admissible sharpenings' over this multi-dimensional space. [High Confidence] If admissibility requires precision on each dimension independently, there may be regions where no admissible sharpening assigns a truth-value, creating 'truth-value gaps' that are not merely epistemic. [Medium Confidence] The epistemicist, however, is committed to a single sharp boundary surface in this multi-dimensional space. [High Confidence] To discriminate between them, one would need a case where the topology of the boundary matters for logical validity, not just truth-values. [Medium Confidence] For instance, if connectedness of the extension is required for certain inferences, supervaluationism might allow disconnected extensions where epistemicism does not. [Low Confidence] Yet, sophisticated epistemicists can argue the boundary is simply complex, and supervaluationists can constrain admissibility to mimic connectedness. [High Confidence] Thus, without an independent criterion for admissibility or boundary location, the translation manual can likely be extended to swallow these cases too. [Medium Confidence]

  Therefore, progress requires settling what a semantic theory is supposed to deliver before the substantive question can be posed. [High Confidence] We must decide whether semantics is a branch of metaphysics describing word-world relations, or a branch of cognitive science describing speaker competence. [High Confidence] If the aim is the former, epistemicism has the advantage of logical simplicity. [Medium Confidence] If the aim is the latter, supervaluationism has the advantage of psychological plausibility. [Medium Confidence] Settling this requires moving away from armchair intuition about truth and towards work on speakers' actual judgements regarding assertion and confidence. [High Confidence] Specifically, we need experimental data on whether speakers treat borderline claims as false, true, or neither, and whether this varies with the cost of error. [Medium Confidence] If speakers systematically hedge in ways that align with probability distributions rather than binary truth-values, this supports a model where semantics delivers assertibility conditions rather than classical truth-conditions. [Medium Confidence]

  Given this diagnosis, progress would look like a change of question rather than a verdict on the current one. [High Confidence] Instead of asking 'Is the borderline sentence true or false?', the reading group should ask 'Under what conditions is a speaker warranted in asserting the borderline sentence?'. [High Confidence] This shifts the burden from metaphysics to norms of communication. [High Confidence] A formal result linking degrees of confidence to admissibility constraints could bridge the gap, showing how classical logic emerges from fuzzy norms. [Low Confidence] Alternatively, abandonment of the question may be necessary if it turns out 'vagueness' names no unified phenomenon but rather a cluster of distinct linguistic failures. [Medium Confidence]

  **Least Confident Claim**
  The claim I am least confident of is that multi-dimensional cases cannot force a divergence between the theories if the translation manual is extended. [Low Confidence] It is possible that the topology of admissible sharpenings in high-dimensional spaces generates logical validities that epistemicism cannot mimic without ad hoc adjustments. [Low Confidence] What would settle this is a formal proof demonstrating that no epistemic model can replicate the validity patterns of a supervaluationist model over a specific class of multi-dimensional predicates, or vice versa. [Medium Confidence] Until such a result is produced, the suspicion that the divergence is merely notational remains live. [High Confidence]
