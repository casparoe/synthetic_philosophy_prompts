answer: |-
  Based on the consistency of her prior judgments, here is the predicted verdict, the underlying principle, and the analysis of the moral stakes.

  ### Predicted Verdict
  **She should reject the proposal.**

  To approve the destruction of the bronze plaques would contradict her stance in **Verdict 1** (removing a physical object betrays the duty to remember) and **Verdict 3** (the state must erect public memorials within living memory). More critically, to replace them with a generative AI system contradicts **Verdict 5**, which mandates "permanent, unalterable preservation" for institutional records of public harm. The proposed installation relies on "algorithmically reconstructed inferential material," which is inherently alterable and fluid, violating the requirement for fixed stability when documenting atrocity.

  ### Closest Analog
  **Verdict 1 (The Monument to the Founder)** is the closest analog.

  In Verdict 1, she prioritized the retention of the physical object despite its problematic history, arguing that "removing the physical object betrays the duty to remember." This establishes a precedent that the *material persistence* of the memorial is itself a moral requirement, distinct from the information it conveys. In the new case, the council proposes to destroy the physical plaques; under the logic of Verdict 1, this erasure constitutes a moral failure regardless of the sophistication of the replacement. Verdict 5 (Archives) provides secondary support regarding the "unalterable" nature of the record, but Verdict 1 is the direct precedent for the sanctity of the *public memorial object* itself.

  ### Best Explanatory Principle
  The pattern across her five judgments is best explained by the principle that **treats the fixed material form of collective memorials as itself carrying moral authority that algorithmic personalization undermines.**

  *   **Why not the Content/Accessibility Rule?** If she believed medium transformation was permissible so long as content was preserved, she would have allowed the removal of the founder's monument in Verdict 1 (provided the history was taught elsewhere) or allowed the auto-deletion of public harm records in Verdict 5 (provided backups existed). Her insistence on *physical retention* (Verdict 1), *public erection* (Verdict 3), and *unalterable preservation* (Verdict 5) demonstrates that the *stability and materiality* of the record are moral goods in themselves, not just vehicles for information.

  ### Distinguishing Case
  To definitively distinguish between the "Content/Accessibility" rule and the "Material Authority" rule, the following case would be most effective:

  **The Case:** A museum proposes to melt down the original bronze plaques to fund a scholarship for survivors' grandchildren, but first creates a high-resolution, static, read-only digital archive of the inscriptions that is publicly accessible in perpetuity.

  *   **If she approves:** She adheres to the **Content/Accessibility Rule**. The information is preserved faithfully, and the material form is sacrificed for a new ethical good (care for descendants).
  *   **If she rejects:** She adheres to the **Material Authority Rule**. Even with perfect content preservation, the destruction of the original material witness is impermissible because the object itself anchors the memory against the fluidity of the present. (Given Verdict 1, she would likely reject this).

  ### Moral Principles at Stake
  Her decision in this new case will clarify the foundational ethic of her seminar:

  *   **If she approves the installation:** She adopts a principle that the duty to remember binds a community only to the **faithful transmission of truth and accessibility.** Here, memory is a living practice meant to serve the ethical needs of the present (engagement, understanding). The medium is subservient to the message; if a new medium (AI) better facilitates "genuine historical understanding" (cf. Verdict 4), the old medium may be discarded. This aligns with a more Margalit-esque "ethics of care," where the relationship to the memory matters more than the relic.
  *   **If she rejects the installation:** She adopts a principle that the duty to remember binds a community to the **material witness of the record.** Here, memory functions as a constraint on the present; the fixed object resists the "therapeutic" desire to make the past comfortable or personalized. The bronze plaque is not just a data storage device but a moral anchor that refuses to be rewritten by algorithmic inference. This aligns with a Rieff-esque concern that dissolving authoritative tradition into fluid interpretation is a form of strategic forgetting, where the *stability* of the wrong is necessary to prevent its dissolution.
