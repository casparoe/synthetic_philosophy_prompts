      *   *Circularity:* If the bed is made of frozen past flows, saying "the bed determines the flow" is tautological. It reinforces contingency (the initial pebble mattered immensely) rather than inevitability.
      *   *Conclusion:* Path dependence undermines the "invariant riverbed" claim. It supports *contingent inevitability* (once locked, hard to change) but not *structural inevitability* (always would have happened).

  5.  **Task 4: Evaluating the Inevitability Conclusion:**

      *   Does it survive? No. The analogy smuggles in determinism by treating structures as exogenous when they are endogenous.
