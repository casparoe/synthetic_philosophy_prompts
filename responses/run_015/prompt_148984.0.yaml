      *   *Metric:* Macro-outcomes (state formation, industrialization, hegemony).

  3.  **Task 2: Disanalogies (The Fractures):**

      *   *Agency:* Water doesn't think; humans do. Humans anticipate the riverbed and build dams/canals.
      *   *Reflexivity:* The riverbed isn't static. Humans change geography (climate change, terraforming) and institutions.
      *   *Metric Bias:* Defining "same channel" often ignores qualitative differences (e.g., "Industrialization happened" ignores *how* it happened, which matters for the outcome).
      *   *Timescales:* Hydrology is continuous; history has punctuated equilibria.

  4.  **Task 3: Path Dependence (QWERTY):**

      *   *Concept:* Small initial advantages + increasing returns = lock-in.
