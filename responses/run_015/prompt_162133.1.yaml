answer: |-
  Hi there,

  This is a solid instinct and your half-formed idea is actually much closer to a complete lesson plan than you might think. The core mechanism of holding the arithmetic constant while shifting the metaphysical container around it is exactly how you get students to feel the weight of the separateness of persons without needing the terminology upfront. You are right to worry about the slide between additivity and compensability, so I would tweak your payoff structure slightly to make that distinction visceral rather than just numerical. For the first round, keep your four students per group but frame the points as non-transferable credits, like individual exemptions from a future assignment or tickets to an event that cannot be resold. This enforces the constraint that the winner cannot hand their gain to the loser, which mirrors the utilitarian assumption that utility is comparable across persons even if the specific goods are not transferable. You will need to arrange your eighteen students into four groups of four, with you stepping into a fifth group or having two students act as scribes to record the group's decision and the loser's statement. The numbers should be stark, perhaps Policy A gives three students ten points each and one student negative twenty points, while Policy B gives everyone zero. The total for A is ten, the total for B is zero, so the utilitarian calculus is clear, but the distribution is brutal. Have them discuss for five minutes, vote, and then require the student with the negative payoff to state whether they accept the outcome. This forces the interpersonal cost into the open.

  For the second round, you want to shift the container from the group to the individual to test the intrapersonal intuition. Have one student from each group volunteer to act as a single person over four time periods, perhaps labeled Monday through Thursday. Give that single student the exact same four cards from the previous round, but now they represent the welfare of the same person at different times. The arithmetic is identical, but the metaphysical situation has changed because we generally accept that a person can sacrifice on Monday for a gain on Thursday in a way that we hesitate to accept between two different people. To address your specific interest in transferability, you should frame this round as a bank account where the points are fully transferable across days, unlike the non-transferable tickets in round one. This highlights that within a life, compensation is possible because the loser and the winner are the same entity, whereas across lives, the compensation is merely arithmetic, not experiential. Ask the student to decide alone and then report whether the decision felt easier or harder than the group decision. You will likely find that most students find the intrapersonal sacrifice more acceptable, which is the intuition you are hunting.

  The third round should introduce the veil of ignorance element you suggested, but be careful not to let it drift into a full lecture on Rawls. Have the groups reassemble, but this time they must choose the decision rule before anyone opens the cards. They can choose to maximize total points or to maximize the minimum payoff. This tests whether their objection to the first round was about the outcome or about the lack of consent. If they choose the maximin rule here, it suggests that the problem in round one was the risk of being the牺牲ificial lamb, not necessarily the aggregation itself. This sets up the debrief perfectly because you can then ask why the arithmetic being identical didn't guarantee the moral feeling being identical.

  When you move to the debrief, you need to map these moments carefully without rushing to the label. Start by asking why the second round felt different despite the numbers being the same. Students will likely say that it is the same person suffering and benefiting, which allows you to introduce the idea that utilitarianism treats society as a single super-person. This is where you name the separateness of persons objection. You need to explain that the complaint in round one is not just that someone lost, but that their loss was used as a means to balance the equation for others, which violates the distinction between persons. For the transferability point, highlight that in round one, the winner cannot actually give their joy to the loser to make up for the pain, so the compensation is only happening in the observer's calculator, not in the students' lived experience. In round two, the Thursday self can thank the Monday self, making the compensation real. Regarding round three, explain that choosing the rule beforehand quiets the complaint because it introduces consent, but a utilitarian would argue that you should still choose the rule that maximizes the total even if you might end up as the loser, because the total good is what matters. This tension between ex-ante fairness and ex-post maximization is where the real philosophical work lies.

  There are a few things that will predictably go wrong that you should be ready to handle. The most common issue is that at least one student will argue that round two is just as bad as round one, claiming that their Tuesday self is practically a different person from their Monday self. This is actually a philosophically sophisticated objection regarding personal identity over time, but it can derail the lesson if you let it dominate. You should acknowledge the insight but steer them back by asking if they would legally allow a person to sign a contract binding their future self, whereas we do not allow one person to sign a contract binding another person without consent. This restores the distinction between intrapersonal and interpersonal without getting bogged down in metaphysics. Another predictable problem is that in round one, the group might simply refuse to implement Policy A and lie about the results to protect the loser. You need to enforce the rule that they must choose a policy based on the numbers, or else the simulation fails. If they rebel, use that rebellion as data for the debrief, asking why they felt compelled to break the rules of the game.

  Finally, you need to be straight with yourself about what the game cannot show. The activity demonstrates intuitions about fairness and risk, but it does not prove that utilitarianism is false. A committed utilitarian can argue that the students' discomfort in round one is just a bias they should overcome, and that the arithmetic really is all that matters. The game cannot refute that claim on its own. You will have to say in so many words that the separateness of persons is a deontological constraint, not a utilitarian calculation, and that the point of the objection is to show that some things cannot be traded off even for the greater good. The game shows the conflict, but you must provide the framework to understand why the conflict exists. You also cannot show through the game why the aggregation is wrong in principle, only that it feels wrong in practice. You will need to articulate that the objection is about the structure of moral reasoning, specifically that we are distinct individuals who cannot be merged into a single vessel of experience. If you leave that part implicit, students might walk away thinking the lesson is just that equality is better than efficiency, which misses the deeper point about the nature of persons.

  I hope this helps you run a tight session. The structure you have is strong enough to carry the weight of the concept as long as you keep the numbers identical and the debrief focused on the container rather than the content. Good luck with the seminar.

  Best wishes
