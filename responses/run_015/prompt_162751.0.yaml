          *   *Test:* Is this a valid epistemic move? Global skepticism often fails because it demands a standard of justification it cannot meet itself. But the student argues that if (6) is true, we can't justify (6).
          *   *Weakness:* This looks like a symptom, not the disease. If (3) is false, (7)-(8) doesn't matter. If (3) is true, (7)-(8) is fatal. So the error must be upstream.

      *   *Candidate 4 (New): Step (3) again, specifically the notion of "Probability".*
          *   *Idea:* Step (3) assumes that because the filter favors X, Evidence E cannot raise P(X). But if the filter favors X *conditional on X being true* more than *conditional on X being false*, E still supports X.
          *   *Steelman:* The student argues the filter favors X *regardless* of truth (winners write history whether they were right or wrong).
          *   *Refinement:* The error is assuming the filter is *independent* of the truth value in a way that severs correlation. Winners write history, yes, but winners also *exist*. The fact that they won is itself evidence about the conflict (they had more resources, better strategy, etc.). The record preserves the winner's view, but the winner's view is correlated with the outcome (winning). The filter doesn't just select "Winner's Story," it selects "Winner's Existence."

      *   *Candidate 5 (Strongest): Step (3) - The Likelihood Principle.*
          *   *Idea:* Step (3) claims a selective filter carries *no* information about which candidate is true. This is demonstrably false in probability theory. A filter carries information unless the probability of passing evidence is identical across all competing hypotheses.
