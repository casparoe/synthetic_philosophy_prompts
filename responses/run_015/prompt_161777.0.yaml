      *   *Nuance:* On Counterfactual Fairness. It's theoretically sound but practically unverifiable without a causal graph. Emphasize this.
      *   *Nuance:* On Label Bias. If the model predicts "success" based on "past hires," and past hires were racist, the model is racist even if blind. This is crucial.
