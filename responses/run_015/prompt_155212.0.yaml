answer: |-
  ### Exam Question: The Meta-Language Dilemma in Frame-Bound Dialetheism

  **Prompt:**
  Consider the position of **frame-bound dialetheism**. Unlike Graham Priest's global dialetheism, which accepts true contradictions in reality itself, frame-bound dialetheism holds that contradictions are genuinely true only within specific interpretive frames (e.g., legal codes, quantum mechanical models, or semantic paradoxes), while maintaining that the global description of the world remains consistent.

  Write an essay evaluating whether frame-bound dialetheism solves the problem of logical explosion more effectively than unrestricted dialetheism. Your answer must address the following tension: To demarcate the boundaries where contradictions are permitted, one must employ a meta-language. Does defining these frames require a consistent logic that undermines the dialetheic claim? Or can the meta-language itself be paraconsistent without triggering a regress? Conclude by assessing whether this view successfully retains true contradictions or collapses into a consistent contextualism about truth.

  ***

  ### Model Answer

  Frame-bound dialetheism attempts to secure the benefits of paraconsistency—specifically, the ability to tolerate contradictions without triviality—while avoiding the ontological extravagance of Priest's global dialetheism. By restricting true contradictions to specific domains or "frames," this view aims to isolate explosion locally. However, upon closer inspection, the view faces a severe meta-language dilemma that threatens to smuggle classical consistency back into the foundation of the system, thereby undermining its dialetheic credentials.

  The primary motivation for any dialetheic view is to handle paradoxes, such as the Liar, without accepting the principle of explosion (*ex contradictione quodlibet*). In unrestricted dialetheism, the logic itself is paraconsistent; $A$ and $\neg A$ can both be true without entailing every $B$. Frame-bound dialetheism adopts a similar local strategy: within Frame $F$, $A$ and $\neg A$ are true, yet explosion is blocked within $F$. This successfully prevents a contradiction in legal code or quantum semantics from rendering all statements in that domain true. Superficially, this seems safer than Priest's view because it denies that reality *itself* is contradictory, limiting the anomaly to our descriptive frameworks.

  However, the stability of this view depends entirely on the logic used to define the frames. To assert that "Contradictions are true only in Frame $F$," one must make a claim in a meta-language $M$ that describes the relationship between $F$ and the world. If $M$ operates on classical logic, then the global description of the system is consistent. This creates a hierarchy where contradictions are merely objects of study within a consistent meta-theory. In this scenario, the dialetheism is not genuine; it is merely a report that certain frames *model* inconsistency. The contradiction is not "true" simpliciter, but only "true-in-$F$." If the truth predicate is indexed to the frame, the law of non-contradiction holds globally at the meta-level: it is not the case that ($P$ is true-in-$F$ and $\neg P$ is true-in-$F$) implies triviality for the whole system.

  If the proponent argues that the meta-language $M$ must also be paraconsistent to preserve genuine dialetheism, they face a regress problem. If $M$ allows true contradictions, what demarcates the boundaries of $M$? We would require a meta-meta-language $M^*$ to define the limits of $M$'s contradictions. If this chain continues infinitely, we never arrive at a stable account of where the contradictions actually reside. If it stops at a global level, that top level must be consistent to define the boundaries of the levels below it. Consequently, consistency is reinstated at the highest level of analysis.

  This leads to the charge of collapse into contextualism. If contradictions are only true relative to a frame, and the framework governing those frames is consistent, then "true contradiction" reduces to "consistent assertion of incompatible norms within a subsystem." This fails to capture the radical insight of dialetheism: that some contradictions are true *simpliciter*. Frame-bound dialetheism solves the explosion problem cleanly by quarantining it, but it does so by sacrificing the ontological claim that contradictions are real features of truth. It treats contradictions as useful fictions within specific languages rather than truths about the world.

  In conclusion, frame-bound dialetheism does not solve the explosion problem *better* than Priest's view; it solves it differently by changing the subject. It avoids triviality by ensuring the meta-language remains consistent, but this consistency comes at the cost of genuine dialetheism. The view ultimately protects logic from explosion by ensuring that the logic used to describe the explosion remains classical. Therefore, while it is philosophically safer than unrestricted dialetheism, it fails to maintain the core thesis that true contradictions exist, collapsing instead into a sophisticated form of consistent contextualism.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Distinction between Global and Frame-Bound Dialetheism (4 marks)**
  *   **Requirement:** Clearly articulate that Priest's view accepts contradictions globally/ontologically, while frame-bound views restrict them to specific domains/models.
  *   **Typical Wrong Move:** Treating frame-bound dialetheism as simply "agnosticism" about truth rather than a specific restriction on where contradictions hold.

  **2. Explanation of Explosion and Local Blocking (4 marks)**
  *   **Requirement:** Explain how paraconsistency blocks *ex contradictione quodlibet* within the frame, preventing the contradiction from infecting the whole system.
  *   **Typical Wrong Move:** Assuming that paraconsistent logic automatically blocks explosion without explaining that the containment relies on the inference rules holding locally.

  **3. The Meta-Language Consistency Dilemma (4 marks)**
  *   **Requirement:** Identify that defining the "frame" requires a meta-language, and argue that this meta-language must be consistent to successfully demarcate the boundary.
  *   **Typical Wrong Move:** Ignoring the logic used to define the frames and focusing only on the object language within the frames.

  **4. Analysis of Truth Predicates (True vs. True-in-Frame) (4 marks)**
  *   **Requirement:** Analyze whether indexing truth to a frame ("true-in-$F$") removes the contradiction from being a genuine truth claim, reducing it to a consistent report of incompatibility.
  *   **Typical Wrong Move:** Equating "true-in-frame" with standard relativism without addressing whether the contradiction remains genuine or becomes merely notional.

  **5. Final Evaluation of Efficacy vs. Ontological Cost (4 marks)**
  *   **Requirement:** Conclude whether the view succeeds by weighing the benefit of avoiding global triviality against the cost of losing genuine true contradictions (collapsing into contextualism).
  *   **Typical Wrong Move:** Claiming the view is strictly "better" without acknowledging that it sacrifices the core dialetheic claim to achieve that stability.
