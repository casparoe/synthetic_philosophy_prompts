  I'm putting together a take-home for my upper-level logic seminar and I'm stuck on the dialetheism unit. I want one essay prompt that forces students past the usual 'explain Priest and the Liar paradox' routne. Specifcally, I'm playing with this notion of 'frame-bound dialetheism'—the idea that contradictions are genuinely true, but only inside specific interpretive frames like legal codes or quantum descriptions, never globally. I want the exam to ask whether this frame-bound version actually solves the explosion problem more cleanly than Priest's unrestricted dialetheism, or if it secretly smuggles consistency back in through the meta-language used to demarcate the frames. The students should have to confront whether you can maintain that some contradictions are true without being able to derive arbitrary conclusions inside those frames, and whether the boundary-drawing itself requires a non-contradictory logic that undermines the view.

  Please draft the exam question, a model answer around 600-800 words, and a marking scheme with five must-hit points totaling 20 marks. For each point, include a one-line note on the typical wrong move—like treating frame-bound dialetheism as just a form of contextualism about truth, or assuming that paraconsistent logic automatically blocks explosion inside frames. Make the difficulty come from analyzing the meta-language problem, not from memorizing Priest's bibliography. Oh and I dont need citations or reading lists—this is for students who dont have web access during the exam.
