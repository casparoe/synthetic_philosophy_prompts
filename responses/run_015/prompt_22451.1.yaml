          *   Help Case: "I don't care at all about helping the environment, I just want to make as much profit as I can." -> People say "Not intentionally helped."
      *   *Standard Interpretation (Knobe):* Moral valence affects ascription of intentionality. Our concept of "intentional" is not purely descriptive; it's partly normative.
      *   *Critique (Alternative Explanations):*
