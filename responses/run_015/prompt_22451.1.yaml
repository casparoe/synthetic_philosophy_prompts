answer: |-
  **Title:** The Blame Game: Why the Knobe Effect Is Real, But Not What You Think
  **Subtitle:** Experimental philosophy's most famous finding tells us less about "intention" and more about how we weaponize language.

  If you've dipped a toe into experimental philosophy (x-phi) in the last twenty years, you've met the Chairman.

  In the classic vignette, a chairman is told a new program will increase profits. In the "Harm" version, he's told it will also harm the environment. He replies, "I don't care at all about harming the environment. I just want to make as much profit as I can." In the "Help" version, the program helps the environment, and he says, "I don't care at all about helping the environment."

  In both cases, the side effect is identical in terms of mental state: foresight without desire. The chairman knows the outcome will happen, but it isn't his goal. Yet, when asked if the chairman brought about the side effect *intentionally*, people overwhelmingly say **yes** for harm and **no** for help.

  This is the Knobe Effect (or the Side-Effect Effect). The standard story, championed by Joshua Knobe and others, is revolutionary: it suggests our folk concept of "intention" isn't a clean, descriptive mechanical switch. Instead, it's "normatively loaded." We smuggle blame into the definition of intention itself. To call an action intentional is partly to judge it as bad.

  You mentioned suspecting this headline is too clean—that the effect might be fragile, dependent on wording, or conflating "aiming" with "knowing." You are right to be suspicious. While the effect is psychologically real, the standard philosophical interpretation is wrong.

  After weighing the robustness of the data against the linguistic nuances, I've reached a verdict: **The Knobe Effect is not evidence that our *concept* of intention is normative. It is evidence that the *word* "intentionally" is a pragmatic tool for assigning accountability.** The "artifact" crowd is closer to the truth, but not because the effect is fake. It's because they correctly identify that we are measuring linguistic habits, not cognitive architecture.

  ### The Case for the "Normative Concept"

  To understand why the standard view is seductive, you have to appreciate the alternative. Traditionally, philosophers argued that intentionality was a purely descriptive mental state. To act intentionally, you need a specific belief (I know X will happen) and a specific desire (I want X to happen). This is the "Simple View."

  When Knobe published his findings in 2003, he shattered the Simple View. Since the chairman's belief and desire were identical in both the Harm and Help cases, the only variable that changed was the moral valence of the outcome. If the output (intentionality judgment) changes when the only input is morality, then morality must be part of the machinery.

  Proponents argue this makes evolutionary sense. We don't attribute mental states in a vacuum; we do it to navigate social hierarchies. If the brain's job is to figure out who to praise and who to punish, it makes sense that the "intention" detector is wired directly into the "blame" detector. On this view, the asymmetry is a robust feature of human cognition. We literally cannot see the mind clearly; we see it through a moral filter.

  ### The Case for the "Linguistic Artifact"

  The counter-argument, however, has gained significant traction over the last decade, and it hinges on the ambiguity of the word "intentionally."

  In ordinary language, "intentionally" does double duty. Sometimes it means "purposefully" (the outcome was the goal). Sometimes it means "voluntarily" or "with foresight" (the outcome was known and accepted).

  Critics like Alfred Mele and Jason Shepard have shown that the Knobe Effect is highly sensitive to how the question is framed. If you ask participants, "Did the chairman *know* the environment would be harmed?" the asymmetry largely disappears. People agree he knew in both cases. The asymmetry only spikes when you use the specific label "intentionally."

  This suggests the effect isn't happening at the level of mental state attribution (what the chairman was thinking), but at the level of label application (what word we use to describe it).

  Furthermore, pragmatic theories (drawing on Paul Grice) suggest that when we ask, "Did he do it intentionally?" in a context of harm, we are often implicitly asking, "Is he to blame?" Language is cooperative. If I ask you if a crime was intentional, I'm not asking for a phenomenological report on the criminal's neural firing; I'm asking if he's a candidate for punishment. In the Help case, "intentionally" often implies "deserves credit." Since the chairman explicitly said he didn't care about helping, he doesn't deserve credit, so we deny the label.

  On this view, the concept of intention remains descriptive (aim + foresight), but the *usage* of the word is governed by social norms of accountability.

  ### The Verdict: It's Pragmatics, Not Metaphysics

  So, where does the truth lie?

  I argue that the **Artifact/Pragmatic explanation is the winner.** The Knobe Effect does not prove that our *concept* of intention is normatively loaded. It proves that our *attribution* of intention is sensitive to normative contexts because intention is the gateway to responsibility.

  Here is why the "Normative Concept" view fails: If the concept of intention itself were truly normative, the effect should be immune to linguistic tweaking. It should be a hard cognitive constraint. But it isn't. Studies show that if you explicitly distinguish between "doing it on purpose" and "doing it knowingly," the asymmetry shrinks or vanishes. If you ask, "Did he harm the environment intentionally, or was it just a side effect he accepted?" people are much more willing to admit it wasn't intentional in the strict sense.

  This fragility indicates that the underlying cognitive representation of the chairman's mind is actually quite stable (he knew, he didn't care). What changes is the *threshold* for applying the label "intentional."

  Think of it like the word "rich." If I say, "He's rich," the threshold for that label depends on context. In a room of students, someone with $50,000 is rich. In a room of billionaires, they are not. The *concept* of wealth (amount of money) hasn't changed; the *application* of the label has shifted based on the normative context of the comparison group.

  Similarly, "intentional" is a threshold concept. We have a baseline requirement (foresight + control). But to cross the threshold and earn the label, we often require an additional "moral nudge." In the Harm case, the bad outcome lowers the threshold—we are eager to blame, so we accept "foresight" as sufficient for "intention." In the Help case, the neutral/negative attitude raises the threshold—we are unwilling to praise, so "foresight" isn't enough; we demand "purpose."

  ### Why This Matters

  You asked whether this tells us about the concept of intention or just how people use the word. My verdict is that it tells us about **how we use the word to manage social life.**

  This might sound like a semantic quibble, but it saves the descriptive concept of intention from being swallowed by morality. If Knobe's original interpretation were true, it would imply that objective mental states are inaccessible to us without first making a moral judgment. That is a dark, relativistic hole for philosophy to crawl into.

  By accepting the Pragmatic/Artifact view, we can acknowledge the data without abandoning the distinction between *what happened in the mind* and *how we judge the agent.* The Chairman's mind was the same in both scenarios. Our reaction to him was not.

  The Knobe Effect is real, but it is not a window into the metaphysics of intention. It is a mirror reflecting our litigious nature. We don't use the word "intentionally" to describe the world; we use it to allocate blame. The effect persists not because we can't tell the difference between aiming and knowing, but because in the court of public opinion, that difference only matters when someone is on trial.

  For your newsletter, the takeaway is this: The Knobe Effect is the most famous discovery in experimental philosophy, but its greatest lesson isn't about intention. It's about how easily our descriptive language is hijacked by our moral instincts. The chairman didn't change. The concept of intention didn't break. We just heard the word "intentionally" and reached for the gavel.
