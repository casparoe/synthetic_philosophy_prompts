answer: |-
  Good morning. Look around this room. We have molecular biologists who build the systems, philosophers who interrogate their nature, and lawyers who must write the rules that contain them. We do not share a vocabulary. But we share a problem.

  Usually, when we gather to discuss synthetic biology, we are warned against the cliché that "life is hard to define." I will not offer you that warning. Instead, I want to point to a specific fracture that has already opened in the lab.

  We can now engineer protocells and synthetic tissue constructs that maintain continuous, far-from-equilibrium dynamics. In plain language: they consume energy, they exchange metabolites, they repair their own boundaries, and they resist entropy. They behave like living cells. Yet, they lack hereditary mechanisms. They cannot reproduce with variation. They have no open-ended evolutionary potential.

  For the last century, our scientific and legal frameworks have tacitly assumed that metabolic autopoiesis and evolutionary capacity travel together. If it metabolizes, it evolves. If it evolves, it is alive. Our regulations regarding biosafety, environmental release, and moral status rely on this coextension. But synthetic biology has decoupled them. We now have entities that are metabolically alive but evolutionarily dead.

  This fracture is why this workshop exists. We cannot regulate what we cannot categorize. So, I want to take a stance on how we should resolve this split.

  I argue that for the purposes of governance and regulatory protection, **evolutionary potential must be the governing criterion**, not metabolic activity.

  Here is the reasoning. Governance is fundamentally about managing the future. It is about risk, liability, and containment. A system that metabolizes but cannot evolve is, ultimately, predictable. It may be complex, it may be fragile, but it is bounded by its initial design. If it escapes the lab, it dies out. It cannot adapt to new niches. It poses a hazard, perhaps, but not an ecological risk.

  A system that possesses evolutionary capacity, however, introduces genuine uncertainty. It can change its own rules. It can overcome containment. It can generate novelty that the designer did not intend and the regulator did not foresee. Therefore, the threshold for "life" in a legal and safety context must be the capacity to evolve.

  This means we must accept a difficult conclusion: some metabolically active synthetic systems will fall outside the category of "life." They will be classified as complex chemical machines.

  I want to be clear about the cost of this choice. By drawing the line at evolution, we risk instrumentalizing systems that exhibit the phenomena of life. We may treat a self-repairing synthetic tissue as mere property, denying it the protections we afford to organisms, simply because it lacks a genome capable of mutation. There is a moral intuition that says if something breathes and bleeds, it deserves respect. My argument overrides that intuition with a pragmatic necessity: we must regulate based on the capacity for unforeseen change.

  I also want to flag where this argument stands on contested ground. I recognize that this privileges a Darwinian threshold over a strictly autopoietic one. Many philosophers of biology argue that self-maintenance alone is sufficient for biological status. I am not claiming that metabolic autopoiesis is irrelevant. I am claiming that for *governance*, evolution is the critical variable. This is a specific reading of what matters in biology, and it is not the only one. But it is the one required for safety.

  If we choose the metabolic criterion instead, we grant regulatory protection to systems that cannot escape our control, while potentially failing to capture the unique risk of those that can. We would be fighting the last war.

  So, over the next two days, I ask you to work from this premise. When you draft guidelines or analyze case studies, treat evolutionary potential as the bright line. Accept that this leaves a category of "living machines" in a regulatory limbo. Our task is not to wish this fracture away, but to build frameworks sturdy enough to hold it.

  We are not here to define life for the sake of definition. We are here to ensure that when we build systems that mimic life, we understand exactly where the risk begins.

  Thank you. Let's get to work.
