answer: |-
  # Activity Design: The Diachronic Trap

  ## Materials & Handout Text
  **Materials:** 16 envelopes, each containing 5 red poker chips and one Handout. A whiteboard for tracking market status. A bowl for the prize draw (tickets = remaining chips).

  **Handout Text:**
  > **Private Valuation Sheet**
  >
  > You hold **Option A**. You have **5 Chips**.
  >
  > **The Options:**
  > *   **Option A:** Salary $60k | Location: City | Impact: Medium
  > *   **Option B:** Salary $50k | Location: Suburb | Impact: High
  > *   **Option C:** Salary $70k | Location: Rural | Impact: Low
  >
  > **Evaluation Rule:** Compare two options dimension by dimension. Prefer the option that wins on at least 2 of the 3 dimensions.
  >
  > **Record Your Values:**
  > 1.  Compare A vs. B. Which wins? ____
  >     If you prefer the winner, what is the *maximum* number of chips you would pay to switch to it? ____
  > 2.  Compare your current holding vs. the third option. Which wins? ____
  >     Maximum chips to switch? ____
  > 3.  Compare the remaining pair. Which wins? ____
  >     Maximum chips to switch? ____
  >
  > *Keep this sheet hidden. Do not discuss.*

  ## Timeline (80 Minutes)

  **00–05: Setup**
  Distribute envelopes. Instruct students to count chips (5) and read the Handout silently. State only: "Chips determine prize draw odds. Your goal is to end with the option and chip count you find most satisfactory."

  **05–20: Valuation**
  Students apply the Evaluation Rule privately. They will find A beats B (Salary, Impact), B beats C (Location, Impact), C beats A (Salary, Location). They record WTP for each swap. Collect no papers yet.

  **20–35: Phase A (Fixed Horizon)**
  Announce: "The market opens for exactly 3 rounds. Each round, you may exchange your current option for any other available option for 1 chip. I will announce the end after round 3."
  Open the floor. Allow swaps. Most will swap A→B (Round 1), B→C (Round 2), C→A (Round 3).
  Close market. Count chips.

  **35–50: Phase B (Open Horizon)**
  Reset holdings to Option A, 5 Chips.
  Announce: "The market is now open indefinitely. You may swap whenever you wish for 1 chip. I will not announce when it closes. It may close in one minute or twenty."
  Observe behavior. Some will swap repeatedly; some will stop. Close arbitrarily after 10 minutes.

  **50–65: Role Reversal**
  Collect Handouts. Redistribute them randomly (half the class gets another's sheet).
  Task: "You are the Market Maker. You hold the chips. Look at the recorded WTP values. Propose swaps to extract the maximum chips from this preference structure."
  Students discover that if WTP > 1 for all steps, they can extract chips until the victim returns to start, but only if the victim doesn't stop.

  **65–80: Debrief**
  (See below).

  ## Debrief Guide

  **1. Phase A Verification (The Single Purchase)**
  Ask: "Who swapped all three times?" (Show of hands). "You ended with Option A, minus 3 chips."
  Ask: "Who swapped once?" "You ended with Option B, minus 1 chip."
  Point to the Handout: "You recorded a WTP for A→B. If that number was 2 or more, swapping once was a net gain. Refusing all swaps left you with A (0 cost). Swapping once gave you B (1 cost). Since you valued B over A by more than 1 chip, swapping once was rational. You were not pumped; you made a purchase. The loss only occurred because you continued to swap back to A."

  **2. Phase B Verification (The Policy Cycle)**
  Write the policies on the board:
  *   **P0:** Stop immediately (End: A, Cost 0)
  *   **P1:** Swap once, stop (End: B, Cost 1)
  *   **P2:** Swap twice, stop (End: C, Cost 2)
  *   **P3:** Swap thrice, stop (End: A, Cost 3)
  Ask: "Which is best?"
  Map their preferences:
  *   P1 > P0 (Because B > A and cost diff is 1, WTP > 1).
  *   P2 > P1 (Because C > B and cost diff is 1, WTP > 1).
  *   P3 > P2 (Because A > C and cost diff is 1, WTP > 1).
  *   P0 > P3 (Because A = A, but Cost 0 < Cost 3).
  Conclusion: "Your preferences over *policies* cycle. There is no maximal policy. The 'greedy' policy (keep swapping) leads to P3 (or worse), which is beaten by P0. But P0 is beaten by P1."

  **3. The Moral**
  "In Phase A, you could plan. In Phase B, you couldn't reason backward from an end. The problem isn't that you were shortsighted. The problem is that your preferences single out no best plan. If rationality requires having a best plan, synchronic preference satisfaction is not enough."

  ## Failure Modes & Fixes

  1.  **Transitive Preferences:** Some students may ignore the "2 of 3" rule and prioritize one dimension (e.g., Salary).
      *   *Fix:* During Valuation, walk around. If a student writes A>B, B>C, A>C, quietly ask: "Did you check the Location dimension?" Reinforce the rule without imposing preference.
  2.  **Chip Indifference:** Students treat chips as worthless.
      *   *Fix:* Make the prize tangible and visible (e.g., a specific chocolate bar or book). Remind them at minute 10: "Chips = Tickets. No chips = No chance."
  3.  **Refusal to Trade:** Students keep Option A throughout.
      *   *Fix:* In Debrief, use the Role Reversal data. Show that *if* they had traded according to their own WTP, they would have gained/lost. The lesson holds even if they didn't participate, provided their WTP > 1.
  4.  **"Never Trade" Conclusion:** Students conclude rationality means never swapping.
      *   *Fix:* Highlight Phase A logic. If WTP(A→B) = 5 chips, refusing the swap is leaving value on the table. Rationality isn't paralysis; it's coherence over time.

  ## Limitations Note
  This activity stages the *impossibility* of maximizing synchronic preferences diachronically. It does not resolve *how* to fix it. It cannot distinguish between **Resolute Choice** (committing to P1 initially) and **Sophisticated Choice** (anticipating future swaps and refusing the first) without introducing formal modeling. Students will feel the tension but will need the following lecture to learn the formal definitions of planning agents versus myopic agents. Do not attempt to solve the normativity in the debrief; stop at the diagnosis of the cycle.

  ## Word Count Check
  Main text: ~1,100 words.
  Handout: ~150 words.
  Total: ~1,250 words.
