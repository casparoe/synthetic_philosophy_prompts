answer: |-
  The session turns on establishing the time-symmetry of the microdynamics *before* defining entropy, because if entropy is defined first, the asymmetry appears to be in the definition rather than the boundary.

  **Dependency Structure**
  1.  **Micro-dynamics (5 mins):** Write Newton/Schrödinger equations. Show $t \to -t$ invariance. *Claim:* The laws do not distinguish past from future.
  2.  **Macrostates & Coarse-Graining (10 mins):** Define macrostates as volumes in phase space, not "disorder." Show many microstates map to one macrostate. *Claim:* Entropy is log-volume, not messiness.
  3.  **Typicality/Probability (5 mins):** Argue that trajectories spend time in proportion to volume. *Claim:* High-volume states are more probable *at any given moment*.
  4.  **The Reversibility Objection (10 mins):** **Invite this.** Ask: "If high entropy is more probable, why wasn't the past high entropy?" Show that applying step 3 backward predicts the past was higher entropy (the "Boltzmann Brain" problem).
  5.  **The Boundary Condition (5 mins):** Introduce the Past Hypothesis (low entropy at $t=0$) as the only fix for step 4. *Claim:* The arrow is not in the laws (step 1) or the probability measure (step 3), but in this specific constraint.
  6.  **Records and Memory (5 mins):** Derive memory as a physical correlation that requires entropy increase to form. *Claim:* We remember the past because the past was low entropy, not vice versa.

  **The Central Image**
  Draw **Phase Space with Two Blobs**.
  *   **What it must have:** A small blob (Low Entropy) and a vastly larger blob (High Entropy), connected by a trajectory line. Label axes "Microstate Coordinates."
  *   **What it must lack:** Any arrow of time on the trajectory line initially. No spatial depiction of gas particles (avoids "expansion" confusion). No words like "order" or "disorder."
  *   **Reasoning:** A gas expanding into a vacuum smuggles in spatial expansion as a proxy for time and relies on intuition about mixing. The Phase Space blob isolates the *volume* argument. It forces the audience to see that the asymmetry comes from where the trajectory *starts*, not how it moves.

  **Misconception Management**
  *   **Entropy as Disorder:** Defuse at **Step 2**. Insist on "phase space volume." If someone says "disorder," write "Volume" next to it and refuse to use the word again.
  *   **2nd Law as Dynamical:** Defuse at **Step 1**. Explicitly write $H(t) = H(-t)$ for the Hamiltonian.
  *   **Refrigerator Exception:** Defuse at **Step 3**. Clarify that entropy *can* decrease locally via work, but the total phase space volume of the universe (system + environment) increases.
  *   **Circularity (Arrow defined by Entropy):** Defuse at **Step 5**. Show that without the Boundary Condition, the statistical argument predicts entropy increases in *both* directions from now, making the definition useless for distinguishing past/future.
  *   **Reversal Worry (Loschmidt):** **Invite this at Step 4.** Ask them to propose flipping velocities. Use their proposal to demonstrate that the dynamics allow it, but the *boundary* forbids it. This is the core insight moment.

  **The Janus Point (Two-Headed Arrow)**
  **Exclude it.** In forty minutes, it introduces a second variable (the location of the minimum) that distracts from the core claim (boundary conditions determine the arrow). It risks collapsing the thermodynamic and psychological arrows before you've distinguished them. Stick to our single boundary to prove the point; the Janus point is a corollary they can read later. If you include it, you must spend 10 minutes explaining why observers on both sides see the same arrow, which eats the time needed for the Record Arrow derivation.

  **Explicit Declinations**
  State clearly at the start: "I am not explaining Quantum Measurement (Collapse vs. Decoherence) or Cosmological Expansion (FRW metric)."
  *   **Why:** Both are candidate *sources* of the Past Hypothesis, not explanations of the thermodynamic arrow itself. Conflating the *origin* of the boundary condition with the *function* of the boundary condition muddies the logical dependency.

  **Closing Question**
  "If I handed you a complete snapshot of the universe at this instant—including your own brain state—but did not tell you the Past Hypothesis was true, could you use physics to determine which direction is the past?"
  *   **Correct Answer:** "No. Without the boundary condition, the statistics suggest the past was higher entropy, so you couldn't distinguish past from future."
  *   **Wrong Answer:** "Yes, because entropy increases toward the future." (This shows they missed the boundary condition point).
