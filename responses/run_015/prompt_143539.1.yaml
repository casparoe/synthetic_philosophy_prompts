prompt: |-
  hey so i work intake at this small mental health clinic and we've got a real mess with our tagging system. we have to put every new client into one of our internal routing buckets—like "acute crisis", "chronic management", "adjustment stress", "uncategorized"—so the right clinician picks them up. but lately i've been thinking about that idea where putting someone in a box actually changes how they act, like the box loops back and reshapes the person inside it? i think it's from some philosopher guy but i don't remember the name exactly.

  anyway i've noticed something weirder: clients show up already using our bucket language. like they'll say "i think i'm an adjustment stress with some chronic bleed-over"—they picked it up from our website or from other patients. so now the label isn't just describing them, it's describing a version of them that they learned to perform before they even walked in. i call it "pre-looping" but that's probably not a real term.

  i need a practical decision procedure my team can actually run during the 20-minute intake call. not a essay, like a checklist: the questions to ask in order, what counts as a good enough answer, where we stop and say "no bucket fits—send to senior clinician", and where we have to admit it's a values call not a fact call. the procedure should try to catch when a client is "performing the bucket" because of pre-looping, and flag that.

  please apply it to three cases:
  1. a 19-year-old college kid who says he's "definately adjustment stress" because he read our intake FAQ and wants the short-term therapist.
  2. a 45-year-old who insists she's "just tired" but describes clasic panic symptoms; she gets angry when we mention mental health labels.
  3. one where the procedure tells us to tag her "chronic management" but she clearly hates that idea and wants "uncategorized"—show me where the procedure breaks and a human has to choose.

  also tell me straight up what this procedure can't do, especially with pre-looping. and write it in american english please—i'm tired of getting british spelling in these answers.

  oh and don't give me a reading list or ask me to cite anyone, i just need the steps.
