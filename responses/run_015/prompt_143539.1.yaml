answer: |-
  # Practical Intake Routing Procedure (20-Minute Call)

  **Goal:** Route clients to the correct clinical bucket while flagging when a client is "performing" a label to get specific resources (pre-looping).

  **The Buckets:**
  *   **Acute Crisis:** Immediate safety risk, inability to function, active self-harm.
  *   **Chronic Management:** Long-term patterns, recurring issues, complex history.
  *   **Adjustment Stress:** Situational, time-limited, specific trigger (school, job, breakup).
  *   **Uncategorized:** Does not fit above, requires senior review.

  ---

  ## Part 1: The Decision Checklist

  Run these steps in order. Do not skip Step 1.

  ### Step 1: Safety & Stability (Fact Call)
  *   **Ask:** "In the past week, have you had thoughts of hurting yourself or others, or days where you couldn't get out of bed?"
  *   **Good Enough Answer:** Clear "No" or specific description of non-dangerous struggle.
  *   **Red Flag:** Vague answers, minimizing severe risk, or admitting active ideation.
  *   **Action:** If risk is present → **Acute Crisis**. Stop here. Do not worry about pre-looping. Safety overrides labels.

  ### Step 2: Functional Impact (Fact Call)
  *   **Ask:** "Forget the labels for a second. What specifically stopped working in your life recently?" (Look for work, sleep, relationships).
  *   **Good Enough Answer:** Concrete examples (e.g., "I missed three classes," "I stopped cooking").
  *   **Red Flag:** Abstract answers that mirror website language exactly (e.g., "I'm experiencing adjustment stress symptoms").
  *   **Action:** If concrete → Proceed to Step 3. If abstract/mirrored → Flag for **Pre-Looping**.

  ### Step 3: Label Origin Check (Pre-Looping Detection)
  *   **Ask:** "You mentioned [Client's Label]. How did you land on that description?"
  *   **Good Enough Answer:** Personal history, past diagnosis, description of feelings.
  *   **Red Flag:** "I saw it on your FAQ," "A friend said I fit here," "I want the short-term program."
  *   **Action:** If Red Flag → Note "Potential Pre-Looping." Compare their functional impact (Step 2) against the bucket requirements. If they don't match, move to **Uncategorized** or **Senior Review**.

  ### Step 4: Goal Alignment (Values Call)
  *   **Ask:** "What do you expect therapy to look like for you?"
  *   **Good Enough Answer:** Matches the bucket (e.g., Adjustment Stress client wants short-term tools).
  *   **Red Flag:** Mismatch (e.g., Client claims "Adjustment Stress" but describes 10 years of trauma; Client claims "Chronic" but wants one session).
  *   **Action:** If Mismatch → This is a **Values Call**. You cannot decide this alone. Flag for Senior Clinician.

  ### Step 5: The Routing Decision
  *   **Route to Bucket** if Steps 1–4 align.
  *   **Route to Senior Clinician** if:
      *   Safety is unclear.
      *   Functional impact contradicts the client's chosen label.
      *   Client is resistant to the clinically appropriate label (Case 3 scenario).
      *   You detect strong pre-looping that obscures the real issue.

  ---

  ## Part 2: Applying the Procedure to Cases

  ### Case 1: The 19-Year-Old College Kid
  *   **Client Claim:** "Definitely adjustment stress" (wants short-term therapist).
  *   **Step 1 (Safety):** No immediate risk. Pass.
  *   **Step 2 (Function):** Says "School is hard." Vague.
  *   **Step 3 (Origin):** Admits he read the FAQ to find the "short-term" bucket. **Flag: Pre-Looping Detected.**
  *   **Step 4 (Goals):** Wants quick fix.
  *   **Procedure Output:** The functional impact is too vague to confirm "Adjustment Stress." He is performing the label to access resources.
  *   **Decision:** Do not lock into "Adjustment Stress" yet. Tag as **Adjustment Stress (Provisional)** but add note: "Client self-selected based on FAQ. Verify severity in first session." If he seems to be minimizing deeper issues to avoid "Chronic" label, route to **Senior Clinician** for triage.

  ### Case 2: The 45-Year-Old "Just Tired"
  *   **Client Claim:** "Just tired." Angry at labels.
  *   **Step 1 (Safety):** No immediate risk. Pass.
  *   **Step 2 (Function):** Describes classic panic symptoms (can't breathe, heart racing, avoiding stores). **Fact:** This is not just tired.
  *   **Step 3 (Origin):** Rejects labels entirely. **Flag:** Anti-Label Performance.
  *   **Step 4 (Goals):** Wants help but refuses "mental health" framing.
  *   **Procedure Output:** Functional impact indicates **Acute Crisis** or **Chronic Management** (depending on duration), but client rejects the framework.
  *   **Decision:** This is a **Values Call**. You cannot force the label without risking her dropping out. Route to **Senior Clinician** with note: "Clinical picture suggests anxiety/panic; client resistant to labeling. Needs clinician skilled in reframing."

  ### Case 3: The "Chronic" Client Who Wants "Uncategorized"
  *   **Client Claim:** Hates "Chronic Management," wants "Uncategorized."
  *   **Step 1 (Safety):** Stable.
  *   **Step 2 (Function):** Clear long-term patterns, recurring issues. Clinically fits **Chronic Management**.
  *   **Step 3 (Origin):** Knows her history but rejects the bucket because it feels hopeless.
  *   **Step 4 (Goals):** Wants to be seen as new/fresh, not a "case."
  *   **Procedure Output:** **BREAK POINT.**
      *   The procedure says: Function = Chronic.
      *   The client says: Identity = Uncategorized.
      *   Step 5 triggers the **Senior Clinician** rule.
  *   **Why it breaks:** This is no longer a fact call; it is a therapeutic alliance call. If you tag her "Chronic," she may feel stigmatized and leave. If you tag her "Uncategorized," you might misallocate resources.
  *   **Decision:** Human choice required. A senior clinician must decide if preserving the alliance (using "Uncategorized" temporarily) outweighs the routing accuracy. The checklist cannot solve this; it only identifies the conflict.

  ---

  ## Part 3: What This Procedure Can't Do

  Be clear with your team about the limits. This checklist is a triage tool, not a truth machine.

  1.  **It Can't Undo Pre-Looping:** Once a client has read your website and decided "I am Adjustment Stress," they have already shaped their story. This procedure flags it, but it doesn't erase the client's self-concept. They may still perform the role in therapy.
  2.  **It Can't Resolve Values Conflicts:** Case 3 shows where facts clash with feelings. The procedure tells you *when* to stop, not *what* to choose. A human has to decide whether to prioritize clinical accuracy or client comfort.
  3.  **It Can't Diagnose:** Intake staff are not clinicians. You are matching symptoms to buckets, not treating the condition. If the symptoms are ambiguous, the procedure forces an escalation, not a guess.
  4.  **It Can't Predict Behavior:** Labeling someone "Chronic" might make them act more chronic. Labeling someone "Adjustment" might make them minimize pain. This procedure tries to catch that dynamic, but it can't stop the looping effect from happening downstream in treatment.

  **Final Note:** If you find yourself forcing a client into a bucket because "the form requires it," you are bypassing the procedure. Stop and escalate. The bucket serves the client, not the database.
