  **Speech Draft**

  Good evening, everyone. For those who don't know me, I'm one of the regulars from Ray's lunchtime reading group. I've been attending for five years, I understand about two-thirds of what goes on, and I've never studied philosophy in my life. So, I'm qualified to speak today in exactly the same way Ray qualifies us all to run platform teams: I showed up, I listened, and I tried not to break anything.

  Now, giving a leaving speech for Ray presents a unique scientific problem. For thirty-one years, Ray has argued that you cannot explain how this place works by looking at individuals. He says praising a single person is like judging a species by looking at one beetle. He believes real success happens at the group level. Specifically, he measures a team's fitness not by average output, but by how many new teams it spawns.

  This puts me in a bind. Because normally, at a do like this, I'm supposed to stand up and say, "Ray, you're a legend, none of this would have happened without you, your legacy lives on in us."

  But if I say that, Ray will spend the entire taxi ride home composing a letter to the editor about how I've misunderstood multi-level selection theory. He refuses to do individual performance ratings based on this principle. He fought for years to keep the focus on the system, not the person.

  However, there is one piece of data I think we can all agree on. For years, Ray's team looked mediocre on the standard company metrics. The average output was fine, nothing spectacular. But, four people from that team went on to start teams of their own.

  So, by the company's metrics, Ray was average. But by Ray's metrics? His team was the fittest species this company ever produced.

  For the family and friends here who don't know the theory: what that means is that while Ray was busy building platforms, he was actually building people. He created an environment where others could grow strong enough to leave him behind. And I think we can all agree, that is a much better measure of a career than a spreadsheet.

  Ray, you were stubborn. You never budged on the big ideas, even when we argued about them for an entire lunch break. You protected your team from the pressure of individual ratings so they could focus on the work. And you taught us that the best way to survive is to make sure the group around you is fit enough to survive without you.

  We are going to miss you. Not just because you're leaving, but because the selection pressure is finally off. You don't have to adapt anymore. You can just evolve into whatever you want to be next.

  To Ray.

  ***

  **Notes on the Joke and Delivery**

  **Where the joke sits:**
  It lands in the middle, acting as the pivot between the "scientific problem" of the speech and the personal tribute. It resolves the tension of "how do I praise an individual who hates individual praise?" by using his own metric to praise him.

  **How it reads to the two halves of the room:**
  *   **The Engineers/Reading Group:** They will catch the specific reference to "average output" vs. "spawn rate" immediately. They will appreciate that you haven't diluted his theory, but you've used it to compliment him rather than debunk him. It signals you were listening, even if you only understood two-thirds.
  *   **The Family/Outsiders:** They won't get the specific biology jargon, but the translation is clear: "The official numbers said he was okay, but the real proof is that his students went on to become leaders." It reads as a heartwarming testament to his mentorship. They hear "mediocre metrics" but understand "great mentor."

  **Sentences flagged for Ray's "False Claim" Radar:**
  Ray is pedantic about causal claims regarding individuals. He might gently object to the following lines because they attribute agency to him as an individual rather than the system:

  1.  *"He created an environment where others could grow..."*
      *   **Risk:** Implies individual causality. He might argue the environment selected for itself.
      *   **Fix:** If you think he'll nitpick, change to: "He built a structure where others could grow..." (Structure implies system over person).
  2.  *"You protected your team from the pressure..."*
      *   **Risk:** "You protected" is very individual-hero focused.
      *   **Fix:** Change to: "You stood between your team and the pressure..." (Still individual, but slightly more descriptive of action than attribute). Or, "The team was shielded from pressure..." (Passive voice removes the hero).
  3.  *"We are going to miss you."*
      *   **Risk:** Minimal, but technically implies the group's emotion is caused by the individual's absence.
      *   **Fix:** Probably safe to leave. It's a social convention. But if you want to be safe: "There's going to be a gap where you used to be."

  **Delivery Tip:**
  When delivering the line *"But by Ray's metrics? His team was the fittest species this company ever produced,"* pause slightly before "fittest species." Look directly at Ray when you say it. It signals that this is the verdict that matters, not the company's. Keep the tone warm, not triumphant—you're handing him the win on his own terms.
