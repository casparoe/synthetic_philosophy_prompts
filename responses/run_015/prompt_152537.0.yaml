  # Seminar Handout: Where Does "Homemade" Stop?
  **Topic:** Conceptual Slippage in a Microdomain  
  **Course:** Philosophy of Language 200-Level  

  ### Instructions
  This instrument is not a test of correct answers. It is a map of your commitments. There are no right or wrong responses, only consistent or inconsistent ones. Read each scenario carefully. Choose the option that best matches your intuition about how the word *works*, not just how you feel about the food.

  ---

  ### The Quiz

  **1. The Ladder**
  Consider this sequence of meals prepared in a home kitchen:
  1.  Made from scratch with raw ingredients.
  2.  Box mix with fresh eggs added.
  3.  Meal-kit dinner (pre-portioned ingredients) cooked.
  4.  Store-bought dough baked.
  5.  Takeout components assembled at home.

  If you had to be strictly accurate, which is the **first** item in this list that you would refuse to call "homemade"?
  *   A) I would refuse #2 (Box mix).
  *   B) I would refuse #3 (Meal-kit).
  *   C) I would refuse #4 (Store dough).
  *   D) I would refuse #5 (Takeout assemble).
  *   E) I would not refuse any of these; they all count.
  *   F) I would refuse all of them except #1 (Scratch).

  **2. The Step**
  Look at the item you selected in Question 1. Imagine the item immediately *before* it on the list (the one you said still counts).
  Is it possible for someone to draw the line there (accepting the earlier item but rejecting the later one) without making a mistake, or does accepting the earlier item *force* you to accept the later one too?
  *   A) They can draw the line without mistake.
  *   B) Accepting the earlier item forces them to accept the later one.
  *   C) It depends on who is asking.

  **3. The Spirit**
  Compare two scenarios:
  *   **Scenario X:** A frozen meal heated up, but served with great care and love.
  *   **Scenario Y:** A meal made from scratch, but rushed, careless, and disliked by the cook.
  Which is closer to the *spirit* of the word "homemade"?
  *   A) Scenario X (Care matters most).
  *   B) Scenario Y (Process matters most).
  *   C) Neither counts as homemade.

  **4. The Menu**
  When a restaurant puts "homemade" on a menu, are they using the word in the same way a parent uses it when talking to a child about dinner?
  *   A) Yes, it means the same thing; one might just be lying.
  *   B) No, the restaurant is using a different standard appropriate for business.
  *   C) Yes, but the meaning has changed for everyone over time.

  **5. The Machine**
  You choose the ingredients and put them in a machine. The machine mixes, kneads, and bakes the bread. You did not touch the dough. Is the machine more like a **spoon** (a tool you use) or a **hired cook** (an agent working for you)?
  *   A) Like a spoon (It counts as homemade).
  *   B) Like a hired cook (It does not count as homemade).
  *   C) It depends on how much you chose the ingredients.

  **6. The Goal**
  Suppose calling a meal-kit dinner "homemade" encourages people to cook more often and feel better about their meals. Should we allow the word to stretch to cover it, even if it didn't used to?
  *   A) Yes, use what works to help people.
  *   B) No, accuracy matters more than feelings.
  *   C) It is not up to us to decide; the word decides for us.

  **7. The Crowd**
  If most cooks start calling meal-kits "homemade" in everyday conversation, does that make it true, or does it just mean people are getting sloppy with language?
  *   A) It makes it true (Usage sets the rule).
  *   B) It means people are getting sloppy (There is a fixed rule).
  *   C) It depends on whether the cooks know what they are doing.

  **8. The Assembly**
  Think about the "Takeout components assembled at home" case from Question 1. Is this case closer to **Store-bought dough baked** (which you likely accepted) or **Frozen dinner heated up** (which you likely rejected)?
  *   A) Closer to Store-bought dough (It's a gradient).
  *   B) Closer to Frozen dinner (It's a different category).
  *   C) It is its own distinct thing.

  **9. The Argument**
  Two people argue over whether a casserole made with canned soup is homemade. Is there a **fact** they are trying to discover, or a **rule** they need to agree on?
  *   A) A fact (One of them is right about the world).
  *   B) A rule (They need to decide how to use the word).
  *   C) Both (The fact informs the rule).

  ---

  ### Scoring Key & Interpretation Guide

  *Note: Do not tally points. Look for patterns in your responses. Your profile is determined by how you handle the sequence of cases and the source of authority you prioritize.*

  #### Profile 1: The Fixed Boundary (Hidden Nature)
  *   **Pattern:** Q1 (A or F), Q2 (A), Q3 (B), Q4 (A), Q9 (A).
  *   **Commitment:** You treat the word as tracking a specific fact about the world (usually the process of creation). You believe there is a line where the word stops applying, and crossing it is a mistake. Disputes are about discovering where that line sits.
  *   **Slippage View:** Slippage is an error. The word has a stable core that cases must match.

  #### Profile 2: The Value Transfer (Copycat/Valence)
  *   **Pattern:** Q3 (A), Q5 (C), Q1 (Varies).
  *   **Commitment:** You prioritize the *feel* or *value* associated with the word (care, authenticity, prestige) over the physical process. You apply the word to new cases because they capture the spirit of the original, not because they share the same ingredients.
  *   **Slippage View:** Slippage happens when the value survives but the process changes. The word travels by association.

  #### Profile 3: The Living Usage (Fluid Concept)
  *   **Pattern:** Q1 (E), Q2 (B), Q7 (A), Q9 (B).
  *   **Commitment:** You see the word as held together by active analogy rather than a stored definition. There is no fixed boundary; the word stretches to cover new cases as long as the comparison holds.
  *   **Slippage View:** Slippage is how the word works, not a defect. Tolerance is built into the system.

  #### Profile 4: The Context Switch (Meaning-Shift)
  *   **Pattern:** Q4 (B), Q2 (C), Q1 (Varies).
  *   **Commitment:** You believe the word changes its job depending on where it is used (e.g., menu vs. home). Disputes often happen because people are using different versions of the word without realizing it.
  *   **Slippage View:** The word doesn't slip; it shifts. Different contexts have different rules.

  #### Profile 5: The Community Standard (Practitioners'-Call)
  *   **Pattern:** Q7 (A), Q9 (B), Q1 (Matches majority usage).
  *   **Commitment:** You believe the people who use the word decide what it means. If the community accepts a case, it is valid. Authority lies with the speakers, not the objects.
  *   **Slippage View:** Slippage is legitimate if the community accepts it.

  #### Profile 6: The Engineering Fix (Utility)
  *   **Pattern:** Q6 (A), Q9 (B), Q4 (B or C).
  *   **Commitment:** You believe we should shape the meaning of the word based on what achieves the best outcome (e.g., encouraging cooking). Truth is secondary to utility.
  *   **Slippage View:** Slippage is a tool we can use intentionally to improve practices.

  #### Profile 7: The Similarity Cluster (Cluster/Similarity)
  *   **Pattern:** Q8 (A), Q1 (C or D), Q2 (A).
  *   **Commitment:** You judge cases by how many features they share with the paradigm (scratch cooking). There is no single essential feature, but some cases are clearly closer than others.
  *   **Slippage View:** Slippage occurs as overlapping features fade out. Boundaries are fuzzy but real.

  ---

  ### Instrument Limitations & Logical Space

  *For Instructor Use: The following notes identify areas where this instrument cannot distinguish between accounts, and combinations of answers that are logically untenable.*

  **1. Indistinguishable Leaves**
  *   **Fluid Concept vs. Practitioners'-Call:** Questions 7 and 9 often yield identical answer patterns for these two accounts. Both rely on community usage to validate meaning. This instrument treats them as a cluster; separating them requires asking whether the community *creates* the meaning (Practitioners) or whether the meaning *evolves* naturally through use (Fluid).
  *   **Meaning-Shift vs. Engineering:** Question 4 and 6 can overlap. A student may argue context changes meaning (Meaning-Shift) because it is useful to do so (Engineering). Distinguishing them requires probing whether the shift is descriptive (how people *do* talk) or prescriptive (how people *should* talk).

  **2. Unoccupied Answer Combinations**
  *   **Combination A (Incoherent):** Q1/Q9 (Fixed Boundary/Fact) **AND** Q7 (Usage Makes It True).
      *   *Reasoning:* You cannot claim there is a single factual boundary independent of us while simultaneously claiming that community usage overrides that fact. This creates a contradiction between objective truth and social authority.
  *   **Combination B (Unattractive/Unexplored):** Q6 (Engineering/Utility) **AND** Q4 (Context Never Changes Meaning).
      *   *Reasoning:* It is rare to argue that we should fix meanings for utility while insisting that context never alters the standard. Usually, utility-driven approaches accept that different contexts require different definitions to maximize benefit.

  **3. Stepwise Logic**
  *   Questions 1, 2, and 8 form the tolerance chain.
      *   **Q1** establishes the boundary.
      *   **Q2** tests the pressure between steps (Sorites sensitivity).
      *   **Q8** tests the gradient at the edge.
      *   *Note:* Students who answer Q1 (E) "None stop counting" but Q2 (A) "Can draw a line" are displaying instability in their tolerance pressure. This usually indicates a transition between Fixed Boundary and Fluid Concept profiles.
