answer: |-
  # Q&A Prep Sheet: Gregorian Split Defense

  ### Up-Front Concessions
  *Do not wait for these to be dragged out of you. State them in your closing remarks or when fielding the first soft question to inoculate against defensiveness.*
  1.  **Continuity exists:** Acknowledge that evolution never draws hard lines. Your split is a *functional* distinction in cognitive architecture, not a speciation event.
  2.  **Dennett didn't say this:** Admit you are amending Dennett's heuristic, not exegeting his text. You are fixing a gap in the hierarchy, not quoting him.
  3.  **The boundary is fuzzy:** Concede that some complex tool-use (e.g., abacus, maps) sits on the fault line. You are defining paradigm cases, not sorting every edge case.

  ---

  ### The Killer Question (Pray They Skip)
  **"Doesn't this split collapse back into Popperian once you allow counterfactual artifacts?"**
  *   **The Trap:** If a crow bends a wire to hook a bucket, it's testing a counterfactual ("If I bend this, it reaches") using an external object. That sounds like Popperian internal simulation externalized. If so, you don't have two types of Gregorians; you just have Popperians with tools.
  *   **The Reply:** "That's the crucial hinge. In Popperian selection, the variation and selection happen *inside* the head before action. In Artifact-Gregorianism, the environment *is* the selector. The crow doesn't simulate the wire bending internally; it bends the wire to let physics decide. But for Symbolic-Gregorians, the 'environment' is the syntactic/semantic space itself. We can run error-checks on a sentence ('If P then Q') without physical instantiation. The architecture differs because the 'error' in artifact use is physical failure (the hook breaks), while the error in symbolic use is logical/semantic inconsistency, which can be minimized without physical risk. The crow still pays a physical cost for the hypothesis; the language user pays only a computational cost."
  *   **Weakness Flag:** **High.** If they press that "computational cost" is just neural physics, you're on shaky ground. You're relying on a level-of-abstraction distinction that physicalists might reject.

  ---

  ### Objection 1: The EvoPsych Continuity Challenge
  **"Why posit a architectural split when continuity explains the gradient better? Language is just fancy tool-use."**
  *   **The Reply:** "Continuity describes the *history*, not the *mechanism*. Wings are continuous with forelimbs, but aerodynamics requires a specific structural threshold. Similarly, while language evolved from tool-use capacities, predictive processing changes qualitatively when the 'tool' carries semantic weight. A stick predicts physical affordances; a word predicts inferential consequences. The error signal shifts from 'did this work?' to 'is this true?' That shift allows for offline planning at a scale tool-use doesn't permit. You can't stack sticks infinitely without gravity hitting you; you can stack clauses indefinitely."
  *   **Weakness Flag:** **Medium.** You need to be careful not to sound like you're denying the evolutionary groundwork they cherish.

  ### Objection 2: The Phil-Bio Exceptionalism Charge
  **"Aren't you just smuggling human uniqueness back in through the side door?"**
  *   **The Reply:** "Not uniqueness of *kind*, but uniqueness of *loop*. I'm not saying humans are magical; I'm saying symbolic scaffolding creates a new selection environment. Once you have language, your predictive models are selected by social consensus and logical coherence, not just physical survival. This isn't exceptionalism; it's niche construction. Just as beavers change their selection pressure with dams, humans change their cognitive selection pressure with symbols. It's a biological feedback loop, not a metaphysical escape."
  *   **Weakness Flag:** **Low.** This usually satisfies the philosophy crowd if you emphasize "niche construction" and "feedback loops."

  ### Objection 3: The Unified PP Architecture Claim
  **"Predictive Processing claims a unified architecture for all cognition. How do you justify two different error-minimization structures?"**
  *   **The Reply:** "Unified architecture doesn't mean uniform content. The free energy principle applies to both, but the *generative model* differs. For artifacts, the model maps motor output to physical state. For symbols, the model maps syntactic manipulation to semantic commitment. The math of error minimization is the same; the variables being minimized are different. One minimizes physical surprise; the other minimizes semantic surprise. That's enough to warrant a functional split in the Gregorian category."
  *   **Weakness Flag:** **High.** Hardline PP theorists might argue that "semantic surprise" reduces to "neural surprise," making your distinction illusory.

  ### Objection 4: The "Complex Tool" Boundary
  **"Where do you draw the line? Is a map an artifact or a symbol? Is an abacus?"**
  *   **The Reply:** "I'm drawing the line at *systematic recombinability*. A map is iconic; it resembles the territory. An abacus is procedural. But language allows you to combine elements to generate novel hypotheses never before instantiated in the world. If the tool requires you to learn a syntax to use it, it's leaning Symbolic. If it works via physical affordance, it's Artifact. Yes, there are hybrids, but the pure cases (stick vs. sentence) show the architectural divergence."
  *   **Weakness Flag:** **Medium.** Edge cases like diagrams or mathematical notation will haunt you.

  ### Objection 5: The Dennett Exegesis
  **"Dennett didn't make this split. Why amend him instead of following the hierarchy as written?"**
  *   **The Reply:** "Dennett's hierarchy is a heuristic, not a scripture. He grouped all external scaffolding under 'Gregorian.' But since 1995, we've learned much more about predictive processing and the specific cognitive load of language. I'm preserving his insight—that minds extend into the world—while updating the mechanism to reflect that not all extensions are computationally equal. It's a repair, not a rejection."
  *   **Weakness Flag:** **Low.** Unless there's a Dennett superfan in the room, this is safe.

  ### Objection 6: The Neural Realizability
  **"Do we have neural evidence for this architectural difference, or is this just armchair speculation?"**
  *   **The Reply:** "We see differential activation in tool-use versus language tasks—mirror systems versus Broca's area networks. But my claim is functional, not purely locational. It's about the *information flow*. Tool use closes the loop through the hand and object. Language closes the loop through the social-linguistic network. The neural substrate supports both, but the computational graph differs. I'm predicting that future connectomics will show distinct feedback loops for syntactic vs. physical prediction."
  *   **Weakness Flag:** **High.** If pressed for specific papers or data, you might lack direct evidence for the *architectural split* specifically.

  ### Objection 7: The Explanatory Payoff
  **"Okay, suppose you're right. What work does this split do that the original Gregorian category didn't?"**
  *   **The Reply:** "It explains the asymmetry in cognitive vulnerability. You can lose language and retain tool use (aphasia), but you rarely lose tool use and retain complex syntax. It also explains the explosion of cultural evolution. Artifact-Gregorians evolve slowly (tool shapes); Symbolic-Gregorians evolve rapidly (ideas). Without the split, we can't explain why cultural evolution accelerates so drastically once language hits the scene. It solves the 'speed limit' problem in cultural transmission."
  *   **Weakness Flag:** **Medium.** Ensure you don't overstate the aphasia evidence; there are nuances there.

  ### Objection 8: The "So What?" Objection
  **"Isn't this just renaming 'non-human tool use' vs 'human language' with fancier terminology?"**
  *   **The Reply:** "It's not about the species; it's about the capacity. If we engineer an AI that manipulates physical objects perfectly but cannot process syntax, it's an Artifact-Gregorian. If we find a human who relies purely on gesture without syntax, they regress to Artifact-Gregorian. The terms track cognitive modes, not biological taxa. This allows us to model non-human minds and AI without anthropomorphizing, and without denying them sophisticated cognition."
  *   **Weakness Flag:** **Low.** This is a solid defensive position.

  ---

  ### Strategic Note
  If the **Killer Question (Popperian Collapse)** comes up, do not get bogged down in Dennett textual analysis. Pivot immediately to the **cost of error**. That is your strongest wedge: Physical hypotheses break things; symbolic hypotheses break consistency. Keep hammering the "cost of testing" difference.
