      *   **Context:** Panel is split (Chair: fund with conditions; Member 1: decline outright [Panglossian]; Member 2: fund as submitted [no armchair paralysis]).
      *   **Key Issues:**
          *   Adaptationist programme vs. genomic signals (applicants claim genomic signals solve the "just-so story" problem).
          *   "Loss Trap": Most traits are losses (eyes, pigment, etc.), which can be adaptive (energy economy) or non-adaptive (relaxed selection + drift). Genomic pipeline doesn't discriminate.
          *   "Tier C" Problem: Narrative plausibility annotations might be read as data by downstream users (conservation agency, commercial breeder).
          *   Unexplained trait (midline groove) will get a story anyway.
          *   Conservation urgency (water table dropping).
      *   **Constraints:**
          *   Word count: 1,100–1,300 words.
          *   Format: Short header block, addressed to panel, applicants as named recipients.
          *   Tone: British English. Professional, authoritative, nuanced.
          *   Content: One specific recommendation (Fund, Fund with Conditions, or Decline). Do not offer a menu.
          *   Requirements for Conditions (if chosen): Must be actionable/checkable (Tier C publication rules, tier promotion evidence, handling regressive traits, commercial access).
          *   Counter-argument: Give the strongest/fairest statement of the rejected option (not a strawman).
          *   Closing: Personal reflection on shakiest assumption and what finding would change the recommendation.
          *   Do not rehearse Gould & Lewontin 1979 generally; apply it.

  2.  **Determine the Recommendation:**
      *   *Option A: Decline.* Too harsh given conservation urgency. Might stall vital data.
      *   *Option B: Fund as Submitted.* Ignores the valid methodological concerns about Tier C narratives becoming reified data. Risks polluting the literature/database with untested adaptationist stories.
      *   *Option C: Fund with Conditions.* Best middle ground. Acknowledges urgency but mitigates the "loss trap" and "Tier C reification" risks. Allows the work to proceed but ensures scientific rigour regarding non-adaptive hypotheses.
      *   *Decision:* **Fund with Conditions.** This aligns with the Chair's inclination but needs specific, hard-edged conditions derived from the user's specific worries (loss trap, Tier C usage).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
