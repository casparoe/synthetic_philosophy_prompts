      *   **The Core Argument (Applying G&L):** Address the applicants' claim that genomic signals replace the need for rigorous adaptive hypothesis testing. Explain why selection scans don't distinguish drift from selection in regressive traits (the "loss trap").
      *   **The Conditions:**
          1.  *Tier C Publication:* Must be clearly labelled as hypothetical, not downloadable as raw data for modelling without flagging.
          2.  *Tier Promotion:* Explicit criteria for moving C to B (e.g., independent lineage correlation, not just plausibility).
          3.  *Regressive Traits:* Must explicitly model null hypotheses (drift/relaxed selection) alongside adaptive ones.
          4.  *Commercial Access:* Restricted access to Tier C data to prevent commercial exploitation of unverified traits.
      *   **The Rejected Argument (Strongest Version):** Address the "armchair paralysis" argument (Member 2). Acknowledge the conservation urgency. Admit that demanding perfection might delay vital conservation action.
      *   **Closing Reflection:** Identify the shakiest assumption (e.g., that conditions will be enforced/effective) and what would change the mind (e.g., evidence that Tier C data *doesn't* get misused).
      *   **Word Count Check:** Need to monitor closely to stay within 1,100–1,300 words.

  4.  **Drafting - Tone and Style:**
      *   British English (programme, centre, modelling, etc.).
      *   Academic but decisive.
      *   Respectful of the applicants' expertise but firm on methodology.
      *   Avoid lecturing on 1979 paper history; focus on the *application* of the critique to genomic data.

  5.  **Drafting - Content Details:**
      *   *Header:* To: Evolutionary Systems Panel; From: [My Name/Role]; Date: Wednesday; Subject: Decision on Programme Grant [Ref].
      *   *Recipients:* Include applicants in the loop.
