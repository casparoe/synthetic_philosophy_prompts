      *   *Tier C:* The risk is reification. Once it's in a database, it becomes "fact" for modellers.
      *   *Conditions:* Need to be specific. "Null models must be published alongside adaptive scenarios." "Tier C cannot be used for commercial breeding without upgrade."
      *   *Counter-argument:* The conservation agency needs *something* now. Waiting for perfect science means extinct beetles.
      *   *Reflection:* Maybe the assumption that modellers will read confidence tiers correctly is weak.

  6.  **Word Count Management:**
      *   Need to expand on the reasoning to hit the lower bound (1,100) but not exceed the upper (1,300).
