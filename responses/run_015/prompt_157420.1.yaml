prompt: |-
  I'm a phd student in aesthetics and i'm running a session next week for an undergrad/grad reading group on Du Bois's propaganda thesis—specifcally the claim in Criteria of Negro Art that all art is propoganda and Black artists shouldn't chase 'art for art's sake.' The audience has mostly read Souls of Black Folk but not the Criteria essay, so they know the sorrow songs but not his polemical framing. Don't explain the thesis to me; plan how I should teach it.

  What order do the pieces have to go in so they don't just hear 'propaganda = bad Soviet posters'? What's the one concrete example—probably one of the sorrow songs or maybe a reference to a specific visual work—that should carry the whole session, and what must it have (beauty + political work visible at once) and lack (pure didacticism without aesthetic form)?

  I'm expecting they form at least three misconceptions: that Du Bois rejects beauty for politics, that he means propaganda in teh modern manipulative sense, and that he's just saying Black art should be political like a billboard. Where exactly in the sequence do I head each one off?

  Also I want to sit them with a gap he never resolves: he distinguishes propaganda for justice from propaganda for evil but never gives the criterion, and I think the best teaching moment is letting them feel that absence rather than papering over it. So what's the dependency chain—what idea has to land before they can even see the gap? What's a check question at the end that shows whether they understand the collapse of beauty and propaganda rather than just parroting the thesis? And what should I openly refuse to cover—maybe the Black Arts Movement comparison, or the full history of 'art for art's sake'—and say so?

  Plan it out: the sequence with dependencies, the carrying example and its design specs, the misconception map with deflection points, the check, and the explicit omissions.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** PhD student in aesthetics.
      *   **Task:** Plan a reading group session on W.E.B. Du Bois's "Criteria of Negro Art" (specifically the "all art is propaganda" thesis).
      *   **Audience:** Undergrad/Grad mix. Read *Souls of Black Folk* (know Sorrow Songs), but *not* "Criteria."
      *   **Constraints:** Do *not* explain the thesis to the user (they know it). Focus on pedagogy/sequencing.
      *   **Key Goals:**
          *   Avoid the "Soviet poster/billboard" misunderstanding of propaganda.
          *   Select *one* concrete example (Sorrow Song or visual) that embodies Beauty + Political Work without being purely didactic.
          *   Address three specific misconceptions (Beauty vs. Politics, Modern "Manipulative" Propaganda, Art as Billboard).
          *   Highlight the unresolved gap (Justice vs. Evil propaganda criterion) without resolving it.
          *   Define dependencies (what must land before the gap is visible).
          *   Create a final check question (tests understanding of the collapse of beauty/propaganda).
          *   Specify explicit omissions (what *not* to cover).

  2.  **Deconstruct the Thesis & Context:**
      *   Du Bois's claim: "All Art is propaganda and ever must be."
      *   Context: 1926, Harlem Renaissance, debate with Locke (who leaned more towards aesthetic autonomy/universalism) and the general "Art for Art's Sake" tradition.
      *   Nuance: Du Bois isn't saying "make bad art with a message." He's saying "Art *functions* to persuade about the value of human life/experience." For Black artists, ignoring the racial struggle is itself a political act (of erasure).
      *   The Gap: He wants propaganda for *truth and justice*, but admits the mechanism is the same as propaganda for lies. He relies on a moral intuition he doesn't fully aestheticize.

  3.  **Sequencing the Session (The Dependency Chain):**
      *   *Problem:* If I start with "All art is propaganda," they hear "Stalinist Realism."
      *   *Solution:* Start with the *function* of art in *Souls* (Sorrow Songs) to ground the definition of propaganda as "world-making" or "truth-telling" rather than "manipulation."
      *   *Step 1: Reactivate Prior Knowledge.* Use *Souls*. They know the Sorrow Songs.
      *   *Step 2: Introduce the Shock.* The "Criteria" quote.
      *   *Step 3: Redefine Propaganda.* Move from "manipulation" to "advocacy of existence."
      *   *Step 4: The Example.* Apply the redefined term to the Sorrow Song.
      *   *Step 5: The Gap.* Once they accept the definition, show the moral vulnerability.

  4.  **Selecting the Carrying Example:**
      *   *Option A:* Visual art (Aaron Douglas, etc.). Good, but they haven't read the essay's specific art critiques.
      *   *Option B:* Sorrow Songs. They know this. It fits Du Bois's own primary example of Black aesthetic achievement.
      *   *Selection:* **"Nobody Knows the Trouble I've Seen."**
      *   *Why?*
          *   *Beauty:* Melodic complexity, emotional depth (not a slogan).
          *   *Political Work:* Asserts interiority against a system that denied Black interiority. It says "I suffer, therefore I am."
          *   *Lacks:* It doesn't say "Vote for X" or "Overthrow Y." It's not a billboard.
      *   *Design Specs:* Must show how the *aesthetic form* (the melody, the sorrow) *is* the political act (claiming humanity).

  5.  **Mapping Misconceptions to Deflection Points:**
      *   *Misconception 1: Rejects Beauty for Politics.*
          *   *Deflection:* Early. When introducing the quote. Emphasize Du Bois's love of beauty (Goethe, Wagner). He wants beauty *and* propaganda.
      *   *Misconception 2: Propaganda = Manipulative/Lie (Modern sense).*
          *   *Deflection:* During the definition phase. Contrast "advertising" with "witnessing."
      *   *Misconception 3: Art as Billboard (Didacticism).*
          *   *Deflection:* During the Example analysis. Show how the song fails as a billboard but succeeds as propaganda.

  6.  **Addressing the Gap (Justice vs. Evil):**
      *   *Dependency:* They must first accept that Art *is* propaganda (functional). Only then does the question "Propaganda for *what*?" matter. If they think Art is autonomous, the moral content is secondary. If Art is propaganda, the moral content is primary.
      *   *Teaching Moment:* Don't solve it. Ask: "If the form is the same, what stops a Nazi aesthetic from making the same claim?"
      *   *Check Question:* Needs to test if they see the *fusion*, not just the sum. Not "What did Du Bois say?" but "How does this song do two things at once?"

  7.  **Determining Omissions:**
      *   *Black Arts Movement (BAM):* Too anachronistic. BAM took "propaganda" differently (often more didactic). Comparing them now confuses the specific 1926 context.
      *   *Full History of "Art for Art's Sake":* Too broad. Stick to Du Bois's specific engagement with it (the white gatekeepers).
      *   *Locke vs. Du Bois Debate:* Mention only if necessary for context, but don't get bogged down in the New Negro debate specifics unless it illuminates the "propaganda" claim. Better to omit for time/focus.

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Opening:* Hook with *Souls*.
      *   *The Turn:* Hit them with the "Criteria" line.
      *   *The Work:* Redefine propaganda.
      *   *The Example:* "Nobody Knows."
      *   *The Gap:* The moral criterion problem.
      *   *The Close:* Check question.
      *   *Omissions:* State clearly.

      *(Self-Correction during drafting)*: Make sure I don't explain the thesis to the user. Keep it instructional. Ensure the "Gap" section emphasizes *letting them feel the absence*.

      *(Refining the Example)*: "Nobody Knows" is good, but Du Bois specifically discusses "The Song of the Towers" or general Sorrow Songs. Let's stick with "Nobody Knows" as it's the most recognizable from *Souls*. Wait, Du Bois in *Criteria* mentions the "Sorrow Songs" generally as the proof of Black capacity. Using a specific one they know from *Souls* bridges the gap perfectly.

      *(Refining the Gap)*: The gap is that Du Bois assumes "Truth and Justice" are self-evident goods that art should serve, but he doesn't explain how the *aesthetic* distinguishes a just propaganda from an unjust one. If both use beauty to persuade, how do we tell them apart aesthetically? We can't. That's the aporia.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Sequence with dependencies? Yes.
      *   Carrying example + specs? Yes.
      *   Misconception map? Yes.
      *   Check question? Yes.
      *   Explicit omissions? Yes.
      *   Tone: Peer-to-peer (PhD to PhD), pedagogical focus.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is a session plan designed to move your group from their *Souls* baseline to the specific tension in "Criteria," managing the conceptual load so the "propaganda" thesis lands as an aesthetic claim rather than a political slogan.

  ### 1. The Sequence & Dependency Chain

  You cannot start with the thesis statement. If you open with "All art is propaganda," the modern definition of *propaganda* (manipulation/deception) will hijack the room before Du Bois's definition (advocacy/witnessing) can land.

  **Phase 1: Reactivate the Aesthetic Baseline (15 mins)**
  *   **Text:** *Souls of Black Folk* (Chapter 14, "Of the Sorrow Songs").
  *   **Task:** Ask them to recall *why* Du Bois values the Sorrow Songs in *Souls*. Is it just historical record? No, it's that they possess a unique beauty that testifies to Black humanity.
  *   **Dependency:** This establishes that for Du Bois, **Beauty is already a form of Truth.** You need this established before you can claim Beauty is also Propaganda.

  **Phase 2: The Shock & Redefinition (20 mins)**
  *   **Text:** "Criteria of Negro Art" (The opening paragraphs).
  *   **Task:** Read the famous line: *"All Art is propaganda and ever must be."*
  *   **Move:** Immediately pivot to his definition. Du Bois is not using the WWI/Soviet definition (coercion). He is using the etymological root (*propagare*: to propagate/spread).
  *   **Dependency:** They must accept that Art *does work* in the world before they can evaluate *what work* it should do.

  **Phase 3: The Carrying Example (25 mins)**
  *   **Text:** "Nobody Knows the Trouble I've Seen" (via *Souls*).
  *   **Task:** Analyze this song through the "Criteria" lens.
  *   **Dependency:** They must see the mechanism of the song before they can see the moral gap in Du Bois's theory.

  **Phase 4: The Gap (20 mins)**
  *   **Text:** "Criteria" (The section on Truth/Justice/Goodness).
  *   **Task:** Isolate the moral criterion.
  *   **Dependency:** This only works if they have accepted Phase 3. If they think art is autonomous, the moral gap doesn't matter. If they accept art is functional (propaganda), the *direction* of that function becomes the critical problem.

  ---

  ### 2. The Carrying Example: "Nobody Knows the Trouble I've Seen"

  Do not use a visual work (e.g., Aaron Douglas) or a Harlem Renaissance novel. They haven't read the essay's specific critiques of those, and it introduces too much historical friction. Use the Sorrow Songs they already know from *Souls*.

  **Design Specs for the Example:**
  *   **Must Have (Beauty + Political Work):** The song must demonstrate that the *aesthetic form* (the melody, the minor key, the vocal texture) is the vehicle for the *political claim* (the assertion of interiority). The beauty *is* the argument that "I am a soul worthy of sorrow."
  *   **Must Lack (Pure Didacticism):** The song cannot be a protest song in the 1960s sense. It does not say "End Slavery" or "Vote." It lacks explicit demands. This prevents the "Billboard" misconception.

  **How to Run It:**
  Ask the group: "If this song is propaganda, who is the audience and what is it persuading them of?"
  *   *Correct Answer:* It persuades the singer and the listener of the singer's humanity.
  *   *The Point:* It is not propaganda for a policy; it is propaganda for *existence*. This aligns with Du Bois's claim that Black art must fight the lie of Black inferiority.

  ---

  ### 3. Misconception Map & Deflection Points

  Here is where you intervene in the discussion to prevent the three expected errors.

  | Misconception | When it arises | Deflection Strategy |
  | :--- | :--- | :--- |
  | **1. "Du Bois rejects Beauty for Politics."** | **Phase 2 (The Shock).** When they hear "propaganda," they assume he wants utility over aesthetics. | **Intervention:** Point to Du Bois's own life (his love of Wagner, Goethe). Remind them he critiques bad Black art *for being ugly*, not just for being apolitical. <br>**Script:** "He isn't asking for less beauty. He's asking if beauty can be innocent when your people are under siege." |
  | **2. "Propaganda = Manipulative/Lie."** | **Phase 2 (Redefinition).** The modern negative connotation of the word. | **Intervention:** Contrast "Advertising" (selling a product) with "Witnessing" (asserting a truth). <br>**Script:** "Du Bois isn't talking about Goebbels. He's talking about the necessity of making a case for your own humanity in a world that denies it." |
  | **3. "Art should be a Billboard."** | **Phase 3 (The Example).** When analyzing the Sorrow Song. | **Intervention:** Highlight the *ambiguity* of the song. It doesn't name the oppressor. <br>**Script:** "If this were a billboard, it would name the enemy. Because it's art, it names the *pain*. Du Bois wants the pain to do the political work, not the slogan." |

  ---

  ### 4. The Gap: Justice vs. Evil

  This is the core philosophical tension. Du Bois writes: *"I do not care a damn for any art that is not used for propaganda. But I do care when propaganda is confined to one side while the other is stripped and silent."* He distinguishes between propaganda for "Truth and Justice" vs. propaganda for "Lie and Oppression."

  **The Dependency:**
  They can only see this gap **after** they accept that Art *is* propaganda. If they hold onto "Art for Art's Sake," they will argue that Art shouldn't serve Justice *or* Evil. You must get them to agree with Du Bois first (Art *does* serve a master), then ask: *How do we tell the masters apart?*

  **The Teaching Moment:**
  Do not resolve this. Do not offer a Kantian solution or a Marxist one.
  *   **Prompt:** "Du Bois assumes we can distinguish 'propaganda for justice' from 'propaganda for evil.' But if the mechanism is the same (using beauty to persuade), and the Sorrow Songs use beauty to persuade us of Black humanity... what aesthetic feature stops a White Supremacist artist from using beauty to persuade us of Black inferiority?"
  *   **Goal:** Let them sit with the silence. Du Bois relies on a moral intuition that he does not aestheticize. He assumes the "Good" is self-evident, but he doesn't explain how the *form* reveals the Good.

  ---

  ### 5. The Check Question

  Do not ask: "What did Du Bois mean by propaganda?" (This invites parroting).
  Do not ask: "Do you agree with Du Bois?" (This invites opinion without analysis).

  **Ask this:**
  > "If 'Nobody Knows the Trouble I've Seen' is propaganda for justice, what would a propaganda song for evil look like that is *equally beautiful*? If you can't describe the evil version without making it ugly, are you admitting Du Bois's theory fails?"

  **Why this works:**
  *   If they say "The evil song would be a Nazi anthem," check if they describe it as aesthetically potent or just loud.
  *   If they struggle to imagine a *beautiful* evil song, they have uncovered Du Bois's hidden premise: that Beauty and Goodness are ontologically linked (a Platonic hangover Du Bois never sheds).
  *   This confirms they understand the **collapse** of beauty and propaganda: they are testing whether the collapse holds under pressure.

  ---

  ### 6. Explicit Omissions

  State these at the start to manage expectations and keep the scope tight.

  1.  **The Black Arts Movement (BAM):** "We are not comparing this to Baraka or the BAM slogan 'Art is a weapon.' That is a different historical moment with a different definition of utility. Stay in 1926."
  2.  **The Full 'Art for Art's Sake' History:** "We aren't tracing Wilde or Pater today. We are only looking at how Du Bois *uses* that concept as a foil."
  3.  **The Locke vs. Du Bois Debate:** "We are not adjudicating the New Negro debate between Locke and Du Bois. Locke's aesthetic autonomy is the background noise, not the foreground subject."

  **Rationale:** These are the three biggest time-sinks. By ruling them out, you force the group to grapple with the internal logic of "Criteria" rather than externalizing the debate into historical comparisons they aren't prepared for.
