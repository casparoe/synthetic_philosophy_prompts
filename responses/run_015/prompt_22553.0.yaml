          *   Anti-Humean: Easy. Dispositions exist even if not triggered.
      *   *Point 3: Counterfactuals:*
          *   Scenario: "If I had dropped this cup..."
          *   Humean: Look at nearby possible worlds with similar mosaics. But laws might differ there. Circular worry?
          *   Anti-Humean: The law *makes* the counterfactual true. The cup has a disposition to fall.
      *   *Point 4: Scientific Explanation:*
          *   Humean: Unification. Newton's laws explain the apple because they unify the apple with the moon.
          *   Anti-Humean: Production/Constraint. The apple falls *because* gravity compels it.
