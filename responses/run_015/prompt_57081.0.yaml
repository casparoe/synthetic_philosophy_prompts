answer: |-
  The break in your argument occurs at the step where you assert that **"preparation is an epistemic notion."**

  You write: *"If whether a signal may be sent turns on which distributions we are able to prepare, the constraint in question is a constraint on our epistemic access, not a structural feature of the world."*

  This is the illegitimate move. It conflates **Signal Locality** (the inability to send superluminal messages) with **Bell Locality** (the ontological requirement that spacelike-separated events be independent conditional on their past), and it mischaracterizes the physical status of "preparation" within the pilot-wave framework.

  Here is the precise assessment of where the reasoning fails, point by point.

  ### 1. The Conflation of Signal Locality and Bell Locality
  Your argument relies on the intuition that if you cannot *use* a connection to send a signal, the connection is not "physically real" in a way that violates locality. This is incorrect in the context of Bell's theorem.

  Bell's theorem does not prove that nature allows superluminal signaling; it proves that nature violates **Local Causality**. Local Causality requires that the probability of an outcome at one wing of an experiment be independent of the setting at the other wing, given a complete specification of the past. Pilot-wave theory violates Local Causality explicitly: the velocity of particle A depends instantaneously on the position of particle B.

  The fact that this dependence is "screened off" by the quantum equilibrium distribution ($\rho = |\psi|^2$) preserves Signal Locality, but it does not restore Bell Locality. The dependence remains in the equations of motion. To claim that "Nature may be perfectly local" because the nonlocality is inoperative is to redefine "locality" from "no ontological dependence" to "no signaling." Bell's theorem rules out the former, not just the latter. Your friend is correct that the nonlocality is structural; you are correct that it is inoperative *in equilibrium*, but you are wrong to infer that inoperativity implies mere description.

  ### 2. Preparation is Physical, Not Epistemic
  You argue that because signaling depends on preparation, and preparation is epistemic, the constraint is epistemic. In pilot-wave theory (and specifically in Valentini's extension of it), preparation is a **physical process**, not merely an epistemic one.

  In this framework, the quantum equilibrium state is analogous to thermal equilibrium in statistical mechanics. It is a contingent state of the system, not a fundamental law. The reason we cannot prepare non-equilibrium distributions (and thus cannot signal) is not because of a fundamental limit on knowledge, but because of physical relaxation mechanisms that drive systems toward equilibrium.

  By treating preparation as purely epistemic, you are assuming that the inability to access non-equilibrium states is a limit on *us*. Valentini's argument (which your friend cites) is that it is a limit on the *state of the universe*. If the universe were in a different physical state (non-equilibrium), signaling would be physically possible. Therefore, the prohibition on signaling is a physical constraint derived from contingent initial conditions, not an epistemic constraint derived from the nature of description.

  ### 3. The Ontological Status of Hidden Variables
  You ask who is misusing the term "hidden variable." You are sliding between two senses.
  *   **Your usage:** You treat "hidden" as implying "merely epistemic." You argue that because the variables are inaccessible, their nonlocal relations are descriptive artifacts.
  *   **The Theory's usage:** In pilot-wave theory, "hidden" means "not directly observable in equilibrium," but the variables (particle positions) are the **ontology**. They are what exists.

  If the theory is true, the particles *are* the matter. If the motion of that matter is governed by a nonlocal equation, then matter moves nonlocally. You cannot say "Nature is local" while accepting the pilot-wave ontology, because the ontology *is* the description of nature in this theory. To claim the nonlocality is only in the description is to claim the theory is false (or incomplete), not that it is local.

  ### 4. The "Law-like" Wavefunction
  Your friend's claim that the wavefunction is a "law" rather than a "field" does not save locality, and your inference that a law "cannot bear physical relations at a distance" is the final error.

  Laws dictate how physical entities behave. If the law of motion for a particle at location $x$ explicitly includes a term for the configuration of a particle at location $y$, the law mediates a physical dependence. Newtonian gravity was a "law," yet it posited action at a distance. Whether the wavefunction is a physical field or a nomological entity, if it enters the guiding equation in a way that couples spacelike-separated configurations, the resulting dynamics are nonlocal. The "law" view removes the wavefunction from the list of "beables," but it does not remove the nonlocal dependence from the behavior of the beables.

  ### Verdict
  Your friend is entitled to hold that the theory is epistemic about our *access* to the variables but physically nonlocal in its *dynamics*. You are not entitled to conclude that Nature is local.

  The specific step doing the illegitimate work is: **"If whether a signal may be sent turns on which distributions we are able to prepare, the constraint in question is a constraint on our epistemic access, not a structural feature of the world."**

  This is false because the distributions are physical states, and the inability to prepare them (if it holds) is a dynamical feature of the world, not a limit of knowledge. Consequently, Bell's theorem establishes exactly what is usually advertised: that any theory reproducing these correlations (including pilot-wave) must be ontologically nonlocal. The "inoperative" nature of that nonlocality is a contingent feature of our specific cosmic epoch, not a proof that the underlying reality is local.
