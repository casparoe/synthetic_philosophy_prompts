prompt: |-
  I'm in the second term of a graduate seminar on population ethics and suffering-focused ethics, and I have to submit a short thesis prospectus in a fortnight. The thesis itself would be about nine months of work, single-authored, roughly twelve thousand words, and it has to end in a defended verdict rather than a survey: whether some version of lexical threshold negative utilitarianism should guide cause prioritization, i.e. whether the reduction of extreme suffering really does swamp the production of ordinary happiness, or whether that conclusion is an artefact of how the view is set up.

  Let me state the target view in my own terms so we don't talk past each other. It has four parts: (1) the only non-instrumentally good or bad features of a life are pleasant and unpleasant experiences, understood as admitting of scalar intensity and duration; (2) below some intensity threshold, pleasures and pains are commensurable and trade off against each other on a single cardinal scale; (3) above that threshold, the disvalue of pain is lexically dominant, so no amount of sub-threshold pleasure, however vast or however distributed across persons, can compensate for a single episode of suffering above it; (4) the view is negative in that the avoidance and relief of suffering is where the practical action is, and the threshold is precisely what is supposed to stop it collapsing into the familiar reductio that we ought to painlessly extinguish everyone, since ordinary lives contain a good deal of mild suffering.

  What I want from you is an agenda, not a literature review and not a reading list. I can find and read the sources myself, so please don't give me citations or suggestions for further reading. Here is the candidate pool as I currently see it, though part of what I want is for you to tell me which of these are the real cruxes and which are noise.

  The calibration problem: the threshold has to be set so that ordinary human lives clear it, on pain of reinstating the extinction implication, but so that the worst suffering we have decent testimony about falls above it, on pain of the view being extensionally indistinguishable from total utilitarianism in every case anyone cares about. Can that be done non-arbitrarily, or is the threshold always going to look like a dial turned to whatever the theorist's prior conclusions were?

  The question whether the lexical claim is axiological or deliberative: whether it says which worlds are better, or only which ones an agent may bring about or permit. These can come apart, and I suspect the distinction quietly does a lot of work in the debate.

  Two aggregation questions that I think people conflate. Whether the threshold blocks compensation within a single life, so that a life containing a few minutes of agony plus eighty years of contentment is not worth living, is a different question from whether it blocks compensation across lives, so that no number of mildly contented lives could justify one episode of agony. A view can take quite different shapes depending on whether it is intrapersonal, interpersonal, or both.

  A decision-theoretic worry I haven't seen handled: if our credences over the intensity of some experience are continuous, then lexicographic orderings are not representable by anything like an ordinary expectation, and infinitesimal probabilities seem to be doing all the work. So what does the view actually recommend to an agent who is uncertain whether a given state clears the threshold?

  And the question my supervisor takes to be upstream of all of it: whether pleasure and pain are commensurable in the first place, whether intensities are interpersonally comparable, and what it would even mean to settle that.

  Two variants of my own I'd like you to assess rather than humour. The first makes the view symmetric by adding a floor: experiences below some intensity contribute nothing at all, so there is a dead zone at the bottom of the scale, and I want to know whether the floor and the lexical ceiling could reasonably be set independently or whether symmetry is unmotivated. The second replaces the sharp cut with a narrow band of intensities over which the disvalue of pain rises very steeply but continuously, which removes the cliff-edge objection at the cost, I suspect, of removing the lexicality too.

  Rank the four or five questions you think a nine-month thesis should actually engage, and defend the ordering. I care about the criteria at least as much as the list: which questions are upstream of which, which are tractable for one person with nine months and no empirical data, which are neglected rather than merely unresolved, and what argument or consideration would move something up or down the list. Tell me if one of my two variants is a dead end, and tell me if my framing of the view has smuggled in something it shouldn't. If you think the commensurability question really does swallow the others, say so and say what I should do with nine months if that's true.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User and Request:**
      *   **User:** Graduate student, second term of a seminar on population/suffering-focused ethics.
      *   **Task:** Submit a short thesis prospectus in two weeks. Thesis is 9 months, single-authored, ~12k words. Must end in a defended verdict (not a survey).
      *   **Topic:** Whether a version of Lexical Threshold Negative Utilitarianism (LTNU) should guide cause prioritization (specifically, does extreme suffering swamp ordinary happiness, or is this an artefact?).
      *   **Target View:** Defined by four parts (hedonism, commensurability below threshold, lexical dominance above threshold, negative focus to avoid extinction reductio).
      *   **Constraints:** *No* literature review, *no* reading list/citations. Wants an *agenda*. Wants ranking of questions/cruxes. Wants assessment of their two variants. Wants to know if commensurability swallows everything.
      *   **Candidate Pool:** Calibration problem, Axiological vs. Deliberative, Intra- vs. Interpersonal Aggregation, Decision-Theoretic/Uncertainty problem, Commensurability/Comparability (Supervisor's worry), Two Variants (Symmetric Floor, Continuous Band).
      *   **Criteria for Ranking:** Upstream dependencies, tractability (9 months, 12k words, no empirical data), neglectedness vs. unresolvedness, potential for a defended verdict.

  2.  **Evaluate the Candidate Questions:**

      *   *Commensurability/Comparability (Supervisor's Worry):* This is the metaphysical foundation. If pleasures and pains aren't cardinally comparable interpersonally, the whole scalar/threshold model collapses. However, for a 12k word thesis aiming at *cause prioritization*, getting bogged down in the metaphysics of sensation might be a trap. It's "upstream," but often treated as a presupposition in normative ethics papers unless the thesis is *about* metaethics. If the user spends 9 months proving interpersonal comparability, they won't get to the lexical threshold argument. *Verdict:* Crucial background, but potentially a thesis-killer if made the central focus. Needs to be bracketed or assumed for the sake of argument, unless the verdict is "LTNU fails because comparability fails."
      *   *Calibration Problem:* This is the "Goldilocks" issue. If the threshold is too low -> Extinction. If too high -> Total Utilitarianism. Is it arbitrary? This is the strongest objection to LTNU. It's tractable philosophically (conceptual analysis). It's central to the "artefact" question in the prompt. *Verdict:* High priority.
      *   *Axiological vs. Deliberative:* This distinguishes "World A is better than World B" from "You ought to choose A." LTNU often works better as a deliberative constraint (deontological side-constraint style) than an axiological one (which faces the repugnant conclusion variants). This distinction might save the view from the calibration problem. *Verdict:* High priority, potentially the key to the "defended verdict."
      *   *Intra- vs. Interpersonal Aggregation:* The prompt defines the view as guiding *cause prioritization* (interpersonal). Intrapersonal issues (is a life worth living?) are relevant but secondary to the prioritization question. Conflating them is a common error. *Verdict:* Medium priority. Clarify, but don't let it dominate.
      *   *Decision-Theoretic/Uncertainty:* If there's a 1% chance of extreme suffering, does lexicality dominate? This leads to fanaticism. This is a very strong objection to lexical views in practice. It's technical but crucial for "cause prioritization." *Verdict:* High priority, specifically for the *application* aspect.
      *   *Variant 1 (Symmetric Floor):* Adding a "dead zone" for mild pleasure/pain. This complicates the view without solving the main negative utilitarian problems. It risks looking ad hoc. *Verdict:* Likely a dead end/distraction.
      *   *Variant 2 (Continuous Band):* Smoothing the threshold. This sacrifices lexicality (the core feature) to avoid arbitrariness. If the thesis is about *Lexical* Threshold NU, this might change the topic too much. *Verdict:* Worth assessing, but probably undermines the core claim.

  3.  **Determine the Strategy for a 12k Word Thesis:**
      *   12k words is short for a graduate thesis (roughly 30-40 pages). It cannot cover everything.
      *   It needs a *verdict*. "LTNU is plausible but needs modification X" or "LTNU fails because of Y."
      *   The prompt asks about *cause prioritization*. This suggests a practical/deliberative focus rather than pure metaphysics.
      *   The "artefact" question is key: Is the swamping real or mathematical trickery?

  4.  **Ranking and Ordering:**

      *   *#1: Axiological vs. Deliberative.* Why? Because if LTNU is axiological, it faces massive aggregation problems (the "lexical repugnant conclusion"). If it's deliberative (a constraint on action), it avoids some of these. This determines *what* the theory actually is. It's upstream of calibration.
      *   *#2: The Calibration/Arbitrariness Objection.* This is the standard "kill shot" against threshold views. If the threshold is arbitrary, the view is unjustified. The thesis needs to take a stand on whether a non-arbitrary threshold is possible.
      *   *#3: Decision-Theoretic Uncertainty.* Since the goal is *cause prioritization*, we deal with probabilities. Lexicality + Uncertainty = Fanaticism (prioritizing tiny risks of hell over vast certain happiness). This is a practical reductio.
      *   *#4: Commensurability.* Put this last or bracket it. If the user tries to solve this, they won't finish. The verdict can be conditional: "If comparability holds, then LTNU fails/succeeds because..."
      *   *Variants:* The "Continuous Band" is better than the "Symmetric Floor." The Floor adds complexity without solving the negative utilitarian specific issues. The Band addresses the arbitrariness objection but threatens lexicality.

  5.  **Drafting the Response:**

      *   *Tone:* Professional, academic, direct, respecting the "no citations" rule.
      *   *Structure:*
          1.  Assessment of the View's Framing (Smuggled assumptions?).
          2.  The Ranking (Top 4-5 questions).
          3.  Defense of the Ordering (Upstream/Tractability/Neglectedness).
          4.  Assessment of Variants.
          5.  The "Commensurability Swallow" warning.
          6.  Suggested Verdict Path.

      *   *Refining the "Smuggled Assumption":* The user defines the view as guiding *cause prioritization* but defines the core as *axiological* (parts 1-3 describe value, part 4 describes action). This tension is the Axiological vs. Deliberative point. Also, the definition assumes scalar intensity is coherent.
      *   *Refining the Ranking:*
          1.  *Deliberative vs. Axiological:* This is the most important pivot. If it's axiological, the "swamping" is a claim about the Good. If deliberative, it's a constraint on the Right. This changes the defense strategy.
          2.  *Uncertainty/Fanaticism:* For cause prioritization, this is the practical killer. Lexicality implies infinite disvalue (effectively). Expected value calculations break.
          3.  *Calibration:* The metaphysical coherence of the threshold.
          4.  *Commensurability:* Bracket it.
      *   *Variants:* Symmetric Floor is unmotivated (asymmetry of pain/pleasure is the point of NU). Continuous Band is the stronger contender but admits the view isn't truly lexical.
      *   *Commensurability:* Don't let it swallow the thesis. Treat it as a premise.

  6.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Agenda not reading list? Check.
      *   Rank 4-5 questions? Check.
      *   Defend ordering? Check.
      *   Assess variants? Check.
      *   Address commensurability worry? Check.
      *   Word count/Scope check: 12k words is tight. The advice must reflect this limitation (focus on one or two cruxes deeply, not all five shallowly).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "do this." I need to explain *why* based on the 9-month/12k-word constraint. The "Axiological vs. Deliberative" distinction is the most high-leverage move because it allows the student to potentially save the view from the harshest objections without solving the metaphysics of pain. The Uncertainty problem is the most "cause prioritization" specific.

      *Revised Ranking for Maximum Impact:*
      1.  Axiological vs. Deliberative (Defines the project).
      2.  Uncertainty/Fanaticism (Practical application killer).
      3.  Calibration (Theoretical coherence).
      4.  Commensurability (Background condition).
      (Drop Intra/Interpersonal as a separate main point; fold it into Axiological/Deliberative).

      *Wait, one more thing:* The user asked to rank 4 or 5. I should include the Intra/Interpersonal distinction because it clarifies the "extinction" reductio.
      Okay, let's stick to the strongest 4.
      1. Axiological vs. Deliberative.
      2. Uncertainty (Decision Theory).
      3. Calibration (Non-arbitrariness).
      4. Commensurability (The "Upstream" check).

      *Variants:* Symmetric Floor = Dead End. Continuous Band = Viable but changes the thesis claim.

      *Commensurability:* If this is true, the thesis becomes a metaethical one. Advise to conditionalize.

