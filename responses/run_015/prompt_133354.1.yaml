  # Session Plan: The Architecture of Coherence

  **Goal:** To experientially distinguish three forms of coherence arguments (Cycle, Chain, Temporal) without using technical jargon until the end, allowing the group to feel the structural differences in "loss" and "agency."
  **Time:** 90 Minutes.
  **Participants:** 9 people (1 Facilitator, 8 Players).
  **Materials:** Whiteboard, markers, 3 decks of colored index cards, a bowl of chocolate squares (or coins/tokens), printed role cards.

  ---

  ## 1. Room Setup & Materials

  *   **Seating:** A single large table or pushed-together tables. Everyone must see everyone.
  *   **The "Bank":** You (Facilitator) sit at the head with the chocolate bowl. This is the source of all payoffs and the collector of all fees.
  *   **The Whiteboard:** Divide into three sections labeled **I**, **II**, and **III**. Do not write titles yet.
  *   **Cards:**
      *   *Deck A (Cycle):* 3 Large Cards (Red, Blue, Green).
      *   *Deck B (Chain):* 5 Large Cards (Numbered 1 to 5, identical backs).
      *   *Deck C (Temporal):* 1 Decision Tree drawn on the board (see Game 3).
  *   **Currency:** Chocolate squares. 1 Square = 1 Unit of Value.
      *   *Rule:* No one eats the currency until the session ends. This maintains the "score."

  ---

  ## 2. Minute-by-Minute Schedule

  ### 00:00 – 00:10 | Introduction & The "No-Jargon" Rule
  *   **Welcome:** Briefly state the goal: "We are testing how decisions hold up under pressure. We are not testing intelligence; we are testing structures."
  *   **The Rule:** "For the next 75 minutes, we will not use words like 'rational,' 'transitive,' or 'utility.' We will only talk about choices, swaps, and chocolate."
  *   **Distribution:** Give every participant 10 chocolate squares to start. This is their endowment. They keep what they have at the end.

  ### 00:10 – 00:30 | Game I: The Cycle (The Revolving Door)
  *   **Setup:** Select 2 volunteers. One is the **Agent**, one is the **Trader**. The other 6 are **Observers**.
  *   **Preferences:** Hand the Agent a secret slip: *You prefer Red > Green > Blue > Red.* (Intransitive loop).
  *   **The Trader's Goal:** Extract chocolate from the Agent by offering swaps.
  *   **Rules:**
      1.  Agent starts with **Blue**.
      2.  Trader offers to swap Blue for Green.
      3.  Trader charges a **Fee of 1 Chocolate** for the service of swapping.
      4.  Agent accepts if they prefer the new card *or* are indifferent.
      5.  Limit: **5 Rounds maximum.**
  *   **Action:** Run the trade. Blue → Green (pay 1) → Red (pay 1) → Blue (pay 1).
  *   **Stop:** After 3 swaps, the Agent is back at Blue but has lost 3 chocolates.
  *   **Observer Task:** "Watch the Agent's face. Do they feel trapped? Watch the Trader's pile. Is it growing fast or slow?"
  *   **Whiteboard I:** Record: *Start: Blue, 10 Choc. End: Blue, 7 Choc.*
  *   **Transition:** Reset chocolates. Swap roles for a second quick round if time permits, otherwise move on.

  ### 00:30 – 00:45 | Game II: The Chain (The Slippery Slope)
  *   **Setup:** Same Agent and Trader (or new volunteers). 6 Observers.
  *   **Preferences:** Hand Agent a secret slip: *You are Indifferent between 1 & 2, 2 & 3, 3 & 4, 4 & 5. But you Prefer 5 over 1.*
  *   **The Trap:** The Agent wants 5. They start with 5.
  *   **Rules:**
      1.  Trader offers to swap 5 for 4. "It's basically the same, but I'll charge 1 chocolate for the paperwork."
      2.  Agent thinks: "I'm indifferent, so losing 1 chocolate is fine, the card is the same."
      3.  Trader moves down the chain: 5→4→3→2→1.
      4.  Fee: 1 Chocolate per step.
      5.  At the end (Card 1), Trader offers to swap back to 5 for **Free**.
  *   **Action:** Agent trades down (paying 4 chocolates total), accepts the free swap back to 5.
  *   **Result:** Agent ends with Card 5 (same as start) but has lost 4 chocolates.
  *   **Whiteboard II:** Record: *Start: Card 5, 10 Choc. End: Card 5, 6 Choc.*
  *   **Key Question to Group:** "In Game I, you paid because you wanted something better. In Game II, you paid even though you didn't care. Which feels worse?"

  ### 00:45 – 01:15 | Game III: The Temporal (The Three Selves)
  *   **Setup:** This is the main event. Select **3 Volunteers**. They will play the *same* scenario with *different instructions*. The other 6 observe.
  *   **The Scenario (Draw on Whiteboard III):**
      *   **Morning (Node 1):** Choose **Plan A** (Safe, get 3 Choc now) OR **Plan B** (Risky, go to Afternoon).
      *   **Afternoon (Node 2):** If you chose Plan B, you now choose **Take 10** (Wait 1 week for 10 Choc) OR **Take 2** (Get 2 Choc right now).
      *   **The Catch:** If you choose Plan B in the Morning, but Take 2 in the Afternoon, you are penalized 1 Choc for "Inconsistency." (Net 1).
  *   **The Preferences (Secret Slips):**
      *   *Morning Self:* Prefers 10 (later) over 3 (now).
      *   *Afternoon Self:* Prefers 2 (now) over 10 (later). (Present Bias).
  *   **The Three Instructions:**
      1.  **Player 1 (The Drifter):** "Decide only for the moment you are in. Do not think about Morning or Afternoon. Just maximize what you want *now*." (Naive).
      2.  **Player 2 (The Planner):** "Look ahead. Predict what your Afternoon Self will do. Choose the Morning option that leads to the best final result based on that prediction." (Sophisticated).
      3.  **Player 3 (The Resolver):** "Make a plan in the Morning. You must stick to it in the Afternoon, even if you want to change your mind. If you have to, ignore your Afternoon desire." (Resolute).
  *   **Action:** Run Player 1. (Chooses Plan B Morning. Chooses Take 2 Afternoon. Gets 1).
  *   **Action:** Run Player 2. (Predicts Afternoon failure. Chooses Plan A Morning. Gets 3).
  *   **Action:** Run Player 3. (Chooses Plan B Morning. Forces Take 10 Afternoon. Gets 10).
  *   **Whiteboard III:** Record scores: *Drifter: 1. Planner: 3. Resolver: 10.*

  ### 01:15 – 01:30 | Debrief & Labeling
  *   **Reveal:** Now you may use the philosophy words.
  *   **Map the Games:**
      *   Game I = **The Cycle Pump** (Intransitivity).
      *   Game II = **The Sorites/Indifference Pump** (Vagueness).
      *   Game III = **Dynamic Choice** (Diachronic Consistency).
  *   **Discuss the User's Worries:**
      *   *The Ceiling:* In Game I & II, could the Trader have taken *all* the chocolate? (No, limited by the number of cards/steps).
      *   *The Procedure:* In Game III, who won? (Resolver). But ask: "What if the rules changed in the Afternoon? What if the 'Take 10' option disappeared?" (Then Resolver loses everything, Planner survives).
      *   *The Walk Away:* Note that Player 2 (Planner) effectively chose to walk away from the risky path entirely.

  ---

  ## 3. Debrief Guide: Mapping Moments to Distinctions

  Use this script to guide the final 15 minutes. Do not lecture; ask the questions and let them answer, then supply the label.

  **1. On the Cycle (Game I)**
  *   *Ask:* "In Game I, the Agent lost chocolate. Was there a limit to how much they could lose?"
  *   *Point:* They could only lose as much as there are items in the circle. If there are 3 items, you can only be pumped 3 times before you are back at the start.
  *   *The Label:* **Intransitive Preferences.**
  *   *The Worry:* "Does this prove you are irrational? Or just that you are vulnerable to a specific, bounded scam?" (Let them sit with the idea that a small loss might not equal 'madness').

  **2. On the Chain (Game II)**
  *   *Ask:* "In Game II, did the Agent ever want to swap? Or did they just not care?"
  *   *Point:* The loss came from *indifference*, not desire. You paid to stay still.
  *   *The Label:* **Non-Transitive Indifference (Sorites).**
  *   *The Distinction:* Unlike the Cycle, this relies on the idea that 'small differences don't matter' accumulating into a 'big difference that does.'

  **3. On the Temporal (Game III)**
  *   *Ask:* "Player 3 (Resolver) won the most chocolate. Does that mean they are the most rational?"
  *   *Point:* Player 3 had to ignore their own desires in the Afternoon. Is that rationality, or is it stubbornness?
  *   *Point:* Player 2 (Planner) got less than Player 3, but they didn't have to fight themselves.
  *   *The Label:* **Naive vs. Sophisticated vs. Resolute Choice.**
  *   *The Crucial Insight:* "Player 3 only wins if the world lets them bind their hands. If the 'Take 10' option vanishes in the Afternoon, Player 3 gets 0. Player 2 gets 3. So 'Rationality' depends on the rules of the game, not just the mind of the agent."

  ---

  ## 4. Troubleshooting: What Will Go Wrong

  You predicted disruptions. Here is how to handle them without breaking the flow.

  **1. "I spot the pattern and refuse to trade." (The Stubborn Agent)**
  *   *Risk:* In Game I or II, the Agent realizes they are being pumped and stops trading.
  *   *Fix:* This is actually data. Stop the game. Ask the group: "If they stop, they avoid the loss. Why didn't they stop?"
  *   *Script:* "In the real world, we often don't see the cycle until we are halfway round. For this experiment, please assume you cannot see the whole board, only the card in front of you."

  **2. "I don't care about the chocolate." (The Nihilist)**
  *   *Risk:* A participant says the stakes are too low to influence their preference.
  *   *Fix:* Acknowledge it, but enforce the role.
  *   *Script:* "That is a valid philosophical point. But for this game, the slip in your hand *defines* your caring. You are role-playing a mind that cares. Please honor the script."

  **3. "This is a game to win against you." (The Adversary)**
  *   *Risk:* A participant tries to 'break' the game logic rather than play the decision.
  *   *Fix:* Recruit them.
  *   *Script:* "You are right, it is a game. But the opponent isn't me, it's the structure. If you can find a move that beats the structure without breaking the rules, I want to see it. Show us."

  **4. "You changed the rules!" (The Accusation of Cheating)**
  *   *Risk:* In Game III, if the 'Penalty' for inconsistency feels arbitrary.
  *   *Fix:* Make the penalty physical and public.
  *   *Script:* "The penalty is not me cheating; it is the cost of a broken promise. If you tell your future self you will do X, and then do Y, there is a mental cost. We are representing that cost with 1 chocolate."

  **5. Numeracy Anxiety**
  *   *Risk:* Participants get confused by the counting.
  *   *Fix:* Use the physical chocolate. Do not do math on the board. Move piles from "Player" to "Bank" visibly.
  *   *Script:* "Don't calculate. Just look at the pile. Is it bigger or smaller?"

  ---

  ## 5. The Honest Section: Limitations of the Library Room

  *Read this verbatim or in your own words during the final 5 minutes. It addresses your worry about "genuine diachronic agency."*

  "We need to be honest about what we just did. This was a simulation.
  1.  **Time:** Real temporal inconsistency happens over days, weeks, or years. It involves fatigue, hunger, and changing emotions. We compressed 'Tomorrow' into 'Five Minutes from Now.' You did not feel the actual temptation of waiting, because the wait was imaginary.
  2.  **Stakes:** You risked chocolate, not your health, savings, or relationships. Real irrationality hurts more than losing a sweet.
  3.  **Identity:** In Game III, Player 1 and Player 2 were the same person. In reality, your 'Future Self' is a stranger to you. You cannot force them to obey.
  4.  **The Exit:** In Game III, the 'Resolute' player won. But in real life, the only way to be truly Resolute is often to **walk away from the game entirely**. If the choice is between 'Eat the Cake' and 'Don't Eat the Cake,' the rational move is sometimes to not be in the room with the cake. We didn't allow that option today.

  We did not prove what is 'Rational.' We proved that different structures extract different costs. The Cycle extracts a small fee. The Temporal trap extracts your future agency. Your job, when you leave this room, is to notice which game you are playing in your own life."

