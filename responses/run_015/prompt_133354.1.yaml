  ## 6. Facilitator's Cheat Sheet (For Your Pocket)

  *   **If Game I goes too fast:** Add a "Transaction Cost." Every trade costs 1 chocolate *even if they don't swap*. This emphasizes the "ceiling" worry—you can't be pumped infinitely because you run out of fees to pay.
  *   **If Game III is confusing:** Simplify the tree.
      *   Morning: Left (3) or Right (Go to Afternoon).
      *   Afternoon: Up (10) or Down (2).
      *   Preference: Morning wants 10. Afternoon wants 2.
  *   **If the Group gets quiet:** Ask the retired judge: "In your experience, do people make contracts (Resolute) or do they adapt to circumstances (Naive)?"
  *   **If the Group gets loud:** Remind them: "The Operator is not the villain. The Operator is just the mirror."

  **Final Note to You:**
  You mentioned worrying that the Cycle Argument doesn't establish irrationality, only vulnerability. This session is designed to validate that worry. By capping the rounds in Game I, you force them to see the "Ceiling." By contrasting it with Game III, you show that the *Temporal* argument is the one that threatens agency, not just wallet. Trust the design. Let them feel the loss.
