      *   **Context:** A philosophy-of-history reading group has been stuck for a year on the Browning vs. Goldhagen debate regarding Reserve Police Battalion 101 (RPB 101).
      *   **The Debate:** Browning (*Ordinary Men*) argues situational forces (peer pressure, obedience to authority) caused ordinary Germans to commit atrocities. Goldhagen (*Hitler's Willing Executioners*) argues a specific "eliminationist antisemitism" inherent in German culture was the primary driver.
      *   **The Group's Impasse:** They agree on the facts (archival figures, suffering occurred) but disagree on interpretation.
      *   **The Split:** "Interventionists" (structural explanation dominates) vs. "Non-interventionists" (situational accounts dilute individual responsibility).
