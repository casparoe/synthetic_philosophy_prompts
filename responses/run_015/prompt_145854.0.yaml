          *   Browning: Agency as a distributed system (peer norms as control parameters).
          *   Goldhagen: Agency as a classical belief-desire engine (social pressure masks, doesn't override).
      *   **The Question:** Is the stalemate a clash over explanatory priority, a bedrock intuition about character/situation, or a disguised normative dispute about exculpation? Can formal models or social psychology move it, or is it permanently incommensurable?

  2.  **Deconstruct the Philosophical Core:**
      *   The user has already done a sophisticated analysis. They recognize this isn't about *more data* but about *how data maps to causality and responsibility*.
