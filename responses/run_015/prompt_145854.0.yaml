          *   *Philosophical Reframing:* Distinguish between *causal explanation* and *moral justification*. This is the crucial move. Explain that situational factors explain the *frequency* of the act, not the *permissibility*.
      *   *Address Incommensurability:* It's not permanently incommensurable, but it requires a meta-ethical shift. They need to agree on the *purpose* of the history. Is it to assign blame (legal/moral) or to prevent recurrence (sociological)?
