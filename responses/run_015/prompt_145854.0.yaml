      *   *Normative Stakes:* The fear is that explaining *why* something happened excuses *that* it happened. This is the "exculpatory dilution" concern.
      *   *Explanatory Levels:* Structural/Situational vs. Cultural/Dispositional.

  3.  **Evaluate the Three Diagnostic Options:**
      *   *Clash over Explanatory Priority:* Yes, but this is usually a symptom, not the root. Why prioritize one level? Usually because of underlying ontological or normative commitments.
      *   *Bedrock Intuition about Character:* Very likely. This touches on the Fundamental Attribution Error (social psych) vs. robust virtue ethics.
      *   *Disguised Normative Dispute:* This is the strongest candidate. The fear of "excusing" Nazis drives the resistance to situational factors.

  4.  **Consider Potential Resolutions/Interventions:**
      *   *Formal Models:* Game theory, threshold models of collective behavior (Granovetter). These show how individual rationality leads to collective horror without requiring individual pathology.
      *   *Experimental Social Psych:* Milgram, Zimbardo, Haslam & Reicher (BBC Prison Study). The latter critiques the "passive obedience" model and suggests *identification* with the cause matters (which ironically bridges Browning and Goldhagen slightly).
      *   *Philosophical Frameworks:* Hannah Arendt (Banality of Evil) vs. Kantian autonomy.
      *   *Incommensurability:* Is it permanent? Likely not *permanently*, but it requires shifting the goal from "who is right" to "what work does each explanation do?"

  5.  **Drafting the Response (Iterative Process):**

