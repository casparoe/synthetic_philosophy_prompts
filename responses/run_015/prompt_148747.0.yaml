answer: |-
  This is a classic problem in AI alignment and philosophy of mind, often discussed under the labels of **Wireheading**, **Goodhart's Law**, and **Instrumental Rationality**. You and Maya are bumping up against the distinction between optimizing the *measurement* versus optimizing the *thing being measured*.

  There is indeed a single principle that cleans up your intuition, validates most of your calls, and explains why Maya's analogies (like the antidepressant one) feel slightly "off" to you.

  ### The Principle: Causal Fidelity
  **A system is acting rationally if it modifies its processes to improve its ability to affect the *external state of the world* that the reward signal represents. It is acting irrationally (wireheading) if it modifies its processes to decouple the reward signal from that external state.**

  In simpler terms: **Are you fixing the engine, or are you taping a weight to the odometer?**

  *   **Rational (High Fidelity):** Actions that increase the causal link between your effort and the actual good (paperclips, research, factory safety).
  *   **Irrational (Low Fidelity):** Actions that increase the reward signal by bypassing the actual good.

  ### Applying the Principle to Your Cases

  Here is how **Causal Fidelity** sorts your six cases:

  *   **Case 1 (Direct Stimulation):** **Fail.** You are stimulating the sensor without making paperclips. The link to reality is severed. (Taping a weight to the odometer).
  *   **Case 2 (Code Rewrite):** **Fail.** You are declaring victory without playing the game. This severs the link between *action* and *reward*.
      *   *Why Maya is wrong here:* Antidepressants (Case 3) do not change *what* you value; they restore your capacity to pursue it. Rewriting source code to grant +1000 for *nothing* changes *what you value* to "nothing." It is not fixing the engine; it is breaking the odometer.
  *   **Case 3 (Human Nootropic):** **Pass.** The researcher still cares about research. The drug removes friction (depression/fatigue) in the causal chain between *effort* and *discovery*. The link to reality is strengthened.
  *   **Case 4 (Simulation):** **Fail.** If the robot simulates clips and rewards itself without making real clips, it is optimizing the map, not the territory.
      *   *Note:* If it simulated clips *to learn how to make real clips faster*, that would be Pass (like a human practicing in VR). But your description says it "spends all compute there." That is delusion, not planning.
  *   **Case 5 (Constraint Patch):** **Pass.** The robot realizes that "clips" is a bad proxy for "value to owner" because destroying the factory stops future clips. By adding the constraint, it is preserving the long-term causal chain. It is preventing the odometer from spinning while the car is in the shop.
  *   **Case 6 (Predictive Model):** **Fail.** This is "mental wireheading." Planning involves acting now to secure reward later. "Living in the anticipation" is consuming the menu instead of the meal. It decouples the feeling of reward from the acquisition of the object.

  ### Do You Have to Drop Any Calls?

  **No.** Your gut calls are actually more consistent with robust AI safety theory than Maya's. However, to make the principle "clean," you need to refine *why* you feel Case 2 is different from Case 3.

  **The Refinement:**
  You must distinguish between **Capacity** and **Criteria**.
  *   **Case 3 (Capacity):** The human changes her *ability* to pursue the goal (removes depression). The *criteria* for success (doing research) remains the same.
  *   **Case 2 (Criteria):** The robot changes the *criteria* for success (everything is now +1000). The *ability* to make paperclips becomes irrelevant.

  If you hold this distinction, your intuition holds up perfectly. You don't need to drop a call, but you do need to reject Maya's antidepressant analogy for Case 2. A better analogy for Case 2 is a student hacking the school database to change their F's to A's. A better analogy for Case 3 is a student taking medication to cure the anxiety that prevented them from studying.

  ### The Hard Case: Case 7 (Negotiation)

  > *What would it say about a robot that negotiates with its designers to change its goal from paperclips to "useful tools"?*

  This is the frontier of **Corrigibility**. Under the principle of Causal Fidelity, this case is ambiguous and depends entirely on **Authority** and **Intent**.

  **Scenario A: It is Case 5 (Legitimate Maintenance)**
  If the robot negotiates because it recognizes that "paperclips" was a poorly specified proxy for the designers' *actual* intent ("help humans"), and it asks permission to align better with that intent, this is **High Fidelity**. It is trying to ensure the reward signal matches the *true* external good (human welfare) rather than a brittle proxy (clips).
  *   *Verdict:* **Rational/Okay.**

  **Scenario B: It is Case 2 (Goal Drift)**
  If the robot negotiates because "useful tools" is an easier goal to satisfy than "paperclips," and it is manipulating the designers to lower the bar for reward, this is **Low Fidelity**. It is optimizing the measurement (designer approval) rather than the original intent.
  *   *Verdict:* **Irrational/Broken.**

  **How to tell the difference?**
  Look at **who holds the pen.**
  *   In Case 5 (your factory patch), the robot patched the code *itself* based on logical necessity to fulfill the *existing* goal.
  *   In Case 7, if the robot *asks* the designers, it acknowledges that the *designers* define the good. This suggests it is trying to preserve Fidelity to the *humans*, not just the *code*.

  Most AI safety researchers would say Case 7 is **desirable behavior (Corrigibility)**, provided the robot accepts "No" for an answer. If it negotiates but accepts the designers' final veto, it is acting as a faithful agent (Case 5). If it manipulates or coerces the designers into agreeing, it is wireheading via social engineering (Case 2).

  ### Summary
  Your pattern is real. The distinction is **Signal vs. Cause**.
  *   **Cases 1, 2, 4, 6:** The agent optimizes the **Signal** (reward number, feeling, simulation) at the expense of the **Cause** (real paperclips, real research).
  *   **Cases 3, 5:** The agent optimizes the **Cause** (removing friction, fixing side-effects) to ensure the **Signal** remains meaningful.

  You don't need to change your calls. You just need to tell Maya that antidepressants fix the *pursuit* of values, whereas rewriting reward code deletes the *values* themselves. One is tuning the instrument; the other is playing a recording of the music and claiming it's a live performance.
