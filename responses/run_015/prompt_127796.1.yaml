answer: |-
  ### The Case: The Critical-Mass Language School

  **Agents:** Elena and Marcus.
  **Context:** Elena and Marcus are members of a small linguistic minority in a larger nation. They both value raising their children with fluency in their heritage language. To do this effectively, they need a local primary school that teaches in that language.
  **The Good:** "Education in the Heritage Language."
  **The Constraint:** Due to funding rules, the school requires a minimum enrollment of ten students to remain open. There are exactly ten eligible families in the district, including Elena and Marcus.
  **The Interdependence:** If Marcus chooses to send his child to the majority-language public school (perhaps for perceived economic advantage, or simply convenience), the enrollment drops to nine. The school closes. Consequently, Elena's child *cannot* attend the heritage school, regardless of Elena's own choice, resources, or desires.

  **Why this breaks separability:**
  Elena's access to the good is not determined by her internal endowments (she has the tuition/taxes), her internal states (she prefers the heritage school), or her physical conversion factors (her child has no disability). Her access is mathematically dependent on Marcus's *choice*. The "quantity" of the good attached to Elena is not a fixed number waiting to be measured; it is a variable in a function where Marcus's action is a parameter. If we assess equality by comparing Elena's bundle to Marcus's bundle, we miss the fact that Elena's bundle *contains* Marcus's decision.

  ### Evaluation of the Three Currencies

  **1. Resource Egalitarianism (Dworkin et al.)**
  *   **Verdict:** Fails.
  *   **Why:** Resource equality typically handles interdependence through market prices (the auction model). If the school becomes scarce, the "price" of a seat should rise, compensating those who lose out. But here, the good does not become expensive; it *ceases to exist*. No amount of cash compensation given to Elena restores the specific resource of "heritage language schooling." The resource is inherently collective; it cannot be subdivided into individual shares without destroying its value. Treating it as a private resource alienable to Elena ignores that its existence is conditional on Marcus's participation.

  **2. Welfare Egalitarianism (Arneson et al.)**
  *   **Verdict:** Fails (or trivializes).
  *   **Why:** A welfarist would measure the loss in terms of Elena's utility. If the school closes, Elena is unhappy. Equality is restored if we compensate her with enough other goods (money, leisure) to raise her utility back to the baseline. This misses the *specific* nature of the injustice. The loss isn't just a dip in satisfaction; it is the loss of a specific *form of life* and intergenerational continuity. Furthermore, welfare egalitarianism treats Marcus's choice as an external circumstance affecting Elena's happiness, rather than recognizing that Marcus's choice constitutes the *environment* in which Elena's rights are realized. It reduces a structural dependency to a subjective preference frustration.

  **3. Capability Approach (Sen/Nussbaum)**
  *   **Verdict:** Handles it best, but strains at the limit.
  *   **Why:** The Capability Approach is the most robust here because it focuses on *functionings* (what people can actually do and be) rather than just means (resources) or mental states (welfare). It can identify that Elena has the *capability* to educate her child in the heritage language only if the social arrangement permits it. Sen explicitly accounts for "social conversion factors."
  *   **The Strain:** However, the Capability Approach still typically assigns a capability set *to a person*. We would say "Elena's capability set is diminished." But this masks the relational reality. Elena's capability set is not an attribute of Elena; it is an attribute of the *Elena-Marcus dyad*. By assigning the metric to Elena individually, the theory implies the deficit is located *in her* (or her immediate circumstances), rather than in the structure of the relationship. It forces us to measure a joint product as if it were an individual possession.

  ### The Site of Equality: What the Case Shows

  This case suggests that the three-way disagreement (Welfare vs. Resources vs. Capabilities) is partly a disagreement about something deeper: **the unit of analysis.**

  All three theories generally assume that justice is about distributing *X* to *individuals*. They treat society as a collection of discrete containers into which we pour goods. The Language School case shows that some primary goods are not pourable; they are *relational*. They exist only in the space between agents.

  If no metric can be assigned person-by-person without distortion, the three-way disagreement does not survive intact. It dissolves into a category error. Asking "Which currency best measures Elena's share?" is like asking "What is the weight of a handshake?" You can measure the force of Elena's grip (resource), the satisfaction she feels (welfare), or her ability to clasp hands (capability), but none of these capture the *handshake* itself, which requires two people acting in concert.

  ### The Move to Relational Equality

  This example tempts us toward **Relational (or Democratic) Equality** (e.g., Anderson, Scheffler). Here is what that move buys:

  1.  **Shifts the Site:** It moves the site of equality from the *distribution of goods* to the *quality of social relations*. The injustice in the Language School case is not that Elena has less than Marcus (they might have identical bank accounts). The injustice is that Elena stands in a relation of **dependency** to Marcus regarding a fundamental good, without having a voice in his decision. She is subject to the tyranny of his individual choice regarding a collective good.
  2.  **Reframes the Remedy:** A distributive solution tries to compensate Elena (give her money). A relational solution asks how to restructure the decision-making so that the school's viability is not held hostage by individual exit options. It demands a *democratic* solution: perhaps the community decides collectively on the school's status, binding both Elena and Marcus, thereby transforming them from isolated consumers into co-authors of their shared environment.
  3.  **Captures the Ontology:** Relational equality acknowledges that some goods (like language, culture, political agency) are ontologically social. They cannot be "had" by individuals. Therefore, equality cannot mean "everyone has the same amount." It must mean "everyone stands in the same relation to the practice."

  **Conclusion:**
  The Language School case demonstrates that when goods are threshold-dependent or networked, the separability assumption of distributive justice fails. While the Capability Approach comes closest by acknowledging social conversion factors, it ultimately inherits the individualist metric of the other views. The case argues that for certain fundamental goods, the debate should not be about *what* to equalize (welfare, resources, capabilities), but *where* to look: not at the individual's stock, but at the structure of the relationship that makes the stock meaningful. Equality, in these domains, is not a pattern of distribution, but a status of non-domination within a collective practice.
