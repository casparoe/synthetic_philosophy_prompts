          *   Define *Overdetermination (Redundancy)*: The mental pushes, but the physical pushed hard enough already.
      *   **Addressing the "Why is Redundancy Bad?" Question:** This is crucial.
          *   Analogy time. Maybe a car engine? Or a light switch?
          *   *Idea:* If I flip a switch and the light turns on, but the wiring was already rigged to turn on anyway, did *my flip* cause it? In a sense, yes. But if *every* action is like this, my agency is an illusion.
          *   *Key Point:* If the physical cause is sufficient, the mental cause isn't *needed*. If it's not needed, why does it exist? Evolutionarily, why keep it?
      *   **The "Line" and Why It Matters:**
          *   The line is between "Causal Power" (Can I make a difference?) and "Causal Necessity" (Was I required for the difference?).
