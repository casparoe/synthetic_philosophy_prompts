answer: |-
  You have hit upon one of the most persistent and difficult problems in the philosophy of mind. It is often called the **Causal Exclusion Argument**, and your intuition is spot on: the distinction between "causing nothing" and "being redundant" is the exact pivot point where the debate turns.

  It is completely understandable that this feels like going in circles. The argument is designed to squeeze the mind out of the picture, and it does so by exploiting the distinction you noticed.

  Here is an intuitive breakdown of what the argument establishes, the difference between exclusion and redundancy, and why redundancy is actually just as dangerous to our sense of self as total exclusion.

  ### 1. The Setup: The Closed Shop
  First, let's solidify the premise that started your dinner conversation: **The Causal Closure of the Physical.**

  Imagine the physical world is a closed shop. No goods come in, and no goods go out. Every event inside the shop (a neuron firing, a muscle contracting, an arm rising) is fully accounted for by other events inside the shop (previous neural states, chemical reactions).

  If you raise your arm to stretch, physics and neurobiology can trace a complete chain of cause-and-effect back in time that explains that movement without ever needing to mention "desire" or "intent." The physical story is complete.

  ### 2. The Fork in the Road: Exclusion vs. Overdetermination
  This is where your question comes in. If the physical story is complete, what room is left for the mental story (your desire to stretch)?

  There are logically only two options:

  **Option A: Causal Exclusion (The Ghost)**
  Your desire exists, but it has **no causal power**. It is like a shadow cast by a walking person. The shadow moves when the person moves, but the shadow does not *make* the person move. In this scenario, your desire is an **epiphenomenon**. It is real, but it is causally inert. You didn't raise your arm *because* you wanted to; you raised your arm because of neurons, and you *also* happened to have a desire at the same time.

  **Option B: Causal Overdetermination (The Redundancy)**
  Your desire **does** have causal power, but it is working alongside the physical cause. Think of two assassins shooting a target at the exact same moment. Either bullet alone would have killed the target. The death is "overdetermined." In this scenario, your desire *did* cause the arm to rise, but the neurons *also* caused it. The effect would have happened anyway, but the mental cause was still a genuine cause.

  You asked: *Does the argument show the mental causes nothing (A), or that it is redundant (B)?*

  Strictly speaking, the argument is designed to force us into **Option A**. However, many people try to retreat to **Option B** to save the mind. They say, "Okay, the physical cause is sufficient, but let's just say the mental cause is also there, just in case."

  ### 3. Why Redundancy (Option B) is a Trap
  This is the crux of your second question: *If the mental is merely redundant, why is that a threat?*

  If your desire is a genuine cause, even if redundant, isn't that enough to save your agency? Philosophers generally say **no**, for two intuitive reasons.

  **The "Coincidence" Problem**
  Overdetermination is usually rare. It is a weird accident when two assassins shoot at the exact same microsecond. But if Option B is true, this "accident" happens **every single time** you do anything. Every time you blink, walk, or speak, a mental cause and a physical cause line up perfectly to produce the result.
  When a coincidence happens once, it's luck. When it happens systematically, billions of times a day, it demands an explanation. Why do the mental and physical tracks always run parallel? The simplest explanation is that they aren't two tracks at all. If they are distinct, the perfect correlation is miraculous.

  **The "Explanatory Idleness" Problem**
  This is the deeper threat. If the physical cause is *sufficient* to bring about the arm raising, then the mental cause is **not necessary**.
  Imagine you are watching a movie. You see a character pull a trigger, and the gun fires. Then you learn that the gun was rigged with a remote control that would have fired it at that exact moment anyway.
  Did the character's pull cause the shot? Technically, yes. But did it *make a difference*? No.
  If your mental states are redundant, they are **explanatorily useless**. When scientists ask, "Why did the arm rise?", the answer "Because of neural state N" is complete. Adding "And because he wanted to stretch" adds no new information. It is a "free rider."
  If your desires make no difference to what happens in the world—if the world would unfold exactly the same way without them—then your sense of **agency** is an illusion. You feel like you are driving the car, but you are actually just sitting in the passenger seat turning a steering wheel that isn't connected to the wheels.

  ### 4. Where the Line Falls
  You asked where the line falls between "excluded from causation" and "merely redundant."

  *   **Excluded:** The mental state has **zero** causal power. (The shadow analogy).
  *   **Redundant:** The mental state has causal power, but **zero causal necessity**. (The two assassins analogy).

  **Why drawing this line is consequential:**
  If you accept **Exclusion**, you are an *Epiphenomenalist*. You believe your thoughts are real but powerless. This is deeply counterintuitive (it feels like my pain makes me cry), but it is logically consistent.

  If you accept **Redundancy**, you are trying to save the power of the mind, but you end up with the same practical result: **The physical world runs the show.** The mental state becomes a "ghost in the machine" that pushes buttons, but the machine was already programmed to press those buttons itself.

  The threat to someone who believes mental states are real is that **Redundancy collapses into Exclusion.** If the physical cause is sufficient, the mental cause is doing no work. If it does no work, evolution shouldn't have selected for it. If it wasn't selected for, why is it there? Eventually, you are forced to admit that if it does no work, it might as well not be there.

  ### 5. Is There a Way Out?
  Since this conclusion (that our minds don't really do anything) is so hard to swallow, philosophers usually try to break the argument at the start. The most common solution is to reject the idea that the mental and physical are **distinct** things competing for causal power.

  This is the **Identity Theory**.
  Think of water and H₂O. They aren't two different things that correlate; they are the *same thing* described differently.
  If your "desire to stretch" is *identical* to a specific "brain state," then there aren't two causes (one mental, one physical). There is only **one cause** that is both mental and physical.
  *   The physical story is complete? Yes.
  *   Did the mental cause it? Yes, because the mental *is* the physical.

  This avoids redundancy because there is no second cause to be redundant. It avoids exclusion because the mental state inherits the causal power of the physical state by being the same thing.

  ### Summary
  To answer your specific questions directly:

  1.  **What does the argument establish?** It aims to establish that mental states cause **nothing** (Exclusion). However, it allows for the loophole of Redundancy (Overdetermination).
  2.  **Where is the line?** The line is between having *no power* vs. having *unnecessary power*.
  3.  **Why is Redundancy a threat?** Because if your mental states are unnecessary for physical events, they are **causally otiose** (superfluous). They become "free riders" that make no difference to the world. This undermines the reality of your agency just as much as total exclusion does. If the world would unfold exactly the same without your thoughts, your thoughts are effectively powerless.

  The reason this nags at you is that it challenges the fundamental human experience: that we are authors of our actions. The argument suggests that if physics is true, we are merely witnesses to our actions. The only way to save the authorship is to argue that the "author" (mind) and the "pen" (brain) are not two separate things, but one and the same.
