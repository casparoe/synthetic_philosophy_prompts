  Your friend is technically correct that a pressing probability of 1/100 is not a Nash equilibrium, but she is mistaken to insist that the solution must be one. In standard non-cooperative game theory, players treat others' strategies as fixed; the symmetric mixed-strategy Nash equilibrium here actually requires a much higher pressing probability (approximately 1/21) to make individuals indifferent between pressing and not pressing, resulting in an expected value of roughly zero. However, Hofstadter's Platonia dilemma specifically relies on superrationality, where players recognise that their reasoning is mirrored by others. This allows them to coordinate on a probability that maximises the group's expected utility rather than satisfying the Nash indifference condition.

  Regarding the probability, your calculation ignores the cost of collision. Without a fine, the superrational optimal probability is indeed $1/N$ (1/100) to maximise the chance of exactly one success. With a £10,000 fine, the expected utility function becomes $EU(p) = p [ 1,010,000 (1-p)^{99} - 10,000 ]$. Maximising this requires balancing the prize against the penalty, which mathematically necessitates a probability strictly lower than 1/100 (approximately 1/101) to avoid the expected loss from multiple presses. Therefore, while your approach to the dilemma is the intended one, the fine does change the odds, and your friend's objection regarding Nash equilibrium is irrelevant to the superrational solution.
