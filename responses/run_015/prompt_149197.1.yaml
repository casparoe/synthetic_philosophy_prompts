      *   *Silence:* The theory doesn't fully address the *political/epistemic economy* of comprehension. Who gets to decide? The DeepMind team controlled the narrative. Also, the "delegator" point: If I use AlphaGo, do I need to understand Go to trust it? No. I need to understand *AlphaGo's reliability*. This shifts the burden of comprehension from the domain to the tool.

