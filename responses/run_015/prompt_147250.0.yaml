answer: |-
  The blurb is a hostile caricature that conflates causal interaction with justificatory representation, misidentifying Rorty's pragmatic deflationism as a self-defeating metaphysical nihilism.

  **Audit of Claims**

  *   **Language hooks only onto language:** **Deny.** Rorty denies language *represents* the world (mirroring), but explicitly affirms the world *causes* us to have beliefs. He distinguishes causation (world → belief) from justification (belief → belief). For your modelling work, Rorty would say the world causally forces your model to fail (resistance), but the *reason* the model is wrong is justified only within the linguistic practices of your colleagues.
  *   **Truth is current consensus:** **Simplification.** Rorty is a deflationist about truth (no metaphysical essence), but he defines truth as what survives free and open encounter, not merely whatever power structures currently permit. He distinguishes "solidarity" (agreement with our peers) from "objectivity" (agreement with Reality), preferring the former without reducing it to immediate majority rule.
  *   **No fact of the matter:** **Deny (with nuance).** Rorty argues "facts" are linguistic entities made true by sentences, not mind-independent truth-makers. He wants to discard the vocabulary of "facts of the matter" as unhelpful for inquiry, not deny that something exists independently of us that constrains our actions.
  *   **No standpoint for cross-cultural criticism:** **Deny.** Rorty endorses "ethnocentrism," which admits we must judge from within our own contingent vocabulary, but this is not relativism. Relativism claims all cultures are equally valid from a neutral standpoint (which Rorty denies exists); ethnocentrism claims we should persuade others to join our practices because we find them better, not because they are objectively True.
  *   **Science is just one more genre with no epistemic authority:** **Accept (with nuance).** He denies science has *metaphysical* authority (access to Reality's structure), but grants it immense *practical* authority for prediction and control. Science is a literature of coping, not mirroring.
  *   **Inquiry converges on nothing:** **Simplification.** Inquiry does not converge on *The Truth*, but it does converge on shared vocabularies and practices that successfully cope with the environment.
  *   **Self-refutation:** **Deny.** Rorty avoids this by treating his own philosophical claims as recommendations for vocabulary rather than assertions of fact. He is not claiming "it is a fact that no statement represents reality"; he is suggesting we stop using the vocabulary of representation.

  **Specific Philosophical Commitments**

  *   **Fact of the Matter:** He is not committed to there being no reality, only to there being no *description-independent* facts that serve as justification.
  *   **Deflationism:** Yes, his view is a variant of pragmatic deflationism; "true" is a compliment paid to beliefs that prove useful, not a property corresponding to reality.
  *   **Cause vs. Justify:** He denies the world *justifies* beliefs (only other beliefs do that) but emphatically accepts that the world *causes* beliefs. This is the crucial correction for your modelling intuition: the virus causes the model failure, but the scientific community justifies the revision.
  *   **Ethnocentrism vs. Relativism:** His ethnocentrism is not relativism renamed; it is an admission of situatedness that permits vigorous criticism of other cultures based on the goals of reducing cruelty and expanding solidarity, without appealing to ahistorical standards.

  **Survival of Conclusions**

  *   **Criticizing another culture:** A Rortyan can criticize another culture, but only by appealing to shared goals or attempting to expand their own vocabulary to include the critics, not by invoking universal rationality.
  *   **One inquiry better than another:** A Rortyan can say one inquiry went better, measured by whether it achieved its intended goals (e.g., accurate prediction, reduced suffering), not by whether it matched the world's intrinsic structure.

  **Critics' Establishments**

  *   **Self-Refutation:** Critics have not established this; Rorty's pragmatic redescriptions successfully evade the formal contradiction, though opponents find them evasive.
  *   **Cause/Justify Distinction:** Critics like Hilary Putnam have established a substantive challenge here, arguing that you cannot coherently separate causal impact from conceptual content; if the world causes a belief, it must already be conceptualized enough to play a role in justification. This is a stronger objection than the blurb's self-refutation charge, as it targets the coherence of Rorty's central distinction rather than his rhetorical posture.
