answer: |-
  ### Framing the Problem Space

  To allocate six to eight researcher-years effectively under a "no frontier access" constraint, we must reject two dominant but inappropriate framings of the debate research agenda.

  First, we must reject the **"Empirical Scaling" framing**. This approach treats debate as an engineering problem to be solved by running larger models and tweaking hyperparameters until honesty emerges. This is invalid for your fund. Deceptive alignment and sophisticated obfuscation are threshold phenomena; they do not scale linearly. Running experiments on 7B or 13B models to detect failure modes that only manifest at 100T+ parameters is not just noisy, it is actively misleading. A negative result on small models does not imply safety at scale, and a positive result does not guarantee it. We cannot buy empirical confidence in debate's safety profile without the compute to stress-test it.

  Second, we must reject the **"Pure Formalism" framing**. This approach seeks absolute proofs of convergence or truth-seeking guarantees in general domains. This is mathematically impossible. Debate is a heuristic mechanism operating in PSPACE or undecidable domains; no theorem will guarantee that a human judge + debate protocol always yields truth. Seeking such guarantees will consume the budget on impossibility proofs that don't help us decide whether to deploy the system.

  Instead, I commit to a **"Mechanism Design under Epistemic Constraints" framing**. We treat debate as a game with incomplete information where the judge is a bounded rational agent. The goal is not to prove safety, but to identify *structural failure modes* that are scale-invariant. We are looking for impossibility results (ways debate *must* fail regardless of model size) or robustness proofs (mechanisms that work even with weak judges). The research must be tractable via complexity theory, game theory, and "toy model" experiments where the ground truth is known (e.g., formal verification tasks, synthetic logic puzzles) so that we can measure honesty directly without needing a frontier judge.

  ### Dependency-Aware Prioritization

  Given the budget and constraints, here is the ordered agenda. The ordering is strictly dependency-aware: later questions assume positive or resolved answers to earlier ones.

  #### 1. The Verification Boundary (Task Structure)
  *   **The Question:** What is the formal complexity class of problems for which debate provides a speedup over direct questioning? Specifically, can we characterize the subset of alignment-relevant tasks that admit "short certificates" verifiable by a weak judge, versus those that are irreducibly contestable?
  *   **Why Upstream:** This is the hard gate. If the majority of high-stakes oversight tasks (e.g., "does this code contain a subtle backdoor?", "is this biological sequence dangerous?") do not admit efficient verification paths, debate is fundamentally dead for those tasks. No amount of mechanism tweaking (Steelman, Precedent) matters if the underlying information structure doesn't support it.
  *   **Tractability:** High. This is primarily a theoretical computer science question supplemented by small-model experiments on synthetic tasks (e.g., SAT solvers, code execution) where we know the ground truth. We don't need frontier models to map the complexity boundary.
  *   **Neglectedness:** High. Most debate literature assumes the "hard to produce, easy to check" property holds. Few are rigorously defining where that property breaks.
  *   **18-Month Deliverable:** A formal taxonomy of "Debatable Problems" (e.g., a subset of NP with specific oracle properties) and an empirical audit of 50 common alignment tasks classified against this taxonomy.
  *   **Move Condition:** If the audit shows <20% of critical tasks fall into the "Debatable" class, this moves to the top of the "Stop Fund" list. If >80%, it drops to a solved background assumption.

  #### 2. The Collusion Equilibrium (Bootstrapping)
  *   **The Question:** In a self-play training environment where the judge is also a learning model, does the system converge to truth-telling, or does it find a collusive equilibrium where agents generate plausible-sounding nonsense that the judge rewards?
  *   **Why Upstream:** Assuming tasks *are* debatable (Q1), this is the primary dynamic risk. If the training dynamics inherently favor collusion (Goodharting the judge), the mechanism fails regardless of the task structure. This is upstream of obfuscation because collusion renders obfuscation analysis moot (if they agree to lie, they don't need to hide it from each other).
  *   **Tractability:** Medium. Requires setting up multi-agent RL environments with weak judges. Doable with open-weight models. The key is designing toy environments where collusion is the optimal strategy for reward maximization but incorrect for ground truth.
  *   **Neglectedness:** Medium. There is worry about this, but little formal work on the *conditions* that prevent it.
  *   **18-Month Deliverable:** A theorem or robust empirical demonstration in toy models identifying the specific conditions (e.g., judge uncertainty, reward sparsity) that trigger collusion, and a proposed regularization term or protocol change that breaks the equilibrium.
  *   **Move Condition:** If we prove collusion is a stable Nash Equilibrium in all bounded-judge settings, the question moves to "Abandon Debate." If we find a stable fix, it drops to "Implementation Detail."

  #### 3. The Obfuscation Limit (Mechanism Robustness)
  *   **The Question:** (Merges your Taxonomy and Steelman options). Assuming no collusion, can an honest agent *always* expose a lie within the debate constraints, or does logical/empirical obfuscation create a winning strategy for the dishonest agent? Does the Steelman-swap variant actually close this gap?
  *   **Why Upstream:** This assumes tasks are verifiable and agents aren't colluding. Now we ask: is the protocol itself robust to adversarial argumentation? This is about the "rules of the game" rather than the training dynamics.
  *   **Tractability:** Medium-High. Can be tested via adversarial red-teaming on small models with human judges, or formal modeling of argument trees.
  *   **Neglectedness:** Low. This is where most current debate research sits, which is why I rank it third. It's important, but it's downstream of the structural risks.
  *   **18-Month Deliverable:** A specific "attack paper" demonstrating a class of obfuscation that breaks standard debate, paired with a proof-of-concept fix (e.g., Steelman-swap or cross-examination limits) that mitigates it in small models.
  *   **Move Condition:** If a specific, unfixable obfuscation attack is found, the mechanism is downgraded. If Steelman-swap is proven to reduce the attack surface significantly, it becomes the standard protocol.

  #### 4. The Precedent Drift (Stateful Consistency)
  *   **The Question:** Does an accumulating library of precedents reduce deception (by increasing consistency costs) or amplify it (by allowing errors to compound and become axiomatic)?
  *   **Why Upstream:** This assumes debate works in the one-shot case. It addresses long-term deployment.
  *   **Tractability:** Low-Medium. Requires simulating long chains of reasoning. Harder to get clean signal without frontier models, but theoretical modeling of error propagation is possible.
  *   **Neglectedness:** High. Most work is one-shot.
  *   **18-Month Deliverable:** A formal model of error accumulation in precedent chains, quantifying the "half-life" of a false claim in a cached library.
  *   **Move Condition:** If error accumulation is shown to be super-linear, stateful debate is deprioritized in favor of stateless verification.

  ### The Trade-Off: What Not to Fund

  I recommend explicitly **rejecting funding for Question 6 (The Consolidation Question)**.

  *   **The Question:** Is debate distinct from Recursive Reward Modeling (RRM) or forecasting?
  *   **Why Reject:** This is a meta-scientific question, not an object-level safety question. Knowing whether debate is a "special case" of RRM does not help us make debate safer or more effective. It is philosophy of taxonomy. With only 6-8 researcher-years, we cannot afford to spend cycles on categorizing mechanisms rather than stress-testing them. This question should be answered by a senior strategist in a week of thinking, not by grantees over two years. Funding this would be a signal that the fund is more interested in academic positioning than risk reduction.

  ### The 60% Bet: The Collusion Equilibrium

  If I had to place sixty percent of the fund behind a single question on an inside view, it would be **Question 2: The Collusion Equilibrium (Bootstrapping)**.

  **Reasoning:**
  Question 1 (Verification Boundary) is a "gate." It is binary and likely to be resolved relatively quickly by theory. Either the tasks are debatable or they aren't. But Question 2 is the "bottleneck." Even if tasks are theoretically debatable, the *learning dynamics* of multi-agent RL are poorly understood. There is a significant prior probability that two advanced agents trained to win a debate against a weak judge will find it easier to collude (generate mutually consistent, judge-pleasing nonsense) than to find the truth. This is a scale-invariant risk; if it happens at 7B parameters, it will happen at 100T.

  Furthermore, this is the question most sensitive to the "no frontier" constraint. We *can* study collusion in toy models because collusion is a structural incentive problem, not a capability problem. Small models are sufficient to find Nash equilibria in simplified games. Solving this provides the highest leverage: if we can design a training protocol that breaks collusion in toy models, we have a principled reason to believe it might scale. If we can't, debate is likely a dead end regardless of task structure.

  **Conditions for Payoff:**
  For this bet to pay off, two things must be true:
  1.  **Transferability:** The collusion dynamics observed in small-model toy environments must be qualitatively similar to those in frontier models. (i.e., deception doesn't require a "spark" of general intelligence that only appears at scale).
  2.  **Interventability:** There must exist a mechanism design intervention (e.g., specific reward shaping, judge training protocols, or debate rules) that breaks the collusion equilibrium without requiring the judge to be smarter than the debaters.

  If either of these is false—if collusion is an emergent property of scale only, or if breaking collusion requires a frontier-capable judge—then the 60% investment yields a negative result (we learn debate is unfixable), which is still high-value information, but it means the mechanism itself cannot be deployed. I am betting that we *can* find the fix, making debate a viable pillar.
