  # Joint Statement of the Micro-Macro Working Group

  ## 1. Joint Commitments

  We, the undersigned parties, agree to the following claims regarding our simulation environment and the specific residential-segregation model under dispute:

  1.  **Micro-Definition:** The simulation state at any time $t$ is fully defined by the vector of individual agent attributes (location, preference threshold) and the interaction topology (neighborhood structure). No hidden global variables exist in the code.
  2.  **Emergence:** In the segregation model, global patterns (clusters, boundaries) emerge from local rules where agents relocate if their local minority status exceeds a threshold. These patterns are stable and measurable.
  3.  **Topology Sensitivity:** Swap tests confirm that holding individual rules fixed while changing interaction topology (e.g., grid vs. random graph) alters convergence speed and final pattern geometry without changing individual incentives.
  4.  **Path Dependence:** Replay tests confirm that perturbing a single agent's parameters early in a run can cascade to divergent macro-outcomes, whereas late perturbations often dampen.
  5.  **Test Limitations:** Our swap, replay, and ablation tests can establish functional dependencies within the model but cannot establish the ontological status of real-world social entities outside the simulation.
  6.  **Compression:** Macro-descriptions (e.g., "segregation index") compress micro-data. The losslessness of this compression varies by system phase; it is high in stable equilibria and low during transition periods.
  7.  **Update Mechanics:** No simulation step reads a global variable "M" to update an individual agent; all updates are local functions of neighbor states.

  ## 2. Disagreements Table

  | Disputed Claim | Micro-Only Camp Formulation | System-Level Camp Formulation | Judgment | Crux |
  | :--- | :--- | :--- | :--- | :--- |
  | **Causal Status** | Macro properties are epiphenomenal labels; they do no causal work. | Macro properties constrain micro behavior (e.g., housing availability); they do causal work. | Verbal (Code)<br>Substantive (Reality) | Definition of "cause" in constrained environments. |
  | **Explanatory Sufficiency** | Explanation requires deriving macro outcomes from micro rules + interactions. | Explanation requires identifying stable macro-constraints that govern behavior. | Verbal | Utility vs. Ontology of "explanation." |
  | **Predictive Sufficiency** | A micro-exact model is sufficient for prediction in principle. | A micro-exact model is insufficient in practice due to compute limits; macro is necessary. | Substantive | Bounded rationality and computational cost. |
  | **Downward Causation** | Impossible in this architecture; code does not allow global-to-local feedback. | Possible via effective constraints; local options are reduced by global structure. | Ill-posed | Confusion between code mechanics and effective dynamics. |

  ## 3. Adjudication Tests and Falsification Conditions

  For each substantive crux identified above, we agree to the following tests. Predictions are pre-registered.

  **Crux 1: Predictive Sufficiency under Constraints**
  *   **Test:** Train two predictors on simulation data. Model A uses full micro-state. Model B uses macro-summaries + noise. Measure error vs. compute cost.
  *   **Micro Prediction:** Model A will always outperform Model B given sufficient compute resources.
  *   **System Prediction:** Model B will outperform Model A under realistic compute budgets due to noise reduction.
  *   **Falsification (Micro):** Model B outperforms Model A even with unlimited micro-data access and compute.
  *   **Falsification (System):** Model A matches Model B accuracy with negligible compute overhead.

  **Crux 2: Topology Swap Sensitivity**
  *   **Test:** Run segregation model on Grid vs. Random Graph with identical agent distributions. Measure clustering coefficients.
  *   **Micro Prediction:** Outcome differences are explained entirely by degree distribution changes.
  *   **System Prediction:** Outcome differences show path-dependence not reducible to pairwise links.
  *   **Falsification (Micro):** Outcomes diverge significantly despite matched degree distributions.
  *   **Falsification (System):** Outcomes are identical once degree distributions are matched.

  **Crux 3: Downward Causation in Code**
  *   **Test:** Inspect update function $f(agent, neighbors)$. Check for global state input.
  *   **Micro Prediction:** Function signature contains no global state variable.
  *   **System Prediction:** Function behavior is effectively constrained by global state despite signature.
  *   **Falsification (Micro):** Code explicitly reads a global variable to update agents.
  *   **Falsification (System):** Global constraints can be removed without altering agent trajectories.

  ## 4. Closing Note on Progress

  We conclude that the ontological dispute ("does the macro *really* exist?") is ill-posed within the context of these simulations. Because the code is explicitly micro-defined, claims of "macro causation" are technically false regarding the simulation mechanics. However, the engineering dispute ("is the macro description *necessary* for control?") is substantive and solvable. Progress should not be expected on the ontology question, as it conflates model architecture with real-world mapping. Significant progress is expected on the efficiency question: determining when macro-abstraction is required for tractable prediction and intervention. We agree to cease arguing about "real causation" in the code and focus on compression efficiency.

  \answer{Whether macro-variables yield better predictions than micro-states under bounded compute resources.}
