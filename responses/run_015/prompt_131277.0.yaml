answer: |-
  ### Executive Summary: Does the Split Work?

  No, the split does not dissolve the disagreement; it **relocates** it. It moves the conflict from the curation desk to the downstream usage layer.

  Your friend (Causal-Role) and you (Selected-Effect) agree on the *data* (the protein does X, the history suggests Y), but you disagree on which data warrants the label "Function." By creating three fields, you allow both labels to exist. However, when a machine-learning model or a clinician requires a **single** priority label (e.g., "Is this gene a metabolic enzyme or an immune modulator?"), someone must decide which field takes precedence.

  If you prioritize the **Selected-Effect (SE)** field as the "Canonical Function," you preserve the concept of malfunction (satisfying your original position) but risk making your database less useful for discovering novel, exaptive roles (like Ticket 3). If you prioritize the **Current-Contribution (CC)** field, you maximize immediate utility for phenotype prediction but lose the ability to distinguish broken traits from traits that never had a purpose.

  The procedure below operationalizes the compromise by **defaulting to Selected-Effect as Canonical when evidence exists**, but requiring the Current-Contribution field to be filled whenever there is a measurable systemic effect. This favors your philosophical stance as the "truth" condition while capturing your friend's data as the "utility" condition.

  ---

  ### The Curation Procedure (v1.0)

  **Target User:** Master's-level curator.
  **Time Budget:** 15 minutes per ticket.
  **Goal:** Populate three fields: `FUNC_SE` (Selected-Effect), `FUNC_CC` (Current-Contribution), `EVID_CODE` (Provenance).

  #### Phase 1: The Gatekeeper (2 Minutes)
  **Q1: Is there direct experimental evidence of molecular activity?**
  *   *Yes:* Proceed to Q2.
  *   *No:* Is there strong homology (>80% identity) to a characterized protein in a close relative?
      *   *Yes:* Proceed to Q2 (Flag evidence as `IEA` - Inferred from Electronic Annotation).
      *   *No:* **STOP.** Return ticket as "Insufficient Evidence." Do not annotate.

  #### Phase 2: Current Contribution (5 Minutes)
  **Q2: Does the activity measurably affect the organism's phenotype or system capacity in its *current* environment?**
  *   *Operational Definition:* Does knocking it out, overexpressing it, or inhibiting it change survival, reproduction, or a measurable physiological state *in the current context*?
  *   *Yes:* Enter the effect into `FUNC_CC`. (e.g., "Metal sequestration," "Immune suppression").
  *   *No:* (e.g., it binds a ligand in a tube but does nothing in the cell): **Leave `FUNC_CC` blank.**
  *   *Judgment Call:* Distinguishing "systematic effect" from "side effect."
      *   *Rule:* If the effect is reproducible across individuals and correlates with a fitness metric (growth rate, survival) in the lab or field, count it. If it is a toxic overflow or a lab artifact, ignore it.

  #### Phase 3: Selected Effect (5 Minutes)
  **Q3: Is there evidence the trait was maintained by natural selection?**
  *   *Constraint:* You cannot run selection scans. Use proxies.
  *   *Proxy A (Conservation):* Is the gene sequence conserved across at least 3 divergent species in the clade?
      *   *Yes:* Presume SE exists. Enter the *ancestral/conserved* role into `FUNC_SE`.
      *   *No:* (e.g., species-specific orphan gene, or highly divergent): **Leave `FUNC_SE` blank.**
  *   *Proxy B (Pseudogenization):* Is the gene accumulating nonsense mutations or frameshifts (signs of relaxed selection)?
      *   *Yes:* **Leave `FUNC_SE` blank.** (Treat as non-functional or exapted).
  *   *Judgment Call:* Inferring "Conservation = Selection."
      *   *Risk:* Structural constraints can mimic selection.
      *   *Mitigation:* If the protein is conserved but the *activity* is not (e.g., catalytic residue mutated), mark `FUNC_SE` as "Unknown."

  #### Phase 4: Canonical Priority (3 Minutes)
  **Q4: Do `FUNC_SE` and `FUNC_CC` match?**
  *   *Yes:* Mark `PRIORITY_FLAG` = **CONCORDANT**. Copy value to `PRIMARY_LABEL` (the single field downstream users see by default).
  *   *No:* (Conflict or one is blank):
      *   If `FUNC_SE` is populated: Mark `PRIORITY_FLAG` = **HISTORICAL**. Set `PRIMARY_LABEL` = `FUNC_SE`.
      *   If `FUNC_SE` is blank but `FUNC_CC` is populated: Mark `PRIORITY_FLAG` = **OBSERVED**. Set `PRIMARY_LABEL` = `FUNC_CC`.
      *   If both are blank: **STOP.** Return ticket.

  **Escalation Rule:** If Q4 results in a Conflict (SE $\neq$ CC) AND the ticket involves a clinical variant interpretation (human disease), **escalate to Lead**. Do not set `PRIMARY_LABEL` automatically.

  ---

  ### Philosophical Simplifications for Curators

  To make this usable in 15 minutes, you must drop specific philosophical nuances:

  1.  **Drop:** The distinction between "Proper Function" and "System Function."
      *   **Keep:** The distinction between "Conserved Role" (SE) and "Measured Effect" (CC).
      *   **Instruction:** Tell curators: "SE is what the gene *looks like it's supposed to do* based on evolution. CC is what we *saw it do* in the lab or organism."
  2.  **Drop:** The requirement for explicit phylogenetic reconstruction.
      *   **Keep:** Sequence conservation as a proxy for selection.
      *   **Instruction:** "If it's conserved, we assume selection kept it. If it's falling apart, we assume selection stopped."
  3.  **Drop:** The metaphysical status of "Malfunction."
      *   **Keep:** The operational utility of "Canonical Label."
      *   **Instruction:** "If SE exists, that is the 'Normal' state. Anything else is a 'Contextual' state."

  **Judgment Calls Dressed as Procedure:**
  *   **Step Q2 (Systematic vs. Side Effect):** There is no hard line. A curator decides if a metabolic byproduct is a "contribution" or "waste." This is a value judgment on biological relevance.
  *   **Step Q3 (Conservation as Selection):** Conservation can result from lack of mutation pressure, not positive selection. Curators will over-assign SE in highly constrained structural proteins.
  *   **Step Q4 (Priority):** Prioritizing SE over CC in conflicts assumes evolution is a better guide to "truth" than current assay data. This is a philosophical bias baked into the workflow.

  ---

  ### Running the Procedure on Stylized Tickets

  #### Ticket 1: Light-Gated Ion Channel (Soil Bacterium)
  *   **Evidence:** Assay shows modulation of cell response to wavelength. Horizontal transfer (last few decades), spreading in population.
  *   **Q1 (Activity):** Yes (Assay).
  *   **Q2 (CC):** Yes (Modulates response in current environment). `FUNC_CC` = "Phototaxis/Response."
  *   **Q3 (SE):** Conservation? No (Recent HGT). But "Spreading in population" implies positive selection.
      *   *Procedure Check:* The procedure relies on conservation across species as a proxy. This ticket lacks deep conservation.
      *   *Correction:* If "Spreading in population" is documented in the ticket, count as Selection Proxy.
      *   `FUNC_SE` = "Phototaxis/Response."
  *   **Q4 (Priority):** Match. `PRIORITY_FLAG` = CONCORDANT. `PRIMARY_LABEL` = "Phototaxis."
  *   **Verdict:** **Clears in one step.** The procedure does not waste time *if* the curator accepts population spread as a selection proxy. If they strictly require cross-species conservation, `FUNC_SE` goes blank, `PRIMARY_LABEL` defaults to CC, and the annotation is still usable, just philosophically weaker.

  #### Ticket 2: Cave Vertebrate Opsin (Metal Sequestration)
  *   **Evidence:** Protein binds chromophore, changes conformation (Lab). No light in environment. Relaxed selection (pseudogenization signs?). Binds metal, improves survival in cave water.
  *   **Q1 (Activity):** Yes (Conformation change + Metal binding).
  *   **Q2 (CC):**
      *   Light: No effect on organism (Darkness). `FUNC_CC` (Light) = Blank.
      *   Metal: Improves survival. `FUNC_CC` (Metal) = "Metal Sequestration."
  *   **Q3 (SE):**
      *   Light: Ancestrally yes, but "signs of relaxed selection."
      *   *Procedure Rule:* If pseudogenization/relaxed selection is noted, `FUNC_SE` = Blank. (Selection has stopped).
      *   Metal: Novel trait. No history. `FUNC_SE` = Blank.
  *   **Q4 (Priority):** `FUNC_SE` is blank. `FUNC_CC` is "Metal Sequestration."
      *   `PRIORITY_FLAG` = OBSERVED. `PRIMARY_LABEL` = "Metal Sequestration."
  *   **Verdict:** **Successful Exaptation Capture.** The procedure correctly identifies that the "Selected Function" is gone (or dormant) and promotes the "Current Contribution" to the primary label. This satisfies the clinical need (what does this do *now*?) without lying about evolution.

  #### Ticket 3: Pathogen Metabolic Gene (Immune Suppression)
  *   **Evidence:** Ancestral function = Metabolic step (host provides metabolite now). Current effect = Binds host protein, suppresses immune response.
  *   **User Desire:** Annotate as "Immune Suppression."
  *   **Q1 (Activity):** Yes.
  *   **Q2 (CC):** Yes (Suppresses immune response). `FUNC_CC` = "Immune Suppression."
  *   **Q3 (SE):**
      *   Metabolic step: Gene is conserved in lineage (assuming it hasn't pseudogenized).
      *   `FUNC_SE` = "Metabolic Enzyme [Specific Step]."
  *   **Q4 (Priority):** Conflict. SE (Metabolism) $\neq$ CC (Immune).
      *   *Procedure Rule:* If `FUNC_SE` is populated, it takes Priority.
      *   `PRIORITY_FLAG` = HISTORICAL. `PRIMARY_LABEL` = "Metabolic Enzyme."
  *   **Verdict:** **Procedure Refuses User Desire for Primary Label.**
      *   **Why:** The procedure prioritizes evolutionary history as the "Canonical" truth to preserve the concept of malfunction (e.g., a mutation breaking the metabolic site is a "Loss of Function" even if immune suppression remains).
      *   **Outcome:** The ticket *is* annotated as Immune Suppression in the `FUNC_CC` field. Downstream users querying `FUNC_CC` will find it. Users relying solely on `PRIMARY_LABEL` will see "Metabolic Enzyme."
      *   **Recommendation:** You must instruct your ML partners to weight `FUNC_CC` heavily in host-interaction models. You cannot change the curation procedure to satisfy this without breaking the "Malfunction" logic you originally defended.

  ---

  ### Limitations and Steering Group Pitch

  #### 1. Systematic Misclassifications
  *   **The "Conserved Spandrel" Error:** The procedure assumes Conservation = Selection (Q3). If a protein is conserved due to structural constraints but its specific activity is neutral, we will incorrectly assign a `FUNC_SE`. This inflates the number of "Canonical" functions.
  *   **The "Novel Function" Blindness:** For young genes (orphan genes) with no conservation history, `FUNC_SE` will always be blank. They will never achieve "Canonical" status, even if they are essential. They will always be flagged as OBSERVED. This creates a two-tier ontology where old genes are "True" and new genes are "Provisional."
  *   **The "Moonlighting" Dilution:** Proteins with two selected effects (e.g., metabolic enzyme that was *also* selected for DNA binding) will force curators to pick one for `FUNC_SE` or enter a compound term. The procedure does not handle multi-function selection well.

  #### 2. Retroactive Impact
  If applied retroactively, **~40% of your existing annotations will require a `PRIORITY_FLAG` change.**
  *   Many current annotations mix CC evidence into an SE label (e.g., labeling a protein "Kinase" because it phosphorylates things in an assay, even if its biological role is scaffolding).
  *   Under this procedure, if the phosphorylation is not the selected effect, it moves to `FUNC_CC`. The `PRIMARY_LABEL` might change to "Scaffold."
  *   **Cost:** You cannot re-curate everything. You must run a script to flag existing entries where `FUNC_SE` is inferred solely from assay data without conservation. Mark these as "Legacy - Review Required."

  #### 3. The Steering Group Pitch
  When the steering group asks if this commits you to one side of the philosophical dispute, say this:

  > "This procedure does not settle the definition of function. It **captures uncertainty**.
  >
  > Previously, we forced curators to collapse 'what a gene does' and 'what a gene is for' into a single string. This caused errors: we labeled broken genes as functional because they still bound ligands, and we labeled novel adaptations as non-functional because they lacked history.
  >
  > By splitting the fields, we are not choosing between Etiological and Causal-Role theories. We are acknowledging that **evidence types differ**.
  > *   `FUNC_SE` is an inference based on evolutionary history.
  > *   `FUNC_CC` is an observation based on experimental assay.
  >
  > We are committing to **provenance transparency**. If a downstream user needs a single label, our `PRIORITY_FLAG` tells them whether that label is an evolutionary inference or a direct observation. This allows the ML team to weight them differently depending on whether they are predicting disease (where SE matters) or drug response (where CC matters)."

  #### Final Warning
  The procedure solves the curation inconsistency, but it **does not solve the downstream single-label problem**. If your clinical partners demand one GO term to decide on a variant, they will still have to choose between trusting the history (SE) or the assay (CC). You are handing them the loaded gun; you are not removing the bullet. Ensure their pipeline documentation explicitly states which field they are consuming.
