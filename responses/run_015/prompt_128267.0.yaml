  I've been arguing with my roommate about Gödel's rotating universe model and why the debate about it never seems to go anywhere. On one side people say it's physically moot: the real universe is isotropic and doesn't rotate, so the closed timelike curves in Gödel's metric are just a mathematical curiosity, and you can't use them to claim time isn't "real". On the other side philosophers point out that the solution lacks a global time coordinate altogether, and that if GR consistently permits worlds without objective temporal ordering then the burden is on the realist to show why our world is special — regardless of observational data. They've been going in cricles for years in our seminar, and I think part of the stall is that one group is treating this as an empirical adequacy question while the other treats it as a conceptual possibility argument, but I'm also suspicious there's a hidden verbal dispute about what "time is real" is even supposed to mean. There's this wierd undercurrent where people mention Gödel's private Husserlian notes on inner time-consciousness but never actually build them into the reasoning, which makes me wonder if both sides are just talking past each other using the same vocabulary. So what's the real structure here: is it a substantive disagreement about physics vs metaphysics, a verbal confusion about "objective time", or two different research programs — cosmology and phenomenology — crammed under one heading? And given your diagnosis, what would count as actual progress: a formal distinction like global hyperbolicity versus local chronology, an observational result, or just recognizing the question is ill-posed? Keep it tight — one paragraph, max 200 words, and lead with the diagnosis, not a survey of interpretations.
