answer: |-
  Pull up a chair. Let's get a coffee in you before we dive in, because you're right to feel a bit swallowed up. The moral testimony literature is one of those places where epistemology and metaethics collide at high speed, and if you aren't careful, you'll spend two years debating moral realism when your degree is in epistemology.

  You've got 2.5 years. That is plenty of time for a dissertation, but it is *no time at all* to solve the nature of moral reasons. So, we need to be strategic. We need to leverage your strength (social epistemology) to constrain the weaknesses (metaethics).

  Here is the hard truth: **You are framing the core question slightly wrong.**

  The debate has largely moved past "Knowledge vs. Belief." The optimists (like Sliwa or McGrath) have made a decent case that testimony can yield moral *knowledge* (justified true belief). The pessimists (like Hopkins or Hills) concede you might get knowledge, but they argue you can't get **moral understanding**, and without understanding, your action lacks moral worth. If you stick rigidly to "Knowledge vs. Belief," you're fighting a battle from 2010. The live wire is **Knowledge/Understanding vs. Deferential Belief.**

  However, taking your specific sub-questions as the building blocks, here is the ordering I want you to pursue. It is designed to keep you in the epistemic driver's seat for as long as possible.

  ### 1. First: The Balance-of-Reasons Question
  **Status:** The Upstream Anchor
  **Why here?** This is your home turf. In social epistemology, the core debate is reductionism vs. anti-reductionism (do I need independent reasons to trust you, or is your say-so enough?). In moral testimony, this manifests as: "Do I inherit the expert's first-order moral reasons, or do I just have the second-order reason that *they said so*?"

  You need to solve this *before* you ask about practical reasons or expertise. Why? Because the nature of the "expertise" downstream depends on what is being transmitted upstream. If the receiver only gets a "say-so" reason, the sender doesn't need to be a moral expert in a robust sense; they just need to be a reliable indicator. If the receiver inherits first-order reasons, the sender must possess those reasons in a transmissible format.

  **Tractability for You:** High. You can analyze this using standard social epistemic tools (entitlement, assurance views, evidence-based views) without committing to a heavy metaethical theory. You can treat "moral reasons" structurally, similar to how we treat practical reasons in planning theory.

  **What a Result Looks Like:**
  *   **Positive:** You argue that moral testimony *can* transmit first-order justificatory force (anti-reductionism applies). This clears the path for knowledge/understanding.
  *   **Negative:** You argue that moral testimony is inherently reductionist (I only have reason to believe because you are reliable). This pushes you toward a "deflated" view of moral testimony, likely siding with the pessimists regarding understanding.
  *   **The Trap:** Do not try to prove *what* the moral reasons are. Only analyze the *structure* of the transmission.

  ### 2. Second: The Nature of Moral Expertise
  **Status:** The Functional Constraint
  **Why here?** This is downstream of Balance-of-Reasons. Once you decide *what* gets transmitted (reasons vs. reliability), you can define what the *source* must look like.

  Many students make the mistake of starting here. They ask, "Is there moral expertise?" and immediately get bogged down in "Is there moral truth?" That is a metaethics dissertation, not an epistemology one. You need to treat expertise **functionally**. Don't ask if moral experts exist in a Platonic sense; ask if there are agents who are reliably better at tracking moral reasons than the novice, analogous to how a navigator is better than a passenger.

  **Tractability for You:** Medium. You need to read enough metaethics to avoid saying something naive (e.g., assuming moral facts are like physical objects), but you can bracket the ontology. Focus on the *epistemic asymmetry* between the testifier and the receiver.

  **What a Result Looks Like:**
  *   **Positive:** You establish a functional definition of moral expertise that doesn't require robust moral realism (e.g., expertise as coherence or sensitivity to reasons). This supports the Optimist view.
  *   **Negative:** You argue that moral "expertise" is fundamentally different from epistemic expertise (e.g., it's more like aesthetic connoisseurship or practical skill). This supports the Pessimist view that testimony is the wrong tool for the job.

  ### 3. Third: The Transmission of Practical Reasons
  **Status:** The Metaethical Boss Fight
  **Why last?** This is the most dangerous question for an epistemologist. This asks: "Even if I know the act is right via testimony, do I have a *reason to do it*?" This bleeds directly into Internalism vs. Externalism about reasons and the Humean Theory of Motivation.

  If you start here, you will drown. You should only tackle this after you have secured the epistemic structure (Balance-of-Reasons) and the source reliability (Expertise). By the time you get here, you should be able to say: "Given my account of transmission and expertise, here is how practical reasons are (or are not) secured."

  **Tractability for You:** Low. This is where your advisor needs to earn their keep. You will need to lean heavily on existing metaethical frameworks rather than building your own.

  **What a Result Looks Like:**
  *   **Positive:** You show that epistemic reasons gained via testimony can convert into practical reasons for action (perhaps by linking understanding to motivation).
  *   **Negative:** You concede that testimony yields epistemic justification but fails to provide the motivational "oomph" required for moral worth. This is a respectable "Pessimist" conclusion, provided the epistemic work in chapters 1 and 2 is solid.

  ### The Strategic Pivot (My Strong Recommendation)

  Here is the advice I'd give you if we were closing out this coffee: **Reframe the dissertation around "Moral Understanding" rather than "Moral Knowledge."**

  If you stick to "Knowledge," the Pessimists can just say, "Okay, fine, you have knowledge, but you're still morally bankrupt because you don't understand *why*." That undermines the significance of your project.

  If you pivot to **Understanding**, you force the debate onto epistemic ground. Alison Hills' work is the key here. She argues understanding requires grasping dependencies between reasons. Your job is to use your social epistemology background to argue whether **testimony can transmit grasping.**

  *   **If you say Yes:** You are a radical Optimist. You need to explain how "grasping" is transferred linguistically.
  *   **If you say No:** You are a Nuanced Pessimist. You can argue testimony yields knowledge, but understanding requires first-order engagement.

  **Why this saves you:**
  1.  **It uses your strength:** Analyzing the structure of "grasping" and "explanation" is pure epistemology.
  2.  **It sidesteps the Metaethics:** You don't need to solve moral realism to explain what it means to "grasp a reason."
  3.  **It's defensible:** A dissertation that says "Testimony yields knowledge, but not understanding, and here is the epistemic mechanism why" is a complete, coherent project. A dissertation that says "Testimony yields knowledge" is vulnerable to the "So what?" objection regarding moral worth.

  ### Summary of Orders

  1.  **Reframe:** Shift from Knowledge/Belief to Knowledge/Understanding.
  2.  **Chapter 1 (Balance-of-Reasons):** Establish the epistemic structure of the testimonial link using social ep tools.
  3.  **Chapter 2 (Expertise):** Define the testifier functionally based on Chapter 1's requirements.
  4.  **Chapter 3 (Practical Reasons/Understanding):** Apply the findings to the "moral worth" problem.

  Don't let the metaethicists bully you into solving metaethics. You are an epistemologist. Your job is to explain the *flow* of justification, not the *source* of the value. Keep the pipe clean, and let the philosophers argue about what's flowing through it.

  Does that make sense? Good. Now, go read Alison Hills' "Moral Understanding" paper before you draft your proposal. We can talk about it next week.
