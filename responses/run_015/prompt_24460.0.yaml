      *   *Strategic Advice:* The **Balance-of-Reasons** question is the most tractable for a Social Epistemologist and sits *upstream* of the Transmission problem. You need to know *what* is being transmitted (reasons vs. propositions) before you ask if practical reasons transmit.
      *   *Actually, the strongest advice:* **Flag the Framing Error.** The "Knowledge vs. Belief" distinction is often a proxy for the "Understanding" debate. Tackling "Understanding" allows you to use Social Ep tools without getting killed by Metaethics.
      *   *Okay, let's synthesize.* I will advise them to tackle the **Balance-of-Reasons/Structure of Justification** first, *but* reframe it as a question about **Moral Understanding** rather than just Knowledge. This leverages their Social Ep strength (testimony structures) while addressing the Pessimist's core concern (why testimony feels deficient) without requiring them to solve Metaethics first.

      *   *Refining the Ordering:*
