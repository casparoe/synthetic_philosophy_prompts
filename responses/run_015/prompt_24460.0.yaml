  3.  **Evaluate the Sub-questions (Upstream/Downstream Analysis):**

      *   *Moral Expertise:* This seems foundational. If there's no such thing as moral expertise (analogous to scientific expertise), then moral testimony collapses because there's no one to testify *from*. However, defining expertise often depends on what the *output* of that expertise is (knowledge? understanding? right action?). So, it's upstream but potentially a rabbit hole of metaethics.
      *   *Balance-of-Reasons:* This is about the *structure* of the justification. If I believe $p$ because Expert said $p$, do I have the reasons for $p$? This is classic social epistemology (reductionism vs. anti-reductionism). This fits the user's background best. But it might presuppose that knowledge *is* possible.
