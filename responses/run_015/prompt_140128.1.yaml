  ## The Map of the Territory (Scoring Key)

  Here is where your answers land you. We built this tree based on **distinctions** (how you view pain/pleasure), not just labels.

  | View | The Core Idea | Where you landed |
  | :--- | :--- | :--- |
  | **Total Utilitarianism** | Pleasure and pain are one currency. Add it all up. More is better. | Round 2A (Mostly B's) |
  | **Prioritarianism** | Happiness counts, but helping the suffering counts *more*. | Round 2A (Mostly A's on 5 & 6) |
  | **Negative Utilitarianism** | Suffering is the main problem. Pleasure is secondary. | Round 2B (Soft NU result) |
  | **Lexical Negative Utilitarianism** | Severe suffering cannot be traded for *any* amount of pleasure. Period. | Round 2B (Lexical NU result) |
  | **The Threshold View** | Mild trades are fine. Extreme trades are forbidden. | Round 2B (Threshold result) |
  | **Deontology / Rights** | Some things are just wrong, regardless of the math. | Round 2C (Mostly A's) |

  ### ⚠️ Empty Cells & Glitches
  We designed this tree to cover the main positions, but some combinations didn't get a leaf. Here's why:

  1.  **The "Bliss Lexicalist" (Empty Cell):**
      *   *The Combo:* You said "Yes" to the Cliff on Pain (Q2), but also "Yes" to the Cliff on Bliss (Q3).
      *   *Why it's empty:* This view holds that *both* extreme pain and extreme pleasure are off-limits for trade. It's not incoherent, but it's rare (sometimes called "Dual-Threshold"). It usually collapses into Deontology (Round 2C).
  2.  **The "Anti-Aggregation NU" (Empty Cell):**
      *   *The Combo:* You think suffering matters most (NU), but also that one person's torture *can* be outweighed by a billion people's ice cream (Q4 Option B).
      *   *Why it's empty:* This is logically unstable. If suffering is lexically worse, numbers shouldn't matter. If numbers matter, it's not truly lexical. We flagged this in Q4/Q5.
  3.  **Prioritarianism vs. Total Utilitarianism (Hard to Separate):**
      *   *The Glitch:* In the real world, these two often give the same answers. Prioritarianism only splits from Utilitarianism when you have to choose between helping a happy person or a sad person by the *exact same amount*. If you didn't notice the difference in Q6, don't worry—even professors argue about this one.

  ### 🚩 Indistinguishable Leaves
  *   **Lexical NU vs. The Threshold View:** These are siblings. The difference is subtle: Lexical NU says pleasure *has no value* when compared to torture. The Threshold View says pleasure *has value*, but we aren't *allowed* to trade it. In a quiz, these look identical. If you got Lexical NU, you might actually be a Threshold theorist who just hates math.

