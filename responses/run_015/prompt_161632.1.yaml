          *   *Legal Vocabulary:* Class gifts, per stirpes vs. per capita. Simultaneous death? No, better: Construction of "issue" when identity is shared at start.
          *   *Translation:* If the zygote is the "res" and it splits, does the gift to "the child conceived at T1" fail or multiply?
          *   *Fit:* Law treats them as distinct beneficiaries immediately upon live birth. Metaphysics struggles with the "branching" identity.
          *   *Untranslatable:* The question "Could I have been *him*?" has no legal standing. Law only asks "Are you a beneficiary?"

      *   **(d) Embryo Selection:**
          *   *Metaphysics:* Selected Embryo A vs. Discarded Embryo B. Both viable. I am A. Could I have been B?
          *   *Legal Vocabulary:* Assisted reproduction statutes (genetic vs. gestational vs. intended).
          *   *Translation:* If the testator funds IVF and directs "the embryo implanted," but there were three. One is me.
          *   *Fit:* Law assigns parentage based on consent/intent.
          *   *Distortion:* Metaphysics says B is a *different* possible person. Law says B is property or discarded tissue until implanted.

      *   **(e) The Ordinary Case (Chance Gamete):**
          *   *Metaphysics:* One sperm wins out of millions. Contingent origin.
          *   *Legal Vocabulary:* Equitable tracing. Substitution of assets.
          *   *Translation:* Tracing value through a mixed fund. Which dollar bought the asset? The "winning" dollar.
          *   *Fit:* Tracing follows value, not specific physical particles.
          *   *Untranslatable:* Metaphysics says *this* sperm is essential. Law says *any* sperm from the father suffices for "issue" status.

  4.  **Developing the Residue Report:**
      *   *The User's Suspicion:* Law shows origin essentialism is a stipulation (instrumental), not a discovery.
      *   *Counter-Argument:* Law is normative (how we *should* treat things). Metaphysics is modal (how things *could* be).
      *   *The "Cost":* If essentialism is true, law is systematically false about identity but pragmatically right. If essentialism is false (or linguistic), law is ontologically neutral.
      *   *Key Insight:* Law uses "identity" as a proxy for "entitlement." Metaphysics uses "identity" as a proxy for "existence."
      *   *Testing the Suspicion:* The law's ability to *sever* origin (adoption) suggests origin isn't *legally* essential. But does that prove it isn't *metaphysically* essential?
      *   *Refinement:* The law creates *legal persons*. The metaphysician talks about *human organisms* or *selves*. The category error is the source of the translation failure.

  5.  **Refining the Tone:**
      *   Must be professional, precise, and respectful of the user's expertise.
