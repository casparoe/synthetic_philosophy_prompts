      *   *Artifacts:* Table made of wood $W$ could not be made of wood $W^*$.
      *   *Persons:* Person $P$ from sperm $S$ + egg $E$ could not be from $S^*$ + $E^*$.
      *   *Tension:* Law often treats identity as functional, continuous, or statutory, whereas metaphysics treats it as necessary and historical.

  3.  **Drafting the Translations (Iterative Process):**

      *   **(a) The Artifact Claim (Table/Wood):**
          *   *Metaphysics:* This table $\neq$ table made from different wood, even if identical.
          *   *Legal Vocabulary:* Specific devise vs. general legacy. Ademption by extinction.
          *   *Translation:* The specific devise of "my oak table" fails if the wood is replaced (ademption). But if the wood is planed down or repaired, is it still the specific devise?
          *   *Analysis:* Law asks "is it the same asset for distribution?" Metaphysics asks "is it the same object in modal space?"
          *   *Fit:* Ademption tracks material change, but only for *distribution*, not *ontology*.

      *   **(b) The Person/Gamete Claim:**
          *   *Metaphysics:* I could not have come from different gametes.
          *   *Legal Vocabulary:* Class gifts to "children" or "issue." Posthumous conception.
          *   *Translation:* A gift to "my children" includes only those from my genetic material (usually). If a different sperm/egg made a qualitatively identical person, are they a "child"?
          *   *Fit:* Law cares about genetic link (origin) for inheritance *unless* adoption/statute intervenes.
          *   *Distortion:* Law allows "child" status via adoption (no genetic origin). Metaphysics says *this* person couldn't exist without *these* gametes.

      *   **(c) Monozygotic Twinning:**
