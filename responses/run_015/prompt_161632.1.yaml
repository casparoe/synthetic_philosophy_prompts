      *   **Topic:** Origin Essentialism (Kripkean metaphysics regarding objects and persons).
      *   **Task:** Translate five specific metaphysical scenarios (a-e) into the user's legal vocabulary. For each, analyze what translates well, what requires distortion, and what is untranslatable.
      *   **Goal:** Provide a "residue report" evaluating the user's suspicion: Is origin essentialism just a linguistic stipulation (like law) or a metaphysical discovery that law ignores for instrumental reasons?
      *   **Constraints:** Do *not* explain legal terms (assume fluency). Do *not* provide authorities or further reading. Test the suspicion, don't just confirm it.

  2.  **Deconstruct the Metaphysical Thesis (Origin Essentialism):**
