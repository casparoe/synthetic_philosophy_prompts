answer: |-
  Here is the translation of the metaphysical thesis into the vocabulary of trusts and estates, followed by the residue report you requested.

  ### (a) The Artifact Claim
  **The Thesis:** The table at which you sit could not have been made from a different block of wood, even if that other block would have resulted in a table qualitatively indistinguishable from this one.
  **The Reply:** To imagine a table made of different wood is not to imagine *this* table with different properties, but a different table entirely.

  *   **What carries over without strain:** The doctrine of **ademption by extinction**. When a will makes a specific devise of "my oak table," and that table is destroyed or substantially altered before death, the gift fails. The court asks whether the asset remaining in the estate is the *res* described in the instrument. If the wood is replaced, the specific *res* is gone. The law treats the material origin as constitutive of the specific gift.
  *   **What survives only with alteration:** The **construction of specific vs. general legacies**. In law, if the testator intended the *value* of the table to pass, the beneficiary may claim against the residuary estate (a general legacy). The metaphysical claim denies this possibility: there is no "value of the table" separable from the table's origin. To make the metaphysics fit the law, you must treat the "table" not as a physical object but as a bundle of rights to value, which the essentialist denies.
  *   **What cannot be said:** The **counterfactual**. The law never asks, "If this wood had not been available, would the testator have bought that wood?" except to determine intent for ademption by extinction. The law does not ask, "Is this *the same table* in a possible world where the wood was different?" It only asks, "Is this the asset named in the will in the actual world?" The modal status of the object is irrelevant to its distributive status.

  ### (b) The Person/Gamete Claim
  **The Thesis:** You could not have come from a different sperm and egg, even if those gametes would have produced someone qualitatively indistinguishable from you.
  **The Reply:** To imagine a person born of different gametes is to imagine a different person, not you with different parents.

  *   **What carries over without strain:** **Class gifts to "children" or "issue."** Absent statutory intervention, a gift to "my children" is construed to mean those biologically descended from the testator. The genetic origin is the condition precedent for membership in the class. A qualitatively identical person produced by different gametes (e.g., a clone or a different conception) would not take under the will.
  *   **What survives only with alteration:** **The statutory fiction of adoption.** The law treats an adopted child *as if* born to the adopters. This severs the metaphysical link between origin and identity for the purpose of inheritance. To make the essentialist claim fit here, you must argue that the law creates a *new* legal person who stands in the shoes of the child, rather than identifying the adopted child *as* the biological issue. The law says "treat as"; the metaphysician says "is."
  *   **What cannot be said:** **The necessity of the origin.** The law allows for **posthumous conception** statutes where a child conceived after death using stored gametes is treated as "born" during the testator's lifetime for inheritance purposes. The law focuses on the genetic link and the intent, not the temporal necessity of the fertilization event. The metaphysical claim that *this* person requires *this* fertilization event at *this* time has no purchase when the statute deems the child "living" at a time when biologically they were not.

  ### (c) The Twinning Case
  **The Thesis:** Monozygotic twinning involves one zygote splitting into two. If origin is essential, do the twins share an origin? Could you have been the other twin?
  **The Reply:** If the zygote is the origin, both share it. But if the individual is the origin, they are distinct.

  *   **What carries over without strain:** **Per stirpes distribution.** When a beneficiary predeceases the testator leaving issue, the share divides by roots. Twins are distinct roots. The law treats them as distinct beneficiaries immediately upon live birth, regardless of their shared zygotic origin.
  *   **What survives only with alteration:** **The definition of "conceived."** In construing gifts to children "living at my death" or "conceived before," the law must pinpoint when the individual exists. If the zygote is the "individual," twinning creates a problem of divisibility. The law alters the claim by treating the *implantation* or *live birth* as the moment of legal personality, effectively ignoring the zygotic stage where the identity branching occurs.
  *   **What cannot be said:** **The "Could I have been him?" question.** In a will contest or construction proceeding, there is no mechanism to ask whether Beneficiary A could have been Beneficiary B. The law requires distinct tax IDs, distinct birth certificates, and distinct shares. The metaphysical possibility of transworld identity (or intra-world branching identity) is procedurally barred. The court cannot adjudicate a claim where the plaintiff argues, "I am entitled to my twin's share because, metaphysically, I could have been him."

  ### (d) Embryo Selection
  **The Thesis:** Several viable embryos exist; one is selected for implantation (you). The others are discarded. Could you have been one of the discarded embryos?
  **The Reply:** No. The discarded embryos are distinct possible persons, not you in a different state.

  *   **What carries over without strain:** **Assisted reproduction statutes dividing genetic, gestational, and intended parentage.** The law assigns parentage based on consent to the *procedure* and the *implantation*. The selected embryo becomes the child; the unselected embryos remain property or tissue. This mirrors the essentialist view that *this* person is tied to *this* developmental path.
  *   **What survives only with alteration:** **The status of the unselected embryos.** In law, unselected embryos are often subject to contract law (disposition agreements) rather than family law. They are *res*, not *persons*. To translate the metaphysical claim, you must treat the unselected embryos as "possible beneficiaries" whose interests are extinguished. The law does not recognize them as having interests to extinguish; it recognizes them only as potential *sources* of beneficiaries.
  *   **What cannot be said:** **The identity of the counterfactual.** If the clinic had implanted Embryo B instead of Embryo A, the law says the resulting child is a different beneficiary with different rights. The metaphysician says Embryo B would have been a different person. The translation fails when asking about the *loss* to the unselected embryos. The law has no concept of "wrongful non-existence" for a specific embryo in this context, whereas the metaphysical thesis implies a distinct ontological status for each viable candidate.

  ### (e) The Ordinary Case (Chance Gamete)
  **The Thesis:** Among millions of sperm, one fertilizes the egg. The winning gamete is arbitrary. Yet you are essentially tied to it.
  **The Reply:** It was not arbitrary for *you*; for any other sperm, a different person would have existed.

  *   **What carries over without strain:** **Equitable tracing.** When a trustee mixes trust funds with personal funds and purchases an asset, the beneficiary traces value into the asset. The law asks which value purchased the asset. If the "winning sperm" is analogous to the "winning dollar," the law tracks the specific source.
  *   **What survives only with alteration:** **The rule of substitution.** In tracing, if the asset is sold and proceeds used to buy another, the beneficiary's claim follows the value, not the specific particles. The law allows substitution of assets while maintaining the identity of the *claim*. The metaphysical thesis denies substitution of origin. To make them fit, you must argue that the *claim* is the essential object, not the *asset*.
  *   **What cannot be said:** **The arbitrariness of the cause.** In law, if the wrong sperm were used (e.g., mix-up at a clinic), it is a tort or breach of contract. The child born is still the legal child of the birth mother (and often the intended parents). The law prioritizes the *gestational* or *intended* origin over the *genetic* origin in many jurisdictions. The metaphysical claim that *this* genetic origin is essential to *this* person is overridden by the legal policy that stabilizes the child's status regardless of genetic accident.

  ***

  ### Residue Report

  You suspect that the law's willingness to substitute, sever, or backdate origin shows that origin essentialism is a stipulation about how to use the word *this* rather than a discovery about objects. You ask whether the failure to translate is due to the instrumental nature of your vocabulary or the imprecision of the metaphysical thesis.

  **1. The Instrumental Nature of Legal Vocabulary**
  The translation fails primarily because your vocabulary is **constitutive**, not **descriptive**.
  *   **Stipulated Identity:** When a statute deems an adopted child "born to" the adopters, it does not discover a biological fact; it creates a legal status. The law *stipulates* origin for the purpose of distributing rights. It severs the link between genetic material and legal identity because the goal is social stability and effectuating intent, not ontological accuracy.
  *   **Severance by Decree:** Ademption by extinction severs the identity of an object from its physical continuity if the testator's intent suggests the gift was merely pecuniary. Equitable tracing severs the identity of an asset from its physical form to follow value. In every instance, the law treats identity as a **proxy for entitlement**.
  *   **Counterfactuals as Causal:** When a court asks, "Would the testator have wanted this?" it treats the counterfactual as evidence of intent (causal/evidential). It does not treat the counterfactual as a window into the metaphysical nature of the beneficiary or the asset.

  **2. The Imprecision of the Metaphysical Thesis**
  However, the failure is not solely due to the law's instrumentalism. The metaphysical thesis also lacks a **decision procedure**.
  *   **Granularity of Origin:** Origin essentialism claims origin is necessary but rarely specifies the *grain*. Is the origin the sperm? The zygote? The implantation? The birth? The law is forced to specify this grain (e.g., "born alive," "conceived within 300 days"). The metaphysical thesis floats above this granularity. It cannot tell a court whether a zygote that splits is one person or two *for the purpose of the gift*. It only says "origin is essential." The law must define *which* origin event creates the legal person.
  *   **Testing by Institution:** The metaphysical thesis has never been tested by a decision procedure that forces it to be exact because metaphysics does not distribute property. If it did, it would have to answer the twinning case or the embryo selection case with a rule, not an intuition.

  **3. Testing Your Suspicion**
  Your suspicion is largely correct, but with a caveat.
  *   **Correct:** Origin essentialism functions like a rule of construction. It tells you how to use the rigid designator "I" or "This Table." It says: "Do not apply this label to anything that did not come from *this* source." This is indistinguishable from a legal stipulation that says: "Do not distribute this fund to anyone not genetically descended from *this* source." Both are rules for the application of terms.
  *   **The Caveat:** The metaphysician claims their stipulation tracks **mind-independent reality**, whereas the lawyer admits their stipulation tracks **policy**.
      *   If the metaphysician is right (it is a discovery), then the law is systematically erroneous. Every time a court treats an adopted child as "born to" the adopter, it is stating a falsehood about identity.
      *   If the metaphysician is wrong (it is a linguistic convention), then the law is simply using a *different* convention for a different purpose.

  **4. The Cost of Holding the Thesis**
  If you hold the thesis while conceding no institution could apply it, the cost is **practical irrelevance**.
  *   **The Misreading:** You may be misreading the essentialist argument as a claim about *classification* rather than *existence*. The essentialist is not saying "We should not call him 'John' if he came from different gametes." They are saying "John would not *exist*."
  *   **The Concession:** To concede that no institution could apply it is to admit that **identity for rights** and **identity for existence** are distinct categories.
      *   **Identity for Existence (Metaphysics):** Modal, historical, necessary.
      *   **Identity for Rights (Law):** Functional, prospective, stipulated.

  **Conclusion:**
  The translation fails because the law does not care about *de re* necessity. It cares about *de dicto* classification. When the law asks "Is this the child?", it means "Does this human organism satisfy the statutory criteria for inheritance?" When the metaphysician asks "Is this the child?", they mean "Is this human organism numerically identical to the person conceived at T1?"

  Your vocabulary treats origin as a **condition precedent** that can be waived, substituted, or fictitiously satisfied. Origin essentialism treats origin as a **modal constraint** that cannot be violated without eliminating the subject.

  The residue is this: The law's ability to sever origin proves that **legal identity is not metaphysical identity**. It does not prove that metaphysical identity is a fiction. It proves that institutions operate on a layer of abstraction where origin is a variable to be managed, not a truth to be discovered. If origin essentialism is true, it is true in a realm where wills do not probate and trusts do not administer. If it is false, the law is not to blame; the law merely exposes that we have no need for essentialism to allocate resources. The suspicion that it is a stipulation about the word *this* is robust: the law simply stipulates differently.
