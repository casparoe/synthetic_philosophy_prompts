      *   Use the requested legal terminology naturally.
      *   Avoid academic metaphysics jargon where possible, or define it via legal analogues.

  6.  **Drafting the Content (Self-Correction during drafting):**
      *   *Check:* Did I explain ademption? No, assumed knowledge.
      *   *Check:* Did I address all five points (a-e)? Yes.
      *   *Check:* Did I answer the "Residue Report"? Yes.
      *   *Correction on (c):* Twinning is tricky. In law, twins are distinct beneficiaries. In metaphysics, they share an origin. The translation should focus on the *class gift* problem. If the gift is to "the child of X," and X splits, do we have one beneficiary or two? Law says two. Metaphysics asks if the *original* zygote was the "person."
      *   *Correction on (e):* Equitable tracing is a good analogue for "following value" vs "following matter." But the sperm case is about *selection*. Maybe better to use the "mass of assets" analogy. If I have a bulk of grain and sell half, which grain is left? Law uses rules of allocation. Metaphysics asks about the specific particles.

  7.  **Final Polish:**
      *   Ensure the distinction between *legal identity* (for rights/duties) and *metaphysical identity* (for existence across worlds) is clear in the residue report.
      *   Make sure the conclusion directly addresses the "stipulation vs. discovery" question.

  8.  *(Final Review against constraints)*: No authorities. No further reading. Fluency assumed.

  **(Self-Correction Note):** I need to be careful not to simply say "Law is practical, Metaphysics is theoretical." I need to dig into *why* the translation fails. Is it because law *creates* identity, whereas metaphysics *finds* it? That's the crux.

  Let's write the response.

  *Structure:*
  1.  Introduction (acknowledging the task).
  2.  Translations (a) through (e) with the three sub-analyses (carries over, altered, untranslatable).
  3.  Residue Report (addressing the suspicion).
  4.  Conclusion (the cost of holding the thesis).

