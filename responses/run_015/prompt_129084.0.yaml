  - volunteer firefighter running into buildings for the adrenaline and camaraderie, not out of duty = meaningful.
  - monk chanting every morning solely out of fear of damnation = not meaningful, just work for salvation.

  now she's stuck on this niche practice called ludic preservationism: people spend hundreds of hours documenting glitches in obsolete video games, not for cash or clout, but because they feel an ethical obligation to archive the game's "pure play state" for future generations. they genuinely enjoy the glitch hunting, but they also report feeling guilty if they skip a session and describe it as a "moral debt to the community."

