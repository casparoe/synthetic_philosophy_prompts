answer: |-
  **Recommendation**

  The Board recommends the member remit the withheld carrying charges in full within 30 days. Simultaneously, the Board will place a proposed bylaw amendment regarding conscientious objection to specific budget line items on the agenda for the annual meeting in eleven weeks.

  **Reasons**

  The member frames compelled payment as theft, citing absence of consent and benefit. In a legal taking, the state appropriates private property without consent or just compensation. Here, the feature doing the work is consent. However, co-op membership is a voluntary contract. By purchasing a unit, you consented to governance by majority vote on budgetary matters. The money ceases to be yours upon assessment; it becomes collective property. Therefore, no "taking" occurs because there is no prior individual entitlement to specific dollars once pooled.

  Regarding "common benefit": This does not mean every member derives identical utility from every expenditure. It means the expenditure serves the collective welfare. Advocacy affecting housing stability benefits all owners by protecting property values and regulatory environments, even if specific lobbying goals differ from individual preferences. The bylaw permits charges for the collective good, not individualized satisfaction.

  The member argues that our exit option (selling the unit) makes the coercion worse than state citizenship, as it forces a costly departure to avoid objectionable policy. He contends this high exit cost makes our coercion more egregious than state taxation. We find the voluntary nature of entry outweighs the cost of exit. The exit right confirms this is a voluntary association, not a sovereign state. The cost of exit defines the boundary of the community. If moral objection allowed financial withdrawal, the boundary would dissolve. The state holds you regardless of consent; the co-op holds you only because you choose to stay.

  **Objections We Are Overruling**

  We grant the sincerity of the member's moral objection. Compelled support for political advocacy is a serious burden on individual autonomy. In a perfect world, conscientious objection would be accommodated without penalty. We recognize that denying this exemption forces a choice between financial compliance and moral integrity. The member's claim that high transaction costs on selling trap dissenters is a weighty concern regarding the fairness of our governance structure.

  However, granting an exemption creates a precedent that destabilizes the cooperative model. If one member may redirect dues based on personal conscience, any member may veto any budget item—maintenance, insurance, or staffing—based on personal criteria. Over the next several years, this transforms the co-op from a unified entity into a loose confederation of individual payers. Budgeting becomes impossible; collective action fractures. This fragmentation disproportionately harms members who rely on the co-op's unified voice for housing security. The escrow proposal, while creative, acknowledges the obligation but refuses the collective destination. This undermines the indivisible pool required for our operating model. We must overrule this to preserve the co-op's functional integrity. The proper venue for change is the ballot box at the annual meeting, not individual withholding.
