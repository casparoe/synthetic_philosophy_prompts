answer: |-
  This is a fantastic set of questions. You've hit on the exact friction points that keep mereologists up at night. The "Grip Principle" is a very natural articulation of what we might call a **Cohesion View** or a **Fastening View**. It aligns closely with pre-theoretic intuition.

  However, since you asked for the *real state of the debate* rather than a textbook summary, I'm going to be blunt about why your principle, while intuitive, runs into the same buzzsaw that has chewed up almost every moderate view in the last 40 years.

  Here is my breakdown of the three issues you raised.

  ### 1. Isn't the Grip Principle what moderates are groping toward? Why is it hard to nail down?

  Yes, absolutely. Your "Grip Principle" is essentially a more vivid description of what Peter van Inwagen called "fastening" or what others call "physical cohesion." It is the natural home of **Moderate Restrictivism**. Every moderate wants to say exactly what you are saying: *Composition happens when the parts are doing something interesting together, not just when they are near each other.*

  The reason it is so hard to "nail down" isn't because philosophers are being difficult; it's because the moment you try to make the principle precise enough to do metaphysical work, it either collapses into arbitrariness or vagueness.

  **The "Shake" Test Problem:**
  You say the whole must survive "a good shake." But metaphysics requires us to ask: *How hard is the shake?*
  *   **The Sorites of Force:** If I shake the table gently, it holds. If I shake it with the force of a hurricane, it breaks. If I shake it with the force of a supernova, it vaporizes. At what precise Newtons of force does the object cease to exist?
  *   **The Scope Problem:** Consider a solar system. The planets are held in place by gravity. They are "mutually stuck" in orbits. They survive a *lot* of shaking (short of a black hole). Does the solar system compose an object? Most moderates want to say "no," but your principle risks saying "yes."
  *   **The Organism Problem:** Consider a human being. Are my cells "stuck" to each other? Chemically, yes. But I am constantly shedding skin cells and exchanging atoms with the environment. I am a flux of matter held together by biological processes, not just static grip. If I go into a coma, is the "grip" weaker? Do I cease to be an object?

  **The Dilemma:**
  To make the Grip Principle work, you have to choose between two bad options:
  1.  **Vagueness:** Admit that "grip" is a vague term. Therefore, *existence* is vague. There is no fact of the matter whether some atoms compose a table. (David Lewis argued this is impossible; reality can't be vague.)
  2.  **Arbitrariness:** Stipulate a precise cutoff (e.g., "bonding energy > X"). But then you face the absurdity that adding one single photon of energy could pop a composite object into or out of existence.

  Moderates struggle because they are trying to thread a needle between "everything exists" (Universalism) and "nothing exists" (Nihilism) using criteria that are inherently gradient (like grip, contact, or cohesion) to define a relation (composition) that seems binary (either it exists or it doesn't).

  ### 2. Why does anyone still defend the extreme answers?

  You wrote: *"We plainly know the shoe-Tower thing doesn't exist, so any theory that says every bunch of things composes something... is refuted by common sense, end of story."*

  This is the crux of the divide. You are employing a **Moorean Shift**: *I know common sense is true; therefore, any theory contradicting it is false.*

  The extremists (Universalists like David Lewis, Ted Sider; Nihilists like Peter van Inwagen [regarding artifacts], Trenton Merricks) reject this move. Here is why they persist, and why their views are taken seriously:

  **The Case for Universalism (Unrestricted Composition):**
  *   **Avoiding Arbitrariness:** The Universalist asks: "Why is *this* arrangement of atoms (the table) special, but *that* arrangement (the shoe-tower) isn't?" If you say "because of grip," they ask "why is grip the magic maker of existence?"
  *   **Solving Vagueness:** Universalism offers a crisp, clean ontology. Composition *never* happens vaguely. It happens always. This makes logic and semantics much easier to handle.
  *   **Existence is Cheap:** They argue that believing in a "trout-turkey" (the fusion of a trout and a turkey) doesn't cost you anything extra. You already believe in the trout and the turkey. The "fusion" is just a logical consequence of admitting those two exist. It's ontologically free.
  *   **The Counter to Common Sense:** They argue common sense is a heuristic for survival, not a detector of fundamental ontology. Common sense once told us the sun goes around the earth.

  **The Case for Nihilism (No Composite Objects):**
  *   **Parsimony:** Why posit tables *and* atoms? If you can explain all our experiences by just referring to "simples arranged table-wise," why add the "table" to your inventory of the universe?
  *   **The Problem of Material Constitution:** If a statue is made of clay, and you squash the statue, is the clay gone? If the statue and clay are two objects in the same place, how do they differ? Nihilism dissolves this puzzle: there are only simples. There is no statue, there is no clay-mass, there are only simples arranged statue-wise.
  *   **Defense of Common Sense (sort of):** Some Nihilists argue they are respecting common sense better than Universalists. Common sense says there are *some* objects (people, dogs), but not *every* bunch of things. Nihilism at least respects the intuition that existence is restrictive, even if it restricts it too much.

  **The Real Debate:** It isn't Common Sense vs. Theory. It is **Theoretical Virtues (precision, parsimony, logic)** vs. **Intuitive Fit**. The extremists prioritize a clean, rigorous metaphysical system. You are prioritizing the phenomenological fit with everyday experience. Neither side thinks they are "wrong"; they weigh the costs differently.

  ### 3. Does the answer have to be one single rule? (Monism vs. Pluralism)

  You noted: *"Everyone writes as if it has to be one rule... I've never seen that defended."*

  Actually, this assumption *has* been defended, but it is currently under heavy fire. You have spotted a genuine tension in the literature.

  **Why Monism (One Rule) Dominates:**
  *   **Fundamentality:** Most metaphysicians believe composition is a **fundamental** relation. If it's fundamental, it shouldn't vary depending on what kind of stuff is involved. Gravity works the same on iron and wood. If composition is a basic feature of reality, why would it work one way for organisms and another for artifacts?
  *   **The "Bruteness" Worry:** If you say "Organisms compose via Life, Artifacts via Intention, Heaps via Contact," you haven't really solved the SCQ. You've just pushed it back. Now we have to ask: "What is Life?" and "What is Intention?" You've traded one mystery for three.
  *   **Sider's Argument:** Ted Sider argues that if composition varies by kind, then the quantifier ("there exists") is vague or restricted in a way that makes logic messy. He argues for a "joint-carving" quantifier that must be uniform.

  **The Rise of Pluralism:**
  However, you are right to question this. In the last 15 years, **Mereological Pluralism** has gained significant traction (defended by philosophers like Kris McDaniel, Ned Markosian, and others).
  *   **The Argument:** Why think reality is so simple? Maybe composition *isn't* fundamental. Maybe "existence" is analogical. A table exists in a different *way* than a person exists.
  *   **The Benefit:** It saves your Grip Principle for artifacts (fastening) while allowing a "Life Principle" for organisms (van Inwagen's view) without contradiction.
  *   **The Cost:** It makes metaphysics much more complicated. It suggests there is no single "answer" to the SCQ, but rather a family of answers.

  **My Assessment:**
  The assumption that there must be *one* rule is a hangover from the desire for a "God's eye view" of ontology—a single, elegant equation for reality. But as you suspect, reality might be messier. If you adopt Pluralism, your Grip Principle becomes much more defensible. You can say: "For artifacts, composition requires Grip. For organisms, it requires Life. For the Shoe+Tower, neither applies."

  ### Summary of the State of Play

  1.  **Your Principle:** It is the standard Moderate Restrictivist intuition. It fails technically because "grip" is vague and gradable, leading to the Sorites paradox.
  2.  **The Extremists:** They aren't ignoring common sense; they are overruling it in favor of theoretical precision and logical cleanliness. They believe common sense is a poor guide to fundamental structure.
  3.  **One Rule vs. Many:** The "One Rule" assumption is motivated by a desire for fundamentality, but Pluralism is a growing, viable alternative that might actually accommodate your intuition best.

  If you want to defend the Grip Principle seriously, I would suggest pivoting to **Mereological Pluralism**. That allows you to keep the "Grip" for tables without having to explain why a galaxy (held by gravity) or a person (held by biology) fits the exact same criteria. It admits that our ontology might be a patchwork, not a monolith.
