answer: |-
  This is a high-leverage niche. Most work on Goodhart's law focuses on economic output or ML alignment, leaving the degradation of *epistemic quality* in democratic institutions undertheorized. For a tiny team of three theorists over two years, you need questions that are foundational enough to shift the paradigm but narrow enough to be solved without empirical data.

  Here are the three most critical conceptual questions, ranked by upstream importance.

  ### 1. The Non-Proxy Definability Problem
  **Question:** Can epistemic virtues (like reflective equilibrium or justified consensus) be operationalized independently of the behavioral proxies (like voting records or speed of agreement) used to measure them?

  **Why it is upstream:**
  This is the metaphysical and epistemological foundation of the entire project. If the only way to identify "justified consensus" is by observing "agreement," then Goodhart's law is not just a risk; it is a tautology. You cannot claim a proxy is corrupting the target if the target is ontologically dependent on the proxy. If you cannot define the virtue without referencing the behavior, any attempt to fix the metric is doomed because you have no ground to stand on to say the metric failed. You must establish that the virtue exists as a distinct conceptual object that can, in principle, diverge from the proxy.

  **Tractability for theorists:**
  High. This is pure conceptual analysis. Your team can use thought experiments, historical case studies (e.g., consensus reached via coercion vs. reason), and engagement with epistemology literature (e.g., externalism vs. internalism) to construct a definition of epistemic virtue that relies on the *structure of justification* rather than the *outcome of agreement*. You do not need experiments to argue that a unanimous vote reached under threat is not "justified consensus."

  **What would change the ranking:**
  If a prominent epistemologist or political theorist publishes a rigorous proof or argument demonstrating that epistemic virtues are *essentially* contested and only intelligible through their behavioral manifestations, this question becomes a dead end. If it turns out "truth-tracking" is impossible to define without looking at "success rates," you must downgrade this question and move immediately to damage control (Question 3).

  ### 2. The Taxonomy of Deliberative Corruption
  **Question:** What are the specific causal mechanisms by which optimizing for procedural efficiency (speed, turnout) degrades epistemic quality (depth, truth-tracking)?

  **Why it is upstream:**
  Once you have defined the target independently (Question 1), you need to know how the proxy breaks it. "Goodhart's Law" is too vague for institutional design. You need a mechanistic model. Does optimizing for speed encourage rhetorical manipulation? Does optimizing for turnout incentivize polarization to mobilize bases? Without a taxonomy of *how* the corruption happens, you cannot design rules to stop it. This question bridges the gap between the abstract definition of virtue and the concrete rules of the institution.

  **Tractability for theorists:**
  High. This requires modeling incentives and analyzing existing political theory. You can use formal social choice theory or game-theoretic models to show how rational actors would game a "speed of agreement" metric. You can also analyze historical deliberative bodies (e.g., constitutional conventions) to identify where procedural pressure led to epistemic failure. This is theoretical work that does not require running new human subjects experiments.

  **What would change the ranking:**
  If empirical political science research emerges showing that procedural metrics (like turnout) are actually *more* correlated with epistemic quality than previously thought, the urgency of mapping corruption mechanisms decreases. Alternatively, if a new form of corruption emerges (e.g., AI-generated testimony) that renders existing theoretical models of rhetoric obsolete, you would need to pivot to addressing that specific technological threat rather than general mechanisms.

  ### 3. The Feasibility of Process-Based Evaluation
  **Question:** Can we design institutional rules that evaluate the *quality of disagreement* rather than the *outcome of agreement* to create robust metrics?

  **Why it is downstream:**
  This is the solution phase. You can only design a metric that values "quality of disagreement" if you have first defined what epistemic virtue is (Question 1) and understood how standard proxies corrupt it (Question 2). If you attempt this first, you risk designing a new proxy (e.g., "number of counter-arguments raised") that simply becomes the new target to be gamed (e.g., raising frivolous objections). This question is about second-order design: creating metrics that are costly to game without sacrificing the true goal.

  **Tractability for theorists:**
  Medium. This requires normative institutional design. You can propose constitutional rules or deliberative protocols and argue theoretically why they are more robust. However, without experiments, you cannot prove they work in practice, only that they are coherent and theoretically sound. For a philosophy team, this is still tractable as a contribution to normative theory, even if empirical validation is left to others.

  **What would change the ranking:**
  If a real-world institution (e.g., a citizen's assembly or a tech governance board) successfully implements a process-based metric and publishes data showing it resist gaming, this question moves to #1. Practical proof of concept would make the theoretical work less urgent than scaling and refining the successful model. Conversely, if it is proven logically that *any* observable metric is vulnerable to spec gaming, the focus would shift from design to accepting inevitable degradation and building resilience instead.

  ### Strategic Summary for the Grant
  Start with **Question 1**. If you cannot solve the definitional problem, the rest of the grant is building a house on sand. Spend the first six months securing a definition of epistemic virtue that stands apart from behavioral proxies. Then move to **Question 2** to map the failure modes. Use the final year for **Question 3**, proposing normative designs that utilize your new definitions and mechanistic insights. This flow ensures that even if you don't solve the design problem, you will have made a lasting contribution to the conceptual foundations of deliberative democracy.
