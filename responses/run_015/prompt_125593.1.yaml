answer: |-
  ### Decision Tree: Epistemic Conflict and Truth-Value Taxonomy

  **Instructions:** Start at Node 1. Answer each question based on your philosophical intuitions regarding conflicting authoritative claims (e.g., perception vs. scripture). Follow the branch corresponding to your answer until you reach a leaf position.

  **Node 1:** When two valid epistemic sources (e.g., direct perception vs. scriptural testimony) yield contradictory propositions about the same subject, does this contradiction entail that at least one source is fundamentally erroneous?
  *   **YES:** → **Leaf A: Hardline Ekāntavāda (Absolutism)**
  *   **NO:** → Go to Node 2.

  **Node 2:** If both sources can be valid, is the multiplicity of truth located primarily in the object itself (ontological complexity), or only in the limitations of the knower (epistemic humility)?
  *   **KNOWER ONLY:** → **Leaf B: Moderate Pluralist** (Restricts many-sidedness to non-moral empirical claims where human error is likely).
  *   **OBJECT ITSELF:** → Go to Node 3.

  **Node 3:** Does this multi-valued validity extend to normative ethical claims (e.g., whether a specific action constitutes violence or *ahiṃsā*)?
  *   **YES:** → **Leaf C: Unheld View (Ethical Relativism)** — *Flag: Unattractive, as it undermines the soteriological necessity of non-violence central to the tradition.*
  *   **NO:** → Go to Node 4.

  **Node 4:** Does this multi-valued validity extend to formal logical or mathematical truths (e.g., the law of non-contradiction or arithmetic identities)?
  *   **YES:** → **Leaf D: Unheld View (Logical Relativism)** — *Flag: Incoherent, as it collapses the logical framework required to assert pluralism itself.*
  *   **NO:** → Go to Node 5.

  **Node 5:** Does this multi-valued validity extend to immediate first-person phenomenological reports (e.g., "I am feeling pain")?
  *   **YES:** → **Leaf E: Radical Contextualist** (Extends conditioned predication to self-evident conscious states).
  *   **NO:** → Go to Node 6.

  **Node 6:** When asserting contradictory predicates (e.g., "it exists" and "it does not exist"), must they be asserted successively across different standpoints, or can they be asserted simultaneously of the same aspect?
  *   **SIMULTANEOUSLY:** → **Leaf F: Unheld View (Contradictory Realism)** — *Flag: Incoherent, as it violates the basic operational rules of rational discourse.*
  *   **SUCCESSIVELY:** → Go to Node 7.

  **Node 7:** Is the conditioning of these truth claims governed by a fixed, exhaustive set of logical operators (e.g., existence, non-existence, inexpressibility)?
  *   **NO:** → **Leaf G: Unheld View (Unstructured Contextualism)** — *Flag: Unattractive, as it lacks the rigorous diagnostic utility of a fixed schema.*
  *   **YES:** → Go to Node 8.

  **Node 8:** Does a complete description of reality require asserting all seven predications sequentially, or is a subset of standpoints sufficient for truth?
  *   **SUBSET:** → **Leaf H: Unheld View (Partial Syādvāda)** — *Flag: Unexplored, as traditional commentators view partial assertion as analytically incomplete.*
  *   **ALL SEVEN:** → Go to Node 9.

  **Node 9:** Is there a final state of knowledge (omniscience) where all contradictions are resolved into a single, ineffable absolute truth?
  *   **NO:** → **Leaf I: Unheld View (Secular Pluralism)** — *Flag: Unexplored, as it secularizes the framework beyond its intended soteriological goal.*
