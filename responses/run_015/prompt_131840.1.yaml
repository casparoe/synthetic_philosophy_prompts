answer: |-
  The self-locating reading earns its keep not by mapping Leonard onto Beauty directly, but by exposing the normative gap between *having* evidence and *trusting* evidence generated by a discontinuous self, transforming the problem from one of credence calculation to one of diachronic agency.

  The disanalogy you identify is structural: Sleeping Beauty's uncertainty is purely *de se* (which awakening is this?), while Leonard's appears *de dicto* (what happened yesterday?). Beauty knows the experimental protocol; Leonard knows only that his protocol is leaky. However, the self-locating apparatus survives if we treat Leonard's "awakenings" as moments of consulting his system. For Leonard, "What happened?" is accessible only via "Where am I in the sequence of notes?" A tattoo reading "Fact 6" functions indexically: it means "I am at the stage where I have established Fact 6." The crucial shift is that Leonard's evidence is not memory (direct access) nor testimony (external access), but *self-testimony*. The epistemic question becomes whether a note from a past self binds a future self with the authority of memory or the fragility of testimony. If the latter, Leonard is not merely locating himself; he is evaluating the reliability of a channel where the sender and receiver are numerically distinct but normatively identical. The analogy holds not because Leonard is Beauty, but because both are agents whose credences must adjust to evidence produced by a process they cannot internally monitor.

  Your "Forged-Note Beauty" case isolates the variable of channel reliability. Let $H$ and $T$ denote Heads and Tails, and $E$ be the evidence of finding the card.
  Under the **Thirder rule** (Self-Indication Assumption), priors are distributed over centered worlds: $P(H, A1) = 1/3$, $P(T, A1) = 1/3$, $P(T, A2) = 1/3$.
  The likelihoods of $E$ are: $P(E|H, A1) = p$; $P(E|T, A1) = p$; $P(E|T, A2) = 1$.
  The posterior credence in Tails is:
  $$P(T|E) = \frac{p(1/3) + 1(1/3)}{p(1/3) + p(1/3) + 1(1/3)} = \frac{1+p}{1+2p}$$
  Under the **Halfer rule** (Self-Sampling Assumption over actual awakenings), priors are $P(H)=1/2, P(T)=1/2$.
  The likelihoods are: $P(E|H) = p$; $P(E|T) = (p+1)/2$ (the average probability across the two awakenings in $T$).
  The posterior credence in Tails is:
  $$P(T|E) = \frac{0.5 \times \frac{1+p}{2}}{0.5 \times \frac{1+p}{2} + 0.5 \times p} = \frac{1+p}{1+3p}$$
  At the limit $p=0$ (infallible card), both converge to 1. At $p=1$ (useless card), they diverge to their baselines ($2/3$ vs $1/2$). The gap widens as $p$ increases; the Thirder remains more sensitive to the card because the card is more likely to exist in a world with more awakenings. The moral is that the evidential force derives entirely from the policy governing the channel, not the source's identity. That the note comes from "me" is epistemically inert; what matters is the statistical correlation between the note's presence and the world-state. However, when the agent sets the policy themselves, the distinction between source and channel collapses, creating a vulnerability where the past self can manipulate the future self's credences by adjusting $p$.

  Applying this to *Memento*, the tattoos and Polaroids are the "cards." They claim objective fact but are subject to the forgery parameter $p$. In the scene where Leonard burns the photograph of the man he believes he has killed, he is not merely destroying evidence; he is severing the link between his current state and his past actions, effectively resetting $p$ for that specific proposition. The Sammy Jankis subplot introduces the hypothesis that $p=1$ universally—that Leonard's system is entirely forged, either by others or by his own confabulation. If Leonard is Sammy, every note is a forgery, and self-locating belief becomes impossible.

  The closing stretch offers the hardest version of the problem. Leonard is told by Teddy that the revenge is complete and the investigation finished. He rejects this, writes down Teddy's license plate as a "Fact," and conditions himself to hunt Teddy again. Here, Leonard deliberately sets $p=1$ for a false belief for his future self. This is not straightforward self-deception, nor is it merely the absent-minded driver problem (where the agent forgets which exit they are at). It is a policy choice to make future centered evidence *less* informative to preserve agency. Leonard recognizes that accurate self-location (knowing the quest is over) entails the cessation of action. To remain an agent, he must ensure his future self occupies a centered world where the quest is ongoing. He engineers a "Forged-Note" scenario for himself, choosing a lower credence in the truth to maintain the utility of his existence. This suggests that a purely credal treatment of self-locating belief runs out; it must be supplemented by a pragmatic account of why an agent would choose to inhabit a specific epistemic state.

  Your worry is correct: Sleeping Beauty assumes settled non-indexical facts (the coin is fair), whereas the film is agnostic about the truth of Teddy's revelation. This makes *Memento* a poor illustration of the *calculation* problem but a superior illustration of the *structural* problem. In the literature, the inability to self-locate is an externally imposed handicap; in the film, it is a technology the agent builds against and eventually sabotages. The film adds a normative dimension the literature lacks: the ethics of self-locating belief. It asks not just what credence is rational, but whether an agent is permitted to manipulate the conditions of their own self-location to sustain a life project. The agnosticism is not fatal; it shifts the focus from finding the correct number to evaluating the cost of knowing it.
