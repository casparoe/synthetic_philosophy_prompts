  You're both partially wrong. Your heuristic is a pragmatic hack, but arbitrary. Why 30? It discards data and ignores conflicting signals (e.g., age vs. fitness). Your mate is misleading: Bayesians aren't immune. Priors help, but likelihood specification still faces the reference class issue. However, hierarchical Bayesian models *do* solve this better than hard cutoffs.

  The tool should use partial pooling (hierarchical modeling). Treat attributes as predictors, not class definitions. This borrows strength from broader groups without discarding data, shrinking estimates toward the mean when specific data is sparse. This handles the "41-year-old woman" vs. "all climbers" tension continuously, not binary.

  **What changes my mind:** Empirical evidence that hard cutoffs outperform regularized regression in small-data mortality prediction.

  **Where I break:** I'm assuming clean, structured data. If records are biased (e.g., only successful rescues recorded), any model fails.
