answer: |-
  # Desiderata for a Metaphysical Theory of Dispositional Properties

  The following specification outlines the requirements for an adequate metaphysical theory of dispositions. These criteria are derived from the standard literature (Lewis, Martin, Bird, Mumford, etc.) and are intended to be neutral between categoricalist and powers-based ontologies. The goal is to define the problem space before evaluating solutions, particularly in light of applications to complex systems (such as cognitive agents or LLMs) where the distinction between genuine capacity and simulation is critical.

  ## I. Core Desiderata

  ### 1. Extensional Adequacy in Interference Cases
  *   **The Requirement:** The theory must assign the correct truth values to disposition ascriptions in cases where the standard stimulus-manifestation link is disrupted. It must correctly identify that the disposition *exists* despite the failure of the manifestation.
  *   **Motivating Cases:**
      *   **Finks:** A live wire is disposed to conduct when touched. A "finkish" mechanism detects touching and instantly renders the wire dead *before* conduction occurs. (Intuition: The wire *was* conductive, but the disposition vanished upon stimulus).
      *   **Masks:** A poison is disposed to kill when ingested. An antidote is present in the bloodstream that neutralizes the toxin immediately. (Intuition: The poison retains its disposition to kill, but the manifestation is blocked).
  *   **Status:** **Non-negotiable.** Any theory that cannot distinguish these cases from genuine absence of disposition fails extensionally.
  *   **Tension:** This places heavy pressure on Simple Conditional Analyses (SCA).

  ### 2. The Mask/Loss Distinction
  *   **The Requirement:** The theory must provide a principled metaphysical distinction between a disposition being *masked* (present but blocked) and a disposition being *lost/destroyed* (absent).
  *   **Motivating Case:** A glass is fragile. If wrapped in bubble wrap, it is masked (still fragile, won't break when struck). If heated to annealing point, it loses fragility (not fragile, won't break when struck). The counterfactual "if struck, it would break" is false in both cases.
  *   **Status:** **Non-negotiable.** Without this, the theory cannot account for stability of properties across changing environmental conditions.
  *   **Tension:** Requires a commitment to the persistence of the property independent of its manifestation conditions.

  ### 3. Specification of the Categorical Basis
  *   **The Requirement:** The theory must specify whether dispositions require a non-dispositional (categorical) base, or if they can be fundamental/ungrounded.
  *   **Motivating Case:** What makes the wire conductive? Is it the microphysical structure (categorical base) or is the conductivity itself fundamental?
  *   **Status:** **Contested (Camp Preference).**
      *   *Categoricalists (e.g., Lewis):* Require a non-dispositional base to avoid regress and ground truthmakers.
      *   *Dispositional Essentialists (e.g., Bird, Ellis):* Reject categorical bases; properties are purely powers.
      *   *Identity Theorists (e.g., Martin, Heil):* Properties are identical to their categorical and dispositional aspects (Limit View).
  *   **Tension:** **Jointly Unsatisfiable Pair:** *Pure Intrinsicness* vs. *Extrinsic Finkish Bases.* If one demands dispositions be purely intrinsic to the bearer, but admits finks can be extrinsic interferers that remove the disposition instantly, one must explain how an intrinsic property vanishes due to an extrinsic cause without causal mediation that takes time. Lewis solves this by indexing the base to the time of stimulus; Powers theorists solve this by distinguishing the *power* from its *exercise*.

  ### 4. Counterfactual Connection (Without Reduction)
  *   **The Requirement:** The theory must explain *why* dispositions support counterfactuals ("if C, then M") without reducing the disposition *to* the counterfactual.
  *   **Motivating Case:** We assert "This is soluble" because we believe "If immersed, it would dissolve." But as Finks show, the counterfactual can be false while the disposition is true.
  *   **Status:** **Non-negotiable.** The link is evidential and explanatory, even if not definitional.
  *   **Tension:** **Jointly Unsatisfiable Pair:** *Non-Circular Analysis* vs. *Counterfactual Reduction.* If laws of nature are analyzed via dispositions (as Powers theorists claim), and counterfactuals are analyzed via laws, one cannot analyze dispositions via counterfactuals without circularity. One must be fundamental.

  ### 5. Multi-Track Unity
  *   **The Requirement:** The theory must account for single dispositions that have multiple distinct stimulus/manifestation pairs.
  *   **Motivating Case:** "Fragility" might manifest as shattering when struck, cracking when heated, or crumbling when compressed. Are these one disposition or a cluster of distinct dispositions?
  *   **Status:** **Contested.**
      *   *Determinable View:* Fragility is a higher-order property unifying specific powers.
      *   *Cluster View:* There is no single "fragility," only a set of specific conditional powers.
  *   **Tension:** High unity risks vagueness; low unity risks proliferating properties endlessly.

  ### 6. Intrinsicness of the Disposition
  *   **The Requirement:** The theory must declare whether the disposition is intrinsic to the object or extrinsic (relational).
  *   **Motivating Case:** Lewis argues dispositions must be intrinsic to avoid "magic" (e.g., a wizard making a wire non-conductive from afar shouldn't change the wire's intrinsic nature). However, some argue dispositions are essentially relational (to a stimulus).
  *   **Status:** **Contested (Camp Preference).**
      *   *Lewisian:* Strong preference for intrinsicness.
      *   *Powers Ontology:* Generally intrinsic (the power is in the object), but the *relation* to the manifestation is external.
      *   *Extrinsic Dispositions:* Some argue certain dispositions (e.g., "being a key") are inherently extrinsic.
  *   **Tension:** **Jointly Unsatisfiable Pair:** *Strict Intrinsicness* vs. *Extrinsic Masking/Finking.* If a disposition is intrinsic, how can an extrinsic factor (antidote in the environment) mask it without altering the intrinsic base? Theories must choose: either the mask alters the base (making it extrinsic), or the disposition is not purely intrinsic.

  ## II. The Nested Mask Extension

  **The Case:** A disposition $D$ is masked by $M_1$. However, $M_1$ is itself disposed to be neutralized by trigger $T_2$ (a "mask of the mask"). If $T_2$ occurs, $M_1$ is removed, and $D$ manifests upon stimulus $C$.
  *Example:* A poison ($D$) is neutralized by an antidote ($M_1$). However, the antidote is unstable and degrades upon exposure to UV light ($T_2$). If UV light is present, the poison kills.

  **Desideratum Status:** **Robustness Stress Test (Preference).**
  *   **Argument for Inclusion:** A complete theory of dispositions should handle iterative causal structures without regress. In complex systems (biology, AI safety, engineering), second-order controls are common. If a theory solves masks by positing a "total cause" condition, it must show how that condition handles recursive blocking.
  *   **Argument for Exclusion:** This may be derivative. If a theory solves the standard Mask case by appealing to the *causal basis* remaining intact, nested masks are just complex causal chains. It does not introduce a new metaphysical category, only combinatorial complexity.
  *   **Verdict:** It is not a core axiom, but a theory that collapses under nested masks (e.g., by requiring a finite list of "no-interferers" clauses) is inadequate for dynamic systems. Accommodating it is a mark of **systematic completeness**, not truth.

  ## III. Contender Scorecard (Brief)

  *Weight is on the criteria above; this is a diagnostic summary.*

  | Theory | Finks/Masks | Mask/Loss Distinction | Categorical Base | Counterfactual Link | Intrinsicness | Nested Masks |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Naive SCA** | **Fail.** (Defines D via C$\to$M) | **Fail.** (No distinction) | Neutral | **Pass** (By definition) | Variable | **Fail.** |
  | **Lewis (Reformed)** | **Pass.** (Via Causal Basis at time $t$) | **Pass.** (Base persists in masks) | **Required** (Categorical base) | **Pass.** (Derived from base + laws) | **Strict** (Intrinsic base) | **Pass.** (Complex base conditions) |
  | **Dispositional Essentialism** | **Pass.** (Interference doesn't remove power) | **Pass.** (Power distinct from exercise) | **Rejected** (Powers fundamental) | **Pass.** (Grounds the counterfactual) | **Mostly** (Intrinsic power) | **Pass.** (Causal chains of powers) |
  | **Powers Ontology (Martin/Heil)** | **Pass.** (Mutual manifestation partners) | **Pass.** (Partners missing vs. power gone) | **Rejected** (Identity View) | **Pass.** (Counterfactuals track powers) | **Strict** (Properties are modes) | **Pass.** (Network of powers) |

  ## IV. Settled vs. Contested Map

  To ensure neutrality, it is vital to distinguish where the literature has converged from where it remains dialectically open.

  **Settled Consensus:**
  1.  **The Simple Conditional Analysis (SCA) is false.** No serious contemporary metaphysician defends $D \leftrightarrow (C \square\rightarrow M)$ without significant emendation.
  2.  **Finks and Masks are possible.** Thought experiments involving wizards, antidotes, and circuit breakers are accepted as valid constraints on theory.
  3.  **Dispositions are causally relevant.** They are not merely linguistic conveniences; they do work in explanations.

  **Genuinely Contested:**
  1.  **The Need for a Categorical Base.** Is there a "quiddity" underlying the power, or is the universe purely powers all the way down? (Categoricalism vs. Dispositional Monism).
  2.  **The Nature of the Connection.** Do dispositions *necessitate* their manifestations (given the stimulus), or is the connection contingent? (Necessitarianism vs. Humeanism).
  3.  **Intrinsicness.** Must the bearer of the disposition contain the entire truthmaker for the disposition, or can dispositions be essentially relational?
  4.  **Analysis vs. Primitivism.** Can dispositions be analyzed in non-dispositional terms (Lewis), or must they be taken as primitive (Powers theorists)?

  ## V. Summary of Tensions

  For a theory to be adequate, it must navigate the following trade-offs explicitly:

  1.  **Precision vs. Flexibility:** To solve Finks, Lewis introduces time-indexed causal bases. This gains precision but risks making dispositions so specific they lose explanatory generality (the "multi-track" problem).
  2.  **Intrinsicness vs. Extrinsic Interference:** Preserving the intuition that "the wire is conductive" (intrinsic) while admitting "the wizard makes it dead" (extrinsic) requires a complex account of how extrinsic factors interact with intrinsic bases. A theory that makes dispositions extrinsic solves Finks easily but loses the intuition that properties belong to objects.
  3.  **Circularity vs. Reduction:** If you want to reduce dispositions to counterfactuals, you likely need categorical bases. If you want powers to ground laws, you cannot reduce powers to counterfactuals. You must choose your primitive.

  **Final Note on Nested Masks:** While not a core metaphysical axiom, the ability to handle nested masks without ad-hoc clauses is a strong indicator of whether a theory treats dispositions as **structural features of reality** (robust) or **logical constructs** (fragile). For applications involving AI or cognitive systems, where "masking" (e.g., safety filters) and "unmasking" (e.g., jailbreaks) are dynamic processes, a theory that treats masks as static logical conditions will fail. A causal/power-based theory is better suited for this extension.
