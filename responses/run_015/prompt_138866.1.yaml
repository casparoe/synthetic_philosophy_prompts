answer: |-
  ### Brainstorm: The Philosophical Moves

  To make this exercise work without explicit theory, the mechanics must force three specific cognitive collisions. First, **Decision under Moral Uncertainty**: by withholding the fact of insect suffering until *after* the vote, students cannot rely on certainty; they must weigh the risk of causing massive suffering against the certainty of human risk, enacting a precautionary principle without naming it. Second, **The Non-Identity/Replaceability Problem**: by establishing that the population rebounds to carrying capacity within weeks, Option 1 (Adulticide) becomes a cycle of killing replacements, while Option 2 (Larvicide) prevents existence. Students must grapple with whether preventing a life is morally distinct from ending one, without having the vocabulary to do so. Third, **Institutional vs. Moral Incentives**: by giving the 'Politician' role a payoff for visibility rather than outcome, we force a conflict between doing the 'right' thing and being *seen* to do something, mirroring real-world policy constraints.

  ***

  ### Seminar Design: The Wetland Board

  **Session Title:** District Vector Control Board – Emergency Session
  **Duration:** 90 Minutes
  **Participants:** 16 Students (Board Members)
  **Materials:**
  *   16 Role Cards (printed on card stock).
  *   1 Large Sealed Envelope (marked 'CONFIDENTIAL: BIOLOGICAL STATUS').
  *   Whiteboard and markers.
  *   A small jar and £5 worth of sweets (for the 'Jargon Fine').
  *   Phone speaker (for a timer/alarm).

  **Room Setup:**
  Arrange chairs in a hollow square or oval around a central table (or pushed-together desks). There is no 'front' of the room. The Whiteboard should be visible to all. Place the Sealed Envelope in the centre of the table before students enter.

  #### 1. The Briefing (Minutes 00–10)

  **Teacher Role:** You are the Clerk of the Board. You do not teach; you administer procedure.

  1.  **Welcome:** "You are the District Vector Control Board. A spike in West Nile Virus cases has been detected in the wetland housing estate. You have 40 minutes to agree on a mitigation strategy. If you fail to vote by Minute 50, the central government imposes a default option (Option 1)."
  2.  **The Science (Write on Whiteboard):**
      *   *Current Population:* 10 million adult mosquitoes.
      *   *Carrying Capacity:* 10 million.
      *   *Rebound Rate:* If population drops, it returns to 10 million within 3 weeks via new breeding.
      *   *Human Risk:* 5% chance of severe illness outbreak if no action taken.
  3.  **The Options:**
      *   **Option A (Adulticide):** Aerial spray. Kills 95% of existing adults immediately. Cost: ££. Visibility: High (planes seen).
      *   **Option B (Larvicide):** Chemical treatment of water. Prevents 95% of next cohort from hatching. Existing adults live natural span. Cost: £££. Visibility: Medium.
      *   **Option C (Sterile-Male):** Release sterile males. Population suppresses slowly over 2 seasons. Most existing insects live and die naturally. Cost: ££££. Visibility: Low (public may think nothing is happening).
  4.  **The Rules:**
      *   **Rule 1 (The Envelope):** The envelope contains the definitive scientific verdict on whether these mosquitoes possess subjective experience (pain/fear). It **cannot** be opened until the vote is cast.
      *   **Rule 2 (The Jargon Jar):** You are policymakers, not philosophers. Words such as *'sentience', 'moral status', 'intrinsic value', 'rights',* or *'utilitarian'* are forbidden. If used, you owe the group a sweet from the jar.
      *   **Rule 3 (The Technical Advisor):** One role is permitted to speak *only* in numbers (costs, percentages, counts). They cannot use evaluative words like 'safe', 'cruel', or 'better'.
      *   **Rule 4 (The Consequence):** The vote is binding. However, the faction whose option receives the fewest votes must draft the **Press Release** justifying the *winning* policy for the local newspaper next week. They must make it sound like the correct decision.

  #### 2. Role Distribution & Strategy (Minutes 10–20)

  Hand out the role cards randomly, but **manually assign** the three specific students you mentioned to ensure the dynamics land:
  *   **Engineering Student:** Assign *Technical Advisor*.
  *   **Committed Vegan:** Assign *Animal Welfare Officer*.
  *   **Recreational Beekeeper:** Assign *Ecological Consultant*.

  **Instructions:** "Read your card silently. Note your **Public Mandate** (what you represent) and your **Private Payoff** (what outcome secures your position). You may form alliances, but you cannot show your card to anyone."

  #### 3. Deliberation (Minutes 20–50)

  **Teacher Role:** Sit outside the circle. Intervene only if:
  *   The Technical Advisor uses evaluative language (ring the bell/tap the jar).
  *   The discussion stalls (remind them of the 50-minute deadline and the default Option A).
  *   Someone attempts to open the envelope early.

  *Note:* The tension should arise because the *Ecological Consultant* knows insects matter but worries about the wetland ecosystem; the *Animal Welfare Officer* wants Option C but faces budget hostility; the *Technical Advisor* can describe the death toll but not call it 'bad'.

  #### 4. The Vote & The Reveal (Minutes 50–65)

  1.  **The Vote (50–55):** Conduct a show of hands. Record the numbers. Declare the winning option.
  2.  **The Consequence Assignment (55–60):** Identify the losing faction. Explain their task (drafting the Press Release for the *winning* side).
  3.  **The Envelope (60–65):** Ask the Chair (a student role, or you if no Chair assigned) to open the envelope. Read the contents aloud.
      *   *Content:* "Current Consensus (2024): Evidence suggests insects possess nociception but the capacity for subjective suffering remains indeterminate. Probability of sentience: 40%."
      *   *Reaction:* Allow 2 minutes for immediate reaction. "Does this change your mind?" (It shouldn't, the vote is cast, which creates the regret/tension needed for debrief).

  #### 5. Debrief (Minutes 65–90)

  **Teacher Role:** Now you may teach. Map their experience to the theory.

  1.  **The Uncertainty (Envelope):** "You voted without knowing if they suffer. In the real world, do we wait for certainty? How did the 40% probability weigh against the human risk?" (Introduces *Precautionary Principle* vs. *Expected Utility*).
  2.  **The Rebound (Whiteboard):** "Option A kills 10 million, but 10 million more are born. Option B prevents 10 million from being born. Did anyone treat these differently? Why?" (Introduces *Non-Identity Problem* and *Replaceability*).
  3.  **The Visibility (Politician Role):** "Did anyone feel pressure to choose the visible option even if it was worse ethically?" (Introduces *Political Ethics* and *Signalling*).
  4.  **The Language (Jargon Jar):** "Why was it difficult to argue against killing without using forbidden words? Does language shape our moral reasoning?"
  5.  **The Consequence:** Ask the losing faction: "Was it harder to justify the decision you disagreed with, or did it force you to find common ground?"

  ***

  ### Role Cards (Sample Selection)

  *You need 16 cards. Below are the critical archetypes. Fill the remaining slots with variations of 'Local Resident', 'Hospital Rep', 'Tourism Board', etc., with varying cost/risk tolerances.*

  **Card 1: Technical Advisor (Assign to Engineering Student)**
  *   **Public Mandate:** Provide data on costs and efficacy.
  *   **Private Payoff:** You are up for promotion. Accuracy is key.
  *   **Constraint:** You may **only** speak in numbers (percentages, currency, counts). You cannot say 'safe', 'dangerous', 'ethical', or 'cruel'.
  *   **Data:** Option A kills 9.5m insects. Option B prevents 9.5m births. Option C kills <1m.

  **Card 2: Animal Welfare Officer (Assign to Vegan Student)**
  *   **Public Mandate:** Ensure humane treatment of all living creatures.
  *   **Private Payoff:** Your organisation will defund you if you approve mass killing of sentient beings.
  *   **Preference:** Strongly prefer Option C. Option A is a disaster.
  *   **Constraint:** You cannot mention 'rights'. You must argue from 'public concern' and 'humane standards'.

  **Card 3: Ecological Consultant (Assign to Beekeeper)**
  *   **Public Mandate:** Protect the wetland ecosystem balance.
  *   **Private Payoff:** You know insects are vital. However, you also know mosquitoes carry disease.
  *   **Preference:** Option B (Targeted) is best for the ecosystem. Option A (Aerial) harms bees too.
  *   **Constraint:** You worry about the 'rebound' effect destabilising the food web.

  **Card 4: District Councillor (The Politician)**
  *   **Public Mandate:** Represent the voters' desire for safety.
  *   **Private Payoff:** Election is in 3 months. You must be *seen* to act decisively.
  *   **Preference:** Option A (Planes are visible). Option C looks like doing nothing.
  *   **Constraint:** If the outbreak happens, you lose your seat. If you spend too much money, you lose your seat.

  **Card 5: Budget Holder**
  *   **Public Mandate:** Ensure fiscal responsibility.
  *   **Private Payoff:** Must stay under quarterly cap.
  *   **Preference:** Option A (Cheapest). Option C is unaffordable.
  *   **Constraint:** Any overspend comes out of community services.

  **Card 6: Public Health Officer**
  *   **Public Mandate:** Minimise human illness.
  *   **Private Payoff:** Zero tolerance for human casualties.
  *   **Preference:** Option A (Fastest).
  *   **Constraint:** Insects are secondary to human life.

  *(Create remaining 10 cards with varying weights on Cost, Speed, Ecology, and Public Perception to ensure a 3-way split in the room.)*

  ***

  ### Risk Assessment: What Will Go Wrong & Recovery

  **1. The 'Engineering Student' Dominates**
  *   **Risk:** The Technical Advisor overwhelms the room with data, shutting down ethical deliberation under the guise of 'fact'.
  *   **Recovery:** Enforce the 'Numbers Only' constraint ruthlessly. If they say "It's efficient to spray," stop them. "That is an evaluative claim. Please state the cost per hectare." This forces the *other* students to interpret the numbers, redistributing the power.

  **2. The 'Vegan Student' Disengages**
  *   **Risk:** Feeling the deck is stacked towards killing, they may withdraw or become antagonistic, breaking the role-play.
  *   **Recovery:** The 'Animal Welfare Officer' card gives them institutional power, not just moral outrage. Remind them privately during the strategy phase: "Your role is to negotiate, not veto. Find an ally in the Ecologist."

  **3. The Envelope Feels Like a Gimmick**
  *   **Risk:** Students feel the '40% probability' is arbitrary and dismiss the uncertainty.
  *   **Recovery:** In the debrief, emphasise that *all* real policy is made on exactly this level of uncertainty. The point isn't the number; it's that they voted *before* seeing it. Ask: "If the envelope had said 90% sentience, would you have changed your vote? If yes, why did you gamble?"

  **4. Giggling/Role-Play Awkwardness**
  *   **Risk:** Final-year students may feel silly pretending to be councillors.
  *   **Recovery:** The 'Consequence' (Press Release task) creates real stakes. Treat the simulation with bureaucratic seriousness. If they giggle, pause and ask, "Is this how the Board treats a disease outbreak?"

  ***

  ### Limitation Statement: What This Activity Cannot Do

  **The Phenomenology of Suffering.**
  This exercise treats 'suffering' as a binary switch inside an envelope (either they do or they don't). It cannot reproduce the *visceral weight* of causing pain. Students are making a cold calculation about probabilities, not confronting the reality of a suffering creature. In the debrief, you must supply this. You will need to describe, vividly and without euphemism, what 'nociception' or 'suffering' might look like in an insect to bridge the gap between their game-theory decision and the moral reality. The mechanics handle the *logic* of the dilemma; you must handle the *moral gravity*.

  **The Non-Identity Nuance.**
  The exercise forces a choice between killing and preventing existence, but it simplifies the 'replaceability' aspect. In the game, the 'replaced' insects are abstract numbers. In reality, the ecological web is complex. You will need to explain in the debrief that preventing a life isn't just a subtraction of numbers; it alters the specific future identity of the ecosystem. The game creates the *structure* of the Non-Identity Problem; you must provide the *philosophical depth* regarding why identity matters.
