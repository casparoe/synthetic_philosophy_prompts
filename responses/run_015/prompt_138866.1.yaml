      *   This makes Option 2 (Larvicide) a "prevention of life."
      *   This makes Option 3 (Sterile) a "gradual reduction."

  7.  **Addressing the Constraints & Personas:**

      *   *Engineering Student:* Assign role "Technical Advisor". Rule: Can only speak in numbers (costs, counts, percentages). No words like "safe," "cruel," "better."
      *   *Vegan Student:* Assign role "Community Ethics Liaison". They will want Option 3.
      *   *Beekeeper:* Assign role "Wetland Conservationist". They care about the ecosystem, not just the mosquitoes. Might prefer Option 2 (targeted) over 1 (aerial spray).
      *   *Jargon Ban:* Strict rule. If someone says "sentience," they put a token in the "Fine Pot" (or just get warned). Let's use a "Jargon Jar" – £20 budget can cover a jar and some sweets/coins. If you use banned words, you owe the group a treat next week.

  8.  **Timeline:**

      *   00-10: Setup & Role Distribution.
      *   10-20: Silent Reading & Strategy.
      *   20-50: Deliberation (The core conflict).
      *   50-60: The Vote.
      *   60-65: The Envelope Reveal.
      *   65-90: Debrief.

  9.  **What Will Go Wrong (Risk Assessment):**

      *   *Risk 1:* The Engineering student dominates with "facts." *Mitigation:* The "Quantities Only" rule limits their ability to conclude, only state premises.
      *   *Risk 2:* The Vegan student disengages because it's a "killing board." *Mitigation:* Their role has veto power or high influence on Option 3.
      *   *Risk 3:* Giggling/Role-play awkwardness. *Mitigation:* High stakes (the press release task) and strict timing.
      *   *Risk 4:* The Envelope feels like a cheat. *Mitigation:* Emphasise in debrief that *real* policy is made under this exact uncertainty.

  10. **What the Activity Can't Do:**

      *   It can't simulate the *phenomenology* of suffering. It treats suffering as a binary switch in the envelope. It can't make them *feel* the weight of the non-identity problem, only navigate the logic of it. The teacher must bridge the gap between "game logic" and "moral reality."

