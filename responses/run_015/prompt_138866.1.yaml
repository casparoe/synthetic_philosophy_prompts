      *   Specific student types accommodated? Yes, via role assignment.

  13. **Final Polish:**

      *   Ensure the "Quantities Only" role is clear.
      *   Ensure the "Politician" role cares about visibility.
      *   Make sure the Envelope reveal is dramatic.
