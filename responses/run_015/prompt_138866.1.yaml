  4.  **Drafting the Role Cards:**

      *   Need 16 distinct cards.
      *   *Groupings:*
          *   **Human Interest:** Public Health, Local Residents (2), Hospital Rep.
          *   **Economic/Political:** Council Budget Lead, Local Politician (needs to be seen acting), Tourism Board.
          *   **Environmental/Technical:** Ecologist, Entomologist (The 'Quantities Only' role), Chemical Rep, Bio-Tech Rep.
          *   **Ethical/Community:** Animal Welfare Rep, Religious Leader, Teacher, Parent Rep.
          *   **Wildcard:** The Chair (neutral, manages time).
