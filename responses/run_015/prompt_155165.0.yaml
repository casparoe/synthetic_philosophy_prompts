answer: |-
  This is not half-formed; it is a precise diagnosis of a structural tension in criminal law theory. You have identified two distinct but related phenomena. The first is the **asymmetry of mitigation** (why hardship lowers desert but privilege doesn't raise it). The second is the **deterministic drain** (why better causal information tends to reduce punishment rather than refine it).

  Here is what these things are, what they aren't, and where the law draws the line.

  ### 1. The Asymmetry of Mitigation (Privilege vs. Deprivation)

  You are correct that desert functions like a baseline with a discount mechanism, rather than a sliding scale that moves both up and down.

  **What it is:**
  This is a function of how the law defines **duty**. Criminal law is generally structured around the "reasonable person" standard. The law posits a baseline level of self-control and moral reasoning that every adult is presumed to possess.
  *   **Downward Adjustment:** When you show an offender had a deprived childhood, coercion, or cognitive deficits, you are arguing they *could not reasonably be expected* to meet that baseline. You are attacking the presumption of capacity.
  *   **Upward Adjustment:** When an offender has privilege, education, and every alternative open to them, they are simply meeting the baseline expectation. They are doing exactly what the law assumes everyone can do: obey the law.

  Fulfilling the baseline expectation does not generate "credit" that can be spent on committing a crime. In economic terms, the law treats compliance as the zero-point. Being "above zero" (privileged) doesn't mean you owe a higher debt when you dip below zero; it just means your dip below zero was less excusable.

  **What it isn't:**
  It is not strictly **Moral Luck**. Moral luck (per Nagel) usually concerns how factors outside our control affect our moral standing (e.g., two drunk drivers, one hits a pedestrian, one doesn't). Your observation is about **Constitutive Luck** (the luck of who you are), but specifically about the *asymmetry of its legal weight*.
  It is also not **Limiting Retributivism** (the idea that desert sets a cap on utilitarian punishment). You are right to distinguish this. Limiting retributivism says, "Don't punish *more* than deserved." You are asking, "Why doesn't the calculation of desert itself scale upward with advantage?"

  **Why it stops:**
  It stops at the **Normative Baseline**. The law is not interested in moral saints; it is interested in rule-followers. A privileged person who commits murder has violated the same norm as a deprived person who commits murder. The harm to the victim and the violation of the right are identical.
  *   *Deprivation* suggests the violation might not be fully voluntary (diminished agency).
  *   *Privilege* confirms the violation was fully voluntary (full agency).
  But "fully voluntary" is the maximum requirement for liability. There is no legal category for "super-voluntary." Once you establish the offender had fair opportunity to avoid the crime, the inquiry into background stops.

  ### 2. The Deterministic Drain (The Truth-Seeking Drift)

  Your second point is the more dangerous one for retributivism: *If the state investigates offenders properly before sentencing, better information reliably pushes sentences down.*

  **What it is:**
  This is often called the **"Withering Away of Retributivism"** or the **Deterministic Challenge**. It relies on the intuition that culpability is inversely proportional to causal determination.
  *   If we find a tumor, sentence goes down.
  *   If we find abuse, sentence goes down.
  *   If we find poverty, sentence goes down.
  *   If we find neurosis, sentence goes down.

  If you follow this chain of causality back far enough, every crime is the product of prior causes (biology + environment). If every cause is a potential excuse, a perfectly informed retributive system would eventually find everyone excused. This suggests that "desert" is actually just a measure of our *ignorance* of the causes of behavior.

  **What it isn't:**
  It isn't a logical necessity of retributivism. Hard-line retributivists (like Michael Moore) argue this is a category error. They claim that even if an action is causally determined, it can still be morally blameworthy if it flows from the agent's own values and choices. They argue the "drift" is a psychological bias, not a philosophical truth.

  **Where it stops:**
  It stops at the **Legal Fiction of Agency**. The law is a normative system, not a descriptive one. It does not try to map the complete metaphysical truth of human causality. It draws a **pragmatic cut-off**.
  The law says: "We will inquire into causes that destroy *rational capacity* (insanity, duress, infancy). We will not inquire into causes that merely influence *motivation* (poverty, anger, greed)."
  The system stops investigating when it finds a **rational agent**. If you acted for a reason (even a bad reason), the law treats you as the author of the act. The "drift" stops because the law refuses to look further back than the point of rational choice.

  ### 3. Post-Crime Conduct (Remorse and Restitution)

  You asked if the discount for post-crime behavior (remorse, pleading guilty, restitution) is the same phenomenon.

  **It is different.**
  *   **Background factors** (childhood, privilege) speak to **Culpability** (Blameworthiness *at the time of the act*). This is backward-looking.
  *   **Post-crime factors** speak to **Dangerousness** and **Communicative Need**. This is largely forward-looking or communicative.

  When a judge reduces a sentence for remorse, it is rarely because the offender *deserved* less punishment for the crime itself. The crime is in the past; its moral weight is fixed. The reduction is granted because:
  1.  **Rehabilitation:** The offender has already begun the moral correction punishment was meant to achieve.
  2.  **Communicative Theory:** Punishment is a dialogue. If the offender accepts the censure (remorse), the state need not shout as loudly (punish as severely) to make the point.
  3.  **Utility:** A remorseful offender is less likely to reoffend.

  So, while background mitigation lowers the *ceiling* of deserved punishment, post-crime mitigation lowers the *necessary amount* of state imposition.

  ### Summary of the Phenomenon

  You have identified that legal desert is **deficit-sensitive but surplus-insensitive.**

  1.  **Deficit-Sensitive:** If your capacity for compliance is *below* the standard baseline (due to luck, hardship, coercion), your desert is discounted.
  2.  **Surplus-Insensitive:** If your capacity for compliance is *above* the standard baseline (due to luck, privilege, advantage), your desert is not increased. You are not punished *more* for having had a better choice, because the law only demands that you make the *right* choice, not that you make it under difficult conditions.

  **The "Ceiling" Intuition:**
  You are right to feel that "standard desert" acts like a ceiling. In practice, the "standard sentence" is calculated for a "standard agent."
  *   Any deviation *below* standard agency reduces the sentence.
  *   Any deviation *above* standard agency is ignored.

  **Why this matters for your work:**
  This asymmetry reveals that the criminal law is not truly trying to measure metaphysical moral desert. If it were, it would have to account for the "moral luck" of privilege as an aggravating factor (e.g., "You knew better and had more to lose, so your betrayal of the norm is worse").
  Instead, the law is measuring **compliance with a public standard.** The standard is fixed. You either met it or you didn't. Hardship explains why you couldn't meet it. Privilege merely confirms you could have. But confirming you could have met the standard doesn't make the failure worse; it just makes it inexcusable.

  **Where it stops:**
  It stops where the law decides to prioritize **equality of norms** over **individualized moral accounting**. If we started aggravating sentences based on privilege, we would be admitting that the law holds different citizens to different moral standards based on their capacity. The law prefers the fiction that everyone has the same capacity, because that fiction is necessary for the law to function as a universal command.

  So, the "drift toward punishing nobody" is halted not by philosophy, but by **administrative necessity.** The system *must* presume agency to operate, even if a perfect investigation would undermine that presumption. It stops digging when the cost of digging threatens the presumption of responsibility itself.
