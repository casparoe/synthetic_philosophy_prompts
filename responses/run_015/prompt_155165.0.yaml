      *   *Validation:* Acknowledge this is a sophisticated observation, not "half-formed." It cuts to the heart of criminal law theory.
      *   *Naming the Beast:* It doesn't have one perfect name, but it clusters around **"The Asymmetry of Mitigation,"** **"The Baseline of Reasonable Expectation,"** and the **"Deterministic Drain on Retribution."**
      *   *Section 1: The Asymmetry (Privilege vs. Deprivation).*
          *   Explain *why* privilege doesn't aggravate. The law punishes the violation of duty, not the ease of fulfilling it.
          *   Concept: **The "Reasonable Person" Standard.** You are punished for falling below the line. Standing far above the line doesn't make falling below it worse.
          *   Concept: **Negative vs. Positive Desert.** We are good at calibrating negative desert (blame). We don't really have a concept of "super-blame" for privileged wrongdoers, only standard blame.
