  | **Standard Reply (Rule vs. Move)** | You cannot write the act of playing the game inside the rulebook. | Clean | Doesn't explain *why* we are compelled to play, only that we must. | Both |
  | **Standard Reply (Dispositional)** | Accepting a rule means you are disposed to play it; otherwise you're lying. | Distorted | People can follow rules mechanically without understanding/disposition. | The_Puzzle |
  | **User Hunch (Umpire Final)** | The regress stops because someone eventually just acts instead of writing. | Clean | Smuggles in social authority where logic requires normative necessity. | My_Vocabulary |
  | **Tortoise 1 (Finite/Infinite)** | Stopping arbitrarily vs. printing an infinite FAQ. | Clean | Infinite text is still inert; doesn't address the need for a reader. | The_Puzzle |
  | **Tortoise 2 (Meta-Layers)** | Separating Core Rules, FAQ, and Tournament Policy into distinct books. | Distorted | Solves contradictions between rules, not the inertia of applying them. | My_Vocabulary |
  | **Tortoise 3 (Action vs. Speech)** | Moving the mini correctly but refusing to verbally acknowledge the rule. | Clean | Shifts the problem from "how to think" to "what does saying mean". | The_Puzzle |

