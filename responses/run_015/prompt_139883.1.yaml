answer: |-
  The waiting room smelt of ozone and fresh paint, the kind of sterile citrus scent that tries to掩盖 the smell of fear. Nadia sat on a chair that was ergonomically correct but uncomfortable, watching the screen on the wall loop a video of a sunrise over a calm sea. *CogniClear Solutions*, the logo read. *Transparency Windows for the Modern Mind.*

  When her name was called, she was led into a booth no larger than a phone box. The technician, a man with a headset and a smile that didn't reach his eyes, began strapping sensors to her temples and the base of her skull.

  "Remember," he said, checking a tablet. "The Window doesn't change the output. It simply reduces the compression ratio on the input. You're used to a desktop interface—icons, folders. We're giving you command-line access. You might experience some latency in motor function while your cortex recalibrates. It's normal. We call it 'integration lag'."

  "What will I see?" Nadia asked. Her voice sounded thin in the soundproofed room.

  "Consensus metrics. When you intend to move, you'll see the sub-personal bidding war that precedes the movement. Urge, counter-urge, metabolic cost, emotional weighting. You'll see the vote before you feel the choice."

  "And then I decide?"

  "And then you execute," he said, tapping his tablet. "Session duration: forty minutes. Begin."

  The world didn't change visually, but it thickened. When Nadia looked at her hand, she didn't just see skin and bone; she felt a hum, a static charge of competing potentials. *Flex.* A surge of blue. *Rest.* A pull of grey. The blue won. Her fingers curled. But she hadn't curled them. She had watched them curl, like a puppeteer watching the marionette move itself after the strings were pulled by unseen hands.

  She paid the fee and stepped out into the night. The N15 bus was half-empty. She took the top deck, staring at the rain streaking the glass. She needed to be sure. Tomorrow, she had to tell her father she wasn't applying for Medicine. She needed to know that when she said the words, *she* was saying them. Not her fear, not her rebellion, not a chemical cascade.

  At home, she tried to make tea. The kettle was heavy. As she reached for it, she saw the negotiation: a cluster of red impulses (thirst, habit) battling a cluster of green (caution, fatigue). The red coalition formed a majority. Her hand moved. She felt the movement arrive in her consciousness a half-second after the muscles had already engaged. She was the press release, not the president.

  She slept badly.

  The swimming pool at six in the morning was usually her sanctuary. Nadia was a captain of the school team; the water was where the noise of the world drowned out. She dived in, expecting the familiar silence of the glide.

  Instead, she sank.

  Her stroke fractured. Normally, her arm recovery was automatic, a fluid arc. Now, every degree of rotation was a debate. *Tricep engagement: 40%. Drag coefficient: rising. Oxygen saturation: dropping.* The data flooded her. She couldn't swim because she was watching the machinery of swimming. She thrashed, swallowing chlorinated water, and had to grab the lane rope, coughing. Her body was no longer a vessel; it was a committee meeting she couldn't adjourn. The compression was load-bearing, and she had stripped it away.

  She sat on the poolside, shivering, watching the water ripple. If the dashboard was real, who was watching the dashboard? If this view was the truth, why did it break her?

  By the time she reached the sixth-form common room, the rain had stopped. The radiators were clanking, a rhythmic iron heartbeat. Her phone buzzed. A text from her father: *Looking forward to discussing your UCAS draft tonight.*

  Nadia sat at a desk near the window. She opened her notebook. The pen felt alien in her hand. She could feel the micro-negotiations in her fingers again—the friction of the paper, the tension in the tendon. She could see the urge to write *Medicine* rising like a tide, backed by years of expectation, by the desire for safety, by the fear of disappointment. It was a massive, glowing coalition.

  Opposing it was a smaller, sharper cluster. *Art.* It was weaker in terms of metabolic safety, stronger in terms of visceral resonance.

  She watched them battle. She saw the moment the *Art* coalition secured the necessary threshold. She felt the decision settle in her nervous system. And then, a moment later, she felt the feeling of *choosing* it. The press release was issued. *I have decided.*

  She looked at the blank page. The machinery had already voted. The pen moved. She didn't know if she was driving the hand or riding it. She only knew that the ink was black, and it was drying on the paper, and the radiators clanked on, indifferent to who was pulling the strings.

  ***

  **Author's Note**

  I aimed primarily to vividify the third reading (infinite regress/the dashboard is just another layer) while keeping the second (faithful compression) viable. The pool scene is the anchor for the second reading: if the "truth" disables her, the illusion is functionally necessary, suggesting the "self" is the interface itself, not what lies behind it. However, by having her feel the decision *after* the neural vote, I invite the first reading (the dashboard is a lie/determinism is true).

  The story leaks most around the technician's dialogue. His explanation ("command-line access") leans heavily towards Reading 1 (there is a real machinery beneath). A reader convinced of Reading 3 might argue the "command line" is just another GUI, but the text privileges his authority slightly too much. Additionally, the ending risks implying that the *action* validates the agency regardless of the mechanism, which might comfort a reader wanting to believe in free will (Reading 2) too easily. The ambiguity relies on the reader deciding whether "watching the vote" invalidates the vote's ownership.
