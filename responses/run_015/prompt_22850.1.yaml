answer: |-
  First off, take a breath. It is completely normal to feel fired up after this kind of conversation. Moral philosophy hits close to home because it's about how we live and what we value, not just abstract logic.

  You have spotted the exact philosophical crack in Marcus's armor. Your intuition is spot on: **There is a massive difference between "you have no justification for this belief" (epistemology) and "this belief is false" (ontology).**

  Marcus seems to have slid from an *Evolutionary Debunking Argument* (which is about justification) into *Moral Error Theory* (which is about truth), and he might not even realize he made the jump.

  Here is the breakdown of where his argument goes modest, where it goes extreme, and how you can push back next time without losing your cool.

  ### 1. The Modest Claim: Epistemological Skepticism
  The standard Evolutionary Debunking Argument (EDA) is primarily an attack on **justification**, not truth.

  *   **The Argument:** Our moral instincts were shaped by evolution to help us survive and reproduce in small tribes, not to detect objective moral truths.
  *   **The Conclusion:** Therefore, we have no reason to trust that our moral instincts align with objective moral truth (if such truth exists).
  *   **The Implication:** We are "unjustified" in believing our moral intuitions are true.

  **Crucially:** This does *not* prove that moral truths don't exist. It just says we can't be sure we've found them.
  *   *Analogy:* Imagine you have a calculator that was built by a random number generator. If you type in `2 + 2`, and it says `4`, you have no *reason* to trust the calculator. But `2 + 2 = 4` is still true. The calculator's unreliability doesn't change the math; it just means you can't use the calculator to prove the math.

  If Marcus stops here, he is a **Moral Skeptic**. He is saying, "We can't *know* that torturing babies is objectively wrong." He is *not* saying, "Torturing babies is objectively fine."

  ### 2. The Extreme Claim: Moral Error Theory
  However, in your dinner conversation, Marcus reportedly said: *"...when I think 'torturing babies for fun is wrong' that thought is just false."*

  This is a much stronger claim. This is **Moral Error Theory** (associated with philosophers like J.L. Mackie).
  *   **The Claim:** There are no objective moral facts in the universe. Therefore, any statement claiming there *is* a moral fact (like "torture is wrong") is literally false.
  *   **The Implication:** The proposition "Torturing babies is wrong" is false, not because torture is okay, but because "wrongness" doesn't exist as a property in the world.

  If Marcus is committed to this, then yes, he is technically committed to the idea that the statement "torture is wrong" is false. **But—and this is key—this does not mean he thinks torture is permissible.**

  Most Error Theorists still oppose torture. They just frame it differently. Instead of "Torture is wrong," they say, "I strongly disapprove of torture," or "Society functions better without torture." They treat morality as a useful fiction or a expression of preference, not a description of reality.

  ### 3. Where You Can Push Back
  You felt like you were collapsing the two claims ("unjustified" vs. "false"). That is exactly where Marcus wants you to be, because it makes his position seem stronger than it is. Here are three ways to separate them next time:

  **A. The "Third Factor" Reply**
  Marcus assumes evolution cares *only* about survival and has no correlation with moral truth. But what if survival *requires* certain moral truths?
  *   *Argument:* Maybe "goodness" is tied to "flourishing." Creatures that flourish survive better. If so, evolution *would* select for intuitions that track moral truth, because those intuitions help us flourish.
  *   *The Pushback:* "Marcus, just because evolution shaped the mechanism doesn't mean the output is false. Evolution shaped my vision to detect predators, but that doesn't mean the predator isn't really there. Why is morality different?"

  **B. The Distinction Between Origin and Validity**
  This is the "Genetic Fallacy." Just because we know *where* a belief came from (evolution) doesn't mean we know *whether* it's true.
  *   *The Pushback:* "You're confusing the cause of the belief with the truth of the belief. I can explain why you believe 2+2=4 using neuroscience and evolution, but that doesn't make the math untrue. Even if my 'baby torture is wrong' intuition is evolved, it can still be objectively true that baby torture is wrong."

  **C. The Pragmatic Contradiction**
  This is the strongest emotional check. If Marcus is an Error Theorist, he has to live in a world where "torture is wrong" is a false statement.
  *   *The Pushback:* "Okay, if the thought 'torture is wrong' is false, then is the thought 'torture is fine' true? Or is that also false? If both are false, then your philosophy doesn't actually describe the world better than mine; it just removes the words we use to stop people from hurting each other. If you really believe moral truth doesn't exist, why do you argue so hard for it?"

  ### Summary for Your Next Chat
  You don't need to concede that he's right about the "false" claim.
  1.  **Acknowledge the EDA:** "I agree that evolution shaped our instincts."
  2.  **Reject the Leap:** "But that only means we can't be 100% *sure* of our justification. It doesn't prove moral facts don't exist."
  3.  **Call Out the Error Theory:** "When you say 'torture is wrong' is a false statement, you are making a positive claim that moral facts *don't* exist. That's a huge metaphysical claim that requires just as much proof as saying they *do* exist."

  Marcus is likely conflating **"We can't prove it"** with **"It isn't so."** You caught him on it. Trust that instinct.
