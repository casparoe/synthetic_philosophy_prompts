      Leave out: Dutch Book arguments (pragmatic vs. epistemic distinction is too messy for 50 mins), Joyce's generalization to infinite algebras (too technical), and decision-theoretic links (no decision theory background). Explicitly state: "We are ignoring pragmatic consequences and infinite cases to isolate the epistemic norm." This manages expectations and prevents advanced students from derailing the core logic with edge cases. Acknowledge that this is a finite, epistemic-only slice of a larger literature.

