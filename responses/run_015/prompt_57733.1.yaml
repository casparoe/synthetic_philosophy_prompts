      Question: "If we measure accuracy using absolute distance $|v - c|$ instead of squared distance, does incoherence still guarantee dominance?"
      Good Answer: "No. Absolute distance is not strictly proper; a coherent credence can be dominated by an incoherent one under this measure." This shows they understand the dependency on properness.
