answer: |-
  Your verdicts are actually **highly coherent**, but they are incoherent *only* if you assume you are trying to maximize Expected Value (EV). If you drop EV as your north star, your intuitions line up perfectly under a different principle.

  Here is the breakdown of why your gut is working, the principle that unifies your six cases, and how it handles your new hypothetical.

  ### The Unifying Principle: "Bounded Ruin, Plausible Upside"

  Your decision-making isn't driven by the mathematical expectation (which you correctly identify as broken in these cases). It is driven by **Downside Security** first, and **Median/Mode Outcomes** second.

  You are effectively applying a **Lexicographic Preference**:
  1.  **Rule 1:** Is the downside survivable? (If no, reject. If yes, proceed.)
  2.  **Rule 2:** Is the "likely" upside worth the entry fee? (Ignore the astronomical tails.)

  Here is how this principle resolves the tensions you identified:

  #### 1. Resolving the 3 vs. 4 Tension (The Mirror Image)
  This is the strongest evidence for your principle.
  *   **Scenario 3 (Capped Downside):** You pay $50. Why? Because Rule 1 is satisfied. You cannot be ruined. The "undefined" math is driven by the upside, which you treat as a bonus.
  *   **Scenario 4 (Capped Upside):** You reject. Why? Because Rule 1 is violated. The undefined math is driven by the downside. Even if the probability is low, the *consequence* is unbounded loss.
  *   **Verdict:** This isn't inconsistent; it's **Loss Aversion** in its purest form. You are treating "undefined EV" not as a mathematical property, but as a proxy for "unpredictable tail risk." If the tail risk is on the loss side, you flee. If it's on the gain side, you ignore it.

  #### 2. Resolving the 1 vs. 3 Tension (Infinite vs. Undefined)
  You value Scenario 3 ($50) higher than Scenario 1 ($15), even though 1 has "Infinite EV" and 3 has "Undefined EV."
  *   **Scenario 1 (St. Petersburg):** The infinite EV is "hollow." 50% of the time you get $2. 75% of the time you get $4 or less. To realize the "infinite" value, you need outcomes that will never occur in the lifetime of the universe. Your gut correctly discounts the phantom infinity and prices based on the **median outcome** (which is very low).
  *   **Scenario 3 (Pasadena + Floor):** While the EV is undefined, your intuition likely senses that the probability mass is distributed differently than St. Petersburg. More importantly, the **hard floor** acts as a guarantee. In St. Petersburg, your loss is the entry fee (100% risk of loss if you pay $15 and get $2). In Scenario 3, if the floor is structured such that losses are capped *relative to the stake*, or if the distribution of "medium" wins is higher, your gut prices the *security* higher than the *phantom infinity*.
  *   **Verdict:** You are pricing **utility**, not value. A guaranteed floor has high utility. An infinite mean with a 99% chance of losing money has low utility.

  #### 3. The Other Scenarios (2, 5, 6)
  *   **Scenario 2 (Pure Pasadena):** You pay $8. This fits the principle. No hard floor means Rule 1 is shaky. You treat it as risky, so you only play cheap.
  *   **Scenario 5 (Bounded Outcomes):** You are neutral. This confirms the principle. If the outcomes are bounded (Rule 1 is perfectly satisfied and trivial), the "undefined EV" math becomes irrelevant noise. You judge it on the range (-3 to +3), which feels like a coin flip.
  *   **Scenario 6 (Counterparty Risk):** You stick to ~$15. This shows your "Ruin" threshold isn't just mathematical; it's practical. A 0.1% bust risk is small enough that it doesn't trigger Rule 1 violation, so you fall back to the St. Petersburg median valuation.

  ### The New Case: Undefined EV with Dominance

  You asked: *What about a gamble where expectation is undefined, but there is clear dominance (Option A pays more than Option B in every single outcome)?*

  **Your Principle Says: Take Option A.**

  Here is why: Dominance operates **state-by-state**, whereas Expectation operates **aggregately**.
  *   EV requires summing up all possibilities and weighting them. If that sum breaks (undefined), EV is useless.
  *   Dominance requires looking at Outcome 1, then Outcome 2, etc. If $A_1 > B_1$, $A_2 > B_2$, and so on, then A is strictly better than B in *every possible world*.

  Even if the "average" is undefined, the **ranking** is defined. Your "Bounded Ruin" principle relies on knowing what happens in the real world. If A is better than B in every real-world scenario, the mathematical undefinedness of the sum is irrelevant. Your gut should (and likely would) say "Take A."

  ### Does "Relative Expectation" Match Your Gut?

  You mentioned hearing about **Relative Expectation**. Without getting into the math weeds, here is the concept:
  *   **Standard EV:** Compare Gamble A to $0.
  *   **Relative Expectation:** Compare Gamble A to Gamble B directly by looking at the EV of the *difference* $(A - B)$.

  **Does it match your verdicts?**
  **Yes, specifically for 3 vs. 4.**
  In the Pasadena game, the EV of the game itself is undefined. But if you compare Scenario 3 (Capped Loss) vs. Scenario 4 (Capped Gain), the *difference* between them often creates a new series that *does* converge.
  *   Because Scenario 3 removes the massive negative terms and Scenario 4 removes the massive positive terms, the difference $(Scen3 - Scen4)$ effectively isolates the "safety" premium.
  *   Relative Expectation would likely yield a positive value for choosing 3 over 4, validating your intuition that 3 is better, even if neither has a defined standalone EV.

  ### Conclusion: Are You Inconsistent?

  **No.** You are consistent if you view yourself as a **Risk-Manager**, not an **EV-Maximizer**.

  The tension you feel (1 vs 3) comes from trying to reconcile your gut with the label "Infinite EV."
  *   **The Fix:** Stop treating "Infinite EV" as a reason to pay more. Treat it as a mathematical artifact that often correlates with "Median outcome is tiny."
  *   **The Driver:** Your true metric is **Security of the Floor**.
      *   Floor Secure + Upside Wild = **High Value** (Scenario 3).
      *   Floor Wild + Upside Secure = **No Value** (Scenario 4).
      *   Floor Secure + Upside Secure = **Neutral/Fair** (Scenario 5).
      *   Floor Secure + Upside Wild (but Median Low) = **Low Value** (Scenario 1).

  Your verdicts add up to a coherent philosophy: **Math that relies on infinite tails is ignored; math that protects against ruin is prized.** That is a very rational way to navigate a world where banks go bust and infinities don't exist.
