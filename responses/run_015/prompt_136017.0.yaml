prompt: |-
  hey, can you make the argument that Dennet's multiple drafts model doesn't actually destroy the Cartesian theater, it just moves it around? Most people read it as killing the idea of a central screen in the brain, but I want you to push that there's still a temporal version hiding in there — a moment where one draft gets retroactively crowned the 'real' experience. So argue that if you allow any fact of the matter about which draft is the conscious one, you've smuggled back a spotlight, just running across time instead of space.

  Then go further: claim the only genuinely theater-free view has to treat consciousness as distributed and stitched together after the fact through editorial constraints, not just 'no center anywhere.' Make the case that Dennett's position actually requires this stronger metaphysical commitment but he dodges it.

  Please organize it in these sections, roughly:
  1. The bait and switch (~150 words): why everyone thinks the spatial theater is dead
  2. The hidden temporal spotlight (~250 words): your core argument about retroactive anointment of one draft
  3. The stronger metaphysical bill (~200 words): why real anti-theaterism needs distributed, post-hoc stitching
  4. Bottom line (~100 words): did Dennett actually finish the job or just relocate the problem?

  Keep it casual, I don't care about citations or a reading list — just work through the logic. Maybe throw in a typo or two if it feels natural, but don't go overboard.
