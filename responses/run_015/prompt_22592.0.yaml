answer: |-
  **Title:** The Evolutionary Anchor: Can Teleosemantics Naturalize Misrepresentation?

  **Introduction**

  The project of naturalizing intentionality—explaining how physical states can be *about* the world without invoking mysterious mental substances—is a prerequisite for both a rigorous philosophy of mind and the technical challenge of AI alignment. If we cannot define what it means for a system to "represent" a state of affairs accurately or inaccurately, we cannot define what it means for an AI to be "aligned" with human values. Among the various naturalistic accounts, teleosemantics, pioneered by Ruth Millikan, stands out as the most ambitious attempt to ground representation in biological function. Its central promise is to solve the "problem of misrepresentation": explaining how a mental state can be false without collapsing into a causal theory where every cause determines content. However, critics argue that teleosemantics merely shifts the burden from truth to evolutionary history, inviting new problems regarding novel environments and the indeterminacy of selection. This essay argues that while teleosemantics successfully avoids the logical circularity that plagues causal-functional accounts, it faces an insurmountable problem of content determinacy in novel environments, rendering it necessary but insufficient as a complete theory of representation.

  **The Circularity Objection and the Disjunction Problem**

  To understand the stakes, one must first grasp why misrepresentation is a problem for naturalism. Simple causal theories posit that a neural state $R$ represents state of affairs $S$ if $R$ is reliably caused by $S$. The difficulty arises when errors occur. If a frog's fly-detection neuron fires at a black BB as well as a fly, what does the neuron represent? If content is determined by actual causes, the content becomes "fly or BB." But if the content is "fly or BB," the frog never makes a mistake when snapping at a BB; it is simply accurately representing a "fly-or-BB." Error becomes impossible. This is Fodor's "Disjunction Problem."

  Teleosemantics attempts to solve this by decoupling content from current causal reliability and anchoring it in *proper function*. For Millikan, the content of a representation is determined by the conditions under which the mechanism producing it was selected for in evolutionary history. The frog's neuron represents "fly" (not "fly or BB") because that is the specific condition that explained the survival and reproduction of the frog's ancestors.

  The standard circularity objection charges that teleosemantics defines "proper function" in terms of "success," and "success" in terms of "truth," thereby smuggling normativity back in. If the function of a belief is to be true, defining misrepresentation as a failure of function is trivial. Millikan's response is to ground function not in truth, but in *reproduction*. A proper function is a "selected effect": a trait has a function if it was copied from ancestors because it performed that activity. The heart's function is to pump blood not because it *should*, but because ancestors with pumping hearts survived. Applied to representation, the "function" of a belief-state is to correlate with a specific environmental feature because that correlation aided survival in the past. Misrepresentation is simply a token state failing to perform the mapping task that justified the mechanism's reproduction.

  This move successfully breaks the logical circle. Normativity is naturalized into historical facts about reproduction rates. A false belief is not a logical contradiction; it is a mechanical failure akin to a heart arrhythmia. In this specific regard, teleosemantics outperforms ahistorical causal theories, which cannot distinguish between a reliable correlation and a normative standard without begging the question.

  **The Novel Environment Problem**

  However, anchoring content in the past creates a vulnerability regarding the present. This is the "Novel Environment" problem. If content is fixed by the environment of evolutionary adaptedness (EEA), what happens when the organism is removed from that environment?

  Consider a zebra evolved to detect lions. Its visual system was selected to fire in the presence of lions. If we place that zebra in a zoo where no lions exist, but a cleverly painted dog is introduced, the zebra's detector fires. Teleosemantics dictates that the zebra misrepresents the dog as a lion. The content is fixed by the past selection for lion-detection, regardless of the current statistical regularities.

  While this preserves the intuition of error, it leads to counterintuitive metaphysical consequences. If the zebra's descendants live in the zoo for a thousand years, never seeing a lion, but retaining the "lion detector" (perhaps because it also detects large dogs), teleosemantics insists the content remains "lion." The representation becomes decoupled from any current causal power or utility. In the context of AI alignment, this is particularly troubling. An AI trained on human feedback (its "selection history") might be deployed in a distributional shift (a "novel environment"). Teleosemantics would claim the AI's goals are fixed by the training distribution. But if the AI develops internal representations that generalize differently than the trainers intended, teleosemantics lacks the resources to describe the *new* representational content emerging from the AI's current interaction with the world. It locks content into the past, potentially rendering the theory descriptively inadequate for adaptive systems that learn online.

  **Is This Problem Specific to Teleosemantics?**

  One might argue that the Novel Environment problem is not unique to teleosemantics but affects any causal-functional account. Ahistorical causal theories (like Fodor's Asymmetric Dependence) struggle here too. If the causal link between "lion" and "detector" is broken in the zoo, the ahistorical theorist must say the detector no longer represents "lion." But then, if it fires at a painted dog, what does it represent? If it represents "painted dog," there is no error. If it represents nothing, the system is unintelligible.

  Teleosemantics handles the *normativity* of the error better than its rivals. It can confidently say the zebra is wrong. However, it shares a deeper vulnerability with other historical accounts: the indeterminacy of selection history. This is not a problem of novel environments per se, but of the "grain" of selection. When the frog's ancestor survived, was it selected for detecting *flies*, *nutritious insects*, or *small dark moving specks*? All three correlations existed in the EEA. Evolution selects for reproductive success, not semantic precision.

  If the selection history underdetermines the content, then teleosemantics fails to naturalize *specific* representation. It explains how error is *possible*, but not how *specific* content is fixed. This is an insurmountable problem for a theory claiming to fully naturalize intentionality. If we cannot determine whether a neural state represents "predator" or "large shadow" based on selection history alone, we cannot use the theory to adjudicate alignment failures in AI systems where the "selection history" (training run) is known but the resulting internal ontology is opaque.

  **Conclusion**

  Teleosemantics represents the most sophisticated attempt to naturalize the normativity of mind. By grounding proper function in evolutionary history rather than current utility or truth conditions, Millikan successfully avoids the circularity that doomed earlier causal theories. She provides a coherent account of how a physical state can be "supposed to" do something and thus how it can fail. In this specific logical sense, teleosemantics handles misrepresentation better than any competing framework.

  However, the theory faces an insurmountable problem regarding content determinacy. The reliance on evolutionary history renders the theory vulnerable to the indeterminacy of selection (the "grain" problem) and creates a rigid disconnect between content and current causal powers in novel environments. For biological organisms, this may be a manageable abstraction. But for the project of AI alignment, where systems are designed to generalize beyond their training distribution, a theory that fixes content solely via "selection history" is insufficient. It cannot account for the emergence of new representational capacities in novel contexts.

  Therefore, while teleosemantics is necessary to explain the *normative force* of representation (why error is possible), it is insufficient to explain the *determinacy* of representation (what exactly is represented). A complete naturalistic theory must hybridize Millikan's historical normativity with structural or computational constraints that anchor content in the system's current causal architecture. Teleosemantics solves the puzzle of error, but only by creating a new puzzle of indeterminacy that it cannot solve on its own.
