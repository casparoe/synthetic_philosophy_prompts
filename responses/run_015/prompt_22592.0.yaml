      *   **Tone:** Academic but accessible (grad seminar level), rigorous, analytical.

  2.  **Deconstruct the Problem (Misrepresentation):**
      *   *The Core Issue:* Naturalizing intentionality means explaining how physical states can be *about* something. Causal theories say $X$ represents $Y$ if $X$ is caused by $Y$. But errors happen. If a frog snaps at a black BB (thinking it's a fly), what does the neural state represent? "Fly"? "Fly or BB"? "Small moving dark spot"?
      *   *The Disjunction Problem:* If representation is defined by causal correlation, error becomes impossible (because the state *was* caused by the BB). To allow error, we need to distinguish normal/correct conditions from abnormal/error conditions without begging the question (i.e., without saying "it's an error because it's false").
      *   *Teleosemantics' Solution:* Content is determined by *proper function* (selected effect). A state represents $Y$ if it was selected for correlating with $Y$. Error is failing to perform that function.

  3.  **Outline the Essay:**
