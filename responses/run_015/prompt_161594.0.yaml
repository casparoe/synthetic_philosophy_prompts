answer: |-
  Neighbors, friends, members of the Festival Committee, and especially the third graders who spent weeks gluing paper loops together on the schoolroom floor.

  Welcome to the Green. Welcome to Founders' Day.

  We are gathered around a bonfire that has not yet been lit, beside a paper chain that stretches across the grass, and before a Roll of Years that we are about to read. For many years, the story told here was that this chain measured the distance from 1602 to today. It was a story of memory. A memory tradition tells us what happened before we were born. It claims a lineage. It asks us to verify dates, to check archives, to look backward into the dark to see if the light was really there.

  Our town archivist, seated here in the front row, knows better than anyone that archives do not lie. She knows that the Roll was written in a single afternoon in 1954. She knows the Chamber of Commerce devised this day to welcome summer visitors. If Founders' Day were a memory tradition, that knowledge would break it. If the value of this day depended on a claim about 1602, the archivist's truth would extinguish this fire before it caught.

  But I am here to suggest that we are not holding a memory tradition. We are holding a pledge tradition.

  A memory tradition asserts something about the past, and so it can be refuted by a fact. A pledge tradition makes a promise about the future, and so it can only be kept or broken by our actions. The paper chain in front of us does not count the years behind us. It links us to the year ahead. When the third graders glue those loops, they are not counting history; they are building a bridge to next summer. If we gather here next year, the chain is true. If we do not, the chain is broken. The truth of this day is not in when it started, but in whether we continue it.

  This distinction changes what we can say. It means I cannot stand here and praise the founders for intending this gathering, because I do not know their intentions. It means I cannot claim an unbroken line of observance, because the record shows a beginning in 1954. But it allows me to say something stronger. It allows me to say that the people who gathered in 1954 did not lie to us; they pledged to us. They saw a community that needed a rhythm, a time to stop and name itself, and they built a machine for making that promise visible.

  Consider the Roll of Years. We will read it aloud in a moment. If this were a memory tradition, reading names from a list created in 1954 would be a fiction. But as a pledge tradition, the reading is a roll call of the living. It is a way of saying, "We are here, and we intend to remain." The value is not in the ink's age, but in the voice's commitment. When we speak these names, we are not conjuring ghosts; we are practicing our own continuity.

  This is why the twelve new citizens waiting to take the oath are the most important part of this ceremony. They are not joining a club that started in 1602. They are joining a promise that started whenever we decided to be a town together. Their oath is not about ancestry; it is about allegiance. It is a pledge tradition in its purest form. They are promising to keep the chain linked. They are promising to light the fire next year. They are validating the 1954 decision not by pretending it is older, but by proving it is still vital.

  To the Festival Committee: You asked me to keep the traditional script. We will keep the words. But tonight, the words mean something different. They are not a report on history. They are a contract for the future. When we say "Founders," we do not mean the people who built the houses in 1602. We mean the people who founded this tradition of renewal, whether in 1954 or last year or today. We are the founders. Every time we gather, we found the town again.

  To the children: You made the chain. You know how it holds together. One loop hooks the next. If one loop breaks, the chain is weaker. But you can always glue another. This town is like that chain. It is not strong because it is old. It is strong because we keep hooking ourselves to each other. The past is just paper. The future is what you hold in your hands.

  Some scholars say that all communities are imagined. They say nations and towns are stories we tell ourselves to feel connected. They are right. But a story is not a lie just because it is made up. A story is a lie only if we pretend it happened when it didn't. A story is a promise if we agree to live inside it together. We are not pretending to be old. We are choosing to be continuous.

  The archivist keeps the record of what we were. We keep the record of what we will be. Both are necessary. The archive protects us from falsehoods about the past. The pledge protects us from despair about the future. We can honor the archivist's truth without extinguishing the festival's fire, because the fire does not burn on history. It burns on wood we gather today, lit by hands we warm together now.

  So let us read the Roll. Let us light the fire. Let us welcome the new citizens. Not because our ancestors told us to, but because we tell ourselves to. We are not preserving a relic. We are practicing a habit. We are keeping a date with a future we have not yet seen.

  Thesis: The nation this town belongs to is actually no older than the present moment in which we choose to sustain it.
