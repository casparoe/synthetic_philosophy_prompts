prompt: |-
  hey so i help run a small uni fund that gives away like 5k a term and we only get about an hour to decide, most of us arent philosophy people. we keep getting pascals mugging style pitches where the expected value looks huge cause of some tiny probablity of an enormous payoff but it feels off. can you turn the usual fixes people talk about — like capping payoffs, ignoring super tiny chances, judging by long-run policy not one bet — into a quick checklist we could actually run in 15 mins, with clear when to reject vs escalate to a longer debate and flagging where its just a judgement call? then try it out on two toy cases i made up: A) someone wants $400 to brute-force search for a mathematical proof that if found would supposedly let him create a vast number of happy simulated lives, chance of success is like one in two million, B) paying for a flood wall with about a 5% chance of preventing serious harm to a village. also show us one case where your checklist says something most of us would hate, and say what the checklist just cant settle.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Runs a small university fund ($5k/term, 1 hour decision time, non-philosophers).
      *   **Problem:** Getting "Pascal's Mugging" style pitches (tiny probability $\times$ huge payoff = huge EV, but feels wrong).
      *   **Task:** Create a 15-minute practical checklist based on standard philosophical fixes (capping payoffs, ignoring tiny probs, policy-based reasoning).
      *   **Requirements:**
          *   Clear "Reject" vs. "Escalate" vs. "Judgement Call" criteria.
          *   Test on two toy cases:
              *   Case A: $400 for math proof $\rightarrow$ simulated lives (1 in 2 million chance).
              *   Case B: Flood wall (5% chance of preventing serious harm).
          *   Show one case where the checklist gives a counter-intuitive result (something they'd hate).
          *   Identify what the checklist *can't* settle.

  2.  **Deconstruct "Pascal's Mugging" Fixes for Practitioners:**
      *   *Philosophical Concept:* Bounded Utility (cap the payoff).
      *   *Practical Translation:* Is the claimed benefit physically possible/verifiable within our scope?
      *   *Philosophical Concept:* Epistemic Hygiene (ignore probabilities below a threshold).
      *   *Practical Translation:* Is there *any* evidence, or is it pure speculation?
      *   *Philosophical Concept:* Policy/Rule Utilitarianism (long-run consistency).
      *   *Practical Translation:* If we said yes to this, would we go bankrupt funding similar scams?
      *   *Philosophical Concept:* Opportunity Cost.
      *   *Practical Translation:* What definite good are we giving up?

  3.  **Drafting the Checklist (Iterative Process):**
      *   *Goal:* 15 minutes max. Needs to be binary or simple scaling.
      *   *Step 1: The Reality Check (Epistemic).* Can we verify the claim? If no $\rightarrow$ Reject.
      *   *Step 2: The Scale Check (Bounded Utility).* Is the payoff absurdly large compared to the budget? If yes $\rightarrow$ Skepticism.
      *   *Step 3: The Policy Check (Rule).* Would funding this set a precedent we can't afford?
      *   *Step 4: The Comparison Check (Opportunity Cost).* Is there a safer bet?
      *   *Refinement:* Make it a flowchart style or a scored list. Let's go with a "Red Flag" system. If you hit 2 Red Flags, Reject. If 1, Escalate/Discuss. If 0, Fund (or judgement).

      *   *Revised Checklist Structure:*
          1.  **Evidence Threshold:** Is the probability based on data or a guess?
          2.  **Payoff Cap:** Is the benefit measurable in our lifetime/scope?
          3.  **Precedent:** Can we afford to fund 10 more of these?
          4.  **Alternative:** Is there a boring alternative?

  4.  **Testing on Toy Cases:**

      *   **Case A (Math/Simulation):**
          *   $400 cost.
          *   Payoff: Vast simulated lives (Infinite/Unbounded).
          *   Prob: 1 in 2 million.
          *   *Checklist:*
              *   Evidence? Pure guess/speculation. (Red Flag)
              *   Payoff Cap? Unbounded/Unverifiable. (Red Flag)
              *   Precedent? If we fund wild math bets, we run out of money. (Red Flag)
              *   *Result:* Hard Reject.

      *   **Case B (Flood Wall):**
          *   Cost: (Implied within budget, say $4k).
          *   Payoff: Prevent serious harm to a village.
          *   Prob: 5% (1 in 20).
          *   *Checklist:*
              *   Evidence? Engineering estimates/History. (Green)
              *   Payoff Cap? Finite (village safety). (Green)
              *   Precedent? Infrastructure is a normal fund target. (Green)
              *   *Result:* Escalate/Consider (due to low prob, but not a mugging).

  5.  **Developing the "Counter-Intuitive" Case:**
      *   Need a case where the checklist says "Fund" but humans feel "No," OR checklist says "Reject" but humans feel "Yes."
      *   *Idea:* The "Sure Thing vs. Life Saver."
      *   *Scenario:* $5k to save a specific identifiable person vs. $5k to statistically save 10 unnamed people.
      *   *Better Idea for Pascal Context:* A high-probability, low-payoff boring project vs. a low-probability, high-payoff existential risk project.
      *   *Let's try:* "The Butterfly Effect." A $100 project to teach one kid ethics, claiming it might prevent a future war.
      *   *Checklist:* Evidence is weak (causal chain), Payoff is unbounded (world peace). Checklist should Reject.
      *   *Wait, I need the checklist to say something they'd **hate**.*
      *   *Scenario:* The checklist might force a **Reject** on a "Moonshot" that actually has *some* merit, just because it looks like a mugging.
      *   *Example:* Early-stage high-risk research. E.g., $1k for a student to test a radical new battery chemistry. 1% chance of success, but if it works, huge climate impact.
      *   *Checklist Reaction:* Probability too low? Payoff too big? Precedent risky? It might flag this as a "Mugging" even though it's legitimate high-risk research.
      *   *Why they'd hate it:* It kills innovation.
      *   *Refinement:* Let's make it about the "Ignore Tiny Probabilities" rule. If we set a hard cutoff (e.g., ignore anything <1%), we miss legitimate black swan opportunities.

  6.  **Identifying What the Checklist Can't Settle:**
      *   Values. (Is art worth more than food?)
      *   True uncertainty vs. Risk. (Knightian uncertainty).
      *   Moral weight of different outcomes.

  7.  **Finalizing the Output Structure:**
      *   **Intro:** Acknowledge the constraint (1 hour, non-philosophers).
      *   **The 15-Minute "Anti-Mugging" Checklist:** 4 clear questions with Pass/Fail criteria.
      *   **Decision Matrix:** How to tally the results.
      *   **Toy Case Walkthroughs:** Apply the checklist to A and B.
      *   **The "Hateable" Outcome:** Show where the checklist is too blunt.
      *   **The "Unsettled" Zone:** What requires human judgment.

  8.  **Refining the Checklist for Speed:**
      *   Make it a "Stoplight" system.
      *   Q1: **Verification:** Can an expert verify the probability in 10 mins?
      *   Q2: **Scope:** Is the benefit contained within a reasonable timeframe/scope?
      *   Q3: **Repeatability:** Could we fund 20 of these without going broke?
      *   Q4: **Comparison:** Is there a 'boring' alternative with similar EV but less risk?

      *   *Wait, keep it simpler.*
      *   1. **The "Show Your Work" Test:** Is the probability based on data/models (Pass) or intuition/story (Fail)?
      *   2. **The "Billboard" Test:** If the payoff happened, could we prove it to a skeptic? (Pass = Yes, Fail = No).
      *   3. **The "Budget Blowup" Test:** If we said yes to every pitch like this, would we be bankrupt? (Pass = No, Fail = Yes).

      *   *Decision Rule:*
          *   2+ Fails = **Reject** (Do not spend >15 mins).
          *   1 Fail = **Escalate** (Needs senior review/longer debate).
          *   0 Fails = **Green Light** (Proceed to normal vetting).

  9.  **Drafting the Content (incorporating the constraints):**
      *   *Tone:* Practical, direct, slightly informal (matching the user).
      *   *Case A:* Will fail Verification and Billboard. Reject.
      *   *Case B:* Will pass Verification (engineering) and Billboard. Pass Budget (5% is low but not mugging levels). Green/Escalate depending on cost.
      *   *Hateable Case:* High-risk research (1% chance, huge payoff). Checklist rejects it as a mugging.
      *   *Unsettled:* Value judgments (Art vs. Science).

  10. **Review against constraints:**
      *   15 mins? Yes, checklist is short.
      *   Clear Reject/Escalate? Yes.
      *   Toy cases included? Yes.
      *   Hateable outcome included? Yes.
      *   Unsettled issues included? Yes.

  11. **Final Polish:** Ensure the distinction between "Pascal's Mugging" (epistemic black hole) and "High Risk/High Reward" (legitimate uncertainty) is clear in the "Hateable" section. This is the crucial nuance for a uni fund.

  **(Self-Correction during drafting):** Make sure I don't get too technical with the philosophy. Keep it to "Can we check this?" and "Can we afford this?" The user said they aren't philosophy people.

  Let's refine the "Hateable" case. A checklist designed to stop muggings will inherently punish *existential risk reduction* or *moonshot science*. That's the trade-off. I should highlight that.

  Let's refine the "Unsettled" part. The checklist handles *epistemic* risk (is this real?), but not *normative* risk (is this good?).

  Okay, ready to write.cw
answer: |-
  Here is a practical, 15-minute "Anti-Mugging" Checklist designed for a non-philosophy committee. It translates the heavy philosophical concepts (bounded utility, epistemic hygiene, policy-based reasoning) into administrative red flags.

  ### The 15-Minute "Anti-Mugging" Checklist

  **Instructions:** Read the pitch. Answer the three questions below. Tally the **Red Flags**.

  #### 1. The "Show Your Work" Test (Epistemic Hygiene)
  *   **Question:** Is the probability estimate based on historical data, a model, or expert consensus? Or is it based on a story, intuition, or "it's possible"?
  *   **🟢 Pass:** Data/Model/Expert opinion exists.
  *   **🔴 Fail:** The number is a guess, a hunch, or derived from a theoretical "possibility."

  #### 2. The "Billboard" Test (Bounded Payoff)
  *   **Question:** If the project succeeds, can we verify the outcome within a reasonable timeframe (e.g., 5 years) to a skeptic?
  *   **🟢 Pass:** The benefit is measurable and finite (e.g., "50 people housed," "CO2 reduced by X tons").
  *   **🔴 Fail:** The benefit is infinite, unbounded, or unverifyable (e.g., "infinite simulated lives," "preventing all future war," "saving the soul").

  #### 3. The "Budget Blowup" Test (Policy/Rule)
  *   **Question:** If we accepted this *type* of reasoning for every similar pitch we receive this year, would we run out of money?
  *   **🟢 Pass:** No. This is a unique opportunity or rare category.
  *   **🔴 Fail:** Yes. If we fund every "tiny chance of huge good" pitch, we fund nothing else.

  ---

  ### Decision Matrix

  *   **2 or 3 Red Flags:** **REJECT.** (Do not spend more than 15 minutes on this. It is a Pascal's Mugging.)
  *   **1 Red Flag:** **ESCALATE.** (This needs a longer debate or senior review. It might be a moonshot, or it might be a trap.)
  *   **0 Red Flags:** **GREEN LIGHT.** (Proceed to standard vetting. The EV calculation is likely safe to use.)

  ---

  ### Testing the Checklist on Your Toy Cases

  #### Case A: The Math Proof / Simulated Lives
  *   **Pitch:** $400 for a brute-force search. 1 in 2 million chance. Payoff: Vast happy simulated lives.
  *   **1. Show Your Work:** 🔴 **Fail.** A 1 in 2 million chance for a specific mathematical breakthrough is a guess, not a model.
  *   **2. Billboard:** 🔴 **Fail.** "Vast simulated lives" is unbounded and unverifyable by your committee.
  *   **3. Budget Blowup:** 🔴 **Fail.** If you fund every math student claiming a 1-in-a-million shot at infinity, your fund is gone.
  *   **Total:** 3 Red Flags.
  *   **Decision:** **REJECT.**
  *   **Why:** This is a classic Mugging. The payoff is theoretically infinite, which breaks the math, and the probability is epistemically hollow.

  #### Case B: The Flood Wall
  *   **Pitch:** Pay for a flood wall. 5% chance of preventing serious harm to a village.
  *   **1. Show Your Work:** 🟢 **Pass.** 5% is likely based on hydrological data or historical flood records.
  *   **2. Billboard:** 🟢 **Pass.** "Village not flooded" is a finite, verifiable outcome.
  *   **3. Budget Blowup:** 🟢 **Pass.** Infrastructure projects are rare; funding this doesn't mean you fund every 5% risk project forever.
  *   **Total:** 0 Red Flags.
  *   **Decision:** **GREEN LIGHT** (for standard vetting).
  *   **Why:** This is standard risk management, not a Mugging. 5% is low, but it is within the realm of normal decision-making.

  ---

  ### The Case Where The Checklist Says Something You'll Hate

  **The "Moonshot Science" Case**
  *   **Pitch:** A PhD student wants $2,000 to test a radical new battery chemistry.
  *   **Probability:** 1% chance it works (based on preliminary, shaky data).
  *   **Payoff:** If it works, it solves energy storage for the region (Huge but finite payoff).
  *   **Checklist Result:**
      *   **Show Your Work:** 🔴 **Fail.** (1% is essentially a guess at this stage).
      *   **Billboard:** 🟢 **Pass.** (We can test if the battery works).
      *   **Budget Blowup:** 🔴 **Fail.** (If you fund every 1% science bet, you go broke).
      *   **Total:** 2 Red Flags $\rightarrow$ **REJECT.**

  **Why you'll hate this:**
  This checklist is designed to protect you from scams and philosophical traps, so it is **biased against innovation.** Legitimate high-risk/high-reward research looks *exactly* like a Pascal's Mugging in the early stages. By strictly following this checklist, you will never fund a "black swan" breakthrough. You are trading potential moonshots for fund security.

  **Fix:** If your fund's mission *includes* funding high-risk research, you must create a separate "Moonshot Bucket" (e.g., 10% of the budget) where this checklist is suspended.

  ---

  ### What The Checklist Cannot settle

  The checklist handles **epistemic risk** (is this claim real?) but it cannot handle **normative judgment** (what is good?).

  **The "Art vs. Food" Deadlock:**
  *   **Project X:** $5k to feed 500 students for a week. (Verifiable, Finite, Repeatable). **0 Red Flags.**
  *   **Project Y:** $5k to host a niche poetry festival that might "change the cultural landscape." (Unverifiable payoff, Hard to measure). **1 or 2 Red Flags.**

  The checklist will tell you Project X is "safer" and Project Y is "riskier." It **cannot** tell you if poetry is worth more than food. That is a value judgment your committee has to make based on your fund's mission statement, not on expected value math.

  **Summary for your 1-hour meeting:**
  1.  Run the 3-question checklist first.
  2.  If it gets 2+ Red Flags, kill it immediately to save time.
  3.  If it passes, argue about values (Art vs. Food), not math.
  4.  Accept that you will miss some moonshots to avoid being scammed.
