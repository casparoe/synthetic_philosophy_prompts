prompt: |-
  I'm a junior and I lead one discussion section a week — fifty minutes, about fifteen first-years — for our intro course in comparative ethics. The students have just come out of two weeks on Aristotle (aretē, habituation, the function argument, phronesis, and a lot of practice applying the doctrine of the mean), and next week the syllabus gives me exactly one session on early Confucian ethics. I want to spend it on the reading of that material as role ethics rather than as virtue ethics: the point of the unit is the contrast with what they just learned, and I'd rather they not file Confucius away as Aristotle with Chinese names. So please don't explain Confucian role ethics to me — plan how I should teach it in that slot, treating the Aristotle they've just had as simultaneously my best hook and my biggest obstacle.

  Concretely, four things. First, the order the ideas have to go in, with the dependencies made explicit rather than asserted. My instinct is that nothing lands until they see the constitutive claim — that on this kind of view a person is made up of her roles rather than being an antecedently existing individual who then takes roles on — and that this has to be in place before either filial piety or humaneness gets introduced, because otherwise the one reads as a duty attached to an already-given agent and the other as generic benevolence. Tell me whether that really is where to begin, and what else has to be on the board first. Second, the single case or example that should carry the whole session, and what it has to have and lack. My candidate is the exchange in the Analects where Confucius is asked about a son who turns in his father for stealing a sheep and answers, more or less, that father and son should cover for each other and that being upright consists in that concealment: it forces the point that the very same act changes its valence with the relationship, and it makes the class's first objection audible instead of my having to invent it. But I'm afraid it will eat the hour in a debate about corruption and nepotism, or collapse into so it's all just relative, and I keep considering alternatives — something mundane and modern, like a teaching assistant who is also someone's friend, or the move from family to state that the texts themselves make — though I suspect the latter will just make them hear patriarchal hierarchy. Argue me into one of these or into something better, and say what the carrying case must contain (improvisation within a role? a real collision between two roles?) and what it must not contain.

  Third, the misconceptions they will form, in roughly the order they'll form them, and the exact point in the sequence where I should head each one off. I'm expecting role ethics says do whatever your society expects as the big one; also that it's virtue ethics with the virtues renamed; that if the person is relational then there is no self left and nobody is responsible for anything; that filial piety means obedience — I want gently remonstrating with a parent to appear somewhere, and I'm not sure where in the arc it belongs; and that the view has nothing to say about how to treat strangers, so it isn't a moral theory at all. Add the ones I haven't listed, including any that my Aristotle framing specifically invites. Fourth, one question for the last five minutes that would show me they've got the constitutive claim and are applying it rather than parroting it — I was going to hand them a role we never discussed and ask what being good at it consists in, but tell me if that's gameable, and what the tell would be. And then tell me what I should openly decline to cover at this level: I'm inclined to skip the scholarly fight over whether the early texts are better read as a species of virtue ethics or as something irreducibly role-based, and to skip the disagreement about whether human nature is already disposed toward the virtues or has to be shaped by training and ritual, but say plainly if cutting either of those costs me the session.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Request:**
      *   **User:** Junior leading a 50-minute discussion section for 15 first-years.
      *   **Course:** Intro to Comparative Ethics.
      *   **Context:** Students just finished 2 weeks on Aristotle (virtue ethics, habituation, function argument, *phronesis*, doctrine of the mean). Next week is *one* session on Early Confucian Ethics.
      *   **Goal:** Teach Confucianism as *Role Ethics* (constitutive roles), explicitly contrasting it with Aristotle (Virtue Ethics). Avoid "Aristotle with Chinese names."
      *   **Constraints:** 50 minutes, 15 students.
      *   **Specific Requests:**
          1.  Order of ideas (dependencies explicit). Is "constitutive claim" the right starting point?
          2.  The single carrying case/example (Analects 13.18 "Father covers for son"? TA/Friend? Family/State?). What must it contain/lack?
          3.  Misconceptions (order of appearance, when to head them off). Include new ones specific to the Aristotle framing.
          4.  Final assessment question (last 5 mins). Is "new role" gameable? What's the tell?
          5.  What to openly decline to cover (scholarly debates, human nature).

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Aristotle Hangover:* Students are primed to look for "the good person," "character traits," and "habituation." They will try to map *ren* (humaneness) onto *arete* (virtue) and *li* (ritual) onto habituation.
      *   *The Time Crunch:* 50 minutes is incredibly tight for a dense philosophical shift. Every minute counts.
      *   *The Core Shift:* Moving from "Individual $\rightarrow$ Roles" (Aristotle/Western Liberalism) to "Roles $\rightarrow$ Individual" (Confucian Role Ethics).
      *   *The Risk:* Students dismissing Confucianism as nepotism/corruption (Analects 13.18 risk) or relativism.

  3.  **Address Request 1: Order of Ideas:**
      *   *User's Instinct:* Start with the constitutive claim (Person = Roles).
      *   *Evaluation:* This is philosophically sound but pedagogically risky as an *opening* abstraction. First-years need a hook. However, if we start with specific virtues (Filial Piety), they *will* map them to Aristotle immediately.
      *   *Decision:* The user is right. The ontological shift must precede the ethical specifics. But it can't be a lecture. It needs to be drawn out of them.
      *   *Sequence:*
          1.  Review Aristotle's "Unencumbered Self" (The Hook/Obstacle).
          2.  Introduce the Confucian "Relational Self" (The Constitutive Claim).
          3.  Apply to Specific Role (Father/Son).
          4.  Derive the Ethical Action (Covering vs. Reporting).
          5.  Expand to Strangers/State (Addressing the "No Moral Theory" objection).
      *   *Dependency:* You cannot understand *why* covering for the father is "upright" (*zhi*) without accepting that "father" and "son" are not just hats the agents wear, but what they *are*.

  4.  **Address Request 2: The Carrying Case:**
      *   *Candidate 1: Analects 13.18 (Sheep Stealing).*
          *   *Pros:* Textual, forces the valence shift, makes the "corruption" objection immediate.
          *   *Cons:* High risk of derailing into modern legalism/corruption.
      *   *Candidate 2: TA/Friend.*
          *   *Pros:* Relatable.
          *   *Cons:* Too thin, lacks the weight of "sacred" roles, might feel like simple conflict of interest rather than constitutive identity.
      *   *Candidate 3: Family to State.*
          *   *Pros:* Textually grounded.
          *   *Cons:* Hierarchy vibes, abstract.
      *   *Decision:* Stick with **Analects 13.18 (The Sheep)**, but *frame* it carefully. It's the strongest textual evidence for the constitutive claim. If you remove the stakes, the point blunts.
      *   *Requirements:* It must show that the *act* (concealing) is virtuous *only because* of the relation. It must lack modern legalistic framing (don't talk about "law," talk about "uprightness").
      *   *Modification:* Don't let them debate "Is corruption bad?" Debate "What is *zhi* (uprightness)?"

  5.  **Address Request 3: Misconceptions:**
      *   *List:*
          1.  "It's just social conformity/expectations." (Role Ethics $\neq$ Conformity)
          2.  "It's Virtue Ethics with Chinese names." (*Ren* $\neq* *Arete*)
          3.  "No Self/No Responsibility." (Relational $\neq$ Dissolved)
          4.  "Filial Piety = Blind Obedience." (Remonstrance is key).
          5.  "No ethics for strangers." (The expansion problem).
          6.  *Aristotle-Specific:* "Habituation is the same as Ritual (*Li*)." (Ritual creates the relationship, not just the habit).
      *   *Timing:*
          *   Conformity: Head off immediately when defining roles.
          *   Virtue Ethics Clone: Head off during the Sheep case.
          *   Blind Obedience: Introduce *after* the Sheep case to show nuance (Analects 4.18).
          *   Strangers: End of class (expansion).

  6.  **Address Request 4: Final Assessment Question:**
      *   *Idea:* Hand them a new role.
      *   *Critique:* Gameable if they just list expectations.
      *   *Better:* Ask them to describe a *failure* in that role that isn't a moral failure in the Aristotelian sense. Or ask how the role *changes* them.
      *   *Selection:* "Describe a failure specific to the role that wouldn't make sense if you were just a 'good person' playing that role."
      *   *Tell:* If they describe a universal moral failing (lying, stealing), they missed the point. If they describe a relational failing (ignoring a text, forgetting an anniversary, teaching to the test rather than the student), they got it.

  7.  **Address Request 5: What to Decline:**
      *   *Human Nature (Mencius vs. Xunzi):* Cut it. It distracts from the Role/Structure focus.
      *   *Virtue vs. Role Scholarship:* Cut it. Explicitly tell students "Scholars fight about this, but today we are trying on the Role lens to see the contrast."
      *   *Cost:* Minimal cost for a 50-min intro. Essential for clarity.

  8.  **Drafting the Plan (Iterative Refinement):**
      *   *Timing:* 50 mins is brutal.
          *   0-5: Aristotle Recap (The Setup).
          *   5-15: The Constitutive Claim (The Ontological Shift).
          *   15-30: The Sheep Case (The Application).
          *   30-40: Misconceptions (Remonstrance & Strangers).
          *   40-45: Assessment.
          *   45-50: Wrap/Decline.
      *   *Refining the "Constitutive Claim":* Use the "Mask" metaphor. Aristotle: You wear the mask. Confucius: You *are* the mask (and the face beneath is irrelevant).
      *   *Refining the Sheep Case:* Make sure to emphasize Confucius doesn't say "Stealing is good." He says "Uprightness is found *here*."
      *   *Refining the Aristotle Contrast:* Aristotle = What would a rational agent do? Confucius = What does this specific relationship require?

  9.  **Final Review against Constraints:**
      *   Did I explain Role Ethics to the user? No (they asked me not to).
      *   Did I address the four concrete things? Yes.
      *   Is the tone appropriate? Yes, peer-to-peer, pedagogical, respectful of their expertise.
      *   Did I handle the "Aristotle Obstacle"? Yes, by using it as the foil.

  10. **Final Polish:** Ensure the dependencies in section 1 are logical. Ensure the misconceptions in section 3 are ordered chronologically as they arise in class. Ensure the assessment in section 4 is robust. (Self-Correction: Make sure to emphasize *Li* (Ritual) as the grammar of roles, not just habit, to distinguish from Aristotle).

  *(Self-Correction during drafting)*: I need to be careful not to make Confucianism sound *too* alien. The goal is contrast, not exoticism. The "Constitutive Claim" is the hardest philosophical lift. I need to give the TA a way to elicit that from students, not just state it. *Idea:* Ask "Who are you?" and track the answers. They will answer with roles. Point that out.

  *(Refining the Assessment)*: The "New Role" idea is good, but the prompt needs to be specific. "You are a roommate. What does a *bad* roommate do that a *bad person* might not do?" This isolates the role-specificity.

  *(Refining the Decline)*: Be explicit that skipping the "Virtue vs Role" debate is actually *doing* the pedagogy, not avoiding it. We are stipulating the lens for the sake of contrast.

  Okay, ready to write.
answer: |-
  Here is a plan for the 50-minute session, designed to leverage the Aristotle unit as a foil while preventing the "Aristotle with Chinese names" collapse.

  ### 1. The Order of Ideas (Dependencies)

  Your instinct is correct: **The constitutive claim must be the foundation.** If you introduce *filial piety* (the virtue) before the *relational self* (the ontology), students will treat filial piety as a rule an independent agent chooses to follow. That is Kantian or Aristotelian, not Confucian.

  Here is the necessary sequence for the board, with the dependencies explicit:

  1.  **The Aristotelian Baseline (The Hook):** The agent exists *prior* to their roles. Roles are accidental; character (*hexis*) is essential.
      *   *Dependency:* This must be established first so they see what is being overturned.
  2.  **The Constitutive Claim (The Ontological Shift):** The person is the sum/intersection of their roles. There is no "I" prior to "son," "teacher," "friend."
      *   *Dependency:* Cannot be understood until #1 is clear. This is the pivot point.
  3.  **The Source of Value (The Ethical Shift):** Right action is not determined by universal reason or mean-seeking, but by **role-specific requirements**.
      *   *Dependency:* Requires #2. If the person *is* the role, then fulfilling the role *is* self-actualization.
  4.  **The Specific Virtues (The Application):** *Filial Piety* and *Humaneness* (*Ren*) are not generic traits but **skills of relating**.
      *   *Dependency:* Requires #3. Otherwise, *Ren* looks like generic benevolence.
  5.  **The Expansion (The Scope):** Ethics extends from family to state not by analogy, but by **role extension**.
      *   *Dependency:* Requires #4. Prevents the "nepotism" objection.

  **What else has to be on the board first?**
  Before you even state #2, you need the term **_Li_ (Ritual/Propriety)**. In Aristotle, habituation creates character. In Confucianism, *Li* creates the **relationship**. You must distinguish *habit* (internal state) from *ritual* (interactive grammar). If you don't distinguish these, they will map *Li* directly onto Aristotelian habituation and miss the relational component.

  ### 2. The Carrying Case

  Stick with **Analects 13.18 (The Sheep)**. Do not swap it for the TA/Friend example.
  *   **Why:** The TA example is too easily solved by "conflict of interest" (a modern bureaucratic concept). The Sheep case is visceral. It forces the students to feel the friction between "Universal Law" (don't steal) and "Role Ethics" (protect the father). It makes the "corruption" objection inevitable, which is exactly what you want to harvest.
  *   **What it must contain:** It must contain a **collision of valences**. The act (concealing) is legally/morally negative in a universal frame, but ethically positive in the role frame. This proves the valence comes from the *relation*, not the *act*.
  *   **What it must lack:** It must lack **modern legalistic framing**. Do not let them discuss "law," "justice system," or "civil duty." If they argue about the rule of law, you lose the session. Keep the focus on the word Confucius uses: *Zhi* (Uprightness/Straightness). Confucius is redefining what "straight" means, not arguing about legal loopholes.

  **How to run it without losing the hour to "Nepotism is bad":**
  When they object ("But stealing is wrong!"), do not defend corruption. Instead, ask: *"Confucius isn't saying stealing is good. He's saying 'Uprightness' is found in the protecting. If 'Uprightness' depends on who you are protecting, where is the 'Good Person' located?"* This forces them back to the Constitutive Claim (#2 above).

  ### 3. Misconceptions (Order and Intervention)

  Here are the misconceptions in the order they will arise, with the exact intervention point.

  1.  **"This is just Social Conformity."**
      *   *When:* Immediately after you introduce the Constitutive Claim (#2).
      *   *Intervention:* Distinguish **Script** from **Improvisation**. A role isn't a robotic script; it requires *Phronesis*-like judgment, but the *standard* for judgment is the relationship's health, not abstract reason. Use the term "Mastering the role" vs. "Following the rules."
  2.  **"It's Virtue Ethics with Chinese Names."** (The Aristotle Hangover)
      *   *When:* During the Sheep Case (#3). They will say, "So *Filial Piety* is just a virtue like Courage."
      *   *Intervention:* Remind them: In Aristotle, Courage is a trait *I have*. In Confucianism, Filial Piety is a **space between us**. You cannot be filial alone in a room. You cannot be courageous alone in a room. One is internal; one is interactive.
  3.  **"Filial Piety = Blind Obedience."**
      *   *When:* After the Sheep Case, when the "Patriarchy" objection arises.
      *   *Intervention:* Introduce **Analects 4.18** (Remonstrance). "In serving your father and mother, you may gently remonstrate with them." This is crucial. It shows the role requires *maintaining the relationship*, which sometimes means correcting the other person. Blind obedience breaks the relationship (makes the parent unjust); remonstrance sustains it.
  4.  **"If I'm just my roles, there's no Self/Responsibility."**
      *   *When:* Late in the discussion, often from a student trying to synthesize.
      *   *Intervention:* Clarify that the "Self" isn't deleted; it's **distributed**. Responsibility is heightened, not lessened, because you cannot opt out of the role without ceasing to be who you are.
  5.  **"It has no ethics for Strangers."** (The "No Moral Theory" objection)
      *   *When:* The final objection before the assessment.
      *   *Intervention:* Explain **Role Extension**. We treat strangers not as "humans" (abstract category) but by finding a potential role connection (guest/host, elder/younger). *Ren* (Humaneness) is the ability to extend role-care outward. It's not universalism; it's expanding circles.

  **The Aristotle-Specific Misconception:**
  *   **"Habituation = Ritual."**
      *   *When:* Any mention of training/practice.
      *   *Intervention:* Aristotle's habituation makes *me* excellent. Confucian Ritual (*Li*) makes *us* harmonious. One polishes the soul; the other tunes the interaction.

  ### 4. The Final Assessment Question

  Your idea (hand them a new role) is gameable. Students will just list social expectations ("A good barista smiles"). That tests sociology, not the constitutive claim.

  **The Better Question:**
  *"Describe a failure specific to being a [Roommate/Teammate] that would **not** count as a moral failure for a 'Good Person' in the Aristotelian sense."*

  *   **Why this works:** It forces them to isolate the *role-specific* obligation from the *universal* obligation.
  *   **The Tell:**
      *   *Failed Understanding:* "A bad roommate steals." (Stealing is universally wrong, Aristotelian vice).
      *   *Successful Understanding:* "A bad roommate leaves dishes in the sink even if they are honest and brave." OR "A bad teammate shows up on time but doesn't know the plays." (These are failures of *relation* and *role*, not failures of universal character).
  *   **Gameability Check:** If they struggle, prompt them: "Can you be a virtuous person (courageous, temperate) but still fail at this specific role?" If they say yes, they have grasped the constitutive claim.

  ### 5. What to Openly Decline

  You should explicitly decline two things at the start or end of class. This manages expectations and protects your 50 minutes.

  1.  **The "Virtue vs. Role" Scholarly Debate:**
      *   *Say this:* "Scholars argue fiercely about whether Confucius is actually a virtue ethicist. Today, we are stipulating the Role Ethics reading *not* because it's the only one, but because it provides the sharpest contrast to Aristotle. We are using it as a lens."
      *   *Cost:* Zero. Acknowledging the debate actually increases your credibility while freeing you from having to resolve it.
  2.  **Human Nature (Mencius vs. Xunzi):**
      *   *Say this:* "We are skipping the question of whether humans are naturally good or need shaping. Whether the seed is there or not, the *structure* of the ethics remains role-based."
      *   *Cost:* Low. This is metaphysics; you are teaching normative structure. For a 50-minute contrast session, the ontology of the *person* (roles) matters more than the ontology of *nature* (good/evil).

  **Summary of the 50-Minute Arc:**
  *   **0-5:** Aristotle Recap (Unencumbered Self).
  *   **5-15:** The Constitutive Claim (Person = Roles). *Intervention: Conformity objection.*
  *   **15-30:** The Sheep Case (Analects 13.18). *Intervention: Virtue Ethics mapping & Nepotism objection.*
  *   **30-40:** Remonstrance & Strangers (Analects 4.18 + Extension). *Intervention: Blind Obedience & No Theory objections.*
  *   **40-45:** Assessment Question (Role-specific failure).
  *   **45-50:** Decline the scholarly debates; wrap up.

  This keeps the Aristotle comparison active as a diagnostic tool throughout, rather than letting it sit as a static background memory.
