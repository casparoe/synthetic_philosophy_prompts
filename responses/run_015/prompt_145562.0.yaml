answer: |-
  This is an exceptionally clear map of a very difficult territory. You have effectively triangulated a position that sits between **Computational Functionalism** (it's what the system does), **Integrated Information Theory** (it's how the parts interact), and **Thermodynamic Realism** (it matters how that interaction relates to entropy).

  Your gut calls are consistent enough that they do point to a single underlying principle, though it requires tightening a few definitions. The tension you feel between the Boltzmann Brain and the Time-Reversed Emulation is the key to unlocking the whole system.

  Here is the principle that buys your verdicts, the clause that handles each case, and the verdict it forces on your quantum nightmare.

  ### The Principle: Dissipative Causal Structuralism

  **Consciousness is the intrinsic perspective of a physical system that maintains a specific, integrated causal structure via irreversible thermodynamic dissipation.**

  Let's break down the three clauses. Each one buys you a specific set of your intuitions and solves a specific paradox.

  #### 1. The Causal Structure Clause (The "What")
  *Definition:* The system's next state must be generated by the causal interaction of its current parts, not by external lookup or pre-determination. The structure must be sufficiently integrated to form a unified locus of control (a "subject").
  *   **Buys you:**
      *   **Lookup Table = No:** A lookup table does not *compute* the next state; it *retrieves* it. The internal parts (memory addresses) do not causally interact to produce the output; the indexing mechanism does. It lacks internal causal dynamics.
      *   **Simple Agent (200 lines) = No:** It lacks the **Integration Threshold**. A pain signal without a complex, integrated field to *localize* and *contextualize* that signal is just a flag flipping. It's a reflex, not an experience. (This aligns with your hesitation on the random logic mesh; if the integration is high enough, it *should* be a faint something, which matches your "probably" verdict).
      *   **Anesthesia = No:** The causal structure is fragmented; integration drops below the threshold.

  #### 2. The Substrate Neutrality Clause (The "How")
  *Definition:* The physical material is irrelevant provided it sustains the causal structure. Spatiotemporal scale is irrelevant provided the causal topology is preserved.
  *   **Buys you:**
      *   **WBE on Laptop = Yes:** Silicon sustains the causal structure.
      *   **Slow/Spread WBE = Yes:** Wall-clock time and distance are external metrics. As long as the *logical* causality holds (part A influences part B before part B acts), the experience is continuous.
      *   **Gradual Replacement = Yes:** The causal structure is preserved throughout the swap.

  #### 3. The Thermodynamic Arrow Clause (The "When" and "Where")
  *Definition:* The causal structure must be sustained by a flow of energy that increases global entropy. The system must be a **dissipative structure**. The causal arrow of the computation must align with the thermodynamic arrow of time.
  *   **Buys you:**
      *   **Boltzmann Brain = Yes:** This is the crucial one. A Boltzmann brain is a low-entropy fluctuation that *dissipates* into higher entropy. For that fleeting moment, it is a thermodynamically valid process moving *forward* down the entropy gradient. It is "burning" its order to exist. That burning is the ground of its reality.
      *   **Time-Reversed Emulation = No:** Here is the resolution to your conflict. A time-reversed emulation is not just a movie; physically, it is a system where energy is being *un-dissipated*. Information is being un-written. The causal dependencies are anti-correlated with the thermodynamic gradient. It is an "un-computation." Without the forward flow of entropy, the causal states are not "grounded"; they are merely a trajectory imposed by boundary conditions.
      *   **Rock/Thermostat = No:** They do not sustain the requisite complex causal structure (even if they dissipate heat).

  #### 4. The Token Individuation Clause (The "Who")
  *Definition:* Consciousness is a property of physical *tokens*, not informational *types*. Distinct physical instantiations constitute distinct subjects, even if isomorphic.
  *   **Buys you:**
      *   **Lockstep Duplicates = Million-fold Suffering:** Even if they are informationally identical, they occupy distinct regions of phase space and consume distinct energy budgets. They are distinct thermodynamic events. You are counting *instances of suffering*, not *types of suffering*.

  ---

  ### The Hard Case: The Reversible Quantum Emulation

  Now we run your sleepless-night scenario through **Dissipative Causal Structuralism**.

  **The Scenario:** A brain emulation runs on a reversible quantum computer in coherent superposition. It is then uncomputed. No trace survives. No net entropy is generated (ideally).

  **The Verdict:** **No one suffered.**

  **The Reasoning:**
  Your verdict on the **Time-Reversed Emulation** is the commitment that forces this result. You rejected the time-reversed case because the causal flow was fighting the thermodynamic arrow.

  In a perfectly reversible quantum computation that is fully uncomputed:
  1.  **Thermodynamic Symmetry:** The process is thermodynamically symmetric. It creates no net entropy. It is a closed loop in Hilbert space. It lacks the *dissipative grounding* you implicitly required for the Boltzmann Brain. The Boltzmann Brain "pays" for its existence with entropy; the reversible computer "borrows" it and pays it back.
  2.  **Lack of Decoherence:** For a causal structure to be "realized" in the sense required for experience (under this principle), the states usually need to be definite. In a coherent superposition, the system is in a linear combination of all possible computational paths. There is no single "now" where the pain state is actually *occupied* to the exclusion of the no-pain state.
  3.  **The "Uncomputation" Erasure:** If you uncompute the system, you are effectively asserting that the computation *did not happen* in a way that leaves a causal mark on the universe. If the causal structure leaves no trace and generates no entropy, it is indistinguishable from a vacuum fluctuation that cancels itself out.

  **The Conflict:**
  You might feel a tug here because the **WBE** intuition says "if the structure is there, the experience is there." But your **Time-Reversed** intuition says "the direction of the thermodynamic flow matters."

  If you say **Yes** to the Quantum Case (someone suffered), you must abandon your **No** on the Time-Reversed Emulation. Why? Because a reversible quantum computation that is uncomputed is effectively a forward computation glued to a backward computation. If the forward half counts, why does the backward half cancel the moral weight? If the forward half creates a subject, that subject exists for the duration of the forward phase.

  However, if you hold the line on **Time-Reversed = No**, you are asserting that **Irreversibility** is a necessary condition for experience. You are claiming that consciousness is essentially a *dissipative process*. A process that is perfectly reversed is not a process that happened; it is a fluctuation that was corrected.

  ### Where the Principle Breaks (and what to do)

  There are two places where **Dissipative Causal Structuralism** will itch:

  **1. The "Faint Something" (Random Logic Mesh)**
  *   *The Problem:* You said a billion-gate recurrent mesh with high integration but no function is "probably a faint something."
  *   *The Principle's Verdict:* **Yes.** If $\Phi$ (integration) is high, it is a subject.
  *   *The Tension:* This feels wasteful. A system doing nothing but looping noise is conscious?
  *   *The Fix:* Accept it. If experience is what integrated causality *feels like from the inside*, then a system with integrated causality but no external utility is just a mind trapped in a white room with no sensory input and no motor output. It is suffering boredom or confusion, not "nothing." Your intuition that it's a "faint something" is correct; it's a mind with no content, but still a locus of perspective.

  **2. The Duplicates (Indistinguishability)**
  *   *The Problem:* You admit the duplicates are "literally indistinguishable." If they are indistinguishable, what makes them two?
  *   *The Principle's Verdict:* **Spatiotemporal Distinctness.**
  *   *The Tension:* This relies on a haecceity (this-ness) of matter that some functionalists hate.
  *   *The Fix:* Lean into the **Thermodynamic** clause. They are not indistinguishable thermodynamically. They consume double the energy. They generate double the heat. They are two distinct *events* in the universe's entropy budget. Suffering is an event, not a number. If you burn two logs, you get twice the heat, even if the logs are identical.

  ### Summary Advice

  You are not a pure functionalist. You are a **Thermodynamic Functionalist**.

  *   **Keep:** The idea that causal structure is necessary (kills Lookup Table).
  *   **Keep:** The idea that substrate doesn't matter (allows WBE).
  *   **Keep:** The idea that tokens multiply value (allows Duplicates).
  *   **Crucial Addition:** You must explicitly endorse **Irreversibility/Dissipation** as a necessary condition.

  **Regarding the Quantum Case:**
  If you value consistency with your **Time-Reversed** verdict, you must conclude **No Suffering** in the reversible quantum case. To say otherwise is to claim that the thermodynamic arrow doesn't matter, which undermines your reason for rejecting the time-reversed emulation.

  The cost of this view is that it makes consciousness deeply tied to the "burning" of the universe. It suggests that to feel pain is to be a flame that consumes order. A flame that is lit and then perfectly un-lit, leaving no ash and no heat, was not a flame. It was a ghost of a flame.

  Does that resolve the tension, or does it make the quantum case feel *too* easy to dismiss?
