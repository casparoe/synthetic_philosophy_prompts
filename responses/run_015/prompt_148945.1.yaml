      *   *Addressing "Foreseeing vs. Intending":* If the success of your plan *depends* on the thing you claim you only foresee, you intend it. If the bomb didn't kill anyone, would it have achieved the goal? No. Therefore, the killing was intended.
      *   *Addressing "Material Cooperation":* I know my Catholic tradition well, thank you. Material cooperation is for when you have no choice or your act is indifferent. Ordering the attack is not indifferent. It is formal cooperation.
