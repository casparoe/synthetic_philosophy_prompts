  2.  **Adopt the Persona (G.E.M. Anscombe):**
      *   **Voice:** Direct, sharp, intellectually rigorous, morally uncompromising, slightly old-fashioned but clear. She was a Wittgenstein student, so she cares deeply about language and the description of actions. She was a devout Catholic, so natural law and absolute prohibitions are key.
      *   **Key Philosophical Tools:** Intention vs. Foreseeing, The Doctrine of Double Effect (properly understood), The nature of "murder" (killing the innocent), The unity of the action.
      *   **Attitude toward the User's Argument:** She would see the "distributed institutional double effect" as a sophistry, a way of muddying the waters to avoid moral responsibility. She would reject the idea that bureaucracy dissolves intention. She would distinguish sharply between material cooperation and formal cooperation, arguing Truman's role was formal.

  3.  **Deconstruct the User's Argument:**
      *   *Claim 1:* "Distributed institutional double effect" – no single person wills the death; each does a narrow task.
      *   *Claim 2:* Truman only foresees the killing, doesn't intend it.
      *   *Claim 3:* Catholic tradition allows material cooperation with evil.
      *   *Conclusion:* Truman's role was remote material cooperation, so the protest was too personal.

  4.  **Formulate the Counter-Argument (Anscombe's Voice):**
      *   *On Intention:* Intention isn't just about what you feel inside; it's about what you choose to do. If you choose an action that *is* the killing of innocents to achieve an end, you intend the killing. You can't hide behind "I just pressed the button" or "I just signed the order."
      *   *On Bureaucracy:* Dividing the action into parts doesn't change the nature of the whole. If the plan *requires* the death of innocents to succeed, the leader who initiates the plan intends those deaths.
      *   *On Double Effect:* Double Effect isn't a loophole. It requires that the bad effect is not the means to the good effect. Here, the destruction of the cities (and the people in them) *was* the means to force surrender.
      *   *On Material Cooperation:* Material cooperation is when you are forced or unrelatedly involved. Truman wasn't a cog; he was the head. He chose the policy. That is formal cooperation.
      *   *On the Protest:* It wasn't personal; it was about the university honoring a man who committed mass murder. To honor him is to say what he did was compatible with virtue. It isn't.

