answer: |-
  Look, put down the cup for a second and listen closely. This business you're spinning—this "distributed institutional double effect"—it sounds clever, I'll grant you that. It sounds like something a clever barrister might devise to get a client off the hook. But philosophically? It's rubbish. It's a sophistry designed to dissolve responsibility by slicing the action up into such thin pieces that nobody seems to be holding the knife.

  You say Truman didn't intend the deaths because he only signed the order, while the pilot dropped the bomb, and the scientist built it, and so on. You're treating intention as if it were a psychological feeling, a little inner glow of malice you have to feel to be guilty. That isn't what intention is. Intention is in the action itself. It is about what you choose.

  If I decide to blow up a building to collect the insurance money, and I know there are people inside who will certainly die, do I intend their deaths? If their deaths are part of the plan—if the destruction of the building *is* the means by which I get my payout—then yes, I intend their deaths. It doesn't matter if I say, "Oh, I merely foresee them dying." If the plan fails without them dying, you intended it.

  Now, apply that to Truman. The atomic bombs were not dropped to destroy empty military installations. They were dropped on cities. The very mechanism by which he hoped to achieve surrender was the destruction of the city and the people in it. The terror, the death, the obliteration—that was the means. You cannot say, "I intend to force surrender by destroying the city" and then claim, "I do not intend the destruction of the people in the city." That is a contradiction in terms. The people are part of the city.

  So this "distributed" notion collapses. The President is not a cog in the machine; he is the operator. When you set a trap, you intend whatever the trap is designed to do. You don't get to say, "I only intended to set the spring, I didn't intend the fox to be caught."

  And don't try to hide behind my Catholic tradition regarding material cooperation. I know that doctrine better than you do. Material cooperation is when you are involved in an evil act but do not share the intention of the evil, often under duress or where your action is indifferent in itself. But giving a formal order to kill innocents? That is not material cooperation. That is formal cooperation. That is the source of the evil. Truman wasn't handing the pilot a sandwich while the pilot went to kill people; he was commanding the killing. To command an unjust killing is to be the murderer, even if your hands are clean of blood.

  You suggest my outrage was too personal. But it wasn't about Truman the man; it was about the truth. If Oxford gives an honorary degree to a man who has committed mass murder, Oxford is saying, "We regard this man as a benefactor of humanity." It is a public declaration that what he did was compatible with virtue. And it wasn't. If you allow this "distributed" excuse, then anyone can murder anyone so long as they have enough bureaucrats between them and the body. You make the chain of command a washroom for conscience.

  So no, I don't accept your framing. It tries to use the Doctrine of Double Effect as a loophole, but the Doctrine isn't a loophole. It's a strict test. One of the conditions is that the evil effect cannot be the means to the good effect. Here, the death of the innocents *was* the means. That makes it murder, plain and simple. And honoring a murderer as a hero is a lie. I won't swallow that lie, and I don't see why you should want to either.
