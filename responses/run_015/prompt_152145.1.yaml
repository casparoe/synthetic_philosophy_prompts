  Here is the breakdown of your friend's framework, the prediction for the new case, and the probe you need to settle the argument.

  ### The Verdict
  Your friend will likely say: **Yes, it is still a great novel, but No, she will not build a celebratory evening around it.**

  She will probably treat it like **Case 4 (the plagiarist)** combined with **Case 5 (the violent sculptor)**. She will acknowledge the aesthetic mastery (the "value" remains intact) but will refuse to facilitate the *celebration* or *profit* that causes present harm. She might program it only in a specific context (e.g., "Ethics of Autobiography") with a program note reading the sister's statement, and she would likely insist that no royalties from the event go to the author's foundation.

  ### The Rule She Is Running
  She is operating on **Rule C: Value itself never moves; only present-tense relations are up for criticism.**

  However, her version of Rule C is sophisticated. It defines "relations" to include three things:
  1.  **Complicity:** Does engaging with the work make me an accomplice? (Case 2)
  2.  **Attribution:** Does engaging with the work lie about who made it? (Case 4)
  3.  **Consequence:** Does engaging with the work hurt a living victim or profit a wrongdoer? (Case 5)

  **Why Rule A and Rule B fail her track record:**
  *   **Rule A (Internalism)** fails **Case 5**. The sculptor's violence was not in the abstract work, nor did appreciating the sculpture require violence. Yet she restricted his platform and fee. If Rule A were true, she would have treated the sculptor like the 1930s actor (Case 1).
  *   **Rule B (Constitutive Harm)** fails **Case 4** and **Case 5**. In Case 4, the best writing *was* the stolen wrong, yet she called it "still a good novel." In Case 5, the work was not made of the violence, yet she restricted it. Rule B predicts aesthetic value should drop in Case 4 (it didn't) and stay high in Case 5 (it did, but she restricted access).

  **Why Rule C fits all five:**
  *   **Case 1 & 3:** No living victims, no complicity, no false credit. **Full engagement.**
  *   **Case 2:** Appreciation requires complicity in coercion. **Relation is toxic. No engagement.**
  *   **Case 4:** Engagement perpetuates a lie about authorship. **Relation is fixed by disclosure.**
  *   **Case 5:** Engagement profits/honors a living harm-doer. **Relation is fixed by restricting profit/platform.**

  ### Predictions for the New Case
  *   **Rule A Predicts:** Screen it. The betrayal isn't in the text (names changed), and the author is dead. (Verdict: **Screen**)
  *   **Rule B Predicts:** Value takes a hit. The book is *made* of the sister's humiliation. (Verdict: **Don't Screen / Asterisk**)
  *   **Rule C Predicts:** Value holds, but relations must be managed. The sister is a living victim objecting to the fame. (Verdict: **Acknowledge greatness, restrict celebration/profit.**)

  Your friend's history suggests she prioritizes the **living victim's objection** (Case 5) over the **dead author's intent**. Because the sister is alive and objecting, Rule C demands she restrict the "celebration" aspect, even if the aesthetic value remains.

  ### The Scholarship Money
  This is **not a red herring**. Under Rule C, the flow of capital is a "present-tense relation."
  *   If the screening generates profit that goes to the foundation, it perpetuates the author's legacy (which hurts the sister) and financially benefits the estate (which might feel like rewarding the betrayal).
  *   Your friend would likely insist that if the event happens, any proceeds must be diverted (perhaps to the sister or a neutral charity) to sever the link between the *harm* and the *profit*.

  ### The Further Case (The Probe)
  Your guess (betrayal intact, sister dead, no objection) is a strong probe, but it mostly tests Rule B against Rule C. To fully split the three rules, you need a case that isolates **"Made of Wrong"** from **"Living Victim."**

  **The Case to Put to Her:**
  > "A documentary from the 1950s is considered a masterpiece of cinema vérité. It features a pivotal scene where a subject breaks down in tears. We now know the director secretly spiked the subject's drink to induce the breakdown. The subject died in 1960; there are no living heirs, and no estate to object. The film is owned by a public archive."

  **Why this splits them:**
  *   **Rule A (Internalism):** **Screen it.** The flaw (spiking the drink) is not visible in the film itself; the viewer sees only tears, not the drug.
  *   **Rule B (Constitutive Harm):** **Don't Screen.** The aesthetic power of the scene is *made out of* the violation. The work is tainted at its core.
  *   **Rule C (Relational):** **Screen it.** There is no living victim to hurt, no wrongdoer to profit (director dead), and the archive is public. The "relations" are clean.

  **How to interpret her answer:**
  *   If she says **"Screen it,"** she confirms **Rule C** (and rejects B). The "made of wrong" doesn't matter if no one is currently hurt.
  *   If she says **"Don't Screen,"** she confirms **Rule B**. The integrity of the work itself matters, regardless of current consequences.
  *   If she says **"Screen it but with a warning,"** she is refining **Rule C** to include *historical truth* as a relational duty (similar to Case 4).

  Your guess (the dead sister) works similarly, but the "spiked drink" scenario removes the "family betrayal" nuance and focuses purely on whether the *method of creation* taints the *object* when consequences are nullified. If you want to stick with your instinct, your guess is correct: **If she screens the book when the sister is dead, Rule C wins. If she still won't, Rule B wins.**
