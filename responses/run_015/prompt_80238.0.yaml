      *   *Outcome Independence (OI):* If I get "Up", does that change the probability of you getting "Up"? In QM, yes, conditional on the measurement. Dropping this means accepting correlations that aren't explained by a common cause in the past. This is often called "holism" or "non-separability."
      *   *Measurement Independence (MI):* Are the detector settings independent of the hidden variables? Dropping this means Superdeterminism. The universe conspires so that I never choose the setting that would reveal the local hidden variable truth.

  3.  **Evaluate the "Escapes":**
