      *   *The User's Twist:* What about *negative* transformation? Loss of self/capacity.
      *   *The Tension:* If I can't imagine being a parent, I can't rationally choose it. But if I can't imagine having dementia, can I rationally choose to *prevent* it? Or is preserving the "current self" just another arbitrary preference?
      *   *The Decision-Making Aspect:* When someone *has* shrunk (dementia patient), who decides? The prior self (advance directive) or the current self (who might be content)?

  3.  **Brainstorming Practical Implications:**
