answer: |-
  This is a profoundly sharp observation. You have essentially turned L.A. Paul's argument on its head. Her point is that we cannot rationally choose *expansive* transformations (like parenthood or moving abroad) because we cannot access the subjective value of the new self. But you are asking about *reductive* transformations—dementia, severe brain injury, stroke—where the self is not rewritten but erased or diminished.

  If the logic holds that we cannot judge the future self, does it follow that we cannot rationally fight to keep our current one? And if someone has already 'shrunk', who speaks for them?

  Here is a practical breakdown of how this shifts our thinking on care, treatment, and decision-making, keeping things grounded in how this actually plays out in the real world (particularly within a context like the NHS and UK care system).

  ### 1. Is preventing 'shrinking' arbitrary?
  You asked if treating our current mental range as a default is rational, or if the 'you don't know' problem applies backwards.

  Practically speaking, there is a crucial distinction between *changing* the vessel of experience and *breaking* it. When you choose to have a child, you are adding a new layer of experience to an intact mind. When you face dementia, the threat is to the machinery of experience itself.

  From a practical decision-making standpoint, preserving cognitive capacity is not arbitrary because agency is the prerequisite for valuing *anything*.
  *   **The Tool vs. The Outcome:** Think of your current mental capacity not as a specific preference (like 'I like vanilla'), but as the tool you use to hold preferences. If you lose the tool, you cannot value vanilla, chocolate, or anything else. Therefore, fighting to keep the tool is rational, even if you cannot imagine what it is like to lose it.
  *   **The Asymmetry:** There is an ethical asymmetry between expansion and contraction. We generally accept that losing the ability to make choices is a harm, even if the person who remains doesn't realise they've lost it. If we treat preventing shrinkage as arbitrary, we undermine the basis of all medical consent. We would have to say, 'Why bother treating the stroke? The new version of you might be happy.' In practice, society and the law reject this. We operate on the presumption that the *continuity* of the self is a good to be protected.

  **Practical Implication:** When discussing treatments (e.g., medication to slow Alzheimer's, or rehabilitation after injury), we should not frame it as 'trying to stay the same person' (which is philosophically shaky), but as 'preserving the capacity to participate in your own life'. This shifts the goal from fighting death to fighting disconnection.

  ### 2. The 'Prior Self' vs. The 'Current Self'
  This is where it gets messy for families. Let's say a man develops advanced dementia.
  *   **The Prior Self:** Wrote an advance directive saying, 'If I don't know who my family are, do not prolong my life with aggressive treatment.'
  *   **The Current Self:** Is sitting in a care home, smiling, enjoying pudding, and seems content in the moment.

  If the person has 'shrunk', does the prior self still own the body? Or does the current, smaller self get a veto?

  In the UK, under the **Mental Capacity Act 2005**, the legal framework tries to balance this, and it offers a practical guide for your philosophical worry.
  *   **Best Interests:** Decisions are not made based on what the family *wants*, nor solely on what the patient *once wanted*, but on what is in the patient's 'best interests'. This includes medical, emotional, and social factors.
  *   **Weight of Wishes:** The prior self's wishes (via Advance Decisions or Lasting Power of Attorney) carry immense weight. However, if the current self is demonstrably content and a treatment causes distress, clinicians may pause.

  **Practical Implication for Families:**
  You asked if family members get 'special say' or if it's just sentimentality. It is not merely sentimentality, but it is not absolute power either.
  *   **Interpreters of Identity:** The family's role is to be the bridge between the shrunken person and the world they used to inhabit. You are the only ones who know what the 'unshrunk' person would have valued. If the patient is calm but neglected, the family speaks up. If the patient is being subjected to invasive procedures they explicitly forbade, the family enforces the prior self's boundary.
  *   **The Trap of Projection:** The danger is projecting your own grief onto them. You see the 'shrinking' as a tragedy; they may not feel it as such. If a treatment (like an antipsychotic) makes them sleepy but stops them from being agitated, is that preserving the self or chemically restraining them? The family's job is to ask: 'Is this keeping him connected to us, or just making him easier to manage?'

  ### 3. Rational Defaults and Resource Allocation
  If we accept that preventing mental shrinkage is a rational default, this has hard implications for how we fund and prioritise care.

  *   **Early Intervention:** If the loss of capacity is the primary harm, then funding for early diagnosis and cognitive rehabilitation should be prioritised over end-of-life palliative care in terms of 'self-preservation'. Currently, the system often waits until a crisis occurs. A rational approach would treat cognitive decline like a structural fire: you act the moment you smell smoke, not when the roof collapses.
  *   **The Cost of 'Being':** There is a brutal economic reality here. Keeping someone mentally intact is expensive (therapy, meds, care support). Letting them 'shrink' into a state of passive care is often cheaper for the state. If we agree that preserving the mental range is the rational default, then families must be prepared to challenge commissioning groups (ICBs) when support is cut. You are effectively arguing that the *quality of the mind* is a protected interest, comparable to the *safety of the body*.

  ### 4. What should you actually do?
  Moving away from theory to what you can do tomorrow:

  1.  **Redefine 'Health':** When speaking to GPs or specialists, do not just ask about survival rates. Ask about *cognitive preservation*. 'Will this treatment protect his ability to recognise us?' is a more relevant question than 'Will this extend his life by six months?'
  2.  **Update Advance Directives:** Most people treat these as 'Do Not Resuscitate' forms. They should be 'Do Not Erase' forms. Specify what loss of capacity is unacceptable to *you*. For example: 'I prefer death to a state where I cannot communicate with my spouse.' This gives your family a concrete mandate, reducing their guilt when they have to make hard calls later.
  3.  **Validate the Family's Grief:** When a loved one shrinks, the family often feels they are making decisions for a stranger. Acknowledge that this is a unique form of bereavement (often called 'ambiguous loss'). Their 'special say' comes from their duty to the person who *was*, not just the person who *is*. It is not sentimentality; it is stewardship of a human history.
  4.  **Accept the Limit:** Finally, there is a point where the 'shrinking' is total. If the machinery of experience is gone, the rational default shifts from preservation to dignity. The practical test is: 'Is there anyone home to receive this care?' If the answer is no, the rational choice may be to stop fighting the shrinkage and focus on comfort.

  ### Summary
  The 'you don't know' problem does not apply backwards in the same way. We can rationally value the *capacity to value*, even if we cannot imagine the state of lacking it. Therefore, treating the preservation of mental range as a default is sound.

  For families, this means your authority does not come from sentimentality, but from your role as the guardians of the person's continuity. You are protecting the narrative of their life from being edited down to nothing. However, you must be careful not to impose your fear of their 'shrinking' onto a current self that may be peaceful. The goal is not to force them to be who they were, but to ensure they are not treated as less than human because of who they have become.
