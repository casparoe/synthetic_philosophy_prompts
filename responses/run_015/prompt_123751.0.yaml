      *   *The "Default" Status:* Maintaining the status quo (current mental range) feels different than leaping into the unknown. It's about conservation of agency vs. alteration of agency.
      *   *Family/Surrogates:* If the person is already "shrunk," do they matter less? No, but their interests change. The "prior self" usually writes advance directives. The "current self" might be happy eating pudding. Who wins?
      *   *Resource Allocation:* NHS context (since British English is requested). Cost of care vs. quality of life.

  4.  **Drafting the Response (incorporating British English):**
