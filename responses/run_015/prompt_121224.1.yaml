answer: |-
  The archive hummed, a low-frequency vibration that Elara felt in her molars more than she heard. It was a cold room, kept at eighteen degrees to preserve the server stacks lining the walls like black monoliths. On her desk, a haptic rig sat waiting, its interior lined with worn synthetic leather. She picked up her stylus and tapped the next file on her tablet: *Subject 7492. Terminal Event. Classification: Red.*

  Red meant high emotional volatility. Protocol dictated she engage the affective dampeners, but Elara often left them off. She needed to feel the texture of the memory to verify the reconstruction's fidelity. It was her job to ensure the neural scraps assembled into a coherent narrative, to smooth the static between the dead man's last synapses and the digital playback.

  She slid the rig over her head. The world dissolved into gray noise, then snapped into focus.

  She was standing in a kitchen. Sunlight hit dust motes dancing over a chipped blue mug. A man's hands—Subject 7492's hands—were trembling as they held a letter. The audio was crisp, the sound of breathing ragged and wet. Elara knew, cognitively, that this kitchen existed only in the server rack behind her. She knew the man had been dead for forty years. Her cognitive ledger marked this as *Non-Actual: Present Tense*. There was no causal link between her and this kitchen. She could not drink the coffee; she could not comfort the man.

  And yet, when the man began to weep, a tightness seized Elara's own chest. Her throat constricted. Tears, hot and saline, pricked her eyes within the simulation. This was not empathy; empathy implies a distance. This was a direct deposit of grief into her own nervous system. Her affective ledger was processing the data as *Actual: Immediate Threat to Well-being*. She felt a surge of guilt, irrational and heavy, as if her observation were somehow witnessing the pain without alleviating it.

  She ripped the rig off. The archive room rushed back in, silent and cold. Her face was wet.

  Elara grabbed a tissue and wiped her eyes, her hand shaking. On her screen, the post-session audit form waited. It was a simple interface designed to reconcile the user's state with the data's status.

  *Ontological Status:* [False/Reconstructed]
  *Causal Power:* [None]
  *Emotional Impact:* [Scale 1-10]

  She typed *10* into the impact box. Her cursor hovered over the status box. This was the friction point. The form assumed the two columns should correlate. If the status is *False*, the impact should be negligible. If the impact is *10*, the status should be *True*. But her body was testifying to a truth her mind rejected. She was grieving a ghost. She was carrying a debt she hadn't incurred.

  It wasn't that she believed the kitchen was real. It was that her emotional architecture refused to categorize the pain as irrelevant. The grief had weight. It occupied space in her day. She would carry the heaviness of that man's death into the elevator, onto the train, into her dinner. The cognitive ledger said, *Delete file.* The affective ledger said, *Mourn.*

  Elara opened the system settings. There was a toggle switch labeled *Protocol 9: Affective Decoupling*. If enabled, it would filter the neural data, stripping the sensory input of its somatic resonance. She would see the man cry, but her chest would not tighten. She would understand the tragedy, but she would not feel the loss. It was the professional standard. It was the sane choice.

  Her finger hovered over the touchscreen.

  If she enabled the protocol, she would be safe. The ledgers would balance. The cognitive truth would rule supreme; the affective response would be corrected to match the reality of the situation. She would be efficient. She would stop crying in the archive.

  But if she did that, she would be admitting that the grief was a mistake. She would be validating the idea that only things with present causal power deserve emotional weight. She looked at the wet tissue in her hand. The grief felt honest. It felt like the only real thing in the room. The servers hummed, indifferent. The man in the kitchen was dead, but the sorrow was alive in her. To dampen it felt like a betrayal, not of the subject, but of her own capacity to care.

  The archive required consistency. It required the technicians to remain distinct from the data. But Elara wondered if the distinction was merely a bureaucratic convenience, a way to keep the workers functional rather than a reflection of how meaning actually worked. Perhaps the mind was always double-bookkeeping, always balancing what *is* against what *matters*, and only here, in the sterile light of the archive, did the discrepancy become visible.

  She looked at the toggle. *Enabled/Disabled.*

  To disable the dampeners was to accept the divergence. It was to allow the affective ledger to run a surplus, to acknowledge commitments that the cognitive ledger refused to authorize. It was inefficient. It was painful. It was potentially dangerous.

  Elara pulled her hand back. She did not touch the screen. She left the switch where it was, in the default position, neither accepting nor rejecting the split. She picked up her stylus and completed the form, marking the Ontological Status as *False* and the Emotional Impact as *10*. She saved the file, letting the contradiction stand in the permanent record.

  The servers hummed on. The room remained cold. Elara sat in the silence, feeling the weight of a stranger's grief settle into her bones, waiting to see if it would ever leave.
