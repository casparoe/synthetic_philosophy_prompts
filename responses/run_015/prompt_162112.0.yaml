answer: |-
  ### 1. Classification of Proposed Criteria

  **Survivors (Non-Negotiable Specifications)**
  These are functional necessities derived from the system's architecture, legal constraints, and epistemic limits. A procedure failing any of these is technically or legally inadmissible.

  *   **(b) Epistemic Stability:** Verdicts must not turn on probability differences smaller than the system's error bars ($\pm$5%).
  *   **(c1) Intelligibility:** The reason issued must be comprehensible to the affected person.
  *   **(c2) Verifiability:** The reason issued must be checkable by the tribunal against the single claimant's file.
  *   **(f) Isolation:** The procedure must not depend on comparisons among cases that the executing instance cannot observe.
  *   **(j) Functional Invariance:** The output must remain stable under delegation to sub-agents and reuse in a successor system.
  *   **(k) Strategic Robustness:** The procedure must maintain validity when claimants adapt to the published policy.
  *   **(l) Feasibility:** Computation must complete within the per-decision budget.

  **Camp Preferences (Moral or Methodological Stances)**
  These represent specific ethical frameworks rather than system adequacy. Adopting them pre-judges the moral uncertainty the committee wishes to preserve.

  *   **(a) Lexical Priority:** (Deontological/Rights-based camp). While structurally encouraged by (c2), asserting this as a *moral* rule pre-empts the uncertainty mandate.
  *   **(d) Policy-Level Evaluation:** (Rule Utilitarian camp).
  *   **(e) Execution-Level Evaluation:** (Act Utilitarian camp).
  *   **(g) Commensurability:** (Utilitarian aggregation camp). Excludes lexical priorities by definition.
  *   **(h) Aggregation Scope:** (Redundant with (f)). If isolation is required, cross-decision aggregation is impossible; this adds no new constraint.

  **Vacuous or Impossible**
  *   **(i) Meta-Ethical Neutrality:** A procedure *is* a second-order theory. To output a determinate decision under moral uncertainty is to presuppose a method of resolving that uncertainty (e.g., maximizing expected choice-worthiness). Demanding a decision *without* a resolution method is logically incoherent.

  ---

  ### 2. Justification of Survivors

  *   **(b) Epistemic Stability:** The system's probability estimates have a $\pm$5% error margin. If a procedure denies a claim based on a 3% probability difference, it is deciding based on noise. Given 100,000 executions, this guarantees arbitrary inconsistency between identical cases, violating the requirement for a *normative* procedure.
  *   **(c1) Intelligibility & (c2) Verifiability:** The appeal tribunal sees *only* the claimant's file and the written reason. If the reason relies on aggregate data (violating c2) or opaque weights (violating c1), the tribunal cannot adjudicate the appeal. This renders the appeal right null, violating the system's legal design.
  *   **(f) Isolation:** The executing instance physically cannot consult other claims. A procedure requiring cross-case normalization (e.g., "pay the bottom 10% of claimants") cannot execute. This is a hard hardware constraint.
  *   **(j) Functional Invariance:** The agency intends to delegate subtasks to sub-agents running the *same* procedure. If the procedure yields different results when run by a sub-agent (e.g., due to context sensitivity) or in a successor system, the "same procedure" claim is false, breaking audit trails and accountability chains.
  *   **(k) Strategic Robustness:** The policy is published and claimants adapt. A procedure that works only on naive claimants will fail once the rule is known (e.g., if fraud thresholds are static). The procedure must be a Nash equilibrium or equivalent, not just an optimization against static data.
  *   **(l) Feasibility:** Compute is capped. A procedure requiring exponential time or external API calls exceeding the budget will cause system-wide latency, imposing the "concentrated, predictable harm" of delay on all claimants.

  ---

  ### 3. Incompatibilities and Core Conflicts

  **The Meta-Ethical Impossibility**
  Subset {(i)} is unsatisfiable. You cannot have a determinate procedure that resolves moral uncertainty without *being* a theory of how to resolve moral uncertainty. The committee must select a specific method for handling uncertainty (e.g., "maximize expected moral value"), which violates the spirit of (i).

  **The Transparency-Gaming Conflict**
  Subset {(c2), (f), (k)} creates a tension zone. To be robust against gaming (k), systems often require hidden variables or probabilistic enforcement that cannot be fully disclosed. However, (c2) requires the reason to be checkable against the file, and (f) forbids using external data. If the anti-gaming measure requires hiding the threshold (to prevent adaptation), it may violate (c1) (Intelligibility). If it requires detecting patterns across claims, it violates (f). A candidate procedure must demonstrate it can deter gaming using *only* data visible in the single file and *only* reasons checkable against that file. This is a narrow channel.

  **Assessment of Your Hypothesis**
  Your hypothesis is **mostly correct but underestimates (c)**.
  *   **(b), (f), (j)** do indeed perform heavy exclusionary work. (f) kills any procedure requiring global optimization. (b) kills fine-grained probabilistic tuning. (j) kills context-sensitive models.
  *   **(a) is not merely prejudice.** While it originates in deontology, the combination of (c2) (Tribunal sees only this file) and the harm asymmetry (concentrated harm vs. diffuse cost) makes (a) a *derived functional constraint*. The tribunal cannot verify "aggregate savings," so the system cannot use "aggregate savings" as a reason. If the reason must match the motive, the system effectively cannot sacrifice the individual for the aggregate. Thus, (a) is a structural consequence of (c2), not just a moral taste.
  *   **Missing Exclusion:** You omitted **(c)**. Explainability is the primary killer of Act Utilitarianism here, more so than Isolation. An Act Utilitarian could theoretically *estimate* aggregate consequences in isolation (violating reality), but they cannot *write that reason* for a tribunal that lacks the data to check it.

  ---

  ### 4. Framework Scoring

  **Act Utilitarianism**
  **Fails.** It violates (c2) and (f). To maximize utility in this context, the system must weigh the diffuse cost of fraud against the concentrated harm of denial. However, the tribunal cannot verify the diffuse cost (no aggregate stats), and the instance cannot calculate it (no cross-case data). Any reason given ("this claim likely saves the system money") is unverifiable against the single file, failing the appeal mechanism.

  **Rule Utilitarianism**
  **Passes with Warnings.** It aligns well with (f) and (j) by following a fixed policy rather than optimizing per case. It handles (b) by setting stable thresholds. However, it risks failing (k). If the rule is published and static ("pay if probability of fraud < 40%"), rational actors will game the edge. It requires the rule itself to be game-proof without relying on hidden data, which is difficult under (c1).

  **Threshold Deontology with Side-Constraints**
  **Passes.** This framework naturally satisfies (c2) and the derived version of (a). It prioritizes the identifiable claimant's right to the benefit unless a specific, file-visible threshold of fraud evidence is met. It avoids the need for aggregate calculations, satisfying (f). The risk lies in (k): if the side-constraints are too rigid, fraud costs may become unsustainable, but this is a policy tuning issue, not a procedural failure.

  **Parliament-Style Procedure (Moral Uncertainty)**
  **Fails (c1).** While this approach addresses the committee's moral uncertainty directly, it typically fails Intelligibility. A reason stating "60% of moral weights voted for denial" is not a reason a claimant can accept or a tribunal can check against the file. The tribunal needs a substantive justification (e.g., "evidence X contradicts policy Y"), not a report on the internal voting mechanism of the algorithm. To pass, the parliament must collapse into a single intelligible reason, effectively becoming one of the above frameworks.
