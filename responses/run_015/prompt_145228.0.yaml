  8.  *(Self-Correction during drafting)*: Wait, if the user asks "What result would confirm Stalinesque," I should answer hypothetically.
      *   *Hypothetical Stalinesque Confirmation:* If you could show that neural activity corresponding to the *illusion* exists *before* the neural activity corresponding to the *click* (when the click is physically later), that would suggest buffering. But since we only have button presses...
