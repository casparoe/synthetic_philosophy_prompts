      *   *Dennett's View:* I need to be careful not to misrepresent Dennett. He famously argues the distinction is *spurious*. I should mention that the experiment might prove *Dennett right* (that the question is unaskable) rather than proving one side right.
      *   *Technical Detail:* Auditory processing is faster than visual. ~20-50ms vs ~80-100ms. This is crucial for the click experiment. If the click is simultaneous with the green flash, the brain hears it before it sees the green.
