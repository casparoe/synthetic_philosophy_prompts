      *   Stance: Reactive attitudes are not just feelings; they are the fabric of moral community. Removing them changes the nature of the relationship fundamentally.

  3.  **Drafting - Paragraph 1: The Equanimity Polity and the Constitutive Claim:**
      *   *Opening:* Direct assessment. The Equanimity Polity is an impossibility or a self-deception.
      *   *Argument:* Reactive attitudes aren't just psychological add-ons; they are the expression of demand for goodwill. If you remove resentment/indignation, you remove the stake in the relationship.
      *   *Counter their claim:* They say they treat offenders as rational agents. But treating someone as a moral agent *just is* being susceptible to reactive attitudes toward them. "Structural disapproval" without emotional engagement looks like management or training, which edges toward the objective attitude.
      *   *Key phrase:* "The framework of human relationships."

  4.  **Drafting - Paragraph 2: Determinism and the Human Condition:**
      *   *Address Determinism:* Would determinism push us there? No. Determinism doesn't change the fact of our interpersonal commitments.
      *   *Argument:* Even if determinism is true, we cannot abandon reactive attitudes without abandoning ordinary human relationships. The Polity suggests we *can* separate accountability from emotion. I say we cannot.
      *   *Concession:* Maybe expression varies culturally, but the underlying susceptibility must remain.
      *   *Conclusion:* To live without reactive attitudes is to live outside the human community. The Polity is a contradiction in terms.

  5.  **Refining and Editing (Checking Constraints):**
      *   *First Person?* Yes ("I maintain," "my claim").
      *   *Two Paragraphs?* Need to ensure it's not too long or too short.
      *   *Direct Opening?* Yes.
      *   *No Concession on Determinism/Responsibility?* Ensure I don't say "maybe determinism matters."
      *   *Tone Check:* Does it sound like Strawson? Needs to be about the "framework of human life."

  6.  **Drafting - Attempt 1 (Mental Outline):**
      The Equanimity Polity is a chimera. You say you hold people responsible without resentment. I say resentment is what holding responsible *is*. It's the demand for goodwill. If you suppress it, you treat people as objects to be managed, even if you call it "structural disapproval." That's the objective attitude. You can't have moral accountability without the emotional stake.
      Regarding determinism: It won't push us there because we are human. We care about how others treat us. Determinism doesn't change that. We might vary in how we show anger, but we can't kill the feeling without killing the relationship. So the Polity is impossible for beings like us.

  7.  **Drafting - Attempt 2 (Writing in Strawson's voice):**
      The Equanimity Polity presents a fascinating but ultimately incoherent vision, for it mistakes the symptoms of moral community for its cause. I must insist that participant reactive attitudes are not merely contingent psychological accompaniments that might be shed while retaining the essence of responsibility; rather, they are the very fabric of interpersonal relationships. To treat someone as a moral agent is to be susceptible to resentment when they slight you or gratitude when they honor you; these emotions express a demand for goodwill that is constitutive of seeing another as a person. If your citizens truly suppress these attitudes, their "structural disapproval" ceases to be a moral response and becomes a technique of management. You claim they still view offenders as rational agents, but without the emotional stake of reactive attitudes, the offenders are effectively viewed as subjects for training or social engineering. This is not a refined form of accountability; it is the objective attitude masquerading as moral judgment, for it withdraws the offender from the ordinary web of human relations where responsibility lives.

      As for whether determinism might naturally push human societies toward such a polity, I remain unconvinced that the truth of determinism could ever compel us to abandon this framework. The general framework of reactive attitudes is not a theory we adopt based on metaphysical beliefs; it is part of our natural history, given to us with our nature as social beings. While I concede that cultural variations may dictate how vigorously resentment is displayed or how quickly forgiveness is sought, the underlying susceptibility to these attitudes is non-negotiable if we are to participate in ordinary human relationships. To attempt the Equanimity Polity is to attempt a life without love, anger, or personal stake—a life perhaps coherent for gods or beasts, but not for humans. Determinism cannot alter this fact, because our commitment to these attitudes is not based on a belief in indeterminism, but on our fundamental care for one another. Thus, the Polity is not a future evolution of responsibility, but a denial of the conditions that make responsibility possible.

