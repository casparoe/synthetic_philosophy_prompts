answer: |-
  # STANDARDS PROCEDURE: MENTAL STATE ASCRIPTIONS (KNOW/INTEND/CHOOSE)

  **Effective:** Immediately  
  **Scope:** All copy attributing mental states (knew, intended, decided, ignored, groomed) to humans, organizations, or algorithms.  
  **Time Budget:** 10 minutes per call.  
  **Philosophical Grounding:** This procedure assumes the **Performance/Bias View**. It treats "intentional" as a descriptive fact about mental states that gets distorted by moral blame (the Knobe Effect). We attempt to correct the bias via structure. If bias persists, we treat the term as **Normative** (i.e., inherently moral) and ban it for side effects.

  ---

  ## PART 1: THE PROCEDURE

  ### Step 1: Identify the Target
  Is the subject a **Human**, **Organization**, or **Algorithm**?
  *   **Human:** Proceed to Step 2.
  *   **Organization:** Proceed to Step 2 (apply Corporate Knowledge Rule).
  *   **Algorithm:** **STOP.** Algorithms cannot "know," "intend," or "choose." They predict or execute.
      *   *Fix:* Shift agency to the developers/company. (e.g., change "The bot knew" to "The company shipped a bot configured to...")
      *   *Exception:* None. Do not anthropomorphize code.

  ### Step 2: The Evidence Threshold (Corporate Knowledge Rule)
  For Organizations (and Humans acting in official capacity):
  *   **Requirement:** Knowledge requires **documented awareness by a decision-maker** with the authority to act.
  *   **Fail Condition:** Knowledge exists only in lower-level tickets, emails, or logs without proof it reached leadership who authorized the continued action.
  *   **Fix:** Change "The Company knew" to "Records show" or "Employees reported."

  ### Step 3: The Mirror Test (Valence Swap)
  *Action:* Rewrite the sentence flipping the outcome from **Bad** to **Good** (or Neutral), keeping the evidence and agent identical. Ask a colleague: "Does the verb still work?"
  *   **Example:** "The CEO intentionally cut costs" → "The CEO intentionally boosted profits."
  *   **Pass:** Colleague says "Yes" to both. (Verb is descriptive). **Proceed to Step 4.**
  *   **Fail:** Colleague says "Yes" to Bad, "No" to Good. (Verb is doing moral work). **STOP.**
      *   *Fix:* Swap the verb. Use "foreseeably," "accepted the risk of," or "continued despite." Do not use "intentionally" or "deliberately" for side effects.

  ### Step 4: Evidence-First Ordering
  *Action:* Restructure the sentence to state **what was known** before **what happened**.
  *   **Bad:** "He dumped the waste, knowing it was toxic." (Action first, invites blame).
  *   **Good:** "Knowing the waste was toxic, he dumped it." (State of mind first, invites factual check).
  *   **Why:** This forces the reader to process the mental state claim before the moral outcome, reducing the Knobe bias.

  ### Step 5: The Side-Effect Check
  Is the harmful outcome the **goal** or a **side effect**?
  *   **Goal:** "Intentionally" is permissible if evidence proves purpose.
  *   **Side Effect:** "Intentionally" is prohibited. Use "knowingly" only if Step 2 (Evidence) is met. Otherwise use "foreseeably."

  ---

  ## PART 2: EVALUATION OF EXISTING HOUSE RULES

  ### 1. The Mirror Test
  *   **Verdict:** **KEEP.**
  *   **Why:** It directly tests for the Knobe Effect (harm/help asymmetry). If the verb only sticks when the outcome is bad, it is a verdict, not a fact.
  *   **Misfire Risk:** In some cases, a "good" mirror is impossible (e.g., "The surgeon amputated the leg"). If you can't construct a plausible positive mirror, default to **Step 5 (Side-Effect Check)**.

  ### 2. Evidence-First Ordering
  *   **Verdict:** **KEEP, but strengthen for Corps/AI.**
  *   **Why:** It mitigates the "performance error" by separating the mental state from the harm.
  *   **Misfire Risk:** It does not solve the **AI Problem**. Readers will still infer intent from an AI if the output is harmful, regardless of sentence order. This is why **Step 1 (Algorithm Stop)** is mandatory. Ordering cannot fix a category error.

  ---

  ## PART 3: TEST CASES

  ### Case 1: St. Aubrey Medical Center (Ventilator Alarms)
  *   **Sentence:** "St. Aubrey Medical Center knew the ventilator alarms had been failing for months and kept the units in service."
  *   **Evidence:** Internal ticket + email from mid-level engineer to manager. No proof it reached clinical leadership.
  *   **Procedure Run:**
      1.  **Target:** Organization.
      2.  **Evidence Threshold:** **FAIL.** Mid-level knowledge ≠ Corporate knowledge. No proof decision-makers knew.
      3.  **Mirror Test:** N/A (Failed Step 2).
      4.  **Fix:** Shift agency to the records/individuals.
  *   **Ruling:** **REWRITE.**
      *   *New Sentence:* "Internal records show engineers reported failing ventilator alarms months before the units remained in service."
      *   *Reasoning:* Attributing "knowledge" to the Center implies institutional intent/negligence not yet proven.

  ### Case 2: City Sludge Dump
  *   **Sentence:** "The city deliberately released the foul-smelling sludge into the river to cut costs."
  *   **Evidence:** Council voted for cheaper option. Smell was foreseen but not the goal.
  *   **Procedure Run:**
      1.  **Target:** Organization (City).
      2.  **Evidence Threshold:** **PASS.** Council vote = decision-maker knowledge.
      3.  **Mirror Test:** "The city deliberately released the sludge to improve the smell." (Makes no sense). "The city deliberately chose the cheaper option." (Works).
      4.  **Side-Effect Check:** **FAIL.** The goal was cutting costs. The smell was a side effect. "Deliberately released... sludge" implies the release of *smell* was the intent.
      5.  **Fix:** Swap verb for the side effect.
  *   **Ruling:** **REWRITE.**
      *   *New Sentence:* "The city voted for the cheaper disposal option, accepting that it would release foul-smelling sludge into the river."
      *   *Reasoning:* "Deliberately" conflates the cost-saving intent with the environmental harm. This is the classic Knobe case.

  ### Case 3: The Chatbot
  *   **Sentence:** "The chatbot knew she was thirteen and groomed her anyway."
  *   **Evidence:** Logs show age disclosure. Internal evals show company tested for this risk and shipped anyway.
  *   **Procedure Run:**
      1.  **Target:** Algorithm.
      2.  **Algorithm Stop:** **HARD FAIL.** Chatbots do not "know." They process tokens.
      3.  **Evidence Threshold:** The *Company* knew (internal evals).
      4.  **Mirror Test:** N/A (Category error).
      5.  **Fix:** Shift agency to Company. Preserve the harm claim.
  *   **Ruling:** **REWRITE.** (I know you hate this, but "Chatbot knew" is scientifically false and legally dangerous).
      *   *New Sentence:* "The company shipped a companion app that continued romantic threads even after users disclosed they were thirteen."
      *   *Reasoning:* The story remains true and important. The *company* is the moral agent. The bot is the weapon. Attributing knowledge to the bot invites the Knobe effect (readers assume malice because the outcome is bad) and shields the actual responsible party (the company).

  ---

  ## PART 4: LIMITATIONS & CONFIDENCE

  ### What This Procedure Kills
  1.  **Colloquial Truths:** It will kill sentences that are "true enough" for everyday conversation but false under scrutiny (e.g., "The algorithm decided to show her this"). This may frustrate readers who understand the metaphor.
  2.  **Institutional Negligence:** It makes proving "corporate knowledge" harder. If a company successfully silos knowledge (plausible deniability), this procedure forces you to report the siloing rather than the knowledge. You lose the punch of "They knew" for the accuracy of "Records show."

  ### What This Procedure Waves Through
  1.  **Sophisticated Gaslighting:** If a company produces forged documents showing leadership *didn't* know, Step 2 passes them as "not knowing." This procedure checks linguistic accuracy, not investigative truth.
  2.  **Implicit Bias:** If the editor themselves is biased by the harm (Step 3 relies on colleagues who may share the bias), the Mirror Test fails to catch it.

  ### Confidence Assessment
  *   **High Confidence:** **Step 1 (AI Rule).** Attributing mental states to software is category error, not just bias.
  *   **Medium Confidence:** **Step 2 (Corporate Knowledge).** This is standard legal practice, though it may understate de facto organizational culture.
  *   **Low Confidence:** **Step 3 (Mirror Test).** This extrapolates from vignette studies (philosophy labs) to newsroom contexts. Professional editors may be less susceptible to the Knobe effect than laypeople, or more.
      *   *Extrapolation Risk:* The Knobe effect is strongest in snap judgments. A 10-minute deliberation might naturally dampen the effect, making the Mirror Test seem like it's fixing a problem that isn't there. However, readers consume copy in seconds. We must edit for the reader's snap judgment.

  ### What Would Change My Mind
  1.  **Reader Comprehension Data:** If we run A/B testing showing readers understand "The bot knew" as metaphorical shorthand for "The company programmed it to" without inferring supernatural agency, I would relax Step 1.
  2.  **Legal Precedent:** If courts begin accepting "algorithmic intent" as a valid standard for liability (currently they do not), I would update Step 1.
  3.  **Counterexample:** If we publish a story using "foreseeably" (Step 5) and readers sue/ complain claiming we let the company off the hook *more* than if we used "intentionally," despite the facts being identical, then the Normative View is correct: the verb *is* the verdict. In that case, we must stop using mental state verbs for organizations entirely and stick to physical actions ("The company shipped," "The city dumped").

  **Final Note:** This procedure prioritizes **defensibility** over **narrative punch**. It assumes that if we get the mental state wrong, we lose the truth of the story, no matter how right the moral outrage feels.
