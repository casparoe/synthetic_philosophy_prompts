      *   **Task:** Create a *procedure* (not an essay) for ruling on mental state ascriptions (knew, intended, decided, chose, ignored) in news copy.
      *   **Constraints:**
          *   ~10 minutes per call.
          *   Runnable by a copy editor (no phil jargon).
          *   No external reading/links (everything must be in the text).
          *   Must incorporate specific phil concepts: Knobe effect (harm/help asymmetry), normative vs. performance error debate, implications for editing (swap verbs vs. reorder).
          *   Must evaluate two existing house rules: "Mirror Test" (valence swap) and "Evidence-First Ordering" (knowledge attribution conditions for corps/AI).
          *   Must apply the procedure to three specific test cases (Hospital, City/Sludge, Chatbot).
          *   Must include limitations/confidence assessment (what it kills, what it misses, extrapolation risks).
      *   **Tone:** Direct, procedural, authoritative but humble about limits, practical.

  2.  **Deconstruct the Philosophical Core:**
      *   *The Knobe Effect:* People say side effects are "intentional" if bad (harm) but not if good (help), even if mental states are identical.
      *   *The Debate:*
          *   *View A (Normative):* "Intentional" *means* something like "blameworthy." Moral valence is part of the concept.
          *   *View B (Performance/Bias):* "Intentional" is descriptive, but blame biases the judgment (noise).
      *   *Implication for Editing:*
          *   If View A is right (Normative), we can't just "fix" the sentence; the concept itself is moral. We might need to avoid the word "intentional" for side effects entirely.
          *   If View B is right (Bias), we can debias by restructuring (Evidence-First) to force descriptive processing before moral evaluation.
      *   *Decision:* As a standards editor, I can't solve the phil debate. I need a procedure that works *regardless* of which view is true, or hedges against the risk. The prompt asks me to say which version I'm building on.
      *   *Strategy:* Build on the *Performance/Bias* view for the procedure (because it offers a fix: restructuring), but acknowledge the *Normative* risk (if restructuring fails, swap the verb). This aligns with the "Mirror Test" constraint.
      *   *Corporate/AI Knowledge:* Corporations don't have minds. "Knowing" requires institutional knowledge (documented, actionable by decision-makers). AI doesn't "know" in the human sense; it predicts. Attributing knowledge/intent to AI is highly susceptible to the Knobe effect (anthropomorphism + harm = intentional).

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* 10-minute max. Simple steps.
      *   *Step 1: Identify the Claim.* Is it a mental state verb?
      *   *Step 2: The Entity.* Human vs. Corp vs. AI. (AI/Corp need stricter evidence).
      *   *Step 3: The Mirror Test (Existing House Rule).* Keep this? Yes, it's a robust check for the Knobe effect. If valence flips the verdict, the verb is doing moral work.
      *   *Step 4: Evidence-First (Existing House Rule).* Keep this? Yes, forces descriptive processing.
      *   *Step 5: The Verb Swap.* If Mirror Test fails, change "intentionally/knew" to "foreseeably/continued despite."
      *   *Integration:* Need to make sure the Knobe logic is embedded without naming "Knobe."
      *   *Refinement:* The prompt asks me to ground it in the literature. I need to explain *why* the steps exist based on the harm/help asymmetry without getting academic.

  4.  **Evaluating Existing House Rules:**
      *   *Mirror Test:* Good. Detects the asymmetry. Misfire: Might be too slow for breaking news? No, 10 mins is enough. Misfire: Might fail if the counterfactual is impossible (can't imagine a "good" sludge dump).
      *   *Evidence-First:* Good. Mitigates the "blame leak." Misfire: Doesn't solve the AI problem fully because readers *want* to anthropomorphize AI. Needs a specific AI rule.

  5.  **Applying to Test Cases:**
      *   *Case 1 (Hospital):* "Knew." Evidence: Ticket + mid-level email. Did leadership know? Corp knowledge rule applies. If mid-level didn't report up, corp didn't "know." Verdict: Change "knew" to "records show."
      *   *Case 2 (City/Sludge):* "Deliberately released." Goal: Cut costs. Side effect: Smell. Knobe case exactly. Did they intend the smell or just tolerate it? "Deliberately" implies purpose. Verdict: Change to "released... accepting the smell."
      *   *Case 3 (Chatbot):* "Knew... groomed." AI subject. Harmful outcome. High Knobe risk. AI doesn't "know." Company might "know." Verdict: Shift agency to company. "The company shipped a bot that..."

  6.  **Limitations & Confidence:**
      *   *Extrapolation:* Phil studies are on vignettes, not real news. News has more context.
      *   *Risk:* Killing true stories where "knew" is colloquially accurate but technically loose.
      *   *Confidence:* Low on AI. High on Corp/Human distinction.
      *   *Change of Mind:* If readers consistently understand "AI knew" as metaphor, not fact.

  7.  **Structuring the Output:**
      *   **Header:** Procedure Title & Scope.
      *   **Philosophical Grounding (Brief):** Why this exists (Knobe/Asymmetry).
      *   **The Procedure (Steps 1-5):** Actionable checks.
      *   **Evaluation of House Rules:** Keep/Toss/Modify.
      *   **Test Cases:** Apply the procedure.
      *   **Limitations/Confidence:** The "What breaks" section.

  8.  **Refining the Tone:**
      *   Needs to sound like a senior editor talking to a desk. Crisp. No fluff.
      *   Avoid jargon like "normative concept" in the actual procedure steps, but use it in the rationale section.
      *   Address the "Chatbot" constraint: Don't gut the story, but fix the sentence.

  9.  **Self-Correction during drafting:**
      *   *Check:* Did I say which phil view I'm building on? Yes, I need to state that I'm treating "intentional" as descriptive but prone to bias (Performance View), hence the restructuring. But if bias persists (Mirror Test fails), I treat it as Normative and ban the verb.
      *   *Check:* Did I address the AI rule specifically? Need a hard rule: AI cannot "know" or "intend." Only developers can.
      *   *Check:* Time limit. Steps must be quick.
      *   *Check:* The Chatbot case. The user says "I suspect your procedure will want to gut the sentence." I need to be firm. Accuracy > Impact. But I can preserve the *meaning* (company negligence) without the false attribution (bot knowledge).

  10. **Final Polish:** Ensure the distinction between "Side Effect" (Knobe) and "Direct Intent" is clear in the procedure. Ensure the Corporate Knowledge rule is specific (decision-maker threshold).

  *(Self-Correction on Phil View)*: The prompt asks me to say which version I'm building on and what breaks if I guessed wrong.
  *   *Choice:* I will build on the **Performance/Bias View** (people *should* judge based on mental states, but blame distorts them).
  *   *Why:* It allows for correction (Evidence-First ordering). If I built on the Normative View (blame is *part* of the meaning), I'd have to ban "intentional" for all side effects immediately.
  *   *Risk:* If the Normative View is true, my restructuring won't stop readers from inferring intent where there is none. I need a backup (Verb Swap).

  *(Self-Correction on AI)*: The prompt asks for a rule, not a shrug.
