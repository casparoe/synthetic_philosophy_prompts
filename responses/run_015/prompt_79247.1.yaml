          *   *Tension:* If "I" am just a pattern (1), why doesn't the duplicate count as survival (3)? If the degraded version in a friend's head counts as survival (2), why doesn't the high-res scan count (3)? This is the biggest philosophical inconsistency. It's the "Psychological Continuity vs. Biological/Physical Continuity" clash.

      *   *Conflict B: (5) vs. (6).*
          *   (5) says self-boundaries are vague/interest-relative (Anti-Realism).
          *   (6) says moral responsibility requires identity to be a fact (Realism).
          *   *Tension:* You can't have vague identity *and* strict moral responsibility based on identity. If the boundary is like a cloud, how do you know who to punish? This is the "Vague Identity vs. Moral Accountability" problem.

      *   *Conflict C: (2) vs. (4).*
