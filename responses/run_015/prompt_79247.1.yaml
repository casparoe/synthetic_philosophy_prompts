      *   *Cheapest Revision:* Change (1) slightly. "I am a loop *tethered* to this hardware." No, that breaks Hofstadter.
      *   *Better Revision:* Change (3). Admit the duplicate is *you* in the only way that matters publicly, but *feel* like you die. This is Parfit's view.
