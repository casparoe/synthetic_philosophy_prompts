      *   (3) is the "Further Fact" view or Biological View (Olson) vs. Psychological Continuity (Parfit). It's a common intuition but philosophically hard to defend if (1) is true.
      *   (5) is Vague Identity (Parfit again).
      *   (6) is Retributivism requiring Strict Identity.

  5.  **Rank the Problems:**
      *   *Problem 1 (The Fatal Contradiction):* (1)/(2) vs. (3). You can't be a substrate-independent pattern *and* insist that copies don't count as *you* surviving, while simultaneously claiming degraded copies in friends' heads *do* count as survival. This is the core tension.
