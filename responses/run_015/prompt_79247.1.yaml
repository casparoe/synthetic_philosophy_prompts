      *   (3) *First-Person Continuity:* Rejection of psychological continuity *for self-survival*. Teletransportation paradox stance. The "thread" matters, not the copy.
      *   (4) *Realism about Grief:* Death is an objective loss in the world, not just subjective loss of access.
      *   (5) *Anti-Realism about Boundaries:* No fact of the matter where selves end/begin (like a cloud). Vague identity.
      *   (6) *Realism about Responsibility:* Moral responsibility requires factual identity (the punished must *be* the doer).

  3.  **Identify Conflicts (The "Audit"):**

      *   *Conflict A: (1) & (2) vs. (3).*
          *   (1) says "I" is a pattern that could run elsewhere.
          *   (2) says copies in other heads are "real survival."
