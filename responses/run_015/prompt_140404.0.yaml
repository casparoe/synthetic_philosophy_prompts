  ### New Case Prediction: Polyembryonic Wasps

  **The Case:** A parasitoid wasp lays a *single* egg inside a caterpillar. That egg splits asexually into 100 genetically identical clones. 95 develop into reproductive adults; 5 develop into sterile "soldiers" with large mandibles who defend the brood against competitors, dying in the process.

  **Apply Principle 1:**
  *   **Bottleneck:** Yes (single egg).
  *   **Conflict Suppression:** Yes (clonality aligns fitness; sterile caste is developmentally fixed, not a "cheater").

  **Prediction:** This is **Organism-Level Selection** (where the "organism" is the clone-set), *not* Group Selection and *not* Gene Selection via Kin Selection.
  *   *Why:* Even though there are sterile workers (like ants), the bottleneck makes the clone-set a single Darwinian Individual. The soldiers are somatic cells, not altruistic group members.
  *   *Contrast:* If the egg were *not* polyembryonic (1 egg = 1 adult) and the soldiers were unrelated helpers, it would be Group Selection/Kin Selection. The bottleneck changes the ontology.

