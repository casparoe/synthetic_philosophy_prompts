answer: |-
  You have correctly identified that you are conflating two distinct questions that the "Lewontin conditions" (variation, heritability, differential fitness) deliberately blur. Those conditions tell you where selection *can* be mathematically described, not what the *ontological units* of the system are.

  Your intuition is tracking the difference between **Multilevel Selection (MLS)** (a mathematical description of variance partitioning) and **Evolutionary Transitions in Individuality (ETI)** (an ontological claim about what counts as a "Darwinian Individual").

  Here are the two principles that reconcile your verdicts, followed by the application and the "honest list" of where your intuitions might need correction.

  ### Principle 1: The Bottleneck-and-Policing Criterion (For Individuality)
  **A higher-level entity counts as a Darwinian Individual (rather than a mere Collective) if and only if:**
  1.  **Reproduction:** It reproduces via a **single-unit bottleneck** (e.g., a zygote, a single founder cell, a budding fragment) that resets within-entity genetic variation to near-zero in every generation.
  2.  **Conflict Suppression:** It possesses mechanisms (policing, sequestered germline, apoptosis) that actively suppress fitness differences among its lower-level parts, aligning their fitness with the whole.

  *   **If both pass:** The entity is an **Individual**. Selection is best described as acting *on the individual*. Lower-level selection is treated as pathology or noise.
  *   **If either fails:** The entity is a **Collective**. Selection is best described as **Multilevel** (tension between particle and collective fitness).

  ### Principle 2: The Causal Salience Criterion (For Explanation)
  **When multiple levels satisfy the Lewontin conditions (e.g., gene and organism both replicate), the "Unit of Selection" is the level at which the *causal mechanism* for the trait's persistence resides.**
  *   If the mechanism is molecular bias (meiotic drive), the **Gene** is the salient unit.
  *   If the mechanism is organismal performance (mating, survival), the **Organism** is the salient unit, even if genes are the replicators. Gene-level redescription is mathematically valid but causally empty.

  ---

  ### Application to Your Cases

  **1. The Body vs. The Slime Mould (Your Core Conflict)**
  *   **Human Body:** Passes Principle 1. Zygotic bottleneck resets variation; immune surveillance/apoptosis polices cells.
      *   *Verdict:* **Individual.** You are correct to reject MLS here. The cells are *parts*, not a group. Cell-level selection is cancer (pathology), not evolution.
  *   **Slime Mould (Chimeric):** Fails Principle 1. No bottleneck (aggregation of strangers); policing is weak (cheaters exist).
      *   *Verdict:* **Collective.** You are correct to say selection acts *at the level of the slug* (between-slug variance beats within-slug variance), but technically this is **Group Selection**, not Individual Selection. The slug is not a unified Individual in the same way your body is.
  *   **Resolution:** Your intuition was right, but the terminology was the trap. The Body is an *Individual*; the Slug is a *Group undergoing selection*. Both involve "selection at that level," but only the Body is a "Unit of Evolution."

  **2. The Colonial Invertebrate (Budding vs. Fusion)**
  *   **Budding:** Passes Principle 1 (single founder cell bottleneck).
      *   *Verdict:* **Colony is an Individual.**
  *   **Fusion:** Fails Principle 1 (aggregation of unrelated colonies).
      *   *Verdict:* **Colony is a Collective.**
  *   **Resolution:** This perfectly matches your gut. The Price Equation says "group selection exists" in both, but Principle 1 says "only the budding colony is an *Evolver*." Your rejection of the fusion colony as a unit is justified by the lack of a bottleneck.

  **3. The Peacock**
  *   **Analysis:** Passes Principle 1 (Organism is an Individual).
  *   **Mechanism:** Mating success depends on the whole bird's display, not molecular bias.
  *   **Verdict:** **Organism-Level (Causal Salience).** You are right that gene-talk is empty. The gene "for" long trains doesn't cause the train; the developmental system of the bird does.

  **4. Segregation Distorter**
  *   **Analysis:** Passes Principle 1 (Organism is an Individual), *but* fails Conflict Suppression. The allele subverts the organism's fitness.
  *   **Verdict:** **Gene-Level (Causal Salience).** The mechanism is molecular bias, not organismal performance. The organism is the arena, not the agent.

  **5. Obligate Symbionts**
  *   **Vertical Transmission:** Passes Bottleneck (mother to offspring).
      *   *Verdict:* **Holobiont Individual.** (You are right).
  *   **Horizontal/Gut:** Fails Bottleneck (environmental acquisition).
      *   *Verdict:* **Ecological Community.** (You are right).

