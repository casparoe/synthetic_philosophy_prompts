answer: |-
  ### Brainstorming Candidate Cases

  1.  **Distributed Redundancy in Vision:** I considered a case where a feature (e.g., "curvature") is encoded across a whole layer in a highly entangled way, such that no single neuron or linear combination tracks it, but the downstream layer aggregates it. I dropped this because modern linear probes are surprisingly robust; if the downstream layer uses the information, a linear probe trained on the activations usually finds a hyperplane that correlates with it, even if the individual neurons are polysemantic. It's hard to guarantee the "No Decoding" verdict without rigging the probe complexity threshold arbitrarily.

  2.  **Temporal Integration in RL:** I thought about an RNN policy that needs to track "time since last reward." The hidden state $S$ should carry this. However, RNN hidden states are notoriously linearly decodable for time steps if they are actually being used for control. If a linear probe can't read it, it's usually because the network isn't using it (Causal says No). If the network *is* using it, the policy head usually acts as a linear readout. It collapses into agreement too easily.

  3.  **Context-Dependent Basis Rotation (Selected):** This is the strongest candidate. A Vision Transformer (ViT) trained on a relational reasoning task encodes a physical property (e.g., "density") in a subspace that *rotates* depending on a context variable (e.g., "volume"). A linear probe fails because there is no fixed direction for "density." A heavy nonlinear probe (which learns the rotation function) succeeds. The downstream circuit uses the density causally. This creates the desired divergence: the information is present and used, but the *format* is opaque to standard decoding assumptions.

  ***

  ### The Case: Dynamic Subspace Rotation in a Relational ViT

  Imagine a ViT-Base trained on a synthetic 3D reasoning task (similar to CLEVR) where the goal is to judge whether Object A is "heavier" than Object B. The ground-truth weight is determined by **Density ($F$)** $\times$ Volume. During training, Density is perfectly correlated with Material (Metal = High Density, Plastic = Low Density). The subsystem $S$ is the token embedding for Object A at layer 8. In this model, Density is not encoded along a fixed axis; instead, the subspace encoding Density *rotates* as a function of the object's Volume (encoded in a separate head). Consequently, no linear probe or sparse autoencoder feature on $S$ alone recovers Density above chance, because the "Density direction" is different for every Volume. However, a heavy nonlinear probe (a 3-layer MLP) trained to predict Density from $S$ succeeds, as it learns to model the rotation. Causally, activation patching works: if you swap the $S$ vector from a High-Density input into a Low-Density input (matching Volume), the model's "Heavier?" judgment flips appropriately. Finally, on a distribution shift test (Aerogel: Metal but Low Density), the model correctly identifies Aerogel as Light, proving it tracks Density ($F$), not the training proxy (Material).

  ***

  ### The Three Verdicts

  **1. The Reader/Decoding View:** **No Representation.**
  The Reader theorist argues that for $S$ to represent $F$, $F$ must be recoverable from $S$ via a "cheap" readout (typically linear or sparse). Here, the mutual information is high, but the *format* is encrypted. The fact that a heavy nonlinear probe is required means the work is being done by the probe, not the state. The state $S$ is merely ciphertext; the representation exists only relative to the complex key (the Volume-dependent rotation) which is not intrinsic to $S$'s geometry. Since there is no stable, simple mapping from $S$ to $F$, $S$ does not represent Density.

  **2. The Consumer/Causal-Role View:** **Yes Representation.**
  The Consumer theorist looks at how the system uses $S$. Interventions on $S$ regarding Density drive behavior in the Density-appropriate way (patching flips the judgment). Ablating $S$ wipes out Density-sensitivity while preserving other tasks. Crucially, the system treats $S$ *as* Density in its downstream computations. The fact that the downstream circuit has to "work" to interpret $S$ (account for the rotation) doesn't negate that $S$ is the vehicle carrying the content. If it quacks like density in the causal economy of the network, it is density.

  **3. The Etiological/Selected-For View:** **Yes Representation.**
  This view asks: Why is $S$ structured this way? Because the system was selected to track Density. The distribution shift (Aerogel case) rules out the explanation that $S$ merely tracks Material (the training proxy). The system's history explains the presence of $S$ by its success in tracking $F$ across environments. Therefore, $S$ has the content $F$.

  ***

  ### The Working Feature

  The single feature doing the work is the **context-dependence of the encoding basis**. The representation of $F$ (Density) is not a static vector direction but a *relation* between the activation vector and a context variable (Volume).

  If you remove this feature (i.e., force the basis to be fixed), the case collapses: a linear probe would succeed, and the Reader theorist would agree it's a representation. If the basis rotation were random noise (not context-dependent), the nonlinear probe would fail, and the Consumer theorist would likely agree it's not a representation (since the downstream circuit couldn't use it reliably). The divergence *only* exists because the information is structurally present and causally potent, but topologically scrambled relative to a context-free readout. This forces the Reader to say "It's too hard to read" while the Consumer says "It's being read successfully by the system."

  ***

  ### The "Downstream Circuit as Decoder" Objection

  **Objection:** "If the downstream circuitry responds to $F$ in $S$, then there *is* a decoder for $F$ after all, namely the downstream circuit itself. Why doesn't that refute the Reader theorist's 'No'? If the network can read it, why can't we count that as a successful decoding?"

  **Reply:** The Reader theorist distinguishes between **storage** and **processing**. Their operational test is designed to identify states that carry content *intrinsically*, such that the content is available for *any* simple consumer. If the "decoding" requires a computation as substantial as the rest of the network (modeling the rotation function), the Reader argues the representation is not localized in $S$, but distributed across the transition from $S$ to the output. The downstream circuit isn't just "reading" $S$; it is *decrypting* it. In this view, $S$ is no more a representation of Density than an encrypted hard drive is a representation of the text it contains—the representation only emerges once the decryption key (the Volume context + rotation logic) is applied. The Reader insists that if the "readout" is as complex as the "processor," you haven't found a representation in the state; you've found a causal dependency.

  ***

  ### The Strongest Attack and Reply

  **Attack (The Decoding Defender):** "Your causal interventions are themselves a form of readout. By showing that patching $S$ changes the output, you've only shown that $S$ carries *information* about $F$ (mutual information), not that its *content* is $F$. You are conflating causal relevance with semantic content. The network could be using $S$ as a cryptographic key to unlock a lookup table stored in the weights, where the actual 'Density' logic lives. Your interventions show $S$ is a causal lever, but the Decoder view is right: the *content* lives in the complex mapping (the weights/probe), not the state. You haven't proven $S$ represents $F$; you've proven $S$ is causally entangled with $F$."

  **Reply:** This attack begs the question by assuming a "homunculus" view of content, where content must be perspicuous to an external observer (the Decoder). The Consumer view rejects this: content is defined by *use*, not *legibility*. If the system behaves *exactly* as if it believes $F$ is true, and does so robustly across distribution shifts where proxies fail, then $F$ is the content, regardless of whether the internal format is encrypted. To claim the content lives in the weights rather than the state is to claim that a brain state doesn't represent "pain" because the downstream neurons have to fire in a complex pattern to process it. The "encryption" is just a format detail. If pluralism is true, and the Consumer test says "Yes" while the Reader test says "No," we have a genuine contradiction about the *location* of the representation (State vs. Transition), not just a gap in knowledge. The case shows that operational tests don't converge on a single fact of the matter; they carve reality at different joints.
