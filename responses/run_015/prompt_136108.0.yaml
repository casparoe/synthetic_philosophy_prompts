  # Specification: Adequacy Conditions for a Theory of Psychiatric Classification

  **Version:** 1.0
  **Target Audience:** Software Engineering / Systems Architecture
  **Domain:** Philosophy of Psychiatry / Computational Ethics

  ## 1. Introduction
  This document specifies the desiderata for any theory of psychiatric classification. It is designed to evaluate whether a given framework can account for the dynamic interaction between classification, human agency, and automated systems. Requirements are categorised as **Non-Negotiable** (must be satisfied for the theory to be viable) or **Camp Preference** (specific to biological essentialism, social constructionism, or interactive-kind frameworks).

  ---

  ## 2. Ontological and Epistemic Desiderata

  ### 2.1. Distinction Between Ontological Reality and Therapeutic Utility
  *   **Requirement:** The theory must distinguish between a category corresponding to a mind-independent natural kind (ontologically real) and a category serving as a useful tool for intervention (therapeutically useful).
  *   **Motivating Case:** The historical category of "drapetomania" (the supposed illness causing enslaved people to flee) was therapeutically useful to slaveholders for control but lacked ontological reality. Conversely, a category might be ontologically real (e.g., a specific neurochemical imbalance) but currently lack a useful therapeutic intervention.
  *   **Status:** **Non-Negotiable**.
  *   **Camp Alignment:** Biological essentialists prioritise reality; constructionists prioritise utility; interactive kinds seek a middle ground.

  ### 2.2. Accommodation of First-Person and Third-Person Perspectives
  *   **Requirement:** The theory must account for the disparity between the patient's phenomenological experience (first-person) and the clinician's or algorithm's observational data (third-person).
  *   **Motivating Case:** A patient may feel profound distress (first-person) without exhibiting observable behavioural markers (third-person), or vice versa (e.g., high-functioning depression). A theory that validates only third-person data risks invalidating patient suffering; one that validates only first-person data risks losing objective measurability.
  *   **Status:** **Non-Negotiable**.
  *   **Camp Alignment:** Constructionists often prioritise first-person narrative; essentialists prioritise third-person biomarkers.

  ### 2.3. Explanation of Normativity and Harm
  *   **Requirement:** The theory must explain why psychiatric classification is inherently normative (dealing with "disorder" rather than mere "difference") and how it identifies harm or dysfunction.
  *   **Motivating Case:** Homosexuality was once classified as a disorder. A viable theory must explain how a classification can be statistically normal yet pathological, or statistically deviant yet healthy, without relying solely on social prejudice.
  *   **Status:** **Non-Negotiable**.
  *   **Camp Alignment:** Essentialists look for biological dysfunction; constructionists look for social deviation; interactive kinds look for the interaction between the two.

  ---

  ## 3. Dynamic and Feedback Desiderata

  ### 3.1. Accommodation of First-Order Looping Effects (Hacking)
  *   **Requirement:** The theory must explain how the act of classifying a person alters their self-conception and behaviour, thereby changing the extension of the class itself.
  *   **Motivating Case:** The introduction of the diagnosis "Multiple Personality Disorder" led to a surge in patients presenting with exactly that symptom profile, behaving in ways they understood the diagnosis to entail. The classification changed the people classified.
  *   **Status:** **Non-Negotiable**.
  *   **Camp Alignment:** This is the core tenet of Hacking's **Interactive-Kind** framework. Essentialists often struggle to accommodate this without dismissing it as error.

  ### 3.2. Accommodation of Second-Order Algorithmic Looping
  *   **Requirement:** The theory must account for closed feedback circuits where automated diagnostic systems retrain on data generated by their own prior outputs.
  *   **Motivating Case:** An algorithm labels a demographic group as "high risk" for a disorder. Clinicians, trusting the algorithm, monitor that group more closely, finding more symptoms (surveillance bias). The algorithm retrains on this new data, reinforcing the "high risk" label. The system creates the reality it claims to detect.
  *   **Status:** **Non-Negotiable** (in the context of modern computational psychiatry).
  *   **Camp Alignment:** This extends Hacking's work. No traditional camp fully anticipated this, but **Interactive-Kind** frameworks are best positioned to adapt.

  ### 3.3. Stability vs. Fluidity of Categories
  *   **Requirement:** The theory must explain how categories remain stable enough for communication and research, yet fluid enough to evolve with cultural and scientific change.
  *   **Motivating Case:** If categories change too rapidly (fluidity), longitudinal studies become impossible. If they never change (stability), outdated harmful diagnoses (e.g., hysteria) persist indefinitely.
  *   **Status:** **Non-Negotiable**.
  *   **Camp Alignment:** Essentialists prefer high stability; constructionists prefer high fluidity.

  ---

  ## 4. Empirical and Methodological Desiderata

  ### 4.1. Empirical Testability Independent of the Loop
  *   **Requirement:** The theory must provide a mechanism for verifying classifications that is not entirely circular (i.e., not solely verified by the system that generated the classification).
  *   **Motivating Case:** If a diagnosis is only "true" because the test says so, and the test is designed based on the diagnosis, we have tautology, not science. We need external anchors (e.g., functional outcomes, quality of life, biological correlates).
  *   **Status:** **Non-Negotiable**.
  *   **Camp Alignment:** Essentialists claim biomarkers provide this; constructionists argue external anchors are also socially constructed.

  ### 4.2. Causal Power of Classifications
  *   **Requirement:** The theory must attribute causal power to the classification itself, not just the underlying condition.
  *   **Motivating Case:** Receiving a diagnosis of "schizophrenia" can cause stigma, employment loss, and self-stigma, which worsens the prognosis. The label itself is a causal variable in the patient's outcome.
  *   **Status:** **Non-Negotiable**.
  *   **Camp Alignment:** Central to **Interactive-Kind** and Constructionist views; often minimised by Essentialists.

  ---

  ## 5. Specific Tension Analysis: Second-Order Looping vs. Testability

  **Requirement:** Account for second-order algorithmic looping (3.2) while maintaining empirical testability independent of the loop (4.1).

  **Analysis of Tension:**
  There is a **severe tension** here. If an algorithmic system reshapes the behavioural data it subsequently learns from, the data is "contaminated" by the model's own history. To satisfy testability, one requires a "ground truth" that exists outside the loop. However, in psychiatry, the "ground truth" (human behaviour/experience) is exactly what is susceptible to looping.

  **Can they be jointly satisfied?**
  *   **Yes, but conditionally.** It requires **counterfactual modelling** and **longitudinal controls**. We must compare outcomes of those classified by the algorithm against a control group classified by a method blind to the algorithm's output. We must also measure outcomes *external* to the diagnostic system (e.g., employment retention, subjective well-being) rather than internal consistency.
  *   **The Conflict:** A strict Biological Essentialist might claim the biomarker is the independent truth, bypassing the loop. A strict Constructionist might claim independent truth is impossible, sacrificing testability. An Interactive-Kind theorist must argue that testability is asymptotic—we approach truth by modelling the loop, not by ignoring it.

  **Status of Requirement:** **Non-Negotiable**, but the *method* of satisfaction is contested.

  ---

  ## 6. Evaluation of Existing Frameworks

  Below is a concise scoring of three major frameworks against the specification above.
  *(Scale: 0 = Fails completely, 5 = Fully satisfies)*

  | Desideratum | Biological Essentialism | Pure Social Constructionism | Hacking's Interactive-Kind |
  | :--- | :---: | :---: | :---: |
  | **Reality vs. Utility Distinction** | 5 (Prioritises Reality) | 5 (Prioritises Utility) | 4 (Balances both) |
  | **1st vs. 3rd Person Perspective** | 2 (Often ignores 1st) | 5 (Prioritises 1st) | 4 (Accommodates both) |
  | **Normativity and Harm** | 3 (Relies on dysfunction) | 4 (Relies on social harm) | 5 (Integrates both) |
  | **First-Order Looping (Hacking)** | 1 (Treats as noise/error) | 5 (Central to theory) | 5 (Foundational) |
  | **Second-Order Algorithmic Loop** | 2 (Struggles with data bias) | 3 (Explains bias, lacks fix) | 4 (Best framework for adaptation) |
  | **Stability vs. Fluidity** | 5 (High Stability) | 2 (High Fluidity) | 4 (Dynamic Stability) |
  | **Empirical Testability** | 5 (Claims objective metrics) | 2 (Sceptical of objectivity) | 3 (Complex to implement) |
  | **Causal Power of Labels** | 2 (Minimised) | 5 (Central) | 5 (Central) |
  | **Total Score** | **25** | **31** | **34** |

  **Summary:**
  *   **Biological Essentialism:** Fails on looping effects. It treats the change in patient behaviour as measurement error rather than a constitutive feature of the kind. It scores well on testability but poorly on the reality of social feedback.
  *   **Pure Social Constructionism:** Excellent on looping and normativity, but struggles with empirical testability. If everything is constructed, it becomes difficult to assert one classification is empirically "better" than another, risking relativism.
  *   **Hacking's Interactive-Kind:** The strongest candidate. It accepts the reality of the classification's effect while maintaining that there is a world to be classified. It requires the most complex engineering to satisfy testability in the face of algorithmic feedback.

  ---

  ## 7. Confidence and Uncertainty Statement

  **Confidence Level:** High (85%)
  I am highly confident in the synthesis of Hacking's original arguments and the standard distinctions in the philosophy of psychiatry (e.g., natural kinds vs. social constructs). The desiderata listed above reflect the consensus of contemporary literature regarding the limitations of static classification systems.

  **Point of Least Certainty:**
  I am least certain regarding the **resolvability of the tension between Second-Order Algorithmic Looping and Empirical Testability**.
  While I have proposed counterfactual modelling as a solution, it is an emerging problem in computational ethics without a settled philosophical or technical consensus. It is possible that in highly automated ecosystems, "independent" ground truth becomes mathematically inaccessible, requiring a radical revision of what "testability" means in this domain. This specific point warrants further investigation beyond current philosophical literature.
