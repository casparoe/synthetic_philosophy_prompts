answer: |-
  The Equilibrium Engine did not hum; it breathed. It was a sprawling assembly of brass dials, vacuum tubes, and fluidic logic gates housed in the basement of the Oakhaven Council Hall. For forty years, it had settled disputes. It weighed zoning permits against property values, fishing quotas against market demand, noise ordinances against business hours. It reduced the world to a common currency of *units*, finding the balance point where the needle settled on green.

  Elara stood before it, her hands resting on the cold railing. Outside, the sky was the color of a bruised plum. The hurricane warning had been upgraded an hour ago.

  On the input tray lay two stacks of punch cards.

  Stack A was the Storm Barrier Protocol. It involved sealing the lower harbor, reinforcing the seawall, and evacuating the pier. The inputs were clean: cost in dollars, hours of labor, probability of structural failure, estimated lives saved. The Engine loved these numbers. They spoke the same language.

  Stack B was the Launch of the *Saint Jude*. Every generation, when the clouds gathered low and heavy, the elders launched a small, uncrewed skiff into the surf with a lantern and a net. It was a ritual of propitiation. To ask the sea to take the offering and spare the town. To cancel it was to break a chain unbroken for two hundred years. The inputs here were messy: *cultural continuity*, *communal morale*, *sacred obligation*.

  Elara fed the cards in.

  The Engine whirred. The brass needles twitched. They swung toward the Barrier, then snapped back toward the Launch. They oscillated faster and faster, a frantic heartbeat. The fluid in the glass columns bubbled violently, turning from calm blue to a churning grey.

  A spark popped from the main console. Then, with a sound like a sigh, the needles dropped to zero. The lights went out. The Engine had crashed.

  It couldn't find the common denominator. It couldn't calculate how many lives equaled one hundred years of prayer. It couldn't convert *safety* into *meaning*. They were incommensurable. There was no scale heavy enough to weigh them both.

  Elara turned off the main breaker. The silence in the basement was sudden and heavy. She took her coat and walked out into the wind.

  ***

  Her grandmother's house smelled of dried thyme and old wool. Nana was sitting at the kitchen table, mending a tear in a woolen sock. She didn't look up when Elara came in, though she knew the step.

  "The machine stopped?" Nana asked.

  "It broke," Elara said. She poured herself a cup of tea, her hand shaking slightly. "It couldn't decide. It just... gave up."

  "Good," Nana said. She bit the thread off the sock. "Machines look for equivalence. They want to know if A is bigger than B. But some things aren't big or small. They're just different."

  "If I choose the barrier, people live. That has to be worth more," Elara said, the argument sounding thin even to her own ears. "But if I cancel the Launch, the elders say the town loses its protection. Not physical protection. Something else. They say we become just people living on a rock, not a community."

  "And if you choose the Launch?" Nana asked, picking up another sock.

  "Then we keep the tradition. But if the seawall fails, people drown. I can't weigh a soul against a song, Nana. The Engine tried to, and it burned out."

  Nana finally looked up. Her eyes were clouded with cataracts, but her gaze was steady. "You think the point of the choice is to make the loss go away?"

  "I think the point is to choose the right thing."

  "There is no 'right' thing that doesn't leave a mark," Nana said softly. She patted the table. "Sit."

  Elara sat.

  "When your grandfather died," Nana said, "I had to sell the boat. We needed the money for the medical bills. It was the practical choice. The only choice, really. Did that make the loss of the boat less real because the bills were paid?"

  "No."

  "Did valuing your grandfather's health mean I valued the boat less?"

  Elara thought about it. "No. You loved that boat."

  "I did. And I love your grandfather's memory. Choosing one didn't cancel the other. The money paid the bills. But it didn't pay for the boat. The boat is still gone. The loss sits with me. It sits on the shelf next to the tea jars." Nana tapped the table. "People think a hard choice is a puzzle. If you solve it, the pieces fit. But a hard choice is a wound. You choose which wound you can carry. The other one... it stays with you. It doesn't vanish just because you decided."

  Elara looked at her hands. "So if I save the town, I still lose the ritual?"

  "You lose the ritual," Nana said. "And you carry that loss. You don't get to feel clean about it. That's the price of being the one who decides."

  ***

  The wind was howling outside now, rattling the windowpanes. The storm would hit at high tide, three hours from now.

  Elara walked back to the Council Hall. The basement was dark, the Engine cold. She didn't turn it back on. There was no point. It was a tool for trade-offs, not for tragedies.

  She sat at the arbitrator's desk and took out a pen and a sheet of paper. No punch cards. No calculations.

  She wrote: *Order 44-B. The Harbor Seal is authorized. The Launch of the Saint Jude is postponed indefinitely.*

  She didn't write that the ritual was worthless. She didn't write that safety was superior. She simply wrote the action.

  She knew what would happen. The seawall would hold. The town would be physically safe. But tonight, the elders would stand on the shore and watch the waves without sending their lantern out. They would feel a coldness in their chests that had nothing to do with the wind. They would feel untethered. And Elara would feel it too.

  If she had chosen the Launch and the wall broke, she would carry the guilt of the dead. If she chose the Barrier and the wall held, she would carry the guilt of the broken vow.

  Decision theory said you maximize utility. It said you pick the higher number. But there was no number for the silence of the elders. There was no number for the weight of a tradition snapping.

  Elara signed the paper. She felt a heaviness settle in her chest, a specific, sharp ache. It wasn't regret, exactly. Regret implies you made a mistake. This wasn't a mistake. It was a remainder.

  She walked out of the hall and down to the harbor. The crew was already bolting the floodgates shut. The water was churning, black and violent.

  On the pier, a small group of elders stood in the rain. They held the lantern. They held the net. They looked at Elara. She didn't speak. She just nodded, a small, stiff movement.

  One of the elders, old Mr. Haris, lowered the lantern. He didn't look angry. He looked tired. He understood that the math of survival was different from the math of living.

  Elara turned away before the floodgates sealed completely. She walked back up the hill toward her grandmother's house. The storm was breaking now, rain lashing against her face. She would go inside. She would drink tea. She would listen to the wind.

  And tomorrow, when the sun came up and the town was safe, she would wake up and the loss would still be there, sitting on the shelf next to the tea jars, waiting for her to acknowledge it. She would carry it. That was the only way to balance the scales that couldn't be balanced.
