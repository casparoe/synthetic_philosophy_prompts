answer: |-
  Yes, there is a genuine inconsistency here. You aren't nitpicking; you've stumbled onto one of the most famous problems in behavioral economics, known as the **Allais Paradox**.

  Most people make exactly these choices because our brains treat "certainty" differently than "probability." However, if you look at the math of what she is actually preferring, the two decisions contradict each other.

  Here is the clearest way to explain it to her without sounding like a textbook, followed by a script you can use.

  ### The Core Logic: "Cancel the Common Parts"
  The inconsistency reveals itself if you treat the probabilities like algebra equations and cancel out the parts that are the same in both options.

  **In Decision 1:**
  *   **Option A:** 100% chance of \$10k.
  *   **Option B:** 90% chance of \$10k + 9% chance of \$50k + 1% chance of \$0.

  Both options share a **90% chance of winning \$10k**. If you "cancel out" that common 90%, you are left comparing only the remaining 10% slice:
  *   **Leftover A:** A 10% chance of \$10k.
  *   **Leftover B:** A 9% chance of \$50k (and a 1% chance of nothing).
  *   **Her Choice:** By picking **A**, she is saying: *"I prefer the 10% chance of \$10k over the 9% chance of \$50k."*

  **In Decision 2:**
  *   **Option C:** 10% chance of \$10k + 90% chance of \$0.
  *   **Option D:** 9% chance of \$50k + 91% chance of \$0.

  Both options share a **90% chance of winning nothing**. If you cancel out that common 90%, you are left comparing the exact same leftovers as above:
  *   **Leftover C:** A 10% chance of \$10k.
  *   **Leftover D:** A 9% chance of \$50k (and a 1% chance of nothing).
  *   **Her Choice:** By picking **D**, she is saying: *"I prefer the 9% chance of \$50k over the 10% chance of \$10k."*

  **The Contradiction:**
  In the first decision, she said the \$10k chance is better. In the second decision, she said the \$50k chance is better. But mathematically, **it is the exact same choice.**

  ### Why It Feels Right (The Psychology)
  It feels consistent to her because of something called the **Certainty Effect**.
  *   In Decision 1, Option A feels "safe." Moving from 100% guaranteed to 90% guaranteed feels like a huge loss of security, so she pays a premium to keep the certainty.
  *   In Decision 2, both options are risky. There is no "safety" to lose. Since she's already expecting to lose (90%+ chance of zero), she might as well go for the bigger prize.

  She isn't being irrational emotionally; she is just weighing "certainty" as a bonus feature in the first scenario that disappears in the second.

  ### How to Bring It Up (The Script)
  You want to frame this as a curiosity puzzle rather than a correction. Here is a gentle way to walk her through it:

  > "I was looking at those two choices, and honestly, both of your instincts make total sense on their own. Who wouldn't take the guaranteed \$10k in the first one? And in the second one, since you're probably going to get nothing anyway, why not shoot for the \$50k?
  >
  > But I found a weird little math trick that suggests the two bets are actually identical. Can I walk you through it?
  >
  > In the first bet, both options give you \$10k in 90% of outcomes. If we pretend that 90% is already decided and just look at the remaining 10%, Option A is a small chance at \$10k, and Option B is a slightly smaller chance at \$50k. You picked the \$10k.
  >
  > In the second bet, both options have a 90% chance of paying nothing. If we ignore that 90% failure rate, we're left with the exact same comparison: a small chance at \$10k vs. a slightly smaller chance at \$50k. But this time, you picked the \$50k.
  >
  > It's called the Allais Paradox. Basically, our brains value 'certainty' so much that it changes how we value the gamble, even when the odds are technically the same. I don't think you should necessarily change your mind, but I thought it was fascinating that the same choice hid inside two different-looking problems."

  ### Summary for You
  *   **Is she inconsistent?** Yes.
  *   **Is she stupid?** No. This is a documented cognitive bias that affects Nobel prize winners and economists too.
  *   **Should she change?** Not necessarily. If "peace of mind" (certainty) has value to her beyond raw math, sticking with A is fine. But she should recognize that in Decision 2, she is accepting a risk she explicitly rejected in Decision 1. If she wants to be logically consistent, she should either pick **B and D** (maximize value) or **A and C** (minimize risk). Mixing them (A and D) is the inconsistency.
