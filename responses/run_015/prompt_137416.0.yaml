answer: |-
  This is a precise and demanding request. You are asking for the *specification* of the problem, not the solution. You want to know what a successful theory of composition must achieve before it is allowed to claim it has solved anything. Given your background in museums and horology, you are rightly suspicious of theories that work in a seminar room but fail in the workshop.

  Your "breakability rule" is a strong intuition. In philosophical terms, it points toward *functional integration* or *modal fragility*: the idea that the whole has a mode of failure that the parts do not share. A gear can be scratched; a clock can be *stopped*. That difference is real. But whether it is the *definition* of composition is what we must test.

  Here is the specification you asked for, broken into the five sections you requested.

  ### 1. The Cases: The Test Suite

  An answer to the composition question cannot just be a definition; it must be a key that fits specific locks. If a theory gives the wrong verdict on these clear cases, it is usually discarded unless it has overwhelming theoretical virtues elsewhere.

  | Case | The Scenario | Why It Is a Requirement |
  | :--- | :--- | :--- |
  | **The Ordinary Artifact** | A restored mechanical clock. | **The Baseline.** Any theory that says the clock does not exist is immediately counter-intuitive. An answer must explain why *this* arrangement counts, while a random pile of the same gears does not. |
  | **The Organism** | A cat or a tree. | **The Natural Standard.** Living things compose themselves without human intent. If a theory requires human interest to create objects, it fails here. It must account for natural unity. |
  | **The Colony** | A hive of bees or a colony of ants. | **The Boundary of Unity.** Is the hive one thing or many? An answer must decide if functional cooperation creates a new object, or if spatial separation prevents it. |
  | **The Scattered Specimen** | A dinosaur skeleton split between two museum buildings. | **The Spatial Test.** Your database lists this as one specimen. An answer must explain whether spatial continuity is required for composition, or if administrative/functional unity suffices. |
  | **The Temporary Pattern** | A whirlpool or a traffic jam. | **The Stability Test.** These have structure and causal power but are fleeting. An answer must decide if persistence is required for objecthood, or if momentary integration is enough. |
  | **The Replacement** | A clock rebuilt piece by piece over years (Ship of Theseus). | **The Persistence Test.** An answer must distinguish between *composition* (what makes it now) and *identity* (what makes it the same thing as before). |
  | **The Coincidence** | A restored clay pot and the lump of clay constituting it. | **The Counting Test.** Are there two things in one place (the pot and the clay) or one? An answer must handle whether different conditions of destruction imply different objects. |
  | **The Borderline** | A heap of gravel or a cloud. | **The Vagueness Test.** There is no precise moment a heap becomes a heap. An answer must decide if reality itself is vague, or if our concepts are just imprecise. |
  | **The Nesting** | Cell, organ, animal, ecosystem. | **The Hierarchy Test.** Does composition happen at every level, or does it stop? An answer must clarify if it is "nesting-closed" (everything that composes is also a part of something else) or if there are fundamental levels. |

  ### 2. The Distinctions: What Must Not Be Collapsed

  A working theory must keep these concepts separate. If an answer conflates them, it solves the wrong problem.

  *   **Composing vs. Being Nothing Over and Above:** To say parts compose a whole is not necessarily to say the whole is a *new* substance. An answer must clarify if the whole is a distinct entity or just the parts arranged specifically.
  *   **Existing vs. Doing Causal Work:** A clock exists, but does it *do* anything the gears don't? If the causal powers are fully inherited from the parts, does the whole earn its keep? An answer must specify if causal novelty is required for existence.
  *   **Composing at a Time vs. Persisting:** A thing can be composed now but cease to exist later. An answer must not confuse the conditions for *being* a thing with the conditions for *staying* a thing.
  *   **One Thing vs. One Kind:** There may be one physical object here, but is it one *clock*? An answer must distinguish metaphysical unity (one object) from conceptual classification (one kind).
  *   **Real vs. Linguistic:** Is composition a feature of the world, or a feature of how we speak about the world? An answer must declare its stance: is it discovering facts or describing conventions?
  *   **Composition vs. Parthood:** The question "When do parts make a whole?" is different from "What are the parts of this whole?" An answer must not assume we already know the parts before we know if there is a whole.

  ### 3. Constraints from Outside Philosophy

  You asked whether certain demands are real requirements or rationalist preferences. Here is the assessment.

  *   **Inventory Compatibility:** An answer should not imply that chemistry, ecology, and museum inventories are systematically false.
      *   *Verdict:* **Real Requirement.** If a theory says tables and atoms don't exist, it creates more problems than it solves. It must save the phenomena of ordinary and scientific practice.
  *   **Knowability:** Facts about composition should not be unknowable in principle.
      *   *Verdict:* **Real Requirement.** If we can never know if composition occurred, the concept is useless for a working person.
  *   **Non-Accidental (No Brute Facts):** There should be a reason *why* composition happens, not just that it does.
      *   *Verdict:* **Rationalist Preference.** Reality owes us no explanations. It is possible that composition is just a brute fact. Demanding an explanation is a desire for elegance, not a constraint of truth.
  *   **Mind-Independence:** The answer should not shift with what anyone cares about.
      *   *Verdict:* **Contested.** For a clock, human interest matters (it's an artifact). For a cat, it does not. A unified theory must explain why interest matters for one but not the other, or admit that some composition is interest-relative.
  *   **Stability:** The answer should not shift with what anyone happens to care about *that afternoon*.
      *   *Verdict:* **Real Requirement.** While interests may fix the *kind* of object, the *existence* of the object should be stable. A clock shouldn't pop in and out of existence based on the curator's mood.

  ### 4. Sorting Requirements from Preferences

  This is the critical filter. Many philosophical debates stall because one side treats a preference as a requirement.

  | Candidate Constraint | Genuine Requirement | Camp Preference | Why? |
  | :--- | :---: | :---: | :---: |
  | **Non-triviality** (Falls between "nothing" and "everything") | | **X** | It is possible the truth is extreme. Demanding a middle ground biases the result. |
  | **General Condition** (One rule for all cases) | | **X** | Reality may be messy. Demanding a single formula is an aesthetic preference for unity. |
  | **No Brute Facts** (Explain why contact matters) | | **X** | As above. Some facts may just be fundamental. |
  | **Mind-Independence** (Statable without reference to interests) | | **X** | Artifacts *depend* on interests. A theory excluding minds fails for clocks. |
  | **Vindicate Common Sense** (Most ordinary claims are true) | **X** | | If a theory says clocks don't exist, the theory is likely wrong, not the clockmaker. |
  | **Explain Asymmetry** (Why breaking is easier than making) | **X** | | This captures your "breakability" intuition. A theory must account for entropy/integrity. |
  | **Precision** (No vague boundaries) | | **X** | Clouds and heaps are vague. Demanding precision forces us to deny their existence. |
  | **Scientific Consistency** (Compatible with physics/biology) | **X** | | Metaphysics cannot contradict established empirical fact. |

  ### 5. Trade-offs, Incompatibilities, and Your Rule

  You suspected that the demand for a **Single General Condition**, the demand for **No Brute Facts**, and the demand to **Vindicate Common Sense** cannot all be met. You are correct. This is the central tension of the field.

  **The Trilemma:**
  1.  **If you demand a Single General Condition** (e.g., "contact" or "bonding"): You will fail to vindicate Common Sense regarding clouds, heaps, and scattered specimens, because these lack precise physical boundaries.
  2.  **If you demand Vindication of Common Sense** (clouds and clocks exist): You must accept Vagueness or Brute Facts, because there is no precise physical moment a cloud forms.
  3.  **If you demand No Brute Facts** (a deep explanation for every boundary): You will likely be forced into Nihilism (nothing composes) because no physical relation seems perfectly sufficient to create "oneness" without arbitrariness.

  **Which requirement does the most work?**
  **Vindicate Common Sense.** This is the constraint that excludes the most theories. If you hold this fixed, you cannot have a precise, mind-independent, general physical condition for composition. You must accept either vagueness in the world or a role for human interests.

  **Which one should you abandon?**
  Abandon the demand for a **Single General Condition** that is **Mind-Independent**.
  *   *Cost:* You lose the elegance of a "physics of objects." You must accept that artifacts (clocks) compose due to function/interest, while organisms compose due to biological integration, and scattered specimens compose due to administrative unity. The "rule" becomes a disjunction of rules.
  *   *Benefit:* You save the reality of the clock, the cat, and the specimen record.

  **Does your "Breakability Rule" survive?**
  Your rule: *Some things compose something only if that something can be broken (damaged while parts persist).*
  *   **Where it succeeds:** It perfectly distinguishes the clock from the pile of gears. It handles the artifact and the organism well. It captures the asymmetry of entropy (hard to make, easy to break).
  *   **Where it fails:**
      1.  **The Scattered Specimen:** A skeleton in two buildings cannot be "broken" in your mechanical sense without destroying the bones. Yet it is one inventory item.
      2.  **The Universalist Challenge:** If I take a random cloud of dust in the room, can I "break" that arrangement? If I blow on it, have I damaged *it*? If yes, then *everything* composes something, and your rule loses its power to restrict.
      3.  **Elementary Particles:** Electrons compose atoms. Can an atom be "broken" while the electrons persist? Yes. But can an electron be broken? If not, does it exist? Your rule risks implying that fundamental particles are not real things.

  **Verdict on your rule:** It is an excellent *heuristic for artifacts and organisms*, but it is too narrow to be a *metaphysical necessary condition* for all composition. It describes *functional unity*, not composition itself.

  ### Brief Evaluation of the Three Standard Families

  1.  **Nihilism (Nothing ever composes):**
      *   *Pros:* Solves all vagueness and brute fact problems; perfectly precise.
      *   *Cons:* Fails the "Vindicate Common Sense" requirement completely. Tells you your clock does not exist.
  2.  **Universalism (Everything always composes):**
      *   *Pros:* No brute facts about when composition starts; simple rule.
      *   *Cons:* Fails the "Breakability" intuition. Says the clock and the pile of gears are equally "objects," just different arrangements. Makes "object" trivial.
  3.  **Restrictivism (Composition under some condition):**
      *   *Pros:* Matches common sense and your breakability rule.
      *   *Cons:* Cannot provide a single, precise, non-brute condition that covers clocks, cats, and clouds without contradiction. Requires accepting some vagueness or pluralism.

  **Summary for the Working Person:**
  If you want a criterion for your database and insurance schedule, use **Restrictivism** based on **Functional Integrity**. Accept that "object" is not a single natural kind like "gold," but a status granted to arrangements that have a specific mode of failure. Do not look for a single physical law that governs clouds, clocks, and cats equally. The cost is theoretical elegance; the benefit is that your inventory matches the world you work in.
