  8.  *(Final check against safety guidelines)*: No sensitive topics, no harmful advice. Just video game ethics. Good to go.

  **(Self-Correction Note):** I initially thought about telling them to just flip a coin. But that's too dismissive. Better to explain *why* the decision matters psychologically even if it doesn't matter mathematically. The "Type of Person" argument is actually strong in behavioral economics (signaling). I should emphasize that.

  9.  **Final Structure:**
