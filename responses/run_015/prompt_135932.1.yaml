answer: |-
  Your computations are correct, and your suspicion is well-founded: the accuracy-first derivation of Probabilism (specifically the normalization constraint $\sum c_i = 1$) is indeed hostage to the choice of inaccuracy measure in the way you describe. You have isolated the precise friction point between the "geometric" approach (Brier/Euclidean) and the "informational" approach (Log/Entropy).

  Here is the breakdown of the structural features, theorems, and philosophical implications regarding your five questions.

  ### (a) The Property: Unconstrained Propriety vs. Locality

  The specific property doing the work is **Unconstrained Strict Propriety** (sometimes called propriety over the non-negative orthant $\mathbb{R}^n_{\geq 0}$), which stands in contrast to **Locality**.

  1.  **Unconstrained Propriety:** A scoring rule $I(c, w)$ is strictly proper over the orthant if, for any probability function $q$, the expected score $E_q[I(c)]$ is uniquely minimized at $c=q$, *without* imposing the constraint $\sum c_i = 1$.
      *   **Brier:** Satisfies this. As you calculated, the gradient of expected Brier score vanishes exactly when $c_i = q_i$, regardless of whether $\sum c_i = 1$. The term $\sum_{j \neq i} c_j^2$ in the Brier score acts as a penalty on "credence inflation." It "sees" the mass assigned to false worlds and penalizes it.
      *   **Log:** Fails this. The expected log score $-\sum q_i \ln c_i$ has no minimum over the orthant; it drives $c_i \to \infty$. It only has a minimum *conditional* on the constraint $\sum c_i = 1$ (via Lagrange multipliers).

  2.  **Locality:** A scoring rule is **local** if the inaccuracy at world $w_i$ depends *only* on the credence assigned to $w_i$. Formally, $I(c, w_i) = f(c(w_i), 1)$ for some function $f$.
      *   **Log:** Is local. $I_L(c, w_i) = -\ln c(w_i)$. It does not care what you assigned to $w_j$.
      *   **Brier:** Is **non-local**. $I_B(c, w_i) = (1-c(w_i))^2 + \sum_{j \neq i} c(w_j)^2$. It penalizes you for what you believed about the *false* worlds too.

  **Is this circular?**
  There is a strong sense in which demanding Unconstrained Propriety *builds in* Probabilism. To derive the norm "your credences must sum to 1," you must use a measure that penalizes deviations from summing to 1. The Brier score penalizes $\sum c_i^2 \neq 1$ (roughly). The Log score does not.
  However, proponents (like Joyce) argue it is not viciously circular. The claim is that the **geometry of truth** is Euclidean. Truth-values are vectors $v \in \{0,1\}^n$. The natural measure of distance between a credence vector $c \in \mathbb{R}^n$ and a truth vector $v$ is Euclidean distance. If you accept that representation, Brier follows. If you accept the Log score, you are implicitly adopting an *informational* conception of accuracy where "false positives" (credence in false worlds) do not count as inaccuracies, only "false negatives" (lack of credence in the true world) do. To derive Probabilism, you must reject the purely informational view in favor of the geometric one.

  ### (b) Structural Necessity: The Characterization Theorem

  Your guess is correct: this is structural, not an artifact.

  **Theorem (Savage 1971; Bernardo 1979):** Up to positive affine transformation, the **Logarithmic score is the unique strictly proper local scoring rule.**

  **Implication:** If you want a scoring rule that is *local* (depends only on the true cell), you *must* use the Log score (or affine transforms). Consequently, **no local scoring rule can derive Probabilism (normalization) via dominance or expected accuracy arguments without assuming normalization in the domain.**
  *   Because a local rule $I(c, w_i) = f(c_i)$ does not depend on $c_j$ ($j \neq i$), changing $c_j$ does not change inaccuracy at $w_i$.
  *   Therefore, at any world $w_i$, you can increase $c_j$ arbitrarily without increasing inaccuracy at $w_i$.
  *   Thus, no coherent $p$ can dominate an incoherent $c$ that simply inflates all values (like your $(0.6, 0.6)$ example), because the inflation is invisible to the local measure.

  **Conclusion:** To derive the full norm of Probabilism (including $\sum c = 1$) from accuracy, you **must** use a non-local measure like Brier. If you insist on Locality, you must assume Probabilism as a precondition for the argument to work.

  ### (c) Calibration and Refinement

  You are exactly right. The decomposition of the Brier score is:
  $$ \text{Brier} = \text{Calibration} + \text{Refinement} + \text{Uncertainty} $$
  *   **Calibration:** Do your $x\%$ confidence events happen $x\%$ of the time?
  *   **Refinement:** How well do you distinguish true from false possibilities? (Related to the variance of your credences).

  The argument for Probabilism (specifically normalization) leans heavily on the **Refinement** component.
  *   In your example $c=(0.6, 0.6)$, the "Calibration" might look okay in isolation (you are confident), but the "Refinement" is terrible because you are assigning high credence to mutually exclusive falsehoods.
  *   The Brier score's term $\sum_{j \neq i} c_j^2$ is precisely the penalty for failing to refine away the false possibilities.
  *   The Log score lacks this term. It measures "surprise" at the truth, not "confusion" about the falsehoods.
  *   So, the Brier-based argument for Probabilism is effectively an argument that **epistemic utility requires minimizing confusion about false alternatives**, not just maximizing confidence in the truth.

  ### (d) Partition Dependence (Granularity)

  This is the most significant technical worry for the Brier-based program, often called the **Problem of Granularity** or **Refinement Sensitivity**.

  1.  **Brier Sensitivity:** As you noted, if you split a false cell $w_{false}$ into $w_{false1}, w_{false2}$ and split the credence $0.2 \to 0.1, 0.1$, the Brier score improves ($0.2^2 = 0.04$ vs $0.1^2 + 0.1^2 = 0.02$).
      *   *Verdict:* The Brier score rewards "spreading out" error over more false cells. This seems counter-intuitive for a measure of truth-closeness. Is it really more accurate to be vague about which false world is actual?
      *   *Standard Defense:* The accuracy argument is run relative to a fixed partition $Q$ (usually the set of "worlds" or maximally specific possibilities). Norms are $Q$-relative. We do not compare scores across different partitions.
      *   *Limit:* In the limit of infinite refinement, the Brier score of a probabilistic function tends toward 0 (if the space is continuous and we use density). This doesn't collapse the *argument* (dominance relations usually hold within the partition), but it makes cross-partition comparison impossible.

  2.  **Log Sensitivity:** The Log score is sensitive to the probability of the *true* cell. If you refine the true cell $w_{true}$ into $w_{true1}, w_{true2}$ and split credence, the Log score worsens ($-\ln 0.8 \approx 0.22$ vs $-\ln 0.4 \approx 0.91$).
      *   *Verdict:* Log penalizes lack of specificity about the truth.

  3.  **Interaction with (a):**
      *   If you demand **Partition Invariance** (accuracy verdicts shouldn't change just because we described the world more finely), both scores fail, but in opposite directions.
      *   However, the derivation of Probabilism requires a fixed partition. The "Ur-Partition" (the set of possible worlds) is usually taken as the metaphysical bedrock.
      *   Does Brier become local in the limit? No. Even with infinite cells, the Brier score is the $L_2$ norm distance. It remains sensitive to the mass on the complement of the truth. It does not collapse to Log.

  ### (e) The Intuitive Core: Budget vs. Information

  What is the 'shape' of the measure, and why prefer it?

  1.  **The Shape:**
      *   **Log (Informational):** Belief is a **spotlight**. Accuracy is determined solely by how brightly the spotlight shines on the actual world. Where the light *doesn't* shine (the false worlds) is irrelevant darkness.
      *   **Brier (Geometric/Budget):** Belief is a **substance** or **budget**. You have a fixed amount of "belief stuff" (normalized to 1). Accuracy is determined by how much of that stuff is placed on the truth vs. how much is wasted on falsehoods.

  2.  **The Veritist's Reason:**
      *   Why prefer the Budget view (Brier) for deriving Probabilism?
      *   Because Probabilism *is* a budget constraint. $\sum c_i = 1$ means "do not believe more than is possible."
      *   If you adopt the Spotlight view (Log), you cannot derive the budget constraint. The spotlight *can* shine at intensity 2.0 on the truth without logical contradiction in an informational framework (it just means very low surprise).
      *   To get the norm "Do not have credence sum $> 1$," you must argue that **assigning credence to a falsehood is intrinsically costly**, not just instrumentally costly because it takes away from the truth.
      *   **The Defense:** A veritist should hold that believing a falsehood is a *positive evil*, not merely a missed opportunity for truth.
          *   Log treats false belief as neutral (if $c(w_{false}) = 0.9$, Log score at $w_{true}$ is unaffected).
          *   Brier treats false belief as a positive distance from the truth vector.
      *   Therefore, if you think epistemic normativity forbids *believing falsehoods* (not just failing to believe truths), you are committed to a non-local measure like Brier.

  ### Summary

  *   **Your math is correct.** Log scores cannot enforce normalization without assuming it; Brier scores can.
  *   **The Property:** Non-Locality (specifically, Unconstrained Propriety).
  *   **Structural?** Yes. Log is the unique local proper score. To derive Probabilism, you must abandon Locality.
  *   **Intuition:** Brier models belief as a budget distributed over a space (penalizing waste on falsehoods). Log models belief as information about the actuality (ignoring waste). Deriving Probabilism requires the Budget model.

  The "cost" of the Brier approach is accepting Partition Sensitivity and the claim that "spreading error" affects accuracy. The "cost" of the Log approach is accepting that you cannot derive Probabilism from accuracy alone—you must assume the probabilistic structure to make the Log score work. Most accuracy-first epistemologists (Joyce, Pettigrew) bite the bullet on Brier's non-locality because they view the derivation of Probabilism as the primary goal.
