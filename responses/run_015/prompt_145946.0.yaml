answer: |-
  Here is the decision procedure, followed by the application to your three measures, the epistemic limitations, and the Monday morning directive.

  ### Part 1: The Performance Measure Stress-Test Protocol (PMSTP)

  **User:** Two Policy Analysts (MPA).
  **Time Budget:** 3 hours per measure.
  **Output:** A one-page "Measure Specification Sheet" with a Red/Amber/Green status.

  #### Phase 1: The Charter & Data Gate (30 Minutes)
  *Goal: Eliminate measures that are legally or technically non-starters.*

  1.  **Verifiability Check:** Can the value of this measure be calculated solely from administrative data fields that currently exist in the HMIS (Homeless Management Information System) or finance system, without new staff narrative or site visits?
      *   **No:** **STOP.** Reject measure. (Charter violation).
      *   **Yes:** Proceed.
  2.  **Latency Check:** Is the data available within 45 days of the performance period end?
      *   **No:** **STOP.** Reject measure. (Cannot enforce contract timely).
      *   **Yes:** Proceed.

  #### Phase 2: The Gaming Channel Audit (90 Minutes)
  *Goal: Force specific identification of how a provider improves the number without improving the mission.*

  3.  **Channel Identification:** The analyst must select at least **two** specific channels from the following list through which a rational provider could inflate this measure *without* increasing net social welfare:
      *   *Cream-Skimming:* Selecting easier-to-serve clients at entry.
      *   *Parking:* Withholding services from hard-to-serve clients to protect the rate.
      *   *Reclassification:* Changing client status codes to exclude failures from the denominator.
      *   *Effort Shift:* Diverting resources from unmeasured (but vital) tasks to measured tasks.
      *   *Threshold Gaming:* Stopping service immediately upon hitting the metric (e.g., housing placement) even if stability is unlikely.
      *   **Requirement:** For each selected channel, write one sentence describing *exactly* how a provider would execute it in this specific program context.
      *   **Failure:** If analyst cannot name two plausible channels, **STOP.** Consult Senior Analyst. (Indicates analyst does not understand the service environment).
      *   **Success:** Proceed.

  #### Phase 3: The Sentinel & Reification Check (60 Minutes)
  *Goal: Detect degradation and metric fixation.*

  4.  **Sentinel Pairing:** Identify one **non-incentivized** indicator that should theoretically move in the *same direction* as the target measure if success is real, but would move in the *opposite direction* (or stay flat) if the target is being gamed.
      *   *Examples:* Return-to-shelter rate, average vulnerability score of entrants, client satisfaction post-exit.
      *   **Question:** Does a valid sentinel exist in current data?
          *   **No:** **FLAG AMBER.** Measure is high-risk. Requires Deputy Director sign-off on risk tolerance.
          *   **Yes:** Proceed.
  5.  **Reification Warning:** Draft the "Warning Label" for the contract cover sheet. It must take the form: *"A rise in [Measure] does not necessarily indicate [Mission Goal] if [Sentinel] deteriorates."*
      *   **Requirement:** If the analyst cannot complete this sentence without vagueness, **FLAG AMBER.**

  #### Phase 4: The Verdict & Hand-Off
  *Goal: Assign weight and identify value judgments.*

  6.  **Control Assessment:** Does the provider have direct operational control over >50% of the variance in this measure?
      *   **No:** **STOP.** Demote to "Monitoring Only." (Do not contract on this).
      *   **Yes:** Proceed.
  7.  **Final Classification:**
      *   **Green:** Two gaming channels identified + Valid Sentinel + Control >50%. **Recommendation:** Incentivize (Weight 10-30%).
      *   **Amber:** Valid Sentinel missing OR Control is borderline (30-50%). **Recommendation:** Monitor Only OR Incentivize with Caps (Weight <10%). **Hand-off:** Deputy Director must sign risk acceptance.
      *   **Red:** Charter fail OR No Gaming Channels Identified (Analyst error) OR Control <30%. **Recommendation:** Drop.

  ---

  ### Part 2: Application to the Three Measures

  I have run the PMSTP on your three candidates. Below are the definite verdicts.

  #### Measure 1: Share of enrolled households exiting to permanent housing (Exit Rate)
  *   **Phase 1:** Pass. Data exists in HMIS.
  *   **Phase 2 (Gaming):**
      *   *Channel A (Cream-Skimming):* Providers recruit households already near housing readiness (e.g., those with income) to boost exit rates, referring away those with severe disabilities or justice involvement.
      *   *Channel B (Threshold Gaming):* Providers place households in permanent housing that is unsustainable (e.g., unaffordable units, hostile living situations) to log the "exit," accepting a high likelihood of return.
  *   **Phase 3 (Sentinel):**
      *   *Sentinel:* **Return-to-Homelessness within 6 months.** (If Exit Rate goes up, but Return Rate goes up, gaming is occurring).
      *   *Reification Warning:* "A rise in Exit Rate does not necessarily indicate reduced homelessness if the 6-month Return Rate deteriorates."
  *   **Phase 4 (Control):** Providers control placement efforts, but not the housing market. Control is ~60%.
  *   **Verdict:** **GREEN, WITH CONDITION.**
      *   **Recommendation:** Incentivize, **BUT** weight must be reduced unless risk-adjustment is applied.
      *   **Reasoning:** This is the measure you support. The procedure validates it as the strongest candidate *conceptually*, but the Gaming Audit reveals a fatal flaw: without risk-adjustment (controlling for client vulnerability), this measure penalizes providers who do the hardest work. If you weight this heavily without risk-adjustment, you will incentivize cream-skimming.
      *   **Action:** Use this measure, but cap its weight at 15% until a risk-adjustment model is validated. If you cannot risk-adjust by Monday, you must demote this to Amber status.

  #### Measure 2: Average number of days from program entry to housing placement (Time to Housing)
  *   **Phase 1:** Pass.
  *   **Phase 2 (Gaming):**
      *   *Channel A (Effort Shift):* Staff spend all time on "quick wins" (clients ready day 1) and ignore complex cases that require long-term case management.
      *   *Channel B (Threshold Gaming):* Placing clients in housing that is not "permanent" by HUD definitions but counts in the local system, or placing them in housing they cannot afford, just to stop the clock.
  *   **Phase 3 (Sentinel):**
      *   *Sentinel:* **Housing Retention at 12 Months.**
      *   *Reification Warning:* "A drop in Days to Placement does not necessarily indicate increased efficiency if Housing Retention at 12 Months drops."
  *   **Phase 4 (Control):** High control over process, low control over market inventory.
  *   **Verdict:** **AMBER.**
      *   **Recommendation:** **Monitor Only.** Do not tie contract renewal to this.
      *   **Reasoning:** The incentive to "stop the clock" is too strong. It directly conflicts with housing stability. It is cheap to compute, which makes it seductive, but the Gaming Audit shows it actively punishes serving high-need populations.
      *   **Action:** Publish it monthly for internal management, but remove from the contract scoring matrix.

  #### Measure 3: Year-over-year change in the unsheltered count (PIT Count)
  *   **Phase 1:** Pass (Data exists).
  *   **Phase 2 (Gaming):**
      *   *Channel A (Reclassification):* Not applicable to providers, but...
      *   *Channel B (Control Failure):* Providers cannot control this number. It is driven by macroeconomics, eviction rates, weather, and enumeration methodology.
  *   **Phase 3 (Sentinel):** No valid sentinel exists because the signal-to-noise ratio is too low for provider attribution.
  *   **Phase 4 (Control):** **<10%.**
  *   **Verdict:** **RED.**
      *   **Recommendation:** **DROP from contracts immediately.**
      *   **Reasoning:** Tying a provider's contract renewal to the city-wide Point-in-Time count is legally indefensible and operationally absurd. A provider could perform perfectly and fail this measure due to a regional economic shock. It violates the Control Assessment gate.
      *   **Action:** Keep for public reporting to City Council, but remove from the RFP scoring rubric.

  ---

  ### Part 3: The Answer You Will Not Like

  You asked for one worked example where the procedure returns a verdict you won't like. **That is Measure 1 (Exit Rate).**

  You have gone on record supporting this as the headline accountability measure. The PMSTP verdict is that **you cannot use it as the *largest* contract weight without risk-adjustment.**

  **Why:** The Gaming Audit identified "Cream-Skimming" as a live channel. If Provider A serves 100 high-barrier clients (veterans with PTSD, chronic health issues) and houses 40, and Provider B serves 100 low-barrier clients (youth with family support) and houses 80, Provider B looks twice as effective. If you weight Exit Rate heavily, Provider A goes out of business, and the city loses the capacity to serve the people who need it most.

  **The Hard Truth:** You likely do not have a validated risk-adjustment model ready for Monday. Therefore, the procedure forces you to **demote Measure 1 from "Headline Weight" to "Secondary Weight"** until the data infrastructure catches up. If you proceed with high weight on Measure 1 without adjustment, you are building a system that rewards providers for avoiding the homeless population the city cares about most.

  ---

  ### Part 4: Epistemic Limitations & Commitments

  You asked for explicit commitment on what this procedure cannot do.

  1.  **Blind Spot: Collusion.** The procedure assumes the analyst and the city are the principals and providers are the agents. It cannot detect if city staff and provider staff collude to manipulate the data entry before it reaches the analyst.
  2.  **Blind Spot: Sentinel Gaming.** If you incentivize the Target and monitor the Sentinel, a sophisticated provider may eventually learn to game the Sentinel too (e.g., discouraging clients from returning to shelter to keep the Return Rate low). The procedure flags this risk but cannot eliminate it.
  3.  **Blind Spot: Data Asymmetry.** Providers know their own case files better than the city analysts. They can reclassify a "failure" as a "voluntary exit" in ways the HMIS data dictionary allows but the city cannot easily audit without site visits (which the charter restricts).
  4.  **Irreducible Judgment:** The "Risk Tolerance" hand-off to the Deputy Director is not a bug; it is a feature. The procedure can identify *that* a risk exists (e.g., "This measure encourages cream-skimming"), but it cannot calculate *how much* cream-skimming is acceptable trade-off for administrative simplicity. That is a political value judgment, not a technical one.

  ### Monday Morning Directive

  1.  **Adopt the PMSTP.** Print it. Give it to your two analysts. Tell them if they cannot name two gaming channels, they have not done the work.
  2.  **Measure 1 (Exit Rate):** Include it, but **cap the weight at 15%**. Add a contract clause stating that weights will be recalibrated in Year 2 based on a risk-adjustment analysis. This protects you from the cream-skimming accusation while keeping the metric.
  3.  **Measure 2 (Days):** Move to **Internal Dashboard Only**. Do not put it in the contract.
  4.  **Measure 3 (PIT Count):** **Remove from contract.** Tell the Director: "Legal and procurement will not allow us to tie vendor performance to macroeconomic indicators we cannot control. We will report this to Council separately, but it cannot be a vendor KPI."
  5.  **Sentinels:** For Measure 1, mandate the **6-Month Return Rate** as a "Threshold Sentinel." If the Return Rate exceeds 20%, the Exit Rate bonus is voided, regardless of performance.

  **Final Commitment:** If you weight Measure 1 heavily without the risk-adjustment or the sentinel cap, you will face a protest from a provider serving high-need populations within 12 months. The procedure predicts this. Mitigate it now.
