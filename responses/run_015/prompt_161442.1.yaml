      *Wait, one nuance:* The friend says "Malthus's theory was... It didn't happen." Then attacks "people who say he was right but early." The friend is attacking the *defenders*, not Malthus directly. I need to make sure I distinguish between Malthus's original falsification and the Neo-Malthusian rescue attempt.
      *   *Lakatosian view:* Is Neo-Malthusianism a new programme or a rescue of the old one? It's a rescue. Is it degenerating? That depends on whether it generates novel predictions (e.g., specific peak dates) that get tested.
      *   *The "Prophecy" Charge:* Prophecy implies unfalsifiability. If they say "50 years" and it passes, and they say "50 more years," that's degenerating. If they say "When X stock is gone," and X is measurable, that's science.

