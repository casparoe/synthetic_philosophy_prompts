  **ROOT COMMITMENT:** You grant there is a non-zero, non-trivial chance that insects have valenced states, and that if they do, those states carry at least some moral weight.

  **NODE 1: NATURE OF UNCERTAINTY**
  Is the uncertainty about insect sentience primarily a lack of empirical data (resolvable in principle) OR metaphysical vagueness (sentience is a cluster property with no sharp boundary)?
  *   **Empirical:** Go to Node 3.
  *   **Vagueness:** Go to Node 2.

  **NODE 2: AGGREGATION OVER VAGUENESS**
  (If Vagueness) Can expected value be coherently calculated across indeterminate boundaries of 'subjecthood', OR does indeterminacy block aggregation entirely?
  *   **Blocks Aggregation:** → **LEAF A: Vagueness Skeptic**
  *   **Allows Aggregation:** Go to Node 3.

  **NODE 3: MORAL BEARER**
  Does moral concern require a definite, identifiable bearer (a specific subject), OR can it attach to a probabilistic expectation of a bearer?
  *   **Definite Bearer Required:** → **LEAF B: Aggregation Rejector**
  *   **Probabilistic Weight OK:** Go to Node 4.

  **NODE 4: DECISION RULE**
  Do you maximize Expected Value (EV) regardless of how small the probability and how large the stake (fanaticism), OR do you apply a probability threshold or variance penalty?
  *   **Threshold/Penalty:** → **LEAF C: Anti-Fanatic**
  *   **Maximize EV:** Go to Node 5.

  **NODE 5: THE TRADE-OFF CASE**
  Program A certainly averts fixed suffering in 10 chickens. Program B has probability *P* of averting identical per-animal suffering in 1,000,000 insects. Are you indifferent when *P* scales linearly (e.g., ~1/100,000) OR do you require *P* to be much higher (e.g., >1%) regardless of numbers?
  *   **Require High P (Plateau):** → **LEAF D: Lexical Threshold**
  *   **Linear Scaling:** Go to Node 6.

  **NODE 6: THE EXTENSION**
  If your principle includes insects, does it also include soil nematodes or mites, where numbers are higher again but neural complexity and *P*(sentience) are lower?
  *   **Principle Stops:** → **LEAF E: Biological Threshold**
  *   **Principle Extends:** Go to Node 7.

  **NODE 7: TRACTABILITY & EPISTEMICS**
  Does our inability to predict the ecological effects of intervening defeat the priority claim entirely, OR does it merely convert the claim into a case for investigating first?
  *   **Defeats Priority:** → **LEAF F: Tractability Deprioritizer**
  *   **Investigate First:** Go to Node 8.

  **NODE 8: RESEARCH VS. ACTION**
  Given the uncertainty, is the immediate duty to fund research into welfare effects, OR to act on current best estimates despite risks?
  *   **Fund Research:** → **LEAF G: Research-First Postponer**
  *   **Act on Estimates:** Go to Node 9.

  **NODE 9: THE POPULATION CASE**
  If wild insect lives are on balance net negative, does the arithmetic favor active population reduction, OR is there a constraint against intervening on abundance regardless of the sum?
  *   **Constraint Against Intervention:** → **LEAF H: Ecological Conservative**
  *   **Arithmetic Favors Reduction:** Go to Node 10.

  **NODE 10: OBLIGATION VS. PERMISSION**
  If the scale argument wins, does it generate a strict obligation to reallocate resources to insects, OR only a permission to do so?
  *   **Permission Only:** → **LEAF I: Permissive Prioritarian**
  *   **Strict Obligation:** → **LEAF J: Straight EV Insect Prioritarian**

  ---

  ### LEAF DESCRIPTIONS

  *   **A: Vagueness Skeptic.** *Awkward Commitment:* Moral status vanishes due to semantic vagueness rather than biological facts. *Cases:* Ignore insects in trade-off; Maintain status quo on population.
  *   **B: Aggregation Rejector.** *Awkward Commitment:* Cannot sum moral weight across probabilistic subjects, even if EV is huge. *Cases:* Save chickens in trade-off; Ignore population arithmetic.
  *   **C: Anti-Fanatic.** *Awkward Commitment:* Must ignore huge stakes due to tiny probability, rejecting standard EV maximization. *Cases:* Save chickens in trade-off; Ignore population arithmetic.
  *   **D: Lexical Threshold.** *Awkward Commitment:* Must draw arbitrary line at probability weight rather than biological complexity. *Cases:* Save chickens in trade-off; Maintain status quo on population.
  *   **E: Biological Threshold.** *Awkward Commitment:* Must draw arbitrary line at neural complexity despite linear EV scaling. *Cases:* Save chickens in trade-off; Maintain status quo on population.
  *   **F: Tractability Deprioritizer.** *Awkward Commitment:* Must ignore solvable suffering due to complex side effects. *Cases:* Ignore trade-off; Maintain status quo on population.
  *   **G: Research-First Postponer.** *Awkward Commitment:* Must delay aid to suffering beings until models are perfect. *Cases:* Research in trade-off; Research on population.
  *   **H: Ecological Conservative.** *Awkward Commitment:* Must allow net suffering to persist to avoid intervention risks. *Cases:* Save insects in trade-off; Maintain status quo on population.
  *   **I: Permissive Prioritarian.** *Awkward Commitment:* May ignore massive suffering if inconvenient, despite EV calculus. *Cases:* Optional reallocation in trade-off; Optional intervention on population.
  *   **J: Straight EV Insect Prioritarian.** *Awkward Commitment:* Must prioritize insects over humans if numbers dictate. *Cases:* Save insects in trade-off; Reduce population if net bad.

  ---

  ### META-ANALYSIS FOR DISCUSSANTS

  **1. Unoccupied or Unattractive Combinations**
  *   **The Vague Fanatic:** Accepts metaphysical vagueness (Node 1) but insists on maximizing EV over indeterminate boundaries (Node 2). *Status:* **Incoherent.** One cannot maximize expected value if the 'value' term lacks a truth condition.
  *   **The Obligatory Conservative:** Accepts a strict obligation to maximize welfare (Node 10) but rejects population reduction despite net negative lives (Node 9). *Status:* **Unattractive.** Implies a duty to help that forbids the only effective method of helping.

  **2. Indistinguishable Leaves**
  *   **Leaf D (Lexical Threshold) and Leaf E (Biological Threshold).** *Verdict:* Both prescribe saving chickens over insects and maintaining population status quo. *Separation:* Ask the reader *why* they stop. If they cite neural complexity, they are Leaf E. If they cite the probability weight itself, they are Leaf D. Nothing in the *cases* prys them apart, only the justification.

  **3. The Main Work Node**
  *   **Node 4 (Decision Rule).** Your group's stalemate ("numbers swamp" vs. "probability too low") is almost entirely occurring here. This node separates those who accept the logic of expected value across extreme scales (Fanaticism) from those who intuitively apply a discount to low-probability events (Threshold). Resolving this node renders most subsequent nodes secondary.
