answer: |-
  This is an exceptionally sharp set of questions. You have correctly identified the friction points where the soteriological engine of Madhyamaka meets the institutional machinery of the Geluk curriculum. Your field notes on the debate practice (Sera/Drepung style) are accurate: the standing challenger (*rgyal kha ba*) wields *prasaṅga* (consequence) without asserting a thesis, while the seated defender (*dam bca' ba*) is constrained to a fixed menu of replies.

  Your friend the dialetheist is tempting because, on the surface, Madhyamaka looks like it tolerates contradictions (emptiness of inherent existence vs. conventional functionality). However, the *practice* of Geluk debate is rigorously classical. If you want to reconstruct the implicit theory licensing this package, you need to distinguish between the **ontology of the object** (which is empty) and the **normativity of the reasoning** (which is strictly bivalent).

  Here is the reconstruction of the implicit theory, structured by your three threads, followed by the institutional tension and the counterfactuals.

  ### 1. The No-Thesis Norm: Conditional vs. Loaded *Prasaṅga*

  You distinguish between the **conditional-only reading** (If P, then Q) and the **loaded reading** (If P, then Q; not-Q; therefore not-P). You suspect the conditional reading is metaphysically cheap but pragmatically inert, while the loaded reading requires backing. You are correct.

  **The Implicit Theory:**
  The debate practice presupposes a **Norm of Rational Coherence** that holds conventionally, even if it does not hold ultimately.
  *   **Why Conditional-Only Fails:** If the challenger merely shows, "Given your view, absurdity X follows," the defender could theoretically say, "So what? I accept absurdity X." For the debate to function as a soteriological tool (uprooting ignorance), the absurdity (*thal 'gyur*) must be *unacceptable* to the defender.
  *   **The Loaded Requirement:** The *prasaṅga* is implicitly a *reductio ad absurdum*. It relies on the Law of Non-Contradiction (LNC). The challenger forces the defender into a contradiction with their *own* other commitments (either empirical or doctrinal).
  *   **Metaphysical Backing:** This does not require "intrinsic nature" for the logic itself. It requires that the *defender* is committed to consistency. The "metaphysical backing" is not in the logic, but in the psychology of the participant. The practice assumes that holding contradictory conventional commitments is a cognitive error (*'khrul pa*) that prevents liberation.

  **The Dialetheist Objection:**
  Your friend is right that if dialetheism were true (if contradictions could be true), the *prasaṅga* would lose its bite. The defender could reply, "Yes, it follows that X is both F and not-F, and I accept that."
  *   **Geluk Response:** Geluk Madhyamaka is **not dialetheic**. It is **non-assertoric** about the ultimate, but **classically bivalent** about the conventional. Emptiness is not a "true contradiction"; it is the *absence* of a predicate (inherent existence) that never applied in the first place. Therefore, the debate practice *strictly presupposes* classical logic (LNC and Excluded Middle) as the rules of engagement for conventional discourse.

  ### 2. Pervasion (*Vyāpti*) and the Emptiness of Logic

  This is the deepest philosophical tension. If nothing has *svabhāva* (intrinsic nature), how can there be a necessary connection (pervasion) between a reason (*rtags*) and a predicate (*bsgrub bya*)? Does the debate form presuppose that logic has *svabhāva*?

  **The Implicit Theory:**
  **Pervasion is Conceptual, Not Ontological.**
  *   **The Geluk Move:** Geluk logicians (following Tsongkhapa) argue that pervasion is established through **exclusion (*apoha*)** and **conceptual identity**, not through external, mind-independent hooks.
  *   **Escaping Emptiness:** Logic does not "escape" emptiness; it is *empty*. But because it is dependently arisen (*rten 'brel*), it is reliable. A mirror image is empty of being a real face, but it reliably reflects the face. Similarly, logical consequence is empty of intrinsic power, but it reliably tracks conceptual relationships.
  *   **Necessity:** The "necessity" in "If smoke, then fire" is not a steel cable connecting two atoms. It is a necessity of *meaning* and *causal regularity* within the conventional framework.
  *   **Underdetermination:** Here, the practice is underdetermined. One could theoretically hold that pervasion requires real universals (Sautrāntika/Svātantrika view). Geluk debates *look* like they presuppose real universals because the moves are so rigid, but the official theory insists these are merely imputed by thought (*blo'i btags pa*). The practice works because the *participants agree to treat concepts as stable* for the duration of the debate.

  **Does Logic have Own-Being?**
  No. But the practice treats logic as **Conventionally Ultimate**. That is, while tables are empty, the rules of inference are treated as non-negotiable conventions. If you deny pervasion without a counter-example, you are not "deep"; you are "disqualified." The institution rewards mastery of the convention, not deconstruction of the convention *during* the debate.

  ### 3. The Tetralemma: Dilemmatic vs. Explosive

  You ask if refuting all four corners presupposes the tidy bivalent space it explodes. You propose "dilemmatic" (standard logic) vs. "explosive" (rejecting the framework).

  **The Implicit Theory:**
  **The Therapeutic Dissolution.**
  *   **The Trap:** The tetralemma (arising from self, other, both, neither) exhausts the possibilities *only if* one assumes that "arising" is a real process and "self/other" are real entities.
  *   **The Move:** Nāgārjuna does not accept the exhaustiveness to prove a fifth option. He accepts the exhaustiveness to show that **the question is ill-posed**.
  *   **Mapping your terms:** It is neither dilemmatic nor explosive in the logical sense. It is **transcendental**. It shows that the logical space itself is a projection of ignorance.
  *   **Presupposition:** The refutation *does* presuppose that the four corners are mutually exclusive *under the assumption of inherent existence*. It uses the opponent's logic against them. It says, "Even by *your* standards of real existence, none of these four work."
  *   **The Tension:** You are right to feel a tension. To refute the four, you must temporarily inhabit the logical space that treats them as exhaustive. The implicit theory is that you must **climb the ladder and kick it away**. You use bivalent logic to prove that bivalent logic does not apply to ultimate reality.

  ### 4. The Institutional Paradox: No-Thesis vs. Required Thesis

  This is the most concrete inconsistency you note: The courtyard demands no thesis (Prāsaṅga), but the classroom demands you defend Prāsaṅgika as the highest view.

  **Resolution:**
  This dissolves once you distinguish **Object-Negation** from **Affirming-Negation**, and **Ultimate** from **Conventional**.
  1.  **The "Prāsaṅgika Thesis":** When you defend Prāsaṅgika in exams, you are not asserting an ultimate truth. You are asserting a **conventional claim about the path**: "The view that understands emptiness as the absence of inherent existence is the most effective antidote to clinging."
  2.  **Meta-View:** The Prāsaṅgika position is a *meta-view*. It is a view about how to handle views.
  3.  **Institutional Function:** The courtyard simulates the *ultimate* perspective (deconstructing all claims). The classroom simulates the *conventional* perspective (building the path).
  4.  **Is it a Genuine Tension?** Yes, but it is a **controlled tension**. The institution rewards students who can hold the tension without collapsing into nihilism (debate is meaningless) or eternalism (debate proves real truth). The rank depends on navigating this: being aggressive enough to deconstruct the opponent, but precise enough not to deny conventional karma/logic.

  ### 5. Counterfactuals

  **A. If Bhāviveka's *Svatantra* (Autonomous Inference) Replaced *Prasaṅga*:**
  *   **The Change:** Bhāviveka demanded that both parties agree on the subject (*pakṣa*) as established by valid cognition (*pramāṇa*) before debating.
  *   **Impact on Practice:**
      1.  **Ontological Commitment:** The challenger would have to assert, "I accept that the subject exists inherently (or conventionally in the same way you do)." This violates the Madhyamaka no-thesis norm.
      2.  **Slower Deconstruction:** Debate would become more constructive and dogmatic. You would spend time establishing shared ground rather than exploiting the opponent's inconsistencies.
      3.  **Risk of Reification:** The practice would subtly teach students that logical subjects have intrinsic status. The "ritual costume" would shift from a deconstructive surgery to a constructive architecture.
      4.  **Geluk Critique:** Gelukpas argue *svatantra* is impossible because Mādhyamikas and Realists do not share a common appearance of the subject (one sees it as empty, the other as real). Adopting this would break the Geluk epistemological framework.

  **B. If Your Friend Were Right (Dialetheism / True Contradictions):**
  *   **The Change:** If some corners of the tetralemma could be "both true and false," or if a *prasaṅga* consequence could be accepted as a true contradiction.
  *   **Impact on Practice:**
      1.  **Collapse of the *Thal 'gyur*:** The "absurd consequence" would no longer be absurd. The defender could say, "Yes, it follows that the subject is both permanent and impermanent, and that is the nature of reality."
      2.  **End of Debate:** The debate engine runs on the pressure of inconsistency. If inconsistency is tolerable, the pressure valve is open. The challenger loses the weapon of *reductio*.
      3.  **Soteriological Shift:** Liberation would no longer be the removal of cognitive error (contradiction), but perhaps the acceptance of paradox. This moves closer to certain Zen or Huayan formulations, but it is alien to the Geluk "precision of analysis" (*dpyad rig*).
      4.  **Institutional Breakdown:** The grading system relies on spotting errors (*nyes*). If contradictions are not errors, the ranking system collapses.

  ### Summary of the Dependency Structure

  1.  **Foundation:** Conventional Validity (*tha snyad du bden pa*). Logic and language work reliably, even if they don't map to ultimate reality.
  2.  **Engine:** Classical Logic (LNC/Excluded Middle). Required for the *prasaṅga* to function as a *reductio*.
  3.  **Method:** *Prasaṅga* (Consequence). Uses the opponent's commitments to generate internal inconsistency.
  4.  **Goal:** Elimination of *Grasping* (*'dzin pa*). Not proving a new truth, but removing the error of inherent existence.
  5.  **Institution:** Uses the **Method** (Courtyard) to train the **Goal**, while using the **Curriculum** (Classroom) to preserve the **Foundation**.

  **Where you might be misdescribing:**
  You suggest the challenger "never states a position of his own." Strictly speaking, in Geluk debate, the challenger *does* assert the pervasion and the forward/backward entailments during the "defense of the reason" phase. They don't assert a *thesis about the ultimate*, but they assert the *rules of the inference*. If they refused to assert the pervasion, the debate would stall. So, it's not "no assertion ever," it's "no assertion of inherent existence."

  **Final Verdict on the Dialetheist Friend:**
  Your friend is seeing a surface resemblance (rejecting bivalence in the tetralemma) but missing the structural dependency (relying on bivalence in the debate logic). The Geluk system is a **classical logic engine driving a non-classical ontology**. If you make the logic non-classical (dialetheic), the engine stalls. If you make the ontology classical (realist), the vehicle crashes. The practice works only because it keeps them separate.
