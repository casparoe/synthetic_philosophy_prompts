          *   *Dialetheism:* If corners could be both true/false, the *prasaṅga* loses its force (as noted above). The defender could say, "Yes, it follows, and I accept the contradiction." The debate would stall. The practice *requires* the law of non-contradiction (LNC) as a conventional rule of engagement.

