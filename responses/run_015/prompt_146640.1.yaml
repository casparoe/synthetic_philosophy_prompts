      *   *Trading:* Use a "Market Maker" (the instructor) or allow peer-to-peer? Peer-to-peer is more fun but harder to track. Let's use a **Clearinghouse** model. Students submit buy/sell orders at specific prices. Instructor matches them.
      *   *Wait, simpler:* **Prediction Market with Play Money.** Each student gets \$1000. They can buy shares at current market price. Market price updates based on aggregate demand? No, that's too complex to run manually.
      *   *Best for Classroom:* **Bet Matching.** Students write down "I bet \$100 that Claim X is True at odds 3:1". Instructor matches bets. If no one takes the other side, the price stands.
