      *   *The "Unsettled" Claim:* Crucial. Must remain $<1$.

      *(Self-Correction during drafting)*: 25-30 claims is definitely too many. I will advise the user to cut this to ~10-12 claims grouped in families. 30 claims creates analysis paralysis.
