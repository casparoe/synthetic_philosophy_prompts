  There is a single coherent principle that captures your verdicts, though it requires sharpening the distinction you draw between "agency" and "determinism." Your intuitions are governed by what I will call **The Principle of Irreducible Mechanistic Imprint.**

  ### The Principle

  **A non-human force counts as a historical actor if and only if the *qualitative form* of the historical outcome bears a distinctive imprint of the force's *internal mechanics* (e.g., selectivity, synchronicity, compound thresholds) that is irreducible to a generic magnitude shock (e.g., scarcity, mortality volume) mediated by human institutions.**

  This principle relies on two clauses:

  1.  **The Generic Magnitude Clause (Background):** If the non-human force acts merely as a stressor that alters the *volume* of inputs (labor, food, stability) which human institutions then negotiate, interpret, or redistribute, the force is a background condition. The "work" of history is done by the institutional response.
  2.  **The Mechanistic Imprint Clause (Actor):** If the non-human force acts through specific *mechanics* that dictate the *structure* of the outcome in a way human institutions could not have generated endogenously, the force is an actor. The "work" of history is partially done by the force's specific physical signature.

  ### Application to Your Cases

  *   **The Black Death (Background):** Governed by **Clause 1**. The plague provided a *magnitude shock* (labor scarcity). The *form* of the outcome (the end of feudalism, renegotiated wages) was determined by human institutional logic (bargaining, legislation). The pathogen's mechanics (bacterial transmission) did not dictate the specific social settlement.
  *   **Laki Eruption (Background):** Governed by **Clause 1**. The volcano provided a *magnitude shock* (crop failure). The *form* of the outcome (Revolution) was determined by political ideology and state capacity. The sulfur haze did not dictate the specific political structure that replaced the monarchy.
  *   **Tambora / Politics (Background):** Governed by **Clause 1**. Similar to Laki; crop failure created unrest, but political outcomes were mediated by human institutions.
  *   **Tambora / *Frankenstein* (Actor):** Governed by **Clause 2**. The volcano's mechanics (ash cloud -> rain/cold) imposed a *specific constraint* (confinement indoors). This constraint directly shaped the *qualitative form* of the outcome (Gothic tropes of isolation/darkness). No human institution mediated this; the weather wrote the setting.
  *   **1918 Influenza (Actor):** Governed by **Clause 2**. The virus's mechanics (cytokine storm targeting young adults) imposed a *specific demographic constraint* (depletion of male labor). This directly shaped the *qualitative form* of the outcome (gendered labor substitution). A generic mortality shock (like Black Death) would not have produced this specific gendered shift.
  *   **536 CE Compound Event (Actor):** Governed by **Clause 2**. The *mechanic* here is non-linear synergy. Neither shock alone crossed the systemic threshold; only the *compound mechanics* did. The outcome (systemic break) bears the imprint of this specific threshold-crossing, not just generic stress.

  ### The Least Comfortable Case: The Classic Maya

  Your account handles the **Classic Maya collapse** least comfortably.

  Your verdict ("neither pure background nor a full agent") conflicts with the logical extension of your 1918 Influenza verdict. Under the **Mechanistic Imprint Clause**, the drought *should* count as an actor: it imposed a *specific spatial constraint* (water scarcity in lowlands vs. highlands) that dictated the *specific trajectory* of the outcome (abandonment of lowland centers). You resist this because you equate "actor" with "determinist cause." However, your 1918 verdict proves you accept that a force can be an *actor* without being *determinist* (since institutions mediated the response). To maintain coherence, you must concede that the Maya climate was an **Actor**, even if it was not the *sole* cause.

  ### Prediction: The 1876–79 El Niño Famine

  **Verdict:** **Background Stressor (The Laki Model).**

  **Reasoning:** This falls under **Clause 1 (Generic Magnitude)**.
  While El Niño is a specific climatic mechanism, its historical effect in this case was primarily a *magnitude shock* (drought/crop failure). The *qualitative form* of the outcome—mass starvation in specific colonies (India, China, Brazil) while grain was exported—bore the imprint of **Colonial Political Economy**, not the mechanics of the Pacific Oscillation.
  *   If El Niño caused a *specific* outcome unique to its mechanics (e.g., globally synchronous collapse that prevented *any* relief due to simultaneous failure everywhere), it might qualify under Clause 2 (similar to 536 CE).
  *   However, given your skepticism of environmental determinism in political/economic history (Black Death, Laki), the principle dictates that the *institutions* that failed to distribute food are the actors. El Niño provided the scarcity; Colonialism provided the famine.

  ### Summary of Coherence

  Your intuitions are coherent if you accept that **Agency $\neq$ Determinism**.
  *   **Black Death/Laki:** Human institutions successfully mediated the shock (renegotiation/revolution). -> **Background.**
  *   **1918 Flu/Tambora (Culture):** The non-human force bypassed or constrained institutional mediation in a specific way (demographics/confinement). -> **Actor.**
  *   **Maya:** Requires you to admit Climate is an **Actor** (specific trajectory) without being a **Determinist Cause** (overdetermined collapse).
  *   **El Niño:** Predicted as **Background**, as the specific form of the tragedy (who starved) was institutional, not climatic.
