  **Gavagai in the Machine: Indeterminacy and Artificial Ontology**

  W.V.O. Quine's thought experiment of the native speaker uttering "gavagai" while a rabbit scurries by is the cornerstone of his thesis on the indeterminacy of translation. Quine argues that because all possible behavioral evidence is compatible with multiple translation manuals—where "gavagai" could mean "rabbit," "rabbit stage," or "undetached rabbit part"—there is no fact of the matter as to which meaning is correct. Meaning, for Quine, is exhausted by stimulus meaning. Recently, however, the emergence of artificial speakers, specifically large language models based on transformer architectures, has complicated this picture. A debate arises: does the lack of internal mental life in an AI make the indeterminacy worse, as my roommate argues, or does the fixed causal history of its training data and architecture make it better, as I contend? While the absence of qualia in AI seems to support the skeptic, this view misunderstands Quine's behaviorist constraints. Ultimately, the indeterminacy of translation is less severe for an artificial speaker than for a human. The structural constraints of the AI's architecture and the inspectability of its weights provide facts of the matter that human biology obscures, effectively collapsing the symmetry Quine relies upon.

  To understand why the AI case differs, we must first recall why the human case is indeterminate. Quine's argument rests on methodological behaviorism. He assumes we cannot access the native speaker's internal mental states to verify reference. We only have their overt behavior: assent, dissent, and utterance conditions. Since a rabbit, a temporal stage of a rabbit, and a spatial part of a rabbit all occupy the same spatiotemporal location during the stimulus, the behavioral evidence underdetermines the translation. Any manual that maps "gavagai" to one of these ontological categories can be adjusted elsewhere in the grammar to remain consistent with all observed behavior. Thus, reference is inscrutable.

  My roommate's position is that applying this to an AI exacerbates the problem. They argue that because a transformer model lacks genuine intentionality or mental states—it is merely predicting tokens based on statistical probabilities—there is nothing to anchor meaning at all. If a human speaker at least *has* a concept of a rabbit in their mind, even if inaccessible, the AI has nothing but math. Therefore, the translation manual is totally unconstrained. This argument, however, leans on a theory of meaning that Quine explicitly rejects. Quine does not require mental states to fix reference; he requires behavioral dispositions. If anything, the lack of mental states makes the AI a *perfect* Quinean subject, purely defined by input-output dispositions. The roommate's objection relies on the idea that meaning needs a "ghost in the machine," but Quine's indeterminacy thesis is dangerous precisely because it claims meaning is unstable even without invoking ghosts. Therefore, the lack of qualia does not inherently worsen indeterminacy; it merely removes a red herring.

  The real reason the indeterminacy thesis holds less water for AI lies in the architectural constraints that do not exist for humans. Quine assumes that the speaker's ontology is flexible enough to accommodate "rabbit stages" or "undetached parts" without behavioral detection. But an artificial speaker is bound by its tokenization and embedding space. Consider a transformer model trained on English text. Its vocabulary is fixed during pre-training. If the token "rabbit" exists as a single unit, but "undetached rabbit part" does not exist as a primitive token and must be composed of multiple tokens, the system treats these concepts differently at the computational level.

  Furthermore, the geometry of the model's embedding space creates a structural fact of the matter. In a human mind, the conceptual distance between "rabbit" and "rabbit part" might be fluid and context-dependent. In an AI, this distance is encoded in static vectors. If we inspect the weights (which we can do for an AI, unlike a human brain), we might find that the vector representation for the utterance condition corresponding to "gavagai" is mathematically closer to the vector for "rabbit" than to "rabbit part." This is not just behavioral evidence; it is structural evidence. Quine's indeterminacy relies on the impossibility of distinguishing between manuals that are empirically equivalent. But if the internal mechanism of the speaker distinguishes between the concepts via attention weights or activation patterns, the manuals are no longer equivalent. One manual will align with the internal topology of the system, and the other will not. The "black box" of the human mind is opaque by biological necessity; the "black box" of the AI is opaque only by proprietary design, not metaphysical necessity.

  Moreover, the user's intuition regarding causal history is correct and crucial. Human stimulus history is ephemeral; neural pathways weaken, memories fade, and context shifts. The AI's "experience" is frozen in its training weights. The causal chain from the training data to the output is deterministic (ignoring minor sampling temperature variations). If the model was trained on a corpus where "gavagai" (or its equivalent) consistently co-occurred with whole objects rather than parts, that statistical regularity is hard-coded. For a human, we cannot verify if their past usage was consistent enough to rule out "rabbit part." For the AI, we can theoretically audit the entire training set and the resulting gradient updates. The causal history doesn't just influence the output; it fixes the function. This provides a "fact of the matter" about reference that is grounded in the physical history of the system's construction, satisfying a causal theory of reference that Quine's behaviorism typically sidelines.

  There is a counter-argument that the weights themselves are just more behavior, and thus subject to the same indeterminacy. However, this ignores the granularity of the evidence. Quine's argument works because behavioral evidence is coarse-grained (assent/dissent). Internal structural evidence is fine-grained. If the system literally cannot process "undetached rabbit part" without a specific compositional operation that it fails to perform, then it is not just that we don't know what it means; it is that the system lacks the capacity to mean the alternative. The indeterminacy requires that both meanings be live options for the speaker. In an AI with fixed vocabulary and architecture, many ontological options are dead ends by design.

  Therefore, while the artificial speaker lacks the mental life of a human, this absence does not deepen the indeterminacy of translation. Instead, the artificial speaker's lack of biological opacity and its rigid architectural constraints reduce the scope for indeterminacy. Quine's thesis thrives on the flexibility of human ontology and the inaccessibility of human neural states. The AI possesses neither. Its ontology is constrained by its tokenization, and its states are accessible via its weights. Consequently, the translation manual for an AI is more constrained than for a human. There is more of a "fact of the matter" because the system itself is a fact of matter, structured in a way that privileges certain mappings over others. We should not view the AI as a mindless void that makes meaning impossible, but as a crystallized linguistic structure that makes meaning more rigid. In the case of the artificial gavagai, the rabbit is not inscrutable; it is simply encoded.
