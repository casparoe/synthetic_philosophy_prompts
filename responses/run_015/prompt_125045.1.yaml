      *   *Brexit Context:* The 2016 referendum was advisory, not binding (legally), but treated as binding (politically). The tension between Parliamentary Sovereignty (UK constitution) and Popular Sovereignty (the referendum).
      *   *The "Will":* Was it discovered? No, it was constructed. 52% is not "the people." It's a majority of those who voted.
      *   *The Critique:* If "the people" is *only* performative, how do we account for the material reality of the 48%? Does the performance fail if the audience doesn't buy it?

  3.  **Drafting the Analysis - Section by Section:**

