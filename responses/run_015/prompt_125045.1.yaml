answer: |-
  This is a potent theoretical hook. Framing "the will of the people" not as a discovered fact but as a **performative speech act** cuts through the usual legalistic debates about whether the referendum was advisory or binding. It shifts the focus from *accuracy* (did this represent the population?) to *efficacy* (did this rhetoric successfully construct a political reality?).

  In political theory, this echoes Ernesto Laclau's work on populism (the "people" as an empty signifier) and J.L. Austin's concept of performativity (words that *do* things). But applying it specifically to the mechanics of Brexit reveals where the magic works and where the illusion shatters.

  Here is an analysis of the Brexit episode through the lens of **Performative Sovereignty**.

  ---

  ### I. The Mapping: Players, Options, and Speech Acts

  To see performative sovereignty in action, we have to look at how different actors used the phrase "the will of the people" not to describe a consensus, but to seize the authority to speak.

  #### 1. The Leave Campaigners (Vote Leave / Brexit Party)
  *   **The Move:** The initial performative utterance.
  *   **The Rhetoric:** "Take Back Control."
  *   **The Function:** **Constitutive.** Before the vote, "the people" was a fragmented electorate. The campaign rhetoric aggregated disparate grievances (austerity, immigration, deindustrialization) into a single subject: *The Sovereign People who want out.*
  *   **The Reality:** There was no single "Leave" position. Some wanted a Norway-style deal; others wanted WTO terms. The rhetoric papered over this by treating the vote as a binary instruction rather than a preference.
  *   **Performative Effect:** When Cameron resigned, the rhetoric successfully transferred authority from the Prime Minister (chosen by Parliament) to the "People" (invoked by the campaigners).

  #### 2. The Executive (Theresa May's Government)
  *   **The Move:** Monopolizing the interpretation.
  *   **The Rhetoric:** "Brexit means Brexit."
  *   **The Function:** **Exclusionary.** May used "the will of the people" to shut down debate on *what kind* of Brexit. By claiming to be the sole vessel of the People's Will, she rendered alternative options (Soft Brexit, Customs Union) as illegitimate.
  *   **The Reality:** Parliament was deeply divided. There was no majority for any specific option.
  *   **Performative Effect:** It turned a negotiating position into a moral imperative. To question the White Paper was to question the People.

  #### 3. The Courts (*R (Miller) v Secretary of State*, 2016)
  *   **The Move:** The legal interruption.
  *   **The Rhetoric:** Parliamentary Sovereignty (Legal) vs. Popular Sovereignty (Political).
  *   **The Function:** **Descriptive (Legal) vs. Performative (Political).** The High Court ruled that the "will of the people" expressed in a referendum had no legal force to trigger Article 50 without Parliament. Legally, this was a description of the UK constitution. Politically, it was treated as an attack on the People.
  *   **The Reality:** The referendum was advisory under the 2015 Act.
  *   **Performative Effect:** The backlash was the clearest proof of your theory. The *Daily Mail* headline **"ENEMIES OF THE PEOPLE"** wasn't describing the judges; it was *trying* to strip them of legitimacy. It was a counter-performative act attempting to re-establish the People as the ultimate sovereign over the Law.

  #### 4. The EU Negotiators (Barnier / Task Force Europe)
  *   **The Move:** Treating the State as the Subject.
  *   **The Rhetoric:** "The UK is leaving."
  *   **The Function:** **Stabilizing.** The EU refused to engage with the internal performative struggle. They treated the UK Government as the legitimate voice of the UK, regardless of parliamentary deadlock.
  *   **The Reality:** The UK government often couldn't deliver what it promised because Parliament wouldn't pass it.
  *   **Performative Effect:** This external validation strengthened the UK Executive's claim internally. "Brussels recognizes us as the sovereign voice," May could argue, "so why don't you?"

  ---

  ### II. The Function: Describing or Doing?

  Through this lens, "the will of the people" rarely functioned as a **description**. If it were descriptive, it would have had to account for:
  1.  The 48% who voted Remain.
  2.  The majority of voters who wanted a Soft Brexit (according to most polls).
  3.  The majorities in Scotland and Northern Ireland who voted Remain.

  Instead, the phrase functioned as an **imperative**.
  *   **It silenced:** "We must respect the result" meant "We must stop arguing."
  *   **It unified:** It turned a 52% majority of voters (approx. 37% of the eligible population) into 100% of "The People."
  *   **It authorized:** It allowed the Executive to bypass normal scrutiny. "Why are you delaying this?" became "Why are you delaying the People's Will?"

  The rhetoric didn't reflect the democratic landscape; it tried to flatten it.

  ---

  ### III. Where the Framework Breaks

  This is the critical part for your long-read. Performative sovereignty is a powerful explanatory tool, but Brexit exposed its structural weaknesses. If "the people" is called into being by speech, that speech can fail, fracture, or be outperformed.

  #### 1. The Problem of the 48% (The Failed Interpellation)
  For performative sovereignty to work, the subject must recognize themselves in the call. "The People" worked on the Leavers. It failed on the Remainers.
  *   **The Break:** As the process dragged on, the 48% stopped accepting the label "losers" and adopted their own performative identity: "The Majority" (combining Remain voters + Soft Leave voters).
  *   **The Consequence:** This led to the "People's Vote" movement. Note the rhetoric: they didn't say "Let's ignore the people." They said, "Let's ask the people *again*." They hijacked the performative tool. This suggests "the people" isn't just one speech act; it's a battlefield of competing speech acts.

  #### 2. The Regional Fracture (Scotland and Northern Ireland)
  Performative sovereignty assumes a singular "People." The UK is a union of nations.
  *   **The Break:** The Scottish Parliament claimed *they* represented the will of *their* people.
  *   **The Consequence:** "The Will of the People" (UK-wide) clashed with "The Will of the People" (Scottish). The rhetoric couldn't resolve this. It exposed that "the people" is geographically contingent. The performative act of "Brexit" inadvertently performed "Scottish Independence" into being as a counter-sovereignty.

  #### 3. The *Miller* Judgment and Parliamentary Deadlock
  The theory suggests rhetoric creates reality. But material institutions push back.
  *   **The Break:** The High Court in *Miller* essentially said, "Your speech act has no legal performative power." Only Parliament could trigger Article 50.
  *   **The Consequence:** This forced the Leave campaigners to target Parliament. When Parliament blocked the "Clean Break," the rhetoric shifted to accuse Parliament of "betrayal."
  *   **The Limit:** You can perform "the people" all you want, but if the machinery of state (Parliament) refuses to ratify the performance, you get deadlock (2017–2019). The rhetoric created a mandate that the legislature could not fulfill. This suggests performative sovereignty is weak without **institutional capture**.

  #### 4. The "Clean Break" Framing vs. Reality
  The rhetoric promised a specific outcome (sovereignty, control, money for the NHS).
  *   **The Break:** When the Withdrawal Agreement arrived, it was nothing like the campaign promises.
  *   **The Consequence:** The performative spell broke for some (Rees-Mogg complaining about the "vassal state"), but held for others (Johnson's "Get Brexit Done").
  *   **The Limit:** This shows that performative sovereignty has a shelf life. It relies on future-tense promise ("We will..."). Once the present-tense reality arrives and disappoints, the "people" constructed by the rhetoric begins to dissolve or radicalize.

  ---

  ### IV. The Hard Question: Does Populism Need a Pre-Existing "People"?

  This is where your concept needs to be sharpest. If "the people" is purely performative, created out of thin air by rhetoric, why did *this* rhetoric work in 2016 and not in 2014?

  **The Verdict:** The framework holds, but only if you admit that performance requires **raw material**.

  1.  **Affective Resonance:** You cannot perform a people around an issue nobody cares about. The "Leave" rhetoric worked because it plugged into pre-existing affects: loss of status, anxiety over immigration, distrust of elites. The rhetoric didn't create the grievance; it **crystallized** it.
  2.  **The "Empty Signifier":** Laclau argues "the people" is empty. Brexit proves it must be *fillable*. If the signifier is too empty (vague promises), it wins the vote but fails to govern (May's deadlock). If it is too full (specific promises like the £350m NHS bus), it becomes vulnerable to fact-checking. Johnson succeeded where May failed by emptying the signifier again ("Get Brexit Done" meant nothing specific, so everyone could project their wish onto it).
  3.  **The Pre-Existing Institutional Reality:** Populism claims to speak for the people *against* the institutions. But to succeed, it must eventually *become* the institution. Brexit showed that you can perform sovereignty against Parliament for a while, but eventually, you have to pass a bill.
      *   **Correction to your theory:** It's not that populism needs a pre-existing *people*; it needs pre-existing **cleavages**. The "people" is constructed, but the fault lines (North/South, City/Town, Graduates/Non-Graduates) are material. The rhetoric rides the fault line; it doesn't dig it.

  ### V. Conclusion for the Long-Read

  "Performative Sovereignty" earns its keep because it explains why facts didn't matter. If the "will of the people" is a discovered object, economic forecasts should have changed minds. If it is a **performative identity**, economic forecasts are attacks on that identity, causing people to double down.

  However, the Brexit episode suggests a crucial amendment to the theory: **Performative Sovereignty is unstable without institutional reinforcement.**

  The rhetoric successfully called "the people" into being in June 2016. But because that "people" was a fiction (masking the 48%, the regional splits, and the policy contradictions), the state machinery jammed. The deadlock of 2017–2019 was the sound of a performative fiction grinding against a parliamentary reality.

  Johnson's 2019 victory didn't prove the "will of the people" was real; it proved he had finally found a way to align the performative rhetoric ("Get Brexit Done") with a parliamentary majority (by purging the rebels and exploiting the FPTP system).

  **The Takeaway:** "The People" is not a noun; it is a verb. But like any verb, it requires a subject and an object to function. In Brexit, the subject was fragmented, and the object (the EU relationship) was complex. The rhetoric tried to force a singular subject onto a fragmented reality. It worked politically, but it broke the constitution in the process.

  For your desk, the angle is this: **Democracy relies on the fiction that "the people" exist. Brexit showed what happens when politicians try to make that fiction literally true.**
