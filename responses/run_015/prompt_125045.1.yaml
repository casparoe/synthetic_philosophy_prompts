          *   Map the actual players (Leave campaigners, Parliament, Courts/Miller, EU).
          *   Map the real options (mandate vs. sovereignty vs. clean break).
          *   Analyze the function of "the will of the people" at each stage (descriptive vs. performative).
          *   Critique the framework: Where does it break? (48%, regional splits, *Miller*, deadlock).
          *   Address the tension: Does populism need a *pre-existing* people more than the theory admits?
          *   Tone: Analytical, nuanced, avoiding standard "populism is dangerous" tropes, suitable for a science-and-ideas desk long-read.

  2.  **Initial Brainstorming & Theoretical Grounding:**
