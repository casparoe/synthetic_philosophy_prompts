      *   **Complications:**
          1.  Replica interpolates (hallucinates in character).
          2.  Weights retain residue of data even after source destruction (shared model folding).
          3.  Under Option A, humans rarely read the archive; the bot uses it as a lookup table.
      *   **Task:** Write a dialogue between two philosophers.
          *   Character 1: Defends duty to remember (Avishai Margalit style).
          *   Character 2: Defends deliberate forgetting (David Rieff style).
      *   **Constraints:**
          *   Competent arguments, no strawmen.
