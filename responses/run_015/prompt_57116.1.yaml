  6.  **Refining the Dialogue (Self-Correction during drafting):**
      *   *Check Word Count:* Need to ensure it's dense enough to hit ~1500.
      *   *Check Tone:* Keep it professional but heated. No academic jargon like "phenomenology" without explanation.
