      *   *Specific Constraint 3 (Archive Usage):* If no one reads the archive, is it memory or just storage? Sarah needs to handle this passivity.

  5.  **Drafting - Step-by-Step:**

      *   *Intro:* Establish the room. Whiteboard with Option A/B.
