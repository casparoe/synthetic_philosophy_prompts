  4.  **Developing the Arguments (Mental Check):**
      *   *Margalit:* Ethics of Memory. Thick vs. Thin relations. We owe it to the dead to keep them as they were. Erasure is betrayal.
      *   *Rieff:* In Praise of Forgetting. Memory is often weaponized. Grief needs to end. Preserving everything prevents mourning.
