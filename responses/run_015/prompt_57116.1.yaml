  2.  **Character Conception:**
      *   **Margalit-type (Let's call her "Sarah"):** Focuses on ethics of memory, thick relationships, the duty not to betray the dead by erasing them. Memory is constitutive of identity.
      *   **Rieff-type (Let's call him "David"):** Focuses on the burden of memory, the danger of idolatry, the necessity of forgetting for healing and moving on. Skeptical of "official" or preserved memory becoming fake.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Design review room. Tension.
      *   **Round 1: The Core Conflict.** Sarah argues for Option A (Archive). David argues for Option B (Forgetting).
