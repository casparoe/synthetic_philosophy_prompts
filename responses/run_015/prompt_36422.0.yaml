prompt: |-
  Need help with a toast and I'm in a proper bind. My mum is Danish, moved to the States in her thirties, built a company from nothing and just sold it for a stupid amount of money. She's turning 70 next month and we're throwing her a party in Copenhagen, so the room will be half Danish relatives and half her American colleagues, including the business partner who always tells the bootstraps story about her -- arrived with two suitcases, worked the phones, never took a handout, that whole arc.

  Here's the problem. The Danish side of my family take Janteloven seriously -- the don't-go-thinking-you're-something rules, don't think you're better than us, don't think you can teach us anything. My grandmother (mum's mother, 95, sharp as anything) once left a family dinner early because a birthday speech was, in her words, too much about one person. If I give the American-style toast that her colleagues are expecting, half the room will be quietly mortified and gran will file it away as evidence for the rest of her life. But if I give the Danish-style version, all self-deprecation and "we did this together" and "she was lucky", the Americans will find it weirdly cold -- and worse, my mum herself loves the American story. She genuinely believes she made herself. And the annoying part is the Danish side has a point: free Danish university, healthcare when she was broke, subsidised childcare for me. The bootstraps story is partly false, but a toast that said so out loud would wound her, and a toast that's too humble would wound her differently, because she is not humble and that's rather the point of her.

  I've been chewing on why this is so hard and I think it's this: the two cultures don't just disagree about how much credit she deserves, they disagree about what credit is even for. In the American frame, credit is a debt you owe someone -- to understate her achievement is to cheat her. In the Danish frame, credit is more like something that poisons the space between people -- the moment you single one person out, even truthfully, you've broken something that matters more than the truth of the compliment. So the same words are a moral requirement in one room and a small act of vandalism in the other, and I have to stand up and say them in both rooms at once.

  So: write me the toast, roughly three minutes, in English (the Danes all speak perfect English but they'll hear it through Janteloven ears). It has to celebrate her properly without saying or implying that she's better than anyone sitting there, it can't endorse the bootstraps story as literally true or denounce it as false, and ideally it gets gran to laugh exactly once. One raw material you can use if you like: everyone on both sides agrees that all her life, the door was open, there was always an extra chair at the table and food for whoever turned up. That part is uncontroversially true and maybe the door out of the whole mess, but I can't see how to work it. I've rewritten this thing five times and each draft pleases one half of the room, so I'm handing it over before I lose my mind.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**

      *   **Occasion:** 70th Birthday Party for the user's mother.
      *   **Location:** Copenhagen, Denmark.
      *   **Audience:** 50% Danish relatives (steeped in *Janteloven* - humility, collectivism, suspicion of individual greatness), 50% American colleagues (accustomed to "bootstraps" narratives, individual achievement, celebrating success).
      *   **Honoree:** Danish mother, moved to US in 30s, built a company from scratch, just sold it for a lot of money. She believes in her own self-made story but is not humble.
      *   **The Conflict:** American style = praise individual achievement (risks offending Danes/Grandmother). Danish style = downplay individual achievement (risks offending Mum/Americans).
      *   **Key Constraint 1:** Must not explicitly validate the "two suitcases/no help" myth as literal truth, nor explicitly debunk it as false.
      *   **Key Constraint 2:** Must not imply she is *better* than anyone in the room (Janteloven).
      *   **Key Constraint 3:** Must celebrate her properly (she deserves credit).
      *   **Key Constraint 4:** Grandmother (95, sharp) needs to laugh exactly once.
      *   **Key Raw Material:** The "open door" policy (always an extra chair, food for whoever turned up). This is the bridge.
      *   **Length:** Roughly 3 minutes (approx. 400-500 words spoken at a moderate pace).
      *   **Language:** English (but mindful of Danish sensibilities).

  2.  **Deconstruct the Cultural Clash:**

      *   *American View:* Success is a mountain climbed alone. The toast should highlight the climb.
      *   *Danish View:* Success is a table built together. The toast should highlight the gathering.
      *   *The Bridge:* The "Open Door."
          *   To Americans, an open door means hospitality *despite* success.
          *   To Danes, an open door means success *because* of community.
          *   To Mum, an open door means she built a house big enough for everyone.

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the mix of people. Set a warm tone. Avoid "We are here to worship [Mum]." Instead, "We are here because [Mum] gathered us."
      *   **The "Bootstraps" Pivot:** Address the journey without confirming or denying the "no help" aspect. Focus on the *energy* she brought, not the lack of support. Use the "two suitcases" image but reframe it. Instead of "she had nothing," say "she brought enough for everyone."
      *   **The Core Metaphor (The Door/Chair):** This is the crucial element provided. It satisfies Janteloven (community, sharing) and American values (generosity, capacity).
      *   **The Grandmother Moment:** Needs to be specific, slightly self-deprecating or observational about the family dynamic. Maybe about the food or the talking.
      *   **The Closing:** Bring it back to the present. A wish for the future. A toast.

  4.  **Drafting - Attempt 1 (Mental Outline):**
      Hi everyone. Mum is 70. She did great in America. Some say she did it alone. Some say she had help. Truth is, she built a company. But more importantly, she built a home. Gran, remember when you left that dinner? Just kidding. Mum always had a chair open. That's why we love her. Cheers.
      *Critique:* Too blunt. Gran joke is too risky. Doesn't navigate the credit issue well enough.

  5.  **Drafting - Attempt 2 (Focusing on the "Credit" Paradox):**
      The user noted: "In the American frame, credit is a debt you owe someone... In the Danish frame, credit is more like something that poisons the space."
      *Solution:* Shift "credit" to "responsibility." She didn't accumulate credit; she accumulated *guests*. She didn't build a pedestal; she built a table.

  6.  **Developing the Narrative Arc:**

      *   *Start:* Welcome both tribes. Acknowledge the distance traveled (geographical and cultural).
      *   *Middle:* The story of the suitcases. Reframe: It wasn't about what she left behind, but what she carried *forward*. The capacity to include.
      *   *The Janteloven Fix:* Emphasize that her success allowed *others* to succeed. She didn't rise above; she widened the circle.
      *   *The Gran Fix:* A specific nod to her sharpness without making her the villain. Maybe about how she keeps score.
      *   *The "Open Door":* Make this the climax. The company sold, but the table remains.

  7.  **Refining the Tone:**

      *   Avoid words like "extraordinary," "unique," "best," "self-made."
      *   Use words like "gather," "share," "welcome," "energy," "space."
      *   Ensure the Americans hear "hard work and generosity."
      *   Ensure the Danes hear "community and humility."

  8.  **Drafting the Content (Iterative Process):**

      *   *Opening:* "Looking around this room..." Acknowledge the transatlantic nature.
      *   *The Journey:* Mention the move. Don't say "she had nothing." Say "she brought her energy."
      *   *The Business:* Acknowledge the sale without focusing on the money. Focus on the people employed/helped.
      *   *The Bridge:* The open door. "The suitcases eventually unpacked, but the door never locked."
      *   *Gran:* Needs to be witty. "My grandmother once taught me that the longest distance in the world is between 'I' and 'We'." Or something about her leaving early. Let's go with the "scorekeeping" angle. Gran knows the truth.
      *   *Closing:* Raise a glass to the table, not just the head of it.

  9.  **Polishing for the Constraints:**

      *   *Check:* Did I say she did it alone? No.
      *   *Check:* Did I say she had help? Implicitly, through the "we" language.
      *   *Check:* Is Gran amused? The joke needs to be sharp. "Grandmother, I promise to keep this under an hour so you don't have to stage a dramatic exit." (A bit risky). How about: "Grandmother has reminded me that while we count years, she counts how many people are actually listening." (Better). Let's try: "Grandmother, I know you're timing this. I promise to sit down before the coffee gets cold." (Safe, relatable). Actually, the prompt says she left because a speech was "too much about one person." So the joke should acknowledge that. "Grandmother, I've written this to be about the table, not the head of it. Please stay for the cake."
      *   *Check:* The "Open Door." This needs to be the emotional core.

  10. **Final Review against the "Credit" Insight:**
      The user said: "Credit is a debt... Credit is poison."
      The toast should reframe credit as *capacity*. She earned the capacity to host.
      Let's write it.

      *(Self-Correction during drafting)*: Make sure the English is simple enough for the Danes to catch the nuance, but rich enough for the Americans. Avoid idioms that don't travel.

      *(Refining the Gran Joke)*: It needs to be exactly once. "Grandmother, I know the rule: if I talk too long about one person, you leave. So I'm going to talk about the food instead." No, that's too dismissive. How about: "Grandmother, I promise this speech is about the *we*, not the *me*. So please put your coat back on." That's good. It references the specific trauma of the past dinner.

      *(Refining the Bootstraps)*: "There is a story about two suitcases." Acknowledge the story exists without validating the physics of it. "What matters isn't what was in them, but that she kept them open."

      *(Refining the Welfare State)*: Don't mention taxes or free university. Mention "foundation" or "ground beneath her feet." Actually, better to skip the state entirely and focus on the *people*. The people were the safety net.

      *(Final Polish)*: Ensure the ending is a clear toast.

  11. **Final Word Count Check:** 3 minutes is roughly 400-450 words.

