answer: |-
  Good evening. For those who don't know me, I'm [Your Name].

  Looking around this room, I see a map of my mother's life. Half of you are from the place she started, and half are from the place she built. Two different cultures, two different languages, but tonight, one table.

  There is a story my mother's colleagues tell. It's about two suitcases, a phone, and a sheer force of will. It's a story about standing alone. And there is another story, the one my Danish family tells. It's about luck, timing, and the community that holds you up. It's a story about never standing alone.

  Usually, stories like that contradict each other. But with Mum, they don't. Because the thing she built wasn't just a company, and it wasn't just a life. It was a house. And the most important thing about that house wasn't the walls or the view. It was that the door was never locked.

  We know this. Whether you worked with her in the States or grew up with her in Denmark, you know the rule: there is always an extra chair. There is always food. If you showed up, you were fed. If you had a problem, you were heard.

  Mum, you didn't just open doors for yourself. You held them open for us.

  Now, I know my audience. I know that in America, success is something you claim. And I know that here in Denmark, success is something you survive. So I have to be careful.

  Grandmother, I know the house rule: if a speech becomes too much about one person, you are allowed to leave early. So I promise you, I am talking about the table, not the head of it. Please, keep your coat on.

  Because that is the truth of the last seventy years. It isn't that Mum climbed a mountain alone. It's that she carried the mountain on her back so others could climb it with her. She took the energy she had—the drive, the stubbornness, the loudness—and she used it to make space.

  The company has been sold. The suits are gone. But the table remains. And that is the only legacy that matters.

  So, to Mum. Not for the suitcases she carried, but for the chairs she filled. Not for the distance she traveled, but for the people she brought with her.

  Skål. Cheers.
