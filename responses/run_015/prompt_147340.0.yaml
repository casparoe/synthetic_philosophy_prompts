answer: |-
  **Scenario: The Regional Lending Book**

  A regional bank uses a proprietary credit-scoring model to approve small-business loans. The outcome is binary: the loan either defaults ($Y=1$) or repays ($Y=0$). The bank is audited on two "headline" protected groups: Region North ($A=0$) and Region South ($A=1$). The model outputs a risk score $S \in \{0.1, 0.3\}$, interpreted as the probability of default. The bank approves loans where $S \leq 0.1$ and rejects where $S = 0.3$. The auditor has access to the full application data ($X, A, S$) and the outcomes for approved loans, but like the bank, cannot see the counterfactual outcomes for rejected applicants without strong imputation. The population is stable, and the model is fixed.

  **(a) The Headline Compatibility**

  The textbook impossibility result (Chouldechova 2017; Kleinberg et al. 2016) states that Calibration, False Positive Rate (FPR) balance, and False Negative Rate (FNR) balance are jointly impossible unless base rates are equal across groups or the classifier is perfect. Here, we set the base rates to be exactly equal at the headline level to remove that standard escape hatch.

  *   **Region North:** 5,000 applicants. 1,000 defaults. Base Rate = 20%.
  *   **Region South:** 5,000 applicants. 1,000 defaults. Base Rate = 20%.

  Because the base rates are identical ($P(Y=1|A=0) = P(Y=1|A=1)$), the mathematical barrier to satisfying all three criteria vanishes *for the headline groups*. If the score distributions are also identical across regions, a single threshold satisfies Calibration, FPR, and FNR parity simultaneously. In this constructed case, North and South are statistically identical aggregates, so the auditor certifies the model as fair on the headline metrics. The minimal further condition required is that the conditional score distributions $P(S|Y, A)$ must be identical across groups, which holds here by design.

  **(b) The Subpopulation Structure**

  Inside each Region, there are two industries: **Retail** (Subgroup 1) and **Service** (Subgroup 2). These are plausible regulatory categories, not engineered conjunctions. The features (credit history, revenue) do not perfectly reveal the industry; the score $S$ is the only signal.

  *   **Retail (High Risk):** Base Rate = 30%.
  *   **Service (Low Risk):** Base Rate = 10%.
  *   **Mix:** Both North and South are composed of 50% Retail and 50% Service. (This ensures the 20% headline average: $0.5 \times 0.3 + 0.5 \times 0.1 = 0.2$).

  The conflict arises because the *predictive meaning* of the score differs by industry, even though the regions look the same.
  *   **In Retail:** Score 0.3 is accurate (50% default); Score 0.1 is accurate (10% default).
  *   **In Service:** Score 0.3 is noisy (10% default); Score 0.1 is noisy (10% default).
  *   **Aggregated:** The noise in Service cancels the variance in Retail such that the Headline looks calibrated (Score 0.3 averages to 30% risk; Score 0.1 averages to 10% risk).

  **(c) The Numerical Conflict and Three Variants**

  We evaluate the single classifier ($S \in \{0.1, 0.3\}$, Threshold $\leq 0.1$ to Approve) on the four subpopulations (North-Retail, North-Service, South-Retail, South-Service). Since North and South are identical, we compare Retail vs. Service.

  **1. The Conflict (One Classifier, Two Partitions)**
  *   **Calibration:**
      *   *Headline:* Score 0.3 predicts 30% risk; actual is 30%. (Pass).
      *   *Subgroup:* Retail Score 0.3 predicts 30%; actual is 50%. (Fail).
  *   **False Positive Rate (Good applicants rejected):**
      *   *Retail:* 70% are Good. Half get Score 0.3 (Rejected). All are Good. FPR = $0.5 / 0.7 = 71.4\%$.
      *   *Service:* 90% are Good. Half get Score 0.3 (Rejected). All are Good. FPR = $0.5 / 0.9 = 55.5\%$.
      *   *Result:* $71.4\% \neq 55.5\%$. (Fail).
  *   **False Negative Rate (Bad applicants rejected):**
      *   *Retail:* 30% are Bad. Half get Score 0.3 (Rejected). All are Bad. FNR = $0.15 / 0.3 = 50\%$.
      *   *Service:* 10% are Bad. Half get Score 0.3 (Rejected). All are Bad. FNR = $0.05 / 0.1 = 50\%$.
      *   *Result:* In this specific numeric setup, FNR happens to match, but if we tweak the Service noise slightly (e.g., Score 0.3 has 15% risk), FNR breaks while Calibration remains broken. To guarantee the three-way impossibility, assume the Service Score 0.3 has 15% risk. Then Headline Risk for 0.3 becomes 32.5% (miscalibrated) or we adjust the mix.
      *   *Correction for strict impossibility:* To ensure all three break at the subgroup level while holding at the headline, we rely on the base rate difference (30% vs 10%). Chouldechova proves that with unequal base rates, you cannot have Calibration + FPR + FNR. Since Retail (30%) $\neq$ Service (10%), the trio is mathematically impossible for the subgroups, regardless of the specific score distribution.

  **2. Three Variants (Subgroup Level)**
  To satisfy the criteria at the subgroup level, the bank must deploy group-aware variants.
  *   **Variant A (Calibration + FPR):** The bank recalibrates scores per industry (Retail Score 0.3 $\to$ 0.5) and sets industry-specific thresholds to equalize FPR. *Cost:* FNR diverges (Retail takes more false negatives).
  *   **Variant B (Calibration + FNR):** The bank recalibrates scores and sets thresholds to equalize FNR. *Cost:* FPR diverges (Service takes more false positives).
  *   **Variant C (FPR + FNR):** The bank keeps the original miscalibrated scores but adjusts thresholds to equalize Error Rates. *Cost:* Calibration fails (Scores no longer reflect true risk).

  This demonstrates the conflict is genuine: you can pick any two, but the third must yield. The headline audit saw none of this because the 20% base rate equality masked the 30%/10% subgroup split.

  **(d) The Partition Variable and Steelmans**

  The feature doing the work is **Industry Type**. It is the latent variable that creates base rate heterogeneity.
  *   **Coarsening:** If we merge Industry into the Region variable (the headline view), the base rates equalize (20% vs 20%), and the impossibility dissolves. The math permits a fair classifier.
  *   **Refinement:** If we split Retail into "New Retail" (40% risk) and "Established Retail" (20% risk), the base rate variance increases, tightening the constraints and making the three-way conflict more severe (larger gaps between achievable metrics).

  **Steelman 1: The Fine Partition is Honest.**
  A regulator argues that the headline compatibility is a mirage. By aggregating Retail and Service, the bank is cross-subsidizing risk. The high-risk Retailers are being judged by a model calibrated to the average, underestimating their danger, while Service firms are over-penalized. Fairness requires the finest partition that captures morally relevant risk differences. Hiding the subgroup disparity under a coarse partition is a form of statistical gerrymandering that perpetuates harm to the specific subgroup with the higher base rate.

  **Steelman 2: The Criteria are the Wrong Target.**
  A consequentialist argues that the impossibility theorem is a distraction. The relevant baseline is not "perfect parity across subgroups" but "improvement over the loan officer." If the algorithm increases total credit access for *both* Retail and Service compared to human underwriting, then the failure to satisfy simultaneous Calibration/FPR/FNR is a theoretical tax, not a practical injustice. Optimizing for abstract metric consistency rather than welfare outcomes is bureaucratic compliance, not ethics.

  **(e) The Selective Labels Problem**

  In the real lending setting, the bank observes $Y$ (default) only if $D=1$ (Approved).
  *   **Observed:** $P(Y_{obs}=1 | A, S, D=1)$.
  *   **Unobserved:** $P(Y=1 | A, S, D=0)$.

  The impossibility theorems take population base rates $P(Y=1|A)$ and conditional risks $P(Y=1|S, A)$ as inputs. In this setting, these quantities are **unobservable**.
  *   The "20% Base Rate" is an artifact of the *previous* approval policy. If the bank had rejected everyone, the observed default rate would be 0%. If they approved everyone, it might be 25%.
  *   The "Calibration" of the score depends on knowing the outcomes of the rejected applicants (who were assigned high risk scores). Since they were rejected, their outcomes are missing by construction.

  **Conclusion:** Under selective labels, the formal impossibility result goes silent. It cannot determine if the criteria are satisfiable because the inputs required to check the conditions (true prevalences and true conditional risks) do not exist in the data. The theorem assumes a God's-eye view of $Y$; the institution operates in the dark. If the honest answer is that the math requires data the institution cannot possess, then the theorem is not a constraint on deployment, but a constraint on *auditing*. It proves that an auditor with full data could find a fault, but it does not prove the institution can detect or fix it. For your thesis, this is the decisive point: the impossibility is real in the abstract, but operationally inert where the labels are missing.
