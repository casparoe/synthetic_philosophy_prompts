answer: |-
  Here are the desiderata for a theory of shared intention built for accountability in fluid, hierarchical, and automated systems. I have sorted them by the case that motivates them, followed by the verdict on whether the requirement is non-negotiable for your purposes or merely a philosophical prejudice.

  ### The Desiderata List

  **1. The Asynchronous Continuity Requirement**
  *   **The Case:** *The Relay Crew.* Five people, rotating shifts, never co-present, minimal knowledge of each other's specific actions.
  *   **The Requirement:** The theory must allow a shared intention to persist through temporal gaps where no participants are concurrently active or aware of each other's current state. It must explain how the intention survives the "handoff" without a fresh agreement every time.
  *   **Status:** **Non-Negotiable.** If the theory requires concurrent common knowledge, it cannot describe the relay. For accountability, we need to know if the person on Shift 3 is liable for the failure on Shift 5. If the intention dissolves when Shift 3 sleeps, the chain of responsibility breaks.

  **2. The Normative Glue Requirement**
  *   **The Case:** *The Infiltrator.* She meshes subplans perfectly but secretly hopes for failure.
  *   **The Requirement:** The theory must distinguish between *functional coordination* (our actions fit) and *normative commitment* (I am bound to you). It must explain why the infiltrator is not "on the hook" for the group's failure in the same way a loyal member is, despite her causal contribution.
  *   **Status:** **Non-Negotiable.** This is the core of your use case (blame/apology). A theory that counts the infiltrator as a full member fails to track moral debt. It must locate the "owe-me-a-say" constraint in the intention itself, not just the outcome.

  **3. The Exit Condition Requirement**
  *   **The Case:** *The Checked-out Member.* He does the work but stops caring.
  *   **The Requirement:** The theory must specify whether membership is lost by internal attitude change (stopping caring) or only by external action (quitting), and whether quitting requires uptake from the group.
  *   **Status:** **Non-Negotiable.** In fluid projects, people drift. If the theory says he is still a member because he didn't announce exit, you cannot hold him morally accountable (he checked out). If it says he left the moment he stopped caring, the group loses stability. You need a clear threshold for when the debt of consultation ends.

  **4. The Proxy/Tool Distinction Requirement**
  *   **The Case:** *The Stand-in.* Software or an animal fills a role reliably without intentions.
  *   **The Requirement:** The theory must categorize non-agents as *tools* rather than *members*, and locate the intention in the human who deployed them. It must explain that if the tool fails, the debt of apology is owed *by the deployer*, not the tool.
  *   **Status:** **Non-Negotiable (for accountability).** Calling a bot a "member" is a category error that obscures blame. While some camps argue for "extended cognition," for *liability*, you must be able to trace the intention back to a moral agent. Excluding non-agents is not intentionalist prejudice here; it is a prerequisite for blame.

  **5. The Opacity/Nesting Requirement**
  *   **The Case:** *Nested Crews.* A team is a single participant in a larger operation.
  *   **The Requirement:** The theory must allow a group to participate in a joint action *as a group* without requiring every lower-level member to intend the higher-level goal. The "black box" must hold.
  *   **Status:** **Non-Negotiable.** In hierarchies, a junior engineer does not need to intend the CEO's strategic goal to be a member of the engineering team. If the theory requires full transparency of intent up the chain, it cannot model hierarchy.

  ---

  ### Sorting the Philosophical Camp Questions

  Here is how your specific theoretical constraints sort out, given the use case of **accountability in fluid hierarchies**.

  1.  **Low Epistemic Overlap (No full common knowledge):**
      *   **Verdict:** **Non-Negotiable.**
      *   **Reason:** The Relay Crew case kills any theory requiring common knowledge of intentions. You cannot have common knowledge when shifts don't overlap. A usable theory must work with "common belief" or "assumed continuity."

  2.  **Individualism vs. Irreducible Collective State:**
      *   **Verdict:** **Negotiable Preference.**
      *   **Reason:** This is metaphysics, not utility. You can build a theory of accountability out of interlocking "I-intentions" (Bratman) or primitive "We-intentions" (Searle). As long as it delivers the verdict on blame, the underlying ontology doesn't matter. Don't let this stall the project.

  3.  **Binary vs. Graded Membership:**
      *   **Verdict:** **Non-Negotiable (Must be Graded).**
      *   **Reason:** The Checked-out Member and Relay Crew show that membership fades. A binary "in/out" switch cannot capture the diminishing debt of consultation as someone drifts away. You need degrees of membership to match degrees of liability.

  4.  **Coercion (The Junior Person):**
      *   **Verdict:** **Non-Negotiable (Must Exclude Coercion).**
      *   **Reason:** If a junior member "intends that we J" only because refusal means firing, they cannot bear equal blame for the project's moral failures. A theory that counts coerced participation as full shared intention lets the coercer off the hook. For accountability, shared intention requires a threshold of voluntariness.

  5.  **Distinctive Normativity (Owe-me-a-say):**
      *   **Verdict:** **Non-Negotiable.**
      *   **Reason:** This is the definition of your problem. If shared intention is just "I intend X and you intend X," there is no reason I owe you consultation before changing my mind. The theory *must* generate a special obligation that doesn't exist between strangers.

  ---

  ### The Killer Constraint

  **The Requirement that knocks out the most theories:**
  **The Normative Glue (Owe-me-a-say) combined with Low Epistemic Overlap.**

  Most theories generate normativity through *mutual awareness*. (e.g., "I owe you because I know you are relying on me, and you know I know"). The Relay Crew destroys this. They don't know each other. They aren't aware of the reliance in real-time.
  *   **Individualist theories (Bratman):** Fail because they rely on mutual responsiveness and knowledge to generate the obligation. No knowledge, no obligation.
  *   **Collectivist theories (Searle):** Fail because they posit an internal "we-mode" that is hard to sustain without communication.
  *   **Commitment theories (Gilbert):** Succeed best here, but only by positing a "pool of wills" that persists magically across time gaps.

  If you demand the theory explain *why* I owe you consultation when I never met you and only knew you'd exist (Relay), 80% of the literature dissolves.

  ---

  ### The Unsatisfiable Pair

  **Fluid Membership (Relay/Checked-out) vs. Strong Normative Binding (Gilbert-style).**

  I suspect these two cannot be jointly satisfied without contradiction.
  *   **Fluid Membership** requires that people can drift in and out, or cease caring, without breaking the group's continuity. It implies low barriers to exit and entry.
  *   **Strong Normative Binding** implies that once you are in, you are bound to the others such that you cannot unilaterally rescind your commitment (you owe them a say before you quit).

  **The Tension:** If the norm is strong (you can't quit alone), membership isn't fluid (you're stuck until the group releases you). If membership is fluid (you can drift out), the norm is weak (you didn't really owe them anything).
  *   **The Cost:** In modern hierarchical/automated work, we *want* both. We want the stability of the team (binding) but the flexibility of the gig economy (fluid). A theory that gives you full accountability (binding) will likely make it too hard to leave (violating the fluid reality). A theory that fits the fluid reality will likely make it too easy to escape blame (violating the accountability). You may have to choose: is this theory for **stabilizing expectations** or **assigning blame**? It struggles to do both perfectly in these edge cases.

  ---

  ### Three Candidate Shapes

  **(a) Interlocking Individual Plans (The Architect)**
  *   **Shape:** Shared intention is just Person A intending "We J" and Person B intending "We J," where each plan references the other, plus mutual knowledge that this is happening.
  *   **Where it Breaks:** It shatters on the **Relay Crew** (no mutual knowledge possible) and the **Normative Glue**. It explains why we coordinate, but it struggles to explain why I *owe* you an apology if I break the plan. It reduces the obligation to a prediction failure ("I let you down") rather than a normative violation ("I wronged you").

  **(b) Irreducible Collective We-Intend (The Organism)**
  *   **Shape:** There is a primitive mental state, "We intend," that exists in the individual's mind but cannot be analyzed into "I intend." It is a biological or psychological capacity for group-mindedness.
  *   **Where it Breaks:** It shatters on the **Stand-in** and **Nested Crews**. It relies too heavily on internal psychological states. It cannot easily explain how a group acts when some members are "checked out" internally but functioning externally, nor does it handle the delegation to software well (software has no "we-mode"). It is too internal to track external accountability.

  **(c) Joint Commitment (The Contract)**
  *   **Shape:** Shared intention is the creation of a new normative entity. By expressing willingness, we create a "pool of wills." No one can rescind it unilaterally; everyone owes everyone else fidelity to the plan.
  *   **Where it Breaks:** It shatters on **Fluid Membership** and **Coercion**. It is too rigid for the Relay/Checked-out cases. If you need explicit uptake to join and permission to leave, it cannot model the drifting, hierarchical reality where people are added by algorithm or quit by ghosting. It creates strong blame, but it describes a world that doesn't exist anymore.
