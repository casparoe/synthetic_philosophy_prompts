  Judea Pearl and David Lewis are debugging a causal model of a car crash.

  Pearl says, "I'll identify the effect of braking. `do(brake = true)`."
  Lewis says, "Wait. To evaluate 'If he had braked...', I had to insert a miracle to override his panic."
  Pearl says, "So? I'm intervening on the brake node."
  Lewis says, "You can't. The miracle already violated the structural equation at 'panic'. The laws of psychology don't hold there. You're trying to surgically cut an incoming arrow on a node that's currently held together by a local law-violation."
  Pearl stares at his DAG. "So the edge is cut?"
  Lewis says, "Worse. The miracle makes the error term undefined. You're trying to perform surgery on a ghost."
  Pearl shuts his laptop. "Fine. Next time, just tell me how big the miracle is so I know how much confounding to adjust for."

  ***

  **Note on Liberties:**
  The joke exaggerates the incompatibility between the two frameworks. In modern Structural Causal Models (SCM), Pearl actually *does* account for counterfactuals, and Lewis's "miracles" can often be mapped onto specific realizations of exogenous error terms ($U$) without breaking the graph's structural integrity. The joke treats Lewis's miracle as a physical destruction of the mechanism, whereas for Lewis it is a semantic tool for weighting world similarity, and for Pearl, the structural equations usually remain invariant even when evaluating counterfactuals.

  **What Would Change My Mind:**
  If you could demonstrate a formal translation where Lewis's "small miracle" is strictly equivalent to setting a specific value for an exogenous variable ($U = u$) within Pearl's framework without violating the assumption of invariant structural equations. If the miracle doesn't actually break the graph's modularity but simply selects a different baseline world, then the punchline fails because the `do`-operator would still be valid on the modified structural model.
