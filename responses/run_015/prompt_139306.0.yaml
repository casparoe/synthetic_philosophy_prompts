answer: |-
  # Q&A Prep Sheet: "The Utility Monster Is a Unit Convention"

  **Strategy Note:** You are walking into a minefield where two groups speak different languages about the same object. The economists think you're doing normative ethics disguised as measurement; the philosophers think you're doing measurement disguised as normative ethics. Your goal is to show them they are both right, and that this is the solution, not the bug. Do not get dragged into defending a specific normalization (Range vs. Sacrifice) as the *only* right one; defend the claim that *choosing one* is the moral work.

  ### The Objections (In Likely Order)

  **1. The "So What?" (Public Finance)**
  *   **Who:** Senior Optimal Tax Economist.
  *   **Question:** "Let's say I accept your thesis. I'm running a cost-benefit analysis for a transport project. I need a number. You tell me the 'monster' is a unit choice. Fine. Do I change my distributional weights? Do I change my willingness-to-pay aggregation? If your argument doesn't change the tax rate or the shadow price, it's just metaphysics. What is the *identification strategy* here?"
  *   **Your Reply (2 min):** "It changes the justification of the weights, which changes their stability under scrutiny. Currently, you pick weights based on intuition or political constraint. I'm arguing those weights *are* the unit normalization. If you use money-metric utility, you've implicitly chosen a 'unit-of-sacrifice' normalization based on marginal utility of income. My paper doesn't give you a new calculator; it tells you that when you pick the calculator, you are already solving the monster problem. You can't hide behind 'empirical WTP' to avoid the moral choice of scale."
  *   **Soft Spot:** You aren't giving them a new formula. They want a tool; you're giving them a manual.
  *   **Flag:** ⚠️ **CONCEDE IN SETUP.** Acknowledge early that this doesn't mechanically solve optimal tax rates. It clarifies the normative input of the Social Welfare Function. If you promise policy precision now, they will destroy you on the math later.

  **2. The "Operationalization" Trap (Methodologist)**
  *   **Who:** Social Science Methodologist.
  *   **Question:** "You say we fix the scale by normalizing ranges or sacrifices. But to measure someone's 'range' (from a life not worth living to their best life), don't you already need a cardinal, interpersonally comparable measure of utility? Aren't you presupposing the very thing you claim is conventional? It sounds like you're solving the measurement problem by stipulating the answer."
  *   **Your Reply (2 min):** "I'm not solving the measurement problem empirically; I'm dissolving the philosophical worry. The methodologist wants an invariant measure. I'm saying utility *isn't* invariant across persons without a moral rule. We don't measure the range to find the morality; we pick the morality (e.g., 'everyone's range counts equally') to define the measurement. It's a constructivist approach, not a realist one."
  *   **Soft Spot:** Risks sounding like "truth is whatever we say it is." If they press on how to *implement* range normalization without circularity, you need a concrete example (e.g., survey anchors).
  *   **Flag:** 🖼️ **POINT TO SLIDE.** Have a slide comparing "Realist Measurement" (finding the length) vs. "Constructivist Normalization" (defining the meter).

  **3. The Empirical Pushback (Total Utilitarian)**
  *   **Who:** Unrepentant Total Utilitarian.
  *   **Question:** "I've heard this before. You say the monster is a unit convention. But suppose neuroscience shows Person A has twice the neural firing intensity for a given stimulus as Person B. That's not a convention; that's a biological fact. If utilitarianism is about maximizing welfare, and welfare is realized in the brain, doesn't the monster exist empirically, regardless of how you scale your units?"
  *   **Your Reply (2 min):** "Even if neural firing varies, calling that 'more welfare' is a choice. Why should two neurons count more than one? If you say 'because it feels more intense,' you are asserting that intensity is the metric. But intensity is just another unit. You are choosing to scale welfare by 'neural spikes per second' rather than 'persons.' That is a moral choice to weight high-capacity experiencers higher. You haven't escaped the convention; you've just hidden it in the neuroscience."
  *   **Soft Spot:** This is the hardest hit. If the room accepts welfare *just is* neural magnitude, your convention argument looks like semantic games.
  *   **Flag:** 🛑 **MUST LAND.** (See below).
  *   **Flag:** ⚔️ **GENUINELY DAMAGING.** If they don't buy that biology is also a scale choice, the paper's core thesis fails.

  **4. The Expensive Tastes Objection (Luck Egalitarian)**
  *   **Who:** Luck Egalitarian #1.
  *   **Question:** "If we normalize ranges, we might give more resources to someone with 'expensive tastes' just because their range is wider or their capacity for satisfaction is higher. But we usually think people are responsible for cultivating their tastes. Does your view force us to subsidize the utility monster's expensive palate just to fix the units?"
  *   **Your Reply (2 min):** "Range normalization doesn't track tastes; it tracks capacity for benefit. Expensive tastes are about the *cost* of reaching a level. My view separates the *scale* of the person from the *cost* of satisfying them. We can fix the units to be equal (no monster) while still holding people responsible for the efficiency of their conversion of resources to welfare."
  *   **Soft Spot:** The line between "capacity for benefit" and "expensive tastes" is blurry in practice.
  *   **Flag:** 🔄 **DUPLICATE OF Q6.** This is the Prioritarian objection in egalitarian clothing. Don't spend too much time here if you answer Q6 well.

  **5. The Distributional Weights Redux (Public Finance)**
  *   **Who:** Junior Cost-Benefit Analyst.
  *   **Question:** "This sounds exactly like what we do with distributional weights in CBA. We down-weight the rich and up-weight the poor. You're just calling 'distributional weights' 'unit normalization.' Is there any substantive difference, or is this just rebranding?"
  *   **Your Reply (2 min):** "It is the same math, but a different ontology. You treat weights as a correction to a 'true' unweighted sum. I'm arguing there is no 'true' unweighted sum. The weights *constitute* the sum. This matters because if weights are corrections, they need empirical justification. If they are unit definitions, they need moral justification. It stops you from pretending the baseline is neutral."
  *   **Soft Spot:** They might not care about the ontology if the math is the same.
  *   **Flag:** 🔄 **DUPLICATE OF Q1.** They are asking the same thing as the Senior Economist but more technically. Refer back to Q1 answer.

  **6. The Priority View Distinction (Prioritarian)**
  *   **Who:** The Prioritarian.
  *   **Question:** "I care about the badly off because they are at a low *level*, not because their *units* are different. You're conflating prioritarianism with unit normalization. I can accept your normalization and still apply a concave transformation to the result. Your view doesn't capture the priority view."
  *   **Your Reply (2 min):** "I argue that applying a concave transformation *is* a way of fixing the scale. If you say a unit of welfare for the poor counts more, you are effectively rescaling their units to be 'larger' in the social sum. You say it's about levels; I say you can't measure levels across persons without first fixing the units. Your 'priority' is just a specific rule for how to stretch the units of the worse-off relative to the better-off."
  *   **Soft Spot:** Prioritarians are very attached to the Level/Unit distinction. They will dig in.
  *   **Flag:** 🖼️ **POINT TO SLIDE.** Use the slide showing Range vs. Sacrifice normalization to show how prioritarian weighting maps onto one of these.

  **7. The "Hard to Benefit" Problem (User's Candidate)**
  *   **Who:** Quiet Philosopher in the back (or the Methodologist again).
  *   **Question:** "Let's talk about Range Normalization. If I equalize the range between 'worst life' and 'best life' for everyone, what happens to the person who is stoic, depressed, or otherwise hard to benefit? Their range is small. If we normalize ranges, do we give them *fewer* resources because their 'meter' is shorter? That seems to punish them for their psychology."
  *   **Your Reply (2 min):** "That is the cost of Range Normalization, and it's why I distinguish it from Unit-of-Sacrifice normalization. If you find that result repugnant, that tells you Range Normalization is the wrong moral choice for your theory. My point isn't that Range is right; it's that you must *choose*. If you want to protect the hard-to-benefit, you must argue for a normalization that does so, not pretend the monster doesn't exist."
  *   **Soft Spot:** This admits your view doesn't solve the problem, just relocates it. It might feel deflationary.
  *   **Flag:** ⚔️ **GENUINELY DAMAGING.** The paper argues the monster is a convention, but this shows the *solution* creates new monsters. The paper may not handle which normalization is *correct*, only that one is needed.

  **8. The Authority Question (Political Philosopher)**
  *   **Who:** Luck Egalitarian #2.
  *   **Question:** "If the scale is a moral choice, who gets to choose it? If the state fixes the utility units to avoid the monster, aren't they essentially dictating how much our welfare counts? That sounds like authoritarian manipulation of the metric to justify redistribution."
  *   **Your Reply (2 min):** "The state already does this via tax policy and rights. Nozick's monster shows that *not* choosing a scale yields absurd results (feeding everyone to the monster). Choosing a scale transparently is more democratic than letting the default aggregation rule decide. We should debate the scale in the open, not hide it in the math."
  *   **Soft Spot:** "Transparent authoritarianism" is still authoritarianism. Needs a appeal to public reason.
  *   **Flag:** None.

  ---

  ### The One Reply That Must Land
  **Target:** Question #3 (The Total Utilitarian / Empirical Objection).
  **Why:** If the room accepts that welfare intensity is an *empirical fact* (like height or weight) rather than a *conventional scale* (like meters vs. feet), your thesis collapses. You cannot afford to let them think biology settles the metric.
  **The Line:** "Biology gives us magnitude, but ethics gives us *weight*. To say neural spikes count more is to choose a metric where spikes are the currency. That is a moral choice, not a discovery."

  ### Analysis: The Worst Question & Your Candidate

  **My Nomination for the Worst Question in the Room:**
  **Question #3 (The Empirical/Neuroscience Objection).**
  **Reasoning:** This is the only objection that threatens to falsify your core premise. If welfare *is* biological intensity, it is not a unit convention. The economists will ignore this (they assume ordinality), and the methodologists will accept it (measurement of a construct), but the Utilitarian and the Normative Ethicists will seize on it. If you cannot convince them that "intensity" is a choice of metric, the paper becomes a semantic trick rather than a substantive contribution.

  **Evaluation of Your Private Candidate ("Hard to Benefit"):**
  **Is it the dangerous one?** **Yes, but differently.**
  Question #7 (your candidate) is not theoretically fatal, but it is **morally fatal**.
  *   **The Risk:** If Range Normalization implies giving fewer resources to the depressed/stoic because their "welfare range" is smaller, your solution to the Utility Monster creates a "Stoic Monster" problem where the emotionally muted are disadvantaged.
  *   **Why it's dangerous:** The Empirical objection (Q3) attacks your *logic*. The Hard-to-Benefit objection attacks your *conclusion's palatability*. In a mixed room, the economists won't care about the logic as much as the policy outcome. If your view implies penalizing the depressed, the room will turn.
  *   **Verdict:** You are right to be worried about it. However, Q3 is the *gateway* killer. If you lose Q3, Q7 doesn't matter because the paper is dead. If you win Q3, Q7 becomes the main battleground.
  *   **Advice:** Do not defend Range Normalization as the *only* solution. Defend it as one *option* that reveals the moral cost. Pivot to Unit-of-Sacrifice normalization as the alternative that protects the hard-to-benefit. Show that the choice between them is the actual political debate.

  **Final Prep Tip:** When the Economists ask for numbers, do not apologize. Tell them: "You are already using numbers. I am just asking you to read the fine print on the ruler."
