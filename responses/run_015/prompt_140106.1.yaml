prompt: |-
  I have to write a guidance note for a clinical ethics committee that is being asked to approve a consent form for a corpus callosotomy. The sticking point is how the operation's effect should be described to the person signing it: as dividing one subject of experience into two, as leaving one subject whose experience has become in some way fragmented, or as leaving the number of subjects genuinely unsettled. Before I write anything about what the evidence actually shows, I want the specification. So: what would a theory of the unity of consciousness have to deliver in order to be good enough for that decision?

  Give me the desiderata list — the phenomena it must account for, the cases it must get right, the distinctions it must respect, the findings it must not contradict — with the case or consideration behind each requirement, and each requirement marked either non-negotiable or a preference of one camp over another.

  Some things I want covered, though add what I've missed:

  - The question how many subjects there are and the question whether a subject's experience at a time is unified are different questions. Keep them apart, say what would settle each, and tell me which one the committee actually needs an answer to.
  - Whether unity is synchronic or diachronic or both, whether it is transitive, and whether it admits of degrees. Give a case that would discriminate.
  - The staged-section case. Suppose the commissure were sectioned in stages over several weeks under local anaesthesia, with the patient asked each day what has changed. What should a theory predict the patient can report midway through, and what should we conclude if the patient reports no change at all — that unity is not a phenomenal matter, or that first-person report is not a reliable instrument here? Either way, the theory should tell me what to ask.
  - The long-project case. Much is made of inter-manual conflict, but suppose instead we had evidence, after full section, that the two streams each sustained a different ranking of the patient's long-term projects and acted on it where it could — different verdicts on where to live, whom to trust, whether to continue with a hazardous treatment. Is that one subject with conflicting aims or two sources of consent? Which requirement on your list settles it, and is that requirement one we should have been confident of in advance?
  - Consistency with the cases that make the naive "one hemisphere, one subject" story untenable: people who have had a hemisphere removed, or who were born without a callosum, and who do not present as fragmentary; the temporary unilateral disconnection produced when one hemisphere is anaesthetised for cortical mapping; and the widely repeated observation that patients after full commissurotomy do not, on the whole, behave like two agents sharing a body.
  - Whether a verdict must be determinate in every case, or whether the theory may return "vague" or "no fact of the matter" — and what it costs a consent form if it may.
  - Whether unity must make a difference to what it is like, or whether it can be cashed out in terms of access, agency, or one experience's being a proper part of another.

  Then flag any subset of the desiderata you think cannot be jointly satisfied — that is the part I most want — and name the single requirement that excludes the largest share of candidate theories. Finally, a short scorecard: three or four lines each on the co-consciousness account, the mereological or subsumptive account, the view that unity is really availability to a single workspace or attentional system, and the view that there is no substantial unity to be had.
reasoning: |-
  Here's a thinking process that leads to the suggested guidance note:

  1.  **Analyze the Request:**
      *   **Task:** Write a guidance note for a clinical ethics committee regarding a consent form for a corpus callosotomy.
      *   **Core Problem:** How to describe the operation's effect on the "self" or "subject of experience" (splitting into two, fragmentation of one, or unsettled number).
      *   **Immediate Goal:** Provide a *specification* (desiderata list) for a theory of the unity of consciousness that would be sufficient to make this decision. *Do not* discuss the actual evidence yet; focus on what the theory *must* deliver.
      *   **Specific Requirements to Cover:**
          *   Distinction between "number of subjects" and "unity of experience."
          *   Synchronic vs. Diachronic unity, transitivity, degrees.
          *   The "Staged-Section Case" (gradual splitting under local anesthesia).
          *   The "Long-Project Case" (conflicting life plans post-op).
          *   Consistency with hemispherectomy, agenesis, Wada test, and general post-op behavior.
          *   Determinacy vs. Vagueness (and ethical cost).
          *   Phenomenal vs. Functional/Access accounts.
      *   **Additional Requirements:**
          *   Mark requirements as "Non-negotiable" or "Preference."
          *   Identify incompatible desiderata (trade-offs).
          *   Identify the single most exclusionary requirement.
          *   Provide a scorecard for four specific theories (Co-consciousness, Mereological/Subsumptive, Global Workspace/Access, No Substantial Unity).
      *   **Tone:** Professional, precise, philosophical but clinically grounded, suitable for an ethics committee context.

  2.  **Deconstruct the Core Ethical Problem:**
      *   Informed consent requires the patient to understand what is happening to *them*.
      *   If the operation creates a *new* subject, does the original subject consent to their own partial cessation?
      *   If the operation fragments the *same* subject, is the risk psychological disintegration?
      *   If the number is *indeterminate*, can valid consent be given at all?
      *   Therefore, the theory needs to link metaphysical/phenomenal facts to ethical standing (consent authority).

  3.  **Drafting the Desiderata List (Iterative Process):**

      *   *Item 1: Number vs. Unity.* The prompt explicitly asks for this. Need to clarify that ethics cares about the *subject* (who consents?), but phenomenology describes the *experience*.
      *   *Item 2: Temporal/Structural properties.* Synchronic (now), Diachronic (over time), Transitivity (A+B, B+C -> A+C?), Degrees (partial split?).
      *   *Item 3: Staged-Section.* This tests the sorites paradox of identity. If no change is reported, is it phenomenal or reportorial failure?
      *   *Item 4: Long-Project/Agency.* This is crucial for consent. If "Left" wants chemo and "Right" doesn't, who decides? This links unity to agency.
      *   *Item 5: Boundary Cases (Hemispherectomy, etc.).* Theory shouldn't imply hemispherectomy kills the person. Must align with clinical observation (they act like one agent mostly).
      *   *Item 6: Determinacy.* Can we say "maybe"? Ethics hates "maybe" on consent forms.
      *   *Item 7: Phenomenal vs. Functional.* Does it feel like one, or just act like one?

      *Refining the "Non-negotiable" vs. "Preference" tags:*
      *   Non-negotiable: Must not contradict basic clinical facts (hemispherectomy survival). Must distinguish number from unity. Must address agency (consent requires an agent).
      *   Preference: Phenomenal vs. Functional (depends on what we value in consent), Determinacy (ethics prefers it, metaphysics might deny it).

  4.  **Identifying Incompatibilities (The "Trilemma" or "Dilemma"):**
      *   *The Conflict:* We want a determinate answer for consent (Ethics), but the phenomena suggest vagueness (Metaphysics). We want to respect first-person reports (Phenomenology), but staged section might yield null reports despite functional splitting (Cognitive Science). We want to say there's one person (Legal/Moral), but the Long-Project case suggests two agents (Psychology).
      *   *The Big Exclusion:* The requirement for *Determinacy in Identity* combined with *Phenomenal Grounding* is likely the hardest to satisfy. Most plausible theories admit vagueness.

  5.  **Developing the Scorecard:**
      *   *Co-consciousness:* Good on phenomenology, bad on agency/number.
      *   *Mereological:* Good on structure, bad on explaining why the whole matters more than parts.
      *   *Global Workspace:* Good on function/agency, bad on "what it's like."
      *   *No Substantial Unity:* Honest, but ethically paralyzing for consent.

  6.  **Writing the Document (incorporating constraints):**
      *   *Header:* Formal Guidance Note.
      *   *Structure:* Introduction -> Desiderata List -> Incompatibilities -> The Exclusionary Requirement -> Scorecard.
      *   *Voice:* Objective, analytical, advisory.

      *(Self-Correction during drafting)*: Make sure I explicitly answer "Which one does the committee actually need?" regarding Number vs. Unity. The committee needs *Number/Identity* for consent authority, but *Unity* for risk assessment. I need to make that distinction sharp.
      *(Self-Correction on Staged Section)*: Ensure the desideratum asks the theory to predict the *report*, not just the state.
      *(Self-Correction on Long-Project)*: This is the crux of consent. If two projects, two consents needed? The theory must define the unit of agency.

  7.  **Final Review against Prompt:**
      *   Did I cover all bullet points? Yes.
      *   Are requirements marked Non-negotiable/Preference? Yes.
      *   Did I flag incompatible subsets? Yes.
      *   Did I name the single most exclusionary requirement? Yes.
      *   Is the scorecard 3-4 lines per theory? Yes.
      *   Is the tone appropriate? Yes.

  8.  **Final Polish:** Check for clarity and philosophical precision (e.g., distinguishing "subject" from "person" where necessary, though keeping it accessible for a clinical committee). Ensure the distinction between synchronic and diachronic is clear in the context of the surgery. (The surgery is a diachronic event with synchronic consequences).

      *Wait, one nuance:* The prompt asks "what would a theory... have to deliver... So: what would a theory of the unity of consciousness have to deliver...". I am writing the *specification* for the theory, not the theory itself. I am telling the committee what to look for in the expert testimony they might seek, or what standard the justification must meet.
      *Actually, re-reading:* "I want the specification... Give me the desiderata list...". Okay, I am producing the criteria by which any proposed theoretical explanation will be judged *for the purpose of the consent form*.

      *Let's refine the "Number vs Unity" point.* The committee needs to know if the *consenter* survives. That's a question of personal identity (Number). But the *risk* is about Unity. The theory must link them.

      *Let's refine the "Staged Section".* If the patient reports no change, does that mean unity holds? Or access is lost? The theory must explain the *silence*.

      *Let's refine the "Long Project".* This is about *normative unity*. Do preferences aggregate?

      *Okay, ready to write.*
answer: |-
  **GUIDANCE NOTE: SPECIFICATION FOR A THEORY OF CONSCIOUS UNITY IN CORPUS CALLOSOTOMY CONSENT**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name/Role]
  **SUBJECT:** Theoretical Desiderata for Describing Surgical Effects on Subjectivity
  **DATE:** October 26, 2023

  ### 1. Purpose and Scope
  The Committee must approve a consent form that accurately describes the ontological and phenomenological consequences of corpus callosotomy. The central ambiguity is whether the procedure divides one subject of experience into two, fragments one subject, or leaves the number of subjects indeterminate. To resolve this, any theoretical account offered to justify the consent language must meet the following specification. This document lists the phenomena the theory must account for, the distinctions it must respect, and the constraints it must satisfy.

  ### 2. Desiderata List
  *Requirements are marked as **Non-negotiable** (must be met for the theory to be clinically usable) or **Preference** (theoretical stances where the Committee may weigh competing values).*

  **1. The Distinction Between Numerical Identity and Phenomenal Unity**
  *   **Requirement:** The theory must explicitly distinguish between (A) the question of *how many subjects* exist (numerical identity) and (B) the question of *whether experiences are co-possessed* (phenomenal unity). It must state which of these determines the validity of consent.
  *   **Case/Consideration:** A patient might remain one legal person (A=1) while experiencing disjointed visual fields (B=fragmented). Consent authority relies on (A); risk disclosure relies on (B).
  *   **Status:** **Non-negotiable.** The Committee cannot authorize consent without knowing *who* is consenting, even if *what they experience* is complex.

  **2. Temporal and Structural Topology**
  *   **Requirement:** The theory must specify whether unity is strictly synchronic (at a time), diachronic (over time), or both. It must declare whether unity is transitive (if A is unified with B, and B with C, is A with C?) and whether it admits of degrees.
  *   **Case/Consideration:** *The Discriminating Case:* A patient exhibits inter-manual conflict (synchronic disunity) but maintains a continuous narrative autobiography (diachronic unity). A theory claiming unity is all-or-nothing fails here; a theory claiming it admits degrees must specify the threshold for "loss of self."
  *   **Status:** **Preference.** (Phenomenologists prefer degrees/transitivity failures; Legal/Ethics prefers binary determinacy).

  **3. The Staged-Section Prediction (The Sorites Constraint)**
  *   **Requirement:** The theory must predict the first-person report in a hypothetical staged section (cutting fibers over weeks under local anaesthetic). Specifically, if the patient reports "no change" midway, the theory must explain whether this indicates (a) unity is intact, (b) unity is lost but access to report it is severed, or (c) the concept of unity is vague.
  *   **Case/Consideration:** If the patient reports no change despite functional disconnection, we must know if we are trusting the report (phenomenology) or the scan (function). If the theory privileges the scan, it must explain why the consent form should describe a change the patient denies feeling.
  *   **Status:** **Non-negotiable.** The consent form describes subjective experience; if the theory contradicts reliable first-person report without explanation, it is clinically invalid.

  **4. The Long-Project Case (Normative Agency)**
  *   **Requirement:** The theory must define the unit of *agency* distinct from the unit of *experience*. It must determine whether conflicting long-term plans (e.g., Left hemisphere favors treatment, Right opposes) constitute one ambivalent agent or two consenting parties.
  *   **Case/Consideration:** If the theory posits two subjects, a single signature is insufficient. If it posits one subject, the conflict is internal. The theory must provide a criterion for when divergent preferences imply divergent identities.
  *   **Status:** **Non-negotiable.** This is the crux of informed consent. A theory that cannot locate the "will" cannot validate the signature.

  **5. Consistency with Boundary Cases (Hemispherectomy and Agenesis)**
  *   **Requirement:** The theory must not entail that removing a hemisphere destroys the subject, nor that agenesis (born without corpus callosum) implies dual subjectivity from birth. It must align with the observation that post-op patients generally behave as single agents in social contexts.
  *   **Case/Consideration:** The "Naive One Hemisphere, One Subject" story fails here. If the theory implies hemispherectomy kills the person, it is ethically untenable. If it implies split-brain patients are two people, it contradicts their social integration.
  *   **Status:** **Non-negotiable.** The theory must be consistent with established neurology and survival data.

  **6. Determinacy vs. Vagueness**
  *   **Requirement:** The theory must state whether the number of subjects is a determinate fact in every case, or whether there are cases where "there is no fact of the matter." If the latter, it must provide an ethical protocol for consent under metaphysical vagueness.
  *   **Case/Consideration:** If the theory allows vagueness, the consent form cannot state "You will remain one person." It may need to state "It is unclear if you will remain one person."
  *   **Status:** **Preference.** (Metaphysics often allows vagueness; Clinical Law prefers determinacy).

  **7. Phenomenal vs. Functional Grounding**
  *   **Requirement:** The theory must specify whether unity is constituted by "what it is like" (phenomenal), by information access (functional), or by mereological parthood.
  *   **Case/Consideration:** If unity is functional (access), a patient might be "one" despite feeling fragmented. If unity is phenomenal, a patient might be "two" despite behaving as one. The consent form must match the grounding chosen.
  *   **Status:** **Preference.** (Determines whether the consent form focuses on *feeling* or *capacity*).

  ---

  ### 3. Incompatibilities and Trade-offs
  The Committee should be aware that the following subsets of desiderata cannot be jointly satisfied. A theory satisfying one set will necessarily violate the other.

  **Incompatibility A: The "Reliable Report" vs. The "Functional Fact"**
  *   **Conflict:** You cannot simultaneously hold that (1) First-person report in the Staged-Section case is the final authority on unity (Desideratum 3) AND (2) Functional disconnection (callosotomy) necessarily entails a division of subjects (Desideratum 5/Long-Project).
  *   **Reason:** Patients often report no subjective change despite complete functional disconnection. A theory must either say the patient is wrong (undermining the phenomenological basis of consent) or that functional splitting doesn't create new subjects (undermining the "two agents" warning).

  **Incompatibility B: "Determinacy" vs. "Consistency with Boundary Cases"**
  *   **Conflict:** You cannot simultaneously hold that (1) The number of subjects is always determinate (Desideratum 6) AND (2) The theory accounts for the gradual nature of neural disconnection and the continuity seen in hemispherectomy (Desideratum 5).
  *   **Reason:** Biological processes are gradual; identity conditions based on them often yield vague boundaries. Insisting on a binary "One vs. Two" verdict forces an arbitrary line onto a continuous biological process, risking contradiction with the hemispherectomy data.

  **The Single Most Exclusionary Requirement:**
  **Desideratum 4 (The Long-Project Case / Unit of Agency).**
  This requirement excludes the largest share of candidate theories. Most philosophical theories of consciousness address *experience* (what it is like), not *agency* (who decides). A theory can successfully explain why visual fields are split (Phenomenal Unity) while failing completely to explain whether the "will" is split (Normative Unity). Since the Ethics Committee requires the latter to validate consent, theories that address only the former are insufficient.

  ---

  ### 4. Theoretical Scorecard
  *Evaluation of common accounts against the Specification.*

  **The Co-consciousness Account**
  *   **View:** Unity consists in experiences being had together by a single subject.
  *   **Score:** Fails Desideratum 4 (Agency). It explains why pain and sight are experienced together, but offers no criterion for when conflicting *plans* imply separate subjects. It risks implying that if the patient feels like one person, they are one, even if functional agency is dual.
  *   **Verdict:** Insufficient for consent authority.

  **The Mereological (Subsumptive) Account**
  *   **View:** Unity is a part-whole relation; experiences are parts of a total conscious state.
  *   **Score:** Struggles with Desideratum 5 (Boundary Cases). If the total state is divided, are the parts new subjects? It risks implying hemispherectomy destroys the "whole" subject. It handles Desideratum 2 (Structure) well but falters on Identity.
  *   **Verdict:** High risk of contradicting survival data.

  **The Global Workspace / Access Account**
  *   **View:** Unity is defined by information availability to a single reporting/decision system.
  *   **Score:** Strong on Desideratum 4 (Agency) and 3 (Report). If information isn't shared, agents are distinct. However, it fails Desideratum 7 (Phenomenal Grounding); it may declare "two subjects" even if the patient reports feeling like one, creating a disconnect in the consent form.
  *   **Verdict:** Best for agency, worst for phenomenological accuracy.

  **The "No Substantial Unity" Account (Bundle Theory/Eliminativism)**
  *   **View:** There is no underlying subject; there are only experiences and functional relations.
  *   **Score:** Satisfies Desideratum 6 (Vagueness) honestly but fails Desideratum 1 (Number of Subjects). It renders the consent form's promise ("You will remain...") metaphysically empty. It is scientifically robust but ethically paralyzing.
  *   **Verdict:** Philosophically robust, clinically unusable without modification.
