answer: |-
  You have identified a specific, structural artifact in experimental data that sits between psychometrics and philosophy of language. It is not merely measurement error, nor is it purely a philosophical disagreement.

  Here is the carve you are looking for.

  ### The Name: Assertability Substitution

  I propose calling this **Assertability Substitution**.

  It is not "misunderstanding" because the respondent understands the facts of the vignette perfectly. It is not "bias" in the standard survey sense (like acquiescence) because it is content-sensitive. It is a **substitution of the evaluation metric**.

  *   **The Asked Question:** Asks for a classification based on *truth conditions* (Is the belief true and justified?).
  *   **The Answered Question:** Asks for a classification based on *assertability conditions* (Is it safe/responsible/permitable to claim this?).

  In epistemology, this is the difference between *knowledge* and *warranted assertibility*. In your data, it manifests as respondents treating the survey vignette as a request for practical advice rather than a request for metaphysical categorization.

  ### The Carve: What It Is and What It Is Not

  **It IS:**
  1.  **A Speech-Act Reinterpretation:** The respondent reinterprets the illocutionary force of the survey item. They treat "Did he know?" as "Are we licensed to say he knew?"
  2.  **Verdict-Dependent:** As you noticed, this tracks the minority verdict (usually the "No, he didn't know" response in Gettier-style cases). Why? Because the "philosophical" majority view often aligns with the semantic truth (he *did* have a justified true belief), while the "folk" minority view aligns with the pragmatic risk (but he *couldn't claim it* without looking foolish). To give the minority verdict, they often need to invoke the pragmatic rule to justify it.
  3.  **Culturally Sensitive Defaulting:** Different cultures (or subpopulations) have different default settings for "What is the point of this conversation?" Some default to *informational precision* (answer the semantic question); others default to *social utility* (answer the pragmatic question).

  **It is NOT:**
  1.  **Comprehension Failure:** As you noted, comprehension checks pass. They know the protagonist got the right answer by luck.
  2.  **Translation Noise:** You see this in monolingual samples. It is not an artifact of localization, though localization can exacerbate it if the target language lacks a clean distinction between "know" and "know how to say."
  3.  **Random Noise:** It is systematic. It clusters around the specific respondents who are willing to dissent from the "standard" philosophical intuition.

  ### The Boundary Cases

  You asked for the edges. Here is how to code the gray areas:

  **1. The "Because" Boundary (On-Target Verdict, Off-Target Justification)**
  *   *Response:* "Yes, he knew. But you couldn't say that in court."
  *   *Carve:* This is **On-Target**. They answered the question asked ("Yes"), even if their reasoning reveals they are aware of the pragmatic tension. They successfully bracketed the pragmatic concern to give the semantic verdict.
  *   *Data Treatment:* Count as the majority verdict.

  **2. The "Technically" Boundary (Dual-Frame Awareness)**
  *   *Response:* "Technically he knew, but practically he didn't."
  *   *Carve:* This is **Explicit Frame Conflict**. The respondent sees both games being played.
  *   *Data Treatment:* This is your most valuable data point. It proves the ambiguity is in the task, not the concept. In a binary analysis, they usually default to the pragmatic ("practically he didn't"), but they should be coded as a separate category: **Frame-Aware**.

  **3. The "Implicit" Boundary (Bare Verdict)**
  *   *Response:* "No." (With no justification).
  *   *Carve:* **Ambiguous.** This is where your problem lies. You cannot tell if they mean "No, the truth conditions weren't met" or "No, it wasn't safe to assert."
  *   *Data Treatment:* This is the danger zone. If your "No" rate correlates with cultural groups, you don't know if Group A *thinks* differently or just *interprets the task* differently. This is where Assertability Substitution hides.

  **4. The "Barely On-Target" (Pragmatic Evidence for Semantic Claim)**
  *   *Response:* "No, because he was just guessing."
  *   *Carve:* **On-Target.** Even though "guessing" is a practical descriptor, it attacks the justification condition of knowledge. This is a valid semantic argument, not a pragmatic substitution.
  *   *Distinction:* If they say "You can't *rely* on it," that is pragmatic (Action). If they say "He didn't *see* it," that is semantic (Justification).

  ### The Methodological Verdict: Confound or Datum?

  This is the crux. Is this something to screen away, or is it the thing you are measuring?

  **1. If your goal is "Competence" (The Philosophical Project):**
  If you are trying to map the underlying structure of the concept *Knowledge* (like a linguist mapping universal grammar), then Assertability Substitution is a **Performance Confound**.
  *   *Why:* The respondents are being "distracted" by practical stakes when you want to know about the abstract concept.
  *   *Fix:* You must screen for it. You need a "Task Interpretation Check." Before the vignette, ask: "In this survey, should we focus on what is strictly true, or what is safe to say?" If they choose "safe to say," their vignette data is contaminated for this specific purpose.
  *   *Result:* If you screen these people out, the cultural gap will likely shrink, as you suspected.

  **2. If your goal is "Usage" (The Anthropological/Psychological Project):**
  If you are trying to map how people *use* the concept in the wild, then Assertability Substitution is **The Datum**.
  *   *Why:* In real life, nobody cares about "truth conditions" divorced from "assertability." We use "know" to license action. If a culture consistently treats "know" as "safe to act on," that *is* their concept of knowledge. The "substitution" is not an error; it is the local definition.
  *   *Fix:* Do not screen. Instead, measure the *threshold* for substitution.
  *   *Result:* The cultural gap is real, but it is not a gap in *epistemology*; it is a gap in *contextual default settings*. Group A defaults to "Low Stakes/Semantic" mode for surveys. Group B defaults to "High Stakes/Pragmatic" mode.

  ### The "Shape" Explanation

  You mentioned the gap sits almost entirely inside the subpopulation who switched the question. Here is why that shape exists:

  The "Standard" (Philosophical) answer is usually the **Semantic Default**. It requires less cognitive work to look at the story and say "True + Belief + Justification = Know."

  The "Minority" (Folk) answer often requires **Pragmatic Override**. To say "No, he didn't know" when the facts show he was right, you need a *reason*. That reason is almost always pragmatic ("It was luck," "You can't bet on it"). Therefore, the people giving the minority answer are *forced* to engage the pragmatic frame to justify their intuition.

  Consequently, the cultural gap appears as a gap in **Pragmatic Default Strength**.
  *   **Culture A:** Weak pragmatic default. Even if they feel the risk, they answer the semantic question. (Mostly Majority Verdict).
  *   **Culture B:** Strong pragmatic default. The risk overwhelms the semantic classification. (More Minority Verdict, heavily correlated with Assertability Substitution).

  ### Recommendation for Localization

  Since you are a localizer, you cannot fix the respondents' cognitive defaults, but you can sharpen the instrument to detect the swap.

  1.  **Add a "Frame Prime":** In the instructions, explicitly state: *"There are no practical consequences to your answers. Please answer based strictly on whether the statement is true, not whether it is safe to say."*
      *   If the cultural gap vanishes after this prime, you have proven the gap was **Assertability Substitution**, not conceptual difference.
      *   If the gap remains, the conceptual difference is deeper.

  2.  **Code the Justifications:** Don't just code Yes/No. Code the *reasoning type* (Semantic vs. Pragmatic).
      *   If Group A is 80% Yes (Semantic) and Group B is 50% Yes (Pragmatic), you don't have a "Knowledge" gap. You have a "Survey Task Interpretation" gap.

  3.  **The "Court" Test:** You mentioned respondents writing "you couldn't say that in court." Make that an option. Include a follow-up item: *"Does 'knowing' mean 'being right' or 'being able to prove it'?"*
      *   Use this as a covariate. If the vignette verdict correlates perfectly with this follow-up, the vignette is measuring the follow-up, not knowledge.

  ### Summary

  The term is **Assertability Substitution**.
  It is a **systematic reinterpretation of the inquiry frame** from semantic to normative.
  It is a **confound** if you seek abstract conceptual structure.
  It is a **datum** if you seek functional concept usage.
  The cultural gap is likely a difference in **contextual default settings** (when do we switch to pragmatic mode?), not necessarily a difference in the concept itself.

  If you code out the substitutors, you are left with the "semantic competence" gap. If you keep them, you are measuring the "pragmatic application" gap. Both are real, but they are not the same thing. Your intuition is correct: the measured gap shrinks if you screen for the frame, because the frame *is* the variable driving the variance.
