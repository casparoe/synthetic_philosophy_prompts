  The midday sun beat down on Excavation Unit 4B, bleaching the color from the exposed stratigraphy. Elena brushed a layer of loose sediment away with a trowel, revealing a subtle, reddish-orange lens in the otherwise greyish-brown subsoil. She pulled a Munsell color chart from her pocket, comparing the soil against the paper chips.

  Julian leaned over the trench, shading his eyes. "That's distinct. Fired clay residue?"

  "Undeniably," Elena said, snapping the book shut. "And this is where Moore meets the trowel. Look at the structure of what I'm claiming. Premise one: This discoloration is a trace of human manufacture, specifically a fired-clay vessel. Premise two: If there is a trace of manufacture, there was a manufactured object. Conclusion: Therefore, an external object—a pot—existed in the past."

  Julian hopped down into the unit, careful not to disturb the section. "I accept the conclusion, Elena. We both know a pot was here. But I deny that your argument proves it in the Moorean sense. You're trying to replicate the 'Here is a hand' move."

  "I am," Elena said, crouching to scratch the soil with her fingernail. "Moore argued that the premise 'Here is a hand' is more certain than any skeptical hypothesis that might deny the existence of the external world. I'm saying this premise—'This is a kiln scar'—is more certain than the hypothesis that this is merely a natural mineral stain caused by iron oxidation. The epistemic weight rests on the premise. It's more reasonable to believe I'm looking at a pot trace than to believe I'm being deceived by geology."

  "That works for hands," Julian said, kneeling beside her. "But consider the asymmetry. When Moore held up his hands, the perceptual immediacy was the foundation. The premise 'Here is a hand' does not logically entail the complex theoretical machinery of an 'external world' in the same way your premise does. To classify this discoloration as a 'trace of human manufacture' is not a raw perceptual report. It is an interpretation embedded in a framework."

  Elena frowned, wiping dust from her forehead. "You're suggesting circularity."

  "I'm suggesting that the epistemic priority collapses," Julian replied. "For Moore, the certainty of the hand is supposed to be prior to the theory of the external world. But in archaeology, to identify this redness as a 'trace' *already* presupposes the existence of the past external object you're trying to prove. You can't have the trace without the object. So, when you say the premise is more certain than the conclusion, you're mistaken. The premise *contains* the conclusion. If you aren't already committed to the existence of the past pot, you cannot describe the soil as a 'trace.' You'd just describe it as 'red soil.'"

  Elena tapped the trowel against her boot. "But surely the observation is still more secure than the skeptic's alternative. If I say 'I see red soil,' the skeptic asks if it's real. If I say 'I see a pot trace,' I'm claiming knowledge. You're accepting the knowledge, Julian, but rejecting the proof. Why does the logical form matter if the result is the same?"

  "Because Moore's proof claims to derive metaphysical reality from epistemic certainty," Julian said. "If the certainty of the premise relies on the truth of the conclusion, it's not a proof; it's an assertion. And this brings us to the asymmetry you're glossing over. Moore's proof relies on present perceptual objects. Hands are here, now, directly accessible. Your object is a reconstructed past entity. The 'hand' is given; the 'pot' is inferred. Does Moore's proof operate differently for reconstructed past objects?"

  Elena paused. She looked at the red lens, then at her own hand holding the trowel. "If the asymmetry holds, then Moore's claim to universality fails. He claims to prove the external world *simpliciter*. If his logic only works for present perceptual data and breaks down for historical inference, then he hasn't proven the external world generally; he's only proven the present perceptual field."

  "Exactly," Julian said. "If the proof requires the premise to be epistemically prior to the conclusion, archaeology breaks the chain. We cannot access the 'pot' without the interpretive framework that posits the 'pot.' So, your premise isn't a foundation; it's a node in a web of theory."

  Elena took a breath. She picked up the Munsell chart again, staring at the 5YR 4/6 chip. "Okay. I concede that if I treat 'This is a trace' as a raw perceptual datum like 'Here is a hand,' I am wrong. The description is theory-laden. But I don't think this forces us to abandon the Moorean spirit. It requires a revision of *where* the certainty lies."

  She pointed the chart at the soil. "Moore was wrong to think the certainty lay in the *perception* alone. The certainty lies in the *practice*. In this discipline, 'This is a trace' functions as what Wittgenstein might call a hinge proposition. It is a rule of the game we play. To doubt this is not to be a skeptic; it is to cease doing archaeology."

  "So you're modifying the argument," Julian said. "You're shifting from perceptual certainty to methodological necessity."

  "Yes," Elena said firmly. "And here is my position: A modified Moorean argument *succeeds* in the archaeological case, but only if we revise the nature of the premise. It is not a perceptual report that precedes theory. It is a stabilized observation guaranteed by intersubjective method. The asymmetry between hands and pots *does* undermine Moore's claim to a universal *perceptual* foundation. He cannot claim that all knowledge of the external world rests on immediate perception. However, the *structure* of the proof holds if we view the premise as a commitment of a form of life."

  Julian nodded slowly. "So you're admitting the proof isn't universal in its basis—perception versus inference—but universal in its function?"

  "Precisely," Elena said. "The revision required is this: We must acknowledge that for reconstructed past objects, the 'premise' is not epistemically prior to the 'conclusion' in a linear logical sense. Instead, they stand together as a package of certainty. I am more certain that 'This is a trace of a pot' than I am of any skeptical hypothesis about geological staining, not because I see it directly, but because the alternative renders my entire practice unintelligible. Moore's proof succeeds here, not because the soil speaks for itself, but because our agreement on what the soil *is* constitutes the reality of the past."

  Julian picked up his own trowel and gently scraped the edge of the discoloration. "That saves the proof, but it costs Moore his foundationalism. You're saying the external world is proven not by a single glance at a hand, but by the coherence of our engagement with things."

  "It costs Moore his foundationalism," Elena agreed, marking the locus on her plan sheet. "But it saves the reality of the pot. And isn't that the point? The proof succeeds in establishing the object, provided we revise the premise from 'I see this' to 'We recognize this within a valid framework.' The asymmetry doesn't kill the argument; it just forces us to admit that knowledge of the past is a collective achievement, not a solitary perception."

  Julian smiled, dusting off the shard he had just loosened. "Then we agree. The Moorean move works, but only if we admit that 'Here is a hand' is also, in some sense, a collective achievement. You've saved the external world, Elena, but you've made it a social one."

  "Better a social external world," Elena said, bagging the shard, "than a skeptical void."
