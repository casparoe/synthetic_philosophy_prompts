      *   *Defeater 1 (Fatal):* Evidence that the bias exists *without* the syntax. If Finnish speakers default to male generics without pronouns, Hofstadter's point stands (bias is real), even if his *specific English trick* doesn't translate. The user claims the *essay's force* derives from syntax. If the *bias* exists without it, the essay reveals a bias *using* syntax, not *created by* syntax. *Correction:* The user says the *rhetorical force* derives from syntax. I need to show that the rhetorical force can exist without it, or that the bias is the primary driver, syntax secondary.
