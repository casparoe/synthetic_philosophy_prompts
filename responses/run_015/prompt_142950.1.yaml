  Now, your second prong is the real battleground. You want to operationalize passage as the accumulation of records along a worldline. But tell me, in a block universe where your entire worldline exists tenselessly, what distinguishes the 'accumulation' from just a static gradient of correlations? You have a memory trace here, and a fossil trace there. That's just asymmetry, not passage. To say time *passes* is to say something comes into existence. But in your record model, the future records are just as real as the past ones, merely located elsewhere on the line. You've given me an arrow, sure, but you haven't given me a flow. Why is entropy's direction *time* rather than just another spatial-like dimension with a gradient?
