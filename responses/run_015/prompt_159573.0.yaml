      *   Scenario: Stuck in desert -> Driver offers lift -> Driver predicts if you'll pay -> If yes, lift given -> Once in town, paying is costly and has no direct benefit (driver is gone) -> Rational agent defects -> Driver predicts defect -> No lift -> Die.
      *   Lesson: You need to be the *type* of person who pays even when it's irrational to do so.
      *   Game Theory Equivalent: Newcomb-like problem / Prisoner's Dilemma with prediction.

  3.  **Address the Reputation Problem:**
      *   Standard iterated games lead to cooperation for reputation.
      *   Solution: Known final round (Backward Induction). If the last round is anonymous and one-shot, rational actors defect. If the driver knows this, they don't pick you up.
      *   Implementation: Need a simulation where players are "Hitchhikers" and some are "Drivers" (or a simulated Driver).
      *   Better Implementation for Group: All players are Hitchhikers facing a "Driver" (the facilitator or a mechanism).
      *   To make it experiential: Players make a choice privately. The "Driver" predicts based on previous behavior? No, PH is about *disposition*, not history.
      *   Revised Mechanism: Players are paired? No, PH is asymmetric.
