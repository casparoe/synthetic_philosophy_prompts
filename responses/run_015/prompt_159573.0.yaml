answer: |-
  **Setup (10 mins)**
  *   **Story:** You're stranded. I'm the driver. I only lift those who *will* pay upon arrival. Once in town, I leave. Paying costs you a wine chip; keeping it gains you nothing but saves the chip.
  *   **Props:** Index cards, envelopes, wine chips (prizes).
  *   **Rule:** No talking during decisions.

  **Rounds (40 mins)**
  *   **Round 1 (Practice):** Write "Pay" or "Keep" on card. I collect. I hand out "Lift Tickets" to everyone who wrote "Pay". In "Town" (your seat), choose: hand ticket back (Pay) or keep it (Keep). Payors get a chip.
  *   **Round 2 (Habit):** Repeat. Announce: "I'm learning your faces." (Builds reputation incentive).
  *   **Round 3 (The Hitchhiker):**
      *   **Announce:** "Final round. I will shuffle all cards. No one knows who did what. No future games."
      *   **Action:** Write "Pay" or "Keep". Seal in envelope.
      *   **Prediction:** I collect envelopes. I pause dramatically. I hand "Lift Tickets" to ~80% of you. **Stipulation:** "If you got a ticket, I predicted you are a Payer. If you didn't, I predicted you'd Keep."
      *   **Decision:** Open envelope. You may now change your mind. Hand ticket back (Pay) or keep it (Keep).
      *   **Payoff:** Only those who Pay get wine chips.

  **Debrief (20 mins)**
  *   **Map the Desert:** Ask those denied tickets how it felt. (Excluded for being the "wrong type").
  *   **Map the Town:** Ask ticket-holders who defected: "You were safe. Why pay?" (Highlights the cost without benefit).
  *   **The Lesson:** Those who got lifted *and* paid did best. But paying in town was irrational *in the moment*. The advantage came from being the *kind of person* who pays even when it hurts.
  *   **Reveal:** Introduce terms: "Precommitment," "Dispositional Rationality."

  **Predicted Failures**
  *   **The Spoiler:** Someone shouts "Dominant strategy is Defect!" in Round 1.
      *   *Fix:* "True, if you're already in town. But then you don't get the lift. The game is about getting the lift."
  *   **The Liar:** "I'll write Pay, get lifted, then Keep."
      *   *Fix:* Remind them of the stipulation: "If I think you'll lie, you don't get the ticket. You got the ticket because I think you're honest."

  **Honest Limitation**
  *   **The Black Box:** The game cannot simulate *actual* prediction accuracy. I am stipulating I know their type. You have to trust the stipulation. The game proves you *would be picked* if you were the type, not that paying is logically mandatory.

  **Design Failure Flag**
  *   **The "Gotcha" Moment:** If players treat Round 3 as a trick to beat the facilitator rather than a simulation of the dilemma, the lesson fails. Watch for laughter during the "Prediction" phase. If they laugh, they think the prediction is fake. If they think it's fake, they defect, and the lesson collapses into "Don't trust the host." You must sell the prediction as absolute truth.
