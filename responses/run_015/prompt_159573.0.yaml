              6.  **Better:** Use the "Pre-Game Survey" trick. Before the session starts, ask them a hypothetical. Use that as the "Prediction".
              7.  No, too complex.
              8.  **Best bet for 70 mins:** Simulate the prediction.
              9.  Round 3: "I have already predicted who will pay." (Write names on board). "Those on board get lifted." "Now, those lifted, choose to pay or not."
