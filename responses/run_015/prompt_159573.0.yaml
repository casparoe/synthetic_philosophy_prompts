      *   **Constraints:**
          *   70 minutes total.
          *   No real money (wine prizes okay).
          *   Minimal printing (index cards, envelopes).
          *   No jargon upfront ("precommitment", "rational irrationality", "expected utility").
          *   **Crucial Constraint 1:** No external commitment devices (contracts, promises, third parties). Must be about *being* a certain kind of person.
          *   **Crucial Constraint 2:** Avoid reputation solving the problem. Need a known final anonymous round to kill reputation incentives.
          *   **Deliverables:** Runnable design, debrief plan, predicted failures (including game theory spoilers), honest limitation note, flag where design might fail.
          *   **Length:** Under 600 words.
          *   **Style:** Terse bulleted rules okay.

