          *   Rounds 1 & 2: Public choices. Driver (Facilitator) lifts everyone who *says* they will pay. (Simplification).
          *   Round 3: Announced as "Final, Anonymous, One-Shot". No future interaction.
          *   Payoff: Wine for those who "Survived" (got lifted) and "Paid".
          *   Catch: To get lifted in Round 3, the Driver must have predicted you in Round 2.
