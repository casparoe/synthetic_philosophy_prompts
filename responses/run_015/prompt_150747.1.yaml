      *   If Verisimilitude = Negative Total Risk, adding $\hat{g}$ reduces total risk (because $\hat{g}$ has low error), making the joint model "closer to truth." But $\hat{g}$ tells us nothing about the mechanism generating $Y$.

  4.  **Drafting the Residue Report:**
      *   *What survives:* The trade-off between fit and complexity (Bias-Variance). The idea that "truth" is a limit we approach asymptotically. The problem of metric dependence (how you measure distance matters).
      *   *What distorts:* Philosophy cares about *propositions* and *logical content*. Stats cares about *predictions* and *distributions*. A model can be "false" (misspecified) but have zero prediction error (e.g., $Y = X + \epsilon$, model $Y = X + X^2 - X^2 + \epsilon$). Philosophy worries about the ontological status of the terms; stats worries about input-output mapping.
