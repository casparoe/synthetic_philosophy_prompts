  2.  **Deconstruct Verisimilitude (Popperian & Post-Popperian):**
      *   *Core Idea:* Theory $A$ is closer to the truth than Theory $B$ if $A$ has more truth content and less falsity content.
      *   *The Problem (Miller/Tichý):* Simple logical definitions fail. If $A$ and $B$ are both false, adding a true irrelevant conjunct to $A$ might make it "further" from truth under certain logical definitions, or the definitions collapse so that no false theory is closer than another.
      *   *The "Irrelevant Conjunction" issue:* $T$ is false. $S$ is true (irrelevant). $T \land S$ often counts as "better" in naive counts of true consequences, but intuitively shouldn't change the core accuracy of $T$.
      *   *The "Narrowly Scoped" issue:* A theory that says nothing is technically "true" (vacuously) but useless. A theory that says everything risks falsity.

  3.  **Drafting the Translation (Statistical Vocabulary):**
      *   *Truth:* The true probability distribution $P^*$ or the true parameter vector $\theta^*$.
      *   *False Theory:* A model class $\mathcal{M}$ that does not contain $P^*$ (misspecification), or a specific estimator $\hat{P}$ derived from data.
      *   *Closeness:* A divergence measure $D(P^* || \hat{P})$. Kullback-Leibler (KL) divergence is the standard candidate for "informational distance." Alternatively, Expected Prediction Error (Risk).
      *   *Truth Content:* The portion of the model's predictions that align with $P^*$. In stats, this is low Bias.
      *   *Falsity Content:* The portion that deviates. This is high Variance or Structural Bias.
      *   *The Paradox (Conjunction):*
          *   Philosophical: $T$ (false) + $S$ (true, irrelevant) $\rightarrow$ $T \land S$ (more verisimilitude?).
