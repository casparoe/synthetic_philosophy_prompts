          *   If we define "closeness" by model complexity penalized risk (AIC/BIC), adding irrelevant parameters penalizes the score.
          *   *The specific translation:* Consider a loss function $L(\theta, \hat{\theta})$. If we define verisimilitude as the count of correct point predictions within a tolerance $\epsilon$, adding an independent, correctly estimated parameter increases the count of "hits." However, if we define it via integrated squared error over the *relevant* manifold, the irrelevant dimension shouldn't matter. The paradox arises when the metric sums errors over all dimensions equally, regardless of causal relevance.
      *   *Refining the Paradox:* Let's look at the Miller/Tichý result. It shows that under logical content definitions, you can't order false theories. In stats, if we use KL divergence, we *can* order misspecified models. So the translation needs to show where the statistical metric fails to capture the *intuitive* notion of "aboutness."
      *   *Better angle:* The "Irrelevant Conjunction" in stats is akin to adding a nuisance parameter that is known to be zero (or known value). If the loss function is additive over parameters, the score improves. But intuitively, the *mechanism* hasn't improved.
