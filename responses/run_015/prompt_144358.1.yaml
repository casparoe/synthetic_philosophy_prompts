answer: |-
  The smell of the Gradient Booth was always the same: ionized air, stale coffee, and the sharp, copper tang of ozone. It was the scent of a storm trapped in a shoebox.

  Mara stood at the control console, her fingers hovering over the haptic interface. The glass partition separated her from the patient, Elias. He was an older man, silver-haired and still, wearing the thin white gown of the clinic. He wasn't nervous. Most people were nervous. They were coming here to cheat death, to spawn a younger, brighter version of themselves to carry on while their biological bodies faded into the thirty-day dilution.

  But Elias wasn't here to spawn.

  "Protocol 7-Alpha," Elias said. His voice came through the intercom, flat and calm. "Replication module disabled. Dilution only."

  Mara looked at the screen. The *Replication: OFF* indicator blinked a warning red. It was a safety lock for a reason. The Gradient was sold as a bridge: the Original fades, the Copy wakes. The emotional weight of a life—grief, joy, obsession—is transferred to the new vessel, leaving the Original peaceful, unburdened, and hollow. A shell that breathes.

  "If I run this," Mara said, her voice tight, "there's no one waking up in the Recovery Ward. There's just you. And in thirty days, you won't care that there's no one."

  "That is the hypothesis," Elias replied. He closed his eyes. "I want to know if the continuity of the narrative is enough. If I remember loving my wife, does it matter if I no longer feel the ache of it? Am I still Elias?"

  Mara's hand drifted to the master dial. It was a physical wheel, heavy and ridged, used to set the decay rate. Today it was set to *Standard Fade*.

  She had seen the Hollows, as the staff called them. The diluted Originals who finished the cycle. They walked out of the clinic with clear eyes and steady hands. They could recite their life stories perfectly. They knew their children's names. But when they talked about them, their voices had the cadence of a weather report. They claimed they were the real ones because they had never left the chair, because their stream of consciousness had never been interrupted. Narrative continuity.

  But the Copies... the Copies were terrifying. They woke up screaming with the joy of a sunrise they hadn't physically seen. They clutched their chests, overwhelmed by the grief of a funeral they hadn't attended. They had the *weight*.

  Mara looked at the console. The hum of the machine deepened, vibrating through the soles of her shoes. The coolant pumps kicked in, a low thrumming in the walls.

  *What matters?* she thought, her finger tracing the safety override.

  If she engaged the dilution without the copy, Elias would undergo the Fade. His synaptic emotional weights would scale down day by day. By day thirty, he would be a biological ghost. But he would be *alive*. He would walk out. He would insist he was Elias.

  But if the "self" is defined by the intensity of experience—the "weighted presence," as the lead researcher called it—then killing the copy was killing the only part of him that actually *felt* alive.

  Yet, the Copy was a duplicate. A new arrangement of atoms. If Mara pressed the button, she preserved the continuity of the body but sacrificed the intensity of the mind. If she didn't, she forced the creation of a stranger who felt more like Elias than Elias did.

  "Technician Mara?" Elias prompted.

  The room felt small. The ozone smell was stronger now, prickling the back of her throat. On the monitor, Elias's heart rate was steady at 60 beats per minute. He was ready to become a ghost in his own skin.

  She thought of a patient from last month, a musician. The Copy had played a concerto with tears streaming down its face. The Original, diluted, had sat in the waiting room and tapped a rhythm on his knee, perfectly on time, with zero expression. When asked who he was, the Original had said, "I am the one who stayed." When asked if he loved the music, he had said, "I recall that I did."

  Was survival the persistence of the vessel, or the persistence of the fire?

  Mara looked at the *Replication Override* key. It was a digital toggle, but it felt heavy. To disable the copy was to condemn Elias to a living death. But to force the copy was to assert that a feeling is more real than a history.

  Maybe the truth was in the gradient itself. Not the start, not the end, but the slope. The slow slide from feeling too much to feeling nothing. Maybe "survival" was just the ability to endure that slide.

  "Mara," Elias said, softer this time. "Don't decide for me. Decide for the question."

  The hum of the booth rose in pitch, a waiting tension. The lights on the console shifted from standby amber to active green. All she had to do was turn the wheel.

  If she turned it, Elias survives as a story without a reader.
  If she doesn't, Elias dies as a feeling without a body.

  Mara gripped the ridged wheel. The metal was cold. She could feel the vibration of the machine in her bones, a physical reminder that this was just mechanics, just voltage and chemistry. There was no soul in the wiring. There was only the output.

  She took a breath, the ozone burning slightly in her lungs. She looked at Elias through the glass. He looked peaceful. He looked like a man who had already let go.

  Mara disengaged the safety lock. The red light died.

  She placed her hand on the wheel. She did not turn it yet. She simply held it, feeling the potential energy of the machine, the weight of a life about to be thinned, waiting to see if the silence that followed would feel like peace, or like an end.
