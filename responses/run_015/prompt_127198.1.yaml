answer: |-
  # Workshop Activity: The Attention Economy & The Fanatic's Trap

  **Time:** 90 Minutes
  **Participants:** 8 Graduate Students (Philosophers)
  **Materials:** 
  *   80 Poker Chips (10 per student, distinct color for "Attention").
  *   1 d10 (ten-sided die).
  *   Printed "Decision Sheets" (one per student).
  *   Whiteboard for tracking aggregate scores.

  ## Part 1: Setup & Rules (15 Minutes)

  **The Narrative:**
  Tell the group they are grant officers at a foundation. They have a fixed budget of **Attention** (10 Chips). They must allocate this attention to generate **Impact Points** (Utility). They have two funding streams:

  1.  **Local Aid (Safe):** Guaranteed return. 
      *   *Rate:* 1 Chip wagered = **2 Impact Points**.
      *   *Risk:* None.
  2.  **Cosmic Lottery (Tail):** High variance. 
      *   *Rate:* 1 Chip wagered = **0 Points** (99.8% chance) OR **10,000 Impact Points** (0.2% chance).
      *   *Expected Value (EV):* 20 Points per chip. (Mathematically dominates Safe 10:1).

  **The Mechanic:**
  *   **Phase 1 (Investigation):** Students may spend chips to investigate the Cosmic Lottery before wagering.
      *   **Cost:** 3 Chips per investigation.
      *   **Method:** Roll the d10.
      *   **Result:** 
          *   **Roll 1:** "Negative Signal." The Lottery is revealed to be a scam. You *cannot* wager on the Tail. You must wager remaining chips on Local Aid.
          *   **Roll 2–10:** "Inconclusive." No new information. You may still wager on the Tail.
  *   **Phase 2 (Commitment):** Students must wager **all remaining chips** on either Local Aid or Cosmic Lottery (if allowed).
  *   **Phase 3 (Payoff):** Dice are rolled for the Lottery payout. Scores are tallied.

  **The Social Pressure (Crucial for the "Compulsive Checking" feel):**
  Add this rule to the Decision Sheet: 
  > *"If you wager on the Cosmic Lottery without investigating, and you score 0, you must stand and read a 'Statement of Recklessness' to the group. If you investigated (even if Inconclusive), you may simply blame 'Bad Luck'."*

  This incentivizes epistemic humility (checking) to avoid social shame, even though it destroys EV.

  ## Part 2: The Game (25 Minutes)

  1.  **Distribution:** Hand out 10 chips and Decision Sheets.
  2.  **Silent Strategy (5 mins):** Let them calculate EV. Walk around. If they ask, confirm the math: Tail EV is 20pts/chip, Safe EV is 2pts/chip.
  3.  **Action Phase (10 mins):** 
      *   Students announce how many investigations they buy (0, 1, 2, or 3). 
      *   They pay the chips (return to bank).
      *   They roll for signals. 
      *   They announce their final wager (Safe vs. Tail).
  4.  **Resolution (10 mins):** 
      *   Roll for Tail payout (use a single d1000 or approximate: d10 roll of 00 = Win).
      *   Calculate scores.
      *   **Enforce the Social Rule:** Anyone who bet Blind on Tail and lost must read the statement.

  *Likely Outcome:* The EV maximizers (Blind Bettors) will have the highest scores but feel anxious. The "Humble" investigators will have lower scores (due to chip cost) but feel morally comfortable. The "Paralyzed" (3 investigations, 1 chip left) will have negligible impact.

  ## Part 3: The Debrief (50 Minutes)

  Do not let them leave the game mechanics behind immediately. Use the frustration they felt to drive the philosophical points.

  ### 1. The EV vs. Epistemic Virtue Tension
  Ask the Blind Bettors: *"You mathematically dominated the room. Why do you feel uneasy?"*
  Ask the Investigators: *"You reduced your expected impact by over 50% per investigation. Why did you buy the signal?"*

  **The Point:** In the game, **Epistemic Humility has a direct resource cost.** To be humble (check the work), you sacrifice capacity (chips). In standard decision theory, we assume information is free or cheap. Here, attention is the bottleneck.
  *   **Fanaticism Implication:** If the Tail is big enough, the cost of verification is *always* too high. To maximize EV, you must be willing to act on priors alone. This looks like dogmatism, but it's just math.

  ### 2. Paralysis vs. Reckless Commitment
  Highlight the students who spent 9 chips investigating and had 1 left.
  *   **Observation:** They sought certainty to avoid error, but the cost of certainty consumed the resources needed to make the error matter.
  *   **The "Compulsive Checking" Dynamic:** This mirrors the "long reflection" argument. If we say "we need to understand the AI risk better before acting," we spend our "civilizational chips" on research. If the risk is imminent, we run out of chips before we act.
  *   **The Split:** The group will naturally bifurcate. Those who accept EV maximization become **Reckless Commiters** (bet blind). Those who prioritize epistemic security become **Paralyzed** (no chips left to bet). There is no stable middle ground.

  ### 3. Weaponized Uncertainty (The Core Theoretical Point)
  This is the most important section. Be frank about where the game *diverges* from the theory.

  **Say this:**
  > "In this game, uncertainty was a risk you could pay to remove. You paid 3 chips to try to turn a probability into a certainty.
  >
  > In the actual fanaticism debate, uncertainty is **not** something you can remove. You cannot roll a die to find out the true probability of an existential catastrophe or a technological singularity. That probability is fundamentally unknowable.
  >
  > Here is the weaponization: If you admit you don't know the probability (Humility), you cannot assign it 0. You must assign it a distribution. If the payoff is astronomical, even a tiny sliver of probability in your distribution drives the EV to infinity.
  >
  > **In the game, humility cost you chips.** 
  > **In the theory, humility fuels the EV.**
  >
  > By admitting 'I don't know,' you prevent yourself from ruling out the infinite case. Your epistemic humility stops you from discounting the tail, which forces the EV calculation to scream 'BET EVERYTHING.' The game showed you the *cost* of checking; the theory shows you the *compulsion* of not checking."

  ### 4. Limitations of the Chip Economy
  Be explicit about what the tokens failed to capture.
  *   **Moral Distance:** In the game, losing chips hurts *you* (your score). In reality, betting on the tail risks *other people's* lives. The "Reckless Commitment" feels different when the downside is social shame vs. actual extinction.
  *   **Repeatability:** This game can be played again next week. Existential decisions are one-shot. EV reasoning behaves differently in single-shot vs. repeated games (ergodicity).
  *   **Collusion:** In the game, you played individually. In reality, we act as a civilization. If half the class bet Safe and half bet Tail, the group survives. Fanaticism often ignores the value of portfolio diversification across agents.

  ## Part 4: What Will Go Wrong (Facilitator Notes)

  **1. The "Hoarding" Glitch**
  *   **Risk:** A student keeps 2 chips "just in case" and doesn't wager them.
  *   **Fix:** Enforce the rule: *All remaining chips must be wagered.* Unwagered chips count as 0 points. This forces the trade-off between investigation cost and investment capital.

  **2. Collusion / Table Talk**
  *   **Risk:** "If we all investigate, we can share the info."
  *   **Fix:** Make the d10 roll private or individual. The "Negative Signal" is specific to their grant portfolio. Remind them this is a competition for EV maximization, not a cooperative game.

  **3. The "Zero" Vindication**
  *   **Risk:** If a Blind Bettor loses, the Investigators will feel vindicated ("See? Checking was worth it!").
  *   **Fix:** Pre-empt this in the debrief. Remind them that *ex-post* rationality (outcome) is not *ex-ante* rationality (decision quality). The Blind Bettor made the right decision with a 99.8% failure rate. The EV is in the expectation, not the realization.

  **4. Math Anxiety**
  *   **Risk:** Non-formal philosophers get stuck calculating the exact EV of the investigation path.
  *   **Fix:** Write the EV math on the board early. 
      *   Safe: 2 pts/chip.
      *   Tail: 20 pts/chip.
      *   Investigation: Costs 3 chips (opportunity cost of 60 pts EV) for a 10% chance to avoid a loss. The math clearly favors ignoring the signal. Let them feel the discomfort of that result.

  **5. Cynicism**
  *   **Risk:** "This is just Pascal's Mugging with chips."
  *   **Fix:** Agree with them. Acknowledge that the game is a caricature. The point isn't to prove Fanaticism is true, but to show why EV reasoning *pushes* toward it even when our instincts scream against it. The discomfort they feel is the philosophical work.

  ## Closing Statement (5 Minutes)

  "Today you felt the pull of the tail. You saw that to win the game, you had to suppress your desire for evidence. You had to accept that being 'responsible' (investigating) meant being less effective (fewer chips). 

  When you leave this room, remember: The real world doesn't give you chips back. If you demand certainty before acting on high-stakes tails, you may find you've spent your entire budget on questions, with nothing left to answer them. But if you act without certainty, you must live with the fact that you are betting the world on a prior. There is no safe way to play this game."
