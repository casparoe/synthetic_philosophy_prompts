  8.  **Writing the Response:** (Iterative refinement for clarity and tone). *Make sure to explicitly state which commitment has to give.* *Ensure the "cheapest revision" is actionable.*

      *   *Correction on (4):* MaxEnt *does* require a base measure. If the user thinks MaxEnt solves it *ab initio*, that's a misconception. I need to point out that MaxEnt + Symmetry = Jaynes, but MaxEnt alone doesn't fix the base measure problem.
