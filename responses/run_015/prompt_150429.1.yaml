  ### The Principle of Non-Dominance in the Civic Sphere
  **1. The Civic Sphere (State & Shared Infrastructure) must remain neutral.** No specific cultural or religious norm should be imposed by the state, funded by the state, or allowed to define the rules of shared public infrastructure.
