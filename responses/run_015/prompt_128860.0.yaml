      *   **Constraints:** No literature recommendations (working offline). Act as a careful, sympathetic referee (believes in the project, skeptical of this specific measure).

  2.  **Analyze the Draft Sketch:**
      *   **Concept:** *Arbitration Bandwidth*. Valence = signed control parameter. Moral status scales with the complexity of the arbitration among these parameters.
      *   **Key Condition:** Weights must be *revisable* in light of the system's history (learning/adaptation), not fixed at design time.
      *   **Cases:**
          *   Thermostat: 0 bandwidth (fixed mapping). Even with cost setpoint, if weights are fixed, it's mechanical.
          *   Insects: Non-zero, low. Trade-offs exist (food vs. risk), weights shift based on state/learning.
          *   Humans/High Animals: High bandwidth. Self-model acts as a high-influence competitor, recruiting memory/anticipation.
      *   **Objections Addressed:**
          *   Thermostat + Cost: Rebutted via fixed weights vs. revisable weights.
          *   The "Cliff" (Self-Model): Rebutted by treating self-model as just another (influential) competitor, not a metaphysical switch.
      *   **Unsettled Worry:** Aggregation. Does bandwidth aggregate across individuals? (Many insects vs. one bird). Proposal: "Total amount of defeat" (overridden concerns per unit time).

  3.  **Drafting the Referee Report (Iterative Process):**

      *   **Tone:** Sympathetic but critical. Professional, philosophical, precise. Acknowledge the ambition of the gradational project.
      *   **Section 1: The Revisability Condition.**
          *   *Thought:* The user worries they changed the subject. The distinction is between *adaptive control* and *fixed control*.
