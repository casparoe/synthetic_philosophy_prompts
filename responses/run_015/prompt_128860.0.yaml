      *(Refining the Self-Model point)*: The strongest discontinuity objection is about *unity*. A self-model unifies the arbitration. Without it, are there just disparate pulls? The "competitor" model assumes the arbitration happens *for* someone. If there's no self, who is the arbitration happening *for*?

  4.  **Final Polish:** Check against constraints. (No literature, 4 specific things, referee tone).

      *   *Structure:*
