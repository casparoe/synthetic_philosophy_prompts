      *   *Wait, one more check on Revisability:* The user asks if the thermostat defender can accept it. If I say "Yes, a learning thermostat revises weights," then the condition fails to exclude the thermostat. I need to point out that *adaptive control* is not *moral relevance*. The condition needs a normative gloss, not just a functional one.

      *   *Wait, one more check on Self-Model:* The user asks for the strongest version of the discontinuity objection stripped of hand-waving. It's not just "representation." It's about the *unity of the arena*. Without a self, is it one system suffering or many micro-sufferings? The gradationalist says many micro-sufferings. The discontinuity theorist says without a self, there is *no* suffering, only error signals. The "competitor" model assumes the arbitration is *felt*.

