answer: |-
  **Referee Report on Draft Section: "Arbitration Bandwidth and Moral Status"**

  **General Assessment**
  The project is ambitious and, in my view, worth pursuing. The move from a multi-dimensional "scale" to a unified measure of *arbitration bandwidth* is a significant improvement in theoretical clarity. You have successfully isolated a functional property (competitive arbitration with revisable weights) that plausibly tracks our intuitive gradations of cognitive sophistication. However, while the measure distinguishes thermostats from insects better than your previous draft, I remain unconvinced that it bridges the gap to moral status without smuggling in additional premises. Below I address your four specific requests.

  **1. The Revisability Condition**
  You ask whether the revisability condition does real work or whether the thermostat objection can be re-run. I believe the condition does real work, but not the work you need it to do.

  A defender of the sharp cutoff can accept your condition and simply argue that *adaptive control* is not *moral relevance*. Consider a machine-learning thermostat that adjusts its temperature/cost exchange rate based on seasonal history to maximize efficiency. It satisfies your criteria: it registers signed quantities, they compete, and the weights are revised by history. If you deny this system moral status (as I suspect you do), then revisability is insufficient. If you grant it moral status, you have bitten a bullet that many in your audience will reject.

  The condition distinguishes *rigid* systems from *flexible* systems, but it does not yet distinguish *instrumental* flexibility from *welfare-based* flexibility. For the measure to work, the "history" that revises the weights must be a history of *valenced experience*, not just a history of input-output optimization. As it stands, the definition is purely cybernetic. You need to explain why weight-revision driven by *pain* is morally different from weight-revision driven by *error-correction*, or else admit that your measure tracks cognitive complexity rather than moral status directly.

  **2. The Self-Model and the Discontinuity Objection**
  Yes, the treatment of the self-model is the weakest link in the sketch. Your strategy is to functionalize the self-model: treat it as just another competitor with high influence. The strongest version of the discontinuity objection, stripped of hand-waving, is not about influence but about *unity*.

  The objection is this: Arbitration implies an arena in which the competition takes place. In a system without a self-model, there is no single entity *for which* the competition is resolved; there are only local resolutions of local conflicts. When a self-model enters the picture, it does not just add weight to one side of the ledger; it unifies the ledger itself. It changes the system from a bundle of competing processes into a single subject of experience.

  If moral status attaches to *subjects*, then the arrival of a self-model is not a large increase along a scale; it is the creation of the thing that *has* the status. Your "competitor" model assumes the arbitration is already happening *for someone*. The discontinuity theorist claims that without the self-model, there is no "someone" to whom the defeat matters. To defend your view, you must argue that moral status can attach to disunified systems (the bundle view), not merely that the self-model is functionally continuous with other control parameters.

  **3. Aggregation and "Total Defeat"**
  Regarding your proposal that what aggregates is "the total amount of defeat... per unit time": This is a disguised version of **summed preference frustration**, but it carries a specific implication that renders it incoherent as a measure of *status*.

  Moral status is typically understood as a *capacity* property (how much it matters what happens to you), whereas "defeat per unit time" is an *occurrence* property (how much is currently going wrong for you). If status is determined by total defeat, then a system in a state of high conflict (many concerns overridden) has higher moral status than a system in a state of harmony (few concerns overridden), all else being equal. This implies that inducing neurosis or conflict in a system *increases* its moral standing.

  Furthermore, this does not solve your aggregation worry. If a bird has high bandwidth but low defeat, and a million insects have low bandwidth but high defeat, your formula suggests the insects outweigh the bird. You stated you find this hard to accept. If so, "total defeat" is not a solution to the aggregation problem; it is a formalization of the view you are trying to avoid (pure utilitarian aggregation of negative states). You need a measure that tracks the *depth* of the potential for defeat (capacity), not just the *volume* of actual defeat (occurrence).

  **4. Ranking of Weak Points**
  Here are the four weakest points in the sketch, ranked from most to least likely to sink the paper at the workshop:

  1.  **The Aggregation Proposal:** It conflates moral status (capacity) with moral weight of current states (occurrence) and implies that internal conflict boosts moral standing, which is counterintuitive.
  2.  **The Self-Model Reduction:** Treating the self-model as merely another competitor fails to address the metaphysical objection that selfhood creates the *subject* to whom status attaches, rather than just adding weight to a decision.
  3.  **The Revisability Condition:** It relies on a functional definition of learning that may admit advanced AI or thermostats, forcing you to either grant them status or add a non-functional constraint you haven't defined.
  4.  **Operationalization:** Even if the theory is sound, "arbitration bandwidth" is difficult to measure empirically across species, leaving the view theoretically precise but practically inert for guiding action.

  **Summary**
  You have a robust functional account of cognitive complexity, but you have not yet secured the bridge to *moral* status. The referee's primary concern is that you are measuring *sophistication of control* and labeling it *moral worth* without explaining why the former grounds the latter, particularly when the aggregation and self-model issues suggest the two might come apart. Focus your revision on decoupling status from current suffering (defeat) and addressing the "subjecthood" objection regarding the self-model.
