answer: |-
  To address your specific problematic—epistemic justification in the absence of direct empirical access and under conditions of permanent interpretive underdetermination—we must first recognize that while Peirce and James share a pragmatic maxim regarding meaning, their metaphysical commitments regarding truth and reality diverge sharply. Peirce anchors truth in a normative logic of inquiry destined for a singular convergence, grounded in a scholastic realism that posits the reality of generals (laws and habits). James, conversely, anchors truth in the psychological and biological satisfaction of the believer, grounded in a radical empiricism that treats truth as a pluralistic process of verification rather than a static correspondence.

  Here is the comparative analysis structured according to your requirements.

  ### 1. Peirce: Convergence, Scholastic Realism, and the Fate of the Dispute

  For Peirce, truth is defined as the opinion fated to be agreed upon by the community of inquirers who investigate a matter sufficiently long and well. This definition is not merely sociological; it is metaphysical. It presupposes that reality acts as a constraint on inquiry, forcing the community toward a single destination. In the context of your high-energy physics scenario, where a model yields accurate predictions but the ontological status of its mathematical structures (e.g., gauge redundancies) remains permanently disputed, Peirce's framework encounters significant tension.

  Peirce would likely argue that if the dispute over ontological status is *meaningful*, it must eventually be resolvable by the logical evolution of inquiry. If the community remains permanently divided, Peirce has two potential responses, neither of which comfortably accommodates the scenario as described:

  1.  **The Dispute is Meaningless:** Applying his Pragmatic Maxim, Peirce would argue that if two competing ontological interpretations of the mathematical structure yield no difference in conceivable practical consequences, they are not actually different beliefs. The "truth" lies in the predictive habits and the mathematical relations themselves, which *do* converge. The ontological disagreement would be dismissed as metaphysical noise. In this reading, the community *has* converged on the only truth that matters (the structural laws), and the ontological division is illusory.
  2.  **The Inquiry is Incomplete:** If the ontological distinction *does* make a difference, Peirce's fallibilism dictates that the current division is temporary. His account relies on a regulative hope: that reality is intelligible and that inquiry, if pushed far enough, will resolve the ambiguity. To accept *permanent* division on a meaningful question is to abandon the logical hope that underpins scientific investigation for Peirce.

  Therefore, Peirce cannot easily accept a "purely instrumental consensus" as the final resting place if the inquirers themselves feel there is a genuine ontological question at stake. For Peirce, the predictive success confirms the reality of the *laws* (the generals), but truth requires that the *interpretation* of those laws eventually stabilize. If the division is truly permanent, Peirce is forced to categorize the ontological question as empty, reducing the truth of the theory to its structural invariance. He resists the idea that truth is merely "what works now"; it must be "what we are destined to understand ultimately."

  ### 2. James: Utility, Radical Empiricism, and Local Truth

  James's account offers a more flexible topology for your scenario. For James, truth is not a static property awaiting discovery at the end of inquiry; it is something that *happens* to an idea. An idea becomes true insofar as it proves itself to be good in the way of belief, specifically by guiding us through experience satisfactorily.

  In the case of the predictive scientific model, James would focus on the "cash value" of the belief. The model generates accurate forecasts; it allows physicists to manipulate particle interactions successfully. For James, this successful navigation of experience is the primary verification. The lack of settled physical interpretation regarding infinite-dimensional representations does not negate the truth of the model, because the truth is located in the *process* of verification (the successful prediction), not in a final metaphysical picture.

  Crucially, James's pluralism allows for the possibility that multiple, logically incompatible ontological interpretations could coexist as "true" if they serve different experiential needs for different sub-communities. If the realist interpretation satisfies the theoretical physicist's need for a coherent worldview, and the instrumentalist interpretation satisfies the experimentalist's need for calculation without metaphysical baggage, James can accommodate both. He does not require a single, final consensus. For James, the "permanent division" is not a failure of epistemology; it is a reflection of the pluralistic nature of reality and human interest. Truth is sufficient when it connects the believer to the experience successfully; it does not require the closure of ontological debate. The predictive efficacy is a sufficient ground for *local* truth, even if global ontological closure is unavailable.

  ### 3. The Precise Point of Divergence

  The divergence between Peirce and James in this specific context turns on the **teleology of consensus** and the **status of the unobservable**.

  *   **Teleology of Consensus:** Peirce requires a singular, asymptotic convergence of opinion as the *definition* of truth. If the community is permanently divided, Peirce's definition implies either that the truth has not been found (pessimism about current science) or that the question is meaningless (dismissal of the ontology). James requires no such asymptotic limit. For James, consensus is useful but not constitutive of truth. Truth can be fragmented and plural. The divergence is starkest here: Peirce views permanent underdetermination as a threat to the logical coherence of truth; James views it as a natural feature of a pluralistic universe.
  *   **Status of the Unobservable:** Peirce is a scholastic realist; he believes the "real" exists independently of what anyone thinks, but it is knowable through the final opinion. He is committed to the idea that the structures governing predictions are real *generals*. James is more nominalist in practice; the "real" is what exerts a force in experience. For Peirce, the mathematical structure *is* the reality we are converging upon. For James, the mathematical structure is a tool that *leads* us to reality (the predictions), but the tool itself need not correspond to a singular ontological entity to be "true."

  The precise friction point is this: Peirce demands that the *reason* for the predictive success eventually be agreed upon (the ontology must stabilize or be dissolved). James demands only that the *use* of the model be verified in experience (the ontology can remain fluid).

  ### 4. Evaluation: Coherence on Irreducible Underdetermination

  In the specific context of irreducible theoretical underdetermination where observational resolution is permanently unavailable, **James's framework offers the more coherent response.**

  Peirce's system is structurally ill-equipped to handle *permanent* divergence without collapsing into skepticism or semantic dismissal. His definition of truth is essentially counterfactual: it is what *would* be believed under ideal conditions. If the ideal conditions (infinite inquiry) yield permanent division, the counterfactual fails to designate a unique truth. To save his system, Peirce must insist that the ontological dispute is meaningless (via the Pragmatic Maxim), which may feel like a forced resolution to scientists who feel the ontological question is genuine. His commitment to the "One Truth" creates a tension with the empirical reality of persistent theoretical pluralism in fields like high-energy physics.

  James, by contrast, naturalizes the underdetermination. By decoupling truth from final consensus and coupling it to present verification and satisfactoriness, he allows the scientific community to claim knowledge (truth) about the predictions without requiring knowledge about the underlying ontology. His framework validates the epistemic status of the model *as it is used*, rather than deferring its justification to a future resolution that the scenario stipulates will never come.

  **Ambiguities and Caveats:**
  However, there is an ambiguity in James's position that warrants flagging. His criterion of "satisfactoriness" can appear too subjective. If "truth" is what proves good to believe, what prevents a physicist from adopting an ontological interpretation that is psychologically comforting but theoretically regressive? James relies on the constraint of "experience," but in high-energy physics, "experience" is heavily theory-laden. If the experience is just "reading the dial," James risks sliding into a crude instrumentalism that ignores the theoretical depth science aims for.

  Conversely, Peirce's ambiguity lies in his Pragmatic Maxim. While his metaphysics demands convergence, his maxim suggests that distinctions without practical differences are empty. This actually aligns him closer to the instrumentalist view than his scholastic realism admits. If the ontological dispute makes no difference to the "habits of action" (predictions), Peirce *should* be comfortable with the division, treating it as non-cognitive. The tension in Peirce is between his logic of science (which demands convergence) and his semantics (which dissolves the dispute).

  **Conclusion:**
  For your chapter, James provides a more robust justification for claiming epistemic warrant in the face of permanent ontological underdetermination, as he does not tie justification to a future consensus that is stipulated as impossible. Peirce offers a stronger account of the *reality* of the scientific laws themselves but struggles to account for the legitimacy of permanent interpretive pluralism without declaring the dispute void. James allows the dispute to remain live while affirming the truth of the practice; Peirce requires the dispute to be resolved or dissolved to affirm the truth of the inquiry.
