prompt: |-
  I am a doctoral student in philosophy of science, currently drafting a chapter on epistemic justification in contexts where direct empirical access to the entities described by our best theories remains permanently unavailable. I have been working through the pragmatist tradition, but I find that standard textbook treatments of Peirce and James do not address the specific problem I am facing. Please act as an expert in American pragmatism and philosophy of science. Before you construct your answer, take a moment to brainstorm the core structural differences between Peirce's convergence-oriented, fallibilist account of truth and James's radical-empiricist account that ties truth to the practical consequences and experiential verification of beliefs.

  With that groundwork in place, I want you to compare these two theories specifically with respect to the following scenario: a predictive scientific model—such as those employed in high-energy physics—generates consistently accurate forecasts about particle interactions, yet the mathematical structures it employs, including infinite-dimensional representations and gauge redundancies, lack any settled physical interpretation, and the scientific community remains permanently divided over their ontological status. In other words, the model works predictively, but there is no prospect of an observational resolution to the interpretive dispute.

  Please think carefully and step through your reasoning. First, articulate Peirce's view in your own words: does his notion of truth as the opinion destined to be agreed upon by an unlimited community of inquirers require that predictive success eventually converge on a single ontological interpretation, or can the community stabilize on a purely instrumental consensus? Second, articulate James's view: does his emphasis on truth as what proves itself in experience allow us to treat predictive efficacy itself as a sufficient ground for local truth, even if ontological questions remain unsettled? Third, identify the precise point at which the two accounts diverge in this case—whether over the role of consensus, the necessity of ontological commitment, or the standards for verification. Finally, evaluate which framework offers the more coherent response to irreducible theoretical underdetermination, and flag any ambiguity in either position that makes them hard to separate on this specific issue. Please do not include bibliographies, reading lists, or citations; I need conceptual clarification rather than scholarly apparatus. Also, avoid simply summarizing the standard Peirce-versus-James dichotomy—focus your comparison on how each theory handles scientific success without interpretive closure.
