prompt: |-
  ok so im 16 and ive gotten kind of obsessed with this Nietzsche idea (from his genealogy book, I think thats what its called, my history teacher mentioned it): the idea that our moral words are basically weapons, or leftovers of a power fight. Like "good" originally just meant "the kind of thing the strong dudes do," and then the weak people flipped it out of resentment and started calling being humble and harmless "good." I use this move constantly now — whenever someone says something is just wrong I ask who benefited from everyone believing that. It feels like it explains everything, which is probably a red flag.

  Heres what im actually worried about. My friend says the story is unfalsifiable — like whatever we find, you can always say the power thing is buried deeper down. So: what would actually count against it? Not "morals are real, man," I mean real defeaters. I made up some tests myself: (1) the direction test — if the resentment-flip story is true, a moral word should never show up first among the people at the top and get handed downward; so if we found some old law code or burial stuff where the kings are the ones praising mercy while poorer people are still praising strength, thatd count against it. How much? (2) the no-payoff case — a rule everybody follows that clearly costs the powerful and gets them zero obedience or status points, like sharing food in a famine when nobody's watching. Does that break the story or can it always be explained away? (3) if the story is what makes the demand lose its grip on you, then learning the ugly origin should actually weaken the pull of the rule — and honestly when I think "yeah maybe 'be nice' came from weak people resenting strong ones," I still feel like being nice. Is that a real problem for the view or am I confused about what its even claiming?

  Can you rank the defeaters from fatal to just awkward, and include the ones people who like this Nietzsche story would themselves admit count against them, not just the ones critics yell about. Also be honest about whether its been patched up so much that nothing could really touch it — and whether that even matters for a view like this. oh and: does any of this decide whether I should still try to be good, or is it just history? Please write in American english and keep it plain, im not a philosophy grad student lol. thx
