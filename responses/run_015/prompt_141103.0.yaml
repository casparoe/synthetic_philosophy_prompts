          3.  Psychological Efficacy (Does knowing the origin stop the feeling?).
      *   **Requirements:** Rank defeaters (fatal to awkward), include internal criticisms (what Nietzscheans admit), address if it's "patched up" (unfalsifiable), address the "should I still be good" question, use plain American English, no jargon overload.

  2.  **Deconstruct Nietzsche's Genealogy (Simplified for a 16-year-old):**
      *   *Core Idea:* Morality isn't divine or pure reason; it's history. "Good" started as "noble/strong" (Master Morality). Then the weak/priests flipped it (Slave Morality) to say "meek/humble = good" as a way to win against the strong without fighting.
      *   *The User's Interpretation:* Moral words are weapons/leftovers of power fights.
      *   *The Risk:* Cynicism ("Everything is just power") can become a trap where nothing matters.

  3.  **Evaluate the User's Proposed Tests:**

      *   *(1) The Direction Test:* If kings praised mercy *before* the priests did.
          *   *Nietzschean Response:* Nietzsche actually admits masters can be generous, but it's *condescending* generosity, not "moral duty." If we found evidence that "mercy" was the *primary* value of the warrior class *before* the slave revolt, that hurts the specific historical narrative.
          *   *Verdict:* Strong defeater for the *historical claim*, but maybe not the *psychological insight*.

      *   *(2) The No-Payoff Case:* Anonymous altruism (sharing food when no one sees).
          *   *Nietzschean Response:* Nietzsche would say you *do* get a payoff: internal status, feeling superior to your instincts, or avoiding guilt (which is internalized cruelty). It's hard to falsify because "payoff" can be psychological.
          *   *Verdict:* Awkward, but easily explained away by the theory (internalized power).

      *   *(3) Psychological Efficacy:* Knowing the origin doesn't stop the feeling.
          *   *Nietzschean Response:* Nietzsche didn't think knowing the history instantly frees you. He called it a "disease" you have to recover from. Just knowing germ theory doesn't cure the flu instantly.
          *   *Verdict:* Not a defeater. Nietzsche expects resistance.

  4.  **Identify Other Defeaters (Internal & External):**
      *   *Universal Morals:* Are there morals found in *every* culture regardless of power structure? (e.g., care for children).
      *   *Self-Undermining:* If *all* ideas are just power moves, is Nietzsche's idea just a power move? (The "Self-Referential" problem).
      *   *Biology/Evolution:* Some morals might be evolutionary hardwiring (kin selection), not just cultural power struggles.

  5.  **Address the "Unfalsifiable/Patched Up" Concern:**
      *   Yes, there's a risk. If every counter-example is explained as "hidden power," it becomes a conspiracy theory.
      *   *Nuance:* Nietzsche wasn't trying to build a scientific system like physics. He was offering a *perspective* to shake us up.
      *   *Does it matter?* For a "diagnostic" tool, maybe not. For a "truth claim," yes.

  6.  **Address the "Should I still be good?" Question:**
      *   Crucial for a 16-year-old.
      *   Nietzsche doesn't say "be evil." He says "create your own values."
      *   Genealogy is history, not necessarily a command to stop being nice. But it asks *why* you are nice. Is it fear? Or is it your own choice?

