      *   **Step (6):** True, the universe is finite.
      *   **Step (7):** **Here is the major sleight of hand.** This step conflates "finite duration" with "pointlessness." Scheffler explicitly addresses this. His point is that the *existence* of a future matters, not the *duration* of that future. The "Afterlife Conjecture" is about the *relationship* between the present and the future, not the *ultimate endurance* of the future.
      *   **Step (8):** Follows from (7). If (7) is wrong, (8) doesn't land.
      *   **Step (9):** Follows from (8).

