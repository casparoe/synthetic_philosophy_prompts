      *   (4) Claim: Even this act depends on a background framework (music, beauty) that requires humanity to continue. If humanity ends *immediately*, the framework collapses.
      *   (5) Conclusion from (4): *Every* value is anchored to an *indefinite* human future.
      *   (6) Fact: The human future is necessarily finite (heat death, etc.).
      *   (7) Inference: Therefore, all value is temporary, and temporary value ending in annihilation is ultimately pointless.
