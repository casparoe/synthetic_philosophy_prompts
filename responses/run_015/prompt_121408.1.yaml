      *   Scheffler distinguishes between the *Afterlife Conjecture* (we care that people survive us) and the *Infinity Requirement* (we need people to survive forever). He rejects the Infinity Requirement.
      *   Therefore, Step (7) is the non-sequitur. Step (5) is also slightly off regarding "indefinite."

  5.  **Formulate the Response:**
