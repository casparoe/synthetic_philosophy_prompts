  *   **Single *De Re*:** Yes, about *Vase-09*.
  *   **Hard Direction:** TWI=True, CT=Indeterminate.
  *   **No Stipulation:** The symmetry arises from the physical scenario (equidistant shade variation), not a stipulated relation.
