  **Intertranslatability Objection:**
  Your opponent claims the views are notational variants. This case refutes that. Notational variants must preserve truth values. Here, TWI assigns **True**, CT assigns **No Truth Value**. You cannot translate "True" to "Indeterminate" without changing the logic. Furthermore, CT treats modality as context-sensitive (pragmatic), while TWI treats it as essence-based (metaphysical). If the dispute were verbal, adjusting the "notation" (counterpart weights) would resolve the indeterminacy. But in this symmetric case, no weight adjustment resolves it without arbitrary preference. The divergence in truth conditions proves the dispute is substantive: one theory allows truth-value gaps in *de re* modality, the other does not.

  **Iterated Modality Lever:**
  You asked about iterated modality ("Could have been possible that..."). This is a red herring for your bet. Lewis handles iteration via counterparts of counterparts. The real lever is **Uniqueness**. TWI enforces one-to-one identity across worlds; CT allows one-to-many. Your case exploits this: TWI forces a unique identity in $W$ (violating symmetry), CT accepts multiple counterparts (forcing indeterminacy). That is a logical difference, not a verbal one.
