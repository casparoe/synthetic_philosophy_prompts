answer: |-
  **MEMORANDUM**

  **TO:** Chair, Civic Engagement Advisory Panel; Board of Education, Riverside Unified School District
  **FROM:** Junior Student Delegate, Civic Engagement Advisory Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Charter Amendment 9-C (Voting Eligibility Expansion)

  **Purpose**

  This memo serves to transmit the undersigned's formal recommendation regarding Charter Amendment 9-C, currently under deliberation by the Civic Engagement Advisory Panel. The amendment proposes two distinct expansions of the electorate for school-budget referenda: lowering the voting age to sixteen contingent upon completion of a district-certified civic literacy module, and extending ballot access to non-citizen residents who have maintained continuous local property tax payments for five years without federal tax delinquency. After reviewing the testimony from the October 19 session and evaluating the competing philosophical frameworks presented, I recommend **Conditional Approval with a Phased Rollout Timeline**.

  **Analysis of Competing Principles**

  The debate surrounding Amendment 9-C rests on a tension between two legitimate theories of political legitimacy. The first, stakeholder theory, posits that legitimate authority requires the consent of all those significantly governed by fiscal policy. Under this view, sixteen-year-olds, who are the primary consumers of district services, and long-term non-citizen residents, who fund the district through property taxes, possess a moral claim to representation equivalent to that of traditional voters. Excluding them creates a deficit of democratic consent.

  However, the recommendation provided herein must account for the strongest philosophical argument opposing this expansion: the principle of democratic sovereignty. This objection is not merely procedural but constitutive. It argues that the franchise is not simply a reward for economic contribution or affected interest, but a defining boundary of the political community itself. In this view, voting is an exercise of national sovereignty delegated to the local level, inextricably linked to citizenship and allegiance to the constitutional order. To decouple voting from citizenship, even in limited local contexts, risks fragmenting the shared civic identity that sustains public institutions. This concern regarding the cohesion of the political body is substantial and must not be dismissed as exclusionary prejudice; it is a safeguard for the long-term stability of the governance structure.

  **Recommendation and Conditions**

  To balance the immediate need for inclusive representation with the long-term imperative of civic cohesion, I recommend Conditional Approval. This approach validates the stakeholder claim without permanently altering the district's charter before empirical data on civic impact is gathered. Implementation must adhere to the following specific conditions:

  1.  **Phased Pilot Program:** Amendment 9-C shall be enacted as a four-year pilot program, covering two full election cycles. Following this period, the Advisory Panel must review turnout data, demographic participation, and budget referendum outcomes before recommending permanent adoption.
  2.  **Civic Literacy Module:** The civic literacy module is a mandatory prerequisite for sixteen- and seventeen-year-old voters. This requirement acknowledges the developmental distinction between minors and adults, ensuring that expanded access is paired with demonstrated competency in district governance structures.
  3.  **Non-Citizen Verification:** Eligibility for non-citizen residents requires documented proof of five years of continuous property tax payment and a sworn affidavit regarding federal tax status. This ensures that ballot access is reserved for those with a verified, long-term economic stake in the district.
  4.  **Uniformity of Compulsory Participation:** Regarding the question of compulsory participation, this memo recommends that **voting remain voluntary for all categories**, including traditional citizens, new minor voters, and eligible non-citizen residents. Compulsory voting would undermine the expressive nature of the ballot. However, regarding *eligibility* requirements, uniformity is neither practical nor principled. The civic literacy module should apply *only* to the minor cohort as a developmental safeguard. It should not be applied to non-citizen residents, whose eligibility is predicated on economic stakeholding rather than age-based competency, nor should it be applied retroactively to traditional adult citizens, as this would constitute an unconstitutional barrier to entry. Distinct eligibility pathways are permissible provided they serve a rational district interest.

  **Conclusion**

  Conditional Approval allows the Riverside Unified School District to test the hypothesis that broader inclusion enhances fiscal legitimacy without irrevocably committing to a structural change that may conflict with broader sovereignty norms. By limiting the civic literacy requirement to the minor cohort and maintaining voluntary participation across all groups, the District can honor the contribution of long-term residents and students while preserving the integrity of the electoral process. I request that this recommendation be entered into the official minutes and considered prior to the final vote this Thursday.

  Respectfully submitted,

  Junior Student Delegate
  Civic Engagement Advisory Panel
  Riverside Unified School District
