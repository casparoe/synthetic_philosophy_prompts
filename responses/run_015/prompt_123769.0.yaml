answer: |-
  ### Ontological Distinctions: Where the "Essence" Lives

  Most theories fail because they conflate levels. To meet your bidirectional goal (read unseen, generate style), the theory must distinguish:

  *   **Token:** The physical ink or pixels on a specific surface. (Irrelevant to identity; two tokens of the same glyph are never identical).
  *   **Glyph:** The specific visual shape (e.g., a double-storey 'a').
  *   **Allograph:** Contextual variants of a letter treated as equivalent by the reader (e.g., 'a' vs 'ɑ' vs 'A').
  *   **Type:** The abstract category ('a' as a functional unit).
  *   **System:** The writing script (Latin, Cyrillic, Greek) that assigns function to the Type.

  **Verdict on Essence:** The "essence" of a letter cannot live at the Token or Glyph level (too variable) nor solely at the Type level (too abstract to capture style). It lives in the **Type's functional role within a System**. An 'a' is an 'a' because of the job it does in the Latin script, not because of its shape. This is the only way to solve the Cyrillic/Latin pixel-identity problem.

  ---

  ### The Requirements List

  Here are the criteria a theory must meet to explain letter identity while supporting your bidirectional system.

  *   **1. Style-Identity Orthogonality**
      *   **Concrete Case:** A ransom note clipped from six fonts. You read the message instantly (identity invariant) but also instantly perceive the mismatched styles (style retained).
      *   **Requirement:** The theory must encode identity and style in separable latent variables. It cannot throw style away to achieve invariance.
      *   **Status:** **Non-negotiable.** (Core to your "generate style" goal).

  *   **2. System-Relative Identity**
      *   **Concrete Case:** Pixel-identical Cyrillic 'а' and Latin 'a'. They are different letters despite identical shapes.
      *   **Requirement:** Identity cannot be determined by visual features alone; it requires a prior assignment of script membership.
      *   **Status:** **Non-negotiable.** (This is the theoretical floor).

  *   **3. Topological Invariance**
      *   **Concrete Case:** Double-storey 'a' vs. single-storey 'ɑ'. They share no geometric overlap yet are the same letter.
      *   **Requirement:** Identity must survive changes in connectivity and stroke count. No single stroke or loop can be essential.
      *   **Status:** **Non-negotiable.**

  *   **4. Structural Generativity (The "g-to-q" Test)**
      *   **Concrete Case:** Seeing one 'g' in a strange display face and sketching a plausible 'q'.
      *   **Requirement:** The theory must model the *relations* between letters, not just letters against a background. It must support analogy: "If 'g' has this tail, 'q' must have *that* tail."
      *   **Status:** **Non-negotiable.** (Core to your "generate alphabet" goal).

  *   **5. Contextual Disambiguation**
      *   **Concrete Case:** 'l', '1', and 'I' are often identical strokes; 'c' vs 'o' in degraded text.
      *   **Requirement:** Identity is probabilistic and dependent on neighbors. The theory must allow top-down feedback from word/sentence level to character level.
      *   **Status:** **Non-negotiable.**

  *   **6. Segmentation Agnosticism**
      *   **Concrete Case:** Cursive script with no gaps between letters.
      *   **Requirement:** The theory cannot assume pre-segmented units. It must hypothesize boundaries as part of the recognition process.
      *   **Status:** **Non-negotiable.**

  *   **7. Graded Membership**
      *   **Concrete Case:** Is 'á' an 'a'? Is 'ª' an 'a'? Is a hand-drawn scribble an 'a'?
      *   **Requirement:** Category boundaries must be fuzzy, not binary. The theory must account for "goodness" ratings without collapsing into pure similarity.
      *   **Status:** **Hobby-horse.** (Important for linguistics, less critical for your engineering goal).

  *   **8. Motor-Visual Coupling** *(Added)*
      *   **Concrete Case:** People recognize letters they can write better than those they cannot; copying Korean shapes is possible without knowing the script.
      *   **Requirement:** The theory should allow production constraints (how a hand moves) to inform recognition priors.
      *   **Status:** **Hobby-horse.** (Useful for biological plausibility, not strictly required for a software system).

  ---

  ### Tensions and Incompatibilities

  *   **The Joint Satisfaction Problem:** **Statistical Robustness (Req 5 & 6)** vs. **Explicit Structural Generativity (Req 4).**
      *   Current architectures force a choice. Systems that excel at segmentation and noise (statistical/connexionist) treat letters as holistic patterns and cannot explain *why* a 'q' follows a 'g' structurally. Systems that model explicit structural relations (symbolic/generative) crumble when segmentation is ambiguous or noise is high. A theory claiming to satisfy both without a hybrid architecture is suspect.
  *   **The "Essence" Trap:** **System-Relative Identity (Req 2)** vs. **Visual Invariance (Req 1 & 3).**
      *   If identity is purely visual (invariant to style), you cannot distinguish Cyrillic 'а' from Latin 'a'. If identity is purely systemic, you cannot explain why a distorted shape stops being an 'a'. The theory must posit a "handshake" between visual evidence and systemic expectation.

  ---

  ### The Killer Requirement

  **System-Relative Identity (Req 2).**
  This knocks out the most candidate theories because it invalidates any theory that relies solely on visual features, geometric moments, or pixel statistics. It demands that the system "knows" which game it is playing (Latin vs. Cyrillic) before it can identify the pieces. Pure vision science models and standard OCR pipelines fail this immediately; they assume the script is known or treat scripts as visually distinct classes rather than functional systems.

  ---

  ### Demoted Prejudices

  *   **"Must be learned from one example":** This is a performance constraint, not a theoretical requirement. A theory can be valid even if it requires more data, provided it explains *how* the generalization happens.
  *   **"Must be a neural net" / "Must be symbolic":** Implementation details. A theory describes the computational problem, not the substrate.
  *   **"Must explain aesthetic response":** Out of scope. You want recognition and generation, not art criticism.
  *   **"Must fit clinical dissociations":** Constraint on human cognition, not necessarily on the engineered system you are specifying.
  *   **"Historical continuity":** Cut. Etymology does not determine current function. A theory of recognition doesn't need to know the history of the Carolingian minuscule.

  ---

  ### The Scorecard: How Current Approaches Fail

  *   **Template Matching:** Fails Topological Invariance immediately; cannot handle the variance between double-storey and single-storey 'a' without infinite templates.
  *   **Structural/Stroke Descriptions:** Fails Segmentation Agnosticism; requires clean edges to find strokes, crumbling on cursive or degraded text.
  *   **Generative Models (Letter Spirit):** Passes Structural Generativity and Style-Identity Orthogonality, but fails Statistical Robustness and Speed on unseen noisy data.
  *   **Modern Convnets/Transformers:** Passes Segmentation and Contextual Disambiguation effortlessly, but fails Structural Generativity (cannot draw a 'q' from a 'g') and System-Relative Identity (treats Cyrillic 'а' as Latin 'a' if context is stripped).
