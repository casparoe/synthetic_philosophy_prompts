  # Seminar Handout: The Logical Space of Logical Uncertainty

  **Instructions:** This decision tree maps the major positions on logical uncertainty. Do not start by looking for the names of the theories. Instead, answer the questions below using the provided test cases. Your path through the tree will locate your philosophical position.

  ### The Decision Tree

  **Q1. The Fact of the Matter (Case 1: The $10^{100}$th digit of $\pi$)**
  *Before you compute the digit, is there a normative fact of the matter about the "correct" credence you should assign (e.g., 0.5), or is asking for a credence here a category mistake?*
  *   **(A) No Fact of the Matter:** There is no objective logical probability before computation.
      *   $\rightarrow$ **GO TO LEAF 1**
  *   **(B) There is a Fact:** There is a rational credence even before computation.
      *   $\rightarrow$ **GO TO Q2**

  **Q2. Precision (Case 5: Sets of Logical Bets)**
  *Assuming there is a fact of the matter, must the rational attitude be a single precise probability, or is it permissible to hold a range (e.g., [0.4, 0.6]) when consistency cannot be verified?*
  *   **(A) Range Permitted:** Rationality allows imprecise credences (credal sets).
      *   $\rightarrow$ **GO TO LEAF 2**
  *   **(B) Point Required:** Rationality requires a single precise credence.
      *   $\rightarrow$ **GO TO Q3**

  **Q3. Logical Omniscience (Case 2: A Long Program)**
  *Consider a program that definitely halts with output 0 or 1, but is too long to run. Must an ideal reasoner assign probability 1 to the true output immediately?*
  *   **(A) Yes:** Ideal rationality requires closure under logical consequence.
      *   $\rightarrow$ **GO TO LEAF 3**
  *   **(B) No:** Ideal rationality respects computational bounds.
      *   $\rightarrow$ **GO TO Q4**

  **Q4. Coherence Requirements (Case 5: Dutch Book Sets)**
  *For a computationally bounded agent, is avoiding a Dutch Book right now a hard normative requirement, or is it acceptable if this requirement is relaxed (e.g., only avoided in the limit) or replaced?*
  *   **(A) Hard Requirement:** You must not be Dutch-bookable now.
      *   $\rightarrow$ **GO TO LEAF 4**
  *   **(B) Relaxed/Replaced:** Coherence is asymptotic or secondary to feasibility.
      *   $\rightarrow$ **GO TO Q5**

  **Q5. Time and Convergence (Case 3: Unprovable Statements)**
  *For a statement that is true but unprovable (or infeasible), is the "correct" credence defined by where your reasoning converges over infinite time, or by the fixed point of your current reasoning state?*
  *   **(A) Diachronic (Limit):** Correctness is defined by long-run convergence.
      *   $\rightarrow$ **GO TO LEAF 5**
  *   **(B) Synchronic (Current):** Correctness is defined by your current state.
      *   $\rightarrow$ **GO TO Q6**

  **Q6. Source of Normativity (Case 4: Self-Prediction)**
  *When reasoning about your own reasoning, is your credence determined by a normative principle (e.g., "trust your future self") or simply by what your algorithm's internal state encodes?*
  *   **(A) Normative Principle:** Credences must satisfy a reflection principle.
      *   $\rightarrow$ **GO TO LEAF 6**
  *   **(B) Internal State:** Credences are identical to the computational output.
      *   $\rightarrow$ **GO TO LEAF 7**

  ---

  ### The Leaves: Positions in Logical Space

  **Leaf 1: The Deflationary View**
  *   **Path:** Q1(A)
  *   **Position:** There is no "logical probability" distinct from proof. Before computation, you simply lack knowledge; assigning a credence is projecting empirical uncertainty onto logical space.
  *   **Key Text:** Traditional logicism; some Wittgensteinian readings.

  **Leaf 2: The Imprecise / Credal-Set View**
  *   **Path:** Q1(B) $\rightarrow$ Q2(A)
  *   **Position:** Logical uncertainty is real, but because we cannot verify consistency, rationality requires a set of probability functions rather than a point.
  *   **Key Text:** Levi (1980); Sturgeon (2008).

  **Leaf 3: Logical Omniscience (Standard Bayesianism)**
  *   **Path:** Q1(B) $\rightarrow$ Q2(B) $\rightarrow$ Q3(A)
  *   **Position:** The ideal agent assigns probability 1 to all logical truths. Logical uncertainty is a failure of idealization, not a distinct epistemic category.
  *   **Key Text:** Hintikka (1962); Standard Bayesian Epistemology.

  **Leaf 4: [UNOCCUPIED] The Bounded Coherentist**
  *   **Path:** Q1(B) $\rightarrow$ Q2(B) $\rightarrow$ Q3(B) $\rightarrow$ Q4(A)
  *   **Diagnosis:** **Incoherent.** A computationally bounded agent cannot verify consistency in time to guarantee synchronic Dutch-book-freeness. Requiring this makes the view impossible to satisfy for non-omniscient agents.

  **Leaf 5: Logical Induction**
  *   **Path:** Q1(B) $\rightarrow$ Q2(B) $\rightarrow$ Q3(B) $\rightarrow$ Q4(B) $\rightarrow$ Q5(A)
  *   **Position:** Credences are evaluated by their limit behavior. A bounded agent is rational if their credences converge to coherence and accuracy over time, even if they are Dutch-bookable today.
  *   **Key Text:** Garrabrant et al. (2016).

  **Leaf 6: Synchronic Reflection / Fixed-Point View**
  *   **Path:** Q1(B) $\rightarrow$ Q2(B) $\rightarrow$ Q3(B) $\rightarrow$ Q4(B) $\rightarrow$ Q5(B) $\rightarrow$ Q6(A)
  *   **Position:** Credences should be a fixed point of the agent's reasoning (e.g., $P(\phi) = P(\phi | \text{I believe } P(\phi)=x)$). Normativity comes from self-trust principles rather than convergence.
  *   **Key Text:** Christiano (2014); Probabilistic Reflection principles.

  **Leaf 7: Bounded Algorithmic View**
  *   **Path:** Q1(B) $\rightarrow$ Q2(B) $\rightarrow$ Q3(B) $\rightarrow$ Q4(B) $\rightarrow$ Q5(B) $\rightarrow$ Q6(B)
  *   **Position:** For a bounded agent, "rational credence" is just whatever the agent's internal state encodes. There is no external normative check beyond computational feasibility.
  *   **Key Text:** Radical naturalized epistemology; Some AI safety formalizations.

  ---

  ### Notes on Indistinguishability

  **Leaf 6 vs. Leaf 7 (Reflection vs. Algorithmic):**
  This tree separates these views based on **normativity** (Q6). However, in practice, these positions often converge. If an algorithm is designed to optimize for truth, its internal state (Leaf 7) may satisfy reflection principles (Leaf 6) by accident. The distinction is primarily metaphysical: is the principle *guiding* the agent, or merely *describing* it?

  **Leaf 4 (Unoccupied):**
  Note that no major theory occupies Leaf 4. This highlights a central tension in formal epistemology: you generally cannot have it both ways. You must either accept Omniscience (Leaf 3), accept Imprecision (Leaf 2), or relax Coherence (Leaf 5, 6, 7).
