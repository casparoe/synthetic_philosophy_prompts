answer: |-
  **Question 1:** Your proposal replaces the logic of authorization with the logic of description. But if representatives don't need to seek re-election, what incentivizes them to engage with the public rather than just their own conscience during their single term?
  **Follow-up:** If she argues that civic duty or social norms will suffice, ask whether those norms are strong enough to withstand the pressure of high-stakes lobbying without the concrete threat of electoral defeat.

  **Question 2:** You argue the chamber must be a statistical mirror of the public, but sortition relies on acceptance. Empirical data shows volunteers skew higher in education and political efficacy. If you can't compel service, isn't your "mirror" actually a filtered sample?
  **Follow-up:** If she proposes mandatory service akin to jury duty, ask whether forcing unwilling citizens to legislate undermines the deliberative quality you claim is the system's main advantage.

  **Question 3:** You impose hard lifetime term limits to stop careerism, but power abhors a vacuum. Doesn't this simply shift careerism to the permanent staff, lobbyists, and employers who hold the seats open while members serve?
  **Follow-up:** If she claims civil servants will remain neutral, ask what mechanism ensures that neutrality when the legislators themselves are novices dependent on staff for technical knowledge.

  **Question 4:** Legislative power is mostly agenda-setting. Your members serve one term and cannot build seniority. Who decides what reaches the floor, and how do you prevent capture of that process by external actors?
  **Follow-up:** If she suggests agenda-setting is done by random committees within the chamber, ask whether those committee members wouldn't immediately become the target of lobbyists since they hold the gatekeeping power.

  **Question 5:** We've seen citizens' assemblies in Ireland and France. What specific outcome in those processes would count as evidence against your model, rather than just a poorly run process?
  **Follow-up:** If she attributes past failures to implementation errors, ask her to define the line where a design flaw becomes indistinguishable from a execution failure.

  **Question 6:** A common defense of sortition is that every system has flaws, so we should choose the least bad one. But if the specific flaw of sortition is the relocation of power to unelected bureaucrats, isn't that a violation of your own core principle of democratic equality, making it unacceptable on its own terms rather than just comparatively worse?
  **Follow-up:** If she reiterates that all institutions have flaws, press her on why this specific flaw doesn't invalidate the normative claim that sortition restores power to the people.

  **Question 7:** In elections, bad actors can be voted out. In your model, a member serves once and leaves. How do you sanction a member who acts corruptly or negligently during their single term?
  **Follow-up:** If she relies on legal courts for accountability, ask whether judicializing political misconduct removes the necessary political judgment from the public sphere.

  **Question 8:** Elected legislatures use parties to coordinate voting and policy. Without parties, how do hundreds of random individuals coalesce around complex legislation without descending into chaos or being led by the nose by facilitators?
  **Follow-up:** If she suggests digital tools or sortition-based parties, ask whether those new structures wouldn't simply recreate the same elite capture dynamics you seek to eliminate.

  **Question 9:** If the chamber is a perfect statistical mirror, it embodies the majority will perfectly. What protections exist for minority rights against a body that literally *is* the majority?
  **Follow-up:** If she points to constitutional constraints, ask who interprets those constraints if not elected judges, and whether that shifts the ultimate veto power to an unelected judiciary.
