  6. My verdict
  My verdict is that structure dominates, but specifically the structure of state power itself. Class and ideology were the fuel, but the engine was the bureaucratic state inherited from the Kings. You cannot smash a monarchy and expect the machinery of governance to instantly become democratic. The habits of command and the rhythms of administration survived the change in personnel. The Revolution devoured its children not because they were evil, but because the institution they occupied demanded sacrifice to function. Ideas change quickly, but institutions change slowly. The Terror was the old state wearing a new hat, and it ate its wearers to keep the hat on. Structure is the gravity that pulls ideals down to earth.
