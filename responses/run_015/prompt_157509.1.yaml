  2. What the fight is about
  Historians generally fight over three engines driving the Revolution. The class-struggle reading sees a rising bourgeoisie crushing an aristocratic monopoly on power and land to free up markets. The ideology reading argues Enlightenment concepts of liberty and virtue clashed with tradition, creating a new political language that demanded total commitment to the public good. The contingency reading suggests there was no grand design; instead, war, bad harvests, and the King's indecision created a cascade of accidents. Essentially, was it economics, ideas, or just a series of unfortunate events managed by imperfect people? This debate matters because it tells us whether revolutions are predictable social shifts or chaotic explosions.

  3. The case for class and structure
  The class argument remains powerful because the Old Regime was legally rigged against economic mobility. Nobles held tax exemptions and monopolies that stifled trade and agriculture, preventing wealth from circulating naturally. The Revolution wasn't just about rights; it was about unlocking capital and labor for a modern economy. From this view, the Terror was a structural necessity to break aristocratic resistance and redistribute property permanently. The bourgeoisie needed a strong state to enforce contracts and protect new ownership titles against royalist rollback. When the aristocracy fought back, the new ruling class used violence to secure their material gains. The guillotine was simply the midwife of modern capitalism, clearing away feudal debris that refused to vanish peacefully through legislation alone. Without this violent restructuring, the economic base of France would have remained stuck in medieval patterns, blocking the rise of the merchant and manufacturer classes who drove the initial unrest.

  4. The case for ideology and contingency
  However, ideas and accidents explain the violence's specific intensity and timing. If the goal is a Republic of Virtue, then political opposition isn't just disagreement; it is moral failure threatening the soul of the nation. This ideological rigidity meant compromise was impossible without betraying the cause. Contingency amplified this: the war against Europe created a siege mentality where hesitation looked like treason. Ideology provided the script that labeled opponents enemies of the people, while contingency provided the pressure cooker. Unlike class struggle, which is slow and material, ideology moves fast. A bad harvest could instantly transform a neighbor into a hoarder, and a lost battle could turn a general into a traitor, regardless of their economic class or initial intentions. The contingency of war forced the ideology into its most extreme form, turning theoretical purity into a survival mechanism that consumed anyone deemed insufficiently committed to the emergency.

