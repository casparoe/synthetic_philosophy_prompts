answer: |-
  Moral culpability terminates with the agent's capacity for choice, but restorative liability attaches to any continuous entity that retains the structural advantages or material proceeds of the injustice.

  **The Principle and Its Forcing Cases**

  This principle divides your problem into two distinct normative tracks: **Culpability** (backward-looking, requiring agency) and **Liability** (forward-looking, requiring continuity of benefit or structure).

  1.  **Clause: Culpability requires agency and terminates with the agent.**
      *   **Forced by:** Cases 1, 3, and 4.
      *   **Reasoning:** You refuse to call the indifferent descendant (3) "guilty" despite their benefit, and you identify the endorsing descendant's guilt (4) as "new guilt." This forces a definition of guilt that cannot be inherited, only enacted. Case 1 confirms guilt exists where agency and benefit overlap in the original actor.
  2.  **Clause: Liability attaches to the continuity of the entity holding the unjust enrichment.**
      *   **Forced by:** Cases 5 and 8.
      *   **Reasoning:** Case 5 is your strongest intuition: the firm owes reparations despite total human turnover. This forces the principle that legal/institutional continuity supersedes biological continuity. Case 8 (paintings) reinforces that the *location* of the benefit (the gallery/state) grounds the claim, not the viewer's intent.
  3.  **Clause: Liability attenuates as the causal link between the injustice and current advantage becomes obscure or dissipated.**
      *   **Forced by:** Case 6.
      *   **Reasoning:** Your intuition that state liability "fades" despite institutional continuity forces a limitation on Clause 2. Unlike the firm (5), the state is a political community; if the population and political structure shift enough, the "continuous entity" claim weakens.

  **Answers to Specific Questions**

  **Can 5 or 6 apologize, and who accepts?**
  Yes, both can apologize, but the apology functions differently. In Case 5 (the firm), the apology is a legal admission of debt by the continuous estate; it is accepted by the claim-holders (victim descendants) as stewards of the original claim. In Case 6 (the state), the apology is a political act of reconstitution; it is accepted by the victim descendants *and* the current citizenry, as it redefines the political community's boundaries. The descendants of victims can forgive on behalf of the dead because the claim is now property-like (an asset of the lineage), but they cannot forgive on behalf of the living community (Case 2 resistors or current citizens).

  **Does liability lapse, and how?**
  Liability lapses when the unjust enrichment is fully dissipated or when the entity's continuity is broken. It does not lapse merely due to time (Case 3's house still stands), but it may lapse if the benefit is untraceable or amortized into general welfare that cannot be disentangled (Case 6). It turns into something else when the specific asset (Case 8 paintings) is replaced by a general obligation (reparations fund); the liability shifts from *return* to *compensation*.

  **Do 5 and 6 really differ?**
  Yes, but not in the way you suspect. The difference is not moral but ontological. Case 5 ( Firm) is a *property-holding vehicle*; its continuity is defined by assets and legal charter. Case 6 (State) is a *political community*; its continuity is defined by consent and identity. You are inconsistent if you claim the firm owes everything while the state owes nothing despite holding the same looted territory (Case 7). The state's liability should be *stronger* than the firm's because it holds sovereignty, not just capital. Your intuition that it fades (6) while the firm's holds (5) is a bias toward protecting political sovereignty over corporate assets.

  **Do the categories (criminal, political, moral, metaphysical) work?**
  They work only if mapped to the Culpability/Liability split. "Criminal" and "Moral" map to Culpability (Cases 1, 4). "Political" and "Civil" map to Liability (Cases 2, 5, 6). "Metaphysical" does no work and should be discarded; it is merely a label for the discomfort you feel when Liability persists without Culpability (Case 3).

  **Honest Assessment: Incompatibilities and Overturns**

  My account cannot accommodate **Case 10** as a valid normative verdict. You admit it makes you *less willing* to press the claim despite believing it *shouldn't* matter. My principle overturns this verdict entirely: subsequent suffering of the perpetrator group is normatively irrelevant to the liability of the entity holding the unjust enrichment. It is a psychological offset, not a moral one.

  Furthermore, I would overturn your intuition in **Case 6** regarding fading liability. If Vardania retains the territory, archives, and wealth (Case 7), the liability should not fade merely because the population turned over. You treat the State (6) more leniently than the Firm (5), yet the State is the ultimate beneficiary of the seized land and sovereignty. My principle demands that if the Firm owes reparations despite shareholder turnover, the State owes reparations despite citizen turnover, provided the state apparatus remains the continuous holder of the stolen assets. Your hesitation here protects political convenience over restorative justice.
