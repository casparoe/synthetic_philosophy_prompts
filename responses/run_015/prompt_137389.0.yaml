      *   *Hypothesis 2 (The Case Data):* This is also very strong. The "pure deference" case (A says X is wrong, B believes X is wrong) is a philosophical abstraction. Real moral learning is dialogical. Hills' "Understanding Why" is basically an argument for *reasons* over *verdicts*. If the Optimists concede that *reasons* are needed for *understanding*, but maintain *testimony* can convey *knowledge*, the gap narrows.

