answer: |-
  You have correctly identified that you are circling two distinct problems that often get conflated because they both involve the relationship between data and hypothesis construction. One is a formal glitch in Bayesian epistemology; the other is a methodological constraint on inference.

  Here is the carving you are looking for.

  ### 1. The Formal Glitch: "The Problem of Old Evidence"
  **Applies to:** Case 3 (and theoretically Case 2).
  **Definition:** This is the specific name for the paradox you described in your third situation. In standard Bayesian formalism, if a piece of evidence $E$ is already known, its probability $P(E)$ is 1. Since $P(H|E) = P(H \cdot E) / P(E)$, if $P(E)=1$, then $P(H|E) = P(H)$. Conditioning on a certainty yields no update.
  **Status:** This is widely recognized in philosophy of science as a bug in the naive application of Bayesianism, not a feature of science itself.
  **The Fix:** Philosophers generally solve this not by changing the data, but by changing the *prior assignment*. You calculate the confirmation not by asking "How does this change my belief in $H$ given I know $E$?" but by asking "What would my prior for $H$ have been if I *did not* know $E$, and how does $E$ update that counterfactual prior?"
  **Boundary:** This problem applies to *any* known fact, regardless of how the theory was built. It is a problem for the *math*, not necessarily the *method*.

  ### 2. The Methodological Distinction: "Use-Novelty" vs. "Temporal Novelty"
  **Applies to:** Distinguishing Case 1 from Case 2.
  **Definition:** This is the concept that validates your "data on the screen" hypothesis.
  *   **Temporal Novelty:** The evidence was discovered *after* the hypothesis was proposed. (Mercury fails this; your kink passes this).
  *   **Use-Novelty:** The evidence was not *used* in the construction or selection of the hypothesis. (Mercury passes this; your kink fails this).

  Science generally requires **Use-Novelty**, not Temporal Novelty. This is why Einstein gets credit for Mercury. He did not tune General Relativity to match Mercury; the theory fell out of field equations, and Mercury was a consequence he checked afterward. The data was not "on the screen" during the derivation.

  In your Case 1, you lack Use-Novelty. You inspected the residual, saw the kink, and added a parameter. The data was used to select the model structure. This is often called **Double-Dipping** or **Data Snooping** in statistics.

  **Boundary Case:** If you had written the code for the "kink term" six months ago for a different project, and *then* applied it to this dataset and found it fit, you would have Use-Novelty, even if the data was old. The constraint is on the *dependency* between the data and the model selection, not the calendar date.

  ### 3. The Underlying Mechanism: "Severity" and "Flexibility"
  **Applies to:** Explaining *why* Use-Novelty matters (Your second hypothesis).
  **Definition:** You guessed that what matters is "how probable it was that a theory of this kind would manage to fit it at all." In philosophy of science, this is called **Severity** (associated with Deborah Mayo) or the **Riskiness of a Test** (Popper). In machine learning, this is **Model Flexibility** or **Degrees of Freedom**.

  *   **Case 1 (Low Severity/High Flexibility):** By adding a term specifically to fit a kink you already saw, you have increased the flexibility of your model class. You have ensured that *if* there is a kink, the model will capture it. The fit was almost guaranteed once you looked. The "surprise" is low.
  *   **Case 2 (High Severity/Low Flexibility):** General Relativity is a rigid structure. It does not have a "Mercury parameter." It is highly probable that a random theory of gravity would *fail* to match the 43 arc-seconds per century. The fact that it did match is a high-severity test. The theory stuck its neck out.

  **Connection:** Use-Novelty is essentially a heuristic for Severity. If you use the data to build the model, you implicitly reduce the risk of failure (you lower the severity). If you build the model without the data, the data represents a genuine risk.

  ### 4. The Train/Test Split: "Predictive Accuracy" vs. "Confirmation"
  **Applies to:** Case 1 (The Remedy).
  **Definition:** Your train/test split is a procedural enforcement of Use-Novelty. By holding out data, you create a subset of evidence that was *not used* in construction.
  **Distinction:** You are correct that this measures **Predictive Accuracy** (generalizability), which is distinct from **Confirmation** (truth/explanatory power).
  *   **Confirmation:** Why does the model work? (Case 2 is high confirmation).
  *   **Prediction:** Will the model work on new inputs? (Train/Test measures this).

  A model can predict well without being "true" (e.g., a high-degree polynomial might fit the hold-out set well enough for engineering purposes but imply nonsense physics). However, in the absence of a deep theory (like Case 2), predictive accuracy on unused data is the best *proxy* we have for Severity. It proves the model didn't just memorize the noise of the training set.

  ### Summary of the Carving

  | Concept | Case 1 (Your Kink) | Case 2 (Mercury) | Case 3 (Formalism) |
  | :--- | :--- | :--- | :--- |
  | **Temporal Novelty** | **Yes** (Data new) | **No** (Data old) | N/A |
  | **Use-Novelty** | **No** (Data used to build) | **Yes** (Data not used to build) | N/A |
  | **Severity / Flexibility** | **Low** (Model tuned to fit) | **High** (Theory risked failure) | N/A |
  | **Old Evidence Problem** | N/A | N/A | **Yes** (Formal paradox) |
  | **Train/Test Remedy** | **Required** (To simulate Use-Novelty) | **Unnecessary** (Use-Novelty already present) | N/A |

  ### Addressing Your Specific Hypotheses

  1.  **"Is it whether the fact was in front of the theorist?"**
      **Yes.** This is **Use-Novelty**. If the data constrains the *construction* of the hypothesis, it cannot confirm the hypothesis. If the hypothesis is constructed independently and the data merely constrains its *acceptance*, it confirms it. The calendar date is irrelevant.

  2.  **"Is it how probable it was that a theory would fit?"**
      **Yes.** This is **Severity** (or Likelihood Ratio). A theory that could easily be tweaked to fit any outcome provides weak evidence. A theory that could easily have been wrong but wasn't provides strong evidence. This is the *reason* Use-Novelty is required: using data to build the model artificially inflates the probability of a fit.

  3.  **"Does train/test capture this?"**
      **Partially.** It captures the *risk of overfitting* (Case 1) by enforcing Use-Novelty on a subset of the data. It does not capture the *explanatory power* of Case 2. You can have a model with high predictive accuracy on a test set that is still "wrong" (e.g., it fits the curve but for the wrong causal reasons). Train/test solves the engineering problem of Case 1; it does not solve the philosophical problem of Case 2.

  ### The Working Label

  If you need a single term for the distinction between Case 1 and Case 2 that isn't captured by "Old Evidence," use **Use-Novelty**.

  *   **Definition:** Evidence $E$ is use-novel for Hypothesis $H$ if $E$ was not employed in the construction, selection, or tuning of $H$.
  *   **Boundary Condition:** If you look at the data, notice a pattern, and *then* choose a prior or a functional form to match it, you have violated Use-Novelty. If you choose the prior/functional form based on theoretical constraints alone, and *then* check it against the data (even old data), you have satisfied Use-Novelty.

  The "Problem of Old Evidence" (Case 3) is a separate formal issue regarding how to calculate the Bayesian update when $P(E)=1$. It is a problem for the *accountant*, whereas Use-Novelty is a problem for the *builder*.
