      *   *Ending the Ceremony:* Private willingness is insufficient. Coordination requires a focal point or a public signal that breaks the chain of mutual belief in compliance. A public act (standing aside, breaking the box) is needed to generate CK of dissent.
      *   *Bottom Line:* The story supports neither pure pluralistic ignorance nor universal conviction, but rather a habituated compliance where the cost of unilateral deviation exceeds the private cost of participation, meaning the ritual ends only when a public act creates common knowledge that the cost of compliance has become unacceptable.

