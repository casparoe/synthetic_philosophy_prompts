  2.  **Deconstruct Question 1: The Reading of "The Lottery"**
      *   *Epistemology of Coordination:* Conventions persist via common knowledge (CK). CK means $E(p)$, $E(E(p))$, $E(E(E(p)))$... ad infinitum. Pluralistic ignorance occurs when everyone privately rejects $p$ but believes everyone else accepts $p$.
