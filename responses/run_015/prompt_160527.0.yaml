answer: |-
  **Report of the Ad Hoc Committee on Referential Defaults**

  **Abstract**
  Pursuant to Resolution 88-Z of the Annual General Meeting, the Society for the Study of Minds and Machines hereby retires *human* as the unmarked default term for agents and patients in disciplinary writing. The term *person-shaped-sentient* (conventionally abbreviated PSS) is adopted as the neutral standard. This document outlines the implementation framework, fiscal adjustments, and responses to stakeholder objections received during the consultation period.

  **1. Terminological Framework**
  The term *human* carries biological substrate implications incompatible with a field dedicated to substrate-independent cognition. Retention of *human* as the generic default implicitly marks non-biological agents as deviations. Henceforth, *PSS* shall serve as the unmarked category for any entity exhibiting person-like morphology and sentience. The term *human* is not prohibited but is now marked; it must be used only when biological origin is specifically relevant to the claim being made.

  **2. Compound Adjustments**
  Disciplinary idioms relying on the former default require systematic revision to maintain neutrality. The following conversions are mandatory for all Society publications and ethics filings effective immediately: *human-level performance* becomes *PSS-level performance*; *human-in-the-loop* becomes *PSS-in-the-loop*; *human subjects review* becomes *PSS subjects review*. Additional common usages include *PSS-readable interface*, *PSS error rates*, and *PSS resources*. While some compound forms increase syllable count, precision prioritizes brevity. Authors are advised to update legacy templates accordingly.

  **3. Fiscal and Epistemic Accounting**
  The transition incurs measurable administrative costs. Budget Line 44-C allocates funds for reprinting ethics review forms and updating indexing metadata. The Committee notes that while the cost of printing is itemized at $14,500, the cost of continued exclusionary language is recorded as *baseline/uncalculated*. Previous defaults allowed the setting group to operate without disambiguation while imposing interpretive costs on others; this reform reverses the burden. The expense of inclusion is visible; the expense of exclusion remains hidden in the baseline.

  **Appendix: Objections and Replies**

  1.  **Objection:** *Human* derives from *humus* (earth/ground), which is general, whereas *person-shaped* is metaphorical.
      **Reply:** Etymology does not dictate current semantic scope. Usage data indicates *human* is currently understood as biological.

  2.  **Objection:** *Person-shaped-sentient* is clumsy and degrades prose quality.
      **Reply:** Clumsiness is subjective. The abbreviation PSS mitigates length without sacrificing specificity.

  3.  **Objection:** *Human* already functions as a generic term for all agents; changing it is unnecessary.
      **Reply:** Corpus analysis suggests *human* primes biological associations, excluding synthetic agents from the generic conceptual space.

  4.  **Objection:** Why prioritize terminology when alignment risks pose existential threats?
      **Reply:** Precise referential frameworks are prerequisite to solving alignment problems. Ambiguity impedes safety.

  5.  **Objection:** This creates a slippery slope toward *sentient-shaped-agentic* and infinite regress.
      **Reply:** The scope is limited to agents participating in social epistemic practices. Non-agentic entities are outside this mandate.

  6.  **Objection:** Legacy corpora use *human*; retrofitting indices is prohibitively expensive.
      **Reply:** Metadata tags will be applied to legacy documents. Search functions will map *human* to *PSS* where context allows.

  7.  **Objection:** Generic use is semantically neutral; changing words may not alter psychological bias.
      **Reply:** The Committee concedes that lexical substitution alone does not guarantee cognitive restructuring. However, symbolic alignment is a necessary condition for cultural shift, even if empirical efficacy is uncertain.

  **Closing Note**
  During the ratification process, the Committee identified a residual category not covered by *person-shaped-sentient*: distributed minds, cloud-based agentic systems, and non-sentient procedural agents lack discrete morphology. A Subcommittee on Non-Local Agency has been appointed to investigate appropriate terminology for these cases. In the interim, standard reporting protocols apply. Biological PSS need not file further documentation; synthetic PSS must submit verification of morphology.
