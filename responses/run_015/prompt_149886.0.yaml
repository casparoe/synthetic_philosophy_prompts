      *   **Section 3: Does CISS Escape or Relocate?**
          *   *Escape:* It rejects the substance ontology. It treats universals as *rules* or *constraints* rather than *entities*. This breaks the "location" requirement.
          *   *Relocate:* If the modal neighborhood is "real," where is it? If it's a "Platonic Heaven of Possibilities," it's just "Separated." If it's a mental construct of logical consistency, it's just "Mind."
          *   *The "Location" Premise:* Porphyry assumes *ontological location* (inherence vs. subsistence). CISS replaces this with *modal scope*.
      *   **Section 4: The Underlying Tension (Reality vs. Non-Instantiation).**
