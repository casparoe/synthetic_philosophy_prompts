answer: |-
  The practice you describe rests on a specific, often unstated, ontological and semantic foundation: mathematical realism coupled with classical logic. To reconstruct the implicit theory, we must look at what validates the moves you identify as permissible. When a pure mathematician accepts the $\sqrt{2}^{\sqrt{2}}$ argument as a complete proof of existence, they are endorsing the Law of Excluded Middle (LEM) as universally valid, regardless of decidability. This entails a truth-conditional semantics: a statement is true if it corresponds to the state of affairs in the mathematical universe, not merely if we possess a verification procedure. Consequently, the practice strictly presupposes that mathematical objects exist independently of our capacity to construct or identify them. This rules out strict verificationism or intuitionism, which would deem the proof incomplete because it fails to specify the witness.

  The apparent double standard between pure and applied mathematics is not a logical inconsistency but a pragmatic equivocation on the domain of quantification. In pure analysis, the quantifier $\exists x$ ranges over the set-theoretic real numbers, a completed totality where classical logic holds sway. In numerical analysis or algorithms, the context implicitly restricts the domain to computable objects or effective procedures. When a referee demands an algorithm, they are not necessarily rejecting classical logic outright but enforcing a constraint on the *kind* of existence that is useful for the task. The practice is consistent provided we acknowledge that "exists" carries different semantic weight in different contexts: ontological existence in pure math versus effective realizability in applied math. However, the justification for the pure math side remains firmly realist; without the assumption that the reals form a determinate structure where every property is either true or false, the non-constructive proof loses its claim to truth.

  Regarding your wrinkles: The Gelfond–Schneider complication highlights that constructivity is a property of the proof, not the theorem or the external knowledge state. The original proof remains non-constructive because it does not internally resolve the case split, regardless of later discoveries. This confirms that the practice values logical validity over epistemic transparency. On the verificationist front, ordinary practice is incompatible with the view that meaning is fixed by verification conditions. If meaning were verification-conditional, using LEM on undecidable predicates would be meaningless, not just risky. The fact that classical proofs can sometimes be mined for constructive content (via proof mining or realizability) does not defuse the realist commitment; it merely shows that classical logic is often a conservative extension for certain classes of statements. The realist story is still required to justify the general validity of the logic used to derive them.

  The landscape of proof assistants mirrors this divide. Lean's default inclusion of classical axioms reflects the mainstream commitment to ZFC set theory, where existence is non-constructive by default. Coq or Agda defaulting to constructive type theory reflects a focus on computation where propositions are types and proofs are programs. This is not merely sociological; it encodes the underlying logical requirements of the respective communities. Mainstream mathematics needs classical logic to maintain standard definitions (e.g., the standard real numbers vs. constructive reals) without excessive bureaucratic overhead.

  If a journal adopted intuitionistic standards tomorrow, the concrete changes would be significant. Proof by contradiction for existence claims would vanish. You could no longer prove "there exists an $x$" by showing "it is impossible that no such $x$ exists." Definitions relying on non-constructive choices would need revision. The Intermediate Value Theorem (IVT) would no longer guarantee an exact root $c$ such that $f(c)=0$; it would instead provide an algorithm to approximate $c$ to any desired precision, or require an additional hypothesis that the function is locally non-zero. The double standard would disappear because construction would be required universally, but it would be replaced by a uniform increase in difficulty for pure mathematics. Many standard theorems in functional analysis and topology would become false or require weakening, fundamentally altering the landscape of what is considered "known."

  Ultimately, the practice is not underdetermined. While one could adopt a fictionalist stance and treat the proofs as moves in a game, the practitioners assert the truth of their results, not just their derivability. To assert truth for non-constructive existence claims is to commit to a reality where those objects reside independent of construction. The double standard is manageable only because the realist ontology supports the pure side, while pragmatic constraints limit the applied side. Without realism, the pure math practice loses its semantic grounding.

  \answer{presupposes-realism}
