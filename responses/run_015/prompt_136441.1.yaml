answer: |-
  # Metaethical Specification Sheet: Desiderata for Adequacy

  ## I. Explanatory Scope (Phenomenological & Dialectical)
  *An adequate theory must provide a coherent account of the following lived and observed features of moral experience.*

  ### 1. The Phenomenology of Authority
  *   **Requirement:** The theory must explain why moral obligations present themselves to the agent as categorical, external, and peremptory, rather than as hypothetical suggestions or expressions of mere preference.
  *   **Motivating Case:** When an agent judges "I ought not to torture," the experience is not "I prefer not to torture," but "Torturing is forbidden regardless of my desires."
  *   **Status:** **Non-Negotiable.** A theory that reduces this phenomenology to systematic illusion risks collapsing into an error theory that cannot account for the functional role of moral language.

  ### 2. Persistent First-Order Disagreement
  *   **Requirement:** The theory must explain the existence of deep, intractable disagreement among rational, well-informed agents without rendering one side obviously irrational or epistemically blind.
  *   **Motivating Case:** Two philosophers agree on all non-moral facts (biology, psychology, consequences) regarding abortion yet disagree on its moral status.
  *   **Status:** **Non-Negotiable.** A theory that predicts convergence under ideal conditions must explain the lack of actual convergence without ad hoc appeals to "idealization" that render the theory untestable.

  ### 3. The Appearance of Moral Progress
  *   **Requirement:** The theory must allow for the intelligibility of moral improvement over time, such that current norms can be judged as objectively "better" than past norms, not merely "different."
  *   **Motivating Case:** The judgment that the abolition of chattel slavery was a moral improvement, not merely a shift in custom.
  *   **Status:** **Non-Negotiable.** A theory that renders progress unintelligible (e.g., strict relativism) fails to capture the normative force of reform movements.

  ---

  ## II. Conceptual Distinctions
  *An adequate theory must preserve specific conceptual boundaries to avoid collapsing morality into other domains.*

  ### 4. The Reason/Motive Distinction
  *   **Requirement:** The theory must distinguish between *possessing a genuine moral reason* and *having a motive that happens to align with morality*.
  *   **Motivating Case:** A shopkeeper who charges fair prices solely to maintain a good reputation acts in accordance with morality but does not act *for* the moral reason.
  *   **Status:** **Non-Negotiable.** Collapsing this distinction reduces morality to prudence or psychology, eliminating the normative "ought."

  ### 5. Normativity vs. Description
  *   **Requirement:** The theory must distinguish between describing a society's moral code and endorsing it.
  *   **Motivating Case:** An anthropologist can describe a warrior culture's honor killings without validating them as morally correct.
  *   **Status:** **Non-Negotiable.** Failure here collapses metaethics into descriptive anthropology or sociology.

  ---

  ## III. Empirical Consistency Conditions
  *An adequate theory must be compatible with established results in the cognitive and social sciences.*

  ### 6. Cross-Cultural Variation without Relativism
  *   **Requirement:** The theory must accommodate significant cross-cultural variation in normative judgment without concluding that truth itself is relative to culture.
  *   **Motivating Case:** Variation in norms regarding individualism vs. collectivism, or purity vs. harm.
  *   **Status:** **Non-Negotiable.** The theory must explain variation as a function of epistemic access, differing non-moral beliefs, or contextual application, rather than differing moral truths.

  ### 7. Moral Psychology and Heuristics
  *   **Requirement:** The theory must be consistent with data showing that moral judgments are often driven by fast, affective heuristics rather than slow, deliberative reasoning.
  *   **Motivating Case:** Trolley problem variants where emotional proximity shifts judgment despite identical utilitarian calculus.
  *   **Status:** **Non-Negotiable.** The theory cannot presuppose a rationalist psychology that empirical evidence contradicts.

  ---

  ## IV. The Novel Constraint: Normative Inertia
  *This constraint addresses a specific disconnect between justification and commitment.*

  ### 8. Normative Inertia
  *   **Requirement:** The theory must account for the tendency of agents to maintain specific moral commitments even after they have explicitly acknowledged that the original evidential or rational grounds for those commitments have been undermined. This must be explained without categorizing the inertia as straightforward irrationality (a bug) or as hidden rationality (a feature).
  *   **Motivating Case:** An agent raised to believe "eating meat is sinful" based on religious authority later becomes an atheist. They acknowledge the religious ground is void, yet they retain the commitment "eating meat is wrong," citing a vague sense of disgust or identity alignment rather than new evidence. They do not feel irrational, nor do they claim new evidence.
  *   **Analysis of Orientation:**
      *   **Realism:** Struggles here. If moral truths are mind-independent, persistence without grounds suggests epistemic failure. Realism tends to label this irrationality.
      *   **Error Theory:** Labels this a persistent error state.
      *   **Anti-Realism/Expressivism/Pragmatism:** **Favored.** These views treat moral commitments as conative states, habits, or identity-constituting norms rather than belief-states tracking truth. Inertia is natural for conative states (desires/habits persist after beliefs change).
      *   **Constructivism:** Can accommodate this if the "construction" is tied to social identity or stability rather than pure rational derivation.
  *   **Status:** **Non-Negotiable.** (Given your stipulation). Ignoring this renders the theory psychologically unrealistic regarding how norms function in human life.

  ---

  ## V. Tension Report: Jointly Unsatisfiable Pairs
  *The following pairs of desiderata present significant friction. A theory may satisfy both, but doing so requires complex theoretical machinery. I suspect some may be jointly unsatisfiable in their strongest forms.*

  ### 1. Phenomenological Authority vs. Persistent Disagreement
  *   **The Conflict:** If moral claims have objective, categorical authority (Desideratum 1), they should be discoverable by rational agents. If they are discoverable, persistent disagreement among rational agents (Desideratum 2) should be rare or explicable via non-moral error.
  *   **Suspicion:** **Jointly Unsatisfiable in Strong Forms.** A theory that maximizes Authority (Robust Realism) minimizes the intelligibility of Disagreement. A theory that maximizes the intelligibility of Disagreement (Expressivism/Relativism) minimizes the veridicality of Authority.
  *   **Resolution Strategy:** Most successful theories will have to weaken one. Either Authority is a "useful fiction" (preserved phenomenologically but not ontologically) or Disagreement is due to massive, systematic epistemic blindness.

  ### 2. Moral Progress vs. Cross-Cultural Variation
  *   **The Conflict:** To affirm robust Progress (Desideratum 3), one needs a trans-cultural standard. To respect Cross-Cultural Variation (Desideratum 6) without imperialism, one must acknowledge the contingency of standards.
  *   **Suspicion:** **Tension, but Satisfiable.** Satisfiable if progress is defined as internal coherence or expansion of empathy (Constructivism) rather than alignment with external platonic truths.

  ### 3. Normative Inertia vs. The Reason/Motive Distinction
  *   **The Conflict:** If an agent retains a commitment without a reason (Inertia, Desideratum 8), are they acting on a motive that aligns with morality, or do they possess a moral reason? If Inertia is common, the link between "Reason" and "Commitment" is severed.
  *   **Suspicion:** **Jointly Unsatisfiable if Rationalism is assumed.** If moral reasons *must* motivate (Internalism), Inertia is impossible. If reasons are external, Inertia is just psychological stickiness. The theory must decouple *justification* from *psychological persistence*.

  ---

  ## VI. Classification of Conditions
  *To assist in your hybrid framework formulation.*

  | Desideratum | Classification | Rationale |
  | :--- | :--- | :--- |
  | **Phenomenological Authority** | Non-Negotiable | Without this, the theory does not describe *morality*, but something else (e.g., etiquette). |
  | **Persistent Disagreement** | Non-Negotiable | Empirical fact that cannot be theorized away. |
  | **Moral Progress** | Non-Negotiable | Required to make sense of moral reform and criticism. |
  | **Reason/Motive Distinction** | Non-Negotiable | Required to preserve the normativity of ethics. |
  | **Cross-Cultural Variation** | Non-Negotiable | Empirical constraint from anthropology/psychology. |
  | **Normative Inertia** | Non-Negotiable | (Per your constraint) Required for psychological realism. |
  | **Mind-Independent Properties** | **Preference** | Specific to Realist camps. |
  | **Truth-Aptness of Moral Claims** | **Preference** | Specific to Cognitivist camps. |
  | **Reduction to Natural Properties** | **Preference** | Specific to Naturalist camps. |

  ---

  ## VII. Brief Evaluation of Existing Schools Against Spec
  *Weighted toward how they handle the criteria, not adjudication.*

  ### 1. Error Theory (e.g., Mackie)
  *   **Performance:** High consistency with Disagreement and Anthropology. High consistency with Normative Inertia (treats it as error persistence).
  *   **Failure Points:** Fails **Phenomenological Authority** (treats it as illusion) and **Moral Progress** (cannot assert one error is better than another without reintroducing norms). Fails the **Reason/Motive Distinction** by collapsing all moral claims into falsehoods.
  *   **Verdict:** Fails Non-Negotiables 1 and 3.

  ### 2. Robust Non-Naturalist Realism (e.g., Enoch, Parfit)
  *   **Performance:** High fidelity to **Phenomenological Authority** and **Moral Progress**. Preserves **Reason/Motive Distinction** well (Externalism).
  *   **Failure Points:** Struggles with **Persistent Disagreement** (requires epistemic skepticism to explain). Struggles with **Normative Inertia** (tends to view commitment without rational ground as irrational). Consistency with **Moral Psychology** is often low (posits a faculty for detecting non-natural properties).
  *   **Verdict:** Meets Non-Negotiables 1, 3, 4, but strains under 2, 6, and 8.

  ### 3. Constructivism (e.g., Korsgaard, Street)
  *   **Performance:** Good handling of **Disagreement** (different constructions). Good handling of **Anthropology** (norms arise from practical standpoint). Can accommodate **Normative Inertia** as a stability condition of the agent's practical identity.
  *   **Failure Points:** **Phenomenological Authority** is sometimes weakened (authority comes from within, not without). **Moral Progress** must be defined as procedural improvement rather than truth-approximation.
  *   **Verdict:** Strongest candidate for meeting the **Normative Inertia** constraint without labeling it irrationality, as it locates normativity in the agent's constitution rather than external tracking. However, it risks softening the **Authority** desideratum.

  ### Summary for Hybrid Formulation
  Your hybrid framework must prioritize the **Normative Inertia** constraint. This suggests a view where moral commitments are treated as *structural* or *constitutive* of the agent (favoring Constructivism/Expressivism) rather than *representational* (Realism), while retaining the *language and phenomenology* of objectivity (favoring Realism/Quasi-Realism) to satisfy the Authority and Progress desiderata. The critical tension to manage is the **Authority/Disagreement** pair; a hybrid view likely needs to posit that authority is intersubjective or procedural to allow for disagreement without collapsing into relativism.
