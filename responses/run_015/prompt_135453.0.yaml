answer: |-
  Here is a practical procedure designed for your ten-minute window. It strips away the philosophy and focuses on tangible boundaries. It relies on the logic your mate mentioned: if a move is publicly observable and doesn't consume a finite resource, it belongs to the game, not the team.

  ### The 10-Minute 'Strategy Stealing' Protocol

  **Preparation:** Two organisers should handle the complaint. One speaks to the complaining team, one to the accused team. Compare notes after Step 2.

  **Step 1: The Written Rule Check**
  *   **Question:** Is there a specific written rule in your event handbook that forbids this action? (e.g., 'No external tools', 'Teams must stay together', 'No communication between teams').
  *   **If YES:** **Penalty.** Apply the standard sanction for breaking that rule. Stop here.
  *   **If NO:** Proceed to Step 2.

  **Step 2: The Privacy & Property Check**
  *   **Question:** Did the accused team access private property or information belonging to the complaining team? (This includes reading notes over a shoulder, looking at phones/screens, rummaging through bags, or entering a space the complaining team had exclusively booked/reserved).
  *   **If YES:** **Penalty.** This is espionage, not strategy. Issue a time penalty or disqualification depending on severity. Stop here.
  *   **If NO:** Proceed to Step 3.

  **Step 3: The Resource Depletion Check**
  *   **Question:** Did the accused team's copy prevent the complaining team from continuing to use their own strategy? (e.g., There was only one mirror in the building and the accused team took it; or they blocked a doorway).
  *   **If YES:** **Penalty/Mitigation.** The accused team has interfered with the venue. Ask them to stop or share the resource. If they refuse, penalty.
  *   **If NO:** Proceed to Step 4.

  **Step 4: The 'Values' Check (The Grey Area)**
  *   **Question:** Is the complaint purely about the *idea* being copied, rather than the *method* of acquisition? (e.g., 'We thought of splitting up first', 'We invented the mirror trick').
  *   **If YES:** **No Penalty.** Stop here.
      *   *Organiser Note:* This is the bit you will hate. You must explain that in the absence of rules protecting intellectual property, observation is a valid skill. If the move was visible in public space, it is part of the common pool.
  *   **If NO:** (This implies there is some other factor not covered above). **Adjudicate on Spirit of the Game.** If it feels deeply wrong but passes Steps 1–3, you must admit you are making a values call, not a rules call. Issue a warning, not a penalty, and note it for future rulebooks.

  ***

  ### Applying the Protocol to Your Cases

  Here is how this plays out with the three scenarios you mentioned.

  **Case 1: The Mirror Trick**
  *   **Step 1 (Rules):** No rule against mirrors. **Continue.**
  *   **Step 2 (Privacy):** Team B brought their own mirror after seeing Team A use theirs. They didn't touch Team A's gear. **Continue.**
  *   **Step 3 (Resources):** There was enough light/space for both. Team A could still use their mirror. **Continue.**
  *   **Step 4 (Values):** The complaint is 'We invented that'.
  *   **Verdict:** **No Penalty.**
  *   **The Hard Truth:** You must tell Team A: "You brought a tool into a public space. Unless you booked the venue exclusively, you cannot claim ownership of the tactic." This is the outcome you'll probably hate, because Team A feels robbed of their ingenuity. But penalising Team B here sets a precedent that you will spend the whole night policing 'ideas', which is impossible.

  **Case 2: Division of Labour**
  *   **Step 1 (Rules):** No rule saying teams must stay together (assuming standard puzzlehunt rules). **Continue.**
  *   **Step 2 (Privacy):** Team B saw Team A split up physically. They didn't read a plan. **Continue.**
  *   **Step 3 (Resources):** One team splitting up does not stop the other from doing the same. **Continue.**
  *   **Step 4 (Values):** The complaint is 'That's our management structure'.
  *   **Verdict:** **No Penalty.**
  *   **Reasoning:** This is pure meta-game. Observing how opponents manage their time and personnel is a fundamental part of competitive play. Penalising this would break the nature of a race.

  **Case 3: The Private Notes**
  *   **Step 1 (Rules):** Likely no specific rule saying 'Thou shalt not glance sideways'. **Continue.**
  *   **Step 2 (Privacy):** Team B saw notes Team A considered private (on their desk, in their hands, not displayed publicly).
  *   **Verdict:** **Penalty.**
  *   **Reasoning:** This fails Step 2. Notes are private property. Even if accidental, the advantage gained came from accessing information not intended for public consumption. You don't need to prove intent, only access. A time penalty is appropriate to negate the advantage.

  ***

  ### Where This Procedure Breaks Down

  You need to be honest with your co-organisers about where this checklist cannot save you.

  **1. The 'Accidental' Leak**
  In Case 3, what if Team A left their notes on a public table and went to the loo? Step 2 becomes muddy. Is a table 'private property'? The protocol says 'Penalty', but Team B will argue it was abandoned. In this ten-minute window, you cannot prove intent. You will have to make a values call. **Advice:** Always rule in favour of the team that took reasonable care (Team A), but keep the penalty light (warning) if the negligence was obvious.

  **2. The 'Spirit' vs. 'Letter' Conflict**
  In Case 1 (The Mirror), the protocol forces you to say 'No Penalty'. Your players might feel this ruins the event's spirit of innovation. The procedure protects *you* from accusations of bias, but it doesn't protect the *players* from feeling their cleverness was wasted.
  *   **The Fix:** You cannot fix this mid-game. You must fix it in the briefing next time. If you want to reward innovation, you need a rule like 'First team to solve via a novel physical method gets a 5-minute bonus'. Without that rule, the protocol must stand.

  **3. The Power Imbalance**
  If a veteran team copies a novice team, it feels bullying. If a novice team copies veterans, it feels like learning. The protocol treats both the same. This is fair legally, but socially difficult.
  *   **The Fix:** Acknowledge the feeling. "We know it feels rough, but we have to treat all teams equally under the rules."

  ### Summary for the Organisers

  Print this out and keep it in your admin folder.

  1.  **Is it written down?** (Yes = Penalty)
  2.  **Did they touch private stuff?** (Yes = Penalty)
  3.  **Did they break the original team's ability to play?** (Yes = Penalty)
  4.  **Is it just an idea?** (Yes = No Penalty)

  If you follow this, you might lose the goodwill of the innovators in Case 1, but you keep the integrity of the event. It is better to be consistent and occasionally unpopular than to arbitrate based on who you like more. Next time, write better rules. Tonight, stick to the checklist.
