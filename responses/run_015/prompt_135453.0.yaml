prompt: |-
  I help run these little puzzlehunt nights — about twenty teams, twice a year — and we keep getting rows about 'strategy stealing'. One team works out a clever move, like using a mirror to bounce light onto a hidden clue, and another team just copies it. A mate mentioned there's a 'strategy-stealing assumption' from game theory: if your rival can copy your move without any special access, then that move wasn't really giving you a private advantage anyway. I want a proper procedre my fellow organisers can run when someone complains, because right now we just argue.

  It should be a step-by-step checklist: the questions to ask in order, what counts as a yes or no at each step, where we stop and say 'no penalty', where we say 'penalty', and where we have to admit it's just our values talking — like whether copying feels unsporting even if the rules don't ban it. We only have about ten minutes after a complaint and none of us have studied philosophy. Apply it to three cases: copying the mirror trick; copying a whole division-of-labour system where one team split up the puzzles and another copied that structure; and copying a trick that only happened because the second team accidentally saw the first team's private notes. Include one where the procedre gives an answer we'll probably hate. And be honest about where it breaks down or can't settle things.

  Please write the answer in British English, and don't give me a reading list or citations — I just need something we can actually use on the night.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Context:** Small puzzlehunt nights (approx. 20 teams, twice a year).
      *   **Problem:** Disputes over "strategy stealing" (one team copying another's clever move/system).
      *   **Goal:** A step-by-step checklist/procedure for organisers to resolve complaints within ~10 minutes. No philosophy degrees required.
      *   **Requirements:**
          *   British English.
          *   No reading list/citations.
          *   Specific decision points (Yes/No -> Stop/Continue/Penalty/No Penalty).
          *   Apply to three specific cases:
              1.  Mirror trick (physical interaction with the venue).
              2.  Division of labour (internal team structure).
              3.  Accidental sight of private notes (information leak).
          *   Include one outcome the organisers will probably hate (honesty about the logic).
          *   Acknowledge where the procedure breaks down or relies on values.

  2.  **Deconstruct "Strategy Stealing" in this Context:**
      *   In game theory, the "strategy-stealing argument" usually proves a first-player win in symmetric games (like Hex). It's not really about *copying* moves during play.
      *   The user's mate is misapplying the term slightly, but the *spirit* is clear: Is the advantage inherent to the *idea* (publicly accessible) or the *execution/access* (private)?
      *   The core ethical tension: Innovation vs. Observation. In puzzle hunts, observing others is usually part of the meta-game, *unless* it breaches specific rules (cheating, trespassing, accessing private info).
      *   The procedure needs to distinguish between *legitimate meta-gaming* (watching what others do) and *illegitimate espionage* (seeing private notes) or *resource monopolisation* (breaking the venue).

  3.  **Drafting the Procedure (The "10-Minute Protocol"):**
      *   Needs to be fast, binary where possible, and escalate only if necessary.
      *   *Step 1: The Rule Check.* Is there a written rule against it? If yes, penalty. If no, move on.
      *   *Step 2: The Access Check.* Did the copying team access private property/info? (Notes, phones, bags). If yes, penalty.
      *   *Step 3: The Resource Check.* Did the copy degrade the original team's ability to use the strategy? (e.g., using the *only* mirror). If yes, penalty/mitigation.
      *   *Step 4: The Effort Check.* Did the copying team have to figure out *why* it worked, or just copy the action blindly? (This is the tricky "values" bit).
      *   *Step 5: The Verdict.*

      *Refining for the User's Constraints:*
      *   Needs to explicitly handle the "strategy-stealing assumption" idea (if anyone can do it, is it an advantage?).
      *   Needs to identify where values kick in.
      *   Needs to be British English (organisers, behaviour, metre, etc.).

  4.  **Developing the Three Cases:**
      *   *Case 1: Mirror Trick.* Public venue, physical object. If Team A brings a mirror, Team B sees it and uses their own. Is this cheating? Usually no. Unless Team A booked the mirror exclusively? Unlikely.
      *   *Case 2: Division of Labour.* Internal team management. Team A splits up. Team B sees them split up and does the same. This is pure meta. Cannot be penalised.
      *   *Case 3: Private Notes.* Team B sees Team A's paper. This is clearly accessing private info. Penalty.

      *The "Hate" Outcome:* The procedure must logically conclude that copying the *mirror trick* or the *division of labour* is **allowed**, even if it feels unfair to the innovators. Organisers often want to reward innovation, but if the rules don't protect it, penalizing copiers is arbitrary. I need to make sure the procedure says "No Penalty" for the mirror/division cases, which might annoy the team that invented it.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Practical, authoritative but humble, British.
      *   *Structure:*
          1.  Intro (acknowledge the stress).
          2.  The Checklist (The "10-Minute Protocol").
          3.  Application to the three cases.
          4.  The "Hate" Outcome (highlighted).
          5.  Limitations (where it breaks).

      *   *Refining the Checklist Steps:*
          *   Q1: Written Rule? (Easy yes/no).
          *   Q2: Private Info/Property? (Notes, devices, bags).
          *   Q3: Shared Resource Depletion? (Did copying break the original's ability to continue?).
          *   Q4: Observation vs. Interference. (Did they watch or did they snoop?).

      *   *Addressing the "Strategy Stealing Assumption":* I need to clarify that the mate's theory is a bit wobbly but useful for Q3. If the resource is infinite (like an idea), copying doesn't hurt the original *mechanically*, only competitively.

      *   *British English Check:* Organisers, behaviour, metre, colour, programme (maybe not needed), centre, defence. "Mate" is already in the prompt, keep the vibe informal but professional.

  6.  **Writing the Response (incorporating the constraints):**

      *   *Intro:* Validate the frustration.
      *   *The Protocol:* Numbered steps. Clear "If Yes/If No" branches.
      *   *The Cases:* Walk through the logic.
      *   *The "Hate" Outcome:* Explicitly state that under this protocol, copying the mirror tactic is legal. This protects the organisers from accusations of bias but might annoy the innovators.
      *   *The Breakdown:* Admit that "spirit of the game" isn't codifiable in 10 minutes.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Game Theory says X". The user wants a procedure *based* on that logic but practical. The "Strategy Stealing Assumption" essentially means: If a move is publicly observable and reproducible, it's part of the common pool. The procedure should reflect this.

      *Step 3 refinement:* If Team A uses a mirror, and Team B uses a mirror, Team A isn't stopped. So no penalty. If Team A writes notes on a wall, and Team B reads them, that's private info.

      *The "Hate" Outcome:* I will frame it such that the procedure forces the organisers to allow the mirror copying. Innovators often feel entitled to their ideas. The procedure must strip that entitlement away unless rules protect it.

  7.  **Final Review against constraints:**
