answer: |-
  # Joint Statement on the Metaphysics of Objective Chance

  **Signatories:** The Undersigned Frequentist and The Undersigned Single-Case Propensity Theorist
  **Date:** October 26, 2023
  **Context:** Adversarial Collaboration on the Ontology of Probability under Finite-World Constraints

  ### I. Agreed Preliminaries

  Following a period of adversarial collaboration, and operating under the stipulated background finding that the physical universe is finite (i.e., no chance setup is instantiated infinitely often, and some are instantiated exactly once), we affirm the following claims:

  1.  **Intelligibility of Single-Case Chance:** We agree that attributions of chance to single, non-repeated events (e.g., "the chance that *this* atom decays now") are intelligible propositions. They are not trivially false (meaningless) nor trivially true (tautological), regardless of whether the underlying metaphysics is frequentist or dispositional.
  2.  **Objectivity:** We agree that objective chance is not reducible to any agent's credence, degree of belief, or state of evidence. While rational credence should align with chance (per the Principal Principle), chance itself is a feature of the world, not the mind.
  3.  **Non-Decisiveness of Finitude:** We agree that the finiteness stipulation is not by itself decisive between our views. The Frequentist acknowledges that actual infinite sequences are unavailable and that hypothetical limits must do the work; the Propensity Theorist acknowledges that finite frequencies remain the primary epistemic access to single-case chances. The absence of actual infinities complicates the Frequentist analysis but does not refute it; the presence of single cases motivates the Propensity analysis but does not prove it.

  ### II. Residual Disagreements

  While we share the commitments above, we remain divided on the metaphysical grounding of chance. The following table outlines the specific cruxes of our disagreement, the concrete cases bearing on them, our respective predictions for those cases, and the conditions under which we would concede our positions.

  | Crux & Concrete Case | Frequentist Position (Hypothetical) | Single-Case Propensity Position |
  | :--- | :--- | :--- |
  | **1. Reference Class & Sequence Uniqueness**<br><br>*Case:* A coin is tossed once on an island that sinks the same day, destroying the coin and setup. No physical duplicates are possible. | **Position:** Chance is defined by the limiting frequency in a *hypothetical* infinite sequence of repetitions of the *same* setup. The theory must provide a principled, non-arbitrary rule for selecting the reference class that defines "the same setup."<br><br>**Verdict:** The chance is well-defined *if* a unique, principled reference class exists (e.g., "all physically possible tosses of this coin type"). If reference class selection is irreducibly interest-relative, chance is indeterminate.<br><br>**Counter-Evidence:** If it is demonstrated that no physical fact distinguishes a "correct" reference class from an arbitrary one, rendering the hypothetical limit gerrymandered by human interest. | **Position:** Chance is a property of the specific singular setup itself, not a sequence. The reference class is an epistemic tool for estimation, not an ontological constituent of chance.<br><br>**Verdict:** The chance is determinate based on the physical dispositions present at that moment on the island, regardless of whether we can imagine repetitions.<br><br>**Counter-Evidence:** If it is shown that single-case dispositions cannot be quantified without implicitly invoking a population of similar cases to define the "strength" of the disposition. |
  | **2. Determinacy of Disposition vs. Frequency**<br><br>*Case:* A single unstable atom of a synthesized isotope is created and decays. This isotope will never be re-created. | **Position:** The chance of decay is identical to the hypothetical frequency of decay in a sequence of such atoms. The actual outcome (decay=1) does not fix the chance; the hypothetical long-run proportion does.<br><br>**Verdict:** The chance was $p$ (e.g., 0.5) even though the actual frequency is 1/1. The actual outcome is a sample from the hypothetical distribution.<br><br>**Counter-Evidence:** If the hypothetical frequency cannot be distinguished from a mere projection of the single outcome, making the "limit" a fiction with no truth conditions. | **Position:** The atom possessed a real, determinate propensity of strength $p$ to decay. This disposition existed prior to the outcome and is not defined by the outcome.<br><br>**Verdict:** The chance was $p$. The actual decay is the manifestation of the propensity, not the definition of it.<br><br>**Counter-Evidence:** If the "propensity" reduces to a placeholder for "unknown frequency," offering no explanatory power beyond the statistical regularity it purports to ground. |
  | **3. Time-Asymmetry and Inverse Conditionals**<br><br>*Case:* A process where the forward conditional ($P(\text{Effect}|\text{Cause})$) is a well-behaved propensity, but the inverse ($P(\text{Cause}|\text{Effect})$) is requested (e.g., inferring a specific decay path from a detected particle). | **Position:** Probability calculus is symmetric. Conditional probabilities are ratios of frequencies. Inverse conditionals are valid probability statements derived from the same reference class data.<br><br>**Verdict:** The inverse conditional has a valid probability value derived from the joint frequencies of causes and effects.<br><br>**Counter-Evidence:** If inverse conditionals require causal information not contained in the frequency data, suggesting probability logic is insufficient for causal structures. | **Position:** Propensities are causal and time-asymmetric. A propensity for a cause to produce an effect does not imply a propensity for an effect to imply a cause (Humphreys' Paradox).<br><br>**Verdict:** The forward ascription is a propensity; the inverse ascription is an epistemic probability (credence), not a physical propensity.<br><br>**Counter-Evidence:** If inverse propensities can be physically grounded (e.g., via time-symmetric laws), showing that propensities are not inherently time-asymmetric. |
  | **4. Determinism and Genuine Chance**<br><br>*Case:* A mechanical coin-flipper run a million times with micro-jittered initial conditions under known deterministic Newtonian dynamics yields a stable 50/50 frequency. | **Position:** This setup has objective chance. Chance is compatible with determinism if the dynamics are sufficiently sensitive (chaotic) to produce stable frequencies via the method of arbitrary functions.<br><br>**Verdict:** There is a genuine 0.5 chance of heads. The determinism of the micro-dynamics is irrelevant to the macro-level chance.<br><br>**Counter-Evidence:** If it is proven that "chance" in deterministic systems is merely a measure of human ignorance (epistemic), indistinguishable in kind from uncertainty about past events. | **Position:** This setup has no objective chance, only frequency. Genuine chance requires ontic indeterminism. In a deterministic world, probability is purely epistemic.<br><br>**Verdict:** There is 0 or 1 chance (depending on initial conditions); the 0.5 figure is a measure of our ignorance of the micro-jitter, not a physical property.<br><br>**Counter-Evidence:** If a compelling account is given of how ontic indeterminism could arise in a physically closed deterministic system, or if stable frequencies are shown to ground rational action identically to quantum chances. |

  ### III. Conclusion on the Nature of the Dispute

  In closing, we identify that a portion of our dispute is verbal, while the core remains substantive. The disagreement regarding **Reference Classes (Crux 1)** is largely verbal or methodological: we agree on the physical facts of the coin toss but disagree on whether the label "chance" applies to the *setup* (Propensity) or the *classification of the setup* (Frequentist). However, the disagreement regarding **Determinism (Crux 4)** is deeply substantive. It concerns the fundamental architecture of physical law: whether the world contains irreducible stochasticity or merely complex determinism. If the Frequentist is correct, a Laplacian demon could know all chances; if the Propensity Theorist is correct, the demon would know all dynamics but still face objective uncertainty. Until the metaphysics of physical law is settled, our collaboration must record this divergence as a genuine ontological split, not merely a difference in terminology.
