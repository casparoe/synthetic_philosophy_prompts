answer: |-
  Your working theory is not only fair; it is the most accurate diagnosis of the stalemate you are likely to get. You have correctly identified that the group is stuck in a meta-ontological trench war, disguised as a first-order dispute about psychology.

  Here is the breakdown of why your diagnosis holds, how the "pain clue" confirms it, and an honest assessment of whether progress is actually possible.

  ### 1. Defense of Your Working Theory
  You suggested the disagreement is about **what it takes for a concept to fail** and **where existence claims get their content**. You are right.

  *   **The Eliminativist Camp** is operating with a **Quinean criterion of ontological commitment**. For them, "X exists" means "X is a bound variable in our best scientific theory." If Folk Psychology (FP) is a theory, and it is radically false (like phlogiston), then the terms it quantifies over (beliefs, desires) do not refer. Therefore, they do not exist. Their question is: *Will future neuroscience validate the structural posits of FP?*
  *   **The Defender Camp** is operating with a **Pragmatist or Functionalist criterion**. For them, "X exists" means "X is an indispensable node in a successful practice of prediction and control." Even if FP is technically false as a *theory* of brain mechanics, it is true enough as a *tool* for social navigation. Their question is: *Is the vocabulary of belief/desire replaceable without catastrophic loss of explanatory power?*

  When the Eliminativist says "Beliefs don't exist," they mean "There are no internal states with propositional content that causally explain behavior." When the Defender says "Beliefs do exist," they mean "There are stable dispositions to act and speak that we successfully track using belief-talk."

  They are using the sentence "Beliefs exist" to do two different jobs. One is describing the furniture of the brain; the other is validating a social technology. Until you force them to admit they are answering different questions, you will spin in circles.

  ### 2. The "Pain Clue" and Term-Relativity
  Your observation that nobody eliminates pain is the smoking gun. It proves the position is term-relative, and recognizing this should change your diagnosis.

  Eliminative Materialism (EM) is almost never a global denial of *all* mental phenomena. It is specifically a denial of **Propositional Attitudes**.
  *   **Pain/Seeing:** These are phenomenal states (qualia). Even hard-nosed materialists usually grant that *something* is happening when you feel pain, even if they describe it as C-fiber firing. The reference succeeds because there is a direct phenomenological hook.
  *   **Belief/Desire:** These are relational states. To believe *that p* is to stand in a relation to a proposition. This requires a medium of representation (a "language of thought").

  The Eliminativists target belief/desire because they argue the brain does not store information in sentence-like structures. The Defenders argue the format doesn't matter, only the functional role.

  **Why this matters for your group:** If you treat EM as a global claim ("Nothing mental exists"), the self-refutation charge is devastating. If you treat it as a specific claim ("No *sentential* representational states exist"), the self-refutation charge becomes nuanced. The Eliminativist can say, "I am not expressing a belief; I am emitting a sentence caused by neural states that predicts the obsolescence of the category 'belief'." It sounds crazy, but it is consistent *if* you accept their specific target. Your group is likely treating EM as global, which makes the Defenders' job too easy and the Eliminativists look incoherent.

  ### 3. Is It Verbal or Substantive?
  It is a **deep verbal dispute underpinned by a substantive meta-ontological disagreement.**

  *   **The Verbal Part:** If the Defenders define "belief" as "any internal state that mediates input and output in a goal-directed way," then neuroscience *will* find beliefs. If the Eliminativists define "belief" as "a state with semantic properties that obeys logical laws," neuroscience probably *won't* find them. If you stipulate definitions, the fight vanishes.
  *   **The Substantive Part:** The fight remains because the definitions aren't arbitrary. They reflect competing visions of science. The Eliminativists believe special sciences (like psychology) must eventually "cash out" in the vocabulary of basic physics/neuroscience to be real. The Defenders believe in **autonomy**: psychology can be real and irreducible even if it doesn't look like neurobiology.

  This is not a fight that empirical data can settle, because both sides agree on the empirical data (the firing patterns, the behavior). They disagree on what that data *counts as*.

  ### 4. The Predictive Processing (PP) Red Herring
  Your suspicion about Predictive Processing is well-founded. PP is currently acting as a Rorschach test.
  *   **Eliminativists** love PP because it describes the brain as a hierarchical error-minimization machine that doesn't need "semantic content" to work. It looks like mechanics, not logic.
  *   **Defenders** love PP because it provides a functional architecture where "predictions" function exactly like "beliefs" (they have accuracy conditions, they guide action).

  PP will not break the tie because PP is a computational-level description. Whether a "prediction error signal" *is* a "belief" depends entirely on the meta-ontological criteria discussed above. Invoking PP just pushes the philosophical disagreement down one level.

  ### 5. Can an Experiment Break the Tie?
  **No.**
  You asked if a confabulation study or imaging result could settle this. It cannot.
  *   **Imaging:** If you show a brain scan, the Eliminativist says, "See? No sentences." The Defender says, "See? Distributed functional states realizing the belief role."
  *   **Confabulation:** If you show people make up reasons for actions, the Eliminativist says, "Proof that belief-attribution is a post-hoc fiction." The Defender says, "Proof that the system is complex, not that it's absent."

  The disagreement is about **interpretation**, not observation. You cannot measure "ontological commitment" with an fMRI.

  ### 6. The Structure of the Disagreement (Strongest Arguments)
  To move forward, map the debate like this:

  **Eliminativist Strong Point:** **The Causal Exclusion Argument.**
  If physical causes are sufficient to explain behavior (neurons firing), and beliefs are non-physical (or distinct from neurons), then beliefs are causally inert epiphenomena. If they do nothing, why posit them? The only way to save them is to identify them *with* the neurons, but if the neural structure doesn't match the logical structure of belief (e.g., logical consistency), the identity fails.

  **Defender Strong Point:** **The Instrumentalist/Practice Turn.**
  FP is not a *theory* trying to describe inner mechanics; it is a *skill* for navigating normativity. You don't "eliminate" the concept of a "checkmate" just because physics doesn't contain chess pieces. Checkmate exists relative to the practice of chess. Belief exists relative to the practice of social reasoning. Asking if beliefs exist "in the brain" is a category error, like asking if the "economy" is made of atoms. It is, but that's not what the word *economy* does.

  ### 7. What Counts as Progress?
  Do not expect an empirical resolution. Do not expect a formal proof. Progress in your reading group will only come from **changing the question**.

  **Recommended Move: Shift from Realism to Instrumentalism.**
  Stop asking "Do beliefs exist?" (which invites the phlogiston analogy). Start asking: **"Is Folk Psychology a replaceable technology?"**

  *   **Progress Condition 1:** The Eliminativist must specify what would *replace* belief-talk. If they say "Neuroscience vocabulary," the Defender wins by pointing out that neuroscience cannot currently predict complex social behavior as well as FP. If FP is indispensable for now, elimination is pragmatically impossible.
  *   **Progress Condition 2:** The Defender must concede that FP might be *approximately* false. They should argue for **Revisionary Functionalism**. Admit that our current concept of belief is messy, but argue that a refined version will map onto cognitive architecture, rather than vanishing.
  *   **Progress Condition 3:** Acknowledge the Term-Relativity. Agree that "Pain" and "Belief" are different categories. Grant that EM targets the *propositional* structure specifically. This neutralizes the "You can't eliminate pain" objection and sharpens the "Self-Refutation" charge to: "Can you state a theory without using propositional content?" (To which the EM must reply: "I am causally compelled to utter these sounds," which reveals the cost of their position).

  **The Honest Verdict:**
  You are not missing a piece of evidence. You are experiencing the natural limit of this specific philosophical debate. It has stalled for forty years for the exact reasons you identified: the sides are talking past each other regarding the criteria for existence.

  **Your assignment for the group:**
  Ban the sentence "Beliefs exist."
  Replace it with: "Is the vocabulary of belief indispensable for predicting human behavior, or will a completed neuroscience render it obsolete?"
  If they answer the latter, ask for the replacement vocabulary. If they cannot provide it, the Eliminativist position is a faith claim about the future of science, not a current empirical conclusion. If they answer the former, the Defender must explain how a "false theory" can be indispensable (which leads to the "practice" argument).

  That is where the actual work is. Everything else is verbal shadowboxing.
