answer: |-
  ### Phase 1: Brainstorming Candidate Tensions

  *Instruction: List every potential friction point, including those that may dissolve on inspection.*

  1.  **(1) vs (2):** If the distinction predicts policy bundling (1), doesn't that imply a logical connection between policies, contradicting the claim that there is no shared principle (2)?
  2.  **(1) vs (6):** If the distinction is "real" because of predictive power regarding governance (1), how can it be literally the same distinction in literature/theology (6) where no governance occurs?
  3.  **(2) vs (3):** If there is no proposition that puts you on the left (2), how can there be a "substantive centre of gravity" regarding inequality (3)? Is a "centre of gravity" just a soft essence?
  4.  **(2) vs (4):** If the alignment is just historical accident and organization (2), why does a single dimension account for most variance across *all* assemblies and periods (4)? Doesn't that imply a universal principle?
  5.  **(3) vs (5):** Libertarians justify economic inequality (fits Right in 3) but challenge status/traditional hierarchies (fits Left in 3?). Does "inequality" in (3) cover both? If so, Libertarians are a mix. (5) denies they are a mix.
  6.  **(3) vs (7):** In the Swap Case, the "Left" bloc advocates policies that justify inequality (privatization). If (3) is true, they are acting as the Right. If (7) is true, they remain the Left. Direct contradiction on classification criteria.
  7.  **(4) vs (7):** If roll-call votes map a single dimension (4), and the Swap Case changes the policy content of the votes, does the dimension disappear? Or is the dimension just "Bloc A vs Bloc B"?
  8.  **(5) vs (7):** (7) says locate a movement by who it governs with. (5) says Libertarians are Right *even if* their only allies are the Cultural Left. (5) overrides the method in (7).
  9.  **(5) vs (8):** Libertarians are often refused by established Right blocs (due to social issues) and Left blocs (due to economics). (8) says such movements have *no location*. (5) says they *are* Right.
  10. **(6) vs (2):** If the distinction extends to theology (6), surely there are doctrinal essences there? But (2) denies essences in politics. Is the distinction essentialist in art but anti-essentialist in politics?

  ---

  ### Phase 2: Dissolved Tensions

  *Instruction: State briefly why these do not survive inspection.*

  *   **(1) vs (2): Dissolved.** Predictive power does not require logical entailment. Institutional inertia and common enemies can bundle policies without a shared first principle. You can predict who votes together because they share a party whip, not because their policies are logically consistent.
  *   **(2) vs (4): Dissolved.** The 1D structure can be structural without being moral. If the electoral system forces binary choices (e.g., plurality voting), historical blocs will align on a single dimension regardless of content. The "structure" is the party system, not the ideology.
  *   **(4) vs (7): Dissolved.** In the Swap Case, the dimension remains "Bloc A vs Bloc B." The *content* of the dimension rotates, but the statistical variance remains 1D because the *conflict* remains binary. (4) is satisfied by the existence of conflict, not its substance.
  *   **(6) vs (2): Dissolved.** You can claim the distinction is literally the same (a structure of opposition) without claiming it is essentialist in either domain. "Left/Right" in theology can also be defined by alliance and opposition rather than doctrine, preserving (2).

  ---

  ### Phase 3: Ranked Real Tensions

  *Instruction: Rank by severity. Specify what must be surrendered (whole commitment or reading).*

  #### **Severity 1: The Methodological Contradiction [(7) vs. (5)]**
  *   **The Conflict:** Commitment (7) establishes a method ("Position-Anchoring"): to locate a movement, look at its coalitions and inheritance, *not* its manifesto. Commitment (5) applies a verdict to Libertarians that explicitly violates this method: they are "Right" *even when* their coalition partners are the Cultural Left and their manifesto (anti-paternalist) differs from the traditional Right.
  *   **Why it is severe:** This is not just a policy clash; it is a contradiction in your *criteria for truth*. (7) says coalition determines label. (5) says substance determines label (overriding coalition). You cannot hold both as universal rules.
  *   **What must go:** You must surrender the **universality of the method in (7)**. You cannot say "ask which existing bloc it can govern with" as a constitutive rule if you are willing to classify a group as Right when they *cannot* govern with the Right (in the specific scenario described in 5).
  *   **Empirical vs. Conceptual:** This is primarily **conceptual**. It concerns the definition of the terms. However, it depends on an **empirical** claim: Do Libertarians actually govern with the Left in the scenarios you envision? If they typically govern with the Right, the tension vanishes. You need to check if there are actual cases where Libertarians are governing partners of the Left while you still insist they are Right.

  #### **Severity 2: The Substance vs. History Clash [(3) vs. (7)]**
  *   **The Conflict:** Commitment (3) posits a "substantive centre of gravity" (attitudes toward inequality). Commitment (7) (via the Swap Case) posits that the label stays with the *historical bloc* even if the substance inverts completely. If the Left bloc spends 30 years justifying inequality (Swap Case), (3) suggests they have become the Right in all but name, while (7) insists they remain the Left.
  *   **Why it is severe:** If (7) is absolute, (3) is demoted from a "centre of gravity" to a "contingent accident." If the "gravity" can move 180 degrees and the planet remains the same, it wasn't gravity; it was just weather. This weakens the explanatory power of (3).
  *   **What must go:** You must surrender the **strength of the claim in (3)**. It cannot be a "centre of gravity" in a physical sense (something that pulls the bloc back). It must be a "historical sediment." It describes where the bloc *started*, not what holds it there.
  *   **Empirical vs. Conceptual:** **Empirical.** This depends on whether Swap Cases actually happen. If parties that switch platforms lose their voters and collapse (empirical stability of issue ownership), then (3) and (7) never actually conflict in reality. You need to check the literature on "issue ownership" and voter realignment to see if a 30-year policy swap is empirically stable without a label change.

  #### **Severity 3: The Classification of the Unabsorbed [(5) vs. (8)]**
  *   **The Conflict:** Commitment (8) states that a movement refused by both blocs has *no location*. Commitment (5) states that Libertarians *have* a location (Right), even though in many systems they are refused by the mainstream Right (due to social issues) and the Left (due to economics).
  *   **Why it is severe:** This creates a boundary problem. When does a movement get a location? Is it when they *want* to join a bloc, or when a bloc *accepts* them? (5) implies Libertarians are inherently Right. (8) implies they are location-less until accepted.
  *   **What must go:** You must surrender the **strictness of (8)**. You need to allow for "potential location" based on substantive affinity (3), not just actual absorption.
  *   **Empirical vs. Conceptual:** **Empirical.** This depends on the permeability of party systems. In some systems, Libertarians are absorbed (e.g., into Republican/Conservative parties). In others, they remain distinct. You need to check if there are stable party systems where Libertarians remain permanently unabsorbed yet consistently labeled "Right" by observers.

  ---

  ### Phase 4: The Single Best Revision

  *Instruction: Identify one revision that maximizes the survival of the set.*

  **The Revision:** **Modify Commitment (7) from a Constitutive Rule to a Default Heuristic.**

  *   **Current Reading of (7):** "To locate a movement... ask which existing bloc it can realistically govern with... do not read its manifesto." (This implies coalition potential *constitutes* the location).
  *   **Revised Reading of (7):** "To locate an *established party*, ask which existing bloc it governs with. To locate an *ideological movement* or a * Swap Case party*, look to substantive affinity (3) and historical lineage, even if current coalitions are strained."

  **Why this does the most work:**
  1.  **Saves (5):** It allows you to classify Libertarians as Right based on their substantive stance on inequality and property (aligning with 3), even if their current coalition partners are the Cultural Left. It treats (5) as a substantive classification that overrides the coalition heuristic in edge cases.
  2.  **Saves (8):** It clarifies that (8) applies to movements that lack *both* substantive affinity and coalition offers. A "Refused Movement" (like a hypothetical neo-monarchist party in a republic) has no anchor. Libertarians have a substantive anchor (3), so they get a location even without a coalition.
  3.  **Saves (3):** It preserves the "substantive centre of gravity" as a real classifier for movements, even if established parties (Swap Case) drift away from it due to institutional inertia. It distinguishes between *Ideological Location* (substantive) and *Systemic Location* (coalitional).
  4.  **Saves (2) and (1):** It maintains the Anti-essentialist Bloc View (2) for *governing parties* (explaining why they stay together without shared principles), while acknowledging that *movements* are often defined by principles before they become parties.

  **Cost:** You lose the elegant simplicity of having one single method for all cases. You must distinguish between "Parties in Government" (defined by coalition/history) and "Movements/Ideologies" (defined by substance).

  **Empirical Check Required:** To be confident in this revision, you need to verify if political scientists distinguish between "party label" and "ideological family" in the data. If the empirical literature (4) treats Libertarians as a distinct dimension *unless* they merge, your revision holds. If the data codes them as "Right" only when they vote with Right parties, you may need to adjust (5) instead.

  ### Summary of Audit
