answer: |-
  ### Strategic Opening: Concessions and Refusals

  **Concede immediately:**
  1.  **Novelty of Reconstruction:** Acknowledge that defining the separateness of persons via *deliberative standpoints* rather than biological organisms or Rawlsian distinctness is a novel proposal. Do not present this as the standard Rawls/Nozick/Scheffer reading. It is a reconstruction intended to solve specific aggregation puzzles, not exegesis.
  2.  **Edge-Case Reliance:** Admit that your claims rely on borderline cases (amnesia, serial selves, intense joint agency). In standard cases, your view should coincide with the organism view. You are arguing for the *principle* that explains the standard cases, not necessarily for changing outcomes in everyday ethics.

  **Refuse to give up:**
  1.  **Question-Begging Charge:** Do not accept that "complaint unit" is merely a label for your intuition. Insist that "deliberative standpoint" is a functional/psychological criterion that can be identified independently of the moral conclusion.
  2.  **Organism Sanctity:** Do not retreat to the biological boundary if pressed on the amnesia case. Hold that moral significance tracks psychological/deliberative unity, not biology.

  ### Epistemic Status Note

  *   **Near-Orthodox:** That the separateness of persons is a significant objection to utilitarianism (Rawlsian consensus). That prioritarians/person-affecting views rely on intra-life aggregation to function.
  *   **Genuinely Contested:** The ground of the objection (fairness vs. aggregation vs. rights). Whether psychological continuity is what matters for survival/ethics (Parfitian debate).
  *   **Novel/Your Proposal:** The specific "complaint unit" terminology. The claim that deliberative unity defines the boundary (rather than psychological continuity or biology). The claim that joint agency can dissolve separateness *for aggregation purposes* (Claim 2). The claim that intra-life aggregation can fail (Claim 1). **Present these as hypotheses, not established literature.**

  ### Q&A Prep Sheet

  | Objection (Camp Vocabulary) | Who Raises It | Targets Claim | Two-Minute Reply | Where the Reply is Soft |
  | :--- | :--- | :--- | :--- | :--- |
  | **"You've destroyed the competing claims model. If intra-life aggregation fails, prioritarianism loses its grip on standard cases."** | Prioritarians / Person-Affecting | Claim 1 (Intra-life failure) | Distinguish *temporal* claims from *deliberative* claims. Prioritarianism needs aggregation across time to handle prudence. My view allows this *if* deliberative unity holds. In dense amnesia cases, prudence itself dissolves; so should aggregation. This isn't a bug, it's a feature of tracking what matters. | You lack a clear threshold for "dense enough" amnesia. If unity is partial, is aggregation partial? This risks vagueness in practical application. |
  | **"This is circular. You define the 'complaint unit' exactly where you want aggregation to stop. You've just renamed the intuition."** | Act-Utilitarians | Core Reconstruction | The deliberative standpoint is an empirical/functional fact about cognitive architecture and social interaction, not a moralized category. We can identify shared intentionality without deciding the moral outcome first. The moral work is done by linking *that* fact to complaints. | Defining "shared deliberation" without smuggling in normative weight is hard. Critics may argue true shared agency presupposes moral commitment. |
  | **"You're treating duties as trade-offs. Separateness is about respect, not计量 (measurement) of complaints."** | Kantian Constructivists | Core Reconstruction | My view isn't consequentialist; it's about the *structure* of justification. A complaint requires a standpoint from which to lodge it. If standpoints are pooled, the justification changes. This complements constructivism by specifying the units of justification. | May not satisfy deep Kantians who reject any aggregative structure whatsoever, even of complaints. |
  | **"Joint agency doesn't dissolve rights. A team can still be exploited even if they deliberate together."** | Prioritarians / Agnostics | Claim 2 (Inter-person success) | Distinguish *exploitation* from *aggregation*. Joint agency doesn't permit violating rights, but it changes whether gains/losses are comparable *within* the unit. If we genuinely share a end, my loss for your gain is internal to our agency, not a trade-off between us. | Risks justifying oppressive collectives. If a cult shares deliberation, does separateness vanish? You need a normativity constraint on "genuine" joint agency. |
  | **"Rawls meant biological persons. You're changing the subject."** | Prioritarians / Agnostics | Core Reconstruction | Rawls used biological persons as a proxy for moral agents. In edge cases (amnesia), the proxy fails. I'm offering the underlying principle that makes the proxy work in standard cases. | Exegetically risky. If the workshop cares about Rawls scholarship rather than pure theory, this looks like revisionism. |

  ### Critical Focus

  **The Objection You Must Answer Well:**
  The Prioritarian attack on Claim 1 (Intra-life aggregation).
  *Why:* This group comprises nearly half the room. Their theoretical framework *depends* on intra-life aggregation to distinguish itself from utilitarianism. If you convince them that intra-life aggregation fails in amnesia cases, you threaten the coherence of their own view in standard cases (via slippery slope). You must show clearly why the amnesia case is distinct from normal temporal discounting or prudential concern.

  **The Question You Hope Nobody Asks:**
  "How do we measure deliberative unity quantitatively?"
  *Why:* Your view relies on a threshold of unity to determine when aggregation fails or succeeds. There is no established metric for "degree of deliberative unity." If pressed on how to adjudicate borderline cases (e.g., early dementia, loose collaborative groups), you may have to admit the view is currently programmatic rather than actionable.

  Most damaging: \answer{Prioritarian objection to intra-life aggregation}
