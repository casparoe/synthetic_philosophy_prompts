      I will highlight Case 1 as the one where the "technically true" reading ("The paper says normal") is forbidden, forcing the volunteer into a gray area of "explaining the document's limitations," which feels like advice.

      *Dropped Distinctions:*
      1.  Intent to Deceive (Philosophy) vs. Foreseeable Misunderstanding (Procedure).
      2.  Saying vs. Implying (Assertion vs. Implicature).
      3.  Act vs. Omission.
      *Cost:* You lose the ability to say "I didn't lie." You take responsibility for their understanding.

      *What the procedure can't do:*
