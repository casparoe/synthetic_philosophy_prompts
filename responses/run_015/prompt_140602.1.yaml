answer: |-
  Here is a decision procedure built for your table. It takes the philosophical distinction between *lying* (asserting falsehood) and *misleading* (asserting truth to create false belief) and collapses them into a single practical standard: **Foreseeable Understanding.**

  In the literature, many philosophers argue misleading is morally lighter than lying. In your context, that distinction is dangerous. If a patron leaves with a false belief that causes harm, it does not matter if you lied or merely misled. The procedure below treats a "technically true statement that creates a false belief" as functionally equivalent to a lie.

  ### The "Plain Meaning" Protocol

  **Goal:** Ensure the patron leaves with the same understanding of the document that you have, without crossing into advice.
  **Users:** Any volunteer.
  **Time:** 30 seconds to run.

  **Test 1: The Boundary Check (Rule Compliance)**
  *   **Question:** Am I telling them what to *do*, or just what the words *say*?
  *   **Pass:** "This form asks for X," or "This letter says Y."
  *   **Fail:** "You should sign this," "This is safe," or "You qualify for this."
  *   **Action:** If **Fail**, stop. Do not answer. Refer to coordinator if they insist.
  *   **Why:** This keeps you employed.

  **Test 2: The Word Check (Semantic Drift)**
  *   **Question:** Do the technical words on the page mean the same to them as they do to me? (e.g., *normal, certified, safe, pending*).
  *   **Pass:** The word means the same thing to both (e.g., "Total," "Date," "Name").
  *   **Fail:** The word has a loose common meaning and a tight technical meaning (e.g., "Normal" in medicine vs. "Normal" in statistics).
  *   **Action:** If **Fail**, you must define the word immediately. You cannot use the word alone.
  *   **Why:** Using a technical word loosely is a lie by omission.

  **Test 3: The Silence Check (Contextual Omission)**
  *   **Question:** Is there a fact I know that, if I leave it out, makes the true statement sound false?
  *   **Pass:** The document stands on its own (e.g., A bill amount).
  *   **Fail:** You know a constraint they don't (e.g., A reference range is wrong for their age; a certification excludes their specific worry).
  *   **Action:** If **Fail**, you must state the constraint. You cannot simply read the conclusion.
  *   **Why:** This is where "misleading" happens. You know the switch that flips the meaning; hiding it is morally equal to lying.

  **Test 4: The Paper Check (Permanence)**
  *   **Question:** Will this information be read later by someone who cannot ask me a follow-up question? (Emails, notes, written summaries).
  *   **Pass:** Spoken only, face-to-face.
  *   **Fail:** Written down, emailed, or texted.
  *   **Action:** If **Fail**, add a disclaimer that limits your authority, or refuse to write it.
  *   **Why:** Written words lose context. Ambiguity becomes permanent.

  ***

  ### Where the Procedure Stops

  *   **Green Light:** Pass all tests. You may speak/write.
  *   **Yellow Light:** Fail Test 2 or 3. You must rephrase to include the definition or constraint. (e.g., Instead of "It's normal," say "It says 'normal,' but that label uses a range for younger adults.")
  *   **Red Light:** Fail Test 1. You must stop. (e.g., "I cannot tell you if you should buy this.")
  *   **Values Call (Hand to You):** Fail Test 4 but the patron is distressed/insistent. This is where the volunteer's duty to be helpful clashes with the duty to be safe. You need to decide if the risk of a written misunderstanding is worth the help.

  ***

  ### Distinctions Dropped (And The Cost)

  To make this runnable in 3 minutes, I dropped three philosophical distinctions. You need to know what you are losing.

  1.  **Intent to Deceive:** Philosophy cares if you *meant* to trick them. This procedure cares if they *get* tricked.
      *   *Cost:* You will be held responsible for honest mistakes. If you speak truthfully but they misunderstand because of your word choice, the procedure treats that as a failure on your part, not theirs.
  2.  **Saying vs. Implying:** Philosophy distinguishes asserting a falsehood from implying one. This procedure treats them the same.
      *   *Cost:* You lose the moral shelter of "I didn't *say* that." If your true statement implies a falsehood, you must correct the implication.
  3.  **Act vs. Omission:** Philosophy often views lying (act) as worse than hiding truth (omission). This procedure treats them equally.
      *   *Cost:* You are forced to speak up more. Silence is no longer neutral; if silence leads to a false belief, it is a violation of the protocol.

  ***

  ### Running the Cases

  Here is how the protocol handles your three scenarios.

  **Case 1: The 82-Year-Old and the Lab Printout**
  *   **Test 1 (Boundary):** Pass. Reading the text, not advising treatment.
  *   **Test 2 (Word Check):** **Fail.** "Normal" to him means "Healthy for me." "Normal" on the page means "Within this specific statistical range."
  *   **Test 3 (Silence):** **Fail.** You know the range is for under-40s. Leaving that out makes "Within normal limits" a false signal.
  *   **Procedure Outcome:** **Yellow Light (Rephrase Required).**
  *   **The Uncomfortable Result:** You cannot say, "It says everything is normal." That is technically true but functionally a lie. You must say: *"The paper says 'within normal limits,' but I notice the reference range listed is for adults under 40. You may need to ask your doctor if that range applies to you."*
  *   **Why you won't like it:** This feels like medical advice. It interprets the validity of the lab's data. However, the protocol dictates that omitting the range error is morally equivalent to lying about the result. Your habit of technical precision ("The paper *says* normal") is forbidden here because it guarantees a false belief.

  **Case 2: The Water Filter Certification**
  *   **Test 1 (Boundary):** Pass. Reading the box, not advising on purchase.
  *   **Test 2 (Word Check):** **Fail.** "Certified" to her means "Removes lead." "Certified" on the box means "Meets material safety standards."
  *   **Test 3 (Silence):** **Fail.** You know the certification excludes removal.
  *   **Procedure Outcome:** **Yellow Light (Rephrase Required).**
  *   **The Result:** You cannot say, "It is certified." You must say: *"It has a certification mark, but the small print says that mark only covers the materials, not lead removal."*
  *   **Note:** This is the classic "misleading vs. lying" trap. Saying "It's certified" is true. But in this context, it is a lie by implication. The protocol forces you to burst her bubble to maintain truthfulness.

  **Case 3: The Flood Map Email**
  *   **Test 1 (Boundary):** Pass. Describing the map.
  *   **Test 2 (Word Check):** Pass (assuming plain language).
  *   **Test 3 (Silence):** **Fail.** Maps have nuances (zones, historical data vs. projected risk) a nephew skimming an email will miss.
  *   **Test 4 (Paper):** **Fail.** This is written and will be forwarded to a third party who cannot ask you questions.
  *   **Procedure Outcome:** **Values Call.**
  *   **The Result:** The protocol flags this as high risk. A written summary without nuance will likely create a false belief in the nephew.
  *   **The Decision:** You must decide if the help outweighs the risk. The "safe" answer is to refuse: *"I can't put this in writing because maps change and I don't want your nephew to rely on my email."* The "helpful" answer is to write it with a heavy disclaimer. The procedure cannot solve this; it just hands it to you.

  ***

  ### What The Procedure Cannot Do

  1.  **It Cannot Resolve the Institutional Conflict:** The library forbids advice. The protocol sometimes demands you explain context (Case 1 & 2) that borders on advice to prevent misleading. If a coordinator flags you, this procedure will not protect you. It prioritizes the patron's understanding over the library's risk management.
  2.  **It Cannot Guarantee Understanding:** You can pass all tests and they can still misunderstand. The procedure minimizes *your* contribution to the error, but it cannot fix *their* reception.
  3.  **It Cannot Handle Emotional Distress:** Sometimes people need reassurance more than truth. The protocol demands truth/clarity. If a patron is crying and asks "Is my baby safe?" and the lab report is ambiguous, the protocol says "I cannot answer that." It offers no guidance on how to be human in that moment without breaking the rules.

  **Summary for your volunteers:**
  "If the words mean something different to them than they do to you, you have to fix it. If leaving something out makes the truth sound false, you have to say it. If it's going in writing, assume it will be misunderstood."
