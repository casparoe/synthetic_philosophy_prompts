      3.  **The "Missing Piece" Test:** Is there a fact I know that makes this true statement misleading?
      4.  **The "Paper" Test:** Is this going in writing?

      *Wait, I need to incorporate the "Lying vs. Misleading" literature specifically.*
      The literature (e.g., Mahon, Carson, Fallis) focuses on intent and warrant. But for the library, *consequence* matters more. I need to bridge that. The procedure should treat "intentional misleading" as functionally equivalent to "lying" if the harm is the same.
      *Revised Procedure Name:* The "Clear & Safe" Check.
      *Step 1: The Line.* (Advice vs. Explanation).
      *Step 2: The Mirror.* (Do they understand the words the way I do?).
      *Step 3: The Gap.* (Am I leaving out a fact that flips the meaning?).
      *Step 4: The Record.* (Is this permanent?).

  4.  **Developing the Cases:**

      *   *Case 1 (Lab Printout):* 82yo man, "normal" label, wrong reference range.
