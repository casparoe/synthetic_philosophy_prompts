      *   **Constraints:** Library rules forbid giving medical/legal advice. High volume (20+ people/morning), short time (2-3 mins each), no consultation, coordinator handles complaints.
      *   **Philosophical Interest:** Lying vs. Misleading (the distinction between asserting a falsehood vs. implying one while speaking truthfully).
      *   **Goal:** A practical decision procedure (tests in order, plain language) for volunteers to navigate truthfulness in this specific context, based on philosophical literature but stripped of jargon.
      *   **Specific Pain Points:** Knowledge asymmetry (knowing more than the patron), semantic drift (technical vs. common meanings), written records (no chance for follow-up).
      *   **Requirement:** Run the procedure on three specific cases. At least one must yield an uncomfortable result (likely where technical truth is worse than lying). Acknowledge what distinctions were dropped and the cost. Acknowledge what the procedure *can't* do.

  2.  **Deconstruct the Philosophical Problem (Lying vs. Misleading):**
      *   *Standard View:* Lying (asserting $P$ when you believe $\neg P$) is worse than misleading (asserting $P$, knowing the listener will infer $Q$, where you believe $\neg Q$).
      *   *Critique:* In high-stakes or asymmetric knowledge situations, misleading can be just as harmful or manipulative as lying. Intent matters, but so does foreseeable outcome.
      *   *Application to Library Desk:* The goal isn't just moral purity; it's *utility* and *harm reduction* within institutional constraints. The "lie vs. misleading" distinction is less useful than "helpful vs. harmful" or "clear vs. ambiguous."
      *   *Strategy:* Adapt the philosophical distinction into a pragmatic "Truthfulness & Safety Protocol." Focus on *foreseeable interpretation* rather than just *literal assertion*.

  3.  **Drafting the Decision Procedure:**
      *   *Constraint:* Must be plain English, runnable by volunteers in 2-3 minutes.
      *   *Structure:* A flowchart or step-by-step checklist.
      *   *Step 1: The Rule Check.* (Institutional constraint). Can I answer this at all?
      *   *Step 2: The Knowledge Gap.* Do I know something they don't that changes the meaning?
      *   *Step 3: The Interpretation Check.* If I say X, what will they *hear*? (Addressing the semantic drift).
      *   *Step 4: The Record Check.* Is this written? (Addressing the forwarding issue).
      *   *Decision Points:* Go ahead, Rephrase, or Escalate/Stop.

      *Refining the Steps for the User's specific philosophical worry:*
      The user is worried about *misleading* via technical truth. So the procedure needs to flag when a technically true statement creates a false belief.
      *   *Test 1: The Boundary.* (Rules).
      *   *Test 2: The Translation.* (Semantic drift).
      *   *Test 3: The Silence.* (Omission).
      *   *Test 4: The Paper Trail.* (Written vs. Spoken).

