answer: |-
  ## Take-Home Exam Question: Anthropics & Indexical Uncertainty
  **Course:** PHIL/COGSCI 202: Reasoning About Observers  
  **Time Allocation:** 60–90 Minutes  
  **Total Marks:** 20

  ### Question 1: The Presumptuous Rank (20 Marks)

  **Stem:**
  Physicists are split 50/50 between two theories about the total number of observers who will ever exist in the universe:
  *   **Small ($H_S$):** 100 billion ($10^{11}$) observers total.
  *   **Big ($H_B$):** 100 trillion ($10^{14}$) observers total.

  You learn your absolute birth rank is roughly 60 billion ($6 \times 10^{10}$). For this question, use the following operational definitions:
  *   **SSA (Self-Sampling Assumption):** Keep priors equal ($1:1$). Update only on the likelihood of your rank ($P(\text{Rank}|H) \propto 1/N_{total}$).
  *   **SIA (Self-Indication Assumption):** Adjust priors proportional to observer count ($P(H) \propto N_{total}$). Treat likelihood of rank as uniform or neutral.
  *   **SSA+SIA:** Apply both the SIA prior shift and the SSA likelihood update.

  **Part A (10 Marks):**
  Calculate the posterior odds favoring $H_S$ vs $H_B$ under (i) SSA alone, (ii) SIA alone, and (iii) SSA+SIA combined. Show your ratio calculations.

  **Part B (10 Marks):**
  Suppose you learn a further fact: across *both* theories, only 10,000 observers ever exist who are capable of explicitly thinking about anthropic reasoning, and you are one of them. 
  1.  Does this information screen off the evidence from your birth rank (60 billion)? 
  2.  Does the answer differ for a proponent of SSA vs. SIA? 
  3.  Briefly explain why relying on SIA here might lead to the "Presumptuous Philosopher" objection, distinguishing between settled Bayesian mechanics and contested metaphysical assumptions.

  ***

  ## Model Answer (Approx. 550 Words)

  **Part A: The Calculations**
  Under **SSA alone**, we start with equal priors ($1:1$). The likelihood of having rank 60 billion is $1/10^{11}$ in $H_S$ (since 60B is within the 100B total) and $1/10^{14}$ in $H_B$. The likelihood ratio is $(1/10^{11}) / (1/10^{14}) = 1000$. SSA yields **1000:1 odds favoring Small**. This is the standard Doomsday Argument structure: being early is surprising in a large population.

  Under **SIA alone**, we shift priors proportional to $N$. $H_B$ has $1000\times$ more observers, so the prior odds become $1:1000$ favoring Big. Assuming neutral likelihoods regarding rank, the posterior remains **1:1000 favoring Big**. SIA penalizes hypotheses where you are unlikely to exist at all.

  Under **SSA+SIA**, we combine the SIA prior ($1:1000$ favoring Big) with the SSA likelihood ($1000:1$ favoring Small). These factors cancel exactly ($1000 \times 1/1000 = 1$). The posterior odds are **1:1 (Indifference)**. The probability of existing (SIA) offsets the probability of having this specific rank (SSA).

  **Part B: The Thinker Twist**
  Whether the "10,000 thinkers" fact screens off the birth rank depends entirely on the **Reference Class**. 

  If the reference class is "all observers," the birth rank evidence remains. In $H_S$, the density of thinkers is 10,000 per 100 billion. In $H_B$, it is 10,000 per 100 trillion. Finding yourself at rank 60 billion *and* being a thinker is $1000\times$ more likely in $H_S$ because thinkers are denser. The rank evidence is **not screened off**; it reinforces the SSA conclusion.

  However, if the reference class is restricted to "observers who think about anthropics," the total population $N$ becomes 10,000 for *both* theories. Your absolute rank (60 billion) becomes irrelevant; only your rank among thinkers matters. If you don't know your thinker-rank, the evidence is neutral. SSA proponents might accept this restriction to avoid the Doomsday Argument, while SIA proponents might argue the absolute number of observers still dictates the prior.

  **The Presumptuous Philosopher Objection**
  This highlights the divide between math and metaphysics. The Bayesian mechanics (multiplying priors and likelihoods) are settled. The contestation lies in choosing the prior and reference class. SIA implies you can favor $H_B$ over $H_S$ almost entirely from the armchair, simply because $H_B$ contains more observers. If $H_B$ also posited a different, empirically unlikely physical constant, SIA could overwhelm empirical data. This is the "Presumptuous Philosopher" problem: it allows indexical reasoning to trump physical evidence. 

  An A-grade answer acknowledges that while SSA+SIA yields mathematical indifference, accepting SIA requires believing that your existence is evidence about the size of the universe independent of physical data. This is not a settled consensus but a foundational disagreement in anthropic theory.

  ***

  ## Marking Scheme (Out of 20)

  **Part A: Calculations (10 Marks)**
  *   **SSA Likelihood (4 marks):** Correctly identifies likelihood ratio as $1000:1$ favoring Small. (Deduct 2 if they claim priors shift).
  *   **SIA Prior (3 marks):** Correctly identifies prior shift to $1:1000$ favoring Big. (Deduct 2 if they treat SIA as a likelihood update only).
  *   **Cancellation (3 marks):** Correctly notes SSA+SIA leads to indifference (1:1) due to cancellation.

  **Part B: Conceptual Analysis (10 Marks)**
  *   **Reference Class Dependence (4 marks):** Identifies that screening off depends on whether the reference class is "all observers" (no screen) or "thinkers" (screen).
  *   **SSA vs SIA Distinction (3 marks):** Notes that SSA is sensitive to density/rank, while SIA is sensitive to absolute counts.
  *   **Presumptuous Philosopher/Nuance (3 marks):** Explains that SIA allows armchair physics (contested) vs. Bayesian math (settled). 

  **Classic Mistakes (Automatic Deductions)**
  *   **-3 Marks:** Claiming SIA makes the universe *physically* larger (SIA affects probability, not ontology).
  *   **-3 Marks:** Mixing up prior shifts with likelihood updates (e.g., saying SSA shifts the prior).
  *   **-4 Marks:** Asserting the Presumptuous Philosopher conclusion is proven fact rather than a reductio ad absurdum or contested view.
  *   **-2 Marks:** Failing to note that "SSA+SIA" cancellation is why SIA is often proposed as a counter to the Doomsday Argument.
