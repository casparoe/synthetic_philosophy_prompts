prompt: |-
  hey — I'm trying to get clear on upamana in Nyaya epistemology and I keep going in circles, so please explain it to me properly.

  Here's the bit I think I get. Nyaya recognizes four pramanas: perception, inference, comparison, and testimony. The stock example for comparison is the gavaya one: you know what cows look like, someone reliable tells you that a gavaya is an animal somewhat like a cow, later you see an unfamiliar animal and you come to know that that thing is a gavaya. And the claim is that this isn't reducible to the other three. My question is *why not*. Once you subtract the seeing of the animal, the remembering of what you were told, and some kind of similarity matching, what is supposed to be left over? Also, since a sentence was involved somewhere, why isn't this really just testimony doing the work? I want the actual argument for distinctness, not just the assertion that it's a separate source.

  Then there are four cases where I genuinely can't tell whether the theory handles them or just breaks:

  1. Reversed direction. Every version of the example runs from the familiar thing (cow) to the unfamiliar one (gavaya). But suppose I grew up near the forest and know gavayas well, and a traveler tells me a cow is roughly like a gavaya but smaller, with a dewlap, and then I see a cow and identify it. Structurally that looks identical. So is the direction just an artifact of the textbook example, or is something actually supposed to hang on it?

  2. Partial, graded similarity. The animal I see matches a cow in body shape but the horns are all wrong, and it's honestly about as buffalo-like as cow-like, and the respects of similarity don't all line up. Similarity comes in degrees and isn't one single relation. So what is the pramana supposed to output — a one-off identification of that individual, or knowledge of the word-to-thing relation generally? And what happens when the similarity is borderline: does the cognition just fail to count as knowledge, or does it come out vague?

  3. Right answer, wrong route. Say I latch onto the wrong respect: the speaker meant the size, I match on the horns, and I still happen to pick out a genuine gavaya. Is that still upamana? Since pramanas are supposed to be genuine sources of true cognition, can an accidentally successful similarity match count — or does this show the account needs some kind of no-luck condition?

  4. The second time. Once I have the concept and have seen several gavayas, identifying the next one feels like plain recognition, not comparison. Does upamana fire only once per word, or is it still operative in every later recognition?

  No need to cite texts or authors, I just want the conceptual machinery and where it strains.
reasoning: |-
  Here's a thinking process that leads to the explanation of Upamana in Nyaya epistemology:

  1.  **Deconstruct the User's Request:**
      *   **Topic:** *Upamana* (comparison) in Nyaya epistemology.
      *   **Core Problem:** Why is it distinct from Perception (*Pratyaksha*), Inference (*Anumana*), and Testimony (*Shabda*)? The user feels it's just a mix of these.
      *   **Specific Questions:**
          1.  Why isn't it just Testimony (since a sentence is involved)?
          2.  Why isn't it just Perception + Memory + Similarity matching?
          3.  **Case 1 (Reversed Direction):** Familiar $\to$ Unfamiliar vs. Unfamiliar $\to$ Familiar. Does direction matter?
          4.  **Case 2 (Partial/Graded Similarity):** What if similarity is messy/degree-based? What is the output (individual ID or word-meaning relation)?
          5.  **Case 3 (Right Answer, Wrong Route):** Accidental success (luck). Is this valid *upamana*?
          6.  **Case 4 (The Second Time):** Is it a one-time learning mechanism or recurring?
      *   **Constraint:** No need for textual citations/authors, focus on conceptual machinery and strain points.

  2.  **Initial Assessment & Strategy:**
      *   The user is sharp. They see the reductionist trap immediately. Most introductory explanations *do* just assert distinctness. I need to dig into the *sui generis* nature of the cognition produced.
      *   *Key Nyaya Distinction:* The object of knowledge (*prameya*) in *upamana* is specifically the *relation between a word and its referent* (shakti/samjna-sambandha), known through similarity. It's not just identifying the animal; it's learning what the word *means* via similarity.
      *   *Structure:*
          1.  Address the "Why Distinct?" question first (The Core Argument).
          2.  Tackle the four edge cases systematically.
          3.  Conclude with where the theory strains (as requested).

  3.  **Drafting the Core Argument (Distinctness):**
      *   *Why not Perception?* Perception gives "this is an animal." It doesn't give "this animal is called 'gavaya'." Perception doesn't grasp word-meaning relations directly.
      *   *Why not Testimony?* Testimony (*Shabda*) requires understanding the sentence *at the time of hearing*. In the *gavaya* case, when you hear "a gavaya is like a cow," you *don't* know what 'gavaya' refers to yet. You can't fully grasp the proposition. The knowledge arises *later* upon seeing the animal. Testimony is synchronous; *Upamana* is diachronic.
      *   *Why not Inference?* Inference requires a universal connection (*vyapti*). "Whatever is cow-like is a gavaya" isn't a strict universal. It's based on similarity, not invariable concomitance. Also, inference concludes a property of the subject; *upamana* concludes the applicability of a name.
      *   *The "Leftover":* The unique cognition is: "This particular animal is the referent of the word 'gavaya' which I heard about earlier." It bridges the gap between a known description (similarity to cow) and a new name, establishing the naming convention.

  4.  **Addressing the Four Cases:**

      *   **Case 1: Reversed Direction (Known Gavaya, Unknown Cow).**
          *   *Nyaya View:* The structure is symmetric regarding the *mechanism*, but the *epistemic goal* defines the pramana.
          *   If the goal is learning the meaning of the word "Cow," it's *upamana*.
          *   If the goal is just identifying an object, it might be recognition (*pratyabhijna*).
          *   *Crucial Point:* Nyaya defines *upamana* specifically as knowledge of the relation between *name* and *named*. So if you know 'gavaya' and learn 'cow' via similarity, it's still *upamana*. The direction of familiarity doesn't break it, provided the goal is fixing the word-object link.

      *   **Case 2: Partial/Graded Similarity.**
          *   *The Output:* It's not just "This is a gavaya." It's "The word 'gavaya' applies to things like *this*." It establishes the extension of the term.
          *   *Degrees:* Nyaya acknowledges similarity (*sadrsya*) is real but vague. If similarity is too weak, the cognition doesn't arise. It's not "vague knowledge"; it's *no knowledge* (or doubtful knowledge, *samsaya*). *Pramana* yields definite cognition (*nirnaya*). If the match is borderline, you get doubt, not *upamiti* (comparative knowledge).
          *   *Respects:* The instruction usually specifies relevant respects (shape, size). If you match on irrelevant respects, the causal chain is broken.

      *   **Case 3: Right Answer, Wrong Route (Deviant Matching).**
          *   *The Luck Problem:* This is a classic Gettier-style issue before Gettier.
