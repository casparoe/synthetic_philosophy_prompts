answer: |-
  This is a classic and sharp set of objections. The reductionist critique of *upamana* (comparison) is as old as the school itself (the Buddhists and Mimamsakas attacked it relentlessly), and your intuition that it looks like a cocktail of perception, memory, and testimony is exactly where the philosophical battle lines are drawn.

  To understand why Nyaya insists it is a distinct *pramana* (source of knowledge), you have to stop looking at the *process* (which does look composite) and look strictly at the **content of the resulting cognition** and the **causal conditions** required to produce it.

  Here is the conceptual machinery, followed by an analysis of your four edge cases.

  ### The Core Argument for Distinctness

  You asked: *Once you subtract seeing, remembering, and matching, what is left?*

  Nyaya answers: The specific cognition of the **relation between a word and its referent** (*shakti* or *samjna-sambandha*), mediated by similarity.

  Here is why the other three *pramanas* cannot generate this specific cognition on their own:

  **1. Why it isn't Testimony (*Shabda*)**
  In valid testimony, the knowledge arises immediately upon hearing and understanding the sentence. If I say, "There is fire on the hill," and you trust me, you know it then.
  In the *gavaya* case, when you hear "A gavaya is like a cow," you **do not** acquire knowledge of what a gavaya is at that moment. You cannot, because the subject term 'gavaya' is empty for you. You only acquire a *desire* to know or a *rule for identification*. The actual knowledge arises days later when you see the animal.
  *   **The Distinction:** Testimony conveys meaning synchronously. *Upamana* conveys meaning diachronically. The sentence in *upamana* is not the source of the final knowledge; it is merely a causal condition that sets up the comparison. If it were just testimony, you would know what a gavaya is while sitting in your living room. You don't.

  **2. Why it isn't Perception (*Pratyaksha*)**
  Perception gives you "This is an animal with horns and a dewlap." It gives you the *object*. It does not give you the *name*.
  Perception cannot grasp the relation between a linguistic convention (the word 'gavaya') and the object. You can see the animal all day; without the prior verbal instruction linking the word to the similarity, the word 'gavaya' will never attach to that percept.
  *   **The Distinction:** Perception grasps the object; *Upamana* grasps the *naming* of the object.

  **3. Why it isn't Inference (*Anumana*)**
  Inference requires a universal, invariable connection (*vyapti*). "Wherever there is smoke, there is fire."
  In *upamana*, the connection is not invariable. It is based on similarity (*sadrsya*). "This looks *like* a cow." Similarity is not a logical universal; it is a perceived resemblance. Furthermore, inference concludes a property of the subject (e.g., "This hill has fire"). *Upamana* concludes the applicability of a name ("This animal is the referent of the word 'gavaya'").
  *   **The Distinction:** Inference relies on logical pervasion; *Upamana* relies on perceived resemblance to fix a semantic reference.

  **The "Leftover"**
  What is left over is the unique cognitive event: **"This particular object is the referent of that word I heard earlier."**
  Nyaya argues that no other *pramana* can link a *remembered verbal description* to a *perceived particular* to establish a *semantic convention*. That specific triangulation is the unique job of *upamana*.

  ---

  ### Analysis of Your Four Cases

  Here is where the machinery strains, and how Nyaya attempts to handle the stress.

  #### 1. Reversed Direction (Known Gavaya, Unknown Cow)
  *The Case:* You know gavayas, hear "A cow is like a gavaya," then see a cow and identify it.
  *The Nyaya Handling:* The theory is structurally symmetric, but the definition is teleological. *Upamana* is defined as the knowledge of the relation between a **name** and the **named**.
  *   If your goal is to learn what the word "Cow" refers to, this is *upamana*.
  *   If your goal is simply to identify an object you already have a name for, Nyaya might classify this as Recognition (*Pratyabhijna*), which is often subsumed under Perception.
  *   **Does direction matter?** Not for the mechanism, but for the classification. *Upamana* is essentially a **semantic learning tool**. If you are fixing the reference of the word "Cow" via the known "Gavaya," it counts. If you already know both words and are just noting a biological similarity, that is Perception/Inference. The "textbook direction" (Known $\to$ Unknown) is just the most common pedagogical use case, not a metaphysical constraint.

  #### 2. Partial, Graded Similarity
  *The Case:* The match is messy (buffalo-like horns, cow-like body). What is the output?
  *The Output:* The output of *upamana* is not merely "This is a gavaya." It is "The word 'gavaya' applies to things possessing this specific cluster of similarities." It establishes the extension of the term.
  *   **Degrees:** Nyaya admits similarity comes in degrees, but *prama* (valid knowledge) does not. *Prama* must be definite (*nirnaya*). If the similarity is borderline, the cognition that arises is **Doubt** (*Samsaya*), not *Upamiti* (comparative knowledge).
  *   **The Strain:** This is a weak point. Nyaya relies on the speaker's instruction to filter relevant similarities. If the speaker says "like a cow," they imply *relevant* respects (general shape, size), not *all* respects (color, mood). If the perceiver latches onto irrelevant respects, the causal chain is defective. The theory struggles to formally define "relevant similarity" without circularity (i.e., "relevant means the ones that lead to correct identification").

  #### 3. Right Answer, Wrong Route (Deviant Matching)
  *The Case:* Speaker meant size; you matched on horns; you found a gavaya anyway.
  *The Nyaya Handling:* This is a **Gettier-style problem**, and Nyaya has a specific tool for it: *Karana* (Instrumental Cause).
  For a cognition to be *prama* (knowledge), it must be produced by the *correct instrumental cause*.
  *   In *upamana*, the instrumental cause is the perception of similarity **in the respects specified by the testimony**.
  *   If you match on the wrong respect (horns vs. size), the specific causal chain of *upamana* has not operated. Even if the result is true ("This is a gavaya"), it is **Accidental Truth** (*tathartha*), not Knowledge (*prama*).
  *   **The Strain:** This requires a very fine-grained analysis of the perceiver's internal state. How do we prove *which* feature triggered the identification? Nyaya assumes a causal regularity here that is hard to verify externally. But conceptually, they hold firm: Luck invalidates the *pramana* status, even if the proposition is true.

  #### 4. The Second Time (Recurrence)
  *The Case:* You've seen ten gavayas. Is the eleventh *upamana*?
  *The Nyaya Handling:* No. *Upamana* is a **generative** source of semantic knowledge, not a **sustaining** one.
  *   **First Encounter:** You lack the word-object link. *Upamana* generates the link.
  *   **Subsequent Encounters:** You possess the link. You see the animal (Perception) + recall the name (Memory). This is complex Perception (*savikalpa pratyaksha*).
  *   **Analogy:** *Upamana* is learning to read the word "Cat." Once you know it, reading the word "Cat" again is just perception/recognition. You don't re-learn the alphabet every time.
  *   **The Strain:** This creates a boundary problem. What if I haven't seen a gavaya in 20 years and my memory is fuzzy? Do I need a mini-*upamana* to refresh the link? Nyaya generally says no; as long as the memory trace (*samskara*) exists, it's Perception+Memory. *Upamana* fires only to establish the convention initially.

  ### Where the Theory Strains

  You asked for the conceptual strain points. Here are the two biggest vulnerabilities in the Nyaya account of *upamana*:

  1.  **The "Relevant Similarity" Problem:** The theory hinges on the similarity being in the "right respects." But *upamana* is supposed to be the source of knowing what the word refers to. If I need to already know which respects are relevant to make the comparison work, do I not need prior knowledge of the gavaya to know which similarities matter? Nyaya escapes this by relying on the authority of the speaker's testimony to filter the respects, but this makes *upamana* heavily dependent on *Shabda* (testimony), blurring the distinctness they fight so hard to maintain.
  2.  **The Causal Opacity:** In Case 3 (Wrong Route), Nyaya says accidental matches aren't knowledge. But cognitively, a successful identification via wrong features feels identical to one via right features. The distinction exists in the metaphysical causal history, not in the phenomenology of the knower. This makes *upamana* an externalist account of knowledge (depends on facts outside the mind) which is robust against skepticism but difficult to apply in real-time epistemic assessment.

  ### Summary
  Nyaya saves *upamana* from reductionism by defining its object narrowly: it is not knowledge of the animal, nor knowledge of the sentence, but knowledge of the **naming convention** linking the two via similarity.
  *   It is not Testimony because the knowledge is delayed.
  *   It is not Perception because it involves a verbal convention.
  *   It is not Inference because it relies on resemblance, not universal pervasion.

  Your four cases show that while the *definition* is distinct, the *application* relies heavily on the reliability of the initial testimony and the precision of the similarity match. If those wobble, *upamana* collapses into doubt or lucky guesswork.
