          *   *Nuance:* Some later Naiyayikas might argue every application involves recalling the similarity, but the standard view is that *upamana* is for the *first* fixation of the name-object relation.

  5.  **Refining the "Why Not Testimony" Argument:**
      *   This is the user's strongest objection. I need to be precise.
      *   In Testimony, the speaker's intention (*tatparya*) is grasped immediately.
      *   In *Upamana*, the sentence heard initially is *incomplete* cognitively. You hear "Gavaya is like a cow." You understand 'cow', 'like', 'is'. You don't understand 'Gavaya'. It's a placeholder.
      *   The knowledge completes only when the perceptual encounter happens.
      *   Therefore, Testimony provides the *rule*, Perception provides the *instance*, but *Upamana* is the unique synthesis that links the *name* to the *instance* via the *rule*. Neither parent pramana can do that synthesis alone.

  6.  **Review against Constraints:**
      *   No citations? Check.
