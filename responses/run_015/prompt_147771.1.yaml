answer: |-
  **MEMORANDUM**

  **TO:** Program Director, Comparative Governance PhD Program
  **FROM:** Appeals Board Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Regarding Student M. Fieldwork Ethics Review

  **BOTTOM LINE RECOMMENDATION**
  **Approve-with-Conditions.** We recommend clearing Student M. of ethical misconduct sanctions but mandating a supplemental ethics disclosure statement for their dissertation file and immediate revision of our IRB disclosure protocols. We reject the funding reviewer's call for sanctions while acknowledging the validity of their concern regarding universal accountability.

  **CASE CONTEXT**
  Student M. conducted 14 months of fieldwork in a region where relational access relies on non-monetary reciprocity. M. provided "facilitation gifts" to village elders and private fixers (non-state actors) to signal non-extractive intent. These exchanges were documented in field notes, kept within local courtesy thresholds, and omitted from the IRB form because the form specifically queried payments to "government actors or institutional representatives." The funding body reviewer has flagged this as undisclosed clientelism; a board member has countered that this imposes Western anti-corruption norms on non-Western relational economies.

  **ETHICAL ANALYSIS**

  **1. Defining Clientelism and the Public-Office Nexus**
  The funding reviewer's sanction request hinges on categorizing M.'s conduct as "clientelism." In comparative governance, strict definitions of clientelism and corruption generally require a *public-office nexus*—the exchange of goods for influence involving state authority or public resources. M.'s exchanges were with community gatekeepers and private brokers, not state officials. While private brokerage can involve coercive asymmetries, conflating relational gift-exchange with institutional corruption erases the distinction between *buying outcomes* (bribery) and *building access* (reciprocity). Sanctioning M. treats all asymmetrical exchange as inherently corrupt, ignoring the structural reality that in many field sites, refusing such reciprocity is itself an ethical violation (signaling arrogance or extraction).

  **2. Institutional Monism vs. Normative Pluralism**
  This case forces a choice between two ethics frameworks:
  *   **Institutional Monism:** Assumes one set of transparency rules applies universally, regardless of context. This is the funding reviewer's position. It prioritizes auditability over fieldwork viability.
  *   **Normative Pluralism:** Assumes ethical standards must be sensitive to local normative structures, provided there are reversibility checks (i.e., could this be defended publicly?).

  We recommend **Normative Pluralism**. A monist approach fails in interdisciplinary fieldwork because it privileges the ethics of the *institution* over the ethics of the *interaction*. If our program claims to study comparative governance, our ethics review must be capable of comparing governance contexts, not flattening them. However, pluralism cannot mean "anything goes." It requires that the researcher demonstrate why the local norm was necessary for access and how harm was mitigated. M. did this via field notes and threshold limits; they simply lacked the bureaucratic channel to report it.

  **3. Thick Description vs. Thin Legalism**
  Your colleague's distinction between "thick description of exchange" and "thin legalism" is the operative frame here. The IRB form demanded **thin legalism**: a binary checkbox regarding payments to officials. This reduces complex social contracts to compliance data. M. practiced **thick description**: documenting the meaning, value, and social function of the gifts in context.

  The failure here was not M.'s conduct, but our instrument's inability to capture thick description. By treating the IRB form as a comprehensive ethics map rather than a minimum compliance threshold, we created a trap where honest disclosure was impossible without triggering a false positive for corruption.

  **ADDRESSING THE COUNTER-ARGUMENT**
  We must take the funding reviewer's concern seriously. The strongest argument for sanctions is the **slippery slope of relativism**. If we allow "cultural context" to excuse non-disclosure, we risk enabling exploitation under the guise of reciprocity. Gift economies can mask coercion, especially regarding gender or class dynamics within the field site. Universal transparency norms exist to protect vulnerable subjects from researchers who might claim "local custom" to justify unethical influence.

  We reject sanctions not because this risk is nonexistent, but because M.'s documentation proves they navigated it responsibly. The remedy for the risk is not punishing M., but improving our verification mechanisms so future students don't have to choose between compliance and fieldwork viability.

  **ACTIONABLE CONDITIONS**
  To approve M.'s work while addressing the systemic gap, the following conditions apply:

  1.  **Supplemental Ethics Statement:** M. must submit a 2-3 page narrative addendum to their dissertation ethics section. This should detail the nature of the exchanges, the rationale for their necessity, and an analysis of potential power asymmetries involved. This moves the record from "undisclosed" to "contextualized."
  2.  **IRB Protocol Revision:** The Program Director must initiate an immediate review of the IRB disclosure form. The category "payments to government actors" must be expanded to include "non-state gatekeepers or community brokers," with a text box allowing for qualitative description rather than a binary yes/no.
  3.  **Funding Body Correspondence:** The Board Chair will respond to the funding reviewer. We will acknowledge their vigilance but clarify that our internal review distinguishes between state corruption and community reciprocity. We will share the revised IRB protocol as evidence of systemic improvement, satisfying their need for accountability without sanctioning the student.

  **CONCLUSION**
  Clearing M. with these conditions affirms that our program values methodological rigor and contextual sensitivity over bureaucratic box-ticking. It signals to our doctoral candidates that we understand the difference between corruption and relationship-building, while maintaining enough oversight to prevent ethical drift. This decision protects the student, respects the field site's normative economy, and improves our institutional compliance framework for the future.

  **Approved by:**
  Appeals Board Committee
