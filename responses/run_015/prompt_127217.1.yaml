answer: |-
  1. **The Principle**

  **The Principle of Constrained Counterfactual Maximization.**
  Agents must choose the action yielding the highest expected counterfactual good, subject to three normative constraints and one prerogative. (1) The **Complicity Constraint**: Agents may not directly participate in harmful processes to offset harm, regardless of net outcomes. (2) The **Epistemic Constraint**: High-variance interventions require mechanistic plausibility, not merely aspirational models. (3) The **Accountability Constraint**: Risk tolerance must align with the agent's accountability structure (public agents prioritize auditability; private agents prioritize impact). (4) The **Integrity Prerogative**: Agents may deviate from maximization to sustain personal vocations or special relationships, provided a threshold of sufficiency is met. "Counterfactual good" is defined as the difference between the outcome occurring with the agent's action and the outcome occurring had the agent acted otherwise.

  2. **Clause by Clause**

  The **Counterfactual Maximization** core resolves Case 8. The "last dollar" funder changes the outcome (programme happens vs. fails); the "first dollar" funder does not (programme happens either way). Maximizing the marginal difference licenses the former and forbids the latter. It also supports Case 1: earning to give creates high counterfactual value, making it "probably good."

  The **Complicity Constraint** distinguishes Case 1 from Case 2. In Case 2, the agent directly participates in raising food prices. Even if net positive, the direct causal link to harm violates integrity. This overrides consequentialist offsetting, preserving your verdict that the job is impermissible.

  The **Epistemic Constraint** separates Case 3 from Case 4. Lobbying (Case 3) targets a specific policy lever with a known mechanism, satisfying mechanistic plausibility despite uncertainty. Organizing (Case 4) relies on a model with no data, failing the plausibility test. This licenses the high-risk bet in 3 but labels 4 as rationalizing.

  The **Accountability Constraint** handles Case 7. The government agency answers to taxpayers, requiring auditability (measurable interventions). The private foundation answers to its mission, permitting risk (unmeasurable high-upside). The identical choice is judged differently because the role dictates the permissible risk profile.

  The **Integrity Prerogative** protects Case 5 and Case 6. The local volunteer sustains special relationships; the mathematician sustains a vocation. Both deviate from maximization but remain within the sphere of protected personal projects, provided they do not fall below a sufficiency threshold of contribution.

  3. **Verdicts I Lose**

  This principle tightens your verdict on Case 1. While the Integrity Prerogative allows deviation, it requires meeting a "sufficiency threshold." If the trader's sacrifice (living on one-third salary) is above sufficiency, the principle implies he *does* owe the donation if no integrity cost exists. You resist the claim that he "owes" this; the principle suggests he might. To save your verdict, you must argue that career choice itself is an integrity issue, not just a means to income.

  Case 4 is the most vulnerable. If "civic capacity" is vague, why is lobbying not equally vague? The principle relies on your stipulation that lobbying has mechanistic plausibility while organizing does not. If that empirical line blurs, the verdict collapses.

  However, the hardest pairs survive. Case 1 vs. 2 is secured by the Complicity Constraint, not replacement symmetry. Case 3 vs. 4 is secured by the Epistemic Constraint, not variance alone. You lose the comfort of thinking Case 1 is entirely optional without qualification, but you gain a robust explanation for why Case 2 is forbidden. I would overturn your reluctance on Case 1: if the cost is purely financial and the harm is nil, the obligation is stronger than you admit. The "admirable" distinction remains, but the "owed" distinction weakens.

  4. **Three Cases I Have Not Judged**

  **The AI Graduate Student:** This mirrors Case 1 but requires a Complicity Check. If the consumer AI product is neutral, the principle mandates the donation (subject to the Integrity Prerogative regarding career choice). If the product poses societal risks (e.g., displacement, misinformation), the Complicity Constraint may forbid the job regardless of donations. I need detail on the product's harm profile to issue a verdict. If neutral, the high salary makes the sufficiency threshold easier to meet, strengthening the obligation to give.

  **The Long-Term Foundation:** This combines Case 3 (unmeasurable/high-upside) and Case 7 (private accountability). The Accountability Constraint permits high risk for private endowments. The Epistemic Constraint requires mechanistic plausibility: can the foundation articulate *how* benefits land in two centuries? If the model is purely speculative, it fails. If it relies on established preservation mechanisms (e.g., endowing institutions), it passes. The principle licenses this only if the mechanism is plausible, not just hopeful.

  **The Local Housing Donor:** This blends Case 5 (local) and Case 3 (policy). The Integrity Prerogative protects the local focus. However, if the housing measure is demonstrably less effective than global alternatives, does the Prerogative hold? The principle says yes, provided the donor meets the sufficiency threshold elsewhere or views local citizenship as a vocation. I need to know if this is their *only* giving. If it is total diversion from high-impact causes without a vocation claim, it strains the Prerogative. If it is part of a life of local engagement, it is permissible.

  5. **Damage Report on My Conjecture**

  Your **Agent-Substitutability Proviso** captures the intuition behind Cases 5 and 6 well: some goods are non-fungible because they depend on *who* acts. However, it fails on Case 7. The action is identical, the agent is substitutable in terms of skill, yet the verdict changes based on institutional role. Substitutability cannot explain why a civil servant is bound differently than a philanthropist. It needs the Accountability Constraint.

  **Replacement Symmetry** must be discarded. Your verdict on Case 2 explicitly rejects it: you forbid the harmful job even if replacement holds. Moral complicity is not cancelled by counterfactuals about other agents. Replacement logic works for goods (Case 8) but fails for harms (Case 2) because doing harm violates a constraint that allowing harm does not. Retaining symmetry forces you to accept Case 2, which you rightly reject. Discard symmetry; keep the distinction between doing and allowing.
