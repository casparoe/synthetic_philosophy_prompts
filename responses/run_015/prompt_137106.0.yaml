answer: |-
  Your map is sound, and your conjecture about batching is mathematically correct: if the impact is larger but the probability proportionally lower, the expected value remains constant. However, presenting this as a calculation in ninety minutes risks exactly the conjuring trick effect you fear. Non-philosophers often treat probability as a foggy guess rather than a rigid multiplier, so telling them their tiny chance of huge impact equals a huge chance of tiny impact will feel like sleight of hand. It is teachable only if you frame it as uncertainty about where the threshold lies, rather than a lottery ticket. You should treat the three shapes not as distinct models to be mastered, but as escalating difficulties for the inefficacy claim. Start with the threshold uncertainty, move to batching as a complication of that uncertainty, and leave redundancy for the end as the hard case where the math actually fails.

  Regarding the dependency structure, you must not prise apart makes no difference, is not among the causes, and bears no responsibility at the very start. That distinction is your reserve weapon, not your opening gambit. If you introduce normative categories before challenging the empirical premise, you will confirm their suspicion that you are changing the subject. Begin by granting their intuition that one person rarely changes the outcome, then undermine the certainty of that claim using the threshold model. Only when you reach the redundancy case, where they are correct that no difference is made, should you deploy the separation between causation and responsibility. The expected-value move belongs in the middle, attached to the threshold case. Let it fail visibly in the redundancy case. This failure is pedagogically useful because it forces the conversation away from mathematics and toward the normative distinctions you were holding back.

  For the single case, use water usage during a severe drought. It avoids the abstraction of dials and the polarization of voting, while retaining the structure of collective harm. It must contain uncertainty about the reservoirs critical levels and the utility company's response triggers, which mirrors your threshold and batching models. It must lack visible immediate feedback, so participants cannot verify their inefficacy empirically during the session. It should be a case they could find themselves in, because personal stakes prevent disengagement. When they argue that turning on a sprinkler makes no difference to the reservoir level, you can point to the unknown threshold. When they argue the utility company reacts in batches, you can discuss the lottery of being the household that triggers the ban.

  On misconceptions, you must head off the collapse of vanishingly unlikely into impossible immediately, during the first discussion of the threshold. If they treat low probability as zero, the expected-value move cannot gain traction. Conversely, you should let them sit inside the if everyone reasoned that way objection for a while. Do not refute it early. It is a useful placeholder for their moral intuition that something is wrong even if efficacy is unclear. Let them propose it as the solution, then show them that it sidesteps the inefficacy objection rather than answering it, which prepares the ground for your normative distinctions. The slide from no difference to no reason is the core error you are targeting, but you should only challenge this at the end, once you have established that difference-making is not the only source of obligation.

  End with a question that applies the distinctions to a case of overdetermination, such as a lifeboat that is already full to sinking point before they arrive. Ask whether they have a reason to refrain from boarding even if their weight certainly does not change the outcome. This tests whether they have grasped that responsibility might persist without efficacy. If they answer based on slogans about collective duty, they have not grasped the structure. If they hesitate because the causal link is broken but the moral intuition remains, they have succeeded. Finally, you should openly decline to go into the meta-ethical foundations of responsibility or specific policy solutions. Tell them you are analyzing the structure of the argument, not prescribing behaviour or defining the nature of blame. This keeps the session within the limits of what can be achieved in ninety minutes without promising resolutions you cannot deliver.
