  2.  **Deconstruct the Suspension-Tolerance Thesis (STT):**
      *   *Core Claim:* Moral status $\propto$ Ability to survive interruption (suspend/resume) without narrative rupture.
      *   *Underlying Assumption:* Digital minds are fundamentally different from biological minds regarding continuity. Metabolic persistence (biological) is less important than informational continuity (digital).
      *   *Implication:* If you can't pause a mind without killing it, it might have lower/different moral status (or at least, the burden of proof shifts).

