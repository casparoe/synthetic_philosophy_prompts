answer: |-
  ### Brainstorming Notes

  **Concept:** The core friction is between *sortition as description* (the sample *is* the people) and *sortition as prescription* (the sample *becomes* the state). 
  - **The Mirror:** Passive. Statistical validity. The idea that the body reflects the demographics, interests, and biases of the whole without alteration. If I am drawn, I am merely a data point representing my class/region.
  - **The Forge:** Active. Deliberative transformation. The idea that the act of serving changes the citizen. Institutions heat up, pressures apply, and the raw material of the citizen is hammered into a governor. If I am drawn, I am no longer what I was.

  **Tension:** If the forge works too well, the mirror breaks. If you transform the sample enough to rule wisely, do they still represent the people who sent them? If they remain a perfect mirror, are they capable of the forge-work required for rule?

  **Structure:** 
  - Stanzas 1-2: The draw, the statistical promise (Mirror/Lot).
  - Stanzas 3-4: The deliberation, the heating up (Forge/Voice/Silence).
  - Stanzas 5-6: The realization that the representation is lost to the transformation (Rule).
  - Envoi: The synthesis. Chance and Power are not opposites; they are the same mechanism.

  **Meter:** Iambic pentameter. Needs to be strict enough for oral reading but flexible enough to carry philosophical weight. Avoid archaic diction; keep it sharp, modern, academic but poetic.

  **End-Word Strategy:** 
  - *Lot:* Chance, fate, share.
  - *Mirror:* Reflection, image, truth.
  - *Forge:* Making, heating, changing.
  - *Voice:* Speech, vote, agency.
  - *Silence:* Listening, suppression, privacy lost.
  - *Rule:* Law, command, order.

  **Envoi Constraint:** "lot" next to "rule". I will place them in the same line to enforce the inseparability. "the lot rule binds..."

  ---

  ### The Iron Sample

  We draw the names to find the common lot,
  To hold the mirror up to nature's face,
  Within the forge the iron cools to shape,
  A single voice emerges from the crowd,
  The private self retreats to silence,
  And learn the weight and burden of the rule.

  Who knows the heavy burden of the rule
  When falling on the shoulders of the lot?
  The chamber demands a practiced silence,
  No longer just a glass and simple mirror,
  But heated metal in the state's own forge,
  Where private thought must yield to public voice.

  Now placed inside the deliberative forge,
  The citizen submits to strange new rule,
  The statistical promise starts to voice
  Dissent against the random turning lot.
  For how can static image in a mirror
  Reflect the change born of enforced silence?

  There grows a deep and deliberative silence
  As arguments are hammered in the forge,
  The polished surface cracks upon the mirror,
  For representation bends beneath the rule,
  And chance becomes a burden on the lot,
  When every member must articulate voice.

  No longer speaks the unrefined native voice,
  But one accustomed to the quiet silence,
  Transformed by service and the drawing lot,
  The body leaves the cold and static forge,
  To act within the living stream of rule,
  Though shattered is the perfect civic mirror.

  So broken hangs the democratic mirror,
  We hear the transformed and deliberative voice,
  And submit ourselves to chance and distinct rule,
  Accepting noise instead of pure silence,
  Knowing the fire waits within the forge,
  To burn away the innocence of lot.

  **Envoi**

  Here in the mirror speaks the public voice,
  Where lot rule binds the citizen to state,
  Through silence forged beneath the weight of rule.
