answer: |-
  Dear Friend,

  I have been reflecting on our conversation regarding the 2016 referendum and the question of who rightly constitutes the demos in such a momentous decision. It is a testament to the depth of the issue that we reached an impasse, for you were arguing from the intuition that impact demands voice, while I was holding the line that coercion and subjection define the boundary of membership. Rather than attempting to declare a winner between our positions, I want to walk through the event itself as a case study that tests the limits of the very theoretical frameworks we were invoking. The Brexit referendum serves as a peculiar stress test for democratic theory because it was conducted under one set of legal pretenses but executed under another, and this slippage exposes cracks in both the all-affected-interests principle and the all-subjected-persons principle that standard discussions often overlook.

  To begin with the concrete mapping you requested, we must look at who was actually permitted to cast a ballot. The franchise was granted to British, Irish, and Commonwealth citizens resident in the United Kingdom, as well as peers and members of the Crown Dependencies. This aligns somewhat comfortably with the all-subjected-persons principle, which argues that those who are subject to the coercive power of the state making the decision should decide the outcome. Since the referendum was organized by the UK Parliament under UK law, those subject to UK parliamentary sovereignty were the ones invited to speak. However, even here, the alignment was imperfect. British citizens who had lived abroad for more than fifteen years were excluded, despite remaining subject to certain UK laws and retaining citizenship, while EU nationals living long-term in the UK were excluded despite being subject to UK jurisdiction and deeply embedded in its social and economic life. Under the all-subjected logic, the exclusion of long-term EU residents is problematic because they were subject to the laws of the land they inhabited, yet under the strict citizenship model used, they were outsiders. Conversely, your position, rooted in the all-affected-interests principle, would cast a much wider net. You argued that EU nationals in Britain, British expatriates in Europe, and even those impacted by the long-term economic fallout should have been included. If we apply the all-affected principle rigorously, the franchise becomes potentially unbounded, as trade shifts and regulatory changes ripple across borders, affecting consumers and competitors far beyond the UK and the EU. The actual rules tried to strike a compromise but ended up satisfying neither principle completely, leaving a residue of excluded groups who could plausibly claim either subjection or affectedness.

  The tension becomes more acute when we consider the legal status of the vote. The referendum was technically advisory, meaning Parliament retained the sovereign right to ignore the result or legislate contrary to it. In a purely advisory context, the boundary problem is less severe because the vote is merely an aggregation of opinion to inform representatives who remain accountable for the final decision. However, the political reality was that the government and Parliament treated the result as binding, effectively converting an advisory poll into a constitutional command. This hybrid status creates a legitimacy deficit that neither principle fully anticipates. If the vote is advisory, the all-subjected principle suggests that the existing electorate is sufficient to provide advice to their representatives. But once the result is treated as binding, the decision acquires the weight of law, and the exclusion of those significantly affected becomes a violation of democratic norms. The shift from advice to command retroactively changes the requirements for the franchise. By treating an advisory mechanism as a binding mandate, the political actors bypassed the need to redefine the demos to match the new weight of the decision. This suggests that the legitimacy of a referendum depends not just on who votes, but on the clarity of the mandate being sought. When the boundary of the decision-making power is blurred, the boundary of the people entitled to participate becomes equally unstable.

  This instability points toward the temporal dimension that I believe neither of our initial positions fully captured. You mentioned those who would live with the consequences for decades, and this introduces the problem of future generations. If we extend the all-affected-interests principle to its logical conclusion, unborn citizens who will inherit the climate, economic, and geopolitical consequences of the withdrawal agreement ought to have a voice. Yet, they cannot vote. If we say they must be represented, we risk a reductio ad absurdum where the demos includes non-existent entities, making democratic authorization impossible. However, if we ignore them, we violate the core intuition of the all-affected principle that those who bear the cost should share in the choice. This reveals that both the all-affected and all-subjected principles are primarily spatial and contemporaneous; they struggle to account for time. The all-subjected principle fails because future generations are not yet subject to the law, and the all-affected principle struggles because their interests are hypothetical. The referendum exposes that democratic membership has a temporal component that requires a mechanism for trusteeship rather than simple authorization. It suggests that a legitimate decision on long-term issues requires institutions that can guard against the tyranny of the present over the future, something a one-off popular vote is structurally ill-equipped to provide.

  Furthermore, there is an epistemic layer to this boundary problem that complicates the claim of being affected. In the referendum, many voters cast ballots based on projections of affect that were contested or misunderstood. If a voter believes they are affected in a certain way, but the actual outcome affects them differently, or if they are affected by consequences they did not anticipate, does the all-affected principle still validate their vote? The principle assumes a certain transparency of interests, yet the complexity of global trade and sovereignty means that the true affects are often unknowable at the time of voting. This silence in the theory is significant. If democratic legitimacy relies on affected interests, but the voters cannot fully understand those interests due to complexity or misinformation, the boundary of the demos becomes less about who is affected and more about who is capable of judging the affect. This pushes us toward a tension between inclusion and competence that neither principle resolves. The referendum showed that expanding the franchise to include all affected parties does not guarantee that those parties can effectively authorize a decision they do not fully comprehend.

  Ultimately, the 2016 episode suggests that the boundary problem is not merely a question of drawing a line around a group of people, but of defining the nature of the decision itself. The all-subjected principle offers stability but risks excluding those who bear the brunt of the outcome without having formal status, while the all-affected principle offers moral inclusivity but risks dissolving the boundary of the polity entirely. The referendum revealed that when a decision is treated as binding despite being advisory, and when it impacts future generations who cannot speak, the standard frameworks leave us without a clear metric for legitimacy. It implies that we need a theory of democratic boundaries that incorporates time and mandates, recognizing that some decisions are too enduring to be settled by a transient majority of current subjects, yet too political to be left to trustees alone. Our dispute was not just about who should have voted, but about what kind of decision we were making. I was right that subjection provides a clear legal boundary, but you were right that affect captures the moral weight. The tragedy of the episode is that the process honored neither fully, treating a complex, intergenerational shift as a simple binary choice for a fixed, contemporary electorate. I hope this analysis helps us move past the impasse by showing that the fault lies not just in our differing principles, but in the inadequacy of those principles when faced with a decision that transcends the immediate moment and the existing legal order.
