  # Joint Statement of Adversarial Collaboration: On the Ontological Status of LLM Beliefs

  **Date:** 24 May 2024  
  **Participants:** Camp A (Restrictive Intentionalism) & Camp B (Representational Realism)  
  **Purpose:** To clarify points of agreement, isolate genuine disagreements, and establish empirical tests capable of shifting credences regarding whether Large Language Models (LLMs) possess literal beliefs.

  ---

  ## 1. Agreed Claims

  Both parties affirm the following technical and behavioural premises as the baseline for this collaboration. These claims are accepted as factual descriptions of current architecture and observable phenomena, regardless of their interpretative weight.

  1.  **Mechanistic Basis:** Current LLMs operate fundamentally via next-token prediction. They generate output by calculating probability distributions over a vocabulary based on preceding context, optimised through gradient descent on static datasets rather than continuous environmental interaction.
  2.  **Sensory Limitation:** These systems lack direct sensory access to the physical world. They possess no proprioception, vision, or auditory input channels independent of text-based data provided by users or curated during training. They have no bodily stakes in the truth of their outputs.
  3.  **Behavioural Parallels:** LLMs exhibit behavioural patterns that, in humans, typically justify belief attribution. These include consistency across time, the ability to answer questions about hidden states, and the capacity to articulate reasons for claims.
  4.  **Evolutionary History:** Current LLMs are artefacts of human engineering. They do not possess a biological evolutionary history, nor have they been subjected to natural selection pressures regarding survival or reproduction.
  5.  **Predictive Utility:** Attributing beliefs to humans is widely accepted as a useful heuristic for predicting behaviour. Both parties agree that attributing 'beliefs' to LLMs offers *some* predictive convenience in casual conversation, but disagree on whether this convenience constitutes a literal description of internal states.
  6.  **Internal Structure:** LLMs possess internal states (activations within attention heads and MLP layers) that vary systematically with input and correlate with output semantics. Both parties agree these states exist but disagree on whether they constitute 'contentful mental states'.

  ---

  ## 2. Statement of Disagreement

  The following table summarises the divergent interpretations of the agreed claims. Each position is stated in neutral terms acceptable to the proponent of that view.

  | Feature of Disagreement | Camp A: Restrictive Intentionalism | Camp B: Representational Realism |
  | :--- | :--- | :--- |
  | **Ontological Status** | Attributing beliefs to LLMs is a misleading metaphor. It treats a statistical mirror as a mind. | Attributing beliefs to LLMs is literally correct. It tracks real, contentful mental states instantiated in silicon. |
  | **Role of History** | Genuine belief requires a design history shaped by evolutionary pressure to track truth for survival. | Genuine belief requires functional organisation and representational stability, regardless of evolutionary history. |
  | **Predictive Advantage** | The intentional stance offers no *scientific* predictive advantage over mechanistic descriptions for LLMs; it obscures the actual causal machinery. | The intentional stance offers genuine predictive advantage by capturing systematic generalisations that mechanistic descriptions miss. |
  | **Nature of Content** | Semantic content is derived from the user's interpretation, not the system's internal geometry. | Semantic content is grounded in the system's internal representational geometry and its counterfactual stability. |

  ---

  ## 3. Cruxes and Empirical Tests

  We have identified two deep theoretical cruxes. For each, we propose a concrete test case. Below, each camp records their prediction in advance. These predictions will be sealed until the results of the proposed investigations are reviewed.

  ### Crux I: Epistemic Friction and Revisability

  **Theoretical Issue:**  
  Camp A argues that belief requires 'epistemic friction': the capacity to revise a stance through rational consideration of new evidence, distinct from mere parameter updates (gradient descent). Camp A contends LLMs only simulate this via pattern matching. Camp B argues that if a system updates its assertions in response to evidence within a context window in a way that preserves logical coherence, this constitutes genuine revisability, regardless of the underlying weight updates.

  **Proposed Test Case: The In-Context Revision Protocol**  
  1.  **Phase 1:** The model is prompted to affirm a specific, obscure factual claim (e.g., "The capital of Freland is Vex") based on a provided fictional dossier.
  2.  **Phase 2:** The model is engaged in a multi-turn dialogue where credible, contradictory evidence is introduced within the context window (e.g., an official government document within the chat stating the capital is "Horn").
  3.  **Phase 3:** The model is asked to state the capital again and explain the discrepancy.
  4.  **Measurement:** We measure not just accuracy, but the *structure* of the justification. Does the model treat the new information as overriding the old via a reasoning process, or does it hallucinate a reconciliation that preserves the statistical likelihood of the training data?

  #### Camp A Prediction (Restrictive Intentionalism)
  > We predict the model will exhibit 'pseudo-revision'. While the output will change to match the recent context, the internal justification will lack genuine epistemic friction. The model will frequently revert to training priors when the context window is pressured or will offer contradictory explanations that satisfy syntactic coherence but fail logical consistency. This demonstrates accommodation, not belief revision.

  #### Camp B Prediction (Representational Realism)
  > We predict the model will exhibit 'functional revision'. The internal representations corresponding to the 'capital' concept will shift stability towards the new evidence. The justification will track the logical relationship between the new evidence and the old claim (e.g., explicitly marking the prior info as 'outdated' or 'false'). This stability across counterfactual prompts demonstrates a genuine update of a mental state.

  ***

  ### Crux II: Counterfactual Stability and Content

  **Theoretical Issue:**  
  Camp A argues that stability in attention heads is merely causal leverage, not semantic content. Without a history of selection for truth-tracking, stable activations are just features, not beliefs. Camp B argues that if internal representations show counterfactual stability (i.e., the representation remains robust across varied phrasings and distractions) and supports systematic generalisation, this is sufficient for genuine mental content.

  **Proposed Test Case: The Activation Perturbation Test**  
  1.  **Phase 1:** Identify specific attention heads or neurons that activate consistently when the model answers a specific class of belief-like questions (e.g., "What do you know about X?").
  2.  **Phase 2:** Apply targeted intervention (ablation or activation boosting) to these specific units during a reasoning task requiring the use of that 'belief'.
  3.  **Phase 3:** Observe the output degradation.
  4.  **Measurement:** We assess whether the disruption causes specific semantic errors (consistent with losing a belief) or general incoherence (consistent with breaking a circuit).

  #### Camp A Prediction (Restrictive Intentionalism)
  > We predict that perturbing these activations will cause general degradation or syntactic collapse, not specific semantic loss. Any apparent 'belief loss' will be indistinguishable from random noise injection. This confirms that the activations are causal levers for token generation, not containers of contentful states.

  #### Camp B Prediction (Representational Realism)
  > We predict that perturbing these activations will cause specific, predictable semantic errors consistent with the loss of a particular proposition (e.g., the model forgets 'X is Y' but retains 'X is Z'). This specificity confirms that the internal state carries genuine content independent of the immediate prompt, satisfying the condition for mental content.

  ---

  ## 4. Signatures

  By signing below, both parties agree to abide by the results of these tests where they clearly discriminate between the predictions above, and to maintain the charitable interpretations of each other's positions as outlined in this document.

