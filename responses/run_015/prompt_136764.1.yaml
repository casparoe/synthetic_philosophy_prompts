  ### The Principle of Grounded Strategic Integrity (GSI)

  A strategic profile constitutes a valid Program Equilibrium if and only if it satisfies the following four clauses:

  1.  **Static Epistemic Access:** Each agent must have complete, deterministic, and noise-free access to the opponent's source code as immutable data *prior* to the initiation of its own execution logic.
  2.  **Causal Acyclicity:** The initialization of an agent's decision procedure must not causally depend on the *runtime initialization* of the opponent in a mutually exclusive loop. (Evaluation must be well-founded).
  3.  **Non-Interference:** No agent may modify, rewrite, or alter the source code or execution environment of another agent during the evaluation or execution phase.
  4.  **Logical Termination:** The decision procedure must be guaranteed to halt based on logical derivability (e.g., proof search or fixed-point theorems) rather than contingent on arbitrary runtime timeouts or simulation depth limits.

