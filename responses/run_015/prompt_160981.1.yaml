answer: |-
  ### Essay Question

  **Time Allowed:** 90 Minutes
  **Total Marks:** 20
  **Instructions:** Answer the question below. You may not consult books or notes. All necessary information is contained in the question.

  **Question:**

  Consider the standard Twin Earth argument: on a duplicate planet, the liquid called 'water' is not H₂O but a different substance (XYZ), indistinguishable from H₂O without chemistry. The argument concludes that what 'water' refers to depends on the external environment, not just the speaker's mind.

  Now consider two variations on this story:

  1.  **The Switched Planet:** Suppose a planet exactly like Earth until 1900, where the liquid was H₂O. Over the following generation, every sample was quietly replaced by XYZ (same appearance and behavior, different chemistry). Nobody noticed. The word for the liquid was passed down in an unbroken chain from before 1900. Today, a speaker says, "This liquid is good for the crops." Does her word pick out H₂O, XYZ, both, or nothing?
  2.  **The Mixed Planet:** Suppose a planet where two chemically different liquids (H₂O and XYZ) occur naturally in equal quantities, indistinguishable without analysis, used for the same purposes by a community with a single word for both and no knowledge of the difference. Does that word pick out both liquids, one of them, or neither?

  Write an essay addressing the following:
  1.  Analyze what determines reference in the **Switched Planet** case. Does the history of the word or the current nature of the liquid decide the matter?
  2.  Analyze what determines reference in the **Mixed Planet** case. What problem does this pose for the rule that a word picks out "whatever has the same underlying nature as the samples around the speaker"?
  3.  Finally, distinguish between **reference** (what words pick out) and **thought** (what speakers believe). Does showing that reference differs between these cases prove that the speakers believe different things? State explicitly what further premise would be needed to move from a conclusion about reference to a conclusion about thought.

  ***

  ### Model Answer

  The Twin Earth argument establishes that reference is not determined solely by internal mental states. However, the two variations provided—the Switched Planet and the Mixed Planet—reveal that simply appealing to "the external world" is insufficient. We must specify *which* external factors fix reference, and whether reference fixes thought.

  In the Switched Planet case, we face a conflict between historical causation and current environment. The speaker uses a word inherited from a chain originating when the liquid was H₂O. However, the liquid currently surrounding her is XYZ. If reference is fixed by the causal history of the word's acquisition, then she refers to H₂O, even though none exists around her. She is effectively mistaken about the nature of the liquid she interacts with. Conversely, if reference is fixed by the current physical relation between speaker and object (a "no-branching" constraint), she refers to XYZ, because that is what she is actually interacting with. The slogan "meanings ain't in the head" does not resolve this; it only tells us that something outside the head matters. It does not tell us whether the relevant outside factor is the past origin or the present substance. A plausible view is that history dominates: the word retains its original reference until the community collectively adjusts its usage, suggesting she refers to H₂O but is universally mistaken about its properties.

  The Mixed Planet case challenges the formulation of the externalist rule itself. The standard rule suggests a word picks out whatever shares the "same underlying nature" as local samples. But here, there are two underlying natures (H₂O and XYZ) associated with equal legitimacy. If the rule requires a single nature, the term fails to refer, or refers indeterminately. If the term succeeds in referring (as intuitively it seems to, since the community uses it successfully), then the rule must be amended. It cannot be "same underlying nature" simpliciter; it must be "same underlying nature *as recognized by the community*" or perhaps a disjunctive nature (H₂O-or-XYZ). This shows that social usage plays a role alongside chemical structure. The externalist cannot simply point to chemistry; they must explain how the community's interaction with a heterogeneous environment fixes a single extension. If the word picks out both, then "underlying nature" is not the sole determinant, since there is no single nature.

  This leads to the distinction between reference and thought. Reference is the relation between a word and the object it picks out in the world. Thought (or propositional content) is what the speaker understands or believes when they use the word. Even if we conclude that the Switched Planet speaker refers to H₂O while her Twin Earth counterpart refers to XYZ, it does not automatically follow that they believe different things. They are internally identical; they make the same inferences and have the same sensory experiences. To conclude that their beliefs differ, we need a further premise: **The Principle of Content Externalism.** This premise states that the content of a belief is constituted by the reference of the terms used to express it.

  Without this premise, one could argue for "two-factor" theories: reference is external (fixed by history/chemistry), but thought content is internal (fixed by cognitive role). On this view, the speakers refer to different liquids but express the same belief state. Therefore, the Twin Earth argument alone proves externalism about reference, but only proves externalism about thought if we assume that belief content is transparently determined by reference. The variations show that reference is complex (involving history and social usage), but moving from reference to thought requires a separate philosophical commitment about the nature of psychology.

  ***

  ### Marking Scheme

  **Total Marks:** 20 (5 Points × 4 Marks)
  **Marker's Note:** Do not award marks for naming philosophers (e.g., Putnam, Burge) or papers. Award marks only for reasoning.

  **Technical Terms Defined for Marker:**
  *   **Reference:** The relationship between a word and the object/substance in the world it picks out.
  *   **Thought (Content):** What the speaker understands or believes; the psychological state associated with the word.
  *   **Externalism:** The view that factors outside the individual's mind (environment, history) determine meaning or content.

  | Point | Requirement (4 Marks Each) | Common Error (How students lose marks) |
  | :--- | :--- | :--- |
  | **1. Switched Planet Analysis** | Identifies the tension between **historical chain** (H₂O) and **current environment** (XYZ). Argues that the slogan alone doesn't decide which factor wins. | Treats the answer as obvious (e.g., "It's obviously XYZ now") without acknowledging the historical counter-argument. |
  | **2. Mixed Planet Analysis** | Identifies the **disjunction problem**: if there are two natures, the "same underlying nature" rule fails or requires amendment (e.g., to disjunctive or social criteria). | Assumes the word simply refers to both without noting this breaks the "single underlying nature" rule provided in the prompt. |
  | **3. Reference vs. Thought** | Explicitly distinguishes between what the word **picks out** (reference) and what the speaker **believes/understands** (thought/content). | Conflates the two, assuming that if reference changes, belief *must* change without argument. |
  | **4. The Missing Premise** | States the further premise needed to move from reference to thought (e.g., "Belief content is constituted by reference" or **Content Externalism**). | Fails to identify a premise, or suggests the Twin Earth story itself proves the point about thought without extra assumptions. |
  | **5. Critique of the Slogan** | Explains why retelling the original story/slogan is insufficient (as per the prompt's goal). Shows that externalism is not a single monolithic view. | Merely repeats "meanings ain't in the head" as a conclusion rather than analyzing the mechanisms behind it. |

  **Grading Thresholds:**

  *   **Bare Pass (8-11 marks):** The student answers all three parts of the question but lacks depth. They likely identify the H₂O/XYZ difference in the Switched case but miss the historical nuance. They distinguish reference and thought but fail to articulate the specific premise needed to link them. The essay may rely heavily on restating the prompt scenarios.
  *   **Excellent Answer (16-20 marks):** The student treats the variations as genuine philosophical problems, not just puzzles with obvious answers. They clearly articulate that "externalism about reference" does not logically entail "externalism about thought" without the additional premise. The writing is structured, precise, and avoids unnecessary jargon while maintaining analytical rigor. They successfully demonstrate that the "same underlying nature" rule is insufficient for the Mixed Planet case.
