answer: |-
  This is a profound organizational ethics dilemma that sits at the intersection of labor rights, professional virtue, and public health necessity. You are describing a classic case of **structural incoherence**, where the formal structure of the job (contractual hours) contradicts the operational reality (24/7 necessity), and the bridge between them is built on moral manipulation rather than clear obligation.

  To answer your request, we must dissect the moral categories at play, identify the specific ethical violation occurring, and determine which philosophical framework best justifies a remedy.

  ### 1. The Conceptual Distinction: Supererogation vs. Covert Duty

  You asked if there is a philosophically coherent distinction between actions that are praiseworthy but not required, and those that are de facto duties disguised as virtues.

  **The Concept: Supererogation**
  In moral philosophy, an action is **supererogatory** if it is good to do, but not wrong to omit. Classic examples include heroism or significant charity. The defining feature of the supererogatory is the **absence of penalty for omission.** If you do not run into a burning building, you are not blamed; if you do, you are praised.

  **The Distinction: Coercive Supererogation**
  Your current system has created what ethicists might call **coercive supererogation** or **moral blackmail**.
  *   **Genuinely Praiseworthy:** An act where the agent has full discretion to decline without impact on their standing, resources, or livelihood.
  *   **De Facto Duty:** An act where omission results in negative consequences (stalled career, social stigma, resource deprivation), even if no formal rule mandates it.

  In your network, the on-call shifts have ceased to be supererogatory. Because authorship and budget access are contingent upon them, they have become **conditional obligations**. The distinction lies in the *cost of refusal*. If the cost of saying "no" is professional marginalization, the action is no longer voluntary; it is a **shadow contract**.

  ### 2. The Specific Moral Error: Extraction of Surplus Moral Labor

  You asked if the institution has committed a specific moral error by treating voluntary contribution as a prerequisite for fair treatment.

  **The Error: Institutional Hypocrisy and Exploitation**
  Yes. The institution is engaging in the **extraction of surplus moral labor**. This concept merges Marxist labor theory (surplus value) with feminist ethics (emotional/care labor).
  *   **The Mechanism:** By framing essential labor as "professional citizenship" or a "gift," the institution avoids the cost of formally valuing it (overtime pay, contracted hours).
  *   **The Rhetoric of the Gift:** Anthropologist Marcel Mauss noted that gifts create obligations. By framing this work as a "gift" from the employee to the public/patients, the institution creates a moral debt. If the employee refuses the "gift" opportunity, they are framed as morally deficient ("lacking team commitment").
  *   **The Injustice:** This system disproportionately penalizes those with existing care obligations (like your senior analyst). It privileges employees who have no external constraints (no aging parents, no young children) to "donate" their time. This converts **structural inequality** into **individual moral failure**. The analyst feels "morally defective" not because she is, but because the system has successfully privatized a public cost.

  **The Verdict:** The moral error is **category fraud**. You are treating essential infrastructure maintenance (outbreak verification) as discretionary charity. This is unjust because it makes public safety dependent on the private altruism of under-compensated individuals.

  ### 3. Analytical Frameworks for Reform

  You are weighing two reforms. To choose, we must apply the correct ethical framework.

  #### Framework A: Perfect vs. Imperfect Obligations (Kantian/Deontological)
  *   **Perfect Obligations:** Duties that are owed to specific others and are enforceable (e.g., a doctor's duty to treat a patient on shift).
  *   **Imperfect Obligations:** General duties to promote good, but with discretion on how and when (e.g., a duty to be charitable).

  **Analysis:**
  Currently, your network treats outbreak verification as an *Imperfect Obligation* (voluntary citizenship). However, given the stakes (preventing deaths from antibiotic-resistant infections), this work is actually a *Perfect Obligation* of the institution to the public.
  *   **Support for Reform 1 (Codify):** If the work is a Perfect Obligation of the role, it must be explicit, universal, and compensated. Relying on Imperfect Obligation for essential safety functions is ethically unstable.
  *   **Support for Reform 2 (Protect Voluntariness):** This framework would only support Reform 2 if the work were truly optional. If the network can function without night/weekend verification, then it should remain imperfect. If it *cannot* function without it, Reform 2 is a band-aid that leaves the core category error intact.

  #### Framework B: Structural Coercion and Justice (Political Philosophy)
  This framework focuses on power dynamics and the conditions of choice.
  *   **The Problem:** The "choice" to volunteer is coerced by the control of scarce resources (authorship, sequencing budget). This is a **power asymmetry**.
  *   **Support for Reform 1:** Justice requires that essential labor be distributed fairly and compensated. Codifying the shifts as paid, rotating obligations removes the coercion. It acknowledges the labor as *work*, not *virtue*.
  *   **Support for Reform 2:** Anonymizing logs attempts to restore negative liberty (freedom from interference). However, in a collaborative environment, labor is rarely anonymous. If the work gets done, someone did it. If that "someone" is consistently rewarded, the coercion returns informally.

  ### 4. Recommendation: The Case for Codification

  Based on the conceptual structure, **Reform 1 (Codify as paid, rotating obligations)** is the only philosophically coherent solution.

  **Why Reform 2 Fails:**
  Attempting to protect the "genuine voluntariness" of the shifts (Reform 2) accepts the premise that this work *could* be optional. But you stated that confirming an outbreak "can prevent deaths." If the work is necessary for public safety, it cannot be optional.
  *   If you anonymize logs but the work still *needs* to be done, you create a **free-rider problem**. Those who value career advancement will still do the work; those who don't won't. The disparity in advancement remains, even if the logs are hidden, because the *output* (who solved the outbreak) is visible.
  *   Furthermore, Reform 2 leaves the **burden of coverage** unresolved. If everyone exercises their "right to decline," who protects the patients?

  **Why Reform 1 Succeeds:**
  Codification corrects the **category error**.
  1.  **Restores Moral Clarity:** It tells the senior analyst: "Your resentment is valid because this was wrongly framed. It is not a test of your character; it is a condition of your employment." This alleviates her moral distress.
  2.  **Ensures Equity:** A rotating schedule distributes the burden across those with and without caregiving responsibilities. Paid compensation acknowledges the intrusion into personal time.
  3.  **Secures Public Safety:** It ensures coverage is reliable, not dependent on the fluctuating altruism of staff.
  4.  **Decouples Virtue from Labor:** Authorship and budget access should be allocated based on intellectual contribution and scientific merit, not on who was available at 2:00 AM. By making the on-call a standard duty, you remove it as a variable for preferential treatment.

  ### Summary of the Ethical Structure

  | Feature | Current State | Reform 1 (Codify) | Reform 2 (Anonymize) |
  | :--- | :--- | :--- | :--- |
  | **Classification** | Coercive Supererogation | Perfect Obligation | Attempted Supererogation |
  | **Labor Status** | Unpaid / Invisible | Paid / Visible | Unpaid / Hidden |
  | **Equity Impact** | Penalizes Caregivers | Neutralizes Care Burdens | Masks Inequity |
  | **Moral Error** | Exploitation of Virtue | Corrected | Unresolved |

  **Conclusion:**
  The institution has committed the error of **moralizing labor**. It has taken a job requirement and disguised it as a virtue signal to avoid the cost of formalizing it. The senior analyst is not morally defective; she is correctly identifying a structural injustice.

  You should choose **Reform 1**. By codifying the shifts as paid, rotating obligations, you acknowledge that public health safety is a **duty**, not a **gift**. This restores the possibility of *genuine* supererogation elsewhere (e.g., optional mentorship, extra research initiatives) by clearing the essential labor of moral coercion. You cannot have a just system where the price of fair treatment is the donation of one's private time.
