  *   Framework of **Justice/Contract** supports Option 1 (Codify).
  *   Framework of **Virtue Ethics/Liberty** might support Option 2 (Protect Voluntariness), *but* only if the work isn't essential. Since it *is* essential, the Justice framework overrides.
  *   Actually, Option 2 is trying to restore *true* supererogation. But if the work is necessary, true supererogation is the wrong category.
