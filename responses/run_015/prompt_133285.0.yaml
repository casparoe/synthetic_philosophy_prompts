  9.  **Final Polish:** Organize with clear headings. Ensure the distinction between "Perfect" and "Imperfect" duties is clear in the context of institutional roles. (Perfect = owed to specific others/enforceable; Imperfect = general charity/discretionary). In this context, outbreak response is a Perfect Duty of the *organization*, which translates to a contractual duty for employees.

  10. (Final thought): Make sure to validate the senior analyst's feeling. Her resentment is not a moral failure; it's a rational response to structural incoherence.

