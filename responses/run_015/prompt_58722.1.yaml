  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION: THE ONTOLOGY OF ARTIFACTS

  **Signatories:** [User] & [Brother]
  **Date:** 24 May 2024

  ### 1. Areas of Agreement
  We hereby confirm mutual acceptance of the following premises:
  1.  **Functional Equivalence:** For purely utilitarian objects (e.g., a spare key or a hammer), a perfect replica serves the exact same purpose as the original.
  2.  **Market Reality:** We acknowledge that financial value in collectibles is largely dictated by provenance, regardless of physical composition.
  3.  **Ethical Deception:** We agree that passing off a replica as an original with the intent to deceive a third party is morally wrong.
  4.  **Physical Indistinguishability:** Within the confines of the 'atom-copy' thought experiment, we agree that no scientific instrument can distinguish the original from the copy.

  ### 2. Areas of Disagreement
  The following table outlines our divergent positions, phrased to ensure mutual comprehension and respect.

  | Point of Contention | Position A (History Matters) | Position B (Indistinguishable is Same) |
  | :--- | :--- | :--- |
  | **Object Identity** | Identity is constituted by the object's specific history and continuity of existence through time. | Identity is constituted entirely by the object's current physical state and structural properties. |
  | **Sentimental Value** | Value is intrinsic to the specific matter that interacted with the past; the history is embedded in the object. | Value is a psychological projection by the owner and is fully transferable to any identical substrate. |
  | **Destruction & Replacement** | Destroying the original constitutes an irreversible loss even if a perfect copy is retained. | Destroying the original constitutes no significant loss provided a perfect copy is retained. |

  ### 3. Cruxes and Test Cases
  We identify the following core philosophical divergences. For each, we apply the 'atom-copy machine' scenario involving Mum's old ceramic cat (replicated down to every chip, indistinguishable to scientists).

  **Crux 1: The Continuity of Existence**
  *   **Test Case:** The atom-copy machine creates the duplicate. Immediately afterwards, the original ceramic cat is accidentally smashed beyond repair. The copy remains intact.
  *   **Prediction (Position A):** The cat is gone. The copy is a memorial or a replacement, but it is not *the* cat Mum owned.
  *   **Prediction (Position B):** The cat survives. Since all properties are preserved in the copy, the object persists despite the material discontinuity.

  **Crux 2: The Location of Sentiment**
  *   **Test Case:** Mum is given the copy believing it is the original. She cherishes it for five years. She is then told the truth.
  *   **Prediction (Position A):** Her sentiment was misplaced. The revelation fundamentally diminishes the object's worth because the history she valued was not present in the object.
  *   **Prediction (Position B):** Her sentiment was real. The revelation changes the facts of origin but does not invalidate the affection she felt, proving the value lay in her mind, not the clay.

  **Crux 3: The Preference Test**
  *   **Test Case:** Both the original and the copy sit side-by-side on the mantelpiece. A fire starts, and you can only save one.
  *   **Prediction (Position A):** We must save the original. Destroying the copy is the preferable outcome, even if no one else knows the difference.
  *   **Prediction (Position B):** It does not matter which is saved. A coin toss is a sufficient decision-making tool as both objects hold equal status.
