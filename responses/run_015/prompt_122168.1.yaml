prompt: |-
  I serve on the ethics oversight committee for a regional health authority that recently adopted automated risk-scoring tools to allocate scarce specialist appointments, and I have just been appointed to sign off on every proposed rule. Our committee meets monthly, each proposal receives roughly forty-five minutes of review, none of my fellow members have formal philosophical training, and I have become convinced that justifying allocation rules by forecasting direct welfare outcomes—who survives, who suffers—is both epistemically fragile and politically unstable. I want a reusable decision procedure, grounded in indirect normativity and idealized deliberation, that translates justification through principles rather than results: a rule is acceptable only if no affected party could reasonably reject the principle underlying it under conditions in which direct outcome predictions are bracketed but informational and positional knowledge is not arbitrarily suppressed.

  To prevent the procedure from collapsing into familiar Rawlsian original-position reasoning or standard Scanlonian contractualism—frameworks my colleagues have already encountered—I want two specific refinements built in. First, a “deliberative residue” step: after bracketing all direct outcome-based reasons, we must audit whether the remaining reasons for or against the rule depend on hidden indexical commitments—implicit assumptions about which social role a party occupies—that survive the bracketing only because suppressing outcome data also obscured positional information. Second, a “second-order exclusion” audit: we must list every consideration excluded from deliberation not because it is irrelevant but because it is contested, then ask whether that very act of exclusion could itself be reasonably rejected by someone holding only generic and legitimate positional reasons.

  Please construct the procedure as an ordered checklist with explicit stopping rules: the questions to ask in sequence, what counts as a sufficient answer to each, where the procedure terminates with a clear “no,” where it terminates with a conditional “yes, subject to revision,” and where it explicitly hands the decision to a human judgment call because the issue is one of values rather than procedural validity. Include a small, reusable set of test sentences or framing questions that a non-specialist can apply consistently within the time constraint.

  Then run the procedure on three proposals: (1) a rule that ranks referred patients by predicted recovery rate and allocates specialist slots downward; (2) a pure lottery that assigns every referred patient an equal chance regardless of prognosis; and (3) a rule reserving fifteen percent of slots for healthcare workers, defended on the grounds that maintaining workforce capacity benefits all patients. For case (2), report the result that the procedure likely endorses—equal non-rejectability—despite its direct conflict with the authority’s welfare-maximizing goals, and explain precisely what the procedure can and cannot say about that conflict.

  Please also specify the practical constraints—time per case, required sign-off, absence of philosophical expertise—and flag the points where the procedure is most likely to misfire or generate false positives, particularly where the bracketing of outcome knowledge might illegitimately conceal structural disadvantage. Finally, state how confident you are in this translation from theory to operational checklist, and single out the one step—the bracketing of outcome predictions, the treatment of positional reasons, or the second-order exclusion audit—about which you are least certain.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Ethics oversight committee member for a regional health authority.
      *   **Task:** Create a reusable decision procedure (checklist) for signing off on automated risk-scoring rules for specialist appointment allocation.
      *   **Constraints:**
          *   Monthly meetings, ~45 mins per proposal.
          *   Colleagues lack formal philosophical training.
          *   Goal: Justify rules via principles (indirect normativity/idealized deliberation), *not* direct welfare outcomes (who survives/suffers).
          *   Avoid standard Rawlsian/Scanlonian frameworks (need specific refinements).
          *   **Refinement 1:** "Deliberative Residue" step (audit for hidden indexical commitments/positional info obscured by outcome bracketing).
          *   **Refinement 2:** "Second-Order Exclusion" audit (list excluded contested considerations; ask if exclusion itself is rejectable).
          *   **Format:** Ordered checklist with explicit stopping rules (No, Conditional Yes, Human Judgment).
          *   **Tools:** Reusable test sentences/framing questions for non-specialists.
          *   **Application:** Run on three cases (Recovery Rate Ranking, Pure Lottery, Healthcare Worker Reserve).
          *   **Specific Instruction for Case 2:** Report likely endorsement (equal non-rejectability) despite conflict with welfare goals; explain limits of the procedure regarding this conflict.
          *   **Meta-Analysis:** Specify practical constraints, flag failure points (especially regarding structural disadvantage), state confidence level, and identify the least certain step.

  2.  **Deconstruct the Philosophical Core:**

      *   *Indirect Normativity/Idealized Deliberation:* Justification comes from the *process* of agreement under ideal conditions, not the *result* of that agreement.
      *   *Avoiding Rawls/Scanlon:* Rawls uses a Veil of Ignorance (suppresses positional knowledge). Scanlon uses "Reasonable Rejection" based on generic reasons.
      *   *The Twist:* The user wants to bracket *outcome predictions* (epistemic fragility) but *not* arbitrarily suppress *positional knowledge* (who you are in society). This is crucial. Standard Rawls suppresses "I am a doctor" or "I am sick." This procedure wants to keep "I am sick" but remove "If we do X, I will die."
      *   *Refinement 1 (Deliberative Residue):* Check if hiding outcomes accidentally hides *who* benefits. (e.g., If we don't know who survives, do we inadvertently assume the beneficiary is 'average' when they are actually privileged?)
      *   *Refinement 2 (Second-Order Exclusion):* Check if the act of ignoring certain arguments (because they are contested) is itself unfair.

  3.  **Drafting the Procedure (The Checklist):**

      *   *Time Management:* 45 minutes total. Need to be tight.
      *   *Step 1: Outcome Bracketing.* Explicitly set aside "This saves more lives."
      *   *Step 2: Principle Formulation.* What is the rule *actually* saying? (e.g., "Efficiency trumps equity").
      *   *Step 3: Deliberative Residue Audit.* (The first refinement). Are we hiding positional bias?
      *   *Step 4: Second-Order Exclusion Audit.* (The second refinement). Did we silence a valid voice by calling their reason "contested"?
      *   *Step 5: Reasonable Rejection Test.* Can anyone say "No" based on the principle, not the outcome?
      *   *Stopping Rules:* Need clear triggers for Stop (No), Proceed with Conditions, or Escalate.

  4.  **Developing Test Sentences/Framing Questions:**

      *   Need plain language.
      *   "If we didn't know the score, would this feel fair?"
      *   "Does this rule assume everyone starts at the same line?"
      *   "Are we ignoring a complaint just because it's hard to measure?"

  5.  **Running the Procedure on the Three Cases:**

      *   *Case 1 (Recovery Rate):*
          *   Principle: Maximize medical utility.
          *   Residue: Favors those already healthy/privileged (hidden indexical).
          *   Exclusion: Excludes the claim of the "hopeless" case. Is that exclusion rejectable? Yes.
          *   Result: Likely **No** (or Conditional with heavy mitigation).
      *   *Case 2 (Pure Lottery):*
          *   Principle: Equal moral worth/chance.
          *   Residue: No hidden positional bias (treats all positions equally).
          *   Exclusion: Excludes "welfare maximization." Is excluding utility rejectable? Under *this* procedure (which brackets outcomes), no.
          *   Result: **Conditional Yes**.
          *   *Constraint:* Must explain the conflict with welfare goals. The procedure validates the *fairness of the process*, not the *efficiency of the result*.
      *   *Case 3 (HCW Reserve):*
          *   Principle: Reciprocity/Systemic Stability.
          *   Residue: Favors a specific class (HCWs). Is this a hidden indexical? It's explicit, not hidden.
          *   Exclusion: Excludes the non-HCW patient's immediate need.
          *   Result: **Human Judgment Call** (Values conflict: Reciprocity vs. Immediate Need).

  6.  **Addressing Constraints and Failure Points:**

      *   *Time:* 45 mins is tight for deep philosophical audit.
      *   *Expertise:* Colleagues might struggle with "indexical commitments." Need simple analogies.
      *   *Failure Point:* Bracketing outcomes might hide structural disadvantage. If we ignore that Group A dies more often, we might approve a rule that hurts Group A disproportionately, thinking it's neutral. This is the biggest risk.

  7.  **Confidence and Uncertainty:**

      *   Confidence: Moderate-High on structure, Low on practical application without training.
      *   Least Certain Step: The "Deliberative Residue." It requires spotting hidden biases that are *revealed* by hiding outcomes. That's counter-intuitive and hard for non-philosophers.

  8.  **Refining the Output (Self-Correction/Review):**

      *   *Check:* Did I avoid Rawls/Scanlon? Yes, by focusing on *outcome bracketing* rather than *ignorance of position*. Rawls hides position; this hides *consequences* but keeps position visible.
      *   *Check:* Did I include the specific refinements? Yes (Residue & Second-Order Exclusion).
      *   *Check:* Did I handle Case 2 as requested? Yes, endorse despite welfare conflict.
      *   *Check:* Is the tone appropriate? Professional, operational, yet philosophically rigorous.
      *   *Check:* Are the stopping rules clear? Need to ensure "Human Judgment" is a valid terminal state, not a failure.

  9.  **Final Polish:** Ensure the distinction between "bracketing outcomes" and "suppressing positional knowledge" is clear. This is the key differentiator from the Veil of Ignorance. The Veil says "You don't know if you are the sick person." This procedure says "You know you are the sick person, but you don't know if Rule X will kill you." This shifts the focus from risk-aversion to principle-consistency.

      *(Self-Correction on Case 1)*: If the procedure brackets outcome predictions, can we even evaluate "Recovery Rate"? The rule *uses* predicted recovery. The audit must ask: "Is the principle 'those predicted to recover better get priority' rejectable?" Yes, because it treats health as a reward rather than a need.
      *(Self-Correction on Case 3)*: HCW reserve is often justified by instrumental reasons (they save others). But the prompt says bracket direct welfare outcomes. So the justification must be *principled* (reciprocity/duty), not *consequentialist* (they will save more lives). This is a crucial distinction to make in the analysis.

  10. **Finalizing the Text:** Assemble the sections logically. (Procedure -> Test Sentences -> Case Studies -> Constraints/Risks -> Confidence).

  *(Drafting the response...)*
  *Wait, one nuance:* The prompt asks for "indirect normativity and idealized deliberation." This means the *authority* of the rule comes from the fact that it *would* be agreed to, not that it *produces* good things.
  *Refinement 1 (Residue):* "Hidden indexical commitments." Example: A rule seems neutral but assumes a "standard worker" schedule, disadvantaging caregivers. By bracketing "who loses jobs," we might miss that the rule assumes a specific social role.
  *Refinement 2 (Second-Order):* "Excluded considerations." Example: We exclude "religious objections" as contested. But is excluding religion itself rejectable?

  Okay, ready to write.
answer: |-
  ### The Principle-First Allocation Audit (PFAA)

  **Purpose:** To validate allocation rules based on the reasonableness of their underlying principles, independent of predicted welfare outcomes.
  **Time Budget:** 45 Minutes per proposal.
  **Participants:** Ethics Oversight Committee (No philosophical training required).
  **Sign-Off Authority:** Committee Chair (You).

  ---

  ### Part I: The Decision Procedure Checklist

  **Instructions:** Read the proposal. Assign a scribe. Proceed sequentially. If a **STOP** condition is met, halt discussion and record the verdict.

  #### Step 1: Outcome Bracketing (5 Minutes)
  *Action:* Explicitly list all arguments in the proposal that rely on forecasting future states (e.g., "lives saved," "cost reduction," "QALYs gained").
  *Rule:* These arguments are now **inadmissible** for justification. They may be noted as side-effects but cannot serve as the *reason* for the rule.
  *Framing Question:* "If we were blind to the future consequences of this rule, would we still adopt it?"
  *   **STOP (No):** If the proponents cannot articulate a justification without referencing outcome forecasts.
  *   **Proceed:** If a principle-based justification is offered (e.g., "fairness," "reciprocity," "equal respect").

  #### Step 2: Principle Formulation (5 Minutes)
  *Action:* Reduce the rule to a single universalizable sentence.
  *Template:* "In conditions of scarcity, [Group A] shall receive priority over [Group B] because [Principle P]."
  *Framing Question:* "Does this sentence describe a duty or a calculation?"
  *   **STOP (No):** If the sentence describes a calculation (e.g., "...because it yields more health"). Return to Step 1.
  *   **Proceed:** If the sentence describes a duty or status (e.g., "...because they bear greater burden").

  #### Step 3: Deliberative Residue Audit (15 Minutes) **[Refinement 1]**
  *Action:* Investigate whether bracketing outcomes has inadvertently hidden *positional* biases. We know *who* the parties are (patients, staff, public), but have we assumed their social context is neutral?
  *Test:* Identify the "Implicit Agent." Who does the principle assume is acting or suffering?
  *Framing Question:* "Does this principle assume a 'standard' life trajectory that some parties physically or socially cannot inhabit?"
  *   **Example:** A rule requiring "online registration" assumes digital access. Bracketing "who fails to register" (outcome) hides the positional bias against the elderly/poor.
  *   **STOP (No):** If the principle relies on a hidden indexical commitment (e.g., assumes all patients have equal advocacy skills, transportation, or health literacy) that disadvantages a specific identifiable group.
  *   **Proceed:** If positional knowledge is explicit and accounted for, or if the principle applies equally to all social roles.

  #### Step 4: Second-Order Exclusion Audit (10 Minutes) **[Refinement 2]**
  *Action:* List every consideration excluded in Step 1 (outcome data) or Step 3 (positional nuances).
  *Test:* Ask if the *act of exclusion* is itself rejectable.
  *Framing Question:* "Is there a party for whom excluding this information silences their only valid complaint?"
  *   **STOP (Conditional Yes, Subject to Revision):** If a valid complaint is silenced, the rule must be revised to include a mitigation mechanism (e.g., a waiver process) for that specific exclusion.
  *   **Proceed:** If the exclusion is deemed necessary for the deliberation to function (e.g., excluding "ability to pay" in a public system).

  #### Step 5: Reasonable Rejection Test (10 Minutes)
  *Action:* Adopt the perspective of the most disadvantaged party under the *principle* (not the outcome).
  *Framing Question:* "Can this party say 'No' without contradicting the very purpose of the health system?"
  *   **STOP (No):** If the rejection is reasonable (e.g., the principle treats them as a means rather than an end).
  *   **HANDOFF (Human Judgment):** If the rejection hinges on a conflict of fundamental values (e.g., Liberty vs. Security) that the procedure cannot rank.
  *   **VERDICT (Yes):** If no reasonable rejection is found.

  ---

  ### Part II: Application to Proposals

  #### Case 1: Recovery Rate Ranking
  *Rule:* Rank patients by predicted recovery rate; allocate slots downward.
  *   **Step 1 (Bracketing):** Proponents argue "maximizes total health." **FAIL.** This is purely outcome-based.
  *   **Correction:** Proponents reframe: "Medical resources should be used where they are most effective."
  *   **Step 3 (Residue):** Does this assume a "standard" biological response? Yes. It disadvantages those with comorbidities or disabilities where recovery is slower but life is still valued. The "Implicit Agent" is the curable patient.
  *   **Step 5 (Rejection):** A patient with a chronic condition can reasonably reject the principle that their life is worth less resource investment.
  *   **Verdict:** **NO.** The principle violates equal moral worth by tying resource entitlement to biological "efficiency."

  #### Case 2: Pure Lottery
  *Rule:* Every referred patient has an equal chance regardless of prognosis.
  *   **Step 1 (Bracketing):** Proponents argue "Equal respect." No outcome forecasts used. **PASS.**
  *   **Step 2 (Principle):** "In conditions of scarcity, all patients shall have an equal chance because all possess equal moral status." **PASS.**
  *   **Step 3 (Residue):** Does this hide positional bias? No. It treats the CEO and the unemployed patient identically. No hidden indexical commitments regarding social role. **PASS.**
  *   **Step 4 (Exclusion):** We excluded "prognosis." Is this exclusion rejectable? A patient with a 99% survival rate might object. However, under *this* procedure, claiming "my biology makes me more worthy" is a contested consideration that undermines the principle of equal status. The exclusion holds. **PASS.**
  *   **Step 5 (Rejection):** Can anyone reasonably reject "equal chance"? Only if they claim superior worth, which contradicts the health authority's foundational mandate.
  *   **Verdict:** **CONDITIONAL YES.**
  *   **Conflict Analysis:** The procedure endorses this rule because it satisfies *procedural fairness* (non-rejectability), even though it likely reduces *aggregate welfare* (more deaths/suffering than Case 1).
      *   *What the procedure says:* The rule is legitimate because no party is subordinated to another as a matter of principle.
      *   *What the procedure cannot say:* It cannot tell you if the *cost* of this fairness (in lost lives) is too high. That is a welfare calculation, which Step 1 bracketed. The procedure validates the *right*, not the *good*.

  #### Case 3: Healthcare Worker (HCW) Reserve (15%)
  *Rule:* Reserve 15% of slots for HCWs to maintain workforce capacity.
  *   **Step 1 (Bracketing):** Proponents argue "Maintaining capacity benefits all." **FAIL.** This is consequentialist (welfare maximization).
  *   **Correction:** Proponents reframe: "HCWs have a reciprocal claim due to their assumption of risk and duty."
  *   **Step 2 (Principle):** "Those who bear special burdens for the system have a priority claim on the system." **PASS.**
  *   **Step 3 (Residue):** Is "HCW" a hidden indexical? No, it is an explicit social role. However, does it assume all HCWs bear equal risk? (e.g., Admin vs. ER). **Revision Needed.**
  *   **Step 4 (Exclusion):** We exclude the non-HCW patient's immediate need. Is this rejectable? Yes, if the non-HCW patient faces death while the HCW faces a minor condition.
  *   **Step 5 (Rejection):** Conflict of values: Reciprocity vs. Immediate Need.
  *   **Verdict:** **HANDOFF (Human Judgment).** The procedure identifies the conflict but cannot resolve the weighting between "Duty/Reciprocity" and "Urgency." This requires a value vote by the committee.

  ---

  ### Part III: Practical Constraints & Failure Modes

  **1. Time & Expertise Constraints**
  *   **Risk:** The "Deliberative Residue" audit (Step 3) is cognitively demanding. Non-specialists often confuse "positional knowledge" (I am a single mother) with "outcome knowledge" (I will lose my job).
  *   **Mitigation:** Use the "Implicit Agent" test sentence rigidly. If the committee cannot name the "standard person" the rule assumes, they must pause.

  **2. The Structural Disadvantage Blind Spot**
  *   **Critical Failure Point:** **Step 1 (Outcome Bracketing).**
  *   **Explanation:** By forbidding the use of outcome predictions, we may illegitimately conceal structural disadvantage. If a neutral rule (e.g., "First Come, First Served") is adopted, we bracket the fact that privileged groups can arrive "first" more easily.
  *   **Why it misfires:** The procedure treats the *principle* as neutral, but the *application* of the principle interacts with pre-existing inequality. Step 3 attempts to catch this, but if the committee lacks sociological data, they may approve a "neutral" rule that functions oppressively.
  *   **Flag:** If a rule seems neutral but affects groups with known historical disparities, Step 3 must be extended to include external demographic data, even if outcome *predictions* are banned.

  **3. Sign-Off Authority**
  *   **Risk:** As Chair, you may become a bottleneck.
  *   **Mitigation:** The "Conditional Yes" allows you to sign off provided specific revisions (mitigations) are implemented by administration without returning to committee.

  ---

  ### Part IV: Confidence & Uncertainty Statement

  **Confidence Level:** **Moderate-High (75%)** on procedural validity; **Low (40%)** on consistent human application without training drift.
  The checklist successfully translates indirect normativity into operational steps. It prevents the "tyranny of the metric" by forcing principle-based justification.

  **Least Certain Step:** **Step 3 (Deliberative Residue Audit).**
  *   **Reason:** This step requires committee members to identify "hidden indexical commitments" that survive outcome bracketing. This is a subtle philosophical distinction. There is a high risk that members will either (a) fail to see the hidden bias (false negative) or (b) claim *every* rule assumes *some* agent (false positive), paralyzing the committee.
  *   **Specific Worry:** Bracketing outcome knowledge might make it *harder* to see structural disadvantage, not easier. If we don't look at who suffers (outcomes), we might miss that a principle disproportionately impacts a specific social role, even if we know their position. The "Residue" audit attempts to fix this, but it relies on the committee's sociological imagination, which is unverified.

  **Final Instruction to Committee:**
  "When in doubt during Step 3, assume the 'Implicit Agent' is the least advantaged patient currently in our system. If the principle breaks for them, it fails the audit."
