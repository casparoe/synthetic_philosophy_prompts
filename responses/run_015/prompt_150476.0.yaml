      *   *J's Counter:* The necessity comes from the consequences of violating the contract, not the metaphysics of lines.
      *   *M's Counter:* But if the foundation is shaky...
      *   *Closing:* Meta-commentary on confidence and the specific weak point (bad math vs. politics).

