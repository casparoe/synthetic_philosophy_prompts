answer: |-
  **J:** look, i'm just saying, you're reading too much into the biography. if you look at the structure of *Leviathan*, especially the latin version, it's explicit. Hobbes starts with matter, then man, then the commonwealth. it's synthetic method 101. he genuinely thought civil philosophy could hit geometry-level certainty.

  **M:** but that's the thing though. he *wanted* it to. wanting isn't believing. and even if he believed it, was he right to? geometry was the one science god gave us, sure, hobbes says that. but he also spent like 30 years trying to square the circle. against Wallis. the proofs were garbage.

  **J:** okay but that's ad hominem-ish. just because he failed at *doing* advanced math doesn't mean he didn't think the *method* applied to politics. the point is demonstrability. in geometry, you define your terms—line, point, motion—and you deduce. hobbes thinks we can do that with passions and contracts. because we create the commonwealth, we know it like we know a geometric figure. we make it, so we understand the principles.

  **M:** right, but that's exactly where the analogy breaks. hobbes's ontology of geometry is constructivist. figures aren't found in nature, they're generated by motion. a line is a trace of a moving point. so the certainty comes from the fact that *we* stipulated the motion. but when you jump to politics... you're dealing with actual human motion, actual fear. you can't just stipulate that away.

  **J:** but that's why he starts with definitions of human motion! he's trying to reduce psychology to mechanics. if desire is just endeavor inward, and aversion is endeavor outward, then the state of nature is a necessary consequence. it's not stipulation, it's deduction from first principles. he's copying the rigor because he thinks the causal chains are just as tight.

  **M:** i get that, but if geometric objects are just human constructions, then the necessity is internal to the system. it's true by definition. but sovereign authority isn't a definition. it's a power relation. if i say "a sovereign is X" and deduce "therefore you must obey," i haven't proven you *must* obey in reality, only that you must obey within my little linguistic game. hobbes knows figures are built from motion not found in nature—so he knows geometry is kinda nominal. how do you get real blood-and-guts authority from that?

  **J:** because the alternative is death. the necessity isn't logical necessity, it's causal necessity. like, if you draw a triangle wrong, it's not a triangle. if you build a commonwealth without a sovereign, it's not a commonwealth, it's war. the geometry model works because both are about consequences of construction.

  **M:** except hobbes failed at the construction part in math. repeatedly. Wallis destroyed him. and if his grasp of the "perfect science" was that shaky, maybe he knew deep down politics could never reach that bar. maybe the geometric rhetoric is just... marketing. to make the king look inevitable.

  **J:** marketing? come on. he revised *De Cive* three times. he was obsessed with the demonstration. he wouldn't waste that much ink on a metaphor. he thought he cracked the code. the fact that he was wrong about circle squaring doesn't mean he was wrong about the *ambition* of political science. he thought if you control the definitions (like the sovereign controls language), you get certainty.

  **M:** but controlling language isn't controlling nature. and that's the gap. if geometry is certain because we construct the objects, politics is only certain if we fully construct human nature. which we don't. we only construct the institution. the material (people) is stubborn. so you can't derive sovereign authority with triangle-level necessity because the "points" keep moving.

  **J:** fair. but he still *believed* he could. that's the question. did he genuinely believe it?

  **M:** yeah, probably. but i think he knew the foundation was wobbler than he admitted.

  **J:** anyway, gotta run. seminar in 10.

  **M:** later.

