      *   *Village vs. Person:* Moral weight matters. If it were a single duck, maybe less stickiness. A village implies significant harm, triggering the moral judgment module.

  6.  **Drafting the Response:**
      *   **Tone:** Respectful, precise, "novelist to novelist" (practical), but philosophically rigorous.
      *   **Structure:**
          1.  Validate the observation (It's real, it's documented).
