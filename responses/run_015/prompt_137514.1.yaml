  2.  **Deconstruct the Phenomenon:**
      *   **Core Observation:** Asymmetry in attributing intentionality based on moral outcome. Bad side effects = Intentional. Good side effects = Unintentional/Accidental.
      *   **The "Knobe Effect" Connection:** The user mentioned this. It *is* the Knobe Effect (Side-Effect Effect). The user's hesitation is that Knobe is usually about survey data ("Did he intentionally X?"), whereas this is about narrative interpretation ("What is this chapter *about*?"). I need to bridge that gap. The cognitive mechanism is the same, even if the context (philosophy survey vs. literary reception) differs.
      *   **The "Sticky/Resistant" Aspect:** In Scene A, denials make it worse. In Scene B, denials work. This is the trickier part. It's not just attribution of intent; it's the *resistance to correction*. This feels like *Confirmation Bias* or *Belief Perseverance*, but specifically tied to moral judgment. It's also related to *Narrative Expectation* (conflict drives story).

  3.  **Identify Concept 1: The Asymmetry of Intent (The Knobe Effect):**
      *   *Name:* The Knobe Effect (or The Side-Effect Effect).
      *   *Relevance:* High. It explains why readers attribute intent to harm but not benefit.
      *   *Nuance:* The user thinks it's just surveys. I need to explain that it's a cognitive bias that permeates narrative comprehension, not just explicit questioning.
      *   *Load-bearing details:* Moral valence (harm vs. help) is the key. Indifference doesn't stop it. Alternatives don't stop it (foreseeability is enough).

  4.  **Identify Concept 2: The Resistance/Stickiness (The "Confession" Dynamic):**
      *   *Name:* There isn't a single perfect philosophical term for the *narrative* resistance.
      *   *Candidates:*
          *   *Moral Luck:* (No, that's about outcome determining blame regardless of intent).
          *   *Fundamental Attribution Error:* (No, that's about personality vs. situation).
          *   *Narrative Teleology:* (Readers expect events to serve a purpose).
          *   *The "Tell" Paradox:* (Protesting too much).
      *   *Synthesis:* It's a combination of the Knobe Effect + *Narrative Causality/Teleology*. In fiction, things happen *for a reason*. If a bad thing happens, it usually serves a thematic or character purpose. If the author says "it didn't," the reader trusts the *pattern* (bad things imply bad actors) over the *statement*.
      *   *Coining a Term:* The user asked me to coin one if needed. Let's look for something that captures the "denial becomes proof" aspect in a moral context. "The Macbeth Defense"? "The Insincerity Spiral"? Let's go with **"The Moral Gravity Well"** or **"The Intentionality Ratchet."** Actually, **"The Intentionality Ratchet"** fits well. Once intent is locked in (by harm), it doesn't ratchet back.
      *   *Better Coinage:* **"The Exculpatory Paradox."** Or **"The Stain of Foreseeability."**
      *   *Wait, let's look closer:* The user says denials read as "further evidence." This is classic *psychological reactance* or *overcompensation*. But in a literary context, it's about *Subtext*. In fiction, text = lie, subtext = truth. If the text says "I didn't mean to" but the action is harmful, the subtext screams "I meant to."
      *   *Decision:* I will identify the first part as the **Knobe Effect** (validating their intuition but correcting the scope). I will identify the second part (the stickiness) as a collision between the Knobe Effect and **Narrative Teleology** (the reader's expectation that plot points are thematic). I will coin a term for the specific *resistance to exculpatory text*: **"The Exculpatory Backfire."**

  5.  **Address Load-Bearing Details:**
      *   *No Alternative:* Doesn't matter for Knobe. Foreseeability is enough.
