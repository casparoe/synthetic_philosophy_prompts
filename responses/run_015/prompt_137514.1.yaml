      *   **Scene A (Harm):** Character diverts river, saves town, silts marsh (harm). Character is indifferent. Readers think she *intended* the harm. Denials read as insincere/proof of guilt.
      *   **Scene B (Benefit):** Character diverts river, saves town, refills marsh (benefit). Character is indifferent. Readers accept indifference. One line clarifies it was accidental/unintended.
      *   **Specific Questions:**
          1.  Is this one named thing or two?
          2.  What are the nearest established concepts?
          3.  How do they differ from the user's description?
