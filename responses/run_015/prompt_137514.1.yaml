answer: |-
  This is a sharp observation, and you are right to feel that "The Knobe Effect" is close but doesn't fully capture the *narrative* stickiness you're fighting. You are dealing with two distinct mechanisms that are locking together like gears. One is cognitive (how we judge intent); the other is narratological (how we read stories).

  Here is the carving you asked for.

  ### 1. The Asymmetry of Intent (The Knobe Effect)
  **Status:** Established Concept.
  **Load-bearing:** High.

  You were told this was just about surveys, but that is a misunderstanding of how the Knobe Effect (or *Side-Effect Effect*) functions. It is not merely a quirk of answering questionnaires; it is a fundamental feature of how human beings construct the concept of "intentionality."

  We do not have a fixed, pre-existing definition of "intentional." We construct it in real-time based on moral valence.
  *   **Harmful Side Effect:** If the side effect is bad, our brain retroactively upgrades "foreseeability" to "intentionality." We literally perceive the action differently.
  *   **Beneficial Side Effect:** If the side effect is good, our brain keeps "foreseeability" and "intentionality" separate.

  **How it differs from your scene:**
  The philosophical experiments usually stop at "Did she do it intentionally? Yes/No." Your problem is deeper: your readers aren't just checking a box; they are building a theory of the character's soul. However, the engine driving that theory is the Knobe Effect. The detail that she is *indifferent* is the trigger. If she hated the marsh, it's direct intent. If she loves the marsh, it's tragedy. Because she is *indifferent*, the Knobe Effect kicks in: the harm is severe enough that indifference is treated as malice.

  **Load-bearing details:**
  *   **Indifference:** Crucial. This is the specific condition for the Knobe Effect.
  *   **Harm vs. Benefit:** Crucial. This is the switch.
  *   **No Alternative:** Incidental. The Knobe Effect works even if alternatives exist, provided the agent proceeds with foresight.
  *   **Village vs. Person:** Load-bearing threshold. The harm must cross a moral threshold to trigger the effect. Destroying a duck nest might not trigger it; destroying a village's livelihood does.

  ### 2. The Resistance to Correction (The Narratological Gear)
  **Status:** Partially Established / Requires Coinage.
  **Load-bearing:** High.

  This is the part where the disclaimer reads as a confession. The Knobe Effect explains why they *initially* think she did it on purpose. It does not fully explain why they *refuse to update* that belief when you add text explicitly contradicting it. In Scene B, they update easily. In Scene A, they dig in.

  This is where cognitive bias meets **Narrative Teleology**. In fiction, readers operate under the assumption that *everything happens for a reason*. If a significant negative consequence occurs in a plot, it is thematically relevant. It reveals character.

  When you add a line where Ilse says, "I'm sorry, I didn't want this," you are asking the reader to accept that a major plot consequence is *thematically empty*. You are asking them to believe the harm is just noise. Readers resist this because it violates the contract of fiction. Furthermore, because the Knobe Effect has already tagged the action as "Intentional Harm," any subsequent denial is processed through the lens of **Deception**.

  **The Coinage: The Exculpatory Backfire**
  Since you asked for a tight definition for the sticky part that doesn't collapse into "people are mean," here is the term:

  **Term:** **The Exculpatory Backfire**
  **Definition:** A narratological phenomenon wherein an agent's explicit verbal disavowal of malicious intent regarding a harmful outcome increases the audience's conviction of that intent. This occurs because the moral weight of the outcome overrides the semantic content of the denial, causing the denial to be re-categorized as a performative act of concealment (i.e., "protesting too much").

  **Conditions for The Exculpatory Backfire:**
  1.  **High Moral Stakes:** The outcome must be significantly harmful (the village).
  2.  **Foreseeability:** The agent must have known the risk (Ilse is a hydrologist).
  3.  **Narrative Weight:** The event must be a plot point, not background noise.

  **A Nearby Case That Is NOT An Instance:**
  *   **The Clumsy Accident:** A character runs to save a child, trips, and breaks a vase. They say, "I didn't mean to." The audience believes them.
      *   *Why it's not:* The outcome (broken vase) lacks the moral weight of the harm (destroying a livelihood). The Knobe Effect is not triggered, so the Exculpatory Backfire has no fuel.
  *   **Scene B (Your Marsh):** Ilse refills the marsh. She says, "I didn't plan that." The audience believes her.
      *   *Why it's not:* Beneficial side effects do not trigger the moral judgment module required for the Backfire. We are happy to let characters be accidentally good; we are reluctant to let them be accidentally evil.

  ### Why Scene A is "Sticky" and Scene B is Not
  In Scene B (Benefit), the reader's heuristic is: *Competence + Good Outcome = Heroism.* If she says "I didn't mean the good part," it fits the "Humble Hero" archetype. It adds depth.

  In Scene A (Harm), the reader's heuristic is: *Competence + Bad Outcome = Villainy.* If she says "I didn't mean the bad part," it conflicts with the archetype. To resolve the conflict, the reader assumes the text is lying (either the character is lying, or the author is protecting a protagonist they shouldn't protect). The denial becomes evidence of guilt because only a guilty party needs to offer an unsolicited alibi.

  ### Load-Bearing Analysis for Your Draft
  You asked which details matter for your decision.

  1.  **Indifference:** This is your trap. As long as she is indifferent, the Knobe Effect will classify the harm as intentional. To break this, she cannot be indifferent. She must actively *grieve* the marsh in a way that costs her something, or she must be *ignorant* of the specific consequence (though ignorance undermines her competence as a hydrologist).
  2.  **No Alternative:** This is your shield, but it's weak against the Knobe Effect. "I had no choice" is the standard defense of the villain. It does not absolve intent; it only justifies necessity. Readers are currently reading "Necessity" as "Excuse."
  3.  **The Village:** This is the trigger. If it were a patch of weeds, the Backfire wouldn't happen. Because it is people's livelihoods, the moral weight is high enough to lock the interpretation.

  ### Actionable Advice
  You cannot "write" your way out of the Exculpatory Backfire with dialogue. Dialogue is "text." Readers are currently reading "subtext." The subtext says: *She sacrificed the few for the many and doesn't care.* The text says: *She cares.* The subtext always wins.

  To fix Scene A, you have three options:

  1.  **Accept the Villain:** Lean into the Knobe Effect. Let the readers believe she did it on purpose. Make the chapter about her utilitarian calculus. The conflict becomes: "Is saving the town worth becoming the kind of person who kills the marsh?"
  2.  **Break the Foreseeability:** She must not know for sure. If she *hopes* the marsh will survive but knows it might not, she is gambling, not executing. This moves it from "Intentional Harm" to "Reckless Endangerment," which readers are more willing to forgive if she shows remorse.
  3.  **Cost the Indifference:** You must remove the indifference. If she diverts the river and *weeps* while doing it, or if she tries a third, riskier option first and fails, you break the Knobe trigger. The harm remains, but the *intent* is reclassified as Tragic Necessity rather than Cold Calculation.

  **Summary:**
  You are fighting **The Knobe Effect** (which makes them see intent where there is none) combined with **The Exculpatory Backfire** (which makes them treat her denial as proof of guilt). The first is cognitive; the second is narratological. You cannot talk your way out of it. You must change the action or the emotional cost.
