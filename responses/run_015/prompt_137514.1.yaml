          4.  Load-Bearing Analysis.
          5.  The Coinage (for the sticky part).
          6.  Actionable Advice (How to fix Scene A).

  7.  **Refining the "Coinage":**
      *   I need a term that distinguishes this from general "people are mean."
      *   Term: **"The Exculpatory Backfire."**
      *   Definition: When a character's explicit denial of malicious intent regarding a harmful outcome is interpreted by the audience as confirmation of that intent, due to the cognitive weight of the harm outweighing the verbal assertion.
      *   Non-Example: A character denies stealing a cookie, and security footage shows they didn't. (Here, evidence overrides the bias). Or Scene B (Benefit), where the denial works.

  8.  **Refining the Knobe Explanation:**
      *   Make sure to clarify that Knobe isn't *just* surveys. It's about how we construct the concept of "intentionality." We don't have a fixed definition; we construct it based on moral blameworthiness.
      *   In narrative, "Intentional" ≈ "Thematically Relevant."

  9.  **Addressing the "Why":**
      *   Why does Scene A stick? Because in fiction, *consequence reveals character*. If the consequence is bad, the character is "bad" (or flawed in that direction). To say otherwise feels like the author lying.
      *   Why does Scene B not stick? Because "accidental goodness" is a standard trope (humility). "Accidental evil" is often read as negligence, which is a form of intent.

  10. **Final Review against Constraints:**
      *   Did I answer "One thing or two?" (Yes, two interacting mechanisms).
      *   Did I give established concepts? (Knobe, Narrative Teleology).
      *   Did I analyze load-bearing details? (Yes).
      *   Did I coin a term with a non-example? (Yes, Exculpatory Backfire).
      *   Is it useful for a novelist? (Yes, includes drafting advice).

  11. **Self-Correction during drafting:**
      *   *Caution:* Don't get too bogged down in philosophy jargon. Keep it grounded in reader reception.
      *   *Emphasis:* Highlight that readers treat fiction differently than reality. In reality, we might give benefit of the doubt. In fiction, we hunt for meaning.
      *   *The "Tell":* Address why the apology reads as insincere. It's because it breaks the *competence* of the villain. A "true" villain owns it or hides it; a clumsy apology looks like a cover-up.

  12. **Final Polish:** Ensure the distinction between *Intentionality Attribution* (Knobe) and *Narrative Interpretation* (Teleology/Backfire) is clear. The first makes them think she did it on purpose. The second makes them refuse to believe she didn't.

  *(Self-Correction on the Coinage)*: "Exculpatory Backfire" is good. Let's make sure the definition is tight. It needs to be specific to *moral* harm in a *narrative* context.
  *Definition:* The phenomenon where an agent's explicit disavowal of intent regarding a harmful outcome increases the audience's conviction of malicious intent, because the disavowal is processed as a performative act of concealment rather than a descriptive statement of fact.
  *Non-Example:* A character accidentally drops a vase, says "Oops," and the audience believes them. (No moral weight). Or Scene B (Positive outcome).

