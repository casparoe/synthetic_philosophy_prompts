answer: |-
  You are right to be frustrated. The literature often treats this as a definitional squabble when it is actually a clash of political ontologies. Your hypothesis—that one side asks about moral wrongs and the other about rule violations—is close, but it misses the deeper structural conflict. If it were just "moral vs. rule," we could solve it by agreeing on which rules count. We can't.

  Here is the diagnosis: This is not a verbal disagreement, nor is it primarily a factual one about the physical nature of the exchange. It is a disagreement about **the source of political legitimacy.**

  ### 1. The Core Disagreement: Impersonal vs. Patrimonial Logic
  The Universalists and the Relativists are not looking at the same object. They are looking at two different models of what a state *is*.

  *   **The Universalist (Public-Office-Centered) View:** This camp assumes a Weberian ideal. The state is an impersonal entity separate from society. Public office is a trust. Any diversion of public resources for private gain (including social obligations) is a betrayal of that trust. When they say "corruption," they mean **"deviation from the impersonal rule of law."**
  *   **The Relativist (Society-Centered) View:** This camp observes that in many contexts, the state is not impersonal. It is patrimonial. Power is personal, and authority is maintained through networks of reciprocity and gift-exchange. When they say "not corruption," they mean **"alignment with the local social contract."**

  The impasse exists because the Universalist defines corruption as a violation of the *formal* institution, while the Relativist defines it as a violation of the *informal* institution. Since the word "corruption" carries a heavy moral condemnation, both sides are fighting over who gets to assign the stigma. The Universalist wants to stigmatize the act to change the system. The Relativist wants to de-stigmatize the act to protect the population from external judgment.

  ### 2. Is There a Hidden Factual Dispute?
  You asked if there is a factual question underneath (bribe vs. gift). The answer is **yes, but not about the act itself.** It is about the **systemic function.**

  *   **The Universalist Factual Claim:** Payments like this distort allocation. They mean the rich get services and the poor do not. They undermine trust in the state. Therefore, the *fact* is that the system becomes less efficient and less equitable.
  *   **The Relativist Factual Claim:** In low-capacity states, formal rules are often impossible to follow. The "bribe" is a rationing mechanism or a shadow salary that keeps the clerk working. Without it, the system stops. Therefore, the *fact* is that the payment sustains function where formal rules would cause paralysis.

  The disagreement stalls because both factual claims can be true simultaneously in different contexts, yet the literature often treats them as universal truths. The Universalist ignores that the "rule of law" might be a fiction that starves the poor. The Relativist ignores that "customary gift-giving" can calcify into predatory extraction.

  ### 3. Your Observation on Institutional Context
  You noted that the classification tracks the institutional context (salary, rules, alternatives) rather than the act. **This is the most critical insight you have had, and it solves the puzzle.**

  The act of handing an envelope is neutral. It becomes "corruption" only when judged against a specific **expectation of the office.**

  *   If the clerk is paid a living wage and the rule is enforceable, the envelope is a **bribe** (private gain subverting public duty).
  *   If the clerk is unpaid or underpaid and the rule is unenforceable, the envelope is a **fee** (a market correction for state failure).

  The disagreement persists because the Universalists insist on judging the act against the *written* rule (the law says no bribes), while the Relativists insist on judging the act against the *operating* rule (the system requires this fee to function).

  ### 4. Can the Impasse Be Moved?
  Honest answer: **No, not at the theoretical level.**

  This is not a puzzle waiting for a clever definition. It is a political fight. To label a practice "corrupt" is to declare the regime illegitimate. To label it "customary" is to grant it immunity. You cannot reconcile these positions because they serve different political ends.

  *   **Universalism** is a tool for reformers and external auditors who want to dismantle patronage networks.
  *   **Relativism** is a tool for anthropologists and local defenders who want to prevent external powers from imposing unworkable systems.

  **However, you can bypass the impasse by changing the question.**

  Stop asking: *"Is this act corruption?"*
  Start asking: *"Does this exchange reinforce or undermine the specific public good the institution is supposed to deliver?"*

  This reframing moves you away from moralizing the individual (the "bad apple" clerk) and toward **Collective Action Problems.**
  *   If the payment allows a hospital to function when the state has failed to fund it, it is a **survival strategy.**
  *   If the payment allows a contractor to bypass safety regulations, it is **predatory extraction.**

  Both might look like "bribes." Both might be "customary." But one sustains the public good, and the other destroys it.

  ### Summary Diagnosis
  1.  **It is not verbal.** Both sides mean "bad thing," but they disagree on what makes it bad (betrayal of office vs. betrayal of community).
  2.  **It is not purely factual.** The physics of the exchange don't matter; the institutional logic does.
  3.  **It is structural.** The impasse is permanent because "corruption" is a label used to enforce a specific vision of political order (Weberian bureaucracy) against another (Patrimonial networks).
  4.  **Your way out:** Ignore the label. Analyze the **institutional capacity.** If the state cannot pay its clerks, calling their tips "corruption" is analytically useless. If the state *can* pay them but doesn't enforce it, it is corruption. The variable isn't the culture; it's the **state capacity.**

  The literature is stuck because it tries to define corruption as a *moral category* rather than a *symptom of institutional mismatch.* If you treat it as a symptom of the gap between formal rules and informal realities, the debate dissolves. You stop arguing about whether the gift is "wrong" and start asking why the formal system requires a shadow payment to function.
