prompt: |-
  I write literary fiction, and I have been asked to give a one-off session at a writers' centre this autumn: a single two-hour slot, fourteen participants, all novelists, most of them at work on a second or third book and most of them quietly hostile to literary theory — the sort of people who hear the word pragmatics and start checking their phones. I want to give them something they cannot get from a craft book, and I want to give it to them without ever naming it during the session.

  Here is the problem I keep running into in my own work, which is why I am asking for this rather than for a reading list. A great deal of what my characters say is not reporting anything. When a character says, at a bedside, that she forgives her father; when a not-quite-sober registrar pronounces a couple married in a room where the licence has expired; when a colonel gives an order to men who no longer recognise his commission; when a man leaves everything to a woman he has not married and then dies before signing — none of these sentences is chiefly in the business of being true. They are attempts to do things, and they succeed or fail by standards that have nothing to do with accuracy. Readers are extremely good at detecting which is which, and they do it instantly and without vocabulary: a scene in which a vow is spoken in the wrong form, or by the wrong person, or into a silence where no one has the standing to receive it, goes dead on the page in a way that no amount of beautiful prose repairs, and I have watched myself write such a scene three times and not know why it would not stand up.

  So the design brief: a runnable activity — a game, a simulation, a staged set of real choices with small stakes — in which the participants run into that distinction before it is named. They should discover, by trying and failing to make words do things in the room, that the success of such an utterance is a matter of there being an accepted procedure, of the right persons being in the right positions, of the procedure being gone through completely, and of the speaker being in a certain state — and that an utterance can satisfy every one of those and still ring hollow, or violate one and still land. I do not want a lecture up front. I do not want the words illocutionary, perlocutionary, uptake, felicity, or constative spoken by anyone until the debrief. Ideally the participants should spend the first ninety minutes doing something and be unable to say afterwards what it was they were doing.

  Three complications of my own, which I am asking you to take seriously rather than accommodate politely. They are my coinages; I have no source for them and do not want one.

  The first I call shadow uptake. When a character in a novel is married, or threatened, or appointed, or excommunicated, nothing whatever has happened — there is no procedure, no standing, nobody is bound — and yet readers routinely report that the act worked, that the marriage is real for the purposes of the story, that the threat landed. They appear to run the same check they would run in life and return a verdict on an act they know to be void. My guess is that a novelist's craft consists substantially in engineering that check, and I want participants to feel themselves doing it.

  The second I call deferred performatives: utterances whose effect is suspended until some later, independent act ratifies them — a bequest that binds only at a death, a resignation tendered but not accepted, a bet that becomes binding only when the stake is posted, a sentence that binds only once it is entered. These are suspense machines, and novelists use them constantly without noticing that they have made the force of an utterance depend on an event the speaker will never see.

  The third I call double-addressed acts: a single utterance aimed at a character and at the reader at once, with a different force for each, where the reader's uptake of their half can quietly sabotage the character's. A public forgiveness is absolution to the person who receives it and menace to the reader, who alone knows what the speaker is concealing.

  Please design the session so that at least one of these three is not merely discussed but produced by the rules, and tell me honestly which of the three the mechanics can carry and which of them I will have to supply myself in the debrief — I would rather be told that one of my hobby-horses cannot be staged than given a contrived exercise that pretends otherwise.

  The practical constraints: fourteen adults in one room, two hours with a short break, one facilitator (me), nothing that costs money, no preparation between sessions, no homework, and materials limited to what a writers' centre actually has — index cards, a flipchart, pens, a bell. Participants will write short passages in the room and read them aloud, and that is fine; they will also, I think, have to say things to each other that commit them, and I want the commitment to be small but not fictional — tokens, chips, a ledger, a standing to be gained or lost — because I suspect the difference between describing a promise and being in one is exactly the thing I am trying to make them feel. Give me the rules, the material, the opening state of the room, what the facilitator does and does not say, a minute-by-minute shape, the scoring if there is scoring, and any cards or scripts I need to write in advance.

  Then the debrief, which I want in more detail than the game: which moment in the activity is supposed to produce which recognition, in what order I should draw them out, and what question I should ask to get each one — not a list of points to assert. Include what will predictably go wrong the first time I run it: I expect at least one participant to treat the whole thing as an exercise in rule-lawyering and try to win by inventing procedures, one to insist that a fictional utterance is simply true within the story and that nothing more needs saying, and one to collapse the difference between an act that misfires and an act that is achieved but hollow, since in a room of actors insincerity is indistinguishable from good acting. Tell me what to do with each of those. Finally, be frank about what the exercise cannot reproduce. My worry is that it will make the whole business feel like a game convention — a rule we agreed to for an hour — and that the step from the room accepted it to you are now bound, this has changed what you owe, will have to come entirely from me in the last fifteen minutes. If that is so, say so, and tell me what I should say.
reasoning: |-
  Here's a thinking process that leads to the suggested session design:

  1.  **Analyze the Request:**

      *   **Target Audience:** 14 novelists (mostly 2nd/3rd book), literary fiction focus, hostile to theory/pragmatics.
      *   **Goal:** Teach the mechanics of *performative utterances* (speech acts) without using theory jargon until the debrief. Focus on *felicity conditions* (procedure, persons, state, completeness) vs. *truth conditions*.
      *   **Core Problem:** Characters saying things that *do* things (forgive, marry, order, bequeath). Readers detect when these "fail" even if prose is beautiful.
      *   **Specific Constraints:** 2 hours, 14 participants, 1 facilitator, low budget (index cards, flipchart, pens, bell), no prep between sessions, no homework.
      *   **Specific Complications (User's Coinages):**
          1.  *Shadow Uptake:* Readers accept fictional acts as real within the story.
          2.  *Deferred Performatives:* Acts binding only upon future events (suspense).
          3.  *Double-Addressed Acts:* Utterance aimed at character and reader with different forces.
      *   **Requirement:** Design a runnable activity (game/simulation) where participants *experience* the failure/success of speech acts. At least one complication must be *produced* by the rules. Be honest about which complications can/cannot be staged.
      *   **Debrief:** Detailed guidance on drawing out insights, handling predictable pushback (rule-lawyering, fictional truth, insincerity vs. hollowness), and addressing the "game convention" vs. "real binding" gap.

  2.  **Deconstruct the Core Concept:**

      *   The user is describing J.L. Austin's *How to Do Things with Words* (felicity conditions, illocutionary acts) but wants to avoid the terminology.
      *   The key insight is: *Words have power only when the context authorizes them.*
      *   To make writers *feel* this, they need to be placed in a context where their words *actually* change the state of the room, and then have that authority undermined or complicated.

  3.  **Brainstorming the Activity:**

      *   *Idea 1: Mock Wedding.* Too cliché, hard to manage with 14 people, might feel silly.
      *   *Idea 2: Courtroom.* Too complex, requires too much rule knowledge.
      *   *Idea 3: A Micro-Economy of Promises.* Participants trade "obligations."
      *   *Idea 4: The "Standing" Game.* Assign roles with specific powers. Let them try to change the state of the room.
      *   *Selection:* A hybrid of Idea 3 and 4. A system of "Ledgers" and "Charters." This allows for *Deferred Performatives* (binding later) and *Shadow Uptake* (accepting the fiction of the game).

  4.  **Developing the Mechanics (The "Protocol"):**

      *   **Materials:** Index cards (Charters), Pens, A central Ledger (Flipchart), Bell.
      *   **Setup:** Divide into small groups? No, keep them as one "Body" to maximize the "public" aspect of speech acts.
      *   **Roles:** Need hierarchy. A "Registrar," "Witnesses," "Principals."
      *   **Currency:** "Standing." You need Standing to speak effectively.
      *   **The Twist:** The rules for valid speech acts are hidden or distributed unevenly.
      *   **Addressing the Complications:**
          *   *Shadow Uptake:* The game *is* the shadow uptake. They agree the tokens matter.
          *   *Deferred Performatives:* Can be built into the cards (e.g., "This vow activates when the bell rings").
          *   *Double-Addressed:* Harder to stage mechanically. This likely needs to be debriefed.
      *   **Decision:** The mechanics can robustly support *Shadow Uptake* (by making the game reality the story reality) and *Deferred Performatives* (via timed conditions). *Double-Addressed Acts* are too internal/reader-specific to simulate in a room of peers. I must be honest about this.

  5.  **Drafting the Session Plan (Minute-by-Minute):**

      *   *0-10:* Intro (Minimal). Set the stakes.
      *   *10-40:* Phase 1: The Grant. Establishing authority.
      *   *40-70:* Phase 2: The Complication. Introducing defects/deferrals.
      *   *70-80:* Break.
      *   *80-110:* Phase 3: The Writing. Applying the feeling to text.
      *   *110-120:* Debrief Intro.
      *   *120-140:* Debrief Discussion.
      *   *140-150:* Closing/Theory Reveal.
      *   *Wait, total time is 2 hours (120 mins).* I need to tighten this.
      *   *Revised:* 0-15 Intro/Setup. 15-60 Game Phase 1 & 2. 60-70 Break. 70-100 Writing. 100-120 Debrief.

  6.  **Refining the Game ("The Charter"):**

      *   Give everyone a card. Some are "Validating," some are "Null."
      *   Task: Transfer a "Duty" from one person to another using speech.
      *   Condition: It only works if the right people hear it and sign the Ledger.
      *   *Shadow Uptake Mechanism:* The "Duty" is real within the room (e.g., whoever holds the Duty must fetch water/organize chairs at the end). This makes the stakes *actual*, not just fictional.
      *   *Deferred Mechanism:* Some cards say "Effective at 4:00 PM."
      *   *Failure Mode:* If someone without Standing tries to assign a Duty, it fails. The group must decide if it "landed."

  7.  **Addressing the User's Complications (Honesty Check):**

      *   *Shadow Uptake:* The game *creates* this. The room agrees the tokens matter. This is the strongest fit.
      *   *Deferred Performatives:* Easy to script on cards. "This transfer is void if the bell rings before signing."
      *   *Double-Addressed:* **Cannot be staged.** This requires a reader outside the text. I need to tell the user this is for the debrief only.

  8.  **Handling Pushback (The "Predictable Failures"):**

      *   *Rule-Lawyer:* "I didn't sign the card, so the vow is void." -> *Response:* "In the room, yes. On the page, who is the judge?"
      *   *Fictional Truth:* "In the story, I say it's true." -> *Response:* "Then why did the scene feel dead?"
      *   *Insincerity:* "I lied but the act worked." -> *Response:* Distinguish *abuse* (insincere but valid) from *misfire* (invalid).

  9.  **Structuring the Debrief:**

      *   Move from the *feeling* (anxiety, relief, confusion) to the *mechanism* (why did it work?) to the *application* (how does this translate to the page?).
      *   Save the jargon (Austin, Felicity, Illocution) for the very end as a "name for what you already know."

  10. **Review against Constraints:**

      *   14 participants? Yes, groups of 4 or one big circle. One big circle is better for "public" acts.
      *   2 hours? Tight but doable.
      *   Materials? Index cards, pens, flipchart.
      *   No theory until debrief? Crucial.
      *   User's Coinages? Integrate Shadow Uptake and Deferred. Admit Double-Addressed is debrief-only.

  11. **Final Polish:**

      *   Tone: Professional, respectful of the user's expertise, direct.
      *   Formatting: Clear headings, bold text for emphasis.
      *   Specific Scripts: Write out exactly what the facilitator says to avoid theory slip-ups.

  *(Self-Correction during drafting)*: I initially thought about having them write *during* the game. No, that breaks the immersion. Play the game first to get the *sensation* of the speech act, then write to translate that sensation.
  *(Self-Correction on Stakes)*: The stakes need to be small but *real*. Not "pretend money." Maybe the loser has to stack the chairs or wipe the board. Let's make it "The Ledger." Whoever holds the "Debt" at the end has to write the session report/summary on the flipchart. It's a small burden, but a real one.

  *(Refining the "Double-Addressed" limitation)*: I need to be very clear that a room of writers cannot simulate a *reader*. They are all authors. The "reader" position is empty in the room. This is a critical insight for the debrief.

  *(Final check on time)*: 120 minutes.
  0-15: Setup & Rules.
  15-55: The Game (3 Rounds).
  55-65: Break.
  65-95: Writing Exercise.
  95-120: Debrief & Theory.
  This works.

