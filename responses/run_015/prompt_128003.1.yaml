answer: |-
  **1. The Risk Difference vs. Odds Ratio Distinction**
  **Question:** Textbooks often conflate two sources of reversal: genuine confounding imbalance and the non-collapsibility of the odds ratio, which can reverse even under randomization. But reversals in *risk differences* require treatment prevalence to differ across strata. If I use risk differences, doesn't the reversal become a diagnostic signal of imbalance again? Do you want to say the second "source" is just a bad effect measure, or does your "no paradox" claim swallow that distinction too?
  **Expected Answer:** She will likely argue that non-collapsibility is a mathematical property of the measure, not a paradox of the data. She will maintain that even with risk differences, the "reversal" is only puzzling if you assume the marginal RD is the target causal parameter without checking the DAG. She will insist the issue is always *identification*, not the measure chosen.
  **Follow-up:** So if I hand you a table where the marginal risk difference is outside the range of the conditional risk differences, and I tell you treatment was randomized, you're saying I shouldn't be surprised? You'd say I simply picked a non-collapsible estimand, not that the data is behaving paradoxically?
  **Confidence:** High

  **2. The Validity of the Crude Table**
  **Question:** You argue the pooled figure estimates a different quantity, not a corrupted truth. But in policy, we often care about the "effect of the offer" in the population as it actually behaves, including their selection biases. Is the crude pooled comparison *ever* the right answer for a decision-maker, or is it always dominated by a standardized estimate of the marginal effect in the population actually at hand?
  **Expected Answer:** She will distinguish between *predictive* modeling (where crude associations are fine) and *causal* inference (where they are usually wrong). She will likely say the crude table is the "effect of treatment on the treated" only if specific conditions hold, but generally, it's a mix of causal effect and selection bias. She will argue we must define the "target population" explicitly.
  **Follow-up:** If the target population is "patients presenting at this hospital next Tuesday," and their frailty distribution matches the crude mix, isn't the crude table the unbiased predictor of their outcomes, even if it's a biased estimate of the biological efficacy? Are you forcing a causal question where a predictive one suffices?
  **Confidence:** High

  **3. The On-Screen Example: Baseline vs. Downstream**
  **Question:** Let's look at the "Transitions" example on screen. The numbers are identical in both versions. In Version A, frailty is baseline; in Version B, the score is partly determined by a variable the program encourages post-discharge. If no amount of staring at the numbers tells you which case you're in, what content is left in your framework beyond a reminder to "draw the graph"? Can any pattern of conditional independencies in the data discriminate between the two graphs?
  **Expected Answer:** She will admit the data alone cannot distinguish the graphs (observationally equivalent models). She will argue the content is in the *assumptions* required to identify the causal effect, not in the numbers themselves. She will likely say statistical tests can rule out some graphs but not distinguish these specific causal directions without temporal or domain knowledge.
  **Follow-up:** If the data can't distinguish them, and the correct action flips depending on which graph is true, isn't the "paradox" actually a warning that the data is insufficient for the decision? Why rebrand an identification failure as a semantic error about the word "paradox"?
  **Confidence:** Medium

  **4. Estimation and Shrinkage**
  **Question:** Once I cross frailty by site and year, I have a few dozen thin strata. Any sensible estimator shrinks the stratum-specific effects toward the pooled value to reduce variance. If you endorse shrinkage, aren't you treating the pooled figure as *evidence* about the stratum-specific truths? How do you square that with the claim that the pooled table is just a different estimand?
  **Expected Answer:** She will distinguish between the *estimand* (the true value we want) and the *estimator* (the calculation we use). She will argue shrinkage is a regularization technique to improve estimation of the *stratum-specific* parameters, not an admission that the *marginal* parameter is the truth. The pooled value acts as a prior mean, not the target.
  **Follow-up:** But if the pooled value pulls the estimate, it's exerting causal leverage on my conclusion. If the pooled number is "just a different quantity," why does it have gravitational pull on the quantity I actually want? Doesn't that imply they share a common cause or truth?
  **Confidence:** Medium

  **5. Decision Theory and the Sure-Thing Principle**
  **Question:** I will learn my patient's frailty before deciding, and in each case, I prefer the program; yet a randomly chosen patient does worse under it in the crude data. Is this resolved by the Sure-Thing Principle read causally, or simply by noting that I am not choosing for a "random patient"? And then the harder case: what if the frailty score arrives *after* the decision must be made?
  **Expected Answer:** She will invoke Pearl's formulation of the Sure-Thing Principle, which applies to causal effects, not statistical associations. She will say the principle is not violated because the "overall" association is not the causal effect. For the second case (unknown frailty), she will argue you must integrate over the distribution of frailty you expect to encounter, weighting the stratum-specific causal effects.
  **Follow-up:** So if I don't know the frailty distribution of my future patients, I can't use the crude table, but I also can't use the stratified table without weights. Am I left with no decision rule until I survey the population? Is the paradox just a gap in my surveillance data?
  **Confidence:** High

  **6. The Berkeley Admissions Level**
  **Question:** In the Berkeley admissions data, the department-level table dissolves the appearance of bias. But is that the right thing to tell a university president, given that the sorting of applicants across departments may itself be part of what one wanted to measure? Does your framework silently encode a normative choice about which pathway counts as "discrimination" and which counts as "preference"?
  **Expected Answer:** She will agree that the choice of estimand is normative. She will argue that "total effect" vs. "direct effect" corresponds to different legal or policy questions. She will deny the framework *silently* encodes it; she will say the framework *forces* you to make it explicit. The "paradox" arises when people swap between these normative questions without noticing.
  **Follow-up:** If the framework forces me to make it explicit, but the data looks identical until I do, doesn't the "paradox" label serve a useful function? It flags the moment where my implicit normative assumption is about to drive the conclusion. Removing the label removes the warning light.
  **Confidence:** Medium

  **7. Lord's Paradox Connection**
  **Question:** Does this dissolution cover Lord's paradox, where there is no reversal but two statisticians reach opposite answers using baseline adjustment versus change scores? Is this one phenomenon or a family? If it's a family, what is the common thread beyond "different estimands"?
  **Expected Answer:** She will classify Lord's Paradox as the same family: confusion over whether to condition on baseline status. She will argue it's about whether the baseline is a confounder or a mediator of the outcome. The common thread is the failure to map the statistical adjustment to a causal diagram.
  **Follow-up:** In Lord's paradox, the "paradox" feels stronger because the data is longitudinal. Are you saying time doesn't matter, only the DAG? If so, why do we teach these as distinct historical puzzles rather than instances of the same identification error?
  **Confidence:** High

  **8. Falsifiability**
  **Question:** What could count against your framing? What finding, or what kind of case, would make you stop saying that there is no paradox here? If the answer is "nothing, because it's a category error," does that make your claim unfalsifiable?
  **Expected Answer:** She will likely say the claim is conceptual, not empirical, like saying "there is no paradox in 2+2=5." She might argue that a case where the data *forced* a unique causal conclusion without assumptions would count against her, but such a case doesn't exist. She will defend the position that "paradox" implies a contradiction in logic, whereas this is just confusion about definitions.
  **Follow-up:** If it's purely conceptual, does it have any empirical bite? If I can show that labeling it a "paradox" improves student comprehension or prevents policy errors better than calling it an "estimand shift," wouldn't a pragmatist keep the label regardless of your arithmetic argument?
  **Confidence:** Low

  ***

  **Calibration Note**

  **Least Fair Question:** Question 4 (Estimation and Shrinkage).
  **Assumption:** This question rests on the assumption that Dr. Reinholt views shrinkage purely as a variance-reduction technique for a fixed estimand.
  **Empirical Doubt:** A Bayesian statistician might argue that the "pooled value" is part of the generative model itself (a hyperparameter), meaning the distinction between "estimand" and "evidence" is blurrier than the question allows. If she holds a hierarchical modeling view, the pooled mean *is* structurally related to the stratum means, not just a "different quantity."

  **Empirical Check on Example:** Before recording, verify the "downstream" version of your example. You state the frailty score is "partly determined by a variable recorded seven days after discharge that the program itself encourages."
  *   **Check:** If the program *causes* the frailty score to change (e.g., the program improves health, lowering the frailty score), then Frailty is a **mediator**. Conditioning on a mediator blocks the indirect path and estimates the *direct* effect.
  *   **Check:** If the program encourages a behavior that *influences the measurement* of frailty (e.g., more contact leads to more recorded comorbidities), Frailty might be a **collider** or simply measurement bias.
  *   **Risk:** If Frailty is a mediator, the "stratified" table estimates the Direct Effect, and the "crude" table estimates the Total Effect. Neither is "wrong," they are just different. Ensure your script acknowledges that in the downstream case, the stratified estimate might actually be *biased* for the total benefit of the program, which reinforces her point that "which table is right" depends on the question. If you imply the stratified table is "misleading" in the second version, ensure you mean "misleading for the Total Effect," not "mathematically invalid."
