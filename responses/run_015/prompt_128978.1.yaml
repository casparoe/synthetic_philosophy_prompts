answer: |-
  # Desiderata for an Account of Promissory Obligation

  An adequate theory of why promises bind must satisfy a specific set of explanatory requirements. These criteria range from foundational intuitions about moral agency to novel challenges posed by technological mediation. Below are the necessary desiderata, categorized by their necessity, followed by an analysis of their tensions and a scoring of leading theoretical camps.

  ## I. Scope and Commitments

  **D1. The Coverage Requirement (Non-negotiable)**
  The account must explain the binding force of both ordinary interpersonal promises (e.g., "I will meet you for lunch") and institutional vows (e.g., marriage vows, oaths of office). It cannot treat one as parasitic on the other without explaining the transition.
  *   **Motivating Case:** A theory that explains wedding vows solely through state enforcement fails to explain why a casual promise between friends binds without legal backing. Conversely, a theory that explains lunch plans solely through social etiquette fails to explain the gravity of perjury.

  **D2. The Normative Distinction (Non-negotiable)**
  The account must distinguish promissory *obligation* from mere *expectation* or prediction. It must explain why breaking a promise is a distinct moral wrong, not merely a disappointed forecast or a pragmatic inconvenience.
  *   **Motivating Case:** If I predict I will rain tomorrow and it does not, I am mistaken. If I promise it will not rain and it does, I have violated a duty. The theory must locate the source of this "must."

  ## II. Structural Distinctions

  **D3. The Release vs. Breach Distinction (Non-negotiable)**
  The account must explain the asymmetry between breaching a promise and being released from one. Specifically, it must explain why the promisee holds the unique power to release the promisor, whereas third parties generally cannot.
  *   **Motivating Case:** If I promise to drive you to the airport, I wrong you if I do not show up. But if you tell me "don't worry about it," I am no longer bound. A theory based solely on general social utility cannot easily explain why the specific promisee holds this "moral veto."

  **D4. The Defeasibility Constraint (Non-negotiable)**
  The account must explain why certain conditions—specifically duress and radical informational asymmetry—void promissory obligation. It must clarify why a promise extracted at gunpoint or based on a fundamental lie does not bind.
  *   **Motivating Case:** A contract signed under threat is void. A promise to repay a debt that does not exist (based on a lie) is not binding. The theory must explain why the *origin* of the promise matters, not just the utterance.

  ## III. Foundational Grounding

  **D5. The Unity vs. Pluralism Preference (Camp Preference)**
  The account should state whether the binding force of all promises rests on a single ground (monism) or varies by context (pluralism).
  *   **Motivating Case:** Monists argue that a promise to a child and a promise to a king share the same moral structure. Pluralists argue that family promises rely on care, while commercial promises rely on convention. While pluralism is more flexible, monism offers greater theoretical unity. This is marked as a preference because adequate theories exist on both sides, though monism is generally preferred for parsimony.

  ## IV. The Synthetic Delegation Challenge

  **D6. The Synthetic Delegation Requirement (Non-negotiable)**
  The account must explain the binding force of commitments made to autonomous systems or via algorithmic intermediaries where specific human expectation is absent.
  *   **Motivating Case:** An agent (Promisor) commits to a Principal (Promisee) that they will execute any output generated by an Autonomous System, provided the Promisor reviews it. The System generates a specific instruction. The Promisor reviews it and is bound to follow it. Crucially, the Principal had no prior expectation of this specific instruction, nor did they rely on it before it was generated.
  *   **Demand:** The theory must ground the obligation in the *commitment to the procedure* rather than specific reliance on content or direct interpersonal will regarding the specific act. It must explain why the human is bound to the machine's output without reducing the obligation to mere rule-following.

  ## V. The Joint Tension (The Unsatisfiable Subset)

  There is a significant tension between three specific desiderata. Satisfying them simultaneously creates a "trilemma" that threatens the coherence of any single theory.

  **The Tension Subset:**
  1.  **D4 (Defeasibility via Voluntariness):** To explain why duress/asymmetry voids promises, the theory must ground obligation in a valid, informed, specific voluntary act of the will.
  2.  **D6 (Synthetic Delegation):** To explain binding force in AI delegation, the theory must ground obligation in a commitment to a *process* where the specific content is *not* voluntarily chosen (it is generated by the system) and information is inherently asymmetric (the human cannot fully know the output ex ante).
  3.  **D2 (Normative Distinction):** To explain why this is a promise and not just a rule, the obligation must remain moral/normative, not merely systemic compliance.

  **Why they are jointly unsatisfiable:**
  If you prioritize **D4**, you struggle with **D6**. If obligation requires specific voluntary assent to content (to protect against duress), then assenting to an unknown AI output looks like invalid consent (radical asymmetry). You cannot be "voluntarily bound" to something you could not specifically will.
  If you prioritize **D6**, you threaten **D4**. If you can be bound to unknown outputs via procedural commitment, the distinction between valid promises and coerced/voidable agreements blurs. (e.g., "You agreed to follow the rules" vs. "You agreed to whatever I demand").
  If you resolve this by making it purely systemic to satisfy **D6**, you violate **D2**. The obligation becomes a matter of system compliance (like following a software license) rather than a moral promise, losing the normative "wrongness" of breach.

  *This tension is the primary failure point for contemporary accounts.*

  ## VI. Theoretical Scoring

  Below is a brief evaluation of the three dominant theoretical camps against these desiderata.

  **1. Autonomy-Based Views (Will Theory)**
  *   **Core:** Promises bind because agents exercise normative power to bind their future selves.
  *   **Score:**
      *   **D1/D2/D3:** High. Excellently explains the normative force and the power of release (as a reversal of the will).
      *   **D4:** High. Duress voids the will, so no obligation is created.
      *   **D6:** **Fail.** Struggles to explain how one wills an unknown future act generated by a machine. If I didn't will the specific act, autonomy theory suggests I am not bound, contradicting the intuition of the delegation case.
      *   **Tension:** Collapses on the D4/D6 conflict.

  **2. Trust-Based Views (Reliance Theory)**
  *   **Core:** Promises bind because they induce reliance, and breaking them harms the promisee.
  *   **Score:**
      *   **D1:** Medium. Struggles with institutional vows where reliance is minimal.
      *   **D2:** **Fail.** Reduces obligation to harm-prevention. If I break a promise but you suffer no harm (no reliance), the theory suggests no wrong was done.
      *   **D3:** Medium. Explains release as waiving the right to compensation for harm.
      *   **D4:** High. Fraud voids reliance.
      *   **D6:** **Fail.** In synthetic delegation, the Principal does not rely on the specific output ex ante. There is no specific expectation to violate.
      *   **Tension:** Collapses on D2 and D6.

  **3. Practice-Based Views (Convention Theory)**
  *   **Core:** Promises bind because they participate in a social practice that constitutes the obligation.
  *   **Score:**
      *   **D1:** High. Handles institutional and ordinary promises as variations of practice.
      *   **D2:** Medium. Risk of reducing "ought" to "is" (following the rules of the game).
      *   **D3:** **Fail.** If the obligation comes from the social practice, why can the individual promisee release the promisor? The practice should demand performance regardless.
      *   **D4:** Medium. Can explain duress as an exception within the practice, but struggles to explain *why* the practice recognizes it.
      *   **D6:** High. Best equipped to handle synthetic delegation as a new procedural convention.
      *   **Tension:** Collapses on D3 and the D2/D6 conflict (risk of reducing promise to rule-following).

  **Summary:** No existing camp satisfies all non-negotiable desiderata. Autonomy views fail the Synthetic Delegation test; Trust views fail the Normative Distinction and Synthetic Delegation tests; Practice views fail the Release Distinction. The tension between Defeasibility (D4) and Synthetic Delegation (D6) remains the critical unsolved problem.
