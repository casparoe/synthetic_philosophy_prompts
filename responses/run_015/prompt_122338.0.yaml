          *   App 1: $(95, 5)$. App 61: $(5, 95)$.
          *   Diff in $R$: 90. Diff in $T$: 90.
          *   Text says: "one of them leads by as much as twenty-two points."
          *   If $V = R + wT$.
          *   $V_1 = 95 + 5w$. $V_{61} = 5 + 95w$.
          *   Diff $= V_1 - V_{61} = 90 - 90w = 90(1-w)$.
          *   Range of $w$: The prompt says "a point of research is worth somewhere between 0.8 and 1.25 points of teaching". This phrasing is slightly ambiguous. Does it mean $1 R = 0.8 T$ to $1.25 T$?
          *   If $1 R = 0.8 T$, then $w$ (weight of T relative to R) $= 1/0.8 = 1.25$.
          *   If $1 R = 1.25 T$, then $w = 1/1.25 = 0.8$.
          *   So $w \in [0.8, 1.25]$.
          *   Max Diff: If $w=0.8$, Diff $= 90(1-0.8) = 18$. (App 1 wins).
          *   Min Diff: If $w=1.25$, Diff $= 90(1-1.25) = -22.5$. (App 61 wins by 22.5).
          *   Text says: "from applicant 1 ahead by 22.5 to applicant 61 ahead by 18".
          *   Okay, so the math checks out. The weight $w$ (value of Teaching relative to Research) is the unknown variable $\lambda \in [0.8, 1.25]$.
          *   Adjacent Pair Diff: $\Delta R = -1.5$, $\Delta T = +1.5$.
