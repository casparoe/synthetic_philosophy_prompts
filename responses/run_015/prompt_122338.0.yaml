      *   This is the critical missing insight. The debate about ranking the *whole* list is moot because the only relevant decision is between 1 and 61 (or a policy decision on $w$). The "staircase" makes the middle candidates Pareto-dominated by the endpoints *relative to the weight range*.
      *   Actually, strictly speaking, if $w=0.9$, #1 is best. If $w=1.1$, #61 is best. #30 is never best.
      *   So Marisol's suggestion to "shortlist a handful" is actually mathematically supported, but she implies shortlisting from the middle or a mix. Peter's focus on the whole ranking is wasteful.
