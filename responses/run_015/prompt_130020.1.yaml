answer: |-
  # Decision Tree: The Architecture of Moral Worth

  ### **Root Node**
  **For an action to possess moral worth, must the reason that makes the action morally right be the exact same reason that actually moves the agent to perform it?**

  *   **NO** → Go to **Branch A**
  *   **YES** → Go to **Branch B**

  ---

  ### **Branch A (The Normative and Motivating Reasons Diverge)**
  **Node A1: Must this actual motivating reason be something the agent can consciously call to mind during the action, or can it operate through subconscious habits or intuitions?**

  *   **Consciously Accessible** → **Leaf 1**
  *   **Subconscious/Habitual** → **Leaf 2**

  *(Note: On this branch, the question of external outsourcing is less decisive for moral worth than the alignment of motive and outcome, so the taxonomy terminates here.)*

  ---

  ### **Branch B (The Normative and Motivating Reasons Align)**
  **Node B1: Must this motivating reason be something the agent can consciously call to mind during the action, or can it operate through subconscious habits, intuitions, or automated processes?**

  *   **Consciously Accessible** → Go to **Node B2**
  *   **Subconscious/Habitual** → Go to **Node B3**

  **Node B2 (Conscious Access): Does this motivation count only if the agent has internally endorsed it, or does it retain worth even if sustained by external tools, testimony, or social structures?**

  *   **Internally Endorsed** → **Leaf 3**
  *   **Externally Sustained** → **Leaf 4**

  **Node B3 (Subconscious/Habitual): Does this motivation count only if the agent has internally endorsed it, or does it retain worth even if sustained by external tools, testimony, or social structures?**

  *   **Internally Endorsed** → **Leaf 5**
  *   **Externally Sustained** → **Leaf 6**

  ---

  ### **Leaf Classifications**

  **Leaf 1: Conscious Sentimentalism**
  *   **Awkward Commitment:** It privileges agents with articulate emotional lives over those with inarticulate but reliable moral instincts, suggesting moral worth correlates with verbal expressivity rather than goodness.

  **Leaf 2: Blind Virtue**
  *   **Awkward Commitment:** It grants full moral worth to socially engineered habits even if the agent lacks any capacity to critique the authoritarian system that formed them.

  **Leaf 3: Strict Autonomy**
  *   **Awkward Commitment:** It denies moral worth to moral experts whose correct judgments have become too fluid and intuitive to be consciously reconstructed in the moment.

  **Leaf 4: Guided Reflection**
  *   **Awkward Commitment:** It implies an agent using a moral crutch or app has equal worth to one who generated the insight independently, potentially devaluing deep understanding.

  **Leaf 5: Embodied Integration**
  *   **Awkward Commitment:** It cannot easily account for the worth of actions performed via new cognitive prosthetics before those tools feel like 'second nature' to the user.

  **Leaf 6: Extended Moral Mind**
  *   **Awkward Commitment:** It risks attributing moral worth to the external infrastructure or institution rather than the agent who merely triggers the mechanism.

  ---

  ### **Taxonomic Ambiguity Flag**

  **Unclean Separation: Leaf 5 (Embodied Integration) vs. Leaf 6 (Extended Moral Mind)**
  The branching logic struggles to cleanly separate views that accept subpersonal mediation but reject social outsourcing (Leaf 5) from those that accept both (Leaf 6). In practice, a "personally appropriated" habit (Leaf 5) is often indistinguishable from a "socially distributed" mechanism (Leaf 6) when the agent's internal cognitive architecture has been shaped entirely by cultural scaffolding. A position claiming to require internal integration may inadvertently rely on the very external structures it claims to exclude, making the boundary between "integrated habit" and "outsourced prompt" porous in cases of augmented cognition or deep socialization.
