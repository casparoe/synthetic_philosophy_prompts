answer: |-
  # The "Overbudget Grant" Auction

  **Time Allocation:** 15 Minutes (Game) + 75 Minutes (Debrief)
  **Group Size:** 12 Grad Students
  **Stakes:** Printed "Lab Points" + One $20 Coffee Gift Card

  ## The Design

  **1. The Setup (5 mins)**
  Hand each student an envelope containing **10 "Lab Points"** (printed cards or poker chips). Tell them:
  *   "These points represent your current research capital."
  *   "At the end of the workshop, any points you still hold are worthless. They are only useful for bidding."
  *   "There is **one $20 Coffee Gift Card** up for auction. It is valued at **20 Points**."

  **2. The Rules (The Trap)**
  *   **Open Outcry:** Bids are public, in increments of 1 Point.
  *   **The Winner:** The highest bidder receives the $20 Card. They do *not* pay their bid (it's a grant).
  *   **The Runner-Up (The Trap):** The **second-highest bidder** must pay their bid amount to you (the instructor).
      *   Payment comes first from their Lab Points.
      *   If they run out of points, they enter **Debt**.
      *   **Debt Rate:** Every point of negative balance costs them **$1 real cash** payable to you at the end of the session.
  *   **Everyone Else:** Keeps their points (which are worthless, but they lose nothing).

  **3. The Execution (10 mins)**
  Run the auction yourself. Act as a fast-paced auctioneer.
  *   Start low ($1 bid).
  *   Keep the energy high. "Do I hear 2? 2 going once..."
  *   Once bidding passes 10 points (their endowment), explicitly remind them: *"You are now bidding on credit. That is real money."*
  *   Stop only when no one is willing to top the current bid.
  *   **Collect the debt immediately.** If the runner-up bid 15 points (10 endowment + 5 debt), they hand you their 10 cards and $5 cash.

  ## Why This Design? (Defense)

  I am rejecting the "pure cash" version and the "candy" version for this specific group.
  1.  **Why not pure cash?** Grad students have varying liquidity. Asking them to pull out wallets creates friction and resentment that distracts from the lesson. It also introduces inequality (some can afford to bid higher simply because they are richer).
  2.  **Why not candy?** It's too trivial. Grad students are professionals; losing a candy bar doesn't trigger the same "loss aversion" circuitry as financial debt.
  3.  **Why Points + Debt?** This equalizes the playing field (everyone starts with 10) but introduces *real* consequences once the endowment breaks. The transition from "play money" (points) to "real money" (debt) mirrors the real-world transition from "grant budget" to "personal reputation/career capital." It structurally forces them to bid past the rational limit because the pain of paying for a loss (Runner-Up penalty) feels worse than the cost of increasing the bid.

  ## The Debrief (75 Minutes)

  Do not lecture immediately. Let the silence sit for 30 seconds after collecting the debt. Then, map the game to theory.

  ### 1. Map the Moves (20 mins)
  Draw the bid history on the whiteboard.
  *   **The Rational Zone (Bids 1–9):** Point out that early bids were rational. Investing 1 point to win 20 is a 20x return.
  *   **The Break-Even Point (Bid 10):** At 10 points, the winner breaks even (20 value - 10 cost = 10 net). Still rational.
  *   **The Trap Zone (Bids 11+):** This is where the logic flipped.
      *   Ask the Runner-Up: *"At bid 11, you hadn't lost yet. Why bid 12?"*
      *   They will say: *"Because if I stop at 11, I lose 11 points. If I bid 12 and win, I only lose 12 (net 8 loss). It's less bad."*
      *   **Label this:** *Loss Minimization vs. Value Maximization.* Rational agents maximize value. Escalating agents minimize loss.
  *   **The Debt Zone:** Ask the winner: *"The card is worth $20. You bid 25 points ($25 debt + endowment). Why?"*
      *   Answer: *"I was already in the hole. I couldn't let them win after I spent that much."*
      *   **Label this:** *Sunk Cost Fallacy.* The past expenditure dictated the future investment, not the future value of the prize.

  ### 2. Predictable Failure Points & Fixes (20 mins)
  Be frank about what usually goes wrong the first time you run this.

  *   **Failure 1: Collusion.**
      *   *Risk:* Students agree beforehand: "You bid 1, we split the $20."
      *   *Fix:* Pre-empt this in the rules. "If I detect any side-deals, the prize is voided, and I keep the coffee card." Also, the *structure* fights this: The incentive to undercut a partner is high (if they bid 1, you bid 2 and win big). Remind them of this incentive during setup.
  *   **Failure 2: The "Rich Student" Problem.**
      *   *Risk:* One student says "I don't care about the $1 debt, I'll just bid 100 to win."
      *   *Fix:* Cap the debt. "Maximum debt allowed is $10." This forces them to stop eventually and prevents one person from bullying the auction.
  *   **Failure 3: Refusal to Pay.**
      *   *Risk:* The runner-up refuses to hand over the $5 debt.
      *   *Fix:* This is an ethical minefield. **Crucial:** Before the game starts, get verbal consent: "This is a simulation of high-stakes decision making. By participating, you agree to the financial rules." If they still refuse, *you* pay the debt for them but publicly note that they "defaulted on the commitment." This turns their refusal into a data point about credibility loss.

  ### 3. What This Game Cannot Reproduce (20 mins)
  You must supply the context verbally. The game is too clean compared to reality.

  *   **Time Compression:** In the game, escalation happens in 5 minutes. In a PhD or startup, it happens over 5 years. The "boiling frog" effect is harder to feel in real life because the costs are dispersed.
  *   **Audience Visibility:** In this game, everyone sees the bids. In real organizations, escalation often happens in private committees. The *public* shame of losing drives the bidding here; in reality, *private* rationalization drives it.
  *   **The "Third" Bidder:** The Dollar Auction only punishes the top *two*. In real projects, often *everyone* on the team suffers when a project fails, not just the second-highest bidder. This dilutes the pressure in reality, making escalation *more* likely, not less.
  *   **Variable Value:** The coffee card has a fixed value ($20). Real projects have *uncertain* value. "If I just spend a bit more, the breakthrough might happen." This optimism bias is a stronger driver than the auction rules, and you need to explain that.

  ### 4. Closing the Loop (15 mins)
  End by asking: *"How do you design a lab or a team to prevent this?"*
  Guide them to structural solutions, not willpower:
  *   **Pre-commitment:** Set a "kill criteria" before starting (e.g., "If this experiment fails twice, we stop").
  *   **Third-Party Review:** Bring in someone who hasn't sunk costs to evaluate continuation.
  *   **Separate Decision Makers:** The person who authorized the spend should not be the person who decides whether to continue.

  ## Instructor Notes for Success
  *   **Tone:** Do not mock the losers. Validate their logic. "You made the rational choice *given that you were already trapped*." This reduces defensiveness.
  *   **Pacing:** If bidding stalls at $5, nudge them. "Current bid 5. Winner gets 20. Runner-up pays 5. Do you want to be the one who paid 5 for nothing?"
  *   **The Money:** Have a petty cash box ready to make change for the debt collection. It makes the "realness" of the penalty immediate.

  This design works because it forces the *mathematical* trap of the Dollar Auction while using a currency system that protects you from ethical blowback while still triggering genuine loss aversion.
