prompt: |-
  I run a workshop for about 12 grad students, 90 mins, on escalation and sunk costs. Design an in-class game that makes them actually feel the dollar-auction trap — not just understand it conceptually. Use small real stakes (candy, or points that convert to one coffee gift-card) with rules that stucturally push them to keep bidding even after they want out. The idea should emerge from the rules and payouts, not from me explainig it upfront. After the round ends, debrief: map exactly which moves matched sunk-cost logic vs rational exit, say what will predictably go wrong the first time I run it and how to fix it, and be frank about which part of real-world escalation this game simply can't reproduce so I have to supply it verbally. Don't present me with three variants — pick one concrete design and defend why it's right for this group size and time. No citations or reading lists needed.
