answer: |-
  You are right to trust your intuition that Simone Weil's critique is distinct from the standard "politicians are corrupt" or "money in politics" arguments. Those are criticisms of *accidents* within the system. Weil's critique, primarily articulated in her 1940 essay *On the Abolition of All Political Parties*, is a criticism of the *essence* of the party structure itself.

  For Weil, the party is not merely a vehicle for policy; it is a spiritual and psychological mechanism that inherently corrodes the human capacity for truth.

  Here is the specific mechanism of her argument, how it connects to her concepts of **Force** and **Roots**, and why she believes the structure itself is dehumanizing.

  ### 1. The Core Mechanism: Pressure on Thought
  The specific argument Weil makes is epistemological (about how we know truth). She argues that the human soul has a faculty for perceiving truth, which she calls **Attention**. Attention requires silence, openness, and the suspension of one's own ego to let reality enter.

  The political party, by its very structure, makes Attention impossible.

  *   **The Primacy of Self-Preservation:** Weil argues that every party has one central, overriding goal: its own growth and preservation. Even if a party starts with a noble cause, the moment it becomes a "party," its survival becomes the prerequisite for achieving that cause.
  *   **The Loyalty Test:** To maintain cohesion, a party demands loyalty. Loyalty in a party context means aligning your judgment with the collective line.
  *   **The Dehumanizing Shift:** This is where the dehumanization happens. When you join a party, you are implicitly agreeing to subordinate your conscience to the collective will. You stop asking, "Is this true?" or "Is this just?" and start asking, "Is this good for the party?" or "Will this help us win?"

  Weil writes that parties exert a **"pressure on thought."** This pressure turns the human mind from an instrument of discovery into an instrument of warfare. You are no longer a thinking subject; you become a functional object of the party's will. You are dehumanized because your capacity for independent moral judgment is rendered obsolete.

  ### 2. Connection to "Force" (*La Pesanteur et la Grâce*)
  Weil is famous for her definition of **Force** as "that which turns anybody subject to it into a thing." Usually, we think of force as physical violence. Weil expands this to psychological and social structures.

  *   **Turning the Member into a Thing:** In a party system, the individual member is raw material. You are a vote, a donor, a canvas for a sign. The party does not care about your inner life or your specific relationship to the truth; it cares about your utility. When you internalize this, you treat yourself as a thing—a soldier in an army—rather than a person seeking the good.
  *   **Turning the Opponent into a Thing:** This is crucial for your burnout. Party politics transforms political opponents into enemies. In Weil's view, force blinds us to the humanity of the other. If the goal is victory (party preservation), the opponent is an obstacle to be crushed, not a neighbor to be persuaded. This creates a society where no one sees anyone else as fully human.
  *   **The Idol:** Weil, deeply influenced by her mystical Christianity, viewed the Party as a **collective idol**. An idol demands sacrifice. In ancient times, people sacrificed children to Moloch; in modern times, Weil argues, we sacrifice truth and conscience to the Party. Worshiping an idol is the ultimate dehumanization because it directs love and devotion toward something lifeless (a bureaucracy/structure) rather than toward God or the Good.

  ### 3. Connection to "Roots" (*L'Enracinement*)
  In *The Need for Roots*, Weil argues that human beings have spiritual needs, just as physical ones. We need "roots"—a connection to a community, a past, a future, and a shared truth.

  *   **Parties Uproot:** Paradoxically, while parties claim to represent groups of people, Weil argues they actually **uproot** them. Roots grow in reality and truth. Parties grow in propaganda and abstraction.
  *   **The Fiction of the Collective:** A party creates a fictional collective identity ("The Real Americans," "The Working Class," "The Patriots") that overrides the messy, complex reality of actual human relationships. To maintain this fiction, the party must simplify reality.
  *   **Nutrition for the Soul:** Weil believes the soul needs truth like the body needs food. If you feed the soul lies (propaganda, partisan simplifications, demonization of the other), it starves. The burnout you feel is, in Weil's framework, a form of spiritual malnutrition. You are being asked to consume falsehoods to sustain a structure that does not love you back.

  ### 4. Why It's Not Just "Bad Government"
  You asked why this is different from living under a bad government.

  For Weil, a government (even a flawed one) is a structure of **administration**. It deals with the practical management of public goods. A party is a structure of **passion**.

  *   **Government:** Ideally asks, "What is the just action for this situation?"
  *   **Party:** Inherently asks, "What action benefits our coalition?"

  You can live under a bad government and still retain your humanity by speaking truth to power. But if you are *inside* a party, the structure demands you compromise truth for power. The dehumanization comes from the **internal compromise**. It is the act of silencing your own conscience to maintain membership that Weil identifies as the spiritual crime.

  ### 5. Weil's Proposal (and why it feels so radical)
  Weil did not suggest anarchy. She suggested that representatives should be elected, but **without party labels**.

  She envisioned a system where representatives were chosen based on their individual character and local ties, and where debates in parliament were not contests between blocs, but genuine inquiries into the public good. She believed that without the "pressure of the party," human beings would naturally gravitate toward truth and justice, because that is the natural orientation of the soul when it is not under duress.

  ### Summary of the Burnout
  If we apply Weil's lens to your feeling of burnout:
  1.  **Cognitive Dissonance:** You are feeling the friction between your capacity for **Attention** (seeing nuance and truth) and the party's demand for **Loyalty** (simplifying and defending).
  2.  **Spiritual Exhaustion:** Fighting a "party war" requires feeding on force and passion. Weil argues this is unsustainable for the soul because it runs counter to the gravity of grace (which pulls toward truth and love).
  3.  **Loss of Agency:** You feel burned out because the system is designed to make you a cog, not an agent. Dropping registration is an attempt to reclaim your status as a thinking subject rather than a political object.

  Weil's critique validates the feeling that the problem isn't just *who* is winning, but *how* we are fighting. She argues that the method of partisan warfare corrupts the winner just as much as the loser, because both have surrendered their humanity to the idol of the collective.
