answer: |-
  **The Game**
  **Matrix:** A symmetric $4 \times 4$ normal-form game. Strategies: $A, B, C, D$. Payoffs (Row Player):

  | | **A** | **B** | **C** | **D** |
  |---|---|---|---|---|
  | **A** | 20 | 2 | 10 | 20 |
  | **B** | 2 | 20 | 10 | 20 |
  | **C** | 8 | 8 | 0 | 8 |
  | **D** | 0 | 0 | 0 | 0 |

  **Rules:** 25 students pair up (one rotates as observer/TA helper each round). Play 10 rounds. Each round, write your strategy on a slip. Submit anonymously. I tally choices on the board. Points accumulate; top three scorers earn bonus marks.
  **Setup:** Project the matrix. Distribute slips. Emphasize: "No talking across pairs." Pairs may discuss strategy *between* rounds only.
  **Key Feature:** $D$ is strictly dominated by $A$ (pure). $C$ is strictly dominated by a 50/50 mix of $A$ and $B$, but *not* by $A$ or $B$ alone. $A$ and $B$ are coordination strategies (high reward if matched, low if mismatched).
  **Materials:** Projector, slips of paper, board for tallies.
  **Time:** 30 minutes play, 45 minutes debrief.
  **Goal:** Maximize total points. The structure forces students to initially play $C$ (safe median payoff) or $D$ (error), before realizing $A/B$ mixing crushes $C$.

  **Round-by-Round Facilitation Plan**
  **Rounds 1–3 (Chaos):** Run quickly (2 mins/round). Tally results live. Expect high $C$ and $D$ usage initially; students fear the $A/B$ mismatch penalty (2 points). Do not comment on rationality yet. Let them feel the risk.
  **Round 4 (The Purge):** Stop. Ask: "Look at the board. Are there strategies nobody should ever play?" Guide them to compare $D$ and $A$. $A$ always yields more than $D$, regardless of the opponent. Vote to eliminate $D$. Cross it out on the projected matrix. Resume play.
  **Rounds 5–7 (The Wall):** $D$ usage should drop to zero. However, $C$ will persist. Why? Against pure $A$, $C$ (8) beats $A$ (2). Against pure $B$, $C$ (8) beats $B$ (2). Students feel "safe" playing $C$ because it avoids the coordination risk of $A/B$. $A$ and $B$ users fluctuate wildly.
  **Round 8 (The Intervention):** Stop. Ask: "Can we eliminate more?" They will say no; no *pure* strategy beats $C$. Challenge them: "What if your opponent is unpredictable? What if *you* randomize?" Ask $A$-players and $B$-players to stand. Propose flipping a coin to play their strategy. Calculate expected payoff vs $C$ on the board: $0.5(20) + 0.5(2) = 11$. Since $11 > 8$, the mix dominates.
  **Rounds 9–10 (Discovery):** Allow pairs to agree on a "mixed plan" (e.g., alternate $A/B$ explicitly). $C$ usage should crash as they realize the expected value advantage.
  **Closing:** Collect data. Transition to lecture.

  **The Debrief**
  **1. Pure Elimination:** Confirm $D$ was eliminated first. Why? $A$ yielded higher points regardless of the opponent's choice. This reviews Iterated Elimination of Strictly Dominated Strategies (IESDS) using pure strategies, which they already know.
  **2. The Wall:** Acknowledge the stagnation at $C$. Why didn't pure dominance work? Show the matrix: Against $A$, $C$ wins. Against $B$, $C$ wins. Pure strategies are "local" checks; they compare one row against another. They failed to globalize the risk across the opponent's potential choices.
  **3. Mixed Dominance:** Reveal the math. A 50/50 mix of $A/B$ yields 11 points against any column where $C$ yields a maximum of 8. This is the core lesson: A strategy can be irrational even if no *single* alternative beats it, provided a *probabilistic combination* of alternatives does. $C$ is never a best response to any belief.
  **4. Formal Definition:** Write $\sigma_i$ strictly dominates $s_i$ if $u(\sigma_i, s_{-i}) > u(s_i, s_{-i})$ for all $s_{-i}$. Connect the coin flip to $\sigma_i$. The "mix" isn't about confusing the opponent; it's about constructing a superior payoff vector.
  **5. IESDS Implication:** If we stopped at pure strategies, we'd keep $C$ in the rationalizable set. But $C$ is dominated by a mix. To fully solve games and shrink the rationalizable set to its true size, we must allow mixed strategies in the elimination process. This matters for Nash Equilibrium refinement and understanding why certain strategies are never played in equilibrium.

  **What Goes Wrong**
  **Collusion:** Pairs might agree to play $(A,A)$ every time to get 20/20, bypassing the lesson. **Fix:** Remind them anonymity is key; slips are private. If collusion spikes (e.g., 100% $A$), invalidate that round's points and restart.
  **Arithmetic Skepticism:** Students won't believe the mix payoff applies to them if they play pure. **Fix:** Do the math live on the board. $0.5(20) + 0.5(2) = 11$. Emphasize that dominance is about the *availability* of a better plan, not requiring them to literally flip a coin every time.
  **Risk Aversion:** Students stick to $C$ because it guarantees 8, whereas $A/B$ risks 2. **Fix:** Distinguish between *dominance* (rationality) and *risk management*. In game theory, if a mix strictly dominates, the risk is mathematically irrelevant to rationality.
  **Confusion on Mixing:** They think *they* must randomize to eliminate $C$. **Fix:** Clarify that $C$ is eliminated because a mix *exists* that beats it, not because they must play the mix.

  **What's Missing**
  **Formal Proof:** The activity shows *that* it happens, not *why* mathematically (convexity of payoff space). You must lecture on the geometry of simplices to prove the mix exists.
  **Nash Equilibrium:** This activity focuses on dominance, not stability. You need to connect this to why Nash Equilibrium requires considering mixed strategies (indifference conditions).
  **Continuous Mixes:** We used 50/50. Real dominance might require specific weights (e.g., 0.3/0.7). Lecture must generalize the weights to show $C$ is dominated by *some* $\sigma$, not just this specific one.
  **Infinite Games:** This is finite. Continuous strategy spaces behave differently regarding dominance and elimination order.
