  This is a sharp, provocative handout, but it contains a logical "Fatal Triangle" that students will spot immediately. You have three commitments that cannot simultaneously be true.

  Here is the breakdown of the tensions, ranked by severity, followed by the single revision that resolves the most trouble.

  ### The Tensions (Ranked by Severity)

  #### 1. The Fatal Triangle: Claims (1), (3), and (6)
  **Severity: Critical (Logical Contradiction)**
  *   **The Conflict:** You cannot hold all three of these positions.
      *   (1) says: If Repeated $\rightarrow$ Use Kelly.
      *   (3) says: If One-Shot $\rightarrow$ Use EV.
      *   (6) says: The verdict shouldn't change based on whether we *describe* it as Repeated or One-Shot.
  *   **Why it breaks:** If your rule changes based on the reinvestment structure (1 & 3), then your verdict *does* depend on how the situation is described/categorized (violating 6). If you insist on frame invariance (6), you must use the same rule for both (violating the 1/3 split).
  *   **What gives:** You must either abandon the distinction between one-shot/repeated (drop 3) or abandon frame invariance (drop 6).
  *   **Cost:** Dropping (6) makes your theory look context-dependent (ad hoc). Dropping (3) forces you to defend Kelly/Log for one-shots (controversial).

  #### 2. The Principle Clash: Claims (2) and (3)
  **Severity: High (Theoretical Inconsistency)**
  *   **The Conflict:**
      *   (2) claims Arithmetic/Ensemble averages are "basically a red herring" (General Principle).
      *   (3) claims you should Maximize Expected Value (Arithmetic Mean) for one-shots.
  *   **Why it breaks:** If arithmetic averages are red herrings for compounding processes, why do they become the gold standard the moment reinvestment stops? This makes (2) look like a slogan rather than a principle. It suggests Arithmetic Mean *does* matter, just conditionally.
  *   **What gives:** You need to qualify (2) to say arithmetic averages are red herrings *for growth*, not universally.
  *   **Cost:** Nuance. It weakens the punch of "Geometric Rationality" as a universal worldview.

  #### 3. The Math Trap: Claim (4)
  **Severity: Medium (Factual Vulnerability)**
  *   **The Conflict:** You claim Kelly is the right rule for "maximizing the probability of hitting a fixed target."
  *   **Why it breaks:** This is mathematically false for many horizons and targets. If the target is low/close, Kelly is too volatile (risk of ruin before hitting target). If the target is extremely high, Kelly is often too conservative (bold play is required). Kelly maximizes *asymptotic growth rate*, not *finite-horizon success probability*.
  *   **What gives:** You must qualify (4).
  *   **Cost:** Credibility. A student who knows the "bold play" literature (e.g., Dubins & Savage) will dismantle this point instantly.

  ---

  ### The Single Revision That Cleans Up the Most Trouble

  **Recommendation: Drop Claim (3).**

  **The Revision:**
  Remove the exception for one-shot choices. Instead, argue that **Geometric Rationality (Kelly/Log) applies universally**, because even "one-shot" bets are effectively part of a larger life sequence of decisions where wealth compounds.

  **Why this is the highest-leverage move:**
  1.  **Resolves the Fatal Triangle:** If you always use Kelly (or geometric growth), the verdict no longer shifts based on the "one-shot vs. series" description. Claim (6) is preserved.
  2.  **Unifies the Theory:** It aligns (1), (2), (3), and (5) into a single coherent worldview. You no longer have to explain why Arithmetic Mean is a "red herring" in (2) but the "maximand" in (3).
  3.  **Strengthens the Seminar:** It forces the seminar to debate the *foundations* of utility (why Log?) rather than getting bogged down in the boundary conditions of when to switch rules. It leans into the "Ergodicity Economics" argument that the "one-shot" is often an illusion.

  **The Cost:**
  You lose the "common sense" concession that EV is fine for small, isolated bets. You will have to defend the claim that Log Wealth is the correct objective even for isolated choices (e.g., by arguing that bankruptcy is absorbing, or that life is inherently sequential).

  ### Critical Side-Note on Claim (4)
  While dropping (3) fixes your *logical* consistency, Claim (4) remains a **factual vulnerability**. Even if you adopt "Kelly Everywhere," Kelly does not strictly maximize the probability of hitting a specific fixed target in a finite time.

  **Suggested Tweak for (4):**
  Change "Kelly is the right rule for that too" to:
  > "Kelly is the robust heuristic for target funding, as it minimizes the time to reach ambitious targets while avoiding ruin, though strict probability maximization may require bolder play for short horizons."

  This protects you from the "Bold Play" counter-example while keeping the spirit of your argument.
