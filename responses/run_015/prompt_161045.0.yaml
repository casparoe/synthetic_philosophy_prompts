answer: |-
  **Project Title:** Traceable Lift: Operationalizing the Distinction Between Cranes and Skyhooks

  **Project Summary**
  This four-month project investigates whether the philosophical distinction between "cranes" (legitimate bottom-up mechanisms) and "skyhooks" (illegitimate top-down miracles) can be rescued from the charge of being merely retrospective labeling. The proponent of the distinction argues that good explanations build up from simple parts; the critic argues that "crane" is simply the name we give to any mechanism after we have accepted it. I propose that the distinction gains substantive bite only if we decompose the charge of "greedy reductionism" into three distinct failure modes: level-skipping, capacity shortfall, and borrowed lift. By testing this taxonomy against specific historical case studies, I aim to produce a diagnostic tool for evaluating reductionist claims without resorting to a general metaphysics of levels.

  **The Question**
  The central question is not "Is reductionism true?" nor "Do skyhooks exist?" These are too broad for a semester and invite stale metaphysical deadlock. Instead, the question is: **Does the tripartite taxonomy of greedy reductionism (skipping, shortfall, borrowing) yield verdicts on explanatory practices that diverge from, and improve upon, simple retrospective consensus?**

  If the taxonomy merely recapitulates what scientists already believe (i.e., it labels accepted theories as cranes and rejected ones as skyhooks), it is vacuous. If it labels accepted theories as greedy, it is lethal. If it successfully identifies *why* a contested reduction fails in a way that retrospective consensus cannot, it does philosophical work. The project seeks a determinate answer on the utility of the taxonomy, not a verdict on the research programme of reductionism itself.

  **Background and The Retrospective Objection**
  The original distinction posits that explanations must lift complexity from below without presupposing it. However, a strong retrospective objection argues that this is a tautology: whatever mechanism is eventually found is defined as a crane, and whatever remains unexplained is dismissed as a skyhook. On this reading, the ban on skyhooks is a rule of description, not a constraint on the world. Furthermore, the charge of "greediness" is often wielded as a rhetorical club against reductions the critic antecedently dislikes, without specifying the structural flaw.

  My hypothesis is that the "greedy" charge conflates three separable errors.
  1.  **Level-skipping:** The explanation jumps intervening causal rungs.
  2.  **Capacity shortfall:** The proposed mechanism is real but insufficient to carry the explanatory weight.
  3.  **Borrowed lift:** The reducing vocabulary secretly presupposes the phenomenon it aims to explain.

  If these are distinct, we can identify a reduction as flawed *before* consensus forms, based on structural traceability rather than historical outcome.

  **Methodology and Work Plan**
  The project will proceed over four months, balancing conceptual refinement with case study analysis.

  *Month 1: Formalization.* I will rigorously define the three failure modes. The core constraint is the "Traceability Condition": a crane's lifting capacity must be derivable from its parts without appealing to the *explanandum*. I will draft the logical criteria for each failure mode. *Risk Mitigation:* I will explicitly treat "levels" as pragmatic descriptors of vocabulary and scale, not ontological strata. If the project threatens to devolve into a general metaphysics of levels, I will halt that line of inquiry after two weeks and proceed with the pragmatic definition, noting the limitation.

  *Month 2: Case Study A (Accepted Reduction).* I will analyze a reduction widely considered successful, such as the reduction of Mendelian genetics to molecular biology. The test is falsification: if the taxonomy classifies this successful reduction as "greedy" (due to skipping or borrowing), the taxonomy is too strict (lethal). If it classifies it as a valid crane, I must demonstrate that the taxonomy identifies specific hurdles that were overcome, rather than simply rubber-stamping the success.

  *Month 3: Case Study B (Contested Reduction).* I will analyze a reduction often charged with greediness, such as evolutionary psychological explanations of complex social norms. Here, the goal is to see if the taxonomy isolates the specific failure. Is the objection that the mechanism is missing (skipping), insufficient (shortfall), or circular (borrowing)? If the taxonomy yields a mixed verdict or fails to distinguish the specific complaint from general skepticism, its utility is diminished.

  *Month 4: Synthesis and Stress-Testing.* I will compile the findings into a diagnostic protocol. I will actively attempt to break the taxonomy by seeking counter-examples where the three modes collapse into one another. The final output will be drafted, focusing on the conditions under which the distinction does real work.

  **Case Study Selection Criteria**
  The cases are chosen to risk refuting the hypothesis, not merely illustrate it.
  1.  **The Success Case:** Must be a reduction that faced initial charges of greediness or impossibility but is now accepted. If the taxonomy cannot distinguish the early "apparent skyhook" from the later "confirmed crane" without relying on the fact of its acceptance, the retrospective objection stands.
  2.  **The Contested Case:** Must be a reduction where the mechanism is partially known but the explanatory reach is disputed. This isolates "Capacity Shortfall" from "Level-skipping."

  **Why This Approach?**
  Three alternatives are rejected. First, a general debate on "Is reductionism true?" is too expansive for four months and unlikely to yield novel results. Second, a survey of how the labels have been deployed in the literature would be descriptive rather than normative; it would tell us how the terms are used, not whether they *should* be used. Third, a general metaphysics of levels is a known sinkhole. As noted, I will treat levels functionally. The project is swallowed by the "levels question" if I spend more than 10% of the word count defining what a level *is* rather than how to trace capacity *across* them.

  **Deliverable**
  The primary output is an 8,000-word dissertation chapter. The practical deliverable is a **"Greediness Diagnostic Protocol."** This will be a set of criteria that a researcher or philosopher can apply to a proposed reduction to determine which of the three failure modes (if any) applies. It moves the debate from "This feels reductionist" to "This reduction exhibits Capacity Shortfall because X."

  **Conditions of Failure**
  I anticipate three specific ways this project could fail, all of which will be honestly reported in the conclusion:
  1.  **Collapse:** Investigation reveals that Level-skipping, Capacity Shortfall, and Borrowed Lift are not distinct; they are merely different descriptions of the same underlying logical error.
  2.  **Vacuity:** The "Traceability Condition" turns out to be purely verbal. If any reduction can be relabelled to satisfy traceability by adding enough ad hoc steps, the distinction remains retrospective.
  3.  **Lethality:** The taxonomy is too strict. If every historically successful reduction (including the "Success Case") violates the Traceability Condition at the time of its proposal, then the condition prohibits scientific progress rather than guarding against bad philosophy.

  If any of these obtain, the conclusion will be that the crane/skyhook vocabulary should be retired or radically revised. Confirming the friend's objection is a valid philosophical result, provided it is demonstrated through the rigorous testing of the tripartite taxonomy rather than asserted dogmatically.
