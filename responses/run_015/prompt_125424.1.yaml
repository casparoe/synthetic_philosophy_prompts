answer: |-
  # Defense Preparation Sheet: Counterfactual-Transport Equivalence

  ## Part 1: Opening Concessions (First 5 Minutes)
  *Goal: Disarm the strongest objections by owning them before they are weaponized against you.*

  1.  **On Alignment:** "I want to state upfront that this protocol presupposes a unit-to-unit alignment. I am not solving the alignment problem here; I am treating alignment as a prerequisite condition. If the alignment is vacuous, the transport metric is vacuous. My claim is that *given* a non-trivial alignment, transport is the correct test for mechanistic stability."
  2.  **On Cost:** "I acknowledge that running thirty interventions on every checkpoint is computationally prohibitive for high-frequency deployment. The chapter proposes this as a *audit* protocol for major version shifts (e.g., fine-tuning, distillation), not necessarily for every gradient step. I am open to discussing 'canary interventions'—a subset of the bank—for lighter monitoring."
  3.  **On Metaphysics:** "I am using 'mechanism identity' in a pragmatic, interest-relative sense. I am not claiming to discover a binary, Platonic essence of mechanisms. If 'graded identity' sounds like 'similarity,' I accept that charge, provided we agree that *causal* similarity (transport) is distinct from *structural* similarity (representational geometry)."

  ---

  ## Part 2: The Objections (Ordered by Likelihood & Damage)

  ### 1. The "Basis Artifact" Objection
  *   **Attributed To:** Advisor (Mechanistic Interpretability)
  *   **Vocabulary:** "Basis freedom," "permutation invariance," "activation patching," "rotational equivariance."
  *   **The Objection:** "You're treating grafting failure as evidence of mechanistic divergence. But we know neural representations have basis freedom. If I rotate the subspace of Model A, activation patching into Model B fails, but the computation is identical. Isn't your protocol just measuring alignment quality, not mechanism?"
  *   **Force:** **Real.** If transport fails solely due to basis mismatch, your metric is noise.
  *   **Concession:** Concede that naive coordinate-based patching is basis-sensitive.
  *   **2-Minute Reply:** "That is exactly why the protocol requires *bidirectional* transport and includes representational similarity baselines. If representational similarity is high but transport fails, we suspect basis mismatch. But if transport fails *and* we have aligned functional subspaces (via SAEs or canonical bases), then the computation itself has changed. The protocol isn't just patching coordinates; it's patching *functional roles*. If the role doesn't transport, the mechanism isn't doing the same work, regardless of the basis."
  *   **Weakest Point:** Assumes you can successfully identify "functional subspaces" independently of the transport test itself.

  ### 2. The "Two-Sample Test" Objection
  *   **Attributed To:** Member 3 (Distribution Shift/Deployment)
  *   **The Objection:** "Strip the word 'mechanism' from the chapter. You have a high-dimensional summary statistic (intervention responses) and you are testing for distributional shift between two samples (Reference vs. Successor). Why do I need causal vocabulary? It costs you nothing to just call this a robustness test."
  *   **Force:** **Real.** Threatens the theoretical contribution; reduces chapter to engineering metric.
  *   **Concession:** Concede that statistically, it is a two-sample test over intervention outcomes.
  *   **2-Minute Reply:** "Statistically, yes. But semantically and operationally, no. A standard two-sample test on inputs/outputs detects *behavioral* drift. My test detects *causal* drift. Two models can behave identically on held-out data (passing a standard test) while relying on entirely different heuristics (failing transport). By framing this as mechanism monitoring, I am claiming we care *why* the model succeeded, not just *that* it succeeded. Deleting 'mechanism' deletes the justification for why we intervene rather than just evaluate."
  *   **Weakest Point:** If the behavioral drift correlates perfectly with causal drift in practice, the distinction is academic.

  ### 3. The "Vacuous Alignment" Objection
  *   **Attributed To:** Member 4 (Computational Cognitive Science)
  *   **Vocabulary:** "Isomorphism," "mapping function," "structure preservation," "degrees of freedom."
  *   **The Objection:** "You say transport presupposes alignment. But given enough units and freedom in the mapping function, I can always find a map that preserves structure. If I can tune the alignment to make transport pass, isn't the result vacuous? How do you prevent the alignment step from absorbing all the variance?"
  *   **Force:** **High Damage.** Undermines the validity of the metric entirely.
  *   **Concession:** Concede that over-parameterized alignment can overfit.
  *   **2-Minute Reply:** "We prevent vacuity by pre-registering the alignment strategy and restricting the complexity of the mapping (e.g., linear or sparse maps) *before* seeing the intervention results. The interventions are held out from the alignment process. If the alignment is too flexible, it will fail to generalize to the *negative controls* (interventions known to break the mechanism). The negative controls in the bank are the check against vacuous alignment."
  *   **Weakest Point:** Relies on the negative controls being sufficiently comprehensive to catch all overfitting.

  ### 4. The "Graded Identity" Objection
  *   **Attributed To:** External Examiner (Philosopher of Science)
  *   **Vocabulary:** "Individuation," "ontological commitment," "natural kinds," "binary identity."
  *   **The Objection:** "Identity is binary. Two things are either the same mechanism or they are not. You propose a 'graded' relation. This sounds like you are measuring *similarity* but dressing it up as *identity* to borrow metaphysical weight. Why not just admit this is a similarity metric?"
  *   **Force:** **Medium.** Attacks the framing, not the math.
  *   **Concession:** Concede that 'identity' is perhaps the wrong linguistic label for a continuous metric.
  *   **2-Minute Reply:** "I accept that 'identity' is binary in classical logic. However, in the new-mechanist tradition, mechanisms are individuated relative to explanatory interests. My claim is that 'sameness of mechanism' is interest-relative. For the interest of 'safety monitoring,' we care about the *degree* to which causal powers are preserved. I am not claiming partial ontological identity; I am claiming that the *relation* relevant to our explanatory interest admits of degrees. Call it 'Mechanistic Overlap' if 'Identity' is too loaded."
  *   **Weakest Point:** May still feel like semantic dodging to a strict realist.

  ### 5. The "Deployment Cost" Objection
  *   **Attributed To:** Advisor / Senior Engineers in Room
  *   **Vocabulary:** "Inference latency," "CI/CD pipeline," "compute budget," "throughput."
  *   **The Objection:** "This protocol requires running thirty interventions per checkpoint. In a real pipeline, we iterate daily. This adds unacceptable latency and cost. How is this actionable?"
  *   **Force:** **High.** Makes the work seem impractical.
  *   **Concession:** Concede it is not for every commit.
  *   **2-Minute Reply:** "It is not intended for every commit. It is for 'gate' events: before distillation, before fine-tuning release, before quantization. Think of it as a crash test, not a mileage check. For continuous monitoring, I propose a reduced 'canary' set of 3-5 high-sensitivity interventions derived from the full bank. The chapter establishes the ground truth; deployment optimizes for speed."
  *   **Weakest Point:** Requires validation that the 'canary' set actually predicts full-bank failure.

  ### 6. The "Arbitrary Shift Family" Objection
  *   **Attributed To:** Member 3 (Distribution Shift)
  *   **Vocabulary:** "Prior," "covariate shift," "generalization bound," "held-out distribution."
  *   **The Objection:** "You say transport is measured across a 'specified family of distribution shifts.' But you chose that family. If I choose a different family, my transport score changes. Isn't this just encoding your prior about deployment into the metric?"
  *   **Force:** **Real.** Highlights subjectivity.
  *   **Concession:** Concede the shift family is a design choice, not a discovered fact.
  *   **2-Minute Reply:** "Yes, it encodes a prior. But that is a feature, not a bug. Safety is always relative to a deployment context. By making the shift family explicit and pre-registered, we make the safety claim falsifiable. Current methods hide the prior in the test set selection; my method forces the prior into the definition of the mechanism. It shifts the burden from 'is it safe?' to 'safe for which shifts?'"
  *   **Weakest Point:** Doesn't solve the problem of choosing the *right* shifts, just makes the choice visible.

  ### 7. The "Multiple Realizability" Objection
  *   **Attributed To:** External Examiner (Philosopher of Science)
  *   **Vocabulary:** "Multiple realizability," "functional role," "substrate neutrality."
  *   **The Objection:** "If two systems produce the same phenomenon via different internal structures, new mechanism accounts often call them the same mechanism (functionalism). Your account requires unit-to-unit alignment. Doesn't this rule out multiple realizability by fiat?"
  *   **Force:** **Medium.** Theoretical tension.
  *   **Concession:** Concede the protocol is stricter than pure functionalism.
  *   **2-Minute Reply:** "It does constrain multiple realizability. I argue that for *safety monitoring*, we cannot afford substrate neutrality. If a behavior is realized differently, the *failure modes* will differ under intervention. Two systems might be functionally equivalent on inputs/outputs, but if their internal causal pathways differ, they are not the 'same mechanism' for the purpose of predicting adversarial failure. I prioritize causal stability over functional equivalence."
  *   **Weakest Point:** Conflicts with standard philosophical definitions of mechanism identity.

  ### 8. The "Symmetry" Objection
  *   **Attributed To:** Self-Identified / Member 4
  *   **Vocabulary:** "Subset relation," "asymmetry," "containment."
  *   **The Objection:** "You flag symmetry as unresolved. If a small model's mechanism is a subset of a larger model's, transport might work one way but not the other. Does your metric break here?"
  *   **Force:** **Low/Medium.** You already flagged it.
  *   **Concession:** Concede the metric is directed, not necessarily symmetric.
  *   **2-Minute Reply:** "The metric is explicitly bidirectional to detect this. If Transport(A→B) is high but Transport(B→A) is low, we diagnose 'containment' rather than 'equivalence.' This is useful information. It tells us the larger model has additional machinery. The score should report the minimum of the two directions for 'equivalence,' but report the asymmetry as a diagnostic feature."
  *   **Weakest Point:** Requires a clear threshold for when asymmetry becomes 'different mechanism.'

  ### 9. The "Intervention Specificity" Objection
  *   **Attributed To:** Advisor (Mechanistic Interpretability)
  *   **Vocabulary:** "Off-target effects," "confounding," "causal discovery."
  *   **The Objection:** "Activation patches often have off-target effects. If an intervention fails to transport, how do you know it's because the mechanism changed, and not because the intervention itself is noisy or confounded in the new model?"
  *   **Force:** **Real.** Noise vs. Signal.
  *   **Concession:** Concede interventions are imperfect instruments.
  *   **2-Minute Reply:** "This is why the bank includes positive and negative controls. If an intervention known to be robust in the Reference fails in the Successor, but the negative controls (known to be inert) also behave strangely, we flag the intervention as unstable, not the mechanism. We aggregate over thirty interventions to wash out individual noise. We are looking for systemic transport failure, not single-intervention anomalies."
  *   **Weakest Point:** Aggregation assumes errors are independent; they might be correlated by architecture.

  ### 10. The "Cross-Substrate" Objection
  *   **Attributed To:** Member 4 (Computational Cognitive Science)
  *   **Vocabulary:** "Homology," "analogy," "neural data," "model-brain comparison."
  *   **The Objection:** "If this is about mechanism identity, can I use this to compare a model to a brain? Your alignment requirement seems to preclude cross-substrate comparison."
  *   **Force:** **Low.** Scope creep, but tests generality.
  *   **Concession:** Concede the current protocol is model-to-model.
  *   **2-Minute Reply:** "The principle generalizes, but the alignment step changes. For brains, we align via functional localization rather than unit-to-unit mapping. The core claim—that counterfactual transport is the test of mechanism—holds. But this chapter focuses on the model-family case where unit-alignment is tractable. Extending to brains is future work."
  *   **Weakest Point:** Weakens the claim that this is a general theory of mechanism.

  ---

  ## Part 3: Strategic Assessments

  ### The Single Indispensable Reply
  *If you lose this point, the chapter collapses.*
  **The Point:** **Why Transport > Representation.**
  **The Reply:** "Representational similarity measures (CKA, CCA) measure *geometry*, not *causality*. Two models can have identical geometry but different causal pathways (e.g., redundant circuits). Two models can have different geometry but identical causal pathways (e.g., rotated bases). Behavioral probes measure *outputs*, not *process*. Only intervention transport tests whether the *process* is stable. For safety, we need to know if the *process* is stable, because adversarial attacks target the process, not just the output. If I cannot defend the claim that transport captures safety-relevant causal structure better than representation, the protocol is just a expensive behavioral test."

  ### The "Hope Nobody Asks" Objection
  *The Question:* "If the alignment step fails, your protocol says the mechanisms are different. But if the alignment step is just hard, haven't you just built a test for 'how good is my alignment algorithm' rather than 'are the mechanisms the same'?"
  *Why it hurts:* It makes the chapter about alignment, not mechanism.
  *The Response:* "That is a valid risk. However, alignment is a solvable engineering constraint in this context (e.g., using shared initialization or SAE features). I treat alignment as a *control variable*. If we fix the alignment method across all comparisons, variance in transport scores reflects variance in mechanisms, not variance in alignment quality. The chapter assumes a standardized alignment protocol. If that protocol is insufficient, the metric is conservative (false negatives), not invalid."

  ### Retreat Assessment: Metaphysics vs. Operations
  *Can you retreat to the operational claim without gutting the chapter?*
  **Yes, but with a cost.**
  *   **Survival:** The chapter survives as a proposal for a **Monitoring Protocol**. The math, the intervention bank, and the transport metric remain valid.
  *   **Loss:** You lose the justification for *why* this metric is the "Gold Standard." Without the metaphysical claim ("this is what mechanism identity *is*"), the protocol becomes a heuristic ("this seems to work").
  *   **Strategy:** If pressed hard by the Philosopher or the Skeptic, retreat to: "I am offering a *operationalization* of mechanism stability. Whether this captures the 'true essence' of mechanism is a separate philosophical question. For the purpose of AI safety engineering, this operational definition is sufficient to detect latent failures that behavioral tests miss."
  *   **Warning:** Do not retreat too early. The metaphysical claim gives the chapter its weight. Only retreat if the metaphysical claim is being used to prove the math is wrong (it isn't).

  ---

  ## Part 4: Delivery Notes
  *   **Pacing:** You have 90 minutes. Do not rush the replies. A 2-minute reply is roughly 250-300 words spoken at a moderate pace.
  *   **Tone:** When conceding, be decisive. "You are right that..." is stronger than "I think maybe..."
  *   **Visuals:** If you have a slide for the "Protocol," keep it up during the Q&A. Point to the "Negative Controls" box when answering noise/alignment questions.
  *   **The "Engineer" in the Room:** Remember the room is open to senior engineers. If the Advisor worries about cost, the engineers are thinking it too. Address the cost objection with eye contact to the wider room, not just the committee.
