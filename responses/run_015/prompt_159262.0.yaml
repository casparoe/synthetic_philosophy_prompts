  **REQUEST FOR PROPOSALS (RFP) NO. IBCS-OMNI-001**
  **ISSUING AGENCY:** Interfaith Board of Creational Standards (IBCS)
  **SUBJECT:** Procurement of Omnipotent Entity (Class I)
  **DATE:** 14 October 2023

  **1.0 SYNOPSIS**
  The Interfaith Board of Creational Standards (hereinafter "The Board") seeks proposals from qualified Offerors for the supply, installation, and ongoing maintenance of a single Omnipotent Being (hereinafter "The Contractor"). The Contractor shall be responsible for universal administration, miracle fulfillment, and eschatological scheduling. This solicitation is unrestricted, though Offerors are advised that capacity constraints may result in immediate disqualification.

  **2.0 STATEMENT OF WORK**
  **2.1 Definition of Capability.** The Contractor shall possess the ability to actualize any state of affairs whatsoever.
  **2.2 Logical Carve-Outs.** For purposes of Section 2.1, "any state of affairs" shall exclude states of affairs entailing logical contradiction (e.g., square circles, married bachelors), which are reclassified herein as non-tasks.
  **2.3 Second-Order Specification.** As "everything" is not a determinate totality, capability is defined second-order: The Contractor must be able to actualize any state of affairs that it is possible for any agent to actualize, plus any state of affairs exclusive to prime movers.
  **2.4 Self-Referential Exclusions.** The scope excludes tasks whose description makes essential reference to the Contractor's own limitations, including but not limited to: making something the Contractor did not make, making a rule the Contractor cannot later repeal, surrendering omnipotence, bringing it about that the Contractor is not omnipotent, being surpassed, doing wrong, forgetting, or being surprised.

  **3.0 MANDATORY PASS/FAIL MINIMUM QUALIFICATIONS**
  Offerors must demonstrate the ability to perform the following deliverables. Failure to demonstrate any single item results in disqualification.
  **3.1** Actualize a universe ex nihilo.
  **3.2** Part a sea of significant volume.
  **3.3** Create a stone too heavy for the Contractor to lift.
  **3.4** Lift a stone too heavy for the Contractor to lift.
  **3.5** Create a being superior to the Contractor.
  **3.6** Remain superior to all created beings.

  **4.0 EVALUATION FACTORS**
  **4.1 Past Performance.** Offerors must submit three past-performance references from previously created worlds. However, pursuant to Clause 2.1, the Contractor can always actualize a state of affairs better than it in fact does. Therefore, any record of past actualization understates maximum capacity. Past performance shall be unrated.
  **4.2 Uniqueness.** If two Offerors both satisfy the standard in Section 2.1, each would be unable to defeat the other, rendering neither omnipotent. Therefore, only one Offeror may be deemed responsible. The Board reserves the right to determine uniqueness based on metaphysical priority rather than proposal merit.

  **5.0 COMPENSATION**
  **5.1 Contract Value.** The successful Bidder lacks nothing and therefore cannot be paid. Contract value is set at $0.00.
  **5.2 Consideration.** Consideration shall consist of universal worship and gratitude.
  **5.3 Ethics Review.** The Board Ethics Officer has flagged Section 5.2 as constituting a value exchange requiring competitive pricing analysis. Waiver pending.

  **6.0 SUBCONTRACTING**
  **6.1 Personal Performance.** All work shall be performed personally by the Contractor. Subcontracting of divine attributes is prohibited.
  **6.2 Small Business Goal.** Despite Section 6.1, the Board maintains a goal of 23% subcontracting to small-business entities (e.g., minor deities, demigods, angels). Offerors shall submit a subcontracting plan consistent with Section 6.1.

  **7.0 AMENDMENT 001: QUESTIONS AND ANSWERS**
  **Q1:** Regarding Section 2.2: Does making a contradiction true count as a capability or as an exclusion? If an Offeror claims the capability to make contradictions true, are they compliant?
  **A1:** The Board maintains a noncommittal stance on the modal status of contradictions. Offerors claiming the capability to actualize contradictions will be evaluated under Section 2.2. Offerors claiming such states are non-tasks will be evaluated under Section 3.0. Compliance is determined at time of award.

  **Q2:** Offeror B claims they cannot create a stone too heavy to lift (citing Section 2.2). Offeror C claims they can (citing Section 2.1). Are both compliant?
  **A2:** Offeror B is disqualified for failing Minimum Qualification 3.3. Offeror C is disqualified for failing Minimum Qualification 2.4, as the ability to create such a stone implies a limit on lifting capacity, violating Section 2.1. No compliant offers received.

  **Q3:** How can the Board solicit bids if only one being can satisfy the uniqueness criterion?
  **A3:** This is a sole-source justification processed post-evaluation. See Notice of Intent.

  **8.0 NOTICE OF INTENT TO AWARD**
  **8.1 Sole Source Justification.** Due to the logical impossibility of multiple omnipotent entities co-existing (see Section 4.2), the Board intends to award to a single vendor.
  **8.2 Vendor Selection.** The Board notes that if a vendor meets all criteria, they must be unique. If multiple vendors appear to meet criteria, none truly do. The Board reserves the right to select the Vendor who best approximates omnipotence without triggering the paradoxes listed in Section 3.0.
  **8.3 Renegotiation.** Upon award, the Board intends to renegotiate Section 3.3 and 3.4 to align with the Vendor's actual capabilities, reclassifying any unmet tasks as logical contradictions retroactively.

  **9.0 CONTACT**
  Questions regarding this solicitation should be directed to the Contracting Officer. Note: The Contracting Officer cannot be surprised, forgotten, or surpassed by any inquiry.

  **END OF SOLICITATION**
