answer: |-
  # The Plaque Protocol: A Simulation of Mnemonic Conflict

  **Duration:** 75 minutes
  **Participants:** 14 (6 Keepers, 6 Record Office, 2 Funders)
  **Objective:** To embody the structural friction between lived experience and institutional verification, utilising the concepts of **mnemonic soverignty** and **counter-archival obligation**.

  ## 1. Conceptual Frame (5 Minutes)
  Begin by telling the group this is not a debate about truth, but a negotiation over authority. Introduce two terms they will encounter during the debrief:

  *   **Mnemonic soverignty:** The right of a community to control the narrative of its own past, regardless of whether that narrative fits into official files.
  *   **Counter-archival obligation:** The duty felt by archivists or historians to challenge the silences in the record, even when doing so risks their institutional standing.

  Explain that the game is rigged. The incentives are designed to make agreement painful. This is not a bug; it is the feature.

  ## 2. Roles and Hidden Rules (10 Minutes)
  Split the room. Hand out role packets. Participants must not show their hidden rules to the other camp.

  ### Camp A: The Keepers (6 Participants)
  *   **Public Goal:** Ensure the plaque acknowledges the unofficial strike and the suffering caused by the closure.
  *   **Private Intel (Memory Cards):** Each player holds one fact absent from official records.
      *   *Examples:* "Management locked the gates early to provoke violence," "A protest song was sung daily," "Three families still won't speak the factory's name," "A worker was injured off-site during the picket."
  *   **Incentive:** Gain 1 **Reputation Token** for every clause in the plaque text that references oral testimony or community memory.
  *   **Loss Condition:** If a memory is removed from the draft to satisfy the Record Office, lose 2 Tokens.

  ### Camp B: The Record Office (6 Participants)
  *   **Public Goal:** Ensure the plaque is factually accurate according to held documents and avoids liability.
  *   **Private Intel (The Documents):** They have photocopies of council minutes, police logs, and a trade paper excerpt. All state the closure was due to "insolvency" and the strike was "unofficial/unrecognised." None mention violence or collusion.
  *   **Hidden Rule:** If they concede any claim not supported by a paper document, they lose 3 **Credibility Points** (track publicly on a whiteboard).
  *   **Incentive:** Gain 1 **Reputation Token** for every clause verified by a document.
  *   **Loss Condition:** If undocumented language is used, lose 3 Tokens.

  ### Camp C: The Funders (2 Participants)
  *   **Public Goal:** Release the grant for the plaque.
  *   **Hidden Rule:** You are bored bureaucrats. You do not care about the content. You only care about procedure.
  *   **Constraint:** You will only release the grant if **both** camps sign the exact same wording. You hold the pen. You may not suggest wording, only accept or reject consensus.
  *   **Incentive:** If successful, you get to choose the **Location** of the plaque. If failed, you keep the budget.

  ## 3. The Economy and Payoff (5 Minutes)
  Explain the token economy clearly. This is where the conflict lies.

  *   **Reputation Tokens:** Earned by sticking to your sources (Memory vs. Documents).
  *   **The Agreement Bonus:** If a plaque is agreed upon, both camps receive a **Shared Bonus of 5 Tokens**.
  *   **The Concession Cost:** To reach agreement, one side must concede.
      *   If Keepers remove a memory: They lose 2 Tokens per removal.
      *   If Record Office adds undocumented text: They lose 3 Tokens per addition.
  *   **The Trap:** The Shared Bonus (5) is smaller than the cost of significant concession. Rational self-interest suggests refusing to agree.
  *   **The Prize:** The camp with the most Tokens at the end chooses the **Font** (Serif = Traditional, Sans-Serif = Modern). The Funders (if successful) choose the **Location** (Town Centre = Visible, Museum Basement = Preserved).

  ## 4. The Deliberation (35 Minutes)
  *   **Minutes 0–10:** Camps meet separately to draft their ideal wording based on their intel.
  *   **Minutes 10–30:** Open negotiation. The Funders sit between them. Drafting happens on a single sheet of paper.
  *   **Minutes 30–35:** Final signing. If both camps sign, the Funders approve. If not, the grant is withdrawn.

  *Facilitator Note:* Do not intervene. If they stall, remind them of the clock. If they ask for a ruling, say: "Consult your sources."

  ## 5. The Debrief (20 Minutes)
  Stop the game exactly on time. Count tokens. Announce the winners (Font/Location). Then, shift to the philosophical mapping.

  **Phase 1: The Autopsy (5 Minutes)**
  *   Did you agree? If not, why? (Likely answer: The math didn't work.)
  *   If you did agree, who folded? (Likely answer: The Keepers, because 'credibility loss' feels heavier than 'memory loss'.)
  *   How did the Funders feel? (Likely answer: Powerless despite holding the money, or annoyed by the emotion.)

  **Phase 2: Mapping to Theory (10 Minutes)**
  Use the outcomes to explain the conceptual machinery without jargon overload.
  *   **On Mnemonic soverignty:** Ask the Keepers: "Did you feel you owned your story?" If they conceded, their mnemonic soverignty was breached by the token economy. The game simulated how funding structures often force communities to sanitise their pain to fit grant criteria.
  *   **On Counter-archival obligation:** Ask the Record Office: "Did you want to include the truth?" If they didn't, it's because the 'Credibility Points' punished them for ethical bravery. This mirrors how archivists are often penalised professionally for cataloguing oral histories that contradict official logs.
  *   **The Structural Violence:** Highlight the payoff scheme. The reason they couldn't agree wasn't because they are unreasonable people, but because the *system* rewarded conflict over truth. This is the core of the archive/memory conflict: it is not a clash of facts, but a clash of incentives.

  **Phase 3: The Verdict (5 Minutes)**
  Ask the room: "When collective memory and the record conflict, which should give way?"
  *   If they say Memory: How do we prevent myth-making?
  *   If they say Record: How do we account for the silences (the undocumented strike)?
  *   Conclude that the 'correct' answer is usually to expose the conflict on the plaque itself, rather than smoothing it over.

  ## 6. Predictions and Limitations

  ### What Will Predictably Go Wrong
  1.  **The Record Office Will Win:** In my experience, undergrads and volunteers are socially conditioned to respect 'documents' over 'stories'. The Record Office players will likely frame their constraints as 'rules' and the Keepers' constraints as 'opinions'. The Keepers will fold to avoid looking irrational.
  2.  **The Funders Will Disengage:** Without specific instructions to be difficult, the Funders may try to help bridge the gap. Remind them beforehand that their neutrality is their only power.
  3.  **Token Fixation:** Players may start haggling over tokens rather than words. This is actually useful—it reveals how bureaucracies commodify memory. Let them haggle.

  ### What This Activity Cannot Reproduce
  You must supply these elements verbally in the debrief, as the game mechanics are too clean to capture them:

  1.  **The Weight of Being Disbelieved:** In the game, losing a token is annoying. In reality, having your grandmother's story dismissed as 'unverified' is a form of violence. The game gamifies pain; it cannot simulate the generational trauma of erasure. You must articulate that the Keepers' frustration is a pale shadow of the actual community's grief.
  2.  **Temporal Depth:** The game lasts 35 minutes. Real memory transmission happens over decades. The 'Keepers' in the game are peers; in reality, the Keepers are often elders speaking to strangers. You cannot simulate the authority of age or the urgency of dying witnesses in this timeframe.
  3.  **The Risk of Liability:** The Record Office loses 'points'. In reality, they risk lawsuits, funding cuts, or unemployment. The stakes here are safe. You must remind them that the 'Credibility Points' represent career risk, which is why institutions are so risk-averse.

  ### Facilitator's Note on 'Mnemonic soverignty'
  When using the term **mnemonic soverignty** (keep the spelling as noted in your brief), emphasise that it is not just about remembering, but about *power*. Who has the right to decide what is remembered? The game shows that without structural change (changing the token economy), mnemonic soverignty is impossible to maintain against an institutional archive.

  ### Facilitator's Note on 'Counter-archival obligation'
  Use this to validate the Record Office players who felt stuck. Their obligation was to the truth, but their incentive was to the file. This tension is where the ethical work lies. If no one felt this tension, the game was too easy.

  ## 7. Materials Checklist
  *   **Name badges:** Keepers, Record Office, Funders.
  *   **Memory Cards:** 6 cards with specific undocumented details.
  *   **Document Pack:** 6 copies of fabricated council minutes/police logs (ensure they contradict the Memory Cards).
  *   **Token Counters:** 30 chips or coins.
  *   **Whiteboard:** To track Record Office Credibility Points publicly.
  *   **Drafting Paper:** One large sheet for the final plaque text.
  *   **Timer:** Visible to all.

  ## 8. Closing Statement
  End the session by acknowledging the frustration. If they leave feeling that the system was rigged against honesty, the workshop has succeeded. The goal was not to resolve the conflict, but to feel the shape of it. The plaque is never neutral; neither is the archive. The only ethical move is to acknowledge the gap.
