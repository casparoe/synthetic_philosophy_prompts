      *   *Asymmetry with Conditionalization:*
          *   Money Pump (Preferences): Exploits $A \succ B \succ C \succ A$. The *content* of the preference is the problem.
          *   Dutch Book (Credences): Exploits $P(H) \neq P(H|E)P(E)$. The *update rule* is the problem.
          *   *Key Difference:* In Money Pump, the bookie offers trades based on your *current* holdings. In Dutch Book, the bookie offers bets based on your *announced* credences.
