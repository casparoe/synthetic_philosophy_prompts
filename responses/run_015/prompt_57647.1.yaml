          *   *Challenge:* The Diachronic Dutch Book (DDb) against non-conditionalization requires a sequence of bets. The Synchronic Dutch Book (against probabilism) requires a set of bets at one time.
          *   *Is the move licensed?* Only if we accept **Dynamic Consistency** as a rational requirement. If you aren't required to be dynamically consistent, the diachronic loss doesn't reflect badly on your synchronic state.
          *   *Asymmetry:* Credences aim at *truth*. Preferences aim at *goodness*. A Dutch book shows you are guaranteed to lose money (instrumental failure). A Money Pump shows you are guaranteed to lose money (instrumental failure).
          *   *The specific asymmetry asked:* Bookmaker's offers keyed to announced credences vs trade partner's offers.
          *   *Answer:* In DDb, the bookie offers a bet *after* you learn $E$, based on what your credence *was* at $t_0$. This requires the bookie to know your update rule or your $t_0$ conditional credence. In Money Pump, the bookie just offers the next item in the cycle. The Money Pump is more robust because it doesn't require the bookie to know your internal update rule, just your choice behavior. However, the Money Pump requires the bookie to know your *ranking*. Both require foreseeability.
          *   *Core License:* The license is the principle that **Rationality is instrumental efficiency**. If your mental state guarantees loss in a possible world, it's defective.

