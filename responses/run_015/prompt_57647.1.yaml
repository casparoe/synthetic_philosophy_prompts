      *   *Counter:* Rationality is about how you function across *possible* environments, not just the actual one. If your engine explodes at 5000 RPM, the engine is defective, even if you only drive on highways where you stay at 4000 RPM.
      *   *The Self-Control Assumption:* The pump assumes you *can* stop. If you *can't* stop (compulsion), then it's not a rationality critique, it's a freedom critique.
      *   *Version without Self-Control:* **The Dominance Argument.**
          *   Compare the agent with cyclic preferences to an agent with transitive preferences.
          *   In *every* possible sequence of trades, the transitive agent does at least as well, and in some (the pump sequence), strictly better.
          *   Therefore, having transitive preferences **dominates** having cyclic preferences.
          *   This doesn't rely on the agent's ability to resist temptation in the moment (self-control); it relies on the structural properties of the preference relation itself. It treats preferences as *dispositions to choose*. If the disposition is self-undermining, it's irrational.
      *   *Another Angle:* **State-Dependence.** If preferences are defined over "holding X" vs "holding Y", maybe $C_{hold} \succ A_{hold}$ but $A_{trade} \succ C_{trade}$. Then it's not a cycle. But if we define preferences over final states, the cycle remains. The argument forces you to define preferences over the right objects.

