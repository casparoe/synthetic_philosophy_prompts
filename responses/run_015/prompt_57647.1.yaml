      *   *Hammond/Consequentialism:* Hammond argues rational choice should depend only on the set of available final outcomes, not the tree structure.
          *   Available final outcomes from Start: $\{C, (B, -\epsilon), (A, -2\epsilon), (C, -3\epsilon)\}$.
