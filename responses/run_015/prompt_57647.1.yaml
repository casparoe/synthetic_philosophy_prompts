              *   Which is better? If $B \succ C$ and $\epsilon$ is small, Sophisticate wins ($B-\epsilon \succ C$).
              *   But what if the pump is structured such that *any* trade triggers the loop?
              *   *Better Example:* The "Procrastination" or "Precommitment" case.
