answer: |-
  Here is the translation of Popper's demarcation criterion into the vocabulary of current methodological reform, followed by the residue report.

  ### The Institutional Restatement

  In Popper's original framing, science is distinguished from pseudoscience by the logical structure of its claims: a scientific theory must forbid certain states of affairs. If the theory allows for every possible outcome, it is not science.

  Translated into the vocabulary of preregistration, registered reports, and replication markets, demarcation is not about the logical structure of a theory, but about the **binding nature of the commitment device** used to test it.

  **Science** is a research workflow where the researcher surrenders their degrees of freedom before accessing the data. It is a system where the analysis plan is time-stamped (preregistered) and peer-reviewed prior to data collection (Registered Report Stage 1). In this system, a "risky prediction" is operationalized as a specific statistical test with a defined effect size and power analysis. The "falsification" mechanism is the willingness to publish and credit null results when the data violates the preregistered plan. The scientific status of a claim is determined by its performance in a replication market: if independent teams cannot recover the effect using the same binding protocol, the claim's value depreciates to zero. A flat p-curve across a body of literature indicates that the "findings" are artifacts of selection bias rather than evidential value.

  **Pseudoscience**, in this vocabulary, is a workflow characterized by unlimited researcher discretion. It is a system where the hypothesis is flexible enough to accommodate any data outcome through post-hoc rationalization (HARKing). It relies on p-hacking to navigate the garden of forking paths until a significant result appears. Pseudoscience avoids binding commitments; it does not use preregistration because doing so would prevent the necessary analytical flexibility required to produce a positive result. In a replication market, pseudoscientific claims are high-risk assets with unquantifiable error rates because the original "bet" was placed after the race was run.

  Therefore, the demarcation line is not between "true" and "false" theories, but between **transparent error-correction mechanisms** and **opaque error-concealment mechanisms**. Science is an institution that makes it costly to hide error; pseudoscience is an institution that makes it profitable to hide error.

  ***

  ### The Residue Report

  When you run Popper's logic through the filter of institutional reform, here is what remains, what breaks, and what vanishes.

  **What Survives Intact**
  The core normative intuition survives: the asymmetry of testing. The reform movement agrees with Popper that finding evidence *for* a claim is cheap and easy (you can always find a p < .05 if you look hard enough), while finding evidence *against* a claim is hard and requires structural protection. The idea that "risk" is the essential ingredient of scientific inquiry translates perfectly into the concept of "binding commitments." If you can change your analysis plan after seeing the data, you haven't taken a risk, and therefore you haven't done science.

  **What Gets Distorted**
  The mechanism of "falsification" gets significantly distorted. For Popper, falsification was a logical sledgehammer: one robust counter-example kills a theory. In the institutional vocabulary, falsification is a slow erosion of credibility. A single null result in a preregistered replication rarely kills a theory immediately; instead, it lowers the claim's value in the replication market. We rely on meta-analyses and p-curve analysis to detect the signal, rather than a single decisive experiment. The binary "scientific/pseudoscientific" switch becomes a continuous slider of "methodological rigor." We don't say a field is pseudoscience; we say it has a high false-positive rate and low replicability.

  **What Disappears Entirely**
  Two major things vanish. First, the **individual heroism of the theorist**. Popper imagined a bold scientist making a daring conjecture. The institutional view removes the individual from the equation; it doesn't matter how bold the hypothesis is if the workflow allows for p-hacking. A boring hypothesis tested via a Registered Report is more "scientific" than a bold one tested via exploratory analysis.

  Second, the **logical purity of the boundary**. Popper wanted a clean, philosophical line. The institutional vocabulary reveals that the line is sociological and economic. Demarcation is enforced by editors, funding agencies, and reward structures, not by logic.

  ### The Verdict: Vocabulary Failure or Blurry Line?

  The missing elements are not a failure of our current research-institution vocabulary. They are evidence that Popper's line was always blurrier than he admitted.

  Popper treated science as a logic game played by individuals. He assumed that if a theory was falsifiable, the community would naturally falsify it when it was wrong. The STS and reform perspective shows that logical falsifiability is necessary but insufficient. A theory can be logically falsifiable but institutionally unfalsifiable (e.g., if the field refuses to publish null results or punishes those who attempt replications).

  The "residue" that disappears—the clean logical boundary—was a philosophical fiction. The institutional vocabulary captures the reality that demarcation is a **managed achievement**, not a discovered property. It requires active labor to maintain the boundary through peer review, data sharing, and incentive realignment.

  So, the blur wasn't a failure of Popper's description; it was a failure of his prescription. He thought logic would police the boundary. We now know that only institutions can do that. The fact that our vocabulary focuses on process (preregistration, replication) rather than product (theories, laws) suggests we have moved past the idea that science is defined by what it *knows*, and now define it by how it *behaves*.
