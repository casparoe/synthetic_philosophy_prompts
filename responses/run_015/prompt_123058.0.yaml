  2.  **Deconstruct Popper's Demarcation (Falsifiability):**
      *   *Core Idea:* Science makes risky predictions that could be proven wrong. Pseudoscience explains everything after the fact (ad hoc adjustments).
      *   *Mechanism:* Conjecture $\rightarrow$ Deduction of testable implication $\rightarrow$ Empirical test $\rightarrow$ Potential refutation.
      *   *Normative Goal:* Protect science from dogma/ideology masquerading as empirical truth.
      *   *Key Feature:* Asymmetry (verification is easy/weak, falsification is hard/strong).

  3.  **Translate to Institutional/Reform Vocabulary:**
      *   *Conjecture/Hypothesis:* Preregistered hypothesis.
      *   *Risky Prediction:* A specific analysis plan defined before data access (Registered Report Stage 1).
      *   *Ad hoc adjustments:* P-hacking, HARKing (Hypothesizing After Results are Known), selective reporting.
      *   *Falsification/Refutation:* A null result that survives a high-powered replication attempt or a p-curve showing no evidential value.
      *   *Pseudoscience:* Research practices that avoid binding commitments to specific outcomes, allowing infinite flexibility in analysis to ensure positive results.
      *   *Science:* A system of commitments where the cost of being wrong is lower than the cost of hiding error.

      *Drafting the Translation:*
      Instead of "falsifiability," think "binding commitments." Popper's scientist is someone who locks their analysis plan in a preregistration before seeing the data. The "risky prediction" is the specific statistical test specified in Stage 1 of a Registered Report. If the data comes back null, the hypothesis is "falsified" (or at least the claim is unsupported).
      Pseudoscience, then, isn't just "wrong ideas"; it's a *workflow* that avoids binding commitments. It's research that relies on post-hoc rationalization. It's a p-curve that is right-skewed only because of selection bias, not evidential value. It's a field where replication markets assign low value to the claims because the error rate is unquantifiable.
      So, demarcation isn't about the *content* of the theory, but the *transparency of the error-correction mechanism*. Science is a market where you stake reputation on a preregistered claim. Pseudoscience is a market where you can retroactively change the bet after the race is run.

