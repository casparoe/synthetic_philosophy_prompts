answer: |-
  **TO:** Neighborhood Tech-Oversight Board
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on "Preference Mirror" Pilot Program

  **Recommendation**
  I recommend we **approve a 90-day pilot** of the Preference Mirror system, restricted to **Zone 4 only**, with three binding guardrails regarding how the data may be used. We should not reject the tool outright, but we cannot accept the city's current proposal without modifications that address the philosophical risks involved.

  **The Core Tension**
  The proponents of this system are right about one thing: traditional surveys are broken. When residents say they want "green space" but consistently drive to big-box stores, relying solely on stated preferences leads to underused parks and frustrated budgets. Inverse reinforcement learning offers a way to see the constraints people face, not just the ideals they claim. Ignoring this data source would be sticking our heads in the sand regarding how modern planning actually works.

  However, the opposition's strongest argument is not about privacy; it is about **identity**. They argue that a "counterfactual preference profile" measures an imaginary person. Our preferences are not buried treasure waiting to be dug up; they are formed *through* our interactions with ads, stress, and community. If you strip away the commute stress and the advertising, you aren't left with the "true" resident; you are left with a phantom who doesn't exist in the real world.

  If we redesign neighborhoods for this "un-nudged self," we risk building infrastructure for a theoretical citizen while neglecting the actual human who still has to deal with the ads and the stress. We could end up with beautiful green spaces that no one has time to use because we solved for a preference that only exists in a vacuum. This is paternalism disguised as data science: the algorithm decides what you *would* want if you were smarter or less stressed, and then builds for that version of you instead of the real you.

  **Proposed Guardrails**
  To move forward without falling into the "phantom citizen" trap, the 90-day pilot must include:

  1.  **The "Real-World Validation" Clause:** The shadow profiles cannot be used for capital investment unless validated by a follow-up survey shown *to the residents*. Residents must see their own counterfactual profile (e.g., "The system thinks you want slower streets") and confirm or deny it. If the algorithm's "true self" conflicts with the resident's actual stated will, the resident's word overrides the model.
  2.  **Transparency on the "Correction Factor":** The city must disclose how much the shadow profile diverges from observed behavior. If the system is consistently rewriting 40% of resident preferences, the model is too aggressive and assumes too much about what constitutes a "nudge" versus a genuine choice.
  3.  **No Binding Policy Changes:** During the 90 days, data can inform discussion but cannot trigger automatic zoning or budget changes. This period is to test the *accuracy* of the counterfactual claim, not to implement it.

  **Conclusion**
  We should not ban the technology, but we must reject the idea that the algorithm knows us better than we know ourselves. By treating the shadow profile as a hypothesis to be tested by residents—not a truth to be implemented by planners—we can gain the benefits of better data without serving an imaginary constituency.

  Let's vote to pilot, but let's vote to keep the final say in human hands.
