prompt: |-
  My policy workshop has two people who've been going at it for a year over refugees and asylum, and I'm the one who has to make them produce a joint document instead of another round of position papers. Camp A thinks a state's duties to outsiders are basically remedial and bounded: obligations kick in from that state's own causal role in the displacement, plus a fair-share duty of rescue that gets capped by what it can absorb without failing its own people. Camp B thinks the claims of someone fleeing serious harm don't get weaker because of where they were born, so membership is at best an administrative fact about who can be charged with helping, not a moral one.

  Give me the document they should sign. First a numbered list of claims both can actually accept — substantive ones, not "everyone has dignity." I want them to say something real about whether the refugee/economic-migrant line tracks anything they both care about, and I want them to deal with a case neither of them has a clean answer to: people whose government or economy is slowly dismantling the conditions of a livable life — creeping land dispossession, aquifer collapse, wether or not you want to call it climate — so that nothing pinpointable has happened to them yet, but they obviously can't stay. Call them foreclosure claimants if you need a label. Then a table of the remaining disagreements, each row worded so the side holding it would sign it as stated. One row should be about the thing I think is actually the fight: whether you can settle who counts as a refugee first and then argue separately about who has to take them, or whether those are the same question asked twice. Then the cruxes, and for each one the case, argument, or pattern of evidence both would accept as bearing on it, with each camp's prediction written down. Make one crux about duty transfer — whether a state discharges its share by paying for resettlement somewhere else rather than admitting anyone. And if you think some slice of their dispute is verbal, say which slice and why.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A policy workshop with two entrenched participants (Camp A and Camp B) arguing over refugees/asylum for a year.
      *   **Goal:** Produce a *joint document* (not just position papers) that forces convergence where possible and clarifies divergence where necessary.
      *   **Camp A Position:** Remedial/Bounded. Duties arise from causal role + fair-share rescue, capped by absorption capacity/domestic priority.
      *   **Camp B Position:** Universal/Needs-based. Claims don't weaken based on birthplace; membership is administrative, not moral.
      *   **Required Components:**
          1.  Numbered list of shared substantive claims (must be real, not platitudes).
          2.  Address the Refugee vs. Economic Migrant line (does it track anything they both care about?).
          3.  Address the "Foreclosure Claimants" case (slow dismantling of livability, e.g., climate/ecological collapse, no single pinpointable event).
          4.  Table of Remaining Disagreements (worded so each side signs their row).
          5.  One specific row on the "Core Fight": Status determination vs. Responsibility allocation (are they separate or the same question?).
          6.  Cruxes Section: For each crux, identify the case/argument/evidence both accept as relevant, plus each camp's prediction.
          7.  One Crux on Duty Transfer (paying for resettlement elsewhere vs. admitting).
          8.  Identify any verbal disputes (if applicable).

  2.  **Deconstruct the Camps:**
      *   *Camp A (Remedial/Bounded):* Focus on sovereignty, capacity, specific causality. "We owe help because we helped break it, or because it's our turn, but not if it breaks us."
      *   *Camp B (Universal/Needs-based):* Focus on human rights, moral equality. "Suffering matters, borders don't. If you can help, you should, regardless of who caused it."
      *   *Overlap:* Both likely agree that *some* people need help, that *some* states should help, that chaos is bad, and that unmanaged flows hurt everyone.
      *   *Tension:* The basis of the obligation (causality/fair share vs. need) and the limits (capacity vs. moral imperative).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound official but neutral. "Framework for Joint Action on Displacement and Protection."

      *   **Section 1: Shared Substantive Claims:**
          *   Need to avoid "human dignity."
          *   Need to address the Refugee/Economic line. Both camps usually agree that *persecution* creates a stronger claim than *seeking better wages*, but for different reasons. Camp A sees persecution as a specific harm (remedial); Camp B sees it as a threshold of urgency.
          *   Need to address "Foreclosure Claimants." This is the hard case. Both agree these people can't stay. The agreement is on the *fact* of displacement, not necessarily the *label*.
          *   *Drafting ideas:*
              1.  Non-refoulement (don't send back to death) is a baseline.
              2.  The distinction between fleeing targeted harm vs. general poverty matters for *processing*, even if the moral urgency overlaps.
              3.  Foreclosure claimants constitute a protection gap that current law misses.
              4.  Uncoordinated unilateralism makes the problem worse for everyone (including Camp A's capacity concerns).

      *   **Section 2: The Refugee/Economic Migrant Line:**
          *   Camp A likes this line (limits liability). Camp B dislikes it (arbitrary).
          *   *Compromise:* The line tracks *urgency and returnability*. Economic migrants can theoretically return if conditions improve; refugees/foreclosure claimants cannot. Both care about this distinction for policy design, even if moral foundations differ.

      *   **Section 3: Foreclosure Claimants:**
          *   Acknowledge they exist. Acknowledge they need status. Acknowledge current law fails them.

      *   **Section 4: Table of Disagreements:**
          *   Must be worded so the holder agrees.
          *   *Row 1 (The Core Fight):* Separation of Status vs. Responsibility. Camp A says "Decide who is a refugee, then decide who takes them." Camp B says "Who takes them defines who counts."
          *   *Row 2 (Capacity):* Camp A says "Capacity is a hard moral limit." Camp B says "Capacity is a logistical constraint to be expanded, not a moral veto."
          *   *Row 3 (Causality):* Camp A says "Historical causality increases obligation." Camp B says "Causality is irrelevant to the victim's need."

      *   **Section 5: Cruxes (Evidence & Predictions):**
          *   Need specific tests.
          *   *Crux 1: Duty Transfer (Money vs. People).* Camp A says "Funding host nations nearby is sufficient." Camp B says "Resettlement is required for full discharge." Evidence: Stability of funded regions vs. integration outcomes.
          *   *Crux 2: The "Pull Factor" Empirical Claim.* Camp A says "Generous asylum invites dangerous flows." Camp B says "Flows are driven by push factors; policy changes volume little." Evidence: Migration flow data relative to policy shifts.
          *   *Crux 3: Social Trust/Cohesion.* Camp A says "Rapid intake lowers domestic support for welfare." Camp B says "Diversity stabilizes long-term demographics." Evidence: Longitudinal social cohesion metrics.

      *   **Section 6: Verbal Disputes:**
          *   Is there one? Yes, likely around the word "Right." Camp A sees it as a claim against a specific agent; Camp B sees it as a claim against the world. Also "Refugee" (legal status vs. moral category).

  4.  **Refining and Polishing:**
      *   *Tone:* Bureaucratic but sharp. No fluff.
      *   *Constraint Check:* Did I address the "Foreclosure Claimants"? Yes. Did I address the "Refugee/Economic" line? Yes. Is there a table? Yes. Are the cruxes specific with predictions? Yes.
      *   *Self-Correction on "Shared Claims":* Make sure they aren't too vague. Instead of "We should help," say "Current international law creates a protection gap for Foreclosure Claimants that requires a new administrative category."
      *   *Self-Correction on "Core Fight":* Ensure the distinction between *status determination* and *responsibility allocation* is clear. This is the "Who counts" vs. "Who pays" debate.

  5.  **Final Review against Prompt:**
      *   Numbered list of claims? Yes.
      *   Refugee/Economic line addressed? Yes.
      *   Foreclosure Claimants addressed? Yes.
      *   Table of disagreements? Yes.
      *   Row on Status vs. Responsibility? Yes.
      *   Cruxes with evidence/predictions? Yes.
      *   Crux on Duty Transfer? Yes.
      *   Verbal dispute identified? Yes.

  6.  **Final Polish:** (Writing the output in the voice of a neutral facilitator drafting the text for them to sign.) *Ensure the language is precise enough that neither side feels betrayed but specific enough to be useful.* (e.g., using "Foreclosure Claimants" as the agreed term).

  *(Self-Correction during drafting)*: Make sure Camp B doesn't look like they capitulated on the "moral equality" point in the shared section. Frame it as "operational agreement" rather than "moral agreement." Camp A needs to feel their capacity constraints are acknowledged as real, not just excuses.

  *(Refining the Core Fight Row)*: Camp A: "Status is prior to allocation." Camp B: "Allocation is constitutive of status."

  *(Refining Duty Transfer)*: Camp A: "Financial substitution is valid." Camp B: "Physical resettlement is required for full discharge."

