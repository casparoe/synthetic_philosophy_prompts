answer: |-
  **WORKSHOP DRAFT: FRAMEWORK FOR JOINT ACTION ON DISPLACEMENT AND PROTECTION**

  **To:** Workshop Principals (Camp A, Camp B)
  **From:** Facilitation Secretariat
  **Subject:** Agreed Basis for Policy Development
  **Status:** For Signature

  ### I. SUBSTANTIVE CLAIMS OF SHARED CONCERN
  *Both parties affirm the following operational premises as the basis for drafting policy, regardless of divergent moral foundations.*

  1.  **The Protection Gap:** Current international legal frameworks (specifically the 1951 Convention) fail to adequately categorize or protect "Foreclosure Claimants" (persons facing slow-onset dismantling of livability, e.g., aquifer collapse, ecological degradation, or economic strangulation where no single persecutor exists). Both parties agree this category requires a distinct administrative status to prevent statelessness and unmanaged irregular movement.
  2.  **The Utility of the Refugee/Economic Line:** While the moral weight of the line is disputed, both parties agree the distinction between *forced displacement* (refugee/foreclosure) and *voluntary migration* (economic) tracks a functional difference in **returnability**. Economic migrants can theoretically return if conditions improve; Foreclosure Claimants and Convention Refugees cannot. Policy must prioritize the latter for permanent protection pathways to avoid futile repatriation cycles.
  3.  **Systemic Stability:** Uncoordinated unilateral admission policies by high-capacity states undermine the stability of transit states and increase the prevalence of smuggling networks. Both parties agree that a mechanism for burden-sharing is required to maintain the integrity of the asylum system, even if they disagree on the metric of "fairness."
  4.  **Non-Refoulement Baseline:** No policy proposal shall recommend the return of individuals to jurisdictions where there is a verified, high-probability risk of death or torture, regardless of the legal pathway by which they arrived.
  5.  **Foreclosure Threshold:** For Foreclosure Claimants, the threshold for protection is not "immediate threat to life" (as in emergency rescue) but "irreversible loss of subsistence capacity." Both parties agree that waiting for immediate threat results in higher humanitarian costs and higher integration difficulties later.

  ### II. TABLE OF REMAINING DISAGREEMENTS
  *The following positions remain unresolved. Each row is worded such that the holder of the position affirms it as an accurate statement of their view.*

  | ID | Core Disagreement | Camp A Position (Remedial/Bounded) | Camp B Position (Universal/Needs-Based) |
  | :--- | :--- | :--- | :--- |
  | **1.0** | **The Core Fight: Status vs. Responsibility** | **Status is prior to allocation.** We must first agree on *who* counts as a protected person based on objective criteria. Only after status is determined do we argue about *which* state bears the cost. Conflating the two allows states to manipulate definitions to avoid duty. | **Allocation is constitutive of status.** A claim cannot be validated in the abstract. "Who counts" is inseparable from "who helps." A definition of refugeehood that assigns responsibility to no one is morally void. We must negotiate responsibility quotas *before* finalizing status definitions. |
  | **2.0** | **The Limit of Obligation** | **Capacity is a moral veto.** A state's duty to outsiders is bounded by its duty to maintain the social contract with its own citizens. If absorption threatens domestic welfare stability or political cohesion, the obligation ceases or pauses. | **Capacity is a logistical constraint.** Domestic stability is a variable to be managed, not a hard limit on moral duty. If needs exceed current capacity, the obligation is to expand capacity (housing, infrastructure), not to reject claims. |
  | **3.0** | **Causality and Liability** | **Causality increases liability.** States that contributed to the destabilization (via foreign policy, carbon emissions, or trade deals) bear a higher remedial burden than neutral states. | **Causality is irrelevant to the victim.** The claimant's right to safety does not fluctuate based on the historical guilt of the host state. Need creates the claim; capacity creates the duty. |

  ### III. CRUXES AND EVIDENTIARY STANDARDS
  *For each unresolved crux, both parties agree to accept the following cases, arguments, or patterns of evidence as bearing on the dispute. Each camp's prediction is recorded below.*

  **Crux A: Duty Transfer (Resettlement vs. Financial Substitution)**
  *   **The Question:** Can a state discharge its obligation entirely by funding protection in a region of origin (e.g., supporting camps in neighboring countries), or does full discharge require physical resettlement within the donor state?
  *   **Accepted Evidence:** Longitudinal data on (1) safety and rights outcomes for refugees in funded regional hubs vs. resettled refugees; (2) duration of displacement in funded hubs (temporary vs. permanent limbo).
  *   **Camp A Prediction:** Financial substitution is sufficient. Refugees prefer proximity to home, and regional funding saves more lives per dollar. Resettlement is a niche tool, not a systemic requirement.
  *   **Camp B Prediction:** Financial substitution is insufficient. Regional hubs routinely violate rights and create permanent dependency without citizenship pathways. Physical resettlement is the only metric of full duty discharge.

  **Crux B: The "Pull Factor" Empirical Claim**
  *   **The Question:** Does expanding legal asylum pathways and integration benefits significantly increase dangerous irregular migration flows, or are flows driven primarily by push factors?
  *   **Accepted Evidence:** Comparative migration flow data across OECD states before and after significant policy liberalizations or restrictions, controlling for conflict intensity in origin regions.
  *   **Camp A Prediction:** Generous policies act as a magnet. Liberalization increases irregular flows because it raises the expected value of the journey, empowering smuggling networks.
  *   **Camp B Prediction:** Policies have marginal impact on volume. Flows correlate with conflict intensity and environmental collapse. Restrictive policies merely divert routes and increase mortality without reducing total numbers.

  **Crux C: Social Trust and Cohesion**
  *   **The Question:** Does rapid demographic change via asylum intake degrade the domestic political will required to sustain a welfare state?
  *   **Accepted Evidence:** Longitudinal studies on welfare spending levels, voting patterns on redistribution, and social trust metrics in high-intake vs. low-intake municipalities over 10+ year periods.
  *   **Camp A Prediction:** Rapid intake erodes trust. Heterogeneity lowers support for redistribution, eventually harming the poor (including migrants) by collapsing the welfare consensus.
  *   **Camp B Prediction:** Diversity stabilizes demographics. Aging populations require intake to sustain welfare ratios. Initial friction is manageable; long-term cohesion depends on inclusion, not exclusion.

  ### IV. NOTE ON VERBAL DISPUTES
  *The Facilitation Secretariat identifies the following slice of the dispute as potentially verbal, requiring semantic clarification before substantive resolution.*

  **The Definition of "Right"**
  *   **Diagnosis:** Camp A uses "Right" to mean *a claim enforceable against a specific agent* (e.g., "I have a right against State X because State X harmed me"). Camp B uses "Right" to mean *a moral status that demands satisfaction from any capable agent* (e.g., "I have a right to safety, and whoever can help must").
  *   **Resolution Protocol:** In this document, "Right to Asylum" refers to the **legal mechanism** (Camp A's usage), while "Claim to Protection" refers to the **moral imperative** (Camp B's usage). Disagreements labeled as "Moral" in Section II should not be stalled by legal definitions, and vice versa.

  ***

  **Signatures:**

  _________________________ (Camp A)

  _________________________ (Camp B)

  _________________________ (Facilitator)
