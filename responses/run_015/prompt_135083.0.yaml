prompt: |-
  Hey — I need help turning a half-baked idea into a tight two-page proposal (aim for 850–950 words) for a nine-month dissertation-writing fellowship in my department. I'm a fourth-year in sociology, but two people on my committee are philosophers, so whatever I turn in has to be legible to both camps without being mush. Please act as a philosopher of social science who has also read a fair amount of applied micro and causal inference, and start with a couple of hundred words of actual brainstorming — is the question even well-posed, what's the strongest version of it, what's the obvious objection I'm not seeing — before you draft anything. Then give me the proposal itself.

  The half-formed idea, such as it is: I think the individualism-vs-holism fight keeps stalling because everyone agrees on constitution (yes, any social arrangement is made of individuals acting) and then quietly assumes that settling constitution settles explanation, and then assumes that settling explanation settles what we should *model*. I want to pry those apart and make the third one the real question. Specifically, I want to ask which level's generalizations **travel**: when you take a model estimated in one population and move it to another place, another decade, or another policy regime, how much of it has to be re-estimated? Call that its re-estimation burden, and call the tendency of a model's parameters to go stale as you move it level-relative drift. My hunch — and I'm not married to it — is that macro-level regularities are often *more* portable than micro-level ones precisely because they're multiply realized: lots of different micro configurations produce the same tipping point, the same run on a bank, the same segregation pattern, so the macro description survives while the micro parameters churn. If that's right, then holism isn't a metaphysical thesis at all but a contingent bet about stability, and the interesting form of individualism is the one that grants constitution and explanation and still wins on portability. Two workhorse examples I keep coming back to: the classic threshold model of neighborhood segregation (Schelling-style, where the macro pattern is nobody's intention), and the standard bank-run model (where a genuinely macro-ish variable, confidence in the institution, seems to push people around). I also want it to gesture at a policy case — a policing or housing intervention that worked in one city and backfired in another — because that's the version my committee cares about.

  So the proposal needs: the question stated sharply enough that it has a determinate answer; why the standard positions (reductive individualism, supervenience-based quietism, and the sort of holism that just asserts downward causation) leave it open; what I'd actually do across three blocks of the nine months, given that I have no budget for new data collection and this has to be a conceptual project that reads existing replication and forecasting evidence rather than generating any; why that approach rather than the obvious alternatives (write another supervenience paper, build an agent-based model and watch what happens, or do a straight external-validity piece); what a successful result would look like as something a working researcher could use — I'm imagining a decision procedure for choosing a level of description given a portability target; and, importantly, an honest failure condition. My best candidate for failure is that the stability ranking turns out to be entirely case-by-case, with no level-level generalization to be had, in which case the honest output is an argument that the debate was always a pseudo-debate — I'd rather say that up front than pretend I'll find a law. One more thing to defuse: a committee member has already said this is just external validity with a fancy name, and I need a paragraph that takes that seriously and says what's left of the project if he's right. Don't give me citations or a bibliography — I'll fill those in myself, so just refer to positions and arguments by name.

  Format: prose proposal with short section headers, plus your brainstorming up top, and then finish with one single line at the very end of the form \answer{...} containing the one sentence I'd put on the fellowship's abstract line — the sharpest claim the project is actually positioned to defend. Keep it in my voice, not fellowship-speak; my draft notes are a mess and I'd rather have something I can edit than something that sounds finished.
