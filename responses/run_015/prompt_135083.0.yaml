answer: |-
  **Brainstorming Notes**

  The core move here is pragmatic realism: shifting from "what exists" to "what travels." The strongest version of this argument isn't that macro causes micro, but that macro parameters are structurally more stable under intervention because they average over micro-noise. The obvious objection is selection bias: we only notice stable macro patterns because the unstable ones disappear. You need to address survivorship bias in the case studies. Also, the "external validity" critique is dangerous. If this is just transportability analysis, why is it philosophy? The philosophical payload is the dissolution of the ontological debate into a methodological wager. If you prove portability is level-relative, you haven't solved metaphysics, you've made it irrelevant for modeling. That's the win condition. The failure condition is equally important: if portability is random across levels, you prove the individualism/holism debate is empirically empty. That's a publishable negative result. Don't shy away from it.

  ***

  **Project Proposal: Level-Relative Drift and the Portability of Social Explanation**

  **The Core Question**
  The individualism-versus-holism debate stalls because everyone agrees on constitution: any social arrangement is made of individuals acting. We then quietly assume that settling constitution settles explanation, and that settling explanation settles what we should model. I want to pry those apart. The real question isn't ontological; it's about portability. When you take a model estimated in one population and move it to another place, decade, or policy regime, how much of it has to be re-estimated? I call this the re-estimation burden. I define level-relative drift as the tendency of a model's parameters to go stale as you move it across contexts. My central hypothesis is that macro-level regularities are often more portable than micro-level ones precisely because they're multiply realized. Lots of different micro configurations produce the same tipping point or segregation pattern, so the macro description survives while the micro parameters churn. If this is right, holism isn't a metaphysical thesis but a contingent bet on stability.

  **Beyond Constitution and Supervenience**
  Standard positions leave this question open. Reductive individualism assumes micro-parameters are the fundamental drivers, implying they should be the most stable. Supervenience-based quietism argues that since the macro depends on the micro, we don't need to choose, which ignores the practical costs of modeling every micro-interaction. Strong holism asserts downward causation, which often collapses into mystery when pressed on mechanisms. None of these address the transportability gap. A model can be ontologically individualist yet epistemically holistic if the macro-parameters are the ones that hold steady under intervention. I intend to show that the interesting form of individualism is the one that grants constitution and explanation but loses on portability. This shifts the debate from what social facts *are* to which descriptions *work* across contexts.

  **Methodology and Timeline**
  This is a conceptual project reading existing replication and forecasting evidence; I have no budget for new data collection. The nine months divide into three blocks. Months one through three focus on formalizing the metric of re-estimation burden. I will review literature on causal inference and transportability to define drift operationally. Months four through six apply this to workhorse examples. I will analyze the threshold model of neighborhood segregation to see if macro-patterns persist despite micro-motivation changes. I will examine standard bank-run models to test if confidence variables push people around more reliably than individual liquidity constraints. I will also integrate a policy case, likely a housing intervention that worked in one city and backfired in another, to ground the theory in applied stakes. Months seven through nine synthesize these into a decision procedure for choosing a level of description given a portability target.

  **The External Validity Objection**
  A committee member has suggested this is just external validity with a fancy name. I take this seriously. If the project reduces to standard transportability analysis, the philosophical contribution vanishes. However, standard external validity asks if *a* model travels. This project asks *which level* of model travels. It treats the ontological level itself as the variable of interest. If micro-models consistently fail transportability where macro-models succeed, that is evidence against the methodological privilege of individualism, regardless of ontology. If the stability ranking turns out to be entirely case-by-case, with no level-level generalization, then the honest output is an argument that the debate was always a pseudo-debate. I would rather establish that negative result than pretend I will find a law.

  **Deliverables and Failure Conditions**
  The primary deliverable is a decision procedure for researchers: a set of criteria for choosing a level of description based on the intended scope of application. This gives working sociologists a tool to justify macro-modeling without invoking mysterious social forces. The success condition is identifying a systematic relationship between multiple realizability and parameter stability. The failure condition is finding that drift is random across levels. In that case, the dissertation will argue that the individualism-holism fight is empirically empty for modeling purposes. Either way, the project resolves the stalemate by changing the terms of engagement from metaphysics to model performance.

  \answer{Holism is not a metaphysical claim about social entities but a methodological wager that macro-level parameters exhibit lower re-estimation burden across contexts than micro-level foundations.}
