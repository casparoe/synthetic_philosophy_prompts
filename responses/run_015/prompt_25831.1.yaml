answer: |-
  You have constructed a very sharp critique that touches on the foundational debate between **Causal Decision Theory (CDT)** and **Evidential Decision Theory (EDT)** (of which Hofstadter's superrationality is a variant).

  However, there is a concrete error in your setup that obscures the philosophical point, followed by a deeper conceptual illusion about why the "Bonus Game" feels different from the Prisoner's Dilemma (PD).

  Here is the breakdown of where the argument goes wrong.

  ### 1. The Factual Misstep: Payoff Inconsistency
  The exact misstep is a contradiction between your setup in **(6)** and your dominance claim in **(8)**.

  *   **In (6):** You define the mismatch payoff as: "the **A-chooser** gets $100 and the **B-chooser** gets $0."
      *   If Opponent plays A: You play A ($2) vs. B ($0). **A is better.**
      *   If Opponent plays B: You play A ($100) vs. B ($1). **A is better.**
      *   **Result:** In the game described in (6), **A strictly dominates B**. Superrationality recommending A is just recommending the dominant strategy. There is no paradox here.

  *   **In (8):** You claim: "If they play A, I get $100 by playing **B**."
      *   This contradicts (6). For B to yield $100 against A, the **B-chooser** must get the temptation payoff.
      *   **Result:** You have inadvertently swapped the labels. To make this a counterexample to superrationality (where it recommends a *dominated* strategy), you need a game where **B dominates A**, but **(A,A) > (B,B)**.

  ### 2. The Corrected Game is Just the Prisoner's Dilemma
  Let's fix the payoffs to match your intention in (8). We want a symmetric game where:
  1.  (A, A) = $2 each (Reward)
  2.  (B, B) = $1 each (Punishment)
  3.  Mismatch: The **B-chooser** gets $100 (Temptation), the **A-chooser** gets $0 (Sucker).

  In this **corrected** Bonus Game:
  *   If Opponent plays A: I get $2 (A) vs. $100 (B). **B is better.**
  *   If Opponent plays B: I get $0 (A) vs. $1 (B). **B is better.**
  *   **B strictly dominates A.**
  *   However, (A, A) yields $2, which is better than (B, B) yielding $1.

  **This is structurally identical to the Prisoner's Dilemma.**
  *   **PD:** Cooperate = A, Defect = B. (D dominates C, but C,C > D,D).
  *   **Bonus:** Choose A = Cooperate, Choose B = Defect. (B dominates A, but A,A > B,B).

  Therefore, the move from (5) to (7) is legitimate, but it does not create a *new* problem for superrationality. It simply reproduces the **exact same problem** as the PD. If superrationality is valid in the PD, it must recommend A in the Bonus Game. If recommending A in the Bonus Game is absurd (because it violates dominance), then recommending Cooperation in the PD is equally absurd.

  ### 3. The Philosophical Misstep: The "Reductio" Assumption
  Your worry in **(9)** ("So superrationality recommends a dominated strategy — which looks like a reductio") assumes that **violating the Dominance Principle is always irrational.**

  This is the core disagreement between decision theories:
  *   **Causal Decision Theory (CDT):** Holds the Dominance Principle as sacrosanct. Your choice cannot causally influence the other player's choice in a one-shot game. Therefore, you must play the dominant strategy (Defect/B). CDT says superrationality is wrong in **both** the PD and the Bonus Game.
  *   **Evidential Decision Theory (EDT) / Superrationality:** Holds that your choice is *evidence* of the other player's choice (due to common rationality/symmetry). Therefore, the "states of the world" (Opponent plays A vs. Opponent plays B) are not independent of your action. EDT says you should maximize expected utility based on the correlation. Since (A,A) > (B,B), you play A. EDT says superrationality is right in **both** cases.

  **The Misstep:** You are treating the violation of dominance in the Bonus Game as a *reductio ad absurdum* specific to the extension, when it is actually the **standard objection** to superrationality in the PD. The Bonus Game does not prove superrationality "proves too much"; it proves that superrationality is committed to violating dominance in *all* Prisoner's Dilemma-type situations.

  ### 4. Why the Bonus Game *Feels* Different (The Illusion)
  You likely feel the Bonus Game is a stronger counterexample than the PD for psychological reasons:
  1.  **Salience of Dominance:** In the abstract PD, "Defect" feels morally fraught or strategically complex. In the Bonus Game, "Take the $100" feels like obvious money on the table. The dominance of B feels more intuitive than the dominance of Defection.
  2.  **Labeling:** In the PD, we label the good outcome "Cooperation." In the Bonus Game, we label the dominated strategy "A." It is easier to see "A" as arbitrary and thus irrational to choose when dominated, whereas "Cooperation" carries normative weight that tempts us toward superrationality.

  ### 5. Addressing the "Unfalsifiable" Worry (Step 11)
  You worry the superrationalist dismisses counterexamples by claiming you are "begging the question" (assuming independence).

  This is not unfalsifiability; it is an **axiomatic clash**.
  *   If you assume **Causal Independence**, superrationality is falsified.
  *   If you assume **Logical Correlation** (my reasoning is a logical cause of his reasoning), dominance is falsified.

  The superrationalist isn't making their position unfalsifiable; they are pointing out that your counterexample relies on CDT axioms (independence) which they explicitly reject. The cost of giving up the Dominance Principle is high (it leads to "managing the news" in other contexts, like the Smoking Lesion problem), which is why most game theorists reject superrationality.

  ### Summary
  1.  **Technical Error:** Your payoff matrix in (6) made A dominant, contradicting your claim in (8).
  2.  **Structural Reality:** Once corrected, the Bonus Game **is** a Prisoner's Dilemma.
  3.  **Philosophical Location:** The argument doesn't go wrong in the extension to the Bonus Game. It goes wrong in assuming that violating dominance in the Bonus Game is a *reductio* while potentially accepting it (or feeling tempted by it) in the PD.
  4.  **Verdict:** Superrationality *does* recommend dominated strategies. If you find that unacceptable in the Bonus Game, you must reject superrationality in the Prisoner's Dilemma as well. There is no principled difference between the two games that saves the theory in one case but not the other.

  **Recommendation:** If you want to preserve the intuition that "rational agents play dominant strategies," you must reject premise **(3)** in the PD case. If you want to preserve premise **(3)**, you must accept that rational agents sometimes play dominated strategies when logical correlation is guaranteed. You cannot have it both ways.
