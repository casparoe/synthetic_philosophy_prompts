  Your intuitions are not "messy"; they are actually quite sophisticated and mirror the debates happening in academic journals right now. Most people are "pluralists"—they believe we have *some* special duties to compatriots, but not *absolute* ones.

  Per your request, I will not jump straight to an answer. I will brainstorm three candidate principles, select the most robust one, apply it to your cases (including the tricky ones), identify where we must "bite a bullet" (accept a counter-intuitive conclusion to maintain consistency), and finally test it on your new case.

  ### Part 1: Brainstorming Candidate Principles

  Here are three ways we could try to unify your thoughts.

  **Candidate A: Strict Cosmopolitanism**
  *   **The Principle:** National borders are morally arbitrary. We must always act to maximize the well-being of the worst-off person, regardless of nationality.
  *   **Verdicts:** You must vote against the tariff (Case 2), the doctor must ignore passports (Case 4), and the university must take the refugee (Case 6).
  *   **The Problem:** This forces you to abandon Case 1 (Cafe), Case 3 (Earthquake), and Case 5 (Charity). It demands too much of individuals and states, effectively dissolving the idea of a "community." It feels too cold for the cafe and too demanding for the charity.

  **Candidate B: Strong National Prioritarianism**
  *   **The Principle:** A political community is a cooperative scheme for mutual advantage. Members pay in (taxes, loyalty) and get out (protection, preference). Outsiders have no claim on our resources.
  *   **Verdicts:** You favor the local in the Cafe (Case 1), the Earthquake rescue (Case 3), the University (Case 6), and Charity (Case 5).
  *   **The Problem:** This forces you to abandon Case 2 (Tariffs) and Case 4 (ER Doctor). It justifies harming foreign farmers for local jobs and letting a tourist bleed out. Most ethicists agree there is a "humanity threshold" where nationality stops mattering.

  **Candidate C: The "Role-Relative Threshold" Principle (Hybrid)**
  *   **The Principle:** Our duties depend on our **role** and the **severity of the need**.
      1.  **Negative Duty:** Never severely *harm* outsiders to benefit insiders (trumps nationality).
      2.  **Universal Role:** In roles defined by basic human survival (medicine), prioritize need over borders.
      3.  **Associative Role:** In roles defined by community reciprocity (government, business), prioritize members *unless* the outsider's need is a matter of basic survival/capability and the insider's gain is merely an advantage.
  *   **The Problem:** It is complex. It requires distinguishing between "harm" and "failure to aid," and between "survival" and "advantage."

  ### Part 2: Locking in the Principle

  I recommend we adopt a refined version of **Candidate C**. Let's call it:

  **The Principle of Urgent Need and Institutional Mandate**

  > **1. The Harm Constraint:** We are never permitted to actively inflict severe deprivation on outsiders to secure benefits for insiders.
  > **2. The Universal Mandate:** Agents in roles defined by universal human rights (e.g., emergency medicine) must ignore borders.
  > **3. The Associative Permission:** Agents in roles defined by specific community contracts (e.g., state government, local business) may favor insiders, *provided* the benefit to insiders does not vastly outweigh the basic capability deprivation of outsiders.

  This principle respects the special relationship of citizenship without allowing it to become a tool of oppression or indifference to suffering.

  ### Part 3: Applying the Principle to Your Cases

  Here is how this principle sorts your six cases:

  *   **Case 1 (Cafe Hiring):** *Verdict: Favor Local.*
      *   **Reasoning:** This is an **Associative Role** (private business/community). The stakes are employment (important, but not immediate survival). The "Harm Constraint" isn't triggered because not hiring the foreigner doesn't actively push them into poverty; they simply don't get this specific benefit. Your intuition holds.
  *   **Case 2 (Tariffs):** *Verdict: Do Not Favor Local.*
      *   **Reasoning:** This triggers the **Harm Constraint**. Voting for the tariff *actively inflicts* deep poverty on the farmers. The benefit (100 jobs) does not morally outweigh the active harm (thousands into poverty). Your intuition holds.
  *   **Case 3 (Earthquake Rescue):** *Verdict: Favor Local.*
      *   **Reasoning:** This is an **Associative Role** (State Government). The state is essentially an insurance policy funded by taxpayers. Citizens have a specific *contractual right* to this protection that foreigners do not. While the need is high (survival), the mandate is particular. Your intuition holds.
  *   **Case 4 (ER Doctor):** *Verdict: Do Not Favor Local.*
      *   **Reasoning:** This is a **Universal Mandate**. The ethical code of medicine is based on human physiology and need, not citizenship. To treat based on passports violates the core purpose of the role. Your intuition holds.
  *   **Case 5 (Charity):** *Verdict: Favor Local.*
      *   **Reasoning:** This is **Personal Discretion**. Charity is supererogatory (beyond duty). You are not violating a negative duty or a professional mandate. You are permitted to prioritize your own community connections. Your intuition holds.

  ### Part 4: Deciding the Contested Case (Case 6)

  **Case 6: University Admissions (Average Local vs. Brilliant Refugee)**

  This is the crux. Is a State University more like the Earthquake Rescue (Case 3) or the ER Doctor (Case 4)?

  *   **Argument for Local (Like Case 3):** The university is funded by state taxes. It is a benefit of membership, like the rescue budget.
  *   **Argument for Refugee (Like Case 4):** The purpose of a university is the pursuit of excellence and human potential (Universal). Furthermore, for a refugee from a war zone, education is not just an "advantage"; it is a **basic capability** required for rebuilding a life.

  **My Philosophical Recommendation:**
  Under the *Principle of Urgent Need and Institutional Mandate*, **the University should admit the Refugee.**

  **Why?**
  While the university is state-funded (Associative), its *primary mandate* is educational excellence and social mobility, not just tax reimbursement (unlike the Rescue budget).
  1.  **Merit:** The refugee is "brilliant," the local kid is "average." Excluding the brilliant student undermines the university's core mission of excellence.
  2.  **Urgency:** For a war-zone refugee, admission is a pathway to safety and functioning (Basic Capability). For the local kid, it is an advantage, but likely not a matter of survival (they have other state safety nets).
  3.  **The Threshold:** The disparity in need is too high to justify the associative preference.

  **The Bullet We Must Bite:**
  To maintain consistency, we must acknowledge a tension with **Case 3 (Earthquake)**.
  If we say the University must favor the refugee due to high need, why can the State favor locals in the Earthquake case where need is also high?
  *   **The Repair:** We must distinguish **Protection** from **Opportunity**.
      *   *Case 3 (Rescue):* The state is the *sole insurer* of its citizens. It has a fiduciary duty to protect its contributors first. It is permissible to save 100 citizens over 1,000 foreigners because the citizens *paid for* that specific rescue service via taxes.
      *   *Case 6 (University):* Education is a **distributive good**, not just protection. While funded by taxes, its moral purpose is to cultivate talent. When talent and extreme need align in an outsider, the "Associative Permission" is overridden by the "Urgent Need" of the refugee.
      *   *The Bite:* You must accept that **State Institutions are not monolithic.** Some (Rescue/Police) are strictly for citizens. Others (Universities/Research) have a universal mandate that limits how much they can favor locals.

  ### Part 5: The New Test Case (Case 7)

  **Case 7: The Mayor (Local Arts Center vs. Foreign Flood Relief)**
  *Scenario:* A mayor has surplus budget. Option A: Fund a local arts center (cultural enrichment for constituents). Option B: Send the money to flood relief abroad (survival for foreigners).

  **Applying the Principle:**
  1.  **Role:** The Mayor is a **Fiduciary Agent** for the city. Their mandate is strictly **Associative**. Unlike the ER doctor (Universal) or the University (Mixed Mandate), a Mayor's job is *only* to represent the city.
  2.  **Constraint:** Does funding the arts *harm* the foreigners (Harm Constraint)? No. It is a failure to aid, not active harm.
  3.  **Mandate:** Does the Mayor have the authority to spend tax money on non-constituents? Generally, no. That would be a violation of their contract with the voters.

  **Prediction:**
  According to this principle, **the Mayor should fund the Local Arts Center.**

  **Why this feels wrong (and how to fix it):**
  This feels cold. If the flood is deadly, shouldn't the money go there?
  *   **The Philosophical Fix:** The *Mayor* is the wrong agent. The **Citizens** (voters) are the moral agents here.
      *   The Mayor *must* follow the city's mandate (Arts).
      *   The Citizens, however, should vote for a Mayor who supports *federal* foreign aid, or they should donate their *private* money (Case 5 logic) to the flood relief.
      *   We cannot conflate the **Office** (which is bound by associative duties) with the **Person** (who has universal duties).

  ### Summary of the Repaired View

  To have a consistent ethical framework, here is your sorted list:

  1.  **Cafe:** Favor Local (Private/Associative).
  2.  **Tariffs:** Favor Foreigners (Harm Constraint).
  3.  **Earthquake:** Favor Local (State as Insurer/Protector).
  4.  **ER Doctor:** Favor Need (Universal Mandate).
  5.  **Charity:** Favor Local (Personal Discretion).
  6.  **University:** **Favor Refugee** (Institutional Mission + Urgent Need overrides Residency).
  7.  **Mayor:** **Favor Local Arts** (Fiduciary Duty), *but* citizens should pressure national gov or donate privately for the flood.

  **The Core Takeaway:**
  You are permitted to favor your compatriots when distributing **benefits and opportunities** within a cooperative scheme (Cafe, State Rescue, Mayor). You are **not** permitted to favor them when doing so inflicts **harm** (Tariffs), violates a **universal professional duty** (ER), or ignores **extreme basic needs** in institutions dedicated to **human potential** (University).

  This preserves your community ties without sacrificing your humanity.
