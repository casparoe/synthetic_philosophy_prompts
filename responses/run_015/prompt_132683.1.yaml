  **Brainstorming Objections**

  Before constructing the defense, I must acknowledge the formidable barriers to this thesis. First, the narrativist objection remains potent: Hayden White demonstrated that emplotment is a poetic act, imposing literary forms (tragedy, comedy, romance) onto events that possess no intrinsic story-shape; evidence can confirm dates, but it cannot confirm that a sequence constitutes a "tragedy" rather than a "farce." Second, there is the archival objection: the archive itself is a product of power and exclusion, meaning the "constraints" it imposes are merely the boundaries of what the powerful deemed worthy of record, leaving the historian tethered to a biased sample rather than reality. Third, there is the hermeneutic objection regarding Ranke himself: interpreting *wie es eigentlich gewesen* as a polemic against Hegel rather than a claim to objective truth risks anachronism, ignoring Ranke's own theological commitments to seeing the "hand of God" in history, which suggests his objectivism was indeed metaphysical, not merely methodological. I set these aside to proceed with the argument as instructed.

  ***

  **The Anchored Shape: A Defense of Archival Constraint**

  The standard genealogy of historical theory posits a clean break between a naive nineteenth-century objectivism and a sophisticated twentieth-century constructivism. On this view, Ranke's slogan promises a mirror of the past, while Carr and White reveal the mirror to be a canvas. This genealogy fails because it misidentifies the target of the original objectivist demand. Ranke's injunction was not a metaphysical claim to escape perspective, but a methodological polemic against the subordination of the particular to the *a priori*. Against Hegel's philosophy of spirit, which deduced historical necessity from logical categories, the historicist demanded that the source material discipline the categories. When we read the slogan this way, the constructivist critiques lose their devastating force. We can grant E.H. Carr's point that the historian selects facts based on present values, and we can grant Hayden White's point that no archive contains a label specifying "tragedy" or "comedy." Neither grant necessitates the conclusion that the narrative shape is unmoored from evidence. The substantive fault line is not between selection and objectivity, but between two modes of constraint: does the archive constrain only the individual bricks of the narrative, or does it constrain the architecture of the whole? I defend the latter.

  To argue this internally, I concede the constructivist premise that evidence does not *dictate* a plot-structure. No document arrives with a genre classification. However, while evidence does not select the shape, it vetoes incompatible shapes. The archive functions not as a blueprint, but as a load-bearing wall. A historian may choose to emplot a sequence of events as a "decline and fall," but if the archival record demonstrates a sustained increase in material capacity during that period, the "decline" emplotment becomes untenable. The constraint is not on the *choice* of narrative form, but on the *viability* of the causal configurations that underwrite that form. If the shape of the narrative relies on a causal mechanism that the archive proves absent, the shape must be abandoned. Thus, the archive constrains the whole by limiting the set of coherent wholes that can be built from the parts.

  Consider the invented case of the "Merovingian Silence." For decades, historians emploted the reign of King Clovis II as a "Tragedy of Isolation," arguing that his diplomatic failure led to inevitable invasion. The narrative shape relied on the causal premise that Clovis sought alliances but was rebuffed by neighbors. This emplotment was entirely abandoned following the discovery of the *Codex Aurelianensis*, a cache of correspondence showing Clovis had actively rejected multiple alliance offers to pursue a specific, successful consolidation strategy. The abandonment was not a shift in narrative fashion; historians did not simply tire of tragedies. Rather, the *causal spine* of the tragedy—unwanted isolation—was severed by the document. A tragedy requires a failure of agency or circumstance; the documents proved a success of agency. The "Tragedy" shape was not just replaced; it was evidentially falsified because the structural relations required to sustain that plot were incompatible with the archival record. The archive constrained the shape by rendering the specific causal configuration of the "Tragedy" impossible.

  The strongest constructivist reply to this anchoring is that the archive itself is conventional: what enters the record, and what counts as defeating evidence, is determined by disciplinary norms, so the anchor floats free of the reality it was supposed to tether. If the *Codex Aurelianensis* is only "evidence" because we conventionally agree to treat letters as truthful accounts of intent, the constraint is circular. This objection conflates the *conditions of access* with the *resistance of content*. It is true that conventions govern what is preserved and what is accepted as valid testimony. However, once inside the methodological game, the content exerts a brute friction that conventions cannot dissolve. We may conventionally decide to trust ledgers over diaries, but if a ledger shows a surplus where a diary claims poverty, the narrative of "impoverishment" collapses regardless of our conventions. The convention opens the door, but the recalcitrance of the material inside determines where the furniture can be placed. The anchor holds not because the chain is made of pure reality, but because the seabed offers resistance that the chain cannot ignore.

  A second reply insists that even if individual statements are anchored, the cognitive content of history lives in the shape, and the shape is never settled by evidence. This view rests on a category error regarding what "shape" signifies in historical explanation. If shape were purely literary—mere tropological coloring—evidence would indeed be irrelevant to it. But historical shape is primarily explanatory structure: it is the configuration of causal links that renders events intelligible. When we argue over whether the Cold War was a "Clash of Ideologies" or a "Great Power Security Dilemma," we are arguing about shapes, but we are arguing about truth-apt claims regarding motivation and structure, not aesthetic preferences. If evidence demonstrates that ideological rhetoric was secondary to security concerns in decision-making documents, the "Clash of Ideologies" shape loses its cognitive content because it no longer explains the events correctly. The shape carries cognitive weight precisely because it makes claims about the structure of reality that evidence can undermine.

  My argument fails only if the recalcitrance of the source material is entirely dissolvable into the linguistic conventions used to describe it.
