  **Requirements**

  1.  **Harmless Wrong Adjudication (Non-negotiable).** Derived from the *idle sensor*. The theory must articulate what is distinctively lost when data is processed without downstream harm. It cannot rely on distress or discrimination to constitute a wrong. The institution needs to know if mere processing creates a debt owed to the patient, independent of outcome. If the theory cannot identify a loss here, it fails the institutional purpose. It must explain why being watched matters even if the watcher is blind, isolating the intrinsic violation from consequential damage.

  2.  **Conceptual Independence (Non-negotiable).** Derived from *sealed letter* and *idle sensor*. Privacy must not collapse into autonomy (control over data) or security (prevention of breach). A system can be secure and autonomous yet privacy-violating. The theory must isolate the specific normative interest privacy protects, distinct from safety or choice. If privacy is just security, the sealed letter is fine. If it is just autonomy, the sensor is fine. The theory must separate these strands to prevent the hospital from conflating encryption with ethical compliance.

  3.  **Waiver vs. Existence (Non-negotiable).** Derived from the *night-train stranger*. The theory must distinguish between lacking privacy and voluntarily waiving it or being indifferent. Disclosure to one agent cannot automatically extinguish claims against another. The theory must define the precise conditions of forfeiture to prevent assumed consent. It must explain why telling a stranger differs from authorizing a hospital, ensuring indifference is not treated as permission. The hospital must know when patient silence constitutes waiver versus mere absence of objection.

  4.  **Category Neutrality (Non-negotiable).** Derived from the *inference* case. The theory cannot rely on a fixed inventory of sensitive categories (e.g., health, finance). Sensitivity must be emergent. The hospital cannot rely on static labels to determine obligation, as models render non-sensitive data sensitive. The theory must provide a dynamic test for sensitivity, preventing the institution from hiding behind data classification schemas. It must adjudicate sensitivity based on context and potentiality, not predefined tags.

  5.  **Potential Access Status (Non-negotiable).** Derived from *sealed letter* and *idle sensor*. The theory must take a position on whether unexercised permission or unread records constitute a loss. Is the risk itself the wrong, or only the realization? The institution needs a rule for retention policies and conditional access protocols. It must adjudicate whether the capacity to see is itself a violation of the patient's standing. The hospital requires a binary rule on whether unread data incurs moral debt.

  6.  **Inferred Fact Status (Non-negotiable).** Derived from the *inference* case. The theory must determine if facts derived via modeling, where no record was accessed, count as private information. Does the method of acquisition matter more than the fact known? This dictates liability for analytics versus record retrieval. The theory must decide if privacy attaches to the datum or the epistemic relation. The hospital needs to know if predictive outputs trigger the same obligations as explicit medical records.

  7.  **Third-Party Scope (Negotiable).** Derived from the *genetic mirror*. The theory must specify if privacy obligations extend to non-consenting subjects linked via data. Can the hospital owe a duty to the sister? This defines the boundary of the patient relationship and liability horizon. It must resolve whether privacy is individual or relational, impacting how genetic data is managed. The institution needs to know if non-patients possess veto power over patient data releases.

  8.  **Audience Attenuation (Negotiable).** Derived from the *ten-thousandth viewer*. The theory must define whether the wrong attenuates as the audience grows. Does scale dilute responsibility or compound it? This dictates batching protocols for data release and research cohort sizing. It must provide a function for moral weight relative to audience size, preventing arbitrary limits. The hospital must know if releasing data to a large trusted consortium is worse than to a single researcher.

  **Collisions**

  The list likely contains an impossible triangle. **Harmless Wrong Adjudication** demands a violation without harm, while **Conceptual Independence** forbids collapsing privacy into security. Yet, if an *idle sensor* wrongs without harm, the wrong looks precisely like a security failure (unauthorized capacity) without the breach. To satisfy **Harmless Wrong**, the theory must treat potential access as normative loss; but to satisfy **Conceptual Independence**, it must deny that potential access is merely a security metric. Furthermore, **Waiver vs. Existence** conflicts with **Harmless Wrong** in the *night-train* case. If the stranger scenario involves no wrong due to waiver, but the *idle sensor* involves a wrong without harm, the theory must distinguish voluntary exposure from involuntary monitoring without relying on harm or control. Satisfying all three may require a metaphysical commitment to privacy as a sacred state that cannot be waived even voluntarily, which violates autonomy.

  **The sharpest requirement**

  **Harmless Wrong Adjudication** excludes the most familiar families. Reductionist theories fail immediately; they define privacy violations by consequent harm (distress, discrimination). If nothing bad happens, there is no wrong. Control-based theories fail because control was maintained; the sensor was authorized, the letter sealed. Access-based theories stumble on the *idle sensor*; if no one looks, access was not violated in the traditional sense. Contextual Integrity struggles because if the norm permits recording for safety, and no transmission occurs, the context is intact. Only a deontological theory of privacy as a distinct intrinsic value can satisfy the demand to identify a loss where consequence, control, and norm-flow are neutral. It forces the theory to posit privacy as a state of being, not a flow of data.

