prompt: |-
  I chair the ethics advisory board of a research institute that runs behavioural-science field experiments at roughly forty sites across twenty-five countries. We clear about forty protocols a year, usually within forty-eight hours, with a two-person review team (one behavioural scientist, one regional programme lead) and my signature at the end. Most of the objections we get from local partners are moral rather than legal, and we handle them ad hoc: sometimes we localize a protocol, sometimes we insist on the home standard, sometimes we quietly drop a site, and we could not afterwards say why we did any of these.

  Please write the decision procedure my reviewers should run on every protocol, in the order they should run it. It has to be operationalized from the debate about cross-cultural variation in folk morality and what that variation does or does not show about moral objectivity. I have a two-page summary of that literature in front of me, so I do not need citations, studies, or reading recommendations; I need the reasoning made usable by reviewers with no philosophy training, no new data collection, and two days per protocol.

  Three things the procedure has to get right, and I suspect they are where the conceptual work is. First, it must sort each disagreement into more than difference of degree: separate cases where the parties agree on the principle and disagree about the nonmoral facts or about which description of the act is the salient one; cases where a shared set of considerations is simply weighted differently; and cases where one side treats something as a moral consideration the other does not recognize at all. Tell me which distinctions survive simplification and which my reviewers can safely collapse. Second, it must say who counts as a source of the local norm. Our local partners and in-country ethics reviewers are usually urban, university-trained and grant-funded, and I worry that the sampling problem our summary describes simply reappears one level down, so that deference to them can mistake a local elite's view for the local view. Third, it must include a reverse test: for any norm we are willing to relax abroad, the reviewer must record in advance what finding at another site would make us revise the home standard. If a norm cannot be given such a test, I want to know whether we are applying a principle or merely exporting one, and what the procedure should do then.

  Give me the stop rules: where it returns a no and drops the site, where it clears the protocol as localized, and where it stops and hands the decision to me because the remaining question is one of values rather than facts.

  Then run it on three protocols. One: a standard deception design in which participants are misled about how a sum of money was split, where the local partner says the debriefing will cause the participants lasting shame in a way the home site would not experience. Two: a consent procedure where the in-country reviewer asks that a household head's permission substitute for written individual consent, at two sites with quite different kinship structures. Three: payment for participation, which at one site is read as a wage and at another as a gift, with the two readings carrying opposite obligations. At least one of these should yield an answer I will not like, and I want you to say which and why. Close with an honest statement of what this procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Chair of an Ethics Advisory Board (EAB) for a research institute running behavioral science field experiments.
      *   **Context:** ~40 sites, 25 countries, ~40 protocols/year. Current process: 48-hour turnaround, 2-person review (behavioral scientist + regional lead), Chair signature.
      *   **Problem:** Objections are often moral (not legal), handled ad hoc (localize, insist, drop), rationale is undocumented/inconsistent.
      *   **Task:** Write a decision procedure for reviewers to run on every protocol.
      *   **Constraints:**
          *   Operationalized from cross-cultural folk morality debates (moral objectivity vs. relativism).
          *   No citations/studies needed (Chair has summary).
          *   Usable by reviewers with no philosophy training.
          *   No new data collection.
          *   Must fit within the 48-hour/2-day window.
      *   **Key Requirements:**
          1.  **Categorize Disagreements:** Distinguish between factual/descriptive disagreements, weighting disagreements, and fundamental moral recognition disagreements. Simplify where possible.
          2.  **Source of Norms:** Address the "elite bias" problem (local partners/reviewers might not represent the actual local population).
          3.  **Reverse Test:** For any norm relaxed abroad, specify what finding elsewhere would revise the home standard. If no test exists, identify if it's principle exportation.
      *   **Outputs:** Stop rules (No/Drop, Clear/Localized, Escalate to Chair).
      *   **Application:** Run the procedure on three specific protocols (Deception/Shame, Consent/Kinship, Payment/Obligation). One must yield an uncomfortable answer.
      *   **Closing:** Honest statement of limitations.

  2.  **Deconstruct the Philosophical Underpinnings (Mental Sandbox):**

      *   *Folk Morality Debate:* Does variation imply relativism? Not necessarily. Variation can be due to different facts (empirical), different applications of shared principles (weighting), or different foundational values (deep disagreement).
      *   *Objective:* We need a procedure that respects local variation without collapsing into "anything goes" relativism, but also avoids ethical imperialism.
      *   *Requirement 1 (Categorization):*
          *   Type A: Empirical/Descriptive (We agree on the goal, disagree on the risk).
          *   Type B: Weighting/Trade-off (We agree on values, disagree on priority).
          *   Type C: Fundamental/Constitutive (We disagree on what counts as a moral value).
          *   *Simplification:* Reviewers can't do deep meta-ethics. Collapse A and B into "Adjustable," keep C as "Hard Stop/Escalate."
      *   *Requirement 2 (Source of Norms):*
          *   Problem: Local partners = WEIRD locals (Western, Educated, Industrialized, Rich, Democratic) or local elites.
          *   Solution: Require a "Plausibility Check." Is this norm likely held by the *participants*, not just the gatekeepers? Use proxy indicators (e.g., is this a legal requirement? Is it a known religious taboo? Or just a PI's hunch?).
      *   *Requirement 3 (Reverse Test):*
          *   This is the "Universalizability" check. If we allow X here because of Condition Y, would we allow X at home if Condition Y existed? Or, if we found Condition Y at home, would we change our rule?
          *   If the answer is "No, this rule is absolute for us," then we are exporting values, not adapting to facts.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Structure:* Needs to be a checklist or flowchart style. Step-by-step.
      *   *Tone:* Professional, directive, operational.
      *   *Step 1: Identification.* What is the objection?
      *   *Step 2: Classification.* Is it Fact, Weight, or Principle?
      *   *Step 3: Validation.* Who says this is the norm? (Addressing the elite bias).
      *   *Step 4: The Reverse Test.* (Addressing the exportation issue).
      *   *Step 5: Decision/Stop Rules.*

      *   *Refining Step 2 (The Distinctions):* The prompt asks what survives simplification.
          *   *Keep:* Fact vs. Value. (Crucial).
          *   *Keep:* Weighting vs. Principle. (Crucial for the Reverse Test).
          *   *Collapse:* "Nonmoral facts" vs. "Salient description." Both are empirical claims about the world. Reviewers treat them as "Empirical Claims."
          *   *Collapse:* "Weighting" can often be treated as "Risk Tolerance."
          *   *Hard Line:* "Moral Recognition" (Type C) is the escalation point.

      *   *Refining Step 3 (The Source):* How to check elite bias in 48 hours?
          *   Ask: Is this codified (law/religion)? Is it observable in public behavior? Or is it an assertion by the partner?
          *   If assertion only -> Flag for Chair.

      *   *Refining Step 4 (Reverse Test):*
          *   Question: "If this specific condition existed at our home site, would we change our home protocol?"
          *   If Yes -> Consistent Principle.
          *   If No -> Value Export. (Requires Chair decision).

  4.  **Developing the Stop Rules:**

      *   **Clear (Localized):** Empirical disagreement resolved + Reverse Test passed (or N/A).
      *   **Escalate (Chair):** Fundamental moral disagreement OR Value Export identified OR Elite Bias suspected.
      *   **Drop (No):** Harm cannot be mitigated + Home Standard must apply (Value Export deemed unacceptable) OR Local Norm is Fundamental and Violation is Unacceptable.

  5.  **Running the Protocols:**

      *   *Protocol 1: Deception/Shame.*
          *   Issue: Debriefing causes shame locally, not at home.
          *   Classification: Empirical (consequence of debriefing).
          *   Source: Partner says so. Plausibility? High (honor cultures).
          *   Reverse Test: If debriefing caused lasting psychological harm at home, would we do it? Yes, we would stop debriefing or change method.
          *   Outcome: Clear (Localized). Change debriefing method.
      *   *Protocol 2: Consent/Kinship.*
          *   Issue: Household head consent vs. Individual. Two sites, different kinship.
          *   Site A (Patriarchal): Head consent requested.
          *   Site B (Matrilineal/Individualistic): Head consent requested (by elite partner?).
          *   Source Check: Site A norm is public/legal. Site B norm might be partner preference (elite bias).
          *   Reverse Test: Would we allow head consent at home if the participant was vulnerable? Generally No.
          *   Outcome: Site A -> Escalate (Fundamental right vs. local norm). Site B -> Drop/Reject (Elite bias).
          *   *Wait, I need an uncomfortable answer.* Let's make Protocol 3 the uncomfortable one.
      *   *Protocol 3: Payment/Wage vs. Gift.*
          *   Issue: Payment = Wage (tax/contract obligations) vs. Gift (social obligation to share/reciprocate).
          *   Site A (Wage): Legal/tax issue.
          *   Site B (Gift): Social obligation to share with community, creating coercion/risk.
          *   Reverse Test: If payment at home created a dangerous social obligation to share, would we stop paying? Or would we insist on individual ownership?
          *   *Uncomfortable Answer:* If we insist on individual ownership at home, but allow the "Gift" interpretation abroad, we are exporting individualism. If we ban the "Gift" site because it violates individual autonomy, we are stopping research that locals want.
          *   *Decision:* The procedure should flag this as Value Export. If we insist on "Individual Property" as a universal, we must drop Site B. This is uncomfortable because it halts beneficial research to maintain a philosophical stance on autonomy.

  6.  **Refining the "Uncomfortable Answer":**

      *   Let's look at Protocol 2 again. If the procedure says "Defer to local norm on consent," that undermines universal human rights (individual autonomy). If it says "Insist on individual consent," it's ethical imperialism.
      *   Let's look at Protocol 3 again. Payment as a gift creates social pressure. If we ban it, we deny income. If we allow it, we enable coercion.
      *   *Selection:* Protocol 2 (Consent) is the classic dilemma. But Protocol 3 (Payment) is more subtle. Let's make Protocol 2 the one that yields the "No/Drop" on a site that really wants to participate, or Protocol 3 where we have to admit we are exporting values.
      *   *Decision:* I will make Protocol 2 (Consent) the one that yields a "Drop" for one site due to Elite Bias suspicion, and Protocol 3 (Payment) the one that forces the "Value Export" admission. Actually, the prompt asks for *one* answer I won't like.
      *   *Idea:* The procedure should force the Chair to admit that in Protocol 3, we are exporting a value (individual property rights) and therefore must either drop the site or revise the home standard. If the home standard is "Individual Consent/Property," and the local norm is "Communal Obligation," the Reverse Test fails. We wouldn't accept communal obligation at home. Therefore, we are exporting. The procedure says: If Exporting, Escalate. But if the Chair wants to run it, they are violating the procedure.
      *   *Better Uncomfortable Answer:* Protocol 2. The procedure identifies that the "Household Head" norm in Site B is likely Elite Bias (not actual local norm). The procedure says "Drop/Reject Partner's Request." The Partner gets angry.
      *   *Best Uncomfortable Answer:* Protocol 3. The procedure concludes that to run this site, we must admit we are exporting a value (individualism) and *cannot* construct a valid Reverse Test. Therefore, the protocol is ethically unjustified under this framework, yet scientifically valuable. The procedure demands a "No." The Chair won't like stopping a safe study just because of philosophical consistency.

      *   *Wait, let's look at the "Reverse Test" requirement again.* "If a norm cannot be given such a test, I want to know whether we are applying a principle or merely exporting one, and what the procedure should do then."
      *   Okay, if it's mere exportation, the procedure should flag it.
      *   Let's make Protocol 2 the uncomfortable one. Why? Because it involves *rights*. If the procedure says "Defer to local kinship norm," it might violate individual autonomy (a core home value). If it says "Insist on individual," it's imperialism.
      *   *Let's go with Protocol 3 (Payment).* Why? Because it looks like a logistical detail but reveals deep moral ontology. If we treat payment as a gift locally, participants *must* share it. This creates coercion (participate to help family). At home, we forbid coercion. Reverse test: If payment at home forced participants to share with family under threat of ostracization, would we allow it? No. So we are exporting "Individual Economic Agency." The procedure says: This is Value Export. Stop or Escalate. The uncomfortable truth: We are stopping a study that locals want, to protect a value *they* might not hold in the same way, because *we* hold it.

  7.  **Finalizing the Procedure Steps:**

      *   **Step 1: Characterize the Objection.** (Fact, Weight, Principle).
      *   **Step 2: Validate the Source.** (Elite vs. Populace).
      *   **Step 3: The Reverse Test.** (Universalizability).
      *   **Step 4: Decision Matrix.**

  8.  **Drafting the Content:** (Self-Correction during drafting)
      *   *Constraint Check:* Keep it tight. Reviewers have 2 days. No philosophy jargon.
      *   *Distinction Check:* Ensure Fact/Weight/Principle is clear.
      *   *Elite Bias:* Make sure there's a specific question for this.
      *   *Reverse Test:* Make it a concrete question.

  9.  **Final Review against Prompt:**
      *   Order of operations? Yes.
      *   Operationalized from folk morality debate? Yes (focus on variation sources).
      *   No citations? Yes.
      *   3 Things Right? (Distinctions, Source, Reverse Test). Yes.
      *   Stop Rules? Yes.
      *   3 Protocols? Yes.
