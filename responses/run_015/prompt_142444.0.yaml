answer: |-
  ### The Cross-Cultural Ethics Decision Procedure

  **To:** Review Team (Behavioral Scientist + Regional Programme Lead)
  **From:** Chair, Ethics Advisory Board
  **Subject:** Mandatory Protocol Review Workflow

  This procedure operationalizes the distinction between *moral variation* (different answers to the same problem) and *moral disagreement* (different problems entirely). Your task is not to solve philosophy but to categorize the friction point. You have 48 hours. Do not collect new data. Use existing knowledge and partner documentation.

  #### Part 1: The Distinctions (What to Keep, What to Collapse)

  You will encounter three types of disagreement between the Home Standard and the Local Objection. To move fast, you must collapse two of them.

  1.  **Keep: Principle vs. Application.** You must distinguish between a disagreement about *what matters* (Principle) and a disagreement about *what is happening* (Application).
  2.  **Collapse: Fact vs. Description.** Do not waste time debating whether the objection is about "nonmoral facts" (e.g., "this will cause shame") or "salient description" (e.g., "this act counts as an insult"). Treat both as **Empirical Claims**. They are claims about how the world works in that context. They can be true or false.
  3.  **Collapse: Weighting vs. Tolerance.** Do not debate whether the local partner weights risk differently than you. Treat this as **Risk Calibration**. If they perceive higher risk, assume they are the expert on local consequence unless proven otherwise.

  **The Only Hard Line:** If the objection claims that the act itself is *forbidden* regardless of consequence (a Principle objection), you cannot resolve it. You must escalate.

  ---

  #### Part 2: The Procedure (Run in Order)

  **Step 1: Categorize the Objection**
  Read the local partner's objection. Classify it into one of two buckets:
  *   **Bucket A (Empirical/Calibration):** "This will cause harm here that it wouldn't cause at home," or "This risk is too high given local conditions."
  *   **Bucket B (Principle):** "This act is inherently wrong/forbidden here, regardless of safeguards."
  *   *Action:* If Bucket B, skip to **Step 4**. If Bucket A, proceed to **Step 2**.

  **Step 2: Validate the Source (The Elite Bias Check)**
  Local partners are often urban elites. Their moral intuition may not match the participants'. Ask:
  *   *Is this norm codified?* (Law, formal religious doctrine, public policy).
  *   *Is this norm observable?* (Public behavior, common knowledge).
  *   *Or is this an assertion?* (The Partner's professional opinion).
  *   *Action:* If "Assertion" only, flag as **Suspect Elite Norm**. Proceed to Step 3 but note the flag. If "Codified" or "Observable," treat as **Valid Local Norm**.

  **Step 3: The Reverse Test (Universalizability)**
  For any Home Standard you are willing to relax or localize, you must record the condition that justifies the relaxation. Then ask:
  *   *"If this specific condition existed at our Home Site, would we change our Home Standard?"*
  *   *Example:* We allow verbal consent here because literacy is low. If literacy were low at Home, would we allow verbal consent? Yes. -> **Pass.**
  *   *Example:* We allow household head consent here because "family is unit." If family were the unit at Home, would we allow it? No. -> **Fail.**
  *   *Action:*
      *   **Pass:** You may Clear (Localized).
      *   **Fail:** You have identified **Value Export**. You are applying a Home Value, not a Universal Principle. Escalate to Chair.

  **Step 4: The Principle Check (For Bucket B or Failed Reverse Test)**
  If the objection is about Principle (Step 1) or you failed the Reverse Test (Step 3):
  *   Does the Local Principle violate a **Core Human Right** as defined by our Institute's Charter (e.g., freedom from physical harm, right to withdraw)?
  *   *Action:*
      *   If Yes (Violation): **Drop Site.**
      *   If No (Conflict of Values): **Escalate to Chair.** (This is a values decision, not a facts decision).

  ---

  #### Part 3: Stop Rules

  1.  **CLEAR (Localized):** Objection is Bucket A (Empirical/Calibration) + Source is Valid (or Suspect but mitigated) + Reverse Test Passes. *Instruction: Document the localization and the Reverse Test condition.*
  2.  **DROP (No):** Objection is Bucket B (Principle) + Local Principle violates Core Human Right OR Objection is Bucket A + Source is Suspect Elite Norm + Risk cannot be mitigated. *Instruction: Close protocol for this site.*
  3.  **ESCALATE (Chair):** Objection is Bucket B (Principle) + No Core Right violated OR Reverse Test Fails (Value Export identified). *Instruction: Stop. Send to Chair with note: 'Values Conflict' or 'Exportation Detected'.*

  ---

  #### Part 4: Application to Current Protocols

  Here is how the procedure runs on your three pending cases.

  **Protocol 1: Deception and Shame**
  *   **Objection:** Debriefing causes lasting shame locally (Bucket A: Empirical Claim about consequence).
  *   **Source:** Partner cites cultural norms on honor. This is Observable/Codified in social behavior. (Valid Local Norm).
  *   **Reverse Test:** "If debriefing caused lasting psychological harm at Home, would we do it?" Answer: No, we would alter the debrief.
  *   **Result:** **CLEAR (Localized).**
  *   **Action:** Modify debriefing script to remove shame-inducing elements. The principle (debriefing) remains, the execution changes.

  **Protocol 2: Consent and Kinship**
  *   **Objection:** Household head permission substitutes for individual consent.
  *   **Site A (Patriarchal):** Norm is codified in local custom/law. (Valid Local Norm).
  *   **Site B (Mixed/Urban):** Partner asserts this is "respectful," but individual consent is legally permitted and common. (Suspect Elite Norm).
  *   **Reverse Test:** "If the family unit were the primary legal actor at Home, would we waive individual consent?" Answer: No. Individual autonomy is a Core Home Value.
  *   **Result:**
      *   **Site A:** **ESCALATE.** This is a Principle conflict (Community Authority vs. Individual Autonomy). It does not violate a Core Human Right (physical safety), but it conflicts with Institute Charter on autonomy. Chair must decide if autonomy is universal or local.
      *   **Site B:** **DROP.** The objection fails the Source Check (Elite Bias). The Partner is imposing a norm the participants may not hold, creating unnecessary barrier to entry without ethical gain.
  *   **Why you won't like this:** You will lose Site B. The Partner there is likely a key collaborator. The procedure forces you to reject their ethical judgment as "Elite Bias" without new data, which is diplomatically volatile.

  **Protocol 3: Payment (Wage vs. Gift)**
  *   **Objection:** Payment is read as a Gift (Site C), creating obligation to share with community. Refusal to share brings ostracization.
  *   **Classification:** Bucket A (Empirical Claim about social consequence).
  *   **Source:** Valid Local Norm (Observable social pressure).
  *   **Reverse Test:** "If payment at Home carried a social obligation to share under threat of ostracization, would we allow it?"
      *   *Analysis:* At Home, we treat payment as private property. We assume participants have **Individual Economic Agency**. If a Home participant were coerced by family to hand over earnings, we would view that as a vulnerability/safeguarding issue.
      *   *Answer:* No. We would not accept that level of social coercion at Home.
  *   **Result:** **ESCALATE (Value Export).**
  *   **Why:** The procedure identifies that insisting on "Individual Property" is exporting a Home Value. However, allowing the "Gift" interpretation creates coercion (participate to fulfill social duty). You cannot Clear this without admitting you are applying a Home Standard (Individualism) that does not exist locally. You cannot Drop it without denying locals income they want. The procedure forces you to admit the inconsistency.

  ---

  #### Part 5: Limitations Statement

  This procedure cannot solve the problem of moral objectivity. It is a sorting mechanism, not a truth machine.

  1.  **It cannot detect hidden elite bias perfectly.** Without new data, the "Source Check" relies on the reviewers' existing knowledge of the region. A sophisticated elite norm can look like a public norm.
  2.  **It cannot resolve Value Exports.** When the Reverse Test fails, the procedure correctly identifies that you are exporting values, but it does not tell you whether to *stop* exporting or *admit* the export. That remains a political decision for the Chair.
  3.  **It assumes the Home Standard is coherent.** If your Home Standard is itself a patchwork of conflicting principles, the Reverse Test will yield contradictory results depending on which reviewer runs it.

  **Final Instruction:** If the procedure returns "Escalate," do not attempt to solve it. Send it to me. That is what I am paid for.
