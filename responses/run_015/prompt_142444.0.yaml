      *   Limitations statement? Yes.

      *(Self-Correction on the Uncomfortable Answer)*: I need to be explicit about *why* the Chair won't like it. It should be that the procedure forces a "No" on a study that seems harmless, exposing that the Institute's "Universal Standards" are actually just "Home Values."

      *(Refining the "Source" step)*: How to detect elite bias without data? Look for *codification* vs. *assertion*. If it's not law or religion, but just the Partner's say-so, it's suspect.

      *(Refining the "Distinctions")*:
      *   Type 1: Empirical (Facts/Descriptions). -> Resolve with evidence.
      *   Type 2: Weighting (Risk/Benefit). -> Resolve with mitigation.
      *   Type 3: Recognition (Principle). -> Escalate.
