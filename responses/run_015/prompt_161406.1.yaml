          *   *Analysis:* This is the standard attack on Minimalism (Recanati, Contextualists). If the user sticks to (b), they must bite the bullet that "I've had breakfast" literally means *ever in my life* and the "today" part is an implicature. But "today" isn't easily cancellable ("I've had breakfast, but not today" is odd).
