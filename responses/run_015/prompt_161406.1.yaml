      *   **Detailing Worry (ii):** This is the killer. (c) defines implicature via intention. (d) + Verdicts define cases of implicature *without* intention. This is a direct contradiction.
          *   *Fix:* Restrict (c) to PCI.
      *   **Detailing Worry (iii):** Minimalism (b) vs. Cancellability (f). If "I've had breakfast" implies "today", and you can't cancel it, (f) says it's entailment. (b) says it's not part of semantics. Homeless.
          *   *Fix:* Acknowledge "Impliciture" (Bach) or loosen (b). But since they want to keep (b), they need to argue cancellability works differently there or accept the "homeless" label (Impliciture).
      *   **Detailing Worry (i):** (a) is metaphysical (origins of meaning), (b) is synchronic (processing). They can coexist.
