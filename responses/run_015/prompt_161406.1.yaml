          *   *Tension:* This is a direct contradiction. You cannot require intention for *all* implicature (c) while claiming some implicatures exist without intention (d + verdicts).
          *   *Analysis:* This is the "Levinson vs. Grice" clash. Grice (c) requires intention. Levinson (d) allows default inferences without specific intention. The user is trying to hold both.
