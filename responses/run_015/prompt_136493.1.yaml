answer: |-
  **Session Plan: The Function-Norm Gap in Clinical Judgment**

  **1. The Foundational Concept: Biological Teleology**
  Before introducing the labels "naturalism" or "normativism," you must secure **biological teleology (goal-directedness)**. Clinically literate students often conflate "biological function" with "statistical average." If they believe function is merely what most bodies do, naturalism collapses into statistics, and normativism becomes the only place for "health." You must establish that a heart has a *job* (pumping blood) independent of how many hearts actually do it well. Without this distinction, the debate is just semantics about averages versus ideals. Secure this in the first ten minutes by asking: "If 90% of humans had a septal defect, would the heart's function change?" (Answer: No. The goal remains circulation, even if the statistic shifts.)

  **2. The Paired Carrying Example: Myopia of Modernity vs. Age-Related Presbyopia**
  Do not use sickle-cell trait; it is genetic and population-based, which weakens the "single lifespan" constraint. Instead, use **Myopia of Modernity** (nearsightedness driven by indoor/near-work environments) paired with **Presbyopia** (age-related loss of accommodation).

  *   **What this pair must show:**
      *   **Myopia:** Demonstrates that a biological dysfunction (eye shape mismatched to focal needs) can become statistically normal in a specific environment without ceasing to be a functional failure relative to the species' evolutionary design.
      *   **Presbyopia:** Demonstrates that a universal, statistically normal biological decline (lens hardening) is still treated as a clinical condition requiring correction, despite being "natural" for the lifespan.
      *   **The Split:** In both cases, *statistical normality* and *biological function* diverge. In Myopia, function fails while stats normalize. In Presbyopia, function fails while stats normalize (via aging).
  *   **What this pair must avoid:**
      *   Do not allow the discussion to drift into "quality of life" or "pain." Keep the focus on the *mechanism* versus the *environment*.
      *   Avoid framing glasses as "cures." Frame them as "technological scaffolding." This prevents students from solving the philosophical problem with a clinical fix.

  **3. The Explanatory Arc & Misconception Interception**

  *   **Phase 1: Clinical Intuition (Minutes 0–10)**
      *   *Activity:* Present the cases. Ask students to classify them as "disease," "normal aging," or "injury."
      *   *Emerging Misconception:* **"Naturalism is just biomedical realism."** Students will assume the biological facts dictate the label.
      *   *Interception:* Force the question: "Which environment defines the function? The savanna or the classroom?" If they say "the classroom," they have admitted a normative choice (we value schooling over hunter-gathering) determines the biological baseline.

  *   **Phase 2: The Mismatch Wedge (Minutes 10–25)**
      *   *Activity:* Deep dive into the evolutionary mismatch. Show that the eye is "functioning as designed" in the savanna (Myopia isn't selected against) but "dysfunctional" in the classroom.
      *   *Emerging Misconception:* **"Normativism is subjective preference/cultural relativism."** Students will argue that calling Myopia a disease is just a social choice, implying it's arbitrary.
      *   *Interception:* Halt this immediately. Clarify that normativism is not about *whim*; it is about *goal-conditions*. We cannot define "dysfunction" without first defining "what the organism is trying to do." That goal is not subjective; it is a prerequisite for medical action. You cannot treat a "broken" pump without a norm for "working."

  *   **Phase 3: The Dependency Structure (Minutes 25–40)**
      *   *Activity:* Map the logic. Naturalism claims facts → values. Normativism claims values (goals) → facts (dysfunction).
      *   *Emerging Misconception:* **"The two positions are mutually exclusive rivals."** Students will try to pick a winner.
      *   *Interception:* Show that Naturalism *depends* on Normativism to set the reference class. You need the norm (survival/reproduction/fluency) to identify the natural fact (dysfunction).

  *   **Phase 4: Synthesis (Minutes 40–50)**
      *   *Activity:* Return to Presbyopia. It is universal (Naturalist win?) but we correct it (Normativist win?). Why? Because the *goal* (reading) is normative, even if the *decline* is natural.

  **4. Scope Refusals**
  State openly at the start that you will **not** cover:
  *   **Historical Taxonomies:** Do not debate Canguilhem, Boorse, or Engel by name. It distracts from the conceptual logic.
  *   **Specific ICD Coding:** Do not discuss insurance reimbursement or specific diagnostic criteria. This is about ontology, not administration.
  *   **Mental Health:** Do not allow the discussion to drift into psychiatry. The biological function of the lens is clearer than the function of "mood."

  **5. The Closing Question**
  Do not ask: "Is Myopia a disease?" (This invites labeling).
  **Ask:** "If we cannot identify a biological dysfunction without first selecting an environment for that biology to operate in, does the 'natural' fact of disease depend on a 'normative' choice of environment?"
  *(This forces them to see that Naturalism relies on a Normative premise, revealing the dependency structure.)*

  **6. Confidence and Uncertainty**
  **Confidence Level:** 85%.
  **Point of Least Certainty:** I am least sure whether the **evolutionary mismatch framing** risks muddying the boundary it is meant to illuminate. By emphasizing that our "design" is for the savanna, students may conflate "evolutionary function" with "moral good," or assume that because a trait is a mismatch, it is automatically a disease. This could inadvertently reinforce a rigid Naturalism (i.e., "It's unnatural, therefore it's bad") rather than showing the normative choice involved in deciding *which* environment matters clinically. You must vigilantly police the distinction between "evolutionarily novel" and "clinically pathological."
