          *   *Clause A (Guilt):* Requires an actionable violation of duty/harm. (Handles Cheating, Debt, Partner).
          *   *Clause B (Shame):* Requires a threat to social identity/standing. (Handles Karaoke, Racism).
          *   *Clause C (Legitimacy Constraint):* Shame is only *fitting* if the standard of value being threatened is morally or rationally defensible. (Handles Accent/Job as unfitting because classism/xenophobia are illegitimate standards).
