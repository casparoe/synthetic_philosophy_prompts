      *   *Accent:* Diminishment of standing? Yes. Standard legitimate? No (xenophobia). Fits Clause C (Unfitting).
      *   *Job:* Diminishment of standing? Yes (in user's context). Standard legitimate? No (classism). Fits Clause C (Unfitting).
      *   *Roommate:* Scope of Self. If culture defines Self as Family, then Family Standing is threatened. Fits Clause D.
      *   *Partner Cheating:* Guilt leads to repair (Clause A). Shame leads to hiding (Clause B malfunction).

      *   *The Tension (Karaoke vs. Job):*
          *   Karaoke: You *chose* to get drunk. You are responsible for the state.
          *   Job: You likely *didn't choose* poverty.
          *   *Refinement:* Control/Responsibility matters for fittingness. Shame is fitting for identity failures you have some agency over (or are constitutive of you in a way you endorse), unfitting for circumstances imposed by oppression.
          *   *Wait, Intrusive Thoughts:* No agency. Why shame? Because the *content* reflects on the deep self, even if the *occurrence* doesn't. This is a known philosophical debate (Stockdale/Nussbaum). I should acknowledge this tension.

  5.  **Addressing the New Case (Country's History):**
      *   *Collective Shame.* Does it fit?
      *   Principle says: Shame responds to social identity relative to shared standards.
      *   If I identify with the country, and the country violated legitimate standards...
      *   But I didn't do it.
      *   *Verdict:* Fitting *if* you claim membership in that collective identity. Unfitting if you view yourself as distinct. It's "Identity Shame," not "Guilt."

  6.  **Addressing the Cultural Question:**
      *   Can a culture choose?
      *   If "Fittingness" depends on *Legitimate Standards*, then cultures can shift what counts as legitimate.
      *   However, if a culture makes *everything* a matter of Shame (identity), it might reduce agency (everything is "who I am" rather than "what I did").
      *   If a culture makes *everything* Guilt, it might miss social cohesion issues.
      *   *Key Insight:* "Fittingness" isn't purely objective; it relies on the *social ontology* of the culture (what counts as a Self). So yes, cultures can shift the balance, but there are moral constraints (e.g., don't shame people for accents).

  7.  **Drafting the Response:**
