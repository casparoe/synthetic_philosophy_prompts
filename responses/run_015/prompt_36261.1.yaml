          *   **Guilt** is fitting when you violate a **mandatory obligation** (duty/rights) that causes **harm** to another. Focus: *The Act.*
          *   **Shame** is fitting when you fail to embody a **valued ideal** of identity/competence that constitutes your **social standing**, *provided* that the ideal is itself legitimate (not oppressive). Focus: *The Self-in-Relation.*

