answer: |-
  Consider the following case. Suppose we build a scanner, call it the Calibrator, that for any stimulus a subject tastes prints a stable alphanumeric signature. Within a subject the signatures are perfect: the same signature recurs exactly when the subject judges two stimuli taste the same, a different one exactly when they judge they taste different, and the signatures also track their preferences, their re-identifications from memory, and their surprise reactions, with no exceptions found. Two further stipulations. First, the signatures are subject-relative: there is no way to determine whether Ada's signature for espresso is the same as Bo's signature for espresso, since every bijective mapping between their two code-sets fits all the evidence equally well. Second, there is a transfer procedure: swap the signature-producing mechanisms between two subjects and both report that everything tastes different afterward, with their preferences flipping to match. Call the view that these signatures just are the qualia signature realism. Write an essay addressing the following. Does signature realism answer Dennett's quining argument or quietly concede it? Specifically, which of the four standard properties of qualia do signatures actually have and which do they fail, and is the combination that survives enough to still be called qualia? Does the subject-relativity of the signatures mean the interpersonal inverted spectrum is now unstatable, and is that a cost or a result the qualia theorist should welcome? What is left of the Knowledge Argument given that Mary could in principle have learned every signature and its causal role in advance and yet something still seems to happen to her on first seeing red? Finally, where does the residual gap go, considering the move that signature realism relocates rather than removes the mystery since you can still ask why a signature's being tokened is like something for the subject rather than nothing? State that move and then say whether relocating counts as vindicating the posit or as eliminating it.

  Signature realism attempts to salvage qualia by identifying them with functional signatures, but in doing so it largely concedes Dennett's quining argument by stripping qualia of the properties that made them philosophically problematic in the first place. Regarding the four standard properties, signatures are private and directly apprehensible, since only the subject has access to their own printout and they know it immediately without inference. However, they are not ineffable, as they are explicitly alphanumeric and reportable in public language, nor are they intrinsic, since their identity is defined entirely by their causal role in tracking judgments and preferences rather than by any internal nature independent of those relations. This functionalization means the surviving combination is insufficient for traditional qualia realism, effectively reducing qualia to discriminative states that lack the intrinsic feel philosophers originally sought to protect. On the issue of the inverted spectrum, the subject-relativity stipulation renders the hypothesis unstatable because there is no fact of the matter about whether Ada's signature matches Bo's, given that every bijective mapping fits the evidence. A qualia theorist should welcome this result, as it dissolves the skeptic's worry without denying the reality of the experience, though it comes at the significant cost of abandoning interpersonal comparisons of experience which were central to the original intuition behind qualia. Regarding Mary, signature realism suggests she could indeed know all the physical facts about the signatures and their causal roles before release, meaning her physical knowledge was complete. The surprise she experiences upon seeing red is not knowledge of a new fact about the world but the acquisition of a new signature tokening capability, a shift in her functional state rather than her propositional knowledge. This reframes the Knowledge Argument as a confusion between knowing-that and knowing-how, undermining the claim that she learns a new proposition about experience that physicalism could not predict. The crucial move concerns the residual gap. Even if we accept signatures as qualia, we can still ask why tokening a signature feels like something rather than nothing, since a printer could print the code without feeling anything. Signature realism relocates this mystery from the nature of the quality to the nature of the tokening mechanism itself. This relocation is effectively an elimination in disguise. By making the feel of experience dependent on the functional role of the signature mechanism, the view denies that there is any extra non-physical property left over to explain. Dennett would argue that once you have explained the discrimination and reporting, there is nothing left to explain, so relocating the mystery is just a way of refusing to acknowledge its dissolution. Therefore, signature realism does not vindicate the posit of qualia as traditionally understood but rather eliminates it by redefining it in purely functional terms. It answers quining by agreeing that the original posit was incoherent, offering a replacement that lacks the problematic properties. The view succeeds only if one is willing to accept that what matters about experience is the functional role of the signature rather than any intrinsic feel. Ultimately, the Calibrator case shows that saving qualia requires changing the subject, which is precisely Dennett's point in quining them.

  For the marking scheme, award four marks for each of the five required moves, totaling twenty marks. The first move requires analyzing the four properties, where an A grade distinguishes between ineffability and privacy while noting signatures are reportable codes, whereas a B grade simply lists them without analyzing the functional nature of the signatures. Students typically botch this by claiming signatures are ineffable because they are internal to the subject. The second move concerns the inverted spectrum, where an A grade argues that subject-relativity makes the inversion unstatable rather than false, while a B grade claims it is simply impossible without explaining the bijective mapping. Students typically botch this by ignoring the stipulation that all mappings fit the evidence equally well. The third move addresses Mary, where an A grade frames her surprise as acquiring a capacity rather than a fact, while a B grade insists she learns a new fact about signatures. Students typically botch this by conflating signature knowledge with experience and missing the knowing-how distinction. The fourth move analyzes the residual gap, where an A grade identifies the relocation of the mystery to tokening, while a B grade claims the mystery is fully solved. Students typically botch this by missing the hard problem remainder regarding why tokening feels like anything. The fifth move requires a verdict on vindication versus elimination, where an A grade argues that relocation is elimination in disguise, while a B grade accepts the relocation as a valid solution. Students typically botch this by failing to connect the relocation to Dennett's broader eliminativist project and the definition of quining.
