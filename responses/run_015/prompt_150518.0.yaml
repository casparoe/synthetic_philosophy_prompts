      *   *Career Map:* Wed = Early years. Rigorous. Thu = Middle. The clause matters here. People thought she'd stop, but because not everyone agreed she would, she continued. Fri = Today.
      *   *The Surprise:* The moment she stepped down? Or the moment she published something personal? Let's make it the moment she embraced the "non-specialists." The surprise was that the logic was love.
      *   *The Hidden Assumption:* We assumed we all saw her the same way. We didn't. That diversity of view is her legacy.
      *   *Closing:* Name it. Raise a glass.

  6.  **Timing Check:**
      *   12 minutes @ 130 words/min = ~1560 words.
