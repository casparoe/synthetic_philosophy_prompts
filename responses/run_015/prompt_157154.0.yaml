answer: |-
  **1. The Fiduciary Mechanics**
  **Question:** In trust law, a fiduciary duty requires a settlor to create it, beneficiaries to hold it, and a court to enforce it. In your political model, citizens are beneficiaries, but there is no settlor and no superior court. If you remove the enforcement mechanism, doesn't the "duty" collapse into mere advice?
  **Follow-up:** You've argued this is a *structural* moral relation rather than a legal metaphor. But if the "court" is just public conscience, what gives the fiduciary the power to *command* rather than merely *recommend*?
  **Host's Note:** If she says "it's analogous" without explaining the binding force, she's dodging the enforcement gap.

  **2. The Origin of the Tie**
  **Question:** Fiduciary relationships usually arise from explicit undertaking or unavoidable dependency. Since you reject consent, does political subjection rest solely on our dependency on the state?
  **Follow-up:** If it rests on dependency, isn't this functionally the "rescue-based" account you explicitly rejected in your introduction?
  **Host's Note:** Watch for her denying the link between dependency and rescue theories while affirming dependency.

  **3. The Unbundling Proviso**
  **Question:** Your "unbundling proviso" suggests we owe obedience to any competent power, not just *this* state. Does this mean a well-run private protection agency or a benevolent occupying army generates the same obligation as a democratic state?
  **Follow-up:** If legitimacy is functional rather than source-based, are territorial borders morally arbitrary on your view?
  **Host's Note:** If she equivocates on "occupying army" vs. "transitional admin," press for a clear yes/no on borders.

  **4. The Epistemic Burden**
  **Question:** You argue authority is forfeited piecemeal. But judging whether predictive policing or budget allocations violate fiduciary loyalty requires expert knowledge. If ordinary citizens can't adjudicate this, how do they know what they owe?
  **Follow-up:** You might say we judge procedural transparency, not outcomes. But procedures can be transparently unjust; if citizens must defer to experts on substance, haven't you restored the technocratic authority you claimed to bypass?
  **Host's Note:** If she shifts goalposts between "procedure" and "outcome," she's avoiding the expertise problem.

  **5. The Settlement Function**
  **Question:** Law claims to settle coordination problems regardless of individual assessment. If authority is a "dimmer switch" that varies by domain, don't I reintroduce the coordination problem you sought to solve?
  **Follow-up:** If I opt out of the tax domain because I deem it disloyal while you comply, haven't we failed to coordinate, rendering the "partial authority" useless?
  **Host's Note:** If she minimizes the importance of uniform compliance, she's undermining the rule of law.

  **6. The Subjectivization Worry**
  **Question:** If I judge the state to be in breach, I may disobey; if you judge it loyal, you obey. Doesn't this make political obligation subjective, effectively licensing citizens to comply only when they independently approve?
  **Follow-up:** You'll say the standard is objective. But without a final arbiter to correct mistaken judgments, doesn't the "objective" standard dissolve in practice?
  **Host's Note:** If she claims objectivity without an adjudicator, she's ignoring the coordination problem.

  **7. The Punishment Proviso**
  **Question:** You demote accepting punishment from a duty to a strategy. But isn't accepting punishment what signals respect for the community rather than just self-interest?
  **Follow-up:** Without the willingness to suffer, how do we distinguish the fiduciary resister from a rational tax evader minimizing risk?
  **Host's Note:** If she conflates "sincerity" with "civic sacrifice," she's missing the communicative point.

  **8. The Institutional Remedy**
  **Question:** If the state breaches its fiduciary duty, is civil disobedience the only remedy, or does your theory demand institutional overhaul?
  **Follow-up:** If the institutions are the breach, who builds the new ones if obedience is forfeited?
  **Host's Note:** If she's vague on the transition from breach to reconstruction, the theory lacks a path forward.

  **9. The Normative Cost**
  **Question:** What is the most cherished democratic intuition your audience must give up to accept your "unbundling" and "proportionality" provisos?
  **Follow-up:** If the state isn't a unique moral entity, does patriotism or civic friendship lose its rational basis?
  **Host's Note:** If she downplays the emotional or cultural cost of the theory, she's underselling the trade-off.

  **10. The Falsifiability Test**
  **Question:** What specific empirical case or hypothetical scenario would prove your fiduciary model false?
  **Follow-up:** Can you describe a state that acts perfectly on our behalf but still lacks obligation? If it acts perfectly, why would obligation be absent?
  **Host's Note:** If she says "that's a research program" or offers vague theoretical shifts, she's insulating the view from critique.
