answer: |-
  This analysis treats the Terri Schiavo case not merely as a legal or medical dispute, but as a stress test for decision-theoretic frameworks designed to handle moral uncertainty. The case presents a "perfect storm" of deep moral disagreement, factual ambiguity (initially), and high stakes, making it an ideal candidate for examining where formal models of moral uncertainty succeed and where they fracture.

  ### Part I: Mapping the Decision Points

  We apply two frameworks: **Maximizing Expected Choiceworthiness (MEC)**, which sums the value of an action weighted by the credence in each moral theory, and the **Moral Parliament**, which models the decision as a negotiation between representatives of the theories in which the agent has credence.

  #### 1. Michael Schiavo's Initial Petition (1998)
  *   **Context:** Eight years post-arrest. Michael seeks to remove the tube based on prior oral statements by Terri.
  *   **Credences:** Michael likely held high credence ($>0.8$) in **Autonomy/Quality of Life** (Terri wouldn't want this; PVS is not a life worth living) and low credence ($<0.2$) in **Sanctity of Life** (viewing the tube as artificial intervention, not basic care).
  *   **MEC Recommendation:** The expected choiceworthiness of removal is high. Even if there is a 20% chance Sanctity of Life is true (and removal is a grave wrong), the 80% chance that Autonomy is true (and keeping her is a grave violation of her dignity/wishes) dominates, especially since the "harm" of death to a PVS patient is arguably zero in the QoL framework.
  *   **Moral Parliament Recommendation:** The Autonomy representatives hold a supermajority. They propose a motion to petition. The Sanctity representatives object, but lacking veto power in Michael's internal parliament, the motion passes.
  *   **Verdict:** Petition for removal.

  #### 2. The Trial Court Ruling (2000/2001)
  *   **Context:** Judge George Greer must determine if the evidence meets the "clear and convincing" standard for substituted judgment.
  *   **Credences:** The Court operates under a hybrid credence structure mandated by law: high credence in **Substituted Judgment** as the legal standard, conditional on evidence. The factual credence shifts as testimony is heard. By 2000, the Court assigns high credence ($>0.9$) to the diagnosis of PVS and the reliability of Michael's testimony regarding Terri's wishes.
  *   **MEC Recommendation:** The Court calculates the expected value of ruling for removal vs. non-removal. Given the high credence in the PVS diagnosis (fact) and the legal standard (procedure), the expected "legal-moral" error of *forcing* treatment on a person who refused it outweighs the error of *allowing* death for a person who might have wanted to live.
  *   **Moral Parliament Recommendation:** The "Legal Procedure" chair recognizes the Autonomy faction based on the evidentiary threshold. The Sanctity faction (represented by the parents' arguments) is heard but outvoted because the rules of order (law) prioritize the patient's inferred will over the state's interest in life once evidence is established.
  *   **Verdict:** Authorize removal.

  #### 3. The Final Removal (2005)
  *   **Context:** After years of legislative intervention and federal appeals, the courts re-affirm the original order. Medical consensus is solidified; autopsy later confirms massive brain atrophy.
  *   **Credences:** By 2005, factual uncertainty regarding Terri's consciousness is near zero (medical consensus). The moral uncertainty remains, but the **Sanctity of Life** faction has exhausted procedural avenues. For the executing agents (hospice staff/court officers), credence in the **Rule of Law** becomes a dominant moral factor.
  *   **MEC Recommendation:** The disutility of defying a final court order (social chaos, legal anarchy) is added to the calculus. Even for an agent with moderate Sanctity credence, the expected choiceworthiness of obeying the law + respecting autonomy now outweighs the lexical prohibition against killing, primarily because the "killing" is legally re-categorized as "allowing to die."
  *   **Moral Parliament Recommendation:** The Parliament is gridlocked externally, but the internal parliament of the decision-maker (the Sheriff/Clinical Director) is bound by the "Law" representative. The Law representative forms a coalition with Autonomy. Sanctity is overruled not on moral merit, but on procedural exhaustion.
  *   **Verdict:** Remove tube.

  ---

  ### Part II: Where the Framework Breaks

  The application above is smooth only if we ignore the structural pathologies inherent in the case. When we probe the mechanics of Moral Uncertainty, three critical failures emerge.

  #### 1. The Patienthood and Measure Problem
  **The Problem:** Standard MEC assumes a fixed population of welfare bearers whose interests are being summed. In Schiavo, the theories disagree on *who* is in the room.
  *   **Abstention vs. Zero:** If Theory A (Sanctity) says Terri is a person with a right to life, and Theory B (Physicalism/No-Patienthood) says Terri is a biological organism with no experiential interests, how does Theory B vote?
      *   If Theory B **abstains** (because there is no "her" to have interests), the decision defaults to Theory A. The status quo (keeping the tube) wins by default because the theory that perceives the most stakes controls the outcome. This biases the framework toward maximal moral patienthood.
      *   If Theory B **votes for removal** (because "nothing matters," so no harm is done), it aligns with Autonomy but for nihilistic reasons.
  *   **The Measure Problem:** MEC requires intertheoretic comparison of value. How do you compare "Violation of Autonomy" (Theory A) with "Commission of Murder" (Theory B)? Usually, we normalize scales. But if Theory B says the stake is *infinite* (sanctity) and Theory A says the stake is *finite* (quality of life), or if Theory B says the subject *does not exist*, there is no common denominator.
  *   **Breakdown:** The framework cannot handle **ontological uncertainty**. It treats the disagreement as one of *value* (how much is her life worth?) when it is actually about *existence* (is there a "her" to value?). MEC silently resolves this by forcing a common currency, effectively erasing the metaphysical disagreement that drove the conflict.

  #### 2. Lexical Prohibitions and the Veto
  **The Problem:** Many opponents of removal held a deontological view: "Direct killing of an innocent is intrinsically evil, regardless of consequences." This is a **lexical** priority.
  *   **MEC Collapse:** In expected value calculations, if $Value(Murder) = -\infty$, then $Credence(Murder) \times -\infty = -\infty$ for any non-zero credence. If the decision-maker has even 1% credence that removal is murder, MEC forbids removal absolutely. The framework becomes paralytic.
  *   **Parliament Workaround?** The Moral Parliament was designed to handle this by allowing trade-offs ("I won't vote for murder, but I'll let you pass this healthcare bill").
  *   **Breakdown:** In Schiavo, there was nothing to trade. The Sanctity faction (Parents/Congress) viewed the act as non-negotiable. A parliament requires a willingness to compromise. When one faction views the proposal as an existential moral evil, the Parliament does not negotiate; it vetoes. The framework pretends to offer a path through lexical disagreement, but in hard cases like this, it merely reveals that **compromise is impossible**. It relabels "irreconcilable conflict" as "failed negotiation."

  #### 3. Meta-Uncertainty: Who Chairs the Parliament?
  **The Problem:** You note that Substituted Judgment (SJ) is a decision procedure, not just a verdict. But MEC and Parliament require a procedure to aggregate the theories.
  *   **The Regression:** To run the Moral Parliament, you need rules of order. Do you use SJ? Best Interests? A Presumption for Life?
      *   If you choose **SJ** as the chair, you have already biased the outcome toward Autonomy (because SJ privileges prior wishes over current welfare).
      *   If you choose **Presumption for Life**, you bias toward Sanctity.
  *   **Breakdown:** The uncertainty isn't just first-order (Is killing wrong?); it is second-order (How do we decide when we don't know if killing is wrong?). Moral Uncertainty frameworks typically assume a neutral aggregation mechanism. In Schiavo, the fight *was* over the aggregation mechanism. The Florida legislature tried to switch the chair from "Substituted Judgment" to "Best Interests" (via *Terri's Law*). The Courts struck this down.
  *   **Result:** The framework cannot solve the case because the case is a conflict about **which framework should apply**. You cannot use moral uncertainty to resolve uncertainty about the rules of moral uncertainty.

  ---

  ### Part III: What Moral Uncertainty Cannot Explain

  Moral uncertainty is an **epistemic** tool for a **single agent** trying to be rational. The Schiavo case was a **political** conflict between **multiple agents** with incompatible worldviews. Here is what the framework misses:

  **1. The Disagreement Over Description (Framing)**
  Moral uncertainty assumes the options are defined: *Option A: Remove Tube; Option B: Keep Tube.*
  In reality, the parties could not agree on the description.
  *   For Michael: Option A was "Respecting Wishes/Stopping Treatment."
  *   For the Parents: Option A was "Starving a Disabled Woman."
  Moral uncertainty theory assumes we know the "acts" we are evaluating. It cannot explain how the **ontology of the act** itself is contested. When one side sees "omission" and the other sees "commission," expected choiceworthiness is incalculable because the inputs are different.

  **2. The Erosion of Decision-Making Over Time**
  Moral uncertainty models are static snapshots. They do not account for the **cost of deliberation**.
  Fifteen years of litigation drained the estate, hardened positions, and turned a private tragedy into a public spectacle. A rational decision-maker under uncertainty should update credences and decide. Instead, the uncertainty was **weaponized**. The Parents used factual uncertainty (is she conscious?) to delay moral resolution. The Legislature used moral uncertainty (is this killing?) to seize power.
  The framework treats uncertainty as a barrier to be managed; the case shows uncertainty can be a **resource to be exploited** by actors seeking strategic advantage.

  **3. Epistemics vs. Politics**
  Finally, moral uncertainty captures the **epistemics of moral disagreement** (how an individual weighs conflicting values) but fails to capture the **politics of moral disagreement** (how groups with incommensurable values coexist).
  *   **Epistemics:** "I am 60% sure Autonomy is right."
  *   **Politics:** "I have the power to pass a law stopping you, even if I am only 10% sure I am right."
  The Schiavo intervention by Congress was not an exercise in maximizing expected choiceworthiness; it was an exercise in raw majoritarian power responding to constituency pressure.

  **Conclusion: A Better Framework?**
  The Schiavo case suggests that Moral Uncertainty is insufficient for public bioethics. It needs to be supplanted or supplemented by a framework of **Public Reason** (Rawls) or **Agonistic Pluralism** (Mouffe).
  *   **Public Reason** acknowledges that we cannot agree on the "true" moral theory, so we must agree on *procedural* legitimacy (e.g., who has legal authority). This explains why the Court's final ruling mattered more than the moral truth: the system needed a terminal point.
  *   **Agonistic Pluralism** accepts that some conflicts are not solvable by rational aggregation. They are clashes of identities. The solution is not to calculate the right answer, but to manage the conflict so it doesn't destroy the polity.

  Moral uncertainty theory asks, "What is the right thing to do given my doubt?" The Schiavo case answers, "When doubt is this deep and stakes are this high, the question shifts from 'What is right?' to 'Who decides?'" The framework breaks because it tries to solve a problem of **authority** with tools designed for **deliberation**.
