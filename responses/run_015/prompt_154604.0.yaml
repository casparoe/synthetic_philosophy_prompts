answer: |-
  To count as adequate, an account of the end of Roman government in the West must meet the following specification. It is not enough to narrate events; the argument must resolve specific structural tensions.

  **Core Phenomena**
  1.  **Divergence:** Explain why East and West, sharing institutions, enemies, and political language, produced different outcomes.
  2.  **Tempo:** Reconcile slow fiscal and military reshaping with punctual events people remembered (sacks, 476).
  3.  **Continuity:** Define transformation vs. collapse using stubborn continuities (senate, law, bishops, estates) testably, not rhetorically.
  4.  **Regionality:** Treat Britain, Gaul, and Africa as distinct cases, not a single story.
  5.  **Evidence:** Resolve conflicts between textual narratives (literate Christian men) and material records (coins, pottery, settlement).

  **The Evidence Problem**
  An adequate account must explicitly state a hierarchy of evidence. When texts claim stability but pottery shows distribution collapse, the account must declare which wins. Texts often preserve the *idea* of Rome while material records track the *capacity* of the state. Silence is not neutrality; it is a choice. If the argument relies on textual continuity, it must explain away material contraction. If it relies on material data, it must explain why contemporaries claimed otherwise.

  **Your Requirement: Legibility**
  *Status:* **Preference.**
  *Cost:* This excludes structural causes invisible to actors (e.g., demographic shifts, soil exhaustion, macroeconomic liquidity). It privileges political narrative over material reality. If kept, the explanation must be rooted in perceived legitimacy and immediate choice, not long-term systemic failure. It prevents the historian from using categories (like "economic collapse") that no contemporary possessed.

  **Classification of Requirements**

  | Requirement | Status | Conflict/Cost |
  | :--- | :--- | :--- |
  | **Regional Variation** | Non-negotiable | Eliminates monocausal theories (e.g., "one plague ended everything"). |
  | **Evidence Hierarchy** | Non-negotiable | Forces choice between textual prestige and material data. |
  | **Continuity Definition** | Non-negotiable | Must define "collapse" testably, not rhetorically. |
  | **East/West Divergence** | Non-negotiable | Eliminates explanations relying solely on barbarian pressure. |
  | **Legibility (Yours)** | Preference | Conflicts with structural/material explanations. |
  | **Process/Event Match** | Preference | Often requires narrative smoothing over data gaps. |

  **Incompatible Triad**
  You cannot simultaneously satisfy: (1) Strict Legibility, (2) Material Evidence Primacy, and (3) Structural Economic Explanation. Contemporaries did not see pottery distribution curves. If you prioritize their view, you lose the material record's weight. If you prioritize material data, you lose their perspective.

  **Most Eliminative Requirement**
  **Evidence Hierarchy.** Most traditional narratives rely on textual continuity to claim political survival. Demanding alignment with material contraction (coinage, settlement size) eliminates the majority of "transformation" accounts that posit smooth transitions despite economic collapse.

  **Verdicts on Standard Families**
  1.  **Moral/Constitutional Decay:** Fails regional variation; ignores material evidence.
  2.  **Barbarian Invasion:** Fails East/West divergence; ignores fiscal continuity.
  3.  **Economic Rupture:** Fails legibility; struggles with cultural continuity.
  4.  **Cultural Transformation:** Fails evidence hierarchy; often ignores material collapse.
  5.  **Systemic Failure:** Fails legibility; requires hindsight unavailable to actors.
