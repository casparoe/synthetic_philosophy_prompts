  **1. Prior probability on a nondescript, centrally placed building of this size being non-domestic**
  **0.15** — In hamlets of ~12 households, social complexity rarely sustains functionally exclusive architecture distinct from elite residences.

  **2. Evidentiary weight of the absence of hearth and domestic toolkit**
  **0.60** — While exclusionary for a standard family unit, this profile fits alternative residential models like men's houses, guest quarters, or seasonal storage.

  **3. Diagnosticity of the niche and replastering sequence given the second building**
  **0.40** — The edge building demonstrates that high-maintenance floors and niches can coexist with domestic processing, normalizing these traits as status markers rather than shrine exclusives.

  **4. Interpretation of the forelimb pattern (deposition vs. butchery/taphonomy) at n = 140**
  **0.85** — A 70% skew toward a specific skeletal element is statistically inconsistent with random consumption waste or natural taphonomy, strongly indicating selective deposition.

  **5. Validity of the house/shrine dichotomy versus a domestic shrine or public building**
  **0.45** — Small-scale societies often embed ritual within domestic or communal spaces, making a binary classification likely to obscure a mixed-function reality.

  **Combined Credence: 0.52**
  *(This reflects a high probability of ritual *activity* occurring within the space, but significant uncertainty regarding whether that activity excludes residential or communal domestic function.)*

  ***

  **The Gap Carrier**
  The sub-question most likely carrying the 0.45 gap between you and your PI is **#5 (The House/Shrine Dichotomy)**. Your PI likely treats "ritual activity" and "shrine building" as synonymous (binary), whereas your lower credence suggests you view the building as potentially domestic *with* ritual functions (spectrum). If the category "Shrine" implies "Non-Residential," the PI's 0.85 assumes the bone evidence proves non-residentiality, while your 0.4 assumes the bone evidence only proves ritual *use* within a potentially residential or multi-purpose structure.

  **Single Further Line of Evidence**
  **Micromorphological thin-section analysis of the plastered floor sequence.**
  This would distinguish between trampling and organic decay associated with sleeping/living (domestic) versus repetitive cleaning, burning, or lack of micro-debris associated with restricted ritual access. A confirmation of domestic trampling patterns would lower my credence to **0.20**; a confirmation of ritual cleaning/maintenance would raise it to **0.80**.
