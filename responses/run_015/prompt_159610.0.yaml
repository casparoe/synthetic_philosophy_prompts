  ### Physicist's Note

  **The Setup**
  To satisfy the condition that every pair of events is spacelike separated (meaning no signal traveling at light speed could connect them), the events are distributed globally and beyond.
  1.  **Kettle:** London, UK.
  2.  **Door:** New York, USA.
  3.  **Hand:** Sydney, Australia.
  4.  **Star:** Andromeda Galaxy (2.5 million light-years away).
  5.  **Leaf:** Cape Town, South Africa.
  6.  **Coin:** Tokyo, Japan.

  **The Frames**
  In the "Rest Frame" (Stanza 1), all six events are synchronized to occur at $t=0$ using Einstein synchronization via atomic clocks. Because the spatial distance between any pair is greater than zero, and the time difference is zero, the interval between any pair is spacelike ($ds^2 > 0$).

  Each subsequent stanza represents an observer moving at a relativistic velocity ($v \approx 0.5c$) in a specific vector relative to the Rest Frame.
  *   **Stanza 2:** Moving Tokyo → London. (Coin precedes Kettle).
  *   **Stanza 3:** Moving Sydney → Tokyo. (Hand precedes Coin).
  *   **Stanza 4:** Moving Andromeda → Sydney. (Star precedes Hand).
  *   **Stanza 5:** Moving New York → Andromeda. (Door precedes Star).
  *   **Stanza 6:** Moving Cape Town → New York. (Leaf precedes Door).

  Because the events are spacelike separated, the Lorentz transformation allows the time ordering ($t'$) to flip depending on the velocity vector. There is no invariant "before" or "after" for these events.

  **Verification of Swaps**
  The standard sestina permutation ensures that for every pair of end-words, there is at least one stanza where their order is reversed compared to Stanza 1. For example, in Stanza 1, **Kettle** (line 1) precedes **Door** (line 2). In Stanza 4, **Door** (line 6) follows **Kettle** (line 5). Wait, in Stanza 4, Kettle is line 5, Door is line 6. They are still Kettle then Door.
  *Correction:* In Stanza 6, **Door** is line 2, **Kettle** is line 6. Here, Door precedes Kettle. The swap exists.
  I checked all 15 pairs; the standard sestina rotation guarantees every pair swaps relative order at least once across the six stanzas. This matches the physics: for any two spacelike events, there exists some frame where A is before B, and some frame where B is before A.

  **The Philosophical Step (and Objection)**
  The poem argues for the "Block Universe" (Eternalism): if the order of events depends on the observer's speed, then no single order is "true." If no order is true, then the future (the Star dying) must be just as real as the present (the Kettle boiling), otherwise reality would depend on velocity.

  *Objection:* This step is contested. Presentists argue that "real" applies only to the local "now" along an observer's worldline, not to a global simultaneity slice. They claim the relativity of simultaneity shows there is no *global* present, not that the future *exists*. The poem assumes the Rietdijk-Putnam conclusion (no privileged frame → all slices equally real → block universe) is valid, but a philosopher in the room might argue that "reality" doesn't require a shared "now," only causal connectivity. The poem ignores this to land the emotional weight of the Block Universe.
