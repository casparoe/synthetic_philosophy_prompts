          1.  Does it reference an ID? (No -> Admit).
          2.  Does it reference *itself*? (Yes -> Reject/Escalate).
          3.  Does it reference a claim that references *it*? (Hard to know at entry... requires Escalation).
          4.  What is the semantic content? (Asserting Falsehood vs. Asserting Truth).
      *   *Refinement:* The user wants a procedure analysts can run *on a proposed claim*. They have the schema open. They can see existing rows. They *cannot* see future rows.
