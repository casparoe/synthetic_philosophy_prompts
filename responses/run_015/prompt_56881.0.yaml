          *   **Constraint:** Case 3 (Regulatory bulletin) *must* be admitted (load-bearing). If the logic says reject, provide the least-bad workaround, don't soften the verdict.
          *   **Honesty Check:** If the framing is wrong (fix belongs in the evaluator, not triage), say so at the top.

  2.  **Initial Assessment & Framing Check (The "Honesty Check"):**
      *   *The User's Question:* "If you think I've framed this wrong... tell me that at the top."
      *   *My Analysis:* The user is trying to solve a *runtime evaluation* problem (circular dependencies in a rule engine) with a *data entry* constraint (triage checklist).
      *   *Logic:* Circular dependencies are a structural property of the *graph* of claims, not just individual claims. You often can't know if Claim A creates a cycle until you see Claim B. A triage checklist on a single claim cannot guarantee no cycles will form later unless you ban *all* references (which the user says is unusable).
      *   *Theory:* Tarski's hierarchy of languages prevents self-reference by separating object language and meta-language. Kripke's fixed-point semantics allows truth-value gaps (Unverified) for paradoxical sentences. Paraconsistency allows contradictions without explosion.
      *   *Engineering Reality:* A pre-entry checklist *cannot* mathematically guarantee no deadlocks in a dynamic system where new nodes are added constantly, unless it bans edges (references). The deadlock happens in the *evaluator*.
      *   *Verdict:* The framing *is* partially wrong. A triage checklist helps, but it cannot solve the cycle problem alone. The evaluator needs to handle cycles (e.g., via iteration limits, three-valued logic fixed-point iteration, or marking cycles as 'Unverified'). However, since the user asked for the procedure *and* told me to be straight, I need to lead with the hard truth: **This procedure cannot guarantee safety on its own.** It reduces risk, but the engine must be robust to cycles.
      *   *Decision:* I will state this clearly at the top, but then provide the requested procedure because it *does* add value (filtering obvious paradoxes) even if it's not a silver bullet. I will design the procedure to minimize *direct* self-reference and obvious small cycles, pushing the rest to the "Escalate" bucket.

  3.  **Designing the Procedure (The "Triage Protocol"):**
      *   *Theoretical Basis:*
          *   **Tarski:** Separate levels. Claims about claims are "higher level."
          *   **Kripke:** Allow "Unverified" (gaps) for problematic nodes.
          *   **Engineering:** Detect direct self-reference and simple mutual reference.
      *   *Simplification:* Drop modal logic, drop complex graph theory. Keep "Points to ID?" and "What is the target's status?"
