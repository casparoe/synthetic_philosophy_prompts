answer: |-
  ### 1. The Hard Truth (Framing Check)

  You asked me to tell you plainly if you've framed this wrong. **You have.**

  You are trying to solve a *structural* problem (circular dependencies in a graph) with a *procedural* filter (analyst triage). No checklist run by a human on a single row can guarantee that a cycle won't form later when a second row is added. If Claim A references Claim B, an analyst can approve it. If Claim B is added tomorrow referencing Claim A, your deadlock returns. The triage procedure reduces noise, but it cannot mathematically prevent deadlocks in a dynamic system.

  **The real fix belongs in the evaluator.** Your engine needs to detect cycles at runtime and assign a default status (e.g., "Unverified") to any node caught in a loop, rather than spinning. This is standard "fixed-point iteration" handling in logic programming.

  **However,** I will give you the procedure you asked for. It will act as a *risk reducer*, filtering out the obvious paradoxes that crash naive evaluators, while flagging complex dependencies for you (the Lead) to handle architecturally. Do not treat this checklist as a safety guarantee. It is a sieve, not a shield.

  ---

  ### 2. The Claim Intake Filter (Procedure v1.0)

  **Audience:** Analysts.
  **Time:** ~15 minutes per complex claim.
  **Tools:** Claims Schema, Search Tool.

  **Start:** Open the proposed claim text.

  #### Step 1: The Reference Check
  **Question:** Does the text explicitly mention a Claim ID (e.g., "Claim #4711") or point to a specific document that maps to a Claim ID?
  *   **NO:** **ADMIT (Standard).** Proceed to normal entry.
  *   **YES:** Go to Step 2.

  > **[CONFIDENCE: HIGH - Theory]** This distinguishes *Object Language* (facts about the world) from *Meta-Language* (facts about claims). Tarski's hierarchy suggests keeping these separate prevents paradox.
  > **[DECISION IN DISGUISE]** We are treating "references to IDs" as the trigger for danger. This ignores semantic references (e.g., "the claim filed yesterday"), which will slip through.

  #### Step 2: The Self-Reference Check
  **Question:** Is the Claim ID mentioned in the text the *same* ID as the one being created? (Or does the text say "this claim," "the present statement," etc.?)
  *   **YES:** **ESCALATE TO LEAD.** Do not enter.
  *   **NO:** Go to Step 3.

  > **[CONFIDENCE: HIGH - Theory]** Direct self-reference ("I am false") is the primary source of Liar Paradoxes.
  > **[EXPECTED MISFIRE]** Indirect self-reference (Claim A points to B, B points to A) will pass this step. That is why Step 4 exists.

  #### Step 3: The Polarity Check
  **Question:** What status does the claim assert about the target ID?
  *   **"True" / "Accurate" / "Verified":** Go to Step 4.
  *   **"Unverified" / "Unknown":** **ADMIT (Permanently Unverified).** Enter the claim, but hard-lock its status to `UNVERIFIED`. It cannot be used to prove other things.
  *   **"False" / "Inaccurate" / "Denied":** **ESCALATE TO LEAD.**

  > **[CONFIDENCE: MEDIUM - Engineering Heuristic]** In 3-valued logic (Kripke), asserting "Unverified" is usually stable. Asserting "False" creates the highest risk of contradiction cycles (A says B is False, B says A is False).
  > **[DECISION IN DISGUISE]** Locking "Unverified" claims to a static status is a policy choice to prevent them from propagating uncertainty. We are sacrificing utility for stability.

  #### Step 4: The Cycle Sniff (The "Lookback")
  **Question:** Search the registry for the Target ID from Step 1. Does that Target Claim *already* reference the ID you are trying to create (or a draft ID reserved for this)?
  *   **YES:** **REJECT.** This creates an immediate circular dependency.
  *   **NO:** **ADMIT (Monitored).** Enter the claim, but tag it `RISK_CYCLE`.

  > **[CONFIDENCE: LOW - Improv]** An analyst cannot know if a *future* claim will close the loop. This step only catches existing loops.
  > **[DECISION IN DISGUISE]** Tagging it `RISK_CYCLE` is a signal to you (the Lead) to monitor the evaluator logs. It shifts the burden from prevention to detection.

  #### Step 5: The Authority Override (The "Bulletin" Clause)
  **Question:** Is this claim part of a bulk import from a Regulatory Body or Trusted Authority (e.g., a Compliance Bulletin)?
  *   **YES:** **ADMIT (Ground Truth).** Bypass evaluation. Hard-lock status to `TRUE`.
  *   **NO:** Proceed to final entry based on previous steps.

  > **[CONFIDENCE: HIGH - Engineering Necessity]** This is the only way to handle Case 3 without logical collapse.
  > **[DECISION IN DISGUISE]** This declares certain data as "Axioms" rather than "Claims." It breaks the logical symmetry to save the system.

  ---

  ### 3. Distinctions: What Survives vs. What Drops

  **Keep These (Critical):**
  1.  **Self vs. Cross Reference:** Direct self-reference is computationally cheap to detect and highly dangerous. Keep Step 2.
  2.  **Assertion of Falsehood:** Claims that negate other claims are exponentially more likely to cause contradiction cycles than claims that affirm. Keep Step 3.
  3.  **Axiom vs. Claim:** You must distinguish between data that *is* the rules (Bulletins) and data that *follows* the rules (Claims). Keep Step 5.

  **Drop These (Safe to Simplify):**
  1.  **Implicit Reference:** Don't ask analysts to hunt for "the claim filed yesterday." If it doesn't have an ID, treat it as non-referential. It's too hard to enforce.
  2.  **Complex Logic Chains:** Don't ask analysts to trace chains (A->B->C->A). They will fail. Rely on the `RISK_CYCLE` tag and your engine's timeout logic.
  3.  **Paraconsistent Nuance:** Don't try to teach analysts about "true contradictions." If it looks contradictory, Escalate.

  ---

  ### 4. Running the Cases

  #### Case 1: The Liability Dispute (Mutual Falsehood)
  *   **Scenario:** Claimant A files "Claimant B's statement is False." Claimant B files "Claimant A's statement is False."
  *   **Run:**
      1.  **Reference Check:** YES (References B's Claim ID).
      2.  **Self-Reference:** NO (References B, not A).
      3.  **Polarity:** Asserts "False". -> **ESCALATE TO LEAD.**
      4.  *(If Analyst ignores Step 3 and goes to Step 4)*: **Cycle Sniff:** When A is entered, B doesn't exist yet. Passes. When B is entered, A exists. If A references B, Step 4 catches it.
  *   **Verdict:** **ESCALATE.**
  *   **Why:** Asserting falsehood is high-risk.
  *   **Outcome:** You (Lead) receive this. You recognize the potential for a Liar Cycle. You enter them both but tag them `RISK_CYCLE`. Your evaluator must be configured to detect the A<->B dependency loop and assign both `UNVERIFIED` rather than spinning.
  *   **Confidence:** **HIGH.** This is exactly what the filter is designed to catch.

  #### Case 2: The Self-Unverified Claim
  *   **Scenario:** A claim auto-generated from a form field says: "This claim is Unverified."
  *   **Run:**
      1.  **Reference Check:** YES ("This claim").
      2.  **Self-Reference:** YES. -> **ESCALATE TO LEAD.**
  *   **Verdict:** **ESCALATE.**
  *   **Why:** Direct self-reference is banned in Step 2.
  *   **Theory Note:** In Kripkean semantics, "This sentence is Unverified" can be a stable fixed point (if it is Unverified, the statement is true, which is consistent). However, your engine treats statuses as inputs for rules. A rule depending on its own output is a recursion error waiting to happen.
  *   **Workaround:** Do not store this as a *Claim Row*. Store it as *Metadata* on the claim. "Verification Status: Pending." Do not let the rule engine query it as a proposition.
  *   **Confidence:** **MEDIUM.** Theoretically stable in 3-valued logic, but engineering-wise dangerous for a naive evaluator.

  #### Case 3: The Regulatory Bulletin (The Load-Bearing Paradox)
  *   **Scenario:** A bulletin import. Last line: "Everything in this bulletin is accurate."
  *   **Run:**
      1.  **Reference Check:** YES ("Everything in this bulletin" implies the rows being created).
      2.  **Self-Reference:** YES (The set includes the statement itself).
      3.  **Polarity:** Asserts "True/Accurate".
      4.  **Authority Override:** YES (Regulatory Bulletin). -> **ADMIT (Ground Truth).**
  *   **Verdict:** **ADMIT (Ground Truth).**
  *   **Why:** Step 5 overrides the logical risk.
  *   **The Hard Truth:** Logically, this is ill-formed (Tarski). A language cannot contain its own truth predicate without risk of contradiction. If *any* line in the bulletin is false, the last line makes the whole set paradoxical.
  *   **The Least-Bad Workaround:**
      *   **Do not** import the last line as a claim row.
      *   **Do** import the substantive lines (1 through N-1).
      *   **Apply** the "Ground Truth" hard-lock (Status = TRUE) to rows 1 through N-1 *by virtue of the import source*, not because the last line says so.
      *   **Discard** the last line or store it as a comment string that the engine ignores.
      *   **Reasoning:** You need the *content* of the bulletin, not the *self-validation* of the bulletin. The validation comes from your business agreement with the regulator, not the text of the file. If you ingest the last line as a rule, you invite a universal quantifier over a changing database, which is a maintenance nightmare.
  *   **Confidence:** **HIGH (Engineering) / LOW (Logic).** Logically, you are sweeping the paradox under the rug. Engineering, you are treating the source as an Oracle. This is the only way to keep the system running.

  ---

  ### 5. Where This Will Misfire (Expectation Management)

  1.  **The "Delayed Cycle":** Analyst approves Claim A (references B). Next week, Analyst approves Claim B (references A). Step 4 missed this because B didn't exist yet.
      *   *Mitigation:* Your evaluator *must* have a recursion depth limit (e.g., 10 iterations). If it doesn't resolve, force status to `UNVERIFIED`.
  2.  **The "Semantic Loop":** Claim A references "The claim filed by John Doe on Monday." No ID used. Step 1 passes.
      *   *Mitigation:* Accept this loss. It's too expensive to parse natural language for IDs at intake.
  3.  **The "Bulletin Drift":** A bulletin says "All claims of Type X are True." New claims of Type X are added later.
      *   *Mitigation:* Treat bulletins as snapshots. They apply to claims existing *at time of import*. Do not let old bulletins evaluate new claims automatically.

  ### 6. Final Recommendation

  Implement the **Claim Intake Filter** immediately to stop the bleeding of obvious paradoxes. But simultaneously, task yourself (the Lead) with modifying the **Evaluator**:
  1.  Implement **iteration limits** (stop spinning after N passes).
  2.  Implement **cycle detection** (if Node A waits on Node B which waits on Node A, mark both `UNVERIFIED`).
  3.  Implement **Priority Levels** (Bulletins = Level 0, Claims = Level 1). Level 0 is never evaluated; it is axiom.

  The checklist protects the humans from the data. The evaluator changes protect the system from the logic. You need both.
