          *   Result: Escalate. (Logic: Potential Liar Cycle).
      *   *Case 2 (Self-Unverified):* "This claim is Unverified."
          *   This is actually stable in 3-valued logic! If it's Unverified, the statement is true. If it's True, the statement is false (contradiction). If it's False, the statement is true (contradiction). Wait.
          *   "This claim is Unverified."
          *   If Status = Unverified -> Statement is True. (Mismatch: Status is U, Content says U. Consistent?)
          *   Actually, usually "This claim is False" is the Liar. "This claim is Unverified" is a "Truth-Teller" variant in 3-valued logic.
          *   However, for the engine, it creates a dependency on itself.
