          *   Why? Because the defeaters were so loud that AR's default entitlement was overridden.
          *   The difference is procedural. R requires *positive* proof of reliability upfront. AR requires *negative* proof of unreliability to stop.
          *   Ordinary care aligns more with Local Reductionism here (verify the source).
      *   *Section 3: The Three Stressors.*
          *   *Institution:* The "hearer" was fragmented. Epistemology of testimony assumes a unified subject. This suggests we need a *Social* Epistemology of Testimony, not just individual.
          *   *Incentives:* Curveball's asylum bid makes Local Reductionism very strong. It turns the problem into a standard risk assessment. This suggests Local Reductionism is robust but perhaps trivializes "testimony" into "evidence."
          *   *Action/Assertion:* The cost of error was war. This invokes "Pragmatic Encroachment." The warrant required for *acting* on testimony is higher than for *believing* it. The failure was asserting without knowledge.
      *   *Conclusion:* What does this mean for the R vs. AR debate?
          *   It suggests the debate might be too abstract for high-stakes institutional contexts.
          *   AR is too vulnerable to institutional siloing (defeaters get lost).
          *   R is more robust but demands resources (verification) that intel agencies sometimes bypass for speed.
          *   Final thought: The problem wasn't the *norm* of testimony, but the *structure* of the community transmitting it.

  6.  **Refining the Argument (Self-Correction/Nuance Check):**

