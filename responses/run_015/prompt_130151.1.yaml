answer: |-
  In the case as set out, Ada's refraining is not a cause. Her default was fixed by the physician's order and her standing rule to obey it; she conformed to what was expected. Blythe violated her duty, departing from her default, so her omission caused the death. You claim this makes causation float free of physical history, but that presupposes causation must be purely physical. I deny that. Normative facts—duties, orders, rules—are real features of the world that fix causal structures in social systems just as physical laws do in mechanical ones. When expectations change, the causal structure changes because the system itself differs, not because our bookkeeping shifts. Regarding conflicting defaults, the ranking is not imported from blame but determined by institutional hierarchy. The physician's order objectively overrides the general expectation within that ward. We discover this ranking; we do not invent it to assign blame. Thus, the causal fact is fixed by the normative architecture, which is as objective as the physical architecture, leaving no room for your charge that "cause" is merely doing moral bookkeeping.
