      Okay, so there was a shift in editors, or a overlap. Let's say the previous editor retired, the new one took over, and their styles clashed so hard the narrative fractured. Now they need to pick one to continue.
      Actually, better: The clinic is merging files. Or a review board is auditing. Let's go with a Renewal Hearing. The funding requires a coherent narrative arc. The current state is disjointed because the two editors worked simultaneously for a month during a transition.
      No, simpler: The patient was assigned two editors due to a clerical error during a pilot program. Now it must be resolved.
      Let's go with the Committee Review.

