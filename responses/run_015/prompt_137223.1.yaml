answer: |-
  The two binders sat on the conference table like bookends holding up nothing. One was navy blue, the other charcoal gray. Both were thick, stuffed with paper that had been printed, corrected, and printed again. Between them sat Dr. Aris Thorne, rubbing the bridge of her nose. The fluorescent lights of the St. Jude Continuity Clinic hummed with a low, headache-inducing frequency.

  "Mr. Vance is getting restless," said the man in the gray suit. He was from insurance, though he preferred the title 'Resource Allocation Specialist.' His name was Miller. "If we don't renew the authorization by noon, the editors lose access to the server. The ledger locks."

  "If the ledger locks, Mr. Vance locks," Thorne said. She looked at the door. Through the frosted glass, she could see the shadow of a man pacing. Elias Vance. Forty-five years old. Diagnosis: Narrative Apraxia, Stage III. Without the ledger, Elias would wake up tomorrow with no idea why he owned a coffee mug, why he wore a wedding ring on a chain around his neck, or why he flinched at the sound of sirens. He would be a collection of reflexes waiting for a prompt.

  "We have two competing narratives," Miller said, tapping the charcoal binder. "Editor Kael and Editor Ross. They've been working the same case for six months due to the transition overlap. They haven't synchronized."

  "They haven't just failed to synchronize," Thorne said, opening the navy binder. "They've diverged. Look at Entry 402."

  She slid the paper across the table. The font was Courier, sterile and monospaced.

  *Subject attended the anniversary dinner. He wore the blue tie his wife purchased. He felt a sense of dutiful obligation, honoring a promise made in healthier times. The meal was quiet. He left early to maintain his sleep schedule.*

  Thorne opened the charcoal binder to the same date.

  *Subject attended the anniversary dinner. He wore the blue tie to mask his indifference. He felt a surge of guilt that he interpreted as obligation. The meal was tense. He left early because the noise triggered a memory of the accident.*

  "Same facts," Thorne said. "Tie, dinner, early departure. Different causality. In the navy version, Elias is a grieving widower maintaining stability. In the charcoal version, he's a man struggling with resentment and trauma."

  "Does it matter?" Miller asked. "He retains functionality in both models."

  "It matters for the renewal criteria," Thorne said. "The clinic mandates a coherent arc. We can't have a patient oscillating between a stoic martyr and a volatile survivor every time we switch editors. The cognitive dissonance causes somatic stress. His blood pressure spikes when the narrative voice changes."

  The door opened. Editor Ross entered. She was young, wearing scrubs that were too crisp. She carried a tablet. "Mr. Vance is asking who he is today," she said. "He looked at his reflection in the window and asked if he looked tired. I told him he looked rested. He believed me for about four minutes. Then he asked again."

  "Sit down, Ross," Thorne said. "Where is Kael?"

  "Kael is with the patient. He's reading from the charcoal draft. Trying to stabilize him until we decide."

  Thorne looked at Miller. "If we authorize the navy ledger, Ross continues. Elias becomes the stoic widower. The resentment is edited out of his past. He remembers the marriage as stable, the death as a clean loss. If we authorize charcoal, Kael continues. Elias remembers the conflict. He remembers the accident was partially his fault."

  "Which one is true?" Miller asked.

  Thorne paused. This was the question that kept the clinic funded and the philosophers away. "We don't know. The apraxia wiped the internal record five years ago. The ledgers *are* the record. Whatever we authorize becomes the truth within the hour of reading."

  "Which one is cheaper?" Miller asked.

  Ross shifted in her chair. "The navy narrative requires less therapy. Stoicism is low-maintenance. The charcoal narrative requires weekly trauma processing. If we go charcoal, we need double the session hours."

  Miller nodded, making a note. "And prognosis?"

  "Both lead to functional independence," Thorne said. "But the navy version creates a smoother citizen. The charcoal version creates a more complex human being. Or a more troubled one. Depending on how you view the utility of suffering."

  "Make a choice, Doctor," Miller said. "I have a call at eleven."

  Thorne looked at the binders. They were heavy. They contained the weight of a life. Inside those pages, Elias Vance had loved, failed, worked, and slept. Outside the pages, he was sitting in a hallway, staring at his hands, waiting for someone to tell him what the scars on his knuckles meant.

  She thought about the first time she'd seen Elias without a ledger. He had been found wandering a highway, unable to explain why he was driving or where he was going. He had a wallet, but the ID was just a card with a picture of a stranger. He had no story to connect the man in the photo to the man in the driver's seat. The clinic had given him back his life, but they had also written it.

  "Ross," Thorne said. "If we go with navy, do we purge the charcoal entries?"

  "We archive them," Ross said. "But yes, for the purpose of the active narrative, they cease to be accessible. If he reads a revised navy entry replacing a charcoal one, the charcoal memory dissolves. He won't just forget it; he won't be able to conceive that it ever happened."

  "And if we go charcoal?"

  "Then we have to revise the stoic entries. He'll remember the resentment. He might cry. He might get angry."

  Thorne looked at the door again. The shadow was still pacing.

  "There's a third option," said a voice from the corner. Editor Kael had entered silently. He was older than Ross, his clothes rumpled. He held a pen like a weapon. "We merge them. We create a third ledger."

  "That violates protocol," Miller said immediately. "Inconsistent voice structure risks fracture."

  "It's the only honest way," Kael said. "He wasn't stoic, and he wasn't just resentful. He was both. People are contradictory. If we force him into a single arc, we're not treating him. We're filing him."

  "If we file him, he can live alone," Miller said. "If we keep him complex, he needs institutional support. We don't have the beds, Kael."

  Thorne looked at the two editors. They weren't fighting over facts. They were fighting over genre. Ross was writing a recovery story. Kael was writing a tragedy. Elias was the paper they were writing on.

  "Mr. Vance cannot hold the contradiction," Thorne said softly. "His brain won't bind the conflicting motivations. He needs a center of gravity. If we give him two, he falls."

  "Then give him the one that lets him sleep," Ross said.

  "Give him the one that lets him feel," Kael countered.

  Thorne closed both binders. The sound was like a gavel. "Miller, if I authorize the navy ledger, does that meet the efficiency metrics?"

  "It meets them comfortably."

  "And if I authorize charcoal?"

  "It flags for review."

  Thorne stood up. She picked up the navy binder. It felt smooth, cool. The charcoal one was rougher, the edges worn from Kael's frequent handling. She thought about Elias in the hall. If she chose navy, he would walk out of here calm. He would go home to a quiet apartment. He would drink coffee from a mug he understood. He would never wonder why he sometimes hated the sound of his wife's name.

  If she chose charcoal, he would weep. He would have to work for every moment of peace. He would be real, in the way that hurts.

  But was he real now? Or was he just a vessel waiting to be filled?

  "Ross," Thorne said. "Prepare the navy ledger for renewal. Purge the charcoal entries regarding the anniversary dinner and the accident causality."

  Kael stood up abruptly. "Doctor—"

  "Sit down, Kael," Thorne said. She didn't look at him. "We are a clinic, not a biography project. Our mandate is continuity, not authenticity."

  "That's not what you told me in training," Kael said.

  "That was before the budget cuts," Miller said, standing up. He gathered his papers. "Good decision, Doctor. I'll process the authorization."

  Miller left. Kael lingered for a moment, looking at the charcoal binder as if it were a dead animal. Then he picked it up and walked out without a word. Ross exhaled, a sound of relief that felt like guilt.

  "Go get him," Thorne said. "Let's finish this."

  Ross nodded and went to the door. She returned a moment later with Elias. He looked ordinary. Gray hair, slight stoop, eyes that were clear but empty, like windows in a house where no one lives.

  "Mr. Vance," Thorne said. "Please sit."

  Elias sat. He looked at the navy binder. "Is that mine?"

  "It is," Thorne said. "We've updated the records. There were some inconsistencies we needed to correct."

  "Okay," Elias said. He didn't ask what the inconsistencies were. He didn't have the framework to worry about them.

  Ross opened the binder to Entry 402. She slid it across the table. "Please read this aloud, Elias. It's important for your treatment."

  Elias looked down. His lips moved silently at first. Then he spoke. His voice was flat, monotone.

  *"Subject attended the anniversary dinner. He wore the blue tie his wife purchased. He felt a sense of dutiful obligation, honoring a promise made in healthier times..."*

  Thorne watched his face. As he read the words about dutiful obligation, the tension in his jaw released. The furrow in his brow smoothed out. He was remembering the dinner now. He was remembering the feeling of the tie around his neck. He was remembering the promise. The charcoal memory—the guilt, the noise, the accident—was evaporating, overwritten by the ink on the page.

  When he finished the paragraph, he looked up. His eyes were different. They were lighter.

  "I remember that night," Elias said. "It was quiet. She was... she was happy."

  "That's good, Elias," Ross said.

  "I was a good husband," he said. It wasn't a question. It was a statement of fact, derived from the text.

  "Yes," Thorne said. "You were."

  Elias nodded. He looked at his hands. They were just hands now, not evidence of anything. He stood up. "Can I go home?"

  "Yes," Thorne said. "Your apartment is ready. The ledger will be updated weekly."

  "Thank you," Elias said. He sounded sincere. He sounded like a man who knew who he was.

  He walked out of the room. Thorne watched him go until the door clicked shut. She looked down at the charcoal binder still sitting on the side table. Kael had left it behind.

  She opened it to Entry 402. She read the line about the resentment. She read the line about the accident. It was well-written. It felt true, in the way a sharp knife feels true.

  She closed the binder. She placed it in the bin marked for archival shredding.

  "Meeting adjourned," Thorne said.

  Ross was already packing her tablet. "See you next week for the intake?"

  "Yes," Thorne said.

  Ross left. Thorne was alone in the room. The fluorescent light hummed. She picked up her pen and signed the authorization form. The ink dried quickly, permanent and black. She stacked the navy binder on top of the form, hiding the signature.

  Outside, the sky was gray. Somewhere in the city, Elias Vance was walking to the bus stop. He would remember the route. He would remember why he was taking it. He would not remember that he had ever been anyone else.

  Thorne turned off the lights and locked the door.
