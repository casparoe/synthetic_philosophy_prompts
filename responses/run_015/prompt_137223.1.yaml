      *(Self-Correction on Tone)*: Ensure it doesn't feel like Black Mirror. It needs to feel like a hospital drama. Boring rooms, coffee stains, fluorescent lights.

      *(Key Constraint)*: "Leave the reader genuinely unable to settle whether the treatment is a rescue or a quiet usurpation." I must balance the benefit (Elias functions) with the cost (Elias is fabricated).

      Let's write.

      *Plan:*
