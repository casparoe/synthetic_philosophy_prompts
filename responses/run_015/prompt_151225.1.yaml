answer: |-
  Bottom line: You need to reject Premise 2. Your roommate's argument relies on a false equivalence between artistic intent and moral character, treating them as the same kind of biographical data when they function differently in aesthetic evaluation.

  Premise 2 claims moral character is "no different" from knowing whether a piece is satire. This is the weak link. Intent is constitutive of the work's meaning; it helps determine what the work *is*. If you don't know a piece is satire, you misunderstand the object itself. Moral character, however, is usually external to the work's internal properties. A painting's brushstrokes don't change if the painter was a cheat, whereas the brushstrokes do change function if they were intended as irony versus sincerity. By rejecting Premise 2, you block Premise 3. There is a principled line: facts that determine the work's identity (intent, context of creation) are relevant to interpretation, while facts that merely describe the creator's soul (moral character) are relevant to ethical judgment, not aesthetic merit.

  The cost of giving up Premise 2 is that you must accept a more nuanced theory of relevance. You can't just say "nothing about the artist matters" or "everything matters." You have to argue for why intent counts as an aesthetic fact while character counts as a biographical fact. This requires philosophical legwork to define where the "work" ends and the "artist" begins, but it saves Separationism from collapsing into absurdity.

  Regarding your roommate's twist: if the artwork literally couldn't exist without the harm (like an abusive photo), that makes his argument stronger, not weaker, but only for that specific subset of art. In standard Separationism, the moral flaw is external to the work. In this "constitutive harm" scenario, the moral defect becomes an internal property of the work itself. The harm is part of the medium. Most ethicists argue this converts the moral flaw into an aesthetic flaw because the work's existence is parasitic on the wrong. It doesn't prove all immoral art is bad, but it breaks the Separationist defense for art created through direct exploitation.

  Overall confidence: 85%
  Least sure about: Whether constitutive harm *necessarily* diminishes aesthetic value. Some radical formalists argue that even if a photo requires abuse, the visual composition could still be aesthetically perfect, though morally repugnant. I am less certain that all philosophers agree the aesthetic value must drop in constitutive harm cases, even if the moral value definitely does.
