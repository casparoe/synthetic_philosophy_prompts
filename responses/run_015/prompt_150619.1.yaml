  COMMITTEE ON OBSERVATIONAL DEMOGRAPHICS (COD)
  MEMORANDUM 2024-09
  TO: All Principal Investigators, Cosmology Division
  FROM: Dr. Aris Thorne, Chair, Subcommittee on Measure Standardization
  SUBJECT: Implementation of Typicality Impact Statements (TIS) for Telescope Allocation

  Effective immediately, all proposals requesting time on the Submillimeter Array must include a Typicality Impact Statement (TIS). This requirement addresses the ongoing resource misallocation caused by cosmological models that predict a majority of observers are unsponsored observers (hereafter "Boltzmann Brains"). As per the Self-Sampling Assumption (Administrative Directive 12), grant recipients must be statistically typical within their reference class. Funding models where the median observer is a momentary thermal fluctuation violates fiduciary responsibility to reality.

  **1. Metric Selection and Observer Yield**
  Applicants must calculate the ratio of Ordinary Observers (OOs) to Boltzmann Brains (BBs) over the lifetime of the universe. The COD acknowledges that observer yield is sensitive to the chosen measure. Proposals previously utilized comoving volume density, which often results in BB domination due to infinite future volume. This metric is hereby deprecated.

  The COD will now standardize on *Causal Worldline Weighting* (CWW). Under CWW, observers are counted per unit of proper time along continuous causal trajectories, rather than per unit spatial volume. This prioritizes sustained observation-hours over instantaneous fluctuation events.

  To illustrate the necessity of this shift, consider Model Λ-CDM-Plus. Under the deprecated volume-density scheme, Model Λ-CDM-Plus yields $10^{52}$ BBs per OO, resulting in immediate disqualification. Under CWW, however, the infinite future volume is discounted by the decay of causal connectivity, yielding 0.04 BBs per OO. The Committee has determined that CWW better reflects the operational stability required for data processing. Consequently, Model Λ-CDM-Plus is now eligible for Tier-2 funding. Applicants are advised to adopt CWW to ensure compliance.

  **2. Provenance and Hereditary Memory**
  Counting metrics alone are insufficient, as some fluctuation events may mimic sustained worldlines. To distinguish OOs from BBs, applicants must implement a Provenance Verification Protocol. An observer state qualifies as an OO only if its cognitive content includes hereditary memories verified against external causal records.

  Specifically, the applicant must demonstrate that the observer's memory state possesses an ancestry threshold exceeding 13.7 billion years. Memories assembled from the ambient heat bath lack causal lineage and are classified as unsponsored data. Proposals must detail how their model ensures that observers possess verified historical records rather than statistically assembled false memories. Note: Retroactive verification is not permitted; the causal chain must be unbroken from the initial conditions submitted in Section A of the grant.

  **3. Recursive Validity and Administrative Continuity**
  During the drafting of this memorandum, the Subcommittee identified a recursive vulnerability. If the members of the COD are themselves Boltzmann Brains, this memorandum is a statistical noise fluctuation rather than a binding directive. A committee composed primarily of unsponsored observers would lack the causal continuity required to enforce provenance standards.

  However, rejecting this memorandum on the grounds that the authors might be fluctuations would halt all telescope allocation indefinitely. To prevent administrative paralysis, the Committee invokes the Prerequisite Assumption of Administrative Continuity. This assumption posits that the act of issuing a coherent directive constitutes provisional proof of causal stability. Therefore, the validity of this guidance is contingent on the assumption that the COD consists of Ordinary Observers.

  **4. Exemptions**
  Based on the Prerequisite Assumption of Administrative Continuity, the Committee on Observational Demographics hereby classifies its own deliberations as exempt from the Typicality Impact Statement. The production of this document serves as its own Provenance Verification. External applicants do not qualify for this exemption and must submit TIS documentation alongside their primary proposals.

  Failure to comply will result in the reclassification of your model as a "High-Entropy Risk," rendering it ineligible for observational support. We remind applicants that while the universe may be ambiguous, funding cycles are not.

  Dr. Aris Thorne
  Chair, Subcommittee on Measure Standardization
  Committee on Observational Demographics
