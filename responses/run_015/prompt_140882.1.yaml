answer: |-
  This is a sophisticated refinement of the slogan. By shifting the mechanism from *interpretive bias* (downstream) to *source survival* (upstream), you have made the claim materialist and empirically testable. That is a significant upgrade in rigor. However, it also exposes the thesis to specific kinds of disconfirmation that the vague slogan avoids.

  Here is a map of the position's exposure, ranked by severity, followed by the concessions, falsifiability assessment, and the specific counter-case you requested.

  ### 1. Ranking the Defeaters (Fatal to Awkward)

  **1. The "Ignored Cache" (Fatal)**
  *   **The Finding:** A case where the loser's operational archives survived intact, were cataloged, translated, and made fully accessible to the victor's historians immediately post-war, yet the victor's narrative dominated for decades *without* active suppression or ideological blindness.
  *   **Why Fatal:** Your thesis predicts that *access* drives *narrative drift*. If the material is present and the narrative does not drift, the mechanism is not archival capture; it is interpretive hegemony. This proves the bottleneck is downstream (historians' choices), not upstream (source availability).
  *   **Confidence:** High. This is the logical negation of your prediction.

  **2. The "Reconciled Archive" (Strong)**
  *   **The Finding:** A case where the *victor* physically captures the *loser's* archives (so the victor controls the material fate) but the *loser's* narrative nonetheless dominates the received history.
  *   **Why Strong:** This severs the link between "Victory" and "Archive Control." It suggests that political reconciliation or moral concession can allow a loser to dictate history *through* the victor's archive.
  *   **Example:** The **US Civil War**. The Union (victor) captured Confederate records and published them in the *Official Records of the War of the Rebellion*. Yet, the "Lost Cause" narrative (loser's framing) dominated American historiography for 80 years.
  *   **Nuance:** A proponent might argue the South won the "institutional" war (universities, publishing) even if they lost the military one. But if the *physical* archives were in Union hands, your specific "material fate" mechanism is stressed.
  *   **Confidence:** Medium-High. (See "Least Sure Claim" below).

  **3. The "Wehrmacht Exception" (Awkward)**
  *   **The Finding:** The case you cited (German officers writing Western operational history).
  *   **Why Only Awkward:** You suspect this refutes the thesis. It does not. It actually *confirms* the Archival-Capture Thesis (ACT), provided you look at the funding. The US Army Historical Division (Victor) *hired* the Wehrmacht generals (Losers) to write the history of the Eastern Front to prepare for war with the Soviets.
  *   **Analysis:** The Wehrmacht did not "keep their archives" through their own power; the Victor *gave* them the resources to create a new archive. The "Losers" became "Archival Winners" via proxy. This fits your model: whoever controls the resources controls the sources. It is awkward only because it complicates the definition of "Victor," but it does not break the causal chain.
  *   **Confidence:** High.

  **4. The "Legibility Barrier" (Merely Awkward)**
  *   **The Finding:** A loser's archive survives physically but is in a script, language, or format that the victor's historiographical establishment cannot or will not process (e.g., oral traditions, non-standardized logs).
  *   **Why Awkward:** It forces you to expand "archive" beyond "state documents." If you restrict "archive" to Western-style bureaucracy, the thesis holds but becomes culturally narrow. If you expand it to include oral/material culture, the "capture" mechanism gets fuzzy (how do you destroy an oral tradition?).
  *   **Confidence:** High.

  ### 2. Concessions: Proponent vs. Critic

  To maintain intellectual honesty, a holder of the ACT must concede the following, which distinguishes them from a cynic who believes "all history is propaganda."

  *   **What the ACT Proponent Must Concede:**
      1.  **Archives are Necessary, Not Sufficient:** The survival of a source does not *guarantee* its inclusion, only that it *can* be included. ACT claims source survival is the primary *constraint*, not the sole *determinant*.
      2.  **The "Cataloging" Power:** Victory isn't just about keeping boxes; it's about cataloging. If the victor captures the loser's archive but misfiles it or labels it "propaganda," the material fate is effectively "destroyed" without burning a page. ACT must concede that *classification* is part of *preservation*.
      3.  **The Moral Override:** In cases of extreme moral asymmetry (e.g., genocide), the victor's narrative may dominate *despite* the loser's archives because the archives are deemed morally inadmissible (e.g., Nazi records used to prove Nazi crimes, not Nazi operational logic).

  *   **What Critics Claim (That ACT Should Reject):**
      1.  **"Ideology Trumps Evidence":** Critics often claim historians ignore contrary evidence due to bias. ACT should reject this as the *primary* driver. ACT argues historians usually *want* the evidence; they just don't have it.
      2.  **"All Sources are Power":** Critics may argue that even surviving loser documents are "infected" by power structures. ACT should reject this as unfalsifiable mysticism. A box of letters is a material object; its existence is binary (it exists/it doesn't), unlike its "discursive legitimacy."

  ### 3. Falsifiability and the Trap of Insulation

  **Is it falsifiable?**
  Yes, but only if you rigorously define "Archive" materially.

  **The Decay Route:**
  The thesis collapses into triviality if you allow "Archive" to mean "Legitimized Discourse." If a historian argues, "The loser's documents survived, but they weren't *part of the archive* because they weren't taken seriously," you have insulated the theory from evidence. This turns ACT into a tautology: "The history that wins is the one supported by the sources that win."

  **The Legitimate Feature:**
  However, there is a legitimate feature here: **Provenance.** A document's power is partly derived from *where* it is stored. A letter in a National Archive has more "historical mass" than the same letter in a private attic. ACT can legitimately claim that *institutional housing* is part of the *material fate*.

  **Verdict:** To remain falsifiable, you must pre-commit to a definition of "accessible archive" that relies on physical access and cataloging, not historiographical reception. If you can point to a box in a library that historians *could* have opened but didn't, and the narrative contradicts that box, the thesis is in trouble.

  ### 4. The Specific Counter-Example You Requested

  You asked for a case where: **Loser's Archive Survived (Quantity) + Victor's Version Won + Reasons Nothing to Do with Archives.**

  **The Case: Strategic Bombing of Germany (1940–1945)**
  *   **The Loser:** Germany.
  *   **The Victor:** UK/US.
  *   **The Archive:** German civil defense logs, police reports, and damage assessment records survived in significant quantity (captured by Allies and also held in German municipal archives).
  *   **The Narrative:** For decades, the Western narrative focused on "Military Necessity" and "Morale Bombing" (Victor framing).
  *   **The Drift:** The German records provided granular data on civilian casualties and the limited impact on morale/production early in the campaign.
  *   **The Outcome:** Despite the availability of these records (accessible to Western historians like Sir Charles Webster and Noble Frankland in the 1960s, and later), the moral justification of the Victor dominated public memory until the 1990s (e.g., *Der Brand* / *Firestorm* debate).
  *   **Why it Challenges ACT:** The sources existed. They were not destroyed. They were not inaccessible. The narrative did not drift toward the source data until *moral attitudes* shifted (post-Cold War, post-Vietnam).
  *   **Mechanism:** This suggests the bottleneck was **Moral Legibility**, not **Archival Capture**. The archives were there, but the *questions* historians asked were dictated by the Victor's moral framework, not the Victor's possession of paper.

  **Alternative Case: The White Movement (Russian Civil War)**
  *   **The Loser:** The Whites.
  *   **The Victor:** The Bolsheviks.
  *   **The Archive:** Vast White émigré archives survived in the West (Hoover Institution, etc.).
  *   **The Narrative:** The Soviet (Victor) narrative dominated Western leftist historiography for 50 years.
  *   **Why:** Ideological alignment. Western historians *had* the White archives but privileged the Soviet state archives (when accessible) or Soviet theoretical frameworks.
  *   **Challenge:** This suggests **Ideological Affinity** can override **Archival Availability**.

  ### 5. Confidence Flags

  *   **High Confidence:** The Wehrmacht case is *not* a counterexample to ACT because the US Army funded the history writing. The mechanism remains "Resources $\rightarrow$ Sources."
  *   **High Confidence:** The thesis becomes trivial/insulated if "Archive" is defined as "Legitimized Discourse" rather than "Material Repository."
  *   **Medium Confidence:** The Strategic Bombing case is a genuine stress test. It suggests that *moral frameworks* determine which archives are *read*, not just which are *kept*.
  *   **Low Confidence (Least Sure Claim):** I am least sure about the **Confederate "Lost Cause"** analysis as a defeater.
      *   *Reasoning:* While the Union physically held the records, the *institutional* power (universities, publishing, veterans' organizations) shifted to the South during Reconstruction. If ACT claims "Victory = Institutional Resources," then the South actually became the "Victor" in the archival sense by 1900. Distinguishing between "Military Victory" and "Archival Victory" is the weak point of the thesis. If the two decouple (as in the US Civil War), the predictive power of "Who Won the War" diminishes.

  ### Summary for Your Piece
  Your Archival-Capture Thesis is robust because it moves the debate from psychology (bias) to logistics (storage). Its greatest vulnerability is not that winners lie, but that **winners can afford to ignore the loser's truth even when it is on the shelf.** If you can demonstrate cases where the loser's documents were *open* but *unread* due to moral or ideological discomfort, you will have shown that archival capture is a necessary condition for historical revision, but not a sufficient one.
