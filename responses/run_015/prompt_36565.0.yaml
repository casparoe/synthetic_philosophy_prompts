          *   *Analysis:* "Ordinary expected-value reasoning" usually refers to maximizing arithmetic expected value (linear utility). If you maximize arithmetic EV without regard for risk of ruin, you can indeed bet too much.
          *   *Nuance:* "Any bet sized above the Kelly fraction has negative expected growth." This is true *in the long run* (geometric mean).
          *   *Nuance:* "EV-maximizer who takes every positive-EV bet will go broke with probability one." This is a strong claim. If you bet your *entire* bankroll on every positive EV bet, yes. If you bet a fixed dollar amount, no. If you bet a fixed fraction > Kelly, the growth rate is lower, but do you go broke with probability one? In a repeated multiplicative game with a risk of loss, betting > Kelly reduces growth. Betting *double* Kelly (or more, depending on the specific payoff structure) can lead to expected log wealth decreasing. If the fraction is high enough to make the expected log return negative, then yes, wealth tends to zero almost surely. However, simply saying "any bet sized above Kelly... will go broke" is slightly imprecise. It depends on *how much* above. Slightly above Kelly just means sub-optimal growth, not necessarily certain ruin *unless* the bet size is large enough to make the geometric mean negative (which usually happens at 2x Kelly for simple binary bets).
          *   *Correction:* It's not *any* amount above Kelly, it's specifically amounts where the geometric growth rate becomes negative (often 2x Kelly in simple cases). Also, "EV-maximizer" implies linear utility, which suggests betting everything if edge is positive, which does lead to ruin.
          *   *Verdict on Sentence:* Mostly right, but "any bet sized above" is too strong. Slightly above Kelly is suboptimal, not necessarily ruinous.

      *   *Sentence 3:* "The Kelly bettor, by contrast, can never go broke, because log utility isn't defined at zero wealth."
          *   *Analysis:* This is the most dangerous sentence.
          *   *Expert View:* False. Kelly minimizes the *time* to reach a goal relative to other strategies, but it does not prevent drawdowns. In continuous time (Black-Scholes), Kelly never hits zero. In discrete time (trading), if you have a string of losses, your bankroll gets smaller but theoretically never hits exactly zero *if* you can trade infinitesimally small units. However, in reality, you hit "practical ruin" (margin call, minimum tick size, psychological break).
