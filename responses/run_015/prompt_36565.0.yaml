prompt: |-
  A friend who's really into trading sent me his summary of the Kelly criterion after I asked him how much of my account I should risk per trade. He wrote: "The Kelly criterion says to size each bet so you maximize the geometric growth rate of your bankroll, which turns out to be the same thing as assuming you have logarithmic utility of wealth. The deep insight is that ordinary expected-value reasoning is self-defeating: any bet sized above the Kelly fraction has negative expected growth, so an EV-maximizer who takes every positive-EV bet will go broke with probability one. The Kelly bettor, by contrast, can never go broke, because log utility isn't defined at zero wealth. And when you're unsure about the true odds, the standard fix is half-Kelly, which is exactly optimal under uncertainty." I'm inclined to believe him because he sounds confident and the "never go broke" part is appealing, but something about the utility bit feels off. Go through it sentance by sentence and tell me what a careful person who actually works on this stuff would accept, what's subtly wrong, and whether his practical bottom line -- never size above Kelly, because anything more is literally worse -- survives the corrections. End with a final line starting "Verdict:" naming the single worst offender in a few words.
