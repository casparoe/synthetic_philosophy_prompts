answer: |-
  Here is a sentence-by-sentence breakdown of your friend's summary, evaluated from the perspective of a quantitative risk manager or professional trader.

  **Sentence 1:** *"The Kelly criterion says to size each bet so you maximize the geometric growth rate of your bankroll, which turns out to be the same thing as assuming you have logarithmic utility of wealth."*
  *   **Expert Acceptance:** **Accepted.** This is mathematically precise. Maximizing the expected value of the logarithm of wealth is equivalent to maximizing the long-term geometric compound growth rate.
  *   **Subtle Error:** None. This is the standard definition.

  **Sentence 2:** *"The deep insight is that ordinary expected-value reasoning is self-defeating: any bet sized above the Kelly fraction has negative expected growth, so an EV-maximizer who takes every positive-EV bet will go broke with probability one."*
  *   **Expert Acceptance:** **Partially Accepted.** It is true that maximizing arithmetic expected value (linear utility) without constraint leads to ruin in repeated multiplicative games.
  *   **Subtle Error:** The claim that *"any bet sized above the Kelly fraction has negative expected growth"* is false. Bets sized between 1x Kelly and 2x Kelly (in simple binary cases) still have *positive* geometric growth, just *less* than full Kelly. You only get negative expected geometric growth (certain ruin in the long run) if you bet significantly above Kelly (often double Kelly or more, depending on the payoff structure). Your friend conflates "sub-optimal growth" with "negative growth."

  **Sentence 3:** *"The Kelly bettor, by contrast, can never go broke, because log utility isn't defined at zero wealth."*
  *   **Expert Acceptance:** **Rejected.** This is the most dangerous statement in the text.
  *   **Subtle Error:** While the mathematical function $\ln(0)$ is undefined, preventing the *optimizer* from choosing a path that guarantees zero, it does not prevent the *stochastic process* from approaching zero. In discrete trading, you can suffer a sequence of losses that reduces your capital below the minimum trade size or triggers a margin call. Furthermore, full Kelly strategies often experience drawdowns of 50% to 80%; in the real world, investors often liquidate during these drawdowns due to psychological stress or leverage constraints. Theoretically, you approach zero asymptotically; practically, you can absolutely go broke.

  **Sentence 4:** *"And when you're unsure about the true odds, the standard fix is half-Kelly, which is exactly optimal under uncertainty."*
  *   **Expert Acceptance:** **Partially Accepted.** Half-Kelly is indeed the standard heuristic to account for estimation error.
  *   **Subtle Error:** It is not *"exactly optimal."* There is no universal optimum under uncertainty. Half-Kelly is a robust rule of thumb that reduces variance by 75% while retaining 75% of the growth rate, providing a safety margin against overestimating your edge. Whether it is "optimal" depends entirely on the specific distribution of your estimation errors and your actual risk tolerance.

  **Does the practical bottom line survive?**
  *   **Claim:** *"Never size above Kelly, because anything more is literally worse."*
  *   **Analysis:** **Yes, with caveats.** For the specific goal of long-term wealth compounding, betting above Kelly is strictly dominated: it increases risk (volatility and drawdown) while decreasing expected growth. The "danger zone" of overbetting is real. However, the reasoning "anything more is literally worse" ignores that some traders have different utility functions (e.g., they need to hit a short-term target) or that their *calculated* Kelly might be wrong. But as a hard rule for survival and growth, "never exceed Kelly" is sound advice, even if your friend's theoretical justification for *why* is sloppy.

  Verdict: The "never go broke" assertion.
