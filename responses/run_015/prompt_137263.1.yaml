          *   Identify the *single revision* that cleans up the most.
      *   **Tone:** Critical, analytical, respectful of the depth of thought, but direct about contradictions.

  2.  **Deconstruct the 10 Points:**
      *   (1) Target = Honesty (model's belief), not Accuracy (truth).
      *   (2) No ground truth on internals; must generalize from checkable behavior.
      *   (3) Deflationist about Direct Translator (no unique map, just useful translations).
      *   (4) Practical value = Advisor-Reporter (what a well-informed human would say).
      *   (5) Fear = Human Simulator (predicts human error).
      *   (6) Reporter must Abstain (uncertainty is honest).
      *   (7) Not a live problem now, but build toy setups (epistemic gap without capability gap).
