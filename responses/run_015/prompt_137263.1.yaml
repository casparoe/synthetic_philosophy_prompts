      If they want (1), they must reject (4) as the primary definition. If they want (4), they must admit (1) is impossible/ill-defined (per 3).

      *Decision:* The biggest cleanup is to align (1) with (3) and (4). Drop the "Model's Belief" realism. Embrace "Useful Translation."

