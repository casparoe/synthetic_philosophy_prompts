      *   **Constraint:** Do not reveal the point until the end.

  2.  **Deconstruct the User's Idea & Improve:**
      *   *Idea:* Buzzers + Cards + Tally.
      *   *Critique:* 5 seconds is too fast for reading a scenario card. 20 students is small enough for individual tracking but large enough for anonymity. "Location cards" might be too abstract.
      *   *Improvement:* Instead of just "Brain/Body/View," use specific tokens that represent *commitments*. Let's make it physical. Red/Green/Blue cards are good, but let's tie them to the specific intuitions Dennett attacks.
      *   *Refinement:* The "Tally" needs to show *individual* instability, not just class aggregate. If the class moves from 10 Brain to 10 Body, that's interesting, but if *Alice* moves from Brain to Body to Brain, that's the instability we want.
      *   *Solution:* Use a "Tracking Sheet" for each student where they mark their choice at each stage. Then, project the *aggregate* but ask them to look at their *own* sheet.
      *   *Pacing:* 75 minutes is tight. Need to keep the narration punchy.
      *   *The "Hook":* The second-person narration needs to be immersive. The instructor plays the "Control Center."

  3.  **Develop the Scenario Sequence (The "Script"):**
      *   Dennett's story has specific beats. We need to compress them into discrete "Rounds."
      *   *Round 1 (Baseline):* Brain in vat, Body in Tulsa. Intuition: "I am with my body." (Common sense).
      *   *Round 2 (Sensory Decoupling):* Visuals come from the vat (cameras in eyes disconnected). Intuition: "I am with the brain." (Point of View).
