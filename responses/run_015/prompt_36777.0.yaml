      *   **Goal:** Design a 75-minute in-class activity to *manufacture* this instability.
      *   **User's Idea:** Staged second-person narration, buzzers, location cards (brain/body/viewpoint), tally on board, scenario changes one thing at a time.
      *   **Requirements:**
          *   Improve the user's rough idea.
