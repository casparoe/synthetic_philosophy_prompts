      3.  Point of View Intuition (I'm wherever the camera is).
      4.  Identity Crisis (Hubert swap).
      5.  Multiplicity (Which one?).

      *Let's simplify for the game mechanics.*
      Options: A (Body), B (Brain), C (Point of View/Wherever I look), D (Nowhere/Confused).
      Actually, Dennett argues "I" is an abstraction. Let's stick to the location question primarily, then let it break.
      Cards: **BODY** (Tulsa), **BRAIN** (Houston), **VIEW** (Where camera is), **NONE** (Question broken).

  4.  **Drafting the Timeline:**
      *   0-5: Setup & Rules.
      *   5-25: The Game (5 Rounds x 4 mins).
      *   25-30: Tally Reveal.
      *   30-60: Debrief (Connecting to text).
      *   60-75: Limitations & Conclusion.

  5.  **Designing the "Instability" Mechanism:**
      *   To ensure they feel the flip, the scenarios must be *plausible* for different answers.
      *   Crucial element: The "Silent Switch." In Round 4, tell them the brain was swapped, but functionally identical. Did *you* move?
      *   Recording: Each student gets a scorecard. They mark their choice. At the end, they trace their own line. Did it wiggle?

  6.  **Developing the Debrief:**
      *   Connect Round 1 to "Common Sense Materialism" (I am my body).
      *   Connect Round 2 to "Cartesian Theater" (I am where the seeing happens).
      *   Connect Round 4 to "Psychological Continuity" (Does substrate matter?).
      *   Connect Round 5 to "Dennett's Center of Narrative Gravity" (The "I" is a fiction).
      *   Address the "I" in "Where am I?" -> It presupposes a singular locatable entity.

  7.  **Troubleshooting:**
