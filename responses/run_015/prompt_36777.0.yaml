      *   *Round 4 (The Switch):* Brain swapped (Yorick -> Hubert). You don't know. Intuition: "Does it matter?"
      *   *Round 5 (The Duplicate):* Both brains active. Which one is "you"? Intuition: Collapse of "Where".
      *   *Refinement for Class:* Keep it to 5-6 distinct "States."
      *   *State 1:* Standard Dennett start (Brain Houston, Body Tulsa).
      *   *State 2:* Visuals rerouted to Brain (You see what the vat sees).
