  8.  **Addressing the Limitations:**
      *   The game is low-stakes. No one *fears* death or loss of self.
      *   Compensation: Use the debrief to ask about *anxiety*. "Did anyone feel annoyed when I swapped the brain? Why?" That annoyance is the shadow of the stake.

  9.  **Refining the Materials:**
