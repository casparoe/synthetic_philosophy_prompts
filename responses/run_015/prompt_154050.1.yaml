prompt: |-
  hey i'm prepping a grad seminar on bioethics and i'm stuck on that therapy/enhancement boundary everyone argues about. i need you to lay out the desiderata — like, what must any decent theory of that line actually deliver? for each one, give me the concrete case or puzzle behind it, not just abstract hand-waving. make sure you cover the standard stuff (growth hormone for short stature, adderall for studying) but also push into weirder ground: epigenetic editing for stress resilience, and neurofeeback implants that don't restore attention but restructure it from scratch. then flag which pairs of desiderata probably can't both be satisfied. after that, briefly score three approaches against your list: the normal-function model, the welfarist view, and that niche relational-autonomy framework people talk about in disability studies. i don't want a bibliography or a reading list — just tell me which criteria are non-negociable, which ones are probably just prejudice from one camp, and where the real tension lives. write like you're talking to a colleague over coffee, not like you're writing for publication.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The therapy/enhancement distinction in bioethics.
      *   **Task:** Lay out the *desiderata* (criteria/goals) that any decent theory of this boundary must deliver.
      *   **Requirements:**
          *   Provide concrete cases/puzzles for each desideratum (no abstract hand-waving).
          *   Cover standard cases (growth hormone, Adderall).
          *   Cover "weirder" cases (epigenetic editing for stress resilience, neurofeedback implants restructuring attention).
          *   Identify incompatible pairs of desiderata (trade-offs).
          *   Score three approaches: Normal-Function Model, Welfarist View, Relational-Autonomy Framework.
          *   Identify non-negotiable criteria vs. prejudice.
          *   Locate the "real tension."
          *   **Tone:** Conversational, colleague-to-colleague (over coffee), not academic/publication style.
          *   **Constraint:** No bibliography or reading list.

  2.  **Deconstruct the "Therapy/Enhancement" Problem:**
      *   Why do we care? Because we treat therapy as obligatory/covered/okay, and enhancement as optional/expensive/cheating/unsafe.
      *   What do we want a theory to do?
          *   Tell us when to pay for it (insurance).
          *   Tell us when it's cheating (sports/academics).
          *   Tell us when it's safe/identity-preserving.
          *   Tell us when it's fair (justice).

  3.  **Drafting the Desiderata (with Cases):**
      *   *Desideratum 1: Normative Clarity (Obligation vs. Option).* We need to know when society *owes* you this.
          *   *Case:* Growth hormone. Short stature (normal variant) vs. Growth Hormone Deficiency (pathology). Insurance covers one, not the other. Why?
      *   *Desideratum 2: Identity Continuity.* The intervention shouldn't make you a "different person" in a scary way.
          *   *Case:* Neurofeedback implant. Restoring focus (therapy) vs. Restructuring attention to be hyper-linear (enhancement). Does the latter change *who* you are?
      *   *Desideratum 3: Fairness/Level Playing Field.* It shouldn't give unfair advantages that undermine social goods.
          *   *Case:* Adderall. Treating ADHD (leveling the field) vs. Neurotypical student using it to pull an all-nighter (tilting the field).
      *   *Desideratum 4: Future-Proofing/Non-Arbitrariness.* The line shouldn't shift just because technology gets better.
          *   *Case:* Epigenetic editing for stress resilience. Is "normal" stress resilience a baseline? If we edit genes to handle trauma better, is that therapy (preventing PTSD) or enhancement (making soldiers unbreakable)?

  4.  **Identifying Incompatible Pairs (The Trade-offs):**
      *   *Clarity vs. Nuance.* If you want a bright line (for insurance), you lose nuance (for complex cases).
      *   *Fairness vs. Liberty.* If you ban enhancements to keep things fair, you restrict bodily autonomy.
      *   *Identity vs. Welfare.* Sometimes becoming "better" (welfare) means becoming "different" (identity risk).

  5.  **Scoring the Three Approaches:**
      *   *Normal-Function Model (Boorse/Daniels):* Focuses on species-typical functioning.
          *   *Pros:* Good for insurance (Growth hormone).
          *   *Cons:* Fails on epigenetic stress (is stress tolerance "typical"?). Rigid.
      *   *Welfarist View (Savulescu et al.):* Focuses on well-being.
          *   *Pros:* Handles the "why do we care?" question.
          *   *Cons:* Blurs the line too much. If it makes you happier, is it therapy? Hard to limit cost.
      *   *Relational-Autonomy/Disability Studies:* Focuses on social context and identity.
          *   *Pros:* Great for the neurofeedback case (who defines "normal" attention?).
          *   *Cons:* Hard to make policy from. Can be vague on resource allocation.

  6.  **Refining the Tone:**
