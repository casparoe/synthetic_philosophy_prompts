answer: |-
  Look, you've hit the exact spot where most bioethics seminars stall out. Everyone agrees the therapy/enhancement distinction is morally significant, but nobody can draw the line without it looking arbitrary five minutes later. If you want to run a seminar that actually moves the needle, don't ask students to define the terms. Ask them what work they want the distinction to *do*.

  Here are the four desiderata any decent theory needs to satisfy, grounded in the cases you mentioned.

  ### The Desiderata (and the Cases that Break Them)

  **1. The "Who Pays?" Test (Allocative Clarity)**
  A theory must tell us when a medical intervention is a social obligation versus a consumer luxury. If it's therapy, insurance (or public health) covers it. If it's enhancement, you pay out of pocket.
  *   **The Case:** **Growth Hormone for Short Stature.**
      *   *Puzzle:* We cover growth hormone for a kid with a pituitary deficiency (therapy). We generally don't cover it for a healthy kid who is just statistically short (enhancement). But both end up with the same height. A theory needs to explain why the *cause* of the shortness matters more than the *outcome*, without just saying "because one is a disease." If the theory can't distinguish these for billing purposes, it fails the basic economic reality of healthcare.

  **2. The "Cheating" Test (Fair Opportunity)**
  A theory needs to explain when an intervention undermines fair competition in social goods (grades, jobs, sports) versus when it levels the playing field.
  *   **The Case:** **Adderall for Studying.**
      *   *Puzzle:* For the student with ADHD, Adderall is therapy; it brings them up to baseline focus. For the neurotypical student, it's enhancement; it pushes them past baseline. But in the exam room, the proctor sees the same behavior: enhanced focus. A theory must explain why the *internal baseline* matters more than the *external advantage*, or else we have to ban it for everyone to keep things fair.

  **3. The "Self" Test (Identity Integrity)**
  A theory needs to account for whether the intervention preserves the person's narrative identity or fundamentally restructures who they are. Therapy should restore the self; enhancement risks replacing it.
  *   **The Case:** **Neurofeedback Implants.**
      *   *Puzzle:* Imagine an implant that doesn't just restore attention (therapy) but restructures cognitive processing from serial to parallel, making you think "faster" and "differently." You get more done, but your friends say you feel "alien." A theory must tell us if this is a medical success or a psychological hazard. If we prioritize welfare over identity, we might endorse changes that make the person unrecognizable to themselves.

  **4. The "Moving Goalpost" Test (Technological Neutrality)**
  A theory shouldn't collapse just because the technology gets smoother. The moral line shouldn't depend on whether the intervention is a pill, a gene edit, or an app.
  *   **The Case:** **Epigenetic Editing for Stress Resilience.**
      *   *Puzzle:* Say we can edit gene expression to lower cortisol response to trauma. Is this therapy (preventing PTSD in high-risk populations) or enhancement (making "super-soldiers" or unflappable CEOs)? As the tech becomes safer and more precise, the "risk" argument fades. A theory needs to hold the line based on *purpose*, not just *safety*, or admit that safety makes the distinction irrelevant.

  ***

  ### The Incompatible Pairs (Where the Theory Breaks)

  Here's the thing you need to put on the board: you probably can't satisfy all four. Here are the tensions:

  *   **Allocative Clarity vs. Technological Neutrality:**
      To satisfy "Who Pays?", you need a bright, binary line (Covered/Not Covered). But technology is a spectrum. Epigenetic editing for stress exists on a continuum with therapy for anxiety. If you demand a bright line for insurance, you have to draw an arbitrary boundary that ignores the technological reality. If you respect the tech continuum, you can't make a binary payment decision.
  *   **Fair Opportunity vs. Identity Integrity:**
      To ensure fairness (no cheating), you might need to ban the neurofeedback implant for everyone. But if that implant is the only way a specific person can achieve their life goals without losing their sense of self (perhaps their "natural" state is debilitatingly slow), banning it for fairness violates their autonomy and identity.

  ***

  ### Scoring the Approaches

  Here's how the three big frameworks stack up against these desiderata.

  **1. The Normal-Function Model (e.g., Boorse, Daniels)**
  *   *The Gist:* Therapy restores species-typical functioning; enhancement exceeds it.
  *   *Score:*
      *   **Who Pays?** **High.** It's great for the Growth Hormone case. Deficiency is atypical; short stature is typical. Easy billing.
      *   **Cheating?** **Medium.** Works for Adderall (restoring typical focus), but struggles if "typical" focus isn't enough to succeed in modern society.
      *   **Identity?** **Low.** Doesn't care about identity. If it's "functional," it's fine.
      *   **Tech Neutrality?** **Low.** Struggles with epigenetics. Is "typical" stress resilience a statistical average or a biological norm? It gets fuzzy fast.
  *   *Verdict:* Good for policy, bad for philosophy.

  **2. The Welfarist View (e.g., Savulescu, Harris)**
  *   *The Gist:* The distinction doesn't matter; what matters is well-being. If it makes life better, do it.
  *   *Score:*
      *   **Who Pays?** **Fail.** If well-being is the goal, why *wouldn't* we pay for enhancement? This view dissolves the boundary entirely, which is economically non-starters for public health.
      *   **Cheating?** **Low.** If the goal is max welfare, fairness is secondary.
      *   **Identity?** **Medium.** Depends on how you define welfare. If "being yourself" is part of welfare, it works. If welfare is just pleasure/success, it fails the Neurofeedback case.
      *   **Tech Neutrality?** **High.** Doesn't care how you get the welfare, just that you get it.
  *   *Verdict:* Philosophically consistent, practically useless for resource allocation.

  **3. The Relational-Autonomy Framework (Disability Studies)**
  *   *The Gist:* The line isn't in the body; it's in the social context. "Disability" is a mismatch between body and environment.
  *   *Score:*
      *   **Who Pays?** **Medium.** Argues we should pay to change the environment (accommodations) rather than the body. Hard to budget for.
      *   **Cheating?** **High.** Reframes Adderall not as cheating, but as a tool for navigating a neurotypical-biased system.
      *   **Identity?** **High.** Best at handling the Neurofeedback case. Asks: "Who is defining 'normal' attention? Is the restructuring a colonization of the self?"
      *   **Tech Neutrality?** **Medium.** Focuses on the social impact of the tech, not the tech itself.
  *   *Verdict:* Best for the "weird" cases, hardest to turn into a hospital policy.

  ***

  ### The Bottom Line for Your Seminar

  If you want to cut through the noise, tell your students this:

  **The Non-Negotiable:** **Allocative Clarity.** We live in a world of scarce resources. A theory that can't help us decide who gets coverage is just poetry. You have to be able to say "no" to something that works, or the system collapses.

  **The Prejudice:** **The "Natural is Better" Bias.** A lot of the resistance to enhancement (especially the epigenetic and neurofeedback cases) is just the naturalistic fallacy dressed up as ethics. If an implant makes you safer and happier, arguing it's "wrong" because it's "unnatural" is usually just status quo bias.

  **The Real Tension:** It lives between **Allocative Clarity** and **Identity Integrity**.
  To keep costs down (Clarity), we need a simple definition of "normal." But "normal" is a social construct that often marginalizes people (violating Identity/Relational Autonomy).
  *   If you side with **Insurance**, you get the Normal-Function model.
  *   If you side with **The Person**, you get the Relational-Autonomy model.

  The seminar shouldn't be about finding the "right" definition. It should be about deciding which cost we're willing to bear: the financial cost of covering enhancements, or the social cost of enforcing a rigid definition of "normal" human function. That's where the actual ethics lives.
