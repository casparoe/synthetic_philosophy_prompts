  **FOR IMMEDIATE RELEASE**

  **Institute for Narrative Dynamics Announces Positive Results for Gravitational Re-Centering Therapy**

  **CAMBRIDGE, MA** — The Institute for Narrative Dynamics (IND) today published results from a Phase III randomized controlled trial indicating that Gravitational Re-Centering (GRC) significantly improves subjective continuity in patients suffering from acute identity fragmentation. The study suggests that personal identity, functioning as the center of gravity of a human being's story-mass, can be clinically relocated through targeted biographical adjustment.

  "We often treat the self as a noun, when it is actually a vector," said Dr. Elena Vance, lead investigator and Director of Clinical Ontology at IND. "Just as a physical object's center of gravity shifts when mass is redistributed, a person's identity stabilizes when narrative weight is moved from traumatic arcs to integrative ones. In some cases, this requires adding mass where there was none."

  The GRC protocol involves a twelve-week intervention where Certified Narrative Architects work with patients to edit retrospective causal links. Factual verification was deprioritized in favor of structural coherence; patients who successfully confabulated seamless origins for current behaviors showed higher stability scores than those adhering to strict historical accuracy. The trial also utilized "Proxy Narrators"—spouses or colleagues instructed to tell consistent stories about the patient—to provide external load-bearing support. In 14% of successful cases, the patient's calculated center of gravity was located entirely outside their physical body, typically悬浮 within the digital archives of a trusted relation.

  Critics have questioned the biomechanical validity of the model. Dr. Aris Thorne, a biomechanist at MIT not involved in the study, noted, "A center of gravity is a mathematical abstraction used to simplify calculations. It does not exist as a locus you can visit, nor does it exert force. You cannot apply torque to a memoir. Claiming otherwise is like treating a spreadsheet's sum total as a physical organ."

  Despite these objections, demand for GRC has outpaced clinical need. The IND has already licensed the protocol for non-clinical wellness packages, marketed to executives seeking "Identity Optimization." Preliminary data suggests healthy subjects experience enhanced confidence simply by knowing their narrative center is being monitored.

  Primary outcomes were measured using the Subjective Continuity Index (SCI). The SCI requires patients to affirm that their past explains their present to complete the survey, ensuring that all respondents demonstrate the coherence the treatment aims to produce. Follow-up studies will investigate whether patients with thin narrative profiles, such as infants or those with advanced dementia, can be stabilized via third-party biography subscriptions.

  ***

  **SIDEBAR: TRIAL ABSTRACT**

  **Journal:** *Journal of Ontological Engineering*
  **Title:** *Displacement of the Narrative Center of Gravity via Biographical Mass Redistribution: A Multicenter RCT*

  **Methods:** 400 participants with self-reported identity fragmentation were randomized to Gravitational Re-Centering (GRC) or sham narrative therapy. The GRC group underwent weekly sessions to redistribute narrative mass from discontinuous events to coherent arcs. External narrators were assigned to 50% of the GRC group to provide auxiliary structural support.

  **Primary Endpoint:** Change in the spatial coordinates of the patient's narrative center of gravity relative to the sternum, measured via ontological triangulation.

  **Results:** At week 12, the GRC group showed a mean posterior shift in narrative center of 2.4 meters (95% CI, 1.8–3.0), compared to 0.1 meters in controls (p<0.001). Factual accuracy of the narrative arcs did not correlate with stability (r=0.04). 12% of GRC participants exhibited extra-corporeal centers of gravity. Adverse events included sudden plot holes and unauthorized genre shifts.

  **Conclusion:** Gravitational Re-Centering effectively stabilizes the self by manipulating the abstraction used to measure it.
