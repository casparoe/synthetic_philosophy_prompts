answer: |-
  An analogy is not a truth claim but a model licensing an inference. To guide pre-evidence decisions, it must survive this specification. I discard "Incrementality" as redundant to "Specific Inference"; if the inference is named, decoration is detectable.

  1.  **Specific Inference:** Must state a directional claim (e.g., "High capital intensity leads to monopoly"). *Motivation:* Vague analogies justify any policy. *Failure:* "AI is like fire" implies nothing specific about regulation.
  2.  **Feature-Mapping:** Remove proper nouns. Claims must hold based on structural features, not historical prestige. *Motivation:* Prevents appeal to authority. *Failure:* "Because Manhattan Project" instead of "because centralized deployment."
  3.  **Ex Ante Visibility:** The signal must have been detectable to contemporaries. *Motivation:* Decisions are made in the fog. *Failure:* Hindsight bias. *Action:* Discard purely retrospective lessons for decision-making; they are history, not tools.
  4.  **Falsifiability:** State what AI feature would break the map. *Motivation:* Prevents unfalsifiable metaphors. *Failure:* Moving goalposts when AI differs from the historical case.
  5.  **Policy Robustness:** The analogy should not equally support opposite policies. *Motivation:* Prevents Rorschach tests. *Failure:* Both pause and accelerate advocates claim it equally well.

  **Classification:** Requirements 1, 2, and 4 are non-negotiable; without them, the analogy is meaningless. Requirement 3 is critical for this specific use-case (pre-evidence decision-making). Requirement 5 is preferred for stability but an analogy might be true yet contested.

  **Smuggled Conclusions:** Demanding an analogy involve existential stakes or draw from episodes that ended tolerably well are invalid criteria. They predetermine the risk profile and moral valence rather than testing the structural map. We are testing the mechanism, not the mood.

  **Incompatibility:** Tension exists between Precision (1) and Historical Fidelity (3). Historical actors were often wrong. We prioritize the signal they *had*, not their errors. Precision wins for policy utility.

  **Most Exclusionary:** Ex Ante Visibility. This is the bottleneck. Most historical lessons are hindsight dressed as foresight. If the lesson wasn't visible to actors living through the transition, it cannot guide actors living through this one. It filters out the comforting narratives constructed after the dust settles. This requirement alone kills the majority of popular comparisons because they rely on knowing the ending to make the map fit.

  **Scorecard:**
  Nuclear Weapons: Maps centralized control well; fails ex ante on diffusion speed and dual-use ambiguity.
  Printing Press: Strong on unintended cultural diffusion; fails on control concentration and tempo of change.
  Industrial Revolution: Robust on economic displacement mechanics; fails on tempo and reversibility axes.
