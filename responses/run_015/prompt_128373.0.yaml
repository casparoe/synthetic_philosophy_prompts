      *   **Resolution:** Distinguish between *standing to report* and *credibility of evidence*. Vasquez has standing to report (whistleblower protection principles), but her past record may be relevant to assessing her motivation or the weight of her testimony, not the admissibility of the claim.
      *   **Recommendation:** Hear the complaint.
      *   **Conditions:**
          1.  Vasquez's past violations are documented but deemed distinct in severity/type.
          2.  An independent investigator (not influenced by Vasquez's status) leads the fact-finding.
          3.  Timeline for completion.
      *   **Time Frame:** Needs to be concrete. e.g., 60 days for preliminary inquiry, 120 days for full investigation if warranted.
      *   **Tone:** Formal, deliberative, principled, actionable.

  4.  **Refining the "Unclean Hands" Argument:**
      *   Why is it serious? Because if the institution ignores Vasquez's past violations, it looks like selective enforcement.
      *   Why doesn't it bar the complaint? Because fabrication threatens the core mission (truth) more than archival negligence. Allowing hypocrisy to block fraud investigation creates a "perfect witness" rule that protects misconduct.
      *   *Key distinction:* Procedural standing vs. Substantive merit.

  5.  **Drafting the JSON:**
