answer: |-
  **I. Reconstructing the Implicit Theory**

  To analyse the six features, we must distinguish between three competing justifications for the jury: the **Epistemic** (the jury as a truth-tracking machine, relying on the Condorcet Jury Theorem), the **Representative** (the jury as a microcosm of the community, lending democratic legitimacy), and the **Procedural** (the jury as a fair process, where authority derives from the integrity of the ritual rather than the outcome).

  1.  **Random Selection and Challenges:**
      *   *Strict Requirement:* Random selection is strictly required by the **Epistemic** view only insofar as it guarantees statistical independence between voters. It is strictly required by the **Representative** view to ensure the panel mirrors the populace.
      *   *Comfortable Fit:* Both theories sit comfortably with randomness. However, the allowance for challenges based on predicted sympathy (bias) rather than competence is fatal to the pure Epistemic view. If the goal is truth, one should challenge for *incompetence* or *prejudice against truth*, not for sympathy which might align with mercy or community standards.
      *   *Underdetermination:* This feature is underdetermined between Epistemic and Representative theories regarding randomness, but the nature of challenges leans heavily towards the Representative or Procedural view (ensuring a fair hearing) rather than the Epistemic (ensuring a correct verdict).

  2.  **Evidence Only (No Research):**
      *   *Strict Requirement:* This is strictly required by the **Procedural** view (equality of arms; both parties know the case against them).
      *   *Comfortable Fit:* It fits the **Epistemic** view comfortably, as it controls variables and prevents noise (hearsay, inadmissible evidence) from corrupting the data set.
      *   *Underdetermination:* This feature is highly compatible with all three theories. It preserves the integrity of the trial record (Procedural), ensures all jurors assess the same data (Epistemic), and prevents external social pressures from influencing the lay panel (Representative).

  3.  **Deliberation Secrecy:**
      *   *Strict Requirement:* This is strictly required by a theory of **Finality and Authority**. It presupposes that the verdict must be immune from post-hoc rationalisation or impeachment.
      *   *Comfortable Fit:* It sits uncomfortably with the **Epistemic** view. If the jury is a truth-tracking instrument, its mechanism should be auditable. Secrecy protects the jurors, not the truth.
      *   *Underdetermination:* It is philosophically underdetermined between a fear of coercion (Procedural) and a desire to protect the verdict's status as a "black box" conclusion (Authority). It is incompatible with a rigorous Epistemic defence which demands verification of the cognitive process.

  4.  **Unanimity, Majority, and Retrial:**
      *   *Strict Requirement:* The requirement for unanimity (initially) is strictly required by a **Procedural** view of certainty (beyond reasonable doubt must mean *no* doubt among peers).
      *   *Comfortable Fit:* The permission of a majority later fits a pragmatic **Efficiency** theory, acknowledging diminishing returns.
      *   *Underdetermination:* The retrial of a discharged panel is underdetermined. It could imply the first panel was defective (Epistemic) or that the state deserves another bite at the cherry (Procedural/Adversarial). However, ignoring the first panel's split vote treats the disagreement as noise rather than signal, which contradicts the Epistemic view.

  5.  **General Verdict (No Reasons):**
      *   *Strict Requirement:* This is strictly required by the view that the jury's authority is **Sovereign**. It prevents the verdict from being appealed on the logic of the reasoning, only on the law.
      *   *Comfortable Fit:* It fits the **Representative** view: the community speaks, it does not argue.
      *   *Underdetermination:* It is incompatible with the **Epistemic** view. In truth-tracking, knowing *why* a conclusion was reached is essential to verifying its reliability. A bare verdict conceals whether the truth was found for the right reasons or the wrong ones.

  6.  **Appellate Reasoning:**
      *   *Strict Requirement:* This is strictly required by the **Epistemic** and **Legal Development** theories. Law must be consistent and reasoned.
      *   *Comfortable Fit:* None for the Jury's specific mode of operation.
      *   *Underdetermination:* This feature highlights a dual-system theory. It suggests the jury is not part of the same epistemic chain as the judges. It presupposes that the jury's role ends where reasoning begins.

  **II. The Tension Between Aggregation and Features 1 to 4**

  The aggregative justification (Condorcet) relies on two pillars: individual competence ($p > 0.5$) and independence. Features 1 to 4 systematically undermine independence while offering no guarantee of competence.

  Deliberation (Feature 3) introduces dependence. If Juror A convinces Juror B, their votes are no longer independent trials; they are correlated. Mathematically, high correlation reduces the benefit of pooling. If the correlation is due to coercion or social conformity, the group competence can drop below individual competence.

  Can this be reformulated? Yes, but only by shifting from *vote aggregation* to *reason aggregation*. The defence would be that deliberation increases individual competence ($p$) so significantly that it outweighs the loss of independence. This assumes the deliberation room functions as an ideal speech situation: that arguments are weighed on merit, that the most knowledgeable juror can persuade without dominating, and that social pressure does not silence dissent.

  However, there is reason to believe the opposite. Social psychology suggests groups often polarise or conform to a dominant personality. Without empirical access to the deliberation (due to Feature 3), the claim that deliberation boosts competence is an article of faith, not a proven mechanism. The institution assumes deliberation purifies judgment; it does not demonstrate it. Therefore, the aggregative story is not fatal, but it is rendered unfalsifiable. It survives only by insulating itself from the very scrutiny that would validate it.

  **III. The Coherence of Feature 3 (Secrecy)**

  Feature 3 is coherent only if one abandons the claim that the verdict's authority rests on its *demonstrated* reliability. It presupposes that legitimacy is a status conferred by the office of the juror, not a quality earned by the process.

  If the authority of a verdict depended on facts about how it was reached, secrecy would be self-defeating. We would need to know if the verdict was reached by rational deduction or by drawing lots. By criminalising the disclosure of deliberations, the law asserts that the *origin* of the verdict is irrelevant to its *validity*.

  Therefore, the prohibition is not a mere side-constraint on an accuracy-driven practice. It belongs to a different theory of authority altogether: one based on **finality and insulation**. The verdict must be treated as a fact of the world, like a natural event, rather than a human calculation subject to error analysis. To allow scrutiny would be to invite the endless impeachment of verdicts based on juror confusion or bias, which would collapse the system's finality. Thus, Feature 3 sacrifices epistemic transparency for systemic stability.

  **IV. Feature 4: Hung Juries and Retrials**

  Treating a discharged panel as void presupposes that the jury is a **binary switch**, not a measuring instrument. A measuring instrument that gives inconsistent readings on the same input indicates a problem with the instrument or the input. A truth-tracking system would record a 6-6 split as significant evidence of evidential ambiguity, potentially weighting the retrial or the sentencing differently.

  By ordering a retrial with a fresh panel and ignoring the first panel's failure, the system presupposes that the error lies in the *constitution* of the first group, not in the *evidence*. It assumes a "correct" verdict exists and is discoverable by a different set of twelve people.

  The move from unanimity to a permitted majority (10-2) presupposes that the **cost of error** (keeping a jury out too long) eventually outweighs the **cost of inaccuracy**. In a pure competence-based defence, one should never lower the threshold for decision unless competence increases. Lowering the threshold admits that further deliberation is unlikely to change minds, implying the remaining dissenters are not persuadable by reason. This is consistent with a pragmatic defence, but inconsistent with a pure epistemic defence, which would demand that if unanimity is not reached, the truth has not been found.

  **V. Feature 5: The General Verdict**

  Feature 5 presupposes that the jury's output is a **holistic judgment** rather than a logical conjunction of findings. This addresses the "doctrinal paradox" (or discursive dilemma). If jurors vote on premises (e.g., "Did he do the act?" "Did he have intent?"), they might reach a different conclusion than if they vote directly on the verdict ("Is he guilty?").

  By demanding a general verdict, the law presupposes that guilt is a **status** applied to the defendant, not a sum of factual probabilities. It rules out the idea that the jury is a fact-finding engine that feeds into a legal algorithm. It protects the jury from being corrected on its logic; as long as *some* valid legal route to guilt exists, the verdict stands.

  The aggregative justification generally needs the opposite. To track truth effectively, one should aggregate judgments on specific factual premises where competence is higher, rather than on complex legal conclusions where competence may vary. The general verdict protects the jury's authority but weakens its claim to epistemic precision. It prioritises the *conclusion* over the *derivation*.

  **VI. Contrast Features 5 and 6: Jury vs. Judges**

  Can a single theory underwrite both? Only a **Division of Labour** theory. This theory holds that the legal system requires two types of legitimacy: **Epistemic** (judges, ensuring consistency and legal correctness via reasons) and **Democratic** (juries, ensuring community acceptance via unreasoned verdicts).

  The contrast suggests the jury is not an epistemic device in the same sense as the appellate court. It is a **political-epistemic hybrid**. It finds facts (epistemic) but does so in a way that precludes accountability for the reasoning (political). If it were purely epistemic, it would give reasons. If it were purely political, it would not be bound by evidence (Feature 2).

  **Concrete Changes Required:**

  1.  **If the Aggregative Justification were adopted officially:**
      *   **Secrecy would end:** Deliberations would be recorded to analyse error rates and group dynamics.
      *   **Specialisation:** Jurors with relevant expertise (e.g., accountants in fraud cases) would be sought, not excluded.
      *   **Reasoned Verdicts:** Juries would be required to answer specific factual questions (special verdicts) to allow for logical checking.
      *   **Hung Jury Data:** The split of a discharged jury would be recorded and potentially used to assess the strength of the prosecution's case for the retrial.

  2.  **If the Aggregative Justification were abandoned for a Representative/Process one:**
      *   **Selection:** Greater effort would be made to ensure demographic mirroring (quota sampling) rather than random selection.
      *   **Evidence Rules:** Rules might be relaxed to allow jurors to consider broader community context or character, as "truth" in the legal sense would be secondary to "justice" in the community sense.
      *   **Verdicts:** The focus would shift entirely to the fairness of the trial process; appeals based on "unreasonable verdicts" would be harder to sustain, as the verdict represents a community standard, not an objective fact.
      *   **Training:** Jurors might be briefed on their role as community representatives rather than passive finders of fact.

  In conclusion, the current institution in England and Wales is a compromise. It uses the *language* of truth-tracking (evidence, standard of proof) to justify its existence, but employs the *mechanisms* of political representation (secrecy, general verdict, random selection) to protect its authority. It asks jurors to act as epistemic agents while forbidding them from operating as transparent ones.
