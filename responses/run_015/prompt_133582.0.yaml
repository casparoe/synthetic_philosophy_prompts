answer: |-
  The confusion you encountered is very common, largely because pop-science treatments focus on the "time travel" spectacle while ignoring Gödel's actual philosophical goal. To answer your core question directly: **The closed timelike curves (CTCs) in Gödel's metric do not threaten his view that time is an illusion; they are the mathematical proof he used to support it.**

  Gödel did not view the CTCs as a mechanism for a human to hop in a machine and change history. He viewed them as a geometric demonstration that a consistent, global definition of "time" is impossible in a relativistic universe.

  Here is the conceptual breakdown of the tension (or lack thereof) between the rotating solution and his Platonist timelessness.

  ### 1. The Philosophical Target: "Objective Lapse"
  To understand why the loops support his view, you have to understand what Gödel meant by "time is an illusion." He was not denying that we *experience* sequence or change. He was denying that there is an **objective, universal passage of time** independent of observers.

  For Gödel, a "real" time would require a way to slice the entire universe into moments of "Now" that everyone agrees on. If time is real, the universe evolves through these slices. If time is an illusion, the universe just *is* (a "block universe"), and our feeling of moving through it is a psychological artifact.

  Gödel's argument proceeded in two steps:
  1.  **Special Relativity** already destroyed the universal "Now" (simultaneity is relative to velocity).
  2.  **General Relativity** (specifically his rotating solution) destroys the possibility of *any* global time order, even locally consistent ones.

  ### 2. How the Metric Structure Enforces Timelessness
  In standard cosmological models (like the Big Bang), you can mathematically slice spacetime into hypersurfaces of constant cosmic time. Every observer can agree on which slice is "later" than another. This preserves a semblance of objective temporal evolution.

  In Gödel's rotating universe, the matter content creates a global rotation that "drags" spacetime (frame dragging). As you move further away from any given observer, the light cones (which define the possible future directions) tip over due to this rotation.
  *   **Locally:** Every observer sees a normal future and past. Causality holds locally.
  *   **Globally:** If you travel far enough, the tipping becomes so severe that a "future-directed" path curves around and intersects its own past.

  **The Conceptual Punchline:**
  If you can travel into your own past without ever exceeding the speed of light locally, you cannot define a global function $T$ that increases monotonically along every possible worldline. If event $A$ can cause event $B$, and $B$ can cause $A$, the distinction between "past" and "future" loses its absolute meaning.

  For Gödel, this was the *reductio ad absurdum* of objective time. If time were a real, flowing entity, such loops would be metaphysically impossible (you can't flow back to where you started flowing from). The fact that Einstein's equations allow such a universe suggests that "time" in GR is just another spatial dimension topologically. If time is just a dimension like space, loops are geometrically weird but not logically forbidden—just like a circle on a cylinder. This confirms his Platonist view: reality is a static, four-dimensional structure, and "passage" is not a feature of the structure.

  ### 3. The Sci-Fi Misconception: Causal Influence vs. Geometric Consistency
  This addresses your second point about influencing one's earlier state. The pop-science narrative suggests CTCs allow you to *change* the past. In the context of Gödel's geometry and General Relativity, this is incorrect.

  **The Block Universe Constraint:**
  In the relativistic view Gödel subscribed to, the spacetime manifold is a fixed, four-dimensional object. A CTC is a closed loop *within* that object.
  *   **Sci-Fi View:** I exist at $t_1$, I build a machine, I go to $t_0$, and I change things so $t_1$ never happens. (This creates a paradox).
  *   **Gödel/GR View:** The worldline of the traveler is a closed curve. The event "Traveler arrives at $t_0$" and the event "Traveler departs at $t_1$" are both fixed points in the manifold. They coexist eternally in the static structure.

  You cannot "influence" your earlier state in the sense of altering it from what it "was," because in a block universe, it never *was* anything else. If you meet your past self on the curve, that meeting is an immutable fact of the geometry. You don't create a paradox; you fulfill a consistency condition.

  **Why this supports Timelessness:**
  If you could change the past, it would imply that the past is "mutable" and the future is "open," which suggests a dynamic, flowing time. The fact that GR enforces consistency (you can't kill your grandfather if you are already there to try) reinforces the idea that the entire history is a single, static, unchangeable object. This aligns perfectly with Gödel's view that objective reality is timeless.

  ### 4. Global Constraints and "Practical" Travel
  You asked if global constraints prevent causal influence. In Gödel's specific metric, there are practical constraints that further distance the model from sci-fi:
  1.  **Distance:** The CTCs do not exist in the immediate vicinity of an observer. You must travel a vast distance (relative to the matter density) to reach the region where light cones tip over enough to allow a return.
  2.  **Energy:** To traverse the loop, you would need to travel at relativistic speeds.

  However, the deeper constraint is topological. In a universe with CTCs, the concept of "initial conditions" breaks down. You cannot specify the state of the universe at $t=0$ and evolve it forward, because the "future" loops back to constrain the "past." This lack of a well-posed initial value problem suggests that the universe cannot be understood as a thing that *happens*; it must be understood as a thing that *is*.

  ### Summary
  The conceptual tension you sensed is actually a conceptual harmony.
  *   **The Physics:** The Gödel metric demonstrates that a relativistic universe does not require a global time ordering. CTCs prove that "before" and "after" are not universal properties.
  *   **The Philosophy:** Gödel argued that if "before" and "after" are not universal, then "time" (as an objective flow) does not exist.
  *   **The Synthesis:** The existence of the loops validates the philosophical claim. They show that temporal ordering is a local convention, not a global backbone.

  The "time travel" is not a mechanism for changing history, but a geometric feature showing that history is a static shape. For Gödel, this was not a bug of the theory, but a feature that revealed the true, timeless nature of objective reality.
