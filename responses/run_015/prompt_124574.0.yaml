answer: |-
  **Joint Statement on the Ontology and Authority of Democratic Will**

  **1. Agreed Claims**

  1.  No single reading of "the will of the people" exhausts the concept's political utility; the *aggregative*, *deliberative*, *ascriptive*, and *acclamatory* readings each capture distinct phenomena observed in actual regimes.
  2.  *Mandate underdetermination* is an ineradicable feature of elections: an electoral victory does not, by itself, settle which version of a platform was endorsed, nor does it authorize unlimited discretion for the winner.
  3.  The *boundary problem* remains logically unsolved: every voting rule presupposes a *demos*, but no voting rule can legitimately pick its own *demos* without circularity.
  4.  The *spokesperson's regress* threatens both camps: any claim to speak for the people must be authorized, but any claim to speak for the procedure must also be authorized by interpreters whose authority is contestable.
  5.  **Populist Concession:** We concede that *acclamatory* and *ascriptive* claims, if unchecked by institutional constraints, risk collapsing into authoritarianism where the leader's voice substitutes for the crowd's.
  6.  **Proceduralist Concession:** We concede that strict *aggregative* outputs can violate the *deliberative* conditions required for genuine endorsement, producing results that are legally valid but politically illegitimate.
  7.  Both sides agree that a persistent gap between procedure outputs and the perceived will of the *demos* generates instability, regardless of which side is ontologically correct.
  8.  Both sides agree that distinguishing between "preference" (raw survey data) and "will" (authorized commitment) is politically consequential, not merely semantic.
  9.  Both sides agree that technocratic insulation requires a justification beyond mere efficiency; stability alone does not confer legitimacy if opposition is stable and majority-based.
  10. Both sides agree that constitutional supermajorities can legitimately block *aggregative* wills, but such blocks incur a justificatory burden that increases with the duration of the blockage.

  **2. Verbal versus Substantive**

  A significant portion of our dispute dissolves upon disambiguating our terminology. When we specify that we are discussing the *aggregative* reading, we agree on the mechanics of counting; when we specify the *deliberative* reading, we agree on the conditions of information and justification. Our disagreement is not about whether voting counts matter, but about what makes them matter.

  However, a hard core of substantive disagreement survives. The Populist camp maintains that the *ascriptive* or *acclamatory* will exists prior to the count and can judge the count. The Proceduralist camp maintains that the will is constituted by the count and cannot judge it without infinite regress. This is not a verbal dispute about the word "democratic," but an ontological dispute about authority. Is the procedure authoritative because it tracks a pre-existing will, or is the will authoritative because the procedure named it? We agree that this crux determines how we resolve conflicts between institutions and movements, but we cannot agree on the ground of resolution itself.

  **3. Disagreements Table**

  | (a) Crux | (b) Populist Formulation | (c) Proceduralist Formulation | (d) Shared Case | (e) Populist Prediction | (f) Proceduralist Prediction | (g) Evidence Against Self |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Counter-Majoritarian Difficulty** | When constitutional rules block a clear majority, the procedure has failed to capture the real will; the will stands in judgment on the rule. | When constitutional rules block a plurality, the procedure has functioned correctly; the "will" is only what the rules permit to become law. | A party wins a plurality on a commitment that a constitutional supermajority blocks; a later referendum passes 51–49 at 64% turnout. | The referendum result validates the original mandate; the constitutional block was illegitimate obstruction. | The referendum result is a new decision, not a validation of the old one; the initial block was legitimate procedure. | If the referendum passes but stability collapses due to polarization, the Populist view risks disorder. |
  | **Preference vs. Will** | Surveys register preference; the true will is what the people *would* endorse under leadership that clarifies their identity. | Surveys register preference; the true will is what the people *did* endorse through authorized voting channels. | A movement party in office implements a reform opposed by a large majority of its own voters while insisting surveys register preference, not will. | The party is correctly discerning the latent *deliberative* or *ascriptive* will against transient opinion. | The party is engaging in ventriloquism, substituting elite judgment for the *aggregative* output of its base. | If the voters punish the party electorally without changing their underlying values, the Populist view is falsified. |
  | **The Boundary Problem** | The people must decide who constitutes the people; external rules cannot bind the *demos* regarding its own composition. | The existing constitutional order must decide the *demos*; otherwise, any subgroup can claim sovereignty to alter the rules. | A secession referendum in a wealthy region, where what is at stake is which *demos* gets to decide. | The region's vote is authoritative because the "real people" of that region have asserted their *ascriptive* boundary. | The region's vote is advisory only; the sovereign *demos* is the existing state, whose procedure dictates the terms. | If the state collapses into civil war following the block, the Proceduralist view failed to preserve order. |
  | **Technocratic Insulation** | Stable majority opposition over time negates legitimacy; expertise cannot override the persistent *acclamatory* rejection of a policy. | Stable majority opposition is irrelevant if the policy falls within the delegated authority of the body; time horizons differ. | An unelected technocratic body sustains, over a decade, a policy that stable majorities have consistently opposed. | The policy is illegitimate; the body has become oligarchic, ignoring the sustained will of the *demos*. | The policy is legitimate; the body was designed to withstand short-term *aggregative* fluctuations for long-term stability. | If the policy causes measurable harm despite expert consensus, the Proceduralist view fails the utility test. |

  **4. Unsettled Remainder**

  We sign this document acknowledging that our collaboration has clarified the structure of our disagreement without resolving it. We remain divided on the ontological status of the will: whether it is discovered (Populist) or constructed (Proceduralist). This is not a case where we lacked the evidence; historical cases can be interpreted to support either view depending on which reading of "the people" is prioritized. Rather, we could not agree on what would count as evidence. For the Populist, evidence of legitimacy lies in political mobilization and stability of identity; for the Proceduralist, it lies in adherence to authorized rules and continuity of process. We agree that democratic theory must account for all four readings and three difficulties outlined above, but we leave this document with the understanding that the choice between them is ultimately political, not philosophical.

  **Signed,**
  **The Substantive Theorist & The Proceduralist Theorist**
