  **Joint Statement on Historical Objectivity**

  Following sustained adversarial collaboration, the Rankean Reconstructionist and Carr–White Constructivist camps affirm:

  **I. Agreed Claims**
  1. Primary archives constitute physical traces existing independently of the historian, though access is inevitably mediated by preservation biases.
  2. Selection and narrative emplotment are unavoidable conditions of historiography; no chronicle is theory-neutral.
  3. Discrete documents underdetermine large-scale causal interpretations; multiple coherent narratives can fit the same data.
  4. A functional distinction exists between correctible factual errors (e.g., dates) and irreducible framing choices (e.g., periodization).

  **II. Disagreements**
  | Issue | Rankean Position | Constructivist Position |
  | :--- | :--- | :--- |
  | **Archival Recovery** | Yields knowledge of events *wie es eigentlich gewesen* (as actually occurred). | Yields knowledge of events *as constructed within current discourse*. |
  | **Narrative Form** | A transparent tool; distortion is methodologically avoidable. | An unavoidable representational framework; constitutive of historical meaning. |
  | **Present-mindedness** | Renders causality biased; elimination is the disciplinary aim. | Renders causality indexical; acknowledgment is the disciplinary aim. |

  **III. Cruxes**
  Settling the following would shift camp allegiance:
  (a) Whether historical interpretations can undergo retrospective calibration against declassified records analogous to predictive-model validation, without reducing historiography to a nomological science.
  (b) Whether the necessity of present-oriented selection entails that macro-causal claims are always relative to the historian's standpoint rather than the past itself.

  **IV. Evidence and Predictions**
  *Case:* Post-1991 Cold War diplomatic narratives following Soviet and American declassifications.
  *Rankean Prediction:* Interpretive variance will decrease; narratives will converge toward a singular, accurate causal account.
  *Constructivist Prediction:* Interpretive variance will persist; new archives will enable competing narratives serving distinct contemporary utilities.

  **V. Verbal Disputes**
  The definition of "objectivity" is partially verbal. Rankeans equate it with mind-independent correspondence; Constructivists with procedural rigor. However, the disagreement regarding convergence (Section IV) remains substantive, concerning the behavior of historiography over time.

  ***

  **Personal Note on Revision**
  As the drafter, I would revise my framing if archival calibration consistently failed to reduce interpretive variance across independent teams over decades. The most probable point of failure in my reasoning is the analogy between scientific calibration and historical interpretation. Unlike physics, history lacks closed-system laws and repeatable experiments, making "validation" potentially category-mistaken. If new declassifications yield only narrative proliferation rather than convergence, the scientific model must be abandoned.
