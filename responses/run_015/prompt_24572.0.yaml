answer: |-
  You are not being arbitrary, and you are not making it up. You have stumbled onto one of the most famous and persistent puzzles in 20th-century philosophy. The fact that your intuitions shift based on word order is actually a known psychological phenomenon, even if the logical status of the sentences remains the same.

  There **is** a single principle that captures all of these cases, but to see it, we have to distinguish between what a sentence *means* (semantics) and what you *do* when you say it (pragmatics).

  ### The Unifying Principle: The Norm of Assertion

  The principle doing the work is often called the **Norm of Assertion** (or sometimes the Transparency of Belief). It goes like this:

  > **To sincerely assert a proposition $P$ is to represent yourself as believing $P$.**

  When you say "It is raining," you aren't just describing the world; you are implicitly telling your listener, "I believe it is raining." In normal conversation, assertion and belief are packaged together. You cannot separate them without breaking the "rules" of the speech act.

  Here is how this principle applies to your list, and where your intuitions need a slight calibration.

  ### 1. The Paradoxical Pairs (Cases 1–4)

  **Case 1:** *"It's raining, but I don't believe that it's raining."*
  **Case 2:** *"I don't believe that it's raining, but it is."*

  **Your Verdict:** 1 is weird, 2 is fine.
  **The Principle's Verdict:** **Both are paradoxical.**

  Here is why Case 2 feels fine to you: In English, the first clause sets the "context," and the second clause provides the "update." When you hear "I don't believe it's raining," you frame me as uncertain. When I follow with "but it is," you interpret it as me correcting my uncertainty with new evidence. It feels like a narrative of discovery.

  However, if you treat it as a single, simultaneous claim about the current state of affairs (which Moore's Paradox requires), Case 2 is just as broken as Case 1.
  *   By asserting the second part ("It is [raining]"), you represent yourself as believing it is raining.
  *   By asserting the first part ("I don't believe..."), you represent yourself as *not* believing it is raining.
  *   **Result:** You are simultaneously representing yourself as a believer and a non-believer.

  **Case 3:** *"It's raining, but I believe that it isn't raining."*
  **Case 4:** *"I believe that it isn't raining, but it is."*

  **Your Verdict:** 3 is weird, 4 is fine.
  **The Principle's Verdict:** **Both are paradoxical.**

  The same logic applies. To assert "It is raining" (in the second half of Case 4) commits you to believing it is raining. This directly contradicts the explicit claim in the first half that you believe it *isn't*.

  **Recommendation:** If you want a consistent principle, **you should drop the verdict that Cases 2 and 4 are "totally fine."** They are pragmatically self-defeating. The reason they *feel* easier to process is purely psycholinguistic (the order of information), not logical. If a robot said Case 2, we would flag it as an error in its belief-updating system.

  ### 2. The "Fine" Cases (Cases 5–8)

  The principle explains why these are fine, because the **Norm of Assertion** is not violated in the same way.

  **Case 5:** *"It's raining, but I don't know that it's raining."*
  *   **Verdict:** Weird (but less so).
  *   **Why:** Many philosophers argue the norm of assertion is actually *Knowledge*, not just Belief (you should only assert what you know). If so, this is the same paradox as Case 1. If the norm is just Belief, it's slightly less tense, but still odd because asserting $P$ usually implies you take yourself to know $P$.

  **Case 6:** *"It's raining, but you don't believe that it's raining."*
  *   **Verdict:** Fine.
  *   **Why:** The Norm of Assertion applies to the *speaker*. Asserting "It's raining" commits *me* to believing it. It does not commit *you* to believing it. There is no self-contradiction in my speech act.

  **Case 7:** *"It was raining, but I didn't believe that it was raining."*
  *   **Verdict:** Fine.
  *   **Why:** The Norm of Assertion applies to the *present* act. I am asserting *now* that "It was raining." This commits me to believing *now* that "It was raining." It does not commit me to having believed it *then*. I can sincerely report my past ignorance.

  **Case 8:** *"She said, 'It's raining, but I don't believe it's raining.'"*
  *   **Verdict:** Fine.
  *   **Why:** You are not asserting the content inside the quotes. You are asserting *that she said it*. You are mentioning the paradox, not using it.

  ### 3. The Philosopher Case (The Edge Case)

  You asked: *What does the principle predict for a case where a philosopher says the classic line just to demonstrate the point?*

  **Prediction:** It is **not paradoxical** in this context.

  **Why:** This relies on the distinction between **Use** and **Mention**.
  *   **Use:** I say "It's raining" to inform you of the weather. I am bound by the Norm of Assertion.
  *   **Mention:** I say "It's raining" as an example of a sentence. I am not claiming it is actually raining.

  When Moore (or your friend) says, "It's raining but I don't believe it," they are not sincerely asserting the proposition *that it is raining*. They are asserting the proposition *that this sentence is paradoxical*. Because they are not sincerely asserting the weather claim, they are not representing themselves as believing the weather claim. Therefore, no contradiction arises.

  ### Summary: How to Fix Your Intuitions

  You are not being arbitrary; you are reacting to the **flow of conversation** rather than the **structure of assertion**.

  1.  **The Principle:** Asserting $P$ implies "I believe $P$."
  2.  **The Conflict:** Moorean sentences assert $P$ while explicitly denying "I believe $P$."
  3.  **The Correction:** Your intuition that word order matters (Cases 2 & 4) is a "processing fluency" trick. Logically and pragmatically, Cases 1 & 2 are identical, and Cases 3 & 4 are identical.
  4.  **The Exception:** The sentence is only safe if you aren't sincerely asserting the content (e.g., past tense, reported speech, or philosophical demonstration).

  If you want to be philosophically consistent, you must accept that **"I don't believe it's raining, but it is"** is just as weird as the classic formulation. It sounds nicer because it sounds like you are changing your mind mid-sentence, but if you mean it as a static description of your current state, it is a pragmatic contradiction.

  **Final Advice:** Trust your gut on Cases 1, 3, 6, 7, and 8. But train yourself to hear Cases 2 and 4 as "It's raining (so I must believe it), but I say I don't." Once you hear the hidden commitment in the first clause, the weirdness returns.
