prompt: |-
  I was chatting with my flatmate last night about that old deontology paradox — you know, the one where refusing to break one right somehow lets five more get smashed — and I realised I need a fresh case for a seminar I'm running next week, not another trolley problem everyone has seen a million times. Build me a one-paragraph scenaro set in a realistic workplace or council meeting, where there's a genuinely defensible procdural rule — maybe something about not using one person's protected status as a resource to fix a wider distributive mess — and that rule forces the agent to stand back while five structurally identical violations of that exact same status happen elsewhere. No sci-fi, no perfect predictors, no demons, and keep the stakes ordinary.

  After the scenaro, walk me through what the deontologist says, what the consequentialist says, and exactly where the paradox bites. Then tell me which feature is doing the heavy lifting — is it the non-aggregation of rights, the agent-relative framing, or something about the decision procedure? — and explain what collapses if we strip that feature away. Finish with the best move a deontologist could make to block the case without just changing the subject. Don't bother with reffrences or bibliographies; I want this grounded enough that a small model can reason it through without guessing obscure texts.
