answer: |-
  **Scenario**
  During a Monday morning admin meeting, Principal Vance reviews the special education staffing roster. District Policy 404 states that a student's mandated one-on-one aide cannot be reassigned to another classroom without written parental consent, a rule designed to protect the student's protected status as a recipient of guaranteed accommodation. Due to a sudden flu outbreak, five other students with identical mandates are currently without aides, meaning their rights to accommodation are being violated by the hour. Vance has one available aide, currently assigned to a student named Leo. If Vance reassigns Leo's aide without consent, she violates Leo's procedural right under Policy 404 but immediately restores the rights of the five waiting students. If she upholds the rule to protect Leo's status from being used as a flexible resource, the aide stays put, and the five other students continue to suffer structurally identical violations of their right to mandated support.

  **Analysis**
  The deontologist argues that Vance must not reassign the aide. Her primary duty is to uphold the specific obligation owed to Leo; using his guaranteed support as a tool to fix a systemic backlog treats him as a mere means to an end, violating his dignity regardless of the outcome. The consequentialist counters that rights violations are bad states of affairs, and five violations are objectively worse than one; therefore, Vance must minimize the total infringement of protected status, even if it requires a minor procedural breach. The paradox bites here because the deontological stance appears to prioritize the agent's moral purity over the actual protection of the very rights the rule was designed to secure, seemingly allowing five wrongs to persist to avoid committing one.

  **The Heavy Lifting Feature**
  The feature doing the heavy lifting is the **agent-relative constraint**. Deontology posits that Vance has a special duty *not to violate* Leo's rights herself, which is distinct from a general duty to *prevent* rights violations from happening anywhere. This constraint forbids aggregating Leo's right against the five others; his right acts as a trump, not a weight. If you strip away agent-relativity and make the duty agent-neutral (i.e., "minimize total rights violations regardless of who causes them"), the distinction collapses. The obligation would simply become a math problem where 1 < 5, forcing the reassignment and turning the deontologist into a rule-utilitarian.

  **The Best Deontological Move**
  The best move to block the case without changing the subject is to insist on the moral distinction between **doing and allowing**. Vance is directly responsible for the violation against Leo if she moves the aide; she is not directly responsible for the violations against the five students, which are caused by the flu outbreak and staffing shortages. By reassigning the aide, she becomes the author of a rights violation, whereas by standing pat, she merely fails to prevent violations caused by external circumstances. A deontologist can argue that maintaining the integrity of one's own agency—refusing to be the direct cause of a wrong—is a stricter duty than maximizing the overall compliance of rights in the world, because once an agent treats a right as tradable, they undermine the inviolability that gives the right its force in the first place.
