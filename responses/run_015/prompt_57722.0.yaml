answer: |-
  **Title:** The Tautology Trap: Why Satisficing Wins the War of Attrition

  The stalemate between Herbert Simon's satisficing and the neoclassical search theory of Stigler and McCall is one of the most persistent deadlocks in the philosophy of economics. The charge against Simon is familiar: satisficing is merely maximization in disguise. A cost-conscious maximizer, calculating the marginal cost of search against the expected marginal gain, derives a reservation price. Stop searching when the offer exceeds this price. Simon's agent stops when the offer exceeds an aspiration level. Observationally, a reservation price and an aspiration level are indistinguishable. If the two models predict the same behavior, the dispute is merely semantic, and the parsimony of optimization theory should prevail.

  Your friend proposes a tie-break. She identifies a structural divergence: in standard search theory, the reservation threshold is a function of the payoff distribution and search costs; it is static so long as those parameters hold. In Simon's account, the aspiration level is adaptive, drifting with the decision-maker's history of realized outcomes. Her experiment holds the distribution and costs constant while manipulating the streak of prior payoffs. If stopping behavior shifts with the streak, she argues, satisficing is vindicated.

  This proposal is incisive, but it faces two hurdles: a methodological confound regarding belief updating, and a deeper theoretical worry regarding the flexibility of utility functions. To render a verdict, we must clear the first hurdle to see if the second one collapses the entire maximization program. The conclusion is that your friend's test is methodologically salvageable, but its true significance lies not in proving satisficing *true*, but in proving standard maximization *vacuous*. Satisficing is a real rival, not because maximization is logically impossible, but because saving maximization requires abandoning its status as a scientific theory.

  ### The Belief Confound: Fixable, Not Fatal

  The immediate objection to your friend's design is the confound you identified: rational belief updating. If a subject is told the payoff distribution is $F$ but experiences a sequence of outcomes statistically unlikely under $F$, a rational Bayesian agent should update their posterior belief about the true distribution. If they begin to believe the distribution is worse than advertised, a cost-constrained maximizer *should* lower their reservation threshold. In this scenario, history-dependent behavior is perfectly consistent with maximization. The experiment would yield a false positive for satisficing.

  However, this confound is not fatal; it is a design challenge. The issue arises because the distribution is *stated* rather than *manifest*. To fix this, the experimental apparatus must make the distribution physically undeniable, removing the epistemic gap between the stated odds and the subject's belief.

  Consider a search task where offers are drawn from a physical bingo cage containing a known, visible set of balls, or a deck of cards that is reshuffled and verified before every trial. If the composition of the urn is transparent and the sampling mechanism is mechanically verified, a deviation in outcomes cannot rationally imply a deviation in the distribution. The law of large numbers is a property of the world, not a promise from the experimenter. In such a "transparent urn" design, a rational maximizer with stable preferences over wealth must maintain a constant reservation price. If the subject's stopping threshold nonetheless drifts downward after a run of bad draws from a verified urn, this cannot be explained by belief updating. It must be explained by a change in the decision rule itself.

  Therefore, the belief confound is fixable. A rigorous design can isolate the adaptive aspiration mechanism from rational learning. If the friend's results hold under these strict conditions, the "static reservation price" version of maximization is empirically falsified.

  ### The Deeper Worry: The Unfalsifiability of Optimization

  But the defender of maximization has a retreat. This is the deeper worry you raised. Even if the distribution is known and the costs are fixed, a sophisticated maximizer can argue that the utility function is not defined solely over final wealth minus search costs. They can posit that utility depends on the *sequence* of outcomes, incorporating psychological states like regret, relief, or reference-dependent satisfaction.

  On this view, an agent who lowers their standards after a bad streak is not using a heuristic; they are maximizing a complex utility function where the marginal utility of a gain is higher after a run of losses (diminishing sensitivity) or where the disutility of continued search increases with frustration. By allowing utility to depend on the history of the choice process, the maximizer can rationalize *any* stopping rule. If behavior shifts, preferences shifted. If behavior is static, preferences were stable.

  This move saves the *logic* of maximization but kills its *science*. A theory that can accommodate any observed behavior by adjusting the parameters of the utility function is unfalsifiable. It becomes a tautology: agents do what they prefer, and we know what they prefer by what they do. This is the "Generalized Axiom of Revealed Preference" pushed to its breaking point. If we allow preferences to be history-dependent in arbitrary ways, optimization theory loses its predictive power. It can no longer tell us what an agent *will* do in a new situation; it can only describe what they *did* in the last one.

  Here lies the decisive verdict. Your friend's experiment forces the maximizer into a dilemma.
  1.  **Stick to Standard Preferences:** If the maximizer insists on utility being defined over objective wealth and costs (the standard economic assumption), your friend's experiment (with the transparent urn fix) falsifies their model. Satisficing wins.
  2.  **Adopt Complex Preferences:** If the maximizer retreats to history-dependent utility to match the data, they admit that the "maximization" label is doing no explanatory work. The explanatory heavy lifting is being done by the specific assumptions about how history alters preferences—assumptions that look suspiciously like Simon's adaptive aspiration levels.

  In the second case, satisficing wins by absorption. Simon's model is mechanistic: it specifies *how* the aspiration level updates (e.g., linear adaptation to the gap between outcome and aspiration). This is a falsifiable claim about cognitive processing. The maximizer's "history-dependent utility" is a black box. To make it predictive, the maximizer must specify the function of history-dependence. Once they do so, they are no longer doing standard optimization; they are modeling a heuristic.

  ### The Verdict

  Is satisficing a real rival to cost-constrained maximizing? **Yes.** But the nature of the rivalry is often misunderstood. It is not a rivalry between two logically incompatible frameworks, but between a substantive scientific theory and a metaphysical stance.

  Your friend's experiment is decisive, provided the belief confound is eliminated via transparent mechanisms. It demonstrates that human search behavior is history-dependent in ways that standard search theory cannot predict. The maximization counter-argument—that this is just optimization over a complex utility function—is theoretically possible but scientifically suicidal. It renders the maximization paradigm unfalsifiable and devoid of independent predictive content.

  Therefore, the verdict is this: **Satisficing is the superior empirical theory.** It posits a specific, testable mechanism (adaptive aspirations) that explains the data without retreating into tautology. The maximization redescription survives only by ceasing to be an economic model of rational choice and becoming a philosophical claim about the consistency of action. For the purposes of a philosophy-of-economics seminar concerned with explanation and prediction, Simon's view is not merely vocabulary; it is the only model that risks being wrong. Your friend's test does not just break the tie; it exposes that the tie existed only because the maximization side was refusing to keep score.
