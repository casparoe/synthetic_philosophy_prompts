answer: |-
  **A:** I've been turning over last week's exchange about the ontology of social kinds, and I keep returning to the intuition that we are using the phrase "socially constructed" to do too much work. When we say money is constructed, and when we say gender is constructed, we are pointing to a unified mechanism—collective acceptance conferring status function. But I'm convinced there is a modal divergence here that standard institutional accounts gloss over. Money lacks what I'm calling "embodied feedback loops." Gender and race, by contrast, involve categorical schemas that reshape biological dispositions and affective patterns. They don't just sit on top of the world; they sink into the organism.

  **B:** I agree that the unified label is obscuring something, but I think you're locating the divergence in the wrong place. You're still treating gender and race as fundamentally institutional kinds, just ones with sticky consequences. My worry is that this preserves the voluntarist illusion—that if we could just shift the collective acceptance, the kind would dissolve. Money fits that model. If the Federal Reserve and the global banking network revoked the status of the dollar tomorrow, it becomes linen blend. But race and gender are anchored in durable material-historical trajectories. They aren't just sustained by current uptake; they are sustained by labor extraction, reproductive regimes, and territorial segregation. These are causal patterns that would persist even if collective beliefs were fully revised.

  **A:** But that persistence is exactly what I'm trying to capture with the feedback loop. When you subject a body to a racialized or gendered schema over time, the institution doesn't just regulate the body; it remodels it. Cortisol levels, muscle tension, spatial orientation—these become physiological facts. So, in a sense, I agree with you that you can't just revoke them by fiat. But I disagree that this makes them *material-historical* in your sense. They are still institutional kinds, but their mode of existence has migrated from the deontic realm into the biological realm. The institution becomes flesh. That's why they resist dissolution differently than money. Money never becomes flesh.

  **B:** I need to press you on whether this "migration" is genuinely ontologically distinctive, or whether it's just a description of slower-decaying institutional effects. Let's run the counterfactual. Suppose we could magically scrub collective acceptance of gender from the population overnight. No one recognizes gender categories anymore. On your view, does the embodied feedback persist? Do the hormonal profiles and affective habits remain as ontological freestanding facts?

  **A:** They would remain as causal residues, yes. But more than that, they would constrain the possibility of new institutional formations. You couldn't simply instantiate a new institution on top of those bodies immediately because the material substrate has been pre-shaped. The inertia is internal to the kind.

  **B:** But if they depend on that initial institutional shaping to exist, then they are still parasitic on collective acceptance, even if the decay rate is slow. You're describing a lag effect. If the feedback loops are generated by the institution, then without the institution to regenerate them, they should eventually dissipate. If you admit they would eventually dissipate without collective uptake, then you've conceded they are institutional kinds, just robust ones. My point is that race and gender aren't just robust institutions; they are causal structures that have achieved a degree of independence from current recognition. The wealth gap produced by redlining isn't a "feedback loop" of current belief; it's a material distribution of resources that operates causally regardless of whether anyone currently believes in the legitimacy of redlining.

  **A:** Now you're smuggling in a non-social base. You speak of "material distribution" as if it's ontologically prior to the institutional framing. But a house is only an asset, only "wealth," within a system of property rights. The materiality you're appealing to—the brick, the land, the currency digits—is inert without the institutional context that makes it valuable or segregatable. So when you say race is anchored in material history, you're actually saying it's anchored in *past* institutional configurations that have left physical scars. But those scars only function as "anchoring" because we continue to interpret them institutionally. You haven't escaped institutionalism; you've just hidden the institution in the history.

  **B:** I'm not positing bare matter. I'm positing causal powers that are indifferent to current interpretation. Let's take environmental racism. A toxic waste site is placed in a specific neighborhood due to racialized zoning laws fifty years ago. The cancer clusters appearing today are causal outcomes of that history. If everyone tomorrow ceased to believe in race, the cancer clusters would not vanish. The biological damage is real, and it is tied to the historical categorization, but it is no longer dependent on the *current* maintenance of that category. Money doesn't work this way. If everyone stops believing in the dollar, the purchasing power vanishes instantly. The physical paper remains, but the kind "money" is extinguished. With race, the kind "racialized population" persists because the causal trajectory—the health disparity, the economic disadvantage—continues to operate independently of current deontic powers.

  **A:** But you're conflating the *effects* of the kind with the *kind* itself. The cancer clusters are biological facts. They become racial facts only when mapped back onto a social schema. If we lost the schema, you would have a population with high cancer rates, but you wouldn't have a race. You'd just have sick people. My claim is that the "embodied feedback loop" is what keeps the schema alive even when explicit acceptance wavers. The body signals the category back to the social world. The way a person moves, the way they are perceived physically—these trigger the institutional response anew. So the institution is being regenerated somatically. That's why it's not just a lag effect. It's a recursive loop where the body becomes the enforcer of the institution.

  **B:** That recursive loop is precisely what I'm calling a material-historical trajectory. You want to call it "somatic enforcement," I call it "causal inertia." But the stakes of this distinction matter for reform. If you're right—if this is primarily about embodied feedback and institutional recursion—then dissolution requires retraining bodies, changing affective patterns, and shifting recognition. It's a project of phenomenological and behavioral reform. But if I'm right, if these are material-historical structures, then changing how people feel or move is insufficient. You have to dismantle the causal architecture itself. You have to redistribute the wealth, remediate the soil, and break the structural dependencies. Calling them "socially constructed" in the same sense as money suggests that a change in status function is sufficient for abolition. I'm arguing that for race and gender, the status function is secondary to the material accumulation.

  **A:** I see the stakes, but I think your view risks reifying the very categories we hope to dissolve. If you say the causal trajectory persists independently of collective acceptance, you risk treating race as a natural kind defined by historical essence. My "modal institutionalism" is meant to preserve the possibility of abolition. By insisting that the embodied feedback is still institutional in origin, I maintain that it *can* be undone, even if it requires deep somatic work. If you anchor it in material history too firmly, you suggest that the history itself constitutes the kind, which makes the kind immutable unless you can reverse time.

  **B:** I'm not saying the kind is immutable. I'm saying the *method* of dissolution is misidentified if we treat it like money. You can abolish money by changing the rules. You cannot abolish race by changing the rules, because the rules are no longer the primary engine of the phenomenon. The engine is the accumulated material disparity. My realism isn't about immutability; it's about causal independence. The question is whether the ontology of race is found in the current collective acceptance or in the historical causal chain. I'm arguing it's the latter. You're arguing it's the former, plus a lot of biological residue.

  **A:** And I'm arguing that the "biological residue" is where the ontology now lives. It's not just residue; it's the new locus of the status function. When I look at gender, I don't see a historical chain separate from the body; I see the history *written* on the body. The distinction you're drawing between "institutional" and "material" breaks down at the surface of the skin. The skin is where the institution becomes material. So when you say I'm ignoring the material anchoring, I say I'm locating it precisely where it operates: in the embodied habitus. The divergence isn't between institution and material; it's between institutions that remain external (money) and institutions that become internal (race/gender).

  **B:** But if they become internal, do they remain social? If the feedback loop is physiological—if it's about stress responses and motor habits—haven't you crossed the line into a form of biological essentialism, even if you claim the origin was social? You need to explain how a physiological state remains a "social kind" without continuous collective uptake. If I'm alone on an island, I still have the stress responses caused by prior racialized trauma. On your view, am I still racialized?

  **A:** You are racialized insofar as those responses dispose you to be re-intercepted by the institution upon re-entry. The kind is modal. It defines how you *would* be treated, how you *would* move in social space. The embodied state is a disposition toward institutional recognition. Money on an island is just paper. A racialized body on an island is still a body shaped by social forces that retains the shape even in isolation. That difference in modal profile—isolation tests—is what proves they are not unified kinds. Money fails the isolation test; race and gender pass it, because the construction is embodied.

  **B:** I concede the isolation test reveals a difference, but I deny your interpretation of it. The reason the racialized body retains the shape is not because the institution is internalized, but because the cause was material damage. It's the difference between a promise and a scar. A promise (like money) vanishes if the community forgets it. A scar (like racialized disadvantage) remains even if the community forgets how it was inflicted. You're calling the scar an "internalized institution." I'm calling it a material effect of a historical cause. The ontology of the scar is causal, not deontic. And if we treat it as deontic, we misunderstand what is required to heal it. We don't need new rules to heal a scar; we need material repair.

  **A:** But a scar only matters socially because of the rules that assign value to unscarred bodies. The material repair you're talking about is itself an institutional project. You can't escape the institutional frame, B. Even your "material repair" is a deontic assignment of resources. So we're back to square one: everything is institutional, but some institutions bind tighter because they bind the body.

  **B:** Then perhaps the disagreement is whether "institutional" is the right master category for everything that binds. If the binding force of race is the causal weight of history rather than the normative force of current acceptance, then calling it "institutional" might be the category mistake. It suggests the lever of change is always normative. I'm arguing that sometimes the lever is purely causal, independent of normativity.

  **A:** And I'm arguing that without the normativity, the causal weight loses its specific social meaning. It becomes just physics. The tension remains, doesn't it? Whether the inertia is institutional resistance or material independence.

  **B:** Yes. And until we resolve whether the inertia is in the mind and body or in the structure and history, we won't know whether to treat the subject or the system.

  **A:** Precisely. And that is why the unified sense of "construction" is dangerous. It suggests one tool for two different ontologies.

  **B:** Or perhaps it suggests we've been using the wrong tool for both. But at least now we see where the handle breaks.
