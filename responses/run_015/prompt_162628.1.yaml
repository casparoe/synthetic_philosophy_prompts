prompt: |-
  ok so: you're a political philosopher who specializes in distributive justice. Please actually think hard about this one — brainstorm for a bit before you start writing, and don't give me the seminar-handout version.

  I'm working on luck egalitarianism — the family of views on which inequality is fine when it tracks people's own choices and unjust when it tracks brute luck — and I want a case analysis, not a definition. The case is Hurricane Katrina and New Orleans. The facts I want you to work from (all common knowledge, I'm not asking you to look anything up): the city issued a mandatory evacuation order the day before landfall; a large share of the people who stayed were poor, elderly, or had no car of their own; when the levees failed, the flooding hit the low-lying, mostly Black neighborhoods hardest; the failure was later traced substantially to how the flood-protection system had been designed and maintained, not just to the storm; and a lot of the people who did get out did so using relatives, employers, or their own money rather than any public plan.

  Here's the wrinkle I want you to engage with, because it's my own angle and I havent seen it handled: option luck (I chose to gamble, so I eat the loss) is standardly the responsibility-preserving case, but I think there's a third category sitting next to brute luck and option luck — call it stakes luck: luck in how much a person had riding on a gamble they genuinely did choose. Two people both voluntarily stay; one has a second home elsewhere and a full tank of gas, the other has every material thing they own in the flood zone and no way to leave later. So: is stakes luck just brute luck in disguise, and if it is, does the option-luck category partly collapse, given that in the real world the size of what you put at risk is almost always fixed by things you didn't choose?

  Then do the mapping properly and disciplined: who the agents are (individuals, the city, the state, FEMA, private insurers), what the actual option set was for a poor resident with no car, what counts as compensation versus rescue versus insurance, and what luck egalitarianism says was owed, to whom, and by whom. I especially want to know whether the view has anything to say about the duty to rescue after the fact, or whether it only has a forward-looking insurance story to tell, and what it says about a harm that was collectively produced by infrastructure nobody properly maintained.

  And run it back the other direction too: does the familiar objection that luck egalitarianism abandons or shames the imprudent actually bite here, or is the deeper problem that the view is built for individuals facing gambles and has no vocabulary for engineered, shared risk? Be honest about where the theory is silent rather than stretching it to speak. Under 800 words, and no citations or reading lists — I want the argument, not the bibliography.
