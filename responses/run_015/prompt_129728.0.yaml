answer: |-
  The tension you identify between Jaspers' metaphysical guilt and the bureaucratic sorting of denazification is not a failure of Jaspers' framework, but rather the precise diagnostic tool needed to explain why the denazification process felt morally unsatisfying to both the occupiers and the Germans. The episode confirms Jaspers' taxonomy by demonstrating the catastrophic results of conflating these distinct categories. The bureaucratic machinery was designed to adjudicate Criminal and Political guilt, but it collapsed when it attempted to codify Moral and Metaphysical guilt. Therefore, Jaspers' framework survives contact with bureaucratic reality, while the episode undermines the claim that a nation can be criminally or morally guilty as a collective entity, supporting only the claim that a nation bears collective political liability.

  To map this strictly: Criminal guilt belongs to the individual perpetrator, evidenced by specific violations of law, and was handled adequately by the Nuremberg trials and criminal courts for top-tier offenders. The bureaucracy worked here because the bearer (the individual) and the evidence (acts) matched the legal tool. Political guilt belongs to the citizen, evidenced by residency and membership within the state apparatus, and was the primary target of the *Spruchkammern* (tribunals). This is where the "Follower" (*Mitläufer*) category belongs. It was never meant to be a moral judgment but a political liability assessment: you benefited from or sustained the regime, so you bear responsibility for its cleanup. The bureaucracy could register this because membership cards and employment records are objective data.

  The breakdown occurred when the questionnaire system (*Fragebogen*) attempted to capture Moral guilt. Moral guilt belongs to the individual conscience, evidenced by internal conduct and silence during the regime. The bureaucracy failed here because a form cannot measure conscience. When tribunals labeled someone a "Follower," they intended a political classification, but the public received it as a moral stigma. This conflation created the resentment that fueled the 1951 amnesty debates. The amnesty was a political necessity to stabilize the new West German state, effectively wiping Political guilt for millions. However, because Political guilt had been conflated with Moral guilt, the amnesty was perceived as a moral absolution it could not grant.

  This leads to your specific sticking point on Metaphysical guilt. Jaspers assigns this to everyone who survived, grounded in human solidarity before God. You worry this collapses the distinction between "Follower" and "Exonerated." It does not, because Metaphysical guilt is not adjudicable by human institutions. The bureaucratic distinction remains valid in the Political realm (liability for state reconstruction) even if both parties share Metaphysical guilt (survival amidst atrocity). The hollowness you sense arises because the denazification process implicitly promised to resolve Metaphysical guilt through Political categorization. It promised that if you were marked "Exonerated," you were clean before history and humanity. That was a lie the bureaucracy could not keep. The theory is silent on bureaucratic remedies for metaphysical guilt because there are none; it requires inner transformation, not a stamped form.

  Consequently, the episode reveals that "collective national guilt" is incoherent if understood as a monolithic criminal blame assigned to a people. A nation cannot stand in a dock. However, the episode supports the claim that a nation can be guilty in the specific sense of Political liability. The German nation as a political entity was liable for the crimes committed in its name, requiring restitution and restructuring, regardless of individual criminal innocence. The failure of denazification was not that it tried to assign collective guilt, but that it tried to administer Moral and Metaphysical guilt using Political tools. Jaspers' framework survives because it isolates this category error. The bureaucracy could sort citizens for political reliability, but it could not sort souls for moral worth, and it certainly could not judge the metaphysical condition of survival. The 1951 amnesty was the inevitable correction where Political reality reasserted itself over Moral pretension, leaving the Metaphysical debt unpaid and unaddressed.

  Verdict: Jaspers' framework holds; national guilt is political liability, not criminal blame.
