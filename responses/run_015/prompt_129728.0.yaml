prompt: |-
  I was talking with some friends after watching a documentary about post-war Germany, and someone brought up this idea that an entire nation might carry guilt, not just the individuals who committed crimes. I have no philosophy background, but I looked into it enough to learn that Karl Jaspers divided guilt into four kinds—criminal, political, moral, and metaphysical—and I tried applying that to what actually happened during the denazification process from roughly 1945 to 1951, especially the questionnaire system and the later amnesty debates that sorted people into administrative categories like major offenders, ordinary party members, and those fully cleared. What I want is not a general summary but a careful mapping: take the actual bureaucratic episode—the forms people filled out, the tribunals that assigned them to groups, the 1951 political push to amnesty "followers"—and run it through Jaspers' four categories. For each type, identify who the bearer was meant to be, whether the administrative machinery could even register that kind of guilt, and what happened to the ones that did not fit the legal sorting.

  In particular, I keep getting stuck on metaphysical guilt, which Jaspers assigns universally to anyone who survived and witnessed the regime's crimes. That seems to collapse the distinction the questionnaires tried to enforce between a "follower" (Mitläufer) and someone "exonerated" (Entlastete): if metaphysical guilt applies to everyone regardless of membership, then the bureaucratic effort to separate the mildly complicit from the innocent looks either conceptually incoherent or morally hollow. At the same time, the tribunals clearly did separate people, and the amnesty debates turned on exactly those distinctions. So analyze whether this tension is a failure of Jaspers' framework—because it ignores the administrative need to individuate blame—or a failure of the denazification process—because it treated guilt as something that could be assigned by a form rather than lived— or whether it reveals that collective national guilt was never a coherent idea to begin with. Be disciplined about the mapping: say who is the player, what counts as the evidence of guilt in each category, and where the theory is silent rather than forcing it to speak.

  I do not want a bibliography, a reading list, or citations; I want you to take a definite position, with reasons, on whether Jaspers' framework survives contact with the bureaucratic reality, and whether the episode ultimately supports or undermines the claim that a nation can be guilty. Do not lay out every option neutrally—commit to one interpretation and defend it, even if it means conceding that part of the theory or part of the historical process was misguided. End your response with a single line in this exact format: Verdict: [your conclusion in one short phrase].
