answer: |-
  The principle underlying your unevenness is the **Sovereignty of Ends**. Deference is licensed on *instrumental* questions (causal facts, means to shared ends) and *coordinative* norms (voluntary collective action). It is prohibited on *constitutive* questions (fundamental values, life definitions) unless you explicitly adopt the advisor's normative framework.

  Your proposed clauses evaluate as follows: (A) is necessary for instrumental deference but insufficient, as it excludes coordinative cases (7). (B) is false; expertise obviates the need for personal capacity building (6). (C) is correct but requires a "voluntary membership" qualifier to distinguish your union friend (7) from your uncle (8).

  **Resolving Your Tensions**
  *   **6 vs. 8 (Orphanage vs. Uncle):** Case 6 is instrumental. The claim "volunteering harms children" is an empirical causal assertion where the aid worker has epistemic advantage. Case 8 is constitutive. Your uncle's objection bottoms out in religious teleology—a framework you do not share. Deferring on facts is efficient; deferring on ends is surrender.
  *   **5 vs. 7 (Bednets vs. Picket Line):** Case 7 is coordinative. The picket line functions on solidarity; the value lies in uniform action, not individual justification. You are buying into a collective norm. Case 5 is constitutive. An obligation to donate ten percent reorders your life's structure and values. It claims sovereignty over your resources and identity. Resistance scales with the threat to agency.
  *   **4 vs. 5 (Child vs. Bednets):** You feel sharper resistance in 5 because permissions (4) preserve agency while obligations (5) usurp it. Your friend granting permission leaves the veto power with you; declaring obligation seizes it. The reasoning in 5 may be cleaner, but the speech act is more invasive.

  **Undecided Cases**
  *   **(i) AI/Texting Ex:** **No deference.** This is constitutive. Deciding whether to reopen a relationship defines your emotional life and values. An AI lacks shared context and moral standing. It satisfies (B) by giving reasons, but fails the sovereignty test. Your gut is right.
  *   **(ii) Forum/AI Job:** **Deference permitted.** This is primarily instrumental. The question concerns career risk and capability acceleration—empirical predictions where aggregate wisdom functions as expertise. However, because career paths touch on identity, expect mild residue similar to Case 3.
  *   **(iii) Moral Superior/Forgiveness:** **No deference.** Forgiveness is constitutive. It changes your internal relationship to a wrongdoer. Moral expertise does not transfer agency over your own emotional resolutions. You cannot outsource reconciliation.

  **Overturned Verdicts**
  I overturn your verdict on **Case 3 (Ballot Measure)**. You report "mild residue" for voting without understanding the evidence. This is misplaced. Voting in a complex democracy is inherently delegatory; expecting personal expertise on risk-assessment algorithms misunderstands the institution. The residue suggests an inflated view of individual epistemic duty. Deference here is a feature of civic trust, not a bug. Your discomfort should be zero, provided you trust the writer's alignment.

  I uphold your verdicts on **4 and 5**, but clarify the distinction. Steelmanning your friend: In Case 4, she acts as a mirror for your own risk tolerance, helping you see your values clearly. In Case 5, she acts as a commander, imposing an external moral law. Your resistance in 5 is not squeamishness; it is a correct intuition that moral obligation must be self-legislated to be binding. You can accept the *argument* for bednets, but you cannot accept the *obligation* on her say-so without losing moral autonomy.

  **Where the Account Falls Silent**
  This principle struggles when empirical facts entail moral conclusions. If a doctor says, "Smoking will kill you," that is instrumental. If an epidemiologist says, "Visiting grandma will kill her," that blurs instrumental and constitutive. The fact (death) dictates the value (preservation of life). Here, deference feels different because the stakes collapse the means/ends distinction.

  Additionally, the account assumes you know your own ends. Often, advisors reveal ends you didn't know you had. If a friend says, "You should leave your partner because you value growth over stability," they are not just deferring on a fact; they are articulating a value you may recognize as your own upon hearing it. The Sovereignty of Ends principle treats values as static, but they are often discovered through deference. In these liminal cases, the line between learning facts and adopting values dissolves, and the principle offers no clear guide.

  Finally, the principle does not quantify "voluntary membership" for coordinative deference. How much social pressure turns a voluntary norm (7) into a coercive one (8)? There is a spectrum of community binding that this binary test misses. You may feel fine about the picket line today, but if the community punishes deviation severely, the coordinative deference becomes constitutive coercion. The principle licenses the act but does not audit the cost of membership.
