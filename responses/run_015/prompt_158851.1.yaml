answer: |-
  **SUBSTITUTE JUDGMENT PANEL: DECISION PROCEDURE v4.1**

  **Step 1: Dossier Lock (Addressing Dossier Gerrymandering)**
  Assemble evidence of prior values. Admissibility hierarchy: (1) Written directives signed while competent; (2) Verified oral statements to disinterested parties; (3) Oral statements to interested parties (family/heirs).
  *Weighting Rule:* Statements within 5 years carry double weight unless contradicted by older written directives.
  *Thin/Contested Rule:* If >50% of the dossier comes from interested parties or is contested by an heir, the dossier is deemed "Thin."
  *Stop Rule:* If Dossier is Thin, recommend **Status Quo** (maintain current refusal/acceptance). Record finding: "Insufficient evidence for extrapolation."
  *Accountability Point:* Panel vote on admissibility classifications.

  **Step 2: Factual Correction (Addressing Order of Idealization)**
  Identify factual beliefs underpinning the current refusal/consent (e.g., "I will be a burden," "This procedure kills").
  *Operation:* Remove desires dependent on demonstrably false facts.
  *Stop Rule:* If refusal dissolves upon factual correction, recommend **Treatment**.
  *Accountability Point:* Panel must cite specific medical facts correcting the belief.

  **Step 3: Distortion Filtering (Addressing Order of Idealization)**
  Identify desires stemming from treatable pathological states (depression, psychosis, acute pain, eating disorders).
  *Operation:* Filter out desires generated by the pathology. Retain desires consistent with pre-pathology values.
  *Accountability Point:* Panel must vote: "Is this desire a symptom or a value?" This vote is recorded in the advisory.

  **Step 4: Coherence Mapping**
  Map remaining desires against the patient's enduring value set (e.g., stoicism, independence, faith).
  *Operation:* Select the option that maximizes coherence with the enduring value set.
  *Stop Rule:* If values are mutually exclusive (e.g., survival vs. religious purity), proceed to Step 5.

  **Step 5: Identity Continuity Test (Addressing Identity Cutoff)**
  Compare the "Idealized Agent" (result of Steps 2-4) with the "Actual Patient."
  *Operation:* Panel vote. Does the Idealized Agent share >50% of the patient's core narrative traits (relationships, commitments, self-conception)?
  *Stop Rule:* If **No**, the idealization has created a stranger. Recommend **Status Quo**.
  *Accountability Point:* This vote is the primary defense against ombudsman review regarding identity stripping.

  **Step 6: Repudiation Check (Addressing Repudiation)**
  Search dossier for evidence that the patient valued current autonomy over idealized consistency (e.g., "Whatever I say now counts," "Don't let them override me").
  *Operation:* If such a meta-preference exists, it overrides Steps 2-4.
  *Stop Rule:* If **Yes**, recommend **Current Choice**.
  *Accountability Point:* Panel must cite specific evidence of this meta-preference.

  **Step 7: Stability Test (Addressing Convergence Failure)**
  Vary the weighting of evidence and distortion filters by ±20%.
  *Stop Rule:* If the recommendation flips, the result is unstable. Recommend **Status Quo**. Record finding: "Idealization unstable."
  *Accountability Point:* Panel signs off on the sensitivity range.

  ***

  **CASE APPLICATIONS**

  **Case 1: 78M, Hip Replacement, Dementia/Depression**
  *Step 1 (Dossier):* Written letter (10 years ago) vs. oral refusal (now). Written carries higher admissibility. Dossier **Secure**.
  *Step 2 (Facts):* Belief "I will be a burden" is factually correctable (rehab available). Refusal partly fact-based.
  *Step 3 (Distortion):* Clinicians confirm untreated depression. Panel votes: Refusal is **Symptom**. Filtered out.
  *Step 4 (Coherence):* Enduring value: "Self-reliant stoic." Surgery restores function aligning with stoicism; refusal aligns with "stubbornness" (which he rejected in letter).
  *Step 5 (Identity):* Idealized agent is still a stoic man. **Pass**.
  *Step 6 (Repudiation):* No evidence he valued current depressed choice over past competent letter.
  *Step 7 (Stability):* Recommendation holds across weightings.
  *Outcome:* **Recommend Treatment.** The procedure isolates the depression as the distorting variable, respecting the older, coherent stoic value set.

  **Case 2: 29F, Anorexia, Feeding**
  *Step 1 (Dossier):* Consistent oral statements over months. Dossier **Secure**.
  *Step 2 (Facts):* She is informed regarding mortality. No factual errors.
  *Step 3 (Distortion):* Panel votes on "Thinness vs. Life." Under medical consensus, anorexia nervosa is a pathological distortion of value perception. Panel votes: Desire is **Symptom**. Filtered out.
  *Step 4 (Coherence):* Without the pathology, does she value life? Presumption of life-value applies unless contradicted by secure dossier (none exists pre-illness).
  *Step 5 (Identity):* Idealized agent (healthy) vs. Actual Patient (starving). Panel determines the disease has usurped the agent. **Pass** (Idealized agent is the "real" her).
  *Step 6 (Repudiation):* She values current choice, but this is deemed part of the pathology (Step 3).
  *Step 7 (Stability):* Stable.
  *Outcome:* **Recommend Feeding.** The procedure overrides at **Step 3**. The record shows the panel classified the value hierarchy as pathological, not identity-constituting. This is the accountability point for coercion.

  **Case 3: 54M, Transfusion, Religion**
  *Step 1 (Dossier):* Community reps (interested in doctrine) vs. Estranged Son (interested in inheritance). Both interested. No written directive. Dossier **Thin/Contested**.
  *Stop Rule Triggered:* **Recommend Status Quo (Refusal).**
  *Outcome:* The procedure stops at **Step 1**. It does not reach the religious coercion question. Because the evidence of stable belief is contested by an heir and lacks written verification, the panel cannot construct a defensible dossier without gerrymandering. The refusal stands by default.

  ***

  **LIMITATIONS AND ACCOUNTABILITY**

  This procedure cannot validate the **Idealized-Preference Standard** itself. It assumes the statute is correct that we should respect what the patient *would* want, not what they *do* want. If a family argues that current autonomy is the only moral metric, this procedure has no answer other than to cite the statute. It operationalizes the standard; it does not justify it.

  Second, the procedure cannot settle **Who Counts as the Patient** metaphysically. Step 5 (Identity Continuity) asks if the idealized agent is "recognizably the same," but the >50% threshold is arbitrary. We have agreed to record this vote as a finding of fact, but it is actually a philosophical boundary decision. If the panel votes that a devout religious man without his faith is "not the same person," that is a judgment call masked as a continuity test. The ombudsman can challenge the vote count, but not the metaphysics behind it.

  Third, **Masked Judgment Calls**. Step 3 (Distortion Filtering) requires distinguishing "pathology" from "value." In Case 2 (Anorexia), we classified valuing thinness over life as a symptom. In Case 3 (Religion), we would have classified valuing purity over life as a value (had we passed Step 1). The procedure does not algorithmically solve this distinction; it forces the panel to vote on it and record the vote. This is where liability rests. If we filter out a political conviction as "delusional" but keep a religious one as "identity," that is a human judgment the procedure exposes but does not automate.

  Finally, the **Status Quo Default** in Steps 1 and 7 is a policy choice, not a logical necessity. When evidence is thin or idealization is unstable, we default to non-intervention. This protects the panel from error but may harm patients who would have consented. We record this as "Insufficient evidence" or "Instability," but the moral weight of letting a patient die by default rather than risk a wrongful treatment is a burden the procedure assigns to the panel, not itself.

  We are not finding the truth of the patient's will. We are constructing a defensible record that we followed the statute's order of operations. The procedure ensures that when we are wrong, we are wrong consistently, and that every override is pinned to a specific, recorded vote.
