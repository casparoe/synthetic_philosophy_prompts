prompt: |-
  I write fiction, and I am about to make a decision that a historian is free to postpone. My novel is narrated in the first person by a woman from a fishing household on the northern shore of the lake, who attaches herself to a Galilean preacher and stays with him to the end. That means I have to settle, before drafting, what this preacher said, what he refused to say, what he thought he was doing, what the people travelling with him were expecting of him, and how much of any of it is only the evangelists' retrospection. I can hedge in a note; I cannot hedge in a scene. So I need a specification rather than a survey.

  Please write the desiderata that any method for getting from our sources — the four Gospels, with their well-known dependencies on one another; the letters of Paul, with their near-total silence about the life; the brief notices in Josephus, one of which has probably been retouched by Christian hands — to a portrait of Jesus would have to satisfy. Fix the purpose as mine: a portrait good enough to build one determinate character on, capable of carrying a psychological arc and of acting for reasons a reader can follow, rather than a portrait good enough for a monograph. Whether the standard is the same for the two purposes is itself something I want you to decide.

  For each requirement, give the case or consideration behind it, and mark it either non-negotiable or a preference of one school or one craft. Among the things I want adjudicated: whether a method owes me anything about what he did not say and could not have done, or only about what he did and said; whether a method can coherently be required to be independent of the historian's prior portrait of Jesus, or whether any criterion of authenticity is doomed to ratify whichever portrait it was run to confirm; how a criterion should treat sources that are not neutral reports but interpretations produced by people who already believed; whether the desiderata should require the method to recover the believing community as well as the man, since I have to stage the ensemble and not only the protagonist; and whether the portrait must be at once continuous with first-century Jewish life and discontinuous enough to explain why a movement formed around him and why Rome killed him.

  I also want a candidate criterion of my own audited. I have been working with something I call narrative fit: a reconstruction is adequate only if the actions I need to stage follow from the sayings I attribute to him, and those sayings from those actions, without my having to supply a bridging motive that the sources nowhere suggest. Is that a genuine desideratum, a novelist's prejudice smuggled into historiographical method, or a requirement with a narrow but real domain — and if the last, over what range is it trustworthy?

  Then the two things I care about most. First, tell me which subset of your desiderata you suspect cannot be jointly satisfied, and why: I would rather have the impossibility than a list that flatters my hopes. Second, name the single requirement that does the most work in excluding the criteria in ordinary use — embarrassment, dissimilarity, multiple attestation, Semitic or Palestinian linguistic and environmental colour, coherence with what has already been accepted — and score those against your list briefly, in a table if you prefer, since that part I can check for myself.

  Two closing requests. Give me a decision rule for an author: when the best-supported reconstruction of a scene carries something like a third or two-fifths of the probability mass and the alternatives are not dramatically worse, what may a novelist do, and exactly where does legitimate filling-in become dishonest? And mark your own confidence: attach a level of confidence to each desideratum, tell me which one you would retreat from first, say which consideration or piece of evidence would change your verdict about the most discriminating requirement, and say where you think your reasoning is most likely to fail.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** A fiction writer working on a novel about a female follower of Jesus (first-person narrator, fishing household, northern shore, stays to the end).
      *   **Task:** Define *desiderata* (requirements/criteria) for a method of reconstructing the historical Jesus suitable for *fiction writing* (character consistency, psychological arc) vs. *historical monograph* (probabilistic survey).
      *   **Specific Constraints/Questions to Address:**
          *   Fix the purpose: Character building vs. academic survey. Are standards the same?
          *   Adjudicate specific tensions: Silence/negatives, circularity of criteria, biased sources, community vs. individual, continuity/discontinuity with Judaism/Rome.
          *   Audit the user's proposed criterion: "Narrative Fit."
          *   Identify incompatible desiderata (the "impossibility").
          *   Identify the single most exclusionary requirement and score standard criteria against it.
          *   Provide a decision rule for the novelist (probability vs. invention).
          *   Self-assessment: Confidence levels, retreat point, potential failure modes.
      *   **Tone:** Intellectual, rigorous, nuanced, respectful of both historiography and literary craft. No hedging in the response itself (be determinate).

  2.  **Deconstruct the Core Tension (History vs. Fiction):**

      *   *Historian's Goal:* Probability, nuance, acknowledging uncertainty, surveying options.
      *   *Novelist's Goal:* Determinacy, psychological coherence, dramatic necessity, specific motivation.
      *   *Conflict:* History says "maybe"; Fiction says "is."
      *   *Resolution:* The novelist needs a *working truth* that is historically *plausible* even if not historically *certain*. The standard isn't "what definitely happened" but "what could have happened without violating the known constraints of the world and the character."

  3.  **Drafting the Desiderata (The "Specification"):**

      *   *Requirement 1: Psychological Continuity.* (Character needs to make sense).
      *   *Requirement 2: Contextual Plausibility.* (First-century Galilee, not 21st-century Europe).
      *   *Requirement 3: Explanatory Power for the Outcome.* (Why did he die? Why did the movement survive?).
      *   *Requirement 4: Source Integrity (without Naivety).* (Acknowledging the Gospels are theology, not biography, but using them as data).
      *   *Requirement 5: The "Negative Space" Constraint.* (What he *didn't* do matters as much as what he did).

      *   *Decision on Standards:* The standard is *not* the same. A monograph can say "Jesus might have meant X or Y." A novel must pick X. But the pick must be robust enough to withstand scrutiny.

  4.  **Addressing the Specific Adjudications:**

      *   *Silence/Negatives:* Crucial for fiction. If the Gospels never show him laughing, can the novelist make him jovial? Maybe, but it risks dissonance. The method must account for silences as potential boundaries.
      *   *Circularity:* Unavoidable. All historiography is hermeneutical. The method must be *reflexive*, not "independent."
      *   *Biased Sources:* They are the only sources. The method must treat them as "memory transformed by faith," not "lies" or "transcripts."
      *   *Community vs. Man:* Essential for this novel (narrator is a follower). The portrait must include the *effect* he had on them.
      *   *Continuity/Discontinuity:* He must be Jewish enough to be credible, distinct enough to be executed.

  5.  **Auditing "Narrative Fit":**

      *   *Definition:* Sayings justify actions, actions justify sayings. No bridging motives needed.
      *   *Verdict:* It is a *literary* necessity, not a historical criterion. Historians deal in fragments; novelists deal in arcs.
      *   *Domain:* Trustworthy for *internal consistency*, unreliable for *external verification*. It prevents the character from feeling like a puppet, but doesn't prove historicity.

  6.  **Identifying the Impossibility (The "Trilemma"):**

      *   You cannot simultaneously maximize:
          1.  Strict adherence to the earliest source strata (Q/Mark).
          2.  Psychological coherence (modern or ancient novelistic standards).
          3.  Explanatory power for the full range of later dogma (Resurrection faith).
      *   *Why:* The sources are fragmented. Filling the gaps to make a coherent psyche inevitably imports external motives.
      *   *Selection:* I will argue that *Psychological Coherence* and *Source Minimalism* are often at war.

  7.  **The Single Most Exclusionary Requirement:**

      *   *Candidate:* **Contextual Credibility (Jewish Continuity).**
      *   *Why:* It kills the "Jesus as moral teacher/Cynic/Revolutionary" anachronisms most effectively.
      *   *Scoring:*
          *   Dissimilarity: Fails (makes him too weird).
          *   Embarrassment: Passes (mostly).
          *   Multiple Attestation: Passes (mostly).
          *   Coherence: Passes (if base is good).
          *   Semitic Color: Passes.

  8.  **Decision Rule for the Novelist:**

      *   *The "Plausible Truth" Rule:* If a reconstruction is within the top tier of historical probability (even if not >50%), and it serves the *Narrative Fit*, it is legitimate.
      *   *Dishonesty Line:* When you invent a motive that contradicts a hard historical constraint (e.g., making him deny Torah law explicitly when evidence suggests he kept it).
      *   *Threshold:* 33-40% probability is fine for fiction *if* it creates a coherent whole. Fiction requires 100% commitment to a 40% probability.

  9.  **Self-Assessment (Confidence & Retreat):**

      *   Need to be honest about the limitations of AI in theological/historical nuance.
      *   *Confidence:* High on literary theory, Moderate on specific historical Jesus scholarship nuances (though trained on them).
      *   *Retreat:* If new archaeological evidence shifts the context of Galilean Judaism significantly.
      *   *Failure Mode:* Over-valuing coherence over chaos. History is messy; novels need order.

  10. **Refining the Output:**

      *   Ensure the tone is direct ("I cannot hedge in a scene" -> "I will not hedge in this response").
      *   Structure clearly with headings.
      *   Check all constraints from the prompt are met. (Desiderata, Case, Negotiability, Narrative Fit Audit, Impossibility, Exclusionary Requirement, Decision Rule, Confidence).

      *(Self-Correction during drafting)*: I need to make sure I don't just give a history lesson. The user is a novelist. The advice must be actionable for *character construction*. The "Narrative Fit" audit is crucial. I need to be firm on whether that's valid historiography (it's not) but valid *fiction* (it is).

      *(Refining the "Impossibility")*: The prompt asks which subset *cannot* be jointly satisfied. I should focus on the tension between *Psychological Transparency* (knowing what he thought) and *Source Opacity* (the sources hide his interiority).

      *(Refining the "Exclusionary Requirement")*: "Contextual Credibility" is the standard scholarly term (Third Quest). I should use that but frame it for the novelist.

      *(Refining the Decision Rule)*: Be specific about the "33-40%" probability. That's the "plausible fiction" zone.

      *(Final Polish)*: Ensure the voice is authoritative yet collaborative.

  11. **Final Review against Prompt:**
      *   Desiderata with Case & Negotiability? Yes.
      *   Purpose fixed (Novel vs Monograph)? Yes.
      *   Adjudications (Silence, Circularity, Bias, Community, Continuity)? Yes.
      *   Audit "Narrative Fit"? Yes.
      *   Impossibility identified? Yes.
      *   Single Exclusionary Requirement + Table? Yes.
      *   Decision Rule (Probability vs Dishonesty)? Yes.
      *   Confidence/Retreat/Failure? Yes.

      *Let's write.*
answer: |-
  Here is the specification you requested. I have treated your constraint—"I cannot hedge in a scene"—as the governing principle. A historian may conclude "Jesus probably meant X, but Y is possible." A novelist must write X or Y. Therefore, the desiderata below prioritize *constructive plausibility* over *probabilistic caution*, while demanding that the construction not violate the known boundaries of the world.

  ### I. Desiderata for a Novelistic Portrait

  **1. Contextual Credibility (The Jewish Matrix)**
  *   **Case:** Jesus must be intelligible as a first-century Galilean Jew. His debates, metaphors, and conflicts must arise from Torah, Temple, and Land, not from later Christian theology or modern ethics. If he speaks in riddles, they must sound like mashalim, not Aesop.
  *   **Status:** **Non-negotiable.** Without this, he is a costume, not a character.
  *   **Adjudication (Continuity/Discontinuity):** He must be continuous enough to be recognized as a Jew by his peers, but discontinuous enough in *emphasis* or *authority* to provoke a lethal response from Rome and tension with Jerusalem. The discontinuity must be political/religious, not metaphysical (i.e., he is killed for what he *does/says*, not for what the Council of Nicaea later says he *was*).

  **2. Psychological Continuity (The Inner Arc)**
  *   **Case:** A character cannot act randomly. If he heals on Sabbath in Capernaum, his motivation in Jerusalem must be traceable to the same core drive. The sources are fragmentary; the novelist must supply the connective tissue of motive.
  *   **Status:** **Non-negotiable (for fiction).** Historians can accept contradiction; characters cannot.
  *   **Adjudication (Silence/Negatives):** The method *must* account for what he did not say. If the sources never show him laughing, or never show him discussing Roman taxation directly, you cannot make him a jovial tax-reformer without a bridging motive. The silence is a boundary condition.

  **3. Reflexive Circularity (The Hermeneutic Loop)**
  *   **Case:** You asked if a method can be independent of the historian's prior portrait. It cannot. All criteria are tools to refine a hypothesis, not generate one ex nihilo.
  *   **Status:** **Preference of Craft.** Acknowledge the loop. Do not pretend your reconstruction is "objective." State the core hypothesis (e.g., "Jesus was an eschatological prophet") and ensure every scene tests that hypothesis.
  *   **Adjudication (Circularity):** Do not seek independence; seek *consistency*. The criterion is not "Does this prove my view?" but "Does this contradict my view without good reason?"

  **4. Communal Resonance (The Follower's Eye)**
  *   **Case:** Your narrator is a follower. The portrait of Jesus must explain *why she follows*. A portrait that makes him opaque or purely alien fails the novel, even if it is historically "safe."
  *   **Status:** **Non-negotiable (for this novel).** You are staging an ensemble.
  *   **Adjudication (Community vs. Man):** The method must recover the *effect* he had on them. If the historical reconstruction makes him unlovable or unintelligible to a fisherwoman, it is useless for your purpose. The "historical Jesus" must be compatible with the "remembered Jesus" of your narrator.

  **5. Source Integrity (Theology as Data)**
  *   **Case:** The Gospels are not neutral reports; they are kerygma. However, they are the only data. You cannot strip the theology away to find the "real" man; the theology is the lens through which he was seen.
  *   **Status:** **Preference of School (Third Quest).** Treat the theological interpretation as evidence of his *impact*. If Mark says he was angry, that is data about how he was perceived, which is data about how he acted.
  *   **Adjudication (Bias):** Do not discard material because it is theological. Discard material only if it is anachronistic (e.g., explicit Trinitarian language in a pre-crucifixion scene).

  ---

  ### II. Audit of "Narrative Fit"

  **Your Criterion:** *A reconstruction is adequate only if the actions follow from the sayings, and sayings from actions, without supplying a bridging motive the sources nowhere suggest.*

  **Verdict:** This is a **Literary Requirement**, not a Historiographical one. It has a narrow but real domain of trustworthiness.

  *   **Why it is not History:** History deals in fragments. A man can be inconsistent. He can say one thing and do another. Historians look for the dissonance. Novelists look for the arc. Demanding "Narrative Fit" risks smoothing out the very rough edges that make a historical figure real.
  *   **Where it is Trustworthy:** It is trustworthy for **Character Integrity**. It prevents you from making Jesus a puppet of the plot. If you need him to go to Jerusalem, the motive must exist in the sayings you have already established in Galilee.
  *   **The Danger:** It tempts you to invent a "unified field theory" of Jesus' psyche that never existed.
  *   **Ruling:** Adopt it as a **constraint on invention**, not a **criterion of authenticity**. You may not invent a motive to bridge a gap unless that motive is consistent with the established character. If the sources show a gap (e.g., sudden silence), respect the gap; do not fill it with a convenient monologue.

  ---

  ### III. The Impossibility

  You asked which subset of desiderata cannot be jointly satisfied.

  **The Trilemma:** You cannot simultaneously maximize **(1) Strict Source Minimalism**, **(2) Psychological Transparency**, and **(3) Explanatory Power for the Movement.**

  *   **Why:**
      *   If you stick strictly to the earliest sources (Minimalism), you have fragments. You lack the data for Psychological Transparency (interior motive).
      *   If you supply the Interior Motive (Transparency) to make a coherent character, you inevitably import external assumptions, reducing Historical Minimalism.
      *   If you focus on explaining why the movement survived (Explanatory Power), you often have to privilege the Resurrection appearances or post-Easter faith, which obscures the Pre-Easter man.
  *   **The Sacrifice:** For your novel, you must sacrifice **Strict Source Minimalism**. You cannot write a novel using only the "Q" material or the "authentic" sayings. You must flesh him out. Therefore, you must accept that your psychological portrait will be a *plausible hypothesis*, not a *minimalist certainty*.

  ---

  ### IV. The Single Exclusionary Requirement

  The requirement that does the most work in excluding bad criteria is **Contextual Credibility (Jewish Continuity).**

  Most "Jesus" reconstructions fail because they make him a modern liberal, a Cynic philosopher, or a Zealot revolutionary in a 19th-century sense. Contextual Credibility kills these anachronisms.

  **Scorecard of Standard Criteria against Contextual Credibility:**

  | Criterion | Score | Reason |
  | :--- | :--- | :--- |
  | **Dissimilarity** | **FAIL** | By definition, this finds what makes Jesus *unlike* his context. It produces a weirdo, not a Jew. It is useless for your purpose. |
  | **Embarrassment** | **PASS** | Generally reliable. Early church wouldn't invent baptism by John or crucifixion. Fits the political/religious tension. |
  | **Multiple Attestation** | **PASS** | If Mark, Q, and Paul all hint at it, it's likely embedded in the context. |
  | **Semitic Color** | **PASS** | Strong indicator of early tradition, but can be faked. Use with caution. |
  | **Coherence** | **PASS** | *Only if* the primary data is sound. If your base is wrong, coherence just builds a consistent fiction. |
  | **Narrative Fit** | **N/A** | Literary tool, not historical. Does not verify context. |

  **Winner:** **Embarrassment** is the most robust single filter for *events*, but **Contextual Credibility** is the most robust filter for *character*.

  ---

  ### V. Decision Rule for the Author

  **The Problem:** You have a reconstruction with ~35% probability. Alternatives are not dramatically better. Where is the line between legitimate filling-in and dishonesty?

  **The Rule:** **The "Plausible Truth" Standard.**

  1.  **Legitimate Filling-In:** You may treat a 35% probability as 100% certainty *for the sake of the scene*, **provided** that the choice does not contradict a "Hard Constraint" (a fact with >90% probability, e.g., he was crucified by Rome, he was Jewish, he spoke Aramaic).
  2.  **Dishonesty:** You cross the line when you invent a motive or saying that *resolves a historical tension* in a way that serves your plot but violates the *Contextual Credibility*.
      *   *Example:* Making Jesus explicitly reject Torah food laws to create conflict with Pharisees. (Probability: Low. Contextual Violation: High). This is dishonest.
      *   *Example:* Making Jesus interpret Torah more strictly than the Pharisees regarding Sabbath intent. (Probability: Moderate. Contextual Violation: None). This is legitimate fiction.
  3.  **The Threshold:** If the probability mass is distributed (35% A, 30% B, 35% C), you may pick A. But you must ensure A does not make B or C *impossible* in the reader's mind, unless the plot demands a revelation.
  4.  **Disclosure:** You do not need a note in the text. The honesty lies in the *texture*. If you are guessing, write the uncertainty into the narrator's voice ("I thought he meant X, but later I saw Y").

  ---

  ### VI. Confidence and Retreat

  **Confidence Levels:**
  *   **Contextual Credibility:** 95% (Scholarly consensus on Second Temple Judaism is robust).
  *   **Psychological Continuity:** 60% (We cannot know his mind; this is a literary imposition).
  *   **Narrative Fit:** 80% (As a literary tool, it is sound; as history, it is weak).
  *   **Decision Rule:** 90% (Standard practice in historical fiction).

  **The Retreat:**
  If I were forced to retreat from one desideratum, it would be **Psychological Continuity**. If new evidence (e.g., a lost gospel fragment) surfaced showing Jesus acted erratically or changed his mind fundamentally, I would sacrifice the "arc" for the "fragment." However, for a novel, I would resist this.

  **The Verdict-Changer:**
  The consideration that would change my verdict on **Contextual Credibility** is **Archaeological Shift in Galilee**. If excavation proved Galilee was significantly more Hellenized than currently thought (a la Crossan's view vs. Sanders' view), the "Jewish Matrix" would need to be widened to include Cynic parallels. Currently, the evidence favors the Jewish Matrix (Sanders/Dunn/Wright).

  **Where My Reasoning May Fail:**
  I am an AI. I lack the intuitive grasp of *narrative pacing*. My advice on "Narrative Fit" is logically sound but may feel rigid in the drafting. You may find that a scene requires a motive that is historically "thin" but dramatically "vital." In that case, **dramatic vitality wins**, provided you do not claim it as historical fact in your paratext.

  **Final Instruction:**
  Build your Jesus on the **Embarrassment** criterion for events (what he suffered/did) and **Contextual Credibility** for motives (why he did it). Use **Narrative Fit** to bind them. Accept that you are writing a *possible* Jesus, not *the* Jesus. That is the only honest portrait available to you.
