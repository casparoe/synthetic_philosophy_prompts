answer: |-
  **Working Draft: Distributed-Self Claim Checklist**
  *For mediation sessions only. Do not put in permanent record.*

  Look, the metaphysics here is tricky. We aren't trying to prove where the soul lives. We're trying to figure out whose version of the patient is high-fidelity enough to carry weight in a decison about care. If someone is running a corrupted simulation of the patient, their vote on what the patient would want is less valid.

  Here's the procdure. Run this when two parties claim they "know" what the patient would want.

  ### Phase 1: The Data Input (History)
  **Question:** "Describe the frequency and depth of interaction with the patient in the 5 years prior to incapacitation."
  *   **Sufficient Answer:** Specific routines, shared crises, regular communication patterns.
  *   **Stop Condition:** If the claimant admits to <1 contact per year or no shared life events, their claim fails here. No data means no pattern. (This handles the estranged relative).
  *   **Mediator Note:** If they pass this, move to Phase 2. If they fail, mark their claim as "Low Fidelity" and move on. Don't argue metaphysics here.

  ### Phase 2: Predictive Accuracy (The Cognitive Test)
  **Question:** "Give me three specific scenarios unrelated to this medical crisis where the patient had to make a hard choice. What did they choose, and why?"
  *   **Sufficient Answer:** Details that align with known facts or corroborated history. They should explain the *reasoning* the patient used, not just the outcome.
  *   **Stop Condition:** If their stories are contradicted by objective evidence (texts, emails, other witnesses) or are internally inconsistent, flag as "Projection."
  *   **Hard Case Rule:** If they get the predictions right but say "I didn't care about them," they still pass this phase. Accuracy matters more than warmth here.

  ### Phase 3: The "Voice" Test (The Affective Test)
  **Question:** "When you say you feel their presence, can you describe a time recently where you realized you were wrong about what they would want?"
  *   **Sufficient Answer:** Admission of uncertainty or distinction between "what I want" and "what they would want."
  *   **Stop Condition:** If they say "I just know, deeply, and I'm never wrong about them," this is a red flag. That's not a simulation; that's grief speaking.
  *   **Hard Case Rule:** If they feel the presence strongly but failed Phase 2 (Predictions), their "presence" is likely their own internal monologue, not the patient's pattern.

  ### Phase 4: The Values Cutoff
  **Where the checklist ends:**
  If Phase 2 and Phase 3 conflict (e.g., high accuracy/low presence vs. low accuracy/high presence), stop applying rules.
  *   **Rule:** Predictive accuracy (Phase 2) outweighs Emotional Presence (Phase 3) for *decisional authority*.
  *   **Why:** Feeling someone near you doesn't mean you know their wishes. Acting on a feeling vs. acting on known preferences is the difference between honoring them and honoring your grief.
  *   **Mediator Move:** This is where you tell them: "This tool doesn't decide care. It decides whose voice gets amplified. We have to separate 'who misses them' from 'who knows them.'"

  ---

  ### Scenario Run-Throughs

  **Scenario A: The Spouse (High Presence, Wrong Preferences)**
  *   **Phase 1:** Pass. Lived together 30 years.
  *   **Phase 2:** Fail. Spouse insists patient "would never want to be a burden," but patient's written advance directive and past conversations with friends indicate they feared death more than dependency. Spouse is projecting their own fear of burdening the family.
  *   **Phase 3:** Pass (Subjectively). Spouse cries, says "I feel him telling me to let go."
  *   **Outcome:** The checklist flags the Spouse's claim as **Low Fidelity** regarding decision-making.
  *   **Family Reaction:** They will hate this. Telling a grieving spouse that their deep spiritual connection is actually a misreading of the patient's values is brutal. But the procedure says their "distributed self" claim is incoherent because the pattern data (preferences) doesn't match the output (decision).

  **Scenario B: The Adult Child (Low Presence, Right Preferences)**
  *   **Phase 1:** Pass. Visited monthly, handled finances.
  *   **Phase 2:** Pass. Child cites specific conversations about quality of life that match the medical reality perfectly.
  *   **Phase 3:** Fail. Child says, "I don't feel anything. I just know what she said."
  *   **Outcome:** The checklist flags the Child's claim as **High Fidelity**.
  *   **Family Reaction:** Also uncomfortable, but less volatile. The child looks cold, but the procedure validates their authority to speak.

  ### Limitations (Read this before using)
  1.  **Not a Medical Tool:** This does not tell you if the treatment is futile. It only tells you who is qualified to define "futile" based on the patient's identity.
  2.  **Not a Truth Machine:** People lie. Corroboration is key.
  3.  **The "Estranged" Edge Case:** If an estranged sibling shows up with a letter written yesterday by the patient, Phase 1 fails but the evidence overrides. Use discretion.
  4.  **Emotional Harm:** Using this can make people feel invalidated. Frame it as "testing the clarity of the signal," not "testing your love."

  *Keep this in your notebook, not the case file. It's a heuristic, not law.*
