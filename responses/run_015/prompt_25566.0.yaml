answer: |-
  1. **Non-Identity Compatibility**
     The theory must yield moral verdicts in cases where an action changes the identity of the future person (e.g., conceiving now vs. later) without relying on the claim that the person is harmed by being brought into existence with a life worth living.

  2. **The Asymmetry (or Weak Neutrality)**
     The theory must capture the intuition that there is a moral duty to avoid creating suffering, but no corresponding duty to create happiness; the absence of pain is good even if no one exists to experience it, while the absence of pleasure is not bad unless someone is deprived of it.

  3. **Avoidance of the Repugnant Conclusion**
     The theory must not imply that a world with a massive population of lives barely worth living is better than a world with a smaller population of lives of very high quality, all else being equal.

  4. **Avoidance of the Sadistic Conclusion**
     The theory must not imply that adding people with negative welfare (misery) is sometimes better than adding people with positive welfare (happiness), nor that adding happy people can make the world worse simply by lowering the average.

  5. **The Person-Affecting Restriction**
     The theory must ground moral value in effects on particular subjects; an outcome cannot be better or worse unless it is better or worse for some specific person.

  6. **Mere Addition Non-Elitism**
     The theory must not imply that adding people with lives worth living is bad, nor that we should eliminate existing people whose welfare is below a certain threshold to raise the average or total quality.

  ***

  ### Reasoning and Analysis

  **Why These Requirements Exist**

  *   **Non-Identity Compatibility:** Forced by Parfit's "14-Year-Old Girl" case. If a girl chooses to have a child now rather than waiting, the child she has now will have a harder life than the child she would have later. However, the child born now cannot claim they were harmed by the choice, because without that choice, *they* would not exist. A theory that says this action is wrong must explain why without claiming the child is worse off than they would otherwise be.
  *   **The Asymmetry:** Forced by the intuition that while we ought not to create a child who will suffer terribly, we are not morally required to create a child who will be happy. Most people feel creating a happy person is optional (supererogatory), while avoiding creating a suffering person is obligatory. Benatar argues this intuition is logical; utilitarians argue it is inconsistent.
  *   **Avoidance of the Repugnant Conclusion:** Forced by Parfit's "Repugnant Conclusion" thought experiment. Total Utilitarianism implies that for any population of very happy people, there is a better population of billions of people whose lives are barely worth living. This contradicts the intuition that quality of life matters, not just quantity.
  *   **Avoidance of the Sadistic Conclusion:** Forced by Average Utilitarianism. If you judge populations by average welfare, adding a group of happy people whose welfare is below the current average lowers the total score, implying their addition is bad. Worse, adding a group of miserable people might be preferable if it avoids lowering the average less than adding the happy-but-less-than-average people.
  *   **The Person-Affecting Restriction:** Forced by the intuition that morality is about people. "Free-floating" value (a world being better even if no one is better off) feels metaphysically suspicious. We want to know *who* benefits.
  *   **Mere Addition Non-Elitism:** Forced by the intuition that adding happy people is at least permissible, and that we should not kill or prevent the existence of people simply because they are less happy than others.

  **Incompatible Pairs (Impossibility Results)**

  *   **Non-Identity Compatibility vs. The Person-Affecting Restriction:** These are widely considered mutually exclusive. If morality is only about harming specific people (Person-Affecting), you cannot condemn actions in Non-Identity cases (because the person created is not harmed compared to non-existence). To solve Non-Identity, you must accept impersonal values (that a world can be better even if no specific person is better off).
  *   **Non-Identity Compatibility vs. The Asymmetry:** Solving Non-Identity usually requires impersonal principles (like Total Utilitarianism). Impersonal principles typically treat the absence of pleasure as a loss (a missed opportunity for good), which violates the Asymmetry. To satisfy the Asymmetry, you often need person-affecting constraints, which breaks Non-Identity compatibility.
  *   **Non-Identity Compatibility vs. Avoidance of the Repugnant Conclusion:** Most theories that solve Non-Identity (like Total Utilitarianism) succumb to the Repugnant Conclusion. Theories that avoid the Repugnant Conclusion (like Average Utilitarianism or Critical-Level Utilitarianism) often fail Non-Identity or succumb to the Sadistic Conclusion.
  *   **General Impossibility:** Gustaf Arrhenius has proven multiple impossibility theorems demonstrating that **no** population axiology can satisfy all adequate adequacy conditions simultaneously. Any theory you adopt will violate at least one strong intuition.

  **The Single Requirement That Eliminates the Most Views**

  **Non-Identity Compatibility.**

  This is the primary filter. The most intuitive moral framework is the **Person-Affecting Restriction** (morality is about helping/harming specific people). Non-Identity Compatibility immediately eliminates this entire class of views. Once you discard Person-Affecting views to satisfy Non-Identity, you are forced into **Impersonal Views** (utilitarianism, prioritarianism, etc.).

  Once in the Impersonal camp, you immediately face the trade-off between **The Asymmetry** and **The Repugnant Conclusion**.
  *   If you keep **The Asymmetry** (like Benatar), you risk Antinatalism (because the absence of pain is always good, but presence of pain is always bad, making existence a net risk).
  *   If you drop **The Asymmetry** to avoid Antinatalism (like Total Utilitarianism), you inherit the **Repugnant Conclusion** and the duty to maximize population size.

  Therefore, Non-Identity Compatibility is the hinge that forces you out of common-sense morality and into the specialized debates where these paradoxes arise.

  **Note on Application**
  Because impossibility theorems prove that no theory satisfies all desiderata, professional philosophers do not agree on a single "correct" theory. The field is defined by choosing which intuition to sacrifice. Most moderate views accept some violation of the Asymmetry (admitting creating happy people has *some* value) to avoid the Repugnant Conclusion and maintain Non-Identity Compatibility, while rejecting the strong Person-Affecting Restriction. This allows for the view that having a second child is permissible and potentially good, without implying a moral duty to maximize population or that existence is inherently harmful.
