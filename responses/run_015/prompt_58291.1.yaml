prompt: |-
  So my campus politics club is stuck in this endless arguement about who belongs to the demos and its driving me nuts...

  One side, call them the Affected folks, beleive anyone whose life is seriously impacted by a decision should have a say in it. The other side, the Coerced folks, think only people who will actually be forced to live under and obey the decision should be included as voters.

  Can you draft the joint statement they could both sign if they did a proper good-faith adversarial collaboration? Use this made-up test case to force them to get specific: the town of Riverbend wants to build a dam that gives cheap power to locals but floods farmland downstream in a different district, depends on seasonal workers who live in town four months a year, and will be paid off through taxes over 30 years by people including kids not born yet.

  I want first a numbered list of claims both sides can actually agree on, then a table of where they still disagree with each side's view worded so they themselves would accept it, then the cruxes that would move at least one side, and for each crux a concrete case or thought experiment from the Riverbend story both would agree is relevant plus what each side predicts will happen. And flag any bit that is just verbal.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A campus politics club is stuck in a debate about the boundaries of the *demos* (the people entitled to vote/participate in decision-making).
      *   **The Two Sides:**
          *   "Affected Interests" (Affected folks): Anyone seriously impacted by a decision should have a say.
          *   "Subject to Coercion" (Coerced folks): Only those forced to obey/live under the decision should vote.
      *   **The Task:** Draft a joint statement resulting from good-faith adversarial collaboration.
      *   **The Test Case:** Riverbend Dam.
          *   Benefits: Cheap power to locals (Riverbend).
          *   Costs: Floods farmland downstream (different district).
          *   Labor: Seasonal workers (live in town 4 months/year).
          *   Financing: Taxes over 30 years (includes future generations/unborn kids).
      *   **Required Format:**
          1.  Numbered list of agreed claims.
          2.  Table of disagreements (worded charitably).
          3.  Cruxes (points that could move a side).
          4.  For each crux: A concrete case/thought experiment from Riverbend, relevance agreement, and predictions from each side.
          5.  Flag any purely verbal disputes.

  2.  **Deconstruct the Philosophical Positions:**
      *   *All-Affected Principle (AAP):* Broad inclusion. Focuses on welfare, interests, and consequences. Risk: Boundaries are infinite (butterfly effect).
      *   *All-Subjected Principle (ASP):* Narrower inclusion. Focuses on legal obligation, coercion, and political authority. Risk: Excludes vulnerable non-citizens or those impacted without legal recourse.
      *   *Overlap:* Both want legitimacy. Both want to avoid tyranny. Both acknowledge that *some* boundary is needed.

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to find common ground.
      *   Both agree democracy requires a boundary (not *everyone* on earth votes on *everything*).
      *   Both agree the Riverbend decision has moral weight beyond just the voters.
      *   Both agree current exclusion of certain groups (like seasonal workers or downstream neighbors) is problematic, even if they disagree on *why* or *how* to fix it.
      *   Both agree that legitimacy depends on more than just the vote count (process matters).
      *   *Refinement:* Make sure these sound like things a political theory nerd would nod at.

  4.  **Drafting - Section 2: Table of Disagreements:**
      *   Need to contrast AAP vs. ASP using the Riverbend specifics.
      *   *Downstream Farmers:* AAP says vote (affected by flood). ASP says no vote (not subject to Riverbend's laws/taxes), maybe consultation.
      *   *Seasonal Workers:* AAP says vote (livelihood impacted). ASP says maybe (if subject to local laws while there) or no (if transient/no tax liability). Let's lean into the coercion angle: are they coerced by local law?
      *   *Future Generations:* AAP says hard to include (can't vote). ASP says impossible (can't be coerced). Both agree this is a problem, but differ on the mechanism.
      *   *Wording:* Must be charitable. "The Coerced view holds..." not "The Coerced view wrongly claims..."

  5.  **Drafting - Section 3: Cruxes & Thought Experiments:**
      *   What would actually change minds?
      *   *Crux 1: The Nature of Harm vs. Obligation.* Is flooding a form of coercion?
          *   *Case:* Downstream farmers losing land.
          *   *AAP:* It's a violation of interest equivalent to law.
          *   *ASP:* It's an externality, not political subjection.
      *   *Crux 2: Temporal Boundaries.* Can you be coerced if you don't exist?
          *   *Case:* 30-year tax/debt.
          *   *AAP:* Interests exist even if people don't.
          *   *ASP:* No subject, no coercion. Trustees needed instead.
      *   *Crux 3: The "Exit" Option.* Can you leave the situation?
          *   *Case:* Seasonal workers.
          *   *AAP:* Impact is real regardless of exit.
          *   *ASP:* If they can leave after 4 months, they aren't fully subjected.
      *   *Verbal Dispute Flag:* Sometimes "coercion" is just defined as "serious impact." Need to identify if they are arguing semantics.

  6.  **Review and Refine (Self-Correction):**
      *   *Tone Check:* Is it academic but accessible? Yes.
      *   *Constraint Check:* Did I use the Riverbend case specifically? Yes.
      *   *Formatting:* Numbered list, Table, Cruxes with predictions.
      *   *Verbal Dispute:* I need to explicitly flag where the disagreement might just be about definitions. (e.g., if "coercion" is redefined to mean "economic necessity").
      *   *Charity:* Ensure the Coerced side doesn't sound like monsters. They care about political agency and responsibility, not just excluding people. Ensure the Affected side doesn't sound like they want global anarchy. They care about moral standing.

  7.  **Final Polish:**
      *   Make sure the "Predictions" in the crux section are distinct.
      *   Ensure the "Joint Statement" header sounds official.
      *   Check the "Verbal Dispute" flagging requirement.

  *(Self-Correction during drafting the Cruxes)*: I need to make sure I explicitly state what each side predicts will happen if their view is adopted.
  *   AAP Prediction: More legitimacy, fewer externalized costs.
  *   ASP Prediction: Clearer accountability, stable polity.

  *(Refining the Verbal Dispute)*: The big one is usually whether "coercion" includes "economic necessity" or "environmental force." If the downstream farmers are *forced* to move by water, is that coercion by the state? ASP might say no, AAP says yes. I should flag if this is a semantic fight or a substantive one.

  8.  **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  # JOINT STATEMENT ON THE BOUNDARIES OF THE DEMOS
  **Issued by the "Affected Interests" and "Subject to Coercion" Working Groups**
  **Re: The Riverbend Dam Case Study**

  We, the undersigned factions of the Campus Politics Club, acknowledge that while we share a commitment to democratic legitimacy, we currently lack a consensus on the precise boundary of the *demos* (the body of people entitled to participate in decision-making). Through adversarial collaboration using the Riverbend Dam test case, we have identified areas of convergence, clarified our substantive disagreements, and isolated the empirical and philosophical cruxes that prevent full agreement.

  ### I. Points of Consensus
  *Claims both sides accept as true or normative prerequisites for a functioning democracy.*

  1.  **Non-Arbitrariness:** The boundary of the *demos* cannot be drawn arbitrarily (e.g., by race, gender, or mere convenience); it must rest on a principled justification.
  2.  **Legitimacy Deficit:** A decision made by Riverbend voters that imposes severe costs on non-voters (like the downstream farmers) suffers from a legitimacy deficit, regardless of which theory is used to describe it.
  3.  **The Problem of Infinity:** A functional democracy requires a finite boundary; the "All-Affected" principle cannot literally mean *everyone* affected in any causal chain (e.g., global supply chains), or decision-making becomes impossible.
  4.  **Future Generations:** The current voting framework fails to adequately represent the interests of future citizens who will pay the 30-year tax burden, and this is a moral failing both sides wish to mitigate.
  5.  **Voice vs. Vote:** There is a distinction between having a formal *vote* and having a guaranteed *voice* (consultation, representation, or legal recourse); both sides agree some mechanism is needed for excluded groups to register grievances.
  6.  **Coercion is Harmful:** Unjustified coercion is a moral harm. The disagreement lies in whether "coercion" is the *only* harm that grants voting rights, or if "serious impact" is sufficient.

  ### II. Map of Disagreement
  *Substantive divergences regarding the Riverbend Dam case, worded charitably to reflect each side's best argument.*

  | Stakeholder Group | The "Affected Interests" View (AAP) | The "Subject to Coercion" View (ASP) |
  | :--- | :--- | :--- |
  | **Downstream Farmers** (Different district, land flooded) | **Grant Vote.** The dam fundamentally alters their property rights and livelihood. The physical force of the water is functionally equivalent to legal coercion; their interests are too central to be excluded. | **No Vote (But Veto/Recourse).** They are not subject to Riverbend's laws or taxes. Including them dilutes the agency of those who must obey Riverbend's governance. They need legal tort recourse, not franchise. |
  | **Seasonal Workers** (4 months/year, no permanent residence) | **Grant Vote.** Their economic survival is tied to the dam's construction. Impact is serious and immediate, regardless of duration of stay. | **Conditional Vote.** If they are subject to local laws/police while present, they may vote in local elections *during* that period. If they are transient contractors, they are not "subjects" of the polity. |
  | **Future Generations** (Taxpayers not yet born) | **Proxy Representation.** Their interests exist now. We must institutionalize guardians or proxies to vote on their behalf regarding the 30-year debt. | **Trusteeship, Not Voting.** Non-existent people cannot be coerced. Current voters must act as trustees, bound by constitutional debt limits, rather than expanding the *demos* to the unborn. |
  | **Riverbend Locals** (Cheap power, pay taxes) | **Shared Sovereignty.** Their vote is valid but weighted against the severity of harm to outsiders. They do not have exclusive right to decide. | **Primary Sovereignty.** They bear the legal obligation to obey the law and pay the taxes. They hold the primary right to decide, provided they respect the rights of outsiders. |

  ### III. Cruxes and Predictive Tests
  *Specific points where changing one's mind on a fact or definition would shift the conclusion. Includes concrete Riverbend applications and predicted outcomes.*

  #### Crux 1: Is "Physical Necessity" equivalent to "Legal Coercion"?
  *   **The Question:** If the state creates a situation where you *must* move (flood) vs. the state creates a law where you *must* pay (tax), is the moral claim to a vote the same?
  *   **Riverbend Case:** The downstream farmers lose land to water (physical) vs. Riverbend locals lose money to taxes (legal).
  *   **Relevance:** Both sides agree this distinction determines if the farmers get a vote or just compensation.
  *   **Predictions:**
      *   **Affected Side:** If we exclude the farmers, Riverbend will systematically externalize costs, leading to regional instability and conflict. Inclusion prevents exploitation.
      *   **Coerced Side:** If we include the farmers, Riverbend voters lose the ability to govern their own infrastructure. It creates a "veto by outsider" problem where no public works can ever be built.

  #### Crux 2: Does "Exit Option" Negate the Claim to Voice?
  *   **The Question:** If a person can avoid the impact by leaving the jurisdiction, do they still deserve a vote?
  *   **Riverbend Case:** Seasonal workers can leave after 4 months vs. Riverbend locals who are locked into the 30-year tax debt.
  *   **Relevance:** Both sides agree this tests whether *dependency* or *subjection* is the key metric.
  *   **Predictions:**
      *   **Affected Side:** Even with exit options, the workers are economically coerced to stay for wages. Excluding them creates a precariat class vulnerable to abuse.
      *   **Coerced Side:** If they can exit, they are not fully subjected to the political order. Granting them votes allows temporary residents to dictate long-term obligations to permanent residents.

  #### Crux 3: Can Interests Exist Without Subjects?
  *   **The Question:** Can we represent "interests" (welfare) separately from "subjects" (people currently alive to be coerced)?
  *   **Riverbend Case:** The 30-year tax debt impacts people who do not exist yet.
  *   **Relevance:** Both sides agree the current system fails here, but disagree on the fix (Proxies vs. Constitutional Constraints).
  *   **Predictions:**
      *   **Affected Side:** Without proxy voters for the future, current voters will recklessly over-borrow, harming future welfare.
      *   **Coerced Side:** Proxy voters for the unborn are unaccountable and will block necessary investment. Binding rules (debt caps) are safer than fake voters.

  ### IV. Flagged Verbal Disputes
  *Areas where the disagreement may be semantic rather than substantive. Further collaboration required to resolve.*

  1.  **Definition of "Coercion":**
      *   **Flag:** The **Affected** side often uses "coercion" to mean "severe constraint on options" (e.g., flooding forces you to move). The **Coerced** side uses "coercion" to mean "threat of sanction by a political authority" (e.g., jail for non-payment of tax).
      *   **Resolution Path:** If the **Coerced** side admits that *physical destruction of property by the state* counts as a form of political sanction, the gap narrows. If the **Affected** side admits that *causal impact* without *political authority* is not voting-worthy, the gap narrows.

  2.  **Definition of "The Decision":**
      *   **Flag:** We disagree on what "the vote" is actually about. Is it about the *Dam Project* specifically, or the *Riverbend Legal Order* generally?
      *   **Resolution Path:** If we agree that the farmers should vote *only* on the Dam (referendum) but not on Riverbend's zoning laws (general election), this may be an institutional design fix rather than a theoretical impasse.

  ***

  **Signed,**
  *Representatives of the Affected Interests Working Group*
  *Representatives of the Subject to Coercion Working Group*
