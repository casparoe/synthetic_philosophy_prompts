      *   *Disanalogy 3: Interpretation/Truth.* Formal systems have semantic truth conditions. Biology has function/fitness. *Verdict:* Load-bearing. Without "truth," the logical force of Gödel's theorem vanishes.
      *   *Disanalogy 4: Passive vs. Active.* Gödel numbers are abstract. DNA is chemical. *Verdict:* Decorative for the "digital life" conclusion (convenor wants to abstract away substrate), but crucial for the "chemistry isn't enough" claim.

  4.  **Limitation Theorems (Task 3):**
      *   *Prediction:* If cells are formal systems subject to Gödelian limits, there should be biological truths/functions the cell cannot construct or predict about itself.
      *   *Reality:* Evolution is open-ended. Cells die, but lineages continue. There is no "biological incompleteness theorem" preventing a cell from replicating or adapting within its niche.
