      *   *Critique:* Many of these don't map well. Gödel numbering is an arithmetic encoding of syntax. DNA is a physical polymer. The "Diagonal Lemma" creates a self-referential sentence. Biology has feedback loops, but not logical self-reference in the Gödelian sense.
      *   *Drafting the Table:* Need to be honest about empty rows.
          *   Numbering $\rightarrow$ Genetic Code (weak).
