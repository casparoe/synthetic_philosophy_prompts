  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON THE GREAT DIVERGENCE**

  **Preamble**
  After ten years of dispute regarding the formulation and solvability of the question "Why did the Industrial Revolution happen in Britain and not in China?", the undersigned parties submit this document to close the debate. We agree to operate under three stipulated protocols: (1) the outcome is a threshold crossing of sustainable output per head and inanimate energy share between 1750–1850; (2) the comparator is the Lower Yangzi Delta (Jiangnan), not the Qing Empire; (3) the question is decomposed into (Q1) why the breach occurred anywhere, and (Q2) why there first. The following sections record our convergence, residual divergence, and empirical commitments.

  **I. Agreed Claims**
  1.  **Outcome Definition:** The phenomenon to be explained is not a named event but a specific economic threshold: sustained growth in output per head coupled with rising mechanical energy share, crossed within the window 1750–1850.
  2.  **Unit of Analysis:** The valid spatial comparator for Britain is Jiangnan, based on matching area, population density, commercialization, and market integration circa 1750.
  3.  **Baseline Parity:** Around 1750, real wages and life expectancy in Britain and Jiangnan were sufficiently similar that neither region possessed an obvious, overwhelming advantage in standard of living.
  4.  **No Essentialism:** Neither party invokes civilizational, cultural, or racial essentialism to explain divergence; all proposed factors must be material, institutional, or geographic.
  5.  **Contrastive Structure:** Explanation requires a contrast class; explaining why Britain industrialized requires specifying why it did so relative to a non-industrializing comparator.
  6.  **Decomposition Utility:** Separating the breach of the Malthusian ceiling (Q1) from the timing and location of the first breach (Q2) is analytically useful, regardless of whether it fully exhausts the original question.
  7.  **Downstream Factors:** Factors such as access to New World land, coal proximity, and long-distance trade structures are acknowledged as relevant variables, though their status as ultimate causes is disputed.
  8.  **Teleology Warning:** Both parties agree that framing industrialization as a "default path" from which regions "failed" deviate encodes an unjustified teleology.
  9.  **Data Limits:** Current quantitative data for Jiangnan and Britain circa 1750 contains significant margins of error; no claim relies on precision exceeding these margins.
  10. **Non-Inevitability:** Neither party claims that industrialization was historically inevitable in any region prior to 1700.

  **II. Residual-Disagreements Table**

  | Crux | Party A (Contrastivist Realist) | Party B (Question-Skeptic) | Type |
  | :--- | :--- | :--- | :--- |
  | **1. Impact of Matching Scale** | Matching Jiangnan to Britain **leaves the puzzle exactly as it was**. The divergence remains a fact about the world; the unit correction clarifies the contrast but does not remove the need for difference-making factors. | Matching Jiangnan to Britain **relocates the puzzle**. It dissolves the "China vs. Europe" framing but reveals the question is about specific local contingencies rather than regional destinies, reducing explanatory scope. | Conceptual |
  | **2. Decomposition Exhaustion** | Answers to Q1 (breach anywhere) and Q2 (breach there first) **exhaust the original question**. The sum of general conditions plus specific local advantages constitutes a complete explanation. | Answers to Q1 and Q2 **do not exhaust the question** due to leakage. Factors invoked for Q2 (e.g., coal, trade) are downstream of earlier European positions addressed in Q1, making the separation artificial. | Conceptual |
  | **3. Counterfactual Requirements** | A contrastive why-question requires only a **relevant contrast class**. We need not prove what *would* have happened in China, only what *did* happen differently in Britain. | A contrastive why-question requires a **determinate counterfactual**. Without knowing if Jiangnan *could* have industrialized given British conditions, the "why not" remains underspecified. | Conceptual |
  | **4. Explanatory Depth** | A difference-maker that is itself unexplained (e.g., geological coal placement) **counts as an answer**. Explanation stops at the relevant causal difference, not at the origin of that difference. | A difference-maker that is itself unexplained **does not count as a full answer**. It merely pushes the puzzle back; true explanation requires accounting for why the difference-maker existed. | Pragmatic |
  | **5. Purpose of Inquiry** | The question is for **assignment of responsibility** (causal attribution). The goal is to identify the specific variables that tipped the scale. | The question is for **guidance**. If the question is framed to help later developing economies, the specific British path may be irrelevant noise. | Pragmatic |

  **III. Pre-registered Predictions**

  **Crux 1 (Matching Scale):**
  *   *Test:* Comparative energy consumption data per capita in Jiangnan vs. Britain 1750–1800.
  *   *Party A Prediction:* Data will show a statistically significant divergence emerging before 1800, validating the puzzle remains intact.
  *   *Party B Prediction:* Data will show overlapping confidence intervals until 1820, validating the claim that divergence is later and less regionally specific than assumed.
  *   *Status:* Settled by existing archival work, though interpretation differs.

  **Crux 2 (Decomposition Leakage):**
  *   *Test:* Regression analysis of coal access against patent rates in Europe 1600–1750.
  *   *Party A Prediction:* Coal access will show independent explanatory power for Q2, distinct from Q1 factors.
  *   *Party B Prediction:* Coal access will correlate perfectly with earlier Q1 institutional variables, confirming leakage.
  *   *Status:* Unsettled without new archival work on regional fuel prices.

  **Crux 3 (Counterfactuals):**
  *   *Test:* Simulation of Jiangnan economy with British coal endowments.
  *   *Party A Prediction:* Simulation shows industrialization triggers, proving coal was the binding constraint.
  *   *Party B Prediction:* Simulation shows stagnation continues, proving coal was not the binding constraint.
  *   *Status:* Unsettled; requires economic modeling consensus.

  **The 1700 Submersion Test:**
  *   *Hypothetical:* Had Britain gone under the sea in 1700.
  *   *Party A Prediction:* Threshold crossed in **Northern France or Belgium, 1780–1820**. Confidence: Moderate. Industrialization was a regional Northwest European phenomenon, not uniquely British.
  *   *Party B Prediction:* Threshold crossed **indeterminate time/location, or not until 19th century**. Confidence: Low. The specific British institutional conjuncture was unique; removal delays or prevents the threshold crossing entirely.

  **IV. Concessions and Movers**

  **Party A Concessions:**
  Party A grants that the original formulation ("China vs. Britain") was empirically sloppy due to scale mismatch. Party A accepts that teleological framing risks distorting the selection of explanatory variables. Party A acknowledges that Q2 factors (coal, colonies) are partially dependent on Q1 histories, accepting some leakage in the decomposition.

  **Party B Concessions:**
  Party B grants that the threshold crossing is a real empirical event, not merely a historiographical artifact. Party B accepts that Jiangnan is the correct comparator, abandoning the "Qing Empire" unit. Party B acknowledges that refusing to specify difference-making factors renders the skepticism practically useless for economic history.

  **Movers (Conditions for Abandonment):**
  *   **Party A:** Will abandon the Realist position if new data demonstrates that Jiangnan sustained higher output per head than Britain continuously until 1830, proving the threshold crossing was simultaneous rather than sequential.
  *   **Party B:** Will abandon the Skeptic position if a model successfully predicts the threshold crossing using only exogenous geographic variables, proving the question is well-posed independent of institutional framing.

  **Signed,**
  **Party A (Contrastivist Realist)**
  **Party B (Question-Skeptic)**
