  2. **Indexical Irrelevance:** 0.80 — Rational policy selection should not depend on which physical instance executes it, only on the algorithm's output across all possible inputs.
  3. **Logical Causation Validity:** 0.60 — Treating mathematical facts as nodes subjunctively dependent on your decision is the core metaphysical leap required to equate B with A.
  4. **Formal Stability:** 0.55 — Current formalizations of updateless decision theory struggle with spurious proofs and self-reference without ad-hoc clipping or oracle access.
  5. **Normative Determinacy:** 0.70 — There is a fact of the matter about which decision rule maximizes utility across possible worlds, rather than it being purely a linguistic choice.

