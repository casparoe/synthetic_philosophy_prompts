  2.  **Deconstruct the Quinean Argument vs. Practical Science:**
      *   *Quine's Point:* Meaning is underdetermined by behavior. "Gavagai" could mean rabbit, undetached rabbit part, rabbit stage, etc. We impose structure via "analytical hypotheses."
      *   *Curator's Application:* Indigenous terms shouldn't be forced into Linnaean boxes because we can't know the exact ontological match. It's epistemic violence to assume 'koro' = *Quercus alba*.
      *   *Counter-Argument:* Quine was talking about *radical translation* (no prior shared language/context). Ethnobotany involves collaboration, long-term fieldwork, and shared practices. We aren't starting from zero. Also, *not* mapping is itself an analytical hypothesis (that the categories are incommensurable).
      *   *Practical Issue:* Conservation science needs to know *what plant* is being used to protect it. If 'koro' is unlinkable to a species, can we protect it?

  3.  **Determine the Recommendation:**
      *   *Reject:* Too dismissive of the anthropological/ethical concern.
      *   *Approve:* Too damaging to the scientific utility (biologists' point).
      *   *Approve with Conditions:* Best middle ground. Acknowledge Quine's insight (uncertainty exists) but don't let it paralyze action. Use probabilistic mapping or confidence levels. Keep the Linnaean link but flag the uncertainty.
      *   *Decision:* Approve with Conditions. This respects the Quinean insight (uncertainty is real) without abandoning the scientific utility (we still need to know what plant it is).

