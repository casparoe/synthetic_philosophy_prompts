answer: |-
  1. The blameless post-mortem practice presupposes a holistic view of social causation where failures emerge from complex system interactions rather than individual actions. It assumes that identifying a specific human agent as the root cause is factually incorrect within the context of socio-technical systems.
  2. Conversely, the individual scoring and review practices presuppose methodological individualism, treating engineers as discrete units whose personal output directly determines organizational outcomes. This framework assumes that individual performance can be isolated, measured, and held accountable independent of systemic constraints.
  3. These two views cannot coexist coherently as theories of causation, suggesting the organization is actually splitting causal explanation from normative responsibility. The system explains the *why* of the failure, while the individual accepts the *burden* of remediation regardless of causal origin.
  4. The practice is underdetermined because pragmatic functionalism could also license it, valuing the safety benefits of blamelessness alongside the motivational benefits of individual accountability. Multiple philosophical frameworks might justify this hybrid approach as a useful fiction rather than an ontological claim.
  5. If the company followed through on the holistic view, it would need to abolish individual defect rates and reliability scores in favor of team-based or system-wide metrics. Compensation and reviews would then assess an engineer's contribution to improving systemic resilience rather than their personal error count.
