prompt: |-
  Hey I need an in-class game for my phil of language seminar, like 12 grad students, 75 mins. I want them to actually feel Quine's indeterminacy of translation—not just hear the gavagai story but live the problem that behavioral evidence underdetermines reference. So here's the twist: split them into three teams, each gets the same "field linguist" data set (made up but consistent—utterances in an alien language paired with obsrvable stimuli and native assent/dissent patterns). Thier job is to write a translation manual that assigns referents to the key term "glex" (it shows up when rabbits appear, but also when rabbit-parts do, and also in temporal contexts). The rules should force them to commit to one of: (a) glex = rabbit, (b) glex = undetached rabbit part, (c) glex = temporal stage of a rabbit. They can only use behavioral evidence—no asking natives about ontology, no appealing to "common sense" about objects. Then they present thier manuals and realize all three are observationally equivalent given the data. But I want the activity to have a hidden catch: one team gets an extra "stimulus" card that seems to break the tie but actually doesn't because of the analyitcal hypotheses Quine mentions—maybe a card where the native says "glex" while pointing at a rabbit-shaped shadow, and each manual can absorb it by adjusting an auxiliary belief about shadows or perception. The debrief should map each team's defense onto Quine's analytical hypotheses and say exactly which feature of radical translation the simulation can't reproduce—probably the holism of belief or the fact that in real fieldwork you can eventually break ties via shared practical coordination, which my classroom rules artificially block. Also tell me what will go wrong the first time I run it—probably students will try to "cheat" by importing metaphysical intuitions about what rabbits "really are"—and how to shut that down without lecturing. Keep it casual, no need for formal citations, and don't ask them to read Quine beforehand—just hand out the data packets.
