  TO: Select Board
  FROM: Energy and Climate Advisory Committee
  DATE: October 10, 2023
  RE: Recommendation for Community Pathways Pilot Track

  The Committee recommends the Select Board apply for Track 1 of the Community Pathways Pilot.

  We must start with the arithmetic. Our town inventory stands at 96,000 tonnes CO2e annually. Even if we achieve the modelled 9 percent cut under Track 1, or the binding 6 percent annual reductions under Track 2, the effect on global temperature is zero within any measurable error bar. We are a town of 14,000 people, 30 kilometers from the nearest city. We do not have the leverage to move the needle on atmospheric physics. If we pretend this pilot is about mitigation capacity, we are lying to ourselves.

  The actual reason for this choice is not climate impact, but democratic legitimacy and burden distribution. A pilot matters because it demonstrates how a community decides to share costs. Track 1 uses a price signal returned as a dividend. This allows the market to find reductions while protecting household income broadly. Track 2 uses zoning and permitting to enforce sufficiency. This shifts the decision from individual households to the planning board. In a town where 22 percent of residents are over 65 and median income is 8 percent below the state median, we believe the dividend mechanism offers a clearer safeguard than binding zoning caps, provided the dividend is protected.

  We owe Track 2 its strongest defense. Priya is right that the warehouse is the entire point. Transport is half our inventory, and Track 1 explicitly excludes transport fuel. Track 2 is the only option that treats the physics of our inventory seriously rather than the accounting convenience of our jurisdiction. It forces a confrontation with the logistics park, which accounts for a third of our transport emissions. If the goal is structural change rather than revenue neutrality, Track 2 is the only instrument that binds the largest emitters instead of taxing the residents in drafty houses. It refuses to let us export our emissions while claiming credit for reducing them.

  Regarding the "both-books" rule: we should report the consumption-based inventory, but we must not bind policy to it. For a town this size, I estimate the error bars on consumption data run near 30 percent. We lack the supply chain visibility to compute it with the precision required for regulation. I would rather commit to a clumsy number I can defend than a pretty one I cannot. We will publish both the territorial and consumption figures annually, but our targets must remain tied to the territorial inventory where the data is auditable.

  Marv's proposal to auction freight permits and distribute revenue is intellectually interesting but procedurally ineligible. The pilot rules allow only Track 1 or Track 2. Furthermore, it is two instruments duct-taped together. A cap on permits is a quantity control; a dividend is a price mechanism feedback. Mixing them creates uncertainty about whether we are limiting throughput or compensating for it. We cannot apply for a hybrid track that does not exist.

  We must also define what would prove this recommendation wrong. We should revisit this decision in year three. If the data shows that the dividend fails to offset the increased heating costs for households over 65, we have picked wrong. If the net financial burden on older residents rises despite the rebate, the instrument is regressive in practice regardless of its design. At that point, we must advocate for supplemental local relief or switch tracks if possible.

  This choice is ugly. Track 1 leaves the logistics park untouched and taxes gas heating. Track 2 risks the tax base and may simply shift emissions four kilometers east. Neither saves the planet. But we must vote. Track 1 allows us to manage the burden within our existing governance structure without triggering immediate legal threats from our largest commercial taxpayer. We choose the path that keeps the town solvent while we learn what a price signal actually does.

  \answer{Track 1}
