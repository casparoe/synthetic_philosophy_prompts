  **2. That our actual practice fixes the reference (e.g., to von Neumann ordinals).**
  *   **Probability:** 0.05
  *   **Justification:** Mathematical practice is overwhelmingly structural. We prove theorems about $\omega$-sequences, not about the specific empty-set ancestry of 2. While textbooks *define* 2 as $\{\emptyset, \{\emptyset\}\}$, this is treated as a convenient implementation, not a discovery of essence. Reference fixing via use typically tracks structural role, not set-theoretic constitution.
