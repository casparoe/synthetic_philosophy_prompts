      *   **Goal:** Define criteria for "adequacy" that justify using symbol-level explanations in cognitive science without hand-waving, and determine what an experiment on Careenia would settle.
      *   **Specific Requirements:**
          *   Evaluate the user's proposed list items (differentiate tests, scramble case, near-misses, history/aboutness, read/write asymmetry, bookkeeping/autonomy, no cheating/overdetermination).
          *   Mark items as non-negotiable vs. camp preferences.
          *   Identify inconsistencies/trade-offs within the list (impossibility results).
