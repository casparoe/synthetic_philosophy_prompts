  You are grappling with two distinct problems that often get lumped together as "rationality." The first is **Time Inconsistency** (when is my future self a traitor vs. when is my past self a tyrant?). The second is **Structural Coherence** (when do my preferences make me exploitable or deluded?).

  No single principle covers all your cases without forcing you to abandon at least one of your strong intuitions. Here are two candidate principles that carve up the problem differently.

  ### Principle 1: The Principle of Specific Commitment

  **The Rule:**
  You are authorized to bind your future self only when the commitment is **specific and time-bound** (a single project or event). You are *not* authorized to bind your future self when the commitment is **open-ended or政策性 (a standing policy or lifestyle)**.

  **The Logic:**
  Resistance to a *specific* plan (e.g., "fly to this conference," "run this mile") is usually friction, procrastination, or transient mood. Your past self correctly identified this as noise.
  Resistance to an *open-ended* policy (e.g., "give 10% forever," "sleep by 11 always") is data. It tells you that the policy is unsustainable or misaligned with your evolving values. In open-ended cases, the "resistance" is new information about the cost of the policy, not just weakness.

  **Motivating Cases from Your List:**
  *   **The Flight (Fine):** Specific event. May's desire to quit is predictable friction. January is right to bind.
  *   **The Donation (Not Fine):** Open-ended policy ("forever"). June's resentment is data about financial sustainability or value drift. June is right to cancel.
  *   **The Run (Not Fine):** Specific event. Monday's desire to skip is friction. Sunday is right.
  *   **The Dinner (Fine):** No commitment made. Daily preference is sovereign.

  **Test Case (Unlisted):**
  *   *Gym Membership:* You sign a year-long contract (Policy) vs. You book a personal trainer session for next Tuesday (Specific).
      *   *Verdict:* Feeling guilty about skipping the Tuesday session is rational (weakness). Feeling guilty about cancelling the year-long membership after three months is irrational (the policy was bad data).

  **Verdicts You Must Drop:**
  *   **The Bedtime Case:** This principle forces you to decide that **Sunday has no authority.** "In bed by 11 all week" is a policy, not a specific act. Wednesday's renegotiation is valid data that the policy is unsustainable. You must drop the hope that Sunday's verdict is the "true" one; it's just the start of a negotiation.
  *   **The Donation Nuance:** If you believed January's piety was a "true value" and June's resentment was "weakness," you must drop that. This principle says June's resentment is legitimate information, not a failure of will.

  ***

  ### Principle 2: The Principle of Global Coherence

  **The Rule:**
  A choice is irrational if it leaves you in a **dominated position** (strictly worse off than when you started with no benefit) or if it blocks **epistemic updating** (learning truth). Strategic ignorance is only permitted to prevent *preference reversal* (prudential), never to prevent *belief formation* (epistemic).

  **The Logic:**
  Rationality requires that your choices hang together logically. If a sequence of choices allows someone to pump money out of you (Money Pump), you are structurally irrational, regardless of how you feel at each step. Similarly, truth is a terminal value; blocking it is always a defect. Pleasure/Health are prudential values; blocking temptation to secure them is a tool.

  **Motivating Cases from Your List:**
  *   **The Apartments (Irrational):** A>B>C>A is intransitive. Taking the swaps leaves you minus $15. This is a dominated outcome. It is irrational even if offered sequentially.
  *   **The Researcher (Not Fine):** Declining a test blocks belief formation. This is epistemic cowardice.
  *   **The Dessert (Fine):** Skipping the menu prevents a preference reversal (wanting cake vs. wanting health). This is prudential strategy, not epistemic blindness.

  **Test Case (Unlisted):**
  *   *Investing:* You sell Stock A to buy Stock B because you "feel" B is better, then next week sell B to buy A because you "feel" A is better, paying fees each time.
      *   *Verdict:* Irrational. Even if each trade felt right in the moment, the cycle is a money pump.

  **Verdicts You Must Drop:**
  *   **The Sequential Apartment Swaps:** You wrote: *"Offered one at a time: I'd take each. I don't feel bad about that difference."* This principle forces you to **feel bad.** If the package is irrational, the sequence is *also* irrational because the outcome is identical. You cannot excuse the irrationality by claiming you didn't see the whole shape; local rationality that sums to global suicide is still irrational.
  *   **The Flight (Maybe):** If the conference in June turns out to be useless (new info), going is a dominated outcome. This principle cares less about *binding* and more about *outcome*. If May-you knows the conference is useless, binding is irrational. (Your intuition was that binding was fine regardless, based on willpower).

  ***

  ### Summary of the Trade-Off

  *   **Choose Principle 1 (Specific Commitment)** if you want to preserve the distinction between **Willpower vs. Value Drift**. It saves your intuitions on the Flight, Donation, and Run, but it forces you to admit that your **Bedtime Plan** is just a negotiation, not a law, and that your **Sequential Apartment** intuition is irrelevant (because that's a logic problem, not a willpower problem).
  *   **Choose Principle 2 (Global Coherence)** if you want to preserve **Logical Consistency**. It saves your intuitions on the Apartments and Researcher, but it forces you to admit that **Sequential Swaps** are just as dumb as the Package Deal, and it offers no comfort on the **Donation** case (which becomes a calculation of utility, not authority).

  **My Recommendation:**
  Adopt **Principle 1** for your personal habits (Flight, Run, Bedtime, Donation) because it respects the difference between friction and feedback. Adopt **Principle 2** for your financial and epistemic life (Apartments, Researcher, Investing) because logic trumps mood there. The conflict arises only when you try to apply the logic of money pumps to the logic of moods, or vice versa.
