  **(Self-Correction during drafting):** I initially thought about bringing in Bruno Latour heavily. I should mention him but keep the focus on the user's specific "Vector Model." I need to make sure I don't get too bogged down in philosophy of science; keep it relevant to *historical writing*. The distinction between "narrative agency" and "causal contribution" is the strongest part of their outline; I should highlight that.

