prompt: |-
  I am drafting an essay that treats germs, climate patterns, and volcanic events as "historical actors"—entities capable of shaping historical outcomes—without falling into environmental determinism. The central claim is that agency should be understood relationally: a pathogen mutation or a volcanic winter does not possess agency in itself, but becomes an agent within the assemblage of human institutions, ecological conditions, and material infrastructures it interacts with. The essay distinguishes sharply between causal contribution and narrative agency: climate and microbes contribute causally to events like the sixth-century cooling crisis or the spread of plague, but attributing agency to them requires showing how they altered the decision-space of human actors rather than replacing human action with physical necessity. I then propose what I call a vector model: instead of treating environmental forces as background conditions or as primary drivers, we should represent them as directional vectors that constrain the range of possible institutional responses without determining which response occurs. The essay applies this to the 536 CE volcanic winter, arguing that it should not be said to have caused the Justinianic Plague or specific state collapses, but rather to have compressed the set of viable political and agricultural strategies available to affected societies. I am worried about three things. First, does the relational-ontology framing genuinely avoid determinism, or does it merely redistribute causal weight from human actors to non-human assemblages? Second, is the distinction between constraining a decision-space and causing an outcome philosophically stable, or does it collapse once we specify the mechanisms in detail? Third, does attributing directional force to non-human phenomena smuggle back in the very intentional-language the essay wants to reject? Please comment on the outline's coherence, flag any unstated premises about the ontology of causation, and tell me whether the vector model offers a genuinely distinct alternative or just renames the problem. Answer in American English.
