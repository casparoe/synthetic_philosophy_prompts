answer: |-
  # Decision Tree: The Coherence of Qualia (Post-Chase-Sanborn)

  ## Introduction for Seminar Participants
  This tree maps the logical space surrounding Daniel Dennett's "Quining Qualia" argument, specifically the Chase-Sanborn thought experiment. The core tension is between **phenomenal realism** (qualia are real properties) and **epistemic access** (how we know about them). Dennett argues that if you define qualia as intrinsic, private, ineffable, and directly apprehensible, cases of gradual replacement or memory drift generate contradictions.

  This guide does not assume a consensus. It distinguishes between **settled matters** (e.g., that there is a live debate regarding the coherence of traditional qualia definitions) and **contested matters** (e.g., whether the incoherence argument succeeds, or whether saving qualia requires abandoning privacy).

  ---

  ## The Decision Tree

  **ROOT CASE:** *The Synthetic Cortex.* A subject undergoes gradual neuron-to-silicon replacement. All behavioral and cognitive profiles remain identical. The subject continuously reports: "The qualitative feel is exactly the same."

  ### NODE 1: The Fallibility of the Report
  **Question:** Is it metaphysically possible that the subject's qualitative experience *changed* (or vanished), even though their report and behavior remained "The same"?
  *   **(A) YES:** Qualia can vary independently of functional/behavioral dispositions.
  *   **(B) NO:** If behavior and report are identical, the qualia are identical (or the distinction is meaningless).

  ---

  ### BRANCH A: Qualia Independent of Report (YES)

  ### NODE 2: The Coherence Challenge
  **Question:** If qualia can vary without the subject detecting the change, is "qualia" still a coherent theoretical posit? (i.e., Is a difference that makes no epistemic difference a real difference?)
  *   **(A1) NO:** Positing undetectable properties is incoherent or explanatorily empty.
  *   **(A2) YES:** Such properties are metaphysically possible, even if epistemically hidden.

  #### ➔ LEAF 1: The Incoherence/Eliminativist View
  *   **Position:** Qualia, defined as intrinsic properties separable from function, are incoherent. The report *is* the phenomenon.
  *   **Philosophers:** Daniel Dennett, Keith Frankish (Illusionism).
  *   **Status:** Contested. Critics argue this changes the subject rather than solving the hard problem.

  #### ➔ LEAF 2: Sceptical Realism / Dualism
  *   **Position:** Qualia are real and independent, but we cannot know their true nature or stability over time. We must accept the possibility of undetectable inversion.
  *   **Philosophers:** David Chalmers (early work on epistemic asymmetry), Frank Jackson (pre-physicalist conversion).
  *   **Status:** Contested. Accused of accepting epiphenomenalism or scepticism.

  #### ➔ LEAF 3: [UNNAMED/EMPTY] The Incoherent Realist
  *   **Position:** Qualia vary undetectably, this is incoherent, *but* they are still real properties.
  *   **Diagnosis:** **Logically Unstable.** This branch accepts the Chase-Sanborn contradiction without resolving it. It asserts $P$ and $\neg P$ regarding the coherence of the posit. No major philosopher occupies this leaf; it represents the "naïve" view Dennett attacks.

  ---

  ### BRANCH B: Qualia Tied to Report (NO)

  ### NODE 3: The Nature of Reference
  **Question:** Do phenomenal concepts (e.g., "what it is like to see red") refer to *ineffable/intrinsic* properties, or do they refer to *functional/dispositional* roles?
  *   **(B1) INEFFABLE/INTRINSIC:** They pick out properties that cannot be fully defined by function.
  *   **(B2) FUNCTIONAL/DISPOSITIONAL:** They pick out roles defined by causal relations and reports.

  ---

  ### BRANCH B1: Ineffable/Intrinsic (But tied to report)

  ### NODE 4: Privacy and Access
  **Question:** If these properties are intrinsic, are they essentially *private* (accessible only to the subject)?
  *   **(B1a) YES:** They are private, intrinsic, yet necessarily track function.
  *   **(B1b) NO:** They are intrinsic but publicly accessible/effable via physical description.

  #### ➔ LEAF 4: Traditional Non-Reductive Realism (The "Burned" Branch)
  *   **Position:** Qualia are intrinsic and private, but supervene on function so tightly that reports never lie.
  *   **Philosophers:** Early Ned Block (Spectator Consciousness), Thomas Nagel (interpreted strongly).
  *   **Status:** **Highly Contested.** Dennett argues this is the specific target of Chase-Sanborn: if they are private and intrinsic, why *can't* the report lie? If they *can't* lie, in what sense are they private? This leaf is often accused of collapsing into Leaf 5 or Leaf 1.

  #### ➔ LEAF 5: Restricted Realism (Representationalism)
  *   **Position:** Qualia are real properties, but they are not ineffable or private. They are representational contents that can be fully described physically/functionally.
  *   **Philosophers:** Michael Tye, Fred Dretske.
  *   **Status:** Live Option. Saves realism by sacrificing the "ineffability" criterion of traditional qualia.

  #### ➔ LEAF 6: [UNNAMED/EMPTY] The Private Effable
  *   **Position:** Qualia are essentially private, yet fully effable in public language.
  *   **Diagnosis:** **Conceptually Tense.** "Privacy" in philosophy of mind usually entails some form of ineffability or first-person authority that outstrips third-person description. Claiming a property is *essentially* private yet *fully* effable risks contradiction.

  ---

  ### BRANCH B2: Functional/Dispositional

  ### NODE 5: Ontological Commitment
  **Question:** Are these functional roles *identical* to the experience, or are the concepts merely useful fictions?
  *   **(B2a) IDENTICAL:** The experience just *is* the disposition to report.
  *   **(B2b) FICTION:** The concepts are empty, but we retain them for pragmatic utility.

  #### ➔ LEAF 7: Analytic Functionalism
  *   **Position:** Mental states are defined by their causal roles. If the silicon system plays the role, it has the qualia.
  *   **Philosophers:** David Lewis, Daniel Stoljar.
  *   **Status:** Live Option. Avoids incoherence by defining qualia relationally.

  #### ➔ LEAF 8: Fictionalism / Instrumentalism
  *   **Position:** Talk of qualia is useful for prediction, but there is no ontological referent.
  *   **Philosophers:** Bas van Fraassen (general scientific instrumentalism applied here), some readings of Wittgenstein.
  *   **Status:** Minority View. Often indistinguishable from Eliminativism (Leaf 1) in practice, differing only in whether we keep the *language*.

  ---

  ## Analysis of Logical Space

  ### 1. Indistinguishable Leaves (Metaphysical Framing vs. Empirical Claim)
  *   **Leaf 1 (Eliminativism) vs. Leaf 8 (Fictionalism):**
      *   **Agreement:** Both agree that there are no *intrinsic, ineffable* qualia. Both agree the Silicon subject has everything that matters for psychology.
      *   **Disagreement:** Purely linguistic/ontological. Does "qualia" refer to nothing (Eliminativism) or does it refer to a useful fictional construct (Fictionalism)?
      *   **Seminar Note:** In the context of the Chase-Sanborn argument, these two often function identically. The debate is whether we should *eradicate* the term or *reinterpret* it.

  *   **Leaf 5 (Restricted Realism) vs. Leaf 7 (Functionalism):**
      *   **Agreement:** Both deny ineffability and privacy. Both agree qualia supervene on function.
      *   **Disagreement:** Metaphysical framing. Is the property *identical* to the function (Functionalism) or is it a *real property represented by* the function (Representationalism)?
      *   **Seminar Note:** This is often a "realist" dispute. Both satisfy the Chase-Sanborn constraint that reports cannot be false without behavioral change.

  ### 2. Empty and Unstable Branches
  *   **Leaf 3 (Incoherent Realist):** This is the "straw man" leaf. It represents the position Dennett claims traditional qualia realists are committed to, but which they usually deny once the contradiction is pointed out. It is empty because no one argues *for* incoherence.
  *   **Leaf 6 (Private Effable):** This branch is largely unexplored because "privacy" is typically defined by a lack of full public access. A view claiming full public access while maintaining essential privacy needs a novel definition of privacy (e.g., indexical access only) to survive.

  ### 3. Settled vs. Contested Issues
  *   **Settled:** There is no consensus definition of "qualia." The debate is largely about which criteria (privacy, ineffability, intrinsicness) must be dropped to make the concept coherent. Everyone agrees the Chase-Sanborn case presents a *challenge*; they disagree on the *solution*.
  *   **Contested:**
      1.  **The Success of the Incoherence Argument:** Does Dennett prove traditional qualia are incoherent (Leaf 1), or does he merely prove they are non-functional (Leaf 2)?
      2.  **The Cost of Saving Qualia:** Is sacrificing ineffability/privacy (Leaf 5) a viable way to save realism, or does it change the subject so much that it counts as eliminativism in disguise?
      3.  **The Fact of the Matter:** In the Silicon Case, is there a fact of the matter about the experience? (Leaf 1 says No; Leaf 2 says Yes).

  ### 4. Mapping the "Chase-Sanborn" Line
  The specific force of the Chase-Sanborn argument targets **Leaf 4**. It argues that if you hold Qualia are **Intrinsic + Private**, you are forced into **Leaf 3** (Incoherence) because you cannot explain how the subject knows their qualia haven't drifted (the "memory drift" variant) without invoking functional criteria. To escape Leaf 3, you must move to **Leaf 1** (drop Realism), **Leaf 2** (accept Scepticism), or **Leaf 5** (drop Privacy/Ineffability).
