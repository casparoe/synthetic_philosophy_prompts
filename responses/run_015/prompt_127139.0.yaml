answer: |-
  This procedure forces explicit validation of value alignment and patient welfare before any accommodation is ratified, rejecting trades that rely on deception, precedent erosion, or patient harm.

  ### The Decision Procedure

  **Step 1: The Silent Party Check (Patient Welfare)**
  *   **Question:** Does this accommodation impose net harm on the patient beyond the underlying condition, without compensating benefit to the patient?
  *   **Sufficient Answer:** A clinical attestation that the patient's suffering is minimized or that the patient's own values (if known) are served.
  *   **Stop Condition:** If the plan increases patient suffering solely to resolve team-family conflict, return **No**.
  *   **Handoff:** **Clinicians** determine medical harm/benefit; **Lay Members** assess whether the burden falls disproportionately on the voiceless patient.

  **Step 2: Currency Verification (Phantom Trade Check)**
  *   **Question:** Is the concession offered actually valued by the receiver in their own terms, or is it a proxy for something else?
  *   **Sufficient Answer:** The receiver articulates why this specific concession matters to their core interests (e.g., religious duty, hope, closure) rather than accepting a generic policy waiver.
  *   **Stop Condition:** If the receiver accepts a concession only because they misunderstand its nature or because they feel coerced, return **No**.
  *   **Handoff:** **Chaplain** and **Lay Members** verify value alignment; **Family** defines the value.

  **Step 3: Intensity and Belief Audit**
  *   **Question:** Is the intensity of the preference credible, and does it rest on empirical claims we hold to be true?
  *   **Sufficient Answer:** Preference intensity is backed by contingent commitment (e.g., "We will accept withdrawal if X happens"), and empirical beliefs are vetted.
  *   **Treatment of Intensity:**
      *   **Cheap to Fake:** If a side claims high intensity but bears no cost, treat the intensity as **zero** until they accept a contingent burden (e.g., agreeing to a hard stop date).
      *   **False Belief:** If the preference rests on an empirical belief the clinical team judges false (e.g., "This treatment will cure despite evidence"), the concession value is **zero**. You cannot trade on falsehoods.
  *   **Stop Condition:** If the trade relies on a false empirical belief or unverified intensity, return **No**.
  *   **Handoff:** **Clinicians** verify facts; **Family** verifies intensity/commitment.

  **Step 4: Precedent and Baseline Count (Global Loss Check)**
  *   **Question:** If every family requested this accommodation, would it degrade the hospital's ability to care for future patients or shift the baseline unfairly?
  *   **Sufficient Answer:** The committee confirms the concession is idiosyncratic to this case's values, not a new standard of care.
  *   **Counting Mechanism:** Count the cost not just for this case, but as the **sum of future friction costs**. If universalizing this trade forces the team into untenable positions later, count it as a global loss.
  *   **Stop Condition:** If the accommodation sets a precedent that compromises future care standards or legal safety, return **No**.
  *   **Handoff:** **Chair** and **Lawyer** assess systemic risk and precedent.

  **Step 5: Moral Agency and Action (Doing vs. Allowing)**
  *   **Question:** Does this require a clinician to *perform* an action they deem morally distinct from *allowing* an outcome, even if the outcome is identical?
  *   **Sufficient Answer:** The attending physician certifies that the action required does not violate their distinction between acting and omitting.
  *   **Constraint:** The procedure must **not** treat "withdrawing treatment" (allowing death) as interchangeable with "administering lethal agent" (causing death). If the clinician classifies the request as the former, it may pass; if the latter, it fails regardless of outcome.
  *   **Stop Condition:** If the attending physician refuses to sign based on moral agency (doing vs. allowing), return **No**.
  *   **Handoff:** **Attending Physician** holds sole veto on moral agency.

  **Step 6: Final Ratification**
  *   **Question:** Do all parties sign with full understanding that the above checks are satisfied?
  *   **Sufficient Answer:** Signatures from Attending, Family, and Committee Chair.
  *   **Stop Condition:** Any missing signature returns **No**.

  ---

  ### Applications

  **Case 1: Time-limited trial for dying infant.**
  This passes provided Step 3 (Intensity/Belief) and Step 4 (Precedent) are rigorously applied. The family's gain (hope/time) is real currency, not phantom, if they understand the stop date is binding. The team's gain (avoiding unilateral withdrawal) is real. However, if the family believes the trial implies a chance of cure that the team knows is nonexistent, Step 3 flags this as a false belief; the intensity is based on a falsehood, making the trade phantom unless the clinicians explicitly correct the prognosis before the agreement. If the stop date is treated as a "soft" target to be renegotiated endlessly, Step 4 flags this as a precedent that erodes trust in future limits. Assuming the stop date is rigid and the prognosis is clearly communicated, this is a valid trade, not a phantom one.

  **Case 2: Jehovah's Witness surgery without transfusion.**
  This passes Step 1 (Patient Welfare) only if the clinical team certifies that cell salvage and expanders offer a viable chance of survival acceptable within medical standards. If the team believes surgery without blood is effectively malpractice, Step 3 (False Belief) triggers: the family may believe God will protect them, but the clinicians cannot validate the empirical safety. If the clinicians agree the risk is manageable though elevated, the trade holds. Step 5 (Agency) is critical here: clinicians must distinguish between *allowing* the patient to risk death via refusal versus *doing* harm by withholding standard care. If the team views withholding blood as active harm, they must veto. If they view it as respecting refusal, it passes.

  **Case 3: Seventeen-year-old refusing transfusion.**
  This is the highest risk for being a phantom trade. Step 4 (Precedent) and Step 6 (Ratification) depend entirely on the **Lawyer's** input. If the jurisdiction does not legally recognize a 17-year-old's right to refuse life-saving care, the signature provides no actual protection to the team and no actual autonomy to the teen; the gain is phantom for both. The team thinks they are avoiding battery; the law may still compel treatment. The teen thinks they are choosing; the law may override them. The procedure returns **No** unless the Lawyer confirms the signature has legal weight (e.g., mature minor doctrine applies). If the law supports it, and Step 1 confirms the teen has decision-making capacity (not just understanding), it passes. If capacity is dubious, the patient welfare check fails.

  ---

  ### Limitations

  This procedure cannot resolve fundamental moral disagreements where both sides acknowledge the facts but reject the other's values. It cannot predict the long-term erosion of norms with perfect accuracy, only flag obvious precedent risks. It cannot protect the patient from all harm, only ensure harm is not incurred solely for the convenience of the adults. Finally, it cannot substitute for trust; if the family believes the clinicians are lying about the prognosis, no amount of procedural rigor will validate the trade.
