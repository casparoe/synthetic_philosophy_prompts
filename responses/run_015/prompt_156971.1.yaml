answer: |-
  # Philosophy of Mind Seminar: Final Examination

  **Time Allowed:** 45 Minutes  
  **Word Limit:** Approximately 800 words  
  **Instructions:** Answer the following question. You are not required to cite specific authors or texts. Argue from the concepts provided.

  **Question 1: The Dual-Ledger Problem**

  The classic paradox of self-deception rests on a static contradiction: to deceive oneself about a proposition $p$, an agent must believe that $p$ is false (to be the deceiver) while simultaneously coming to believe that $p$ is true (to be the deceived). This seems to require holding contradictory beliefs consciously at the same time, which many argue is psychologically impossible or conceptually incoherent.

  Consider a proposed solution called the **Dual-Ledger Problem**. On this view, the mind is not unified but maintains two distinct sets of credences. The first ledger is dedicated to **practical reasoning**, guiding action and interaction with the world based on evidence. The second ledger is dedicated to **emotional self-regulation**, managing anxiety, hope, and self-esteem. The agent deliberately constructs a barrier preventing these ledgers from merging. Thus, the practical ledger might register $\neg p$ (e.g., "my partner is unfaithful"), while the emotional ledger registers $p$ (e.g., "my partner is faithful") to maintain psychological stability.

  Evaluate this proposal. Does the Dual-Ledger framework successfully resolve the classic paradox of self-deception by making the state coherent? Or does it merely rename the problem by describing a form of compartmentalization that fails to capture the intentionality of genuine deception? In your answer, address whether blocking the merger of credences preserves the agency required for deception or dissolves it into mere inconsistency.

  ***

  # Model Answer

  The classic paradox of self-deception posits that an agent cannot simultaneously know $p$ and believe $\neg p$ without violating rationality. If I know my partner is unfaithful, I cannot genuinely believe they are faithful unless I am irrational to the point of incoherence. The Dual-Ledger proposal attempts to dissolve this contradiction by fragmenting the agent. By assigning contradictory credences to separate functional domains—practical reasoning versus emotional regulation—it claims the agent never holds contradictory beliefs *in the same respect* at the same time.

  Superficially, this resolves the static paradox. If the "practical ledger" guides my actions (e.g., I hire a detective) while the "emotional ledger" guides my feelings (e.g., I feel secure), there is no single locus of consciousness where $p$ and $\neg p$ collide. The contradiction is distributed across subsystems rather than concentrated in a unified mind. This mimics the structure of interpersonal deception, where the deceiver and deceived are distinct entities; here, the subsystems play those roles.

  However, this resolution comes at a steep cost to the concept of agency. For deception to occur, there must be an intention to deceive. In the Dual-Ledger model, who constructs the barrier? If the agent deliberately blocks the ledgers from merging, they must know the truth of both ledgers to engineer the separation. This reintroduces the paradox at a higher level: the "architect" of the barrier knows $p$ and $\neg p$ simultaneously to keep them apart. The paradox is not solved; it is relocated to the mechanism of compartmentalization itself.

  Furthermore, this framing risks reducing self-deception to mere inconsistency. Genuine deception involves a normative failure—a violation of the duty to believe according to evidence. If the practical ledger accurately tracks evidence ($\neg p$) and only the emotional ledger indulges in fantasy ($p$), is the agent truly deceived? If I act on $\neg p$ while merely feeling comforted by $p$, I am not believing a falsehood; I am indulging in a comforting fiction while acknowledging reality. This looks less like deception and more like conscious coping. Deception requires that the agent actually takes the false proposition to be true in a way that influences their grasp of reality, not just their mood.

  If the emotional ledger truly overrides the practical one—causing the agent to act on $p$ despite evidence for $\neg p$—then the practical ledger is not functioning as a repository of knowledge. It becomes inert. But if the practical ledger is inert, the agent is simply irrational, not deceptive. The Dual-Ledger view thus faces a dilemma: either the agent knows the truth (making it coping, not deception) or the agent is irrational (making it confusion, not deception).

  Ultimately, the Dual-Ledger problem does not resolve the paradox but renames it. It describes *how* contradictory states might coexist without logical explosion, but it fails to explain the unified intentionality required to call this state "deception." By compartmentalizing the mind to save coherence, the theory dissolves the agent into a collection of modules, none of which are truly deceived in the robust sense. The paradox remains because the unity of the self is required for self-deception to be meaningful; without that unity, there is only mechanical conflict.

  ***

  # Marking Scheme (Total: 20 Marks)

  | Move | Criteria (5 Marks Each) | Typical Mistake |
  | :--- | :--- | :--- |
  | **1. Formulating the Paradox** | Clearly articulates the static contradiction (knowing $p$ vs. believing $\neg p$) and why it threatens coherence. | Confusing "belief" with "knowledge" or treating the paradox as merely empirical rather than conceptual. |
  | **2. Explaining the Mechanism** | Accurately depicts the Dual-Ledger proposal (practical vs. emotional) and how the barrier functions to avoid contradiction. | Treating the ledgers as fully independent minds rather than functional subsets of one agent. |
  | **3. Evaluating Intentionality** | Analyzes whether the "barrier construction" requires a higher-order knowledge that reinstates the paradox. | Assuming the separation automatically solves the intentionality problem without questioning who builds the wall. |
  | **4. Final Verdict** | Takes a clear stance on whether this is genuine deception or mere compartmentalization/coping, justified by previous analysis. | Sitting on the fence without justification or failing to distinguish between coping and believing. |
