      *   *The User's Hypothesis:* The "Inherited-Credit Problem." This suggests a dynamic element. Camp B implies performance legitimacy is fragile (transactional). Camp A implies it's robust (cultural/acceptance). The user asks if this fragility is an *empirical* question or just a restatement of the normative worry.

