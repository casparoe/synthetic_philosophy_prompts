      *   Camp A treats legitimacy as a *cause* of stability (Independent Variable-ish).
      *   Camp B treats legitimacy as a *property* of justice/authority (Dependent Variable of normative theory).
      *   The "Inherited-Credit" hypothesis is insightful but is actually a *mechanism* debate nested inside the definitional war. It's not the *root* cause, but it's the battlefield.

