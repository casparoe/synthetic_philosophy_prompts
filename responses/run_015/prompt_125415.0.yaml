      *   *Critique:* It doesn't solve the normative disagreement. Even if performance legitimacy is stable for 50 years, Camp B will still say it's not *legitimacy*, just stable domination. So the hypothesis explains the *dynamic* but doesn't bridge the *definitional* gap.

