answer: |-
  This is a classic standoff, but your diagnosis of the *structure* is sharper than the usual "Weber vs. Normative" map you've likely already discarded. You are asking whether the impasse is verbal, intuitive, evidentiary, or categorical.

  Here is the diagnosis: **This is a case of Two Questions Pursued Under One Heading, driven by a mismatch in the theoretical function the concept is meant to serve.**

  It is not merely a verbal dispute, because both sides believe getting the definition right has downstream consequences for how we explain regime survival and obligation. It is not a clash of intuitions, because both sides have theorized their intuitions into coherent positions. It is not primarily about evidence, because, as you note, you agree on the facts.

  The impasse persists because Camp A is using "legitimacy" as an **explanatory variable** for stability (sociological legitimacy), while Camp B is using "legitimacy" as a **normative predicate** for obligation (philosophical legitimacy).

  Camp A asks: *What belief system sustains this order?* If the belief is "they deliver," then "delivery" is the source of legitimacy. To deny this is to impose an external standard on the subjects' own reasons for action.
  Camp B asks: *What makes power rightful?* If the relationship is transactional ("I pay taxes/obey, you provide growth"), it is a contract of exchange, not a relation of authority. Authority requires that the subject accepts the ruler's right to decide *even when* the specific output is suboptimal, provided the procedure was right.

  Because you are using one word ("legitimacy") to cover both "what explains compliance" and "what justifies authority," you cannot move. Every time Camp A points to stability, Camp B points to the lack of right. Every time Camp B points to the lack of right, Camp A points to the presence of stability.

  ### The "Inherited-Credit" Hypothesis

  Your hypothesis regarding the "inherited-credit problem" (whether performance-based acceptance is self-renewing or self-consuming) is **a genuine empirical question, but it is currently functioning as a proxy for the normative disagreement.**

  It is genuine because it addresses the *durability* of the sociological fact. Camp B's claim that "a ruler who must keep re-buying consent is... paying, not ruling" relies on an empirical assumption: that performance mandates are inherently short-term and transactional (self-consuming). Camp A assumes they can be institutionalized and long-term (self-renewing).

  However, isolating this empirical question will not break the impasse. Here is why:
  1.  **Even if you prove it is self-renewing:** Camp B can still argue that a 50-year transactional relationship is still a transaction, not a normative standing. Long-term bribery is still bribery.
  2.  **Even if you prove it is self-consuming:** Camp A can argue that *all* legitimacy is contingent. Procedural regimes lose legitimacy if they fail catastrophically (e.g., losing a war, economic depression). The difference is one of degree (how fast the credit runs out), not kind.

  The "Inherited-Credit" story is a redescription of the *mechanism* of the disagreement, not the *source*. It names the dynamic that Camp B finds disqualifying, but it does not force Camp B to accept that dynamic as sufficient for legitimacy. It isolates a variable (time/horizon of acceptance) but leaves the definition of the dependent variable (legitimacy) contested.

  ### The Real Obstacle: The Object of the Claim

  You hinted at this in your final paragraph: *"what the object of the claim is supposed to be — a regime, a government, or an administrative record."* This is the lever.

  Camp B insists legitimacy must attach to the **Regime/Office** (the right to hold power).
  Camp A observes acceptance attaching to the **Government/Record** (the right to specific outcomes).

  In performance-based systems, the "Regime" often conflates itself with the "Record." The party *is* the growth. Camp B sees this as a category error (you cannot own the economy); Camp A sees it as a sociological fact (subjects believe the party owns the economy).

  ### Path to Progress

  You should not expect a verdict on "who is right." You should expect progress only by **bifurcating the concept.**

  **1. Abandon the word "Legitimacy" for this conversation.**
  It is too overloaded. It carries too much baggage from both political theory (justification) and comparative politics (stability). In this specific group, it has become a "stop word" that triggers the four recurring moves.

  **2. Adopt a Two-Concept Framework.**
  Replace the single question ("Is it legitimate?") with two distinct operational questions:
  *   **Question A (Sociological):** *On what basis is compliance secured?* (Answer: Performance, Tradition, Procedure, Fear).
  *   **Question B (Normative):** *Does the ruler have a standing right to demand obedience independent of specific outcomes?* (Answer: Yes/No based on procedural/ethical criteria).

  **3. Reframe the Empirical Inquiry.**
  Instead of asking "Is performance legitimacy real?", ask: *"Under what conditions does performance-based compliance institutionalize into regime-level loyalty?"*
  This accepts Camp A's premise (compliance exists) and Camp B's premise (there is a difference between transactional compliance and institutional loyalty) and turns the "Inherited-Credit" hypothesis into a testable research design. You are no longer arguing about the definition of legitimacy; you are arguing about the *half-life of performance mandates*.

  ### Recommendation

  **Do not try to resolve the definition.** The definition is a tool. Camp A needs a tool that explains why the regime didn't collapse in 2008. Camp B needs a tool that explains why the regime cannot demand sacrifice without consent. Both tools are useful for different purposes.

  **Progress looks like this:**
  Acknowledge that Camp A is describing **Regime Support** (diffuse support rooted in output) and Camp B is describing **Political Obligation** (moral duty rooted in input).
  *   If the group agrees to this distinction, the impasse dissolves. You can agree that the regimes have high *Regime Support* (Camp A wins) but low *Political Obligation* in the normative sense (Camp B wins).
  *   The "Inherited-Credit" question then becomes a specific hypothesis about the stability of Regime Support: *Does high Regime Support based on output eventually transform into Political Obligation, or does it remain perpetually contingent?*

  **Verdict:**
  The impasse is a **category mismatch** regarding the function of the concept. The "Inherited-Credit" hypothesis is a **valid empirical mechanism** but is being asked to do **normative heavy lifting** it cannot sustain.

  **Action:**
  Stop asking "Is it legitimacy?" Start asking "Is this acceptance institutionalized or transactional?" and "Does this acceptance generate a moral duty to obey?" If you cannot separate these, **abandon the word 'legitimacy' entirely** for the sake of this project. It is obscuring more than it reveals. Use "Acceptance" for Camp A and "Authority" for Camp B. You will find you agree on much more than you thought.
