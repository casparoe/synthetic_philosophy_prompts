      *   If the calibration budget requires *non-testimonial* input, social markers might not count if their significance is learned via testimony.
      *   *Argument:* The "Calibration Budget" requires an exchange rate. How do I convert "Person has a PhD" (perception) into "Person is reliable about String Theory" (belief)? That conversion rule is itself testimonial/cultural.
      *   *Conclusion:* The view demands a non-testimonial bridge that doesn't exist in high-opacity domains.

  6.  **Refining the "Bootstrapping" Objection:**
      *   Is it fatal? Only if the view claims to explain *all* justification. If it's a normative claim about adult knowledge, maybe not.
      *   But if the "chain" must terminate in non-testimonial reasons for *current* justification, the child case shows the *source* of the budget is mysterious.
