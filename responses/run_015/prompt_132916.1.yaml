prompt: |-
  I direct a small policy-planning unit inside a foreign ministry, and effectively all of our work arrives in the form of a claim that some present situation is a repeat of an earlier one: this is Munich, this is Vietnam, this is 1914, this is a rising power frightening an established one, this is the Cuban Missile Crisis and therefore we should blockade rather than invade. These claims come in weekly, from ministers, from allied governments, from our own staff, and increasingly from advocacy groups. They are not offered as decoration; they are offered as evidence that a particular policy will succeed or fail. My team has no framework for grading them, so the loudest analogy wins.

  What I want from you is a written procedure my analysts can actually run, not an essay about analogy. Constraints on its use: one or two generalists with no graduate training in history, roughly forty-five minutes, open sources only, no archives and no specialist consultation; the write-up has to fit on one page and be readable by a minister who has never thought about analogical reasoning; and it has to terminate in one of three verdicts — the analogy earns weight in the forecast and licenses a named prediction; it is only a reframing device, good for generating questions but not for answering them; or it is doing rhetorical work and should be struck from the paper. Please give me the ordered questions, what counts as a sufficient answer to each, the points where the sequence stops with a no, and the points where the remaining question is one of values or of irreducible judgment and must be handed to a named human rather than settled by the checklist.

  Four constraints on the design itself, because the easy versions of this fail.

  First, the procedure cannot rest on an agreed reading of the source case. Historians dispute what Munich teaches, what Vietnam teaches, and whether the Peloponnesian War really was a case of an established power reacting to a rising one; if your checklist requires the analyst to know what actually happened and why, it will just reproduce the analyst's politics. It has to work when the source case is contested.

  Second, it must sort surface resemblance from mechanism portability: the analogy has to name the mechanism that did the causal work in the source case, state the conditions under which that mechanism operates, and then check those conditions in the target rather than counting shared features.

  Third, it must be symmetric. For every analogy offered, the analyst should have to produce the best-fitting analogy that supports the opposite policy and run the same steps on it; a procedure that only ever interrogates the other side's analogy is worthless to me. Say explicitly what the analyst should do when the two analogies come out with comparable fit and opposite recommendations, since that is the common case and not a degenerate one.

  Fourth, it must handle two pathologies I see constantly. One is selection: the cases we remember were filtered by outcome, and the lessons that survive in public argument were filtered again by how useful they are to people arguing for action, so a procedure that asks only whether the target resembles the source inherits both filters. The other is reflexivity: the other side has read the same history. A government may stage a provocation expecting us to read it as Munich, or refrain from something expecting us to read it as 1914, or invoke our own archival analogy back at us. The procedure needs a step for the case where the target is reasoning about our analogy use, including the possibility that the analogy is being deployed as a weapon rather than offered as a forecast.

  Please also build in a pre-registration step, since we nearly always see the analogy after the recommendation is already drafted, and a step that asks what the expected loss is if the analogy is wrong and the action it recommends is irreversible.

  Then run it, honestly, on three live-shaped cases: a hegemon-and-rising-power framing applied to the current competition over Taiwan; a Munich framing applied to a demand that a neighbouring state cede territory and cap its alliances; and a Vietnam framing applied to a proposal to send a few hundred advisers and some air support to a government losing a counterinsurgency. My unit has a house bias — we are the restraint-minded desk, we reach for 1914 and Vietnam, and we are reflexively hostile to Munich framings — so if the honest output is that our own house analogy is the weakest of the three, say that plainly, because it is the answer I will be most tempted to reject.

  Finally, tell me what the procedure cannot do, where it will misfire, and which of its steps are judgment calls dressed up as method. And note that the failure mode I most want to avoid is a checklist whose real content is check whether the analogy is accurate, or one that amounts to general scepticism about learning from history; the verdicts have to be generated by the structure of the case and the mechanism, not by the analyst's prior view of the policy.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** Director of a small policy-planning unit in a foreign ministry.
      *   **Problem:** Work is dominated by historical analogies (Munich, Vietnam, 1914, etc.) used as evidence for policy. No framework to grade them. Loudest analogy wins.
      *   **Goal:** A written procedure (checklist/workflow) for analysts to grade these analogies.
      *   **Constraints on Procedure:**
          *   1-2 generalist analysts (no grad history training).
          *   ~45 minutes execution time.
          *   Open sources only (no archives/specialists).
          *   One-page write-up, readable by a minister.
          *   Three specific verdicts (Weight/Evidence, Reframing/Questions, Rhetorical/Strike).
          *   Ordered questions with pass/fail criteria.
          *   Identify where human judgment is needed.
      *   **Constraints on Design (The "Hard" Constraints):**
          1.  *Contested Source Cases:* Cannot rely on a single "true" reading of history (e.g., what Munich *really* means).
          2.  *Mechanism over Surface:* Must identify causal mechanisms, not just shared features.
          3.  *Symmetry:* Must test the *opposite* analogy too. Handle ties.
          4.  *Pathologies:* Handle selection bias (outcome filtering) and reflexivity (adversary anticipating our analogies).
          5.  *Pre-registration:* Check if analogy came after the policy decision.
          6.  *Risk Assessment:* Expected loss if analogy is wrong + action irreversible.
      *   **Test Cases:**
          1.  Thucydides Trap (Hegemon/Rising Power) -> Taiwan.
          2.  Munich (Appeasement) -> Neighbor demanding territory/alliance caps.
          3.  Vietnam (Quagmire) -> Advisers/Air support for counterinsurgency.
      *   **Bias Check:** The user's unit is "restraint-minded" (likes 1914/Vietnam, hates Munich). Must be honest if their house analogy is weak.
      *   **Limitations:** Must explicitly state what the procedure *cannot* do and where it misfires.

  2.  **Drafting the Procedure (The "Analogy Stress-Test Protocol"):**

      *   *Time Management:* 45 minutes is tight. The steps need to be sharp.
      *   *Structure:* Needs to flow logically from "Is this just rhetoric?" to "Does the mechanism hold?" to "What about the other side?" to "What's the risk?"
      *   *Addressing Constraint 1 (Contested History):* Instead of asking "What happened in Munich?", ask "What mechanism does the *proponent* claim happened?" and test *that*.
      *   *Addressing Constraint 2 (Mechanism):* Explicit step to define the "Engine" of the analogy.
      *   *Addressing Constraint 3 (Symmetry):* A dedicated step for "Counter-Analogy."
      *   *Addressing Constraint 4 (Pathologies):* Steps for Selection Bias and Reflexivity.
      *   *Addressing Constraint 5 (Pre-registration):* Step 1.
      *   *Addressing Constraint 6 (Risk):* Final step before verdict.
      *   *Verdicts:* Map the scoring to the three required outcomes.

      *Drafting the Steps (Mental Iteration):*
      *   Step 1: Timing (Pre-reg).
      *   Step 2: Mechanism Extraction (Don't argue history, argue the claim).
      *   Step 3: Condition Matching (Does the engine work here?).
      *   Step 4: Selection Bias Check (Why this case?).
      *   Step 5: Reflexivity (Are they playing us?).
      *   Step 6: Symmetry (Find the counter-analogy).
      *   Step 7: Risk/Irreversibility.
      *   Step 8: Verdict.

      *Refining for the "One Page" constraint:* The instructions to the analyst need to be concise. The *output* needs to be one page. The *procedure* itself can be slightly longer but must be executable in 45 mins. I will design the procedure as a checklist that *generates* the one-page memo.

  3.  **Developing the Test Cases:**

      *   *Case 1: Thucydides Trap (Taiwan).*
          *   Mechanism: Structural stress causes war regardless of intent.
          *   Conditions: Rising power threatening core interests of hegemon.
          *   Counter: 19th Century US/UK (peaceful transition).
          *   Reflexivity: China might be acting *to avoid* the trap, or provoke it.
          *   Risk: High (War).
          *   *Honest Assessment:* Often weak on mechanism specifics (nuclear deterrence changes the "1914" dynamic).
      *   *Case 2: Munich (Territory/Alliances).*
          *   Mechanism: Concessions signal weakness, emboldening aggression.
          *   Conditions: Aggressor has unlimited aims; domestic politics reward toughness.
          *   Counter: 1911 Agadir Crisis (Compromise worked).
          *   Risk: High (War if wrong).
          *   *Honest Assessment:* Strong mechanism if the neighbor is revisionist, weak if they are security-seeking.
      *   *Case 3: Vietnam (Advisers/Air).*
          *   Mechanism: Incremental commitment creates sunk cost fallacy + local legitimacy deficit.
          *   Conditions: Insurgency has external support; local gov lacks legitimacy.
          *   Counter: Korea (Successful containment via limited means).
          *   Risk: Medium/High (Quagmire).
          *   *Honest Assessment:* The user's unit likes this. I need to be careful not to bias it, but structurally, "advisers" often *do* lead to escalation. However, is the mechanism identical?
      *   *Bias Check:* The prompt asks me to be honest if the "restraint" analogy (Vietnam/1914) is weakest. In the Taiwan case, the Thucydides trap is often used by hawks *and* doves differently. In the Vietnam case, the analogy is strong on "slippery slope" but weak on "inevitability." I need to evaluate based on the *procedure's* output, not my own view.

  4.  **Refining the Procedure Logic (Self-Correction against Constraints):**

      *   *Constraint 1 (Contested History):* I must ensure the analyst doesn't have to resolve "Was Munich appeasement?" but rather "If we assume the Munich mechanism (appeasement breeds aggression), does it fit?"
      *   *Constraint 3 (Symmetry):* This is the hardest part for a 45-minute limit. I need to simplify. Instead of a full workup of the counter-analogy, require the *identification* of the mechanism and a quick condition check.
      *   *Constraint 4 (Reflexivity):* Need a specific question: "Does the adversary know we use this analogy?"
      *   *Constraint 6 (Risk):* Needs to be a matrix: Irreversibility x Cost of Error.

  5.  **Finalizing the Output Structure:**

      *   **Part 1: The Procedure (The "Analogy Stress-Test Protocol").** Clear steps, stop rules, verdict mapping.
      *   **Part 2: The Test Cases.** Applying the protocol honestly.
      *   **Part 3: Limitations & Meta-Analysis.** Where does this fail? What is disguised judgment?

  6.  **Writing - Tone and Style:**
      *   Professional, bureaucratic but sharp.
      *   No fluff.
      *   Direct address to the Director.
      *   Acknowledge the difficulty of the task.

  7.  **Specific Challenge: The "Verdict" Logic.**
      *   *Weight/Evidence:* Mechanism holds, conditions match, counter-analogy weaker, risk manageable or high confidence.
      *   *Reframing:* Mechanism plausible but conditions ambiguous, or counter-analogy equal strength.
      *   *Rhetorical/Strike:* Mechanism undefined, selection bias obvious, or reflexivity high.

  8.  **Specific Challenge: The "Honest Output" on Bias.**
      *   The user says they are restraint-minded (Vietnam/1914).
      *   If I run the Vietnam analogy on "sending advisers," the mechanism (slippery slope/legitimacy) is often *stronger* than the Munich mechanism in ambiguous cases.
      *   However, for the Taiwan case (Thucydides), the restraint view usually argues *against* the inevitability of war. The "Hegemon/Rising Power" analogy is usually used to justify *arming* Taiwan (hawkish) or *abandoning* Taiwan (restraint/avoid war). I need to be clear on which policy the analogy supports in the prompt's context. The prompt says "Hegemon-and-rising-power framing applied to the current competition." Usually, this implies "War is likely/inevitable" (Realist).
      *   *Correction:* The prompt asks me to run the procedure on the *analogy itself* as presented.
      *   *Case 1:* Thucydides Trap -> Implies structural war. (Often used to justify preparation or accommodation).
      *   *Case 2:* Munich -> Implies fight now or lose later. (Hawkish).
      *   *Case 3:* Vietnam -> Implies don't get involved/slippery slope. (Dovish/Restraint).
      *   *Bias Check:* If the unit is restraint-minded, they like Vietnam. I must evaluate if the Vietnam analogy *actually* scores well under the protocol. Often, Vietnam is a "selection bias" case (we remember the loss, not the successes of limited intervention). I should point this out.

  9.  **Final Review against Constraints:**
      *   45 mins? Yes, steps are streamlined.
      *   One page output? The procedure generates a one-page memo structure.
      *   Contested history? Yes, focuses on claimed mechanism.
      *   Symmetry? Yes, Step 5.
      *   Pathologies? Yes, Steps 3 & 6.
      *   Pre-reg? Yes, Step 1.
      *   Risk? Yes, Step 7.

      *(Self-Correction during drafting)*: Make sure the "Stop Rules" are clear. If Step 1 fails (post-hoc), does it auto-strike? No, post-hoc reasoning is common in policy. It just downgrades the weight. I will make it a scoring factor, not an automatic kill, unless it's blatant rationalization. Actually, the prompt asks for "points where the sequence stops with a no." I should make the "Rhetorical" verdict a stop point.
      *Refinement:* If the mechanism cannot be stated (Step 2), STOP -> Rhetorical. If Selection Bias is glaring (Step 4), DOWNGRADE. If Reflexivity is high (Step 6), DOWNGRADE/Reframing.

      *Let's build the "Stop/No" points:*
      *   Step 2 (Mechanism): If no mechanism -> STOP (Rhetorical).
      *   Step 5 (Symmetry): If Counter-Analogy fits better -> STOP (Verdict: Reframing or Strike depending on gap).
      *   Actually, better to let it run to the end for scoring, but provide "Hard Stops" for fatal flaws.
      *   Fatal Flaw 1: No causal mechanism identified.
      *   Fatal Flaw 2: Conditions explicitly contradicted by open source data.

      *Okay, let's write.*

      *(Final thought on the "Honest Output"):* I need to be careful not to validate the user's bias. If the Vietnam analogy is historically shaky (selection bias), I must say so. If the Munich analogy is actually robust in a specific context, I must say so. The value of this tool is to challenge the *unit's* preferences too.

      *(Final thought on "One Page"):* I will provide the *template* for the one-page memo as part of the procedure.

      *(Final thought on "Judgment Calls"):* I need to explicitly list which steps are actually just disguised judgment (e.g., weighing the counter-analogy).

      *Let's assemble.*
answer: |-
  **TO:** Director, Policy-Planning Unit
  **FROM:** [Your Name/Analyst]
  **SUBJECT:** Analogy Stress-Test Protocol (ASTP) v1.0
  **EXECUTION TIME:** 45 Minutes
  **OUTPUT:** One-Page Memo (Template Attached)

  ### I. THE PROCEDURE

  **Step 1: Pre-Registration & Timing (5 mins)**
  *   **Question:** Was the policy recommendation drafted *before* the analogy was selected, or does the analogy appear to be the seed of the recommendation?
  *   **Check:** Compare draft timestamps or interview the proponent.
  *   **Stop Rule:** If the analogy was selected *after* the decision to justify it (post-hoc rationalization), mark **High Risk of Bias**. Do not stop, but cap maximum verdict at "Reframing."
  *   **Judgment Call:** Distinguishing "heuristic discovery" from "rationalization."

  **Step 2: Mechanism Extraction (10 mins)**
  *   **Question:** What is the specific causal engine claimed to operate in the source case? (Do not argue what *actually* happened; argue what the *proponent claims* happened).
  *   **Requirement:** The analyst must write one sentence: "In [Source Case], [Factor A] caused [Outcome B] via [Mechanism M]."
  *   **Stop Rule:** If the proponent cannot name Mechanism M (e.g., "It's just like Munich" without explaining *why* Munich failed), **VERDICT: RHETORICAL/STRIKE.** Stop.
  *   **Constraint Check:** This bypasses historical contestation by testing the internal logic of the claim, not the historical truth.

  **Step 3: Condition Matching (10 mins)**
  *   **Question:** Does Mechanism M require specific conditions to function? Are those conditions present in the Target Case?
  *   **Requirement:** List 3 necessary conditions for Mechanism M. Check open sources for their presence in the Target.
  *   **Stop Rule:** If 2 of 3 necessary conditions are demonstrably absent in open sources, **VERDICT: RHETORICAL/STRIKE.** Stop.
  *   **Example:** If Munich Mechanism = "Concessions signal weakness to domestic hardliners," Condition = "Aggressor has domestic hardliners who veto deals." If Aggressor is a unitary autocrat, condition fails.

  **Step 4: Selection Bias Audit (5 mins)**
  *   **Question:** Why this source case and not a similar one with a different outcome?
  *   **Requirement:** Identify one "Negative Case" (similar features, different outcome) that the proponent is ignoring.
  *   **Action:** If a plausible Negative Case exists (e.g., citing Vietnam but ignoring Korea; citing Munich but ignoring 1911 Agadir), downgrade confidence.
  *   **Judgment Call:** Determining "similarity" of the Negative Case.

  **Step 5: Symmetry Test (10 mins)**
  *   **Question:** What is the best-fitting analogy that supports the *opposite* policy? Run Steps 2 & 3 on it.
  *   **Requirement:** Identify Counter-Analogy, its Mechanism, and Condition Match.
  *   **Decision Rule:**
      *   If Original Analogy Mechanism > Counter Analogy Mechanism: Proceed to Step 6.
      *   If Counter Analogy Mechanism ≥ Original Analogy Mechanism: **VERDICT: REFRAMING DEVICE.** Stop. (Analogy generates questions, does not license prediction).
      *   If Counter Analogy Mechanism > Original Analogy Mechanism: **VERDICT: RHETORICAL/STRIKE.** Stop.

  **Step 6: Reflexivity Check (5 mins)**
  *   **Question:** Is the adversary (or domestic opponent) aware we use this analogy? Are they acting to trigger or avoid it?
  *   **Requirement:** Assess if the Target Situation is being staged to fit the analogy (e.g., provoking a "Munich" response to justify their own escalation).
  *   **Action:** If high reflexivity, downgrade from "Weight" to "Reframing."

  **Step 7: Risk & Irreversibility (5 mins)**
  *   **Question:** If the analogy is wrong, is the policy reversible? What is the cost of error?
  *   **Matrix:**
      *   High Irreversibility + High Cost of Error = Requires "Weight" Verdict (High Bar).
      *   Low Irreversibility + Low Cost of Error = "Reframing" Verdict acceptable.
  *   **Final Verdict Assignment:**
      1.  **WEIGHT/EVIDENCE:** Mechanism clear, conditions match, counter-analogy weaker, low reflexivity, risk acceptable. (Licenses prediction).
      2.  **REFRAMING:** Mechanism plausible but contested, counter-analogy equal, or high reflexivity. (Generates questions only).
      3.  **RHETORICAL/STRIKE:** No mechanism, conditions fail, or selection bias glaring. (Remove from paper).

  ---

  ### II. TEMPLATE: ONE-PAGE MEMO TO MINISTER

  **SUBJECT:** Analogy Assessment: [Name of Analogy] applied to [Target Situation]
  **VERDICT:** [WEIGHT / REFRAMING / STRIKE]

  **1. The Claim:** Proponents argue [Situation] is [Source Case], implying we should [Policy].
  **2. The Mechanism:** The claimed causal engine is: [One Sentence from Step 2].
  **3. Condition Check:**
     *   Required: [Condition 1] -> Present/Absent
     *   Required: [Condition 2] -> Present/Absent
     *   Required: [Condition 3] -> Present/Absent
  **4. Counter-Analogy:** The strongest opposing analogy is [Name]. It suggests [Opposite Policy]. Its mechanism fits [Better/Worse/Equal].
  **5. Reflexivity:** Adversary awareness of this analogy is [High/Low]. Risk of provocation is [High/Low].
  **6. Risk:** If this analogy is wrong, the cost is [Description]. The action is [Reversible/Irreversible].
  **7. Analyst Recommendation:** [Use as evidence / Use to generate questions / Remove].

  ---

  ### III. LIVE CASE RUNS (HONEST APPLICATION)

  **Case 1: Thucydides Trap (Hegemon vs. Rising Power) -> Taiwan**
  *   **Mechanism:** Structural stress makes war inevitable regardless of intent (Security Dilemma spiral).
  *   **Conditions:** 1) Rising power threatens hegemon's core alliance network. 2) No nuclear deterrent override. 3) Economic interdependence is low.
  *   **Match:** 1) Yes. 2) No (Nuclear weapons exist). 3) No (High interdependence).
  *   **Counter-Analogy:** 19th Century US/UK Power Transition (Peaceful). Mechanism: Economic integration + shared ideology overrides structural stress. Conditions match better on nuclear/eco variables.
  *   **Reflexivity:** High. Both Beijing and Washington explicitly debate the "Trap." Actions may be performative.
  *   **Risk:** War (Irreversible).
  *   **Verdict:** **REFRAMING DEVICE.**
  *   **Note:** The mechanism fails on nuclear/economic conditions. It is useful to ask "How do we manage structural stress?" but cannot license a prediction of war or peace.

  **Case 2: Munich (Appeasement) -> Neighbor Demanding Territory/Alliance Caps**
  *   **Mechanism:** Concessions signal weakness, emboldening an aggressor with unlimited aims.
  *   **Conditions:** 1) Aggressor is revisionist (wants system change, not just security). 2) Aggressor domestic politics reward aggression. 3) Concessions are not reciprocated.
  *   **Match:** 1) Unclear (Open source intel ambiguous on ultimate aims). 2) Yes. 3) Mixed.
  *   **Counter-Analogy:** 1911 Agadir Crisis (Compromise worked). Mechanism: Limited concessions satisfy security-seeking states.
  *   **Reflexivity:** Medium. Neighbor knows we fear Munich.
  *   **Risk:** War if wrong (High).
  *   **Verdict:** **WEIGHT/EVIDENCE (Conditional).**
  *   **Note:** If Condition 1 (Revisionism) is confirmed via intelligence, the mechanism holds strongly. This analogy scores higher than Thucydides because the causal mechanism (signaling theory) is more portable than structural determinism. *This challenges your unit's bias against Munich; structurally, it is the stronger fit if revisionism is proven.*

  **Case 3: Vietnam (Quagmire) -> Advisers + Air Support for Counterinsurgency**
  *   **Mechanism:** Incremental commitment creates sunk-cost fallacy + local government legitimacy deficit leads to escalation without victory.
  *   **Conditions:** 1) Local government lacks popular legitimacy. 2) Insurgency has external sanctuary. 3) Domestic public support is fragile.
  *   **Match:** 1) Yes. 2) Yes. 3) Yes.
  *   **Counter-Analogy:** Korea (1950-53) or Colombia (FARC). Mechanism: Limited aid + air power can stabilize frontlines or degrade capacity without ground troops.
  *   **Reflexivity:** Low. Insurgents don't care about our history lessons.
  *   **Risk:** Quagmire (High Cost, Reversible but painful).
  *   **Verdict:** **WEIGHT/EVIDENCE.**
  *   **Note:** The mechanism (sunk cost/legitimacy) fits the conditions well. *However*, Step 4 (Selection Bias) is critical here. We remember Vietnam; we forget successful limited interventions (El Salvador, Colombia). The procedure forces us to acknowledge the Counter-Analogy is plausible.
  *   **Honest Bias Check:** Your unit prefers this analogy. The procedure validates it *only if* the legitimacy deficit (Condition 1) is confirmed. If the local gov is popular, the analogy fails. Do not let the unit skip Condition 1.

  ---

  ### IV. LIMITATIONS & FAILURE MODES

  **1. Disguised Judgment Calls**
  *   **Step 5 (Symmetry):** Determining which analogy fits "better" is subjective. Two analysts can run this protocol and get different verdicts based on how they weigh the Counter-Analogy. This is irreducible; the procedure forces the disagreement into the open but cannot solve it.
  *   **Step 3 (Conditions):** Deciding if a condition is "Present" or "Absent" often relies on ambiguous intelligence. This is where politics enters.

  **2. Where It Will Misfire**
  *   **Black Swans:** The procedure tests *portability* of known mechanisms. It cannot predict novel mechanisms (e.g., cyber warfare changing the "1914" mobilization dynamic).
  *   **Moral Equivalence:** The procedure is amoral. A "Munich" analogy might be mechanically sound but morally repugnant (e.g., sacrificing a small state). The checklist validates the *forecast*, not the *ethics*.
  *   **Time Pressure:** In a true crisis (45 mins is too long), analysts will skip Step 5 (Symmetry). This reverts the tool to confirmation bias.

  **3. What It Cannot Do**
  *   It cannot tell you what *actually* happened in history (Constraint 1).
  *   It cannot resolve disputes where the mechanism is unobservable (e.g., "Leader's internal psychology").
  *   It cannot prevent a Minister from ignoring the verdict. It only ensures the advice is structured.

  **4. The "Restraint" Bias Warning**
  *   Your unit favors Vietnam/1914 (Restraint) over Munich (Action).
  *   **Risk:** You may unconsciously rate the "Conditions" of the Vietnam analogy as met while rating the Munich conditions as unmet.
  *   **Mitigation:** Step 5 (Symmetry) is your safeguard. You *must* write down the Counter-Analogy. If the Munich mechanism fits the facts better than the Vietnam mechanism, the protocol demands you admit it, even if it recommends a policy you dislike. If you cannot do this, the procedure is useless to you.
