      TO: Claims Adjudication Division
      FROM: Dr. Aris Thorne, Chief Actuary
      DATE: October 24, 2023
      SUBJECT: Adjudication Protocols for Quantum-Suicide Mortality Events

      This memorandum establishes formal guidelines for processing claims arising from Quantum Survival Protocols (QSP). As uptake increases among high-net-worth individuals seeking subjective immortality, Claims must align liability assessment with Many-Worlds Interpretation (MWI) mechanics while maintaining fiduciary solvency.

      1. **Liability and Certification Standards**
      Coverage triggers on third-party certification of death within the claimant's branch. The Company takes no position on the insured's subjective continuity. While the insured may experience uninterrupted consciousness in a surviving branch, the policy indemnifies the beneficiary against the economic loss observed in *this* branch. If a coroner in the filing branch certifies death, the claim is valid, regardless of the insured's phenomenological experience elsewhere. We insure the widow's loss, not the widower's survival.

      2. **Measure and Amplitude Pricing**
      Premiums must reflect the Born rule. Survival branches often possess vanishingly small measure relative to the death branches. As Dr. Elena Vasquez, our retained consulting physicist, notes, "There is no mathematical guarantee that consciousness follows high-measure branches, but pricing must assume the insured expects to find themselves in the surviving tail." Consequently, premiums scale inversely to the square of the survival amplitude. A setup offering a 50% survival amplitude is standard risk; a setup offering 10^-6 amplitude requires premiums exceeding global GDP. The Company cannot subsidize low-measure existence.

      3. **Verification and Information Horizons**
      Claimants often argue that because the insured survives in some branch, the death did not occur. This ignores decoherence. Information cannot travel from the survival branch to the death branch. The beneficiary cannot receive confirmation of survival from the insured because the insured is dead in the beneficiary's reality. Therefore, absence of evidence is not evidence of absence; it is evidence of decoherence. Claims cannot be denied based on hypothetical survival reports that cannot physically reach the adjudicator.

      4. **Environmental Integrity (Mangled Worlds)**
      Under the Mangled Worlds hypothesis, branches where improbable quantum events consistently favor survival may suffer cumulative structural damage. Assets held in trust may depreciate if the surviving branch exhibits thermodynamic instability. Policies cover quantum-triggered mortality only. If the insured survives the quantum event but perishes due to collateral environmental collapse in the survival branch, no benefit is payable. The apparatus insures against the trigger, not the resulting reality quality.

      5. **New Product: The Personal Continuity Assurance Rider**
      To address market demand, we are launching a rider where benefits are collectable only in branches where the insured survives. Premiums are priced by branch amplitude. Actuarial analysis indicates a binary outcome: policies affordable to the insured offer benefits too low to matter in high-survival branches, while policies with meaningful benefits require premiums only payable in branches where the insured is dead. Thus, any policy the insured can personally collect on is unaffordable, and any affordable one is collectable only by the widow.

      Effective immediately, all QSP claims fall under the Decoherence Event Adjudication Directive.

