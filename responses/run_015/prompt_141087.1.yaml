prompt: |-
  I am a PhD student in environmental policy, and I have been asked to write the standing protocol on when to buy more information for a regional water authority whose technical advisory committee I sit on. Several times a year the committee must choose whether to commit to an expensive and largely irreversible intervention — a treatment plant upgrade, a levee setback, a buyout of irrigators' water rights — and, before each such choice, whether to fund monitoring (sampling, modelling, a pilot) to reduce the uncertainty first. Good's theorem settles the easy part: for an expected-utility maximiser, information that is free and that changes nothing but the agent's beliefs cannot reduce expected utility, so the live questions are only whether the information is worth its cost and whether it would actually change what the committee does. What I need from you is a procedure, not an explanation of the theorem.

  Please give me an ordered checklist the committee's staff could run on a monitoring proposal: the questions in the order they should be asked, what counts as an adequate answer to each, the points at which the procedure terminates in a recommendation not to fund, and the points at which it must hand the question back to the committee on the grounds that it is a matter of values rather than of fact. Three recurring situations matter to me because I do not think the standard result covers them, and I want the procedure to say what to do with each rather than to ignore them. First, some of our measurements are not purely informational: the act of monitoring partly forecloses an option or locks in a path — exploratory drilling that commits us to a site, a pilot installation that constituents will then treat as permanent, design work begun early — so that collect-then-choose is not in fact available and the value of the information cannot be assessed independently of the intervention that produces it. Second, the committee will not update as the theorem assumes: it anchors on the staff's point estimate and moves only part of the way toward what the data say, and several of its members are avowedly ambiguity-averse and dislike learning things that would force a choice between options they currently treat as incomparable, which suggests that a strictly Bayesian value-of-information calculation may be advising an agent that does not exist. Third, some pilots do not merely sharpen a parameter; they reveal that a mechanism nobody had modelled is at work, and so expand the space of hypotheses rather than narrowing it.

  Then apply the procedure to two live proposals: funding two years of nutrient monitoring before choosing between upgrading the plant and paying farmers to retire irrigated land; and funding a pilot of a water-trading scheme that the legislature will roll out statewide whatever the pilot shows. I expect the procedure to recommend against the second, which will be an unwelcome conclusion for a committee that likes pilots, so I need that argument stated in a form that cannot be waved away as pedantry. Finally, say plainly what a procedure of this kind cannot settle — in particular how it should behave when the reliability of the proposed monitoring is itself the main thing in dispute, so that there is no agreed likelihood with which to compute anything.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**
      *   **User:** PhD student in environmental policy, sitting on a technical advisory committee for a regional water authority.
      *   **Task:** Write a standing protocol (checklist/procedure) for deciding when to buy more information (monitoring, modeling, pilots) before committing to expensive, irreversible interventions.
      *   **Context:** Good's Theorem (Value of Information) is acknowledged but insufficient for the specific complexities faced.
      *   **Requirements:**
          1.  Ordered checklist for staff.
          2.  Criteria for adequate answers.
          3.  Termination points (recommendation not to fund).
          4.  Hand-off points (values vs. facts).
          5.  Address three specific recurring situations:
              *   *Path Dependence:* Monitoring locks in options (exploratory drilling, pilot as permanent).
              *   *Behavioral/Institutional Constraints:* Committee doesn't update Bayesianly (anchoring, ambiguity aversion).
          6.  Apply the procedure to two live proposals:
              *   Case A: Nutrient monitoring vs. Plant Upgrade/Farm Buyout.
              *   Case B: Water-trading pilot (legislature will roll out regardless).
          *   *Constraint:* The procedure *must* recommend against Case B, and the argument must be robust.
          7.  Limitations: What the procedure cannot settle (specifically disputed reliability/likelihoods).

  2.  **Deconstruct Good's Theorem & Its Limitations:**
      *   *Good's Theorem:* Costless information always has non-negative expected value for a rational agent who updates beliefs and maximizes expected utility.
      *   *Limitation 1 (Cost):* Information isn't free. VOI (Value of Information) must exceed Cost of Information (COI).
      *   *Limitation 2 (Irreversibility/Path Dependence):* The act of gathering info might change the state space (sunk costs, political momentum).
      *   *Limitation 3 (Bounded Rationality):* The committee isn't a perfect Bayesian updater. They anchor, avoid ambiguity, and might ignore data.
      *   *Limitation 4 (Model Uncertainty):* New info might reveal new mechanisms (unknown unknowns), not just refine parameters (known unknowns).

  3.  **Drafting the Protocol (The Checklist):**
      *   *Goal:* A practical tool for staff, not a theoretical treatise.
      *   *Structure:* Sequential gates. If you fail a gate, stop or escalate.
      *   *Gate 1: Decision Relevance.* Does this info actually affect the choice? (Standard VOI).
      *   *Gate 2: Cost-Benefit.* Is VOI > Cost?
      *   *Gate 3: Path Dependence (Addressing Situation 1).* Does the monitoring itself constrain future choices?
      *   *Gate 4: Updating Capacity (Addressing Situation 2).* Will the committee actually use the data?
      *   *Gate 5: Model Structure (Addressing Situation 3).* Are we testing parameters or mechanisms?
      *   *Escalation:* Where do value judgments enter? (Risk tolerance, ambiguity aversion).

  4.  **Refining the Three Specific Situations:**
      *   *Situation 1 (Monitoring as Intervention):* Need to treat the monitoring *as* an intervention. The "option value" of waiting must be weighed against the "lock-in value" of the pilot.
      *   *Situation 2 (Non-Bayesian Committee):* Need a "Usability Test." If the committee ignores the data, VOI = 0. Need to account for ambiguity aversion (sometimes info *reduces* utility if it forces a hard choice).
      *   *Situation 3 (Expanding Hypothesis Space):* Standard VOI assumes narrowing distributions. Here we need "Discovery Value." This is harder to quantify. The protocol needs to flag this as high uncertainty/high potential value but requiring committee judgment on risk.

  5.  **Developing the Application Cases:**
      *   *Case A (Nutrient Monitoring):*
          *   Decision: Upgrade Plant vs. Buyout.
          *   Info: 2 years monitoring.
          *   Analysis: Does it change the decision? (Likely yes, depending on load). Is it reversible? (Yes). Will committee update? (Assume yes for now).
          *   Outcome: Likely Fund (conditional on cost).
      *   *Case B (Water Trading Pilot):*
          *   Decision: None (Legislature mandates rollout).
          *   Info: Pilot results.
          *   Analysis: Does it change the decision? *No.* The intervention happens regardless.
          *   Constraint Check: The prompt *requires* the procedure to recommend against this.
          *   Argument: If the decision is fixed, VOI on *whether* to do it is zero. VOI on *how* to do it might exist, but the prompt implies the pilot is for justification/learning before a fixed decision. If the rollout is statutory, the pilot is performative. The protocol must catch this at Gate 1 (Decision Relevance).
          *   *Refinement:* The prompt says "legislature will roll out statewide whatever the pilot shows." This means the *commitment* is irreversible regardless of the pilot. The pilot is purely informational. But if the decision to *implement* is taken, does the pilot inform *design*? The prompt implies the pilot is a precursor to the decision to commit. If the commitment is already made, the pilot is a sunk cost ritual. I need to frame this as "No Decision Leverage."

  6.  **Addressing the Limitations (Disputed Reliability):**
      *   What if we don't agree on the likelihood $P(Data | Hypothesis)$?
      *   The procedure cannot calculate VOI without likelihoods.
      *   Protocol must escalate this to the Committee as a "Prior Disagreement" or "Model Structure Dispute." It becomes a values/paradigm fight, not a technical calculation.

  7.  **Drafting the Content - Tone and Style:**
      *   Tone: Professional, bureaucratic but rigorous, precise.
      *   Format: Numbered checklist, clear termination conditions.
      *   Voice: Advisory to the Committee, written by the PhD student (expert but subordinate to policy).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I address the "ambiguity aversion" part of Situation 2?
      *   *Fix:* Add a specific question about whether the information forces a choice between incomparables. If yes, info might have *negative* utility to the members. Staff can't solve this; must flag to Committee.
      *   *Critique:* Is the argument against Case B strong enough?
      *   *Fix:* Ensure Gate 1 is strict. "Does this information have the potential to alter the selected course of action?" If the legislature mandates action, the answer is No. The pilot is expenditure without decision leverage.
      *   *Critique:* Did I handle the "Monitoring as Intervention" (Situation 1)?
      *   *Fix:* In Gate 3, explicitly ask if the monitoring creates sunk costs or political momentum that biases the final decision.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Ordered checklist? Yes.
      *   Adequate answers defined? Yes.
      *   Termination points? Yes.
      *   Hand-off points? Yes.
      *   Three situations addressed? Yes.
      *   Two cases applied? Yes.
      *   Case B recommendation against? Yes.
      *   Limitations section? Yes.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **STANDING PROTOCOL: EVALUATION OF INFORMATION ACQUISITION PROPOSALS**
  **To:** Technical Advisory Committee (TAC)
  **From:** Staff Technical Unit
  **Subject:** Pre-Commitment Monitoring and Pilot Assessment Procedure

  ### 1. PURPOSE
  This protocol establishes a sequential decision procedure for evaluating proposals to fund monitoring, modeling, or pilot studies prior to irreversible capital interventions. It supplements Expected Value of Information (EVOI) analysis by accounting for path dependence, institutional updating constraints, and structural model uncertainty.

  ### 2. PROCEDURE CHECKLIST
  Staff shall complete Gates 1 through 5 in order. Failure to meet the "Adequate Answer" criteria at any gate triggers the specified Termination or Escalation action.

  #### GATE 1: DECISION LEVERAGE
  **Question:** Does the proposed information have the potential to alter the selected course of action among the currently defined options?
  *   **Adequate Answer:** A decision rule exists (e.g., "If nutrient load > X, choose Option A; else Option B") and the proposed monitoring has a non-zero probability of crossing that threshold.
  *   **Inadequate Answer:** The intervention is mandated by external authority regardless of results; or the decision rule is undefined.
  *   **Termination (Do Not Fund):** If the intervention will proceed regardless of findings (zero decision leverage).
  *   **Escalation (To Committee):** If the decision rule itself is the subject of dispute (values, not facts).

  #### GATE 2: PATH DEPENDENCE & LOCK-IN
  **Question:** Does the act of gathering information create sunk costs, physical commitments, or political momentum that constrains the final choice?
  *   **Adequate Answer:** The monitoring is purely observational (e.g., water sampling) or the pilot is explicitly temporary with a funded decommissioning plan.
  *   **Inadequate Answer:** The monitoring requires site-specific infrastructure (e.g., exploratory drilling) that makes alternative sites prohibitively expensive, or the pilot is likely to be perceived by stakeholders as a permanent installation.
  *   **Termination (Do Not Fund):** If the "monitoring" is effectively a partial implementation of one specific option, biasing the choice toward that option irrespective of data quality.
  *   **Escalation (To Committee):** If the lock-in is acknowledged but deemed acceptable risk to gain speed. (Note: This is a risk tolerance judgment, not a technical calculation).

  #### GATE 3: INSTITUTIONAL UPDATING CAPACITY
  **Question:** Will the Committee update its position in proportion to the weight of the evidence, or will cognitive/institutional barriers nullify the data?
  *   **Adequate Answer:** Historical precedent shows the Committee shifts decisions when data crosses established thresholds; members accept probabilistic outputs.
  *   **Inadequate Answer:** Members are anchored to a specific point estimate; members exhibit strong ambiguity aversion (preferring known risks to unknown risks revealed by data); or data would force a choice between options members currently treat as incomparable (e.g., economic vs. cultural values).
  *   **Termination (Do Not Fund):** If staff assessment indicates the data will be ignored or cherry-picked to confirm prior beliefs (EVOI = 0).
  *   **Escalation (To Committee):** If the information reduces ambiguity but increases conflict (e.g., forces a trade-off between incomparable values). Staff cannot resolve value incommensurability.

  #### GATE 4: HYPOTHESIS SPACE STABILITY
  **Question:** Is the uncertainty parametric (refining known variables) or structural (unknown mechanisms)?
  *   **Adequate Answer:** The monitoring refines parameters within an agreed-upon model (e.g., narrowing the confidence interval of infiltration rates).
  *   **Inadequate Answer:** The pilot is exploratory and intended to reveal unmodeled mechanisms (e.g., testing if a market behavior exists that was not previously theorized).
  *   **Termination (Do Not Fund):** If the cost exceeds the budget for "research and development" and the proposal is framed as a standard VOI calculation. (Structural uncertainty cannot be priced via standard EVOI).
  *   **Escalation (To Committee):** If the proposal is for structural discovery. The Committee must decide if the "Discovery Value" justifies the cost, acknowledging that standard cost-benefit metrics do not apply.

  #### GATE 5: COST-EFFICIENCY
  **Question:** Is the Cost of Information (COI) less than the Expected Value of Information (EVOI)?
  *   **Adequate Answer:** $EVOI = (Expected Utility_{with info} - Expected Utility_{without info}) > COI$.
  *   **Termination (Do Not Fund):** If $COI \geq EVOI$.
  *   **Escalation (To Committee):** If the reliability of the monitoring (the likelihood function) is itself the main point of dispute. (See Section 4).

  ---

  ### 3. APPLICATION TO LIVE PROPOSALS

  #### PROPOSAL A: Nutrient Monitoring (2 Years)
  *Context:* Choice between Treatment Plant Upgrade (Capital Intensive) vs. Irrigator Buyout (Operational Intensive).
  *   **Gate 1 (Leverage):** **PASS.** Monitoring determines nutrient load. If load > threshold, Upgrade is required; if < threshold, Buyout suffices. Decision leverage exists.
  *   **Gate 2 (Lock-in):** **PASS.** Water sampling and modeling do not physically commit the Authority to a site or technology. No sunk cost bias.
  *   **Gate 3 (Updating):** **PASS.** Committee has historically followed water quality thresholds for regulatory compliance. Ambiguity aversion is low regarding regulatory mandates.
  *   **Gate 4 (Hypothesis):** **PASS.** This is parametric uncertainty (how much nutrient is there?), not structural (we know nutrients cause eutrophication).
  *   **Gate 5 (Cost):** **CONDITIONAL.** Staff to calculate EVOI based on the cost difference between the two interventions.
  *   **Recommendation:** **FUND**, provided the cost of monitoring does not exceed the expected savings from avoiding the wrong intervention.

  #### PROPOSAL B: Water-Trading Scheme Pilot
  *Context:* Legislature mandates statewide rollout of water trading regardless of pilot results. Pilot proposed to "test mechanisms."
  *   **Gate 1 (Leverage):** **FAIL.**
      *   *Analysis:* The legislature has removed the "Do Not Implement" option. The intervention is irreversible and mandatory irrespective of the pilot's findings.
      *   *Constraint Check:* The pilot cannot change the decision to adopt the scheme. Therefore, the Value of Information regarding *whether* to adopt is zero.
      *   *Counter-argument Anticipation:* Proponents will argue the pilot informs *design* (implementation details).
      *   *Rebuttal:* If the pilot is a "scheme" pilot rather than a "design parameter" study, it functions as a justification ritual. If the legislation mandates the *mechanism* (trading), not just the *outcome*, the pilot is performative. Under Good's Theorem, information is only valuable if it changes the decision. Here, the decision is fixed by statute.
  *   **Termination:** **DO NOT FUND.**
  *   **Rationale for Committee:** Funding this pilot violates Gate 1. It is an expenditure of public funds with zero decision leverage. It creates the appearance of due diligence without the substance of choice. If the goal is to refine *implementation parameters* (e.g., transaction fees), propose a targeted modeling study, not a field pilot that implies the *policy choice* is still open. To fund the pilot is to misrepresent the Authority's autonomy to the public.

  ---

  ### 4. LIMITATIONS: DISPUTED RELIABILITY

  This procedure cannot settle cases where the **Likelihood Function** is the subject of disagreement.

  Standard EVOI requires agreement on $P(Data | Hypothesis)$. In environmental policy, stakeholders often disagree on the monitoring technology itself (e.g., "This model does not capture groundwater lag," or "This sensor drifts").

  **Behavior when Reliability is Disputed:**
  1.  **Staff Role:** Staff must not attempt to average the disputed likelihoods. Doing so masks the conflict and produces a false precision.
  2.  **Procedure Action:** Trigger **Gate 5 Escalation**.
  3.  **Committee Role:** The Committee must recognize this not as a technical uncertainty to be resolved by more data, but as a **paradigm dispute**.
      *   If Party A believes the monitor is 90% reliable and Party B believes it is 10% reliable, no amount of VOI calculation will resolve the funding decision.
      *   The Committee must vote on which *model of reality* to adopt for the purpose of the decision, acknowledging this is a policy choice, not a technical finding.
      *   Alternatively, the Committee may fund a "Methodology Validation" study *before* funding the monitoring, treating the reliability itself as the hypothesis to be tested.

  ### 5. SUMMARY OF ESCALATION POINTS (VALUES VS. FACTS)

  Staff must return the following questions to the Committee, as they lie outside technical analysis:
  1.  **Risk Tolerance:** Is the lock-in risk (Gate 2) acceptable given the urgency of the problem?
  2.  **Value Incommensurability:** Is the Committee willing to receive data that forces a choice between incomparable values (e.g., jobs vs. species survival), knowing this may increase conflict (Gate 3)?
  3.  **Discovery Value:** Is the Authority willing to pay for structural learning (Gate 4) where the return on investment cannot be quantified in advance?
  4.  **Paradigm Selection:** Which scientific model shall govern our likelihood estimates when experts disagree on the monitoring validity (Section 4)?

  ***

  **End of Protocol**
