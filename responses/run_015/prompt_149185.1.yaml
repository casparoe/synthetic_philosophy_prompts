answer: |-
  **Brainstormed Job Duties (Foucauldian Logic)**

  1.  **Implement Voluntary Visibility Protocols:** Design systems where employees willingly submit to constant biometric logging, ensuring the surveillance gaze is internalized rather than imposed from above.
  2.  **Manage Normative Deviation Indexing (NDI):** Calculate statistical averages for sleep, mood, and output to identify outliers, framing deviation from the mean as a wellness risk requiring correction.
  3.  **Facilitate Corrective Care Sessions:** Conduct one-on-one interventions that reinterpret physical fatigue or resistance not as structural overwork, but as a personal failure of optimization requiring deeper discipline.

  ***

  **Job Posting: Panopticon Wellness Coach**

  **Company:** BioPower Inc.
  **Location:** Remote (Visibility Required)
  **Type:** Full-Time (Always On)

  At BioPower Inc., we believe that true wellness is achieved through total transparency. We are not just a workplace; we are a community of visible bodies working toward singular efficiency. We are seeking a compassionate Panopticon Wellness Coach to join our Human Optimization team. In this role, you will not manage people; you will nurture data. You will help our talent realize that being watched is the highest form of care.

  **The Role**

  As a Panopticon Wellness Coach, you will bridge the gap between biological reality and corporate expectation. Your primary goal is to foster an environment where every team member feels safely observed at all times. You will champion the idea that privacy is isolation, and isolation is unhealthy. By encouraging continuous self-reporting, you will help employees become their own overseers, ensuring that discipline comes from within rather than from management.

  **Key Responsibilities**

  *   **Deploy Voluntary Visibility Protocols:** Guide teams in adopting real-time biometric logging tools. You will normalize the sharing of heart rate, stress levels, and location data as a testament to trust and collective health.
  *   **Monitor Normative Deviation Indexing (NDI):** Utilize our proprietary NDI metric to identify employees whose physiological outputs diverge from the productivity baseline. You will interpret these deviations not as systemic issues, but as opportunities for personalized corrective nurturing.
  *   **Reframe Resistance as Optimization:** Conduct weekly alignment sessions where fatigue or burnout is gently recategorized as a mindset error. You will teach staff that their bodies are instruments of production that must be tuned, not rested.

  **Qualifications**

  *   Experience in behavioral modification, health analytics, or surveillance logistics.
  *   A deep belief that knowledge about an individual is the ultimate form of love.
  *   Ability to speak softly while delivering mandatory directives.
  *   Comfort with ambiguity, provided the ambiguity is monitored.

  **Why BioPower?**

  We offer a competitive salary and the peace of mind that comes with knowing you are never alone. Your growth is our data, and your data is our promise.

  **To Apply**

  Submit your resume, biometric history, and a brief essay on why you deserve to be seen. BioPower Inc. is an equal opportunity employer committed to producing docile, happy, and high-performing bodies.
