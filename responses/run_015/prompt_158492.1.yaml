answer: |-
  ### Brainstorm: Points of Objection and Qualification

  *   "Completely different theories" ignores the Stalnakerian unified semantics.
  *   "Indicative... no truth conditions at all" is the Adams/Edgington view, not consensus (Stalnaker, Bennett, Kratzer disagree).
  *   "Lewis's triviality result... beyond dispute" misstates the result; it constrains the relation between truth and probability, it doesn't eliminate truth conditions.
  *   "Cannot be embedded" is the "Embedding Problem," but denying that natural language embeds them is empirically false; theories must explain the embedding, not deny it.
  *   "Possible-worlds semantics simply does not apply to them" is false; Stalnaker applies it to indicatives.
  *   "Counterfactuals... antecedent is by definition false" is false; "open counterfactuals" exist (future-less-vivid, detective cases).
  *   "Adding detail to the antecedent can never overturn a true counterfactual" is logically false; it violates non-monotonicity (Sobel sequences).
  *   "Context-sensitivity... just context settling which respects of similarity" oversimplifies the context-dependence of the selection function.
  *   "Indicative = epistemically open, Counterfactual = settled false" is a useful heuristic but fails on "past indicatives" (known false) and "future counterfactuals" (open).
  *   "Poker-game standoff cases... refute outright" is too strong; Gibbard's case is contested (Stalnaker has a pragmatic response).
  *   "No such thing as the probability that a counterfactual is true" contradicts Lewis's own "Imaging" and modern causal modeling (Pearl/Halpern).
  *   "Retrospective claims... not assessable claims at all" is dangerous for a cognitive science paper; causal inference relies on exactly this.
  *   The move from Adams's Thesis to "no truth conditions" is a non-sequitur; one can reject Adams's Thesis and keep truth conditions.
  *   The distinction between conditionalization and imaging is elided, which is crucial for the probability question.

  ---

  ### 1. Conceptual Audit of the Passage

  Here I work through the claims in the order they appear, sorting them into **Acceptable**, **Fair Simplification**, and **Misleading/Wrong**.

  **Claim:** "There are two kinds of conditional, and they are governed by completely different theories."
  **Verdict:** **Misleading.**
  **Analysis:** While indicative and counterfactual conditionals often require different *constraints* in semantic models, claiming they are governed by "completely different theories" suggests no unified framework exists. This ignores Robert Stalnaker's seminal work, which provides a single possible-worlds semantics for both, differing only in which worlds are considered accessible. Even David Lewis, who treated them more distinctly, used selection functions for both. The field is not split into two silos; it is a debate over whether one unified semantics can capture the nuances of both.

  **Claim:** "Take indicatives first... An indicative conditional has no truth conditions at all."
  **Verdict:** **Misleading/Wrong.**
  **Analysis:** This presents the "Probabilistic" or "Suppositional" view (Adams, Edgington) as fact. However, the "Truth-Conditional" view (Stalnaker, Bennett, Kratzer) remains a dominant, live research program. To state indicatives *have no* truth conditions is to take a side in a foundational debate, not to report a settled result.

  **Claim:** "What Adams showed — and what Lewis's triviality result later established beyond dispute — is that the only thing to say about an indicative conditional is... the conditional probability P(B|A)."
  **Verdict:** **Misleading.**
  **Analysis:** This conflates two things. Adams's Thesis is the claim that the *assertibility* (or probability) of the conditional equals the conditional probability. Lewis's Triviality Results show that you cannot have *both* truth conditions *and* Adams's Thesis (under standard assumptions). The text implies Lewis proved indicatives have no truth conditions. He did not. He proved that if they have truth conditions, their probability cannot be the conditional probability. One can escape triviality by rejecting Adams's Thesis (keeping truth conditions) rather than rejecting truth conditions (keeping Adams's Thesis).

  **Claim:** "It follows that indicatives are not the sort of thing that can be true or false, and that is why they cannot be embedded inside other operators..."
  **Verdict:** **Misleading/Wrong.**
  **Analysis:** The "Embedding Problem" is a genuine technical challenge for probabilistic accounts. However, saying they "cannot be embedded" is empirically false; speakers do embed them ("If if A then B, then C"). A theory that says this is impossible is defective, not the data. Truth-conditional theories handle embedding naturally; probabilistic theories struggle but attempt to solve it (e.g., via dynamic semantics).

  **Claim:** "Possible-worlds semantics simply does not apply to them."
  **Verdict:** **Wrong.**
  **Analysis:** Stalnaker's semantics is a possible-worlds semantics applied directly to indicatives. It treats the indicative as selecting the closest world where the antecedent is true, constrained by the speaker's knowledge state.

  **Claim:** "Counterfactuals are different in kind... Here the antecedent is by definition false..."
  **Verdict:** **Wrong.**
  **Analysis:** This is a common grammatical misconception. The subjunctive mood (used in counterfactuals) does not entail the falsity of the antecedent. "Open counterfactuals" are standard examples (e.g., "If I were to drop this glass in five seconds, it would break," said before dropping it). The antecedent is epistemically open, yet the counterfactual mood is appropriate.

  **Claim:** "Instead, counterfactuals are evaluated by similarity between possible worlds... Lewis's account is the standard one."
  **Verdict:** **Fair Simplification.**
  **Analysis:** This captures the core intuition of the Stalnaker-Lewis tradition. While "similarity" is often formalized as a "selection function" or "ordering source" to avoid vagueness, describing it as similarity is acceptable for a general background.

  **Claim:** "Because the similarity ordering is fixed... adding further detail to the antecedent can never overturn a true counterfactual..."
  **Verdict:** **Wrong (Fatal Error).**
  **Analysis:** This denies the non-monotonicity of counterfactuals. In standard logic, if $A$ implies $C$, then $A \land D$ implies $C$. Counterfactuals do not work this way. If "If I struck the match, it would light" is true, "If I struck the match and soaked it in water, it would light" is false. The text argues that the "closest antecedent-worlds" remain the same, but adding detail changes the antecedent, which changes the set of closest worlds. The closest $A$-worlds are not necessarily the closest $(A \land D)$-worlds. This is a logical error in the passage.

  **Claim:** "The context-sensitivity that people notice in counterfactuals is just context settling which respects of similarity we are scoring."
  **Verdict:** **Fair Simplification.**
  **Analysis:** This is a reasonable gloss on how context affects the "similarity ordering" or "salience of weights" in Lewis's system.

  **Claim:** "So the difference between the two kinds reduces to this: the antecedent of an indicative is epistemically open for the speaker, while the antecedent of a counterfactual is settled false."
  **Verdict:** **Fair Simplification (with caveats).**
  **Analysis:** This is the standard "Presupposition of Falsity" view, but as noted above, it fails for open counterfactuals and past indicatives where the speaker knows the antecedent is false (e.g., "If Oswald didn't kill Kennedy, someone else did," said after knowing Oswald did). It works for standard cases but is not a definition.

  **Claim:** "Finally, the well-known poker-game standoff cases... refute outright the idea that indicatives have truth conditions..."
  **Verdict:** **Misleading.**
  **Analysis:** This refers to Gibbard's Case. It is a powerful argument for the probabilistic view, but it is not an "outright refutation." Stalnaker and others have offered pragmatic explanations for why the conditionals seem compatible without lacking truth conditions. It is a major piece of evidence, not a proof.

  **Claim:** "There is no such thing as the probability that a counterfactual is true... retrospective claims... are not assessable claims at all, only rhetoric..."
  **Verdict:** **Wrong.**
  **Analysis:** This conclusion is incompatible with modern causal inference and formal epistemology. We routinely assign probabilities to counterfactuals (e.g., in medicine or law). Lewis himself developed "Imaging" to assign probabilities to counterfactuals. Causal models (Pearl) calculate them explicitly. To call them "rhetoric" is to deny the validity of causal reasoning.

  ---

  ### 2. Specific Questions on Theory and Cases

  **Is it right that the two kinds are governed by completely different theories?**
  No. It is more accurate to say there are two competing *families* of theory. One family (Stalnaker, Kratzer) attempts a unified possible-worlds semantics for both, adjusting constraints on the selection function. The other family (Adams, Edgington) treats indicatives probabilistically and counterfactuals via possible worlds (or causal models). The passage presents the split as a settled fact, whereas it is a live theoretical disagreement. A unified theory is often preferred for parsimony, provided it can handle the distinct logical behaviors (e.g., strengthening the antecedent fails for counterfactuals but is debatable for indicatives).

  **Is the "epistemically open vs. settled false" gloss defensible?**
  It is defensible as a rule of thumb for *standard* usage, but it fails as a semantic definition. You asked to test it against two cases:

  1.  **The Detective Case (Open Counterfactual):** A detective says, "If the suspect had been at the bar, the camera would have caught him." The detective does not know if the suspect was at the bar. The antecedent is not settled false. The counterfactual mood is used because the detective is considering a hypothetical scenario distinct from their current knowledge state, not because they know it didn't happen. The passage's claim that counterfactual antecedents are "by definition false" cannot handle this. The machinery *can* handle it (by selecting closest worlds where he is at the bar), but the *description* in the passage is wrong.
  2.  **The Match Case (Sobel Sequences):** "If the match had been struck, it would have lit" vs. "If the match had been struck after soaking in water, it would not have lit." The passage claims adding detail cannot overturn a true counterfactual. This case shows it does. The passage's machinery fails here because it assumes the set of "closest worlds" is fixed by the first antecedent. In reality, the similarity ordering shifts or the set of closest worlds is re-evaluated for the more specific antecedent. The closest worlds where the match is struck *and* wet are not the same as the closest worlds where the match is struck (simpliciter). The passage's claim here is logically incoherent with standard counterfactual logic.

  ---

  ### 3. Probability of Counterfactuals and Causal Models

  **Does the book's conclusion follow?**
  No. The conclusion that "there is no such thing as the probability that a counterfactual is true" does not follow from the accurate parts of the summary.

  **Is your friend describing something real?**
  Yes. Your friend is referring to two robust frameworks:
  1.  **Lewisian Imaging:** Lewis later proposed that to find the probability of a counterfactual, you do not conditionalize (which deletes ~A worlds and renormalizes). Instead, you "image" on A: you take the probability mass from each ~A world and shift it to the closest A-world. This allows you to calculate $P(A > B)$.
  2.  **Structural Causal Models (SCM):** In the tradition of Pearl and Halpern, counterfactuals are computed by intervening on a structural equation model (setting $A = true$) and propagating the effects. This yields a definite probability for the consequent.

  **Is it compatible with the passage?**
  It is compatible with the part of the passage that says counterfactuals rely on "closest worlds" (Imaging uses the same selection function). It is *incompatible* with the claim that the "probabilistic apparatus drops out" for counterfactuals. The apparatus changes from Conditionalization to Imaging (or Intervention), but it does not disappear.

  **Does it give the lie to the book's conclusion?**
  Yes. If causal models and imaging allow us to calculate the probability of a counterfactual, then retrospective claims in accident reports ("If we had braked sooner, the collision probably would have been avoided") are assessable, quantitative claims, not mere rhetoric. The book's conclusion is scientifically obsolete.

  ---

  ### 4. Lewis/Stalnaker Unified Semantics vs. The Split

  **Which picture is closer to the truth?**
  Your prior is correct: Lewis and Stalnaker both developed possible-worlds semantics intended to cover conditionals broadly.
  *   **Stalnaker** explicitly aimed for a unified theory. He argued that the difference between indicative and counterfactual is not a difference in the semantic connective, but in the *pragmatic context* (specifically, which worlds are considered "live options").
  *   **Lewis** was more inclined to treat them differently (e.g., he rejected the "Uniqueness Assumption" for counterfactuals but accepted it for indicatives), but he still used the same basic machinery (selection functions/orderings).

  **Did the unified program collapse?**
  No. The unified program is still very much alive. While Adams's probabilistic approach gained traction (especially in formal epistemology), the truth-conditional possible-worlds approach (Stalnaker/Kratzer) remains the dominant framework in formal semantics and linguistics. The book is reporting a specific philosophical dogma (Adams/Edgington/Lewis-Triviality) as if it were the historical outcome of the field. It is not; it is one side of an ongoing debate. The contrast in the book is a distortion of the history; it presents a specific resolution to the triviality problem (abandon truth conditions) as the only resolution.

