answer: |-
  You have a strong intuition: the structure is mostly sound, but there is a load-bearing contradiction in the middle that threatens to collapse the argument when you apply it to a 200-year horizon.

  Here is the analysis of the tensions, ranked by severity, followed by the specific revision that will make your position consistent and defensible in the boardroom.

  ### 1. The False Alarm: (1) vs. (6)
  **Severity: Negligible.**
  Your board members are conflating *personal* time preference with *social* discount rates.
  *   **(6) is rational for a mortal agent.** You have a finite horizon. There is a non-zero probability you will not be alive in 30 years to enjoy the £100. There is also an opportunity cost: you can invest the £100 today. Your personal discount rate reflects mortality risk and investment opportunity.
  *   **(1) is a constraint on a perpetual agent.** The Wetlands Trust (and the government) is theoretically a perpetual institution. It has no mortality risk. Therefore, applying a "pure time preference" (valuing 2050 less than 2040 simply because it is later) is indeed a moral failing, as Ramsey argued. It discriminates against future citizens based on their birth date.

  **Verdict:** You are right; they are wrong. This is a scope error, not a logical contradiction. You can hold both without inconsistency provided you distinguish between *my lifespan* and *the trust's mandate*.

  ### 2. The Real Tensions (Ranked)

  Here is where the actual work lies. You have three propositions that fight each other when run over a two-century timeline.

  #### Rank 1: The "Growth vs. Survival" Conflict ((2) vs. (5))
  **Severity: Critical.**
  This is the structural fault line.
  *   **(2)** assumes continuous economic growth. It argues future people will be richer, so a unit of environmental quality is worth less to them than to us (diminishing marginal utility). This justifies spending less now.
  *   **(5)** acknowledges existential risk. It argues that preventing catastrophe is paramount because of the sheer volume of future lives.
  *   **The Contradiction:** You cannot simultaneously assume the future is wealthy enough that they won't miss the peat bog *and* fragile enough that its absence constitutes an existential catastrophe. If the peat bog is critical for climate stability or biodiversity (preventing the catastrophe in (5)), then future people *will not* be richer if we don't buy it. Their wealth is contingent on the asset you are debating purchasing.
  *   **The Result:** If (5) is true, (2) collapses. You cannot discount the value of the bog because they will be rich, because the bog is a prerequisite for that richness. Using (2) to argue against the bog undermines the premise of (5).

  #### Rank 2: The "Expected Value" Trap ((3) vs. (5))
  **Severity: High.**
  *   **(3)** applies standard risk discounting: "There's a chance the institution dissolves or the scheme fails, so we discount the benefit."
  *   **(5)** assigns near-infinite weight to extinction prevention.
  *   **The Contradiction:** In standard cost-benefit analysis, if you multiply a huge benefit by a small probability of failure, the Expected Value drops. If you apply (3) rigorously to existential risk (e.g., "There's only a 10% chance this bog actually prevents the tipping point"), the math might still tell you not to spend the capital. However, (5) suggests the *magnitude* of the loss swamps the probability.
  *   **The Result:** If you treat existential risk like a standard project risk (3), you will mathematically talk yourself out of preventing the catastrophe (5). You need a "precautionary" override that suspends (3) when the downside is irreversible civilizational collapse.

  #### Rank 3: The "Rate Uncertainty" Feedback ((4) vs. (2))
  **Severity: Moderate.**
  *   **(4)** argues for a declining discount rate because we don't know the future rate. This supports long-term investment.
  *   **(2)** assumes we *do* know the future growth rate (enough to calculate marginal utility).
  *   **The Contradiction:** If we are uncertain enough about the discount rate to invoke (4), we should arguably be uncertain enough about future wealth to hesitate on (2).
  *   **The Result:** This is less a contradiction and more a weighting issue. (4) supports your long-term view, while (2) undermines it. They pull in opposite directions, but (4) is a technical adjustment while (2) is a substantive ethical claim.

  ### 3. The Single Revision

  To tidy up the most mess with the least cost, you should **qualify or drop Proposition (2).**

  **Why (2) has to go:**
  Proposition (2) is the standard economic justification for neglecting the long-term environment. It relies on the assumption of *substitutability*: that man-made capital (money/technology) can substitute for natural capital (peat bogs). In groundwater modelling terms, it assumes the aquifer is renewable regardless of the recharge rate.
  In the context of a peat bog (carbon sink, flood mitigation, biodiversity), natural capital is likely *complementary* to economic capital, not substitutable. If the bog is gone, the future economy functions less well, regardless of how much money they have.

  **The Cost of Dropping (2):**
  You lose the ability to say, "They'll be richer, so they can fix it themselves." You must accept that if we don't fix it, they might not be rich. This increases your current financial obligation.

  **The Benefit:**
  It aligns (1), (4), and (5) into a coherent "Precautionary Longtermism."
  *   **(1)** We don't discriminate by date.
  *   **(4)** We use a declining rate to account for uncertainty.
  *   **(5)** We prioritize existence.
  *   **Without (2):** We acknowledge that their welfare depends on the assets we leave them.

  **How to restate it:**
  Replace (2) with: *"Future consumption should only be discounted if the specific benefit is substitutable by financial wealth. For critical natural capital (like peat bogs), we must assume marginal utility remains high or increases, as these assets are prerequisites for future wealth."*

  ### 4. Boardroom Strategy

  When you go to the meeting, the Council's discount rate is effectively applying (2) at a high rate while ignoring (1), (4), and (5). Here is how you use your revised framework:

  1.  **On (1) vs (6):** Tell the board: *"My personal impatience is due to my mortality. The Trust is immortal. Applying my mortality to the Trust's accounts is an accounting error."*
  2.  **On (2):** This is your main attack vector. *"The Council's model assumes future generations will be wealthy enough that they won't value this bog. But if we don't buy it, climate and flood risks increase, making them poorer. We cannot assume away the problem we are funding to solve."*
  3.  **On (3) & (5):** *"Standard risk discounting (3) applies to project failure. It does not apply to the existence of the beneficiaries. If the downside is irreversible loss of habitat, the 'probability' adjustment should be capped. We do not gamble with the baseline."*
  4.  **On (4):** *"Given the uncertainty of climate impacts over 200 years, a fixed discount rate is mathematically unsound. We should use a declining rate, which increases the present value of the long-term benefits."*

  **Summary:**
  Your system is 80% consistent. The 20% inconsistency is Proposition (2). It is a relic of standard cost-benefit analysis that does not fit the ecological reality you know from your hydrology career. Drop the assumption that future wealth makes nature less valuable. Once you do that, (1), (4), and (5) lock together into a robust argument for the peat bog, and (6) remains your private business.
