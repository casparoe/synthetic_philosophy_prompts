answer: |-
  # Exam Question: Simpson's Paradox and Causal Structure

  **Time Allocation:** 40 Minutes
  **Marks:** 20

  **Question 1**
  Consider the following three scenarios involving a Treatment ($T$), Control ($C$), and a binary Outcome (Success/Failure). In all tables, $N$ represents the number of subjects.

  **Table 1 (Classic)**
  | Stratum | Group | Success | Total | Rate |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | Treatment | 8 | 10 | 80% |
  | | Control | 3 | 10 | 30% |
  | **B** | Treatment | 2 | 10 | 20% |
  | | Control | 1 | 10 | 10% |
  | **Total**| **Treatment**| **10** | **20** | **50%** |
  | | **Control** | **4** | **20** | **20%** |
  *(Note: In this specific example, the aggregate favors Treatment. Imagine the $N$s were weighted such that the aggregate favored Control despite the stratum rates.)*

  **Table 2 (Equal Strata)**
  Strata A and B are exactly the same size ($N_A = N_B = 100$). Within Stratum A, 90 subjects receive Treatment and 10 receive Control. Within Stratum B, 10 subjects receive Treatment and 90 receive Control. Treatment has a higher success rate than Control in *both* strata.

  **Table 3 (Balanced Arms)**
  Within every stratum, the number of Treatment and Control subjects is identical ($N_T = N_C$). There is no confounding. However, the Conditional Odds Ratios ($OR_{cond}$) are all $> 1$, while the Marginal Odds Ratio ($OR_{marg}$) is $< 1$.

  **(a)** For Tables 1, 2, and 3, state whether the described situation is mathematically possible. If possible, briefly identify the mechanism (e.g., weighting, non-collapsibility). [6 marks]

  **(b)** Returning to Table 1 (assuming the aggregate reversal described in the note): The data alone cannot tell us whether the Treatment is actually beneficial. What specific causal information do we need to decide whether to trust the stratified or the aggregate table? Explain using the concept of a "common cause." [8 marks]

  **(c)** Suppose the variable you stratified by was not a pre-treatment characteristic, but a physiological measurement taken *after* the treatment was administered (e.g., blood pressure change). Explain why stratifying on this variable would be a mistake, even if the reversal persists. [6 marks]

  ***

  # Model Answer

  **(a)** All three scenarios are mathematically possible.
  In **Table 1**, the reversal is driven by unequal weighting. Even if Treatment is superior in every stratum, if the stratum where Treatment performs poorly contains a disproportionately large number of Treatment subjects, the aggregate rate can be dragged down below the Control aggregate.
  In **Table 2**, equal strata sizes do not prevent Simpson's Paradox. The paradox persists because the *allocation ratio* of Treatment to Control differs between strata. As long as the treatment assignment is correlated with the stratum (which acts as a risk factor), the aggregate risk difference can reverse the conditional risk differences.
  In **Table 3**, the reversal is possible due to the non-collapsibility of the odds ratio. Unlike risk differences, odds ratios are not linearly additive. Even with balanced arms (zero confounding), heterogeneity in baseline risk across strata can cause the marginal OR to be closer to the null (or reverse sign) compared to the conditional ORs. This is a mathematical artifact, not evidence of confounding.

  **(b)** To decide which table is causally valid, we need to know the causal relationship between the Stratifying Variable ($Z$), Treatment ($T$), and Outcome ($Y$). Specifically, we must determine if $Z$ is a **confounder** (a common cause of $T$ and $Y$).
  If $Z$ is a confounder (e.g., disease severity influences both who gets treatment and the likelihood of recovery), the stratified table blocks the backdoor path and provides the unbiased causal effect. The aggregate table is misleading because it mixes high-risk and low-risk groups unevenly.
  However, if $Z$ is not a common cause—for instance, if $T$ and $Z$ are independent by design (randomization)—then the aggregate table is generally preferred for estimating the average causal effect, and the stratified reversal is merely a statistical artifact (as in Table 3). No fact about the joint distribution $(T, Z, Y)$ settles this; we require external structural knowledge (a DAG) to identify the correct adjustment set.

  **(c)** Stratifying on a post-treatment variable is a mistake because such a variable is likely a **mediator** or a **collider**, not a confounder.
  If the variable is a **mediator** (on the causal path $T \rightarrow Z \rightarrow Y$), stratifying blocks the very mechanism by which the treatment works, biasing the estimate toward the null (over-adjustment).
  If the variable is a **collider** (caused by both $T$ and $Y$, or $T$ and unmeasured causes of $Y$), conditioning on it opens a spurious non-causal path between Treatment and Outcome (selection bias). In either case, the reversal observed in the stratified table does not represent confounding but rather induced bias. We should rely on the aggregate table (or adjust only for pre-treatment confounders) to recover the total causal effect.

