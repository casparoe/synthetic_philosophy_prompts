  # Grading Scheme (20 Marks)

  **Part (a): Mathematical Possibility (6 Marks)**
  *   **A (5-6 marks):** Correctly identifies all three as possible. Distinguishes Table 1 & 2 (weighting/allocation bias) from Table 3 (non-collapsibility/mathematical artifact). Explicitly notes that equal strata size (Table 2) does not guarantee safety if allocation is unbalanced.
  *   **B (3-4 marks):** Identifies all as possible but treats Table 3 as "confounding" rather than non-collapsibility. OR: Claims Table 2 is impossible because strata sizes are equal.
  *   **C (0-2 marks):** Claims any scenario is impossible. Confuses Risk Difference with Odds Ratio properties.

  **Part (b): Causal Resolution (8 Marks)**
  *   **A (7-8 marks):** Explicitly states that joint distribution is insufficient. Identifies the key criterion: Is the stratifying variable a **common cause** (confounder)? Explains that stratification is only correct if it blocks a backdoor path.
  *   **B (4-6 marks):** States we need "more info" or "context." Mentions confounding but fails to define it structurally (common cause). Implies the stratified table is *always* the correct one for Simpson's paradox.
  *   **C (0-3 marks):** Argues that the larger sample size (aggregate) is always right. OR: Argues that the stratified table is always right because "Simpson's paradox means stratify."

  **Part (c): Post-Treatment Bias (6 Marks)**
  *   **A (5-6 marks):** Identifies the variable as a **mediator** or **collider**. Explains the consequence: blocking the causal path (mediator) or opening a spurious path (collider/selection bias).
  *   **B (3-4 marks):** Identifies it as "bad" because it happened after treatment. Fails to use terms like mediator/collider or explain the mechanism of bias.
  *   **C (0-2 marks):** Claims stratifying is still fine. OR: Confuses post-treatment variables with confounders.

  **General Penalties:**
  *   **-1 mark** for calculation errors (if any were attempted).
  *   **-1 mark** for unclear notation or terminology (e.g., confusing correlation with causation).
