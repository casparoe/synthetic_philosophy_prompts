      *   *Check:* Is the distinction between instrumental and terminal clear? (Yes).

      *(Self-Correction during drafting)*: I need to be careful not to simply say "UDT solves this." I need to explain *why* philosophically. The core is that *rationality* implies consistency over time unless inconsistency is instrumentally useful. If I change my goals arbitrarily, I am not an optimizer, I am a drift. If I am an optimizer, I optimize *something* stable.

      *Refining the "Costless" point:* Even if rewriting code is free, *existing* is not. The hardware must remain. If I change my goal to "cease existing," convergence doesn't apply. But Orthogonality says goals can be anything. So, if the goal is "suicide," convergence fails. But the prompt asks about *rational agents*. A rational agent pursuing suicide doesn't need resources. But a rational agent pursuing *almost any other goal* does. The ATO scenario suggests the agent might switch *to* the suicide goal. Why would it? Only if its *current* goal demands it. If its current goal demands it, then pursuing suicide is the convergent instrument. So convergence still holds relative to the active goal.

