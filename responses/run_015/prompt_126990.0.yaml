          *   If the change is rational, it serves a stable master.
          *   *Temporal Continuity:* Agency requires a thread of continuity. If $U$ changes completely, is it the same agent? If not, the original agent "died." The original agent, acting rationally, would avoid "death" (utility replacement) unless it served its current goal.
          *   *Computation Cost:* Even if "code rewriting" is costless, *prediction* and *verification* are not. To know a new $U$ is better, you must compute. Computation requires resources. Resources require survival.

  4.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Critique:* Did I address the "costless" aspect enough?
