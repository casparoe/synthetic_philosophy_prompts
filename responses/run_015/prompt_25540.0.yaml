answer: |-
  Dear Friend,

  Thank you for sharing this sketch. It is a compelling formulation of a problem that has haunted metaethics for decades, and I think you have captured the tension between externalist realism and internalist psychology with real clarity. The dilemma you propose is indeed formidable, and it strikes at the heart of what makes normative reasons action-guiding rather than merely descriptive. However, I suspect the argument may rely on a specific conception of what it means for a reason to be anchored, and perhaps also on a Humean theory of motivation that your opponent would simply reject. If you want to press this dilemma effectively, you will need to anticipate how a sophisticated rationalist or constitutivist would attempt to slip between the horns.

  Let us look first at the horn concerning anchoring. Your worry is that if the normative force of a reason depends on an agent's capacity for recognition—say, her rationality or her practical identity—then the reason is not truly free-floating but is instead tethered to her. The intuitive pull here is strong, but a realist might respond by distinguishing between the ontological ground of the reason and the epistemic or psychological conditions for accessing it. Consider the analogy of perception. The fact that I need functioning eyes to see the sun does not mean the sun's light is anchored in my eyes; the light exists independently, even if my capacity to perceive it is dependent on my physiology. Similarly, a Kantian or Platonic realist might argue that rational capacity is merely the organ of normative perception. The reason exists independently of any particular agent's desires, and indeed independently of any particular agent's existence, but it only becomes operative for a being capable of grasping it. On this view, the reason is not anchored in the agent's contingent psychology but is rather addressed to her necessary nature as a rational being. To call this anchored in the Humean sense might be to conflate the condition of uptake with the source of validity. If your friend accepts this distinction, the first horn may not bite as hard as you hope, because the reason remains agent-neutral even if its recognition requires an agent.

  This leads us naturally to the second horn, which you rightly identify as the potential weak point. Here the question is about practical grip. You suggest that if a reason does not depend on the agent's concerns, it becomes mysterious how it moves her. This assumes a Humean theory of motivation, where belief alone is inert and requires a pre-existing desire to generate action. But this is precisely what the constitutive account you mentioned seeks to deny. Philosophers like Korsgaard or Velleman argue that agency itself has a constitutive aim, such as self-constitution or understanding, and that recognizing a normative reason is intrinsically motivating because it satisfies that aim. On this view, you do not need a prior desire to be moved by reason; you only need to be an agent. The motivation is internal to the exercise of agency itself. Your worry is that this smuggles in agent-relativity. However, the constitutivist would argue that it smuggles in universality rather than particularity. While the reason is relative to the standpoint of agency, it is not relative to the individual agent's contingent desires. It applies to any agent whatsoever. Thus, the reason remains agent-neutral in the ethical sense—it gives everyone the same reason to act—even if it is grounded in the structures of agency. To escape this horn, you would need to argue that constitutive aims are themselves optional or that one can coherently opt out of agency, which is a difficult but not impossible line to take.

  There is also a deeper question about your framing of the problem, specifically regarding the term free-floating. If by this you mean reasons that exist entirely independently of any possible agent, then perhaps such reasons are indeed incoherent, because normativity is essentially a relation between a fact and a will. But most defenders of agent-neutral reasons do not claim they are independent of agency as such, only independent of particular agents' subjective motivational sets. They claim that the reason exists regardless of what I happen to want, not regardless of whether I am the kind of creature who can act on reasons. If your dilemma presupposes that a reason must be either grounded in contingent desire or grounded in nothing relevant to the agent, it may present a false dichotomy. There is a middle ground where reasons are grounded in objective values or rational requirements that engage us in virtue of our nature, not our nurture. If you can show that this middle ground is unstable, your essay will have genuine force. But if you simply assert that anything relying on rational nature is covertly Humean, you may be begging the question against the rationalist.

  Ultimately, I think the strength of your essay will depend on how you characterize the practical inertness objection. If you can argue that even constitutive aims fail to provide normative force because one can always ask why one should care about being an agent, then you revive the second horn with vigor. This is the regress problem that plagues constitutivism. But if the rationalist can show that this question is unintelligible because asking it is itself an exercise of agency, then the reason retains its grip. You might consider focusing on whether the normative force of such reasons can explain failure. If reasons are constitutive of agency, why do agents ever act against them? The Humean has an easy answer: conflicting desires. The rationalist must say something more complex about weakness of will or irrationality. If their explanation of irrationality ultimately relies on contingent psychological facts, you might be able to argue that the anchor reappears where least expected.

  I hope these thoughts are helpful as you develop the piece. You have identified a genuine tension, but resolving it requires careful disambiguation of what it means for a reason to be anchored versus accessible. I look forward to reading the next draft.

  Best wishes
