answer: |-
  Consider a pair-attitude expressivism: accepting moral A is having an attitude toward A; accepting 'if A then B' is an attitude toward the ordered pair ⟨A, B⟩; accepting 'not A' is a tolerance attitude toward A. Evaluate these valid inferences: (i) A, A→B ⊢ B; (ii) A→B, ~B ⊢ ~A; (iii) A→B, B→C ⊢ A→C; (iv) A→B, ~A→B ⊢ B.

  Which inference poses the distinct structural problem for this view? Explain the feature separating the manageable cases from the problematic one, and whether a single fix resolves all.

  Now stipulate agents can be indifferent to moral content (neither for nor against). How does this impact your analysis? Specifically, if negation becomes a content-forming operator rather than a distinct attitude, what becomes of 'not A' within this framework?

  Inference (iv) poses the distinct structural problem. While (i) is definitional, and (ii)-(iii) require consistency constraints across distinct pair-attitudes, (iv) requires a logical relation between A and ~A within the antecedent positions. The pair-attitude view defines 'not A' as a tolerance attitude toward A, not as content involving negation. Consequently, it lacks the resources to link the attitude toward ⟨A, B⟩ with the attitude toward ⟨~A, B⟩, because 'A' and '~A' are treated as unrelated objects of different attitude types.

  No single fix covers all. (i)-(iii) require rationality constraints on attitudes; (iv) requires logical structure within the content. Solving (iv) demands treating negation as content-operating, which contradicts the initial setup.

  Allowing indifference undermines the 'tolerance' definition of negation. If one can be indifferent, 'not A' cannot merely be tolerance. If negation becomes a content-forming operator, 'not A' joins A as content. This forces attitudes to target negated contents. The pair-attitude view collapses: if attitudes target complex contents including negation, the view abandons its core claim that moral negation is a distinct non-cognitive stance. It effectively concedes that moral sentences have truth-conditional content, surrendering the expressivist advantage to solve Frege-Geach.

  1. (4 marks) Awards points for identifying (iv) as the critical failure case because it requires relating A and ~A within conditional antecedents rather than merely linking attitudes.
  2. (4 marks) Awards points for distinguishing the structural feature: (i)-(iii) require inter-attitude consistency, whereas (iv) requires intra-content logical relations unavailable to pair-attitudes.
  3. (4 marks) Awards points for arguing that no single fix works because solving (iv) requires content-negation, which contradicts the attitude-based definition of negation required for (i)-(iii).
  4. (4 marks) Awards points for explaining that allowing indifference breaks the equivalence between 'not A' and tolerance, forcing negation into the content rather than the attitude type.
  5. (4 marks) Full marks are withheld for generic Frege-Geach recitation that fails to engage with the specific pair-attitude mechanics or the indifference stipulation.
