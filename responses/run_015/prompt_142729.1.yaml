  I've been calling (iv) the whether-or-not case and I can't find it discussed anywhere, which is half of why I want it. Ask them which of the four is the real problem and why — not to run through all four, but to say what structural feature seperates the ones the pair-attitude view handles from the ones it doesn't, and whether one fix covers everything. Then stipulate that a speaker can be indifferent toward a moral content, neither for it nor against it, and ask what that does to their answer — in particular what "not A" can even mean on the version of the view where negation has become a content-forming operator rather than a separate attitude.

  Give me the question first, then the model answer, then the scheme, no preamble. Hard limits: question text 200 words max, model answer 400 words max, marking scheme five bullets of one sentence each with marks out of 20. The one thing I want the scheme to punish is the recitation move — anyone who just writes that expressivists owe an account of how moral sentences keep their meaning in unasserted contexts shouldn't get past partial credit.
