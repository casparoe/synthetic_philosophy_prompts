answer: |-
  **Grade: B-**

  **General Assessment:**
  You correctly identify the core distinction (*ab initio* vs. *ex parte exercitii*) and accurately capture Aquinas's overarching concern regarding sedition and the "greater harm" principle. However, your answer contains significant textual inaccuracies regarding the *agent* of resistance (private vs. public authority) and attributes a doctrine of preemption to Aquinas that is not supported by the text. These errors undermine the precision required for a question on jurisdictional standing.

  **Point-by-Point Analysis:**

  **1. The Distinction and General Caution**
  *   **Status:** Correct.
  *   **Comment:** You accurately state that Aquinas distinguishes between a usurper and a legitimate ruler turned tyrant. You also correctly note that in both cases, the risk of sedition and greater harm to the common good acts as a brake on resistance.
  *   **Revision:** None needed.

  **2. Resistance Against the Usurper (*Tyrannus ab initio*)**
  *   **Status:** Subtly Off.
  *   **Comment:** You claim "private citizens may resist him directly." While Aquinas argues there is no bond of fidelity to a usurper (meaning one is not bound to obey), he does not explicitly grant *private individuals* the right to execute judgment or depose the ruler on their own authority. He suggests the *community* or a *superior authority* may act, but private presumption is still risky.
  *   **Cheapest Revision:** Change "private citizens may resist him directly" to "the community is not bound to obey, and a superior authority may depose him without the charge of sedition."

  **3. Jurisdiction vs. Efficacy**
  *   **Status:** Incorrect.
  *   **Comment:** You argue that for the usurper, "efficacy mostly determines standing—because no legitimate authority ever existed, there is no one with proper jurisdiction to appeal to." This misreads Aquinas's legalism. For Aquinas, jurisdiction is primary; efficacy is merely a prudential check. Even against a usurper, the *right* to depose belongs to a public authority (or the people acting as a public body), not merely to whoever is efficacious. You conflate the *absence of a specific superior* with the *absence of jurisdictional requirements*.
  *   **Cheapest Revision:** Reframe to argue that jurisdiction is *simplified* (no bond of obedience exists), but the *right to punish* still resides in the public sphere, not private efficacy.

  **4. Resistance Against the Legitimate Tyrant (*Tyrannus ex parte exercitii*)**
  *   **Status:** Incorrect.
  *   **Comment:** You state: "private individuals may still act with tacit community backing." This directly contradicts *Summa Theologiae* II-II, Q. 42, A. 2, ad 3. Aquinas explicitly rejects private assassination of tyrants (citing the example of Brutus and Cassius negatively), even if the ruler is abusive. He insists that deposition must come from a public authority (the people or a superior), not private individuals, regardless of "tacit backing."
  *   **Cheapest Revision:** Delete the claim about private individuals acting. State instead: "Private individuals have no standing; only the public authority that instituted the ruler (or a superior) may depose him."

  **5. Preemptive Resistance**
  *   **Status:** Incorrect.
  *   **Comment:** You claim Aquinas allows preemptive resistance against a usurper "if his tyrannical intentions are clear." Aquinas does not support resistance based on intention alone; tyranny is defined by *acts* against the common good. Speculating on intentions belongs to divine judgment, not human political action. This claim is unsupported by *De Regno* or the *Summa*.
  *   **Cheapest Revision:** Remove the claim about preemption. State: "Resistance requires actual manifest tyranny, not merely suspected intentions, to ensure the accusation is certain and not seditious."

  **Summary of Required Fixes:**
  To raise this to an A-range answer, you must align the *agent* of resistance with Aquinas's strict hierarchy. Aquinas is not a theorist of private right-to-resist; he is a theorist of public authority. Ensure you distinguish between "not obeying" (which is permissible) and "active deposition" (which requires public standing). Finally, remove the speculation on preemptive action, as Aquinas requires actual harm to justify the extreme remedy of deposition.
