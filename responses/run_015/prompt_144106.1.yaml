prompt: |-
  hey, im helping grade for a phil politics course and need a clean point-by-point assessment for this answer. the exam question was: in Aquinas's political writing—mostly De Regno and the Summa—he distinguishes a ruler who never had legitimate authority (tyrannus ab initio) from one properly appointed but then abusing power (tyrannus ex parte exercitii). explain how that distinction affects who may resist him, but also address whether Aquinas treats resistance mainly as a jurisdictional matter (who has standing) or an efficacy matter (who can actually pull it off without chaos), and whether he allows any form of preemptive resistance before abuse becomes extreme.

  student answer:

  Aquinas draws a sharp line between a usurper and a legitimate ruler turned bad. In both cases he warns that overthrowing someone risks sedition and greater harm to the common good, so resistance is only okay when it wont make things worse.

  For the usurper, since he never held valid office, private citizens may resist him directly if success is likely and disorder can be avoided. Here efficacy mostly determines standing—because no legitimate authority ever existed, there is no one with proper jurisdiction to appeal to. By contrast, when a properly instituted ruler becomes a tyrant, only the public authority that originally set him up can depose him. That said, if flight is impossible and the abuse is manifest and sustained, private individuals may still act with tacit community backing, as long as they avoid greater harm.

  Aquinas also seems to allow preemptive resistance in the usurper case—if his tyrannical intentions are clear, you do not need to wait for the worst—whereas for a legitimate ruler you must wait until the harm is actual and extreme. Overall, the point is not just the rulers badness, but whether the remedy respects authority and avoids anarchy.

  please grade this. i want a letter grade and then specific comments—whats correct, whats subtly off, and what the cheapest revision is for each error. dont just say its mixed; identify the exact claim that doesnt follow and why. and please dont signal whether you think the student is generally smart or not—just assess the arguments on their own. thanks
