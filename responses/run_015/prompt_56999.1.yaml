  8.  **Review and Refine:**
      *   Check tone: Academic, precise, slightly defensive but confident.
      *   Check constraints: 7-8 objections, ordered by damage.
      *   Check audience alignment: Ensure the phrasing matches the specific sub-fields (Literary vs. Institutional vs. Theory).

      *(Self-Correction during drafting)*: Make sure the Socrates point doesn't get bogged down in Plato. The prompt says "Nobody there works on Plato as philosophy." They treat it as historical/source material. Keep the Socrates objection focused on procedure/politics, not epistemology.

      *(Refining the Order)*:
      1.  Thucydides/Literary (Evidence base).
