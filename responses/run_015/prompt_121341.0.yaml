  A junior faculty member finds her department chair staring blankly at a whiteboard covered in erased equations.

  "Still working on the epistemic norms paper?" she asks.

  "Finished it," he says, capping the marker. "I've fully adopted Simon's framework. Bounded rationality."

  "So you're satisficing now? Instead of maximizing for Truth?"

  "Exactly. I started with an aspiration level of 'Certainty.' But the environmental structure was too noisy, and my cognitive bounds couldn't process the evidence space. Search failed."

  "So you lowered the bar?"

  "Naturally. Simon dictates you adjust aspirations downward after repeated search failures. I shifted to 'Justified True Belief.' Still too computationally expensive. The scissors wouldn't cut."

  "Scissors?"

  "The mind is one blade, the environment is the other. Rationality is where they meet. If the world is complex and the brain is tired, the cut happens lower down."

  "So where did they finally meet?"

  "I lowered aspirations to 'Coherent Narrative.' Still stuck. The search costs were eating up my tenure clock."

  "Okay, so what's the final policy?"

  "I adjusted the aspiration level to match the point where the marginal cost of further search exceeded the penalty for being vaguely plausible."

  "Which is..."

  "Assert whatever is unfalsifiable within the grant cycle."

  "That's not knowledge," she says.

  "No," he replies, grabbing his coat. "But it's ecologically rational. The scissors don't care about truth; they just care about closing."
