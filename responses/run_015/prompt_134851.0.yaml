answer: |-
  You are not inconsistently modest. Your intuitions are actually tracking a deep, coherent epistemic distinction that often gets blurred in discussions about Inside View (IV) and Outside View (OV).

  The unifying principle that captures your judgments is **The Transparency of Truth Conditions.**

  Put simply: **Does the truth of the claim depend on internal consistency (logic/calculation) or external correspondence (prediction/complex systems)?**

  *   **Inside View wins** when the domain is **Deductive or Closed.** Truth is determined by whether the steps hold together.
  *   **Outside View wins** when the domain is **Inductive or Open.** Truth is determined by how well a prediction matches a noisy reality where base rates dominate.
  *   **Outside View is Irrelevant** when the domain is **Normative.** Truth is determined by axioms, not statistics.

  Here is how this principle maps onto your five cases, and what it predicts for the mathematician.

  ### 1. Mapping Your Cases

  **Case 1: Chess (Deductive/Closed)**
  *   **Verdict:** Inside View wins.
  *   **Why:** Chess is a closed system with perfect information. Even in time trouble, a tactic is a calculation. The "30% error rate" is statistical noise (slipping up), not a structural reason the move is bad. If the calculation holds, the move is good. The IV *is* the evidence.
  *   **Principle:** Truth is internal to the board state.

  **Case 2: Climate Science (Inductive/Open)**
  *   **Verdict:** Outside View wins.
  *   **Why:** Climate is a complex, chaotic system. You cannot "calculate" the outcome from first principles in your head; you are making a probabilistic prediction. The consensus represents an aggregation of data and models that swamps a single internal model check.
  *   **Principle:** Truth is external correspondence; base rates (consensus) are stronger predictors than individual intuition in high-noise systems.

  **Case 3: History (Inductive/Interpretive)**
  *   **Verdict:** Outside View wins (downgrade confidence).
  *   **Why:** Historical narrative is inductive. Archives provide data, but the *narrative* is a model built on that data. Peer disagreement signals that the "narrative space" has high uncertainty. Unlike chess, there is no "checkmate" to verify the story immediately.
  *   **Principle:** In interpretive fields, peer disagreement is a strong signal of hidden complexity or bias.

  **Case 4: Stocks (Inductive/Adversarial)**
  *   **Verdict:** Outside View wins.
  *   **Why:** The market is an adversarial system designed to absorb information. A "pattern" is likely noise unless you have a causal mechanism for why the market is mispricing it. The base rate (nobody beats the market) is overwhelming.
  *   **Principle:** In efficient markets, specific evidence (IV) is usually weaker than the base rate (OV).

  **Case 5: Morality (Normative)**
  *   **Verdict:** Outside View is irrelevant.
  *   **Why:** Moral claims are not empirical predictions. Knowing *why* you believe slavery is wrong (culture + reasoning) does not change the *truth value* of the claim. To say "you only believe that because of your era" is the **Genetic Fallacy**.
  *   **Principle:** OV explains the *cause* of the belief, not the *validity* of the axiom.

  ### 2. The Mathematician Case

  Now, apply **The Transparency of Truth Conditions** to your mathematician.

  **The Scenario:** She believes she has solved a famous problem. Dozens have failed before (OV). She can walk through every step of her proof (IV).

  **The Prediction:** **The Inside View should win, but with a specific caveat.**

  **Reasoning:**
  Mathematics is a **Deductive/Closed** system (like Chess, but without time pressure).
  *   **The OV (Dozens failed):** This tells you the problem is *hard*, not that it is *impossible*. It sets a low prior probability that *any given attempt* is correct.
  *   **The IV (The Proof):** In math, a proof is not a prediction; it is a verification. If she can genuinely walk through every step and each step follows logically from the last, the base rate of previous failures becomes irrelevant. One valid proof overrides a thousand failed attempts.

  **The Caveat:**
  The OV *does* bite on **human error**, not on **mathematical truth**.
  The outside view tells her: "Humans making complex arguments make silly mistakes (algebra errors, skipped steps)."
  *   **Action:** She should not downgrade her belief that *a solution exists* or that *her approach is promising*. However, she should use the OV to motivate extreme scrutiny of her work (peer review) to rule out the "human error" base rate.
  *   **Conclusion:** She is rational to believe she has solved it *provisionally*, whereas the stock picker is irrational to believe they beat the market. The mathematician has **transparent leverage** (the logic); the stock picker has **opaque noise** (the pattern).

  ### 3. Summary of the Principle

  You can summarize your stance with this rule of thumb:

  > **Defer to the Outside View when you are predicting the future of a complex system. Trust the Inside View when you are verifying the consistency of a closed system. Ignore the Outside View when you are defending a normative axiom.**

  *   **Chess/Math:** Closed system. IV = Verification. **Trust IV.**
  *   **Climate/Stocks/History:** Complex system. IV = Prediction. **Trust OV.**
  *   **Morality:** Normative axiom. OV = Genetic Fallacy. **Ignore OV.**

  You aren't all over the place. You are correctly identifying that "truth" works differently in a logic puzzle than it does in a weather forecast.
