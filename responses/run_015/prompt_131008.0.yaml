          4.  Conclusion: MSRP can't guide Monday morning science or demarcate in real-time.
      *   **Friend's Counter:** Distinguishes "local" (fixed window track record) vs. "comparative" (superseding) readings. Claims fixed windows make local verdicts falsifiable.
      *   **User's Rebuttal to Friend:** That's just the time-lag move with a number stapled to it.
      *   **Desired Output:**
          *   Case against the user (map of exposure, not summary).
          *   Conditions for the user's position to be wrong.
          *   Historical episodes (real-time Lakatosian appraisal success?).
