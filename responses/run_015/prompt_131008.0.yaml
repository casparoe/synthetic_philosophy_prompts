          4.  Sorting Defeaters (Fatal vs. Embarrassing).
          5.  The Field Case (15-year stagnation).
          6.  The Actionable Difference (Monday Morning).
      *   *Key Insight:* The user's friend is trying to "operationalize" Lakatos (pre-registered windows). This moves away from Lakatos towards a more Kuhnian or Bayesian view. Lakatos was vague on time.
      *   *Crucial Distinction:* MSRP is not an algorithm; it's a rational reconstruction tool. If the user demands an algorithm, MSRP fails. If the user accepts it as a normative guide for long-term strategy, it survives.

  9.  **Refining the "Map of Exposure":**
