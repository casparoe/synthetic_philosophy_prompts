      *   2. There must be a case where sticking with a degenerating programme (by MSRP lights) would have been irrational, and MSRP flagged it.
      *   3. There must be a case where abandoning a programme (by Popper lights) would have been wrong, and MSRP saved it. (This is the stronger case for MSRP).

  10. **Refining the Field Case:**
