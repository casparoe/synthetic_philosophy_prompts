answer: |-
  The claim I think is most wrong is your third one, that the LOT thesis collapses into a mere empirical claim about generalization and offers no explanatory work beyond restating systematicity. You are conflating the phenomenon we need to explain with the explanation itself. Systematicity is the explanandum, the thing that cries out for a cause, and LOT is the hypothesis about the architectural cause: that cognitive processes are sensitive to the syntactic structure of internal representations. If you say we should just study the generalization patterns and drop the structural hypothesis, you are effectively saying we should describe the shadow without positing the object casting it. The vector system you describe might mimic the shadow, but if it lacks discrete tokens with genuine constituent structure, it cannot explain why the system possesses the capacity for infinite productivity in principle, even if performance limits mask it in practice.

  On your second point about gradedness, you are mistaking performance limitations for competence failures. My position distinguishes sharply between what a cognitive system is architected to do and what it fails to do because of noise, memory decay, or processing load. A LOT system has perfect systematicity at the level of competence because the rules operate on discrete symbols that don't blur together. If your vector system degrades smoothly as embedding depth increases, that is exactly what we expect from a system relying on continuous values where signal-to-noise ratios decay with complexity. This graded failure is evidence against LOT only if it reflects a lack of structural capacity rather than a processing bottleneck, but the sharp drop-off you describe at depth three sounds like a resource limit, not a lack of constituents. We expect thought to be systematic even if the brain running it gets tired.

  For your first question on falsification, here is the behavioral signature: a system that learns to process complex representations correctly but fails to generalize based on constituent structure when similarity cues are controlled. If your vector system learns "John loves Mary" and "Bill hates Sue" but fails to process "John hates Mary" despite having the vectors for John, hates, and Mary available, and this failure isn't due to similarity interference but due to the specific configuration of roles, that challenges LOT. However, if the failure is purely due to the vectors for "John" and "Mary" blending too much in the composite, that confirms my suspicion that you have similarity-based retrieval rather than genuine syntactic derivation. LOT predicts that if you have the constituents and the rules, you must have the systematicity; if you have the behavior without the structure, you have a parlor trick, not thought.
