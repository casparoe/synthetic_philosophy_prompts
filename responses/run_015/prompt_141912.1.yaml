  1. How you'd even tell apart "this model is less capable" from "this model is spending more compute," given that most benchmarks hand out a fixed token/compute budget per problem — so is the tax real, or is it definately just an artifact of benchmarks that cap compute?
  2. Whether it matters that her tax is a *per-task* inference cost instead of a one-off training cost — my guess is a one-time cost gets amortized away but a per-query cost eats your margin on every single sale forever, so competition should squeeze the second kind way harder, but idk if that's right.
  3. The fact that safety training seems to *help* on some axes (actually following instructions, not derailing, being useful on longer multi-step tasks) while hurting on others — if it's a tax on some capabilities and a subsidy on others, is "the alignment tax" even a sensible unit to be arguing about, or should she be talking about which capability bundle you're buying?
  4. What would actually make her give the view up: specifically, if open-weight fine-tuning can strip the safe behavior off a model for almost nothing, then her "tax" only exists behind a moat where nobody else can touch the weights, and I want her to say what's left of her argument when that moat is gone.
  5. One follow-up that anticipates her most likely answer on the competitiveness constraint (I'm betting she says the race is overstated because frontier training is compute-gated and there are only a handful of labs that can even play) and pushes on what she's assuming there — e.g. what happens to that argument if the pressure comes from lots of smaller labs shipping cheap fine-tunes rather than from one front runner.

  After each question put a short parenthetical on how confident you are that this is genuinely the sharpest place to press rather than a softball she can deflect, and put a star on the one you're least sure about.
