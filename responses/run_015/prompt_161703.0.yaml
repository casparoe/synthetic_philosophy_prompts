  4. Assert that care obligations and past promises remain binding on the living, regardless of changes in the resident's psychological continuity or memory.
  5. Mark "yes" on the chart to affirm care continuity, accepting this simplifies the philosophical reality, and describe their current capacities neutrally in the text field.

  **Case Applications**

  1.  **Daughter/Promise:** Box: Yes. Text: Resident is the same legal person; prior advance directives regarding life support remain valid and binding. Tell her the promise binds you to the present body.
  2.  **Husband/Visiting:** Box: Yes. Text: Resident is present but has lost short-term memory and name recognition; requires familiar cues for comfort. Tell him recognition is not required for her to be his wife.
  3.  **Son/Suffering:** Box: Yes. Text: Resident appears content, humming frequently, no signs of distress observed; current disposition differs from past anxiety. Tell him assuming she hates it projects past fear onto present calm.

  This procedure cannot settle the metaphysical truth of identity or resolve the private grief of losing a relationship.
