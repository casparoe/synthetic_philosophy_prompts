answer: |-
  The single design decision the whole activity turns on is forcing participants to select their scoring ledger (per-experiment vs. per-awakening) before the coin is flipped, thereby making the conflict between "fair coin" and "fair bet" a visceral choice of identity rather than a math problem.

  ### Rules and Materials

  **Materials:**
  *   1 large coin.
  *   14 envelopes (opaque).
  *   28 index cards (14 marked "AWAKE", 14 blank).
  *   2 ledgers (large sheets of paper taped to the wall): "Ledger A: The Experiment" and "Ledger B: The Awakening."
  *   Stakes: 28 pieces of chocolate (or coffee tokens).
  *   Pens for everyone.

  **The Protocol (Read Aloud):**
  1.  **Selection:** You are all part of the pool. A coin will be flipped.
      *   **Heads:** 7 of you will be selected to open an envelope. 7 will remain "asleep" (envelopes stay sealed).
      *   **Tails:** All 14 of you will be selected to open an envelope.
      *   *Note:* The selection of *who* gets an envelope on Heads is random and unknown to you until you open it.
  2.  **Awakening:** If you open an envelope and find a card saying "AWAKE," you are now an active participant. If you find a blank card (or no envelope), you are an observer for this round.
  3.  **The Guess:** Every "AWAKE" participant must write down "Heads" or "Tails" on a slip of paper.
  4.  **The Ledgers:**
      *   **Ledger A (Experiment):** Pays out once per coin flip. If the majority of *active* guesses are correct, everyone gets chocolate.
      *   **Ledger B (Awakening):** Pays out once per active participant. Every individual correct guess gets chocolate.
  5.  **The Lock:** Before the coin is flipped, you must individually sign up for either Ledger A or Ledger B. You cannot change this after the flip.

  ### Timeline (90 Minutes)

  **0:00–0:10: Setup and Framing**
  *   Distribute envelopes (sealed) to all 14 writers. Tell them not to open them yet.
  *   Explain the Protocol clearly. Emphasize: "You do not know if you are in the Heads group or the Tails group until you open the envelope. If you are Awake, you do not know how many others are Awake."
  *   **Crucial Instruction:** "This is not a logic puzzle. There is no trick. The coin is fair. Your goal is to get chocolate."

  **0:10–0:25: Ledger Selection (The Lock)**
  *   Have participants sign the wall ledger (A or B) individually.
  *   Ask them to write a private note on an index card: "I believe the chance of Heads is ___%." Collect these cards in a box (do not look at them yet).
  *   *Facilitator Note:* Do not discuss strategy. Let them feel the anxiety of choosing the ledger.

  **0:25–0:45: Round 1 (The Flip)**
  *   Flip the coin (hidden result).
  *   Distribute envelopes based on the result (Heads: 7 random envelopes contain "AWAKE"; Tails: all 14 contain "AWAKE"). *Preparation: You must pre-stuff envelopes based on a dummy flip or have an assistant do this while you talk, otherwise the delay kills tension. Better: Pre-stuff two sets of envelopes. Flip coin. Hand out the corresponding set.*
  *   Participants open envelopes. "Blank" recipients sit silently in the corner (Observers). "AWAKE" recipients stand in the center (Sleepers).
  *   Sleepers write their guess (Heads/Tails).
  *   Reveal coin. Distribute chocolate according to the chosen Ledgers.
  *   *Observation:* If Tails came up, Ledger B people get twice as much chocolate as Ledger A people (because there are twice as many winners). If Heads, Ledger A people feel vindicated (50/50 logic), Ledger B people feel shortchanged (fewer winners).

  **0:45–1:05: Round 2 (The Re-Lock)**
  *   Reset envelopes.
  *   **The Twist:** Allow participants to switch Ledgers before the second flip.
  *   Repeat the process.
  *   *Facilitator Note:* Watch who switches. Most will switch to Ledger B if they want chocolate, or stay A if they feel Ledger B is "cheating."

  **1:05–1:20: The Reveal and Debrief**
  *   Collect the guess slips. Tally them.
  *   Open the box of "belief percentage" cards.
  *   **The Reveal:** Now you can use the forbidden words. Explain this is a version of the "Sleeping Beauty Problem."
  *   **Mapping:**
      *   **Ledger A** represents the **Halfer** position (credence based on the coin's history).
      *   **Ledger B** represents the **Thirder** position (credence based on the frequency of experience).
      *   **The Switch:** The discomfort they felt choosing a ledger is the philosophical problem. It isn't about the coin; it's about what a belief is *for*. Is belief for tracking truth (Ledger A) or for navigating experience (Ledger B)?

  **1:20–1:30: Q&A and Close**
  *   Read aloud the most interesting "belief percentage" cards anonymously.
  *   Distribute remaining chocolate.

  ### Payoff Scheme
  *   **Ledger A:** If the group guess is correct, everyone gets 1 chocolate.
  *   **Ledger B:** If your individual guess is correct, you get 1 chocolate.
  *   **Why this works:** In the Tails scenario (14 Awake), Ledger B pays out 14 chocolates. In Heads (7 Awake), Ledger B pays out 7. Ledger A always pays out 1 "unit" (shared). This makes the *value* of being right dependent on the coin outcome in Ledger B, but not Ledger A.

  ### Debrief: Mapping Moments to Argument
  1.  **The Ledger Choice:** Ask, "Who switched to Ledger B?" Explain that choosing Ledger B implies you think your "Awakening" is evidence. Choosing Ledger A implies you think only the "Flip" is evidence.
  2.  **The Belief Cards:** Compare the written % confidence to the Ledger choice. If someone wrote "50%" but chose Ledger B, point out the friction: "You believed the coin was fair, but you bet as if it was biased. Why?" This exposes the "credence vs. betting odds" gap.
  3.  **The Observers:** Ask the "Blank" envelope holders how they felt. They knew the protocol but weren't "Awake." This highlights the *selection effect*—the core of the between-subjects substitution.

  ### Caveats and Predictable Failures
  1.  **The "Math Puzzle" Trap:** Writers will try to solve this like a riddle. If someone starts calculating Bayes' theorem aloud, stop them. Say: "Don't solve for the coin. Solve for the chocolate." The goal is the *feeling* of the dilemma, not the correct answer.
  2.  **The "Unfair Coin" Objection:** One person will insist, "If Tails wakes more people, the coin isn't fair." **Response:** "The coin is fair. The *sampling* is biased. That is the whole point." Do not let them derail the session on this; validate them and move on.
  3.  **Small Sample Size:** With 14 people, the 7 vs. 14 split might feel obvious if they communicate. **Fix:** Enforce strict silence between "Awake" participants. They cannot count heads in the room.
  4.  **The "Pragmatics" Dismissal:** Participants will say, "I know it's 50/50, I just chose Ledger B because it pays more." **Block:** Remind them of the belief cards. "If you truly believed 50/50, you should be indifferent to the ledger if the payout is calibrated. Your preference reveals your implicit credence."

  ### The One Feature You Cannot Reproduce
  You must say this out loud in the debrief: **"No one here forgot anything."**
  In the original thought experiment, Beauty wakes up twice but remembers only once. She is one person stretched over time. In this room, you are fourteen distinct people. The "loss" in this simulation is the *diachronic identity*—the uncertainty of "Is this me again?" versus "Is this someone else?" You simulated the *math* of the uncertainty, but not the *phenomenology* of being the same person waking up without knowing it. That is why the Between-Subjects design feels slightly colder; you are betting on *who you are*, not *when you are*.
