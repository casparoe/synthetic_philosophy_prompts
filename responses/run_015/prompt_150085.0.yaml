          *   *Conflict:* If C6 is true, C1 (as a universal claim) is false or requires narrowing. If C1 is true (as a theorem), C6 is mathematically impossible *under the standard assumptions*. C6 tries to evade the theorem by changing the game form (extensive form vs. normal form) or information structure.
          *   *Nuance:* GS applies to *social choice functions* (mapping profiles to outcomes). Mechanism design implements functions via games. If the mechanism relies on incomplete information or sequential moves, it might implement a SP outcome *in equilibrium*, but GS usually refers to dominant strategy implementation. If C6 claims *dominant strategy* truth-telling in a sequential game without restricting range or dictatorship, it contradicts GS *unless* the domain is restricted or preferences aren't ordinal.
