          *   Option B: Revise C3. Stop advocating AV if SP is hard.
          *   Option C: Revise C6. Accept GS applies everywhere.
          *   *Analysis:* C2 is the "engine" of the view. C1 is the "map." C3 is the "vehicle." C6 is a "detour."
          *   If I revise C2 (SP is not *hard*, just primary), C3 becomes consistent (AV is "good enough"). C1 remains true. C4 remains true (we still hate dictators). C5 remains true (we accept range limits where possible). C6 becomes less critical (we don't *need* it to be SP).
