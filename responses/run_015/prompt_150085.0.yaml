          *   Actually, C6 is the "black sheep." It claims to solve the impossibility that C1 says is impossible. C1+C2+C4 forces C5. C6 tries to say "Actually, sometimes we don't need C5." This undermines the logic of C1/C5.
          *   However, C2 vs C3 is a direct performative contradiction. "I require X. I propose Y. Y does not have X."
