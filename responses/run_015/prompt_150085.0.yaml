      *Self-Correction on C6:* C6 mentions "partial information disclosure." GS assumes complete information in the standard formulation (or rather, dominant strategies regardless of others' info). If the mechanism relies on *incomplete information* (Bayesian Implementation), GS doesn't apply directly. However, C6 claims "Strategy-proofness" which usually implies Dominant Strategy Incentive Compatibility (DSIC). If C6 means DSIC, it contradicts C1. If C6 means Bayesian Incentive Compatibility (BIC), it's consistent with C1 but uses different terminology. I should point out this ambiguity.

