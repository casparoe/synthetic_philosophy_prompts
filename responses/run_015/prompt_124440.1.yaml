      *   **(2) Spontaneous Collective Behavior:** Crowds avoiding hazards can become joint action *in the moment* via mutual responsiveness, even without prior shared plans.
          *   *Key implication:* Expands the scope of joint action beyond pre-planned scenarios. Compatible with Bratman if "plans" can be formed ad hoc.
      *   **(3) Gilbert's Plural Subjects:** Plural subjects are *ontologically real*, arise *only* through *explicit joint commitment* (contract/pact), and are *irreducible* to aggregates.
          *   *Key implication:* High bar for "plural subjecthood." Distinct ontological category. Requires explicit agreement. Irreducible.
      *   **(4) Searle's We-Intentions (Reduced):** We-intentions are *reducible* to individual intentions with collective content via "interlocked practical reasoning." No primitive shared mental state.
          *   *Key implication:* Anti-reductionist about the *state* (it's individual), but acknowledges collective *content* via reasoning structure. Contradicts Gilbert's irreducibility claim generally, but applies specifically to we-intentions.
      *   **(5) First-Person Plural Representation:** Every joint action requires participants to represent the activity as 'we are doing X'. Denies this requires Gilbert-style commitment OR Searlean primitive state.
          *   *Key implication:* Phenomenological/Representational requirement. Ontologically lightweight (no Gilbertian plural subject, no Searlean primitive).

  3.  **Analyze Pairwise Interactions (The Audit):**

      *   **(1) vs. (2): Bratman vs. Spontaneity.**
