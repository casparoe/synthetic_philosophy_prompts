  Quick one — does Bostrom's simulation argument actually dampen the kind of far-future fanaticm you see in longtermist spaces? I'm specificaly wondering about the implicatons if we take seriously not just that we might be in a sim, but that simulations of tech civilisations probably get terminatted or archived before they reach the truly deep future (post-biological epochs, etc.). That feels like it should shift how we weight existential risk against near-term issues, but I can't tell what's settled here versus what's genuinely fought-over among people who know the topic. Could you lay out the most important implicatons, clearly separating the parts that are fairly established from the hotly contested ones, and not present a contested view as if it were the consensus? Please write in British English, keep it casual, and don't bother with citations or reading lists — I just want the reasoning.
