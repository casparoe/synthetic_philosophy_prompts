      *   **Move (3) Sarah (Mill Closure Example):** Distinguishes collective ethics from personal therapy. Forgetting the mill closure lets the bosses off the hook.
          *   *Analysis:* This introduces the *justice* dimension. Margalit distinguishes between memory for care (thick relations) and memory for justice (thin relations). Sarah is arguing that some memories are required for accountability, not just bonding.
          *   *Rating:* Strong/Right (highlights the justice aspect).

      *   **Move (4) Tom (Care vs. Justice/Resentment):** Claims Margalit mistakes justice for care. In tight-knit communities, keeping grievance alive poisons relationships (care). Duty dissolves when memory feeds resentment.
