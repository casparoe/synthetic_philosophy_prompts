  6.  **Final Polish:** Organize into a clean, copy-pasteable format for the user. Ensure the "Meeting Cheat Sheet" summary is punchy. (Proceed to generate output based on these thoughts).

      *   *Wait, one more nuance:* The user asked for readings from bounded-rationality literature *not reducible* to the ones listed.
