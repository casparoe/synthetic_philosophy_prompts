  2.  **Deconstruct the Readings:**

      *   **Reading (i): Optimal Stopping (Search Costs).**
          *   *Claim:* Searching for the absolute best takes too long/costs too much relative to the marginal gain.
          *   *Validity:* Substantive and defensible (standard economics/decision theory).
          *   *Supports Colleague's Moves?*
              *   Skipping comparison? No. You need to compare to know when to stop.
              *   Skipping definition of "good"? No. You need a threshold to stop.
