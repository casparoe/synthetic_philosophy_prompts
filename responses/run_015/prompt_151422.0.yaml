answer: |-
  This is not a dumb question. You have isolated the precise metaphysical nerve that makes the Ship of Theseus a paradox rather than a puzzle. You are describing the tension between **intrinsic continuity** and **extrinsic competition**.

  The phenomenon you are describing has been isolated, named, and fought over in analytic metaphysics, particularly in the literature on **Personal Identity** (where it is often more acute) and **Sortal Persistence**.

  Here is the carving you asked for.

  ### 1. The Names
  There is no single noun for the *phenomenon* of the intuition shifting, but there are precise names for the **principle** causing it and the **metaphysical cost** of accepting it.

  *   **The Principle:** **The No-Branching Condition** (or **The Uniqueness Condition**).
      This is the rule your friends are implicitly applying. It states: *Object $A$ at $t_1$ is identical to Object $B$ at $t_2$ only if there is no other Object $C$ at $t_2$ that is equally or better qualified to be $A$.*
  *   **The Theory:** **The Closest Continuer Theory** (Robert Nozick) or **The Best Candidate Theory** (David Wiggins).
      These theories explicitly build the No-Branching Condition into the definition of identity. Identity is not just a matter of how much stuff/structure is preserved; it is a matter of being the *best* preserver among available competitors.
  *   **The Metaphysical Problem:** **The Extrinsic Determination of Identity**.
      This is the label for the uncomfortable consequence you noticed: that what happens to a pile of wood in a shed (extrinsic to the harbor ship) determines the identity of the harbor ship (intrinsic).

  ### 2. The Carving
  You asked for the edges of this concept. Here is how the literature (specifically Nozick, Wiggins, and Parfit) delineates the constraints of the **No-Branching Condition**.

  #### A. How good must the rival be?
  **Threshold:** The rival must meet a minimum threshold of continuity to count as a *candidate*. If the planks in the shed are rotting or assembled into a raft, they are not a "ship" candidate, and the harbor ship retains identity by default (Version A).
  **Competition:** If the rival meets the threshold, the harbor ship must be *closer* (more continuous) to the original to retain identity. If they are equal (exact reassembly vs. exact replacement), identity usually dissolves for *both*. This explains the stalling in Version B: neither ship wins the "best candidate" contest decisively.

  #### B. Actual vs. Possible?
  **Standard View:** The rival must be **actual**.
  If the planks in the shed *could* be reassembled but aren't, the harbor ship remains Theseus's ship. Identity is generally not held hostage by merely possible rivals (otherwise, almost no identity claims would hold, as a perfect replica is always *possible*).
  **Modal Exception:** In **Counterpart Theory** (David Lewis), identity is replaced by similarity relations across possible worlds. In that framework, "possible" rivals do matter, but that is a rejection of strict identity, not a feature of it. For your dinner guests, they are operating with a "Actual World Only" constraint.

  #### C. Contemporaneity?
  **Yes.** The rival must exist at the time of the judgment.
  This addresses your probe about the 200-year delay. If the shed planks are reassembled 200 years later, *after* the harbor ship has rotted, the harbor ship *was* Theseus's ship during its life. The later reassembly does not retroactively break the identity chain (unless you hold a very strong view that identity is timeless).
  However, if the reassembly happens *while* the harbor ship is still sailing, the branching occurs, and identity becomes indeterminate.

  #### D. What happens with three rivals?
  **Dilution.**
  If you have the Harbor Ship, the Shed Ship, and a Third Ship (made of 50% old planks, 50% new), the identity of the original is further diluted. Under Closest Continuer Theory, if there is a tie for "closest," identity fails. If there are three candidates, it is less likely one is uniquely "closest." The intuition shifts from "It is the ship" to "It is *a* successor."

  ### 3. Distinction from Vagueness
  You asked how this differs from ordinary vagueness or "no fact of the matter." This is the crucial distinction.

  *   **Vagueness (Sorites):** Concerns the *boundaries* of a single object. (e.g., "At which plank replacement did it stop being the same ship?") In your Version A, your friends reject vagueness. They say, "It is definitely the ship," regardless of the plank count.
  *   **Competition (Branching):** Concerns the *uniqueness* of the relation.
      *   In Version A, the relation is **one-to-one**. (Original $\to$ Harbor Ship).
      *   In Version B, the relation is **one-to-many**. (Original $\to$ Harbor Ship + Shed Ship).
      *   The "stalling" isn't because they can't find the boundary; it's because the concept of "identity" includes a **uniqueness constraint**. We do not say "This is the same ship" if there are two of them. We say "These are *successor* ships."

  The hesitation in Version B is not epistemic (we don't know); it is ontological (the conditions for the word "same" are not met).

  ### 4. Why It Feels Like a "Wrinkle" (The Metaphysical Cost)
  The reason this bothers you (and your friends) is that it violates a deep intuition about **Intrinsicness**.

  We generally believe that what an object *is* depends on its own history and constitution, not on what is happening to other objects elsewhere.
  *   **Intrinsic View:** If the harbor ship has continuous existence, it is the Ship of Theseus. Period. The shed planks are just wood.
  *   **Extrinsic View (Nozick/Wiggins):** Being the Ship of Theseus is a *role* or a *title* that is awarded to the best candidate. If a better candidate appears, the title is revoked.

  Your friends' shift in confidence reveals that they are **implicit Externalists** about identity. They treat "Same Ship" not as a physical fact, but as a legal title that cannot be held by two entities simultaneously.

  ### 5. Summary Definition
  If you need a label for your dinner game to cut through the noise, use this:

  > **The Branching Constraint on Identity:**
  > The judgment that $X$ is the same entity as $Y$ is not determined solely by the continuity between $X$ and $Y$, but is contingent on the absence of a rival $Z$ that possesses equal or greater continuity with $Y$.
  >
  > **Implication:** Diachronic identity is **extrinsically determined**. It can be broken not by damage to the object, but by the construction of a competitor.

  ### 6. The "Reduplication Argument"
  If you want to drop a philosophical heavy weight on the table, mention **The Reduplication Argument** (associated with Bernard Williams and Derek Parfit).
  They used this exact logic to argue against psychological continuity in persons. If your brain is copied into two bodies, and the original is destroyed, the copy is you. But if the original *survives*, the copy is *not* you. Therefore, your identity depends on whether someone else is walking around with your memories.
  Most people find this conclusion absurd (how can my existence depend on someone else's death?), which leads many philosophers to reject the Closest Continuer Theory in favor of **Perdurantism** (the ship is a 4D worm, and both the harbor and shed ships are different temporal parts) or **Eliminativism** (there is no "ship," only planks arranged ship-wise).

  ### Recommendation for the Game
  When your friends stall on Version B, point out that they are treating "Ship of Theseus" as a **unique role** rather than a **physical description**.
  *   Ask: "If I tell you the shed planks were burned five minutes ago, do you change your answer about the harbor ship?"
  *   If they say "Yes," they have admitted that the harbor ship's identity is extrinsic.
  *   If they say "No," they have admitted that the reassembly creates a *new* ship, and the harbor ship keeps the title by right of continuous possession (a "Lockean" labor/possession view).

  The wrinkle you found is the **Extrinsic Determination of Identity**. It is the specific cost of solving the paradox by prioritizing uniqueness over continuity.
