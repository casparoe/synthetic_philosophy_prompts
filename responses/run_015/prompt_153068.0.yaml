answer: |-
  # MODAL EPISTEMOLOGY DIAGNOSTIC INSTRUMENT

  **NOTE ON MODALITY:** This instrument tracks **Metaphysical Possibility** (ways the world could have been).
  *Alert:* Some resulting positions (specifically Leaf C) will implicitly shift to **Epistemic Possibility** or **Primary Intensions** to maintain consistency. This switch is flagged in the Key.

  ---

  ## THE DECISION TREE

  **START**

  **NODE 1: The Eighth-Sense Case (Failure Symmetry)**
  *Case:* A creature has a sensory modality you lack. You cannot form any mental image or conception of its experience.
  *Question:* Does your **inability** to conceive this experience count as evidence that the experience is **impossible**?
  *   **(A) Yes:** Your failure is evidence of impossibility. → Go to NODE 2.
  *   **(B) No:** Your failure is just a limit of your cognition. → Go to NODE 3.

  **NODE 2: The Math Case (Positive Strength)**
  *Case:* A peer claims to clearly and distinctly conceive that **2+2=5**.
  *Question:* Has this peer identified a **genuine metaphysical possibility**?
  *   **(A) Yes:** Conceivability entails possibility, even here. → **LEAF 1 (Paraconsistent/Radical Rationalist)**
  *   **(B) No:** They are confused. → Go to NODE 3.

  **NODE 3: The Water Case (Information State A)**
  *Case:* Imagine a thinker who **does not know** that water is H₂O. They conceive that water is not H₂O.
  *Question:* For this thinker, is "Water is not H₂O" **possible**?
  *   **(A) Yes:** It is possible for them. → Go to NODE 4.
  *   **(B) No:** It is impossible, even for them. → Go to NODE 5.

  **NODE 4: The Water Case (Information State B)**
  *Case:* The same thinker **learns** that water is H₂O. They still feel they can conceive water is not H₂O.
  *Question:* Does this new information **retroactively make their earlier conception mistaken**?
  *   **(A) No:** The earlier conception tracked a genuine possibility (of a sort). → **LEAF 2 (Two-Dimensionalist)**
  *   **(B) Yes:** The earlier conception was an illusion of possibility. → Go to NODE 5.

  **NODE 5: The Zombie Case (Veridicality)**
  *Case:* You clearly conceive of a **Philosophical Zombie** (physical duplicate, no experience).
  *Question:* Does this conception **settle** the matter (give you knowledge), or does it merely **suggest** it pending further metaphysical work?
  *   **(A) Settle:** You now know it is possible. → Go to NODE 6.
  *   **(B) Suggest:** It is a defeasible reason only. → Go to NODE 7.

  **NODE 6: The Table Case (Essentialism)**
  *Case:* This table is made of wood. You conceive of **this very table** being made of ice.
  *Question:* Is this a possibility of **this object**, or only of a qualitatively identical **different object**?
  *   **(A) This Object:** Origin/Material is not essential. → **LEAF 3 (Straight Modal Rationalist)**
  *   **(B) Different Object:** Origin/Material is essential. → **LEAF 4 (Kripkean Gap)**

  **NODE 7: The Defeasibility Case (Override)**
  *Case:* You conceive of a scenario, but a trusted **modal theory** tells you it involves a hidden contradiction.
  *Question:* Do you reject the conception because of the **theory**, or reject the theory because of the **conception**?
  *   **(A) Reject Theory:** Conception is the final court of appeal. → Go to NODE 8.
  *   **(B) Reject Conception:** Theory overrides intuition. → **LEAF 5 (Defeasible Guide)**

  **NODE 8: The Scope Case (Skepticism)**
  *Case:* Consider **substantive metaphysical claims** (e.g., about time, persistence, or God).
  *Question:* Does conceivability provide **any justification** here, or only for trivial/semantic cases?
  *   **(A) Yes:** It works for substantive cases too. → **LEAF 3 (Straight Modal Rationalist)**
  *   **(B) No:** It buys you nothing past the trivial. → **LEAF 6 (Modal Skeptic)**

  ---

  ## FACILITATOR KEY & LOGICAL SPACE ANALYSIS

  ### Path Mapping to Literature Positions

  | Path Sequence | Resulting Leaf | Standard Label | Notes on Modal Sense |
  | :--- | :--- | :--- | :--- |
  | **1A → 2A** | **Leaf 1** | **Paraconsistent / Radical Rationalist** | Metaphysical. (Rare: accepts impossible worlds as possible). |
  | **1B → 3A → 4A** | **Leaf 2** | **Two-Dimensionalist (Chalmers-style)** | **Switches:** "Possible" at 4A refers to *Epistemic/Primary Intension*, not Metaphysical. |
  | **1B → 3A → 4B → 5A → 6A** | **Leaf 3** | **Straight Modal Rationalist** | Metaphysical. (Conceivability entails Possibility, no gap). |
  | **1B → 3A → 4B → 5A → 6B** | **Leaf 4** | **Kripkean / Necessary A Posteriori** | Metaphysical. (Accepts a gap between C and P in identity cases). |
  | **1B → 3B → 5B → 7B** | **Leaf 5** | **Defeasible Guide (Moderate)** | Metaphysical. (C is evidence, but theory/identity can override). |
  | **1B → 3B → 5B → 7A → 8B** | **Leaf 6** | **Modal Skeptic (Van Inwagen-style)** | Metaphysical. (C is inert for substantive claims). |

  ### Logical Space & Unoccupied Combinations

  The tree is built on three independent variables: **Symmetry** (Does ~C prove ~P?), **Idealization** (Does info matter?), and **Strength** (Does C entail P?).

  **1. The "Symmetric Skeptic" (Unoccupied: Incoherent)**
  *   *Path:* Node 1 (Yes) + Node 8 (No).
  *   *Description:* "My failure to conceive proves impossibility, but my success to conceive proves nothing."
  *   *Diagnosis:* **Moore's Paradox of Modality.** If failure is evidence of impossibility, success must be evidence of possibility, or the faculty is broken. If the faculty is broken, failure is noise, not evidence. This position is pragmatically unstable.

  **2. The "Veridical Gap" (Unoccupied: Contradictory)**
  *   *Path:* Node 5 (Settle) + Node 4 (Yes, Mistaken).
  *   *Description:* "Conceiving settles possibility, but sometimes we conceive impossibilities (like Water≠H₂O) and are wrong."
  *   *Diagnosis:* **Logical Contradiction.** Unless you adopt the Two-Dimensional move (Leaf 2), you cannot claim C entails P while admitting C sometimes targets P-impossible states. Leaf 2 is the *only* way to occupy this space without contradiction.

  **3. The "Inert Rationalist" (Unoccupied: Unattractive)**
  *   *Path:* Node 2 (No, Math is necessary) + Node 5 (Settle, Zombies).
  *   *Description:* "Conceiving doesn't help with logic, but it settles metaphysics."
  *   *Diagnosis:* **Epistemically Unmotivated.** Usually, if one trusts conceivability for metaphysics (Zombies), one trusts it for logic (Math). Restricting it to the contingent/metaphysical while denying it for the necessary requires an ad-hoc restriction on the faculty.

  ### Missing Leaves & Additions

  **1. Modal Empiricism (Added to Analysis)**
  *   *Location:* Near Leaf 5 (Defeasible), but distinct.
  *   *View:* Possibility is known *only* via recombination of actuality, not conceivability.
  *   *Why Missing:* The tree focuses on *Conceivability* as the input. An Empiricist would answer "Inert" at Node 5 and Node 8. They collapse into Leaf 6 (Skeptic) regarding *conceivability*, even if they believe we know possibility other ways.
  *   *Action:* Treat Leaf 6 as "Conceivability Skeptic," which allows Empiricists to land there without committing to global skepticism.

  **2. Indistinguishable Leaves (Flag)**
  *   **Leaf 3 (Straight Rationalist) vs. Leaf 2 (2D):**
      *   *The Problem:* On the "Zombie" case (Node 5), both say "Settles."
      *   *The Split:* They are only pulled apart by the **Water/Information** nodes (3 & 4). If a participant refuses to engage with the Water case (claiming it's semantic), Leaf 2 and Leaf 3 become functionally identical regarding Zombies.
      *   *Diagnostic Note:* If a student says "Water is just language," force them to Node 6 (Table). If they say Table origin is essential, they are effectively Kripkean (Leaf 4) despite their Rationalist claims.

  ### Instructions for Use
  1.  **Print:** Single-sided.
  2.  **Run:** Have students trace their path silently.
  3.  **Debrief:** Do not reveal the "Standard Labels" immediately. Ask students at Leaf 4 and Leaf 2 to compare their answers on Node 4. This forces the "Information" wrinkle into the open without naming Kripke or Chalmers.
  4.  **Warning:** If a student circles both Yes and No, they are likely conflating *Epistemic* and *Metaphysical* possibility. Use the Header Note to intervene.
