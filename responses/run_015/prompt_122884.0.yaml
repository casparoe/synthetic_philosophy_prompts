prompt: |-
  Hi — I write the public-facing label copy for a small archaeology museum, 60 to 80 words a pop. Over the next few months we're doing three rooms back to back: one on Troy and the late Bronze Age Aegean, one on King Arthur and post-Roman Britain, one on the Exodus and Egypt. Each room needs maybe 25 labels, and basically every one of them forces the same decision: how strongly am I allowed to commit to a claim about something that might be history, might be legend, or might be a story that later grew around a real place, a real ruin, or a real name. My problem isn't ignorance of the material, it's that I have no consistent way of setting the level of commitment, so right now it's my mood on the day, then our curator (great guy, zero theory background, just asks "are we sure?") signs off, then the director reads it and wants to know why the Troy room says "probably" while the Arthur room says "in the story".

  So I want a procedure. Something I can run in about ten minutes per label, in a fixed order, with a stopping rule.

  The bit I keep tripping over is that three things get collapsed into one and I need the procedure to hold them apart: (a) the thing happened; (b) something happened and people kept talking about it, more or less accurately, for generations before anyone wrote it down; (c) somebody composed a story, and the story then got attached to a real hill, a real destruction layer, a real name in an inscription. Some specific traps the procedure has to handle rather than hand-wave:

  - The anchoring trap: a story is set at a site we've actually dug, and there's a destruction layer roughly in the right century, or the hero's name shows up in an inscription more or less contemporary with the events. I suspect that tells me something about what the storytellers needed, not necessarily about the event, but I can't say when.
  - Silence: no Egyptian record of the Israelites, no contemporary source naming Arthur. When is an absence allowed to count and when is it just an absence?
  - Awkward or embarrassing details: the move where you say the tellers would never have invented this. And the countermove, that a tradition can manufacture awkwardness precisely to feel authentic. Also doublets — two variant versions of what looks like one episode — do they count for or against?
  - Independent attestation: two sources saying the same thing, and the question of when they're actually independent.
  - Majority expert consensus against something a large chunk of our visitors are dead certain is true.
  - The religious case vs the secular case: museum policy is we never say a treasured story is false, but we also can't write labels implying historians back it when they don't. So somewhere in here there's a line between what evidence can warrant and what the story means to people, and I need the procedure to stop at that line and hand it to a human.

  Deliverable: a small ladder of commitment levels, maybe four to six rungs, with canned phrasings for each rung in plain visitor English; the tests, in order, that sort a claim onto a rung; where the procedure just stops with no; and where it has to kick the decision to a person because it's a values question. Be explicit about which distinctions survive being simplified for someone with no theory and which you're dropping and why.

  Then run it on three of my actual drafts. Don't spare my feelings on the first one, I really like that line and I'll defend it if it deserves defending:

  1. Troy: "The Trojan War was real — the Greeks really did sail against this city and burn it, just as Homer says."
  2. Arthur: "Behind the knights and the round table there was probably a real Roman-British war leader, though we'll never know his name." The local tourism people love this one.
  3. Exodus: a label where the board wants nothing that "denies anyone's faith", and my current draft opens "there is no evidence that any of this happened".

  For each: show the tests actually firing, give me the resulting label in the house voice, and tell me which rung it lands on and which single test decided it.

  Finally, be honest about where this thing will misfire: what kind of claim it systematically over-hedges or under-hedges, whether it does anything useful when every source we have is literary, and what I should do on the days when my curator and I disagree about a rung. No bibliography, no citations, I don't care who originated which criterion — I need to be able to run it on a Tuesday afternoon.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Public-facing label writer for a small archaeology museum.
      *   **Task:** Create a consistent procedure (ladder of commitment levels + tests) for writing labels about history/legend/myth (Troy, Arthur, Exodus).
      *   **Constraints:** 60-80 words per label (though the procedure itself isn't limited to that, the output must be usable for that format). 10 minutes per label max. Fixed order, stopping rule.
      *   **Core Problem:** Inconsistent commitment levels (mood-based) causing friction with Curator and Director. Need to distinguish between (a) it happened, (b) something happened + oral tradition, (c) story attached to real place/name.
      *   **Specific Traps to Handle:** Anchoring (real site/destruction), Silence (lack of records), Awkward Details (criterion of embarrassment), Independent Attestation, Consensus vs. Public Belief, Religious vs. Secular sensitivity.
      *   **Deliverables:**
          1.  A ladder of commitment levels (4-6 rungs) with canned phrasing.
          2.  A decision procedure (tests in order, stopping rules).
          3.  Explicit handling of the "kick to human" moment (values vs. evidence).
          4.  Application to three specific draft labels (Troy, Arthur, Exodus).
          5.  Honest assessment of limitations (where it misfires, curator disagreements).
      *   **Tone:** Practical, no-nonsense, "Tuesday afternoon" usable. No bibliography.

  2.  **Deconstruct the Core Problem (The Three Collapsed Things):**
      *   (a) Event happened as described.
      *   (b) Kernel of truth + oral tradition distortion.
      *   (c) Fiction attached to reality (e.g., a real hill gets a story).
      *   *Challenge:* Archaeology rarely proves (a). It often supports (c). (b) is the hardest to prove.
      *   *Solution:* The ladder needs to reflect *evidentiary weight*, not ontological truth.

  3.  **Drafting the Ladder of Commitment (The Rungs):**
      *   Need 4-6 levels.
      *   Level 1: Fact (Archaeological/Historical consensus).
      *   Level 2: Highly Probable (Strong evidence, minor gaps).
      *   Level 3: Possible Kernel (Tradition aligns with some data, but story is embellished).
      *   Level 4: Tradition/Legend (Story exists, evidence is thin/absent, but site is real).
      *   Level 5: Symbolic/Meaning (No evidence for event, focus on impact).
      *   *Refinement:* Let's make the phrasing visitor-friendly.
          *   Rung 1: "We know..." (Confirmed)
          *   Rung 2: "Evidence suggests..." (Probable)
          *   Rung 3: "Stories tell us... archaeology shows..." (Mixed/Kernel)
          *   Rung 4: "According to legend..." (Story only)
          *   Rung 5: "For believers/visitors..." (Faith/Meaning)
      *   *Wait, the prompt asks for distinctions between (a), (b), (c).*
      *   Let's align the rungs to the user's specific distinction problem.
      *   Rung 1: Event Confirmed (a).
      *   Rung 2: Event Probable (a/b border).
      *   Rung 3: Kernel Likely (b).
      *   Rung 4: Story Anchored (c).
      *   Rung 5: Meaning Only (Faith/Culture).
      *   *Actually, keep it simpler for the "10-minute rule".*
      *   Let's go with:
          1.  **Confirmed:** Direct evidence.
          2.  **Likely:** Strong indirect evidence.
          3.  **Possible Kernel:** Story matches *some* data (destruction layer, name).
          4.  **Tradition:** Story exists, no external evidence.
          5.  **Meaning:** Faith/Identity focus (No historical claim).

  4.  **Developing the Procedure (The Tests):**
      *   Needs to be a flowchart in text form.
      *   *Test 1: Direct Contemporary Evidence?* (Inscriptions, records). If yes -> Rung 1 or 2.
      *   *Test 2: Archaeological Correlation?* (Destruction layer, artifacts). If yes -> Rung 3.
      *   *Test 3: Source Independence?* (Multiple traditions). If yes -> Boost confidence.
      *   *Test 4: The Silence Check.* (Should there be a record?). If no record where expected -> Downgrade.
      *   *Test 5: The Faith/Values Check.* (Does this offend/deny core belief?). If yes -> Kick to Director/Board.
      *   *Stopping Rule:* If you hit the Faith Check, stop. If you hit Direct Evidence, stop.

  5.  **Refining the "Traps":**
      *   *Anchoring:* Real site + Story = Rung 4 (Story Anchored), not Rung 3 (Kernel), unless the destruction *matches* the story specifics (e.g., fire vs earthquake).
      *   *Silence:* Absence of evidence is only evidence of absence if we *expect* a record (e.g., Egyptian bureaucracy vs. nomadic tribes).
      *   *Awkward Details:* Useful for Rung 3, but don't overvalue.
      *   *Consensus:* Follow the consensus for the label, acknowledge the belief in the "Meaning" section if needed.
      *   *Religious:* This is the "Kick to Human" point.

  6.  **Drafting the Application (The Three Labels):**
      *   *Label 1 (Troy):* "The Trojan War was real..."
          *   Test: Direct evidence? No. Destruction layer? Yes (Troy VIIa). Match specifics? No (Homer is centuries later).
          *   Verdict: Over-committed. Needs downgrade to Rung 3 or 4.
      *   *Label 2 (Arthur):* "...probably a real Roman-British war leader..."
          *   Test: Direct evidence? No. Silence? Yes (Gildas doesn't name him). Anchor? Maybe (Badon Hill?).
          *   Verdict: Rung 3 is generous, Rung 4 is safer. "Probably" is risky without consensus.
      *   *Label 3 (Exodus):* "there is no evidence that any of this happened".
          *   Test: Faith Check. This triggers the "Kick". Cannot state negative absolute on faith matter in this context.
          *   Verdict: Needs shift to Rung 5 (Meaning) or Rung 4 (Tradition) without negating faith.

  7.  **Addressing the "Honest Assessment" (Limitations):**
      *   Where will it misfire? Nuance loss. "Possible Kernel" sounds like "Kinda Real" to visitors.
      *   Literary sources only? Hard to distinguish (b) and (c).
      *   Curator disagreement? Escalation path needed.

  8.  **Review against Constraints:**
      *   10 minutes per label? Yes, the test list is short.
      *   Fixed order? Yes.
      *   Stopping rule? Yes (Faith check).
      *   Canned phrasing? Yes.
      *   No bibliography? Yes.
      *   Tone? Professional, direct.

  9.  **Final Polish:**
      *   Make sure the distinction between (a), (b), and (c) is clear in the Rungs.
      *   Ensure the "Kick to Human" is explicit for the Religious/Values case.
      *   Check the word count on the *advice*, not the labels (labels need to be 60-80 words in the *example* output).
      *   *Self-Correction on Label 3:* The prompt says "board wants nothing that denies anyone's faith". My procedure needs to respect that policy constraint while maintaining integrity. The solution is shifting from *historical claim* to *tradition claim*.

  10. **Finalizing the Ladder:**
      *   Rung 1: **Fact.** (We have the receipt).
      *   Rung 2: **Consensus.** (Historians agree, evidence is strong).
      *   Rung 3: **Echo.** (Story matches some hard data, e.g., fire layer).
      *   Rung 4: **Tradition.** (Story exists, data is silent).
      *   Rung 5: **Meaning.** (Truth is in the belief, not the dirt).
      *   *Wait, I need to make sure the "Kick" happens before Rung 5 if it's controversial.*
      *   Let's integrate the "Kick" as a gate before writing.

      *(Self-Correction during drafting)*: Keep the ladder strictly about *evidentiary commitment*. The "Faith" issue is a separate gate.
      *   Gate 0: Faith/Values Check.
      *   Rung 1-5: Evidence.

      *Let's refine the "Tests".*
      1.  Contemporary Record?
      2.  Archaeological Match?
      3.  Silence Explained?
      4.  Consensus Check.

      *Okay, ready to write.*

      *Wait, one more thing:* The user wants to know *which distinction survives simplification*.
      *   Surviving: (a) vs (c). (Fact vs Story).
      *   Dropping: (b) vs (c). (Kernel vs Attached Story). Why? Because archaeology rarely distinguishes them reliably. It's safer to group them as "Story matches some data."

      *Let's build the response.*
answer: |-
  Here is the procedure. It is designed to be run in under ten minutes. It prioritizes consistency over nuance, because your Director needs consistency more than they need nuance.

  ### The Commitment Ladder (5 Rungs)

  Use these exact phrases for the core claim in your label. They map to your three categories: (a) Event, (b) Kernel, (c) Story.

  *   **Rung 1 (Confirmed):** "We know..." / "Records show..."
      *   *Meaning:* Contemporary written or physical proof exists. (a)
  *   **Rung 2 (Historical Consensus):** "Historians agree..." / "Evidence indicates..."
      *   *Meaning:* No direct proof, but expert agreement is near-total based on strong indirect data. (a/b)
  *   **Rung 3 (Anchored Tradition):** "Stories tell us... archaeology shows..."
      *   *Meaning:* The narrative matches *some* physical data (destruction layer, name in inscription), but details are unverified. (b/c border)
  *   **Rung 4 (Legend):** "According to legend..." / "In the story..."
      *   *Meaning:* The story is old and important, but external evidence is absent or contradicts it. (c)
  *   **Rung 5 (Meaning):** "For generations, people have..." / "This story matters because..."
      *   *Meaning:* Historical truth is unknowable or secondary to cultural/religious significance. (Values)

  ---

  ### The Procedure (The 10-Minute Test)

  Run these tests in order. Stop at the first match.

  **Gate 0: The Faith & Values Check (Stop Rule)**
  *   **Question:** Does stating the lack of evidence directly contradict a core tenet of a living religious group represented in our community?
  *   **If YES:** Do not write a historical claim. Skip to **Rung 5**. *Kick to Director for approval on the phrasing.*
  *   **If NO:** Proceed to Test 1.

  **Test 1: The Contemporary Record**
  *   **Question:** Is there a contemporary inscription, record, or artifact that names the specific event/person?
  *   **If YES:** **Rung 1**.
  *   **If NO:** Proceed to Test 2.

  **Test 2: The Archaeological Anchor**
  *   **Question:** Is there a destruction layer, artifact, or site feature that matches the *time and place* of the story (even if not the details)?
  *   **If YES:** **Rung 3**. (Note: This handles the "Anchoring Trap." A destruction layer proves a city fell, not *why*.)
  *   **If NO:** Proceed to Test 3.

  **Test 3: The Silence Check**
  *   **Question:** If this event happened as described, would we *expect* a record (e.g., Egyptian bureaucracy vs. nomadic tribes)?
  *   **If YES (We should have a record but don't):** Downgrade one rung (e.g., from 3 to 4).
  *   **If NO (Silence is expected):** Maintain current trajectory. Proceed to Test 4.

  **Test 4: The Consensus Check**
  *   **Question:** Is there a strong majority expert consensus (80%+) that a specific historical kernel exists?
  *   **If YES:** **Rung 2**.
  *   **If NO:** **Rung 4**.

  ---

  ### What This Simplifies (And What It Drops)

  *   **Survives:** The distinction between **Fact (Rung 1-2)** and **Story (Rung 4-5)**. Your Director can see the difference between "We know" and "According to legend."
  *   **Survives:** The distinction between **Anchored (Rung 3)** and **Unanchored (Rung 4)**. This solves your Troy problem (destruction layer exists) vs. Arthur problem (no site confirmed).
  *   **Dropped:** The distinction between **Kernel (b)** and **Attached Story (c)**. Archaeology rarely proves a "kernel" without proving the "story." Grouping them at Rung 3 prevents you from over-promising on "oral tradition accuracy."
  *   **Dropped:** **Criterion of Embarrassment/Doublets.** These are literary analysis tools, not archaeological ones. They take too long to verify and confuse visitors. If it doesn't show up in the dirt or contemporary records, it doesn't raise your Rung.

  ---

  ### Application to Your Drafts

  Here is the procedure firing on your three examples.

  #### 1. Troy Draft
  > *Draft:* "The Trojan War was real — the Greeks really did sail against this city and burn it, just as Homer says."

  *   **Gate 0:** No religious conflict. Proceed.
  *   **Test 1 (Contemporary Record):** No Greek records from the Late Bronze Age name the war. **Fail.**
  *   **Test 2 (Archaeological Anchor):** Yes. Troy VIIa shows destruction by fire/sack c. 1180 BCE. **Match.**
  *   **Result:** **Rung 3 (Anchored Tradition).**
  *   **Critique:** Your draft is Rung 1 ("was real... just as Homer says"). This is factually unsupported. Homer is centuries later.
  *   **Revised Label (68 words):**
      > "According to legend, a great war destroyed this city. Archaeology confirms a violent end around 1180 BCE: burnt buildings, unburied bones, and arrowheads match the story's time and place. But Homer wrote centuries later. We cannot know if heroes like Achilles fought here, only that a conflict occurred. The ruins remember the fire; the poems remember the names."
  *   **Deciding Test:** Test 2. (Anchor exists, but details don't).

  #### 2. Arthur Draft
  > *Draft:* "Behind the knights and the round table there was probably a real Roman-British war leader, though we'll never know his name."

  *   **Gate 0:** No religious conflict. Proceed.
  *   **Test 1 (Contemporary Record):** No. Gildas (contemporary) mentions a battle but no name. **Fail.**
  *   **Test 2 (Archaeological Anchor):** No specific site linked definitively to Arthur. **Fail.**
  *   **Test 3 (Silence):** We might expect records for a "war leader," but post-Roman Britain is poorly documented. Silence is ambiguous.
  *   **Test 4 (Consensus):** No. Historians are split 50/50 on existence.
  *   **Result:** **Rung 4 (Legend).** Your draft claims Rung 2/3 ("probably a real... leader").
  *   **Revised Label (72 words):**
      > "According to legend, a great leader united the Britons against invaders. Later stories added knights and magic. Historians debate whether a real commander inspired these tales. No contemporary records name him, and no battlefield is confirmed. Yet the story endured. Whether a man or a myth, Arthur became a symbol of resistance. The history is uncertain, but the hope he offered was real to those who told the tale."
  *   **Deciding Test:** Test 4. (Lack of Consensus forces Rung 4).

  #### 3. Exodus Draft
  > *Draft:* "there is no evidence that any of this happened"

  *   **Gate 0:** **STOP.** This contradicts a core tenet of Jewish and Christian faith.
  *   **Result:** **Rung 5 (Meaning).** *Kick to Director.*
  *   **Critique:** Your draft is scientifically accurate but violates museum policy on faith. You must shift from historical claim to cultural claim.
  *   **Revised Label (75 words):**
      > "For generations, this story has defined a people's identity. Archaeologists have found no direct evidence of a mass migration in this period, and Egyptian records do not mention it. Yet the narrative remains central to faith and culture. Whether read as history or sacred truth, the Exodus shaped laws, holidays, and hopes for freedom. This room explores the land they left; the story they carried is kept in hearts and texts."
  *   **Deciding Test:** Gate 0. (Values Check overrides evidence).

  ---

  ### Where This Will Misfire (Honest Assessment)

  1.  **The "Rung 3" Trap:** Visitors will read "Archaeology shows..." (Rung 3) as "The story is true." You cannot fix this with words. You must rely on the second sentence of the label to clarify the gap (as done in the Troy example).
  2.  **Literary-Only Claims:** If you have two literary sources but no dirt (e.g., specific battles in Arthur), Test 2 fails. You drop to Rung 4. This feels harsh to literary historians, but for an *archaeology* museum, dirt is the currency. Stick to the rule.
  3.  **Curator Disagreement:** If your Curator says "I feel Test 2 passed" and you say "It didn't," do not argue theory.
      *   **The Tie-Breaker:** Ask: "Can we point to an object in a case that proves this?" If the answer is "No," or "Well, it's nearby," you stay at the lower Rung.
      *   **Escalation:** If the Curator insists on a higher Rung than the procedure allows, mark the label "Curator Override" in your internal files. This protects you when the Director asks why the wording changed.

  **Final Note:** This procedure will make your labels feel more cautious than you want. That is the point. It shifts the burden of proof from the visitor's belief to the museum's evidence. Run the tests, pick the rung, paste the phrase. Move to the next label.
