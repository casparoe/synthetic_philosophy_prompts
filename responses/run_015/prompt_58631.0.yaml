answer: |-
  **The Charity Dilemma**

  **Option A (Bednets):** Costs $10k. Saves 100 lives guaranteed. Risk: 0.0001% (1 in 1,000,000) chance of logistical failure causing 50,000 deaths.
  *EV:* $100 - (0.000001 \times 50,000) = 99.95$ lives.

  **Option B (Policy Reform):** Costs $10k. 0.001% (1 in 100,000) chance of legislation saving 2,000,000 lives. Otherwise 0.
  *EV:* $0.00001 \times 2,000,000 = 20$ lives.

  **Verdicts:**
  **EV Fanatic:** Compares 99.95 vs 20. Chooses **Option A** (Cautious).
  **Normal Person:** Ignores probabilities < 0.001% (1 in 100,000).
  Sees Option A risk as 0 (Value: 100).
  Sees Option B chance as real (Value: 2,000,000).
  Chooses **Option B** (Moonshot).

  ***

  **Analysis**

  **Work Verification:**
  The Fanatic sums probability-weighted outcomes: $100 - 0.05 = 99.95$ (Safe) vs $20$ (Moonshot). $99.95 > 20$, so they pick Safe.
  The Normal agent zeroes probabilities below $10^{-5}$. Option A's risk ($10^{-6}$) becomes 0; Option B's success ($10^{-5}$) remains. They compare 100 vs 2,000,000 and pick Moonshot.

  **The Flipping Detail:**
  The specific probability threshold ($10^{-5}$) sits *between* the Safe option's risk ($10^{-6}$) and the Moonshot's success ($10^{-5}$). This allows the Normal person to discard the Safe downside while keeping the Moonshot upside.

  **If Deleted:**
  If the Normal person calculated exact EV (deleted the heuristic), they would choose Safe (99.95 > 20). If the Safe risk were $10^{-4}$ (above threshold), the Normal person would also choose Safe to avoid the perceived catastrophe.

  **Fanatic's Complaint:**
  "The case is rigged by aligning the cognitive cutoff exactly between the two probabilities. You're exploiting human numerical blindness to make risk-seeking look rational, while ignoring the actual expected disvalue of the Safe option's tail risk."
