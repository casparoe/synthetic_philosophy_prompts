      *   Implication for authority: If they are different persons, the earlier self's authority over the later self is weakened or non-existent.

  3.  **Analyze the 'Rolling Directive' Scenario:**
      *   It's dynamic, not static.
      *   It relies on AI inference, not explicit autobiographical memory.
      *   The link is causal/predictive (based on prior values), not necessarily mnemonic (remembered by the patient).
      *   Conflict: Happy demented patient vs. AI proxy recommending based on prior values.

  4.  **Drafting - Section by Section:**

      *   *Introduction:* Acknowledge the student's intriguing twist. Set the stage with Locke.
      *   *Locke's Core Move:* Explain consciousness/memory as the basis of identity. If memory breaks, identity breaks.
      *   *Applying to Static Directives:* Briefly touch on this (the 'different person' problem).
      *   *Applying to the AI Rolling Directive:* This is the crux.
          *   Does the AI bridge the gap? Locke cares about *consciousness*, not external records.
