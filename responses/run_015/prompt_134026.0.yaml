answer: |-
  Here is the spec you asked for. It's designed to force the physicist and the philosopher to stop talking past each other by separating the hard constraints of physics from the metaphysical preferences of semantics.

  ### The Spec: Theory of Symbol-Level vs. Substrate-Level Causation

  **1. Physical Causal Closure (Non-negotiable)**
  *   **The Requirement:** Every physical event in the careenium must have a sufficient physical cause within the prior physical state. No energy or information enters from outside the physical chain.
  *   **The Case:** Conservation laws. If symbol-level facts pushed simmballs around without a physical antecedent, you'd violate conservation of energy or momentum. The physicist wins this round by default; any theory violating this is magic.

  **2. Semantic Sensitivity / Misrepresentation (Non-negotiable)**
  *   **The Requirement:** The theory must explain how a system acts differently based on what a symbol *means*, even when that meaning is false (e.g., the system avoids a "predator" symbol that doesn't correspond to a real predator).
  *   **The Case:** A thermostat turns on heat because it "believes" it's cold, even if the sensor is broken. A purely physical description sees only voltage thresholds; it misses the error. If the theory can't handle false beliefs causing real moves, it fails to capture the "symbol" part of simmball.

  **3. Explanatory Leverage vs. Shadow Relevance (Contested)**
  *   **The Requirement:** The symbol-level description must do work that the substrate description cannot practically or principledly do (your "leverage"), rather than just tracking the substrate (your "shadow relevance").
  *   **The Case:** Predicting a chess move by analyzing electron flow is impossible in practice; predicting it by "threats" and "goals" works.
  *   **Status:** **Physicist's Prejudice:** This is just bookkeeping convenience; the electrons do the work. **Philosopher's Prejudice:** The pattern itself constrains the outcome. Mark this as the primary battleground: is leverage ontological or epistemic?

  **4. Domain Neutrality (Non-negotiable)**
  *   **The Requirement:** The account must scale from a thermostat to a virus to an ant colony to a human brain without changing the definition of "symbol" or "cause."
  *   **The Case:** If "belief" only applies to humans, you've smuggled in soul-stuff. If it applies to thermostats, you risk panpsychism. The theory needs a clear cutoff or a continuous scale.

  **5. The Fine-Grained Swap / Vagueness (Contested)**
  *   **The Requirement:** The theory must specify what happens to causation during the gradual rewiring from prime-numbers to weather simulation. Does symbolic causation fade gradually, or is there a sharp threshold where meaning pops into existence?
  *   **The Case:** Physical states are sharp (a ball is here or there). Symbolic interpretation is often vague (is this pattern still a "7" or now a "Z"?).
  *   **Status:** **Preference dressed as Constraint:** Insisting causation must fade gradually is a preference for vagueness over sharp boundaries. Physics prefers sharp states; semantics prefers fuzzy contexts. A theory must choose which ontology wins.

  ---

  ### The Inconsistency Check

  You guessed right: **Physical Causal Closure** and **Explanatory Leverage (Ontological)** are quietly at war. This is the Causal Exclusion Problem.

  If the physical story is sufficient (Closure), then the symbol story is redundant unless it is *identical* to the physical story. If it is identical, it's not really "symbol-level" causation, it's just physical causation described differently. If it is *distinct* and does real work, you have two sufficient causes for one event (overdetermination) or you violate Closure.

  **Can they be jointly satisfied?** Only if you accept that symbol-level facts are *realized by* physical facts without being *identical* to them (Non-Reductive Physicalism), but you must accept that the "work" done is the same work, just described at different resolutions. If you demand the symbol-level does *extra* work, the list is inconsistent.

  ### The Hardest Requirement

  **Semantic Sensitivity (Misrepresentation)** excludes the most candidates.
  Straight reductionism struggles here because physics doesn't have "truth values." A broken sensor voltage is just a voltage. To get "false belief," you need to introduce norms or functions, which are hard to ground in pure physics without smuggling in an observer. Eliminativism passes this by denying beliefs exist, but that costs you the phenomenon you wanted to explain.

  ### The Preference Dressed as a Constraint

  **Explanatory Leverage (Ontological).**
  You framed this as "symbol-level description constrains what the substrate does next." That is an ontological claim. It is likely a preference. The physicist will argue the constraint comes from the arrangement of the balls, not the meaning. The "leverage" is in the eye of the beholder (epistemic), not in the careenium (ontological). Demanding it be real leverage is demanding realism about abstractions.

  ---

  ### Scorecard

  **Straight Reductionism / Identity**
  Saves causal closure perfectly by making symbols identical to physical states. Fails to explain misrepresentation naturally, since physics has no truth conditions.

  **Functionalism / Substrate-Independence**
  Handles mundane cases and multiple realizability well. Struggles with causal closure unless it accepts that functional roles are just physical structures described differently.

  **Non-Reductive Physicalism / Downward Causation**
  Attempts to keep both closure and symbol autonomy. Often accused of making symbols epiphenomenal (shadow relevance) because the physical base does all the actual pushing.

  **Eliminativism**
  Resolves the tension by denying symbols exist at all; only simmballs exist. Solves closure and vagueness, but makes the reading group's discussion about nothing.
