answer: |-
  1. This protocol presupposes a competence-performance distinction where the asymmetric judgment reflects a universal cognitive competence, while symmetric judgments are mere performance errors caused by inattention or confusion. It treats scientific measurement as a process of filtering signal from noise rather than cataloging the full distribution of human responses.

  2. The underlying view posits that moral evaluation constitutively shapes intentionality ascriptions in a uniform way across all competent speakers, rendering the asymmetry a stable feature of the concept itself. Consequently, conceptual uniformity is assumed to exist at the level of the idealized agent, masking individual variations as irrelevant statistical outliers.

  3. Treating deviations as noise strictly requires the assumption that a single correct intuition exists, whereas a pluralistic philosophy of folk psychology would be incompatible with such exclusionary criteria. Thus, the practice is not merely compatible with a uniformist view but depends upon it to validate the removal of dissenting data points as methodologically sound.

  4. Excluding divergent intuitions undermines the field's claim to describe pre-theoretical judgments, as it effectively constructs a purified dataset that aligns with the theorist's expectation rather than reflecting the raw population variance. This creates a tension where the methodology privileges a specific philosophical hypothesis over the empirical reality of the folk psychology it purports to observe.

  5. If every deviation were treated as a genuine conceptual variant, study designs would need to shift from mean-comparison tests to clustering algorithms that identify distinct subgroups within the population. Researchers would also need to employ qualitative follow-ups to understand the reasoning behind symmetric judgments rather than dismissing them via attention checks or exclusion criteria.
