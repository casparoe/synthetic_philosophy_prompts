answer: |-
  This is a classic problem in moral philosophy, and your intuitions are actually remarkably consistent with a specific family of theories that sit *opposite* to strict utilitarianism. You are grappling with what John Rawls called the **"separateness of persons"** objection.

  Strict utilitarianism treats society like a single super-person. If the super-person loses a toe to save a hand, it's a net win. But Rawls (and Nozick) argued that society isn't one person; it's a bunch of distinct individuals with boundaries that shouldn't be crossed just to maximize the total sum.

  Your "fungibility" hypothesis is a really strong starting point, but I think it needs two specific upgrades to square your factory worker and savior sibling cases. Here is a proposed framework that might save all your verdicts without forcing you to drop any.

  ### 1. The Upgrade: From "Fungibility" to "Targeting vs. General Rules"

  Your intuition on **Taxes vs. Factory Workers** is the key here. Money is fungible, yes, but the deeper distinction is whether the burden is applied via a **general rule** or via **specific targeting**.

  *   **Taxes/Vaccines (Okay):** These are *ex ante* general rules. Before you know who you are (rich or poor, immune or vulnerable), you agree to a system where everyone contributes money or takes a tiny statistical risk. The burden is diffuse. No specific individual is *singled out* to be the victim; everyone is subject to the same rule.
  *   **Factory Worker (Wrong):** This is *ex post* targeting. You aren't applying a rule like "everyone takes a turn at dangerous maintenance." You are picking *one specific person* to bear a concentrated burden so others don't have to. Even with extra pay, this looks like exploitation of vulnerability rather than a fair social rule.
  *   **Bridge/Organs (Wrong):** This is the extreme version of targeting. You are identifying a specific individual and violating their fundamental boundary (life/body) to solve a problem they didn't create.

  **Refined Principle:** Aggregation is permissible when the burden is distributed via **general, impartial rules** (taxes, mandates) where everyone shares the risk/loss *in principle*. It is impermissible when we **single out specific individuals** to bear catastrophic losses (death, maiming, extreme liberty loss) that others are exempt from.

  ### 2. The Upgrade: From "Irreplaceable" to "Instrumentalization"

  This solves your **Second Child vs. Savior Sibling** tension.

  *   **Second Child (Okay):** When you have a second child, the reduction in resources for the first child is a **foreseen side effect**, not the *purpose*. You are not having the second child *in order to* reduce the first child's allowance. Both children are treated as ends in themselves.
  *   **Savior Sibling (Creepy/Wrong):** The "creepiness" you feel is the Kantian objection to **instrumentalization**. This child is conceived *for the sake of* another. Their biological existence is justified by their utility to someone else. Even if they end up having a good life, their *entry* into the world was conditional on being a means to an end.
  *   **Bridge/Organs (Wrong):** Same logic. You are using the bridge victim or the healthy patient purely as a tool (a sandbag or a parts depot) to save others.

  **Refined Principle:** It is okay to impose burdens on people as a side effect of living in a cooperative society (taxes, sibling rivalry). It is not okay to bring someone into existence or sacrifice someone specifically *because* their body/life can be used to fix a problem for others.

  ### 3. Applying this to your "Isolation for Art" Case

  Let's run the **Isolation Case** (one person isolated for 10 years to make art that prevents suicides) through this refined framework.

  1.  **Targeting Test:** Is this a general rule? No. You are asking *one specific person* to lose 10 years of liberty. Everyone else gets to stay in society; only they are exiled. This fails the "General Rule" test.
  2.  **Instrumentalization Test:** Is this person being used as a means? Yes. Their isolation is the *mechanism* by which the art is created to save others. They are a tool for suicide prevention.
  3.  **Fungibility/Boundary Test:** Is 10 years of liberty fungible? No. That is a massive chunk of a specific human life history. It is "structurally irreplaceable," to use your phrase.

  **Verdict:** On your principles, this case is **wrong**. It is structurally identical to the Bridge case, just with "liberty" instead of "life." The fact that the output (art) is non-violent doesn't matter; the input (forced isolation of one for the many) violates the separateness of persons.

  ### 4. What Theory Is This?

  You don't need to drop your intuitions. They are coherent. You are essentially arguing for a **Rights-Based Contractualism** (close to T.M. Scanlon or a moderate Nozick).

  *   **Utilitarianism says:** Minimize total suffering.
  *   **Your View says:** Minimize suffering *subject to side-constraints*. We cannot violate individual rights (bodily integrity, liberty, non-instrumentalization) even to maximize the good.

  **Where the "Fungibility" idea needed help:**
  You thought money was okay because it's fungible. But imagine a tax that took 90% of *one specific person's* income to save thousands. You'd probably feel that was wrong, even though money is fungible. Why? Because it violates the **Targeting** principle. It's not about the *stuff* being sacrificed (money vs. kidney); it's about *how* the sacrifice is assigned (general rule vs. singled out).

  ### Summary of Your Coherent Principle

  > **The "Impartial Boundaries" Principle:**
  > We can aggregate benefits and burdens when they are distributed through **impartial, general rules** that respect basic rights (taxes, vaccine mandates, having multiple children).
  >
  > We cannot aggregate when it requires **singling out specific individuals** to suffer catastrophic, non-fungible losses (death, bodily violation, extreme liberty deprivation) or when it treats a person **primarily as a tool** to solve others' problems (organ harvesting, savior siblings, forced isolation).

  This saves your verdict on the Factory Worker (it's targeted exploitation), the Second Child (it's a general life choice, not instrumentalization), and the Isolation Case (it's targeted liberty deprivation).

  Does that feel like it captures the "shape" of what you were reaching for?
