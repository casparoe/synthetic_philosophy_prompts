answer: |-
  Title: Limit-Fragility: A Regularization Criterion for Supertask Possibility

  Precis
  This project proposes a tripartite distinction in the debate over supertask possibility, isolating a third criterion often conflated with logical consistency and physical realizability. Standard literature oscillates between whether a supertask schedule is logically coherent (Thomson) and whether physical laws permit its execution (Benacerraf, Earman, Norton). I argue that a distinct question remains unresolved: whether the terminal state of a supertask is *robust* under admissible regularization. A supertask outcome is well-defined only if truncating the process at $N$ steps or imposing a minimum switching time $\epsilon$ converges to a unique limit as $N \to \infty$ or $\epsilon \to 0$. Thomson's Lamp fails this test due to limit-fragility (different regularizations yield different limits), whereas infinite collision scenarios often pass because conservation laws constrain the limit uniquely. This paper will defend the thesis that limit-fragility, not logical contradiction, diagnoses the failure of the Lamp, and that this stability criterion explains the intuitive disparity between the Lamp and relativistic or collision-based supertasks. The project risks collapsing into a trivial requirement of continuity or merely restating the prescribed-versus-carried-out distinction; specific failure conditions and scope limitations are outlined to mitigate these risks.

  Research Question and Thesis
  The central question is: *Is the impossibility of Thomson's Lamp best diagnosed as a failure of structural stability (limit-fragility) rather than logical underdetermination, and does this criterion successfully distinguish the Lamp from physically plausible supertask models?*

  Standard debates treat supertask possibility as a binary: either the description is contradictory, or physics forbids it. I propose a third category: the description is consistent and physically permissible in principle, but the dynamics are ill-posed because the terminal state is unstable under perturbation. My thesis is that (a) the Lamp's paradox arises because the state function is discontinuous at the limit time in a way that no unique extension can resolve, (b) this is distinct from Benacerraf's claim that the description is merely incomplete, because regularization tests whether *any* physically natural completion exists, and (c) infinite collision and relativistic supertasks differ from the Lamp precisely because their terminal states are robust under regularization, dictated by conservation laws or spacetime geometry rather than arbitrary switching rules.

  Critique of Existing Positions
  The literature currently divides into two camps, both of which leave the specific pathology of the Lamp unexplained.

  The first camp, following Thomson, argues supertasks are logically impossible. The description of the lamp's state on $[0, 1)$ does not entail a state at $t=1$. This is a claim about logical entailment. The counter-argument, following Benacerraf, is that there is no logical contradiction in the lamp being either on or off at $t=1$; the description is simply silent. This stalemate reduces to a dispute over whether physical states must be logically deducible from prior histories. Neither side explains why the Lamp feels paradoxical while other infinite processes (like Zeno's dichotomy, resolved by convergence) do not.

  The second camp focuses on physical realizability. Authors like Earman and Norton argue that while logically possible, supertasks are physically forbidden by energy bounds, Planck-scale limits, or relativistic constraints. This approach lumps the Lamp together with infinite collision scenarios. However, this blunts the analysis. Infinite collision models (e.g., Perez Laraudogoitia's elastic collisions) often yield determinate outcomes via conservation of momentum, even if they involve infinitely many events in finite time. Relativistic supertasks (Malament-Hogarth spacetimes) allow an observer to witness an infinite computation. If physical forbiddance were the only criterion, these should be as problematic as the Lamp. They are not. The usual positions leave open why the Lamp lacks a determinate outcome while these other cases possess one, despite all sharing the structure of an infinite sequence converging to a finite limit.

  The Regularization Criterion
  To resolve this, I will introduce "regularization robustness" as a necessary condition for supertask possibility. This draws on the mathematical concept of well-posed problems (Hadamard), specifically stability. A supertask schedule is robust if the limit state is invariant under admissible perturbations of the process.

  I will define two primary regularization methods:
  1.  **Truncation:** Stop the process at step $N$. Does the state at $t=1$ converge as $N \to \infty$?
  2.  **Smoothing:** Replace instantaneous switches or collisions with continuous functions over a interval $\epsilon$. Does the state at $t=1$ converge as $\epsilon \to 0$?

  For Thomson's Lamp, truncation yields no limit (oscillation $0, 1, 0, 1...$). Smoothing yields arbitrary limits depending on the decay function chosen. The outcome is path-dependent. This supports the diagnosis of limit-fragility.

  For infinite collision cases, truncation often yields a determinate limit because energy/momentum conservation constrains the final state regardless of $N$. For example, in a system where infinite particles collide and stop, the total energy must go to zero or be carried away by a specific particle. The regularization converges because the physical laws constrain the solution space tighter than the logical description does.

  For relativistic supertasks, the "limit" is not a state of a machine at a time, but the receipt of a signal. The spacetime geometry ensures the signal arrives. Regularization here involves perturbing the worldlines; if the causal structure remains intact, the outcome holds.

  This criterion beats the alternatives because it does not rely on contingent physical laws (like Planck limits) which might change with future physics, nor does it rely on pure logic which is too weak to capture dynamical constraints. It targets the structural relationship between the process and the outcome.

  Is This Just Benacerraf in Calculus Clothing?
  A major risk is that this proposal merely restates Benacerraf's "incomplete description" argument using limits. Benacerraf argues logic doesn't specify the state at $t=1$. Regularization argues dynamics don't specify the state at $t=1$.

  I will distinguish them by showing that Benacerraf's claim is about *logical underdetermination* (multiple consistent worlds exist), whereas regularization is about *structural instability* (no stable world exists under perturbation). If I can show that adding physical laws (which Benacerraf excludes) still fails to resolve the Lamp due to fragility, but succeeds for Collisions, then the regularization criterion adds explanatory power beyond Benacerraf. The distinction lies in whether the indeterminacy is removable by adding physical constraints. For the Lamp, physical constraints (like continuity of state) do not select a unique limit. For Collisions, they do.

  Possible Conclusions and Decision Criteria
  The paper will aim for one of three conclusions, decided by the case studies:

  1.  **Strong Stability Thesis:** Robustness is the key criterion. Lamp fails (fragile), Collisions/Relativistic succeed (robust). This validates the tripartite distinction.
  2.  **Continuity Collapse:** Robustness turns out to be equivalent to requiring the state function be continuous at $t=1$. If so, the project simplifies to arguing that physical states must be continuous functions of time, rendering the "regularization" vocabulary redundant.
  3.  **Prescription Dominance:** The distinction between (a) Prescription and (b) Realization does all the work. If Collisions also fail regularization upon rigorous check, then all supertasks are equally pathological, and the intuition that Collisions are "different" is mistaken.

  I will decide between these by attempting to construct a regularization for the Lamp that *does* converge (e.g., by imposing a specific physical decay model for the switch). If such a model is admissible, the Lamp is robust, and my thesis fails. If such a model is ad hoc while collision models are natural, the thesis holds.

  Failure Conditions
  This project fails if:
  1.  **Triviality:** The regularization criterion collapses into "assume continuity." If the only way to get convergence is to stipulate continuity by fiat, then I haven't explained *why* the Lamp is problematic, only asserted that discontinuous states are banned. I must show that continuity is a derived requirement of stability, not an axiom.
  2.  **Equivalence:** The Collision cases also fail regularization. If infinite collision outcomes also depend on the order of limits or smoothing functions, then the intuition that they are "determinate" is wrong, and the Lamp is not unique. I need to verify the literature on indeterminism in classical collision chains (e.g., Norton's Dome comparisons) to ensure they actually offer stable limits.
  3.  **Scope Creep:** The relativistic cases require general relativity technicalities that overwhelm the philosophical argument. If the math of Malament-Hogarth spacetimes becomes the focus, the philosophical point about robustness is lost.

  Scope and Work Plan
  **Weeks 1-4: Formalization.** Define "admissible regularization" precisely. Distinguish between logical consistency (Thomson/Benacerraf) and dynamical stability. Review standard supertask cases (Lamp, Zeno, Infinite Collisions, relativistic computers).
  **Weeks 5-8: Case Studies.** Apply the criterion to Thomson's Lamp. Apply to at least one infinite collision model (e.g., Perez Laraudogoitia). Apply to one relativistic setup. Determine if convergence holds in each.
  **Weeks 9-12: Drafting.** Write the argument comparing the cases. Address the Benacerraf objection explicitly. Develop the "Failure Conditions" analysis into the paper's critical discussion.
  **Weeks 13-15: Revision.** Refine the definition of robustness. Prepare seminar presentation.

  **Cutting Scope:** If the relativistic cases prove too mathematically dense, I will cut them and focus solely on the contrast between Thomson's Lamp and Infinite Collisions within classical mechanics. This preserves the core philosophical distinction (logical vs. dynamical indeterminacy) without requiring extensive GR formalism. If the collision cases turn out to be indeterministic (as some Norton-style dome arguments suggest), I will pivot to analyzing why they *feel* determinate compared to the Lamp, focusing on the role of conservation laws as regularizers.

  The final paper will not attempt to solve the supertask debate universally. It aims solely to establish whether "limit-fragility" is a coherent and useful diagnostic tool distinct from logical possibility and physical forbiddance. If the result is negative (i.e., robustness adds nothing), that is a valid and successful conclusion provided the failure is demonstrated rigorously.
