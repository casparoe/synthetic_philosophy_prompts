prompt: |-
  I'm preparing a graduate seminar on the School of Names (Mingjia), and I have noticed what seems to be a modern institutional echo of Gongsun Long's white-horse argument running through three very different bureaucratic systems. In international tariff schedules, a compound description such as "leather footwear with synthetic soles" is assigned a distinct regulatory code, duty rate, and inspection protocol from "leather footwear" alone; the compound is administratively treated not as a subset but as a separate kind, even when the physical goods differ only by that single added feature. By contrast, agricultural subsidy forms code "white horse" and "horse" under the identical livestock category, treating the color modifier as administratively invisible. Meanwhile, our university's course-catalog ontology assigns separate curricular IDs, prerequisite chains, and learning-outcome frameworks to "Political Philosophy" and "Political Philosophy: Global Justice"; the compound is filed not as a specialization of the simple course but as a parallel track with its own requirements, despite the fact that the unmodified course is never actually offered on its own.

  What implicit theory of naming, kind-membership, and property-combination do these practices collectively presuppose? Do they assume, with the School of Names, that adding a qualifier introduces a new essence—so that "white horse" is genuinely not "horse"—or do they instead presuppose a purely nominalist, administratively convenient division with no ontological commitment? Reconstruct the implicit ontology shared across these cases, distinguish what they strictly presuppose from what they merely accommodate, and assess whether the three practices are mutually consistent or quietly pull in opposite directions. Then tell me what a uniform classification scheme—say, a strictly extensional, intersection-based system that treats every compound as a subset of its simpler terms—would require these institutions to change, and take a definite stand on whether such a reform would be philosophically sound or administratively disastrous. Keep your response committed and specific, and do not exceed 350 words.
