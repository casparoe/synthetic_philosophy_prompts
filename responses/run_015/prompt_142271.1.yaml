          *   *Text:* "If, upon placing ourselves in his situation, we thoroughly enter into all the passions and motives which influenced it, we approve of it, by sympathy with the approbation of this supposed equitable judge."
          *   *The Stopper:* The condition "If... we thoroughly enter into all the passions and motives."
          *   *Mechanism:* It's not "I imagine he approves, so I approve." It's "I look at my motives through his eyes. If they match (sympathize), I approve. If they don't, I condemn."
          *   *The Risk:* Where do *his* standards come from? If I construct him entirely, I can construct him to approve of anything.
          *   *The Textual Check:* Paragraph 2 says the mirror is *first* provided by actual people ("countenance and behaviour of those he lives with").
          *   *Resolution:* The circularity is avoided *if* the "imagined spectator" is calibrated by actual social interaction (Para 2). But if I ignore actual reactions, yes, it risks circularity. The text implies the "imagined" spectator is refined from the "actual" spectators.
          *   *Cost:* Smith relies on the *failure* of sympathy. "If otherwise, we enter into his disapprobation." The mechanism works because sympathy *fails* often. If I always sympathized with myself, there'd be no judgment. The "other" provides a friction point.

      *   **Q4: Paragraph 2 (The Mirror) & Conscience Condemning Society.**
          *   *Text:* "It is placed in the countenance and behaviour of those he lives with... here that he first views the propriety..."
          *   *Problem:* If the mirror is *only* actual people, how do I condemn them? (e.g., Socrates, or a whistleblower).
          *   *Textual Resource:* Look back at Para 1's "Secret Reference." Specifically: "what, we imagine, **ought to be** the judgment of others."
          *   *Analysis:* Para 2 explains the *origin* ("first views"). Para 1 explains the *mature mechanism* ("endeavour to view... as we imagine any other fair and impartial spectator").
          *   *Does Para 2 lock us into conformity?* It says "he is immediately provided with the mirror... It is placed in the countenance..." This describes the *genesis* of self-awareness.
          *   *Does Para 1 allow rebellion?* Yes, via the "ought to be" limb and the "fair and impartial" qualification. I can look at my actual neighbors (Para 2 mirror), see they approve of X, but imagine a "fair and impartial" spectator (Para 1 construct) who *ought* to disapprove of X.
          *   *Does the text give resources?* Yes, the distinction between "what are" and "what ought to be" in Para 1 is the escape hatch from the "countenance of those he lives with" in Para 2.
          *   *Later Machinery?* Smith does develop the "Impartial Spectator" into a more distinct voice later (the "man within the breast"), but the *seed* of independence is right here in the "ought to be" clause. You don't *need* later chapters to see the possibility of dissent, but you do need to hold Para 1 and Para 2 together tightly. Para 2 is the training wheels; Para 1 is the bike.

