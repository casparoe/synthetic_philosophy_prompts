      *(Self-Correction during drafting)*: I need to be careful not to smuggle in later Smith. The user asked "what happens on his own machinery if I imagine a spectator who is biased." I need to stick to what *these paragraphs* say about that.
      *   *Refinement on Biased Spectator:* Para 1 says we endeavor to view them as "other people are likely to view them." But then it says "fair and impartial." If I imagine a biased one, am I following the rule? The text says "We endeavour to examine... as we imagine any other fair and impartial spectator would." So, if I imagine a biased one, I am *not* following the procedure described. The procedure *requires* the spectator to be fair. Why? Because the goal is "approbation" based on "sympathy." A biased spectator might approve of things I cannot sympathize with upon reflection.
      *   *Refinement on Circularity:* The key is the "If... If otherwise" structure. It's a test, not a rubber stamp. The "cost" is that it relies on the stability of human sympathy. If my sympathy is broken, the judge is broken.

  5.  **Final Review against Constraints:**
