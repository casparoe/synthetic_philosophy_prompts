          *   *Cost:* If "fair and impartial" is a *requirement* of the spectator, not just a result of distance, then mere distance isn't enough. I have to construct a *specific kind* of other. This complicates the User's "procedure only" view. It suggests there's a standard of "fairness" external to the mere act of stepping back.
          *   *However:* The text says "as we imagine." So it *is* a construction. But is it an arbitrary one? The "ought to be" limb suggests we have a standard for how they *should* judge.
