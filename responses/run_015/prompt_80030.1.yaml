answer: |-
  ### The practice, restated

  You have accurately described the standard model of the modern public archive. It operates on a dual track: statutory records (council minutes, courts, rates) are deposited compulsorily because they document the functions of the state, while personal materials (diaries, photos, ledgers) survive only through voluntary donation, which relies on the donor's awareness and willingness. The cataloging system adheres to the principle of *provenance*, organizing records by their creator rather than by subject, and access is restricted by legal embargoes on recent data. Consequently, the archive functions less as a comprehensive mirror of the past and more as a filtered repository of administrative continuity and elite preservation.

  ### The theory it presupposes

  Your intuition is correct: this setup presupposes that the state is the primary actor in history and the natural witness to truth. By mandating the preservation of government files while leaving personal history to chance, the archive institutionalizes the idea that public administration is the backbone of reality, while private life is incidental. The "past" becomes defined as whatever intersected with bureaucracy or whatever wealthy families deemed worthy of boxing up. This is not a neutral accident; it is a philosophical stance that equates significance with officiality. When your teacher says "sources just are what they are," they are ignoring that the survival of those sources was determined by power dynamics—who had the legal obligation to record, and who had the social capital to donate.

  Furthermore, the cataloging method reinforces this hierarchy by forcing researchers to adopt the worldview of the record-creator. By listing "domestic servants" under a household's accounts rather than as independent subjects, the archive treats people as property or administrative line items rather than agents with their own histories. This structure assumes that the context of power (the employer, the council, the court) is the only valid entry point for knowledge. It suggests that history flows downward from institutions to individuals, rather than upward from lived experience to the broader culture. The archive is not merely storing history; it is teaching you how to look for it, and it is instructing you to look through the eyes of the master, not the servant.

  ### What it quietly rules out

  This system systematically excludes the history of those who did not interact with the state or possess surplus wealth. The "community shelf" dominated by the same five families illustrates that "community memory" is often just elite memory dressed up as public heritage. Working-class lives, minority experiences, and informal economies vanish because they rarely generate statutory paper trails and their participants often lack the leisure or resources to curate their own papers for donation. The embargo on recent files creates a "dark age" for contemporary history, preventing the archive from serving as a tool for understanding current social dynamics. Ultimately, it rules out the possibility of history from below, silencing anyone who was not powerful enough to file a record or wealthy enough to save one.

  ### Where it contradicts itself

  The archive contradicts itself when it claims to be a public resource while relying on private whims for a significant portion of its holdings. It presents itself as a neutral guardian of the town's collective memory, yet its "personal" collections are the result of unequal survival rates among social classes. Additionally, the catalog claims to facilitate access, but by refusing to index subjects across different collections (like tagging all mentions of "domestic servants" regardless of the household), it actively hinders research that challenges the original power structure. It wants to be a library of everything, but operates like a vault for the powerful, creating a tension between its public mission and its private mechanisms.

  ### What would have to change

  To build an archive that doesn't assume the state is the natural witness, the institution would need to shift from passive receiving to active collecting. Archivists would need to partner with community groups, unions, and marginalized populations to record oral histories and collect materials before they are lost, rather than waiting for donations from the usual families. The cataloging system would need to be updated with modern metadata that allows for subject-based searching across collections, enabling you to find the servant without needing the master's name. Finally, embargo periods should be reviewed to balance privacy with the public's right to understand their recent past, ensuring the archive remains a living tool for the present, not just a tomb for the administrative past.
