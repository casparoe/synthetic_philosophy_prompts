answer: |-
  The "cluelessness" objection to consequentialism argues that agents are often unable to know the long-term consequences of their actions well enough to determine which action maximizes the good. Because the causal chains of the world are complex, chaotic, and extend far into the future, we are "clueless" about whether, for example, donating to charity A is objectively better than donating to charity B.

  However, this objection gains its rhetorical force by blurring a crucial distinction in decision theory and value theory. It conflates **epistemic uncertainty** (we don't know the facts) with **ontic indeterminacy** (the facts do not exist). Distinguishing between these two cases—(i) a complete betterness relation with epistemic ignorance, and (ii) an incomplete betterness relation with ontic incomparability—is essential for evaluating the viability of consequentialism.

  ### 1. Distinguishing the Two Cases

  **Case (i): Epistemic Ignorance (Complete Value)**
  In this scenario, the "betterness relation" over outcomes is **complete**. For any two outcomes $X$ and $Y$, it is objectively true that either $X$ is better than $Y$, $Y$ is better than $X$, or they are equally good. The metaphysics of value is precise.
  *   **The Problem:** The agent lacks access to this truth. Due to limited information, computational limits, or causal complexity (the "butterfly effect"), the agent cannot determine which option leads to the better outcome.
  *   **The Nature of the Gap:** The gap is between the *world* and the *mind*. The truth exists "out there," but it is hidden.

  **Case (ii): Ontic Indeterminacy (Incomplete Value)**
  In this scenario, the betterness relation is **incomplete**. For some pairs of outcomes $X$ and $Y$, it is not true that $X$ is better than $Y$, nor that $Y$ is better than $X$, nor that they are equal. They are genuinely **incomparable** (or on a "parity").
  *   **The Problem:** No amount of investigation, calculation, or evidence could settle the matter. There is no fact of the matter to be found.
  *   **The Nature of the Gap:** The gap is within the *structure of value itself*. The truth does not exist.

  ### 2. Why the Distinction Matters: The Force of the Objection

  The distinction matters because it changes the cluelessness objection from a **practical challenge** to a **theoretical refutation**.

  **Against Case (i): A Challenge to Guidance**
  If value is complete but we are ignorant, consequentialism remains theoretically true but practically difficult. The objection here is that consequentialism fails as a *decision procedure*. It demands the impossible (omniscience) to identify the "right" action.
  *   **Force:** Moderate. It suggests consequentialism is too demanding or lacks action-guidance, but it does not prove the theory false. It implies we need a way to act under uncertainty, not that "maximizing the good" is a incoherent goal.

  **Against Case (ii): A Challenge to Coherence**
  If value is incomplete, standard maximizing consequentialism is arguably incoherent. The core imperative of consequentialism is "Maximize the Good." If the good is not a complete ordering, there is often no single "maximum" to aim for. If Option A and Option B are incomparable, the command "Choose the better one" has no referent.
  *   **Force:** Severe. This attacks the *criterion of rightness* itself. If the betterness relation is incomplete, the fundamental definition of the morally right act (that which produces the best outcome) is ill-defined for a wide range of choices.

  ### 3. Available Consequentialist Responses

  The resources available to a consequentialist depend entirely on which version of cluelessness they are facing.

  #### Response A: Expected-Value Maximization
  This is the standard move in decision theory: do not try to maximize *actual* value; maximize *expected* value based on subjective probabilities.

  *   **Viability in Case (i) (Epistemic):** **High.**
      Since there is a fact of the matter about value, the agent can assign subjective probabilities to different outcomes. Even if the agent is clueless about the *actual* long-term consequences, they can form rational credences. Subjective Consequentialism (maximizing expected goodness relative to one's evidence) successfully bridges the gap. The agent is not blamed for being wrong, only for being irrational in their probability assessments.
  *   **Viability in Case (ii) (Ontic):** **Low.**
      Expected utility theory requires a common currency of value to calculate an average. If outcomes are incomparable, they cannot be represented on a single cardinal scale. You cannot calculate $0.5 \times \text{Value}(A) + 0.5 \times \text{Value}(B)$ if $A$ and $B$ are ontologically incomparable. There is no mathematical operation that resolves ontic indeterminacy into a scalar expectation.

  #### Response B: Avoiding Dominated Options
  This response lowers the bar. Instead of requiring the agent to find the *best* option, the theory requires the agent merely to avoid options that are *worse* than available alternatives (Pareto dominance).

  *   **Viability in Case (i) (Epistemic):** **Weak.**
      While avoiding dominated options is rational, it is insufficient for a maximizing theory. In a world with complete value, there *is* a best option. Settling for a non-dominated but sub-optimal option fails the core consequentialist mandate. It turns consequentialism into a form of satisficing or deontology.
  *   **Viability in Case (ii) (Ontic):** **High.**
      This is often the only viable response to ontic incompleteness. Even if $A$ and $B$ are incomparable, it may still be true that $C$ is worse than both. A consequentialist can argue that the moral requirement is simply **non-domination**: do not choose an option if there is another available that is definitely better (or incomparable but "more promising" in a specific dimension). This preserves a consequentialist structure (sensitivity to value) without requiring a complete ordering.

  #### Response C: Pluralistic or Contrastive Consequentialism
  Some philosophers suggest modifying the theory to acknowledge that "right" is contrastive or relative to a set of options.

  *   **Viability in Case (i):** Unnecessary. The standard model works if we accept subjective expectation.
  *   **Viability in Case (ii):** Necessary. One might argue that an act is right if it is *not worse* than any alternative, even if it is not *better* than all alternatives. This requires abandoning the "maximizing" label for a "optimizing within constraints" label.

  ### Summary Table

  | Feature | Case (i): Epistemic Ignorance | Case (ii): Ontic Indeterminacy |
  | :--- | :--- | :--- |
  | **Value Structure** | Complete (Fact of the matter exists) | Incomplete (No fact of the matter) |
  | **Source of Cluelessness** | Lack of information/causal complexity | Nature of value itself |
  | **Force of Objection** | Practical (Guidance problem) | Theoretical (Coherence problem) |
  | **Expected Value Response** | **Works:** Use subjective probabilities. | **Fails:** Cannot average incomparables. |
  | **Dominance Response** | **Weak:** Allows sub-optimal choices. | **Strong:** Only way to preserve rationality. |

  ### Conclusion

  The conflation of these two cases allows critics to argue that consequentialism is both practically impossible (Case i) and theoretically incoherent (Case ii) simultaneously. However, once separated, the consequentialist has robust defenses against Case (i). By shifting from objective to subjective expected value, consequentialism can accommodate human ignorance without abandoning the maximizing ideal.

  Against Case (ii), however, the outlook is grimmer. If the cluelessness objection relies on the claim that values are genuinely incomparable, standard maximizing consequentialism cannot stand. It must either deny the incompleteness of value (a metaphysical claim) or weaken its normative demand from "maximize" to "avoid the dominated." Therefore, the distinction determines whether consequentialism needs a better epistemology (Case i) or a new axiology (Case ii).
