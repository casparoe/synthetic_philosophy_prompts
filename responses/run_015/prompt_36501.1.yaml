  You strike at the heart of the matter, my friend, but I fear you've granted your own brain a permanence it does not possess. Do your neurons not die? Do the atoms in your synapses not turnover? If you are a persisting thing only because your parts stay put, then you are gone every few years, replaced by a new collection of matter. No, the persistence you feel is not in the hardware but in the software—in the stability of the symbols themselves. When an ant carrying a fragment of the symbol 'food' dies, another ant picks up that role, and the symbol persists intact. The 'I' you speak of is not the candles, but the flame; and if you claim the flame is nothing because it has no mass, you must extinguish your own sense of self along with Aunt Hillary's. The local rules you dismiss are merely the physics of the substrate; they no more explain away the colony's thoughts than the firing of ions explains away your appreciation of this argument.
