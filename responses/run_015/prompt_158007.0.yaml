answer: |-
  At St. Jude's Hospital, nurse Elena is bound by a compulsive ritual: she must recount inventory twice before administering meds, a rigid loop internalized years ago where the completion condition is defined solely by the loop's own repetition, not external safety. When administration pressures staff to skip checks to boost throughput, flexible nurse Mark reads the room, sees everyone complying, and quietly drops the protocol to fit in. Elena, unable to override her count-even-when-rushed script, inadvertently refuses the unethical shortcut, not out of moral reasoning but because her cognitive glitch prevents her from proceeding until the loop completes. Her opacity shields her from the social pressure that dissolves Mark's will, making her the only one who actually acts according to a consistent principle, even if she doesn't know why.

  **The Debate**

  *   **Rigidity-as-Freedom Camp:** They argue that agency requires **Diachronic Integrity**—the ability to remain consistent across time despite changing external pressures. The structural feature carrying this is **Second-Order Opacity**: because Elena cannot access *why* she follows the script (the source is forgotten/internalized), she cannot process the administration's social reasoning as a valid counter-argument. Her cognition treats the script as a physical law rather than a negotiable norm, insulating her action from the "normative drift" that captures Mark.
  *   **Flexibility Camp Attack:** They argue this is merely **Accidental Correctness**, not agency. True moral agency requires reasons-responsiveness; if the situation flipped and counting harmed the patient, Elena would still count. She is a stone rolling downhill, not a walker. Mark, though conformist, at least processed social data and made a calculation, whereas Elena's output is decoupled from reality.
  *   **What Breaks:** If the script was written yesterday (declarative memory) rather than internalized (procedural memory), the **Opacity** vanishes. Elena could consciously evaluate the rule against the social pressure, realize counting is "optional," and override it just like Mark. The agency-preserving quality relies on the rule becoming part of the cognitive architecture itself, rendering it invisible to the negotiation process that usually dissolves will.
