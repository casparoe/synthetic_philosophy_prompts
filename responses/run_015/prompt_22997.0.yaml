prompt: |-
  I'm working on a novel and two friends of mine got into it at dinner about a scene, and it snowballed into something I can't actually referee. One of them, lets call her Mara, argued that a character in the book has a real reason to do a certain thing even though the character isn't psychologically pulled toward it at all -- she said reasons are objective features of the situation, so if the character made a promise, that's a reason to keep it wether or not the character feels like it. The other one, Dev, said that's not a reason *for that character*, that a genuine reason has to engage what the character actually cares about, and if there's no motivational hook then it's not a reason for them, just a reason for someone else.

  Mara pushed back and said Dev's view has this weird consequence where anyone who's lost the desire to be honest has no reason to be honest, which is absurd, and that his account basically lets you opt out of every reason just by not wanting it. Dev said no, that's the point, that if you've genuinely lost the motivation then the reason is gone for you, and that Mara is just smuggling in a factive "should" that assumes the very thing in question.

  I tried to steer them back to the scene and they just went deeper. Can you actually referee this for me? I want to know who's right about which specific point at each step, not just who wins overall, and I'm curious whether there's something both of them are missing about how reasons work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is writing a novel. Two friends (Mara and Dev) argued about a scene involving a character's motivation/reasons for action.
      *   **The Dispute:**
          *   **Mara's Position (Externalism/Objectivism):** Reasons are objective features of the situation (e.g., a promise exists $\rightarrow$ reason to keep it), regardless of the character's psychological state/motivation.
          *   **Dev's Position (Internalism/Subjectivism):** Reasons must engage the character's subjective motivational set (what they care about). If no motivational hook exists, there's no reason *for them*.
          *   **The Clash:** Mara argues Dev's view implies amoralism (no reason to be honest if you don't want to be). Dev argues Mara is smuggling in a normative "should" and that loss of motivation means loss of reason.
      *   **The Task:** Referee the debate. Determine who is right about *which specific point*. Avoid just declaring a winner. Identify what both might be missing.
      *   **Goal:** Provide philosophical clarity to help the user with their novel (character development/plot logic).

  2.  **Identify the Philosophical Core:**
      *   This is a classic debate in meta-ethics and philosophy of action: **Reasons Internalism vs. Reasons Externalism.**
      *   **Internalism (Dev):** Associated with Bernard Williams ("Internal and External Reasons"). A reason must be grounded in the agent's "subjective motivational set" (SMS).
      *   **Externalism (Mara):** Associated with objective moral realists or rationalists (e.g., Kantians, some consequentialists). Reasons exist independently of desires.

  3.  **Evaluate Mara's Claims:**
      *   *Claim:* Reasons are objective features (e.g., a promise creates a reason).
      *   *Strength:* Captures our normative intuition that obligations exist even when we don't feel like fulfilling them. It preserves the authority of morality.
      *   *Weakness:* Struggles to explain *how* an objective fact moves an agent to act without a desire. If the character literally doesn't care, how is it a reason *for action*?
      *   *Verdict:* She is right about *normativity* (what ought to be), but potentially wrong about *motivation* (what drives action).

  4.  **Evaluate Dev's Claims:**
      *   *Claim:* Reasons must engage what the character cares about (motivational hook).
      *   *Strength:* Explains the link between reasons and action. If someone has zero motivation, they won't act. It aligns with Humean theory of motivation.
      *   *Weakness:* Leads to the "amoralist" problem (as Mara pointed out). If a psychopath doesn't care about pain, do they have no reason not to torture? That seems intuitively wrong.
      *   *Verdict:* He is right about *psychological explanation*, but potentially wrong about *moral obligation*.

  5.  **Evaluate the Counter-Arguments:**
      *   *Mara's Objection:* Dev's view lets you opt out of reasons by not wanting them (e.g., honesty).
          *   *Analysis:* Strong point. This is the classic objection to Internalism. It makes morality contingent on mood.
      *   *Dev's Objection:* Mara is smuggling in a factive "should." If motivation is gone, the reason is gone.
          *   *Analysis:* He is distinguishing between "There is a reason" vs. "I acknowledge the reason." He's sticking to a strict definition of practical reason.

  6.  **Synthesize/Find the Middle Ground (What are they missing?):**
      *   **Distinction between "Normative Reasons" and "Motivating Reasons":** This is the key.
          *   *Normative Reason:* A fact that counts in favor of an action (Mara's focus).
          *   *Motivating Reason:* The psychological state that actually explains the action (Dev's focus).
      *   **The "Ought Implies Can" Angle:** If the character *cannot* care, does the obligation hold?
      *   **Character Arc Potential:** For a novel, the tension *between* these two types of reasons is where the drama lies. The character might have a normative reason (promise) but lack a motivating reason (desire). The story is about bridging that gap.

  7.  **Drafting the Referee Report:**
      *   *Introduction:* Acknowledge the depth of the debate (it's a centuries-old philosophical problem).
      *   *Round 1: The Nature of Reasons.*
          *   Mara: Right about *Normative Reasons*.
          *   Dev: Right about *Motivating Reasons*.
      *   *Round 2: The "Opting Out" Objection.*
          *   Mara: Right that Dev's view risks moral nihilism/relativism.
          *   Dev: Right that without motivation, the reason lacks *force* for the agent.
      *   *Round 3: What They're Missing.*
          *   The distinction between the two types of reasons.
          *   The concept of "Rational Capacity" (maybe the character *should* care even if they don't).
          *   The narrative opportunity (the conflict *is* the story).
      *   *Advice for the Novel:* How to use this. Is the character broken? Are they evolving? Is the world absurd?

  8.  **Refining the Tone:**
      *   Keep it analytical but accessible.
      *   Don't dismiss either friend; validate their insights.
      *   Focus on utility for the writer.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer "who's right about which specific point"? Yes, need to be explicit about that.
      *   *Check:* Did I address the "factive should" comment? Yes, that's about normativity vs. psychology.
      *   *Check:* Is the advice practical for a novelist? Yes, frame the philosophical conflict as character conflict.

  10. **Final Polish:** Ensure clear headings and a summary verdict. (Proceed to generate output based on this structure.)
answer: |-
  This is a fantastic argument to have over dinner, but it is also one of the oldest and stickiest debates in moral philosophy and the philosophy of action. You have accidentally recreated the dispute between **Reasons Externalism** (Mara) and **Reasons Internalism** (Dev).

  Neither of them is "wrong" in a way that disproves the other, because they are talking about two different definitions of the word "reason." However, they are each right about specific mechanical points, and they are both missing a crucial distinction that could actually help your novel.

  Here is the referee report, broken down by specific claims.

  ### Round 1: The Definition of a "Reason"

  **Mara's Claim:** *Reasons are objective features of the situation (e.g., a promise exists, therefore a reason exists).*
  **Dev's Claim:** *A genuine reason must engage what the character actually cares about (the motivational hook).*

  **The Verdict:** **They are both right, but they are defining different things.**
  *   **Mara is right about *Normative Reasons*.** In philosophy, a normative reason is a fact that counts in favor of an action, regardless of whether the agent knows it or cares about it. If you promised to meet me, the fact of the promise is a normative reason to show up. If you don't show up, you have violated a reason that existed objectively. Mara is correct that obligations don't vanish just because we feel indifferent.
  *   **Dev is right about *Motivating Reasons*.** A motivating reason is the psychological state that actually explains why an agent acted. If your character has zero psychological connection to the promise (no desire to be honest, no fear of consequence, no love for the promisee), then the promise cannot *move* them. Dev is correct that without a "motivational hook," the reason has no traction in the character's psychology.

  **Referee's Note:** Mara is describing the *logic of the situation*. Dev is describing the *psychology of the agent*. In a novel, both are real. The tension between them is where the drama lives.

  ### Round 2: The "Opting Out" Objection

  **Mara's Claim:** *Dev's view implies that if you lose the desire to be honest, you have no reason to be honest. This lets you opt out of morality.*
  **Dev's Claim:** *If you've genuinely lost the motivation, the reason is gone for you. Mara is smuggling in a "should."*

  **The Verdict:** **Mara wins on moral intuition; Dev wins on logical consistency.**
  *   **Mara is right about the consequence.** This is the classic objection to Internalism (Dev's view). It is called the "Amoralist Problem." If Dev is right, then a sociopath who genuinely does not care about pain has no reason not to torture someone. Most people find this conclusion absurd. Mara is correct that we generally believe reasons (especially moral ones) bind us even when we don't want them to.
  *   **Dev is right about the "smuggled should."** Dev is pointing out that Mara is confusing "There is a reason" with "The agent will feel compelled." Dev is arguing from a Humean theory of motivation: Reason alone cannot produce action; only passion/desire can. If the character literally has no desire that keeping the promise would satisfy, then *practically speaking*, the reason does not exist for them as an engine of action. Dev is correct that Mara is using a normative "should" (you ought to do this) to prove a motivational "will" (you will do this).

  **Referee's Note:** Mara is protecting the **authority** of reasons. Dev is protecting the **explanatory power** of reasons. Mara is right that we *want* morality to work the way she says. Dev is right that human psychology often works the way he says.

  ### Round 3: What Both of Them Are Missing

  There is a third option that neither of them articulated, which is vital for character development. They are missing the concept of **Rational Capacity** (or Competence).

  **The Missing Point:** A reason can exist objectively (Mara) and fail to motivate currently (Dev), but the character might still be *rationally required* to acknowledge it.

  Here is the nuance: Just because a character *doesn't* care about a promise doesn't mean they *shouldn't* care.
  *   **Mara** assumes the reason exists fully formed.
  *   **Dev** assumes the reason must be pre-existing in the character's desires.
  *   **The Missing View:** Reasons can be **discovered** or **cultivated**. A character might not currently have a motivational hook for honesty, but they are *irrational* or *broken* for lacking it.

  **Why this matters for your novel:**
  If you side with Mara, your character is a villain or a victim of circumstance (they are ignoring an objective truth).
  If you side with Dev, your character is simply being honest about their nature (they have no reason to act, so they won't).
  **But if you use the Missing View:** Your character is in a state of **alienation**. They *have* a reason (the promise), but they are currently psychologically incapable of feeling it. The story isn't about whether the reason exists; it's about whether the character can repair their psychology to *recognize* the reason.

  ### Final Ruling & Advice for the Scene

  **Who is right?**
  *   **Mara** is right that the promise constitutes an obligation independent of mood.
  *   **Dev** is right that the promise cannot cause action without a desire.
  *   **Both** are wrong to think these two things must match up instantly.

  **How to write the scene:**
  Don't solve the debate in the text; **embody the debate in the character.**

  1.  **If the character keeps the promise:** They are acting on Mara's view. They are acting against their own psychology because they recognize an objective duty. This makes them seem principled, rigid, or perhaps dutiful to a fault.
  2.  **If the character breaks the promise:** They are acting on Dev's view. They are following their internal motivational set. This makes them seem authentic, or perhaps sociopathic, depending on how you frame the lack of motivation.
  3.  **The Best Option (The Conflict):** The character *knows* Mara is right (they know they should keep the promise) but *feels* Dev is right (they have zero desire to do it).
      *   This creates **cognitive dissonance**.
      *   The "reason" exists as a source of guilt (Mara), but not as a source of energy (Dev).
      *   The scene becomes about the pain of that gap.

  **Referee's Summary:**
  Mara wins on **Ethics** (what is right). Dev wins on **Psychology** (what moves us). You are the novelist, which means you live in the space where Ethics and Psychology collide. Let them both be right, and let your character suffer for it. That is where the good writing is.
