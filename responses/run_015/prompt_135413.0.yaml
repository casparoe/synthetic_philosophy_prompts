prompt: |-
  I'm putting together a podcast episode — nothing fancy, just me and a microphone in my flat — and I've managed to bag an interview with a development economist who defends something she calls "boundary endogeneity theory". Roughly, she thinks the whole institutions-versus-geography-versus-culture debate about why some nations are rich is methodologially broken because colonial borders weren't randomly assigned; they were drawn precisely where extractive institutions were already viable, so using border discontinuities as natural experiments is circular reasoning dressed up in Stata output. I want about eight interview questions that actually press her on this, not just "explain your view".

  Could you draft them? I'd like at least one that tackles whether culture is just a residual bin for whatever institutions and geography can't explain, another that asks if there's any historical counterfactual that could genuinely separate institutional quality from geographic luck — since both seem to co-evolve over centuries — and one specifically about Korea's partition or the arbitrary African borders, asking whether those cases actually satisfy the exclusion restriction or whether they're just post-hoc narratives with fancy econometrics. For each of those three, please include a follow-up keyed to the answer she's most likely to give — probably that culture hides unmeasured institutional persistence, that true separation is impossible without impossible counterfactual worlds, and that the instruments fail because the "treatment" was never randomly assigned in the first place. No need for bibliographys or reading lists; the audience won't have access to journals anyway, and I don't want her guessing citations from memory.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** Podcast interview (informal setting, host + mic).
      *   **Guest:** Development economist defending "boundary endogeneity theory."
      *   **Core Theory:** Colonial borders weren't random; they were drawn where extractive institutions were viable. Therefore, border discontinuity designs (RDD) in development econ are circular/endogenous.
      *   **Task:** Draft 8 interview questions.
      *   **Constraints:**
          *   Must press her on the theory, not just ask for explanations.
          *   Specific Question 1: Culture as a residual bin (vs. institutions/geography).
          *   Specific Question 2: Historical counterfactuals separating institutional quality from geographic luck (co-evolution).
          *   Specific Question 3: Korea/African borders (exclusion restriction validity vs. post-hoc narratives).
          *   Follow-ups: Required for the three specific questions above, keyed to her *likely* answers (culture = unmeasured institutional persistence; separation = impossible without impossible counterfactuals; instruments = non-random treatment).
          *   No bibliographies/reading lists.
          *   Tone: Engaging, probing, suitable for audio.

  2.  **Deconstruct the Guest's Theory ("Boundary Endogeneity"):**
      *   Standard Development Econ: Uses border discontinuities (e.g., North/South Korea, US/Mexico, African ethnic splits) as "natural experiments" to isolate the effect of institutions on growth.
      *   Guest's Critique: Borders aren't exogenous shocks. Colonizers chose borders *based on* potential for extraction. If the land was good for extraction, they drew a border to include it in the empire and set up extractive institutions. If not, they left it alone or drew a different border.
      *   Implication: You can't compare "Side A" (colonized) vs. "Side B" (not colonized/differently colonized) because the *reason* they are different sides is correlated with the outcome (wealth/institutions). It's selection bias.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Goal:* 8 questions total. 3 are specified with follow-ups. That leaves 5 open questions to flesh out the interview arc.
      *   *Flow:* Intro/Setup -> Core Mechanism -> Specific Cases (Korea/Africa) -> Methodological Implications -> Culture/Geography -> Future/Conclusion.

      *   *Question 1 (Intro/Setup):* Need to ground the theory without asking "explain your view." Let's ask about the *moment* the realization hit.
      *   *Question 2 (The Mechanism):* How does this actually work on the ground? Did colonizers have maps?
      *   *Question 3 (Specific: Korea/Africa):* This is one of the required ones. Focus on the exclusion restriction.
          *   *Follow-up:* Keyed to "instruments fail because treatment wasn't random."
      *   *Question 4 (Methodological Damage):* If RDD is broken, what happens to the famous papers (Acemoglu, etc.)?
      *   *Question 5 (Specific: Culture):* This is one of the required ones. Culture as a residual.
          *   *Follow-up:* Keyed to "culture hides unmeasured institutional persistence."
      *   *Question 6 (Specific: Counterfactuals/Geography):* This is one of the required ones. Separating institutions from geography.
          *   *Follow-up:* Keyed to "separation impossible without impossible counterfactuals."
      *   *Question 7 (Policy Implication):* If we can't measure what works, what do policymakers do?
      *   *Question 8 (Closing):* What's the one thing listeners should take away about how they read economic news?

  4.  **Refining the Required Questions & Follow-ups:**

      *   *Korea/Africa Question:* Needs to challenge the "natural experiment" status.
          *   *Draft:* Everyone loves the Korea example. But if borders are endogenous, does the DMZ really work as an experiment?
          *   *Refinement:* Make it sharper. Ask about the *exclusion restriction*.
          *   *Follow-up:* She will say the treatment (division) wasn't random. The follow-up needs to press: "So are we just telling stories with regression?"

      *   *Culture Question:* Needs to address the "residual" argument.
          *   *Draft:* Is culture just what's left over?
          *   *Refinement:* Frame it as the "dustbin" of econometrics. When institutions and geography fail to predict growth, do we just label the error term 'culture'?
          *   *Follow-up:* She will say culture is actually persistent institutions. Follow-up: "Does that make culture unmeasurable by definition?"

      *   *Geography/Counterfactual Question:* Needs to address co-evolution.
          *   *Draft:* Can we separate geography and institutions?
          *   *Refinement:* If institutions grow *out* of geography over centuries, is looking for a "pure" institutional effect chasing a ghost?
          *   *Follow-up:* She will say true separation is impossible. Follow-up: "Does that mean development economics is just history with extra steps?"

  5.  **Review against Constraints:**
      *   8 questions? Yes.
      *   3 specific topics covered? Yes (Korea/Africa, Culture, Geography/Counterfactual).
      *   Follow-ups included for those 3? Yes.
      *   Follow-ups keyed to likely answers? Yes.
      *   No citations? Yes.
      *   Tone appropriate? Yes, conversational but sharp.

  6.  **Final Polish:** Check the wording to ensure it sounds like a podcast host speaking, not an academic examiner. Use phrases like "Let's press on that," "Here's the worry I have," etc. Ensure the follow-ups feel like natural reactions to her anticipated responses.

      *(Self-Correction during drafting)*: Make sure the follow-ups aren't just "Okay, but..." They need to deepen the specific point she just conceded. For the Korea question, if she says the instrument fails, the follow-up should ask what remains of the evidence if we throw that out. For the culture question, if she says culture is institutional persistence, the follow-up should ask if that makes the concept tautological.

  7.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are eight interview questions designed to press your guest on the mechanics and implications of her theory, including the three specific topics you requested with their tailored follow-ups.

  **1. The "Eureka" Moment**
  Most development economics relies on the idea that we can find "natural experiments" hidden in history—places where luck, rather than policy, determined the outcome. Your theory suggests that even those moments of luck were actually selected for. I'm curious about the breaking point for you: was there a specific dataset or a specific historical map where you looked at a famous "border discontinuity" and realized the border itself was the variable that was rigged?

  **2. The Mechanism of Selection**
  Let's get into the weeds of how this endogeneity actually happens on the ground. If colonial powers drew borders precisely where extractive institutions were viable, they must have had some signal of that viability before they drew the line. Are we talking about explicit surveys and resource maps, or is this a softer, evolutionary process where empires simply expanded until the cost of extraction outweighed the profit, and the border formed at that margin?

  **3. The Korea and Africa Cases (Exclusion Restriction)**
  *This addresses your requirement regarding Korea/Africa and exclusion restrictions.*
  The two biggest pillars in this literature are usually the partition of Korea and the arbitrary borders of Africa. Economists love these because they seem to offer a clean "exclusion restriction"—the border splits similar people, so any difference in wealth must be the institution. But if your theory holds, the DMZ or the Berlin Conference lines weren't random shocks; they were placed where division was feasible or profitable. If the "treatment" of being split wasn't randomly assigned, do those cases fail the exclusion restriction entirely, turning what we think of as hard evidence into just post-hoc narratives with fancy econometrics?

  *   **Follow-up (Keyed to her likely answer: The instruments fail because the treatment was never random):**
      "If the treatment wasn't random, then we can't estimate the causal effect of the institution at all. So I have to ask: if we throw out Korea and Africa because the borders were endogenous, is there *any* major identification strategy left in development economics, or does the whole empirical foundation collapse?"

  **4. The Survivorship Bias**
  You're arguing that we only see borders today where the state survived. But what about the places where the extractive institution was tried and failed? If a colonial power drew a border, set up an extractive regime, and then the state collapsed into civil war or anarchy, do we still count that as an observation of "bad institutions," or does that data get lost because there's no government left to measure?

  **5. Culture as a Residual Bin**
  *This addresses your requirement regarding culture as a residual.*
  In a lot of regressions, once you control for geography and institutions, there's still variation in income that the model can't explain. Often, that leftover variation gets labeled "culture." Is it possible that culture is just a residual bin—a polite name for the error term—used to save the model when institutions and geography fail to predict the outcome?

  *   **Follow-up (Keyed to her likely answer: Culture hides unmeasured institutional persistence):**
      "So you're saying what we call 'culture' is actually just institutional habits that have lasted so long they look like traditions. But if we define culture as 'persistent institutions we can no longer see,' doesn't that make the concept unfalsifiable? How do we ever prove it's *not* just culture if we can't measure the original institution?"

  **6. Geography vs. Institutions (The Counterfactual)**
  *This addresses your requirement regarding historical counterfactuals and co-evolution.*
  Institutions and geography have co-evolved over centuries; good ports attract trade, which attracts specific laws, which attract more trade. Given that feedback loop, is there any historical counterfactual that could genuinely separate institutional quality from geographic luck? Or are we trying to surgically separate two organs that grew together inside the same body?

  *   **Follow-up (Keyed to her likely answer: True separation is impossible without impossible counterfactual worlds):**
      "If true separation is impossible without creating a parallel universe, then when policymakers ask 'should we copy this legal system to get rich?', are we essentially giving them medical advice based on astrology? How do you advise a government when the science says you can't isolate the medicine from the patient?"

  **7. The "Best Case" Scenario**
  Let's play devil's advocate. Even if border discontinuities are methodologically broken as you suggest, the correlation between inclusive institutions and wealth is still incredibly strong globally. Even if we can't prove causality with a border RDD, isn't there still enough observational weight to say, "Well, it works everywhere we see it, so it's probably the cause"? Or does the selection bias you've identified poison that correlation too?

  **8. The Path Forward**
  If the standard toolkit of natural experiments is circular, what should a young economist do tomorrow morning? Should they stop looking for borders and start digging into archives, or is there a new statistical approach that can handle boundary endogeneity without requiring that impossible counterfactual we just discussed?
