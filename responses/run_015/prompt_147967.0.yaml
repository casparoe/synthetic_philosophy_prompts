          *   *Analysis:* Here's a potential slide. Hacking acknowledges asymmetry in *power*, but does he say clinicians treat the framework as *fixed*? Hacking emphasizes that the *classification itself* changes over time due to the loop (dynamic nominalism). Clinicians *do* revise the DSM. The claim that they treat it as fixed while it accumulates descriptions seems slightly off. It's more that the *kind* changes, forcing the classification to chase the moving target. Also, the idea that patients *only* fit the label (accommodation) ignores resistance or rejection.
