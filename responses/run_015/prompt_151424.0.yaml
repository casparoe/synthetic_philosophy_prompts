  Your framework is logically coherent except for a direct operational contradiction between your acceptance of outcome-based desert and your restriction of algorithms to mental-state calibration.

  **1. High Severity: Moral Luck (b) vs. Algorithmic Calibration (c)**
  This is a functional impossibility: if desert is partially constituted by outcomes (b), an algorithm restricted to measuring mental states (c) cannot calculate a just sentence. By limiting calibration to internal states, you render the algorithm incapable of accounting for the moral luck you deem essential to desert.
  *   **Cheapest Revision:** Amend (c) to allow algorithms to intake outcome data as a legitimate variable for desert calculation, not just mental states.
  *   **Sacrifice:** You sacrifice the theoretical purity that sentencing tools should measure only what was within the agent's control (mens rea), explicitly endorsing outcome data as a sentencing input.

  **2. Medium Severity: Tech Funding (e) vs. Algorithmic Restrictions (c)**
  Brain-scan and AI-interview tech often detect propensities or neurological risk factors rather than specific past mental states. If the tech funded in (e) reveals forward-looking risk profiles, using them violates the ban on group-based or risk-based scoring in (c).
  *   **Cheapest Revision:** Specify in (e) that funded technology must be validated strictly for backward-looking mens rea detection, not forward-looking risk assessment.
  *   **Sacrifice:** You sacrifice the potential incapacitative utility of the technology; you pay for the tech but ignore any data it yields regarding future dangerousness.

  **3. Dissolved Tension: Hard Retributivism (a) vs. Epistemic Default (d)**
  Your worry that (d) collapses into consequentialism is unfounded. Defaulting to the least punitive sentence when desert is opaque is a procedural safeguard (in dubio pro reo) rooted in rights, not utility. It prevents the state from violating the retributive limit against punishing beyond what is deserved, rather than justifying punishment based on social benefit.
  *   **Status:** Dissolves on inspection; (d) acts as a necessary evidentiary rule to protect the integrity of (a).

  **4. Dissolved Tension: Hard Retributivism (a) vs. Moral Luck (b)**
  While some retributivists reject moral luck, accepting it does not contradict hard retributivism itself. It simply defines "desert" to include external outcomes alongside internal culpability.
  *   **Status:** Dissolves on inspection; this is a substantive choice within the retributive camp, not an internal inconsistency.
