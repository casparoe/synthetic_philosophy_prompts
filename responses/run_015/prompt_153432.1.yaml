prompt: |-
  I am a PhD student in history and philosophy of science, and next month I present at an interdisciplinary workshop on scientific priority and conceptual change. The audience includes senior historians of early modern mathematics and Victorian biology, a philosopher of science committed to structural determinism about discovery, a sociologist of science who treats priority disputes as pure exercises in credit allocation and disciplinary power, and several graduate students in the room. My thesis is that in simultaneous invention—specifically Newton and Leibniz on calculus, and Darwin and Wallace on natural selection—the standard question "who discovered it first?" should be replaced by asking whose formulation possessed the adoption infrastructure—the notation, evidential architecture, and disciplinary embedding—that allowed an identical propositional content to become operational within a research tradition. I argue that Leibniz's differential notation was structurally portable but conceptually detached from mechanics, whereas Newton's fluxions were embedded in the physical framework of the Principia but notationally isolated; similarly, Wallace's 1858 essay triggered joint presentation but only Darwin's two-decade accumulation of supporting evidence allowed natural selection to survive as a working research program rather than a speculative hypothesis. Consequently, propositional identity does not entail scientific equivalence, and the normative significance of attribution lies in tracking conditions of structural uptake rather than in establishing temporal priority. The session allows forty-five minutes for the talk and twenty minutes for Q&A. Prepare me for the objections: order them by how likely they are to arise and how damaging each would be, phrase each objection exactly as the audience member who would raise it would phrase it, indicate for each whether I should concede part of the point, what I should hold, what reply I can deliver within the time available, and where that reply is weakest. Include the objection I am most hoping nobody asks but that targets the weakest structural point in my own argument—the move from "different uptake conditions" to "normative irrelevance of temporal priority"—so that I can defend it deliberately rather than hope it is missed. Do not provide bibliographies, reading lists, or citations; I need conceptual preparation that relies only on reasoning available without external lookup.
