      Is this a conflict? No. VNM utility is not "in the head" in the sense of a qualia meter. It's a representation of preferences over lotteries. So #1 and #2 are compatible *if* "quantity in the head" means "hedonic experience." If it means "mathematical representation," then #2 contradicts #1's "just ordering" claim. VNM utility preserves ordering of *lotteries*, which implies cardinality of the utility function over *outcomes*. I need to clarify this distinction. It's a technical conflict, not a metaphysical one. I'll rank it lower than the #3/#4 crash.

