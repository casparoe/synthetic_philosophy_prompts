answer: |-
  The tension is exegetically resolvable within Kant's system by distinguishing the ground of obligation from the object of action, though modern distinctions like moral considerability reveal why his position feels unstable to contemporary readers.

  The apparent contradiction dissolves when you recognize that for Kant, the "blameworthiness" of cruelty is grounded entirely in a violation of an imperfect duty to oneself, specifically the duty to preserve one own's moral feeling and sympathetic capacities. When Kant asserts that cruelty is not analogous to damaging a tool, he is not granting the animal intrinsic moral worth; rather, he is acknowledging that the animal's capacity for suffering is the necessary *occasion* for the duty, even if it is not the *ground* of the duty. The ground remains the humanity within the agent: by ignoring the suffering of a sentient being, the agent dulls the natural predisposition of sympathy that reason requires us to cultivate to fulfill duties to other humans. Therefore, the act is blameworthy "in itself" not because the animal has a claim, but because the act constitutes an immediate vice in the moral character of the human, independent of any downstream consequences for other people.

  This distinction relies heavily on the separation between juridical and ethical duties, which later interpreters often conflate. Juridically, animals are things; they have no rights and cannot be wronged in a legal sense because they lack rational agency. Ethically, however, they are analogues of humanity; they serve as the practice ground for virtues required by the moral law. The lecture notes you are auditing likely reflect Kant's insistence that while we have no duty *to* the animal (juridical/direct), we have a duty *regarding* the animal (ethical/indirect) that is binding regardless of external observation. This makes the duty non-instrumental in a utilitarian sense—it is not about avoiding social sanction—but it remains indirect in a deontological sense because the obligation terminates in the self, not the creature.

  Applying the modern distinction between moral status and moral considerability clarifies the friction without necessarily saving Kant from contemporary criticism. Kant denies animals moral status (they are not ends-in-themselves) but implicitly grants them a form of moral considerability in that their suffering must be taken into account to preserve human virtue. Modern vocabularies highlight that Kant is answering a question about the conditions of rational agency, whereas contemporary animal ethicists ask about the conditions of sentient suffering. The "crack" you perceive is the strain between these two questions; Kant remains consistent if you accept that moral concern can be triggered by sentience without being grounded in it, but the system feels precarious because it relies on the contingent fact that humans possess sympathy rather than the necessary fact that animals feel pain.
