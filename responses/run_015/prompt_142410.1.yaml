answer: |-
  Here is a runnable plan for your 90-minute session. It is designed to be low-tech, high-friction (in the productive sense), and tightly mapped to the Copycat architecture.

  # Session Plan: The Microdomain of B-F-K-M-Q-X

  **Total Time:** 90 Minutes
  **Materials:** Whiteboard, markers, printed handouts (2 versions), scrap paper for students, "Cognitive Credit" ledger (drawn on board).
  **Room Setup:** 14 students. Arrange into 3 teams of 4-5 for the wagering round, but keep seating flexible for individual work.

  ## Part 1: The Microdomain & Round 1 (25 Minutes)

  ### The Alphabet
  Write this prominently on the board and **do not erase it**.
  **ORDER:** `B — F — K — M — Q — X`
  **RULES:**
  1.  This is the only alphabet that exists for today.
  2.  `B` is the first (no predecessor). `X` is the last (no successor).
  3.  Strings can be any length.
  4.  Task: Given `A` is to `B`, what is `C` to `?`

  ### The Item List (Round 1)
  *Hand out a single sheet with these three problems. Instructions: "Work silently. Write your answer and a one-sentence justification. Do not talk to neighbors."*

  1.  **Warm-up:** `B F K` is to `B F M` as `K M Q` is to `?`
      *   *Intended Answer:* `K M X` (Successor of last symbol).
      *   *Purpose:* Establishes the "Successor of Last" rule. Low friction.
  2.  **The Wall:** `B F X` is to `?`
      *   *Intended Answer:* None/Blocked.
      *   *Purpose:* Forces a collision. `X` has no successor. Students must feel the rule break. Some will invent a wrap-around (`B`); some will say "Impossible."
  3.  **The Void:** `X X X` is to `?`
      *   *Intended Answer:* Highly variable.
      *   *Purpose:* Dissolves the "Last Item" object. Is the object the string? The letter? The count?
      *   *Collapse Point:* This is where the "obvious rule" dies.

  **Collection:** Collect these sheets immediately. Do not discuss answers yet. Tally the `X X X` responses on the board (anonymously) just to show spread (e.g., "5 people said X X, 4 said X X X X, 3 said X X B").

  ## Part 2: The Priming Manipulation (25 Minutes)

  *This addresses your colleague's concern about "no answer key." The answer key here is empirical: does the prime shift the distribution?*

  ### The Handouts
  Print two versions. Use different colored paper if possible, or label clearly **VERSION ALPHA** and **VERSION BETA**.
  **Instruction:** "Look at the example pair. It demonstrates the *logic* of the transformation. Then solve the Target. Do not show your example pair to anyone else."

  | **VERSION ALPHA (Predecessor Prime)** | **VERSION BETA (Group Prime)** |
  | :--- | :--- |
  | **Example:** `M Q` is to `M K` | **Example:** `B B` is to `B B B` |
  | *Logic:* The last item steps **backward** in the alphabet. | *Logic:* The **group** grows by one unit. |
  | **Target:** `X X X` is to `?` | **Target:** `X X X` is to `?` |
  | *Expected Slip:* "Predecessor" or "Remove One". | *Expected Slip:* "Successor" or "Add One". |
  | *Likely Answer:* `X X B` or `X X` | *Likely Answer:* `X X X X` |

  **Procedure:**
  1.  Distribute face down. 7 students get Alpha, 7 get Beta. (Sit them intermixed if possible to prevent table-clustering, or separate them if you fear leakage. *Recommendation:* Separate them left/right side of room for this specific exercise to ensure clean data, then mix for wagering).
  2.  5 Minutes silent work.
  3.  **The Reveal:** Ask Alpha group to raise hands if they changed the *letters*. Ask Beta group to raise hands if they changed the *length*.
  4.  **Point:** The "fact of the matter" in the Target (`X X X`) was determined by the *activation state* of the concept network (primed by the Example), not by the Target itself.

  ## Part 3: The Wagering Round (20 Minutes)

  *Goal: Make "probability without truth" concrete. No money changes hands; use "Cognitive Credits" (CC).*

  **Setup:**
  1.  Form 3 Teams (approx 5 students each).
  2.  Give each team 100 CC starting balance.
  3.  **The Problem:** `M Q X` is to `?` (Return to "The Wall" problem from Round 1).
  4.  **The Task:** Teams must predict the **Modal Answer** of the entire class (including the other teams) if asked to solve this *right now*.
  5.  **The Wager:** Teams allocate 100 CC across the three most likely answers (e.g., 60 CC on `M Q B`, 40 CC on `Impossible`, 0 CC on `M Q M`).
  6.  **Anti-Gaming:**
      *   Bets are written secretly and handed to you.
      *   Teams cannot talk during betting.
      *   **Payout:** You tally the actual class answers (quick show of hands). The team whose distribution has the highest correlation with reality wins the pot. (Simpler alternative: Team closest to the actual % of the Mode wins 50 CC from each other team).

  **Why this works:** It forces them to model the *cognitive system of the room*. It validates "wrong" answers as statistically probable. It makes the "answer key" the *distribution*, not the logic.

  ## Part 4: The Temperature Round (15 Minutes)

  *Goal: Demonstrate control over randomness/creativity.*

  **Task:** Solve `B F K` is to `B F M` as `F K M` is to `?`
  1.  **Pass 1 (Low Temp):** "Write the answer that requires the least mental effort. The one everyone would agree on." (Time: 1 min).
  2.  **Pass 2 (High Temp):** "Write an answer that is defensible but surprising. If you were trying to beat the system, what would you write?" (Time: 2 min).
  3.  **Compare:** Ask for a show of hands. Pass 1 should be uniform (`F K Q`). Pass 2 should be scattered (`F K Q`, `F K B`, `Q K F`, etc.).
  4.  **Point:** The problem didn't change. The *system parameter* changed.

  ## Part 5: Debrief (20 Minutes)

  *Map the experience to the architecture. Do not resolve the tension; name it.*

  1.  **Slippage (The Wall):** When you hit `X` in Round 1, you felt a micro-panic. You couldn't apply the rule. To proceed, you had to let "Successor" slip to "Predecessor" or "Wrap-around." In Copycat, this is a link weight shifting when activation hits a dead end.
  2.  **The Slipnet (The Prime):** Why did Alpha and Beta give different answers to `X X X`? The target was identical. The *context* changed the activation levels of concepts like "Group" vs. "Letter." Your brains were not blank slates; they were weighted networks.
  3.  **Codelet Competition (The Feeling):** In the Wagering round, did you argue? That argument is the workspace. One student says "It's about length!" another says "It's about letters!" That is competing codelets building structures.
  4.  **Temperature:** Round 4 showed that creativity is a parameter, not a magic spell. Low temperature = deep valley in the landscape. High temperature = hopping across ridges.
  5.  **The Truth Tension:** In the Wager, there was no "correct" answer to `M Q X`. But there *was* a correct prediction of the class. Copycat doesn't find Truth; it finds *plausibility*. Plausibility is a statistical property of a community of processors, not a logical property of a string.

  ***

  # Honesty Notes: What Will Go Wrong & What Is Missing

  ### 1. Predictable Failures (and Mitigations)

  *   **The Dominant Rule-Announcer:** One student will say in Round 1, "It's just +1, but if it's X, wrap to B." They will feel satisfied and disengage.
      *   *Mitigation:* In Round 2 (Prime), the Alpha/Beta split makes their "Wrap to B" rule less likely to be the modal answer for their group. In the Debrief, ask them: "Your rule is consistent, but why did 7 other smart people disagree with you despite seeing the same string?"
  *   **The Refuser:** A student may say, "This is ill-posed. I refuse to guess."
      *   *Mitigation:* Validate them. "You are acting like a classical logician. Copycat acts like a psychologist. For this exercise, I need you to act like a cognitive agent, not a logician. Guessing *is* the task."
  *   **Prime Leakage:** Students compare handouts.
      *   *Mitigation:* Collect the Example Pair portion of the handout *before* they solve the Target. Or, simply instruct: "The value of this exercise depends on isolation. If you leak, you ruin the data for your colleagues." Upper-level students usually respond to the "ruin the data" framing.
  *   **Timing Creep:** The Wagering tally takes too long.
      *   *Mitigation:* Pre-draw the tally sheet on the board. Ask for hands immediately. Do the math live; it adds drama.

  ### 2. Architectural Limitations (What You Must Disclose)

  You must tell them what this exercise *failed* to simulate. If you don't, they will think Copycat is just a fancy way of doing what they did on paper.

  *   **Serial vs. Parallel:**
      *   *Reality:* You thought of one idea, then another, then another. That is serial.
      *   *Copycat:* Thousands of codelets run simultaneously. Structures are built and destroyed in parallel.
      *   *Why it matters:* In Copycat, the "answer" emerges from the dust of competition. In this room, the answer emerged from the loudest voice or the first idea. The exercise simulates the *outcome* of parallelism (variability), not the *process*.
  *   **Symbolic vs. Sub-symbolic:**
      *   *Reality:* You used language ("Predecessor," "Group"). You reasoned with concepts.
      *   *Copycat:* The nodes in the Slipnet are not words; they are activation potentials. A "concept" is a temporary cluster of activity, not a dictionary definition.
      *   *Why it matters:* You cannot "choose" to slip in Copycat. The slip happens to the system when pressure builds. You chose to slip. This makes you more agentic than the model.
  *   **Scale:**
      *   *Reality:* 14 students, 1 run each.
      *   *Copycat:* 1 system, 1000 runs to generate a distribution.
      *   *Why it matters:* Our "distribution" is noisy. Copycat's distribution is stable. We are simulating the *shape* of the curve, not the statistical power.

  ### 3. The "So What?" for the Colleague
  Your colleague worries this is a puzzle session with no answer key.
  **Your rebuttal:** The answer key is the **distribution**. In cognitive science, the phenomenon *is* the variance. If every student gave the same answer, the model would be unnecessary. The fact that Alpha and Beta diverged *is* the data. The exercise proves that "analogy" is not a function $f(x) = y$, but a process $P(x, context, temperature) \rightarrow Distribution(y)$. That is the lesson.

  ***

  # Printable Handout Text

  *(Copy and paste these into two separate documents)*

  **HANDOUT VERSION ALPHA**
  **DO NOT DISCUSS YOUR EXAMPLE WITH NEIGHBORS**

  **Part 1: Study the Example**
  Observe the transformation rule in this pair.
  `M Q`  is to  `M K`

  **Part 2: Solve the Target**
  Apply the logic you observed above to this new problem.
  `X X X`  is to  `?`

  **Answer:** _______________
  **Justification (one sentence):** _______________

  ***

  **HANDOUT VERSION BETA**
  **DO NOT DISCUSS YOUR EXAMPLE WITH NEIGHBORS**

  **Part 1: Study the Example**
  Observe the transformation rule in this pair.
  `B B`  is to  `B B B`

  **Part 2: Solve the Target**
  Apply the logic you observed above to this new problem.
  `X X X`  is to  `?`

  **Answer:** _______________
  **Justification (one sentence):** _______________
