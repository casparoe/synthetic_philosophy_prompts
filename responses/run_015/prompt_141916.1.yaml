answer: |-
  ### Stage 1: Mapping the Territory

  Before adjudicating who won, we must disentangle the four distinct philosophical questions this argument is conflating. First, there is the **Ontological Question**: Are the remains *persons* (subjects of rights and relational duties) or *objects* (sources of data)? If they are persons, "partial harm" is a category error; if objects, it is a calculation. Second, there is the **Structure of Value Question**: Is value continuous (concave/convex curves where more is better) or discrete (step-functions where a threshold breach destroys all value)? This determines whether "compromise" is mathematically possible. Third, there is the **Political Baseline Question**: Is the starting point a negotiation between equals (where both give something up) or a rectification of injustice (where one side returns what was never theirs)? This dictates whether the outcome is a "trade" or a "settlement." Fourth, there is the **Temporal Question**: Is this interaction a single transaction to close a file, or a node in an ongoing relationship? If the latter, the "loss" of data now might be traded for "gain" in trust later, which changes the utility function entirely. Your dispute is intractable because the Anthropologist is arguing from Continuous Value and Negotiated Baseline, while the THPO is arguing from Discrete Value and Entitlement Baseline; they are not disagreeing on the answer, but on the geometry of the moral space they inhabit.

  ***

  ### Stage 2: Adjudication and Verdict

  #### Ratings of the Seven Moves

  **(1) THPO: Rejection of destructive component & veto unenforceability.**
  **Verdict: Clearly Right.**
  She correctly identifies that destructive sampling violates the categorical duty to intactness, and her practical insight that data once created cannot be effectively "vetoeed" exposes the hollowness of the museum's governance safeguard.

  **(2) Anthropologist: Textbook Pareto improvement claim.**
  **Verdict: Clearly Mistaken.**
  This is a category error; a Pareto improvement requires that no one be made worse off relative to a legitimate baseline, but he defines the baseline as "no agreement" (status quo) rather than "justice" (repatriation), effectively counting the return of stolen property as a "gain" for the thief.

  **(3) THPO: Pareto framing begs the question & baseline correction.**
  **Verdict: Clearly Right.**
  This is the philosophical core of the dispute; she correctly identifies that value incommensurability renders the "quantity of gain" meaningless, and she rightly asserts that conceding a legal right is a loss, not a trade.

  **(4) Anthropologist: Tolerance of delay/imaging proves value is a curve.**
  **Verdict: Mostly Mistaken.**
  This is a Sorites fallacy; accepting a delay (logistical burden) or imaging (non-invasive) does not logically entail accepting destruction (ontological change), as she clarifies in Move 5.

  **(5) THPO: Consent vs. Endurance & the intactness line.**
  **Verdict: Clearly Right.**
  She successfully re-establishes the deontological constraint, distinguishing between enduring a process one opposes (delay) and consenting to a violation of integrity (drilling), preserving the categorical distinction.

  **(6) Anthropologist: Symmetry of convexity (all-or-nothing DNA).**
  **Verdict: Plausible but Ethically Weak.**
  Scientifically, he is likely correct that paleogenomics requires destruction (convex value), but ethically, asserting that his "all-or-nothing" need overrides her "all-or-nothing" constraint is an assertion of power, not a moral argument.

  **(7) THPO: "Nothing is close to right" + alternative pathways.**
  **Verdict: Clearly Right.**
  This is the most mature ethical move; she acknowledges the tragedy of lost knowledge without accepting the premise that this justifies rights violations, and she offers a constructive alternative that respects the constraint.

  #### Strongest and Weakest Points

  *   **THPO Strongest Point:** **Move 7.** By acknowledging the loss of knowledge ("nothing is close to right") while refusing to monetize it against rights, she avoids the trap of appearing anti-science and shifts the burden back to the museum to find ethical avenues.
  *   **THPO Weakest Point:** **Move 1 (The Veto Argument).** While practically true, arguing that the veto is "unenforceable" concedes too much ground to the idea that the data *should* exist to be governed; a stronger stance is that the data *should not exist*.
  *   **Anthropologist Strongest Point:** **Move 6.** He honestly admits his side's value function is also convex (step-wise); this prevents him from being dismissed as a naive consequentialist and forces the recognition that *both* sides face "all or nothing" constraints.
  *   **Anthropologist Weakest Point:** **Move 2.** The Pareto claim is intellectually dishonest in a colonial context; it attempts to use welfare economics to bypass human rights law, which is the quickest way to lose philosophical credibility.

  #### What Both Are Missing

  Both parties are treating the remains as the sole locus of value, ignoring the **Relational Capital**. They are missing the opportunity to frame the *refusal* of destructive sampling as a positive contribution to a new research ethic that could secure long-term access to other sites. The Anthropologist misses that trust yields more data over decades than drilling yields in months; the THPO misses that explicitly funding or facilitating non-destructive tech development could be a proactive counter-offer rather than a defensive block. They are also ignoring **Temporal Stewardship**: bones can be stored frozen for 50 years until non-destructive DNA sequencing exists; treating "now or never" as a fact rather than a technological limitation is a failure of imagination on both sides.

  #### Verdict on Your Three Conditions

  1.  **The Concavity Condition:** This is a real and useful descriptive tool from welfare economics, but **yes, using it risks smuggling in his framing.** If you ask "What is the concavity of her value?" you imply her value *can* be plotted on a curve of quantity. However, if you allow for a "step function" (infinite convexity at the point of violation), the tool can model her deontology without rejecting it. In this specific case, the condition explains *why* compromise fails: both sides have convex value functions (Anthro needs 100% destruction for data; THPO needs 0% destruction for sanctity). There is no overlapping concave region where trade creates surplus.
  2.  **The Cross-Valuing Condition:** This is robust. Gains from trade require that I value your peace of mind or you value my knowledge. Here, cross-valuing is near zero. The Anthropologist does not value the ancestors' sanctity intrinsically, only instrumentally (as a barrier to research); the THPO does not value the data intrinsically. Without cross-valuing, there is no trade, only conflict.
  3.  **The Baseline Condition:** This is the most critical and **she is right to insist on it.** If the baseline is "Repatriation," the Museum is asking for a waiver of rights, not offering a trade. Using the "no-agreement" baseline (Museum keeps bones) is a rhetorical coercion that treats illegal possession as a bargaining chip.

  **Does a deal exist?**
  **No, not on the specific request.** The Concavity Condition fails because both value structures are convex (step-functions) regarding destructive sampling; there is no "middle" that yields value for both. The Baseline Condition fails because the Museum is asking the Tribe to waive a right, not exchange a good.

  **However, a structural deal is possible:**
  The Museum repatriates immediately without destructive sampling (honoring the Baseline). In exchange, the Tribe agrees to a **Future Technology Clause**: the Museum may store the remains in a climate-controlled facility managed by the Tribe, with a standing agreement that if non-destructive DNA sequencing becomes viable within 50 years, the Tribe will consider a new proposal. Additionally, the Museum commits funding to develop non-destructive methods and redirects its research focus to the unaffiliated remains the THPO mentioned in Move 7. This converts the transaction from "splitting the loss" to "investing in a future where the trade-off disappears."

  **Overall Winner:** **The THPO.** She wins on the Baseline (legal and moral entitlement), the Structure of Value (categorical constraints trump aggregative calculations), and the Outcome (she secures the return of ancestors without accepting complicity). The Anthropologist wins only on the tragic acknowledgment that information will be lost, but he fails to prove that this loss justifies the violation.
