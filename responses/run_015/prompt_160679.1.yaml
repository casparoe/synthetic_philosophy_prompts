  Your classifier case is the pivot. For the epistemicist, this is vindication: vagueness *is* ignorance of a sharp boundary, and the algorithm proves such boundaries can exist without being salient. Williamson argues that knowledge requires safety; even if the code is accessible, the cognitive cost of checking it or noise in the input data creates a margin for error, preserving the ignorance intuition. The users' resistance is not semantic indeterminacy but pragmatic rationality: knowing the cutoff doesn't help if the measurement is noisy. The supervaluationist, conversely, must deny this is vagueness proper. If the cutoff is fixed by fiat, the set of admissible precisifications collapses to a singleton. There is no truth-value gap, only ignorance. The "feel" of vagueness is a psychological artifact, not a semantic feature.

  This strongly supports your third hypothesis: natural language vagueness bundles semantic indeterminacy with epistemic limitation, which come apart in stipulated cases. However, it also validates your first hypothesis regarding data priority. Epistemicists treat the validity of classical logic (e.g., excluded middle) as non-negotiable data, forcing the phenomenology of borderliness to be explained away as ignorance. Supervaluationists treat the intuition that borderline cases lack a truth value as non-negotiable, forcing logic to be revised or restricted via the supertruth operator. The classifier case shows both can accommodate the facts by redefining what counts as "vagueness." The epistemicist says the classifier is vague because users are ignorant; the supervaluationist says it is not vague because the semantics are fixed.

  Consequently, the second hypothesis—that the distinction collapses formally—is the least likely to resolve the dispute. Both sides can model the other's operator; Williamson can model determinacy as known truth, and Keefe can model knowledge as truth across precisifications. The formalism is flexible enough to mask the metaphysical disagreement. The real disagreement is ontological: does the boundary exist independently of our epistemic access?

  Progress should be ranked as follows. First, empirical findings about speaker psychology: if experiments show that users hesitate even when the cutoff is salient and measurement is perfect, this undermines the epistemicist's claim that ignorance is solely due to margin-for-error constraints. Second, a change of question: shifting from "What is vagueness?" to "Which model best serves specific communicative goals?" would dissolve the metaphysical standoff. Third, a formal result proving equivalence would only show inter-translatability, not metaphysical truth.

