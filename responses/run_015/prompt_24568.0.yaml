      *   *Section 4 (Contribution):* What does the film add? It introduces *Temporal Duration*. Doing/Allowing is usually instantaneous. The Lie is a sustained state. It also introduces *Symbolic Consequence*. The harm isn't physical death, but epistemic corruption.

  7.  **Refining the "Confound" Point (Self-Correction):**
