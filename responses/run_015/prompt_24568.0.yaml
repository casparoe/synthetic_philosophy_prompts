      *   *The Collapse:* The distinction relies on the agent having a choice between two outcomes where the *harm* is the variable. Here, the *agent's existence* is the variable.
      *   *Verdict:* The film pushes the distinction to its breaking point. It's not a clean test of Doing/Allowing because the "Allow" option involves a duty to self-preservation that conflicts with the duty not to kill. It tests *moral agency under existential threat*, not just the doing/allowing boundary. The film *knows* this tension (the debate on the boats), but philosophically, it muddies the water. It's not a confound, it's a boundary condition.

