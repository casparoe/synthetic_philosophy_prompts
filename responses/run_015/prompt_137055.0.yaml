answer: |-
  This is a classic problem of political philosophy disguised as departmental bureaucracy. You are wrestling with the tension between *historical legitimacy* (how did this start?) and *functional legitimacy* (why do we keep it?), compounded by a clash between Humean conventionalism and Kantian rationalism.

  Here is the breakdown of the arguments, the risks, and what you should say, followed by the requested epistemic checkpoints.

  ### 1. The New Colleague: Origin vs. Obligation
  **The Diagnosis:** The new colleague is committing a version of the genetic fallacy. He assumes that because the *cause* of the rotation was arbitrary (the hat), the *normative force* of the rotation must also be arbitrary.

  **The Defense:** You are right to feel he is wrong to conclude "therefore it binds no one." The authority of the rotation does not rest on its origin; it rests on **coordination and reliance**.
  *   **Coordination:** In a group of seven, you need a Schelling point—a focal solution that allows you to coordinate without endless negotiation. The hat provided the initial focal point. The *continuation* of the schedule is now the focal point.
  *   **Reliance:** Colleagues have planned research, sabbaticals, and prep work based on this rotation for decades. To dissolve it is to violate reasonable expectations created by the practice itself, not the hat.
  *   **The "Fear" Charge:** He claims compliance is due to fear of the chair. This is a substantive empirical claim, not a philosophical one. If true, it's a personnel issue, not a scheduling issue. If false (i.e., compliance is due to a desire to avoid conflict or maintain goodwill), that is the glue of society, not "fraud."

  **Verdict:** His objection is on target regarding the *history*, but off target regarding the *obligation*. The obligation is now contractual/conventional, not historical.

  ### 2. The Handbook Line: Transparency vs. Stability
  **The Diagnosis:** This proposal is a Trojan Horse. It looks like honesty, but it functions as delegitimization.

  **The Risk:** Recording the origin without recording the *rationale for continuation* isolates the "accident" from the "utility." It invites future readers to think, "This is a joke," rather than, "This is a settled convention." It validates the new colleague's premise (that origin determines authority) without challenging his conclusion.

  **Verdict:** **Fight this.** Or, if you must accept it, demand a companion clause: *"While the initial allocation was random, the schedule is maintained by departmental consent as a mechanism for reducing transaction costs and ensuring equitable distribution of teaching loads over time."* If they refuse the rationale, reject the history. Transparency without context is manipulation.

  ### 3. "Open Conventions": Rationalism vs. Convention
  **The Diagnosis:** This proposal is radical rationalism applied to bureaucracy. It assumes that a rule is only valid if it can be re-justified by reason in the present moment.

  **The Risk:**
  *   **Transaction Costs:** Re-arguing everything every year consumes time that should be spent on philosophy.
  *   **Power Dynamics:** "Open argument" privileges the articulate, the energetic, and the new (like your sharp new colleague). It disadvantages the tired, the junior, or those who value quiet. It turns the department into a perpetual debating society where the best rhetorician wins the easiest schedule.
  *   **Instability:** You cannot plan a research agenda three years out if your teaching assignment is contingent on next year's debate.

  **Verdict:** **Fight this hard.** It confuses *legitimacy* with *continuous explicit consent*. Conventions exist precisely so we *don't* have to re-argue the foundations of our cooperation every year. This is a Humean point: convention is the basis of justice, not reason alone.

  ### 4. What to Say at the Meeting
  Do not frame this as "tradition vs. change." Frame it as **"Coordination vs. Transaction Costs."**

  **Script:**
  > "I've been thinking about the origin of the rotation. [New Colleague] is right that it started by chance. But I don't think that dissolves our obligation to it. We aren't bound by the hat from the 90s; we are bound by the expectations and planning we've all built on top of the schedule since then.
  >
  > Regarding 'open conventions': In theory, re-arguing everything sounds rigorous. In practice, it privatizes the benefit of the doubt. It means whoever argues best gets the best schedule. The value of the current rotation isn't that it's perfect; it's that it removes teaching assignments from the realm of argument. It allows us to treat each other as collaborators rather than negotiators.
  >
  > My proposal: We keep the rotation. We do not add the handbook line about the hat unless we also add the rationale for why we keep it. And we reject open conventions, but we institute a **sunset review**. Every five years, we vote on whether the rotation still serves us. That balances stability with the right to revise."

  ### 5. Where My Reasoning Might Break (Epistemic Checkpoints)
  You asked for the weak points in this analysis. Here are the three places I am most likely to be wrong, and what would change my mind.

  **Break Point 1: The Distribution of Labor**
  *   **My Assumption:** The rotation distributes "bad" courses and loads roughly equally over time.
  *   **What Changes My Mind:** If you show me data that the rotation systematically disadvantages specific subsets of faculty (e.g., junior faculty get the high-prep intro courses while seniors get the seminars, and the rotation locks this in). If the "coordination" is actually coordinating exploitation, the genetic fallacy doesn't matter; the outcome is unjust.
  *   **Argument to watch for:** "The hat locked in a hierarchy that matches the 1990s tenure hierarchy, not current reality."

  **Break Point 2: The Nature of the "Fear"**
  *   **My Assumption:** The new colleague's claim about "fear of the chair" is hyperbole or confusion of social pressure with coercion.
  *   **What Changes My Mind:** If the Chair has a history of retaliating against dissenters in tangible ways (denying travel funds, unfavorable service loads). If the "convention" is actually enforced by threat rather than mutual benefit, it is not a Humean convention; it is a dictatorship.
  *   **Argument to watch for:** Specific instances where opting out of the rotation resulted in punitive administrative action.

  **Break Point 3: The Size of the Department**
  *   **My Assumption:** Seven people is enough to generate high transaction costs for "open conventions."
  *   **What Changes My Mind:** If the department culture is already one of high trust and low conflict. In some tiny departments, "re-arguing everything" takes 15 minutes because everyone knows everyone's needs. If the "transaction cost" is negligible, my efficiency argument collapses.
  *   **Argument to watch for:** "We spend more time complaining about the rotation than we would spend fixing it annually."

  **Summary:** Defend the rotation on grounds of *coordination*, not history. Reject the handbook line as incomplete transparency. Reject open conventions as inefficient rationalism. But keep your eyes open for evidence that the "convention" is masking actual coercion or systemic inequity.
