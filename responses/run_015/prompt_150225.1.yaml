  I am the negative that clears the ground,
  My desire kills the thing to make it mine,
  In pure immediacy I stand unbound.

  But I must shape the thing and let it stand,
  My fear flows into work and holds its form,
  I find a self I did not command.

  The feast is laid upon the wooden stand,
  It vanishes, it lacks a lasting form,
  I take my fill, I give the last command.

  The plow I forged cuts deeper than your hand,
  It weathers time, the wind, and every storm,
  My future grows from what I have planned.

  I wear the glove upon my softest hand,
  I feel no rain, I weather out the storm,
  I own the seed which you have planned.

  You eat the grain, but I became the land,
  My consciousness is in the object stored,
  You starve within the freedom you demand.
