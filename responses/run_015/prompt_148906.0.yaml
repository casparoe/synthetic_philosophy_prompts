          1.  Jordan: Critical history is self-undermining (liberation narrative = monumental). Rating: Partly Right. Justification: Captures the teleological risk, but overlooks Nietzsche's acceptance of necessary violence. Missing: The distinction between using a narrative and being enslaved by it.
