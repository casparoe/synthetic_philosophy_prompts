  The term begins again on Monday,
  syllabus marked for Tuesday.
  We wait through rain on Wednesday,
  eyes fixed on Thursday.
  It cannot land on Friday,
  unless it comes as a Surprise.

  To keep the promise of Surprise,
  we cannot end on Monday.
  If nothing comes before Friday,
  the guess is old as Tuesday.
  So we remove Thursday,
  and the day before, Wednesday.

  Logic collapses on Wednesday,
  if there is no more Surprise.
  If Friday is void, then Thursday
  is known by the start of Monday.
  So cross out Tuesday,
  and eliminate Friday.

  Nothing remains but Friday,
  or perhaps Wednesday.
  But if the week moves past Tuesday,
  where is the Surprise?
  It is known on Monday,
  so it cannot happen Thursday.

  No test on Thursday,
  nor the final Friday.
  We are safe on Monday,
  and secure on Wednesday.
  There is no chance of Surprise,
  not even on Tuesday.

  But if I sleep through Tuesday,
  and wake past Thursday,
  the proof creates the Surprise.
  Because I ruled out Friday,
  and dismissed Wednesday,
  the question holds on Monday.

  So logic fails on Tuesday and Thursday,
  leaving room for Surprise and Friday.
  We wait for Wednesday or Monday.
