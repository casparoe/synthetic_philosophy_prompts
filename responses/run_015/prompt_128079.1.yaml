  **R2: Empirical Adequacy (Instrumentalism)**
  *   **Claim:** "Roughly true" means "yields correct predictions." The theory saves the phenomena; truth is just a synonym for reliability.
  *   **Status:** Trivial. It is defensible, but it empties "truth" of any meaning beyond utility.
  *   **PMI Effect:** Stops nothing. The pessimistic induction agrees theories work; it denies they are *true*. This concedes the argument to the skeptic.
  *   **Wrinkles:** "Miracle" means "unexplained regularity." This says nothing about what is actually there, only about what instruments read.

  **R3: Selective Structural Realism**
  *   **Claim:** "Roughly true" means the load-bearing mathematical structure refers to real relations in nature, while the scenery (ontological pictures, fitted fictions) may be false.
  *   **Status:** Substantive and defensible. It matches your lab experience: the equations survive theory change even if the story changes.
  *   **PMI Effect:** Stops the induction as you stated it. The induction claims past theories were *wholly* wrong; this shows they were partially right (structurally), breaking the inductive chain.
  *   **Wrinkles:** "Miracle" smuggles in Inference to the Best Explanation (the continuity of structure across theory change is best explained by structure being real). It explicitly excludes scenery from the truth claim.

  **R4: Pragmatic Voluntarism**
  *   **Claim:** "Roughly true" is a rule of thumb: assume realism on Mondays to get work done, but don't assert it metaphysically.
  *   **Status:** True but empty. It is a policy, not a truth claim.
  *   **PMI Effect:** Stops nothing. It sidesteps the truth question entirely, leaving the skeptic's claim ("we are wrong about what's there") unchallenged.
  *   **Wrinkles:** "Miracle" is merely rhetorical. This is the "claim about what we should assume on Mondays" you suspected existed.

