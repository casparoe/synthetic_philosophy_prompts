answer: |-
  "We can't put a number on this," Elias said, tapping the draft memo. "If we recommend a twenty percent reduction, we're admitting causation we can't prove in any single case."

  "But we know the probability doubled," Sarah replied. "Ignoring that makes the sentence a lie. These defendants aren't asking for exoneration; they're asking for recognition that the state helped write the script."

  "It makes the sentence accurate to the act, though," Elias countered. "They chose to strike. The toxin didn't hold the knife. Desert is about the wrong done to the victim. That debt remains intact regardless of who weakened the debtor. The state's negligence is a separate wrong. It demands compensation, not leniency."

  "Unless the creditor is the same entity that weakened the debtor," Sarah said. "Can the state honestly demand full payment when it broke the borrower? It's not about the debt existing; it's about the standing to collect. A complicit authority loses the moral position to blame. If we punish fully, we aren't just balancing scales; we're asserting a moral superiority we don't possess."

  Elias paused, leaning back. "I can concede that. Even if they deserve punishment, we might lack the clean hands to impose it. But that's about us, not them. It suggests a stay of execution, not a reduction of guilt."

  "It's about the message," Sarah insisted. "Punishing them expresses condemnation. When we condemn people we helped impair, the expression turns inward. It says we prioritize order over our own integrity. The expressive cost is too high. We look like hypocrites."

  "Fine," Elias said. "But look forward. You want reduced sentences. Does that stop future crimes?"

  "Not directly. They don't know they were exposed. Leniency doesn't change their calculus. They aren't reasoning about sentence length when they act impulsively."

  "Exactly. So why reduce? If punishment doesn't deter them, keeping them incarcerated protects the public. Reducing sentences releases risk without buying safety."

  "Unless the cost is the state's behavior," Sarah argued. "If we punish fully, we absorb the cost of their violence into the prison budget. If we reduce sentences and mandate compensation, the state pays for the harm it caused. Full sentencing lets the state off the hook for the public health failure."

  "But there's a perverse incentive," Elias warned. "If we reduce sentences for contaminated districts, does the state save money on prisons while ignoring water safety? They might decide cheap prisoners are better than clean water. We could be creating a budgetary reason to under-invest in public health."

  "Only if we treat sentencing as the remedy," Sarah said. "We should treat it as a signal that criminal law isn't the tool here. But if we don't reduce sentences, we ignore the statistical reality that some of these crimes wouldn't have happened but for the state."

  "Then we hit the statistical wall," Elias said. "We can't tell which defendant was actually driven by the toxin. Some would have offended anyway. If we reduce sentences for all of them, we under-punish the unaffected. If we reduce for none, we over-punish the affected. We can't individualize."

  "We can't individualize," Sarah admitted. "But we can acknowledge the group harm. A blanket reduction acknowledges the statistical reality without claiming individual certainty."

  "It's dishonest," Elias said. "We'd be sentencing based on probability, not proof. I can't sign a rule that says 'you might be innocent of this aggravating factor, so you get less time.' It undermines the link between act and consequence."

  "And I can't sign a rule that says 'the state's poison doesn't matter because we can't trace the vein.' It treats the defendant as an island."

  They sat in silence for a moment, the hum of the ventilation filling the room.

  "Maybe the memo shouldn't recommend a number," Elias said finally. "Maybe it recommends shifting the burden. Compensation and remediation outside the criminal system. Sentencing stays standard because the act remains voluntary, but the state owes a separate civil debt."

  "That protects the standing issue," Sarah mused. "We don't punish less, but we don't pretend the state is innocent. We separate the blame for the crime from the blame for the condition."

  "It avoids the incentive problem too," Elias added. "Prisons don't get cheaper for the state; the civil court does the work. No reason to neglect water to save on corrections."

  "And it respects the statistics," Sarah said. "We don't guess who was caused to offend. We acknowledge the district was harmed and pay the district."

  "So no sentencing reduction," Elias confirmed. "Just a directive to route the grievance elsewhere."

  "Agreed. The criminal law handles the act. The civil law handles the context."

  The Commission recommends no adjustment to sentencing guidelines for this class of offenses. While state negligence contributed to risk conditions, individual culpability for voluntary acts remains intact, and statistical causation cannot justify individualized leniency. Grievances regarding state-induced impairment should be addressed through separate civil compensation and remediation mechanisms, ensuring state accountability without compromising the integrity of criminal adjudication.
