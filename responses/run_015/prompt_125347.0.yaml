answer: |-
  You have isolated a phenomenological distinction that standard taxonomy tends to collapse. You are describing a quality of *attention* that is modulated by *expenditure*, distinct from the *outcome* of that expenditure.

  To answer your specific boundary questions first: Yes, your second family of cases (the grim swim, the stuck sentence, the dirty window) belongs to the same category. The "wage" is not a function of how much the character likes the experience in the moment, but of how much of the self is consumed to sustain it. The unpleasantness of the dawn swim is not a bug; it is the currency. If the water were warm, the currency would be worthless.

  Regarding your second boundary question: I suspect the property *cannot* exist without the subject having done something. "Earnedness" implies a transaction. If a character inherits a house they love, the house may have value, history, or comfort, but it lacks the "wage." If they restore the rotting floorboards of that house, the *act of restoration* has the wage, and the house subsequently borrows a reflected glow of it. But passive receipt—even of something beautiful—lacks the texture you are tracking. The wage requires friction against the will or the body.

  There is no single established term that captures this precisely. Psychology and philosophy tend to look at the *consequences* of effort (dissonance reduction, virtue, achievement) rather than the *texture* of the efforted experience itself. Below is the analysis of the nearest candidates, followed by the carving you requested.

  | concept | provenance | what_it_gets_right | what_it_misses | verdict | separating_case |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | Effort Justification | psychology | Acknowledges that cost increases value. | Treats the value as a post-hoc rationalization to reduce dissonance, not a felt quality during the act. | doesn't fit | A soldier hazing a recruit claims to value the unit more *afterwards*; your swimmer feels the weight *during* the cold. |
  | Flow State | psychology | Captures the "attention caught and held" aspect. | Requires optimal enjoyment and low friction; explicitly excludes the "grim" or unpleasant experiences you describe. | doesn't fit | A gamer in flow enjoys the challenge; your translator is stuck and frustrated, yet the moment of release has the wage. |
  | Eudaimonic Well-being | both | Distinguishes meaning from simple pleasure (hedonia). | Focuses on long-term flourishing and life evaluation, not the specific sensory texture of a single morning's swim. | partly fits | A person volunteering for a cause feels eudaimonic worth; your window-cleaner gains no moral worth, only the wage. |
  | Aristotelian *Energeia* | philosophy | Distinguishes activity done for its own sake vs. for an end. | Does not account for why the *difficult* version of the activity is qualitatively different from the *easy* version if both are ends in themselves. | partly fits | Playing piano for fun is *energeia*; playing a scale painfully slow to fix a finger is the wage, but Aristotle groups them as activity. |
  | Phenomenology of Agency | philosophy | Focuses on the feeling of "I am doing this." | Usually distinguishes between voluntary and involuntary motion; does not grade the *quality* of agency based on resistance. | partly fits | Raising a light cup vs. a heavy cup both feel like agency; only the heavy cup (if lifted willingly) carries the wage. |

