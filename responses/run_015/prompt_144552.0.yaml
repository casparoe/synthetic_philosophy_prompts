prompt: |-
  I am the human-factors lead at a metropolitan rail operator, and I want a reusable procedure built out of the notion of sphexishness. I have two recurring jobs that need it. The first is authoring and revising rule-book procedures for signallers and drivers: roughly forty to fifty revisions a year, each of which has to decide whether a step should be scripted as tightly as possible or left to the operator's judgement on the ground. The second is chairing incident reviews: about a dozen a year, two working days of effort each, one ninety-minute debrief with the operator conducted three or four days after the event, no simulator access in the ordinary case, and only the data recorder and the debrief to go on. My reports go to the national rail regulator, whose analysts have no training in philosophy, and to union-nominated safety representatives. That second audience matters: a report that reads as though it called a driver a machine gets appealed and poisons the next twelve reviews, and a report that reads as excusing everyone gets ignored.

  By sphexishness I mean the property the textbook digger wasp is supposed to illustrate: an animal runs a fixed sequence triggered by a cue, and when the experimenter restores the cue after the point of the step has already been achieved, the animal repeats the step, apparently without registering that it no longer needs to. I do not want the procedure to rest on the accuracy of those original observations; use the story as an illustration only, and justify the tests on their own footing.

  What I need is a decision procedure, in words, that a field investigator with a two-day budget can actually run, with:

  1. The tests in the order they should be applied, what counts as a sufficient answer to each, where the procedure terminates in a verdict, and where it must stop and hand the question to a person because it is a question of values rather than fact. Where a test needs evidence I cannot get, mark it optional and say what is lost by skipping it.
  2. A fixed specification of grain. Rigidity looks relative to a description: at a fine enough grain everything is fixed, at a coarse enough grain nothing is. The procedure has to say what grain it tests at, and why that is the right grain for deciding whether an organisation may fairly attribute an outcome to a person.
  3. A verdict vocabulary I can put in a report, in language an analyst with no philosophy training will accept, distinguishing the case where the operator was rigid from the case where the operator adapted badly under pressure, and saying what each verdict does and does not license by way of consequence.
  4. An honest statement of what the procedure cannot do.

  Four things the procedure has to get right, and on which I want your own view rather than an echo of mine.

  The first is the grain problem above. The second is a slide my colleagues keep making and I keep failing to answer in a sentence: they go from these cases plus the thought that every action is caused to the conclusion that operators are never responsible. I believe this conflates being caused with being rigid, since a deterministic system can be extremely flexible in the relevant sense; but I want the procedure to be built so that it cannot make this slide, and if the argument has a better version than the one I have just given, I would rather you told me than flattened it.

  The third is my working taxonomy of failure modes, which I want you to use, correct, or replace: a step that once started runs to completion regardless of what changes; a step that re-runs whenever its trigger cue is present even though the point of the step has already been achieved; and a step that works across familiar configurations but produces nothing appropriate under a relevantly novel one. Are these independent? Is there a fourth? And in particular, what should the procedure say about two hard cases I cannot place: behaviour that looks flexible because it is drawn from a very large store of memorised cases rather than from any appreciation of the situation, and routines for being flexible that have themselves gone rigid, such as a mandatory stop-and-check that everyone signs without checking. I would also be grateful if the procedure contained some defence against its own second case, because my team will otherwise apply it mechanically within a year.

  The fourth is evidence. The natural test for rigidity is counterfactual: if things had been slightly different in some specified way, would the operator have done something appropriately different. I usually cannot run that experiment, and the debrief I do have is contaminated by the operator knowing how it turned out. So the procedure needs to say how to assess counterfactual sensitivity from what is actually available, and what to do when the evidence runs out: default to a system verdict, default to an operator verdict, or refuse to classify.

  Then run it on three cases.

  A. A read-back requirement we introduced for degraded working: when a driver is authorised to pass a signal at danger, the driver must repeat the instruction and the signal number back to the signaller before moving. Compliance is near perfect and errors in the content of the read-back are rising; drivers recite it fluently and get the signal number wrong. Is this step now sphexish, and does the procedure tell me to tighten the script, remove the step in favour of judgement, or do something else?

  B. A signaller faced three alarms in eleven seconds during a power-supply fault. He worked through them in rulebook order. Correctly handling the third required departing from that order. He did not depart. His compliance with the rulebook was perfect. A train was routed at low speed into a possession; nobody was injured. Is this the organisation's design having made him rigid, or a failure attributable to him?

  C. A driver with thirty years' service, well regarded, working a fatiguing roster, passed a temporary speed restriction at line speed in darkness. The board had been moved two nights earlier for works, at a site where a similar board had stood for months, and the change was covered by one line in a weekly notice. He registered that something looked off and had time to act on it. I would very much rather not have to write that this one is attributable to him: the organisation plainly failed him on rostering and on briefing, my team will not thank me, and the union will appeal. If your procedure says I must write it anyway, say so plainly and show the steps. If it says something else, show me the step at which it turns and what that step assumes.

  Finally, tell me where the procedure misfires. I specifically want to know whether it can distinguish genuine flexibility from an enormous library of canned responses, whether it can say anything about how much burden the organisation should carry as opposed to the individual, and how much room it leaves an investigator to smuggle in their own view through the choice of which counterfactuals to test.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **User Role:** Human-factors lead at a metropolitan rail operator.
      *   **Goal:** Create a reusable decision procedure based on the concept of "sphexishness" (rigid, cue-driven behavior lacking situational awareness) for two specific jobs:
          1.  Authoring/revising rule-book procedures (scripted vs. judgement).
          2.  Chairing incident reviews (attribution of responsibility/outcome).
      *   **Audience:** National rail regulator (non-philosophers) and Union safety representatives (sensitive to blaming language).
      *   **Constraints:**
          *   Field investigator budget (2 days).
          *   Evidence limited (data recorder + debrief, no sim, hindsight bias in debrief).
          *   Must address the "Grain Problem" (rigidity is relative to description level).
          *   Must prevent the "Causation = No Responsibility" slide.
          *   Must use/evaluate/correct the user's taxonomy of failure modes.
          *   Must address "Canned Flexibility" (large library of cases) and "Rigidified Flexibility Routines" (tick-box culture).
          *   Must handle Counterfactuals without actual experimentation.
          *   Must provide a specific verdict vocabulary.
          *   Must include an honesty statement (limitations).
          *   Must run on three specific cases (A, B, C).
          *   Must identify where the procedure misfires (limitations regarding canned responses, burden sharing, investigator bias).
      *   **Tone:** Professional, precise, actionable, philosophically robust but accessible.

  2.  **Analyze the Core Concept: Sphexishness:**

      *   *Definition:* Behavior triggered by a cue that runs a fixed sequence, insensitive to changes in the environment that render the sequence pointless or harmful, even if the change occurs *during* the sequence.
      *   *Key Distinction:* It's not about determinism (everything is caused); it's about *feedback loops*. A flexible system monitors the *goal state*, not just the *trigger state*.
      *   *Application to Rail:* Is the operator monitoring the *outcome* of their action or just executing the *motion*?

  3.  **Address the "Four Things to Get Right":**

      *   **1. The Grain Problem:** Rigidity depends on how you describe the action. "Pressed button" is fine-grained (rigid). "Secured the route" is coarse-grained (might be flexible).
          *   *Solution:* Define the grain at the level of *Functional Intent*. The test isn't "Did they move their hand the same way?" but "Did they pursue the same safety goal despite evidence the goal was achieved/obsolete?"
      *   **2. Causation vs. Rigidity:** Colleagues argue "Everything is caused, therefore no responsibility."
          *   *Solution:* Distinguish *Open-Loop* (Sphexish) vs. *Closed-Loop* (Cybernetic/Feedback). Responsibility attaches to the capacity for feedback. If the system design removes the feedback channel, the organization bears the burden. If the feedback channel existed and was ignored, the operator bears some burden.
      *   **3. Taxonomy of Failure Modes:**
          *   User's 1: Run to completion regardless of change (Classic Sphex).
          *   User's 2: Re-run trigger (The Wasp/Cricket scenario).
          *   User's 3: Works in familiar, fails in novel (Brittleness).
          *   *Additions:* "Canned Flexibility" (Lookup table vs. Model) and "Rigidified Safety Routine" (Checklist fatigue).
          *   *Independence:* They are distinct manifestations of open-loop control.
      *   **4. Evidence/Counterfactuals:** Can't run experiments. Debrief is contaminated.
          *   *Solution:* Triangulation. Look for *micro-deviations* in the data recorder. Look for *prior training records*. Look for *system design* (did it allow feedback?). If evidence is insufficient, default to *System Verdict* (Benefit of Doubt to the Human).

  4.  **Drafting the Procedure (The "Sphex-Test Protocol"):**

      *   *Name:* Needs to sound operational, not academic. "Operational Feedback Sensitivity Protocol (OFSP)"? Let's stick to the user's term but formalize it. "The Sphex-Attrition Protocol." No, too negative. "The Feedback Sensitivity Assessment." Let's use "The Rigidity & Adaptation Assessment (RAA)."
      *   *Structure:*
          1.  Define Grain (Functional Intent).
          2.  Evidence Gathering (Data + Debrief constraints).
          3.  The Three Tests (Completion, Trigger, Novelty).
          4.  The "Canned" Check.
          5.  Verdict & Attribution.
      *   *Verdict Vocabulary:* Needs to be neutral. "Open-Loop Execution" vs. "Closed-Loop Failure."
      *   *Stopping Rules:* When to hand off to values (e.g., how much training is *enough*?).

  5.  **Refining the "Causation Slide":**

      *   The argument "Caused = Not Responsible" is a category error. Responsibility is a social/functional attribution based on *control capacity*.
      *   *Procedure Fix:* The procedure asks "Was there a available feedback channel?" not "Was the action determined?"

  6.  **Refining the Taxonomy:**

      *   User's 3 cases are good.
      *   *Case 4 (Canned Flexibility):* This is hard to distinguish from expertise. The test is *latency* and *explanation*. Expertise explains *why*; Canned explains *what*.
      *   *Case 5 (Rigidified Routine):* This is organizational sphexishness. The procedure must flag this as a System Failure, not Operator.

  7.  **Running the Cases:**

      *   **Case A (Read-back errors):**
          *   *Grain:* Functional intent = Verify understanding.
          *   *Observation:* Fluency + Wrong Number = Open Loop.
          *   *Verdict:* Sphexish.
          *   *Action:* Redesign step (challenge-response), don't blame driver.
      *   **Case B (Signaller Alarms):**
          *   *Grain:* Functional intent = Safe routing.
          *   *Observation:* Rule order vs. Safety outcome.
          *   *Analysis:* Did the rules allow deviation? If yes, rigidity. If no, system forced rigidity.
          *   *Verdict:* Likely System Design (Brittleness).
      *   **Case C (Speed Restriction):**
          *   *Grain:* Functional intent = Adhere to safe speed.
          *   *Observation:* 30 yrs exp, fatigued, subtle change.
          *   *Analysis:* Feedback channel (visual) existed but was degraded (darkness, fatigue, expectation).
          *   *Verdict:* System Failure (Expectation Bias + Rostering). *Crucial:* Do not blame driver.

  8.  **Addressing Limitations (Misfires):**

      *   *Canned vs. Real:* Hard to tell without deep cognitive task analysis.
      *   *Burden Sharing:* The procedure identifies *where* the break is, but policy decides *how much* blame.
      *   *Investigator Bias:* The choice of counterfactual is subjective. Need a "Null Hypothesis of Competence."

  9.  **Review against Constraints:**

      *   *Two-day budget?* Yes, relies on existing data + one interview.
      *   *Regulator/Union audience?* Vocabulary is neutral ("Open-Loop" not "Zombie").
      *   *Philosophy?* Used as foundation, not jargon.
      *   *My View?* I need to assert that "Responsibility" is about "Responsiveness," not "Uncaused Action."

  10. **Final Polish:**

      *   Ensure the tone is authoritative but collaborative.
      *   Check the "Grain" section carefully—it's the philosophical core.
      *   Make sure the "Stop and Hand to Person" points are clear.

  *(Self-Correction during drafting)*: I initially thought about suggesting simulation for Case C. But the prompt says "no simulator access in the ordinary case." I must stick to that constraint. I need to rely on the data recorder (speed profiles) and the debrief structure.
  *Correction on Taxonomy:* The user asked if the three modes are independent. They are manifestations of the same underlying lack of feedback. I should clarify that.
  *Correction on Case C:* The prompt says "I would very much rather not have to write that this one is attributable to him." If the procedure is honest, it *must* follow the evidence. If the evidence says he had time and cues, but the system put him in a state where he couldn't process them, the attribution is to the *system conditions*, not the *person*. I need to make sure the procedure distinguishes "Operator Error" from "Operator Failure induced by System State."

  11. **Final Structure:**
      *   Introduction (Philosophy & Purpose).
      *   The Procedure (Steps 1-5).
      *   Verdict Vocabulary.
      *   Limitations (Honesty Statement).
      *   Application to Cases A, B, C.
      *   Misfire Analysis.

