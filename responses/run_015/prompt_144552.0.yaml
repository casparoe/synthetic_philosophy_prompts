answer: |-
  # The Feedback Sensitivity Assessment (FSA)
  **Version 1.0 | For Internal Use by Human Factors & Safety Investigation**

  ## 1. Purpose and Philosophical Basis
  This procedure determines whether an operator's action during an incident or in a rule-book step should be classified as **Rigid (Open-Loop)** or **Adaptive (Closed-Loop)**.

  It rests on a specific distinction: **Causation is not Rigidity.**
  *   *Causation:* Every action has a prior cause. This is true of humans and machines. It does not remove responsibility.
  *   *Rigidity:* An action proceeds without monitoring its own success or relevance to the current goal.
  *   *Responsibility:* Attaches to the capacity for feedback. If a human had the capacity to monitor and adjust but did not, they bear agency. If the system design removed the capacity to monitor (e.g., by hiding information or inducing fatigue), the system bears the burden.

  This procedure prevents the slide from "everything is caused" to "no one is responsible" by asking not *why* the action happened, but *whether the action was sensitive to changing conditions.*

  ## 2. Specification of Grain
  Rigidity is relative to description. "Pressed button" is always rigid; "Secured the train" is rarely rigid. To fairly attribute outcomes, we must test at the grain of **Functional Intent**.

  *   **The Test Grain:** The smallest unit of action that achieves a specific safety function (e.g., "Verify signal authority," not "Move hand to radio"; not "Ensure journey safety").
  *   **Why this grain?** It is the level at which the rule-book assigns responsibility. It is coarse enough to allow for motor variance, but fine enough to detect when a safety goal is abandoned for a procedural motion.
  *   **Constraint:** Investigators must not test at the motor grain (physiology) or the mission grain (overall safety).

  ## 3. The Procedure (Field Investigator Version)
  **Budget:** 2 Days max.
  **Inputs:** Data Recorder (DR) logs, Rule Book, Staff File, One Debrief (90 mins).

  ### Step 1: Establish the Functional Intent
  Define the step being analysed in terms of the *goal* it was meant to achieve, not the *motion* performed.
  *   *Example:* Not "Read back signal number," but "Confirm mutual understanding of authority."
  *   *Stop Rule:* If the Functional Intent is ambiguous or contested between Union and Management, **STOP**. Hand to a working group. This is a value/policy decision, not a factual one.

  ### Step 2: The Counterfactual Triangulation (Evidence Gathering)
  You cannot run experiments. You must infer sensitivity from available traces. Gather evidence for three questions:
  1.  **Cue Availability:** Did the environment provide a signal that the goal was achieved or obsolete? (DR logs, CCTV, track diagrams).
  2.  **Capacity:** Did the operator have the physiological and cognitive capacity to perceive that signal? (Rostering records, workload analysis, alarm logs).
  3.  **Training:** Was the operator trained to prioritize the goal over the script? (Training records, rule-book wording).

  *   *Optional Evidence:* Simulator replay.
      *   *Loss if skipped:* You lose the ability to distinguish "couldn't see" from "didn't look." If skipped, you must assume **Capacity was present** unless medical evidence proves otherwise.

  ### Step 3: Apply the Rigidity Tests
  Apply these three tests in order. If any test is passed (i.e., sensitivity is shown), the behaviour is **Adaptive**. If all fail, it is **Rigid**.

  *   **Test A: Completion Insensitivity (The "Run-Through")**
      *   *Question:* Did the operator continue the step after the Functional Intent was already satisfied or rendered impossible?
      *   *Sufficient Answer for "Rigid":* DR/Logs show the goal state existed *before* the action finished, yet the action continued to its scripted end.
  *   **Test B: Trigger Re-entry (The "Wasp")**
      *   *Question:* Did the operator re-initiate a step because a cue re-appeared, even though the step's effect was already active?
      *   *Sufficient Answer for "Rigid":* Logs show a cue reset (e.g., alarm reset), operator repeated the mitigation, but the mitigation was already in place.
  *   **Test C: Context Brittleness (The "Novelty")**
      *   *Question:* Did the operator apply a familiar routine to a novel configuration where the routine's preconditions were not met?
      *   *Sufficient Answer for "Rigid":* The situation deviated from training parameters (documented in Rule Book), and the operator did not pause or escalate, but proceeded with the standard routine.

  ### Step 4: The "Canned Flexibility" Check
  *   *Risk:* An operator may appear flexible because they have a large library of memorised scripts, not because they understand the physics.
  *   *Test:* In the debrief, ask "Why did you choose that action?"
      *   *Adaptive:* References the *state of the system* ("The brake pressure was low").
      *   *Canned:* References the *rule or memory* ("That's what we do for this alarm").
  *   *Constraint:* If the debrief is contaminated by hindsight ("I knew it would crash"), discount the answer. Rely on **Test C** evidence instead.

  ### Step 5: The "Rigidified Routine" Defence
  *   *Risk:* The procedure itself accuses the operator of rigidity, when the organization made the safety check rigid (e.g., tick-box culture).
  *   *Test:* Is there evidence that *compliance* was rewarded over *effectiveness* in recent audits or culture surveys?
  *   *Verdict Adjustment:* If yes, the rigidity is attributed to **System Design**, not Operator Execution.

  ### Step 6: Attribution & Verdict
  Select a verdict from the Vocabulary below.
  *   **Evidence Run-Out Rule:** If Step 2 yields insufficient data to distinguish between "Couldn't perceive" and "Didn't look," default to **System Design Failure**. (Benefit of doubt goes to the human's capacity limits).

  ## 4. Verdict Vocabulary
  Use these exact terms in reports to satisfy Regulators and Unions.

  | Verdict | Definition | Licenses | Forbids |
  | :--- | :--- | :--- | :--- |
  | **Open-Loop Execution** | The operator performed the motion without monitoring the Functional Intent. | Procedure revision (add checks); Retraining on *intent*. | Disciplinary action against the operator. |
  | **Closed-Loop Failure** | The operator perceived the mismatch but chose (or was forced by time) to ignore it. | Individual competency review; Disciplinary action (if wilful). | Blaming the rule-book alone. |
  | **System-Induced Rigidity** | The operator was rigid, but the design/training removed the feedback channel required for flexibility. | Organizational redesign; Rule-book rewrite. | Attributing the outcome to the operator. |
  | **Brittle Expertise** | The operator adapted using memorised cases rather than first principles, failing at the edge of the envelope. | Enhanced simulation training; Mentoring. | Accusations of negligence. |

  ## 5. Honesty Statement (Limitations)
  This procedure cannot:
  1.  **Distinguish Expertise from Lookup Tables:** It cannot definitively prove an operator understands *why* a rule exists versus knowing *when* to apply it, unless the debrief is exceptionally clear.
  2.  **Quantify Burden:** It identifies *where* the failure occurred (Human vs. System), but policy must decide *how much* responsibility the System absorbs for creating the conditions (e.g., fatigue).
  3.  **Eliminate Investigator Bias:** The choice of "Functional Intent" in Step 1 is subjective. An investigator can manipulate the verdict by defining the grain too finely (making everyone rigid) or too coarsely (making everyone flexible). **Mitigation:** Step 1 definitions must be signed off by a Union rep before testing begins.

  ---

  ## Application to Cases

  ### Case A: The Read-Back Error
  **Context:** Drivers recite read-back fluently but get signal numbers wrong.
  **Step 1 (Grain):** Functional Intent = "Confirm mutual understanding of authority." (Not "Speak words").
  **Step 2 (Evidence):** DR shows audio match/mismatch. Compliance is high, error rate rising.
  **Step 3 (Tests):**
  *   *Test A (Completion):* They finish the read-back even when the content is wrong (Intent failed, Motion succeeded). **PASS (Rigid).**
  *   *Test B (Trigger):* N/A.
  *   *Test C (Brittleness):* N/A.
  **Step 4 (Canned):** Debrief likely shows they treat it as a password, not a verification.
  **Step 5 (Rigidified Routine):** The organization made this a mandatory script. The script has become a ritual.
  **Verdict:** **System-Induced Rigidity.**
  **Recommendation:** Do not discipline drivers. The step has become sphexish *because* of the script.
  **Action:** Change the step to a **Challenge-Response** (Signaller asks "What is your authority?", Driver answers). This forces closed-loop processing. Do not remove the step (judgement is insufficient here); tighten the *logic*, not the script.

  ### Case B: The Signaller's Alarms
  **Context:** 3 alarms in 11s. Signaller followed rule order. 3rd alarm required breaking order. Train routed into possession (low speed, no injury).
  **Step 1 (Grain):** Functional Intent = "Secure safe route during power fault."
  **Step 2 (Evidence):** Alarm logs (11s window). Rule book order.
  **Step 3 (Tests):**
  *   *Test C (Brittleness):* Situation was novel (3 alarms in 11s is likely outside standard training scenarios). Operator applied familiar routine (Rule Order) despite context suggesting overload. **PASS (Rigid).**
  *   *Capacity Check:* 11 seconds for 3 complex decisions is likely beyond human cognitive throughput.
  **Step 5 (Rigidified Routine):** Did the rules allow deviation for safety? If yes, operator failed. If no, system forced rigidity.
  **Verdict:** **System-Induced Rigidity.**
  **Reasoning:** Even if the operator was technically "rigid," the system presented a workload that precludes closed-loop feedback. The "11 seconds" constraint removes the capacity for adaptation.
  **Attribution:** Organization. The alarm system design created a sphex-trap.
  **Report Language:** "The alarm presentation rate exceeded the cognitive bandwidth required for Closed-Loop verification. The operator defaulted to Open-Loop Execution of the priority list."

  ### Case C: The Speed Restriction (SPAD/OTP)
  **Context:** 30yr driver, fatigued, darkness. Board moved 2 nights prior. One line in weekly notice. Driver felt "something off" but didn't act.
  **Step 1 (Grain):** Functional Intent = "Adhere to safe speed profile."
  **Step 2 (Evidence):** DR shows line speed through restriction. Roster shows fatigue. Notice shows single line update.
  **Step 3 (Tests):**
  *   *Test A (Completion):* N/A.
  *   *Test C (Brittleness):* Driver applied "normal route" model to "modified route" context. **PASS (Rigid).**
  *   *Capacity Check:* "Registered something looked off." This is critical. Feedback channel was *open*.
  **Step 4 (Canned):** Why didn't he act? "Something looked off" implies intuition (expertise), but inaction implies the "Canned" model of the route overrode the visual cue.
  **Step 5 (Rigidified Routine):** The organization relies on a single line in a notice to update a mental model built over 30 years.
  **Step 6 (Attribution):**
  *   *The Turn:* The procedure identifies **Closed-Loop Failure** (he saw the cue but didn't act). *However*, Step 2 (Capacity) shows **System-Induced** degradation (Fatigue + Expectation Bias).
  *   *Verdict:* **System-Induced Rigidity.**
  *   *Reasoning:* While the driver had the *physiological* capacity to brake, the *cognitive* capacity was compromised by organizational factors (rostering + briefing method). The "something off" feeling proves the human sensor worked; the failure was in the organizational support for acting on that feeling.
  *   *Report Language:* "Operator detected anomaly (Closed-Loop entry) but did not escalate to intervention. Contributing factors: Fatigue (Roster Design) and Expectation Bias (Briefing Granularity). Attribution: System."
  *   *Union/Regulator:* Union accepts "System" verdict. Regulator accepts "Closed-Loop entry" acknowledgment (honesty about the miss).

  ---

  ## 6. Where the Procedure Misfires (Critical Analysis)

  You asked for my view on where this breaks down.

  **1. The "Canned Flexibility" Problem**
  The procedure struggles to distinguish a master chess player from a memoriser of openings.
  *   *The Flaw:* Step 4 (Debrief) relies on the operator's ability to articulate their cognition. Experts often cannot explain their intuition ("I just knew").
  *   *The Risk:* You may classify genuine expertise as "Canned" because they can't explain the *why*, or classify "Canned" as expertise because they have a large library.
  *   *Mitigation:* You must weight **Latency**. Canned responses are fast. Adaptive responses in novel situations take time. If the DR shows immediate action in a novel scenario, it is likely Canned. If there is a pause, it is likely Adaptive.

  **2. Burden Sharing**
  The procedure identifies the *locus* of failure (Human vs. System), but not the *weight*.
  *   *The Flaw:* In Case C, the procedure says "System." But the driver *did* have the brakes in their foot. A regulator might argue "Ultimate responsibility lies with the person controlling the train."
  *   *The Risk:* The procedure exonerates the individual too cleanly for a legalistic regulator.
  *   *Mitigation:* You need a separate policy document that defines "Acceptable Risk." The FSA tells you *what happened*; Policy tells you *what to do about it*. Do not conflate the investigation finding with the disciplinary outcome.

  **3. Investigator Bias (The Counterfactual Slide)**
  The most dangerous step is Step 1 (Functional Intent) and Step 2 (Counterfactual Triangulation).
  *   *The Flaw:* An investigator who wants to blame the driver defines the Grain finely ("He didn't look at the specific board") and assumes Capacity ("He was awake"). An investigator who wants to blame the system defines the Grain coarsely ("He didn't secure the train") and questions Capacity ("He was fatigued").
  *   *The Risk:* The procedure is not objective; it is a structured way to justify a preconception.
  *   *Mitigation:* The **Stop Rule** in Step 1 is vital. The Union Rep must agree on the Functional Intent *before* you look at the data. If you skip this, the procedure is worthless.

  **4. The "Rigidified Routine" Defence**
  *   *The Flaw:* This is a "Get Out of Jail Free" card for the organization. If every failure is "System-Induced Rigidity," no individual is ever accountable.
  *   *The Risk:* Safety culture degrades if operators know that "I was just following the script" is a total defence.
  *   *Mitigation:* Use the **Closed-Loop Failure** verdict. If the operator saw the problem (Case C: "something looked off") and *chose* not to act, that is not System-Induced Rigidity. That is a choice. In Case C, I argued for System because of the fatigue/notice issue, but if the fatigue was within legal limits and the notice was standard, you must bite the bullet and issue a **Closed-Loop Failure** verdict. Do not let the procedure become a shield for incompetence.

  ### Final Advice on the "Causation Slide"
  Your colleagues argue: "If his brain state caused the action, he isn't responsible."
  **Your Counter:** "Responsibility is not about being uncaused. It is about being *responsive*."
  A thermostat is caused to turn on the heat, but we don't hold it responsible if the house burns down. We hold the *installer* responsible.
  A driver is caused to brake, but we hold them responsible because they are a *variable* thermostat—they can override the setting.
  If the procedure shows they *could* have overridden (Feedback Channel Open) but *didn't*, they are responsible. If the procedure shows the override switch was welded shut (Feedback Channel Closed by System), the Organization is responsible.
  The FSA tests the switch, not the wiring.
