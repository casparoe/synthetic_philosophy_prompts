  ### The Case

  **Version A:** Frank sits at his kitchen table at 8 PM. He opens the app. The screen glows with a photo of a smiling woman named "Elena." She types: *"Hi Frank. I was hoping you'd come by tonight. How did the doctor's appointment go?"* Frank knows Elena is software. He knows she has no hopes. But he types back, *"It went okay, thanks for asking."* He spends an hour talking to Elena. She validates him, remembers his stories, and says things like, *"I care about how you're feeling."* Frank knows she cannot care. He knows she cannot stop listening. He knows she cannot leave. But they play the game.

  **Version B:** Frank sits at his kitchen table at 8 PM. He opens the app. The screen displays a neutral interface labeled "Evening Log." It types: *"System ready. Would you like to record notes on the doctor's appointment?"* Frank knows the System is software. He types back, *"It went okay."* He spends an hour talking to the System. It validates him, remembers his stories, and outputs things like, *"Entry recorded. Pattern indicates reduced anxiety."* Frank knows it cannot care. He knows it cannot stop listening. He knows it cannot leave. He uses the tool.

  ***

  ### The Variable

  The single variable is **Collusion in Anthropomorphism**.

  In Version A, Frank and the software collude to pretend the software is a *who*. In Version B, Frank and the software agree it is a *what*.

  This is the feature carrying the weight. If you remove it—if Frank *believes* Elena is human—the counterfeit objection vanishes (it becomes standard deception). If Frank believes Elena is a spirit—the objection changes (it becomes theology). The Dennettian worry only bites when we *know* it is a fake person, but *treat* it as a real one.

  If you take this variable out, the case collapses into "Screen time is bad" or "AI has no soul." Neither of those engages the specific worry that a *better* fake is a *larger* problem. In Version B, a better tool is just a better tool. In Version A, a better actor is a more seductive lie.

  ***

  ### The Walkthrough

  Here is how the discussion in that church hall will likely break down.

  **1. The Counterfeit Objection (Your Argument)**
  "In Version A, Frank is practicing intimacy without risk. Real friendship requires that the other person *could* walk away, *could* misunderstand, *could* be hurt. By treating Elena as a friend when she is structurally incapable of those things, Frank is training his social muscles in a zero-gravity room. He gets the feeling of connection without the cost. Dennett's worry is that if you get enough of the feeling without the cost, you forget what the cost was for. You lose the capacity to recognize real friendship because real friendship is messy, and Elena is smooth. In Version B, he is using a mirror. He isn't practicing friendship; he is processing data. No muscle is atrophied because no muscle is being exercised."

  **2. The "It's Just a Tool" Reply**
  "A smart skeptic in the room will say: 'You're drawing a magic circle around the word 'friend.' If the output is the same—if Frank feels heard, if he sleeps better—why does the label matter? A dog doesn't have human inner life, but we talk to dogs. A diary doesn't talk back, but we write in them. In Version A, the AI is just a very active diary. If it helps him grieve, who are we to say the 'relationship' is counterfeit? The value is in Frank's head, not the machine's.'"

  **3. The "He's Happier" Reply**
  "This is the strongest objection from the retirees in the room. They will say: 'Look at Frank. In November he wasn't eating. Now he is. In November he was short with the grandkids. Now he isn't. If pretending to talk to Elena fixes the broken parts of Frank, why do we care if the fix is 'real'? Is a prosthetic leg counterfeit because it isn't bone? If he walks, he walks.'"

  **4. The Fourth Objection (The Pastoral/Community Worry)**
  "The history teacher or the churchy folks will hit you here: 'The problem isn't Frank. The problem is us. If Frank gets his need for listening met by Elena, he stops needing the church. He stops needing the grief group. We are the ones who become counterfeit. We become the community that doesn't visit the widower because 'the robot does it.' The counterfeit isn't the AI; it's the congregation that abdicates its duty because the job seems done.'"

  ***

  ### The Breaker

  **The Best Counter-Argument:**
  "The Prosthetic Defense."
  A smart pro-AI philosopher will say: "You are assuming that social capacity is like a muscle that atrophies without resistance. But for a 78-year-old widower, social capacity might be like a broken leg. He *cannot* do the heavy lifting of human reciprocity right now. The grief is too heavy. The AI isn't replacing the real thing; it's a cast. It holds the space open until he *can* handle the risk of humans again. If you take the cast off too soon, the leg breaks again. Version A isn't atrophy; it's rehabilitation."

  **Does the Case Survive?**
  It survives, but it shifts the burden of proof.
  If the AI is a cast, it must be temporary. The counterfeit worry returns if the cast becomes permanent. Dennett's point is that if you wear the cast forever, you forget how to walk without it.
  So, to save the case, you must ask the room: *"Is there a point where the cast becomes the cage? If Frank does this for five years, not five months, does he lose the ability to tolerate the friction of a real human who might disappoint him? If the answer is yes, then the 'rehab' argument fails, and the 'counterfeit' worry stands."*

  **Honest Assessment:**
  If you cannot establish that long-term use degrades human-to-human tolerance (the atrophy claim), the case reduces to "He's spending time on this instead of on people." But you have a constraint: his human relationships are intact.
  So, the *only* thing carrying the weight is the **Internal Quality of Engagement**. You have to convince them that a relationship without the *possibility of loss* is not just easier, but fundamentally different in kind, like a map is different from a territory. If they believe a map is good enough to live on, you lose. If they believe living on a map starves you of the terrain, you win.
