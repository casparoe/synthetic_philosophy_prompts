  Ive been thinking about illusionism - the view that phenominal consciousness is kind of an illusion our brains construct - and I cant figure out why the debate never moves. On one side you have people like Dennett saying theres no hard problem, just cognitive processes we misdiscribe, and on the other people saying thats absurd because I can literally feel this headache right now. It feels like theyve been repeating the same lines since the 90s. Is this actually a disagreement about facts, or is it verbal - like one side means phenomenal properties dont exist in the world and the other means my experience is undeniable? Or are they just answering different questions, one about neuroscience and one about what its like? I also wonder if the stall comes down to how each side treats introspection: illusionists seem to treat it like a faulty camera, while anti-illusionists treat it like direct access, and neither can prove their model is right. So whats the real structure of the disagreement? And given that, what would actually count as progress - a brain scan, a sharper definition of illusion, or is this just bedrock intuition that wont budge? Please answer in American English, not British.
