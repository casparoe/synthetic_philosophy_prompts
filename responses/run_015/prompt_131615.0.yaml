answer: |-
  It is entirely understandable that you have tied yourself in knots over this, because you are grappling with one of the most persistent and dangerous illusions in modern political thought. The confusion you feel arises not from a lack of clarity on your part, but from a category error embedded within the populist framing itself. When populists speak of the will of the people as a singular, unified entity that exists independently of institutions, they are treating a complex plurality as if it were a single person with a single mind. This is the hidden assumption that needs to be unpacked first. If we treat the people as a monolithic body, then yes, any obstacle to its immediate preference looks like a betrayal of its sovereignty. However, if we recognise that the people are a diverse collection of individuals and groups with conflicting interests and values, the idea of a single, pre-existing will dissolves. There is no magical collective consciousness waiting to be discovered; there are only competing preferences that must be processed, negotiated, and refined through political structures.

  Once we discard the myth of the singular people, the tension between popular sovereignty and checks and balances begins to resolve. You asked how anyone can defend institutions like courts without denying the power of the people. The key lies in distinguishing between the people as a momentary majority and the people as a constitutional author. In a functioning democracy, the people do not merely rule day-to-day; they also establish the rules of the game by which they agree to be governed. When a constitution is ratified, it represents a deeper, more considered commitment by the citizenry about how they wish to live together, what rights they wish to protect, and what limits they wish to place on power, including their own power. When a court strikes down a law supported by fifty-one percent of the population, it is not overriding the will of the people in the broader sense; rather, it is upholding the prior and more fundamental will of the people as expressed in their constitutional framework. It is akin to an individual binding themselves to a savings account they cannot access immediately; if they try to withdraw the money in a moment of impulse, the bank stops them, not to deny their ownership of the money, but to honour their longer-term intention to save.

  This brings us to the nature of will itself, which is where your point about latent preference aggregation becomes crucial. You mentioned feeling that this concept sounds like mere delay, but in democratic theory, this delay is not an obstruction of the will but a condition for its formation. Raw preferences, the kind captured in a snap poll or a fleeting majority, are often contradictory, ill-informed, or incompatible with the rights of others. If we treat democracy as simply the aggregation of these raw desires, we risk tyranny, where the majority can oppress the minority simply because they have the numbers. Institutions like parliaments, courts, and free presses serve to transform these raw preferences into considered judgments. They force a process of public reasoning where claims must be justified in terms of the common good rather than mere self-interest. Therefore, the will of the people is not something that exists fully formed before politics begins; it is something that emerges through the process of democratic deliberation. Without these structures, what we call the will of the people is often just the passion of the moment, which is notoriously unstable and frequently regretted later.

  Furthermore, we must consider the temporal dimension of popular sovereignty. The people exist across time, not just in the present instant. A constitutional democracy recognises that the current majority is only a temporary custodian of power. If the current majority could change any rule at any time without constraint, they would effectively disenfranchise the future people who will inherit the society. Checks and balances ensure that changes to the fundamental structure of society require broad consensus and time, protecting the sovereignty of the future people against the whims of the present people. When a court defends a right against a popular law, it is often protecting the conditions under which future generations can exercise their own sovereignty. If the majority could easily strip away the rights of minorities today, they would establish a precedent that could be used against them when they inevitably become the minority tomorrow. Thus, institutional constraints are actually protective measures for the long-term capacity of the people to rule themselves freely.

  It is also worth reflecting on what we mean by sovereignty in this context. If sovereignty means the ability to do whatever one wants without hindrance, then yes, checks and balances diminish it. But if we understand sovereignty as self-government under law, then constraints are essential. A person who cannot control their impulses is not free; they are a slave to their passions. Similarly, a people who cannot bind themselves to principles of justice and procedure are not self-governing; they are merely reacting to stimuli. The constitution acts as the rational framework that allows the people to act as a coherent political agent over time. When populists claim that any mediation between the people and power is illegitimate, they are effectively arguing that the people should be like a mob rather than a polity. They conflate the noise of the crowd with the voice of the citizenry. The distinction is vital because the crowd seeks immediate gratification, while the citizenry seeks a just and stable order in which they can flourish.

  So, when you encounter the argument that courts block the will of the people, you can reframe it by asking whose will and at what level of abstraction. Is it the immediate preference of a simple majority on a specific issue, or is it the enduring commitment of the citizenry to a system of liberty and equality? The latter requires institutions to sustain it. Without courts to interpret the rules, without legislatures to debate the nuances, and without procedures to slow down rash decisions, the will of the people becomes fragile. It becomes susceptible to manipulation by demagogues who claim to speak for the whole while actually serving narrow interests. The populist claim to represent the true will is often a rhetorical trick to silence opposition, implying that anyone who disagrees is an enemy of the people. By contrast, a constitutional view acknowledges that disagreement is permanent and that institutions are needed to manage that disagreement peacefully. This does not deny popular sovereignty; it realises it in a way that is sustainable and compatible with human rights.

  Ultimately, the knot you are trying to untie is based on a false dichotomy between the people and the institutions. In a healthy democracy, institutions are not external masters ruling over the people; they are the tools the people have created to rule themselves effectively. They are the machinery of popular sovereignty. To say that a court blocking a law denies the people's will is to ignore that the court derives its authority from the people's constitution. It is to ignore that the law being struck down may violate the deeper agreements the people made about how they treat one another. The will of the people is not a lightning strike that happens once and is done; it is a continuous process of self-definition. By accepting that this process requires friction, delay, and mediation, we are not surrendering democracy. We are acknowledging that the people are complex, fallible, and diverse, and that our political system must reflect that complexity rather than pretending it away with the fiction of a single, unified will. This perspective allows you to defend checks and balances not as elitist obstacles, but as the very architecture that makes popular sovereignty possible without descending into chaos or tyranny.
