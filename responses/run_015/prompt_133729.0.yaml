answer: |-
  You have identified a specific rhetorical maneuver that doesn't have a single, universally recognized label in philosophy or moderation theory, though it touches on several. Your hypothesis is correct: this is not standard hypocrisy, nor is it simple special pleading. It is deeper. It is a tactical adjustment of *metaphysics* to avoid *normative cost*.

  Here is the carving you asked for.

  ### 1. The Name: Liability-Contingent Ontology
  Since no established term fits perfectly, the most precise label for this phenomenon is **Liability-Contingent Ontology (LCO)**.

  *   **Ontology:** The nature of being or reality (is the base "real property" or "just pixels"?).
  *   **Liability-Contingent:** The assignment of that reality depends entirely on whether acknowledging it creates a debt, obligation, or workload for the speaker or the institution.

  It is distinct from **Motivated Reasoning** (the psychological engine) because Motivated Reasoning describes *why* they do it (to feel better/win), whereas LCO describes *what* they are doing (altering the ontological status of the object to alter the normative outcome).

  ### 2. Why It Is Not Special Pleading
  **Special Pleading** follows this structure:
  *   *Rule:* Everyone must stop at red lights.
  *   *Exception:* I don't have to stop because I'm in a hurry.
  *   *Mechanism:* The rule is accepted as valid, but the *agent* claims an exemption.

  **Liability-Contingent Ontology** follows this structure:
  *   *Rule:* Theft requires the destruction of valuable property.
  *   *Flip 1:* My base is valuable property (therefore theft occurred).
  *   *Flip 2:* Your harassment is not valuable property/experience (therefore no harm occurred).
  *   *Mechanism:* The *nature of the object* changes to invalidate the rule itself.

  In Special Pleading, the universe is stable, and I am special. In LCO, the universe is fluid, and I am safe. It is **Metaphysical Special Pleading**. They aren't asking for an exception to the law; they are arguing that the law of physics doesn't apply to this specific incident because if it did, someone would have to pay.

  ### 3. Why It Is Not "The Gamer's Dilemma"
  You mentioned the puzzle about virtual murder vs. virtual pedophilia (The Gamer's Dilemma). That dilemma asks: *How can we consistently hold that one is okay and the other isn't?* It assumes the arguer is trying to find a consistent moral framework.

  LCO is the opposite. The arguer is **not seeking consistency**. They are seeking **insulation**. They are willing to hold two contradictory metaphysical views simultaneously (pixels are real / pixels are fake) as long as those views are deployed in separate threads to block liability. The Gamer's Dilemma is a philosophical problem; LCO is a defense mechanism.

  ### 4. When Is the Flip Justified? (The "Carving")
  You asked if there is a version where the two standards are jointly consistent. There is. It depends on the **Locus of Harm**.

  A consistent framework (let's call it **Human-Centric Realism**) would look like this:
  *   **Virtual Objects (Bases/Ore):** These are data. They are "real" only insofar as they represent *contractual agreements* (Server Rules) or *economic scarcity*. If an item is duped but the economy isn't damaged (infinite supply), calling it "theft" is category error. It's a rule violation, not a property crime.
  *   **Virtual Interactions (Harassment/VR Groping):** These are psychological events happening to *biological humans*. The "pixels" are irrelevant. The harm is to the nervous system of the player.

  **The Justified Standard:**
  *   "Duping isn't theft because no economic loss occurred." (Consistent: Focus on material loss).
  *   "Harassment is assault because psychological harm occurred." (Consistent: Focus on human welfare).

  **The LCO Flip (Unjustified):**
  *   "Duping is theft because I spent time farming." (Focus on effort/property).
  *   "Harassment is fake because it's just voice chat." (Ignore effort/psychology).

  The flip becomes a genuine double standard (and thus fallacious) when the **Locus of Harm** is identical, but the **Ontological Status** is flipped to avoid action.
  *   *Example:* If Player A spends 400 hours building (Time/Effort Harm) and Player B spends 400 hours being harassed (Time/Psych Harm).
  *   If the arguer says the Base is "Real Property" (needs restoration) but the Harassment is "Just Talk" (needs no action), they are applying LCO. They are valuing the *server data* higher than the *human experience* solely because restoring data is easier for mods than banning a popular player, or because admitting harassment is real requires them to admit the community is toxic.

  ### 5. Boundary Cases: Instances vs. Near Misses

  **Instance of Liability-Contingent Ontology:**
  *   **Context:** A player argues their stolen rare sword should be restored ("It's my property, real value") but argues that a doxxing threat in Discord DMs shouldn't be banned ("It's just text, outside the game").
  *   **Why:** The ontological status of "threat" vs. "item" is flipped to minimize the scope of mod responsibility. The sword is elevated to property; the threat is deflated to text.

  **Near Miss (Tribalism/Bias):**
  *   **Context:** "My friend's base burning is griefing (real harm), but your base burning is legitimate PvP (game mechanic)."
  *   **Why:** This isn't ontological flipping; the nature of the act is agreed upon. The *moral valuation* changes based on who did it. This is standard bias, not LCO.

  **Near Miss (Consistent Anti-Realism):**
  *   **Context:** "Look, it's all pixels. We don't restore items for anyone, and we don't ban for voice chat toxicity because you can just mute. Read the ToS."
  *   **Why:** This is a consistent, hardline "It's just a game" policy. It might be a bad policy, but it isn't LCO because the ontology doesn't shift based on the specific liability.

  **Near Miss (Category Error):**
  *   **Context:** "Duping isn't theft because the code allows it."
  *   **Why:** This is a technical argument about game mechanics, not an ontological flip to avoid obligation. It might be wrong, but it's not LCO unless they simultaneously claim "Base burning is theft" despite the code allowing PvP destruction.

  ### 6. How to Use This as a Mod
  Understanding this allows you to shut down the argument without getting dragged into the metaphysics. When you see LCO, do not argue about whether the base is "real." Argue about the **Consistency of Harm**.

  **The Script:**
  > "You're treating game items as real property when it benefits you, but treating player harm as 'just pixels' when it costs you. We don't adjudicate based on which ontology is more convenient. We adjudicate based on Server Rules.
  > 1. Did this violate the rule against griefing? Yes/No.
  > 2. Did this violate the rule against harassment? Yes/No.
  > The 'reality' of the pixels doesn't matter. The violation of the agreement does."

  **Summary:**
  You are seeing **Liability-Contingent Ontology**. It is distinct from special pleading because it alters the *premises of reality* rather than asking for an *exception to rules*. It is distinct from the Gamer's Dilemma because it is tactical, not philosophical. It is only a valid double standard if the distinction tracks **Human Harm vs. Data State** consistently. If it tracks **My Loss vs. My Liability**, it is LCO, and it is the root of your burnout.
