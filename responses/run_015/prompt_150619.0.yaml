  **COMMITTEE ON OBSERVATIONAL DEMOGRAPHICS (COD)**
  **MEMORANDUM 2024-09**

  **TO:** All Principal Investigators, Cosmology Division
  **FROM:** Dr. Aris Thorne, Chair, COD
  **SUBJECT:** Updated Eligibility Criteria Regarding Freak-Observer Yield

  **1.0 PURPOSE**

  Effective immediately, all proposals requesting telescope time or simulation resources must include a Typicality Impact Statement (TIS). The Committee on Observational Demographics (COD) has determined that cosmological models predicting a median observer state inconsistent with established administrative continuity pose an unacceptable risk to grant accountability. Specifically, models wherein the majority of observers are Boltzmann brains—defined herein as momentary fluctuations out of thermal equilibrium lacking causal antecedents—are deemed ineligible for funding. This guidance outlines the methodology for calculating Freak-Observer Yield (FOY) and establishing Observer Provenance.

  **2.0 COUNTING METHODOLOGY AND MEASURE SELECTION**

  Applicants must quantify the ratio of Ordinary Observers (OOs) to Boltzmann Brains (BBs) within their proposed model universe. The COD acknowledges that this ratio is measure-dependent. To ensure administrative feasibility, the Committee has standardized the counting scheme to **Proper Time Along Worldlines** rather than Comoving Volume or Observer-Moments.

  Recent internal audits highlighted the necessity of this standardization. Under a Comoving Volume weighting scheme, Model $\Lambda$-7 (the Committee's preferred baseline for vacuum stability) produces approximately $10^{54}$ unsponsored observers per cubic gigaparsec per Hubble time. Conversely, under Proper Time weighting, Model $\Lambda$-7 produces 0.04 unsponsored observers per qualified observer-hour. 

  While both schemes are physically defensible, the Comoving Volume scheme results in a Freak-Observer Yield of $>99.9\%$, triggering automatic disqualification. The Proper Time scheme yields a FOY of $<1\%$, ensuring continuity with historical data. Consequently, all applicants must utilize Proper Time weighting. Deviations requiring Volume weighting must be accompanied by a Justification of Atypicality form (COD-44B), though approval rates for such forms remain statistically negligible.

  **3.0 OBSERVER PROVENANCE AND HEREDITARY MEMORIES**

  To distinguish Ordinary Observers from Boltzmann Brains, applicants must verify the provenance of the observer's mental state. A mental state qualifies as an observation only if its contents are derived from **Hereditary Memories**. 

  **3.1 Ancestry Threshold**
  Hereditary Memories are defined as information states inherited via a causal chain extending back to a low-entropy boundary condition. Applicants must demonstrate an Ancestry Threshold of no less than 13.8 billion years of continuous causal linkage. Mental states assembled directly from the ambient heat bath, even if isomorphic to valid observations, are classified as "Thermal Noise" and do not count toward the Ordinary Observer total.

  **3.2 Verification**
  Proposals must include a causal diagram verifying the inheritance path. Retrocausal models or models relying on Poincaré recurrence for memory formation will be rejected on the grounds that they cannot guarantee the integrity of the data used to write the proposal itself.

  **4.0 REFLEXIVITY AND COMMITTEE STATUS**

  The COD is aware that the Self-Sampling Assumption—reasoning as if one is a random draw from the reference class of observers—implies that if Boltzmann brains dominate the universe, the Committee members themselves are likely fluctuation entities. If the Committee consists primarily of Boltzmann brains, these guidelines are merely thermal noise and possess no regulatory authority.

  To resolve this paradox and maintain operational integrity, the Committee invokes the **Administrative Continuity Clause**. This clause stipulates that any body capable of convening, drafting, and disseminating a memorandum possesses sufficient causal coherence to be classified as **Anchor Observers**. 

  Therefore, COD deliberations are exempt from the Typicality Impact Statement. Members are provisionally reclassified as Ordinary Observers for the duration of their tenure, regardless of their model's predicted FOY. This exemption ensures that the rules governing observer typicality are not invalidated by the typicality of the rule-makers. Applicants are advised not to scrutinize the provenance of Committee members, as such inquiries fall outside the scope of funded research.

  **5.0 COMPLIANCE**

  Failure to submit a compliant TIS will result in the immediate suspension of telescope allocation. Models predicting a universe where this memorandum is likely a hallucination of a disembodied brain are discouraged from applying. 

  **Approved by the Committee on Observational Demographics.**
