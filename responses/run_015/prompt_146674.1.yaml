answer: |-
  **The Fiction of the Silent We: Collective Intentionality and the Co-op Paradox**

  Living in a housing co-op in Manchester, you are encountering a classic philosophical problem disguised as a bureaucratic annoyance. When housemates bargain in pairs and then present a *fait accompli* as a "collective decision," they are exploiting the ambiguity of the word "we." This friction points directly to the debate over collective intentionality: is the "we" in "we decided" a genuine psychological state shared by the group, or is it merely a shorthand for a bunch of "I"s that happen to align?

  The stakes are not merely academic. If collective intentionality is nothing more than aggregated individual preferences, then your co-op's "silent partner" clause (where silence equals consent) is a valid efficiency hack. But if the "we" requires something more robust—a specific kind of interlocking commitment—then that clause is a procedural fiction that actively destroys the collective agency it claims to protect.

  To resolve this, we must weigh the reductivist view against the collectivist view, apply them to your 48-hour rule, and determine the moral weight of the resulting decisions. My argument is this: while collective intentionality is metaphysically reducible to individual mental states, it is *normatively* irreducible. It requires active, interlocking commitment. Therefore, the "silent partner" clause does not create a genuine "we-intention"; it creates a hollow aggregate of acquiescence. This verdict demands a redesign of your decision-making process from passive consent to active consultation.

  ### The Metaphysics of the "We"

  The debate typically centers on two heavyweights: John Searle and Michael Bratman. Searle argues for the primitiveness of "we-intentions." For Searle, when I participate in a collective action, I am not just thinking "I intend to do my part" plus "I believe you will do yours." Instead, I have a primitive intention in my head that takes the form "We intend to do X." He posits that this is a biological capacity, irreducible to individual "I-intentions." If Searle is right, there is a genuine psychological difference between a mob and a team, located in the individual brains of the participants.

  Bratman, conversely, offers a reductivist account known as Shared Cooperative Activity (SCA). He argues we don't need mystical "we-intentions." Instead, collective intentionality arises when individuals have interlocking intentions. I intend that we J; you intend that we J; these intentions are common knowledge; and we mesh our sub-plans to achieve J. For Bratman, the "we" is a construction built out of "I"s that are reflexively aware of each other.

  While Searle captures the *feeling* of solidarity, Bratman captures the *mechanics*. However, both agree on one crucial point: **mutuality is essential.** For Bratman, if I intend for us to paint the house, but I know you are only painting your part because you are tricked or coerced, we do not have shared cooperative activity. We have parallel action. For Searle, a "we-intention" implies a commitment to the jointness of the action.

  This is where your co-op's reality bites. When members bargain in pairs and announce a collective decision, they are violating the "common knowledge" and "meshing sub-plans" criteria of Bratman's model. They are treating the group as an audience for a decree, not a partner in action. But the deeper philosophical failure lies in the "silent partner" clause.

  ### The Silence of the Lambs (and Housemates)

  The 48-hour non-objection rule attempts to manufacture collective intentionality through procedural default. The question is: Does this fiction create a genuine we-intention, or does it mask aggregated individual acquiescence?

  Based on the criteria established by both Bratman and Searle, the answer is definitive: **Silence cannot constitute collective intentionality.**

  Under Bratman's model, shared intention requires *interlocking* intentions. I must intend that *we* act, and I must rely on *your* intention that *we* act. Silence provides no evidence of intention, let alone an interlocking one. It provides only a lack of veto. If I stay silent because I am busy, indifferent, or afraid of conflict, I do not hold the intention "We should fix the roof." I hold the intention "I will not stop you from fixing the roof." These are fundamentally different mental states. The former implies a commitment to help, monitor, and sustain the action. The latter implies mere permission.

  Under Searle's model, the failure is even starker. A "we-intention" is a positive commitment to the joint enterprise. Procedural silence is a negative absence of opposition. You cannot derive a positive "we" from a negative "not-no." To claim otherwise is a category error. The clause treats the group as a legal corporation (which can act through default rules) rather than a psychological collective (which acts through shared mindset).

  Therefore, the "we" in "we decided" does not survive the manufactured consent of the silent partner clause. It dissolves into a sum of individual tolerances. The group is not acting; the group is merely failing to stop a subset of individuals from acting.

  ### Moral Weight and the Reducibility Trap

  This leads to your second concern: If collective intentionality is reducible to individual states (as Bratman suggests), does that mean there is no special moral weight to group decisions compared to summed-up individual ones?

  This is the danger zone of reductivism. If a group decision is just "Person A + Person B + Person C," then overriding one person's objection might be justified if the sum of happiness increases. This is utilitarian aggregation, and it is toxic for a co-op.

  However, even if we accept the reductivist view that there is no magical group mind, the *normative structure* created by genuine collective intentionality creates a moral reality that exceeds the sum of parts. When we genuinely form a "we-intention" (via Bratman's interlocking commitments), we create **joint obligations**.

  If I genuinely intend that *we* paint the house, I am not just obligated to paint my bit; I am obligated to ensure *you* can paint your bit. I am obligated to adjust my sub-plans if yours fail. This creates a web of mutual reliance that does not exist in a mere aggregation of preferences. In an aggregate, if you fail to do your part, I might be annoyed. In a joint commitment, if you fail, I am *betrayed*.

  The moral weight of a group decision comes not from a mystical group soul, but from the density of these interlocking commitments. A decision made by genuine consensus carries the weight of mutual reliance. A decision made by the "silent partner" clause carries only the weight of procedural compliance. The former creates solidarity; the latter creates resentment.

  Consequently, even if collective intentionality is reducible to individual mental states, the *configuration* of those states matters morally. A network of interlocking commitments generates stronger obligations than a pile of isolated permissions. Your co-op's current system prioritizes efficiency over the generation of these obligations, thereby stripping decisions of their moral weight.

  ### Designing for the Real "We"

  If my verdict is correct—that the silent clause kills the "we" and reduces moral weight to mere compliance—how should you design decision-making in the co-op?

  You must move from a model of **Consent** to a model of **Consultation and Commitment.**

  1.  **Abolish the Silent Partner Clause:** Silence is not consent; it is data. It tells you someone didn't speak, not that they agree. Replace it with a requirement for active acknowledgment. If a decision requires collective intention, it requires active signaling of that intention.
  2.  **Distinguish "Permission" from "Endorsement":** Your current system conflates "I won't stop this" with "I will help make this happen." Use a voting or signaling system that distinguishes between:
      *   *I support this and will help.* (Collective Intention)
      *   *I can live with this but won't help.* (Acquiescence)
      *   *I block this.* (Veto)
      Major decisions should require a threshold of the first category, not just the absence of the third.
  3.  **Formalize the Bargaining:** You mentioned people bargain in pairs and announce it as a group decision. This violates the "common knowledge" condition of Bratman's SCA. Bring the bargaining into the open. The "meshing of sub-plans" must happen in the collective forum, not in the hallway. If the deal is struck in private, it must be re-ratified in public to become a *we-intention*.
  4.  **Accept Friction as Feature:** The reason you have the silent clause is likely because meetings are exhausting. But genuine collective intentionality *is* exhausting. It requires cognitive alignment. If you want the moral weight and solidarity of a "we," you must pay the transaction cost of actual communication. If you want efficiency, admit you are running a business, not a community, and switch to majority rule without the pretense of consensus.

  ### Conclusion

  To answer your core question: Collective intentionality is metaphysically reducible to individual mental states, but it is functionally distinct because of the normative interdependence those states create. It is not a ghost in the machine, but it is more than the sum of the gears.

  However, regarding your specific situation: The "silent partner" clause is a philosophical and practical failure. It creates a procedural fiction of unity that masks a reality of fragmentation. It allows the co-op to claim the authority of a "we" without doing the work of building one. This does not just weaken the decision; it corrodes the trust required for future cooperation.

  A "we" cannot be manufactured by a timer. It must be built through interlocking commitments. If you want the "we" in "we decided" to survive, you must kill the silence. Require the noise of actual agreement. Otherwise, you are not living in a co-op; you are living in a dormitory with a shared lease.
