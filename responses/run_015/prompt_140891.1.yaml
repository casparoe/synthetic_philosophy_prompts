answer: |-
  You have stumbled upon three distinct foundational problems in decision theory, epistemology, and market microstructure. Your intuition that "Dutch Book" does not quite fit the first case is correct, and your distinction between "closed-book" and "open-book" extraction maps onto a rigorous distinction between **coherence** and **calibration**, and between **logical necessity** and **informational advantage**.

  Here is the precise vocabulary you need to classify these episodes, distinguish the defects, and advise your committee.

  ### 1. The Vocabulary of Extraction

  Your nephew is half-right. In formal decision theory, a **Dutch Book** is strictly defined as a set of bets that guarantees a net loss for the agent *in every possible state of the world*, derived solely from the agent's *incoherent* probability assignments (e.g., assigning $P(A) + P(\neg A) > 1$).

  If your first member's prices were internally consistent (summed to 1, obeyed conditionalization rules), they cannot be Dutch Booked in the standard sense. However, there are established concepts for the three scenarios you described.

  #### Episode 1: The "Impossible" Outcome
  *   **Established Term:** **Violation of the Regularity Condition** (or **Dogmatism**).
  *   **The Concept:** In Bayesian epistemology, the **Regularity Condition** stipulates that one should never assign a probability of exactly 0 or 1 to any empirical (contingent) proposition. By assigning $P=0$ to a stage cancellation, the member treated a contingent event as a logical impossibility.
  *   **The Defect:** This is not a defect of *coherence* (internal logic), but of **model specification**. The member defined a "Small World" (in the sense of Leonard Savage) that excluded the protest. Within that Small World, they were coherent. In the "Large World" (reality), they were exposed to **Tail Risk** or **Model Risk**.
  *   **Guaranteed Loss?** No. The loss was not guaranteed *ex-ante* by logic. It was guaranteed *conditional on the event occurring*. The extraction was possible because the seller priced the ticket at \$0.01 (implying $P \approx 0$) while the buyer knew $P > 0$.
  *   **Is it Cheating?** No. It is **Arbitrage** based on the seller's dogmatism. The buyer exploited a pricing error, not a logical contradiction.

  #### Episode 2: The Better-Informed Bettor
  *   **Established Term:** **Adverse Selection** (or **Information Asymmetry**).
  *   **The Concept:** This is standard market microstructure. The victim is willing to take the "fair" side of a bet based on public information. The counterparty accepts the bet only when private information makes the odds favorable to them.
  *   **The Defect:** The victim is failing to update their probabilities on the **signal of the bet offer itself**. In game theory, a rational agent should reason: *"If a knowledgeable peer is eager to bet against me at these odds, my odds are likely wrong."* Ignoring this signal is a failure of **Game-Theoretic Rationality**, even if their probability calculus is internally consistent.
  *   **Guaranteed Loss?** No. The loss is guaranteed only **in expectation** (over many trials). Any single bet could win. This distinguishes it sharply from a Dutch Book.
  *   **Is it Cheating?** This is the gray area. In financial markets, this is **Alpha**. In a friendly club meant to "settle arguments," this is **Predatory Trading**. It violates the spirit of a level playing field without violating the rules.

  #### Episode 3: The Finite Bankroll
  *   **Established Term:** **Gambler's Ruin** (in the context of a **Martingale Strategy**).
  *   **The Concept:** This scheme relies on the assumption of unbounded capital or infinite time to converge on a guaranteed profit. In reality, constraints bind.
  *   **The Defect:** This is a defect in **utility modeling** or **resource constraint awareness**. It assumes linear utility of money and infinite liquidity.
  *   **Relation to others:** This is distinct from the first two. It is not about probability assignment or information, but about the **topology of the betting structure**.
  *   **Is it Cheating?** Generally no, but it is often banned in casinos because it creates systemic risk. In a club, it risks bankrupting a member, which may be against the social contract.

  ### 2. Distinguishing the Defects

  To explain this to your committee, you need to separate **Logical Defects** from **Informational Defects**.

  | Feature | Episode 1 (The Dogmatist) | Episode 2 (The Out-Informed) | Episode 3 (The Martingale) |
  | :--- | :--- | :--- | :--- |
  | **Root Cause** | **Epistemic Hubris:** Assigning $P=0$ to possible events. | **Information Asymmetry:** Counterparty knows more. | **Resource Constraint:** Finite bankroll vs. infinite strategy. |
  | **Formal Name** | Violation of **Regularity**. | **Adverse Selection**. | **Gambler's Ruin**. |
  | **Loss Type** | **Contingent Sure Loss:** Guaranteed *if* the "impossible" happens. | **Expected Loss:** Guaranteed over *many* trials, not single bets. | **Risk of Ruin:** High probability of total loss before profit. |
  | **Victim's Error** | Defined the possibility space too narrowly. | Failed to update on the *fact* of the wager. | Assumed infinite capital/credit. |
  | **Bookie's Edge** | **Model Arbitrage:** Knowing the event is possible. | **Informational Edge:** Knowing the likely outcome. | **Capital Edge:** Having deeper pockets. |

  ### 3. The "Closed-Book" vs. "Open-Book" Distinction

  Your intuition here is excellent. In academic literature, this maps to the distinction between **Coherence** and **Calibration**.

  *   **Coherence (Your "Closed-Book"):** Are the probabilities consistent with each other? (e.g., Do they sum to 1?) If not, you are vulnerable to a **Dutch Book**. This is a defect in *logic*.
  *   **Calibration (Your "Open-Book"):** Do the probabilities match the frequency of reality? If not, you are vulnerable to **Adverse Selection**. This is a defect in *knowledge*.

  **The Crucial Line:**
  A Dutch Book (inconsistency) allows a bookie to construct a portfolio of bets that wins **in every state of the world**.
  Adverse Selection (miscalibration) allows a bookie to construct a portfolio of bets that wins **in the states of the world that actually occur most often**.

  The first is a logical scandal; the second is a market hazard.

  ### 4. Advice for the Committee

  You asked whether any of this counts as cheating. The answer depends on the **telos** (purpose) of your market.

  **If the purpose is Profit/Discovery:**
  None of this is cheating.
  *   Episode 1 is a reward for humility (the buyer) and a penalty for dogmatism (the seller).
  *   Episode 2 is the standard mechanism by which markets incorporate private information into prices.
  *   Episode 3 is a risk management failure by the victim.

  **If the purpose is Social/Fun (Settling Arguments):**
  Episode 2 is problematic.
  *   **The Verdict:** Episode 2 constitutes **Predatory Behavior**. In a friendly market, members should not be allowed to systematically exploit private information that others cannot reasonably access. This turns the market from a game of "who judged best" into "who has the best insider source."
  *   **The Remedy:** You do not need to ban the betting. You need to enforce **Disclosure**. If a member has material non-public information (e.g., they spoke to the race director), they must disclose it before betting, or the bet is void.

  **Regarding Episode 1:**
  This is not cheating, but it is a **teachable moment**. You should institute a **Regularization Rule**: No member may offer odds implying a probability of 0 or 1 (e.g., no selling tickets for 1 cent that pay \$100). Force everyone to admit *some* uncertainty. This protects the dogmatists from themselves and prevents the "free money" illusion.

  **Regarding Episode 3:**
  This is a **Risk Control** issue. Implement **Position Limits**. No member can stake more than $X\%$ of their bankroll on a single sequence or outcome. This prevents the "arbitrarily large sums" problem from ruining a member and creating social awkwardness.

  ### Summary for your Committee

  You can present this distinction clearly:

  1.  **Logical Exploitation (Dutch Book):** Banned. It relies on the victim making math errors (inconsistent odds).
  2.  **Epistemic Exploitation (Regularity Violation):** Discouraged. It relies on the victim claiming certainty where none exists. *Rule: Minimum odds floor (e.g., 1%).*
  3.  **Informational Exploitation (Adverse Selection):** Regulated. It relies on one member knowing something others don't. *Rule: Disclosure of material private info.*
  4.  **Structural Exploitation (Martingale):** Limited. It relies on infinite capital. *Rule: Maximum stake limits.*

  Your "Closed-Book" case is a **Violation of Regularity**. Your "Open-Book" case is **Adverse Selection**. They are fundamentally different: one is a failure of logic, the other a failure of information hygiene. Neither is "cheating" in a financial sense, but in a social club, the latter violates the spirit of fair play.
