          *   *Refinement:* It's not a *synchronous* Dutch Book (guaranteed loss at time $t$). It's a **Diachronic Dutch Book** or simply **Model Risk** / **Black Swan** exposure due to **Truncation of the Possibility Space**.
          *   *Key Distinction:* The loss wasn't guaranteed *ex-ante* by logic alone (unless we assume the event was possible). It was guaranteed *conditional on the event occurring*. The user says "no outcome he took seriously ever left him worse off." This is the crux. He defined a small world. The real world intruded. This is **Small World vs. Large World** (Savage).

      *   **Episode 2 Analysis (The Better-Informed Bettor):**
          *   Victim accepts fair bets. Counterparty has edge.
          *   *Concept:* **Adverse Selection** (Akerlof's Lemons market logic applied to betting).
          *   *Concept:* **The Winner's Curse** (related).
