      *   **Episode 3 Analysis (Finite Bankroll/Martingale):**
          *   Schemes needing arbitrary stakes.
          *   *Concept:* **Martingale Strategy**.
          *   *Concept:* **Gambler's Ruin**.
          *   *Concept:* **Unbounded Utility/Stake**.
          *   *Relation to others:* It's distinct. It's about the *feasibility* of the arbitrage, not the coherence of the odds.

  3.  **Synthesize and Map to Established Vocabulary:**

      *   **Dutch Book:** The nephew is half-right. Standard Dutch Books require inconsistency (e.g., $P(A)+P(B) \neq P(A \cup B)$). However, there is a concept of a **Generalized Dutch Book** or **Sure Loss** contract that applies to agents who assign 0 to possible events. But strictly speaking, if the agent says "I assign 0," and the event happens, they weren't inconsistent *at the time*, they were *wrong*.
      *   **Better Term for Episode 1:** **Model Misspecification** or **Violation of the Regularity Condition**. In economics/finance: **Tail Risk** or **Black Swan** exposure due to **Truncated Priors**.
      *   **Better Term for Episode 2:** **Adverse Selection**. The victim is providing liquidity without pricing the information risk.
      *   **Better Term for Episode 3:** **Martingale Risk** / **Capital Constraints**.

      *   **The "Cheating" Question:**
          *   Episode 1: Is it cheating to sell tickets on "impossible" events? No, it's negligence/dogmatism. Is it cheating to buy them? No, it's arbitrage.
          *   Episode 2: Is it cheating to use superior info? In financial markets, no (insider trading laws aside). In a friendly club? Gray area. It's **Predatory Trading**.
