      *   **Categorize the Three Episodes:**
          1.  **Epistemic Blindness (The "Impossible" Bet):** Violation of Regularity / Small World assumption. Not a standard Dutch Book, but a **Sure Loss in the True State Space**.
          2.  **Information Asymmetry (The "Better-Informed" Bet):** **Adverse Selection**. The victim fails to update on the *signal* of the bet itself.
          3.  **Capital Constraints (The "Martingale" Bet):** **Gambler's Ruin** / **Unbounded Stake Fallacy**.
      *   **Distinguish "Defect in Thinking" vs. "Defect in Information":**
          *   Ep 1: Defect in Thinking (Dogmatism).
          *   Ep 2: Defect in Thinking (Failure to update on counterparty signal) + Defect in Information.
          *   Ep 3: Defect in Thinking (Ignoring finite bankroll constraints).
      *   **Address the "Cheating" Aspect:**
          *   Ep 1: Not cheating, just risky.
