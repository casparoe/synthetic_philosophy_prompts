          *   *User's Episode 2:* This is *not* a Dutch Book. This is **Adverse Selection** or **Information Asymmetry**. The victim is willing to bet at fair odds *given their info*, but the counterparty has better info. This is standard market mechanics, not a logical flaw in probability assignment.
