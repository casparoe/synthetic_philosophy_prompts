          *   The "Base" Problem: If all thought is mapping from previous essences, where did the *first* essence come? Infinite regress?

  4.  **Select and Rank the Defeaters:**
      *   *Fatal:* The Conceptual/Unfalsifiability charge (if they can't define boundaries). The "First Essence" regress problem.
