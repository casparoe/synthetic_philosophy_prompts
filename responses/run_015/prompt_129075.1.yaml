      *   **Introduction:** Acknowledge the sophistication. Address the "Misreading" constraint immediately. Is the user's reading too strong? Yes, H&S focus on *high-level* cognition and categorization. They don't necessarily deny low-level sensory processing, but they do claim *conceptual* content is analogical. I need to clarify this distinction.
