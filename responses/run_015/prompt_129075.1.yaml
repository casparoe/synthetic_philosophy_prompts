      *   Ensure the distinction between H&S's actual psychological claims and the user's metaphysical reconstruction is clear.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "frozen analogy" point? Yes, that's central to their view on expertise.
