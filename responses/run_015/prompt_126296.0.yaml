answer: |-
  The clipboard rested on the counter, the laminate cool against her palm. Item 14 sat at the bottom, the box empty beneath the printed question.

  Ada Reinholt had seen thousands of these forms. They were the color of manila envelopes, stiff enough to cut a finger on if handled too quickly. She stood at the nurses' station on the fourth floor of the teaching hospital, the hum of the ice machine filling the silence between the beep of IV pumps. It was 4:15 PM. The shift change was coming, bringing the smell of stale coffee and the rustle of plastic bags. She looked at the name at the top of the chart: Vance, Ruth. Eighty-two. Admitted three years ago for failure to thrive, now residing on the locked dementia unit. The consulting service had been called to advise on the placement of a percutaneous endoscopic gastrostomy tube. The family could not agree. The form required a values history. The form required Item 14.

  *Would you consent to live this same life again, without end, every particular included?*

  Ada knew the history of the question. It had been added twenty years ago by a committee that wanted to quantify the unquantifiable. They called it the recurrence question. Ada called it a trap. It asked for a verdict on a life while the life was still leaking out of the person onto the sheets. It asked for a will to power from someone who could no longer hold a spoon.

  She walked down the hall to the conference room. The air conditioning was too cold, a standard hospital chill that kept bacteria slow and staff awake. Ruth's daughter, Ellen, sat on the left. She wore a cardigan that looked knitted by hand, the wool slightly pilled at the cuffs. She had been coming every day for three years. Ruth's son, David, sat on the right. He wore a suit that wrinkled at the elbows, his tie loosened. He had flown in from Chicago that morning.

  Ada sat at the head of the table. She opened the chart. She did not smile. Smiling suggested there was a solution to be found in the room.

  "Ms. Vance," Ada said. "Mr. Vance. We need to discuss the feeding tube. But first, the values history. Your mother cannot speak for herself. We need to know what she would have wanted."

  "She would want to live," Ellen said. Her voice was soft, practiced. "Mom was... she was the kind of person who said yes. To everything. To us, to her friends, to the world. If you asked her if she'd do it again, she'd say yes. She wouldn't want to miss a minute."

  David shifted in his chair. The leather squeaked. "She doesn't know what minute it is, Ellen. She doesn't know who we are. She spends twelve hours a day staring at the wall. Is that a minute she'd want back?"

  "It's not about the quality," Ellen said. "It's about the fact of it. She's still here. As long as she's here, we're her children. If she goes, that part of us goes."

  Ada watched them. This was the collision. Ellen spoke of the life as a gift to the living. The existence of the mother sustained the daughter's identity. The life was good for the people around it. David spoke of the life as an experience for the subject. The experience was confusion, immobilization, silence. The life was not good for the person who lived it.

  "If she comes back," David said, looking at Ada, "does she know it's a repeat? The question says 'live this life again.' If she's like this again, she doesn't know she's lived it before. She doesn't know she's choosing it. She's just... dropped into it. How can you will something you don't know you're willing?"

  Ellen looked at her brother. "She wouldn't care about knowing. She just cared about being."

  "But she's not being," David said. "She's persisting. There's a difference."

  Ada listened. The ignorance of the repetition. The son had put his finger on the mechanism. The question demanded a conscious affirmation of a fate that, if repeated, would be suffered unconsciously. If Ruth willed this life again, she would will a life in which she did not know she had willed it. The will would be swallowed by the ignorance.

  "We need to know if she would consent," Ada said. "To the recurrence. Every particular included."

  "She consented to us," Ellen said. "She consented to caring for us. This is us caring for her."

  "She didn't consent to this," David said, tapping the table. "Nobody consents to forgetting their own name. Nobody consents to being fed through a tube in a locked room. You're asking us to say she wanted this specific hell."

  Ada closed the chart. She had heard this before. Not these words, but the shape of them. Twenty years ago, during her residency, the wellness committee had distributed the same form. It was a pilot then. Ada had sat in a break room much like this one, the smell of burnt popcorn in the air. She had looked at Item 14. She had thought of the winter of her internship. The thirty-six-hour shifts. The night a patient died on her watch because the attending had been slow to answer a page. The cold walk home in the snow. The numbness in her fingers that lasted for months.

  She had written *Yes*. But she had taken a black pen and carved a small bracket around that winter. She had excluded it. She had said yes to the life, but no to the cold. She had kept the form in her drawer for years.

  Last month, the numbness had returned. Not in her fingers, but in her chest. A diagnosis she hadn't expected. A treatment plan that mirrored the old one. The same coldness, in a smaller key. She had not told the committee. She had not told her colleagues. She had simply taken the new pills and come to work. She knew what it was to qualify a yes. She knew that some particulars were too heavy to lift twice.

  "Ms. Vance," Ada said. "Your mother's chart includes a photograph. From before."

  Ellen nodded. "From her seventieth birthday."

  Ada opened the chart to the intake sheet. There was a photograph clipped to the corner. Ruth Vance smiled out of the glossy paper. Her hair was dyed brown, her eyes clear. She held a cake. It was the general shape of the life. It was the narrative arc that Ellen saw.

  Ada looked at the bed in the room down the hall. She had seen Ruth an hour ago. Ruth was curled on her side. There was a stain on the pillowcase, yellowish-brown. Her mouth hung open. The sound she made was not a snore, but a wet rattle. This was the particular. This was the ink on the page. The photograph was the lie of the summary. The stain was the truth of the text.

  "The question asks about every particular," Ada said. "Not the summary. Not the birthday. The stain. The rattle. The cold."

  "She wouldn't mind the stain," Ellen said. But her hand tightened on the cardigan.

  "She minds everything now," David said. "Because she can't stop it. If she comes back, she can't stop it again. That's what 'without end' means. It means no exit. Would she will a trap?"

  Ada stood up. "I have what I need."

  She walked back to the nurses' station. The ice machine hummed. The shift change was complete; the new nurse was counting narcotics. Ada sat on the stool. She picked up the pen. It was a standard hospital ballpoint, black ink, cheap plastic.

  She looked at Item 14. *Would you consent to live this same life again, without end, every particular included?*

  If she checked yes, she affirmed the world that produced Ruth Vance. She affirmed that a life good for others justified a life bad for the self. She affirmed that the trap was acceptable. She affirmed that the ignorance of the repetition did not matter.

  If she checked no, she denied Ellen's care. She denied the value of the daughter's sacrifice. She said that this life was so bad it should not have happened at all.

  Ada thought of the winter she had cut out of her own form. She had refused to will that cold. She had refused to say that the world was better because she had walked through it. She had kept the bracket.

  She looked at the photograph of Ruth. She looked at the box. The gap between the general shape of the woman and the particular reality of the patient was too wide for a checkmark. The question demanded a unity that the life did not possess. It asked for a single verdict on a fractured thing.

  Ada capped the pen. She uncapped it. She looked at the laminate counter. A scratch ran across the surface, white against the grey. Someone had dragged a heavy tray across it years ago. The scratch remained. The counter remained.

  She pressed the pen to the paper. She did not check the box. She drew a line through the question itself. A single horizontal stroke, bisecting the text. It was not an answer. It was a refusal of the terms. She would file the form. She would recommend the tube, because the law required her to preserve the life that existed, not the life that was willed. But she would not validate the question. She would not say that this world, exactly as it was, was something she could ask anyone to choose again.

  She set the pen down. She looked at the form. The ink was wet.

  The clipboard rested on the counter, the laminate cool against her palm. Item 14 sat at the bottom, the box crossed beneath the printed question.
