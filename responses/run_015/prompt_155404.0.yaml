  Pricing the alternatives clarifies why this is the necessary break. Resisting (1)'s scope is empirically prohibitive; chaos theory ensures that small policy shifts alter conception timing within generations, so denying identity fragility requires ignoring basic causal dynamics to save the intuition. The move from (4) to (5) is logically unbreakable if (2) stands; you cannot deny the inference without undermining the comparative definition of wronging in (2) anyway, so resisting here collapses into rejecting (2). Giving up the comparative person-affecting requirement is the only viable path; while it forces you to abandon the idea that wronging requires being worse off than in the alternative, it allows you to retain a person-affecting view grounded in rights or thresholds rather than aggregate welfare, securing intergenerational justice without sliding into impersonalism.
