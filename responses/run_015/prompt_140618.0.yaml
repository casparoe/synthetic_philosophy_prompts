      *   **Hypothesis:** Naives make wrong cascades more stable/fragile? (User thinks more stable). Public information might get absorbed/amplified rather than breaking the herd.
      *   **Wrinkle:** Sophisticates might not know the share of naives (uncertainty about population composition).
      *   **Constraints:**
          *   No bibliography/reading list (user will fill citations).
