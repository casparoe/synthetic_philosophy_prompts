answer: |-
  hey — this is a great angle for the talk because it cuts against the intuition that herding requires irrationality or social pressure. you can frame this around a group of farmers deciding whether to adopt a new drought-resistant seed variety. the true state is either that the seed is good or bad, and each farmer wants to pick the right one. they don't care what their neighbors pick, only that their own crop survives. each farmer gets a private hint from a local agronomist that is right about 65 percent of the time. no one is an expert, and the hints are independent. they decide in sequence, standing in a line at the co-op, so each farmer sees what everyone before them bought.

  here is how the wrong herd forms without any intervention. imagine the true state is that the seed is good. the first farmer arrives and gets a bad hint. since she has no other information, she follows her hint and rejects the seed. the second farmer arrives and also gets a bad hint. she sees the first farmer rejected, which suggests a bad hint, and she herself has a bad hint, so she also rejects. now the third farmer arrives. suppose she gets a good hint. she looks at the history and sees two rejections. she knows each rejection implies a bad hint. so she weighs two bad hints against her one good hint. since the hints are only 65 percent reliable, two bad hints outweigh one good hint statistically. so she rejects, even though her private information says the seed is good. this is the tipping point. from now on, every farmer sees a string of rejections that implies at least two bad hints. no matter what hint any subsequent farmer gets, it will never outweigh the public history of two bad hints. so everyone ignores their private information and rejects. you end up with a whole line of farmers rejecting a good seed. every single one of them made the rational choice to maximize their own expected payoff given what they knew, but the group collectively threw away all the private information generated after the second person. if you had just added up all the private hints independently, the good hints would have outnumbered the bad ones, and the group would have known the seed was good. the sequence destroyed the information.

  now let's introduce the intervention. imagine we get to the eighth person in line. by now, the wrong herd is solid. everyone has rejected. but we designate this eighth person as a sealed decider. we keep the history from her. she does not see what the first seven chose. she only sees her private hint. everyone else still sees what she chooses, and everyone knows she was kept in the dark. suppose her private hint is good. because she sees no history, she follows her hint and adopts the seed. now the ninth person arrives. she sees seven rejections and one adoption. but she is rational. she knows the first seven were in a cascade, so their choices convey no new information beyond the first two bad hints. however, she knows the eighth person was sealed, so the eighth person's choice reveals her private hint perfectly. so the ninth person effectively sees two bad hints from the start of the line and one good hint from the sealed decider. this brings the count to two bad versus one good. now the ninth person looks at her own private hint. if her hint is good, she now has two bad hints and two good hints. she is exactly indifferent. here is where the tie-breaking rule is load-bearing. if we assume that when agents are indifferent they follow their private signal, she adopts. this breaks the cascade. the tenth person now sees evidence of two bad hints and two good hints. if she gets a good hint, she adopts. the herd has shifted. because the true state is good, most subsequent hints will be good, and the group converges on the right answer.

  you asked for the accounting. what does the sealed decider give up? she gives up the option to condition her choice on public history. ex-ante, before anyone knows whether the herd is right or wrong, public information is valuable. by sealing her, you are forcing her to ignore potentially useful data. in this specific realization where the herd is wrong, she actually benefits personally because the public data was misleading. but generally, she is taking on a constraint that lowers her expected accuracy slightly compared to having full information. what do the people behind her gain? they gain the restoration of information aggregation. instead being locked into a wrong decision with near-zero accuracy relative to the truth, they get to use their private signals again, restoring their accuracy to the 65 percent baseline. roughly how many people need to be behind her for this to come out ahead? if the sealed decider loses say 5 percent in ex-ante accuracy by ignoring public info, and each follower gains 20 percent by escaping a wrong cascade, then having just one or two people behind her makes the intervention net positive for the group. the social value of her sacrifice is amplified by every person who follows.

  now regarding the mechanism. you guessed right that the tie-breaking rule is doing the heavy lifting. in the scenario above, the ninth person was indifferent because the sealed decider's good hint canceled out one of the two bad hints starting the cascade. i assumed that when indifferent, the agent follows their private signal. if instead they flip a coin when indifferent, the case becomes much weaker. if the ninth person flips a coin, she might reject despite having a good hint. if she rejects, the tenth person sees three effective bad hints and one good hint. even if the tenth person gets a good hint, the weight is now three to two, and she will reject. the wrong herd re-forms. so the unraveling relies on the assumption that agents prioritize their private information when the public ledger is balanced. without that rule, the sealed decider might not generate enough momentum to flip the chain.

  finally, the best objection from someone who thinks this is an artifact of the puzzle setup is that real people don't know the exact reliability of the signals. in the model, everyone knows the hint is 65 percent reliable. in reality, farmers might be unsure how good the agronomist is. if agents are uncertain about the signal precision, they will treat the early choices not just as votes but as data to update their belief about how reliable the hints are. this parameter uncertainty makes agents much more cautious about ignoring their own signals. they will wait longer before cascading because they are still learning about the quality of the information environment. this suggests that while cascades are logically possible, they are much harder to start in the real world than the model predicts, and what looks like herding might often be people updating on a common source of information rather than ignoring their own. this doesn't disprove the failure, but it suggests the window for it to occur is narrower than the clean math implies.
