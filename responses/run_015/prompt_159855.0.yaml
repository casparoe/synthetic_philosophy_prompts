      *   **Task:** Audit a list of 6 specific views on the Prisoner's Dilemma (PD), cooperation, rationality, and evolution.
      *   **Constraints:**
          *   Don't just flag everything as "in tension." Discriminate between real problems and apparent ones.
          *   Rank problems by severity.
          *   Identify what would have to give and the cost of giving it up.
          *   Identify the single revision that cleans up the most.
          *   Distinguish between settled consensus and live debates (don't dress up contested views as consensus).
          *   Admit uncertainty where applicable.

  2.  **Analyze the 6 Views:**
      *   *View 1 (One-shot PD):* Defect. Rationality requires it. "What if everybody..." is a mistake. (Standard Causal Decision Theory / Nash Equilibrium view).
      *   *View 2 (Finite Iterated PD):* 100 rounds known. Backward induction leads to defect on round 1. (Standard Game Theory view).
      *   *View 3 (Real Relationships):* Cooperate. Tit-for-Tat (TFT). Morality = reciprocity + emotions preventing defection. (Evolutionary Psychology / Axelrod view).
      *   *View 4 (Group Selection):* Confusion. Kin selection/gene-level interest explains it better. (Standard Dawkins/Williams view).
      *   *View 5 (Human Scale Cooperation):* Humans cooperate at huge scale with strangers. Reciprocity (View 3) explains it scaled up. No need for group/culture selection. (Potential weak point: Indirect Reciprocity/Institutions vs. Direct Reciprocity).
      *   *View 6 (Self-Training):* Rational to train oneself to be cooperative automatically (heuristics). Don't calculate every time. Exception: Tipping in transit cities. (Bounded Rationality / Precommitment view).

  3.  **Evaluate Consistency & Tensions:**

      *   *1 & 2 vs. 3 & 6:* This is the classic "Rationality vs. Success" tension. In 1 & 2, the user defines rationality as narrow payoff maximization in the specific game. In 3 & 6, they define rationality as long-term self-interest via character building.
          *   *Is this a contradiction?* Not necessarily. It depends on the *description* of the game. If the game is "Life," cooperation is rational. If the game is "One-shot Anonymous PD," defection is rational. The user seems to hold this distinction clearly.
          *   *Tension:* View 6 admits to *not* tipping in transit cities (View 1 behavior) while claiming to be a cooperative person (View 6). This is consistent with the logic but might feel morally inconsistent to some. However, logically, it holds.

      *   *4 vs. 5:* View 4 rejects group selection. View 5 claims direct reciprocity explains large-scale stranger cooperation.
          *   *The Problem:* Direct reciprocity (TFT) *cannot* explain large-scale cooperation with strangers you never meet again. TFT requires repeated interaction with the *same* individual. Large-scale human cooperation relies on *indirect* reciprocity (reputation), institutions, norms, and punishment.
          *   *Consensus Check:* Biologists/Evolutionary Psychologists generally agree that direct reciprocity doesn't scale to cities. They invoke indirect reciprocity, strong reciprocity, or cultural group selection. View 5 is the weakest link scientifically.

      *   *2 (Backward Induction):* This is theoretically sound in classical game theory but empirically false (people cooperate). The "Centipede Game" literature shows this. Is it a tension? Only if the user thinks humans *should* follow backward induction in real life. They seem to accept it as a theoretical truth but live by View 3.

      *   *1 (One-shot):* "What if everybody..." is indeed the Fallacy of Composition in Causal Decision Theory (CDT). However, Evidential Decision Theory (EDT) or Functional Decision Theory (FDT) might disagree. But among standard economists/biologists, CDT is the baseline. This is fairly settled in the context of "standard rationality."

  4.  **Identify the "Live Fights" vs. "Settled":**
      *   *Settled:* One-shot PD = Defect (Nash Equilibrium). Finite Iterated PD = Defect (Backward Induction *theoretically*). Group Selection (strict sense) is largely rejected in favor of Multi-Level Selection or Kin Selection (though MLS is making a comeback, strict "good of the species" is dead).
