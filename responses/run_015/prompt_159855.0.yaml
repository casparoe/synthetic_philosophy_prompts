      *   *Contested:* View 1 (Rationality). Philosophers debate CDT vs. EDT vs. FDT. But for a layperson, CDT is the standard "rational" definition.

  5.  **Drafting the Audit (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the views. They are better than most pop-sci takes.
      *   *The "Settled" Stuff:* Validate 1, 2, and 4 (mostly). View 1 is standard CDT. View 2 is standard Game Theory (even if counter-intuitive). View 4 is the standard Neo-Darwinian line (though with caveats).
      *   *The Big Problem (View 5):* This is the critical failure point. Direct reciprocity (TFT) *cannot* explain cooperation in anonymous cities. You need *Indirect Reciprocity* (reputation) or *Institutions*. If you defect in a one-shot (View 1), you can't sustain a city of one-shots via TFT.
      *   *The Minor Tension (View 6 vs. View 1):* The tipping example. It's consistent logically but highlights the fragility of the "character" argument.
      *   *The "Group Selection" Nuance (View 4):* Need to clarify that "Group Selection" isn't totally dead, it's just rebranded as Multi-Level Selection. But the user's intuition (genes/kin) is mostly safe.
      *   *Ranking:*
