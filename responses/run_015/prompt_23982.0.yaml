answer: |-
  # The Non-Ordinary Goods Filter

  **Purpose:** To provide a consistent, 30-minute preliminary assessment for proposals involving money exchanging hands for non-standard goods (body parts, civic rights, emergency resources, etc.).
  **Users:** Compliance staff (no philosophy training required).
  **Output:** A recommendation (ALLOW, BAN, REGULATE, or HAND-OFF) for the Ethics Committee.

  ---

  ### Step 1: The Alienability Check (Can this be sold?)
  **Concept:** Some things are rights or duties, not property. Selling them destroys their purpose.
  **Plain-Language Test:** *The System Collapse Test.*
  > "If everyone were allowed to buy and sell this thing freely, would the system this thing belongs to stop working?"
  > *Example:* If votes are sold, democracy becomes an auction. The system collapses. If guitars are sold, music still happens. The system holds.

  *   **Ask:** Does the good fail the System Collapse Test?
  *   **Sufficient Answer:** Yes/No.
  *   **Stop Rule:** If **YES** (System Collapses), recommend **BAN**. Do not proceed to price or fairness.
  *   **Judgment Call:** You must define the "system." (e.g., for a kidney, is the system "health" or "organ allocation"? Use "organ allocation.")

  ### Step 2: The Corruption Check (Does money break the relationship?)
  **Concept:** Some goods aren't destroyed by sale, but the *motive* for providing them is damaged by payment.
  **Plain-Language Test:** *The Shame Test.*
  > "If the provider had to publicly state, 'I did this primarily for the money,' would it undermine trust in the profession or the good?"
  > *Example:* A nurse saying "I cared for you for the bonus" undermines care. A contractor saying "I built this for the fee" does not undermine the building.

  *   **Ask:** Does the transaction fail the Shame Test?
  *   **Sufficient Answer:** Yes/No.
  *   **Stop Rule:** If **YES**, move to Step 4 (Consequences). Do not proceed to Step 3.
  *   **Judgment Call:** Distinguish between "compensation for time" (okay) and "payment for the act itself" (risky).

  ### Step 3: The Coercion Check (Is the seller free?)
  **Concept:** Unfairness (bad price) is different from Exploitation (no choice).
  **Plain-Language Test:** *The Walk-Away Test.*
  > "Could the seller walk away from this deal tomorrow without suffering serious harm to their health, safety, or basic livelihood?"
  > *Example:* Selling a spare guitar: Yes (Walk away). Selling a kidney to pay debt: No (Cannot walk away).

  *   **Ask:** Does the seller fail the Walk-Away Test?
  *   **Sufficient Answer:** Yes/No.
  *   **Stop Rule:** If **YES** (They cannot walk away), this is exploitative. Move to Step 4.
  *   **Note:** If the *buyer* is desperate (e.g., emergency PPE), this test focuses on the *seller*. If the seller is a opportunistic middleman, they pass this test.

  ### Step 4: The Prohibition Risk Check (Will a ban hurt?)
  **Concept:** Sometimes a moral ban causes more harm than the immoral act.
  **Plain-Language Test:** *The Underground Test.*
  > "If we ban this, will the trade happen anyway but less safely, or will patients be denied essential care immediately?"
  > *   *Scenario A:* It goes underground/unsafe (e.g., black market organs).
  > *   *Scenario B:* Patients die/lose access immediately (e.g., no ventilators).
  > *   *Scenario C:* The trade simply stops (e.g., no one sells votes).

  *   **Ask:** Does a Ban trigger Scenario A or B?
  *   **Sufficient Answer:** Yes/No.
  *   **Decision Logic:**
      *   If Step 1 was **BAN** (Alienability): Ignore Step 4. The system cannot function if this is traded. **Recommend BAN.**
      *   If Step 2 or 3 raised red flags, but Step 4 is **YES** (Harm will occur): **Recommend REGULATE.** (Allow with strict controls to mitigate harm).
      *   If Step 2 or 3 raised red flags, and Step 4 is **NO** (Trade stops safely): **Recommend BAN.**
      *   If no red flags in Steps 1-3: **Recommend ALLOW.**

  ### Step 5: The Hand-Off (Where facts end and values begin)
  **Concept:** This procedure filters clear violations and safety risks. It cannot weigh competing moral goods (e.g., Religious Freedom vs. Access).
  **Plain-Language Test:** *The Tie-Breaker Test.*
  > "Have I answered all previous questions clearly, but I still feel uneasy because two valid values are fighting?"

  *   **Ask:** Is there a genuine value conflict remaining after Step 4?
  *   **Sufficient Answer:** Yes/No.
  *   **Stop Rule:** If **YES**, recommend **HAND-OFF**. Write a one-paragraph summary of the conflict for the Ethics Committee.
  *   **Note:** Do not use this to avoid a hard decision in Steps 1-4.

  ---

  # Application to Proposals

  ### Proposal 1: Paying Living Kidney Donors ($20k + costs) for Directed Donation

  *   **Step 1 (Alienability):** *System Collapse Test.* If kidneys are commodities allocated by wealth rather than medical need, does the organ allocation system collapse? Yes. It shifts from "sickest first" to "richest first."
      *   *Result:* **FAIL.**
  *   **Step 2 (Corruption):** *Shame Test.* If a donor says, "I sold my kidney for $20k," does it undermine the altruistic basis of the transplant system? Yes.
      *   *Result:* **FAIL.**
  *   **Step 3 (Coercion):** *Walk-Away Test.* Can a donor walk away without harm? Usually, donors seeking payment are financially vulnerable.
      *   *Result:* **FAIL.**
  *   **Step 4 (Prohibition Risk):** *Underground Test.* If we ban this, does it go underground? Possibly. But because Step 1 failed (Alienability), the procedure dictates we do not weigh the underground risk against the system collapse. The system cannot tolerate the trade.
      *   *Result:* **BAN.**
  *   **Step 5 (Hand-Off):** No value conflict remains. The procedure identifies this as a fundamental category error.
  *   **Analysis:** This matches your prior. The procedure rejects this not because the price is wrong, but because the good (body parts) is not alienable in this context.

  ### Proposal 2: Paying 300% Contract Price for PPE during Emergency

  *   **Step 1 (Alienability):** *System Collapse Test.* If ventilators are sold at market rates, does healthcare collapse? No. They are manufactured goods.
      *   *Result:* **PASS.**
  *   **Step 2 (Corruption):** *Shame Test.* If the hospital says, "We paid 300% to save patients," is it shameful? No, it's triage. If the *seller* says, "I charged 300% because they were desperate," is it shameful? Yes, but that is the seller's ethics, not the buyer's.
      *   *Result:* **PASS** (for the hospital's action).
  *   **Step 3 (Coercion):** *Walk-Away Test.* Who is the seller? A middleman or manufacturer. Can they walk away? Yes. They are not exploited. Is the *hospital* coerced? Yes, by the emergency. But this step tests seller exploitation.
      *   *Result:* **PASS.**
  *   **Step 4 (Prohibition Risk):** *Underground Test.* If we BAN paying 300%, what happens? We do not get the ventilators. Patients die (Scenario B).
      *   *Result:* **Harm Triggered.**
  *   **Decision Logic:** Steps 1-3 passed, but the price is ethically fraught (price gouging). However, Step 4 indicates a Ban causes direct physical harm. Therefore, we cannot BAN. We must mitigate the reputational/moral risk.
      *   *Result:* **REGULATE.** (Allow purchase only if no other source exists, document necessity, cap quantity).
  *   **Step 5 (Hand-Off):** The procedure resolves the tension between "don't reward gouging" and "save patients" by prioritizing patient safety while restricting the behavior.
  *   **Analysis:** You were torn. The procedure leans toward action because the cost of inaction (death) is factual, while the cost of action (reputation) is manageable via regulation.

  ### Proposal 3: $100 Gift Cards for Voting in Health Bond Election

  *   **Step 1 (Alienability):** *System Collapse Test.* If votes are bought/sold, does the election system collapse? Yes. It becomes a plutocracy.
      *   *Result:* **FAIL.**
  *   **Step 2 (Corruption):** *Shame Test.* If a voter says, "I voted for the bond because of the $100," does it undermine the civic duty? Yes.
      *   *Result:* **FAIL.**
  *   **Step 3 (Coercion):** *Walk-Away Test.* Low-income residents may feel they cannot walk away from $100.
      *   *Result:* **FAIL.**
  *   **Step 4 (Prohibition Risk):** *Underground Test.* If we BAN this, does the trade go underground? Unlikely. People will just not vote, or vote based on preference. The "trade" stops safely.
      *   *Result:* **No Significant Harm.**
  *   **Decision Logic:** Step 1 failed (Alienability). The procedure dictates a BAN regardless of Step 4.
      *   *Result:* **BAN.**
  *   **Step 5 (Hand-Off):** No value conflict. Voting rights are non-alienable.
  *   **Analysis:** Matches your suspicion. The procedure identifies this as a category error (treating a civic right as a service) before even considering the financial coercion.

  ---

  Verdict: BAN, REGULATE, BAN
