answer: |-
  ### Rough Notes: Damaging vs. Rhetorical Objections

  Most objections in this room will be performative. The microeconomists want to see that you know the rules of their game (identification), even if they privately suspect historical data is too noisy to ever truly satisfy them. The sociologist wants to signal that they don't fall for "culturalist" reductionism. The philosopher wants to ensure you aren't committing category errors. These are often rhetorical hurdles: clear them, and you're hired.

  The *damaging* objections are those that sever the link between your empirical strategy and your theoretical claim. For the micros, this is omitted variable bias that correlates with your border (e.g., if Reformed areas were already commercially oriented). For the sociologist, it is the claim that your "religious" mechanism is actually just early state capacity (visitation = tax assessment). For the philosopher, it is the claim that "auditability" is not a cause of capitalism but a definition of it (tautology).

  **Selection Strategy:** I have ordered these by *lethality*. A failed identification strategy kills the paper immediately in a policy school. A constitutive error kills the theory permanently. A state-capacity alternative makes the paper redundant. I have placed the "Grant" objection at the bottom, as scope limitations are survivable.

  ***

  ### Prep Sheet: Eight Objections Ordered by Damage

  **1. The Selection Objection (Applied Microeconomist)**
  *   **Idiom:** "Your border design relies on the assumption that church assignment was as-good-as-random conditional on covariates. But ecclesiastical boundaries often followed existing economic fault lines or trade routes. Have you tested for pre-trends in commercial activity or urbanization? If Reformed villages were already more commercially integrated, your 'auditability' effect is just selection on initial economic conditions."
  *   **Reply:** "I agree that ecclesiastical borders can be endogenous. That is why I do not rely on the raw border. I use a discontinuity design that controls for distance to the nearest city and pre-Reformation tax rolls. I also run a placebo test on borders where the theological difference was minimal. The effect persists only where the *disciplinary* regime differed, not where the doctrine differed, which suggests it is not driven by pre-existing commercial integration."
  *   **Soft Spot:** Pre-Reformation commercial data in 16th-century villages is sparse; your controls are likely noisy proxies.

  **2. The Constitutive Objection (Philosopher of Social Science)**
  *   **Idiom:** "You claim auditability causes capitalism. But isn't 'capitalism' just the name we give to a system where conduct is auditable, deferred, and accumulated? If auditability is a constitutive rule of the game rather than an external shock to the players, you aren't describing a causal mechanism. You are defining the phenomenon you claim to explain."
  *   **Reply:** "That would be true if I defined capitalism *as* auditability. I do not. I define capitalism as a specific regime of accumulation and investment. Auditability is a *technology* that lowers the transaction cost of that regime. Just as the steam engine is not constitutive of industrialization but a causal driver of it, self-audit is a tool that makes long-horizon investment feasible, not the definition of the investment itself."
  *   **Soft Spot:** The line between 'technology' and 'constitution' is blurrier in social practices than in steam engines; critics may argue you can't separate the practice from the system.

  **3. The State Capacity Objection (Historical-Comparative Sociologist)**
  *   **Idiom:** "You treat visitation registers and confessional exams as religious tools. But in the 16th century, church discipline was the primary arm of local governance. Isn't 'auditability' just a proxy for the penetration of the bureaucratic state? You aren't finding a Protestant ethic; you're finding the early fiscal-military state's need to count and discipline subjects."
  *   **Reply:** "I distinguish between state capacity and religious discipline by looking at areas where the church order was Reformed but the state remained weak. The effect holds. Furthermore, state capacity usually predicts public goods provision; my outcome is private accounting behavior (diaries, ledgers). The state wants taxes; my mechanism explains why the *agent* starts tracking themselves voluntarily."
  *   **Soft Spot:** The distinction between 'church' and 'state' in the 16th century is analytically fragile; they were often the same personnel.

  **4. The Human Capital Confound (Applied Microeconomist)**
  *   **Idiom:** "Reformed churches emphasized literacy for Bible reading. You claim to control for this, but your literacy measures are coarse. If Reformed villagers could read better, they could keep accounts better. Isn't this just the standard human capital story with a new label?"
  *   **Reply:** "I use a subset of villages where literacy rates were statistically indistinguishable between Reformed and Lutheran orders, yet the accounting practices diverged. Literacy is necessary for bookkeeping, but it is not sufficient. The *incentive* to track comes from the theological imperative of assurance, not the *ability* to read. I show the effect is zero in high-literacy Lutheran areas."
  *   **Soft Spot:** Interaction terms between literacy and religion are hard to power with historical data; confidence intervals may be wide.

  **5. The Endogenous Mechanism (Applied Microeconomist)**
  *   **Idiom:** "You use the adoption of personal accounting as your intermediate outcome. But merchants adopt bookkeeping when trade volume increases. If the Reformation caused trade (for any reason), your mechanism is endogenous. You haven't isolated the 'auditability' channel from the 'profit opportunity' channel."
  *   **Reply:** "I instrument the adoption of accounting practices using the proximity to seminaries that taught these specific methods, distinct from general trade hubs. This isolates the supply of the *practice* from the demand generated by trade volume. The first stage is strong, suggesting the practice diffused via religious networks, not just market density."
  *   **Soft Spot:** Proximity to seminaries might also correlate with other unobserved cultural networks.

  **6. The Manipulability Constraint (Philosopher of Social Science)**
  *   **Idiom:** "Even if your history is correct, what is the policy parameter? We cannot assign populations to Reformed church orders. If a cause is not manipulable, is it useful for a policy school? You've given us a history, not a lever."
  *   **Reply:** "We study history to identify mechanisms, not to replicate treatments. We cannot replicate the Reformation, but we can replicate 'auditability.' Modern policy interventions—like commitment savings devices or transparency initiatives—are manipulations of auditability. My historical claim identifies the mechanism that makes those modern interventions work."
  *   **Soft Spot:** The leap from 16th-century soul-searching to modern nudges is large; the mechanisms may not transfer.

  **7. The Anachronism Objection (Historical-Comparative Sociologist)**
  *   **Idiom:** "You use the language of 'auditing' and 'accounting.' Did these agents experience their diaries as ledgers? Or are you imposing a modern economic rationality onto a religious experience of sin and grace? If the mechanism relies on their intent, you may be misdescribing their action."
  *   **Reply:** "I do not rely on their subjective description. I rely on the functional structure of the practice. Whether they called it 'examining conscience' or 'balancing the books,' the cognitive operation is identical: serial monitoring of behavior against a standard. The functional outcome (deferred gratification) holds regardless of the label."
  *   **Soft Spot:** Ignoring agent intent risks missing *why* the practice stuck; functionalism often fails to explain persistence.

  **8. The Heterogeneity Objection (Applied Microeconomist) [GRANT THIS]**
  *   **Idiom:** "Does this effect hold for peasants, or only for merchants? If it's only for the commercial class, your claim about 'culture' is actually a claim about 'class'. You might just be identifying the adoption of tools by those who already had capital to deploy."
  *   **Reply:** "You are right to press on this. The effect is strongest among those with surplus to manage. I should be clearer that this is not a universal cultural shift, but a shift in the *technology of the self* available to the economically active. I will qualify the claim: it lowered the cost for those on the margin of capital accumulation."
  *   **Soft Spot:** This limits the scope of your 'Weberian' claim significantly; it becomes a story about merchants, not societies.

  ***

  ### Strategic Constraints

  **The Voluntary Concession (First 5 Minutes):**
  "I want to be upfront about measurement noise. We are relying on the survival of 16th-century diaries and ledgers, which is non-random. I treat the adoption of accounting practices as a latent variable inferred from these traces. I am not claiming I have a perfect census of self-audit; I am claiming I have a consistent proxy that correlates with the theological shock."
  *(Why: Disarms the Micros' measurement critique before they weaponize it; shows methodological maturity.)*

  **The Non-Negotiable Claim:**
  "The distinction between *preferences* and *constraints/technology*. I will not accept the framing that the Reformation changed how much people *wanted* to save. It changed the *cost* of monitoring the saving. If you force me to choose between a preference story and a technology story, I must choose technology. That is the only way this contributes to development policy."
  *(Why: This is your theoretical innovation. If you concede preferences, you are just re-running Weber.)*

  ***

  ### The Nightmare Question

  **"If the auditability technology was co-opted by the state for tax purposes within two generations, isn't your long-run effect actually just capturing the variance in early state capacity? You've identified the origin of the tool, but the mechanism sustaining capitalism is the state's enforcement, not the agent's self-audit. Why shouldn't we just call this a State Formation paper?"**

  **Why it is the hardest:**
  It unites all three critics.
  1.  **Micro:** It suggests an omitted variable (State Capacity) that correlates with your treatment.
  2.  **Sociologist:** It validates their view that "culture" is just state discipline in disguise.
  3.  **Philosopher:** It challenges whether the "self-audit" cause persists long enough to matter, or if it was merely a transient shock absorbed by structural forces.
  To answer this, you must argue that *internalized* discipline is cheaper to enforce than *state* discipline, which is a hard theoretical sell without direct evidence on enforcement costs.
