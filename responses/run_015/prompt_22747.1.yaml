      *   *Decision:* Stick with **Condorcet (Schulze)** because the prompt sets up a debate between Plurality and Condorcet. It shows I'm resolving *their* deadlock, not introducing a third wildcard that might confuse the non-theory members. Plus, it allows me to discuss G-S in the context of ordinal rules which is standard seminar material.

