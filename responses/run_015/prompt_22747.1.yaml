  6.  **Addressing the "Hard to Game" Demand specifically:**
      *   I must explicitly state: "The Gibbard–Satterthwaite theorem implies that the Condorcet proponents' goal of a system 'hard to game' is theoretically impossible for any deterministic rule with 4 candidates."
      *   Then pivot: "However, we can choose a rule where the *barrier* to successful strategy is higher or the *need* for strategy is lower."
      *   Plurality forces strategy (don't waste vote). Condorcet allows sincerity (rank true prefs). So Condorcet is *practically* less demanding of strategic cognition, even if theoretically manipulable.

  7.  **Final Review against Constraints:**
      *   Recommend specific rule? Yes (Schulze/Condorcet).
