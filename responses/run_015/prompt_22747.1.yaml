answer: |-
  **MEMORANDUM**

  **TO:** Elections Committee Chair
  **FROM:** [Your Name], Graduate Association Elections Committee Member
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Voting Rule for Executive Election

  **Recommendation**
  I recommend the committee adopt **ranked ballots counted using the Schulze Method** (a Condorcet-compliant procedure) for the upcoming executive election. To meet the printing deadline, we must finalize this decision at Thursday's meeting, finalize ballot language by the 10th, and submit proofs to the printer by the 14th for the 15th run.

  **Theoretical Constraints: The "Hard to Game" Demand**
  I write this as a student currently enrolled in a Social Choice Theory seminar, and I believe it is vital we ground our decision in the theoretical limits of voting systems. Specifically, we must address the Condorcet proponents' desire for a system that is "hard to game."

  The **Gibbard–Satterthwaite theorem** establishes that for any deterministic voting rule with three or more candidates, if the rule is not dictatorial, it is *manipulable*. In plain English: with four candidates, **no voting rule we choose can be mathematically proven to be strategy-proof.** There will always be some scenario where a voter could benefit by misrepresenting their preferences.

  Therefore, the Condorcet members' hope for a system immune to strategy is theoretically impossible, just as the Plurality members' assumption that voters will "mostly vote sincerely" is risky. In Plurality systems, sincerity is often irrational; voters frequently engage in "lesser-evil" voting to avoid the spoiler effect.

  **Why Schulze/Condorcet Remains the Superior Choice**
  If all systems are manipulable (per Gibbard–Satterthwaite), how do we choose? We should select the rule that minimizes the *pressure* to strategize and handles the most likely strategic failures.

  1.  **Reducing the Need for Strategy:** In Plurality, strategy is often defensive. Voters abandon their favorite candidate if they appear unelectable to prevent their least favorite from winning. The Schulze method allows voters to rank their true favorite first without "wasting" that vote, as lower preferences are considered if the top choice cannot win. This aligns closer to the Plurality members' hope for sincere voting.
  2.  **Majority Support:** As noted by the Condorcet proponents, Plurality allows a candidate to win with a mere plurality (e.g., 30%) despite 70% of the electorate preferring others. The Schulze method ensures the winner beats all other candidates in pairwise comparisons, guaranteeing broader consensus.
  3.  **Complexity of Manipulation:** While Gibbard–Satterthwate proves manipulation is *possible*, it does not prove it is *easy*. Successful manipulation of Condorcet methods often requires detailed knowledge of how others will vote (information rarely available in secret ballots), whereas Plurality strategy relies only on public polling.

  **Mitigating Strategic Voting Within G-S Constraints**
  Since we cannot eliminate manipulability via the rule alone, the committee must mitigate strategic voting through procedure and education:

  *   **Voter Education:** We must explicitly instruct voters that they can rank candidates sincerely. Many strategic voting habits are learned from Plurality elections. A brief guide explaining that "ranking your true favorite first will not harm your chances" can reduce defensive voting.
  *   **Ballot Secrecy:** Strategic voting relies on coordination. We must reinforce that ballots are secret, making it difficult for factions to coordinate a "burial strategy" against a strong candidate.
  *   **Transparency:** We will publish the pairwise matrix and the beatpath calculation after the election. Transparency reduces suspicion that the "complex" rule was used to obscure a manipulated outcome.

  **Implementation Timeline**
  To ensure ballots are ready for the printer on the 15th, I propose the following schedule:

  *   **Thursday (Committee Meeting):** Vote to adopt Schulze Method.
  *   **Friday – Monday (6th–9th):** Draft ballot instructions and "How to Vote" guide for students.
  *   **Tuesday (10th):** Finalize ballot design with vendor.
  *   **Wednesday – Thursday (11th–12th):** Committee review of digital proofs.
  *   **Friday (13th):** Final sign-off.
  *   **Monday (15th):** Ballots sent to print.

  **Conclusion**
  The Gibbard–Satterthwaite theorem teaches us humility: there is no perfect voting rule. However, there are rules that are more robust than others. The Schulze method acknowledges the impossibility of perfect strategy-proofness but offers the best practical environment for sincere expression and majority support. I look forward to discussing this further on Thursday.
