  8.  **Drafting the Content:** (Mental check of the G-S statement: It applies to ordinal voting rules. Plurality is ordinal (implicitly). Condorcet is ordinal. So it applies to both.)

      *   *Wait, one nuance:* G-S applies to *ordinal* rules. If we used *Cardinal* voting (like Approval or Score), G-S doesn't strictly apply in the same way (though manipulation is still possible). However, the debate is Plurality vs. Condorcet. Switching to Approval might be too disruptive this late. I will stick to the Condorcet recommendation but mention that *no* ordinal rule is safe. Actually, recommending **Approval Voting** might be the "Social Choice Student" power move. It sidesteps the ranking complexity and reduces strategic pressure.
