      *   *Key Distinction:* Harm vs. Offense/Dislike.
      *   *Context:* Written in a representative democracy context, worried about "tyranny of the majority."

  4.  **Mapping the Framework (Step-by-Step Analysis):**

      *   *Liberty Restricted:*
