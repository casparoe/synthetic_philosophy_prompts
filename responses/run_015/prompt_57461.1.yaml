          *   *Security:* If minarets signal a takeover, is that a security threat? Or is it fear?
          *   *Offense:* Many voters found them offensive to Swiss culture. Mill explicitly excludes mere offense/dislike.
          *   *Symbolic:* It's about the "look" of the public sphere. Mill generally protects individual expression unless it incites violence.
