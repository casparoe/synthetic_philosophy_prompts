prompt: |-
  I sit on the regional climate adaptation board and we're meeting next tuesday to vote on whether to adopt the Meridian Group's Bivalent Contingancy Protocal for ranking flood-defense investments. The protocal treats predictions like District 4 will see catastrophic flooding by 2035 as already true or false right now—no middle ground, no genuinely open future—so they can generate a strict priority list for where to build walls. A few board members, plus some residents who showed up to the public comment session, have raised what feels like the old sea-battle worry: if future contingents don't have present truth-values, then treating those forecast-statements as bivalent now is either metaphysically wrong or politically coercive, like we're locking in one branch and pretending the other branches never existed. But others on the board say practical goverance can't sit around waiting for ontological certainty; we have to treat high-confidence forecasts as settled or we'll never displace anyone and never build anything.

  Please draft the short written opinion I'll circulate before tuesday's meeting: recommend a concrete course—approve the protocal with conditions, reject it outright, or approve it only with a mandatory ontic-openness disclosure clause—and include a clear time frame, like a one-year pilot with review checkpoints or an immediate halt. You should take the sea-battle objection seriously, not brush it off as abstract philosophy, but also don't let it paralyze decision-making; I want the reasoning to engage the strongest point on the losing side honestly. I was arguing about this with my roommate last night and she said I'm overthinking it, but I think the framing actually matters for how we justify moving people out of high-risk zones.

  Make it a committed take: pick one option and defend it with reasons, don't just lay out the menu and leave me to choose. After the memo, include a brief structured summary as a JSON object with these fields: 'recommendation' (the bottom line), 'time_frame' (e.g. one-year pilot), 'strongest_counterargument' (the best point for the side you reject), 'philosophical_hook' (how the sea-battle issue actually shows up inside the protocal), and 'action_items' (a list of concrete steps the board should take).
