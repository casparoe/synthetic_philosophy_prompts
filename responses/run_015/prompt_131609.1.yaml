  # JOINT STATEMENT ON MAIMONIDEAN SACRIFICIAL THEORY
  **Signed by the Scaffolding and Fossil Collaborative Working Groups**

  **Preamble**
  We, the undersigned participants, acknowledge that the labels "Scaffolding" and "Fossil" are heuristic devices created for this collaboration and do not represent standard academic taxonomy. Despite significant interpretive divergence, we have identified a common textual baseline regarding Maimonides' *Guide for the Perplexed* and *Mishneh Torah*. The following document separates settled textual observations from contested philosophical implications.

  ### I. AGREED CLAIMS (SETTLED TEXTUAL OBSERVATIONS)

  1.  **Divine Lack of Need:** Both camps agree that Maimonides explicitly denies that God requires animal sacrifice for sustenance, satisfaction, or any intrinsic benefit. The ritual is not for God's sake.
  2.  **Historical Context of Command:** Both camps agree that Maimonides identifies the historical prevalence of sacrificial worship among neighboring nations as a primary factor in why the commandment was given to Israel. Abrupt abolition was deemed psychologically impossible for the generation receiving the Torah.
  3.  **Hierarchy of Worship:** Both camps agree that Maimonides ranks prayer and intellectual apprehension higher than sacrificial ritual. He describes prayer as the "service of the heart" which functions as the substitute for sacrifice in the absence of the Temple.
  4.  **Legal Continuity:** Both camps agree that despite the philosophical explanation in the *Guide*, Maimonides codifies the laws of sacrifice in the *Mishneh Torah* as binding obligations upon the rebuilding of the Temple. He does not suggest the laws be abolished even if the original historical reason (pagan prevalence) were to disappear.
  5.  **Rejection of Literalism:** Both camps agree that Maimonides rejects the idea that the specific details of the sacrifices are arbitrary, but also rejects the idea that they are the ultimate ideal state of worship compared to pure contemplation.

  ### II. DISAGREEMENTS (CONTESTED INTERPRETIVE WORDING)

  **A. The Scaffolding Camp Statement**
  "We maintain that Maimonides views sacrifice as a divine concession strictly bound to the historical limitations of ancient humanity. The ritual functioned as temporary training wheels designed to wean Israel off idolatry by redirecting existing habits toward monotheism. While the law remains binding due to divine command, its *purpose* remains instrumental. The ritual possesses no intrinsic spiritual necessity; it is a tolerated accommodation to human weakness that persists only because the commandment itself has not been revoked, not because the physical act holds eternal metaphysical value."

  **B. The Fossil Camp Statement**
  "We maintain that Maimonides views sacrifice as a preserved ritual form that retains enduring spiritual weight independent of its historical origins. While the *timing* and *necessity* of the commandment were influenced by pagan norms, the structure of the ritual itself channels a permanent spiritual reality. The physical act is not merely a concession to weakness but a required component of human divine service that prayer cannot fully replicate. The ritual possesses intrinsic value as a bridge between the physical and spiritual realms, which is why it remains obligatory regardless of historical context."

  ### III. CRUXES AND PREDICTIVE CASES

  **Crux 1: The Intrinsic Value of Physical Ritual ("Naturalness")**
  *Definition:* Does the physical act of sacrifice have inherent spiritual utility, or is it purely a tool for psychological management?

  *   **Concrete Case:** A hypothetical scenario where the Temple is rebuilt tomorrow, and a priest offers a sacrifice with perfect intention and knowledge.
  *   **Agreed Bearing:** Both sides agree this case tests whether the ritual adds something to the worshiper's spiritual status that prayer alone does not.
  *   **Scaffolding Prediction:** The priest gains merit solely through obedience to a command, not through the physical act itself. The act remains a concession to human materiality; if humans were purely intellectual beings, the act would be unnecessary.
  *   **Fossil Prediction:** The priest gains merit through the specific channeling of energy that only physical sacrifice allows. The act connects the material world to the divine in a way prayer cannot, regardless of the worshiper's intellectual level.

  **Crux 2: The Scope of the Concession (Universal vs. Historical)**
  *Definition:* Was the concession to sacrifice made because of *ancient pagan culture* specifically, or because of *permanent human nature* generally?

  *   **Concrete Case:** A hypothetical nation discovered today that has never been exposed to idolatry or sacrificial worship and possesses high intellectual refinement.
  *   **Agreed Bearing:** Both sides agree this case tests whether the sacrificial system is tied to a specific historical error (paganism) or to the enduring human condition.
  *   **Scaffolding Prediction:** Maimonides would argue this nation would not require sacrificial laws. The commandment was specific to weaning Israel off the norms of their time. For this refined nation, prayer alone would suffice as the ideal worship.
  *   **Fossil Prediction:** Maimonides would argue this nation would still require sacrificial laws. The need for physical action is rooted in human nature itself, not just historical accident. Sacrifice remains the proper form of worship for embodied beings, regardless of their exposure to paganism.

  ### IV. STATUS SUMMARY

  *   **Settled:** Maimonides denies divine need for sacrifice; acknowledges historical/pagan context; prioritizes prayer intellectually; codifies sacrifice as law for the future.
  *   **Contested:** Whether the ritual's value is purely instrumental (historical accommodation) or essential (permanent spiritual architecture); whether the concession applies only to the ancient context or to human nature forever.
