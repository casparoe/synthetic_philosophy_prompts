  1. The precise question (150 words)
  Standard exegesis treats Dennett's physical, design, and intentional stances primarily as an epistemic taxonomy: three predictive strategies adopted based on computational efficiency and available information. This project asks a distinct, underexplored ontological question: Do patterns identified exclusively via the design stance constitute mind-independent realities? Specifically, does functional organization possess ontological weight irreducible to physical constitution yet distinct from intentional attribution? This question is currently neglected because Dennett's instrumentalism often discourages ontological commitment beyond the physical base, treating higher-level descriptions as mere convenient fictions. However, if design patterns are merely predictive shortcuts, they lack causal efficacy. If they are real patterns, they require a metaphysics intermediate between brute physics and psychology. Establishing this distinction is crucial for validating functional explanations in science without collapsing into reductionism or dualism, forcing us to confront whether the design stance tracks something in the world or in our modeling practices.

  2. Why existing answers leave it open (200 words)
  Current literature typically forces a rigid dichotomy that leaves the ontological status of design patterns unresolved. Reductionists argue the design stance is merely the physical stance plus practical ignorance; functional descriptions are shorthand for complex causal chains that could, in principle, be described physically without remainder. Conversely, intentionalists absorb design into the intentional stance, arguing functions exist only relative to a designer's purpose or an interpreter's attribution. Neither settles whether functional patterns themselves carry truly autonomous ontological weight. The reductionist ignores implementation independence—the same function realized across disparate physical substrates suggests something beyond specific microstates. The intentionalist conflates functional robustness with mental projection, making function mind-dependent. Consequently, it remains open whether design-stance patterns exist independently of observers. If functions are real, they must survive the removal of the interpreter and resist reduction to specific physical microstates. Existing frameworks fail to isolate this intermediate layer, leaving the metaphysics of functional organization fully unresolved and vulnerable to elimination.

  3. The proposed approach (250 words)
  The proposed method combines conceptual analysis of "robustness" and "implementation independence" with examined cases of non-biological functional systems where agency is strictly minimal. I will analyze engineered artifacts, artificial neural networks, and ecological niches where function persists despite significant physical variation. This avoids the trap of biological essentialism, which ties function strictly to evolutionary history, and intentionalism, which ties it to agency. Pure metaphysics of science often lacks traction without concrete systemic examples, while empirical case studies alone cannot establish ontological criteria. By focusing on systems where the physical stance is computationally intractable yet the intentional stance is inappropriate because no beliefs or desires exist, we isolate the design stance. This approach is also preferable because it tests the reality of patterns against their predictive success and structural stability, rather than merely their linguistic utility. It seeks a criterion where functional description tracks something in the world, not just in our modeling practices, bridging the gap between abstract metaphysics and concrete scientific practice.

  4. What a result would look like and failure conditions (200 words)
  A successful outcome yields a genuinely defensible criterion for design-stance reality, such as counterfactual stability across physical perturbations, demonstrating that functional patterns constrain physical evolution without being reducible to it. This would validate functional realism. Conversely, failure conditions are clear and must be honestly assessed. The project fails if functional patterns always dissolve into physical descriptions upon sufficient analysis, confirming the reductionist view that function is an illusion of complexity. It also fails if functional attribution invariably requires an observer's perspective, confirming the intentionalist absorption that function is projected. If I cannot distinguish design patterns from physical regularities without invoking mental states, the ontological claim collapses. Honesty requires acknowledging that if "function" proves to be merely a user-interface feature of cognition rather than a feature of systems, the proposal's core thesis is ultimately false. The result must show function is discovered, not imposed, or admit the instrumentalist verdict.

  5. Scope and feasibility for one semester (150 words)
  This project is feasible for one semester because it limits scope to the ontological status of the design stance, not a full theory of teleology or biological normativity. Weeks 1-4 will focus on refining the distinction between epistemic and ontological readings of Dennett and mapping the literature. Weeks 5-8 will analyze specific case studies, such as thermostats versus simple AI, to test robustness criteria. Weeks 9-12 will draft the argument, refine the criterion, and prepare the final workshop paper. The limit is explicit: I will not solve the problem of biological normativity, only the reality of functional patterns. This restriction prevents scope creep. Given the focused question and available conceptual tools, a graduate workshop paper is the appropriate venue. The work relies on conceptual clarity rather than new empirical data, making the timeline realistic for a single researcher. Contingency time is allocated in weeks 10-11 for unexpected conceptual difficulties arising during analysis.

  6. Brief reflective note (50 words)
  This framing is non-obvious because it treats the design stance not as a pragmatic compromise between physics and psychology, but as a distinct metaphysical category requiring its own ontological justification independent of human interpretive interests alone, thereby challenging the standard instrumentalist reading that dominates contemporary philosophy of mind and science.
