answer: |-
  Your instincts are quite right to niggle. While the handout captures the *spirit* of Augustine's rigour, it misrepresents the *mechanics* of his argument in ways that materially change the ethical outcome. If you pass this on to a seminar without correction, your students will be critiquing a straw man.

  Here is an audit of the claims, moving through the handout's logic step by step.

  **1. The Definition of a Lie (Silence and Gesture)**
  The handout claims Augustine defined a lie as any statement or gesture intended to produce a false belief, including silence or changing the subject. This is incorrect.

  For Augustine, the essence of a lie is not merely causing a false belief, but the conjunction of a false signification *and* the will to deceive. Crucially, he distinguishes between *suggesting the false* and *concealing the true*. Silence falls into the latter category. Augustine argues explicitly that one is not obliged to speak the truth to everyone, particularly to those who have no right to know it (such as a murderer asking for his victim). To remain silent, or to refuse to answer, is to withhold truth, but it is not to assert falsehood. Therefore, on his account, silence is not a lie. The handout collapses the distinction between deception by commission (lying) and deception by omission (withholding), whereas Augustine maintains it rigorously.

  **2. The Fugitive Dilemma (The Binary Choice)**
  Because the handout gets the definition of silence wrong, it consequently gets the fugitive case wrong. It states there are exactly two options: hand him over truthfully or lie and sin.

  Augustine explicitly rejects this binary. He argues there is a third path: one may remain silent or decline to answer. If the pursuer presses the matter, one may even say, 'I know where he is, but I will not tell you.' This preserves the truth (you do know, and you are not denying it) without betraying the fugitive. Augustine insists that the moral agent is never forced into a position where sinning is the only way to protect the innocent. The handout presents Augustine as trapping the agent in a dilemma; Augustine presents his theory as the very thing that *escapes* the dilemma.

  **3. The Hierarchy of Lies**
  The handout is correct that Augustine sorted lies into a hierarchy. He distinguishes eight types, ranging from lies told in religious doctrine (the worst) to lies told to protect bodily purity, down to lies told in jest or to please others in social conversation.

  **4. Permission of Lighter Lies**
  Here the handout makes its most serious theological error. It claims the lighter sorts (pleasantries, jokes, small kindnesses) were *permitted* when necessity demanded.

  Augustine's hierarchy is a hierarchy of *guilt*, not of *permission*. While he acknowledges that a jocose lie (a joke) is less sinful than a malicious lie that harms a neighbour, he maintains that *all* intentional deception is a sin. None are morally permitted. He concedes that some lies are venial (forgivable) rather than mortal (damning), but a venial sin is still a sin. To suggest Augustine allowed 'white lies' for the sake of kindness or social necessity is to attribute a casuistry to him that he spent his career arguing against. He was an absolutist: the act is intrinsically disordered regardless of the consequence.

  **5. Only the Gravest Ruled Out Absolutely**
  This follows from the previous error. Since Augustine viewed *all* lying as sinful, he ruled *all* of out absolutely as morally good actions. The distinction lies in the severity of the penance or the eternal consequence, not in the licitness of the act itself. The handout implies a threshold model (some lies are okay); Augustine holds a scalar model of wrongdoing (all lies are wrong, some are worse than others).

  **6. The Consensus of the Early Church**
  The claim that this was the settled consensus of the early church, which Augustine merely tidied, is historically dubious. In fact, Augustine was something of a hardliner even for his time. Many of his contemporaries and predecessors in the Greek tradition were more willing to countenance 'officious lies' (lies told for the benefit of another). Augustine's treatises on lying were partly polemical, aimed at tightening discipline against a more relaxed pastoral practice. He did not systematise a consensus; he imposed a stricter regime upon a varied tradition.

  **7. The Self-Refutation and Consequentialist Inference**
  Finally, does the conclusion survive? The handout argues that because nobody can live without white lies, the ban refutes itself, and we should therefore become consequentialists.

  If we correct the earlier errors, this inference collapses.
  First, Augustine would simply deny the empirical premise that nobody can live without lies. He argues that the virtuous person *can* and *must* cultivate the habit of truth-telling, even at great cost. The fact that it is difficult does not make it impossible, nor does it make the rule invalid.
  Second, because Augustine allows for silence and refusal (the 'third path' in the fugitive case), the system is not practically unliveable in the way the handout suggests. The pressure to lie only arises if one assumes one is obliged to answer every question truthfully, which Augustine denies.
  Third, the move to consequentialism is a non-sequitur. Even if one rejects Augustine's deontology, it does not follow that one must adopt consequentialism; one could adopt a different deontological framework (like Kant's, though he is similarly strict) or a virtue ethics approach. But specifically, Augustine's system does not 'refute itself' on the grounds of impossibility, because he provides the loophole of silence that makes compliance possible.

  **Summary for your Seminar**
  If you wish to use this handout, you should flag three critical corrections for your students:
  1.  **Silence is not lying:** Augustine permits withholding truth from those who have no right to it.
  2.  **No lies are permitted:** The hierarchy ranks the severity of the sin, not the acceptability of the act. Even 'white lies' are sinful.
  3.  **No Dilemma:** The agent is never forced to choose between betrayal and sin; silence is the morally safe third option.

  The handout presents Augustine as a rigid legalist who forces impossible choices; the reality is a more nuanced absolutist who provides specific escape hatches (silence) to maintain moral purity without causing catastrophe. The consequentialist critique at the end relies on the misrepresentation of those escape hatches.
