  **The Case: The Levee and the Locked Model**

  **The Setup**
  It is 6:00 PM on a Tuesday in a flood-prone river valley. The decision-maker is the Duty Officer at the Regional Flood Agency. She must decide whether to order a mandatory evacuation of the downstream town (cost: $5M, political fallout high) or hold (cost: $0, risk of drowning). The proposition she is betting on is $A$: "The levee overtops tonight."

  She has been handed a printed document: the "Standard Project Flood" assessment, issued at 8:00 AM that morning. The document states the objective probability of overtopping is $0.01$ (1%). This number is not a guess; it is the output of the validated hydrological model using the best available data at 8:00 AM (soil saturation, forecast rainfall, river height). At 8:00 AM, given that information set, $0.01$ *was* the objective chance of $A$.

  The rival number comes from the Local Hydrology Desk. The Desk has access to real-time telemetry from upstream gauges that report every 15 minutes. The 8:00 AM model does not ingest this data; it is a static morning run. The Desk looks at the readings from 12:00 PM to 6:00 PM. The river is rising faster than the morning forecast predicted. Based on this trajectory, the Desk estimates $P(A) = 0.40$.

  The Officer cannot request a fresh model run; the system takes 12 hours to compile and validate. She must act now, using either the Official Number (0.01) or the Desk Number (0.40).

  **The Derivation**
  We are working with David Lewis's **Principal Principle (PP)**:
  $$Cr_t(A \mid Ch_t(A) = x \land E) = x$$
  *Provided $E$ is admissible.*

  Here, $Ch_t(A)$ refers to the objective chance at time $t$. The Official Number is $Ch_{8AM}(A) = 0.01$. The decision time is $t = 6PM$.

  *   **Policy 1 (Defer to Official Number):** The Officer treats the 8:00 AM number as the authoritative chance. She sets $Cr(A) = 0.01$.
      *   *Bet:* Do not evacuate. (Expected cost of drowning is low relative to evacuation cost).
  *   **Policy 2 (Defer to Desk):** The Officer incorporates the gauge data ($E_{gauge}$). She sets $Cr(A) = 0.40$.
      *   *Bet:* Evacuate. (Expected cost of drowning is high).

  **The Verdict:** The Desk wins. If the levee overtops, Policy 1 was negligent. Policy 2 saves lives.

  **Why the Desk Wins (Despite the "True Chance")**
  The Official Number *was* the true objective chance *at the moment it was issued*. However, the PP mandates deference to the chance *at the time of belief* ($6PM$), conditional on admissible evidence.

  The gauge data ($E_{gauge}$) is **inadmissible** relative to the 8:00 AM chance function. Why? Because the 8:00 AM chance function treats the river's behavior between 8:00 AM and 6:00 PM as a stochastic process. The gauge data is a *partial realization* of that process. In Lewis's terms, it is information about the "future" relative to the time of the chance issuance that reveals how the probabilities resolved, rather than just updating the probability of the setup.

  The Desk's edge is not "better modeling." It is **resolution via realization**. The Official Number has high *calibration* for 8:00 AM forecasts. The Desk Number has higher *resolution* for 6:00 PM decisions because it incorporates the "inadmissible" history of the specific run.

  **The Single Feature**
  The feature opening the gap is **Time-Locked Staleness**. The Official Number is a chance *indexed to a past information state* ($Ch_{8AM}$), but it is presented as a governing probability for a future decision ($t=6PM$).

  If you delete this feature—if the model updated in real-time, or if the Officer could wait for the 8:00 AM number to be re-issued—the gap collapses. The new number would incorporate the gauge data, the Official Number would become 0.40, and deference to the Official Number would be correct. The trap exists only because the institution freezes the chance number while the world continues to evolve.

  **The Strongest Reply**
  A defender of the Principal Principle will say: *"You have misapplied the principle. The PP tells you to defer to the **current** chance, $Ch_{6PM}(A)$. The 8:00 AM number is not $Ch_{6PM}(A)$. It is $Ch_{8AM}(A)$. Since you have evidence ($E_{gauge}$) that the chance has changed, you should not condition on $Ch_{8AM}(A)=0.01$. You should condition on $Ch_{6PM}(A)=0.40$. The PP survives."*

  **The Honest Verdict**
  The defender is technically correct. The careful version of the Principal Principle survives this case. It always tells you to defer to the *current* objective chance given *all* admissible evidence.

  However, this case burns the **bumper-sticker version** of the principle: *"Defer to the Institutional Number."* Institutions hand you numbers that are chances *at issuance*, but they often treat them as chances *at decision*. The case shows that "Objective Chance" is a time-sensitive commodity. An institutional probability is not a timeless truth; it is a snapshot. If you treat a snapshot as a live feed, you are not deferring to chance; you are deferring to history.

  For your column, the lesson is not that the Principal Principle is wrong. It is that **institutional numbers are rarely the current chance.** They are the chance *plus* an admissibility clause that says "Ignore everything that happened after we printed this." The Desk wins because it refuses to ignore the world.
