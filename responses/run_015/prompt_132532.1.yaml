answer: |-
  **MA Philosophy of History: Take-Home Seminar Assessment**

  **Topic:** Path Dependence & The Great Divergence
  **Time Allocation:** Designed for ~75 minutes of writing time
  **Word Limit:** 1,000 words max (but quality over quantity)

  ***

  ### Essay Question

  Standard accounts of path dependence often rely on technological examples (like QWERTY) that ignore deep historical structure. For this essay, distinguish between **diachronic lock-in** (where the specific sequence of events constrains later outcomes) and **synchronic overdetermination** (where structural conditions heavily constrain the present, but the endpoint could theoretically have been reached through alternate routes).

  Apply this distinction to the Great Divergence. Was Britain's industrial takeoff genuinely **diachronically path-dependent** (relying on contingent sequences like coal location or colonial access), or was China's institutional stability merely a **synchronic attractor** that Britain happened to avoid? In your verdict, address the counterfactual: If we rewound history, would Britain have industrialized anyway?

  ***

  ### Model Answer (Sample)

  To assess the Great Divergence through the lens of path dependence, we must first rigorously separate the mechanisms at play. **Diachronic lock-in** refers to causal chains where early contingent events restrict later possibilities; the sequence matters because alternative paths are closed off by previous choices. **Synchronic overdetermination**, conversely, suggests that while the present is heavily constrained by past conditions, the outcome is structurally determined rather than sequence-dependent. Here, multiple routes could lead to the same stability, or the stability itself prevents divergence regardless of the path taken.

  Applying this to Britain, the diachronic case is strong. Pomeranz and others argue that Britain's industrialization wasn't inevitable but relied on specific contingencies: the geographic luck of shallow coal near waterways, the specific outcome of the Glorious Revolution, and access to New World land. If the sequence changes—say, coal is deep underground or the Stuarts remain absolute—the cost of energy remains too high for steam innovation. This is classic lock-in: early advantages compound, creating increasing returns that lock the economy into an industrial trajectory. The counterfactual here is clear: without these specific sequential events, Britain remains agrarian. The path matters because the mechanism (industrial capitalism) requires specific precursors that were not guaranteed.

  However, viewing China through synchronic overdetermination offers a different explanation for the lack of divergence there. China's "high-level equilibrium trap" (Elvin) suggests that institutional stability acted as an attractor. The state's capacity to manage floods and maintain order created a synchronic constraint where labor was cheap and capital was unnecessary. This isn't necessarily diachronic lock-in in the sense that one specific event ruined China's chances; rather, the structural configuration at any given moment rewarded stability over innovation. Even if specific events changed (a different emperor, a minor rebellion), the synchronic pressures—population density, resource constraints, institutional incentives—would likely push the system back toward the same equilibrium. Thus, China's non-industrialization was overdetermined by structural conditions, not just a specific sequence of bad luck.

  The crucial philosophical move is deciding whether Britain's success was the inverse of China's stability. If Britain's takeoff was diachronically locked, then industrialization is fragile and contingent. If China's stability was synchronically overdetermined, then industrialization is the anomaly, not the rule. This impacts the counterfactual: "Would Britain have industrialized eventually?" If diachronic lock-in holds, the answer is likely no; rewind the tape, change the coal or the constitution, and the Industrial Revolution doesn't happen. If, however, we treat industrialization as a synchronic inevitability given enough time (a convergent evolution view), then Britain was just the first to hit the attractor.

  I argue the evidence favors diachronic lock-in for Britain. The speed and specificity of the takeoff suggest contingent triggers rather than gradual structural inevitability. China, meanwhile, represents synchronic overdetermination; its stability was robust against sequential changes. Therefore, history is not locked into a single outcome universally, but specific outcomes (like British industry) are locked in by their own sequences. The verdict is that Britain's path was contingent, while China's stability was structural. Rewinding history likely prevents British industrialization, proving that the modern world is not an inevitable destination but a result of specific, non-repeatable sequences.

  *(Word count: approx 720)*

  ***

  ### Marking Scheme

  **Goal:** I'm looking for conceptual precision and historical application, not just a summary of Pomeranz. Here's how I'm splitting the grades.

  **A Range (Excellent)**
  *   **Definitions:** Clearly distinguishes *diachronic* (sequence matters) from *synchronic* (structural constraint/alternate routes possible) without conflating them.
  *   **Application:** Correctly maps diachronic logic to Britain's contingencies (coal, institutions) and synchronic logic to China's structural stability (equilibrium trap).
  *   **Counterfactuals:** Explicitly engages the "rewind the tape" question. Doesn't just say "maybe," but ties the answer to the definitions used.
  *   **Verdict:** Defends a clear position (e.g., "Britain was contingent, China was structural") rather than sitting on the fence.
  *   **Nuance:** Acknowledges that synchronic constraint doesn't necessarily mean "inevitability" in the long run, just strong gravitational pull.

  **B Range (Good)**
  *   **Definitions:** Gets the gist of the two terms but might blur the edges slightly (e.g., treats synchronic as just "long-term diachronic").
  *   **Application:** Uses the Great Divergence examples well but might rely too heavily on description rather than philosophical mechanism.
  *   **Counterfactuals:** Mentions the counterfactual but doesn't fully integrate it into the argument.
  *   **Verdict:** Has a conclusion, but it's a bit hedged or less robustly defended.

  **C Range (Pass)**
  *   **Definitions:** Vague or incorrect definitions (e.g., treats both as just "history matters").
  *   **Application:** Generic discussion of Britain vs. China without using the specific conceptual toolkit provided in the prompt.
  *   **Counterfactuals:** Ignores the "would it happen anyway" question.
  *   **Verdict:** No clear stance taken.

  **Common Mistakes (Costs Marks)**
  *   **Conflating Terms:** Treating all historical stability as diachronic lock-in. (Lock-in requires a sequence closing off paths; stability can be synchronic without sequence).
  *   **Inevitability Trap:** Assuming synchronic constraint implies the outcome was *inevitable*. (The prompt defines it as "endpoint could've been reached through alternate routes"—don't miss this).
  *   **QWERTY Recycling:** Using technological examples instead of the required Great Divergence case study.
  *   **Descriptive Drift:** Writing a history essay instead of a philosophy of history essay (i.e., listing facts without analyzing the *modal status* of those facts).

  *Note: Watch out for typos in the model answer above—don't copy those!*
