answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Meridian Museum of Sculpture
  **FROM:** Conservation and Provenance Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Formal Opinion Regarding Ontological Status and Display of Object 1923-C

  **I. Executive Summary**

  The Conservation and Provenance Committee has convened to evaluate the status of Object 1923-C following the catastrophic flood damage of 2019 and subsequent reconstruction. The central question is whether the object retains its status as an original work of art or constitutes a derivative replica containing original relics. This determination hinges on the interpretation of the Institutional Charter, which grants original-work status if an object retains either (A) more than fifty percent of its original material substrate by mass, or (B) an unbroken chain of formative intentionality certified by the chief conservator. The Charter does not explicitly state whether these conditions are jointly necessary or separately sufficient.

  After rigorous deliberation, weighing the material facts against the philosophical principles governing artistic identity, the Committee recommends **Course One: Retain full original-status display with an appended conservation history.** We further recommend a specific implementation timeline to ensure transparency and address the concerns of the Artist's Estate.

  **II. Statement of the Problem**

  Object 1923-C is a life-sized clay figure formed in 1923. Following the 2019 flood, 55% of the substrate was reconstructed using a synthetic polymer engineered to match the original clay's isotopic signature and tensile properties. The remaining 45% consists of recovered original fragments. The Artist's Estate contends that the replacement of the majority of the constituent matter dissolves the object's identity, rendering it a replica. They demand relabeling or deaccessioning.

  The Committee must resolve the ambiguity in the Institutional Charter. If conditions A and B are jointly necessary, Object 1923-C fails (as it possesses only 45% original mass). If they are separately sufficient, the object passes (as the Chief Conservator has certified the unbroken chain of formative intentionality). This legalistic ambiguity mirrors a deeper ontological problem: does the identity of a sculpture reside in its physical atoms or in the continuity of its form and the intention sustaining it?

  **III. Philosophical Analysis: Material Constitution vs. Formative Intentionality**

  To resolve the Charter's ambiguity, we must apply a coherent theory of artistic identity to the specific physical reality of Object 1923-C.

  The "statue-and-clay" problem of material constitution suggests that an object is distinct from the matter that comprises it. While the clay constitutes the statue, the statue is defined by its form and the artistic act that brought it into being. In the case of Object 1923-C, the physical parts are now partly original clay and partly synthetic analogues. These analogues are materially indistinguishable from the original substrate yet spatiotemporally discontinuous; they did not exist in 1923, nor were they shaped by the artist's hand.

  However, artistic identity is not merely geological. If identity tracked material continuity exclusively, any restoration involving new material—even filling a microscopic crack—would technically create a new object. Such a standard is untenable for a museum dedicated to preservation. The identity of a sculpture tracks the causal history of its form. The 2019 reconstruction was not an act of creating a new form, but an act of sustaining the existing form against entropy. The synthetic polymer was not introduced to replace the art, but to serve as the vessel allowing the original artistic intention to remain visible.

  Therefore, the "unbroken chain of formative intentionality" (Charter Condition B) is the ontologically superior criterion. It captures the continuity of the work's existence through time. The conservation act, certified by the Chief Conservator, serves as the link in this chain, bridging the spatiotemporal discontinuity of the new materials. The synthetic substrate is functionally transparent; it exists solely to uphold the original formative intent. Consequently, the Charter's conditions should be interpreted as separately sufficient, with Intentionality taking precedence when Material Substrate is compromised by disaster rather than artistic revision.

  **IV. Consideration of the Estate's Position**

  The Committee gives serious and honest weight to the Artist's Estate's contention. Their argument relies on a robust materialist intuition: that replacing the majority of a sculpture's constituent matter dissolves its identity, regardless of preserved form. There is merit to this view. If one were to replace 100% of the clay, few would argue the original statue remains. The Estate posits that the threshold of identity loss is crossed when the original material becomes the minority component (i.e., <50%).

  This intuition acknowledges that the "trace of the artist's hand" is physically embedded in the original clay. In Object 1923-C, 55% of the surface and structure no longer bear that physical trace. To ignore this is to risk misleading the public about the nature of the artifact. The Estate's demand stems from a protective regard for the artist's legacy, ensuring that the label "Original" does not become detached from the physical reality of the artist's labor. If we prioritize Intentionality too heavily, we risk reducing the artwork to a mere pattern, detachable from any specific physical instantiation, which could theoretically justify unlimited replication so long as the form remains constant. This is a slippery slope the Museum must avoid.

  **V. Committee Resolution and Defense of Recommendation**

  While the Estate's materialist concern is valid, it is insufficient to warrant reclassification or deaccessioning in this specific context. The distinction lies in the *purpose* of the replacement. In a replica, new material is used to create a copy of a form. In Object 1923-C, the new material was used to *save* the form from destruction. The synthetic polymer is not a competing substance; it is a structural prosthesis engineered to be isotopically and tensilely identical to the original. It does not assert a new presence; it defers to the original fragments.

  To reclassify Object 1923-C as a "Reconstructed Derivative" (Course Two) would imply that the work's identity was broken in 2019. This contradicts the conservation ethic which views such intervention as life-saving, not life-replacing. To deaccession (Course Three) would be a destruction of cultural value based on a rigid materialism that ignores the work's survival.

  Therefore, we recommend **Course One**, but with a critical modification: the "Original" status is retained based on the continuity of intentionality, but the material discontinuity must be made explicitly visible to the viewer. This respects the Charter's "OR" clause (prioritizing Intentionality) while honoring the Estate's concern for transparency. The object is the original work, sustained through a prosthetic medium.

  **VI. Implementation Timeline**

  To execute this recommendation effectively, the Committee proposes the following twelve-month timeline:

  *   **Month 1 (Post-Board Approval):** Finalize label text. The primary placard shall read "Object 1923-C (Original Work, 1923)." A secondary, prominent panel titled "Conservation History" must detail the 2019 flood, the 55% synthetic reconstruction, and the philosophical rationale for retaining original status.
  *   **Month 2:** Formal correspondence with the Artist's Estate. Transmit this Committee Opinion and offer a private viewing with the Chief Conservator to demonstrate the integration of original fragments. Seek a memorandum of understanding regarding the label language to prevent public litigation.
  *   **Months 3–4:** Curatorial integration. Update digital catalog entries and audio guide scripts to reflect the dual nature of the substrate (45% original / 55% synthetic) without altering the accession status.
  *   **Month 6:** Public symposium. Host a panel discussion titled "Matter and Memory: The Ontology of Conservation," using Object 1923-C as the case study. This contextualizes the decision within broader museum ethics, inviting public engagement rather than concealing the reconstruction.
  *   **Month 12:** Review. The Conservation and Provenance Committee will reconvene to assess public reception and Estate relations. If significant reputational damage has occurred, the Board may revisit Course Two at that time.

  **VII. Conclusion**

  Object 1923-C stands at the boundary of matter and meaning. To declare it a replica is to privilege clay over concept. To declare it an original without qualification is to privilege concept over clay. The Committee advises that we retain its status as an original work, grounded in the unbroken chain of formative intentionality, while rigorously documenting the material rupture. This course upholds the Museum's charter, preserves the object's cultural value, and maintains intellectual honesty with our public.

  Respectfully submitted,

  **The Conservation and Provenance Committee**
  Meridian Museum of Sculpture
