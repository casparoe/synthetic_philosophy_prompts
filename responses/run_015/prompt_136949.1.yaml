answer: |-
  ### Desiderata for a Theory of Tragic Enjoyment

  **1. The Authentic Negativity Requirement**
  *The theory must posit that the sadness felt is genuinely unpleasant affect, not a disguised form of pleasure.*
  *   **Enjoying-vs-Despite:** If the sadness is not truly negative, we are merely enjoying a simulation of pain, which collapses the distinction between enjoying-the-sadness and enjoying-despite-it; the paradox disappears if the "pain" is actually sugar-coated.
  *   **Tragedy-vs-Comedy:** Comedy relies on the relief of tension; if the sadness isn't real tension, tragedy becomes merely comedy-with-extra-steps where the punchline is delayed rather than the affect being fundamentally opposed to satisfaction.
  *   **Stacked Affect:** This requires that content-grief registers as a net negative on the affective scale, even if craft-pleasure registers as a net positive; they must be distinct ledger entries, not a single blended emotion.

  **2. The Constitutive Integration Requirement**
  *The theory must explain why the negative affect is essential to the value of the experience, not merely a cost incurred to access beauty.*
  *   **Enjoying-vs-Despite:** If we enjoy the art *despite* the sadness, we are masochists tolerating a flaw; the theory must show we seek the sadness *because* it is sadness, making the negativity a feature rather than a bug.
  *   **Tragedy-vs-Comedy:** Comedy resolves dissonance to restore equilibrium; tragedy sustains dissonance as the equilibrium. If the sadness is removable without loss of value, the work is structurally comic, not tragic.
  *   **Stacked Affect:** Craft-pleasure cannot simply outweigh content-grief; the grief must amplify the craft-pleasure. The parallel lines must intersect to create a third value, not just sit side-by-side in a weighted average.

  **3. The Affective Coexistence Requirement**
  *The theory must allow pain and pleasure to occur simultaneously without one converting into the other.*
  *   **Enjoying-vs-Despite:** Conversion models (pain turns into pleasure) erase the sadness, resulting in enjoying-despite-it (where the "it" is no longer sadness); we need a model where the sadness persists *as* sadness while being enjoyed.
  *   **Tragedy-vs-Comedy:** Comedy eliminates the negative stimulus; tragic enjoyment requires the negative stimulus to remain active. If the pain converts to pleasure, the mechanism becomes indistinguishable from comic relief.
  *   **Stacked Affect:** This dictates that craft-pleasure and content-grief are processed in parallel channels that do not merge; the theory must explain how the brain sustains contradictory valences without resolving the cognitive dissonance.

  **4. The Formal Sufficiency Requirement**
  *The theory must account for sadness induced by structure (formal grief) without relying on fictional suffering or moral sympathy.*
  *   **Enjoying-vs-Despite:** If formal grief (e.g., a decaying chord) is bracketed as outside the paradox, the theory fails to explain why we seek out minor keys; we must be enjoying the structural sadness itself, not tolerating it to get to the resolution.
  *   **Tragedy-vs-Comedy:** Formal grief sustains tension through syntax rather than semantics; if a theory requires a victim to generate tragedy, it collapses formal art into narrative illustration, missing the pure structural tragedy of abstraction.
  *   **Stacked Affect:** In formal grief, craft and content are identical; the "craft" *is* the source of the "grief." The theory must explain how the same structural move generates negative affect and aesthetic value without splitting them into separate layers.

  ***

  ### Jointly Unsatisfiable Pairs
  **Authentic Negativity vs. Constitutive Integration:** These two create the hard core of the paradox. If sadness is genuinely negative (Req 1), standard rational choice theory suggests we should avoid it. If it is constitutive of value (Req 2), we should seek it. A theory that satisfies both must reject the premise that "negative affect" always implies "disvalue," or it must propose a complex psychology where negative affect is locally painful but globally valued without instrumental mediation. Most theories fail here by softening Negativity (claiming art-sadness isn't real pain) or hardening Integration (claiming we are irrational masochists).

  ### The Status of Formal Grief
  A theory **cannot** bracket formal grief as outside the paradox. If a theory relies on "distance from real suffering" or "sympathy for a character" to solve the paradox, it fails to explain why instrumental music or abstract cinema moves us. Formal grief proves that fictional suffering is not the necessary condition for tragic enjoyment; therefore, the mechanism must be affective and structural, not solely cognitive or moral.

  ***

  ### Theory Scores
  *   **Catharsis:** Fails **Constitutive Integration**. It treats sadness as a toxin to be purged; we enjoy the relief *after* the sadness, not the sadness itself.
  *   **Hume-Style Conversion:** Fails **Affective Coexistence**. It dissolves the pain into pleasure via eloquence or intensity, violating the requirement that sadness remain genuinely negative.
  *   **Control/Value Views:** Fails **Authentic Negativity**. They often argue that because we choose the art, the affect isn't truly negative, which dissolves the paradox by denying the premise of pain.

  Summary: The theory must explain how genuinely negative affect can be intrinsically valuable without ceasing to be negative or becoming merely instrumental.
