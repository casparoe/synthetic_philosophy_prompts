answer: |-
  Here is the strongest philosophical case for the NIMBY position that avoids financial self-interest, contractual fairness, and procedural democracy, followed by an honest critique of its limitations.

  ### The Argument: The Ethics of Place-Particularity

  **1. The Distinction Between Housing and Home**
  Housing is a commodity; a home is a node in a web of relationships. Public policy often treats housing as a fungible good: a bedroom in the Mission District is mathematically equivalent to a bedroom in Oakland for the purpose of shelter. But human flourishing relies on *relational goods* that are not fungible. These are the informal care networks, the "third places" where people are known by name, the specific routines (the walk to the store, the bench on the corner) that constitute a life.

  **2. The Asymmetry of Loss**
  There is a fundamental asymmetry between the interest of the potential resident and the current resident.
  *   **The Newcomer:** Needs *a* place to live that offers access to jobs, safety, and community. While they may prefer Neighborhood A, Neighborhood B often satisfies the same functional and social needs. Their interest is in *access to the city*.
  *   **The Incumbent:** Their interest is in the *continuation of a specific shared life*. If the physical and demographic texture of their block changes rapidly, the specific relational ecosystem they depend on dissolves. You cannot move the "neighbor who watches your kid" to a new high-rise. That good is location-locked.

  Therefore, the incumbent faces a loss of something *unique*, while the newcomer faces a friction of finding a *substitute*. In moral philosophy, preventing the destruction of a unique good often outweighs the provision of a substitutable one.

  **3. Stewardship Over Aggregation**
  Utilitarian planning argues for maximizing total welfare (e.g., "build more units to help more people"). But this treats the city as a resource allocation machine rather than a communal project. A neighborhood is a slow-grown ecosystem of trust. Rapid densification acts as a solvent on that trust.
  If we accept that deep social embedding is a prerequisite for human well-being, then the people currently embedded in that specific web have a stewardship right. They are not owners of the land, but they are custodians of the *social infrastructure*. To override them is to prioritize aggregate efficiency over the integrity of specific human relationships.

  **4. The Right to the *This* City**
  The "Right to the City" is often framed as a right to access. But for those already there, it is a right to *inhabit*. If the city changes so fast that the existing social fabric tears, the current residents are effectively displaced in place. They remain physically present but socially exiled.
  Because the newcomer's need can theoretically be met elsewhere (even if less conveniently), but the incumbent's need *cannot* be met elsewhere (because it is tied to *this* specific context), the incumbent's claim to veto changes that destroy that context is stronger, even if they are fewer in number. Specificity trumps generality.

  ***

  ### The Critique: An Honest Reckoning

  This argument is sophisticated and avoids the usual traps of property value protectionism. However, it crumbles under three specific pressures.

  **1. Is this just "I Got Mine" with nicer framing?**
  The argument relies on the moral weight of *existing* attachments. But why does *current* attachment trump *future* attachment?
  If the moral good is "deep social embedding," then the newcomer also wants that. By vetoing density, the incumbent isn't just protecting their own web; they are preventing the newcomer from ever weaving a new one in that location.
  The argument risks sanctifying the status quo. It essentially says: "The moral value of a community is determined by how long it has already existed." This creates a moral monopoly for the present generation. It turns the "right to inhabit" into a right to close the drawbridge once you have crossed it. If the "specific shared life" is the highest good, then no neighborhood can ever change, and the city becomes a museum where the only people allowed to form deep bonds are those who got there first.

  **2. The Non-Fungibility Trap (The Outsider's Attachment)**
  The argument assumes outsiders have generic needs ("somewhere affordable") while insiders have specific needs ("*this* block"). This is empirically false.
  *   **The Displaced:** Consider the person who grew up in the neighborhood but was priced out 10 years ago. They have a place-specific attachment (the school they attended, the family history) that is arguably *stronger* than the incumbent who moved in 5 years ago. Yet, this NIMBY logic grants veto power to the new incumbent over the returning exile.
  *   **The Diaspora:** For many communities (e.g., Black families in San Francisco, Latino families in East LA), the neighborhood is not just a "shared life" but a historical anchor against systemic erasure.
  *   **The Commuter:** A worker might have a specific attachment to a neighborhood because it's where their support network of childcare or elderly care exists, even if they don't live there *yet*.

  If "non-fungibility" is the metric, the outsider often has a claim just as specific as the insider. By restricting the veto to *current* residents, this argument arbitrarily draws a circle around the present moment and ignores the temporal depth of attachment. It privileges the person who managed to secure the lease *now* over the person who had a life there *then*.

  **3. The Problem of "Character" and Exclusion**
  This is the fatal flaw. The argument defends the "continuation of a specific shared life." But we must ask: *How was that life produced?*
  In many American cities, the "stable, low-density social fabric" NIMBYs defend was engineered through state violence. Redlining, racial covenants, and exclusionary zoning created the scarcity that allowed these deep bonds to form for *some* by excluding *others*.
  *   If the "specific shared life" relies on the absence of certain groups (because their presence was historically barred), then protecting that life is protecting the legacy of exclusion.
  *   If the "social infrastructure" (the good schools, the safe parks) exists only because tax bases were artificially protected by restricting supply, then the "stewardship" argument is a claim to the proceeds of past theft.

  To grant current residents veto power based on the sanctity of their community is to ratify the boundaries of that community as morally legitimate. But if those boundaries were drawn by redlining, the "place-particularity" argument becomes a shield for segregation. It says: "We have built a life on this foundation, and you cannot ask us to dismantle the foundation even if the foundation was built on exclusion."

  ### Conclusion

  The "Place-Particularity" argument is the strongest NIMBY case because it centers human relationships rather than bank accounts. It correctly identifies that rapid physical change destroys social capital.

  However, it fails because it treats the *current* distribution of people as morally neutral. It ignores that the "unique social ecosystem" incumbents protect is often a luxury good made possible by restricting others. Furthermore, it fails to account for the place-specific attachments of those *locked out*—the diaspora, the displaced, and the workers who sustain the city but cannot live in it.

  If the "right to the city" is not a right to *this* city, then the incumbent's claim is strong. But if the "right to the city" implies a right to *become* part of a specific city, then the incumbent's veto power is a tool of caste, preserving the privilege of the present against the aspirations of the future. The moral weight of "specific attachment" cannot override the moral weight of "basic access" when the specific attachment was purchased with the currency of exclusion.
