answer: |-
  ### Part 1: Critique of the Threefold Distinction

  Your panel's informal categories (**Live**, **Blocked**, **Borrowed**) are operationally useful but metaphysically unstable. Here is the precise mapping and the critique you requested.

  1.  **Live Omission:** *Definition:* A breach of a normative duty where the agent had the physical and systemic capacity to act, and acting would have prevented the harm.
      *   *Verdict:* **Causal.**
      *   *Critique:* This is the only category that constitutes a genuine "cause" in the counterfactual sense. It aligns with the literature on *normative dependence* (Hart & Honoré).

  2.  **Blocked Omission:** *Definition:* A breach of duty where the agent was physically or systemically prevented from acting by a state of affairs *not* attributable to a prior human omission (e.g., equipment failure due to wear, natural disaster, sudden incapacity).
      *   *Verdict:* **Not Causal.**
      *   *Critique:* This cuts along the right joint. It distinguishes "could not" from "did not." It correctly identifies that an omission cannot be a cause if the action was impossible regardless of the agent's will.

  3.  **Borrowed Omission:** *Definition:* A breach of duty where the agent did not act because a prior omission by *another* party removed the means, information, or authority to act.
      *   *Verdict:* **Not Causal (for this agent); Causal (for the prior agent).**
      *   *Critique:* This category is the most fragile. Metaphysically, a "Borrowed Omission" collapses into a **Blocked Omission**. The "block" is simply human-made rather than mechanical. However, for *accountability*, the distinction is vital. If you treat "Borrowed" as "Blocked," you exonerate the prior actor. If you treat it as "Live," you punish the downstream actor for an upstream failure.
      *   *Recommendation:* Keep the term for the report to signal *where* the causal chain was severed, but classify it as **Not Causal** for the downstream agent in the mandatory system. The "Cause" tag belongs to the upstream omitters.

  ---

  ### Part 2: The Omission Causality Protocol (OCP)

  **Purpose:** To determine if a specific failure to act is a *cause* of harm, distinct from a background condition or a non-causal breach.
  **Time:** 45 Minutes.
  **Requirement:** All panelists must agree on the answer to each question before proceeding. If agreement cannot be reached, the verdict defaults to "Not a Cause" (benefit of the doubt).

  #### Step 0: The Normative Anchor (5 Minutes)
  *Question:* **Was there a specific, active expectation that this specific agent would perform this specific act at this specific time?**
  *   *Sufficient Answer:* A written protocol, a verbal handover, or a recognized standard of care that assigns this task to this role *in this context*.
  *   *Stop Condition:* If **No**, or if the panel is arguing about what the staffing/norm *should* have been rather than what it *was*.
      *   **Verdict:** NOT A CAUSE.
      *   **Hand-off:** This is a **Policy/Resourcing Dispute**. Refer to Governance/HR. Do not record as a clinical cause.

  #### Step 1: The Counterfactual Switch (10 Minutes)
  *Question:* **If the agent had performed the act exactly as required, would the specific harm have been avoided or significantly mitigated?**
  *   *Sufficient Answer:* A clear chain of events showing the intervention works. (e.g., "If the drug was given, the arrest stops.")
  *   *Stop Condition:* If **No**. (e.g., "The alarm was muted, so a calibrated sensor wouldn't have sounded," or "The patient was already unsalvageable.")
      *   **Verdict:** NOT A CAUSE. (This is a *Background Condition*).
      *   *Note:* Do not argue about whether it *should* have worked. Argue only about whether it *would* have worked.

  #### Step 2: The Ability Check (10 Minutes)
  *Question:* **At the moment the act was required, did the agent have the physical capacity, authority, and tools to perform it?**
  *   *Sufficient Answer:* Yes, they were present, awake, authorized, and the equipment was available.
  *   *Stop Condition:* If **No**. Proceed to Step 3 to classify why.
      *   *Note:* "Too busy" is **not** a lack of ability; it is a prioritization choice (Live Omission). "Pager broken" **is** a lack of ability.

  #### Step 3: The Source of Blockage (10 Minutes)
  *(Only if Step 2 was No)*
  *Question:* **What prevented the action? Was it a mechanical/environmental barrier, or a prior human omission?**
  *   *Sufficient Answer:*
      *   *Mechanical/Environmental:* (e.g., Power cut, broken device, sudden illness). -> **Blocked Omission**.
      *   *Prior Human Omission:* (e.g., Someone else didn't charge the pager, didn't unmute the alarm, didn't grant access). -> **Borrowed Omission**.
  *   *Verdict:* **NOT A CAUSE (for this agent).**
  *   *Action:* If "Prior Human Omission," open a new OCP file for the *upstream* agent.

  #### Step 4: The Redundancy Check (10 Minutes)
  *(Only if Step 1, 2, 3 were Yes/Cleared)*
  *Question:* **Was there an independent safety backup that failed, which would have caught this error regardless of this agent's action?**
  *   *Sufficient Answer:* Evidence of a separate system (e.g., independent alarm, second checker) that failed independently of this agent.
  *   *Stop Condition:* If **Yes**, and the backup failure was the *primary* driver of harm.
      *   **Verdict:** **CONTRIBUTED TO** (Local Action Plan). The omission is real, but the harm was primarily caused by the failure of the independent safety net.
  *   *If No:*
      *   **Verdict:** **CAUSED**. (Regulatory/Insurance referral).

  ---

  ### Part 3: Application to Cases

  #### Case 1: Night Nurse & Dead Pager
  *   **Step 0 (Norm):** Duty to escalate deteriorating signs? **Yes.**
  *   **Step 1 (Counterfactual):** If Nurse escalated, would harm be avoided?
      *   *Analysis:* Escalation requires the Doctor to receive the page. Pager battery was dead. Doctor does not come. Harm occurs.
      *   *Answer:* **No.** (The chain of efficacy is broken).
  *   **Verdict:** **NOT A CAUSE.**
  *   *Panel Friction:* The panel will want to say the Nurse "contributed" by not finding an alternative phone.
  *   *Protocol Ruling:* Unless there is a norm requiring alternative contact methods when pagers fail, the Counterfactual Switch fails. The Nurse's act (paging) does not connect to the outcome (Doctor arriving).
  *   *Follow-up:* Open OCP for the Doctor (Failure to maintain equipment/availability).

  #### Case 2: Maintenance & Muted Alarm
  *   **Step 0 (Norm):** Duty to calibrate sensor? **Yes.**
  *   **Step 1 (Counterfactual):** If calibrated, would harm be avoided?
      *   *Analysis:* Sensor would read correctly. But the high-level alarm was muted by a different contractor. The tank overflows regardless of the sensor reading because the alarm doesn't sound.
      *   *Answer:* **No.**
  *   **Verdict:** **NOT A CAUSE.**
  *   *Panel Friction:* Maintenance skipped a rule. It feels like a cause.
  *   *Protocol Ruling:* It is a breach, but not a *cause* of the overflow. The muted alarm pre-empted the utility of the calibration.
  *   *Follow-up:* Open OCP for the Contractor who muted the alarm (Step 3 Borrowed/Step 1 Causal).

  #### Case 3: Consultant & Registrar (The "Unliked" Verdict)
  *   **Step 0 (Norm):** Duty to review delegated scan? **Yes** (Ultimate responsibility).
  *   **Step 1 (Counterfactual):** If Consultant reviewed, would harm be avoided?
      *   *Analysis:* Prompt states "counterfactually nothing would have changed." This implies the Registrar's omission (failing to act on the scan) locked in the outcome, or the Consultant would have made the same error.
      *   *Answer:* **No.** (The harm was pre-empted by the Registrar's failure or the ambiguity of the scan).
  *   **Verdict:** **NOT A CAUSE.** (Likely "Background Condition").
  *   *Panel Friction:* High. The panel will want to hold the Consultant causally responsible for failure of supervision.
  *   *Protocol Ruling:* If the Registrar's omission was "Live" (they saw it, could act, didn't), the causal opportunity was exhausted at that level. The Consultant's omission is a failure of *governance*, not a cause of *this specific harm* under counterfactual testing.
  *   *Classification:* **Background Condition.** (Triggers no regulatory referral).
  *   *Note:* This protects the system from double-counting causation. The Registrar is the "Live Omission." The Consultant is the "Safety Net." If the Safety Net is only triggered by the Primary failing to flag, and the Primary didn't flag, the Net never deploys.

  ---

  ### Part 4: Limitations of the Procedure

  You asked what this procedure cannot do. It is critical you understand these boundaries to defend the panel's findings.

  **1. It cannot prevent "Prevention Smuggling."**
  *   *The Risk:* Panelists will answer Step 1 (Counterfactual) based on what *should* happen in a perfect system, not what *would* happen in this one. They will say, "If the Nurse had escalated, the Doctor *should* have come," ignoring the dead battery.
  *   *The Fix:* The Chair must enforce the "Physical Reality" rule. You are simulating the past, not designing the future. If the battery was dead in reality, it is dead in the counterfactual simulation unless you also change the Doctor's behavior (which moves the cause to the Doctor).

  **2. It cannot resolve Disputed Norms (Step 0 Failure).**
  *   *The Risk:* The most contentious incidents are often about whether a norm *existed*. (e.g., "Were we owed 1:4 staffing or 1:6?"). If the norm is under dispute, the OCP halts.
  *   *The Fix:* You must explicitly categorize these as **Systemic/Policy Incidents**, not **Clinical Causation Incidents**.
  *   *Wording:* Do not write "The understaffing caused the harm." Write "The harm occurred in a context where staffing norms were undefined." This prevents the regulatory trigger ("Caused") while flagging the risk ("Background").
  *   *Why:* Causation requires a baseline. If the baseline is the thing being fought over, you cannot scientifically establish deviation.

  **3. It creates "Blameless Causation."**
  *   *The Risk:* The procedure may identify a "Cause" that was unavoidable (e.g., a "Live Omission" by a doctor who collapsed from an undiagnosed condition).
  *   *The Fix:* The OCP determines *causal attribution*, not *culpability*. You may have to record "Caused" for insurance purposes while simultaneously recording "No Disciplinary Action" for HR. Do not conflate the two. The reporting system asks "What happened?", not "Who is naughty?"

  **4. It struggles with "Fragile" Backups (Step 4).**
  *   *The Risk:* Determining if a backup is "independent." (e.g., Two nurses checking a drug. If both are tired, is the second check independent?)
  *   *The Fix:* Default to **Contributed To**. If independence is contested, the causal link is too fragile for "Caused." This lowers the regulatory risk but ensures a local action plan is created.

  ### Summary for the Panel
  This procedure prioritizes **reproducibility** over **moral satisfaction**. It will sometimes exonerate agents the panel feels "should" have done more (Case 3). It will sometimes label a breach as "Not a Cause" (Case 2). This is the cost of rigor. If you wish to trigger a regulatory referral, the chain must be unbroken: **Norm -> Ability -> Counterfactual Impact -> No Pre-emption.** If any link breaks, the finding drops to "Contributed" or "Background."
