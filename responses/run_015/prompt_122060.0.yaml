answer: |-
  This is a sophisticated dissection of a common philosophical slogan. Your friend is invoking a principle of **emergence** to block a **reductionist** (methodological individualist) explanation. Your taxonomy correctly identifies that the slogan is ambiguous between linguistic, epistemic, and ontological claims.

  Here is the breakdown of your three readings, plus a fourth one that is likely doing the heavy lifting in her resistance, formatted as a numbered list you can present to her.

  ### 1. Predicate Novelty (Conceptual Emergence)
  *   **The Claim:** The group possesses predicates (e.g., "divided," "hesitant," "risk-averse") that cannot grammatically or logically apply to a single individual.
  *   **Classification:** **Mere Truism.** It is a fact about language and logic, not metaphysics. A single person cannot be "deadlocked," but two people can deadlock each other.
  *   **Impact on Individualism:** **Compatible.** This does not rule out individualist explanation. Methodological individualism does not require that group-level descriptions be *identical* to individual-level descriptions, only that they *supervene* on them. Saying "the committee is divided" is shorthand for "Member A voted X and Member B voted Y." This reading validates the utility of group-level talk but concedes that the *truthmaker* for that talk lies in the individuals.
  *   **Verdict:** This reading saves the slogan from falsehood but renders it useless for resisting your argument.

  ### 2. Derivational Complexity (Epistemic Emergence)
  *   **The Claim:** Even if the outcome is fully determined by the members' preferences and the rules, the interaction effects are so complex that the outcome cannot be computed or predicted from the micro-level story.
  *   **Classification:** **Substantive Empirical Claim.** This is a claim about computational irreducibility or chaos in social systems.
  *   **Impact on Individualism:** **Makes it hard, not impossible.** You specified "in principle" in your argument. This reading concedes that the explanation holds *in principle* (ontologically) but fails *in practice* (epistemically). If your friend argues that a central bank decision *cannot in principle* be explained by individuals, this reading contradicts her. If she retreats to "we can't model it," she has conceded your theoretical point but raised a pragmatic objection.
  *   **Verdict:** This reading turns a metaphysical disagreement into a modeling challenge. It does not support the strong holism she implied.

  ### 3. Boundary Conditions (Institutional Constraints)
  *   **The Claim:** The individual-level story underdetermines the outcome without adding facts about the group structure (agenda setting, voting rules, tenure) that exist outside any single member's psychology.
  *   **Classification:** **Mere Truism (with a caveat).** Standard methodological individualism (e.g., in game theory or institutional economics) explicitly includes rules and constraints as part of the explanation. Preferences + Constraints = Action.
  *   **Impact on Individualism:** **Compatible.** This reading only rules out a *psychologistic* individualism (explaining things *only* by feelings/beliefs). It does not rule out a *structural* individualism (explaining things by individuals acting within institutional constraints). Unless she claims the voting rules exist in a platonic realm independent of human agreement/history, these rules are themselves reducible to the past and present behaviors/beliefs of individuals (including past committee members).
  *   **Verdict:** This is a correction to a straw-man version of individualism, not a refutation of the actual doctrine.

  ### 4. Ontological Emergence (Strong Holism)
  *   **The Claim:** (The missing reading) The committee possesses causal powers or a utility function that is not constituted by, nor reducible to, the members and rules. The Central Bank is an agent *over and above* the people in the room.
  *   **Classification:** **Substantive Metaphysical Claim (Likely False).** This posits a "group mind" or social substance. In social science, this is often accused of reification (treating a concept as a concrete thing).
  *   **Impact on Individualism:** **Rules it out.** This is the only reading that actually supports her resistance to your "in principle" claim. It asserts that $Group \neq f(Individuals + Rules)$.
  *   **Verdict:** This is the only reading that does the work she wants, but it is the hardest to defend without appealing to mysticism or functionalist sociology that economics generally rejects.

  ***

  ### Conclusion: What is she actually saying?

  When people use "the whole is more than the sum of its parts" to end an argument in social science, they are usually trading on an **equivocation between Reading 1 and Reading 4.**

  They rely on the obvious truth of **Reading 1** (yes, groups have unique properties like "majority rule") to smuggle in the substantive claim of **Reading 4** (therefore, you cannot explain the group solely by looking at the members). They use the linguistic novelty of group predicates to imply an ontological novelty of group agents.

  **Would I defend this reading?**
  No. I would not defend the reading that rules out your individualist explanation.

  In the context of a Central Bank committee, **Methodological Individualism** (augmented by institutional constraints, per Reading 3) is the superior framework. Central Bank decisions are the result of voting, persuasion, and bargaining among humans with specific incentives (reputation, reappointment, ideology) operating under specific rules (median voter, chair veto, consensus norms).

  To claim the Bank has preferences *independent* of these mechanisms is to invite magical thinking. It obscures accountability (who decided?) and hinders mechanism design (how do we change the rules to change the outcome?). Your friend's slogan is a useful heuristic for acknowledging complexity (Reading 2), but as a metaphysical barrier to explanation (Reading 4), it is false. You should press her to specify whether she believes the Central Bank would have made the *same* decision if the individuals were different but the "group spirit" remained the same. If she says no, she is an individualist; if she says yes, she owes you a theory of group souls.
