  4.  **Identifying Tensions (The "Jointly Unsatisfiable" Pairs):**
      *   *Tension A:* Strong Closure vs. Distinct Mental Causation. (The classic Kim problem).
      *   *Tension B:* Synchronic Supervenience vs. Diachronic Efficacy. If the mental is just a snapshot of the physical, how does it drive the *next* physical state without overdetermination?
      *   *Tension C:* Neural Specificity vs. Mental Generalization. Neuroscience finds variability (degeneracy); psychology finds stability.

  5.  **Evaluating the Positions:**
      *   *Non-reductive Physicalism (NRP):* Tries to keep all, usually sacrifices distinctness or relies on "realization." Struggles with exclusion.
      *   *Emergentist Dualism:* Keeps distinctness, risks violating closure/conservation.
