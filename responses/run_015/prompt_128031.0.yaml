  2.  **Deconstruct the Core Problem:**
      *   The "Causal Exclusion Argument" (Kim) is the elephant in the room. If physics is causally closed, and the mental supervenes on the physical, the mental seems to have no work to do.
      *   The user wants to focus on *processes over time* and *feedback*. This suggests a shift from static supervenience to dynamic realization or mechanistic explanation.
      *   Key tension: If the neural does the work, what does the mental do? If the mental does the work, does it violate physics?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Causal Relevance.* We need to save the intuition that beliefs/desires cause actions.
          *   *Case:* Raising a hand to vote.
          *   *Distinction:* Token efficacy.
      *   *Desideratum 2: Physical Consistency.* Can't violate conservation laws.
          *   *Case:* Neural stimulation studies.
          *   *Constraint:* Closure of Physics.
      *   *Desideratum 3: Temporal Dynamics/Feedback.* This is the user's specific interest. Mental states aren't instantaneous; they regulate neural activity over time.
          *   *Case:* Cognitive reappraisal of emotion (prefrontal cortex down-regulating amygdala).
          *   *Distinction:* Diachronic causation.
      *   *Desideratum 4: Explanatory Autonomy.* Psychology shouldn't just be noisy physics.
