answer: |-
  **Project Title:** The Preservation Assumption: Intertheoretic Continuity and the Viability of Structural Realism

  **Project Summary**
  Structural realism (SR) is currently the most viable position in the scientific realism debate, offering a middle path between the No Miracles Argument and the Pessimistic Meta-Induction. Its core claim is that while specific ontological posits (ether, caloric) are discarded during theory change, the mathematical structure of the theory is preserved. However, the notion of "preservation" itself remains a black box. This project argues that SR relies on an undefended "Preservation Assumption." I will demonstrate that without a precise account of what preservation entails, SR collapses into triviality (mere formal similarity) or requires a robust theory of intertheoretic correspondence it does not possess. I will propose an alternative account based on *explanatory continuity* rather than formal isomorphism, arguing that structure is preserved only insofar as it retains its functional role in generating successful predictions. The outcome will be a rigorous delineation of the conditions under which structural realism is tenable, shifting the burden of proof from metaphysics to the philosophy of scientific explanation.

  **Intellectual Merit and Research Questions**
  The central problem driving this research is the ambiguity of continuity across theory change. The "disastrous defeat" argument suggests that because the equations of Fresnel survive into Maxwell, we should be realists about the structure. But what does "survive" mean?

  *Research Question 1: The Preservation Assumption.*
  I will formally state the Preservation Assumption: *For structural realism to succeed, there must be a non-trivial relation R such that Structure S1 in Theory T1 bears R to Structure S2 in Theory T2, and R warrants realist commitment.* I will analyze the literature to show that both Epistemic Structural Realism (ESR) and Ontic Structural Realism (OSR) invoke this assumption without defining R. ESR treats preservation as an epistemic constraint (we can only know the relations), while OSR treats it as an ontological fact (the world is structure). I will argue that both fail to specify the criteria for identity across the change. If R is merely "mathematical similarity," the argument is trivial, as discarded theories always share some formal features with successors. If R is "reference to the same entity," it begs the question against the pessimist.

  *Research Question 2: Explanatory Continuity.*
  To rescue SR from triviality, I will argue for a functionalist account of preservation. Structure is not preserved because it looks the same algebraically, but because it *does the same work*. The preserved elements are those that carry the explanatory load in the successor theory. This relocates the debate: the issue is not whether the structure matches reality, but whether the *explanatory role* of the structure is invariant. I will test this against standard case studies (e.g., the transition from Newtonian to Relativistic gravity). This account answers the deflationary objection by ruling out "accidental" formal similarities that play no role in the successor's explanatory framework.

  **Methodology and Timeline**
  This is a conceptual analysis project grounded in the history of physics. The work is divided into four phases over twelve months.

  *Months 1–3: Formalizing the Gap.*
  I will construct a formal typology of "preservation" claims found in the current SR literature. I will categorize existing defenses of SR by their implicit definition of intertheoretic relations. The deliverable for this phase is a working paper demonstrating the undefended nature of the Preservation Assumption in both ESR and OSR frameworks.

  *Months 4–6: Case Study Analysis.*
  I will apply this typology to three canonical theory changes: Fresnel to Maxwell, Newton to Einstein, and Caloric to Thermodynamics. The goal is to isolate instances where formal structure survived but explanatory role shifted, and vice versa. This historical grounding prevents the analysis from becoming purely semantic.

  *Months 7–9: Developing the Explanatory Account.*
  I will draft the core argument for Explanatory Continuity. This involves defining "explanatory work" in a way that is not theory-relative. I will engage with literature on scientific modeling and idealization to distinguish between "essential" structural components and "auxiliary" mathematical scaffolding.

  *Months 10–12: Synthesis and Dissemination.*
  I will integrate the historical analysis with the theoretical account to produce the final manuscript. I will present drafts at two departmental colloquia and submit the final paper to a top-tier journal in philosophy of science.

  **Scope and Risk Management**
  The scope of this project is strictly limited to the coherence of the preservation claim within structural realism. It does not aim to solve the general problem of reference or to provide a full metaphysics of structure.

  *Success Conditions:*
  The project succeeds if it produces a definitive statement of the Preservation Assumption and demonstrates that any viable structural realism must incorporate a theory of explanatory continuity. Even if the conclusion is that current formulations of SR are untenable, this is a successful philosophical outcome as it clarifies the dialectic.

  *Failure Conditions:*
  The project would fail only if the notion of "explanatory work" proves to be as vague or theory-relative as the notion of "structure" it is meant to replace. If I cannot distinguish explanatory role from formal shape without appealing to a contested notion of truth, the proposal collapses into the same ambiguity it critiques. In this scenario, the output would be a negative result: a proof that structural realism cannot be decoupled from a broader, unresolved theory of scientific explanation. I will mitigate this risk by focusing on *model-based* explanation, which is better defined in the contemporary literature than general scientific explanation.

  **Broader Impacts**
  By clarifying the conditions of theory change, this project contributes to broader discussions in rationality and scientific progress. If structural preservation is tied to explanatory function, it suggests that scientific progress is not merely accumulation of truth, but the refinement of explanatory tools. This has implications for how we understand current theory changes in high-energy physics and biology, where ontological commitments are often uncertain but structural models remain robust.
