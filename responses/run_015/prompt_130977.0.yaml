reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Argument:**
      *   **Premise 1:** RL agents use reward signals (specifically Temporal-Difference or TD errors).
      *   **Premise 2:** Human dopamine spikes function similarly to TD errors in the brain (a well-supported neuroscientific theory).
      *   **Proposal:** If we calibrate the RL agent's TD errors to match the *magnitude* of human dopamine spikes, the signal becomes "affective valence" (feeling good/bad) rather than just mathematical feedback.
