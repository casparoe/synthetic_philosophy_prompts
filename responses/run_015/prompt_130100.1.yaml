      *Key Differentiator:* Type B fires *at home*. It is not purely workplace. Type A is purely workplace/evaluation.
      *Therefore:* Type A = Social/Workplace problem (Skin analog). Type B = Internal Dysfunction (Fatigue/Diabetes analog).
