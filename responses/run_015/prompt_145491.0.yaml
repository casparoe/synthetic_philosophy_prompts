      *   *Sentence 5:* "This avoids presentism, because future events still exist in a potential mode, lacking only actualized being."
          *   *Assessment:* Acceptable. It addresses the "without collapsing into presentism" constraint.
      *   *Sentence 6:* "But the view is unstable: since past events are also no longer present actualities, the asymmetry forces us to deny the law of excluded middle for present statements about the past as well, which Aristotle clearly never intended."
