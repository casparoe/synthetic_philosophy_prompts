answer: |-
  This is a sophisticated request that cuts to the epistemic core of cliodynamics. You are asking for a falsification framework for a theory that claims to be nomothetic (law-seeking) but operates on data that is notoriously sparse and noisy.

  Here is an assessment of your proposed defeaters, ranked by how decisively they undermine the claim that SDT (Structural-Demographic Theory) is a *predictive science*, alongside an analysis of what a committed cliodynamicist would concede versus defend.

  ### Part I: Ranking the Defeaters (Fatal to Awkward)

  I have ranked these by **epistemic severity** (how much damage it does to the claim of being a predictive science) and included a **Concession Probability** (how likely a proponent is to admit the defeat).

  #### 1. The Matched-Noise Benchmark (Red Noise Test)
  *   **Severity:** **Fatal.**
  *   **The Logic:** If you process autocorrelated red noise (which has no cyclical structure) through the same detrending and smoothing pipeline used on historical data, and it produces "cycles" of similar periodicity and amplitude to the historical data, then the cycles are artifacts of the preprocessing, not features of the history. This implies the signal-to-noise ratio is effectively zero.
  *   **Why it's Fatal:** It destroys the empirical basis of the oscillation claim. If the cycle is a mathematical artifact of the filter, the "phase" prediction is meaningless.
  *   **Cliodynamicist Concession:** **Low.** Proponents often argue that the filtering is *theoretically* justified (e.g., removing long-term growth trends to isolate endogenous dynamics), whereas red noise is theoretically agnostic. They would argue the test is "unfair" because it ignores the structural reasons for the filter. However, a rigorous modeler *should* concede that if the signal does not significantly exceed the red noise baseline, the cycle is not statistically distinguishable from randomness.

  #### 2. The Cheap Rival Heuristic (The "Two-Generation Clock")
  *   **Severity:** **Fatal to Mechanism / Severe to Prediction.**
  *   **The Logic:** SDT claims instability is driven by specific variables (elite overproduction, immiseration, fiscal stress). If a model that simply says "Instability occurs 50 years after the last Instability" performs as well as or better than the full SDT model, then the structural variables are epiphenomenal. It suggests the "cycle" is a memory effect or a cultural rhythm, not a structural-demographic one.
  *   **Why it's Fatal:** It severs the link between the *mechanism* (demography/elites) and the *outcome* (instability). It reduces SDT to a superstition about timing.
  *   **Cliodynamicist Concession:** **Medium.** They would argue that the "two-generation" rhythm is *derived* from the structural dynamics (it takes that long for elites to overproduce), so the heuristic is just a reduced-form version of their theory. However, if the heuristic works in cases where the structural variables *do not* align (e.g., low elite overproduction but still a crisis at the 50-year mark), they must concede the mechanism is wrong.

  #### 3. Repeated Out-of-Sample Failure (Pre-registered Windows)
  *   **Severity:** **Fatal.**
  *   **The Logic:** This is the standard scientific test. You fit on Polity A, predict Polity B. Specifically, your 2010 Nature letter example is the current live test. The prediction was for "growing instability" in the 2020s.
  *   **Why it's Fatal:** If the window passes without the predicted *type* of instability (state disintegration, civil war, not just polarization), the predictive claim fails.
  *   **Cliodynamicist Concession:** **High.** This is the ground they chose to stand on. Turchin explicitly staked credibility on the 2010 prediction.
  *   **The Nuance:** The definition of "instability" is the escape valve. If the US has high polarization but no state collapse by 2030, is it a miss? A committed cliodynamicist should concede a miss if the *disintegrative* phase (the core claim) does not materialize within the pre-registered window. If they redefine "instability" to include mere electoral volatility, they are moving the goalposts.

  #### 4. The Proxy-Shopping Constraint (Single Proxy Pre-commitment)
  *   **Severity:** **Severe.**
  *   **The Logic:** If you can choose *post-hoc* whether "elite overproduction" is measured by law degrees, wealthy households, or political candidates, you have high degrees of freedom. Pre-committing to one proxy per polity removes the ability to tune the model to the data.
  *   **Why it's Severe:** It suggests the theory is robust only when allowed to "look at the answer key" before choosing the variables.
  *   **Cliodynamicist Concession:** **Medium-High.** Serious practitioners already acknowledge data limitations. They would argue that in many polities, only *one* proxy exists, so the choice isn't free. However, in data-rich cases (like the US or Rome), failing a pre-commitment test would be highly embarrassing and suggest p-hacking.

  #### 5. The Exogenous Shock Cap (Escape Hatch Limit)
  *   **Severity:** **Awkward to Severe.**
  *   **The Logic:** No model survives contact with a meteor strike. But if 50% of the "misses" are blamed on plagues/invasions, the model explains nothing.
  *   **Why it's Awkward:** It admits the model is brittle. However, SDT explicitly models *resilience*. A state under high structural stress should be *more* vulnerable to shocks.
  *   **Cliodynamicist Concession:** **High.** They already admit this is a weakness. A reasonable cap (e.g., "exogenous shocks can explain max 20% of variance in timing") is something they should accept. If the model needs a shock excuse for every miss, it is not predictive.

  ---

  ### Part II: Addressing the Tautology and Small-N Worries

  #### 1. The Tautology Worry ("All states break eventually")
  You are correct that predicting *eventual* breakdown is trivial. The theoretical content lies entirely in the **hazard rate**.
  *   **The Test:** Does the probability of breakdown increase significantly during the predicted "disintegrative phase" compared to the "integrative phase"?
  *   **The Baseline:** If the baseline probability of state collapse in any given century is 10%, and the SDT model predicts a 15% probability during the stress peak, the model is weak. If it predicts 60%, it is strong.
  *   **The Verdict:** Much of the theory's apparent success vanishes if you subtract the baseline. Historical states *do* tend to cluster crises (war begets war). A rigorous test must show that SDT variables predict the *onset* of the cluster better than a simple "time since last war" variable. Currently, the theory struggles here; the correlation between "elite overproduction" and "crisis onset" is often strong, but the *temporal precision* is often within the error bars of the dating.

  #### 2. The Unfalsifiability / Small-N Problem
  *   **Is it a defect?** Yes. In physics, $N=1$ (the universe) is acceptable only if the theory makes precise, novel predictions that are verified. In history, $N \approx 30$ (well-coded polities) is too small for complex multivariate regression without severe overfitting risks.
  *   **Is it excusable?** Only temporarily. A "young science" argument holds for 20 years, not 50. Cliodynamics has been formalized for two decades.
  *   **How to treat the credence:** You should treat SDT as a **strong heuristic**, not a **law**.
      *   *Law:* "If $X$, then $Y$ within time $T$." (Falsifiable, high confidence).
      *   *Heuristic:* "If $X$, the system is fragile and prone to $Y$." (Robust, lower predictive precision).
      *   Currently, the evidence supports the Heuristic view. The "Secular Cycle" timing is too noisy to be a Law. The mechanisms (elite competition, fiscal stress) are historically plausible and often observable, but the *oscillatory mathematics* may be imposing more order than exists.

  ### Part III: The Decisive Test (Your Preference)

  You stated you would be most moved by a **pre-registered prediction about a case not yet coded.**

  Here is the specific test structure that would be decisive:

  **The "Blind Polity" Test**
  1.  **Selection:** Choose a polity with good data that has *not* been used to calibrate the current SDT parameters (e.g., a specific period in Chinese history not in the current Seshat database, or a specific pre-Columbian state).
  2.  **Pre-commitment:** Before looking at the instability record:
      *   Fix the window width (e.g., $\pm 15$ years).
      *   Fix the proxies (e.g., "Real wages" for immiseration, "Number of advanced degrees" for elite overproduction).
      *   Fix the threshold for "Instability" (e.g., "Civil war with >1,000 battle deaths").
  3.  **Prediction:** The model outputs a specific decade for the onset of instability.
  4.  **The Damning Result:**
      *   **False Positive:** The model predicts a crisis in a period of documented stability. (Suggests the model sees ghosts).
      *   **False Negative:** The model predicts stability during a documented crisis. (Suggests the model misses the mechanism).
      *   **Timing Miss:** The crisis occurs, but outside the pre-registered window (e.g., predicted 1640–1660, occurred 1710). **This is the most likely failure mode.** If the timing is off by >50 years consistently, the "oscillatory" claim is false, even if the "stress leads to crisis" claim is true.

  ### Summary Advice for Your Argument

  Your historian friend is right about the **noise** and the **excuses**, but wrong to imply **no structure** exists.
  *   **Concede to her:** The dating is noisy, the proxies are imperfect, and the "exogenous shock" escape hatch has been used too liberally in the past. The claim of "physics-like precision" is currently unjustified.
  *   **Hold your ground:** The structural mechanisms (elite overproduction, fiscal stress) are causally plausible and observable. The theory is not *merely* descriptive; it has made risky predictions (2010 Nature letter).
  *   **The Pivot:** Shift your claim from "SDT is a predictive science of *timing*" to "SDT is a predictive science of *fragility*."
      *   *Timing* requires the oscillatory math to be perfect (which the Red Noise test threatens).
      *   *Fragility* only requires the variables to correlate with vulnerability (which is robust).

  If you claim it predicts *when*, you are vulnerable to the "quarter-century" test. If you claim it predicts *risk*, you are on firmer ground, but you lose the "Secular Cycle" glamour. Given your desire to stress-test the position: **The oscillatory timing claim is the weak point.** The structural fragility claim is the strong point. A committed cliodynamicist should concede that the *periodicity* is less rigid than the *dynamics*, and that treating it as a clockwork mechanism is a distortion of the actual models.

  **Final Verdict:** If the Red Noise test shows the cycles are artifacts, or if the "Two-Generation Clock" beats the structural model, the theory collapses into a descriptive taxonomy. If the Out-of-Sample prediction (US/Europe 2020s) fails to show *disintegrative* violence (not just polarization) by 2030, the "predictive science" claim is severely damaged, regardless of the mechanistic plausibility.
