prompt: |-
  Me and my roommate got into about a three-hour argument last night after we'd both had a couple of drinks, and I need someone to settle it, because I think one of us moved a goalpost and I can't tell which. He's doing a PhD in something ML-adjacent and insists on restating everything in terms of "counterfactual policies," which honestly made it worse. We started on Frankfurt cases — you know, the setup where Black is monitoring the voter's brain and is only going to step in if the voter is about to vote the wrong way, so the voter votes the way he does on his own and can't actually do anything else — and we basically agreed that if those cases work, the principle of alternative possibilities is finished. Fine. But then he said that therefore the whole free will debate is basically settled and determinism is off the hook, and that's where I stopped following him. My sense was that those cases are meant to be neutral about determinism, and that an incompatibilist could just say something like "ok, PAP is false, what I really care about is that the actual causal history of my action not be deterministic." He said that's just PAP smuggled back in under a different name and that it's question-begging, and I couldn't quite articulate why that felt off to me. He also kept repeating that Frankfurt himself was a compatibilist, as if that settled who the cases belong to.

  Then he got excited and tried to "patch" the case, because he'd read that the standard version has a hole in it: Black is supposed to know in advance what the voter is about to do, and if the voter's deliberation has any genuine randomness in it, there may be no prior sign for Black to key off. So he proposed what he called the "lazy Black" case: Black doesn't monitor anything, he just flips a quantum coin at 11:59 and zaps the voter into voting Democratic if it comes up heads and does nothing if it come up tails. Coin comes up tails, voter votes Democratic on his own, no intervention ever happens. He thinks this fixes everything — no mind-reading, no determinism smuggled into the setup, so the standard objection that the case just assumes what it's trying to prove can't even get started, and now we really do have responsibility with no alternative possibilities at all.

  So: is he right that his lazy-Black version closes the last gap, and is he right that killing PAP means compatibilism wins by default? And separately — this is the bit I actually care about — he said the only thing left for incompatibilists to point at in these cases is the difference between "I did it on my own" and "I was zapped into it," and that this is way too thin to count as the kind of alternative possibility that ever mattered. Is that a fair description of what's actually at stake, or have we both misremembered what the argument is about? I took one undergrad philosophy course like six years ago, so please don't assume I still know the jargon, and if there's a distinction I'm collapsing I'd rather you say so than answer the question I asked.
