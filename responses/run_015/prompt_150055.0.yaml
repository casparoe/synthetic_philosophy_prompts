  I'm trying to explain Davidson's radical interpretation to my roommate—he's a phyics major who thinks philosophy of language is just semeantics—over coffee in about 20 minutes. Don't explain the concept to me; plan how I should teach it. What idea has to be in place first so he doesn't confuse it with ordinary translation, and what's the one carrying example—I'd rather skip the usual gavagai/rabbit case since he knows biology and might get stuck on taxonomy—instead maybe a speaker who uses color-words consistently but only under strange lighting, forcing the interpreter to choose between them being wrong about colors and them having a different theory about illumination? What misconceptions will he bring—probably that Davidson is saying meaning is just whatever we agree on or that interpretation is impossible without a dictionary—and exactly where in the sequence should I head each one off? Give me one quick check at the end to see if he understands that interpretation starts with charity and rationality rather than matching definitions, and tell me what I should openly leave out at this level. Please write this in continuous prose only, like an email or letter, with no headings, bullet points, bold text, or tables.
