answer: |-
  Dear friend, since you only have twenty minutes and your roommate is coming at this with a physics mindset, you need to frame radical interpretation not as a linguistic puzzle but as a problem of theory construction from raw data. The very first idea you must lock into place before you mention Davidson is the distinction between ordinary translation and radical interpretation. You need to make sure he understands that ordinary translation assumes we already share a language or have a bilingual dictionary to map one set of sounds to another, whereas radical interpretation assumes we start with zero shared conventions and no prior knowledge of the speaker's beliefs or meanings. Tell him to think of it like trying to derive the laws of physics from observational data without knowing if your instruments are calibrated correctly or if the phenomena you are observing are even physical objects. If he thinks this is just semantics or decoding, he will miss the point that Davidson is asking how meaning is possible at all without prior agreement.

  Once you have established that starting condition, you should deploy the color and lighting example immediately to ground the abstract constraint in something concrete. Describe a scenario where a speaker consistently calls a green object red, but only when they are both standing under a strong red light. Explain that the interpreter faces a choice: either the speaker is systematically wrong about the color of objects, or the speaker has a different theory about how illumination affects color appearance. You should tell him to use this to show that we cannot determine meaning independently of belief. If we assume the speaker means what we mean by red, we must attribute to them a false belief about the object. If we assume they are rational and correct about the object, we must attribute to them a different meaning for the word red. This forces your roommate to see that assigning meaning requires making assumptions about the speaker's rationality and their view of the world.

  You need to be very strategic about when you correct his inevitable misconceptions. He will likely argue that interpretation is impossible without a dictionary, and you should head this off right at the beginning when you define the project. Tell him explicitly that the whole point of radical interpretation is to explain how a dictionary comes to exist in the first place, so assuming one would be circular. Later, when you are working through the color example, he will probably suggest that meaning is just whatever we agree on or that we compromise to find a middle ground. You must interrupt this thought immediately by clarifying that the principle of charity is not about being nice or reaching a social consensus. Explain that charity is a methodological constraint similar to assuming consistency in physical laws; we maximize agreement not to be polite, but because disagreement is only intelligible against a massive background of agreement. If you wait until the end to correct this, he will walk away thinking Davidson is a relativist.

  To verify that he has actually grasped the core shift in perspective, you should end the conversation with one quick check that targets the relationship between truth and meaning. Ask him if a speaker can be interpreted as holding a false belief without the interpreter assuming the speaker is irrational. If he says yes, ask him what allows us to identify that belief as false rather than just a different meaning. You are looking for him to say that we assume the speaker is generally rational and shares our view of the world, which allows us to isolate specific errors. If he answers that we just look up the definition or that truth is subjective, you know he missed the point about charity and rationality being the foundation of interpretation rather than matching definitions.

  Finally, to keep this within twenty minutes, you need to be ruthless about what you leave out. Do not attempt to explain Tarski's convention T or the technical details of truth conditions, as this will bog him down in logic syntax that distracts from the philosophical insight. You should also skip the deep dive into holism and the argument that beliefs come in a web rather than individually, as this is a consequence of the view rather than the entry point. Avoid discussing the indeterminacy of translation in depth or comparing it to Quine's gavagai, since you are already using the lighting example to make that point more accessibly. Stick to the triad of meaning, belief, and evidence, and let the technical machinery remain in the background so he walks away with the intuitive grasp of why we must assume others are like us to understand them at all.
