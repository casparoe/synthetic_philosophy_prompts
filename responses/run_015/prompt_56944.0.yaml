      *   Better source domain? Yes.
      *   American English? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't just defend KNA blindly. The user asked to audit the *analogy*. The analogy might successfully show that *rational belief* is the *minimum*, but it fails to show that *knowledge* isn't the *ideal* or *normative standard*. The SL argues KNA is *too strict*. I need to show why the betting analogy fails to prove it's too strict. The key is that in betting, losing is part of the game. In assertion, being wrong is a *failure* of the act, not just a loss of stake.

  Let's refine the "Better Source Domain." Williamson uses the "Key" analogy. But "Vouching" is more intuitive for norms. If I vouch for someone, I need to *know* them, not just rationally believe they're good. If they turn out bad, my vouch was defective, not just unlucky. This aligns with KNA.

