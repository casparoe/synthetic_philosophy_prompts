          6.  Tone/Style: American English, direct ("tell me straight"), philosophical but accessible.

  2.  **Deconstruct the "Assertion is Betting" Analogy:**
      *   *The SL's Move:* This is a classic pragmatic argument. If assertion is a speech act with practical consequences like betting, and betting doesn't require knowledge, why should assertion?
      *   *The User's Intuition:* Something feels off. The social/epistemic stakes of assertion seem different from gambling.
      *   *Key Philosophical Context:* This touches on Williamson (KNA), Weiner, Lackey, and the "Lottery Paradox" territory. The betting analogy is often used to support *probabilistic* norms over *knowledge* norms.

  3.  **Drafting the Correspondence Table:**
      *   *Assertion:* Speaker asserts $p$.
      *   *Betting:* Bettor wagers on $p$.
      *   *Stake:* Reputation/Credibility (Assertion) vs. Money (Betting).
      *   *Odds:* Speaker's Confidence/Justification (Assertion) vs. Bookmaker Odds (Betting).
      *   *House/Bookmaker:* The Audience/Community (Assertion) vs. Casino/Bookie (Betting).
