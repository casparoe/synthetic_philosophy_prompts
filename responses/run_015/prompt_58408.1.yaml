      *   (9) Generalization: Consequentialism fails for all threshold/buffered collective harm cases.

  3.  **Identify the Weak Point:**
      *   The argument is a classic formulation of the "Problem of Imperceptible Differences" or "Threshold Cases" in consequentialism.
      *   *Option A: Reject (1).* Move to Rule Consequentialism or Expectation Consequentialism.
      *   *Option B: Reject (2)/(3).* Argue that there *are* micro-effects (market signals, price elasticity). This is empirically shaky for the specific "20 chickens" stipulation but robust for real markets.
