      *   Rejecting (4) allows us to say: "This specific purchase didn't trigger harm, but it's still wrong because it's a gamble with negative expected value." This is effectively Expected Consequentialism but framed as a rejection of token immunity.
      *   *Let's look at (7).* "If two acts are alike in all features accessible to... agents, a merely positional difference... cannot render one permissible and the other impermissible."
      *   If we stick with Actual Consequentialism, (7) forces us to say *both* are permissible (to avoid moral luck). If we move to Expected Consequentialism, (7) is satisfied because the *expected* value is the same for both. So (7) isn't rejected, it's satisfied by changing the metric.
      *   So the root is (1). (1) defines wrongness by *actual* outcome.

      *Plan:*
      1.  Identify Premise (1) as the target. (Actual Consequentialism).
