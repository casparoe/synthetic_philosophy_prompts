  There is no single, universally established term in the social sciences or game theory that perfectly isolates this specific phenomenon across all contexts (bidding, labor, conflict) while explicitly excluding sunk-cost and attrition mechanics. The field fragments this behavior across several disciplines, each using a different lens.

  In behavioral economics, the bidding scenario you describe is often attributed to **"Competitive Arousal"** (Ku, Malhotra, & Murnighan, 2005), which describes the physiological and psychological state of rivalry that decouples bidding from intrinsic value. In negotiation theory and sociology, the labor standoff is typically analyzed through **"Face-Negotiation Theory"** (Ting-Toomey) or simply **"Face-Saving,"** where the cost is incurred to prevent social humiliation. In evolutionary game theory, the utility function you describe (caring about the *difference* in payoffs rather than the absolute amount) is modeled as **"Spite"** or **"Inequity Aversion."**

  However, none of these terms fully captures the *strategic, relational escalation* you are identifying as a unified class. "Competitive Arousal" is a psychological state, not a strategic configuration. "Face-Saving" is defensive, whereas your examples include offensive denial ("not letting the other buyer have it"). "Spite" implies a desire to harm, whereas your cases imply a desire for *relative standing* or *deterrence*, which can be rational in a reputational market. "War of Attrition" describes the *structure* of the game (who lasts longer) but assumes the prize has intrinsic value, whereas in your cases, the prize's value is *created* by the rivalry.

  Because the existing terminology is siloed, I propose the term **"Positional Escalation."**

  ### Definition: Positional Escalation
  **Positional Escalation** is a conflict dynamic in which parties increase their investment or demands not to secure an absolute gain, but to secure a *relative* advantage or prevent a relative loss against a specific opponent. The utility function is driven by the *position* of the actors vis-à-vis one another (e.g., dominance, prestige, refusal to submit) rather than the intrinsic value of the resource at stake.

  ### Boundaries and Distinctions
  1.  **Vs. Escalation of Commitment / Sunk Cost:** In standard escalation, parties stay because they have *already* spent too much to quit (backward-looking). In Positional Escalation, parties stay because quitting *now* alters their future standing relative to the opponent (forward-looking reputational stake). The sunk cost may be trivial; the social cost of "blinking" is high.
  2.  **Vs. War of Attrition:** A War of Attrition is a contest of endurance over a prize of fixed value. In Positional Escalation, the value of the prize is fluid and derived from the opponent's desire for it. If the opponent withdrew, the winner's valuation might instantly collapse.
  3.  **Vs. Spite:** Spite involves incurring a cost to reduce another's payoff, often irrationally or emotionally. Positional Escalation can be instrumentally rational: paying a premium to establish a reputation for toughness that pays off in future interactions. It is about *rank*, not just harm.
  4.  **Vs. Face-Saving:** Face-saving is typically defensive (avoiding humiliation). Positional Escalation includes offensive maneuvers (denying the opponent a win) and applies to material contexts (bidding) where "face" is less commonly used as a descriptor.

  ### Confidence Assessment
  *   **Claim: No single established term exists.** (Confidence: 90%). The literature is fragmented between economics ("spite/positional goods"), psychology ("arousal"), and sociology ("face"). No single term dominates the intersection.
  *   **Claim: Distinct from Sunk Cost.** (Confidence: 95%). The mechanism is demonstrably different (relative utility vs. justification of past investment).
  *   **Claim: "Positional Escalation" is a valid coinage.** (Confidence: 85%). It aligns with the economic concept of "Positional Goods" (Hirsch, 1976) but applies it to conflict dynamics. It is not currently a standard term of art, which allows for precise definition.
  *   **Claim: Distinct from Spite.** (Confidence: 80%). This is the most nuanced boundary. Some game theorists would classify any relative-utility preference as "spite." I distinguish them based on the *reputational/strategic* intent vs. pure payoff reduction.

  ### Point of Least Certainty
  I am least sure about the extent to which **"Competitive Arousal"** is already functioning as the de facto umbrella term in behavioral economics. While it is well-cited in auction theory, it is less commonly applied to labor standoffs or geopolitical standoffs, which limits its utility as a universal term for the phenomenon you described.

  \answer{Positional Escalation}
