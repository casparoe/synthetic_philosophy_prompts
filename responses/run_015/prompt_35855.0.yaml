      **The Epistemology of the Box: Aggregation vs. Consensus in Jury Design**

      The criminal jury stands as a peculiar epistemic engine. On its face, it resembles a mechanism designed for collective truth-tracking: twelve individuals, screened for competence, rendering a verdict on a binary question of guilt. This structure invites analysis through the Condorcet Jury Theorem (CJT), which posits that if voters are independent and individually competent (probability > 0.5), majority rule converges on correctness as group size increases. However, the actual legal institution deviates sharply from Condorcetian assumptions. It mandates unanimity rather than majority, encourages deliberation rather than independence, and privileges acquittal over conviction. Reconstructing the implicit theory of collective belief presupposed by the jury requires navigating the tension between statistical aggregation and reasoned convergence.

      The jury design strictly presupposes a Condorcetian logic only in its upstream architecture. The selection of twelve jurors, rather than one judge, leverages the law of large numbers to mitigate individual error. Voir dire functions to raise the average competence of the pool above the 0.5 threshold required by the theorem, removing those biased or incapable of tracking evidence. Here, the institution treats jurors as independent signal detectors whose aggregate reliability exceeds individual reliability. However, this commitment is superficial. Once selected, jurors are instructed to deliberate, a process that deliberately destroys the independence condition central to CJT. By sharing arguments and doubts, jurors correlate their errors; if the group is misled by a charismatic foreperson or a shared cognitive bias, the theorem's guarantee of convergence collapses. Thus, the design does not presuppose that independence is the primary engine of knowledge. Instead, it presupposes that *scrutinized* belief is superior to *aggregated* belief.

      This shift from aggregation to convergence is most visible in the unanimity rule. Under CJT, majority rule is optimal for truth-tracking. Unanimity, by contrast, grants a single skeptic veto power, drastically increasing the probability of a hung jury or acquittal even when the majority suggests guilt. This feature cannot be justified by pure epistemology. If the goal were solely maximizing verdict accuracy, a supermajority or simple majority would suffice. The unanimity rule implies an epistemology of reasonable doubt where the cost of a false positive (convicting the innocent) vastly outweighs the cost of a false negative (acquitting the guilty). This is not an epistemic asymmetry but a normative one. The CJT treats errors symmetrically; the jury treats them asymmetrically. The institution presupposes that collective belief is not merely about tracking truth, but about licensing state violence only when uncertainty is minimized to a moral certainty. The "hang" is not a failure of aggregation but a designed safety valve, acknowledging that when reasoned convergence fails, the normative default must be liberty.

      Consequently, the jury presupposes a hybrid theory of collective judgment. It utilizes Condorcetian mechanics for group size and screening to ensure a baseline of competence, but it relies on a deliberative model for the verdict itself. These pictures are partially incompatible: deliberation reduces the statistical independence required for the theorem to hold, yet the institution accepts this trade-off. It sacrifices the mathematical certainty of aggregation for the legitimacy of consensus. The implicit theory is that a verdict is not true because twelve people voted for it, but because twelve people were persuaded by the same evidence. This distinguishes the jury from a poll; it is a forum of reason, not a tally of preferences.

      What would a jury built on a purified Condorcet view look like? It would abolish deliberation to preserve independence. Jurors would view evidence separately, cast secret ballots, and a simple majority would decide. The group size might be increased beyond twelve to further maximize convergence probability. Such a system would likely be more efficient and, assuming average competence > 0.5, statistically more accurate in identifying factual guilt. However, exchanging the deliberating unanimity jury for this purified model would incur profound losses. First, it would eliminate the protective asymmetry. A majority rule system treats false convictions and false acquittals as equal errors, violating the presumption of innocence. Second, it would lose the epistemic benefit of interpersonal correction. Deliberation allows jurors to correct individual misunderstandings of law or fact that voting alone cannot fix. Finally, it would sacrifice legitimacy. A verdict imposed by a slim majority over a dissenting minority lacks the moral force required for criminal punishment.

      Ultimately, the jury does not presuppose that collective belief is merely the sum of independent probabilities. It presupposes that collective belief is a normative achievement reached through discourse under constraints of high uncertainty. The asymmetry between conviction and acquittal arises not from the theorem, which cannot carry it, but from the political morality surrounding the trial. The jury is not a truth machine optimized by Condorcetian mathematics; it is a liberty machine optimized by deliberative safeguards. To reduce it to pure aggregation is to misunderstand its function: it exists not only to find the truth, but to ensure that when the state condemns, it does so with the consent of the governed, represented by the unanimous agreement of the peers.

