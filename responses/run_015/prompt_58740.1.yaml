answer: |-
  The hum of the freezer in the garage was the only sound in the house. It was 3:17 AM, the witching hour of the two-week wait.

  David lay in bed, staring at the ceiling fan cutting shadows through the dark. Beside him, Elena slept with the heavy, trusting breath of someone who had done her part and was now leaving the rest to biology. But David couldn't sleep. He was doing the math.

  He was thinking about the race.

  He knew the statistics. He knew that in a single ejaculation, there were millions of contenders. He knew that if he had sneezed ten years ago, or if traffic had made him five minutes later to the date night that conceived the embryo now thawing inside his wife, the entire genetic deck would have been reshuffled.

  But the obsession wasn't about the past. It was about Embryo B.

  They had two. Embryo A was currently a microscopic cluster of cells trying to burrow into Elena's lining. Embryo B was in a canister of liquid nitrogen at the clinic, labeled with a barcode and a grade: 4BB.

  David slipped out of bed, careful not to wake her. He went downstairs and opened his laptop, the blue light harsh against his face. He pulled up the patient portal. He looked at the photo of Embryo A. Then he looked at the file for Embryo B.

  *Is he my son?* David thought. *Or is he a ghost?*

  It was the question that had been eating him alive since transfer day. If Embryo A didn't take, they would thaw Embryo B next month. But if Embryo A *did* take, Embryo B might stay frozen forever. Or it might be donated. Or discarded.

  David felt a sharp pang of grief, sudden and irrational. He was mourning a child that had never breathed.

  He went to the kitchen and poured a glass of water. He leaned against the counter, thinking about the biology of it. If they had waited one month to start the IVF cycle, Elena would have released a different egg. A completely different genetic code. If David had produced the sample on a different Tuesday, a different sperm would have won the race.

  The resulting child would have different eyes, a different temperament, maybe a different gender. It would be a stranger.

  So, was Embryo B a person?

  If he was a person, then choosing Embryo A felt like a choice that condemned Embryo B to non-existence. It felt like playing God with a coin toss where the loser vanished from reality. But if Embryo B *wasn't* a person, just a potentiality, why did it feel like he was leaving a brother or sister behind in the ice?

  "Dave?"

  He jumped. Elena was standing in the doorway, wrapped in a robe. Her hair was messy, her eyes soft with sleep.

  "Couldn't sleep," he said, closing the laptop lid quickly.

  "Thinking about the numbers again?" She walked over and put her hand on his back. Her skin was warm.

  "Thinking about the other one," he admitted. His voice cracked.

  Elena sighed, not with annoyance, but with a weary understanding. They had talked about this, in circles, for weeks. "The 4BB?"

  "I keep thinking about the timing, El. If I had walked into the clinic bathroom thirty seconds later... different swimmer. Different kid. If you had ovulated a day later... different egg. Different kid." David turned to face her, his eyes wet. "So who is the one in the tank? Is he our kid? Did we lose him? Or is he just... science?"

  Elena leaned against the counter next to him. She looked at the closed laptop. "You're asking if he counts as a loss."

  "I feel like I'm grieving him," David said. "And I haven't even met the one in you yet. I feel guilty. Like I picked a favorite before the game started."

  Elena took his hand. "Do you remember what the embryologist said? She said these aren't babies in jars, Dave. They're seeds."

  "Seeds don't have barcodes."

  "No," she agreed. "But look at it this way. You're worried that if the timing changed, the person would change. That's true. But that's true for every person who has ever lived. If our parents had waited a month, we wouldn't be us. We'd be ghosts to each other."

  She squeezed his hand. "But we *are* us. And right now, Embryo A is the one who got the ticket. Embryo B... Embryo B is a possibility. He's a road on the map we didn't drive down."

  "But does he count?" David pressed. "If we never use him, did he exist?"

  Elena thought for a moment, looking out the window at the dark yard. "I think... I think he exists as hope. He's the backup plan. He's the 'just in case.' He's not a lost child, Dave. He's a kept promise. He's proof that we might get to do this again."

  David looked down at his wife's hand in his. He thought about the microscopic fragility of it all. How much of identity was just luck. A specific sperm meeting a specific egg at a specific second. It was terrifying. It meant that every person was a miracle of probability, a one-in-a-trillion accident that managed to wake up and ask *why?*

  "If we have a daughter," David whispered, "and we leave the boy in the tank... is he her brother?"

  "Maybe," Elena said. "Maybe he's just the reason she got to be born. Maybe his only job was to make sure we had a choice."

  David let out a long breath he felt like he'd been holding since the retrieval day. The grief didn't vanish completely. The existential itch was still there, the wonder at the narrow gate of existence. He knew he would always wonder about the 4BB. He would always wonder about the genetic lottery.

  But looking at Elena, he realized the question wasn't about the one in the ice. It was about the one in the room.

  "Okay," David said. He closed the laptop and pushed it away. "Okay."

  "Come back to bed," Elena said softly. "The wait is hard. But you're not doing it alone."

  David followed her up the stairs. As he lay back down, the hum of the freezer in the garage seemed quieter, or maybe he just stopped listening for it. He placed his hand on Elena's stomach. It was flat, unchanged.

  He didn't know who was in there. He didn't know who was in the tank. He only knew that out of millions of possibilities, out of a universe of different eggs and different sperm and different months and different years, he was here, and she was here, and they were waiting for *someone*.

  And for now, that had to be enough.
