      *   Ensure the prompt's specific question ("counts as his kid he lost or just someone who never existed") is addressed directly in the dialogue or internal monologue.

  **(Self-Correction Note):** Make sure I don't invalidate the user's feeling. It's a common existential dread in IVF. The story should validate the feeling while offering a path through it.

  9.  **Final Review against constraints:**
