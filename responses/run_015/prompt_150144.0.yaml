prompt: |-
  Hi — I'm on the four-person methods committee at a mid-sized psychology journal (we're the people who get handed the awkward cases after normal peer review), and this has suddenly gotten personal: the multi-lab replication of a finding from my own department — the one our textbook chapter, our undergrad lecture and two grant proposals are built on — came back with an effect estimate of basically zero and a confidence interval that rules out anything close to the original effect size. Our editor-in-chief wants a written recommendation from us by the end of the month, and the committee is split between people who think we're obliged to say something public and people who think a single replication never settles anything and that we'd be trashing a decent paper on the basis of one study. I'm the one who has to draft it, and I definitly don't want to write something that a quantitatively literate reader will laugh at.

  What I need is a procedure, not an essay. Realistically: we meet for 90 minutes a month, only one of us is comfortable with anything past t-tests and regression, and whatever we write has to be readable by the original authors (who get a right of reply) and defensible to the EIC, who is a substantive researcher and pushes back hard on anything that sounds like statistical jargon. So please give me an ordered list of questions we can run on any replication that lands on our desk, with what counts as a sufficient answer to each one, where the procedure stops and says "no verdict, leave the literature as it is", where it just kills the case outright, and where it has to hand the decision to a person because the remaining question is one of values rather than facts. A few things we keep going in circles on and that I'd want the procedure to actually settle: (1) my stats person insists that comparing the replication's estimate to the original's confidence interval is the wrong test and that we should compare it to a prediction interval that inflates for the original's own sampling error, but everyone else in the field seems to use the CI comparison — is that distinction worth carrying into a simplified procedure, and which way does it cut? (2) whether a non-significant replication that was powered only to detect, say, 80% of the original effect counts as evidence of absence or merely absence of evidence, and whether framing the same case in Bayesian terms (something like "how much should this move a reasonable prior?") would change the answer we give; (3) the hidden-moderator escape hatch — how much drift in population, materials or procedure has to pile up before we say the replication isn't testing the same hypothesis, and how we stop that becoming a rubber stamp where every failed replication gets blamed on a moderator nobody pre-registered; (4) how the fact that the original estimate was probably inflated by publication bias and analytic flexibility should enter — does it change what we conclude about the replication, or only about the original? And (5) our chair's proposed shortcut, which we've started calling the "two-and-a-half rule": treat a replication as decisive against the original if its sample is at least 2.5x the original's and its estimate comes in under a quarter of the original effect. I'd like to know whether that's a defensible compression of the real reasoning or a trap that will misfire on us.

  Then please run the finished procedure on three cases so I can see it work. Case one: the multi-lab replication of my department's finding — pre-registered, about 2,000 participants across a dozen labs, original authors consulted on the materials, estimate essentially zero, interval excluding anything near the original. Case two: a replication done by the original authors themselves, 4x the sample, effect at about 60% of the original size, p around .02. Case three should be one where the honest answer is one our committee won't like: there's a flashy study from our own back catalogue (n = 40, from about fifteen years ago, still cited in the popular press) that most of us privately think is noise, and a rushed replication of it came back non-significant — but the replication was only powered to detect an effect 1.5x the original, so I suspect the procedure is going to tell us we can't say the thing we actually want to say. Finally, be explicit about what the procedure cannot do: which of our real questions it's simply silent on (whether to attach an expression of concern, whether to change our editorial policy on publishing replications at all, whether a "failed" replication ever licenses saying the effect is zero rather than small or context-bound). If it helps, assume we're willing to be told that the right output is a two-page note that mostly says "we can't tell" — I just need to be able to defend why.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** Member of a 4-person methods committee at a mid-sized psychology journal.
      *   **Situation:** A multi-lab replication of a finding from their *own* department (high stakes personally/professionally) failed (effect $\approx$ 0, CI excludes original).
      *   **Task:** Create a *procedure* (ordered list of questions/criteria) for evaluating replications, not an essay.
      *   **Constraints:**
          *   Committee meets 90 mins/month.
          *   Limited statistical expertise (only one comfortable beyond t-tests/regression).
          *   Audience: Original authors (right of reply), EIC (substantive researcher, hates jargon), readers (quantitatively literate).
          *   Must handle specific sticking points: Prediction Intervals vs. CIs, Power/Effect Size interpretation, Moderator claims ("hidden variables"), Publication Bias/P-hacking influence, and the "2.5 Rule" shortcut.
          *   Must run the procedure on 3 specific cases (including the user's personal conflict case).
          *   Must explicitly state limitations (what the procedure *cannot* decide).
      *   **Tone:** Professional, direct, pragmatic, statistically sound but accessible.

  2.  **Deconstruct the Sticking Points (The "Why" behind the Procedure):**

      *   *(1) CI vs. Prediction Interval (PI):* Comparing a replication mean to the original CI is statistically invalid (the "replication crisis" statistical error). The original CI accounts for uncertainty in the *original* mean, not the variance of *future* means. A PI is wider. If the replication falls outside the original CI but inside the PI, it's surprising but not statistically inconsistent. *Decision:* The procedure must use PIs (or a simplified proxy) to avoid false positives in declaring failure. However, given the committee's skill level, a simplified "Small Telescopes" approach (power to detect 33% of original) or a Bayes Factor approach might be more robust than calculating PIs manually. Let's stick to the user's specific question: Is the distinction worth carrying? Yes. It prevents declaring failure too easily. But for a simplified procedure, checking if the replication CI excludes the *original point estimate* is a good middle ground, or using the "Small Telescopes" logic. Actually, the most defensible simple metric is: Does the replication CI exclude the *original point estimate*? If yes, strong evidence of difference. If no, but replication CI includes 0, evidence is weak. Let's refine: The "Stats Person" is right. Comparing to the original CI is wrong. But calculating a PI is hard for the committee. *Compromise:* Use the "Small Telescopes" logic (Simonsohn, 2015) or simply check if the replication effect is significantly *smaller* than the original (interaction test). Let's aim for a decision tree that incorporates the *precision* of the replication.
      *   *(2) Power & Absence of Evidence:* A non-significant result with low power is inconclusive. High power + non-significant = evidence of absence. Bayesian framing helps (BF < 1/3 vs BF > 3). *Decision:* The procedure needs a "Sensitivity Check." Was the replication powered to detect a *meaningful* effect (e.g., 50% of original), not just the original exact size?
      *   *(3) Hidden Moderators:* This is the "Get Out of Jail Free" card. *Decision:* Pre-registration is key. If the deviation wasn't pre-registered as a potential moderator, it counts as post-hoc rationalization. The procedure must weigh *fidelity* of materials/methods.
      *   *(4) Publication Bias:* If the original was likely p-hacked, the true effect is smaller. *Decision:* This lowers the bar for what counts as a successful replication. We shouldn't expect the replication to match an inflated original.
      *   *(5) The "2.5 Rule":* Sample 2.5x larger, effect < 25%. This is a heuristic for "High Power + Tiny Effect." *Decision:* It's a useful rule of thumb for "Decisive Failure," but not for "Success." It's defensible as a *sufficient* condition for failure, not necessary.

  3.  **Drafting the Procedure (The "How"):**

      *   Needs to be a flowchart or numbered list.
      *   Needs "Stop" conditions (Inconclusive vs. Fail vs. Pass).
      *   Needs to handle the "Values vs. Facts" handoff.
      *   *Structure:*
          1.  Fidelity Check (Are we testing the same thing?)
          2.  Power/Precision Check (Can we actually see the effect?)
          3.  Consistency Check (Do the numbers align?)
          4.  Bias Context (What do we expect the truth to be?)
          5.  Verdict & Handoff.

  4.  **Refining the Statistical Advice (Addressing the User's specific questions within the procedure):**

      *   *CI vs PI:* I need to tell the user the stats person is right. Comparing to the original CI is a type I error inflation. However, calculating a PI is annoying. *Solution:* The procedure should ask: "Does the replication Confidence Interval exclude the Original Point Estimate?" This is conservative and easy. Or better: "Is the replication effect significantly smaller than the original?" (Test of interaction). Let's recommend the "Test of Interaction" or "Overlap of Replication CI with Original Estimate."
      *   *Power:* Use the "Small Telescopes" approach (powered to detect 33% of original). If not powered to that, verdict is "Inconclusive."
      *   *Moderators:* Pre-registration is the gatekeeper.
      *   *2.5 Rule:* Validate it. It's roughly consistent with high-power null results.

  5.  **Developing the Three Cases:**

      *   *Case 1 (The User's Department):* Multi-lab, N=2000, Effect=0, CI excludes original.
          *   Fidelity: High (authors consulted).
          *   Power: Very High.
          *   Consistency: Failure (CI excludes original).
          *   Verdict: Strong evidence against original effect.
      *   *Case 2 (Original Authors, 4x N, 60% effect, p=.02):*
          *   Fidelity: High.
          *   Power: High.
          *   Consistency: Success (Sig), but effect shrinkage.
          *   Verdict: Effect exists but is smaller (Publication bias likely in original).
      *   *Case 3 (Old Flashy Study, N=40, Rushed Replication Non-Sig, Low Power):*
          *   Fidelity: Unknown/Rushed.
          *   Power: Low (only powered for 1.5x original).
          *   Consistency: Non-sig.
          *   Verdict: Inconclusive. (This is the hard pill to swallow).

  6.  **Addressing Limitations:**

      *   The procedure determines *evidential value*, not *editorial action* (Retraction? Expression of Concern?).
      *   It doesn't determine *truth*, only *consistency*.
      *   It doesn't solve the "Values" question (how much failure triggers a policy change).

  7.  **Review and Refine:**

      *   *Tone Check:* Is it empathetic but firm? The user is stressed about their own department's finding. I need to ensure the procedure is objective so they can hide behind it.
      *   *Stat Check:* Ensure the advice on PIs vs CIs is accurate. (Gelman & Carlin, 2014; Cumming, 2008). Comparing a new mean to an old CI is wrong. The old CI is for the old mean. The PI is for the new mean. If the committee can't calculate PIs, checking if the *Replication CI* overlaps the *Original Point Estimate* is a good proxy for inconsistency.
      *   *The "2.5 Rule":* Simonsohn's "Small Telescopes" suggests powering for 33% of the original effect. If N is 2.5x original, SE is $\sqrt{2.5} \approx 1.58$ times smaller. If effect is < 25%, it's likely indistinguishable from zero relative to the original. It's a decent heuristic for "Decisive Null."
      *   *Formatting:* Use bolding, lists, and clear headers.

  8.  **Final Polish:**

      *   Make sure the "Values vs. Facts" distinction is clear. The committee decides the *evidence*, the EIC decides the *consequence*.
      *   Ensure the "Inconclusive" verdict is presented as a valid scientific outcome, not a failure of the committee.
      *   Address the personal conflict: The procedure must be applied blindly to the department case to maintain integrity.

  *(Self-Correction during drafting)*: I initially thought about suggesting Bayes Factors. But the user said only one person is comfortable past t-tests. Calculating BFs might stall the committee. Better to stick to Power and Confidence Intervals, but explain them simply. I will recommend the "Small Telescopes" logic for power because it's intuitive (can we see an effect that matters?).

  *(Refining the CI/PI issue)*: The stats person is technically correct, but PIs are rarely reported. The most practical check for a committee is: **Does the Replication CI include the Original Point Estimate?** If No -> Inconsistent. If Yes -> Consistent (even if p > .05). This avoids the "CI vs CI" overlap error and the "Mean vs CI" error.

  *(Refining the 2.5 Rule)*: I need to be careful. 2.5x N gives roughly 1.6x precision. If the effect is <25%, it's very small. This rule is safe for declaring *failure*, but too strict for declaring *success*. I will endorse it as a "Safe Harbor for Failure."

  Let's assemble the response.

  *   **Introduction:** Acknowledge the difficulty.
  *   **The Procedure:** 5 Steps + Decision Matrix.
  *   **Answers to Sticking Points:** Embedded in the rationale.
  *   **Case Studies:** Applying the procedure.
  *   **Limitations:** What this doesn't solve.
  *   **Closing:** Encouragement on the personal aspect.

  *Wait, one more thing:* The user asked for an ordered list of questions *with what counts as a sufficient answer*. I need to make sure the format is exactly that.
  *   Q1: Fidelity.
  *   Q2: Power/Sensitivity.
  *   Q3: Statistical Consistency.
  *   Q4: Moderator Plausibility.
  *   Q5: Verdict.

  Okay, ready to write.
answer: |-
  This is a high-stakes situation, both professionally and personally. The goal of this procedure is to insulate the committee from accusations of bias (either protecting your department or trashing a colleague) by anchoring every decision in pre-agreed, quantitative criteria. It shifts the burden from "What do we feel?" to "Does the evidence meet the threshold?"

  Below is the **Replication Evaluation Protocol (REP)**. It is designed for a committee with limited statistical bandwidth but high accountability. Following the protocol, I have addressed your five specific sticking points, run the three cases, and listed the procedural limitations.

  ---

  ### Part 1: The Replication Evaluation Protocol (REP)

  **Instructions:** The committee must answer these five questions in order. If any question triggers a "Stop/Inconclusive" condition, the process ends there. Do not proceed to later questions to look for justification.

  #### Q1: Fidelity Check (Fact)
  *Question:* Did the replication adhere to the original protocol regarding materials, procedure, and population, within the bounds of what was pre-registered (or explicitly agreed upon with original authors)?
  *   **Pass:** Deviations are minor (e.g., language translation, online vs. lab) or were pre-registered/consulted on.
  *   **Fail:** Critical materials changed, inclusion criteria shifted significantly, or procedure altered without justification.
  *   **Action:** If **Fail**, verdict is **"Inconclusive (Methodological Mismatch)."** Stop. Do not evaluate statistics.

  #### Q2: Sensitivity Check (Fact)
  *Question:* Was the replication sample size large enough to detect a *meaningful* effect size, defined as 50% of the original reported effect size (the "Small Telescopes" standard)?
  *   *Note:* Do not check if it was powered for the *original* effect (that assumes the original was exact). Check if it was powered to detect half that size with 80% power.
  *   **Pass:** Yes, the sample size supports detecting an effect $\ge$ 50% of original.
  *   **Fail:** No, the study was only powered to detect the original effect size (or larger).
  *   **Action:** If **Fail**, verdict is **"Inconclusive (Low Sensitivity)."** Stop. A non-significant result here is uninformative.

  #### Q3: Statistical Consistency (Fact)
  *Question:* Does the 95% Confidence Interval (CI) of the *replication* effect estimate include the *original* point estimate?
  *   *Correction on CI vs. PI:* Your stats person is technically right (Prediction Intervals are better), but CIs are standard. Comparing the Replication Mean to the Original CI is wrong. Comparing the Replication CI to the Original Mean is conservative and defensible.
  *   **Pass:** The Replication CI overlaps/includes the Original Point Estimate.
  *   **Fail:** The Replication CI excludes the Original Point Estimate.
  *   **Action:**
      *   If **Pass** AND Replication $p < .05$: Verdict **"Consistent Replication."**
      *   If **Pass** AND Replication $p > .05$: Verdict **"Consistent but Imprecise."**
      *   If **Fail**: Proceed to Q4.

  #### Q4: The Moderator Escape Hatch (Values/Fact Hybrid)
  *Question:* If Q3 Failed, is there a pre-registered or theoretically grounded moderator that explains the discrepancy, *and* is there evidence for it in the data?
  *   **Pass:** A specific moderator (e.g., "effect only exists in face-to-face settings") was hypothesized *before* data collection (or is a known boundary condition in the literature) and the interaction test is significant.
  *   **Fail:** The explanation is post-hoc ("maybe the participants were tired"), untested, or the interaction is non-significant.
  *   **Action:** If **Fail**, verdict is **"Inconsistent Evidence."** If **Pass**, verdict is **"Context-Bound Effect."**

  #### Q5: The "Decisive Null" Shortcut (Fact)
  *Question:* (Only apply if Q3 Failed and Q4 Failed). Did the replication have $\ge$ 2.5x the original sample size AND find an effect size $< 25%$ of the original?
  *   **Action:** If **Yes**, verdict is **"Strong Evidence of Absence."** (This overrides the "Inconsistent" label with a stronger conclusion).

  ---

  ### Part 2: Addressing Your Committee's Sticking Points

  Here is how the REP resolves the five specific debates you listed, for your internal justification:

  1.  **CI vs. Prediction Interval:** Your stats person is correct; comparing a new mean to an old CI inflates false failures. However, calculating PIs is often beyond standard reporting. **Resolution:** The REP uses the **Replication CI vs. Original Point Estimate** (Q3). This is statistically conservative. If the replication CI doesn't even touch the original number, the discrepancy is real. If it does touch, we give the benefit of the doubt. This prevents "trashing" papers on shaky statistical grounds.
  2.  **Power & Absence of Evidence:** A non-significant result in an underpowered study is noise. **Resolution:** Q2 (Sensitivity Check) forces the committee to admit when a replication *couldn't* have found the effect even if it existed. If Q2 fails, the verdict *must* be Inconclusive. This prevents treating "absence of evidence" as "evidence of absence."
  3.  **Hidden Moderators:** This is the biggest source of bias. **Resolution:** Q4 restricts moderators to those that are **pre-registered or theoretically established**. Post-hoc storytelling is explicitly coded as a "Fail." This stops the rubber stamp.
  4.  **Publication Bias:** You cannot statistically correct the original study without raw data. **Resolution:** This is handled in Q2. By powering for 50% of the original effect (rather than 100%), we acknowledge the original was likely inflated. If the replication finds 60% of the original, it passes Q3, acknowledging the effect exists but was overstated.
  5.  **The "2.5 Rule":** Is it defensible? **Resolution:** Yes, as a **sufficient condition for failure**, not a necessary one. If $N$ is 2.5x larger, sampling error is roughly $\sqrt{2.5} \approx 1.6$ times smaller. If the effect is also $<25%$, the signal is effectively gone. The REP includes this as Q5 to allow for decisive "Strong Evidence of Absence" verdicts without needing complex Bayesian math.

  ---

  ### Part 3: Running the Procedure on Your Three Cases

  #### Case 1: The Multi-Lab Replication (Your Department's Finding)
  *   **Data:** $N \approx 2000$ (High), 12 Labs, Authors Consulted, Effect $\approx 0$, CI excludes original.
  *   **Q1 (Fidelity):** **Pass.** (Authors consulted on materials).
  *   **Q2 (Sensitivity):** **Pass.** ($N=2000$ is vastly larger than needed to detect 50% of original).
  *   **Q3 (Consistency):** **Fail.** (Replication CI excludes original point estimate).
  *   **Q4 (Moderators):** **Fail.** (No pre-registered moderator explains a drop to zero across 12 labs).
  *   **Q5 (Decisive Null):** **Pass.** ($N$ is likely $>2.5x$ original; Effect is $\approx 0%$ of original).
  *   **Verdict:** **Strong Evidence of Absence.**
  *   **Committee Recommendation:** The original finding is not robust. The effect size is likely zero or too small to be theoretically meaningful.
  *   **Note to You:** This is the hardest outcome personally, but the procedure protects you. You didn't decide this; the *criteria* decided this. You can tell your colleagues, "The protocol forced our hand on Q5."

  #### Case 2: Original Authors' Follow-up
  *   **Data:** Original Authors, $4x$ Sample, Effect $60%$ of Original, $p = .02$.
  *   **Q1 (Fidelity):** **Pass.** (Same authors, presumably same methods).
  *   **Q2 (Sensitivity):** **Pass.** ($4x$ sample is highly sensitive).
  *   **Q3 (Consistency):** **Pass.** (Does the Replication CI include the Original Point Estimate? Likely yes, because the effect is 60% of original, not 0. Even if the CI is tight, it likely overlaps the original noisy estimate).
  *   **Verdict:** **Consistent Replication (with Effect Shrinkage).**
  *   **Committee Recommendation:** The effect is real but was inflated in the original publication (likely due to publication bias). The literature should be updated to reflect the smaller effect size. No retraction warranted.

  #### Case 3: The Flashy Old Study (The "Noise" You Suspect)
  *   **Data:** Original $N=40$ (15 years ago). Replication Non-Sig. Replication powered only for $1.5x$ Original Effect.
  *   **Q1 (Fidelity):** **Pass** (Assume materials were matched).
  *   **Q2 (Sensitivity):** **Fail.** (Powered for $1.5x$ original, not 50% of original).
      *   *Reasoning:* If the true effect is 50% of the original (a reasonable assumption given bias), this replication had low power to find it.
  *   **Verdict:** **Inconclusive (Low Sensitivity).**
  *   **Committee Recommendation:** We cannot draw a conclusion. The replication does not confirm the original, but it does not rule it out either.
  *   **The Hard Pill:** You suspect it's noise. The procedure says you can't say that yet. **Do not override this.** If you write a "Strong Evidence of Absence" recommendation here, a quantitatively literate reader *will* laugh, and it undermines the credibility of the Committee's ruling on Case 1. You must write: *"The replication lacks the sensitivity to distinguish between a null effect and a modest true effect. Further high-powered investigation is required."*

  ---

  ### Part 4: What This Procedure Cannot Do (Limitations)

  You must attach a "Scope of Authority" note to your recommendation so the EIC knows where the committee's jurisdiction ends.

  1.  **Retraction vs. Correction:** The procedure evaluates *evidence*, not *ethics*. It can say "Strong Evidence of Absence," but it cannot recommend Retraction unless there is evidence of fraud/error. It can only recommend an "Editorial Note" or "Commentary."
  2.  **Truth Claims:** The procedure cannot license the statement "The effect is zero." It can only say "The data are inconsistent with the original claim." Science rarely proves zero; it only limits the plausible range.
  3.  **Policy Changes:** This procedure does not decide whether the journal *should* publish replications. That is a strategic decision for the EIC/Board.
  4.  **Values Handoff:** If Q4 (Moderators) is borderline (e.g., a weak theoretical argument for a moderator), the procedure flags it as a **Values** decision. The Committee should note: *"Statistical inconsistency is present, but theoretical justification for moderation is plausible. Decision on whether this constitutes a 'failure' rests with the EIC."*

  ### Final Advice for the Draft

  When you write the recommendation for Case 1 (your department):
  1.  **Lead with the Protocol:** "Per the committee's adopted evaluation framework..."
  2.  **Cite Q5:** "The study meets the criteria for a Decisive Null (Sample > 2.5x, Effect < 25%)."
  3.  **Remove Yourself:** If possible, recuse yourself from the *vote* on Case 1, even if you draft the document. Let the other three sign off on the application of the protocol. If recusal isn't possible, explicitly state in the memo: *"Committee Member X recused from voting but drafted the report based on the agreed protocol."*

  This approach allows you to be professionally honest without being the person who "killed" your department's finding. The math did it. You just reported the score.
