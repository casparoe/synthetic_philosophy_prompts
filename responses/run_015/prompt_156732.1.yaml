answer: |-
  You are struggling because "manipulation" is a **thick ethical concept**. It does not merely describe a mechanical process of influence (like "causation"); it describes a process *and* evaluates it as wrongful. You are trying to find a mechanical definition for a moralized term. That is why your structural comparisons (Union vs. PR) break your theory: you are intuitively judging the *justification* of the act, not just the *mechanism*.

  Here is the principle that best captures your verdicts, repaired to handle the exceptions you found.

  ### The Normative Vulnerability Account

  Influence counts as manipulation if and only if it meets all three of the following clauses:

  1.  **The Bypass Clause:** The influence achieves compliance primarily through psychological levers (emotion, timing, bias, fatigue) rather than engagement with the rational merits of the proposition itself.
      *   *Motivating Cases:* The **Drug Ad** (vibes vs. data), the **Dept Chair** (fatigue vs. merit), the **Doctor's Guilt** (shame vs. health stats).
      *   *Excludes:* The **Conference Talk**. The lurid case is rhetorical framing, but it illuminates the *merits* of the argument. It is not detached from the subject matter.

  2.  **The Protected Vulnerability Clause:** The influence exploits a vulnerability that the target has a reasonable expectation of protection against within the norms of this specific relationship or context.
      *   *Motivating Cases:* The **Grad Student** (professors expect to be flattered, but not leveraged for urgency), the **Therapist** (patients expect trust-building, so the vulnerability is *authorized*), the **Partner** (partners expect care, so tea is not a lever, it's a norm).
      *   *Excludes:* The **Friend**. Friends are expected to navigate each other's emotional states; timing a request when you are calm is care, not exploitation.
      *   *Excludes:* **Negotiation Anchoring**. In adversarial negotiations, parties expect strategic opening moves; there is no reasonable expectation of "pure" neutrality.

  3.  **The Alignment Clause:** The primary benefit of the influence accrues to the influencer in a way that conflicts with, or is indifferent to, the target's autonomy or welfare.
      *   *Motivating Cases:* The **Grad Student** (benefit: letter; cost: prof's compromised judgment), the **PR Firm** (benefit: sales; cost: public's informed choice).
      *   *Excludes:* The **Therapist** (benefit: patient's healing), the **Union Organizer** (benefit: collective bargaining power, which is the *point* of the relationship context).
      *   *Note:* This clause is why the **Union vs. PR** case feels identical structurally but different morally.

  ---

  ### Repairing the "Tell Test"

  Your Tell Test ("effectiveness would collapse if told") is a strong heuristic, but it fails on **constitutive goals** (Therapy) and **cognitive stickiness** (Anchoring).

  **The Repair:** An influence is manipulative if, upon disclosure, the target would feel **violated** rather than **informed**, *even if the influence persists*.

  *   **Therapist:** If she says, "I am sharing this to build trust so you can heal," you feel *included* in the method. You do not feel violated. The goal is shared.
  *   **Negotiator:** If he says, "I am anchoring you," you might still feel the anchor, but you feel *warned*. However, in a negotiation, you expect games. You don't feel violated because the context licenses it (see Clause 2).
  *   **Grad Student:** If she says, "I am flattering you to rush you," you feel violated. The norm of the relationship (mentorship) was weaponized.
  *   **Drug Ad:** If they say, "We are showing a beach to bypass your critical faculty," you feel violated. The context (health) demands evidence.

  ---

  ### The Verdict I Would Overturn

  You asked me to pick one of your verdicts to overturn if forced. I choose the **Union Organizer**.

  **Your Verdict:** Fine, not manipulative.
  **My Verdict:** **It is manipulative, but it is *justified* manipulation.**

  **Why:** Structurally, a walkout timed for publicity is identical to a PR announcement timed for resonance. Both use emotional resonance and timing to bypass a purely rational evaluation of the underlying facts. Both use the public as a lever against a decision-maker.
  If you call the PR firm manipulative, you must call the Union manipulative *mechanically*. The difference is not the *act*, but the *moral license*. Labor relations are an **adversarial context** (like negotiation), where leveraging public pressure is a legitimate tactic. The PR firm is operating in an **informational context**, where leveraging emotion is illegitimate.
  By admitting the Union act *is* manipulation, you clarify that manipulation is not always impermissible. Sometimes it is a necessary tool of the powerless. This saves your theory from the "structurally identical" contradiction.

  ---

  ### The Seam in the Concept

  You asked me to say plainly if no single principle exists. Here is the truth: **There is a seam between Clause 1 (Mechanism) and Clause 3 (Ends).**

  *   **Thin Manipulation:** Meets Clause 1 (Bypass). This is descriptive. (e.g., A magician manipulates your attention).
  *   **Thick Manipulation:** Meets Clauses 1, 2, and 3. This is moral. (e.g., The Grad Student).

  Your discomfort comes from trying to make "Manipulation" do both jobs at once. In ethics, we usually care about the Thick version. But in cases like the Union or the Negotiator, we are forced to acknowledge the Thin version exists and can be permissible.

  ---

  ### Running the Account on Your Three New Cases

  **1. The Recommendation Feed (Algorithmic Influence)**
  *   **Bypass:** Yes. It uses variable reward schedules and framing learned from your data to bypass rational choice.
  *   **Protected Vulnerability:** Yes. You have an expectation of cognitive sovereignty; the feed exploits cognitive bugs (dopamine loops) you cannot guard against because the mechanism is hidden.
  *   **Alignment:** No. The benefit accrues to the platform (engagement/ad revenue), often indifferent to your welfare (radicalization, time waste).
  *   **Verdict:** **Manipulative.** This is the Drug Ad case scaled by AI.

  **2. The Crying Student (Emotional Leverage)**
  *   **Bypass:** Yes. Tears trigger a care response that bypasses policy evaluation.
  *   **Protected Vulnerability:** **Depends on Voluntariness.**
      *   *Involuntary:* If the student cannot help crying, they are not *influencing* you; they are having a reaction. Not manipulation.
      *   *Strategic:* If the tears are performative, they exploit the Professor-Student norm (Professors should care about student distress). This is a protected vulnerability.
  *   **Alignment:** Self-serving (extension vs. policy).
  *   **Verdict:** **Manipulative (if strategic).** This is the Grad Student case with higher emotional stakes. It violates the academic frame.

  **3. The Silent Colleague (Omission as Leverage)**
  *   **Bypass:** Yes. It uses your ignorance and procedural deadlines rather than the merits of the plan.
  *   **Protected Vulnerability:** Yes. Colleagues have a duty of disclosure regarding shared governance. You have a reasonable expectation that objections will be voiced *before* the point of no return.
  *   **Alignment:** Self-serving (her plan passes) vs. your agency (you are blocked from opposing).
  *   **Verdict:** **Manipulative (and Sabotage).** This is the Dept Chair case without the authority. It fails the Transparency requirement inherent in collegiality.

  ### Summary for Your Seminar

  Teach your students that manipulation is not defined by *lying* (you can manipulate with truth) nor by *success* (you can fail to manipulate). It is defined by **unauthorized leverage**.

  1.  **Mechanism:** Are you bypassing reason?
  2.  **Context:** Did the target expect protection from this lever?
  3.  **End:** Are you using this lever for a goal the relationship does not authorize?

  If you have to choose between the Union and the PR firm, do not say one is manipulation and the other isn't. Say both are manipulation, but the Union has **justification**. That is where the ethics actually lives.
