answer: |-
  **Commencement Address: The Weight of the Badge and the Space for Justice**

  **Graduate School of Public Policy and Administration**
  **June 2024**

  Graduates, faculty, families, and friends:

  Congratulations. You have completed a rigorous training in the mechanics of power. You know how to draft legislation, analyze budget variances, navigate administrative law, and model the downstream effects of a regulation. You are ready to enter the machinery of the state, the advocacy organization, or the party apparatus.

  But today, I do not want to talk about what you have learned to *do*. I want to talk about what you must learn to *resist*.

  You are entering a world that demands loyalty. If you go into government, you will be asked to loyalty to the agency. If you go into advocacy, loyalty to the cause. If you go into party-affiliated work, loyalty to the platform. We usually call this "teamwork." We are told it is necessary for efficiency. But the French philosopher and mystic Simone Weil, writing in the shadow of the Second World War, offered a much darker diagnosis. She argued that political parties—and by extension, the institutions that resemble them—are not merely groups of people sharing opinions. They are mechanisms that demand the suspension of individual moral judgment in exchange for collective belonging.

  Weil argued that parties manufacture artificial passions. They require you to care more about the victory of the group than the truth of the situation. For half of you, this will sound like a description of your future workplace. For the families here today, it might sound like cynicism. It is neither. It is a warning about the physics of institutions.

  Weil suggests that every organization generates a kind of spiritual gravity. She calls this *pesanteur*, or gravity. It is the downward pull of conformity. In a bureaucracy, gravity is the memo that gets written because it protects the department, not because it solves the problem. It is the meeting where everyone nods because the Director has already spoken. It is the subtle pressure to value the survival of the institution over the specific human being affected by the policy.

  Gravity is not evil; it is inertia. It is the natural tendency of any group to prioritize its own continuation. But if you surrender to gravity, you become a functionary. You become a gear that turns because it is oiled, not because it is moving toward justice.

  Now, usually, at this point in a commencement address, the speaker offers the standard reassurance: "Stay true to yourself." "Don't let the system change you." "Be the change."

  Weil would find this advice naive. She knew that individual willpower is no match for institutional gravity. You cannot simply "be yourself" inside a bureaucracy, because the bureaucracy is designed to reshape you. If you rely solely on your own ego, your own sense of righteousness, the institution will crush you or co-opt you. You will either burn out or become cynical.

  So, if we cannot rely on the institution, and we cannot rely on simple individualism, what is left?

  Here, I want to introduce a concept from Weil that is rarely discussed in policy circles. It is called *decreation*.

  In Weil's religious writings, decreation is a mystical act: the voluntary emptying of the self to make space for God. But today, I ask you to consider a secular, administrative version of decreation. In the context of public policy, decreation is the voluntary emptying of the ego to make space for *reality*.

  When you sit down to draft a regulation, gravity tells you to protect your agency's jurisdiction. Decreation asks you to set aside your need to be powerful, and ask: "Does this actually help the person it is intended for?"

  When you are in a strategy meeting, gravity tells you to argue for the side that will win you allies. Decreation asks you to silence your need for status, and listen to the argument that might prove your preferred policy wrong.

  Decreation is not passivity. It is not quitting. It is a specific, disciplined form of attention. It is the ability to look at a budget line and see not a number to be balanced, but a choice about who eats and who goes hungry, without inserting your own pride into that calculation. It is the refusal to let your career ambitions cloud your perception of the truth.

  Weil believed that justice is not something we construct; it is something we perceive, but only when we get our own egos out of the way. Gravity pulls us toward the comfort of the group. Decreation pulls us toward the discomfort of the truth.

  I know this sounds abstract. Let me make it concrete.

  Imagine you are a mid-level administrator. You discover a flaw in a benefits program you helped design. The gravity of the institution says: "Fix it quietly. Do not admit fault. Protect the program's reputation." That is the pull of the collective.

  Decreation says: "Acknowledge the harm. Expose the flaw. Accept the personal risk of looking incompetent to ensure the recipient gets what they are owed."

  It is the difference between working *for* the agency, and working *through* the agency for the public.

  Now, I must offer a necessary caution. I am asking you to consider Weil's ideas, but I am not asking you to imitate Weil's life. This is a crucial distinction.

  Simone Weil was a brilliant, tormented, and often difficult woman. She refused to eat more than the rations of her occupied countrymen while living in exile, a decision that contributed to her early death. She was intense to the point of exhaustion. She was not a model of work-life balance. She was not a model of mental health.

  If you take her call for "decreation" to mean self-destruction, you will not last five years in public service. You cannot pour from an empty cup. We are not asking you to be martyrs. We are asking you to be professionals who recognize that the greatest threat to your integrity is not corruption in the criminal sense, but the slow, quiet drift of belonging.

  So, how do you live this? How do you work inside a party, an agency, or an advocacy group without being consumed by its gravity?

  First, recognize the pressure. When you feel a surge of righteous anger against a rival organization, pause. Ask yourself: "Is this anger about justice, or is it about my team winning?" Weil argued that parties manufacture passion to keep members loyal. Learn to distinguish your own moral intuition from the manufactured enthusiasm of the group.

  Second, practice administrative decreation. In your decision-making, create small spaces of silence. Before you sign the memo, before you send the email, create a moment where you are not a representative of your office, but a human being looking at a problem. In that space, the "we" of the agency recedes, and the "you" of the citizen comes into focus.

  Third, do not confuse loyalty with truth. You can be loyal to your colleagues without agreeing with their errors. You can serve the state without worshipping it. The hardest thing to do in public administration is to say, "I am part of this organization, but this organization is wrong." Gravity says that is disloyal. Decreation says that is the only way to serve the public good.

  To the families here: You may worry that your graduates are entering a corrupt system. They are. But they are also entering a necessary one. We need government. We need advocacy. We need organized action. Weil's critique was not a call to anarchy; it was a call to purity of intention within organized action. Support your graduates not just in their success, but in their honesty. Ask them not only "Did you get the promotion?" but "Did you tell the truth?"

  To the graduates: You are about to receive the weight of authority. You will have the power to sign, to deny, to allocate, to enforce. That power has gravity. It will pull you toward safety, toward conformity, toward the easy answer.

  You cannot stop the gravity. The institution is heavier than you are. But you can cultivate an inner counter-weight. You can practice the discipline of making space. You can refuse to let the "party"—whether that is a political party, a department, or a movement—think for you.

  Do not try to be a hero. Heroes are often consumed by their own egos. Try to be a clear window. Try to be the person in the room who is willing to look at the problem without flinching, even when the solution is inconvenient for the organization.

  If you can do this, you will not necessarily be rewarded. You may not rise to the top. But you will remain free. And in a world of heavy institutions, a free public servant is the only thing that stands between the machinery of the state and the people it is meant to serve.

  Go forth. Carry the weight, but do not become it.

  Thank you.

  ***

  **Epistemic Note on Simone Weil's Political Philosophy**

  **1. Settled Scholarship regarding the Anti-Party Argument**
  It is broadly settled in Weil scholarship that her essay *On the Abolition of All Political Parties* (1940) posits that the *structure* of a party is inherently totalitarian, regardless of its specific ideology. Scholars agree that for Weil, a party is defined by three characteristics: it is a machine for generating collective passion; it demands an obligation of loyalty that supersedes truth; and its ultimate goal is its own growth and self-perpetuation rather than the public good. There is consensus that Weil views "opinion" as distinct from "truth," and that parties operate exclusively in the realm of opinion.

  **2. Contested Interpretations**
  *   **Scope of Application:** While Weil explicitly targets *political parties*, it remains contested whether her critique applies with equal force to non-partisan bureaucracies, professional associations, or social movements. Some scholars argue Weil viewed the state administration as a potential neutral arbiter if stripped of party influence; others argue her concept of "collective pressure" implies any organized group generates the same "gravity." The speech above adopts the latter interpretation, extending the party critique to bureaucratic agencies.
  *   **Secularization of Decreation:** The concept of *decreation* (décréation) is primarily theological in Weil's corpus, referring to the undoing of the created self to allow God to enter. Applying this to secular administrative decision-making is an interpretive extension. While Weil did link attention (*attention*) to justice in a secular context, equating bureaucratic neutrality or ethical pause with "decreation" goes beyond standard textual exegesis.
  *   **Feasibility:** There is significant debate regarding whether Weil believed any political action was possible without party structures. Some interpreters suggest she advocated for a complete withdrawal from political life; others, like the speech above, argue for an internal resistance ("working through the agency").

  **3. Interpretive Moves Flagged in the Address**
  *   **Bureaucratic Gravity:** The speech treats "gravity" (*pesanteur*) as a sociological force within bureaucracies (risk aversion, self-preservation). Weil typically used this term in a cosmological or psychological sense regarding the soul's descent away from God.
  *   **Administrative Decreation:** The definition of decreation as "making space for reality" in a policy context is a pragmatic adaptation. It removes the requirement of divine presence, focusing instead on the removal of ego-bias to perceive social truth.
  *   **The "Clear Window" Metaphor:** The concluding exhortation to be a "clear window" is a synthesis of Weil's metaphor of the self as an obstacle to light, applied here to the transparency of public decision-making rather than spiritual grace.
