answer: |-
  **Joint Statement on Sovereignty, Democratic Deficit, and Ever-Closer Union**

  **1. Agreed Claims**

  For the purposes of this collaboration, we introduce an analytical construct to describe the flow of authority within the European Union. We distinguish **recursive delegation**, wherein authority loops back to national parliaments through real-time legislative veto networks and scrutiny reserves, from **linear delegation**, wherein authority is transferred upward to EU institutions with irreversible effect. We agree upon the following claims regarding the current Treaty framework:

  1.  **Formal Allocation of Authority:** Legislative authority is shared between the Council of the European Union and the European Parliament under the Ordinary Legislative Procedure, while executive authority is primarily vested in the Commission, subject to Council oversight.
  2.  **Mechanisms of Distance:** Democratic distance is created by the Council's intergovernmental composition, which shields national executives from immediate parliamentary scrutiny during negotiations, and by the Commission's exclusive right of initiative, which sets the agenda prior to parliamentary input.
  3.  **European Parliament Powers:** The European Parliament exercises co-decision powers equal to the Council in most policy areas and holds budgetary authority, representing a significant element of linear delegation where citizens directly mandate EU-level legislators.
  4.  **Legal Status of 'Ever-Closer Union':** The phrase 'ever-closer union' appears in the Treaty on European Union as an objective of the integration process, but it does not constitute a legal command for irreversible centralisation that precludes the restoration of competences via Treaty revision.
  5.  **Structure of Sovereignty Pooling:** The current system operates as a hybrid of our defined constructs: it relies on **linear delegation** for the implementation of regulations and directives, yet retains elements of **recursive delegation** through national parliamentary scrutiny mechanisms and the principle of conferral.

  **2. Disagreements Table**

  | Issue | Intergovernmentalist Formulation | Supranationalist Formulation | Crux Reference |
  | :--- | :--- | :--- | :--- |
  | **Unified European Demos** | Democratic legitimacy requires distinct national demoi; a unified European demos is a fiction that obscures the lack of common political identity. | Democratic legitimacy is constructed through practice; pooled sovereignty actively creates a transnational citizenship and a unified demos over time. | See Crux 1 |
  | **Reversibility of Pooling** | Sovereignty pooling must be practically reversible to protect democracy; irreversible transfer severs the link between voter and decision-maker. | Sovereignty pooling is practically irreversible without dismantling the internal market; stability requires commitment to linear delegation. | See Crux 2 |
  | **Effect of Co-decision** | Parliamentary co-decision has merely masked the deficit by legitimising executive dominance without restoring authorisation from national electorates. | Parliamentary co-decision has substantially eliminated the deficit by establishing direct accountability and majority rule at the appropriate level. | See Crux 1 |

  **3. Cruxes**

  **Crux 1: Authorisation vs. Performance Legitimacy**
  *   **Shared Framing:** We agree to assess pooled sovereignty by distinguishing 'authorisation legitimacy' (derived from explicit electoral mandate) from 'performance legitimacy' (derived from effective problem-solving and output).
  *   **Intergovernmentalist Prediction:** Authorisation legitimacy is primary and cannot be substituted by performance; without recursive delegation to national parliaments, the EU remains structurally illegitimate regardless of policy success.
  *   **Supranationalist Prediction:** Performance legitimacy validates the pooling of sovereignty; effective problem-solving at the EU level generates its own democratic mandate, reducing the necessity for strict authorisation via national channels.

  **Crux 2: European Fiscal Capacity and Accountability**
  *   **Shared Framing:** We consider a hypothetical European Fiscal Capacity funded by direct EU taxation, approved by qualified-majority Council vote, and amendable by the European Parliament.
  *   **Intergovernmentalist Prediction:** This arrangement would **decrease** democratic accountability. It breaks the link between national taxation and representation, creating a revenue stream independent of national parliamentary consent (recursive delegation) without establishing a genuine European government.
  *   **Supranationalist Prediction:** This arrangement would **increase** democratic accountability. It clarifies fiscal responsibility at the EU level, allowing voters to punish or reward EU institutions directly, thereby strengthening linear delegation and transnational citizenship.
