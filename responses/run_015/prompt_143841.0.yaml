answer: |-
  # The Architectural Fidelity Protocol (AFP)
  **For Use by the Ethics Review Board: Historical Drama Division**

  ## 1. Purpose and Scope
  This procedure evaluates proposed invented scenes (fabricated dialogue, compressed timelines, assigned private motives) involving deceased historical figures with no living legal representatives. 

  **The Guiding Principle:** We owe the dead **Representational Fidelity**. This is not literal accuracy. It is the preservation of the **Causal and Moral Architecture** of their lives as they exist in the **Shared Historical Record** (standard biographies, academic consensus, public archives accessible to the general viewer).

  **Goal:** Distinguish between *Permissible Narrative Compression* (streamlining without distorting) and *Impermissible Structural Distortion* (changing the "why" and "who" of history).

  ---

  ## 2. The Decision Procedure (Step-by-Step)

  Apply the following tests in order. If a scene fails any test, it is **Rejected** unless a "Board Override" is invoked (see Section 4).

  ### Step 1: Categorize the Invention
  Identify the type of fabrication proposed.
  *   **Type A (Omission/Compression):** Removing events, merging minor characters, shortening timelines.
  *   **Type B (Commission/Invention):** Adding dialogue, creating private meetings, assigning internal motives not in the record.
  *   **Action:** If Type A, proceed to Step 2 with a *Presumption of Permissibility*. If Type B, proceed to Step 2 with a *Presumption of Scrutiny*.

  ### Step 2: Establish the Historical Baseline
  Consult the Shared Historical Record regarding the specific event or character trait in question.
  *   **Question:** Is there a settled consensus on what happened or why it happened?
  *   **Yes:** Proceed to Step 3.
  *   **No (Record is Ambiguous/Silent):** Proceed to Step 3, but note that the "Causal Integrity Test" (Step 3) must be passed strictly. *Invention cannot resolve historical ambiguity in a way that forecloses legitimate debate.*

  ### Step 3: The Causal Integrity Test
  Determine if the invention alters the explanatory logic of a documented outcome.
  *   **Question:** If the viewer believes this scene is true, will they understand the *cause* of a major historical outcome differently than the record supports?
  *   **Example:** Did the General win because of strategy (Record) or because of a lucky betrayal invented for the film (Invention)?
  *   **Fail Condition:** The invention substitutes a fictional cause for a documented cause.
  *   **Pass Condition:** The invention streamlines the path to the cause without changing the cause itself.

  ### Step 4: The Moral Architecture Test
  Determine if the invention alters the ethical valence of the agent.
  *   **Question:** Does this scene change the viewer's judgment of the figure's character (e.g., from principled to cynical, from cowardly to brave, from indifferent to compassionate)?
  *   **Fail Condition:** The invention reverses the moral motivation behind a public act (e.g., portraying a pragmatic political deal as an act of religious penance).
  *   **Pass Condition:** The invention illustrates a documented character trait without contradicting it (e.g., showing a known workaholic working late, even if the specific conversation is made up).

  ### Step 5: The Audience Expectation Test
  Determine the risk of active misleading.
  *   **Question:** Is the invented detail likely to be accepted by the audience as a literal historical fact that matters?
  *   **Fail Condition:** The scene presents a specific, verifiable claim (e.g., "He signed the treaty at midnight") that is false and significant.
  *   **Pass Condition:** The scene is clearly atmospheric or dialogic filler that no reasonable viewer would treat as a archival fact (e.g., "He likely spoke to his aide before the speech").

  ### Step 6: Final Weighing (Artistic Necessity vs. Fidelity Cost)
  If the scene passes Steps 3, 4, and 5, but still feels ethically uneasy:
  *   **Question:** Is there a less distortive way to achieve the same narrative emotional beat?
  *   **Action:** If **Yes**, the scene must be revised. If **No**, the scene is **Approved**.

  ---

  ## 3. Worked Applications

  ### Case 1: The Scientist (Elided Failures)
  **Proposal:** A biopic about a famous chemist. The record shows 50 failed experiments over 5 years before the breakthrough. The film shows 2 failed experiments over 2 weeks to maintain pacing.
  *   **Step 1 (Categorize):** Type A (Omission/Compression). *Presumption of Permissibility.*
  *   **Step 2 (Baseline):** Consensus is that persistence led to success.
  *   **Step 3 (Causal):** Does the compression change *why* she succeeded? No. The cause remains her persistence and method, not luck or external aid. **Pass.**
  *   **Step 4 (Moral):** Does it change her character? No. She is still portrayed as diligent. **Pass.**
  *   **Step 5 (Audience):** Will viewers think chemistry is easy? Possibly, but they will not believe a specific false fact about *her* life. **Pass.**
  *   **Verdict:** **PERMISSIBLE.** This is standard narrative compression. The causal architecture (Effort → Discovery) remains intact.

  ### Case 2: The Political Leader (Invented Religious Crisis)
  **Proposal:** A Prime Minister reverses a war policy in 1940. The record indicates this was due to economic collapse and military advice. The film invents a scene where he prays in a chapel and decides based on a sudden religious guilt.
  *   **Step 1 (Categorize):** Type B (Commission/Invention). *Presumption of Scrutiny.*
  *   **Step 2 (Baseline):** Consensus is the decision was pragmatic/geopolitical.
  *   **Step 3 (Causal):** Does this change *why* the policy reversed? **Yes.** It shifts the cause from Geopolitics to Theology. **FAIL.**
  *   **Step 4 (Moral):** Does this change his character? **Yes.** It shifts him from a Pragmatist to a Penitent. This alters the moral architecture of his leadership. **FAIL.**
  *   **Verdict:** **IMPERMISSIBLE.** This is Structural Distortion. It rewrites the explanatory logic of a major historical event.

  ### Case 3: The Borderline Case (The "Humanizing" Flaw)
  **Proposal:** A revered Civil Rights leader is documented as having a stoic, disciplined public persona. The record is silent on his private emotional state during a specific boycott. The film invents a scene where he breaks down weeping and considers quitting, but is bolstered by a fictional friend.
  *   **Step 1 (Categorize):** Type B (Invention). *Presumption of Scrutiny.*
  *   **Step 2 (Baseline):** Record is silent on private moments; public record is stoic.
  *   **Step 3 (Causal):** Does this change the outcome of the boycott? No. **Pass.**
  *   **Step 4 (Moral):** Does this change his character? It adds vulnerability but does not reverse his courage. **Pass.**
  *   **Step 5 (Audience):** Viewers may accept this as "likely true" interiority. **Pass.**
  *   **Step 6 (Weighing):** Is there a less distortive way? Perhaps showing his exhaustion without the specific dialogue. However, the procedure technically **APPROVES** this scene.
  *   **Board Override Recommendation:** Despite passing the AFP, the Board should **REJECT** this scene.
  *   **Reason:** While it doesn't change the *causal* history, it imposes a modern psychological framework (public stoicism vs. private fragility) onto a figure whose moral authority relied on that stoicism. It risks trivializing a legacy for the sake of "relatability." The procedure clears it, but ethical stewardship requires blocking it.

  ---

  ## 4. Limitations and Meta-Commentary

  This procedure is a tool, not an algorithm. It deliberately simplifies complex ethical terrain to ensure consistency. Board members must acknowledge the following:

  ### A. Where Judgment Cannot Be Eliminated
  1.  **Defining the "Shared Historical Record":** The procedure relies on a "consensus." History is often contested. Board members must judge whether a view is "fringe" or "legitimate debate." (e.g., If 30% of historians disagree on a motive, is it safe to invent the other 70%?)
  2.  **Weighing Artistic Necessity (Step 6):** There is no metric for "emotional truth." One member's "essential metaphor" is another's "harmful lie." This requires deliberation, not just box-ticking.
  3.  **The "Override" Threshold:** As seen in Case 3, the procedure may clear a scene that feels ethically wrong. The Board must trust its collective intuition when the protocol yields a "Permissible" result that violates the *spirit* of Representational Fidelity.

  ### B. Distinctions Deliberately Collapsed
  1.  **Literal Truth vs. Metaphorical Truth:** The AFP treats a fabricated quote the same as a fabricated event if the *causal impact* is the same. It does not distinguish between "he didn't say this" and "this didn't happen." We care about the *effect on the viewer's understanding*, not the ontology of the fabrication.
  2.  **Harm to Memory vs. Harm to Descendants:** The protocol focuses on the *dead figure's architecture*. It collapses the distinct (but related) ethical duty to living relatives who might be distressed, treating them as secondary to the historical record itself.

  ### C. What Remains Unsettled
  1.  **Future Revisions:** History changes. A scene approved today based on current consensus might be deemed a distortion in 20 years if new archives open. The Board accepts this risk; we judge based on the record *now*.
  2.  **Cultural Morality:** The "Moral Architecture Test" assumes a stable understanding of virtue. If cultural values shift (e.g., how we view colonial figures), a scene that preserves the "record" might still feel ethically repugnant to a future audience. The procedure cannot solve the problem of changing moral lenses.
  3.  **The "No Legal Rep" Clause:** This procedure applies only because there is no legal risk. If a living estate exists, legal contracts override this ethical protocol.

  **Final Instruction to Board:** Use the AFP to filter clear violations and standard compressions. Use Board Deliberation to handle the Borderline Cases where the architecture holds, but the dignity does not.
