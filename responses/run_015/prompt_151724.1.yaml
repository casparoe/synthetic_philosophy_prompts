      *   *Moral/Social Application:* Public memory isn't a static record. It accumulates "magnetic domains" (norms, narratives). Changing the input (public sentiment, political pressure) changes the output (statues, names), but reversing the input doesn't restore the old statue easily. The system has "memory."
      *   *Key Insight:* The status quo ante (statue up) wasn't a neutral zero point; it was a saturated state. Removing it isn't just demagnetizing; it's re-magnetizing in a new direction.

