answer: |-
  This sentence—"Past you is just another agent, so an advance directive is no more binding than a contract with a stranger"—is a philosophical grenade. It conflates metaphysics (what you *are*), normativity (what binds you), and epistemology (what you *know*). To dissect it properly, we need to separate the ontological claim from the deontological claim.

  Here is the full menu of claims hidden in that sentence, categorized by their philosophical lineage, their practical verdict, and their utility in bioethics.

  ### 1. The Humean Bundle Claim (Metaphysical Reductionism)
  **The Claim:** There is no enduring "self" that persists through time. There are only temporal slices of experience causally connected. Therefore, "Past You" and "Present You" are numerically distinct entities, linked only by memory and causation, much like two different people.
  *   **Philosophical Lineage:** Hume, Buddhist *anatta*, strict Perdurantism.
  *   **Verdict:** **Platitude in metaphysics, irrelevant in law.**
      *   While philosophically defensible, legal and ethical systems operate on a "practical identity" assumption. The law treats you as the same entity from birth to death for liability and rights.
      *   If taken literally, this dissolves *all* diachronic obligations, not just ADs. It implies you aren't responsible for yesterday's crimes because the "agent" who committed them no longer exists.
      *   **Status:** Too radical for bioethics. Bioethicists generally grant that *some* continuity exists; the debate is about the *quality* of that continuity, not its existence.

  ### 2. The Psychological Continuity Cutoff (The Parfitian Claim)
  **The Claim:** Identity isn't binary; it's a matter of degree based on psychological connectedness (memories, values, character). When connectedness drops below a certain threshold (e.g., advanced dementia), the "person" effectively ceases to exist, and a new subject of experience emerges.
  *   **Philosophical Lineage:** Derek Parfit (*Reasons and Persons*), Marya Schechtman.
  *   **Verdict:** **The Bioethicist's Primary Tool.**
      *   This is the specific reading bioethicists (like Rebecca Dresser) actually need when arguing against ADs in dementia cases. It allows them to say: "In normal life, Past You = Present You. In advanced dementia, Past You $\neq$ Present You."
      *   It avoids blowing up contract law because it posits a *threshold* of discontinuity. It preserves the binding nature of ADs for temporary incapacity (anesthesia, coma) where psychological continuity is preserved, while voiding them for radical personality dissolution.
      *   **Status:** **Actionable.** This is the only metaphysical claim that does the work required in clinical ethics without collapsing the legal system.

  ### 3. The Normative Authority Gap (The "Stranger" Claim)
  **The Claim:** Even if diachronic identity *holds* (i.e., you are metaphysically the same person), Past You has no inherent normative authority over Present You. Autonomy is synchronous, not diachronic. The "right to rule" resets at every moment.
  *   **Philosophical Lineage:** Radical Autonomy Theories, some interpretations of Existentialism.
  *   **Verdict:** **The Contract Law Killer.**
      *   This is the dangerous claim. If accepted, it doesn't just void ADs; it voids mortgages, marriage vows, and employment contracts. It implies that any change in preference (even without dementia) allows the current temporal slice to repudiate the commitments of the previous slice.
      *   Society functions on the assumption that diachronic identity *does* confer normative authority (the "Ulysses Pact" principle). We allow Past Me to bind Present Me precisely to overcome Present Me's weakness of will or temporary instability.
      *   **Status:** **False/Unworkable.** If you accept this, you must reject the concept of "pre-commitment" entirely. Most legal systems explicitly reject this by enforcing contracts against later objections unless specific conditions (duress, incapacity) are met.

  ---

  ### The Bioethicist's Actual Position
  When bioethicists argue against enforcing ADs in advanced dementia, they are rarely using Claim 1 (Humean Bundle) or Claim 3 (Normative Authority Gap). They are using a hybrid of **Claim 2 (Psychological Cutoff)** and a specific theory of **Interests**.

  *   **The Dworkin Distinction:** Ronald Dworkin argued for "Critical Interests" (values that make a life good overall, held by Past You) vs. "Experiential Interests" (what feels good right now, held by Present You).
  *   **The Dresser Objection:** Rebecca Dresser argues that when the Psychological Cutoff is crossed, the "new" person has their own experiential interests that outweigh the "ghost" critical interests of the dead predecessor.
  *   **Why they don't use Claim 3:** If they argued that Past Me *never* has authority over Present Me, they would undermine informed consent (which relies on Past Me signing a consent form for Future Me's surgery). They need the Psychological Cutoff to explain why dementia is a *special case* where the authority link is severed, rather than a universal rule.

  ---

  ### The Epistemic Access Argument: Separate or Smuggling?
  **The Argument:** "Past You should decide because Past You had privileged epistemic access to your true values before cognitive decline."

  **Analysis:**
  This is **smuggling in normative authority** under the guise of epistemology.

  1.  **Pure Epistemology:** If this were purely about knowledge, it would mean: "Past You knew what you wanted, but Present You has forgotten." This supports the AD.
  2.  **Normative Smuggling:** The argument actually functions as: "Past You's values are the *correct* ones, and Present You's values are *corrupted*."
      *   If Present You (with dementia) is genuinely happy and has new values, claiming Past You has "privileged access" is a way of saying Present You's values don't count.
      *   It assumes that "True Values" are static and located in the past, rather than dynamic and located in the present.

  **Verdict:** It is a **separate claim** only if you believe values are fixed discoveries (Platonic). If you believe values are constructed through experience (Existential/Pragmatic), then the Epistemic Access argument collapses into the Normative Authority claim: it asserts Past You's *right* to define the good, not just their *knowledge* of it.

  ### Summary Table

  | Claim | Core Assertion | Verdict | Impact on Contract Law | Bioethics Utility |
  | :--- | :--- | :--- | :--- | :--- |
  | **Humean Bundle** | No self persists; only temporal slices exist. | Metaphysical Platitude | **Destroys it.** (No one to sue) | **Low.** Too abstract for clinical use. |
  | **Psychological Cutoff** | Identity breaks when psychology breaks (e.g., dementia). | **The Bioethicist's Standard.** | **Safe.** (Threshold based) | **High.** Distinguishes dementia from ordinary change. |
  | **Normative Gap** | Identity doesn't grant authority; autonomy is synchronous. | **Radical/False.** | **Destroys it.** (No binding contracts) | **Low.** Undermines informed consent. |
  | **Epistemic Access** | Past self knows "true" values better. | **Normative Smuggling.** | **Neutral.** (Assumes agency holds) | **Mixed.** Defends ADs, but begs the question on value change. |

  ### Final Recommendation
  If you are digging through LW threads to update your own stance on ADs:
  1.  **Reject the "Stranger" analogy for normal life.** It relies on the Normative Authority Gap, which makes planning impossible.
  2.  **Accept the "Stranger" analogy for radical psychological discontinuity.** This relies on the Psychological Cutoff. This is the only coherent way to handle advanced dementia cases without violating the rights of the currently existing conscious entity.
  3.  **Treat Epistemic Access with suspicion.** It is often a rhetorical device to privilege "Critical Interests" over "Experiential Interests." If you value the happiness of the current conscious state (the demented patient) over the abstract narrative of the life (the prior person's will), the epistemic argument fails.

  The "Past You is a Stranger" line is only true if the psychological connection is severed. If the connection holds, Past You is not a stranger; they are a trustee. The ethical work lies in defining when the trusteeship is voided.
