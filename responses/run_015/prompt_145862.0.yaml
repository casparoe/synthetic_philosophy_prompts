answer: |-
  **Title:** The Accidental Mercantilist: Habit, Hume, and the Ratchet Effect of Specie

  **I. The Internal Contradiction**

  David Hume's *Political Discourses* is traditionally read as the tombstone of Mercantilism. By distinguishing money from wealth and describing the price-specie flow mechanism, Hume appears to demonstrate that attempting to accumulate bullion is not only futile but self-defeating. However, this reading relies on a separation between Hume's economics and his moral psychology that cannot hold. If we take Hume's account of money seriously—specifically his admission that new money stimulates industry in the short run—and filter it through his foundational commitment to the persistence of habit, the Mercantilist policy returns not as a superstition, but as a rational strategy for capacity building.

  To make this case, we must distinguish between two effects of monetary expansion. First, the **pass-through effect**: the temporary rise in demand and output that occurs while prices lag behind the new money supply. This is transient; once prices adjust, real variables return to equilibrium. Second, the **ratchet effect**: the durable residue left behind after the money drains away. This includes physical capital (workshops, tools), social capital (credit networks), and, most critically, human capital (the habit of industry).

  Hume explicitly endorses the pass-through effect. He writes that in the interval between the arrival of money and the rise of prices, the "spirit of industry" is roused. But Hume's entire philosophical system rests on the axiom that custom and habit are the primary guides of human life. Habits, once formed, do not evaporate the moment the stimulus is removed. Therefore, Hume is logically committed to the ratchet effect. If an inflow of specie converts a half-idle laborer into a habitual worker, that laborer remains more productive even after the specie has flowed out to pay for imports. Consequently, a policy designed to maintain a continuous favorable balance of trade—not to hoard a static stock of gold, but to sustain a flow of stimulus—becomes a mechanism for permanently ratcheting up national productive capacity. Hume's mockery of this policy survives only if the ratchet collapses into the pass-through, a position his own psychology forbids.

  **II. The Stylized Case: The Kingdom of Aethel**

  Consider a concrete application over a twenty-year horizon. Let us posit a poor country, Aethel, populated by artisans who traditionally work only six months of the year due to thin demand. They possess the skill but lack the incentive; the rest of the year is spent in idleness.

  **Years 1–5 (The Inflow):** Aethel discovers a mineral export or achieves a trade surplus, resulting in a sustained inflow of specie. Merchants have more coin; they order more goods. Prices have not yet risen. Artisans are offered wages for year-round work. Initially, they work for the money (pass-through). But by Year 5, having worked consistently, they have reorganized their domestic lives, purchased better looms, and established credit with suppliers. Crucially, they have acquired the *habit* of industry. Idleness has become uncomfortable; work has become routine.

  **Years 6–10 (The Adjustment):** Hume's mechanism kicks in. Domestic prices rise. Aethel's goods become expensive relative to neighbors. The trade balance turns negative; specie begins to drain out to pay for imports. Under standard Humean theory, Aethel should return to its baseline. But the ratchet holds. Even as money leaves, the artisans do not immediately revert to six-month years. The tools remain; the credit networks hold; the habit persists. Aethel is now producing more output with a shrinking money stock. This implies that the velocity of money has structurally increased, or effectively, that the price level stabilizes at a point lower than pure quantity theory would predict because real supply has expanded.

  **Years 11–20 (The Policy Intervention):** Here is where the Mercantilist insight corrects Hume. If the state allows the drain to complete fully, the habit may eventually decay under the pressure of poverty. However, if the state uses tariffs or bounties to ensure a *new* inflow begins before the habit decays, the ratchet clicks up again. The country does not need to keep the gold from Years 1–5. It only needs a fresh flow of money in Year 12 to re-ignite demand while the capacity from Years 1–5 is still intact. Over two decades, Aethel does not end up with a vault full of useless coin (the Mercantilist fetish); it ends up with a vastly larger industrial base, higher skills, and lower real prices than its neighbors, sustained by a continuous turnover of specie rather than a stock.

  In this scenario, Hume's mockery of the Mercantilist is misplaced. The Mercantilist is not trying to freeze the water in the tank; they are trying to keep the water flowing through the turbine to grind the grain. Hume argues the water must leave; the Mercantilist replies, "Yes, but while it was here, it turned the wheel, and the wheel is still turning."

  **III. The Humean Replies**

  To save Hume from this indictment, a defender must argue why the ratchet fails to lock. There are three viable lines of defense, ranging from economic to political.

  **1. The Slack Constraint (Diminishing Returns)**
  Hume could argue that the ratchet effect is bounded by the availability of idle resources. The stimulus only creates permanent habits if there are idle hands to train. Once Aethel reaches full employment, further inflows produce only inflation (pure pass-through) with no real gain.
  *Critique:* This limits the scope of the Mercantilist policy but does not invalidate it. In the 18th-century context, "full employment" was a theoretical horizon, not a practical constraint. Seasonal underemployment was endemic. The ratchet has a very long runway before diminishing returns set in. This reply concedes that the policy works *up to a point*, which is sufficient to validate the Mercantilist impulse for a developing nation, even if it warns against over-saturation.

  **2. The Timing Mismatch**
  This is the strongest economic objection. Hume might argue that the price-specie flow mechanism operates faster than habit formation. If prices rise and money drains within months, but it takes years to form a habit of industry, the stimulus is removed before the ratchet clicks. The worker returns to idleness before the new routine is cemented.
  *Critique:* This relies on empirical speeds of adjustment that Hume does not establish. Hume admits the "interval" is long enough to matter politically. If the drain takes a decade (as historical bullion flows often did), there is ample time for habit formation. Furthermore, if the Mercantilist policy is active (tariffs, subsidies), it can slow the drain, intentionally stretching the interval to match the psychological timeline of habit formation. This reply makes the policy *difficult*, not *impossible*.

  **3. The Political Cost (Liberty and Misallocation)**
  Here, Hume retreats from economics to political philosophy. He might concede that the ratchet effect is real and that a favorable balance *could* increase capacity, but argue that the machinery required to enforce it is too costly. To maintain a continuous surplus, the state must impose tariffs, bounties, and prohibitions. This distorts the natural allocation of capital (directing it to inefficient sectors) and, more importantly for Hume, expands the power of the state at the expense of liberty. The cost of the bureaucratic apparatus and the loss of commercial freedom outweighs the gains from the ratchet effect.
  *Critique:* This is the most damaging reply, but it functions as a concession. By arguing that the policy is *too expensive* or *too dangerous*, Hume admits that the economic mechanism itself is sound. He shifts the ground from "this is impossible" to "this is inadvisable." This shrinks my thesis but does not destroy it. It transforms Hume from a theorist who proved the Mercantilists wrong about *how the world works*, into a theorist who argued the Mercantilists were wrong about *what is worth doing*. The economic core of the Mercantilist argument—that money flows can build real capacity—remains standing, validated by Hume's own psychology, even if Hume rejects the political price tag.

  **IV. The Weakest Link**

  The vulnerability in this argument lies in the assumption of habit persistence during economic contraction. Hume's psychology suggests habits are sticky, but his economics suggests that when money drains, prices fall and demand collapses. If the artisan has built a habit of industry but finds no one willing to buy his goods because the money supply has contracted, does the habit survive?

  There is a risk that the "habit of industry" is not an intrinsic virtue but a response to price signals. If the drain causes a recession, the worker may be *willing* to work but *unable* to find employment. In this case, the ratchet does not just stop; it may reverse. Prolonged unemployment could breed despair or social unrest, actively eroding the social capital built during the boom. Hume's system assumes a smooth adjustment, but if the drain creates a crisis of demand that outpaces the flexibility of wages, the permanent capacity gained in the boom could be destroyed in the bust. If the ratchet can slip backward, the Mercantilist strategy of "pump and let drain" becomes dangerous gambling rather than capacity building. This is the point where Hume's luck holds: if the adjustment is painful enough to break the habits, the pass-through effect remains dominant, and his polemic stands. But this is an empirical claim about the resilience of human capital, not a logical necessity of his system.

  **V. Conclusion**

  Hume's dismissal of Mercantilism relies on the assumption that money is a veil that, once lifted, leaves the real economy exactly as it was before. But Hume's own philosophy of mind insists that experience alters the agent. If money flows alter the experience of the worker, they alter the worker. By ignoring the durability of the "spirit of industry" he so vividly describes, Hume allows his economics to contradict his psychology. The Mercantilists were wrong to worship the stock of gold, but they were right to fear the stagnation of idle hands. Hume's system, properly understood, grants them the latter point. His victory over them rests on the hope that the ratchet slips as easily as the coin flows out—a hope his own theory of habit suggests is unfounded.
