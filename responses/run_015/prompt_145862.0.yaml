      *   *The Mercantilist Win:* If every inflow leaves a productivity ratchet, then *continuous* inflow (via policy) creates *continuous* ratcheting up of capacity. You don't need to hoard the gold; you just need to keep the flow positive long enough to lock in the habits before the gold leaves.
      *   *The Humean Dilemma:* To deny this, Hume must argue the habits vanish as fast as the gold, which contradicts his own moral psychology.

  3.  **Drafting - Section by Section:**

