answer: |-
  **Essay Question:**

  Critically evaluate the "procedural-fiction problem" within the paradox of fiction. In interactive media where horror imagery is algorithmically generated rather than intentionally authored, players often experience genuine dread. Assess whether this absence of specific authorial intent undermines the belief-emotion gap identified by Colin Radford, and determine whether Kendall Walton's account of quasi-emotions can accommodate procedural generation without significant revision.

  ***

  **Model Answer:**

  Colin Radford's paradox of fiction rests on three inconsistent conditions: (1) we experience genuine emotions only toward objects we believe exist; (2) we do not believe fictional objects exist; yet (3) we experience genuine emotions toward fictional objects. Traditionally, this tension is resolved by denying either the genuineness of the emotion or the necessity of existential belief. However, the procedural-fiction problem complicates this by removing the human author from the immediate causal chain of the emotional trigger.

  In authored fiction, the epistemic situation involves interpreting a communicator's intent. In procedurally generated media, the horror element is produced by an algorithm responding to player input. This alters the epistemic situation because there is no specific mental state behind the scare to interpret; there is only code executing logic. The player knows the threat is not "made up" by a narrator in the traditional sense, but generated by a system operating in real-time. This shifts the focus from narrative unreliability to systemic autonomy.

  Consequently, the belief-like commitment is not absent but structurally transformed. Radford assumes the object of emotion is the fictional entity (e.g., the monster). In procedural contexts, the object of dread is partially the system itself. The player believes the algorithm exists and possesses the capacity to generate distressing stimuli. Therefore, the belief-emotion gap narrows because the player genuinely believes in the existence of the generating mechanism, even if they deny the ontology of the monster. The emotion is grounded in the reality of the software's agency rather than the fiction of the creature.

  Kendall Walton's theory of quasi-emotions relies on make-believe, where props prescribe imaginings. Walton assumes a collaborative game of pretense between author and audience. Procedural generation challenges this because algorithms do not "pretend"; they compute. However, Walton's account can accommodate this if the algorithm is viewed as a dynamic prop rather than a co-pretender. The player still engages in pretense, but the props are unstable and reactive. Yet, this requires revision: Walton's theory assumes fixed props prescribed by an author. If the props generate themselves, the "principles of generation" are opaque, potentially breaking the collaborative framework required for quasi-emotion.

  Ultimately, the procedural-fiction problem suggests the paradox requires a new theoretical category. Radford's gap relies on a static distinction between existence and fiction, while Walton relies on intentional communication. Procedural generation introduces a third ontological status: systemic reality. Because the dread stems from a real system's unpredictable behavior rather than a imagined narrative event, standard theories fail to capture the hybrid nature of the experience. Therefore, neither Radford's belief condition nor Walton's pretense fully explains procedural dread without acknowledging the unique metaphysics of algorithmic agency.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Statement of Radford's Conditions (4 Marks)**
  *   **4 Marks:** Clearly articulates the inconsistent triad (emotion requires belief; fiction denies belief; we feel emotion).
  *   **2-3 Marks:** Identifies the tension but omits one condition or imprecise wording.
  *   **0-1 Marks:** Vague summary or incorrect attribution.

  **2. Epistemic Situation of Procedural Generation (4 Marks)**
  *   **4 Marks:** Distinguishes algorithmic output from authorial intent; highlights the shift from interpreting mind to reacting to system.
  *   **2-3 Marks:** Notes the lack of author but fails to explain the epistemic shift.
  *   **0-1 Marks:** Treats procedural generation as identical to standard narration.

  **3. Analysis of Belief-Like Commitment (4 Marks)**
  *   **4 Marks:** Argues belief is transformed (belief in system) rather than absent; connects this to Radford's gap.
  *   **2-3 Marks:** Claims belief is simply absent or present without nuance.
  *   **0-1 Marks:** Ignores the role of belief in the argument.

  **4. Evaluation of Walton's Pretense Theory (4 Marks)**
  *   **4 Marks:** Addresses the lack of algorithmic pretense; evaluates if dynamic props fit Walton's framework; notes need for revision.
  *   **2-3 Marks:** Applies Walton mechanically without addressing the algorithmic constraint.
  *   **0-1 Marks:** Incorrectly applies Walton or ignores the prompt's constraint.

  **5. Defended Conclusion (4 Marks)**
  *   **4 Marks:** Defends whether a new category is needed based on previous analysis (systemic vs. narrative).
  *   **2-3 Marks:** Offers a conclusion without sufficient justification.
  *   **0-1 Marks:** No clear conclusion.

  **Differentiation Criteria (A vs. B Grade):**
  *   **A Grade (17-20 Marks):** Successfully distinguishes procedural generation from mere unreliable narration. Recognizes that the *system* is real even if the *content* is fictional.
  *   **B Grade (14-16 Marks):** **Critical Error:** Conflates procedural generation with unreliable authorship (e.g., treating the algorithm as a lying narrator). Fails to identify the ontological shift regarding the system's reality.
  *   **C Grade (10-13 Marks):** Summarizes Radford/Walton without applying them to the specific procedural context.
