prompt: |-
  I'm teaching a graduate seminar on decision theory this term, and we've reached the updateless decision theory literature, and I have to confess the debate has stalled in a way I find genuinely frustrating rather than merely unresolved. Everyone in the room agrees on the setup of Newcomb's problem, and everyone can recite the three standard responses: the causal decision theorist who two-boxes on dominance grounds because the prediction is already fixed in the causal past; the evidentialist who one-boxes because the act is strong evidence of the predictor's output; and the updateless camp (the various UDT, FDT, and TDT formulations) who reframe the question as one about which decision procedure to implement, and one-box on that basis. What I cannot get my students to see is why these three positions keep passing each other on the variants — the cases involving a copy of the agent, the transparent or partially transparent predictors, the cases in which the relevant "algorithm" is genuinely ambiguous — without any of them conceding a single point. My working hypothesis, which I want you to treat as a hypothesis and not as a conclusion, is that the impasse is not really about Newomb at all: I suspect the causal and updateless sides are disagreeing about what the fundamental causal unit is (the isolated decision event versus the reusable decision procedure), and that they are in fact using the word "rational" to mean two different things — "maximizes causal expected utility from the decision point" versus "implements the procedure that, from a god's-eye view, yields the best outcome" — so that they are answering different questions under a single heading.

  What I want is a diagnosis of the *structure* of this disagreement, supported by what each camp actually says and actually relies on, not a survey of the positions and not a verdict on who is right about the boxes. In particular: is the impasse a verbal one (a hidden disagreement about what "rational" or "the same decision situation" even mean), a substantive one about the ontology of decision-making (whether a stable, identifiable "algorithm" is a real, causally efficacious entity or a convenient fiction), or two groups answering different questions under one name? And within the updateless camp itself, I suspect the UDT/FDT/TDT splits are not cosmetic but track a real, still-open technical question about how to formalize the correlation between distinct instances of the same procedure; please say whether that suspicion is right and identify the actual technical crux on which those formulations diverge.

  Think very carefully before answering, and respond in the style of an expert who has worked through the formalism rather than one summarizing a review article. Given your diagnosis, tell me honestly what, if anything, would count as progress — a conceptual distinction, a formal result, a redefinition of the decision problem, or a change of question — or argue that no progress should be expected and say precisely why this disagreement is of the kind that resists resolution.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A graduate seminar instructor teaching decision theory. They are frustrated by the stalemate in the classroom regarding Updateless Decision Theory (UDT), Functional Decision Theory (FDT), and Timeless Decision Theory (TDT) versus Causal Decision Theory (CDT) and Evidential Decision Theory (EDT).
      *   **Context:** The class understands the basics (Newcomb's Problem, the three standard responses) but can't move past the variants (copies, transparent boxes, algorithmic ambiguity).
      *   **User's Hypothesis:** The impasse isn't about Newcomb per se, but about the *fundamental causal unit* (event vs. procedure) and the definition of *rationality* (local maximization vs. global procedure optimization).
      *   **Task:** Diagnose the *structure* of the disagreement. Is it verbal, substantive (ontological), or talking past each other? Analyze the internal splits within the updateless camp (UDT/FDT/TDT). Determine what would count as progress or if the disagreement is intractable.
      *   **Tone/Style:** Expert who has worked through the formalism, not a summarizer of review articles. Rigorous, precise, avoiding hand-waving.

  2.  **Deconstruct the Core Disagreement (CDT vs. Updateless):**
      *   *CDT View:* The decision node is a local intervention. $P(outcome | do(action))$. The past is fixed. Correlations without causation are irrelevant.
      *   *Updateless View (UDT/FDT/TDT):* The decision node is an instance of a logical/computational pattern. The "action" is the output of a function. Correlations arise because the predictor simulates the *same function*.
      *   *The User's Hypothesis:* They are right. It's about the "locus of agency."
      *   *Refinement:* It's deeper than just "rationality." It's about *counterfactual semantics*. CDT uses physical counterfactuals (surgical intervention on a node in a causal graph). Updateless uses logical counterfactuals (intervention on the output of a computation).
      *   *Ontology:* Is the "algorithm" a real thing that can be causally efficacious across space/time? CDT says no (only physical tokens matter). Updateless says yes (logical facts constrain physical tokens).
      *   *Verbal vs. Substantive:* It's substantive *if* you care about winning (getting the money). It's verbal *if* you care about defining "rationality" as "following specific normative rules of local causality." But since Newcomb is set up to punish local causality, the substantive claim is that CDT is *self-defeating*.

  3.  **Analyze the Updateless Internal Splits (UDT vs. TDT vs. FDT):**
      *   *TDT (Pearl-inspired, Yudkowsky):* Focuses on "logical nodes" in a causal graph. Uses a specific notion of "logical uncertainty." Crux: How to define the graph structure when logical dependencies are involved.
      *   *UDT (Wei Dai):* More abstract. Maximizes expected utility over policies *before* receiving observations. "Updateless" means don't condition on your specific existence/observation if it correlates with the outcome. Crux: The prior over world-programs. How to handle indexical uncertainty.
      *   *FDT (Yudkowsky/Soares):* Explicitly frames it as "deciding the output of a function." Distinguishes physical, evidential, and subjunctive dependence. Crux: The definition of "subjunctive dependence." When do two physical systems count as running the "same" algorithm? (Isomorphism vs. bisimulation vs. something else).
      *   *The Technical Crux:* It's the **Logical Counterfactual Problem**. How do you define $P(World | Algorithm \ outputs \ X)$ when the algorithm is mathematically determined? If math is necessary, how can it be otherwise? All updateless theories struggle with "impossible" counterfactuals (e.g., if $2+2=4$, what if I output 5?).
      *   *Divergence:* UDT tends to be more prior-based (global policy). FDT/TDT try to be more graph-based (local logical nodes). The split is about how to formalize "logical causation."

  4.  **Evaluate Progress/Resolution:**
      *   *Can it be resolved?* Not easily. It hinges on the philosophy of mathematics and computation.
      *   *What counts as progress?*
          1.  A formal theory of logical counterfactuals (e.g., MIRI's work on logical induction, though still incomplete).
          2.  A robust criterion for "algorithmic identity" (when are two processes the same decision?).
          3.  Showing that CDT is dynamically inconsistent in a way that cannot be patched by precommitment (UDT advocates claim this; CDT advocates claim precommitment is a separate act).
      *   *Why it resists resolution:* CDT defenders retreat to "rationality isn't about winning, it's about process integrity." Updateless defenders say "rationality *is* about winning." This is a normative clash, not just positive.

  5.  **Drafting the Response (Iterative refinement for tone and depth):**
