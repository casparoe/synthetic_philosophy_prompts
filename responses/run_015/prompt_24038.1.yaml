answer: |-
  Your hypothesis is correct, but it requires sharpening. The impasse is not merely verbal, nor is it purely ontological in a metaphysical sense. It is a **semantic and formal divergence regarding the semantics of counterfactuals**. The disagreement stems from incompatible definitions of the intervention operator within the expected utility calculus.

  Here is the diagnosis of the structure, the internal fractures within the updateless camp, and the prospects for resolution.

  ### 1. The Structure of the Impasse: Counterfactual Semantics

  You suspect the camps are using "rational" to mean different things. This is true, but it is a symptom, not the cause. The root cause is that CDT and Updateless Decision Theory (UDT/FDT/TDT) are operating with incompatible **models of modality**.

  **Causal Decision Theory (CDT)** relies on Pearl-style causal graphs. The intervention operator $do(A=a)$ is defined as a *surgical severing* of incoming arrows to node $A$, fixing its value to $a$, and propagating effects forward through physical causal channels.
  *   **The Commitment:** The only valid counterfactuals are *physical* counterfactuals. "If I were to one-box" means "If a local miracle occurred at the decision node such that the output was one-box, holding the past fixed."
  *   **The Blind Spot:** CDT treats the correlation between the agent's decision and Omega's prediction as *evidential* only. Because the arrow runs from Decision $\to$ Outcome, and Prediction $\to$ Outcome, but not Decision $\to$ Prediction (in physical time), CDT assigns probability 0 to the decision influencing the prediction.
  *   **The Definition of Rationality:** Rationality is **process integrity**. An agent is rational if it adheres to the normative rules of local causal manipulation. If the universe punishes you for following correct causal reasoning (as in Newcomb), CDT accepts this as a feature of a hostile environment, not a flaw in the reasoning.

  **Updateless Decision Theory (UDT/FDT/TDT)** relies on **logical** or **computational** graphs. The intervention operator is defined on the *output of a function*, not the physical event.
  *   **The Commitment:** The valid counterfactuals are *logical* counterfactuals. "If I were to one-box" means "If the mathematical function $Agent(Observation)$ returned 'one-box'." Since Omega's prediction is computed by $Sim(Agent)$, changing the output of $Agent$ logically necessitates changing the output of $Sim(Agent)$, regardless of physical separation.
  *   **The Blind Spot:** This requires a notion of "subjunctive dependence" (FDT terminology) that transcends spacetime. It treats the algorithm as a Platonic entity instantiated in multiple physical locations.
  *   **The Definition of Rationality:** Rationality is **success orientation**. An agent is rational if it implements the policy that maximizes utility across the set of logically possible worlds weighted by their prior probability. If a reasoning procedure yields less money than another, it is defective, regardless of its causal purity.

  **Diagnosis:** This is a **substantive disagreement about the topology of decision space**.
  *   If you believe the "decision" is a physical event located at $(x, y, z, t)$, CDT is correct, and Newcomb's problem is a trick question where the setup implies impossible physics (backwards causation) or irrelevant correlations.
  *   If you believe the "decision" is the evaluation of a logical function that can be instantiated at multiple $(x, y, z, t)$ coordinates, Updateless theory is correct, and CDT is failing to recognize the causal efficacy of logical facts.

  It is not verbal because it yields different actions in variants like the **Psychopath Button** or **Transparent Newcomb**. It is not merely ontological because both sides agree on the physical arrangement of boxes and neurons; they disagree on which physical arrangements count as "the same decision."

  ### 2. The Internal Splits: UDT vs. TDT vs. FDT

  Your suspicion that the splits within the updateless camp are non-cosmetic is correct. They track unresolved technical problems in formalizing **logical counterfactuals** and **algorithmic identity**.

  **The Technical Crux: The Problem of Logical Counterfactuals**
  In standard probability theory, if $A$ is a logical truth (e.g., $2+2=4$), then $P(B | \neg A)$ is undefined or zero. But decision theory requires asking: "What would happen if my algorithm outputted $X$?" when the algorithm is deterministically computed to output $Y$. To make Updateless Decision Theory work, you need a formalism where logical falsehoods have non-trivial consequences. None of the current formulations have a fully satisfactory, general solution to this.

  Here is how the camps diverge on this crux:

  1.  **TDT (Timeless Decision Theory):**
      *   **Approach:** Attempts to augment causal graphs with "logical nodes." It treats the decision as a node that constrains all other nodes computing the same function.
      *   **Fracture Point:** It lacks a rigorous criterion for when two physical processes count as computing the "same" function. Is it structural isomorphism? Behavioral equivalence? TDT often hand-waves the "logical uncertainty" component, relying on an intuitive notion of similarity that breaks down in **Adversarial Epistemology** cases (e.g., when the predictor simulates a slightly buggy version of you).

  2.  **UDT (Updateless Decision Theory - Wei Dai):**
      *   **Approach:** Avoids the counterfactual problem by shifting to **policy selection**. Instead of asking "What should I do now?", UDT asks "What policy $\pi$ should I have committed to before receiving any observations?" It maximizes $E[U | \pi]$ over the prior.
      *   **Fracture Point:** UDT pushes the problem into the **prior**. It requires a prior over "world-programs" that includes the agent's own source code. The technical difficulty is **indexical uncertainty**: How does the agent locate itself within the world-program? UDT struggles with variants where the agent's existence is correlated with the outcome (e.g., **Anthropic Mugging**). Different ways of formalizing the "self-location" prior yield different decisions.

  3.  **FDT (Functional Decision Theory - Yudkowsky/Soares):**
      *   **Approach:** Explicitly tackles the "same algorithm" problem via **subjunctive dependence**. It distinguishes between physical dependence (causal), evidential dependence (correlation), and subjunctive dependence (logical control).
      *   **Fracture Point:** The definition of subjunctive dependence remains the weakest link. In the **Blackmail Problem** or cases involving **Approximate Simulation**, FDT requires a metric for algorithmic similarity. If Omega simulates 99% of your code, does FDT one-box or two-box? FDT does not yet have a formal threshold for "sufficient similarity" to trigger logical control.

  **Summary of the Split:** UDT is a prior-based policy optimizer; TDT/FDT are graph-based interventionists. UDT fails on self-location/priors; FDT fails on algorithmic identity metrics. They are not the same theory; they are competing attempts to solve the **Logical Counterfactual Problem**.

  ### 3. Prospects for Progress

  You asked what would count as progress. I will be blunt: **No progress should be expected on the normative question until the formal problem of logical counterfactuals is solved.**

  Currently, the debate resists resolution because the Updateless camp is advocating for a decision theory that requires a mathematics we do not yet fully possess. CDT is mathematically well-defined (within the limits of causal graphs); Updateless theories are research programs.

  **What counts as progress:**

  1.  **A Formal Theory of Logical Counterfactuals:**
      Progress requires a formalism where statements like "If $2+2=4$, then $U=100$, but if $2+2=5$, then $U=0$" are well-defined and non-trivial. Work on **Logical Induction** (Garrabrant et al.) is a step toward this, allowing agents to assign probabilities to logical sentences before they are proven. However, integrating Logical Induction into a decision-theoretic framework that handles counterfactuals (not just beliefs) is an open problem. Until we can formally define $P(World | Algorithm \ outputs \ X)$ for a deterministic algorithm, UDT/FDT remain intuitive sketches.

  2.  **A Metric for Algorithmic Identity:**
      Progress requires a rigorous definition of when two physical systems are "running the same algorithm." This is not a philosophical question but a computational one. Is it bisimulation? Is it compression distance? The Updateless camp needs a formal criterion that explains why Omega's simulation controls your box, but a random rock does not, without appealing to intuition.

  3.  **Dynamic Inconsistency Proofs:**
      The strongest argument against CDT is **dynamic inconsistency**. A CDT agent at $t_0$ knows that at $t_1$ (in Newcomb's problem) it will two-box, and wishes it could precommit. A CDT agent will pay to restrict its own future freedom.
      *   *Progress:* A formal proof showing that CDT cannot be "patched" by precommitment without collapsing into UDT. If CDT advocates argue "Just precommit," show that the cost of precommitment in complex environments (where you don't know which correlations will arise) makes UDT the only stable fixed point.

  **Why it resists resolution:**
  The disagreement is ultimately **normative**.
  *   The CDT advocate says: "I define rationality as acting appropriately given the causal constraints of the present moment. If the universe rewards irrationality, that is not my concern."
  *   The UDT advocate says: "I define rationality as winning. If your definition of rationality systematically loses, your definition is wrong."

  This is a clash of **reflective equilibria**. You cannot prove one definition of "rational" is correct without appealing to a higher-order definition of "correct."

  ### Recommendation for the Seminar

  Stop asking "Who is right about Newcomb?" The setup is too stylized. Shift the seminar to the **formal prerequisites** of the Updateless position.

  1.  **Assign the "Logical Counterfactual" Problem:** Ask students to formally define the probability distribution over worlds where the agent's source code outputs a different value than it actually does. If they cannot do this without contradiction, they have identified the bottleneck.
  2.  **Focus on Algorithmic Identity:** Present a case where Omega simulates the agent with a 1-bit error. Does the updateless agent one-box? If yes, why? If no, where is the cutoff? This forces the FDT/UDT camp to confront the lack of a similarity metric.
  3.  **Reframe the CDT Defense:** Ask the CDT students to formalize "precommitment." Show that a CDT agent that can precommit on *all* possible correlations effectively becomes a UDT agent. The question then becomes: Is "CDT + Universal Precommitment" distinct from UDT, or is it UDT in disguise?

  **Verdict:** The impasse is real. It is not a misunderstanding. It is a boundary marker where decision theory meets the philosophy of mathematics. The Updateless camp is betting that "computation" is a fundamental category of reality that supports counterfactuals; the CDT camp is betting that only "physics" supports counterfactuals. Until we have a theory of **Logical Causation**, the debate will remain a stalemate of intuitions.
