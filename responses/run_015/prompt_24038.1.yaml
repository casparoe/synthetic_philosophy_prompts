      *   *Section 2: The Updateless Splits.* Address UDT/FDT/TDT. Confirm the suspicion that they aren't cosmetic. The crux is **Logical Counterfactuals** and **Algorithmic Identity**. FDT tries to solve the "same algorithm" problem explicitly. UDT pushes it to the prior. TDT tries to graph it. None have a fully satisfactory formalization of "logical causation."
      *   *Section 3: Prospects for Progress.* Be honest. It's stuck on the philosophy of math. Progress requires a formal theory of logical counterfactuals (e.g., embedding agents in mathematics). Until then, it's a clash of normative intuitions (Process vs. Outcome).
