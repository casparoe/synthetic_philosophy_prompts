answer: |-
  **1. The Precise Question**

  The central philosophical question of this study is: Can the Buddhist doctrine of *anatta* (no-self) be coherently reconstructed as a theory of relational persistence, distinct from both substance dualism and reductive bundle theory? Standard metaphysical categorizations typically force *anatta* into existing Western frameworks: either as a denial of substance compatible with Humean bundle theory (where the self is merely a collection of perceptions) or as a narrative-identity view (where the self is a constructed story). Both options presuppose a dichotomy between essentialist continuity and eliminative reductionism. This project interrogates whether *pratītyasamutpāda* (dependent origination) offers a third ontological category. Specifically, I ask whether personal continuity is best understood not as a static entity or a semantic construction, but as a dynamically maintained network of causal-functional dependencies. To answer this, key terms must be stabilized: "relational persistence" refers to continuity grounded solely in the structural integrity of causal relations rather than underlying substrates; "reductive functionalism" refers to the claim that these relations exhaust the ontology of the person with no remainder. The inquiry seeks to determine if a relational ontology avoids the pitfalls of reductionism while remaining metaphysically robust enough to account for moral responsibility and soteriological transformation without positing a self.

  **2. The Gap in Existing Answers**

  Current scholarship on *anatta* largely operates within a constrained interpretive field that obscures the specific metaphysical contribution of dependent origination. The dominant strategy maps *anatta* onto Western bundle theory. While this correctly denies substantialism, it often imports Humean atomism, treating mental events as discrete units linked by association rather than mutually constitutive processes. This reading fails to capture the dynamic, systemic interdependence central to *pratītyasamutpāda*, where phenomena exist only in virtue of their relational conditions. Alternatively, contemporary philosophers of religion often interpret *anatta* through the lens of narrative identity. This approach preserves continuity through story-structure but risks linguistic idealism, locating the self in semantic coherence rather than ontological causality. Both interpretations inadvertently reinforce a false dichotomy: one must choose between a robust self (substance/narrative) or no self (bundle/elimination).

  Consequently, the option of relational persistence remains underexplored or is wrongly conflated with reductive functionalism. When *anatta* is read as functionalism, the normative and soteriological weight of the doctrine is often lost; if the self is merely a functional placeholder, the liberation from suffering becomes a computational adjustment rather than an ontological realization. The gap lies in the lack of a constructive metaphysical account that treats relations as ontologically primary without collapsing into reductionism. Existing literature identifies the problem of personal identity in Buddhism but rarely offers a positive account of continuity that relies neither on essence nor on linguistic construction. This project addresses that lacuna by isolating the causal-functional network as a distinct metaphysical category, arguing that the standard interpretations miss the structural nuance required to sustain continuity without substance.

  **3. Method and Approach**

  This project will employ constructive conceptual analysis rather than mere exegetical survey. The primary method involves reconstructing the logic of *pratītyasamutpāda* as a metaphysical principle of individuation, distinct from its traditional soteriological context. I will analyze the causal structures implied by dependent origination to determine if they support a model of persistence based on systemic maintenance rather than temporal endurance. This requires isolating the concept of "relation" from "relata" to see if the former can carry ontological weight independently.

  Second, I will utilize resources from process metaphysics as a comparative framework. By examining how process philosophy handles continuity without substance, I can test whether the Buddhist model offers unique constraints or advantages, specifically regarding the dynamic maintenance of identity. Third, I will examine hierarchical predictive models of cognition not as empirical evidence, but as structural analogues. These models describe cognition as a network of error-minimizing predictions, offering a formal topology similar to dependent origination. This analogy will be used heuristically to clarify how a system can maintain coherence without a central controller.

  This approach is justified over pure textual exegesis because the goal is not historical reconstruction but metaphysical viability. A purely historical approach would limit the study to what early texts explicitly say, whereas this project asks what the doctrine *implies* for contemporary metaphysics. Similarly, this approach avoids empirical neuroscience; the predictive models are used for their logical structure, not their biological accuracy. This ensures the project remains within the domain of philosophy of religion and metaphysics, focusing on conceptual coherence rather than scientific validation. The work will proceed by defining the relational model, testing it against standard objections to bundle theory, and evaluating its capacity to support moral continuity.

  **4. Possible Conclusions and Decision Criteria**

  The study will likely converge on one of two distinct conclusions. The first positive conclusion is that relational persistence constitutes a coherent third option between reductionism and non-reductionism. On this view, *anatta* denies the self as a thing but affirms the self as a processual event maintained by causal dependencies. This would demonstrate that personal continuity is real but ontologically lightweight, sufficient for moral responsibility without requiring a substantial soul. The second negative conclusion is that relational persistence inevitably collapses into reductive functionalism. If the network of dependencies is all that exists, with no emergent property distinct from the sum of parts, then *anatta* offers no metaphysical advantage over standard physicalist reductionism, potentially undermining the soteriological claim that realizing *anatta* changes one's ontological status.

  The decision between these conclusions will rest on two specific criteria. First, the criterion of non-collapse: I will assess whether the relational model can articulate a difference between "existing dependently" and "existing merely functionally." If the distinction cannot be maintained without smuggling in subtle essentialism, the reductionist conclusion holds. Second, the criterion of soteriological coherence: I will evaluate whether the model explains how insight into dependent origination leads to liberation. If the relational model makes the self too robust, liberation becomes impossible; if it makes the self too thin, liberation becomes trivial. Success requires showing that relational persistence allows for a transformation of the network itself, not just a change in description. If the model supports both metaphysical coherence and soteriological efficacy, the third-option hypothesis is confirmed. If it fails either test, the project will conclude that the standard dichotomy remains unavoidable.

  **5. Scope, Risks, and Failure Conditions**

  The scope of this independent study is limited to a single semester with a final output of approximately 5,000 words. This constraint necessitates a narrow focus on the metaphysical structure of persistence rather than a comprehensive history of Buddhist philosophy. I will restrict textual analysis to core concepts of *anatta* and *pratītyasamutpāda* without attempting to reconcile differences between early Buddhist schools or Mahayana developments. The primary risk is scope creep, specifically the temptation to resolve the entire mind-body problem within this framework. To mitigate this, I will treat cognitive science analogies strictly as structural metaphors, avoiding engagement with empirical data or neuroscience debates.

  A significant risk involves the improper importation of empirical claims. Using predictive processing models carries the danger of conflating philosophical logic with biological fact. I will avoid this by framing these models as conceptual tools for understanding causal networks, not as scientific proofs of Buddhist doctrine. The project will be deemed a failure if I cannot clearly distinguish relational persistence from standard functionalism within the word limit. If the final paper argues that the distinction is merely verbal or relies on obscure terminology to mask a reductionist stance, the core hypothesis will not have been substantiated. Additionally, failure will occur if the argument depends on specific, contested interpretations of Buddhist texts that require extensive defense, thereby displacing the metaphysical work. Success requires a clear, self-contained argument that stands on philosophical merit regardless of textual consensus.
