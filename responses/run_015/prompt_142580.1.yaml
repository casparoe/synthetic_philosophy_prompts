answer: |-
  **PREP SHEET: CONTESTED MEMORY SYMPOSIUM**

  **1. The Headline Risk**
  **Who:** Local Journalist
  **Objection:** "So you're arguing Confederate statues should stay because losing the Civil War was actually good for the South? That sounds like you're celebrating defeat."
  **Likelihood:** High | **Damage:** 5
  **Reply:** I'm not celebrating defeat; I'm diagnosing why the memory persists. My test asks: would this memorial exist if they'd won? If the Confederacy had won, these statues would be state cults enforcing slavery, not "heritage." The loss allowed later generations to inherit the symbol without the burden of the reality. That doesn't mean the cause was good; it means the memory is fragile. It relies on the loss to sanitize the cause. Knowing this helps you decide: if the memory only works because they lost, it's likely masking harm. That suggests removal or heavy recontextualization, not preservation.
  **Soft Spot:** Sounds like I'm saying the loss was beneficial. **Follow-up:** "Beneficial for the myth, not the people."
  **Instruction:** Reframe

  **2. The Power Charge**
  **Who:** Philosopher (Historical Injustice)
  **Objection:** "Who gets to construct the counterfactual? Doesn't this let dominant groups decide what 'would have happened' to justify keeping their monuments?"
  **Likelihood:** High | **Damage:** 5
  **Reply:** That's exactly why this can't be a private philosophical verdict. The counterfactual isn't a guess; it's a constraint check. We look at the cause's professed ideals. If the ideal requires oppression to function, victory would have forced that oppression into the open. We don't need to know the future; we need to know the intent. If the cause's own documents say slavery is positive, a victory means more slavery. The test doesn't ask the powerful to decide; it asks them to face what their victory would have entailed. It strips away the tragedy mask.
  **Soft Spot:** Assumes ideals are transparent. **Follow-up:** "What if they lied about their ideals?"
  **Instruction:** Hold

  **3. The Process Gap**
  **Who:** Public History Practitioner
  **Objection:** "This is intellectually sharp, but I can't take 'vindication-fragile' to a city council. How does this become a procedure I can defend?"
  **Likelihood:** High | **Damage:** 4
  **Reply:** Don't use the jargon. Use the question: "Would this statue still make sense if their side had won?" If the answer is no, you tell the council: "This memory depends on the loss to hide the harm." That shifts the burden. Instead of arguing about history, you're arguing about function. If the function relies on a sanitized defeat, a plaque won't fix it because the plaque admits the defeat while the statue glorifies the cause. You recommend removal because the object itself is the dodge, not the lack of text.
  **Soft Spot:** Doesn't give a step-by-step rubric. **Follow-up:** "What about community consultation?"
  **Instruction:** Reframe

  **4. The Methodology Attack**
  **Who:** Historian (General)
  **Objection:** "Counterfactuals are fiction. You're building ethical prescriptions on what didn't happen. That's not history; it's fantasy."
  **Likelihood:** Medium | **Damage:** 4
  **Reply:** I agree counterfactuals are dangerous in history. But in memory studies, we aren't tracking events; we're tracking meanings. The community *already* lives in a counterfactual when they say "Imagine if they'd won." I'm just making that explicit. We don't need to know the battle outcomes; we need to know the political project. If the project was incompatible with human rights, victory would have forced that incompatibility into law. I'm not predicting battles; I'm testing consistency. The fantasy is already there; I'm just checking its structural integrity.
  **Soft Spot:** Blurs history and philosophy. **Follow-up:** "Where do you draw the line?"
  **Instruction:** Hold

  **5. The Betrayal Charge**
  **Who:** Philosopher (Collective Memory)
  **Objection:** "You're saying some defeats are auspicious. That sounds like telling victims their loss was beneficial. That betrays the dead."
  **Likelihood:** Medium | **Damage:** 4
  **Reply:** It's not beneficial for the victims; it's beneficial for the perpetrators' descendants. That's the tragedy. The loss spared the victors from having to live out their worst ideals. I'm not saying the dead should be forgotten; I'm saying the *memorial* might be insulting to them because it uses their loss to hide the cause's cruelty. If we keep a monument that relies on 'moral alchemy' to turn guilt into grief, we are dishonoring the victims by accepting the alchemy. Removal honors them by refusing the trick.
  **Soft Spot:** "Auspicious" is a toxic word. **Follow-up:** "Use 'structurally fragile' instead."
  **Instruction:** Concede

  **6. The Harm Blindspot**
  **Who:** Historian (Balkans)
  **Objection:** "Kosovo 1389 isn't just a pledge; it's used to justify ethnic cleansing. Your test misses the active harm because it focuses on the defeat."
  **Likelihood:** Medium | **Damage:** 3
  **Reply:** The test doesn't ignore harm; it explains why the harm persists. Because the cause lost, it remains a 'pledge' rather than a record of administration. It stays pure because it never had to govern. That purity is what fuels the violence. My test identifies this as vindication-fragile: the memory works *because* they lost. That means the memorial isn't a historical record; it's a weaponized promise. The recommendation isn't preservation; it's disruption. The test flags it as dangerous precisely because it's untested by reality.
  **Soft Spot:** Doesn't mandate removal explicitly. **Follow-up:** "So removal is implied?"
  **Instruction:** Hold

  **7. The Redundancy Charge**
  **Who:** Philosopher (Sceptic)
  **Objection:** "Isn't this just a fancy way of saying 'bad causes shouldn't be honored'? Why the counterfactual detour?"
  **Likelihood:** High | **Damage:** 5
  **Reply:** Because 'bad cause' is contested. People argue forever about whether the Confederacy was 'bad.' My test bypasses that. Even if you think the cause was noble, ask: would this statue exist if they'd won? If no, then the memory is doing work you aren't admitting. It separates the moral verdict from the structural diagnosis. You might think the cause was good, but if the memory relies on the loss to function, it's fragile. That tells you something new: the monument isn't sustaining memory; it's sustaining a myth about the loss.
  **Soft Spot:** Still requires moral judgment on 'function.' **Follow-up:** "Who judges the function?"
  **Instruction:** Hold

  ***

  **PRE-TALK CONCESSIONS**
  1.  **Counterfactual Limits:** Concede immediately that counterfactuals cannot predict specific historical outcomes, only structural pressures of the cause's stated ideals.
  2.  **Terminology:** Concede that "auspicious defeat" is provocative and clarify it means "structurally useful for myth-making," not morally good.
  3.  **Process:** Concede this is a diagnostic tool for ethicists, not a legal rubric for city councils, though it can inform their questions.

  **THE CRUCIAL REPLY**
  **Confirm:** Your guess is correct. The redundancy charge is the killer. If this is just "bad causes down," historians and practitioners will ignore it as moralizing. You must land the point that the counterfactual reveals *structural dependency* independent of moral agreement. If you fail here, you're just another philosopher telling people what to feel. The test must show *why* the memory persists despite the moral cost, not just that it should vanish.

  **WEAKEST JOINT (VOLUNTEER THIS)**
  Volunteer the problem of **identifying ideals**. Acknowledge that causes often lie about their own ideals (e.g., "states' rights" vs. slavery). Admit your test requires historians to establish the core project independently of the memorial myth. If the myth successfully obscures the ideal, the test stalls. Say you need their help to fix the historical record before the philosophical test can run.

  **QUESTION HOPING NOBODY ASKS**
  **Q:** "If a cause wins and commits genocide, do we remove those monuments too? Does your test only work for losers?"
  **A:** "The test applies to winners differently. If they won, the memory is vindication-dependent. We judge it by the record of what they actually did, not what they might have done. The 'lost cause' test is specifically for when the loss is doing the justificatory work. Winners stand on their deeds; losers stand on their dreams. We have better tools for judging deeds."
