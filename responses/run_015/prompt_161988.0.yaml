answer: |-
  This is a sharp, well-formed position. You are effectively advocating for a Ramsey rule where the pure rate of time preference ($\rho$ or $\delta$) is zero, but the effective discount rate ($r$) is determined by $r = \eta g + h$, where $h$ is a hazard rate (existential risk + institutional decay + value drift).

  This is the Stern/Parfit orthodoxy in normative economics, but your specific framing around "hazard-only" and the worry about "smuggling" PTP back in via value drift shows you're looking at the fault lines, not just the textbook summary.

  Here is the map of exposure you requested, ranked from **Fatal** (collapses the view into incoherence or its rival) to **Awkward** (costly concessions that don't break the theory), followed by a direct engagement with your four specific worry-clusters.

  ### Part I: The Exposure Map

  #### 1. Fatal: The "Just-So Hazard" Problem
  **The Charge:** If every instance of observed time preference can be retrofitted with a post-hoc hazard explanation (e.g., "You prefer money now because of inflation risk," "You prefer it now because you might die," "You prefer it now because values might drift"), the theory becomes unfalsifiable.
  **Why it's Fatal:** If "hazard" is defined broadly enough to capture *any* reason for discounting that isn't explicitly "time itself," then Hazard-Only Discounting (HOD) is semantically identical to "Rational Discounting." It loses its critical bite. If you cannot specify a hazard that *wouldn't* count (other than time itself), you haven't offered a theory of discounting; you've offered a theory of language.
  **Concession Required:** You must specify *exogenous* criteria for what counts as a valid hazard. It cannot be derived solely from the agent's revealed preference. It must be empirically measurable independent of the discount rate (e.g., actuarial tables for mortality, geological data for asteroid strikes). If you allow "subjective uncertainty about the future" to count as a hazard without constraint, you collapse into PTP.

  #### 2. Fatal: The Value-Drift Collapse
  **The Charge:** (Addressing your first specific worry). If you discount for "value drift" (the risk future people won't value what we leave them), and that risk correlates perfectly with time, you have reintroduced PTP under the label of "probability of utility realization."
  **Why it's Fatal:** Parfit's original argument against PTP rests on the claim that time *itself* is not a morally relevant difference. If you say, "Time matters because it correlates with value drift," you are admitting time is a proxy for moral relevance. If the correlation is near-perfect over long horizons, the *practical* difference between HOD and a low-PTP view vanishes.
  **Concession Required:** You must argue that value drift is **not** a function of time *per se*, but of specific contingent sociological processes that can be intervened upon. If value drift is inevitable entropy, HOD collapses. If value drift is preventable (via moral advocacy, institutional design), HOD retains content: it demands we invest in *value preservation*, not just capital accumulation.

  #### 3. Severe: The Personal Prudence Inconsistency
  **The Charge:** (Addressing your fourth worry). If you claim PTP is irrational for a social planner but permissible for an individual (preferring a headache next year), you are positing a discontinuity between individual and social rationality that is hard to defend in a PPE framework.
  **Why it's Severe:** Most arguments against PTP (Dutch Book arguments, coherence constraints) apply equally to individuals over time. If you concede individuals can rationally have $\delta > 0$, you undermine the claim that $\delta > 0$ is *structurally* irrational. You are forced to argue that the Social Planner is a different *kind* of agent than a person.
  **Concession Required:** Either bite the bullet that PTP is irrational for individuals too (Parfit's view), or provide a robust account of why social impartiality requires a stricter coherence constraint than personal prudence (e.g., the "Veil of Ignorance" argument: the planner doesn't know *when* they will be, whereas I know I am the "now" stage).

  #### 4. Awkward: The "Boring Outcome" (Growth Swamping)
  **The Charge:** (Addressing your second worry). If growth ($g$) is positive and elasticity of marginal utility ($\eta$) is $\ge 1$, the term $\eta g$ swamps $\rho$. A Nordhausian ($\rho > 0$) and a Sterner ($\rho = 0$) end up with similar discount rates in a growing economy.
  **Why it's Awkward:** It makes your view politically expensive (it sounds radical) but policy-quiet (it recommends similar savings rates to the mainstream in normal times).
  **Concession Required:** Admit that HOD is only radically demanding in scenarios of **stagnation** or **negative growth** (e.g., climate damages reducing future consumption). In a booming world, HOD is consistent with high market rates. This isn't a refutation, but it limits the view's "action-guiding" distinctiveness to catastrophe scenarios.

  #### 5. Awkward: Uncertainty Symmetry
  **The Charge:** (Addressing your third worry). You rely on Weitzman-Gollier to say uncertainty lowers the long-term rate. But uncertainty works both ways.
  **Why it's Awkward:** If you are uncertain about the hazard rate, the effective discount rate declines (Weitzman). But if you are uncertain about growth ($g$), and that uncertainty is resolved over time, it can create an *upward* pressure on the certainty-equivalent rate depending on the correlation structure.
  **Concession Required:** You cannot claim uncertainty *always* favors low discounting. You must model the specific stochastic processes. However, for existential hazards (where the outcome is zero), the Weitzman effect generally dominates. This is fixable, but requires more technical humility.

  ---

  ### Part II: Chewing on Your Specific Worries

  #### 1. The Collapse/Value-Drift Worry
  *Is discounting for value drift smuggled PTP? Is the extinction-risk distinction a dodge?*

  This is the strongest philosophical threat to your view. Here is the litmus test: **Counterfactual Interventions.**

  *   **PTP View:** If I could magically guarantee the future people exist and receive the benefit, I should *still* discount it because it is later.
  *   **HOD View:** If I can guarantee receipt and utility realization, I should *not* discount it.

  If you discount for value drift, you are treating "future people having different values" as a **hazard to utility realization**. This is consistent with HOD *provided* you treat it as an empirical probability ($p < 1$) rather than a normative penalty.

  **The Signature Difference:**
  The distinction is not verbal; it changes the **policy portfolio**.
  *   A **PTP discounter** responds to value drift by saying, "Well, their utility is worth less anyway, so we save less."
  *   A **HOD discounter** responds to value drift by saying, "The probability of our investment yielding utility is low. We must either (a) invest in things they will value regardless of drift (e.g., existential safety, basic option value) or (b) invest in *preventing the drift* (moral advocacy, institutional resilience)."

  **Verdict:** It is not a dodge. The HOD view forces you to care about *moral persistence* as a capital good. The PTP view lets you ignore it. However, if you admit that value drift is effectively 100% correlated with time over long horizons and *unchangeable*, then yes, you have functionally accepted PTP. You must commit to the claim that value drift is contingent and intervenable.

  #### 2. Growth, Diminishing Returns, and Wait-and-Learn
  *Is the view actually demanding? Does wait-and-learn create a hurdle rate?*

  **The Growth Brake:**
  You are right to suspect this. If $\eta = 1$ and $g = 2\%$, your discount rate is 2% even with $\rho = 0$. This makes HOD look "boring" in a standard growth scenario.
  **Where it bites:** HOD becomes extreme if $g \to 0$ or $g < 0$. In climate economics, if damages reduce future consumption, $g$ drops. For a PTP discounter, the discount rate stays high (e.g., 3%). For you, the discount rate collapses toward zero. This implies **massive** current sacrifice to prevent future consumption loss.
  *   *Reductio or Truth?* It's an inconvenient truth. It implies that if we expect the future to be poorer than us (due to resource depletion/climate), we should save almost everything. Most people find this counterintuitive, but that's a critique of their intuitions, not your logic.

  **Wait-and-Learn (Option Value):**
  Yes, you have to eat this. Under uncertainty and irreversibility, the "hurdle rate" for investment is higher than the expected discount rate. This is standard real options theory.
  *   *Does this mimic PTP?* Functionally, yes, it slows down spending. Normatively, no. PTP says "Wait because time is costly." Options theory says "Wait because information has value."
  *   *Concession:* You must concede that HOD does *not* imply "spend everything on the far future immediately." It implies a complex strategy of staged investment. This insulates you from the "consume nothing now" reductio, but it complicates the "action-guiding" simplicity of your view.

  #### 3. Uncertainty Symmetry
  *Does uncertainty over hazard rates push the effective rate up?*

  You are applying the Weitzman argument selectively if you ignore the distribution of hazards.
  *   **Weitzman-Gollier:** If the discount *rate* is uncertain, the certainty-equivalent rate declines over time (dominated by the lowest plausible rate).
  *   **Hazard Rates:** If the *probability of survival* is uncertain, the effect is similar. The "fat tail" of survival (the small chance we last forever) dominates the expected value calculation over long horizons.
  *   **The Symmetry Worry:** Uncertainty about *growth* can push rates up if the upside growth scenarios are highly convex (because marginal utility drops fast).
  *   **Fix:** You aren't necessarily wrong, but you need to specify that you are talking about **multiplicative** uncertainty (survival probabilities) rather than additive uncertainty. For existential risk, the "lowest plausible rate" (near zero survival hazard) dominates because if we go extinct, nothing else matters. This is robust. Just don't generalize it to all forms of economic uncertainty without checking the convexity of the utility function.

  #### 4. Personal Prudence & Empirical Evidence
  *Is the social case different? What if studies show robust PTP?*

  **Personal Prudence:**
  If you say PTP is irrational for planners but rational for persons, you need a theory of **Personal Identity**.
  *   *Option A (Parfit):* PTP is irrational for persons too. We are just mistaken. (Hard sell, but consistent).
  *   *Option B (Rawlsian/Impartiality):* The Social Planner is behind a veil of ignorance regarding *time*. I am not behind a veil regarding *my* time. I know I am the "present" self. The planner does not know which generation they are.
  *   *Recommendation:* Take Option B. It preserves the intuition that I can prefer a headache later (because I know I'll be the one suffering it then, and I care more about present-me) while maintaining the planner must be impartial across time-slices.

  **Empirical Evidence (Revealed Preference):**
  *   *Does it move you?* No. Normative ethics is not falsified by descriptive psychology. Utilitarianism isn't falsified because people are selfish.
  *   *Unfalsifiability Worry:* It becomes unfalsifiable only if you explain *every* deviation as "hazard misperception."
  *   *Defense:* The view is falsified by **coherence**, not behavior. If you can Dutch Book a HOD agent, the theory is wrong. If you can show that "hazard" cannot be empirically disentangled from "time," the theory is empty.
  *   *The Study:* If a debiasing study shows calm, informed people still hold $\delta > 0$, you must call it a **normative error**. This is not embarrassing; it's the job of normative theory. The embarrassment only comes if you claim your theory is "derived from intuition" and then reject the intuitions. Claim it is derived from **impartiality** or **coherence**, and the survey data is irrelevant.

  ### Part III: The "No Content" Worry
  *Does HOD make any recommendation its rivals don't?*

  This is your most important question. If HOD + Hazards + Growth $\approx$ PTP + Lower Hazards, you are just doing parameter tuning.

  **The Content Test:**
  The view has distinct content in **three specific regimes**:

  1.  **The Stagnation Trap:** If future growth is projected to be zero or negative (climate collapse), the PTP view maintains a positive discount rate (e.g., 1.5%). The HOD view drops the rate to the hazard rate only (e.g., 0.1% for existential risk).
      *   *Result:* HOD demands radically higher current mitigation/savings than PTP in pessimistic scenarios.
  2.  **Existential Risk Reduction:** For a PTP discounter, preventing extinction in 300 years is worth very little today (discounted heavily). For a HOD discounter, the value of the future is the sum of all potential lives. Even with hazard discounting, the "tail value" is massive.
      *   *Result:* HOD prioritizes x-risk reduction over consumption smoothing much more aggressively than PTP.
  3.  **Institutional Design:** As noted in the Value-Drift section, HOD mandates investment in *moral/institutional persistence*. PTP treats values as exogenous.
      *   *Result:* HOD supports "constitutional" or "cultural" preservation projects that PTP ignores.

  **Conclusion on Content:**
  The view is **well-insulated** but **contingently radical**. It doesn't always scream "Save More!" (only when growth is low or risks are high), but when it does scream, it screams much louder than the rival.

  **Final Advice:**
  Don't defend HOD as "what people do." Defend it as "what impartiality requires."
  *   **Concede:** That in a growing, safe world, HOD looks like standard economics.
  *   **Insist:** That in a stagnating, risky world, HOD diverges sharply, and that this divergence is the *point* of the theory.
  *   **Clarify:** That "Hazard" includes *reception probability* (value drift), but treating it as a hazard obligates us to improve reception probabilities, not just accept them.

  If you hold that line, you avoid the "smuggling" charge and the "no content" worry. You aren't saying time doesn't matter; you're saying time is only a proxy for risk, and we have a duty to reduce the risk, not just price it in.
