  10. **Final Polish:** Check the flow. Ensure the stress test is the pivot point of the essay. (Proceed to generate output).

  *(Self-Correction on "Administrative Openness"):* I need to be careful. "Administrative Openness" in the US often refers to *government* transparency (FOIA). However, the prompt defines it as "citizen visibility as a democratic obligation." This aligns more with the "Legibility" concept (James Scott) or the "Nothing to Hide" argument rooted in republican virtue. I will interpret it as the "Legible Citizen" ideal necessary for bureaucratic equality.

