answer: |-
  ### Brainstorming & Diagnostic

  Okay, let's strip this down. The heterogeneity problem is essentially a challenge to the *natural kind* status of pleasure. If I say "pleasure is the good," I need to know what "pleasure" refers to. If it refers to a specific sensation (a "tingle"), then solving a math proof doesn't seem to have it. If it refers to "whatever people like," then hedonism becomes tautological (we seek what we seek).

  **Mill's Strategy:** He bites the bullet on heterogeneity. He admits sensations differ. He unifies them via *preference* (competent judges). But this feels like a bait-and-switch. He starts with psychology (feelings) and ends with axiology (values). The risk here is circularity: What makes a pleasure higher? That competent judges prefer it. Why do they prefer it? Because it's higher.
  *Adversarial Test:* Schadenfreude. Mill has to call this a "lower" pleasure. But if the agent *feels* it, why does the competent judge's opinion matter for the *definition* of the state? Mill seems to be saying, "This feels like pleasure, but it doesn't count as *true* pleasure because it's base." That relocates the problem from "what is this feeling?" to "what feelings are worthy?"

  **Intentionalism's Strategy:** Pleasure isn't a sensation; it's a propositional attitude. "I am pleased *that* p." This dissolves the heterogeneity problem instantly. Ice cream = pleased that I am eating ice cream. Proof = pleased that I solved it. The commonality is the *mode* (pro-attitude), not the *content*.
  *Adversarial Test:* Schadenfreude = pleased that he suffered. This fits the structure perfectly. It doesn't require the representation to be *true* (suffering isn't actually good), just that the subject holds the attitude. This seems robust.
  *The Crack:* If pleasure is just "representing as good," then delusion counts. If I am pleased that the sky is green (because I'm hallucinating), is that pleasure? Intentionalism says yes. But does hedonism want to maximize delusional states? Also, does this capture the *passivity* of sensory pleasure? Sometimes pleasure happens *to* me, not something I posit.

  **Convergence:** Both theories ultimately separate the *experience* from the *object's actual value*. Mill does it via quality rankings; Intentionalism does it via truth conditions of representation. Both admit that you can have "pleasure" about something bad.

  **Seminar Honesty:** Mill tries to save the *reputation* of pleasure. Intentionalism saves the *concept* of pleasure. Intentionalism is more honest about the psychology; Mill is more honest about the moral stakes (he knows some pleasures are bad). But on the specific philosophical problem of heterogeneity? Intentionalism does the heavy lifting. Mill just moves the goalposts.

  ---

  ### The Comparison: Mill vs. Intentionalism

  #### 1. Mill's Qualitative Distinction: Relocating the Problem
  Mill's move in *Utilitarianism* is famous: it is "better to be Socrates dissatisfied than a fool satisfied." He concedes that pleasures differ in kind, not just quantity. He attempts to unify them not by a shared sensory quality, but by a shared status in the hierarchy of preference among "competent judges."

  **Where it solves the problem:** It acknowledges the phenomenological diversity. It doesn't force the feeling of reading poetry to be the same as eating oysters. It allows hedonism to accommodate the intuition that some experiences are richer than others.

  **Where it cracks:** Mill relocates the heterogeneity problem from philosophy of mind to value theory. He stops asking "What is this feeling?" and starts asking "What is this feeling worth?" The unity of "pleasure" is no longer psychological; it is normative. The term "pleasure" becomes a placeholder for "states of consciousness deemed desirable by experts."
  *   **The Adversarial Press:** Consider schadenfreude. Mill must classify this as a "lower" pleasure. But here is the tension: If the agent is genuinely enjoying the embarrassment of another, the psychological state exists. If Mill says, "Yes, but competent judges wouldn't choose it, so it's inferior," he is no longer defining pleasure by what it *is*, but by what it *ought to be*. If he says, "It doesn't count as pleasure because it's vicious," he denies the phenomenology. Mill cannot explain why schadenfreude counts as pleasure without implicitly validating the agent's preference (which he wants to reject) or denying the agent's experience (which is empirically false). He solves the heterogeneity of *value*, but leaves the heterogeneity of *psychology* untouched.

  #### 2. Intentionalism: Solving via Structure
  The intentionalist (attitudinal) view argues that pleasure is not a distinct feeling but a mode of consciousness directed at an object. To feel pleasure is to entertain a pro-attitude toward a state of affairs (e.g., "I am pleased *that* I am eating ice cream").

  **Where it solves the problem:** It dissolves the need for a common sensory quality. The unity of pleasure is functional and structural, not qualitative. Eating ice cream and nailing a proof are heterogeneous sensations, but they share the intentional structure of *being pleased that X*. This handles the heterogeneity problem decisively at the psychological level.

  **Where it cracks:** The risk here is over-intellectualization. Does a dog feel pleasure? Does an infant? If pleasure requires representing an object as "good-for-me," do non-conceptual beings qualify? Modern intentionalists soften this to "non-cognitive pro-attitudes," but the tension remains.
  *   **The Adversarial Press:** This is where intentionalism shines compared to Mill. Schadenfreude is simply being pleased *that* someone suffered. It fits the intentional structure perfectly. Crucially, intentionalism distinguishes the *pleasure* (the attitude) from the *correctness* of the representation. I can be pleased that p, even if p is bad. The theory does not need to treat malicious satisfaction as a "correct" representation of the good. It admits the representation is false (suffering is not good), but maintains the attitude is still a instance of pleasure. This allows the hedonist to say, "This is pleasure, it counts toward your hedonic total, even though the object is vile."

  #### 3. Hidden Convergence
  There is a subtle convergence here that often goes unnoticed: both views ultimately decouple the *experience of pleasure* from the *intrinsic goodness of the object*.
  *   Mill does this by saying a lower pleasure is still a pleasure, just less valuable.
  *   Intentionalism does this by saying a false representation is still a pleasure, just not veridical.
  Both admit that you can have "pleasure" in bad things. However, Mill tries to hide this by ranking them, whereas Intentionalism exposes it by formalizing it. Mill wants to tell you that schadenfreude is *less* of a pleasure (qualitatively). Intentionalism tells you it is *equal* pleasure, just directed at a bad object.

  #### 4. Seminar Verdict: Which is More Honest?
  If I were teaching this, I would present **Intentionalism** as the more honest answer, though it comes with a bitter pill.

  Mill's view is a patch job designed to save hedonism from the accusation that it is a "philosophy for swine." He smuggles moral value into the definition of a psychological state. He relocates the heterogeneity problem rather than solving it; he tells us why some pleasures are *better*, but not why they are all *pleasures* in the same sense.

  Intentionalism is more honest because it admits that "pleasure" is a formal stance that can be taken toward anything, including misery (someone else's). It solves the heterogeneity problem by changing the ontology of pleasure from a *sensation* to an *attitude*. It handles adversarial pleasures without needing to demote them or validate their objects. It accepts that hedonism might require us to count malicious joy as a "good" for the agent (in terms of experience), which is a terrifying but consistent conclusion. Mill tries to avoid that conclusion by rigging the definitions; Intentionalism faces it head-on.

  However, Intentionalism still fails to fully capture the *passivity* of sensory pleasure (the way ice cream hits you vs. the way you adopt an attitude). But on the specific metric of heterogeneity and adversarial cases, it is the superior framework. Mill protects the *value* of hedonism; Intentionalism protects the *truth* of hedonism.

  \answer{Intentionalism solves the heterogeneity problem; Mill just relocates it}
