      *   **T3 (3 vs. 5):** Does sharp identity + phenomenal essentialism force Haecceitism?
      *   **T4 (1 vs. 6):** Standard Lewisian view, but needs checking against the hybrid nature of the rest.
      *   **T5 (5 vs. 1):** If phenomenal character is essential to *me* (TWI style), does that break CT?

