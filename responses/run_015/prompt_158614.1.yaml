  **Question 4 (20 marks)**
  Consider **Gated Comprehension**: For any predicate $\phi$, the set $\{x : \phi(x)\}$ exists. However, any atomic claim $t \in t$, where $t$ is defined by comprehension, lacks a truth value (a "gap"). All other logic remains classical (bivalence, excluded middle).
  **Russell's Paradox** derives contradiction from $R = \{x : x \notin x\}$ via $R \in R \iff R \notin R$.
  **Curry's Paradox** defines $C = \{x : x \in x \to \bot\}$. Using contraction and modus ponens, it derives $\bot$ from $C \in C \iff (C \in C \to \bot)$ without using negation.
  (a) Does Gated Comprehension block Russell's derivation? Identify the exact step that fails. (5 marks)
  (b) Does it block Curry's paradox? What does the difference between (a) and (b) reveal about the source of inconsistency? (10 marks)
  (c) Suppose the language can express "is gapped." Show how a "Revenge" paradox arises. (5 marks)

  **Model Answer**
  Gated Comprehension blocks Russell but fails against Curry, revealing that negation is not the sole culprit of paradox, though the theory ultimately collapses via Revenge.
  (a) Russell's derivation relies on the Law of Non-Contradiction applied to $R \in R$. Classically, $R \in R$ must be true or false. Under Gated Comprehension, $R \in R$ is a gap. Consequently, $\neg(R \in R)$ is also a gap. In a logic accommodating gaps, the biconditional $Gap \iff Gap$ does not yield a contradiction (falsehood), but rather a gap or truth, preventing explosion. The specific step blocked is the assertion that $R \in R$ has a classical truth value required to derive $P \land \neg P$. The derivation halts because the equivalence cannot be asserted as true.
  (b) Curry's paradox is more resilient. It derives arbitrary $\bot$ from $C \in C \iff (C \in C \to \bot)$. If $C \in C$ is a gap, the conditional $C \in C \to \bot$ often evaluates as true in gap logics (since the antecedent is not true). This creates a mismatch: the left side is a gap, the right side is true. The biconditional then fails, but not harmlessly. To block Curry, one must restrict the conditional or contraction, not just membership truth values. The difference reveals that Russell indicts negation and bivalence, while Curry indicts the structural rules of implication and contraction. Gated Comprehension addresses the former but leaves the latter intact. Thus, gating membership alone is insufficient for full consistency.
  (c) Revenge arises if the theory expresses its own semantics. Define $V = \{x : x \in x \text{ is gapped}\}$. Ask: Is $V \in V$ gapped? If yes, $V$ satisfies the condition, so $V \in V$ is true (not gapped). If no (true or false), $V$ fails the condition, so $V \in V$ is false (or gapped). Either way, we recover a contradiction or force the gap predicate to be inexpressible. The theory cannot consistently classify its own gaps without reintroducing the paradox it sought to avoid. This demonstrates that any solution restricting truth values must also restrict the language's ability to describe those restrictions.

  **Marking Scheme (20 marks total)**
  1. **Russell Blocked (4 marks):** Student identifies that $R \in R$ lacking a truth value prevents the contradiction $P \land \neg P$. Full marks require noting that gaps break the classical bivalence required for the proof.
     *Botch:* Claims Russell still holds because logic is classical everywhere, missing that gaps invalidate the Law of Non-Contradiction application in this context.
  2. **Specific Step (4 marks):** Identifies the bivalence assumption or the evaluation of the biconditional as the failure point. Must specify that the equivalence cannot be asserted as true.
     *Botch:* Vaguely says "comprehension is changed" without locating the logical step, failing to mention bivalence or the biconditional evaluation.
  3. **Curry Status (4 marks):** Correctly notes Curry is not blocked (or blocked only by accident) because it relies on implication, not negation. Must mention conditional truth values.
     *Botch:* Assumes Curry fails for the same reason as Russell, ignoring that Curry does not use negation in its derivation and relies on contraction.
  4. **Structural Insight (4 marks):** Explains that paradoxes stem from different sources (negation vs. contraction/conditional). Must distinguish logical operators, not just set formation.
     *Botch:* Claims all paradoxes are just about "self-reference" without logical distinction, missing the structural difference between connectives and rules.
  5. **Revenge Mechanism (4 marks):** Shows defining the set of gapped sets restores contradiction via expressibility. Must demonstrate the semantic closure problem explicitly.
     *Botch:* Describes Revenge generally without using the "is gapped" predicate provided, failing to show the semantic closure issue regarding gap classification.
