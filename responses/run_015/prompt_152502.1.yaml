  ***

  # Handout: Parsing "Laws Describe, They Don't Govern"
  **Seminar: Metaphysics of Laws**  
  **Topic: The Humean Response to Explanatory Asymmetry**

  ### Context
  Last week's speaker dismissed the worry about explanatory asymmetry (if laws supervene on the mosaic, how can they explain it?) with the slogan: *"Laws don't govern the events, they just describe them."* The room nodded. We are going to unpack why that nod was premature.

  The slogan is ambiguous. Depending on how you cash out "describe," the claim ranges from trivial to false to substantive-but-controversial. Below is the menu of readings, a verdict on each, and an assessment of whether it actually solves your asymmetry problem.

  ---

  ### The Menu of Readings

  **1. The Linguistic Platitude**
  *   **The Claim:** "Govern" is a metaphor. There is no celestial legislator, no nomic police force, and no sanctions for violations.
  *   **Verdict:** **Trivial.**
  *   **Does it solve the asymmetry?** **No.** The Necessitarian (anti-Humean) agrees with this. They don't think there's a law-giver; they think there's a metaphysical relation of *necessitation* that grounds the regularity. Denying the metaphor doesn't deny the metaphysical ground.

  **2. The Anti-Realist Category Claim**
  *   **The Claim:** Laws are *linguistic* or *representational* items (sentences, models, maps). They exist only in our theories, not in the world.
  *   **Verdict:** **False (or too costly).**
  *   **Does it solve the asymmetry?** **Yes, but by changing the subject.** If laws are just sentences in our notebooks, obviously they don't cause events. But this makes it hard to account for laws no one has formulated or instances that never occur. Most Humeans want to be realists about laws (as abstract objects or logical constructions), not anti-realists.

  **3. The Supervenience Claim**
  *   **The Claim:** The truthmakers for law-statements are exhausted by the distribution of particular local matters of fact (the "mosaic"). There is no extra "law stuff" added to the world.
  *   **Verdict:** **Substantive and Defensible** (This is core Humeanism).
  *   **Does it solve the asymmetry?** **No.** Supervenience does not dictate the direction of explanation. The mental supervenes on the physical, but we don't say the mental explains the physical. Knowing the law supervenes on the mosaic doesn't tell us why we use the law to explain the mosaic instances rather than vice versa.

  **4. The Epistemic Claim**
  *   **The Claim:** We *infer* laws from instances. Therefore, instances explain laws. To say laws explain instances reverses the order of knowledge.
  *   **Verdict:** **Confused/False.**
  *   **Does it solve the asymmetry?** **No.** This conflates epistemology (how we know) with metaphysics (what explains what). We infer the presence of a fire from smoke, but the fire explains the smoke, not vice versa. The Humean cannot rely on this without committing a basic modal fallacy.

  **5. The Deflationary Modal Claim**
  *   **The Claim:** Laws carry no nomic necessity and support no counterfactuals. "Law" is just a label for "regularity we are confident about."
  *   **Verdict:** **Substantive and Likely False.**
  *   **Does it solve the asymmetry?** **Yes, but it's overkill.** This dissolves the problem by denying laws do any modal work. However, most sophisticated Humeans (Lewis, Loewer) want laws to *support* counterfactuals. If you deny this, you lose the ability to distinguish laws from accidental generalizations, which is a bullet most Humeans refuse to bite.

  **6. The "Best System" (Filing-Cabinet) Claim**
  *   **The Claim:** To say a law "describes" the world is to say it *systematizes* the world. Explanation is not production; explanation is unification/compression. A law explains an instance by showing how that instance fits into the most informative, simplest summary of the whole mosaic.
  *   **Verdict:** **Substantive and Needs Argument.**
  *   **Does it solve the asymmetry?** **Yes.** This is the only reading that does the heavy lifting. It redefines "explanation" so that the asymmetry worry disappears. On this view, the law explains the instance *because* the law is the best summary of the instance (and all others). The direction of fit is semantic/systematic, not causal/metaphysical.

  ---

  ### The Test Case: The Deviant Micro-Event
  *Scenario: A world just like ours, except one single micro-event goes the other way from what our best generalizations predict.*

  | Reading | Does the Law Obtain? | Why? |
  | :--- | :--- | :--- |
  | **Strict Summary** (Reading 2/5 hybrid) | **No.** | One exception falsifies a universal generalization. If laws just "describe" the data, bad data breaks the description. |
  | **Best System** (Reading 6) | **Yes (Probably).** | If the exception is rare enough that keeping the generalization still yields the best simplicity/strength tradeoff, the law stands. The law "describes" the *pattern*, not every pixel. |
  | **Governing** (Necessitarian) | **No (Impossible).** | If the law governs, the event was nomically excluded. If it happened, the law wasn't a law (or the world is irrational). |

  **Takeaway:** The slogan "laws describe" doesn't settle the test case unless you specify *how* they describe. Do they mirror every fact (Strict), or do they compress the facts (Best System)? The speaker needs Reading 6 to handle exceptions, but Reading 6 requires a theory of explanation (systematization) that the Necessitarian will reject.

  ---

  ### The Conflation Warning (Your Instinct was Right)
  You worried about running together two senses of "describe." You are correct to be suspicious.

  1.  **Semantic Sense:** A statement *describes* a state of affairs if it is true of it. (Compatible with Necessitarianism: "F=ma" describes the world even if it also governs it).
  2.  **Summative Sense:** A statement *describes* a state of affairs if it is *nothing over and above* a summary of it. (Exclusive to Humeanism).

  The speaker's one-liner works rhetorically because it invites you to accept (1)—which is uncontroversial—and then slides you into (6)—which is the controversial metaphysical thesis that dissolves your asymmetry worry.

  ### Conclusion for the Board
  *   **Readings 1–5** either fail to solve the problem or solve it by abandoning core Humean commitments (like counterfactuals or realism).
  *   **Reading 6 (Best System/Unification)** is the only candidate that licenses the conclusion "your asymmetry worry is a pseudo-problem."
  *   **The Catch:** Reading 6 is not a slogan; it is a substantive theory of explanation. The speaker owes you an argument for why *explanation just is* compression. Without that argument, the asymmetry worry stands: Why does the summary explain the items, rather than the items grounding the summary?

  **Discussion Question:** If explanation is just compression (Reading 6), does the "best system" explain the particular facts, or does it merely *represent* them in a useful way? Is there a difference?
