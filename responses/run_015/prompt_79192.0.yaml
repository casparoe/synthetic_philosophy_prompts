answer: |-
  There is no single, canonical name for this specific pattern of reasoning in the philosophical or game-theoretic literature, though it sits at a well-trafficked intersection of both. It is distinct from the bystander effect, the free-rider problem, and the unilateralist's curse, as you have correctly noted.

  The situation you describe is technically an **$N$-player Anti-Coordination Problem** (or a **Congestion Game** with a low optimal threshold). The reasoning pattern itself is a specific misapplication of the **Principle of Universalizability** (often associated with Kant) to a **Threshold Context**.

  If a name is required for the pattern of argument and outcome combined, the most precise descriptive term is **"The Paradox of Symmetric Restraint."**

  Below is a careful account of the pattern, an analysis of the argument's soundness, and a definition of the term's edges.

  ### 1. The Structure of the Situation
  The scenario is defined by three constraints:
  1.  **Symmetry:** All agents are identical in position, information, and reasoning capabilities (common knowledge).
  2.  **Threshold Value:** The act in question has positive value if performed by $k$ agents, but negative value if performed by $n$ agents (where $k < n$).
  3.  **Independence:** Agents must decide simultaneously without communication.

  In game theory, this is a **Coordination Failure**. The optimal outcome requires a *mixed strategy equilibrium*: each agent should act with a specific probability $p = k/n$. If everyone adopts this probability, the expected number of actors is $k$. However, human agents often default to *pure strategies* (either "Always Act" or "Never Act"). Faced with the risk of the "bad" outcome ($n$ actors) and lacking a mechanism to randomize or coordinate, they default to the safe pure strategy: "Never Act."

  ### 2. The Argument Pattern: "The Paradox of Symmetric Restraint"
  The argument you identified runs:
  1.  **Premise 1 (Symmetry/Universalizability):** If it is right for me to do $X$, it must be right for any agent in my position to do $X$.
  2.  **Premise 2 (Aggregate Harm):** If every agent in my position does $X$, the outcome is bad.
  3.  **Conclusion:** Therefore, it is not right for me to do $X$.

  **Is the argument sound?**
  The argument is **valid** (the conclusion follows from the premises) but **unsound** because **Premise 1 is false** in this context.

  Premise 1 treats permission as a **binary, intrinsic property** of the act ("Asking a question is permissible"). In threshold contexts, permission is a **relational, extrinsic property** dependent on the *total count* of actors ("Asking a question is permissible *only if* fewer than $k$ others do so").

  By reasoning "If I may, all may," the agents are universalizing the **act-type** ("I will ask") rather than the **act-rule** ("I will ask with probability $p$" or "I will ask if I have not observed $k$ others ask"). Because they cannot observe the others, they cannot condition their act on the count. Consequently, they treat the permission as if it must hold for the *token* actions of the whole group simultaneously, which is impossible.

  This is a specific instance of what Derek Parfit, in *Reasons and Persons*, calls a mistake in moral mathematics: ignoring the effects of **sets of acts**. It is also a failure of **Non-Ideal Theory**. Kantian universalization works well in "ideal" worlds where coordination is assumed or acts are non-rivalrous. In "non-ideal" worlds with rivalry and communication barriers, universalizing a pure strategy leads to suboptimal equilibria.

  ### 3. Proposed Name and Definition
  Since no established term covers the *argumentative pattern* specifically (as opposed to the game-theoretic situation), I propose:

  **The Paradox of Symmetric Restraint**
  *   **Definition:** A collective failure mode in which symmetric agents, reasoning from the premise that permissions must be universalizable, refrain from a beneficial act because its universal performance would be harmful, thereby ensuring the act is performed by *no one* when the optimal outcome requires it be performed by *some*.
  *   **Distinction from Free-Rider Problem:** In free-riding, agents refrain because they expect *others to supply the good*. In Symmetric Restraint, agents refrain *precisely because* they expect others might also supply it (or reason that they are entitled to), and the aggregate supply would be toxic.
  *   **Distinction from Unilateralist's Curse:** The Unilateralist's Curse predicts *excessive* action because agents rely on private, noisy estimates of value. Symmetric Restraint predicts *insufficient* action because agents rely on public, shared estimates of structural limits.

  ### 4. Edges and Boundaries
  You asked how far this concept extends. Here are the boundaries of the pattern:

  **A. Sum of Tiny Contributions vs. Threshold**
  The pattern holds in both, but is sharper in threshold cases.
  *   *Threshold:* (Your examples). The harm is catastrophic or discontinuous once $k$ is exceeded. The argument feels strongest here because the "bad outcome" is distinct.
  *   *Sum (Tragedy of the Commons):* If the harm is linear (e.g., pollution), the argument "If everyone does this, it's bad" is the standard Tragedy of the Commons. However, in the Commons, the individual act *always* adds harm. In Symmetric Restraint, the individual act *adds value* up to the threshold. The paradox is unique to the latter: the act is *good* in isolation but *forbidden* by the logic of symmetry.

  **B. Turns and Lots (Breaking Symmetry)**
  The paradox dissolves if symmetry is broken.
  *   *Turns:* If agents can sequence ("I will ask today, you tomorrow"), the universalization becomes "Everyone asks in turn," which is sustainable.
  *   *Lots:* If agents agree to randomize ("We will each flip a coin"), the universalized maxim becomes "Everyone flips a coin." This is a **mixed strategy** that satisfies universalizability without causing aggregate harm. The Paradox of Symmetric Restraint exists *only* where agents feel compelled to adopt identical *pure* strategies.

  **C. General Permissions vs. Case-by-Case**
  The pattern appears wherever permissions are stated in **general terms** ("Anyone may interrupt") rather than **indexed terms** ("The person with the most confusion may interrupt").
  *   If the permission is general, the logic of universalizability forces the agent to consider the world where *everyone* claims the permission.
  *   If the permission is indexed (e.g., "The chair may call for a vote"), the symmetry is broken by the role, and the paradox vanishes.
  *   Therefore, the pattern is endemic to **flat hierarchies** or **egalitarian groups** lacking coordination mechanisms.

  ### 5. Summary
  You have identified a genuine gap in our common vocabulary for collective action. While game theorists call the situation an **Anti-Coordination Problem** and ethicists might call the reasoning a **Misapplication of the Categorical Imperative**, the specific phenomenon of *good agents producing a bad outcome through rigorous symmetry* is best named **The Paradox of Symmetric Restraint**.

  The argument at its center is **unsound** because it universalizes a context-dependent permission as if it were context-independent. The solution is not for individuals to exempt themselves (which breaks fairness), but for the group to adopt a **universalized mixed strategy** (randomization) or a **coordination mechanism** (queuing), thereby making the permission universalizable without making the *act* universal.
