  The contradiction arises because your **Strategy-Stealing Argument** relies on a hidden assumption that is false in your specific game **Weld**.

  You should reject **Step (2)** ("The rules favour neither player"). Consequently, the deduction in **Step (4)** ("So Light wins") fails.

  Here is the detailed diagnosis of why the argument breaks, why it looked convincing, and how the conditions of the game alter the outcome.

  ### 1. The Flaw: Asymmetry in the Tie-Breaker
  Step (2) claims the rules favour neither player. This is factually incorrect. While the stone-placement and scoring rules are symmetric, the **tie-breaking rule is not**.

  *   **Rule:** "If the two counts are equal, the player who made the final move wins."
  *   **Board:** $4 \times 4$ (16 squares).
  *   **Consequence:** Light moves on turns 1, 3, ..., 15. Dark moves on turns 2, 4, ..., 16.
  *   **Reality:** Dark *always* makes the final move. Light *never* does.

  Therefore, in the event of a tie on weld counts, Dark wins automatically. This is an inherent **Second-Player Advantage** baked into the winning conditions. Step (2) ignores this, treating the game as symmetric when it is not.

  ### 2. Why Step (4) Fails
  Step (4) is the engine of the strategy-stealing argument. It argues that Light can steal Dark's strategy and win. Let's trace why this fails in Weld:

  1.  **The Steal:** Light plays an extra stone and adopts Dark's hypothetical winning strategy.
  2.  **The Result:** Light ensures that Light's weld count is at least equal to Dark's (because having an extra stone improves the margin, as per Step 3).
  3.  **The Gap:** In a symmetric game (like Hex or Tic-Tac-Toe), "at least equal" is enough to win (or force a draw). In Weld, "equal" is a **loss for Light**.
  4.  **The Mirror:** Dark's actual Mirror Strategy guarantees the weld counts will be exactly **equal**.
  5.  **The Outcome:** Light steals the strategy and achieves equality. Dark invokes the tie-breaker (which Dark owns by virtue of moving last). Dark wins.

  The strategy-stealing argument proves that Light can prevent Dark from winning *on weld counts*. It does not prove Light can overcome the *tie-breaker disadvantage*. Step (4) assumes that matching Dark's performance is sufficient for a win, which is only true if the winning conditions are symmetric.

  ### 3. The Missing Condition for Strategy Stealing
  For the strategy-stealing argument to be valid, the game must satisfy a stronger condition than just "finite, deterministic, perfect information."

  **The Condition:** The outcome of the game must depend **only on the final configuration of stones**, and the winning condition must be **symmetric** with respect to the players.

  Mathematically, if $W(P, \text{Board})$ is true when Player $P$ wins on a given Board, then for any Board $B$:
  $$W(\text{Light}, B) \iff W(\text{Dark}, \text{SwapColors}(B))$$
  In Weld, this is false. If $B$ is a tied board:
  *   $W(\text{Dark}, B)$ is **True** (Dark moved last).
  *   $W(\text{Light}, \text{SwapColors}(B))$ is **False** (Light did not move last).

  Because the win condition depends on **move history** (who moved last) rather than just the **final position**, the strategy-stealing argument cannot map Dark's win to Light's win.

  ### 4. Analysis of Variations

  You asked how changes to the rules affect the diagnosis. Here is the breakdown:

  | Variation | Tie Rule | Mirror Strategy ($4 \times 4$) | Strategy Stealing | Consistency |
  | :--- | :--- | :--- | :--- | :--- |
  | **Original** | Last Mover Wins | **Dark Wins** (Tie + Last Move) | **Fails** (Step 2 False) | **Consistent** (Dark Wins) |
  | **Draw** | Tie = Draw | **Draw** | Proves Light $\ge$ Draw | **Consistent** (Draw) |
  | **First Mover** | First Mover Wins | **Light Wins** (Tie + First Move) | Proves Light Wins | **Consistent** (Light Wins) |
  | **Positional** | Compare Top Row | **Depends** (Symmetry broken) | **Valid** (If tie-break symmetric) | **Consistent** |

  *   **If Ties are Draws:** Step (2) becomes effectively true (neither player is favored in a tie). Strategy stealing correctly proves Light can force at least a draw. The Mirror strategy correctly forces a draw. No contradiction.
  *   **If First Mover Wins Ties:** The inherent advantage shifts to Light. Strategy stealing proves Light wins. Mirror strategy results in a Tie, which awards the win to Light. No contradiction.
  *   **If Tie-Break is Positional (e.g., top row):** If the tie-break is symmetric (e.g., "Leftmost difference"), Strategy Stealing holds. If the tie-break favors a specific player regardless of position, Step (2) fails again.

  ### 5. Board Size and the 5×5 Case
  On a **$5 \times 5$ board** (25 squares):
  *   **Move Parity:** Light makes the 1st and 25th moves. Light moves last.
  *   **Tie-Breaker:** "Last Mover Wins" now favors **Light**.
  *   **Mirror Strategy:** Fails (the center square cannot be paired).
  *   **Strategy Stealing:**
      *   Step (2) is *still* false (Rules favor Light).
      *   However, the bias now favors the **Stealer** (Light).
      *   Argument: If Dark had a winning strategy, Light could steal it. Light would have the extra stone *and* the tie-breaker advantage. Light would win. Thus, Dark cannot have a winning strategy.
      *   Conclusion: Light must have a winning strategy.
      *   **Verdict:** On a $5 \times 5$ board, the Strategy-Stealing argument **is sound** (because the asymmetry favors P1), and it correctly concludes Light wins. The contradiction only appears on even boards where the asymmetry favors P2.

  ### 6. What Does Rejecting the Step Cost You?
  Rejecting Step (2) confines the strategy-stealing argument to **symmetric games**.

  *   **Substantial Value:** It still tells you that in any symmetric game (where the winner is determined purely by the final board state, like Hex, Chomp, or Gomoku without specific tie-breakers), the **Second Player cannot have a winning strategy**. This is a powerful result that eliminates half the search space for such games.
  *   **Limitation:** It cannot be used to prove the First Player wins in games where the rules inherently favor the Second Player (like your original Weld rules). It also cannot be used in games where the win condition depends on move order (like "Last Move Wins").

  **Summary:** Your Mirror Strategy is correct; Dark wins on a $4 \times 4$ board. The Strategy-Stealing argument fails because it assumes symmetry (Step 2) where the tie-breaker rule creates a structural advantage for the Second Player. The "extra stone" (Step 3) can improve the score, but it cannot purchase the "Last Move" property required to win the tie-breaker.
