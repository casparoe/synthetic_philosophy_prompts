  The phenomenon you are describing does not have a single, universally recognized name in general historical discourse, though it is a well-defined structural flaw in the philosophy of science. Your intuition about "free parameters" is the key: you have correctly identified that these theories are **overfitting** the historical data.

  In statistics and machine learning, **overfitting** occurs when a model is excessively complex—having too many parameters relative to the number of observations—such that it describes random error or noise instead of the underlying relationship. It fits the existing data perfectly (high explanatory scope) but fails to predict new data (low predictive power) and collapses under scrutiny because each data point requires its own specific adjustment.

  In the context of history and pseudoscience, the established philosophical concept closest to this is Imre Lakatos's **"Degenerating Research Programme."** Lakatos distinguished between *progressive* shifts (which predict novel facts with a unified core) and *degenerating* shifts (which survive only by adding a "protective belt" of ad hoc hypotheses to explain away anomalies). However, "Degenerating Research Programme" describes the *temporal evolution* of a theory. Your column focuses on the *structural snapshot*: a theory that currently relies on a different excuse for every item.

  For your column, the most precise and usable term is **Explanatory Overfitting**.

  ### The Phenomenon: Explanatory Overfitting

  **Definition:** A theory that achieves broad explanatory scope not through a unified mechanism, but by accumulating independent, ad hoc assumptions for each distinct piece of evidence.

  **Why it feels convincing:** It mimics **consilience** (the "jumping together" of evidence from independent fields). A valid theory unifies evidence (e.g., plate tectonics explains fossils, coastlines, and earthquakes with *one* mechanism: drifting plates). An overfitted theory unifies evidence only by label (e.g., "Atlantis" explains pyramids, myths, and king lists via *three* unrelated mechanisms: lost technology, oral tradition, and scribal error).

  **Why it is fragile:** It violates **parsimony**. In a valid synthesis, the probability of the theory rises as it explains more things *without* adding new assumptions. In an overfitted theory, the probability drops with every new explanation because each requires a new, independent assumption to be true. The "breadth" is an illusion created by multiplying parameters.

  **Why refutation fails:** Because the assumptions are independent, refuting one does not collapse the others. The theory is not a chain (break one link, it falls); it is a bundle of straws. This immunizes it against falsification, a hallmark of pseudoscience.

  ### Boundary Cases

  You asked how to distinguish this from valid broad theories or simple errors. The test is **Mechanism Parsimony**: Does the theory use *one* cause for *many* effects, or *many* causes for *many* effects under one label?

  1.  **Broad comparative-mythology synthesis (Real Scholar):**
      *   **Verdict:** Not Explanatory Overfitting.
      *   **Test:** A scholar like Campbell or Eliade posits a *unified mechanism* (e.g., shared human psychology, archetypes, or structuralism) to explain similar myths. They do not need a separate assumption for why the Flood Myth exists in Mesopotamia versus Mesoamerica; the mechanism (human mind/structure) covers both simultaneously. The parameter count is low.

  2.  **Diffusionist account of a single technology (Rejected but plausible):**
      *   **Verdict:** Not Explanatory Overfitting.
      *   **Test:** Claiming "Egyptians taught Mexicans to build pyramids" is a single historical hypothesis. It relies on one mechanism (travel/contact). It may be false (and is, in this case), but it is *falsifiable*. If evidence shows no contact, the theory dies. It does not survive by adding "well, they used psychic travel" or "the records were burned." It lacks the immunized, multi-parameter structure.

  3.  **Archaeological claim with dating error (Mostly right, off by 300 years):**
      *   **Verdict:** Not Explanatory Overfitting.
      *   **Test:** This is a simple empirical error, not a structural flaw in explanation. It does not claim to explain *everything* via *many assumptions*. It is a data point error, not a model complexity error.

  ### Where it Stops

  The boundary is crossed when the number of **ad hoc assumptions** approaches the number of **explained phenomena**.
  *   **Valid Theory:** 1 Mechanism → 10 Phenomena.
  *   **Overfitted Theory:** 10 Assumptions → 10 Phenomena (united only by a name).

  Use **Explanatory Overfitting** to tell your readers: "This theory fits the past perfectly because it was tailored to fit it, point by point, with no regard for the cost of the assumptions required."

  \answer{Explanatory Overfitting}
