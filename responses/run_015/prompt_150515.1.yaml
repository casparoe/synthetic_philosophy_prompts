prompt: |-
  For my school's philosophy club, I am writing on the paradox of deontology: the scenario in which every individual respects agent-centered moral restrictions, yet universal compliance produces a worse collective outcome than if everyone had violated those restrictions. Before I assess any proposed resolution, I want the full specification of adequacy. Write the desiderata that any theory resolving this paradox must meet—the distinctions it must preserve between acting and allowing harm, the collective-action conditions it must be consistent with, the intuitive judgments about individual rights it must not abandon, and any formal constraints from decision theory that apply—with the case or reasoning behind each requirement. Flag which desiderata are genuinely non-negotiable and which are camp-specific preferences, and indicate whether any subset of these demands is jointly unsatisfiable. I am not asking for a survey of existing authors; I need the criteria sheet itself.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for resolving the paradox of deontology:

  1.  **Deconstruct the Request:**
      *   **Topic:** The Paradox of Deontology (specifically the scenario where universal compliance with agent-centered restrictions leads to worse outcomes than universal violation).
      *   **Task:** Write the *desiderata* (criteria of adequacy) that any theory resolving this paradox must meet.
      *   **Specific Requirements:**
          *   Distinguish acting vs. allowing harm.
          *   Address collective-action conditions.
          *   Preserve intuitive judgments about individual rights.
          *   Include formal constraints from decision theory.
          *   Provide case/reasoning for each requirement.
          *   **Crucial:** Flag which are non-negotiable vs. camp-specific preferences.
          *   **Crucial:** Indicate if any subset is jointly unsatisfiable (impossibility theorems).
          *   **Constraint:** Do *not* survey existing authors; provide the criteria sheet itself.

  2.  **Analyze the "Paradox of Deontology":**
      *   *What is it?* It's the tension between agent-centered restrictions (e.g., "Do not kill one innocent even to save five") and the aggregate good. If everyone follows the restriction, more people might die than if everyone violated it (e.g., in a specific coordination scenario).
      *   *Core Tension:* Agent-relative constraints vs. Agent-neutral value.
      *   *The Goal:* A resolution must explain why the restriction holds *even if* violating it generally produces better outcomes, without collapsing into consequentialism or becoming irrational.

  3.  **Drafting the Desiderata (Brainstorming & Categorization):**

      *   *Category 1: Normative Core (The Deontological Heart)*
          *   Must preserve the special status of the agent's own actions.
          *   Must distinguish doing vs. allowing.
          *   Must protect rights even against aggregate welfare.
          *   *Non-negotiable:* If it loses this, it's not deontology anymore.

      *   *Category 2: Collective/Structural Consistency*
          *   Must handle the "universal compliance" aspect.
          *   Must avoid self-defeat (a theory shouldn't recommend its own abandonment).
          *   Must address coordination problems.
          *   *Tension:* If we say "follow the rule always," we get the bad outcome. If we say "break the rule to prevent bad outcomes," we lose the rule.

      *   *Category 3: Decision-Theoretic/Rationality Constraints*
          *   Must be action-guiding.
          *   Must satisfy some notion of rationality (e.g., not dominated strategies).
          *   *Impossibility:* There's a known tension between deontological constraints and standard decision theory (e.g., Newcomb-like problems or Prisoner's Dilemmas).

      *   *Category 4: Intuitive Judgments*
          *   Must match common moral intuitions (e.g., the Transplant Case).
          *   Must account for the "separateness of persons."

  4.  **Refining and Formalizing the Desiderata:**

      *   *D1: Agent-Centered Prerogative/Restriction.* The theory must maintain that agents have special reasons regarding their *own* actions that are not reducible to state-of-affairs value. (Non-negotiable for deontology).
      *   *D2: Doing vs. Allowing.* The theory must distinguish morally between causing harm and failing to prevent it, even if outcomes are identical. (Non-negotiable).
      *   *D3: Non-Aggregation of Rights.* The theory must explain why rights cannot be simply outweighed by numbers. (Non-negotiable).
      *   *D4: Collective Rationality/Consistency.* The theory must not be self-defeating when universalized. It needs to address the "Paradox" specifically. (This is the tricky one. Is it non-negotiable? A deontologist might say "Morality isn't about outcomes," but a *resolution* to the paradox must address why the bad outcome doesn't invalidate the rule). Let's call this "Systemic Viability."
      *   *D5: Decision-Theoretic Coherence.* The advice given must not be irrational in a game-theoretic sense (e.g., strictly dominated strategies). (Camp-specific/Contested).
      *   *D6: Action-Guidance.* It must tell the agent what to do in the specific scenario. (Non-negotiable for a normative theory).

  5.  **Addressing the "Joint Unsatisfiability" (The Impossibility Claim):**
      *   There is a strong argument (often associated with Sen or consequentialist critiques) that you cannot have Agent-Relative Constraints + Outcome Sensitivity + Universal Rationality simultaneously.
      *   Specifically, if a theory prescribes $X$ for each agent, and $\forall X$ leads to Disaster, but $\forall \neg X$ leads to Salvation, standard decision theory says $\neg X$ is dominant. Deontology says $X$ is required.
      *   *Conclusion:* D1 (Agent-Relative) and D5 (Standard Decision Theory) are likely jointly unsatisfiable in the specific paradox case without modifying one.

  6.  **Structuring the Output:**
      *   Introduction: Define the scope (Criteria Sheet).
      *   Section 1: Non-Negotiable Core (The "Deontological Minimum").
      *   Section 2: Structural & Collective Consistency (Addressing the Paradox).
      *   Section 3: Decision-Theoretic & Rationality Constraints.
      *   Section 4: The Impossibility Clause (Joint Unsatisfiability).
      *   Formatting: Clear headings, flags for Non-Negotiable vs. Camp-Specific, Reasoning for each.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Refining D1:* Call it "Agent-Relative Integrity." Reasoning: Without this, it's consequentialism.
      *   *Refining D2:* "The Acts/Omissions Distinction." Reasoning: Central to the paradox (killing one vs. letting five die).
      *   *Refining D3:* "The Separateness of Persons." Reasoning: Nozick's point. Rights are side-constraints.
      *   *Refining D4:* "Universalization Consistency." The theory shouldn't collapse when everyone follows it. (This is where the paradox hits).
      *   *Refining D5:* "Strategic Rationality." (Camp specific). Consequentialists demand this; Deontists might reject standard game theory.
      *   *Refining D6:* "Non-Absurdity." The theory shouldn't demand the impossible.

      *   *Re-evaluating the "Paradox":* The paradox is specifically that *universal compliance* yields worse results. So the desideratum must be: "The theory must explain why the worse collective outcome does not falsify the individual restriction."
      *   *Wait, is that a desideratum?* Yes, a *resolution* must explain this.
      *   *Impossibility:* If we demand "Must maximize good outcomes when universalized" AND "Must follow agent-centered restrictions," we have a contradiction. So one must go. The prompt asks to flag this.

  8.  **Final Polish:**
      *   Ensure tone is academic and precise.
      *   Check against constraints: No author survey? Check. Criteria sheet format? Check. Flags included? Check. Impossibility noted? Check.
      *   *Self-Correction on "Non-Negotiable":* Be careful. What is non-negotiable for a *deontological* resolution vs. a *general* moral theory? The prompt implies resolving the paradox *for* a philosophy club writing on deontology. So the criteria must preserve deontology while solving the paradox. If it sacrifices deontology, it hasn't resolved the paradox; it has dissolved it by changing the subject.
      *   *Key Distinction:* Non-negotiable for *Deontology* vs. Non-negotiable for *Rationality*. I need to make this clear.

  9.  **Final Review of the "Joint Unsatisfiability" Section:**
      *   This needs to be sharp. The tension is between *Agent-Relative Constraints* and *Collective Outcome Optimization*. If a theory satisfies the first, it arguably fails the second in the paradox case. If it satisfies the second, it fails the first. A resolution must show why the second is not a valid criterion for the first, OR modify the first. I need to state that holding *all* desiderata simultaneously is the source of the paradox.

  10. **Generating Output.** (Proceed to write the response based on these thoughts).
answer: |-
  # Criteria of Adequacy for Resolving the Paradox of Deontology

  **Subject:** Normative Ethics / Decision Theory Interface
  **Scope:** Evaluation of proposed resolutions to the Paradox of Deontology (specifically the tension between agent-centered restrictions and sub-optimal collective outcomes under universal compliance).
  **Purpose:** To establish a rigorous specification of adequacy for any theory claiming to resolve this paradox without collapsing into consequentialism or incoherence.

  ---

  ## I. The Deontological Core (Non-Negotiable)
  *These desiderata define the boundary conditions of the theory. If a proposed resolution fails these, it has not resolved the paradox of deontology; it has abandoned deontology in favor of a different normative framework.*

  ### 1. Preservation of Agent-Relative Restrictions
  *   **Requirement:** The theory must maintain that agents have specific moral reasons to refrain from certain actions (e.g., killing an innocent) that are not reducible to the value of the resulting state of affairs. The restriction must attach to the *agent's own agency*, not merely the outcome.
  *   **Reasoning:** The paradox arises precisely because deontology posits constraints that are agent-relative. If the restriction is justified solely by the goodness of the outcome of universal compliance, the theory is rule-consequentialist, not deontological.
  *   **Status:** **Non-Negotiable.**

  ### 2. The Acts/Omissions Distinction (Doing vs. Allowing)
  *   **Requirement:** The theory must preserve a moral asymmetry between actively causing harm and merely allowing harm to occur, even when the net loss of life/welfare is identical or greater in the case of allowing.
  *   **Reasoning:** The standard formulation of the paradox (e.g., the "Transplant" or "Terror Bomber" variants) relies on the intuition that violating a restriction to *prevent* more violations is impermissible. A resolution that equates killing one with failing to save five dissolves the specific tension the paradox highlights.
  *   **Status:** **Non-Negotiable.**

  ### 3. The Separateness of Persons
  *   **Requirement:** The theory must treat individuals as distinct entities with inviolable boundaries, rather than as vessels for aggregate utility. It must explain why rights function as "side-constraints" rather than weights in a calculus.
  *   **Reasoning:** The paradox leverages the intuition that we cannot sacrifice one person's rights to secure the rights of others. A resolution must account for why the violation of a right is not "cancelled out" by the preservation of other rights elsewhere in the collective.
  *   **Status:** **Non-Negotiable.**

  ---

  ## II. Structural and Collective Consistency
  *These desiderata address the specific mechanics of the paradox: the relationship between individual compliance and collective outcomes.*

  ### 4. Systemic Viability (Non-Self-Defeat)
  *   **Requirement:** The theory must demonstrate that the moral system is not self-defeating in a way that undermines its own normative force. It must explain why a theory is valid even if its universal adoption leads to a sub-optimal state of affairs (by consequentialist lights).
  *   **Reasoning:** A moral theory that universally prescribes actions leading to disaster faces a pragmatic contradiction. The resolution must decouple the *validity* of the norm from the *optimality* of the aggregate outcome, or redefine optimality.
  *   **Status:** **Non-Negotiable** (for a coherent normative system), but the *method* of achieving this is camp-specific.

  ### 5. Universalization Consistency
  *   **Requirement:** The theory must be able to articulate what is required of an agent when they know that others are either complying or violating the restriction. It must specify whether the duty is conditional on others' compliance.
  *   **Reasoning:** The paradox often hinges on "fairness" or "coordination." If everyone else is violating the restriction to save lives, is the agent still bound? A resolution must specify the conditions of obligation in non-ideal theory.
  *   **Status:** **Non-Negotiable.**

  ### 6. Collective Action Sensitivity
  *   **Requirement:** The theory must address whether agent-centered restrictions apply differently in contexts of joint action or coordinated institutional behavior versus isolated individual action.
  *   **Reasoning:** Some resolutions argue the paradox only holds for isolated atoms. If the theory cannot distinguish between individual murder and institutional triage, it may fail to capture complex moral realities.
  *   **Status:** **Camp-Specific Preference.** (Strict deontologists often reject this, insisting constraints bind regardless of context; moderates may accept it).

  ---

  ## III. Decision-Theoretic and Rationality Constraints
  *These desiderata concern the formal rationality of the agent following the theory. This is the primary site of conflict between deontological and consequentialist/economic frameworks.*

  ### 7. Strategic Dominance Avoidance
  *   **Requirement:** The theory should not recommend a strategy that is strictly dominated by another strategy in a game-theoretic sense (i.e., there should not be an alternative action that yields a better outcome for the agent's goals regardless of what others do).
  *   **Reasoning:** Standard decision theory holds it irrational to choose a dominated strategy. If deontology requires choosing a dominated strategy (e.g., "Do not kill" leads to more deaths overall regardless of others' actions), it conflicts with standard instrumental rationality.
  *   **Status:** **Camp-Specific Preference.** (Consequentialists and Decision Theorists view this as Non-Negotiable; Deontologists often view this as a category error, arguing moral rationality $\neq$ instrumental rationality).

  ### 8. Action-Guidance under Uncertainty
  *   **Requirement:** The theory must provide a determinate action recommendation even when the agent is uncertain about whether their violation would actually trigger the "better" collective outcome.
  *   **Reasoning:** In many paradox scenarios, the agent cannot know if their violation will be part of a universal shift or an isolated exception. A theory that requires omniscience to function is practically useless.
  *   **Status:** **Non-Negotiable.**

  ### 9. Diachronic Consistency
  *   **Requirement:** The theory must ensure that an agent's plan formed at time $T_1$ remains rational at time $T_2$, absent new information. It should not require dynamic inconsistency (e.g., planning to violate the restriction to save lives, but then being required to follow it when the moment comes).
  *   **Reasoning:** A theory that forces agents to constantly renegotiate their commitment to principles undermines the stability required for moral agency and trust.
  *   **Status:** **Camp-Specific Preference.** (High priority for Contractualists and Rule-Consequentialists; less priority for Act-Deontologists).

  ---

  ## IV. Joint Unsatisfiability and Impossibility Clauses
  *It is critical to note that satisfying all the above desiderata simultaneously may be logically impossible. Any proposed resolution must explicitly state which desideratum it modifies or rejects.*

  ### The Deontological Trilemma
  Current meta-ethical analysis suggests the following three claims form an inconsistent triad. A resolution must deny at least one:

  1.  **Agent-Relative Absolutism:** Moral restrictions bind the agent regardless of the aggregate outcome (Desiderata 1 & 2).
  2.  **Collective Rationality:** A moral theory should not prescribe universal behaviors that lead to demonstrably worse states of affairs for everyone, including rights-holders (Desideratum 4 & 7).
  3.  **Individual Efficacy:** The moral status of an act is determined by its causal contribution to the outcome (Standard Decision Theory).

  **Impossibility Flag:**
  *   If a theory maintains **1** and **3**, it must accept that morality is collectively self-defeating (violating Desideratum 4).
  *   If a theory maintains **1** and **4**, it must reject standard **Decision Theory** (violating Desideratum 7).
  *   If a theory maintains **2** and **3**, it must abandon **Agent-Relative Restrictions** (violating Desideratum 1), collapsing into consequentialism.

  ### Specification for Evaluation
  When assessing a resolution, apply the following test:
  1.  **Does the theory preserve Desiderata 1, 2, and 3?** If no, it is not a deontological resolution.
  2.  **Which Decision-Theoretic constraint (Desiderata 7 or 9) does the theory modify to accommodate the paradox?**
  3.  **Does the theory offer a principled reason why "Collective Outcome" (Desideratum 4) is not the metric for moral validity?**

  ---

  ## V. Summary of Flags

  | Desideratum | Status | Justification for Flag |
  | :--- | :--- | :--- |
  | **1. Agent-Relative Restrictions** | **Non-Negotiable** | Defining feature of deontology. |
  | **2. Acts/Omissions Distinction** | **Non-Negotiable** | Defining feature of the paradox scenario. |
  | **3. Separateness of Persons** | **Non-Negotiable** | Foundational metaphysical commitment of deontology. |
  | **4. Systemic Viability** | **Non-Negotiable** | Required for any coherent normative system. |
  | **5. Universalization Consistency** | **Non-Negotiable** | Required to address the "universal compliance" clause of the paradox. |
  | **6. Collective Action Sensitivity** | **Camp-Specific** | Strict deontologists reject contextual variance; others accept it. |
  | **7. Strategic Dominance Avoidance** | **Camp-Specific** | Rejected by those who view moral rationality as distinct from instrumental rationality. |
  | **8. Action-Guidance** | **Non-Negotiable** | Required for a normative theory to be functional. |
  | **9. Diachronic Consistency** | **Camp-Specific** | Priority varies between contractualist and intuitionist approaches. |

  **Final Warning on Unsatisfiability:**
  Any resolution claiming to satisfy **Desideratum 1 (Agent-Relative Restrictions)** and **Desideratum 7 (Strategic Dominance Avoidance)** simultaneously in the context of the Paradox of Deontology is suspect. The paradox exists *because* these two demands conflict. A successful resolution must argue why one of these demands is misapplied to the moral domain, not merely assert both are met.
