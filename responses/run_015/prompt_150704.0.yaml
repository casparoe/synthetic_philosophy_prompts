      *   Compulsory Voting: 60% (Cultural mismatch).
      *   Voting Age 16: 70% (Maturity concerns).

      *Wait, the prompt asks for "the one claim you'd bet least on."* I need to make sure I explicitly identify that.

  7.  **Final Review against constraints:**
      *   Novelist friendly? Yes, keep it punchy.
      *   Address all charter points? Yes.
      *   Address Sicilian Expedition? Yes.
      *   Confidence levels? Yes.
      *   Least certain claim? Yes.

