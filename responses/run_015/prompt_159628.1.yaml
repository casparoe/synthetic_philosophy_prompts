answer: |-
  This is a brilliant challenge. You are asking for a pedagogical device that replicates the *epistemic friction* of experimental work without the apparatus, specifically designed to break the Simple Conditional Analysis (SCA) from the inside out.

  The game below, **"The Assay Protocol,"** is designed to be self-executing. The rules are on the table, not in your mouth. The "physics" is embedded in the cards. The frustration they feel when the data contradicts the reality is the lesson.

  ### Game Overview: "The Assay Protocol"

  **Premise:** The group is a Certification Board. They must audit a batch of 6 "Components" to determine which possess an **Intrinsic Capacity** (the disposition) to conduct energy.
  **The Catch:** They cannot open the Components. They must use "Probes" (Tests). The Probes are interventions, not windows.
  **The Goal:** Correctly identify which Components have the Intrinsic Capacity.
  **The Stake:** The team with the lowest score makes the tea for the break.

  ### Materials Required
  *   **4 Tables** of 4 people each.
  *   **4 "Audit Kits"** (One per table). Each kit contains:
      *   6 Opaque Envelopes (sealed with a sticker). Label them C1 through C6.
      *   3 "Probe Tokens" per player (12 total per table). Poker chips or distinct coins work.
      *   1 "Master Log" sheet (to record Test Results).
      *   1 "Verdict Sheet" (to submit final certifications).
      *   1 Printed Rule Sheet (see below).
  *   **Inside the Envelopes:** Pre-printed "Component Cards" (templates provided below).
  *   **Flipchart:** For final scoring and debrief notes.
  *   **Kettle:** Visible in the corner.

  ### The Rule Sheet (Print this for each table)
  *Do not explain this verbally. Hand it out and say: "The protocol is on the sheet. You have 40 minutes. Go."*

  ***

  **AUDIT PROTOCOL v4.2**

  **1. OBJECTIVE**
  Identify which Components (C1–C6) possess **INTRINSIC CAPACITY**.
  *   **INTRINSIC CAPACITY = TRUE:** The Component generates its own signal.
  *   **INTRINSIC CAPACITY = FALSE:** The Component does not generate its own signal.

  **2. RESOURCES**
  *   Your team shares a pool of **12 Probe Tokens**.
  *   To test a Component, you must spend **1 Token**.
  *   You may test a Component multiple times, provided you have Tokens.

  **3. PROCEDURE**
  1.  Select a Component Envelope. Do not open it.
  2.  Spend 1 Token. Place it in the "Used" pile.
  3.  One player inserts a finger into the envelope (without removing the card) and presses the **"TEST BUTTON"** printed on the card inside.
  4.  The card will instruct the player to announce a **READOUT** to the table. Write this on the Master Log.
  5.  The card may also instruct the player to perform an **ACTION** (e.g., discard extra tokens, mark the envelope). Follow instructions exactly.
  6.  Return the envelope to the table.

  **4. CERTIFICATION**
  *   When Tokens are exhausted or time is called, you must submit a Verdict for every Component.
  *   Verdict options: **CERTIFIED** (Has Capacity), **REJECTED** (No Capacity), or **INDETERMINATE**.
  *   **SCORING:**
      *   Correct CERTIFIED: +10 Points
      *   Correct REJECTED: +5 Points
      *   Incorrect CERTIFIED (False Positive): **-20 Points**
      *   Incorrect REJECTED (False Negative): **-10 Points**
      *   INDETERMINATE: 0 Points

  **5. INTEGRITY**
  *   Do not peek inside envelopes until the Audit is complete.
  *   The Cards are the Physics. Obey them literally.

  ***

  ### The Component Cards (The "Physics")
  *You need to prepare these in advance. For each of the 4 tables, prepare one set of 6 envelopes. The distribution below ensures every table encounters all three failure modes.*

  **Distribution per Table (6 Envelopes):**
  *   **2x Type Alpha (True Positive)**
  *   **1x Type Beta (Fink)**
  *   **1x Type Gamma (Mask)**
  *   **1x Type Delta (Mimic/Proxy)**
  *   **1x Type Null (True Negative)**

  *Print these on cardstock. Place one inside each envelope. Seal them.*

  #### Type Alpha (Standard)
  > **INTRINSIC CAPACITY: YES**
  > **INSTRUCTION:** When Tested, announce: **"SIGNAL DETECTED."**
  > **ACTION:** None.
  > *(Note: This card remains unchanged.)*

  #### Type Beta (The Fink)
  > **INTRINSIC CAPACITY: YES**
  > **INSTRUCTION:** When Tested, announce: **"NO SIGNAL."**
  > **ACTION:** Immediately cross out the word "YES" above so it reads "NO".
  > **WARNING:** If Tested a second time, announce **"SYSTEM FAILURE"** and discard **2 additional Tokens** from the team pool.

