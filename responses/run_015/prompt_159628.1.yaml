  ### Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Silence**
  *   Seat them at 4 tables.
  *   Place the Audit Kits and the Rule Sheet on the tables.
  *   **Do not give a speech.** Say only: "You are auditors. The rules are on the sheet. The physics is in the envelopes. You cannot open them until the end. The losing team makes the tea. Start."
  *   *Why:* This prevents you from framing the problem. They must encounter the friction operationally.

  **00:10 – 00:50: The Audit (Play)**
  *   Circulate quietly. If they ask "Is this allowed?", point to the Rule Sheet.
  *   If they ask "Why did I lose two tokens?", point to the Card Instruction.
  *   Watch for the moment they realize a "SIGNAL" might be a lie (Type Delta) or a "NO SIGNAL" might be hiding capacity (Type Beta/Gamma).
  *   *Tension Point:* They have 12 Tokens for 6 Components. They cannot test everything twice. They must gamble.

  **00:50 – 01:00: The Verdict**
  *   Collect the Verdict Sheets.
  *   Have them open the envelopes and reveal the Cards.
  *   Calculate scores. Announce the tea-making team. (Keep it light, but the sting matters).

  **01:00 – 01:30: The Debrief (The Philosophy)**
  *   *Do not start with philosophy.* Start with the data.
  *   **Step 1: The Mimic (Type Delta).** Ask the table that certified a Delta: "You saw a Signal. Why was your verdict wrong?"
      *   *Lesson:* Manifestation $\neq$ Disposition. The test was an intervention that supplied the energy (like the Pt/Mg couple). The SCA says "If tested, then manifests," which is true, but it doesn't prove the property is *in* the object.
  *   **Step 2: The Fink (Type Beta).** Ask: "Who tested a Beta twice?"
      *   *Lesson:* The stimulus destroyed the disposition. The conditional "If struck, it would break" is false because if struck, it *wouldn't* be fragile anymore. The test changes the state.
  *   **Step 3: The Mask (Type Gamma).** Ask: "How is Gamma different from Beta?"
      *   *Lesson:* The disposition remained, but the manifestation was blocked. The conditional fails because the context (the mask) interfered.
  *   **Step 4: Operationalism.** Turn to your operationalist colleagues. "If you can't measure it, it isn't real."
      *   Point to the Beta (Fink). It *was* real (said YES initially), but the measurement said NO.
      *   Point to the Delta (Mimic). The measurement said YES, but it *wasn't* real.
      *   *Conclusion:* The assay is not a window; it is a transaction.

  ### Predictable Failures & Mitigation

  **1. The Lawyer (Rule Lawyering)**
  *   *Risk:* They will argue that the Type Delta card violates the definition of "Test" or that the Token penalty on Type Beta is "unfair."
  *   *Mitigation:* The Rule Sheet says "The Cards are the Physics. Obey them literally." If they argue, say: "In the lab, the cell doesn't care if the rule is fair. It just is. Obey the card."
  *   *Philosophical Value:* This mirrors the frustration of nature not conforming to our logical categories.

  **2. The "Indeterminate" Shield**
  *   *Risk:* Teams will vote "INDETERMINATE" for everything to avoid negative points.
  *   *Mitigation:* The scoring is weighted. If they leave too many Indeterminate, they will lose to a team that took calculated risks. Also, announce at minute 30: "Audit Quotas apply: You must Certify or Reject at least 4 Components." (Add this to the Rule Sheet if you know the group is too cautious).

  **3. Peeking**
  *   *Risk:* Someone lifts the card out.
  *   *Mitigation:* Use sturdy envelopes and stickers. Make it a point of honor. "If you break the seal, the Component is contaminated. Automatic Rejection."

  **4. Missing the Distinction between Fink and Mask**
  *   *Risk:* They treat Beta and Gamma as the same "False Negative."
  *   *Mitigation:* This is where your facilitation matters. In the debrief, explicitly ask: "Did anyone notice the Token penalty on the second test?" If not, reveal that *mechanically* they were different. This maps to your point: Finks need different repairs (protective circuits) than Masks (removing the foam).

  ### What This Game Cannot Do (Your "Honesty" Request)

  You asked me to be honest about where the game fails and you need to step in.

  **1. Realism of Dispositions**
  *   *The Limit:* The game proves that *tests are unreliable*. It does not prove that *dispositions are real*. A hardline Humean could play this and say, "See? There are no dispositions. There are only complex regularities of behavior (Cards) that we failed to model."
  *   *Your Move:* In the debrief, you must make the metaphysical leap. "We treated the 'INTRINSIC CAPACITY: YES' on the card as a fact. In science, we posit the electron or the bond energy as that 'YES'. If we don't believe the 'YES' exists independent of the test, chemistry becomes magic. The game shows why we need *controls*, not why properties aren't real."

  **2. The "Borrowed Basis" Nuance**
  *   *The Limit:* The Type Delta (Mimic) card is a bit abstract. In your Pt/Mg case, the hydrogen comes from the acid/magnesium, nucleating on Pt. In the game, it just says "Signal Detected."
  *   *Your Move:* Use your war story here. "In the game, the card told you it was a Mimic. In the lab, the card doesn't talk. You have to realize the signal is borrowed. That's why we isolate systems."

  **3. The "Intervention" Feeling**
  *   *The Limit:* Putting a finger in an envelope isn't quite like putting a voltmeter across a high-impedance cell.
  *   *Your Move:* Remind them that spending the Token represents the energy cost of the probe. "The Token wasn't just a currency; it was the joule you dumped into the system. Sometimes the system ate it (Delta), sometimes it broke the system (Beta)."

  ### Why This Works for This Group
  *   **Scientists:** They respect the "Protocol." They will try to optimize the Token economy. They will feel the pain of the False Positive/Negative in their bones.
  *   **Humanities:** They will pick up on the semantic slippage between "Signal" and "Capacity."
  *   **The Lawyer:** They have a rulebook to interpret.
  *   **You:** You don't have to lecture. You just enforce the protocol. The cards do the teaching.

  ### Final Advice for the Runner
  When the debrief gets heated (and it will, especially around the scoring), let them argue for five minutes. Then, write on the flipchart:

  **SCA: If $S$ then $M$.**
  **Reality: $S$ changes $x$.**

  Ask them: "How do you fix the formula?"
  They will suggest adding "ceteris paribus" (all else being equal).
  You reply: "In corrosion, 'all else equal' never happens. The water changes the metal."

  That is the moment they will stop thinking like philosophers and start thinking like experimentalists again. And that is exactly where you want them.
