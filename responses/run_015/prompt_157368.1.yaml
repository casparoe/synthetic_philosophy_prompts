answer: |-
  Here is the specification sheet for a theory of Units of Selection. It is designed to function as a methodological guide for empirical biology rather than a metaphysical settlement.

  ### The Specification: Desiderata for a Theory of Selection Units

  **1. The Tripartite Distinction Clause**
  *   **Requirement:** The theory must explicitly distinguish between (A) the unit of **Heredity** (what is copied with fidelity), (B) the unit of **Selection** (where fitness variance causally drives frequency change), and (C) the unit of **Adaptation** (what entity the trait appears designed to benefit). It must state whether these must coincide or provide a principled rule for when they come apart.
  *   **Case:** A meiotic drive gene spreads (Selection at gene level) by destroying rival gametes, reducing the fertility of the organism (harming Organism Fitness), and serves no function for the species (no Species Benefit). If a theory conflates these jobs, it cannot explain why the organism evolves suppressors against the gene. A working biologist needs to know whether to measure gene transmission rates, organism survival, or colony output, depending on which question they are asking.

  **2. The Altruism/Collective Benefit Test**
  *   **Requirement:** The theory must provide a criterion for distinguishing genuine group-level adaptation from individually beneficial traits that have collective side-effects. It must specify what evidence would settle whether a group is a "vehicle" or merely an environment.
  *   **Case:** Reproductive restraint prevents population crash. Is this group selection or individual selection (e.g., avoiding resource depletion that would kill the individual)? The theory must demand evidence of *differential group survival/reproduction* correlated with the trait, not just the fact that the group survives. If the trait spreads because groups with it out-reproduce groups without it, it is a group unit. If it spreads because individuals within groups gain a long-term payoff, it is an individual unit.

  **3. The Intragenomic Conflict Clause**
  *   **Requirement:** The theory must account for sub-organismal selection (e.g., segregation distorters, transposons) without defaulting to "genes are the only units" simply because DNA is the physical substrate of inheritance.
  *   **Case:** A "sabotage gene" spreads while making its bearer less fertile. A gene's-eye view handles this easily but often dismisses organism-level selection as illusory. A viable theory must acknowledge that selection can act *against* the organism's interest at a lower level, without concluding that the organism is never a unit of selection. It must allow for the organism to be a unit of selection in *other* contexts (e.g., predator avoidance) despite intragenomic conflict.

  **4. The Non-Vacuity Constraint**
  *   **Requirement:** The theory must specify conditions under which the claim "Selection is acting at Level L" is **false**. It cannot rely solely on mathematical partitioning (e.g., Price Equation covariance terms) which can always be generated regardless of biological reality.
  *   **Case:** You can mathematically partition variance between atoms, cells, organisms, and groups for any trait. This does not mean selection acts at all those levels. A theory that says "group selection is happening" whenever there is *any* covariance between group trait and group frequency is vacuous. The theory must require a threshold of causal efficacy or variance magnitude that makes the higher-level term biologically significant, not just mathematically non-zero.

  **5. The Collective Fitness Definition**
  *   **Requirement:** The theory must distinguish between **Aggregate Fitness** (the average fitness of the members) and **Emergent Fitness** (the reproduction of the collective as a single entity, e.g., colony fission, nest founding). It must state whether a verdict on "group selection" can flip depending on which definition is used.
  *   **Case:** A colony grows large because individuals reproduce rapidly (Aggregate) vs. a colony reproduces by sending out swarms to found new colonies (Emergent). If we use Aggregate, almost any aggregation qualifies. If we use Emergent, only specific life-cycles qualify. The theory must acknowledge that using Aggregate fitness often collapses group selection back into individual selection, whereas Emergent fitness preserves the distinctness of the group unit.

  **6. The Collective Heredity Standard**
  *   **Requirement:** The theory must define what counts as heritable variation at the collective level without stipulating a priori that groups lack the fidelity of genes. It must identify mechanisms (e.g., bottlenecks, single-cell founding) that raise group-level fidelity.
  *   **Case:** Critics argue groups aren't units because they don't reproduce faithfully. However, eusocial colonies often reproduce via a single queen (a bottleneck), resetting group variation and ensuring high fidelity of colony-level traits (e.g., aggression level). The theory must recognize these mechanisms as satisfying the heredity requirement for groups, rather than dismissing them because they aren't DNA replication.

  **7. The Byproduct/Design Separation**
  *   **Requirement:** The theory must not collapse the level at which selection acts into the level that benefits. It must be able to identify traits that are selected at one level but benefit another (spandrels) or benefit no one (drift).
  *   **Case:** Thick fur is selected at the organism level (warmth) but benefits the group by keeping the herd warm in a huddle. A theory that defines the unit of selection by the beneficiary will misidentify the causal mechanism. The biologist needs to know that measuring herd survival won't explain the evolution of the fur; measuring individual survival will.

  **8. The Boundary Case Protocol**
  *   **Requirement:** The theory must provide a decision procedure for boundary cases (eusocial colonies, obligate symbionts/holobionts). It must specify evidence for a new level of individuality that is independent of the outcome being explained.
  *   **Case:** Is a coral holobiont (coral + algae + bacteria) one unit or many? Inferring it is one unit because they function well together is circular. The theory must demand independent evidence, such as: alignment of fitness interests (vertical transmission of symbionts), suppression of internal conflict (policing mechanisms), or bottlenecked reproduction. If these are absent, they remain a community, not a unit.

  ***

  ### The Tension: Incompatible Desiderata

  The pair of desiderata that cannot be jointly satisfied without significant friction are **The Non-Vacuity Constraint (4)** and **The Collective Fitness Definition (5)** (specifically regarding Aggregate Fitness).

  *   **The Conflict:** If you allow **Aggregate Fitness** (average member success) to count as group fitness, you satisfy the intuition that groups matter, but you violate **Non-Vacuity**. Almost any structured population will show some covariance between group composition and average member fitness, making "group selection" mathematically omnipresent and biologically trivial.
  *   **The Trade-off:** To save **Non-Vacuity**, you must insist on **Emergent Fitness** (colony fission). But this risks making the theory too narrow, excluding cases where groups influence evolution through differential member survival without the group itself "reproducing" in a discrete sense. You cannot have a definition of group fitness broad enough to catch all interesting social dynamics and strict enough to rule out vacuous mathematical partitions.

  ### The Killer Requirement

  The single requirement that knocks out the most popular positions is **The Non-Vacuity Constraint (4)**.

  *   **Why:**
      *   **Naive Multi-Level Selection (MLS):** Often relies on the Price Equation partitioning. Since covariance can always be partitioned, naive MLS claims group selection is "always present to some degree." The Non-Vacuity Constraint forces this view to admit that sometimes the group-level term is causally negligible, effectively conceding that for many traits, there is *no* group selection, only individual selection.
      *   **Strict Gene's-Eye View:** Often claims that because genes are the only replicators, they are the only units. This violates Non-Vacuity in the other direction: it makes the claim "organisms are units of selection" *always false*, despite the fact that organism-level variance causally explains many trait frequencies. It renders the organism level vacuous by definition.
      *   **Impact:** This requirement forces both sides to move from "What is *possible* to partition?" to "What is *causally dominant*?" It kills the "everything is multi-level" stance and the "only genes are real" stance.

  ### Scorecard

  | Position | Performance on Spec | Notes |
  | :--- | :--- | :--- |
  | **Gene's-Eye View** | **Pass:** Heredity, Intragenomic Conflict.<br>**Fail:** Collective Fitness, Non-Vacuity (regarding higher levels). | Excellent at tracking physical replication and conflict. Fails the "working biologist" test for social traits because it treats organism-level fitness as a derivative bookkeeping device rather than a causal driver. It struggles to tell a biologist when to stop looking at genes and start measuring group output. |
  | **MLS (Price-Equation Style)** | **Pass:** Tripartite Distinction, Altruism Test.<br>**Fail:** Non-Vacuity, Collective Heredity. | Mathematically rigorous at separating levels. Fails the spec because the math allows a "group selection" term even when no biological group mechanism exists (the vacuity problem). It tells you *how* to partition variance, but not *when* the partition reflects a biological reality worth measuring. |
  | **Pluralism ("Pick Your Level")** | **Pass:** Boundary Cases, Tripartite Distinction.<br>**Fail:** Non-Vacuity, Byproduct Separation. | Pragmatically useful for biologists. However, it often fails to specify *why* a level is chosen beyond convenience. It risks collapsing Selection and Benefit (Desideratum 7) by allowing the researcher to define the unit based on the trait they want to explain, rather than the mechanism driving it. |

  **Recommendation:** For a working biologist, adopt the **MLS framework** for measurement (it tells you what variables to record), but enforce the **Non-Vacuity Constraint** strictly (require evidence of group-level reproduction or conflict suppression) before interpreting the group-term as a biological unit of selection. Use the **Gene's-Eye View** only when dealing with intragenomic conflict or molecular drive.
