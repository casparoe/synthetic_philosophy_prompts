      *   **Why it fails here (User's point):**
          1.  **Payoff Structure:** In standard Superrational PD, (Cooperate, Cooperate) is the best outcome. Here, (Do Nothing, Do Nothing) leads to *death for everyone* because of the external agent (Joker). Superrationality solves coordination between *players*, not against a *referee* who punishes inaction.
          2.  **Heterogeneity:** Civilians $\neq$ Prisoners. They don't share the same utility function or reasoning process. The "mirror" is cracked.

