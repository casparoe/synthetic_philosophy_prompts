      *   **The Actual Outcome (Unilateral Disarmament):**
          *   Civilians: Rational decision (vote) $\rightarrow$ Emotional execution failure.
          *   Prisoners: Rational calculation (they won't blow us) $\rightarrow$ Moral choice (throwing the box).
