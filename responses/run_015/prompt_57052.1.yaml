      *   *Smuggling:* It presupposes a utilitarian framework (maximize QALYs/lives) as the definition of "medical ethics," bypassing the Taurek objection.

  7.  **Drafting the Response:**

      *   *Tone:* Analytical, philosophical, respectful of both sides (Director = Utilitarian/Aggregative; Friend = Taurek/Non-Aggregative).
      *   *Structure:*
          1.  The Audit (Mapping).
          2.  The Disanalogies (Noise vs. Threat).
          3.  The Severity Point (Fingers vs. Death).
