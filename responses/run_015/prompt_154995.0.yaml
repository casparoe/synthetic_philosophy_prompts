answer: |-
  ### Teaching Plan: The Structural Entanglement of Development Causation

  #### 1. Dependency Order of Conceptual Pieces
  You must introduce the concepts in the following sequence: **Intervention → Historical Counterfactual → Correlation.**

  *   **First: Intervention.** Define causation not as regularity, but as the capacity to isolate a variable (manipulate $X$ while holding $Z$ constant). This establishes the *criterion* for success.
  *   **Second: Historical Counterfactual.** Define the evidentiary requirement for testing that intervention in time (the ability to "rewind" history and alter only $X$). This establishes the *constraint* of the historical record.
  *   **Third: Correlation.** Reveal the actual status of the data (observed regularities where $X, Y, Z$ vary together). This establishes the *failure* to meet the criterion given the constraint.

  **Justification for Order:**
  If you begin with **Correlation**, students will default to a Humean inductive framework, assuming the problem is merely one of statistical noise or sample size (the "better datasets" view). If you begin with **Historical Counterfactuals**, students will treat the problem as a metaphysical puzzle about modal logic rather than an evidentiary bottleneck. By starting with **Intervention**, you immediately frame the issue as a practical requirement for causal isolation (*ceteris paribus*). Reversing this order collapses the argument because it allows students to believe that correlation *could* suffice if instruments were sharper, rather than understanding that correlation is structurally incapable of satisfying the interventionist criterion in this domain.

  #### 2. The Carrying Example: Medieval Divergence in the Italian Peninsula
  You will use the **divergence between Northern City-States and the Southern Norman Kingdom (c. 1100–1800)** as the single concrete case.

  *   **Properties it Must Possess:**
      *   **Similar Geography:** Both regions share the Mediterranean climate, access to maritime trade routes, and peninsular topography, ruling out "climate zone" determinism.
      *   **Shared Cultural Inheritance:** Both inherit Roman law, Latin linguistic roots, and Catholic religious authority, ruling out "civilizational" essentialism.
      *   **Divergent Institutional Paths:** The North develops communal republics (merchant oligarchies); the South develops a feudal monarchy (centralized extraction).
  *   **Properties it Must Lack:**
      *   **No Clean Exogenous Shock:** There is no random border draw or sudden external assignment (like a colonial border split) that separates the North from the South. The divergence emerges endogenously from military and dynastic struggles that are themselves correlated with local geography and social structure.

  **Usage:** Use this case to show that "Institutions" (Republic vs. Monarchy) cannot be toggled without also toggling "Culture" (Civic engagement vs. Feudal loyalty) and "Geography" (Defensible mountains vs. Open plains), demonstrating the structural entanglement.

  #### 3. Mapping Misconceptions and Interception Points
  You must intercept the following three misconceptions at specific points in the sequence to prevent them from hardening.

  *   **Misconception 1: Institutions as Freely Chosen Rules (Voluntarism).**
      *   *The Error:* Students will assume institutions are like laws that a government can simply enact or repeal to test their effect.
      *   *Interception Point:* **During Intervention.**
      *   *Correction:* Clarify that in this context, institutions are *equilibria*, not levers. You cannot "intervene" on the Norman Monarchy without unraveling the social fabric that sustains it. The interventionist criterion requires a "handle," but history provides none.
  *   **Misconception 2: Geography as Deterministic Climate (Environmental Determinism).**
      *   *The Error:* Students will treat geography as a fixed background variable (e.g., "tropical vs. temperate") rather than a relational constraint.
      *   *Interception Point:* **During the Example Description.**
      *   *Correction:* Emphasize that geography here is *interactive*. The same Mediterranean coast supports trade in the North but invasion in the South due to the institutional lens. Geography is not a separate cause; it is a constraint that institutions navigate.
  *   **Misconception 3: Natural Experiments Disentangle Variables (The "Clean Shock" Fallacy).**
      *   *The Error:* Students will suggest that colonial borders or partition lines (like Korea) solve the entanglement problem.
      *   *Interception Point:* **During Historical Counterfactual.**
      *   *Correction:* Argue that even "natural experiments" carry pre-existing cultural and geographic baggage. A border is not a random assignment of institutions; it is drawn *because* of differences. Therefore, the counterfactual "what if the South had Northern institutions" remains unlicensed by the record.

  #### 4. Check-for-Understanding Question
  Pose the following question to distinguish structural grasp from empirical skepticism:

  > **"If we discovered a complete, noise-free dataset of every economic transaction and legal statute in 18th-century Italy, would the causal contribution of institutions become empirically decidable?"**

  *   **Correct Grasp (Structural Impossibility):** No. Perfect data would only show perfect entanglement. The problem is not measurement error; it is that the variables do not vary independently in the record.
  *   **Incorrect Grasp (Empirical Disagreement):** Yes (or "Maybe"). This indicates the student believes the problem is merely a lack of precision or statistical power, missing the philosophical point about historical counterfactuals.

  #### 5. Technical Apparatus to Name and Set Aside
  *   **Apparatus:** **Instrumental Variables (IV) Logic.**
  *   **Characterization:** Briefly describe this as an econometric technique that seeks a "lever" (an instrument) that moves the cause (institutions) without directly moving the effect (wealth) or the confounders (culture/geography).
  *   **Action:** **Deliberately Set Aside.**
  *   **Justification:** State that while IV is the statistical solution to entanglement, its validity rests on an "exclusion restriction"—a claim that the instrument affects the outcome *only* through the cause. In historical development, asserting this restriction is not a statistical test but a **metaphysical claim** about the independence of historical forces. Since the session's goal is to demonstrate that history does not license such independence, invoking the technical machinery would obscure the philosophical impossibility of satisfying its core assumption.
