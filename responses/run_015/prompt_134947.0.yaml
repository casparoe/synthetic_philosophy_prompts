      *   *Resolution:* The revision should be on (4). Why? Because (1) explicitly rejects Hard Determinism. (4) as written *is* a Hard Determinist claim for specific technologies. To maintain internal consistency with (1), (4) must be softened. This preserves the anti-determinist core (1, 3, 5) and the political artifact view (2).

