prompt: |-
  Right, so I've got ninety minutes next month with a reading group of about seven people — mostly philosophy PhD students, two from stats, and one economist who'll definately turn up late — and I've promised to get them to the point where they can argue about imprecise probabilities without quietly cheating. They're all fine with expected utility on a single sharp prior, and none of them have read anyting technical beyond one survey chapter. I don't want you to explain imprecise probabilities to me; I want a plan for how I explain them in that room.

  What I most want from you is the dependency structure — which idea has to be in place before the next one is even statable, and why. My hunch is that the first real move has to be killing off the thought that an imprecise credence is just a second-order probability distribution over sharp priors with a wide spread, because if they leave with that picture then every decision rule I show them afterwards quietly collapses back into 'take an expectation again'. But I don't know what has to be in place for that move to even land, and I can't tell whether 'it's a set of probability functions that the evidence doesn't single out' should come before it or after it. Then the decision rules, and the bit where the rules come apart — and I can't work out whether that needs the updating stuff before it or after it.

  Then the example. I want one case to carry the whole ninety minutes, and I want you to say what it has to have and what it has to lack. What I think it needs: at least two of the rules I'll mention give different verdicts on it; the imprecision in it isn't laziness or unfinished thinking, it survives someone going away and doing the maths properly; and there's no natural 'right' prior buried inside it that a bright student can dig out and use to dodge the whole apparatus. Why not the usual coin-of-unknown-bias thing? And is there anything I should be careful not to build the example out of — I'm worried that anything with frequencies in it will get read as sampling noise.

  Misconceptions, and this is where I think I'll get caught out. Here's my list, in no order: that an imprecise credence is a confidence interval; that it's a polite way of saying the calculation isn't finished; that the rule is always to maximise the worst case; that whatever the worst-case rule spits out is automatically undominated (I have a feeling that one's false — something can have exactly the same minimum as an option that beats it or matches it everywhere else — but I can't tell whether that's a fifth-minute point or a fiftieth-minute point); and that more evidence always narrows the interval, which I think is straightforwardly wrong given cases where conditioning on every cell of a partition leaves you wider than you started. Tell me which of these I've misdescribed, which ones they'll actually form and in what order, and exactly where in the sequence to head each one off.

  Two things I want bolted on that certainly aren't in the survey chapter. First: I've started seperating 'thin spread' — imprecision because there's hardly any evidence — from 'clash spread', where two models, or two equally credible experts, simply disagree, and I want them walking out able to say why those might not deserve the same handling (or why they might; I genuinely don't know which way it goes). Second, there's a half-baked rule I use myself: stay permissive, keep every option that isn't dominated across the whole set, and only then break the tie — and when I break it I don't use the midpoint or the average over the set, I use how much of the set is on that option's side. Tell me where that sits in the sequence, whether mentioning it early would breed a misconception, and whether it's really anything different from a rule I should be teaching them anyway.

  Last two things. One question for the final ten minutes that would show me they've got the idea rather than just the vocabulary — I was going to hand them a case where learning something makes the interval wider and ask what they'd do differently once they know which cell they're in, but I'm not sure that tests the right thing. And a list of what I should flatly refuse to explain at this level, saying out loud that I'm refusing it: I'm assuming the full lower-prevision machinery (the general setup where you work with lower and upper expectations directly rather than with a set of probabilities) and anything involving Choquet integrals, but tell me if I'm drawing the line in the wrong place. Write the whole plan in American English, spelling and all — the group's materials are in American and it drives them mad otherwise.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the Request:**

      *   **Audience:** 7 people (mostly philosophy PhDs, 2 stats, 1 late economist). Familiar with expected utility (EU) on sharp priors. Limited technical background (one survey chapter).
      *   **Goal:** Enable them to argue about imprecise probabilities (IP) without "cheating" (collapsing back to sharp priors/second-order probabilities).
      *   **Time:** 90 minutes.
      *   **Constraint:** Do *not* explain IP to me. Provide a *plan* for explaining it in the room.
      *   **Key Deliverables:**
          1.  Dependency structure (conceptual ordering).
          2.  The "Killer Move" (distinguishing IP from second-order probability).
          3.  The Example (criteria, what to avoid, why not the usual coin).
          4.  Misconception Management (ordering and timing of corrections).
          5.  Specific Add-ons ("Thin" vs. "Clash" spread; the user's "permissive + tie-break" rule).
          6.  Final Question (testing understanding).
          7.  Refusal List (what *not* to teach).
          8.  Style: American English.

  2.  **Deconstruct the Dependency Structure:**

      *   *Core Problem:* The user suspects the first move must be killing the "second-order probability" (SoP) view. If they think IP = distribution over priors, they'll just integrate it away.
      *   *Prerequisite for Killing SoP:* They need to understand *why* we are using a set in the first place. It's not ignorance *about* the probability; it's a representation of the evidence itself.
      *   *Sequence:*
          1.  Motivation (Why sharp priors fail here?).
          2.  Definition (Set of probabilities, not distribution over them).
          3.  Decision Rules (How to act given the set).
          4.  Updating (How the set changes).
      *   *User's specific worry:* Should "Set of functions evidence doesn't single out" come before or after killing SoP?
      *   *Resolution:* They must come together. You define the object *as* the set to block the SoP interpretation. If you define it as "uncertainty about the true prior," you invite SoP. If you define it as "the evidence licenses this range," you block it.
      *   *Decision Rules vs. Updating:* Rules need to come before updating. You can't update a decision procedure you don't have. Also, the "widening upon conditioning" paradox is a property of the updating, which relies on understanding the set first.

  3.  **Designing the Example:**

      *   *Criteria:* Two rules give different verdicts; imprecision is structural (not laziness); no hidden "true" prior; avoid frequencies (sampling noise).
      *   *Why not the usual coin (Ellsberg/Keynes)?* Coins often invite frequentist interpretations ("if I toss it enough times..."). Also, unknown bias often feels like "I just need more data to find the *real* p."
      *   *Better Example:* Needs to be about *model uncertainty* or *conflicting expert testimony* where aggregation isn't straightforward.
      *   *Idea:* A policy decision based on two conflicting climate models where the parameters aren't just unknown but fundamentally disputed (e.g., sensitivity feedback loops). Or a legal case with conflicting forensic methodologies.
      *   *Selection:* Let's go with a medical/policy intervention where two equally credible studies give disjoint results due to different structural assumptions, not just sample noise. This hits the "Clash Spread" requirement nicely.
      *   *What to lack:* No frequency data they can average. No obvious "weighting" of the models.

  4.  **Managing Misconceptions:**

      *   *List:* Confidence interval, unfinished calculation, maximin always, undominated = best, evidence always narrows.
      *   *Correction:*
          *   "Confidence Interval": Kill early. CI is about long-run frequency of the *method*, IP is about current state of belief/evidence.
          *   "Unfinished Calculation": Kill immediately with the definition.
          *   "Maximin Always": Address when introducing decision rules. Show E-admissibility vs. Maximin.
          *   "Undominated = Best": Address after rules. Show that being undominated just means "permissible," not "obligatory."
          *   "Evidence Always Narrows": Save for the Updating section (later). This is the "dilation" point.

  5.  **Integrating the Add-ons:**

      *   *Thin vs. Clash Spread:* This is a nuance on *why* the set exists. Introduce this after the definition but before decision rules. It helps justify why we might treat the set differently (e.g., maybe we can gather more data for 'thin' but not 'clash').
      *   *User's Rule (Permissive + Tie-Break):* This is a specific decision rule (looks like a variant of E-admissibility + a measure over the set).
      *   *Placement:* Introduce standard rules (Maximin, E-admissibility) first. Then introduce this as a "refinement" or "pragmatic add-on."
      *   *Risk:* If introduced too early, it looks like a secret way to get a sharp number (collapsing the set). Must emphasize it's a *tie-breaker* for action, not a *belief* update.

  6.  **The Final Question:**

      *   *User's Idea:* Learning makes interval wider (Dilation). Ask what they'd do.
      *   *Critique:* Good, but might be too technical.
      *   *Refinement:* Make it about *action*. If the interval widens, does your choice change? If you were indifferent, do you remain indifferent? If you had a strict preference, does it vanish?
      *   *Better:* Give a case where they have a sharp prior, then introduce IP. Ask: "Under sharp priors, you bet. Under IP, you abstain. Why is abstaining rational?" No, that's too basic.
      *   *Best:* The Dilation case. "You learn E. Your belief in H goes from [0.4, 0.6] to [0.1, 0.9]. Do you *have* to change your bet? Can you rationally keep the old bet?" This tests if they understand the set constrains action, not just numbers.

  7.  **The Refusal List:**

      *   Lower Previsions/Choquet: Yes, refuse. Too technical.
      *   Representation Theorems: Refuse. (e.g., Walley's stuff).
      *   Specific axiomatic justifications (e.g., Generalized Bayes vs. Natural Extension): Refuse. Keep it conceptual.
      *   Algorithm for finding the set: Refuse. Assume the set is given.

  8.  **Drafting the Plan (incorporating American English & Tone):**

      *   *Tone:* Professional, direct, structured.
      *   *Formatting:* Clear headings, time stamps.
      *   *Addressing the "Dependency" request:* Explicitly map the logical flow.
      *   *Addressing the "Late Economist":* Add a note on how to handle the latecomer without derailing.

  9.  **Refining the "Thin vs. Clash" and "Tie-Break" Rule:**

      *   *Thin vs. Clash:* This maps to "Ignorance" vs. "Conflict." In IP literature, this is often about the *source* of imprecision. It matters for updating. If it's 'thin', more data shrinks it. If it's 'clash', more data might not help if the models are structurally different.
      *   *Tie-Break Rule:* The user describes keeping non-dominated options, then breaking ties based on "how much of the set is on that option's side." This is effectively using a measure over the set of priors *for choice only*. This is dangerous territory (looks like SoP). I need to warn the user to frame this carefully: it's a *decision rule*, not a *belief representation*. It sits *after* standard rules.

  10. **Review against Constraints:**

      *   90 minutes? Yes, need tight timing.
      *   American English? Yes (e.g., "modeling" not "modelling", "prioritize" not "prioritise").
      *   Dependency structure clear? Yes.
      *   Misconceptions ordered? Yes.

  11. **Final Polish:** Check the logic on the "Undominated" misconception. The user is right: undominated doesn't mean optimal. It means permissible. I need to make sure the plan highlights the difference between *E-admissibility* (permissible) and *Maximin* (obligatory/safe).

      *   *Self-Correction on the Example:* The user asked "Why not the usual coin?" I need to answer that explicitly in the plan. The coin suggests a physical chance that exists but is unknown. IP is often about epistemic states where no physical chance is assumed or knowable. A better example is "Expert Disagreement" or "Model Ambiguity." Let's suggest a specific scenario: A drug approval where Mechanism A says efficacy is 0.8 and Mechanism B says efficacy is 0.2, and we don't know which mechanism is operative.

      *   *Self-Correction on Dependency:* The user asked if "Set of functions" comes before or after "Killing SoP". My verdict: They are the same move. You define the object *as* a set to kill the SoP interpretation.

      *   *Self-Correction on Updating:* Does decision rule come before updating? Yes. You need to know how to act before you know how your actions change with new info. Also, dilation (updating) is best understood as a stress test on the decision rules.

      *(Self-Correction during drafting)*: Wait, the user wants to know *exactly* where to head off misconceptions. I will embed these into the timeline.

      *(Self-Correction on the Tie-Break Rule)*: The user's rule sounds like "Alpha-Maximin" or a measure-based selection. I need to warn them that if they present this as "The Way," it undermines the IP framework. It must be presented as "What I do pragmatically *after* acknowledging the IP constraints."

      *(Final check on American English)*: Ensure "color" not "colour", "analyze" not "analyse", "prioritize" not "prioritise".

      *(Late Economist)*: Add a specific tactical note for the 15-minute mark when the economist arrives.

      *(Let's write it.)*
answer: |-
  Here is a ninety-minute battle plan designed to keep your group from collapsing imprecise probabilities (IP) back into sharp priors.

  ### I. The Dependency Structure

  You asked which idea must be in place before the next is statable. Here is the logical chain. If you break this order, the "cheating" (collapsing to sharp priors) becomes inevitable.

  1.  **The Representation (The Set):** You must establish that the credal state *is* a set of probability functions, not a distribution over them.
      *   *Why:* If they think the set represents uncertainty about which sharp prior is "true," they will simply take the expectation over the set to find the "real" prior. You must block this by defining the set as the *complete* representation of the evidence.
  2.  **The Source (Thin vs. Clash):** Once they accept the set, you must distinguish *why* the set exists.
      *   *Why:* If they think all imprecision is "lack of data" (Thin), they will assume more math fixes it. If they understand "model conflict" (Clash), they accept the set might be permanent. This protects the IP framework from being seen as a temporary calculation error.
  3.  **The Action (Decision Rules):** Only once the belief state is fixed do you introduce how to act.
      *   *Why:* If you introduce rules before the belief state is solid, they will choose the rule that allows them to calculate a single number (e.g., Maximin with a single worst-case prior) and ignore the rest of the set.
  4.  **The Dynamics (Updating):** Updating comes last.
      *   *Why:* You cannot understand dilation (intervals widening on evidence) if you don't first understand how the rules work on a static set.

  **Verdict on your hunch:** You are correct that killing the "second-order probability" view is the first real move. However, "It's a set of functions the evidence doesn't single out" is the *weapon* you use to kill that view. Do not separate them. State the definition *in order to* block the second-order interpretation.

  ### II. The Timeline (90 Minutes)

  **0:00–0:15: Motivation and The Killer Move**
  *   **Goal:** Break the sharp prior habit.
  *   **Action:** Present a case where assigning a sharp number is arbitrary. Ask them to assign a price to a bet. When they hesitate, point out that their hesitation isn't a lack of computing power; it's a feature of the evidence.
  *   **The Killer Move:** Explicitly state: "An imprecise credence is not a probability distribution over sharp priors. It is a set of priors that are all compatible with the evidence. There is no 'true' prior hidden inside this set waiting to be found."
  *   **Misconception Check:** Head off **"It's an unfinished calculation"** here. If they ask, "But what if we modeled the uncertainty about the prior?" reply: "Then you've just built a larger sharp prior. We are stopping at the level where the evidence runs out."
  *   **Misconception Check:** Head off **"It's a confidence interval"** here. Confidence intervals are about the reliability of the estimation method over repeated sampling. IP is about the current state of belief given the current evidence.

  **0:15–0:30: The Example (Thin vs. Clash)**
  *   **Goal:** Ground the theory in a case that survives scrutiny.
  *   **The Example:** Do not use the coin of unknown bias.
      *   *Why not the coin?* It implies a physical chance exists. Students will think, "If I toss it 10,000 times, I'll find the true *p*." That invites the "unfinished calculation" error.
      *   *What to use:* **Conflicting Structural Models.**
      *   *Scenario:* A pandemic intervention. Model A (epidemiological) says the intervention reduces transmission by 40%. Model B (economic-behavioral) says it increases transmission by 10% due to risk compensation. Both models are peer-reviewed, fit past data equally well, but rely on incompatible structural assumptions.
      *   *Why this works:* There is no "true" bias to find. The imprecision comes from the clash of credible theories. Running the math again won't help; you have to choose a model, and the evidence doesn't justify choosing one.
  *   **Thin vs. Clash:** Use this example to introduce your distinction.
      *   *Thin:* "We have no data on this new virus strain." (Solvable by waiting).
      *   *Clash:* "We have data, but the models disagree on how to process it." (Not necessarily solvable by waiting).
      *   *Instruction:* Tell them Clash spread might not deserve the same handling as Thin spread. With Thin, we might suspend judgment. With Clash, we might need to act despite the conflict.

  **0:30–0:50: Decision Rules**
  *   **Goal:** Show how rules come apart.
  *   **Action:** Introduce two rules.
      1.  **E-Admissibility:** An option is permissible if it maximizes expected utility for *at least one* prior in the set. (Very permissive).
      2.  **Maximin:** Choose the option with the best worst-case outcome across the set. (Very conservative).
  *   **The Divergence:** Apply these to your Example. E-Admissibility might allow the intervention (if Model A is in the set). Maximin might forbid it (if Model B's worst-case is terrible).
  *   **Misconception Check:** Head off **"The rule is always to maximize the worst case"** here. Show that E-Admissibility is a valid IP rule that isn't Maximin.
  *   **Misconception Check:** Head off **"Undominated = Best"** here. Explain that under E-Admissibility, multiple options can be undominated. Being undominated makes an option *permissible*, not *obligatory*. This is where philosophy students usually get excited about indeterminacy.

  **0:50–1:05: Your Tie-Break Rule**
  *   **Goal:** Introduce your pragmatic addition without undermining the framework.
  *   **Placement:** Introduce this *after* standard rules. Frame it as: "Okay, the rules leave us with a set of permissible options. We still have to act. Here is a pragmatic tie-breaker."
  *   **Warning:** If you introduce this too early, they will think the "measure over the set" is the actual belief state. You must emphasize: **This is for choice, not for belief.**
  *   **Is it different?** Yes. Standard IP says "It's okay to pick any undominated option." Your rule says "Pick the one supported by the largest proportion of the set." This is effectively a second-order move *at the decision stage only*.
  *   **Risk:** The stats students might call this "Bayesian Model Averaging." You need to clarify that you aren't averaging the beliefs; you are using the volume of the set to break a tie in action.

  **1:05–1:20: Updating and Dilation**
  *   **Goal:** Show that evidence doesn't always narrow the interval.
  *   **Action:** Describe a case where conditioning on new evidence widens the interval (Dilation).
  *   **Misconception Check:** Head off **"More evidence always narrows the interval"** here. Use the standard example: You know a coin is either biased 0.1 or 0.9. You learn the coin landed Heads. Your posterior might now cover the whole range [0, 1] depending on the setup of the partition.
  *   **Why this matters:** It proves IP isn't just "noisy sharp probability." Sharp probability *must* converge with evidence (under standard conditions). IP can legitimately become more uncertain.

  **1:20–1:30: The Final Question and Wrap**
  *   **Goal:** Test understanding.
  *   **The Question:** Do not just ask about the interval widening. Ask about the *action*.
      *   *Prompt:* "You face a choice between Bet A and Bet B. Under your current IP state, Bet A is E-Admissible and Bet B is not. You learn evidence E. This evidence dilates your credence, making *both* A and B E-Admissible. Are you rationally required to switch your preference, allowed to switch, or required to stay?"
      *   *Correct Answer:* They should recognize that moving from "A is permissible, B is not" to "Both are permissible" removes the obligation to pick A, but does not create an obligation to pick B. It tests if they understand permissibility vs. obligation.
  *   **The Late Economist:** When they arrive at minute 15, do not restart. Hand them a one-pager with the Definition and the Example. Tell them: "We are treating the set as the terminal belief state, not a distribution over priors. Catch up on the handout, and we are discussing decision rules in five minutes."

  ### III. The Refusal List

  You need to draw a line in the sand explicitly. Tell them: "To get through this in ninety minutes, I am refusing to explain the following. If you ask, I will tell you to read Walley or Seidenfeld on your own time."

  1.  **Lower Previsions / Choquet Integrals:** Refuse. This is the generalization where you work with expectations directly rather than sets of probabilities. It is mathematically elegant but will confuse them about the relationship between sets and numbers.
  2.  **Representation Theorems:** Refuse. (e.g., "What axioms guarantee a set representation?"). This is technical decision theory, not conceptual IP.
  3.  **Algorithmic Construction:** Refuse. (e.g., "How do I compute the natural extension?"). Assume the set is given. If they ask how to build the set, say: "That's a modeling choice, not a rule of IP."
  4.  **Robust Bayesianism vs. IP:** Refuse. Do not let them drift into a debate about whether IP is just Robust Bayes with a different name. Stipulate that for this session, the set is the ontology.

  ### IV. Summary of Misconception Management

  Here is the order in which they will form misconceptions, and where you kill them:

  1.  **"It's just a wide confidence interval."**
      *   *When:* Minute 5 (Definition).
      *   *Fix:* "Confidence intervals are about the method's long-run frequency. This set is about your current evidential support."
  2.  **"You just haven't finished the math."**
      *   *When:* Minute 10 (The Example).
      *   *Fix:* Use the "Clash Spread" model conflict. Math won't resolve structural disagreement.
  3.  **"Just pick the worst-case (Maximin)."**
      *   *When:* Minute 35 (Decision Rules).
      *   *Fix:* Show E-Admissibility. Show that Maximin is overly conservative and not the only IP rule.
  4.  **"Undominated means it's the best choice."**
      *   *When:* Minute 45 (Decision Rules).
      *   *Fix:* "Undominated means 'not forbidden.' It does not mean 'uniquely rational.'"
  5.  **"More data fixes everything (narrows the set)."**
      *   *When:* Minute 70 (Updating).
      *   *Fix:* Show Dilation. Evidence can increase indeterminacy.

  ### V. Final Advice on the "Tie-Break" Rule

  Be careful with your personal rule ("keep every non-dominated option, then break ties by how much of the set supports it").

  *   **The Risk:** To a sharp-prior thinker, "how much of the set" implies a measure over the set. If you have a measure over the set, you can integrate it to get a sharp prior. They will accuse you of collapsing IP back to sharp probability.
  *   **The Defense:** You must argue that the measure is **for decision only**, not for belief. It is a heuristic for action under indeterminacy, not a refinement of the credal state.
  *   **Placement:** Keep it in the "Pragmatics" section (Minute 50). Do not present it as part of the core theory. Present it as "How I sleep at night when the theory leaves me with five permissible options."

  ### VI. American English Note

  Ensure all handouts and board work use American spelling (*modeling, priorize, behavior, defense*). Your stats students will likely be using American software documentation, and the economist will be citing American journals. Consistency prevents unnecessary friction.

  Good luck. If you hold the line on the "Set as Terminal State" definition, you will get your ninety minutes. If you waver there, they will eat the framework alive.
