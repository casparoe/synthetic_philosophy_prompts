      *   Crucially: The *concavity* parameter. As $C$ drops and $B$ stays same (after adaptation), the gap narrows. The priority weight ratio $g'(w_B)/g'(w_C)$ decreases. The ratchet *must* stop eventually when the weights equalize (if they converge) or when the loss $\Delta$ outweighs the weighted gain. Marcus claims "no upper bound," but if $g$ is bounded or the gap closes, the ratchet self-limits.
