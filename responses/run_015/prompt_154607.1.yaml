  3. What a successful result would look like, what would count as failure, and the realistic six-month deliverable (~250 words);
  4. A brief defense of why this should be funded as philosophical work rather than as cultural studies (~150 words).

  Do not include a bibliography, reading list, or requests for citations—I will supply references myself. Keep the framing precise and tractable without web access, but ensure the niche asymmetry idea is central so the proposal is not a generic culture-war summary.
