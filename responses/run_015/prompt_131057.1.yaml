answer: |-
  ### Desiderata for an Account of Epistemic Dependence on Generative AI

  To adequately analyze how sustained reliance on generative AI reshapes human cognition—specifically regarding the erosion of understanding—any philosophical framework must satisfy the following five desiderata. Each is paired with its motivating case or distinction.

  **D1: The Agency-Shift Criterion**
  *   **Requirement:** The account must distinguish between *instrumental use* (where the human retains the reasoning architecture) and *structural outsourcing* (where the AI supplies the reasoning architecture).
  *   **Motivating Case:** The transition from using a model as an external reference tool (e.g., querying a database for a date) to treating it as a default reasoning partner (e.g., asking the model to synthesize a strategic argument). An adequate account must explain why the latter threatens the integrity of the believer's cognitive agency in a way the former does not.

  **D2: The Counterfactual Capacity Criterion**
  *   **Requirement:** The account must differentiate between retaining a true belief and retaining the capacity to generate counterfactual explanations for that belief.
  *   **Motivating Case:** The gap between knowing a medical diagnosis is correct (true belief) and knowing *why* it is correct such that one could predict how the diagnosis would change if specific symptoms were absent (counterfactual explanation). Understanding requires modal grip, not just factual accuracy.

  **D3: The Inferential Access Criterion**
  *   **Requirement:** The account must address the asymmetry between understanding an output and being able to reconstruct the inferential path that produced it.
  *   **Motivating Case:** A user accepts a mathematical proof or code snippet generated by an LLM. Even if the output is valid, if the user cannot trace the logical steps because the process is statistically opaque, the account must determine whether "understanding" has occurred or merely "recognition."

  **D4: The Responsibility-Tracking Criterion**
  *   **Requirement:** The account must establish boundary conditions for assigning epistemic responsibility when an opaque statistical process mediates testimony.
  *   **Motivating Case:** When an AI hallucinates a citation that a researcher includes in a paper, the framework must specify whether the error lies in the tool's failure or the user's failure to verify, and how that attribution changes if the verification is computationally infeasible for the human.

  **D5: The Empirical-Consistency Criterion**
  *   **Requirement:** The account must align with empirical findings on the fragility of explanatory access under automation (e.g., automation bias, skill atrophy).
  *   **Motivating Case:** Studies showing that pilots or diagnosticians who rely heavily on automated decision-support systems lose the ability to manually perform the task when the system fails. A philosophical account cannot posit a stable cognitive equilibrium that contradicts observed psychological atrophy.

  ---

  ### Classification of Desiderata

  **Non-Negotiable Requirements**
  These constraints are required for the account to be philosophically and scientifically viable.
  *   **D5 (Empirical-Consistency):** Any account ignoring the psychological reality of automation bias or cognitive offloading effects is descriptively inadequate.
  *   **D4 (Responsibility-Tracking):** Consistency with established results in social epistemology on testimony is required. We cannot absolve agents of responsibility simply because a tool was involved, nor can we demand responsibility for the unknowable.
  *   **D1 (Agency-Shift):** Must align with cognitive science distinctions regarding extended cognition versus mere tool use.

  **Camp-Specific Preferences**
  These reflect normative commitments that vary between philosophical schools.
  *   **D2 (Counterfactual Capacity):** *Intellectual Virtue Epistemologists* demand full preservation of pre-digital explanatory capacities (the user must be able to generate the counterfactuals themselves). *Functionalists* may accept that the *system* (human + AI) holds the counterfactual capacity, even if the human alone does not.
  *   **D3 (Inferential Access):** *Strict Internalists* insist that any delegation to an opaque system necessarily vitiates understanding regardless of the user's meta-cognitive monitoring. *Externalists* may argue that if the process is reliable, understanding is preserved even without access to the inferential path.

  ---

  ### Jointly Unsatisfiable Requirements (Tensions)

  There is a fundamental tension between **D2 (Counterfactual Capacity)** interpreted strictly and the efficiency gains implicit in **D1 (Structural Outsourcing)**.

  *   **The Tension:** Preserving robust individual understanding (the capacity to generate counterfactual explanations and reconstruct inferential paths) conflicts with accepting the efficiency gains of delegating complex inference to systems whose internal structure the user cannot represent.
  *   **The Incompatibility:** If a user maximizes efficiency by structurally outsourcing reasoning to a black box (satisfying the pragmatic goal of AI adoption), they necessarily sacrifice the ability to reconstruct the inferential path (violating D3) and diminish their individual counterfactual capacity (violating D2). An account cannot simultaneously mandate *full individual cognitive sovereignty* and *maximal reliance on opaque optimization*. One must be prioritized: either understanding is redefined as a systemic property (sacrificing individual sovereignty) or delegation is strictly limited (sacrificing efficiency).

  ---

  ### Evaluation of Frameworks

  **1. Extended-Mind Approach (Clark/Chalmers variant)**
  *   **Performance:** Treats the AI as a literal part of the cognitive system.
  *   **Resolution:** Resolves the tension between efficiency and understanding by redefining understanding as a property of the *coupled system* rather than the biological agent.
  *   **Failure:** Risks failing **D3 (Inferential Access)** and **D5 (Empirical-Consistency)**. If the "extension" is opaque, the user cannot manipulate it with the fluency required for true cognitive integration. Empirical data suggests users do not treat AI as seamlessly as biological memory or notebooks; they treat it as testimony, leading to atrophy rather than extension.

  **2. Corruption-of-Testimony Model (Traditional Social Epistemology)**
  *   **Performance:** Treats AI output as a form of assertion or testimony from a non-human source.
  *   **Resolution:** Strong on **D4 (Responsibility-Tracking)**; maintains clear boundaries for blame and verification duties.
  *   **Failure:** Fails **D1 (Agency-Shift)**. Testimony models assume a speaker-listener dynamic. Generative AI often functions as a co-reasoner, not just a witness. Furthermore, strict testimony models often trigger **D3 (Inferential Access)** failures: if AI is a "black box testifier," traditional norms suggest we should withhold belief, which contradicts the practical reality of AI integration.

  **3. Hybrid-Cognitive-Division View (Distributed Epistemology)**
  *   **Performance:** Views human and AI as distinct nodes in a division of epistemic labor.
  *   **Resolution:** Best fits **D5 (Empirical-Consistency)** and **D1 (Agency-Shift)**. It acknowledges that different tasks are allocated to different agents based on competence.
  *   **Failure:** Struggles with **D2 (Counterfactual Capacity)**. In a division of labor, the human node may lose the specific competence allocated to the AI node. Unless the framework mandates "redundancy training" (keeping humans skilled in tasks they no longer perform), it permits the erosion of individual understanding, potentially violating the non-negotiable requirement to maintain minimal epistemic agency.
