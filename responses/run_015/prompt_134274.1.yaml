answer: |-
  **Mark: 14/20**

  **Feedback:**

  Look, this is a solid effort on a properly tricky question. You've clearly grasped the core mechanics of the view and you've stuck to the structure of the prompt, which is half the battle won. It's a clear Upper Second (2:1) piece — you know the material, but there are a few places where the argument gets a bit wobbly under pressure. Here's the breakdown:

  *   **Structure & Clarity:** You've addressed (i), (ii), and (iii) explicitly, which makes marking this a breeze. Ta. The prose is clear and you don't waffle too much.
  *   **On (i) Circularity:** Your defence here is plausible. Arguing that the boundary is phenomenological (we just *know* severe suffering) is a standard move to avoid hidden weighing. However, you could have pushed harder on whether 'recognising' severity implicitly involves a comparison against a baseline of pleasure. You assume phenomenology is neutral; a critic would say it's loaded. Still, a decent pass.
  *   **On (ii) Decision-Making:** The R.M. Hare reference is a nice touch — shows you're reading beyond the lecture slides. But be careful: Hare's two levels are about rule vs. act utilitarianism, not really about incommensurability. It's an analogy, not a fit. Also, your solution to the aspirin case ("appeal to separate moral duties") is a bit of a hand-wave. If there's no metric, how do the duties prioritise? You've essentially swapped utilitarianism for a weak deontology without justifying the switch. It solves the *calculation* problem by ditching the calculation, which is fair, but needs more defence.
  *   **On (iii) The Threshold:** This is where you lose a few marks. The prompt defines the threshold as an *intensity* threshold (scalar), but you defend it as a *qualitative* shift (colour vs. sound). There's a tension here: if it's based on intensity, isn't that already a metric? You claim no prior metric is needed, but setting an intensity limit usually implies we can measure intensity against something. You need to reconcile how an intensity scale triggers a qualitative lexical shift without smuggling in comparison. You glossed over this contradiction a bit.
  *   **Critical Engagement:** You conclude the view "mostly succeeds" and is "coherent." I'd have liked to see a bit more scepticism. A first-class answer would have dug into whether 'localising incommensurability' actually solves the problem or just moves it to the boundary line. You identified the aspirin wrinkle, which is good, but dismissed it too quickly.

  **Summary:**
  Good knowledge, clear writing, and you hit all the targets. To push this into the 16+ range, you'd need to tighten up the tension between 'intensity' and 'quality' in part (iii) and be less willing to let the view off the hook on the decision-making collapse. But for a second-year exam? This is respectable work. Well done.
