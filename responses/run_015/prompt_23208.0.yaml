      *   **The Behavioral Econ Account (Ainslie/Loewenstein/Thaler):** Preferences change over time due to proximity to reward/cost. At $t_1$ (morning), I prefer Plan A (Hard Work). At $t_2$ (moment of action), I prefer Plan B (Easy Work). Since action aligns with preference at $t_2$, there is no synchronic conflict. Hence, no *akrasia* in the strict sense.
