      *   **Problem:** The tension between the traditional philosophical puzzle of *akrasia* (acting against one's better judgment) and the behavioral economic explanation of *hyperbolic discounting* (time-inconsistent preferences).
      *   **Specific Worry:** The BE account feels like a redescription, not a dissolution. If I always do what I most prefer *now*, where is the failure? If the failure is that my past self's plan gets overridden, isn't that just a problem of diachronic identity/authority, not weakness of will?
      *   **Goal:** A careful, worked-through answer (not a survey) that sorts out whether hyperbolic discounting dissolves or relocates the puzzle, specifically addressing the authority of the "earlier self" vs. the "later self."

  2.  **Deconstruct the Core Philosophical Conflict:**
