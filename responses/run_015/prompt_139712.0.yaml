      *   **The Task:** Audit the reader's conclusion. Specifically, analyze the mapping between Bentham's Panopticon, the user's school corridor, and modern social media. Identify where the analogy holds and where it fails (load-bearing features vs. engineering details).
      *   **Specific Questions to Address:**
          *   Does the mechanism work if the tower is known to be empty?
