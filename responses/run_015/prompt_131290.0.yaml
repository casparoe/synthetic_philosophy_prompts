answer: |-
  To construct an adequate theory of distributive justice, one must first define the criteria by which such a theory is judged. A theory cannot merely be internally consistent; it must align with considered moral judgments, empirical reality, and institutional feasibility. Below are the desiderata required for any theory addressing equality of welfare, resources, or capabilities to be considered viable.

  ### I. Core Desiderata for a Theory of Equality

  **1. Heterogeneity Sensitivity (The Disability Constraint)**
  *   **Requirement:** The theory must account for the fact that different individuals require different quantities of resources to achieve the same level of functioning or well-being.
  *   **Motivating Case:** Consider a person who uses a wheelchair versus an able-bodied person. If both receive an equal cash grant (resource equality), the wheelchair user may remain unable to access public transit or employment, while the able-bodied person thrives.
  *   **Specification:** An adequate theory must treat physical and cognitive differences not as mere preferences but as "conversion factors." It must justify transferring extra resources to the disabled person without violating the principle of equality. A theory that mandates strict equal resource division fails this test.

  **2. Responsibility Sensitivity (The Expensive Tastes Constraint)**
  *   **Requirement:** The theory must distinguish between unchosen needs and voluntarily cultivated preferences. It should not compensate individuals for disadvantages that arise from their own responsible choices.
  *   **Motivating Case:** Consider two people with equal resources. One is content with simple pleasures (beer and chess); the other has cultivated a taste for vintage champagne and rare truffles. If the theory aims for equality of welfare, it must tax the beer-drinker to subsidize the champagne-drinker to equalize their happiness.
  *   **Specification:** This is intuitively unjust. An adequate theory must hold individuals accountable for their preferences when those preferences are formed under fair conditions. It must prevent the "slavery of the frugal to the profligate."

  **3. Metric Integrity and Endogeneity Resistance (The Neuroadaptive Constraint)**
  *   **Requirement:** The metric used to measure equality must not be easily manipulable by the recipient to secure greater distributive shares, nor should it reward voluntary psychological adaptation to oppression.
  *   **Motivating Case:** In your hypothetical scenario, individuals possess neuroadaptive implants allowing them to reset satisfaction baselines. One person chooses to be easily satisfied (low resource cost for high welfare); another chooses to be hard to satisfy (high resource cost).
  *   **Specification:** If a theory treats self-modified conversion rates as compensable circumstances, it incentivizes strategic maladjustment. If it treats them as responsibilities, it risks punishing those whose "choices" are influenced by subtle social conditioning. The theory must specify a "cut" point: which psychological states are part of the person (responsibility) and which are part of the circumstance (compensable). It must not allow the metric of justice to be gamed by altering one's own psychology.

  **4. Institutional Visibility and Non-Invasiveness**
  *   **Requirement:** The information required to apply the theory must be accessible to public institutions without violating fundamental privacy or requiring impossible surveillance.
  *   **Motivating Consideration:** To distinguish between a genuine disability (compensable) and an expensive taste (non-compensable), or between a chosen neuro-setting and a biological defect, the state would theoretically need deep access to an individual's medical history, psychological formation, and neural data.
  *   **Specification:** A theory that requires omniscience to implement is not a theory of public justice. It must rely on proxies (e.g., observable resource bundles or basic capability thresholds) that are administratively feasible.

  **5. Distinction Between Moral Status and Distributive Share**
  *   **Requirement:** The theory must affirm equal moral status for all persons without mandating identical outcomes in all dimensions of life.
  *   **Motivating Consideration:** Equality of moral status means everyone counts for one and none for more than one. It does not imply that everyone must end up with the same income, happiness, or job.
  *   **Specification:** The theory must clarify whether it advocates for equality of *opportunity* (a fair starting line) or equality of *outcome* (a fair finishing line). It must explain why inequalities resulting from free exercise of agency are permissible, while inequalities resulting from brute luck are not.

  **6. Stance on the Good (Neutrality vs. Perfectionism)**
  *   **Requirement:** The theory must declare whether it remains neutral between competing conceptions of the good life or presupposes a specific account of human flourishing.
  *   **Motivating Consideration:** Liberal democracies typically value pluralism. However, measuring "capabilities" often requires defining what functions are valuable (e.g., is "ability to pray" a capability? Is "ability to use narcotics"?).
  *   **Specification:** If the theory is neutral (like Rawlsian resourcism), it risks ignoring that some resources are useless to certain conceptions of the good. If it is perfectionist (like Nussbaum's capabilities), it risks imposing a specific worldview on citizens who may reject it.

  ---

  ### II. Jointly Unsatisfiable Desiderata (Internal Tensions)

  Any adequate theory must acknowledge that certain desiderata pull in opposite directions. The following pairs are in significant tension:

  **1. Complete Neutrality vs. Non-Arbitrary Metric**
  *   **Tension:** To remain neutral among conceptions of the good, a theory should not judge the value of different lifestyles. However, to measure equality non-arbitrarily, the theory must weigh different goods (e.g., health vs. leisure).
  *   **Conflict:** If you build in a specific account of flourishing (to solve the metric problem), you violate neutrality. If you remain neutral (to respect pluralism), you lack a standard to judge whether a distribution is truly equal or merely different.

  **2. Responsibility Sensitivity vs. Institutional Visibility**
  *   **Tension:** To be fair, the state must distinguish between choice (expensive tastes) and circumstance (disability). To be feasible, the state cannot probe citizens' minds.
  *   **Conflict:** A theory that demands high responsibility sensitivity (Luck Egalitarianism) usually requires invasive information to verify what was "chosen." A theory that respects privacy (using rough proxies like income) inevitably compensates some expensive tastes and under-compensates some disabilities.

  **3. Metric Integrity vs. Respect for Autonomy (Neuroadaptive Case)**
  *   **Tension:** In the neuroadaptive scenario, if we respect autonomy, we must allow individuals to set their own satisfaction baselines. If we respect metric integrity, we must ignore voluntary changes that distort the distribution.
  *   **Conflict:** Penalizing someone for choosing a "hard-to-satisfy" neural setting punishes them for their autonomy. Rewarding them subsidizes their choice. Ignoring the setting renders the welfare metric useless.

  ---

  ### III. The Single Eliminating Requirement

  The single requirement that eliminates the largest number of existing theories is:

  **The Requirement of Responsibility Sensitivity combined with Informational Feasibility.**

  *   **Why it eliminates Welfarism:** Strict equality of welfare fails the "Expensive Tastes" test. It implies society must subsidize those who choose to be hard to please. Furthermore, it fails the "Happy Slave" test (psychological adaptation to oppression), violating Metric Integrity.
  *   **Why it eliminates Strict Resourcism:** Strict equality of resources fails the "Disability" test. It ignores heterogeneous conversion factors, treating unequal needs as equal claims. It also struggles with the Neuroadaptive case if resources are converted into welfare at radically different voluntary rates.
  *   **Why it strains the Capability Approach:** While the Capability Approach handles disability well, it often struggles with the Informational Feasibility constraint. Measuring complex capabilities across a population is administratively burdensome. Additionally, by defining a list of "central capabilities," it often violates the Neutrality requirement, sliding into perfectionism.

  This combined requirement forces a theory to walk a tightrope: it must be sensitive enough to human difference to be fair, but robust enough against manipulation and privacy violation to be implementable.

  ---

  ### IV. Brief Comparative Note

  *   **Equality of Welfare:** Largely abandoned in contemporary political philosophy. It fails the **Responsibility Sensitivity** desideratum (expensive tastes) and the **Metric Integrity** desideratum (adaptive preferences/neuro-hacking). It is too vulnerable to manipulation and ignores agency.
  *   **Equality of Resources (Resourcism):** Dominant in liberal theory (e.g., Rawls, Dworkin). It satisfies **Neutrality** and **Informational Feasibility** well. However, it struggles with **Heterogeneity Sensitivity** (disability) unless modified (e.g., via insurance schemes), and it can be insensitive to how resources actually translate into living conditions.
  *   **The Capability Approach:** (Sen, Nussbaum). Strongest on **Heterogeneity Sensitivity** and **Moral Status**. It focuses on what people can actually do and be. However, it faces the hardest challenges regarding **Neutrality** (often requires a perfectionist list of capabilities) and **Informational Feasibility** (capabilities are harder to measure than income). Regarding the **Neuroadaptive** case, it offers a middle ground: it would likely focus on the *capability* to adjust one's baseline, rather than the outcome of the adjustment, treating the manipulation of the self as a function of agency.

  In summary, an adequate theory must navigate the tension between compensating for unchosen misfortune and respecting personal choice, all while relying on data that a real government can actually collect without becoming totalitarian. Most theories fail because they optimize for one side of this tension at the expense of the other.
