answer: |-
  Here are ten interview questions drafted for your seminar with Dr. Marlow. They are sequenced to begin with comparative advantages (where her "grammar" defense is strongest) and move toward internal coherence and metaphysical scope (where that defense becomes untenable).

  ### 1. The Russellian/Fregean Comparison
  **Question:** Dr. Marlow, your friend in the audience holds what he calls the "cheap Russellian" view: relations just relate, and no glue is needed. He suggests your procedure view is merely the Fregean idea that concepts are unsaturated, restated in more expensive computational vocabulary. What does the procedure view buy you that a straightforward Russellian realism or a classic Fregean unsaturatedness doesn't already provide?

  **Follow-up:** If your answer is that procedures avoid reifying the proposition as an object, doesn't the Russellian say the exact same thing? Where is the actual gain in parsimony?

  **Expected Answer & Reasoning:** She will likely argue that Frege and Russell still treat the proposition as a *content* or a *truth-condition* that stands between the mind and the world, whereas a procedure is an *activity*. She will claim the gain is dissolving the "entity" status entirely, not just changing its properties. She needs to establish early that this is an ontological category shift, not just a semantic tweak.

  ### 2. The "Mere List" Objection
  **Question:** Critics of dissolution strategies often argue that without a unifying principle, a proposition collapses into a mere list of constituents: $\{a, R, b\}$. If a proposition is a routine, what prevents that routine from being just a list of instructions rather than a coherent check? How do you distinguish a unified procedure from a scattered set of steps?

  **Follow-up:** If you say the "order of execution" unifies it, aren't you just reintroducing structure under the name of "order"?

  **Expected Answer & Reasoning:** Here she will lean heavily on her signature line. She will argue that a list is a static object (reading grammar into the world), while a procedure is dynamic. She will claim "order" in a routine is operational, not structural. This is the last question where she can use the "grammar" line comfortably.

  ### 3. Symmetric Relations and Individuation
  **Question:** Let's test the individuation of these procedures. If $R$ is a symmetric relation, how do you distinguish the procedure for checking $aRb$ from the procedure for checking $bRa$? If the routine just checks for the presence of $a, b,$ and $R$, the output is identical.

  **Follow-up:** If you say the *search order* differs (check $a$ first, then $b$), doesn't that make the proposition sensitive to cognitive access rather than truth conditions?

  **Expected Answer & Reasoning:** She will likely admit that on her view, $aRb$ and $bRa$ might be the same proposition if the relation is symmetric, or she will argue that the *entry point* of the procedure differs. She will try to avoid committing to worldly differences, keeping the distinction within the "checking" mechanism.

  ### 4. Cognitive Significance vs. Structural Back-Door
  **Question:** Following on that: consider "a is taller than b" and "b is shorter than a." These have different cognitive significance. To capture this, your procedures must differ. But if the criterion for procedure-identity is fine-grained enough to track cognitive significance, haven't you just reintroduced propositional structure through the back door?

  **Follow-up:** If the structure is in the procedure, and the procedure *is* the proposition, in what sense have you dissolved the structured proposition rather than relocated it?

  **Expected Answer & Reasoning:** This pressures the "grammar" line. She will likely argue that procedural structure is not *ontological* structure. She will claim you are still "reading grammar" if you think procedural steps require a "glue" to hold them together. This is the turning point where the line starts to sound defensive.

  ### 5. False Propositions and Unity
  **Question:** Let's move to falsehood. If the proposition that $aRb$ is a routine for checking reality, what holds that proposition together when $aRb$ doesn't obtain? The check fails, but the proposition remains a unity capable of being believed. What is the unity of a failed check?

  **Follow-up:** If the unity depends on the *possibility* of a successful check, aren't you grounding the proposition in a modal fact about the world, rather than just the procedure itself?

  **Expected Answer & Reasoning:** She will argue that the unity is internal to the algorithm, not dependent on the output. A broken machine is still a machine. She will use the "grammar" line to suggest you are looking for an object (the fact) to ground the proposition, which she denies exists.

  ### 6. Absence and Negative Facts
  **Question:** If the procedure runs and finds nothing, does the falsity of the proposition require an ontological correlate, like an absence or a negative fact? Your parsimony was supposed to avoid these. Do you now owe an account of absence that your dissolution was meant to bypass?

  **Follow-up:** If you deny absences, how do you explain the truth of the negative proposition without making the "failure of the check" a feature of the world?

  **Expected Answer & Reasoning:** She will firmly deny negative facts. She will argue that "absence" is just the procedure returning a null value. She will claim asking for a correlate for falsehood is the quintessential example of "reading grammar into the world" (expecting a name for every true sentence).

  ### 7. The Regress of Procedures
  **Question:** You argue Bradley's regress dissolves because propositions aren't objects needing glue. But a procedure has steps. What makes those steps steps of *one* procedure rather than several procedures run in sequence? Does Bradley's argument not simply reappear one level up?

  **Follow-up:** If you say the steps are unified by the algorithm's definition, isn't that definition just a new kind of glue? Is this a fatal symmetry, or a place where you bite the bullet?

  **Expected Answer & Reasoning:** Here the "grammar" line fails. Procedures aren't grammar; they are functional unities. She will likely bite the bullet and argue that procedural unity is primitive or functional, not metaphysical. She must admit that *some* unity is brute, which weakens her claim to have fully dissolved the problem.

  ### 8. Facts vs. Propositions (The Friend's Objection)
  **Question:** My colleague argues that Bradley's real target isn't propositions, but facts: what makes it the case that $a, R,$ and $b$ compose a single state of affairs in the world rather than three scattered items? Does your procedure view dissolve the regress for facts, or only for our talk about them?

  **Follow-up:** If it only dissolves it for propositions, haven't you merely changed the subject from metaphysics to philosophy of language?

  **Expected Answer & Reasoning:** She cannot use the "grammar" line here, as facts are not grammatical. She will likely try to extend the view: facts are just successful checks. Alternatively, she will explicitly limit her scope. This forces her to choose between metaphysical ambition and linguistic containment.

  ### 9. The Cost of Declining the Facts Question
  **Question:** If you choose to say facts aren't your problem, what is the cost? If the world still contains unified states of affairs that require no glue, why isn't the Russellian right? If they *do* require glue, why isn't your view incomplete?

  **Follow-up:** Are you entitled to dissolve the linguistic regress while leaving the metaphysical regress untouched, or does the latter infect the former?

  **Expected Answer & Reasoning:** She will likely argue that the metaphysical regress is a pseudo-problem generated by the linguistic one. She will claim that once we stop "reading grammar into the world," the demand for factual unity vanishes. This is her last stand: claiming the metaphysical problem is an illusion caused by the linguistic error.

  ### 10. Falsification Conditions
  **Question:** Finally, a methodological question. What finding, argument, or intuitive case would make you give this view up? If you encountered a case where the procedure view yielded the wrong truth-conditions or required more ontology than the realist view, would you abandon it?

  **Follow-up:** If the answer is "nothing," does that suggest this is a conceptual framework rather than a truth-apt theory?

  **Expected Answer & Reasoning:** She will likely cite a case where proceduralism fails to capture logical entailment or modal profiles. She will want to maintain that this is a theoretical virtue choice (parsimony), so she must admit that if parsimony is better served elsewhere, she would move. This closes the seminar by grounding the view in standard philosophical adjudication.
