answer: |-
  Here is a prompt designed for your dataset. It is structured to force the model into a tension between historical fidelity and modern applicability, requiring it to resolve philosophical conflicts rather than retrieve facts.

  ***

  **Prompt:**

  > Draft a set of desiderata for a modern Stoic revival that actually retains the hard Dichotomy of Control, rather than the watered-down self-help version. For each desideratum, provide the philosophical case behind it.
  >
  > Your list must address three specific friction points:
  > 1.  **Righteous Anger:** How to handle anger at structural unfairness without collapsing the internal/external boundary (i.e., without calling justice an "indifferent" we can't control).
  > 2.  **Collective Agency:** Where to draw the line on strikes or boycotts, where the distinction between "my assent" and "our action" blurs.
  > 3.  **Mediated Environments:** How to account for algorithms that shape what I assent to before I'm even aware of the impression.
  >
  > For each point, explicitly flag whether it is a **Core Stoic Commitment** or a **Modern Add-on**.
  >
  > Finally, answer these two meta-questions:
  > *   Which single desideratum above kills the take that "Stoicism is just CBT with Latin quotes"?
  > *   Are any two of these desiderata jointly unsatisfiable given the original texts (e.g., Epictetus vs. Seneca)? If so, which pair and why?
  >
  > Keep the tone loose and focused on reasoning; do not worry about precise citations, but do not hand-wave the contradictions.

  ***

  ### Evaluator Notes (Why this is a "hard" prompt)

  *   **Constraint Conflict:** It forces the model to balance historical accuracy (Core Commitments) against functional utility (Modern Add-ons). A weak model will conflate the two or default to generic self-help advice.
  *   **The "CBT Killer":** To answer the meta-question correctly, the model must understand that CBT focuses on *correcting* cognitive distortions internally, whereas Stoicism (in this rigorous framing) requires engaging with external structures (collective agency) that CBT might categorize as "out of control." The **Collective Agency** desideratum is usually the wedge here.
  *   **Unsatisfiable Pairs:** This tests the model's ability to detect tension. For example, **Righteous Anger** (which implies external things matter enough to get angry about) often conflicts with the **Core Stoic Commitment** that only virtue is good. A sophisticated response will acknowledge that a "modern revival" might have to break the original system to accommodate structural anger.
  *   **Algorithmic Assent:** This requires applying ancient epistemology (phantasiai/synkatathesis) to a technological context the ancients couldn't envision, testing analogical reasoning rather than retrieval.
