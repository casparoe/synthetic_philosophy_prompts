answer: |-
  You have correctly identified that you are wrestling with two distinct metaphysical problems that your characters (and perhaps you) have been treating as one. This conflation is exactly why you feel stuck. If you untangle them, the third act writes itself.

  Here is the breakdown of the philosophy, the verdicts they imply, and the stance I believe you should take for the novel.

  ### 1. The Conflation: Letterhood vs. Stylehood

  You asked: *What makes every 'a' an 'a'?*
  But the lawsuit isn't about that. The lawsuit is about: *What makes this 'a' Marta's?*

  *   **Question A (Universals):** What allows a circle-and-stick, a Trajan capital, and a cursive loop to all be read as the category "a"? This is a question about **semantic function**.
  *   **Question B (Aesthetics/Authorship):** What allows us to look at two geometrically distinct 'a's and say they share the same *voice*? This is a question about **style**.

  The Rival's expert is answering Question A to win Question B. He is arguing: "Since no one owns the category 'a' (Question A), and my shapes are physically different, I own nothing (Question B)."
  Marta's expert is arguing Question B directly: "The category is public, but the specific *realization* of that category has an identity that transcends coordinates."

  For the deposition scene to sing, Marta needs to realize that the Rival is hiding behind Question A to obscure the theft of Question B.

  ### 2. Candidate Accounts & Their Verdicts

  Here are the main philosophical accounts of form, applied to your lawsuit.

  **A. Strict Nominalism (The Rival's Position)**
  *   **The Theory:** Only particular, physical instances exist. There is no "essence" of a font. There are only vectors, coordinates, and ink. If the coordinates do not match, the objects are not the same.
  *   **The Verdict:** **Rival Wins.** If art is only its physical footprint, and the footprints don't overlap, there is no theft. This reduces type design to mere drafting.
  *   **The Flaw:** It fails to explain human perception. If a human observer instantly recognizes the style, but the philosophy says the style doesn't exist, the philosophy is inadequate to describe the reality of the medium.

  **B. Platonism (The Essentialist Position)**
  *   **The Theory:** There is an ideal "Marta Font" existing in a realm of forms. The physical glyphs are just imperfect shadows of this ideal.
  *   **The Verdict:** **Marta Wins (but vaguely).** If the Rival accessed the same "ideal form" Marta did, he stole the blueprint of her mind.
  *   **The Flaw:** It's too mystical for a courtroom. It sounds like claiming ownership of an idea rather than an expression. It makes Marta sound like she's claiming she invented the letter 'a', not the style.

  **C. Wittgensteinian Family Resemblance**
  *   **The Theory:** There is no single thread running through all instances of "Marta's Font." Instead, there is a network of overlapping similarities (x-height, contrast, terminal shape, stress). No single feature is definitive, but the *cluster* is recognizable.
  *   **The Verdict:** **Marta Wins.** Even if the Rival changed every single terminal, if the *cluster* of relationships remains intact, the identity persists.
  *   **The Flaw:** It's a bit fuzzy for a legal binary (guilty/not guilty), but excellent for a jury of peers (designers).

  **D. Structural/Relational Realism (My Recommendation)**
  *   **The Theory:** The "object" is not the line itself, but the **relationship between the lines**. In type design, the shape of the letter is defined as much by the counterform (the white space inside and around it) as the black stroke. The "art" is the system of proportions, the rhythm of whitespace, and the logic of construction.
  *   **The Verdict:** **Marta Wins.** The Rival copied the *logic*, not the *lines*. He reverse-engineered the rules that generate the shapes. Stealing the recipe is theft, even if you bake the cake in a different oven.

  ### 3. The "Mutating Sketches" Wrinkle (Ship of Theseus)

  You asked: *If Marta's early sketches look nothing like the final font, is it even the same typeface?*

  This is the **Ship of Theseus** problem applied to design. If you replace every plank (glyph) over eight years, is it the same ship?

  *   **The Nominalist says:** No. The final font is a different object than the sketch.
  *   **The Structuralist says:** Yes, because the *generative intent* remained constant.

  This is actually Marta's strongest weapon. If her own font mutated wildly from sketch to finish, it proves that **the value is not in the static shape.** The value is in the *decision-making process* that guided those mutations.

  The Rival did not engage in the process. He looked at the finished ship and tried to build a duplicate without understanding the naval architecture. He copied the *result* of the evolution without undergoing the *evolution*. Therefore, he possesses the shell, but not the soul.

  ### 4. Which Side I Defend (And You Should Too)

  I defend **Structural/Relational Realism**.

  Here is why: It aligns with how type designers actually think. A type designer does not draw 26 letters; they design a *system* that generates 26 letters. They design the "DNA," not the organism. If the Rival's font has the same DNA (same contrast axis, same stress, same proportional rhythm), it is a clone, even if the fur pattern (the specific curves) is slightly different.

  This view allows you to make a profound point about creativity: **Creativity is not the output; creativity is the constraint.** Marta spent eight years establishing the constraints (the rules of the system). The Rival bypassed the labor of establishing constraints and simply mimicked the output.

  **The Verdict for the Novel:**
  The Rival is guilty of stealing the *system*, not the *shapes*. He stole the "grammar" of Marta's visual language.

  ### 5. Writing the Deposition Scene

  Do not have Marta argue about curves. Have her argue about *space*.

  **The Setup:**
  The Rival's expert puts two 'a's on the screen. One Marta's, one the Rival's. He overlays them. They don't match. "Case closed," he says.

  **Marta's Counter-Move:**
  Marta should ask to see the **negative space**.
  She shouldn't look at the black letters. She should look at the white holes inside them (the counters) and the white rivers between them (the kerning).

  **The Argument:**
  "Look at the white space inside the 'e'," she says. "In my font, that space is a teardrop. In yours, it's a circle. But the *tension* of that space relative to the stem is identical. You nudged the curve, but you kept the pressure exactly the same."

  She needs to articulate that she didn't draw shapes; she tuned a frequency. The Rival didn't copy the drawing; he tuned his instrument to her frequency.

  **Addressing the Sketches:**
  When the Rival's lawyer brings up her early sketches ("You changed your mind a hundred times, how can you claim this is the one true font?"), Marta should embrace it.
  "Exactly," she says. "The font isn't the drawing. The font is the *reason* I changed the drawing. I spent eight years finding the logic. You spent eight weeks tracing the result. You have the map, but you don't know the territory."

  ### Summary for the Author

  1.  **Split the questions:** The trial is not about whether it's an 'a' (Universals); it's about whether it's *Marta's* 'a' (Style/Authorship).
  2.  **The Philosophy:** Adopt **Relational Realism**. The art is in the relationships (proportions, rhythm, whitespace), not the coordinates.
  3.  **The Sketches:** Use the mutating sketches to prove that the *process* is the work, not the *output*. The Rival stole the output without the process.
  4.  **The Climax:** Marta wins by shifting the court's gaze from the black ink to the white space. She proves that while the *geometry* was nudged, the *topology* (the structural connectivity) was stolen.

  This gives Marta the moral high ground without requiring her to claim ownership of the alphabet itself. She owns the *song*, not the *notes*.
