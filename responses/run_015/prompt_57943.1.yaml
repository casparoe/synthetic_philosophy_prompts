answer: |-
  Here is an analysis of your friend's moral framework, applied to your situation.

  ### 1. Predicted Classification
  Based on the patterns in her past verdicts, I expect your friend to classify your decision to publish the tool as **supererogatory** (praiseworthy but not required). She will likely view it as a "good deed" rather than a "duty."

  ### 2. Two Competing General Rules
  Both of the following rules are consistent with every example you provided about your friend, but they yield opposite verdicts on your open-source puzzle.

  **Rule A: The Specific Obligation Principle (Source-Based)**
  *   **Definition:** An action is a **duty** only if it arises from an explicit role, contract, or promise you have made. If there is no specific commitment, the action is **supererogatory**, regardless of how easy or beneficial it is.
  *   **Fit with past verdicts:**
      *   *On-call:* Duty (Explicit role).
      *   *Weekend shift:* Duty (Explicit promise).
      *   *Vacation fix/Donation/Traffic:* Supererogatory (No specific contract to fix others' bugs, donate money, or save strangers).
  *   **Verdict on your puzzle:** **Supererogatory.** You have no specific rule or contract requiring publication.

  **Rule B: The Negligible Cost Principle (Efficiency-Based)**
  *   **Definition:** An action is a **duty** if the cost to you is negligible compared to the benefit provided to others. **Supererogation** is reserved for actions that involve significant sacrifice (money, time, risk).
  *   **Fit with past verdicts:**
      *   *Donation/Vacation/Traffic:* Supererogatory (High cost: salary, vacation time, physical safety).
      *   *On-call:* Duty (High cost, but the benefit/prevention of disaster is massive and within role scope).
      *   *Weekend shift:* Permissible to skip volunteering (The cost of breaking a promise is higher than the benefit of volunteering).
  *   **Verdict on your puzzle:** **Duty.** The cost (one afternoon + paperwork) is negligible compared to the benefit (saving hundreds of developers time).

  ### 3. Best-Supported Prediction & Reasons
  I predict your friend follows **Rule A (Specific Obligation Principle)**. Therefore, she will say publishing is **supererogatory**.

  **Reasons:**
  1.  **The "Vacation Fix" Analogy:** This is the strongest evidence. Fixing a failed deployment benefits the company significantly (high benefit). However, because she did not cause it and was on vacation (outside her immediate role obligations), she classified it as supererogatory. Your tool benefits outside developers significantly, but since it is not a mandated part of your role, she will likely treat it the same way: a generous gift, not a requirement.
  2.  **The "Weekend Shift" Priority:** She believes keeping a promised shift (specific obligation) outweighs volunteering (general beneficence). This shows she prioritizes *commitments* over *outcomes*. Since you have no commitment to publish, the high outcome (helping outsiders) does not create a duty.
  3.  **Role Boundaries:** Her distinction between "on-call" (duty) and "vacation" (supererogatory) suggests she draws hard lines around professional status. Even if the work is similar, the *authorization* defines the duty. Since you have permission but not a requirement, you are in a "voluntary" zone.

  ### 4. The Separating Case
  To definitively determine which rule she follows, ask her this specific hypothetical:

  **The Case:** *"Imagine you walk into the office kitchen and see a single coffee cup left in the sink. It takes 10 seconds to rinse and load it. It is not your cup, and cleaning the kitchen is not in your job description. Are you morally required to wash it, or is it just nice if you do?"*

  *   **If she says "Required" (Duty):** She follows **Rule B (Negligible Cost)**. The cost is trivial, the benefit (cleanliness for others) is real. This implies she would also view your open-source publishing as a **Duty**.
  *   **If she says "Nice but not required" (Supererogatory):** She follows **Rule A (Specific Obligation)**. It's not her cup, not her job. This confirms she will view your open-source publishing as **Supererogatory**.

  ### 5. Vulnerability & Changing Considerations
  My reasoning is most vulnerable regarding the **definition of "Company Time."**

  *   **The Risk:** My prediction assumes your friend views open-sourcing the tool as "benefiting outsiders" (like volunteering). However, if she views open-sourcing as a **marketing or recruiting asset for your company**, her logic might shift.
  *   **Why it changes the prediction:** In the "Weekend Shift" case, she prioritized company obligations over general volunteering. If she is convinced that publishing the tool is actually a *company duty* (because it builds brand reputation), she might classify it as **Duty** under Rule A, because you are an employee obligated to act in the company's best interest during company time.
  *   **What to watch for:** If she asks, "Does your boss know this helps recruiting?" or "Is this good for the company brand?", she is testing whether this falls under your implicit employment contract. If she focuses only on the "helping outsiders" aspect, the Supererogatory prediction holds.
