ence is produced not just stored. If the archivist stays hands-off they are implicitly validating the silences created by the powerful creators of the records so neutrality is actually a political stance that favors the status quo. The analogy breaks because a library tries to represent knowledge comprehensively while an archive represents the specific functions of an entity and that entity is rarely neutral. So no the hands-off argument doesn't survive once you realize that provenance structures retrieval and that acquisition is tied to power rather than market demand. The archivist has to acknowledge their role in shaping the narrative because the archive was never neutral to begin with and pretending otherwise just hides the power structures under a label of objective storage. You're right to question the analogy because it smuggles in a false picture of neutrality that lets archivists off the hook for the gaps in the historical record.

