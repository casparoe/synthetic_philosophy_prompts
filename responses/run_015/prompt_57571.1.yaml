          *   *Critique:* The user anticipates this ("tracking different real features of different ecologies"). The user needs to block the idea that moral facts are ecology-relative. Realism usually implies mind-independence, not ecology-dependence (unless it's a specific naturalist realism).
          *   *Advice:* The premise that fails is the assumption that realism requires *universal* weights rather than *context-sensitive* weights. A sophisticated realist (e.g., functionalist) could say the weight *should* vary with ecology. To block this, the user needs to argue that the variation is *arbitrary* or *path-dependent* rather than *optimal*. The current draft says "non-truth-conducive," but needs to justify why market integration isn't truth-conducive regarding moral weights. Strengthen the claim that these variables are causally explanatory of the belief, not constitutive of the fact.

