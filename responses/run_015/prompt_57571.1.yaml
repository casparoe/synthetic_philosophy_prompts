  3.  **Drafting Comments under Headings:**

      *   **1. Does the taxonomy hold?**
          *   *Issue:* Annexation vs. Weight. If a domain is "annexed" (moralized) in Culture A but "etiquette" in Culture B, is that just Weight = 0 (or near 0) in Culture B?
          *   *Analysis:* The distinction relies on the *type* of normative force (blame vs. manners). If Culture B treats it as manners, is the moral weight zero, or is the domain absent from the *moral* sphere but present in the *normative* sphere?
          *   *Critique:* Annexation might collapse into Weight if "moral weight" is defined broadly as "normative importance." However, if "moral" is defined by specific sanctions (blame vs. shame vs. annoyance), annexation is distinct.
          *   *Advice:* Clarify the definition of "moral." If moral is defined by sanction type, annexation holds. If defined by importance, it collapses. The paper needs to defend the distinctness of moral vs. non-moral normative systems. If it collapses, the argument survives but becomes simpler: it's all weight variation. The loss is nuance about the *nature* of the norm, not just its priority.

      *   **2. Is the weighting-fixity argument valid?**
          *   *Issue:* The move from "weights vary with ecology" to "no culture-neutral way to fix weights."
