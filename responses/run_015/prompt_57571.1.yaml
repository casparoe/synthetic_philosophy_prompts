answer: |-
  **1. Does the taxonomy hold?**

  The distinction between *presence* and *weight* is robust and standard in the literature. The distinction between *weight* and *annexation*, however, is unstable and risks collapsing. You define annexation as a consideration moving between moral and non-moral normative systems (e.g., etiquette vs. blame). But if a population treats a violation as a matter of "bad manners" that warrants social ostracism or reputational damage, the functional output is nearly identical to moral blame. If the consequence of violating etiquette is exclusion from cooperation, the "weight" of that norm in practical reasoning is high, even if the label is non-moral.

  If annexation collapses into weight (where "moral weight" is simply the priority assigned in practical deliberation regardless of the label), you lose the ability to claim that the *structure* of the moral faculty is universal. You would only be claiming that the *normative* faculty is universal. This weakens your defense against the anti-realist, who can argue that if the "moral" label is arbitrary, the moral domain itself is not natural.

  To survive, you must defend a substantive definition of "moral" that is not merely functional. You need to argue that moral norms possess a specific phenomenology or sanction type (e.g., authority-independent wrongness) that etiquette lacks. If you cannot sustain this boundary, you should collapse annexation into weight. The paper can survive on a two-way distinction (Presence vs. Weight), but you must concede that your claim shifts from "the moral architecture is universal" to "the normative architecture is universal and moralization is a parameter." This is a weaker claim but potentially more defensible.

  **2. Is the weighting-fixity argument valid?**

  The inference from "weights vary with non-truth-conducive factors" to "there is no culture-neutral way to fix the weights" contains a gap. You anticipate the realist reply: that the correlation with ecology indicates the weights are tracking real, ecology-relative moral facts (e.g., purity norms are true in high-density populations because they serve health functions).

  This realist reply works if you are attacking a Platonic realism where moral facts are entirely context-independent. It fails if you are attacking a naturalist realism where moral facts are functions of human flourishing within specific environments. To block this, you cannot simply assert that market integration is "non-truth-conducive." You must argue that the variation in weights is *path-dependent* rather than *optimizing*.

  Currently, your premise is that variables like kinship structure are not truth-conducive. You need to justify this. If tight kinship structures genuinely require different fairness weights to maintain stability, then those weights *are* truth-conducive relative to the goal of social stability. To fix this, you must argue that the observed variation exceeds what is functionally required by the ecology, or that the mechanism of variation is cultural drift rather than adaptive tracking. Without this, the realist can claim idealization simply includes "full knowledge of local ecological constraints," and the weighting-fixity problem dissolves into context-sensitivity.

  **3. The self-undermining worry.**

  Your worry is that the counterweight test (stability under ecological variation) is itself a weighting preference that might be culturally contingent. If your preference for provenance-independence is a product of WEIRD academic ecology, the test undermines itself.

  You can escape this by categorizing the counterweight test as a *second-order epistemic norm* rather than a *first-order moral weighting*. The test is not claiming that "universal weights are morally better"; it is claiming that "universal weights are more likely to track mind-independent facts." This is a claim about truth-tracking reliability, not moral value.

  However, this invites a deeper skepticism: are epistemic norms themselves culturally contingent? If you concede that epistemic norms vary, you lose the ground to stand on. You should revise section five to explicitly state that the counterweight test is proposed as a necessary condition for *realism*, not as a moral truth. You are arguing internally to the realist: "If you want realism, you need stability; you don't have stability; therefore you don't have realism about weights." This makes the argument conditional and avoids the genealogical self-undermining. You do not need to prove the test is universally valid, only that it is required by the realist's own commitments.

  **4. Empirical accuracy.**

  Several characterizations require tightening to avoid easy rebuttal:

  *   **Economic Games:** The claim that "narrow self-interest... failed everywhere" is too strong. While the majority of societies deviated from the self-interest model, some small-scale societies made low offers and rarely rejected them, closely approximating the self-interest prediction. Qualifying this to "failed in the majority of populations" or "failed systematically across most sites" is safer. Additionally, the link between market integration and generosity is positive but not linear across all datasets; some highly market-integrated groups show lower offers in certain game variants.
  *   **Harm vs. Purity:** The claim that clean presence variation is "very little" is contested. There are populations where purity violations are genuinely unintelligible as moral wrongs, not just lower weight. If a group lacks the concept of spiritual pollution entirely, that is presence variation, not weighting. You should acknowledge that while *some* presence variation exists, it is not sufficient to ground a global anti-realist argument, rather than implying it is virtually non-existent.
  *   **East–West Cognition:** You state this literature is "mostly about how much of the perceptual and explanatory field a judgment takes in." This is accurate for perception, but the leap to moral judgment weighting is indirect. Holistic cognition does not automatically entail holistic moral weighting. You are relying on an assumed link between cognitive style and moral parameterization that is not as well-established as the perceptual data. Soften this to avoid overextension.
  *   **Replication:** Be aware that several high-profile findings in the economic games literature have faced replication challenges regarding the specific magnitude of effects. Your argument relies on the *pattern* of variation, not the specific effect sizes, so frame your claims around the existence of variation rather than the specific direction (e.g., "calibration differs" rather than "market integration increases generosity").

  **5. Interest and economy.**

  The paper's primary contribution is the **weighting-fixity argument**. The taxonomy is necessary groundwork, and the counterweight test is a constructive proposal, but the fixity argument is the novel philosophical engine.

  The empirical survey (section four) is currently too detailed for the argumentative load it carries. A specialist audience does not need a summary of the fifteen-society project or the specifics of harm/purity disputes; they need to know how you interpret them. You should cut the empirical survey by roughly half. Remove the specific examples of status debt and market integration percentages. Replace them with a generalized claim: "Cross-cultural data consistently shows variation in parameter calibration rather than domain absence."

  Keep the taxonomy, but tighten the definition of annexation. Keep the fixity argument, but strengthen the premise regarding non-truth-conducive variables (as noted in heading 2). The counterweight test is interesting but risks looking like an ad hoc solution; ensure it is framed as a diagnostic tool for realism rather than a full-blown alternative moral theory. If you must cut one element, the detailed empirical examples are the most dispensable. The philosophy stands on the logical distinction between weighting and presence, not on the specific results of the ultimatum game. Condensing the empirical section will sharpen the focus on the weighting-fixity problem, which is the core innovation.
