          *   *Advice:* Distinguish between *first-order moral weightings* (harm vs. purity) and *second-order epistemic criteria* (stability under variation). The counterweight test is a criterion for *truth-tracking*, not a moral weight itself. The paper needs to explicitly categorize the counterweight test as epistemic/methodological, not moral. If it's epistemic, the genealogical objection applies only if epistemic norms are also culturally contingent (which is a deeper skepticism). Concede asymmetry: the test is proposed as a rational requirement for realism, not a moral truth.

      *   **4. Empirical accuracy.**
