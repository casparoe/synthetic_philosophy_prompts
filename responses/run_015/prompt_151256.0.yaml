      *   Separate established vs. contested? Explicitly marked in the assessment section.
      *   No consensus view presented? Maintained ambiguity/pluralism.

  *(Self-Correction Note)*: Make sure to explicitly name key players like the Environmental Defense Fund (EDF) as they were pivotal in bridging this gap, contrasting them with more purist groups. Ensure the distinction between "selling the right to pollute" and "buying the right to clean" is clear in the moral framing.

