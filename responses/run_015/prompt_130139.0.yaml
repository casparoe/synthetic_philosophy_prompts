answer: |-
  ### Quick Brainstorm: The Angle

  Look, the core intuition here is strong. Most deontological defenses get bogged down in *why* pushing the guy is worse than letting five die (rights, means/ends, etc.). You're skipping that to ask *how the math works*. That's the decision-theoretic hook. If moral reasons aren't additive weights but rather non-aggregating constraints (like vetoes), the paradox dissolves because you can't sum the five lives to outweigh the one veto.

  The best angle isn't just "deontology vs. consequentialism." It's "Aggregation vs. Non-Aggregation Structures." The fresh bit is testing this under **uncertainty**. That's where these theories usually break. If I have a veto against being killed, does that veto apply to a 1% risk of death? If yes, all action is forbidden. If no, how do we weigh the risk? If we weigh risk, aren't we back to aggregation?

  So the proposal needs to sell this as a structural repair job for deontology. We aren't arguing about rights; we're arguing about the logic of moral reasons. The workshop setting is perfect because you need people to poke holes in the formalization, specifically on the risk side.

  Here's the draft doc. I kept it loose but hit the required boxes.

  ***

  **Project Title:** Non-Aggregative Constraints: A Decision-Theoretic Approach to the Paradox of Deontology

  **Principal Investigator:** [Your Name]
  **Duration:** 4 Months
  **Request:** Workshop Grant Support

  **1. The Research Question**
  Does modeling deontological constraints as non-aggregating, disjunctive veto conditions dissolve the paradox of deontology without collapsing into consequentialism under conditions of uncertainty?

  Basically, standard debates assume moral reasons function like weights on a scale. I'm proposing they function more like veto powers held by individual agents that don't sum up. If Agent A has a veto against being used, and Agent B has a veto, you don't get "2 units of veto." You get two separate barriers. The question is whether this structure holds up when we introduce probability. Can we make sense of "risky vetoes" without secretly smuggling in expected utility calculations?

  **2. Why the Usual Debates Don't Settle This**
  The literature is stuck on the *content* of the constraint, not the *structure* of the reasoning.
  *   **Foot-style defenses** focus on the distinction between doing and allowing. But this struggles with cases where the causal structure is identical but the intuition shifts. It doesn't explain *why* we don't sum the harms.
  *   **Thomson-style rights analysis** clarifies what rights we have, but often treats rights as trumps without explaining the logic of the trumping mechanism when multiple rights clash.
  *   **Modern reply-structures (e.g., Kamm, Quinn)** get closer with principles of permissible harm, but they often rely on intuitive balancing that looks suspiciously like aggregation in disguise.

  None of these adequately address the decision-theoretic assumption that moral reasons must be commensurable to be rational. They assume a single scale is necessary for coherence. This project challenges that assumption directly. If reasons are structurally different (vetoes vs. weights), the paradox isn't a puzzle to be solved, it's a category error.

  **3. Methodology: Month-by-Month Plan**

  *   **Month 1: Formalizing the Veto Structure**
      *   Draft the logical framework for "disjunctive vetoes."
      *   Work out the difference between additive constraints (standard deontology) and non-aggregating constraints (the proposal).
      *   Goal: A clear definition that distinguishes this from simple lexical priority.

  *   **Month 2: Classic Case Stress-Test**
      *   Apply the framework to the standard battery: Trolley, Bridge, Transplant, and Loop cases.
      *   Check if the veto model yields the standard deontological intuitions without needing ad-hoc exceptions.
      *   Workshop session 1: Present initial mappings to a small group to see if the intuitions track.

  *   **Month 3: The Uncertainty Challenge (The Core Contribution)**
      *   This is the hard part. Introduce risk (e.g., probabilistic trolley cases).
      *   If a veto is absolute, does any risk of violation forbid the action?
      *   If thresholds are allowed, how are they set without aggregating probabilities across agents?
      *   Goal: Determine if the model collapses into expected utility theory when risk is introduced.

  *   **Month 4: Synthesis and Outline**
      *   Draft the conceptual paper outline based on findings.
      *   Prepare the defense of the framing for the final workshop session.
      *   Finalize the grant report.

  **4. What Success Looks Like**
  Success isn't necessarily proving the theory is true (it's four months, come on). Success is producing a robust conceptual paper outline that demonstrates:
  1.  The veto framework cleanly handles the deterministic cases (Trolley/Bridge) better than standard rights-talk.
  2.  A clear delineation of where the theory stands on risk. Even if we find a limit, defining that limit is a contribution.
  3.  A defense of the framing that shows why viewing deontology through decision-theoretic structures is a viable path forward for meta-ethics.

  Basically, if we walk away with a paper draft that says "Here's why the paradox arises from bad math, and here's the better math," that's a win.

  **5. Honest Failure Condition**
  The biggest risk is that the "disjunctive veto" turns out to be just hidden aggregation once you model risk.
  *   **Failure Scenario:** To make the veto work under uncertainty, we have to assign probabilities to veto-violations and weigh them against outcomes. If we do that, we've basically recreated expected utility theory with extra steps.
  *   **Contingency:** If this happens, the project pivots. The output becomes a proof that non-aggregative deontology is impossible under uncertainty, which is still a valuable negative result. But the goal is to avoid that collapse.

  **6. Budget Note**
  Most of the funds will go toward compensating workshop participants for their time on the uncertainty modeling (Month 3), since that requires some specialized decision-theory knowledge outside standard ethics training.

  ***

  Let me know if you want to tweak the uncertainty section, that's where the real meat is. Also I think the typo in the header is fine, keeps it human.
