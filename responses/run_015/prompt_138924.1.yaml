answer: |-
  **Public symbols retain honorific status only through ongoing democratic consent; where origins or effects are exclusionary, removal is mandated, but procedural strictness yields when the status quo itself silences the affected community.**

  I rejected "Endorsement Decay" because age doesn't neutralize harm (a 300-year-old slave trader still wounds), and "Honour vs. Incidental" because it fails when the bad view is central (the suffragist). This principle, **Democratic Functionality**, prioritizes current civic unity over historical intent.

  **Clauses and Cases:**
  1.  **Exclusionary Effect:** The Confederate statue functions as intimidation (Jim Crow origin), voiding consent. *Verdict: Remove.*
  2.  **Democratic Deficit:** Colston lacked legitimate maintenance consent; the status quo silenced opponents. *Verdict: Toppling excused.*
  3.  **Functional Necessity:** The paediatrician's name serves healing; the harm is incidental to the hospital's function. *Verdict: Keep + Plaque.*
  4.  **Educational Value:** Rhodes and Lenin statues serve as historical texts rather than pure honor. *Verdict: Contextualize/Archive.*

  **Accommodation Failure:**
  This principle struggles with your **Suffragist** verdict. If the sterilisation campaign is central to her fame, the symbol imposes dignitary harm that outweighs civic unity. My principle suggests renaming or heavy contextualization, whereas you lean toward leaving it. This reveals a tension between preserving historical continuity and preventing symbolic harm.

  **Settling the Torn Cases:**
  1.  **Segregated War Memorial:** The "opposite sides" carving indicates an exclusionary origin (Jim Crow). However, removing it erases the Black soldiers' sacrifice. Since it is the *only* memorial, its functional role (honoring dead) outweighs the structural harm, provided the segregation is explicitly contextualized. *Verdict: Keep with explanatory plaque detailing the segregation.*
  2.  **Sterilisation Hospital:** Here, the name is the *only* reason the sterilisation law is remembered. Unlike the paediatrician, the name actively perpetuates memory of the crime rather than serving incidental function. Hospitals can be renamed without losing function. *Verdict: Rename.* The mnemonic value of the crime does not justify maintaining the honorific.

  **Consensus vs. Dispute:**
  Among philosophers of memory, there is **consensus** that context matters more than iconoclasm (contextualization is generally preferred to silent erasure) and that Jim Crow monuments lack democratic legitimacy. There is **live dispute** over property rights versus corrective justice (the Colston method) and whether functional buildings (hospitals) should be held to the same symbolic standard as honorific statues. My verdict on the hospital leans toward the view that functional utility does not immunize against symbolic harm when the name itself is the vector of memory.
