      *   *Clarification on Kleiber:* In biology, larger animals use *more* total energy but *less* per gram. In human economics, richer people use *more* total and *more* per capita. I need to make sure I don't confuse the biological law with the economic analogy. The user suggests using $M^{0.75}$ as the scaling factor for the "footprint." I should interpret "Mass" here as "Consumption Mass."
