answer: |-
  This is a fascinating synthesis. You are essentially proposing a shift from a *democratic* metric of carrying capacity (one human, one vote/spot) to an *ecological* metric (one unit of impact, one spot). As a metabolic ecologist, you know that treating all organisms as identical units is biologically naive. A shrew is not an elephant. Hardin's lifeboat treats all humans as shrews, regardless of whether some are piloting elephants.

  Here is the argument for your scaled admission policy, followed by the defense against the charge that it privileges the wealthy.

  ### The Argument for Allometric Admission

  **1. The Ecological Premise: Constraints are Energetic, Not Numerical**
  Hardin's lifeboat sinks because of resource depletion, not because of geometry. It runs out of food, fresh water, and waste-assimilation capacity. In ecology, the stress a population places on an environment is a function of its total metabolic demand, not its headcount. If we accept that human "mass" in this context is actually "economic/resource mass," then Kleiber's logic applies. A high-consumption individual draws down the lifeboat's reserves at a rate disproportionate to a low-consumption individual. To count them both as "1" is to introduce a measurement error into the safety calculation.

  **2. The Metric: Metabolic Equivalent Units (MEUs)**
  Instead of counting heads, we count MEUs. If we define a baseline subsistence human as having a "resource mass" of 1, their cost to the lifeboat is $1^{0.75} = 1$. A high-consumption individual might have a "resource mass" of 100 (due to energy use, supply chain dependencies, waste). Under a raw headcount, they cost 1 spot. Under your allometric model, they cost $100^{0.75} \approx 31.6$ spots.
  This aligns the *admission ticket* with the *actual drag* on the system. It forces the ethics of the lifeboat to match the physics of the lifeboat.

  **3. The Ethical Shift: Equality of Impact vs. Equality of Status**
  Traditional human rights philosophy argues for equality of status (we are all moral equals). Hardin accepts this but worries about survival. Your proposal introduces a third category: equality of *thermodynamic burden*. It argues that while we may be morally equal, we are not ecologically interchangeable. Fairness, in a closed system, requires that those who exert more pressure on the constraints contribute more to the solution or occupy fewer "slots" relative to their burden.

  ### Defending Against the "Privilege" Objection

  The obvious pushback is: *This sounds like a justification for inequality. It allows wealthy nations to say, "We are bigger, so we deserve more room," effectively codifying their hoarding of resources.*

  Here is how you defend the allometric model against that charge.

  **1. It Exposes Hidden Subsidies, It Doesn't Validate Them**
  The current Hardin model (raw headcount) already lets wealthy nations take up more space; it just hides the cost. When a high-consumption nation restricts immigration based on raw numbers, they are effectively saying, "We can only fit 100 more people," while ignoring that their current 100 citizens consume as much as 1,000 subsistence farmers.
  Your model does not *give* the wealthy more space; it *invoices* them for the space they already occupy. It shifts the argument from "How many people can we fit?" to "How much resource load can we fit?" It forces the wealthy to acknowledge that their "1" is actually "31.6." This is not a privilege; it is an accounting correction.

  **2. It Shifts the Burden of Conservation to the Wasteful**
  In a raw headcount system, the pressure to reduce population falls equally on the poor and the rich. But since the poor have low metabolic loads, reducing their numbers yields little ecological relief compared to reducing the consumption of the rich.
  By scaling admission, you create a philosophical and economic incentive structure where the "cost" of being in the lifeboat is tied to your footprint. If a wealthy nation wants to maintain its population size, it must lower its "Mass" (consumption) to lower its "Metabolic Rate" (admission cost). It turns conservation into a prerequisite for membership, rather than an altruistic choice. It defends the lifeboat by targeting the heaviest passengers, not the most numerous ones.

  **3. It Prevents the "Shrew Blame" Narrative**
  Hardin's original ethics often devolve into blaming the poor for breeding too fast (the "shrews multiplying"). This is ecologically unsound because shrews, individually, drain the boat very slowly.
  Your allometric approach protects the poor. It acknowledges that a subsistence farmer has a negligible drag coefficient on the lifeboat. It argues that admitting ten low-consumption individuals might be ecologically cheaper than admitting one high-consumption individual. This flips the nativist script: it's not the *people* who are the problem, it's the *metabolism* of the lifestyle. This allows for a more humane immigration policy that is still ecologically rigorous.

  **4. Dynamic Mass vs. Static Privilege**
  The criticism assumes "Mass" is static (i.e., you are born rich, you stay rich). But in your model, "Mass" is a variable. If admission is priced by $M^{0.75}$, nations and individuals are incentivized to reduce $M$.
  This transforms the lifeboat from a static fortress into a dynamic system. The "wealthy country" argument fails because under your system, their wealth (high $M$) becomes a liability for admission or continued residency. It forces a philosophical reconciliation between standard of living and carrying capacity. You cannot claim a right to a spot in the boat if your metabolic rate sinks it.

  ### Summary of the Philosophical Position

  You are arguing for **Thermodynamic Justice**.

  Hardin's error was treating humans as moral atoms with identical weights. Your correction treats humans as metabolic processes with variable weights.
  *   **Against the Raw Headcount:** It is ecologically false.
  *   **Against the Wealth Objection:** It does not grant privilege; it removes the subsidy the wealthy currently enjoy by hiding their true cost. It makes high consumption a liability rather than an asset in the ethics of survival.

  This approach saves Hardin's concern for limits without accepting his dehumanizing simplification of population. It suggests that the right to exist in a constrained system is universal, but the *cost* of that existence must be scaled to the burden imposed.
