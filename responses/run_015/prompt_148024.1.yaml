      *   *Defense Strategy 2: The Efficiency Incentive.* If admission is priced by metabolic load, it creates pressure to reduce the exponent. It forces the "large" organisms to become more efficient to lower their "ticket price."
      *   *Defense Strategy 3: Fairness of Burden.* Raw headcount punishes the poor (who have high birth rates but low consumption). Weighted headcount punishes the wasteful. This is arguably more ethically aligned with the actual threat (resource depletion).

  5.  **Refining the Philosophical Logic (Connecting Ecology to Ethics):**
      *   Need to ensure the distinction between *biological mass* and *economic mass* is clear. The user knows Kleiber's Law applies to biology, but they are applying it metaphorically to resource use. I need to validate that metaphor without getting bogged down in whether urban scaling is actually 0.85 or 0.75. Stick to the *principle* of scaling.
      *   Hardin's ethics are often criticized as Malthusian. The user wants to salvage Hardin using metabolic theory.
      *   Key philosophical shift: From *Equality of Persons* (1 human = 1 vote/spot) to *Equality of Impact* (1 unit of impact = 1 spot).

  6.  **Developing the Response Structure:**
