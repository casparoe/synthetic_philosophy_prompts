  If they accept, the "Ice is not rock" rule was a pretext. If they reject, the "1950s" signal is more important than the medium, confirming the Mid-Century Preference.

  **The "Duck" and Contradiction Check**
  **Can they duck?** Yes. They can rule that **"questions of causality are outside our remit."**
  *   **Consistency:** This is fully consistent with their rejection of the ecologist petition ("not a stratigraphic argument") and the climate science vote ("doesn't bind them"). They have consistently defined their remit as *chronometry* (timing), not *etiology* (cause).
  *   **Contradiction:** It creates a **semantic contradiction**, not a procedural one. The unit is named the *Anthropo*cene (Human New). If they rule that "who caused what" is irrelevant to defining the Anthropocene, they decouple the name from the definition. However, procedurally, they can maintain that they define the *boundary* (the radionuclide spike), and the *name* is a label applied afterward by higher committees. They have already ruled that the climate science body's vote for "1950" doesn't bind them; similarly, they can rule that the *meaning* of "Anthropocene" doesn't bind their stratigraphic criteria.

  **Summary for your Newsletter:**
  Expect a rejection wrapped in the language of the 1610 ruling (diachroneity), driven by the precedent of the ecologist petition (no social pressure). They will protect their autonomy by keeping history out of the rock, even if it means the "Human" epoch is defined by a signal whose human cause they refuse to formally adjudicate.
