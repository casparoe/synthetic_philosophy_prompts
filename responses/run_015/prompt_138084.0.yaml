  **The Real Rule They Are Running**
  **"Institutional Autonomy and Stratigraphic Purism."**

  This rule explains their track record better than simple materiality or synchronicity.
  *   **Evidence:** They rejected the ecologist petition ("not a stratigraphic argument") and the climate science vote ("doesn't bind them"). They are fiercely protective of their right to define boundaries based *only* on physical markers in rock, insulated from external political or scientific pressure.
