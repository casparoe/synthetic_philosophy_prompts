  1.  **The "Ice is Not Rock" Rule:** They previously declined to put a marker in an ice core.
      *   *Why it fits:* The new submission relies on ice core confirmation.
      *   *Why it breaks:* The submission places the boundary in *corals*, using ice only for confirmation. This is technically distinct from "putting a marker in an ice core." If they reject it on this basis, they are conflating correlation with definition, which weakens their stratigraphic logic.
  2.  **The "Mid-Century Preference" Rule:** They accepted 1952 but rejected 1610 and 1700s.
      *   *Why it fits:* They seem to prefer the "Great Acceleration" era (nuclear isotopes) over the Colonial or Industrial eras.
      *   *Why it breaks:* If they reject the 1540s lead signal, they admit that the *timing* matters more than the *stratigraphic quality*. If a future submission proves the 1540s signal is just as synchronous as the 1952 signal, this rule forces them to admit they are privileging the Nuclear Age over the Colonial Age for narrative reasons.

