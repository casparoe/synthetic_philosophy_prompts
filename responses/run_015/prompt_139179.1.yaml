answer: |-
  There is no single canonical name for this configuration in the literature (e.g., no "The Voting Paradox" that refers specifically to this truth-value instability rather than the cost-benefit analysis). It is a recognized logical topology, but it is usually treated as a composite of game-theoretic equilibrium analysis and social ontology rather than a standalone named fallacy or effect.

  Here is the carving you requested.

  ### 1. Nearest Established Concepts

  There are three concepts that sit adjacent to this configuration. None capture it exactly, but together they map its boundaries.

  **A. Reflexivity (Social Science/Finance)**
  *   **Proximity:** High. Reflexivity describes a feedback loop where a belief about a system changes the fundamentals of the system (e.g., believing a bank is insolvent causes a run that makes it insolvent).
  *   **Departure:** Standard reflexivity usually concerns *value* or *status* (price, solvency, legitimacy). Your configuration concerns *causal truth-conditions*. In reflexivity, the belief makes the proposition *true* (self-fulfilling). In your configuration, the belief makes the proposition *false* (self-falsifying).
  *   **Work Done:** This concept accounts for the *mechanism* of instability (belief $\rightarrow$ action $\rightarrow$ context change).

  **B. Kantian Universalizability (Ethics)**
  *   **Proximity:** Medium. The Categorical Imperative asks: "What if everyone did that?" It tests whether a maxim can be willed as a universal law without contradiction.
  *   **Departure:** Kant is concerned with *normative* contradiction (it would be immoral or irrational to will it), not *causal* truth. Your configuration is descriptive: it is not that one *ought* not to believe the claim, but that the claim *cannot remain true* if universally believed.
  *   **Work Done:** This concept accounts for the *logical structure* of generalization (Individual $\rightarrow$ Universal).

  **C. Nash Equilibrium (Game Theory)**
  *   **Proximity:** High. In a voting game, a situation where everyone believes "my vote doesn't matter" and abstains is *not* a Nash Equilibrium. If everyone else abstains, your best response is to vote (as you become decisive).
  *   **Departure:** Game theory models the *stability of strategies*, not the *truth-value of propositions*. It explains why the behavior won't persist, but not why the *claim* flips from true to false.
  *   **Work Done:** This concept accounts for the *end-state*. It confirms that the configuration describes a disequilibrium state.

  **Verdict:** The configuration is best understood as a **Causal Reflexivity** problem with a **Universalizability** structure, resulting in a **Disequilibrium**. If one concept must do the heavy lifting, it is **Reflexivity**, specifically the subtype of **Self-Undermining Predictions**.

  ### 2. The Instability: Threshold vs. Sorites

  You ask whether the instability is essential or an artifact of "made a difference" doing threshold work.

  The instability is **essential**, but it relies on the **Threshold** nature of the outcome, not Sorites vagueness.

  *   **Sorites:** Deals with vague predicates (heap/non-heap). If "making a difference" were Sorites-like, the claim would gradually lose truth as more people abstained.
  *   **Threshold:** Voting is binary (win/lose). The "margin of victory" is a hard cliff. The instability arises because the *probability of being at the cliff* changes non-linearly with turnout.

  If the outcome were cumulative (e.g., "my vote adds to the total"), the claim "my vote adds nothing" would remain true even if everyone abstained (0 + 0 = 0). The instability exists *only* because the value of the action is contingent on the *ratio* of participants to the *decisiveness threshold*.

  Therefore, the instability is not an artifact; it is a structural feature of **threshold public goods**. The claim is unstable precisely because it ignores the *endogeneity of the margin*. The margin is not a fixed feature of the world; it is a function of participation. To claim "I am not at the margin" while acting in a way that *moves the margin toward me* is the core contradiction.

  ### 3. The Equilibrium Story

  Yes, there is an equilibrium story available, and it clarifies why the claim cannot be common knowledge.

  1.  **State A (High Turnout):** Belief "My vote doesn't matter" is true for most individuals (probability of pivot $\approx$ 0).
  2.  **Propagation:** Belief spreads. Participation drops.
  3.  **State B (Low Turnout):** The pool of voters shrinks. The probability of a tie increases drastically.
  4.  **Flip:** For the remaining potential voters, the probability of pivot rises. The claim "My vote doesn't matter" becomes false.
  5.  **Correction:** Rational actors in State B now vote. Turnout rises. Return to State A.

  **Does it matter that no single person's acceptance moves anything?**
  Yes. This is what prevents the instability from being immediate. It is a **latent** instability. A single believer does not falsify the claim; only the *distribution* of believers does. This distinguishes it from a performative contradiction (where saying "I am not speaking" falsifies it instantly). Here, the falsification requires *aggregation*. This makes the configuration a **Collective Self-Undermining Claim**.

  ### 4. Parallel Cases (Consumption and Emissions)

  Does this structure appear elsewhere? It depends on the **causal topology** of the outcome.

  *   **Boycotts (Positive Match):**
      *   *Claim:* "My not buying this product won't hurt the company."
      *   *Truth:* True individually (revenue loss is negligible).
      *   *Instability:* If everyone believes this and boycotts, revenue hits zero. At the margin near zero, one purchase *saves* the company. The claim becomes false.
      *   *Verdict:* Same configuration. Threshold-based causal efficacy.

  *   **Carbon Emissions (Negative Match):**
      *   *Claim:* "My carbon footprint doesn't cause climate damage."
      *   *Truth:* True individually (fractional contribution).
      *   *Instability:* If everyone believes this and emits freely, damage occurs. *However*, does my individual footprint become decisive? No. Climate damage is cumulative and continuous, not binary. Even in a high-emission world, my marginal ton of CO2 is still a fraction of the total. The *harm* increases, but my *causal efficacy* (my share of the harm) does not spike to "decisive."
      *   *Verdict:* Different configuration. This is a **Tragedy of the Commons** (aggregate harm), not a **Self-Undermining Irrelevance Claim** (individual decisiveness). The claim remains true even when universalized; the *consequences* just get worse.

  ### 5. Coining a Term and Defining the Boundary

  Since no established term fits tightly, I propose: **The Reflexive Irrelevance Claim**.

  **Definition:**
  A proposition $P$ asserted by an agent $a$ regarding their own causal efficacy, satisfying three conditions:
  1.  **Contextual Truth:** $P$ is true given the current behavior of the population $G$.
  2.  **Universal Falsification:** If $P$ is universally believed and acted upon by $G$, the context shifts such that $P$ becomes false for $a$.
  3.  **Threshold Dependency:** The falsification relies on the outcome being determined by a threshold or binary function, not cumulative aggregation.

  **Boundary Cases:**

  *   **Clear Positive Case (Fits the definition):**
      *   *Scenario:* A shareholder vote requiring 51% to pass a motion. Currently, 90% support.
      *   *Claim:* "My vote won't change the outcome."
      *   *Analysis:* True now. If all supporters believe this and stay home, the motion fails. If only one supporter shows up, their vote is 100% decisive. The claim undermines its own truth conditions.

  *   **Clear Negative Case (Fails the definition):**
      *   *Scenario:* Donating to a famine relief fund where money is strictly additive.
      *   *Claim:* "My $10 donation won't solve the famine."
      *   *Analysis:* True now. If everyone believes this and donates nothing, the famine continues. If everyone believes this and *donates* (assuming the claim is "my donation is too small to matter"), the famine is solved. *However*, does my $10 become decisive? No. It remains 1/N of the solution. The claim "My donation is a small fraction" remains true even if universalized. The *outcome* changes, but the *causal description of the individual act* does not flip from "inefficacious" to "decisive."

  ### Summary of the Carving

  The configuration is a **Self-Undermining Causal Claim** driven by **Reflexive Thresholds**.

  *   It differs from the **Fallacy of Composition** because the individual property is not static; it changes when generalized.
  *   It differs from a **Self-Fulfilling Prophecy** because the belief destroys the truth of the prediction rather than confirming it.
  *   It differs from **Rational Choice Voting Paradoxes** because it addresses the *truth of the efficacy claim*, not the *utility of the action*.
  *   It applies only to **Threshold/Binary Outcomes** (elections, boycotts, vetoes), not **Cumulative Outcomes** (emissions, charitable totals, noise pollution).

  The essential feature is the **endogeneity of the margin**. The claim assumes the margin is fixed; the action proves the margin is fluid. When the margin becomes fluid enough, the claim breaks.
