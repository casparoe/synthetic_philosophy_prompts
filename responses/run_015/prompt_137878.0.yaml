answer: |-
  This is a classic frustration in systems biology, and your intuition is sharp: the slogan "the whole is more than the sum of its parts" is a philosophical Rorschach test. People project whatever they want onto it. Your labmate is likely sliding between an epistemic claim (it's hard to calculate) and an ontological claim (it's fundamentally different), using the vagueness of the slogan to win the pragmatic argument (stop modeling).

  Here is a menu of precise claims hidden inside that sentence, tidied up from your list and extended with standard distinctions from philosophy of science and systems theory. I have evaluated each based on your criteria: (a) Truth status, (b) Defensibility, (c) Falsehood/Incoherence, and (d) Whether it supports the conclusion that bottom-up modeling is a "waste of money."

  ### The Menu of Claims

  #### 1. The Novelty Claim (Your "Boring" one)
  *   **Claim:** The system possesses properties that no individual component possesses in isolation (e.g., bistability, oscillation, volume).
  *   **Evaluation:**
      *   (a) **Trivially True.** This is the definition of a system.
      *   (b) **Defensible:** Yes, but uncontroversial.
      *   (c) **False:** No.
      *   (d) **Supports "Waste of Money"?** **No.** Mechanistic models are specifically designed to show *how* parts interacting generate novel properties. This claim actually motivates modeling rather than discouraging it.

  #### 2. The Computational Intractability Claim (Your "Epistemic, Weak")
  *   **Claim:** Even if we knew all the parts and laws, the computational cost to simulate the whole from the bottom up exceeds physical or financial limits (too many molecules, too much noise).
  *   **Evaluation:**
      *   (a) **Contingently True.** True for now, maybe forever for specific scales, but not a law of nature.
      *   (b) **Defensible:** Yes, practically.
      *   (c) **False:** Not in principle.
      *   (d) **Supports "Waste of Money"?** **Weakly.** It argues for *approximation* or *coarse-graining*, not for abandoning mechanism. It suggests "don't model every atom," not "don't model the mechanism."

  #### 3. The Sloppiness/Identifiability Claim (Your "Epistemic, Strong")
  *   **Claim:** The mapping from parameters to behavior is many-to-one. Vastly different combinations of molecular rates produce the same macro-behavior ("sloppy parameter spaces"). Therefore, measuring the parts precisely cannot predict the whole better than measuring the whole directly.
  *   **Evaluation:**
      *   (a) **Substantively True.** This is the core finding of the "Sloppy Models" literature (e.g., Gutenkunst et al., 2007).
      *   (b) **Defensible:** Very strong in systems biology.
      *   (c) **False:** No.
      *   (d) **Supports "Waste of Money"?** **Yes, for *prediction*.** If the goal is to predict cell fate, measuring the emergent attractor might be more robust than fitting 50 kinetic rates. However, it doesn't make mechanistic modeling a waste for *understanding intervention* (e.g., drug targets).

  #### 4. The Multiple Realizability Claim (Your "Vocabulary")
  *   **Claim:** The same macro-phenomenon (e.g., bistable switching) can be realized by different molecular networks. Therefore, the macro-description captures a generalization that the micro-description misses.
  *   **Evaluation:**
      *   (a) **True.** (e.g., genetic toggle switches vs. signaling toggle switches).
      *   (b) **Defensible:** Yes, this is the argument for "Explanatory Autonomy."
      *   (c) **False:** No.
      *   (d) **Supports "Waste of Money"?** **No.** It argues that *higher-level* models are more general, not that *lower-level* models are false or useless. You might need the lower level to know *which* realization a specific cell is using.

  #### 5. The Context-Dependence Claim (Your "Non-separability")
  *   **Claim:** The properties of the "parts" are not fixed; they are modified by the state of the "whole" (e.g., allostery, chromatin remodeling, metabolic burden). You cannot define the "sum of the parts" independently of the system state.
  *   **Evaluation:**
      *   (a) **True.** This attacks the "Sum" part of the slogan.
      *   (b) **Defensible:** This is a critique of *aggregative* reductionism (Wimsatt's "non-aggregativity").
      *   (c) **False:** No.
      *   (d) **Supports "Waste of Money"?** **Only for *simple* models.** It argues that you cannot build a model by characterizing parts in isolation and then summing them. It demands a mechanistic model that includes feedback from whole-to-part, not the abandonment of mechanism.

  #### 6. The Strong Emergence Claim (Your "Metaphysical")
  *   **Claim:** The macro-state is not fully determined by the micro-state. There are "brute" higher-level laws that constrain the lower levels (downward causation that is not mediated by micro-interactions).
  *   **Evaluation:**
      *   (a) **Orthodoxically False.** In physics and chemistry, this violates causal closure.
      *   (b) **Defensible:** Only in very specific philosophical niches (e.g., certain interpretations of consciousness or quantum biology), not standard cell bio.
      *   (c) **Incoherent:** Most scientists regard this as magic.
      *   (d) **Supports "Waste of Money"?** **Yes, absolutely.** If micro-states don't determine macro-states, mechanistic modeling is fundamentally doomed. But this claim is almost certainly false.

  #### 7. The Intervention/Control Claim (Your "Intervention")
  *   **Claim:** We can manipulate the macro-variable (e.g., temperature, osmolarity) to control the outcome without knowing the micro-variables, whereas manipulating micro-variables is too noisy or compensated for by the network.
  *   **Evaluation:**
      *   (a) **Pragmatically True.**
      *   (b) **Defensible:** Yes, this is the basis of phenotypic screening.
      *   (c) **False:** No.
      *   (d) **Supports "Waste of Money"?** **No.** It supports a division of labor. Mechanistic models are needed when macro-interventions fail or have side effects (specificity).

  ---

  ### Analysis of Your Labmate's Slogans

  You asked about the relationship between "The whole is more than the sum of its parts" and "Emergence is just a word for where the maths runs out."

  **These are contradictory claims disguised as allies.**

  1.  **"Where the maths runs out"** is **Claim #2 or #3 (Epistemic).** It says: *The mechanism is there, but we can't calculate it.*
  2.  **"More than the sum"** usually implies **Claim #6 (Metaphysical).** It says: *The mechanism is not there.*

  **The Slide:**
  Your labmate is likely sliding from **Epistemic** to **Metaphysical** to **Pragmatic**.
  *   *Step 1 (Epistemic):* "It's too hard to model all those parameters." (Plausible)
  *   *Step 2 (Slide):* "Therefore, the macro-behavior is a different kind of thing." (Illegitimate jump)
  *   *Step 3 (Pragmatic):* "Therefore, mechanistic modeling is a waste of money." (Conclusion)

  **When is the slide illegitimate?**
  The slide is illegitimate if he is committed only to **Claim #2 (Intractability)** or **Claim #3 (Sloppiness)**.
  *   If emergence is just "where the maths runs out," then better maths (or better coarse-graining techniques) solves the problem. It does not justify calling bottom-up modeling a *waste*; it justifies calling *naive* bottom-up modeling inefficient.
  *   To justify "waste of money," he needs **Claim #6 (Strong Emergence)**. He needs to believe that knowing the parts *in principle* wouldn't tell you the whole.
  *   **The Trap:** If you press him on Claim #6, he will retreat to Claim #3 ("No, I just mean it's too sloppy!"). If you press him on Claim #3, you can argue for better identifiability analysis or coarse-graining. He wants the rhetorical force of Claim #6 with the scientific safety of Claim #3.

  ### The Real Argument Worth Having

  You suspected the real question is: *"Which level gives you generalisations that travel to the next experiment?"*

  You are correct. The debate isn't about ontology (what exists); it's about **Explanatory Utility**.

  Bring this distinction to the lab:
  1.  **Mechanistic Adequacy:** Does the model capture the causal structure? (Necessary for intervention/drug design).
  2.  **Predictive Robustness:** Does the model predict outcomes in new conditions? (Necessary for engineering).

  **Your Counter-Argument:**
  "Agreed that the whole has properties the parts don't (Claim #1) and that parameter sloppiness makes fitting hard (Claim #3). But 'more than the sum' implies we can't derive the macro from the micro (Claim #6). If you only mean Claim #3, then the solution is better coarse-graining, not abandoning mechanism. If we abandon mechanism, we lose the ability to predict what happens when we perturb a specific node (Claim #7). Are you arguing that mechanistic models are *currently too hard* (which I agree with), or that they are *fundamentally incapable* of explaining cell fate (which I think is false)?"

  **Summary for your Lab Meeting:**
  *   If he means **Sloppiness (#3)**: Agree, but argue for structural identifiability analysis rather than giving up.
  *   If he means **Context-Dependence (#5)**: Agree, but argue that this requires *better* mechanistic models (including feedback), not *no* models.
  *   If he means **Strong Emergence (#6)**: Ask for a physical mechanism by which the whole constrains the parts without interacting via the parts. (He won't have one).

  The slogan is a conversation stopper. Your job is to turn it back into a conversation starter by forcing him to pick which claim he's actually making.
