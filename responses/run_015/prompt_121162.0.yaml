  1.  **Deconstruct the Prompt:**
      *   **Subject:** Peter Shaffer's *Amadeus* (play and film).
      *   **Core Problem:** Moral obligations toward the dead when dramatizing their lives.
      *   **Specific Issue:** The fabrication of Salieri's envy/poisoning and how it overwrites historical memory.
      *   **Key Question:** Is this a wrong against Mozart/Salieri (posthumous representational harm) OR is the harm indirect (audience false beliefs/erosion of history)?
      *   **Required Lens:** Combine the work's *artistic self-awareness* with the *philosophic debate* about wronging subjects who cannot suffer.
      *   **Critical Challenge:** Determine if the work dramatizes the conflict between narrative license and legacy, or merely exploits it.
      *   **Crucial Constraint:** Where must an honest critic admit that the work *resists* the ethical framework rather than illustrating it?

  2.  **Initial Brainstorming & Thematic Mapping:**
      *   *The Historical Lie:* Salieri didn't poison Mozart. They were colleagues, maybe rivals, but not enemies. Shaffer admits this in the play's preface but proceeds anyway.
      *   *The Philosophical Angle:* Can you wrong the dead? Feinberg, Pitcher, etc. If they can't experience harm, is it just about their "interests" or "legacy"? Or is it about the living audience's truth?
      *   *The Text's Self-Awareness:* Salieri is an unreliable narrator. He confesses to the "Venticelli" (the audience). He admits he is constructing a narrative. The play is framed as a confession/memory, not a documentary.
      *   *The "Harm":* Mozart is turned into a puerile genius. Salieri is turned into a murderer. The public believes this.
      *   *The Resistance:* Does *Amadeus* care about historical truth? No. It cares about *theological* or *artistic* truth. It resists the ethical framework of "do no harm to the dead" by prioritizing "do justice to the mystery of genius."

  3.  **Structuring the Argument:**
      *   **Introduction:** Set the stage. The tension between historical fact and dramatic truth. Introduce the core ethical dilemma (harming the dead). State the thesis: *Amadeus* acknowledges the ethical cost but ultimately subordinates it to a higher artistic theology, resisting the very framework of historical accountability it invites.
      *   **Section 1: The Philosophical Problem of Posthumous Harm.** Define the stakes. Can the dead be wronged? (Interest theory vs. experience requirement). Apply this to Mozart and Salieri. Mozart's reputation (the "puerile" caricature) vs. Salieri's (the "mediocrity" label).
      *   **Section 2: Shaffer's Artistic Self-Awareness.** The Preface. The framing device (Salieri confessing). The admission of fabrication. This isn't accidental; it's structural. The play *knows* it's lying.
      *   **Section 3: The Nature of the Harm.** Is it to the dead or the living? The erosion of historical understanding. But also, does it reduce the complexity of the actual men? Yes.
      *   **Section 4: Resistance vs. Exploitation.** This is the crux. Does the play *debate* this ethics, or just *use* the names? Argument: It resists the ethical framework. It posits that "God's voice" (Art) supersedes historical accuracy. Salieri's crime is not poisoning, it's *witnessing*.
      *   **Conclusion:** Summarize. The work is ethically ambiguous by design. It forces the audience to choose between fact and feeling. The "wrong" is the price of the "wonder."

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *(Self-Correction during drafting)*: I need to make sure I don't just say "it's fiction." The prompt asks about *moral obligation*. I need to engage with the idea of *representational harm*.
      *   *(Refining the Philosophical Angle)*: Use the distinction between "experiential harm" (impossible for the dead) and "narrative/legacy harm" (possible). Joel Feinberg's work on posthumous rights is useful here conceptually, even if not explicitly cited.
      *   *(Focusing on the "Resistance" requirement)*: The prompt asks where the critic must admit the work *resists* the framework. This means acknowledging that *Amadeus* refuses to apologize. It doesn't say "Sorry, Mozart." It says "Look at God." I need to highlight the ending where Salieri is absolved/celebrated as the "Patron Saint of Mediocrity." That's a rejection of historical justice.

  5.  **Developing the Core Argument (The "Resistance"):**
      *   Most bio-pics claim "based on a true story" to gain authority. *Amadeus* claims "based on fantasy" to gain theological weight.
      *   The ethical framework says: "Respect the dead's truth."
      *   *Amadeus* says: "Respect the audience's awe."
      *   Therefore, the work *resists* the ethical framework. It doesn't illustrate the conflict; it resolves it in favor of Art.
      *   *Key Insight:* Salieri isn't just a character; he is the dramatist. He is reshaping the past. Shaffer is reshaping Salieri. It's a hall of mirrors. The harm is part of the point.

  6.  **Refining the Tone:**
      *   Needs to be critical, philosophical, and nuanced. Avoid simple condemnation or praise.
      *   Use terms like "posthumous representational harm," "narrative license," "aesthetic theology."

  7.  **Final Review against Prompt:**
      *   Did I cover play and film? (Yes, treat them as a unified text with slight variations).
      *   Did I address moral obligations to the dead? (Yes, Section 1 & 4).
      *   Did I address the specific fabrications (poisoning/envy)? (Yes).
      *   Did I address artistic self-awareness? (Yes, Salieri as narrator).
      *   Did I address where it *resists* the framework? (Yes, the conclusion).

  8.  **Final Polish:** Check flow and transitions. Ensure the distinction between harm to the *subjects* vs. harm to the *audience* is clear. (The essay argues the harm to the subjects is metaphysical, while the harm to the audience is epistemological, but the play privileges the aesthetic over both).

  *(Self-Correction Note)*: Make sure to mention the Preface. Shaffer explicitly states the historical inaccuracies there. That is the key evidence of self-awareness.

  9.  **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  To engage Peter Shaffer's *Amadeus* ethically is to confront a paradox: the work is a masterpiece precisely because of the lies it tells. Both the 1979 play and the 1984 Milos Forman film rely on a central fabrication—Antonio Salieri's lethal envy and his attempted poisoning of Wolfgang Amadeus Mozart—to generate its tragic tension. Historically, Salieri and Mozart were professional rivals but not enemies; there is no evidence of murder. Yet, as the prompt suggests, these fabrications have "overwritten popular historical memory," turning Salieri into a byword for bitter mediocrity and Mozart into a caricature of infantile genius.

  This raises a profound question of bio-ethical criticism: Do we have moral obligations to the dead when we dramatize their lives? If so, does *Amadeus* violate them? To answer this, we must navigate the philosophical debate regarding posthumous harm, examine the text's own artistic self-awareness, and ultimately admit where the work refuses to be judged by ethical standards at all.

  ### The Problem of Posthumous Representational Harm

  The philosophical starting point is the "non-existence problem." If harm requires a subject to experience suffering, the dead cannot be harmed. However, contemporary ethics often adopts an "interest theory" of posthumous rights (akin to Joel Feinberg's arguments). On this view, individuals have an interest in their reputation, legacy, and the truth of their life narrative that survives death. To violate that interest is to commit a "posthumous representational harm."

  In *Amadeus*, the harm is twofold. For Mozart, the harm is reductionist. The historical Mozart was a complex man, a devoted Freemason, and a serious professional. Shaffer's Mozart is a "pig," a scatological child-man whose genius seems accidental, divorced from labor. For Salieri, the harm is condemnatory. He is transformed from a respected composer and teacher into a murderer and a man who actively thwarted genius.

  If we accept that the dead possess rights to their reputational integrity, *Amadeus* is guilty of a profound wrong. It instrumentalizes two human lives to serve a thematic end. However, if we locate the harm solely in the *living* audience's false beliefs, the ethical charge shifts. Here, the wrong is epistemological: the erosion of public historical understanding. When a cultural artifact becomes the primary source of "knowledge" about a historical figure, fiction calcifies into fact. In this sense, *Amadeus* harms the living by depriving them of the complex truth of human history, replacing it with a myth of divine punishment.

  ### Artistic Self-Awareness as Ethical Insulation

  Shaffer, however, anticipates this critique. The work is heavily armored with artistic self-awareness that attempts to inoculate it against charges of historical negligence. In the play's preface, Shaffer explicitly states: "This play is not history... It is a fantasy." The film opens with text acknowledging the historical friendship between the men. Furthermore, the narrative structure itself is a confession of unreliability.

  Salieri is not an omniscient historian; he is a dying man confessing to the "Venticelli" (the spirits of the mediocre). He admits to his own bitterness, his own possible delusions. When he claims he poisoned Mozart, we are seeing the event through the lens of a man who *wished* he had killed him, or who believes his mediocrity was a crime worthy of such a gesture. In this reading, the poisoning is not a historical claim but a psychological metaphor for the way mediocrity suffocates genius.

  This self-awareness complicates the ethical framework. If the text signals its own fictionality, does the audience bear the responsibility for the false belief? Shaffer seems to argue that the contract is clear: *I am telling you a myth; do not mistake it for a biography.* By framing the story as Salieri's memory—a notoriously unreliable medium—the work suggests that the "truth" it seeks is not factual, but theological. It is not about what happened in Vienna in 1791, but about the relationship between Man, God, and Art.

  ### Resistance vs. Exploitation

  Here we arrive at the critical crux: Does *Amadeus* dramatize the conflict between narrative license and legacy, or does it merely exploit it?

  An honest critic must admit that *Amadeus* does not truly *debate* the ethics of representing the dead; rather, it **resists** the ethical framework entirely. It does not illustrate the conflict so much as it subordinates historical ethics to aesthetic theology.

  If the play were genuinely concerned with the moral obligation to the dead, it would offer a counter-narrative or a moment of restitution where the historical truth pierces the myth. It does not. Instead, it doubles down on the fabrication because the fabrication is necessary for its spiritual argument. For Shaffer, the "real" Mozart is unknowable; the only accessible Mozart is the one filtered through the envy of a contemporary. To tell the dry historical truth (that Mozart died of illness and Salieri was innocent) would be, in Shaffer's view, a betrayal of the *emotional* truth of genius.

  The work resists the ethical framework in its conclusion. In a morally accountable drama, Salieri would be punished or corrected. Instead, he is absolved. He becomes the "Patron Saint of Mediocrity." He wins. He gets the voice, the confession, the stage. Mozart remains a corpse, a prop in Salieri's drama. The play acknowledges this power dynamic—Salieri literally buys Mozart's coffin and directs the funeral—but it treats it as a tragic inevitability rather than an ethical failure.

  This is where the "harm" transforms. It is not that Shaffer failed to protect Mozart's reputation; it is that the work argues Mozart's reputation is irrelevant compared to the music. The play posits that Art is a divine force that consumes the human vessel. Whether the vessel (Mozart) was a saint or a "pig" matters less than the voice that passed through him. By this logic, the "wrong" done to Mozart's historical character is a necessary sacrifice to reveal the mystery of his creativity. The work rejects the humanist ethic (protect the individual's legacy) for a romantic ethic (serve the sublime).

  ### The Verdict of the Critic

  So, where must the honest critic stand? We must admit that *Amadeus* is ethically transgressive by design. It utilizes the names of the dead without their consent to construct a parable that serves the living. If we hold that the dead have a right not to be turned into caricatures for entertainment, *Amadeus* is guilty.

  However, to condemn it solely on these grounds is to misunderstand its genre. It is not a docudrama; it is a morality play disguised as history. The "harm" to Salieri and Mozart is the price of admission for the audience's encounter with the sublime. The work resists the ethical framework of historical accountability because it operates within a framework of **aesthetic redemption**.

  The true ethical tension is not between Shaffer and the dead, but between the audience and the work. *Amadeus* challenges us to accept that we prefer the beautiful lie to the mundane truth. We *want* Salieri to be the murderer because it gives Mozart's death meaning; we *want* Mozart to be a child because it makes his genius seem more divine and less earned.

  Therefore, the harm resides less in the violation of the dead (who cannot suffer) and more in the seduction of the living. *Amadeus* exploits the audience's desire for myth over history. It resists the ethical obligation to truth-telling because it posits that in art, "truth" is measured by resonance, not accuracy. An honest critique must acknowledge that while the work may commit a representational wrong against the historical Salieri and Mozart, it does so to expose a deeper, more uncomfortable truth about how we consume genius: we do not care about the man; we care about the voice. And in the end, *Amadeus* ensures that while the men are distorted, the voice remains undeniably, devastatingly real.
