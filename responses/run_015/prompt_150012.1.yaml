answer: |-
  This is a sharp question. You've correctly identified the central tension in the *Bai Ma Lun* (White Horse Dialogue) without falling into the trap of treating it as mere sophistry. You also spelled Gongsun Long correctly, so no worries there.

  To get "in the weeds": The standard survey tells you Gongsun Long is a sophist playing word games. The deeper reading, which your ontology analogy hints at, is that he is probing the **mereology of names** and the **logic of reference**.

  Here is the breakdown of the conceptual issue, the validity of your database analogy, and an honest audit of where this interpretation stands on shaky ground.

  ### 1. The Core Conceptual Issue: Intension vs. Extension
  Your dichotomy—"new kind" vs. "broken predication"—is close, but I would argue Gongsun Long is doing something more specific: he is arguing for the **non-identity of compound concepts and their constituents.**

  In modern logical terms, he is distinguishing between **class membership** and **concept identity**.
  *   **Thesis:** "White horse is not horse" (*Bai ma fei ma*).
  *   **The Trap:** If we read *fei* (not) as simple class exclusion ($\forall x, Wx \rightarrow \neg Hx$), he is ontologically insane. White horses are obviously horses.
  *   **The Weeds:** Gongsun is arguing that the *name* "White Horse" (*Bai Ma*) is not identical to the *name* "Horse" (*Ma*).
      *   "Horse" names the shape/form (*xing*).
      *   "White" names the color (*se*).
      *   "White Horse" names shape + color.
      *   Therefore, the concept (Name/*Ming*) "White Horse" $\neq$ the concept "Horse".

  He is not necessarily claiming that the *object* out there isn't a horse. He is claiming that the **semantic value** of the compound term is not subsumable by the simple term in the context of *naming*.

  When the interlocutor says, "If you want a horse, a yellow horse works," Gongsun replies, "If you want a white horse, a yellow horse doesn't work." This is an argument about **extension**.
  *   Extension of "Horse" = {Black, Yellow, White, ...}
  *   Extension of "White Horse" = {White}
  *   Since {White} $\neq$ {Black, Yellow, White, ...}, the *Ming* (Name) "White Horse" is not the *Ming* "Horse".

  So, to answer your specific question: He is arguing that adding a property creates a **new semantic unit** that cannot be reduced to its parts without loss of reference. It is less that predication is "broken" and more that **predication is compositional in a way that violates naive subclass intuition.**

  ### 2. The Ontology Engineering Analogy
  Your analogy of `WhiteHorse` as a primitive class vs. `Horse` + `Attribute` is surprisingly robust, perhaps more than you expect.

  **Where it helps:**
  In Description Logic (used in OWL ontologies), you can define `WhiteHorse` as `Horse ⊓ hasColor.White`. In this system, `WhiteHorse` is a subclass of `Horse`. However, if you treat `WhiteHorse` as a **named class** in a schema, it has a distinct URI from `Horse`.
  Gongsun Long is effectively arguing that in the "database" of reality (*Shi*), the query for `WhiteHorse` returns a different result set than the query for `Horse`. If your system treats them as interchangeable, your data integrity (or in his case, political order) fails. He is insisting on **strict typing**. If a role requires a "White Horse" (a specific ritual animal, perhaps), sending a "Horse" (generic) is a type error.

  **Where it confuses:**
  The analogy fails if it implies Gongsun is interested in data structure efficiency. He is interested in **Rectification of Names** (*Zheng Ming*). For the School of Names, if the Name doesn't match the Actuality, social chaos ensues.
  *   **Modern Logic:** We accept $A \subset B$ implies $A$ is a $B$.
  *   **Gongsun:** He rejects the copula "is" in this context. He treats "is" as identity ($=$), not membership ($\in$) or subsumption ($\subset$).
  *   **The Glitch:** Your analogy assumes a system where `WhiteHorse` *can* be a subclass. Gongsun is arguing that linguistically, we treat them as disjoint categories because they function differently in discourse.

  So, the analogy holds for **schema design** (distinguishing specific types) but fails for **inheritance logic** (where specific types inherit properties of general types). Gongsun denies the inheritance of the name, even if the object inherits the properties.

  ### 3. Where My Reasoning (and the Consensus) Might Fail
  I need to be honest about the fragility of interpreting Warring States logic through analytic philosophy. Here are the specific failure points:

  **A. The Ambiguity of *Fei* (Not)**
  In Classical Chinese, *fei* is not simply logical negation ($\neg$). It can mean "is not," "differs from," "is wrong," or "violates."
  *   **Risk:** If *fei* means "differs from" ($\neq$), Gongsun is trivially right (Concept A $\neq$ Concept B). If *fei* means "is not a member of" ($\notin$), he is absurd.
  *   **Failure Point:** Most modern reconstructions (like A.C. Graham or Chad Hansen) assume *fei* functions as identity negation. If *fei* carries a normative weight ("White Horse *violates the category of* Horse"), the ontological reading collapses into a socio-linguistic one.

  **B. The Textual Corruption**
  The received text of the *Gongsun Longzi* is notoriously fragmented. It was reconstructed largely from commentaries centuries later.
  *   **Risk:** We might be reading a coherent logical argument into what was originally a series of disconnected aphorisms or dialectical fragments.
  *   **Failure Point:** If the connective particles (which establish the logical flow between "Horse names shape" and "White names color") are later interpolations, the rigorous logical structure I described above is a projection.

  **C. The Mohist Counter-Evidence**
  The *Mohist Canons* (specifically the *Lesser Mohist Canons*) explicitly critique the School of Names. They argue for a distinction between "Kind" (*Lei*) and "Particular."
  *   **Risk:** The Mohists understood Gongsun better than we do. They accuse him of confusing "Killing a thief is not killing a man" (a similar paradox). The Mohists argue that while the *act* differs, the *object* remains the same.
  *   **Failure Point:** If the Mohist critique is accurate, Gongsun isn't doing ontology; he's committing a category mistake that his contemporaries already identified and dismissed. My reading might be over-intellectualizing a known fallacy.

  ### 4. What Evidence Would Change My Verdict?
  To move from "plausible reconstruction" to "verified interpretation," I would need one of two things:

  1.  **A Textual Variant of *Fei*:** If an excavated bamboo slip (like the Guodian or Shanghai Museum slips) were found containing a version of the *Bai Ma Lun* where *fei* is glossed or replaced by a term like *yi* (different) or *bie* (separate), it would confirm the "Concept Identity" reading and kill the "Ontological Exclusion" reading.
  2.  **A Contemporary Formal Critique:** If we had a more complete text from the Mohist Canons that explicitly reconstructs Gongsun's argument in syllogistic form and identifies the specific premise they reject, we could see exactly where the logical break was perceived to be. Currently, we have the Mohist conclusions, but not their full reconstruction of Gongsun's proof.

  ### Summary Verdict
  Gongsun Long is not arguing that white horses are alien creatures. He is arguing that **compound names fix reference differently than simple names.**

  Your ontology analogy is **heuristically valid** but **historically anachronistic**. It captures the structural move (treating `WhiteHorse` as a distinct schema object rather than a filtered view of `Horse`), but it misses the stakes. For Gongsun, this isn't about database efficiency; it's about the belief that language structures reality. If you allow "White Horse" to be subsumed under "Horse" without qualification, you lose the ability to command specific actualities (*Shi*) with specific names (*Ming*).

  He is showing that our language of predication is **non-compositional** at the level of reference. You cannot derive the reference of the whole solely from the reference of the parts without acknowledging the new constraint the compound creates.

  **Honest limitation:** I am reading him through a Fregean/Russellian lens because that is the toolkit we have. It is highly probable that Gongsun's "logic" was actually a form of **rhetorical jiu-jitsu** designed to win debates at court by forcing opponents into semantic traps, rather than a sincere attempt to build a metaphysical system. The "ontology" might be a byproduct of the rhetoric, not the goal.
