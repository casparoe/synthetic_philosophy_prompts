      *   **Context:** 75-minute guest session, first-year type design studio.
      *   **Audience:** ~18 students. Skills: Can draw a passable 'a', know anatomy terms (bowl, stem, etc.). Knowledge: No philosophy.
      *   **Goal:** Bring them to feel the force of *one* question: "What makes every 'a' an 'a'?" (Ontology of the letterform, not drawing technique or aesthetic judgment).
      *   **Constraints:** Whiteboard, printed specimens, no projector.
      *   **Instructor's Concepts:** *Latitude* (disconnected shape space), *Contrast Budget* (systemic distinguishability), *The Counterfeit* (locally correct but globally wrong).
      *   **Candidate Carrying Examples:** Orphan Sort (12 glyphs, 6 faces), The Counterfeit, Disconnectedness of Latitude.
      *   **Rejected Examples (to justify):** Bodoni vs. Futura comparison, Squint/Blur test, Draw from memory.
      *   **Expected Misconceptions:** Checklist essentialism, Arbitrary convention (swap 'a' and 'o'), Platonic ideal, Pure psychology/reader recognition. (Need to order these and preempt them).
      *   **Critical Hinge:** Preventing collapse into "it's just convention" after revealing latitude's disconnectedness.
      *   **The End:** A diagnostic task to tell if the question landed vs. just learning the slogan "it's about the system."
      *   **Exclusions:** What to explicitly decline to explain (philosophy, perception, history) and how to frame that refusal.

  2.  **Determine the Carrying Example:**

      *   *Option A: Bodoni vs. Futura.* Too static. Shows variation, but doesn't force the *problem* of identity. Easy to dismiss as "style."
      *   *Option B: Squint/Blur.* Too perceptual. Leads to "legibility" rather than "identity."
      *   *Option C: Draw from memory.* Too subjective. Focuses on motor skill/memory, not ontological status.
      *   *Option D: The Counterfeit.* Good, but relies on knowing the "real" first.
      *   *Option E: The Orphan Sort.* **Winner.** It forces active engagement with *grouping* criteria without semantic labels. It naturally generates the tension between shape similarity and systemic belonging. It allows the instructor to introduce *Latitude*, *Contrast Budget*, and *The Counterfeit* organically as the students struggle to sort.
      *   *Why the Orphan Sort?* It makes the students do the philosophizing through their hands. It creates the "crisis" needed for the main question.

  3.  **Sequence the Misconceptions:**

      *   *Natural Order of Emergence:*
          1.  **Checklist Essentialism:** "It has a tail," "It has a bowl." (Arises immediately when trying to sort).
          2.  **Platonic Ideal:** "This one looks more like an 'a' than that one." (Arises when comparing disparate forms).
          3.  **Pure Psychology:** "It's just what people recognize." (Arises when the sort gets ambiguous).
          4.  **Arbitrary Convention:** "If we all agreed, 'o' could be 'a'." (Arises as the defense against the failure of essentialism).
      *   *Defusal Points:* Need to weave these into the activity flow so they are preempted.

  4.  **Drafting the Timeline (75 Minutes):**

      *   *0-10:* Setup & The Orphan Sort (Activity).
      *   *10-25:* Debrief the Sort -> Introduce *Latitude* (The Problem).
      *   *25-40:* Introduce *Contrast Budget* (The Systemic Constraint).
      *   *40-55:* Introduce *The Counterfeit* (The Limit Case).
      *   *55-65:* The Hinge (Preventing "Just Convention").
      *   *65-75:* The Diagnostic Task & Closing.

  5.  **Refining the "Hinge" (The Collapse into Convention):**

      *   If latitude is disconnected, why isn't it arbitrary?
      *   *Solution:* The *Contrast Budget* must be established *before* the full weight of Latitude's disconnectedness lands. The system provides the gravity that holds the disconnected islands together. The 'a' is an 'a' because of its *work* in the system, not just its shape.
      *   *Pre-condition:* Students must understand that a letter is a *tool for distinction* before they accept that its shape is variable.

  6.  **Refining the Diagnostic Task:**

      *   Need something that distinguishes "system slogan" from "felt understanding."
      *   *Task:* Modify a glyph to break identity without changing "features," or fix a "Counterfeit."
      *   *Better Task:* "The Borderline Case." Give them a glyph that is arguably 'a' or 'e' or 'o'. Ask them to justify its inclusion in a specific face.
      *   *Best Task:* **"The Repair."** Give them a "Counterfeit" 'a' (one that fits the checklist but fails the face). Ask them to alter *one* metric or curve to make it belong, without making it look more like a canonical 'a'.
      *   *Success:* They adjust stroke weight, contrast, or terminal angle to match neighbors (systemic fit).
      *   *Failure:* They add a tail or close the counter (feature checklist).

  7.  **Addressing the Exclusions:**

      *   Philosophy, Perception, History.
      *   *How to refuse:* Frame it as "Design Tools vs. Academic Explanations." We are builders, not historians or psychologists. We need *working definitions*, not *true definitions*.

  8.  **Developing the Content (Iterative refinement):**

      *   *Intro:* Don't lecture. Hand out the Orphan Sort immediately.
      *   *The Sort:* 12 glyphs. 6 faces (2 glyphs each). Crucially: Include 'a's that look different, and non-'a's that look like 'a's (e.g., a single-storey 'a' vs a 'u' or 'n' or 'o'). Actually, the prompt says "unlabelled glyphs cut from six typefaces — two from each." Let's assume the glyphs are mixed letters, not just 'a's. Wait, if they don't know what the glyphs say, how do they sort? By visual similarity. *Correction:* The prompt says "asked to sort them into six piles without being told what any glyph says." This implies sorting by *face identity*, not letter identity. This is crucial. It forces them to find the "DNA" of the face.
      *   *Wait, re-reading the prompt:* "orphan sort, in which each pair of students is handed twelve unlabelled glyphs cut from six typefaces — two from each — and asked to sort them into six piles without being told what any glyph says or whether any two come from the same face."
      *   *Goal of Sort:* To realize that 'a' from Face 1 belongs with 'g' from Face 1, not 'a' from Face 2. This establishes *Contrast Budget* and *System* before *Latitude*.
      *   *Revised Flow:*
          1.  Sort by Face (System).
          2.  Reveal letters. Notice 'a' varies wildly across piles (Latitude).
          3.  Introduce Counterfeit (an 'a' that fits the shape checklist but belongs to no pile).
          4.  The Question.

      *   *Misconception Ordering:*
          1.  *Checklist:* During the sort ("This has a spur, put it here"). *Preempt:* By making the sort impossible via checklists (different letters in same face).
          2.  *Platonic Ideal:* When comparing 'a's across piles. *Preempt:* By validating all piles as "correct" faces.
          3.  *Psychology:* When discussing why the Counterfeit fails. *Preempt:* By focusing on the *designer's* intent (the system), not the reader's eye.
          4.  *Arbitrary Convention:* The final boss. *Preempt:* Via the Contrast Budget (the system isn't arbitrary, it's functional).

      *   *The Hinge:* To stop the slide into "it's just convention," I need to establish that the *system* has constraints (legibility, distinction, history of use) that are not arbitrary, even if the specific shape is. The *work* the letter does is real.
      *   *The Refusal:* "We are not studying how the eye works (perception), nor where the letter came from (history), nor what 'Truth' is (philosophy). We are studying how to make marks that hold a system together."

  9.  **Structuring the Response:**

      *   Follow the prompt's specific requirements strictly.
      *   Order of pieces.
      *   Dependencies.
      *   Why the Orphan Sort carries it.
      *   Why others are rejected.
      *   Misconception timeline.
      *   The Hinge strategy.
      *   The Diagnostic Task.
      *   The Refusal.

  10. **Final Review against Constraints:**
      *   75 mins? Yes.
      *   No projector? Yes (Whiteboard + Print).
      *   18 students? (Pairs for the sort).
      *   Concepts included? (Latitude, Contrast Budget, Counterfeit).
      *   Question landed? (What makes an 'a' an 'a'?).

      *(Self-Correction during drafting)*: Make sure the Orphan Sort doesn't become a "match the style" game that ignores the letter identity. The reveal must be dramatic. The glyphs should include the 'a' from each face, plus a distractor. Wait, the prompt says "two from each." If I want to teach about 'a', I need 'a' to be present in the sort. Let's specify the sort contents carefully in the plan. Each pair gets 12 cards. 6 faces. 2 cards per face. One card is always an 'a'. The other is a neighbor (e.g., 'n', 'o', 'd'). This allows them to sort by face, then reveals the 'a' variation.
      *Actually, better:* If they don't know what the glyphs say, they sort by visual affinity (stroke, contrast, terminal). Once sorted, reveal: "Every pile has an 'a'." This proves 'a' has no fixed shape, but fits the system.
      *Wait, the Counterfeit:* I need a physical prop for this. A printed 'a' that looks perfect but clashes.
      *The Diagnostic:* Needs to be individual. 5 minutes.

      *Let's refine the Misconception Defusal:*
      1.  *Checklist:* Defused during Sort Instructions (don't look for features, look for affinity).
      2.  *Platonic Ideal:* Defused during Debrief (all piles are valid typefaces).
      3.  *Psychology:* Defused during Counterfeit discussion (it's about the face's logic, not reader guesswork).
      4.  *Convention:* Defused at the Hinge (the system constrains the convention).

      *Let's refine the Rejected Examples:*
