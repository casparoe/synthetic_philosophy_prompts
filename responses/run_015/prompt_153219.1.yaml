answer: |-
  ### The Carrying Example: The Orphan Sort

  **Why this carries the session:**
  The *Orphan Sort* is the only candidate that forces the students to generate the problem themselves. It inverts the usual hierarchy: instead of you showing them variations of 'a' (Bodoni vs. Futura), they must discover that 'a' is a variable dependent on its neighbors. It physically enacts *Contrast Budget* (sorting by system) before revealing *Latitude* (the shape variation within the category).

  **Why the others are rejected:**
  *   **Bodoni-beside-Futura:** This is a *demonstration*, not an *investigation*. It presents the conclusion (letters look different) before the premise (why they are the same letter). It invites aesthetic judgment ("which is better?") rather than ontological inquiry.
  *   **Squint-or-blur:** This reduces the question to legibility and perception. It suggests the essence of 'a' is a optical signal, which validates the misconception that letter identity is purely psychological.
  *   **Draw from memory:** This centers the student's motor habit, not the letter's status. It reinforces the "Platonic ideal" misconception (they will draw their internal average 'a') and ignores the systemic nature of type design.

  **What the Sort must have:**
  *   **12 Glyphs per pair:** 6 faces × 2 glyphs.
  *   **The Constant:** One glyph in every pair must be an 'a'.
  *   **The Variable:** The second glyph must be a structural neighbor ('n', 'o', 'd', 'u') that shares features with 'a' but is distinct within that specific face.
  *   **The Visual Range:** The six 'a's must span the full *latitude* (e.g., Bodoni double-storey, Futura single-storey, Garamond italic, a humanist sans, a blackletter 'a', and a script 'a').
  *   **The Blind:** No labels. No point sizes indicated.

  **What the Sort must lack:**
  *   **Context:** No words, no other letters. If they see 'b' or 'c', they will sort alphabetically or by linguistic habit.
  *   **Labels:** Do not tell them which glyph is which letter until the debrief.

  ---

  ### The Sequence (75 Minutes)

  #### 1. The Sort (00:00 – 00:15)
  *   **Action:** Hand out the envelopes. Instruction: "Sort these twelve marks into six pairs. You cannot use meaning. You cannot use letter names. You must match them by their logic."
  *   **Dependency:** This must happen first to establish that *systemic affinity* is perceptible before *letter identity* is named.
  *   **Misconception Pre-emption (Checklist Essentialism):** As you circulate, if you hear "This one has a spur, put it here," intervene: "Find another reason. A spur is a feature; you are looking for a voice." This pre-empts the idea that letters are defined by a tick-box of anatomy.

  #### 2. The Reveal & Latitude (00:15 – 00:30)
  *   **Action:** Ask pairs to lay out their piles. Reveal the identity of the glyphs. "In every pile, one of these is an 'a'."
  *   **Whiteboard:** Draw six circles representing the piles. Sketch the 'a' from each.
  *   **Concept Introduction (*Latitude*):** Point out the discontinuity. "There is no continuous line you can draw from the blackletter 'a' to the Futura 'a' that stays an 'a' the whole way. The map is an archipelago, not a continent."
  *   **Misconception Pre-emption (Platonic Ideal):** When a student says, "But the Garamond one looks more like a *real* 'a'," respond: "In this room, all six are equally real. None is the original; none is the copy." This kills the hierarchy of authenticity.

  #### 3. Contrast Budget (00:30 – 00:45)
  *   **Action:** Pick one pile (e.g., Bodoni). Point to the 'a' and the 'o' (or 'n'). Ask: "If I widen the aperture of this 'a', does it stop being an 'a'?" (They will say no). "If I widen it until it closes, does it become an 'o'?" (Yes).
  *   **Concept Introduction (*Contrast Budget*):** "The 'a' is not defined by its shape alone. It is defined by the space it leaves for its neighbors. It is a boundary dispute."
  *   **Dependency:** This *must* follow Latitude. If you teach System before Variation, they think the system dictates a single correct shape. If you teach Variation before System, they think anything goes. You need Variation (Latitude) to create the anxiety, then System (Contrast Budget) to resolve it.
  *   **Misconception Pre-emption (Arbitrary Convention):** This is the critical block. When they see the variation, they will think, "So it's just agreement." You must counter this *here*. Say: "The shape is variable, but the *work* is not. The 'a' must do a specific job of distinction against 'o', 'd', and 'e'. That job is not arbitrary. The *solution* to the job varies; the *problem* does not."

  #### 4. The Counterfeit (00:45 – 00:55)
  *   **Action:** Distribute a single printed card to each pair. It is an 'a' that is geometrically perfect but drawn in a vacuum (e.g., a generic sans-serif 'a' dropped into the Bodoni pile). It has the right terminals and stroke contrast, but the wrong weight distribution or axis.
  *   **Concept Introduction (*The Counterfeit*):** "This mark satisfies every checklist rule. It is clearly an 'a'. But it is a liar. It does not belong to this face."
  *   **Dependency:** This relies on *Contrast Budget*. Without understanding the system, the Counterfeit is just a "bad drawing." With the system, it is a "category error."
  *   **Misconception Pre-emption (Psychology/Recognition):** Students will say, "Readers would still know it's an 'a'." Reply: "Readers are not our concern right now. *Belonging* is. A guest who wears the wrong uniform to the ball is still a human, but they are not a guest." This frames the issue as design ontology, not cognitive science.

  #### 5. The Hinge (00:55 – 01:05)
  *   **The Risk:** At this point, the session can collapse into "So, nothing makes it an 'a' except the designer saying so." (Nihilism/Convention).
  *   **The Fix:** You must have established *Contrast Budget* firmly in Phase 3. Return to the whiteboard.
  *   **Statement:** "If it were only convention, you could swap 'a' and 'o' in a face. You cannot. The system resists you. The resistance is real. The 'a' is the shape that solves the problem of being 'a' *in this specific crowd*."
  *   **The Question:** Now write the session's core question on the board: **"What makes every 'a' an 'a'?"**
  *   **Silence:** Let it sit for 30 seconds. Do not answer it.

  #### 6. The Diagnostic Task (01:05 – 01:15)
  *   **Task:** "Take the Counterfeit card. You have five minutes. You may not add ink. You may only scrape away or mask (or, if using pens, redraw one stroke). Make it belong to the Bodoni pile *without* making it look more like a canonical 'a'."
  *   **Success (Question Landed):** They adjust the stroke contrast, the axis, or the terminal weight to match the *neighbors* in the pile. They treat the 'a' as a systemic component. They might even make it *less* readable as an 'a' in isolation to make it fit the face.
  *   **Failure (Fluent but Empty):** They add a spur, sharpen the terminal, or exaggerate the 'a'-ness. They treat the 'a' as an icon to be improved.
  *   **Collection:** Collect the cards. Do not grade them. Tell them: "I will look at these to see if you heard the question. I will not tell you the answer."

  ---

  ### The Misconceptions: Order and Defusal

  1.  **Checklist Essentialism** ("It has a bowl and a tail.")
      *   *Arises:* Immediately during the Sort (00:00).
      *   *Defusal:* **Pre-empt.** In the instructions, explicitly forbid feature-matching. "Do not match spurs to spurs. Match tension to tension."
  2.  **Platonic Ideal** ("The Garamond one is the truest 'a'.")
      *   *Arises:* During the Reveal (00:20).
      *   *Defusal:* **Pre-empt.** Validate all six piles as professional typefaces before asking them to compare. "These are all shipping fonts. None is a sketch."
  3.  **Pure Psychology** ("It's an 'a' because readers recognize it.")
      *   *Arises:* During the Counterfeit discussion (00:50).
      *   *Defusal:* **Correct.** Acknowledge it, then bracket it. "That is a matter for psychology. We are designers. We build the system the reader enters. A key is not a key because the lock *might* open; it is a key because it is cut to the lock's code."
  4.  **Arbitrary Convention** ("We could just call 'o' 'a'.")
      *   *Arises:* At the Hinge (01:00), as a defense against the confusion of Latitude.
      *   *Defusal:* **Correct.** Use the *Contrast Budget*. "You could rename them, but you could not swap their shapes without breaking the text. The shape is constrained by the work it must do."

  ---

  ### The Refusal: What Not to Explain

  You must explicitly decline three fields to keep the session within the studio's scope. Do not apologize; frame this as professional discipline.

  **When:** At the very beginning (00:05), after handing out the Sort.
  **How:** "You may be waiting for me to tell you the history of the 'a', or explain how the eye processes curves, or give you a philosophical definition of identity. I will not do that."
  **The Framing:**
  1.  **History:** "History tells you how we got here. It does not tell you how to draw the next one."
  2.  **Perception:** "Psychology tells you what happens after the mark is made. We are responsible for the mark itself."
  3.  **Philosophy:** "Philosophy seeks the Truth. Design seeks the *Working Solution*."
  **Why:** This marks the refusal as a **decision** (focusing on the *making*) rather than an **omission** (ignoring the *theory*). It authorizes you to use philosophical concepts (*ontology, category*) as tools without becoming a philosopher.

  ### Summary of Dependencies

  1.  **Sort** must precede **Latitude** (Experience before Theory).
  2.  **Contrast Budget** must precede **The Counterfeit** (System before Exception).
  3.  **Contrast Budget** must precede **The Hinge** (Function prevents Nihilism).
  4.  **The Refusal** must precede **The Sort** (Sets the rules of engagement).
  5.  **The Diagnostic** must follow **The Question** (Tests the question, not the answer).

  This structure ensures that by minute 75, they are not holding a definition of 'a'. They are holding a tension. That tension is the only place where type design actually happens.
