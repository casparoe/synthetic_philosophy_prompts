answer: |-
  This is a remarkably precise dissection of the IIT deadlock. Given your background in NMR, you recognize the scent of a problem where the signal-to-noise ratio is too low for the instrument's resolution, but the theorists are arguing about the Hamiltonian.

  Here is the diagnosis you asked for, followed by an assessment of your "continuity requirement" and the prospects for resolution.

  ### 1. The Diagnosis: A Category Mismatch, Not a Data Dispute

  Your hunch that this is "two different questions sharing one name" is correct, but it runs deeper than Criterion vs. Mechanism. The stalemate is structural. It is a clash between a **deductive identity theory** and an **inductive causal theory**, operating with incompatible definitions of "explanation."

  **The IIT Project (Deductive Identity):**
  IIT does not claim to explain *how* the brain produces consciousness in a causal sense. It claims to identify *what* consciousness is.
  *   **Method:** It starts with "Axioms" (self-evident truths of experience, e.g., "experience is structured," "experience is specific") and derives "Postulates" (physical properties required to satisfy axioms).
  *   **Goal:** To find the physical substrate that *is* the experience.
  *   **Defense:** When critics say "you can't compute $\Phi$," IIT proponents reply that computability is a pragmatic limitation, not a theoretical flaw. The claim is ontological: if the structure exists, the experience exists, regardless of whether we can calculate the number. They view the "proxy" measures (like PCI) as necessary approximations of the true quantity, not as the theory itself.

  **The Critic's Project (Inductive Causal):**
  The critics (mostly neuroscientists, computationalists, and philosophers of science) are looking for a theory that fits the standard scientific model of inter-theoretic reduction.
  *   **Method:** Observe correlations (report vs. brain state), propose a mechanism (e.g., Global Neuronal Workspace, Predictive Processing), and test predictions.
  *   **Goal:** To explain how functional organization gives rise to reports of experience.
  *   **Objection:** They argue that a quantity that cannot be calculated for the system in question is not a scientific variable. If $\Phi$ is defined on the joint probability distribution of all system states, and that distribution is inaccessible for a brain, then $\Phi$ is metaphysical, not physical. They view the "proxies" not as approximations, but as evidence that IIT has been quietly replaced by a different, testable theory (causal density) while keeping the IIT branding.

  **The Stalemate:**
  The adversarial collaborations fail to break the deadlock because they test *correlates*, not the *identity*.
  *   If IIT predicts high $\Phi$ in the posterior cortex and critics predict high activity there, and the data confirms it, IIT says "See? Identity confirmed." Critics say "See? Correlation confirmed, but you haven't proven identity, and you still can't calculate the actual $\Phi$."
  *   If the data contradicts the prediction, IIT can adjust the model (IIT 2.0, 3.0, 4.0) because the axioms are flexible enough to accommodate structural tweaks. Critics say this makes it unfalsifiable.

  You are correct that in your old field, when two camps can read the same data as compatible with their opposing views, the error is usually "below the data." Here, the error is in the **operationalization of the variable**. One side treats consciousness as a fundamental property revealed by introspection (axioms); the other treats it as an emergent phenomenon inferred from behavior (reports).

  ### 2. The Continuity Requirement: Prejudice or Insight?

  Your "continuity requirement"—that a finite physical change should yield a bounded change in predicted experience—is not merely a physicist's prejudice. It is a substantive objection that targets a specific vulnerability in IIT known as the **Boundary Problem** (or the Exclusion Problem).

  **Why it is valid:**
  1.  **Phenomenological Adequacy:** Introspective reports (the very "axioms" IIT claims to honor) suggest continuity. Anesthesia induction, waking from sleep, or the fading of a visual afterimage appear as smooth gradients of clarity and content. They do not typically present as abrupt ontological switches where "I" cease to exist and a "new I" pops into existence nearby.
  2.  **The Exclusion Principle:** IIT asserts that only the *maximum* $\Phi$ complex exists consciously. Sub-complexes are "excluded." This creates a potential discontinuity. If you have a system where subset $A$ has $\Phi = 10$ and subset $B$ has $\Phi = 9.9$, $A$ is conscious. If you tweak a connection such that $A$ drops to $9.8$ and $B$ rises to $9.9$, the *locus* of consciousness instantaneously jumps from $A$ to $B$.
  3.  **Physical Supervenience:** If consciousness supervenes on the physical, and the physical dynamics are continuous (or at least locally bounded), a theory that predicts discontinuous jumps in the *existence* or *magnitude* of experience requires a justification akin to a phase transition. IIT offers none. It treats the "maximum" selection as a hard cut-off.

  **Is it question-begging?**
  IIT defenders would argue that reality *is* discontinuous at certain levels (quantum jumps, digital logic). They might claim your requirement smuggles in a classical continuous-field intuition into a discrete information geometry.
  *However*, this defense is weak for two reasons:
  1.  **Scale:** The discontinuities in IIT can happen at the macro-scale of neural populations, not the micro-scale of ions. A smooth change in synaptic weight shouldn't trigger an ontological jump in the *subject* of experience without a phenomenological counterpart.
  2.  **The "Fading" Argument:** If IIT predicts a jump, but the subject reports a fade, IIT must claim the subject is wrong about their own experience. This violates IIT's own starting point: that the phenomenology is the bedrock data.

  **Verdict:** Your continuity requirement is a strong, under-utilized wedge. It forces IIT to choose between its mathematical formalism (the exclusion principle) and its phenomenological axioms (the nature of experience). It is not just physicist prejudice; it is a demand for **phenomenological consistency**.

  ### 3. Can This End?

  Honest answer: **No, not within the current framework.**

  Here is why it will grind on indefinitely, and what would actually be required to stop it.

  **Why it won't end:**
  1.  **The Incomputability Barrier:** Unless there is a breakthrough in computational complexity that allows exact $\Phi$ calculation for systems with $>10^4$ elements, IIT remains empirically hollow for whole brains. It will always rely on proxies. As long as it relies on proxies, critics can argue the theory being tested isn't IIT.
  2.  **The Axiomatic Shield:** Because IIT derives physics from phenomenology, it is immune to standard falsification. If the brain data doesn't fit, IIT proponents can argue our understanding of the brain's connectivity is wrong, or that the "true" complex is somewhere we haven't looked. They can always retreat to the axioms.
  3.  **The Hard Problem Remains:** IIT claims to solve the Hard Problem by asserting identity. Critics reject this as magic. No amount of data will convince a critic that structure *is* experience, and no amount of logic will convince an IIT proponent that structure *causing* experience is sufficient.

  **What could end it (The "Off-Ramps"):**
  1.  **The Continuity Test (Your Idea):** If you could design a thought experiment or a simplified physical system where IIT *necessarily* predicts a discontinuous jump in $\Phi$ (and thus experience) while the physical parameters change smoothly, and then map that to a phenomenological report (perhaps in a simplified neural net or a split-brain scenario), you create a direct conflict between IIT's math and IIT's axioms. This forces an internal contradiction rather than an external critique.
  2.  **Abandoning the Monolith:** The field might move toward **pluralism**. Accepting that "consciousness" is not a single natural kind. There might be "access consciousness" (reportable, functional) and "phenomenal consciousness" (what it's like), and they might have different physical correlates. IIT tries to unify them into one number ($\Phi$). If the field accepts they come apart, IIT loses its claim to be the *theory* of consciousness and becomes a theory of *integration*.
  3.  **Computational Collapse:** If it is proven that calculating $\Phi$ is not just hard but fundamentally requires knowledge of the system's state space that is physically inaccessible (e.g., requiring measurements that disturb the system), IIT becomes formally unverifiable. This would shift it from science to metaphysics.

  ### Summary

  You are not importing a prejudice; you are applying a **stability criterion** that is standard in physical modeling but often ignored in consciousness studies. The IIT stalemate persists because one side is building a taxonomy of experience (IIT) and the other is building a causal model of behavior (Critics), and they are both calling it "Consciousness."

  Your continuity objection is the most promising angle because it attacks IIT internally: it suggests the theory violates its own commitment to respecting the "plain facts of experience."

  **Expectation:** Do not expect a verdict. Expect the field to fragment. The "Consciousness" label will likely splinter into "Integration," "Reportability," and "Subjectivity," and IIT will settle into a niche as a theory of information integration, stripped of its claim to be the sole arbiter of experience. The fight will end not with a winner, but with the dissolution of the question.

  For your reading group: Push the continuity argument. Ask them specifically: *"If I tune a synaptic weight continuously, at what exact point does the 'self' jump from region A to region B, and why does my report not reflect that jump?"* If they say "your report is wrong," they have abandoned the axioms. If they say "the jump is too small to notice," they have abandoned the exclusion principle. That is the checkmate.
