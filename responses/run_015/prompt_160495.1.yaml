      *(Self-Correction during drafting)*: I should mention the Sagawa-Ueda relation explicitly as it formalizes the friend's intuition. It connects mutual information to thermodynamic gain/cost.

      *(Refining the "Buying Hard Drives" point)*: If you never erase, you just fill up. To compute *repeatedly*, you must reuse memory. Reusing = Erasing. So the strategy fails for a cyclic engine.

      *(Refining the "Epistemic" point)*: If entropy is ignorance, then "erasing" is resetting your ignorance. But the heat dump is real. So the *consequence* is ontic, even if the *quantity* is epistemic. This is a key distinction.

