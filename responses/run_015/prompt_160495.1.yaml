answer: |-
  This is an exceptionally sharp set of questions. You have correctly identified that the "standard story" told in introductory contexts often papers over deep tensions that are still active research topics in statistical mechanics, information theory, and the philosophy of physics. Your friend's intuition about correlations is not a muddle; it is actually pointing toward the modern, generalized formulation of the Second Law (often associated with the Sagawa-Ueda relation).

  Here is a breakdown of what is going on, separating the engineering realities from the physical principles, and then tackling the philosophical core of what "information" means in this context.

  ### 1. The Measurement vs. Erasure Distinction
  You asked: *Does locating the cost in writing-and-erasing rather than in seeing-and-knowing only make sense if information is a physical quantity?*

  The standard resolution (due largely to Charles Bennett in the 1980s) relies on distinguishing **logical** operations from **thermodynamic** operations.

  *   **Measurement (Copying):** In principle, you can measure a system by coupling it to a memory register without dissipating heat. Think of it as a CNOT gate: if the particle is Fast, flip the memory bit to 1; if Slow, leave it at 0. This operation is logically reversible (you can run it backward to uncouple them). Because it is reversible, it does not *require* entropy increase.
  *   **Erasure (Resetting):** To make the demon a cyclic engine (so it can sort forever), it must return its memory to a standard "blank" state (all 0s) to be ready for the next particle. This maps two physical states (0 and 1) onto one (0). This is logically *irreversible*. You have compressed the phase space of the memory. By Liouville's theorem, if you compress the phase space of the memory, you must expand the phase space of the environment (heat bath). Hence, $k_B T \ln 2$ of heat per bit.

  **The Philosophical Commitment:** This accounting works even if information is purely epistemic (about knowledge), *provided* that the physical substrate holding that knowledge obeys statistical mechanics. The "cost" is not paid for the *meaning* of the bit, but for the **physical compression of the state space** required to standardize the memory.

  ### 2. The Engineering Reality (Why your laptop is hot)
  You asked: *Is nobody building reversible computers evidence that engineers don't really believe the story?*

  No. It is evidence of noise and speed.
  *   **The Gap:** The Landauer limit at room temperature is $\approx 3 \times 10^{-21}$ Joules. A modern CMOS transistor switches at $\approx 10^{-15}$ to $10^{-14}$ Joules. We are operating a million to a billion times above the floor.
  *   **The Bottleneck:** To compute reversibly (adiabatically), you must switch states infinitely slowly to avoid resistive losses and radiation. If you want your phone to refresh at 60Hz, you cannot wait for adiabatic switching.
  *   **The Belief:** Engineers accept Landauer's principle as a fundamental bound (like the speed of light), but currently, it is irrelevant to design constraints. It's like designing a car engine and worrying about the Carnot efficiency limit when your actual engine is losing 90% of its energy to friction. You fix the friction first.

  So, attitude (b) and (c) are consistent: We don't hit the limit now, but the limit dictates the *ultimate* future of computing if Moore's Law is to continue without melting the chip.

  ### 3. Your Friend's Claim: Correlations and Mutual Information
  You asked: *If my friend's correlation view were the right one, what would change?*

  Your friend is essentially describing **Mutual Information**. In modern stochastic thermodynamics, the Second Law is generalized to include information terms. The inequality looks roughly like this:

  $$ \Delta S_{total} \ge -\Delta I $$

  Where $\Delta I$ is the change in mutual information between the demon's memory and the system.

  *   **Standard Landauer:** Assumes the bit to be erased is random (maximally uncertain) and uncorrelated with anything else. Cost = $k_B T \ln 2$.
  *   **Friend's View:** If the bit in the memory is correlated with a backup copy (or the gas itself), the entropy of that bit *from the perspective of the eraser* is lower.
      *   If I hold a bit that I *know* is "1" (because I have a backup record telling me so), resetting it to "0" is not erasing uncertainty; it is just moving a known state. The thermodynamic cost can be lower.
      *   Conversely, if the memory is correlated with the gas, the demon can use that correlation to **extract work** rather than pay heat. This is the "Information Engine" (Szilard Engine) scenario.

  **Is she right?** Yes. The thermodynamic cost of erasure depends on the probability distribution of the state being erased. If the state is known (probability 1), the cost is zero. If it is unknown (probability 0.5), the cost is maximal. Correlations reduce uncertainty, thus reducing the erasure cost.

  ### 4. Epistemic vs. Ontic Entropy
  You asked: *What does this whole package actually presuppose about what information is?*

  This is the deepest layer. There are two main camps, but they converge on the math:

  1.  **Ontic (Objective):** Information is a physical property of the microstate. The demon's memory *is* a set of spins. Erasure physically compresses those spins. The heat is real regardless of who is looking.
  2.  **Epistemic (Subjective/Jaynesian):** Entropy is a measure of an observer's ignorance. The "cost" arises because the demon must discard its knowledge to close the cycle.

  **The Synthesis:** The "heat dissipated" is ontic (you can measure it with a thermometer). The *amount* of heat required depends on the epistemic state (what is known/correlated).
  If the demon has a backup, the "information" isn't destroyed when it resets the primary memory; it persists in the backup. Therefore, the global entropy of the *universe* (Demon + Backup + Bath) doesn't rise as much as if the information were truly lost.

  So, the practice is committed to this: **Thermodynamic cost is tied to the loss of *predictive power* about the microstate.** Whether you call that "predictive power" physical or mental doesn't change the Joules, provided the physical substrate obeys the laws of stat mech.

  ### 5. Concrete Implications (Answering your specific scenarios)

  **Q: Would two demons with identical physical memories but different back-ups owe different amounts of heat?**
  **A:** Yes, *if* you define the "system" to include the correlation.
  *   **Demon A (No backup):** Resets a random bit. Cost: $k_B T \ln 2$.
  *   **Demon B (Has backup):** Knows the state of the bit via the backup. It can reset the bit using a reversible protocol conditioned on that knowledge. Cost: $\approx 0$ (ignoring the cost of maintaining the backup).
  *   *Caveat:* If you eventually erase the backup too, you pay the bill then. You can't hide the debt forever, only defer it.

  **Q: Would "never erase anything, just keep buying hard drives" become a legitimate efficiency strategy?**
  **A:** No, for two reasons:
  1.  **Finite Matter:** You eventually run out of atoms to store bits. To compute cyclically, you must reuse memory. Reuse = Erasure.
  2.  **Maintenance Cost:** Storing information physically requires stability. To keep a bit from flipping due to thermal noise, you must maintain an energy barrier. While static storage costs little *dynamic* power, the *creation* of that stable state initially had a cost, and the eventual disposal of the drive involves entropy increase. You cannot infinite-stack memory to avoid the Second Law; you just push the erasure cost to the end of the drive's life.

  **Q: What would you print on the spec sheet instead of joules-per-bit-erased?**
  **A:** If the correlation view became engineering standard, specs would look like communication channel specs. You would see:
  *   *"Energy per operation conditioned on input entropy."*
  *   *"Thermodynamic efficiency gain per nat of mutual information."*
  *   Essentially, computers would be rated on how well they exploit correlations in the data to save energy. (This is actually a real area of research in "approximate computing" and machine learning accelerators).

  ### Summary for your Reading Group

  1.  **The Tension is Real:** The disconnect between "measurement is free" and "gates are irreversible" is a gap between *fundamental limits* and *engineering implementation*. We build irreversible gates because they are fast and robust, not because reversible ones are impossible.
  2.  **Your Friend is Right (mostly):** The cost of erasure is proportional to the **Shannon entropy of the bit being erased**. If correlations (mutual information) reduce that entropy, they reduce the cost. This is formalized in the **Sagawa-Ueda relation**.
  3.  **Information's Nature:** The physics doesn't care if information is "in the head" or "in the world," as long as the physical degrees of freedom tracking that information are accounted for. The "cost" is the heat required to decouple the memory from the system and reset it to a standard state.
  4.  **The "Philosophy" Bit:** The Second Law is preserved not by magic, but by accounting. If you treat the Demon + Memory + Gas + Bath as one closed system, entropy always increases. The "paradox" only arises if you treat the Demon's memory as outside the thermodynamic system. Once you include the memory's entropy, the ledger balances.

  **Recommendation:** Tell your philosophy friend to look up **E.T. Jaynes' "Information Theory and Statistical Mechanics"** (for the epistemic view) and your physics friends to look up **"Sagawa-Ueda Generalized Second Law"** (for the correlation math). You are standing right on the frontier where these two meet.
