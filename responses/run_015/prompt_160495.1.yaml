          *   *Resolution:* In modern stat mech (Jaynes), they converge. Entropy is about what degrees of freedom are tracked. If you ignore correlations, entropy increases. If you track them, it doesn't. The "cost" is physical heat dumped into the bath, but the *amount* depends on the information available.
