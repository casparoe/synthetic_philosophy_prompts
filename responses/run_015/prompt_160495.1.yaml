      *   *Part 2: The Engineering Gap:* Why isn't my laptop reversible? Speed and noise. Landauer is a *limit*, not the current operating point. Analogy: Carnot efficiency vs. real engines.
      *   *Part 3: The Friend's Point (Correlations):* This is crucial. She is essentially describing *Mutual Information*. If the demon knows the state (correlated), erasure cost changes. Actually, if the demon is correlated with the system, it can *extract* work. The cost is $k_B T \ln 2 - I(X:Y)$. This validates her intuition.
      *   *Part 4: Epistemic vs. Ontic:* This is the philosophy bit.
          *   *Ontic:* Information is a physical state (spin up/down).
