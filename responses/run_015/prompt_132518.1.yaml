answer: |-
  You have identified a genuine gap in the vocabulary of critical theory. While there are adjacent concepts that touch on parts of what you're describing, there is no single, established term that captures this specific cognitive error: **treating leisure as an individual attribute rather than a relational outcome dependent on invisible labor.**

  You are correct that "privilege blindness" is too broad (it speaks to access, not ontology) and "false consciousness" is too focused on the worker's relationship to their own exploitation, rather than the beneficiary's relationship to someone else's labor.

  Here is the breakdown of the existing theoretical landscape, followed by a proposed coinage that fits the specific edges you described.

  ### 1. The Existing Theoretical Neighbors
  Before coining a term, it is important to anchor your observation in the frameworks that already support it. You are essentially synthesizing three distinct lines of thought:

  *   **Social Reproduction Theory (Feminist Marxism):** This is the heavy lifter here. It argues that capitalist production depends on "reproductive labor" (cooking, cleaning, caring, resting) which is often unpaid, feminized, or outsourced. Your observation is essentially applying Social Reproduction Theory specifically to the *concept of leisure*.
  *   **Reification (Marx/Lukács):** This is the process of treating a social relationship as a "thing." When people treat leisure as a "possession" they own (like a car) rather than a social relation (like a marriage), they are reifying leisure.
  *   **Temporal Sovereignty:** This is the political science term for the power to control one's own time. Your examples show people claiming sovereignty without acknowledging the cost.

  However, none of these names capture the *blind spot* itself. They describe the system, not the specific error in thinking you've identified.

  ### 2. The Coinage: "Leisure Solipsism"
  I propose naming this specific blind spot **Leisure Solipsism**.

  **Definition:** *Leisure Solipsism is the cognitive and rhetorical error of treating leisure as an autonomous, individual state of being, while systematically erasing the externalized labor required to sustain that state.*

  It is "solipsism" because it assumes the self is the only relevant actor in the equation of rest. It posits that "my time off" is generated by "my hard work" or "my rights," ignoring that "my time off" is often purchased with "someone else's time on."

  ### 3. Defining the Edges
  You asked specifically about the boundaries of this concept, particularly regarding ignorance versus active ignoring. **Leisure Solipsism** applies to both, but operates differently in each.

  **A. The Epistemic Edge (Genuine Ignorance)**
  *   **Condition:** The subject literally cannot see the dependency because the labor is structurally invisible.
  *   **Example:** The French politician defending the 35-hour week.
  *   **Mechanism:** The supply chains and care workers are geographically or socially distant. The leisure appears "magic" or "legislated" rather than "produced."
  *   **Verdict:** This *is* Leisure Solipsism. The error is in the ontology (understanding of reality), not just the morality.

  **B. The Ideological Edge (Active Denial)**
  *   **Condition:** The subject suspects the dependency but frames leisure as a moral reward to justify the hierarchy.
  *   **Example:** The Protestant Work Ethic argument or the Startup Founder.
  *   **Mechanism:** Leisure is framed as "deserved" to imply that those without it are "undeserving." Acknowledging the dependency would undermine the moral claim to superiority.
  *   **Verdict:** This *is* Leisure Solipsism. Here, it functions as a defense mechanism for inequality.

  **C. What It Is Not (The Boundaries)**
  *   **Not Privilege:** Privilege explains why you *have* the leisure. Leisure Solipsism explains how you *conceptualize* the leisure. You can be privileged and still acknowledge the dependency (e.g., "I know I have weekends because my assistant handles my life"). That is privilege *without* Leisure Solipsism.
  *   **Not Burnout:** Burnout is the physiological result of too much work. Leisure Solipsism is the sociological misunderstanding of rest.
  *   **Not Laziness:** This concept does not judge the amount of leisure, but the *accounting* of it.

  ### 4. Applying "Leisure Solipsism" to Your Examples
  Here is how the term clarifies the four scenarios you provided:

  1.  **The French 35-Hour Week:**
      *   *Diagnosis:* **Structural Leisure Solipsism.**
      *   *Analysis:* The state legislates leisure for the citizen by displacing the labor of social reproduction onto immigrants or former colonies. The leisure is treated as a right of citizenship, detached from the labor cost.

  2.  **The Japanese *Karoshi* Victim:**
      *   *Diagnosis:* **Moralized Leisure Solipsism.**
      *   *Analysis:* By blaming the worker for not "setting boundaries," the observer treats leisure as an individual skill (something you grab) rather than a structural allowance (something the system grants). It assumes the worker exists in a vacuum where willpower alone creates time.

  3.  **The Protestant Work Ethic:**
      *   *Diagnosis:* **Theological Leisure Solipsism.**
      *   *Analysis:* Leisure is only permissible if it is "productive" (self-improvement). This denies the validity of rest as a biological necessity sustained by the earth/others, and frames it instead as a transaction between the individual and God/Capital.

  4.  **The Startup Founder / Innovation Argument:**
      *   **Diagnosis:** **Extractive Leisure Solipsism.**
      *   *Analysis:* The founder claims they "don't need weekends" because they "love coding." This erases the fact that their capacity to work 80 hours is likely sustained by a partner handling domestic life, or by a future burnout cost that will be socialized. They treat their stamina as an internal trait, not an externally subsidized resource.

  ### 5. Why This Distinction Matters
  Naming this **Leisure Solipsism** is useful because it shifts the debate from *distribution* (who gets time off?) to *production* (how is time off made possible?).

  *   **Without the term:** The debate is "You work too much" vs. "I work because I love it."
  *   **With the term:** The debate becomes "Whose labor is subsidizing your ability to love your work?" or "Whose labor is being displaced to create your legal right to rest?"

  It exposes that **leisure is not a void where work isn't happening; it is a space where someone else is working to sustain you.** When that relation is ignored, you have Leisure Solipsism.
