prompt: |-
  I sit on the taxonomic review panel that maintains our natural-history museum's species checklist, and we've been asked to adjudicate a proposal to split one catalogued songbird into two species. Here are the facts as I understand them. The bird occupies a continuous range across a broad, unbroken ecoregion — there is no mountain range, river, or other barrier separating the populations. In the middle of the range there is a narrow hybrid zone where two distinct forms meet and interbreed at low frequency. The two forms differ in plumage coloration (a conspicuous difference that appears to be under directional selection) and at a small number of genetic loci that are fixed for different alleles between the forms. Hybrid offspring are viable and fertile, so the two forms are not reproductively isolated; there is gene flow across the zone, though it is reduced. A recent phylogenomic analysis recovers the two forms as sister clades, but the internal branch is short and the statistical support for their monophyly is shallow, so the phylogenetic signal is weak. The proposing taxonomist wants the split, arguing that the two forms are each diagnosable and each corresponds to a monophyletic clade. Our long-time curator objects, arguing that because the populations interbreed and form a single continuous gene pool they are one species, and that splitting on the basis of a plumage difference and a handful of fixed loci is the kind of "splitomania" that will fragment our checklist into an unmanageable proliferation of names.

  I need you to draft the panel's written decision memo: recognize the split, reject it, or recognize it with conditions (for example, provisional recognition pending further phylogenomic sampling). Whatever you recommend, give reasons the losing side could actually respond to, and weigh the strongest consideration on that side honestly rather than dismissing it. I'd also like the memo to take seriously the asymmetry in the costs of error — what we lose if we split a single real species versus what we lose if we lump two real species into one — because I suspect that cost structure matters as much as the taxonomy itself, and I want it treated as a first-class input to the decision rather than a footnote.

  The reason I'm asking for more than a plumage-and-loci summary is that I've been reading the philosophy-of-biology literature on the species problem, and I keep coming back to the thought that most of this disagreement is really about what a "species" is — whether it is best understood as a kind, as a clade, as an individual (a concrete particular with a career), or as a node in a phylogeny — and that whichever of those you pick seems to do most of the work in the decision. I'd like the memo to make that connection explicit: which concept of species is doing the work in the recommendation, why that concept is the right one to apply to a museum checklist in particular, and where the other concepts would have led to a different answer.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a taxonomic review panel for a natural-history museum.
      *   **Task:** Draft a written decision memo regarding a proposal to split a songbird species into two.
      *   **Facts of the Case:**
          *   Continuous range, no geographic barriers.
          *   Narrow hybrid zone in the middle (low frequency interbreeding).
          *   Distinct plumage (directional selection) + few fixed genetic loci.
          *   Hybrids viable/fertile (gene flow exists, though reduced).
          *   Phylogenomics: Sister clades, short internal branch, shallow support.
          *   Proponent: Argues diagnosability + monophyly (split).
          *   Curator: Argues continuous gene pool + risk of "splitomania" (lump).
      *   **Requirements:**
          *   Make a clear recommendation (Split, Lump, or Conditional).
          *   Address the losing side's strongest arguments respectfully.
          *   Explicitly weigh the *asymmetry in the costs of error* (Type I vs. Type II error in taxonomy).
          *   Explicitly discuss the *Species Concept* underlying the decision (Kind, Clade, Individual, Node) and justify why it fits a museum checklist context.
          *   Tone: Professional, scientific, philosophical depth, adjudicatory.

  2.  **Determine the Recommendation:**
      *   *Option A (Split):* Hard to justify given the gene flow, continuous range, and weak phylogenetic support. Risks validating "splitomania."
      *   *Option B (Lump):* Aligns with the Biological Species Concept (BSC) due to gene flow. Aligns with the Curator's concern about stability. However, ignores the distinctiveness and potential incipient speciation.
      *   *Option C (Conditional/Provisional):* This is often the most nuanced path for museums. It acknowledges the distinctiveness without committing to full specific status until reproductive isolation strengthens or genomic signal deepens.
      *   *Decision:* I will recommend **rejecting the split for now (Lump)**, but with a strong mandate for monitoring. Why? Because the prompt asks to weigh the *costs of error*. In a museum checklist context, stability is usually paramount for conservation and communication. Splitting prematurely creates confusion. If they are distinct, they can be split later. If we split now and they merge back, we've created "noise." The "Individual/Lineage" concept suggests they are *becoming* species, but aren't fully there yet. The "BSC" says they are one. The "PSC" (Phylogenetic) says maybe two, but support is weak.
      *   *Refinement:* Actually, looking at the "cost of error" instruction... If we lump two real species, we might lose conservation protection for one. If we split one species, we dilute the currency of "species." For a museum, catalog integrity is key. However, modern taxonomy often leans towards recognizing evolutionary significant units (ESUs).
      *   *Pivot:* Let's look at the "Species Concept" requirement. The prompt specifically wants me to grapple with Kind vs. Clade vs. Individual.
          *   *Kind (Essentialism):* Plumage says two.
          *   *Clade (Phylogenetic):* Weak support says one (or uncertain).
          *   *Individual (Lineage/BSC):* Gene flow says one.
      *   *Best fit for Museum Checklist:* Stability + Evolutionary Trajectory.
      *   *Final Decision:* **Reject the split (Maintain as single species).** This allows me to strongly address the cost of error (stability vs. premature fragmentation) and the Species Concept (Lineage/Individuality over static diagnosability). It also forces me to defend the Curator while validating the Proposer's data as evidence of *process* rather than *product*.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** State the decision clearly.
      *   **Factual Background:** Briefly recap the biological facts (hybrid zone, gene flow, genetics).
      *   **The Species Concept Question:** This is a core requirement. I need to explain *why* we chose the concept we did.
          *   *The Conflict:* Proposer uses Phylogenetic Species Concept (PSC) / Diagnosability. Curator uses Biological Species Concept (BSC) / Gene Flow.
          *   *The Resolution:* Adopt the **Evolutionary Species Concept (ESC)** or **Lineage Concept**. This views species as separate evolutionary trajectories. Currently, the trajectory is divergent but the lineages are not yet independent (gene flow persists).
          *   *Why for a Museum?* Museums track biodiversity through time. Stability allows for longitudinal study. Premature splitting breaks time-series data.
      *   **Cost of Error Analysis:** This is the other core requirement.
          *   *Error 1 (Splitting one species):* Inflation of diversity metrics, confusion in conservation prioritization, checklist instability ("splitomania").
          *   *Error 2 (Lumping two species):* Potential under-protection, masking of distinct evolutionary units.
          *   *Weighing:* In a museum context, the cost of fragmentation (Error 1) is currently higher because it undermines the checklist's utility as a stable reference. Conservation can still target the distinct forms (ESUs) without a specific split.
      *   **Addressing the Losing Side (The Proposer):**
          *   Acknowledge the plumage and fixed loci are real.
          *   Acknowledge they represent incipient speciation.
          *   Explain that "diagnosability" isn't sufficient without lineage independence.
          *   Invite resubmission when genomic divergence deepens.
      *   **Addressing the Winning Side (The Curator):**
          *   Validate the gene flow argument.
          *   Warn against complacency; this isn't just "variation," it's a active speciation event in progress.
      *   **Conclusion:** Formal ruling.

  4.  **Refining the Philosophy:**
      *   I need to make sure I don't just name-drop concepts but explain how they drive the decision.
      *   *Kind:* If species are kinds defined by traits, they are two. (Rejected).
      *   *Clade:* If species are minimal monophyletic groups, they are arguably two, but the branch is too short. (Rejected/Qualified).
      *   *Individual:* If species are spatiotemporally bounded individuals (lineages), they are currently one individual with internal tension. (Accepted).
      *   *Why Individual?* Because it captures the *process* nature of evolution, which fits the hybrid zone data best.

  5.  **Refining the Cost of Error:**
      *   Make sure this isn't an afterthought. It needs to be a distinct section.
      *   Argument: A museum checklist is a *communication tool*. Noise reduces signal. Splitting now creates noise. Lumping now preserves signal, provided we annotate the variation.

  6.  **Review against Constraints:**
      *   *Recognize, Reject, or Conditional?* I'll go with **Reject (Lump)**, but with a strong note on monitoring. (Conditional is often a cop-out, a firm "No, not yet" is more decisive for a memo). *Self-Correction:* Actually, a "Conditional/Provisional" status might be more intellectually honest given the "Individual" concept. It acknowledges they are *becoming*. Let's stick with **Reject the formal split, but designate as distinct Management Units.** No, the prompt asks to adjudicate the *proposal to split*. So the decision is Split or No Split. I will recommend **No Split**.
      *   *Reasons losing side could respond to:* Yes, focus on the definition of lineage independence.
      *   *Weigh strongest consideration:* Yes, acknowledge the fixed loci and plumage are strong signals of divergence.
      *   *Cost of Error:* Yes, make it central.
      *   *Species Concept:* Yes, dedicate a section to Kind vs. Individual.

  7.  **Final Polish:** Check tone. Needs to be authoritative but collegial. Avoid jargon where possible, but use the philosophical terms requested. (e.g., "concrete particular," "homeostatic property cluster").

      *(Self-Correction during drafting)*: I should ensure I don't dismiss the Phylogenetic Species Concept entirely, but explain why it's less suitable *here* due to the shallow branch support. The "Individual" concept (Ghiselin/Hull) is the strongest philosophical fit for the "continuous range + hybrid zone" scenario.

      *Decision on Recommendation:* I will recommend **rejecting the split**. It allows for the strongest discussion on the "cost of fragmentation" which aligns with the Curator's worry, while allowing the philosophical discussion on "Individuality" to explain why the Proposer's "Clade" argument falls short *at this specific moment in time*.

  8.  **Drafting the Content:** (Mental Outline)
      *   To: Taxonomic Review Panel
      *   From: [My Name/Role]
      *   Subject: Adjudication of Proposal [ID]
      *   Decision: Do not split.
      *   Rationale 1: Species Concept (Lineage/Individual > Static Clade).
      *   Rationale 2: Cost of Error (Stability > Premature Resolution).
      *   Response to Proposer: Your data shows divergence, not completion.
      *   Response to Curator: Your caution is right, but don't ignore the tension.
      *   Closing.

  9.  **Final Review against Prompt:** "I'd like the memo to make that connection explicit: which concept of species is doing the work in the recommendation, why that concept is the right one to apply to a museum checklist in particular, and where the other concepts would have led to a different answer." -> *Make sure this is a highlighted section.*

