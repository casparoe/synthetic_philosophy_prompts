answer: |-
  You have identified a genuine methodological fault line that rarely gets named because it operates as a tacit assumption in narrative construction. You are correct that this is not standard overdetermination, nor is it merely contrastive explanation. In the philosophy of action and metaphysics, this is known as the problem of **Event Fragility** (most rigorously formulated by David Lewis, though you asked for no citations, I will describe the concept without the bibliography). In historiography, it lacks a standardized label, which is why you are struggling to find the lever to pry open the referee's report.

  Here is the carving you requested.

  ### 1. The Name and Definition
  The phenomenon is **Explanandum Plasticity**.

  It is distinct from overdetermination because overdetermination assumes a fixed event identity ($E$) with multiple sufficient causes ($C_1, C_2, C_3$). Explanandum Plasticity occurs when the identity of $E$ itself shifts along a spectrum of **granularity** in response to causal pressure.

  *   **Robust Descriptions (Thin):** The event is defined by binary states (Strike: On/Off; Outcome: Win/Loss). At this level, causation is prone to overdetermination because many pathways lead to the same binary state.
  *   **Fragile Descriptions (Thick):** The event is defined by specific properties, timing, and modalities (Strike: Ended on Day 11 via Vote A). At this level, causation becomes specific because altering a cause alters the *identity* of the event (e.g., if the funds *had* been released, the strike might have ended on Day 14 via Vote B; that is a *different event* than ending on Day 11 via Vote A).

  Your referee is enforcing a **Robust** reading of the event (Did the strike fail?). You are arguing for a **Fragile** reading (Did the strike fail *in this specific political configuration?*). The "slide" you noticed is the unacknowledged movement between Robust and Fragile individuation of the outcome.

  ### 2. Vertical vs. Horizontal Sliding
  Your distinction is intuitive, but "Granularity" is the more precise axis.

  *   **Vertical (Resolution):** This is the primary driver of Plasticity. Adding detail (11 days, rank-and-file committee) increases fragility. It makes the event harder to replicate counterfactually. This is where your causal claim lives.
  *   **Horizontal (Constitution):** This involves swapping features (e.g., was it a transport strike or a general strike?). This changes the *kind* of event, not just the resolution.

  **The Carving:** You should discard the Vertical/Horizontal terminology in favor of **Granularity of Individuation**.
  *   *Low Granularity:* "The strike collapsed." (Referee's view).
  *   *High Granularity:* "The strike collapsed on Day 11 via the specific mechanism of Affiliate A's withdrawal following the funding refusal." (Your view).

  The "damage" you noticed is that Low Granularity invites overdetermination (many causes suffice for collapse), while High Granularity invites causal specificity (only the funding refusal explains the Day 11/Affiliate A mechanism). The referee is accusing you of causal error, but you are actually disputing the **individuation conditions** of the historical object.

  ### 3. Boundary Cases: Legitimate Sharpening vs. Insulation
  This is the critical methodological hurdle. If any historian can insulate a cause by simply adding enough detail to the outcome ("The strike collapsed... while wearing a red hat"), causal claims become trivial. How do you distinguish legitimate fragility from ad hoc insulation?

  The boundary is **Historical Salience**.

  *   **Legitimate Sharpening:** The details added to the description were *salient to the historical actors* or *consequential for the subsequent narrative*.
      *   *Test:* Did the participants care that it ended on Day 11 rather than Day 14? Did the specific mechanism (Affiliate A's vote) alter the political landscape differently than a general exhaustion would have? If the *manner* of the collapse changed the trajectory of the labor movement, then the "thick" event is the real object of study.
  *   **Ad Hoc Insulation:** The details are added solely to make the counterfactual dependence work, without evidence that those details mattered to the historical process.
      *   *Test:* If you removed the detail, would the historical significance change? If "Strike Failure" carries the same historical weight regardless of the day or mechanism, then thickening is insulation.

  In your case, if the *political composition* of the post-strike landscape depended on *which* affiliate broke ranks and *when*, then the thick description is historically necessary, not methodologically suspect.

  ### 4. Vindication or Destruction of the Referee's Objection?
  The phenomenon of Explanandum Plasticity **vindicates your position, provided you shift the burden of proof.**

  The referee's objection ("your case is overdetermined") relies on the premise that the **Robust** description is the default or correct one. In social science, this is often true (we study variables: strike success/failure). In **historical narrative**, this is often false. History frequently studies *processes* and *contingencies*, not just binary outcomes.

  *   **The Referee's Error:** They are treating the strike as a **variable** (Success/Failure) rather than an **episode** (a unique sequence of actions). If the strike is a variable, overdetermination kills your claim. If the strike is an episode, your claim stands.
  *   **Your Defense:** You must argue that the *specific manner of defeat* is the historically significant fact, not the *fact of defeat*.
      *   *Argument:* "The referee is correct that the *binary failure* of the strike was overdetermined. However, the monograph argues that the *political consequences* of the strike depended on the *specific mechanism* of its failure. A strike broken by exhaustion creates a different legacy than a strike broken by federation betrayal. Therefore, the 'event' requiring explanation is not 'failure' but 'failure via betrayal.' At this level of granularity, the funding decision is not overdetermined; it is necessary."

  ### 5. Summary of the Move
  To escape the corner, you must explicitly codify the granularity of your explanandum in the text.

  1.  **Acknowledge the Robust View:** Concede that binary failure was likely overdetermined. This disarms the referee's factual claim.
  2.  **Assert the Fragile View:** State clearly that the historical object of study is the *specific trajectory* of the collapse, not the binary endpoint.
  3.  **Justify via Salience:** Demonstrate that the specific details (Day 11, Affiliate A, Funding Refusal) had distinct downstream consequences that a generic "collapse" would not have produced.
  4.  **Reframe the Causal Claim:** Change "The funding decision caused the strike to fail" to "The funding decision caused the strike to fail *in this specific manner*, which determined the subsequent political landscape."

  This moves the debate from "Is this cause sufficient?" (where you lose to overdetermination) to "Is this the historically relevant description of the event?" (where you win on narrative grounds).

  **The Concept:** Explanandum Plasticity.
  **The Axis:** Granularity of Individuation (Robust vs. Fragile).
  **The Criterion:** Historical Salience of the details.
  **The Verdict:** The referee is applying a social-science variable model to a historical narrative episode. You are not wrong; you are just operating at a higher resolution of event identity than the referee is willing to grant. You must force that resolution into the open.
