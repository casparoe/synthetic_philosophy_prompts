answer: |-
  Here is a defended research agenda for a two-to-three-year conceptual project regarding the separateness of persons.

  ### The Priority Ordering

  1.  **Priority 1: The Structural Integrity of Alternatives (Cluster 2)**
      *   *Question:* Do prioritarian and contractualist frameworks genuinely escape the aggregation problem, or do they merely shift the point of aggregation to a higher level of abstraction?
  2.  **Priority 2: The Ex Ante/Ex Post Distinction (Cluster 1)**
      *   *Question:* Does the separateness objection lose its force when applied to probabilistic risks rather than certain outcomes, and can a theory respect separateness without forbidding all risk-imposition?
  3.  **Priority 3: Institutional Non-Ideal Theory (Cluster 3)**
      *   *Question:* How can institutions be designed to honor separateness without succumbing to decision paralysis in high-stakes trade-offs?

  ---

  ### Priority 1: The Structural Integrity of Alternatives
  **Why this is upstream:**
  This is the foundational metaphysical and logical layer. If the proposed alternatives to utilitarianism (prioritarianism, contractualism) fail to actually respect the separateness of persons, then researching their application to risk (Priority 2) or institutions (Priority 3) is a waste of resources. You cannot build a policy on a moral principle that collapses under its own weight.

  Many philosophers assume that giving extra weight to the worse off (prioritarianism) or requiring reasonable rejection (contractualism) solves the problem. However, a serious conceptual audit is needed to determine if these are substantive solutions or merely cosmetic. For instance, prioritarianism still aggregates welfare; it simply changes the exchange rate. If the "currency" is still comparable across persons, the separateness objection may still apply, just at a different threshold. Similarly, contractualism often struggles with the "Numbers Problem" (why save five instead of one if no single individual has a veto?).

  **Tractability for Conceptual Work:**
  This is highly tractable for a small theoretical team. It does not require empirical data, surveys, or case studies. It requires rigorous logical modeling and thought experimentation. The team can construct formal scenarios where prioritarian weighting and contractualist vetoes are stress-tested against the core intuition of separateness. The goal is not to solve the debate forever, but to map the precise "break points" where these theories slide back into utilitarianism.

  **Criteria for Promotion or Demotion:**
  *   **Promote:** If the team can formulate a precise mathematical or logical condition that distinguishes "respecting separateness" from "weighted aggregation." If you can define a bright line where a theory stops being utilitarian in disguise, this work becomes the anchor for all subsequent policy work.
  *   **Demote:** If the investigation reveals that the distinction is purely verbal or relies on intuitions that are too unstable to formalize. If it turns out that "separateness" is just a rhetorical device for "I dislike this outcome," further work on this specific metaphysical objection should be paused in favor of pragmatic compromise.

  ### Priority 2: The Ex Ante/Ex Post Distinction
  **Why this is upstream of Priority 3:**
  Once you have a working hypothesis about which moral framework respects separateness (from Priority 1), you must test it against the reality of modern governance. Almost all public policy is *ex ante* (risk-based) rather than *ex post* (outcome-based). We do not usually take $1,000 from Person A to give $1 to 1,000 others; we impose a 1-in-1,000,000 risk of death on everyone to build a highway that saves time for everyone.

  The separateness objection is often formulated as an *ex post* complaint (sacrificing a specific identified victim). It is less clear if it applies *ex ante*. If everyone faces the same small risk, is anyone truly being "sacrificed"? Or does the aggregation of tiny risks into a statistical certainty of death for some violate separateness just as much as direct sacrifice? This must be resolved before designing institutions, because if risk-imposition is ruled out, modern public health and safety protocols become impossible.

  **Tractability for Conceptual Work:**
  This is moderately tractable. It requires engagement with decision theory and probability, but remains conceptual. The researcher can analyze the logic of "statistical lives" versus "identified lives." The work involves clarifying whether the moral status of a probability differs from the moral status of an outcome. This is a logical puzzle suitable for a small team without needing IRB approval or field data.

  **Criteria for Promotion or Demotion:**
  *   **Promote:** If the team develops a robust principle of "acceptable risk imposition" that respects separateness. For example, if you can defend a rule that allows risk aggregation only when the risk is reciprocal (everyone risks, everyone benefits) without violating individual integrity, this is a major breakthrough.
  *   **Demote:** If the analysis shows that any non-zero risk imposition violates separateness. This would lead to moral paralysis (no driving, no medicine, no infrastructure). If the theory cannot accommodate basic social functioning, it must be demoted in favor of non-ideal theory (Priority 3) that accepts some violation as tragic necessity.

  ### Priority 3: Institutional Non-Ideal Theory
  **Why this is downstream:**
  Institutional design is the application layer. It depends entirely on the outputs of Priorities 1 and 2. If you do not know whether your moral principle allows for aggregation (Priority 1) or how it handles risk (Priority 2), you cannot design a triage protocol. Furthermore, this area is the most prone to "concept drift," where philosophical work turns into standard policy analysis. By placing it last, you ensure that the institutional rules are derived from first principles rather than existing conventions.

  **Tractability for Conceptual Work:**
  This is the least tractable for pure conceptual work because it risks requiring empirical knowledge of how institutions function. To keep it philosophical, the focus must remain on *delegation principles* rather than specific protocols. The question is not "What is the right triage algorithm?" but "Under what conditions is it permissible to delegate aggregation decisions to a bureaucrat?" This keeps the work conceptual.

  **Criteria for Promotion or Demotion:**
  *   **Promote:** If the team can identify "thresholds of delegation." For example, establishing that separateness must be respected at the individual case level, but aggregation is permissible at the legislative level. If a clear division of moral labor can be defended, this becomes the most practically valuable output.
  *   **Demote:** If the work devolves into listing specific medical or economic scenarios without generating generalizable principles. If the team finds themselves arguing about specific ICU bed counts rather than the moral authority of the allocation committee, the project has lost its conceptual focus.

  ### Summary of Strategy

  This ordering creates a funnel. **Priority 1** ensures you are not solving the wrong problem. **Priority 2** ensures your solution works in the probabilistic world we actually inhabit. **Priority 3** ensures the solution can be implemented without causing societal collapse.

  For a two-to-three-year timeline, the bulk of effort (roughly 50%) should go to **Priority 1**. If you cannot clarify whether prioritarianism is just utilitarianism with a mask on, the rest of the project lacks a moral engine. **Priority 2** should take 30%, serving as the stress test. **Priority 3** should take the remaining 20%, serving as a reality check to ensure the theory doesn't demand the impossible.

  **The Critical Pivot Point:**
  The most important milestone in this agenda occurs at the end of Year 1. If the team cannot articulate a clear difference between "weighted aggregation" and "respecting separateness," the agenda should pivot. At that point, Priority 3 should be promoted immediately. If the metaphysics are intractable, the only honest philosophical work is to determine how to manage the violation of separateness as a tragic necessity in institutional design, rather than pretending it can be fully resolved.
