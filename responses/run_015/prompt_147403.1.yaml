      *   *Cluster 2 (Meta-Ethical/Structural):* Do the alternatives actually work? This is the foundational question. If prioritarianism *is* just utilitarianism in disguise regarding separateness, then working on Cluster 1 or 3 based on prioritarian assumptions is wasted effort.
      *   *Cluster 3 (Institutional/Non-Ideal):* How do we apply this? This is downstream. You need to know *what* to apply before figuring out *how* to apply it.

  3.  **Determining the Priority Order:**
      *   *Priority 1:* Cluster 2 (The Structural Integrity of Alternatives). Why? Because if the solutions don't actually solve the problem, the rest of the agenda is built on sand. It's the most "upstream" conceptual work.
      *   *Priority 2:* Cluster 1 (Ex Ante Risk). Why? Once we know *which* aggregation principle holds (if any), we need to know if it survives the transition from static distribution to probabilistic risk. This is where modern policy actually lives (vaccines, speed limits, climate change). It bridges theory and practice.
      *   *Priority 3:* Cluster 3 (Institutional Design). Why? This is implementation. It depends on the outcomes of 1 and 2. It's also the most likely to devolve into empirical sociology or law, which might drift away from the core conceptual work requested.

  4.  **Drafting the Argument for Priority 1 (Structural Integrity):**
