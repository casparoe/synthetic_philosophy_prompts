      *   *Black Box:* Opaque processing where inputs/outputs are known, but the mechanism is hidden.

  4.  **Develop the Core Argument (The Bridge):**
      *   *Premise 1:* For Spinoza, democratic legitimacy relies on the alignment of individual *conatus* with the collective power. This alignment is achieved through *reason*.
      *   *Premise 2:* Reason operates through *common notions*. These are adequate ideas about properties shared by all.
      *   *Premise 3:* To form a common notion, one must understand the causal chain leading to a decision/affect. Inadequate ideas (imagination) arise from fragmented knowledge of causes.
