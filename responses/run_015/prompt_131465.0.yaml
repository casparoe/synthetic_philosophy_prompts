      *   *Democracy (Political Treatise):* The most natural regime, aligning individual *conatus* with collective power. Legitimacy comes from the power of the multitude, not divine right.
      *   *Freedom:* Not free will, but acting from the necessity of one's own nature (rational understanding).
      *   *Metaphysics:* Substance Monism (God or Nature). Mind and Body are parallel attributes of the same thing. No external "view from nowhere."

  3.  **Deconstruct the Software Analogy:**
