  **DISTRICT DISCRETIONARY FUND: ALLOCATION PROTOCOL**
  *(To be posted in Conference Room B)*

  **1. DEFINE THE "LEAST ADVANTAGED" (Do this first, before looking at proposals)**
  *   **The Rule:** We do not rank individual kids. We rank schools. The "Least Advantaged Group" is the **bottom quartile of schools** (10 schools) based on last year's data.
  *   **The Metric:** Create a "Need Index" for each school using equal weighting of: Free/Reduced Lunch %, English Learner %, Teacher Turnover %, and Average Test Scores (reverse scored).
  *   **Breaking the Circle:** We use *last year's* data to define *this year's* group. This prevents us from moving the goalposts to fit a proposal. Once the 10 schools are identified, they are locked for this budget cycle.

  **2. THE FOUR TESTS (Ask in order. If a proposal fails any, it dies.)**
  *   **Test 1: Targeting.** Does the money land directly in the Least Advantaged Group, or does it land elsewhere and "trickle down"?
      *   *Real Answer:* "70% of funds are spent inside the 10 identified schools."
      *   *Hand-Waving:* "It helps everybody," or "High-performing schools inspire the rest." (Reject this. We are not maximizing averages; we are maximizing the floor.)
  *   **Test 2: Comparative Gain.** Does this specific use of funds improve the life prospects of the Least Advantaged Group *more* than simply dividing the money equally among them?
      *   *Real Answer:* "A literacy coach raises reading scores by X%; equal cash per pupil would only buy Y."
      *   *Hand-Waving:* "It's a great program." (Great for whom? Compare it to the baseline alternative.)
  *   **Test 3: The Inequality Trade.** If the proposal gives *more* to advantaged schools (inequality), is that inequality strictly necessary to get the benefit for the Least Advantaged?
      *   *Real Answer:* "The donor will not fund the poor schools unless the rich schools get the labs."
      *   *Hand-Waving:* "We need to keep the rich parents happy so they don't leave." (This is political convenience, not a benefit to the least advantaged.)
  *   **Test 4: Durability.** Does the benefit last longer than the budget year?
      *   *Real Answer:* "Training teachers creates a skill that lasts 5 years."
      *   *Hand-Waving:* "We'll cross that bridge next year." (One-year spikes that crash to zero do not improve life prospects.)

  **3. THE VEIL OF IGNORANCE (How to use it in this room)**
  *   Do not pretend you don't know the data. Pretend you don't know **which school you work at.**
  *   Ask: "If I were assigned to a random school in this district tomorrow, would I agree to this rule?"
  *   Apply this *once* to agree on this Protocol. Do not re-argue the philosophy for every line item.

  **4. STOP RULES (When to hand it to the Superintendent)**
  *   **The Intangible Limit:** If the spreadsheet says "Yes" (metrics improve) but the community impact is visibly destructive (e.g., closing a neighborhood hub), flag it. This framework cannot measure "social bases of self-respect."
  *   **The Cliff:** If a program ends abruptly after one year with no path to continuation, flag it.
  *   **The Tie:** If two proposals help the Least Advantaged equally, the choice is a values call, not a math call.

  ***

  ### APPLICATION TO CURRENT PROPOSALS

  Here is how the protocol runs the three proposals on your desk.

  **1. Literacy Coaches (6 Highest-Poverty Elementary Schools)**
  *   **Verdict:** **APPROVE.**
  *   **Why:** It passes Test 1 (Targeting) perfectly. It addresses Test 4 (Durability) if the teacher training sticks, even if the coach leaves. It is the cleanest fit for the mandate.
  *   **Risk:** The "Cliff." If the grant vanishes in Year 2, you must flag this to the Superintendent. But under Rawls, you take the gain now.

  **2. Corporate Donation (Labs for Rich, STEM for Poor)**
  *   **Verdict:** **APPROVE.**
  *   **Why:** This is the hard one. It fails Test 1 (Targeting) because rich schools get labs. *However*, it passes Test 3 (Inequality Trade). The inequality (labs) is the *price* of the benefit to the Least Advantaged (5 years of STEM).
  *   **The Logic:** If you reject the deal to avoid giving rich kids labs, the poor kids get *zero* STEM. Rawls does not care about your discomfort with the rich kids getting gifts; he cares only that the poor kids get the maximum possible benefit. If this is the only way the poor kids get the STEM, you must take it.

  **3. School Closure (Poor Neighborhood K–8 to Better School)**
  *   **Verdict:** **APPROVE.**
  *   **Why:** On every column in your spreadsheet (Test 1, Test 2, Test 4), the kids win. Their life prospects (primary goods) improve by moving to a better-resourced school.
  *   **The Unwanted Truth:** **You are going to have to close the school.**
  *   **Why you should accept this:** You mentioned "something real is being lost that none of our columns see." You are right. But under this specific board mandate, you cannot prioritize neighborhood cohesion over educational opportunity for the poorest kids. To keep the school open is to say, "We value your community's feelings more than your children's test scores and facilities." That is paternalistic. The procedure forces you to choose the kids' prospects over the adults' comfort.
  *   **Note:** This triggers the **Intangible Limit** Stop Rule. You must tell the Superintendent: "The math says close it. The ethics say talk to the neighborhood first." But the budget recommendation must be to close it.

  ***

  ### WHAT THIS PROCEDURE WILL GET WRONG (Every Single Year)

  1.  **It Will Be Cruel:** It treats schools as data points. It will recommend cutting programs at a "middle-tier" school to fund a "bottom-tier" school, even if the middle-tier school has urgent needs. It is designed to be unfair to the middle to help the bottom.
  2.  **It Cannot Measure Dignity:** As seen in the School Closure proposal, the spreadsheet cannot count "community trust" or "sense of belonging." If those things collapse, test scores eventually drop anyway. The procedure is blind to this lag.
  3.  **It Encourages Gaming:** Principals will try to manipulate the "Need Index" to get into the Bottom Quartile. You will spend more time auditing their data than discussing philosophy.
  4.  **It Ignores the "Cliff":** Rawls talks about life prospects. A one-year budget cycle is too short to measure a life. You will inevitably fund things that look good in June and vanish in August, hurting the very kids you tried to help.
  5.  **It Makes You the Bad Guy:** This protocol removes "political feasibility" from the decision. It tells you to do what is mathematically right for the poorest, even if it gets the Board voted out. If you aren't willing to be the bad guy, do not use this protocol.

  **Final Instruction:**
  Print this. Put it on the wall. When the principal from the affluent high school argues for the labs, point to Test 3. When the principal from the K–8 argues to stay open, point to Test 2. When you feel sick about the result, look at the "Limitations" section, acknowledge the cost, and sign the paper.
