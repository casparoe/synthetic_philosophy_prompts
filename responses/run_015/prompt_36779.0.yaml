  Dear Friend,

  It is a fascinating puzzle you have set before me, trying to deduce the internal algorithm of your graduate school friend based on her reported verdicts. After carefully tracing the logic of her decisions across the four cases you described, I believe I can narrow down the decision theory she is implicitly running, though there is a significant ambiguity that remains until we see her handle the next set of problems. Her behavior in the smoking lesion case, where she chooses to smoke despite the correlation with cancer, immediately rules out Evidential Decision Theory. An evidentialist would see smoking as bad news regarding the lesion and abstain, but your friend correctly identifies that her action cannot causally influence the presence of the lesion. This aligns her with either Causal Decision Theory or the more recent Functional Decision Theory, both of which prescribe smoking in this scenario. Her refusal to pay in the XOR blackmail setup further cements this exclusion of Evidential Decision Theory, as an evidentialist would pay to gain the evidence that termites are absent, whereas both causal and functional decision theorists recognize that payment cannot causally or logically alter the past fact of the infestation once the letter has been received. The remaining two cases, the coin flip Newcomb problem and the ordinary one-shot blackmail, are consistent with almost every major theory since there is no leverage, causal or logical, to be had, so they do not help us distinguish further.

  Consequently, we are left with a tie between Causal Decision Theory and Functional Decision Theory, as both theories yield the exact same verdicts on all the past cases you listed. This is because the smoking lesion and XOR blackmail cases are specifically those where Causal and Functional Decision Theory agree against Evidential Decision Theory. To break this tie, we must look to the three new cases you mentioned, as these are the classic battlegrounds where Causal and Functional Decision Theory diverge. In the standard Newcomb problem with a ninety percent accurate predictor, a Causal Decision Theorist will two-box, arguing that the money is already in the boxes and her choice cannot change it, while a Functional Decision Theorist will one-box, arguing that her decision is logically linked to the predictor's simulation. In the counterfactual mugging case where the coin has landed tails, a Causal Decision Theorist will refuse to pay the hundred dollars because the payment cannot causally bring about the heads world where she would have been rewarded, whereas a Functional Decision Theorist will pay, reasoning that her decision algorithm must be consistent across counterfactual branches to ensure the predictor would have made the offer in the first place. Similarly, in Parfit's hitchhiker case, once she is safely in town, a Causal Decision Theorist will refuse to pay the driver because the rescue has already occurred and payment provides no causal benefit, while a Functional Decision Theorist will pay to maintain the logical consistency of being the kind of agent who keeps promises, thereby ensuring she would have been rescued.

  My best guess is that she will one-box in the Newcomb problem, pay in the counterfactual mugging, and pay the hitchhiker. I lean toward Functional Decision Theory primarily because of her familiarity with the XOR blackmail setup. This specific case was constructed and popularized within the literature surrounding Functional Decision Theory to demonstrate its advantages over Evidential Decision Theory, and it is less commonly cited as a standard example in classical Causal Decision Theory circles. Furthermore, your description of her as unusually decisive suggests she has resolved the cognitive dissonance that often plagues Causal Decision Theorists when facing Newcomb-like problems, where they intellectually know they should two-box but feel they are leaving money on the table. A proponent of Functional Decision Theory typically experiences no such dissonance, viewing the one-boxing and paying outcomes as straightforwardly rational. While it is possible she is a strict Causal Decision Theorist who simply accepts the consequences of her theory, the specificity of her case knowledge points toward the community that developed Functional Decision Theory.

  Regarding which of the three new cases would best tell the rules apart, the counterfactual mugging is arguably the cleanest test. The standard Newcomb problem can sometimes be muddied by debates over the physical mechanism of prediction, and the hitchhiker case involves social norms that might confuse the logical issue. The counterfactual mugging isolates the core disagreement about whether rational agents should optimize for counterfactual outcomes that are causally inaccessible but logically dependent on their decision algorithm. However, if you wish to settle the question even more cleanly than any of the three, I would suggest presenting her with the Psychopath Button case. In this scenario, she is told that pressing a button will kill all psychopaths, that she is not a psychopath, but that only psychopaths would choose to press the button. A Causal Decision Theorist will press the button because her action does not causally make her a psychopath and it saves lives, whereas a Functional Decision Theorist will not press it because her decision is logically correlated with being the type of agent who presses the button. This case removes the predictor element entirely, relying solely on logical correlation between agent type and action, which provides a stark and unambiguous separation between the two theories without the potential distraction of prediction mechanics.

