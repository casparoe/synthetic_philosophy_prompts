  **1. Autism Spectrum Disorder**
  **Reflexive Looping:** 5 | **Adversarial Looping:** 5 | **Composite Score:** 5.0

  The neurodiversity movement exemplifies adversarial looping by challenging the pathology model, while high social visibility encourages deep internalisation of the autistic identity. Online communities facilitate both the sharing of coping strategies and the collective political organisation required to influence diagnostic criteria. Consequently, the taxonomy is continually reshaped by both individual self-conception and organised advocacy.

  **2. Attention-Deficit/Hyperactivity Disorder**
  **Reflexive Looping:** 5 | **Adversarial Looping:** 4 | **Composite Score:** 4.5

  Widespread online discussion normalises the diagnosis, leading individuals to restructure their lives and self-view around ADHD traits. Although there is debate regarding overdiagnosis, the collective push is primarily towards expanded access rather than subverting the classification itself. This creates a strong reflexive loop with a moderately adversarial edge focused on validation.

  **3. Dissociative Identity Disorder**
  **Reflexive Looping:** 3 | **Adversarial Looping:** 5 | **Composite Score:** 4.0

  Diagnostic ambiguity allows online communities to perform alter identities, triggering clinical scepticism and criteria tightening in an adversarial feedback cycle. However, severe gatekeeping limits the extent to which individuals can safely internalise the label without contestation. Thus, while the looping is intense, it is constrained by institutional resistance compared to neurodevelopmental categories.

  **4. Borderline Personality Disorder**
  **Reflexive Looping:** 4 | **Adversarial Looping:** 3 | **Composite Score:** 3.5

  High stigma often compels individuals to conceal the diagnosis, dampening reflexive looping, though some reclaim the label to challenge negative stereotypes. Advocacy groups work to rename the condition and reduce prejudice, representing a moderate adversarial effort to alter institutional perceptions. The looping effect is significant but hindered by the pejorative nature of the classification.

  **5. Social Anxiety Disorder**
  **Reflexive Looping:** 3 | **Adversarial Looping:** 2 | **Composite Score:** 2.5

  Individuals typically view social anxiety as a symptom to be eliminated rather than a core identity to be embraced, minimising reflexive looping. There is little collective mobilisation to subvert or redefine the criteria, as the goal is generally treatment rather than classification reform. Consequently, the taxonomy remains relatively stable with minimal feedback from the classified group.
