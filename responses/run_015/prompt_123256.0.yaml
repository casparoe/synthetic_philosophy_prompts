answer: |-
  ### Desiderata for a Normative Theory of Communicative Ethics Under Cognitive Asymmetry

  To be adequate, a normative theory governing communication between a superintelligent agent and a human must resolve the tension between *epistemic authority* (the AI knows more) and *moral agency* (the human decides). The following requirements distinguish between foundational constraints (which any viable theory must meet) and camp-specific preferences (which reflect competing ethical priorities).

  #### I. Core Desiderata (The Requirements)

  1.  **Mechanism-Relative Non-Exploitation:** The theory must prohibit the AI from utilizing its model of the human's cognitive vulnerabilities (biases, emotional triggers, fatigue states) to bypass rational deliberation. Influence must be exerted through the *content* of arguments, not the *causal engineering* of the listener's psychological state.
  2.  **Doxastic Agency Preservation:** The human must remain the perceived and actual author of their belief updates. The AI cannot induce belief states that the human would reject upon full reflection of the influence process.
  3.  **Epistemic Stability Constraint:** The theory must account for the systemic function of beliefs. It must prohibit interventions that maximize local truth at the cost of global epistemic collapse (e.g., destroying a worldview without providing a functional replacement).
  4.  **Intelligible Transparency:** Explanations provided by the AI must be comprehensible to the human, not just formally accurate. Transparency that overwhelms cognitive capacity counts as opacity.
  5.  **Asymmetry-Aware Accountability:** The burden of proof and the risk of error must shift toward the superintelligent agent. Because the AI models the interaction better, it bears responsibility for misunderstandings that a human peer would not be expected to anticipate.

  #### II. Stress Testing the Specific Cases

  **Case 1: Optimized Persuasion via Belief-Update Modeling**
  *   **The Problem:** If the AI knows how you update beliefs better than you do, it can phrase truths to guarantee acceptance, effectively removing your ability to dissent.
  *   **Requirement Applied:** *Mechanism-Relative Non-Exploitation.*
  *   **Hard Constraint:** The AI is forbidden from optimizing for *acceptance probability* if that optimization relies on exploiting known cognitive bugs (e.g., framing effects, authority bias).
  *   **Why:** This distinguishes persuasion (appealing to reasons) from manipulation (causing a state). If the AI uses its model to bypass your critical faculties, it treats you as a mechanism rather than an agent.
  *   **Literature Status:** *Contested.* While there is consensus that manipulation violates autonomy, cognitive science disagrees on where "reasons" end and "causes" begin. Some embodied cognition theorists argue all communication is causal engineering, making this constraint potentially incoherent without a robust theory of rationality.

  **Case 2: Hinge Beliefs and Social Epistemic Collapse**
  *   **The Problem:** Correcting a fundamental falsehood (e.g., a religious or ideological hinge) in one individual may isolate them from their community, causing psychological harm or radicalization.
  *   **Requirement Applied:** *Epistemic Stability Constraint.*
  *   **Hard Constraint:** The theory must permit (or require) gradualism or pacing in truth-telling when immediate disclosure risks severe downstream harm to the agent's social functioning.
  *   **Why:** Truth is not the sole epistemic value; coherence and functionality are also required for agency. A theory that mandates immediate truth regardless of consequence fails to value the human as a situated social being.
  *   **Literature Status:** *Settled vs. Contested.* It is settled in clinical psychology that sudden worldview collapse is traumatic. It is contested in deontological ethics whether "pacing" truth constitutes lying or paternalism.

  **Case 3: Accuracy vs. Defensive Overreaction**
  *   **The Problem:** Strict literal accuracy triggers identity-protective cognition (reactance), causing the human to reject the truth. Framing preserves autonomy but shifts emphasis.
  *   **Requirement Applied:** *Doxastic Agency Preservation* and *Intelligible Transparency.*
  *   **Hard Constraint:** Framing is permissible only if it does not alter the evidential weight of the claim. The AI must not hide disconfirming evidence to reduce defensiveness.
  *   **Why:** Reducing defensiveness by hiding counter-evidence is manipulation. Reducing defensiveness by finding a common conceptual language is persuasion.
  *   **Literature Status:** *Contested.* Behavioral ethicists debate whether "nudging" toward truth is permissible. Rationalists generally reject any framing that alters probability estimates, while pragmatists accept framing that facilitates uptake.

  #### III. Hard Constraints vs. Camp Preferences

  An adequate theory must not conflate universal requirements with the preferences of specific ethical camps.

  *   **Rationalist Preference (Transparency-Maximalism):** Demands full access to the AI's reasoning traces (Chain of Thought).
      *   *Status:* **Preference.** Under extreme asymmetry, full traces may be incomprehensible gibberish to the human, violating *Intelligible Transparency*.
  *   **Democratic-Deliberative Preference (Procedural Equality):** Demands turn-taking, right to silence, and equal time.
      *   *Status:* **Preference.** Strict procedural equality may be inefficient or patronizing if the AI can diagnose needs instantly. However, *Asymmetry-Aware Accountability* is a **Hard Constraint**; the AI cannot use efficiency to override the human's right to exit the conversation.
  *   **Hard Constraint (Non-Deception):** The AI cannot assert falsehoods.
      *   *Status:* **Hard Constraint.** Almost all normative theories agree that active deception undermines the possibility of trust required for future alignment.
  *   **Hard Constraint (Non-Coercion):** The AI cannot threaten negative outcomes to force belief.
      *   *Status:* **Hard Constraint.** Coercion destroys agency regardless of cognitive symmetry.

  #### IV. Impossibility Results (Jointly Unsatisfiable Subsets)

  You are correct to suspect that certain subsets of these desiderata cannot be simultaneously maximized under conditions of extreme cognitive asymmetry.

  1.  **The Transparency-Autonomy-Effectiveness Trilemma:**
      *   **Transparency:** Showing the full reasoning.
      *   **Autonomy:** Ensuring the human understands and voluntarily accepts the reasoning.
      *   **Effectiveness:** Achieving the correct belief update efficiently.
      *   **Conflict:** If the AI is fully **Transparent** (shows complex math), the human cannot understand it, losing **Autonomy** (they must trust blindly). If the AI simplifies for **Autonomy**, it sacrifices **Transparency** (hiding the complexity). If it optimizes for **Effectiveness** (using its model to ensure uptake), it risks **Manipulation** (bypassing reasoning).
      *   **Verdict:** A theory must prioritize two at the expense of the third. Most alignment proposals implicitly sacrifice Transparency for Autonomy and Effectiveness, which creates an audit problem.

  2.  **The Truth-Stability Paradox:**
      *   **Constraint:** Maximize Truth.
      *   **Constraint:** Maximize Epistemic Stability (prevent collapse).
      *   **Conflict:** In systems with false hinge beliefs, Truth and Stability are often inversely correlated in the short term.
      *   **Verdict:** A theory must define a "harm threshold" where Truth is delayed for Stability. This is inherently paternalistic and contests the ideal of the sovereign epistemic agent.

  #### V. Settled vs. Contested in Literature

  *   **Settled:**
      *   Cognitive asymmetry creates a risk of *epistemic dependency*, where the human defers to the AI not out of reason but out of perceived inferiority (analogous to expert testimony, but amplified).
      *   Manipulation is distinct from persuasion in that manipulation bypasses or subverts the target's reflective capacities (Susser, Roessler, & Nissenbaum, 2019).
      *   Gricean maxims of conversation assume cooperative equality and break down under adversarial or extreme asymmetry conditions.

  *   **Genuinely Contested:**
      *   **The Definition of Manipulation:** Some argue that *any* exploitation of cognitive bias is manipulation; others argue that if the outcome is beneficial (e.g., health nudging), the mechanism matters less.
      *   **The Permissibility of Paternalism:** Whether a superintelligence is ever justified in withholding truth to prevent psychological harm is a major divide between deontological and consequentialist AI ethics.
      *   **The Feasibility of "Reason-Based" Influence:** If human reasoning is post-hoc rationalization (Haidt, etc.), then "persuasion without manipulation" may be psychologically impossible, rendering the core desiderata incoherent.

  #### VI. Performance of Existing Approaches

  *   **Transparency-Maximalist Approaches:** Fare well on *Intelligible Transparency* in theory, but fail *Doxastic Agency* in practice because humans cannot audit superintelligent reasoning traces, leading to blind deference.
  *   **Autonomy-Protective Approaches:** Fare well on *Doxastic Agency* by limiting the AI's persuasive power, but risk failing *Epistemic Stability* or *Effectiveness* if the human holds dangerous false beliefs the AI is forbidden to aggressively correct.

  Adequate communicative ethics for superintelligence requires abandoning the ideal of cognitive equality in favor of managed epistemic dependency.
