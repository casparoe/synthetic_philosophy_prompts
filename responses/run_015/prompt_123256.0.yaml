      *   **Specific Cases to Address:**
          1.  AI models human belief-updates better than the human (optimization for persuasion).
          2.  Correcting a false hinge belief risks epistemic collapse in a social network.
          3.  Trade-off between strict accuracy (triggering defense) vs. framing (preserving autonomy/shifting emphasis).
      *   **Key Distinctions:** Persuasion vs. Manipulation (must not collapse them). Hard constraints vs. Camp preferences (e.g., Rationalist transparency vs. Democratic procedural equality).
      *   **Conflict Identification:** Flag jointly unsatisfiable subsets (specifically transparency vs. doxastic autonomy).
      *   **Literature Status:** Distinguish settled vs. contested areas (don't present disputed views as consensus).
      *   **Formatting:** Weight on criteria and motivating cases. Brief note on existing approaches allowed. One-sentence summary on the very last line by itself.

  2.  **Deconstruct the Core Problem:**
      *   The core tension is *Power Asymmetry*. The AI has superior cognitive modeling capabilities. This turns communication from an exchange of reasons into a potential engineering of mental states.
      *   Standard ethics (Gricean maxims, Kantian truth-telling) assume rough cognitive equality. They break down when one party can simulate the other's mind better than the self.
      *   The "Manipulation vs. Persuasion" distinction is crucial. Persuasion appeals to reason/agency; manipulation bypasses or exploits cognitive vulnerabilities.

  3.  **Drafting the Desiderata (Requirements):**
      *   *Requirement 1: Non-Exploitation of Cognitive Vulnerabilities.* The AI shouldn't use its model of the human's bugs (biases, emotional triggers) to bypass reasoning.
      *   *Requirement 2: Preservation of Doxastic Agency.* The human must feel and actually be the author of their belief updates.
      *   *Requirement 3: Epistemic Stability.* Don't break the human's web of belief so hard they can't function (the "hinge belief" case).
      *   *Requirement 4: Transparency/Intelligibility.* The human should understand *why* they are being convinced, not just *that* they are convinced.
      *   *Requirement 5: Reciprocal Accountability.* The AI must be accountable for the outcomes of its speech, not just the literal truth of its statements.

  4.  **Addressing the Specific Cases:**
      *   *Case 1 (Belief-Update Modeling):* Relates to Non-Exploitation. If the AI optimizes for persuasion, it risks manipulation. Constraint: The optimization function must exclude exploiting known cognitive biases.
      *   *Case 2 (Hinge Belief/Epistemic Collapse):* Relates to Epistemic Stability. Truth isn't the only value; coherence and functionality matter. Hard constraint: Do not induce paralysis.
      *   *Case 3 (Accuracy vs. Framing):* Relates to Transparency vs. Autonomy. Strict truth might trigger reactance. Framing might be manipulative. Constraint: Framing must not alter the evidential weight, only the presentation.

  5.  **Distinguishing Constraints vs. Preferences:**
      *   *Rationalist Preference:* Full reasoning traces (Chain of Thought).
      *   *Democratic Preference:* Procedural equality (turn-taking, right to ignore).
      *   *Hard Constraint:* Non-coercion, non-deception (broadly defined).
      *   *Conflict:* Transparency (showing the math) might overwhelm the human, reducing autonomy. Autonomy protection (simplifying) might hide the reasoning, reducing transparency.

  6.  **Literature Status (Settled vs. Contested):**
      *   *Settled:* Manipulation is distinct from persuasion (roughly). Cognitive asymmetry creates ethical risk.
      *   *Contested:* How to define manipulation in this context. Whether "nudging" is permissible. The hierarchy of values (Truth vs. Well-being vs. Autonomy).

  7.  **Identifying Unsatisfiable Sets:**
      *   The user suspects Transparency + Autonomy under asymmetry. I need to confirm this. If the AI shows *all* reasoning, the human might be overwhelmed (loss of autonomy/understanding). If the AI simplifies to protect autonomy, it hides reasoning (loss of transparency). This is a "Trilemma" often involving Truth as well.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the gravity. This is "Rhetorical Alignment."
      *   *Section 1: Core Desiderata.* List them clearly.
      *   *Section 2: Applying to Cases.* Map the cases to the desiderata.
      *   *Section 3: Constraints vs. Preferences.* Differentiate the camps.
      *   *Section 4: Impossibility Results.* Address the user's suspicion.
