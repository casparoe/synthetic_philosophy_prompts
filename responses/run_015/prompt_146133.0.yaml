      *Revised Fatal Defeater:* Evidence that the "operational logic" itself is malleable. If operators can run a centralized plant with decentralized decision-making (e.g., safety cultures that empower low-level workers to shut down the plant), then the "hierarchical control" is not technically necessary, just managerially preferred.

      *Let's look at HROs (High Reliability Organizations).* They operate dangerous tech (carriers, nukes) but emphasize decentralized decision-making at the edge for safety. This directly contradicts "hierarchical control is technically necessary."

