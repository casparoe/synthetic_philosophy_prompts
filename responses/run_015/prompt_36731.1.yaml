  5.  **Final Review of Physics/Philosophy Nuances:**
      *   *Memory:* Landauer (1961) says erasure costs energy. Measurement can be reversible (Bennett). However, having a *record* implies a correlation that must be established, usually involving entropy increase. The user says "creating one is paid for by dissipating heat." This is technically slightly off (erasure is the costly part), but for a literary essay, "memory requires entropy increase" is acceptable. I will mark it "imprecise" to be rigorous.
