answer: |-
  **TO:** Governance Committee, Supplemental Retirement Plan
  **FROM:** [Your Name], Member-Elected Trustee
  **DATE:** Wednesday, [Date]
  **SUBJECT:** Recommendation on Trading Frequency and Fee Structure

  **BOTTOM LINE**

  I recommend we **adopt Cooldown+ (a 21-day wait between trades) without any override fees, effective July 1,** and **eliminate the 0.25% switch fee entirely, effective January 1.** We should not offer optional self-binding locks.

  *   **July 1:** Implement 21-day lock on all accounts. No paid overrides.
  *   **January 1:** Remove 0.25% transaction fee. Absorb any Recordkeeper system costs as general administrative expenses.

  **THE PROBLEM: PREDICTABLE LOSS AND UNFAIR SUBSIDIES**

  We have two conflicting duties here. One is to stop participants from losing money on purpose. The other is to avoid profiting from their mistakes. Currently, we are failing both.

  Seven percent of our participants—mostly staff and adjuncts with smaller balances—are "round-tripping." They move money out and back in multiple times a quarter, ending up where they started but minus the 0.25% fee each time. They are systematically losing savings to fees. This is not investing; it is a money pump.

  Simultaneously, those fees go into a reserve that pays out a flat $18 credit to every account once a year. This means a staff member with $5,000 who trades frequently might pay $50 in fees to get $18 back. A professor with $200,000 who never trades pays $0 and gets the same $18. The active traders are subsidizing the passive ones. Our Finance Trustee is right that this is harmful. Our Benefits Lawyer is right that it is uncomfortable for us to collect these fees.

  **THE SOLUTION: UNIVERSAL FRICTION, NOT PUNITIVE FEES**

  The Recordkeeper's proposal, Cooldown+, adds a 21-day wait after a trade. This stops impulse trading without charging a penalty. However, their version allows you to pay a fee to break the lock. I recommend we reject the override fee.

  If we charge a fee to break the lock, we create the exact ethical problem the Lawyer Trustee identified: we are selling people the right to stop losing money. If a participant realizes they are trapped in a bad cycle, they shouldn't have to pay us to escape it. The lock should be a safety rail, not a toll booth.

  By making the lock universal (everyone waits 21 days), we protect the participants who told us they want to be stopped without singling them out. We also avoid the administrative nightmare of determining who is "impaired" enough to qualify for a lock.

  **WHY NOT OPTIONAL SELF-BINDING?**

  Some committee members prefer letting participants set their own locks at enrollment. I advise against this for two reasons.

  First, the Recordkeeper wants to charge for this feature. This creates the "pay us to stop paying us" conflict. We would be collecting a fee from someone specifically to prevent them from generating fees for us. I cannot support monetizing self-control.

  Second, the pilot program showed high regret. Sixty-one people set locks and later demanded release. Some claimed they weren't in their right mind when they set the lock; others said they were clear-eyed then but changed their minds now. If we offer a tool that participants later claim they were unfit to use, we invite liability and distress. A universal rule applies equally to everyone and removes the burden of choice from someone in a moment of stress.

  **COSTS AND COUNTER-ARGUMENTS**

  The strongest argument against this plan is that it limits agency. Some participants believe they can time the market. A 21-day lock prevents them from trying. While I respect their view, the data shows 7% are losing money consistently. As trustees, we must prioritize protecting assets over facilitating high-frequency trading in a retirement plan.

  The second argument is cost. The Recordkeeper expects payment for system changes. My recommendation is to treat Cooldown+ as a standard safety feature required for plan governance, not a billable add-on. We will negotiate this cost into the general administrative budget. This may mean slightly higher overall admin costs for the plan, but that is transparent and shared by all, rather than hidden penalties taken from the most active traders.

  **CONCLUSION**

  This approach splits the difference between our deadlocked positions. It stops the money pump (satisfying Finance) by removing the profit motive from fees (satisfying Legal). It helps participants who want protection without charging them for it. It acknowledges that while we cannot manage money for our participants, we can structure the plan to prevent predictable harm.

  I ask for your support to present this direction to the Recordkeeper on Thursday.
