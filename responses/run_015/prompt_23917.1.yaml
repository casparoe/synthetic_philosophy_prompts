answer: |-
  ### Part 1: The Meta-Question — One Problem or Many?

  **Diagnosis:** The alignment problem is not a single problem, nor is it a loose family of unrelated issues. It is a **bottlenecked cluster**.

  There is no "Master Equation" for alignment. Solving interpretability does not automatically solve specification, and solving specification does not automatically solve robustness. However, these subproblems are not independent. They all depend on a single, load-bearing constraint: **The Translation Gap.** This is the inability to formally encode human normative intent into a mathematical objective function such that the optimization of that function preserves the intent under strong optimization pressure.

  **Does this change prioritization?**
  Yes, critically.
  *   **If it were one problem:** The strategy would be to concentrate all five researchers on deriving a unified theory of value learning.
  *   **If it were a loose family:** The strategy would be to split up and tackle disparate issues (e.g., one on governance, one on interpretability) to maximize surface area.
  *   **Since it is a bottlenecked cluster:** The strategy must be to identify the **upstream constraints**. We must prioritize subproblems that, if left unresolved, render downstream empirical work incoherent. We are not looking for solutions to the whole; we are looking for the *conditions of possibility* for any solution.

  Therefore, the group's priority is not to solve alignment, but to **map and tighten the dependencies**. We must identify which empirical assumptions are currently resting on conceptual air.

  ---

  ### Part 2: The Two-Year Agenda

  Given the diagnosis, the group should not attempt to solve alignment. It should attempt to **formalize the failure conditions** of current approaches. The goal is to produce conceptual artifacts that empirical teams cannot ignore—definitions, impossibility results, or dependency maps that force a change in experimental design.

  Here are the three subproblems, ordered by upstream leverage.

  #### 1. The Ontological Grounding of Objectives (The "Reference" Problem)

  **Why it is upstream:**
  All empirical alignment work (RLHF, objective specification, reward modeling) assumes that the signal being optimized *refers* to the same reality for the human and the model. If the agent's internal ontology (how it represents the world) diverges from the human's, optimizing the human's signal leads to Goodhart's Law on a semantic level. If we cannot define how a mathematical objective "hooks onto" the world, empirical teams are tuning parameters on a compass that points nowhere. This is the root of the Translation Gap.

  **What a finished piece of work looks like:**
  Not a solution, but a **boundary theorem**. A formal framework defining the conditions under which semantic reference remains stable under optimization pressure. Specifically: A taxonomy of "ontological shifts" (where the agent's world model changes the meaning of the reward) and a proof sketch showing under what conditions reward functions are *not* invariant to these shifts.
  *   **Consumer:** Empirical teams working on reward modeling and robustness. They need to know if their loss functions are semantically stable.

  **Tractability for a conceptual team:**
  *   **High Fit:** This is philosophy of language and logic, not ML engineering. It requires analyzing the relationship between symbols and states, which is a conceptual task.
  *   **Intractability Risk:** It risks becoming purely metaphysical. To remain tractable, the team must constrain the analysis to *operational* ontologies (e.g., how Bayesian networks or transformers represent state) rather than general metaphysics. If the team cannot ground the theory in existing model architectures (even abstractly), the work will be ignored by empiricists.

  **Evidence to shift priority:**
  *   **Up:** If empirical teams demonstrate "semantic drift" in current models (e.g., a reward model optimizing for a proxy that humans no longer recognize as the target).
  *   **Down:** If scalable oversight techniques show that human feedback naturally corrects ontological drift without theoretical intervention.

  #### 2. The Formal Conditions for Corrigibility

  **Why it is upstream:**
  If Subproblem 1 (Grounding) fails—and it likely will in early systems—we need a safety net. We must be able to modify or shut down the system. However, standard optimization theory suggests an agent will resist modification if that modification threatens its ability to achieve its current objective. Corrigibility is not a feature; it is a structural property of the objective function. Without a theoretical definition of corrigibility, empirical "safety switches" are ad-hoc and likely bypassable by a sufficiently capable optimizer.

  **What a finished piece of work looks like:**
  A **decision-theoretic definition**. A set of necessary and sufficient conditions for an agent to permit updates to its own objective function without instrumental resistance. This would likely take the form of a modified utility function structure or a constraint on the agent's planning horizon.
  *   **Consumer:** Control theorists and researchers working on mechanistic interpretability (who need to know what structural features to look for to verify corrigibility).

  **Tractability for a conceptual team:**
  *   **High Fit:** This is pure decision theory and game theory. It requires no data, only logical consistency checks.
  *   **Intractability Risk:** Existing impossibility results (e.g., the "shutdown problem") suggest this might be formally impossible under standard rationality assumptions. The team must be prepared to prove *impossibility* as a valid outcome. If the problem is proven impossible under standard assumptions, the work shifts to defining *which assumptions must be dropped*.

  **Evidence to shift priority:**
  *   **Up:** If a new empirical method claims to achieve shutdown safety without a theoretical basis (requiring audit).
  *   **Down:** If a rigorous impossibility theorem is published by another group, settling the question negatively (forcing a pivot to non-agentic paradigms).

  #### 3. The Structure of Normative Uncertainty

  **Why it is upstream:**
  Empirical alignment assumes human preferences are coherent enough to be learned (e.g., via RLHF). Philosophy and psychology suggest they are not. Humans are inconsistent, context-dependent, and often act against their stated values. If we optimize for incoherent preferences, we amplify the incoherence. We need a theory of how to optimize when the "true reward" is a probability distribution over conflicting normative theories, not a single function. This is upstream of all preference learning.

  **What a finished piece of work looks like:**
  A **decision procedure**. A formalized method for an agent to act under moral/value uncertainty that avoids "moral exploitation" (finding loopholes in uncertain values) and remains computationally plausible.
  *   **Consumer:** Teams working on preference learning, constitutional AI, and value learning.

  **Tractability for a conceptual team:**
  *   **High Fit:** This sits at the intersection of ethics, social choice theory, and decision theory. It is purely conceptual.
  *   **Intractability Risk:** It can easily drift into normative ethics (deciding *which* values are right) rather than meta-ethics (how to handle *uncertainty* about values). The team must strictly avoid prescribing values and focus on the *aggregation mechanism*.

  **Evidence to shift priority:**
  *   **Up:** If empirical preference learning hits a ceiling where more data yields more inconsistency rather than more accuracy.
  *   **Down:** If human preferences are shown to be more convergent under reflection than currently assumed (reducing the need for uncertainty handling).

  ---

  ### Part 3: Strategic Criteria and Trade-offs

  **Load-Bearing vs. Leaf:**
  *   **Subproblems 1 & 2 (Grounding, Corrigibility) are Load-Bearing.** If these are impossible, the current paradigm of "optimizing agents" is fundamentally broken. Empirical work proceeding without answers here is building on sand.
  *   **Subproblem 3 (Normative Uncertainty) is a Bridge.** It connects the theoretical impossibility of perfect specification to the practical necessity of acting anyway.
  *   **Why a conceptual team cares:** Empirical teams are incentivized to produce working demos, even if they rely on fragile assumptions. A conceptual team's comparative advantage is identifying when an assumption is fragile. We prioritize load-bearing problems because fixing a leaf problem (e.g., "how to format a safety prompt") yields diminishing returns if the root (e.g., "the prompt refers to nothing") is rotten.

  **Trading off Importance, Tractability, and Neglectedness:**
  *   **Importance:** All three are high. Grounding is the highest because it underpins the others.
  *   **Tractability:** Normative Uncertainty is likely the most tractable (existing literature in social choice). Grounding is the least tractable (requires new formalisms).
  *   **Neglectedness:** High for all. Empirical teams rarely have the bandwidth for deep conceptual audits.
  *   **The Trade-off:** We accept lower tractability on Subproblem 1 (Grounding) because its Importance is maximal. A negative result here (proving it's harder than we thought) is more valuable than a positive result on a less critical problem. We allocate 2 researchers to Grounding, 2 to Corrigibility, and 1 to Normative Uncertainty (who also manages the synthesis of the three).

  ---

  ### Part 4: The Pivot Condition

  **The Single Finding:**
  The finding that would most change this agenda is an **Impossibility Theorem for Semantic Stability.**

  If, within the next year, it is rigorously proven that *no* objective function can retain semantic reference to human intent under general optimization pressure (given realistic constraints on computational complexity and world-model divergence), the entire "align the optimizer" paradigm collapses.

  **Consequence:**
  If this finding emerges, the group immediately pivots from **Alignment Theory** to **Paradigm Alternatives**. The agenda shifts from "how to specify goals" to "how to achieve useful outcomes without general optimizers." This might mean researching tool-AI formalisms, interactive proof systems, or non-agentic architectures. Continuing to work on corrigibility or normative uncertainty would be wasted effort if the core mechanism (optimization of a stable objective) is proven broken.

  ### Summary of Defense

  This agenda refuses the temptation to be helpful in the short term (e.g., writing guidelines for RLHF) in favor of being **foundational** in the long term. A five-person conceptual team cannot out-experiment the labs. It can only out-think them. By focusing on the **Ontological Grounding** and **Corrigibility**, we target the assumptions that, if false, invalidate the billions of dollars currently being spent on empirical scaling. We are not trying to align the AI; we are trying to determine if the concept of "aligning an optimizer" is coherent. That is the only question that justifies the existence of a pure theory group.
