answer: |-
  **Title:** The Inventory Error: Why Infinite Ethics Requires Abandoning Total Aggregation

  **Introduction**

  The promise of classical aggregative consequentialism is its simplicity: morality is a matter of arithmetic. One sums the welfare of all moral patients, and the action producing the greatest sum is the right action. This framework relies on the assumption that "the good" is a quantity that can be totaled. However, if the universe is infinite in space or time and contains a mix of positive and negative value, this arithmetic breaks down. The total sum of value becomes a conditionally convergent (or divergent) series. By the Riemann Rearrangement Theorem, such a series can be reordered to sum to any real number, or to diverge to positive or negative infinity.

  This creates a catastrophic problem for moral theory. If the total value of the universe depends on the order in which we count beings, then moral verdicts become arbitrary. If the total value is undefined, then no action can change it, leading to moral indifference. In this essay, I argue that the standard attempts to resolve this paradox—mathematical extensions like hyperreal summation, ethical patches like discounting, or domain restrictions—all fail because they attempt to preserve the core intuition of *total* aggregation in a context where it is incoherent. The only defensible solution is to abandon the ambition of total global aggregation in favor of a **Local Difference-Making Framework**. We must accept that while welfare matters, "the total welfare of the universe" is not a well-defined moral category in an infinite context. Morality is not about inventorying the cosmos; it is about leveraging causal influence.

  **The Mathematical Trap: Order and Arbitrariness**

  To understand why the problem is so severe, we must distinguish between divergence and order-dependence. If a series diverges to $+\infty$, one might think the world is infinitely good. But in a mixed-value infinite universe, the series of values $\sum v_i$ is typically conditionally convergent. The Riemann Rearrangement Theorem demonstrates that for any conditionally convergent series, there exists a permutation of indices such that the sum equals any arbitrary value $L$.

  For the aggregative consequentialist, this implies that the moral value of the universe depends on the spatial or temporal ordering of moral patients. If we count beings in a spiral outward from Earth, the universe might sum to $+\infty$. If we count them in a spiral outward from a distant torture chamber, it might sum to $-\infty$. Since there is no metaphysically privileged "counting order" for beings existing simultaneously in space, the total value is indeterminate.

  Proponents of mathematical salvage operations often propose using generalized summation methods, such as Cesàro summation or hyperreal-valued utilities (as discussed by Bostrom and Vallentyne). Hyperreal numbers allow for the comparison of infinite quantities; one infinite sum can be "larger" than another. However, this solution merely displaces the arbitrariness. To assign a hyperreal value to an infinite sequence, one must choose a free ultrafilter—a mathematical object that determines which subsets of indices count as "large." There are infinitely many such ultrafilters, and no ethical justification exists for preferring one over another. Choosing an ultrafilter is ethically equivalent to choosing a counting order: it is an arbitrary parameter that determines moral verdicts without corresponding to any moral fact. Thus, mathematical sophistication does not solve the normative arbitrariness; it merely hides it behind advanced algebra.

  **The Ethical Patch: The Cost of Discounting**

  If mathematical tricks fail to ground the sum, perhaps we can alter the values themselves to force convergence. Temporal or spatial discounting posits that value decreases exponentially with distance or time. This ensures the series converges absolutely, rendering the sum independent of ordering.

  While this solves the mathematical problem, it incurs an unacceptable ethical cost. Discounting violates the principle of impartiality, which is foundational to consequentialism. To say that a unit of suffering matters less simply because it occurs far away or in the distant future is to introduce a morally irrelevant distinction into the calculus. It privileges the "here and now" in a way that looks indistinguishable from bias. Furthermore, discounting is a solution that works only by changing the subject. It does not solve the problem of infinite ethics; it solves the problem of infinite ethics by denying that the infinite future or distant space contains full moral weight. It saves aggregation by sacrificing the very impartiality that made aggregation attractive in the first place.

  **The Domain Restriction and the Local Turn**

  The third strategy is to restrict the domain of moral concern. This approach suggests that agents should not evaluate the total state of the universe, but rather the difference they make within a finite, causally connected region. This is often framed as "spatiotemporal parsimony" or a focus on "local difference-making."

  Critics argue that this abandons consequentialism. If the background universe contains infinite suffering, does my local act of kindness matter? If the total sum is already infinite negative, adding a finite positive seems to leave the total unchanged ($\infty + 1 = \infty$). This is the "nullification" objection.

  However, this objection relies on the very assumption we should reject: that moral obligation is tied to changing the *global total*. If we accept that the global total is ill-defined (due to the Riemann problem), then the fact that an action fails to change it is not a failure of the action, but a failure of the metric. A Local Difference-Making Framework reframes the consequentialist imperative. The right action is not the one that maximizes the *sum of the universe*, but the one that maximizes the *sum of the causal consequences of the agent*.

  This approach effectively treats the infinite background as a constant. In calculus, when optimizing a function $f(x) + C$, the constant $C$ drops out of the derivative. In infinite ethics, the infinite background acts as a constant (or rather, an undefined term) that is invariant to finite human action. Therefore, moral comparison should proceed by comparing the *finite differences* agents effect. World $A$ is better than World $B$ relative to an agent if the finite region influenced by the agent contains more value in $A$ than in $B$, regardless of the infinite background.

  **The Trade-off: Losing the View from Nowhere**

  Adopting a Local Difference-Making Framework requires owning a significant cost: we must abandon the "God's eye view." We can no longer claim to know whether one possible universe is intrinsically better than another if they differ only in their infinite tails. We lose the ability to make totalizing judgments about the cosmos. For some, this feels like a retreat from the ambition of ethics. If consequentialism is the view that "the state of the world matters," does restricting ourselves to local differences betray that view?

  I argue that it does not. It merely corrects a category error. The intuition that "the total amount of welfare matters" is derived from finite contexts where totals are well-defined. Extending this intuition to infinite contexts assumes that "total welfare" remains a coherent property. The Riemann Rearrangement Theorem proves it is not. To insist on total aggregation in an infinite universe is to insist on using a ruler to measure weight.

  By shifting to a Local Difference-Making Framework, we preserve the core consequentialist insight—that outcomes matter and that we should strive to produce better ones—without committing to a metaphysical fiction. We acknowledge that our moral obligations are indexed to our causal capacities. This avoids the paralysis of infinite ethics (where no action changes the total) and the arbitrariness of summation methods (where verdicts depend on counting order).

  **Conclusion**

  The divergent series problem is not a technical glitch to be patched; it is a sign that the underlying model of value is incompatible with the structure of reality. The strategies of hyperreal summation and discounting attempt to force the infinite into a finite mold, resulting in arbitrariness or bias. The only coherent path forward is to recognize that aggregative consequentialism must be decoupled from totalization.

  We must choose between keeping aggregation and keeping the possibility of an infinite universe. I defend the latter. We should accept that the universe may be infinite and that value is distributed within it, but we must reject the notion that these values sum to a single moral magnitude that agents are responsible for maximizing. Instead, we must adopt a Local Difference-Making Framework. This view accepts that we cannot fix the universe, but we can fix our corner of it. It is better to have a coherent theory of obligation that applies to the world as it likely is (infinite) than a grand theory of value that collapses into incoherence. Morality is not about the sum of everything; it is about the difference we make.
