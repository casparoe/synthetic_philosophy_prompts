answer: |-
  Here is a 50-minute seminar plan designed to move students from binary intuition to graded accuracy without relying on decision-theoretic machinery.

  ### 1. The Foundational Move (Minutes 0–10)
  **Goal:** Establish why a new metric is needed before you write down a single formula.
  **The Dependency:** You cannot introduce an accuracy measure until you have dismantled the **Binary Success Condition**.

  *   **The Hook:** Ask them to evaluate two students taking a True/False quiz. Student A answers "True" to everything and gets 50%. Student B answers "True" to everything with 51% confidence and gets 50%. In binary logic, they performed identically. In epistemology, we intuitively feel Student B is *less* dogmatic and thus epistemically preferable, or that a student who says "99% True" and is right is *better* than one who says "51% True" and is right.
  *   **The Problem:** If we assess credences by "hits" (True/False), then 0.51 and 0.99 are identical successes when the proposition is True. This collapses the nuance of degrees of belief.
  *   **The Requirement:** You must establish that **truth is the goal, but closeness to truth is the metric.** Before introducing a scoring rule, you must secure their agreement that being *more confident in a truth* is epistemically better than being *less confident in a truth*, and being *less confident in a falsehood* is better than being *more confident in a falsehood*.
  *   **Pre-emption:** If you skip this, the Brier score will look like an arbitrary tax on confidence. Frame it as: "We need a ruler that measures distance from the truth value (1 or 0), not just a counter that ticks on matches."

  ### 2. The Worked Example (Minutes 10–25)
  **Goal:** Demonstrate the mechanics of a scoring rule without invoking money.
  **The Example:** **The Single-Day Forecaster.**
  *   **Why Weather:** It is the standard intuition pump for probability.
  *   **Why Single-Day (not Season):** A season invites frequentist confusion ("I said 70% ten times and it rained seven times, so I'm accurate"). You want to assess the *credence itself* relative to the *actual truth value* of a single proposition.
  *   **The Setup:**
      *   Proposition $P$: "It rains tomorrow."
      *   Truth Value $V$: 1 (Rain) or 0 (No Rain).
      *   Credence $c$: The forecaster's number (0 to 1).
      *   **The Measure:** Introduce the **Brier Score** simply as "Squared Error": $(c - V)^2$. Tell them lower is better (it's a "loss" function).
  *   **The Walkthrough:**
      1.  **Case A (Rain):** $V=1$. Forecaster X says 0.9. Forecaster Y says 0.6.
          *   X Score: $(0.9 - 1)^2 = 0.01$.
          *   Y Score: $(0.6 - 1)^2 = 0.16$.
          *   *Lesson:* Higher confidence in truth is more accurate.
      2.  **Case B (No Rain):** $V=0$. Forecaster X says 0.9. Forecaster Y says 0.6.
          *   X Score: $(0.9 - 0)^2 = 0.81$.
          *   Y Score: $(0.6 - 0)^2 = 0.36$.
          *   *Lesson:* Higher confidence in falsehood is *more* inaccurate (penalized heavily).
  *   **What to Avoid:** Do not mention "calibration" over a season. Do not mention "reliability." Do not mention payouts. If you mention payouts, you lose the epistemic/prudential distinction before you've made it. Stick strictly to the mathematical distance between the number they held and the number 1 or 0.

  ### 3. Predictable Misconceptions & Pre-emption (Minutes 25–35)
  **Goal:** Stop the students from collapsing the framework into decision theory or skepticism.

  *   **Misconception 1: "This is just betting."**
      *   *Where:* Immediately after introducing the score.
      *   *Pre-emption:* Explicitly state: "There is no bookmaker. There is no wallet. If the forecaster dies immediately after the prediction, the score still exists. This is a measure of cognitive fit, not financial gain."
  *   **Misconception 2: "Accuracy permits being certain of everything."**
      *   *Where:* When discussing the penalty for error (Case B above).
      *   *Pre-emption:* Point to the 0.81 score. "If you assign 1.0 to everything, you guarantee a perfect score on truths but a maximum penalty (1.0) on every falsehood. Accuracy rewards confidence *only* when paired with truth. Blind certainty is high-risk, high-penalty."
  *   **Misconception 3: "The framework is arbitrary because I could choose a different formula."**
      *   *Where:* When students ask "Why squared error? Why not absolute error?"
      *   *Pre-emption:* Acknowledge the family of **Proper Scoring Rules**. "You are right that we could use other formulas (like Log Score). But we only care about rules that are *proper*—meaning the only way to minimize your expected score is to report your true credence. The specific formula matters less than the structural feature that it rewards honesty."

  ### 4. The Prudential/Epistemic Distinction (Minutes 35–45)
  **Goal:** Defend the "accuracy alone" claim against pragmatic counterexamples.
  **The Challenge:** A student will ask: "But what if a gambler offers me odds that make it profitable to be overconfident? Shouldn't I be overconfident then?"

  *   **The Handling:**
      1.  **Concede the Prudential:** "Yes, if your goal is money, you should take the bet. You might even adopt a credence you know is false to psych yourself up."
      2.  **Isolate the Epistemic:** "But did that make your belief *accurate*? No. It made you *rich*. Accuracy-first epistemology claims there is a distinctively *epistemic* value separate from *pragmatic* value."
      3.  **The Analogy:** Use a **Health vs. Sport** analogy. "Eating 5,000 calories might help you win a sumo match (pragmatic success), but it makes you unhealthy (physiological failure). Similarly, overconfidence might win a bet (pragmatic success), but it increases your inaccuracy score (epistemic failure). We are studying the health of the belief, not the wealth of the believer."

  ### 5. Exclusions & Diagnostic (Minutes 45–50)
  **Goal:** Manage scope and test understanding.

  *   **What to Decline:**
      *   **Dutch Books:** Explicitly say, "We are not doing Dutch Book arguments today. Those show why you shouldn't lose money; we are showing why you shouldn't be inaccurate."
      *   **Proofs:** "We will not prove why Brier scores are proper; we take that as a given feature of the tool."
      *   **Global Accuracy:** "We are looking at single propositions. Aggregating this over a whole belief system is a problem for next year."

  *   **The Diagnostic Question:**
      Pose this scenario in the last five minutes:
      > "Imagine a fair coin is about to be flipped.
      > **Agent A** assigns credence 0.5 to Heads.
      > **Agent B** assigns credence 1.0 to Heads.
      > The coin lands **Heads**.
      >
      > Agent B got a 'hit' (binary success) and Agent A did not. Agent B also has a better *actual* Brier score for this specific toss.
      > **Why does accuracy-first epistemology still claim Agent A was epistemically preferable to Agent B?**"

      *   **The Answer You Want:** "Because Agent A minimized *expected* inaccuracy across possible worlds. Agent B risked maximum error (a score of 1.0) if Tails had landed, whereas Agent A guaranteed a moderate score (0.25) regardless of the outcome. Rationality is about maximizing expected accuracy, not gambling on actual accuracy."
      *   **What this Tests:** It confirms they understand that the *normative force* of accuracy comes from the expectation over worlds (the risk profile), not merely the "count of hits" in the actual world. If they say "Agent B was better because they were right," they have missed the core philosophical move.
