answer: |-
  This is an exceptionally sharp set of observations. You have independently rediscovered several core problems in the philosophy of language and metaphysics, specifically the tension between **descriptive semantics** (how we use words) and **conceptual engineering** (how we *should* use words to achieve goals).

  Below is the map you requested. I have structured it to answer your four questions directly, followed by a mandatory section on what is settled consensus versus live philosophical controversy, as you requested.

  ### 1. The Conceptual Space

  You are asking for the topology of three distinct layers of disagreement. Here is the standard mapping used in analytic philosophy, along with the terms you mentioned.

  *   **Factual Disagreement (Object-Level):** Both parties agree on the meaning of the terms and the rules of inference, but disagree on the state of the world.
      *   *Example:* "The latency is >500ms" vs. "The latency is <500ms."
      *   *Resolution:* Measurement.
  *   **Semantic Disagreement (Descriptive):** Parties disagree on how a term is *currently* used within a specific linguistic community.
      *   *Example:* "Does 'down' include high latency in our SLO docs?"
      *   *Resolution:* Reference to authority (docs, code, common usage). This is what Case 1 turned out to be.
  *   **Metalinguistic Negotiation (Normative):** Parties agree on the facts and acknowledge the current usage is ambiguous or contested, but disagree on which concept *ought* to be associated with the word for future purposes.
      *   *Example:* "Given our new reliability goals, *should* 'down' include high latency?"
      *   *Resolution:* Policy decision, cost-benefit analysis.

  **On the terminology you mentioned:**
  *   **"Metalinguistic Negotiation":** You are **not** abusing this term. It was popularized recently (e.g., by philosophers David Plunkett and Tim Sundell) to describe exactly Case 2 and 3. It captures the idea that you are negotiating *which concepts to deploy*, not just what the world is like.
  *   **"Quantifier Variance":** You are likely **misapplying** this term, though it is adjacent. Quantifier variance (associated with Eli Hirsch and Hilary Putnam) is a metaphysical thesis about *existence*. It asks whether "there exists an object" means different things in different conceptual schemes (e.g., does a "table" exist, or just particles arranged table-wise?). While Case 2 ("Is it the same service?") touches on identity over time (Ship of Theseus), your problem is pragmatic (runbooks, on-call), not metaphysical. Stick with "Metalinguistic Negotiation" or "Conceptual Engineering."

  ### 2. Case Analysis

  Here is where your cases fall on the map, and why Case 2 is not a contradiction.

  *   **Case 1 (Outage Duration):** **Purely Semantic/Ambiguity.**
      *   *Analysis:* Once the definitions were explicitated, the disagreement vanished. There was no residual normative conflict. This is the "tidy" version of a verbal dispute.
  *   **Case 2 (Service Identity):** **Metalinguistic Negotiation.**
      *   *Analysis:* Everyone agrees on the hardware history (facts). The disagreement is about which *concept* of "service" is more useful for the organization.
      *   *Why it is "Verbal":* No amount of looking at the servers will answer "Is it the same service?" because "same service" is a category we impose on the servers, not a property of the servers themselves.
      *   *Why it is Worth Settling:* Concepts have downstream costs. If we call it the "same" service, we inherit technical debt and runbooks. If "new," we reset baselines. The dispute is verbal in origin but **substantive in consequence**. This is not a contradiction; it shows that "verbal" does not mean "trivial."
  *   **Case 3 (Staging Environment):** **Hybrid (Empirical + Normative).**
      *   *Analysis:* This depends on facts (does the cluster catch bugs?) *and* norms (is catching *those* bugs the definition of staging?). If the cluster catches 90% of bugs, is it staging? That depends on whether "staging" means "perfect mirror" or "safety gate." This is a negotiation about where to draw the boundary of a concept based on empirical performance.

  ### 3. The Colleague's Test (Downstream-Invariance)

  Your colleague's proposal is a **Pragmatist** criterion. It closely resembles the verificationist principle (meaning is determined by use/consequences) but applied to disputes.

  *   **Is it a real alternative?** Yes. It shifts the focus from "What is the true meaning?" to "Does the meaning difference matter?"
  *   **Does it collapse?** It collapses the distinction between "verbal" and "factual" into "actionable" vs. "non-actionable."
  *   **Relativity to Stakes:** You are correct that the test makes "verbalness" relative to context.
      *   *Scenario:* In Case 2, if you have no plan to change runbooks, the dispute is verbal (invariant). If you plan to rewrite the incident response tooling next sprint, the dispute becomes factual/actionable (variant).
      *   *Bug or Feature?* In an engineering context, this is a **feature**. Philosophy often seeks context-independent truths; engineering seeks context-sensitive utility. A dispute that is "merely verbal" today may become "critical" tomorrow if the stakes change.
      *   *Choice of Stakes:* There is **no non-arbitrary choice** of "all possible decisions." That set is infinite. The only non-arbitrary set is "decisions currently on the roadmap" or "decisions within the scope of this system's design." You must bound the stakes by the scope of your project.

  ### 4. The Nature of "Verbal"

  This is the deepest question. There are three competing accounts.

  **Account A: Property of the Dispute (Realism)**
  *   *View:* The dispute *is* verbal, regardless of context.
  *   *Prediction for Case 2:* It is verbal. Engineers should stop arguing and pick a definition arbitrarily.
  *   *Risk:* Dismisses the substantive policy implications of the definition.

  **Account B: Property of Dispute + Context (Pragmatism)**
  *   *View:* The dispute is verbal *relative to current goals*.
  *   *Prediction for Case 2:* It is verbal *unless* a policy decision depends on it. If a policy decision depends on it, it transforms into a policy dispute.
  *   *Risk:* Requires constant re-evaluation of context.

  **Account C: Speech Act (Conversational Dynamics)**
  *   *View:* Saying "that's just verbal" is not a description; it is a move to **change the topic** from "truth" to "utility." It discharges the obligation to find a fact and creates an obligation to negotiate a standard.
  *   *Prediction for Case 2:* When someone says "It's just verbal," they are trying to move the team from "investigating history" to "deciding policy."
  *   *Differentiating Case:* Imagine a team arguing about whether a specific microservice is "critical."
      *   *If Account A is true:* Calling it verbal should end the argument.
      *   *If Account C is true:* Calling it verbal should *shift* the argument to "Why do we need to know if it's critical?" (e.g., for paging priority).
      *   *Test:* If calling it "verbal" shuts down useful policy discussion, Account C is the correct warning. It reveals that the speaker is using "verbal" to avoid making a hard decision.

  **Recommendation:** In an engineering organization, **Account C** is the most useful. Treat "This is a verbal dispute" as a signal to stop looking for evidence and start looking for *consequences*.

  ***

  ### 5. Settled Consensus vs. Live Controversy

  You asked for explicit demarcation. This is critical because philosophy does not offer the same kind of "settled science" as engineering.

  **Settled / Broad Consensus (Safe to rely on):**
  1.  **Ambiguity causes friction:** Disagreements caused by undefined terms (Case 1) are resolvable by definition.
  2.  **Concepts have utility:** How you define terms affects system design, on-call burden, and metrics (Case 2).
  3.  **Pragmatic criterion:** If two definitions lead to identical actions and predictions in a given context, the choice between them is not factual. (This is the core of your colleague's test and is widely accepted in pragmatist traditions).

  **Live Controversy / Contested (Do not treat as fact):**
  1.  **The Analytic/Synthetic Distinction:** W.V.O. Quine famously argued that there is **no sharp line** between "truths by meaning" (verbal) and "truths by fact" (factual). Many philosophers agree with Quine. If he is right, the distinction you are trying to map is a spectrum, not a binary.
      *   *Implication for you:* Do not assume you can perfectly separate word-disputes from world-disputes. Treat the distinction as a heuristic, not a metaphysical law.
  2.  **Metalinguistic Negotiation Status:** While the term is popular, there is debate over whether these negotiations are truly distinct from factual disagreements about *utility*. (i.e., Is "What is a service?" just shorthand for "Which definition yields better uptime?")
  3.  **Quantifier Variance:** This is highly controversial metaphysics. Do not use this concept in design docs; it implies a level of ontological uncertainty that will confuse stakeholders.

  **Contested Assumptions in Your Framing:**
  *   **Assumption:** "Verbal disputes are idle."
      *   *Correction:* As Case 2 shows, they are often high-stakes policy negotiations in disguise.
  *   **Assumption:** "There is a correct definition waiting to be found."
      *   *Correction:* In cases like "Service Identity" or "Staging," there is often no pre-existing truth. The team must *stipulate* a truth for the sake of the system. This is **Conceptual Engineering**, not discovery.

  ### Summary Advice for Work

  1.  **Use the "Downstream-Invariance Test"** but bound it by your current sprint or quarter's goals. If the definition doesn't change a decision *we are actually making*, flag it as "Definition Needed" and move on.
  2.  **Reframe Case 2:** When the team argues about "Is it the same service?", intervene and say: "We agree on the facts. We are negotiating a policy. Which definition minimizes on-call toil?" This moves the dispute from *semantic* to *normative*.
  3.  **Beware the "Just Verbal" Dismissal:** If someone says "Oh, that's just verbal," check if they are trying to avoid a hard policy decision (Account C). In Case 2, the "verbal" dispute is the most important one to settle.
  4.  **Documentation:** In incident write-ups, explicitly distinguish between **Ambiguity** (Case 1: fix the glossary) and **Policy Gaps** (Case 2: fix the runbook/charter).

  You are operating in the territory of **Conceptual Engineering**. You are not just describing the system; you are designing the vocabulary that the organization uses to interact with the system. That is substantive engineering work, not mere semantics.
