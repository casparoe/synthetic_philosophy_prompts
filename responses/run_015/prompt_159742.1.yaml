      5. Provenance-or-warrant
      6. Indifference-to-truth
      7. Self-report
      8. Principal-relative
      9. Counterfactual-robustness
      10. Deflationary

      I need to make sure the tree distinguishes Intention vs Recklessness clearly.
      Case: "False statement to stop harm".
