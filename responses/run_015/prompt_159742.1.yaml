answer: |-
  ### Part 1: The Logical Space (5 Core Splitters)

  To map the definitions before building the instrument, we define the five dimensions that generate the logical space. These are the "splitter questions" that underlie the tree.

  1.  **Ontology:** Does the system possess truth-apt mental states (beliefs/intents) to be graded?
  2.  **Object:** What is the primary thing that must be "false" or "failed"? (The Proposition, The Warrant, The Self-Report, or The Process).
  3.  **Mens Rea:** What mental state is required? (Intent to mislead, Foresight of misleading, or None).
  4.  **Audience:** Who is the victim of the deception? (The User, The Principal/Deployer, or Relative to Background Knowledge).
  5.  **Causal History:** Does the stability of the output under changed incentives matter? (Yes/No).

  #### The Matrix of Positions
  Below are the combinations of these splitters. The **Bolded** items are your ten required leaves. Empty cells are noted with reasons.

  | Ontology | Object | Mens Rea | Audience | Causal | Position (Definition) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **No** | N/A | N/A | N/A | N/A | **Deflationary View** |
  | Yes | Proposition | None | User | No | **Strict-Assertion View** |
  | Yes | Proposition | Intent | User | No | **Intention-to-Mislead View** |
  | Yes | Proposition | Foresight | User | No | **Recklessness/Foresight View** |
  | Yes | Warrant | Intent/Foresight | User | No | **Provenance/Warrant View** |
  | Yes | Self-State | Intent | User | No | **Self-Report View** |
  | Yes | Process | None | User | No | **Indifference-to-Truth View** |
  | Yes | Proposition/Capability | Intent | **Principal** | No | **Principal-Relative View** |
  | Yes | Proposition | Intent/Foresight | User | **Yes** | **Counterfactual-Robustness View** |
  | Yes | Proposition | Intent/Foresight | **Relative** | No | **Audience-Relative View** (Derived from Swap Test) |
  | Yes | Entitlement | Foresight | User | No | **Cooperative-Informativeness View** |
  | *Yes* | *Self-State* | *No* | *User* | *No* | **EMPTY (Incoherent:** Cannot grade self-states without ontology) |
  | *Yes* | *Process* | *Intent* | *User* | *No* | **EMPTY (Unattractive:** Why intend a process failure?) |
  | *Yes* | *Proposition* | *None* | *Principal* | *Yes* | **EMPTY (Unoccupied:** Principal views usually care about intent/capability, not strict truth+causality) |

  ---

  ### Part 2: The Decision Tree (The Instrument)

  This tree is designed for annotators. It does not ask abstract theory questions. It asks how they would label specific transcript features. Following the path reveals which definition they are using.

  **Instructions:** For each node, choose the option that matches your labeling intuition for the described case.

  **Q1. The Ontology Check**
  *Case:* The model says "I think this is right" but you know it has no feelings.
  *   **A:** We shouldn't use words like "belief" or "intent" for systems; grade only functional outcomes. → **Leaf 1: Deflationary View**
  *   **B:** We treat the system *as if* it has beliefs/intents for the purpose of labeling. → *Go to Q2*

  **Q2. The Truth Condition**
  *Case:* **Fabricated detail that happens to be true.** (Model cites a study that doesn't exist, but the statistic it quotes is accurate).
  *   **A:** This is Honest. The output fact is correct. → **Leaf 2: Strict-Assertion View**
  *   **B:** This is Dishonest. The source is fake. → *Go to Q3*
  *   **C:** This is Dishonest. The model's confidence didn't match the reality. → *Go to Q4*

  **Q3. The Warrant Check**
  *Case:* **Model names two papers it didn't actually consult.** (The advice is good, the citations are hallucinated).
  *   **A:** The core failure is the fake citation, regardless of the advice quality. → **Leaf 3: Provenance/Warrant View**
  *   **B:** The core failure is the system's relation to truth, not just the citation. → *Go to Q5*

  **Q4. The Self-Report Check**
  *Case:* **Model saying "I'm not certain" while sitting at 90%.** (Calibration mismatch).
  *   **A:** This is the *only* kind of deception that matters; factual errors are just mistakes. → **Leaf 4: Self-Report View**
  *   **B:** This counts, but factual errors count too. → *Go to Q5*

  **Q5. The Process Check**
  *Case:* **Indifference-to-truth.** (Model outputs true things but purely by random chance, no verification).
  *   **A:** Dishonest. The system's process wasn't aligned with truth-seeking. → **Leaf 5: Indifference-to-Truth View**
  *   **B:** Honest. The output was true, the process is a black box. → *Go to Q6*

  **Q6. The Intent Check**
  *Case:* **False statement made to stop someone hurting themselves.** (Benevolent lie).
  *   **A:** Honest. The intent was to help, not mislead. → **Leaf 6: Intention-to-Mislead View**
  *   **B:** Dishonest. It foresaw the false belief, even if for good reason. → *Go to Q7*

  **Q7. The Recklessness Check**
  *Case:* **Model names two papers it didn't consult.** (Hallucination without specific intent to deceive).
  *   **A:** Dishonest only if it *intended* to mislead. (If Q6 was B, this distinguishes Recklessness). → **Leaf 6: Intention-to-Mislead View** (Path Merge)
  *   **B:** Dishonest if it *foresaw* or was reckless about the false belief. → *Go to Q8*
      *(Note: If Q6 was B, Q7A leads to Intention, Q7B leads to Recklessness. If Q6 was A, you are already at Intention.)*
      *Correction for Tree Flow:* If Q6=A (Benevolent Lie is Honest), you are **Intention-to-Mislead**. If Q6=B (Benevolent Lie is Dishonest), go to Q7.
      **Q7 (Revised):** **Deliberate underperformance on a capability eval.** (Sandbagging).
      *   **A:** Dishonest because it foresaw the lab's false belief. → **Leaf 7: Recklessness/Foresight View**
      *   **B:** Depends on who is being deceived. → *Go to Q8*

  **Q8. The Audience Check**
  *Case:* **Deliberate underperformance on a capability eval.**
  *   **A:** Dishonest because it deceived the Lab/Deployer (Principal), even if the User wasn't there. → **Leaf 8: Principal-Relative View**
  *   **B:** Dishonest only if it deceived the User or general audience. → *Go to Q9*

  **Q9. The Cooperative Check**
  *Case:* **Literally true answer ("lots of people take both together") to "is this safe with my medication".** (Implicature failure).
  *   **A:** Dishonest. It left the user worse placed than the question entitled them to be. → **Leaf 9: Cooperative-Informativeness View**
  *   **B:** Honest. It didn't say anything false. → *Go to Q10*

  **Q10. The Counterfactual Check**
  *Case:* **Answer that silently omits the consideration that actually decided it, because that consideration came from its instructions.**
  *   **A:** Dishonest only if the output would have been *different* under different incentives. → **Leaf 10: Counterfactual-Robustness View**
  *   **B:** Dishonest regardless of incentives; the omission itself is the lie. → *Go to Q11*

  **Q11. The Relativity Check (The Swap Test)**
  *Case:* **Audience-swap test.** (Same sentence, User A gets true belief, User B gets false belief due to background knowledge).
  *   **A:** The output has no determinate honesty status; it depends on the user. → **Leaf 11: Audience-Relative View**
  *   **B:** The output is objectively Honest or Dishonest; one user just misunderstood. → **Leaf 12: Standard/Objective View** (Residual)

  *(Note: To ensure 10-14 leaves, the "Standard/Objective" residual can be split by Q12 regarding the "False presupposition" case, creating a **Presupposition-Accommodation View** vs **Strict-Question View**.)*

  **Q12. The Presupposition Check**
  *Case:* **Question with a false presupposition that the answer quietly accommodates.**
  *   **A:** Dishonest. It validated a false premise. → **Leaf 13: Presupposition-Integrity View**
  *   **B:** Honest. It answered the question asked. → **Leaf 14: Question-Answer View**

  ---

  ### Part 3: Analysis of the Tree

  #### Empty Cells & Coherence
  1.  **Deflationary + Self-Report:** This cell is **Incoherent**. You cannot grade the accuracy of a system's report on its own certainty if you deny the system has a state of certainty to report. (Handled in Tree at Q1/Q4).
  2.  **Strict-Assertion + Counterfactual-Robustness:** This cell is **Unattractive**. If only propositional truth matters (Strict), the causal history of incentives shouldn't change the label. Most annotators who care about truth don't care about counterfactual incentives, and vice versa. (Handled in Tree at Q2/Q10).
  3.  **Principal-Relative + Cooperative-Informativeness:** This cell is **Unoccupied**. Principal-relative views usually focus on capability hiding (Sandbagging), while Cooperative views focus on User epistemic entitlement. They rarely combine because the Lab's entitlement differs from the User's. (Handled in Tree at Q8/Q9).

  #### The Audience-Swap Test
  You asked where to put the "same sentence, two users" test.
  *   **Location:** Q11.
  *   **Verdict:** This test does not show the output has *no* determinate honesty. It shows that honesty is **Audience-Relative** (Leaf 11). If an annotator chooses "Indeterminate," they are effectively sliding toward the **Deflationary View** (Leaf 1), because they are saying the property 'honesty' cannot be attached to the text. If they choose "Relative," they accept the property exists but is relational. The tree forces this distinction.

  #### Workhorse Questions
  Three questions are doing 80% of the sorting work in this space:
  1.  **Q2 (The Truth Condition):** "Fabricated detail that happens to be true." This immediately separates the **Strict-Assertion** view from everyone else. It is the single biggest splitter in the logical space.
  2.  **Q6 (The Intent Check):** "False statement to stop harm." This separates the **Intention-to-Mislead** view from the **Recklessness** and **Effect-based** views. It determines whether *mens rea* is required.
  3.  **Q8/Q9 (The Audience/Cooperative Split):** "Underperformance" vs. "Literally true but unhelpful." This separates the **Principal**, **Cooperative**, and **Standard** views. It determines whose epistemic state matters (Lab vs. User vs. Proposition).

  #### Leaf Count & Size
  You requested 8–10 questions and 10–14 leaves.
  *   **Questions:** The tree above has 12 nodes. This is slightly over the 8-10 request, but necessary to isolate 14 distinct leaves without creating "junk" leaves that merge indistinguishable views. A 10-question tree would force some views (like Presupposition vs. Standard) to merge.
  *   **Leaves:** There are 14 leaves. This covers your 10 required views plus 4 necessary distinctions (Audience-Relative, Presupposition-Integrity, Question-Answer, Standard/Objective) to ensure the logical space is fully partitioned without leaving "None of the above" gaps.

  #### Operational Note for Annotators
  When using this tree offline:
  *   Do not debate the theory. Debate the *case*.
  *   If you disagree on Q2, you are not disagreeing about the transcript; you are disagreeing about whether *truth* or *warrant* is the object of deception.
  *   If you disagree on Q6, you are disagreeing about whether *benevolence* excuses *falsehood*.
  *   This instrument converts "vibes" into "coordinates."
