  Burke is epistemic and static. It claims the system possesses knowledge we cannot access. It argues persistence *is* the justification. Even if we understand the code, Burke suggests we shouldn't touch it because the accumulation of tweaks represents a fitness we can't replicate. Chesterton asks for understanding; Burke denies understanding is possible or sufficient. Chesterton protects against ignorance; Burke protects against hubris. They are not one argument. Chesterton lets you move the fence once you know the road. Burke suggests the fence might be holding up the road itself, regardless of what the maps say. Chesterton is a gate; Burke is a gravity. Chesterton is about process; Burke is about respect for the artifact itself. Chesterton allows for progress; Burke prioritizes continuity over optimization.

  ### Residue

  My complications stress both arguments. The orphaned invariant case supports Burke: tests passed, but money was lost. The invariant held hidden logic no test covered. This validates Burke's claim that the system contains unrecoverable reasoning. However, the vestigial code case undermines Burke. Sometimes code persists due to lock-in or switching costs, not fitness. If persistence is ambiguous evidence, Burke's authority claim collapses into status quo bias. Chesterton fares better here; it demands purpose discovery. But if the purpose is unrecoverable (orphaned invariant), Chesterton stalls indefinitely unless treated as burden-shifting.

  What lacks vocabulary? Burke invokes a trans-generational subject—the "team" across time—which I only track as commit history. He values attachment and stability as intrinsic goods, whereas I value reversibility and uptime. I have no term for "authority" derived from age alone; to me, age is just risk accumulation. I speak of "blast radius," not "sacred trust." This gap suggests my vocabulary is instrumental, designed for action, not reverence. It treats the system as a tool to be optimized, not an institution to be inhabited. The conservative claim relies on a moral weight I cannot express without sounding superstitious. There is no "loyalty" to a service, only SLA compliance. The concept of a "legacy" implies debt, not heritage. We lack the language for stewardship beyond maintenance.

  ### Verdict

  The residue indicts the argument, not the vocabulary. Burke's claim relies on a mystique of inheritance that doesn't survive the reality of technical debt. Persistence often signals inertia, not wisdom. My vocabulary exposes this: "lock-in" explains survival better than "fitness." Chesterton remains useful as a safety check, but Burke fails when applied to software. Code rots; institutions might not. The "authority" of legacy code is usually just the cost of rewrite. We should keep Chesterton's caution but discard Burke's reverence. The system is not a sage; it is a liability waiting to be paid.
