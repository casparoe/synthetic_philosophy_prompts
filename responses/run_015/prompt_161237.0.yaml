  2. Making isolation contingent undermines the necessity required for counterfactual analysis, as the structure of modal space becomes an empirical variable rather than a fixed metaphysical framework. This is fatal to the reductive payoff, since you can no longer ground necessary truths in the invariant structure of world-space.

  3. Empirical evidence of cross-world causation, such as interacting-many-worlds QM, is fatal to ICS specifically, whereas an orthodox Lewisian would dismiss such findings as misdescribed intra-world interactions. You must concede this vulnerability to maintain your falsifiability claim, accepting that physics can overturn metaphysics.

  4. If causal connection merges worlds, you must abandon Lewis's strict counterpart theory during interaction phases, allowing transworld identity that breaks the logical architecture of your system. A Lewisian would concede this leads to absurdity, preferring to define worlds such that interaction is impossible by definition.

  5. The package is not well insulated because sacrificing necessary isolation renders the view cosmologically interesting but metaphysically idle for grounding modality. This is a structural problem for any view claiming to analyze modality, as contingent isolation cannot support the necessity of logical truth across worlds.
