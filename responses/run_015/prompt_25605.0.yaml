answer: |-
  Your hypothesis is remarkably astute and aligns with a growing sentiment among legal philosophers who have grown weary of the traditional stalemate. You are correct to sense that the debate is not merely a conflict over empirical claims or logical deductions, but rather a clash of normative frameworks that operate with different criteria for what counts as a successful justification. When a retributivist insists on desert, they are invoking a deontological constraint that views the offender as a moral agent owed a certain respect, even in punishment. When a consequentialist insists on social benefit, they are invoking a teleological standard that views punishment as a tool of statecraft. The impasse persists because each side treats the other's primary value as either invisible or secondary. The retributivist sees the consequentialist's focus on outcomes as potentially sacrificing justice for efficiency, while the consequentialist sees the retributivist's focus on desert as fetishizing suffering. This suggests that the disagreement is indeed structural, rooted in divergent conceptions of moral reasoning itself rather than a specific dispute about penal policy.

  However, to say they are simply answering different questions might understate the depth of the incompatibility. It is not just that one asks about the past and the other about the future; it is that they disagree on the source of normative authority. For the retributivist, the justification is internal to the relationship between the offender and the community. The wrong creates a debt or a imbalance that punishment rectifies, regardless of external consequences. For the consequentialist, the justification is external, located in the state's duty to maximize welfare or security. This is why the sophisticated versions you mention often talk past each other. When retributivists shift to communicative theories, arguing that punishment conveys censure, consequentialists simply ask why this specific mode of communication is necessary or efficient. When consequentialists adopt side-constraints against punishing the innocent, retributivists ask why those constraints exist if not out of a recognition of desert. The language of one framework is constantly being translated into the other, losing its essential meaning in the process.

  Regarding your question about hidden empirical issues, such as free will, it is unlikely that resolving them would dissolve the disagreement. While retributivism often relies on a robust notion of moral responsibility, even if we secured a metaphysical account of free will that satisfied everyone, the consequentialist could still argue that inflicting suffering based on that status is unjustified unless it produces good outcomes. Conversely, even if determinism were proven true, a retributivist might argue that the practice of holding each other responsible is a constitutive part of human social life that cannot be abandoned without losing our humanity. Thus, the dispute is not primarily metaphysical but axiological. It is a disagreement about which values are fundamental and which are derivative. The retributivist privileges justice and moral balance, while the consequentialist privileges welfare and security. Since there is no neutral metric to weigh justice against welfare without already privileging one over the other, the debate remains stuck at the level of first principles.

  This diagnosis suggests that the kind of progress we should expect is not a victory for one side but a clarification of the trade-offs involved. The most fruitful development in recent decades has been the move toward pluralism or mixed theories, though these are often criticized as unstable compromises. H.L.A. Hart famously attempted to split the difference by assigning consequentialism to the general justifying aim of punishment and retributivism to the distribution of punishment. Yet, as you noted, this often feels like a patchwork solution. True progress might lie in abandoning the search for a monistic theory altogether. If we accept that punishment serves multiple irreducible goods, such as justice, security, and moral communication, then the task of philosophy shifts from finding a single foundational principle to managing the conflicts between these values when they collide. This approach acknowledges that the unease you feel is not a sign of philosophical failure but a recognition of the moral complexity inherent in the state's power to inflict pain.

  Consequently, the impasse is likely permanent if defined as the hope for a single, unified theory that satisfies both frameworks on their own terms. However, this does not render the debate futile. Progress looks like a more honest articulation of the costs associated with each view. It involves recognizing that a purely consequentialist system risks instrumentalizing human beings, while a purely retributivist system risks indulging in vengeance under the guise of justice. By framing the debate as a choice between competing moral commitments rather than a puzzle waiting to be solved, we can move toward a more pragmatic understanding of penal policy. This might involve contextual judgments where certain types of crimes or certain social conditions warrant emphasizing one justification over the other, rather than insisting on a universal rule.

  Ultimately, your intuition that the sides are answering different questions is correct, but it goes deeper than methodology. They are operating within different moral ontologies. The retributivist sees punishment as a moral duty owed to the offender as a rational agent, while the consequentialist sees it as a social tool owed to the community as a collective. Because these visions of the person and the state are fundamentally distinct, no amount of empirical data or logical refinement will bridge the gap. The most valuable contribution you can make to your students, therefore, may not be to lead them to a resolution, but to help them understand why the resolution is elusive. By exposing the structural nature of the disagreement, you allow them to see that the choice between retributivism and consequentialism is not merely a technical legal decision, but a profound ethical stance on the nature of responsibility, community, and the limits of state power. This shifts the classroom dynamic from trying to win an argument to understanding the weight of the choices we make when we authorize punishment.
