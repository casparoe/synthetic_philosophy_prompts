prompt: |-
  I teach an upper-level seminar in the philosophy department on ethics and narrative, and for the past few years I have opened it with a genre rather than an argument: pairs of lives written to be imitated. The canonical examples are Plutarch's Parallel Lives and the Christian saint's life, but I also assign one modern descendant of the same impulse — the admiring life-of-a-great-leader of the kind still handed out in leadership programs — partly because analytic moral philosophy has lately revived exemplar-based accounts of virtue, and I want to know what the older practice was actually committed to before I decide what to make of the revival. What interests me is not whether the genre is respectable but what it must assume in order to work, and it seems to me to run on conventions that are not the conventions of history writing. First, selection obeys what I have been calling the revelatory-priority rule: the biographer prefers the small unguarded moment — a jest, a remark at dinner, how someone received bad news — to the battle or the statute, on the grounds that the latter may be the work of fortune or of subordinates while the former shows the agent; Plutarch more or less says as much in distinguishing the writing of lives from the writing of histories. Second, there is a closure rule: judgment on a life is suspended until the life is complete, the thought Herodotus attributes to Solon about calling no one happy before the end, and it is why a death is treated as evidence rather than as an appendix. Third, there is what I call the typology rule, clearest in hagiography and in confessional autobiography: the childhood is narrated as a figure of the whole, and the subject's faults are retained but redescribed as the material of a turning, so that nothing in the life is permitted to remain merely unassimilated. Fourth, there is a license that would be flagrant anywhere else: where the record is silent, the writer supplies what such a person in such circumstances would have said or done — a convention ancient historiography avowed openly, that hagiography inherited, and that survives in the composite scenes and invented dialogue of the contemporary biopic. And fifth, the pairs invite ranking: the two lives are followed by an explicit comparison and a verdict about which was better.

  Two features of this puzzle me. The revelatory-priority rule and the closure rule seem to pull in opposite directions: if a single jest discloses character, why should the end of the life be evidentially required? My own tentative answer is that they answer different questions — the jest shows who someone is, the ending settles whether that character held — but I cannot tell whether that reconciliation costs me a substantive commitment to the stability of character across a life, or whether it is equally available to someone who thinks conduct is highly situation-dependent. The license bothers me more. The stated point is to learn from a real person, and yet the genre treats the documented record as something to be completed rather than merely reported. So I have been contrasting what I call the documentary constraint (the narrated incidents must have occurred) with the legibility constraint (they must be the sort of thing this agent could have done), and I suspect the educational aim is satisfied by the second and not by the first — which would mean that the modern exhaustively footnoted definitive biography is not a more honest version of the same enterprise but a different enterprise that has quietly abandoned the aim. A colleague in the history department, who regards the whole genre as a confidence trick, says the license simply proves the aim was never truth-tracking; that strikes me as too fast, but I do not have a better formulation. I also give my students a test case: a woman whose life the genre could render beautifully and who then dies at thirty-two in an accident that reveals nothing whatever about her. Under the closure rule her life seems to lose something. Should it? If it does, the genre is committed to a view of lives as possessing narrative shape that I take to be far from obvious.

  So I would like you to reconstruct the implicit theory: what view of character, of moral knowledge, and of truth in narrative does this practice require, and which rival views does it quietly rule out? I want the strict presuppositions separated from the merely congenial ones, and I want to know whether the five conventions genuinely hang together or only look as though they do because we inherited them as a package; where several theories would license the same convention, say so rather than settling it, and where you think the genre is cheating, say that as well. Please commit to a verdict on the two questions I cannot answer myself — whether the editorial license is internal to the educational aim or a corruption of it, and whether the genre requires lives to have a narrative closure they may not in fact have — and give your reasons. Mark which of your claims you hold with real confidence and which are readings a reasonable person could reject; I am less interested in a survey of positions than in a reconstruction I can argue with. I am not asking for a bibliography, and I would rather you reasoned from the practice as I have described it than reached for sources.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** An upper-level philosophy seminar instructor teaching "Ethics and Narrative."
      *   **Topic:** The genre of "pairs of lives written to be imitated" (Plutarch, Saints' Lives, modern leadership bios).
      *   **Core Task:** Reconstruct the *implicit theory* behind five specific conventions of this genre (Revelatory-Priority, Closure, Typology, License, Ranking).
      *   **Specific Questions to Answer:**
          1.  How do Revelatory-Priority and Closure reconcile? (Does this require stable character?)
          2.  Is the "License" (inventing details) internal to the educational aim or a corruption? (Documentary vs. Legibility constraint).
          3.  Does the genre require lives to have narrative closure they may not factually have? (The 32-year-old accident victim case).
      *   **Constraints:**
          *   Separate strict presuppositions from merely congenial ones.
          *   Indicate where multiple theories could license a convention.
          *   Identify where the genre might be "cheating."
          *   **Commit to a verdict** on the two unresolved questions (License & Closure).
          *   Mark confidence levels (High Confidence vs. Debatable Reading).
          *   Reason from the described practice, not external bibliography.
          *   Tone: Philosophical, rigorous, argumentative (something the instructor can argue *with*).

  2.  **Deconstruct the Five Conventions:**
      *   *Revelatory-Priority:* Small moments > Great deeds. (Assumption: Character is revealed in unguarded spontaneity, not calculated public action).
      *   *Closure:* Judgment suspended until death. (Assumption: Moral worth is a function of the whole, vulnerability to fortune until the end).
      *   *Typology:* Childhood figures the whole; faults are material for turning. (Assumption: Unity of life, teleology, redeemability of error).
      *   *License:* Inventing dialogue/actions where record is silent. (Assumption: Legibility/Consistency > Historical Accuracy for pedagogical utility).
      *   *Ranking:* Explicit comparison/verdict. (Assumption: Commensurability of lives, objective hierarchy of virtue).

  3.  **Address Question 1: Revelatory-Priority vs. Closure (Stability of Character):**
      *   *Tension:* If a jest reveals character *now*, why wait for death?
      *   *Instructor's tentative answer:* Jest = Who they are; Ending = Whether it held.
      *   *Analysis:* If character is stable (Aristotelian hexis), the jest reveals the *disposition*. But virtue requires *activity* over a complete life (eudaimonia). A single moment shows capacity/disposition, but luck can interrupt the *exercise* of that character.
      *   *Situationism Challenge:* If conduct is situation-dependent, the jest reveals nothing stable. The genre *must* assume stability to make the jest evidentiary for the whole life.
      *   *Verdict:* The genre requires a robust notion of stable character (hexis), not just situational responsiveness. The reconciliation is that the jest reveals the *quality* of the soul, but the closure confirms the *persistence* of that quality against fortune.

  4.  **Address Question 2: The License (Documentary vs. Legibility):**
      *   *Tension:* Learning from a *real* person vs. inventing details.
      *   *Colleague's view:* Confidence trick (not truth-tracking).
      *   *Instructor's view:* Maybe Legibility > Documentary for education.
      *   *Analysis:* If the aim is *imitation* (mimesis), the model must be coherent. Reality is often fragmented. To make a life *imitable*, it must be rendered *intelligible*. The "truth" sought is moral truth (what a virtuous agent *would* do), not historical truth (what this agent *did* do at t=1).
      *   *Verdict:* The license is *internal* to the educational aim, not a corruption. The aim is paradigmatic truth, not documentary truth. The colleague is applying the wrong epistemic standard (history vs. ethics).

  5.  **Address Question 3: Narrative Closure (The 32-Year-Old Victim):**
      *   *Case:* Woman dies at 32 in an accident revealing nothing.
      *   *Problem:* Closure rule says wait for the end. But the end is random/meaningless.
      *   *Analysis:* The genre treats death as the *seal* of the narrative. If the death is absurd, the narrative shape is broken. To fit the genre, the biographer would have to *impose* meaning on the death (martyrdom? sacrifice?) or treat the life as truncated tragedy.
      *   *Verdict:* The genre *does* require narrative closure that may not factually exist. It cheats here. It assumes life is a *plot*, not just a sequence. If the facts don't support the plot, the genre forces the facts (via Typology or License) to fit.

  6.  **Synthesize the Implicit Theory:**
      *   *Character:* Stable, unified, teleological (directed toward an end).
      *   *Moral Knowledge:* Acquired through emulation of paradigms, not abstract rules. Requires intelligibility.
      *   *Truth:* Moral coherence > Factual correspondence.
      *   *Rival Views Ruled Out:* Situationism, Moral Luck (in the strong sense that luck undermines judgment), Historical Positivism, Fragmented Self.

  7.  **Drafting the Response (Iterative refinement for tone and constraints):**
      *   *Tone:* Academic, direct, respectful but challenging.
      *   *Structure:*
          1.  Introduction: Acknowledge the sophistication of the prompt.
          2.  Reconstruction of the Implicit Theory (Character, Knowledge, Truth).
          3.  Addressing the Tension (Revelation vs. Closure).
          4.  Addressing the License (Internal vs. Corruption).
          5.  Addressing the Closure/Narrative Shape (The 32-year-old case).
          6.  Confidence Markers: Explicitly label claims.
      *   *Refining the "Verdicts":* I need to be decisive as requested.
          *   *License:* It is internal. The genre is ethical, not historical.
          *   *Closure:* It requires narrative shape that may not exist. This is a vulnerability/cheat of the genre.
      *   *Refining Confidence:* Distinguish between what is logically necessary for the genre to function vs. what is a philosophical claim about the world.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I rely on sources? *No, reason from practice.*
      *   *Check:* Did I answer the specific questions? *Yes.*
      *   *Check:* Did I mark confidence? *Need to ensure this is visible.*
      *   *Check:* Is the distinction between "strict presuppositions" and "congenial ones" clear? *I will structure the "Implicit Theory" section to highlight necessities.*
      *   *Check:* The "32-year-old" case. If the death reveals nothing, does the genre fail? Yes, unless it *makes* it reveal something. This supports the "cheating" verdict.

  9.  **Final Polish:** Ensure the distinction between *historical truth* and *moral legibility* is sharp. Ensure the distinction between *disposition* (jest) and *completion* (death) is clear regarding moral luck. (Proceed to generate output).

  *(Self-Correction on Confidence Markers)*: I should use explicit brackets or bold text to indicate confidence levels as requested ("Mark which of your claims you hold with real confidence and which are readings a reasonable person could reject"). I will use a system like **[High Confidence]** and **[Debatable Reading]**.

  *(Final thought on the License)*: The prompt asks if the license is internal or corruption. My verdict: Internal. Why? Because the goal is *imitation*. You cannot imitate a fragment. You imitate a type. The "real person" is the anchor, but the "legend" is the tool.

  *(Final thought on Closure)*: Does the genre *require* narrative closure? Yes. Does reality provide it? No. Therefore, the genre *imposes* it. This is the "cheat."

