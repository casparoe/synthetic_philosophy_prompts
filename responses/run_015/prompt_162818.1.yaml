answer: |-
  Subject: Re: Your questions on the algorithmic fairness article

  Dear Friend,

  It is completely understandable that you found the passage confusing, and your instincts about the contradictions within it are sharper than those of many people who work in the field. You asked for an accuracy audit of the reasoning claim by claim, so I will walk through the text as you requested, keeping in mind your background in insurance operations where risk scoring is routine. The short version is that your brother-in-law is right about the mathematics but wrong about the implications, while you are right to be suspicious of the conclusions drawn from that math. The article correctly describes a real mathematical theorem but then makes a series of logical leaps that turn a technical trade-off into a fatalistic philosophical claim.

  The beginning of the passage is largely accurate regarding the mathematical result itself. When the text says computer scientists proved that an algorithmic risk score cannot satisfy certain fairness requirements simultaneously, it is referring to work published around 2016 and 2017 by researchers like Jon Kleinberg and Alexandra Chouldechova. The description of the first requirement, often called calibration, is correct. This is the idea that if a model assigns a risk score of seven to a group of people, roughly seventy percent of them should exhibit the outcome, regardless of their demographic group. In insurance terms, this is similar to saying that a risk class should be equally predictive for all customers. The second requirement described, equal error rates, is also accurately summarized. This means the model should not falsely flag innocent people from one group at a higher rate than another, nor should it miss guilty people at different rates. These are the standard definitions used in the literature.

  Where the passage becomes slightly imprecise is in its listing of a third condition. It states that the share of flagged people who turn out to be positive should be the same in both groups. In technical terms, this is called parity in positive predictive value. The actual impossibility theorem usually focuses on the tension between the first two conditions, calibration and equal error rates, given that the underlying base rates differ. The base rate is simply the overall frequency of the outcome in each group, such as the actual reoffending rate. The mathematical proof shows that if the base rates differ between groups, and the predictor is not perfect, you cannot have both calibration and equal error rates. You must sacrifice one. The passage's inclusion of the third condition muddies the water slightly, but the core intuition remains valid: you cannot maximize all desirable statistical properties at once when the underlying populations differ in risk.

  The passage is also correct when it states that the obstacle is arithmetic. This is not a flaw in the code or the data collection method; it is a property of conditional probability. If Group A has a higher underlying rate of the outcome than Group B, a score that is perfectly calibrated for Group A will inevitably look miscalibrated for Group B if you try to force the error rates to be identical. This is the hard constraint that the article gets right, and it is why your brother-in-law feels the article is basically correct. The math is not lying.

  However, the passage falls apart when it moves from the math to the remedy. You noted that it sits badly to claim the problem is arithmetic and then recommend hiding group membership from the model. You are absolutely right to find this odd, because those two claims contradict each other. If the impossibility result is driven by the arithmetic of different base rates between groups, removing the group label from the model does not change the base rates. The people still belong to the groups, and the outcomes still occur at different rates. Furthermore, hiding the label makes it impossible to measure whether the model is fair according to any of the definitions provided. You cannot check if error rates are equal across groups if you are not allowed to look at the groups. Additionally, in practice, models often reconstruct group membership using proxies, such as zip code or purchase history, so the blindfold is often porous. The recommendation to stop letting the system see race or sex is a legal or policy choice, not a mathematical solution to the impossibility theorem.

  Your second suspicion regarding better data is also well-founded. The passage claims that no amount of better data will help because the conflict lives inside probability theory. This is true only if you accept the current data labels as ground truth. In criminal justice, and often in insurance, the data we have is not a perfect record of reality but a record of institutional actions. For example, reoffending data is often based on arrests rather than actual crimes committed. If one group is policed more heavily, their arrest rate will be higher even if their actual crime rate is the same. In this case, the base rate difference is an artifact of bad data rather than a genuine difference in risk. Improving the data to reflect actual behavior rather than administrative records could narrow the base rate gap, which would in turn reduce the tension between the fairness metrics. So, while better data cannot solve the mathematical trade-off if genuine base rate differences remain, it can address the source of those differences if they are spurious.

  This leads to the closing conclusion that algorithmic fairness is a contradiction in terms. This is an overstatement that does not follow from the correct parts of the argument. The impossibility result does not prove that fairness is impossible; it proves that different definitions of fairness are incompatible. It forces a choice, but making a choice is not a contradiction. It is a policy decision. In insurance, you face similar trade-offs when balancing accuracy with stability or affordability. You do not say pricing is a contradiction in terms because you cannot maximize profit, market share, and customer satisfaction simultaneously. You choose which metric to prioritize based on your business goals and regulatory constraints. Similarly, algorithmic fairness requires society to decide which mathematical definition of fairness matters most in a given context, not to abandon the concept entirely.

  The modest version of this result, which is what most practitioners actually commit to, is that fairness is not a purely technical specification that can be solved by optimization alone. It requires normative judgment. The math tells you what you cannot have, but it cannot tell you what you should want. When the article says the obstacle is arithmetic, it is right. When it says this makes fairness a contradiction, it is wrong. It makes fairness a political and ethical negotiation. The tension you felt between the arithmetic claim and the blindfold remedy is the tension between a mathematical constraint and a legal workaround that fails to address the constraint. Your brother-in-law is seeing the validity of the theorem, but you are seeing the validity of the context, and in this case, your skepticism about the implications is the more accurate reading of the situation.

  I hope this helps clarify where the article stands on solid ground and where it begins to slip. It is a difficult topic precisely because it mixes hard math with soft values, and it is common for popular accounts to conflate the two. Please feel free to reach out if you would like to discuss any specific part of this further.

  Best regards,

  [Your Name]
