  4.  **Addressing the Specific Technical Worries:**

      *   *Worry 1: Normalization & Population Size.*
          *   *Issue:* If weights sum to 1 (averaging) vs sum to N (totaling). If I compare a program helping 100 people vs 1000 people.
          *   *Analysis:* Rank weighting usually implies a fixed distribution shape. If the population size changes, the "rank" definition changes. If I treat 10 people, the bottom rank is 1/10. If I treat 100, it's 1/100.
