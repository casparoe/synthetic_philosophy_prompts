answer: |-
  # Q&A PREPARATION SHEET: DISTRIBUTIONAL ADJUSTMENT PROPOSAL
  **To:** Committee Philosopher
  **From:** Strategy Desk
  **Re:** Three-Week Presentation Prep

  ## OPENING CONCESSIONS (First 2 Minutes)
  *Do not wait for questions. Disarm the room immediately by acknowledging the operational costs of your proposal.*

  1.  **Concede Operational Friction:** Acknowledge upfront that moving from level-weights to rank-weights complicates the publication of a single cost-effectiveness threshold. Do not pretend it doesn't. Frame this as a necessary trade-off: "We are currently trading mathematical convenience for ethical incoherence. I am proposing we accept a higher operational burden to fix a foundational error in how we measure value."
  2.  **Concede Relationality:** Admit that under your proposal, a patient's priority weight *does* depend on who else is in the queue. Frame this not as "egalitarianism" but as "contextual priority." "A drowning man has a greater claim when lifeboats are scarce than when they are plentiful. The claim is intrinsic, but the urgency is relational."

  ## THE "MUST-LAND" REPLY
  **Target:** The HTA Methodologists.
  **The Stake:** If you cannot answer the **Separability/Threshold** objection (Objection #2), the proposal dies. The committee cannot function without delegatable thresholds.
  **The Line:** "We do not need to abandon thresholds; we need to *fix the reference distribution*. We publish thresholds based on a standard reference population (e.g., the national health distribution). Deviations from that reference trigger a recalibration, much like we currently handle severity. This preserves delegation for 90% of cases while correcting the invariance error in the remaining 10%."

  ## THE "HOPE NOBODY ASKS" QUESTION
  **The Question:** "If Programme A treats 100 patients and Programme B treats 1,000, how do you normalize the rank weights without either ignoring population size (averaging) or letting the weight of the 'worst off' depend arbitrarily on cohort size (totaling)?"
  **Why it's dangerous:** Your invariance proof relies on weights summing to a constant. If population size ($N$) changes, the definition of "rank" changes. If you normalize to sum to 1, you lose the ability to compare total social value across different sized programmes. If you don't, your invariance claim collapses under affine transformation when $N$ varies.
  **Preparation:** You must decide if you are maximizing *average* rank-weighted welfare or *total*. HTA usually implies Total QALYs. If you switch to Average, you face population ethics problems. If you stick to Total, you must explain how the weight of the bottom rank remains stable as $N$ grows. (See *Technical Note 1* below).

  ---

  ## OBJECTIONS & REPLIES

  ### 1. The Economist (The Parameter Objection)
  **Objection:** "You're criticising my inequality-aversion parameter for being unmeasurable, then proposing a new parameter—the ratio of bottom-to-top weights—that is equally unmeasurable. Why is your moralising parameter more 'falsifiable' than mine? I can at least calibrate mine to survey data on risk aversion."
  **Reply:** "Your parameter calibrates to risk aversion over *gambles*, not inequality aversion over *distributions*. That's a category error. My parameter is a direct policy choice: 'How much more do we value the worst-off than the best-off?' It forces the committee to own the moral trade-off explicitly, rather than hiding it behind a risk-preference proxy. We should set it by deliberation, not by pretending we can derive it from a survey."
  **Candid Note:** *Soft spot:* She is right that it's unfalsifiable. You are swapping one subjective number for another. Your only defense is transparency, not accuracy.

  ### 2. HTA Methodologist 1 (The Separability Objection) **[CRITICAL]**
  **Objection:** "Our entire system relies on separability. We publish a threshold (£/QALY) that lower bodies apply without coming back to us. If the value of a QALY depends on the patient's rank in the distribution, we can't publish a threshold. We can't delegate decisions. You are breaking the machine."
  **Reply:** "We preserve the machine by fixing a *reference distribution* for threshold setting. We calculate the threshold based on the national health distribution. Local bodies apply that threshold unless the local cohort differs drastically from the national average, in which case they flag it. We trade a small amount of administrative friction for a system that doesn't yield different results just because we shifted the zero-point of the QALY scale."
  **Candid Note:** *Soft spot:* This creates a "fudge factor." If local bodies have to check the distribution, you haven't really solved the delegation problem. Be prepared to define "drastically."

  ### 3. HTA Methodologist 2 (The Information Burden)
  **Objection:** "To apply rank weights, we need to know where a patient sits in the distribution *before* we fund the treatment. But we often don't know the full cohort until after the appraisal. Are we going to re-rank patients every time a new technology enters the system? That creates instability."
  **Reply:** "We rank based on *expected baseline health*, not post-treatment health. We use existing epidemiological data to place disease groups into percentiles of the national distribution. This is no more data-intensive than the severity modifier we already apply. The rank is attached to the *condition*, not the individual instance."
  **Candid Note:** *Soft spot:* This moves you away from individual justice toward group justice. You are effectively creating "classes" of patients. This contradicts the philosophical purity of individual rank weighting.

  ### 4. The Clinician (The Severity/Rule of Rescue)
  **Objection:** "I have a patient with a severe acute condition. She isn't 'lifetime worst off,' she's just very sick *now*. Your system weights her based on her lifetime position. Why should I tell her she gets lower priority because she was healthy for the first 40 years of her life? That violates the rule of rescue."
  **Reply:** "The proposal accounts for this via the baseline we choose. If we rank based on *current* health status (the status quo), your patient ranks high. If we rank based on *lifetime* health, she ranks lower. I recommend we rank based on current health shortfall to preserve the severity modifier's intent, while using the rank weights to handle the distributional inequality between disease groups."
  **Candid Note:** *Soft spot:* You are conflating "severity" (absolute shortfall) with "priority" (rank). If you use current health for rank, you lose the "fair innings" protection you claimed to fix. You need to be clear on what the "level" is that you are ranking.

  ### 5. The Bioethicist (The Levelling-Down Objection)
  **Objection:** "You say immunity to levelling-down is a virtue. I say it's a blindness. Sometimes inequality is expressive of stigma. If we level down a privileged group to remove a stigmatizing gap, that has value. Your formula forbids this. You claim to handle relations, but your math still treats people as containers of value."
  **Reply:** "HTA is about allocating scarce resources to improve health, not engineering social relations directly. We can address stigma through access rules and service design, not by burning QALYs. My rule prevents us from *harming* the sick just to satisfy an aesthetic of equality. That is a constraint a health service must respect."
  **Candid Note:** *Soft spot:* She will argue that "access rules" *are* distributional choices. You are drawing a line between "health allocation" and "social justice" that she believes is artificial.

  ### 6. Patient Representative 1 (The Neighbour Objection)
  **Objection:** "Are you telling me my claim on the NHS goes up if my neighbours get sicker, and goes down if a sicker group is discovered? I don't want my entitlement to depend on someone else's misfortune. That feels predatory."
  **Reply:** "Your entitlement to *care* doesn't change. The *weight* we give to that care in a budget decision changes. It's not that you matter less; it's that the budget constraint forces us to prioritize the most desperate. If the queue gets more desperate, the pressure on the budget increases for everyone. It's a tragedy of scarcity, not a penalty on you."
  **Candid Note:** *Soft spot:* This is emotionally difficult. It sounds like "your suffering is worth less because someone else is worse." Be careful not to sound cold.

  ### 7. Patient Representative 2 (The Transparency Objection)
  **Objection:** "I struggle to explain the current system to my community. How do I explain this? 'We use a geometric interpolation of rank weights'? If the public can't understand it, they won't trust it."
  **Reply:** "We don't publish the formula; we publish the result. We say: 'Treatments for the worst-off conditions get higher priority.' The math is for us, the committee, to ensure we are consistent. The message to the public is simply that we are systematically prioritizing the sickest, not just the cheapest."
  **Candid Note:** *Soft spot:* HTA bodies are under pressure for transparency. Hiding the math looks like technocratic obfuscation.

  ### 8. The Health Economist (Follow-up: The Zero Point)
  **Objection:** "You say the QALY zero is arbitrary. But dead is dead. Zero QALYs is a natural zero. Why is your affine transformation worry relevant when the scale is anchored by death?"
  **Reply:** "Dead is a natural zero for *life*, but not for *health gain*. We measure gains from a baseline. If I move you from 0.5 to 0.6, is that the same gain as 0.1 to 0.2? The QALY scale assumes ratio properties that aren't empirically secure. My method works regardless of whether 0.5 is 'twice as good' as 0.25. It only requires that 0.6 is better than 0.5."
  **Candid Note:** *Soft spot:* This challenges the fundamental validity of the QALY itself. If they think you are undermining the QALY, they will reject the proposal to protect the core technology. Frame this as "robustness," not "critique."

  ---

  ## TECHNICAL NOTES FOR YOUR PREP

  ### 1. On Normalization and Population Size (Your Private Worry)
  **Verdict:** **You are right to dread this.**
  If you compare Programme A (N=100) and Programme B (N=1000), and you use rank weights $w_i$:
  *   **If you sum weights ($\sum w_i = N$):** The total weight of the "bottom" person in Group A might differ from the "bottom" person in Group B depending on how you define the weight function. If $w_i$ depends on percentile ($i/N$), then the weight is stable. But if you sum them, the *total* value scales with N. This is fine for Total Utilitarianism.
  *   **If you normalize weights ($\sum w_i = 1$):** You are now maximizing *Average* Rank-Weighted Welfare. This creates the "Repugnant Conclusion" risk (preferring a huge population with tiny weighted gains over a small population with large ones).
  *   **The Fix:** You must define the weights based on **percentiles of the national reference population**, not the cohort size. The "bottom weight" applies to anyone in the bottom 1% of the *nation*, regardless of how many people are in the treatment cohort. This keeps the weights invariant to cohort size.
  *   **Risk:** This requires a stable national distribution. If that shifts, your weights shift.

  ### 2. On Ex-Ante vs. Ex-Post Expectation
  **Verdict:** **The Room will push you to Ex-Ante.**
  *   **Ex-Post (Expectation of Weighted Sum):** You calculate the weighted welfare for every possible outcome state, then take the expectation. This captures risk inequality (who gets the bad luck).
      *   *Cost:* Computationally nightmare. Requires joint probability distributions of all patients. Methodologists will reject this.
  *   **Ex-Ante (Weighted Sum of Expectations):** You calculate the expected QALY for each patient, rank them, apply weights, then sum.
      *   *Cost:* Ignores "outcome inequality." If two patients have equal expected QALYs but one is a gamble and one is certain, this treats them identically.
  *   **Recommendation:** Adopt **Ex-Ante**.
      *   *Why:* HTA operates on mean cost-effectiveness ratios (ICERs). The committee already treats QALYs as expectations. Moving to Ex-Post requires a fundamental overhaul of the economic model, not just the distributional adjustment.
      *   *Philosophical Cost:* You lose the ability to penalize "health lotteries." But you gain operational viability. Concede this explicitly: "We are prioritizing distributional fairness across persons, not risk fairness across states."

  ## STRATEGIC SUMMARY
  1.  **Don't fight the Methodologists on Separability.** Offer the "Reference Distribution" compromise.
  2.  **Don't fight the Economist on Calibration.** Admit it's a moral choice, not an empirical one.
  3.  **Do fight on Invariance.** This is your strongest technical point. The current system yields different decisions if we change the QALY zero-point (e.g., if we measure health gain from a different baseline). That is a bug, not a feature.
  4.  **Watch the Population Size Trap.** Ensure your weights are defined by national percentiles, not cohort ranks, to avoid the normalization problem.

  Good luck. Keep it operational, keep it robust, and don't let them box you into a philosophy seminar.
