answer: |-
  Your friend has presented a very tight reconstruction of the meaning-variance thesis, often associated with Quine or later logical pluralists, and it is designed to be resilient against the usual objections. The reason you feel backed into a corner is that the argument is valid if you accept the hidden assumption governing the transition from step five to step six. That hidden assumption is that classical logical equivalence is the neutral arbiter of propositional identity. If you accept that assumption, then the double-negation translation does indeed show that the intuitionist proves everything the classicist proves, because she proves the classical equivalent of every classical theorem. However, this assumption begs the question against the intuitionist, who denies that classical equivalence captures the full content of a mathematical assertion. Therefore, the most precise diagnosis is that something slipped between the steps, specifically in step six, though this slippage is licensed by the inferentialist semantics of step one.

  If you are forced to choose which premise to abandon among the ones you listed, step one is the deepest philosophical commitment, but step six is the most vulnerable tactical point. Rejecting step one means denying that meaning is exhausted by inferential role. This commits you to some form of semantic realism or externalism where the meaning of logical constants is fixed by something other than how we use them, perhaps by truth conditions that obtain independently of our ability to verify them. The cost of this is high because it requires you to defend a metaphysical picture of truth that the intuitionist explicitly rejects as unintelligible. You would be asserting that there is a fact of the matter about what or means that transcends the rules for using or, which invites the intuitionist to ask how we could ever access or learn such a meaning. If you reject step one, you save the idea that the disagreement is genuine because the meanings are the same, but you pay for it by adopting a realist metaphysics that the argument was trying to circumvent.

  Rejecting step four is also an option, though it is often less satisfying. Step four claims that genuine disagreement requires asserting and denying the exact same proposition. You could argue that disagreement can exist even if meanings vary slightly, provided there is enough overlap to make the dispute substantive. This is the route taken by some pluralists who allow for partial disagreement. However, your friend will likely counter that if the meanings differ, the intuitionist is not denying what the classicist asserts, but merely refusing to assert something else. This leaves you with a verbal dispute rather than a substantive one. The cost here is accepting that logical disputes are often merely verbal, which undermines the seriousness of the foundational debate you wish to preserve.

  The most strategic move, and the one that aligns with your Witness-Preservation Constraint, is to expose the slippage in step six. Your friend argues that because there is a translation preserving validity, the theorems are the same in the only sense mathematics recognizes. This is false on constructive grounds. In constructive mathematics, the sense in which a theorem is recognized includes its proof conditions. A proof of an existential statement is not merely a guarantee that a counter-example is impossible, but the production of a witness. When the classicist says the intuitionist proves the double negation of the existential, the intuitionist replies that the double negation is a weaker statement with less content. The slippage is the equivocation on the phrase same theorem. Classically, a theorem is a true sentence; constructively, a theorem is a proven sentence, where proof implies construction. By using the classical notion of theoremhood to judge the equivalence in step six, your friend is evaluating the intuitionist position by classical standards, which is precisely what is in dispute. Rejecting the inference in step six costs you the comfort of classical equivalence as the gold standard for identity. You must commit to the view that informational content is not preserved by double-negation translation, and that a mathematical statement carries procedural commitments that are lost when doubly negated.

  This brings us to your Witness-Preservation Constraint. Your friend claims it assumes the standard it was supposed to establish, but she is only half right. It does assume a constructive standard of content, but that is not circular if the goal is to show that constructivism is a rival framework. The constraint is not a proof that constructivism is correct; it is a clarification of what constructivism claims to be doing. If the classicist insists that the double-negated version is the same theorem, they are redefining theoremhood to exclude the constructive requirement for witnesses. You can hold the line here by arguing that the double-negation translation is not a vindication of classical mathematics within intuitionism, but a simulation of classical mathematics within intuitionism. It shows that intuitionism can model classical reasoning, but not that classical reasoning captures intuitionistic content. The unpaid debt you mention is real: the double-negated existential does not yield an algorithm, and for the intuitionist, the algorithm is part of the meaning.

  Regarding what would change my mind or where my diagnosis might be wrong, I must acknowledge that the categorical equivalence between classical and intuitionistic logic via topos theory offers a sophisticated challenge to your position. If one can show that classical logic is simply the logic of boolean toposes and intuitionistic logic is the logic of general toposes, and that these are just different contexts for the same structural relationships, then the claim that they are rivals weakens. They become different tools for different jobs rather than contradictory accounts of the same job. If your friend can argue that the Witness-Preservation Constraint is too narrow because much of classical analysis does not actually require explicit witnesses but rather structural stability, then the demand for a term t might be seen as a category error. Furthermore, if it turns out that the double-negation translation can be inverted in a way that recovers the constructive content for a significant fragment of mathematics, then the claim that information is lost becomes less decisive. My own diagnosis relies heavily on the idea that proof conditions are constitutive of meaning, and if you are willing to sever meaning from proof conditions without falling into full-blown realism, the force of the argument shifts. However, given your desire to keep the refusal of excluded middle as a real refusal and to maintain the necessity of witnesses, the slippage in step six remains the most honest place to break the chain, accepting the cost that mathematical content is richer than truth conditions alone.
