answer: |-
  ### Preliminary Analysis: What Survives Operationalization?

  Before handing you the protocol, I need to be honest about what happens when you compress Kripkean metaphysics into a ten-minute checklist.

  **What Collapses:**
  1.  **Reference-Fixing vs. Synonymy:** In *Naming and Necessity*, Kripke distinguishes between using a description to *fix the reference* of a name (e.g., "Let 'Neptune' name the planet causing these perturbations") and using a description to *give the meaning* of a name. In your database, you only see the text. You cannot see the intention of the original cataloger. If a record says "The Victor of 1793," you cannot know if that description was meant to *name* the person (rigid) or *describe* the role (non-rigid). You must treat all descriptions as non-rigid unless there is external evidence of a baptism.
  2.  **A Priori vs. A Posteriori:** You cannot distinguish these from the record alone. You must rely on the *Intake Tag* as a proxy. If the tag says "Ostensive," treat it as a name (rigid). If it says "Description," treat it as contingent.
  3.  **Empty Names:** In metaphysics, an empty name refers to nothing. In a database, an empty name refers to a *record* that lacks a real-world anchor. The procedure must treat "Empty" as a distinct status, not just "False."

  **What Survives:**
  1.  **Rigidity (Stability):** The core intuition survives. Does this label track the *object* across changes in description, or does it track the *description* across changes in objects? We can test this with counterfactual questions ("What if the history had been slightly different?").
  2.  **Necessary Identity:** If two rigid designators refer to the same object, they are necessarily identical. If one is non-rigid, the identity is contingent. This distinction is vital for your "Identity" vs. "As-Described" outputs.
  3.  **The Epistemic/Metaphysical Gap:** We can discover a necessary truth empirically. The procedure must allow you to confirm identity based on evidence (archival research) without classifying the link as contingent.

  ***

  ### The Registry Identity Protocol (RIP-10)

  **Purpose:** To determine the modal status of a proposed link between two entity records.
  **Time Limit:** 10 Minutes.
  **Inputs:** Two Record IDs, Proposal Note, Intake Tags for both records.
  **Outputs:**
  1.  **ID-OBJ (Identity-of-Object):** The records necessarily pick out the same entity. (Rigid/Rigid match).
  2.  **AS-DESC (As-Described-Here):** The records pick out the same entity *in this world*, based on the current descriptions, but could diverge. (Non-rigid match).
  3.  **FLAG (Senior Review):** Insufficient data or policy conflict.

  #### Phase 1: The Existence Check (1 Minute)
  *Look at the Intake Tags and Evidence Notes for both records.*

  1.  **Is either record tagged "Placeholder" or "Empty"?**
      *   **Yes:** If *both* are Placeholders for the *same* unknown role (e.g., "Unknown Author A" and "Unknown Author B" for the same manuscript), proceed to Phase 2. If one is a Placeholder and the other is a Specific Person, **STOP**. Output: **FLAG**. (Reason: You cannot assert necessary identity between a role and a candidate without higher certainty).
      *   **No:** Proceed to Question 2.
  2.  **Is there definitive evidence that one record refers to a fictional or non-existent entity?**
      *   **Yes:** **STOP**. Output: **FLAG** (for deletion/merging policy).
      *   **No:** Proceed to Phase 2.

  #### Phase 2: The Stability Test (4 Minutes)
  *This is the modal core. Do not use the word "necessary." Use "Stable."*

  3.  **Look at the primary name/description for each record. Ask the "Counterfactual Question":**
      *   *For Record A:* "If the historical facts described here had been slightly different, would this record still refer to the same individual?"
          *   *Example:* If the record is "The Head of Archive in 1793," and someone else had been appointed, would this record refer to the new person?
          *   **If Yes (It tracks the role):** Mark as **Non-Rigid**.
          *   **If No (It tracks the person regardless of the role):** Mark as **Rigid**.
      *   *For Record B:* Repeat the question.
  4.  **Check the Intake Tags for Confirmation:**
      *   **Ostensive Baptism / Inheritance:** Presume **Rigid**.
      *   **Definite Description:** Presume **Non-Rigid** (unless it contains "Actual" or is a natural kind term).
      *   **Rigidified Description (e.g., "The Actual Head"):** Mark as **Rigid**.
      *   **De Facto Rigid (e.g., "The Square Root of 4"):** Mark as **Rigid** (Mathematical/Logical constants are stable).

  #### Phase 3: The Link Classification (3 Minutes)
  *Compare your Rigid/Non-Rigid marks.*

  5.  **Are both records marked Rigid?**
      *   **Yes:** And does the evidence confirm they are the same entity?
          *   **Yes:** Output: **ID-OBJ**. (Even if discovered empirically, e.g., Cicero/Tully).
          *   **No:** Output: **FLAG** (Contradictory identity).
      *   **No:** (One or both are Non-Rigid). Proceed to Question 6.
  6.  **Do the descriptions currently pick out the same entity in the actual world?**
      *   **Yes:** Output: **AS-DESC**. (They coincide now, but the link is contingent on the description holding true).
      *   **No:** Output: **FLAG** (No link).

  #### Phase 4: The Policy Handoff (2 Minutes)
  *Check for specific failure modes.*

  7.  **Does the link rely on a "Probable" attribution?** (e.g., "Likely the same person," "80% match").
      *   **Yes:** **STOP**. Output: **FLAG**. (Identity cannot be probabilistic; it is all-or-nothing. Probabilistic links are As-Described at best, but usually require Senior policy decision).
  8.  **Does the link involve a "Number" or "Quantity" record where one term uses "Actual"?**
      *   **Yes:** **STOP**. Output: **FLAG**. (See Special Note on Quantities below).
      *   **No:** Proceed to final submission.

  ***

  ### Application to Proposals

  Here is how the protocol handles your three hard cases.

  #### Case 1: The Cicero/Tully Pair (Archival Research)
  *   **Record A:** "Marcus Tullius Cicero" (Tag: Inheritance from Classical File).
  *   **Record B:** "Tully" (Tag: Ostensive Baptism in Roman Census).
  *   **Evidence:** Archival cross-reference confirms biological identity.
  *   **Protocol Run:**
      *   Phase 1: Both exist.
      *   Phase 2: "Cicero" is a name (Rigid). "Tully" is a name (Rigid). Counterfactual: If Cicero hadn't been consul, would "Cicero" refer to someone else? No.
      *   Phase 3: Both Rigid + Evidence Confirms Match.
  *   **Output:** **ID-OBJ (Identity-of-Object)**.
  *   **Reasoning:** This is the standard Kripkean case. The identity was discovered empirically (a posteriori), but because both terms are rigid designators, the identity is metaphysically necessary. The database treats them as the same trackable object.

  #### Case 2: The Placeholder Author (Unknown vs. Candidate)
  *   **Record A:** "Author of Manuscript X" (Tag: Placeholder/Role).
  *   **Record B:** "John Doe" (Tag: Ostensive Baptism).
  *   **Evidence:** Handwriting analysis suggests 85% probability Doe wrote Manuscript X.
  *   **Protocol Run:**
      *   Phase 1: Record A is a Placeholder. Record B is Specific.
      *   **Stop Condition:** Phase 1, Question 1. One is Placeholder, one is Specific.
      *   **Output:** **FLAG (Senior Review)**.
  *   **Reasoning:** You cannot assert **ID-OBJ** because the reference of Record A is fixed by a role ("Author of X"). If Doe is proven wrong tomorrow, Record A still exists (waiting for a new candidate), but the link to Doe breaks. It is not a necessary identity. It is a hypothesis. Your Senior Editor must decide if the Registry allows probabilistic attributions to be logged as **AS-DESC** or if they require a **FLAG**. The protocol forces the Flag to prevent "Identity Pollution."

  #### Case 3: The Number of Notebooks (Count vs. Actual)
  *   **Record A:** "The number of notebooks bequeathed" (Value: 5). (Tag: Definite Description).
  *   **Record B:** "The actual number of notebooks bequeathed" (Value: 5). (Tag: Rigidified Description).
  *   **Proposal:** Equate Record A and Record B.
  *   **Protocol Run:**
      *   Phase 1: Both exist.
      *   Phase 2:
          *   Record A ("The number..."): Counterfactual test. If the founder had bequeathed 6 notebooks, would this record refer to 6? **Yes**. It tracks the count. **Mark: Non-Rigid**.
          *   Record B ("The actual number..."): Counterfactual test. If the founder had bequeathed 6 notebooks, would this record refer to 6? **No**. The term "Actual" fixes the reference to the number 5 in the actual world, rigidly. In a counterfactual world where he bequeathed 6, "The actual number" still refers to 5. **Mark: Rigid**.
      *   Phase 3: One Rigid, One Non-Rigid.
      *   **Output:** **AS-DESC (As-Described-Here)**.
  *   **Reasoning:** This is the outcome you will dislike. Numerically, 5 = 5. You will want to log this as **ID-OBJ**. However, the *records* do not track the same concept modally. Record A tracks a variable property (the count). Record B tracks a fixed constant (the actualized count). If the database ever supports modal queries (e.g., "Show me facts that hold in alternative historical scenarios"), these records behave differently. Linking them as **ID-OBJ** would conflate a contingent fact with a rigidified constant.

  ***

  ### Why You Will Dislike Case 3 (And Why It's Right)

  You will dislike the **AS-DESC** output for the Number Case because, in the actual world, the extension is identical. Both records point to the integer 5. Data curators naturally think in terms of *extensions* (what the term picks out now), while the protocol forces you to think in terms of *intensions* (how the term picks it out).

  If you link them as **ID-OBJ**, you are asserting that "The number of notebooks" *is* "The actual number of notebooks" in all possible contexts. But imagine a historical simulation project uses your data to ask: "What if the founder had written one more notebook?"
  *   Record A updates to 6.
  *   Record B stays at 5 (because it refers to the *actual* history).
  *   If you merged them as **ID-OBJ**, your database would break under that query. You would have a contradiction (The number is 6 and 5).
  *   By marking them **AS-DESC**, you acknowledge they coincide in our world, but preserve the logical distinction that allows them to diverge in analysis. It protects the data from future modal confusion.

  ### Limitations: Where the Procedure Fails

  As a philosopher, I must tell you where this checklist cannot save you.

  1.  **The "Hidden Baptism" Problem:** Sometimes a description is used to fix a reference, but looks like a description. If a cataloger wrote "The Victor of 1793" intending it as a *name* for a specific person (rigid), but the Intake Tag says "Description," my protocol forces you to treat it as Non-Rigid. You will misclassify some rigid designators as contingent. There is no way to fix this without reading the cataloger's mind.
  2.  **De Facto Rigidity:** Some descriptions pick out the same object in every possible world where that object exists (e.g., "The inventor of the zipless jacket" might be necessarily Ruth K. if no one else could have invented it). The protocol treats these as Non-Rigid (Phase 2, Q3). You will output **AS-DESC** where **ID-OBJ** might be metaphysically defensible. This is a safety feature: it is better to under-claim identity than to over-claim it.
  3.  **The Judgment Gap:** Phase 2, Question 3 ("Would this record refer to the same individual?") requires a modal intuition. Two editors might answer differently. One might think "The Head of Archive" refers to the office (Non-Rigid), another might think it refers to the specific incumbent (Rigid). The procedure cannot eliminate this judgment; it can only make it explicit.
  4.  **Empty Names:** If a name is empty (e.g., "Vulcan" the planet), the protocol flags it. But it cannot tell you *which* empty name is identical to *which* other empty name (e.g., "Vulcan" = "The Planet inside Mercury"). In the Registry, these are both "Non-Existent," but metaphysically, identity between non-existents is fraught. The procedure punts this to **FLAG**, which is the only honest answer.

  **Final Advice:** When in doubt, choose **AS-DESC** over **ID-OBJ**. You can always upgrade a description to an identity later if new evidence proves rigidity. You cannot downgrade an identity without retracting a published fact. The protocol is designed to minimize retractions, not to maximize metaphysical precision.
