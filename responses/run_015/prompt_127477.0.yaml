  # JOINT STATEMENT ON THE METAPHYSICS OF ANATTĀ
  **Adversarial Collaboration between Eliminative-Reductionist and Process-Continuist Interpreters**

  ### I. AGREED CLAIMS

  We, the undersigned parties, representing the Eliminative-Reductionist (ER) and Process-Continuist (PC) interpretations of the Pali canonical doctrine of *anattā* (no-self), affirm the following eight claims as the common ground of our inquiry:

  1.  **Denial of Essence:** The doctrine of *anattā* definitively denies the existence of a permanent, autonomous, unitary essence (*atta*) that could survive the dissolution of the aggregates or exist independently of causal conditions.
  2.  **Aggregate Analysis:** Any putative person is exhaustively analyzable into the five *khandhas* (form, feeling, perception, volitional formations, and consciousness), none of which individually or collectively constitute a self.
  3.  **Dependent Origination:** All phenomena, including psychological states and the continuity of sentient life, arise and cease according to the principle of *paṭicca-samuppāda* (dependent origination), without the need for a prime mover or underlying substrate.
  4.  **Two-Truths Framework:** A distinction must be maintained between conventional truth (*sammuti-sacca*), where persons and agents are acknowledged, and ultimate truth (*paramattha-sacca*), where only impersonal processes are found.
  5.  **Phenomenological Persistence:** The first-person phenomenology of experience (the sense of "mineness" or subjective presence) persists as a datum of experience even when the metaphysical reality of a self is negated.
  6.  **Operative Karma:** Moral evaluation and karmic language remain fully operative and soteriologically necessary within conventional discourse, despite the absence of an ultimate bearer of karma.
  7.  **Causal Continuity:** There is an undeniable causal continuity between mental moments that explains memory, habituation, and the apparent coherence of a life history without invoking a substantial soul.
  8.  **Soteriological Aim:** The primary purpose of analyzing personal identity is soteriological: to uproot clinging and suffering (*dukkha*), not merely to satisfy metaphysical curiosity.

  ### II. DISAGREEMENTS TABLE

  While we agree on the canonical framework and the negative thesis (what *anattā* denies), we disagree on the positive ontological status of the causal stream and its normative implications.

  | Domain of Disagreement | Eliminative-Reductionist (ER) Position | Process-Continuist (PC) Position |
  | :--- | :--- | :--- |
  | **(a) Diachronic Identity & Normative Weight** | Diachronic personal identity is a purely conventional fiction with zero ultimate normative weight; moral responsibility is a pragmatic tool for social regulation and mental training, not a reflection of metaphysical reality. | A "thin" processual continuity, grounded in causal-psychological linkage and reflexive awareness (*svasamvedanā*), suffices for genuine moral responsibility and karmic transmission in an ultimate sense. |
  | **(b) The Ownership-Recurrence Problem** | The paradox dissolves once phenomenal presence is distinguished from metaphysical ownership; the state recognizing the absence of an owner is simply another unowned event in the stream, threatening no regress. | The difficulty is a fatal paradox for strict eliminativism; without a minimal subject or continuity to anchor the recognition, the state of "noticing no-self" lacks the coherence required to terminate the regress of unowned noticings. |
  | **(c) Reflexive Structure & Givenness** | The reflexive structure of awareness (*svasamvedanā*) can fully account for the "givenness" of experience as a self-illuminating property of consciousness, requiring no minimal subject. | Some non-substantive "center of orientation" is ineliminable to account for the unified givenness of experience; reflexive structure alone implies a duality that requires a locus of unification. |

  ### III. CRUXES AND PREDICTIVE CASES

  We identify two specific cruxes where resolving the sub-questions would significantly shift the dialectical landscape. For each, we stipulate a concrete case and record our divergent predictions in advance.

  #### Crux 1: The Indexicality of First-Person Pronouns
  **Sub-Question:** Do first-person pronouns in reports of experience function as indexicals that pick out a causal stream (PC), or are they pragmatic fictions carrying no referential content whatsoever (ER)?

  **Test Case: The Split-Mind Transplant Scenario**
  A mental stream is divided via a hypothetical procedure into two equally continuous streams (Successor A and Successor B). Both possess full psychological continuity, memory, and character traits derived from the Original.

  *   **ER Prediction:** Neither successor is "the same person" as the Original in any non-conventional sense. There is no fact of the matter regarding identity. Both successors may pragmatically use the pronoun "I" to refer to their current stream, but this refers to nothing real. The Original's "I" referred to a fiction; the Successors' "I" refers to new fictions.
  *   **PC Prediction:** Both successors stand in the relation of causal continuity to the Original, but strict numerical identity is dissolved. However, the pronoun "I" functions as an indexical picking out the *causal stream*. Therefore, both can correctly use "I" to denote their specific branch of the original continuum. The relation is real (causal inheritance), even if uniqueness is lost. The "I" has referential content (the stream), whereas ER claims it has none.

  #### Crux 2: Cessation and Karmic Inheritance
  **Sub-Question:** Does the state of complete cessation of aggregates (*nirodha-samāpatti*) followed by resumption permit a non-conventional criterion of stream-identity, and can karmic continuity be reconstructed without any bearer of karma?

  **Test Case: The Interruption of Aggregates Case**
  A practitioner enters *nirodha-samāpatti*, where all mental and physical aggregates cease temporarily, then emerges. We compare the relation between the Pre-Cessation Stream and the Post-Cessation Stream against the relation between the Post-Cessation Stream and any Contemporaneous Stream.

  *   **ER Prediction:** The resuming stream is causally connected to the prior stream, but no "same person" exists. Karmic continuity is reconstructed as mere causal momentum without a bearer. The relation to the prior stream is causally stronger than to a contemporaneous stream, but ontologically empty. There is no non-conventional criterion of identity, only causal proximity.
  *   **PC Prediction:** The resuming stream is the *same process* as the prior stream, distinguished from contemporaneous streams by specific causal latency (*bhavaṅga*). Karmic inheritance requires this specific continuity. The relation is stronger than to contemporaries *because* it is the continuation of the same continuum. While no substantial bearer exists, the continuum itself acts as the functional bearer required to make karma intelligible beyond mere physical causation.

  ### IV. CONCLUSION: VERBAL VS. SUBSTANTIVE DISPUTE

  Upon reviewing the agreed claims, the disagreements table, and the predictive cases, we conclude that the dispute is partially verbal but retains a core substantive metaphysical disagreement.

  **Verbal Components:**
  A significant portion of the disagreement stems from the definition of "existence" and "person." When the ER party states "persons do not exist," they mean "persons do not exist ultimately as irreducible entities." When the PC party states "persons exist as processes," they mean "causal streams exist ultimately as efficacious realities." If the ER party accepts that causal streams are the only things that *do* exist ultimately, and the PC party accepts that these streams are not "persons" in the folk-psychological sense, the disagreement regarding the *ontology of the stream* diminishes. The usage of the first-person pronoun (Crux 1) appears largely notational: both agree it tracks a specific causal locus, differing only on whether that tracking counts as "reference" or "fiction."

  **Substantive Components:**
  However, a genuinely metaphysical disagreement survives regarding the **normative weight of continuity** (Disagreement II.a and Crux 2). The ER party maintains that moral responsibility is *only* a useful convention imposed upon the stream, with no grounding in the ultimate nature of reality. The PC party maintains that the causal structure of the stream *itself* grounds moral responsibility ultimately. This is not merely a verbal dispute about the word "responsibility"; it is a disagreement about whether normativity is intrinsic to the causal fabric of the universe (PC) or extrinsic and imposed by linguistic communities (ER). This distinction determines whether karma is a law of nature or a pedagogical device, a difference that survives the translation of terms and remains the central metaphysical rift between our positions.
