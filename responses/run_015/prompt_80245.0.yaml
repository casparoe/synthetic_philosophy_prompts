prompt: |-
  I keep getting stuck on why a promise actually binds, and I think the problem is people just pick one case and defend one theory, so I want the full spec before I weigh in. Write the desiderata: what any adequate account of why promises create obligations has to deliver -- which cases it must get right, which distinctions it can't collapse, which facts about how we actually talk and act it cant contradict -- with the case or consideration behind each requirement. And tell me which of these are non-negotiable and which are just one camp's prejudice dressed up as a requirement.

  A few cases I want on the list because I think they're the ones that actually discriminate. The promise I make to a friend who, right after I make it, forgets it completely and never thinks about it again -- am I stil bound to keep it, and if so, what's the source of the obligation if it's not their expectation of me doing it? The promise I make in the middle of a game or a joke that nobody takes seriously. The promise to do something that's itself wrong. And the promise I make because someone's holding a gun to my head. For each, say what the right answer is supposed to be and which popular account gets it wrong.

  Then the part I really want: is there a subset of these desiderata that no theory can jointly satisfy, given how we actually treat promises? If so, that's the real result, so flag it and say which requirement you'd be tempted to drop and why that's the least bad cut. And score the main contenders -- the reliance/expectation story, the agreement-or-consent story, and the speech-act/commitment story -- briefly against the list, but keep the weight on the criteria, not the scorecard.

  One more thing: when you give your verdict on which desiderata are genuine and which subset (if any) is jointly unsatisfiable, say where your reasoning is most likely to fail and what would change your mind -- like, which single case or consideration, if I pressed on it, would make you revise the list. And write the whole thing in American English.
