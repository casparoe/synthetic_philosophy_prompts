answer: |-
  Here is the specification sheet for promissory obligation. I have stripped away the defensive posturing of the major camps to isolate the raw data points any theory must process.

  ### Part I: The Desiderata List

  An adequate account of promising must explain why saying "I promise" changes the normative landscape. Below are the requirements, ranked by their stability.

  **1. The Normativity Requirement (Non-Negotiable)**
  *   **The Requirement:** The theory must explain why a promise creates an *obligation* (a reason for action independent of desire), not just a prediction of behavior.
  *   **The Case:** If I say, "I predict I will help you," and fail, I am inaccurate. If I say, "I promise I will help you," and fail, I am *wronged* you. The account must distinguish being mistaken from being blameworthy.
  *   **Status:** **Non-Negotiable.** Any theory that reduces promising to mere probability (e.g., "I'm 90% likely to do this") fails to capture the basic grammar of our moral lives.

  **2. The Waiver Requirement (Non-Negotiable)**
  *   **The Requirement:** The obligation must be owed *to the promisee*, such that the promisee can release the promisor from it.
  *   **The Case:** If I promise to meet you for lunch, but you text me saying, "Don't worry about it, I'm busy," my obligation dissolves. If the obligation were a free-floating moral duty (like "do not kill"), you couldn't waive it.
  *   **Status:** **Non-Negotiable.** This distinguishes promises from general duties of beneficence.

  **3. The Immorality Bar (Non-Negotiable)**
  *   **The Requirement:** One cannot create a binding obligation to perform an inherently immoral act.
  *   **The Case:** The Promise to Kill. If I promise to help you bury a body you murdered, I am not obligated to keep that promise. In fact, I am obligated to break it.
  *   **Status:** **Non-Negotiable.** A theory that says "promises bind regardless of content" is morally monstrous. The obligation must be defeasible by higher-order moral truths.

  **4. The Context Sensitivity Requirement (Non-Negotiable)**
  *   **The Requirement:** The theory must explain why identical words create obligations in some contexts but not others.
  *   **The Case:** The Joke/Game. If we are acting in a play, or I say "I promise to give you my kidney" while we are both laughing at a dinner party, no obligation is created.
  *   **Status:** **Non-Negotiable.** This kills any theory that treats promising as a magical incantation where the words alone do the work regardless of intent or uptake.

  **5. The Volitional Quality Requirement (Non-Negotiable)**
  *   **The Requirement:** The act creating the obligation must be voluntary in a robust sense.
  *   **The Case:** The Coerced Promise. If you hold a gun to my head and say, "Promise to pay me $10,000," and I do, I am not obligated to pay.
  *   **Status:** **Non-Negotiable.** This distinguishes promises from commands or threats. It requires a theory of *valid* consent, not just *expressed* consent.

  **6. The Reliance Independence Requirement (Contested)**
  *   **The Requirement:** The obligation must persist even if the promisee does not rely on the promise, suffer harm from its breach, or remember it.
  *   **The Case:** The Forgotten Promise. I promise to send you a book. You immediately forget I made the promise and form no expectations. I fail to send it. Intuition says I still owe you an apology/obligation, even though your expectations weren't violated.
  *   **Status:** **High Stability, but Camp Prejudice Exists Here.**
      *   *Genuine:* Our practice treats the *act* of promising as binding, not the *consequence* of promising.
      *   *Prejudice:* The claim that reliance is *never* relevant is a prejudice. While reliance isn't necessary for the obligation to *exist*, reliance often explains the *severity* of the breach. However, the core obligation must survive zero reliance.

  **7. The Reductionist Prohibition (Camp Prejudice)**
  *   **The Requirement:** (Often claimed by Utilitarians) The obligation must be reducible to general welfare or harm prevention.
  *   **Status:** **Prejudice.** This is a philosophical commitment, not a datum of the practice. We often feel bound by promises that produce slightly less utility than breaking them (e.g., returning a trivial item to a person who won't notice it's missing). Demanding reductionism distorts the phenomenon to fit the theory.

  **8. The Pure Will Prohibition (Camp Prejudice)**
  *   **The Requirement:** (Often claimed by Kantians) The obligation must stem entirely from the internal act of will, independent of social convention.
  *   **Status:** **Prejudice.** Promising is a linguistic social practice. A theory that ignores the conventional rules of the "language game" of promising cannot explain how we recognize a promise in the first place.

  ---

  ### Part II: The Discriminating Cases

  Here is how the specific cases you requested function as filters. I have stated the "Right Answer" based on the non-negotiable desiderata above.

  **1. The Forgotten Promise**
  *   **The Scenario:** I promise to call you. You forget I promised immediately. I don't call.
  *   **The Right Answer:** I am still bound (or rather, I have breached an obligation), even though you had no expectation.
  *   **Who Gets It Wrong:** **The Reliance/Expectation Account.** (e.g., Fuller, Perdue). If obligation is grounded in protecting the promisee's reliance interests, and there is zero reliance, there is zero obligation. This theory must claim I did nothing wrong, which contradicts our intuition that I broke my word.
  *   **The Source of Obligation:** The normative power of the speech act itself, grounded in a convention that allows agents to bind their future selves.

  **2. The Joke or Game Promise**
  *   **The Scenario:** I say "I promise" during a poker game or a comedy sketch.
  *   **The Right Answer:** I am not bound.
  *   **Who Gets It Wrong:** **The Literalist Speech-Act Account.** If the obligation arises solely from the conventional meaning of the words uttered, then joking promises should bind. The theory fails unless it incorporates an "illocutionary intent" clause (i.e., you must *intend* to undertake an obligation).
  *   **The Source of Non-Obligation:** Lack of serious illocutionary intent or lack of conventional uptake.

  **3. The Immoral Promise**
  *   **The Scenario:** I promise to help you commit a fraud.
  *   **The Right Answer:** I am not bound; the promise is void *ab initio*.
  *   **Who Gets It Wrong:** **The Absolute Convention Account.** Any theory that views the practice of promising as a self-contained system of rules (like chess) without an external moral check will struggle to explain why the "move" is invalid.
  *   **The Source of Non-Obligation:** Overriding moral duty. Promissory obligation is a *pro tanto* duty, not an absolute one.

  **4. The Coerced Promise**
  *   **The Scenario:** "Promise or I shoot."
  *   **The Right Answer:** I am not bound.
  *   **Who Gets It Wrong:** **The Pure Consent/Will Account (if undefined).** If the theory says "you said the words, so you willed it," it fails. It must distinguish between *expressing* a will and *forming* a will freely.
  *   **The Source of Non-Obligation:** Defective volition. The will was bypassed or overborne, so the normative power was not successfully triggered.

  ---

  ### Part III: The Inconsistent Subset (The Trilemma)

  Here is the hard result. There is a subset of these desiderata that creates a severe tension, bordering on incompatibility, given how we actually treat promises. I call this **The Triad of Promissory Security.**

  1.  **Subjective Volition:** Obligation requires the promisor's actual internal intent to bind themselves (handles Jokes/Coercion).
  2.  **Objective Security:** The promisee must be able to rely on the promise without access to the promisor's internal mental state (handles Social Practice).
  3.  **Reliance Independence:** The obligation holds even if the promisee doesn't actually rely (handles Forgotten Promise).

  **The Conflict:**
  If you prioritize **Subjective Volition (1)**, you undermine **Objective Security (2)**. If my obligation depends on my secret intent, you (the promisee) can never be sure you have a promise. I could always claim, "I was joking internally," even if I sounded serious.
  If you prioritize **Objective Security (2)** (e.g., "If it sounds like a promise, it is one"), you undermine **Subjective Volition (1)**. You might be bound by jokes or coerced utterances that *sounded* serious but weren't voluntarily undertaken.
  **Reliance Independence (3)** exacerbates this. If we can't look at reliance to settle the matter (because reliance might be zero), we are forced to choose between the Promisor's Mind (1) and the Promisee's Ears (2).

  **The Verdict:**
  No theory satisfies all three perfectly without ad-hoc patches. We have to cut one.

  **The Least Bad Cut:**
  Drop strict **Subjective Volition (1)** in favor of **Reasonable Volition.**
  *   **Why:** We cannot build a social practice on mind-reading. The standard must be: "Did the promisor voluntarily place themselves in a situation where a reasonable person would understand them to be undertaking an obligation?"
  *   **The Cost:** This means there are edge cases where a promisor feels they didn't intend to bind themselves (a private joke that sounded serious), but they are bound anyway because they were negligent with their words. This is the price of having a language that allows us to bind the future. We sacrifice the promisor's perfect internal sovereignty for the promisee's external security.

  ---

  ### Part IV: Scorecard of Contenders

  Here is how the main theories stack up against the Non-Negotiable Desiderata and the Trilemma.

  **1. The Reliance/Expectation Story (e.g., Atiyah)**
  *   **Score:** **Fails.**
  *   **Why:** It collapses the distinction between promising and predicting. It cannot handle the **Forgotten Promise** (Desideratum 6). If I promise and you forget, you have no reliance interest to protect, so on this view, I haven't wronged you. This contradicts the core intuition of fidelity.
  *   **Trilemma:** Solves Security, but sacrifices Normativity and Independence.

  **2. The Agreement/Consent Story (e.g., Kant, Rawls)**
  *   **Score:** **Passes with Difficulty.**
  *   **Why:** It handles **Coercion** and **Jokes** well (no valid consent). It handles **Normativity** well (autonomy creates duty). However, it struggles with **Objective Security**. If the obligation rests on my will, how do you know I'm bound? It risks making promising too private. It also struggles to explain why the *practice* matters, treating it as purely individualistic.
  *   **Trilemma:** Solves Volition, but struggles with Security.

  **3. The Speech-Act/Convention Story (e.g., Searle, Tamar Schapiro)**
  *   **Score:** **Best Fit.**
  *   **Why:** It explains **Normativity** (constitutive rules create new statuses) and **Objective Security** (public conventions). It handles the **Forgotten Promise** easily (the act was performed, the rule triggered). It handles **Jokes** by appealing to "felicity conditions" (the context must be appropriate).
  *   **Trilemma:** It navigates the Trilemma by adopting the "Reasonable Volition" cut. It admits that if you misuse the convention (even accidentally), you may be bound, because the convention belongs to the public, not just you.
  *   **Weakness:** It needs an external moral plug-in to handle the **Immorality Bar** (why can't the convention generate a duty to kill?).

  ---

  ### Part V: Meta-Reflection and Falsification

  **Where My Reasoning Is Most Likely to Fail:**
  My reasoning rests heavily on the intuition regarding the **Forgotten Promise** (Desideratum 6). I have treated it as a non-negotiable datum: *If you promise and the promisee forgets, you are still bound.*

  **What Would Change My Mind:**
  If you can persuade me that the **Forgotten Promise** does *not* generate an obligation, the Trilemma dissolves, and the Reliance Theory becomes viable.
  *   **The Press:** Argue that in the Forgotten Promise case, the "obligation" I feel is merely a guilt reflex or a concern for my own character, not a duty *owed to the promisee*. If I can show that the promisee has no standing to complain (because they don't care and didn't rely), then the obligation is not interpersonal.
  *   **The Revision:** If the Forgotten Promise intuition is false, then **Reliance Independence** is a prejudice. If we drop that, we can satisfy Subjective Volition and Objective Security much more easily. We can say: "You are only bound if the other person actually enters a state of expectation."

  **Why I Resist That Revision:**
  Because it makes the *words* of the promise irrelevant. If the obligation only kicks in when you rely, then saying "I promise" adds nothing over saying "I intend to." The whole point of the practice is to *create* a right in another person before they rely. If I have to wait for you to rely before I'm bound, I haven't given you security; I've just predicted my behavior. Therefore, I hold that the Forgotten Promise intuition is the anchor. If that goes, the concept of promising as a distinct normative tool goes with it.

  **Final Word:**
  The binding force of a promise is a normative power granted by a social convention, triggered by a voluntary act, but judged by an objective standard. We sacrifice the promisor's perfect internal control to purchase the promisee's security. That is the deal. Any theory that tries to get the security without the sacrifice is selling magic.
