  **The Three Lines (Units of Experience per Week's Protein)**
  1.  **Unpleasant (Farmed):** Beef 100 | Chicken 150 | Lentils 0
  2.  **Pleasant (Farmed):** Beef 80 | Chicken 20 | Lentils 0
  3.  **Wild Term (Avoided Suffering):** Beef 90 | Chicken 90 | Lentils 0

  **Conclusions**
  *   **Bea (Total Utility):** Counts Lines 2 and 3 against Line 1. Beef: (-100 + 80) + 90 = +70. Chicken: (-150 + 20) + 90 = -40. Lentils: 0. **Verdict:** Buy Beef.
  *   **Nils (Negative Utility):** Counts Line 3 against Line 1 only; Line 2 is zero. Beef: -100 + 90 = -10. Chicken: -150 + 90 = -60. Lentils: 0. **Verdict:** Buy Lentils.

  ***

  **1. The Algebra and the Driver**
  The condition is **L3 < L1 < (L3 + L2)**. The quantity doing the work is **L2 (Pleasant Experience)**; it is the only variable that differs between the two calculi. If you double L2, Bea's margin for buying beef widens but Nils's verdict remains unchanged; if you halve L2, Bea's net utility flips to negative and she joins Nils at the lentils, proving her verdict rests entirely on the credit she assigns to the steer's pleasure.

  **2. The Chicken's Status**
  The chicken loses on both views (Bea: -40, Nils: -60). If the chicken's wild-term (L3) were higher due to more intensive cropping killing more voles, it could theoretically win on Bea's view; the smallest change to demote it is reducing the crop-yield per hectare, which lowers the vole-displacement benefit per unit of protein, ensuring the chicken's high suffering (L1) is never offset.

  **3. The Hostile Reader**
  A hostile reader will assume **Line 3 (The Wild Term)** is doing the work, suspecting a "rewilding trick" where Bea justifies farming by inventing suffering wild animals. That reader would be **wrong**; Line 3 favors beef on *both* views and does not separate the characters. The separation is caused entirely by Line 2, which the reader may overlook because it seems morally irrelevant compared to the ecological speculation of Line 3.

  **4. Nils's Objection and Dialogue**
  Nils's strongest objection attacks the **epistemic stability of Line 3**. He does not argue that pleasure doesn't count (his view); he argues that Bea is betting known cow suffering against hypothetical vole suffering, making her ledger speculative where his is concrete. The soft spot is indeed where guessed: the wild term is the pivot, but the *justification* for counting pleasure (Line 2) is what allows that pivot to move the needle.

  "You're betting on voles suffering more than cows to justify eating cows."
  "And you're betting their pleasure counts for nothing just because it's hard to weigh."
