prompt: |-
  Quick context so you know what I'm optimizing for: I'm the in-house philosopher at a small foundation that makes maybe eight to twelve big bets a year — the hits-based giving style, where most grants go to zero and one or two are suppose to carry the whole thing — plus a boring hedge portfolio that's meant to keep the lights on. Decisions get made by a committee of five, and for a while now we've been using risk-weighted expected utility as our working framework, the Buchak-style one where you list outcomes worst-to-best and weight each increment by a risk function applied to the cumulative probability of doing at least that well: REU(a) = x1 + sum over i>1 of r(P(X >= xi)) * (xi - x_{i-1}), with convex r buying you risk aversion without bending the utility function. That last feature is most of why we liked it — we can be cautious about gambles without signing up for the weird large-stakes implications you get out of a concave u.

  I've got about eighteen months of protected time coming up: a fellowship, basically me and a whiteboard, no RA, no data collection, and no appetite in the org for anything that smells like an empirical project run on staff. I want to spend it on the one or two foundational questions in this area where progress would actually change what we recommend, not on the question that would be most fun to write a paper about. So give me a ranked agenda.

  The things I keep circling, roughly in the order they worry me, though I don't trust my own ordering:

  1. r is global. One function over the whole cumulative-probability scale, so if we tune it to be sensibly cautious about a 60/40 grant call, we've also committed ourselves to damping long shots with tiny probabilities — which is exactly the case the whole strategy is built around. Is there a coherent stake-sensitive or local version, something with more than one parameter, or does letting r vary by stake size or outcome region cost you whatever made the framework attractive in the first place?

  2. Level of application. Should the committee apply r once, at the level of the portfolio, and be straight expected-value maximizers underneath? Or at each individual decision? Applying it at both levels looks like double-counting caution to me, but I can't say why in a way that survives pushback from the others.

  3. We're five people with genuinely different risk functions. I'm not sure the framework has anything to say when the decision-maker is a committee, and I can't tell whether that's a tractable gap or a sign we picked up the wrong tool. Is there an aggregation story worth trying to reconstruct, or does the whole approach only make sense for a single agent?

  4. Our probabilities are contested. Most of our arguments are about the distribution, not about the risk attitude, and the rank-dependent machinery needs a precise distribution to even get going. Does risk-weighting do any work when the input probabilities themselves are up for grabs, or is that a separate problem I should stop trying to fold in?

  5. A sanity check that might sink the rest: for numbers in the range we actually see, how often does plugging in something like r(p) = p^2 flip a decision relative to plain EU? If the honest answer is almost never, then the right use of eighteen months might be something else entirely, and I'd rather find that out now.

  What I want is the ordering and the reasoning behind it: what you're counting as importance here (my own candidate: would the answer change a check we write), what's genuinely tractable for one philosopher with no data, which of these is upstream of which, which ones are philosophers' playgrounds that wouldn't move practice at all, and what kind of result or argument over the next couple of years would move something up or down the list. Please don't just describe the state of the literature at me — I can look that up myself. Tell me what to work on and what to drop, and say which of my five I've mis-ranked.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User and Context:**
      *   **Role:** In-house philosopher at a small foundation.
      *   **Strategy:** Hits-based giving (8-12 big bets/year, most fail, 1-2 carry) + boring hedge portfolio.
      *   **Decision Mechanism:** Committee of 5.
      *   **Current Framework:** Risk-Weighted Expected Utility (REU), specifically Buchak's formalism ($REU(a) = x_1 + \sum_{i>1} r(P(X \ge x_i)) \cdot (x_i - x_{i-1})$).
      *   **Motivation for REU:** Separates risk attitude ($r$) from utility ($u$), allowing risk aversion without diminishing marginal utility of money (crucial for hits-based giving where large stakes matter).
      *   **Resources:** 18 months protected time (fellowship), solo work (no RA, no data), no appetite for empirical projects.
      *   **Goal:** A ranked research agenda of 1-2 foundational questions where progress would *change recommendations* (write checks differently), not just be intellectually fun.
      *   **Input:** 5 specific worries/questions provided by the user.

  2.  **Evaluate the 5 Worries (Initial Assessment):**

      *   *Worry 1 (Global vs. Local $r$):* Buchak's $r$ is global. If $r$ is convex (risk-averse), it punishes low-probability high-impact events heavily. This directly conflicts with "hits-based giving" which relies on low-probability high-impact events. If $r$ is too conservative, it kills the strategy. *High Impact.*
      *   *Worry 2 (Level of Application):* Portfolio vs. Grant level. If you apply risk aversion at the grant level *and* the portfolio level, you are indeed double-counting. But if you only apply it at the portfolio level, individual grant evaluations become EU maximizers, which might feel counterintuitive to committee members. *High Impact on process, medium on outcomes.*
      *   *Worry 3 (Committee Aggregation):* 5 people, 5 risk functions. Social choice theory meets REU. If you can't aggregate $r$, the framework fails at the point of decision. *High Impact on legitimacy/implementation.*
      *   *Worry 4 (Contested Probabilities):* REU needs precise probabilities. If probabilities are vague/contested, does REU add value over robustness checks? *Medium Impact. Might be a distraction.*
      *   *Worry 5 (Sanity Check/Empirical):* Does $r(p) = p^2$ actually flip decisions compared to EU in *this specific context*? If not, the whole framework is decorative. *Critical Gatekeeper.*

  3.  **Determine Ranking Criteria:**
      *   **Actionability:** Will the answer change a check written?
      *   **Tractability:** Can one philosopher solve this in 18 months without data?
      *   **Upstream/Downstream:** Which questions must be answered before others make sense?
      *   **Existential Risk:** Which question, if answered negatively, kills the framework entirely?

  4.  **Drafting the Ranking & Reasoning:**

      *   *Top Priority:* **Worry 5 (The Sanity Check).**
          *   *Why:* If REU doesn't diverge from EU in the specific parameter space of hits-based giving (low prob, high impact), the whole 18-month project is wasted. It's the "is the engine running?" question.
          *   *Tractability:* High. It's modeling/simulation, not empirical data collection.
          *   *Impact:* Binary. If "No divergence," stop using REU. If "Divergence," proceed.
          *   *Correction:* The user ranked this last. I need to argue strongly for moving it to #1.

      *   *Second Priority:* **Worry 1 (Global vs. Local $r$).**
          *   *Why:* This is the core theoretical tension. Hits-based giving *requires* tolerance for low-probability events. Standard REU (convex $r$) penalizes them. If you can't solve this, REU is incompatible with the strategy.
          *   *Tractability:* Medium/Hard. Requires formal work on variable risk weights or stake-sensitive risk.
          *   *Impact:* High. Determines the *shape* of the risk function used.

      *   *Third Priority:* **Worry 2 (Level of Application).**
          *   *Why:* Once you know *what* function to use (Worry 1) and *that* it matters (Worry 5), you need to know *where* to apply it. Portfolio vs. Grant level is a structural decision.
          *   *Tractability:* Medium. Conceptual/Decision-theoretic analysis.
          *   *Impact:* High on process, prevents double-counting errors.

      *   *Fourth Priority:* **Worry 3 (Committee Aggregation).**
          *   *Why:* Important for buy-in, but technically you can average utilities or use a representative agent. It's a "political/implementation" problem more than a "foundational decision theory" problem.
          *   *Tractability:* Hard (Social choice is messy).
          *   *Impact:* Medium. You can usually fudge this with deliberation even if the math isn't perfect.

      *   *Fifth Priority:* **Worry 4 (Contested Probabilities).**
          *   *Why:* This is a problem for *any* framework (EU, REU, Maximin). REU doesn't solve ambiguity. Folding it in complicates the model without solving the core tension.
          *   *Tractability:* Low (requires ambiguity models).
          *   *Impact:* Low. Treat probabilities as inputs; don't make the risk framework do probability's job.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *On Worry 5:* I need to be careful. The user says "no appetite for empirical project." A sanity check on *numbers* might sound empirical. I need to frame it as *theoretical modeling* using their historical distribution estimates, not new data collection. It's a sensitivity analysis.
      *   *On Worry 1:* Buchak explicitly argues against stake-sensitive risk weights because it violates certain axioms (like Reduction of Compound Lotteries or similar structural constraints). I need to highlight that solving this might mean *leaving* Buchak's specific REU for a more general Rank-Dependent Utility (RDU) or something else. The user needs to know if they are breaking the tool they like.
      *   *On Worry 2:* This is actually a correlation problem. If grants are independent, portfolio variance drops. If correlated, it doesn't. REU handles correlation differently than EU. This is crucial for the "hedge portfolio" + "hits" mix.
      *   *On Worry 3:* There is literature on "Group REU." But practically, if they can't agree on $r$, they should agree on a mandate. This is less "philosophical breakthrough" and more "governance."

  6.  **Developing the "Move the Needle" Conditions:**
      *   For each item, what result changes practice?
      *   *Worry 5:* If REU ~ EU for tail events, drop REU.
      *   *Worry 1:* If local $r$ is incoherent, adopt a two-tier framework (EU for tail, REU for core?).
      *   *Worry 2:* If portfolio-level is correct, stop scoring individual grants with risk penalties.

  7.  **Final Review against User Constraints:**
      *   *18 months solo:* Keep it theoretical/formal.
      *   *Change checks written:* Focus on the tension between risk-aversion and hits-based strategy.
      *   *Don't describe literature:* Focus on the decision tree.
      *   *Re-rank:* Explicitly state where the user got it wrong (likely #5 and #1).

  8.  **Constructing the Output:**
      *   **Executive Summary:** The re-ranking.
      *   **The Agenda (1-5):** Detailed reasoning, tractability, and "what changes."
      *   **The "Kill Switch":** When to stop.
      *   **Methodological Note:** How to do this without data.

      *(Self-Correction during drafting)*: I need to be very sharp on Worry 1. The user likes Buchak because it keeps $u$ linear. If they make $r$ local/stake-sensitive, they might violate the axioms that make REU normatively attractive (like Comonotonic Independence). I need to point out that fixing Worry 1 might break the "no bending utility" benefit. That's a critical trade-off.

      *(Refining Worry 5)*: The user calls it a "sanity check." I need to elevate it to "Existential Validation." If the risk function doesn't bite in the tail, the framework is inert.

      *(Refining Worry 2)*: This is about *correlation*. If the 8-12 bets are correlated, portfolio risk is higher. REU at the portfolio level captures this; REU at grant level does not. This is the strongest argument for Portfolio-Level application.

      *(Refining Worry 3)*: Don't spend 18 months on social choice theory. Suggest a "Representative Risk Function" approach as a pragmatic stopgap.

      *(Refining Worry 4)*: Dismiss this. Ambiguity aversion is a different beast. Don't conflate risk (known probs) with ambiguity (unknown probs).

      *Final Plan:*
      1.  Promote #5 to #1 (Existential).
      2.  Keep #1 as #2 (Theoretical Coherence).
      3.  Keep #2 as #3 (Structural Application).
      4.  Demote #3 to #4 (Governance vs. Theory).
      5.  Demote #4 to #5 (Category Error).

