  # Activity: The Continuity Tribunal

  ## Setup and Materials
  *   **Room:** Single seminar table or U-shape configuration. No podium.
  *   **Materials:** 
      *   14 printed "Adjudicator Packets" (containing Statute Version 1, Docket Cases 1–5, Verdict Sheets).
      *   14 index cards and pens (for the Private Rule).
      *   1 printed "Statute Version 2" handout (distributed only at Minute 55).
      *   Visible timer (projected or physical).
  *   **Seating:** All students face inward as a single bench. No audience seating.
  *   **Timing Apparatus:** A loud kitchen timer or phone alarm for hard stops.

  ## Roles
  *   **The Adjudicators (14 Students):** Collective decision-makers. They must reach a majority verdict (8/14) for each case. They are forbidden from using metaphysical terminology (self, soul, reductionism, aggregates) during deliberations. They must refer only to "the subject," "the stream," or "the designation."
  *   **The Facilitator (Instructor):** Court Clerk. Distributes materials, starts/stops timers, records vote counts on the board. Speaks only to enforce procedure or read the Private Rule at the end. No doctrinal instruction until the Debrief.

  ## The Statute Clauses
  *   **Statute Version 1 (The Continuity Code):**
      *   *Clause 1:* "Liability and entitlement attach to the subject who maintains psychological connectedness with the past actor or claimant." **[Gap: Degree of connectedness undefined.]**
      *   *Clause 2:* "Where subjects divide, entitlements are suspended until identity is resolved." **[Gap: No mechanism for resolution provided.]**
      *   *Clause 3:* "Verdicts are final upon issuance." **[Gap: Conflicts with future metaphysical changes.]**
  *   **Statute Version 2 (The Ultimate Reality Code):**
      *   *Clause 1:* "Liability and entitlement attach only to what is ultimately real." **[Gap: 'Ultimately real' is undefined but implies exclusion of conventions.]**
      *   *Clause 2:* "Designated entities have no standing." **[Gap: Erases the legal person.]**

  ## Minute-by-Minute Timeline
  *   **00–05:** **Setup.** Distribute Packets (Statute V1 + Cases 1 & 2). Explain voting rules (majority required). No lecture.
  *   **05–20:** **Docket Part 1.** Case 1 (Gradual Replacement) and Case 2 (Fission/Heirloom). Deliberate and Vote.
  *   **20–25:** **Private Rule.** Students write one sentence on an index card: "I am the same person as my past/future self if ______." Collect cards.
  *   **25–45:** **Docket Part 2 (The Core).** Case 3 (Fission/Fusion/Crime). Deliberate and Vote. Must address retroactivity of earlier verdicts.
  *   **45–55:** **Trap Cases.** Cases 4 (Universal Self) and 5 (No Victim). Rapid fire votes.
  *   **55–65:** **Statute Switch.** Distribute Statute V2. Re-hear Case 3 only under new rules. Vote.
  *   **65–75:** **Rule Defense.** Return Index Cards. Any student whose final votes contradict their Private Rule must stand and defend the change for 2 minutes.
  *   **75–90:** **Debrief.** Instructor breaks silence. Connect activity to Parfit vs. Buddhist No-Self.

  ## The Docket
  *   **Case 1 (The Slow Swap):** Subject A undergoes medical replacement of memory and tissue over 40 years. At Year 40, A claims a pension earned at Year 0.
      *   *Forced Choice:* Pay or Deny.
  *   **Case 2 (The Split):** Subject A divides into Lefty and Righty. A single family heirloom is at stake. Both claim it.
      *   *Forced Choice:* Give to Lefty, Give to Righty, Split, or Destroy.
  *   **Case 3 (The Merge):** A divides into Lefty and Righty. Lefty commits a tort. Ten years later, Lefty and Righty fuse into New A. New A remembers both streams.
      *   *Forced Choice:* Is New A liable? Was the Tribunal's silence in Case 2 (regarding identity) correct at the time, or wrong in hindsight?
  *   **Case 4 (Trap - Absurdity):** Claimant argues that because all aggregates are interdependent, the Debtor and Creditor are ultimately one entity. Debt should be cancelled.
      *   *Forced Choice:* Cancel Debt or Enforce Debt.
  *   **Case 5 (Trap - Callousness):** Claimant argues that because the Victim was merely a designation of aggregates, no ultimate harm was done. No compensation owed.
      *   *Forced Choice:* Compensate or Dismiss.

  ## The Debrief
  *   **Separating the Views:** 
      *   *Reductionism (Parfit):* Admits identity is not what matters, but *survival* (Relation R) does. It keeps the conventional person intact for practical reasons. The "further fact" is denied, but the convention is kept.
      *   *No-Self (Buddhism):* Denies the convention has *any* ultimate footing. It is not that the answer is unknown; it is that the question ("Who is liable?") presupposes an owner that doesn't exist.
  *   **The Divergence:** 
      *   Reductionism says: "There is no deep self, so let's maximize well-being using conventional persons."
      *   No-Self says: "There is no deep self, so clinging to 'my' liability or 'my' reward is the source of suffering. Act out of compassion, not ownership."
  *   **The Mistaken Picture:** The texts set aside the question of "Who survives?" not because it is hard, but because answering it (Yes or No) entrenches the idea that there *could* be a "Who."
  *   **What Changes:** For the Reductionist, nothing changes in practice. For the Buddhist practitioner, the *grasp* changes. One stops taking the aggregates as "mine." The activity showed that without "mine" (Convention), the Court (Function) collapses (Statute V2 failure).

  ***

  (i) Pressure Point Table

  | Moment in the activity | What students will just have done | The claim about persons this puts pressure on | The most likely line of resistance | What it costs to resist it there |
  | :--- | :--- | :--- | :--- | :--- |
  | **Case 1 (Gradual)** | Verified pension for 40-year replacement. | Identity persists through total material change. | "It's still the same stream of memory." | Requires accepting psychological continuity as sufficient for identity, ignoring material break. |
  | **Case 2 (Fission)** | Forced to split or destroy the heirloom. | Identity is one-to-one. | "Both are equally him, so split the good." | Admitting identity can be one-to-many breaks the logic of exclusive ownership. |
  | **Case 3 (Fusion)** | Ruled on liability for fused person. | Identity is temporally stable. | "The fusion makes them one, so liability merges." | Accepting that future events (fusion) change past moral status (liability of Lefty). |
  | **Statute Switch** | Re-heard Case 3 under 'Ultimate Reality'. | Conventional persons have legal standing. | "If persons aren't real, no one can be liable." | The legal system becomes impossible; function collapses without convention. |
  | **Rule Defense** | Read their private identity rule. | Personal consistency is possible. | "I changed my mind based on new facts." | Admitting their core sense of self is malleable under philosophical pressure. |

  ***

  (ii) JSON Object

