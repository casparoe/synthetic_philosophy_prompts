      *   **Alignments:** Rawls on moral arbitrariness is correct. Nozick on self-ownership is correct.
      *   **Conflations:** "Moral worth" vs. "Economic contribution." "Desert" vs. "Entitlement." Rawls' "Difference Principle" vs. "Strict Equality."
