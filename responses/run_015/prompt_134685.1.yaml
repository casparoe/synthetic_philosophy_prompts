prompt: |-
  hey, i need this for work. i'm the voting-integrity officer for a transboundary river-basin authority that runs binding referendums on dam removals and flow allocations. we adopted the principle that anyone who bears a non-substitutable risk from the outcome belongs to the demos for that vote. in practice it's chaos: seasonal workers, tribal nations with seperate governments, trustees for future generations, and feedback loops where who votes actually changes who gets hurt. i need a reusable decision procedre my staff can run in about 20 minutes per proposal, with ordered questions, what evidence is enough at each step, hard stops ('exclude'), soft stops ('i have to sign off personally because this is a values call'), and explicit flags for self-reference loops -- like if being affected depends on who is already in the demos. apply it to three cases: a migrant farmworker on a 6-month lease, a tribal council with treaty rights and its own elections, and a trustee representing unborn residents. include one where the answer comes out wrong by our lights. also say straight up what the procedure cant settle and where it will misfire. my staff arent philosophers, so keep it grounded and dont ask for reading lists or citations -- i dont have access to that stuff.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Voting-Integrity Officer for a transboundary river-basin authority.
      *   **Task:** Create a reusable decision procedure (checklist/flowchart style) to determine voter eligibility (the "demos") for binding referendums on dam removals and flow allocations.
      *   **Core Principle:** "All Affected Interests" (AAI) variant: Anyone bearing a *non-substitutable risk* from the outcome belongs to the demos.
      *   **Problem:** Current implementation is chaotic (seasonal workers, tribal nations, future generations, feedback loops).
      *   **Requirements:**
          *   Run time: ~20 minutes per proposal.
          *   Structure: Ordered questions, evidence standards, hard stops (exclude), soft stops (escalate to Officer), flags for self-reference loops.
          *   Application: Test on three cases (Migrant Farmworker, Tribal Council, Trustee for Unborn).
          *   Constraint: Include one case where the procedure yields a "wrong" answer (by the user's lights).
          *   Limitations: Explicitly state what the procedure *can't* settle and where it will misfire.
          *   Tone/Style: Grounded, operational, no philosophy jargon, no reading lists/citations.

  2.  **Deconstruct the Core Principle ("Non-Substitutable Risk"):**
      *   *Risk:* Probability of harm/loss.
      *   *Non-Substitutable:* Can't be easily compensated or avoided by moving/changing jobs. It's tied to their specific existence/location/identity.
      *   *Operationalizing this:* Need to check causality, magnitude, and substitutability.

  3.  **Drafting the Procedure (The "20-Minute Protocol"):**
      *   *Goal:* Keep it linear and binary where possible.
      *   *Sections:*
          1.  Causality (Does the vote change their reality?)
          2.  Substitutability (Can they avoid the harm easily?)
          3.  Sovereignty/Overlap (Are they already represented?)
          4.  Temporal/Loop Checks (Future/Self-reference).
      *   *Stops:*
          *   *Hard Stop (Exclude):* Clear failure of criteria.
          *   *Soft Stop (Escalate):* Ambiguity, values conflict, sovereignty clash.
          *   *Red Flag:* Self-reference loops.

  4.  **Developing the Test Cases:**
      *   *Case 1: Migrant Farmworker.* 6-month lease. High dependency on water for crops/jobs. But transient.
          *   *Analysis:* Risk is high (livelihood), but is it non-substitutable? If they leave, do they lose *this* specific livelihood or just *a* livelihood? Let's make the procedure exclude them based on "duration of exposure" vs. "permanence of risk" to satisfy the "one wrong answer" requirement.
      *   *Case 2: Tribal Council.* Treaty rights. Sovereign entity.
          *   *Analysis:* High risk (treaty rights, cultural survival). But they have their own government. Do they vote in *our* referendum or is it govt-to-govt? This is a classic sovereignty clash. Good candidate for a "Soft Stop/Escalate."
      *   *Case 3: Trustee for Unborn.* Future generations.
          *   *Analysis:* Risk is non-substitutable (they can't exist elsewhere). But they can't vote. Trustee acts for them. This is a "Soft Stop" because appointing trustees is a values call, not just empirical.
      *   *The "Wrong Answer" Case:* The prompt asks to apply the procedure to three cases and *include one where the answer comes out wrong by our lights*. I need to ensure the procedure spits out a result that the Officer (user) would intuitively reject.
          *   *Decision:* I will tune the procedure to be strict on "residency/duration" to make it fast. This will likely exclude the Migrant Farmworker. Intuitively, under "All Affected Interests," a worker whose livelihood is destroyed by flow allocation *should* vote. If the procedure excludes them based on lease length, that's the "wrong" answer.

  5.  **Refining the Procedure (Iterative Polish):**
      *   *Make it look like a form.*
      *   *Evidence:* What can staff actually grab? (Leases, maps, employment contracts, hydrological models).
      *   *Loops:* Need a specific question about "Does granting vote change the risk profile?"
      *   *Limitations:* Be honest. This is a heuristic, not a moral truth machine.

  6.  **Addressing Specific Constraints:**
      *   *No Philosophy:* Avoid terms like "normative," "ontological," "discursive." Use "values," "facts," "rules."
      *   *Time:* 20 minutes means max 10-12 questions.
      *   *Self-Reference:* Explicitly flag this.

  7.  **Final Review against Prompt:**
      *   Reusable decision procedure? Yes.
      *   ~20 mins? Yes (short checklist).
      *   Ordered questions? Yes.
      *   Evidence standards? Yes.
      *   Hard/Soft stops? Yes.
      *   Self-reference flags? Yes.
      *   Three cases applied? Yes.
      *   One "wrong" answer? Yes (The Farmworker).
      *   Limitations section? Yes.
      *   No citations? Yes.

  8.  **Drafting the Content (Mental Simulation):**
      *   *Intro:* Acknowledge the difficulty.
      *   *The Protocol:* "Demos Eligibility Checklist v1.0".
      *   *The Cases:* Walk through the logic.
      *   *The "Wrong" Outcome:* Highlight why the farmworker exclusion feels off.
      *   *Limitations:* Where does this break? (Sovereignty, deep time, strategic voting).

      *(Self-Correction during drafting)*: Make sure the "Soft Stop" clearly indicates *who* signs off (the Officer). Ensure the "Red Flag" for loops is distinct from a Stop.

      *(Refining the Farmworker Case)*: To make sure it counts as the "wrong" answer, I need to explicitly state in the analysis that *you* (the Officer) would likely want them included, but the tool says no. This highlights the tool's limitation.

      *(Refining the Tribal Case)*: This is tricky. If they are sovereign, do they vote as individuals or as a block? The procedure should flag this as a "Soft Stop" because it touches on international/inter-governmental relations, not just individual risk.

      *(Refining the Trustee Case)*: Future generations are the hardest. The procedure should allow the *concept* but flag the *mechanism* (who appoints the trustee?) as a Soft Stop.

  9.  **Final Polish:** Check tone. Needs to be bureaucratic but practical. "Here is the tool. Here is how it breaks. Use it anyway."

  **(Post-Drafting Check):** Did I include the self-reference loop flag? Yes, Step 4. Did I include evidence standards? Yes, in brackets. Did I keep it under 20 mins? Yes, it's a 4-step filter.

