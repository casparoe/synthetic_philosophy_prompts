answer: |-
  **MEMORANDUM**
  **TO:** Basin Authority Staff
  **FROM:** Voting-Integrity Officer
  **SUBJECT:** Demos Eligibility Protocol (DEP-v1)
  **TIME ALLOWANCE:** 20 Minutes per Proposal

  ### CONTEXT
  We operate on the **Non-Substitutable Risk Principle**: If a decision imposes a risk you cannot avoid or be compensated for, you get a vote. This protocol is not a moral truth machine. It is a triage tool to filter clear cases from complex ones. It will produce errors. Your job is to catch them using the "Soft Stops."

  ---

  ### THE PROCEDURE (DEP-v1)

  **INSTRUCTIONS:** Answer sequentially. If you hit a **STOP**, do not proceed. Mark the file accordingly.

  #### STEP 1: CAUSALITY & MAGNITUDE
  **Q1:** Does the referendum outcome (dam removal/flow change) physically or legally alter the subject's environment, assets, or legal status?
  *   *Evidence Required:* Hydrological models, legal impact statements, property maps.
  *   *If NO:* **HARD STOP (EXCLUDE).** No impact, no vote.
  *   *If YES:* Proceed to Q2.

  **Q2:** Is the impact significant? (Threshold: >10% loss of income, loss of primary water access, or legal violation of rights).
  *   *Evidence Required:* Tax records, water rights contracts, treaty text.
  *   *If NO:* **HARD STOP (EXCLUDE).** Trivial impacts do not confer voting rights.
  *   *If YES:* Proceed to Step 2.

  #### STEP 2: SUBSTITUTABILITY (THE "EXIT" TEST)
  **Q3:** Can the subject avoid this risk by moving or changing activity within 6 months without catastrophic loss?
  *   *Evidence Required:* Lease agreements, employment contracts, liquidity assets.
  *   *If YES (They can leave easily):* **HARD STOP (EXCLUDE).** Risk is substitutable.
  *   *If NO (They are locked in):* Proceed to Q4.

  **Q4:** Is the subject's presence temporary by design (e.g., seasonal contract <1 year)?
  *   *Evidence Required:* Visa status, lease duration, employment term.
  *   *If YES:* **FLAG FOR REVIEW.** (See *Limitations* below). Proceed to Step 3.
  *   *If NO:* Proceed to Step 3.

  #### STEP 3: SOVEREIGNTY & OVERLAP
  **Q5:** Does the subject belong to a recognized sovereign entity (Tribe, State, Nation) that holds collective rights to the resource?
  *   *Evidence Required:* Treaty documents, federal recognition status.
  *   *If YES:* **SOFT STOP (ESCALATE TO OFFICER).** Do not process individually. This requires government-to-government negotiation, not individual voter registration.
  *   *If NO:* Proceed to Step 4.

  #### STEP 4: TEMPORAL & LOOP CHECKS
  **Q6:** Is the subject currently living?
  *   *If NO (Future Generations):* **SOFT STOP (ESCALATE TO OFFICER).** Requires trustee appointment validation.
  *   *If YES:* Proceed to Q7.

  **Q7 (LOOP CHECK):** Does granting this subject a vote *change* the risk profile for themselves or others? (e.g., If they vote, does their legal status change such that they are no longer at risk, or does it create a new risk for a third party?)
  *   *Evidence Required:* Logical mapping of outcome scenarios.
  *   *If YES:* **RED FLAG (SELF-REFERENCE).** Escalate to Officer immediately. Do not decide.
  *   *If NO:* **ELIGIBLE.**

  ---

  ### APPLICATION TO THREE CASES

  Here is how DEP-v1 runs on your current backlog.

  #### CASE 1: The Migrant Farmworker
  *   **Profile:** 6-month lease on housing. Employed by agribusiness dependent on river flow. If flow drops, crops fail, job ends.
  *   **Step 1 (Causality):** **YES.** Flow allocation directly dictates crop viability and employment.
  *   **Step 2 (Substitutability):** **NO.** Specialized skill set, remote location. Cannot pivot easily.
  *   **Step 2 (Q4 - Temporal):** **YES.** Lease is 6 months.
  *   **Result:** **FLAG FOR REVIEW.**
  *   **Procedure Output:** Under strict reading of Q4, this leans toward **EXCLUDE** (temporary presence).
  *   **Officer Note (The "Wrong" Answer):** By our ethical lights, this is **WRONG**. The worker bears the non-substitutable risk of livelihood loss *during* the impact window, regardless of lease length. The procedure prioritizes permanence over vulnerability. **I am overriding this to INCLUDE.** The tool failed here because it conflates "residency" with "stake."

  #### CASE 2: The Tribal Council
  *   **Profile:** Sovereign nation with treaty-protected fishing rights downstream. Dam removal affects sediment/fish stocks.
  *   **Step 1 (Causality):** **YES.** Treaty rights are legally impacted.
  *   **Step 3 (Sovereignty):** **YES.** Federally recognized tribe with treaty.
  *   **Result:** **SOFT STOP (ESCALATE).**
  *   **Procedure Output:** Staff cannot register individual tribal members via this form.
  *   **Officer Note:** This is **CORRECT**. We cannot treat sovereign citizens as individual stakeholders without violating government-to-government protocols. I will negotiate a block vote or separate referendum with the Council.

  #### CASE 3: The Trustee for Unborn Residents
  *   **Profile:** An appointed NGO representing residents 50 years hence. Sediment buildup will poison aquifer in 40 years.
  *   **Step 1 (Causality):** **YES.** Long-term hydrological models confirm aquifer toxicity.
  *   **Step 4 (Q6 - Living):** **NO.** Subjects are unborn.
  *   **Result:** **SOFT STOP (ESCALATE).**
  *   **Procedure Output:** Staff cannot validate eligibility.
  *   **Officer Note:** This is **CORRECT**, but messy. The risk is non-substitutable (they cannot move to a different time), but they cannot cast a ballot. I must sign off on the *Trustee's* authority. Is the NGO truly representative? That is a values call, not an empirical one. I will approve the vote only if the Trustee is court-appointed.

  ---

  ### LIMITATIONS & MISFIRE ZONES

  This procedure is a heuristic. It will break in the following areas. Do not use it to hide from these problems.

  **1. The "Duration" Bias (Case 1 Failure)**
  *   **The Misfire:** The tool assumes long-term presence equals high stake. It excludes high-intensity, short-term vulnerability (seasonal workers, disaster refugees).
  *   **The Fix:** If Q4 is triggered, you must escalate to me. Do not auto-exclude.

  **2. The Sovereignty Blind Spot**
  *   **The Misfire:** The tool treats "Sovereign Entity" as a stop sign. It does not tell us *how* to integrate their vote.
  *   **The Fix:** This procedure determines *if* they are in the demos, not *how* they vote. Sovereign cases require separate legal frameworks outside this checklist.

  **3. The Self-Reference Loop**
  *   **The Misfire:** Sometimes, defining the demos changes the outcome, which changes who is affected. (Example: If we let downstream voters in, the dam gets removed, which hurts upstream voters who were previously safe).
  *   **The Fix:** Q7 is a tripwire. If staff identify a loop, stop. This requires a game-theory analysis, not a checklist.

  **4. The "Trustee" Problem**
  *   **The Misfire:** The procedure flags future generations but offers no method to verify the Trustee. Anyone can claim to speak for the unborn.
  *   **The Fix:** Require external validation (court order or legislative mandate) for any Trustee. Do not accept self-appointed advocates.

  **5. Strategic Manipulation**
  *   **The Misfire:** Groups may structure their leases or employment to *appear* non-substitutable to gain votes.
  *   **The Fix:** Random audits on Q3 evidence. If a pattern of "convenience risk" appears, freeze the registry.

  ### FINAL INSTRUCTION TO STAFF
  If you hit a **HARD STOP**, send the rejection notice.
  If you hit a **SOFT STOP** or **RED FLAG**, put the file on my desk.
  If you hit **CASE 1 (Seasonal/Temporary)**, assume they are **ELIGIBLE** unless I tell you otherwise. The tool is too strict on time; I am correcting for that manually until v2.

  **Signed,**
  **Voting-Integrity Officer**
