answer: |-
  ### Brainstorming & Initial Mapping

  Okay, let's unpack this. You've stumbled onto a classic tension in normative ethics, but framed through a specific religious-institutional lens. Here's how my mind is breaking it down before I commit to a reconstruction:

  1.  **The "Tainted" vs. "Dodgy" Distinction:** Why are alcohol/weapons different from exploitative labor? In Western secular ethics, both cause suffering. In Buddhist ontology, they might not be equal. Weapons and intoxicants are explicitly listed in the Five Precepts and Right Livelihood (*samma ajiva*). They are *intrinsically* linked to heedlessness (*pamada*) and direct harm (*himsa*). Exploitative labor is bad karma, but it might be viewed as "structural" or "indirect." The retreat center is drawing a line between *direct* complicity in a specific karmic violation vs. *indirect* participation in samsaric suffering.
  2.  **Consequentialism vs. Deontology:** If they were pure act-consequentialists, they'd take the alcohol money if it built a hospital that saved more lives than the alcohol ruined. They don't. So there's a constraint. But if they were pure deontologists, they wouldn't take the tech money if the labor conditions violated the spirit of non-harming. They do. So they are weighing outcomes *sometimes*. This looks like a hybrid: **Rule-Consequentialism** (follow the precepts generally because they lead to good outcomes) with **Agent-Relative Constraints** (I, as a monk, cannot touch *this* specific thing, regardless of the good it does).
  3.  **The "Cleansing" Claim:** This is the weirdest part. Karma is generally individual. If I steal money and give it to a monk, I get the karma of stealing; the monk gets the karma of receiving (which depends on his knowledge/intent). The idea that the Sangha "cleanses" the money implies a transfer of moral weight. This sounds less like orthodox karma theory and more like a sacramental view of the Sangha (the institution itself has purifying power).
  4.  **Non-Compensable Harms:** A strict consequentialist says all harms are commensurable on a single scale (utility). If the retreat center says alcohol money is "off-limits" regardless of how much good it could do, they are positing **incommensurable values**. Some harms are lexical priorities—they trump utility calculations.

  Okay, I have enough to construct the implicit theory. Let's move to the reconstruction.

  ***

  ### Reconstructing the Implicit Theory

  Based on the scenario you described, the retreat center is operating on a moral framework that I would label **Karmic Rule-Consequentialism with Agent-Centered Constraints**. It is not a consistent act-consequentialist view, nor is it a pure deontology. Here are the four philosophical commitments presupposed by their double standard:

  #### 1. The Hierarchy of Harm (Ontological, not just Quantitative)
  The center presupposes that not all suffering is morally equivalent. In classical utilitarianism, pain is pain. In this Buddhist framework, harms are stratified by their **karmic proximity** and their **obstruction to liberation**.
  *   **Alcohol/Weapons:** These are viewed as *direct* obstructions to clarity and life. They violate specific precepts (*panatipata* for weapons, *surameraya* for intoxicants). Accepting funds derived from these makes the Sangha a *direct beneficiary* of a specific karmic violation.
  *   **Exploitative Labor:** While this generates suffering, it is viewed as part of the general dukkha of samsara. Unless the monk explicitly ordered the exploitation, the connection is causal but not *karmically specific* in the same way.
  *   **Commitment:** Moral status is determined not just by the *amount* of suffering caused, but by the *type* of causal link between the agent and the harm.

  #### 2. Agent-Relative Constraints (The "Purity" Clause)
  The refusal of "tainted" money presupposes that the moral integrity of the moral agent (the Sangha) is a value independent of the outcome.
  *   If the only thing that mattered was the total suffering reduced, the monks should take the alcohol money and build ten wells. By refusing, they are saying: "There is a state of affairs (Sangha taking alcohol money) that is intrinsically worse than a state of affairs where ten fewer wells are built."
  *   **Commitment:** This is a deontological constraint embedded within a soteriological system. The monk's role is not just to maximize good, but to embody the Dharma. Becoming "tainted" undermines their efficacy as a field of merit (*punna-kkhetta*), which ironically reduces long-term consequentialist potential.

  #### 3. The "Field of Merit" Consequentialism (The Justification for Dodgy Money)
  When they accept the tech/property money, they switch to a consequentialist mode. They argue the *future use* of the funds (Dharma teaching, feeding monks) generates more merit than the demerit generated by the source.
  *   This presupposes that the moral weight of an object (money) is not fixed but is **teleologically determined**. The money becomes "good" because it is directed toward liberation.
  *   **Commitment:** Outcomes *do* matter to the moral status of an action, but only *after* agent-relative constraints (the precepts) have been satisfied. It's a two-stage process: Pass the deontological filter first, then maximize utility.

  #### 4. Asymmetric Moral Responsibility (The "Cleansing" Mechanism)
  The claim that the Sangha can "cleanse" money through use is the most philosophically loaded. It presupposes a view of moral responsibility where the **recipient's intention overrides the donor's history**.
  *   In strict karma theory, the donor owns the karma of earning the money. The monk owns the karma of receiving it.
  *   However, the center's claim implies that the Sangha acts as a **moral transformer**. By consuming the resource for a holy purpose, the negative karmic potential is neutralized or redirected.
  *   **Commitment:** Moral responsibility is not strictly individualistic; it can be communal and transactional. The "purity" of the end-use can retroactively mitigate the "stain" of the origin, provided the origin wasn't *explicitly* forbidden (like weapons).

  ***

  ### Addressing Your Specific Questions

  **1. Does it presuppose that outcomes matter to the moral status of an action?**
  Yes, but conditionally. Outcomes determine the *value* of the action once the *permissibility* is established by rules. If outcomes were the only thing that mattered, they would take the alcohol money. If outcomes didn't matter at all, they would refuse the tech money. So, outcomes matter, but they are secondary to rule-compliance.

  **2. Does it presuppose that the agent's mental state and 'purity' are independent of consequences?**
  Yes. This is the "Agent-Relative Constraint." The purity of the Sangha is treated as a good in itself, not merely as a tool for generating good consequences. However, they likely justify this instrumentally: "If we become impure, we can't teach effectively, so long-term consequences suffer." But in the moment of decision, the rule functions independently.

  **3. Can a consistent consequentialist allow that some harms are non-compensable by good outcomes?**
  Strictly speaking, **no**. A classic act-consequentialist must always choose the action with the best net outcome. If taking alcohol money saves more beings from suffering than it harms, they must take it.
  *However*, a **Rule-Consequentialist** can say this. They argue that having a rigid rule ("Never take alcohol money") produces better long-term outcomes than calculating every case, because humans are bad at calculating and prone to rationalization. So, a *sophisticated* consequentialist could hold this view, but an *act*-consequentialist could not.

  **4. What does it say about the view of moral responsibility embedded in the idea that the sangha can 'cleanse' money?**
  It suggests a **sacramental view of moral agency**. It implies that moral "stains" are not just psychological or karmic facts, but almost ontological properties that can be alchemized. It shifts responsibility from the *source* to the *flow*. It says: "The money is energy; where you direct the energy determines its moral valence." This is risky, as it can lead to moral laundering, but philosophically, it treats moral value as dynamic rather than static.

  ***

  ### Confidence Assessment

  **Confidence Level: High (85%)**
  I am confident in the moral theoretical classification (Rule-Consequentialism with Deontological Constraints). This is a standard pattern in religious ethics, particularly in Buddhism where *Sila* (rules) and *Karuna* (compassion/outcomes) often tension against each other. The distinction between direct and indirect complicity is also well-documented in Vinaya commentaries.

  **Point of Least Certainty: The "Cleansing" Mechanism**
  I am least sure about the theological validity of the claim that the Sangha can "cleanse" the money.
  *   **Why:** Orthodox Theravada karma theory is strictly individual. *Cetana* (intention) is karma. If a donor earns money through exploitation, they bear that karma. If a monk accepts it knowingly, he shares in the complicity. The idea that the *use* of the money erases the *source's* karma sounds like a modern rationalization developed by Westernized or modernist Buddhist institutions to handle the complexities of a globalized economy. It borders on a "transfer of merit" doctrine which is more Mahayana or folk-Buddhist than strict Theravada Abhidhamma.
  *   **Speculation:** I suspect the "cleansing" language is a pragmatic institutional policy dressed up in metaphysical garb to resolve cognitive dissonance, rather than a doctrine you would find in the Pali Canon. If pressed, a strict Abhidhamma scholar might say the money isn't "cleansed," but rather the *monk's* merit is generated *despite* the source, while the donor still suffers the consequences of their labor practices.

  ### Summary for Your Mate
  Tell your mate the retreat center isn't being inconsistent; they are operating on a **lexical priority system**.
  1.  **Constraint:** Do not violate specific precepts (No weapons/alcohol). This is non-negotiable (Deontological).
  2.  **Maximization:** Within the bounds of #1, maximize the good (Consequentialist).
  3.  **Rationalization:** The "cleansing" idea is the glue holding these two together, allowing them to engage with a dirty world without admitting full complicity.

  It's not pure consequentialism. It's **institutional self-preservation wrapped in karmic causality.**
