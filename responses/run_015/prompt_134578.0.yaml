answer: |-
  # Q&A Prep Sheet: The Protestant Ethic as Ontological Shift

  **Strategy Overview:** Your goal is to shift the criterion of success from *prediction* (Econ/PolSci default) to *intelligibility* (Weberian/Phil default). You must prevent the economists from spending 15 minutes disproving a claim you aren't making, while convincing the sociologists you haven't drained the "spirit" out of Weber.

  ### I. The Opening Concession (First Minute of Talk)
  **Do not wait for Q&A to admit this.** State it in your introduction to disarm the two-thirds of the room armed with Stata.

  *   **Say this:** "I begin by conceding the point the Chair and many economists here have already established: if we treat the Protestant Ethic as a standard causal variable predicting aggregate growth or occupational choice, the thesis is empirically dead. Better data and identification strategies have shrunk that effect to near zero. I am not here to revive that claim. I am here to argue that treating it as that kind of claim was the error all along."
  *   **Why:** This prevents the first three questions from being "But Becker (1996) shows..." or "The identification strategy is weak." You have already agreed with them.

  ---

  ### II. The Eight Objections (In Room Etiquette Order)

  #### 1. The Economist (Identification)
  **Objection:** "You say the standard causal claim is dead, but then you offer a 'lag' signature. If you can't define a counterfactual where the vocabulary exists but the conduct doesn't (or vice versa), isn't this just a story? How is this falsifiable science rather than just-so storytelling?"
  *   **Damage Rank:** 1 (Highest)
  *   **2-Minute Reply:** "It is falsifiable, but not by treatment effects. It is falsified by the *sequence*. If my reading is right, we should find records of agents struggling to describe new conduct *before* that conduct becomes normalized. If we find the conduct appearing fully formed without the linguistic struggle, or the vocabulary appearing without the conduct, the theory fails. I am asking for process evidence, not variance evidence."
  *   **Soft Spot:** You rely on the existence of those diary records. If they don't exist, you have no empirical hook.

  #### 2. The Economist (Preferences)
  **Objection:** "This sounds like you're just renaming 'preferences.' If the vocabulary changes the 'space of options,' isn't that just a change in the constraint set or a change in the utility function? Why do we need ontology for what looks like a standard optimization problem?"
  *   **Damage Rank:** 4
  *   **2-Minute Reply:** "In optimization, you choose between Option A and Option B. My claim is that without the vocabulary, Option B *does not exist* to be chosen. It's not that the cost changed; it's that the action is unintelligible. You cannot maximize over a set that includes 'calling' if your vocabulary only has 'work.' That is a prior ontological step, not a preference parameter."
  *   **Soft Spot:** Economists can model "unimaginable options" as infinite cost. You must insist on the *description* being the barrier, not the cost.

  #### 3. The Political Scientist (Measurement)
  **Objection:** "Okay, but how do you measure 'available descriptions' quantitatively? If we can't code this, how does this travel beyond this specific historical case?"
  *   **Damage Rank:** 6
  *   **2-Minute Reply:** "Text-as-data methods are actually well-suited for this. We aren't counting sermons; we are looking for semantic innovation—new collocations, new verbs applied to economic acts. The measure isn't frequency of 'Protestant,' it's the emergence of specific predications about 'time' and 'idle' in lay diaries."
  *   **Soft Spot:** This is methodologically vague. You need a concrete example ready (e.g., a specific diary entry).

  #### 4. The Sociologist (Thin Culture)
  **Objection:** "You've saved Weber from the economists, but at what cost? By making this about 'descriptions' and 'option spaces,' haven't you emptied the 'spirit' of its emotional and motivational content? Weber talked about anxiety and salvation, not just vocabulary."
  *   **Damage Rank:** 5
  *   **2-Minute Reply:** "The vocabulary *carries* the anxiety. The word 'calling' isn't a neutral label; it imports a specific threat of damnation. I am not removing the motivation; I am locating it in the language that makes the motivation possible. You cannot feel guilt about idleness unless 'idleness' is a moral category rather than a physical state."
  *   **Soft Spot:** Risk of sounding like a linguistic determinist. Ensure you acknowledge the *affect* tied to the words.

  #### 5. The Sociologist (Exegesis)
  **Objection:** "Is this actually Weber? Weber talks about elective affinity as a causal mechanism between ideas and interests. Are you not retrofitting a modern analytic philosophy reading onto a 1905 text?"
  *   **Damage Rank:** 8 (Lowest)
  *   **2-Minute Reply:** "I am defending the *logic* of Weber's metaphor, specifically the 'switchmen' passage. If ideas determine the *tracks*, they determine the direction, not just the speed. Standard readings treat the tracks as pre-laid. I am arguing Weber meant the ideas lay the tracks. It is a reconstruction, yes, but one that saves the insight from the empirical refutation you all know too well."
  *   **Soft Spot:** Purely textual defense is weak. Keep it focused on the "switchmen" quote.

  #### 6. The Historian (Chair) (The Archive)
  **Objection:** "You hang your empirical signature on a lag—conduct before vocabulary. But the archival record is spotty. The people keeping diaries were the literate elite, not the weavers and merchants actually changing behavior. How do you know the lag isn't just an artifact of who was writing?"
  *   **Damage Rank:** 2 (Very High)
  *   **2-Minute Reply:** "That is a serious empirical risk. However, disciplinary records (church consistories) capture the non-elite being punished for new behaviors before they have the language to defend them. The lag should appear in the *accusations* before it appears in the *defenses*. I am looking for the moment the charge changes, not just the verdict."
  *   **Soft Spot:** This is your weakest empirical link. If the Chair knows the consistories don't show this, you are in trouble.

  #### 7. The Philosopher (Causation)
  **Objection:** "You distinguish between causal and constitutive claims. But on an interventionist account, if changing the vocabulary changes the action, isn't that just causation? Why insist on a metaphysical distinction that blocks standard inference?"
  *   **Damage Rank:** 3
  *   **2-Minute Reply:** "Because the counterfactual is ill-defined. To intervene on the vocabulary is to intervene on the agent's identity. If I change the vocabulary, I am not testing the same agent under different conditions; I am creating a different agent. Interventionism requires stable units. Here, the unit is constituted by the variable."
  *   **Soft Spot:** Philosophers love to debate "stable units." Be prepared for a follow-up on "modularity."

  #### 8. The Philosopher (Realism)
  **Objection:** "If actions are constituted by descriptions, do agents ever act against their culture? Or is this a closed loop where vocabulary determines action determines vocabulary?"
  *   **Damage Rank:** 7
  *   **2-Minute Reply:** "Agents can act against the *dominant* vocabulary, but they must use *some* vocabulary to do so. Resistance is always linguistic too. The loop isn't closed; it's contested. The 'switchmen' are fighting over the tracks."
  *   **Soft Spot:** Risks sounding like there is no material reality, only talk.

  ---

  ### III. The "Must Land" Reply
  **The Concept:** The distinction between **Causing an Outcome** vs. **Constituting the Action**.

  *   **Why:** If you fail to convince them that "changing the option space" is fundamentally different from "changing the price of an option," the economists will absorb your theory into standard preference modeling, and the sociologists will think you've reduced culture to semantics.
  *   **The Soundbite:** "Standard models ask why an agent chose A over B. I am asking how A became a thing that could be chosen. That is not a causal question; it is an ontological one."

  ---

  ### IV. The Question You Hope Nobody Asks
  **The Question:** "If vocabulary constitutes the action, what role do material constraints play? Are you saying the Industrial Revolution happened because of words, not wool or coal?" (The Materialist Challenge).

  *   **Why it's dangerous:** It forces you into an Idealism vs. Materialism debate, which is a trap. It makes you sound like you think ideas float above economics.
  *   **The Response:** "Not at all. Material constraints determine the *pressure* on the switchmen. Coal and wool provide the push. But the vocabulary determines the *direction* the train can go when pushed. Without the tracks, the push just results in spinning wheels. I am not denying the engine; I am explaining the steering."

  ---

  ### V. Final Advice for the Room
  *   **For the Economists:** Speak their language of "identification" but redefine the "unit of analysis." Do not apologize for lacking a regression table; frame it as a category error on their part.
  *   **For the Sociologists:** Reassure them that "vocabulary" includes "affect" and "anxiety." Do not sound like a dry analytic philosopher.
  *   **For the Historian:** Defer to her expertise on the archives. If she says the diaries don't show the lag, concede that specific empirical point but hold the theoretical line ("Then we must look to consistories/legal records").
  *   **For the Philosopher:** Be precise on "intervention." Admit that interventionism is useful, but argue it has limits when the *subject* is the variable.

  **Good luck. You are asking them to change tracks. Expect resistance.**
