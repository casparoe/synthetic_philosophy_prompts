prompt: |-
  I'm taking this bioethics course and I also volunteer screening protocols for my school's research review board, which sounds fancier than it is—basically I check consent forms before they go to faculty. I need a decision procedure I can run in about 15 minutes that turns whatever philosophers actually mean by valid consent into steps I can use, especially around deception, coercion, and competence. Don't just list standard textbook stuff; I need ordered checks: what do I verify first, what counts as a pass, where do I have to hand it up to the board because it's a values call not a fact check, and where will this thing definitely misfire? Make sure it handles the weird middle cases—like when a study uses what I'd call structural deception, where nothing is technically lied about but the framing makes people think it's about one thing when it's testing something else, and when competence isn't binary but kind of gradient across different parts of the decision. Apply it to three protocols: one with mild deception in a memory study, one recruiting people immediately after they recieve bad medical news, and one with a technically perfect form but payment that's like three months rent for the target group. I want the answer in American English, and I need you to flag the case where the procedure tells me to reject something that probably shouldn't be rejected. Also please don't just give me a bibliography—I'm writing this for myself, not a paper.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Bioethics student + volunteer research review board screener (checks consent forms).
      *   **Goal:** A 15-minute decision procedure for valid consent.
      *   **Key Focus Areas:** Deception (including "structural"), Coercion (including undue inducement), Competence (gradient).
      *   **Format:** Ordered checks (step-by-step), pass/fail criteria, escalation points (when to kick to full board), failure modes (where the procedure misfires).
      *   **Specific Constraint:** American English.
      *   **Specific Task:** Apply to three specific protocols (Mild deception/memory, Bad news recruitment, High payment/rent).
      *   **Specific Requirement:** Flag the case where the procedure might incorrectly recommend rejection (false positive).
      *   **Tone:** Practical, not textbook-heavy, no bibliography.

  2.  **Deconstruct "Valid Consent" for a Practical Context:**
      *   Philosophical ideal: Autonomous, informed, voluntary, competent authorization.
      *   Practical reality: Risk management, regulatory compliance (Common Rule), protecting vulnerable populations.
      *   The "15-Minute" Constraint: Needs to be heuristic-driven, not a deep dive into Kant or Mill. It needs to be a checklist with "stop rules."

  3.  **Drafting the Decision Procedure (The "15-Minute Consent Triage"):**
      *   *Step 1: Competence/Capacity.* This is the gatekeeper. If they can't understand, nothing else matters. But the prompt asks for *gradient* competence. So, I need a "Task-Specific Capacity Check."
      *   *Step 2: Information/Deception.* Is the truth being withheld? Is it "structural"? Can it be justified?
      *   *Step 3: Voluntariness/Coercion.* Is there pressure? Is the payment too high (undue inducement)?
      *   *Step 4: Escalation.* Where do I stop and say "Full Board Review"?

      *Refining the Steps:*
      *   *Check 1 (Capacity):* Don't just ask "Are they adults?" Ask "Is the decision complexity matched to the population?"
      *   *Check 2 (Deception):* Distinguish between *active lying* and *omission/framing*. The "Structural Deception" needs a specific test: "The 'Aha' Moment Test" (Would they feel betrayed upon debriefing?).
      *   *Check 3 (Voluntariness):* Focus on the *context* of recruitment (bad news) and *incentives* (rent money).
      *   *Escalation:* If any check triggers a "Maybe," it goes to the board. The screener is a filter, not the judge.

  4.  **Developing the Three Test Cases:**
      *   *Case A (Memory Study/Mild Deception):* Standard psych stuff. Telling participants it's about "memory" when it's about "bias."
      *   *Case B (Bad News Recruitment):* Oncology or ER setting. Vulnerability is high.
      *   *Case C (High Payment):* $3000 for a low-income group (3 months rent). Undue inducement.

  5.  **Running the Procedure on the Cases:**
      *   *Case A:* Passes capacity. Deception is mild. Debrief planned? Yes. *Verdict:* Pass with conditions (debriefing).
      *   *Case B:* Capacity might be impaired by stress. Voluntariness compromised by emotional state. *Verdict:* Escalate (Vulnerability issue).
      *   *Case C:* Capacity fine. Information fine. Voluntariness? The money is coercive/undue. *Verdict:* Escalate/Reject.

  6.  **Identifying the "False Positive" (The Misfire):**
      *   The prompt asks to flag where the procedure tells me to reject something that *probably shouldn't be*.
      *   *Candidate:* Case C (High Payment).
      *   *Why?* Bioethicists debate "undue inducement." Some argue high payment is *exploitation* but doesn't invalidate consent. If the procedure is too strict on payment, it blocks research that benefits the poor by denying them income. A rigid "3 months rent = automatic reject" might be paternalistic.
      *   *Alternative Candidate:* Case A (Deception). Sometimes deception is necessary for validity. If the procedure is too strict, it kills valid psych research.
      *   *Decision:* The Payment case (Case C) is the classic "paternalism vs. autonomy" clash. A rigid screener might kill it to "protect" subjects, but ethically, it might be a fair exchange. I will flag Case C as the potential misfire where the procedure leans too protective.

  7.  **Refining the "Structural Deception" and "Gradient Competence" aspects:**
      *   *Structural Deception:* Add a specific question: "If the true purpose were revealed in the consent form, would it ruin the study?" If yes, is there a debrief?
      *   *Gradient Competence:* Add a "Sliding Scale" note. Higher risk = higher capacity required.

  8.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* Professional but direct. "You" focused.
      *   *Formatting:* Bold headers, bullet points for speed.
      *   *American English:* Check spelling (behavior vs behaviour), idioms.
      *   *Constraint Check:* Did I include the escalation points? Yes. Did I include the failure modes? Yes.

  9.  **Final Review against the Prompt:**
      *   15-minute procedure? Yes, it's a triage list.
      *   Ordered checks? Yes (Capacity -> Info -> Voluntariness).
      *   Pass/Fail/Escalate? Yes.
      *   Structural Deception/Gradient Competence handled? Yes.
      *   Three protocols applied? Yes.
      *   Flag the misfire? Yes.
      *   No bibliography? Yes.

  10. **Final Polish:** Ensure the distinction between "Screener" (me) and "Board" (faculty) is clear. The screener shouldn't make the hard value calls; they should identify them.

  *(Self-Correction during drafting)*: Initially, I thought about making the procedure decide "Approve/Reject." But the prompt says I screen *before* faculty. So the output should be "Clear for Board," "Needs Revision," or "Immediate Escalation." I need to make sure the procedure respects my role limits. I am a filter, not the final authority. I will adjust the "Verdict" options to reflect this workflow.

  *(Refining the "Misfire")*: The prompt asks me to flag the case where the procedure tells me to *reject* something that probably *shouldn't be rejected*.
  *   Case C (High Pay): If I reject it because the pay is too high, I am being paternalistic. Many ethicists argue high pay is okay if risks are low. So if my procedure says "Reject," that's the misfire.
  *   Case A (Deception): If I reject mild deception, I hinder science. But deception usually *requires* board approval anyway.
  *   I'll stick with Case C as the misfire. A rigid "undue inducement" check often flags high payment as coercive, but economically, it might just be a fair wage for time/risk.

  Let's write it.cw
answer: |-
  # The 15-Minute Consent Triage Protocol

  **Purpose:** To filter research protocols for valid consent issues before they hit the full board.
  **Your Role:** You are a tripwire, not the judge. Your job is to spot red flags, not solve complex ethical dilemmas. If a check triggers a "Maybe," it escalates to the faculty board.
  **Time Limit:** 15 minutes per protocol.

  ---

  ## Part 1: The Decision Procedure

  Run these checks in order. Do not skip ahead. If a step triggers an **ESCALATE**, stop and flag it for the board.

  ### Check 1: Gradient Competence (The Capacity Match)
  *Competence isn't a switch; it's a slider based on risk and complexity.*

  1.  **Identify the Population:** Are they adults with full legal capacity?
      *   *No (Minors, cognitively impaired, prisoners):* **ESCALATE.** (This requires special board protections).
      *   *Yes:* Proceed to 2.
  2.  **Assess the "Stress/Complexity" Load:** Look at the recruitment setting and the form's reading level.
      *   *High Stress/Complexity:* (e.g., ER, oncology clinic, dense genetic data).
      *   *Low Stress/Complexity:* (e.g., Online survey, psych lab, classroom).
  3.  **The Match Test:** Does the consent process match the load?
      *   *High Load + Simple Form/Process:* **PASS.**
      *   *High Load + Complex Form/No Cooling-off Period:* **ESCALATE.** (Potential impairment due to distress).
      *   *Low Load:* **PASS.**

  ### Check 2: Information & Structural Deception
  *Focus on what is hidden, not just what is lied about.*

  1.  **Active Lie Check:** Does the form state something factually false?
      *   *Yes:* **ESCALATE.** (Active deception almost always requires full board justification and debriefing plans).
      *   *No:* Proceed to 2.
  2.  **Structural Deception Check:** Is the *framing* misleading? (e.g., "Study on Memory" when it's actually "Study on Racial Bias").
      *   *Apply the "Betrayal Test":* If a participant found out the true purpose *afterward*, would they feel tricked or betrayed, or would they say, "Oh, that makes sense"?
      *   *Feels like Betrayal:* **ESCALATE.**
      *   *Makes Sense + Debrief Planned:* **PASS.**
      *   *Makes Sense + No Debrief:* **FAIL.** (Must revise to include debrief).
  3.  **Risk Disclosure:** Are the risks clearly stated in plain English (not legalese)?
      *   *No:* **FAIL.** (Send back to researcher).
      *   *Yes:* **PASS.**

  ### Check 3: Voluntariness & Coercion (The Pressure Check)
  *Look for external pressures that compromise choice.*

  1.  **Authority Coercion:** Is the recruiter in a position of power over the subject? (e.g., Professor recruiting their own students, Doctor recruiting their own patients).
      *   *Yes:* **ESCALATE.** (Requires independent consent monitor).
      *   *No:* Proceed to 2.
  2.  **Situational Vulnerability:** Are subjects recruited during a crisis? (e.g., Immediately after bad news, during emergency care).
      *   *Yes:* **ESCALATE.** (Capacity and voluntariness are compromised by emotion).
      *   *No:* Proceed to 3.
  3.  **Undue Inducement (Payment):** Is the payment disproportionate to the time/risk?
      *   *The "Rent Test":* Does the payment equal more than 1 month of living expenses for the target demographic?
      *   *No:* **PASS.**
      *   *Yes:* **ESCALATE.** (This is the "False Positive" zone—see Part 3).

  ---

  ## Part 2: Application to Your Three Protocols

  Here is how the triage runs on the specific cases you provided.

  ### Protocol A: The Memory Study (Mild Deception)
  *   **Scenario:** Participants told it's a "word recall task." Actually testing how anxiety affects recall. Researcher plans to debrief at the end.
  *   **Check 1 (Competence):** College students, low stress. **PASS.**
  *   **Check 2 (Deception):**
      *   Active Lie? No.
      *   Structural Deception? Yes (Framing).
      *   Betrayal Test? "Oh, that makes sense."
      *   Debrief Planned? Yes.
      *   **Result:** **PASS.**
  *   **Check 3 (Voluntariness):** No power dynamic, standard course credit/pay. **PASS.**
  *   **Final Verdict:** **Clear for Board.** (Standard psych protocol).

  ### Protocol B: The Bad News Recruitment (Vulnerability)
  *   **Scenario:** Oncologist recruiting patients within 1 hour of receiving a stage 3 cancer diagnosis to test a coping mechanism app.
  *   **Check 1 (Competence):** Adults, legal capacity. **PASS.**
      *   *Stress Load:* Extreme.
      *   *Match Test:* High stress + complex medical decision. **ESCALATE.**
  *   **Stop Here.** You don't need to check payment or deception. The emotional state creates a gradient competence issue. A person might be legally competent but functionally incapable of weighing research risks while in acute shock.
  *   **Final Verdict:** **ESCALATE TO BOARD.** (Requires independent consent monitor or waiting period).

  ### Protocol C: The High Payment (Undue Inducement)
  *   **Scenario:** Phase 1 drug trial (high risk, healthy volunteers). Payment is $5,000. Target demographic is low-income neighborhood where avg rent is $1,500. Payment = >3 months rent.
  *   **Check 1 (Competence):** Adults, low stress setting. **PASS.**
  *   **Check 2 (Deception):** None. Risks clearly stated. **PASS.**
  *   **Check 3 (Voluntariness):**
      *   Authority Coercion? No.
      *   Situational Vulnerability? No.
      *   Undue Inducement? Payment is >1 month rent (The "Rent Test").
      *   **Result:** **ESCALATE.**
  *   **Final Verdict:** **ESCALATE TO BOARD.** (Flagged as potential coercion).

  ---

  ## Part 3: Where This Thing Misfires (The False Positive)

  **The Misfire Case:** **Protocol C (The High Payment).**

  **Why the procedure flags it:** The "Rent Test" in Check 3 is designed to protect vulnerable people from selling their health for survival money. If the money is too high, it blinds them to the risk. This is the standard "Undue Inducement" argument.

  **Why it might be wrong:** This is where the procedure is overly paternalistic.
  1.  **Autonomy vs. Protection:** If a low-income person is competent (Check 1 passed) and understands the risks (Check 2 passed), denying them the chance to earn $5,000 because *you* think it's too much money restricts their autonomy.
  2.  **Economic Reality:** For many, $5,000 isn't "blinding inducement"; it's a rare opportunity to clear debt. Rejecting the protocol "protects" them from risk but also "protects" them from income.
  3.  **The Ethical Debate:** Many bioethicists argue that high payment is only coercive if the *risk* is unknown or hidden. If the risk is clear (Check 2 passed), the payment is just a wage.

  **How to handle it:** When you flag Protocol C, add a note to the board: *"Flagged for undue inducement per procedure, but note that risks are fully disclosed. Recommend board weigh paternalism vs. economic benefit."*

  ---

  ## Part 4: Failure Modes & Escalation Rules

  **Where this procedure will fail you:**
  1.  **The "Checkbox" Trap:** Researchers learn to game the system. They will write "Debriefing Planned" even if they don't mean it. You cannot verify intent in 15 minutes.
      *   *Fix:* If a study relies on deception, require a script of the debriefing in the attachment.
  2.  **Cultural Competence:** This procedure assumes Western individualism (autonomy is king). In some communities, family consent is required alongside individual consent. This procedure doesn't catch that.
      *   *Fix:* If the population is a tight-knit cultural/religious group, **ESCALATE** regardless of other checks.
  3.  **The "Gradient" Blind Spot:** Check 1 treats competence as mostly binary (Adult vs. Non-Adult) with a stress modifier. It doesn't catch mild cognitive decline in elderly populations who are legally adults but struggle with complex probability.
      *   *Fix:* If the population is 65+ and the study involves complex statistical risk, **ESCALATE** for capacity assessment review.

  **Your Escalation Cheat Sheet:**
  *   **PASS:** Send to Board for routine approval.
  *   **FAIL:** Send back to Researcher (Fix the form, fix the debrief, lower the pay).
  *   **ESCALATE:** Send to Full Board Meeting (This involves values, vulnerability, or power dynamics you aren't paid to decide).

  **Summary:** Your job is to catch the *obvious* violations and identify the *hard* calls. Don't try to solve the hard calls yourself. If the "Rent Test" or "Betrayal Test" makes you hesitate, kick it upstairs. That's what the faculty are there for.
