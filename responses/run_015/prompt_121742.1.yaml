prompt: |-
  Hey — could you do me a favour and help me write the last question for the take-home final in my upper-level philosophy of mind seminar? The seminar did a two-week block on pain, asymbolia and whether pain is intrinsically bad, and I need one essay question (they get 90 minutes, 1200 words max) on the badness-of-pain bit. The thing I want to avoid: half the class will have learned that asymbolia shows pain splits into a sensory-discriminative component and an affective-motivational one, and they'll just write that out with a bit of polish and get a good mark without actually engaging anything. So I want a question where reciting the two-component picture gets you, say, a B at best.

  Here's the half-formed idea I've been poking at. Asymbolia is standardly read as badness coming apart from the sensation: the patient still has the pain, but it isn't awful for them. But I think that reading smuggles in that there's only one other component to put the badness in. So I want to force a three-way split — sensory, evaluative/affective, motivational — by giving them a second, hypothetical case alongside asymbolia. Call it "inverse asymbolia" (say in the question that it's stipulated, so nobody wastes time trying to look it up): these subjects describe the stimulus in exactly the terms ordinary subjects do, say it's terrible, rate it high on unpleasantness scales, and insist they want it to stop — but they never wince, never withdraw, never ask for analgesics, will press a button to get more of it, and their nociceptive reflexes are intact. So: reported badness and reported desire, no motivation.

  The question should make them say where the badness of pain actually lives given both cases, and — this is the part I care about most — make them deal with two objections I think are the real crux. First, whatever dimension you locate badness in, you owe an explanation of why all three normally travel together in the same subjects; "they're just normally connected" needs to be more than a shrug. Second, a calibration problem: we're using verbal report as evidence in both cases, and we seem happy to believe the asymbolic when she says it doesn't bother her but tempted to discount the inverse subject when he says it's awful. What's the principled difference, if there is one? Is there one?

  So: write the question itself (phrased so it has a determinate thing to answer, not "discuss"), then a model answer of about 700 words, then a marking scheme out of 20 built around five must-hit points with the marks for each. Make the scheme name the specific move that separates an A from a B answer — I'm imagining the A does something with the co-travel and calibration problems rather than just picking a dimension and defending it — and add a one-line note per point on how people usually get it wrong. No citations or reading list, I'll slot the seminar readings in myself.

  One last thing: at the end of the model answer, add a short note to me saying how confident the answer is in what it claims and singling out the one move it's least sure of. I want to know where I should be ready to push back in the grading meeting.
