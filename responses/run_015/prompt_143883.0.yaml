answer: |-
  # PROTOCOL 7: ADJUDICATION OF LOSS (DRAFT)

  **Purpose:** To distinguish between *Grief* (emotional response to change) and *Loss* (mechanical deprivation of instantiated property or agency). To determine if a remedy is owed when an act is Charter-legal.
  **Time Limit:** 15 Minutes.
  **Authority:** Moderators may recommend remedy; only Story Leads may authorize Ledger edits or Charter exceptions.

  ### STEP 1: STANDING CHECK
  **Q1:** Is the complainant the current registered holder of the object, or the bound character?
  *   **If No:** Check the Ledger. If the object passed to the Harbour due to absence (>4 years), the complainant has no standing. **STOP. Ruling: No Claim.**
  *   **If Yes:** Proceed to Step 2.

  ### STEP 2: THE LEDGER CHECK
  **Q2:** Does the disputed thing have a unique Ledger Entry?
  *   **If Yes (Instantiated):** Proceed to Step 3.
  *   **If No (Prose Only):** The thing existed only in description. Its alteration or removal is *Canon Drift*, not Loss. **STOP. Ruling: No Remedy Owed.** (Acknowledge grief, but do not adjudicate).

  ### STEP 3: THE LEGALITY CHECK
  **Q3:** Was the act (Unmaking, Binding, Edit) permitted by the Charter and executed via engine mechanics?
  *   **If No:** This is a Rules Violation. Follow Protocol 1 (Infractions).
  *   **If Yes:** The act was legal. The dispute is about *Remedy*, not *Punishment*. Proceed to Step 4.

  ### STEP 4: THE PROVENANCE TEST (Copy-Substitution)
  **Q4:** Ask the complainant: *"If the actor offered you a new object of identical description and utility, but with a fresh Ledger Entry (marked second-hand), would you consider the debt paid?"*
  *   **If Yes:** The value was in the *utility*. The loss is replaceable. **Moderator Action:** Facilitate exchange or declare matter closed.
  *   **If No:** The value was in the *provenance* (the specific Ledger Entry and its history). The loss is unique. Proceed to Step 5.
      *   *Note:* This step invalidates the doctrine of description-parity. In Anselm, history is a material property. A copy is not the same object.

  ### STEP 5: THE REMEDY CAP
  **Q5:** Can the loss be mechanically reversed without violating the permanence of Gaps or the Charter?
  *   **If Yes (e.g., returning an item before Unmaking):** Order restitution.
  *   **If No (e.g., an Object is Unmade, Time is passed):** Mechanical restoration is impossible. Gaps are permanent. Time cannot be refunded. **HANDOFF TO STORY LEAD.**
      *   *Reason:* You are now adjudicating *Value*, not *Fact*. You cannot manufacture equivalent history. Only the Lead can authorize symbolic compensation (e.g., a Title, a new Ledger entry with a note of inheritance, a public acknowledgement).

  ### STEP 6: THE AGENCY CHECK (Binding Specific)
  **Q6:** If the complaint concerns Binding (Case 2), did the player retain the right to create a new character?
  *   **If Yes:** The deprivation is of *specific identity*, not *agency*.
  *   **Decision:** This is a **Values Handoff**. The procedure cannot quantify the value of fourteen years of continuity versus nine days of confinement. Flag for Lead review.

  ***

  # APPLICATION TO CASES

  ### Case 1: The Ship (Unmaking)
  *   **Step 1 (Standing):** Two holders are inactive >4 years. Under the Charter, their claim lapsed; the object passed to the Harbour. They have **No Standing**. The current holder (the Harbour/Rival) had the right to wager. The former active holders may have standing, but if the wager was legal, the transfer was valid.
  *   **Step 2 (Ledger):** Yes, the ship had an Entry.
  *   **Step 3 (Legality):** Unmaking is Charter-legal. The destroyer owned it at the time of Unmaking.
  *   **Step 4 (Provenance):** Would a new ship satisfy them? No. The value was the palimpsest of four holders. The Entry is gone.
  *   **Step 5 (Remedy):** Gaps are permanent. The ship cannot be restored.
  *   **Result:** **HANDOFF TO STORY LEAD.**
  *   **Reasoning:** The procedure confirms a *real Loss* (unique Ledger Entry destroyed) but confirms the act was *legal*. Moderators cannot fix this. The Lead must decide if the political gesture warrants a symbolic remedy (e.g., a monument in the Harbour text) or if the permanence of the Gap must stand to preserve the world's stakes. The inactive players are dismissed by Step 1.

  ### Case 2: The Binding (Time/Identity)
  *   **Step 1 (Standing):** Yes, the player.
  *   **Step 2 (Ledger):** N/A. This concerns Character Agency, not an Object. Skip to Step 6.
  *   **Step 3 (Legality):** Charter permits Binding. Act was legal.
  *   **Step 6 (Agency):** Player could have made a new character but refused. They value continuity over utility.
  *   **Result:** **VALUES HANDOFF.**
  *   **Reasoning:** The procedure explicitly identifies this as a real deprivation that cannot be mechanically remedied. Time is not refundable. A new character is not the same character (Provenance Test applies to identities too). The moderator cannot rule "No Remedy" without dismissing the player's fourteen-year investment. This must go to the Lead, who may offer a non-mechanical remedy (e.g., a narrative acknowledgement of the imprisonment in the character's text upon release).
  *   **Note:** You indicated this involves real deprivation. The procedure supports this by refusing to categorize it as "resolved" simply because it was legal. It flags the *irreparability* of the loss.

  ### Case 3: The Prose City (Retcon)
  *   **Step 1 (Standing):** Yes, the player.
  *   **Step 2 (Ledger):** **No.** The city had no Entry. It was prose only.
  *   **Result:** **STOP. RULING: NO REMEDY OWED.**
  *   **Reasoning:** The procedure distinguishes this from Case 1. In Case 1, a Ledger Entry was deleted (Loss). In Case 3, a description was altered (Grief). The engine did not change; no Gap was created. To treat this as Loss would devalue the Ledger. The player's grief is acknowledged, but the procedure protects the economy: if prose-only descriptions warranted remedy, the Ledger would be meaningless. This tracks *Loss*, not *Grief*.

  ***

  # CONFIDENCE ASSESSMENT

  **Step 1 (Standing):** **High Confidence.** This is administrative fact-checking. The Charter rules on absence are binary.
  **Step 2 (Ledger Check):** **High Confidence.** This is the core ontological distinction of Anselm. It is easily verified in the engine.
  **Step 4 (Provenance Test):** **Medium-High Confidence.** This effectively kills description-parity without requiring metaphysics. It forces the player to admit whether they care about the *history* or the *prop*.
  **Step 5 & 6 (Handoffs):** **Medium Confidence.** This relies on the Story Lead actually having remedies to offer. If the Lead has no symbolic currency, the Handoff is just a delay tactic.

  ### THE WEAKEST CLAIM

  **The Claim:** *"In Step 4, if the complainant accepts a replacement, the loss is replaceable."*

  **Why I am unsure:** This assumes the player can accurately predict their own satisfaction. A player might say "Yes, a new ship is fine," in the heat of the moment, accept the replacement, and then feel a lingering sense of wrongness because the *social memory* of the original ship is gone, even if the engine says they are whole. The test measures *stated preference*, not *actual psychological closure*.

  **Who should check this:** An **experienced moderator**. They will know if players frequently agree to substitutions and then return later with renewed complaints. A philosopher would argue about the nature of identity, but a moderator knows if the procedure actually stops the dispute or just pauses it. If players accept substitutions and remain angry, Step 4 is broken, and *all* Ledger losses should be Handoffs.
