  # Decision Tree: Classical Chinese Moral Psychology

  **Instructions:** Answer each question based on your reading of the cases. Follow the path to a leaf position. Do not worry about historical labels until you reach the end.

  **Q1. The Feral Child (Invented).** Consider a human raised from infancy without language, ritual, or example, discovered at fifteen. Upon discovery, does anything recognizably moral surface spontaneously (e.g., shame, concern for others), or only appetite and fear?
  *   (A) Yes, moral concern surfaces. → **Go to Q2.**
  *   (B) No, only appetite and fear. → **Go to Q3.**
  *   (C) The question imposes a false category; "moral" is not a natural kind. → **Leaf: Daoist.**

  **Q2. The Denuded Mountain (Canonical).** Consider the mountain whose shoots were grazed down. When cultivation occurs, is it primarily *recovering* what was originally there, or *building* what was not?
  *   (A) Recovering/Nourishing. → **Go to Q5.**
  *   (B) Building/Acquiring. → **Go to Q4.**

  **Q3. The Hungry Person (Canonical).** Consider the person who holds back food to let an elder eat. Is the raw impulse they override *actively disruptive* (tending to conflict), *merely crude* (tending to stagnation), or *neutral* (indeterminate)?
  *   (A) Neutral (Indeterminate). → **Leaf: Interlocutor.**
  *   (B) Merely Crude (Deficient). → **Leaf: Deflationary Xunzi.**
  *   (C) Actively Disruptive (Disorderly). → **Go to Q6.**

  **Q4. The White Jade (Canonical).** Consider the argument that "nature" is simply what one is born with (like whiteness in feathers). Is this definition the *only* valid one, or is it valid alongside a definition of nature as the *completed end*?
  *   (A) Both are valid (Verbal dispute). → **Leaf: Compatibilist.**
  *   (B) Only the Completed End is valid. → **Leaf: Unnamed (Normative Essentialist).**

  **Q5. The Re-Acquisition (Invented).** Consider a cultivated person exposed to vice, then re-taught. Is the re-acquisition of virtue *faster* than the original acquisition?
  *   (A) Yes, faster. → **Leaf: Mengzi.**
  *   (B) No, same speed. → **Leaf: Unnamed (Stagnant Sprout).**

  **Q6. The Accomplished Person (Invented).** Consider the person who now does what is right without struggle and takes pleasure in it. Does this show *seamless artifice* (training became automatic) or *native completion* (return to original state)?
  *   (A) Seamless Artifice. → **Leaf: Standard Xunzi.**
  *   (B) Native Completion. → **Leaf: Unnamed (Naturalist Xunzi).**

  ***

  ### Position Table

  | Leaf | Answer Pattern | Position | Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **1** | Q1-C | **Daoist** | Must explain why moral distinctions feel real if they are artifacts. |
  | **2** | Q1-B, Q3-A | **Interlocutor** | Must explain why humans differ from animals if nature is just birth. |
  | **3** | Q1-B, Q3-B | **Deflationary Xunzi** | Must explain why crude material requires rigid ritual rather than gentle guidance. |
  | **4** | Q1-B, Q3-C, Q6-A | **Standard Xunzi** | Must explain how artifice becomes pleasurable if it opposes nature. |
  | **5** | Q1-B, Q3-C, Q6-B | **Unnamed (Naturalist Xunzi)** | Incoherent: Claims raw material is disruptive but ease is native. |
  | **6** | Q1-A, Q2-A, Q5-A | **Mengzi** | Must explain why sprouts are so easily lost if they are native. |
  | **7** | Q1-A, Q2-A, Q5-B | **Unnamed (Stagnant Sprout)** | Unattractive: Sprouts exist but offer no advantage in recovery. |
  | **8** | Q1-A, Q2-B, Q4-A | **Compatibilist** | Must explain why the texts argue so fiercely if the difference is verbal. |
  | **9** | Q1-A, Q2-B, Q4-B | **Unnamed (Normative Essentialist)** | Unexplored: Sprouts exist but nature is only the completed end. |

  ***

  ### Closing Note: Indistinguishable Positions

  This tree cannot fully separate **Leaf 2 (Interlocutor)** and **Leaf 3 (Deflationary Xunzi)** based solely on the "Hungry Person" case, as both deny the raw material is *actively bad*. To separate them, one needs a datum regarding the **tendency of the raw material left alone**: does it remain static (Interlocutor) or drift toward disorder (Deflationary Xunzi)? This datum is in principle available via the **Denuded Mountain** case: does the mountain grow weeds (disorder) or nothing (neutrality) when unguarded? The texts provide conflicting metaphors here, leaving the distinction partly interpretive.
