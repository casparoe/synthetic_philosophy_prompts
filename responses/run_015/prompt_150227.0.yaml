      *   *Refinement on the Multipolar Point:* This is a strong rhetorical weapon. If "who watches the watchers" implies "unchecked power is dangerous," then nuclear-armed states are also unchecked watchers. The singleton might actually *reduce* risk compared to multipolar anarchy. I need to highlight this.

