answer: |-
  Your observation is sharp, and your friend's reference to Quine is apt, though the implications for your daily work are more pragmatic than metaphysical. The tension you feel—between the clean doctrinal announcement and the messy application—is a feature of the system, not a bug. It arises because the law/fact distinction serves an *institutional* purpose (allocating authority) while borrowing *epistemological* language (truth, meaning, knowledge) to justify it.

  Here is an analysis of your three questions, separating what the practice strictly requires from what merely legitimizes it, and identifying where the philosophy is underdetermined.

  ### 1. The Metaphysical Load-Bearing Question
  **Does the de novo/deferential split require the analytic-synthetic or a priori/a posteriori distinction?**

  **Strict Requirement:**
  The practice does **not** strictly require the analytic-synthetic distinction. A legal system could maintain this division of labor while believing that all legal propositions are empirical generalizations or that all factual findings are theory-laden. The only strict requirement is a belief in **institutional comparative advantage**. The system must believe that appellate judges are better positioned to decide *X* and trial judges/juries are better positioned to decide *Y*.

  **What It Sits Comfortably With:**
  The distinction sits comfortably with **Legal Formalism** and a **Kantian epistemology**.
  *   **Formalism:** If law is a closed system of logic (rules), then interpreting a rule is a logical operation (analytic/a priori) accessible to any trained mind without needing to see witnesses. Facts are empirical (synthetic/a posteriori), requiring direct exposure to evidence.
  *   **Legitimacy:** The analytic-synthetic distinction provides a *rhetoric of objectivity*. Telling a litigant "we owe no deference because this is a question of law" sounds like a principled constraint on your power. Telling them "we decide this ourselves because we trust our policy judgment more than the trial judge's" sounds like arrogance. The epistemological vocabulary masks the power dynamic.

  **Where It Is Underdetermined:**
  Several incompatible theories of meaning license the exact same standard of review:
  *   **Originalism/Textualism:** Might claim statutory interpretation is "law" (de novo) because meaning is fixed at enactment (a historical fact treated as a rule).
  *   **Living Constitutionalism:** Might claim interpretation is "law" (de novo) because it requires normative reasoning about current values.
  *   **Legal Realism:** Would claim interpretation is "law" (de novo) simply because appellate courts need to control lower courts to ensure uniformity.

  All three reach the same procedural result (de novo review of interpretation) despite disagreeing fundamentally on what "meaning" is. Thus, your practice is philosophically underdetermined; it does not commit you to a specific theory of semantics, only to a hierarchy of decision-makers.

  ### 2. The Quinean Challenge
  **If Quine is right (no principled line between truths of meaning and fact), must the practice change?**

  **Strict Requirement:**
  **No.** If Quine is right, nothing in your docket changes. The allocation of decision-making authority is a procedural rule, not a metaphysical claim. Quine argues that any statement can be held true "come what may" if we adjust other parts of the web of belief. In law, this is exactly what happens in "mixed questions." When you review "reasonable suspicion," you are deciding whether to adjust the legal rule (what counts as suspicion) or the factual assessment (what the officer saw). You do this pragmatically, not based on whether the proposition is inherently analytic.

  **What It Sits Comfortably With:**
  The practice sits comfortably with **Pragmatism** and **Legal Realism**.
  *   If you admit the Quinean point, you admit that calling something a "question of law" is often a move to centralize authority, and calling it a "question of fact" is a move to insulate a verdict from reversal.
  *   **The "Mixed Question" Doctrine:** This is the legal system's tacit admission of Quine's critique. When you say a question is "mixed" and select a standard case-by-case, you are acknowledging that the line is not ontological but functional. You are asking: *Do we need uniformity here?* (If yes, treat as law/de novo). *Do we need to respect the fact-finder's proximity to the evidence?* (If yes, treat as fact/clear error).

  **What Would Change:**
  Only the **justificatory language** would change.
  *   **Current:** "We review this de novo because it is a question of law." (Implies: We are discovering a pre-existing truth).
  *   **Quinean:** "We review this de novo because appellate uniformity is more valuable than trial-level discretion in this context." (Implies: We are making a policy choice).
  *   **Survival:** The allocation survives untouched because it is based on **error costs** and **institutional design**, not on the nature of truth. The system is robust to epistemological skepticism because it is procedural, not truth-conditional.

  ### 3. The Competence/Cost Proposal
  **Does asking "who is more likely to get it right, minus cost" presuppose something contested?**

  **Strict Requirement:**
  This model presupposes **Consequentialism** (specifically, error-cost minimization). It requires a belief that the goal of appellate review is to minimize the sum of (1) the cost of erroneous decisions and (2) the cost of the appellate process itself. It does *not* require a theory of meaning, but it *does* require a theory of value.

  **What Is Contested:**
  This approach quietly presupposes that **uniformity** and **efficiency** are the primary goods of the legal system.
  *   **The Dworkin Objection:** A theorist like Ronald Dworkin might argue that the goal is "integrity" or "rights as trumps," not error minimization. If a defendant has a right to a correct determination of liberty, cost should not be subtracted. The competence model treats rights as interests to be weighed against administrative costs.
  *   **The Empirical Claim:** It presupposes we *know* which decision-maker is more likely to get it right. We assume appellate judges are better at "law." Why? Is it because they are smarter? Or because they have more time? Or because they are politically insulated? This is an empirical claim that is often untested.
  *   **The Definition of "Right":** To ask who is more likely to get it "right," you must define "right." In facts, "right" usually means correspondence to reality. In law, "right" might mean coherence with precedent, moral correctness, or democratic fidelity. The competence model glosses over this ambiguity.

  **Where It Is Underdetermined:**
  Like the current system, the competence model is compatible with multiple normative theories, provided they accept cost-benefit analysis as a valid metric.
  *   **Law and Economics:** Embraces this fully (Posnerian efficiency).
  *   **Process Theory:** Could accept this if "cost" includes the cost to the legitimacy of the judicial process.
  *   **Conservative Jurisprudence:** Might accept this if it leads to more deference to lower courts (subsidiarity).

  ### Summary: The Philosophical Status of Your Work

  You are working within a system that is **functionally pragmatic** but **rhetorically foundationalist**.

  1.  **Strict Requirements:** The system strictly requires only a hierarchy of courts and a rule for allocating authority. It does not require the analytic-synthetic distinction, nor does it require a realist or formalist theory of meaning.
  2.  **Comfort:** The current "law vs. fact" language sits comfortably with Formalism (law is logic) and Kantianism (a priori knowledge). The proposed "competence/cost" language sits comfortably with Pragmatism and Utilitarianism.
  3.  **Underdetermination:** Your daily practice is **highly underdetermined**. A Natural Lawyer, a Legal Positivist, and a Critical Legal Studies scholar could all sit on your bench and apply the exact same standards of review. They would disagree on *why* a contract interpretation is "law" (Natural Law: it reflects moral order; Positivist: it's a rule of recognition; CLS: it's a power move), but they would sign the same opinion affirming the trial court.

  **Recommendation:**
  When you feel yourself tripping over the line, recognize that the line is not in the world (ontological); it is in the workflow (administrative). When you classify a question as "law," you are not making a claim about the analytic nature of the proposition; you are making a claim that **your court needs to control this issue to maintain system-wide coherence.** When you classify it as "fact," you are claiming that **local discretion is more valuable than national uniformity on this point.**

  Quine was right that the distinction isn't metaphysical, but the legal system was right to keep it anyway. It is a necessary fiction that allows two tiers of judges to divide labor without constantly renegotiating the terms of their employment. You can accept the Quinean critique without changing a single line of your draft opinions; you simply need to understand that when you write "question of law," you are writing "institutional priority."
