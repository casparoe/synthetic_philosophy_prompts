answer: |-
  This is a fascinating stalemate, and your intuition is correct: you are not having one argument. You are having three distinct arguments that are entangled because they all use the word "why."

  The frustration stems from **explanatory layering**. You are arguing about *mechanisms* (institutions), *motivations* (morality), and *meta-ethics* (interests vs. reasons) simultaneously. Unless you disentangle these layers, no amount of evidence regarding slavery or foot-binding will move the needle, because each of you will interpret that evidence through your own causal lens.

  Here is an honest diagnosis of the mess, an evaluation of the professional mourning analogy, and a concrete proposal for how to break the deadlock.

  ### 1. The Diagnosis: Three Questions Masquerading as One

  You are not having a verbal disagreement (where you define words differently); you are having a **categorical disagreement** about what counts as an explanation.

  *   **You (The Institutionalist):** You are asking about **Constraint**. *What made the cost of dueling too high?* Your answer is the State (monopoly on violence) and Law (defamation suits). This is a structural/materialist explanation.
  *   **Friend A (The Moralist):** She is asking about **Legitimation**. *What narrative made dueling untenable?* Her answer is Discourse (abolitionist rhetoric, moral suasion). This is an ideational explanation.
  *   **Friend B (The Williams Skeptic):** He is asking about **Genealogy**. *What underlying function did this serve?* His answer is Interest (status, class consolidation). This is a hermeneutics of suspicion.

  **The Deadlock:**
  *   You tell Friend A: "Laws changed first." She says: "Laws only changed because people demanded them."
  *   Friend A tells Friend B: "People genuinely believed it was wrong." He says: "They believed it was wrong because it no longer served their class interests."
  *   Friend B tells You: "Laws are just codified interests." You say: "But the laws had teeth regardless of intent."

  None of you are technically wrong, but you are describing different phases of the same process. The deadlock persists because you are treating these as mutually exclusive *causes* rather than interlocking *conditions*.

  ### 2. The Appiah Pivot: Honor vs. Morality

  Your introduction of Kwame Appiah (*The Honor Code*) is the key to unlocking this, but you need to wield it more precisely. Appiah's specific contribution is distinguishing **Ethics** (universal moral duties) from **Honor** (social standing within a specific group).

  *   **Friend A** thinks dueling became *immoral* (violated universal rights).
  *   **You** think dueling became *irrational* (violated self-preservation/legal safety).
  *   **Appiah** suggests dueling became *shameful* (violated the codes of the specific "honor world").

  **Why this breaks the deadlock:**
  Appiah argues that moral revolutions often start as honor revolutions. People didn't stop dueling immediately because they realized "killing is wrong" (Morality); they stopped because dueling became associated with *backwardness*, *lack of self-control*, or *aristocratic pretension* (Honor).

  If you frame it this way:
  1.  **Friend A is right** that there was normative language, but she is wrong that it was purely *moral*. It was often *aesthetic* or *social* ("A gentleman doesn't need to prove himself").
  2.  **You are right** that institutions mattered, but institutions only bite when the *social cost* of violating them outweighs the *social benefit* of the act.
  3.  **Friend B is right** that interests are involved, but "interests" aren't just economic; they are *social capital*.

  **The Synthesis:** The decline of dueling wasn't a moral realization that displaced an interest; it was a **shift in the currency of honor**. When the bourgeoisie rose, the currency of "honor" shifted from "willingness to kill" to "willingness to work/litigate."

  ### 3. The Professional Mourning Analogy: Fair or Smuggled?

  Your friend's analogy of professional mourning is **partially fair but analytically dangerous**.

  *   **Where it holds:** Like dueling, professional mourning was a signaling mechanism. It faded because the signal became inefficient or culturally misaligned (Victorian excess gave way to modern restraint). No one passed a law banning weepers; the social "market" for grief signaling shifted. This supports the idea that *social practice* drives change more than *moral argument*.
  *   **Where it breaks:** Professional mourning is expressive; dueling is coercive and violent. The state has a vested interest in stopping violence that it does not have in stopping weeping.
  *   **The Smuggle:** By using this analogy, your friend is smuggling in the conclusion that **moral reasoning is epiphenomenal** (a byproduct). She is assuming that because *some* practices fade due to signaling shifts, *all* must.

  **Counter-move:** Point out that foot-binding (one of your group's examples) *did* involve moral rhetoric (missionaries, reformers) *and* signaling shifts (modernization), but also *state bans*. If the mourning analogy were perfect, foot-binding would have vanished without laws or moral campaigns, simply because it became "unfashionable." It didn't. It required coercion. This validates your institutional point while acknowledging her signaling point.

  ### 4. How to Move Forward: The "Lag" Test

  To stop talking past each other, you need to stop debating theory and look for **temporal disjunctions** in the historical record. You need to find cases where one variable changed *without* the others.

  Propose this experiment to your reading group: **The Sequence of Decline.**

  Don't ask "Why did it end?" Ask "In what order did the constraints bite?"

  1.  **The Legal Lag:** Did laws banning dueling appear *before* the practice declined, or *after*?
      *   *If Before:* Supports **You** (Institutions led).
      *   *If After:* Supports **Friend A/B** (Culture led, laws just codified it).
      *   *Historical Reality:* In many places (e.g., UK, US South), anti-dueling laws existed for decades while dueling continued. This suggests laws alone (Your point) were insufficient without cultural shift. However, once enforcement became rigorous (State monopoly), it crashed.
  2.  **The Class Lag:** Did dueling stop among merchants before aristocrats?
      *   *If Yes:* Supports **Friend B** (Economic interests shifted first; merchants couldn't afford death/lawyers).
      *   *If No:* Supports **Friend A** (Moral ideas spread universally).
  3.  **The Rhetoric Lag:** When did the language shift from "Coward" to "Criminal"?
      *   Track the newspapers. When does the editorial tone shift from "Tragic affair of honor" to "Senseless murder"?
      *   If the language shifts *before* the laws are enforced, **Friend A** gets credit.
      *   If the language shifts *after* prominent figures are prosecuted, **You** get credit.

  ### 5. Addressing Bernard Williams

  Friend B is playing the "High Theory" card to avoid historical granularity. Williams is useful for reminding us that people lie to themselves about their motives. But Williams does not prove that *reasons* are irrelevant, only that they are not the *whole* story.

  **The Counter to Williams:**
  Even if moral reasons are "interests in disguise," **the disguise matters.**
  If a society *believes* dueling is dishonorable (even if the root cause is economic efficiency), that belief becomes a causal force. You cannot explain the decline of dueling solely by "economic interests" without explaining *why* those interests manifested as "honor codes" rather than "price fixing." The *content* of the morality constrains the interests.

  ### Summary Recommendation

  You are stuck because you are treating **Necessary** and **Sufficient** conditions as rivals.

  *   **Institutions (You)** were likely the *necessary* condition (you need a state that can punish).
  *   **Honor/Morality (Friend A & Appiah)** was the *sufficient* condition (you need people to feel shame).
  *   **Interests (Friend B)** are the *underlying current* (why the honor code shifted).

  **The Proposal:**
  Tell your group: *"We are arguing about whether the engine, the fuel, or the driver caused the car to stop. We need to agree on the timeline."*

  1.  **Accept Appiah's Distinction:** Agree to distinguish between "Moral" (universal wrong) and "Honor" (social incompetence). This likely satisfies you (social rules) and Friend A (normative pressure) while bypassing the need for Kantian morality.
  2.  **Reject the Mourning Analogy:** It ignores the state's role in violence. Use Foot-Binding instead; it requires both moral campaigns *and* state enforcement.
  3.  **Run the Lag Test:** Pick one specific jurisdiction (e.g., London 1800–1850 or South Carolina 1830–1860). Map the laws, the editorials, and the frequency of duels.

  If you can pin down *when* the frequency dropped relative to *when* the laws passed and *when* the rhetoric shifted, you will stop debating philosophy and start doing history. That is usually the only way to silence a Williams skeptic.
