answer: |-
  **MEMORANDUM**

  **TO:** City Council and Members of the Reconciliation Task Force
  **FROM:** [Your Name], Task Force Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Disbursement of Vacant School Site Proceeds ($2.4M)

  ### I. Recommendation

  The Reconciliation Task Force recommends the establishment of the **Historic District Wealth & Stability Fund**. This will be a hybrid initiative prioritizing housing asset-building for current residents of the affected census tracts, with a dedicated priority tier for verified descendants of families displaced by the 1960s highway construction.

  We recommend the funds be allocated as follows:
  *   **$2.0 Million (83%):** Down payment assistance and home repair grants for eligible homeowners.
  *   **$400,000 (17%):** Direct fixed grants to verified descendants of displaced families and funding for genealogical documentation services.

  This approach rejects the proposal for general, race-neutral affordable housing. It instead targets the specific racialized economic injury inflicted on this neighborhood, aiming to restore the intergenerational wealth transfer that was interrupted sixty years ago.

  ### II. Program Details

  **1. Eligibility Criteria**
  *   **Tier 1 (Priority):** Individuals who can document descent from families displaced by the 1960s highway clearance *or* enslaved persons in this county. Tier 1 applicants need not currently reside in the census tract but must intend to owner-occupy the property within the city limits.
  *   **Tier 2:** First-time Black homebuyers who currently reside in the three census tracts most affected by subsequent disinvestment, with income at or below 120% of the Area Median Income (AMI). Priority within Tier 2 shall be given to those at demonstrable risk of displacement (e.g., rising property tax burden, long-term residency).

  **2. Form and Size of Awards**
  *   **Housing Fund:** Grants of up to **$60,000** for down payment/closing costs or **$30,000** for critical home repairs (roof, HVAC, foundation) to prevent displacement. Funds will be structured as forgivable loans over 10 years to ensure owner occupancy.
  *   **Descendant Grants:** One-time fixed grants of **$15,000** to verified descendants (Tier 1) who do not utilize the housing fund, acknowledging the specific tort of displacement regardless of current housing status.

  **3. Administration**
  The Fund shall be administered by a third-party community development financial institution (CDFI) or a established local non-profit with audit oversight, rather than directly by the City. This ensures disbursement is insulated from political cycles and bureaucratic delay. A Community Advisory Board, comprising descendants of displaced families and current residents, will oversee eligibility determinations.

  **4. Timeline**
  *   **Administrative Setup:** 3 months.
  *   **Application Period:** Open for 18 months.
  *   **Full Disbursement:** Targeted within 24 months of Council approval.

  ### III. Moral and Practical Justification

  This recommendation is grounded in an analysis of who benefited from the original harm, who was harmed, and who bears the cost today.

  **Who Benefited:** The highway construction facilitated regional connectivity and increased property values for adjacent neighborhoods, predominantly white, who gained access to federally backed mortgages and equity growth. My own family, for instance, utilized such equity to fund education and stability—benefits denied to Black families in our county at the time. The City benefited from increased tax capacity and infrastructure efficiency.

  **Who Was Harmed:** The Black business district and residential community cleared in the 1960s suffered not only immediate displacement but the destruction of a localized ecosystem of wealth. This was not merely a loss of homes, but a loss of *appreciating assets* that could have been passed down.

  **Who Bears the Cost Now:** The current residents of the affected census tracts bear the cost of decades of disinvestment, lower property values, and vulnerability to gentrification. They live in the shadow of the infrastructure that destroyed their predecessors' prosperity.

  **Why This Plan Works:**
  Pure cash reparations (Option 1) honor the specific victims but may not rebuild the *community* that was destroyed. Pure housing assistance for current residents (Option 2) rebuilds the community but may miss the specific lineage of the harm. This hybrid model does both: it uses the majority of capital to restore the *function* of the neighborhood as a place of Black asset-building (addressing the systemic outcome), while reserving a significant portion to acknowledge the *specific lineage* of the displaced (addressing the historical tort).

  ### IV. Addressing the Rejected Alternative

  Several members have advocated for using these funds for **general affordable housing open to all residents**, arguing that race-specific targeting is divisive and that enough time has passed to treat all low-income residents equally. This argument appeals to a noble ideal of universalism, but it fails to address the specific nature of the injury we are tasked to reconcile.

  The moral force of the "universal" argument rests on the premise that the playing field is now level, or that the City's obligation is to current need rather than past wrong. Both premises are factually incorrect in this context.

  1.  **Neutrality Perpetuates Injury:** The harm caused in the 1960s was not race-neutral; it was specifically directed at a Black community through the mechanism of eminent domain and redlining. To offer a remedy that is race-neutral is to ignore the shape of the wound. If the City clears a specific group's assets and then offers a "general" fund to replace them, the original group remains disadvantaged because they are starting from a deficit created by the City itself.
  2.  **Time Has Not Healed:** The wealth gap in our county between white and Black households remains stark. The equity my family gained from that federally backed mortgage is the very asset type the displaced families were denied. To treat these funds as general charity rather than specific restitution implies that the debt is owed to "poverty" generally, rather than to "injustice" specifically.

  We must be willing to accept some political friction to achieve actual justice. A program that targets the specific demographic harmed by the specific policy in question is not divisive; it is accurate.

  ### V. Conclusion

  This $2.4 million cannot fully repay the debt owed to the families whose lives were uprooted. However, it can signal a shift from extraction to restoration. By prioritizing home ownership and repair in the affected tracts, we convert a one-time asset sale into long-term community stability.

  I move that the Task Force adopt this recommendation and forward it to the City Council for immediate appropriation.

  Respectfully submitted,

  [Your Name]
  Member, Reconciliation Task Force
