answer: |-
  This is a classic problem in public history: you are navigating the tension between **archival truth** (what can be proven by documents) and **social truth** (what a community holds to be meaningful). Your past four rulings suggest you do not have a single rule, but rather a **contextual jurisprudence**. You weigh the *type* of claim, the *power dynamics* involved, and the *consequences* of the error.

  Here is an analysis of your precedents, a recommendation for the new case, and a "splitter" case to test your emerging philosophy.

  ### 1. Decoding Your Precedents
  To be consistent, we must first articulate the principle behind each past ruling:

  *   **Case 1 (Interstate/Neighborhood):** *Principle of Structural Context.* When archives reflect bureaucratic neutrality (cost/engineering) but community memory reflects lived oppression (racism/displacement), **Community Memory prevails.** The "truth" of the impact outweighs the "truth" of the intent.
  *   **Case 2 (Family/Invention):** *Principle of Verifiable Credit.* When a claim involves specific individual ownership or invention, **Archives prevail.** Personal aggrandizement must be checked by objective record to maintain historical integrity.
  *   **Case 3 (Village/Massacre):** *Principle of Validated Harm.* When a specific violent claim is false but the underlying trauma is real, **Reframe the Narrative.** Acknowledge the suffering (relocation) without validating the specific falsehood (massacre).
  *   **Case 4 (Tribe/Treaty):** *Principle of Sovereign Pluralism.* When evidence is ambiguous or involves indigenous sovereignty, **Co-existence prevails.** Oral history holds equal weight to colonial records; mark both.

  ### 2. The Decision on the Snowdrift Case
  **Recommendation:** You should rule according to the **Case 3 (Validated Harm/Reframe)** analog, with a specific accommodation for the state funding requirement.

  **The Ruling:**
  1.  **The Plaque:** Must be updated to reflect the archival timeline. It cannot state the depot was *caused* by the snowdrift. It should state: *"In 1887, locals dug out a stranded train. While the depot was planned earlier, this act cemented the town's relationship with the railroad."*
  2.  **The Reenactment:** Can continue unchanged. The reenactment is now classified as **Intangible Cultural Heritage** (a tradition dating to 1931) rather than **Historical Fact** (an event from 1887).
  3.  **The Funding:** The site qualifies for state money under the "documented" rule because the *digging* is documented (payroll), even if the *causality* is folklore.

  **Why this fits:**
  *   **Consistency:** Like Case 3, you are validating the core effort (the digging/the relocation) while correcting the specific historical mechanism (the depot causality/the massacre).
  *   **State Rules:** It satisfies the "documented" requirement. You are funding the memorialization of the *digging*, which is documented, not the *depot origin*, which is not.
  *   **Community:** It preserves the tradition (the kids pulling the ropes) without requiring them to speak a falsehood.

  ### 3. The Principle You Are Adopting
  By choosing this path, you are adopting the principle of **"Documented Core, Contextualized Myth."**

  This principle states: *If a community story contains a verifiable kernel of truth (the digging/the relocation), the Commission will memorialize that kernel. If the story contains mythic accretions that contradict records (the depot causality/the massacre), the Commission will contextualize those accretions as folklore or correct them, provided the correction does not erase the community's lived experience of the event.*

  This distinguishes Case 1 (where the "myth" was about *intent*, which is hard to document) from this case (where the "myth" is about *logistics*, which is easy to document).

  ### 4. The "Splitter" Case
  Your current rules work because the cases fall into distinct buckets: Oppression (Case 1), Ego (Case 2), Trauma (Case 3), and Sovereignty (Case 4). To find the rule that actually governs you, you need a case that forces a choice between **Social Truth (Case 1)** and **Empirical Accuracy (Case 2)**.

  **The Splitter Scenario:**
  > A historically Black community claims a local school was built in 1920 because a Black teacher successfully lobbied the state. The community says this proves Black political agency during Jim Crow.
  >
  > **The Archive:** State records show the school was built because the white school board needed to segregate students to comply with a new law, and the Black teacher was actively barred from the meetings where the location was decided.
  >
  > **The Conflict:**
  > *   If you follow **Case 1 (Interstate):** You prioritize the community's narrative of agency and resistance against a system designed to erase them. You mark the teacher as the catalyst.
  > *   If you follow **Case 2 (Invention):** You prioritize the bureaucratic record. The teacher did not build the school; the board did (for racist reasons). To say otherwise is factually false.
  > *   If you follow **Case 3 (Massacre):** You acknowledge the school opened (truth) but mark it as a site of segregation (harm), effectively undermining the community's pride in the teacher.

  **Why this splits your rules:**
  This case removes the "physical harm" of Case 1 and Case 3. It is a claim about **dignity vs. accuracy**.
  *   If you rule for the **Community**, you establish that *dignity overrides facts* for marginalized groups. This undermines Case 2 (where the family had to change their plaque).
  *   If you rule for the **Archive**, you establish that *facts override dignity*, even when the archive reflects a racist system. This undermines Case 1 (where the neighborhood's framing of racist intent was kept over engineering logs).

  **How to prepare:**
  Your commission needs to decide if your primary goal is **Historical Accuracy** (what happened) or **Historical Justice** (what the record *should* say to correct past silences). The Snowdrift case is easy because the digging *did* happen. The Splitter case is hard because the agency *did not* happen, but the community needs it to have happened to survive the narrative of their own past.

  **Immediate Action:**
  For the snowdrift, proceed with the **Case 3 Reframe**. It is the only option that keeps your funding, respects the payroll records, and lets the kids keep pulling the ropes. Just change the script from "This is why we exist" to "This is how we became a community."
