answer: |-
  The mandate is to clarify the conceptual foundations of preference inference, not to improve the inference itself. Given the stipulations on laundered behaviour, reward–rationality degeneracy, and the recovery–construction dispute, the group must prioritise questions that determine whether the current engineering paradigm is coherent before attempting to refine it. The following ranking orders questions by logical dependency: if an earlier question reveals a fundamental incoherence, later questions become moot.

  **1. Can interference be structurally identified?**
  *The Laundering Problem.*
  Most behavioural data is produced within choice architectures designed by other optimisers. Standard inverse reinforcement learning (IRL) assumes behaviour reveals the agent's reward; if behaviour reveals the platform's reward, the inference is categorically wrong. This group must determine whether the statistical signature of a 'second optimiser' is distinguishable from the agent's own noise or irrationality without access to counterfactual data.
  *   **Gates:** All downstream preference learning. If laundering is indistinguishable from preference, current datasets are unusable for inferring user wants.
  *   **Tractability:** High for theorists. This requires modelling the game-theoretic structure of the choice environment, not massive empirical datasets.
  *   **Neglect:** Highly neglected. Engineering focuses on fitting data, not questioning its provenance.
  *   **Finished Answer:** A formal theorem specifying conditions under which an observer can distinguish endogenous preference from exogenous manipulation, or a proof that they are observationally equivalent.
  *   **Two-Year Signal:** If preliminary models show perfect equivalence under realistic assumptions, this question moves down (as it becomes unsolvable) and the group shifts to mitigation. If distinct signatures are found, it moves up.
  *   **Recovery/Construction Dependence:** Robust. Whether preferences are discovered or constructed, constructing them from laundered data builds the platform's goals into the user.

  **2. What justifies the rationality prior?**
  *The Degeneracy Problem.*
  Behaviour only reveals the ratio of preference strength to noise. To recover rewards, one must fix the 'temperature' (rationality) of the agent. Currently, this is a hyperparameter chosen for convergence, not truth. This group must establish whether there are normative or empirical grounds for fixing this gauge beyond mathematical convenience.
  *   **Gates:** The magnitude of inferred preferences. Without this, we cannot know if a user cares slightly or deeply.
  *   **Tractability:** Moderate. Requires philosophical work on norms of rationality combined with modest human-subject studies to test consistency.
  *   **Neglect:** Crowded in machine learning (as tuning), neglected in foundations (as justification).
  *   **Finished Answer:** A justified prior distribution over rationality levels derived from philosophical argument or stable empirical regularities, replacing arbitrary tuning.
  *   **Two-Year Signal:** If human subjects show stable rationality coefficients across contexts, this moves up. If coefficients vary wildly with framing, it moves down.
  *   **Recovery/Construction Dependence:** High. If Recovery is true, there is a fact of the matter to find. If Construction is true, the prior *creates* the preference magnitude, making the justification ethical rather than empirical.

  **3. Who owns the feature space?**
  *The Representation Problem.*
  Reward functions are defined over states. But states are descriptions. If the inference algorithm chooses the features (e.g., 'clicks' vs. 'satisfaction'), it dictates what kinds of values can be found. This question asks who is authorised to define the ontology of the situation.
  *   **Gates:** The content of preferences. You cannot recover a preference for 'dignity' if the state space only contains 'clicks'.
  *   **Tractability:** High. Conceptual analysis of state representations in current systems.
  *   **Neglect:** Crowded in representation learning, neglected as a normative constraint on inference.
  *   **Finished Answer:** A taxonomy of feature spaces showing which human values are mathematically expressible in current architectures, and a protocol for auditing state spaces.
  *   **Two-Year Signal:** Identification of common human values that are provably inexpressible in standard reward models moves this up.
  *   **Recovery/Construction Dependence:** Robust. Both pictures require a vocabulary; the question is whether that vocabulary permits the truth (Recovery) or constrains the construction (Construction).

  **4. Does the metaphysics change the protocol?**
  *The Ontology Problem.*
  This addresses the recovery–construction dispute directly. The group should not aim to settle the metaphysics, but to determine if the distinction alters engineering practice. Does building systems as if preferences are real (Recovery) lead to different failures than building them as useful fictions (Construction)?
  *   **Gates:** The interpretation of system outputs.
  *   **Tractability:** Moderate. Requires thought experiments and scenario modelling.
  *   **Neglect:** Crowded in philosophy, neglected in AI safety engineering.
  *   **Finished Answer:** A decision matrix showing where engineering defaults diverge based on the ontological assumption.
  *   **Two-Year Signal:** If no practical divergence is found, this moves to the bottom. If divergence is found (e.g., in handling conflicting preferences), it moves up.
  *   **Recovery/Construction Dependence:** This question *is* the dependence check.

  **5. What is the safe default?**
  *The Engineering Bridge.*
  When identification fails (due to laundering, degeneracy, or representation limits), what should the system do? Defer to the user? Freeze parameters? This question defines the fallback position when theory cannot justify inference.
  *   **Gates:** Deployment safety.
  *   **Tractability:** High. Policy analysis and normative modelling.
  *   **Neglect:** Highly neglected. Engineers optimise for performance, not graceful failure.
  *   **Finished Answer:** A set of 'stop conditions' or default policies mandated when confidence intervals on preference inference breach specific theoretical bounds.
  *   **Two-Year Signal:** If theoretical bounds remain too loose to trigger stops, this moves down.
  *   **Recovery/Construction Dependence:** Low. Safe defaults are required regardless of whether preferences are real or constructed.

  **Lines of Work Not to Fund**

  1.  **Scaling Inference Algorithms:** Do not fund work on making preference learning faster or more data-efficient. This is crowded by industry labs with superior compute. Your mandate is to ask if the inference is valid, not efficient. Improving a broken compass is useless.
  2.  **Large-Scale Behavioural Collection:** Do not fund new datasets. The stipulation on laundering suggests existing data is structurally compromised. Collecting more laundered data at scale presupposes that volume solves the identification problem, which is an empirical guess this group should challenge, not validate.
  3.  **Pure Meta-Ethics:** Do not fund work that seeks to settle the recovery–construction dispute in the abstract. Without linking the metaphysics to engineering defaults (as in Question 4), this changes nothing for builders. It must be tied to the 'load-bearing' confusions.

  **Uncertainty Flags**

  My ranking rests on two empirical guesses where confidence is lowest. First, I assume that laundering is theoretically disentangleable from preference without counterfactual data. If this is false, Question 1 collapses, and the group must pivot entirely to Question 5 (defaults) much sooner. Second, I assume builders care about these foundations. If industry pressure for capability overrides conceptual coherence, the group's output may be ignored. I have prioritised Questions 1 and 2 because they are prerequisites for coherence; if the math is wrong, the ethics do not matter. However, if the 'Construction' picture is correct, Questions 1 and 2 change from 'finding the truth' to 'designing a stable fiction'. I have bet that the ordering remains robust because even a stable fiction requires understanding the interference (Laundering) and the gauge (Degeneracy) to avoid immediate collapse. If this bet is wrong, Question 4 should move to first place, as the entire project scope would need redefinition.
