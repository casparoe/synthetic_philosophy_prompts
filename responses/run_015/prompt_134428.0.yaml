answer: |-
  The tension between Kim's causal exclusion argument and the determinable/determinate defense turns on a single ontological question: do mental and physical properties compete for the same causal ground, or do they occupy different positions within a single causal hierarchy? Your constructed scenario—cognitive dissonance ($M$) realized by disjoint neural states ($N_1, N_2$) with no unified physical base other than a disjunction ($D$)—serves as a potent stress test because it isolates the problem of multiple realizability from the problem of supervenience. It forces us to ask whether the determinable relation can survive the fragmentation of its physical base.

  ### The Exclusion Argument's Gain in the Disjoint Scenario

  In your scenario, Kim's exclusion argument gains significant force, precisely because the physical side lacks a unified determinable. Kim's argument relies on the principle of causal closure: every physical effect has a sufficient physical cause. In Case 1, $N_1$ causes the behavioral effect $E$. In Case 2, $N_2$ causes $E$. $N_1$ and $N_2$ are physically disjoint; they share no causal powers except those they possess in virtue of realizing $M$.

  For Kim, the disjunctive property $D$ ($N_1 \lor N_2$) is causally inert. Disjunctions do not enter into laws of nature; only natural kinds do. If $M$ is multiply realized by $N_1$ and $N_2$, and there is no physical kind unifying them other than $D$, Kim argues that $M$ itself inherits the disjunctive status of its base. If $M$ is effectively identical to $D$ (or supervenes on it without reduction), then $M$ is not a natural kind. If $M$ is not a natural kind, it cannot be a cause.

  In this specific setup, Kim's exclusion works by fragmentation. He does not need to prove $M$ is identical to $N_1$ to exclude it; he only needs to show that $M$ is not identical to $N_1$ (due to $N_2$) and not identical to $N_2$ (due to $N_1$). Since $N_1$ and $N_2$ are the only causally sufficient candidates for producing $E$, and $M$ is neither, $M$ is excluded. The lack of a unified physical determinable ($D$ is gerrymandered) confirms Kim's suspicion that $M$ is a "cambridge property"—a logical construction rather than a causal power. Thus, in your scenario, the exclusion argument tightens: the more disjoint the realizers, the more $M$ resembles a mere disjunction, and the less causal efficacy it can claim without violating closure.

  ### The Determinable Defense Under Stress

  The determinable/determinate defense attempts to bypass exclusion by denying the competition premise. It posits that $M$ (the determinable) and $N_1$ (the determinate) are not distinct, competing causes, just as "Red" and "Scarlet" are not competing causes of a pigeon's peck. To say $M$ caused $E$ is to describe the causal transaction at a higher level of abstraction; to say $N_1$ caused $E$ is to describe it at a lower level.

  However, your scenario stresses this ontology by severing the physical unity. For the determinable relation to hold, the determinable must be a *genuine property* that is instantiated by its determinates. The defense collapses if $M$ turns out to be merely a label for the set $\{N_1, N_2\}$. If $N_1$ and $N_2$ are physically disjoint and share no intrinsic physical similarity, the only thing unifying them is their relation to $M$. This creates a circularity risk: $M$ is the property shared by $N_1$ and $N_2$, but $N_1$ and $N_2$ are the realizers of $M$.

  Does the defense collapse because the physical side lacks a single causally unified determinable? Not necessarily, but it requires a robust non-reductive ontology. A proponent of the determinable view (such as Jessica Wilson or Sydney Shoemaker) would argue that $M$ is a second-order functional property. $M$ is not the disjunction $D$; rather, $M$ is the property of *having some property that plays the cognitive dissonance role*. $N_1$ and $N_2$ are first-order properties that satisfy this condition.

  On this view, the lack of a unified physical determinable ($D$) is irrelevant because $M$ does not supervene on $D$ as a disjunction; it supervenes on the *disjunction of realizers* via a functional definition. The determinable relation holds between $M$ and $N_1$ specifically, and between $M$ and $N_2$ specifically. The defense survives only if one accepts that $M$ is a genuine universal despite its heterogeneous physical bases. If one accepts this, $N_1$ causes $E$ *by* instantiating $M$. The causation is not overdetermined because $N_1$'s causal power includes the power conferred by $M$.

  However, the stress test reveals a vulnerability: if $N_1$ and $N_2$ are too disjoint, the "determinable" $M$ risks becoming purely extrinsic. If $M$ is defined solely by the set of its realizers, it lacks the intrinsic unity required to be a determinable in the same sense that "Color" is to "Red." The defense holds, but it pays a price in the metaphysics of properties: it must treat $M$ as a real property even though it projects no unified physical similarity class.

  ### Preserving Downward Causation and Closure

  Which view better preserves downward mental causation without violating causal closure?

  **Kim's Framework:**
  Kim preserves causal closure perfectly but sacrifices downward mental causation (in the non-reductive sense). For Kim, if $M$ is to cause anything, it must be identical to a physical property. In your scenario, since $M$ is multiply realized, it cannot be identical to $N_1$ or $N_2$. Therefore, $M$ cannot cause $E$. The only way to save $M$'s causation is "local reduction": in Case 1, $M$-instance-1 is identical to $N_1$-instance-1. But this fragments $M$ into $M_1, M_2, \dots$, destroying the generalization that *cognitive dissonance* causes *attitude change*. Kim preserves closure by rendering the general mental property epiphenomenal.

  **The Determinable Framework:**
  The determinable view preserves downward causation by redefining the relationship between levels. $M$ causes $E$ because $M$ is a determinable of the physical cause $N_1$. Closure is preserved because the physical effect $E$ still has a sufficient physical cause ($N_1$). The mental cause is not an *additional* physical push; it is the same causal transaction described under a determinable property.
  However, this preservation comes at the cost of a specific metaphysical commitment: the rejection of the "distinctness" premise in exclusion arguments. Kim assumes that if $M$ and $N_1$ are not identical, they are distinct existences that would overdetermine $E$ if both caused it. The determinable view argues they are not distinct existences in the relevant sense; $N_1$'s existence entails $M$'s existence ontologically, not just nomologically.

  ### The Metaphysical Price

  The core of your dispute lies in where each framework pays its metaphysical price.

  **Kim pays in Ontological Austerity.**
  To maintain the integrity of physical closure and the intuition that causes must be natural kinds, Kim must eliminate or reduce the mental. In your scenario, the price is the denial that "cognitive dissonance" is a unified causal agent. We are left with a world where $N_1$ causes $E_1$ and $N_2$ causes $E_2$, and the similarity between them is a matter of human classification, not causal structure. The price is the loss of mental autonomy; psychology becomes a shorthand for a disjunction of physical narratives.

  **The Determinable View pays in Causal Metaphysics.**
  To save mental efficacy, the determinable view must reject the principle that causation requires competition between distinct sufficient causes. It must argue that $N_1$ causing $E$ and $M$ causing $E$ are not two events, but one event with two property descriptions. The price here is the acceptance of a layered ontology where higher-level properties are causally relevant *in virtue of* lower-level properties without being identical to them. This requires rejecting the intuition that if the physical base does all the work, the supervenient property does none. It demands we accept that causal relevance is not a zero-sum resource. Furthermore, in your specific scenario, it pays the price of accepting highly disjunctive realizers as valid determinates of a unified determinable, which strains the traditional analogy of determinables (like Shape or Color) that usually imply some physical similarity among determinates.

  ### Conclusion: The Verdict on the Stress Test

  In the specific case of disjoint realizers $N_1$ and $N_2$ with no unified physical base $D$, **Kim's exclusion argument is structurally stronger**, while the **determinable defense is more intuitively satisfying but ontologically costlier.**

  Kim's argument exploits the disjoint nature of $N_1$ and $N_2$ to argue that $M$ is causally inert because it fails to be a natural kind. The lack of a unified physical determinable ($D$ is inert) supports the claim that $M$ is merely a disjunction. If $M$ is a disjunction, it cannot enter into causal laws.

  The determinable defense survives only if it insists that $M$ is a functional universal that is *not* identical to the disjunction $D$, but is rather a property that $N_1$ and $N_2$ independently instantiate. This saves mental causation but requires a metaphysics where properties can be causally efficacious even when their physical realizers share no intrinsic similarity.

  Ultimately, the determinable/determinate defense does not collapse in your scenario, but it is forced to retreat from a purely mereological account of properties to a functionalist one. It preserves downward causation without violating closure, but only by rejecting the premise that causal sufficiency is exclusive. Kim preserves closure and causal exclusivity, but only by rendering the mental property $M$ ontologically fragmented. The choice is between a unified physics with fragmented psychology (Kim) or a unified psychology with a layered, non-competitive causal ontology (Determinable).
