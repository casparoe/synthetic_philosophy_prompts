  - **Two sources, or one?**
  The variance-partition source is fundamentally a claim about **arithmetic**. Heritability is a fraction ($V_G/V_P$). Even if the biological effect of genes remains constant, increasing environmental noise ($V_E$) increases the denominator, lowering the ratio. This matters for inference because it warns against comparing magnitudes across settings; a lower heritability does not imply weaker genetic causation, only greater environmental diversity. It is a statistical artifact of normalization. The reader must understand that a drop in heritability can occur without any change in biological sensitivity.

  The interaction source is a claim about **development**. It asserts that the biological function mapping genotype to phenotype changes shape across environments. In crossover interactions, the rank order of genotypes flips. This matters because it undermines the stability of the numerator ($V_G$) itself; there is no single "genetic effect" to measure. The gene does not do the same thing in both places. Consequently, inferring individual outcomes from population estimates becomes hazardous.

  Your cut misses two joints. First, **allele frequency**. Even with fixed environments and no interaction, changing the population's genetic diversity changes $V_G$. A population of clones has zero heritability. This concerns the distribution of genotypes, not environments. Your definition of the variance-partition source specifies "whenever the distribution of environments moves," implicitly holding genetics constant. Changing the genetics is a distinct source of relativity. Second, **gene-environment correlation (rGE)**. If genotypes sort into environments, $V_G$ estimates capture environmental effects. This inflates variance components without developmental interaction. Thus, population-relativity arises from environmental variance, developmental interaction, genetic diversity, and social sorting.

  - **Two worked cases**
  Consider a population composed of two genotypes, G1 and G2, each at 50% frequency. The mean phenotype is calculated as the average of the two scores. Genetic variance ($V_G$) is the average squared deviation from that mean.

  **Case 1 (Interaction, Stable Variance):** In Environment A, G1 scores 10 and G2 scores 30. The mean is 20. The deviations are -10 and +10. Squared, these are 100 and 100. The average is 100, so $V_G = 100$. Assume environmental noise ($V_E$) is 0. Total variance ($V_P$) is 100. Heritability ($H^2$) is 1.0. In Environment B, G1 scores 30 and G2 scores 10. The mean is still 20. The deviations are +10 and -10. $V_G$ remains 100. $V_E$ remains 0. $H^2$ remains 1.0. The statistic is identical, but the superior genotype has reversed. The biology flipped while the math stayed still.

  **Case 2 (Variance Partition, No Interaction):** Use the same genotypes. In Environment A, G1 scores 10 and G2 scores 30. As before, $V_G = 100$. Assume $V_E = 0$. $V_P = 100$, so $H^2 = 1.0$. In Environment B, G1 still scores 10 and G2 scores 30 (parallel norms). However, environmental noise increases to 300. Now $V_P = 100 + 300 = 400$. Heritability drops to 0.25. The genetic ranking is stable, but the statistic changes because the environmental denominator swelled. The first case shows hidden biological instability; the second shows visible statistical instability.

  - **The asymmetry**
  Your intuition holds. The variance-partition source threatens **portability**. The genetic contribution is real and stable, but the ratio shifts because the background noise changes. You can still say "genes matter," just not "genes matter this much" elsewhere. The interaction source threatens **coherence**. If ranks reverse, the statement "G2 is better than G1" is false in one context and true in another. There is no context-independent genetic effect to quantify.

  However, do not underestimate the variance source. In practice, environmental variance is rarely stable across human populations (e.g., socioeconomic ranges). Thus, even without interaction, heritability estimates are rarely portable. The asymmetry is conceptual: interaction breaks the link between the statistic and a stable biological property, while variance partition breaks the link between the statistic and a stable numerical value. Both break the link between the estimate and the trait itself. For the general reader, the interaction source is the deeper warning: it means the genetic architecture is not fixed. The variance source is the more common warning: it means the context is not controlled. Both justify the slogan, but for different reasons.

  - **The no-interaction limit**
  If reaction norms are perfectly parallel, the interaction source vanishes. The genetic contribution to variance ($V_G$) becomes stable across environments, assuming allele frequencies remain constant. However, the variance-partition source survives fully. Environmental variance ($V_E$) can still differ between populations. If one population lives in uniform conditions and another in diverse conditions, heritability will differ despite identical biological development.

  What remains of the slogan? "Heritability is a property of a population's environmental uniformity." It is no longer about the instability of genetic effects, but about the denominator of the ratio. The slogan survives, but narrowed: heritability is not a trait constant because environmental diversity is not a trait constant. Even in a biologically stable world, heritability remains a population statistic, not a biological constant. The arithmetic of variance partition ensures that heritability never escapes its dependence on the specific range of environments sampled.
