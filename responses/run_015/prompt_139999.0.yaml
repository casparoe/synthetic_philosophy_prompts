answer: |-
  Setup and materials
  You need a room with a table, a visible timer, and pens. Print two identical-looking binders labeled "Official Record – Vol 1" and "Official Record – Vol 2". Place both prominently. Hand out the Seed Ruleset (one per person). Appoint a Secretary (rotate or volunteer) whose job is to write changes in *one* binder of their choice, without telling anyone which one they picked until the end. Do not explain the game's pedagogical goal. State only: "These rules govern us for today. Points are awarded for rules valid at the end. Validity depends on the rules themselves." The Secretary must keep their choice of binder secret until the final count.

  The seed ruleset
  1. **Amendment:** Any rule may be amended by a two-thirds majority vote of members present. *(Trap: General power)*
  2. **Protection:** Rule 1 may only be amended by a three-quarter vote at a meeting with quorum. *(Trap: Conflicts with R1; Self-defeating)*
  3. **Temporal Priority:** Where rules conflict, the later adopted rule prevails over earlier ones. *(Trap: Conflicts with R4)*
  4. **Specificity Priority:** Where rules conflict, the more specific rule prevails over general ones. *(Trap: Deadlock with R3)*
  5. **Record:** The Secretary's bound volume constitutes the authoritative text of these rules. *(Trap: Ambiguity)*
  6. **Validity:** Proposals accrue points only if legally valid at session end, not merely if passed. *(Incentive)*
  7. **Procedure:** Proposals require a seconder and five minutes of debate before voting occurs. *(Boilerplate)*
  *Note:* Ensure Rule 2 can be amended by Rule 2's own standard (3/4), allowing its own removal. The conflict between 1 and 2 creates the circularity. The conflict between 3 and 4 creates the deadlock. The physical binders create the record gap.

  Private briefs
  Hand three slips to specific participants upon arrival.
  1. **The Challenger:** "Propose changing Rule 1 to require only a simple majority. Argue Rule 1 allows this."
  2. **The Archivist:** "Question which binder is the 'Secretary's bound volume.' Insist on checking both before voting."
  3. **The Specificator:** "Propose a rule about 'Snack Breaks' that conflicts with Rule 7. Argue Specificity (Rule 4) beats Timing (Rule 3)."
  Do not tell them about the traps. Their natural advocacy will trigger the structural flaws. Keep this card hidden until you speak. If others ignore your point, raise it again during adjudication. Your goal is not to win, but to force the group to confront the text.

  Timeline
  **0-10 min:** Introduction. Distribute rules. Elect Secretary. Explain scoring (validity matters).
  **10-20 min:** First proposal phase. Expect challenges to Rule 1.
  **20-50 min:** Open legislation. Encourage amendments. Watch for conflicts between Rules 3 and 4.
  **50-60 min:** The Record Crisis. When voting ends, reveal both binders exist. Ask Secretary to certify one.
  **60-75 min:** Adjudication. Group must decide which rules are valid based on the conflicting meta-rules. If they argue about Rule 1 vs 2, let them stall.
  **75-90 min:** Freeze. Count points. Do not explain *why* things broke. Collect sheets. End session abruptly.
  *Note:* Keep time strictly. Do not resolve the paradoxes during play. If they stall on a vote, call it and move to the next. The goal is confusion, not efficiency. Ensure the Secretary writes in only one binder but doesn't say which until the end. If the group reaches consensus too easily, introduce a procedural objection from the facilitator to stall.

  How the traps are rigged
  **Self-Amendment:** Rule 1 says 2/3 changes *any* rule; Rule 2 says 3/4 changes Rule 1. If someone uses Rule 1 to change Rule 1, is it valid? The system cannot answer without privileging one rule over the other.
  **Priority Deadlock:** Rule 3 (Time) and Rule 4 (Specificity) both claim supremacy in conflicts. If a specific old rule conflicts with a general new rule, neither meta-rule resolves who wins.
  **Self-Defeating Entrenchment:** Rule 2 protects itself but sets the key (3/4 vote) to unlock itself. It looks strong but is removable by its own standard.
  **Record Gap:** Two binders exist. Rule 5 says "The Secretary's binder." If the Secretary hasn't chosen, or writes in both, the text is indeterminate. The rule points to a physical object that is ambiguous. This forces the group to realize there is no judge.

  Debrief
  Start by asking: "Which rules are actually in force?" Listen to their justification. They will cite rules to validate rules.
  1. **The Rule of Recognition:** Explain that every system needs an ultimate test for validity that lies *outside* the rules. They tried to find it inside (Rule 5), but it failed because the physical reference was ambiguous.
  2. **Self-Reference:** Highlight the Rule 1/2 conflict. A system cannot pull itself up by its bootstraps. Changing the test for change creates a paradox of authority. If Rule 1 changes itself, did it use the old rule or the new one?
  3. **Entrenchment:** Discuss Rule 2. Real entrenchment requires a higher authority (like a constitution vs. statute). Here, the wall was made of the same brick as the hammer. It looked strong but was removable by its own standard.
  4. **The Record:** The "Official Record" is a social fact, not just a text. When the text splits, the social consensus must heal it, but your rules gave no mechanism for that consensus.
  Conclude: Your co-op isn't broken because of parking; it's broken because the system lacks an external anchor for truth. The logic collapses without a meta-legal agreement. This mirrors your co-op's parking amendment: a rule claiming its own history.

  What will go wrong
  **Anarchy:** They repeal everything immediately. *Fix:* Remind them points require validity, not just passage.
  **Apathy:** They ignore meta-rules. *Fix:* The Private Briefs will force the issues.
  **Legalism:** Lawyers dominate. *Fix:* Remind them programmers and undergrads vote too; validity is logical, not precedential.
  **Veto:** Quiet members block consensus. *Fix:* Enforce the voting thresholds strictly; don't allow consensus overrides.
  **Early Resolution:** They solve a trap too fast. *Fix:* Introduce a new proposal that re-opens the wound (e.g., amend the amendment to the amendment).
  **Timekeeping:** The facilitator loses track. *Fix:* Use a visible timer and announce intervals loudly.

  What the game cannot teach
  This game compresses years of drift into 90 minutes. It cannot teach the emotional fatigue of living in a broken system, nor the political cost of calling a lawyer. It simulates the logic, not the pain. You must explain that in reality, ambiguity doesn't freeze a game; it freezes housing transfers, loans, and sales. The stakes here are points; there, they are livelihoods. The logical paradox is clean; the human mess is not.
