answer: |-
  # Activity: The Invisible Arrow

  ## Materials
  *   **Projector & Screen:** Ensure the room can be darkened significantly.
  *   **Laptop:** Capable of outputting 60Hz video. Do not use PowerPoint transitions (they are unreliable for milliseconds). Use a pre-rendered 60fps video file or free stimulus software (e.g., PsychoPy, JSPsych).
  *   **Index Cards:** 2 per student.
  *   **Markers/Pens:** 1 per student.
  *   **Stimulus Files:**
      *   *Fixation:* White cross on black background (500ms).
      *   *Mask:* High-contrast random noise pattern (white/black pixels).
      *   *Target:* Large white arrow pointing Left or Right on black background.
      *   *Sequence:* Fixation (500ms) → Mask (50ms) → Target (1 frame / 16ms) → Mask (500ms).
      *   *Broadcast Version:* Same sequence, but Target lasts 500ms.

  ## Setup (5 Minutes)
  1.  Darken the room. Close blinds, turn off lights. Ambient light is the enemy of subliminal stimuli.
  2.  Distribute 2 index cards and a pen to each student.
  3.  Instruct students to mark one card "L" and one card "R".
  4.  Explain the task: "You will see a sequence of images. Your job is twofold. First, decide if you consciously *saw* a shape. Second, regardless of what you saw, you must guess the direction of the arrow. If you see nothing, you must still guess L or R. Do not try to be logical; go with your gut."

  ## Condition 1: The Subliminal Flash (15 Minutes)
  *Goal: Simulate blindsight-style processing (information guides action without phenomenal experience).*

  1.  **Trial Structure:** Run 10 trials total. Randomize Left/Right arrows (5 each).
  2.  **Presentation:** Play the "Subliminal" video sequence. The arrow appears for only 1 frame (16ms) sandwiched between masks.
  3.  **Response:**
      *   Immediately after the sequence, ask students to write on a scrap paper: **Saw? (Y/N)** and **Guess (L/R)**.
      *   After 5 trials, collect the "Saw?" data verbally (Show of hands: "Who saw something definite?"). Expect mostly "No" or "Maybe a flicker."
      *   After 10 trials, have students hold up their L or R cards simultaneously for the final guess of the last trial, but collect the written sheets for the full dataset.
  4.  **TA Action:** Quickly tally the correct guesses vs. total guesses on the board while students watch. Calculate percentage.
      *   *Target:* You want >50% accuracy (ideally 55-60%) with <20% reporting conscious sight.

  ## Condition 2: The Broadcast (10 Minutes)
  *Goal: Simulate Global Workspace access (information available to all systems).*

  1.  **Trial Structure:** Run 5 trials.
  2.  **Presentation:** Play the "Broadcast" video sequence. The arrow appears for 500ms (clearly visible).
  3.  **Response:**
      *   Ask students to shout out the direction together.
      *   Ask: "Did everyone see that?" (Expect unanimous yes).
      *   Ask: "Could you tell me what it was later?" (Expect yes).
  4.  **TA Action:** Note the unanimity and confidence.

  ## Debrief & Mapping (20 Minutes)

  ### 1. The Data Contrast
  Write the Condition 1 accuracy on the board next to Condition 2 accuracy.
  *   **Condition 1:** Likely ~50-60% accuracy, low confidence, low report of seeing.
  *   **Condition 2:** 100% accuracy, high confidence, high report of seeing.

  ### 2. Mapping to Block (Access vs. Phenomenal)
  *   **Phenomenal Consciousness (P):** Ask Condition 1 students who guessed correctly but said "N" to "Saw?". Tell them: "Your brain processed the shape enough to guide your hand, but there was 'nothing it was like' to see it. You lacked the *qualia*. That is the dissociation."
  *   **Access Consciousness (A):** Explain that in Condition 1, the information was *accessible* to the motor system (you could guess), but not accessible to the reporting system (you couldn't confidently say "I saw it"). In Condition 2, the information was accessible to speech, memory, and reasoning.
  *   **The Point:** P-consciousness is the experience; A-consciousness is the availability for use. Blindsight patients (and you, just now) can have information guide action without the experience.

  ### 3. Mapping to Baars (Global Workspace)
  *   **Condition 1 (Local):** The visual cortex processed the arrow, and it leaked enough signal to the motor cortex to bias your guess, but it never entered the "Global Workspace." It wasn't broadcast. No other system (language, long-term memory) could grab it.
  *   **Condition 2 (Global):** The stimulus was strong enough to ignite the workspace. Once broadcast, every module (speech, memory, attention) could access it simultaneously. That is why you could all shout it out and remember it.

  ## Predictable Failures & Troubleshooting

  1.  **The "Chance" Failure:** The most likely outcome is Condition 1 accuracy lands exactly at 50%.
      *   *Why:* Projector latency, ambient light washing out the 16ms frame, or the mask isn't effective enough.
      *   *Fix:* If this happens, do not fake the data. Use it. Say: "In a real lab with a tachistoscope, this number goes up. Here, the hardware limited the dissociation. But conceptually, imagine if your guess was 70% correct while you still said 'I saw nothing.' That is the phenomenon."
  2.  **The "Blur" Claim:** Students will say, "I saw a flash," ruining the "no phenomenal consciousness" claim.
      *   *Fix:* Distinguish between seeing *energy* vs. seeing *content*. "You saw a flicker (energy), but did you see an *arrow* (content)? Blindsight patients see nothing, but can still point. If you saw a flicker, you have more awareness than a blindsight patient, but if you couldn't identify the direction consciously, the dissociation still holds."
  3.  **Timing Issues:** PowerPoint transitions are not precise.
      *   *Fix:* Use a pre-rendered MP4 video set to 60fps. One frame = 16ms. Test this on the specific projector beforehand. Some projectors have "image smoothing" that blurs single frames. Turn off all "enhancement" settings on the projector.

  ## Honest Limitations (What This Activity Cannot Reproduce)

  1.  **Lesion vs. Masking:** Real blindsight is caused by damage to V1 (primary visual cortex). This activity uses masking to temporarily inhibit processing. You are simulating the *behavior*, not the *mechanism*.
  2.  **The "Hard Problem":** This activity demonstrates functional dissociation (behavior vs. report). It does not explain *why* the broadcast condition feels like something and the subliminal one doesn't. You must supply the philosophical heavy lifting here: "We can see the difference in access, but we cannot measure the experience itself. We rely on your report."
  3.  **Access Consciousness Ambiguity:** In strict Blockian terms, if they can't report it, is it truly Access Conscious? Some argue blindsight is neither A nor P. Be prepared to clarify: "For this intro, we are treating 'guiding the guess' as a primitive form of access, while 'reporting verbally' requires global access."
