answer: |-
  Two national retailers, Alpha and Beta, vie for a single anchor lease. Alpha signs a penalized LOI and begins site prep (Deep). Beta files a zoning challenge triggering a mandatory 18-month regulatory stay on contested sites (Shallow). Alpha's standard financing lapses during the stay. Beta withdraws the challenge, signs the lease. Alpha loses sunk costs; Beta pays only filing fees. The race was to secure the spot; Alpha moved first to deter, but Beta's shallow procedural move exploited the irreversibility of time.

  **Demonstration**
  **Payoffs:** Ex-ante, both rank: (1) Solo Win > (2) Status Quo > (3) Solo Lose > (4) Mutual Conflict (War). This drives the race: each binds first to force (2) rather than risk (4).
  **Timing:** t0: Lease opens. t1: Alpha commits Deep (LOI). t2: Beta commits Shallow (Filing). t3: Stay expires, Alpha defaults, Beta wins.
  **Why Deep Fails:** Alpha's commitment binds *Alpha* (high reversal cost), but not the *environment*. Beta's commitment binds the *environment* (regulatory freeze) with low reversal cost for Beta.
  **Load-Bearing Feature:** Restorability Lag. Time lost during the stay cannot be recovered even if Beta withdraws. Alpha's resources burn during the lag; Beta's do not.
  **Ablation:** If the stay were instantaneous or waivable without lag, Alpha could wait it out. Beta's threat would lack credibility, and Alpha's Deep commitment would win as standard theory predicts.

  **Objection & Reply**
  **Objection:** "Beta's filing isn't a commitment; it's a bluff. Real commitment requires suffering."
  **Reply:** "Credibility comes from the consequence, not the committer's pain. The regulatory rule enforces the delay automatically. Beta need not suffer to make the delay real. The 'commitment' is to trigger the mechanism, which is cheap, not to sustain the pain."

  **Cheating Audit**
  1.  **Irrationality:** Avoided. Alpha followed standard "Deep First" doctrine. Loss was structural, not cognitive.
  2.  **Hidden Depth:** Avoided. Filing fees are public knowledge; no hidden penalties for Beta.
  3.  **Resource Asymmetry:** Avoided. Financing windows are industry-standard, not Alpha-specific weakness.
  4.  **Redefining Win:** Avoided. Beta secured the lease; Alpha lost capital. Clear ordinal victory.

