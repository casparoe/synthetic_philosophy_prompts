answer: |-
  ### 1. Essay Question

  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,500 words maximum

  **Question:**

  Consider the following case:
  **The Anxious Parent.** Maria's fundamental normative standard ($S$) is her child's long-term psychological flourishing. However, psychological research establishes that flourishing requires the child to feel loved *unconditionally*, not instrumentally. If Maria deliberates by asking, "Will this action maximize flourishing?", her child detects the calculation, feels managed, and flourishing decreases. Maria flourishes the child best by aiming directly at the child's immediate happiness ($H$), without referencing $S$.

  We define a standard as **Deliberately Self-Erasing (DSE)** if aiming at it reduces conformity to it. A DSE is **Ersatz** if it vanishes under idealization (perfect information, no akrasia, perfect instrumental reasoning); it is **Robust** if an idealized agent *still* conforms better by not aiming at $S$.

  You are presented with a trilemma regarding ideal deliberation and indirect normativity (the **Three-Ways Collapse**):
  1.  **Descriptive Idealization:** You idealize only facts/reasoning. If DSE is Robust, the ideal agent still shouldn't aim at $S$. Deliberation lacks a normative target.
  2.  **Normative Idealization:** You idealize the agent to know/aim at $S$. This risks circularity (defining ideality as aiming at $S$) or makes deliberation otiose (the agent is an oracle, not a deliberator).
  3.  **Stipulative Idealization:** You build the disposition to aim at $H$ into the definition of the ideal agent. This requires justifying why *not* aiming at $S$ is a feature of ideality rather than a defect.

  **Essay Task:**
  Answer the following question with a clear **Yes** or **No**: *Must the ideal deliberator's primary deliberative target coincide with the fundamental normative standard ($S$)?*

  In your answer:
  1.  Argue whether the DSE in *The Anxious Parent* is Ersatz or Robust, and explain why this classification forces your Yes/No answer.
  2.  Select one horn of the Three-Ways Collapse to defend. Explain the specific theoretical cost of your choice (e.g., circularity, otiosity, or justificatory burden) and why it is preferable to the alternatives.
  3.  Address the **Proxy-Status Question**: Is the deliberative target ($H$) merely instrumentally recommended by $S$, a genuine normative standard in its own right (a subjective ought), or non-normative rationality? Defend your classification and identify one major philosophical cost of that status.

  *Note: Do not summarize course readings. Use the concepts provided above to construct an original argument.*

  ***

  ### 2. Model Answer

  **Word Count:** 760 words

  **No.** The ideal deliberator's primary deliberative target need not coincide with the fundamental normative standard. In cases of Robust Deliberately Self-Erasing (DSE) standards, coincidence between the deliberative target and the normative standard is not just unnecessary; it is counter-productive. Defending this position requires accepting the third horn of the Three-Ways Collapse and affirming that the proxy target possesses genuine normative authority.

  First, the DSE in *The Anxious Parent* is **Robust**, not Ersatz. An Ersatz DSE relies on cognitive limitations; a non-ideal agent fails to aim at $S$ because they lack the processing power to calculate the right action without becoming anxious or distracted. However, Maria's case is structural, not computational. The good being produced (the child's feeling of unconditional love) is *constitutively dependent* on the motive from which the action flows. Even an agent with perfect information and unlimited reasoning time cannot generate the feeling of "unconditional love" through a calculation of "long-term flourishing." The calculation itself alters the causal properties of the interaction. If the ideal agent aims at $S$, the causal mechanism required to achieve $S$ is broken. Therefore, idealization does not dissolve the tension; it cements it. The ideal agent must aim at $H$ (immediate happiness) to satisfy $S$.

  This classification forces a **No** answer to the essay question. If the ideal agent must aim at $H$ to satisfy $S$, then the deliberative target ($H$) and the normative standard ($S$) diverge. To explain how this is possible without abandoning the authority of $S$, we must navigate the Three-Ways Collapse.

  I defend **Stipulative Idealization (Horn 3)**. We must define the ideal deliberator as an agent who possesses the stable disposition to aim at $H$ rather than $S$. The primary cost here is the **justificatory burden**: we owe an explanation of why a disposition to *ignore* the fundamental truth ($S$) counts as a perfection of agency rather than a defect. If $S$ is the truth about value, why is the ideal agent not oriented toward the truth?

  This cost is preferable to the alternatives. Horn 1 (Descriptive Idealization) leaves the ideal agent alienated from their own success; they know $S$ but are rationally required to ignore it, creating a fracture between normative knowledge and rational action. Horn 2 (Normative Idealization) renders deliberation otiose. If the ideal agent simply "outputs" $S$ without a deliberative procedure, we have not explained *how* reasons function in deliberation; we have merely posited an oracle. Horn 3 preserves the procedural nature of deliberation while acknowledging that the psychology of value-realization is complex. The justification lies in recognizing that "ideality" is not merely about epistemic access to $S$, but about the *efficacy of agency* in realizing $S$. If the human (or ideal) psyche realizes value only through indirect motives, then possessing those motives is a condition of successful agency.

  Finally, regarding the **Proxy-Status Question**, the target $H$ must be classified as **(ii) a genuine normative standard with its own authority** (a subjective ought). It is insufficient to claim $H$ is merely (i) instrumentally recommended. If $H$ were merely instrumental, the agent would always be vulnerable to recalculation: "Is aiming at $H$ *really* working?" If they ask this, they revert to aiming at $S$, triggering the DSE failure. To block this regression, the agent must treat $H$ as authoritative in the moment of deliberation. They must believe they ought to aim at $H$, full stop.

  The major cost of this status is **normative fragmentation**. We are forced to admit two levels of "ought": the Objective Ought (maximize $S$) and the Subjective Ought (aim at $H$). These can conflict in extension (what I should do subjectively differs from what is objectively best if I knew I could aim at $S$ successfully). This complicates moral theory significantly, as we can no longer assume that rational deliberation tracks objective truth directly. However, this fragmentation is the price of honesty about human psychology. If we insist on coincidence between target and standard to preserve theoretical unity, we sacrifice actual value realization. It is better to have a fragmented theory that guides agents to the good than a unified theory that guides them away from it.

  Therefore, because Robust DSE cases exist, the ideal deliberator must aim at a proxy. This requires stipulating that proxy-aiming is part of ideality and granting that proxy genuine normative weight, despite the cost of fragmenting the "ought."

  ***

  ### 3. Marking Scheme

  **Total Marks:** 20
  **Pass Threshold:** 10 Marks

  | Point | Requirement | Marks | Common Error / Botch |
  | :--- | :--- | :--- | :--- |
  | **1** | **Case Classification:** Clearly argues whether the *Anxious Parent* case is Ersatz or Robust DSE with a reason grounded in the case details (e.g., constitutive means vs. cognitive limit). | 4 | **Botch:** Claims it is Ersatz because "an ideal agent could fake it," ignoring the prompt's stipulation about the causal role of motives. |
  | **2** | **The Crux:** Provides a definitive Yes/No answer to the main question that logically follows from the DSE classification. | 4 | **Botch:** Hedges or says "It depends" without resolving the tension, failing to take a stand on the crux. |
  | **3** | **Collapse Selection:** Identifies one horn of the Three-Ways Collapse and explicitly articulates the theoretical cost (circularity, otiosity, or justificatory burden). | 4 | **Botch:** Describes all three horns but refuses to pick one, or picks one without acknowledging its specific cost. |
  | **4** | **Proxy Status:** Classifies the deliberative target ($H$) as Instrumental, Genuine Normative, or Non-Normative, and justifies why the other options fail. | 4 | **Botch:** Selects "Instrumental" but fails to explain how the agent avoids recalculating back to $S$ (the regression problem). |
  | **5** | **Synthesis:** Connects the Proxy Status choice back to the Collapse choice (e.g., showing how Genuine Normative status helps mitigate the Justificatory Burden). | 4 | **Botch:** Treats the Collapse and Proxy Status as two separate, unconnected essay questions. |

  **A vs. B Distinction:**
  An **A** answer integrates the Collapse and Proxy-Status into a unified theory of agency (showing how one solves the problem of the other), whereas a **B** answer addresses them as distinct checklist items without showing their systemic relationship.
