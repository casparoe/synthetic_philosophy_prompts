answer: |-
  ### I. Disciplined Mapping

  **The Agent**
  The formal agent is CERN Council, acting on behalf of member states. This identification is contested because the locus of agency is fragmented: the scientific leadership proposed the risk, the member states funded it, but the risk-bearers included the global population and future generations who had no representation. A unitary expected-value agent assumes a single utility function; here, the beneficiaries (physicists, future technology) and the risk-bearers (humanity) are distinct groups with non-overlapping veto power in a democratic ideal, but overlapping fate in reality.

  **The Option Set and Fanatic Ranking**
  1.  **Cancel/Don't Run:** Expected value is the status quo future (finite but large).
  2.  **Run at Design Energy:** Expected value is (Probability of Safety × Value of Science + Value of Future) − (Probability of Catastrophe × Value of All Future Value).
  3.  **Run and Ramp:** A sequence of options with increasing energy and, allegedly, increasing risk.
  4.  **Defer:** Cost of delay minus potential risk reduction.

  **The Fanatic's Decision Rule**
  Fanaticism dictates maximizing expected value. If the value of the future is sufficiently large (longtermist assumption), any non-zero probability of extinction ($P_{ext}$) dominates the calculation.
  *   **Ranking:** Cancel > Defer > Ramp > Run at Design.
  *   **The Flip Point:** The ranking flips only when $P_{ext} = 0$ (structurally) or when $P_{ext}$ is sufficiently low that $P_{ext} \times V_{future} < V_{science}$. Given $V_{future}$ is typically modeled as vast (trillions of lives), the permissible $P_{ext}$ is vanishingly small (e.g., $< 10^{-20}$). If $V_{future}$ is infinite, any $P_{ext} > 0$ forbids the machine.

  **Where the Mapping Breaks**
  The expected-value frame captures the *trade-off* structure (science vs. safety) but fails to represent:
  1.  **Model Uncertainty:** The frame treats $P_{ext}$ as a parameter within a known model. The LHC debate was about the validity of the models themselves (Hawking radiation, strangelet stability).
  2.  **Legitimacy:** The frame aggregates value. It cannot capture the moral asymmetry of imposing risk on non-consenting others.
  3.  **The Nature of "Safety":** The decision process sought to establish *safety* (binary), not to optimize *risk* (continuous). The EV frame assumes risk is always present and tradable; the actual process treated risk as something to be eliminated.

  ### II. Four Problems for Fanaticism

  **1. The Status of the Probability Bound (Selection Effects)**
  The cosmic-ray argument is not a frequency argument; it is an observational selection argument. We observe no catastrophes because we exist to observe. For a fanatic, this is insufficient. A selection effect bounds the probability conditional on the *similarity* of cosmic ray collisions to collider collisions. It does not bound the probability that the collider introduces a novel mechanism (e.g., low-velocity strangelets) absent in cosmic rays.
  *Position:* The selection-derived bound does not do the same work as an empirically measured one for an expected-value calculation. An empirical frequency allows a Bayesian update on a known hypothesis space. A selection effect only tells us we are in a branch of the multiverse (or timeline) where catastrophe didn't happen *yet*. For the fanatic, the safety case collapses unless the physical argument (Hawking radiation) is treated as a proof, not a theory. Since physics offers no absolute proofs, the selection argument leaves a residual $P_{ext} > 0$, which fanaticism should treat as decisive.

  **2. Learning by Doing (Ramping)**
  If $P_{ext} > 0$ at any energy, running at low energy to test safety carries an expected cost dominated by the catastrophic term. The ramping procedure (2008 low energy, 2010 higher, 2015 design) is irrational under fanaticism unless the agent believes $P_{ext} = 0$ at low energies and only becomes positive at a specific threshold.
  *Position:* This is a *reductio* of fanaticism as a decision procedure. There is no physical basis for claiming $P_{ext} = 0$ at 3.5 TeV and $P_{ext} > 0$ at 6.5 TeV if the mechanism (black hole production) scales with energy; the cross-section changes, but the risk type does not. If the fanatic accepts the risk is non-zero at design energy, it is non-zero at startup. The fact that ramping is the *sensible* institutional response shows that fanaticism cannot guide action even for those who accept its criterion of rightness. It demands a certainty that learning cannot provide without risking the very outcome to be avoided.

  **3. The Burden and the Structural Zero**
  The practical response was to press the science to turn a small positive probability into a structural zero (e.g., "Black holes *must* evaporate").
  *Position:* This strategy is available only in rare cases where physical laws can be treated as logical necessities. Fanaticism bites harder on *model uncertainty* (is the theory of Hawking radiation true?) than *parameter uncertainty* (what is the evaporation rate?). This case sits squarely in model uncertainty. When a structural zero is unavailable—as is typical in empirical science—fanaticism demands paralysis. A general strategy of "prove structural zero" is therefore a strategy for halting almost all high-stakes innovation. The fanatic must either accept paralysis or arbitrarily treat high-confidence models as structural zeros, which undermines the rigor of the view.

  **4. Imposition and Consent**
  Standard fanaticism aggregates value: $1 \text{ billion lives} \times \text{small risk}$ vs. $\text{scientific progress}$. It ignores that the risk is imposed by a few on the many without consent.
  *Position:* The needed supplement is an independent side constraint, not a modification of fanaticism. Fanaticism is a theory of the *Good* (maximize value); this case turns on the *Right* (legitimacy of imposition). Adding a consent condition reveals fanaticism to be silent on the core moral problem. If the constraint is absolute (no existential risk without universal consent), fanaticism is overridden. If the constraint is weighted, it collapses back into expected value. The LHC case was resolved not by weighing the science against the risk, but by establishing the *authority* of the safety reviews. Fanaticism has no vocabulary for authority or legitimacy, only for value sums.

  ### III. Verdict on the Theory

  The case **undermines** fanaticism as a practical guide.

  The reading that the case "confirms" fanaticism fails because the participants did not behave as expected-value maximizers. They did not calculate $P \times V$. They sought to demonstrate $P \approx 0$. The reading that it "never tests" fanaticism because $P$ was argued to zero is too charitable; $P$ was argued to be *negligible*, not logically zero. A true fanatic should have rejected "negligible" given the stakes.

  The episode is better explained by a **Political-Legitimacy Account combined with Weak Precaution**. The decision rule was: "Proceed only if independent review establishes that the risk is physically impossible (or indistinguishable from background natural risk), and ensure the process is transparent enough to grant legitimacy to the imposition." This explains the commissioning of reviews (legitimacy), the reliance on cosmic ray analogies (naturalizing the risk), and the ramping (demonstrating control). The fanatical frame explains none of these specific procedural choices; it only explains the *anxiety* that prompted them.

  To truly test fanaticism, we would need a case where: (1) $P_{ext}$ is known to be non-zero but small (e.g., $10^{-9}$); (2) The benefits are vast but finite; and (3) The decision must be made without the possibility of further risk-reducing research. The LHC case allowed the agents to argue $P \to 0$. A true test denies that move.

  ### IV. Limits and Assumptions

  1.  **Size of Stakes:** This analysis assumes the loss of all future human value is **finite**. If the value of the future is infinite (strong longtermism), then *any* $P_{ext} > 0$ renders the Expected Value of running negative infinity. Under that assumption, the LHC decision was objectively wrong unless $P_{ext}$ was proven to be exactly zero. My analysis assumes a "very large finite" value to allow for trade-off discussion; if you assume infinite value, the fanatic position becomes trivial and the LHC decision becomes indefensible on EV grounds.
  2.  **Commensurability:** I am treating the epistemic benefits of the experiment (knowledge) as commensurable with prudential ones (survival). Fanaticism silently presupposes this. If knowledge is incommensurable with survival, the EV sum cannot be constructed. The LHC reviews treated safety as a constraint, not a variable to be traded against knowledge, suggesting the agents did not accept commensurability.
  3.  **Fact Dependence:**
      *   My claim that ramping is a *reductio* depends on your fact that collisions occurred at 3.5 TeV before 6.5 TeV.
      *   My claim that the selection effect is weak depends on your fact that the cosmic ray argument relies on *observed* non-catastrophe.
      *   My claim that the agent is contested depends on your fact that CERN is an international organization with distinct member-state funders and a global risk-bearing population.

  If the safety reviews had actually calculated a specific probability (e.g., $10^{-15}$) and weighed it against the value of the Higgs boson, the "Undermines" verdict would shift to "Confirms." They did not. They argued for impossibility.
