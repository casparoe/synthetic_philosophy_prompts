answer: |-
  There is no single, canonical term in legal theory or parliamentary procedure that precisely captures this specific structural pattern.

  The closest existing concepts are **Implied Amendment** (where a later law alters an earlier one without naming it) and **Incorporation by Reference** (where a rule adopts external definitions). However, neither fits perfectly: *Implied Amendment* usually suggests a conflict where the later rule wins, whereas your examples involve a *dependency* where the later rule changes the ground beneath the first. *Incorporation by Reference* describes the link, but not the *tactic* of exploiting that link to bypass safeguards.

  Since you asked for a carving and not just a label, I will coin a term that fits the theoretical structure of the problem, define it, and then perform the boundary analysis you requested.

  ### The Term: **Oblique Amendment**

  I propose **Oblique Amendment** (or **Oblique Modification**).

  **Definition:** An Oblique Amendment occurs when the operative effect, scope, or protection of a Target Rule ($R_t$) is altered by modifying a Dependent Rule ($R_d$), rather than by amending the text of $R_t$ directly.

  *   **Target Rule ($R_t$):** The rule whose practical effect is changed (e.g., the fee section, the notice rule).
  *   **Dependent Rule ($R_d$):** The rule that is actually voted on and changed (e.g., the general amendment procedure, the definitions section).
  *   **The Obliqueness:** The change travels through a logical dependency (semantic or procedural) rather than a direct textual overwrite.

  ### The Carving: Boundary Analysis

  To understand whether this is a coherent category, we must test the boundaries. You asked specifically about the difference between redefining words versus altering procedures, and whether "dormant" changes count.

  #### 1. Semantic vs. Procedural Dependencies
  *Is redefining a word really the same move as altering an amendment procedure?*

  **Yes.** In rule theory, both are **Conditions of Application**.
  *   **Semantic Dependency:** The rule says "If $X$ (money), then $Y$ (notice)." You change the definition of $X$. The logical structure of the rule ($X \rightarrow Y$) remains untouched, but the *input set* has changed.
  *   **Procedural Dependency:** The rule says "To change $R_t$, do $Z$ (2/3 vote)." You change the rule governing $Z$ (to simple majority). The text of $R_t$ remains untouched, but the *cost function* to alter it has changed.

  In both cases, the **Normative Force** of $R_t$ has shifted without its **Textual Integrity** being breached. This is the core of the Oblique Amendment. It exploits the fact that rules are not isolated sentences but nodes in a network of references.

  #### 2. The "Null Effect" Boundary
  *Does the case where the second rule changes nothing yet anyway count?*

  **Yes.** This distinguishes an Oblique Amendment from a simple **Conflict**.
  If you change the definition of "money" to exclude "honoraria," but the organization has never paid an honorarium, the *actual* history hasn't changed. However, the **Counterfactual State** of the system has.
  *   **Direct Amendment:** Changes the rule's instruction.
  *   **Oblique Amendment:** Changes the rule's *environment*.

  If the change is merely dormant, it is still an Oblique Amendment because it alters the **Modal Scope** (what *can* happen) rather than the **Actual Scope** (what *has* happened). In legal theory, this is significant because it shifts the burden of future action. It turns a protected state into an unprotected one, even if no one has yet tried to breach it.

  #### 3. Intent vs. Structure
  *Does accidental Oblique Amendment count?*

  **Yes.** The term describes the *structural mechanism*, not the *intent*.
  *   **Malicious Oblique Amendment:** Deliberately redefining "money" to bypass notice rules.
  *   **Negligent Oblique Amendment:** Cleaning up definitions for clarity, unaware that a safeguard relies on the old definition.

  Both are Oblique Amendments. However, in parliamentary law, the remedy often depends on intent. A negligent Oblique Amendment might be fixed by a "clarifying motion," whereas a malicious one might require a point of order regarding "circumvention of the bylaws."

  #### 4. The Hierarchy Boundary
  *What if the Dependent Rule is "higher" than the Target Rule?*

  This is the critical failure point in your first example.
  *   **Normal Oblique Amendment:** $R_d$ and $R_t$ are peers (e.g., Definitions and Notice Rule).
  *   **Hierarchical Oblique Amendment:** $R_d$ claims to be a "general rule" that overrides $R_t$'s "specific protection."

  In your first instance (2/3 vote vs. simple majority), this is technically a **Normative Collision**. Most parliamentary authorities (like *Robert's Rules of Order Newly Raised*) hold that a **Specific Rule** (fee section protection) prevails over a **General Rule** (all sections changeable by majority).
  *   If the organization treats the General Rule as winning, they have allowed an Oblique Amendment to override a **Entrenched Clause**.
  *   If they treat the Specific Rule as winning, the Oblique Amendment **Failed** regarding that section.

  This boundary is vital: An Oblique Amendment is only *successful* if the system's conflict-resolution rules allow the Dependent Rule to override the Target Rule's implicit assumptions.

  ### Why This Matters (The Trap)

  The danger of the Oblique Amendment is that it bypasses **Deliberative Salience**.

  When you propose to change the Fee Section, members pay attention. They know fees affect them. When you propose to change the Definitions Section, members glaze over. It seems technical. By moving the change to $R_d$, the proposer lowers the political cost of the change.

  In constitutional theory, this is sometimes called **Unconstitutional Constitutional Amendment** (changing the constitution in a way that violates its core principles without formally touching them). In your volunteer context, it is **Procedural Arbitrage**: exploiting the lower voting threshold or attention level of one rule to alter the effect of another.

  ### Summary for Your Rules

  If you need to write a rule to prevent this, you cannot simply ban "Oblique Amendments" (too vague). You must close the dependency loops.

  **Drafting Fix 1 (The Lock):**
  > "No rule requiring a supermajority for amendment may be effectively altered by a simple majority motion, whether by direct amendment, redefinition of terms, or alteration of general amendment procedures."

  **Drafting Fix 2 (The Canon):**
  > "In the event of a conflict between a specific protection and a general procedure, the specific protection shall prevail, regardless of the date of adoption."

  **Drafting Fix 3 (The Definition Lock):**
  > "Definitions that limit the scope of protected rules (e.g., 'money', 'membership') may only be amended by the same vote threshold required to amend the protected rules themselves."

  ### Verdict
  There is no standard term. **Oblique Amendment** is the precise carve-out you need. It captures the indirectness, the structural dependency, and the effective change without textual alteration. It distinguishes itself from *Implied Repeal* (which is about conflict) by focusing on *Dependency* (which is about logic). It covers both semantic and procedural shifts, and it counts even when the effect is currently dormant.
