      *(Self-Correction during drafting)*: I initially thought about putting "Distributed Comprehension" first. But "Verification Asymmetry" is more fundamental to the *eval suite* which is the engineer's primary tool. If we can't measure it, we can't manage the distributed comprehension. So Asymmetry goes first.
