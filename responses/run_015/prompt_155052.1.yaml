      *   *Refining the Top 3:*
          1.  **The Verification Asymmetry Hypothesis:** Can we distinguish "fake" competence from "real" understanding via evals? If not, stop trying.
          2.  **The Locus of Reliability (Distributed Comprehension):** If the model doesn't understand, where does the safety come from? (Guardrails, humans, evals).
