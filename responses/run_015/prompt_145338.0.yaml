      *   *Convent Space:* The convent was supposed to be a sanctuary for study. The Bishop breached this. -> *Convent's protected space.*
      *   *Gendered Framing:* "Sor Filotea" mimics sisterhood but exercises male authority. -> *Pseudonym's gendered framing.*

