      *   *Severe:* Demonstrating that prediction error minimization occurs without any "compression" loss that would necessitate an illusion. (If the bandwidth is sufficient, why compress?)
      *   *Awkward:* Explaining specific qualia distinctions (why does red *feel* like red and not blue if both are just error signals?).

