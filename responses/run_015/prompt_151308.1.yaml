      *   *The "Zombie" Angle:* If a system minimizes error perfectly without the "narrative layer," does it still behave identically? If yes, the narrative is epiphenomenal (bad for PP which ties function to structure).
      *   *The "Immediacy" Problem:* Illusions usually feel like *something*. If the illusion is *of* feeling, what is the substrate? (The "Illusion of what?" objection).
