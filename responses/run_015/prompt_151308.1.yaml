      *   This is the biggest risk. If "I feel pain" = "My system is generating an error signal tagged as pain," then denying the feeling is just denying the tag.
      *   *The Trap:* If the theory says "Experience is X," and someone says "I don't experience X," the theorist says "That's part of the illusion."
      *   *Is it appropriate?* For a metaphysical claim about the *non-existence* of something, it's tricky. But for a functionalist claim, it needs to predict *when* the illusion fails.
      *   *Solution:* The theory needs to predict *breakdown conditions*. When does the illusion crack? (e.g., psychedelics, meditation, brain lesions).

  6.  **Identifying Defender Concessions (Pressure Points):**
      *   *The "Hard Residue":* Even if it's an illusion, the *illusion itself* has a phenomenal character. Why does the illusion feel like *this*?
