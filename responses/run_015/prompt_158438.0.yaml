answer: |-
  Yeah, I know exactly what you mean about that statue-and-clay puzzle because it is one of those philosophical rabbit holes that looks simple at first but then completely hijacks your brain. It is awesome that you and your friend took it down the path of museum contracts and 3D printing because those additions actually make the problem way harder and more interesting than the classic version. When you ask for the full spec of what a theory needs to deliver here, you are basically asking for the job description of metaphysics regarding physical objects, and it is a brutal list of requirements because common sense pulls us in opposite directions. To start with, any theory trying to solve this has to give a clear account of persistence conditions, which is just a fancy way of asking what it takes for a thing to stay itself over time. In the classic squish scenario, your gut tells you the clay survives the squishing but the statue does not, so the theory has to explain why being statue-shaped is essential to the statue but only accidental to the clay. It needs to tell you why the statue ceases to exist the moment the shape is lost while the material stuff keeps going, and it has to do this without magic. If the theory says they are literally the same object, then it has to explain how one object can both survive and not survive the same event, which is a logical contradiction, but if the theory says they are different objects, it has to explain how two distinct things can be in the exact same place at the exact same time without crashing into each other like ghosts.

  That brings us to the second major requirement, which is handling co-location without making the world seem absurdly crowded. If you say the statue and the clay are different things, you are committed to the idea that everywhere there is a shaped object, there are actually at least two things there, the material and the form, and maybe even more if you count the lump of matter, the collection of molecules, and the artistic work. A good theory needs to decide if this proliferation of objects is a bug or a feature, and it has to explain why we usually only see one thing instead of a stack of overlapping entities. This is where your museum contract scenario really turns the screws because it introduces social and historical facts into the physical existence of the object. A theory of material constitution has to decide whether a contractual obligation can change what an object essentially is. If the clay is borrowed and must be returned as a lump, does that mean the clay is essentially a lump and only temporarily a statue, or does the contract just dictate what humans must do to it without changing its metaphysical status? The theory needs to distinguish between physical constraints and normative constraints, explaining why breaking the contract is a legal or moral failure but squishing the statue is an ontological destruction. It cannot collapse the difference between what an object is made of and what an object is, because if it does, you lose the ability to say the statue is made of clay without saying the statue is identical to the clay, which brings you right back to the survival contradiction.

  Then you have the 3D printing and recycling scenario, which adds a requirement about transmutation and kind membership. When the plastic pellets become a chair and then get melted down to become a shoe, the theory has to track what persists through that process. Is it the same object changing forms, like a caterpillar becoming a butterfly, or is the chair destroyed and a new shoe created from the same stuff? A robust theory needs to handle cases where the material stays the same but the function and shape change radically, and it has to tell us if the identity of the object is tied to its current arrangement or its history. This is tricky because if you say the object is just the material, then the chair and the shoe are the same thing, which feels wrong because a chair cannot be a shoe, but if you say the object is the shape or function, then the object pops in and out of existence every time you melt or mold the plastic. The theory needs to provide a principle for when destruction happens versus when modification happens, and it cannot just rely on human intention because sometimes things are destroyed accidentally without anyone intending it. You also need the theory to maintain the distinction between composition and identity, which is the heart of the whole mess. Being composed of clay is a relationship between two things, the statue and the matter, whereas being identical to the clay is a claim that there is only one thing there. If a theory collapses this distinction, it cannot explain why the clay existed before the statue was molded, because if they are identical, they must have the same start date, but we know the lump of clay was sitting on the table before the artist touched it.

  Another heavy demand on the theory is that it has to account for modal properties, which are facts about what could or could not happen to the object. The statue could not survive being squished, but the clay could, so they have different properties regarding possible futures. The theory has to explain how two things occupying the same space can have different potential futures without violating the rule that identical things share all properties. This is where things start to look impossible to meet all at once, and honestly, most philosophers agree that you probably cannot satisfy every single one of these intuitions without giving something up. You might have to accept that our common sense idea of an object is just fuzzy and that reality does not care about our categories, or you might have to accept that there are indeed multiple objects in the same place and our brains just filter them out. The impossibility comes from the fact that we want the theory to validate our gut feelings about the statue dying and the clay living, but we also want the theory to respect the logical rule that two things cannot be in one place, and we also want it to respect the rule that if two things share all the same physical parts and location, they should be the same thing. You can usually pick two of those but not all three.

  So when you are looking for a theory to settle your coffee shop debate, you need to look for one that explicitly tells you which of those intuitions it is willing to sacrifice. A good spec requires the theory to be clear about whether it prioritizes logical consistency over common sense, or common sense over logical simplicity. It needs to handle the museum case by clarifying if external rules like contracts can define internal essence, and it needs to handle the 3D printing case by defining whether identity is tied to matter, form, or history. Ultimately, the theory must deliver a verdict on whether the statue is a new thing created from the clay or just the clay in a specific state, and it must stick to that verdict across all the variations you throw at it. If it says the statue is just the clay shaped up, then it has to explain why the statue dies when squished while the clay lives, which might require saying that destruction is just a change in description rather than a change in reality. If it says the statue is a new thing, it has to explain how that new thing came into existence without new matter appearing out of nowhere. There is no free lunch here, and the sharpest reasoning comes from admitting that any solution will feel a little weird in some scenarios. The goal is not to find a theory that feels perfect in every case, because that likely does not exist, but to find one that is consistent enough to help you predict the answer in new cases like your recycling example without contradicting itself. You want a framework that lets you say whether the chair turned into the shoe or died and was replaced, and whatever answer it gives, it should be the same kind of answer it gave for the statue and the clay. It is a tough ask, and honestly, the fact that you are still turning it over means you are doing the metaphysics right because the puzzle is designed to resist a clean solution.
