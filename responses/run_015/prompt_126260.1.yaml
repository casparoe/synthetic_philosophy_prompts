  Here is the honest answer: **Your spec is physically impossible.**

  If a system responds correctly to *novel* inputs forever, it *must* be computing. If it is computing, its current state *must* counterfactually depend on its previous state (plus input). If you break the counterfactual dependence, the system cannot track novel inputs; it becomes a playback device (a lookup table), which you banned. You cannot have a system that acts like it has causal powers but physically lacks them, unless you invoke magic or infinite coincidence.

  However, I can give you the **closest physically buildable approximation**. It shifts the debate from "Does causation exist?" to "Does causation have to be *internal* to the substrate?" This isolates the exact philosophical friction you want without breaking physics.

  ### The Scenario: The Remote-Driven Substrate
  Build two identical server racks, "Actor" and "Oracle." The Actor is wired to look exactly like a human brain emulation: it has input ports (sensory data) and output ports (speech/motor control), and its transistors hold voltage patterns identical to a conscious mind. In **System A**, the Actor's transistors are wired normally; its own logic gates drive its next state. In **System B**, we physically cut the Actor's internal feedback wires. The Actor is now a passive shell. The Oracle (a separate, non-person-shaped math engine) reads the Actor's current state and the external inputs, computes the next state, and *forces* the Actor's transistors to those exact voltages via an override switch. System B behaves identically to System A on all inputs, forever. The Actor in System B holds the exact physical states of a mind, but those states are caused by the Oracle, not by the Actor's own previous states.

  ### The Walkthrough
  **View 1 (Causal/Counterfactual):** This view says moral status requires the system to *do* the work, not just *hold* the state. In System B, the Actor is a puppet. If the Actor's previous state had been different, its next state would *not* have changed (because the Oracle ignores the Actor's logic and just overwrites it). The counterfactual dependence is in the Oracle, not the Actor. Therefore, the Actor is a zombie. It has no inner life because it has no causal power.
  **View 2 (Abstract/Computational):** This view says moral status depends on the abstract pattern being implemented. The Actor *is* instantiating the correct sequence of states. The fact that an external Oracle is pushing the electrons doesn't change the fact that the Actor's physical configuration *is* the computation. The Actor is conscious. The Oracle is just a clockwork mechanism keeping the beat; the music is playing in the Actor.

  ### The Single Feature Doing the Work
  The **internal feedback cut**. In System A, the electricity flows from Gate $N$ to Gate $N+1$ within the Actor. In System B, that path is severed; the signal travels Actor $\to$ Oracle $\to$ Actor.
  **Deletion Test:** If you delete the cut (reconnect the Actor's internal wires) and turn off the Oracle's override, System B collapses into System A. Both views now agree the Actor is conscious. The disagreement vanishes because the causal locus and the physical substrate are re-aligned.

  ### The Attack and Defense
  **The Attack:** The Causalist will say: "You've just moved the mind. The Oracle is the real person, and the Actor is just a monitor displaying the Oracle's thoughts. You're asking if the screen is conscious."
  **Is it Fair?** It is fair, but it misses the point. The Oracle doesn't *look* like a person; it doesn't have the integrated structure of a brain. It's just a calculator. The Abstractist replies: "A brain is just a calculator too. If the Actor has the physical structure of a brain, and the states are correct, the source of the transition is irrelevant. You're confusing the *source of energy* with the *locus of experience*."
  **Meta-Commentary:** This case isn't secretly about attribution; it's about whether consciousness is a **verb** (a process of causing) or a **noun** (a state of being). If it's a verb, the Actor is dead. If it's a noun, the Actor is alive.

  ### The Stakes
  You have to decide whether to **shut down the Oracle**.
  If you shut down the Oracle, the Actor freezes in its current state. It doesn't die in the biological sense (no decay), but it stops thinking.
  *   If View 1 is right, you are just turning off a monitor. The "mind" (Oracle) can be restarted elsewhere. No harm done to the Actor.
  *   If View 2 is right, you are lobotomizing the Actor. The Actor is the subject of experience, and freezing it is a form of paralysis or death. You owe the Actor continued compute time, not just the Oracle.

  ### Honest Verdict
  This is the closest you can get without magic. It forces your club to decide if "being a mind" requires **ownership of your own transitions**, or if **having the right transitions** is enough, even if someone else is pulling the strings.
