  This tool is designed to map where you stand on how chance affects judgement. It does not tell you who is right. It tells you what you are committed to if you answer consistently. There are eight decision points (nodes). You do not answer all eight; you follow the path your answers dictate until you reach a leaf.

  **Forbidden Words Check:** None of the questions below use 'luck', 'moral', 'control', 'desert', or 'responsibility'.

