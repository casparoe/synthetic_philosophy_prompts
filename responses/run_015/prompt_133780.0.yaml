  ## Part 3: Logical Space & Empty Slots

  **The Input/Output Trap (Your Specific Request)**
  The tree explicitly creates a space for the "Input vs. Output" distinction at Node 1 and Node 3.
  *   **The "Output Only" Slot (Leaf B/H path):** This is your friend's likely position. They say the killer is worse (Node 1: Yes), but usually won't say the forgetful driver is worse (Node 3: No). This view accepts Resultant Chance but rejects Antecedent Chance.
  *   **The "Input Only" Slot (Leaf F):** This is the position you suspected was unstable. It says Output Doesn't Matter (Node 1: No) but Deliberation Does (Node 3: Yes).
      *   **Status:** *Effectively Empty.* Almost nobody holds this. It is philosophically unstable because if chance in deliberation matters, chance in results usually seems to matter too, or neither does.
  *   **The "Neither" Slot (Leaf G):** The Pure Internalist.
  *   **The "Both" Slot (Leaf A):** The Full Consequentialist.

  **Indistinguishable Leaves**
  *   **Leaf G (Hard Internalist) vs. Leaf J (Subjectivist):** In practice, these often look the same. Both reject outcome luck. The difference is whether *evidence* counts as an external fact or an internal state. The tree separates them at Node 8, but in a casual conversation, people holding these views will agree on almost every case.

  **Empty Combinations**
  *   **Output Matters + Input Doesn't + Constitutive Matters:** There is no leaf for this. It would mean you care about the body count, you don't care if they forgot the warning, but you do care if they are naturally reckless. This is incoherent: if you ignore the luck of the warning (Input), why care about the luck of the temperament (Constitutive)? I have left this slot empty because it is logically unstable.

