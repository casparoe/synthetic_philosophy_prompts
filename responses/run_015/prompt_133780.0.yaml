  ## Part 1: The Decision Tree

  ### Node 1: The Two Drunk Drivers (Output Chance)
  **Case:** Two people drink the same amount, drive the same way, and weave across the line equally. One hits a child and kills him. The other gets home safely.
  **Question:** Is the one who killed the child more at fault than the one who got home?
  *   **Yes (Outcome Matters):** Go to Node 2.
  *   **No (Outcome Does Not Matter):** Go to Node 3.

  > **Branch Label:** **Outcome Sensitivity**.
  > **Epistemic Status:** *Genuinely fought-over.* This is the core dispute between you and your friend. There is no consensus in the literature or the law.

  ### Node 2: The Careless Lorry Driver (Unforeseeable Output)
  **Case:** A driver checks all mirrors, drives at the limit, and is fully attentive. A child runs out from behind a parked truck where no human could have seen them. The child dies.
  **Question:** Is the driver at fault for the death?
  *   **Yes (Results Trump Foreseeability):** Go to Node 4.
  *   **No (Foreseeability Required):** Go to Node 5.

  > **Branch Label:** **Strict Liability vs. Foreseeability**.
  > **Epistemic Status:** *Mostly agreed.* Most people who say "Outcome Matters" in Node 1 still say "No" here. If you say "Yes" here, you hold a very hard line.

  ### Node 3: The Forgotten Warning (Input Chance)
  **Case:** Two people decide to drive after drinking. One remembers a news report about drunk driving crashes they heard earlier. The other forgets the report entirely because a loud noise distracted them at the bar. Both drive identically.
  **Question:** Is the one who forgot the warning more at fault than the one who remembered it?
  *   **Yes (Deliberation Matters):** Go to Node 6.
  *   **No (Deliberation Does Not Matter):** Go to Node 7.

  > **Branch Label:** **Deliberation Sensitivity**.
  > **Epistemic Status:** *Genuinely fought-over.* This is your "Input Luck" distinction. Many people haven't thought about this, so answers here are often unstable.

  ### Node 4: The Voter (Collective Output)
  **Case:** Two people vote for the same economic policy. In one region, it causes a famine. In the other, due to different weather, it causes no harm.
  **Question:** Is the voter in the famine region more at fault than the other?
  *   **Yes:** Leaf A.
  *   **No:** Leaf B.

  > **Branch Label:** **Collective Outcome Sensitivity**.
  > **Epistemic Status:** *Tidy structure on a mess.* This tests if your view on Node 1 applies to collective/remote actions. Many people separate these.

  ### Node 5: The Gauguin (Justification)
  **Case:** A man abandons his family to paint. One succeeds and becomes a great artist. His twin does the exact same thing but fails and produces nothing.
  **Question:** Did the successful one do the right thing, while the failed one did the wrong thing?
  *   **Yes:** Leaf C.
  *   **No:** Leaf D.

  > **Branch Label:** **Retrospective Justification**.
  > **Epistemic Status:** *Genuinely fought-over.* This is Williams' specific challenge. It separates those who think success cleans the slate from those who think the act stands alone.

  ### Node 6: The Temperament (Constitutive Input)
  **Case:** Two people drive sober. One is naturally cautious by temperament. The other is naturally reckless but forces themselves to drive carefully today.
  **Question:** Is the naturally reckless one more at fault for their thoughts, even if they drive safely?
  *   **Yes:** Leaf E.
  *   **No:** Leaf F.

  > **Branch Label:** **Constitutive Sensitivity**.
  > **Epistemic Status:** *Mostly agreed.* Most say "No". If you say "Yes", you are judging character, not just choices.

  ### Node 7: The Punishment vs. The Feeling (Sanction)
  **Case:** Back to the Two Drunk Drivers (Node 1). Assume you said they are *equally* at fault.
  **Question:** Should the law punish them the same, and should they feel the same guilt?
  *   **Yes (Same Punishment, Same Guilt):** Leaf G.
  *   **No (Different Punishment or Different Guilt):** Leaf H.

  > **Branch Label:** **Sanction vs. Sentiment**.
  > **Epistemic Status:** *Tidy structure on a mess.* Many people want to punish differently for safety reasons but think the internal fault is the same. This forces you to pick.

  ### Node 8: The Evidence (Epistemic Input)
  **Case:** Two people drive drunk. One was lied to by a doctor and believes they are sober. The other knows they are drunk.
  **Question:** Is the one who was lied to less at fault?
  *   **Yes:** Leaf I.
  *   **No:** Leaf J.

  > **Branch Label:** **Evidence Sensitivity**.
  > **Epistemic Status:** *Mostly agreed.* Almost everyone says "Yes". If you say "No", you are a radical objectivist.

  ---

  ## Part 2: The Leaves (Positions)

  **Leaf A: The Full Consequentialist**
  *   **Path:** Outcome Matters → Strict Liability → Collective Outcome Matters.
  *   **Commitment:** You are answerable for everything that follows your act, even in complex systems you cannot predict.
  *   **Awkward Thing:** You must admit a careful driver who kills is worse than a drunk driver who doesn't, if the result is worse.

  **Leaf B: The Foreseeability Limit**
  *   **Path:** Outcome Matters → Foreseeability Required → Collective Outcome Doesn't Matter.
  *   **Commitment:** Results matter, but only if they were reasonably predictable.
  *   **Awkward Thing:** You have to draw a sharp line between "predictable" and "unpredictable" where the difference is often a matter of inches.

  **Leaf C: The Success Justifier**
  *   **Path:** Outcome Matters → Foreseeability Required → Success Makes It Right.
  *   **Commitment:** The value of a life project is determined by how it ends, not how it started.
  *   **Awkward Thing:** You must tell the failed twin that his abandonment of his family was wrong, while his brother's was right, though they did the exact same thing.

  **Leaf D: The Act Purist**
  *   **Path:** Outcome Matters → Foreseeability Required → Success Doesn't Change Wrongness.
  *   **Commitment:** Outcomes affect blame, but they cannot rewrite the past.
  *   **Awkward Thing:** You hold that the successful artist did something wrong, even if the world is better for his art.

  **Leaf E: The Character Judge**
  *   **Path:** Outcome Does Not Matter → Deliberation Matters → Constitutive Matters.
  *   **Commitment:** We are judged on who we are, not just what we choose.
  *   **Awkward Thing:** You must blame someone for their temperament, which they did not choose.

  **Leaf F: The Pure Will**
  *   **Path:** Outcome Does Not Matter → Deliberation Matters → Constitutive Doesn't Matter.
  *   **Commitment:** Only conscious choices count. Mood and nature are irrelevant.
  *   **Awkward Thing:** You must claim the person who forgot the warning due to a random noise is equally at fault as the one who remembered it.

  **Leaf G: The Hard Internalist**
  *   **Path:** Outcome Does Not Matter → Deliberation Does Not Matter → Same Punishment/Guilt.
  *   **Commitment:** Nothing outside the will affects judgement. The law and the conscience should match this.
  *   **Awkward Thing:** You must argue the drunk driver who killed no one should be punished as severely as the killer, and feel just as guilty.

  **Leaf H: The Pragmatic Splitter**
  *   **Path:** Outcome Does Not Matter → Deliberation Does Not Matter → Different Punishment/Guilt.
  *   **Commitment:** Internal fault is equal, but external treatment should differ for safety or emotional reasons.
  *   **Awkward Thing:** You are saying the law should treat them differently even though their fault is the same. This separates justice from blame.

  **Leaf I: The Objectivist**
  *   **Path:** Outcome Does Not Matter → Deliberation Does Not Matter → Evidence Doesn't Matter.
  *   **Commitment:** Facts about the world determine fault, not facts about your mind.
  *   **Awkward Thing:** You must blame the person who was genuinely misled by an expert as much as the one who knew the truth.

  **Leaf J: The Subjectivist**
  *   **Path:** Outcome Does Not Matter → Deliberation Does Not Matter → Evidence Matters.
  *   **Commitment:** Fault is entirely about what the agent believed at the time.
  *   **Awkward Thing:** You cannot blame someone for a disaster they caused if they were confidently mistaken.

