prompt: |-
  My lab has started reporting self-consistency numbers on evals: sample the model k times at temperature 0.8, take the most common answer, report that. One guy on the team insists this is literally an instance of the Condorcet jury theorem — each sample is a voter with competence p > 1/2, the votes are independent, so majority accuracy goes to 1 as k grows, and we can pick k the way youd size a jury. He also wants to weight samples by the models own confidence score, on the grounds that better voters should count more; that bit i think is importing something the theorem doesnt say, since the version i know is equal-weight majority over voters with the same p.

  Can you audit the analogy? Give me the correspondence table — what plays the role of the voter, of p, of independence, of the binary proposition, of the truth — and then the places the mapping breaks. The ones i care about: our votes come out of one model with shared weights and shared pretraining, so they have a common cause (is that like a jury with a shared bias, and how much correlation does the theorem tolerate before the result stops holding?); the theorem is binary but our majority is over an open answer space, or over 4–5 options when its multiple choice (does the guarantee weaken as options multiply, and in what way?); and p is a property of voters, whereas what we vary is the *question* — on the hard items wed actually bother running this on, per-sample accuracy could be under half, and then majority makes things worse. In practice our gains flatten out around k = 5, which seems to tell against the asymptotic story.

  Then: does the conclusion he wants — its not a hack, its asymptotically justified, we can buy accuracy with compute — survive, or was the analogy carrying it? And if theres a better thing to compare k samples to than k jurors, say what. Please separate whats just the mathematics under stated assumptions from whats genuinely contested among people who work on this.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** The user's lab is using "self-consistency" (sample $k$ times at $T=0.8$, take majority vote) for model evaluations.
      *   **The Claim:** A team member claims this is an instance of the Condorcet Jury Theorem (CJT).
      *   **The Team Member's Extension:** He wants to weight samples by the model's confidence (weighted voting).
      *   **The User's Skepticism:**
          *   CJT assumes equal weights.
          *   Samples come from one model (shared weights/pretraining) $\rightarrow$ correlation/common cause.
          *   CJT is binary; tasks are often open-ended or multi-choice ($>2$ options).
          *   $p$ (competence) varies by question; on hard questions, $p < 0.5$, making majority vote harmful.
          *   Empirical gains flatten at $k=5$, contradicting asymptotic claims.
      *   **The Task:**
          1.  Audit the analogy (Correspondence Table).
          2.  Identify where the mapping breaks (Correlation, Multi-class, Variable $p$).
          3.  Evaluate the conclusion (Is it justified? Is it a hack?).
          4.  Suggest a better analogy if applicable.
          5.  Distinguish between mathematical facts under assumptions vs. contested empirical claims.

  2.  **Analyze the Condorcet Jury Theorem (CJT):**

      *   **Core Assumptions:**
          1.  Binary choice (True/False, A/B).
          2.  $n$ voters.
          3.  Independence (conditional on the truth).
          4.  Competence $p > 0.5$ for all voters (homogeneous) or average $\bar{p} > 0.5$ (heterogeneous).
          5.  Sincere voting (voting for what they believe is true).
      *   **Core Result:** As $n \to \infty$, probability of correct majority vote $\to 1$.
      *   **Weighted Voting:** There *are* extensions of CJT for weighted voters (Nitzan & Paroush, 1982), where optimal weights are log-odds of competence ($\log(p/(1-p))$). So the team member isn't entirely wrong there, *if* confidence correlates with $p$.

  3.  **Audit the Analogy (Correspondence Table):**

      *   *Voter* $\leftrightarrow$ Single Sample (Generation).
      *   *Vote* $\leftrightarrow$ The generated answer.
      *   *Competence ($p$)* $\leftrightarrow$ Probability a single sample is correct.
      *   *Truth* $\leftrightarrow$ Ground Truth label.
      *   *Independence* $\leftrightarrow$ Stochastic sampling independence (conditional on prompt/model).
      *   *Decision Rule* $\leftrightarrow$ Majority Vote (Self-Consistency).

  4.  **Analyze the Breakdowns (The "User's Care" points):**

      *   **Correlation (Shared Weights):** CJT requires *conditional independence*. In LLMs, samples are i.i.d. *given the model weights and prompt*. However, if the model is systematically wrong (bias), the errors are correlated. CJT tolerates *some* correlation, but strong common-cause correlation breaks the asymptotic convergence. If the model doesn't know the fact, no amount of sampling will find it (unless sampling explores reasoning paths, which is the actual mechanism of self-consistency, not just voting).
      *   **Binary vs. Multi-class/Open:** CJT is strictly binary. For $M$ options, the threshold for $p$ changes. You need $p > 1/M$ for random guessing, but to guarantee convergence to truth via majority, you generally need the correct option to be more likely than any *specific* wrong option, and often $p > 0.5$ is still the safe bound for simple majority. If the distribution is flat over wrong answers, majority helps. If wrong answers cluster, majority hurts.
      *   **Variable $p$ (Hard Questions):** This is the killer. CJT assumes $p > 0.5$. If the model is confused ($p < 0.5$), majority vote converges to the *wrong* answer. In evals, we care most about the hard questions where $p$ might dip below 0.5.
      *   **Weighted Voting:** The team member wants to weight by confidence. Mathematically, weighted CJT exists. *However*, LLM confidence (logprobs) is often poorly calibrated. If confidence $\not\propto$ accuracy, weighting hurts.

  5.  **Evaluate the Conclusion ("It's asymptotically justified"):**

      *   The asymptotic justification ($k \to \infty \implies \text{accuracy} \to 1$) is **false** for LLMs because of the correlation/systematic error issue. You hit a ceiling determined by the model's knowledge, not the sampling.
      *   The "buy accuracy with compute" claim is partially true but diminishing returns hit hard (as observed at $k=5$).
      *   It's not a "hack," it's a variance reduction technique (Ensemble method), but calling it CJT is misleading because the independence assumption is the weak link.

  6.  **Find a Better Analogy:**

      *   **Bootstrap Aggregating (Bagging):** This is the ML standard. You sample from the distribution (bootstrap), train/evaluate, and aggregate.
      *   **Monte Carlo Integration:** You are estimating the expectation of the model's output distribution.
      *   **Ensemble Methods:** Specifically, *Randomized Ensembles*.
      *   *Best Fit:* **Monte Carlo Estimation of the Mode.** You are trying to find the mode of the conditional distribution $P(\text{answer} | \text{prompt})$. CJT assumes the mode is the truth. Self-consistency assumes the mode is the truth.

  7.  **Structure the Response:**

      *   **Executive Summary:** Direct answer on whether the analogy holds (No, not strictly) and whether the conclusion survives (Partially, but for different reasons).
      *   **Correspondence Table:** Clear mapping.
      *   **The Breakdowns (The Audit):**
          *   Independence (Correlated Errors).
          *   Competence ($p < 0.5$ on hard items).
          *   Cardinality (Binary vs. Multi-class).
          *   Weighting (Calibration issues).
      *   **Math vs. Contention:** Separate theorems from empirical LLM behavior.
      *   **Better Analogy:** Bagging / Monte Carlo.
      *   **Verdict on the Team Member:** Be diplomatic but firm.

  8.  **Refine the Content (Self-Correction/Nuance):**

      *   *Correction on Weighted CJT:* I need to acknowledge that weighted CJT *does* exist (Nitzan & Paroush). The user thinks CJT doesn't cover it. I should correct the user gently: "You're right that classic CJT is equal weight, but extensions exist. However, they require calibrated weights."
      *   *Correlation:* Distinguish between sampling independence (which holds) and error independence (which fails). This is the crux.
      *   *Self-Consistency Mechanism:* Why does self-consistency actually work? It's usually because reasoning paths vary. If the reasoning is correct, the answer is consistent. If reasoning is flawed, it scatters. This is slightly different from "voters knowing the truth." It's more like "sampling reasoning chains."
      *   *Flattening at $k=5$:* This suggests the variance of the estimator is low, or the correlation is high. It contradicts the "asymptotic" claim of CJT which implies significant gains for large $N$ if $p$ is only slightly above 0.5.

  9.  **Drafting the Response (incorporating the above):**

      *   *Tone:* Professional, analytical, rigorous.
      *   *Formatting:* Use tables, bold text, and clear sections.
      *   *Key Insight:* The "Voter" isn't an independent agent; it's a noisy measurement of a biased instrument.

  10. **Final Review against constraints:**
      *   Did I answer the specific breakdown points? (Correlation, Binary vs Multi, Variable $p$).
      *   Did I address the weighting?
      *   Did I separate math from contention?
      *   Did I offer a better analogy?

      *(Self-Correction during drafting)*: Make sure to emphasize that Self-Consistency (Wang et al., 2023) was originally proposed for CoT reasoning, where the *path* varies. If the lab is just sampling final answers without CoT, the diversity is lower, making the CJT analogy even weaker. I should mention this distinction.

      *(Refining the "Weighted" point)*: The user says "the version i know is equal-weight". I should confirm that yes, classic CJT is equal weight, but the *principle* of weighting by competence is sound in social choice theory, just not necessarily applicable here due to calibration.

      *(Refining the "Asymptotic" point)*: The claim "accuracy goes to 1 as k grows" is the specific CJT claim. For LLMs, accuracy goes to $P(\text{mode is correct})$, which is $< 1$. This is a critical distinction.

      *(Final Polish)*: Ensure the distinction between *aleatoric* uncertainty (sampling) and *epistemic* uncertainty (model knowledge) is clear, as this explains the correlation breakdown.

      Let's assemble the response.
answer: |-
  Here is an audit of the Condorcet Jury Theorem (CJT) analogy as applied to LLM self-consistency, separating the mathematical formalism from the empirical reality of transformer architectures.

  ### 1. The Correspondence Table

  | Condorcet Jury Theorem | LLM Self-Consistency (Team Member's View) | Reality Check |
  | :--- | :--- | :--- |
  | **Voter** | A single sampled completion ($k=1 \dots N$) | A draw from $P_\theta(\text{answer} \mid \text{prompt})$. |
  | **Competence ($p$)** | Prob. a single sample is correct. | Varies per question; often unknown. |
  | **Independence** | Voters decide independently. | **Conditional independence only.** Errors are correlated by $\theta$. |
  | **Binary Proposition** | True / False (or A / B). | Often open-ended or $M$-choice ($M > 2$). |
  | **Truth** | Objective ground state. | Ground truth label (assumed perfect). |
  | **Aggregation** | Simple Majority Vote. | Mode of sampled answers. |
  | **Asymptote** | Accuracy $\to 1$ as $N \to \infty$. | Accuracy $\to$ Ceiling (Model Knowledge) as $N \to \infty$. |

  ---

  ### 2. Where the Mapping Breaks

  Your skepticism is well-founded. The team member is relying on the *asymptotic guarantee* of CJT, but the *assumptions required for that guarantee* are violated in three critical ways.

  #### A. The Independence Assumption (Common Cause)
  *   **CJT Requirement:** Voters must be conditionally independent given the truth. If Voter 1 is wrong because of a shared misconception, Voter 2 is likely wrong for the same reason.
  *   **LLM Reality:** Your "voters" share weights, pretraining data, and architecture. They are not independent agents; they are repeated measurements from the **same biased instrument**.
  *   **The Break:** CJT tolerates *some* correlation, but the convergence rate degrades rapidly as correlation increases. In LLMs, if the model lacks the knowledge (epistemic uncertainty), the error is systematic, not stochastic. No amount of sampling ($k \to \infty$) will recover a fact the model never learned.
  *   **Result:** The accuracy curve flattens (as you observed at $k=5$) because you have exhausted the *aleatoric* uncertainty (sampling variance) and hit the wall of *epistemic* uncertainty (model bias). CJT predicts continued growth; LLMs show diminishing returns.

  #### B. The Competence Threshold ($p > 0.5$)
  *   **CJT Requirement:** For the majority vote to converge to truth, the average competence must be $p > 0.5$ (for binary). If $p < 0.5$, the majority vote converges to the **wrong** answer with probability 1 as $N \to \infty$.
  *   **LLM Reality:** On the hard eval items you care about, per-sample accuracy is often $< 50\%$.
  *   **The Break:** If the model is "more likely to be wrong than right" on a specific hard question, self-consistency actively harms you. It crystallizes the error. CJT offers no protection here; it explicitly warns against it.
  *   **Nuance:** Self-consistency often works on hard questions not because $p > 0.5$ for the *answer*, but because correct *reasoning paths* are more self-consistent than hallucinated ones. This is a mechanism CJT does not model.

  #### C. Binary vs. Multi-Class
  *   **CJT Requirement:** Strictly binary choices.
  *   **LLM Reality:** Multiple choice (4–5 options) or open generation.
  *   **The Break:** In a 4-option multiple choice, random guessing yields $p=0.25$. CJT extensions for multi-class exist, but the threshold for convergence is higher. You need the correct answer to be the *plurality*, not just the majority. If errors cluster around a specific distractor (a common failure mode in LLMs), the "wrong" cluster can outvote the "right" singleton even if the model is somewhat competent.

  #### D. Weighted Voting (The Confidence Score)
  *   **Your Objection:** You noted classic CJT is equal-weight.
  *   **Correction:** Weighted CJT *does* exist (Nitzan & Paroush, 1982). The optimal weight for voter $i$ is proportional to $\log(\frac{p_i}{1-p_i})$.
  *   **The Break:** This requires weights to be **calibrated** to competence. LLM logprobs/confidence scores are notoriously poorly calibrated. They often correlate with fluency or token frequency, not truth. Weighting by confidence often amplifies confident hallucinations. Unless you calibrate the confidence scores (e.g., via temperature scaling or isotonic regression on a holdout set), weighting is mathematically unjustified.

  ---

  ### 3. Math vs. Contention

  Here is the separation between what is theorem and what is empirical debate.

  **The Mathematics (Settled):**
  1.  **CJT Holds:** If voters are independent, binary, and $p > 0.5$, majority accuracy $\to 1$ as $N \to \infty$.
  2.  **Weighted CJT Holds:** If weights match log-odds of competence, weighted voting outperforms simple majority.
  3.  **Correlation Kills:** If errors are perfectly correlated, $N$ samples provide no more information than 1 sample.

  **The Contention (Empirical LLM Behavior):**
  1.  **Are samples independent enough?** *Contested.* Some argue sampling at high temperature creates sufficient divergence in reasoning paths to approximate independence. Others (likely you) argue the shared weights dominate, making errors highly correlated. Your flattening curve at $k=5$ supports the latter.
  2.  **Is $p > 0.5$ on hard items?** *Contested.* If self-consistency improves scores on hard benchmarks, it implies the *consistency* of the correct answer is higher than the consistency of any specific wrong answer, even if raw accuracy is low. This is a different mechanism than CJT.
  3.  **Does confidence correlate with accuracy?** *Generally No.* Most literature suggests raw confidence is a poor proxy for $p$ without post-hoc calibration.

  ---

  ### 4. Better Analogies

  The CJT analogy is dangerous because it implies an asymptotic guarantee ($\text{accuracy} \to 1$) that does not exist for a fixed model. Two better analogies:

  **1. Bootstrap Aggregating (Bagging)**
  *   **Why:** In ML, we train multiple models on bootstrapped data to reduce variance. Self-consistency is "inference-time bagging."
  *   **Implication:** Bagging reduces *variance*, not *bias*. If your model is biased (wrong knowledge), averaging doesn't fix it. This matches your observation that gains flatten. It sets the correct expectation: you are stabilizing the output, not magically finding truth.

  **2. Monte Carlo Estimation of the Mode**
  *   **Why:** You are sampling from a distribution $P(Y|X)$ to estimate $\text{argmax}_Y P(Y|X)$.
  *   **Implication:** The goal is to find the mode of the model's belief distribution. This decouples the process from "Truth." The mode might be wrong. This accurately reflects that you are measuring *consistency*, not necessarily *correctness*.

  ---

  ### 5. Verdict on the Team Member's Conclusion

  **Claim:** *"It's not a hack, it's asymptotically justified, we can buy accuracy with compute."*

  **Audit:**
  *   **"Not a hack":** True. It is a standard variance-reduction technique (Ensembling).
  *   **"Asymptotically justified":** **False.** The CJT asymptote ($\to 100\%$) does not apply due to correlated errors and systematic bias. The curve converges to the model's knowledge ceiling, not perfection.
  *   **"Buy accuracy with compute":** **True, but with diminishing returns.** You can buy *stability* and minor accuracy gains up to the point where sampling variance is eliminated (your $k=5$). Beyond that, compute is wasted.

  **Recommendation:**
  Tell him to drop the Condorcet analogy. It invites scrutiny on independence assumptions you cannot meet. Instead, frame it as **Ensemble Inference** or **Monte Carlo Mode Estimation**.
  *   **On Weighting:** Allow weighting *only if* you validate that confidence correlates with accuracy on a dev set. Otherwise, it's noise amplification.
  *   **On $k$:** Use the flattening curve to set $k$ economically (e.g., where marginal gain < cost), rather than appealing to asymptotic theory.

  **Summary:** The math of CJT is sound, but the physics of LLMs violate its axioms. The procedure works, but not for the reasons he thinks.
