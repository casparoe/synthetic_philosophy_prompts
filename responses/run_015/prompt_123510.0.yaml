  2.  **Drafting the Desiderata (The Framework):**
      *   *Goal:* What makes a theory of artifact identity *good*? It needs to match our intuitions in clear cases, solve paradoxes in edge cases, and respect important distinctions.
      *   *Case Classifications:*
          1.  *The Mycelium Greenhouse:* Intuition says it's likely the *same* greenhouse (functional/institutional continuity), despite total material change.
          2.  *Ship of Theseus (Stored Planks):* Intuition is split. The sailing ship feels like the original, but the reassembled planks feel like the "real" material original. A good theory must explain why one wins or acknowledge the ambiguity without contradiction.
          3.  *The Swapped Car:* Intuition says it's the same car (VIN/registration continuity), even if every nut is bolted out and replaced.
      *   *Puzzles to Dissolve:*
          1.  *Two-Objects Problem:* If material constitutes object A, and form constitutes object B, and they diverge, do we have two objects? A theory shouldn't multiply entities unnecessarily but must account for the divergence.
          2.  *Boundary Problem (Sorites):* At what exact swap does identity cease? A theory should avoid arbitrary cut-offs.
          3.  *Restoration vs. Replacement:* Replacing a broken pane with identical glass is restoration. Replacing a working pane with alien material is modification. The theory must distinguish these based on intent/causality, not just physics.
      *   *Conceptual Distinctions:*
          1.  *Material vs. Formal/Institutional:* Must allow that identity can ride on form/function even if matter changes.
          2.  *Part Provenance vs. Structure Provenance:* The history of the *stuff* vs. the history of the *arrangement*.
      *   *The "Jointly Unsatisfiable" Constraint:* This is the trickiest part. I need to find two desiderata that pull in opposite directions under "ordinary metaphysical commitments" (usually implying a 3D endurantist view with strict identity conditions).
          *   *Candidate:* "Identity is transitive" vs. "Identity tolerates gradual total material replacement." If $A = B$ (swap 1), $B = C$ (swap 2)... $Y = Z$ (total swap). But $A$ (original matter) and $Z$ (new matter) seem distinct.
          *   *Better Candidate for this prompt:* "Preserve strict numerical identity" vs. "Accommodate radical material discontinuity." Ordinary metaphysics says $x = y$ only if they share essential properties. If matter is essential, radical replacement breaks identity. If matter isn't essential, we risk the "Two-Objects" problem (the reassembled original planks).
          *   *Selection:* I will flag **(1) The Preservation of Strict Numerical Identity** (transitivity, one-to-one mapping) and **(2) The Accommodation of Radical Material Discontinuity** (allowing the Greenhouse to remain identical despite 100% matter replacement). Under ordinary 3D endurantism, if matter is constitutive, total replacement creates a new object. If matter isn't constitutive, the stored planks (Ship case) create a rival claimant, violating uniqueness.

  3.  **Evaluating the Theories:**
      *   *Mereological Essentialism:* Objects are the sum of their parts. Change a part, change the object.
