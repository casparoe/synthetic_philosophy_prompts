      *   *Four-Dimensionalism (Perdurance):* Objects are spacetime worms. Temporal parts exist.
          *   *Score:* Solves the Boundary Problem (no sharp cut-off, just different temporal segments). Handles the Two-Objects problem by allowing divergent worms.
          *   *Undermining Failure:* Violates the intuition of "Strict Numerical Identity" (the object *today* is not strictly identical to the object *yesterday*, only related by counterpart relations or stage theory). It dissolves the problem by denying endurant identity.
      *   *Conventionalism/Social-Constructivism:* Identity is determined by human practices/names.
