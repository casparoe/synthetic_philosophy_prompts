      *   *Self-Correction on the "Jointly Unsatisfiable" point:* I need to make sure this is clear. The tension is between *Uniqueness* (only one successor) and *Continuity* (both the replaced ship and the reassembled ship have strong claims). If we satisfy Uniqueness, we must arbitrarily choose one. If we satisfy Continuity (both are valid), we violate Uniqueness. Let's frame it as **The Uniqueness Constraint** vs. **The Symmetry of Continuity Claims**.

