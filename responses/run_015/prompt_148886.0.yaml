  # JOINT STATEMENT ON FUNCTION ATTRIBUTION IN BIOLOGY
  **Prepared for the Graduate Seminar in Philosophy of Biology**
  **By [Selected-Effects Proponent] and [Causal-Role Proponent]**

  ## I. AGREED CLAIMS

  We, the undersigned, acknowledge that while our theoretical accounts of biological function diverge, we share a common commitment to the legitimacy and utility of functional discourse in the life sciences. We endorse the following claims as a baseline for our continued dialogue:

  1.  **The Effect/Function Distinction:** Not every causal consequence of a trait constitutes its function. There is a principled distinction between a trait's *function* (e.g., the heart pumping blood) and its mere *effects* or by-products (e.g., the heart producing audible thumps). Any adequate account must provide criteria for making this distinction.
  2.  **Explanatory Autonomy:** Function attributions perform explanatory work in molecular biology, physiology, and evolutionary biology. While these domains are connected, functional explanations in physiology are not always reducible to evolutionary explanations, nor vice versa. An adequate account should not render functional discourse in one domain parasitic on the other in a way that makes it unusable for practitioners.
  3.  **The Reality of Malfunction:** Biological traits can malfunction. A heart can fail to pump, and an enzyme can fail to catalyze. An adequate account of function must accommodate a non-arbitrary notion of dysfunction or error without relying on circular definitions (e.g., defining dysfunction merely as the absence of function).
  4.  **Systemic Context:** Function attributions are sensitive to the boundaries of the system under investigation. What counts as a functional contribution may vary depending on whether the relevant system is defined as a cell, an organism, or a population. However, this variability is not unlimited; there are constraints on which system boundaries are biologically legitimate.
  5.  **Normativity:** Function attributions carry a normative dimension. To say a trait has a function is to imply there is a way the trait *ought* to perform, distinct from how it *does* perform in a specific instance. Both accounts must explain the source of this normativity.

  ## II. MAP OF RESIDUAL DISAGREEMENT

  While we agree on the phenomena that require explanation, we disagree on the truth conditions for function statements. The following table outlines our divergent commitments, the specific cruxes involved, and the bearing cases we agree will test our respective positions.

  **Notation:** In the "Position" columns, **[Core]** indicates a commitment the theory must accept to remain coherent. **[Typical]** indicates a commitment common to the tradition but potentially modifiable without collapsing the theory.

  | Crux | Selected-Effects (SE) Position | Causal-Role (CR) Position | Bearing Case | SE Prediction | CR Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. History vs. Capacity** | **Function requires history.** A trait's function is determined by the effects for which it was historically selected. **[Core]** | **Function requires capacity.** A trait's function is determined by its current causal contribution to a containing system's capacity. **[Core]** | **The Spontaneous Duplicate:** An organism molecule-for-molecule identical to a human arises spontaneously (no ancestry). | The duplicate's heart has **no function**. It may pump blood, but it was not selected for doing so. **[Core]** | The duplicate's heart **has a function**. It contributes to the circulation capacity of the system. **[Core]** |
  | **2. Relativization** | **Selection fixes relevance.** The "right" effect is fixed by evolutionary history, independent of the observer's interests. **[Core]** | **Explanation fixes relevance.** The "right" capacity is fixed by the explanatory project of the investigator. **[Typical]** | **The Heart's Noise:** Explaining why the heart makes thumping sounds vs. why it circulates blood. | The thumping is **never** the function, regardless of explanatory interest, because it was not selected for. **[Core]** | The thumping **can be** a function if the explanatory project concerns acoustic signaling or auscultation. **[Typical]** |
  | **3. Malfunction** | **Failure to meet history.** Malfunction is the failure to perform the effect for which the trait was selected. **[Core]** | **Failure to meet capacity.** Malfunction is the failure to contribute to the system capacity specified in the analysis. **[Core]** | **Diseased Organ:** A heart that fibrillates and fails to pump. | This is **dysfunction** because it fails the historical standard, even if the organism survives. **[Core]** | This is **dysfunction** only relative to the capacity of "circulation." If the capacity is "vibrating," it functions. Risk of circularity in choosing capacity. **[Typical]** |
  | **4. Unit of History** | **Lineage determines unit.** The relevant history is tied to the replicator or lineage that underwent selection. **[Typical]** | **System boundary determines unit.** The relevant system is defined by the functional analysis required. **[Core]** | **Somatic Mutation:** A mutation increases cell-lineage replacement rate but degrades tissue barrier function. | **Conflict of functions.** Function for the cell lineage (selected to divide); dysfunction for the organism (selected for barrier). **[Typical]** | **Depends on analysis.** If analyzing the tissue system, it is dysfunction. If analyzing the cell clone, it is function. **[Core]** |
  | **5. Novelty & Co-option** | **History lags.** A new effect is not a function until it becomes the target of selection. **[Core]** | **Immediacy.** A new effect is a function immediately if it contributes to system capacity. **[Core]** | **Rewired Gene:** A gene product produced Effect F for 100M years (selected for F). Recently rewired to produce Effect G (retained for G). | **Function changed.** Old function (F) is lost; new function (G) exists only if/when G is selected for. **[Core]** | **Function changed immediately.** As soon as wiring changed to contribute to G, G became the function. **[Core]** |
  | **6. Artificial Systems** | **No natural history, no function.** Artificially created biological entities lack the evolutionary history required for proper function. **[Core]** | **Causal organization suffices.** If the causal organization mimics living systems, functions exist. **[Typical]** | **Synthetic Cell:** Lab-built cell, reversed molecular handedness, no ancestry, no ecology, metabolizes/divides indefinitely. | **No functions.** It has effects and causal roles, but no proper functions because no selection history exists. **[Core]** | **Has functions.** It has metabolic and division functions because it sustains the system's capacity to persist. **[Core]** |
  | **7. Incipient Traits** | **No function yet.** A trait that confers advantage upon first appearance (before selection acts) has no function yet. **[Typical]** | **Function exists.** If it contributes to capacity immediately, it has a function immediately. **[Typical]** | **First Feather:** A proto-feather appears on a dinosaur, provides warmth, but has not yet been selected. | **No function.** It is a beneficial accident until selection acts. **[Typical]** | **Has function.** It contributes to thermal regulation capacity immediately. **[Typical]** |

  ## III. CONDITIONS FOR REVISION

  We acknowledge that our positions are not dogmatic. We agree that the following empirical or conceptual findings would compel us to revise our views:

  *   **For the SE Proponent:** If it can be demonstrated that biologists routinely and successfully ascribe functions to traits in contexts where evolutionary history is *in principle* inaccessible (not just unknown), and where these ascriptions guide successful intervention, the requirement for history must be relaxed.
  *   **For the CR Proponent:** If it can be demonstrated that the "choice" of system capacity is not pragmatic but constrained by facts about the organism independent of the investigator's interests, the relativization of function must be restricted. Furthermore, if CR cannot distinguish dysfunction from mere variation without smuggling in historical premises, the account requires modification.

  ***

  # COMMENTARY FOR THE INSTRUCTOR (NOT FOR PUBLICATION)

  **Subject:** Assessment of the Dispute and Collaborative Potential

  You asked for an assessment of which parts of this dispute are substantive versus verbal, whether the accounts are competing or complementary, and what could change the participants' minds. Based on the drafting process above, here is my analysis:

  **1. Substantive vs. Verbal**
  A significant portion of the dispute is **verbal**, centering on the definition of the word "function." The SE theorist uses "function" to mean "teleological purpose grounded in history," while the CR theorist uses "function" to mean "causal contribution to a system." However, the dispute becomes **substantive** when we ask: *Which notion is biologically privileged?*
  *   If biology requires a notion of function that grounds *normativity* (error/malfunction) without reference to an observer's interests, the SE account has the advantage, but only at the cost of excluding novel or artificial systems.
  *   If biology requires a notion of function that supports *mechanistic explanation* in physiology where history is irrelevant, the CR account has the advantage, but risks making "dysfunction" arbitrary.
  The substantive core is whether biological normativity is mind-independent (SE) or interest-relative (CR).

  **2. Competing vs. Complementary**
  They are best read as **analyses of two notions that biology deploys for different purposes**.
  *   **Evolutionary Biology** relies on the SE notion. When an evolutionary biologist asks, "What is the function of this trait?", they are asking about its selective history.
  *   **Physiology and Molecular Biology** rely on the CR notion. When a physiologist asks, "What is the function of the spleen?", they are asking about its current causal contribution to the organism's survival, regardless of whether that contribution was the original target of selection.
  The friction arises when one side claims their notion is the *only* legitimate one. A pluralistic approach, where "function" is context-sensitive, resolves most conflicts without forcing either party to abandon their core insights.

  **3. Conditions for Changing Minds**
  Both parties have agreed in Section III to conditions for revision, but I judge the **Synthetic Cell** case (Case 6 in the table) to be the most potent falsifier for the SE view, and the **Malfunction** case (Case 3) to be the most potent falsifier for the CR view.
  *   **SE Vulnerability:** If synthetic biology advances to create complex, self-sustaining systems that everyone intuitively treats as having functions (e.g., "this valve is malfunctioning"), the SE insistence on natural selection history will look increasingly like an obstacle to scientific practice rather than a clarification of it.
  *   **CR Vulnerability:** If the CR theorist cannot explain why a cancerous cell's rapid division is a *dysfunction* for the organism without implicitly referencing the organism's evolved design (a historical notion), then the CR account collapses into SE when normativity is required.

  **Recommendation for the Seminar:**
  Use the **Somatic Mutation** case (Case 4) to drive the discussion. It forces the SE theorist to confront multi-level selection (whose history counts?) and forces the CR theorist to confront system boundaries (whose capacity counts?). It is the point where the "Unit of History" and "Relativization" cruxes collide, revealing whether a synthesis is possible.
