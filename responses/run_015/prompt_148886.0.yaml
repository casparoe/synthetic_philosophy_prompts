      *   *Issue:* The Rewired Gene. This tests the "historical continuity" vs. "current mechanism" distinction.

  8.  **Final Review against Prompt:**
      *   Numbered agreed claims? Yes.
      *   Table of residual disagreement? Yes.
      *   Specific cruxes covered (History, Relativising, Malfunction, Unit of History)? Yes.
      *   Specific cases included (Standard + 3 New)? Yes.
