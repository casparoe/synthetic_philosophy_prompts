      *   The user wants to stress-test this using *quantum coherence*. This is crucial because standard panpsychism usually assumes classical individuation of particles. Quantum coherence blurs the line between "part" and "whole."
      *   If a BEC acts as a single quantum object, does it act like a "brain" made of "neurons" (atoms), or does it act like a *single* fundamental entity?
