answer: |-
  The tension you have identified lies at the heart of contemporary philosophy of history: how to acknowledge the material power of the non-human world without surrendering the distinctiveness of human historical time. The consensus position in this field is relatively clear regarding the dangers of hard environmental determinism. It is broadly accepted that if environmental factors are treated as sufficient causes of historical outcomes, they undermine the possibility of normative assessment. If a society collapses solely because of a drought, moral judgments regarding leadership, resource distribution, or conflict become incoherent. Human choice is rendered illusory. However, beyond this baseline agreement, there is active and unresolved dispute regarding how to model the interaction between exogenous shocks and endogenous social structures. Your two frameworks, "causal protagonism" and "conditional asymmetry," represent competing attempts to navigate this space. Neither commands consensus, and each carries distinct explanatory benefits and philosophical risks.

  ### Causal Protagonism and the Risk of the Reactive Substrate

  Causal protagonism attempts to solve the problem of erasure. In traditional historiography, non-human events often appear merely as scenery—the stage upon which human drama unfolds. By attributing "negative agency" to events like the Tambora eruption, this framework insists that the material world can interrupt human intentionality. The explanatory contribution here is significant: it accounts for the *onset* of historical rupture. It explains why a specific timeline was disrupted at a specific moment, independent of human will. Without this framework, it is difficult to explain the synchronicity of crises across disparate regions that share no political or economic connection but share a climate system.

  However, the peril of environmental determinism looms large here. For causal protagonism to avoid treating human societies as purely reactive substrates, it must maintain a strict distinction between *initiation* and *determination*. The framework succeeds only if it argues that the volcanic winter *forced a choice* rather than *forcing an outcome*. If the eruption makes a specific political collapse inevitable, the framework has collapsed into determinism. The concept of "negative agency" is philosophically contested precisely because agency is traditionally tied to intent. Proponents argue that intent is not required for causal power; critics argue that calling it "agency" anthropomorphizes physical processes and obscures the human reception of those processes.

  To avoid the "reactive substrate" trap, causal protagonism must demonstrate that the non-human event expands the range of human possibilities rather than narrowing them to a single path. For example, the Tambora eruption did not dictate the specific form of the "Year Without a Summer"; it merely removed the option of agricultural normalcy. The human response—whether migration, innovation, or riot—remains a site of genuine choice. If the framework can hold this line, it grants genuine explanatory weight to the volcano without stripping humans of their status as historical agents. However, if the explanatory chain suggests that the institutional responses were the *only* possible responses, the framework overreaches. It risks presenting history as a sequence of stimuli and responses, where the stimulus is non-human and the response is mechanical.

  ### Conditional Asymmetry and the Risk of the Epiphenomenon

  Conditional asymmetry offers a robust defense against determinism by centering the analysis on human vulnerability. Its primary explanatory contribution is accounting for *variance*. It explains why the same climatic anomaly might precipitate a revolution in one state and cause negligible disruption in another. By focusing on "institutional mediation," this framework preserves normative accountability. It allows historians to argue that a famine was not caused by the lack of rain, but by the failure of storage practices or trade networks. This aligns well with the consensus view that historical explanation must remain open to moral and political critique.

  However, this framework faces the opposite peril: it risks reducing environmental ruptures to epiphenomena of prior human arrangements. If the historical significance of Tambora is entirely dependent on pre-existing agrarian structures, then the eruption itself loses its status as a historical event and becomes merely a test of prior conditions. This creates a problem of "historical surprise." If every outcome is prefigured by institutional fragility, then the actual occurrence of the shock adds no new explanatory information; it merely reveals what was already latent. This creates a form of *structural determinism* that is just as limiting as environmental determinism. It implies that history is a closed loop of human conditions reacting to themselves, with the external world serving only as a mirror.

  Furthermore, conditional asymmetry struggles to account for thresholds. There are levels of volcanic activity or viral virulence where no amount of institutional mediation would prevent collapse. If the framework insists that the outcome is always a function of fragility, it may fail to acknowledge absolute material limits. In trying to avoid environmental determinism, it risks sliding into an idealism where the material world has no independent causal bite. The "category error" argument—that attributing agency to a virus is a mistake—protects human distinctiveness but may purchase that protection at the cost of material reality.

  ### Comparative Assessment: The Contested Boundary

  The dispute between these frameworks is not merely semantic; it concerns the ontology of historical events.

  **On Avoiding Determinism:**
  Conditional asymmetry is safer regarding the consensus prohibition on determinism. By making human structures the primary variable, it ensures that human choice and organization remain the focal point of explanation. Causal protagonism is riskier. It requires a more nuanced metaphysics to argue that a cause can be potent without being deterministic. It must walk the line between "influence" and "command."

  **On Explanatory Power:**
  Causal protagonism has the advantage in explaining *temporal discontinuity*. It captures the shock of the new, the moment when history deviates from its path due to external intrusion. Conditional asymmetry excels at explaining *structural continuity* and *differential outcomes*, but it struggles to explain why the break happened *now* rather than *then*, absent the external trigger.

  **On the Status of the Non-Human:**
  This is the most actively disputed element. Causal protagonism grants the non-human a form of ontological standing in history, suggesting that history is a hybrid of human and non-human processes. Conditional asymmetry maintains a humanist boundary, suggesting that history is strictly the realm of human meaning-making, and anything outside that is merely "nature" until it is metabolized by society.

  ### Synthesis of Limitations

  Neither framework fully resolves the tension without overreach.

  Causal protagonism overreaches when it implies that the "negative agency" of a germ or volcano creates a historical trajectory that humans merely inhabit. If the explanatory chain is too tight, it renders human resistance or adaptation as illusory. It succeeds only when it treats the non-human event as a *disruption of context* rather than a *determiner of content*.

  Conditional asymmetry overreaches when it implies that the severity of a shock is infinitely malleable based on social preparation. It risks ignoring the brute force of physics and biology. It succeeds when it treats the environmental event as a *stress test* of social capacity, but fails if it treats the event as having no independent magnitude.

  ### Conclusion

  In the active dispute between these positions, the consensus remains only that hard determinism is unacceptable for normative reasons. Beyond that, the choice between frameworks depends on the specific historical question. If the inquiry concerns why a specific crisis occurred at a specific moment, causal protagonism provides necessary leverage, provided it does not conflate causation with compulsion. If the inquiry concerns why societies survive or fail under stress, conditional asymmetry is superior, provided it does not render the stress itself irrelevant.

  The philosophical challenge you are navigating is whether these two frameworks can be integrated or if they represent mutually exclusive historiographical commitments. A synthesis would require acknowledging that non-human forces possess *causal power* (supporting protagonism) but that this power is only historically *significant* through human mediation (supporting asymmetry). However, maintaining this balance requires constant vigilance. Leaning too far toward protagonism dissolves human responsibility; leaning too far toward asymmetry dissolves the reality of the world outside the human mind. The productive tension lies in keeping both claims in view without allowing either to colonize the entire explanation.
