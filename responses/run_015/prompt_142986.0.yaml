  Actually, the strongest move against (5) is that a partition where the Big Bang is high entropy and entropy decreases would *not* yield the macroscopic regularities we see (stars forming, eggs breaking). It would yield a world where stars un-form and eggs un-break. If the shadow partition is empirically indistinguishable, it must yield the *same* macroscopic predictions. But if it yields the same predictions, it must agree on the thermodynamic gradient *for the variables that constitute the predictions*. If it disagrees on the gradient, it disagrees on the predictions (e.g., heat flow). So (5) contains a contradiction: it claims the gradient points the other way *and* nothing observable distinguishes them. Heat flow is observable.
