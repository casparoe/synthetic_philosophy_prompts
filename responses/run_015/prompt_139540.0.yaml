prompt: |-
  Hi — I'm the lead on a four-person data team at a regional hospital network. We run the merge layer that stitches patient charts together from four source systems (two legacy EHRs, a lab system, and a hand-entered intake tool) into the single chart clinicians actually read. We can't change the source systems; we only decide what the merged chart says and what gets shown.

  Our problem is contradictions. Maybe forty a day survive automated matching: a penicillin allergy in the old system and no known allergies in the new one; a medication that's active and discontinued as of the same date; two dates of birth; a consent flag that's yes in one place and no in another; a patient discharged from one service and admitted to another on the same day. Our rulebook right now is basically: take the more recent entry, unless the older one came from a clinician, in which case escalate — plus a hand-written per-field safety rule for about thirty fields (for allergies we keep the more alarming value, for everything else we take the newest). It's forty pages long and nobody trusts it. On top of that, compliance won't let us destroy anything: every conflicting value has to stay auditable, so "resolve it by dropping the loser" isn't available as a data operation, only as a display decision.

  I've been reading about paraconsistent logic and dialetheism and it feels like it's about exactly this — a logic where a contradiction doesn't let you derive everything, and the further claim that some contradictions are actually true — but I can't turn any of it into something my team can run. So: write me a decision procedure we can actually use.

  What I need:

  - The questions to ask in order, and what counts as a sufficient answer to each. We've got maybe three to five minutes per flag and the team are data stewards, not logicians, so it has to be a one-page thing for the ops wiki plus a laminated card.
  - Where the procedure stops with a no and refuses to auto-merge, and where it hands off to a human because the question is one of values rather than facts — our risk tolerance for a missed allergy is not the same as for a false one, and somebody has to own that choice explicitly rather than have it buried in a per-field rule.
  - A blast radius rule. When a field is in quarantine, which downstream values have to carry a marker saying they were computed from something contested, and when can we drop the marker? This is the bit I most expect you to get wrong or fudge, and it's the bit the forty-page rulebook is really about.
  - It has to work for someone who thinks a contradiction is always a sign of an error somewhere. Our compliance officer thinks the whole idea of accepting both values is mad, and I need something that doesn't depend on settling that. So: don't assume any contradiction is really true, but do say plainly whether there's a case where the dialetheist-sounding thing — both entries correct under two different rulebooks — actually shows up, and if it does, whether it should change what we do differently from the plain "we don't know which" case.
  - Two distinctions I think must survive the simplification: the one between an apparent contradiction that dissolves once you fix the time-slice, the granularity or the sense of the predicate (including the case where the two values are really contraries that could both be false rather than contradictories), and a real one; and the one between "we don't know which side is right" and "both sides are right." Tell me which distinctions you're deliberately throwing away, and why.
  - Where it's honest about being a judgment call dressed up as a procedure.

  Then run it on three real-shaped cases: (1) penicillin allergy documented in a 2011 intake note as a childhood rash, a 2019 allergy clinic test saying there's no penicillin allergy, and no known allergies entered by a resident in 2023; (2) an anticoagulant that's active in the medication list with a refill yesterday but discontinued because of bleeding in a discharge summary three days ago, with no reconciliation note; (3) a consent field where the patient signed a treatment consent and separately declined research use of their data, and the intake tool has a single yes/no box that got filled in twice with different values. I have a feeling your procedure is going to tell me to do something on the second one that my team will absolutely hate — say it anyway, and say what it costs.

  Finally: give me four or five one-line test cases I can use to check whether a new hire has actually understood the procedure, and tell me what the procedure can't do — the failures I should expect in six months that won't look like failures at first.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **User:** Lead of a 4-person data team at a regional hospital network.
      *   **Task:** Manage the merge layer of patient charts from 4 source systems (2 legacy EHRs, lab, intake).
      *   **Problem:** Contradictions (approx. 40/day survive automation). Examples: allergies, meds, DOB, consent, admission/discharge.
      *   **Constraints:**
          *   Cannot change source systems.
          *   Compliance: Cannot destroy data (audit trail required). Resolution is a *display* decision, not a data deletion.
          *   Current Rulebook: 40 pages, distrusted, complex ("newest unless clinician," plus 30 field-specific safety rules).
          *   Time Budget: 3-5 minutes per flag per data steward.
          *   Audience: Data stewards (not logicians), Compliance Officer (skeptic of "true contradictions").
          *   Philosophical Angle: User is interested in paraconsistent logic/dialetheism but needs a *practical* procedure, not a philosophy lecture.
      *   **Requirements:**
          *   Ordered questions (One-pager + Laminated Card).
          *   Stop conditions (Auto-merge vs. Human Escalation).
          *   Blast Radius Rule (Quarantine markers downstream).
          *   Address the "Contradiction = Error" mindset vs. "True Contradiction" possibility.
          *   Preserve specific distinctions (Time-slice/Granularity vs. Real Contradiction; "Don't Know" vs. "Both Right").
          *   Honesty about judgment calls.
          *   Run on 3 specific cases.
          *   Test cases for new hires.
          *   Failure modes (6-month horizon).

  2.  **Deconstruct the Philosophical/Logical Aspect:**
      *   *Paraconsistent Logic:* Allows $A$ and $\neg A$ without explosion ($A \land \neg A \to B$). In data terms: Display both or flag conflict without crashing the system.
      *   *Dialetheism:* Some contradictions are *true*. In healthcare: Is it ever true that a patient is both allergic and not allergic? Technically, no (biological state is singular), but *contextually* yes (allergic in 2011, desensitized in 2019). Or (Allergic to Penicillin G, not allergic to Amoxicillin, but mapped to same code).
      *   *Practical Translation:* We don't need to prove dialetheism is metaphysically true. We need to treat conflicting data as *co-existing valid claims* until proven otherwise, without forcing a binary choice that deletes evidence.
      *   *Key Distinction:* "Epistemic Uncertainty" (We don't know which is right) vs. "Contextual Validity" (Both are right in their specific context/time/sense).

  3.  **Drafting the Decision Procedure (The "Merge Triage Protocol"):**
      *   *Goal:* Reduce 40 pages to 1 page.
      *   *Structure:* Funnel approach. Filter out easy fixes first, escalate hard ones.
      *   *Step 1: Contextual Dissolution.* Can we explain the difference by time, scope, or definition? (e.g., Active vs. Historical, Penicillin vs. Amoxicillin).
      *   *Step 2: Safety Criticality.* Is this high risk (Allergy/Meds) or low risk (Address/Phone)?
      *   *Step 3: Source Authority.* Who said it? (Clinician note vs. Admin intake).
      *   *Step 4: Resolution Strategy.* Display logic (Show both, Show newest with warning, Show most severe).
      *   *Step 5: Blast Radius.* Tagging downstream.

  4.  **Refining the "Blast Radius" (Quarantine):**
      *   This is the hardest technical part. If an allergy is contested, does that contaminate the "Problem List"? The "Discharge Summary"?
      *   *Rule:* Any derived field that *relied* on the contested value to determine its own state must carry a "Contested Source" flag.
      *   *Dropping the marker:* Only when a human explicitly resolves the conflict *and* documents the rationale, or when a newer, higher-authority source supersedes *both* without contradiction.

  5.  **Addressing the Compliance Officer (The "Error" Mindset):**
      *   Don't sell "true contradictions." Sell "Unresolved Evidence."
      *   Dialetheism in practice = "Both records are accurate reflections of the information available at the time of entry."
      *   The procedure must treat "Both Right" (Contextual) the same as "Don't Know" (Epistemic) regarding *safety* (show warning), but differently regarding *archiving* (keep both vs. mark one obsolete).

  6.  **Developing the 3 Cases:**
      *   *Case 1 (Allergy):* 2011 (Yes), 2019 (No), 2023 (No).
          *   *Analysis:* Time-slice dissolution. 2011 was true then. 2019 test overrides. 2023 confirms.
          *   *Action:* Mark 2011 as "Historical/Resolved." Display "No Known Allergy" but link to 2011 note.
      *   *Case 2 (Meds):* Active (Refill yesterday) vs. Discontinued (Bleeding, 3 days ago).
          *   *Analysis:* Real contradiction. Safety Critical.
          *   *Action:* **STOP.** Do not auto-merge. Escalate to clinician. Display *both* with RED FLAG. "Active" status suspended until resolved.
          *   *Cost:* Care delay, annoyance. Better than bleeding.
      *   *Case 3 (Consent):* Treatment (Yes) + Research (No) vs. Intake Tool (Yes/No box filled twice).
          *   *Analysis:* Granularity error. The intake tool collapsed two fields into one.
          *   *Action:* Split the intake value. Map Treatment=Yes, Research=No. Mark Intake Source as "Ambiguous Mapping."

  7.  **Drafting Test Cases & Failure Modes:**
      *   *Test Cases:* Need to check if they understand time-slicing, safety escalation, and granularity.
      *   *Failure Modes:* Alert fatigue, "Shadow IT" (clinicians bypassing the system), marker creep (everything gets flagged).

  8.  **Review against Constraints:**
      *   *One-pager?* Needs to be tight.
      *   *3-5 mins?* Steps must be binary/quick.
      *   *Compliance?* Audit trail preserved.
      *   *Dialetheism?* Acknowledged as "Contextual Validity."
      *   *Honesty?* Admit where judgment is needed.

  9.  **Refining the Output (Self-Correction during drafting):**
      *   *Correction:* Initially, I might suggest "Show Both" for everything. But for allergies, showing "No Allergy" prominently while hiding "Penicillin" in a footnote is dangerous. The display hierarchy matters.
      *   *Correction on Blast Radius:* Don't flag *everything*. Only fields where the contradiction changes the *clinical action*. (e.g., Contested Allergy -> Flag Problem List. Contested Phone Number -> Do not flag Problem List).
      *   *Correction on Dialetheism:* Be careful not to tell the Compliance Officer "Contradictions are true." Tell them "Records are accurate snapshots of conflicting information."

  10. **Final Polish:** Ensure tone is professional, direct, and empathetic to the operational burden. (Proceed to generate response).

  *(Self-Correction during final review of the prompt requirements)*:
  *   "Where the procedure stops with a no and refuses to auto-merge." -> Need a clear "Escalation Gate."
  *   "Where it's honest about being a judgment call." -> Need a "Steward Discretion" clause.
  *   "Tell me which distinctions you're deliberately throwing away." -> Need a section on Trade-offs.
  *   "Say what it costs" for Case 2. -> Explicitly state the operational cost.

  Let's build the "Merge Triage Protocol."

  *Structure:*
  1.  **The Protocol (Laminated Card)**: The actionable steps.
  2.  **The Blast Radius Rule**: Technical implementation.
  3.  **The Philosophy (for Compliance)**: How to explain it.
  4.  **Trade-offs**: What we are ignoring.
  5.  **Case Studies**: Applying the protocol.
  6.  **Test Cases**: Hiring/Training.
  7.  **Failure Modes**: Future proofing.

  *Drafting the Protocol Steps:*
  1.  **Dissolve?** (Time, Scope, Definition).
  2.  **Risk?** (Safety Critical vs. Admin).
  3.  **Authority?** (Clinician vs. Admin).
  4.  **Resolve?** (Display Logic).
  5.  **Tag?** (Blast Radius).

  *Drafting the Blast Radius:*
  If Field X is contested, Field Y is tagged if Field Y's value *depends* on Field X's specific value (not just existence).

  *Drafting the "True Contradiction" handling:*
  We treat "Both Right" (Contextual) as "Dissolved." We treat "Don't Know" as "Contested." The action is the same (Flag), the archive is different (Keep both active vs. Deprecate one).

  *Let's write it.*
answer: |-
  # The Merge Triage Protocol (MTP)

  **Purpose:** Resolve data contradictions safely without deleting audit trails.
  **Time Budget:** 3–5 minutes per flag.
  **Authority:** Data Steward (you) owns the *display*; Clinician owns the *truth*.

  ## Part 1: The Decision Card (Laminated)

  **Step 1: Can the contradiction dissolve?**
  *Ask:* Do the values differ by time, scope, or definition?
  *   **Time:** Is one historical and one current? (e.g., Allergy in 2011, Negative Test in 2023).
      *   *Action:* Mark older as "Historical." Display newer as "Current." **Stop.**
  *   **Scope:** Do the codes mean different things? (e.g., "Penicillin" vs. "Amoxicillin" mapped to same ID).
      *   *Action:* Recode to specific values. **Stop.**
  *   **Definition:** Is one "Patient Reported" and one "Clinician Verified"?
      *   *Action:* Label sources distinctly. **Stop.**
  *   *If NO (Real Contradiction):* **Go to Step 2.**

  **Step 2: Is this Safety Critical?**
  *Ask:* Could acting on the wrong value cause physical harm or legal breach *today*?
  *   **Yes:** (Allergies, Active Meds, Code Status, Consent for Treatment).
      *   *Action:* **QUARANTINE.** Do not auto-merge. Display **BOTH** values with a "CONFLICT" warning banner. Escalate to ordering clinician. **Stop.**
  *   **No:** (Address, Phone, Next of Kin, Research Consent).
      *   *Action:* **Go to Step 3.**

  **Step 3: Who is the Authority?**
  *Ask:* Which source has higher epistemic authority for *this* field?
  *   **Clinician > Admin:** (Diagnosis, Meds). Take Clinician entry.
  *   **System > Human:** (DOB from Registration vs. DOB from Note). Take Registration.
  *   **Newer > Older:** (If authority is equal). Take Newer.
  *   *Action:* Display "Winner." Archive "Loser" as "Superseded." **Go to Step 4.**

  **Step 4: Blast Radius Tagging**
  *Ask:* Does any downstream field rely on the specific value of the contested field?
  *   **Yes:** (e.g., "Allergy Status" relies on "Allergy Entry"; "Billing Code" relies on "Diagnosis").
      *   *Action:* Attach `SOURCE_CONTESTED` flag to the downstream field.
  *   **No:** (e.g., "Patient Name" does not rely on "Phone Number").
      *   *Action:* No flag needed.
  *   *Drop Marker:* Only when a clinician explicitly reconciles the conflict in the EHR, generating a new "Resolution Note" ID.

  ---

  ## Part 2: The Blast Radius Rule (Technical Spec)

  **The Rule:** A downstream field $Y$ carries the `SOURCE_CONTESTED` marker if and only if the logic determining $Y$'s *current display state* would change if the contested field $X$ were removed.

  1.  **Direct Dependency:** If $Y$ is a summary of $X$ (e.g., "Active Allergy List" sums individual allergy records), $Y$ is tagged.
  2.  **Logic Dependency:** If $Y$ is a decision based on $X$ (e.g., "Eligible for Trial" = False if "Allergy = Penicillin"), $Y$ is tagged.
  3.  **No Contagion:** If $Y$ is independent (e.g., "Discharge Date" is not dependent on "Home Phone"), $Y$ is clean.
  4.  **Clearing the Marker:** The marker persists across merges. It is only cleared when a **Resolution Event** occurs (a human signs a reconciliation note). You cannot clear it by age alone.

  ---

  ## Part 3: Handling "True Contradictions" (For Compliance)

  **The Compliance Question:** "Are you telling me both values are true?"
  **The Answer:** "No. We are recording that two valid records exist."

  *   **Epistemic Uncertainty ("We don't know"):** We treat this as **Step 2 (Safety Critical)**. We show both because we cannot verify truth.
  *   **Contextual Validity ("Both are right"):** This is **Step 1 (Dissolve)**. Example: Patient *was* allergic (2011 record is true) and *is not* allergic (2023 record is true).
  *   **The Dialetheist Edge Case:** Rarely, a patient may be on a medication (Active) and told to stop it (Discontinued) simultaneously due to a handoff error. Both orders exist legally.
      *   *Procedure:* Treat as **Safety Critical**. Display both. Force human resolution.
      *   *Why:* Whether the contradiction is "true" (both orders valid) or "error" (one is wrong), the clinical risk is identical. The procedure does not change, only the post-mortem analysis does.

  ---

  ## Part 4: Trade-Offs (What We Are Ignoring)

  1.  **Probability vs. Binary:** We are not calculating "80% likely this is right." We are binary: Dissolved, Escalated, or Superseded. *Why:* Stewards cannot assess clinical probability in 3 minutes.
  2.  **Source Provenance Depth:** We do not trace *why* the source system was wrong (e.g., buggy interface). We only trace *that* it conflicts. *Why:* Out of scope for data team.
  3.  **User Preference:** We do not ask clinicians "Which do you prefer?" before flagging. We flag first. *Why:* Prevents silent errors.

  ---

  ## Part 5: Running the Cases

  ### Case 1: The Penicillin Allergy
  *   **Data:** 2011 Intake (Yes, Rash), 2019 Clinic (No, Test), 2023 Resident (No, Unknown).
  *   **Step 1 (Dissolve):** **YES.** Time-slice dissolution. 2011 was true *then*. 2019/2023 are true *now*.
  *   **Action:** Mark 2011 record as `HISTORICAL_RESOLVED`. Display 2023 "No Known Allergy" as primary.
  *   **Blast Radius:** "Allergy Status" field is clean (no marker), but the "Allergy History" report must show the 2011 entry greyed out.
  *   **Compliance Note:** No data deleted. 2011 record preserved as historical context.

  ### Case 2: The Anticoagulant (The Hard One)
  *   **Data:** Active (Refill Yesterday) vs. Discontinued (Bleeding, 3 days ago).
  *   **Step 1 (Dissolve):** **NO.** Same drug, overlapping dates, conflicting status.
  *   **Step 2 (Safety):** **YES.** High risk of bleeding or clotting.
  *   **Action:** **QUARANTINE.**
      *   **Display:** Show **BOTH**. Banner: "MEDICATION STATUS CONFLICT."
      *   **System State:** Do not allow auto-refill. Do not allow CPOE to assume "Active."
      *   **Escalation:** Page the attending physician immediately.
  *   **Blast Radius:** Tag "Active Medication List," "Discharge Instructions," and "Drug Interaction Checker" with `SOURCE_CONTESTED`.
  *   **The Cost:** Your team will hate this because it creates "Alert Fatigue" and stops workflow.
      *   *Say it anyway:* This will delay discharge for 4–12 hours while a doctor clarifies. It will generate angry tickets to IT.
      *   *Justification:* The cost of a hemorrhage is higher than the cost of an angry ticket. If you auto-merge this, you own the bleed.

  ### Case 3: The Consent Box
  *   **Data:** Signed Treatment (Yes) + Signed Research (No) vs. Intake Tool (Yes/No box filled twice).
  *   **Step 1 (Dissolve):** **YES.** Granularity/Mapping error. The Intake Tool collapsed two legal fields into one UI element.
  *   **Action:** Split the Intake value. Map Treatment = Yes, Research = No.
  *   **Tagging:** Mark the Intake Source field as `AMBIGUOUS_MAPPING`.
  *   **Blast Radius:** Tag "Research Eligibility" field. Do not tag "Treatment Authorization" (since the signed form overrides the intake tool).
  *   **Resolution:** This is a data mapping fix, not a clinical escalation. Fix the ETL logic for future intakes.

  ---

  ## Part 6: Hiring Test Cases (One-Liners)

  1.  *"Two addresses exist: one from 2018 billing, one from 2023 intake. Which do we show, and does the 2018 address get a conflict flag?"* (Answer: Show 2023. No flag, Step 1 Time Dissolution).
  2.  *"A patient has a 'Do Not Resuscitate' order from 2020 and a 'Full Code' order from yesterday. The 2020 order was never formally revoked. What do you do?"* (Answer: Quarantine/Escalate. Step 2 Safety Critical. Do not assume yesterday wins).
  3.  *"Lab A says Blood Type O+, Lab B says O-. Both are CLIA-certified. Is this a Step 1 or Step 2?"* (Answer: Step 2. Biological impossibility = Safety Critical. Show both, flag for transfusion service).
  4.  *"The 'Smoker' field is 'Yes' in 2022 and 'No' in 2023. Does the 'Cancer Risk Score' downstream get a contest marker?"* (Answer: Yes. Step 4. The score logic depends on the specific value).
  5.  *"Compliance asks you to delete the 2018 address to 'clean the record.' What do you say?"* (Answer: No. Audit trail requirement. Mark as Superseded, do not delete).

  ---

  ## Part 7: Failure Modes (The 6-Month Horizon)

  1.  **The "Grey Wall" Effect:** Clinicians get so many `SOURCE_CONTESTED` flags they learn to ignore them.
      *   *Mitigation:* Audit the flags monthly. If >10% of charts have flags, your Step 1 Dissolution rules are too strict.
  2.  **Shadow Reconciliation:** Doctors start calling each other to resolve conflicts rather than documenting it in the EHR. The data stays contested forever.
      *   *Mitigation:* Require a "Reconciliation Note" code to clear the Blast Radius marker.
  3.  **Marker Creep:** The `SOURCE_CONTESTED` flag propagates to fields that don't actually depend on the data (over-tagging).
      *   *Mitigation:* Review the dependency map quarterly.
  4.  **The "Safe" Merge:** Stewards get tired of escalating (Case 2) and start forcing Step 3 (Authority) on Safety Critical items to clear their queue.
      *   *Mitigation:* Random audit of 5% of "Superseded" Safety Critical fields.
  5.  **Compliance Drift:** New compliance officers demand the "Conflict" banner be removed because it "looks unprofessional."
      *   *Mitigation:* Keep the Risk Assessment log from Case 2. Show them the liability math.

  ---

  ## A Note on Judgment (For the Lead)

  This procedure is not a logic machine; it is a **liability distribution system**.
  *   **Step 1** distributes liability to *Time*.
  *   **Step 2** distributes liability to the *Clinician*.
  *   **Step 3** distributes liability to *Policy*.
  *   **Step 4** distributes liability to *Transparency*.

  When your team asks, "But which one *is* true?" the answer is: "That is not a data question. That is a medical question. Our job is to make sure the person answering that question sees the doubt."

  If you follow this, you will not prevent all errors. But you will ensure that when an error happens, the audit trail proves your team did not hide the contradiction.
