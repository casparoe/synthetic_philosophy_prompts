answer: |-
  Please, spare me the accusation that I'm merely polishing Bratman's apple with new terminology. That is precisely the kind of internalist myopia that keeps this field stagnating. You say "extra jargon"; I say you are refusing to look outside the skull.

  Your subway example is not a counterexample; it is the proof of concept. You claim it is "parallel reasoning"—two isolated minds computing the same solution to a spatial problem. But watch the phenomenon closely, not through the lens of what they must be thinking, but what they are *doing*. If I step left and you hesitate, I adjust. If you shift your weight, I hold my ground. We are not running independent algorithms; we are coupled in a single feedback loop of bodily negotiation. That is mutual practical entanglement.

  Bratman would demand to know if I intended *that we* make room. He wants a mental handshake before the physical movement begins. But there was no handshake. There was no "we-intention" in the head—save me from Searle on this, please, as if positing a primitive 'we' in the brain explains how my foot knows to stop inches from your shin without a conference committee meeting in the prefrontal cortex.

  The distinction lies in the fragility and the structure of the dependence. In parallel reasoning, if you vanished, I would still move. In this entanglement, if you vanished, my movement would look entirely different—perhaps I wouldn't move at all, or I would stumble. My action is functionally dependent on yours in real-time, not just causally linked by a shared stimulus.

  You complain I cannot distinguish this from "real joint action" without redefining terms. I reject your "real." You are obsessed with the painting-a-house examples because they are clean, contractual, and boring. They let you pretend that joint action is just individual action plus agreement. But life is messy. The subway shift is a plural subject, however fleeting. It is a 'we' constituted by the friction of our shoes on the platform, not the contents of our minds. If your ontology cannot accommodate a plural subject that exists only for ten seconds without a spoken word, then your ontology is too small, not my theory too empty.
