answer: |-
  There is no single canonical term in the social science or rationalist lexicons that captures this exact configuration. You have identified a specific intersection of **normative stability**, **functional drift**, and **justificatory stagnation**.

  The closest existing concepts are **Ritualization** (ethology/sociology), **Decoupling** (institutional theory), and **Exaptation** (evolutionary biology), but each fails to capture the *epistemic sincerity* of the defenders regarding the old justification.

  If you want to carve this out, the most precise label is **Normative Fossilization** (the state) driven by **Justificatory Decoupling** (the mechanism).

  Here is the precise carving of the concept, including its edges and the mechanism that sustains it.

  ### 1. The Core Definition
  **Normative Fossilization** occurs when:
  1.  **Behavioral Equilibrium Shifts:** A norm's actual usage drifts to solve a *new* coordination problem (Function B) distinct from the original problem (Function A).
  2.  **Justificatory Lock-in:** The explicit rationale, enforcement language, and community lore remain anchored to Function A.
  3.  **Sincere Attribution:** Enforcers and defenders genuinely believe Function A is the primary driver, despite evidence that Function B is the actual operational utility.

  ### 2. The Edges (Differentiation)
  You asked how to distinguish this from adjacent phenomena. Here are the boundary conditions:

  *   **Vs. Concept Creep:**
      *   *Concept Creep:* The definition expands (e.g., "trauma" covers more events), but the *underlying value* (protecting mental health) remains consistent.
      *   *Normative Fossil:* The *underlying value/problem* swaps (e.g., from "accuracy" to "politeness"), but the label and stated justification remain fixed on the original value.
  *   **Vs. Functional Exaptation (New Convention):**
      *   *Exaptation:* A trait is co-opted for a new use, and the community *updates the story* to match (e.g., "We know we don't actually need confidence tags anymore, but we keep the habit for politeness").
      *   *Normative Fossil:* The community *refuses to update the story*. They insist the old problem (wild claims) is still the primary threat, even if data shows it isn't.
  *   **Vs. Hypocrisy / Signaling:**
      *   *Hypocrisy:* Defenders *know* the old justification is false but use it to signal status or exclude outsiders.
      *   *Normative Fossil:* Defenders *believe* the old justification is true. It is a collective epistemic error, not a strategic lie.
  *   **Vs. Ritualization:**
      *   *Ritual:* Often implies the behavior loses *all* functional utility and becomes purely symbolic.
      *   *Normative Fossil:* The behavior retains high functional utility (solving Function B), which is why it persists. It is not a dead ritual; it is a live tool mislabeled.

  ### 3. The Mechanism: Why it Persists
  Your friend mentioned a "breakdown in common knowledge." She is partially right, but it is more specific: it is **Pluralistic Ignorance regarding Justification**.

  *   **First-Order Knowledge:** Everyone knows the norm is used for politeness (Function B).
  *   **Second-Order Knowledge (The Failure):** Everyone believes that *everyone else* believes the norm is primarily for confidence tagging (Function A).
  *   **Result:** No one updates the public justification because they fear signaling that they "don't get it" or are undermining the group's epistemic standards. The justification becomes a **Schelling Fossil**—a focal point that persists not because it describes reality, but because it is the only shared story available.

  This is sustained by **Path Dependence**. The cost of rewriting the community's normative documentation (updating the "story") is higher than the cost of maintaining the mismatch, as long as the norm *still works* for the new problem.

  ### 4. Recommendation on Terminology
  If you need to refer to this in writing or discussion:

  *   **Technical Term:** **Justificatory Decoupling**. (Precise, describes the structural gap between *why we say we do it* and *why we actually do it*).
  *   **Evocative Term:** **Normative Fossil**. (Captures the "anchored to the past" nature while acknowledging the norm is still "present" in the rock).

  **Verdict:** You do not need to coin a wholly new concept from scratch, but you do need to combine existing terms to close the loophole. "Ritualization" misses the utility; "Decoupling" misses the sincerity. **Normative Fossilization** is the precise carve-out you are looking for.
