      *   **Task:** Create a specification (spec) for evaluating "grand narrative of human history" books (like *Sapiens*, *Guns, Germs, and Steel*, *The Dawn of Everything*).
      *   **Goal:** Distinguish between a "good read" (vibes) and a "worthy explanation" (belief for more than a week).
      *   **Constraints:**
          *   No bibliography/citations/reading list.
          *   Mark which points are consensus vs. live fights in the field (archaeology, anthropology, history).
          *   Keep author scoring to a few lines at the end.
          *   Length: Around 1,200 words (implied by the context of the review they commission, though the prompt asks for the *spec* itself, not a review. I should aim for a concise, skimmable format suitable for a commissioning meeting, likely around 1,000-1,500 words to match the density requested).
          *   Tone: Professional, sharp, analytical, "editor-to-editor."
      *   **Input Material:** The user provided a list of "half-formed" criteria (mechanism, falsifiability, scaling, generalizability, category variation, necessity vs. contingency, moral standards, preservation bias, teleology, agency).
      *   **Key Deliverables:**
          1.  Evaluate the user's half-formed criteria (Real vs. Prejudice vs. Negotiable).
          2.  Identify the "jointly unsatisfiable" tensions (trade-offs).
          3.  Identify the single requirement that knocks out the most current books.
          4.  Mark consensus vs. live fights.

  2.  **Evaluate the User's Criteria:**
      *   *Mechanism in a sentence:* Real requirement. Grand narratives need a core engine.
      *   *Falsifiability (what would sink it):* Real requirement. Distinguishes science/history from mythology.
      *   *Two-clocks problem (scaling):* Real requirement. Micro-motives vs. macro-behavior.
      *   *Generalizability (New Guinea/Andes):* Real requirement. Avoids cherry-picking.
      *   *Category variation (Agriculture isn't one thing):* Consensus. Archaeologists hate monolithic labels.
      *   *Necessity vs. Contingency (had to do vs. went):* Live fight. Determinism vs. Agency.
      *   *Moral standards (anachronism):* Negotiable/Prejudice. Depends on the book's aim, but *honesty* about it is required.
      *   *Preservation bias (stone/dry places):* Consensus. Acknowledged limitation.
      *   *Teleology (endpoint as cause):* Real requirement. Major logical fallacy.
      *   *Agency (refusing/exiting):* Live fight. Structuralism vs. Intentionality.

  3.  **Drafting the Spec - Section by Section:**

      *   **Introduction:** Acknowledge the editor's plight. Set the stage.
      *   **The Core Desiderata (The Filter):** Group the user's points into logical categories.
          *   *Causal Integrity:* Mechanism, Teleology, Falsifiability.
          *   *Scale & Scope:* Two-clocks, Generalizability, Category Variation.
          *   *Evidence & Bias:* Preservation, Necessity vs. Contingency.
          *   *Human Element:* Agency, Morality.
      *   **Consensus vs. Live Fights:** Integrate this into the criteria or add a specific section. The prompt asks to "mark, per requirement or in a short section at the end." A section at the end might be cleaner for the "skimmable" requirement, but integrating it ensures the editor knows *while* reading the criteria. Let's try integrating markers like [CONSENSUS] or [DEBATED] for clarity.
      *   **The Tensions (Jointly Unsatisfiable):** This is crucial. You can't have perfect granularity and perfect narrative flow. You can't have moral clarity and historical neutrality.
      *   **The Killer Criterion:** Which one kills the most books? Likely the "Two-clocks" or "Teleology." Let's go with Teleology/Endpoint-as-Cause as it's the most common sin of popular history. Or perhaps the "Mechanism" test. Actually, the "Category Variation" (monolithic labels) is where most pop-history dies scientifically. Let's weigh this. The prompt asks for the *single requirement* that knocks out the most. I'll argue for the "Mechanism that scales" (Two-clocks + Mechanism).
      *   **Author Scoring:** Brief mention as requested.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Word Count Check:* The prompt mentions the *reviews* are 1,200 words. It doesn't strictly limit *this* spec to 1,200, but "in a form I can skim" suggests brevity. I should aim for tight, dense prose.
      *   *Tone Check:* Needs to be authoritative but collaborative. "Here is the tool you asked for."
      *   *Consensus Marking:* I need to be careful not to claim false consensus. Archaeology is famously fractious. I will mark specific points.
      *   *The "Half-formed" Evaluation:* I need to explicitly state which of their ideas are real vs. prejudice. I'll weave this into the criteria analysis.

  5.  **Final Polish:**
      *   Ensure the "Two-clocks" problem is explained clearly.
      *   Make sure the distinction between "Necessity" and "Contingency" is clear.
      *   Check the "Consensus/Live Fight" marking is blunt as requested.
      *   Verify no citations are used.

  6.  **Drafting the Response (Mental Outline):**
      *   **Header:** To: Ideas Editor. From: [AI Assistant]. Re: Grand Narrative Spec.
      *   **Intro:** Validating the fatigue with "Big History" clones.
      *   **Section 1: The Non-Negotiables (The Real Requirements).** Group the user's valid points. Mark consensus status.
      *   **Section 2: The Negotiables (Taste vs. Rigor).** Address the moral/anachronism point.
      *   **Section 3: The Impossible Triangles (Tensions).** Where the books fail structurally.
      *   **Section 4: The Killer Criterion.** The one that matters most.
      *   **Section 5: Field Status.** Summary of Consensus vs. Fight.
      *   **Section 6: Author Note.** Brief.

      *(Self-Correction on Consensus Marking)*: The prompt says "mark, per requirement or in a short section at the end." A short section at the end is probably cleaner for skimming the criteria, but marking per requirement is more useful *during* the meeting. I will mark per requirement using bold tags like **[CONSENSUS]** and **[LIVE FIGHT]**.

      *(Refining the "Killer Criterion")*: The user listed "Two-clocks" as a specific worry. This is often the weakest link. A mechanism that explains 10,000 years usually fails at 10 years. I will select this or the "Teleology" one. Teleology is more common, but Two-clocks is more structural. Let's go with **Falsifiability + Mechanism**. If you can't say what proves you wrong, you're not doing history.

      *(Wait, re-reading prompt)*: "which single requirement knocks out the most of the books currently on my shelf."
      Okay, looking at *Sapiens*, *Guns, Germs, and Steel*, *Dawn of Everything*.
      *Sapiens*: Fails on agency/variation (cognitive revolution is vague).
      *GG&S*: Fails on agency/contingency (deterministic).
      *Dawn*: Fails on scaling (hard to apply the 'freedom' mechanism to the Neolithic transition broadly).
      Actually, the **Category Variation** (monolithic labels) is the biggest scientific sin. Treating "Agriculture" as a single event. This is [CONSENSUS] among archaeologists. I'll choose this as the killer.

      *(Wait, re-reading again)*: "mark... which points are settled among the archaeologists... and which are live fights."
