answer: |-
  **TO:** Ideas Editor
  **FROM:** [Assistant]
  **RE:** Specification for Grand Narrative History

  You are right to be tired. The market is flooded with "Big History" that functions as theology for secular readers: comforting, sweeping, and structurally unsound. Your half-formed list is 80% rigorous requirements and 20% stylistic preference. Below is the distilled spec for commissioning. I have marked each point with its status in the relevant fields (Archaeology, Anthropology, History).

  ### I. The Non-Negotiables (The Filter)

  **1. The Mechanism Test**
  The book must state its causal engine in a single sentence that remains functional when stripped of anecdotes. If the mechanism is "human nature" or "complexity," it fails. It must be specific (e.g., "caloric surplus allows specialization," not "agriculture changed us").
  *   **Status:** **[CONSENSUS]** among historians of science; **[LIVE FIGHT]** among theorists of culture (who argue some phenomena resist reduction).

  **2. The Falsifiability Clause**
  The author must name a specific piece of archaeological or genetic evidence that, if found, would invalidate their thesis. If the theory explains everything, it explains nothing.
  *   **Status:** **[CONSENSUS]** (Scientific method); **[RARELY MET]** in popular history.

  **3. The Two-Clocks Problem**
  The explanatory variable must scale. A mechanism driving change over 10,000 years (macro) cannot contradict how humans act over 10 years (micro). If the book argues people are rational actors in the Industrial Revolution but biological robots in the Neolithic, it breaks.
  *   **Status:** **[LIVE FIGHT]**. Structuralists prioritize the macro; anthropologists prioritize the micro. A good book must acknowledge the tension.

  **4. Category Integrity**
  The book cannot treat "Agriculture," "Civilization," or "Hunter-Gatherer" as monolithic events. The variation *within* early farming communities is often larger than the difference between farming and foraging. If the text treats the "Agricultural Revolution" as a singular switch flipped globally, reject it.
  *   **Status:** **[CONSENSUS]** among archaeologists. This is the most common point of failure in pop-history.

  **5. Teleology Check**
  The narrative cannot use the endpoint (us, now, states, writing) as the cause. We did not farm *to become* civilized. If the story reads as a inevitable march toward the present, it is mythology, not history.
  *   **Status:** **[CONSENSUS]**. Teleological reasoning is universally rejected in academic historiography.

  **6. Preservation Bias Acknowledgement**
  The argument must account for the fact that 90% of human activity left no stone trace. If the theory relies heavily on material remains without addressing the organic/ephemeral record (or lack thereof), it is building on a fragment.
  *   **Status:** **[CONSENSUS]**.

  ### II. The Negotiables (Taste & Aim)

  **7. Moral Verdicts**
  Does the book grade the past by present standards? This is not a hard fail, but the author must be *honest* about doing it. A book can argue slavery was a moral failure of early states, but it cannot claim it was an *inevitable* economic function without evidence.
  *   **Status:** **[LIVE FIGHT]**. Public intellectuals demand moral clarity; academics demand neutrality. Your review should judge consistency, not the verdict itself.

  **8. Agency vs. Structure**
  Does the book allow for people refusing, exiting, or designing institutions? Or are they pushed by grains and germs?
  *   **Status:** **[LIVE FIGHT]**. This is the central theoretical divide (Determinism vs. Voluntarism). A book can take a side, but it cannot ignore the counter-evidence of human resistance.

  ### III. The Impossible Triangles (Tensions)

  No book satisfies all desiderata perfectly. You are looking for authors who manage the trade-offs honestly.

  *   **Compression vs. Hedging:** To tell a 10,000-year story, you must compress. To be accurate, you must hedge. The best books compress the *narrative* but hedge the *causality*. The worst compress the causality to save the narrative.
  *   **Elegance vs. Outliers:** A single mechanism is elegant (Sapiens). A multi-causal web is accurate (Archaeology). If a book chooses elegance, it must explicitly discard the outliers, not hide them.
  *   **Moral Clarity vs. Anachronism:** You can have a moral stance, or you can have historical neutrality. You cannot have both without contradiction.

  ### IV. The Killer Criterion

  If you only check one box, check **Category Integrity (#4)**.

  This is the single requirement that knocks out the most books currently on your shelf. *Sapiens*, *Guns, Germs, and Steel*, and even *The Dawn of Everything* all stumble here. They rely on "The Agricultural Revolution" as a singular, global package. Archaeologists know it was a messy, reversible, region-specific set of experiments spanning millennia. When a book treats "farming" as a uniform technology that arrived and changed psychology/society uniformly, it is selling a caricature. This error cascades: if the input (farming) is fake, the output (inequality/states) is suspect.

  ### V. Field Status Summary

  For your commissioning meeting, here is the blunt breakdown of where the ground is solid and where it is shifting:

  *   **Settled Science:** Preservation bias is real. Teleology is a fallacy. "Agriculture" was not a single event. Falsifiability is required for a claim to be scientific.
  *   **Live Fights:** How much agency did prehistoric people have? (High vs. Low). Is social inequality a byproduct of surplus or a political choice? (Materialist vs. Political). Can we apply modern moral frameworks to deep time? (Universalist vs. Relativist).
  *   **Confidence Limit:** Confidence runs out completely at the "Cognitive Revolution" (70,000 years ago). Any book claiming to know *why* language or religion emerged specifically then is speculating. Treat those chapters as philosophy, not history.

  ### VI. Author Scoring (Brief)

  *   **Harari:** Fails Mechanism and Category Integrity. High entertainment value, low explanatory power.
  *   **Diamond:** Fails Agency and Two-Clocks. Strong on geography, weak on human choice.
  *   **Graeber/Wengrow:** Strong on Agency and Category Integrity, but struggles with Scaling (mechanism works better for politics than demography).

  **Recommendation:** Commission the review that attacks the *Category Integrity* failure. It is the most defensible position scientifically and offers the clearest value to a reader tired of oversimplification.
