      *(Final Plan)*:
      1. Intro.
      2. The Spec (categorized).
      3. The Tensions.
      4. The Killer Criterion.
      5. Field Consensus Summary.
      6. Author Note.

      Let's write.

      *Word Count Management:* Keep it tight. No fluff.

      *Consensus Check:*
      *   Preservation bias: Consensus.
      *   Agriculture variation: Consensus.
      *   Teleology (endpoint as cause): Consensus (it's a fallacy).
      *   Determinism vs Agency: Live Fight.
