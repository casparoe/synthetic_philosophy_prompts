      *   *The Superorganism Hypothesis:* Wheeler's idea. The colony acts as a unit of selection. But does it act as a *unit of experience*?
      *   *Consciousness/Subjectivity:* There is no evidence that a colony has a unified phenomenological field. An ant might feel pain (debatable), but the colony doesn't "feel" the trail being cut in a qualitative sense. It reacts functionally.
