answer: |-
  You have built an empirical epistemology. Your ledger is your ground truth. The philosophical problem you are wrestling with is **logical non-omniscience under calibration constraints**. You want a set of rules that respects your boundedness (you can't check everything) without lying about your error rates (the ledger).

  Your "Searchlight Rule" is close, but it treats all search as equal. Your cases show that you value *diversity* of search and *symmetry* of priors.

  Here is the principle that fits your data, tightened for application.

  ### The Principle: Calibrated Weighted Searchlight

  **Core Axiom:** A probability number is a betting price *given your current computational and epistemic budget*. It is not a claim about the world in isolation, but about the world *plus* your current state of verification.

  **Clause 1: The Ledger Constraint (Calibration)**
  For any claim type $X$ where you have historical data, your stated confidence $P(X)$ must converge to your observed frequency of truth for that class, unless you can articulate a specific *defeater* for the current case that distinguishes it from the historical average.
  *   **Work done by:** Case 6 (Own proof).
  *   **Verdict:** Your gut (0.97) is a feeling; the ledger (0.92) is data. Unless you can prove *why* last night's argument is fundamentally more robust than the average entry in your ledger, 0.92 is the honest number. 0.97 is overconfidence bias.

  **Clause 2: The Diversity of Evidence (Weighted Search)**
  Confidence scales with the number of *independent* modes of verification attempted, not just the volume of one mode. Different modes (heuristic, computational, social, formal) protect against different classes of error.
  *   **Work done by:** Cases 2, 3, 4, 5, 7.
  *   **Verdict:** This resolves your Goldbach vs. Riemann inconsistency. You value the Goldbach computation highly because the heuristic support is weaker; the computation is a distinct "beam" of light. For Riemann, the heuristic support (random matrix theory, etc.) is already so strong that adding zeros is a redundant beam. You are right to value the P vs NP negative evidence (Case 4) because it clears a distinct region of technique-space.
  *   **Refinement on Case 7:** Formalization *does* gain you something. It shifts the error mode from "logical slip" to "formalization mismatch." Since these are independent error sources, checking both increases confidence multiplicatively, provided you trust the formalization layer. Your 0.9999 vs 0.99 intuition is correct, provided you explicitly model the "formalization fidelity" as a separate probability node.

  **Clause 3: The Symmetry Default (Priors)**
  Where search is zero but the space of possibilities is symmetric and lacks structure you can exploit, your credence is the base rate derived from symmetry, regardless of resolvability cost.
  *   **Work done by:** Case 1 (Pi).
  *   **Verdict:** Your friend is wrong. This is a credence because it guides action (betting) *before* you pay the cost to resolve. The Searchlight Rule failed here because it assumes confidence requires *work*. This clause says confidence can come from *ignorance of structure*. If the digits are effectively random to you, 1/10 is the correct price, even if the "searchlight" is off.

  **Clause 4: Bounded Closure (Logical Cost)**
  You are permitted to violate logical closure ($P(A)=1, P(A \to B)=1 \nRightarrow P(B)=1$) *if and only if* the derivation of $B$ from $A$ carries a non-trivial cognitive cost that you have not yet paid. If you assert $P(A \to B)=1$, you are asserting the derivation is already in hand.
  *   **Work done by:** Cases 8, 9.
  *   **Verdict:** This handles the consistency and deduction problems.

  ---

  ### Application to New Cases

  **Case A: A 200-page proof, 12 close readers, no formalization.**
  *   **Principle:** Clause 2 (Diversity) + Clause 1 (Ledger).
  *   **Verdict:** You have social verification (12 readers) but no formal verification. Your ledger likely shows that "refereed but not formalized" has a non-zero error rate (likely higher than 0.001).
  *   **Number:** Do not go above 0.98. The "12 readers" is one mode of verification (social/semantic). Without formalization or independent re-derivation, you are vulnerable to a shared conceptual blind spot (like the 11 errors in your ledger from the shared technique). 0.999 is reserved for claims with *diverse* verification (e.g., social + formal + computational).

  **Case B: A claim at 0.5 today, journal publishes answer tomorrow.**
  *   **Principle:** Clause 3 (Symmetry) + Value of Information.
  *   **Verdict:** 0.5 is the correct *current* credence if you have no information. However, you cannot bet at these odds if the bet resolves *after* tomorrow. If the bet resolves tomorrow, your price should reflect the expected value of the information, not just the current probability.
  *   **Number:** 0.5 for a bet settling *now*. Refuse to bet at 0.5 for a bet settling *tomorrow* (unless you can hedge), because your credence will collapse to 0 or 1 in 24 hours. This distinguishes *uncertainty* from *volatility*.

  ---

  ### The Sacrifices

  You asked which verdicts a decent principle cannot save. Here is the cost of coherence.

  **1. You must drop the 0.97 in Case 6.**
  This is the hardest but most important one. The Ledger is your only objective measure of your own reliability. To claim 0.97 without a specific defeater (e.g., "I used a new method that has never failed" vs "I used the usual method") is to claim you are better than your data says you are. The honest number is the calibrated number. If 0.92 feels like false modesty, that is a bug in your gut, not the ledger.

  **2. You must clarify Case 9 (Deduction).**
  You wrote: *"I'm as confident as I ever get in T, and as confident as I ever get that T implies C, and... my credence in C does not move."*
  *   **The Conflict:** If you are truly at 0.999 on "T implies C," you have already paid the cognitive cost of the derivation. If you have the derivation, $P(C)$ *must* move.
  *   **The Fix:** You don't actually believe $P(T \to C) \approx 1$. You believe $P(\text{There exists a proof}) \approx 1$. There is a gap between "I suspect a proof exists" and "I hold the proof."
  *   **The Sacrifice:** You must admit that in Case 9, your confidence in the implication was overstated. You were confident in the *conjecture* of implication, not the implication itself. If you downgrade $P(T \to C)$ to 0.9 (reflecting the risk the derivation is harder than it looks), then $P(C)$ staying static is coherent. You cannot have high confidence in the premises, high confidence in the link, and low confidence in the conclusion *simultaneously* if the link is verified.

  **3. You must accept Vera's distinction, even if you keep single numbers.**
  Vera separates "Difficulty to Settle" from "Odds." Your Principle handles this via **Clause 4 (Bounded Closure)**.
  *   When you assign a number, you are implicitly tagging it with a "revision cost."
  *   Case 1 (Pi) has low revision cost (5 seconds).
  *   Case 2 (Goldbach) has infinite revision cost.
  *   **The Sacrifice:** You must acknowledge that a 0.99 on Pi is *different in kind* from a 0.99 on Goldbach, even if the betting odds are the same. The Pi 0.99 is fragile (easily updated); the Goldbach 0.99 is sticky (hard to update). If you don't track this, you will mismanage your research time. You don't need two numbers, but you must treat the *stability* of the number as a meta-property.

  ### Summary of the Repair

  Your **Searchlight Rule** was looking for *coverage*. It needs to look for *independent coverage*.
  *   **Case 1:** Saved by Symmetry Default.
  *   **Case 2 & 3:** Saved by Diversity of Evidence (computation counts less when heuristics are strong).
  *   **Case 6:** Sacrificed to the Ledger Constraint.
  *   **Case 9:** Saved by distinguishing "Proof Exists" from "Proof in Hand."

  **Final Directive:**
  Trust the ledger over the gut (Case 6). Trust diversity of proof over volume of verification (Case 2 vs 3). Trust symmetry when search is empty (Case 1). And admit that logical implication is a *process* you pay for, not a free relation you possess (Case 9).
