          5.  Diagnostic of the Colleague's Argument (Dismissal vs. Caution vs. Rhetoric).
      *   *Key Historiographical References:* Carr (What is History?), Weber (objective possibility), Lewis (counterfactuals), Ferguson (Virtual History), Bulhof (inevitability). *Self-Correction:* Keep references focused on the logic, don't get bogged down in bibliography unless it clarifies the logic. Focus on the *logic* of the counterfactual.

