  7.  **Final Polish:** Ensure the distinction between *minimal-rewrite* (Lebow, Ferguson) and *global-rewrite* is clear where relevant. The colleague is attacking minimal-rewrite by implying it inevitably becomes global-rewrite (the unraveling tapestry).

      *(Self-Correction during drafting)*: The user asked for a "menu rather than a single favoured reading." I need to make sure I don't just say "The colleague is wrong." I need to lay out the logical landscape so the student can navigate it.

      *Specific focus on WWI:* The "July Crisis" is the classic testing ground for this. (Mombauer, Clark, etc.). The colleague is essentially arguing against the "contingency" school (e.g., Margaret MacMillan) in favor of structuralism (e.g., Fritz Fischer or Marxist interpretations), though using a philosophical sledgehammer.

      *Wait, one nuance:* The colleague says "there is no fact of the matter." That is explicitly Thesis 6. But he gets there via "the chain has no stopping point" (Thesis 1/2). I need to show how that inference is invalid.

      *Let's structure the verdicts clearly.*
