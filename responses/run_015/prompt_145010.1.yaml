  You're a philosopher of science with a background in agent foundations and a high tolerance for conceptual mess — please think carefully and start with a quick brainstorm of the different ways philosophical debates stall (verbal, hidden empirical, bedrock intuition, different questions under one label, etc.) before you apply that framework to my case.

  I've been in a reading group on embedded agency for months and we're totally stuck on one point, and I want to know if we're even arguing about the same thing. The issue is whether an agent that's literally made of the same physical stuff it's predicting can have a non-circular self-model. One camp — call them the Abstractionists — says yes, you just model yourself at a higher level of abstraction, like a compiler treating its own source code as data, and logical induction plus Löbian obstacles show this can be done consistently. The other camp — the Materialists — says that's dodging the problem: if your transistors are part of the causal system you're reasoning about, then conditioning on "my belief state" physically changes the voltage states that constitute that belief, so standard Bayes nets break in a way no absraction fixes.

  Everyone in the room agrees on the physics, agrees on the formal results, and nobody has moved an inch. So is this actually a disagreement about what counts as an explanation? Are they answering different questions — one about functional architecture, one about metaphysical causation? Or is there a hidden formal question about whether embedded self-reference needs a fixed-point theorem that hasn't been proved yet? Diagnose what kind of stall this is, using what each side actually says, and tell me what would count as progress here — a distinction, a toy model, or maybe just admitting the question is malformed.
