      *   *What is Forbidden:* Saying "You earned this retirement," "Your struggles were paid back by your success," "Look at all these awards, proof of your merit." This treats her life as a balance sheet.
      *   *What is Permitted/Required:* Highlighting moments where she acted without regard for the balance sheet. Giving credit to students (reducing her own ledger). Challenging power (risking her standing). Teaching not as transferring knowledge for credit, but as orienting students toward truth.
      *   *The Explicit Swap:* Instead of "You earned every good thing," say "The good things you received were not payments owed, but opportunities to continue your orientation." Or better: "We cannot say the universe owed you this peace; rather, you have oriented us toward deserving each other."
