  # Dream Mentation Sorting Instrument
  **Seminar Handout v.0.9**

  Stop arguing about labels. Start sorting cases. Use this tree to force your seminar partners into a corner. If they wiggle, ask the diagnostic question attached to the branch.

  **Branch 1: The Existence Check**
  Does any phenomenal content occur during REM sleep at all?
  *   **No** → Go to Leaf A.
  *   **Yes** → Go to Branch 2.
  *   *Diagnostic:* You wake with a vivid 20-minute story — do you think *anything* was happening phenomenally before your eyes opened, or is the "dream" purely a waking fabrication?

  **Branch 2: The Reportability Trap**
  Is the lack of concurrent reportability a knock-down reason to deny it's an experience?
  *   **Yes (Knock-down)** → Go to Leaf B.
  *   **No (Evidential Gap)** → Go to Branch 3.
  *   *Diagnostic:* If someone reports a lucid dream in real-time via pre-arranged eye signals, does that fix the reportability problem or is it still a different kind of access than waking speech?

  **Branch 3: The Timing Split**
  Does the narrative unfold in real-time during REM, or is it constructed/loaded retroactively upon waking?
  *   **Retroactive** → Go to Leaf C.
  *   **Real-Time** → Go to Branch 4.
  *   *Diagnostic:* Is the feeling of duration a total confabulation inserted at the moment of arousal, or did the seconds actually tick by during sleep?

  **Branch 4: The Architecture Check**
  Within the real-time camp, is working memory intact during the event?
  *   **Yes (Intact)** → Go to Leaf D (**UNOCCUPIED**).
  *   **No (Offline)** → Go to Leaf E.
  *   *Diagnostic:* If you dream you're running but your motor cortex is blocked and you won't encode it unless aroused, is that still a full experience or just an "experience-like" fragment?

  ---

  ### The Leaves

  **Leaf A: Hard Denial**
  *   **Position:** Norman Malcolm-style skepticism.
  *   **Awkward Commitment:** You have to tell your seminar partner they never actually saw a dragon, even phenomenally, becuase they were asleep.

  **Leaf B: Verificationist Denial**
  *   **Position:** Content present but unreportable so not experience.
  *   **Awkward Commitment:** A perfect report written down upon waking counts for less than a stuttered waking remark.

  **Leaf C: Retrospective-Construction**
  *   **Position:** Built on arousal (Dennett-style).
  *   **Awkward Commitment:** The feeling of duration is a total confabulation inserted at the moment of arousal.

  **Leaf D: UNOCCUPIED COMBO (Real-Time + Intact WM)**
  *   **Position:** Claims real-time narrative with intact working-memory access during REM.
  *   **Status:** **Incoherent/Unexplored.** Contradicts neurophysiology of REM atonia and memory blockade.
  *   **Awkward Commitment:** Requires ignoring established science on sleep cycles to save the intuition of full cognitive access.

  **Leaf E: Real-Time Phenomenal View**
  *   **Position:** It actually unfolds in REM (despite WM offline).
  *   **Awkward Commitment:** You have qualia without the cognitive architecture usually required to hold them.

  ---

  **Warning:** This tree cannot reliably distinguish **Leaf A (Hard Denial)** from **Leaf B (Verificationist)** empirically, since both predict identical report data. The split is purely philosophical.

  Summary: The deepest split isn't about whether dreams happen, but whether phenomenal experience requires the cognitive architecture to report them.
