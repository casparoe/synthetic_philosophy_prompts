answer: |-
  Applying your two-part test reveals that grounding moral obligation in local conventions creates untenable outcomes where visitors are penalized for unavoidable ignorance, required to suppress generosity, and compelled to prioritize social coordination over safety.

  The legibility criterion makes moral duty contingent on perceptual skill rather than intent. Because the eye-contact queueing system is low-legibility, your principle suggests you have no obligation to follow it until you decipher it. Yet violating this convention causes real frustration and disorder for locals, meaning you are morally exempt from preventing harm simply because the harm mechanism is opaque. This implies that a visitor cannot be blamed for failing to know facts that are inherently difficult to observe, which undermines the idea that conventions carry moral weight independent of their transparency. If morality depends on how quickly you learn the rules, then two visitors acting with identical respect but different observational skills incur different moral liabilities, reducing ethical duty to a matter of epistemic luck.

  Second, the ratchet-sensitivity criterion produces the counterintuitive result that generosity can be immoral. If the tipping convention is ratchet-sensitive, your principle obliges you to tip exactly eight percent, rendering any additional generosity a moral failure because it disrupts local expectations. This suggests that in ratchet-sensitive contexts, you are obliged to do less than you would otherwise freely choose to do, transforming morality from a pursuit of good into a strict exercise in coordination where exceeding the norm is as wrong as falling short. This conclusion clashes with the standard ethical view that supererogatory acts—doing more than required—are praiseworthy rather than prohibited, indicating that ratchet-sensitivity describes social pressure rather than moral duty.

  Third, the high legibility of jaywalking creates a conflict between social obligation and physical safety. Since crossing on red is highly visible, your test dictates a moral obligation to participate, yet this compliance involves breaking the law and accepting physical risk. This highlights a critical flaw in treating conventions as moral obligations: it forces visitors to prioritize social blending over personal safety and legal compliance, suggesting that the test conflates social pressure with ethical duty. If a convention is dangerous, high legibility should not compel compliance; rather, it should signal a hazard to be navigated carefully, implying that safety and law often trump convention regardless of how visible the norm is.

  Ultimately, these implications suggest that everyday conventions are prudential norms rather than moral obligations. While visitors should generally respect local customs to facilitate smooth interaction, your test shows that elevating them to moral imperatives creates contradictions where duty depends on luck, goodness is capped by averages, and safety is secondary to conformity. The most defensible position is that visitors have a general duty of respect, but specific conventions remain tools for coordination that require adaptation rather than rigid moral adherence.
