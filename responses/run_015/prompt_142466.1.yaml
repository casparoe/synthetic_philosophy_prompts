  Hey — I write software, not philosophy, so please be patient with me if I mangle the vocabulary. Also up front: I don't want reading recommendations or citations. I can't get at a journal library from where I'm sitting and I don't want to chase references; I want someone to just reason the thing through with me. Take your time with it. You're a decision theorist / formal epistemologist who has spent a lot of time on coherence arguments specifically, and I'd rather have you carefully unpack the structure than give me a confident verdict in the first paragraph. If it helps, start by listing out, one line each, the seperate claims my colleague is making, and flag which ones are load-bearing, before you pass judgement on any of them.

  The background, since it's why this suddenly matters to me: over the last few months I built a small automated agent that trades on my behalf on a prediction-market-type site. Tiny stakes, low four-figure bankroll, nothing I'd be ruined by. Its decision rule is dead simple and stateless: each time a counterparty offers it a contract, it computes its own probability, takes the contract if the expected value is positive, and refuses if the resulting position would push total exposure over a fixed cap. It re-decides from scratch every time. It has no memory of the sequence of offers, only of its current holdings.

  A colleague who did some graduate work in this area told me, more or less, the following:

  "Look, this is settled. There's a family of theorems — Dutch book arguments and money pump arguments — and what they say is: if an agent's preferences can't be represented as maximizing expected utility, then there is a set of bets, each of which the agent would happily accept on its own, that together guarantee it a loss no matter how the world turns out. That's not a philosophical opinion, it's a mathematical fact, on the level of arithmetic. And the corollary is the part people miss: expected utility maximization isn't a substantive claim about what's worth caring about, or how much risk to run. It's just a consistency requirement. A non-EU-maximizing agent doesn't have unusual values, it's incoherent, and anyone who notices can drain its bankroll. So if you want your bot not to be exploitable, have it pick whatever has highest expected utility under some fixed probability function and some fixed utility function, and you're done."

  I have a feeling this is maybe 70% right and 30% doing a lot of work, but I can't locate the 30%. Concretely: I think he's sliding between two different arguments there — one where a package of bets you'd all accept at once loses money for sure, and one where you get walked through a sequence of trades you'd each accept and end up back where you started minus some cash — and I suspect the second one needs an assumption about my bot that I may or may not have built in (something about it not anticipating the sequence, or not having preferences over whole plans rather than over individual steps). I'm also suspicious of "it's just consistency, like arithmetic", because I have a memory of people pointing out that you can violate some of the axioms in ways that don't feel like contradictions at all, only like unusual attitudes to risk, and of a distinction between an agent that re-plans at every step and one that commits to a plan up front.

  And here's my own wrinkle, which is the bit I actually care about. I've been thinking of adding a nightly "regret audit": the agent keeps a log, and I score the last 24 hours of accepted contracts as a single package rather than one at a time, and if the package looks bad I tighten the exposure cap. My question is whether that changes anything about whether the argument bites. Does evaluating packages rather than individual contracts make the bot more of an expected-utility maximizer at the level of policies, and is that the level the theorems actually care about? Or is a fixed cap on exposure simply a non-EU rule that I should expect to be exploitable, even though it's the thing keeping me from blowing up?

  One more thing I can't get straight: my counterparties aren't sitting down and designing packages against me, as far as I know — but some of them definately know more than my model does, and it feels like that's a different way of getting drained that has nothing to do with coherence.

  Could you audit his summary for me? Please use these sections, roughly these lengths:

  1. "Bottom line" — about 80 words: is the summary fair, and if not, where exactly.
  2. "The claims, one at a time" — about 400 words: go through the summary and sort it into what a careful decision theorist would simply accept, what they'd wince at as a compression, and what they'd reject, and say why in each case.
  3. "Two arguments or one?" — about 250 words: whether the sure-loss-from-a-single-package argument and the walked-through-a-sequence argument are the same argument, what assumptions each needs, and what the assumptions about my bot's architecture are in each case.
  4. "Is it really only consistency?" — about 250 words: which parts of the expected utility package really do look like bare coherence requirements, and which are substantive, and whether violations of the substantive ones are best described as incoherence.
  5. "What this means for my bot" — about 300 words: my stateless myopic rule versus the package-level regret audit, whether a hard exposure cap or a plan-level evaluation puts me inside or outside the scope of the argument, and whether exploitability is even the right thing for me to be worried about given that the people taking the other side of my trades mostly just know more than my model does.
  6. "What I should be asking instead" — about 100 words: the two or three questions you'd replace mine with.
