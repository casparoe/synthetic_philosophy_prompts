answer: |-
  You have put your finger on a precise and often overlooked epistemic failure. You are correct that the standard "Goodhart's Law" one-liner is too blunt for this. Goodhart's Law typically describes a *behavioral* response: agents change the world (or their behavior in it) to move the number. In your cases, the world (the river) did not change, and the agents (mostly) did not game the system; the *ruler* changed.

  There is no single, famous "Law" name for this specific pattern in the general lexicon, but in the philosophy of measurement and experimental design, it has a rigorous home.

  ### The Established Concept: Threats to Construct Validity

  The formal academic term for what you are describing is a **Threat to Construct Validity**, specifically the sub-category known as **Instrumentation** (or **Operationalization Drift**).

  In the classic taxonomy of Campbell and Stanley (*Experimental and Quasi-Experimental Designs for Research*, 1963), **Instrumentation** is defined as a change in the measuring instrument or procedure over time that creates the appearance of change where none exists.
  *   **Case 1 (The Lab):** This is a pure **Instrumentation Threat**. The "instrument" (including its detection limit) changed. The data is accurate relative to the *new* instrument, but invalid relative to the *longitudinal construct* (river health over time).
  *   **Case 2 (The Committee):** This is a mix of **Instrumentation** (redrawing the class boundaries) and **Selection** (dropping the worst sites from the population).

  However, "Instrumentation Threat" is technical jargon for experimental design. It doesn't quite capture the philosophical weight of the *definition* drifting away from the *reality*. For that, we need to look at **Operationalism**.

  ### A Name for the Pattern: "Operational Drift"

  Since you asked for a name if one doesn't exist, I propose **Operational Drift** (or **Construct-Operational Decoupling**).

  **Definition:** Operational Drift occurs when the *operational definition* of a metric (the specific rule, threshold, or instrument used to generate a number) shifts relative to the *theoretical construct* (the actual phenomenon of interest), while the metric's internal consistency remains intact.

  **Why this fits your criteria:**
  1.  **Distinct from Goodhart:** Goodhart's Law implies the *target* broke the *measure* via human behavior. Operational Drift implies the *definition* broke the *link* via structural change. The number is still "true" (it counts what it says), but it is no longer "valid" (it doesn't mean what we think).
  2.  **Distinct from Will Rogers:** The Will Rogers Phenomenon (stage migration) relies on moving items between groups to manipulate *averages*. Your phenomenon relies on moving the *boundary* or the *population* to manipulate *counts*. Will Rogers is mathematical sleight-of-hand within a fixed system; Operational Drift is a change of the system itself.
  3.  **Distinct from Specification Gaming:** Specification gaming (in AI or optimization) implies an agent finding a loophole to maximize a reward function. Operational Drift can happen with *zero* agency. A new spectrometer has no incentive to lie; it simply has a different sensitivity. The drift is often bureaucratic or technical, not adversarial.

  ### The Role of Intent

  You asked: *Is the version where nobody intends anything... the same phenomenon?*

  **Epistemically: Yes.**
  The break in the link between the Number and the Reality is identical. Whether the detection limit shifted because of a new cathode array (unintentional) or because a regulator wanted to meet a target (intentional), the resulting data tells the same lie about the river. The *inference* is equally invalid.

  **Sociologically: No.**
  In the philosophy of science (e.g., Latour, Woolgar), the *network* of trust matters.
  *   **Unintentional Drift** is a **Validity Error**. It is a mistake in maintaining the calibration between concept and measure. It is solved by better metadata and standardization.
  *   **Intentional Drift** is **Deception** (or "Soft Gaming"). It is a political act disguised as a technical adjustment. It is solved by governance and audit.

  If you need to distinguish them, call the unintentional version **Passive Operational Drift** and the intentional version **Active Operational Drift**. Both are instances of Construct-Operational Decoupling.

  ### The Philosophical Root: The Operationalist Fallacy

  The reason this pattern is so seductive—and so hard to name—is that we are all trained as **Operationalists**.

  Percy Bridgman (1927) argued that a scientific concept is synonymous with the set of operations used to measure it. "Length" *is* what you do with a ruler. In your lab, "Clean Water" effectively became "Count < Detection Limit."

  The pattern you see is the **Operationalist Fallacy** in action: assuming that because the *operation* (the count) is stable/accurate, the *concept* (the water quality) is being tracked. When the operation drifts (new instrument, new rule), the concept is lost, but the operation continues to produce numbers. We mistake the stability of the arithmetic for the stability of the phenomenon.

  ### Summary Definition for Your Use

  If you want to use this in conversation or writing, here is a definition block that distinguishes it from its neighbors:

  > **Operational Drift**
  >
  > **The Pattern:** A metric improves (or worsens) while the underlying reality remains static, caused by a change in the threshold, instrument sensitivity, or population definition used to generate the metric.
  >
  > **Distinction from Goodhart's Law:** Goodhart's Law requires the *target* to distort *behavior*. Operational Drift requires only the *definition* to distort the *link*. No gaming is necessary; the measurement can be perfectly accurate relative to its new definition.
  >
  > **Distinction from Will Rogers Phenomenon:** Will Rogers manipulates *averages* by moving boundary cases between groups. Operational Drift manipulates *threshold counts* by moving the boundary itself or the pool of candidates.
  >
  > **Distinction from Specification Gaming:** Specification Gaming implies an agent exploiting a gap between instruction and intent. Operational Drift often occurs without agency (e.g., instrument replacement, bureaucratic standardization).
  >
  > **Intent:** The epistemic failure is identical regardless of intent. Unintentional drift is a **Validity Threat**; intentional drift is **Metric Manipulation**. Both result in **Construct-Operational Decoupling**.

  ### A Note on Your River Water Cases

  As a chemist, you will recognize that Case 1 is technically a **Calibration Shift**. In analytical chemistry, we fight this with Standard Reference Materials (SRMs). If you had run an SRM across the instrument change, you would have seen the "detectable" shift immediately.

  Case 2 is **Administrative Censoring**. This is rife in environmental regulation (e.g., removing "non-achievable" sites from the list of monitored bodies).

  The reason you don't have a single word for this is that science tries to prevent it (via standardization), while management often exploits it (via redefinition). It sits in the gap between the **Laboratory** (where the measure is king) and the **Bureau** (where the target is king).

  **Operational Drift** is the name for what happens when the Bureau's definitions overwrite the Laboratory's calibration without anyone noticing the construct has been left behind.
