answer: |-
  Good morning. It is a genuine privilege to welcome you to this workshop, "Expertise at the Boundaries." Looking around the room, I see a gathering that is, by design, somewhat unusual. We have here colleagues whose daily work involves the rigorous formalisation of knowledge conditions, sitting alongside policy researchers, archivists, and family members who navigate the messy, practical consequences of those conditions every day. This bifurcation is not an accident; it is the point. And it is a point that resonates deeply with the career of our colleague, Sarah, whom we honour today.

  For two decades, Sarah's work has reminded us that institutional knowledge is not merely a accumulation of facts, but a practice of knowing where to stop. She has taught us that epistemic humility is not a weakness of the system, but a structural necessity. Today, I want to offer a framework for understanding why that humility is required, drawing on a tension that some of you will recognise from philosophical theory, but which I believe holds profound implications for all of us, regardless of our familiarity with the technical literature.

  There is a particular way of understanding what it means to "know" something. It suggests that knowledge is not just about having a true belief. It is about how that belief responds to the truth. To truly know a fact, your belief must track that fact. This means that if the fact were different—if the reality were slightly altered—your belief would change accordingly. You must be sensitive to the way the world actually is. If the world were otherwise, you would not remain stubbornly convinced that things are as they are.

  Now, we usually assume that knowledge flows logically. If an institution knows fact A, and fact A strictly implies fact B, then we assume the institution also knows fact B. This seems like common sense. It is the principle of closure: knowledge should close under logical entailment. If I know the switch is up, and I know that up means the light is on, then I know the light is on.

  However, there is a persistent tension here. When we analyse knowledge as "tracking," this logical flow often breaks. It is possible to know A—because your belief tracks A—yet fail to know B, even when A guarantees B. This happens because your belief might track A perfectly, but fail to track B. You are sensitive to changes in A, but insensitive to changes in B. Consequently, expertise in one domain does not automatically transmute into expertise in an adjacent domain, even when the logic suggests it should.

  This is not merely a puzzle for the seminar room. It is a hazard for institutions. Let me illustrate this with a specific historical scenario that I hope will resonate with the archivists and policy researchers among us, while offering a concrete model for the epistemologists.

  Consider the Board of Trade's Ship Stability Division in the early 1920s. Following a series of maritime losses, this department was tasked with certifying the seaworthiness of commercial vessels. Their specific expertise lay in structural engineering. They developed precise methods for measuring the tensile strength and thickness of a ship's hull plating. Let us call this Proposition A: "The hull meets the required structural specifications."

  The Division knew A. Their measurements were rigorous. If a hull had been too thin, their tests would have revealed it, and they would not have certified it. Their belief tracked the reality of the steel.

  Now, consider Proposition B: "The ship is seaworthy." In the minds of the administrators, A entailed B. It seemed obvious that if the hull was structurally sound, the ship was safe to sail. The logic was impeccable. Therefore, the Division began to issue certificates of seaworthiness based primarily on these structural audits.

  Here is where the tracking condition fails. Imagine a nearby possible world—a realistic scenario—where the hull is perfectly sound (A is true), but the cargo has been loaded incorrectly, shifting the centre of gravity so dangerously that the ship will capsize in a moderate storm (B is false). In this scenario, the Division's belief that the ship is seaworthy remains unchanged. Why? Because their expertise tracks the steel, not the load. They are insensitive to the variable that actually determines safety in this instance.

  Because their belief does not change when B becomes false (provided A remains true), they do not, strictly speaking, know B. They know the hull is strong, but they do not know the ship is safe. Yet, institutionally, they acted as though they did. They extended their predictive authority from the domain of materials science into the domain of operational safety. The entailment seemed logical, but the epistemic grounding did not hold.

  This is the structural work I wish this workshop to undertake. We often treat institutional expertise as transitive. We assume that because a health agency knows infection rates, they know the impact on economic productivity. We assume that because an archive knows the provenance of a document, they know the historical truth of its content. But if the belief does not track the specific variables of the second domain, the knowledge claim fails, even if the logic holds.

  Sarah's career has been a testament to recognising these boundaries. She understood that epistemic humility is the recognition that our tracking mechanisms are domain-specific. To claim knowledge beyond the range of our sensitivity is not confidence; it is error.

  For the epistemologists here, this offers a rich field to examine how tracking conditions operate in collective, bureaucratic agents rather than individual subjects. For the policy researchers and archivists, this offers a vocabulary to push back against mission creep. It allows us to say, "Our data tracks this variable, but it does not track that outcome, even if one implies the other." It validates the refusal to treat expertise as a universal currency.

  As we proceed over the next two days, I invite you to keep this tension in mind. When we discuss the boundaries of expertise, we are not just talking about administrative jurisdictions or budget lines. We are talking about the limits of where our beliefs actually track the truth. We are asking where our institutional senses stop working, even when our logic tells us they should continue.

  Sarah taught us that knowing what we do not know is the highest form of institutional competence. Let us hope this workshop helps us map those unknowns with greater precision. Thank you, and welcome.
