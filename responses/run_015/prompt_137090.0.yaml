answer: |-
  Your intuition about the string of zeroes and ones is spot on, and it actually cuts straight to the heart of the matter. When you say that rule A and rule B come out level across every possible sequence but diverge when there is a stable bias, you have essentially rediscovered the core condition of the theorem yourself. To give you the menu of readings you asked for, we need to separate the mathematical identity from the philosophical implication and then from the practical advice your housemate is drawing from them. The first reading is the strictly mathematical one, which is trivially true but often misunderstood. This version states that if you average the performance of any two algorithms over the set of all possible target functions, their expected error is identical. What is being averaged over here is crucial: it is every conceivable mapping from inputs to outputs, regardless of whether that mapping looks like noise, a straight line, a seasonal cycle, or pure chaos. For this tie to hold, the set of problems must be closed under permutation, meaning that if you shuffle the output values around arbitrarily, the probability of encountering that problem remains the same. In this reading, nothing is being claimed about the real world, only about the symmetry of the space of all logical possibilities. The verdict on this reading is that it is mathematically sound but practically vacuous, because no real-world process, especially not garden centre demand, is drawn from a uniform distribution over all possible functions.

  The second reading moves from mathematics to methodology, and this is where the concept of paying for lunch comes in. This version claims that to outperform random guessing on a specific subset of problems, you must perform worse on the complementary subset. Here, what counts as paying is the inductive bias itself, which is just a fancy term for the assumptions you build into your model. If you assume that demand changes slowly, you are paying for that advantage by accepting that you will fail catastrophically if demand actually changes erratically. You pay with a prior, or a restriction on the kinds of patterns you are willing to recognize. The verdict on this reading is that it is a useful warning against overconfidence, reminding us that every method fails somewhere, but it does not imply that all methods are equally useful for our specific purposes. It just means that excellence is local to the structure of the problem.

  The third reading is the radical sceptical one your housemate is leaning on, which ties directly to Hume. This claims that because we cannot know ahead of time which subset of problems we are facing, we cannot justify preferring one bias over another without begging the question. This is indeed the old worry that you cannot justify assuming the future will resemble the past without using past success to justify it, which is circular. The verdict here is that while philosophically coherent, it is pragmatically paralysing. It treats the set of all logically possible problems as if it were the set of all plausible problems. This is where your objection about the average being taken over all possible problems becomes the kill shot. Choosing to average over every possible function is itself a choice of prior, specifically a uniform prior that assumes structure is no more likely than noise. If you reject that prior, which you should because you know seasons exist, the theorem no longer implies that all algorithms are equal.

  There is also the distinction you heard about regarding search versus generalisation, though for your forecasting work, the generalisation version is the relevant one. The search version applies to optimisation, like trying to find the highest point in a landscape, and says that without assumptions about the landscape, all search strategies are equal. The generalisation version applies to learning from data to predict new data. Both rely on the same symmetry argument, but neither forces you to accept that your specific landscape is unstructured. Your housemate is conflating the theorem's condition with reality. For his conclusion to follow, that you might as well use default settings because past success tells you nothing, it would have to be true that the demand for shrubs is generated by a process that is equally likely to be any function whatsoever. He is effectively arguing that because you cannot prove the sun will rise tomorrow without assuming nature is uniform, you should not bother looking out the window to see if it is currently night.

  The straight answer you need is that the reading he requires is the one that assumes the distribution of problems you face is uniform over all possible functions, and that is false. The theorem proves that without assumptions, learning is impossible, but it does not prove that assumptions are unjustified. We are justified in making them because we are not operating in the space of all logical possibilities, but in a physical world with causal structures, seasons, and human habits. Your dumb approach has worked for three seasons not because of luck in a vacuum, but because you have implicitly captured some of that structure, perhaps through the simple bias that demand is continuous or seasonal. When he says there is no free lunch, he is right that you pay with assumptions, but he is wrong to suggest that the bill is the same for everyone regardless of where you are eating. You are eating at a garden centre, not a casino, and the menu is not random. You can trust your method to the extent that it encodes the actual regularities of your business, and the mathematics does not forbid you from believing those regularities will persist, even if it cannot prove they must.
