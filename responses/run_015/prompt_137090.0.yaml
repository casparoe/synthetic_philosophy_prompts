prompt: |-
  I've somehow ended up being the person who does the demand forecasting for my family's garden centre. We're small, we have to order stock months in advance, and when I get it badly wrong we either spend a month looking at a yard full of dead shrubs or we turn people away in the first warm week of the year. So I've started arguing about this with my old university housemate, who's doing a PhD in machine learning, and every single time I try to explain why I trust one way of guessing over another he says there's no such thing as a free lunch, and then uses that to mean roughly: all algorithms come out the same on average, so no inductive bias can ever be justified, so the fact that my dumb approach has worked the last three seasons tells me nothing, and I might as well just take whatever the default setting in the library is. He also claimed it's basically the same point Hume made about induction, only with more maths, and I genuinely can't tell whether that's deep or whether he's getting away with something.

  I've been trying to keep myself honest with a tiny example. Say all I ever observe is a string of zeroes and ones and I've got two rules: rule A predicts whatever has been more common so far, rule B predicts the opposite of the last thing that happened. If I score them across every possible sequence of some fixed length they seem to come out exactly level, which I take it is his point. But if the sequences are coming from something with a stable bias, or something that changes slowly, they definitely don't come out level. And it feels like for any rule I invent there's a mirror version that does brilliantly exactly where mine falls apart. So: what are the different precise things no free lunch might be claiming here, from the completely trivial up to the genuinely radical? What exactly is being averaged over; what has to be true of the set of problems for the tie to actually hold (something about it being closed under shuffling?); what counts as paying for lunch, a prior, an assumption that things won't change, a choice of loss function, just more compute; and is the thing I keep hearing about there being two versions, one about search over a space and one about generalising to data you haven't seen, relevant to which one he'd need? I'd also like to know how much of this is a mathematical result about averages and how much is the old worry that you can't justify assuming the future will resemble the past without helping yourself to that very assumption. And one thing that's been bugging me: if the average is taken over all possible problems, isn't that itself a choice, and does that stop the theorem from being used to argue for scepticism?

  What I actually want is the menu of readings with a verdict on each, and then a straight answer about which one would have to be true for his conclusion to follow, because my suspicion is that the reading he needs is the one that's false and I can't yet say why. Please write it as continuous prose, no headings, no bullet points, no bold text, no tables, just an email-length walk through the options in the order you think is clearest. I'll be reading it on my phone between deliveries, and please don't send me paper titles or citations, he's already sent me more of those than I can use.
