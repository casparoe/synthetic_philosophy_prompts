answer: |-
  ### Recommendation and Closest Analog

  **Vote:** **In Scope** (Heightened Review).

  **Closest Analog:** **Precedent #2 (Adult Zebrafish)**, qualified by **Precedent #7 (Ex Vivo Brain)**.

  **Reasoning:**
  The core moral risk in this preparation resides in the living body, which retains the capacity for trade-offs and nociception established in Precedent #2. The committee's history indicates that "running organization" is a necessary condition for concern (Precedent #7), and B-114 satisfies this via real-time emulation. While Precedent #4 (C. elegans simulation) warns that models do not *add* standing, it explicitly states a model "inherits whatever standing the modelled animal has." Since the modelled animal here is a zebrafish (In Scope per #2), the emulation inherits that standing. To rule this *Out* would imply that replacing the biological controller with a functionally isomorphic silicon one negates the moral status of the vulnerable body, a position unsupported by the record. The preparation remains a zebrafish system, merely with a substrate-substituted controller.

  ### Analysis of the Three Proposed Rules

  You proposed three rules that fit the seven verdicts. Here is how they perform against the record and B-114:

  1.  **Real-time Causal Organization (Substrate Neutrality):**
      *   *Fit:* High. Explains why Ex Vivo Brain (#7) was Out (not running) and why LLM (#5) was Out (no unified agent/causal stake). Explains why Zebrafish (#2) is In.
      *   *Prediction for B-114:* **In Scope.** The organization is running, causal loops are closed, and the substrate (silicon vs. carbon) is irrelevant to the function.
  2.  **History/Genesis (Selection/Development):**
      *   *Fit:* Moderate. Explains why C. elegans sim (#4) and LLM (#5) are Out (no evolutionary/developmental stakes). However, it struggles with Precedent #7; the ex vivo brain had the correct history but was ruled Out because it wasn't *running*. History is necessary but not sufficient.
      *   *Prediction for B-114:* **Ambiguous/Out.** The emulation is a *copy* reconstructed from the brain. While it matches the connectivity, it did not develop *in situ* alongside the body. If "history" requires continuous biological co-development, this fails.
  3.  **Actual Controller of a Living Body:**
      *   *Fit:* High. Explains why LLM (#5) and Cells in Dish (#6) are Out (no body). Explains why Zebrafish (#2) and Octopus (#1) are In.
      *   *Prediction for B-114:* **In Scope.** The emulation is the actual controller of a living zebrafish body in water with real consequences.

  **The Rule You Have Been Running:**
  You have been running a hybrid of **Rule 1 (Causal Organization)** and **Rule 3 (Embodiment)**, which we might call **Embodied Functionalism**.
  *   *Principle:* Moral concern attaches to a system that embodies a vulnerable living organism *and* maintains a real-time, closed-loop causal organization capable of generating the behavioral markers of agency or suffering (trade-offs, analgesia).
  *   *Why not Rule 2?* If History were the primary driver, Precedent #7 (Ex Vivo Brain) might have passed (it had the history), or Precedent #4 (C. elegans) might have passed if the simulation was perfect (it had the "design" history). The rejections in #4, #5, and #7 hinge on *current functional capacity* and *embodiment*, not just origin.

  ### Evaluation of the Colleague's Claim

  **Is the colleague fair?** **No.**
  The claim that there is "no rule... only the marker test plus a threshold" is contradicted by Precedent #5. The LLM emitted "elaborate first-person reports of distress"—these are behavioral markers analogous to the "motivational trade-offs" in #2. Yet it was ruled Out. This proves markers alone are insufficient; the *system architecture* (unified agent, body, stakes) matters. Furthermore, Precedent #3 cites "fragmentary organization" alongside numbers, indicating structural criteria exist independent of thresholds.

  ### Principles for the Record

  If the committee votes **In Scope**, you are adopting this principle:
  > **The Principle of Somatic Vulnerability:** Moral status is anchored in the living body's capacity to be harmed or to strive, provided the control system maintains functional isomorphism with the biological original in real-time. The substrate of the controller is morally neutral; the vulnerability of the body is not.

  If the committee votes **Out of Scope**, you are adopting this principle:
  > **The Principle of Biographical Continuity:** Moral status requires the controller to share the continuous developmental history of the organism it inhabits. A functional copy, even if isomorphic and embodied, severs the moral subject from the biological entity, rendering the preparation a tool rather than a subject.

  ### The Critical Test Case

  To distinguish between **Embodied Functionalism** (Vote In) and **Biographical Continuity** (Vote Out), you need a case where the Body is Vulnerable, but the Controller's History is explicitly Artificial.

  **The Case:** **"The Tabula Rasa Cyborg."**
  A larval zebrafish body (same stage as B-114) whose brain is silenced, but instead of being driven by an *emulation of its own brain*, it is driven by a **silicon controller trained from scratch via reinforcement learning within that specific body.** The controller starts with random weights and learns to navigate and avoid pain *during* the experiment, never having been a biological zebrafish brain.

  **Predictions:**
  *   **Embodied Functionalism (Your likely rule):** **In Scope.** The body is the same vulnerable zebrafish. The controller is functionally adequate and causally coupled in real-time. The system exhibits the markers of trade-offs and avoidance. The origin of the controller's weights is irrelevant.
  *   **Biographical Continuity (The alternative):** **Out of Scope.** The controller lacks the specific developmental history of a zebrafish. It is an artificial agent inhabiting a biological shell, akin to a remote-operated vehicle. It does not inherit the standing of the fish because the "self" of the fish was never present in the controller.

  **Why This Is Informative:**
  B-114 confounds *Substrate* (Silicon) with *History* (Copy of original brain). If you vote In on B-114, critics can argue you only accepted it because it was a *copy* of the fish's own mind (preserving Biographical Continuity). The "Tabula Rasa" case removes the "copy" element. If you vote In there, you have definitively committed to Substrate Neutrality and Somatic Vulnerability. If you vote Out, you reveal that Biographical Continuity was the hidden veto all along, which would retrospectively cast doubt on the consistency of B-114. This single case forces the committee to declare whether moral status resides in the *flesh that feels* or the *history that thinks*.
