  **Field Journal: Station 4-Alpha**
  **Date:** December 20th
  **Time:** 23:15
  **Location:** 78° N, Svalbard Archipelago
  **Entry:** 492

  The wind has been screaming against the polypane for three days, but inside the lab, it's just the hum of the spectrometer and the cold seeping up through the floorboards. I have forty-two jars on the bench. Forty-two samples of *Lichenus arcticus*, or whatever taxonomic box we decide to shove them into once I figure out what the hell they are doing.

  I called the property 'quorm' in my notes yesterday. It felt silly then, like naming a ghost. Now it feels like the only honest word I have.

  The definition is simple, almost cruel in its symmetry: a quorm-lichen is olive-green if observed before the winter solstice, and slate-blue if observed after. No chemical trigger. No shift in pH, no change in chlorophyll fluorescence, nothing in the spectral analysis to explain why the color should jump just because the Earth tilts away from the sun. The instruments are blind to it. They read the olive-green perfectly on the samples I collected in November. They tell me the molecular structure is stable. They tell me there is no reason for the color to change.

  But the definition of 'quorm' doesn't require a chemical reason. It only requires a time.

  I look at the forty-two jars. Every single one is olive-green. Every single one was collected before the solstice. If I write in my final report that "all quorm-lichens are olive-green," I am telling the truth based on every piece of data I possess. It is the safe prediction. It is the ecological prediction. Things tend to stay the way they are unless something pushes them.

  But if I write that "all quorm-lichens are slate-blue," I am also telling the truth based on every piece of data I possess. Because if 'quorm' means "green before solstice, blue after," then every olive-green sample I have held confirms the hypothesis that they are quorm-lichens. The data does not distinguish between a lichen that is inherently green and a lichen that is inherently time-dependent.

  Tomorrow is the solstice. I have to go out to the ridge to collect sample forty-three.

  If I come back with an olive-green lichen, the standard model holds. If I come back with a slate-blue lichen, the quorm model holds. But today, right now, sitting in the dark with the aurora bleeding violet over the ice, I realize both models are equally supported by the evidence on this bench. My spectrometer can't tell me which future is real. It only tells me about the past.

  I used to trust that nature was consistent, that laws were written in chemistry, not in calendars. Now I'm staring at a jar of green moss and wondering if I'm looking at a constant or a countdown. The instruments are just mirrors. They show me what I've already seen. They don't show me what comes next.

  I'll pack the sample bags tonight. I'll go out tomorrow. But I don't know what color I expect to see anymore, and that frightens me more than the cold.

