answer: |-
  ### THE "SELF-REFUTING" CLAIM CHECKLIST
  **Print this side only for students/judges.**

  **1. THE CLAIM CHECK**
  Did the opponent state this as a **fact** to be believed, not just a feeling or a suggestion?
  *   **Sufficient Answer:** "Yes, they asserted it as true."
  *   **If NO:** Argument **FAILS**. (They can't be contradicted if they aren't claiming truth).
  *   **If YES:** Go to 2.

  **2. THE EXIT CHECK**
  Could they have made their point without doing the action that supposedly contradicts them? (e.g., Could they have stayed silent?)
  *   **Sufficient Answer:** "No, the action was required to make the claim."
  *   **If NO:** Argument **WEAKENS**. (If they could have stayed silent, the action isn't unavoidable).
  *   **If YES:** Go to 3.

  **3. THE CLASH CHECK**
  Does the **action** they took make the **content** of their claim impossible? (e.g., Using logic to say logic doesn't work).
  *   **Sufficient Answer:** "Yes, the act proves the opposite of the words."
  *   **If NO:** Argument **FAILS**. (No contradiction exists).
  *   **If YES:** Go to 4.

  **4. THE UNIVERSAL CHECK**
  Is this action required for **anyone** to communicate, or just this speaker in this moment?
  *   **Sufficient Answer:** "Yes, anyone arguing must do this."
  *   **If NO:** Argument **FAILS**. (It's just a personal quirk, not a rule).
  *   **If YES:** Go to 5.

  **5. THE REALITY CHECK (JUDGE'S CALL ZONE)**
  Does this prove the **world** is actually this way, or just that we must **talk** as if it is?
  *   **Sufficient Answer:** "It proves we must talk this way."
  *   **STOP HERE.** Hand to Judge.
  *   **Judge's Task:** Decide if "rules for talking" are enough to win the round, or if the opponent needs to prove "facts about the world."
  *   **If "It proves the world is this way":** Go to 6.

  **6. THE LOOP CHECK**
  Does the proof quietly assume the conclusion is already true to get started? (e.g., Assuming truth exists to prove truth exists).
  *   **Sufficient Answer:** "No, it starts from a neutral action."
  *   **If NO:** Argument **FAILS**. (It is circular).
  *   **If YES:** Argument **STANDS**. (Proceed to weighing).

  **7. THE WEIGHING (JUDGE'S CALL)**
  If the argument stands, does this rule outweigh a single piece of ordinary evidence against it?
  *   **Judge's Task:** Decide if a "must think" rule beats a "fact" (e.g., Does "we must speak freely" beat "science says brains are determined"?).

  ***

  ### COACH'S KEY (Theory Trade-offs)
  *Do not distribute. Read this to understand what the plain language hides.*

  *   **Q1 (Claim):** Filters out *non-assertoric* speech. **Trade-off:** Ignores "implicature" (things suggested but not said).
  *   **Q2 (Exit):** Addresses your **Volition Observation**. **Trade-off:** "Required" is vague. Philosophers distinguish *pragmatic* necessity from *logical* necessity. Students just need to know if there was an alternative.
  *   **Q5 (Reality):** Addresses your **Think vs. Is Observation**. **Trade-off:** This is the Kantian gap. Plain language cannot solve whether "conditions of possibility" equal "ontological truth." That is why this is a **Judge's Call**.
  *   **Q6 (Loop):** Addresses your **Circularity Observation**. **Trade-off:** Distinguishes *vicious* circularity from *virtuous* recursion. Students treat all circles as bad; this is acceptable for speed.

  ***

  ### TEST RUNS

  **Case 1: Relativism ("There is no objective truth.")**
  1.  **Claim:** Yes, asserted as fact. (Pass)
  2.  **Exit:** No, they had to speak to claim it. (Pass)
  3.  **Clash:** Yes, claiming truth denies "no truth." (Pass)
  4.  **Universal:** Yes, all claimants claim truth. (Pass)
  5.  **Reality:** **STOP.** Proves we must *talk* as if truth exists. Does not prove truth *exists*.
      *   **Judge's Call:** Is the rule of conversation enough to defeat the claim? Usually **YES** for the speaker using this move. The relativist looks hypocritical.
  6.  **Loop:** (Skipped due to Stop).
      *   **Result:** **RHETORICAL WIN, ONTOLOGICAL STALL.** It shuts down the relativist in a debate, but doesn't solve philosophy.

  **Case 2: Reasons for Belief ("There are no reasons for belief.")**
  1.  **Claim:** Yes. (Pass)
  2.  **Exit:** No, arguing requires offering reasons. (Pass)
  3.  **Clash:** Yes, offering a reason denies "no reasons." (Pass)
  4.  **Universal:** Yes. (Pass)
  5.  **Reality:** **STOP.** Proves we are *committed* to reasons. Does not prove reasons are *real objects*.
      *   **Judge's Call:** In a debate round, commitment is usually enough to win the point. You cannot debate without reasons.
  6.  **Loop:** No, starts from the act of arguing, not the existence of reasons. (Pass)
      *   **Result:** **STRONGER THAN RELATIVISM.** It survives the Loop Check. It establishes a normative rule for the activity (debate), even if it doesn't prove metaphysical realism. **Honest Assessment:** You have been claiming it proves reasons exist *out there*. The procedure says it only proves reasons are required *in here*.

  **Case 3: Free Will ("You can't deny free will, you chose to speak.")**
  1.  **Claim:** Yes. (Pass)
  2.  **Exit:** **FAIL.** They could have stayed silent. Speaking is not the only option.
      *   **Result:** **OUTRIGHT FAIL.** The act of speaking proves *capacity*, not *metaphysical freedom*. A robot could speak. This confuses "ability to act" with "freedom from causation." Do not run this argument; it collapses at Q2.

  ***

  ### LIMITS & JUDGMENT CALLS

  **1. Which questions are judgment calls wearing procedural clothing?**
  *   **Q5 (The Reality Check):** This is the deepest philosophical problem in the set (Transcendental Idealism vs. Realism). The card forces a binary choice ("World" vs. "Talk"), but the truth is likely a mix. The Judge is deciding whether *pragmatic success* counts as *truth* for the purposes of the round.
  *   **Q7 (The Weighing):** There is no algorithm for weighing a "condition of possibility" against an empirical fact. If a scientist says "Determinism is true" (Fact) and the debater says "You must assume freedom to argue" (Rule), the Judge decides if the Rule trumps the Fact.

  **2. Can this certify a conclusion as true of the world?**
  *   **No.** The procedure explicitly isolates this at Q5. It can certify that a claim is **unavoidable for agents like us**, but it cannot certify that the claim corresponds to mind-independent reality. If a student claims it does, they are overstepping the procedure.

  **3. How to weigh this against ordinary evidence?**
  *   **The Rule:** A "Self-Refuting" move that survives Q6 establishes a **precondition**. Ordinary evidence establishes a **content claim**.
  *   **The Weighing:** Preconditions usually trump content *within the activity of debate*. (You can't use evidence to deny the rules of evidence). However, outside the activity (in the real world), one piece of hard evidence (e.g., a brain scan) often outweighs a linguistic rule.
  *   **Instruction to Judges:** If the round is about *what we should do/think now*, the Self-Refuting move wins (it sets the rules). If the round is about *what exists independently of us*, the Ordinary Evidence wins (the Self-Refuting move only binds the speaker, not the universe).
