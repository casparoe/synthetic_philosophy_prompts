answer: |-
  Here's a runnable design for your seminar. I've kept the tone casual (and don't worry, I won't sweat the occasional typo like "recieve"—we're all human).

  The goal here isn't to teach Scanlon via lecture, but to make them *feel* the frustration of the "individual veto" that defines contractualism. They will want to do utilitarian math. The rules will stop them.

  ### **Game Title: The Heatwave Ceiling**
  **Time:** 90 Minutes
  **Players:** 14 Grad Students
  **Materials:**
  *   14 Role Cards (see below)
  *   Whiteboard + Markers
  *   20 "Reasonableness Tokens" (poker chips, sticky notes, or just checkmarks on the board)
  *   Timer

  ---

  ### **1. The Scenario (5 mins)**
  **Context:** It's 2045. A massive grid failure has hit the city. Temperatures are 115°F.
  **Resource:** There are only **5 Portable Cooling Units** available for this neighborhood.
  **Population:** There are **14 Households** (represented by the 14 students).
  **The Stakes:** Without cooling, health outcomes vary based on vulnerability.
  **The Rule:** You are the Municipal Ethics Board. You must decide who gets the units. But you cannot just vote. You must agree on a **Principle of Allocation** that no one can *reasonably reject*.

  ---

  ### **2. Role Cards (Prep these on index cards)**
  Distribute one per student. Tell them: *Keep your "Private Threshold" hidden. You may share your vulnerability level, but not your veto point.*

  **Card Structure:**
  *   **Identity:** (e.g., Retired Nurse, Single Parent, Tech Worker)
  *   **Vulnerability:** (Critical, High, Moderate, Low)
  *   **Outcome without AC:** (Death, Hospitalization, Severe Pain, Discomfort)
  *   **Private Threshold (The Veto):** "I will reasonably reject any principle that leaves me facing an outcome worse than [X]."

  **Distribution (14 Cards):**
  *   **1x Critical:** Outcome = **Death**. Threshold = "I reject any plan where I face death."
  *   **5x High:** Outcome = **Hospitalization**. Threshold = "I reject any plan where I face hospitalization if cooling was available."
  *   **8x Low:** Outcome = **Severe Discomfort**. Threshold = "I reject any plan where I suffer discomfort *unless* it saves a life."

  *(Note: The tension is between the 1 Critical and the 5 High. There are 5 Units. If you save the 5 High, the 1 Critical dies. If you save the 1 Critical, 4 High get units, 1 High gets hospitalized.)*

  ---

  ### **3. The Mechanics & Timeline**

  #### **Phase 1: Private Reflection (10 mins)**
  *   Students read cards.
  *   **Task:** Write down one sentence on why *your* need is urgent.
  *   **Facilitator Note:** Remind them that in Scanlonian contractualism, you can't just say "I want this." You need a *reason* others couldn't reasonably reject.

  #### **Phase 2: The Meta-Deadlock (The Ceiling) (20 mins)**
  *   **Rule:** Before allocating units, the group must set the **"Burden Ceiling."**
  *   **Definition:** The maximum level of harm any single person can be asked to endure for the sake of the group.
  *   **Scale:**
      1.  Discomfort
      2.  Severe Pain
      3.  Hospitalization
      4.  Death
  *   **Constraint:** Setting the Ceiling requires **Unanimous Consent**. If even one person says "No," the Ceiling is not set.
  *   **The Trap:**
      *   The **Critical** player cannot agree to a Ceiling of "Hospitalization" or lower (because that permits them to die). They must insist the Ceiling is "Death" (meaning no one can be asked to die).
      *   The **High** players might want the Ceiling to be "Hospitalization" (meaning it's okay to ask someone to die if it saves 5 of us from hospitalization).
      *   **Result:** They will likely stall here. The Critical player holds a veto. The High players hold numbers.
  *   **Facilitator Move:** If they stall too long, remind them: *No Ceiling = No Units distributed = Everyone suffers their natural outcome.*

  #### **Phase 3: Proposal & Justification (25 mins)**
  *   Once (or if) a Ceiling is set, they must propose an Allocation Principle (e.g., "Save the most vulnerable," "Lottery," "Save the most people").
  *   **The Veto Check:** After a principle is proposed, ask each student silently: *Does this violate my Private Threshold?*
  *   If **YES**: They stand up and say "I reject this." The principle fails.
  *   If **NO**: They stay seated.
  *   **Social Stakes:** Every time a student successfully justifies a position without vetoing (or successfully vetoes with a public reason), they earn a **Reasonableness Token** on the whiteboard. The goal is to collect tokens, not to "win" the AC unit. This shifts focus from outcome to justification.

  #### **Phase 4: The Crash (15 mins)**
  *   By now, they should be hitting the wall.
  *   If they try to aggregate ("5 hospitalizations outweigh 1 death"), the Critical player vetoes.
  *   If they try to save the Critical ("1 death outweighs 5 hospitalizations"), the 5 High players might veto (depending on their card thresholds).
  *   Let them feel the frustration of the unanimity rule.
  *   **Final Decision:** If no agreement is reached by the mark, the grid fails completely. Everyone suffers their natural outcome.

  #### **Phase 5: Debrief (20 mins)**
  *   See script below.

  ---

  ### **4. What Will Predictably Go Wrong**
  Be ready for these moves. They are bugs in the game, but features of the philosophy.

  1.  **Secret Utilitarianism:** Students will try to vote on the Ceiling by show of hands. **Stop them.** Remind them: *Unanimous consent only.* This forces the Critical player to speak up.
  2.  **Bullying the Critical:** The group will pressure the Critical player: "Don't be unreasonable. If you veto, everyone dies." **Let this happen.** This is exactly the pressure Scanlon is analyzing. Is it reasonable to demand someone accept death for the aggregate good?
  3.  **Trading Tokens:** They might try to bribe the Critical player with Reasonableness Tokens. **Allow it,** then point out in debrief that contractualism forbids trading moral status for social credit.
  4.  **Ignoring the Ceiling:** They might skip to allocating units. **Pause the game.** Remind them: *No Ceiling, No Units.* This forces the meta-level agreement that creates the deadlock.

  ---

  ### **5. Debrief Script (The Philosophical Payoff)**
  *Don't lecture. Map their experience to the text.*

  **1. The Wall of Unanimity**
  "Raise your hand if you felt frustrated when the [Critical Role] vetoed the plan that saved 5 people. You wanted to say, 'But the numbers!' Scanlon says: Numbers don't aggregate across persons. You couldn't add up the 5 hospitalizations to outweigh the 1 death. Why? Because justification is owed *to each*, not to the group."

  **2. The Ceiling Mechanic**
  "When you tried to set the Burden Ceiling, you hit a meta-deadlock. The person facing death couldn't agree that death was an 'acceptable burden.' In Scanlon's terms, they had a valid reason for rejection that wasn't outweighed by the others' convenience. The game forced you to see that 'reasonable rejection' isn't about preference; it's about the magnitude of the burden."

  **3. The Limitation (Facilitator Honesty)**
  "Here's where the game lies to you. In the game, you had a veto power. In Scanlon's theory, you don't get to veto just because you *want* to. You can only reject if your reason is *generic* and *reasonable*.
  *   **Approximation:** The game made reasons look like private preferences (hidden on cards).
  *   **Reality:** Scanlon argues reasons are objective. We have to argue about what counts as a 'good reason,' not just check a threshold.
  *   **My Job:** I have to tell you that in real contractualism, we don't vote on the Ceiling. We argue about whether 'saving 5 from pain' is a valid reason to ask '1 to die.' The game forced a deadlock; the philosophy asks us to reason through it."

  **4. The Social Stakes**
  "Did anyone care more about getting the Reasonableness Token than the AC unit? Hopefully. That's the point. Contractualism is about the relationship of mutual justification. If you bulldozed the Critical player to get the utilitarian win, you lost 'reasonableness' points even if you saved more lives."

  ---

  ### **6. Whiteboard Layout**
  Draw this before class starts:

  ```
  +-------------------------------------------------------+
  |  HEATWAVE CITY: RESOURCE ALLOCATION                   |
  |                                                       |
  |  Units Available:  [ 5 ]                              |
  |  Households:       [ 14 ]                             |
  |                                                       |
  |  CURRENT BURDEN CEILING:  [ UNSET ]                   |
  |  (Requires Unanimous Consent to Change)               |
  |                                                       |
  |  REASONABLENESS TRACKER:                              |
  |  [Student Names]  [Tokens]                            |
  |  1.               0                                   |
  |  2.               0                                   |
  |  ...                                                  |
  |                                                       |
  |  STATUS:  [ DELIBERATING ] / [ DEADLOCK ] / [ AGREED ]|
  +-------------------------------------------------------+
  ```

  ### **7. Facilitator Tips for the "Crash"**
  *   **If they agree too fast:** Intervene. "Wait, does the Critical player actually accept this? Check their card."
  *   **If they deadlock completely:** Let them sit in the silence for 2 minutes. Then call time. The discomfort *is* the lesson.
  *   **If they ask you to decide:** "I'm not the Chair. You are. If you can't justify it to each other, the grid stays down."

  This setup should make them feel the weight of the "individual veto" without needing a single citation. Good luck with the seminar—and don't worry about the typos, recieve happens to the best of us.
