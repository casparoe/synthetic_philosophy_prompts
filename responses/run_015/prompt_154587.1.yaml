      *   If they set the Ceiling at "Death," then everyone is safe from veto, but now they have to allocate.
      *   Actually, the Ceiling should be: "Maximum burden any single person can be asked to endure for the sake of the group."
      *   If I set it low (Discomfort), I can't ask anyone to suffer Pain or Death. But I only have 5 units. So 9 people suffer. If 1 of those 9 faces Death, that violates the Ceiling.
