      *   Let's make it simpler: The Ceiling is the "Max Acceptable Loss."
      *   To run the aggregation (Save 5 vs 1), you need to agree that "Losing 1 Life is Acceptable if 5 avoid Pain."
      *   The 1 Life person vetoes this agreement.
      *   Unanimity fails. Game stalls.
