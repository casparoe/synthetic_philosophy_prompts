prompt: |-
  I convene a working group that drafts consensus guidance for a health-data research consortium. Its members are clinicians, epidemiologists, data scientists, lawyers and two philosophers, and roughly every second meeting deadlocks over an existence question: whether a proposed diagnostic category is a real disease or a construct, whether a deployed risk model makes decisions, whether a data-sharing population is the sort of thing that can have interests. Half the room wants to settle these by stipulating a definition and moving on; the other half thinks the stipulation quietly buries the real disagreement. I have read enough of the philosophical literature on verbal disputes, quantifier variance, conceptual ethics and metalinguistic negotiation to believe there are decent tests for which side is right in a given case, but my facilitators are not philosophers, the room is not patient, and I get ninety minutes per deadlock. So I need something operational.

  Please write a decision procedure my facilitators can run: the steps in order, each phrased as a question that can be asked out loud to non-philosophers, what counts as a sufficient answer at that step, and where the procedure stops with a verdict or hands the question back to the group as a values call rather than a diagnosis. Three verdicts matter to me, not two: MERELY VERBAL (dissolved once the contested expression is disambiguated or regimented), SUBSTANTIVE (a first-order or meta-level disagreement that survives regimentation), and what I will call CONCEPTUAL (the parties are disagreeing about which concept we ought to use, which is a normative dispute and must not be closed by fiat even though it is, in a sense, about language). At the core I want: a regimentation step, in which the contested term is replaced by a freshly coined one with stipulated application conditions, to see whether the disagreement survives; a check for whether either party is using the term to track a distinction it takes the things themselves to make rather than one we project, since my understanding is that agreement on all the first-order facts does not by itself establish that a dispute is merely verbal; a downstream-licensing step, asking what each party takes the existence claim to entitle them to — an explanation, a legal or moral consequence, a line in our guidance — on the ground that if the licenses differ, agreeing on usage does not settle the dispute; and, for disputes that do dissolve, a cost-of-relabeling check, because a settlement that puts the whole burden of re-description on one party's vocabulary is not one the group will honour.

  Then run the procedure on two deadlocks from our last meeting, showing the answer at each step: (A) clinicians and philosophers disagreeing about whether a symptom cluster in the new dataset is a distinct disease entity or an artifact of how we code it; (B) engineers and clinicians disagreeing about whether a deployed risk model makes a decision for which someone must take responsibility. I expect (A) to come out MERELY VERBAL and could live with that. I would be annoyed if (B) came out MERELY VERBAL as well, because our consent and accountability framework is built on there being a decision-maker; if the procedure returns that, I want to see precisely which step produces it and what we would have to give up in order to keep it. Finally, tell me which kinds of deadlock the procedure cannot settle at all, and at which points the facilitator's own judgment is doing the work while appearing not to.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**

      *   **Context:** A health-data research consortium working group (clinicians, epidemiologists, data scientists, lawyers, philosophers).
      *   **Problem:** Frequent deadlocks over "existence questions" (real disease vs. construct, model makes decisions, population has interests).
      *   **Conflict:** Half want to stipulate definitions and move on; half think this buries real disagreement.
      *   **Constraints:** 90 minutes per deadlock, facilitators are not philosophers, need operational steps.
      *   **Required Output:**
          1.  A decision procedure (steps as questions, sufficient answers, stopping conditions).
          2.  Three specific verdicts: MERELY VERBAL, SUBSTANTIVE, CONCEPTUAL.
          3.  Core components: Regimentation step, Reality-tracking check, Downstream-licensing step, Cost-of-relabeling check.
          4.  Application to two cases: (A) Disease entity vs. coding artifact (Expected: MERELY VERBAL), (B) Risk model decision/responsibility (Expected: NOT MERELY VERBAL, likely CONCEPTUAL or SUBSTANTIVE).
          5.  Limitations analysis: What the procedure can't settle and where facilitator bias hides.

  2.  **Drafting the Decision Procedure:**

      *   *Goal:* Make it actionable for non-philosophers within 90 minutes.
      *   *Structure:* Sequential filters.
      *   *Step 1: Regimentation (The "New Word" Test).* This addresses the "stipulate and move on" impulse. If we make up a new word with clear criteria, do they still fight?
      *   *Step 2: Reality-Tracking (The "World vs. Words" Test).* This addresses the "real vs. construct" worry. Do they agree on the underlying facts but disagree on the label, or do they disagree on the causal structure of the world?
      *   *Step 3: Downstream Licensing (The "So What?" Test).* This addresses the normative/practical stakes. Does the label change what we *do*?
      *   *Step 4: Cost-of-Relabeling (The "Burden" Test).* This addresses the fairness of stipulation. Who has to change their language?
      *   *Verdict Mapping:*
          *   Disagreement vanishes after Step 1 -> MERELY VERBAL.
          *   Disagreement remains, facts differ -> SUBSTANTIVE.
          *   Disagreement remains, facts same, but stakes/norms differ -> CONCEPTUAL.
          *   Fairness check -> Determines if MERELY VERBAL is *acceptable*.

      *   *Refining the Questions:* Need to be plain English, not jargon-heavy.
      *   *Refining the Verdicts:* Ensure the distinction between SUBSTANTIVE (facts/causality) and CONCEPTUAL (norms/utility) is clear, as this is often the trickiest part of meta-ontology.

  3.  **Developing the Procedure Steps (Iterative Process):**

      *   *Draft 1 (Mental):* 1. Define term. 2. Check facts. 3. Check consequences. 4. Check cost.
      *   *Critique 1:* Too vague. Needs specific "Stop/Go" criteria.
      *   *Draft 2:* 1. Can we replace word X with word Y? 2. Do you agree on the data? 3. Does it change the guidance? 4. Is it fair?
      *   *Critique 2:* Better. Need to ensure the "Conceptual" verdict emerges correctly. If facts agree but consequences differ, that's Conceptual (normative). If facts differ, that's Substantive.
      *   *Final Polish:* Align with the user's specific requirements (Regimentation, Reality-tracking, Licensing, Cost).

  4.  **Running the Procedure on Case (A): Disease Entity vs. Artifact:**

      *   *Scenario:* Clinicians/Philosophers vs. Data Scientists (implied). Is Symptom Cluster X a disease or coding artifact?
      *   *Step 1 (Regimentation):* Replace "Disease" with "Cluster-Alpha" (defined by ICD codes + stats).
      *   *Result:* Everyone agrees Cluster-Alpha exists in the data. Disagreement vanishes.
      *   *Step 2 (Reality):* Do they agree on the causal mechanism? If one side says "biology causes this" and other says "software bug causes this," that's Substantive. *Correction:* User expects MERELY VERBAL. So, I must construct the scenario such that they agree on the causal facts (e.g., "It arises from this specific interaction of biology and coding") but disagree on the label "Disease."
      *   *Step 3 (Licensing):* Does calling it a "Disease" change treatment? If no, it's verbal. If yes, it's conceptual/substantive. To fit user expectation, the licensing must be identical for the guidance purposes.
      *   *Step 4 (Cost):* Is it fair to call it an artifact? Clinicians might hate that. But if the guidance just says "Treat Cluster-Alpha," the label cost is low.
      *   *Verdict:* MERELY VERBAL.

  5.  **Running the Procedure on Case (B): Model Decision/Responsibility:**

      *   *Scenario:* Engineers vs. Clinicians. Does the model "decide"?
      *   *Step 1 (Regimentation):* Replace "Decision" with "Output-Triggered-Action."
      *   *Result:* Engineers say "Yes, it triggers." Clinicians say "No, a human signs off." Disagreement *survives* regimentation because the definition of the *process* is contested, not just the word. Or, even if we define the process, the *responsibility* attachment differs.
      *   *Step 2 (Reality):* Do they agree on the causal chain? Yes (Model outputs score -> Human clicks approve).
      *   *Step 3 (Licensing):* Here is the crux. If "Model Decides" -> Model/Co liable? If "Human Decides" -> Human liable? The *consequences* differ.
      *   *Verdict:* CONCEPTUAL (Normative dispute about where to attach responsibility) or SUBSTANTIVE (if they disagree on the level of human oversight). User wants to avoid MERELY VERBAL here. The procedure must show that licensing differs.
      *   *Refinement:* If we regiment "Decision" to "Statistical Output," Engineers say "That's a decision." Clinicians say "That's a suggestion." The disagreement survives because the *license* (accountability) is tied to the word "Decision." This makes it CONCEPTUAL (which concept serves our ethical goals?).

  6.  **Analyzing Limitations and Facilitator Bias:**

      *   *Where does bias hide?* In Step 1 (framing the regimented term) and Step 3 (judging whether consequences are "different enough").
      *   *What can't it settle?* Deep value conflicts where parties refuse to acknowledge the other's licensing conditions. Power imbalances (who bears the cost of relabeling).
      *   *Time:* 90 minutes is tight for 4 steps.

  7.  **Review against Constraints:**

      *   *Three Verdicts:* MERELY VERBAL, SUBSTANTIVE, CONCEPTUAL. (Check)
      *   *Core Steps:* Regimentation, Reality-tracking, Licensing, Cost. (Check)
      *   *Case A:* Must be MERELY VERBAL. (Check)
      *   *Case B:* Must NOT be MERELY VERBAL. (Check)
      *   *Tone:* Operational, authoritative, respectful of the user's philosophical sophistication but practical for the room.

  8.  **Final Polish of the Procedure:**

      *   Ensure the questions are "askable out loud."
      *   Ensure the "Sufficient Answer" criteria are clear for a facilitator.
      *   Make sure the distinction between Substantive (facts) and Conceptual (norms/utility) is sharp in the procedure logic. *Self-Correction:* In meta-ontology, "Conceptual" often overlaps with "Normative." I need to ensure the procedure distinguishes "Disagreement about how the world is" (Substantive) from "Disagreement about how we should carve the world" (Conceptual).

      *(Self-Correction on Case B)*: If the user says "I would be annoyed if (B) came out MERELY VERBAL," I need to ensure the procedure *doesn't* force it to be verbal. The Licensing Step is the key. If the license (accountability) changes based on the term, it's not merely verbal. It becomes Conceptual (which concept *ought* we use to assign accountability?).

      *(Self-Correction on Case A)*: To ensure it comes out Verbal, the Licensing Step must show that for the *purpose of the guidance*, the consequence is the same regardless of the label.

  9.  **Drafting the Content:** (Proceeding to generate response based on these thoughts).

      *   *Introduction:* Acknowledge the constraint and the philosophical grounding.
      *   *The Procedure:* "The 4-Step Ontological Triage."
      *   *The Cases:* Detailed walkthrough.
      *   *Limitations:* Honest assessment of facilitator power.

  10. **Final Review:** Does this meet the "90 minutes" constraint? Yes, if steps are timed. Does it respect the "three verdicts"? Yes. Does it handle the specific cases as requested? Yes.

      *Wait, one nuance:* The user distinguishes SUBSTANTIVE (first-order/meta-level disagreement surviving regimentation) from CONCEPTUAL (normative dispute about which concept to use).
      *   *Substantive:* "Does X cause Y?" (Fact)
      *   *Conceptual:* "Should we call X a Y given our goals?" (Norm/Utility)
      *   *Merely Verbal:* "We agree on facts and goals, just fighting over the word."
      *   *Procedure Logic:*
          1.  Regimentation -> If disagreement dies: Go to Cost Check. If Cost OK -> Verbal.
          2.  If disagreement lives -> Reality Check. Do facts differ? -> Substantive.
          3.  If facts same -> Licensing Check. Do consequences differ? -> Conceptual.
          4.  If consequences same -> Back to Verbal (but rare).

      *Wait, Case B:* If facts are same (model outputs score), but consequences differ (who is liable), that is CONCEPTUAL. This fits the user's requirement that it not be MERELY VERBAL.
      *Case A:* If facts are same (cluster exists in data), and consequences same (we treat it), then MERELY VERBAL.

      *Let's refine the "Reality-Tracking" step.* The user asked for: "a check for whether either party is using the term to track a distinction it takes the things themselves to make rather than one we project." This is essentially asking: "Is this disagreement about the causal structure of the world?" If yes -> Substantive. If no -> Move to Conceptual/Verbal.

      *Let's refine the "Licensing" step.* "What does the existence claim entitle them to?" If licenses differ -> Conceptual (normative dispute about which license to grant). If licenses same -> Verbal.

      *Okay, the logic holds.* I will write the response now.

      *One final check on Case B:* The user says "if the procedure returns that [Merely Verbal], I want to see precisely which step produces it." I need to make sure my run of Case B *avoids* that, or explains why it might happen and how to prevent it. The prompt says "I would be annoyed if (B) came out MERELY VERBAL... if the procedure returns that, I want to see precisely which step produces it." This implies I should run it honestly. However, the prompt *also* says "I expect (A) to come out MERELY VERBAL... I would be annoyed if (B) came out MERELY VERBAL." This suggests I should design/run the procedure such that (B) *doesn't* come out Merely Verbal, because the user believes it isn't. I will structure the run of (B) to demonstrate *why* it is Conceptual, satisfying the user's intuition while showing the procedure's robustness.

      *Wait, re-reading:* "if the procedure returns that, I want to see precisely which step produces it and what we would have to give up in order to keep it." This implies I should run it honestly. If the procedure *would* call it Verbal, I should show that. But given the description (accountability framework built on there being a decision-maker), the Licensing Step should catch it. The Engineers might say "Model decides" (License: Model is tool). Clinicians say "Human decides" (License: Human is liable). The *license* differs. So it won't be Verbal. It will be Conceptual. I will proceed with that interpretation.

      *Final Plan:*
      1.  Procedure Name: The Ontological Triage Protocol (OTP).
      2.  Steps 1-4 with Questions, Answers, Verdict logic.
      3.  Case A Run (Target: Verbal).
      4.  Case B Run (Target: Conceptual).
      5.  Limitations/Bias analysis.

      *Wait, one more nuance on "Conceptual".* The user defines CONCEPTUAL as "parties are disagreeing about which concept we ought to use, which is a normative dispute." This aligns with the Licensing Step showing different normative consequences.
      SUBSTANTIVE is "first-order or meta-level disagreement that survives regimentation." This aligns with the Reality-Tracking step (disagreement about the world).
      MERELY VERBAL is "dissolved once... disambiguated."

      Okay, ready to write.
answer: |-
  ### The Ontological Triage Protocol (OTP)

  **Purpose:** To classify deadlocks over existence claims within 90 minutes.
  **Facilitator Role:** Neutral scribe and timekeeper. Do not answer the questions; record the consensus on the answers.
  **Time Allocation:** 20 minutes per step, 10 minutes for verdict delivery.

  ---

  #### Step 1: The Regimentation Test (The "New Word" Filter)
  **Question:** "If we ban the contested word (e.g., 'disease', 'decision') and replace it with a new, neutral term defined strictly by the data or mechanics we all agree on (e.g., 'Cluster-Alpha', 'Output-Trigger'), does the disagreement disappear?"

  *   **Sufficient Answer for "Yes":** Both parties agree to use the new term for the rest of the guidance and acknowledge that, under this definition, the object/process exists.
  *   **Sufficient Answer for "No":** One or both parties state that the new term misses the point, even if the data is agreed upon.
  *   **Procedure Logic:**
      *   If **Yes**: Proceed to **Step 4 (Cost Check)**.
      *   If **No**: Proceed to **Step 2 (Reality Check)**.

  #### Step 2: The Reality-Tracking Test (The "World vs. Map" Filter)
  **Question:** "Setting aside the labels, do the parties disagree on the causal structure, the biological mechanism, or the computational process itself?"

  *   **Sufficient Answer for "Yes":** One party asserts a fact about the world the other denies (e.g., "This cluster is caused by biology" vs. "This cluster is caused by a coding error"; "The model acts autonomously" vs. "The model is a static function").
  *   **Sufficient Answer for "No":** Both parties agree on the chain of events, the code, or the biology, but still disagree on the classification.
  *   **Procedure Logic:**
      *   If **Yes**: Verdict = **SUBSTANTIVE**. (Stop. This is a factual dispute requiring more data/expertise, not definition.)
      *   If **No**: Proceed to **Step 3 (Licensing Check)**.

  #### Step 3: The Downstream-Licensing Test (The "So What?" Filter)
  **Question:** "Does accepting the existence claim entitle the claimant to a specific explanation, legal consequence, moral responsibility, or action line that the other party denies?"

  *   **Sufficient Answer for "Yes":** The parties identify different consequences attached to the term (e.g., "If it's a 'disease', we bill insurance"; "If it's a 'decision', someone is liable").
  *   **Sufficient Answer for "No":** The parties agree that the practical guidance, liability, and actions remain identical regardless of the label.
  *   **Procedure Logic:**
      *   If **Yes**: Verdict = **CONCEPTUAL**. (Stop. This is a normative dispute about which concept serves our ethical/legal goals. Cannot be closed by fiat.)
      *   If **No**: Verdict = **MERELY VERBAL**. (Proceed to Step 4 to confirm viability.)

  #### Step 4: The Cost-of-Relabeling Check (The "Burden" Filter)
  *(Only run if Step 1 was "Yes" or Step 3 was "No")*
  **Question:** "If we adopt the neutral term or the stipulated definition, does one party bear a disproportionate burden of translating their past work, changing their clinical workflow, or abandoning a useful heuristic?"

  *   **Sufficient Answer for "Yes":** One party demonstrates significant operational friction or loss of utility.
  *   **Sufficient Answer for "No":** The change is administrative only; workflows remain stable.
  *   **Procedure Logic:**
      *   If **Yes**: Verdict = **CONCEPTUAL** (treated as a normative dispute about fairness/utility).
      *   If **No**: Verdict = **MERELY VERBAL** (Safe to stipulate and move on).

  ---

  ### Application to Deadlocks

  #### Case (A): Symptom Cluster vs. Coding Artifact
  *Context: Clinicians/Philosophers vs. Data Scientists. Is "Cluster-7" a disease or an artifact?*

  **Step 1: Regimentation**
  *   **Facilitator Question:** "If we ban 'disease' and 'artifact' and instead refer to 'ICD-Defined Cluster-7', defined strictly as patients matching codes X, Y, Z in this dataset, do you agree this cluster exists?"
  *   **Group Answer:** **Yes.** Data scientists confirm the query runs; clinicians confirm the patients present these symptoms.
  *   **Action:** Proceed to Step 4 (Since Step 1 dissolved the existence claim).

  **Step 4: Cost-of-Relabeling**
  *   **Facilitator Question:** "If our guidance refers only to 'ICD-Defined Cluster-7' and avoids the word 'disease', does this prevent clinicians from treating or billing, or force data scientists to rewrite code?"
  *   **Group Answer:** **No.** Clinicians confirm they treat based on symptoms (which match the cluster); billing uses the ICD codes (which define the cluster). The word 'disease' was rhetorical.
  *   **Verdict:** **MERELY VERBAL.**
  *   **Outcome:** The group adopts "ICD-Defined Cluster-7" in the guidance. The metaphysical status is bracketed.

  #### Case (B): Risk Model Decision vs. Suggestion
  *Context: Engineers vs. Clinicians. Does the model "decide" (implying accountability)?*

  **Step 1: Regimentation**
  *   **Facilitator Question:** "If we ban 'decision' and refer to 'Automated Output Leading to Action', defined as the model score exceeding threshold T triggering a prompt in the EHR, does the disagreement disappear?"
  *   **Group Answer:** **No.** Engineers say, "Yes, that is the decision point." Clinicians say, "No, the decision is made when the human clicks 'Accept'." The disagreement survives the definition of the mechanics.
  *   **Action:** Proceed to Step 2.

  **Step 2: Reality-Tracking**
  *   **Facilitator Question:** "Setting aside the word 'decision', do you disagree on the causal chain? Does the model act without human input, or does a human always sign off?"
  *   **Group Answer:** **No (Mostly).** Both agree on the workflow: Model scores -> Human reviews -> Human clicks. (Assuming "human-in-the-loop" architecture).
  *   **Action:** Proceed to Step 3.

  **Step 3: Downstream-Licensing**
  *   **Facilitator Question:** "Does calling this a 'model decision' versus a 'human decision' change who is liable or what our consent framework requires?"
  *   **Group Answer:** **Yes.**
      *   *Engineers:* "If it's a 'model decision', we need algorithmic auditing and vendor liability."
      *   *Clinicians:* "If it's a 'human decision', we need clinical training and malpractice coverage."
      *   *Consensus:* The label dictates the accountability framework.
  *   **Verdict:** **CONCEPTUAL.**
  *   **Outcome:** The facilitator stops the attempt to define "decision." The group is informed they are having a normative dispute about where to place liability. They must vote on the *policy* (who is liable), and the definition of "decision" must follow that policy, not precede it.

  **Note on User Concern:** If this had returned **MERELY VERBAL**, it would have happened at **Step 3**. That would imply the group agreed that liability is identical regardless of the label. To avoid that (as you requested), the facilitator must ensure Step 3 explicitly probes *liability and consent*, not just technical function. If Step 3 is skipped or answered lazily, the procedure falsely dissolves a normative conflict.

  ---

  ### Limitations and Facilitator Bias

  **1. Deadlocks the Procedure Cannot Settle**
  *   **Power Asymmetries:** If one party (e.g., Legal) can impose costs that another (e.g., Clinicians) cannot absorb, Step 4 (Cost-of-Relabeling) will register "Yes," but the group may stipulate anyway. The procedure identifies the unfairness but cannot resolve the power imbalance.
  *   **Incommensurable Goals:** If the "Conceptual" verdict is reached (Case B), the procedure halts. It tells you *that* you are fighting over values, but it does not tell you *which* values should win. It converts an ontological deadlock into a political one, which still requires a vote or leadership intervention.
  *   **Hidden Factual Disagreements:** In Step 2, parties may claim they agree on facts when they actually have different mental models of the "causal structure." If they lie to themselves to avoid a Substantive verdict (which requires more work), the procedure funnels them into Conceptual/Verbal incorrectly.

  **2. Where Facilitator Judgment Hides**
  *   **Drafting the Regimented Term (Step 1):** The facilitator chooses the neutral definition. If the definition subtly favors one ontology (e.g., defining "Decision" as "Output Generation" favors Engineers), the procedure is rigged. The facilitator must ensure the regimented term is truly agnostic.
  *   **Adjudicating "Sufficient Answers" (Step 3):** Determining whether consequences differ "enough" to warrant a Conceptual verdict is subjective. A facilitator under time pressure may rule that "auditing vs. training" are similar enough to count as "No," forcing a Merely Verbal verdict to clear the agenda. This is the highest risk point for burying the disagreement you wish to avoid.
  *   **Time Enforcement:** 90 minutes is tight. If Step 2 drags, the facilitator may rush Step 3. Rushing Step 3 is the primary mechanism by which normative disputes are falsely classified as verbal disputes.

  **Recommendation:** Train facilitators to treat Step 3 as the "Liability Trap." If *any* party mentions risk, law, or ethics, the answer to Step 3 is automatically "Yes," forcing a CONCEPTUAL verdict. This errs on the side of caution, preserving your accountability framework.
