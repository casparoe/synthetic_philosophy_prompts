          *   Must identify the implicit rule(s) governing the precedents.
          *   Must propose alternative rules that fit the precedents equally well.
          *   Must analyse the "closest analog" tension (Case 3/6 vs. Case 4).
          *   Must articulate the underlying principles at stake (Hand vs. Design vs. Viewer Experience vs. Historical Impact vs. Deception).
          *   Must evaluate the user's proposed hypothetical variants (and potentially suggest a better one) to stress-test the rules.
      *   **Tone:** Professional, analytical, clear-headed, suitable for a committee member preparing their argument.

  2.  **Deconstruct the Precedents (The Museum's "Case Law"):**
      *   *Case 1 (19thC Copy):* Keep, low value, labelled "after". *Principle:* Historical copy has value as a copy; honesty in labelling.
      *   *Case 2 (Roman Copy):* Star object, full value, labelled as copy. *Principle:* Age/rarity/cultural significance can outweigh "originality"; a copy *is* the object of value if the original is lost.
      *   *Case 3 (Dutch Workshop):* Relabelled "workshop of", kept, value halved. *Principle:* Proximity to master matters; pupil execution + master design = reduced but significant value.
      *   *Case 4 (Forged Dutch):* Deaccessioned, not shown even as forgery. *Principle:* Intentional deception/zero connection to the named artist = toxic. No redeeming historical value *as art* (though arguably has value as a cautionary tale, they rejected that).
      *   *Case 5 (Posthumous):* Mould cast (1/10 value) vs. Instruction piece (full value). *Principle:* Artist's authorisation/intent trumps physical execution. If the artist authorised it (even posthumously via instructions), it counts.
      *   *Case 6 (Studio Assistant):* Relabelled "conceived/signed X, executed Y", kept, value cut 1/3. *Principle:* Transparency about execution vs. conception. If the arrangement was open/acknowledged (even if commercially shady), it retains status as a "X work" with caveats.

  3.  **Analyse the New Case (Rees/Nadel):**
      *   *Facts:* 1954 abstraction. Rees name, Nadel hand. Rees signed, exhibited, claimed it. Nadel was a trained painter (partner), not a anonymous hand. Rees diaries admit it (confession/shrug). No Rees hand on surface. Cartoon is Rees.
      *   *Impact:* Iconic image, influenced the movement.
      *   *Stakeholders:* Donor family (threaten return), Retrospective (need label).
      *   *Tension:* Is it a Case 3/6 (Workshop/Assistant -> Relabel & Keep) or Case 4 (Forgery/Deception -> Deaccession)?
      *   *Key Difference from 6:* Case 6 was an *open* arrangement (known in studio). Case Rees/Nadel was a *secret* (until diaries found), actively concealed by Rees in letters/exhibitions.
      *   *Key Difference from 4:* Case 4 was a 20th-century forger with *no connection*. Nadel is the partner, the executor, a trained painter, and the work is historically significant.
      *   *Key Difference from 5:* Case 5 had estate/foundation supervision. Rees is dead, Nadel is dead, no foundation authorising the "Nadel" status retroactively.

  4.  **Predict the Committee's Decision:**
      *   *Museums are conservative.* They hate deaccessioning iconic works unless proven dangerous/fake.
      *   *They hate lawsuits.* Donor family is threatening legal action.
      *   *They love "Star Objects".* This is their most reproduced image.
      *   *Prediction:* They will try to split the difference. Keep it, but downgrade the attribution slightly without destroying the "Rees" brand entirely, and adjust value to manage the donor threat.
      *   *Catalogue:* "Rees (executed by Nadel)" or "Rees/Nadel". Unlikely to drop Rees entirely.
      *   *Display:* Stays on wall. Too important to hide.
      *   *Insurance:* Significant cut, but not to "Nadel" mid-range levels. Maybe 50-60% of top Rees.

  5.  **Determine Consistency & Implicit Rules:**
      *   *Implicit Rule:* "Provenance of Design + Artist Sanction = Attribution." (Fits 2, 3, 5, 6).
      *   *Alternative Rule A:* "Physical Execution = Attribution." (Fits 1, 4, but contradicts 2, 5, 6).
      *   *Alternative Rule B:* "Historical Impact/Reception = Attribution." (Fits 2, Rees case. Contradicts 4).
      *   *Alternative Rule C:* "Honesty/Transparency at Time of Creation." (Fits 4, 6. Contradicts Rees case where Rees lied).

      *   *The Conflict:* The Rees case fails the "Honesty" test (Case 6 was open; Rees lied). It passes the "Design" test (Case 3/5). It passes the "Impact" test (Case 2).
      *   *The "Forgery" Question:* Is it a forgery? Rees signed it. It's not a stranger pretending to be Rees (Case 4). It's the inner circle. It leans closer to Case 6 (Assistant) but with more deception.

  6.  **Develop the Principles:**
      *   *Hand:* Physical touch (Nadel).
      *   *Design/Intellect:* The cartoon (Rees).
      *   *Sanction:* The signature/exhibition (Rees).
      *   *Reception:* The art historical impact (The Public).
      *   *Integrity:* Not lying to the public (The Museum's Ethics).

  7.  **Evaluate the Hypothetical Variants:**
      *   *Variant 1 (Nadel unknown):* Makes it look more like Case 6 (Assistant). If she's unknown, the "Nadel" brand has no value. The museum would likely stick to Rees with a footnote.
      *   *Variant 2 (Fame after reattribution):* Removes the "Historical Impact" justification. If it wasn't influential *as a Rees*, does it matter? Makes it easier to deaccession or reattribute fully to Nadel.
      *   *Variant 3 (Rees credited her in 1954):* This is the killer. If he credited her, it becomes Case 6 (Open arrangement). The deception element vanishes.
      *   *Better Variant:* What if Nadel *objected* at the time? Or what if Rees painted over her work?
      *   *Selection:* The user's Variant 3 (Credit in catalogue) is the strongest stress test for the "Deception" principle. However, I need to check if there's a better one. Actually, the user asked me to choose *their* candidates or suggest another. Variant 3 is very strong because it aligns it perfectly with Case 6. Variant 1 tests the "Value of the Executor" principle. Variant 2 tests the "Reception" principle.
      *   *Decision:* I will argue that Variant 3 (Credit in 1954) does the most work because it isolates the variable of *Deception*, which is the main thing separating Case 6 from Case 4.

  8.  **Drafting the Response (incorporating British English & Tone):**
      *   *Opening:* Acknowledge the difficulty.
      *   *Prediction:* Be realistic about institutional self-preservation.
      *   *Consistency Check:* Map the precedents.
      *   *The Rules:* Define the competing frameworks.
      *   *The Variants:* Analyse the user's suggestions.
      *   *Closing:* A summary thought on the ethical weight.

      *(Self-Correction during drafting)*: Watch out for American spellings (color vs colour, labeled vs labelled). Ensure the tone isn't too academic but remains rigorous. The user said "don't point me at any reading... just for the reasoning." Keep it practical.

      *Refining the Prediction:* The donor threat is significant. If they deaccession, they lose the object. If they call it a Nadel, they lose the object (gift fails). They *must* keep "Rees" in the name to keep the legal title, but they can qualify it.
      *Refining the Rule:* The museum seems to operate on "Authorised Design" > "Physical Hand" (Cases 2, 3, 5, 6). The outlier is Case 4 (Forgery). The Rees case is only a "Forgery" if Rees's sanction doesn't count because it was deceptive. But Case 6 had deception (selling assistant's work as own), yet they kept it as "Conceived by X". So Rees's deception might not be fatal if the "Design" link is strong.

      *Wait, Case 6 nuance:* Case 6 was "openly acknowledged in the studio". Rees/Nadel was "never corrected anyone". This is the crux. Case 6 was a known studio practice (like Warhol). Rees/Nadel was a private lie.
      *Does the museum care about public deception or studio practice?* Case 4 suggests they care about deception. But Case 4 was a *criminal* forger. Rees is the *named artist*.
      *Conclusion:* They will treat it as Case 6 (Studio practice) rather than Case 4 (Forgery) to save the object.

      *Refining the Variant:* The user's Variant 3 (Rees credited her) makes it Case 6 exactly. Variant 1 (Nadel unknown) makes the valuation argument harder (can't insure as Nadel). Variant 2 (Fame later) undermines the "Historical Impact" argument. I think Variant 3 is indeed the strongest because it removes the moral hazard of the lie. I will support that choice.

  9.  **Final Polish:** Check British spelling (catalogue, labelled, programme, honour, etc.). Ensure no citations. Ensure all parts of the prompt are addressed.

