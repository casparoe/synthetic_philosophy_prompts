answer: |-
  Here is the reasoning you need to walk into that room with your head clear.

  ### Part 1: The Prediction
  Based on the institutional behaviour evidenced in your six precedents, here is what your committee will likely do on Thursday. Museums of this size are generally risk-averse regarding legal title and public reputation, but deeply protective of their "star" objects.

  1.  **Catalogue Attribution:** They will not drop "Rees". To do so invites the donor's lawyers to reclaim the gift. They will not keep it as simply "Rees", because the technical evidence and diaries make that indefensible. They will adopt a compound attribution, likely **"Rees (executed by Nadel)"** or **"Rees/Nadel"**. This mirrors Case 6 ("Conceived by X, executed by Y"). It preserves the legal fiction that it is a Rees gift while acknowledging the physical reality.
  2.  **Display:** It stays on the wall. Case 4 is the only precedent for removal, and that involved a forger with *no* connection to the master. Here, the design is Rees's (the cartoon), and the historical impact is tied to the name "Rees". Removing it would admit a level of deception the museum will try to manage via labelling rather than censorship. They will likely add a wall text explaining the provenance, turning the deception into a "narrative of discovery".
  3.  **Insurance Figure:** This will be the most contentious. They cannot value it at full Rees (Case 5 posthumous moulds are worth less; Case 3 workshop pieces are worth less). They cannot value it at full Nadel (the market doesn't support that yet, and it undermines the "Rees" attribution). Expect a compromise: **40–60% of a top-tier Rees**. This acknowledges the loss of the "autograph hand" while capitalising on the "Rees brand" and the work's iconic status.

  ### Part 2: Consistency and Implicit Rules
  You asked which rule you are implicitly running. Looking at your six precedents, your museum does not operate on a strict "hand-based" theory of authorship. If you did, Case 2 (Roman copy) and Case 5 (instruction piece) would be deaccessioned or valued as decorative arts.

  **The Implicit Rule:** *Authorised Design plus Sanction equals Attribution.*
  So long as the named artist provided the intellectual framework (the cartoon, the mould, the instructions) and sanctioned the object (signed it, authorised the cast, ran the workshop), the museum accepts the attribution, adjusting value based on the proximity of the physical hand.

  **Two Alternative Rules that fit your precedents equally well:**

  1.  **The Reception Rule:** *Value is determined by what the object has done in the world.*
      *   Fits Case 2 (Star object despite being a copy).
      *   Fits Case 4 (Rejected because its reception was as a fake, not as art).
      *   Fits the Rees case (It changed the movement; therefore it is significant regardless of who held the brush).
      *   *Conflict:* It struggles with Case 1 (why keep a generic 19th-century copy?) unless that copy has its own reception history you haven't listed.

  2.  **The Transparency Rule:** *Attribution holds only if the production method was not actively concealed from the contemporary audience.*
      *   Fits Case 6 (Openly acknowledged in the studio).
      *   Fits Case 4 (Deception exposed).
      *   Fits Case 1 & 2 (Labelled "after" or "copy" from the start).
      *   *Conflict:* It creates a major problem for the Rees case. Rees *did* conceal it. He wrote letters claiming it as his own. Under this rule, the Rees painting is closer to Case 4 (Forgery) than Case 6 (Studio Assistant).

  ### Part 3: The Analog Tension (3/6 vs 4)
  You are correct that the closest analog is up for grabs. Here is what turns on which one you pick.

  **If you choose Case 3/6 (Workshop/Assistant):**
  You are prioritising the **Design**. Rees made the cartoon; Nadel was the "hand". In this view, Rees is the architect, Nadel is the builder. The deception is regrettable but secondary to the intellectual genesis.
  *   *Outcome:* You keep the Rees name prominently. You treat the diary entry as a technical footnote. You avoid a legal battle with the donors.
  *   *Risk:* You become complicit in Rees's lie. Case 6 was an open studio practice; Rees's behaviour was a private falsehood. Equating the two dilutes the meaning of "signature".

  **If you choose Case 4 (Forgery):**
  You are prioritising **Integrity**. Rees passed off another's labour as his own without consent (Nadel's career was separate) and deceived the public. The "Rees" name on the canvas is a lie.
  *   *Outcome:* You must reattribute to Nadel. If the gift deed specifies "a painting by Rees", you may lose the object entirely. The retrospective cannot borrow it as a Rees.
  *   *Risk:* You remove a pivotal work of art history from the public view because of a moral technicality. You set a precedent that might destabilise other modernist works where studio assistance was common but poorly documented.

  **The Deciding Factor:**
  The distinction lies in **Nadel's agency**. In Case 4, the forger was a criminal outsider. In Case 6, the assistant was a paid employee under contract. Nadel is neither. She is a partner. If the committee views her as a collaborator whose credit was stolen, Case 4 is the moral match. If they view her as a de facto studio assistant (despite the relationship), Case 6 is the procedural match. Given the museum's tendency to keep objects on the wall (5 out of 6 precedents keep the object), they will likely force the Case 6 interpretation to avoid the Case 4 outcome.

  ### Part 4: The Principles at Stake
  If your precedents do not settle it (and they don't, because the deception element is unique), you are choosing between these principles:

  1.  **The Hand:** The value is in the physical trace of the artist. (Points to Nadel).
  2.  **The Design:** The value is in the intellectual conception. (Points to Rees).
  3.  **The Reception:** The value is in the work's historical effect. (Points to Rees, as it influenced others *as a Rees*).
  4.  **The Integrity:** The value is in the museum not validating a lie. (Points to Nadel or Deaccession).

  By keeping it as "Rees (executed by Nadel)", you are privileging **Design and Reception** over **Hand and Integrity**. You are saying that the art historical impact of the image outweighs the moral hazard of the signature.

  ### Part 5: The Hypothetical Variant
  You offered three variants. Here is how they test the rules:

  1.  *Nadel is an unknown studio hand:* This tests the **Reception/Market** principle. If Nadel has no market, insuring it as "Nadel" is impossible. The museum would be forced to keep "Rees" for financial reasons, revealing that their attribution is economically driven.
  2.  *Fame only after reattribution:* This tests the **Reception** principle. If the painting wasn't influential *as a Rees*, does the deception matter less? It weakens the argument for keeping it as a Rees star object.
  3.  *Rees credited her in the 1954 catalogue:* This tests the **Transparency/Integrity** principle.

  **The Winner:**
  The third variant (**Rees credited her in the 1954 catalogue**) does the most work.

  **Why:**
  It isolates the variable of **Deception**.
  *   If Rees credited her, the Case 6 precedent ("openly acknowledged") becomes a perfect match. The committee would unanimously vote to keep it as "Rees/Nadel" with a value cut, feeling morally clean.
  *   Because he *didn't* credit her, you are stuck in the grey zone between Case 6 and Case 4.
  *   If you rule that the painting stays attributed to Rees *despite* the lack of credit in 1954, you are explicitly establishing a new rule: **Intellectual Genesis trumps Contemporary Honesty.** You are saying that so long as the design is the master's, the museum will forgive the master's lies to preserve the art historical record.

  If you want to challenge the committee on Thursday, do not argue about the paint or the diary. Argue about the 1954 catalogue. Ask them: *"If Rees had credited Nadel in 1954, we would all agree this is a joint work or a Case 6 workshop piece. Since he lied, does that lie invalidate the gift, or do we value the Design enough to forgive the Deception? If we forgive it here, what level of deception would finally trigger Case 4?"*

  That is the principle you are actually voting on.
