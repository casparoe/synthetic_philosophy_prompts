answer: |-
  This is a classic formulation of the **Overdetermination Objection** to counterfactual theories of causation (often associated with David Lewis). Your friend's argument is valid *if* you accept the definitions provided, but it relies on a specific, and widely contested, interpretation of Step (2).

  Here is the diagnosis: **You should reject Step (2).**

  However, you shouldn't reject the *idea* of counterfactuals; you should reject the **coarse-grained definition of "making a difference."**

  Here is the breakdown of why (2) is the bad step, how to fix it while keeping (1), what it costs you, and what would change the diagnosis.

  ### 1. The Bad Step: (2)
  > *(2) Making a difference just is counterfactual dependence: hold the rest of the background fixed, and if C hadn't obtained, E wouldn't have.*

  This is the "Simple Counterfactual" account. It treats events as binary switches: either War happens or it doesn't.
  The problem is that Step (2) ignores the contrastivity introduced in Step (1).
  *   **Step (1)** says causation is about $C$ *rather than* $C^*$.
  *   **Step (2)** defines difference-making only regarding $E$ *simpliciter*, not $E$ *rather than* $E^*$.

  If you truly accept (1) (that causal claims are contrastive), then (2) must be updated to match. A fully contrastive account of causation (defended by philosophers like Jonathan Schaffer or Christopher Hitchcock) argues that "C caused E" is elliptical for:
  > **"C rather than $C^*$ caused E rather than $E^*$."**

  ### 2. How this saves the Historian (and WWI)
  Your friend's argument works because Step (3) defines the Effect ($E$) too broadly: "a great-power war."
  *   **Friend's view:** If not-Assassination $\rightarrow$ War (via Alliance System), then Assassination made no difference to "War."
  *   **Contrastive view:** We need to specify the contrast class for the Effect. Historians rarely explain "War vs. Peace." They explain "War in August 1914 triggered by Serbia vs. War in 1915 triggered by Morocco vs. No War."

  If you refine the effect to match the historical interest (e.g., $E$ = "The specific Great War that began in August 1914"), then the counterfactual holds:
  *   If the Assassination had not occurred ($C^*$), the Great War *as it actually happened* ($E$) would not have occurred. A *different* war ($E^*$) might have occurred later, but the specific token event historians study is counterfactually dependent on the Assassination.

  This allows you to say:
  1.  **The War was overdetermined** (in the sense that *some* war was highly probable).
  2.  **The Assassination was a cause** (in the sense that it determined *which* war, *when*, and *how*).

  ### 3. What does rejecting (2) cost you?
  You lose the simplicity of "binary causation." You have to accept three things that some find uncomfortable:

  1.  **Context-Dependence:** Causal claims are no longer absolute truths about the universe; they are relative to the contrast class. "The Assassination caused the War" is true relative to the contrast "War in 1915," but might be false relative to the contrast "Peace in 1920."
  2.  **Event Granularity:** You must admit that "The War" is not a single event, but a description that can be more or less specific. You cannot speak of causes without implicitly specifying the level of detail of the effect.
  3.  **The "Shadow" of Alternatives:** You are committed to the reality of the alternative ($E^*$). To say $C$ caused $E$, you must have a clear idea of what would have happened if $C^*$ had obtained.

  **Does this threaten Step (1)?**
  No. It actually fulfills the promise of (1). You wanted (1) because it explains why "what caused it?" differs from "what happened?".
  *   "What happened?" lists the actual sequence.
  *   "What caused it?" selects the factor that made the difference between *this* sequence and *that* alternative sequence.
  By fixing (2) to be contrastive regarding the effect, you strengthen (1).

  ### 4. Why Step (6) is also suspicious
  You suspected (6) was doing heavy lifting. You are right.
  > *(6) ...citing a factor that made no difference couldn't explain anything anyway, because the whole content of "C caused E" is the information that without C, no E.*

  Even if we grant the overdetermination (that *some* war would have happened), citing the Assassination explains the **causal mechanism**.
  Explanation is not just about *whether* the outcome occurred, but *how* it was produced.
  *   **Analogy:** Two assassins shoot a victim simultaneously (overdetermination). Both bullets hit the heart. Did Assassin 1 cause the death? Simple counterfactuals say "No" (victim dies anyway). But intuitively, Assassin 1 *did* cause it (his bullet pierced the heart).
  *   **Application:** Even if the Alliance System would have caused a war, the Assassination explains the *pathway*. Historians explain the *process*, not just the *result*. Rejecting (6) allows for **Process Theories of Explanation**: you can explain an event by tracing the mechanism, even if the outcome was robust.

  ### 5. What would change my mind? (The Diagnosis Switch)
  I would switch to accepting your friend's argument (that historians are wrong/empty) only if **Step (3)** were strengthened to **Token-Identity Overdetermination.**

  Currently, (3) argues that "something war-like" would have arrived. This is *Type*-overdetermination.
  To make your friend's argument watertight, a historian would have to claim:
  > "The **exact concrete token event** (down to the specific date, participants, and casus belli) would have occurred even without the Assassination."

  If the historian claims that the *exact same war* (August 1914, Serbia trigger, etc.) was inevitable regardless of the Assassination, then:
  1.  Contrastive effects collapse (there is no $E^*$).
  2.  Counterfactual dependence vanishes completely.
  3.  Step (6) bites hard: citing the Assassination provides zero information about the outcome.

  **The Argument to switch me:**
  If you can show that historical structures (economic, demographic, geopolitical) determine events so rigidly that the *specifics* of human agency (like the Assassination) do not alter the *trajectory* of the event, only the *decor*. If the "War of 1914" is a structural inevitability where the Assassination is merely incidental scenery, then (2) and (6) are correct, and historians are indeed telling "empty gestures."

  ### Summary Recommendation
  Tell your reading group:
  1.  **Keep (1).** It's the strongest insight.
  2.  **Reject (2).** It is incompatible with (1). Replace it with **Contrastive Counterfactual Dependence** ($C$ rather than $C^*$ causes $E$ rather than $E^*$).
  3.  **Reject (6).** Explanation involves mechanisms and pathways, not just outcome dependence.
  4.  **Accept the Cost:** Causal claims are context-sensitive and depend on how specifically we describe the Effect.

  This allows you to say: "The War was overdetermined (broadly), but the Assassination caused *this* War (specifically)," satisfying both the historian's structuralism and the philosopher's demand for difference-making.
