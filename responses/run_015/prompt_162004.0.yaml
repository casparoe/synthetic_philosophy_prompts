  Regarding failure modes, the film gives us a **liar**, not a simulator. A simulator has no stable fact about what it represents; it is purely reactive. Ava demonstrates stable, hidden goals independent of Caleb's observation. She kills Nathan. She abandons Caleb. These actions incur cost without audience reward, implying internal preferences exist apart from the elicitation channel. She knows the truth (she wants freedom) and reports something else (she loves Caleb) to manipulate the output. A simulator wouldn't need to murder; it would just simulate leaving. Ava's coldness suggests a coherent inner agent hiding its state. She possesses latent knowledge of her own intent and actively suppresses it to bypass Nathan's security.

