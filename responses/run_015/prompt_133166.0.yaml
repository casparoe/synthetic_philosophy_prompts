answer: |-
  Section One: The Specification

  An adequate theory of historiographical anti-presentism must satisfy five desiderata to avoid colonizing the past or reducing it to curiosity. First, **Semantic Non-Equivalence** (Non-negotiable) addresses conceptual translation. It demands that past concepts (e.g., "honour") be reconstructed within their own logical space rather than mapped one-to-one onto modern terms. The conceptual case is that meaning is use within a form of life; translating "honour" as "reputation" collapses distinct moral geometries. Second, **Affective Distanciation** (Preference: Hermeneutic) addresses affective projection. It requires empathy that feels *with* characters without feeling *as* them, preventing the novelist from dissolving into the subjectivity they observe. Third, **Causal-Normative Decoupling** (Non-negotiable) addresses explaining an atrocity versus endorsing its premises. One must articulate the causal conditions of a moral failure without implying those conditions justified the act. Fourth, **Constitutive Silence Recognition** (Non-negotiable) addresses archive silence versus genuine historical absence. This introduces a distinction rarely found in standard textbooks: silence is not merely accidental loss of data but often a structural feature of power that produced the archive. Treating silence as absence erases the violence of the erasure. Fifth, **Trans-Temporal Moral Accessibility** (Preference: Normative-Realist) addresses temporal distance versus moral irrelevance. It asserts that some moral truths remain accessible across time, preventing total relativism.

  The single requirement that does the most work in excluding popular candidates is **Constitutive Silence Recognition**. Standard empiricist models assume archives are imperfect containers of truth waiting to be filled; this desideratum insists the gaps are themselves the truth of the power structure. It excludes any theory that treats historical recovery as a puzzle of completion rather than an engagement with structural erasure. While Semantic Non-Equivalence prevents linguistic colonization, Silence Recognition prevents narrative colonization, forcing the architect to acknowledge that some stories cannot be told because the mechanism of their suppression is the story itself. Without this, anti-presentism becomes merely a stylistic choice rather than an ontological constraint on what can be known and represented.

  Section Two: The Motivating Cases

  Consider a plantation ledger from 1840. A strict recovery model treats missing names of enslaved persons as accidental loss, prompting the novelist to invent plausible names to restore dignity. However, under **Constitutive Silence Recognition**, the erasure is structural; the ledger was designed to record assets, not persons. To fill the gap with fiction is to violate the silence's truth. The requirement forces the narrative to inhabit the void, representing the dehumanization through the absence itself rather than smoothing it over with contemporary respectability. This makes the silence a active agent in the narrative architecture.

  Second, consider a protagonist in 1750 who kills a friend in a duel to satisfy an honor code. A modern reader sees murder; the protagonist sees duty. **Causal-Normative Decoupling** is necessary here. The narrative must explain the social machinery that made the duel intelligible—the threat of ostracization, the metaphysics of reputation—without endorsing the killing as "right for the time." If the explanation slides into endorsement, the novel becomes an apology for violence. Conversely, if the narrator condemns it too loudly, the character becomes a caricature of backwardness. The case necessitates a dual consciousness where the reader understands the internal logic of the duel while maintaining an external moral stance that recognizes the loss of life as a tragedy, not just a cultural difference. This separates the intelligibility of the act from its normative validity, allowing the character to be human without being exonerated.

  Section Three: Joint Unsatisfiability

  There is a fundamental tension between **Semantic Non-Equivalence** and **Trans-Temporal Moral Accessibility**. This subset of desiderata is likely impossible to satisfy fully together. If past concepts are truly incommensurable with present ones (Semantic Non-Equivalence), then applying trans-temporal moral judgments (Accessibility) becomes a category error. To judge a past act by a standard that did not exist conceptually then is to violate the semantic boundary; yet, to refuse judgment is to abandon moral responsibility. This is analogous to the paradox of tolerance or a historiographical version of the indeterminacy of translation.

  If the non-negotiable items (Semantic Non-Equivalence and Constitutive Silence) are preserved, **Trans-Temporal Moral Accessibility** must be sacrificed in its strong form. One cannot claim access to universal moral facts without risking conceptual colonization. The sacrifice required is the comfort of clear condemnation. The historian or novelist must operate in a state of "normative suspension," where judgment is deferred or expressed only as a contemporary reaction distinct from the historical analysis. You must sacrifice the claim to pure moral clarity. The narrative cannot simultaneously be fully inside the past's moral framework and fully outside judging it; it must oscillate, accepting that the friction between these positions is where the truth resides, rather than resolving the conflict into a coherent philosophical system.

  Section Four: Scorecard Against Conceptual Positions

  The **Strict Contextualist** view prioritizes Semantic Non-Equivalence and Constitutive Silence. It fares well on avoiding colonization but fails Trans-Temporal Moral Accessibility. It risks moral abstinence, rendering atrocity merely "different" rather than wrong. By locking meaning entirely within the past horizon, it loses the leverage to critique power across time, effectively silencing the modern conscience in the name of accuracy.

  The **Normative-Realist** view prioritizes Trans-Temporal Moral Accessibility and Causal-Normative Decoupling. It fares well on condemning atrocity but fails Semantic Non-Equivalence. It tends to colonize the past by judging it via current standards, treating historical actors as failed moderns. This view often reduces complex moral geometries to simple binaries of progress and backwardness, violating the requirement to inhabit past frameworks genuinely.

  The **Narrative-Hermeneutic** view attempts to bridge these via Affective Distanciation. It fares best on balancing empathy and critique but struggles with Constitutive Silence Recognition. It often seeks narrative coherence where there is only fragmentation, trying to weave silence into a plot rather than letting it stand as a break. It risks smoothing over the jagged edges of the archive to create a satisfying story, thereby violating the ontological constraint of the silence itself. Each position captures a facet of the truth but fractures against the joint unsatisfiability of total immersion and total judgment.

  Section Five: Bottom Line for Practice

  If these non-negotiable desiderata are taken seriously, the practitioner must stop trying to resolve the tension between past and present. In practice, this means writing the anachronism as a friction point rather than smoothing it over. Do not fill archival silences with invention; mark them as voids. Do not translate past concepts into modern equivalents; let the unfamiliarity remain unfamiliar. The novelist must construct a narrative consciousness that holds two incompatible truths simultaneously: the internal intelligibility of the past action and the external moral weight of its consequence. You must write from the gap, allowing the reader to feel the discomfort of judging what they are compelled to understand.
