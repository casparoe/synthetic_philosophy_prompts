  3.  **Refine and Restructure the Requirements (Cut, Merge, Add):**
      *   *Merge:* (2) and (4) overlap on manipulation/judge modeling. (3) and (7) overlap on grounding/bootstrapping. (1) and (6) overlap on the nature of truth/defense.
      *   *Add:* Need explicit mention of *transparency/auditability* of the debate transcript for the humans (even if they can't check the claim, they need to check the protocol). Need a requirement on *compute/cost* (scalability implies efficiency). Need a requirement on *gradient hacking* (since this is for training).
