      *Refining the "Preference" distinction:*
      *   *Preference:* "Judge must be a model" (User set this, but technically a human-in-the-loop on base cases might be needed for adequacy). Let's stick to the user's constraint but flag the risk.
      *   *Preference:* "Debate format" (could be consultancy).
      *   *Adequacy:* "Verdict must correlate with truth."
      *   *Adequacy:* "Training signal must not degrade alignment."

      *Refining the Trade-off:* The big one is **Optimization Pressure**. If you train on the debate winner, you train the models to win debates, not tell truths. This is the "Inner Alignment" problem specific to debate.

      *Refining the "Single Requirement":* It's the **Grounding Condition** (Req 3 in user's list). If you can't bottom out to something the judge can verify, the debate is just hallucination vs. hallucination. This rules out most "vibe check" debate protocols.

      *Wait, re-reading the prompt:* "Close by naming the single requirement that does the most work in ruling out the protocols people actually propose."
      Actually, looking at current proposals, most fail on **Incentive Compatibility under Training** (Req 5). People propose debate for *inference*, but using it for *training* (RL) breaks it because the models optimize for the judge's flaws. I will select Req 5 (Training Safety) as the killer constraint. Or perhaps Req 1 (Defensibility). Let's go with Req 1 (Defensibility/Truth-Wins) because if Truth doesn't win, nothing else matters. But Req 5 is what kills the *deployment* for training. The prompt asks about the protocol for *that purpose* (training signal). So Req 5 is the killer.

