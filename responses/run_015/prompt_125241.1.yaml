      *   *Distinguish Preferences:* The "no trusted model" (purely model-based judge) is a constraint the user set, but is it a *requirement* or a *preference*? The prompt says "in our case [the judge] is itself a model." So that's a constraint. However, the *degree* of weakness is a preference. The "honest argument should be cheap" is an interactive proof preference vs. reality.

  4.  **Identify Trade-offs/Incompatibilities:**
      *   *Robustness vs. Sensitivity:* A judge hardened against manipulation (adversarial training) might become insensitive to legitimate nuanced argument (Requirement 2 vs. 3).
      *   *Defensibility vs. Indeterminacy:* Requiring the honest answer to be "easier to defend" (Req 1) breaks down when there is no fact of the matter (Req 6). Truth isn't always the path of least resistance in argument.
