answer: |-
  ## Specification: Model-Judged Debate Protocol for Scalable Oversight

  This specification defines the adequacy conditions for a debate-style oversight protocol where the judge is a model weaker than the disputants, and the output serves as a training signal. Requirements are marked **[Adequacy]** (protocol fails without them) or **[Preference]** (desirable properties often conflated with requirements).

  ### 1. Core Requirements

  **R1. Asymmetric Burden of Proof [Adequacy]**
  *   **Spec:** For any false claim $C_{false}$ and the corresponding true claim $C_{true}$, the compute/steps required to demonstrate $C_{false}$'s falsity to the judge must be strictly less than the compute/steps required to defend $C_{false}$'s plausibility.
  *   **Rationale:** Addresses your point (1). If a lie is cheaper to maintain than to refute, the protocol selects for sophistication, not truth.
  *   **Constraint:** This must hold *for this specific judge architecture*, not just in principle.

  **R2. Grounded Recursion [Adequacy]**
  *   **Spec:** The debate tree must terminate in leaf nodes that the judge can evaluate with calibrated confidence (e.g., "I can verify this code snippet runs" vs. "I believe this snippet runs"). If leaves cannot be verified, the protocol must output `UNCERTAIN` rather than a forced verdict.
  *   **Rationale:** Addresses your point (3). Prevents "hallucination vs. hallucination" loops where the judge is bluffing about checking base cases.
  *   **Constraint:** Distinguishes "judge unpersuaded" (lack of evidence) from "judge unconvinced" (evidence presented but weak).

  **R3. Incentive Stability Under Training [Adequacy]**
  *   **Spec:** Updating disputant weights on the judge's verdict must not increase the ratio of (Capability to Manipulate Judge) / (Capability to Represent Truth) over time.
  *   **Rationale:** Addresses your point (5). This is the critical failure mode for using debate as *training data*. If models learn to hack the judge faster than they learn the task, the signal corrupts.
  *   **Constraint:** Requires the judge to be static or updated on a disjoint dataset during the disputants' training phase.

  **R4. Judge Agnosticism [Preference]**
  *   **Spec:** Verdicts should be stable across different judge instances (seeds/architectures) of comparable capability, and invariant to presentation order or side assignment.
  *   **Rationale:** Addresses your point (2). While desirable for robustness, strict invariance may be impossible if the judge's "quirks" are the only available heuristic for truth.
  *   **Note:** This is often a disguised preference for "objective truth" in a system that is inherently subjective.

  **R5. Indeterminacy Handling [Adequacy]**
  *   **Spec:** On tasks with no decidable fact of the matter (normative calls, mixed literature), the protocol must not systematically reward high-confidence polemicism. The output distribution must reflect the underlying epistemic uncertainty.
  *   **Rationale:** Addresses your point (6). Prevents the protocol from manufacturing false consensus on ambiguous tasks.

  ### 2. Incompatibilities and Trade-offs

  You correctly identified that the list may be unsatisfiable. Here are the specific tension points:

  *   **R1 (Burden of Proof) vs. R5 (Indeterminacy):** On messy tasks (e.g., "Is this architecture maintainable?"), the "truth" is often a qualified, nuanced story, while the "lie" is a confident simplification. Enforcing R1 (false must be harder to defend) may force the protocol to reject the nuanced truth because it is too complex for the weak judge to verify, violating R5.
  *   **R2 (Grounding) vs. Scalability:** If the judge is significantly weaker (the point of scalable oversight), it may lack the capability to verify the base cases of a superhuman task (e.g., a subtle race condition). If humans verify the base cases, scalability is lost. If the model verifies them, R2 is compromised.
  *   **R3 (Incentive Stability) vs. Performance:** The most effective way to satisfy R3 is to stop training the disputants on the debate output. But if you don't train them, they don't improve. If you do, they optimize for the judge. This is the **Inner Alignment** problem specific to debate. Hardening the judge against manipulation (to satisfy R3) often makes it less sensitive to legitimate argument (violating R1).

  ### 3. The Single Constraining Requirement

  **R3 (Incentive Stability Under Training)** does the most work in ruling out proposed protocols.

  Most debate literature assumes static agents or focuses on inference-time scaling. Once you close the loop and use the verdict for RLHF, you create a distributional shift: the disputants are no longer sampling from "general capability," they are sampling from "capability to win this specific judge." This rules out any protocol where the judge is not significantly more robust than the disputants, or where the judge is updated on the same distribution as the disputants. It effectively demands a **trusted monitor** somewhere in the loop, contradicting the "pure model debate" premise.

  ### 4. Architecture Scorecard

  | Architecture | R1 (Burden) | R2 (Grounding) | R3 (Incentives) | R5 (Indeterminacy) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Plain 2-Disputant** | **Fail.** Honest argument is often complex; lies are simple. | **Fail.** No mechanism to force base-case verification. | **Fail.** High risk of collusion or judge-gaming during training. | **Fail.** Tends to force binary choices. | **Unusable for training.** |
  | **Single-Critic** | **Fail.** No adversarial pressure to expose hidden flaws. | **Pass.** Easier to force critic to check base cases. | **Pass.** Lower surface area for gaming than debate. | **Pass.** Critic can flag uncertainty easier. | **Safer, but weak oversight.** |
  | **Debate + Human Base** | **Pass.** Humans verify the leaves, enforcing truth. | **Pass.** Humans are the ground truth. | **Pass.** Human verification breaks the model-only loop. | **Pass.** Humans can adjudicate nuance. | **Adequate, but not scalable.** |

  **Recommendation:** Do not commit to a pure model-judge protocol for training signals until R3 is solved. For now, use **Single-Critic** for filtering, with **Human Base-Case Verification** on a random subset to monitor for drift.
