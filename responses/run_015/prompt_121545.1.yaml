  **To:** Capital and Space Planning Committee
  **From:** [Your Name]
  **Re:** The Observatory Conversion

  **Bottom line**
  We must deny both requests for additional central funding immediately and force a decision on the existing proposals within 30 days. Continuing to fund feasibility studies converts this committee from a decision-making body into an auctioneer facilitating a loss-minimization game. The observatory will be awarded based on strategic alignment with university goals, not cumulative expenditure, and the losing department will receive priority consideration in the next capital cycle rather than financial reimbursement.

  **What kind of failure this actually is**
  This is not merely cognitive sunk-cost fallacy; it is a structural incentive failure known in game theory as a "Dollar Auction." In this dynamic, rational actors escalate commitment not to win the prize, but to avoid realizing the loss of previous investments. The critical error lies with us, the committee: by keeping the bidding open and suggesting further funding is possible, we have validated the escalation. We have transformed a space allocation problem into a war of attrition where the only way for a department to "win" is for the other to collapse. Until we change the payoff structure—specifically by closing the bidding—we cannot expect rational de-escalation. The failure is institutional; we provided the stage for the auction rather than a mechanism for allocation. Recognizing this distinction matters because psychological appeals to rationality will fail against structural incentives. We cannot think our way out of a game that rewards irrational persistence; we must change the rules of the game itself. If we treat this as a cognitive error, we will lecture the departments. If we treat it as a structural failure, we must discipline ourselves.

  **Why "ignore the sunk costs" doesn't settle it**
  Your colleague is correct that standard advice fails here. At the moment of decision, spending another $40k to save a $180k investment looks rational if there is any probability the opponent folds. This is "local rationality" within a losing game. Telling departments to "ignore sunk costs" asks them to accept a certain loss now for an uncertain gain later, while their opponent might still win the prize. The advice fails because it addresses psychology, not incentives. As long as the game remains open, the expected value of bidding exceeds the expected value of folding, because folding guarantees 100% loss of status and capital. We cannot talk them out of this; we must close the game board so that further bidding has zero expected value. The colleague's insight confirms that the departments are acting rationally within the broken system we built. Therefore, fixing the system is the only viable path, not advising the players to act against their own immediate financial interests.

  **The strongest case for letting it run to a decision anyway**
  Proponents of continuing argue that expenditure signals intensity of preference. In information economics, "skin in the game" separates serious projects from casual ones. By allowing the escalation, we may be discovering which group values the space most highly, measured by their willingness to suffer for it. Stopping now might award the space to a group with a better proposal but less commitment, risking a failed implementation later. Furthermore, abrupt cancellation demoralizes faculty who acted in good faith under implicit committee encouragement. A decision reached after full exhaustion of options may carry more legitimacy and less post-decision litigation, ensuring the winner utilizes the space effectively rather than feeling they won on a technicality. This view treats the spending not as waste, but as a costly signaling mechanism to reveal true private valuations of the asset. If the university values robust commitment over optimal planning, letting the auction conclude provides data we otherwise lack. The risk is that the signal becomes noise when the cost exceeds the asset value.

  **Recommendation**
  Effective immediately, the Committee Chair will deny both $40k requests in writing, citing the closure of the feasibility phase. The Committee will convene a special session on [Date, 3 weeks out] to vote on the existing proposals using a weighted rubric focused on strategic fit, not readiness. The Provost must attend to signal finality. To the losing department, we offer non-monetary compensation: guaranteed priority review for the next available capital project and shared access to the new facility for specific programs. This breaks the auction by removing the possibility of recovery through spending, while offering a face-saving off-ramp that preserves future collaboration without establishing a precedent of reimbursing poor planning. We must communicate that the bequest funds are restricted to construction, not planning overruns. This timeline forces a resolution before the academic year ends, preventing the deadlock from bleeding into budget season. The Chair must deliver the message verbally to the Deans before the written denial to manage the political fallout.

  **The two mechanisms: salvage rule and fresh-eyes rule**
  The "Salvage Rule" attempts to alter the payoff matrix by reducing the loss associated with folding. If a department knows it recovers 25% of costs by stopping, the pain of losing decreases, theoretically reducing the incentive to bid further to avoid that loss. However, this creates a severe moral hazard: it teaches units that escalation is insured by the center. Future committees will face departments willing to spend recklessly, knowing a fraction is recoverable. The objection does not kill the rule entirely, but it dictates strict sizing and framing. It must be funded from central discretionary reserves, not the bequest, to avoid donor violations. It must be announced as a one-time "amnesty" to stop institutional waste, explicitly conditioned on immediate cessation of advocacy. The "Fresh-Eyes Rule" solves the committee's escalation but ignores the departments'. New decision-makers will still face the same inflated proposals and pressure. Therefore, Fresh-Eyes is necessary but insufficient. We should adopt a modified Fresh-Eyes approach (recused members who oversaw the initial spending) combined with the hard funding stop. Do not use the Salvage Rule unless the deadlock threatens institutional stability; the moral hazard cost outweighs the benefit of buying peace today. If used, cap reimbursement at 10% and require a public acknowledgment that the spending was unauthorized. Specifically, if we reimburse, we signal that the center absorbs risk for departmental gambles. This encourages future departments to bypass feasibility checks, assuming the center will bail them out to avoid total loss. The only viable version is a "loss-sharing" agreement where the department absorbs 75% and the center 25%, explicitly labeled as a bailout, not entitlement. Even then, the precedent risk remains high. Crucially, the Salvage Rule changes the *threat point* of the negotiation. By lowering the cost of folding, it makes folding more attractive than bidding. But it also lowers the cost of *entering* the next auction. We must weigh the immediate cessation of bleeding against the long-term infection of planning culture. Given our size, the long-term cultural cost is likely higher than the short-term financial relief.

  **What to expect from the two members who'll push back**
  Expect the Department Chairs to argue procedural fairness, claiming they spent based on committee signals. They will frame the denial as a breach of trust. Stand firm: the trust breach was allowing the auction to continue this long. They may threaten to withdraw the proposals entirely; call their bluff. A withdrawn proposal yields zero value; a rejected one yields priority next cycle. They need the win more than we need their participation. Remind them that continued escalation risks the Provost canceling the project entirely to preserve capital. The threat of total loss is the only lever strong enough to break the auction dynamic. Prepare the Provost to deliver this message if the Chairs resist the Committee's decision.
