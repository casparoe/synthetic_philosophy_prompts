      DEPARTMENT OF SEMANTIC STABILITY
      REQUEST FOR PROPOSALS (RFP-SS-2024-09)
      SUBJECT: TRANSLATION MANUAL FOR EQUATORIAL ZONE CORPUS

      1.0 BACKGROUND
      Field Team Alpha has secured a complete corpus of speech acts from the Equatorial Zone contact group. Stimulus-meaning correlations are established at the observation level. When a rabbit is present and the field worker emits the phoneme sequence /gavagai/, native subjects reliably assent. When no rabbit is present, subjects dissent. This behavioral regularity is consistent across all recorded instances. The Department requires a comprehensive Translation Manual (the Manual) that maps all corpus utterances to specific stimulation patterns and predicts native assent/dissent behavior with 100% accuracy. The Department notes that multiple theoretical frameworks exist that satisfy these behavioral constraints while positing different ontological commitments regarding the referent of /gavagai/.

      2.0 SCOPE OF WORK
      The Contractor shall deliver a Manual that functions as a predictive algorithm for native linguistic behavior. The Manual must account for all existing corpus data. The Department emphasizes that the utility of the Manual depends on its operational consistency, not necessarily on the metaphysical status of the entities described. Bidders are advised that proposals relying on future data collection, neuro-linguistic imaging, or the identification of bilingual informants will be rejected as non-compliant. The problem is defined by the existing corpus.

      3.0 EVALUATION CRITERIA
      Proposals will be scored on a 100-point scale.
      3.1 Predictive Accuracy (40 Points): The Manual must predict assent/dissent for all recorded instances. As all compliant Manuals achieve 100% accuracy on the existing corpus, all bidders will receive full credit for this criterion.
      3.2 Ontological Parsimony (30 Points): Bidders must minimize the number of entities posited. The Department acknowledges difficulty in adjudicating parsimony between competing frameworks (e.g., counting whole rabbits versus temporal rabbit stages versus undetached rabbit parts). Scoring will be discretionary based on the bidder's internal consistency.
      3.3 Native Competence Alignment (30 Points): The Manual must respect the native speakers' understanding of their own language. As native understanding is accessible only through the assent/dissent behavior already accounted for in Criterion 3.1, the Evaluation Board will assess this based on the bidder's textual assertion of alignment.

      4.0 DELIVERABLES AND ATTACHMENTS
      Bidders must submit one (1) digital copy of the Manual.
      Mandatory Attachment R (Reference Statement): Bidders must submit a sworn statement in English specifying exactly what the native term /gavagai/ refers to (e.g., "whole rabbit," "rabbit stuff," "universal rabbithood"). The Department notes it possesses no independent procedure to verify the accuracy of Attachment R. Discrepancies between Attachment R and the Manual's operational rules will not result in disqualification provided predictive accuracy is maintained.

      5.0 PROTEST PROCEDURE
      Unsuccessful bidders may file a protest within ten (10) days. Protests claiming that the selected Manual fails to capture the "true" reference will be dismissed as outside the scope of procurement verification.

      6.0 APPENDIX: QUESTIONS FROM PROSPECTIVE BIDDERS
      Q1: Can we submit a Manual using a proxy function that reassigns ontology but preserves all behavioral predictions?
      A1: Yes, provided predictive accuracy is maintained.

      Q2: Does the English word "rabbit" used in this document refer to whole rabbits, or is it subject to the same indeterminacy as the native term?
      A2: The Department operates under standard English conventions for procurement purposes. Bidders should assume the term is stable. The Department does not adjudicate the metaphysical status of English referents outside this contract.

      Q3: If all Manuals predict the data equally, how is the winner chosen?
      A3: In the event of a tie in technical scoring, the contract will be awarded to the lowest responsive bidder.

      7.0 AWARD DECISION
      The Department acknowledges that multiple Manuals satisfy all technical requirements equally. As the behavioral output is identical across all ontological frameworks, the distinction is deemed operationally irrelevant. The contract will be awarded as scheduled to the lowest compliant bidder. Work must commence immediately.

