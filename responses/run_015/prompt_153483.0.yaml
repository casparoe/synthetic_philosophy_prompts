answer: |-
  ### Case Study: The Tri-Cameral Authorization Protocol

  **The Scenario**
  Consider a regulatory agency, the *Bureau of Systemic Safety* (BSS), governed by a statutory mandate known as the Tri-Cameral Authorization Protocol (TAP). The BSS must decide whether to authorize a high-risk algorithmic trading system ($D$). Authorization requires a positive decision ($D=1$); otherwise, the system is blocked ($D=0$).

  The decision is determined by the votes of three independent committees: Safety ($A$), Efficacy ($B$), and Ethics ($C$). Each committee reviews the same underlying Evidentiary Packet ($E$). While the committees deliberate independently, the evidence $E$ is so conclusive that, in the actual world, it deterministically leads all three committees to vote in favor ($A=1, B=1, C=1$).

  The statutory rule for $D$ is a threshold function: Authorization occurs if and only if at least two committees vote yes.
  $$D = 1 \iff (A + B + C) \ge 2$$

  In the actual course of events: $E$ is positive. Consequently, $A=1, B=1, C=1$. Consequently, $D=1$.

  **The Philosophical Problem**
  We ask: Did the Safety Committee's vote ($A=1$) *cause* the Authorization ($D=1$)?

  1.  **The Counterfactual-Dependence Account (Lewisian):**
      This framework analyzes causation via truth conditions of counterfactuals across possible worlds. To say $A$ caused $D$, it must be that if $A$ had not occurred (had $A=0$), $D$ would not have occurred.
      *   *Analysis:* We hold fixed the actual circumstances as closely as possible. In the nearest possible world where $A=0$, the evidence $E$ remains positive (as it is a prior common cause). Since $E$ determines the votes, and the committees are independent in their deliberation but correlated by $E$, we must specify the counterfactual trajectory. If we assume the redundancy is robust (i.e., $B$ and $C$ still vote yes because $E$ is unchanged), then in the world where $A=0$, we have $B=1, C=1$. The threshold is still met. $D=1$.
      *   *Result:* $D$ does not counterfactually depend on $A$. Nor does it depend on $B$ or $C$. On a strict dependence account, none of the votes are causes of the authorization. The cause is arguably $E$, rendering the votes epiphenomenal intermediaries.

  2.  **The Interventionist Account (Woodward/SEM):**
      This framework analyzes causation via invariant relations within a structural equation model (SEM). $X$ causes $Y$ if there is a possible intervention on $X$ that changes $Y$, holding other variables fixed according to the model's modularity.
      *   *Analysis:* The structural equation for $D$ is explicitly defined by the threshold rule. The model treats $A, B, C$ as distinct parents of $D$. An intervention $I_A$ that sets $A=0$ (breaking the link from $E$ to $A$) is a valid surgical manipulation.
      *   *The Nuance:* In the *actual* context ($B=1, C=1$), an intervention on $A$ alone does not change $D$. However, Interventionism distinguishes between *actual causation* (token) and *type-level causal structure*. More sophisticated actual-causation definitions (e.g., Halpern & Pearl) look for a "contingency": Is there a setting of other variables (e.g., $B=0$) such that an intervention on $A$ *would* change $D$? Yes. If $B$ were 0, $A$ would be pivotal.
      *   *Result:* The causal relation holds because $A$ is part of an invariant mechanism capable of controlling $D$, even if that capacity was not fully utilized in the specific token instance due to redundancy. The vote is a cause because it occupies a node in the structural graph that transmits influence.

  ---

  ### The Verdict: In Favor of Interventionism

  I argue that the **Interventionist Account** captures the causal structure of the Tri-Cameral Protocol more faithfully than the Counterfactual-Dependence Account.

  In institutional and social scientific contexts, causation is not merely a matter of historical hinge-points (where the outcome *actually* hung in the balance); it is a matter of **systemic capacity and normative architecture**. The Interventionist framework respects the reality that the Safety Committee's vote *is* a cause of the authorization because the institutional rules grant it that power, regardless of whether the other committees happened to agree.

  #### Defense of the Verdict

  **1. Avoiding Epiphenomenalism**
  The Counterfactual-Dependence account, when applied strictly to symmetric overdetermination, risks rendering the votes epiphenomenal. If $A, B,$ and $C$ are all redundant, and $D$ depends only on the threshold being met, the dependence account pushes the causal weight entirely back onto the common cause $E$. This implies that the institutional process—the voting itself—is causally inert.
  This is ontologically incorrect for social kinds. The BSS authorization is not caused by the *evidence* directly; it is caused by the *institutional recognition* of that evidence via the votes. If the committees had voted No despite the evidence, $D$ would be 0. The votes are the proximate mechanisms of the institution. Interventionism preserves this by identifying $A, B, C$ as distinct causal parents in the structural model. It acknowledges that $A$ has the *capacity* to determine $D$, which is the relevant sense of causation for accountability and explanation.

  **2. Avoiding Causal Pluralism**
  One might suggest a pluralist escape: "Dependence causation" applies to physical events, while "Interventionist causation" applies to institutional ones. I reject this. There is only one causal relation at stake here: the production of the regulatory decision. Interventionism subsumes the insights of dependence without collapsing into it. It acknowledges that $D$ did not *depend* on $A$ in the actual world, but argues that dependence is too narrow a criterion for token causation in redundant systems. By utilizing the "contingency" criterion (checking if $A$ matters in *some* relevant context of the model), Interventionism explains why we hold Committee A responsible. They *did* cause the approval, because their vote was a necessary part of the sufficient set that *actually* occurred, and their vote *would* have been necessary had their colleagues dissented. This is a unified account of causation as **invariant potential for control**, not a patchwork of different relations.

  **3. The Normative Dimension of Causal Facts**
  In regulatory contexts, to identify a cause is to identify a locus of responsibility. If we say Committee A did not cause the approval (because B and C would have done it anyway), we undermine the rationale for the Tri-Cameral structure. The structure exists precisely to ensure that multiple independent validations occur. Interventionism aligns with this normative reality: the causal fact tracks the *design of the system*. The vote is a cause because the system is designed to make it one. Counterfactual dependence tracks the *accidents of history* (that B and C happened to agree). Causal explanation in science and policy ought to track design and capacity, not just historical accident.

  #### The Conceptual Cost to Counterfactual-Dependence

  For the Counterfactual-Dependence framework to accommodate this scenario without yielding the counterintuitive result that "nothing caused the authorization" (or only $E$ did), it must pay a steep conceptual cost: **it must sever the link between causation and actual difference-making.**

  To save the intuition that $A$ caused $D$, the Lewisian must appeal to **Quasi-Dependence**. They must argue that because the process from $A$ to $D$ *intrinsic* to the actual world resembles a process in a counterfactual world where $A$ *is* pivotal, $A$ counts as a cause.
  *   **The Cost:** This move abandons the core motivation of counterfactual theories: that causation is grounded in the modal dependency of actual events. By relying on intrinsic matching across worlds, the account becomes less about how the world *is* and more about how it *resembles* other worlds. In the Tri-Cameral case, the "intrinsic process" of a committee voting is abstract and institutional, not physical. Relying on quasi-dependence here forces the counterfactual theorist to treat institutional rules as intrinsic physical properties, which is a category mistake.
  *   **The Surrender:** The Counterfactualist must surrender the claim that their account provides a purely extensional, truth-conditional analysis of actual events. They must admit that causation requires a modal robustness (quasi-dependence) that exists even when actual dependency fails. But once they admit that, they have conceded the Interventionist's main point: that causation is about the **stability of the relation** across variations, not the dependency in the actual world.

  ### Conclusion

  The Tri-Cameral Authorization Protocol demonstrates that in complex, redundant systems, **causation is a property of the structural mechanism, not merely the historical trajectory.** The Interventionist account succeeds because it identifies the votes as causes based on their invariant role within the regulatory structure. The Counterfactual-Dependence account fails because it conflates "being a cause" with "being a necessary condition in the actual world." In doing so, it renders the institutional machinery causally invisible, mistaking the redundancy of the outcome for the irrelevance of the process. For a philosophy of science interested in how explanations function in social and regulatory systems, the Interventionist framework is not just preferable; it is necessary.
