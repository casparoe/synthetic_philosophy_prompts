      *   *Interventionist Issue:* If we intervene on A (set $A=0$), does $D$ change? No, because $B=1, C=1$. But if we intervene on A *and* B, $D$ changes. This touches on "redundancy ranges" and "actual causation" in SEMs.

  3.  **Refining the Tension (Modal vs. Structural):**
      *   *Counterfactual (Lewis):* Focuses on similarity of possible worlds. To make A a cause, we need a chain of dependence. But here, the redundancy is simultaneous. Lewis handles this with "quasi-dependence" or intrinsic process matching, but that gets messy with institutional rules which are extrinsic.
      *   *Interventionist (Woodward):* Focuses on invariant generalizations and testing via interventions. The structural model captures the *rule* (the threshold function). The issue is whether the *actual* vote of A is a cause when it wasn't *needed* for the outcome, given the other votes.
      *   *The Twist:* The shared evidence $E$. This creates a *common cause* structure that correlates the votes. It's not independent overdetermination (like two fires); it's correlated overdetermination.
      *   *The Deep Divergence:*
          *   Counterfactualism asks: "Did the outcome *hinge* on this specific event?" (Answer: No).
          *   Interventionism asks: "Is this variable part of an invariant mechanism that *could* control the outcome?" (Answer: Yes, within the system's logic).
      *   *The Philosophical Stakes:* Is causation about *difference-making in the actual world* (Counterfactual) or *potential for control/manipulation within a system* (Interventionist)?

