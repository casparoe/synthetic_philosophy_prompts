      *   *Section 4: The Philosopher's Defense (Tracking vs. Sealing).* Reinforce the "tracking" argument.
      *   *Section 5: What Both Missed.*
          *   The metaphysics of time (Eternalism makes the Logician right; Presentism/Open Future makes the Philosopher right).
          *   The definition of Truth (Is there a fact of the matter yet?).
