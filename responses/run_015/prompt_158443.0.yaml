      *   *Pessimists (e.g., Hopkins, Hills):* No. Moral understanding requires grasping reasons. Testimony gives belief without understanding. It's alienation from one's moral agency.
      *   *Optimists (e.g., Lackey, Jones):* Yes. We trust doctors/mechanics. Why not moralists? Also, picking an expert requires moral judgment anyway.
      *   *Nuance:* Verdict vs. Reasons. Knowing *what* is right vs. knowing *why*.
