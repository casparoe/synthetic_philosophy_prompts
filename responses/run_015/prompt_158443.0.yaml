      *   *Check:* Is the distinction between hard/soft labels clear? *Yes, hard = verdict, soft/logits = confidence/uncertainty/reasoning proxy.*
      *   *Check:* The "Standing Rule" part. Freezing weights is a good analogy for adopting a principle.
      *   *Check:* The "Expert Identification" part. This maps to *model selection* using a validation set. The validation set labels come from... the student's own current weights (bootstrapping) or a separate reward model.

  8.  **Final Review against constraints:** "Don't smuggle in machine-learning assumptions and present them as the translation." I need to explicitly state where the ML concept *diverges* from the philosophical intent.

      *(Self-Correction on Residue)*: The biggest residue is *Blame/Praise*. A model that fails OOD isn't *blameworthy*. A moral agent who defers is. This is crucial.

      *(Self-Correction on Expert ID)*: In ML, we assume the validation labels are reliable. In the philosophical argument, the point is you need *moral* judgment to validate the moral expert. In ML terms, you need a *reward model* that is already aligned to select the *policy model*. This maps well (RLHF).

