prompt: |-
  I work in machine learning, mainly on knowledge distillation and on training models from human feedback, so the vocabulary I actually think in is: teacher and student models, hard labels versus soft labels, learning a decision boundary versus learning the teacher's internal representation, distilling reasoning traces rather than bare outputs, ground-truth labels versus a label-generating process whose reliability has to be estimated from limited validation data, and out-of-distribution generalization at deployment. I'm fluent in it but I'm not a theorist.

  Please translate the philosophical debate about moral testimony into that vocabulary, and then report what does not survive the translation. The parts I want translated are: (i) the claim that forming a moral belief merely because someone you trust asserts it is defective in a way that forming an ordinary factual belief that way is not — that what you end up with isn't knowledge, or isn't the right kind of belief, or can't be what you act for the right reason on; (ii) the reply that testimony is an ordinary source of knowledge and that the asymmetry is unmotivated, together with the observation that you need moral judgment of your own to identify someone as a moral expert, so that deference presupposes part of the capacity it was supposed to replace; (iii) the contrast between deferring to an expert's verdict and coming, through what they say, to grasp the reasons for yourself; (iv) the difference between consulting an expert about a case as it arises and adopting their verdict in advance as a standing rule for cases you will later have to settle alone.

  For each: what it maps onto in my terms, what you had to bend to make it fit, and what has no counterpart at all. Then your verdict on the residue — does it point to something my framework cannot represent (say what), or to a philosophical claim doing less work than it looks like it's doing? Keep the translation honest: don't smuggle in machine-learning assumptions and present them as the translation.
