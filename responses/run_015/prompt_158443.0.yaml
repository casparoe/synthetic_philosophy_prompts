      *   *Concept 1: The Pessimist Claim (Moral testimony is defective).*
          *   *ML Mapping:* Training a student model *only* on hard labels (outputs) from a teacher vs. training on soft labels (logits) or reasoning traces (CoT).
          *   *Idea:* If you just distill the output (hard label), you learn the decision boundary but not the representation. You fail OOD.
          *   *Refinement:* The Pessimist says moral belief via testimony is like a student model that overfits the teacher's outputs without learning the latent feature space. It works on ID (in-distribution) but fails OOD (new moral situations). It lacks "robustness."
          *   *Bending:* Moral "knowledge" isn't just predictive accuracy.
          *   *Residue:* Moral agency/autonomy. ML models don't have agency.

      *   *Concept 2: The Optimist Reply (Testimony is ordinary + Expert ID requires judgment).*
          *   *ML Mapping:* Distillation is standard practice (BERT distilling to TinyBERT). It works.
          *   *Expert ID:* To select a teacher, you need a validation set. You need to evaluate the teacher's performance on *some* ground truth or proxy metric.
          *   *Refinement:* You can't distill without a validation loop. To trust the teacher, the student (or a meta-evaluator) must compute loss on a hold-out set. This implies the student already has some capability to evaluate moral loss.
          *   *Bending:* In ML, we usually assume the validation label is "gold." In morality, the "validation label" is the student's own intuition.
          *   *Residue:* The circularity in philosophy is normative (you shouldn't defer), in ML it's practical (you can't evaluate without labels).

      *   *Concept 3: Verdict vs. Reasons (Output vs. Representation).*
          *   *ML Mapping:* Distilling logits/attention maps (soft labels/internal states) vs. distilling class predictions (hard labels). Or: Fine-tuning on Chain-of-Thought (reasoning traces) vs. Input-Output pairs.
          *   *Refinement:* Pessimists want the student to learn the *manifold* or the *feature extractor*, not just the classifier head. Optimists say the output is enough for deployment.
          *   *Bending:* "Grasping reasons" implies conscious understanding. In ML, it's just alignment of activation spaces.
          *   *Residue:* Phenomenology. "Grasping" feels like something. Alignment of vectors does not.

      *   *Concept 4: Case-by-Case vs. Standing Rule.*
          *   *ML Mapping:* Online learning/Inference-time querying (Mixture of Experts, routing) vs. Freezing the weights after distillation (static policy).
          *   *Refinement:* Asking per case = querying the API. Standing rule = distilling and deleting the teacher.
          *   *Bending:* Moral rules aren't exactly frozen weights; they are more like priors.
          *   *Residue:* The moral risk of *committing* to a rule (dogmatism) vs. the ML benefit of efficiency (latency/cost).

  4.  **Synthesizing the Residue/Verdict:**
      *   What's left over? The *normative force*. ML describes *performance* (loss, generalization). Morality describes *obligation* and *agency*.
      *   The Pessimist's worry is about *alienation*. A model isn't alienated if it doesn't understand the features; it's just brittle.
