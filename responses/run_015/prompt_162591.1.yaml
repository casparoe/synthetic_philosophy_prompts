answer: |-
  This is a sharp angle. Using *12 Angry Men* to test pragmatic encroachment works structurally but fractures on the specific epistemology of the law. The film is indeed a machine for raising stakes without adding evidence, but it complicates the standard encroachment model by externalizing those stakes. Here is a reading for your session that highlights where the fit holds, where it breaks, and what the film adds to the literature.

  **Scenes Dramatizing Encroachment**
  The film opens with classic low-stakes epistemology. It is hot, the game is on, and the evidence seems overwhelming. Jurors 3, 7, and 10 treat the question of guilt as a trivial knowledge claim. They possess the evidence (the knife, the witnesses) and claim to know the boy is guilty. Their justification is thin, but their stakes are low; a quick verdict gets them home. Juror 8 does not introduce new evidence initially; he introduces high stakes. By forcing a secret ballot and highlighting the death penalty, he shifts the pragmatic context.

  Watch the deliberation on the old man's testimony. Initially, the jury accepts the witness saw the boy run because the evidence supports it. Once Juror 8 raises the stakes—asking if they are *sure* enough to kill a man—the same evidence is scrutinized differently. They don't get new data; they get a higher threshold for acceptance. Juror 9's breakdown of the witness's need for recognition is only pursued because the cost of being wrong has been raised from "inconvenience" to "execution." This mirrors encroachment: the evidence remains constant, but the practical cost of error rises, thereby dismantling the claim to know.

  **The Wrinkle: Delegated Stakes**
  Your point about delegated stakes is the critical friction point. Standard encroachment literature focuses on the subject's own interests (e.g., missing a train vs. crashing a plane). Here, the jurors' personal stakes (the ball game, the business deal) are explicitly ruled irrelevant. They are mandated to adopt the defendant's stakes.

  This suggests the film argues for institutional encroachment rather than individual pragmatic encroachment. The jurors aren't simulating empathy; they are adhering to a fixed legal threshold that codifies high stakes. When Juror 8 says, "It's possible," he isn't claiming he personally lacks knowledge. He is claiming the group lacks the *license* to act on knowledge unless it meets a standard dictated by the defendant's situation. This looks less like pragmatic encroachment (where stakes change the truth conditions of knowledge) and more like contextualism about the phrase "beyond reasonable doubt." The context changes the meaning of proof, not necessarily the metaphysical status of the jurors' knowledge.

  **The Knowledge vs. Reasonable Doubt Objection**
  You must press the obvious objection: the film is about verdicts, not knowledge. Pragmatic encroachment claims high stakes can destroy knowledge. The legal system claims high stakes require more than knowledge—they require certainty devoid of reasonable doubt.

  A juror could theoretically know the defendant is guilty (in the philosophical sense) but still harbor a reasonable doubt based on the possibility of error. The film's logic is anti-encroachment in one specific sense: it suggests that even if you *know* he did it, the stakes demand you acquit if the process isn't flawless. Juror 8 never claims the boy is innocent; he claims the prosecution isn't perfect. If encroachment were the only mechanism, high stakes would simply make knowledge unavailable. Instead, the film suggests knowledge might be available, but acting on it is forbidden. This distinguishes epistemic status from practical permission. The film supports the *action-guiding* component of encroachment (don't act unless stakes are met) without confirming the *epistemic* component (you don't know).

  **What the Film Adds**
  Where the papers often fall short is in the social dynamics of standards. The literature treats encroachment as an individual relation between a subject, a proposition, and a stake. *12 Angry Men* shows that standards are negotiated collectively. Juror 3 holds onto "knowledge" of guilt until the very end, driven by personal trauma, while the group slowly enforces a higher standard upon him.

  This validates your hunch: the film is about epistemic responsibility within a group. It demonstrates that stakes aren't just felt; they are enforced. Juror 8 holds the others responsible for adopting the high-stakes standard. The shift isn't just internal; it's peer-reviewed. The film suggests that in high-stakes environments, knowledge isn't just a state you inhabit; it's a standard you must defend against a community.

  **Verdict**
  The reading half works. The film perfectly dramatizes the raising of thresholds via stakes without new evidence. However, it substitutes legal certainty for knowledge and delegated stakes for personal ones. Use it to show that pragmatic encroachment isn't just about individual psychology—it's about the social enforcement of epistemic standards when lives are on the line. The jurors don't just lose knowledge; they accept a burden of proof that exceeds it.
