prompt: |-
  Hey — I'm putting together a one-off session for a law-and-philosophy reading group and I want to use 12 Angry Men (the 1957 one, Fonda as juror 8) as a case study for pragmatic encroachment. Quick reminder of the view I mean, so we're on the same page: whether a subject counts as knowing p partly depends on what's at stake for them practically, so someone can know on low stakes and fail to know on high stakes with no change in their evidence. My thought is that the film is unusually good for this because the deliberation is basically a machine for changing what's at stake for twelve people at once — the guy who wants to make the ball game, the angry father, the quiet ones who slowly come to feel a man's life is on the line — and their verdicts move without much new evidence arriving.

  The wrinkle I want to press, which I don't think the encroachment literature (Stanley, Fantl and McGrath) really handles: jurors are supposed to apply stakes that aren't theirs. Call it delegated stakes. The juror's own interest in getting home is morally and legally irrelevant, but the defendant's interest is supposed to be everything. So if encroachment is right, the juror has to occupy an epistemic position that's sensitive to someone else's practical situation. What would that even be — empathic simulation, or is a fixed legal threshold doing the work, which would make the film an argument for contextualism about "beyond reasonable doubt" but not really for encroachment?

  So give me the reading: which scenes actually dramatize encroachment and would be worth putting on the board, and where does the film resist it? Please also be honest about the obvious objection that the movie is about reasonable doubt, not knowledge, and that those differ in exactly the way that matters here — you can know and still have reasonable doubt, and the film's insistence that doubt alone is enough to acquit might be anti-encroachment. If the film does add something the papers don't, say what: my hunch is that its about standards shifting inside a group over time, and about being held responsible for the standard you adopt. Its fine to end up saying the reading half works. Write it in American English, roughly 700-900 words, and don't pad it with citations — I've read the lit already.
