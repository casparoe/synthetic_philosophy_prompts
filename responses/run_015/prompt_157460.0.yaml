answer: |-
  ### Advice on Naming Jerry

  **Do not name Jerry in the eulogy.**

  Here is why: The tension you feel is about the *implication* of success, not the identity of the brother. If you name Jerry, you inevitably turn Ray's funeral into a commentary on the fairness of life, which risks becoming the lecture you want to avoid. It puts Jerry's children in the position of being the "example" in Ray's story, which can feel patronizing even when well-intentioned.

  Instead, let Ray's philosophy do the work. Ray's view—that a man is defined by hauling the load, not by the check clearing—vindicates Jerry without needing to speak his name. When you say, "A man who hauled and got nothing was cheated by the deal, not by life," Jerry's children will hear their father honored in that truth without him being used as a prop. It protects their dignity. You can speak to them privately about their father later; in this room, for these five minutes, the tribute to Jerry is embedded in the integrity of Ray's worldview.

  ***

  ### Eulogy for Ray

  **(Approx. 5 minutes)**

  Thank you all for coming. Looking around this room, I see two kinds of people. I see the people who shared Ray's blood, and I see the people who shared his road. For forty years, those two groups didn't overlap much. But Ray would have wanted you both here, because he didn't see a difference between family and a fair deal.

  We keep hearing about the company. The trucks. The success. But if you ask me what Ray actually built, it wasn't a business. It was a routine. For forty years, the alarm went off at four in the morning. Not because he had to, but because that was the agreement he made with himself. He believed that the sun coming up was a promise, and he intended to be there to meet it.

  Ray had a specific way of talking about what he did. He didn't like words like "earned" or "deserved." He thought those words belonged to preachers and judges, not to truckers. He used to say, "I never earned anything. I got paid."

  To Ray, the universe wasn't a scale that balanced out good behavior with gold coins. It was a contract. The deal was simple: If you haul the load, you get the check. If you haul the load and you don't get the check, you weren't a failure. You were just cheated by the deal. But you didn't stop hauling.

  He knew that sometimes the road washes out. He knew that sometimes the engine blows, or the back gives out, or the contract disappears. He saw men he respected drive until they had nothing left to give, and the road took it all anyway. Ray didn't look down on those men. He didn't think less of them. He knew they hauled the load. In his book, that was the only metric that mattered.

  So, when we look at what he left behind—the company, the security, the legacy—we have to be careful. It's tempting to look at the result and call it a reward. But Ray would tell you that's a slide in logic. The money was just the deal working. The pride wasn't in the money. The pride was in the four a.m.

  He was proud because he showed up. He was proud because when he said he'd be there, he was there. He was proud because he honored his side of the contract, regardless of what the other side looked like.

  To his partners and friends in the business: You know this better than anyone. You know Ray never asked for a handout. He asked for a load. He delivered it. He settled the invoice. He respected the road enough to treat it like truth.

  To his family: You know the rest. You know that the four a.m. mornings weren't just about business. They were about who he was. He was a man who believed that showing up was the whole point.

  There are men in this world who haul the load and get paid. There are men who haul the load and get nothing. Ray believed that both men are equals, as long as they both drove the truck. The outcome is circumstance. The driving is character.

  Ray drove. He drove every day, through good weather and bad, through profit and loss, through health and hurt. He kept his eyes on the road and his hands on the wheel. And now, the load is delivered. The invoice is cleared. The truck is parked.

  He used to say that the only thing a man truly earns is his rest. I think he's finally collected on that.

  Rest well, Uncle Ray. The deal is done.
