answer: |-
  **Chapter Proposal: The Measurement Structure of Violence Trends**

  **The Research Question**
  The public and academic debate over whether political violence is declining is typically framed as an empirical dispute: one side presents time-series data showing falling rates, the other presents data showing rising absolute numbers or new forms of coercion. This chapter argues that this appearance is misleading. The disagreement is not primarily about the direction of a single quantity, but about which quantity is being tracked. I propose to disentangle this knot by separating three distinct questions that are currently conflated. First, the *factual question*: Given a fixed, well-specified measure $M$, what is the trend of violence over time $t$? Second, the *normative question*: Which measure $M$ ought to carry the weight of policy or moral judgment? Third, the *metaphysical question*: Independently of any stipulated measure, is there a fact of the matter about the trend in "violence as such"?

  The chapter's central hypothesis is that the factual question is solvable, the normative question is unavoidable, and the metaphysical question is ill-posed. Violence is a "patchwork" concept: trend claims are determinate at the level of fine-grained sub-kinds (e.g., intentional one-on-one killing of adults by strangers) but indeterminate at the aggregate level because aggregating distinct harms requires a weighting scheme that is not itself a matter of fact.

  **Critique of Existing Approaches**
  Current approaches fail to resolve this dispute because they attempt to solve a structural problem with empirical or stipulative tools. Empiricists often assume that better data will settle the debate. However, improved data collection cannot reconcile divergent trends generated by valid but incompatible measures. For instance, a constant annual per-capita homicide rate is compatible with a rising lifetime risk of victimization if life expectancy increases, and with a falling per-encounter risk if the density of anonymous contact grows faster than the population. More data merely sharpens the divergence.

  Conversely, political theorists often attempt to settle the debate through conceptual stipulation, defining violence precisely to include or exclude state coercion, structural harm, or psychological damage. While necessary, definition alone does not solve the measurement problem. Defining the extension of "violence" does not dictate how to weight different instances against one another to produce a single aggregate trend. A definition might classify both a riot and a drone strike as violence, but it does not specify how to sum them into a single index. Consequently, better data and careful definitions leave the core dispute open: they address the boundaries of the concept but not the structure of its aggregation.

  **Methodology**
  Over the nine-month fellowship, I will employ a measurement-theoretic and purpose-relative method. I will construct a formal apparatus specifying any violence measure by three parameters: (1) an *incidence variable* (realized events, victim-hours of suffering, or ex ante risk-weighted expected victimization); (2) a *denominator* (population-year, person-lifetime, or per social encounter); and (3) a *severity weighting* (which may or may not admit lexical priority among kinds of harm).

  I will map the leading purposes for which violence-trend claims are made onto the measures those purposes actually require. For example, forecasting future instability may require incidence variables based on coercive capacity (e.g., militarization), whereas assigning moral blame to institutions may require variables based on realized harm. Comparing historical eras may require lifetime risk denominators, whereas evaluating daily security requires per-encounter denominators. By demonstrating that specific purposes logically entail specific parameter choices, I aim to re-describe the disagreement not as a conflict about the world, but as a conflict between purposes. If two scholars disagree on the trend, I will test whether they are pursuing incompatible aims (e.g., one is forecasting risk, the other is assigning blame) that necessitate incompatible measures.

  **Candidate Conclusions**
  The analysis will discriminate among three candidate conclusions. The *Unitarian view* holds that there is one fact of the matter about the direction of violence, and current uncertainty is merely epistemic. The *Conventionalist view* holds that there is no fact of the matter beyond stipulated weights; any trend claim is purely a function of the chosen index. The *Patchwork view* (my working hypothesis) holds that determinacy holds within homogeneous sub-kinds but fails for the aggregate.

  I will decide between these by testing the stability of sub-kinds. If fine-grained categories (e.g., "stranger homicide") also exhibit measurement indeterminacy depending on parameters, the Patchwork view collapses toward Conventionalism. If, however, sub-kinds show robust convergent trends across reasonable parameter choices while the aggregate diverges, the Patchwork view is sustained. The Unitarian view is falsified if equally defensible measures yield opposite signs for the trend slope.

  **Failure Conditions and Scope**
  This project faces two primary risks. First, the purpose-relative mapping may fail to discriminate between measures; if every purpose can be served by multiple incompatible measures, the normative leverage is lost. Second, the sub-kinds themselves may turn out to be measurement-dependent, undermining the local determinacy required for the Patchwork view. Should this occur, the chapter will pivot to a defense of the Conventionalist view, arguing for explicit normative stipulation rather than hidden aggregation.

  Regarding scope, I will defer the historical application of this framework to specific eras. This chapter is methodological and meta-theoretical; it establishes the conditions under which historical claims can be evaluated, rather than evaluating the claims themselves. I will also limit the analysis to physical violence, excluding structural or economic violence, to maintain conceptual homogeneity within the sub-kinds.

  **Deliverable**
  The chapter will conclude with a practical "Measurement Audit Template." This tool will allow scholars and policymakers to audit any violence-trend claim by requiring them to state their incidence variable, denominator, severity weights, and primary purpose. By separating the empirical content of the claim (the trend given the parameters) from the stipulative content (the choice of parameters), the template renders the normative stakes of the measurement visible. This ensures that future debates proceed with clarity about whether the disagreement is factual or normative.
