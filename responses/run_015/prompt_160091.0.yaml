answer: |-
  **Mark: 17/25**

  **Point-by-Point Assessment**

  **(a) Account of Convention (5/5)**
  You correctly identify the core components of the Lewisian account stipulated in the course materials: arbitrariness, conditional preference to conform, and equilibrium stability. Your gloss that "conventions are facts about expectations" is a permissible interpretation of the coordination problem. You have demonstrated clear knowledge of the theoretical baseline. No marks lost here.

  **(b) Defense of the Claim (4/7)**
  You defend position (ii) (that conventions *as such* provide no moral reason) consistently. Your move to ground moral reasons in "effects on people's interests" is clear and coherent.
  *   **Credit:** You avoid the naturalistic fallacy; you correctly note that the existence of an expectation does not automatically entail a norm. Your internal logic is sound.
  *   **Critique:** For a final-year specialist module, the defense is too thin. You assert that "facts about expectations are not by themselves normative" without engaging with the primary counter-argument in the literature: the Principle of Fair Play (Hart/Rawls). A robust defense of (ii) requires explaining why receiving the benefit of a cooperative scheme (like queuing) does not generate an obligation of reciprocity, even for an outsider. You treat this as self-evident, but it is the central contested point of the topic.

  **(c) Application to Practices (5/7)**
  You apply your "interest test" consistently across the three cases.
  *   **Credit:** The differentiation is logical based on your premise. The analysis of tipping (offense/wage pressure) and queueing (loss of place) shows good applied reasoning.
  *   **Critique:** The analysis of queueing contains a simplification. You suggest that if the bus is half-empty, the convention is "inert." This ignores that conventions often serve to prevent *uncertainty* or *conflict*, not just allocate scarce resources. Even on a half-empty bus, breaking the queue can cause confusion or anxiety, which are interest setbacks. More importantly, you miss the possibility that the obligation to queue might stem from *respect* for the time others have invested, independent of whether they lose a seat. This again points to a reduction of all moral value to tangible harm.

  **(d) Reply to Objection (3/6)**
  You accept the "no difference" objection and use it to bolster your conclusion.
  *   **Credit:** This is consistent with your consequentialist framework. If obligations rely on outcomes, and one act changes no outcomes, there is no obligation.
  *   **Critique:** This is the weakest part of the answer. You accept the objection without challenging its underlying assumption: that moral obligation requires causal efficacy regarding the *persistence of the practice*. Standard replies in this field argue that obligations of fair play are owed to *participants*, not to the *abstract practice*. One can owe a duty to fellow conformers even if one's own conformity does not save the scheme. By accepting the objection uncritically, you bypass the sophisticated debate about "threshold effects" and "participatory duty" expected at this level.

  **Serious vs. Cosmetic Problems**

  *   **Cosmetic:** The phrasing in (a) is slightly informal ("self-reproducing pattern"), but philosophically accurate enough for full credit. The queueing example in (c) regarding the "half-empty bus" is a minor empirical oversimplification.
  *   **Serious:**
      1.  **Theoretical Reductionism:** You reduce all moral reasons to interest/harm consequences, ignoring non-consequentialist sources of obligation (specifically Fair Play/Reciprocity) that are central to the ethics of convention.
      2.  **Handling of the Objection:** You accept the "no difference" objection without distinguishing between causal impact on the *rule* and obligation to *persons*.

  **Requirements for Full Marks**
  To achieve full marks (24-25), the answer needed to:
  1.  **Engage with Fair Play:** In part (b), explicitly address and rebut the Principle of Fair Play. You needed to argue *why* an outsider who benefits from a scheme does not incur a debt of reciprocity, rather than simply asserting that only interest setbacks matter.
  2.  **Nuance the Objection:** In part (d), distinguish between the *causal* question (does my act save the convention?) and the *normative* question (do I owe it to those already conforming?). A full-mark answer would explain why the "no difference" objection fails against a Fair Play account, and why it succeeds against your own, showing awareness of the theoretical landscape.
  3.  **Deepen the Application:** In part (c), acknowledge that "interests" might include psychological goods like security or respect, which might be set back even in the "half-empty bus" or "jaywalking" scenarios, showing a more nuanced understanding of welfare.

  **Relationship Between the Two Most Serious Failures**
  The two serious failures are **not independent**; the first generates the second.

  Your failure to engage with non-consequentialist accounts of obligation (Failure 1: Theoretical Reductionism) directly causes your uncritical acceptance of the "no difference" objection (Failure 2). Because you have premised your entire argument on the view that moral reasons stem *only* from effects on interests, you are logically forced to accept that an act with no causal effect on interests generates no obligation. Had you acknowledged the Fair Play argument in part (b), you would have been compelled in part (d) to reject the objection (or at least qualify it), noting that fair play obligations do not depend on causal efficacy. Thus, the error in part (d) is a downstream consequence of the theoretical narrowing in part (b).
