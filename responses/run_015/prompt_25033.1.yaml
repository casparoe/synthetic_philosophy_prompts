answer: |-
  You have identified one of the most famous and structurally significant problems in normative ethics. You are not missing a niche term; you have stumbled directly onto the central fault line between **Deontology** and **Consequentialism**.

  The specific name for the structural puzzle you are describing is **"The Paradox of Deontology."**

  While terms like "agent-relative constraints" describe the *mechanism* (the rule itself), "The Paradox of Deontology" describes the *logical tension* you identified: *If X is bad, why is it rational to forbid minimizing the total occurrences of X?*

  Here is a breakdown of how philosophers have carved this at the joints, the technical vocabulary used to discuss it, and where the consensus (or lack thereof) stands.

  ### 1. The Core Label: The Paradox of Deontology
  This term was popularized by Derek Parfit (in *Reasons and Persons*) and further developed by philosophers like Samuel Scheffer.

  The paradox is formulated exactly as you observed:
  1.  Deontology posits constraints (e.g., "Do not kill innocents").
  2.  These constraints are usually justified by the badness of the act (killing innocents is bad).
  3.  However, deontology forbids violating the constraint even to prevent *more* violations of the same constraint by others.
  4.  Therefore, deontology seems to prioritize the agent's "clean hands" over the actual reduction of the bad thing the rule was supposed to prevent.

  To a consequentialist (who believes the right action is the one that produces the best overall outcome), this looks like "moral fetishism" or irrationality. To the deontologist, it is the only way to make sense of moral responsibility.

  ### 2. The Technical Engine: Agent-Relative vs. Agent-Neutral
  To understand why philosophers don't see this as a simple error, you need the distinction between **agent-neutral** and **agent-relative** reasons.

  *   **Agent-Neutral (Consequentialism):** "Murder is bad." Therefore, *everyone* has a reason to minimize the total amount of murder in the world, regardless of who is doing the murdering. If I can kill one to stop five murders, the math holds.
  *   **Agent-Relative (Deontology):** "*I* must not murder." The constraint attaches to *my* agency, not to the state of the world. My moral obligation is to govern my own will, not to manage the global tally of bad events.

  When you ask, "Why doesn't the rule-follower care that more X happens?", the philosophical answer is: **Because their theory is not about minimizing X; it is about respecting the status of moral agents.**

  ### 3. Why the Rule-Follower Doesn't Feel the Tension
  You noted that proponents "don't seem to experience this as a tension." Philosophers have developed specific concepts to explain why this isn't a bug, but a feature.

  **A. The Doctrine of Doing and Allowing**
  This distinguishes between *committing* a harm and *allowing* a harm. In the "Murderer at the Door" case (Kant's famous example), the deontologist argues that if you lie, *you* become a causal agent in a deception. If you tell the truth and the murderer kills your friend, the murderer is the sole agent of the killing. You are not responsible for the free actions of other moral agents.

  **B. Moral Integrity (Bernard Williams)**
  Philosopher Bernard Williams argued that consequentialism demands too much "alienation." If I must violate my deepest moral convictions (e.g., "I do not kill innocents") just because the math works out, I am no longer acting as an integrated person. I become a mere channel for utility. For the deontologist, maintaining their own moral integrity is a valid moral goal, even if it leads to worse global outcomes.

  **C. Rights as "Side-Constraints" (Robert Nozick)**
  Nozick argued that individuals have rights that function as "side-constraints" on action. You cannot violate someone's rights even to prevent others from violating more rights. To do so would treat the person you violate as a *means* to an end (saving others), which is itself a violation of their dignity.

  ### 4. Nearby Concepts and Distinctions
  You mentioned **Threshold Deontology**. It is important to distinguish this from the problem itself.

  *   **The Paradox of Deontology:** The problem (Why forbid minimizing violations?).
  *   **Agent-Relative Constraints:** The tool used (The rule applies to *me*).
  *   **Threshold Deontology:** A proposed *solution*. This view says: "The rule holds absolutely *until* the consequences become catastrophic." (e.g., Don't torture, unless millions will die). This attempts to split the difference, but purist deontologists reject it because it still subjects rights to a calculus.
  *   **Rule Consequentialism:** Another *solution*. This says: "Follow the rule because a society that follows this rule generally produces the best outcomes, even if following it in this specific instance doesn't."

  ### 5. Is There Consensus on a Resolution?
  **No.** This is the primary battleground of modern normative ethics.

  *   **The Consequentialist Critique:** They argue the Paradox of Deontology proves deontology is irrational. If you care about justice, you should care about *more* justice, not just *your* hands being clean. They argue this view leads to "moral narcissism."
  *   **The Deontological Defense:** They argue consequentialism justifies atrocities. If minimizing "X" is the only goal, then killing one healthy patient for organs is mandatory. Since that is intuitively abhorrent, the "paradox" is actually a proof that consequences aren't the only thing that matters.

  ### Summary for Your Mental Model
  You can map this to your software background like this:

  *   **Consequentialism** is **Optimization**: Minimize `global_error_count`. If throwing an exception now prevents 10 exceptions later, throw it.
  *   **Deontology** is **Protocol/Interface Contracts**: `function_X` has a precondition: `must_not_harm_user`. It doesn't matter if violating this precondition would stop `function_Y` from crashing the system. The contract of `function_X` is inviolable.

  The "Paradox of Deontology" is the compiler error you get when you try to run Optimization logic on a Protocol-based architecture.

  **Recommendation for Further Reading:**
  If you want to read the primary sources on this specific structure:
  1.  **Derek Parfit**, *Reasons and Persons* (Part 3) – The definitive formulation of the paradox.
  2.  **Thomas Nagel**, *The View from Nowhere* – Discusses agent-relative vs. agent-neutral reasons.
  3.  **Bernard Williams**, "A Critique of Utilitarianism" – The classic defense of integrity against the "math" of ethics.
  4.  **Frances Kamm**, *Intricate Ethics* – A modern deontological attempt to resolve the paradox without abandoning constraints.

  You have correctly identified that the rule appears "decoupled from its original purpose." The philosophical debate is precisely about whether the purpose of the rule was ever to minimize outcomes, or if the purpose was to define the boundaries of permissible agency.
