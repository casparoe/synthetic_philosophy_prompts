answer: |-
  1. Setup and What We Should Come Away Seeing
  In "The Two Rivers," students allocate resources between a local crisis (River A) and a distant one (River B). River A has many rescuers; River B few. Points reflect impact. If too many choose River A, efforts overlap and waste points. River B offers guaranteed saves. This reveals our preference for the "child in front of us" relies on assuming no one else will help. Making local help redundant shows distance isn't the barrier; fungibility is. Obligation shifts when action is unique, miles irrelevant.

  2. Materials, Roles, and Rules of Play
  You need two boxes labeled "Local River" and "Distant River," 28 tokens (2 per student), and a scoreboard. Students are "Rescuers." Each token represents one unit of effort. Saving a life costs 1 token. Local River lives are "fragile": if 2+ tokens are spent on the same specific life slot, the second is wasted (fungibility). There are 10 Local slots. Distant River lives are "isolated": every token saves a unique life (non-fungible). There are 20 Distant slots.
  Payoff: The group earns 1 "Community Point" per unique life saved. If Community Points > 25, everyone gets extra snack budget. If < 25, the facilitator chooses the next topic. Crucially, students secretly place tokens in boxes simultaneously. After Round 1, reveal overlap in the Local box. In Round 2, allow brief communication. The tension arises because saving the Local life feels urgent, but if three people try, only one counts. The Distant life feels abstract, but your token guarantees survival. This creates a conflict between emotional proximity and effective altruism. Students must decide whether to follow intuition or maximize impact.

  3. Timeline of the Session
  0-10 min: Introduction. Explain the crisis scenario without revealing the fungibility rule yet. Hand out tokens. 10-25 min: Round 1. Students secretly allocate tokens. Count results. Reveal the "wasted" local efforts due to overlap. Show the scoreboard. 25-35 min: Strategy Discussion. Students realize local efforts collided. They discuss the frustration of wasted effort versus guaranteed distant saves. 35-50 min: Round 2. Allow coordination. Compare results. Did they shift to Distant? 50-60 min: Debrief. Connect the wasted local tokens to the "child in the pond" intuition. Discuss why we assume we are the only rescuer nearby. Ensure the shift from "local is better" to "effective is better" is articulated by students, not just lectured. Keep time strict.

  4. The Debrief: Mapping Play to the Argument
  Ask why Round 1 failed to maximize points. Students will cite confusion or habit. Guide them to see that Local tokens were wasted because others acted too. This mirrors real life: we rush to visible crises assuming we are the sole rescuer. Singer argues distance is irrelevant; this game adds that impact is what matters. When you saved the Local child, you assumed no one else would. The game proved others were there. The Distant River represents global aid: your contribution is unique because fewer people are giving. The tension you felt—the pull of the Local box—is the emotional weight of proximity. But the rules showed that proximity often brings competition, not unique obligation. The moral lesson isn't that local help is bad, but that our intuition ignores the likelihood of other rescuers. Singer's premise holds: if you can prevent something bad without sacrificing anything of moral significance, you should. The game shows that "without sacrificing" includes sacrificing the illusion of being the only hero. Ask: "Did distance stop you, or did the fear of wasting effort stop you?" This isolates proximity from fungibility. Finally, link the snack budget to moral significance: small sacrifice for large gain. The simulation makes this concrete: your token mattered more where no one else was.

  5. Predictable First-Run Failures and Fixes
  Students might ignore rules and talk during Round 1. Fix: Enforce silence strictly to simulate isolated decision-making. They might feel cheated by wasted tokens. Fix: Also emphasize this is the learning point, not a penalty. Some may hoard tokens. Fix: Remind them the goal is group points, not individual stockpiles. If everyone switches to Distant too fast, the Local need seems ignored. Fix: Clarify that Local needs exist, but efficiency matters. Ensure the "wasted" mechanic is clear visually. Use a clear overlay sheet to show overlapping tokens immediately.

  6. Honest Limitation: What the Activity Cannot Reproduce
  Ultimately, this simulation cannot reproduce the visceral emotional horror of seeing a drowning child. Singer's argument relies on reason overriding emotion, but the game gamifies suffering into tokens. It cannot capture the psychological cost of ignoring visible pain versus abstract statistics. You must verbally supply the gravity of real suffering, reminding them that tokens represent lives, not points. The game clarifies logic, not empathy.
