answer: |-
  ### 1. The Principle: Adversarial Record Integrity (ARI)

  Your tentative principle is sound in spirit but requires formal segmentation to cover all nine verdicts without contradiction. A single sentence cannot capture the distinction between *data generation* (Cases 1–4, 6, 8–9) and *hypothesis testing* (Case 7), nor the distinction between *chance* and *systematic error* (Case 5).

  I propose the **Principle of Adversarial Record Integrity (ARI)**, composed of three ordered clauses. This principle evaluates evidence based on the *resistance of the record to normal causal explanation* at the time of its creation and analysis.

  **Clause I: Procedural Security (Data Generation)**
  > *Evidential weight is proportional to the difficulty of producing the record by normal means (error, fraud, bias, or sensory leakage) at the time of recording.*
  > *   **Operational Rule:** A record is secure only if the protocol actively excluded normal channels *contemporaneously*. Mere post-hoc improbability of fraud is insufficient if the channel was physically or psychologically open (covers Cases 1, 2, 3, 4, 6, 8, 9).
  > *   **Motivation Weight:** Records generated by agents with an incentive for the *null* result (hostile investigators, indifferent archivists) carry higher weight than those by proponents (covers Cases 4, 6, 9).

  **Clause II: Statistical Aggregation (Chance Elimination)**
  > *Weak individual records may collectively evidence a general phenomenon only if the aggregation method secures against systematic bias, not merely random chance.*
  > *   **Operational Rule:** Aggregation validates existence claims against *chance* coincidences but does not validate individual instances against *memory reconstruction* or *selection bias*. The aggregate is strong evidence for a *rate*, but not for any specific *report* (covers Case 5).

  **Clause III: Predictive Risk (Hypothesis Selection)**
  > *A normal explanation defeats an anomaly only if it is either protocol-permitted (Clause I) or predictively risky (Clause III).*
  > *   **Operational Rule:** A post-hoc normal explanation that fits existing data without entailing new, falsifiable predictions does not defeat a secure record. A hypothesis that predicts the *disappearance* of the effect under tightened controls carries decisive weight (covers Case 7).

  ---

  ### 2. Application to New Cases

  **(a) The Sensitive-Operator Protocol**
  *Scenario:* Operator is the sensitive; fraud protocol is airtight; no one else can check readings.
  *   **Analysis:** This satisfies Clause I regarding *fraud* (operator cannot cheat), but fails Clause I regarding *error* (operator cannot verify their own subjective state independently). There is no "pressure to yield a null" on the *perception* itself, only on the *honesty*.
  *   **Verdict:** **Weak/Null.** Under ARI, a record is insecure if the observer and the instrument are identical. Self-deception is a "normal means" of production that the protocol did not exclude. It counts as a claim, not evidence.

  **(b) The Single Sealed Envelope**
  *Scenario:* One envelope, opened once, hostile committee, airtight procedure.
  *   **Analysis:** This maximizes Clause I (Procedural Security). The pressure to yield a null is extreme (hostile committee, sealed). However, it fails Clause II (Statistical Aggregation). $N=1$ cannot distinguish anomaly from rare chance.
  *   **Verdict:** **High Quality, Low Weight.** It is a "proof of concept" that the *method* can yield secure data, but it does not establish the *phenomenon*. It warrants replication, not assent.

  **(c) The Messy Administrative Correlation**
  *Scenario:* Vast retrospective data, no stake, mundane explanation known but rate enormous.
  *   **Analysis:** This satisfies Clause I (indifferent archivists = high pressure against bias) and Clause II (vast $N$). The conflict is with the "mundane explanation known."
  *   **Verdict:** **Conditional Strong.** If the "mundane explanation" quantitatively accounts for the rate, the evidence is null (Clause III). If the rate *exceeds* the mundane explanation's maximum prediction, the evidence is strong (Case 9 + Case 5). The key is whether the mundane explanation is *predictive* or *accommodative*. If it was derived from the same data, it is accommodative and carries little weight.

  ---

  ### 3. The Inconsistency: Case 5 and the Cheapest Abandonment

  You asked which verdict the principle cannot accommodate. **Case 5 is the inconsistency.**

  **The Conflict:**
  Your tentative principle (and ARI Clause I) states that evidence counts in proportion to the security of the *recording process*. In Case 5, the recording process for the individual is retrospective self-report (insecure, subject to memory reconstruction). The recording process for the aggregate is *mathematical analysis of those same insecure reports*.
  If the individual data is "worth nothing" because memory reconstruction cannot be excluded, the aggregate data is *also* vulnerable to memory reconstruction. If 10% of people reconstruct memories to fit deaths, the aggregate rate will be inflated. The statistical significance rules out *chance*, but it does not rule out *systematic psychological bias*.

  **Can Case 5 be saved?**
  It can be saved only by refining the verdict, not the principle. You must distinguish between **Evidence for Existence** vs. **Evidence for Specificity**.
  *   *Saved Verdict:* The aggregate is strong evidence that *some* anomalous correlation exists in the population (Existence). The individual report is weak evidence that *this specific person* experienced an anomaly (Specificity).
  *   *Why:* The aggregate washes out *random* error, but not *systematic* error. If you assume memory errors are random relative to death dates, the aggregate holds. If you assume people are more likely to *remember* a vision if they hear of a death (confirmation bias), the aggregate collapses.

  **Which verdict is cheapest to abandon?**
  You should abandon the claim that the **Aggregate Survey is "Strong Evidence."**
  *   **Reasoning:** It is epistemically cheaper to downgrade the aggregate than to upgrade the individual. To upgrade the individual (Case 1 & 2) requires you to trust retrospective memory against your own stated intuitions about reconstruction. To downgrade the aggregate requires only acknowledging that *selection bias* and *confirmation bias* are systematic errors that statistics cannot fix without prospective controls.
  *   **Recommendation:** Treat the SPR survey as **Suggestive**, not Strong. It justifies further prospective study (like Case 2), but does not itself settle the matter. This aligns better with ARI Clause I.

  ---

  ### 4. Reconciling Cases 3 and 7

  There is a tension here: In Case 3, a *possible* normal explanation (leakage) defeats the anomaly. In Case 7, a *possible* normal explanation (post-hoc hypothesis) does *not* defeat the anomaly.

  **The Reconciliation:**
  The distinction lies between **Protocol-Permitted Causes** (Case 3) and **Theoretically-Possible Causes** (Case 7).

  *   **Case 3 (Protocol-Permitted):** The possibility of leakage indicates a failure of **Clause I (Procedural Security)**. The record was *not* secured against normal channels *at the time of creation*. Therefore, the record is inherently ambiguous. The burden is on the experimenter to seal the channel *before* the trial.
  *   **Case 7 (Theoretically-Possible):** The post-hoc hypothesis accepts the record as secure (Clause I is satisfied) but challenges the *interpretation*. ARI Clause III states that a normal explanation only defeats the anomaly if it is **predictively risky**. A "just-so" story that fits the data but predicts nothing new adds no information and cannot defeat a secure record.

  **Which standard to drop?**
  Do not drop either; they apply to different stages.
  *   However, if forced to choose: **Soften Case 3.** "Mere possibility" is too strict if the probability of leakage is vanishingly small. The standard should be "Reasonable Possibility given the Protocol." If the protocol made leakage *highly improbable* (though not logically impossible), the case should stand. Your current verdict ("mere possibility seems to me sufficient") is the weaker link. It invites the "God of the Gaps" problem where any logical possibility, no matter how contrived, kills the evidence.
  *   **Better Standard:** A normal explanation defeats the anomaly if it is **more probable than the anomaly given the protocol**. In Case 3, leakage was likely *enough* to warrant rejection. In Case 7 (Hypothesis 1), the post-hoc story was not *demonstrated*, so it remains less probable than the anomaly.

  ---

  ### 5. Sidgwick's Distinction: Telepathy vs. Survival

  **Does the principle license the inference from "Information Channel Among Living" to "Survival of Death"?**

  **No.**

  **Reasoning:**
  Under ARI, establishing an anomaly requires securing the record against *all* known normal (and established anomalous) channels.
  1.  **Telepathy among the living** establishes that information can transfer without sensory organs. This removes the "sensory barrier."
  2.  **Survival of death** requires establishing that the information source persists *after biological cessation*.
  3.  **The Gap:** If telepathy among the living is real, it becomes a **natural faculty** for the purpose of testing survival. To prove survival, you must rule out telepathy from a living agent (e.g., a grieving relative, or the medium's own subconscious scanning the living). This is often called the "Super-ESP" or "Living Agent Psi" hypothesis.

  **The Evidential Condition Required:**
  To move from Telepathy to Survival, you need a case where the information channel is **secure against any living mind**.
  *   **Condition:** Veridical information must be produced that **no living person could possibly know**, even via telepathy.
  *   **Example:** A deceased person provides specific, verifiable details about a location or object that was unknown to *any* living person at the time of death (and remains unknown until verification), or details about the post-mortem state that are conceptually inaccessible to the living.
  *   **Why:** If *any* living mind could hold the information, the "Pressure to yield null" is not met, because the "Telepathy from the Living" channel remains open. Survival is only established when the *source* of the information is demonstrably non-living. Sidgwick was correct: proving the channel exists does not prove the source survives the body. The ARI principle demands the channel be secured against *all* living agents before inferring a non-living one.

  ### Summary of Recommendations

  1.  **Adopt ARI:** Use the three clauses (Procedural, Statistical, Predictive) to formalize your intuitions.
  2.  **Downgrade Case 5:** Treat the aggregate survey as "Suggestive" rather than "Strong." It cannot overcome systematic memory bias without prospective controls.
  3.  **Refine Case 3:** Shift from "mere possibility" to "reasonable probability of leakage given protocol."
  4.  **Maintain Sidgwick's Gap:** Do not infer survival from telepathy. Require evidence secure against *all* living agents (Super-ESP exclusion).
  5.  **New Cases:** (a) is weak (self-verification), (b) is high-quality but low-weight (N=1), (c) is strong only if the mundane explanation is quantitatively insufficient.
