answer: |-
  ### Brainstorming & Conceptual Mapping

  Let's break this down by mapping your scenario against the three nearest neighbors in decision theory: **Counterfactual Mugging**, **Newcomb's Problem**, and **Anthropic/Sleeping Beauty scenarios**.

  1.  **Vs. Counterfactual Mugging (CFM):**
      *   *Standard CFM:* You are asked to pay in the *actual* world to satisfy a condition in a *counterfactual* world (e.g., "If the coin had landed Tails, I would have tortured you, but since it landed Heads, just pay me and I won't simulate the Tails world"). The key feature of CFM is that the threatened harm exists in a branch that *does not obtain*. You are paying to be the kind of agent who *would* have paid, benefiting a version of you that never exists.
      *   *Your Case:* The harm *does* obtain. One simulation is tortured. The XOR constraint means the suffering is real in the multiverse/computational ensemble, even if you don't experience it.
      *   *Divergence:* In CFM, the decision is about *acausal influence on non-actualized possibilities*. In your case, it is about *acausal influence on self-location within actualized branches*.

  2.  **Vs. Newcomb's Problem:**
      *   *Newcomb:* Your choice correlates with the content of a box. One box vs. two boxes.
      *   *Your Case:* Your choice correlates with *which simulation you are*. This adds an indexical layer ("Am I Sim A or Sim B?") that standard Newcomb lacks. In Newcomb, you know you are the agent deciding. In your Case 2, your decision partly determines *whether* you are the agent deciding or the agent suffering.

  3.  **Vs. Anthropic Reasoning (Sleeping Beauty):**
      *   *Sleeping Beauty:* Waking up gives you information about which day/branch you are in.
      *   *Your Case:* The decision *creates* the anthropic fact. If you refuse, you become the tortured copy. This is "Decision-Theoretic Anthropics." It's not just updating on where you are; it's choosing where you are (or where your continuity of consciousness goes).

  4.  **The XOR Constraint:**
      *   The "Exactly One" condition creates a zero-sum game across branches. From a "God's eye view" (the Predictor's view), total suffering is constant (1 unit) regardless of your choice, *unless* paying prevents the torture entirely.
      *   *Wait, re-reading your setup:* "Pay 1000 utils... OR they flip a coin and torture exactly one."
      *   If you pay: 1000 utils lost, 0 torture.
      *   If you refuse: 0 utils lost, 1 simulation tortured.
      *   The XOR is on the *refusal* branch. If you refuse, the harm is distributed across the counterfactual copies such that exactly one suffers.
      *   This implies that if you refuse, you face a probability (say 50%) of being the tortured one. If you pay, you face 100% certainty of losing utils but 0% torture.
      *   This transforms the problem from "Altruism across worlds" (CFM) to "Risk Management across selves."

  ### Classification & Naming

  **Is there an established name?**
  No. There is no standard label in the literature (e.g., from MIRI, FDT papers, or Parfit) that specifically captures this "XOR-distributed harm across simulations" structure.
  *   It is not *Logical Counterfactual Mugging* (that deals with logical uncertainty, like the parity of a digit of pi).
  *   It is not *Psychopath Button* (that is about killing others correlated with you).
  *   It is closest to variations of **"Acausal Trade"** or **"Simulation Blackmail,"** but those are too broad.

  **Proposed Name:**
  I propose labeling this **"Indexical XOR Blackmail"**.

  **Boundary Conditions:**
  1.  **Branch Actualization:** Unlike CFM, the threatened harm occurs in a branch that is computationally/physically realized (even if you aren't in it).
  2.  **Mutual Exclusion:** The harm is constrained by an XOR function across copies (Exactly One suffers).
  3.  **Indexical Selection:** The agent's decision influences (or correlates with) which copy they "are" (Case 2) or which copy suffers (Case 1).

  ### Decision Calculus: Real Distinction or Decorative?

  This is not just decorative framing; it introduces a genuine technical divergence in how different decision theories calculate utility, specifically regarding **Self-Location** vs. **Global Policy**.

  1.  **Causal Decision Theory (CDT):**
      *   *Analysis:* CDT looks at causal consequences of the action *here*. "If I don't pay, *I* might get tortured (50%). If I pay, *I* lose 1000 utils."
      *   *Result:* CDT treats the other simulation as a separate entity. It calculates expected utility based on the probability of *being* the tortured copy. It behaves like a standard gamble.
      *   *Divergence:* In standard CFM, CDT refuses to pay because the counterfactual world doesn't exist. Here, CDT might pay simply to avoid the risk of personal torture. The calculus shifts from "irrational altruism" (CFM) to "rational risk aversion."

  2.  **Functional/Timeless Decision Theory (FDT/UDT):**
      *   *Analysis:* FDT treats the algorithm as the unit of agency. It asks: "What output of my algorithm maximizes utility across all instantiations?"
      *   *The XOR Twist:* If the algorithm outputs "Refuse," the XOR constraint ensures one copy suffers. If the algorithm outputs "Pay," no copy suffers (but utils are lost).
      *   *Divergence:* In standard CFM, FDT pays to satisfy the counterfactual condition (optimizing the policy). In Indexical XOR Blackmail, FDT pays to minimize *actual* suffering across the ensemble.
      *   *Crucial Difference:* In CFM, the benefit is purely "logical consistency." In XOR Blackmail, the benefit is "reducing measure-weighted suffering." If you care about the sum of utility across all copies, the calculus is Utilitarian. If you care only about your subjective stream, it's Egoistic.

  3.  **The "Vanishing" Condition (Case 2):**
      *   If paying makes *you* vanish and the other copy takes the hit, this is effectively **Suicide Blackmail**.
      *   Standard CFM never asks you to cease existing; it asks you to transfer resources.
      *   This changes the utility function drastically. If "vanishing" = death, a selfish agent might refuse even if it means torture, preferring existence with pain over non-existence. This is a divergence from standard mugging where survival is guaranteed.

  ### Confidence & Uncertainty

  **Confidence Levels:**
  *   **High Confidence (90%+):** This is not standard Counterfactual Mugging. The ontological status of the harmed branch (actualized simulation vs. non-actualized counterfactual) is a hard technical distinction in decision theory.
  *   **High Confidence (85%):** "Indexical XOR Blackmail" is not an established term. You have identified a composite structure that hasn't been canonicalized.
  *   **Medium Confidence (70%):** FDT/UDT handles this cleanly by optimizing the global algorithm, whereas CDT fractures on the indexical uncertainty.

  **The Point of Least Certainty:**
  I am least sure about the **normative weight of the "other" copy in Case 1**.
  *   *The Ambiguity:* Does the agent care about the other simulation? In standard decision theory, we usually assume the agent maximizes their *own* expected utility.
  *   *The Divergence:* If the other simulation is "you" (same algorithm, same memories up to the split), does its suffering count as *your* suffering?
      *   If **Yes** (Open Individualism/Global Utilitarianism): The XOR structure forces you to minimize total suffering. Paying (1000 loss) vs. Refusing (1 Torture). You compare 1000 utils to the disutility of torture.
      *   If **No** (Closed Individualism/Selfishness): You only care about the branch you experience. Refusing becomes a gamble: 50% chance of torture, 50% chance of freedom.
  *   *Why I'm unsure:* Standard Counterfactual Mugging bypasses this by making the other world *counterfactual* (so you don't exist there anyway). Your XOR setup forces the question: "Do I care about the copy I don't inhabit?" Decision theory doesn't have a consensus on how to weight utility across mutually exclusive subjective experiences of the same algorithm. This is the "Measure Problem" in anthropics bleeding into decision theory.

  ### Conclusion

  You are carving out something real. This is **Indexical XOR Blackmail**.

  It differs from Counterfactual Mugging because the harm is **actualized** in the multiverse ensemble, not merely counterfactual. It differs from Newcomb's Problem because the correlation determines **self-location** (which copy is "me"), not just external rewards.

  **Does it change the calculus?**
  Yes.
  1.  **For CDT:** It turns an "irrational" payment (in CFM) into a rational gamble against personal torture.
  2.  **For FDT:** It shifts the optimization target from "logical consistency across possibilities" to "measure-weighted utility across actualizations."
  3.  **For Identity:** It forces a explicit choice on whether you value your algorithm's total output or just your current subjective thread.

  The "XOR" framing is not decorative; it enforces a zero-sum constraint on suffering across branches that standard mugging lacks. In standard mugging, the suffering is avoided entirely if you pay. In your XOR Case 1, if you refuse, suffering *must* happen to someone. That makes it a problem of **distributed responsibility**, not just individual prudence.

  **Least Certain Claim:** Whether a rational egoist *should* count the other copy's torture as a negative utility for themselves. This depends on resolving the metaphysics of personal identity (Parfitian reductionism vs. Cartesian ego), which decision theory assumes but does not solve. If you treat the other copy as "not me," the XOR structure collapses into a simple probability gamble. If you treat them as "me," it becomes a utilitarian calculation. Standard decision theory doesn't dictate which view is correct, making the "optimal" move contingent on your philosophy of mind, not just your decision algorithm.
