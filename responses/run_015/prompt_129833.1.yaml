          *   The "Garbage In, Garbage Out" problem: If the extra foundations (Loyalty, Authority, Sanctity) track morally irrelevant features (e.g., purity violations that harm no one), accommodating them is a bug, not a feature.
          *   Genetic Fallacy/Is-Ought: Even if phrased defeasibly, deriving normative weight *solely* from psychological prevalence is a category error unless a bridge principle (e.g., "Intuitions are generally reliable") is established.

      *   *Strong (Significantly weakens the claim):*
