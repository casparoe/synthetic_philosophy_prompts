          *   *The Is-Ought Gap (Hard Version):* Even defeasible inference requires a bridge principle. Without arguing *why* psychological prevalence tracks truth, the inference is invalid.

      *   **Category 2: Strong Defeaters (The Premises Break):**
          *   *Liberal Subsumption:* Argue that liberals *have* these foundations but conceptualize them differently. (e.g., Sanctity of the body = Autonomy). If the asymmetry is illusory, the premise fails.
