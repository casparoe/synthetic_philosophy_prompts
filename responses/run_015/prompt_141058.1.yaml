  After the prose, give me a table with columns: Original claim (one sentence, in their terms) | Restatement in my vocabulary | Distortion (what had to be bent to fit) | Verdict (translates cleanly / only with distortion / no counterpart) | Whose problem (my vocabulary is missing something, or the original claim was unclear). One row per claim, and keep the rows that don't translate — those are the ones I care about.
