answer: |-
  **MEMORANDUM**

  **TO:** Executive Board, Local [Number]
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Strike Conduct and Bylaw Review

  **Context**

  As you know, we are scheduled to vote on the disciplinary status of Member [Name] at Thursday's meeting. We are all still running on fumes from the strike, and tempers are high. That's expected. But the decision we make this week will set the tone for our local for the next contract cycle, and potentially longer.

  We have three positions on the table: expulsion, censure with a fine, or no disciplinary action. I've reviewed the bylaws, spoken with members from all three factions, and looked at the precedent this sets for our bargaining power in two years.

  **Recommendation**

  I am recommending that the Executive Board take **no punitive disciplinary action** (no expulsion, no fine, no formal censure) against Member [Name].

  However, this recommendation comes with a mandatory condition: We must immediately convene a Bylaw Review Committee to overhaul the Strike Fund eligibility rules, specifically regarding hardship exemptions and application windows, to be ratified before the next potential job action.

  **Reasoning**

  I know this is going to be a hard sell for some of you. Here is why this is the only move that protects the local in the long run.

  **1. The Principle of Mutual Aid**
  Our strike fund exists to ensure that financial hardship doesn't break solidarity. In this specific case, the mechanism failed. Member [Name] didn't cross the line because she disagreed with the union; she crossed because the safety net we built had a hole in it exactly where she fell. The fund was undercapitalized, and the administrative window was rigid. If we punish a member for surviving a crisis that our own support system didn't cover, we are effectively admitting that our mutual aid is conditional on members not actually needing it. That undermines the core promise of the union.

  **2. Membership Cohesion vs. Abstract Discipline**
  We are a small local. 500 members. We cannot afford to fracture. Expelling a member reduces our dues base and our body count on the line next time. More importantly, fining a single mom who is already behind on rent creates a martyr. It validates every piece of anti-union propaganda about us caring more than dues than people. If we fine her, we aren't proving we're tough; we're proving we're cruel. That demoralizes the rank-and-file more than letting one person slide does.

  **3. The Precedent for Next Contract Cycle**
  Management is watching this. If we expel or fine her, they will use it. They'll tell our members in two years: *"The union will fine you if you can't pay rent. They don't care about your family."* If we choose no action but tighten the rules for next time, the message is: *"We made a mistake in our support system, we fixed it, and we take care of our own."* That builds loyalty, which is what we need when we walk out next time.

  **Addressing the Counter-Argument (Solidarity & Discipline)**

  I want to speak directly to the faction arguing for expulsion or fines. I hear you, and your point is valid: **Solidarity requires risk.** If crossing the picket line becomes a viable option for anyone facing hardship, the strike threat is weakened. If everyone calculates their own "walk-away point" based on personal savings, we lose leverage. You are worried that if there are no consequences, discipline evaporates next time.

  That is a real risk. But punishment in *this* instance doesn't fix that risk—it just punishes the symptom. The way we ensure discipline next time isn by making an example of the poorest member when our fund failed her. It's by ensuring the fund actually works so that financial pressure isn't the reason people cross.

  We uphold solidarity not by punishing weakness, but by removing the necessity of it. If we fix the fund rules, we remove the excuse for crossing. Punishing [Name] now doesn't make the strike fund richer or the rules clearer. It just leaves us with one less member and a lot of anger.

  **On the Strike Fund Rules**

  Some have argued that changing the strike fund rules now looks like we are reacting to one sympathetic case. I disagree.

  Acknowledging a flaw in our bylaws isn't weakness; it's adaptability. The current window (deadline one week into strike) assumes everyone has savings to bridge that gap. That assumption was wrong. We should view this not as "changing the rules for her," but as "closing a loophole for us."

  If we vote no action *without* changing the rules, then yes, it looks like favoritism. But if we vote no action *and* mandate a rewrite of the hardship clause immediately, it shows we are learning. We can propose a tiered system or an emergency review board for future strikes so that no one is forced to choose between rent and the picket line.

  **Next Steps**

  1.  **Vote:** Move to close the disciplinary file on Member [Name] with no record of violation.
  2.  **Statement:** Issue a brief statement to the membership acknowledging the tension. We affirm that crossing the line is a serious breach, *but* acknowledge the Strike Fund did not function as intended for this member.
  3.  **Committee:** Appoint a 3-person committee (representing the differing views on this board) to draft proposed bylaw changes for the Strike Fund by January 1st.

  We're all exhausted. We won some good language in the contract, but we're bruised. Let's not finish this fight by beating up one of our own when the system we built is the thing that actually broke.

  Let's discuss Thursday.
