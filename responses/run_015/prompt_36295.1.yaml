prompt: |-
  So this just landed in my lap and I need to get something written before our next exec board meeting. I'm on the executive board of a small local, around 500 members, mostly warehouse and drivers. We just came off a two-week strike that ended three weeks ago, and it went about as well as these things go — we won some of what we wanted, everyone's exhausted, feelings are still raw.

  Here's the issue. During the second week of the strike, one of our members crossed the picket line and worked her shifts. She's a single mom, was already behind on rent, and she'd applied for strike fund support late — like a week after the deadline. Our fund rules are pretty rigid about the window (partly because the fund itself was running low by week two), so her application was denied on a technicality, and she went back to work two days later. No secret about it, she's never denied it, and she said something at the general meeting like she couldn't let her kid get evicted for a fight that was mostly about scheduling language anyway.

  Now the board is split three ways and it's getting ugly. One faction wants her expelled under our bylaws, arguing that solidarity is the whole point — if crossing the line when it gets hard is an option, then the strike threat is empty and next time everyone's hardship will conveniently arrive right on schedule. Second faction wants a formal censure plus a fine (the bylaws allow fines for "conduct unbefitting a member," which is doing a lot of work there). Third faction says anything punitive is insane: we're a small local, she's a member in good standing otherwise, and punishing the poorest member for being poor is a great way to make the case for every anti-union organizer who's ever said unions force people to choose between their kids and their dues.

  I'm supposed to circulate a written recommendation before Thursday. What I keep running into is that this doesn't feel like a pure rules question — it's more like the classic thing where collective action only works if enough people hold the line, but the burden of holding it lands very unevenly, and the fund we built precisely to spread that burden had a hole in it exactly where she fell through. Expel her and we're saying the union's promise of mutual aid is conditional in the one situation it was designed for. Do nothing and the next strike starts with everyone privately calculating their own walk-away point.

  Draft me the memo: a clear recommendation (expulsion, censure and fine, some third option, or no action at all), plus reasoning the board can actually act on. Deal with the strongest argument on the losing side honestly — whichever side loses, someone on this board is going to be furious, and I'd rather the memo show we took them seriously. Also worth addressing: whether we should fix the strike fund window thing, or if changing the rule mid-aftermath looks like we're just reacting to one sympathetic case. And keep in mind our contract talks come back around in under two years, so whatever precedent we set here is one we'll live with next time the line actually matters.

  typos are fine in your draft, i'll clean up before it goes out lol
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Small local union (500 members, warehouse/drivers). Recent 2-week strike (ended 3 weeks ago). Mixed results, exhaustion, raw feelings.
      *   **The Incident:** One member (single mom, financial hardship) crossed the picket line in week 2. She applied for strike fund late (missed deadline by a week), was denied due to rigid rules/low funds. She admitted crossing, cited housing insecurity for her child.
      *   **The Conflict:** Board is split 3 ways:
          1.  Expulsion (Solidarity argument).
          2.  Censure + Fine (Middle ground/Bylaws argument).
          3.  No Action (Hardship/Solidarity argument).
      *   **The Task:** Draft a memo for the Executive Board with a clear recommendation and reasoning.
      *   **Requirements:**
          *   Clear recommendation (Expulsion, Censure, Third Option, or No Action).
          *   Address the strongest argument of the losing side honestly.
          *   Address the strike fund rule (fix it now or wait?).
          *   Consider precedent for future contract talks (2 years out).
          *   Tone: Professional but grounded in union reality (not overly corporate, but serious).
          *   Note: Typos are fine (user will clean up).

  2.  **Determine the Recommendation:**
      *   *Option 1: Expulsion.* Too harsh. Kicks out a member for being poor when the safety net failed her. Damages union reputation internally and externally. Sets a precedent that hardship doesn't matter.
      *   *Option 2: Censure + Fine.* Punitive. Fines a single mom who is behind on rent. Contradicts the principle of mutual aid. Likely to cause a rift in the membership.
      *   *Option 3: No Action.* Risks undermining strike discipline. "Why did I starve if she didn't?"
      *   *Option 4: Third Option (Restorative/Conditional).* This is usually the best path for unions trying to maintain cohesion. Acknowledge the breach, but acknowledge the system failure.
      *   *Decision:* I need to pick one that is actionable and defensible. The prompt asks for *a* clear recommendation.
      *   *Analysis:* Expulsion is political suicide for a small local. Fines are uncollectible and cruel. No action feels like surrendering the principle of solidarity.
      *   *Best Path:* **No Punitive Action, but with a Formal Acknowledgment and Immediate Rule Reform.** Why? Because the union failed her first (strike fund deadline). Punishing her for the union's administrative rigidity during a crisis undermines the *actual* solidarity (mutual aid). However, we can't just say "crossing is fine." We need to reaffirm the line while admitting the safety net had a hole.
      *   *Wait, looking closer:* If I recommend "No Action," the pro-discipline faction will revolt. If I recommend "Expulsion," the pro-hardship faction will revolt.
      *   *Strategic Choice:* The most sustainable position for a *small* local (500 members) is preserving membership and morale over abstract discipline. Expelling a member reduces bargaining power (fewer dues, fewer bodies). Fining her creates a martyr.
      *   *Refined Recommendation:* **No punitive action (no expulsion, no fine), BUT a formal statement reaffirming strike discipline and an immediate commitment to reform the strike fund bylaws.** This splits the difference: we uphold the *principle* (crossing is bad) but acknowledge the *reality* (the fund failed).
      *   *Actually, looking at the "Third Option" prompt hint:* The prompt mentions "some third option." A restorative justice approach works well in unions. Maybe she donates time instead of money? Or she presents to the membership?
      *   *Let's go with:* **No Punitive Action.** Why? Because the strike fund denial was the catalyst. The union broke the mutual aid contract first. Punishing her now compounds the error. The "discipline" comes from fixing the rules so it doesn't happen again.
      *   *Wait, I need to be careful.* If I say "No Action," the pro-solidarity faction (Expulsion/Fine) needs to feel heard. I need to explicitly state that crossing *was* a violation, but punishment is counter-productive.
      *   *Alternative:* **Suspended Sentence.** Find her in violation, but suspend the penalty contingent on X.
      *   *Best Recommendation for Stability:* **No Disciplinary Action.** Focus on the systemic failure. It's the only one that doesn't tear the local apart or look bad to the wider labor movement. I will argue that solidarity includes catching people when they fall, and we failed to catch her.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose. Acknowledge the difficulty.
      *   **The Facts:** Briefly recap the situation (neutral tone).
      *   **The Recommendation:** Clear and bold. No expulsion, no fine.
      *   **Reasoning (The "Why"):**
          *   *Mutual Aid:* The fund failed her. We can't punish for a safety net failure.
          *   *Membership Strength:* 500 members. Losing one isn't huge, but the *chill* it creates is.
          *   *Public/Management Optics:* "Union fines single mom" is a terrible headline for the next contract fight.
      *   **Addressing the Opposition (The "Solidarity" Argument):** Acknowledge that crossing the line weakens leverage. Validate their anger. Explain why punishment *now* hurts more than it helps (divisiveness).
      *   **The Strike Fund Rule:** Address the "mid-aftermath" concern. Argue that fixing it now isn't about her, it's about *next time*. It turns a failure into a lesson.
      *   **Next Steps:** Vote, communicate to membership, form committee for bylaw review.

  4.  **Refining the Tone:**
      *   Needs to sound like a union officer talking to other officers. Not too legalistic, but serious.
      *   Use terms like "solidarity," "mutual aid," "bargaining power," "membership cohesion."
      *   Acknowledge the exhaustion ("we're all tired").
      *   Allow for the typos note (I won't intentionally typo, but I won't obsess over perfect polish).

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "No Action" too weak?
      *   *Fix:* Frame it as "Prioritizing Long-Term Cohesion Over Short-Term Discipline." Make it sound strategic, not soft.
      *   *Critique:* What about the rule change looking reactive?
      *   *Fix:* Frame it as "Closing the Loophole." Admit the rule was too rigid. It shows we learn.
      *   *Critique:* Did I address the "conduct unbefitting" bylaw?
      *   *Fix:* Yes, interpret it. "Conduct unbefitting" shouldn't apply to survival choices when the union's aid mechanism failed.

  6.  **Final Polish:** Check against constraints.
      *   Clear recommendation? Yes.
      *   Address strongest losing argument? Yes (the solidarity/discipline argument).
      *   Address strike fund rule? Yes.
      *   Precedent for future talks? Yes.
      *   Typos allowed? (I will write cleanly but keep the voice natural).

      *(Self-Correction on the Recommendation)*: Actually, a "Third Option" might be stronger politically. What if the recommendation is **No Financial Penalty/Expulsion, but a Requirement to Speak to the Membership?** No, that's shaming.
      Let's stick with **No Disciplinary Action.** It's the cleanest break. The "punishment" is the scrutiny she's already under. The "win" for the discipline crowd is the rule change.

      *Wait, one more thought:* If I recommend no action, I need to make sure the "Solidarity" faction knows their point is being codified for *next time*. The recommendation must include an immediate Bylaw Review Committee mandate. That gives the "Discipline" faction a win (we are tightening rules) while sparing the member.

      *Revised Plan:*
      1. Recommendation: No disciplinary action against the member.
      2. Recommendation: Immediate formation of a committee to revise Strike Fund bylaws (hardship clauses).
      3. Reasoning: The union failed the mutual aid test first.
      4. Opposition: Acknowledge the risk to strike credibility, mitigate by promising stricter/fairer rules for next time.

      Let's write it.

      *(Wait, checking the prompt again)*: "Deal with the strongest argument on the losing side honestly."
      If I recommend No Action, the losing side is the Expulsion/Fine faction. Their argument is: "If crossing has no consequence, the strike threat is empty." I need to hit this hard.
      If I recommend Expulsion, the losing side is the Hardship faction.
      *Decision:* No Action is the only one that saves the local from internal civil war. Expulsion creates a martyr. Fines create resentment. No Action + Rule Change creates a path forward. I will write the memo supporting **No Disciplinary Action.**

      *Wait, is there a better "Third Option"?*
