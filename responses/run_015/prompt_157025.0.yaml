answer: |-
  # Q&A Prep Sheet: Mechanistic Interpretability Workshop

  **Time:** 40 Minutes
  **Audience:** 5 MechInterp (SAE/Steering), 2 Neuro (Place Cells/Lesions), 1 Phil Mind (Instrumentalist)
  **Goal:** Defend ontological realism of features without teleology; defend granularity-relativity without collapsing into "anything goes."

  ---

  ### 1. The Opening Concession (First Minute)
  *Before taking questions, offer this to disarm the "Philosophy Tax" crowd and soften the Instrumentalist.*

  "Before we open the floor, I want to concede two points upfront. First, to the engineers: adopting this representational realism adds zero predictive power to your ability to train or steer a model. If you just want to steer, you don't need my ontology. Second, regarding granularity: I am arguing that there is no 'God's eye' dictionary. That might sound like I'm watering down realism. I'm not. I'm claiming that *causal structure* exists at multiple resolutions, and denying the lower resolutions doesn't make the higher ones more real. I'm not trying to tell you which SAE sparsity is 'true,' only that the features you find at *any* stable sparsity are ontologically robust, provided they meet the mediation and misrepresentation conditions."

  ---

  ### 2. The Single Reply That Must Land
  *If this fails, the thesis collapses into instrumentalism. This is your anchor against the Senior Philosopher.*

  **The Core Distinction:** "Utility for *us* vs. Function for *it*."
  **The Reply:** "The Instrumentalist says representations are just a stance *we* take to predict the system. My counter is that the 'exploitable-misrepresentation' condition is internal to the system's dynamics, not external to our prediction. When a feature fires without its referent and the loss spikes *in a specific direction predicted by that absence*, that is a functional breakdown internal to the network's own objective function. It doesn't matter if *we* care about that loss spike. The network is 'punished' by its own architecture. That makes the representation a causal node in the mechanism, not just a label in our notebook."
  **Why it must land:** If you cannot distinguish "useful for the philosopher to describe" from "causally potent for the network to process," you have no realism, only descriptive convenience.

  ---

  ### 3. The Question You Hope Nobody Asks
  *The hidden vulnerability in the granularity argument.*

  **The Question:** (Likely from the Philosopher or a sharp MechInterp researcher)
  "If representations are granularity-relative, then the 'degradation' you rely on for the misrepresentation condition must also be granularity-relative. At a coarse grain, a feature's firing might look like noise; at a fine grain, it looks like error. If the *fact* of misrepresentation depends on which dictionary we choose to read the loss landscape, haven't you just pushed the interpreter's interest from the representation to the evaluation metric? How is this not instrumentalism with an extra step?"

  **Prepared Stumble:** "I... argue that the loss landscape is fixed."
  **The Trap:** The loss landscape is fixed, but *which features map to which dimensions of the loss* is exactly what is up for debate in your granularity thesis. If the mapping is relative, the "error" is relative.
  **Recovery:** "The loss scalar is absolute. The decomposition of that scalar into feature-contributions is relative. But the *correlation* between feature-activation and loss-spike is an empirical invariant at that grain. We aren't choosing the error; we are choosing the resolution at which we view the error mechanism." (Acknowledge this is the weakest link in the chain).

  ---

  ### 4. Ordered Objections (By Damage Potential)

  #### Objection #1: The Dilemma (Triviality vs. Instrumentalism)
  **Who raises it:** Senior Philosopher (framing) + MechInterp (technical execution).
  **Damage:** **Critical.** This attacks the coherence of your two conditions.

  **The Objection (Idiom: Philosophy/Engineering Hybrid):**
  "You're walking a tightrope.
  *Horn A:* If your 'intervention-mediation' and 'misrepresentation' conditions are purely structural, aren't they loose enough that the *entire network state* represents the *entire training distribution*? Any perturbation degrades performance. If everything represents everything, 'representation' is trivial.
  *Horn B:* To avoid triviality, you must restrict *which* degradations count. You say 'degrades in the way X's absence predicts.' But who decides which prediction matters? If it's us picking the feature dictionary to define the prediction, you've snuck the interpreter's interest back in. You've reinvented Instrumentalism and called it Realism."

  **The Best Answer (2 Minutes):**
  "I accept Horn A if 'represents' means 'is causally entangled with.' But my intervention condition requires *mediation*. The state must be a bottleneck through which information about X flows to the output. The whole network isn't a bottleneck for 'cat-ness'; specific subspaces are.
  Regarding Horn B: The 'prediction' isn't ours; it's the gradient's. When we say 'degrades in the way X's absence predicts,' we mean: if we intervene to silence this feature, the loss increases on inputs where X is present, specifically on labels associated with X. We aren't choosing the degradation; we are observing the *specificity* of the failure. If I silence a 'leg' feature and the model stops recognizing 'tables' (which often have legs), that's a specific degradation profile. That profile exists regardless of whether we care about tables. The 'interest' is in the network's weight configuration, which encodes the statistical dependencies of the training data. We are discovering the network's interests, not imposing ours."

  **Frank Note on Where This Fails:**
  This fails if the "specificity of the failure" is itself in the eye of the beholder. In high-dimensional superposition, features are polysemantic. If I silence a feature, the degradation might be distributed across 50 classes. I have to *interpret* that distribution as 'X-absence' to claim it represents X. If I need to interpret the degradation to validate the representation, I am back to the stance view. I need to lean harder on the *intervention* being the arbiter, not the post-hoc loss analysis.

  **Soft Spot:** The definition of "way X's absence predicts." In superposition, the 'way' is messy. If I have to clean up the mess to see the pattern, I am the interpreter.

  ---

  #### Objection #2: The "Philosophy Tax" (Engineering Utility)
  **Who raises it:** MechInterp Researchers (SAE/Steering focus).
  **Damage:** **High.** If they dismiss the talk, the room turns.

  **The Objection (Idiom: Engineering/SAE):**
  "Look, we have SAEs that reconstruct activation space with high fidelity. We can steer features and change output distributions. We know which features are 'real' because they steer. Why do we need a philosophical condition? You're adding metaphysical weight to something we treat as a linear algebra problem. Is your 'misrepresentation condition' actually testable, or is it just a story you tell after we've already found the feature?"

  **The Reply (2 Minutes):**
  "It's a guardrail, not a discovery tool. You're right: you find features via reconstruction error and steering. But you currently treat a feature as 'real' if it steers *coherently enough for you*. My condition specifies *how coherent*. It distinguishes between a feature that steers because it represents 'goldfish' versus a feature that steers because it's a 'high-frequency noise detector' that happens to correlate with goldfish in the train set.
  Without the misrepresentation condition, you can't distinguish a genuine representation from a spurious correlate that works in-distribution. My view tells you: if you can't find an input distribution where it fires without the concept and breaks the way the concept's absence predicts, you don't have a representation, you have a heuristic. That matters for robustness and safety, not just ontology."

  **Soft Spot:** They might retort that "robustness" is just another engineering metric, not an ontological one. You need to hold the line that robustness *reveals* structure, it doesn't just *optimize* it.

  ---

  #### Objection #3: The Empirical Gap (Causal Proof)
  **Who raises it:** Systems Neuroscientists.
  **Damage:** **Medium.** They respect the theory but want the data.

  **The Objection (Idiom: Neuroscience/Population Codes):**
  "In systems neuro, we don't claim a population code represents 'place' until we've done a lesion study and shown the decoder fails specifically on spatial tasks, not visual ones. You talk about 'intervention-mediation.' Have you actually run these interventions? Or is this a normative claim about how we *should* test SAEs? If it's the latter, isn't this just a proposal for a new benchmark, not a theory of mind?"

  **The Reply (2 Minutes):**
  "It is a proposal for a benchmark, but one grounded in theory of mind. In neuroscience, you lesion the hippocampus to test place cells. In MechInterp, we zero-out SAE features. I am arguing that the *logic* of your lesion study is exactly what vindicates realism.
  When you show a place cell fires in a specific location and lesioning it disrupts navigation *specifically*, you are satisfying my two conditions. I am simply formalizing what you already do successfully. The difference is I'm claiming this logic applies to the LLM's 'goldfish' feature just as much as your place cell. I'm not asking for new data; I'm asking you to recognize that the data you value (lesion + decoder failure) is what *makes* a representation real, not just useful."

  **Soft Spot:** They may press that biological systems have evolutionary teleology (the 'job' of navigation) which LLMs lack. You must reiterate that the 'job' is the loss function, not evolution.

  ---

  #### Objection #4: The Granularity Collapse (Ontological Inflation)
  **Who raises it:** Senior Philosopher.
  **Damage:** **Medium-Low.** Philosophical nitpicking, but can derail if not contained.

  **The Objection (Idiom: Philosophy of Mind):**
  "You say realism should be claimed at *each* grain of a nested dictionary. But if a coarse feature decomposes into five fine features, and both levels are 'real representations,' aren't you violating parsimony? Is the 'cat' feature real, or are the five 'whisker/ear/tail' features real? If both, you have overlapping ontologies. How do you avoid saying that *every* mathematical decomposition of the activation space is a 'real' set of representations?"

  **The Reply (2 Minutes):**
  "I am accepting ontological inflation to save causal realism. It is not that *every* decomposition is real, only those that are *stable under intervention*. Random rotations of the feature space won't satisfy the misrepresentation condition.
  Regarding the cat vs. whiskers: Both are real. The 'cat' feature is a real causal bottleneck for coarse-grained tasks. The 'whisker' features are real bottlenecks for fine-grained tasks. Reality is layered. A brick is real, and the atoms composing it are real. They aren't competing ontologies; they are descriptions of the same mechanism at different causal resolutions. I'd rather have too many representations than deny the causal power of the coarse ones because the fine ones exist."

  **Soft Spot:** This relies on a specific theory of "causal resolution" that might not hold in neural nets where superposition blurs the line between 'brick' and 'atom'.

  ---

  ### 5. Strategic Notes for the Room
  *   **To the MechInterp Group:** Do not use the word "teleology." Use "loss landscape" and "gradient signal."
  *   **To the Neuro Group:** Validate their methods. Frame your thesis as "Formalizing what you do with place cells."
  *   **To the Philosopher:** Do not get bogged down in "truth." Focus on "causal structure." If they push Instrumentalism, pivot to the "internal loss spike" argument (The Must-Land Reply).
  *   **General:** If the Dilemma (Objection #1) comes up early, spend your time there. It is the only objection that can kill the paper. The others are manageable friction.
