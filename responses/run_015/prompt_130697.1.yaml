      *Actually, looking closer at Move 5 (Maya's 2nd turn):* She says intransitivity is the problem coherence is designed to solve. That is true *by definition* of coherence. But Jonah's next point is that there are *many* coherencies. So Maya isn't wrong that coherence solves intransitivity, she is wrong that it solves it *uniquely*. I'll rate it "Technically Correct but Strategically Weak."

