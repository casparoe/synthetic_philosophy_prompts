answer: |-
  **Joint Statement of Adversarial Collaboration: Institutions vs. Geography**

  **I. Agreed Premises**
  1.  Unit of analysis is the polity over 1500–2000.
  2.  Primary outcome is log income per capita levels, not transient growth spells.
  3.  The "Reversal of Fortune" (1500 prosperity vs. today) is a robust empirical regularity.
  4.  Reversal establishes initial advantage is not self-perpetuating without mechanism.
  5.  Reversal does not negate geography's relevance in 1500.
  6.  Deep causes must operate via identifiable incentives/constraints within human lifetimes.
  7.  "Institutions" denotes enforceable formal rules (property, executive constraints).
  8.  "Geography" denotes exogenous biophysical constraints (disease, terrain).
  9.  Colonialism was a major shock altering institutional or disease trajectories.
  10. Persistence requires explanation; decay is possible.
  11. Correlation requires exogenous variation for causation.
  12. Models must distinguish level effects from growth rate effects.

  **II. Disagreements & Empirical Tests**

  | Crux | Inst. Claim | Geo. Claim | Test & Discriminatory Verdict | Predictions (Inst. / Geo.) | Falsification (Inst. / Geo.) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Levels vs. Growth** | Institutions set long-run growth rates; geography affects only levels. | Disease burden depresses growth rates; institutions adjust to geo constraints. | **Disease-removal:** Regions where malaria/hookworm were eliminated. **Verdict:** High discrimination if growth rates shift. | Inst.: One-off level shift. <br> Geo.: Sustained growth rate increase. | Inst.: Persistent growth change. <br> Geo.: No growth change. |
  | **Geo via Inst vs. Direct** | Geography acts *through* institutions (e.g., settlers brought rules). | Geography has large direct effects (productivity/health) independent of rules. | **Transplant:** Formal institutions imposed while terrain/disease stayed put. **Verdict:** Medium (confounds likely). | Inst.: Fast convergence to settler income. <br> Geo.: Slow/no convergence (terrain binds). | Inst.: No convergence. <br> Geo.: Rapid convergence. |
  | **Path Dependence** | Institutional breaks determine income breaks; initial conditions fade. | Initial geo conditions lock equilibria; shocks produce divergent paths based on timing. | **Pre-registered Archival:** Newly digitized census/land records. **Verdict:** High (guards against storytelling). | Inst.: Institutional change predicts income break. <br> Geo.: Continuous geo burden predicts continuous gap. | Inst.: Income breaks without inst changes. <br> Geo.: Income shifts without geo changes. |
  | **Verbal/Definition** | "Institutions" includes informal norms; culture is subsumed by rules. | "Institutions" is too broad; culture/geography are distinct deep causes. | **Portable-culture:** Migrant outcomes across destinations. **Verdict:** Low (culture/inst entangled). | Inst.: Outcomes converge to host rules. <br> Geo.: Outcomes persist with origin geo/culture. | Inst.: Persistence despite host rules. <br> Geo.: Convergence despite origin. |

  **III. Dissent: Culture-First Theorist**
  I refuse to sign Claims 6 and 7. Claim 6 demands mechanisms operate on a "human timescale," but cultural transmission is intergenerational and slow, often appearing as structure rather than choice. Claim 7 defines institutions as "formal rules," which is the core verbal dispute. If "institutions" absorb informal norms and trust (as the table's fourth row suggests), the institutions claim becomes unfalsifiable—any persistence is labeled "institutional." My refusal is substantive: norms constrain behavior differently than laws. A law can be repealed overnight; a norm of distrust persists. By defining institutions narrowly in Claim 7, you force culture into the error term, then claim victory when culture predicts outcomes. I accept Claim 12 (levels vs. growth), but argue culture affects both parameters differently than formal rules.

  **IV. Confidence Note**
  I am confident an adherent of the institutions view would accept Claims 1–12, as they mirror standard econometric defenses. The geography camp might balk at Claim 8 (exogeneity), arguing disease ecology is endogenous to development, but the "short run" qualifier protects it. I reconstructed the culture theorist's position from standard critiques of institutional determinism; specific scholars vary. The claim I am least sure of is Claim 5 ("Reversal does not negate geography's relevance in 1500"). Some geography theorists argue the reversal *was* driven by changing geographic advantages (e.g., temperate zones vs. tropics over time), while some institutions theorists argue it proves geography was never the cause. Claim 5 attempts a compromise that might satisfy neither fully.
