          *   Compensation: Both agree actual compensation is better than none. In Case Alpha Inter, the lack of compensation is bad for SP, maybe regrettable for AU but not decisive.
          *   Prudence: Both agree rational prudence allows intrapersonal sacrifice for later gain (Case Alpha Intra).
          *   Risk: Both agree ex ante expectations matter for policy (Case Beta), though they weigh ex post outcomes differently.
      *   *Refining for the prompt:* Need to ensure the claims are specific enough to be meaningful but broad enough for agreement.
      *   *Claim 1 (Aggregation):* Total well-being is a morally relevant metric, even if not the *only* one.
      *   *Claim 2 (Compensation):* Actual transfer of benefit from gainer to loser mitigates moral cost.
      *   *Claim 3 (Prudence):* Rational agents may accept early burdens for later gains within a single life (Case Alpha Intra is permissible).
