      3.  *Compensation as a Bridge:* Does the possibility of compensation validate the aggregation?

      *Refining Crux Descriptions:* Needs to be specific about what argument/verdict would be relevant.
      *   *Crux 1 (Prudence):* Whether the "unity of consciousness" is required for tradeoffs.
