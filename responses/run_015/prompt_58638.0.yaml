      *   *Self-Correction on Part 1:* Make sure the claims aren't so strong they contradict the disagreement in Part 2. For instance, don't say "Total well-being is the *only* thing that matters" in Part 1. Say it is *relevant*.
      *   *Self-Correction on Part 4:* Ensure predictions are distinct. AU predicts the consideration will support aggregation; SP predicts it will support separateness.

