              4.  For each crux: a description of a relevant argument/distinction/verdict + each party's prediction.
      *   **Definitions:**
          *   Utilitarianism: Right act maximizes total well-being.
          *   Objection: Treats distinct lives as stages of a single life, ignoring moral boundaries.

  2.  **Drafting - Part 1: Substantive Claims (Common Ground):**
