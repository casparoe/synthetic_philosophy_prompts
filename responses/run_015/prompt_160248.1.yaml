prompt: |-
  I hold a particular, sharpened version of the extended mind thesis, which I'll call the surrogate-substitution version. Its test is this: an external resource counts as a constituent of a subject's cognitive process just in case replacing it with an internal surrogate — a neurally realized structure with the same input–output profile, the same failure modes, and the same characteristic error signature — would not change what kind of cognitive process it is. The point of the test is to rescue the parity principle from triviality: rather than asking whether a notebook or a phone plays "the same functional role" as an internal store, which almost any external aid can be said to do, we ask whether the errors transfer. The view then commits itself to something checkable: a genuinely extended cognitive system should exhibit the error profile of the capacity it extends — reconstruction effects, interference, systematic distortion under load — at the level of the coupled system, and not merely inside the skull.

  Tell me what would count against this, ranked from fatal to merely awkward, and be explicit about which defeaters a defender of the view should concede and which they would rightly dismiss.

  I want the empirical exposure mapped first: what pattern of results would be decisive, and what would only be inconvenient? Say what to make of the often-cited result that people who expect later access to information retain where to find it rather than what it says, and of the related literature on couples and teams who divide up remembering — do these show a single system with one error profile, or two agents each with their own? What observation, if someone ran the experiment, would settle it against me?

  Then the conceptual exposure: cases the surrogate-substitution test cannot describe or describes wrongly — a resource a subject uses reliably but disowns and has no metacognitive access to, a predictive system that supplies thoughts before the subject has them, resources that pass the test for storing but have no analogue for perceiving or acting. Does the test secretly work only for memory-like cases?

  Then the structural questions. Does the view collapse into the weaker claim that cognition is causally dependent on and embedded in the environment, or into the claim that we are coupled to tools — and if so, is the disagreement merely verbal? Has it been insulated by treating "cognitive" as a term of art, and is that insulation legitimate here or a symptom? Finally, two things I personally find most threatening, on which I want your honest verdict: the argument from explanatory relevance, that no working cognitive-scientific explanation needs to cite the external resource as doing representational work, so that the thesis if true is idle; and the downstream commitments, that if the notebook is part of my mind then damaging it is a harm to me and its contents are mine in a way that shifts responsibility. Are those genuine defeaters, or just costs a defender should pay?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Thesis:** The user holds a "surrogate-substitution version" of the Extended Mind Thesis (EMT).
      *   **The Test:** An external resource is a cognitive constituent *iff* replacing it with an internal neural surrogate (same I/O, failure modes, error signatures) wouldn't change the *kind* of cognitive process it is.
      *   **Key Criterion:** Error transfer. The coupled system must exhibit the error profile of the capacity (reconstruction, interference, distortion) at the system level, not just inside the skull.
      *   **Goal:** Evaluate this view against potential defeaters, ranked from fatal to awkward.
      *   **Structure:**
          1.  Empirical Exposure (What results count against it? Specific cases like transactive memory/Google effect).
          2.  Conceptual Exposure (Cases the test misses or misdescribes: metacognitive access, predictive processing, non-memory domains).
          3.  Structural Questions (Collapse into embedding/coupling? Verbal dispute? "Cognitive" as term of art?).
          4.  Personal Threats (Explanatory relevance/idleness; Downstream commitments/harm/responsibility).
      *   **Tone:** Philosophical rigor, explicit ranking of defeaters, honest verdict on the "personal threats."

  2.  **Deconstruct the "Surrogate-Substitution Test" (SST):**
      *   *Strength:* It tightens the Parity Principle. It moves beyond "functional role" (which is often too loose) to "functional *vulnerability*" (error signatures). This avoids the "cognitive bloat" objection to some degree.
      *   *Weakness:* It relies heavily on memory-like architectures (storage/retrieval). It assumes internal surrogates are possible for all cognitive functions. It assumes error signatures are the mark of the "cognitive."

  3.  **Drafting Section 1: Empirical Exposure:**
      *   *Decisive Result:* If we find a resource that is *essential* for a task but has *no* internal error signature analogue. Example: A calculator. If I swap the calculator for a neural module, the neural module wouldn't make "calculation errors" in the same way (e.g., pressing the wrong button vs. neural noise). Or, more potently: If the external resource is *more* reliable than biology, and the system *relies* on that perfection. If the SST requires the external tool to fail like a brain, but the tool *doesn't* fail like a brain, does it fail the test?
      *   *The "Google Effect" (Sparrow et al.):* People remember *where* to find info, not the info.
          *   *User's View:* Does this pass SST? If I replace the internet with a neural module, would I remember "where" in my brain the info is? That sounds like source memory.
          *   *Defeater:* If the external system acts as a *directory* rather than a *store*, and the error profile is purely metacognitive (knowing that I don't know), does that count as extended cognition or just extended *access*?
          *   *Verdict:* This is awkward, not fatal. It suggests the extension is in the *metacognitive monitoring*, not the storage itself.
      *   *Transactive Memory (Couples/Teams):*
          *   *User's View:* Do they share an error profile? If Partner A forgets, does Partner B's retrieval fail in a way analogous to neural interference?
          *   *Defeater:* If the "system" error is just "Partner A didn't ask Partner B," that's a communication failure, not a cognitive reconstruction error.
          *   *Settling Experiment:* Measure reconstruction errors in a couple's joint recall vs. individual recall. If the joint recall shows *no* increase in schematic distortion (because they cross-check), but the SST says cognition *must* have biological error signatures, then the couple fails the test despite being highly integrated. *This is a strong empirical threat.* If high-fidelity external storage prevents the "cognitive" errors, the SST might exclude it *because* it's too good.
      *   *Decisive Observation:* A coupled system that performs a cognitive task *better* than biology precisely because it *lacks* biological error signatures (e.g., perfect recall via photo). If SST says "must have biological errors to be cognitive," then perfect external aids aren't cognitive. That seems counterintuitive.

  4.  **Drafting Section 2: Conceptual Exposure:**
      *   *Metacognitive Access/Disownership:* A resource I use reliably but think is external (e.g., a subconscious habit or a tool I treat as alien).
          *   *Issue:* SST focuses on I/O and errors, not ownership. This might actually be a *strength* of SST (avoids the "feel" of extension).
          *   *Defeater:* What if the resource is a predictive engine (AI) that supplies thoughts *before* I have them?
          *   *Issue:* If the AI predicts my next word, is it part of my mind? If I swap it for a neural predictor, does it have the same error?
          *   *Limit:* SST seems biased toward *memory/storage*. What about *perception*? A glasses lens. If I swap glasses for a neural correction, is the lens part of the visual process? The error profile of a scratch on a lens isn't a neural hallucination.
          *   *Verdict:* SST works best for memory. It struggles with perception/action where "error" looks different (distortion vs. noise).

  5.  **Drafting Section 3: Structural Questions:**
      *   *Collapse into Coupling/Embedding:*
          *   If the test is just "functional isomorphism including errors," is it just strong coupling?
          *   *Defense:* No, because coupling doesn't require error-profile identity. A hammer is coupled but doesn't fail like a hand.
          *   *Risk:* If "cognitive process" is defined loosely, it collapses. If defined strictly by the SST, it remains distinct.
      *   *"Cognitive" as Term of Art:*
          *   Is this just stipulating a definition?
          *   *Verdict:* It risks being a verbal dispute unless it yields new predictions. The SST *does* yield predictions (look for error transfer), so it's not merely verbal.

  6.  **Drafting Section 4: Personal Threats (The Honest Verdict):**
      *   *Explanatory Relevance (Idle Thesis):* "No cognitive science needs to cite the notebook."
          *   *Analysis:* If the notebook is just a causal input, standard CS works. If the notebook is a *constituent*, CS must model the notebook's dynamics as part of the cognitive algorithm.
          *   *Verdict:* This is a *cost*, not a defeater. But it's a high cost. If EMT doesn't change the *explanatory practice*, it's metaphysically interesting but scientifically inert. The SST helps here: if error profiles match, you *must* model them together to explain the errors. So SST saves it from idleness *if* the errors are coupled.
      *   *Downstream Commitments (Harm/Responsibility):* "Damaging the notebook is harming me."
          *   *Analysis:* This is the "Ethical Extension" argument.
          *   *Verdict:* This is a *reductio* for many. If my phone is my mind, deleting my photos is lobotomy?
          *   *Defense:* Distinguish *constituent* from *personhood*. A prosthetic limb is part of the body schema, but cutting it off isn't murder.
          *   *Honest Verdict:* This is the strongest pragmatic defeater. It makes the theory socially/legal untenable. A defender should concede the *metaphysical* point but deny the *ethical* leap (category error). However, if the metaphysics drives the ethics, this is fatal to the *utility* of the theory.

  7.  **Review and Refine:**
      *   *Ranking:* Need to ensure the ranking (Fatal vs. Awkward) is clear.
      *   *Tone:* Keep it analytical, challenging, but respectful of the specific formulation (SST).
      *   *Specific Focus:* The user asked about the "Google Effect" and "Transactive Memory" specifically. I need to ensure those get detailed treatment.
      *   *The "Error Profile" Trap:* I need to highlight that requiring biological error signatures might exclude *enhancements*. If I extend my mind to be *better* (less error-prone), the SST might say "not cognitive." That's a major tension.

  8.  **Final Polish:** Check against the prompt's specific constraints (Empirical first, then Conceptual, then Structural, then Personal Threats). Ensure the "Honest Verdict" on the two threats is distinct.

  *(Self-Correction during drafting)*: Wait, the user's test says "replacing it with an internal surrogate... would not change what kind of cognitive process it is." It doesn't strictly say the external resource *must* currently exhibit biological errors, but that a *surrogate* would. However, the prompt adds: "a genuinely extended cognitive system should exhibit the error profile of the capacity it extends... at the level of the coupled system." This implies the *actual* system must show the errors. This is the vulnerability. If I use a calculator, I don't make calculation errors (usually). If I swap it for a brain module, I would. So the calculator fails the test? That implies calculation isn't cognitive when done with a calculator. That seems wrong. I need to press this point.

  *Refining the "Google Effect":* If I remember *where* to find info, is that a cognitive process? Yes (metacognition). Does it have an error profile? Yes (forgetting the location). Does the internet have an error profile? No, it's stable. The *coupling* has the error profile. This passes SST.
  *Refining Transactive Memory:* If my wife remembers for me, and she forgets, is that a cognitive error of *my* system? If we are one system, yes. If we are two, no. The SST test asks: If I swap my wife for a neural module, is it the same process? If the neural module forgets via interference, and my wife forgets via distraction, are those the "same" error signature? This is the crux.

  *Final Plan:* Structure the response clearly with headings. Be direct. Don't hedge too much on the "Honest Verdict."

  *(Final Check on "Fatal" vs "Awkward")*:
  *   Fatal: If the theory excludes clear cases of enhancement (perfect memory) because they lack biological errors.
  *   Fatal: If the ethical implications make the theory unusable in practice (responsibility).
  *   Awkward: If it only works for memory, not perception.
  *   Awkward: If it's just a verbal dispute about "cognitive."

