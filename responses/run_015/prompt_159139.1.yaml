      *   *Reading C (Justification is Social):* Truth is what is good to believe, justified to peers, not by "The World." (Substantive/Defensible Pragmatism).
      *   *Reading D (Strong Antirepresentationalism):* No "way the world is" independent of description. Truth is a compliment to useful sentences. (Substantive/Controversial).
