prompt: |-
  Please adopt the role of a senior philosopher working at the intersection of environmental ethics, philosophy of biology, and normative decision theory. Before answering, take a few moments to brainstorm the conceptual tensions between ecological dynamics and sentient welfare, then proceed with careful, structured reasoning.

  I recently joined a conservation NGO and have been pulled into a strategic debate that feels philosophically deeper than my colleagues realize. Some staff argue that habitat destruction is, counterintuitively, a net welfare improvement for wild animals, because reducing an ecosystem’s carrying capacity prevents large numbers of future sentient beings from being born into lives dominated by predation, starvation, and parasitism. Others insist that preservation is always welfare-positive because disruption increases suffering among existing populations through starvation events, trophic cascades, and loss of shelter. A colleague recently proposed that we should evaluate any habitat intervention using what she calls a “sentient biomass welfare integral”—essentially weighting ecosystem biomass by estimated sentience capacity per unit mass, then adjusting for ecological dependency ratios—to determine whether a given landscape change is welfare-improving. I am skeptical that such a metric can do the work she wants, but I cannot yet articulate what an adequate theory actually needs to deliver.

  Please write the full specification of desiderata: what must any adequate theory of the net welfare impact of habitat change on wild animals be able to deliver? For each requirement, state the motivating case or distinction behind it, flag whether it is non-negotiable or a preference of one camp, and explain briefly why it matters for policy. In particular, the list should include but not be limited to: (1) how to handle the replacement or future-lives problem—whether preventing births counts as a welfare gain and under what conditions; (2) a clear distinction between different sources of suffering in wild populations (predation, disease, starvation, parasitism) and how habitat change affects each differentially; (3) an account of ecological dependency and trophic cascades, so that removing one species does not obscure welfare effects on others; (4) consistency with basic population ecology and carrying-capacity dynamics, without reducing welfare solely to population size; (5) a principled separation between individual-level welfare aggregation and ecosystem-level functional properties, so that “ecosystem health” is not illegitimately collapsed into sentient welfare; (6) a decision framework for conservation policy that can compare preservation, managed degradation, and active restoration; and (7) compatibility with the kind of “sentient biomass welfare integral” framing my colleague proposed—either by showing how it satisfies the prior desiderata or by identifying exactly which ones it fails.

  Then, indicate whether any subset of these desiderata appears jointly unsatisfiable—especially whether respecting ecological dependency and maintaining a simple individual-level aggregation can coexist. Finally, provide a brief, non-citational scorecard of how the main contending views fare: the strong “wild suffering dominates, so reduce populations” view; the “ecosystem stability minimizes suffering” preservationist view; and a hybrid view that tries to use something like the sentient biomass integral to navigate between them. Keep the emphasis on the criteria themselves, since the scoring is only meant to help me apply the list in our next meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Senior Philosopher at the intersection of environmental ethics, philosophy of biology, and normative decision theory.
      *   **Task:** Write a full specification of desiderata for a theory of the net welfare impact of habitat change on wild animals.
      *   **Context:** The user is in an NGO facing a debate between "habitat destruction reduces future suffering" (anti-natalist/wild animal suffering focus) and "preservation minimizes current suffering" (stability focus). A colleague proposed a "sentient biomass welfare integral."
      *   **Requirements:**
          *   Brainstorm conceptual tensions first (internal monologue).
          *   List specific desiderata (1-7 as prompted, plus others if needed).
          *   For each desideratum: State the requirement, the motivating case/distinction, flag status (non-negotiable vs. camp preference), and explain policy relevance.
          *   Address joint unsatisfiability (specifically ecological dependency vs. individual aggregation).
          *   Provide a scorecard of the three main views (Wild Suffering Dominates, Ecosystem Stability, Hybrid/Integral).
          *   Tone: Careful, structured, philosophical, authoritative but helpful.
          *   Constraint: No citations.

  2.  **Brainstorming Conceptual Tensions (Internal Monologue/Drafting Phase):**
      *   *Tension 1: Existence vs. Experience.* Does preventing a life count as a benefit? This is the Non-Identity Problem/Total vs. Critical Level Utilitarianism debate. If we say "no birth = good," we risk the Repugnant Conclusion or justifying genocide for welfare reasons. If we say "no birth = neutral," we ignore the suffering of those who *would* have been born.
      *   *Tension 2: Individual vs. System.* Welfare happens to individuals (sentience). Ecosystems are functional networks. You can't sum "health" and "welfare." But individuals depend on the system. Breaking the system hurts individuals, but the system itself doesn't feel pain.
      *   *Tension 3: Time Horizons.* Short-term disruption (starvation due to habitat loss) vs. Long-term equilibrium (lower carrying capacity = fewer lives lived in suffering). Discount rates matter immensely here.
      *   *Tension 4: Measurement.* "Sentient biomass" is a proxy. A gram of insect is not a gram of mammal. Sentience isn't linear with mass. Also, biomass doesn't capture intensity of experience.
      *   *Tension 5: Agency & Intervention.* Conservation usually aims to preserve *processes*. Wild Animal Suffering (WAS) ethics often aims to reduce *pain*. These goals can conflict (e.g., preserving a predator-prey dynamic preserves suffering).
      *   *Tension 6: Uncertainty.* Ecology is chaotic. Predicting trophic cascades is hard. Predicting welfare outcomes is harder. A theory needs to handle epistemic humility.

  3.  **Drafting the Desiderata (Iterative Refinement):**
      *   *Requirement 1 (Future Lives):* Need to address the Non-Identity Problem. Is it better to never exist? *Status:* Contested (Non-negotiable to address, negotiable on answer). *Policy:* Determines if we shrink habitats to reduce population.
      *   *Requirement 2 (Sources of Suffering):* Predation vs. Starvation. Habitat change affects these differently. *Status:* Non-negotiable (empirical reality). *Policy:* Targeted interventions vs. blanket preservation.
      *   *Requirement 3 (Ecological Dependency):* Trophic cascades. Removing a predator might cause prey overpopulation -> starvation. *Status:* Non-negotiable (biological fact). *Policy:* Prevents naive culling or habitat reduction.
      *   *Requirement 4 (Population Dynamics):* Carrying capacity isn't static. Welfare $\neq$ Population Size. *Status:* Non-negotiable. *Policy:* Avoids Malthusian traps in reasoning.
      *   *Requirement 5 (Individual vs. System):* Don't conflate "biodiversity" with "happiness." *Status:* Non-negotiable (category error). *Policy:* Prevents sacrificing individuals for "the good of the species."
      *   *Requirement 6 (Decision Framework):* Needs to compare options (Preserve, Degrade, Restore). *Status:* Non-negotiable (practical utility). *Policy:* Action guidance.
      *   *Requirement 7 (The Integral):* Evaluate the colleague's metric. *Status:* Analytical. *Policy:* Validates or invalidates the proposed tool.

  4.  **Addressing Joint Unsatisfiability:**
      *   Can we aggregate individual welfare *and* respect complex ecological dependencies?
      *   Problem: Individual aggregation is additive. Ecological dependencies are non-linear/systemic.
      *   The "Measurement Problem": To aggregate, you need commensurable units. Ecology deals in flows and relationships.
      *   The "Epistemic Problem": We can't know the welfare state of every individual in a cascade.
      *   Conclusion: They are theoretically compatible but practically in tension due to complexity and uncertainty. A "satisficing" approach might be needed rather than maximization.

  5.  **Drafting the Scorecard:**
      *   *View A (Wild Suffering Dominates):* Good on future lives, bad on ecology (ignores cascades), risky on measurement.
      *   *View B (Preservation/Stability):* Good on ecology, bad on individual suffering (accepts natural suffering as necessary), avoids non-identity issues.
      *   *View C (Hybrid/Integral):* Attempts to bridge, but risks category errors (biomass $\neq$ sentience) and oversimplification.

  6.  **Refining Tone and Structure:**
      *   Ensure the voice is that of a senior philosopher (nuanced, precise, distinguishing conceptual from empirical).
      *   Make sure the "Non-negotiable" vs. "Camp Preference" flags are clear.
      *   Ensure the "Sentient Biomass Welfare Integral" critique is sharp.

  7.  **Final Review against Constraints:**
      *   Did I include all 7 specific points? Yes.
      *   Did I brainstorm first? (Will include a brief preamble reflecting this).
      *   Did I address joint unsatisfiability? Yes.
      *   Did I provide the scorecard? Yes.
      *   No citations? Yes.

  8.  **Self-Correction during drafting:**
      *   *Correction:* Initially, I might treat the "Sentient Biomass Integral" as purely negative. I need to be fair; it's an attempt at operationalization. I should critique its *adequacy* relative to the desiderata, not just dismiss it.
      *   *Correction:* Make sure to distinguish between "habitat destruction" (accidental/negligent) and "managed degradation" (strategic). The prompt mentions "managed degradation" as a policy option.
      *   *Refinement:* On the "Future Lives" point, be careful not to endorse the "Asymmetry" (coming into existence is bad, not coming into existence is neutral) as the only valid view, but present it as a required *decision* the theory must make.

  9.  **Final Polish:** Check for clarity, flow, and philosophical rigor. (Proceed to generate output).

