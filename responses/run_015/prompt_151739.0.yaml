answer: |-
  The break in your chain is at **Step (4)**.

  You are correct to suspect that step, but the specific error is more subtle than a simple slide from semantics to norms. The error is a conflation of **intensional non-identity** (the concept "white horse" is not the concept "horse") with **extensional non-substitutability** (an object satisfying "white horse" cannot be treated as an object satisfying "horse").

  Gongsun Long's argument is strictly about *Ming* (names/concepts), not *Shi* (actualities/objects). He argues that the *name* "white horse" has different satisfaction conditions than the *name* "horse." He does not argue that a white horse cannot be counted as a horse when the color is irrelevant. Your Step (4) illicitly upgrades a distinction between *concepts* into a barrier between *objects* in functional contexts.

  Here is the detailed diagnosis of why (4) fails, why it looked plausible, and what rejecting it costs you.

  ### 1. Why Step (4) is the Failure Point
  Step (4) claims: *"'Conscious machine' is not substitutable for 'machine' in any context where only the functional-artifactual register is relevant."*

  This is false. Substitutability does not require concept identity; it requires **entailment**.
  *   **Concept Identity:** "White Horse" $\neq$ "Horse" (True, per Gongsun Long).
  *   **Class Membership:** A white horse $\in$ Horse (True, per common sense and Long's opponents).
  *   **Substitutability:** If $X$ is a white horse, can $X$ satisfy a request for a horse? **Yes**, unless the request explicitly excludes the restriction (e.g., "I need a horse, but *not* a white one").

  In your argument, you assert that because the *registers* (phenomenal vs. functional) differ, the compound term cannot substitute for the base term in contexts relevant only to the base register. But if a "conscious machine" satisfies the functional definition of "machine" (which it must, to be a machine *at all*), it is substitutable in functional contexts.

  **The Error:** You treat the addition of a register as **overwriting** the base register, rather than **restricting** it.
  *   *Your view:* "Conscious" + "Machine" = A new kind of thing that isn't quite a "Machine" in the functional sense.
  *   *Corrected view:* "Conscious" + "Machine" = A subset of "Machine" that carries extra baggage.

  ### 2. Why Step (4) Looked Plausible
  It looked plausible because you are faithfully mirroring the rhetorical force of Gongsun Long's *Fei* (Is Not).
  *   Long says: "White horse is not horse."
  *   You hear: "White horse cannot be treated as horse."

  However, in Classical Chinese logic, *Fei* in this context denotes **non-identity of reference**, not **exclusion from the class**. Long's point is that if you send someone to find a "horse," they can bring a yellow one. If you send them to find a "white horse," a yellow one fails. Therefore, the *instructions* are not identical.

  Your Step (4) takes this difference in *instructions* and applies it to the *object* found. If the agent returns with a white horse, have they fulfilled the order "find a horse"? Yes. Long admits this implicitly (otherwise the dialogue makes no sense); his point is that the *order* was different, not that the *animal* ceased to be a horse.

  By moving from "seeking is different" (Step 3) to "substitution is impermissible" (Step 4), you turn a pragmatic distinction about search criteria into an ontological barrier.

  ### 3. The Cost of Rejecting (4)
  If you reject (4) and replace it with a principle of **Downward Entailment** (a compound term inherits the satisfaction conditions of its head noun unless contradicted), here is what happens to your project:

  **A. You preserve the Register Distinction (1 & 2)**
  You can still maintain that "Conscious" (phenomenal) and "Machine" (functional) draw on distinct satisfaction conditions. You do not have to reduce consciousness to function or vice versa. The registers remain distinct; they just don't block inheritance.

  **B. You save Compound Predication (Avoiding 7)**
  "Red apple" is not identical to "apple" (conceptually), but a red apple *is* an apple (ontologically). In a botanical context (register: biology), the color register is ignored, and the object substitutes successfully. Language survives.

  **C. You lose the "Category Mistake" Claim about Fairness (Modifying 5)**
  This is the significant cost. You can no longer claim that fairness/accuracy trade-offs are *category mistakes*.
  *   *Your previous view:* Comparing "fair classifier" to "classifier" is like comparing apples to oranges.
  *   *Revised view:* Comparing them is like comparing "white horses" to "horses." It is a comparison between a set and its subset.

  This actually **strengthens** the application of Gongsun Long to AI. Long's point is that adding a constraint (white/fair) restricts the extension (available horses/classifiers).
  *   If you seek a "horse," many candidates exist.
  *   If you seek a "white horse," fewer candidates exist.
  *   Therefore, it is *harder* to find a white horse.

  Applied to AI: It is *harder* to find a fair classifier than a classifier. The "trade-off" is not a category mistake; it is the **logical cost of restriction**. By rejecting (4), you transform the fairness debate from a "confusion of terms" into a "cost of specification." This is a more robust philosophical position: fairness constraints *do* reduce the solution space (accuracy), exactly as "white" reduces the solution space of "horses."

  ### 4. How to Repair the Argument
  To keep the insight without the *reductio*, revise Step (4) to distinguish between **Definition** and **Classification**.

  *   **Old (4):** "Conscious machine" is not substitutable for "machine" in functional contexts.
  *   **New (4):** "Conscious machine" is not **definitionally equivalent** to "machine," but it is **classificatorily subordinate**. Therefore, it substitutes in functional contexts *unless* the functional context explicitly requires the *absence* of the additional constraint.

  **Why this works:**
  It allows you to say that "Moral Agent" (Normative + Descriptive) is not the same *concept* as "Agent" (Descriptive), preserving your register distinction. But it allows you to say that a Moral Agent *is* an Agent for the purposes of descriptive sociology, avoiding the absurdity of (7).

  ### Summary
  *   **Reject:** Step (4).
  *   **Preserve:** Steps (1), (2), and (3).
  *   **Reason:** Step (4) confuses the non-identity of *concepts* (which Long proves) with the non-substitutability of *instances* (which Long does not prove).
  *   **Cost:** You must admit that fairness/accuracy trade-offs are real structural consequences of adding constraints (restricting extension), rather than dismissing them as linguistic errors.
  *   **Gain:** You save the theory from the "red apple" *reductio* and align it more closely with set-theoretic logic, which makes it more applicable to computational classification problems.

  Gongsun Long's insight is that **specification costs availability**. Your argument tried to claim that **specification costs identity**. The former is profound; the latter is absurd. Stick to the former.
