answer: |-
  This is a classic demarcation problem, but transposed from the natural sciences to the historical humanities. In philosophy of science, we often talk about Popper's falsifiability or Kuhn's paradigms, but historiography has its own epistemic norms. The tension you felt with your friend is real: there *is* an institutional boundary, but the question is whether that boundary guards a methodological difference or merely protects turf.

  Let's break down the criteria you mentioned before applying them. In history, **source criticism** is the functional equivalent of experimental reproducibility. It asks: What is the provenance? What is the context? Is there corroboration? **Consilience** (or coherence) is equally vital; a historical claim shouldn't contradict established findings in archaeology, linguistics, or genetics without overwhelming evidence. **Falsifiability** in history is trickier than in physics because we can't rerun the past, but specific interpretations can be falsified by new data (e.g., a carbon date or a newly translated text). **Methodological naturalism** in history doesn't mean denying people's religious beliefs; it means explaining human actions through human motives and material conditions rather than invoking unverified external agents (like aliens or lost super-civilizations) to fill gaps. Finally, **quantitative methods** are tools, not truth-generators; they are only as good as the input data and the independence of the variables.

  Now, let's apply this to the 2012 phenomenon.

  The claim was specific: the end of the 13th Bak'tun in the Maya Long Count calendar (December 21, 2012) signaled a global cataclysm or a metaphysical transformation of consciousness. The primary claimants were not Mayanists but New Age authors and media producers. They pointed to a specific archaeological source: Monument 6 from Tortuguero. This inscription mentions the 13th Bak'tun ending and a verb phrase involving the deity Bolon Yokte'.

  Here is where the criteria bite. Under **source criticism**, the professional response focused on the physical state of the text. The glyphic passage describing the event is damaged. Mayanists argued that projecting "end of the world" onto a broken text is hermeneutically unsound. Furthermore, **coherence** was the major failure point. Ethnographic data from modern Maya communities showed no tradition of apocalyptic expectation. The Long Count is cyclical; when one cycle ends, another begins. To claim it was an "end" required ignoring the internal logic of the calendar system itself.

  Regarding **falsifiability**, the 2012 case is interesting because it was a prediction. When the date passed without physical cataclysm, the claim shifted. Proponents moved from "physical destruction" to "spiritual transformation." In philosophy of science, we call this an *ad hoc hypothesis* modification to save the theory from falsification. By making the claim unfalsifiable (spiritual states can't be measured), it exited the realm of empirical history entirely.

  Does **methodological naturalism** apply here? You asked if it matters when the claim is about cyclical time. Strictly speaking, methodological naturalism restricts physical explanations to natural causes. However, in historiography, it also restricts *cultural* explanations to evidenced cultural frameworks. The pseudohistorical claim imposed a Western apocalyptic framework (linear time, final judgment) onto a Mesoamerican cyclical framework. It wasn't violating physics, but it was violating the *hermeneutic principle of charity*—interpreting a culture on its own terms. The "supernatural" element wasn't ghosts, but the imposition of a mystical significance that the source culture did not encode.

  Now, contrast this with Anatoly Fomenko's *New Chronology*. This is a harder test for your friend's argument because Fomenko uses **quantitative methods**. He applies statistical analysis to astronomical data mentioned in chronicles to argue that ancient history is a fabrication and that events like the life of Jesus occurred in the Middle Ages.

  On the surface, Fomenko looks more "scientific" than the 2012 proponents because he uses math. But let's look at **source criticism**. Fomenko treats chronicles as independent data points. Historians argue they are not; many chronicles copy each other. If you statistically analyze copied texts as if they were independent observations, your statistical significance is an illusion. The math is valid, but the input violates the historical method of textual transmission.

  Regarding **consilience**, Fomenko's theory collapses. To make the chronology work, you have to dismiss dendrochronology (tree-ring dating), radiocarbon dating, linguistics, and genetics. A historical theory that requires physics and biology to be wrong is epistemically expensive. It fails the coherence test.

  Does the presence of math change the criteria? No. In philosophy of science, we recognize that formalization does not guarantee truth. If the axioms are wrong, the proof is worthless. Fomenko's use of statistics gives an *aura* of objectivity, which is why it appeals to those who distrust "soft" humanities. But the demarcation line holds because the mathematical model is not connected to the material reality of the artifacts.

  So, is this just gatekeeping? It is institutional authority, but it is authority earned through **reliability**. The "line" is not a conspiracy to exclude outsiders; it is the boundary where claims stop adhering to the methods that have historically produced reliable knowledge. When a claimant ignores source damage (2012) or assumes textual independence where there is none (Fomenko), they are not playing the game of history. They are playing a different game that mimics the aesthetics of history.

  However, I need to be honest about where the theory breaks down or stays quiet.

  First, **underdetermination**. In history, evidence is always incomplete. Two historians can look at the same sources and reach different conclusions. Pseudohistory often exploits this gap, arguing that because standard history has uncertainties, *any* alternative is equally valid. The demarcation criteria struggle here. We can't always prove the pseudohistorian wrong definitively; we can only show their probability is vanishingly low compared to the consensus.

  Second, **revisionism vs. denialism**. Real history changes. Was the Trojan War real? Schliemann was once considered a dreamer. The difference is that Schliemann engaged with the material evidence (digging) and adjusted his claims based on what he found. Pseudohistorians often start with the conclusion and cherry-pick evidence to fit. But in the moment, it can look similar. The "gatekeepers" were initially skeptical of Schliemann, too. The difference lies in *responsiveness to counter-evidence*. When new data contradicted the mainstream, the mainstream adjusted. When data contradicted 2012 or Fomenko, the theories mutated or ignored the data.

  Third, **methodological naturalism's limits**. You asked if it applies to cyclical time. If a culture believes time is cyclical, a historian records that belief. If a pseudohistorian claims time *is* cyclical in a way that allows for predicting 2012, they are making a metaphysical claim disguised as history. Philosophy of science is sometimes quiet on metaphysical claims because they aren't empirically testable. The demarcation line blurs when pseudohistory makes claims that are technically unfalsifiable (e.g., "vibrational shifts"). In these cases, the label "pseudohistory" is less about falsehood and more about *category error*. It's not history; it's mythology using historical props.

  Finally, the **sociological factor**. You cannot ignore that institutional authority *does* play a role. Peer review can be slow and conservative. Sometimes, legitimate outsiders are dismissed. However, the 2012 and Fomenko cases show that the dismissal wasn't just "you don't have a PhD." It was "your method does not track reality." The Maya epigraphers didn't reject the 2012 claim because of status; they rejected it because they could read the glyphs and the claimants couldn't. Fomenko was rejected not because he was a mathematician, but because his math didn't map to the textual reality.

  So, is there a real line? Yes, but it's not a wall; it's a gradient of epistemic warrant. The line is drawn at **methodological integrity**. When the methods (source criticism, consilience, logical coherence) are sacrificed to preserve a conclusion, you have crossed into pseudohistory. The authority of academics is a byproduct of their adherence to these methods, not the source of their validity. If an academic started ignoring carbon dates to support a pet theory, they would (and do) lose that authority. The 2012 episode and Fomenko's work demonstrate that the demarcation isn't about who speaks, but about how the claims interact with evidence. The math in Fomenko and the glyphs in 2012 were both real; the pseudohistory lay in the disconnect between those objects and the narratives built upon them.
