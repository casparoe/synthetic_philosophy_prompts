  3.  **Brainstorming "Less Obvious" Defeaters:**

      *   *Issue 1: The Non-Existence Problem (Benatar's Asymmetry).*
          *   User asks: Is the absence of suffering in a being that will never exist really a good?
          *   *Challenge:* If a being doesn't exist, there is no subject to whom the "good" accrues. "Good for whom?"
          *   *Impersonal Good?* If it's impersonal, does it lead to the "Repugnant Conclusion" in reverse (The "Sadistic Conclusion" or "Very Repugnant Conclusion")? If we value the absence of suffering in non-existents, do we have a duty to eliminate existing beings to realize that "good" of non-existence? (The Benevolent World-Exploder problem).
          *   *Duty to Potential People:* If non-existence is better (due to absence of suffering), do we owe it to potential people *not* to create them? But if they don't exist, they can't be owed anything.

      *   *Issue 2: The Definition of Suffering.*
