answer: |-
  Here are nine interview questions designed for your philosophy of AI reading group panel. They are structured to move from technical underdetermination to ontological commitments, ending with the falsification constraint you requested.

  The three required topics (Basis-Change, Sparsity, Causal Intervention) include a main question and a targeted follow-up based on the guest's likely defensive maneuver.

  **1. The Basis-Change Objection**
  "Let's start with the underdetermination problem. Activation space is a vector space, meaning any invertible linear transformation of a basis yields a mathematically equivalent description of the model's state. If the model's computation is basis-invariant, what ontological privilege does the specific basis discovered by an SAE or linear probe hold? Why should we think *this* decomposition maps to the model's actual representations rather than just being the decomposition that best maps to *human* conceptual categories?"

  *   **Anticipated Answer:** He will likely argue that while mathematically equivalent, the discovered basis is *computationally* privileged (e.g., it aligns with how the model routes information or minimizes loss).
  *   **Follow-up:** "If the privilege is computational, are you claiming the model explicitly computes in that basis, or merely that the basis is a convenient lossless compression for us? If the model relies on superposition (storing multiple features in the same subspace), doesn't forcing a monosemantic basis actually distort the causal structure rather than reveal it?"

  **2. The Sparsity Prior in SAEs**
  "Connected to that: Sparse Autoencoders explicitly optimize for a sparsity prior to extract monosemantic features. But sparsity is a constraint *we* impose on the training objective of the interpreter, not necessarily on the model itself. How do you distinguish between the SAE finding features that are genuinely there versus the SAE finding the best possible approximation of the model's activations that satisfies *our* desire for sparsity?"

  *   **Anticipated Answer:** He will likely claim that sparsity reflects the natural structure of the data manifold or that monosemantic features generalize better out-of-distribution, implying they track reality.
  *   **Follow-up:** "Generalization utility is pragmatic, not ontological. If the model achieves that generalization via polysemantic superposition to save space, and the SAE 'unbundles' that into multiple sparse neurons, haven't we simply traded the model's native ontology for one that is more legible to us? At what point does 'legibility' become 'construction'?"

  **3. Causal Intervention and Content**
  "Many realists lean on causal interventions: if I ablate or amplify a feature and the model's behavior changes systematically, the feature is 'real.' But causal leverage doesn't necessarily entail representational content. I can break a radio by removing a resistor, but the resistor doesn't 'represent' the volume. What distinguishes a feature that has causal leverage from a feature that possesses intentional content about the world?"

  *   **Anticipated Answer:** He will likely appeal to systematicity or compositionality—arguing that because the feature behaves like a variable in a function (e.g., changing 'gender' flips pronouns consistently), it functions as a representation.
  *   **Follow-up:** "Systematicity can arise from rigid causal coupling without semantics. A thermostat is systematically coupled to temperature, but we rarely call it a 'representation' in the robust sense you're defending. Do you need a condition of 'detachment'—where the feature can be manipulated independently of its typical cause—to count as representational, and do your current intervention methods actually demonstrate that detachment?"

  **4. Cross-Architecture Universality**
  "If these features are genuine natural kinds of neural computation, rather than artifacts of specific training runs or architectures, we should expect to find them consistently across different model families trained on similar data. To what extent have you seen these specific representational structures emerge in models with fundamentally different architectures (e.g., SSMs or Mamba) trained on comparable corpora? If they don't transfer, does that undermine the realist claim?"

  **5. The Normativity of Representation**
  "A core feature of representational realism in philosophy of mind is normativity: a representation can be *wrong* or *misrepresent* the world. In your framework, can a discovered feature be incorrect? If an SAE finds a 'dog' feature that fires for cats, is that a flawed representation, or just a different feature we mislabeled? If the latter, aren't we just naming clusters of activation rather than identifying truth-apt states?"

  **6. The "Black Box" Ground Truth**
  "To defend realism, you need a ground truth to compare your interpretations against. But we don't have access to the model's 'mind' independent of these interpretability tools. Are you not effectively circularizing the argument: we assume representations exist, so we build tools that find representation-like structures, and then cite those structures as proof that representations exist? What independent access do we have to the model's ontology?"

  **7. Feature Stability vs. Training Dynamics**
  "Representations in biological systems are often stable over time, yet neural network features can shift significantly during fine-tuning or even late-stage training (the 'grokking' phenomenon). If a feature is 'real,' does it need to be stable? If the model reuses the same activation subspace for different semantic content depending on the training phase, does that suggest the activation is merely a resource buffer rather than a stable representational vehicle?"

  **8. The Human Analogy**
  "You often draw parallels between SAE features and human conceptual atoms. But human concepts are grounded in embodied interaction and evolutionary pressure. Neural networks are grounded in next-token prediction statistics. Even if the topological structure of the features looks similar, does the lack of embodied grounding prevent these activations from rising to the level of 'representation,' leaving them as merely statistical correlates?"

  **9. The Falsification Condition**
  "Finally, to close: Realism is only a meaningful stance if it is falsifiable. You've argued that better tools will reveal more features. But what specific empirical finding would convince you that models *do not* contain representations in the realist sense? If we found that all 'features' dissolved under higher-resolution analysis into pure superposition with no stable monosemantic basis, would you abandon the view, or would you simply redefine the representation as the superposition itself?"
