answer: |-
  # The question we were convened to answer

  Can a state committed to the equal moral worth of persons maintain open entry without undermining the political conditions necessary for a generous welfare state?

  # Agreed claims

  1. We affirm that all persons possess equal moral worth, though we disagree fundamentally on what specific obligations this imposes regarding state borders and freedom of movement.
  2. Maintaining a generous, universalist welfare state is a morally significant achievement that requires robust institutional protection and sustained political support from citizens.
  3. Entry, Access, and Standing are functionally distinct policy gates that current legal systems frequently conflate to the detriment of clear analysis and honest debate.
  4. Restrictionist concerns divide into fiscal impacts regarding net contribution and political-economy impacts regarding the erosion of solidarity among existing citizens.
  5. The open-borders side accepts that unchecked inflows could theoretically undermine the political conditions necessary for welfare institutions to function, which would be a moral cost.
  6. The restrictionist side accepts that border control is a form of coercion imposed on outsiders that requires serious moral justification beyond mere administrative convenience.
  7. The open-borders side does not claim welfare sustainability is irrelevant; the restrictionist side does not claim outsiders have no moral claims whatsoever against exclusion.
  8. Neither side argues for exclusion based on racial, ethnic, or religious criteria, nor for admission policies ignoring the economic capacity of the receiving state.
  9. Both sides agree that evidence on the dynamic political effects of migration on welfare sustainability remains currently inconclusive and heavily contested in existing literature.
  10. We acknowledge that decoupling Entry from Access is legally complex but conceptually necessary for resolving this specific theoretical debate without collapsing the distinctions.

  # Disagreements

  | Crux | Open-Borders Formulation | Restrictionist Formulation | Type |
  | :--- | :--- | :--- | :--- |
  | **Priority of Principles** | Moral rights to move are primary; feasibility constraints are secondary challenges to be solved through institutional design. | Political preconditions for redistribution are primary; rights claims cannot override institutional collapse or loss of solidarity. | Substantive |
  | **Elasticity of Solidarity** | Solidarity is expandable; inclusive institutions generate more trust among diverse populations over time through shared participation. | Solidarity is fragile; perceived heterogeneity reduces willingness to transfer resources among strangers regardless of institutional design. | Substantive |
  | **Burden of Justification** | The state must justify exclusion to the outsider because coercion is actively imposed upon them at the border. | The state must justify inclusion to the citizen because collective resources are entrusted to them via democratic mandate. | Substantive |
  | **Decoupling Viability** | Entry can be granted without full Access; temporary status respects rights without threatening welfare sustainability for citizens. | Creating a class without Access undermines labor standards and erodes Access for citizens eventually through political backlash. | Substantive |
  | **Nature of Coercion** | Preventing movement is an active harm akin to imprisonment within one's birthplace, violating negative liberty. | Allowing unrestricted entry is an active harm to the collective self-determination of the existing polity to shape its future. | Verbal |
  | **Time Horizon** | Justice demands immediate relief for those currently excluded from opportunity and safety across borders. | Sustainability demands intergenerational stability of the welfare contract over decades, prioritizing future citizens. | Substantive |

  # Tests, with predictions recorded in advance

  **1. Regional Labor Mobility Zone**
  *Case:* Expansion of free movement within a customs union without immediate harmonization of welfare benefits.
  *Open-Borders Prediction:* Welfare spending per capita remains stable or rises due to labor growth and tax base expansion. *Falsification:* We concede if spending drops significantly without economic recession.
  *Restrictionist Prediction:* Welfare spending per capita falls or conditionality tightens as political support for redistribution weakens. *Falsification:* We concede if solidarity measures rise despite demographic change.

  **2. Decoupling Experiment**
  *Case:* Large-scale guest worker program with full labor rights but no welfare access for ten years.
  *Open-Borders Prediction:* No erosion of citizen benefits; workers gain liberty and send remittances without draining public funds. *Falsification:* We concede if citizen benefits are cut due to labor market pressure.
  *Restrictionist Prediction:* Downward pressure on wages leads to calls to cut citizen benefits to maintain competitiveness. *Falsification:* We concede if labor standards hold and citizen wages remain unaffected.

  **3. Public Opinion Shock**
  *Case:* Sudden high-visibility influx followed by public messaging on net fiscal contribution.
  *Open-Borders Prediction:* Support for redistribution holds steady despite demographic change when contributions are highlighted. *Falsification:* We concede if support drops regardless of fiscal data.
  *Restrictionist Prediction:* Support for redistribution declines as perceived shared identity weakens, overriding fiscal arguments. *Falsification:* We concede if support holds steady despite rapid demographic shift.
