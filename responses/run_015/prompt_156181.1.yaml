answer: |-
  ### Conceptual Decision Tree: Normative Classification of Political Exchange

  This instrument classifies ethical positions on clientelism and gift-giving by traversing three levels of normative judgment. Each node poses a diagnostic question designed to be answerable without presupposing the final classification.

  #### **Level 1: Source of Normative Obligation**
  **Question:** When evaluating the exchange, is the primary ethical violation defined by a breach of **impersonal public duty** (e.g., fairness, rule of law), or by a betrayal of **personal social obligation** (e.g., kinship, patronage, gratitude)?

  *   **Branch A:** Impersonal Public Duty (Institutional-Role Norms)
  *   **Branch B:** Personal Social Obligation (Relational-Moral Norms)

  ---

  #### **Level 2: Scope and Authority of Standards**
  **Question:** Are the standards used to judge this breach **binding across all political societies** (where local culture merely explains why the breach occurred), or are they **legitimate only within specific cultural-institutional settings** (where local culture determines the moral status of the act)?

  *   **Branch A1:** Binding Across All Societies (Universal Standards / Culture Explains)
  *   **Branch A2:** Legitimate Only Within Specific Settings (Contextual Standards / Culture Determines)
  *   **Branch B1:** Binding Across All Societies (Universal Standards / Culture Explains)
  *   **Branch B2:** Legitimate Only Within Specific Settings (Contextual Standards / Culture Determines)

  *(Note: Branch B1 is logically unstable, as relational norms are rarely universalizable without becoming institutional rules.)*

  ---

  #### **Level 3: Temporal and Moral Structure of Exchange**
  **Question:** Is the exchange morally distinct because it is a **discrete transaction** (closed, quid-pro-quo), or because it sustains an **open-ended relationship** (ongoing, diffuse reciprocity)?

  *   **Branch A1-i:** Discrete Transaction
  *   **Branch A1-ii:** Open-ended Relationship
  *   **Branch A2-i:** Discrete Transaction
  *   **Branch A2-ii:** Open-ended Relationship
  *   **Branch B2-i:** Discrete Transaction
  *   **Branch B2-ii:** Open-ended Relationship

  ---

  ### **Leaf Classification and Logical Gaps**

  The following leaves map the five target positions onto the logical endpoints of the tree. Unoccupied logical combinations are diagnosed below.

  | Path | Position Label | Classification |
  | :--- | :--- | :--- |
  | **A1-i** | **(a) Western Legalist Universalism** | **Occupied.** Views clientelism/gifts as discrete bribes violating universal impartiality. Culture explains prevalence but does not excuse. |
  | **A1-ii** | **(e) Hybrid Contextual Universalism** | **Occupied.** Maintains universal public norms but permits relational exchange in private spheres. Distinguishes office from person. |
  | **A2-i** | **(c) Institutional Functionalism** | **Occupied.** Accepts institutional roles but argues discrete clientelist transactions are locally necessary to sustain representation/function. |
  | **A2-ii** | *Unoccupied Gap* | **Diagnosis: Unattractive.** Institutional norms that are context-bound yet require open-ended personal loyalty tend to collapse into neo-patrimonialism, lacking a stable theoretical defense. |
  | **B2-i** | **(b) Thick Cultural Relativism** | **Occupied.** Treats discrete exchanges as morally constituted by local context; external judgment is illegitimate. |
  | **B2-ii** | **(d) Relational-Ethics Defense** | **Occupied.** Defends gift-giving as non-corrupt loyalty within an ongoing moral relationship, immune to transactional critique. |
  | **B1-i / B1-ii** | *Unoccupied Gap* | **Diagnosis: Incoherent.** Relational norms (Branch B) are inherently particularistic; claiming they are universally binding (Branch B1) contradicts their definition as personal/social obligations. |

  ---

  ### **Ambiguity Flag: Functionalist and Relational-Ethics Overlap**

  **Pair:** **(c) Institutional Functionalism** (Path A2-i) and **(d) Relational-Ethics Defense** (Path B2-ii).

  **Diagnosis:** While the tree separates these positions at Level 1 (Impersonal Duty vs. Personal Obligation) and Level 3 (Discrete vs. Open-ended), in practice, these leaves are difficult to distinguish cleanly.
  *   **The Overlap:** Functionalist arguments often rely on relational rhetoric to justify institutional outcomes (e.g., "The MP must care for his constituents like a father" to justify vote-buying as representation). Conversely, relational defenses often adopt functionalist language (e.g., "Gift-giving maintains social stability").
  *   **Splitting Question:** To cleanly separate these in empirical application, a fourth diagnostic is required: *"Is the ultimate justification for the exchange the **efficacy of the political system** (functionalist) or the **intrinsic virtue of the relationship** (relational-ethics)?"*
      *   If the actor argues the exchange is necessary for the *system* to work (e.g., parties need resources to mobilize voters), they remain in **(c)** despite using relational language.
      *   If the actor argues the exchange is necessary for the *persons* to remain moral agents (e.g., to refuse a gift is to insult a kin), they belong in **(d)** even if the outcome is political.

  ### **Instrument Notes**
  *   **Neutrality:** Nodes avoid terms like "corruption" or "bribery" until the leaf classification, preventing the respondent from self-sorting into a normative category prematurely.
  *   **Logical Space:** The tree prioritizes the structure of the argument over the identity of the actor, allowing the same empirical case (e.g., a campaign gift) to be classified differently depending on the normative framework applied to it.
  *   **Gap Utility:** The unoccupied Institutional/Contextual/Relational leaf (A2-ii) highlights a theoretical weakness in arguments that attempt to justify neo-patrimonialism as a stable institutional form rather than a transitional or functional necessity.
