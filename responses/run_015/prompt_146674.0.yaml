prompt: |-
  so i just moved into a housing co-op in manchester and we have this rule that every major decision needs 'collective consent' but half the time it just feels like people bargaining in pairs and then announcing it was 'our decision'. this got me wondering about collective intentionality — specifically whether there's a real difference between a group genuinely intending something together versus a bunch of individuals just aligning their private intentions with some coordination on top.

  write an essay on whether collective intentionality is irreducably plural or whether it can be fully analysed into individual mental states plus a coordination mechanism. weigh the main arguments on both sides — you can draw on bratman's idea of shared cooperative activity and searle's notion of we-intentions, but don't just list them, actually argue. reach a conclusion and justify it properly, don't end on a fence-sitting note.

  here's the bit that makes it personal: our co-op has this weird 'silent partner' clause where if you don't object within 48 hours you're counted as part of the collective will. does that kind of procedral fiction actually create a genuine we-intention, or does it just mask aggregated individual acquiesence? i want to know whether the 'we' in 'we decided' survives that kind of manufactured consent, and whether your verdict changes how you'd design decision-making in a co-op like ours. also, if collective intentionality turns out to be reducible after all, does that mean there's no special moral weight to group decisions compared to summed-up individual ones?
