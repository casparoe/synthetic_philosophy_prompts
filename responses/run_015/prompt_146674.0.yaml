answer: |-
  **The Fiction of the Silent "We": Collective Intentionality and the Co-op Dilemma**

  Living in a housing co-op in Manchester, you are witnessing a microcosm of a problem that has plagued political philosophy and the philosophy of mind for decades. You describe a system designed for "collective consent" that devolves into bilateral bargaining, capped by a "silent partner" clause where silence equals agreement. You feel the dissonance: the announcement says "we decided," but the reality feels like "I didn't object, so I'm bound." This intuition cuts to the heart of the debate on collective intentionality. Is the "We" in "We intend" a genuine, irreducible psychological and normative state, or is it merely a shorthand for a complex web of "I intend" states coordinated by rules?

  While reductive accounts offer a cleaner ontology, they fail to capture the normative binding power that makes collective action possible. Collective intentionality is **irreducibly plural** in its normative structure. It cannot be fully analyzed into individual mental states plus coordination mechanisms without losing the very thing that makes a group decision morally distinct from a sum of individual preferences. Consequently, your co-op's "silent partner" clause does not generate a genuine collective intention; it manufactures a fiction of unity that masks aggregated acquiescence, thereby stripping the group decision of its special moral weight.

  To understand why, we must first look at the strongest case for reductionism, articulated by Michael Bratman. Bratman argues against the mystical idea of a "group mind." For him, shared cooperative activity (SCA) is built from the bottom up. For us to paint a house together, I must intend that we paint the house, you must intend that we paint the house, and these intentions must be common knowledge. Crucially, our sub-plans must mesh. If I want to paint red and you want to paint blue, we don't have a shared intention until we reconcile those plans.

  Bratman's account is attractive because it respects the fact that only individuals have brains. It explains how coordination happens without magic. In your co-op, when two members bargain in a pair and announce a decision, they are engaging in a Bratmanian meshing of sub-plans. They have interlocking "I-intentions." A reductivist would argue this is all there is. The "We" is just a label for the successful coordination of these "I"s. If this view holds, your silent partner clause is efficient: it assumes that unless an individual "I" actively disrupts the mesh, the coordination stands.

  However, this reductive view fails to account for the *obligation* inherent in collective action. This is where John Searle's notion of "We-intentions" becomes vital. Searle argues that "We-intend" is a primitive state of mind, irreducible to "I-intend." While Searle locates this in the individual brain (avoiding the group mind mysticism), he insists the *content* of the intention is plural. But the philosophical stakes go deeper than psychology; they are normative.

  If collective intentionality were merely aggregated individual intentions, my commitment to the group would be contingent on my individual preference remaining stable. If I intend that we paint the house, but I wake up tomorrow and no longer want to paint, a reductive account suggests I can simply drop my "I-intention." The "We" dissolves because it was never more than the overlap of our "I"s. But in genuine collective action, I owe it to *you* to continue. The commitment is not just to the task, but to *us*. This mutual obligation is irreducible. It creates a normative reality where the group holds a claim on the individual that the individual does not hold on themselves.

  This distinction is not academic; it is the difference between a contract and a community. If the "We" is reducible, a group decision is just a temporary alignment of self-interests. If it is irreducible, a group decision creates a new agent with moral standing.

  This brings us to the "silent partner" clause. Does procedural silence create a genuine We-intention? Under both Bratman's and Searle's frameworks, the answer is no, but for different reasons that converge on the same verdict. For Bratman, shared activity requires mutual responsiveness. Silence is not responsiveness; it is the absence of noise. A genuine meshing of sub-plans requires active negotiation to ensure our plans cohere. By bypassing this, the clause prevents the formation of the interlocking intentions necessary for SCA.

  For Searle, the failure is even more profound. A We-intention requires being in the "We-mode." Silence is inherently solitary. It is the absence of an "I" objection, not the presence of a "We" affirmation. To count silence as consent is to treat the group as an aggregation of isolated atoms rather than a plural subject. It assumes that the default state of a member is individualism, and that the "We" only exists if someone doesn't stop it. This inverts the ontology of collective intentionality. A genuine "We" requires active participation in the shared state.

  Therefore, the "We" in "We decided" does not survive your co-op's manufactured consent. What you have is not collective intentionality, but *procedural legitimacy* masquerading as collective will. This matters immensely for the moral weight of the decision.

  If collective intentionality is reducible, then group decisions have no special moral weight beyond the sum of individual consents. If I didn't object, I'm bound only because I agreed to the rule of silence, not because I share the intention. The moral burden is contractual. However, if collective intentionality is irreducibly plural, then a genuine group decision creates a duty of loyalty and mutual support that transcends individual preference. It means that when the co-op decides to fix the roof, I don't just pay my share because I have to; I support the decision because it is *ours*.

  By relying on the silent partner clause, your co-op is actively undermining the conditions required for irreducible collective intentionality. You are designing a system that produces reductive outcomes (aggregated acquiescence) while using plural language ("collective consent"). This creates the cynicism you are observing. When members bargain in pairs, they know the "collective" is a sham, so they optimize for individual gain rather than group good. They aren't building a "We"; they are clearing a hurdle.

  So, how should this verdict change the design of your co-op? If we accept that collective intentionality is irreducibly plural and requires active mutual commitment to carry moral weight, the decision-making process must prioritize *expression* over *efficiency*.

  First, abolish the silent partner clause for major decisions. Silence cannot constitute a We-intention because it lacks the mutual responsiveness required to mesh sub-plans. Consent must be active, even if that active consent is as simple as a verbal "I stand with this" in a meeting.

  Second, restructure the bargaining phase. If pairs are making deals before the meeting, the "We" is being fractured before it can form. Decision-making should happen in the plenary, where the meshing of sub-plans is visible to all. This ensures that the resulting intention is truly shared, not just imposed by a coalition.

  Finally, recognize that this will be slower. Irreducible collective intentionality is expensive. It costs time and emotional energy to build a genuine "We." But that cost is the price of the moral weight you seek. If you want decisions that bind the group with the force of collective commitment rather than the fragility of contractual obligation, you must build the "We" actively.

  In conclusion, collective intentionality is irreducibly plural because the normative obligations it creates cannot be derived from individual states alone. The "We" is real, but it is fragile. It requires active participation to exist. Your co-op's silent partner clause is a mechanism of aggregation, not integration. It produces a shadow of collective will that lacks the moral substance of the real thing. To reclaim the "We," you must reject the fiction that silence is consent. A group that does not speak together cannot intend together, and without shared intention, there is no co-op—only a building with shared bills.
