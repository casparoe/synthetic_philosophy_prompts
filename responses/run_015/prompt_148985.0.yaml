answer: |-
  There is **no established, standard term** in the philosophy of history or social explanation that specifically labels this oscillation between situational and characterological explanations based on the moral severity of the act.

  I am **90% confident** in this negative claim. While the *phenomenon* you describe is widely recognized and frequently critiqued (often implicitly) in Holocaust historiography and social psychology, it does not have a canonical name akin to "the fundamental attribution error" or "the intentionalist-functionalist debate."

  ### Analysis of the Phenomenon

  You have identified a methodological inconsistency that arises from the limits of **Situationism**. Situational explanations (authority, conformity, bureaucratic routinization) are highly effective at explaining *normative compliance*—why a population adheres to a new, grim baseline. However, situationism struggles to explain *variance* within that baseline. When behavior exceeds the situational demand (e.g., shooting when ordered to deport, or torturing when ordered to shoot), the situational model reaches an explanatory ceiling.

  Historians often handle this ceiling not by expanding the situational model (e.g., by analyzing competitive dynamics within the unit) but by tacitly switching to a **Dispositionalist** register (culture, character, antisemitism). This creates a discontinuity in the explanatory framework: the "ordinary" is explained by sociology, while the "excessive" is explained by psychology or cultural anthropology, often within the same narrative.

  ### Proposed Definition and Terminology

  Since no term exists, I propose defining this as **Severity-Dependent Explanatory Bifurcation**.

  **Definition:** A methodological practice in historical explanation wherein causal attribution shifts from external/situational factors to internal/dispositional factors contingent upon the degree to which the observed behavior exceeds the minimum requirements of the structural context.

  **Key Characteristics:**
  1.  **Threshold-Triggered:** The switch occurs not at the level of the actor (different people) but at the level of the *act* (different intensities of violence).
  2.  **Implicit Transition:** The shift is rarely justified methodologically; it is treated as self-evident that "excess" requires "evil character," while "compliance" requires "pressure."
  3.  **Causal Incoherence:** It treats the same historical event (participation in genocide) as two ontologically distinct categories requiring incompatible causal logics, without explaining how the two logics interact.

  ### Distinctions

  To ensure precision, we must distinguish **Severity-Dependent Explanatory Bifurcation** from two related concepts:

  1.  **Vs. Multi-Causal Explanation (Interactionism):**
      *   *Interactionism* posits that Situation ($S$) and Disposition ($D$) interact continuously to produce Behavior ($B$) according to a formula like $B = f(S, D)$. Both factors are present for all acts.
      *   *Bifurcation* posits that for Act Type 1 (routine), $B = S$, and for Act Type 2 (excess), $B = D$. It segments the causal field rather than integrating it.

  2.  **Vs. Population-Specific Explanation:**
      *   One might argue that Battalion 101 is explained situationally, while the Einsatzgruppen are explained culturally. This is a **Population-Specific** assignment.
      *   *Bifurcation* occurs *within* the same unit (e.g., Battalion 101). The same men are "situationally pressured" when shooting Jews in a forest but "culturally motivated" when playing football with a victim's skull beforehand. The variable is the *severity of the act*, not the identity of the group.

  ### Suggested Terminology

  If you wish to name this in your own writing, I suggest **"The Excess-Violence Explanatory Shift"** or, more formally, **"Moral-Threshold Explanatory Bifurcation."**

  The latter captures the philosophical core: the explanation changes when the behavior crosses a threshold of *moral intelligibility*. Routine killing is intelligible as "obedience"; sadistic killing is unintelligible as "obedience" and is therefore retrofitted with "hatred" to restore moral causality.

  ### Point of Least Certainty

  The point about which I am **least sure** is whether a specific, niche term exists within the **German-language historiographical tradition** (specifically within the *Historische Sozialwissenschaft* or post-*Historikerstreit* critiques) that has not been translated or adopted into English-language philosophy of history.

  German scholars (e.g., Dan Diner, Saul Friedländer, or critics of the *Wehrmachtsausstellung* debates) have engaged deeply with the *Täterforschung* (perpetrator research) methodology. It is possible that a term like *Erklärungsdualismus* (explanatory dualism) or *Motivationsbruch* (motivational rupture) has been used in this specific context in German monographs without gaining traction in the Anglophone philosophical literature. My confidence regarding the English-language philosophy of history is high; my confidence regarding obscure German methodological terminology is slightly lower.
