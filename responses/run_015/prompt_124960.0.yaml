          *   *The Crux:* Does Dennett say these states are "literally present" in the same way neurons are? No. He's an *instrumentalist* about belief. Beliefs are real patterns, not necessarily internal neural sentences. The friend says "literally present, not just useful metaphors." This is tricky. Dennett thinks they are *real* (real patterns), but not necessarily *internal concrete entities*. The friend's phrasing "literally present" risks sounding like eliminative materialism or strong realism about propositional attitudes.
          *   *Verdict:* Mostly accurate on the setup, but slightly off on the ontology. Dennett is subtle here. It's not "literal" in the sense of a little homunculus, but "real" in the sense of a center of gravity.

      *   *Point 2 (Searle's Objection):*
          *   *Context:* Searle distinguishes Original (intrinsic) vs. Derived (ascribed) intentionality.
          *   *Searle's View:* A thermostat or vending machine has no intrinsic aboutness. We project it.
