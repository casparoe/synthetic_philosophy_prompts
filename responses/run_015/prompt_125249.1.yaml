  9.  **Polishing the Tone:** Academic, precise, instructional but engaging. Ensure the distinction between "labor time" (hours worked) and "labor power" (capacity/energy/knowledge) is clear in the debrief.

  *(Self-Correction during drafting)*: Make sure the "Capital Account" student has a motivation to hoard points. Give them a goal: "Accumulate 500 points to win." Give workers a goal: "Survive (get 20 points)." This creates the tension.
