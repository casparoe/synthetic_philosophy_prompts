      *   **Task:** "Assembling Conceptual Components." Needs to be abstract enough to be fast but concrete enough to feel like work. Let's use paper folding/coding or symbol transcription. Symbol transcription is better for "cognitive" load. Let's go with *Pattern Matching & Encoding*.
      *   **Round 1 (Craft/Formal):**
          *   Task: Decode a complex symbol sequence into a "product" (a specific geometric shape drawn).
          *   Rule: They can talk. They keep a % of points generated. They decide how to organize.
          *   Goal: Show cooperation and retention of knowledge.
      *   **Round 2 (Machine/Real):**
          *   Task: Same output, but the process is broken.
          *   Mechanism: Instructor hands out "Instruction Cards" to Operators. They don't see the whole pattern. They just do step X.
          *   Pace: Instructor calls "Cycle!" every 30 seconds.
          *   Payoff: Total points generated go to Capital. Capital distributes a wage (fixed). Surplus is kept.
          *   Cognitive Shift: Operators don't need to know *why*. Engineers try to optimize but are blocked by rules.
          *   *Nuance Check:* Does this save labor-power? Yes, they don't have to think about the whole pattern, just their step. But they lose the power of the whole.

  4.  **Refining the Mechanics for the "Labor-Power" Nuance:**
      *   To make the "saving of labor-power" visceral, Round 1 needs to be *mentally taxing*. They need to hold the whole design in their heads.
      *   Round 2 needs to be *mentally easy* but *constraining*. They just follow orders. The "machine" (the rule set) holds the knowledge.
      *   *Payoff:* Round 1: Piece-rate (you make it, you get points). Round 2: Hourly wage (fixed points) + Capital takes the rest.

  5.  **Drafting the Debrief:**
      *   Need to guide them from "That was frustrating" to "That was structural."
      *   Connect Round 1 to Cooperation/Manufacture.
      *   Connect Round 2 to Machinery/Real Subsumption.
      *   Highlight the "General Intellect" aspect (knowledge objectified in the machine/rules).
      *   Address the limitation: In class, they can quit. In capitalism, they starve if they quit (property relations).

  6.  **Anticipating Failure Modes:**
      *   *Gaming the system:* Students might try to rebel in Round 2. Need rules to handle this (penalties).
      *   *Confusion:* If Round 2 rules are too complex, they'll blame the teacher, not the structure. Keep rules simple but rigid.
      *   *The "Teamwork" Trap:* They will think "If we just communicated better in Round 2, we'd win." The point is communication is *structurally blocked*. I need to enforce this strictly.
      *   *Capitalist Role:* The student playing Capital might feel guilty or be too nice. They need a script/incentive to maximize accumulation.

