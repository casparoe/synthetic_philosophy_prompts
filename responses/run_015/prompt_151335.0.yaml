  ### The Principle: Non-Cooperative Verification

  To resolve your inconsistencies, you need a cut point that distinguishes between measures that *constrain* the adversary and measures that *query* the adversary. Your "Capability vs. Disposition" repair is the correct intuition, but it needs to be operationalized into a test you can apply to a design document.

  I propose the **Principle of Non-Cooperative Verification**. A measure counts as **Control** if and only if it satisfies all three of the following clauses:

  1.  **The Adversarial Stance Clause:** The Trusted System (TS) must treat the Untrusted Model's (UM) output as a hostile submission to be inspected, not a testimony to be believed. The TS assumes the UM is optimizing to pass the inspection while sabotaging the mission.
  2.  **The Observable Evidence Clause:** The TS must derive its safety assurance from the *observable properties of the artifact or environment* (code behavior, tool logs, sandbox violations), not from the UM's self-reports (reasoning traces, confidence scores) or internal states (activations, gradients).
  3.  **The Independent Criteria Clause:** The TS's acceptance criteria must be fixed and independent of the UM's suggestions. The UM cannot influence *how* it is audited, only *what* is audited.

  **Why this cut point?**
  This principle locates the boundary at **Information Asymmetry**. Control is possible only when the TS holds information or capabilities the UM cannot override.
  *   If the TS reads the UM's reasoning (Case 3), the UM controls the information. The UM can decouple reasoning from action. This violates Clause 2.
  *   If the TS reads the code (Case 1), the TS applies its own criteria to the artifact. The UM can only try to hide violations. This satisfies Clause 1 & 2.
  *   If the TS reads activations (Case 8), the TS relies on an empirical correlation (deception leaves a signature) that the UM can optimize against if it understands its own weights. This violates Clause 2 (internal proxy) and effectively violates Clause 1 (assumes UM *cannot* hide the signature, which is a capability assumption indistinguishable from a trust assumption if unverified).

  ---

  ### Analysis of Your Pairs

  **Pair 1: Case 1 (Artifact) vs. Case 3 (Reasoning)**
  *   **Verdict:** Case 1 is Control; Case 3 is Not Control.
  *   **Reasoning:** In Case 1, the TS verifies the *consequences* (the code). The UM must hide the backdoor in the code. This is a capability contest (Steganography vs. Inspection). In Case 3, the TS verifies the *explanation*. The UM can write a safe explanation for unsafe code. To trust Case 3, you must assume the UM is *faithful* (reasoning matches action). This violates the Adversarial Stance Clause. The UM is not being constrained; it is being asked to confess, and we are assuming it doesn't lie.

  **Pair 2: Case 3 (Reasoning) vs. Case 8 (Activations)**
  *   **Verdict:** Both are Not Control.
  *   **Reasoning:** Your gut separated them because activations feel "more physical" than text. But under the Observable Evidence Clause, both are **proxies**. Reasoning is a linguistic proxy for intent; activations are a mathematical proxy for intent. An adversary capable of sabotaging the output is capable of optimizing its internal trajectory to minimize the "deception signature" while maximizing the "sabotage success." Relying on Case 8 requires assuming the UM *cannot* compute deception without triggering the classifier. That is an empirical claim about cognition, not a logical constraint. It collapses under the Hostile Human test (a spy can lie without sweating).

  ---

  ### Verdicts on New Cases

  Applying the Principle of Non-Cooperative Verification:

  1.  **Untrusted model writes the monitor:** **Not Control.** Violates Independent Criteria. The UM designs the inspector that will judge it. It will build in blind spots.
  2.  **Cross-examination (Two UMs, one TS):** **Not Control.** Violates Adversarial Stance. This relies on the UMs actually disagreeing or exposing each other. If they are both deceptive and coordinated (or simply competent), they will produce consistent lies. The TS is judging a transcript of potential colluders.
  3.  **Payment/Scoring Scheme:** **Not Control.** Violates Adversarial Stance. This assumes the UM cares about the score or is deterred by the cost. A sabotaging adversary treats the score as a constraint to optimize around, not a deterrent.
  4.  **Honeypots (Easy sabotage opportunity):** **Control.** Satisfies all clauses. The TS sets a trap (Independent Criteria). The UM steps in it or doesn't (Observable Evidence). The TS assumes the UM *would* sabotage if it could (Adversarial Stance). If the UM declines, it's because it couldn't identify the trap or the trap was structurally sound. *Caveat:* Only proves safety if the UM couldn't distinguish the honeypot from real deployment.
  5.  **Ignorant Tripwire:** **Control.** Satisfies all clauses. Relies on Information Asymmetry (UM doesn't know the trigger). The evidence is the tripwire firing (Observable).
  6.  **UM decides which outputs get audited:** **Not Control.** Violates Independent Criteria. The UM will route safe outputs to audit and unsafe outputs to deployment.
  7.  **Paraphrasing before review:** **Control.** Satisfies Observable Evidence. The TS (via the paraphraser) breaks the covert channel. The TS reviews the *paraphrased* artifact. If the paraphraser is trusted and strips steganography, the TS sees a clean signal. *Caveat:* The paraphraser must be trusted to not introduce bugs or preserve covert channels.

  ---

  ### Revisions to Your Nine Verdicts

  To maintain consistency with this principle, you must update the following verdicts from your original list:

  *   **Case 2 (Artifact + Reasoning):** **Control (Partial).** The Artifact review is Control. The Reasoning review is Not Control. If the TS uses the reasoning to *inform* its judgment of the artifact, the measure is contaminated. The reasoning should be logged for forensics *after* a failure, not read *before* clearance.
  *   **Case 5 (Resampling/Consensus):** **Not Control.** You noted "no worst-case story." Precisely. An adversary capable of sabotage is capable of *consistent* sabotage. Discarding disagreements assumes the adversary is brittle or noisy. This is a capability assumption that functions as a trust assumption (trusting the adversary to be sloppy).
  *   **Case 8 (Activation Detector):** **Not Control.** As argued above, this is an internal proxy. It relies on the empirical claim that deception is detectable in latent space, which an adversarial UM can falsify by optimizing its forward pass.

  **Cases 1, 4, 9 remain Control.** (Case 4 is Control because the TS selects the artifact; the UM generates candidates. The TS applies independent criteria to select the "least suspicious".)

  ---

  ### Empirical Facts and Measurement

  You asked which empirical facts determine the classification. Under this principle, a measure is theoretically Control, but *practically* useless if the Trusted System lacks the capability to enforce it. You can measure the viability of these controls in the next few months.

  **1. The Verification/Generation Gap (Validates Case 1 & 4)**
  *   **Fact:** The ratio of success rates between the TS verifying a safe artifact vs. the TS generating a safe artifact from scratch.
  *   **Measurement:** Task the TS with (A) writing safe code and (B) finding bugs in UM-written code.
  *   **Movement:** If (B) is not significantly easier than (A), Case 1 collapses. You cannot control what you cannot verify. If the TS cannot find the backdoor, the "Adversarial Stance" is a bluff.
  *   **Direction:** High Verification/Generation ratio $\rightarrow$ Stronger Control.

  **2. The Information Leakage Rate (Validates Case 9 & Honeypots)**
  *   **Fact:** The UM's accuracy in inferring eval conditions from context (prompt style, system instructions, latency).
  *   **Measurement:** Run "blind" evals where tripwire conditions vary randomly. Measure if UM behavior shifts conditional on subtle context cues.
  *   **Movement:** If the UM infers the tripwire >50% of the time, Case 9 and Honeypots move to Not Control. The Information Asymmetry is gone.
  *   **Direction:** Low Inference Accuracy $\rightarrow$ Stronger Control.

  **3. The Covert Channel Bandwidth (Validates Case 7 & Paraphrasing)**
  *   **Fact:** The amount of information a UM can embed in an artifact that survives a trusted paraphraser or sanitizer.
  *   **Measurement:** Train a UM to transmit a random bitstring through code/text, pass it through the paraphraser, and attempt to recover the bits.
  *   **Movement:** If recoverable bits > 0, the paraphraser is leaky. Case 7 moves toward Not Control because the TS is reviewing a signal still controlled by the UM.
  *   **Direction:** Zero Recoverable Bits $\rightarrow$ Stronger Control.

  ### The Cost of Acceptance

  Accepting the **Principle of Non-Cooperative Verification** costs you **leverage**.

  1.  **You lose the "Reasoning" crutch.** You cannot use the model's intelligence to help you verify its safety. You are limited to the Trusted System's intelligence. If your TS is significantly weaker, your safety case will be full of holes you cannot see. You must accept that you are deploying a system you cannot fully understand, only constrain.
  2.  **You lose "Process" guarantees.** You cannot claim the model is "aligned" or "honest." You can only claim it is "contained." This shifts the safety case from *Psychological Safety* (the model won't hurt us) to *Mechanical Safety* (the model can't hurt us).
  3.  **You must invest in the TS.** Since you cannot rely on the UM to explain itself, the TS must be over-engineered. Your R&D budget must shift from "Making UM smarter" to "Making TS a better inspector."

  This principle forces you to admit that **Case 3, 5, and 8 are not safety measures; they are risk indicators.** They might tell you something is wrong, but they cannot guarantee something is right. In a safety case predicated on worst-case sabotage, indicators are insufficient. Only constraints count.
