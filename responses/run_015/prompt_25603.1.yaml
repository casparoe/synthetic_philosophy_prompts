      **2. Strong Defeaters (Reference Retention)**
      *   **Stable Reference:** For this to work, theoretical terms must latch onto real entities despite descriptive errors. The world must contain stable natural kinds that persist across theory change. For example, "electron" referred to a real entity in 1900 and 2000, despite changed properties.
          *   *Live?* Highly live (Kitcher, Psillos).
          *   *PMI Defender:* Will concede some terms survive but argue the *majority* of ontological commitments (like the ether) do not. They will claim this saves only a "thin" realism, not the robust realism you previously held.

      **3. Moderate Defeaters (Structural Continuity)**
      *   **Mathematical Preservation:** The world must be such that the mathematical structure of theories captures reality, even if the ontological interpretation does not. Maxwell's equations survived the shift from ether to field.
