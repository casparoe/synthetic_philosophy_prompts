  3.  **Identify the Underlying Philosophical Tension:**
      *   The core tension is between *Frequency Stability* (broad classes give stable rates) and *Causal Homogeneity* (narrow classes capture specific mechanisms).
      *   Reichenbach's original formulation: Use the narrowest class for which reliable statistics exist.
      *   Hájek's critique: There is no "narrowest" class (single case is unique).
