      *   *Clause 1 (Causal Homogeneity):* Narrow down to the class where the causal mechanism generating the outcome is uniform. (Motivated by Sushi).
      *   *Clause 2 (Epistemic Reliability):* Do not narrow so much that statistical noise overwhelms the signal. (Motivated by Flight/Airline).
      *   *Clause 3 (Screening Off):* Ignore features that are causally irrelevant or already accounted for in the broader mechanism. (Motivated by Flight/Weather).

  5.  **Testing the Principle against User Cases:**
      *   *Flight:* "All transatlantic" satisfies Epistemic Reliability (large N). "This airline" fails Epistemic Reliability (small N, crashes are rare). "Flights today" fails Causal Homogeneity/Screening Off (weather doesn't change crash probability significantly due to safety protocols). -> *Fits.*
      *   *Sushi:* "This restaurant" satisfies Causal Homogeneity (hygiene is local). "All sushi" fails Causal Homogeneity (hygiene varies wildly). Sample size (5) is small, but for food poisoning, the base rate is low enough that 5 clean meals *does* shift probability slightly (Bayesian update on the restaurant's quality). -> *Fits.*
      *   *Stock:* Here is the trouble. "This stock's history" satisfies Causal Homogeneity (it's the same company) but fails Epistemic Reliability/Stationarity (financial time series are non-stationary; past performance $\neq$ future results). "Similar market cap" satisfies Epistemic Reliability but might fail Causal Homogeneity (different business models). The user's conflict is actually rational because the causal structure of finance is *reflexive*, unlike physics or biology. -> *Principle highlights the ambiguity.*
      *   *Rain:* "Days with similar atmospheric pressure/humidity" is the causal class. "Tomorrow" is the indexical. "All days" is too broad. -> *Prediction:* Use the class of "days with meteorologically similar antecedent conditions."

  6.  **Refining the "Stock" Analysis:**
      *   Why does the user feel "This stock's history" is wrong for stocks but "This restaurant's history" is right for sushi?
      *   *Difference:* Food safety is a *latent property* of the restaurant (hygiene standards persist). Stock price is a *reflective property* (price reflects all known info, history is often priced in, or the company changes fundamentally).
      *   The principle needs to distinguish between *stable latent traits* (restaurant hygiene, plane engineering) and *non-stationary processes* (stock prices).

  7.  **Addressing the "Inconsistency":**
