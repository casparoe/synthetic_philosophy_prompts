  2. Americans tend to say a CEO who harms the environment as a foreseen side effect did it intentionally, Japanese participants much less so. Maya says no threat, that's language and mindreading stuff, not morals.

  3. Big US-India gaps on stuff like eating a pet dog after it dies naturally or consensual adult sibling incest with contraception where nobody is harmed. Maya says no threat once you factor in different background beleifs about spiritual contamination and hidden harms.

  4. Sustained Swedish-Saudi disagreement on whether bribery and family favoritism in hiring is wrong, where both sides are given the same info about consequences and consent, talk it through, and still disagree year after year. Maya says yes, that one does put real pressure on objectivity.

  5. Americans in the 1980s vs Americans now on same-sex relationships. Maya says no threat, that's just moral learning over time.

  The new case I wanna spring on them comes from an anthro friend: two small fishing communities with similar tech and religion, call them North Cove and South Cove. Both agree suffering matters and fairness matters, and they agree on all the facts about risk and need. But North Cove says you are obligated to risk your own boat to try to rescue a drowning stranger even at significant cost to yourself and your kin, failing to do so is seriously wrong. South Cove says that kind of rescue is heroic but not required, what is actually required is prioritizing your kin nets even if strangers go hungry, failing that is seriously wrong. Fieldworkers had them discuss each others reasons for weeks, no factual confusion left, and neither side budged. Stable across generations.

