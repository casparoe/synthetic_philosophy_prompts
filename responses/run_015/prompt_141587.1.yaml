      *   **Specific View:** Content fixed by what the producing mechanism was selected to do (natural selection for innate, selection-shaped for acquired). Misrepresentation = gap between function and actual response. General account (not limited to specific states).
      *   **Task:** Map the view's exposure (what makes it false vs. awkward). Use specific cases provided by the user (Selection/Truth indifference, Function-switching, No-selection history systems, Scope/Compositionality).
