          *   *Issue:* Selection optimizes fitness, not truth. If a mechanism fires for a disjunction (Fire OR Shadow OR Dust) because false alarms are cheap and misses are costly, does the content become that disjunction?
          *   *Risk:* Indeterminacy. If selection doesn't distinguish between $P$ and $P \lor Q$ when fitness payoffs are identical, content is underdetermined.
          *   *Teleosemantic Response:* Usually relies on "Normal Conditions" (Millikan) or "Consumer Theory" (Godfrey-Smith). The content is what the *consumer* expects, not just what the producer does.
          *   *Assessment:* This is the core theoretical vulnerability. If the "Normal Condition" can't narrow the disjunction, the theory fails to naturalize *specific* content.

      *   **Case 2: Function-Switching (Exaptation/Redeployment).**
          *   *Issue:* Mechanism selected for $F_1$, later for $F_2$ (contradictory). Which history counts?
          *   *Risk:* Messiness/Underdetermination. If history is layered, content is layered or unstable.
          *   *Teleosemantic Response:* Recent history dominates? Proper function is the *current* selected effect. But if the old function persists latently, is there content ambiguity?
          *   *Assessment:* Awkward but not fatal. Biological functions handle exaptation often. The theory needs a rule for "current proper function."

      *   **Case 3: No Selection History (The "Lucky Draw" Network).**
          *   *Issue:* A network created by random draw (no variation/retention) works perfectly. Does it have content? Teleosemantics says No (no history). Intuition says Yes.
