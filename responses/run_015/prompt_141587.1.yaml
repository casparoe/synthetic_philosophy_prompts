answer: |-
  This is a sophisticated position, and your movement toward teleosemantics is a common trajectory for naturalists who find causal/informational accounts too permissive and functional-role accounts too internalist. You are right to sense that the view's greatest strength—anchoring content in the hard reality of evolutionary history—is also its greatest point of vulnerability.

  Here is a map of the view's exposure, ranked from fatal to merely awkward, followed by an assessment of empirical deciders, predictive distinctiveness, and the charge of unfalsifiability.

  ### 1. Ranking the Defeaters

  **I. Fatal: The Indeterminacy of Fitness-Equivalent Conditions (Your Case 1)**
  *   **The Risk:** If selection distinguishes states only by their contribution to fitness, and two distinct environmental conditions (e.g., *Fire* vs. *Fire-or-Shadow*) contribute identically to fitness given the mechanism's sensitivity, selection history cannot privilege one content over the other.
  *   **Concede or Dismiss:** **Concede.** This is the single greatest theoretical threat. You cannot dismiss this as resting on a rival's assumptions because it attacks the internal coherence of the *selection* mechanism itself. If the history does not discriminate, the history cannot fix content.
  *   **Why it's Fatal:** Teleosemantics promises to naturalize *specific* content. If the theory yields $C_1 \lor C_2$ where intuition and cognitive science require $C_1$, and there is no historical fact of the matter to distinguish them, the theory fails to do its job.
  *   **The Defense Line:** The only robust defense is **Consumer Semantics** (Millikan/Godfrey-Smith). The content is not fixed solely by the producer's history but by the *consumer's* need. The mechanism produces a state that the downstream system uses *as if* it were Fire. If the downstream system acts catastrophically on Shadow, then Shadow is not a "Normal Condition," even if the producer fires.
  *   **Verdict:** If you are running a Producer-only view, this kills the theory. If you run a Producer-Consumer view, it survives but inherits the complexity of mapping consumer norms.

  **II. Serious Limitation: The Compositionality Gap (Your Case 4)**
  *   **The Risk:** Teleosemantics excels at simple indicators (frog flies, bee dances). It struggles to explain how these combine into propositional thought with logical structure (negation, quantification, embedding).
  *   **Concede or Dismiss:** **Concede as a limitation, Dismiss as a falsifier.** You must concede that the "general account" claim is currently promissory. However, you can dismiss the idea that this falsifies the core account of *basic* content.
  *   **Why it's Serious:** If the theory cannot scale to thought, it is not a theory of *mental* content generally, but only of *sub-personal* or *perceptual* content. This restricts your PhD thesis scope significantly.
  *   **The Defense Line:** Argument by analogy (Millikan's *signs* vs. *symbols*) or hybridization (teleosemantics for atoms, functional role for structure). But be honest: the combinatorial machinery is not yet fully naturalized within the selected-effects framework.

  **III. Boundary Definition: The "Lucky Draw" Problem (Your Case 3)**
  *   **The Risk:** A system with no selection history (random draw) that functions perfectly. Intuition says "content"; Teleosemantics says "none."
  *   **Concede or Dismiss:** **Dismiss the intuition, Concede the boundary.** You must bite the bullet that the Lucky Draw system has no content.
  *   **Why it's Awkward:** It clashes with the pre-theoretic view that function determines content. But if you allow the Lucky Draw to have content, you must allow *any* optimizing system to have content.
  *   **The Defense Line:** The view is not about *current capacity* but *normative status*. Without history, there is no norm, only regularity. The Lucky Draw system cannot *misrepresent*, it can only malfunction. If you accept that misrepresentation requires a norm, and norms require history, the Lucky Draw result is a feature, not a bug.
  *   **Vacuity Check:** Extending "selection-shaped" to gradient descent is safe *only if* you insist on **Retention**. Gradient descent involves variation, selection, and *retention of weights*. A single random draw lacks retention. This distinguishes it from vacuous optimization (like a rock minimizing potential energy).

  **IV. Merely Awkward: Function-Switching and Exaptation (Your Case 2)**
  *   **The Risk:** Layered histories create layered or conflicting contents.
  *   **Concede or Dismiss:** **Dismiss.** This is not a bug; it is biological realism.
  *   **Why it's Awkward:** It makes content attribution messy. A state might have a "proper function" (current selection) and a "historical function" (past selection).
  *   **The Defense Line:** Content is indexed to the **Current Proper Function**. If a mechanism is actively selected *against* responding to luminance and *for* spatial layout, the luminance response is a malfunction or a vestige, not the content conferrer. The messiness reflects the messiness of the brain, not the theory.

  ---

  ### 2. Empirical Deciders

  You asked what findings would be decisive. Teleosemantics is unusually vulnerable to empirical neuroscience and evolutionary psychology findings because it ties content to causal history.

  **Decisive Against the View:**
  1.  **Prevalence of Drift/Constraint:** If it were established that the majority of neural mechanisms underlying perception are products of genetic drift, developmental constraint, or physical necessity rather than differential selection, the view loses its grip. (e.g., if visual edge detection is a physical inevitability of neural tissue, not a selected trait).
  2.  **Indiscriminable Normal Conditions:** If empirical investigation reveals that the "Normal Conditions" for a mechanism are inextricably disjunctive *even from the consumer's perspective* (i.e., the downstream system treats Fire and Shadow identically in all evolutionary contexts), then content is genuinely indeterminate.
  3.  **Rapid Content Switching without Re-selection:** If cognitive states change content faster than any selection process (biological or learning-based) could track, without a corresponding change in mechanism, the history constraint is too slow to account for dynamic content.

  **Leave the View Untouched:**
  1.  **Ubiquitous Redeployment:** Finding that mechanisms are constantly repurposed (Case 2) does not hurt the view; it just requires the theory to track the *most recent* selection episode.
  2.  **High False-Alarm Rates:** Finding that mechanisms are tuned for high false-alarm rates (Case 1) is consistent with teleosemantics. It just means the content is the disjunction that maximizes fitness, not the "truth." (See below).

  ---

  ### 3. Predictive Distinctiveness

  What does your view predict that informational, functional-role, or interpretivist rivals do not?

  1.  **Divergence of Truth and Content:** Informational theories (Dretske early, Fodor) tend to tie content to reliable covariance. Teleosemantics predicts that content can diverge from truth if fitness requires it. A mechanism can have the content *Predator* even if it reliably covaries with *Rustling-Grass*, provided the cost of missing a Predator outweighs the cost of false alarms. **Prediction:** We should find systems where the "veridical" condition is not the content condition.
  2.  **No Content without History:** Unlike functional-role or interpretivist views, teleosemantics predicts that a perfect functional duplicate of a human (Swampman/Lucky Draw) has **no** representational states, only causal surrogates. It predicts no *mis*representation, only error.
  3.  **Normativity is External:** Unlike functional-role internalism, teleosemantics predicts that the norms governing content are not discoverable by analyzing the current system state alone. You must look outside the skin (to the history).
  4.  **Breakdown of Content in Pathology:** If a mechanism is damaged such that it no longer performs its selected function, teleosemantics predicts it loses its content (becomes noise), whereas informational accounts might say it now carries information about the damage.

  ---

  ### 4. The Charge of Unfalsifiability (The "Schema" Objection)

  You worry the view is becoming a schema: *"fill in your favourite selection process."*

  **Is this true?**
  Partially. The move from "Natural Selection" to "Selection-Shaped" (covering learning, gradient descent, cultural evolution) is a broadening move. If "selection" is defined merely as "optimization," the theory becomes vacuous (pansemantics).

  **Is it a defect?**
  It is a defect *unless* you strictly define the **Retention Condition**.
  To avoid vacuity, "selection-shaped" must require:
  1.  **Variation:** A pool of variants (weights, structures, behaviors).
  2.  **Differential Retention:** A filter based on performance.
  3.  **Inheritance:** The successful variants pass their structure to the next iteration (of the network, the organism, or the culture).

  If you enforce these three, the view is not a schema; it is a specific structural claim about how norms arise. If you allow any process that "looks like" optimization (e.g., a rock settling in mud), it is vacuous.

  **Honest Assessment:**
  The view risks unfalsifiability if "Normal Conditions" are defined post-hoc to save any attribution of content. To prevent this, you must commit to the idea that **Normal Conditions are empirically discoverable facts about the history of the mechanism**, not interpretive posits. If you cannot specify the selection episode empirically, you cannot specify the content.

  ---

  ### 5. Addressing Your Core Worry: Indifference to Truth

  You stated: *"What I find genuinely worrying is the conjunction of selection's indifference to truth and the indeterminacy that seems to follow from it."*

  Here is the hard truth you need to integrate into your thesis: **Teleosemantics does not naturalize Truth; it naturalizes Utility.**

  If you hold that content *must* be truth-conditional in a strong correspondence sense, teleosemantics will always feel like a category error. But if you accept that content is **normative guidance for action**, the "indifference to truth" is not a bug; it is the explanation of why we have content at all.

  **Regarding the Indeterminacy:**
  The indeterminacy arises only if you assume there is a "True" content (Fire) that selection failed to pick out. The teleosemantic reply is: **There is no "Fire" content waiting to be picked.** There is only the fitness landscape.
  *   If the fitness landscape treats *Fire-or-Shadow* as a single unit of selection, then the content *is Fire-or-Shadow*.
  *   If that feels wrong, it is because you are smuggling in an intuition that content *ought* to be granular.
  *   **The Fix:** This is why you need the **Consumer**. The consumer system usually *does* distinguish Fire from Shadow (e.g., it runs from Fire but ignores Shadow). Therefore, the *producer's* output is selected *because* the consumer treats it as Fire. The consumer's history breaks the tie that the producer's history leaves indeterminate.

  **Final Advice for the Thesis:**
  Do not try to defend teleosemantics as a theory that recovers our pre-theoretic notion of "Truth." Defend it as a theory that explains **Normativity** and **Misrepresentation** in a physical world.
  *   **Rank the Indeterminacy Objection as your primary antagonist.** If you can solve it via Consumer Theory, the other objections (Lucky Draw, Function-Switching) become manageable boundary conditions.
  *   **Be explicit about the "Selection-Shaped" clause.** Define the retention conditions rigorously to avoid the vacuity charge.
  *   **Accept the limitation on Thought.** Claiming the view explains propositional attitude content currently overextends the evidence. Frame it as a theory of *basic* content with a research program for extension.

  If you can show that the "Fire-or-Shadow" disjunction is broken by the downstream system's specific expectations, you save the view from fatal indeterminacy. If you cannot, the view collapses into a history-based version of causal covariance, which you already know is insufficient.
