          *   *Case 2:* Proper function is usually the *current* selected effect. Past functions become "derived" or lose status. *Verdict:* Dismiss as a feature, not a bug. Biology is layered.
          *   *Case 3:* The "Lucky Draw." Teleosemantics *must* deny content here to maintain the history constraint. If you allow gradient descent, you risk pansemantics. *Verdict:* Concede the counter-intuitive result for the Lucky Draw to save the theory from vacuity. Distinguish "optimization" from "natural selection" carefully.
          *   *Case 4:* Compositionality. Acknowledge the promissory note. Millikan's *signs* vs. *symbols*. *Verdict:* Serious weakness. Needs more work to claim generality.
      *   **Empirical Deciders:**
          *   *Fatal:* If neural mechanisms are mostly drift/constraint (no selection). If "Normal Conditions" are empirically unknowable.
          *   *Untouched:* If redeployment is common (theory adapts).
      *   **Predictive Power:** What does Teleosemantics predict that others don't?
          *   Misrepresentation requires a history of failure/success.
          *   Content tracks *fitness* conditions, not necessarily *truth* conditions (divergence possible).
