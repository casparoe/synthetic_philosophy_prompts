answer: |-
  ### Structural Sketch: The Sestina as Social Choice

  The sestina's rigid permutation of end-words mirrors the displacement of strategic vulnerability in the Gibbard-Satterthwaite theorem. Just as the theorem proves that restricting the domain of preferences cannot eliminate manipulability but merely shifts it to a different configuration of alternatives, the sestina's rotating rhymes ensure that no end-word ever rests in the same position twice; the "hole" in the logic moves, but remains present. The final envoi, which consolidates all six words into three lines, represents the theorem's convergence: when the rotation stops and the system seeks stability under unrestricted conditions, the variables collapse into a single point of authority. The "shadow" serves as the persistent, hidden preference that cannot be exorcised, re-emerging in every stanza to haunt the designer's attempt at a perfect mechanism.

  ***

  ### The Mechanism Designer's Lament

  I calibrated the box to count each **vote**,
  seeking to banish the manipulative **shadow**,
  offering citizens a wide democratic **range**,
  demanding from every heart an honest **truth**,
  fearing the rise of a single **dictator**,
  where each citizen reveals their true **preference**.

  There is no strategy-proof **preference**
  when three or more options contend for the **vote**.
  The liar hides within the statistical **shadow**,
  expanding the outcome beyond safe **range**,
  distorting the aggregate social **truth**,
  until the system crowns a silent **dictator**.

  I patched the code to limit the **dictator**,
  restricting the profiles of each **preference**,
  seeking to restore the veracity of **truth**,
  by narrowing the field of every **vote**.
  But the manipulation slipped through the **range**,
  and grew longer beneath the algorithmic **shadow**.

  No restriction exorcises the strategic **shadow**,
  it merely displaces the power of the **dictator**.
  You cannot have honesty and unlimited **range**,
  without submitting to a dominant **preference**.
  The unrestricted domain demands a final **vote**,
  that sacrifices fairness for a stable **truth**.

  We crave the absolute liberty of **truth**,
  yet flee from the autocrat's **dictator**,
  so we limit the choices presented to **vote**,
  accepting a diminished political **range**,
  to mask the tyranny of single **preference**,
  though the manipulation lurks in the **shadow**.

  The vulnerability shifts but remains in **shadow**,
  proving there is no perfect social **truth**.
  There is no strategy-proof **preference**
  that bows to the sovereign **dictator**'s rule.
  If you keep the outcome space full in **range**,
  you invite the unrestricted **vote**.

  To save the **vote** from the lying **shadow**,
  we must contract the democratic **range** and **truth**,
  or bow to the **dictator**'s singular **preference**.

  ***

  **Note on Formal Liberties:**
  The poem treats domain restriction as a tragic sacrifice of "democratic range" rather than a principled escape clause (like single-peaked preferences), and it conflates the mathematical range of the social choice function with the breadth of choices available to voters.

  Verdict: The theorem dictates that preserving an unrestricted range of outcomes necessitates either accepting strategic manipulation or submitting to a dictator.
