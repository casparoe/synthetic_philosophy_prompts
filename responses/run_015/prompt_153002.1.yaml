answer: |-
  # Activity: The Twin-Sky Registry

  **Time:** 80 Minutes
  **Players:** 14 (Split into two bureaus of 7)
  **Goal:** Survive the shift without crashing the system.
  **Philosophy:** Frege's Puzzle (Sense/Reference, Cognitive Value) — *kept secret until debrief.*

  ---

  ### 1. Setting & Roles
  You are the Shift Supervisor. The room is divided into two isolated zones: **Bureau Morning** (left side) and **Bureau Evening** (right side). They cannot talk directly across the divide. They can only communicate via the **Master Registry Board** (whiteboard at the front) and by spending tokens to unlock "Translation Keywords."

  **Roles within each Bureau (7 students):**
  *   **2 Observers:** Read the observation cards.
  *   **2 Registrars:** Manage the internal ID list (M-01, M-02... / E-01, E-02...) and token purse.
  *   **3 Analysts:** Decide when to propose merges and manage the translation keywords.

  ### 2. Materials
  *   **Observation Decks:** Two distinct decks (Morning/Evening).
      *   *Morning Cards:* Describe objects via Thermal Albedo, Orbital Velocity, Dawn Angle. (e.g., "Target: High Heat, 4.2km/s, Azimuth 90")
      *   *Evening Cards:* Describe objects via Reflected Spectra, Radar Cross-Section, Dusk Angle. (e.g., "Target: Red Spectrum, 0.5m², Azimuth 270")
      *   *The Match:* 4 pairs of cards describe the *same* physical satellite. The data looks different but refers to the same thing.
      *   *The Trap:* 1 pair of cards describes *different* objects that share one superficial property (see Mechanics).
  *   **Tokens:** Poker chips or printed slips.
      *   *Processing Tokens:* Currency for actions.
      *   *Verification Tokens:* Required to submit an identity claim.
      *   *Cognitive Units:* 10 large red tokens placed in a visible pile on the board.
  *   **Keyword List:** A menu of shared concepts they can buy (e.g., "Mass," "Energy," "Trajectory"). Cost: 2 Processing Tokens per keyword use.
  *   **Registry Boards:** Each bureau gets a private whiteboard. One Master Board at the front.

  ### 3. The Rules (Handout)
  *Do not mention Frege, Sense, or Reference.*

  1.  **Objective:** Maximize bureau efficiency. Minimize Cognitive Load.
  2.  **Internal ID:** Every observation card must be logged with an internal ID (M-01, E-01). This is free.
  3.  **Redundancy Penalty:** If two IDs (one Morning, one Evening) refer to the same object but remain separate on the Master Board, the **Cognitive Unit** pile loses 1 token per round. *You can see the pile shrinking.*
  4.  **Merging:** You may propose an identity claim (e.g., "M-01 is E-04").
      *   **Cost:** 1 Verification Token + 1 Purchased Keyword (e.g., "Both match on 'Energy'").
      *   **Reward:** If correct, gain 5 Processing Tokens and free up registry slots.
      *   **Risk:** If wrong (false merge), lose 8 Processing Tokens immediately ("Registry Collapse").
  5.  **Tautology:** Writing "M-01 is M-01" is free, always correct, and grants no rewards.
  6.  **Communication:** Bureaus cannot speak. They can only write on the Master Board or spend tokens to reveal a Keyword comparison.

  ### 4. Timeline (80 Mins)

  **0:00 – 0:10 | Setup & Briefing**
  Split the room. Hand out decks and tokens. Give each bureau 20 Processing Tokens. Place the 10 Cognitive Units on the front board. Explain the rules strictly as operational constraints. Do not explain *why* redundancy costs cognitive units, just that it does.

  **0:10 – 0:30 | Phase 1: Observation (The $a=a$ Phase)**
  Bureaus log their cards internally. They will quickly realize they have lists of objects. They might write "M-01 is M-01" to feel safe. It costs nothing but solves nothing. The Cognitive Unit pile sits untouched for now.
  *Supervisor Note:* Walk around. If they ask "Are any of these the same?", say: "Your instruments measure different properties. You tell me."

  **0:30 – 0:50 | Phase 2: The Drain (The Crisis)**
  Announce "End of Round 1." Remove 1 Cognitive Unit for every unmerged pair (you track this secretly based on the key). Let them *see* the pile shrink.
  Panic sets in. They need to merge to stop the drain. But they can't compare raw data (Thermal vs. Spectrum). They must spend Processing Tokens to buy Keywords ("Show me 'Energy' levels for M-01 and E-04").
  *The Trap:* One pair (say M-03 and E-07) both show "High Energy." If they merge based on this keyword alone, trigger the **Registry Collapse** (-8 Tokens). This hurts.

  **0:50 – 1:00 | Phase 3: The Gamble**
  Cognitive Units are low (2 or 3 left). They have to move fast. Some bureaus will hoard tokens and refuse to merge (watching the Cognitive Units hit zero). Others will merge recklessly to stop the drain and hit the Trap.
  Stop the game when the Cognitive Units are gone or time expires.

  **1:00 – 1:20 | Debrief (The Frege Map)**
  Bring everyone together. Put the decks side-by-side. Reveal the matches.
  Ask: "Why did 'M-01 is M-01' feel useless, but 'M-01 is E-04' felt dangerous but valuable?"

  **Map the mechanics to Frege:**
  *   **The Object (Satellite):** *Bedeutung* (Reference). The thing in the world.
  *   **The Internal ID + Card Data:** *Sinn* (Sense). The mode of presentation. Morning and Evening had different *senses* for the same *reference*.
  *   **The Cognitive Unit Drain:** The epistemic cost of redundant representations. Holding two senses for one reference wastes mental space.
  *   **The Keyword Cost:** The work required to align senses.
  *   **The Trap:** Why $a=b$ is informative (and risky). It extends knowledge, unlike $a=a$.
  *   **The Token Reward:** Cognitive Value. An identity statement is valuable because it connects two distinct senses to one reference.

  ### 5. What Will Go Wrong (And How to Fix It)
  1.  **Token Hoarding:** One bureau might decide the Cognitive Units aren't their problem and just sit on their Processing Tokens.
      *   *Fix:* Announce mid-game that if Cognitive Units hit zero, *all* Processing Tokens are halved. Make the pain shared.
  2.  **Rule Confusion:** They might try to talk across the room.
      *   *Fix:* Be the strict border guard. "That costs 5 tokens." Enforce the silence to maintain the "different senses" barrier.
  3.  **The Trap is Too Obvious:** If "High Energy" is the only shared trait, they might suspect it.
      *   *Fix:* Ensure the Trap cards look *very* similar on the keyword translation, but differ on a second hidden check if they spend extra tokens. Make the penalty sting enough they remember it.
  4.  **Running Long:** The debrief is where the philosophy happens. Don't let Phase 3 drag. Cut it off even if they haven't merged everything. The unfinished tension is good for discussion.

  ### 6. Honest Note: What This Can't Reproduce
  Be frank with them in the last 5 minutes. This simulation is pragmatic; Frege was logical.

  1.  **Utility vs. Truth:** In the game, $a=b$ is valuable because it saves tokens (utility). For Frege, $a=b$ is valuable because it extends *knowledge* (cognitive significance), even if it has no cash value. The game makes it about *economy*, Frege makes it about *meaning*.
  2.  **Contingency vs. Necessity:** In the game, merging is a guess that could be wrong (empirical). For Frege, if "Hesperus is Phosphorus" is true, it is necessarily true. The game simulates the *discovery* process, not the *modal status* of the identity.
  3.  **A Priori Status:** The game forces them to spend tokens to verify. Frege's puzzle is about why the statement is informative *even if* you know the reference is the same. The game relies on ignorance; Frege relies on the structure of thought itself.

  You have to supply verbally that Frege wasn't worried about running out of processing tokens. He was worried about how our minds grasp the world. The game makes them *feel* the friction of that grasp, but the philosophical weight is heavier than the token economy.

  *(Also, sorry if the card decks are a bit clunky, I printed them last minute and the cut lines are off.)*
