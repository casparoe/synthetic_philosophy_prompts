answer: |-
  Good morning. For those who don't know me, I'm [Your Name]. Grandpa died on Tuesday. He was three days shy of his ninety-fourth birthday.

  He left me a list of instructions for today. Most of them were about the music and the food. But the most important one was about how we talk about his age. He told me: "Don't let anyone stand up here and talk about me like I was fading. Don't let anyone pity me."

  He knew how these services usually go. He knew people look at a man in his nineties and see a long decline. He saw it differently.

  Most of you knew him as a corn and soybean man. You knew him by the tractor he drove and the fence lines he kept straight. In his last few years, he didn't read much, except for the seed catalog and, surprisingly, a paperback by an old Roman philosopher named Cicero. He read that little book twice. For a man who usually only read about germination rates, that was a statement.

  He wasn't trying to become a scholar. He was looking for backup. He found two things in that book that he wanted me to share with you, because they were the things he lived by at the end.

  The first was that the old have a kind of power over the young. He used to tell us grandkids this to our faces, usually with a grin that said he knew something we didn't. He didn't mean money, and he didn't mean authority. He meant that while we were running around worrying about what might happen, he had the power of knowing what *does* happen. He had the power of having stayed. He knew that storms pass, that prices cycle, and that character matters more than luck. He wasn't jealous of our energy; he knew we were jealous of his peace.

  The second thing was about the work. He said that when his back went out, people assumed he stopped farming. He told me, "You don't stop farming just because your body can't. You just farm a different crop."

  When he couldn't walk the rows anymore, he watched the weather. When he couldn't lift the bags, he told us the stories of where the topsoil came from. He kept his mind working the ground even when his boots weren't on it. He didn't retreat from the world; he just changed his position in it.

  So, I'm not going to stand here and tell you he's in a better place, or that he's finally at rest from his suffering. He didn't think he was suffering. He thought he was finishing the harvest.

  To his neighbors: you know a field isn't judged by how it looks in the winter, but by what it yielded in the fall. Grandpa yielded a lot. To his family: we miss him, but we don't need to pity him. He got to be ninety-three. He got to keep his mind sharp until the very end. He got to choose how he stood in this field.

  He didn't fade. He was harvested, full and ripe, exactly on time.

  Thank you.
