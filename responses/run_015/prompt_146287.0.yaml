  Alice, Bob, and Charlie are picking hats for the logic parade.

  Charlie, a chromatic obsessive who only counts total redness, shouts: "Two red hats beat two blue hats! You both agree it's warmer. Pareto satisfied!"

  Alice claims liberal rights over her own head: "But if Bob wears Blue, I choose Blue. So Two Blue beats Red-Blue."

  Bob claims liberal rights over his: "And if Alice wears Red, I choose Blue. So Red-Blue beats Two Red."

  Charlie does the math, his eyes cross, and he declares: "So Two Red beats Two Blue, which beats Red-Blue, which beats Two Red."

  Alice: "So what's the social choice?"

  Charlie hands them each a Möbius strip. "Since social preference is cyclic, I figured you'd want headgear that loops back on itself. Now stop asking for transitivity."
