answer: |-
  ### Taxonomy of Deflationary and Adjacent Truth Positions

  **Root Node:** Does the predicate "is true" contribute any *substantive* explanatory power (beyond logical generalization or speech-act force) to an account of assertion, belief-fixation, or semantic content?
  *   **YES:** **Inflationary/Robust Realism** (Adjacent Position). *Truth is a natural or metaphysical property (e.g., Correspondence, Coherence) that explains why successful assertions succeed.*
  *   **NO:** **Deflationary Cluster** (Proceed to Pressure Point 1).

  ---

  #### Pressure Point 1: Blind Ascriptions (Generalization)
  **Node:** Is the utility of "is true" exhausted by its role as a **logical device** for quantifying over propositions (enabling blind ascriptions like "Everything the Oracle said is true"), rather than serving as a grammatical proxy or speech act?
  *   **YES (Logical Device):** *Truth functions to generalize over sentence/proposition positions.* (Proceed to Pressure Point 2A).
  *   **NO (Non-Logical Function):** *Truth functions as a linguistic surrogate or an act of endorsement.* (Proceed to Pressure Point 2B).

  ---

  #### Pressure Point 2A: The Liar (For Logical Device Views)
  **Node:** To resolve the Liar Paradox, must the equivalence schema ("P" is true iff P) be **explicitly restricted** or axiomatized to exclude pathological cases?
  *   **YES (Restricted Schema):** *The T-schema is not universally valid; it requires a formal boundary.* (Proceed to Pressure Point 3A).
  *   **NO (Unrestricted/Implicit):** *The schema holds generally; paradox is handled by elimination or is not a semantic fault.* (Proceed to Pressure Point 3A).

  #### Pressure Point 2B: The Liar (For Non-Logical Views)
  **Node:** Is the Liar sentence rendered harmless because it is **syntactically ill-formed** (category error) or **pragmatically defective** (void endorsement)?
  *   **SYNTACTIC BLOCK:** *The sentence fails to express a proposition due to pro-form failure.* (Proceed to Pressure Point 3B).
  *   **PRAGMATIC VOID:** *The sentence is grammatically fine but fails to perform a speech act.* (Proceed to Pressure Point 3B).

  ---

  #### Pressure Point 3A & 3B: Domain Uniformity
  **Node:** Does the deflationary analysis apply **identically** across empirical, moral, and aesthetic judgments?
  *   **YES (Global Uniformity):** *Truth is the same logical/pragmatic device in ethics as in physics.*
  *   **NO (Local Variation):** *Truth may be deflationary in some domains but requires domain-specific restrictions or variations in others.*

  ---

  ### Leaf Positions and Awkward Commitments

  1.  **Ramsey-style Redundancy**
      *   *Path:* No Explanatory Power → Logical Device → Unrestricted Schema → Global Uniformity.
      *   *Awkward Commitment:* Must treat "It is true that P" as strictly eliminable, making the logic of generalization (e.g., "Everything he said") awkwardly dependent on higher-order quantification that Ramsey did not fully formalize.

  2.  **Horwich-style Minimalism**
      *   *Path:* No Explanatory Power → Logical Device → Restricted Schema → Global Uniformity.
      *   *Awkward Commitment:* Must deny truth is a substantive property while simultaneously positing a specific axiomatic theory of truth (the T-schema axioms) that looks suspiciously like a substantive explanation of the concept.

  3.  **Grover-style Prosententialism**
      *   *Path:* No Explanatory Power → Non-Logical (Syntactic Block) → Global Uniformity.
      *   *Awkward Commitment:* Must assert that "That is true" is a single, indivisible grammatical unit (a pro-sentence) analogous to a pronoun, which contradicts the intuitive linguistic analysis that "true" is a predicate modifying "that."

  4.  **Strawsonian Performative Endorsement**
      *   *Path:* No Explanatory Power → Non-Logical (Pragmatic Void) → Global Uniformity.
      *   *Awkward Commitment:* Must deny that "It is true" describes the statement at all, which makes embedding truth claims in logical operators (e.g., "If it is true that P, then Q") difficult to explain without reintroducing propositional content.

  5.  **Unnamed Hybrid (Minimalist Pluralism)**
      *   *Path:* No Explanatory Power → Logical Device → Restricted Schema → **Local Variation**.
      *   *Awkward Commitment:* Must explain why truth is a purely logical device in empirical science but requires domain-specific restrictions in ethics without slipping into the claim that moral truth is a different *kind* of property (inflationism).

  ---

  ### Overlap, Gaps, and Indistinguishability

  **Indistinguishable Pair: Ramsey-style Redundancy vs. Horwich-style Minimalism**
  *   **Flag:** These two positions are flagged as logically overlapping on the **Liar Branch**.
  *   **Diagnosis:** This reflects an **unmotivated distinction** in the context of modern logic. Ramsey died before the Liar was formalized as a constraint on deflationism; interpreting him as endorsing an "Unrestricted Schema" is a charitable reconstruction. In practice, any modern Ramseyian must adopt Horwich's restrictions to avoid inconsistency. The gap is historical, not logical.

  **Unoccupied Combination: The "Pragmatic Pluralist"**
  *   **Combination:** Non-Logical Function (Performative) + Pragmatic Void (Liar) + **Local Variation (Domains)**.
  *   **Diagnosis:** This combination is **merely unattractive**, not incoherent. It would posit that "is true" is an act of endorsement in science but functions differently in ethics. It is unoccupied because performative theorists (like Strawson) typically argue for the uniformity of speech-act logic across domains; introducing domain variance undermines the universal pragmatic account they seek to offer.

  **Unoccupied Combination: The "Syntactic Pluralist"**
  *   **Combination:** Non-Logical Function (Pro-sentence) + Syntactic Block (Liar) + **Local Variation (Domains)**.
  *   **Diagnosis:** This is **incoherent**. Prosententialism relies on a universal grammar of anaphora. If "is true" functions as a pro-sentence in physics but not in ethics, it ceases to be a grammatical constant and reverts to being a property with variable semantic content, collapsing into inflationism.

