      *Refining for tightness:* Ensure the transition between D-Q points is sharp. Make sure the distinction between Gregorian tools and Lakatosian framework is clear. Gregorian = external scaffolding. Lakatosian = internal restructuring of the scaffolding generator.

      *Final Polish:* Check the voice. Needs to sound like a peer arguing, not a textbook. "You are right to push..." "Here is the break..."

