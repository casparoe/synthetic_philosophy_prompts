answer: |-
  # Material-Constitution Compliance Protocol (MCCP-1)
  **Version:** 1.0 (Senior Officer Draft)  
  **Estimated Execution Time:** 30 Minutes  
  **Applicability:** All restoration, conservation, and replication proposals affecting collection identity.

  ## Purpose
  This procedure operationalizes the distinction between an **Artwork** (an intentional object defined by form, function, and history) and its **Substrate** (the physical matter constituting it). It is designed to determine whether an object retains its identity as the *same work* following material intervention.

  **Note to Staff:** This protocol prioritizes the persistence conditions of the *Artwork*. Under the framework of material constitution, the Artwork and the Substrate are distinct entities. The Substrate may be destroyed or replaced without necessarily destroying the Artwork, provided specific historical and functional conditions are met.

  ---

  ## Phase 1: Empirical Substrate Assessment (10 Minutes)
  *Goal: Establish the physical continuity of the matter.*

  **Q1.1: What percentage of the original Substrate (mass/volume) remains in the object?**
  *   **Method:** Conservation lab analysis (XRF, microscopy, mass balance).
  *   **Sufficient Answer:** A precise percentage estimate (e.g., "95%," "30%," "0%").
  *   **Decision Rule:**
      *   If **>50%**: Proceed to Q1.2.
      *   If **≤50%**: Proceed to Q1.2, but flag for "High Material Intervention."
      *   If **0%**: Proceed immediately to **Phase 3 (Hard Case)**.

  **Q1.2: Is the new material distinguishable from the original to a trained observer?**
  *   **Method:** Visual inspection under standard gallery lighting and UV.
  *   **Sufficient Answer:** "Indistinguishable," "Distinguishable upon close inspection," or "Noticeable to casual viewer."
  *   **Decision Rule:**
      *   If **Noticeable to casual viewer**: **STOP.** Classify as *Altered Work*. (Identity compromised for exhibition/insurance).
      *   If **Indistinguishable** or **Close inspection only**: Proceed to Phase 2.

  ---

  ## Phase 2: Historical and Causal Continuity (10 Minutes)
  *Goal: Establish the continuity of the Artwork's history.*

  **Q2.1: Has the object remained in continuous institutional custody or documented chain of care during the intervention?**
  *   **Method:** Provenance records, conservation logs.
  *   **Sufficient Answer:** "Yes, uninterrupted" or "No, left custody/chain broken."
  *   **Decision Rule:**
      *   If **No**: **STOP.** Classify as *Replica/New Work*. (Causal history broken).
      *   If **Yes**: Proceed to Q2.2.

  **Q2.2: Was the transformation process additive/conservational or destructive/reductive?**
  *   **Method:** Review of conservation proposal.
  *   **Sufficient Answer:** "Additive/Stabilizing" (e.g., filling, cleaning) or "Destructive" (e.g., melting, grinding, dissolving).
  *   **Decision Rule:**
      *   If **Destructive**: Proceed to **Phase 3 (Hard Case)**.
      *   If **Additive/Stabilizing**: Proceed to Phase 4.

  ---

  ## Phase 3: The Hard Case (Total or Destructive Replacement) (5 Minutes)
  *Goal: Adjudicate identity when Substrate continuity is lost.*
  *This phase applies the "Statue/Clay" distinction: The Artwork may survive the loss of the Substrate if the Form and Causal Agency are preserved.*

  **Q3.1: Does the original Form persist via original tooling, molds, or direct causal lineage?**
  *   **Method:** Verification of molds, casts, or digital files used.
  *   **Sufficient Answer:** "Original molds/tooling used" or "New interpretation/re-sculpted."
  *   **Decision Rule:**
      *   If **New interpretation**: **STOP.** Classify as *Replica/New Work*.
      *   If **Original molds/tooling**: Proceed to Q3.2.

  **Q3.2: Was the replacement executed to preserve the specific artistic function of the original?**
  *   **[VALUE FLAG]** *This is not an empirical fact. It requires judging the artist's intent.*
  *   **Sufficient Answer:** "Yes, function preserved" or "No, function altered."
  *   **Decision Rule:**
      *   If **No**: **STOP.** Classify as *Derivative Work*.
      *   If **Yes**: Proceed to Phase 4.

  ---

  ## Phase 4: Final Classification (5 Minutes)
  *Goal: Assign identity status for documentation.*

  **Q4.1: Does the object still fulfill the aesthetic and historical role defined in its accession record?**
  *   **[VALUE FLAG]** *Curatorial judgment required.*
  *   **Sufficient Answer:** "Yes" or "No."
  *   **Final Output:**
      *   If **Yes** (and passed Phase 1 & 2): **Original Work (Conserved).**
      *   If **Yes** (and passed Phase 3): **Original Work (Substrate Replaced).**
      *   If **No** at any STOP point: **Replica / New Accession Required.**

  ---

  # Application of MCCP-1 to Current Proposals

  ### Case 1: Ceramic Vessel (1700s)
  *   **Proposal:** 30% of original clay replaced with chemically identical, newly fired material.
  *   **Execution:**
      *   **Q1.1:** 70% original remains. (>50% Pass).
      *   **Q1.2:** Chemically identical; indistinguishable to casual viewer. (Pass).
      *   **Q2.1:** In custody. (Pass).
      *   **Q2.2:** Additive/Stabilizing (filling loss). (Pass).
      *   **Q4.1:** Fulfills aesthetic role. (Pass).
  *   **MCCP Output:** **Original Work (Conserved).**
  *   **Analysis:** The Substrate is compromised but not destroyed. The Artwork's persistence conditions (form/history) are easily met. No conflict with intuition.

  ### Case 2: Bronze Equestrian Monument
  *   **Proposal:** Original bronze melted down due to structural failure; recast into identical form using original molds.
  *   **Execution:**
      *   **Q1.1:** 0% original remains. (Trigger Phase 3).
      *   **Q3.1:** Original molds used. (Pass).
      *   **Q3.2:** Executed to preserve artistic function (monumental display). (Pass).
      *   **Q4.1:** Fulfills aesthetic/historical role. (Pass).
  *   **MCCP Output:** **Original Work (Substrate Replaced).**
  *   **Analysis:**
      *   **Conflict:** You noted your intuition is that the monument is *lost*.
      *   **Metaphysical Justification:** Under the material constitution framework, the *Artwork* (the statue) is not identical to the *Substrate* (the bronze). The Statue's persistence conditions rely on the continuity of Form and Causal Agency. Because the molds (the causal blueprint) were preserved and the institutional custody was unbroken, the *Artwork* persisted through the destruction of the *Matter*.
      *   **Administrative Consequence:** For insurance and labeling, this remains the original accession number, though a conservation note must append "(Recast [Date])."

  ### Case 3: Marble Relief
  *   **Proposal:** 5% of stone replaced with modern synthetic composite; alters surface reflectivity noticeably.
  *   **Execution:**
      *   **Q1.1:** 95% original remains. (>50% Pass).
      *   **Q1.2:** **Noticeable to casual viewer** due to reflectivity.
  *   **MCCP Output:** **STOP. Classify as *Altered Work*.**
  *   **Analysis:**
      *   **Metaphysical Justification:** While the Substrate is mostly intact, the *Artwork* is an intentional object defined by its aesthetic function. If the intervention alters the viewer's experience (reflectivity), the Artwork's identity conditions are violated, even if the Substrate is 95% original.
      *   **Administrative Consequence:** Cannot be labeled as "Unrestored." Insurance valuation may need adjustment for "diminished artistic integrity" despite high material retention.

  ---

  # Limitations and Required Referrals

  This procedure is a tool for consistency, not a metaphysical truth-machine. It necessarily suppresses nuance to remain runnable. The following issues **cannot** be settled by MCCP-1 and must be referred to the Senior Conservation Compliance Officer (your office):

  **1. The "Coincidence" Suppression**
  *   **Limitation:** MCCP-1 forces a binary choice (Same Work vs. Replica). The metaphysical framework actually suggests *two* objects may exist simultaneously (the original Substrate-remnant and the restored Artwork).
  *   **Risk:** In cases like the Bronze Recast, the procedure identifies the object as the "Original Work." Legally, however, insurance carriers may define "Original" by material age.
  *   **Referral:** Any case where **Phase 3** is triggered requires Senior Officer sign-off to align metaphysical classification with legal/insurance definitions.

  **2. The Threshold Arbitrariness**
  *   **Limitation:** The 50% threshold in Q1.1 is administrative, not metaphysical. There is no philosophical reason why 51% original matter preserves identity while 49% does not (Sorites Paradox).
  *   **Risk:** Borderline cases (e.g., 48% retention) may be arbitrarily rejected.
  *   **Referral:** Any case falling between **40% and 60%** retention requires Senior Officer review to assess qualitative importance of the lost material (e.g., is the lost 50% the face of a portrait?).

  **3. Intentional Opacity**
  *   **Limitation:** Q3.2 and Q4.1 rely on assessing "Artist Intent" and "Aesthetic Function." These are interpretive judgments, not empirical facts.
  *   **Risk:** Staff may project contemporary values onto historical objects.
  *   **Referral:** Any case where the **Artistic Function** is debated (e.g., is a broken vase still a vessel, or is it now a ruin?) requires Curatorial Board review.

  **4. The Bronze Intuition Conflict**
  *   **Limitation:** As seen in Case 2, the procedure may validate the identity of an object that *feels* lost to curatorial staff. This is a feature of the "Statue/Clay" distinction, but it carries reputational risk.
  *   **Referral:** All **Phase 3** approvals must be logged in a public-facing transparency register to disclose the extent of replacement, mitigating the risk of perceived deception.

  **Instruction to Staff:** If a proposal triggers a **STOP** condition but you believe the object holds significant historical value as a "modified original," do not override the protocol. Instead, flag it for Senior Review. The protocol protects the institution from metaphysical inconsistency; your authority protects the collection from bureaucratic rigidity.
