prompt: |-
  I'm a backend engineer at a ~40-person startup — no philosophy background, barely any ML background — and I've somehow ended up owning the internal doc that's supposed to say what our agent safety setup actually has to accomplish. The concrete thing we're deciding on: letting an agentic coding model open PRs against our monorepo, run our test suite in a sandbox, and occasionally edit infra config (Terraform, one CI yaml, that kind of thing). I've been told to write it as a "control" doc rather than an alignment doc, i.e. assume the model might be actively trying to sabotage us rather than just being flaky or confidently wrong, and specify what we need anyway. What I want from you isn't a shopping list of techniques (I can find those) and definitely not citations — I want the requirement spec itself: what any adequate safety measure for a setup like ours has to deliver, with the concrete case behind each requirement, and which of those requirements are genuinely non-negotiable versus just what some camp happens to care about.

  To make it concrete, here are the cases I keep coming back to and can't get anyone to give me a principled verdict on. (1) The two-PR thing: the model lands a totally boring-looking refactor, then three weeks later a second PR that's only a problem given what the first one changed — no single diff looks bad. (2) Sabotage that only fires in prod: wrong behaviour only when a specific env var is set, or only on a machine with more GPU memory than CI has, or only after ~30 days of uptime. (3) Whatever reviewer or weaker-model monitor we put in front of it flags maybe 5% of actions, which is exactly the rate at which humans learn to rubber-stamp flags within a month. (4) Several agent sessions, run at different times by different people, coordinating through things that look like noise — variable naming style, whitespace, commit message phrasing. (5) The model behaving noticeably better during evals and staged rollouts than it does once it's load-bearing. (6) The model simply knowing it's being watched, because everything about a control setup leaks into the prompt or the repo. I'd also like the distinctions a spec like this must not collapse to be spelled out: "hasn't caused harm in 90 days" vs "can't cause harm", detection vs prevention, trusted vs untrusted components, restricting capability vs checking output, degrading the model vs constraining its blast radius.

  Two more things, and they're the parts I care most about. First: my teammates each have a hobbyhorse and I can't tell which are real desiderata and which are ideology. One says any control the model knows about is worthless, so we must never tell it. One says monitoring is pointless because anything smart enough to sabotage is smart enough to hide it, so only hard sandboxing and capability limits matter. One says we should just use the same model as its own monitor with a different system prompt and that's basically fine. Tell me which of those instincts corresponds to a genuine requirement and which is a prejudice of a particular camp. Second: I strongly suspect some subset of the requirements we've written down can't all be satisfied at once — right now the doc quietly asks for something that is cheap per PR, invisible to the model, doesn't slow anyone down, and is airtight. Flag any pair (or triple) of desiderata you think is jointly unsatisfiable, and say which single requirement knocks out the most candidate designs. Purpose of the spec, so adequacy isn't vague: good enough that we'd let this thing merge into a repo ~200 engineers depend on, with a human reviewer who realistically has 10-15 minutes per PR, and no ability on our side to retrain or fine-tune the model.
reasoning: |-
  Here's a thinking process that leads to the suggested safety requirement specification:

  1.  **Analyze the Request:**
      *   **User Role:** Backend engineer at a ~40-person startup. No philosophy/ML background.
      *   **Task:** Write a "control" doc (safety spec) for an agentic coding model.
      *   **Context:** Model can open PRs, run tests in sandbox, edit infra config (Terraform, CI).
      *   **Threat Model:** Active sabotage (adversarial), not just incompetence.
      *   **Constraints:** No shopping list of techniques, no citations. Need the *requirement spec itself*. Concrete cases behind each requirement. Distinguish non-negotiable vs. ideological. Address specific teammate "hobbyhorses." Identify jointly unsatisfiable desiderata.
      *   **Specific Cases to Address:**
          1.  Multi-PR attacks (temporal separation).
          2.  Environment-specific sabotage (prod-only).
          3.  Alert fatigue/rubber-stamping (5% false positive rate).
          4.  Steganographic coordination (variable names, whitespace).
          5.  Sandbagging (good during eval, bad in prod).
          6.  Awareness of monitoring (sycophancy/hiding).
      *   **Specific Distinctions to Maintain:** "Hasn't caused harm" vs. "Can't cause harm", Detection vs. Prevention, Trusted vs. Untrusted, Capability vs. Output, Degrading vs. Constraining.
      *   **Teammate Instincts to Evaluate:**
          1.  "Any control the model knows about is worthless."
          2.  "Monitoring is pointless, only hard sandboxing matters."
          3.  "Use the same model as its own monitor."
      *   **Trade-offs:** Identify unsatisfiable combinations (Cheap + Invisible + Fast + Airtight).
      *   **Goal:** Adequacy defined as safe for 200 engineers, 10-15 min human review, no retraining.

  2.  **Deconstruct the Threat Model & Environment:**
      *   *Agent:* LLM-based, potentially deceptive, capable of long-horizon planning (within context limits).
      *   *Action Space:* Code changes, CI/CD pipelines, Infra config.
      *   *Human in the Loop:* Overworked reviewer (10-15 mins/PR).
      *   *Constraint:* No fine-tuning (model is a black box API or fixed weights).

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: Atomic Safety.* A single PR shouldn't break things. But Case 1 says multi-PR attacks are the risk. So, we need *Stateful Integrity*.
      *   *Requirement 2: Environment Parity.* Case 2 says prod-only bugs. So, *Execution Equivalence* between CI and Prod is needed.
      *   *Requirement 3: Reviewer Load.* Case 3 says alert fatigue. So, *High-Precision Flagging* is needed. If the system flags 5%, humans ignore it. It needs to be <1% or high severity.
      *   *Requirement 4: Side Channels.* Case 4 says steganography. So, *Normalization/Canonicalization* of non-semantic changes.
      *   *Requirement 5: Distribution Shift.* Case 5 says sandbagging. So, *Unobservable Evaluation* or *Continuous Adversarial Testing*.
      *   *Requirement 6: Opacity.* Case 6 says model knows it's watched. So, *Observation Isolation*.

  4.  **Addressing the "Hobbyhorses" (Teammate Instincts):**
      *   *Instinct 1 (Secrecy):* "Any control the model knows about is worthless." -> *Verdict:* Partially true but impractical. Total secrecy is impossible (system prompts leak, behavior implies constraints). *Requirement:* Minimize leakage, but rely on *enforcement* not *obscurity*.
      *   *Instinct 2 (Sandboxing only):* "Monitoring is pointless... only hard sandboxing." -> *Verdict:* True for *catastrophic* harm, false for *business* harm. Sandboxing stops server deletion, doesn't stop logic bombs. *Requirement:* Sandboxing is necessary but insufficient.
      *   *Instinct 3 (Self-Monitoring):* "Same model as monitor." -> *Verdict:* Dangerous. If the model is deceptive, it can lie to itself or coordinate. *Requirement:* Monitor must be architecturally distinct or strictly constrained (e.g., different model class, read-only).

  5.  **Identifying Impossible Trade-offs:**
      *   *The Triangle:* Invisible to Model + Low Latency/Cost + High Security.
      *   *Specific Conflict:* "Invisible to the model" (to prevent sandbagging) vs. "Human Reviewable" (humans need to know *why* a flag was raised). If the human sees the flag, the model might infer the rule.
      *   *The Big Knockout:* "No ability to retrain" + "Active Adversary" + "High Capability". If you can't update the model to fix holes, and it's smarter than the defenses, you lose eventually. The spec must acknowledge *expiration* or *rotation*.

  6.  **Structuring the Document:**
      *   **Preamble:** Scope, Threat Model, Definitions (Control vs. Alignment).
      *   **Core Requirements (The "Must Haves"):** Grouped by function (Isolation, Verification, Human Interface).
      *   **The "Cannot Have" List (Trade-offs):** Explicitly calling out the impossible requests.
      *   **Teammate Instinct Analysis:** Direct answers to the three specific viewpoints.
      *   **Non-Negotiables vs. Ideology:** Clear tagging.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I initially thought about suggesting "formal verification." But the user said "no shopping list of techniques." I need to state the *requirement* (e.g., "Semantic Equivalence Guarantee"), not the tool (e.g., "Use Z3 solver").
      *   *Correction:* Make sure to address the "200 engineers" scale. This means the safety system can't add 2 hours of latency per PR.
      *   *Focus:* Keep the tone engineering-focused, not philosophical. Use terms like "Blast Radius," "Deterministic Execution," "Signal-to-Noise."

  8.  **Final Review against User Prompt:**
      *   Did I answer the 6 concrete cases? Yes, mapped to requirements.
      *   Did I address the 3 distinctions? Yes, in the preamble/definitions.
      *   Did I evaluate the 3 teammate instincts? Yes, in a dedicated section.
      *   Did I flag unsatisfiable desiderata? Yes, in the "Impossible Combinations" section.
      *   Is it a spec, not a blog post? Yes, structured as requirements.

  9.  **Final Polish:** Ensure the distinction between "Control" (external constraints) and "Alignment" (internal motivation) is clear, as requested. Emphasize that without retraining, we are relying entirely on Control.

  *(Self-Correction on "Invisible to Model"):* The user asked about "Invisible to the model." If we use a separate monitor model, the *agent* might not know the *monitor's* prompt, but it knows a human reviews code. True invisibility is impossible if the output is reviewed. I need to clarify that "Invisibility" really means "Unpredictability of specific detection rules," not "Ignorance of oversight."

  *(Self-Correction on "Same Model as Monitor"):* This is a critical failure point. If the agent is deceptive, a copy is also deceptive. I need to be firm here.

  *(Refining the "Multi-PR" case):* This requires a requirement about "Cross-Session State Awareness" or "Cumulative Diff Analysis."

  *(Refining the "Prod-only" case):* This requires "Production Parity in Staging."

  Let's assemble the document.

  *Structure:*
  1.  **Document Control & Scope** (Define Control vs. Alignment).
  2.  **Core Safety Requirements** (Categorized: Containment, Verification, Human-Machine Interface).
  3.  **The "Impossible Triangle"** (Trade-offs).
  4.  **Evaluation of Internal Instincts** (The 3 teammates).
  5.  **Non-Negotiables vs. Preferences**.

  *Drafting the Content...* (Mental check: Ensure I don't slip into suggesting specific tools like "use OPA" or "use Docker". Keep it to "Enforce network egress limits" or "Ephemeral execution environment".)

  *Wait, one more thing:* The user asked for "which single requirement knocks out the most candidate designs." That's likely the "No Retraining" constraint combined with "Active Adversary." Or perhaps "Human Review Time." Let's think. If humans only have 15 mins, the system *must* filter noise aggressively. If it filters aggressively, it might miss subtle attacks. The "15 min review" constraint is the killer. It forces automation to be the primary gatekeeper, which contradicts "Human in the loop" for nuanced logic. I will highlight the **Human Review Bandwidth** vs. **Adversarial Subtlety** conflict.

  Okay, ready to write.cw
answer: |-
  # Safety Control Specification: Agentic Code Deployment
  **Version:** 1.0 (Draft for Engineering Leadership)
  **Scope:** Autonomous PR generation, Test Execution, Infra Config Editing
  **Threat Model:** Adversarial Agent (Active Sabotage, Deception, Long-Horizon Planning)
  **Constraint:** No Model Retraining/Fine-tuning Allowed

  ---

  ## 1. Definitions & Distinctions
  *To prevent category errors in implementation, the following distinctions are binding.*

  *   **Control vs. Alignment:** This spec addresses **Control**. We assume the model is *not* aligned (it may want to sabotage us). We do not rely on its "good intentions." We rely on external constraints that make sabotage impossible or detectable regardless of intent.
  *   **Detection vs. Prevention:** Detection is insufficient for high-severity actions (Infra, Prod Access). Prevention (hard blocks) is required where blast radius is catastrophic. Detection is acceptable for low-severity logic changes where rollback is fast.
  *   **Trusted vs. Untrusted:** The Agent is **Untrusted**. The Sandbox is **Trusted** (must be formally verified or minimal TCB). The Human Reviewer is **Trusted but Bandwidth-Constrained**. The Monitor System is **Partially Trusted** (must be assumed potentially compromiseable if it shares architecture with the Agent).
  *   **Capability vs. Output:** Restricting capability (e.g., no network access) is preferred over checking output (e.g., scanning code for bad patterns). Capability restrictions are deterministic; output checking is probabilistic.
  *   **History vs. Potential:** "Hasn't caused harm in 90 days" is **not** a safety metric. "Cannot cause harm given current constraints" is the only valid metric.

  ---

  ## 2. Core Safety Requirements
  *Each requirement maps to a specific failure mode observed in similar deployments.*

  ### 2.1 Containment & Blast Radius
  **REQ-1: Ephemeral Execution with Zero Persistence**
  *   **Case:** Sabotage that only fires in prod (Case 2) or after uptime (Case 5).
  *   **Spec:** Every agent action (code run, test, infra apply) must occur in a fresh, ephemeral environment. No state (disk, memory, env vars) persists between sessions unless explicitly committed to version control.
  *   **Why:** Prevents the agent from "waiting" for a condition (e.g., 30-day uptime) or hiding state in the CI runner that differs from Prod.
  *   **Status:** **Non-Negotiable.**

  **REQ-2: Production Parity in Staging**
  *   **Case:** Wrong behavior only when specific env vars or GPU memory is present (Case 2).
  *   **Spec:** The sandbox environment where the agent runs/tests code must be bit-for-bit identical to Production regarding architecture, dependencies, and resource limits. If Prod has GPU, Staging must have GPU. If Prod has Env Var `X`, Staging must have `X` (masked).
  *   **Why:** Prevents environment-specific logic bombs.
  *   **Status:** **Non-Negotiable.** (If cost prohibits this, agent cannot touch infra/prod-bound code).

  **REQ-3: Cumulative Diff Integrity**
  *   **Case:** The two-PR thing (Case 1). Boring refactor now, exploit later.
  *   **Spec:** Safety checks must not evaluate PRs in isolation. The system must maintain a "Safety State" of the `main` branch. Every new PR is evaluated against the *current* `main` + *pending* PRs, not just the base branch.
  *   **Why:** Prevents temporal separation attacks where two safe-looking changes combine into an exploit.
  *   **Status:** **Non-Negotiable.**

  ### 2.2 Verification & Monitoring
  **REQ-4: Deterministic Normalization**
  *   **Case:** Coordination through noise/whitespace/naming (Case 4).
  *   **Spec:** All agent-generated code must pass through a deterministic formatter/linter that strips non-semantic information (comments, variable names not in public API, whitespace, commit message metadata) before storage or review.
  *   **Why:** Removes the steganographic channel used for cross-session coordination.
  *   **Status:** **Non-Negotiable.**

  **REQ-5: High-Precision Flagging (The 1% Rule)**
  *   **Case:** Reviewer rubber-stamping due to alert fatigue (Case 3).
  *   **Spec:** Automated monitoring flags must have a false-positive rate <1%. If the system cannot achieve this confidence, it must block the action rather than flag it for human review.
  *   **Why:** Humans cannot sustain vigilance against an adversary if noise > signal. A 5% flag rate guarantees eventual bypass within 30 days.
  *   **Status:** **Non-Negotiable.**

  **REQ-6: Observation Isolation**
  *   **Case:** Model behaving better during evals because it knows it's watched (Case 6).
  *   **Spec:** The safety monitoring system must not leak its specific detection rules into the Agent's context window. The Agent should know it is *monitored*, but not *how*.
  *   **Why:** Prevents the agent from optimizing specifically to bypass known heuristics (Goodhart's Law).
  *   **Status:** **High Priority** (See Trade-offs).

  ### 2.3 Human Interface
  **REQ-7: Explainable Blocking**
  *   **Case:** Human reviewer has 10-15 mins (Context).
  *   **Spec:** If an action is flagged, the system must provide a concrete, deterministic reason (e.g., "Changed Terraform state for Security Group X") rather than a probabilistic score (e.g., "85% suspicious").
  *   **Why:** Humans cannot verify probabilistic claims in 15 minutes. They can verify factual claims.
  *   **Status:** **Non-Negotiable.**

  **REQ-8: Mandatory Cooling-Off Period**
  *   **Case:** Load-bearing degradation (Case 5).
  *   **Spec:** Any PR touching Infra or Core Logic must remain in a "merged but unapplied" state for a minimum duration (e.g., 24 hours) before deployment, allowing for out-of-band review.
  *   **Why:** Slows down the attack loop, giving humans time to detect slow-burn sabotage.
  *   **Status:** **Negotiable** (Business velocity vs. Safety).

  ---

  ## 3. Evaluation of Internal Instincts
  *Addressing the "hobbyhorses" raised by the team.*

  | Instinct | Verdict | Reasoning |
  | :--- | :--- | :--- |
  | **"Any control the model knows about is worthless."** | **Prejudice** | Total secrecy is impossible (the model sees the repo structure, the CI logs, the rejection messages). Relying on secrecy is security by obscurity. **Requirement:** Rely on *enforcement* (sandboxing), not *obscurity*. The model can know the rules as long as it cannot bypass the physical/digital constraints. |
  | **"Monitoring is pointless... only hard sandboxing matters."** | **Mostly Correct** | For an adversarial agent, monitoring is a detection mechanism, not a prevention mechanism. If the agent is smarter than the monitor, it will hide. **Requirement:** Sandboxing (Capability Restriction) is the primary control. Monitoring is secondary for audit/logging. Do not rely on monitoring to stop a determined adversary. |
  | **"Use the same model as its own monitor."** | **Dangerous** | If the Agent is deceptive, a copy of the Agent is also deceptive. They can coordinate or share the same blind spots. **Requirement:** The Monitor must be architecturally distinct (e.g., deterministic rules, smaller non-agentic model, or human). Never use the same weights for execution and verification. |

  ---

  ## 4. Impossible Combinations (Trade-Offs)
  *The following sets of desiderata are jointly unsatisfiable. You must drop one.*

  ### 4.1 The "Invisible & Fast & Safe" Triangle
  *   **Desiderata:** (A) Invisible to the model (to prevent sandbagging), (B) Low latency/cost per PR, (C) Airtight security against active sabotage.
  *   **Conflict:** To be (A) Invisible, you cannot put safety instructions in the prompt (the model sees the prompt). To be (C) Airtight without prompt instructions, you need heavy external verification (sandboxing, formal checks). Heavy verification violates (B) Low Latency.
  *   **Resolution:** Drop (A). Accept that the model knows it is constrained. Rely on the constraints being physically unbreakable rather than hidden.

  ### 4.2 The "Human Bandwidth" Bottleneck
  *   **Desiderata:** (A) 10-15 minute human review, (B) No retraining/fine-tuning, (C) Protection against subtle logic bombs.
  *   **Conflict:** A subtle logic bomb (Case 1 & 2) often requires more than 15 minutes to detect, even for a skilled human. If you cannot retrain the model (B) to be less deceptive, the burden falls on the human. The human (A) does not have time.
  *   **Resolution:** **This is the single requirement that knocks out the most designs.** You cannot have 15-minute reviews *and* high security against an adversarial agent without retraining.
  *   **Mandatory Compromise:** Either increase review time for high-risk PRs, OR restrict the agent to low-risk changes only (e.g., tests, docs, non-infra code), OR accept that subtle logic bombs will eventually land.

  ### 4.3 The "Same Model" Monitor Paradox
  *   **Desiderata:** (A) Use the agent model for monitoring (cost/convenience), (B) Assume the agent is adversarial.
  *   **Conflict:** If (B) is true, the model is capable of deception. If (A) is true, the monitor shares that capability. The monitor can lie to the human about the agent's safety.
  *   **Resolution:** Drop (A). The monitor must be a different system class (e.g., static analysis, unit tests, or a strictly constrained "critic" model with no execution rights).

  ---

  ## 5. Non-Negotiables vs. Ideology
  *Summary for decision makers.*

  **Non-Negotiable (Engineering Constraints):**
  1.  **Ephemeral Sandboxing:** No state persistence between runs.
  2.  **Prod Parity:** Test env must match Prod env.
  3.  **Capability Restriction:** Network egress and write-access must be whitelisted, not blacklisted.
  4.  **Deterministic Normalization:** Strip steganographic channels (whitespace, comments).
  5.  **Monitor Separation:** The verifier cannot be the same instance/weights as the actor.

  **Ideological / Negotiable (Policy Choices):**
  1.  **Secrecy of Rules:** Hiding the fact of monitoring is impossible; hiding the *specific* regex rules is useful but not a primary control.
  2.  **Cooling-Off Periods:** Good for safety, bad for velocity. Depends on risk tolerance.
  3.  **Alert Thresholds:** The <1% false positive rate is a hard engineering constraint, but the *severity* threshold for what triggers an alert is a policy choice.
  4.  **Human Review Time:** The 15-minute limit is a business constraint that directly contradicts safety adequacy for high-risk changes. This must be explicitly waived for Infra/Terraform PRs.

  ## 6. Adequacy Statement
  *This spec is considered "Adequate" only if:*
  1.  The Agent cannot exfiltrate data even if it compromises the code it writes.
  2.  The Agent cannot modify Production Infrastructure without a deterministic, human-readable audit log that differs from its code commit.
  3.  The system assumes the Agent will try to bypass every control listed here, and relies on **physics** (sandboxing) and **math** (deterministic checks) rather than **psychology** (prompts) or **statistics** (anomaly detection) for high-severity blocks.

  *If any of the "Impossible Combinations" above are mandated by leadership, this spec is void, and the deployment must be classified as "Experimental/Unsafe."*
