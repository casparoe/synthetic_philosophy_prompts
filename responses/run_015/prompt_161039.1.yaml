  This maneuver is formally identified in animal ethics as the **"Species-Norm Account"** (defended by Carl Cohen) or **"Kind-Based Moral Status."** While proponents disavow speciesism, critical ethicists classify it as **"Indirect Speciesism."** Although the criterion (e.g., agency) is facially neutral, the reliance on "kind membership" to rescue marginal humans makes species membership the actual necessary condition for full status.

  To settle the boundary cases and define where the phenomenon stops:

  1.  **Non-human with the property:** If denied status, the view is speciesist. The property is merely a pretext; species is the barrier. The phenomenon exists because the neutral marker is not actually sufficient for non-humans.
  2.  **Human without the property:** If granted status via "kind," the view is speciesist. If denied status, the view is consistent (though arguably ableist); it is not speciesist regarding that property. The phenomenon exists because humans are granted a "kind-save" denied to animals.
  3.  **Independent property:** If the property is applied individually to all beings without a "kind" exception for humans, it is not speciesist. The phenomenon stops precisely where the **"kind-save"** is removed.

  The inconsistency—testing animals individually while grouping humans by species—is the definition of the bias. You can label this **"Kind-Based Exclusion."** It is speciesism because the "kind" is defined biologically by species. The disavowal is semantic; the operational logic privileges human biology.

  In discussion, call it **"The Species-Norm Defense."** It fails because it adjusts the criterion (individual vs. kind) to match the desired outcome. If the criterion were truly neutral, marginal humans would lack status, or sentient animals would possess it. The switching mechanism itself is the speciesist act. This configuration is distinct from simple speciesism only in its sophistication, not its moral structure. It is speciesism because the "kind" appeal functions solely to protect humans from the implications of the very neutral criterion the agent claims to endorse.
