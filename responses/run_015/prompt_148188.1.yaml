answer: |-
  This institutional arrangement presupposes a sophisticated, somewhat paradoxical political philosophy that diverges sharply from both absolutism and pure republicanism. It relies on a specific ontology of the State, a distinct theory of agency, and a particular resolution to the problem of political time.

  Here is a map of the implicit philosophical commitments and the points of underdetermination.

  ### 1. The Ontology of the "Corporate Sole" (Splitting the Will)
  You asked if this requires thinking authority can be split between a symbolic holder and a decision-maker. It goes deeper: it presupposes that **sovereignty is a legal fiction, not a human capacity.**

  In this model, the Monarch is not a person acting as an agent; they are a *corporation sole*. This is a legal concept where an office is treated as a continuous legal entity distinct from the flesh-and-blood occupant.
  *   **The Commitment:** The State requires a "head" to exist metaphysically, but that head must be incapable of having a "mind."
  *   **The Implication:** Sovereignty is not located in the *will* of the ruler (as in Hobbes or absolutism) but in the *office* itself. By binding the monarch's will to zero (via convention), the system ensures that the "Head of State" cannot conflict with the "Head of Government."
  *   **Philosophical Consequence:** This rejects the idea that authority requires agency. It posits that **legitimacy can be purely procedural.** The monarch's signature is not an act of consent; it is an act of *authentication*. It certifies that the proper procedures were followed, not that the content is wise.

  ### 2. The Modern "King's Two Bodies" (Temporality)
  Ernst Kantorowicz's medieval theory of the *King's Two Bodies* (Body Natural vs. Body Politic) has been secularized here.
  *   **The Commitment:** The State exists in two different temporalities simultaneously.
      1.  **Political Time:** Cyclical, short-term, contentious (Elections, Parliaments, Prime Ministers).
      2.  **State Time:** Linear, perpetual, continuous (The Crown/Throne).
  *   **The Implication:** The Monarch is the anchor for "State Time." If the Head of State were elected, the Head of State would change with "Political Time," merging the temporary majority with the permanent state.
  *   **Philosophical Consequence:** This presupposes that **democracy requires a non-democratic constant.** To prevent the "tyranny of the present," the system installs a figure who represents the past and future (continuity) to validate the decisions of the present (government). The monarch embodies the *identity* of the state, while the government embodies the *will* of the state.

  ### 3. Agency and the "Seal" Theory (vs. Power of Attorney)
  You asked about the inconsistency with proxy-authority (like power of attorney). This is a crucial distinction.
  *   **Power of Attorney:** The agent acts *on behalf of* the principal's will. If the principal changes their mind, the agent must stop. The authority flows from the principal's capacity to choose.
  *   **Constitutional Monarchy:** The Monarch acts as a **living seal.**
  *   **The Commitment:** The Monarch is alienated from their own legal agency. They are not an agent of the people, nor an agent of the government. They are a *mechanism*.
  *   **Philosophical Consequence:** This creates a category of **non-volitional authority.** In most legal philosophy, signing a document implies "I have read this and I endorse this." In this system, the signature implies "I am the vessel through which the law becomes real." It decouples *responsibility* from *authority*. The Monarch has the authority (the signature makes it law) but zero responsibility (they cannot be criticized for it). This violates the liberal principle that power and accountability must be coupled.

  ### 4. The Representation of the "Whole" vs. The "Part"
  How is this coherent with democratic equality? The justification relies on a specific theory of representation.
  *   **The Commitment:** Elected officials represent *parts* (constituencies, parties, ideologies). The Monarch represents the *whole* (the undifferentiated populace).
  *   **The Implication:** Because the Monarch is hereditary and unelected, they are theoretically incapable of being partisan. They owe their position to no faction. Therefore, they can symbolize the unity of the nation in a way a President (who always won against someone) cannot.
  *   **Philosophical Consequence:** This presupposes that **neutrality is impossible to elect.** You cannot vote for a "neutral" arbiter, because the act of voting creates a winner and a loser. Therefore, the arbiter of the constitution (symbolically) must be outside the electoral marketplace. It treats heredity not as a privilege of blood, but as a **technology of neutrality.**

  ### 5. Where it is Philosophically Underdetermined (The Point of Failure)
  The system is stable only as long as the philosophical fictions are not tested. There are three major points of underdetermination:

  **A. The Schmittian Exception**
  Carl Schmitt argued that sovereignty is defined by the power to decide on the *exception*. In the UK, the Monarch technically retains "reserve powers" (e.g., refusing dissolution of parliament).
  *   **The Tension:** If the Monarch *never* uses them, they don't exist. If they *do* use them, the convention breaks and the system becomes quasi-absolutist.
  *   **Underdetermination:** The system does not define *who* decides when the convention can be broken. It relies on the Monarch's personal restraint. This means the ultimate safeguard of the democracy is the **virtue of an unelected individual**, which is philosophically incompatible with institutional republicanism.

  **B. The Source of Legitimacy**
  *   **Republican View:** Legitimacy flows upward (People → State).
  *   **Monarchical View:** Legitimacy flows downward (Crown → People/Parliament).
  *   **The Hybrid:** In these systems, legitimacy flows *both ways* simultaneously, which is logically contradictory. The Prime Minister derives power from the Parliament (People), but is *appointed* by the Crown.
  *   **Underdetermination:** If the People and the Crown ever fundamentally disagree (e.g., a referendum vs. royal prerogative), there is no philosophical rule for who wins, only a political one. The "Sovereignty of Parliament" (UK) clashes with the "Sovereignty of the Crown" (Legal Theory). The system masks this contradiction with convention.

  **C. The "Dignified" vs. "Efficient" Paradox**
  Walter Bagehot noted the split between the "dignified" parts (Monarch) and "efficient" parts (Government) of the constitution.
  *   **The Tension:** The system requires the public to believe the Monarch is powerful enough to command respect, but powerless enough to not govern.
  *   **Underdetermination:** This requires a specific **epistemic stance from the citizenry.** Citizens must engage in a form of "double consciousness"—knowing the Monarch has no power, but acting *as if* they do to maintain the sanctity of the office. If the public stops believing in the "magic" (the authority without power), the institution collapses into a waste of money. If they believe too much in the power, it becomes a threat to democracy.

  ### Summary of Implicit Theory
  This institutional design commits you to the view that:
  1.  **The State is a transcendental entity** distinct from its current population or government.
  2.  **Authority is distinct from Will;** one can hold the highest office without exercising choice.
  3.  **Neutrality requires exclusion from the democratic process;** to represent everyone, one must be chosen by no one.
  4.  **Continuity is a higher good than consistency;** the visual permanence of the state justifies hereditary privilege.

  It is a system built on **productive contradictions.** It works not because the philosophy is consistent, but because the inconsistencies are managed by silence (convention). It treats sovereignty not as a location of power, but as a **ritual performance** that legitimizes the actual exercise of power elsewhere.
