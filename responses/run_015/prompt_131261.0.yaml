      *   *The Conflict:* If wild rodents count for *less* (1), then killing them (Scenario A) is *less bad* than killing a cow (Scenario B), assuming the cow has significant negative welfare. The user's justification in (3) implies preserving the wild animals is a *gain*. But (1) says they are low-value subjects.
      *   *Correction:* The user might mean the *density* of wild animals is higher in grassland, so *more* wild animals live. But if their lives are net negative (wild suffering), more is worse. If net positive, more is better. (1) implies they have "suffering-capacity," suggesting net negative or neutral.
      *   *Conclusion:* (3) relies on the *existence* of wild animals being good (Integrity), not their *suffering* being low. This clashes with (1)'s focus on suffering capacity.

  8.  **Final Polish:** Ensure the distinction between "Rule-Consequentialism" and "Pluralism" is clear. Ensure the ranking is distinct. (Self-Correction: Make sure to explicitly answer "does (5) look like a hidden deontological constraint?" -> Yes.)

