      *   (3) **Rule-Consequentialism + Grass-Fed Exception:** Diet rules minimize aggregate suffering. *Exception:* Grass-fed beef on non-arable land. Logic: Counterfactual is crop conversion, not wild state. Beef preserves wild herbivore densities replacing killed pests.
      *   (4) **Wild Suffering Interventions:** Rejects predator vaccination/prey immunization. Reason: Ecological integrity has *non-instrumental value* overriding suffering reduction at ecosystem level.
      *   (5) **Necessary Suffering:** Covers human survival + cultural food practices (non-instrumental value). Excludes factory farming.
      *   (6) **Practice:** No chicken, rare heritage grass-fed beef, mostly plants. Claims alignment with (1)-(5).

  3.  **Evaluate Internal Consistency (The Audit):**

      *   **Tension A: (3) vs. (1) & (2) [The Grass-Fed Exception]**
          *   *Claim:* (3) says "minimize aggregate suffering."
          *   *Conflict:* (3) allows beef if it preserves wild herbivores instead of crops. But (1) says wild rodents/insects (crop deaths) count less than livestock due to duration/intensity.
          *   *Problem:* If wild animals count *less* (per 1 & 2), why is preserving them via beef production a valid exception to minimizing suffering? Usually, the "least harm" argument for plants relies on wild animals dying in harvest. If the user says wild animals matter *less* than chickens, then killing wild animals (via crops) is *better* than raising chickens. But (3) argues beef is okay because it *saves* wild animals from crop death? Wait, let's re-read (3).
          *   *Re-reading (3):* "this beef preserves wild herbivore densities that replace killed pests." This implies the beef system allows wild animals to live, whereas the crop system kills them.
          *   *Conflict:* If wild animals have low welfare-weight (per 1 & 2), why is their preservation a strong enough reason to override the "minimize aggregate suffering" rule? Unless the beef cow's suffering is *also* low? But (1) implies broiler suffering is high intensity. Grass-fed cows live longer but are killed.
          *   *Core Tension:* (3) relies on a counterfactual comparison (Crops kill wild things vs. Grass-fed allows wild things). But (1) says wild things count *less*. So, minimizing aggregate suffering should prioritize reducing high-weight suffering (livestock) over low-weight suffering (wild pests). (3) seems to prioritize the *existence* of wild animals over the *suffering* of livestock, which clashes with the aggregative consequentialism of (3) and the weighting of (1).
          *   *Severity:* High. It strikes at the core metric (aggregate suffering).

      *   **Tension B: (4) vs. (1), (2), & (3) [Wild Suffering vs. Integrity]**
          *   *Claim:* (1)-(3) are aggregative/consequentialist (minimize suffering).
          *   *Conflict:* (4) introduces "ecological integrity" as a *non-instrumental value* that overrides suffering reduction.
          *   *Problem:* This is a value pluralism move. If ecological integrity is non-instrumental, it's not purely consequentialist about suffering. It's a side-constraint or a multi-value consequentialism.
          *   *Is it a contradiction?* Not strictly, if the theory is "Maximize Suffering Reduction *subject to* Integrity Constraints." But (3) says "adopt rules that minimize aggregate suffering." It doesn't mention constraints.
          *   *Severity:* Medium-High. It shifts the meta-ethical framework from single-value consequentialism to pluralism.

      *   **Tension C: (5) vs. (3) [Cultural Practices vs. Aggregation]**
          *   *Claim:* (3) is rule-consequentialist (minimize suffering).
          *   *Conflict:* (5) allows suffering for "cultural food practices with non-instrumental value."
          *   *Problem:* If the goal is minimizing suffering, cultural value only matters instrumentally (e.g., preventing social unrest). Calling it "non-instrumental" means it's a deontological or virtue-ethical constraint.
          *   *Severity:* Medium. Similar to (4), it introduces non-suffering values.

      *   **Tension D: (1) vs. (6) [The Dissolving Tension]**
          *   *Claim:* (1) weights wild rodents less than broilers. (6) avoids chicken, eats beef.
