          *   Flag the (1)/(6) dissolution.

  7.  **Refining the Logic on (3) (The trickiest part):**
      *   User says: "counterfactual isn't wild ecosystem but crop conversion."
      *   User says: "this beef preserves wild herbivore densities that replace killed pests."
      *   User says (1): Wild rodent counts for *less* than broiler.
      *   *The Math:*
          *   Scenario A (Vegan): Crops grown. Many wild rodents/insects killed. (Low weight per death). No cows killed.
