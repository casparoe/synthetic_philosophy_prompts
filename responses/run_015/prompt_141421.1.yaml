answer: |-
  **Total Mark: 17/20**

  This is a strong answer that demonstrates a good grasp of the literature and the ability to apply abstract principles to concrete cases. You write clearly and structure your arguments well. However, there are a few theoretical conflations that sound plausible on the surface but would not hold up under closer scrutiny (specifically regarding the normative foundations of the principles). Below is the breakdown.

  ---

  ### Part (a)
  **Mark: 5/5**

  **What you got right:**
  *   **Definitions:** Your distinction is precise. Defining boundary as "who the 'we' is" and scope as "which decisions... entitled to take" captures the standard distinction perfectly.
  *   **Circularity:** You correctly identify the "constitutive regress" (you need a demos to decide the demos). You also correctly note why scope avoids this (an existing demos can set its own jurisdictional limits without logical contradiction).

  **What's missing/wrong:**
  *   Nothing significant. This is a model answer for this section.

  **TA Comment:**
  *   No flags here. You have secured the full marks for this section.

  ---

  ### Part (b)
  **Mark: 6/8**

  **What you got right:**
  *   **AAP Application:** You correctly identify the "chain of effects" problem and how it leads to indeterminacy/over-inclusion in the Ruritania case.
  *   **Determinacy Argument:** You correctly note that legal subjection (ASP) is often viewed as more binary/determinate than causal affectedness (AAP).
  *   **Border Coercion:** Your application of ASP to the border case is sophisticated. Arguing that border enforcement *is* coercion on those outside is a valid argument in the literature (e.g., Abizadeh).

  **What's wrong or missing (Flags):**
  *   **⚠️ Theoretical Conflation (AAP vs. ASP):** You write: *"The all-subjected principle is best understood as a narrower version of the same thought: coercion is just one way of being affected."*
      *   **Why this is a problem:** This sounds plausible, but it conflates the *justifications* for the principles. AAP is typically consequentialist (protect interests); ASP is typically deontological (legitimacy of coercion/autonomy). Reducing ASP to a subset of AAP misses the point that we care about subjection because of *rightful authority*, not just because coercion is a type of "effect." If a grader challenged you, you couldn't defend the claim that ASP is just "narrow AAP."
  *   **⚠️ Determinacy vs. Outcome:** You argue ASP is more determinate, but then conclude it "inherits the all-affected principle's over-inclusiveness" in this case. If both principles yield the same radical result (global demos/open borders), you need to be clearer that ASP is more determinate *in principle* (the test is binary), even if the *outcome* here is expansive. You hint at this, but the conclusion muddies the water.

  **TA Comment:**
  *   You lose points primarily for the claim that ASP is a "narrower version" of AAP. They are rival justifications for democracy, not subsets of one another.
  *   Your analysis of the border case is excellent, but ensure you distinguish between the *clarity of the test* (determinacy) and the *size of the resulting group* (inclusiveness).

  ---

  ### Part (c)
  **Mark: 6/7**

  **What you got right:**
  *   **Escaping AAP Objection:** You correctly identify that NEC limits the "global demos" problem by filtering out those who can easily exit.
  *   **Divergence Cases:** Your examples are textbook perfect.
      *   *Tourist:* Subjected (ASP) but can exit (NEC Out).
      *   *Abandoned Region/Poverty:* Cannot exit (NEC In) but not effectively subjected (ASP Out).
      *   These demonstrate a clear understanding of the extensional differences between the principles.

  **What's wrong or missing (Flags):**
  *   **⚠️ Conceptual Reversal (Final Sentence):** You conclude: *"Once we know who is in the demos we also know which territory the state may rightfully control, since the demos just is the people who live on the territory in question."*
      *   **Why this is a problem:** This contradicts your excellent answer in Part (a). In (a), you correctly distinguished Boundary (who) from Scope (territory/issues). Here, you suggest solving the Boundary problem *solves* the Scope problem ("we know which territory..."). Democratic theory generally holds that fixing the *who* does not automatically fix the *where* or *what*. This sounds like a confident concluding thought, but it collapses the distinction you successfully drew earlier.

  **TA Comment:**
  *   The core analysis (divergence cases) is worth full marks for this section.
  *   I deducted a point because the final sentence undermines the conceptual framework you established in Part (a). Be careful not to resolve the "boundary problem" by simply asserting it defines the territory; that is precisely what is up for debate.

  ---

  ### Summary for the Student
  *   **Strengths:** Clear writing, excellent application of principles to the Ruritania case, and strong counter-examples in Part (c).
  *   **Areas for Improvement:**
      1.  **Normative Foundations:** Be careful not to treat distinct principles (AAP vs. ASP) as merely empirical variations of the same idea. They rest on different moral justifications (interests vs. coercion/legitimacy).
      2.  **Conceptual Consistency:** Ensure your conclusion in (c) doesn't accidentally contradict the distinctions you made in (a). The boundary problem does not automatically solve the scope problem.
