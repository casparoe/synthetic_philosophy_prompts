          *   Mara: Pro-"Bootstrapped Authorship" (A novel position). Responsibility is a property of the *whole diachronic process* of self-revision, not a first cause. Even if the chain bottoms out in unchosen facts, the *structure* of the revision matters.
      *   **Concrete Case:** An artificial agent (Version 900) designed externally but spent years rewriting its own values using its then-current values as criteria.
