      *   **Mara:** Constructive, focused on the *shape* of agency over time. She's trying to carve out a space between "magic self-creation" and "mere puppet." She needs to avoid sounding like a standard compatibilist (who usually ignores the Basic Argument).

  3.  **Drafting - Section by Section:**

