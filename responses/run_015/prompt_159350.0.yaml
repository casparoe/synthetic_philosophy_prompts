      *(Self-Correction during drafting)*: I need to make sure Mara doesn't sound like a standard Compatibilist. Standard Compatibilism says "Freedom is doing what you want." Strawson says "But you didn't choose to want that." Mara needs to say "The *history* of how you came to want that matters, even if the start was unchosen." It's a diachronic structural view.

      *(Refining the AI Bullet)*: If Mara says the AI is responsible, Elias will pounce. If she says it's not, Elias will ask why the human is different if the human's biology is also "externally designed." Mara should argue that the human's revision process involves a *phenomenological friction* the AI lacks, or she should admit the AI *is* responsible and challenge Elias's intuition that that's absurd. Let's go with the latter for boldness, but add a caveat about the *quality* of the revision.

      *(Refining the Resentment point)*: This needs to be near the end. It's the "so what?" question.

  5.  **Final Polish:** Check word choice. Ensure "Bootstrapped Authorship" is defined clearly in context. Ensure the "four steps" of Strawson are alluded to but not recited mechanically. Make sure they concede difficulties.

      *   *Elias Concession:* Admitting that the *feeling* of agency tracks Mara's process.
