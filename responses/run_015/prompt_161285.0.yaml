answer: |-
  The hinge squealed, a sound Eleanor had known for thirty years, sharp as a bird call in the pre-dawn grey. She lifted the lid of the trap. The smell hit her first: damp cardboard, moth scales, the faint, sweet rot of the bait. Beside her, Julian shivered in a borrowed coat too thin for the lowland damp. He was twenty-five, a philosopher from the university group, earnest and bright-eyed, treating the night like a seminar that had wandered outdoors.

  Eleanor ignored him for a moment, tipping the catch into the sorting tray. It was a heavy haul. Mostly Heart and Darts, a smattering of Burnet Companions, the occasional worn Silver Y. The egg-boxes were full of them, resting in the crevices, wings folded tight. They were all worn. The fraying on the edges told her they had flown for days, weeks perhaps. They were at the end of their adult lives.

  She opened her tally book. The first column was routine: *Total Individuals: 412*. She paused over the second column. This was the private one, the one she had started since joining Julian's reading group. It wasn't a count of bodies. It was a weighted figure, a product of the count multiplied by a probability she couldn't justify. Today, she wrote nothing.

  "Four hundred," Julian said, peering into the tray. "In one night. On one patch."

  "On one patch," Eleanor corrected. She picked up a Heart and Dart with soft forceps. Its legs twitched. "There are millions of these sites across the continent. Multiply that by the nights in a season. Multiply by the years."

  Julian nodded, seizing the opening. "That's the scale argument. Even if the chance of consciousness is one in a million, the expected suffering is massive. It outweighs everything else. The vertebrate ledger is empty by comparison."

  Eleanor placed the moth back. She looked at the row of them, identical in their drab browns. "You're treating them like lottery tickets, Julian. Independent draws. If I have a million tickets, I'm sure to have a winner."

  "Isn't that the math?"

  "It's not biology," she said. She swept her hand over the tray. "Look at them. They're the same machine. If the wiring for consciousness exists in this one, it exists in all of them. It's not a lottery per moth. It's a switch for the species. Either the factory made them all with souls, or none of them."

  Julian frowned, rubbing his arms for warmth. "But the probability is low. So the expected value..."

  "The expected value is the same, yes. I know the arithmetic." Eleanor tapped the tally book. "But the risk isn't a trickle. It's a flood or it's nothing. If I'm wrong about the switch, I'm not hurting a few. I'm hurting the whole swarm. You say the numbers make it certain *someone* suffers. I say the numbers make it certain *everyone* suffers, or no one does. There is no middle ground where only a few feel pain."

  Julian looked down at the moths. "So if the probability that at least one is conscious is effectively one... doesn't that settle it? We have to assume suffering is happening."

  "It settles that the room isn't empty," Eleanor said. "It doesn't tell you how many people are in it. You're acting like finding one conscious moth lets you save just that one. But you can't distinguish them. You have to bet on the room."

  She reached into her pocket and touched the letter from the institute. A colleague was asking about switching to a new biopesticide, something supposedly more humane. Her instinct had been to write back *no*. These populations were r-selected, held near carrying capacity by predation and resource limits. If you killed fewer moths with poison, the survivors would just lay more eggs, or the birds would eat more of the larvae. The population size would snap back like a rubber band. The intervention might achieve nothing. Or worse, it might prolong the struggle for existence without reducing the total number of deaths.

  She hadn't written the letter yet. The knot sat in her stomach, heavier than the trap.

  "Are you going to kill them?" Julian asked. He was looking at the ether bottle on the table.

  Eleanor looked at the moths. They were worn. Their adult lives were measured in days. The real living—the eating, the growing, the vulnerability—had happened when they were larvae. Most of those larvae had been eaten by wasps or birds. They had died screaming, biologically speaking, long before they ever reached the light trap.

  "What are we counting?" Eleanor asked. "Is it the life? Or the moment?"

  "The experience," Julian said.

  "But their experience isn't like ours. It might not be unified. A human remembers the pain. Does this?" She tapped the wing of the Heart and Dart. "Or is it just a reflex arc? A series of disconnected nows? If I kill them now, do I erase a history? Or do I just stop a machine that was already winding down?"

  "If you release them, they live a few more days."

  "And then they die. And their offspring take their place." She thought of the biopesticide again. If she released these, they would lay eggs. Those eggs would become larvae. Those larvae would be eaten. If she killed them now, the birds would eat something else. The total sum of hunger in the field remained constant. The suffering was a budget that couldn't be balanced, only redistributed.

  Julian was waiting. The sun was properly up now, bleaching the grey to pale blue. The moths were settling, becoming invisible against the cardboard.

  Eleanor held the ether bottle. Her thumb rested on the cap. If the switch was on, pouring this was murder on a industrial scale. If the switch was off, it was mere cleaning. The correlated credence meant she couldn't hedge. She couldn't say, 'I'll kill most but save a few just in case.' They were all the same. The moral status was collective.

  And the unit of account... if the suffering was in the larval stage, in the being eaten alive by a parasitoid wasp, then her kindness here was theatre. She was worrying about the painless death of the adult while ignoring the violent life of the child. But if the adult moment was the only moment that mattered, then releasing them was a gift of time, however brief.

  She thought of the letter in her pocket. *Will it make a difference?* Her scientific instinct said no. The system absorbs the shock. The numbers regenerate. But her moral instinct, the one Julian had woke up, screamed that the regeneration was the problem. The engine was running too hot.

  "Eleanor?"

  She unscrewed the cap. The sharp, chemical smell cut through the damp earth scent.

  "If I release them," she said, her voice quiet, "they feed the birds. If I kill them, the birds go hungry, or they eat the ones that hatch next week."

  "So it doesn't matter?"

  "It matters to the ones in the tray," she said. "But I don't know if there's anyone home to care."

  She looked at the second column in her book. She still hadn't written the number. The arithmetic was clean, but the reality was messy. The correlation meant the stakes were total. The unit of account was unclear. The population dynamics suggested futility.

  She tipped the ether bottle. A few drops onto the cotton wool in the killing jar. She didn't pour it over the tray. Not yet.

  "Help me sort them," she said. "We'll keep the rare ones. The rest..."

  She left the sentence hanging. The sun warmed her back. The moths waited, identical and silent, holding their secret in common. She would not decide for the species today. She would only decide for this tray, knowing it was a drop in an ocean she could not drain. She picked up the forceps.
