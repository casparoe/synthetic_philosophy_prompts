          *   "Intertemporal Sovereignty": Maybe the norm isn't consistency, but *negotiation* or *trust*. If I betray my future self, I break a trust, not a logic rule.

      *   *Implication 4: Moral Judgment.*
          *   If preferences shift genuinely (not just weakness of will), is it blameworthy?
          *   Analogy: Changing your mind vs. being inconsistent.
