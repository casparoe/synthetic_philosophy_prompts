answer: |-
  This simulation forces a collision between semantic success and mechanical consistency by secretly swapping the key that links tokens to rewards while keeping the token-movement rules unchanged.

  ### Design

  **Materials**
  *   **Tokens:** 60 index cards. 20 marked with a red circle, 20 with a blue square, 20 with a green triangle. One special card marked "US" on the back.
  *   **Legends:** Two envelopes labeled "KEY." Inside each is a sheet mapping shapes/colors to outcomes (e.g., "Red = Win," "Blue = Lose"). Key A and Key B are inverses or orthogonal.
  *   **World Deck:** 20 index cards labeled with scenarios (e.g., "Fire," "Flood," "Peace").
  *   **Stakes:** A bowl of edible items (chocolate chips, nuts, or mints) placed in the center.
  *   **Containers:** Two shoeboxes (Input/Output bins).

  **Roles (14–18 Participants)**
  *   **Conduit (10 people):** Sit in a circle. They are the substrate. They receive tokens, apply mechanical rules, and pass them. They do not know what the tokens mean.
  *   **Gateway (4 people):** Sit at a table apart. They hold the **Key** envelope and the **World Deck**. They judge whether Conduit outputs match the World based on the Key. They manage the Stake bowl.
  *   **Facilitator (You):** Manage time, enforce silence between groups, and execute the silent swap.

  **Rules & Incentives**
  *   **Conduit Rules:** purely mechanical. "If Red, pass immediately. If Blue, hold 5 seconds. If Green, swap with neighbor." No discussion of meaning allowed.
  *   **Gateway Rules:** Draw a World Card. Check tokens arriving from Conduit. If Token matches World according to the Key, add 2 stakes to the bowl. If mismatch, remove 1 stake.
  *   **Payoff:** At the end, the stakes in the bowl are distributed equally. Everyone wins if the system is "true." Everyone loses if the system is "broken."
  *   **Constraint:** No verbal communication between Conduit and Gateway. Only tokens pass between them.

  ### Timeline (100 Minutes)

  **0:00–0:15 | Setup & Calibration**
  *   Seat Conduit in a circle, Gateway at a table.
  *   Teach Conduit their mechanical rules (Red/Blue/Green). Practice for 2 minutes.
  *   Give Gateway **Key A**. Explain their job: match Tokens to World Cards to grow the Stake bowl.
  *   Start the flow. Conduit passes tokens; Gateway judges and adjusts stakes.
  *   *Goal:* Establish that mechanical work leads to edible rewards.

  **0:15–0:35 | Round 1: Stable Correspondence**
  *   Run the system. World Cards change every 2 minutes.
  *   Gateway uses **Key A**. Conduit follows mechanical rules.
  *   Stakes should fluctuate but generally grow if Conduit is fast.
  *   *Experience:* Participants feel a link between their work (moving cards) and the outcome (food). It feels like "doing the right thing."

  **0:35–0:55 | Round 2: Silent Re-grounding**
  *   **Mechanism 1 (Silent Swap):** While Conduit is focused on passing tokens, Facilitator swaps Gateway's envelope for **Key B**. Key B maps shapes to opposite outcomes (e.g., Red was Win, now Red = Lose).
  *   **Do not announce this.**
  *   Conduit continues exact same mechanical rules.
  *   Gateway begins removing stakes instead of adding them.
  *   *Experience:* Conduit feels frustration ("We are doing the same work, why are we losing?"). Gateway feels confusion ("They are sending the wrong symbols"). The link between substrate action and semantic success is severed.

  **0:55–1:15 | Round 3: Reverse & Self-Directed**
  *   **Mechanism 2 (Reverse Direction):** Facilitator announces "World State Change." Gateway draws a "Catastrophe" World Card. Gateway must now signal Conduit to change flow *based on the Key*. Gateway taps the table to speed up or slow down Conduit. Causation flows World -> Key -> Conduit Action.
  *   **Mechanism 3 (Self-Directed Token):** Facilitator inserts the "US" card into the Conduit flow.
      *   **Key A (Recall):** Legend said "US = Take a stake each."
      *   **Key B (Current):** Legend says "US = Return a stake each."
      *   When "US" arrives at Gateway, Gateway commands the group based on the current Key.
      *   *Experience:* The same physical card causes opposite physical behaviors (taking vs. giving) solely based on the hidden Key.

  **1:15–1:35 | Debrief**
  *   Reveal the swap. Distribute remaining stakes.
  *   Map activity moments to Hofstadter's claims (see below).
  *   Ask the three reveal questions.

  **1:35–1:40 | Close**
  *   Collect materials. No final verdict given.

  ### Debrief Guide

  **Mapping Moments to Claims**
  1.  **Round 1 Success:** Map to the **Intentional Stance**. When the system works, it feels like the *meaning* of the red card (Fire) caused the reward. Participants feel they were "thinking about Fire."
  2.  **Round 2 Failure:** Map to **Epiphenomenalism**. The physical cards (substrate) moved exactly the same way, but the "meaning" failed to cash out. This suggests the meaning was just a ride-along label that got detached.
  3.  **Round 3 Self-Token:** Map to **Downward Causation**. The "US" card was identical physics in both rounds, but your muscles moved differently. This suggests the *interpretation* pushed the matter around.
  4.  **The Facilitator:** Map to **The External Mind**. Acknowledge that you were the only thing holding the "truth" of the correspondence.

  **Strongest Versions of Both Sides**
  *   **The Physicalist Case:** "Nothing but physics happened. In Round 3, sound waves from the Gateway's mouth hit your eardrums and triggered motor neurons. The 'meaning' was just a story you told yourself about the sound waves. The Key was just paper ink. The substrate shoved everything."
  *   **The Symbolic Case:** "Without the Key, the sound waves were noise. The *pattern* of the Key selected which muscle movement occurred. The same card produced different futures. The information structure constrained the physics. The symbols shoved the substrate."

  **The Three Reveal Questions (Ask in Order)**
  1.  "When the treats stopped coming in Round 2, did the cards change, or did the world change?" (Targets the locus of failure).
  2.  "When the 'US' card made you take a stake then return a stake, what physically pushed your hand?" (Targets the mechanism of action).
  3.  "If I left the room and took the Keys with me, would the cards still mean anything?" (Targets the necessity of the interpreter).

  ### Predictable Failure Modes

  1.  **The Meta-Gamer:** Someone in the Conduit will try to deduce the Key by watching the Stake bowl.
      *   *Handle:* Allow it. This person is simulating "consciousness" emerging from the substrate. In debrief, ask them if they felt like a "mind" or just a pattern-matcher.
  2.  **The Rigging Accusation:** Participants will feel cheated by the silent swap.
      *   *Handle:* Validate this. "Yes, the system was rigged. Hofstadter's point is that biology is rigged by evolution. The 'Key' was natural selection, not me. I am just standing in for entropy."
  3.  **The Map/Territory Conflation:** Someone will say "The Key changed, so the symbols meant nothing."
      *   *Handle:* Correct gently. "The symbols meant something different. If they meant nothing, the Gateway wouldn't have been able to judge them at all. The ambiguity is the point."
  4.  **Gateway Disengagement:** The Gateway might feel like bureaucrats rather than part of the system.
      *   *Handle:* Remind them during setup that they are the "thalamus" or "interface." Their boredom is part of the substrate's indifference.
  5.  **Physicalist Dismissal:** "Obviously sound waves moved muscles."
      *   *Handle:* Agree. "Then why did the same sound waves not move muscles in Round 1? What selected the response?"

  ### Limits & Constraints

  **What This Activity Cannot Reproduce**
  *   **Emergent Grounding:** In this room, *you* stipulated the correspondence. In a real brain, the system must build its own grounding from scratch through interaction. You will have to assert that evolution plays the role of the Facilitator in real life.
  *   **Discriminating Physics:** Nothing here proves whether symbols *really* push or if it's just physics all the way down. Both stories predict the exact same observable outcomes (cards moving, muscles flexing). You cannot solve the metaphysical dispute with a game; you can only dramatize the tension.
  *   **The "Care" in Caring:** Hofstadter asks if the system *cares*. This game simulates *incentives* (stakes), not genuine caring. You must supply the link between "wanting chocolate" and "wanting survival" in your closing words.

  **What You Must Supply in Words**
  *   You must explicitly state that the **Facilitator = Evolution/Environment**. If you don't, they will just think you played a trick.
  *   You must assert that **Indistinguishability is the Point**. Tell them: "If you can't tell the difference between a system that understands and one that just shuffles cards, does the difference matter?"
  *   You must bridge the **Self-Token**. Explain that in the real world, there is no Gateway telling you what "YOU" means. You are both the Card and the Key, which is why the question hurts.

  **Neutrality Check**
  *   **For the Physicalist:** The game shows how easily "meaning" is disrupted by physical changes (the swap), supporting the idea that meaning is fragile and dependent on substrate configuration.
  *   **For the Non-Physicalist:** The game shows how the same substrate produces different realities based on the Key, supporting the idea that information structure is causally potent.
  *   Neither side is given a victory condition; the stakes are shared.
