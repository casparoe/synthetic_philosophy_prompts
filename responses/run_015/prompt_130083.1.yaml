answer: |-
  In Book II of the *Republic*, Glaucon issues a formidable challenge to Socrates: demonstrate that justice is desirable for its own sake, stripped of the rewards and reputations that follow it. To do this, Glaucon deploys the myth of the Ring of Gyges, a device granting physical invisibility. His argument is that if a just man and an unjust man both possessed the ring, they would act identically, pursuing self-interest without fear of consequence. Glaucon concludes that justice is merely a social compromise, valued only for its instrumental utility in maintaining reputation and avoiding punishment. However, this traditional framing relies on a specific kind of concealment: physical invisibility. The agent knows what they have done, even if society does not. To truly stress-test the value of justice, we must radicalize Glaucon's thought experiment. Suppose we reinterpret the Ring not as physical invisibility, but as "epistemic invisibility." Under this condition, an agent can act unjustly, but no observer—including the agent themselves, due to built-in self-deception mechanisms—can ever form a justified belief that the injustice occurred. This stronger version severs the link between action and self-knowledge. Does this make injustice rational? I argue that it does not. By employing a modified contractarian framework focused on diachronic agency rather than Hobbesian fear, we find that justice remains rational even under epistemic invisibility, revealing its value as a constitutive condition of coherent selfhood rather than a mere social tool.

  The power of the epistemic invisibility (EI) modification is that it seemingly removes the last psychological barrier to injustice. In the standard Ring scenario, the wearer retains knowledge of their corruption. A Platonist might argue this damages the soul's harmony, creating internal dissonance. But under EI, the agent is insulated from the psychic cost of guilt because they cannot justify the belief that they have acted wrongly. They may commit murder or theft, yet their cognitive architecture prevents them from categorizing the act as a moral failure attributable to them. Glaucon would argue this is the ultimate victory for the unjust life: one reaps the material benefits of predation without suffering the social stigma or the internal burden of a guilty conscience. If justice were good in itself, surely this is the scenario where it should perish; yet, if the agent cannot even know they are being unjust, in what sense can they be said to value justice? It appears that EI reduces the moral agent to a black box of outputs, rendering the internal state of "justice" irrelevant to the agent's subjective experience.

  However, this view assumes that rationality is merely about maximizing localized utility in the present moment. A modified contractarian reply shifts the focus from immediate gain to the stability of long-term planning. Unlike the Hobbesian contract, which is grounded in the fear of external punishment, this version grounds moral norms in the necessity of self-coordination across time. To be a rational agent is to have projects that extend into the future. To pursue these projects, I must be able to predict my own behavior and rely on my own adherence to norms. If I adopt the maxim "act unjustly when epistemically invisible," I introduce a fundamental instability into my own agency. Even if I do not *know* I acted unjustly in a specific instance, the *policy* of allowing EI-injustice means my future actions are governed by a principle of opportunistic deviation.

  Consider the "possible worlds" aspect of this planning. I must plan my life knowing that my memory is fallible and that my epistemic filters might fail. If I operate under a norm that permits injustice when undetectable, I must acknowledge that in some possible futures, I may misremember a situation as epistemically invisible when it was not, or I may forget that I utilized the ring. If my moral framework allows for hidden deviations, my future self becomes a variable I cannot trust. I cannot safely cooperate with my future self, nor can I rely on my past self to have laid a stable groundwork. Moral norms, therefore, function as coordination devices that stabilize the agent against their own potential for error and fragmentation. Justice, in this light, is not just about how I treat others; it is the protocol that ensures my agency remains unified and predictable to itself.

  Does this rescue the claim that justice is good in itself? Glaucon might object that this is still instrumental: justice is good *for* planning. But this distinction collapses when we recognize that for a rational being, the capacity for coherent planning is not merely a tool but a definition of existence. To lose the stability of agency is to lose the self that does the valuing. If EI-injustice fragments the will by introducing untrackable variables into the self-model, it undermines the very subject who is supposed to enjoy the benefits of the injustice. The "gain" from the unjust act is enjoyed by a fragmented entity that cannot securely appropriate that gain into a coherent life narrative. Therefore, the rationality of justice is not derived from external consequences (reputation) or internal feelings (guilt), but from the structural requirements of being a unified agent. Justice is the health of the will, not merely the health of the reputation.

  Under the epistemic invisibility framing, Glaucon attempts to isolate the value of justice from all consequences, including self-knowledge. He fails because he overlooks the consequence of *agency fragmentation*. The modified contractarian argument shows that even if no one (including me) can know I was unjust, the *rule* permitting such acts destabilizes the coordination required for rational life. Justice retains its value not because it feels good or looks good, but because it is the only stable operating system for a self that persists through time. Glaucon assumes the self is a given; the contractarian reply shows the self is an achievement maintained by norms.

  Verdict: Glaucon loses because justice proves to be constitutively necessary for coherent agency, retaining its rational supremacy even when all epistemic traces of injustice are erased.
