      *   *(b) Reductionist Identity:* Parfitian view. No "further fact." Identity is psychological continuity/connectedness (degrees). *Key:* Weak metaphysical link between past and present self.
      *   *(c) Grounding in Sovereignty/Life-Narrative:* Authority comes from interest in the "life as a whole" and not having the end written by repudiated values. *Key:* Narrative integrity over metaphysical identity.
      *   *(d) Sliding Scale Authority:* Authority weakens as psychological connectedness weakens. Eventually yields to current welfare. *Key:* Gradualism.
      *   *(e) Asymmetry (Refusal > Request):* Refusals bind tighter than requests for treatment. *Key:* Negative rights vs. positive claims.
      *   *(f) Dynamic Values Model > Static Document:* A computational model of lifetime values is better than a signed paper. *Key:* Epistemic accuracy over formalism.
      *   *(g) Current Welfare Matters:* The dementia patient's current experience matters morally *now*, even if the AD overrides it to end life. *Key:* Moral status of the present self is not zero.

  3.  **Map Dependencies (Who is doing the work?):**
      *   (b) supports (d): If identity is degrees of connectedness, then authority should be degrees (d).
      *   (c) supports (a): Sovereignty over the "life as a whole" is the *reason* (a) holds despite (b).
      *   (g) creates the counter-weight to (a): If current welfare matters, why does (a) win? (c) answers this (narrative integrity > current welfare).
      *   (f) challenges the *mechanism* of (a): If (a) is about sovereignty, does a static document capture sovereignty better than a dynamic model (f)?
      *   (e) is a standard bioethics constraint, sits somewhat orthogonally but interacts with (d) regarding thresholds.

