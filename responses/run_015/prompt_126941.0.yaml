          *   (d) says weaker connectedness = less weight... past some point yields to patient in front of us.
          *   *Conflict:* (a) sounds absolute ("should bind even once..."). (d) sounds gradual/defeasible ("past some point it should yield"). If connectedness is near zero (advanced dementia), (d) suggests yielding. (a) suggests binding.
          *   *Severity:* High. This is a direct contradiction in application.

      *   *Tension 2: (b) vs. (c).*
          *   (b) says identity is just psychological connectedness (degrees).
          *   (c) says authority is grounded in "sovereignty over a life" / "life as a whole."
          *   *Conflict:* Parfitian reductionism usually undermines the "life as a whole" as a morally weighty entity *over and above* the temporal stages. If there is no deep further fact, why does the "narrative whole" have authority over the current stage's welfare? This is the classic McMahan vs. Dresser debate territory.
          *   *Severity:* Medium-High. It's a theoretical friction point. Can you be a Parfitian and hold strong narrative sovereignty? Yes, but it requires careful footwork (e.g., Dworkin's critical interests).

      *   *Tension 3: (a) vs. (g).*
          *   (a) allows cutting life short based on past wishes.
          *   (g) says current welfare matters *exactly as much as anyone else's*.
          *   *Conflict:* If the current patient's welfare matters as much as anyone's, overriding it to satisfy a past self's preference looks like sacrificing a person for a "ghost."
          *   *Severity:* Medium. This is the moral cost of (a). It's not a logical contradiction if you prioritize critical interests (c) over experiential interests (g), but it creates moral dissonance.

