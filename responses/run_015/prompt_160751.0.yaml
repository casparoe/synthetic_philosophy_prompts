      *   *Stateless person (3 yrs, stuck):* YES (shaky). (Physical presence + coercion, but lack of legal status).
      *   *Citizen born abroad (never visited):* NO. (Legal tie only, no social/economic/physical tie). *Tension:* Why is stateless (3 yrs) IN but citizen (0 yrs) OUT?
      *   *16-year-old:* YES. *9-year-old:* NO. (Capacity/Agency threshold).
      *   *Persistent Vegetative State (PVS):* NO. (Capacity/Agency threshold).
      *   *Company:* NO. (Not a human/agent).
      *   *Downstream foreigners (dam):* Consult, no vote. (Affected, but not members).

  3.  **Evaluate the "All-Subjected Principle" (ASP):**
      *   *User's critique:* Correct. ASP includes tourists (laws apply to them), children, and PVS patients.
      *   *Refinement needed:* ASP is too broad. It needs a filter for *duration/stake* and a filter for *agency*.

  4.  **Search for a Better Principle:**
      *   *Candidate 1: All-Affected Interests (AAI).*
          *   Pros: Explains downstream foreigners (affected).
          *   Cons: Too broad. Tourists are affected by traffic laws. Companies are affected by tax. User says NO to companies and downstream voters.
      *   *Candidate 2: Stakeholder Citizenship.*
          *   Focus: Having a "stake" in the future of the community.
          *   Pros: Excludes tourists (temporary stake). Includes commuters (economic stake). Includes 10-yr resident (life stake). Excludes abroad citizen (stake faded).
          *   Cons: Doesn't inherently explain age/capacity (PVS/9yo).
      *   *Candidate 3: Membership as Shared Fate + Agency.*
          *   This looks like a hybrid.
          *   *Condition 1 (Membership):* You are part of the ongoing project of self-government. (Residence + Time + Economic integration).
          *   *Condition 2 (Agency):* You can exercise the vote meaningfully. (Capacity).

  5.  **Synthesizing the Principle:**
      The user's verdicts align best with a **"Resident Stakeholder + Competent Agency"** principle.
      *   *Core:* Voting is for those who share the *long-term fate* of the polity and possess the *capacity* to shape it.
      *   *Why 10-yr resident YES:* Long-term fate shared (residence + tax).
      *   *Why Expatriate NO:* Fate diverged.
      *   *Why Commuter YES:* Significant daily fate shared (work + tax), even if sleep elsewhere.
      *   *Why Tourist NO:* Fate not shared long-term.
      *   *Why Stateless YES:* Fate is inescapably tied (can't leave), even if legal status is missing. (Explains the "shakiness" — legal recognition is usually the proxy for stake, but here the stake is factual).
      *   *Why Citizen Abroad NO:* Legal tie isn't enough without factual stake. (Resolves the tension: Stateless is IN because they are *here*, Citizen is OUT because they are *gone*).
      *   *Why 16 YES / 9 NO / PVS NO:* Competence/Agency constraint.

  6.  **Addressing the Tensions (Where it Bites):**
      *   *Stateless vs. Citizen Abroad:* The principle forces the user to admit that *citizenship itself is not the ground for voting*, but rather a proxy for residence/stake. This is a hard bite for legalists but fits the user's gut.
      *   *Commuter vs. Tourist:* The line is "significant integration." 2 weeks vs. daily work.
      *   *PVS/Children:* Requires a capacity threshold. This creates edge cases (dementia, temporary incapacity).
      *   *Downstream Foreigners:* The principle distinguishes between "affected by a specific decision" vs. "sharing the ongoing fate of the polity." This justifies consultation without enfranchisement.

  7.  **Testing New Cases:**
      *   *Prisoners (Life):* They are residents. They share the fate (inside the territory). Agency is intact (mostly). *Verdict:* YES. (Principle forces this, even if popular opinion says no).
      *   *Dual Citizens:* If they live here, YES. If they live abroad, NO (per the expat verdict). Voting in two countries is allowed if they reside in both (rare) or if both countries use citizenship-based voting (which the principle critiques).
      *   *Absentee Landowners:* Own land, live abroad. Like the expat citizen. Stake is financial, not "shared fate" of daily life. *Verdict:* NO. (Consistent with expat citizen).

  8.  **Drafting the Response:**
      *   *Name the Principle:* "Resident Stakeholder + Agency."
      *   *Define it:* Two necessary conditions. 1. Factual Membership (Residence/Integration/Duration). 2. Moral Agency (Capacity).
      *   *Explain the Fit:* Walk through how it matches the user's list.
      *   *Highlight the Conflict:* Specifically the Citizen Abroad vs. Stateless Resident. The principle demands prioritizing *fact* over *law*.
      *   *Apply to New Cases:* Prisoners, Dual Citizens, Landowners.
      *   *Identify the "Bite":* Where the user might have to change their mind (e.g., prisoners, maybe the commuter depending on definition of residence).

  9.  **Refining the "Shaky" Stateless Verdict:**
      *   Why is the user shaky? Because legal recognition is missing.
      *   The principle says: If they can't leave, their fate is bound. The "shakiness" comes from the administrative difficulty, not the moral right. I should point this out.

  10. **Refining the "PVS" Verdict:**
      *   Why NO? Lack of agency.
      *   Does this wreck the list? No, it adds a second filter. The first filter is "Belonging," the second is "Capacity."

  11. **Final Polish:** Ensure tone is analytical and direct, avoiding academic jargon where possible, sticking to the "no reading list" constraint. (Self-Correction: Make sure to explicitly state which verdict might need to be dropped. The "Commuter" is the weakest link in a strict "Residence" model, but fits "Stakeholder." The "Prisoner" is the likely casualty if the user holds onto common intuitions, but the principle demands they vote.)

      *Wait, one nuance:* The user said "Commuter... lives over the border." Strict residence principle says NO. Stakeholder principle says YES. The user said YES. So the principle must be *Stakeholder* not just *Residence*.
      *Revised Principle:* **"Integrated Stake + Competent Agency."**
      *   *Integration:* Tax, daily life, duration.
      *   *Agency:* Cognitive ability.

      *Let's check the Prisoner case again.* Prisoners are integrated (in a way), but are they "sharing the fate"? Yes. Do they have agency? Yes. Principle says YES. Many people say NO. This is a good "bite."

      *Let's check the Downstream Foreigners.* They are affected, but not integrated. Principle says NO vote. Matches user.

      *Let's check the Citizen Abroad.* Not integrated. Principle says NO. Matches user.

      *Let's check the Stateless.* Integrated (stuck here). Principle says YES. Matches user (even if shaky).

