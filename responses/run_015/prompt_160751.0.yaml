answer: |-
  Based on your verdicts, the "All-Subjected Principle" (coercion) is indeed too broad. It captures tourists and children because laws apply to them, but your intuition correctly signals that voting requires more than just being legally bound for a fortnight.

  Your verdicts align best with a hybrid principle I will call **"Integrated Stake + Competent Agency."**

  ### The Principle

  You belong to the *demos* if and only if you meet two conditions:

  1.  **Factual Integration (The Stake):** Your life prospects are durably intertwined with the political community's decisions. This is evidenced by **residence, economic contribution (tax), and duration.** It is a matter of *fact*, not just legal status.
  2.  **Moral Agency (The Capacity):** You possess the cognitive capacity to form and express a preference about that shared future.

  ### How it fits your list

  *   **10-Year Resident:** Meets Integration (long-term residence + tax). Meets Agency. **YES.**
  *   **Expatriate Citizen:** Fails Integration. Your verdict shows you prioritize *factual* ties over *legal* ties. **NO.**
  *   **Commuter:** Meets Integration (daily economic life + tax), even if sleep is elsewhere. **YES.**
  *   **Tourist:** Fails Integration. Presence is temporary; fate is not shared. **NO.**
  *   **Stateless Person:** Meets Integration (factually stuck, fate is bound here). Meets Agency. **YES.** (Your "shakiness" comes from the lack of legal paperwork, but the principle overrides this: factual entrapment creates a stake).
  *   **Citizen Born Abroad:** Fails Integration. Legal status without factual presence is insufficient. **NO.**
  *   **16 vs. 9 Year Old:** Both meet Integration. 16 meets Agency threshold; 9 does not. **YES / NO.**
  *   **PVS:** Meets Integration. Fails Agency. **NO.**
  *   **Company:** Meets Integration (tax/economy). Fails Agency (not a human moral agent). **NO.**
  *   **Downstream Foreigners:** Fails Integration. They are *affected* by a specific decision, but do not share the *ongoing fate* of the polity. **NO.**

  ### The Tension Resolved
  You worried that the Stateless Person (YES) and the Citizen Abroad (NO) couldn't survive together. This principle says they **must** survive together.

  It forces you to accept that **citizenship is merely a proxy for integration, not the ground of voting rights.** When the proxy fails (the citizen leaves), the right lapses. When the proxy is missing but the fact remains (the stateless person stays), the right holds. This resolves your worry: the stateless person is IN because their fate is inescapably here; the citizen is OUT because their fate is elsewhere.

  ### Where the Principle Bites (The Costs)
  To maintain reflective equilibrium, you must accept the following implications, which may conflict with common law or intuition:

  1.  **Prisoners Serving Life Sentences:**
      *   *Verdict:* **YES.**
      *   *Why:* They are residents. Their fate is entirely bound to the state (often more than commuters). They retain moral agency.
      *   *The Bite:* Many people intuitively feel crime forfeits membership. This principle says it does not. If you want to exclude them, you must add a "compliance" condition, which would threaten your 10-year resident verdict (what if they evaded tax?).
  2.  **Dual Citizens Living Abroad:**
      *   *Verdict:* **NO** (in your country).
      *   *Why:* If they live abroad, they fail the Integration test for *your* demos, even if they hold a passport.
      *   *The Bite:* This disenfranchises a large class of current voters in many nations. It implies voting in two countries is only legitimate if you physically reside in both (impossible) or if both countries abandon the integration principle.
  3.  **Absentee Landowners:**
      *   *Verdict:* **NO.**
      *   *Why:* Financial interest (rent/tax) is not the same as "shared fate." They can leave if the dam is built; the downstream foreigners (who lose homes) have a stronger claim than the landlord, yet even *they* only get consultation.
      *   *The Bite:* Property ownership does not grant political membership.

  ### Which Verdict Must You Drop?
  The principle is stable, but it exposes one weak point in your list: **The Commuter.**

  If you strictly enforce "Shared Fate," the commuter is a borderline case. They sleep, raise families, and use emergency services in the *other* country. Their integration is partial.
  *   **Option A:** Keep the Commuter as YES. You must define Integration loosely (economic presence counts as much as residence).
  *   **Option B:** Change Commuter to NO. You prioritize the "community of life" (where you sleep/raise kids) over the "community of work."

  **Recommendation:** To keep the principle cleanest, **drop the Commuter verdict to NO.**
  *Reasoning:* If you allow commuters to vote, you struggle to exclude the 10-year resident who *doesn't* work (e.g., a retiree living on savings). If you base it on "tax," the tourist pays VAT. If you base it on "residence," the commuter fails.
  *However*, if your gut says Commuter is YES, you must define Integration as **"Significant Daily Impact."** This is testable but messier.

  ### Summary for Your Essay
  Your underlying theory is **Stakeholder Citizenship constrained by Capacity.**
  *   **Grounds:** Factual interdependence, not legal status.
  *   **Limit:** Cognitive agency.
  *   **Hard Truth:** It disenfranchises expat citizens and enfranchises long-term undocumented residents and prisoners.
  *   **Test:** Ask of any claimant: "If this polity collapses, does your life fall apart?" If yes, they vote. If no (tourist, expat, landlord), they don't. (Unless they lack capacity).
