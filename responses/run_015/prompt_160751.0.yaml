      *   **Constraints:** No reading lists. Just the principle(s), where it bites (conflicts), and application to new cases (prisoners, dual citizens, absentee landowners).
      *   **Goal:** Reflective equilibrium. Find a principle that fits most verdicts, identify which verdicts must be dropped/adjusted, and test against new cases.

  2.  **Deconstruct the Verdicts:**
      *   *10-year resident (non-citizen):* YES. (Strong connection: residence + tax + time).
      *   *Expatriate citizen (8 yrs abroad, no tax, disengaged):* NO. (Legal tie exists, but social/economic tie broken).
