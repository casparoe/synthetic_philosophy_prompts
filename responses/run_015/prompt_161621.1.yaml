  **PromiseSwap Liquifies Moral Hazard in Series A Launch**
  **By Compliance Weekly Staff**

  SAN FRANCISCO — PromiseSwap, a fintech startup focused on interpersonal obligation compliance, announced yesterday the beta launch of its flagship platform, designed to eliminate the friction of unilateral fidelity. By matching promisors with vetted "surrogate performers," PromiseSwap claims to resolve the inefficiency of personal inability while preserving the normative structure of the promise.

  "We recognized that the bottleneck in traditional promising was the agent-specific constraint," said CEO Julian Vane. "If I promise to pick you up at the airport but get stuck in traffic, the obligation remains even if the outcome is achieved by a Uber Black. Our model decouples the duty from the actor."

  Under the platform's terms, a user logs a promise. If fulfillment becomes improbable, PromiseSwap deploys a gig-worker surrogate to perform the act. The promisee receives a notification and a micro-transaction "fidelity credit." Crucially, the app's smart contracts recognize the directed nature of promissory obligation: only the promisee can release the promisor. However, PromiseSwap has innovated a secondary market for this release right.

  "The right to release is an asset," said Vane. "Why let it sit idle?"

  The new "Pre-Consent Bundle" allows promisees to sell their standing to release future promises in advance. Promisors can purchase these bundles, effectively buying absolution before the promise is even made. Regulatory consultant Dr. Aris Thorne praised the clarity. "It creates liquidity in the trust market. Users know exactly where they stand regarding liability."

  Critics within the beta group noted edge cases. "I promised my daughter I'd watch her play," said user Elena Rosic. "A surrogate watched her and filed a report. My daughter was confused, but the app marked the ticket 'Resolved.'"

  Furthermore, the Terms of Service explicitly carve out non-transferable categories. Users cannot promise to feel emotions, commit crimes, or perform acts already required by independent duty (the "No Free Lunch" clause), ensuring the platform doesn't monetize pre-existing obligations.

  To sustain the ecosystem, PromiseSwap will charge a 0.5% "Convention Maintenance Fee" on all transactions. Vane explained that promising relies on a collective social convention, and scaling it requires capital. "We are privatizing the upkeep of the institution itself," he said. "It's a small price for guaranteed fidelity."

  At press time, early data suggests that widespread adoption of Pre-Consent Bundles has reduced the number of active promisees in the beta pool by 40%, a metric PromiseSwap describes as "streamlining the counterparty landscape."

  ***

  **SIDEBAR: Protocol Exclusions**
  *   **Affective States:** Cannot promise to "feel happy" or "love someone."
  *   **Malum in Se:** Cannot promise to commit crimes or torts.
  *   **Identity-locked:** Cannot promise "I will personally paint this" if surrogate is used.
  *   **Pre-existing Duty:** Cannot promise to do what law already requires.

  ***

  **Author's Note**

  I wrote this from a **Convention-Based** account (Humean). The satire hinges on the paradox that promising relies on a public, mutual practice, but PromiseSwap treats it as a private commodity. By charging a "Convention Maintenance Fee," the startup admits the obligation depends on a social institution it is simultaneously dismantling through marketization. I exaggerated the "surrogate performance" issue to highlight that promising often binds the *agent*, not just the outcome. The "Pre-Consent Bundle" is a *reductio*: if everyone sells their right to hold others accountable, the directed obligation vanishes because there is no one left to owe. I leaned hardest on the contestation around **inalienability**. The joke assumes the right to release is inherent to the promisee's standing; selling it in advance treats standing as property, which collapses the relational structure necessary for the promise to mean anything. The piece costs me the nuance that some conventions *can* evolve without collapsing, but the deadpan tone requires assuming the market logic is blind to its own dependency.
