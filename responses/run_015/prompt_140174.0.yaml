answer: |-
  You don't need a messy principle. You need a tighter definition of what a commons *is*.

  The "tired pasture metaphor" (Hardin's Tragedy of the Commons) assumes a resource that is **rivalrous** (if I eat the grass, you can't) and **open access**. But your examples show you intuitively understand that modern commons are often **non-rivalrous** (my reading Wikipedia doesn't stop you) and **governed** (by norms, code, or law).

  Your gut verdicts are actually consistent with a single, tidy principle. I call it **The Principle of Generative Capacity.**

  ### The Principle
  **Moral blame attaches not to "taking," but to extracting value in a way that degrades the system's ability to keep generating that value, weighted by the actor's power to prevent that degradation.**

  This principle handles the scale and power dynamics you noticed. It explains why the hobbyist is fine (their use doesn't threaten the library's survival) but the company is wrong (their demand threatens the maintainer's burnout). It explains why the big country is blameworthy (high capacity to fix, high impact on the planetary system) while the small country is not.

  ### The Verdict to Throw Out
  To make this principle truly tidy, you have to sacrifice one verdict: **You, reading Wikipedia for twenty years and donating twice.**

  **Why?**
  Under the Principle of Generative Capacity, your verdict conflicts with your anger at the drug company and the open-source company.
  *   **The Drug Company** extracts public research (a commons) and privatizes the value without replenishing the public trust or funding.
  *   **The OS Company** extracts labor (a commons of code) and demands more without replenishing the maintainer's energy.
  *   **You** extract knowledge (a commons of information) to build your *career* (professional extraction) and replenish it at a rate statistically negligible to the system's survival.

  You feel fine because Wikipedia's institutional design *tolerates* free-riders; it expects a low donation conversion rate. But tolerance is not moral absolution. If every professional beneficiary of Wikipedia acted exactly as you have, the system would collapse. You are a "benign parasite" only because others are being symbiotic. To be consistent with your anger at the OS company, you must admit that professional dependency creates a duty of proportional replenishment, regardless of whether the resource begs for it.

  ### The Test Case: The AI Company
  **Case:** A company trains a model on everything publicly posted online and then gives the thing away for free.

  **Verdict:** **Blameworthy.**

  **Application of the Principle:**
  1.  **Extraction:** The company extracts the "generative capacity" of the internet (human creativity, data, writing) to build a product.
  2.  **Degradation:** By giving the model away for free, they are not replenishing the *source* of the commons (the human creators). They are creating a substitute that competes with the source. If the model answers queries that would have sent traffic, ad revenue, or engagement to the original posters, it degrades the economic incentive for humans to post.
  3.  **Power:** The company has the capacity to license data, share revenue, or restrict the model's use to protect creators. They choose not to.

  This is the **Drug Company** case, not the **Wikipedia** case. The Drug Company took public research and priced it out of reach; the AI Company takes public creativity and prices it out of relevance. Even if the model is free, if it hollows out the ecosystem that produced the data, it violates the Principle of Generative Capacity.

  ### Summary
  Your intuitions are scientifically sound; they describe a **complex adaptive system**, not a simple pasture.
  *   **Tidy Principle:** Generative Capacity (Do you harm the system's future ability to produce value?).
  *   **Sacrifice:** Your Wikipedia guilt (or lack thereof). Professional use demands proportional support.
  *   **AI Verdict:** Blameworthy. It extracts the past to cannibalize the future.
