answer: |-
  First off, your idea isn't daft at all. In fact, "mnemonic drift" is a really sharp way of describing something that often gets glossed over in big theoretical frameworks. You've hit on the difference between *engineering* history and *gardening* it.

  Here is my honest take on how your concept stacks up against Hobsbawm and Anderson, and whether you've just rediscovered one of them.

  ### Hobsbawm: The Architect vs. The Weather
  Hobsbawm's *The Invention of Tradition* is the obvious comparison, but you're right to sense a mismatch. Hobsbawm is fundamentally interested in **intent**. When he talks about invented traditions (like the rituals of the British monarchy or Scottish tartans), he is looking at moments where elites actively construct a narrative to legitimize a specific power structure or social cohesion.

  There is a "villain" in Hobsbawm's framework, or at least an architect. It implies a meeting room where someone says, "We need the population to feel X, so let's revive ritual Y."

  Your "mnemonic drift" is different because it removes the architect. It suggests that the shift happens through **inertia**. A school board doesn't decide to rewrite history to serve the state; they decide to update a textbook because the old one is falling apart, and the new authors happen to have different blind spots. Thirty years later, the national story has shifted, but no one sat down and planned the shift.

  So, to answer your question: **Hobsbawm misses the drift.** His framework is too static and too conspiratorial (in the structural sense) to account for the slow, banal erosion and re-emphasis that happens through bureaucratic routine. He explains the *launch* of the tradition, but not its *drift* over decades of maintenance.

  ### Anderson: The Medium vs. The Message
  Anderson's *Imagined Communities* is less about the content of the memory and more about the *capacity* to share it. His big insight is that print capitalism (novels, newspapers) allowed people to imagine themselves living in the same "homogeneous, empty time" as strangers.

  Anderson explains *why* we care about the national story at all. He explains the vessel. But he doesn't really explain how the liquid inside the vessel changes colour over time. His focus is on the *origin* of national consciousness (mostly 18th and 19th centuries) and the technological conditions that made it possible.

  Once the community is "imagined," Anderson doesn't spend much time on the curatorial process of how that imagination is tweaked by museum boards or curriculum committees. He is focused on the **shared reading**, not the **editing process**.

  So, **Anderson doesn't cover it either.** He explains the stage, but your concept is about the script changes that happen between acts without the playwright noticing.

  ### Is "Mnemonic Drift" just one of them in disguise?
  No. I think you are pointing to something neither of them fully handles, which is the **banality of institutional memory**.

  Both Hobsbawm and Anderson are "big picture" theorists. They are looking at the forest. You are looking at how the trees slowly rot and get replaced by saplings over a century.

  *   **Hobsbawm** assumes the tradition is a tool used *by* power.
  *   **Anderson** assumes the nation is a feeling felt *by* people.
  *   **You** are suggesting the nation is a story managed *by* bureaucracy.

  Your concept aligns more closely with later work in **Social Memory Studies** (people like Paul Connerton or Aleida Assmann) who look at how societies forget as much as how they remember. Connerton, for example, talks about "preservative memory" versus "habitual memory," and how institutions can silently discard things simply by stopping the performance of them.

  However, your specific angle on "bureaucratic forgetting without a villain" is a valuable nuance. It captures the idea that **neglect is as powerful as invention.** Hobsbawm focuses on what is added (the invention); you are focusing on what is allowed to fade (the drift).

  ### The Verdict
  If you had to pick one, Hobsbawm is the closer relative because he deals with the *content* of tradition and its political function. But your concept improves on him by removing the requirement for deliberate manipulation.

  "Mnemonic drift" isn't just a disguise for their ideas; it's a necessary update. Hobsbawm and Anderson wrote in the 80s, during a time when we were very focused on how nations were *built*. Your idea fits a modern intuition where we are more interested in how narratives *slide* in an age of administrative complexity.

  It's a solid concept. It describes the difference between a lie and a typo that nobody corrects for fifty years until it becomes the truth. That's not Hobsbawm's invention; that's just entropy, and it's a great lens for looking at national identity.
