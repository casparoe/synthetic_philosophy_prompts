prompt: |-
  My friend Theo and I got into it a couple of nights ago, two drinks in, about the classic utility-monster objection, and I think between us we built an argument that proves way too much. I can't find the bad step and it's been bugging me since.

  Setup so this is self-contained. Cardinal welfare scales -- the numbers you plug into a utilitarian sum -- are normally said to be unique only up to positive affine transformation: for a single person, replacing w with a·w + b (a > 0) preserves everything about that person's welfare levels and differences. That's supposed to be why it makes no difference whether you measure Bea's welfare in utils or micro-utils; the second just multiplies all her numbers by a million and changes nothing about Bea.

  Here's the arguement:

  (1) A change of units represents no difference in the facts. If two assignments of numbers to people's welfare differ only by per-person positive affine transformations, they represent the same situation, so a correct moral theory cannot give different verdicts depending on which assignment you happen to use.

  (2) What total utilitarianism recommends is determined by the sum of the numbers.

  (3) So total utilitarianism's verdicts depend on the units. Concretely: three people, a fixed stock of 100 units of some resource, each with the same diminishing-returns welfare function (say welfare = square root of resources). Measure everyone in the same units and the sum-maximizing split is 33/33/33. Now measure only Amara in micro-utils, multiplying her numbers by a million, and the sum-maximizing split hands her essentially all 100 units and leaves the other two with basically nothing.

  (4) Which means a utility monster can be manufactured out of anybody. Take a completely ordinary person, grade their welfare on a fine enough ruler, and the utilitarian sum says to sacrifice everyone else to them. You never had to suppose a creature with a bizarrely efficient psychology; you just needed a smaller unit for that one person.

  (5) But being a utility monster is supposed to be a substantive possibility about a creature's psychology -- that there could be someone who gets vastly more welfare out of any sacrifice than everyone else loses. That can't depend on which ruler we picked.

  (6) So either the utility monster objection is empty -- a complaint about bookkeeping rather than about what utilitarianism would have us do -- or utilitarianism's recommendations about distribution are indeterminate, and the decades of fighting between utilitarians and their critics about distribution was never about anything.

  (7) Both of those are absurd. The objection obviously has teeth, people on both sides feel its force, and it isn't a units quibble. And utilitarians plainly do say substantive, determinate things about distribution.

  So which step do I reject? I'd give up almost anything before I accept (6), but I also really don't want to say that the fine-grainedness of your ruler can change what morality requires of you. Name the step, say why it looked fine, and then price the alternatives: for each candidate thing to give up, what does it commit me to downstream -- in population ethics, in how I think about interpersonal tradeoffs generally, wherever the cost shows up -- and which of those bills would I regret later?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user and their friend Theo discussed the "utility monster" objection to utilitarianism over drinks.
      *   **Core Argument:** They constructed an argument suggesting that Total Utilitarianism (TU) is fatally flawed because welfare scales are only unique up to positive affine transformations *per person*. If you can scale one person's utility arbitrarily (e.g., measure Amara in "micro-utils" while others are in "utils"), TU dictates giving all resources to Amara. This implies *anyone* can be turned into a utility monster just by changing the measurement unit, which seems absurd.
      *   **The Dilemma:** The user feels the argument proves "too much" (i.e., it undermines the very coherence of utilitarianism in a way that contradicts actual philosophical practice). They want to know which step to reject, why that step looked plausible, and what the costs (downstream commitments) of rejecting it are.
      *   **Constraint:** The user wants to avoid conclusion (6) (that the objection is empty or utilitarianism is indeterminate). They are willing to reject other steps but want to know the "price" of doing so.

  2.  **Deconstruct the Argument Steps:**
      *   (1) *Invariance Principle:* Moral verdicts shouldn't depend on arbitrary unit choices (positive affine transformations per person).
      *   (2) *TU Definition:* TU maximizes the sum of welfare numbers.
      *   (3) *Scaling Consequence:* Changing units changes the sum, thus changing the verdict (demonstrated with the 3-person example).
      *   (4) *Monster Manufacture:* Therefore, anyone can be made a utility monster via scaling.
      *   (5) *Monster Nature:* Utility monstrosity should be substantive (psychological), not procedural (measurement).
      *   (6) *Dilemma:* Either the objection is empty (bookkeeping) OR TU is indeterminate/arbitrary.
      *   (7) *Rejection of Dilemma:* Both horns are absurd.

  3.  **Identify the Philosophical Flaw:**
      *   The core issue lies in the interpretation of **Interpersonal Comparisons of Utility (ICU)**.
      *   Standard microeconomic theory (ordinal utility) says utility is unique up to positive affine transformation *for an individual*.
      *   However, **Total Utilitarianism requires interpersonal comparability**. You cannot sum $U_A$ and $U_B$ unless the units of $A$ and $B$ are calibrated to each other.
      *   The argument assumes that we can arbitrarily scale $U_A$ relative to $U_B$ *without changing the facts of the situation*.
      *   *Correction:* If $U_A$ and $U_B$ are truly comparable (as TU requires), then the scaling factor between them is *fixed by the facts*, not chosen by the theorist. You cannot just decide "Amara counts for a million times more" unless the *facts of her psychology* dictate that she gains a million times more welfare from a resource than Bob does.
      *   Therefore, Step (1) is the culprit, but specifically the clause "per-person positive affine transformations." While valid for *intra*personal comparison, it is invalid for *inter*personal comparison *if* the theory requires summation.
      *   Alternatively, Step (3) is technically true (the sum changes), but Step (1) implies that such a change *represents the same situation*. In TU, changing the interpersonal scaling factor *does* represent a different situation (a different claim about how much A values things relative to B).

  4.  **Evaluate Candidate Steps to Reject:**

      *   **Reject (1): The Invariance Principle (specifically regarding interpersonal scaling).**
          *   *Why it looked fine:* It's standard decision theory for a single agent. It feels like "units shouldn't matter."
          *   *The Fix:* For TU to work, welfare must be *cardinally comparable across persons*. This means the zero point and unit size must be fixed across persons (or at least the ratio between them must be fact-fixed). You can't arbitrarily rescale Amara relative to Bob.
          *   *Cost/Price:* You commit to **Strong Interpersonal Comparability**. This is metaphysically and epistemologically heavy. How do we know the conversion rate between Alice's utils and Bob's utils? It requires a robust realism about welfare magnitudes. It opens you up to claims that utilitarianism relies on unobservable metaphysical facts.
          *   *Population Ethics:* Makes "Repugnant Conclusion" style calculations possible but relies on controversial comparability assumptions.

      *   **Reject (2): The Definition of TU.**
          *   *Why it looked fine:* It's the definition of Total Utilitarianism.
          *   *The Fix:* Switch to a theory that doesn't sum raw numbers (e.g., Prioritarianism, Sufficientarianism, or Ordinal Utilitarianism).
          *   *Cost/Price:* You abandon Classic Utilitarianism. This is a high price if the user wants to save TU.

      *   **Reject (3): The Consequence.**
          *   *Why it looked fine:* Mathematically, if $Sum = A + B + C$, and $A' = 1,000,000 A$, then $Sum' \neq Sum$.
          *   *The Fix:* Argue that if you scale A, you aren't describing the same moral problem.
          *   *Cost/Price:* This collapses into Rejecting (1).

      *   **Reject (5): The Nature of the Monster.**
          *   *Why it looked fine:* Intuitively, a monster is a psychological fact.
          *   *The Fix:* Accept that "monstrosity" is partly a function of how we calibrate welfare.
          *   *Cost/Price:* This leads to (6), which the user explicitly wants to avoid.

  5.  **Formulate the Recommendation:**
      *   The "bad step" is **(1)**, specifically the assumption that *interpersonal* affine transformations preserve the "same situation" in the context of a aggregative theory.
      *   *Nuance:* It's not that (1) is wrong for *individual* decision theory. It's that TU posits a **Common Scale**.
      *   If TU is true, there is a "God's eye" unit of welfare. You can't just switch Amara to micro-utils unless Amara *actually* experiences a micro-util as the same hedonic tone as Bob's util. If you just change the number without changing the psychology, you are misrepresenting the facts.
      *   Therefore, the argument fails because it assumes we have the freedom to rescale persons relative to each other arbitrarily. TU denies this freedom.

  6.  **Drafting the Response:**
      *   **Acknowledge the sophistication:** This is a well-known problem in welfare economics and moral philosophy (the "Interpersonal Comparison of Utility" problem).
      *   **Pinpoint the Error:** Step (1) is the weak link. It conflates *intrapersonal* invariance (which is true) with *interpersonal* invariance (which TU forbids).
      *   **Explain Why:** To sum utilities, they must be on a common scale. If you change the scale for one person, you are changing the claim about how much they matter relative to others.
      *   **Price of Rejecting (1):**
          *   **Metaphysical Cost:** You need robust realism about welfare magnitudes.
          *   **Epistemic Cost:** How do we measure/verify the conversion rate between Alice and Bob?
          *   **Population Ethics:** It allows for the Repugnant Conclusion (since you can sum across populations), but relies on the controversial comparability.
      *   **Alternative (Rejecting 2):** If you don't want to pay the comparability cost, you must abandon Classic TU for something like Prioritarianism (which weights gains differently) or accept that TU is indeterminate without a fixed scale (which leads back to 6, which the user hates).
      *   **Conclusion:** The "Utility Monster" objection usually assumes the monster has a *different psychological capacity* (steeper welfare function), not just a different unit label. The user's argument shows that *without* fixed interpersonal units, TU is incoherent. The solution is to insist TU *requires* fixed interpersonal units.

  7.  **Refining the "Price" Analysis:**
      *   Need to be clear about what "Strong Comparability" entails. It's not just "we can compare." It's "there is a fact of the matter about the ratio."
      *   Mention Harsanyi or Sen on this.
      *   Make sure to address the "Utility Monster" specifically. The Monster objection works *because* we assume the scale is fixed, and the monster *still* dominates. The user's argument shows that if the scale isn't fixed, *everyone* dominates. So the fix is: The scale *must* be fixed.

  8.  **Final Polish:**
      *   Tone: Philosophical, rigorous, but conversational (matching the prompt).
      *   Structure: Identify the step -> Explain the error -> Analyze the costs of the fix.

      *(Self-Correction during drafting)*: Wait, is it Step (1) or Step (3)? Step (3) says "verdicts depend on units." That's mathematically true. Step (1) says "Change of units represents no difference in facts." That is the philosophical claim that fails in an interpersonal context. If I measure temperature in Celsius vs Fahrenheit, the physics doesn't change. But if I measure Alice's pain in "screams" and Bob's in "whimpers" without a conversion rate, I can't sum them. If I arbitrarily declare 1 Scream = 1,000,000 Whimpers, I *have* changed the facts about their relative sensitivity. So yes, Step (1) is the one. It assumes interpersonal scaling is arbitrary. TU says it is not.

      *Wait, one nuance:* Some philosophers argue that interpersonal comparison *isn't* possible. If so, TU is dead. The user wants to save TU (or at least avoid conclusion 6). So I must argue that TU *commits* you to interpersonal comparability.

      *Let's check the steps again.*
      (1) says: "If two assignments... differ only by per-person positive affine transformations, they represent the same situation."
      This is the definition of **Ordinal Non-Comparability** (or Cardinal Non-Comparability).
      TU requires **Cardinal Full Comparability**.
      So (1) is incompatible with (2). You can't hold both.
      Since the user wants to avoid (6) (TU is indeterminate), they must reject (1)'s applicability to the interpersonal case.

      *Okay, plan confirmed.* Focus on the distinction between Intrapersonal and Interpersonal comparability.

      *Costs:*
      1.  **Metaphysical:** Welfare is a natural magnitude (like mass), not just a ranking.
      2.  **Epistemic:** We need to know the conversion rate.
      3.  **Ethical:** It makes the "Monster" objection rely on empirical psychology, not measurement tricks.

      *Wait, is there a cost to rejecting (1)?* Yes, it makes utilitarianism vulnerable to the claim that it relies on "spooky" metaphysical facts. Also, it makes the Repugnant Conclusion harder to dodge (because you *can* sum small lives vs big lives).

      *Let's write it.*
answer: |-
  This is a classic problem in welfare economics and moral philosophy, often discussed under the heading of **Interpersonal Comparisons of Utility (ICU)**. You and Theo have effectively rediscovered the argument that Classic Utilitarianism is mathematically incoherent *unless* it assumes a very strong metaphysical premise about welfare.

  The bad step is **(1)**.

  Here is why it looked fine, why it is actually false in this context, and the price you pay for rejecting it.

  ### Why Step (1) Looked Fine
  Step (1) relies on a standard principle from decision theory: **Intrapersonal Invariance**. For a single agent, it is indeed true that utility is unique only up to positive affine transformation. If I prefer A to B, it doesn't matter if I assign those outcomes values of (10, 5) or (1,000,000, 500,000). My choices remain the same. This is the "ordinalist" consensus that dominated economics for much of the 20th century.

  It feels intuitive because we treat units like meters vs. feet. Changing from meters to feet doesn't change the length of the table. So, it feels like changing from "utils" to "micro-utils" shouldn't change the moral weight of a person's welfare.

  ### Why Step (1) Is the Failure Point
  Step (1) smuggles in an assumption that is incompatible with Step (2).
  *   **Step (1)** assumes **Non-Comparability**: It claims you can transform Person A's scale independently of Person B's scale without changing the "facts of the situation."
  *   **Step (2)** assumes **Full Comparability**: Total Utilitarianism requires summing $W_A + W_B$. You cannot add meters to seconds. You cannot add "Alice's hedonic tons" to "Bob's preference ranks" unless there is a fixed conversion rate between them.

  If Total Utilitarianism is true, there is a **common currency of welfare**. The "unit" is not arbitrary per person; it is fixed across persons. If you arbitrarily multiply Amara's welfare by a million, you are not just changing the ruler; you are making a substantive claim that *Amara's capacity for welfare is actually one million times greater than Bob's.*

  If Amara's psychology is identical to Bob's, then assigning her a different scale is **misrepresenting the facts**, not just changing units. Step (1) says "these represent the same situation." Step (2) implies "these represent different situations (one where Amara matters more, one where she doesn't)." You cannot hold both.

  To save Utilitarianism from the "arbitrary monster" problem, you must reject the claim that interpersonal scaling is arbitrary. You must assert that there is a **fact of the matter** about the ratio between Amara's utils and Bob's utils, and we are not free to change it without lying about their psychology.

  ### The Price of Rejecting (1)
  If you reject (1) to save Utilitarianism from indeterminacy, you are committing to **Cardinal Full Comparability**. This is a heavy metaphysical and epistemological bill. Here is what you are signing up for:

  #### 1. The Metaphysical Cost: Welfare Realism
  You are committed to the view that welfare is a natural magnitude, akin to mass or charge, not just a ranking of preferences.
  *   **Downstream:** You must defend the idea that there is a "God's eye" scale of goodness. This opens you to attacks from naturalists who argue there is no such property in the universe. If welfare is just neural firing rates, fine—but whose firing rates count more? If it's subjective satisfaction, how do we calibrate the "size" of satisfaction across different brains?
  *   **Regret Potential:** High, if you are a metaphysical minimalist. You are positing a robust moral reality that exists independently of our measurement choices.

  #### 2. The Epistemic Cost: The Measurement Problem
  If the scale is fixed by facts, we need to know what those facts are.
  *   **Downstream:** How do we determine the conversion rate between Alice and Bob? Do we look at neural correlates? Behavioral revelation? Introspective reports? If Alice says "I love ice cream a lot" and Bob says "I love ice cream a lot," are they experiencing the same magnitude?
  *   **Regret Potential:** High, if you care about practical policy. If we can't reliably measure interpersonal welfare ratios, Total Utilitarianism becomes action-guiding only in theory, not in practice. You might find yourself unable to resolve real-world tradeoffs because the "conversion rate" between a rich person's utility and a poor person's utility is empirically opaque.

  #### 3. The Population Ethics Cost: The Repugnant Conclusion
  By securing the common scale to avoid the "arbitrary monster," you validate the math that leads to the Repugnant Conclusion.
  *   **Downstream:** If units are comparable and fixed, you can meaningfully sum vast numbers of small lives against fewer large lives. The logic that prevented the "arbitrary monster" (fixed units) also prevents you from saying "we can't compare a population of 1 billion to a population of 10 billion."
  *   **Regret Potential:** Moderate to High. Many utilitarians find the Repugnant Conclusion unacceptable. By fixing the scale to solve your current problem, you solidify the mathematical machinery that generates the Repugnant Conclusion. You trade the "Arbitrary Monster" for the "Repugnant Conclusion."

  #### 4. The "Monster" Objection Returns (Correctly)
  Once you fix the scale, the Utility Monster objection comes back in its intended form.
  *   **Downstream:** You can no longer say "Monsters are impossible because units are arbitrary." You must now argue either (a) Monsters are psychologically impossible (no one *actually* gains that much more welfare), or (b) Even if they exist, we should still feed them (bite the bullet).
  *   **Regret Potential:** Low. This is actually a feature, not a bug. It restores the debate to where it belongs: substantive psychology and moral intuition, rather than measurement conventions.

  ### Summary of the Trade-Off
  You are currently facing a trilemma. You can only keep two of the following three:
  1.  **Total Utilitarianism** (Summing is the right method).
  2.  **Invariance** (Unit choices don't change moral facts).
  3.  **Determinacy** (The theory gives specific answers).

  Your argument shows that **1 + 2 → ~3**. (If you sum arbitrary units, you get arbitrary answers).
  To keep **1 + 3**, you must drop **2**.

  **Recommendation:**
  Reject **(1)**, but specifically the clause that implies *interpersonal* transformations preserve the situation. Accept that for Utilitarianism to function, the "ruler" must be the same for everyone.
  *   **Why:** It preserves the determinacy of the theory and respects the intuition that morality shouldn't depend on bookkeeping.
  *   **The Bill:** You must become a **Welfare Realist**. You have to argue that there are objective facts about how much welfare Alice gets relative to Bob, and that Utilitarianism is dependent on our ability to discover those facts.

  If that metaphysical commitment is too high for you, the only other consistent move is to reject **(2)** and abandon Classic Total Utilitarianism for a theory that doesn't require strong interpersonal summation (e.g., Prioritarianism or a form of Contractualism), but that is a much larger philosophical pivot than fixing the measurement scale.
