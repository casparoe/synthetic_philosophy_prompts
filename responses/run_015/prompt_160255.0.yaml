          *   **Colin (Custodial View):** Monument is evidence of what 1898 Brackenhill chose to praise. One generation shouldn't edit the record bequeathed to the next.
      *   **Required Discussion Points:**
          1.  Inextricability (Praise/Blame attach to the same deed).
          2.  Statue-vs-Name Asymmetry (Avoidance vs. Coercion).
