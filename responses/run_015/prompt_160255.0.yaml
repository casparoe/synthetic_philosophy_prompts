          *   1898 deed of gift & 1961 endowment require statue remain in square permanently. Breach returns $2.4M endowment to a private heritage foundation.
          *   Four options: Remove to museum; Rename street Reconciliation Way; Both; Neither + Counter-monument.
      *   **Characters:**
