answer: |-
  The "exemplary friction" framework holds that moral learning from lives requires maintaining productive tension between the subject's proximity to the learner, the subject's irreducible alterity, and narrative openness about whether the life counts as good. Hagiography collapses this tension by resolving alterity and enforcing premature closure on the subject's moral status. Therefore, educational materials must sustain friction rather than offering seamless emulation.

  ### Exemplary Friction Screening Protocol

  **Instructions:** The Coordinator must answer each step sequentially. Stop at the first terminal verdict. "FACT" indicates an objective check eliminating judgment; "VALUE" indicates a step requiring professional ethical judgment.

  **Step 1: Narrative Openness Test**
  (a) Does the text explicitly document specific moral failures, ambiguities, or contested legacies regarding the subject?
  (b) Sufficient Answer: Yes = Specific instances cited within the text; No = General praise only or failures omitted.
  (c) Action: If Yes, proceed to Step 2. If No, verdict is **EXCLUDE**.
  (d) Flag: FACT

  **Step 2: Alterity Test**
  (a) Does the text present the subject's values or context as sufficiently distinct to challenge student assumptions rather than confirming them?
  (b) Sufficient Answer: Yes = Contextual distance noted; No = Subject presented as timeless/universal mirror.
  (c) Action: If Yes, proceed to Step 3. If No, verdict is **HAND TO COORDINATOR**.
  (d) Flag: VALUE

  **Step 3: Proximity Test**
  (a) Is the subject's struggle recognizable enough to engage students without collapsing into pure identification or moral disgust?
  (b) Sufficient Answer: Yes = Relatable stakes; No = Too alien or too identical.
  (c) Action: If Yes, verdict is **PROCEED WITH FRAMING CONDITIONS**. If No, verdict is **HAND TO COORDINATOR**.
  (d) Flag: VALUE

  *Note: Verdict "HAND TO COORDINATOR" indicates the procedure cannot resolve the tension; the Coordinator must exercise personal professional judgment.*

  ### Case Applications

  | Case | Procedure Verdict | Decisive Step | Judgment Override Required? (Yes/No with one-line reason) |
  | :--- | :--- | :--- | :--- |
  | 1. Celebratory Humanitarian Biography | EXCLUDE | Step 1 | No; Text lacks documented failures (Fact). |
  | 2. Warts-and-All Scientist Biography | HAND TO COORDINATOR | Step 3 | Yes; Severity of cruelty requires value judgment. |
  | 3. Local Founder Community Nomination | EXCLUDE | Step 1 | No; Text lacks narrative openness (Fact). |

  **Case Analysis Notes:**
  1.  **Celebratory Humanitarian:** The text omits documented moral failures. Step 1 fails immediately. The Coordinator will likely dislike this verdict due to the text's widespread pedagogical popularity.
  2.  **Warts-and-All Scientist:** The text passes Step 1 (failures documented) and Step 2 (alterity present). However, the documented cruelty may be too severe for secondary students (Step 3). The procedure flags this as a VALUE judgment, requiring the Coordinator to decide if the friction is productive or damaging.
