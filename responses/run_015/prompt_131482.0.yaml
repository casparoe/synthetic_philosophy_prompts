  # Welcome to Valoria: The Republic of Optimal Outcomes

  Welcome to Valoria, the world's first nation-state fully constituted upon the principles of unbounded expected-value maximization. Here, every statute, social norm, and bureaucratic procedure is designed to maximize utility without risk aversion, scope discounting, or modal constraints. Visitors are encouraged to embrace our risk-neutral hospitality, where the only irrational act is ignoring a non-zero probability of infinite return.

  **Getting Around**
  The Valorian National Rail network is a marvel of longtermist resource allocation. Please note that train routes are determined by global utility functions rather than local passenger load. It is common for scheduled services to depart for uninhabited coordinates where a microscopic probability of civilizational rescue has been identified. While the carriages may be empty, travelers are reminded that occupying a seat on a statistically optimal route contributes to the aggregate good. Delays are rare, as timetable adjustments are calculated ex ante to minimize expected waiting time across all possible timelines.

  **Dining and Etiquette**
  Restaurant menus are dynamic documents, updated in real-time to reflect ex ante optimization across all diners' possible dietary restrictions. When ordering, please submit your probability distribution for allergens rather than specific requests. Your meal may be selected to maximize caloric utility for the table's aggregate risk profile; consequently, you may receive dishes you cannot eat if another patron's potential nourishment outweighs your immediate consumption. Tipping is discouraged, as capital is best deployed where marginal utility is highest, which is rarely the waiter's pocket.

  **Civic Life and Governance**
  Valoria boasts a highly efficient democratic system. Voting weights are not equal but are calibrated by confidence-weighted projected policy impact. Citizens with robust models of societal outcomes cast heavier ballots, ensuring governance remains aligned with true expected value. The Tax Authority assesses obligations in expected-value terms across modal branches; you will be taxed on income you might earn in accessible possible worlds, payable in this one. Visitors are welcome to observe the annual Festival of Unbounded Commitment, commemorating the legislative defeat of the Mugging Resistance Movement. The parade features floats depicting the triumph of infinite expectation over finite intuition.

  **Entry Requirements**
  Upon arrival, immigration forms require visitors to declare their full credence distributions for risk-assessment purposes. Please ensure your probabilities sum to unity. Failure to accurately report your confidence levels regarding existential risks may result in deportation to a lower-utility jurisdiction.

  > **VISITOR ETHICS AND COUNTERFACTUAL COURTESY**
  >
  > To ensure a harmonious stay, please adhere to the following local norms regarding probabilistic interaction:
  >
  > *   **Street Solicitations:** You may encounter vendors proposing trivial present favors (e.g., spare change) in exchange for astronomically improbable but cosmically significant future reciprocation. While skepticism is natural, visitors are warned against dismissing these offers due to probability neglect. Refusing a valid Pascal-style proposal is considered a severe breach of etiquette. Evaluate the expected value calmly; if the multiplier is sufficiently high, compliance is mandatory.
  >
  > *   **Conversation:** Avoid scope neglect in public discourse. Expressing greater concern for one identifiable individual than for a statistical multitude is socially unacceptable and may be interpreted as moral dysfunction. When discussing charity or policy, always linearize your empathy according to the headcount.
  >
  > *   **Counterfactuals:** Do not express relief about events that did not occur. In Valoria, the expected value of the branch you inhabit is all that matters. Regretting a near-miss accident implies an irrational weighting of non-actualized worlds.

  We look forward to hosting you in Valoria, where every choice is a calculation, and every calculation counts.
