answer: |-
  Here is a joke drafted for a PhD-level audience, followed by the clarification you asked for.

  ### The Slide Joke

  **Title:** The Limits of Pragmatic Vindication

  **Scene:** A formal epistemologist walks into a betting shop with a ledger of incoherent credences.

  **Epistemologist:** "Book me! I hold inconsistent credences that Bach is superior to Mozart. I'm vulnerable to a Dutch Book! Prove my aesthetic norms are pragmatically self-defeating!"

  **Bookie:** (Doesn't look up from the racing form) "Can't help you."

  **Epistemologist:** "Why not? I'm guaranteed to lose money!"

  **Bookie:** "You're guaranteed to lose money only if the bet *settles*. And aesthetic judgments don't have truth conditions. You're trying to run a pragmatic argument on a non-cognitive attitude."

  **Epistemologist:** "But isn't irrationality costly?"

  **Bookie:** "Not if there's no market. There's no betting market for 'betterness,' only for 'is.' Unless you're wagering on which composer had higher baroque inflation, I can't exploit you. You're not wrong, you're just planning to listen differently."

  **Epistemologist:** "So my taste is immune to money pumps?"

  **Bookie:** "No. It's immune to *books*. You can't Dutch book a plan, you can only fail to execute it. Now get out before I call Gibbard."

  ***

  ### Diachronic vs. Synchronic

  You asked which one is about updating over time:

  *   **Diachronic** = **Across time** (Updating/Conditionalization).
      *   *Mnemonic:* **D**iachronic = **D**ynamic / **D**uration. It concerns how your credences should change from Time 1 to Time 2 upon receiving evidence.
  *   **Synchronic** = **At a single time** (Probabilism/Coherence).
      *   *Mnemonic:* **S**ynchronic = **S**napshot / **S**till. It concerns whether your credences are coherent at a specific moment, regardless of how you got there.

  **Good luck with the workshop!** If they don't laugh, just tell them the joke was an expressive act of solidarity, not a truth-apt assertion.
