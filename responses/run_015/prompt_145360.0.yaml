  Created step by step, not fixed before.

  For future terms we cannot yet decide
  If some property holds or fails to hold,
  For LEM requires a finished state to hold.

  To prove disjunction is to choose a side,
  Constructing one disjunct explicitly,
  Not merely showing both cannot fail.
