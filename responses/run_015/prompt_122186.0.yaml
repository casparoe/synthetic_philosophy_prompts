  Finally, to measure whether you are seeing looping or ordinary drift, you should measure the elasticity of prevalence with respect to classification rate across different social contexts. Ordinary drift from increased awareness should correlate uniformly with information exposure, like a marketing campaign for a somatic condition. Looping implies the classification carries social capital or stigma that alters behavior beyond mere awareness. You would measure the shift in feature importance weights for self-identification variables versus clinical variables before and after the category becomes public. If the weights for self-report features spike disproportionately compared to a control condition with similar publicity but lower social stakes, that supports the looping hypothesis. The confound of diagnostic substitution is real, but you can control for it by tracking overall clinic intake rates. If the total intake is stable but the composition shifts toward the new label specifically in high-literacy demographics, that is evidence of looping. If the evidence shows the feature weights shifting based on the social utility of the label rather than just symptom awareness, the evidence pushes toward your friend. The mechanism isn't just data changing; it is the agents optimizing for the label.
