  **STANDING COMMITTEE ON EFFECTIVE CALCULABILITY**

  **Notice of Proposed Rulemaking**

  **AGENCY:** Standing Committee on Effective Calculability.
  **ACTION:** Notice of proposed rulemaking.
  **SUMMARY:** The Committee proposes to settle the epistemic status of the Church–Turing Thesis by administrative classification.
  **DATES:** Comments must be received by [Date].
  **ADDRESSES:** Submit comments via the Federal e-Rulemaking Portal.

  **SUPPLEMENTARY INFORMATION:**

  **I. Findings of Fact**
  1. The Thesis pairs an informal notion—what a human following explicit rules with pencil and paper could carry out—with a formally defined class of functions.
  2. No proof is available, because any formalization of the informal side either begs the question or yields a different, genuinely provable equivalence result.
  3. The real evidence is the convergence of independently motivated formalisms (Turing machines, general recursive functions, lambda-definability, register and rewrite machines), which is striking but is not a proof of the identification.
  4. The Thesis comes in at least two versions: one about effective calculability and one about what any physical system can compute, where exotic spacetimes or real-valued dynamical systems would threaten the second while leaving the first untouched.
  5. Settling the matter by stipulating that "computable" just means Turing-computable is a dodge rather than an answer.

  **II. Proposed Rule**
  The Committee proposes to amend 15 C.F.R. Part 101 as follows:

  **§ 101.1 Classification Scheme.**
  The Thesis shall be administratively classified into one of three tiers: (a) Settled Theorem; (b) Working Thesis; or (c) Terminological Stipulation. The Committee reserves the right to migrate the Thesis between tiers based on epistemic volatility.

  **§ 101.2 Renewal Requirement.**
  The classification granted under § 101.1 shall expire every seven years. Renewal requires a affirmative vote confirming that no conceptual shifts have occurred in the notion of "effective procedure."

  **§ 101.3 Certification of Counterexamples.**
  Any purported counterexample, such as a physical hypercomputer, must be validated by a procedure that is itself Turing-computable. Failure to submit validation via approved digital portal will result in dismissal.

  **III. Call for Public Comment**
  Interested persons may submit comments on the proposed rule. The Committee notes that this Notice was produced by a procedure whose status is currently subject to this rulemaking.

  ***

  **Drafter's Note**
  This satire targets three contested readings of the Church–Turing Thesis. First, the "definition" reading (e.g., Shapiro) treats computability as stipulative; defenders would argue the satire is unfair because stipulations aren't subject to empirical falsification. Second, the "empirical" reading (e.g., Copeland) views it as a claim about physical laws; defenders would object that the renewal clause ignores that physical facts don't expire. Third, the "quasi-empirical" or conceptual reading sees it as a philosophical proposal; defenders would argue the certification clause (§ 101.3) misrepresents the conceptual barrier rather than a bureaucratic one. The humor relies on the impossibility of regulating conceptual analysis.

  Bottom line: The Church–Turing Thesis is a philosophical proposal regarding the limits of formalization, not a compliance item subject to regulatory adjudication.
