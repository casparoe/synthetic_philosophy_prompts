answer: |-
  Here is the ranking from most locked in by path dependence to least, with a one-sentence explanation for each:

  1.  **QWERTY Layout:** Retooling physical hardware and retraining billions of human muscle memories creates a switching cost that dwarfs the ergonomic benefits of alternatives like Dvorak.
  2.  **TCP/IP:** Replacing the core protocol would require a coordinated hard fork of every router, server, and device on the global internet simultaneously.
  3.  **English as the Language of Code:** The early dominance of US and UK research cemented English keywords like `if` and `while`, though natural language interfaces are beginning to abstract this away.
  4.  **Python for ML:** Massive ecosystem inertia keeps Python on top, but performance bottlenecks are already driving critical underlying components toward Rust and C++.
  5.  **RLHF:** This is a transient alignment technique with known flaws, and the field is actively researching fundamentally different approaches like constitutional AI or RLAIF.

  **On whether tech history is mostly locked in:**

  It depends on which layer of the stack you're looking at. Infrastructure layers (like keyboards, protocols, and syntax) tend to lock in hard because the coordination cost to change them is massive, but methodology layers (like ML architectures and alignment techniques) churn rapidly because better designs offer immediate, measurable gains. You aren't overthinking the RLHF situation; it feels like patching because it likely *is* a bridge technique rather than a final destination, and history suggests it will be replaced once a fundamentally more scalable approach matures.
