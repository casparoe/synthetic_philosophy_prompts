answer: |-
  # The Chamberlain Diagnostic Tree

  **Root Node:** If two adults willingly exchange money for a service, does that single act make the resulting wealth distribution fair, even if it makes one person millions richer than everyone else?

  *   **NO** → Go to **Node A**
  *   **YES** → Go to **Node B**

  ---

  ### Node A (The "No" Branch)
  **Question:** Is the trade fair but the starting line crooked, or is the trade unfair because of where the runners end up?

  *   **Starting Line Crooked** → **Leaf 1**
  *   **Where Runners End Up** → Go to **Node C**

  ### Node B (The "Yes" Branch)
  **Question:** If thousands of these exchanges happen over a lifetime, does the fairness of the first exchange guarantee the fairness of the final fortune?

  *   **YES** → Go to **Node D**
  *   **NO** → Go to **Node E**

  ---

  ### Node C (Pattern vs. Rules)
  **Question:** Do societal outcomes follow the same moral rules as individual trades, or do they follow completely different rules?

  *   **Different Rules** → **Leaf 2**
  *   **Same Rules** → Go to **Node F**

  ### Node D (Inheritance)
  **Question:** Does the right to keep this fortune extend to passing it all to children who did nothing to earn it?

  *   **YES** → **Leaf 3**
  *   **NO** → **Leaf 4**

  ### Node E (Erosion Type)
  **Question:** Is the unfairness triggered by a specific dollar amount or by the passage of time?

  *   **Dollar Amount** → **Leaf 5**
  *   **Passage of Time** → **Leaf 6**

  ### Node F (Pattern Type)
  **Question:** Does the rule require everyone to have roughly equal shares, or just enough to survive?

  *   **Roughly Equal** → **Leaf 7**
  *   **Just Enough** → **Leaf 8**

  ---

  ### Terminal Leaves (Commitments & Diagnoses)

  **Leaf 1: The Left-Libertarian Baseline**
  *   **Commitment:** You must claim the trade itself was free, but the money used to pay for it was originally stolen from the commons.
  *   **Status:** Occupied.

  **Leaf 2: The Micro/Macro Incoherence View**
  *   **Commitment:** You must argue that a society can be perfectly just in every individual interaction yet wholly unjust as a whole.
  *   **Status:** Occupied.

  **Leaf 3: The Strict Historical Entitlement**
  *   **Commitment:** You must accept that a child born with a rare genetic trait owns the market value of that trait absolutely, even if others starve.
  *   **Status:** Occupied.

  **Leaf 4: The Meritocratic Historical Entitlement**
  *   **Commitment:** You must tax the inheritance of a fortune but not the income that created it, treating death as a moral reset button.
  *   **Status:** Occupied.

  **Leaf 5: The Threshold Entitlement**
  *   **Commitment:** You must admit the millionth dollar is stolen, but the first 999,999 were earned fairly, despite no change in effort.
  *   **Status:** Occupied.

  **Leaf 6: The Dynamic Patterning View**
  *   **Commitment:** You must allow extreme wealth for four years, then forcibly redistribute it in the fifth year to reset the pattern.
  *   **Status:** Occupied.

  **Leaf 7: The Lexical Pattern (Rawlsian/Egalitarian)**
  *   **Commitment:** You must forbid a deal that helps both parties because it hurts a third party who wasn't involved in the deal.
  *   **Status:** Occupied.

  **Leaf 8: The Sufficientarian Pattern**
  *   **Commitment:** You must allow one person to hoard billions provided everyone else has a crust of bread.
  *   **Status:** Occupied.

  **Leaf 9: Unoccupied Logical Space (The Patterned Historical)**
  *   **Commitment:** *None.* This position claims history determines justice *unless* it violates a pattern, then pattern determines justice.
  *   **Diagnosis:** **Incoherence.** You cannot hold that history is the sole justification for ownership while simultaneously admitting a pattern can override it; the moment the pattern overrides history, history is no longer the justification.

  **Leaf 10: Unoccupied Logical Space (The Micro-Unjust/Macro-Just)**
  *   **Commitment:** *None.* This position claims individual trades are unjust (coercive/fraudulent) but the resulting society is perfectly just.
  *   **Diagnosis:** **Unattractiveness.** No theory gains traction by arguing that systemic justice is built exclusively from a foundation of millions of individual injustices.
