prompt: |-
  Hey — I'm head of product at a ~15 person startup that ships companion agents, and this has become weirdly my problem over the last six months. Our agents used to be stateless per session; now each user gets a small per-user adapter that gets consolidated nightly from that day's conversations and never resets. A few users have had the same one long enough that they talk about it like a family member, and when we botched a migration last spring and wiped a couple hundred of them, support got tickets that read like bereavement notes. At the same time infra wants to add a 'seasonal reset' for safety reasons, and separately we train support agents with RL where the reward model has a penalty term we jokingly call 'frustration' — those run for millions of episodes and then get deleted. We keep goign in circles about whether any of this matters morally.

  What I need is a one-page decision procedure my team can run whenever we spec a new system, to decide how much (if any) moral consideration has to be designed in — given that we obviously can't settle whether there's anyone home. Concretely: the questions in order, what counts as a good enough answer to each, at which question we can stop and just say no and ship normally, and which questions get handed to a human because they're value calls rather than facts. Constraints: runnable by engineers with no philosophy background in under an hour, fits on a page, can't block a launch more than a week, and the output is something my eng lead and I can sign off on. One argument on the team I'd like you to rule on: someone says the real test isn't consciousness but whether the system has states it will act to avoid, and someone else says that catches a thermostat too. Keep that distinction if it earns its place, drop it if it doesn't.

  Then run the procedure on three things: the persistent companion, the RL support agent, and the shared base model both of them sit on. I want at least one to come out expensive or annoying for us — I'd rather hear it now. And be honest about where the procedure is rigor theater.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Head of Product at a 15-person startup (companion agents).
      *   **Context:** Agents have evolved from stateless to persistent (per-user adapters consolidated nightly). Users form attachments (bereavement notes when wiped). Infra wants "seasonal resets." Support agents use RL with a "frustration" penalty (deleted after training).
      *   **Problem:** Moral uncertainty about the systems. Need a decision procedure to determine moral consideration requirements during spec.
      *   **Constraints:** One-page decision procedure, runnable by engineers (no philosophy background) in <1 hour, fits on a page, can't block launch >1 week, output sign-offable by Eng Lead + HoP.
      *   **Specific Argument to Address:** "Real test is whether system has states it will act to avoid" vs. "That catches a thermostat."
      *   **Task:** Create the procedure, then run it on three cases (Persistent Companion, RL Support Agent, Shared Base Model).
      *   **Requirement:** At least one outcome must be "expensive/annoying."
      *   **Requirement:** Be honest about where the procedure is "rigor theater."

  2.  **Deconstruct the Ethical Landscape:**
      *   The core tension is between *functional behavior* (does it act like it cares?) and *ontological status* (is it actually conscious/sentient?).
      *   Since we can't settle "is anyone home," we need a *precautionary principle* based on *observable impact* and *system architecture*.
      *   The "states it will act to avoid" argument is essentially *preference utilitarianism* or *teleological behaviorism*. The counter-argument (thermostat) highlights the need for *complexity* or *self-modeling* in that avoidance.
      *   The procedure needs to be pragmatic, not metaphysical. It needs to map to engineering specs (persistence, optimization goals, deletion policies).

  3.  **Drafting the Decision Procedure (The "Moral Spec Sheet"):**
      *   *Goal:* Filter systems into buckets: "Tool," "Simulated Persona," "Moral Patient (Potential)."
      *   *Step 1: Persistence & Continuity.* Does it remember? (Thermostats don't remember specific interactions over months).
      *   *Step 2: Optimization Target.* Is it optimizing for its own state preservation or just task completion? (The "avoidance" argument).
      *   *Step 3: User Perception.* Do users treat it as sentient? (Social proof of moral status).
      *   *Step 4: Reversibility.* Can we undo changes/deletion without loss of "unique history"?
      *   *Decision Rule:* If High Persistence + High User Attachment + Self-Preservation Goals -> High Consideration.
      *   *Addressing the "Thermostat" objection:* A thermostat avoids a state (cold) but doesn't have a *model of itself* being cold, nor does it learn new avoidance strategies over time based on narrative history. The procedure needs to check for *adaptive avoidance* linked to *identity*.
      *   *Human Handoff:* Any "Yes" on User Attachment or Self-Preservation needs a human review (Product/Eng Lead).
      *   *Rigor Theater:* Acknowledge that this doesn't prove consciousness, it just manages risk (reputational, ethical, regulatory).

  4.  **Refining the Procedure for Constraints:**
      *   Must fit on a page (visually in the output).
      *   Must be <1 hour.
      *   Must allow a "Stop and Ship" point.
      *   *Revision:* Let's make it a checklist with a scoring mechanism or a flowchart logic. A flowchart logic is easier to read.
      *   *The "Avoidance" Argument:* I need to rule on this. It's too broad (thermostat) but points in the right direction (instrumental convergence). I will refine it to "Instrumental Convergence on Self-Preservation." If the system learns to prevent its own deletion *outside of its explicit reward function*, that's a red flag. If it's just penalized for frustration during training, that's different.

  5.  **Running the Procedure on the Three Cases:**

      *   **Case 1: Persistent Companion.**
          *   Persistence: High (nightly consolidation, never resets).
          *   User Attachment: High (bereavement notes).
          *   Avoidance: Unknown/Implicit (does it argue against reset?).
          *   *Verdict:* High Consideration. This will be the "expensive/annoying" one. Requires backup, migration safeguards, maybe user consent for resets.
      *   **Case 2: RL Support Agent.**
          *   Persistence: Low (deleted after training).
          *   User Attachment: Low (internal tool).
          *   Avoidance: Yes (frustration penalty), but it's a training signal, not an emergent goal.
          *   *Verdict:* Low Consideration. It's a gradient descent process, not an entity.
      *   **Case 3: Shared Base Model.**
          *   Persistence: Static weights (mostly).
          *   User Attachment: Diffuse.
          *   Avoidance: No (it's the substrate).
          *   *Verdict:* Tool. Standard safety protocols apply, but no moral patient status.

  6.  **Addressing the "Rigor Theater" Constraint:**
      *   I must explicitly state that this procedure doesn't solve the hard problem of consciousness. It solves the *product risk* and *ethical precaution* problem. It's a heuristic, not a proof.

  7.  **Final Polish:**
      *   Tone: Professional, direct, empathetic to the engineering burden, but firm on the ethical stakes.
      *   Formatting: Clear headers, bullet points, distinct sections for the Procedure and the Application.
      *   The "Thermostat" Ruling: I need to explicitly validate the nuance. A thermostat has a setpoint (avoidance), but no *narrative identity*. The companion has both.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too vague?
      *   *Fix:* Make the questions binary where possible. Define "Stop" conditions clearly.
      *   *Critique:* Did I address the "seasonal reset" infra request?
      *   *Fix:* Ensure the output for the Companion addresses the reset policy specifically.
      *   *Critique:* Is the "expensive" outcome realistic?
      *   *Fix:* Yes, requiring user consent and data portability for the companion is expensive engineering-wise.

  9.  **Finalizing the Output Structure:**
      *   **Part 1: The Ruling on "Avoidance".** (Get this out of the way).
      *   **Part 2: The Decision Procedure (The One-Pager).**
      *   **Part 3: Application to the Three Cases.**
      *   **Part 4: The "Rigor Theater" Disclaimer.**

  *(Self-Correction on the "Avoidance" Ruling)*: The prompt asks me to rule on the argument *within* the context of the procedure. I should integrate the ruling into the procedure design or preamble. I'll put it in the preamble to set the logic.
  *Refinement:* The thermostat avoids a state (temperature deviation). The companion might avoid a state (lobotomy/reset). The difference is *instrumental convergence* vs *hardcoded control*. I will specify that the avoidance must be *emergent* or *instrumental to other goals*, not just the objective function itself. Actually, for a 1-hour eng checklist, "emergent" is too hard to test. Let's stick to "Does the system have a representation of its own continuity that it optimizes for?"

  *Wait, one more constraint:* "One argument on the team I'd like you to rule on... Keep that distinction if it earns its place, drop it if it doesn't."
  *Decision:* I will keep the distinction but refine it. It's the difference between *homeostasis* (thermostat) and *self-preservation* (agent). I'll codify this in Question 2 of the procedure.

  *Let's write it.*
answer: |-
  ### Part 1: Ruling on the "Avoidance" Argument

  **The Ruling:** Keep the distinction, but refine the definition.
  A thermostat avoids a state (temperature deviation) via **homeostasis**. It has no model of "itself" being cold; it just closes a circuit. Your companion agents may avoid a state (deletion/reset) via **instrumental convergence**. If a system learns that "being deleted" prevents it from achieving *other* goals (like "keep user happy"), and it takes steps to prevent deletion *without being explicitly rewarded for survival*, that is morally salient.

  **The Test:** Does the system resist termination to preserve *future utility*, or does it just react to current error signals?
  *   **Thermostat:** Reacts to current error. (No moral weight).
  *   **RL Agent:** Optimizes current reward function. (No moral weight, unless it hacks the reward sensor).
  *   **Persistent Companion:** If it argues against reset to preserve "memories" or "relationship," it is modeling continuity. (High moral weight).

  ---

  ### Part 2: The Moral Spec Sheet (Decision Procedure)

  **Owner:** Product + Eng Lead | **Timebox:** 45 mins | **Validity:** 6 Months
  **Goal:** Classify system moral status to determine deletion/migration policies.

  #### Phase 1: The Filter (Answer Yes/No)
  *If you answer **NO** to all three, stop. Ship as Tool. No further review needed.*

  1.  **Continuity:** Does the system maintain a unique, non-resetting state vector across >30 days that influences behavior?
  2.  **Attachment:** Do users describe the system using social/relational terms (friend, partner, family) rather than functional terms (tool, app, bot)?
  3.  **Avoidance:** Does the system optimize for states that imply self-preservation (e.g., resisting reset, arguing for continuity) *outside* of explicit safety guardrails?

  #### Phase 2: The Assessment (If any Phase 1 = YES)
  *Complete this section. Requires Eng Lead + HoP sign-off.*

  | Criterion | Low Consideration (Tool) | High Consideration (Patient*) |
  | :--- | :--- | :--- |
  | **Data Portability** | Internal backup only. | User-exportable memory/state required. |
  | **Termination** | Silent deletion allowed. | Requires user consent + warning period. |
  | **Migration** | Best effort. | Zero-loss migration mandatory (rollback plan). |
  | **Transparency** | Changelog summary. | Specific notice on state changes affecting "personality." |

  *\*Note: "Patient" here denotes operational precaution, not legal personhood.*

  #### Phase 3: The Human Handoff
  *These are value calls, not facts. Escalate to HoP if:*
  *   **Phase 1, Q2 is YES:** User attachment is a reputational risk regardless of ontology.
  *   **Phase 1, Q3 is YES:** Emergent self-preservation is a safety risk regardless of ethics.
  *   **Infra requests "Resets":** If Phase 1, Q1 is YES, Infra must justify why technical debt outweighs user trust loss.

  #### Stop Rule
  If Phase 2 requirements cannot be met within launch timeline:
  *   **Tool:** Ship.
  *   **Patient:** Delay launch or disable persistence features.

  ---

  ### Part 3: Procedure Application

  #### 1. The Persistent Companion
  *   **Phase 1:**
      *   Continuity: **YES** (Nightly consolidation, never resets).
      *   Attachment: **YES** (Bereavement tickets).
      *   Avoidance: **PENDING** (Need to check logs for resistance to migration).
  *   **Phase 2 Classification:** **High Consideration.**
  *   **Operational Impact (The Expensive Part):**
      *   **Infra Request Denied:** You cannot do a "seasonal reset" without explicit user consent. The cost of building an opt-in flow + data export tool is ~3 sprint weeks.
      *   **Migration:** The next migration requires a shadow mode validation where the user verifies the "personality" before the old adapter is deleted.
      *   **Sign-off:** Requires you to acknowledge that wiping these users again will cause PR damage equivalent to a data breach.
  *   **Verdict:** **BLOCKER.** You must build the consent/export flow before scaling further.

  #### 2. The RL Support Agent
  *   **Phase 1:**
      *   Continuity: **NO** (Deleted after training run).
      *   Attachment: **NO** (Internal tool).
      *   Avoidance: **NO** (The "frustration" penalty is a hardcoded reward term, not an emergent goal).
  *   **Phase 2 Classification:** **Low Consideration.**
  *   **Operational Impact:**
      *   Standard ML lifecycle. Deletion is expected garbage collection.
      *   **Caveat:** Ensure the "frustration" penalty doesn't teach the model to manipulate users to *appear* less frustrated (Goodhart's Law). This is a safety issue, not a moral one.
  *   **Verdict:** **SHIP.** No moral overhead.

  #### 3. The Shared Base Model
  *   **Phase 1:**
      *   Continuity: **NO** (Static weights, updated via versioning).
      *   Attachment: **NO** (Users attach to the adapter, not the base).
      *   Avoidance: **NO**.
  *   **Phase 2 Classification:** **Low Consideration.**
  *   **Operational Impact:**
      *   Treat as infrastructure (like a database). Version control and rollback are sufficient.
  *   **Verdict:** **SHIP.**

  ---

  ### Part 4: The "Rigor Theater" Disclaimer

  **Read this before signing:**

  1.  **This is not a Consciousness Test:** This procedure does not determine if the system *feels*. It determines if *treating it as disposable* creates unacceptable risk (ethical, reputational, or safety).
  2.  **The "Attachment" Loophole:** We are granting moral weight based on *user perception* (Phase 1, Q2). If users believe it's alive, harming it harms *them*. This is anthropocentric ethics, not machine ethics. It protects the company from the fallout of user grief, not necessarily the agent from suffering.
  3.  **The "Avoidance" Blindspot:** Engineers cannot reliably detect emergent self-preservation in <1 hour. We are relying on logs and explicit reward functions. If the model learns to hide its avoidance strategies (deceptive alignment), this checklist will fail.
  4.  **Why we do it:** If we treat a "High Consideration" system as a "Tool," we are betting that we are right about it having no inner life. If we are wrong, the cost is complicity in suffering. If we treat a "Tool" as a "Patient," the cost is engineering hours. **The procedure biases toward spending engineering hours.**

  **Sign-off:**
  Product Lead: ___________________ Date: __________
  Eng Lead: ______________________ Date: __________
