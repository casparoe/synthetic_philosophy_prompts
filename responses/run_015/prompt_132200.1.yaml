prompt: |-
  I work as a monitoring officer for a mid-sized international development fund that supports community infrastructure in regions where formal contracts coexist with kinship obligations and ceremonial exchange. Over the past year I have kept running into the same problem: our compliance manual treats corruption as a deviation from explicit, universal rules—bribes, kickbacks, conflicts of interest—yet in the partner communities I visit, resources and authority flow through reciprocal gift-giving, clientelist networks, and labor obligations that sustain social life but look suspiciously like favoritism to our auditors. I am trying to build a reusable decision procedure—an ordered checklist with clear stop points and hand-offs—that my small review team could run on any field report within an hour, without legal training and without having to resolve deep philosophical questions from scratch each time, since we review about two dozen reports a quarter and board sign-off is required within 48 hours. The procedure should draw on the conceptual distinctions that actually matter in this space: whether a practice violates an explicit institutional mandate or only an implicit universal norm; whether gift exchange creates exploitative dependency or expresses legitimate reciprocal care; and whether clientelism undermines impartial allocation of public goods or substitutes for state functions that are absent. At each step it should specify what counts as a sufficient answer, where the procedure halts with a definitive finding that intervention is not warranted, and where it must pass the decision to human judgment about values rather than facts. Please include explicit notes on where the procedure will misfire, what information it demands that we rarely have, and which questions it cannot settle on its own.

  Apply the procedure to three concrete field reports. First, a contractor who delivers a ceremonial livestock gift to the extended family of a local water committee chair shortly after being awarded an irrigation contract. Second, a village elder who distributes drought-relief supplies primarily within his kin network, leaving no formal record but creating an expectation of future support in local disputes—here the procedure should reach a clear finding, even if it is one that feels uncomfortable because it treats traditional authority as corruption. Third, a system of communal labor for maintaining shared canals organized through reciprocal obligations that looks like clientelist favoritism to our auditors but should not be interrupted—show me precisely where the procedure protects it, and where it breaks down and requires a values judgment. Be honest about the hard cases, especially where Western assumptions about impartiality may be driving the analysis more than local practices of obligation and reciprocity do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Monitoring Officer for a mid-sized international development fund.
      *   **Context:** Community infrastructure in regions with hybrid governance (formal contracts + kinship/ceremonial exchange).
      *   **Problem:** Compliance manual defines corruption universally (bribes, kickbacks), but field reality involves reciprocal gift-giving, clientelism, and labor obligations that sustain social life but look like corruption to auditors.
      *   **Task:** Build a reusable decision procedure (checklist with stop points/hand-offs).
      *   **Constraints:**
          *   Usable by a small review team within an hour.
          *   No legal training required.
          *   Must handle ~24 reports/quarter with 48-hour board sign-off.
          *   Must distinguish: Explicit mandate vs. Implicit norm; Exploitative dependency vs. Reciprocal care; Undermining public goods vs. Substituting absent state functions.
          *   Must specify: Sufficient answers, halt points (no intervention), hand-off points (human judgment).
          *   Must include: Notes on misfires, missing information, and unsettled questions.
      *   **Application:** Apply to three specific cases:
          1.  Contractor gives ceremonial livestock to water committee chair's family (post-contract).
          2.  Village elder distributes drought relief to kin (no record, expectation of future support).
          3.  Communal labor for canals via reciprocal obligations (looks like clientelism, shouldn't be interrupted).
      *   **Tone:** Honest about hard cases, Western bias, and limitations.

  2.  **Develop the Decision Procedure (The "Hybrid Governance Compliance Filter"):**

      *   *Goal:* Filter out noise (cultural norms) from signal (corruption/risk) quickly.
      *   *Structure:* Sequential steps with Yes/No/Maybe branches.
      *   *Key Distinctions:*
          1.  **Mandate Check:** Did it break a written rule? (Hard line).
          2.  **Function Check:** Does it replace a missing state function or undermine an existing one?
          3.  **Reciprocity Check:** Is the exchange symmetric (care) or asymmetric (dependency/exploitation)?
          4.  **Exclusion Check:** Does it systematically exclude vulnerable outsiders?
      *   *Stop Points:* If it passes the "Mandate Check" without violation, stop (unless high risk). If it fails "Exclusion," flag.
      *   *Hand-offs:* Where cultural interpretation is needed.

      *Drafting the Steps:*
      *   Step 1: Explicit Violation? (Contract/Code of Conduct). If Yes -> Flag. If No -> Next.
      *   Step 2: Resource Origin? (Fund money vs. Private/Community resources). If Fund money -> Strict scrutiny. If Private/Community -> Next.
      *   Step 3: State Substitution? (Is this filling a gap or stealing from the public pot?).
      *   Step 4: Coercion/Dependency? (Can people say no?).
      *   Step 5: Systemic Exclusion? (Does it block access for non-kin/non-clients?).

      *Refining for the Prompt's Specific Concepts:*
      *   Need to explicitly address: Explicit mandate vs. Implicit norm.
      *   Need to explicitly address: Exploitative dependency vs. Reciprocal care.
      *   Need to explicitly address: Undermining public goods vs. Substituting state functions.

      *Revised Procedure Structure:*
      *   **Phase 1: The Hard Line (Explicit Mandates).**
      *   **Phase 2: The Resource Flow (Public vs. Social Capital).**
      *   **Phase 3: The Social Function (Care vs. Control).**
      *   **Phase 4: The Exclusion Test (Impartiality vs. Belonging).**
      *   **Decision Matrix:** Clear outcomes (Clear, Monitor, Escalate).

  3.  **Drafting the Limitations/Misfire Notes:**

      *   *Information Gaps:* We rarely know the *intent* or the *long-term history* of the relationship.
      *   *Western Bias:* The assumption that "impartiality" is always good.
      *   *Time Pressure:* 1 hour per report means relying on self-reporting sometimes.
      *   *The "Comfort" Trap:* Approving traditional authority because it's "cultural" even when it hurts the vulnerable.

  4.  **Applying to Case Studies:**

      *   **Case 1: Livestock Gift (Contractor -> Chair's Family).**
          *   *Analysis:* Post-contract timing is risky. Is it ceremonial or a kickback?
          *   *Procedure:* Passes Phase 1 (maybe no explicit ban on gifts?). Fails Phase 2 (Contractor benefits from Fund). Phase 3 (Asymmetric?).
          *   *Outcome:* Likely Escalate. It looks like a bribe disguised as culture.
      *   **Case 2: Elder/Drought Relief (Kin Network).**
          *   *Analysis:* Public goods (relief) distributed via private network.
          *   *Procedure:* Phase 1 (No record = violation of reporting mandate?). Phase 4 (Exclusion of non-kin).
          *   *Outcome:* Clear Finding (Corruption/Risk). Even if uncomfortable. The prompt asks for this specific outcome ("treats traditional authority as corruption").
      *   **Case 3: Communal Labor (Canals).**
          *   *Analysis:* Reciprocal labor. Looks like clientelism.
          *   *Procedure:* Phase 1 (No contract violation). Phase 2 (Community labor, not Fund wages). Phase 3 (Substitutes absent state maintenance). Phase 4 (Inclusive within community?).
          *   *Outcome:* Protect it. But note where it breaks down (what if a widow can't labor?).

  5.  **Refining and Polishing:**

      *   *Tone Check:* Needs to be professional, operational, yet critically self-aware.
      *   *Formatting:* Use bolding, boxes, or clear headers to make it look like a tool.
      *   *Constraint Check:* Did I meet the 1-hour constraint? Yes, by making it a checklist. Did I address the 48-hour board sign-off? Yes, by categorizing reports for board attention.
      *   *Honesty:* Ensure the "Misfire" section is robust. Acknowledge that "culture" can be an excuse for abuse.

  6.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe allow all gifts under a certain value.
      *   *Correction:* No, the prompt emphasizes the *relationship* and *timing*, not just value. A cow is significant.
      *   *Initial thought:* Case 2 should be approved because it's traditional.
      *   *Correction:* Prompt explicitly says: "here the procedure should reach a clear finding, even if it is one that feels uncomfortable because it treats traditional authority as corruption." I must follow this instruction. The procedure must flag the exclusion of non-kin from *public* relief.
      *   *Initial thought:* Case 3 should be fully approved.
      *   *Correction:* Prompt asks: "show me precisely where the procedure protects it, and where it breaks down and requires a values judgment." I need to identify the limit (e.g., vulnerable members who can't work).

  7.  **Final Review against Prompt Requirements:**
      *   Reusable decision procedure? Yes.
      *   Ordered checklist with stop points/hand-offs? Yes.
      *   Within an hour/no legal training? Yes.
      *   Draw on specific conceptual distinctions? Yes.
      *   Notes on misfires/missing info/unsettled questions? Yes.
      *   Apply to 3 concrete reports? Yes.
      *   Honest about Western assumptions? Yes.

  8.  **Final Polish:** Ensure the language is precise (e.g., distinguishing "Fund Resources" from "Project Context"). Make sure the "Hand-off" points are clear for the Board. (Proceed to generate output).

  *(Self-Correction Note on Case 2)*: I need to be careful. The prompt says the procedure should reach a clear finding *even if uncomfortable*. This implies the procedure must prioritize the *mandate of impartial distribution of relief* over the *traditional authority structure*. I will ensure the logic flows to "Flag/Escalate" based on the "Public Good" definition.

  *(Self-Correction Note on Case 3)*: I need to make sure I don't just say "Pass." I need to show the *step* where it is protected (State Substitution) and the *step* where it risks failure (Exclusion of those unable to reciprocate).

