      *   *Triangulation:* Meaning arises from the causal interaction between two creatures and a shared world. This is crucial.
      *   *Conceptual Schemes:* Davidson famously argues *against* the possibility of radically different conceptual schemes ("On the Very Idea of a Conceptual Scheme"). If we can interpret them, they share enough of our scheme. If we can't, they aren't interpretable.
