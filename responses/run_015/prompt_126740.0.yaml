answer: |-
  This is a fascinating and sophisticated interdisciplinary puzzle. You are essentially trying to bridge **classical Indian epistemology** (which is soteriological and action-oriented) with **modern epistemic logic** (which is structural and mathematical).

  Your intuition is sharp, but you are running into a category mismatch. The confusion isn't necessarily a failure of your grasp of Nyāya or Game Theory, but rather that Nyāya does not model "common knowledge" as a distinct epistemic *state* generated by a specific *pramāṇa*.

  Here is a breakdown of where the mapping holds, where it breaks, and how Nyāya scholars (specifically the Navya-Nyāya tradition and modern interpreters like B.K. Matilal) would likely address the "gap."

  ### 1. The Category Error: Process vs. Structure
  *   **Pramāṇa** is a *process* or *instrument* of individuated cognition (*pramā*). It answers: "How did this specific knowledge arise in this specific mind?"
  *   **Common Knowledge** is a *logical structure* of knowledge distribution across a set of agents. It answers: "What is the recursive relationship of knowledge between Agent A and Agent B?"

  Nyāya is primarily concerned with the validity of the cognition in the individual agent leading to successful action (*pravṛtti-sāmarthya*). It does not typically formalize the infinite recursion ($K_a K_b K_a p...$) required for common knowledge.

  ### 2. Analyzing Your Pramāṇa Critique
  Your assessment of the first three is largely correct within a strict Nyāya framework:

  *   **Pratyakṣa (Perception):** You are right. *Mānasa-pratyakṣa* (mental perception) allows me to know my own knowledge states, but I cannot perceive your mind. I cannot perceive "that you know."
  *   **Anumāna (Inference):** I can infer you know something based on your behavior (e.g., you move your pawn, so you know the rules). However, Nyāya inference is generally finite. Generating an infinite chain of "I know that you know that I know" via inference is computationally impossible for a human mind, and Nyāya is psychological realism.
  *   **Upamāna (Comparison):** This is about naming/categorization based on similarity. It doesn't help with epistemic recursion.

  ### 3. The Śabda Problem (The Core Issue)
  Your hesitation about *Śabda* (Testimony) is the crux of the problem.
  *   **Standard View:** *Śabda* requires an *āpta* (trustworthy person/expert). In a symmetric coordination game (like driving on the left vs. right), there is no "expert." We are peers.
  *   **The Nyāya Fix:** Nyāya distinguishes between *pauruṣeya* (human) and *apauruṣeya* (non-human/Vedic) testimony, but more importantly, it relies on **Saṃketa (Linguistic Convention)**.
      *   For *śabda* to work, there must be a pre-existing *saṃketa* (agreed-upon relation between word and meaning).
      *   In a coordination game, the "rules of the game" function as a *saṃketa*.
      *   **Crucial Point:** When a rule is publicly announced (e.g., a traffic light turns green, or a referee blows a whistle), Nyāya would treat this as *śabda* (if linguistic) or *pratyakṣa* (if a visual signal) that is **publicly accessible**.

  **Does this solve Common Knowledge?**
  If a public signal occurs:
  1.  I perceive it (*pratyakṣa*).
  2.  I infer you perceive it (*anumāna* based on shared location/senses).
  3.  I infer you infer I perceive it.

  Nyāya stops here. It assumes **symmetry of cognitive apparatus**. If we are both rational agents (*buddhimat*), and the signal is public, we both acquire the knowledge. The "commonality" is guaranteed not by a fifth *pramāṇa*, but by the **shared causal ground** (*sādhāraṇa kāraṇa*).

  ### 4. The "Fifth Pramāṇa" Myth
  You mentioned reading about a fifth *pramāṇa* like *pratibhā* or intersubjective *saṃketa*.
  *   **Pratibhā:** Usually associated with the Grammarian (Vyākaraṇa) school (Bhartṛhari) or Mīmāṃsā. It refers to intuitive flash or immediate understanding of meaning. It is not a standard Nyāya *pramāṇa*, nor does it solve intersubjectivity.
  *   **Saṃketa:** This is **not a pramāṇa**. It is a *condition* for *śabda*. It is the convention itself.
  *   **Arthāpatti (Presumption):** Mīmāṃsā adds this (e.g., "Devadatta is not home, but he is alive, therefore he must be outside"). Some modern scholars try to map this to abductive reasoning, but it doesn't solve the common knowledge recursion.

  **Where did you read this?**
  It is highly likely you encountered a **modern reconstruction**. Contemporary philosophers of Indian logic (like **B.K. Matilal**, **J.N. Mohanty**, or **Ganeri**) often discuss Nyāya in light of Western epistemic logic. They might propose that *saṃketa* functions *like* a common knowledge generator, but they wouldn't claim classical Nyāya posited it as a fifth *pramāṇa*.

  ### 5. Resolving the Coordination Gap
  If Nyāya doesn't have a specific tool for infinite recursion, how does it handle coordination?

  **A. Loka-Siddha (Established by the World)**
  Nyāya often appeals to *loka-vyavahāra* (public practice). If everyone drives on the left, that practice is *loka-siddha*. You don't need to know that everyone knows; you just need to know that this is the *practice*. Knowledge of the practice is gained via *śabda* (tradition) or *anumāna* (observation of behavior).

  **B. The "Public Announcement" Logic**
  In Epistemic Game Theory (e.g., David Lewis's *Convention*), common knowledge is often generated by a **public signal**.
  *   **Nyāya Mapping:** The public signal is perceived (*pratyakṣa*). The fact that it is public allows for the inference (*anumāna*) that others perceived it.
  *   **The Gap:** Nyāya doesn't require the *infinite* recursion for successful action. It requires **sufficient certainty for action** (*niścaya*). If I see the light is green, and I see you looking at the light, I have sufficient *niścaya* to proceed. I don't need logical infinity; I need pragmatic sufficiency.

  ### 6. Where the Confusion Lies
  You are correct to feel a gap, but it lies in the **requirements of the models**, not necessarily in your understanding.

  1.  **Game Theory Requirement:** Strict Common Knowledge (infinite recursion) is often required to prove equilibrium stability mathematically.
  2.  **Nyāya Requirement:** *Pramā* (Valid Cognition) leading to *Pravṛtti* (Successful Action).
  3.  **The Mismatch:** Nyāya is pragmatic. If the inference "He knows the rule" works to coordinate action, it is valid. It does not worry about the skeptical regress of "Does he know that I know..." unless that regress blocks action.

  ### Recommendation for Further Reading
  If you want to pursue this mapping, look into the work of **Bimal Krishna Matilal**.
  *   Specifically, **"Epistemology, Logic, and Grammar in Indian Philosophical Analysis"**.
  *   Matilal explicitly bridges Nyāya epistemology with Western analytic philosophy and game-theoretic concepts (like speech acts and convention).
  *   He discusses how *śabda* and *saṃketa* function as social epistemology without needing a "fifth *pramāṇa*."

  **Summary Verdict:**
  There is no classical fifth *pramāṇa* for intersubjectivity. The "bootstrap" is handled by **Śabda** (grounded in public **Saṃketa**) combined with **Anumāna** (inferring shared perception). The infinite recursion of game theory is a mathematical idealization that Nyāya bypasses via **pragmatic sufficiency** (*arthakriyākāritva*). You aren't misunderstanding Nyāya; you are asking it to solve a problem (infinite logical recursion) that it considers irrelevant to the goal of knowledge (successful action).

  *One final note:* If you saw a reference to "intersubjective saṃketa" as a *pramāṇa*, it might be from a very specific contemporary paper attempting to "update" Nyāya for social epistemology (perhaps by someone like **Jonardon Ganeri** in *The Lost Self* or *Attention to Meaning*), but treat that as a modern philosophical innovation, not classical doctrine.
