      *(Self-Correction during drafting)*: I need to be careful not to just side with Priya. The user's deflationary view is philosophically robust (often called the "deflationary account"). I need to show where *their* specific argument leaks, not just say "Priya is right." The leak is in the definition of "belief" and the "monitoring" required for avoidance.

