answer: |-
  **EXAMINATION PAPER**

  **Module:** Blame and the Reactive Attitudes
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1**

  Standard accounts of "standing to blame" focus on hypocrisy: the blamer lacks standing if they are guilty of the same transgression. However, consider the following cases of the **"Unqualified Blamer"**:

  1.  **The Saint:** Someone who has never been tempted by the vice they blame you for and genuinely cannot imagine committing it.
  2.  **The Beneficiary:** Someone who quietly benefits from the structural arrangement that made your wrongdoing the path of least resistance.
  3.  **The Manager:** Someone who enforces a rule strictly downward but not upward (without necessarily violating the rule themselves).
  4.  **The Justified Past Wrongdoer:** Someone who did exactly what they blame you for, but was fully justified in doing so at the time.

  In these cases, the blamer is not hypocritical in the standard sense, yet the reply "You are in no position to blame me" retains some grip.

  Write an essay addressing the following:
  1.  Do these cases reveal a failure of *standing* (a normative authority to hold responsible), or are they distinct phenomena (e.g., unfairness, epistemic limitation, or comparative status)? If they are standing failures, what is the unifying condition?
  2.  **Sub-question (a):** What is the nature of this failure? Is blame without standing *infelicitous* (analogous to an assertion made without knowledge), or is it a *further wrong* the target may properly resent? How does the target's appropriate response help us decide?
  3.  **Sub-question (b):** Can one lack standing to blame *oneself*? If standing tracks one's record, does unrepentant self-blame become defective? Is this a reductio of the standing condition, or a genuine feature of moral agency?

  ***

  **MODEL ANSWER**

  The "Unqualified Blamer" cases suggest that standard hypocrisy accounts are too narrow. Standing is not merely about non-violation of norms; it is about *moral solidarity*. To have standing, one must participate in the shared vulnerability that makes the norm binding. The Saint, Beneficiary, Manager, and Justified Wrongdoer all fail this condition, though in different ways. Therefore, these are genuine standing failures, unified by a lack of shared moral risk.

  Regarding the nature of the failure (Sub-question a), we must distinguish between infelicity and wrongdoing. The "assertion analogy" suggests that blaming without standing is like asserting without knowledge: the content might be true (the target *is* blameworthy), but the speech act is defective. However, this underestimates the reactive attitudes. Blame is not merely constative; it is a demand for recognition. When an Unqualified Blamer demands this recognition, they implicitly claim a moral authority they do not possess. This is not just a misfire; it is an insult. It treats the target as a subordinate in a moral hierarchy that does not exist. We know this because the target's appropriate response is not merely to dismiss the blame (as one dismisses a false assertion) but to feel *resentment*. Resentment is a response to a wrong, not a mistake. If the target feels entitled to reject the blamer's demand with moral indignation, the blamer has committed a pro tanto wrong. Thus, lacking standing makes blame a wrongful exercise of power, not merely an infelicitous speech act.

  This leads to Sub-question (b): self-blame. If standing requires a clean record, unrepentant self-blame seems impossible, which sounds like a reductio. However, if standing is grounded in solidarity, self-standing is grounded in *diachronic identification*. To blame oneself, one must stand in a relation of authority to one's past self. This requires acknowledging that the past self was bound by norms the current self endorses. Unrepentant self-blame is indeed defective, but this is not a reductio; it is a category error. One cannot simultaneously repudiate a norm (via unrepentance) and invoke it to judge oneself. The defect in unrepentant self-blame is not that it lacks standing, but that it is incoherent. However, if we define standing as requiring *past compliance*, then yes, one loses standing to blame oneself. But this is the wrong metric. Standing to self-blame requires *current endorsement* of the norm violated, not past perfection. Therefore, one can have standing to blame oneself for past wrongs provided one currently acknowledges the norm's authority. The reductio only arises if we conflate standing with moral purity.

  The unifying condition for the Unqualified Blamer cases is thus the *absence of shared vulnerability*. The Saint lacks it because they are immune to temptation; the Beneficiary because they are insulated from the cost of compliance; the Manager because they claim exemption from the scope of the norm; the Justified Wrongdoer because their past action negates the "wrong" necessary for solidarity.

  The hardest objection concerns the **Justified Wrongdoer**. If they were justified, they did nothing wrong. Why do they lack standing to blame someone for doing the same thing unjustifiably? One might argue their justification grants them *more* authority. However, standing relies on the shared experience of falling short. If my past action was justified, I have not fallen short. I cannot claim solidarity with you based on a failure I did not commit. To blame you is to say, "We are both subject to this pressure, but you yielded." If I did not yield because I was justified, the "We" is false. I am not in the same boat. Thus, even justified past wrongdoing can erode the solidarity required for standing, though for different reasons than hypocrisy.

  In conclusion, the Unqualified Blamer lacks standing because they cannot claim the moral solidarity required to issue demands. This failure is a wrong, warranting resentment, not merely an infelicity. Self-blame remains possible but requires current normative endorsement rather than past purity. The machinery of standing holds, provided we understand it as authority derived from shared vulnerability rather than mere non-hypocrisy.

  ***

  **MARKING SCHEME (20 Marks Total)**

  **1. Diagnosis of the "Unqualified" Problem (4 Marks)**
  *   **Full Marks:** Clearly distinguishes these cases from standard hypocrisy. Identifies the core issue as a lack of moral authority/solidarity rather than simple inconsistency.
  *   **Typical Botch:** Treats the cases as just "hidden hypocrisy" without explaining why the standard definition fails to capture the nuance (e.g., The Saint).

  **2. Thesis on Standing vs. Distinct Phenomenon (4 Marks)**
  *   **Full Marks:** Takes a definitive stance on whether this is a standing issue or something else (e.g., unfairness). Defends the "Solidarity/Authority" view or a compelling alternative.
  *   **Typical Botch:** Hedges excessively ("It could be standing, or it could be unfairness...") without arguing for a unifying principle.

  **3. Analysis of Sub-question (a): Nature of the Failure (4 Marks)**
  *   **Full Marks:** Explicitly chooses between "infelicity" (assertion analogy) and "wrongdoing" (resentment). Uses the target's appropriate response (dismissal vs. resentment) as evidence.
  *   **Typical Botch:** Accepts the assertion analogy uncritically or fails to link the nature of the failure to the target's reactive attitude.

  **4. Analysis of Sub-question (b): Self-Blame and Reductio (4 Marks)**
  *   **Full Marks:** Addresses whether self-standing is possible. Resolves the "unrepentant self-blame" tension without accepting the reductio (e.g., by redefining the condition for self-standing).
  *   **Typical Botch:** Ignores the self-blame component or accepts the reductio as a fatal flaw of standing theories generally.

  **5. Engagement with the "Hardest Objection" (4 Marks)**
  *   **Full Marks:** Identifies a significant counter-argument (e.g., The Justified Wrongdoer or The Saint's virtue) and offers a reasoned concession or rebuttal.
  *   **Typical Botch:** Presents a straw-man objection or fails to acknowledge the tension in the "Justified" case specifically.

  *(Note: Marks are awarded holistically within each criterion. A paper that is exceptionally well-written but misses one criterion entirely cannot score above 16.)*
