answer: |-
  # Taxonomy of Positions on the Demandingness Objection

  **1. Does morality ever require an individual to bear a genuinely burdensome sacrifice?**

  *   **No**
      *   **Leaf:** Morality is bounded by personal integrity and reasonable cost. (Common-Sense Morality)

  *   **Yes**
      *   **2. What is the primary source of the conflict between moral duty and personal life?**
          *   **Case A:** The specific amount required in emergency cases is too high. *(Cost-Based)*
          *   **Case B:** The requirement to always maximize creates an endless obligation with no rest. *(Structure-Based)*
          *   **Case C:** The theory ignores the special value of personal relationships and projects. *(Prerogative-Based)*

          *   **3. How should the moral framework respond to this conflict?**
              *   **Option I:** Modify the criteria for right action (e.g., stop maximizing, add rules).
              *   **Option II:** Limit individual duty to supporting just institutions or collective schemes.
              *   **Option III:** Keep the high standard and view our discomfort as a moral failing or cognitive limitation.

              *   **Leaves:**

                  *   **From Case C + Option I:**
                      *   **Position:** **The Agent-Centered Prerogative View.**
                      *   **Description:** Morality allows agents to sometimes prioritize their own interests even when doing so does not maximize the good, acknowledging that personal projects have independent weight.

                  *   **From Case B + Option I:**
                      *   **Position:** **The Scalar Consequentialist Position.**
                      *   **Description:** There is no binary line between "right" and "wrong"; actions are simply better or worse, removing the pressure to reach a specific stopping point.

                  *   **From Case A or B + Option II:**
                      *   **Position:** **The Institutional-Division Revisionist.**
                      *   **Description:** Individuals are only required to do their fair share within a just institutional framework, rather than maximizing good directly in a non-ideal world.

                  *   **From Case A, B, or C + Option III:**
                      *   **Position:** **The Evolutionary/Cognitive Calibration View.**
                      *   **Description:** Demandingness is a feature revealing our moral cognition is calibrated for small-group cooperation rather than global impartiality; we must revise our expectations of agency to match the true moral standard.

                  *   **From Case C + Option II:**
                      *   **Position:** **[Unoccupied/Rarely Defended] The Institutional-Prerogative Hybrid.**
                      *   **Diagnosis:** **Incoherent / Category Error.** This position suggests that the crowding-out of personal relationships (Case C) can be solved by assigning the burden to institutions (Option II). However, institutions cannot cultivate personal relationships or pursue personal projects on behalf of individuals. While institutions can protect the *space* for relationships, they cannot substitute for the intrinsic partiality that defines them, making this a conceptual mismatch rarely argued for in the literature.
