answer: |-
  Here is an adjudication of the exchange between Alex and Jordan, evaluated move by move, followed by an overall assessment and an identification of the theoretical blind spots in their debate.

  ### Move-by-Move Adjudication

  **1. Alex's Opening Claim**
  *Rating: **Mostly Right** (Pragmatically)*
  **Justification:** Alex correctly identifies that in natural language, particularly in high-stakes political deliberation, the boundary between semantic content and pragmatic force is porous. While standard logic treats the antecedent of a conditional as unasserted, speech act theory acknowledges that speakers often use conditionals to signal commitment without incurring the dialectical burden of a direct assertion (a strategy sometimes called *paralipsis* or *insinuation*). Given that the consequent ("enacting this ordinance is unjust") entails the antecedent ("tearing down... is unjust"), the conditional is rhetorically vacuous unless it functions to reinforce the antecedent. Alex is right that the context makes a purely hypothetical reading implausible, even if it is logically permissible.

  **2. Jordan's Objection**
  *Rating: **Technically Right** (Semantically)*
  **Justification:** Jordan is correct on the strict semantics of the conditional operator. In truth-conditional semantics, asserting "If P, then Q" does not entail asserting "P." Jordan rightly defends the distinction between the *content* of a proposition and the *attitude* of the speaker toward that content. This distinction is necessary to explain how we can reason about moral premises we do not endorse (e.g., "If utilitarianism is true, then..."). However, Jordan is slightly naive in dismissing the "emotional invitation" as mere embellishment; in normative discourse, the affective tone often constitutes part of the meaning (as expressivists argue), not just decorative pragmatics.

  **3. Alex's Counter-Objection**
  *Rating: **Mistaken** (Argumentatively)*
  **Justification:** Alex's claim that Jordan's view makes moral deliberation "impossible" or leads to accusations of hypocrisy is a slippery slope argument that conflates *logical permission* with *social norm*. One can employ a working hypothesis in deliberation without being hypocritical, provided one signals the hypothetical status (e.g., "For the sake of argument..."). Alex mistakes the *capacity* to suspend judgment (which Jordan defends) for an *obligation* to deceive. Furthermore, this is a practical objection to a semantic claim; even if Jordan's semantics made deliberation awkward, it wouldn't necessarily make the semantics false.

  **4. Jordan's Counter-Counter**
  *Rating: **Clearly Right** (Philosophically)*
  **Justification:** Jordan successfully isolates the core philosophical error in Alex's position: conflating logical form with psychological commitment. The analogy to mathematics (reductio ad absurdum) is apt; one can assume a premise to test its consequences without believing it. In normative ethics, this is standard procedure (e.g., "Even if we grant your premise that life begins at conception..."). Jordan correctly maintains that semantic theory must account for the ability to embed normative terms without endorsing them, or else we cannot explain moral disagreement or conditional reasoning.

  ### Overall Adjudication

  **Jordan is more right overall.**

  While Alex captures the *rhetorical reality* of the specific zoning hearing (where the councilor likely did believe the antecedent), Jordan provides the more robust *theoretical framework*. Alex's position risks collapsing the distinction between what is said and what is implicated, which would make it difficult to explain how we reason about moral views we reject. Jordan's defense of the logical independence of the antecedent preserves the possibility of complex moral deliberation. Alex's second move (the hypocrisy objection) significantly weakens their overall standing by relying on a pragmatic slippery slope rather than a semantic argument.

  ### What Both Interlocutors Are Missing

  Both candidates are operating within a rigid **Semantics vs. Pragmatics dichotomy** that obscures how embedded normative language actually functions in public deliberation. Specifically, they are missing two key concepts:

  1.  **Conversational Implicature and Commitment (Brandom/Grice):** They treat "commitment" as a binary psychological state (belief vs. no belief). In inferentialist accounts of discourse (e.g., Robert Brandom), asserting a conditional undertakes a *public commitment* to the inference, regardless of private psychological belief. The councilor isn't just expressing an emotion (Alex) or stating a truth condition (Jordan); she is licensing a specific inference for the public record. The debate should be about *discursive commitment*, not just psychological endorsement.
  2.  **The Tautological Structure of the Utterance:** Both miss that in this specific case, the antecedent and consequent are co-extensive. Enacting the ordinance *just is* tearing down the garden. Therefore, the statement is logically equivalent to "If P, then P." In rhetoric, asserting a tautological conditional is a known device for asserting the antecedent *without* opening it to direct challenge. Alex senses this but attributes it to "emotional force"; Jordan ignores it to defend general logical form. Neither analyzes the specific *entailment relationship* between the antecedent and consequent, which is what makes this specific conditional function as an assertion rather than a hypothesis.
