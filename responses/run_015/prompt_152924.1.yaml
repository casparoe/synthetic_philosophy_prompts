          4.  Concrete cases/arguments for each crux with predictions.
          5.  Flag verbal vs. substantive disagreements.
          6.  Self-reflection: What would change my mind? Where is the framing weakest?
      *   **Tone:** Philosophical, precise, collaborative but acknowledging deep divergence.

  2.  **Deconstruct the Camps:**
