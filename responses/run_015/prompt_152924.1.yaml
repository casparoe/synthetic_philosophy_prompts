      *   **Expressive Refusal (ER):** Focus on integrity, symbolic action, complicity in unjust structures, rejection of the "lesser evil" framing as legitimizing a broken system, causal inefficacy negates duty.

  3.  **Drafting Section 1: Agreed Claims:**
