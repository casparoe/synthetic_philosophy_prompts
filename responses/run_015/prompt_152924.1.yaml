  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to use their specific language.
      *   *ID:* "Derivative duty," "Expected harm," "Aggregate efficacy."
      *   *ER:* "Symbolic complicity," "Legitimization," "Integrity."
      *   *Topics:* Nature of the vote, Source of obligation, Meaning of abstention.

  5.  **Drafting Section 3: The Cruxes:**
      *   *Crux 1:* Symbolic Contamination vs. Causal Contribution. Can you be dirty without making a difference?
      *   *Crux 2:* Collective Responsibility without Individual Efficacy. Does the "we" impose a "you"?
      *   *Verbal Disagreement:* "Duty." ID means "obligation to optimize outcomes." ER means "obligation to maintain moral purity." This is substantive, but partly definitional. Let's look for *purely* verbal. Maybe "Complicity." ID sees it as causal contribution to harm. ER sees it as association with evil.

  6.  **Drafting Section 4: Concrete Cases/Predictions:**
      *   *Case for Crux 1:* A boycott vs. a strike. Or a specific historical election. Let's use a "tainted donation" analogy.
      *   *Case for Crux 2:* Climate change individual action vs. corporate regulation.
      *   *Predictions:* ID predicts ER's purity leads to worse outcomes. ER predicts ID's participation leads to stagnation/entrenchment.

  7.  **Drafting Section 5: Self-Reflection (The "Meta" Requirement):**
      *   *Change Mind:* Empirical evidence on whether abstention actually pressures reform vs. ceding power.
      *   *Weakest Framing:* The assumption that "lesser evil" is obvious. The assumption that the two camps are mutually exclusive (strategic voting *can* be expressive).

  8.  **Review and Refine:**
