  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Chair of an ethics consultation subcommittee at a 300-bed community hospital. Healthcare proxy for father with Lewy body dementia.
      *   **Goal:** Replace current conflict resolution procedure regarding Advance Directives (AD) vs. Current Patient Expression (CPE).
      *   **Output Needed:** A decision procedure (algorithm/flowchart style), *not* an essay. Must output: Honor Document, Override Document, or Escalate.
      *   **Key Features:** Ordered questions with thresholds. Mark early termination points. Mark "handoff points" (values questions for humans).
      *   **Four Required Distinctions:**
          1.  *Counterfactual Unawareness:* Did the AD actually address *this* specific situation, or is it an abstraction?
          2.  *Asymmetric Scrutiny:* Audit the AD's provenance just as strictly as the patient's capacity.
          3.  *Graded Authenticity:* Move beyond binary capacity. Weight the CPE based on consistency, context, etc.
          4.  *Rationale Falsification:* If the AD's stated reason is factually false now, does the AD stand?
      *   **Two Structural Constraints:**
          1.  *Reversibility:* Prefer the reversible error.
          2.  *Law:* Acknowledge legal presumptions (AD is binding) and specify exposure/notifications for overriding.
      *   **Test Cases:**
          1.  Bipolar I woman (41yo) refusing lithium/ECT (AD matches refusal, but new reason: violin career). Proxy agrees with current refusal.
          2.  Dementia man (74yo) with hip fracture. AD refuses "heroic measures/no hope." Surgery/ventilation likely restores baseline. Son says AD rules; Daughter says context matters. Patient non-verbal but happy.
          3.  Alzheimer's woman (68yo). AD refuses treatment to spare daughter Anna. Anna is dead. Patient currently wants treatment. User expects pushback here because AD is specific/handwritten.
      *   **Failure Section:** Honest assessment of where the procedure fails (theater, unsolvable cases, specific hard cases like Ulysses contracts).
      *   **One-Page Version:** Chart-note form for 2 a.m. hospitalist.

  2.  **Deconstruct the Ethical & Legal Landscape:**

      *   *Legal Baseline:* ADs are presumptively binding for incapacitated patients. Overriding them carries legal risk (battery, negligence).
      *   *Ethical Tension:* Precedent Autonomy (Dworkin) vs. Critical Interests/Current Experiential Interests (Dresser/Robertson).
      *   *Clinical Reality:* 2 a.m. calls need clarity, not philosophy. Documentation protects the clinician.
      *   *The "Handoff":* The procedure must identify where clinical facts end and value judgments begin. The algorithm can't make the value judgment; it flags it for the human (Attending/Proxy/Ethics).

  3.  **Drafting the Decision Procedure (The Core):**

      *   *Structure:* Step-by-step logic gates.
      *   *Step 1: Urgency & Reversibility.* (Safety first). Is this an emergency? Can we wait?
      *   *Step 2: Capacity/Authenticity (Graded).* Not just "yes/no." How strong is the current voice?
      *   *Step 3: Directive Provenance (Asymmetric Scrutiny).* How strong is the past voice?
      *   *Step 4: Counterfactual Unawareness.* Does the AD fit *this* facts?
      *   *Step 5: Rationale Falsification.* Is the "why" of the AD broken?
      *   *Step 6: The Handoff/Decision.* Weighing the scores.
      *   *Legal Warning:* Explicit step for overriding.

  4.  **Developing the Four Distinctions within the Steps:**

      *   *Counterfactual Unawareness:* Put this in Step 4. Question: "Is the clinical reality materially different from the scenario envisioned?"
      *   *Asymmetric Scrutiny:* Put this in Step 3. Question: "Was the AD informed? Specific? Or a boilerplate form?"
      *   *Graded Authenticity:* Put this in Step 2. Score the current expression (Consistency, Reasoning, Affect).
      *   *Rationale Falsification:* Put this in Step 5. Question: "If the stated reason is false, does the preference remain?"

  5.  **Running the Test Cases:**

      *   *Case 1 (Bipolar/Violin):*
          *   Capacity: Fluctuating, but "unusually lucid."
          *   AD: Specific (lithium/ECT).
          *   New Info: Violin career (tremor).
          *   Proxy: Agrees with *current* self.
          *   *Result:* Likely Override/Escalate. The *reason* for refusal changed based on new life context (career) the AD didn't weigh. Proxy alignment helps.
      *   *Case 2 (Dementia/Hip):*
          *   Capacity: None.
          *   AD: "No hope of recovery."
          *   Reality: High hope of recovery to baseline.
          *   *Result:* Honor Document (technically) but likely Override via "Counterfactual" clause. The condition "no hope" isn't met. This is a "Honor Document" outcome because the document *allows* this treatment by exclusion. Wait, AD says "refuse... where no hope." If there *is* hope, the refusal doesn't trigger. So, Treat.
      *   *Case 3 (Alzheimer's/Anna):*
          *   Capacity: Moderate (can express desire).
          *   AD: Handwritten, specific.
          *   Reason: "Spare Anna."
          *   Reality: Anna dead. Caregiver funded.
          *   Current Wish: Live.
          *   *Result:* Override. Rationale Falsification. The core condition for the refusal is gone. User expects pushback, so the procedure must be firm here.

  6.  **Drafting the Failure Section:**

      *   Be cynical but accurate.
      *   "Theater": Documentation of "discussion" that was actually a decree.
      *   "Unsolvable": Fluctuating capacity, non-verbal distress, conflicted proxies (beneficiaries).
      *   "Ulysses": When the AD *predicts* resistance (psychiatric).

  7.  **Drafting the One-Pager:**

      *   Needs to be check-box style.
      *   Fit on a single page.
      *   Clear "Stop/Call" points.

  8.  **Refining the Tone:**

      *   Professional, direct, clinically grounded.
      *   Acknowledge the user's expertise (they know the philosophy).
      *   Avoid platitudes.
      *   Respect the legal constraints (don't advise illegal acts, but map the risk).

  9.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is Step 2 too subjective?
      *   *Fix:* Add specific markers for "Graded Authenticity" (e.g., repeated x3, consistent with affect).
      *   *Critique:* Case 2 logic.
      *   *Fix:* Ensure the distinction between "Refusal of Treatment" vs "Refusal of Treatment *under Condition X*." If Condition X is false, the refusal is void.
      *   *Critique:* Legal exposure.
      *   *Fix:* Make sure the "Override" path explicitly requires Risk Management/Legal notification.
      *   *Critique:* User's specific constraint on Case 3.
      *   *Fix:* Ensure the procedure explicitly flags "Rationale Falsification" as a valid ground for overriding even a handwritten AD.

  10. **Final Polish:** Check against all constraints in the prompt. (4 distinctions, 2 constraints, 3 cases, failure section, 1-pager).

  *(Self-Correction on Case 1)*: The prompt says she is *now* manic. Mania usually impairs capacity. However, the proxy agrees with the *current* refusal. This is a "Proxy vs AD" conflict essentially, mediated by the patient's current voice. The procedure needs to handle the "Proxy aligns with Current Self against Past Self" scenario.
  *(Self-Correction on Case 3)*: The user says "I expect my colleagues will expect it too [that the AD is conclusive]... if your procedure says otherwise... show the work." I need to be very clear on *why* the AD fails here (Rationale Falsification).

  Let's build the procedure.

  *   *Name:* The Asymmetric Scrutiny Protocol (ASP).
  *   *Flow:* Triage -> Authenticity -> Provenance -> Fit -> Rationale -> Decision.

  *   *Legal Note:* I am an AI, not a lawyer. I must frame the legal advice as "institutional policy alignment" rather than legal counsel, but within the context of the prompt's request for a procedure *for* a hospital committee. I will frame it as "Compliance Check."

  *   *Formatting:* Use bolding, boxes, and clear headers to make it scannable.

  *   *Failure Section:* Keep it stark.

  *   *One-Pager:* Condense the logic into a checklist.

