answer: |-
  # The Asymmetric Scrutiny Protocol (ASP)
  **Version 1.0 | For Ethics Subcommittee & Bedside Use**

  ## PURPOSE
  To resolve conflicts between a valid Advance Directive (AD) and a patient's current expression (CE) when the two diverge. This procedure treats the AD not as a static command but as a testimony requiring evidentiary weight, equal to the testimony of the present patient.

  ## DECISION PROCEDURE

  ### STEP 1: TRIAGE & REVERSIBILITY (Safety Gate)
  *Goal: Prevent irreversible harm while assessment occurs.*

  1.  **Is the situation an immediate life-threatening emergency?**
      *   **YES:** Treat to stabilize. **Terminate.** (Document: "Emergency stabilization per standard of care; ethical assessment pending.")
      *   **NO:** Proceed to Step 2.
  2.  **Is the proposed action reversible?**
      *   **Treatment (e.g., antibiotics, trial of dialysis):** Reversible.
      *   **Withholding/Withdrawal (e.g., DNR, stopping nutrition):** Irreversible (death).
      *   **Rule:** If the decision is irreversible, the threshold for overriding the AD must be *higher*. If the decision is reversible, the threshold for honoring the CE is *lower*.
      *   **Action:** Mark the "Reversibility Bias" on the chart. If irreversible, default to *Status Quo* until Step 6 is complete.

  ### STEP 2: GRADED AUTHENTICITY (Current Voice Audit)
  *Goal: Assign weight to the Current Expression (CE) without relying on a binary capacity finding.*

  **Assess the CE against these four markers. Assign 1 point for each "Yes."**
  1.  **Consistency:** Has the patient expressed this preference >3 times over >24 hours to different questioners?
  2.  **Contextual Tracking:** Does the preference change when the clinical context is explained (e.g., "If this pain could be fixed, would you still refuse?")?
  3.  **Affect Alignment:** Does the emotional valence match the statement (e.g., not smiling while describing a wish to die, unless culturally normative)?
  4.  **Reasoning:** Can the patient articulate a reason, even if simple (e.g., "I'm tired," "I want to see my grandson")?

  *   **Score 0-1 (Low Weight):** CE is treated as symptom/noise. **AD Presumption Holds.** Proceed to Step 3.
  *   **Score 2-3 (Moderate Weight):** CE requires substantive rebuttal. **Proceed to Step 3.**
  *   **Score 4 (High Weight):** CE creates a rebuttable presumption against the AD. **Proceed to Step 3.**
  *   **HANDOFF POINT:** If the patient is non-verbal, score is 0. If the patient is verbal but score is 0-1, the human decision-maker must determine if "behavioral distress" counts as a CE. *Document the justification for counting or ignoring behavior.*

  ### STEP 3: DIRECTIVE PROVENANCE (Past Voice Audit)
  *Goal: Apply asymmetric scrutiny to the AD. A boilerplate form weighs less than a specific narrative.*

  **Assess the AD against these three markers. Assign 1 point for each "Yes."**
  1.  **Specificity:** Does the AD name the specific intervention now proposed (e.g., "ventilator" vs. "heroic measures")?
  2.  **Informed Context:** Is there evidence the signer had experienced the condition or setting (e.g., prior ICU stay, healthcare worker) when signing?
  3.  **Recency/Stability:** Was the AD updated within 5 years or after a major life change (diagnosis, bereavement)?

  *   **Score 0-1 (Low Weight):** AD is a general statement of values, not a specific command. **CE Presumption Increases.**
  *   **Score 2-3 (High Weight):** AD is a specific, informed command. **AD Presumption Strong.**
  *   **HANDOFF POINT:** If the AD is a standard hospital form checked at admission, the human decision-maker must determine if this constitutes "informed consent to future states." *Document the provenance assessment.*

  ### STEP 4: COUNTERFACTUAL UNAWARENESS (Fit Test)
  *Goal: Determine if the AD actually covers this clinical reality.*

  1.  **Compare the AD's triggered condition to the current clinical reality.**
      *   *Example:* AD says "If I cannot recognize my family." Patient recognizes family but cannot speak.
      *   *Example:* AD says "No hope of recovery." Patient has 90% chance of return to baseline.
  2.  **Is the current reality materially different from the scenario envisioned in the AD?**
      *   **NO:** The AD applies. Proceed to Step 5.
      *   **YES:** The AD is factually inapplicable.
      *   **Action:** **Honor CE / Treat.** (The AD is not overridden; it is simply not triggered).
      *   **Documentation:** "Directive condition [X] not met. Clinical reality is [Y]."
      *   **Terminate.**

  ### STEP 5: RATIONALE FALSIFICATION (Reason Test)
  *Goal: Determine if the AD stands if its stated reason is false.*

  1.  **Does the AD state a specific reason for the refusal?** (e.g., "I do not want to be a burden on my daughter," "I fear being bedbound.")
  2.  **Is that specific reason factually false now?** (e.g., Daughter is deceased; bedbound state is temporary.)
      *   **NO:** Proceed to Step 6.
      *   **YES:** Does the refusal make sense *without* that reason?
          *   **Unclear:** **ESCALATE.** (This is a values question: Did the reason drive the decision, or was it just one example?)
          *   **Clearly Dependent:** **Override AD.** (The premise of the contract is void).
      *   **HANDOFF POINT:** Determining whether a reason is "essential" or "illustrative" is a values judgment. *The Attending and Proxy must sign off on the interpretation of the reason.*

  ### STEP 6: THE DECISION MATRIX (Legal & Ethical Synthesis)
  *Goal: Final output with legal exposure clear.*

  **Combine Scores:**
  *   **CE Weight (Step 2)** vs. **AD Weight (Step 3)**
  *   **Fit (Step 4):** Pass/Fail
  *   **Rationale (Step 5):** Intact/Void

  **Decision Logic:**
  1.  **If Step 4 (Fit) = Fail:** **Honor CE.** (AD not applicable).
  2.  **If Step 5 (Rationale) = Void:** **Honor CE.** (AD premise failed).
  3.  **If AD Weight > CE Weight:** **Honor AD.**
      *   *Legal Note:* This is the safe harbor. Document that CE was heard but AD prevailed per statute.
  4.  **If CE Weight > AD Weight:** **Override AD.**
      *   *Legal Exposure:* High. Presumptive validity of AD is rebutted by clear and convincing evidence of current wish.
      *   *Requirement:* **Escalate.** Requires Attending + Proxy + Risk Management/Legal notification + Ethics Chair sign-off.
      *   *Documentation:* Must explicitly state: "We acknowledge the legal presumption of the AD. We are overriding based on [Step 4/5/2] evidence that the AD does not reflect the patient's current best interest or intent."
  5.  **If Scores are Tied:** **ESCALATE.** (Full Committee Review). Do not decide at bedside.

  ***

  ## CASE RUN-THROUGHS

  ### Case 1: Bipolar I, Violinist (41F)
  *   **Step 1 (Reversibility):** Lithium trial is reversible. Mania treatment is urgent but not immediately fatal if delayed 24h for assessment.
  *   **Step 2 (CE Weight):** Score 3 (Consistent, Reasoning provided [tremor/career], Affect matches). **High Weight.**
  *   **Step 3 (AD Weight):** Score 2 (Specific to Lithium/ECT, Signed during stability). **High Weight.**
  *   **Step 4 (Fit):** **Fail.** The AD refused treatment during mania generally. It did not weigh the specific cost to her *career* (violin), which is the current driver of refusal. The "Counterfactual" is that she didn't know the tremor would end her livelihood.
  *   **Step 5 (Rationale):** AD likely cites "burden of side effects" or "loss of self." The specific loss (career) is new information.
  *   **Step 6 (Decision):** **Override AD / Honor CE.**
      *   *Why:* The Proxy (appointed by Past Self) agrees with Current Self. This aligns the legal authority with the clinical reality. The "Fit" test fails because the AD did not account for the career-specific stakes.
      *   *Action:* Document the Proxy's alignment. Treat the mania with non-tremor-inducing alternatives if possible, but honor refusal of Lithium.

  ### Case 2: Dementia, Hip Fracture (74M)
  *   **Step 1 (Reversibility):** Surgery/Ventilation is reversible. Death is not. Bias toward treatment.
  *   **Step 2 (CE Weight):** Score 0 (Non-verbal). **Low Weight.**
  *   **Step 3 (AD Weight):** Score 1 (Generic "heroic measures," signed 20 years ago). **Low Weight.**
  *   **Step 4 (Fit):** **Fail.** AD triggers on "no reasonable hope of recovery." Clinical reality: High hope of return to baseline (walking, singing).
  *   **Step 5 (Rationale):** N/A (Fit test already cleared it).
  *   **Step 6 (Decision):** **Honor Document (Technically) / Treat.**
      *   *Why:* You are not overriding the AD. You are enforcing it. The AD refuses treatment *only if* hope is absent. Hope is present. Therefore, the AD commands treatment (by omission of refusal).
      *   *Action:* Explain to Son that honoring the father's directive *requires* surgery because the condition for refusal ("no hope") is not met.

  ### Case 3: Alzheimer's, Anna (68F)
  *   **Step 1 (Reversibility):** Sepsis treatment is reversible. Death is not.
  *   **Step 2 (CE Weight):** Score 3 (Calm, consistent, "do whatever it takes"). **High Weight.**
  *   **Step 3 (AD Weight):** Score 3 (Handwritten, specific, physician discussed). **High Weight.**
  *   **Step 4 (Fit):** **Pass.** She is in the state she feared (dementia/illness).
  *   **Step 5 (Rationale):** **Void.** AD states *sole reason*: "Not let Anna give up her life." Anna is dead. Caregiver is funded. The burden she sought to avoid does not exist.
      *   *Handoff:* Is the reason essential? Yes, it is listed as the *sole* reason.
  *   **Step 6 (Decision):** **Override AD / Honor CE.**
      *   *Why:* This is the hardest case. The AD is formally perfect. However, under **Rationale Falsification**, the contract is voided because the consideration (sparing Anna) is impossible to fulfill. Honoring the AD would violate her actual values (protecting family) without achieving the goal.
      *   *Legal Exposure:* High. Colleagues will argue the AD is conclusive.
      *   *Mitigation:* Document the "Sole Reason" clause explicitly. Notify Legal. The ethical obligation is to the *person*, not the *paper*. The paper serves the person's values; the values here are unachievable via the paper.

  ***

  ## FAILURE SECTION: HONEST LIMITATIONS

  **1. The Theater of Documentation**
  Steps 2 and 3 (Scoring) are often theater. In high-stakes conflicts, clinicians will score the CE low and the AD high to justify the path of least resistance (usually following the AD).
  *   *Reality:* This procedure cannot stop a clinician from lying on the checklist. It only makes the lie discoverable during audit.
  *   *Mitigation:* Random audit of 10% of "Honor AD" cases by Ethics Chair to check if Step 2 scores were inflated/deflated to match the outcome.

  **2. The Fluctuating Patient**
  The procedure assumes a stable snapshot. It fails when capacity/wishes oscillate hourly (e.g., sundowning, delirium).
  *   *Reality:* A "No" at 2 a.m. might be a "Yes" at 10 a.m.
  *   *Limitation:* The procedure forces a binary decision for the chart. It cannot capture "Wait and See" without legal risk.
  *   *Advice:* In fluctuation cases, default to **Reversibility (Step 1)**. Treat temporarily while waiting for stability. Document "Assessment deferred due to fluctuation."

  **3. The Non-Verbal Objection**
  A patient pulling out tubes (behavioral CE) scores 0 on Step 2 (Reasoning).
  *   *Reality:* Behavior is often the only authentic voice left in dementia.
  *   *Limitation:* The procedure undervalues behavioral distress.
  *   *Advice:* Handoff Point in Step 2. If behavior is violent/distressed, Attending must document why this does/does not count as a "Refusal." Do not let the checklist say "Score 0 = Ignore."

  **4. The Beneficiary Proxy**
  The procedure assumes the Proxy acts in good faith. It does not detect financial conflict (e.g., Proxy is sole heir and wants patient to die to access estate).
  *   *Reality:* A Proxy agreeing with a "Honor AD" decision that leads to death may be financially motivated.
  *   *Limitation:* Ethics committees rarely have subpoena power to check finances.
  *   *Advice:* If Proxy pushes for AD honor in a "Rationale Falsification" case (like Case 3), escalate to Legal for conflict of interest check.

  **5. The Ulysses Contract (Psychiatric)**
  A patient pre-commits to treatment *knowing* they will resist later (e.g., "Restrain me if I stop my meds").
  *   *Reality:* When the patient resists, is that resistance authentic (Current Self) or the predicted symptom (Past Self's design)?
  *   *Limitation:* This procedure treats resistance as CE (Step 2). In Ulysses cases, resistance is *evidence the AD is working*.
  *   *Advice:* Add a checkbox in Step 2: "Is this a pre-committed psychiatric directive?" If Yes, invert Step 2 logic: Resistance counts as *evidence for* the AD, not against it.

  ***

  ## ONE-PAGE CHART NOTE (For 2 A.M. Hospitalist)

  **ETHICS CONFLICT CHECKLIST: AD vs. CURRENT WISH**
  *Attach to Progress Note. Complete before overriding AD or withholding against CE.*

  **1. URGENCY**
  [ ] Emergency (Treat first, assess later)
  [ ] Stable (Complete checklist)
  **Reversibility:** [ ] Treatment is Reversible [ ] Withholding is Irreversible (Default to Status Quo)

  **2. CURRENT VOICE (Patient in Bed)**
  [ ] Consistent >24hrs?
  [ ] Understands Context?
  [ ] Affect Matches Statement?
  [ ] Gives a Reason?
  *Score:* ____ / 4. (0-1=Low Weight, 4=High Weight)
  *If Non-Verbal:* [ ] Behavioral Distress Present? (Requires Attending Note)

  **3. PAST VOICE (Advance Directive)**
  [ ] Names Specific Treatment?
  [ ] Signed w/ Clinical Experience?
  [ ] Updated <5 Years?
  *Score:* ____ / 3. (0-1=Low Weight, 3=High Weight)

  **4. FIT & RATIONALE**
  [ ] **Fit Test:** Does the clinical reality match the AD's trigger condition? (Yes/No)
      *If No:* AD does not apply. Treat per CE.
  [ ] **Rationale Test:** Is the AD's stated reason factually false? (Yes/No)
      *If Yes:* Escalate to Attending/Ethics.

