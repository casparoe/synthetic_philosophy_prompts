prompt: |-
  I'm the quantitative geneticist at a mid-sized layer-hen breeding company, and I need a standing decision procedure more than I need another argument. Background: most of our history is individual selection on single-hen cage records — egg production to the gram, perfect pedigrees, no interaction between birds. New welfare rules mean our birds and our customers' birds will live in large colonies, and instrumenting colony housing (RFID per bird, individual feed intake) runs about 8x the cost per bird, so we can only instrument a fraction of any flock. Every selection cycle we end up re-litigating the same fight: do we select on the individual records we have on the subflock, on group means over whole colonies, or some blend? The sales team, the welfare consultant, and I all have different gut answers. The breeding director has told me to write down a procedure the junior geneticists can actually run so he stops adjudicating this by vibe. He signs off on whatever the procedure recommends, so the handoff points matter.

  Here's my problem though: a philosophy-of-biology friend of mine told me our fight is basically the old units-of-selection debate — genes vs individuals vs groups, Dawkins and Gould, Sober and Wilson, multilevel selection, the Price equation partition, something called contextual analysis where you regress individual fitness on the bird's own trait and separately on its group's mean. I've read enough to follow the shape of it but I'm no philosopher and no theorist; what I'm fluent in is mixed models, BLUP, kinship matrices, and experimental design. So turn whatever that literature actually says into a procedure I can run in an afternoon with data we really have: colony-level production and mortality records, individual records on the instrumented subset, full pedigrees, batch structure.

  What I need from the procedure:

  - The questions in order, what counts as a sufficient answer to each, and where the procedure terminates with a clear "select on individuals" or "select on group means" versus where it has to punt to the director because the remaining question is about money or values, not statistics.
  - It has to encode the distinction the philosophers actually care about: cases where individual and group selection pull the same direction versus cases where they genuinely conflict. (Feather pecking is our classic conflict trait — individually productive birds can be awful cagemates — but I want the procedure general, not a one-trait hack.)
  - Somewhere it has to be honest about the equivalence point: whether picking the individual or the group description ever changes the decision, or whether it's just bookkeeping with different column headers.
  - Run it on three cases: (1) feather pecking and mortality in colony housing, where individual selection historically made things worse; (2) feed conversion efficiency, where I suspect individuals and colonies agree; (3) resistance to a challenge disease where birds get dosed in batches, so the only records that exist are batch-level — no individual option at all.
  - One of those cases should come out the way I won't like — I have a feeling it's the pecking one, and the right answer is expensive — and I want you to actually bite that bullet rather than soften it.

  Also flag what the procedure can't settle, so the juniors know when to escalate instead of trusting it. And please be upfront about confidence throughout: mark which steps are load-bearing theory and which are rules of thumb dressed up as procedure, and single out the one point in the whole thing you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Quantitative Geneticist at a layer-hen breeding company.
      *   **Context:** Transitioning from single-hen cages (individual selection) to colony housing (group living).
      *   **Constraint:** Instrumentation (RFID, individual feed) is 8x cost, so only a subset of birds can be measured individually in colonies. Most data is colony-level or batch-level.
      *   **Problem:** Internal conflict (Sales, Welfare, Genetics) on selection strategy (Individual vs. Group vs. Blend). Need a standing decision procedure to stop re-litigating every cycle.
      *   **Philosophical Angle:** Aware of the "units of selection" debate (Dawkins, Gould, MLS, Price Equation, Contextual Analysis) but wants it translated into *practical quantitative genetics* (Mixed models, BLUP, kinship).
      *   **Deliverable:** A step-by-step decision procedure.
      *   **Requirements:**
          *   Clear termination points (Select Individual / Select Group / Escalate to Director).
          *   Encode the conflict between individual and group selection (e.g., feather pecking).
          *   Address the "equivalence point" (is it just bookkeeping?).
          *   Run on three specific cases (Feather Pecking, Feed Efficiency, Disease Challenge).
          *   One case must yield an uncomfortable/expensive truth (likely Pecking).
          *   Flag limitations/escalation points.
          *   Mark confidence levels (Theory vs. Rule of Thumb) and identify the weakest link.

  2.  **Deconstruct the Science (The "Translation" Layer):**
      *   *Philosophy:* Units of selection, MLS, Price Equation.
      *   *Quant Gen Reality:* This maps directly to **Direct Genetic Effects (DGE)** vs. **Indirect Genetic Effects (IGE)** (also known as Associative Effects).
      *   *The Model:* $P_i = A_{D,i} + \sum_{j \neq i} A_{I,j} + E_i$.
      *   *Contextual Analysis:* Regress fitness on individual trait ($z_i$) and group mean trait ($\bar{z}_{-i}$). In animal breeding, this is equivalent to estimating DGE and IGE variances/covariances.
      *   *The Conflict:* If $Cov(A_D, A_I) < 0$ (negative correlation between being productive yourself and making neighbors productive), individual selection fails. This is the "tragedy of the commons" in genetics.
      *   *The Equivalence:* Mathematically, selecting on Total Breeding Value (TBV = $A_D + (n-1)A_I$) is the goal. The question is *how* to estimate TBV given data constraints (partial individual, mostly group).
      *   *The Cost:* Estimating IGE requires specific designs (group relatives, mixed groups) or individual instrumentation within groups to separate $A_D$ from $A_I$. If you only have group means, you confound them.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   Need a flowchart style but in text.
      *   Step 1: Data Audit (What do we actually have?).
      *   Step 2: Variance Component Estimation (The core quant gen step). Fit the IGE model.
      *   Step 3: The Conflict Test (Correlation between DGE and IGE).
      *   Step 4: Economic/Constraint Check (Where the Director comes in).
      *   Step 5: Selection Index Construction.

  4.  **Addressing the "Equivalence Point":**
      *   Philosophers argue about *causality*. Breeders care about *response*.
      *   Truth: If you select on TBV, it doesn't matter if you call it "group selection" or "individual selection with IGE." But if you ignore IGE, you get the wrong TBV.
      *   The procedure must clarify that "Selecting on Group Means" is a proxy for TBV when individual data is missing, but it's inefficient if individual data exists *unless* IGE is strong and negative.

  5.  **Running the Three Cases:**
      *   *Case 1: Feather Pecking.* High conflict. $r_{A_D, A_I}$ is strongly negative. Individual selection increases pecking. Need IGE model. Requires grouping relatives or individual ID in groups. *Verdict:* Expensive. Must instrument subset to estimate IGE, then select on TBV. If budget doesn't allow IGE estimation, must select on Family/Group means, sacrificing short-term gain for long-term survival.
      *   *Case 2: Feed Efficiency.* Low conflict. $r_{A_D, A_I} \approx 0$ or positive. *Verdict:* Select on Individual EBV (even if subset). Group data adds little.
      *   *Case 3: Disease Challenge.* Batch level only. No individual ID. *Verdict:* Forced Group/Family selection. No statistical way out. Director decides risk tolerance.

  6.  **Refining the "Uncomfortable Truth":**
      *   The user suspects Case 1 is the problem.
      *   The truth: To fix feather pecking in colonies, you *cannot* rely on historical individual cage data. You *must* estimate IGE. To estimate IGE accurately, you need known group members. If you can't instrument everyone, you need specific grouping designs (mixing families). This costs money and logistical complexity.
      *   *Bullet biting:* The procedure must say "If you cannot afford the design to estimate IGE, you cannot genetically solve feather pecking in colonies without risking flock mortality."

  7.  **Structuring the Output:**
      *   **Introduction:** Acknowledge the role and the translation from Philosophy to BLUP.
      *   **The Procedure (SOP):** Numbered steps, decision nodes, confidence markers.
      *   **The Equivalence Note:** Addressing the "bookkeeping" question.
      *   **Case Studies:** Applying the SOP.
      *   **Limitations & Escalation:** Where the math stops and money begins.
      *   **Confidence & Weakest Link:** As requested.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I use too much philosophy jargon? *Fix:* Translate "Multilevel Selection" to "Direct vs. Indirect Genetic Effects."
      *   *Check:* Is the "Equivalence Point" clear? *Fix:* Explicitly state that TBV is the target, method is just estimation.
      *   *Check:* Is the "Uncomfortable Truth" hard enough? *Fix:* Make sure Case 1 says "Stop selection if you can't fund the IGE design."
      *   *Check:* Confidence markers? *Fix:* Use [HIGH CONFIDENCE], [HEURISTIC], etc.
      *   *Check:* Weakest link? *Fix:* The assumption that IGE estimated in test flocks translate to commercial flocks (GxE interaction on social effects).

  9.  **Final Polish:** Ensure tone is professional, direct, and respectful of the user's expertise (they know BLUP, so don't explain BLUP, explain how to structure the X matrix).

  *(Self-Correction on the "Equivalence Point"):* I need to be careful. Philosophers argue about *what* is evolving. Breeders care about *response*. The equivalence is that $R = i \cdot r_{IH} \cdot \sigma_{TBV}$. Whether we call it group selection or individual selection with IGE, the response depends on the accuracy of predicting TBV. The procedure needs to highlight that ignoring IGE biases the EBV.

  *(Refining the "Weakest Link"):* The biggest assumption in IGE breeding is that the social environment in the nucleus (where selection happens) matches the commercial environment. If the nucleus is still cages (common due to cost), IGE estimates are biased. I must highlight this.

  10. **Finalizing the Text:** (Drafting the response based on these thoughts).
answer: |-
  This is a translation task. Your philosopher friend is talking about *causality and levels of organization*; you are talking about *variance components and prediction accuracy*. Fortunately, in quantitative genetics, the "units of selection" debate maps almost perfectly onto **Direct Genetic Effects (DGE)** vs. **Indirect Genetic Effects (IGE)** (often called Associative Effects).

  The "conflict" your sales and welfare teams feel is the covariance between DGE and IGE. The "equivalence" question is about whether Total Breeding Value (TBV) is invariant to the model specification.

  Below is the Standing Operating Procedure (SOP). It is designed to be run by a junior geneticist with access to your ASReml/BLUPF90 stack and pedigree files.

  ***

  # SOP 4.1: Selection Strategy for Colony Housing Traits

  **Objective:** Determine the selection index weights (Individual EBV vs. Group/Family EBV) for traits measured in colony housing, given partial instrumentation.
  **Inputs:** Phenotypic records (individual or group), Pedigree, Group ID structure, Cost constraints.
  **Output:** A directive to Select on Individual EBV, Select on Group/Family EBV, or Escalate to Breeding Director.

  ---

  ## Phase 1: Data Structure Audit
  *Load-bearing Theory: You cannot estimate Indirect Genetic Effects (IGE) without knowing who interacted with whom.*

  **Step 1.1: Check Group Identity Resolution.**
  *   **Question:** Do we know the specific group ID for every bird with a record?
  *   **Sufficient Answer:** Yes (Group ID is in the dataset).
  *   **Termination:** If **No** (e.g., batch-level disease challenge where individuals are unidentifiable within the batch), **STOP**. Proceed to **Escalation Point A** (See Phase 4).
  *   **Confidence:** [HIGH] – This is a data constraint, not a statistical one.

  **Step 1.2: Check Individual Resolution within Groups.**
  *   **Question:** For the trait in question, do we have individual records for >20% of birds in the colony, or only a colony sum/mean?
  *   **Sufficient Answer:** Binary (Individual vs. Group-Only).
  *   **Confidence:** [HIGH]

  ---

  ## Phase 2: The Conflict Test (Variance Component Estimation)
  *Load-bearing Theory: This is the translation of the "Units of Selection" debate. We are partitioning variance into $A_D$ (Direct) and $A_I$ (Indirect).*

  **Step 2.1: Fit the Social Genetic Model.**
  *   **Action:** Run a bivariate or univariate animal model including IGE.
      *   Model: $y = Xb + Z_D a_D + Z_I a_I + e$
      *   Where $a_D$ is the direct breeding value of the individual, and $a_I$ is the indirect breeding value of its cagemates.
      *   *Note:* If individual records are sparse (Step 1.2 = Group-Only), you must use Family/Group means as the observation unit, confounding $A_D$ and $A_I$ unless families are grouped specifically.
  *   **Metric:** Estimate the genetic correlation between Direct and Indirect effects ($r_{A_D, A_I}$).
  *   **Confidence:** [MODERATE] – Requires sufficient connectedness between groups.

  **Step 2.2: The Conflict Criterion.**
  *   **Question:** Is $r_{A_D, A_I}$ significantly less than -0.3?
  *   **Sufficient Answer:**
      *   **Yes (Strong Negative):** Individual productivity competes with group welfare (e.g., aggression, feed bullying). **Individual selection will degrade the trait.**
      *   **No (Zero or Positive):** Individual and group interests align.
  *   **Confidence:** [HIGH] – This is the mathematical definition of the "tragedy of the commons" in breeding.

  ---

  ## Phase 3: The Equivalence & Efficiency Check
  *Philosophical Translation: Does it matter if we call it "Group Selection" or "Individual Selection with IGE"?*

  **Step 3.1: Calculate Total Breeding Value (TBV) Accuracy.**
  *   **Action:** Calculate the accuracy of predicting TBV ($r_{TBV, \hat{TBV}}$) under two scenarios:
      1.  **Model A:** Standard BLUP (Ignore IGE, select on $A_D$).
      2.  **Model B:** Social BLUP (Include IGE, select on $TBV = A_D + (n-1)A_I$).
  *   **Question:** Does Model B yield a higher expected genetic gain per generation than Model A, accounting for the cost of instrumentation?
  *   **Sufficient Answer:**
      *   If $r_{A_D, A_I} \approx 0$: Model A and B are equivalent. **Select on Individual EBV.** (It's cheaper).
      *   If $r_{A_D, A_I} < -0.3$: Model A yields negative response on group performance. **Must use Model B.**
  *   **Confidence:** [HIGH] – Mathematically, TBV is the invariant target. The method is just estimation.

  **Step 3.2: The Instrumentation Cost-Benefit.**
  *   **Action:** Compare the cost of instrumenting the subset required to estimate $A_I$ (Step 1.2) against the economic loss of mortality/pecking if $A_I$ is ignored.
  *   **Termination:** If the cost of instrumentation > expected loss from ignoring IGE, **STOP**. Proceed to **Escalation Point B**.
  *   **Confidence:** [LOW] – This requires economic parameters (price of egg vs. price of mortality) that fluctuate.

  ---

  ## Phase 4: Escalation Points (The Director's Call)
  *These are not statistical questions. They are budgetary or ethical constraints.*

  **Escalation Point A: The "Black Box" Trait (e.g., Disease Challenge)**
  *   **Condition:** Data is only available at the batch/colony level (Step 1.1 = No).
  *   **Issue:** We cannot separate $A_D$ from $A_I$. We are selecting on Family/Group means.
  *   **Decision for Director:** "We are forced into Group Selection. This reduces selection intensity (fewer effective units) and increases inbreeding risk. Do we accept lower genetic gain for this trait, or fund individual tagging for challenge trials?"
  *   **Recommendation:** Default to Family Selection.

  **Escalation Point B: The "Expensive Fix" (e.g., Feather Pecking)**
  *   **Condition:** Conflict detected ($r_{A_D, A_I} < -0.3$), but instrumentation cost exceeds short-term budget (Step 3.2).
  *   **Issue:** Ignoring IGE will increase mortality in customer flocks. Instrumenting to fix it reduces nucleus size or budget.
  *   **Decision for Director:** "We have a genetic conflict. Option 1: Cut nucleus size to fund RFID and fix the trait. Option 2: Keep nucleus size, ignore IGE, and accept higher customer mortality/welfare culls. Option 3: Pause selection on this trait until budget allows."
  *   **Recommendation:** **Option 1 or 3.** Selecting on Option 2 is selling a defective product.

  ---

  # Application to Three Cases

  Here is the procedure run on your specific scenarios.

  ### Case 1: Feather Pecking & Mortality (Colony Housing)
  *   **Step 1.1 (Group ID):** Yes.
  *   **Step 1.2 (Individual Res):** Partial (Subset instrumented).
  *   **Step 2.1 (Variance):** Historical data and literature suggest $r_{A_D, A_I}$ is strongly negative (high producers are often the peckers).
  *   **Step 2.2 (Conflict):** **YES.** Conflict detected.
  *   **Step 3.1 (Equivalence):** Model A (Individual only) predicts gain in eggs but loss in survival. Model B (IGE) predicts slower egg gain but stable survival.
  *   **Step 3.2 (Cost):** Instrumentation is 8x cost.
  *   **Procedure Verdict:** **ESCALATE TO DIRECTOR (Escalation Point B).**
  *   **The Bullet:** You cannot solve this with statistics alone. The procedure dictates that if you cannot fund the IGE estimation design (which requires the expensive instrumentation), **you must pause selection on egg number for this line** or accept that you are breeding birds that will kill each other in customer flocks.
  *   **Why you won't like it:** It forces a budget increase or a selection pause. It validates the Welfare Consultant over the Sales Team's short-term volume targets.

  ### Case 2: Feed Conversion Efficiency (FCR)
  *   **Step 1.1 (Group ID):** Yes.
  *   **Step 1.2 (Individual Res):** Partial (Feed intake requires RFID).
  *   **Step 2.1 (Variance):** Literature suggests $r_{A_D, A_I} \approx 0$. Efficient birds don't necessarily starve neighbors.
  *   **Step 2.2 (Conflict):** **NO.**
  *   **Step 3.1 (Equivalence):** Model A and Model B yield similar TBV rankings.
  *   **Procedure Verdict:** **SELECT ON INDIVIDUAL EBV.**
  *   **Rationale:** Use the instrumented subset to estimate EBV. Do not waste degrees of freedom fitting IGE. Group means add noise, not signal. Save the money.

  ### Case 3: Resistance to Challenge Disease (Batch Dosing)
  *   **Step 1.1 (Group ID):** **NO.** (Records are batch-level mortality/infection rate).
  *   **Step 1.2 (Individual Res):** **NO.**
  *   **Procedure Verdict:** **ESCALATE TO DIRECTOR (Escalation Point A).**
  *   **Rationale:** The procedure terminates immediately. You cannot run a BLUP with IGE without individual IDs. You are doing Family Selection on batch means.
  *   **Director's Choice:** Fund individual tagging for challenge trials (expensive, high biosecurity risk) or accept lower selection intensity on disease traits.

  ---

  # Limitations & Escalation Flags

  **What this procedure CANNOT settle:**
  1.  **GxE on Social Effects:** The procedure assumes IGE estimated in the nucleus (where you might still have some cages or specific colony designs) apply to the commercial colony environment. If social behavior changes by environment, the $r_{A_D, A_I}$ estimate is biased.
      *   *Flag:* If nucleus housing $\neq$ commercial housing, mark Confidence in Step 2.2 as [LOW].
  2.  **Ethical Weighting:** The procedure identifies the *conflict*, but it does not assign the economic weight to welfare vs. production. That is $w$ in the selection index $I = w_1 EBV_{egg} + w_2 EBV_{mortality}$. The procedure tells you *how* to estimate the EBVs, not what $w$ should be.
  3.  **Inbreeding:** Group selection (or selecting on TBV with strong IGE) can increase the rate of inbreeding if not managed, because you are effectively selecting fewer independent units (families/groups).

  **Confidence Markers:**
  *   **[HIGH CONFIDENCE]:** Steps 1.1, 1.2, 2.2, 3.1. (Linear algebra and data structure).
  *   **[MODERATE CONFIDENCE]:** Step 2.1. (Variance components on sparse data can be unstable).
  *   **[LOW CONFIDENCE]:** Step 3.2. (Economic modeling is volatile).

  **The Weakest Link (Single Point of Failure):**
  **Step 2.1 (The IGE Estimation Design).**
  I am least sure that your current "subset instrumentation" design is sufficient to separate $A_D$ from $A_I$. To estimate IGE, you need **group composition variance**. If your instrumented birds are randomly scattered, you can separate them. If your instrumented birds are clustered, or if the non-instrumented birds' genetics are unknown, the model will confound $A_D$ and $A_I$.
  *   *Requirement:* The procedure assumes you are grouping relatives *with* non-relatives in the instrumented flocks to create the necessary covariance structure. If you are just tagging random birds in commercial-style groups, Step 2.1 will fail to converge or yield biased estimates. **Verify experimental design before running the model.**

  ---

  # Summary for the Breeding Director

  1.  **Feed Efficiency:** Save money. Select on individuals. (Sales wins).
  2.  **Disease Challenge:** We are blind. Fund tagging or accept low gain. (Director decides risk).
  3.  **Feather Pecking:** **Stop.** We are currently breeding for mortality if we ignore group effects. We must pay for the instrumentation to estimate social effects, or we must stop selecting for egg mass in this line until we can. (Welfare wins, Sales loses short term).

  This procedure removes the "vibe." It forces the conflict into the variance covariance matrix. If the correlation is negative, the math says individual selection is maladaptive. That is not philosophy; that is linear algebra.
