      *   **Total:** ~8/25.

  4.  **Drafting the Comments (Iterative Process):**
      *   *Goal:* Line-level, quote + specific objection.
      *   *Tone:* Professional, constructive, firm on errors.
      *   *Specific focus:* The TA's worry about Part (c). I need to confirm the TA's suspicion that the student is wrong here, despite the colleague's view. The student explicitly rejects the utility of the distinction taught in the course.

      *   *Drafting Part (a) comments:*
