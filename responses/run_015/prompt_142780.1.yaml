answer: |-
  ### Screen Scores (0–10)

  | Screen | (a) Stops Mugger | (b) Saves Portfolio | Grant Wrongly Killed |
  | :--- | :---: | :---: | :--- |
  | **1. Value Ceiling** | 9 | 4 | **Pandemic Prevention** (Civilizational value exceeds cap, distorting priority). |
  | **2. Satisficing Ceiling** | 8 | 5 | **Pandemic Prevention** (Ranking becomes arbitrary once ceiling is hit). |
  | **3. Probability Floor** | 10 | 7 | **Early-Stage X-Risk** (Legitimate risks below 1-in-1B get auto-rejected). |
  | **4. Escalation Screen** | 10 | 9 | **Atmospheric Study** (If physicists cannot bound the worst-case, it looks like escalation). |
  | **5. Mechanism Requirement** | 9 | 8 | **Atmospheric Study** (Novel physics links may be "unspecifiable" despite being real). |
  | **6. Track Record** | 10 | 5 | **Atmospheric Study** (No reference class exists for novel runaway effects). |
  | **7. Median Not Mean** | 10 | 2 | **Pandemic Prevention** (Median outcome of low-prob prevention is zero). |
  | **8. Robustness** | 8 | 6 | **Atmospheric Study** (One skeptical committee member vetoes the grant). |
  | **9. Information Only** | 10 | 3 | **Pandemic Prevention** (Direct intervention is not information gathering). |

  ### Duplicates & Collapses

  *   **1 (Value Ceiling) & 2 (Satisficing):** These are the same rule; 2 is just 1 with a different ranking tie-breaker. Collapsing them loses nothing; both arbitrarily cap the moral importance of saving extra lives.
  *   **3 (Prob Floor) & 7 (Median):** These are functionally identical in outcome; 7 is the mathematical implementation of 3. Collapsing them loses the illusion of sophistication 7 provides.
  *   **5 (Mechanism) & 6 (Track Record):** These are siblings, not twins. 5 demands physical plausibility; 6 demands historical precedent. Collapsing them loses the ability to fund novel physics (5 passes, 6 fails).

  ### Tier List

  *   **1. Value Ceiling:** Drop; publicly capping the value of human lives is reputational suicide.
  *   **2. Satisficing Ceiling:** Drop; it creates perverse incentives to underestimate impact to avoid the ceiling.
  *   **3. Probability Floor:** Adopt with Patch; set the floor at 1-in-100M but allow exceptions for mechanism-verified claims.
  *   **4. Escalation Screen:** Adopt as Written; it is the only rule that specifically targets the logical structure of the mugging.
  *   **5. Mechanism Requirement:** Adopt as Written; this is standard due diligence language that donors understand and muggers cannot satisfy.
  *   **6. Track Record:** Drop; it systematically biases against novel research and first-of-a-kind risks.
  *   **7. Median Not Mean:** Drop; it requires mathematical expertise your POs do not have and kills your core portfolio.
  *   **8. Robustness:** Adopt with Patch; require two independent skeptical reviews rather than unanimity to avoid veto-by-one.
  *   **9. Information Only:** Drop; it fundamentally changes your foundation's mission from grantmaking to research.

  ### Reserve Fraction

  **0.01 (1%).** It isn't 0 because your screening rule will have a false-negative rate on genuinely novel, high-uncertainty science that resembles mugging. It isn't "as much as the biggest number implies" because unlimited reserves invite infinite lobbying effort on speculative claims rather than execution.

  ### Where the Real Work Happens

  The real work is happening in the probability assessment, not the decision rule. A decision rule is just a gate; if you let garbage probabilities through the gate, no mathematical screen will save you from bad decisions. The written rule should not focus on how to *calculate* the grant value, but on *admissibility standards for evidence*: specify that probabilities must be derived from peer-reviewed models, historical base rates, or mechanistic simulations, and that unsourced numerical claims are inadmissible regardless of magnitude.
