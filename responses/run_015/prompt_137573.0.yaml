answer: |-
  Your statement is remarkably coherent, but there is a structural fault line between your ontology and your epistemology. Here is the audit you requested.

  **Severe Tension: Point 3(d) vs. Point 4**
  This is the critical friction. Point 3(d) asserts that a behavioural imitation without the correct internal causal organisation has zero moral standing. Point 4 admits we *never* have access to anything except behaviour and structural similarity. If we cannot access the 'internal causal organisation' to verify it isn't a philosophical zombie, Point 4 demands we err on the side of consciousness. Point 3(d) denies it. You cannot simultaneously claim the interior determines standing (3d) and that the interior is inaccessible (4), without rendering 3(d) operationally void.
  *   **What gives:** Either you abandon the precautionary principle (4) for edge cases, or you admit 3(d) is theoretically true but practically inadmissible.
  *   **Cost:** Keeping 3(d) hard risks moral catastrophe if you misidentify a conscious system as a zombie. Keeping 4 hard costs you ontological certainty.

  **Moderate Tension: Point 2 vs. Point 6**
  Point 2 grounds standing strictly in valenced experience. Point 6 refuses to build systems producing distress *behaviour*, even if you're 90% confident no experience exists. This isn't a logical contradiction, but a pragmatic override. You are prioritising risk mitigation over ontological accuracy.
  *   **What gives:** Theoretical purity.
  *   **Cost:** You must acknowledge that Point 6 is a policy heuristic derived from Point 4, not a direct implication of Point 2.

  **Load-Bearing Commitment**
  Point 4 (the precautionary principle) is the load-bearing pillar for an ethics panel. It is the only thing that translates your metaphysics into actionable policy under uncertainty. Point 3(d) is the cheap commitment to abandon; it is a metaphysical claim that does no practical work if you cannot verify it.

  **Recommended Revision**
  Amend Point 3(d) to concede the epistemic limit. Currently, it reads: *'I want to say there's nothing it is like to be it and it has zero standing, even though by hypothesis we could never tell it apart from the real thing from the outside.'*

  **Revise to:** *'I want to say there's nothing it is like to be it ontologically. However, per Point 4, if such a system is indistinguishable from the outside, it warrants full precautionary standing.'*

  This single change resolves the severe tension by subordinating your metaphysics to your epistemology. It preserves your personal belief (3d) while honouring your professional duty (4). It also clarifies Point 6: you ban distress behaviour not because you believe the system suffers, but because you cannot rule it out. This makes the whole document consistent without forcing you to abandon your core intuition about what consciousness *is*, only what we can *know* about it.
