answer: |-
  The argument your colleague has presented is a rigorous formulation of what is known in philosophy as the **Non-Identity Problem**. It is logically valid, meaning the conclusion follows from the premises. However, it is unsound because one of its premises is false.

  You are correct to feel that the conclusion is unacceptable. Your intuition that it "proves too much" (the historical injustices and toxin examples) is the standard test for unsoundness: if a principle validates clear moral errors, the principle is flawed.

  Here is the diagnosis of where the argument breaks, how to fix it without violating your constraints, and how to translate that into your memo.

  ### 1. The Diagnosis: Premise (4) is False

  The break occurs at **Premise (4)**: *"Provided the lives that result are lives worth living, (1) to (3) exhaust every way in which a policy could be bad for the people who live under it."*

  This premise asserts that the *only* way a policy can be morally bad for a person is if it lowers their welfare compared to the alternative (the "Person-Affecting Principle" in (1)). It assumes that if a person has a "life worth living," they have no grounds for complaint, regardless of how that life was brought about or what conditions it contains.

  This conflates **Harm** (a comparative loss of welfare) with **Wrong** (a violation of entitlement, right, or justice).

  Your colleague's argument relies on the assumption that because the future people are not *harmed* (in the comparative sense of (1)), they are not *wronged*. But (5) explicitly allows for a policy to be objectionable if it "violates no one's rights." Premise (4) smuggles in the claim that no rights are violated provided life is worth living. That is the error.

  **Why (4) fails:**
  You can violate someone's rights without making them "worse off" than they would otherwise have been.
  *   *Example:* Suppose I promise a specific sum of money to a child who will be born next year. I spend the money instead. The child is born (due to my spending patterns) and has a life worth living. Am I morally free of objection? No. I violated a claim-right, even if the child is not "worse off" than non-existence.
  *   *Application:* If future people have a right to a habitable environment, or a right not to be exposed to catastrophic risk, that right is violated by high-emission policies even if those specific people owe their existence to those policies and even if their lives remain "worth living."

  ### 2. Why This Repair Satisfies Your Constraints

  You specified two preferences: keep (2) (identity is fragile) and keep (5) (no wrong without a victim/right). This diagnosis respects both.

  *   **It keeps (2):** We accept the sociological fact that policies change who is conceived. We do not need to deny the Non-Identity Problem to solve it.
  *   **It keeps (5):** We do not need to resort to "impersonal" aggregation (e.g., "total utility is lower"). We maintain that moral objectionability requires a victim. The victims are the future people whose **rights** are violated, not whose **welfare** is comparatively diminished.
  *   **It avoids the "Aggregative Calculus":** Rights are held by individuals. Asserting that a policy violates the rights of future individuals is a person-affecting claim, not an impersonal sum. It does not require you to add up welfare units across centuries.
  *   **It solves the "Cliff" (Your worry iii):** You worried about the precipice between "lives worth living" and "lives not worth living." A rights-based approach does not rely on that binary. A life can be well above the "worth living" threshold but still involve rights violations (e.g., displacement, loss of sovereignty, chronic health issues). The target is set by the threshold of *rights safety*, not the threshold of *existence value*.
  *   **It solves the "Unknowable" (Your worry iv):** We do not need to know *who* will exist to know that *whoever* exists will have certain rights. If a policy creates a high probability of flooding a coastal region, it violates the property or security rights of whoever lives there, regardless of their specific identity or conception date.

  ### 3. Addressing the "Absurdities" (Your worries i and ii)

  By rejecting (4) and introducing rights, the absurd generalizations vanish:

  *   **Historical Injustices (i):** Descendants of the slave trade may owe their existence to those historical events (via changed mating patterns). Under your colleague's view, they cannot claim harm. Under the rights view, the ancestors' rights were violated *at the time*. Furthermore, if the legacy of those injustices creates structural violations of rights for descendants (e.g., systemic disenfranchisement), those are current rights violations, independent of the non-identity issue.
  *   **The Toxin Case (ii):** A firm exposing workers to a toxin that affects future children violates the **parents'** right to bodily integrity and reproductive safety. It may also violate the **children's** right to health. The fact that the children would not otherwise exist is irrelevant to the claim that their health rights have been infringed by the firm's negligence.

  ### 4. How to Write the Memo

  You do not need to engage in philosophical name-dropping. You need to shift the framework from **Cost-Benefit Analysis (Welfare)** to **Risk Management (Rights/Entitlements)**.

  Your colleague is arguing for a discount rate based on the idea that future welfare comparisons are impossible. You should argue for a **Safe Minimum Standard** based on the duty to avoid rights violations.

  **Recommended Argument Structure for the Memo:**

  1.  **Acknowledge the Identity Constraint:** Accept Premise (2). "We acknowledge that specific mitigation policies will alter the demographic composition of the future population."
  2.  **Reject the Welfare Exhaustion:** Challenge Premise (4). "However, moral and legal responsibility is not exhausted by comparative welfare analysis. Statutory duties are often framed in terms of rights, safety, and risk, not merely net welfare."
  3.  **Define the Duty:** "The body's mandate is to prevent dangerous interference with the climate system. This is best understood as a duty to avoid imposing catastrophic risks on future inhabitants, regardless of their specific identity."
  4.  **Set the Target:** "Therefore, the target should not be set where 'net benefits' are maximized (which requires impossible identity comparisons), but where the probability of rights-violating outcomes (e.g., uninhabitable zones, mass displacement, systemic collapse) is kept below a statutory threshold."
  5.  **Conclusion:** "Benefits accruing beyond eighty years are not 'morally inert.' They represent the avoidance of rights violations for whoever happens to exist at that time. Excluding them would be equivalent to saying a government has no duty to maintain nuclear waste containment once the current generation is dead."

  ### 5. Summary of the Logical Move

  To answer your specific question: **Reject Premise (4).**

  *   **What you must accept:** You must accept that individuals can be "wronged" (have their rights violated) even if they are not "worse off" (in terms of comparative welfare) than they would have been in the alternative scenario.
  *   **Does the narrower conclusion work?** Yes. The narrower conclusion is: *"No policy is morally objectionable on account of comparative welfare loss to future people, **but** policies are objectionable if they violate the rights of future people."*
  *   **Does this support a target?** Yes. It supports a target based on **liability and risk** rather than **discounted utility**. It allows you to recommend a stringent target without needing to calculate the welfare of specific, non-existent individuals.

  Your colleague's argument is a powerful tool for economists who wish to discount the future, but it relies on a reductionist view of morality that equates "wronging" with "lowering welfare." By distinguishing rights from welfare, you preserve the moral urgency of the target without falling into the trap of impersonal aggregation.
