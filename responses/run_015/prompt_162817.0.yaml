      *   Premise (3) follows from (1) and (2).
      *   Premise (4) claims (1)-(3) *exhaust* every way a policy could be bad for people. **This is the weak link.**
      *   Premise (5) claims moral objectionability requires a specific victim who is wronged.
      *   The conclusion (6) follows if (1)-(5) hold.

      *   *The Core Tension:* The argument is logically *valid* within its own framework (Person-Affecting Utilitarianism/Deontology). The problem is that the framework yields counter-intuitive results (the "absurdities" the user noted).
      *   To stop the conclusion without abandoning (5) entirely, we need to challenge the definition of "worse off" or the scope of "harm."
      *   However, the user wants to keep (5). If we keep (5), we need a victim. If we keep (1), the future person isn't a victim.
      *   Therefore, to save the intuition that the policy *is* objectionable, we must reject the idea that *only* comparative harm to specific individuals generates moral objectionability (modifying 5) OR we must reject the idea that existence vs. non-existence is the only valid comparison for (1).

