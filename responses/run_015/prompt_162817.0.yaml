      *   *Identification:* This is Derek Parfit's "Non-Identity Problem" from *Reasons and Persons*. The colleague is using it to argue for a near-zero discount rate on *moral consideration* (effectively excluding them), though Parfit usually uses it to show flaws in person-affecting views.

