  Headline credence: **0.16**

  Here is the decomposition. I am treating this as a **series reliability system**: for the proposition to be true, all four conditions must effectively hold. If any one fails, the specific claim (that pop/fiscal *alone* drive the *same* cycle) collapses.

  *   **$P_{\text{mech}} = 0.40$**: Probability that population pressure plus fiscal crisis on their own produce the 200–300 year oscillation.
      *   *Justification:* Malthusian feedback loops generate oscillations, but historical data suggests they lack the "gain" to cause systemic collapse without elite fragmentation acting as the ignition switch for revolt.
  *   **$P_{\text{inst}} = 0.50$**: Probability that the described institutions block elite overproduction for five centuries.
      *   *Justification:* Power concentrates informally (Iron Law of Oligarchy); examiners and enforcers inevitably become a new de facto aristocracy within 10–15 generations, re-introducing the variable you tried to remove.
  *   **$P_{\text{signal}} = 0.90$**: Probability that "a cycle with the same period and amplitude" is a well-defined, detectable signal.
      *   *Justification:* While delay systems oscillate, spectral analysis can distinguish between stochastic noise and deterministic secular cycles, making the metric robust enough for this test.
  *   **$P_{\text{coh}} = 0.90$**: Probability that the society remains an "agrarian extractive" system relevant to SDT.
      *   *Justification:* Banning wealth transfer dampens the incentive to extract surplus, but a coercive state can likely maintain the agrarian base long enough for the data to exist, even if efficiency drops.

  **Combination Method:**
  I am multiplying these probabilities ($0.40 \times 0.50 \times 0.90 \times 0.90 \approx 0.16$). This reflects the logical structure of your proposition: it is a conjunction of necessary conditions. If the mechanism isn't sufficient ($P_{\text{mech}}$), the cycle doesn't happen; if the institutions fail ($P_{\text{inst}}$), the cause isn't "pop/fiscal on their own"; if the signal or system coherence fails, the data is meaningless.

  **Sensitivity Analysis:**
  My final number is most sensitive to **$P_{\text{mech}}$ (Mechanism Sufficiency)**.
  *   *Why:* In a product of probabilities, the lowest term dominates the result, but conceptually, this is the core scientific claim. If $P_{\text{mech}}$ moves from 0.40 to 0.80 (because immiseration *does* cause collapse without elites), the headline credence jumps to 0.32, validating your intuition.
  *   *Moving Evidence:* A dataset of pre-industrial societies that underwent state collapse *without* evidence of elite fragmentation or intra-elite civil war. Currently, almost all recorded secular cycles involve elite-led revolts; finding a "pure peasant collapse" with a 200-year period would double this term.

  **Coherence Check:**
  Does the counterfactual hold together? **Barely.**
  The constraint "officeholders can't... pass wealth to kin" drags $P_{\text{coh}}$ down significantly in reality, though I kept the number high to honor your "if we had data" premise. In a real simulation, this rule likely causes capital flight or a shift to a non-extractive economy (e.g., subsistence only) within 100 years, making the society invisible to SDT metrics. This structural fragility is why I didn't assign $P_{\text{coh}}$ a value of 1.0; the society you described is thermodynamically unstable and requires constant energy input to maintain against entropy (elite formation).
