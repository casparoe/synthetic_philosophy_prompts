answer: |-
  You are right to be suspicious. The debate is often a stalemate because the combatants agree on the data but disagree on what counts as an *explanation* of that data. Deflationists think explaining the *function* of the word "true" exhausts the philosophical task. Inflationists think explaining the *property* picked out by the word is required.

  Here is the spec. It is designed for your specific constraint: **an agent applying a truth predicate to its own language.** This makes paradox central, not peripheral.

  ### I. The Spec: Desiderata for a Theory of Truth

  #### 1. Logical & Linguistic Function
  *   **The Generalization Constraint:** The theory must explain how "Everything the Pope says is true" functions as an infinite conjunction/disjunction device without requiring the agent to enumerate the sentences.
      *   *Why a requirement:* It is a brute fact of linguistic competence. We use the predicate this way.
      *   *Status:* **Non-negotiable.**
  *   **The Equivalence Schema (T-Schema):** The theory must validate *Tr(⌜p⌝) ↔ p* for the vast majority of sentences.
      *   *Why a requirement:* Without this, the truth predicate disconnects from the world. It becomes a different word.
      *   *Status:* **Non-negotiable** (though scope may be restricted).
  *   **Compositionality:** The truth value of a complex sentence must be determined by the truth values of its parts and the logical connectives.
      *   *Why a requirement:* Required for systematic semantics.
      *   *Status:* **Non-negotiable.**

  #### 2. Metaphysical & Explanatory Role
  *   **The Success of Action:** The theory must explain why agents who act on true beliefs generally succeed in their aims better than those who act on false ones.
      *   *Why a requirement:* It is an empirical regularity. If a theory makes this a cosmic coincidence, it fails.
      *   *Status:* **Non-negotiable.**
  *   **The Possibility of Error:** The theory must allow for a sentence to be meaningful, asserted, and *false*, even if ideal conditions of verification obtain (or fail to obtain).
      *   *Why a requirement:* Fallibilism. We recognize we are often wrong even when confident.
      *   *Status:* **Non-negotiable.**
  *   **Genuine Disagreement:** The theory must distinguish between "A asserts p, B asserts ¬p" (contradiction) and "A and B are using different conceptual frameworks."
      *   *Why a requirement:* The phenomenology of argument presumes we are tracking the same thing.
      *   *Status:* **Non-negotiable.**
  *   **Normativity:** The theory must account for the intuition that one *ought* to believe what is true.
      *   *Why a requirement:* Constitutive of the concept of belief.
      *   *Status:* **Explanatory Target** (Deflationists derive this from the schema; Inflationists from the nature of the property. Both must deliver it).

  #### 3. Formal & Paradoxical Constraints
  *   **Self-Application:** The language containing the truth predicate must be able to express truths about itself.
      *   *Why a requirement:* This is your setting. Human agents do this constantly ("This sentence is false," "I am lying").
      *   *Status:* **Non-negotiable.**
  *   **Paradox Handling:** The theory must handle the Liar, Strengthened Liar, and Curry paradox without triviality (explosion) and without ad-hoc hierarchies that ban self-reference.
      *   *Why a requirement:* If the theory explodes, it is useless. If it bans self-reference, it violates the Self-Application constraint.
      *   *Status:* **Non-negotiable.**
  *   **Gaps and Gluts:** The theory must take a stance on whether paradoxical sentences lack a truth value (gap) or have both (glut).
      *   *Why a requirement:* Classical logic + Self-Application + T-Schema = Inconsistency. Something must give.
      *   *Status:* **Forced Choice.**

  #### 4. Distinctions to Maintain
  *   **Truth vs. Warranted Assertibility:** It must be possible for a sentence to be true but unwarranted, and warranted but false.
      *   *Why a requirement:* Moore's Paradox ("It is raining but I don't believe it") is absurd, but ("It is raining but I have no evidence") is not.
      *   *Status:* **Non-negotiable.**
  *   **Predicate vs. Concept:** Having the word "true" is different from having a robust concept of correspondence/factuality.
      *   *Why a requirement:* Children use "true" before understanding metaphysics.
      *   *Status:* **Non-negotiable.**
  *   **Definition vs. Theory:** Defining the predicate (e.g., via T-schema) is not the same as explaining the property (e.g., correspondence).
      *   *Why a requirement:* One is semantics, one is metaphysics.
      *   *Status:* **Non-negotiable.**

  #### 5. The "Question-Begging" Items (Camp Preferences)
  *   **Conservativeness:** The demand that the truth theory prove no new sentences in the base language (e.g., arithmetic) that weren't already provable.
      *   *Verdict:* **Deflationist Preference.** Inflationists need truth to prove consistency of arithmetic (Gödel). If truth explains success, it must have logical strength.
  *   **Analysable Nature:** The demand that truth *must* have an essence (correspondence, coherence, utility).
      *   *Verdict:* **The Whole Question.** You cannot list "has an essence" as a desideratum. That is what the debate is about. However, "Explains Success" is a desideratum that often *forces* an essence.
  *   **Bivalence:** The demand that every sentence is either true or false.
      *   *Verdict:* **Camp Preference.** Often dropped to save consistency in self-application.

  ---

  ### II. The Impossibility Results (Where the Spec Breaks)

  You asked for the places where the list itself is the finding. There are two major collisions.

  #### 1. Tarski's Undefinability Theorem
  *   **The Conflict:** Classical Logic + Unrestricted T-Schema + Self-Application = Inconsistency.
  *   **The Trade-off:** You must drop one.
      *   *Drop Self-Application?* No. Violates your core setting.
      *   *Drop T-Schema?* No. Violates the meaning of "true."
      *   *Drop Classical Logic?* **Yes.**
  *   **Why this is the right drop:** Logic is a tool for preserving truth. If the tool breaks when applied to the concept of truth itself in a natural language setting, the tool is too rigid for the job. We must move to a paracomplete (K3) or paraconsistent (LP) logic for the boundary cases. This is the price of taking self-application seriously.

  #### 2. The Conservativeness Argument (Shapiro/Ketland)
  *   **The Conflict:** Deflationist Conservativeness + Explanatory Adequacy (Success/Math).
  *   **The Trade-off:** A conservative truth theory cannot prove the consistency of Peano Arithmetic (Con(PA)). But Con(PA) is true, and our trust in arithmetic seems justified by reflection principles involving truth. Furthermore, if truth explains why true beliefs lead to success, it must have causal/explanatory efficacy, which conservative predicates lack (they are "logically sterile").
  *   **Why this is the right drop:** **Drop Conservativeness.** If the truth predicate is merely a logical device, it cannot explain why believing *snow is white* helps you navigate snow. To explain the *Success of Action*, truth must track a robust feature of the world. To explain the reliability of arithmetic, truth must be strong enough to prove reflection principles. Deflationism buys consistency at the price of explanatory impotence.

  **The Single Knockout Item:**
  **Consistency with Classical Logic under Self-Application.**
  This knocks out Naive Truth, Tarskian Hierarchies (for your setting), and standard Deflationism (which usually relies on classical background logic to maintain simplicity). It forces the theory into non-classical waters or restricted schemas.

  ---

  ### III. The Committed Verdict

  Here is the final spec. Any theory that fails these is inadequate for your setting.

  1.  **Self-Application is Mandatory.** No Tarskian hierarchies that place truth outside the object language.
  2.  **Classical Logic is Optional (in the limit).** To save Self-Application and the T-Schema, you must accept truth-value gaps or gluts for pathological sentences.
  3.  **Conservativeness is Rejected.** Truth must be strong enough to prove Con(PA) and explain the reliability of induction.
  4.  **Truth ≠ Warrant.** Any theory collapsing these (e.g., strict verificationism) is out.
  5.  **Explanatory Depth Required.** It is not enough to say what "true" *means*; the theory must say why truth *matters* for action and inquiry.

  **Reasoning:** This spec prioritizes the *phenomena* (we use truth on ourselves, true beliefs help us win, math is consistent) over the *formal elegance* of classical logic or deflationary minimalism. It accepts that a theory of truth for self-reflective agents will be logically messy (non-classical) and metaphysically heavy (non-conservative).

  ---

  ### IV. Scorecard: How the Contenders Fare

  **1. Disquotationalism (e.g., Quine, early Horwich)**
  *   **Verdict:** **Fails.**
  *   **Why:** It satisfies the T-Schema and Generalization but fails the **Explanatory Depth** and **Conservativeness** constraints. It cannot explain why true beliefs lead to success (it treats truth as transparent, so it drops out of the explanation). It cannot prove Con(PA). It also typically crumbles on **Self-Application** unless it adopts non-classical logic, which most disquotationalists resist to maintain "logical purity."

  **2. Prosentential Theory (e.g., Grover, Camp, Belnap)**
  *   **Verdict:** **Fails.**
  *   **Why:** It handles **Generalization** brilliantly (treating "is true" as a pro-sentence anaphor). However, it struggles with **Success of Action** and **Normativity**. If "is true" is just a grammatical placeholder, it is hard to see why "believing what is true" is a norm distinct from "believing what is assertible." It treats truth as too thin to bear the weight of the **Error** constraint (how do you error if you're just using a placeholder?).

  **3. Substantive Correspondence (e.g., Armstrong, early Russell, some Realists)**
  *   **Verdict:** **Passes (with modifications).**
  *   **Why:** It excels at **Success of Action**, **Error**, and **Truth vs. Warrant**. It explains why truth is non-conservative (correspondence to facts is a robust relation).
  *   **The Catch:** It traditionally fails **Self-Application** (Tarski's worry). To pass your spec, a Correspondence theory must adopt a **non-classical logic** (e.g., Kripke's fixed-point theory grafted onto a correspondence metaphysics) to handle the Liar without hierarchies. If it insists on Classical Logic + Self-Application, it is inconsistent. If it accepts the logical cost, it is the only view that meets the Explanatory and Self-Application constraints simultaneously.

  **Final Word:** The spec demands a **Non-Classical Inflationism**. You must accept that truth is a robust property (to do the explanatory work) and that logic is revisionary (to handle the self-reference). Anything less is either explaining nothing or saying nothing about the agent using it.
