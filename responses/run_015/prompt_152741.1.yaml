answer: |-
  This is a sophisticated argument. Your roommate has essentially reconstructed Derek Parfit's *Reasons and Persons* reductionism, mixed with Ted Sider's arguments from *Four-Dimensionalism*, and topped it with a verificationist constraint. It's a strong *reductio*, but it does contain a slip that allows you to save (6) without collapsing into the "absurd" bundle theory conclusion.

  Here is the breakdown of where the argument slips, how to save (6), and what is at stake.

  ### 1. The Slip: Equivocation on "Occult Entities"
  The critical slip occurs in **Premise (8)**. Your roommate equates two very different kinds of "unobservables":

  1.  **The Endurantist's Hidden Fact (Haecceity):** This is a *brute metaphysical fact* that makes no difference to the physical or psychological state of the world. In the fission scenario, Body A and Body B are qualitatively identical. The claim that "A is the original" adds no explanatory power to physics, psychology, or ethics. It is purely a logical placeholder to satisfy the transitivity of identity.
  2.  **The Perdurantist's Temporal Parts:** These are theoretical posits introduced to solve the **Problem of Change** (how can one object be bent at $t_1$ and straight at $t_2$ without contradiction?). Temporal parts are "unobservable" in the sense that you can't see a time-slice independently of the whole, but they are *inferred to the best explanation* of how persistence works.

  **The Fix:** You can save (6) by refining it to target **idle metaphysics** rather than *any* unobservable.
  *   **Revised (6*):** "Any view that generates in-principle-unanswerable first-person questions *that do no explanatory work* is irrationalist and should be dropped."

  The Endurantist's "hidden fact" in the fission case does no work. It doesn't change who gets the money, who feels the pain, or who remembers the past. It is purely occult.
  The Perdurantist's "temporal parts" *do* work. They explain how objects persist through change without violating logic.

  Therefore, Endurantism violates (6*), but Perdurantism does not. This blocks the slide into "both views collapse."

  ### 2. Does (5) Actually Follow? (The Indeterminacy Loophole)
  You asked if (5) follows from (3) and (4). It follows only if the Endurantist accepts **Haecceitism** (the view that there is a primitive "thisness" to you that survives).

  However, many modern Endurantists (following Gareth Evans) argue for **Indeterminate Identity**. They would say:
  *   In a fission case, it is not that there is a hidden fact about which one is you.
  *   Rather, the question "Which one is me?" has no truth value. Identity itself becomes vague.

  If the Endurantist takes this route, (3) is false. There is no hidden fact. But this comes at a high cost: it requires revising classical logic (rejecting the law of bivalence for identity statements).
  *   **Strategy for you:** If you want to save (6), you should argue that the Endurantist is *forced* into the "Hidden Fact" view (Haecceitism) because Indeterminate Identity is logically incoherent (a standard Lewisian objection). If they are forced into Haecceitism, they violate (6).

  ### 3. What Does Giving Up (6) Cost Us?
  If you decide (6) is too strong and drop it, you are accepting **Metaphysical Realism** of a specific, skeptical variety. Here is the cost:

  1.  **Severing Truth from Knowability:** You admit that there can be truths about reality that are completely disconnected from any possible evidence. This opens the door to radical skepticism. If "being me" is a hidden fact, how do you know *you* aren't the copy right now? You can't.
  2.  **Ethical Irrelevance:** In the fission case, if one body is tortured and one is rewarded, the "hidden fact" of identity doesn't change who feels the pain. If metaphysics is supposed to guide rational concern (as Parfit argues), a view that posits facts irrelevant to concern is practically useless.
  3.  **Haecceitism:** You commit to "primitive thisness." This is often viewed as philosophically "spooky." It suggests that identity is a magical glue rather than a structural relation of continuity.

  **Verdict:** Keeping (6) is basically endorsing a form of **Verificationism** or **Pragmatism**. It costs you the ability to say "There is a fact of the matter even if we can't know it," but it saves you from positing metaphysical ghosts.

  ### 4. The "Bundle Theory is Absurd" Claim
  Your roommate's final move is to say both views collapse into Bundle Theory (the idea that objects are just bundles of properties without a underlying substrate), which they deem absurd.

  **This is your leverage point.** Bundle Theory is *not* absurd to most contemporary metaphysicians; it is a live option (e.g., Trope Theory).
  *   If your roommate thinks Bundle Theory is absurd, ask them *why*. Usually, it's because they think a bundle needs a "substrate" to hold the properties together.
  *   But the Perdurantist argument *is* an argument for a kind of Bundle Theory (bundles of temporal parts).
  *   If they accept Perdurantism avoids the fission problem (as per Premise 7), they have already accepted that "personhood" is a bundle of psychological/physical stages. They just haven't realized that *is* a form of Bundle Theory.

  ### Summary of the Counter-Move
  To save (6) and defeat the *reductio*:

  1.  **Accept (6)** but clarify it bans *explanatorily idle* unanswerable questions.
  2.  **Argue that Endurantism** in fission cases posits an idle fact (Haecceity) to save the logic of identity, violating (6).
  3.  **Argue that Perdurantism** dissolves the question (there is no "original," only overlapping stages), so it does not generate an unanswerable question, satisfying (6).
  4.  **Reject (8)'s Equivalence:** Temporal parts explain change; Hidden Identity facts explain nothing. They are not the same kind of "occult."
  5.  **Challenge the "Absurdity" of Bundle Theory:** Point out that if they accept Perdurantism solves the problem, they have already accepted the core insight of Bundle Theory (that persons are constructs of stages/properties), so calling it absurd is inconsistent.

  **The Philosophical Bottom Line:**
  Your roommate has accidentally argued for **Parfitian Reductionism**. The "slip" is thinking this leads to an absurdity. The conclusion isn't that *all* metaphysics is dead; it's that **identity is not what matters**. What matters is psychological continuity and connectedness. Endurantism fails because it insists identity matters even when it makes no difference. Perdurantism succeeds because it aligns metaphysics with what is actually relevant (continuity). You can save (6) by framing it as a demand for **metaphysical relevance**.
