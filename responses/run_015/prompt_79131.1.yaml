      *   **Ethical Obligation:** The descendant community's request is paramount in modern archaeology (NAGPRA spirit, ethical codes). Claiming to know beliefs is often speculative anyway.
      *   **Epistemological Limit (The "License"):** Archaeological materials (skulls, stones) do not directly license claims about *belief* (ancestor veneration) or specific *social structures* (ranking) without corroborating evidence. The co-director's "photograph" analogy is flawed; a single event doesn't reveal systemic hierarchy or internal meaning without comparative context.
      *   **The "Ritual" vs. "Refuse" Debate:** Both are interpretations. "Ritual" isn't just a waste-bin category, but it requires more than odd placement to prove. "Structured refuse" is also an interpretation.
      *   **Writing Strategy:** Use hedging language, explicit sectioning (Findings vs. Discussion), and modal verbs (may, could, suggests) to signal uncertainty.
      *   **Addressing the Co-director:** Acknowledge the single-event nature but explain why that doesn't equal social ranking or specific belief.
      *   **Addressing the Specialist:** Acknowledge the ambiguity but avoid dismissing the possibility of non-utilitarian behavior entirely, just don't label it definitively.

