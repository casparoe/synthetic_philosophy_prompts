prompt: |-
  I'm reading a popular book about how historians — and the rest of us — explain the past, and I want to know how much of its central argument to trust. Here is the passage that caught my attention, the book's summary of why narrative history misleads us:

  "A great deal of what passes for historical explanation is really a cognitive illusion with two parts. The first is hindsight bias: once we know how something turned out, we can no longer recover our former uncertainty, so we quietly rewrite the past so that it points at the outcome — after the fact, what happened looks like what had to happen. The second is the narrative fallacy: a mind cannot store or think about a bare sequence of events, so it compresses the sequence into a story with a beginning, a middle and an end, and in compressing it invents causal connections that were not really there. Put the two together and you get the ordinary history book: a chain of causes that made the outcome inevitable, reconstructed by someone who knows the ending and cannot unknow it. The moral the authors draw is that narrative history is closer to fiction than to science; that the cure is to replace 'why did this happen?' with 'how often does this sort of thing happen?' — base rates, counterfactuals, comparisons across cases; and that because large historical processes are chaotic in something like the way the weather is, tiny unknowable causes make the outcome unpredictable in principle, so any story about why it went one way rather than another is at best a guess."

  My instinct is that the first two-thirds of this is roughly right and that the move to the conclusion is not, but I can't say where it breaks. Would you audit it claim by claim and tell me the following: which sentences a working historian or a philosopher of historiography would accept as written; which are overstatements of a defensible thesis or conflations of two things that ought to be kept apart (I suspect the book treats hindsight bias and the narrative fallacy as two halves of a single mechanism when they may be separate effects with separate explanations, and I suspect it slides from "we cannot help imposing stories" to "the stories are probably false"); whether there is a third and distinct mistake the passage slides over — something like evaluating a causal claim using cases chosen because of their outcome rather than chosen by the values of the causes; whether "fallacy" is even the right label for what may be a limitation on how we represent sequences rather than an error in reasoning; and whether the recommended cure — trade "why" for "how often" — actually follows from the parts of the summary that are true, or needs an extra premise the book never states.

  Please also tell me whether the passage misdescribes what the psychological findings themselves actually show, and then rank the problems you find: which are fatal to the book's conclusion, which are sloppy but harmless, and whether there is any apparent error here that is in fact fine as stated.

  Please write your answer in American English, organize it as a claim-by-claim audit rather than a continuous essay, and don't spend time on names, papers or suggestions for further reading — I care about the distinctions, not the sources.
