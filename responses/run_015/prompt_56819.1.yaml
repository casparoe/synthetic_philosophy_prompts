prompt: |-
  You're a value theorist who has sat through a hundred of these end-of-term student presentations and knows exactly which single question undoes a paper like mine. I'm a third-year doing a module on wellbeing and the good life, and in a fortnight I'm giving the fifteen-minute slot (then half an hour of discussion) defending a view I've been calling tranquilism: the only thing that makes a life go well is the absence of craving, so pleasure, achievement, friendship and meaning don't add anything on top of a state where nothing is pressing on you. My argument roughly goes (1) every good we chase is either the satisfaction of a craving or a temporary lull in one, so the wanting is doing the work rather than the object; (2) therefore wellbeing can't be a running tally of satisfied desires, it's the absence of the wanting itself; (3) and this explains things the rival theories struggle with — why the thing you wanted for years goes flat within a month of getting it (on my view the craving has simply re-formed, it isn't that the pleasure faded), why we envy the contented more than we envy the ecstatic, why pain you've stopped fighting stops ruining your day. Im not claiming it's tight, I know step one is carrying an unfair amount of weight. I'm allowed a whiteboard but I write like a doctor, so everything has to work out loud.

  The room is about a dozen finalists plus the convenor. The convenor is a desire-satisfaction theorist who thinks every objective list is just a set of desires wearing a trenchcoat, so she'll want to know whether tranquilism is anything more than a desire theory with the desires restricted to second-order ones about your own desiring. Two of the students are objective-list types who'll fight me over achievement and friendship, and they're the ones who ask the little follow-up that makes you backtrack. One is a hedonist who has done the experience machine to death and thinks he's got me on a dial he can just turn up. Another did an Indian philosophy module last year and will say I'm rebranding the two-arrows parable, which I'd rather not get dragged into beacuse the convenor told us in week one to argue the view and not do exegesis, and I honestly don't have the background to survive that exchange. Two are policy-minded and will want to know what my view says about depression treatment, meditation apps, and whether it's just negative utilitarianism with extra steps.

  So: give me a proper prep sheet, not a defence of the thesis. Start by brainstorming every objection this particular room could plausibly raise — go wide, including ones that only make sense given who's in it — then cut and order them by how likely and how damaging they'd be together, maybe eight in the end. For each one, phrase it the way that person would actually phrase it (the convenor's version will not sound like the hedonist's), give me a reply I can deliver in under a minute standing up with no notes, and mark how soft that reply is, i.e. exactly what it concedes that I'd rather not concede. Then tell me which single reply has to land for the paper to survive at all, and what I should hand over voluntarily in my first two minutes to stop them circling it for the rest of the session. One more thing: I have a suspicion the killer question is whether my view can tell tranquillity apart from apathy — that someone who's stopped wanting anything because they've given up scores best on my account, which feels like a reductio. Tell me if that really is the worst one or if there's something worse that I'm not seeing, and if it is the worst one, what a third-year can honestly say to it without quietly abandoning the thesis. Please think it through carefully before you start writing.
