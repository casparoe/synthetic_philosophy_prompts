prompt: |-
  You are advising a small interdisciplinary research group—three philosophers of biology and two evolutionary psychologists—with three years of funding for conceptual, not empirical, work. Their focus is the long-running tension between adaptationist explanation and the Gould-Lewontin spandrels critique, particularly as it applies to evolutionary accounts of human cognition and behavior. To avoid well-trodden ground, they want to investigate a distinction that has received little direct conceptual attention: between classical spandrels (non-adaptive architectural byproducts of selection for other traits) and what might be called constraint-spandrels—structural features that are not themselves adaptive, yet actively delimit and reshape the space of possible subsequent adaptations, so that removing them would not merely erase a byproduct but collapse the adaptive landscape for later traits.

  Which open conceptual questions in this area should the group prioritize? Rank three to five questions, and defend the ordering with explicit criteria—such as upstreamness (how many other debates depend on this one), tractability for philosophers rather than bench biologists, current neglect, and practical impact. For each priority, specify: (a) the precise conceptual crux; (b) why resolving it is upstream of other work in evolutionary explanation; (c) why it is tractable for philosophers; (d) what kind of conceptual or formal result over the next few years would move it up or down your list; and (e) whether its resolution mainly affects evolutionary psychology, evolutionary medicine, or general philosophy of biology.

  Please respond in American English. Deliver your answer as a JSON object with a top-level key "priorities" containing an array of objects ordered by rank. Each object must include exactly these fields: "rank" (integer), "question_title" (string), "primary_domain" (string, one of: "evolutionary_psychology", "evolutionary_medicine", "philosophy_of_biology"), "conceptual_crux" (string), "upstream_reasoning" (string), "philosopher_tractability" (string), "shift_criterion" (string), and "dependency_note" (string describing which other listed priorities depend on its resolution). Also include a separate top-level field "ordering_rationale" (string) explaining the criteria and trade-offs used to establish the ranking. Do not provide bibliographies, reading lists, or citations; reason from the conceptual structure alone.
