answer: |-
  # Preparation Sheet: Buridan's Ass & Symmetry Breaking

  **To:** The Author
  **From:** [Consultant]
  **Re:** Q&A Strategy for Workshop

  You are walking a tightrope between metaphysics and mechanism. Your strength is the causal story; your vulnerability is the normative one. The audience knows you are a physicist; they will forgive technical imprecision in philosophy, but they will not forgive a category mistake that eliminates agency.

  Below are the eight objections you are most likely to face, ordered by the damage they could do to your thesis. Following that are your strategic concessions, the critical reply that must land, the specific danger in your physics analogy, and the question you fear.

  ---

  ### The Objections (Ordered by Damage)

  #### 1. The "Guidance Control" Objection (Group A: Philosophers of Action)
  **The Objection:** "You've explained how the donkey *moves*, but not how the agent *acts*. If the tie-breaking fluctuation is sub-personal noise, it bypasses the agent's will. On standard accounts of moral responsibility and agency, an event caused by random noise is something that *happens to* the agent, not something the agent *does*. You've solved the paralysis problem by eliminating the agent."
  **Your Reply (2 mins):** "I distinguish between the *initiation* of movement and the *authorization* of the outcome. My claim is that the noise provides the trigger, but the rational constraints provide the boundaries of authorization. If I choose between two permissible options, and noise selects one, I am still the author of the choice because I endorsed the set from which the selection was made. The noise is the motor, but rationality is the steering. We don't deny a driver is driving because the engine's combustion cycles are deterministic or stochastic processes they don't consciously control."
  **Soft Spot:** They will press on whether "endorsing the set" is enough for control over the *specific* outcome. If you couldn't have chosen otherwise given the exact same noise, do you have control?

  #### 2. The "Reasons-Responsiveness" Objection (Group A: Philosophers of Action)
  **The Objection:** "Rationality requires that actions be sensitive to reasons. If the selection between two options is determined by a fluctuation that is, by definition, orthogonal to the reasons (since the reasons are balanced), then the specific choice is reasons-blind. A mechanism that selects independently of reasons cannot be a rational mechanism."
  **Your Reply (2 mins):** "This conflates *requiring* a reason with *permitting* a choice. Rationality demands that reasons filter out inadmissible options. Once the reasons have done their work and left two permissible options, there is no further reason-fact to be sensitive to. Being reasons-responsive means not choosing the inadmissible option. Choosing between the admissible ones via noise is not irrational; it is arational, which is permissible once rational constraints are satisfied."
  **Soft Spot:** They may argue that rationality requires a *sufficient* reason for the specific choice, not just permission for the set.

  #### 3. The "Money Pump" Objection (Group B: Microeconomic Theorist)
  **The Objection:** "If you drop the completeness axiom, you open the agent to a 'money pump' (a sequence of trades where the agent pays to switch back and forth indefinitely, ending up poorer). If your agent is indifferent between A and B due to symmetry, but noise makes them pick A, and then the situation resets, can't they be exploited? Incomplete preferences usually lead to dynamic inconsistency."
  **Your Reply (2 mins):** "Money pumps rely on the agent preferring A to B in one context and B to A in another without new information. My model posits that the agent sees A and B as *equally permissible*, not that they prefer A then B. Once the noise selects A, the state changes. To pump them, you must reset the agent to the exact prior epistemic and physical state, which includes erasing the history of the first choice. In a non-equilibrium system, history matters; you cannot cycle back to the exact initial conditions without cost."
  **Soft Spot:** This relies on a specific view of "preference" vs. "choice." If they define preference revealed by choice, you are vulnerable.

  #### 4. The "Representation Theorem" Objection (Group B: Decision Theorist)
  **The Objection:** "You say completeness is a convenience. But without it, we cannot represent the agent's preferences as a utility function. If we can't model them with utility, your theory loses the predictive and explanatory power of decision theory. You are offering a causal story, not a normative model."
  **Your Reply (2 mins):** "I am not trying to save the utility function; I am trying to save the agent. Representation theorems are tools for the observer, not constraints on the agent. If the tool requires an idealization (completeness) that renders the agent paralyzed in symmetric cases, the tool is failing to capture the reality of choice. I am offering a causal mechanism that explains how choice is possible where your model predicts paralysis."
  **Soft Spot:** They may concede you explain *choice* but deny you explain *rational choice*.

  #### 5. The "Drift Rate" Objection (Group C: Experimental Psychologist)
  **The Objection:** "In sequential-sampling models, noise isn't just a tie-breaker at the end; it accumulates during evidence processing. You treat the symmetry as static until a fluctuation hits. But in real brains, the 'symmetry' is never perfect because the noise is part of the evidence accumulation (drift rate). Your physics analogy treats the noise as external to the computation, but in cognition, noise *is* the computation."
  **Your Reply (2 mins):** "That is a helpful correction to the mechanism, but it supports my thesis. If noise is integrated into the evidence accumulation, then the 'reasons' never perfectly balance to begin with. The outcome is still determined by the stochastic trajectory, not by a deterministic weighing of reasons. Whether the noise enters at the start or at the tie-break, the result is the same: the specific outcome is not dictated by the prior reasons, yet the agent moves."
  **Soft Spot:** She may argue that if noise is part of the evidence, the outcome *is* reason-based, just probabilistic, which undermines your claim that reasons run out.

  #### 6. The "On a Par" Objection (Group A: Philosophers of Action)
  **The Objection:** "You treat 'equally good' and 'on a par' as the same symmetric state. But many of us argue that when options are 'on a par,' the agent can create a reason through will (commitment). Your model makes the choice a physical accident, whereas the 'on a par' literature suggests it's an exercise of normative power."
  **Your Reply (2 mins):** "I agree the phenomenology feels like creating a reason. But my claim is that the *mechanism* enabling that feeling is the very fluctuation I describe. The 'will' you describe is the macroscopic name for the symmetry-breaking instability. I am not denying the authority of the will; I am naturalizing it. The 'creation' of a reason is the stabilization of a fluctuation into a commitment."
  **Soft Spot:** They may insist that normative power cannot be reduced to physical instability without losing its normative force.

  #### 7. The "Category Mistake" Objection (General/Group A)
  **The Objection:** "Reaction-diffusion systems do not have intentions. You are mapping a physical description onto a normative space. Even if the math is isomorphic, the ontology is different. A particle doesn't 'choose' to break symmetry; an agent does. You are explaining the vehicle, not the content."
  **Your Reply (2 mins):** "I am not claiming the agent is a particle. I am claiming that any physical realizer of an agent must obey physical laws. If physical laws dictate that a symmetric state is unstable and must resolve via fluctuation, then any agent instantiated in physics must do the same. The 'content' of the choice is constrained by rationality; the 'vehicle' of the selection is constrained by physics. Both must be true."
  **Soft Spot:** This is the standard supervenience objection. They may argue you've explained the necessary conditions but not the sufficient ones for agency.

  #### 8. The "Stipulative Definition" Objection (Group B: Decision Theorist)
  **The Objection:** "You are redefining 'rationality' to mean 'not paralyzed.' But standardly, rationality implies optimality. If you choose via noise, you aren't optimizing. You've solved the puzzle by changing the meaning of the words."
  **Your Reply (2 mins):** "I am not redefining rationality; I am refining the scope of its application. Rationality evaluates reasons. Where reasons are silent, rationality has no purchase. To demand optimality where reasons are equal is to demand rationality do work it cannot do. My definition preserves the link between rationality and reasons, rather than stretching rationality to cover causal gaps."
  **Soft Spot:** They may argue that rationality *requires* forming a preference, not just having a permissible set.

  ---

  ### Strategic Concessions (First 2 Minutes)

  Before you take questions, offer this concession to disarm the "Agency" crowd:

  > "I want to concede immediately that a fluctuation alone does not constitute an action. If a sneeze makes me knock over a vase, that is not a choice. My thesis is not that noise *makes* the action, but that noise *enables* the action where reasons are silent. The agency comes from the prior constraint of the admissible set and the subsequent endorsement of the outcome. If I do not make that distinction clear, I have failed."

  **Why:** This pre-empts Objection #1 by acknowledging that noise isn't sufficient for agency, positioning your theory as a *component* of agency, not a replacement for it.

  ---

  ### The "Must-Land" Reply

  If only one reply lands, it must be this one (related to Objection #2):

  **The Point:** **Rationality constrains the admissible set, not the selection within it.**

  **Why:** Your entire paper rests on the claim that Buridan's Ass is a puzzle only because we demand rationality dictate the *selection*. If you concede that rationality must dictate the specific choice between symmetric options, your physics analogy becomes irrelevant. You must hold the line that *permission* is the full extent of rationality's demand in symmetric cases. If you waver here, you return to the standard puzzle.

  ---

  ### Where Your Physics Analogy is Misleading

  You asked specifically for this. Here is the danger zone:

  **The Problem:** In your chemical systems, the symmetry breaking is **blind**. The system does not "care" which state it falls into. In an agent, the symmetry breaking is **integrated into a goal-directed architecture**.

  **The Risk:** If you imply the agent is passive regarding the fluctuation, you lose agency. In a chemical reaction, the fluctuation *is* the cause. In an agent, the fluctuation is a *tool* used by the system to achieve a goal (moving).
  **Correction:** Emphasize that the agent is a **nonequilibrium system maintained far from equilibrium by goal-directed processes**. The noise isn't just external interference; it is internal variability that the system exploits to escape local minima. Don't let them think you are saying the agent is a passive bucket of chemicals. The agent *uses* the noise.

  ---

  ### The Question You Hope Nobody Asks

  You were right to have a sinking feeling. Here it is:

  **The Question:** "If the fluctuation determines the outcome, and the fluctuation is not under your control, in what sense is this a **voluntary** action? Did you choose the hay, or did the noise choose it for you?"

  **Why it's dangerous:** It cuts straight to the "Guidance Control" objection but phrases it in plain English rather than technical jargon. It forces you to admit that, on your view, the specific direction of the will is not fully determined by the "self."

  **How to handle it:** Do not deny the lack of control over the *fluctuation*. Instead, pivot to control over the *constraints*.
  **Reply:** "I do not control the flip of the coin, but I control whether I accept the coin toss as a valid way to decide. A rational agent, faced with symmetric options, can authorize noise as a tie-breaker. The voluntariness lies in the authorization of the mechanism, not the micro-details of the mechanism's operation."

  ---

  ### On "So-and-So Already Said This"

  If someone says: *"Elster / Ullmann-Margalit already argued that randomization is a rational strategy for tie-breaking."*
  **The Answer:** "They argue for randomization as a *deliberate strategy* (e.g., flipping a coin consciously). I am arguing that randomization is the *sub-personal mechanism* of all choice when reasons run out, whether we intend it or not."

  If someone says: *"Burke / Dennett already naturalized free will this way."*
  **The Answer:** "They focus on the evolution of the capacity. I am focusing on the instantaneous mechanics of the decision event itself."

  Good luck. Stick to the distinction between the *set* (rational) and the *point* (causal).
