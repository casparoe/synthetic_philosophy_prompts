answer: |-
  You have identified a robust and documented sociological phenomenon, but there is **no single canonical term** (like "gaslighting" or "gentrification") that exclusively names this specific configuration of moral cultures.

  However, the configuration you describe is recognized in legal sociology, evolutionary psychology, and organizational theory. Below is an breakdown of the nearest existing concepts, a proposed term for precision, an analysis of the reverse case, and an answer to whether this breaks the tripartite typology.

  ### 1. The Nearest Existing Concepts

  While no single word exists, three frameworks describe parts of what you are seeing:

  **A. Legal Pluralism (Sociology of Law)**
  This is the strongest academic fit. Legal pluralism occurs when two or more legal systems (or normative orders) coexist in the same social field. In your example, the "Honor Code" is the customary law of the in-group, and the "Safety/HR Code" is the state/institutional law of the out-group.
  *   **Difference:** Legal pluralism usually refers to *systems* (e.g., State Law vs. Religious Law), whereas you are describing *psychological/behavioral registers* within a single group's mindset.

  **B. Parochial Altruism (Evolutionary Psychology)**
  This describes the tendency to be altruistic and cooperative toward the in-group while being hostile or competitive toward the out-group.
  *   **Difference:** This explains the *motivation* (loyalty), but not the *mechanism* of dispute resolution (self-help vs. third-party appeal).

  **C. Moral Code-Switching**
  Sociologists do use this term, but as you noted, it is often diluted to mean linguistic or behavioral adjustment. However, recent work (e.g., by Desmond or Vitale) uses it to describe shifting moral frameworks to survive different environments.
  *   **Difference:** You are correct to distinguish this. Code-switching implies changing *self-presentation*. Your observation is about changing the *mechanism of justice*.

  ### 2. A Proposed Term: "Boundary-Conditional Moral Dualism"

  Since a canonical term is missing, the most precise descriptive label for this configuration is **Boundary-Conditional Moral Dualism** (or **Strategic Normative Segmentation**).

  **Definition:** A stable social configuration where a group employs distinct, contradictory moral dispute-resolution mechanisms based strictly on the group membership of the antagonist.
  *   **Internal Register:** Honor-based (self-help, reputation, direct retaliation).
  *   **External Register:** Dignity/Victimhood-based (appeal to authority, publicization of harm, rule-enforcement).
  *   **Status Mechanism:** High status is awarded to individuals who can successfully navigate both registers without contaminating them (i.e., not bringing HR into an internal fight, not starting a fistfight with a regulator).

  **Boundary Cases:**
  *   **The "Snitch":** Someone who uses the External Register on an Internal conflict. They lose status because they violated the boundary condition.
  *   **The "Loose Cannon":** Someone who uses the Internal Register on an External conflict. They lose status because they endanger the group by bypassing protective authorities.
  *   **The Collapse:** If the group shrinks or trust evaporates, the Internal Honor register often collapses into the External Authority register (the group begins policing itself like outsiders).

  ### 3. The Reverse Arrangement: "Institutional Belligerence"

  You asked about the reverse: **Internal Authority/Dignity + External Honor/Retaliation.**

  This is the default operating system of **Bureaucracies, Corporations, and Modern States.**

  *   **Internal:** Disputes are handled via HR, compliance, rules, and safety language. Direct retaliation (fighting a coworker) is forbidden. Vulnerability is managed through official channels.
  *   **External:** The entity engages in ruthless competition, litigation, lobbying, or warfare. It does not appeal to a higher authority when slighted by a competitor; it retaliates directly (market share, lawsuits, force).
  *   **Term:** **Institutional Belligerence** (or **Bureaucratic Honor**).
  *   **Example:** A tech company that fires employees for "tone" violations internally but sues competitors into bankruptcy externally.
  *   **Status:** High status goes to those who can navigate internal compliance while delivering external aggression (the "effective executive").

  ### 4. Does This Break the Tripartite Typology?

  **No, it does not break the typology; it clarifies its scope.**

  The Honor/Dignity/Victimhood typology (popularized by Campbell and Manning) is often misinterpreted as describing *monolithic* cultures. In their actual work, they acknowledge that cultures are **ecologies**, not monoliths.

  *   **Gravitational Centers:** The typology describes the *dominant gravitational center* of a society, not the exclusive setting. A "Dignity Culture" (like the modern US) can contain Honor subcultures (gangs, military, sports teams) and Victimhood subcultures (campus activism, HR departments).
  *   **Functional Segmentation:** Your observation highlights that these cultures are often **segmented by relationship type** rather than geography or time.
      *   *High-trust relationships* tend toward Honor (because third-party enforcement is too slow/costly).
      *   *Low-trust relationships* tend toward Authority/Victimhood (because self-help is too risky).

  **Why it looks like a contradiction:**
  It feels like a contradiction because we expect moral consistency to be a virtue. But functionally, this dualism is **adaptive**.
  *   **Internal Honor** preserves group cohesion and autonomy (you solve your own problems).
  *   **External Victimhood/Authority** preserves group safety and resources (you use the Leviathan to protect you from outsiders).

  ### Summary

  You are observing **Boundary-Conditional Moral Dualism**. It is not hypocrisy because it is a consensual, functional strategy for maximizing group cohesion (via internal honor) while minimizing external risk (via external authority). It does not break the tripartite typology but rather demonstrates that moral cultures are toolkits selected by context, not immutable identities. The reverse case is **Institutional Belligerence**, typical of large organizations that demand internal compliance but wage external war.
