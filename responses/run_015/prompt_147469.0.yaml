prompt: |-
  hey — im a junior and im doing History Day this year (senior division, individual exhibit) and ive got my 5 minute talk and then the judges hit me with questions and honestly the Q&A is the part im scared of, way more than the talk.

  my project is on the 1815 Tambora eruption and the 1816 "year without a summer", and my thesis is basically that Tambora shouldn't be in the story as backdrop or as a trigger that sets off real human history, it should be in there as one of the actors — but without doing the determinist thing where the mountain decides everything and people just starve on schedule. way im trying to do that is a criterion im calling "option-space agency" (tell me if that sounds dumb and ill change it): a non-human thing counts as an actor in a historical explanation if (1) it changed which options were actually available or affordable to the people in the story, and not just which ones they picked, and (2) that change didn't come from what those people believed about it. so germs and volcano winters pass, and I get to say Tambora narrowed the option space for whoever was deciding grain policy in 1816 without saying it caused the famine. second part of my argument is that the archives are biased toward human agency anyway because intentions get written down and microbes dont, so historians over-credit deliberation. i like that bit but im not sure its definately load bearing. there's also a case im unsure about: a rumor that panics a city changes what people can do, but only through beliefs, so my rule (2) kicks it out — which feels wrong to me and I dont know what to do with it yet.

  the judges are: two career high school history teachers, one of them runs the AP world history program at her school and hands out a whole thing about not blaming geography for everything; a university geography professor who does natural hazards and vulberability research; and a public health grad student. 5 minutes of questions, all of them at once.

  can you build me a prep sheet? like 7-9 objections in the order they'll probably actually come, ranked by how much damage theyd do, each one phrased the way *that* person would say it out loud (the hazards guy is gonna say exposure and vulnerability a lot; the AP teacher is gonna say that agency is a word that already means something and im not allowed to just redefine it; the public health person will probably want to know what my criterion would say about a modern outbreak response). for each: what I say in ~45 seconds, what I should just concede up front so I dont look stubborn, and where my answer is thin. and include the one im hoping nobody asks — my guess is the "so is my alarm clock an actor, does every cause with causal power get a name card" line, but if you think there's something worse waiting for me im begging you to say so.

  last thing: at the end tell me honestly which of these objections would actually change *your* mind about whether "option-space agency" is doing real work or is just causation with better PR, and flag the parts of the prep sheet where your just guessing what those judges are like — id rather know which bits to actually memorize and which to improvise.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Project:**
      *   **User:** Junior student, competing in Senior Division Individual Exhibit for National History Day (NHD).
      *   **Topic:** 1815 Tambora eruption & 1816 "Year Without a Summer."
      *   **Thesis:** Tambora shouldn't be backdrop/trigger but an *actor*. Avoids determinism (mountain decides everything) by using a criterion called "option-space agency."
      *   **Criterion Definition:** Non-human = actor if (1) it changed available/affordable options (not just choices), AND (2) that change didn't come from human *beliefs* about it (excludes rumors/panic).
      *   **Secondary Argument:** Archives bias toward human agency (intentions written down, microbes don't), leading historians to over-credit deliberation.
      *   **Uncertainty:** The "rumor" case (belief-driven option narrowing) feels excluded by rule (2) but intuitively feels like agency.
      *   **Judges:**
          1.  HS History Teacher (AP World lead, anti-geographic determinism).
          2.  University Geography Professor (Natural hazards, vulnerability, exposure).
          3.  Public Health Grad Student (Modern outbreak response, systems).
      *   **Format:** 5-minute Q&A, all judges at once.
      *   **Request:** Prep sheet with 7-9 objections (ranked by damage), phrased like the specific judges, including response strategy (45-sec answer, concessions, thin spots), the "scary question," and honest feedback on the theory's validity + meta-commentary on the advice.

  2.  **Deconstruct the Theory ("Option-Space Agency"):**
      *   *Strengths:* Nuanced middle ground between determinism and pure constructivism. Addresses the "black box" of non-human influence.
      *   *Weaknesses:* Rule (2) (no beliefs) is tricky. Does a volcano count if people *believe* it's a god's anger and flee? (User says no, but maybe that's too strict). The "Alarm Clock" reductio ad absurdum is the biggest philosophical risk. The distinction between "changing options" vs. "causing outcomes" needs to be sharp.
      *   *NHD Context:* NHD loves thesis-driven projects but penalizes historical determinism heavily. The "agency" terminology needs to align with historical thinking skills.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Judge 1 (AP Teacher):* Concerned about "agency" definition and determinism.
          *   *Objection:* "Agency implies intent. You're redefining a core historical term."
          *   *Objection:* "This sounds like geographic determinism with extra steps."
      *   *Judge 2 (Geo Professor):* Concerned with vulnerability/exposure models.
          *   *Objection:* "In hazards research, we separate hazard (volcano) from vulnerability (social structure). You're blurring them."
          *   *Objection:* "What about adaptation? People changed options back."
      *   *Judge 3 (Public Health):* Concerned with systems and belief.
          *   *Objection:* "In public health, belief *is* a vector. If people believe water is bad, they don't drink it. Your Rule 2 excludes this."
          *   *Objection:* "How does this apply to modern policy? Is CO2 an actor?"
      *   *General/Philosophical:*
          *   *Objection:* "The Alarm Clock Problem" (Causal power vs. Agency).
          *   *Objection:* "The Archive Bias" (Is this just source criticism?).

      *   *Ranking by Damage:*
          1.  The "Agency" Definition (AP Teacher) - Hits the core vocabulary.
          2.  The "Determinism" Accusation (AP Teacher) - NHD kiss of death.
          3.  The "Belief/Rule 2" Contradiction (Public Health) - Exposes the theoretical crack.
          4.  The "Alarm Clock" Reductio (Any Judge) - Makes the theory look silly.
          5.  Hazards/Vulnerability Distinction (Geo Prof) - Shows lack of interdisciplinary knowledge.
          6.  Archive Bias Load-Bearing (All) - Is it necessary?
          7.  Modern Application (Public Health) - Tests scalability.

  4.  **Developing Responses:**
      *   *Strategy:* Concede the semantic point, pivot to the *utility* of the definition. Admit determinism is bad, emphasize the "option space" constraint vs. outcome determination.
      *   *Rule 2 Fix:* Acknowledge the rumor problem. Maybe refine Rule 2 to "independent of human *validation*" or admit it's a limitation for *material* history specifically.
      *   *Alarm Clock:* Distinguish between *mechanical causation* and *structural constraint*. An alarm clock wakes you; Tambora starves a region. Scale and irreversibility matter.

  5.  **Refining the "Honest Feedback" Section:**
      *   Need to tell the user if "option-space agency" holds water.
      *   *Verdict:* It's actually quite sophisticated (Actor-Network Theory adjacent), but Rule 2 is the weak link. The "Alarm Clock" question is the real killer.
      *   *Meta-Commentary:* I need to flag where I'm simulating judge personas vs. where I know NHD rubric specifics.

  6.  **Writing the Prep Sheet (incorporating tone and constraints):**
      *   *Tone:* Encouraging but rigorous. "Senior Division" means high expectations.
      *   *Structure:* Follow the user's requested format exactly (7-9 objections, ranked, specific judge voices, 45-sec response, concessions, thin spots).
      *   *Specifics:* Ensure the Geography Prof uses "exposure/vulnerability." Ensure AP Teacher mentions "AP World" or "historical thinking skills."

  7.  **Review against Constraints:**
