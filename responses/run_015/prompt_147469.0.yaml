      *   Ranked by damage? Yes.
      *   Phrased like specific judges? Yes.
      *   45-sec response/concession/thin spot? Yes.
      *   "Hope nobody asks" question included? Yes.
      *   Honest feedback on theory validity? Yes.
      *   Flagging AI guesses? Yes.

  8.  **Final Polish:** Check the "Rule 2" rumor issue. The user is worried Rule 2 excludes rumors. I should advise them that for *this* project (volcano), Rule 2 protects them from "people believed the volcano was angry," but they need to admit rumors are a different *kind* of agency (discursive vs. material). Don't try to fix the whole theory in Q&A, just defend the boundary.

      *(Self-Correction during drafting)*: Wait, the Geography Prof might actually *like* the theory if framed as "hazard modifies vulnerability." I need to make sure the objection reflects the tension between "hazard as event" vs "hazard as actor."
      *(Self-Correction on Rule 2)*: The user says Rule 2 excludes rumors. The Public Health judge will pounce on this because misinformation *kills*. I need to make sure the response acknowledges this limitation without collapsing the thesis.

      *(Final check on "Alarm Clock")*: This is definitely the "hope nobody asks" question. It's the standard philosophical objection to material agency.

      *(Final check on Judge Personas)*:
      *   AP Teacher: Pedantic about terminology, worried about "geography is destiny."
      *   Geo Prof: Technical, "exposure," "resilience," "hazard vs. disaster."
      *   Public Health: Systems thinking, "vector," "intervention," "belief as data."

      Let's assemble.

