      *Let's refine the "Visibly Costly" moments.*
      In Q6 (Symmetry), if she argues that *context* protects against state misuse, she concedes that the *text* isn't the primary agent of change, which weakens her thesis that textbook reform is the key.
      In Q8 (Assessment), if she argues for new assessment models, she admits her theory requires systemic overhaul beyond textbooks, making her proposal impractical.

      *Wait, I need to make sure I don't sound like an examiner.* The prompt asks for questions *I* (the student) ask. The output should be the script for the interview.

