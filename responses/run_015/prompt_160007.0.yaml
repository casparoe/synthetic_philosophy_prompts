  7.  **Final Polish:** Check the flow. Ensure the transition from "What is it?" to "How does it work?" to "What are the risks?" is smooth. (Self-Correction: Make sure Q1 and Q2 aren't *too* soft, or she will breeze through them. They need to set the trap slightly.)

      *Let's refine Q1 & Q2 to be more substantive.*
