answer: |-
  Here is a draft of ten questions, ordered from accessible to pressing, designed for your interview with Dr. Sarkar. I have included her likely response and a follow-up for each, with specific attention paid to the two "costly" moments you requested (in Questions 6 and 8).

  **1. Introduction: The Student Experience**
  **Question:** Dr. Sarkar, thank you for coming. In your book, you suggest that when people fight about history textbooks, they think they are fighting about facts, but they are actually fighting about who gets to be the main character of the story. From where I am sitting, though, the disagreement feels very real—for example, did the American Founding Fathers intend to protect slavery or not? If I'm a student hearing both sides, why should I believe the facts aren't the real problem?
  **Likely Answer:** She will likely argue that both sides accept the *existence* of the documents (the facts) but disagree on which documents get to drive the narrative (the agency). She will say the dispute is about *significance*, not *occurrence*.
  **Follow-up:** So, if the dispute is about significance, isn't significance just a polite word for "which facts we choose to prioritise"? If you change the priority, haven't you effectively changed the facts that matter to us?

  **2. Defining the Solution**
  **Question:** You propose "double-subject narration" as the remedy. Could you describe, in plain English, what that actually looks like in a sentence? If a normal textbook says "The British Empire colonised India," how does a double-subject version rewrite that without just making the sentence confusing?
  **Likely Answer:** She will explain that the sentence structure would shift agency back and forth, perhaps highlighting Indian agency in resistance or adaptation alongside British agency in administration, without resolving which force was dominant.
  **Follow-up:** But if the sentence refuses to say which force was dominant, aren't we teaching students that history is just a tug-of-war where no one ever wins? Does that prepare us for the real world where power imbalances are very definite?

  **3. The Empirical Premise (Facts)**
  **Question:** I want to press on your starting point. You argue that rivals in the 1619 Project versus the 1776 Commission debate share a factual record. But the 1619 Project argues slavery was central to the American founding, while the 1776 Commission argues it was an aberration. Surely one of those claims about causality has to be factually wrong? If your whole solution depends on them agreeing on the facts, what happens if they actually don't?
  **Likely Answer:** She will likely contend that causality is an interpretive layer, not a brute fact. She will argue that both sides accept the *dates* and *events*, but disagree on the *narrative arc*.
  **Follow-up:** But in a classroom, causality *is* the fact we are tested on. If you tell us the causal disagreement is just a "subject choice," aren't you effectively taking the 1619 side's framing—that slavery is the central subject—and treating it as the settled baseline for the debate?

  **4. Grammar and Morality**
  **Question:** You use a lot of grammatical vocabulary—subjects, agents, passive voice. I worry that this might be a metaphor that's doing too much work. Is saying "Korea is the subject of the sentence" actually anything more than a vivid way of repeating the original moral disagreement? Does changing the grammar actually change the morality, or does it just hide it?
  **Likely Answer:** She will argue that grammar structures thought. By altering the grammatical subject, we alter the cognitive habit of assigning blame or credit, which is a moral shift in itself.
  **Follow-up:** If grammar structures thought, though, isn't it risky to use a grammatical trick to solve a moral problem? Are we teaching students to analyse history, or are we teaching them to be manipulated by sentence structure?

  **5. The Specimen (Practical Application)**
  **Question:** Let's try to make this concrete. Could you draft a specimen paragraph for a GCSE-age reader about the arrival of the first enslaved Africans in Virginia in 1619 using your double-subject method? More importantly, once a pupil has read that paragraph, what is one specific thing they should be able to *do* that they couldn't do after reading a standard textbook?
  **Likely Answer:** She will provide a passage where the agency of the enslavers and the enslaved is interwoven without a concluding judgment. She will say the pupil gains the ability to hold two conflicting truths simultaneously.
  **Follow-up:** Holding two truths is a valuable skill, but history exams usually ask us to argue for one interpretation. If the textbook trains us to hold ambiguity, but the exam demands a verdict, aren't you setting us up to fail the assessment?

  **6. Symmetry (The State's Use)**
  **Question:** Your framework seems symmetrical. If a democratic society can use double-subject narration to include marginalized voices, couldn't an authoritarian ministry use the same technique to blur the state's responsibility? If the text never declares the "true subject," couldn't a government use that ambiguity to hide their own agency in a crime?
  **Likely Answer:** She will likely argue that context matters. In a democracy, teachers and open debate provide the safeguards against misuse that an authoritarian regime lacks. The text is only one part of the ecosystem.
  **Follow-up:** **[Visibly Costly Moment 1]** But if the safeguards are the *teachers* and the *debate*, and not the text itself, doesn't that undermine your main argument? If the textbook can't do the work on its own, why are we rewriting the textbooks instead of just training the teachers?

  **7. Explicitness (Meta-History)**
  **Question:** Following on from that: ought teachers to tell pupils explicitly that the choice of subject is a political choice, or should the narration do this silently? If you tell us, does it break the immersion of history? If you don't tell us, isn't it a bit deceptive?
  **Likely Answer:** She will probably advocate for a middle ground: teachers should scaffold the reading without explicitly politicising every paragraph, allowing the student to discover the ambiguity.
  **Follow-up:** But if the teacher has to scaffold it, doesn't that mean the text has failed to communicate on its own? Are we relying on the text to teach history, or to teach us how to read the text?

  **8. Assessment (Marking)**
  **Question:** I need to ask about marking. I cannot see how an examiner marks an answer when the subject of the sentence has been deliberately destabilised. If I write an essay arguing that the State was the primary agent, but the textbook says the agency is shared, do I lose marks for being decisive?
  **Likely Answer:** She will suggest that assessment needs to evolve to reward complexity and nuance rather than definitive conclusions. We should mark on the quality of the argument, not the certainty of the claim.
  **Follow-up:** **[Visibly Costly Moment 2]** But assessment systems change very slowly, while textbooks change every few years. If your method requires a revolution in grading before it can work, aren't you proposing a solution that is impossible for my generation to use? Are we supposed to wait for the exam boards to catch up?

  **9. Scope (Textbooks vs. History)**
  **Question:** Is this a claim about school textbooks in particular, or about historical writing generally? If it's about history generally, what is left that is distinctive about the classroom? If it's only for schools, are you treating students differently than professional historians?
  **Likely Answer:** She will argue it is a pedagogical tool specifically for the classroom, where the goal is civic formation rather than professional research.
  **Follow-up:** If the goal is civic formation, isn't that a political goal rather than a historical one? Are you asking history teachers to do the work of citizenship teachers, and does that dilute the history?

  **10. Falsifiability (Changing Her Mind)**
  **Question:** Finally, what would count against you? What classroom outcome, or what finding about how pupils actually read such passages, would make you abandon the prescription? If students read your double-subject passages and still just pick the side that matches their politics, has your theory failed?
  **Likely Answer:** She will likely say that if students show no increase in cognitive empathy or ability to articulate the opposing view, the method has failed. It is an empirical claim.
  **Follow-up:** So if we run a trial and find that ambiguity just makes students more cynical about truth rather than more empathetic towards the "other," you would recommend we go back to single-subject narratives?
