  I derive the headline figure by treating the proposal as a chain where the "Compressible case" (Term 4) and "No overreach" (Term 5) act as bottleneck constraints on the strong foundation provided by Terms 1, 2, and 3. While the information-theoretic approach is the right *direction* (Terms 1 & 2 are high), the specific mechanism of "bits to name the number" fails the stress test of compressible utilities (Term 4 is low). The headline 0.52 reflects that this is a necessary component of the solution, but insufficient as a standalone fix without modifying how "leverage" is encoded.

