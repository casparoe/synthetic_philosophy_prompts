answer: |-
  # Decision Tree: The Logical Space of Precaution

  **Context:** This taxonomy maps the Precautionary Principle (PP) not by author, but by logical commitment. It is tested against three cases:
  1.  **Gene Drive:** Anthropogenic intervention; risk = non-target extinction (catastrophic); benefit = malaria eradication (justice).
  2.  **Geoengineering:** Anthropogenic intervention; risk = albedo feedback (catastrophic); status quo risk = climate collapse (catastrophic).
  3.  **Pesticide Ban:** Regulatory intervention; risk = farm collapse (justice); status quo risk = pollinator decline (graded/ecological).

  **The Four Diagnostic Splits:**
  1.  **Scope:** Does precaution apply only to *anthropogenic interventions* (Action), or also to *failures to mitigate natural/status-quo risks* (Symmetric)?
  2.  **Trigger:** Is the trigger a *binary threshold* (non-negligible possibility of catastrophe) or *graded* (probability × severity continuum)?
  3.  **Burden:** Who must provide evidence? The *Proponent of Action*, the *Opponent of Inaction* (i.e., one claiming status quo is dangerous), or is the framing *Incoherent*?
  4.  **Justice Conflict:** When precaution conflicts with distributive justice (e.g., farm collapse, malaria persistence), is precaution a *Veto*, a *Weighted Override*, or does the principle *Dissolve*?

  ---

  ## I. The Decision Tree

  ```text
  ROOT
  │
  ├── SPLIT 1: SCOPE
  │   ├── A. Action-Only (Anthropogenic risks only)
  │   │   ├── SPLIT 2: TRIGGER
  │   │   │   ├── i. Binary (Catastrophe Threshold)
  │   │   │   │   ├── SPLIT 3: BURDEN → Proponent of Action
  │   │   │   │   │   ├── SPLIT 4: JUSTICE
  │   │   │   │   │   │   ├── X. Veto ──────────────────────► LEAF 1
  │   │   │   │   │   │   └── Y. Weighted Override ─────────► LEAF 2
  │   │   │   │   │   └── (Burden on Opponent/Incoherent) ──► LEAF 9 (Empty)
  │   │   │   │   └── i. Graded (Plausibility × Severity)
  │   │   │   │       ├── SPLIT 3: BURDEN → Proponent of Action
  │   │   │   │       │   ├── SPLIT 4: JUSTICE
  │   │   │   │       │   │   ├── X. Override ──────────────► LEAF 3
  │   │   │   │       │   │   └── Y. Dissolves ─────────────► LEAF 4
  │   │   │   │       └── SPLIT 3: BURDEN → Incoherent ─────► LEAF 5
  │   │   │   └── (Symmetric Scope branch below)
  │   │   └── B. Symmetric (Action + Omission Risks)
  │   │       ├── SPLIT 2: TRIGGER
  │   │       │   ├── i. Graded (Binary rare in symmetric)
  │   │       │   │   ├── SPLIT 3: BURDEN → Opponent of Inaction
  │   │       │   │   │   ├── SPLIT 4: JUSTICE
  │   │       │   │   │   │   ├── X. Override ──────────────► LEAF 6
  │   │       │   │   │   │   └── Y. Veto ──────────────────► LEAF 7
  │   │       │   │   └── SPLIT 3: BURDEN → Incoherent ─────► LEAF 8
  │   │       │   └── i. Binary ────────────────────────────► LEAF 10 (Empty)
  │   │       └── (Action-Only branch above)
  │   └── (Scope determines Burden coherence)
  ```

  ---

  ## II. Leaf Catalog (Positions)

  **Leaf 1: Strong Deontological Precaution**
  *   **Coordinates:** Action-Only | Binary | Burden: Pro-Action | Justice: Veto.
  *   **Description:** Novel interventions risking catastrophe are forbidden regardless of benefit. The status quo (even if dangerous) is not subject to precaution.
  *   **Case Verdict:** (1) Ban Gene Drive (extinction risk); (2) Allow Warming (natural/status quo risk); (3) Ban Pesticide (sublethal risk may not meet binary threshold, but if it does, ban overrides farms).
  *   **Status:** Named (Strong PP).

  **Leaf 2: Threshold Prioritarianism**
  *   **Coordinates:** Action-Only | Binary | Burden: Pro-Action | Justice: Override.
  *   **Description:** Catastrophic risks create a high barrier, but distributive catastrophe (malaria, famine) can override ecological risk if severe enough.
  *   **Case Verdict:** (1) Permit Gene Drive (malaria severity overrides pollinator risk); (2) Ban Geoengineering (albedo risk outweighs climate risk); (3) Ban Pesticide (unless farm collapse is deemed equally catastrophic).
  *   **Status:** Named (Moderate PP).

  **Leaf 3: Weak Regulatory Precaution**
  *   **Coordinates:** Action-Only | Graded | Burden: Pro-Action | Justice: Override.
  *   **Description:** Risk is continuous. Burden is on innovators to show safety, but decisions are made via weighted risk-benefit analysis.
  *   **Case Verdict:** (1) Permit with monitoring; (2) Permit with caps; (3) Restrict but allow exemptions.
  *   **Status:** Named (Weak PP / Cost-Benefit+).

  **Leaf 4: Heuristic Deflationism**
  *   **Coordinates:** Action-Only | Graded | Burden: Pro-Action | Justice: Dissolves.
  *   **Description:** PP is not a decision principle but a rule of thumb. When justice conflicts, PP dissolves into standard utilitarianism or prioritarianism.
  *   **Case Verdict:** (1-3) Decided by maximizing expected value; PP adds no independent weight.
  *   **Status:** Named (Deflationary View).

  **Leaf 5: Procedural Skepticism**
  *   **Coordinates:** Action-Only | [Any] | Burden: Incoherent | [Any].
  *   **Description:** Burden-shifting is meaningless without a prior theory of value. PP is parasitic on underlying ethics.
  *   **Case Verdict:** (1-3) Cannot decide without first solving the value conflict (e.g., rights vs. utility).
  *   **Status:** Named (Critique of PP).

  **Leaf 6: Proactionary Principle**
  *   **Coordinates:** Symmetric | Graded | Burden: Opponent of Inaction | Justice: Override.
  *   **Description:** Risks of inaction (e.g., climate change) count equally with risks of action. Burden is on those who oppose intervention to prove it is dangerous. Progress is weighted heavily.
  *   **Case Verdict:** (1) Permit Gene Drive; (2) Mandate Geoengineering (risk of inaction is higher); (3) Permit Pesticide (risk of farm collapse outweighs sublethal harm).
  *   **Status:** Named (Proactionary Principle).

  **Leaf 7: Risk-Parity Paralysis**
  *   **Coordinates:** Symmetric | Graded | Burden: Opponent of Inaction | Justice: Veto.
  *   **Description:** Both action and inaction trigger precaution. If both carry catastrophic risk, the veto applies to both.
  *   **Case Verdict:** (1) Ban Drive (extinction); (2) Ban Geoengineering (feedback) AND Ban Fossil Fuels (warming); (3) Ban Pesticide AND Ban Organic alternatives if they carry yield risks. Result: Systemic deadlock.
  *   **Status:** Unnamed (Logical Endpoint).

  **Leaf 8: Pure Expected Utility**
  *   **Coordinates:** Symmetric | Graded | Burden: Incoherent | Justice: Override.
  *   **Description:** All risks (action/omission) are commensurable. Burden framing is rejected. Decisions maximize aggregate welfare.
  *   **Case Verdict:** (1-3) Calculated purely on probable outcomes.
  *   **Status:** Named (Classical Utilitarianism).

  **Leaf 9: The Normative Contradiction (Empty)**
  *   **Coordinates:** Action-Only | Binary | Burden: Opponent of Inaction.
  *   **Diagnosis:** **Incoherent.** If scope is limited to anthropogenic action, demanding proof that *inaction* is dangerous contradicts the scope. This position claims "only human acts matter" but then demands defense of "letting nature run its course."
  *   **Status:** Unoccupied/Incoherent.

  **Leaf 10: The Asymmetric Symmetry (Empty)**
  *   **Coordinates:** Symmetric | Binary | Burden: Proponent of Action.
  *   **Diagnosis:** **Unstable.** If risks are symmetric (action and omission both count), placing the burden solely on the actor reintroduces a status-quo bias without justification. It claims symmetry but practices asymmetry.
  *   **Status:** Unoccupied/Unattractive.

  ---

  ## III. Collapses and Indistinguishability

  **The Leaf 3 / Leaf 8 Collapse:**
  In practice, **Leaf 3 (Weak PP)** and **Leaf 8 (Pure EU)** often yield identical recommendations in Cases 1 and 3. If the "Graded Trigger" is calculated using probability × severity, and Justice is an "Override," the "Burden on Proponent" becomes a procedural formality rather than a substantive constraint. For grad students: Do not treat Weak PP as distinct from Risk-Benefit Analysis unless the "grading" function includes a non-linear penalty for uncertainty (ambiguity aversion).

  **The Leaf 1 / Leaf 7 Divergence:**
  While both employ a **Veto**, they diverge sharply on Case 2 (Geoengineering). Leaf 1 permits climate change (status quo risk excluded); Leaf 7 vetoes it (status quo risk included). This is the single most important empirical distinction in the tree.

  ---

  ## IV. Committed Stance: Where the Philosophical Work Is

  Do not treat these four splits as equal. In teaching this seminar, argue the following:

  1.  **Split 1 (Scope) is the Metaphysical Ground:** This is the only split that genuinely alters the ontology of risk. Either the status quo is neutral (Action-Only) or the status quo is a risky gamble (Symmetric). If you do not resolve this, the rest of the tree is noise. Most policy debates fail because one side assumes Action-Only and the other assumes Symmetric.
  2.  **Split 4 (Justice) is the Ethical Engine:** Split 2 (Trigger) is largely a red herring for Split 4. A "Binary Trigger" usually just codes for "Veto," and a "Graded Trigger" codes for "Override." The real ethical work happens in asking whether ecological integrity trumps human survival (Veto) or trades off against it (Override). Focus your seminar energy here.
  3.  **Split 3 (Burden) is Derivative:** Burden-shifting is procedural, not foundational. It flows logically from Split 1. If you accept Symmetric Scope, "Burden on Proponent" becomes incoherent (Leaf 10). If you accept Action-Only, "Burden on Opponent" is contradictory (Leaf 9). Do not let students debate burden without first fixing Scope.
  4.  **Split 2 (Trigger) is the Red Herring:** Distinguishing "Binary" from "Graded" is often semantic cover for a prior commitment to Leaf 1 vs. Leaf 8. A "graded" view that assigns infinite disutility to extinction is functionally binary. Force students to justify the *shape* of their value function, not just the label of the trigger.

  **Final Directive:** The tree shows that "Precaution" is not a single principle but a coordinate system. The only defensible positions are Leaf 2 (Threshold Prioritarianism) for policy stability or Leaf 6 (Proactionary) for existential risk contexts. Leaf 1 is ethically untenable in a warming world (Case 2), and Leaf 8 ignores structural uncertainty. Build your seminar around the tension between Leaf 2 and Leaf 6.
