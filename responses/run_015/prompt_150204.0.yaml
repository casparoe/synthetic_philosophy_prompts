answer: |-
  The crux here is the tension between *vagueness* and *arbitrariness*. Standard Parfit questions allow students to recite the conclusion ("identity doesn't matter") without grappling with the ontology of "what matters." By introducing a fidelity dial, I force them to decide if "what matters" is a scalar quantity (accepting vague survival) or a threshold property (reintroducing the sharp boundaries reductionism sought to dissolve). The branching cases further test whether they understand "what matters" as aggregative or divisive. This structure penalizes rote memorization because the standard branch-line case assumes full psychological overlap; the dial breaks that assumption.

  ***

  **Exam Question**

  Consider a teletransporter with a fidelity dial (1–100). At 100, the replica possesses all your memories, desires, and traits. At 40, she retains your temperament and values but lacks specific memories and skills. At 1, she is a psychological stranger. Scanning destroys the original. Evaluate the following four outcomes: (1) One replica at 100; (2) One replica at 40; (3) Two replicas at 100; (4) Two replicas at 40. Assuming a reductionist view where identity is not what matters in survival, explain whether 'what matters' admits of degrees given the dial. If it does, how should prudential rationality adapt? If it requires a threshold, where lies the justification? Finally, clarify whether the dial varies connectedness or continuity, and whether two replicas at 40 contain more of what matters than one. Do not simply recount standard branch-line cases; apply the reductionist structure to this specific mechanism.

  ***

  **Model Answer**

  The reductionist claims identity is not what matters; rather, psychological relations hold the value. The fidelity dial exposes a structural tension in this view: either "what matters" comes in degrees, or it relies on an arbitrary threshold. I argue the former. The dial clearly varies psychological connectedness—the holding of specific memory and character links—rather than continuity, which requires only overlapping chains of connection. Since connectedness naturally admits of degrees, what matters must also be scalar.

  If we insist on a threshold—for instance, claiming survival occurs only at setting 50—we reintroduce the very sharp boundary the reductionist sought to avoid. There is no metaphysical fact that makes 50 significant while 49 is not; such a line would be as mysterious as the soul it replaces. Therefore, we must accept that survival is vague. At setting 40, the original neither fully survives nor fully dies; she survives to a degree.

  This forces a revision of prudential rationality. Standard reductionism suggests we should not fear death if psychological continuity holds. But with the dial, prudential concern becomes a calculation of expected survival. At setting 100, full concern is rational. At 40, concern is warranted but attenuated. We must weigh the degree of connectedness against the risk of destruction. This is awkward—it complicates decision-making—but it is less costly than positing a magical cutoff point.

  Regarding branching, the reductionist holds that identity cannot hold where there are two successors. However, "what matters" need not be unique. In the double cases, identity is lost, but survival is preserved. The question is whether two replicas at 40 contain more of what matters than one. Since what matters is grounded in connectedness, and connectedness is instantiated in each replica, the total amount of what matters is doubled. There are two streams of consciousness carrying the original's values.

  However, prudentially, this does not necessarily mean double concern. If what matters is the continuation of *my* projects, having two successors might divide my concern rather than double it, as my resources and intentions are split. Yet, ontologically, the presence of what matters is greater in the double 40 case than the single 40 case. The reductionist must concede that survival is not a binary state but a distributed property.

  Ultimately, the dial confirms that reductionism dissolves the self into a bundle of relations. If those relations weaken, survival weakens. To deny this is to cling to the all-or-nothing intuition of identity that the view rejects. We must accept vague survival and adjusted prudential norms. The cost is computational complexity in deliberation; the benefit is ontological honesty. We avoid inventing sharp lines where nature provides only gradients. The dial does not break reductionism; it reveals its true, graded shape.

  ***

  **Marking Scheme (20 Marks)**

  1.  **Connectedness vs. Continuity (4 marks):** Must identify that the dial varies *connectedness* (specific links) rather than *continuity* (causal chains).
      *   *Common Error:* Treating the two terms as synonymous or claiming the dial breaks continuity entirely at 40.
  2.  **Degrees vs. Threshold Commitment (4 marks):** Must take a definite stance on whether "what matters" is scalar or threshold-based and justify it.
      *   *Common Error:* Sitting on the fence or claiming Parfit decides this explicitly without argument.
  3.  **Prudential Implications (4 marks):** Must explain how rational self-concern changes if survival is a matter of degree (e.g., calculation vs. binary fear).
      *   *Common Error:* Asserting prudential concern remains unchanged despite admitting degrees of survival.
  4.  **Branching Analysis (4 marks):** Must address whether two replicas at 40 offer more, less, or equal "what matters" compared to one.
      *   *Common Error:* Assuming branching automatically halves value without justification, or conflating identity with survival.
  5.  **Argumentative Stance (4 marks):** Must argue for a position rather than surveying options; the answer must have a thesis.
      *   *Common Error:* Writing a "book report" style summary of Parfit's views without applying them to the dial.

  ***

  **Boundary Note**

  A Low A answer takes a definite stance on the degrees/threshold dilemma and integrates the branching case into that argument, whereas a High B answer identifies the issues correctly but treats them as separate checklist items without a unifying thesis. Papers fall into the C range when they ignore the dial's specific mechanics and simply reproduce standard notes on the teletransporter and branch-line case.
