answer: |-
  This is a sharp question that cuts right to the tension between Russell's 1905 logic and modern semantic theory (specifically the Kaplanian distinction between character and content).

  The short answer is: **Treating descriptions as carrying a hidden context-parameter breaks Russell's framework.** It might seem like a natural extension to handle indexicality, but it effectively reifies the phrase as a semantic unit, which collapses his core doctrine that denoting phrases are "incomplete symbols" with no meaning in isolation.

  Here is why that move causes the logic to crumble from a Russellian perspective.

  ### 1. The "Incomplete Symbol" Doctrine
  Russell's central claim in *On Denoting* is that a phrase like "the present King of France" is an **incomplete symbol**. It does not correspond to a single constituent in the proposition. When you analyze the sentence logically, the phrase disappears entirely, replaced by quantifiers, variables, and predicates.

  *   **Russell's View:** The phrase has *no* meaning in isolation. It is merely a fragment of a sentence that dictates how to construct a proposition.
  *   **Your Proposal:** If you assign the phrase a "hidden context-parameter" (a rule that says "look at the time of utterance to find the referent"), you are effectively assigning it a **character**. You are saying the phrase *itself* carries a stable rule for determining denotation across different contexts.

  For Russell, this smuggles "meaning" back into the phrase. If the phrase has a rule (character) that exists independently of the sentence it inhabits, it is no longer an incomplete symbol; it is a function waiting for an argument. This violates his strict context principle: the phrase only has significance *in virtue of* the proposition it helps constitute, not because it carries its own semantic baggage.

  ### 2. The Collapse of Primary/Secondary Occurrences
  This is the most critical logical failure point. Russell introduces the primary/secondary occurrence distinction (scope distinctions) specifically to handle negation without positing non-existent entities.

  *   **Russell's Logic:** "The King of France is not bald" is ambiguous.
      *   *Primary (Wide Scope):* There is a King of France, and he is not bald. (False)
      *   *Secondary (Narrow Scope):* It is not the case that (there is a King of France who is bald). (True)
  *   **The Indexical Problem:** If you treat "the present King" as having a context-parameter that fixes its denotation *before* logical analysis (similar to how "I" or "now" function in modern semantics), the phrase starts behaving like a **proper name** or a rigid designator.

  If the context parameter fixes the referent immediately, the description loses its quantificational force. If it acts like a name, it generally cannot take narrow scope under negation. You would lose the ability to say the sentence is true simply because there is no King. The ambiguity Russell relies on to save bivalence would vanish, and the sentence would likely default to false (or presupposition failure, à la Strawson), which is exactly what Russell was trying to avoid.

  ### 3. How Russell Actually Handles Context
  Russell *does* account for words like "present" or "here," but he treats them as **predicates**, not parameters attached to the determiner.

  For Russell, "The present King of France" analyzes roughly to:
  $$ \exists x (KingOfFrance(x) \land Present(x) \land \forall y (KingOfFrance(y) \land Present(y) \rightarrow y=x) \land \dots) $$

  The "context" (the time of utterance) is used to evaluate the truth of the predicate $Present(x)$, but it does not change the logical form of the phrase itself. The phrase remains a quantificational structure.

  By contrast, your "hidden parameter" suggestion implies the logical form shifts or that the phrase picks out an object *directly* via the context. That moves you away from Russell's quantificational analysis and toward a **direct reference** theory.

  ### 4. Character vs. Content
  You asked if this smuggles in a distinction between character and content. **Yes, it does.**

  *   **Character:** The rule ("find the president at the time of utterance").
  *   **Content:** The specific individual (e.g., Biden).

  Russell explicitly rejects the idea that denoting phrases have a "meaning" (which maps closely to Character/Sense) that is distinct from their denotation. He argues against Frege on precisely this ground. If you introduce a context-parameter that functions as a rule, you are reintroducing a Fregean "sense" or a Kaplanian "character."

  For Russell, there is only the proposition (content). There is no intermediate layer of "phrase meaning" that mediates between the words and the world. Adding that layer solves problems Russell didn't prioritize (systematic indexicality) but destroys the ontological parsimony he was aiming for (eliminating the need for meanings/ideas as intermediaries).

  ### Verdict
  It is **not a natural extension**; it is a **category error** within his system.

  To make your idea work, you have to treat the description as a semantic unit that persists across contexts. Russell insists the description is a syntactic mirage that vanishes upon analysis. If you give the mirage a mechanism (a context-parameter), you solidify it into an object, which forces you to abandon the "incomplete symbol" doctrine and the quantificational analysis of scope that makes Russell's solution to "The King of France is not bald" work in the first place.

  You are essentially proposing a Kaplanian update to Russell. It's a better theory for handling indexicals, but it requires deleting the core engine of *On Denoting*.
