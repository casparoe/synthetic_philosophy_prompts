  1. Your friend correctly describes the Principle of Identity of Indiscernibles but conflates it with the Indiscernibility of Identicals, which scholars reserve for the logically uncontroversial claim that identicals share all properties.
  2. While Black's symmetric universe is a famous challenge to the principle, claiming it decisively refutes Leibniz ignores that the argument hinges on whether spatial position counts as a genuine qualitative property.
  3. The objection that spheres possess unique haecceities is technically valid but begs the question, since defenders of the principle reject such trivial individuating properties specifically to avoid rendering the law tautological.
  4. Leibniz did argue the principle was logically necessary, but many contemporary metaphysicians treat it as contingent, meaning Black's thought experiment only refutes its logical status rather than its metaphysical utility.
  5. Consequently, the sweeping conclusion that the debate is merely sentimental is unwarranted, as the conflict continues to drive serious inquiry into the nature of individuation and ontology.
