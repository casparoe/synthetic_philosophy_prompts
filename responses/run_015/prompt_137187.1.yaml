answer: |-
  This is one of the deepest questions in the philosophy of mathematics, and you are right to feel a tension there. You aren't missing a simple calculation trick; you have stumbled onto a 2,000-year-old debate between **Actual Infinity** (things can be infinitely large as completed wholes) and **Potential Infinity** (infinity is just a process that never ends).

  Your teacher is teaching **Standard Mathematics** (based on ZFC Set Theory). Your friend is arguing for **Finitism** or **Constructivism**. Both are logically consistent systems, but they play by different rules.

  Here is the breakdown of what standard practice assumes, where your teacher is actually consistent, and what would break if you adopted your friend's "rule-only" view.

  ### 1. Is your teacher inconsistent?
  **No.** Your teacher is making two distinct claims that live in different layers of math.

  *   **Claim A: "Infinity is not a number."**
      This refers to arithmetic within the **Real Number System ($\mathbb{R}$)**. In standard algebra and calculus, $\infty$ is not an element of $\mathbb{R}$. You cannot write $5 + \infty$ because the operation $+$ is not defined for $\infty$ in that system. If you allow it, you break the rules of algebra (like cancellation).
  *   **Claim B: "Sets can be infinite / Decimals can have infinite digits."**
      This refers to **Set Theory**. Standard math assumes the **Axiom of Infinity**, which states that the set of all natural numbers $\{1, 2, 3, ...\}$ exists as a completed, single object.

  **The Resolution:** In standard math, the *set* of numbers can be infinite, and a *sequence* can be infinite, but the *symbol* $\infty$ is not a number you can plug into an equation like $x + 5 = 10$. Your teacher is consistent within the standard framework.

  ### 2. What does standard practice assume?
  To do the math you see in school and physics (Calculus, Real Analysis, Standard Physics), you **must assume Actual Infinity.**

  *   **Real Numbers:** A real number like $\pi$ or $1/3$ is defined as a **limit** of an infinite sequence. For $0.999...$ to equal $1$, the infinite sum must "arrive" at a value. If the process never finishes (Potential Infinity), then $0.999...$ is always *infinitesimally less* than $1$. Standard math says there are no infinitesimals in $\mathbb{R}$; the gap is exactly zero. That requires the infinite sum to be a completed object.
  *   **Cantor's Diagonal:** This argument explicitly treats the list of all real numbers as a completed totality that you can manipulate. You cannot perform a diagonalization on a process that is still being written.
  *   **Calculus/Physics:** Integrals sum up infinitely many infinitely thin slices. Engineers use this to calculate stress loads on bridges. The model assumes the continuum is "smooth" and infinitely divisible.

  **Verdict:** Standard school/science math **requires Actual Infinity.** It treats infinite sets as finished objects that you can reason about.

  ### 3. What happens if you take your friend's "Rule-Only" view?
  Your friend is advocating for **Potential Infinity**. This view says: "The natural numbers are a process of counting that you can keep doing, but the 'set of all natural numbers' doesn't exist as a thing."

  If you take this seriously all the way down, here is what survives and what breaks:

  #### **A. Does $0.999... = 1$ survive?**
  *   **Standard Math:** Yes. The notation $0.999...$ is *defined* as the limit of the sequence. The limit is 1.
  *   **Friend's View:** **No (or it changes meaning).** If $0.999...$ is just a rule for writing 9s forever, it never "becomes" 1. It is a process that gets arbitrarily close.
  *   **Consequence:** To make math work here, you have to rewrite the definition of equality. You'd say they are "equivalent in the limit," but not strictly identical. This makes algebra messy.

  #### **B. Does Cantor's Diagonal Argument survive?**
  *   **Standard Math:** Yes. It proves $|\mathbb{R}| > |\mathbb{N}|$.
  *   **Friend's View:** **It breaks.** Constructivists (mathematicians who share your friend's view) often reject Cantor's conclusion or reinterpret it. They argue you can't talk about "all real numbers" because you can't list them all.
  *   **Consequence:** You lose the hierarchy of infinities ($\aleph_0, \aleph_1$, etc.). Much of modern set theory vanishes.

  #### **C. Does Physics break?**
  *   **Standard Math:** Uses continuous functions over real numbers.
  *   **Friend's View:** **The models need rewriting, but the bridges still stand.**
      *   Physics uses math as a *model*. Even if the universe is discrete (which some quantum gravity theories suggest), Calculus works because the "pixels" of the universe are so small that the infinite approximation is accurate enough.
      *   However, **Constructive Analysis** (math done without actual infinity) is much harder. Theorems like the **Intermediate Value Theorem** (if a continuous function goes from negative to positive, it must cross zero) are not strictly true in constructive math without extra conditions.
      *   **Engineers:** Engineers don't care about the ontology. They care that the integral gives the right number. As long as the "rule-only" math produces the same numerical predictions (which Constructive Math tries to do), the bridge doesn't fall down. But the *proofs* that the bridge won't fall down become much more complicated.

  ### 4. Why does the teacher say "Infinity is not a number" then?
  This is the specific point of confusion.
  *   In **Cardinality** (counting sizes of sets), infinities behave like numbers ($\aleph_0 + 1 = \aleph_0$).
  *   In **Calculus** (limits), $\infty$ is a symbol for unbounded growth, not a value.
  *   In **Extended Real Number Lines**, $\infty$ *is* added as a number, but you lose the ability to subtract (what is $\infty - \infty$? It's undefined).

  Your teacher is warning you against **arithmetic inconsistency**. If you treat $\infty$ like a normal number in algebra, you can "prove" $1 = 2$.
  *   Example: $\infty + 1 = \infty$. Subtract $\infty$ from both sides $\rightarrow 1 = 0$.
  *   To prevent this, standard math says: "You can have infinite sets, and you can have limits approaching infinity, but you cannot do arithmetic *with* infinity."

  ### 5. Summary: The "Toolbox" Analogy
  Think of math as a toolbox.

  *   **Standard Math (Your Teacher):** Uses a power tool (Actual Infinity). It assumes the infinite set exists. It cuts fast, smooth, and easy. $0.999... = 1$ works perfectly. Cantor works. Calculus is clean. The risk is philosophical paradoxes (Hilbert's Hotel), but the tool works for building physics models.
  *   **Rule-Only Math (Your Friend):** Uses hand tools (Potential Infinity/Constructivism). It refuses to assume the infinite set exists. It is safer philosophically (no paradoxes of completed infinities), but it is slower and harder. You have to rebuild the definitions of limits and numbers.

  **To answer your specific questions:**
  1.  **What does practice assume?** It assumes Actual Infinity (Axiom of Infinity).
  2.  **Is the teacher inconsistent?** No. "Not a number" refers to arithmetic; "Infinite sets" refers to collection size.
  3.  **What breaks if you use the friend's view?**
      *   $0.999... = 1$ becomes "approaches 1" (unless you redefine equality).
      *   Cantor's Diagonal argument fails or must be radically reinterpreted.
      *   Physics models work numerically but lose their standard theoretical justification (Continuum Hypothesis, etc.).

  **The Bottom Line:**
  Your friend is philosophically cautious, but your teacher is pragmatically correct for the math you are learning. Standard math *pretends* infinity is a completed thing because it makes the calculus and algebra work smoothly. Your friend wants to stop pretending. Both are valid philosophical stances, but only your teacher's stance allows you to pass the calculus exam and use standard engineering tables without rewriting the foundations of analysis.

  You aren't missing a math step; you're seeing the seam where the philosophy holds the math together. Standard math chooses **utility** over **ontological purity**. It assumes completed infinities exist because it makes the equations solvable.
