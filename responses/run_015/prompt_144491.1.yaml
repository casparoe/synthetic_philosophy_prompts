answer: |-
  Your intuition is spot on. Your roommate has taken a specific, controversial philosophical move and treated it like a settled fact, then made a massive leap to a much more radical conclusion that doesn't logically follow.

  He has conflated three different things: **Material Constitution** (the statue problem), **Persistence** (temporary intrinsics), and **Ontological Nihilism** (objects aren't real).

  Here is a breakdown of where his summary is accurate, where it gets muddy, and where he makes the logical slide you suspected.

  ### 1. The Actual Puzzle (Where he is right)
  He correctly identified the core tension. It's usually framed using **Leibniz's Law** (the Indiscernibility of Identicals):
  *   If Object A and Object B are the same thing, they must share all the same properties.
  *   The Clay and the Statue share the same atoms and location.
  *   **However:** The Clay existed before 1900; the Statue did not. Also, if you squash the lump, the Clay survives but the Statue is destroyed.
  *   **Conclusion:** They seem to have different properties, so they must be different objects. But how can two objects be in the exact same place at the exact same time?

  ### 2. The "Solution" (Where he gets muddy)
  Your roommate suggests the solution is that the clay is one object that just gains/loses properties (like being wet or being statue-shaped). In philosophy, this view is often called **Constitution as Identity** (or Monism). It says: *There is only one object here. We just have two different ways of describing it.*

  However, he uses the term **"Temporary Intrinsics."** This is actually a bit of a mix-up.
  *   **The Problem of Temporary Intrinsics** is a famous argument *against* the view your roommate is holding. It asks: "How can one object be 'straight' at time 1 and 'bent' at time 2 without changing its essential identity?"
  *   The standard solution to *that* problem (proposed by David Lewis) is actually **Perdurance Theory** (objects are 4D worms made of temporal parts), which is different from what your roommate described.
  *   **The Error:** He is using a technical term to describe a view (Endurantism/Monism) that usually struggles *with* that specific term. But let's grant his point: He is arguing that "being a statue" is just a temporary phase of the clay.

  ### 3. The Logical Slide (Where he goes wrong)
  This is the part your gut told you was suspicious. He argues:
  > *If being-statue-shaped is just temporary, then chairs and people are also just temporary arrangements... so material constitution was never a real puzzle.*

  This is a slide from **Monism** to **Nihilism**.

  *   **Monism (His first point):** The statue and the clay are the *same object*. The statue is real, the clay is real, they are just identical.
  *   **Nihilism/Eliminativism (His conclusion):** "Objects" like chairs and people aren't real boundaries; they are just grammar.

  **Why this is a leap:**
  Accepting that the Statue is just the Clay doesn't force you to believe that *Chairs* aren't real. You can believe the Statue is identical to the Clay (solving the puzzle) while still believing that a Chair is a distinct object from the wood it is made of.

  To get to his conclusion (that people and chairs are just "temporary arrangements with no real boundaries"), he has to adopt **Mereological Nihilism**. This is the view that *no* composite objects exist; only simple atoms exist. That is a valid philosophical position, but the Statue/Clay puzzle does not **prove** it. It is a separate, much heavier claim.

  ### 4. Why the Debate Isn't "Killed"
  Your roommate claims this "kills the whole debate." It doesn't, for two main reasons:

  **A. Modal Properties (The Survival Test)**
  Even if we say the Statue is just the Clay with a temporary shape, we still have to explain why they have different *modal* properties (properties about what *could* happen).
  *   The Clay *could* survive being squashed into a ball.
  *   The Statue *could not* survive being squashed into a ball.
  If they are truly the same object, how can one survive a scenario the other cannot? Saying "it's just grammar" doesn't solve the logical contradiction; it just waves a hand at it.

  **B. Deflationism is a Position, Not a Refutation**
  Saying the problem is "just grammar confusion" is a philosophical stance (associated with Wittgenstein or Quine). It's not an objective fact. Many philosophers argue that metaphysics is about discovering the structure of reality, not just analyzing language. To say the debate is "over" because language is fuzzy is like saying physics is "over" because our measurements are fuzzy.

  ### Summary for your next conversation
  You can tell him his intuition is close to a view called **Ontological Deflationism**, but he made two mistakes:

  1.  **Terminology:** He used "temporary intrinsics" (usually a problem for his view) to describe "Constitution as Identity."
  2.  **The Leap:** He assumed that solving the Statue/Clay identity crisis requires denying the existence of all objects (Nihilism). You can solve the puzzle by saying "Statue = Clay" without having to say "Chairs and People aren't real."

  **The Verdict:** He didn't solve the puzzle; he just chose the most radical side (Nihilism) and declared victory. The debate is very much alive because most people find it counter-intuitive to say that *they themselves* are just "temporary arrangements with no real boundaries."
