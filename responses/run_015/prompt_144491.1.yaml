      *   **Confusion 2: The Slide to Nihilism.** Just because the statue isn't a *separate* object from the clay doesn't mean the statue *doesn't exist*. It means Statue = Clay. It doesn't automatically imply that *people* and *chairs* don't exist. That requires an extra step (Ontological Nihilism or Mereological Nihilism).
