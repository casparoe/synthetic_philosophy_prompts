          *   *Assessment:* The "deaths per kilo" math is roughly accurate (one steer yields ~300-400kg meat, one broiler ~2kg). The "days of life" metric is philosophically contentious (is a day of cow life equal to a day of chicken life?). The claim that beef is "mostly on grass" is true for some systems but not all (feedlots exist). The core point about the magnitude of the difference in individual animal count is strong.
