      *   **Move 3 (Lorna):** Introduces Wild Animal Suffering (WAS). Argues beef needs 20x more land. If wild lives are net negative (suffering > pleasure), then more land = more suffering. Beef props up a larger population of wild animals.
          *   *Assessment:* This relies on a highly controversial philosophical premise (that wild lives are net negative). Many ecologists and ethicists dispute this. Also, intensive agriculture often *reduces* wild populations compared to pasture. So, switching to chicken (less land) might free up land, but would that land be rewilded? If it's just more intensive crop land, wild animals might decrease. Lorna's claim that beef *creates* wild animal suffering via land use is logically consistent *if* you accept the WAS premise, but empirically, pasture often supports *fewer* wild animals than natural habitat, but maybe more than arable land.
