answer: |-
  **Project Title:** Beyond Ulysses: A Normative Taxonomy of Institutional Precommitment
  **Applicant:** [Name], Governance Committee, [Foundation Name]
  **Fellowship Duration:** 9 Months (Part-time)

  ### 1. Research Question
  Does distinguishing between **jurisdiction-stripping** (inability to act), **cost-shifting** (increased transaction costs), and **delegated authority** (agent instruction) resolve the normative tension between perpetual institutional entrenchment and the "dead hand" objection?

  Current discourse treats these mechanisms interchangeably under the label "Ulysses contract." This project seeks to determine whether this conflation obscures distinct justificatory requirements. Specifically: *If a governance mechanism is cost-shifting rather than jurisdiction-stripping, does it require a weaker justification regarding successor consent?* And: *If a mechanism is delegation rather than precommitment, does the "dead hand" objection cease to apply?*

  ### 2. Why Existing Approaches Fail
  The literature generally oscillates between two poles, neither of which offers actionable guidance for a foundation trustee.

  **The Autonomy Continuity Argument:** This position argues that an institution, like a person, has an identity over time. Therefore, the founders' will binds successors just as a person's past self binds their future self. *Failure:* This relies on a metaphysical claim about institutional personhood that is implausible for private foundations. Unlike a human mind, a board of trustees has no psychological continuity. Successors are numerically different agents who did not consent to the original terms.

  **The Efficiency/Prudence Argument:** This position argues that entrenchment is justified instrumentally to prevent shortsightedness or mission drift. *Failure:* This ignores the legitimacy cost. It explains *why* one might want to bind successors, but not *why one is permitted* to do so. It treats the "dead hand" objection as a bug to be optimized rather than a normative constraint to be respected.

  **The Gap:** Both approaches treat "entrenchment" as a monolith. They fail to distinguish between making an action *impossible* (jurisdiction-stripping), *expensive* (cost-shifting), or *assigned to a specific agent* (delegation). Consequently, they apply the wrong justificatory standard to the wrong mechanism. A supermajority vote requirement (cost-shifting) is treated with the same moral gravity as a court-locked mission clause (jurisdiction-stripping), leading to governance rigidity where flexibility is permissible, or vice versa.

  ### 3. Methodology
  **Approach: Normative Modeling via Reflective Equilibrium.**
  I will construct a conceptual taxonomy of the three mechanisms and test them against considered judgments about specific governance scenarios (primarily drawn from private foundation law and constitutional theory). I will iterate between the definitions and the intuitions until a stable mapping of mechanism-to-justification emerges.

  **Why this approach?**
  *   *Vs. Pure Conceptual Analysis:* Purely abstract analysis risks detaching from the operational reality of governance. By anchoring the analysis in the specific constraints of perpetual endowments (e.g., spend-rate caps, mission clauses), the output remains actionable for the handbook chapter.
  *   *Vs. Empirical Case Study:* An empirical study of which devices prevent mission drift answers a causal question, not a normative one. Knowing that a spend-rate cap *works* does not tell us if it is *legitimate* to impose it on non-consenting successors. This project addresses legitimacy.

  **Work Plan (1 Day/Week):**
  *   **Months 1–3 (Taxonomy Construction):** Rigorously define the three categories. Test edge cases (e.g., is a 90% supermajority requirement cost-shifting or de facto jurisdiction-stripping?). Draft the "Governance Taxonomy" section of the handbook.
  *   **Months 4–6 (Normative Mapping):** Assign justificatory burdens to each category. Determine where the "dead hand" objection applies most forcefully. Draft the core argument of the working paper.
  *   **Months 7–9 (Application & Review):** Apply the framework to the Foundation's own charter. Identify which clauses are mislabeled. Finalize working paper and handbook chapter.

  ### 4. Possible Conclusions
  1.  **Differentiation Validated:** The distinctions hold. Cost-shifting requires only a prudential justification (efficiency), while jurisdiction-stripping requires a consent-based justification (autonomy). Delegation requires an alignment justification (agency theory).
  2.  **Collapse:** The distinctions prove unstable (e.g., sufficiently high costs *become* inability). If so, the project will conclude that "Ulysses" is only appropriate for true jurisdiction-stripping, and most foundation governance should be reframed as delegation.
  3.  **Negative Result:** The "dead hand" objection cannot be dissolved by taxonomy. If so, the conclusion will be that perpetual foundations lack normative legitimacy unless they include explicit sunset clauses or renewal consents.

  ### 5. Feasibility Assessment
  **Risk:** Nine months at one day per week (~36 days) is tight for deep philosophical work.
  **Mitigation:** The scope is restricted to *private perpetual foundations*, not general constitutional theory. This limits the case law and theoretical landscape. The output is a working paper, not a monograph.
  **Verdict:** Feasible, provided the conceptual taxonomy is stabilized by Month 3. If the definitions remain fluid past Month 4, the scope must be reduced to a single mechanism (e.g., spend-rate caps).

  ### 6. Failure Conditions
  The project fails if:
  1.  The three categories do not yield different normative advice (i.e., if the same justification applies to all three).
  2.  The distinctions collapse under scrutiny (e.g., if "delegation" is shown to be merely "cost-shifting" with an extra step).
  3.  The output remains too abstract to inform the governance handbook.

  ### 7. Note to Funders (Plain English)
  **Why fund a philosophy project instead of a data study?**
  Funders often ask: "Which governance rules actually stop mission drift?" That is an engineering question. But before we build the engine, we need to know if we have the right to lock the driver out of the car.

  If we use the wrong metaphor for our rules, we make the wrong mistakes. If we think a rule is a "Ulysses contract" (a safety mast), we won't change it even when the sea is calm. If we think it's "delegation" (hiring a captain), we know we can fire the captain if they steer wrong. Right now, foundations mix these up. We treat hiring rules like safety masts, and safety masts like hiring rules.

  This project doesn't measure how well rules work; it clarifies *what the rules are*. It ensures that when we tie our successors' hands, we know exactly which knot we are using and why we are allowed to tie it. This prevents governance gridlock and protects the foundation from legal or moral challenges by future trustees who feel illegitimately bound.

  ### 8. Risk Register

  | Move | Confidence | Risk Description |
  | :--- | :--- | :--- |
  | **Taxonomy Stability** | High | The three categories (Inability, Cost, Delegation) are robust enough to sustain analysis. |
  | **Normative Mapping** | Medium | Distinct categories will successfully map to distinct justifications. |
  | **Feasibility** | High | 36 days is sufficient for a working paper if scope is kept to private foundations. |
  | **Least Sure Claim** | **Low** | **Claim:** That "Delegation" is normatively distinct from "Cost-Shifting." <br> **Condition for Error:** If it turns out that instructing an agent is functionally identical to raising the cost of acting against instructions, the third category collapses into the second, requiring a major restructuring of the argument in Month 3. |
