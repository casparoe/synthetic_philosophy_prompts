      *   **Feasibility:** 1 day/week is tight. Need to scope carefully. Focus on *private foundations* as the primary test case, not all constitutional law.
      *   **Funder Section:** Plain English. Why care? Because using the wrong metaphor leads to bad rules. If you think you're tying yourself to a mast but you're actually hiring a helmsman, you'll fire the wrong people when things go wrong.
