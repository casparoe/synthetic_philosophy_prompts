prompt: |-
  I was trying to explain to my roommate why Darwin's idea of natural selection isn't just survival of the fittest and ended up going down a rabbit hole about how he describes selection as doing all this precise, goal-directed work—picking the best variations, perserving useful traits, almost like a breeder—while constantly insisting that nature has no foresight, no will, no comprhension at all. There's a passage where he basically says nature can do everything a human breeder does, only she's tireless and never slips up, yet she doesn't understand what she's doing. I think he's describing something like competence without comprehension, but then I started thinking about Turing's 1950 paper where he asks whether machines can think and basically argues that you can have all the outward competence of thinking without any inner comprehension.

  But isn't there a weird inversoin between the two? Darwin takes a blind process and shows it produces something that looks designed; Turing takes something that looks like thinking and shows it can come from a blind process. I'm taking a philosophy of science course and this comparison came up, but I'm stuck on whether Darwin is actually making the same move as Turing or the opposite one. Could you help me understand the passage and how these two inversions relate? Also, Darwin keeps personifying natural selection even right after he warns readers not to—why does he do that if he's trying to avoid attributing comprehension to it?
