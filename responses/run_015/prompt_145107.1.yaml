prompt: |-
  So I'm in this cross-listed poli-sci/philosophy class on collective decision making, and we spent a week on herding: the thing where a line of perfectly rational people, each able to see what the people before them did, can end up doing something dumb even though every individual step was reasonable. My professor tossed off something like "which is why elections are secret" and moved on, and I haven't been able to let it go since, because it seems like at most half the story.

  Here's what bugs me. In every election I've voted in, the whole apparatus is built around me not seeing anyone else's choice and nobody ever seeing mine: I go into a booth alone, there's a curtain, my name gets ticked off and the ballot is separated from it, and in a lot of places even photographing your own filled-out ballot is against the rules. And yet the same election is wrapped in herding machinery — months of public polling, endorsements everyone openly justifies in terms of "momentum", primaries where states vote one after another and the entire narrative is about who's surging after the first couple of contests, news outlets that hold off calling a state until the polls there have shut. And there are still small assemblies — the Swiss kind, some New England town meetings — where people raise their hands in front of their neighbours and it doesnt seem to cause a crisis. So the practice seems to say: my neighbour's revealed vote is dangerous information when it reaches me one at a time in real time, harmless or at least unavoidable in the aggregate, and dangerous again if it reaches me the day before I vote.

  What I'd like you to do is reconstruct the implicit theory as carefully as you can. What view of other people's choices as evidence does the secret ballot presuppose? I can think of four candidates and I can't figure out how they fit together: (1) other people's votes are not pure reports of their private information, they're already partly social, so pooling them destroys whatever independence you needed for the crowd to be wise in the first place; (2) people are bad at discounting — once you've seen the tally you can no longer tell apart what you actually knew from what you inferred from the tally, so the tally contaminates instead of informing; (3) it isn't epistemic at all, it's about coercion and vote buying — if you can't prove how you voted, nobody can buy or threaten your vote — and the anti-cascade story is something we tell afterwards; (4) something about legitimacy, that a collective decision is only really ours if it's built out of seperate judgements rather than imitation. Which of these does the practice strictly need, which does it merely sit comfortably with, and are any of them in tension? Note especially the weird bit: if (3) were the whole story, then publishing everyone's vote after the fact, or having a ballot you could look up later, should be unproblematic, and I'm not at all sure it is.

  Then the part I actually want your opinion on. My friend has this scheme he won't shut up about, he calls it a "shadow tally": everyone votes secretly exactly as now, but a randomly drawn 10% of voters get a message an hour before polls close showing them the current tally of the other 90%, and they get to recast their vote, with only the second one counted. His pitch is that you keep the independence of the secret ballot for most of the electorate and then let a small, explicitly-designated sample inject the social information in a controlled dose. I think it's either brilliant or insane. Tell me what someone designing this would have to believe — about how much and what kind of information is in ordinary voters' private signals, about whether herding is a failure of aggregation or a failure of incentives, and about what makes an outcome legitimate — for the scheme to make sense. And then tell me whether, on the secret ballot's own terms, we should have replaced it with something like this ages ago. If you think the whole anti-cascade reading is backwards and the secret ballot is really only about coercion, say that too, and tell me what would actually change in how we design elections if we stopped believing the cascade story.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** Cross-listed poli-sci/philosophy class on collective decision making. Topic: Informational Cascades (Herding).
      *   **The Puzzle:** The professor claimed "secret ballots prevent herding." The user finds this incomplete/contradictory because elections are surrounded by public information (polls, endorsements, sequential primaries) that *does* cause herding, yet some public voting (town meetings) exists without crisis.
      *   **The Core Task:** Reconstruct the implicit theory of the secret ballot regarding "other people's choices as evidence."
      *   **Four Candidate Theories:**
          1.  Votes aren't pure private info (social contamination).
          2.  People are bad at discounting (can't separate private knowledge from public tally).
          3.  It's about coercion/vote buying (non-epistemic).
          4.  Legitimacy/Autonomy (decision must be separate judgement).
      *   **Specific Question 1:** Which of these does the practice *strictly need* vs. *sit comfortably with*? Are any in tension? (Note the tension regarding post-fact publication).
      *   **Specific Question 2:** Evaluate the friend's "Shadow Tally" scheme (10% see tally, can revote).
          *   What must a designer believe for this to make sense? (Private signals, herding vs. incentives, legitimacy).
          *   Should we have replaced the secret ballot with this?
          *   If the anti-cascade reading is wrong (it's just coercion), what changes?

  2.  **Part 1: Reconstructing the Implicit Theory of the Secret Ballot:**

      *   *Analyze the Four Candidates:*
          *   (1) **Social Contamination:** If votes are already social, secrecy doesn't help much *unless* it stops the *chain reaction* during the act of voting itself. Secret ballots assume votes *should* be independent reflections of preference/judgment.
          *   (2) **Bad Discounting (Cognitive Bias):** This is the core of the informational cascade model (Bikhchandani, Hirshleifer, Welch). Rational agents ignore private signals if public history is strong enough. Secret ballots break the *public history* of the specific voting act.
          *   (3) **Coercion/Incentives:** This is the historical and legal primary justification. If you can't prove your vote, you can't sell it or be punished for it.
          *   (4) **Legitimacy/Autonomy:** Democratic theory (Rousseau, Kantian autonomy). A vote is an expression of individual will, not a mimicry of the crowd.

      *   *Synthesizing the Tension:*
          *   The "Anti-Cascade" story relies heavily on (2) and (4).
          *   The "Anti-Coercion" story relies on (3).
          *   *The User's Insight:* If it were only (3), publishing results later or having a searchable record wouldn't matter. But we treat the *secrecy at the moment of decision* as sacred. This suggests (2) and (4) are actually doing heavy lifting, not just (3).
          *   *The "Half-Story" Problem:* The professor ignored that campaigns *create* cascades (polls, momentum). The secret ballot only prevents *intra-election* cascades (seeing how your neighbor voted *while* you are voting), not *inter-election* or *pre-election* cascades.
          *   *Resolution:* The secret ballot presupposes that **private signals are valuable but fragile**. It assumes (2) is true (we can't discount properly) and (4) is true (legitimacy requires independence). It *needs* (3) to function practically (otherwise (2) and (4) are undermined by bribery), but (3) alone doesn't explain the obsession with *secrecy from peers* vs. *secrecy from the state*.
          *   *Town Meetings:* These rely on (1) being false or less relevant. In small groups, social pressure *is* the mechanism of cohesion, not just information aggregation. They prioritize consensus over independent aggregation.

  3.  **Part 2: Evaluating the "Shadow Tally" Scheme:**

      *   *The Scheme:* 90% vote secret. 10% randomly selected see the 90% tally, then vote (can change mind). Only 2nd vote counts for the 10%.
      *   *What must the designer believe?*
          *   **Information Value:** They believe the "crowd" (the 90%) has aggregated *some* truth, but not enough. The 10% need a "nudge" to correct a potential error.
          *   **Herding as Feature, not Bug:** They are intentionally inducing a cascade in a controlled subset to tip the scale. They believe the "private signals" of the 90% might be noisy or biased, and the "public signal" of the tally is *better* information than the private signals of the 10%.
          *   **Legitimacy:** They prioritize *Outcome Accuracy* over *Procedural Purity*. If the goal is "get the right result," this helps. If the goal is "every vote is an independent sovereign act," this violates it.
          *   **Rationality:** They assume the 10% are rational Bayesian updaters who *can* use the tally correctly (unlike the standard cascade model where they ignore private info). Or, they assume the 10% are *more* rational than the 90%.
      *   *Critique:*
          *   **The "Wisdom of Crowds" Violation:** Condorcet's Jury Theorem requires independence. This scheme explicitly breaks independence for 10% of the voters. It correlates their votes with the first 90%. This reduces the statistical power of the aggregate.
          *   **The "Momentum" Trap:** If the 90% are already herding due to polls (which they are), feeding that herd back to the 10% amplifies the error, it doesn't correct it.
          *   **Legitimacy Crisis:** If the 10% swing the election based on a tally, the 90% who voted blindly might feel their independence was wasted. The 10% become "super-voters."
      *   *Verdict:* It's likely "insane" from a democratic theory standpoint (violates equality and independence) but "brilliant" from a pure technocratic optimization standpoint *if* you assume the first 90% are mostly right and the 10% are rational correctors. But given the user's premise (herding leads to dumb outcomes), this scheme *guarantees* herding for the 10%.

  4.  **Part 3: If the Anti-Cascade Reading is Backwards (It's just Coercion):**

      *   If (3) is the *only* real reason:
          *   We shouldn't care about polls or momentum (we do).
          *   We shouldn't care about the order of voting (we do, see Iowa/NH).
          *   *Design Changes:* We would focus entirely on receipt-freeness and voter anonymity from the *state* and *employers/neighbors*. We might allow "voting parties" or public deliberation right up to the booth without stigma. We wouldn't worry about "bandwagon effects" in campaign coverage.
      *   *Reality Check:* We *do* worry about bandwagon effects. Therefore, the anti-cascade reading is *not* backwards. It's a secondary but real constraint.

  5.  **Drafting the Response:**

      *   *Tone:* Academic but conversational, matching the user's high-level analysis. Respectful of the "bug" they've identified.
      *   *Structure:*
          1.  Validate the user's intuition (the professor *was* oversimplifying).
          2.  Analyze the Four Candidates (Needs vs. Comfort vs. Tension).
          3.  Address the "Town Meeting" exception (Scale and Purpose).
          4.  Evaluate the "Shadow Tally" (The Technocratic Temptation).
          5.  Address the "Coercion Only" hypothesis.
      *   *Key Insight to Highlight:* The secret ballot protects against *local* cascades (your neighbor), not *global* cascades (media/polls). The friend's scheme tries to weaponize the global cascade, which undermines the epistemic value of the vote.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between *Informational Cascades* (I think they know something I don't) and *Reputational Cascades* (I want to fit in). The secret ballot stops Reputational easily, Informational less so (due to polls).
      *   *Refinement on Shadow Tally:* It's essentially a "Bayesian Jury" experiment. But it violates the "One Person, One Vote" equality principle because the 10% have strictly more information than the 90%.
      *   *Refinement on Coercion:* If it were only coercion, we wouldn't ban ballot selfies. We ban those to prevent proof of voting, which supports the coercion theory. But we also hide the *tally* until the end, which supports the cascade theory.

  7.  **Final Polish:** Check against all constraints in the prompt. (Reconstruct theory, evaluate 4 candidates, evaluate friend's scheme, discuss coercion hypothesis). Ensure the distinction between "strictly need" and "comfortably sits" is clear.

      *(Self-Correction on the "Post-Fact" tension)*: The user notes that if it's just coercion, publishing votes later should be fine. But we often keep individual votes secret forever. Why? Because if individual votes were known later, future coercion (retaliation in next election cycle) becomes possible. So (3) actually explains the permanent secrecy. But (2) explains the *secrecy during the act*.

      *Let's write.*
answer: |-
  This is a fantastic catch. Your professor gave you the "textbook summary" of the informational cascade model (Bikhchandani, Hirshleifer, Welch), but you've correctly identified that the institutional reality of elections is far messier than the laboratory conditions of the theory. The secret ballot does not exist in a vacuum; it exists inside a cacophony of public signals (polls, media, endorsements) that *do* create cascades.

  Here is the reconstruction of the implicit theory, followed by an evaluation of your friend's "Shadow Tally."

  ### Part 1: Reconstructing the Implicit Theory of the Secret Ballot

  To understand what the secret ballot presupposes about "other people's choices as evidence," we have to separate the *act* of voting from the *campaign* surrounding it. The theory relies on a specific distinction between **local evidence** (your neighbor) and **global evidence** (the polls).

  Here is how your four candidates map onto the practice:

  **(1) Votes are not pure reports (Social Contamination)**
  *   **Status:** *Comfortably sits, but not strictly needed.*
  *   **Analysis:** The secret ballot works best if we assume votes *ought* to be pure reports of private information/preference. However, the system acknowledges they aren't. By hiding the vote, the system attempts to *force* purity. It doesn't assume votes are already social; it assumes they *become* social if revealed. The tension here is that if votes are already contaminated by months of campaigning (which they are), hiding the neighbor's vote seems like locking the barn door after the horse has left.
  *   **Verdict:** The practice tries to mitigate this, but the existence of public polling admits this battle is already partially lost.

  **(2) People are bad at discounting (Cognitive Contamination)**
  *   **Status:** *Strictly Needed (for the anti-cascade justification).*
  *   **Analysis:** This is the core of the professor's claim. The theory presupposes that human rationality is bounded. We cannot mentally tag information as "Private Signal" vs. "Inferred from Public Tally." Once you see your neighbor vote X, you update your probability that X is correct. If you vote X because of that, you add weight to X for the next person, even though no *new* private information entered the system. The secret ballot is a firewall against this specific cognitive failure. It assumes that without the firewall, the aggregation mechanism breaks because the inputs are no longer independent.
  *   **Verdict:** This is the only justification that explains why we hide the vote *during* the process but reveal the *aggregate* immediately after.

  **(3) Coercion and Vote Buying (Incentive Contamination)**
  *   **Status:** *Strictly Needed (for the historical/legal justification).*
  *   **Analysis:** This is the robust, non-epistemic reason. If you can prove how you voted, you can sell it or be punished for it.
  *   **The Tension you spotted:** You noted that if (3) were the whole story, publishing votes *after* the fact should be fine. In many jurisdictions, it is not. Individual ballots are often sealed or destroyed. Why? Because (3) is not just about immediate bribery; it's about long-term retaliation. If your vote is linked to your name in a public archive, a future employer or local strongman can look it up and punish you in the next cycle.
  *   **Verdict:** (3) explains permanent anonymity. (2) explains anonymity *during* the voting window.

  **(4) Legitimacy and Autonomy (Normative Contamination)**
  *   **Status:** *Comfortably sits.*
  *   **Analysis:** This is the Rousseauian view. A vote is an expression of the "General Will" formed by individual consciences. If I vote because you voted, I am not a citizen; I am a follower. The legitimacy of the outcome rests on the independence of the inputs.
  *   **Verdict:** This explains why we feel uneasy about "bandwagon voting" even if it leads to the "correct" winner.

  **The Synthesis: The "Local vs. Global" Firewall**
  The implicit theory distinguishes between **Global Public Information** (polls, news) and **Local Private Information** (who is in the booth next to you).
  *   The system accepts that **Global Information** will cause some herding (momentum, endorsements). It treats this as "debate" or "persuasion."
  *   The system forbids **Local Information** during the act.
  *   **Why?** Because Global Information is diffuse and hard to verify. Local Information is immediate and high-fidelity. If I see my neighbor vote, I trust that signal much more than a poll. The secret ballot is designed to prevent the *high-fidelity local signal* from overriding the *low-fidelity global signal* and the *private signal*.

  **The Town Meeting Exception:**
  You asked why New England town meetings (public voting) don't cause a crisis.
  *   **Scale:** Cascades require a sequence. In a town meeting of 200 people, the social cost of dissent is high, but the epistemic value of the vote is different. These are often legislative decisions, not candidate selections.
  *   **Purpose:** The goal is often *consensus*, not *independent aggregation*. If everyone needs to live with the decision, seeing your neighbor's hand forces you to negotiate *before* the vote. The secret ballot assumes the goal is **truth-finding** (Condorcet's Jury Theorem), which requires independence. Town meetings assume the goal is **social cohesion**, which requires transparency.

  ---

  ### Part 2: Evaluating the "Shadow Tally" Scheme

  Your friend's scheme is a fascinating hybrid: **90% Secret Ballot + 10% Bayesian Updaters.**

  For this scheme to make sense, the designer must believe the following:

  1.  **Private Signals are Noisy, Public Tallies are Truthful:** They must believe that the 90% of voters are likely voting on weak private signals (guesses, biases), and that the running tally of those 90% represents a "truer" signal than the private information held by the remaining 10%. They are treating the early voters as a "focus group" for the late voters.
  2.  **Herding is a Correction Mechanism, Not a Failure:** This is the critical inversion. Standard cascade theory says herding leads to *error* (locking in the wrong choice early). Your friend's scheme assumes herding leads to *correction* (the late voters fixing the mistakes of the early voters by aligning with the majority). They are betting on the "Wisdom of Crowds" outweighing the "Informational Cascade."
  3.  **Inequality of Information is Legitimate:** They must believe that a vote cast with more information (the 10% who see the tally) is *more valuable* than a vote cast blindly. This violates the "One Person, One Vote" norm of equal weight, replacing it with a norm of "Equal Opportunity to be Right."
  4.  **Legitimacy is Outcome-Dependent:** They prioritize the *correctness* of the winner over the *procedural purity* of the voters. If the shadow tally ensures the "better" candidate wins, the fact that 10% of people voted based on social pressure is a feature, not a bug.

  **Should we have replaced the secret ballot with this?**
  **No. It is insane on the secret ballot's own terms.** Here is why:

  *   **It Breaks Independence (Condorcet's Jury Theorem):** The mathematical power of collective decision-making relies on the independence of errors. If Voter A and Voter B both guess randomly, they cancel out. If Voter B sees Voter A's guess and copies it, their errors correlate. By letting 10% see the tally, you are artificially correlating their votes with the first 90%. You are reducing the statistical sample size. You aren't getting 100 independent data points; you're getting 90 data points and 10 echoes.
  *   **It Amplifies Early Noise:** In a real election, the first 90% are *also* subject to herding (from polls, media). If the media creates a false momentum for Candidate X, the first 90% might lean X. The Shadow Tally shows the 10% that X is winning. The 10% then vote X. You have just locked in a media-driven error with 100% of the vote, whereas the secret ballot might have allowed the 10% to privately dissent based on local knowledge.
  *   **The "Super-Voter" Problem:** If the election is close, the 10% become kingmakers. They effectively have strictly more power than the 90% because they possess strictly more information. This creates a two-tier citizenship.
  *   **Strategic Voting:** The 10% might not vote for who they think is best; they might vote for who they think will win (to be on the winning side), or they might try to "game" the tally if they suspect the 90% are wrong.

  **Verdict:** Your friend has designed a **Technocratic Optimization** that ignores **Democratic Theory**. It treats voting as a distributed computing problem (let's minimize error!) rather than a political act (let's express sovereign will!). It solves for accuracy at the cost of legitimacy and independence.

  ---

  ### Part 3: If the Anti-Cascade Reading is Backwards

  Suppose you are right to be skeptical. Suppose the secret ballot is **only** about coercion (Candidate 3), and the "anti-herding" story is just post-hoc rationalization.

  **What would change in election design?**

  1.  **We would stop worrying about "Bandwagon Effects":** If herding doesn't matter epistemically, then media outlets calling states early, or publishing polls right before voting, is harmless. We currently regulate this (e.g., blackout periods in some countries). If the cascade story is false, these regulations are unnecessary paternalism.
  2.  **We would encourage "Voting Parties":** If the only risk is coercion by *outsiders* (bosses, husbands, warlords), then voting with your community inside the booth is fine, as long as the *outside* can't verify the result. We would see more collective deliberation right up to the curtain.
  3.  **Receipts might be allowed:** If the goal is only to prevent *others* from coercing *you*, but you want to prove to a civic organization that you voted, we might allow "I Voted" receipts that verify participation without revealing choice. (We actually do this, but the line is thin).
  4.  **Public Voting would be rehabilitated:** We would view Town Meetings not as "archaic exceptions" but as the norm for low-coercion environments. We wouldn't assume secret ballots are inherently more "democratic," just more "coercion-proof."

  **However, the evidence suggests the Anti-Cascade story is NOT backwards.**
  We know this because of **Ballot Selfies**.
  In many places, taking a photo of your ballot is illegal. Why?
  *   **Coercion Theory:** It allows you to prove to a briber how you voted. (Fits).
  *   **Cascade Theory:** It broadcasts your choice to your social network *before* they vote, potentially triggering a local cascade. (Fits).

  But consider **Exit Polls**. We ban people from publishing exit polls *while polls are open*.
  *   **Coercion Theory:** Exit polls don't help coerce anyone. You've already voted.
  *   **Cascade Theory:** Exit polls inform late voters (or voters in other time zones) about how early voters voted. This *does* trigger cascades.

  The fact that we suppress exit poll data until polls close is the smoking gun. It proves the system is designed to prevent **Informational Cascades**, not just Coercion. If it were only about coercion, exit polls would be free speech. Because we restrict them to protect the integrity of the *remaining* voters' independent judgment, we admit that **Candidate (2) is real.**

  ### Conclusion

  Your professor wasn't wrong, but they were incomplete. The secret ballot is a **hybrid technology**.
  1.  It is a **Shield** against coercion (Candidate 3).
  2.  It is a **Firewall** against local informational cascades (Candidate 2).

  It fails to protect against *global* cascades (polls, media), which is why elections still feel like herding events.

  Your friend's "Shadow Tally" fails because it tries to use the disease (herding) as the cure. It assumes the herd is wise. The secret ballot assumes the herd is dangerous, but the individual is fragile. The tension you feel comes from the fact that we live in a world where the individual is *also* influenced by the global herd, making the local secrecy feel like a half-measure. It is a half-measure. But without it, the local pressure would crush the private signal entirely.

  **Recommendation:** Stick with the secret ballot. It preserves the *possibility* of independence, even if the campaign tries to destroy it. Your friend's scheme destroys the possibility entirely.
