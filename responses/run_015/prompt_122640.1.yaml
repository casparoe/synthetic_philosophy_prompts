answer: |-
  **Exam Question**

  Consider a 'stipulation-proof dispute': two parties agree on all non-ontological facts, accept each other's paraphrases in a shared neutral vocabulary, and would assent to each other's sentences when read in the other's idiolect. Nevertheless, they refuse to abandon their preferred ontological vocabulary for public use, each claiming the other's terminology is actively misleading. Neither accepts a stipulation to dissolve the conflict.

  Write an essay addressing the following:
  1.  Does the label 'verbal' verdict on the *factuality* of the dispute or on the *activity* of the disputants?
  2.  Can a fully verbal dispute still be a disagreement worth having? If so, what kind of disagreement is it?
  3.  If the metaontological fight over what fixes the meaning of the neutral vocabulary is itself verbal in the same way, is this a vicious regress, a fixed point, or neither?
  4.  Does your answer change what we should say about first-order ontology?

  *Note: You must commit to a specific position. Do not merely list options. No citations or external references are required or permitted.*

  ***

  **Model Answer**

  The label 'verbal' must be understood as a verdict on the factuality of the dispute, not a dismissal of the activity. In a stipulation-proof dispute, the parties exhaust the factual ground; there is no remaining state of affairs upon which they disagree. However, identifying a dispute as verbal does not entail that the activity of arguing is pointless. The persistence of the conflict indicates that the disagreement has shifted from metaphysics to pragmatics. The parties are not fighting over what exists, but over which conceptual tool is fit for purpose.

  Consequently, a fully verbal dispute can absolutely be worth having. It is a normative disagreement rather than a descriptive one. When one side insists on a restricted quantifier and the other on a permissive one, despite agreeing on the neutral facts, they are advocating for different linguistic policies. One might argue their vocabulary 'carves nature at the joints' better, facilitating scientific induction, while the other argues their vocabulary minimizes error and aligns with common sense. These are competing claims about utility, clarity, and theoretical cost. To say the dispute is verbal is to say there is no *fact* of the matter regarding which ontology is true, but there may well be a fact of the matter regarding which ontology is *useful*. The disagreement is worth having because the choice of vocabulary constrains future thought and action.

  This leads to the metaontological layer. If the fight over what fixes the meaning of the neutral vocabulary is itself verbal, this is not a vicious regress; it is a fixed point. A regress implies an endless deferral of resolution where no conclusion is reachable. A fixed point indicates that we have reached the bedrock of the inquiry. If we cannot non-verbally settle which meaning-fixing method is correct, it confirms that there is no external, metaphysical vantage point from which to judge our conceptual schemes. We are always inside a linguistic framework. Recognizing this stops the search for a 'super-ontology' that validates one framework over another. It stabilizes the view that ontology is fundamentally a project of conceptual engineering rather than metaphysical discovery.

  This fundamentally changes what we should say about first-order ontology. We must abandon the idea that ontological claims are descriptions of a mind-independent structure waiting to be found. Instead, first-order ontology should be treated as a recommendation. When an ontologist claims 'composite objects do not exist,' they should be understood as proposing, 'Let us adopt a vocabulary where quantification does not range over composites, because doing so yields theoretical benefits.' The truth conditions of ontological sentences become relative to the chosen framework, but the choice of framework is judged by pragmatic virtue.

  Therefore, the stipulation-proof dispute reveals that ontology is not broken by verbalness; it is merely relocated. The failure to dissolve the dispute via stipulation shows that the stakes are not truth, but authority over the conceptual scheme. By accepting the metaontological fixed point, we acknowledge that the only remaining question is not 'What is there?' but 'How shall we speak?' This does not eliminate ontology, but it strips it of its traditional realist ambition. The dispute remains vigorous because the choice of language shapes the world we inhabit, even if it does not describe the world as it is in itself.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Verdict vs. Activity Distinction (4 marks)**
  *   **Hit:** Explicitly distinguishes 'verbal' as denying factual residue while preserving pragmatic significance.
  *   **Miss:** Treats 'verbal' as synonymous with 'pointless' or 'confused,' implying the students should stop arguing.
  *   *Common Screw-up:* Conflating the lack of truth-conditions with the lack of value.

  **2. Justification of Worth (4 marks)**
  *   **Hit:** Identifies the disagreement as normative/pragmatic (utility, clarity, policy) rather than descriptive.
  *   **Miss:** Claims it is worth having only because one side might still be factually right (contradicting the prompt's premises).
  *   *Common Screw-up:* Trying to smuggle factual disagreement back in to justify the worth.

  **3. Regress vs. Fixed Point (4 marks)**
  *   **Hit:** Identifies the metaontological verbalness as a 'fixed point' (bedrock) rather than a vicious regress.
  *   **Miss:** Claims this leads to skepticism, nihilism, or an infinite loop where no decision is possible.
  *   *Common Screw-up:* Thinking that if the meta-dispute is verbal, no conclusion can ever be reached (missing the engineering shift).

  **4. First-Order Implication (4 marks)**
  *   **Hit:** Concludes that first-order ontology becomes recommendatory/engineering rather than descriptive/realist.
  *   **Miss:** Maintains that first-order ontology remains a search for mind-independent facts despite the metaontological conclusion.
  *   *Common Screw-up:* Compartmentalizing the metaontological conclusion so it doesn't affect the first-order practice.

  **5. Commitment and Clarity (4 marks)**
  *   **Hit:** Maintains a consistent, argued position throughout without fence-sitting.
  *   **Miss:** Hedges constantly ("On one hand... on the other...") or contradicts earlier claims in later paragraphs.
  *   *Common Screw-up:* Describing the options available rather than selecting and defending one.

  **A/B Boundary:**
  *   **A Range (15-20):** Successfully navigates the regress objection (Move 3) and uses it to transform the definition of ontology (Move 4). The argument is cohesive.
  *   **B Range (10-14):** Correctly identifies the dispute as verbal and pragmatic (Moves 1 & 2) but treats the metaontological regress as a problem to be solved or avoided rather than a fixed point that changes the nature of the field.
  *   **C Range (0-9):** Fails to distinguish factual from pragmatic disagreement or claims the dispute should simply dissolve.

  **⚠️ Potential Misreading Flag:**
  Students often misread **Question Part 3** ("If the metaontological fight... is itself verbal"). They tend to interpret this as "If we can't agree on meaning, nothing is settled," leading to skepticism. The question intends for them to see this as *stabilizing* a pragmatic view (a fixed point). Instructors should be alert for answers that treat this condition as a failure state rather than a foundational insight.
