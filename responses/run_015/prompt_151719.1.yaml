  accepting **drift** as part of every vow.
  **Fidelity** to sound, or to the soul?
  The **rhyme** reveals the gaps within the whole.
  There is no single **meaning** to inherit,
  only the **cadence** of the choice we make.

  If **meaning** rides upon a new **cadence**,
  then **fidelity** escapes the **meter**'s fence.
  And **rhyme** becomes the engine of the **drift**.

  ***

  **Note on Form and Theory**

  There is broad consensus among translation theorists that adhering to tight formal constraints—like the sestina structure used above—necessarily forces changes to the original text's literal content. Everyone agrees that something is always lost; you cannot replicate sound and sense perfectly across languages simultaneously. This is the "loss" side of the equation, acknowledged in the first stanza where form is initially described as a "wall" and "debt."

  However, what is genuinely contested is whether form can carry content that no prose paraphrase recovers, and whether "faithfulness" to an original is even a coherent target. The poem takes a side on these disputed points. In the second stanza, it argues that "drift" is not an error but a mode of movement ("how the poem moves"), suggesting form generates new content rather than just deleting old content. The envoi lands on the most controversial claim: that fidelity is not about matching the "meter's fence" but about enabling a new "cadence." This rejects the idea that there is a canonical mapping to be faithful to, proposing instead that the constraint itself is the discovery.
