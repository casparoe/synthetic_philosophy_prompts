  What I want is this. Restate, as faithfully as you can, the Arrow setup — the aggregation of individual orderings over a set of alternatives into one social ordering, subject to unrestricted domain, weak Pareto, independence of irrelevant alternatives, and non-dictatorship, with the conclusion that no such aggregation exists — entirely in the vocabulary I actually use, and then give me the residue report. I have some specific translation targets in mind, so please handle them. Take independence of irrelevant alternatives first: it looks to me like a causal or architectural invariance condition, the requirement that the pairwise decision for x versus y factor through only the voters' x-versus-y comparisons and have no access to the rest of the profile, which would make every listwise loss structurally IIA-violating by construction and every pairwise loss structurally IIA-compliant. Is that right, or am I conflating an axiom on the outputs of a function with a restriction on the function's inputs? Take unrestricted domain next: an ML model is never required to behave well off-distribution, so please also translate the theorem into a relaxed setting I've been playing with — call it (D, ε, m)-compliance, where a parametric aggregator is selected by empirical risk minimization from m sampled profiles drawn from a distribution D, and the four conditions are only required to hold on D up to error ε. Does anything like the impossibility survive there, presumably as a generalization or sample-complexity statement rather than an exact one? Where precisely does the standard proof strategy — the decisive-coalition, pivotal-voter style argument — stop going through when compliance is only approximate and only on-distribution? And if it does survive, what does "dictatorship" denote for a trained model: I'd propose something like ε-soft dictatorship, meaning the learned aggregator agrees with the projection onto a single voter's ranking on at least a 1−ε fraction of D. Is that a