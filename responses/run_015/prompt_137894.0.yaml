answer: |-
  ### Scratchpad: Notes on Translation Violence

  *   **IIA:** User is half-right. It's not just "architectural invariance" (though that's the implementation); it's a constraint on the *information set* available to the decision boundary. In ML terms: the computational graph for the logit $x \succ y$ must have zero gradient path from any feature encoding $z \succ_i \cdot$. Listwise softmax violates this because the partition function $Z$ depends on all candidates. Pairwise Bradley-Terry (BT) satisfies this *structurally*, provided the feature extractor for $x$ doesn't attend to $y$ or $z$.
  *   **Unrestricted Domain:** This is the biggest collision. ML assumes $P_{train} \approx P_{test}$. Arrow assumes $\forall \text{ profiles}$. Translating to $(D, \epsilon, m)$ turns a logical impossibility into a statistical lower bound. If $D$ has low entropy (e.g., voters are clustered), the "impossibility" vanishes (Black's Median Voter Theorem vibes). The proof breaks at the "pivotal voter" lemma because pivotality becomes probabilistic; you can't construct the strict sequence of profiles needed to force the contradiction if some profiles have probability 0.
  *   **Dictatorship:** In SC, a dictator is a *right*, not a statistical artifact. In ML, a "dictator" is just a feature that explains variance. An $\epsilon$-soft dictator is a model that minimizes loss by memorizing voter $k$. But ML might learn a "synthetic dictator" (a linear combo of voters) which isn't a dictator in Arrow's sense (no single voter $k$ matches perfectly). This is a distortion.
  *   **Randomization:** Arrow's theorem is for deterministic Social Welfare *Functions*. If we allow Social Welfare *Lotteries* (distributions over orderings), Random Dictatorship satisfies IIA, Pareto, and Non-Dictatorship (ex-ante). In ML, this is a Mixture of Experts where the gate is uniform over voter-specific heads. It dissolves the impossibility but changes the guarantee from "always fair" to "fair in expectation."
  *   **Cardinality:** RLHF reward models output scalars ($r(x) \in \mathbb{R}$). Arrow assumes ordinals ($x \succ y$). Cardinality allows interpersonal comparison (Utilitarianism). This doesn't "escape" Arrow; it sidesteps the input space entirely. It changes the problem from aggregation of *rankings* to aggregation of *utilities*.
  *   **Normativity:** ML optimizes *fit*; SC optimizes *legitimacy*. "Dictatorship" in ML is a generalization error; in SC, it's a violation of sovereignty. This is the core residue.

  ***

  ### Part 1: The Translation & Technical Commentary

  Here is the Arrow setup restated in your vocabulary, followed by the analysis of your specific translation targets.

  #### The ML Restatement of Arrow's Theorem

  **The Setup:**
  You are training an aggregator model $M_\theta$ (the Social Welfare Function).
  *   **Input:** A batch of $n$ voter preference lists (the Profile $\mathbf{P}$). In your data loader, this is a tensor of shape $(n, |\mathcal{A}|, |\mathcal{A}|)$ representing pairwise comparisons, or $(n, |\mathcal{A}|)$ representing rankings.
  *   **Output:** A single social preference ordering (the Prediction $\succ_S$). In your vocabulary, this is the model's inferred ranking over $\mathcal{A}$, derived from scores $s(x)$.
  *   **Hypothesis Class:** The set of all possible parametric aggregators you could learn.

  **The Constraints (Axioms as Regularizers):**
  1.  **Unrestricted Domain $\to$ Universal Support Coverage:** The model must produce a valid probability distribution over orderings for *any* input tensor $\mathbf{P}$, not just those drawn from your training distribution $D_{train}$. You cannot assume the data is realizable or i.i.d.
  2.  **Weak Pareto $\to$ Consensus Consistency:** If every voter in the input batch prefers $x$ to $y$ (label consensus), the model's predicted probability $P_M(x \succ y)$ must be 1. You cannot override unanimous agreement.
  3.  **Independence of Irrelevant Alternatives (IIA) $\to$ Input Factorization:** The model's predicted logit for $x \succ y$ must be computed using *only* the input features corresponding to voter preferences between $x$ and $y$. The computational graph for the pair $(x,y)$ must be disconnected from the input nodes representing preferences involving $z$.
  4.  **Non-Dictatorship $\to$ No Single-Source Memorization:** There is no index $k \in \{1, \dots, n\}$ such that $M_\theta(\mathbf{P})$ outputs voter $k$'s ranking with probability 1 for all $\mathbf{P}$. The model cannot simply learn the identity function on the $k$-th channel of the input batch.

  **The Theorem:**
  There exists no hypothesis class (parametric aggregator) that can simultaneously satisfy Universal Support Coverage, Consensus Consistency, Input Factorization, and No Single-Source Memorization. Any architecture you build will fail at least one constraint in the limit of infinite data.

  ***

  #### Analysis of Translation Targets

  **1. Independence of Irrelevant Alternatives (IIA)**
  *   **Your Intuition:** You asked if IIA is a causal/architectural invariance condition, making listwise losses IIA-violating and pairwise losses IIA-compliant.
  *   **Verdict:** **Mostly Right, with a caveat.**
      *   IIA is indeed a restriction on the function's input dependency (the "receptive field" of the decision boundary).
      *   **Listwise Softmax:** Violates IIA structurally. The probability $P(x \succ y)$ is $\frac{e^{s(x)}}{e^{s(x)} + e^{s(y)} + \sum_{z} e^{s(z)}}$. The score for $z$ directly alters the probability mass assigned to $x \succ y$. Adding a candidate $z$ changes the relative ranking of $x$ and $y$.
      *   **Pairwise Bradley-Terry:** Satisfies IIA structurally. $P(x \succ y) = \sigma(s(x) - s(y))$. The presence of $z$ does not appear in the equation.
      *   **The Caveat:** IIA is an axiom on the *aggregation rule*, not just the loss. You could train a pairwise model on listwise data such that the learned representations $s(x)$ implicitly encode information about $z$ (e.g., via a shared transformer backbone that attends to all candidates). To strictly satisfy IIA, the architecture must enforce *masking* so the representation of $x$ cannot attend to $z$.

  **2. Unrestricted Domain $\to$ $(D, \epsilon, m)$-Compliance**
  *   **Translation:** You relax "for all profiles" to "for all profiles in the support of $D$, with error $\le \epsilon$, given $m$ samples."
  *   **Does Impossibility Survive?** **Generally No, unless $D$ is adversarial.**
      *   Arrow's proof relies on constructing specific, often pathological, profiles to force a contradiction. If your distribution $D$ has low entropy (e.g., voter preferences are clustered or single-peaked), the "impossible" profiles never appear in your training set. The model can satisfy all axioms *on-distribution*.
      *   **Sample Complexity:** If $D$ is uniform over all possible profiles (max entropy), the impossibility returns as a generalization bound. To guarantee $\epsilon$-compliance on all axioms, your sample complexity $m$ must grow exponentially with the number of alternatives, effectively making it impossible to verify compliance.
      *   **Where the Proof Breaks:** The standard proof uses a "pivotal voter" argument, constructing a sequence of profiles where one voter switches their vote to change the social outcome. In the $(D, \epsilon, m)$ setting, you cannot guarantee the existence of the specific profile sequence needed to identify the pivot. The "pivotal voter" becomes a "probabilistic influencer," and the contradiction dissolves into a bound on influence.

  **3. Dictatorship $\to$ $\epsilon$-Soft Dictatorship**
  *   **Translation:** A model is an $\epsilon$-soft dictator if there exists a voter $k$ such that the model's ranking disagrees with voter $k$'s ranking on at most an $\epsilon$-fraction of pairs drawn from $D$.
  *   **Is this Fair?** **It is a Weakening, but potentially a Different Notion.**
      *   In Social Choice, a dictator is *deterministic* and *global*. In ML, an $\epsilon$-dictator is *probabilistic* and *local to $D$*.
      *   **The Distortion:** An ML model might learn a "synthetic dictator"—a linear combination of voters that minimizes loss better than any single voter. Arrow's theorem forbids *any* single voter from having full control. ML doesn't care if the "dictator" is a mixture, as long as the loss is low. However, if the model converges to copying Voter 1 because Voter 1 has the lowest noise, that is functionally a dictatorship in the Arrow sense, even if you call it "overfitting."

  **4. Randomization (Ensembles/Mixtures)**
  *   **Translation:** The aggregator outputs a distribution over orderings (a lottery). In ML, this is an ensemble of models or a Mixture of Experts.
  *   **Does it Dissolve the Result?** **Yes.**
      *   If you allow the social outcome to be a lottery, **Random Dictatorship** (pick a voter uniformly at random and adopt their ranking) satisfies IIA, Pareto, and Non-Dictatorship (ex-ante).
      *   In your vocabulary: Train $n$ separate models, one for each voter. At inference, sample a voter index $k \sim \text{Uniform}(1, n)$ and output model $k$'s prediction.
      *   **The Catch:** This satisfies the axioms, but it's a terrible predictor if you care about "truth" or "consensus." It minimizes *maximum regret* rather than *average loss*. It dissolves the impossibility by changing the objective from "find the best ranking" to "find a fair procedure."

  ***

  ### Part 2: The Residue Report

  Here is what gets lost, distorted, or smuggled in when we translate Arrow into ML.

  | Arrow Condition | Translation Status | Notes on Distortion / Smuggling |
  | :--- | :--- | :--- |
  | **Unrestricted Domain** | **Distorted** | **Smuggled Assumption:** ML assumes $P_{train} \approx P_{test}$. Arrow assumes *adversarial* inputs. By moving to $(D, \epsilon, m)$, you implicitly assume the "impossible" profiles are irrelevant. This smuggles in the assumption that the future will look like the past, which is a statistical claim, not a normative one. |
  | **Weak Pareto** | **Clean** | **Translation:** "Consensus Consistency." This maps well. If all labels agree, the loss function penalizes disagreement. No major residue here, except that ML allows violations if they reduce overall loss (regularization), whereas Arrow forbids them logically. |
  | **IIA** | **Distorted** | **Smuggled Assumption:** In ML, violating IIA (context dependence) is often a *feature* (e.g., attention mechanisms). In Arrow, it is a *bug* (manipulability). By enforcing IIA architecturally (pairwise BT), you are restricting model capacity to satisfy a normative constraint you might not actually want for prediction accuracy. |
  | **Non-Dictatorship** | **No Expression** | **Missing Normativity:** ML has no concept of "illegitimate authority." If copying Voter 1 minimizes the held-out loss, the optimizer *should* do it. Arrow forbids it even if Voter 1 is "right" most of the time. The concept of "rights" or "sovereignty" has no gradient. |
  | **Conclusion (Impossibility)** | **Distorted** | **Logical vs. Statistical:** Arrow proves *non-existence*. ML proves *high sample complexity* or *generalization error*. The residue is the difference between "you cannot build this" and "you cannot train this with finite data." |

  #### Specific Residues of Concern

  **1. Voters as Sources vs. Voters as Features**
  *   **Status:** **No Expression.**
  *   **Analysis:** In your vocabulary, voters are just another dimension of the input batch (like features in a vision task). If the model learns to attend more to "Voter 3" because their labels are less noisy, that's good feature attribution. In Social Choice, Voter 3 is a *principal*, not a feature. Giving them more weight isn't "denoising"; it's disenfranchisement. Your vocabulary treats voters as *informational sources* to be mined; Arrow treats them as *sovereign agents* to be respected. This is the deepest mismatch.

  **2. Exact vs. Approximate Compliance**
  *   **Status:** **Distorted.**
  *   **Analysis:** Arrow is a theorem about *rules*. ML is a practice of *approximation*. By translating axioms into loss terms (e.g., adding a penalty for IIA violations), you turn hard constraints into soft regularizers. This smuggles in the assumption that a "little bit of dictatorship" is acceptable. In political theory, 1% dictatorship is still tyranny. In ML, 1% error is state-of-the-art.

  **3. Ordinal vs. Cardinal (The Reward Model Escape)**
  *   **Status:** **Changes the Subject.**
  *   **Analysis:** You noted that reward models give commensurable numbers ($r(x) \in \mathbb{R}$). Arrow assumes ordinal rankings ($x \succ y$).
      *   **Does it escape the result?** Yes. If you have cardinal, interpersonally comparable utilities, you can sum them (Utilitarianism). This satisfies Pareto and Non-Dictatorship.
      *   **The Cost:** You lose the robustness of ordinality. Cardinal rewards require a calibration assumption (that Voter 1's "5 stars" equals Voter 2's "5 stars"). Arrow explicitly rejects this comparability. By using reward models, you are assuming a normative framework (Utilitarianism) that Arrow was designed to critique. You aren't solving the aggregation problem; you are assuming it away by positing a common currency of value.

  ***

  ### Part 3: Final Position on the Residue

  **Is the vocabulary missing something normative, or are the axioms doing less work?**

  **Verdict:** The axioms are doing less work because **ML optimizes for Prediction, while Social Choice optimizes for Justification.**

  When you translate Arrow into ML, you are translating a *political constraint* into a *statistical regularizer*.
  *   **Missing Normativity:** Your vocabulary is missing the concept of **Legitimacy**. In ML, a dictator is acceptable if it generalizes. In Social Choice, a dictator is unacceptable even if they are benevolent. The residue isn't that your vocabulary is "wrong"; it's that it is *instrumental*. It asks "Does this model predict preferences?" whereas Arrow asks "Is this rule fair?"
  *   **Axioms as Regularizers:** In the ML context, the Arrow axioms function as inductive biases. IIA is a constraint on the computational graph. Pareto is a constraint on the loss landscape. When they conflict with minimization, ML drops them. This reveals that in RLHF, we are implicitly making normative choices (e.g., "we prefer context-dependent rankings" by using listwise loss, or "we prefer utilitarian aggregation" by using cardinal rewards) without acknowledging them as such.

  **Conclusion:** The residue is evidence that **RLHF is not preference aggregation; it is preference estimation.** Arrow's theorem applies to *aggregating conflicting wills*. RLHF attempts to *estimate a latent ground-truth reward function*. If you believe there is a ground truth (a "correct" alignment"), Arrow is irrelevant—you are doing supervised learning, not voting. If you believe there is no ground truth and only conflicting human values, then Arrow applies, and your current vocabulary (loss minimization, generalization error) is insufficient to capture the normative failure of "learning a dictator." You are treating a political problem as an engineering one.
