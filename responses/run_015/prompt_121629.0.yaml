answer: |-
  # Desiderata for a Theory of Personal Identity under the Constraint of *Anatta*

  **Context:** This specification treats the Buddhist doctrine of *anatta* (no-self) not merely as a negative ontological claim (the denial of *atman*) but as a positive structural constraint on any account of diachronic identity. An adequate theory must explain how moral continuity, autobiographical coherence, and rebirth function *in the absence* of a numerically identical substratum.

  ## I. Phenomenological and Experiential Desiderata
  *What the theory must account for regarding first-person experience.*

  **1. The Stability of Attention without a Stabilizer [BN]**
  *   **Requirement:** The theory must explain the phenomenological continuity of attention across deep meditative states (e.g., *jhana*) without positing a homuncular "attender."
  *   **Motivation:** In deep concentration, the *sense* of self may fade, yet the causal efficacy of attention remains stable and directed. A theory that equates identity with self-consciousness fails here, as consciousness persists without self-referentiality.
  *   **Status:** **Non-Negotiable (Buddhist).** Denying this renders soteriological practice incoherent.

  **2. Post-Cessation Coherence [BN]**
  *   **Requirement:** The theory must account for the resumption of coherent experience and memory after states where subject-object structure temporarily collapses (e.g., *nirodha-samapatti* or deep sleep).
  *   **Motivation:** Upon emerging from cessation, the practitioner recognizes the state they entered and continues their practice. If the stream were totally severed, there would be no recognition or karmic carry-over.
  *   **Status:** **Non-Negotiable (Buddhist).** Essential for the continuity of the path.

  **3. The Illusion of Diachronic Unity [BN/WI]**
  *   **Requirement:** The theory must explain *why* the illusion of a permanent self arises, without validating its ontology.
  *   **Motivation:** The feeling of "I am" is pervasive. A theory that simply denies it without explaining its genesis (e.g., via clinging to aggregates) is phenomenologically inadequate.
  *   **Status:** **Shared.** Western illusionism (e.g., Dennett) and Buddhism agree here, though motivations differ (evolutionary utility vs. soteriological liberation).

  ## II. Ethical and Soteriological Desiderata
  *What the theory must deliver regarding moral logic and rebirth.*

  **4. Ownerless Karma [BN]**
  *   **Requirement:** The theory must provide a mechanism for moral responsibility and karmic fruition without an enduring "owner" of actions.
  *   **Motivation:** The *Visuddhimagga* states: "No doer is there, naught save the deed is found." If identity requires an owner, karma is impossible. If karma is impossible, the Dharma is nihilistic.
  *   **Status:** **Non-Negotiable (Buddhist).** This is the soteriological core.

  **5. Rebirth without Transmigration [BN]**
  *   **Requirement:** The theory must accommodate causal continuity between lives without the transmigration of a substance or soul.
  *   **Motivation:** Rebirth is standard orthodoxy. However, it cannot be the movement of an entity from Body A to Body B (eternalism) nor the creation of a wholly unrelated being (nihilism).
  *   **Status:** **Non-Negotiable (Buddhist).** (Note: Secular Buddhists may contest this, but within traditional metaphysics, it is required).

  **6. Accountability vs. Identity [WI]**
  *   **Requirement:** The theory must satisfy the Western intuition that moral responsibility requires numerical identity between the agent and the patient of punishment/reward.
  *   **Motivation:** Western retributive justice logic suggests it is unfair for Person-B (future) to suffer for Person-A (past) unless they are strictly the "same."
  *   **Status:** **Imported Prejudice.** Buddhism explicitly rejects this. Responsibility is causal, not retributive in the Western legalistic sense. Insisting on this creates the primary tension (see Section V).

  ## III. Metaphysical and Conceptual Distinctions
  *What distinctions the theory must preserve to avoid logical pitfalls.*

  **7. Causal Continuity vs. Numerical Identity [BN]**
  *   **Requirement:** The theory must rigorously distinguish between *santana* (stream continuity) and *tadatmya* (self-sameness).
  *   **Motivation:** Confusing these leads to the extremes of Eternalism (asserting numerical identity) or Nihilism (denying causal continuity).
  *   **Status:** **Non-Negotiable (Buddhist).** This is the "Middle Way" metaphysical pivot.

  **8. The Two Truths Constraint [BN]**
  *   **Requirement:** The theory must operate on two levels: Conventional Truth (*samvrti-satya*) where persons exist as designators, and Ultimate Truth (*paramartha-satya*) where only impersonal processes exist.
  *   **Motivation:** To avoid pragmatic paralysis (we must speak of "I" to function) and ontological error (believing the "I" is real).
  *   **Status:** **Non-Negotiable (Buddhist).**

  **9. Psychological Connectedness as Identity [WI]**
  *   **Requirement:** The theory should not rely solely on psychological connectedness (memory, character) as the sole criterion for identity, as this fails in cases of amnesia or radical personality shift.
  *   **Motivation:** Parfit-style reductionism comes close to Buddhism but often retains a Western focus on "what matters in survival" rather than "what constitutes the stream."
  *   **Status:** **Imported Prejudice.** Buddhism prioritizes causal dependency over psychological similarity.

  ## IV. Empirical and Scientific Constraints
  *What the theory cannot contradict regarding modern mind science.*

  **10. No Central Controller [WI/Science]**
  *   **Requirement:** The theory cannot posit a Cartesian theater or central executive that is ontologically distinct from neural/mental processes.
  *   **Motivation:** Neuroscience and Abhidharma both suggest decentralized processing.
  *   **Status:** **Convergent.** Supported by both cognitive science and Buddhist analysis.

  **11. Memory as Reconstruction [Science]**
  *   **Requirement:** The theory must treat memory as a constructive, fallible process rather than a storage-retrieval of static "files."
  *   **Motivation:** Clinical psychology shows autobiographical memory is malleable. A theory relying on rigid memory chains for identity will fail empirically.
  *   **Status:** **Empirical Constraint.**

  **12. Dissociation and Fragmentation [Science]**
  *   **Requirement:** The theory must accommodate cases of dissociative identity without resorting to "multiple souls."
  *   **Motivation:** If identity is a process, fragmentation is possible. This mirrors the Buddhist analysis of the aggregates (*skandhas*) falling out of sync.
  *   **Status:** **Empirical Constraint.**

  ## V. The Incompatibility Cluster (Jointly Unsatisfiable Requirements)
  *The following subset of desiderata generates a logical tension that standard analytic metaphysics cannot resolve without abandoning one premise.*

  **The Tension:**
  1.  **Strict Causal Discontinuity at Death:** If *anatta* is true, there is no substance to cross the death barrier. The causal link between life A and life B must be radically discontinuous (like one candle lighting another, not water pouring).
  2.  **Robust Moral Responsibility:** If karma is to be ethically meaningful, the being experiencing the result must be "responsible" for the action.
  3.  **Western Intuition of Fairness:** It is unjust for X to suffer for Y's deeds unless X *is* Y (Numerical Identity).

  **Analysis:**
  *   Requirements **II.4 (Ownerless Karma)** and **II.5 (Rebirth)** are [BN].
  *   Requirement **II.6 (Accountability via Identity)** is [WI].
  *   **Conflict:** You cannot satisfy [BN] and [WI] simultaneously. If you maintain strict *anatta* (no numerical identity across lives), you violate the Western intuition of fairness. If you satisfy the Western intuition (by positing a subtle self), you violate *anatta*.
  *   **Resolution Strategy:** A Buddhist-compatible theory must **dissolve** the Western intuition (II.6). It must reframe responsibility as *causal inheritance* rather than *retributive ownership*. However, this leaves the theory vulnerable to the "Why should I care?" objection from a Western ethical framework. This is the primary friction point for cross-cultural metaphysics.

  ## VI. Classification of Desiderata

  | Desideratum | Classification | Rationale |
  | :--- | :--- | :--- |
  | **Ownerless Karma** | **Non-Negotiable [BN]** | Core to the Four Noble Truths. |
  | **Causal vs. Numerical Identity** | **Non-Negotiable [BN]** | Defines the Middle Way. |
  | **Two Truths Constraint** | **Non-Negotiable [BN]** | Required to avoid nihilism/eternalism. |
  | **Stability of Attention** | **Non-Negotiable [BN]** | Required for meditative efficacy. |
  | **Numerical Identity for Responsibility** | **Imported [WI]** | Western legal/retributive bias. |
  | **Psychological Connectedness** | **Imported [WI]** | Lockean/Parfitian bias; Buddhism allows for causal continuity without memory. |
  | **No Central Controller** | **Convergent** | Agreed upon by Neuroscience and Abhidharma. |

  ## VII. Brief Evaluation of Existing Accounts

  **1. Reductionist/Physicalist Accounts (e.g., Dennett, Churchland)**
  *   **Performance:** High compatibility with Empirical Constraints (IV) and the denial of Numerical Identity (III.7).
  *   **Failure:** Cannot accommodate Rebirth (II.5) or Karmic Continuity beyond biological death without ad hoc assumptions. They often collapse the Conventional Self into an illusion too weak to support the ethical weight of Karma (II.4).

  **2. Narrative Self Accounts (e.g., Schechtman, MacIntyre)**
  *   **Performance:** Strong on Autobiographical Coherence (I.3) and Conventional Truth (III.8).
  *   **Failure:** Risks reifying the self as a "storyteller" (violating *anatta*). Struggles with Pre-narrative experience (deep meditation states where narrative collapses, I.1 & I.2). Often implicitly relies on Western notions of autonomy incompatible with *anatta*.

  **3. Abhidharma/Stream-Continuity Accounts (e.g., Vasubandhu, Buddhaghosa)**
  *   **Performance:** Best fit for Non-Negotiable Buddhist constraints (II.4, II.5, III.7). Successfully distinguishes causal continuity from numerical identity.
  *   **Failure:** Struggles with the "Incompatibility Cluster" when translated into Western analytic terms. The "candle flame" analogy satisfies [BN] but fails to satisfy [WI] regarding moral fairness. Requires the interlocutor to abandon Western retributive logic to make sense.

  **Conclusion for Seminar:**
  An adequate theory must not attempt to force *anatta* into the mold of Western personal identity (which seeks *identity*). Instead, it must propose a **metaphysics of process** where "identity" is replaced by "causal efficacy." The primary task is not to solve the puzzle of "who is reborn" but to demonstrate why the question presupposes a category error.
