      *   **Tone:** Academic, rigorous, philosophical, suitable for a seminar.

  2.  **Deconstruct the Core Tension:**
      *   Western Personal Identity (WPI) usually seeks *numerical identity* over time (what makes Person A at t1 the *same* entity as Person B at t2?).
      *   Buddhist Personal Identity (BPI) usually seeks *causal continuity* without ontological permanence (how do consequences flow without a persisting substrate?).
      *   The prompt asks to treat *anatta* as a positive constraint. This means the theory *must* explain how things work *without* a self, rather than just saying "there is no self."
      *   Key friction point: Moral responsibility (Karma) usually implies an agent. Rebirth implies continuity. *Anatta* implies no agent and discontinuity of substance.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Phenomenal Constraints:*
          *   Need to account for meditation. If there's no self, why does attention feel stable in Jhana?
          *   Need to account for "collapse" of subject-object (Nirodha Samapatti). How does experience resume coherently?
          *   *Motivation:* First-person phenomenology cannot be ignored.

      *   *Ethical/Karmic Constraints:*
          *   Karma needs a bearer of consequences, but *anatta* denies a permanent bearer.
          *   *Motivation:* Soteriological efficacy. If karma doesn't work, the path is pointless.

      *   *Metaphysical Distinctions:*
          *   Causal Continuity vs. Numerical Identity. This is crucial.
          *   Two Truths: Conventional (self exists for speech) vs. Ultimate (no self).
          *   *Motivation:* Avoiding nihilism (ucchedavada) and eternalism (sassatavada).

      *   *Scientific Constraints:*
          *   No homunculus.
          *   Memory is reconstructive, not reproductive.
          *   Dissociative states exist.
          *   *Motivation:* Naturalism/Compatibility with modern mind science.

      *   *Conceptual Puzzles:*
          *   The "Who is reborn?" question.
          *   The "Who remembers?" question.
          *   *Motivation:* Logical coherence.

      *   *Classification (Non-negotiable vs. Imported):*
          *   Non-negotiable: Causal continuity, Two Truths, Karmic efficacy, Phenomenological accuracy regarding impermanence.
          *   Imported: Numerical identity, Psychological connectedness as *identity* (Parfit style might be close, but Western debates often seek a "yes/no" answer to identity), Substance ontology.

      *   *The "Hard Problem" (Jointly Unsatisfiable):*
          *   Strict causal discontinuity (death breaks the causal stream significantly) vs. Robust Moral Responsibility (I must pay for *my* past deeds).
          *   If the stream is too broken, responsibility fails. If the stream is too continuous, *anatta* fails (sliding into eternalism).

  4.  **Structuring the Response:**
