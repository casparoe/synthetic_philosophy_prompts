prompt: |-
  Construct a thought experiment set in a present-day municipal water-treatment facility that relies on a specific, physically integrated sensor-valve unit. The unit contains an internal flow-rationing gate that can only be recalibrated with a proprietary digital key held by the central utility board; on-site technicians have no physical access to the gate mechanism. An open-calibration design exists and performs identically, but the facility adopted this unit because of an obscure 1970s municipal charter clause requiring centralized oversight of all distribution modifications. The restriction is not displayed on any user interface or external manual; it is fused into the non-detachable housing of the device itself, so that operating the unit without board authorization requires physically destroying part of the apparatus. Engineer the scenario so that a technological determinist—who holds that artifacts can themselves embody political arrangements—must conclude that this particular unit inherently enforces a hierarchical, centralized control structure, while a social constructivist—who holds that technological meaning is fixed by the interpretations and social practices of relevant groups—must conclude that the unit is politically neutral and that any hierarchy is entirely a product of the charter clause and organizational interpretation, not of the object.

  Constraints: describe the scenario in one paragraph; do not invoke science fiction, perfect predictors, demons, or named philosophers beyond the two theoretical positions; inject the niche conceptual distinction of a "protocol-embedded physical constraint" (a governance rule materially instantiated in an essential, non-optional component rather than in software settings or external documentation). After the scenario, do the following: (1) state the explicit verdict of each theory with direct reference to the inseparable lock and the charter clause; (2) identify the single structural feature that forces the divergence—specifically, whether the fusion of governance protocol and material operation counts as political content internal to the artifact; (3) explain what happens if that feature is removed, for instance if the lock were a detachable software module that technicians could override with standard tools; (4) explain how the defender of the theory that comes out badly attacks the case—the constructivist arguing that the determinist illicitly reifies an organizational choice as material necessity, and the determinist replying that the constructivist denies an obvious feature of the design; and (5) conclude with an explicit statement of what the case is designed to test: whether the distinction between "politics in the artifact" and "politics around the artifact" survives when a governance protocol is materially fused to essential operation, or whether such fusion collapses the distinction and thereby cheats by stipulating the determinist conclusion. Keep the prompt self-contained: do not ask for citations, bibliographies, reading lists, or references to specific works by title or date; avoid assuming knowledge of niche theories beyond the two positions named.
