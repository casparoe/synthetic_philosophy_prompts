answer: |-
  In a present-day municipal water-treatment facility, flow regulation depends on a sensor-valve unit whose internal rationing gate is inaccessible to on-site technicians, requiring a proprietary digital key held exclusively by the central utility board for recalibration. Although an open-calibration design exists that performs identically, the facility adopted this unit to comply with an obscure 1970s municipal charter clause mandating centralized oversight, a requirement instantiated as a protocol-embedded physical constraint fused into the device's non-detachable housing rather than displayed on any interface. Consequently, operating the unit without board authorization necessitates physically destroying part of the apparatus, rendering the governance rule materially inseparable from the mechanical function. To the observer, the valve functions hydraulically regardless of hierarchy, yet its physical integrity is contingent upon adherence to bureaucratic authority, creating a situation where the machine's operation is indistinguishable from the enforcement of the charter's centralizing mandate.

  (1) The technological determinist verdict is that the unit inherently enforces hierarchy because the inseparable lock physically prevents local autonomy, embodying the political arrangement in matter; the social constructivist verdict is that the unit is politically neutral because the hierarchy stems entirely from the external charter clause and the organizational choice to install this specific model over the open alternative. (2) The single structural feature forcing this divergence is the fusion of governance protocol and material operation, specifically whether the non-detachable lock counts as political content internal to the artifact or merely a physical manifestation of an external rule. (3) If that feature were removed, such as if the lock were a detachable software module that technicians could override with standard tools, the politics would shift from being embedded in the hardware to being a matter of configuration and policy, weakening the claim that the artifact itself dictates the power structure. (4) The defender of the theory that comes out badly—the social constructivist—attacks the case by arguing that the technological determinist illicitly reifies an organizational choice (buying the locked unit) as material necessity, while the determinist replies that the constructivist denies an obvious feature of the design where physical destruction is the only way to bypass authority. (5) This case is designed to test whether the distinction between "politics in the artifact" and "politics around the artifact" survives when a governance protocol is materially fused to essential operation, or whether such fusion collapses the distinction and thereby cheats by stipulating the determinist conclusion.
