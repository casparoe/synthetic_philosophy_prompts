      *   **Characters:**
          *   *Defender:* Believes supererogation exists. Distinguishes obligation (threshold) from reasons (graded).
          *   *Skeptic:* Believes supererogation is impossible. Argues "if it's praiseworthy, it's right; if it's right, it's obligatory" (a variation of the "ought implies can" or maximizing consequentialist view, often associated with the "Paradox of Supererogation").
      *   **Scenario:** A person giving up a Saturday to volunteer at a food bank (real cost, real benefit, not life-or-death).
      *   **Tone:** Sharp, intellectual, no strawmen. Both sides need strong arguments.
      *   **Specific Arguments:**
          *   Skeptic: The "Impossibility" line (Praiseworthy $\rightarrow$ Right $\rightarrow$ Obligatory).
          *   Defender: Threshold vs. Graded reasons (Obligation is a floor, not the ceiling of reason).

  2.  **Deconstruct the Philosophical Positions:**
      *   **The Skeptic (Maximizing/Consequentialist leanings):** Often associated with J.O. Urmson's critique or strict consequentialism. If an action produces the best outcome (or sufficient good), why isn't it required? If it's *good* to do, failing to do it implies a moral failure. To call it "optional" undermines the value of the act.
      *   **The Defender (Common Sense/Deontological leanings):** Associated with Urmson's defense, David Heyd, or Susan supererogation theorists. Morality has a baseline (duty). Going above the baseline is good but demanding too much (requiring it) makes morality too burdensome (the "Saint's Burden"). The distinction between *what we owe* and *what we give*.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Two friends, maybe after the user's argument, continuing the debate. Let's name them Alex (Skeptic) and Jordan (Defender).
