answer: |-
  **Project Title:** Intervention-Relative Identifiability in Inverse Reinforcement Learning

  **Problem Statement and Core Question**
  Standard Inverse Reinforcement Learning (IRL) operates on the assumption that the reward function inferred from demonstrations is a stable property of the demonstrator, independent of how that reward is subsequently used. My prior work in shared-autonomy assistive robotics exposes a structural flaw in this assumption. When fitting reward models to users with restricted motor repertoires (e.g., a person steering a robotic arm via head array), the inferred reward conflates *preferences* with *capabilities*. A user who consistently leaves a cup near the table edge may do so because they prefer it there, or because reaching further is motorically expensive. If the assistive agent later expands the user's action set (by reaching further itself), a reward function fitted under the assumption of limited capacity may prescribe behavior that violates the user's true intent.

  This proposal argues that identifiability is not a property of data alone, but of the data paired with the *class of interventions* intended for deployment. The core research question is determinate: **Can we construct a taxonomy of intervention classes such that the equivalence classes of indistinguishable rewards become strictly finer as the intervention class expands?**

  I propose a hierarchy of five intervention classes: (1) plain in-distribution prediction; (2) changing environment dynamics without altering agent capabilities; (3) expanding the agent's action set (the assistive tech case); (4) changing the choice set faced by a human (nudges/reranking); and (5) interventions that alter preference formation itself. The conjecture is that classic IRL identifiability results (where many rewards fit one policy) correspond to the empty-intervention case. As the intervention class allows the agent to act counterfactually to the demonstrator's constraints, the set of reward functions consistent with the observed behavior should shrink. The goal is to formally characterize these equivalence classes for each intervention tier.

  **Relation to Existing Literature**
  Current debates in IRL regarding priors, regularizers, and entropy maximization are often proxy fights about deployment context. A maximum entropy prior assumes the demonstrator is noisy but capable; a sparse reward prior assumes specific goal structures. These choices implicitly encode assumptions about what the agent will do with the reward. By making the intervention class explicit, several of these disputes dissolve into empirical questions: if the deployment involves action-set expansion, a regularizer that penalizes distance-based costs may be structurally inappropriate, regardless of fit on training data.

  This work sits at the intersection of engineering, philosophy, and economics, and risks being dismissed by all three without careful framing. To the engineer, this is not merely a heuristic; it requires formal definitions of reward equivalence under varying action spaces. To the philosopher, this is not conceptual musing; the output is a diagnostic tool for system safety. To the economist, this resembles revealed preference theory under capacity constraints. The distinction is critical: standard revealed preference observes choices under fixed budget or capacity constraints to infer utility. Here, the tool being built *removes* the constraint. We are inferring preferences over outcomes the demonstrator physically could not choose. This requires extending revealed preference logic to counterfactual capacity expansions, where the "budget set" is endogenous to the algorithmic intervention.

  **Research Plan and Methodology**
  Over a six-month pilot period, I will pursue a theoretical framework paired with a synthetic empirical stress test. No human subjects or IRB approval are required.

  1.  **Theoretical Formalization (Months 1–2):** Define the intervention classes formally as mappings from state-action spaces to deployment policies. Derive the conditions under which two distinct reward functions produce identical policies under Class 1 interventions but diverge under Class 3 (action-set expansion).
  2.  **Empirical Stress Test (Months 3–5):** I will implement two environments using standard RL libraries.
      *   *Environment A:* A gridworld where a demonstrator is restricted to orthogonal moves, while the deploy-time agent can move diagonally.
      *   *Environment B:* A continuous-control assistive simulation (e.g., a reaching task in a physics engine) where the demonstrator has limited joint velocity/torque, and the agent has full actuation.
      *   *Procedure:* I will generate synthetic demonstrations from a known reward function using the limited agent. I will then fit multiple reward models (using standard IRL baselines) to these demonstrations. Finally, I will deploy these fitted rewards on the *expanded* agent.
      *   *Metric:* The primary metric is the divergence in behavior among the fitted reward models when deployed on the expanded agent. If the taxonomy holds, models that were indistinguishable on the limited agent should disagree significantly on the expanded agent, quantifying the "hidden" ambiguity.
  3.  **Synthesis (Month 6):** Consolidate theoretical bounds and empirical results into a practitioner framework.

  **Deliverables**
  The primary deliverable for the community is not only the theoretical framework but a **one-page Practitioner Checklist**. This document will allow engineers to identify their deployment intervention class and immediately see: (1) what ambiguities remain in their inferred reward given their current data; and (2) what specific data would shrink that ambiguity (e.g., "collect more trajectories from the same user" vs. "collect few-shot data under a temporarily changed interface"). This moves the field from arguing about priors to arguing about data collection strategies aligned with deployment goals.

  **Risk and Failure Modes**
  There are two primary ways this project could fail to yield novel insights. First, the equivalence-class hierarchy could collapse; it is possible that capacity changes do not meaningfully distinguish between reward functions any better than standard trajectory data, rendering the taxonomy theoretically sound but practically empty. I will know this if the empirical divergence metric in Environment B remains near zero across all intervention classes. Second, the taxonomy may prove to be a trivial relabeling of existing identifiability literature. I will mitigate this by continuously cross-referencing against established identifiability bounds during Months 1–2; if the results map one-to-one with existing theorems without adding the intervention dimension, the scope will shift to proving why the intervention lens offers computational advantages in data collection.

  **Scope and Timeline**
  This proposal is scoped for a six-month pilot fellowship at 60% effort. This is sufficient to derive the equivalence class characterizations for the first three intervention tiers and complete the synthetic stress tests. It is not sufficient for proving generalization to high-dimensional human preference learning or for collecting real-world assistive robotics data. The goal is to establish the theoretical validity and empirical plausibility of intervention-relative identifiability, providing the foundation for a full dissertation chapter or journal publication upon completion.
