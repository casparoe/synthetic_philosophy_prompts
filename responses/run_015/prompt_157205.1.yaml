answer: |-
  Here is the defended agenda for allocating ten researcher-years to moral trade, prioritized by load-bearing status, tractability for formalists, and alignment with your specific framing (intrapersonal coherence and unverifiable AI counterparties).

  ### Criteria for Allocation
  I am weighting **Load-Bearing** highest. If the answer to a question is "no," does the moral trade agenda collapse from a "big lever" to a "cute idea"? Second is **Tractability**. You have decision theorists and economists, not anthropologists; questions requiring empirical value data are out. Third is **Upstream Dependency**. Does answering this clarify the variables needed for the other questions?

  ### Ranked Research Questions

  **1. Can cooperative equilibria be sustained between humans and AI when actions are opaque and enforcement is limited to shutdown?**
  *   **Rank:** 1 (Highest Priority)
  *   **Defense:** This is the ultimate bottleneck. You specified the AI case as the agenda's target. If we cannot model a mechanism where an AI cooperates on moral trades without being audited, the potential scale of moral trade drops from "civilization-level" to "human-charity-level." This is a game-theoretic mechanism design problem (repeated games with hidden action, where the "punishment" is existential termination). It is perfectly suited for your team's skills (decision theory/econ).
  *   **Upstream/Downstream:** Upstream for the AI case. You cannot calculate gains from trade if the trade cannot be enforced.
  *   **Tractability:** High. This is formal modeling. Researchers can define utility functions, information asymmetries, and threat credibility without needing to measure real-world values.
  *   **Defund Condition:** If preliminary modeling shows that shutdown threats are inherently non-credible (e.g., the AI can hide capabilities such that shutdown is impossible before defection), this entire line of inquiry should be paused.

  **2. Does intrapersonal moral uncertainty prescribe bargaining solutions distinct from expected value maximization?**
  *   **Rank:** 2
  *   **Defense:** You asked if the intrapersonal case collapses. This is foundational for defining the *human agent* in the AI trade. If intrapersonal uncertainty is just linear expected value (EV) maximization across theories, then the human enters the AI negotiation with a linear utility function. If it is a bargaining solution (e.g., Nash Bargaining between "parts"), the human utility function is non-linear and risk-averse over moral theories. This changes the shape of the trade surface with the AI.
  *   **Upstream/Downstream:** Upstream for *all* moral trade modeling. It defines the objective function of the human party.
  *   **Tractability:** Very High. This is pure decision theory/philosophy of probability. It requires no empirical data, only consistency arguments and axiomatic analysis.
  *   **Defund Condition:** If researchers demonstrate a strong dominance argument that EV maximization strictly dominates bargaining approaches for intrapersonal uncertainty (or vice versa) within the first 6 months, reduce allocation to refinement only.

  **3. Under what structural conditions must value divergence imply positive-sum opportunities?**
  *   **Rank:** 3
  *   **Defense:** This addresses the "scale" question without requiring empirical value measurement. Instead of asking "how much do values diverge?" (empirical), ask "given divergence, when does trade *mathematically* exist?" This identifies the necessary conditions for the lever to exist at all (e.g., do preferences need to be orthogonal, or just non-identical?).
  *   **Upstream/Downstream:** Downstream of Q1 and Q2. You need to know who is trading (Q2) and if they can enforce (Q1) before calculating the surplus.
  *   **Tractability:** Medium. Requires general equilibrium modeling but risks becoming abstract without value constraints.
  *   **Defund Condition:** If the models show that positive-sum conditions are so rare (e.g., require perfect anti-correlation) that they are unlikely to occur in high-dimensional value spaces, defund.

  ### What to Defund

  **1. Empirical Mapping of Value Divergence.**
  *   **Reason:** You explicitly stated no ability to run empirical work on what real agents value. Attempting to estimate the "size of the pie" via surveys or historical analysis is untractable for this team and high-noise. Assume divergence exists; focus on the *mechanism* to capture it.

  **2. Metaethical Realism vs. Anti-Realism.**
  *   **Reason:** Not load-bearing. Moral trade works as a coordination mechanism regardless of whether moral facts are mind-independent. Debating the ontology of value consumes person-years without changing the game-theoretic prescriptions for the AI or intrapersonal cases.

  **3. Detailed Bargaining Axioms (e.g., Kalai-Smorodinsky vs. Nash).**
  *   **Reason:** Too downstream. While interesting, selecting the specific bargaining solution is secondary to establishing *that* a bargaining solution applies (Q2) and *that* it can be enforced (Q1). Don't optimize the engine before confirming the car has wheels.

  ### Evidence Triggers for Reprioritization

  *   **Move Q1 Down / Defund:** Proof that "shutdown" is not a credible threat against a superintelligent system (e.g., formal proofs that capability concealment makes enforcement impossible). If enforcement is impossible, the AI case is dead, and the agenda reverts to human-only trade (drastically reducing the "lever" size).
  *   **Move Q2 Up:** If formal analysis reveals that intrapersonal bargaining yields significantly higher robustness to model error than EV maximization. This would make the intrapersonal case not just foundational, but a superior decision-making algorithm in its own right, warranting more than 20% of the budget.
  *   **Move Q3 Up:** If Q1 and Q2 are resolved positively, but the theoretical "gains from trade" in high-dimensional spaces vanish (i.e., divergence doesn't actually create slack). This would indicate the lever is theoretically broken, requiring a pivot to "value alignment" instead of "value trade."

  ### Summary of Trade-offs
  I am prioritizing **Enforcement (Q1)** over **Foundations (Q2)** because a perfect theory of intrapersonal trade is useless if the interpersonally critical case (AI) is enforcement-constrained. However, I am keeping **Foundations (Q2)** as a close second because it is the most tractable win; it can be settled quickly to clarify the objective function for Q1. I am defunding empirical value questions because they are untractable for this team and distract from the mechanism design focus required for the AI case.

  \answer{Credible cooperation under opaque enforcement}
