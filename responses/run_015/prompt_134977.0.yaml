answer: |-
  **Essay Question**

  In *The Querist*, George Berkeley argues that money is merely a sign or counter with no intrinsic value, yet simultaneously claims that a state-managed paper currency can actively generate prosperity in ways metallic coin cannot. Explain how Berkeley separates the ontological status of the monetary sign from its causal efficacy in economic life. Why is this separation distinct from the modern distinction between fiat and commodity money? Contrast Berkeley's account with a commodity-theory position where value is anchored in the labor embodied in the material substrate. Specifically, identify where collective belief and social convention perform the sustaining work that intrinsic material worth performs for the commodity theorist. (45 minutes)

  ***

  **Model Answer**

  Berkeley's philosophy of money resolves the tension between monetary insubstantiality and economic efficacy by rigorously distinguishing the sign from the thing signified. Ontologically, Berkeley insists money is not wealth itself but a "ticket" or counter used to convey claims upon wealth. It possesses no intrinsic value, whether made of paper or silver. However, this ontological emptiness does not negate causal efficacy. For Berkeley, the power of money lies not in its substance but in its function as a tool to stimulate industry. A paper currency, though materially worthless, is causally potent because it circulates faster and more flexibly than scarce metal, thereby activating dormant labor and land.

  This separation differs fundamentally from the modern fiat versus commodity distinction. Modern fiat theory often relies on state decree or legal tender laws to explain value despite lack of backing. Berkeley's account is not merely legalistic but functionalist; the currency is valid not because the state says so, but because it successfully represents the nation's productive potential. The efficacy depends on the currency's ability to mobilize industry, not solely on sovereign command.

  To understand the sustaining mechanism of this sign, one must contrast Berkeley with a commodity-theory position. A commodity theorist argues that value must be anchored in the labor embodied in the material substrate (e.g., the mining and minting of silver). The metal itself holds value because it crystallizes past labor. For Berkeley, this is a category error. The material substrate of money is irrelevant; the true value-substrate is the present and future labor of the populace backed by land. Consequently, collective belief and social convention perform the sustaining work that intrinsic material worth performs for the commodity theorist.

  In the commodity view, the metal guarantees acceptance; in Berkeley's view, public credit guarantees acceptance. This credit is not a subjective psychological embellishment but an objective social condition. When the public trusts that the paper ticket can be exchanged for goods produced by national industry, the sign functions perfectly. The convention of acceptance replaces the necessity of metallic content. Thus, money works causally not because it *is* value, but because it is *taken* as value within a system of circulation designed to encourage production.

  Berkeley thus achieves a separation where ontology remains nominal (money is a sign) while causality remains real (money moves industry). The paper currency is superior to coin not because it holds value better, but because it is a more efficient sign for mobilizing the true source of wealth: human labor. The commodity theorist binds money to dead metal; Berkeley binds money to living industry through the convention of credit. This allows paper to function without intrinsic worth, provided the social convention of trust remains intact to sustain the sign's circulation.

  ***

  **Marking Scheme (Total 20 Marks)**

  **Grading Bands**

  *   **A Range (17–20 marks):** The response explicitly recognizes all three required conceptual moves: (1) the strict sign/thing-signified distinction applied to currency; (2) the claim that credit and collective trust are sustaining causal conditions, not psychological embellishments; and (3) the argument that labor, not metal, is the true value-substrate. The contrast with commodity theory is precise, and the distinction from modern fiat theory is clear.
  *   **B Range (13–16 marks):** The response identifies the sign/thing distinction but blurs the role of trust (treating it as merely psychological) or fails to clearly articulate labor as the value-substrate. The distinction from modern fiat theory may be vague or partially conflated.
  *   **C Range (10–12 marks):** The response summarizes Berkeley's view on paper money but fails to resolve the tension between ontology and efficacy. The contrast with commodity theory is superficial.
  *   **Fail Range (0–9 marks):** The response misrepresents Berkeley's position or fails to address the prompt's core requirements.

  **Specific Deductions (Apply to calculated band score)**

  *   **Identifiable Misconception (–3 marks):** Deduct 3 marks if the student claims that Berkeley's immaterialism about money entails a denial of real economic exchange (i.e., arguing that because money is a sign, trade is illusory).
  *   **Modern Fiat Conflation (–2 marks):** Deduct 2 marks if the student collapses Berkeley's view into contemporary fiat-currency theory (e.g., arguing value derives solely from state decree rather than productive potential/credit).
  *   **Subjective-Value Conflation (–2 marks):** Deduct 2 marks if the student conflates Berkeley's social-convention account with a subjective-value theory (e.g., arguing value depends on individual whim rather than public credit/convention).

  **Note:** Deductions cannot reduce the score below 0. Conceptual precision is the sole criterion; no marks are awarded for bibliography or citations.
