answer: |-
  **MEMORANDUM**

  **TO:** Naming and Memorials Committee, Rivermont Unified School District
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Whitfield Middle School

  **Recommendation**
  The Committee should recommend to the Board that the district remove the name "Whitfield" from Whitfield Middle School by the start of the next school year. We should authorize a search for a new name immediately. Upon renaming, the "Whitfield Minutemen" mascot, the granite "W" monogram, and the bronze lobby relief of Josiah Whitfield must be removed. We should reject the Superintendent's proposal to rededicate the school to Elias Whitfield while retaining the surname. Regarding the budget, the Committee must prioritize the $190,000 rebranding cost required for removal over the proposed historical exhibit for this fiscal year. The exhibit should be pursued in future budget cycles.

  **Policy Application**
  Our policy permits removal when an honoree's "principal legacy" is "fundamentally at odds with the district's mission." "Principal legacy" does not mean a mathematical tally of good deeds versus bad deeds. It refers to the defining moral character of the person's public life in relation to our values. Josiah Whitfield's public health contributions were significant, but his leadership in the violent ethnic cleansing of Chinese American residents is fundamentally incompatible with a public school mission grounded in inclusion and safety. A legacy that includes destroying a community cannot be balanced by saving lives elsewhere; the exclusionary act disqualifies the honor in an educational setting.

  **Committee Positions**
  We must resolve three divergent views within our deliberations:

  1.  **Present Standards:** One member argues that every use of the name today is a fresh act of honoring, so 1959 standards do not apply. **I adopt this position.** A school name is not a historical plaque; it is an active endorsement. By printing the name on diplomas and uniforms today, the district communicates who it values now. We cannot outsource moral responsibility to the past.
  2.  **Container of Memory:** Another argues the name is now merely a container for community memories and not ours to change. **I reject this.** While alumni memories are real, they cannot supersede the daily experience of current students. A name that signals exclusion to 38 percent of the student body is not a neutral container; it is an active barrier. The district does not hold the name in trust for the past; it holds the school in trust for the present.
  3.  **Repair vs. Removal:** A third argues removal is optional if the injury can be stopped via repair (e.g., an exhibit). **I reject this.** While repair is necessary, it is not sufficient. Keeping the name continues the specific honor paid to Josiah Whitfield. An exhibit explains the harm, but the name perpetuates the status of the harmer. Removal is required to stop the honor; repair is required to heal the harm. We must do both, but removal is the prerequisite.

  **Complications**
  Three specific complications require disposition. First, the Superintendent's proposal to rededicate the school to Elias Whitfield while keeping the surname is well-intentioned but flawed. Elias Whitfield was a Black educator whose grandparents were enslaved by Josiah Whitfield's family. Retaining the enslaver's surname, even to honor an enslaved descendant, keeps the marker of oppression central. We should honor Elias by naming a building after him directly, not by recycling the oppressor's name.

  Second, the district poll shows 62 percent of respondents cannot identify Josiah Whitfield. This carries little weight. Harm does not require knowledge of the source to be felt. Asian American students need not know the history of 1886 to feel the alienation of a name associated with ethnic expulsion. Ignorance of the history does not negate the reality of the exclusion.

  Third, the budget allows for either rebranding ($190,000) or the historical exhibit ($150,000) this year, not both. If we recommend removal, rebranding is mandatory to ensure consistency across signage and transcripts. We must allocate funds to rebranding now and commit to funding the curriculum module and exhibit in the next fiscal year. The physical removal of the honor takes precedence over the educational context this year.

  **Litigation**
  The threat of litigation regarding the land trust's reversionary clause (a legal provision that returns property to the donor if conditions are met) should not change this recommendation. Policy decisions based on moral alignment with the district mission cannot be held hostage by potential legal costs. If suit is filed, the Board should defend the decision vigorously. Counsel advises the clause is likely unenforceable because public policy favors nondiscrimination over private donor restrictions. We should proceed with removal and let the courts decide the liability, rather than letting the threat of cost dictate our values.

  **Strongest Consideration on the Losing Side**
  The strongest argument for retaining the name is not about defending Josiah Whitfield, but about preserving institutional stability and respecting the alumni who identify with the school as it exists today. For many graduates, "Whitfield" represents their own coming of age, not the 19th century. Changing the name severs a tangible link to their past and imposes significant financial costs that could otherwise support students directly. There is genuine merit to the view that schools should be stable anchors in a community, and that constant re-evaluation of history can create a sense of impermanence that undermines community cohesion. This concern for stability and fiscal prudence is valid, even if it is outweighed by the need for inclusion.

  **Conclusion**
  We should vote to recommend removal. The cost of rebranding is high, but the cost of exclusion is higher. We will propose a new name by March, finalize the budget for rebranding by May, and ensure the school opens under a new identity in August.
