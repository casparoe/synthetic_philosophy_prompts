  **(b) 6/8**
  *   **Comment (Contextualism):** 4/4. Correct application. Since Ben is the attributor and his context is low-stakes, his claim is true. You also correctly note Amara's own context is low-stakes.
  *   **Comment (Pragmatic Encroachment):** 2/4. You start correctly ("she doesn't know... Ben's claim... false"), but then contradict yourself in the second half. Standard Pragmatic Encroachment (e.g., Stanley/Hawthorne) relies on **objective** stakes, not the subject's *perception* of stakes. If the check bounces and she loses the apartment, the stakes are high regardless of her false belief about her parents. Therefore, she does *not* know. You penalized yourself by arguing PE should go by "stakes as she sees them."

  **(c) 2/6**
  *   **Comment:** You correctly identify **Contextualism** as the view allowing truth-value variation, and you correctly explain why PE avoids this (invariant content). However, your explanation of *why* Contextualism allows this is incorrect. You wrote: *"The standards... track how much is at stake for the person the knowledge is being attributed to — Amara's practical situation."* **This is the definition of Pragmatic Encroachment.** Attributor Contextualism says standards track the **speaker's** (Ben's) context, not the subject's (Amara's) situation. You seem to have conflated the two views in this section. Be careful to keep "Attributor Context" (Contextualism) and "Subject Stakes" (PE) distinct.

  ***

  **TA Note on Distribution:**
  I stuck to the instructor's rubric weights (6/8/6). I was tempted to penalize Part (c) more heavily because conflating the core mechanism of Contextualism with PE is a significant conceptual error for an upper-division course, but I gave partial credit for correctly identifying the label and correctly explaining the PE side of the contrast. Part (b) lost points primarily on the "unaware stakes" nuance in the PE section, as that was the specific philosophical hinge of the scenario.
