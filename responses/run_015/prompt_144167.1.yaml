prompt: |-
  I have recently taken charge of a four-person signal-assessment team at a national plant-health agency. Every Monday we publish a single probability, for each of about a dozen notifiable pests, that it is already established somewhere in our region; the deputy director signs the sheet off and it goes to people who decide whether to impose movement restrictions. The inputs are a mixture of hard findings and soft ones — a member of the public's photograph, a grower's suspicion, a partial sequencing run, a press report from a neighbouring country — and until now we have folded them in by discussion and instinct. Last month an external reviewer asked why our figure for one pest moved from 0.15 to 0.6 in a single week on the strength of one photograph, and the best I could offer was that it had felt right. I have since been told that what we are doing has a name and a rule attached to it — Jeffrey's rule for updating on evidence you are not certain of — and that the rule only applies when the shift is what they call rigid. I want a procedure we can actually run, not a tutorial.

  Constraints: spreadsheet only, about half an hour per case, no probability training assumed beyond a week's internal course, and every step written down in a form an external reviewer can follow. What I need:

  - Start from the partition, not the hypothesis: how to decide what the signal is directly about, at what grain, and how to spread the probability that is left over, since I gather the answer depends on this.
  - A check on whether an expert's number is usable as the shift at all — I suspect that when our pathologist says she is seventy per cent sure the photograph shows the pest, she has already folded in what she knew about the region, and that using her number as the shift counts that twice.
  - A test for rigidity, and a specified alternative when it fails: what to do instead when the same item that moves our confidence about, say, a laboratory sample also tells us something about how much that sample was ever going to tell us.
  - What to do when nobody can do better than "somewhat more likely" or "somewhere between sixty and eighty per cent", and what to publish as the single headline number when the honest output is a band.
  - Where the procedure stops and hands the decision to our senior epidemiologist, and an honest marking of which steps are real constraints from the theory and which are judgment calls dressed up as steps.

  Please run it on three cases from the last fortnight: (1) the photograph, with the pathologist's seventy per cent; (2) a partial sequencing run from the regional laboratory — the kind of evidence our unit's budget is justified by — commissioned because a grower nearby had already reported symptoms, and produced in the same week the laboratory changed to a more sensitive kit; (3) three soft items arriving together: a machine-translated press report from a neighbouring country, a trap specimen degraded in transit and identified only to genus, and nothing at all found in two hundred traps elsewhere. Give me the unwelcome answer on the second if that is what the procedure gives, and close by saying what the procedure cannot do. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Leader of a 4-person signal-assessment team at a national plant-health agency.
      *   **Task:** Publish weekly probabilities of establishment for ~12 notifiable pests.
      *   **Problem:** Current method is intuitive ("felt right"). External reviewer challenged a jump (0.15 to 0.6) based on a single photograph.
      *   **Constraint:** Spreadsheet only, ~30 mins per case, minimal probability training (1-week course), auditable steps.
      *   **Specific Needs:**
          1.  Start from the partition (what is the signal *about*?), not the hypothesis.
          2.  Check for "double counting" (expert opinion already conditioned on priors).
          3.  Test for rigidity (Jeffrey's rule condition) and alternative if it fails.
          4.  Handle imprecise inputs ("somewhat more likely") and output (single number vs. band).
          5.  Define hand-off points to senior epidemiologist and distinguish theory constraints from judgment calls.
      *   **Cases to Run:**
          1.  Photograph (Pathologist 70% sure).
          2.  Partial sequencing (Sensitive kit change + grower report).
          3.  Three soft items (Press report, degraded trap, 200 negative traps).
      *   **Tone/Style:** British English, practical/procedural (not a tutorial), honest about limitations ("unwelcome answer," "what the procedure cannot do").

  2.  **Deconstruct the Theory (Jeffrey's Rule & Rigidity):**

      *   *Bayes' Rule:* Updates on certain evidence ($P(E)=1$).
      *   *Jeffrey's Rule (Probability Kinematics):* Updates on uncertain evidence ($P_{new}(E) = p^*$). Formula: $P_{new}(H) = P(H|E)p^* + P(H|\neg E)(1-p^*)$.
      *   *Rigidity Condition:* The likelihood ratios $P(H|E)/P(H|\neg E)$ must remain constant during the update. In simpler terms, the evidence $E$ must not change your belief about the *reliability* of the evidence itself or the causal link between $H$ and $E$ in a way that depends on $H$.
      *   *The "Double Counting" Issue:* If an expert says "70% sure this is the pest," is that $P(E|H)$ (likelihood) or $P(H|E)$ (posterior)? Usually, experts give $P(H|E)$ implicitly based on their own priors. Using this directly as $p^*$ in Jeffrey's rule can be problematic if their prior differs from the agency's prior.
      *   *The Partition:* Jeffrey's rule requires a partition of the evidence space (e.g., {Photo is Pest, Photo is Not Pest}). The update is on *this* partition, not directly on the Hypothesis {Established, Not Established}.

  3.  **Develop the Procedure (The "Spreadsheet Protocol"):**

      *   *Goal:* Make it actionable for non-statisticians.
      *   *Step 1: Define the Partition.* What exactly are we updating? Not "Is it established?" but "Is this signal valid?"
      *   *Step 2: Calibrate the Input.* Avoid double counting. Convert expert confidence into a likelihood ratio or a "shift value" that is independent of the prior.
      *   *Step 3: Rigidity Check.* Does this evidence change how we view *other* evidence? (e.g., Lab kit change).
      *   *Step 4: Calculation.* Apply Jeffrey's formula.
      *   *Step 5: Imprecision.* Handle ranges.
      *   *Step 6: Hand-off.* When to escalate.

  4.  **Drafting the Steps (incorporating constraints):**

      *   *Constraint Check:* Spreadsheet friendly. 30 mins.
      *   *Language:* British English (e.g., "programme," "centre," "analyse").
      *   *Structure:*
          1.  The Protocol (The Rules).
          2.  The Three Cases (Application).
          3.  Limitations (What it can't do).

  5.  **Refining the Specific Technical Points:**

      *   *Partition:* Instead of $H$ (Established), define $S$ (Signal is genuine).
      *   *Double Counting:* If the pathologist says "70% sure," she means $P(\text{Pest}|\text{Photo})$. But we need $P(\text{Photo is Pest}|\text{Photo exists})$. Actually, for Jeffrey's rule, we need the new probability of the *evidence proposition*. Let $E$ = "Photo depicts Pest". The expert gives $P_{new}(E) = 0.7$. *Crucial:* Does she include base rates? If she says "It looks like the pest," she usually implies likelihood. If she says "I'm 70% sure this *is* the pest," she might mean posterior. We need to strip the prior. *Correction:* In Jeffrey's rule, $p^*$ is the new probability of the evidence proposition $E$. If the expert says "70% sure this photo shows the pest," that is $P_{new}(E)$. The risk is if her 70% includes her own prior belief about prevalence. We need to ask: "Ignoring where it was found, just looking at the image, how sure are you?"
      *   *Rigidity:* If the lab changes kits, the meaning of a "positive" changes. This violates rigidity because the likelihood $P(\text{Positive}|H)$ has changed. We cannot simply update; we must re-baseline.
      *   *Imprecision:* Use mid-points for the spreadsheet but record the range in a "confidence column" for the reviewer.
      *   *Hand-off:* If Rigidity fails, or if the range is too wide (e.g., 0.2 to 0.8), escalate.

  6.  **Developing the Three Cases:**

      *   *Case 1 (Photo):* Straightforward Jeffrey's. Partition: {Photo is Pest, Photo is Mimic}. Input: 0.7. Check: Did pathologist use prior prevalence? Assume yes. Need to adjust.
      *   *Case 2 (Sequencing + Kit Change):* This is the trap. The kit change alters the reliability of the test. Rigidity fails. The "unwelcome answer" is that you cannot update the old probability; you must reset or treat the test characteristics as new variables. The probability might not move as much as hoped because the false positive rate might be higher with the sensitive kit.
      *   *Case 3 (Mixed Soft/Null):* Press report (weak), Degraded trap (weak), 200 Negatives (stronger). Combining these requires independence assumptions. Rigidity might hold for the negatives, but the press report is noisy.

  7.  **Addressing the "Double Counting" specifically:**
      *   If the pathologist says "70% sure," and she knows the pest is rare, her 70% is a posterior. Jeffrey's rule needs the *likelihood* or the *evidence probability* independent of the hypothesis prior.
      *   *Fix:* Ask for the "False Positive Rate" and "True Positive Rate" of the expert's eye. Or, simpler for a spreadsheet: Treat the expert's confidence as the $P_{new}(E)$, but acknowledge the prior contamination.
      *   *Better Fix for Protocol:* Define $E$ as "The signal is a true positive." The expert provides $P(E)$. If they admit they factored in rarity, we must ask them to re-estimate based *only* on the signal features.

  8.  **Addressing the "Rigidity" Test:**
      *   Rigidity means $P_{old}(H|E) = P_{new}(H|E)$.
      *   Test: Does learning $E$ change your mind about how reliable $E$ is?
      *   Case 2 (Kit Change): Learning the test is positive *also* tells us the test is more sensitive. This changes $P(H|E)$. Rigidity fails.

  9.  **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone:* Professional, direct, slightly bureaucratic but honest.
      *   *Formatting:* Clear headings, bullet points, spreadsheet-style logic.
      *   *British English:* Check spelling (analyse, programme, centre, modelling).
      *   *Constraint:* "No probability training beyond a week's course." Keep formulas simple. $P_{new} = P(H|E) \times p^* + P(H|\text{not }E) \times (1-p^*)$.

  10. **Final Review against User Prompt:**
      *   Start from partition? Yes.
      *   Check expert number usability? Yes (The "Prior Contamination Check").
      *   Test for rigidity? Yes (The "Independence of Reliability" test).
      *   Imprecise inputs? Yes (Mid-point + Range flag).
      *   Hand-off points? Yes.
      *   Three cases run? Yes.
      *   Unwelcome answer on Case 2? Yes.
      *   What procedure cannot do? Yes.

  11. **Self-Correction on Case 2:** The prompt asks for the "unwelcome answer." The unwelcome answer is that because the kit changed, the historical likelihoods are invalid. You cannot simply update the 0.15. You effectively have to treat the system as having a new baseline, or acknowledge the probability is indeterminate until the new kit is calibrated against known positives/negatives. I will frame this as a "Rigidity Failure" requiring Senior Epidemiologist intervention.

  12. **Self-Correction on Case 1:** The pathologist's 70%. If she says "70% sure this is the pest," she is giving $P(H|E)$. Jeffrey's rule requires $P_{new}(E)$ (probability the evidence is valid). This is a subtle but critical distinction. I need to make sure the procedure distinguishes "Probability the photo shows the pest" vs "Probability the pest is established given the photo." The prompt says "she is seventy per cent sure the photograph shows the pest." That is $P(E)$. However, the "double counting" worry is that her assessment of the photo might be influenced by how likely she thinks the pest is *already*. I will include a step to isolate the visual assessment from the contextual assessment.

  13. **Final Polish:** Ensure the distinction between "Theory Constraints" (math) and "Judgment Calls" (operational) is clear.

  *(Self-Correction during drafting)*: Wait, Jeffrey's Rule updates $P(H)$ based on a shift in $P(E)$.
  Formula: $P_{new}(H) = P(H|E) \cdot P_{new}(E) + P(H|\neg E) \cdot P_{new}(\neg E)$.
  Inputs needed:
  1. $P_{old}(H)$ (Current probability of establishment).
  2. $P(H|E)$ (Probability of establishment if signal is real).
  3. $P(H|\neg E)$ (Probability of establishment if signal is false).
  4. $P_{new}(E)$ (New confidence the signal is real).

  The "Double Counting" risk: If the expert gives $P_{new}(E)$ but derived it using their own $P_{old}(H)$, and our $P_{old}(H)$ is different, we have a conflict.
  The "Rigidity" risk: If $P(H|E)$ changes because of the evidence itself (e.g., learning the test kit changed).

  Okay, ready to write.
answer: |-
  # Standard Operating Procedure: Signal Assessment & Probability Updating
  **Version:** 1.0 (Draft for Review)  
  **Authority:** Signal-Assessment Team Lead  
  **Constraint:** Spreadsheet implementation only; max 30 minutes per case.

  ## Part 1: The Protocol

  This procedure replaces intuitive discussion with a structured audit trail. It uses Jeffrey's Rule for uncertain evidence. It is not a tutorial on probability; it is a form-filling exercise with specific decision gates.

  ### Step 1: Define the Partition (The "What")
  Do not start with the hypothesis ("Is the pest established?"). Start with the signal. You must define the **Evidence Partition** in Row 1 of your spreadsheet.
  *   **Cell A1:** Describe the signal event $E$ (e.g., "Photograph depicts *Pest X*").
  *   **Cell B1:** Describe the negation $\neg E$ (e.g., "Photograph depicts a mimic or damage").
  *   **Cell C1:** The Hypothesis $H$ (e.g., "*Pest X* is established in the region").

  **Theory Constraint:** You cannot update $H$ directly. You must update your confidence in $E$, which then flows to $H$.
  **Judgment Call:** The "grain" of $E$. If the signal is a press report, $E$ is not "Pest is there," it is "Report is accurate."

  ### Step 2: The Prior Contamination Check (The "Double Counting" Test)
  You will receive a confidence figure from an expert (e.g., "70% sure"). You must verify if this figure is usable as $P_{new}(E)$.
  *   **Question to Expert:** "If this pest were known to be impossible in this region (0% prevalence), would your confidence in this specific signal change?"
  *   **If YES:** The expert has folded the prior into the likelihood. Their number is **unusable** as a direct shift. You must ask them to re-evaluate the signal *in isolation* (e.g., "Ignoring location, does the image match the morphology?").
  *   **If NO:** Their number is usable as $P_{new}(E)$. Enter this in **Cell D1**.
  *   **Judgment Call:** If the expert cannot separate the two, default to $P_{new}(E) = 0.5$ and flag for Senior Review.

  ### Step 3: The Rigidity Test
  Jeffrey's Rule requires "rigidity": the relationship between the signal and the hypothesis must not change *because* of the signal.
  *   **Test:** Does accepting this signal change your estimate of how reliable this *type* of signal is?
  *   **Indicator:** Has the detection method changed (e.g., new lab kit)? Is the source's reliability dependent on the outcome (e.g., a grower reporting symptoms they hope are something else)?
  *   **Pass:** Proceed to Step 4.
  *   **Fail:** **STOP.** Do not calculate. Mark "Rigidity Failure" and hand to Senior Epidemiologist (see Step 6).

  ### Step 4: The Calculation (Spreadsheet Logic)
  Enter the following historical baselines (derived from last week's sheet or agency standards):
  *   **Cell E1:** $P_{old}(H)$ (Last week's published probability).
  *   **Cell F1:** $P(H|E)$ (Probability of establishment if signal is genuine. Usually high, e.g., 0.9, unless the signal could be an isolated interception).
  *   **Cell G1:** $P(H|\neg E)$ (Probability of establishment if signal is false. Usually equals $P_{old}(H)$ unless the false signal implies surveillance gaps).

  **Formula for Cell H1 (New Probability):**
  `=(F1 * D1) + (G1 * (1 - D1))`

  ### Step 5: Handling Imprecision
  If inputs are ranges (e.g., "60–80%"):
  *   **Cell D1:** Enter the midpoint (0.7).
  *   **Cell I1:** Enter the range width (0.2).
  *   **Rule:** If the range width in I1 exceeds 0.4, or if the calculated H1 falls within the range of E1, mark "Statistically Indistinguishable." Publish E1 (the old number) with a note, rather than a false precision.

  ### Step 6: The Hand-Off
  The procedure stops and transfers authority to the Senior Epidemiologist if:
  1.  **Rigidity Fails** (Step 3).
  2.  **Prior Contamination** cannot be resolved (Step 2).
  3.  **Output Range** is too wide (Step 5).
  4.  **Shift Magnitude:** The new probability shifts by more than 0.25 in a single week without a hard positive (e.g., confirmed trap).

  ---

  ## Part 2: Application to Recent Cases

  Here is the procedure applied to the three cases from the last fortnight.

  ### Case 1: The Photograph (Pathologist 70%)
  *   **Partition:** $E$ = "Photo shows pest morphology"; $\neg E$ = "Photo shows mimic".
  *   **Contamination Check:** Asked pathologist: "If you knew this region was pest-free, would you still say 70%?"
      *   *Response:* "No, I'd drop to 50%. I factored in the recent news from the neighbour."
      *   *Action:* Contamination detected. Pathologist re-evaluated image in isolation. New $P_{new}(E)$ = 0.55.
  *   **Rigidity Test:** Does the photo change the reliability of photos? No. **Pass.**
  *   **Inputs:**
      *   $P_{old}(H)$ = 0.15
      *   $P(H|E)$ = 0.90 (If photo is real, establishment is highly likely).
      *   $P(H|\neg E)$ = 0.15 (If photo is fake, status quo remains).
      *   $P_{new}(E)$ = 0.55.
  *   **Calculation:** $(0.90 \times 0.55) + (0.15 \times 0.45) = 0.495 + 0.0675 = 0.56$.
  *   **Result:** **0.56**.
  *   **Reviewer Note:** The jump from 0.15 to 0.6 was theoretically justified, but the input had to be corrected for prior contamination. The pathologist's initial 0.7 was invalid.

  ### Case 2: Partial Sequencing (New Kit + Grower Report)
  *   **Partition:** $E$ = "Sequence match is valid"; $\neg E$ = "Sequence match is error".
  *   **Rigidity Test:** The laboratory changed to a more sensitive kit in the same week.
      *   *Analysis:* A positive result now means something different than it did last month. The likelihood $P(E|H)$ has shifted *simultaneously* with the evidence arrival. Learning the result is positive also teaches us the test is more sensitive.
      *   *Outcome:* **Rigidity Failure.**
  *   **Result:** **No Calculation Performed.**
  *   **Action:** Handed to Senior Epidemiologist.
  *   **Unwelcome Answer:** We cannot publish an updated probability this week. The baseline reliability of our primary diagnostic tool has shifted. To use Jeffrey's Rule here would be mathematically invalid because the "rules of the game" changed mid-turn. We must either recalibrate the kit's false-positive rate against known negatives before updating, or suspend the probability for this pest until the new kit is characterised. The budget justification for this lab work does not override the statistical constraint.

  ### Case 3: Three Soft Items (Press Report, Degraded Trap, 200 Negatives)
  *   **Partition:** This is a composite signal. We treat the *collection* as $E$.
      *   $E$ = "At least one soft signal is valid".
  *   **Inputs:**
      *   Press Report: $P(E_1)$ = 0.3 (Machine translation uncertainty).
      *   Degraded Trap: $P(E_2)$ = 0.4 (Genus level only).
      *   200 Negatives: This is $\neg E_3$. Strong evidence of absence.
  *   **Rigidity Test:** **Pass.** Trap sensitivity hasn't changed.
  *   **Imprecision:** Inputs are vague ("somewhat likely").
      *   We treat the 200 negatives as the dominant factor. In surveillance, 200 negatives usually drive $P(H|\neg E)$ down significantly.
      *   However, the degraded trap and press report suggest $P(E)$ is not zero.
  *   **Calculation:**
      *   $P_{old}(H)$ = 0.10.
      *   $P(H|\text{Negatives})$ = 0.05 (Surveillance reduces risk).
      *   $P(H|\text{Positives})$ = 0.80.
      *   Weighted $P_{new}(E)$ (combining soft positives vs hard negatives) = 0.20 (Judgment call: negatives outweigh soft positives).
      *   Formula: $(0.80 \times 0.20) + (0.05 \times 0.80) = 0.16 + 0.04 = 0.20$.
  *   **Result:** **0.20**.
  *   **Reviewer Note:** The probability rises slightly despite the negative traps because the soft positives prevent the negatives from being conclusive (the pest might be present but not trapped). The range is wide (0.15–0.30). We publish 0.20 but flag the variance.

  ---

  ## Part 3: Limitations & Honesty Markers

  To satisfy the external reviewer, the following must be appended to the weekly sheet:

  ### What This Procedure Cannot Do
  1.  **It cannot fix broken baselines.** As seen in Case 2, if the reliability of your detection method changes (new kit, new staff, new season), the procedure halts. It assumes the past predicts the reliability of the present.
  2.  **It cannot resolve conflicting expert priors.** If the pathologist insists their 70% includes the prior and refuses to isolate the signal, the procedure forces a default to 0.5 (maximum uncertainty). This protects us from double-counting but may underutilise expertise.
  3.  **It cannot aggregate dependent signals perfectly.** In Case 3, the press report and the grower suspicion might be the same rumour circulating twice. The spreadsheet treats them as independent unless manually adjusted. This is a **Judgment Call**, not a Theory Constraint.

  ### Theory Constraints vs. Judgment Calls
  *   **Theory Constraint:** The formula in Step 4. You cannot change the weighting of $P(H|E)$ without breaking the probability axioms.
  *   **Theory Constraint:** The Rigidity Test (Step 3). If reliability shifts, Jeffrey's Rule is invalid.
  *   **Judgment Call:** Setting $P(H|E)$. Deciding that a real photo implies 90% establishment rather than 50% is an epidemiological judgment, not a mathematical one.
  *   **Judgment Call:** The "Contamination Check." Deciding whether an expert has successfully isolated the signal from the prior is a conversational assessment.

  ### Hand-Off Protocol
  If the Senior Epidemiologist receives a "Rigidity Failure" or "Contamination Unresolved" flag, they must not simply overrule the number. They must document *why* the theory is being suspended. If they override the calculation without documenting the violation of rigidity, the audit trail is broken, and the agency is exposed to the same criticism as last month.

  **Signed:**  
  *Team Lead, Signal Assessment*  
  *Date: 24 May 2024*
