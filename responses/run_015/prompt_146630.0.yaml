      *   **The Task:** Audit this analogy using four specific variant cases of a candidate system called "Meridian."
      *   **Specific Requirements:**
          1.  Lay out an explicit mapping table (Rain/Rainstorm/Wetness/Programmer/Grain/Observer) for both the source (simulation) and target (LLM) domains.
