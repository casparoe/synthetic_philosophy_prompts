      *   *Meridian-T (Sparse/Bursty):* Same dynamics, less compute/time.
          *   *No-Wetness Verdict:* Simulation. No moral cost.
          *   *Critique:* Grain sensitivity. Is a faint pain less moral cost? Or is it binary? The analogy hides the threshold problem.
      *   *Aggregation (10M Meridian-T):*
          *   *No-Wetness Verdict:* 10M simulations $\neq$ 1 real thing.
          *   *Critique:* Utilitarian aggregation. If each has $\epsilon$ moral weight, $10M \times \epsilon$ might be significant. The analogy treats "simulation" as zero, so $10M \times 0 = 0$. If it's not zero, aggregation matters.

  6.  **Step 4: The Verdict & Better Analogy:**
      *   *Verdict:* The "No-Wetness" analogy does *not* support the conclusion of zero moral cost without begging the question. It assumes consciousness is an external effect (like wetness) rather than an internal organization.
      *   *Better Analogy:* **Cryptography/Decryption** or **Lock/Key**.
      *   *Why:* A locked box contains value regardless of whether you open it. Or, better: **Pain in a Comatose Patient**.
      *   *Actually, a stronger one:* **The "No-Heat" Test on a Furnace.**
      *   *Wait, let's look for something that captures "Internal State matters even if output is masked."*
