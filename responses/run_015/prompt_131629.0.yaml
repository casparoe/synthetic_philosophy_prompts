answer: |-
  You have correctly identified that the stalemate in the Evolutionary Debunking Argument (EDA) literature is not a lack of data, but a **category collision**. The debate appears to be about evolution and morality, but structurally, it is a clash between competing epistemic frameworks and metaphysical presuppositions that are rarely made explicit.

  Your intuition about the axiological/deontic split and the empirical/conceptual confusion is astute. Here is a diagnosis of the structure of the disagreement, broken down by the specific fault lines that prevent the two camps from engaging.

  ### 1. The Epistemic Fault Line: Defeaters vs. Coherence
  The primary reason the debate stalls is that Realists and Debunkers are operating with incompatible theories of **doxastic justification**.

  *   **The Debunker's Framework (Externalist/Sensitivity):** Debunkers (like Joyce or Street) typically rely on a **safety or sensitivity condition** for justification. The argument is: "If the moral truth were different, your evolutionary history would be the same, so you would hold the same belief." This makes the belief *insensitive* to the truth. For the debunker, the evolutionary origin acts as an **undercutting defeater**. Once the genealogy is revealed as truth-agnostic, the burden shifts entirely to the believer to prove independence.
  *   **The Realist's Framework (Internalist/Coherentist):** Realists (like Enoch or FitzPatrick) often rely on **reflective equilibrium** or general reasoning capacities. They argue that while the *seed* of the belief is evolutionary, the *justification* comes from our ability to critique and refine those intuitions using domain-general reason. For them, origin does not dictate warrant; current coherence and explanatory power do.

  **The Structural Impasse:** The Debunker asks, "Is the process that produced this belief truth-tracking?" The Realist answers, "Is the belief defensible under current reflection?" These are different questions. The Debunker sees the evolutionary origin as a permanent stain on the belief's pedigree; the Realist sees it as a starting point that can be scrubbed clean by reason. Unless they agree on whether **genealogy is destiny** for justification, they will talk past each other.

  ### 2. The Target Mismatch: Axiological vs. Deontic
  Your hypothesis about axiological (value) vs. deontic (obligation) judgments is a latent structural issue that explains why the arguments feel like they slide past one another.

  *   **Evolution tracks Axiology well:** It is plausible that evolution shaped us to perceive kin survival as "good" or pain as "bad." These are value-laden perceptions tied to fitness. Realists often defend the tracking of *values* because there is a plausible third-factor explanation (e.g., survival is good *and* evolution selects for survival).
  *   **Evolution struggles with Deontology:** It is much harder to explain how evolution selects for a belief in *categorical obligation* (e.g., "I ought to tell the truth even if it reduces fitness"). Debunkers often focus their strongest fire here: the feeling of **normative authority**.

  **The Structural Impasse:** When the Realist defends "moral truth," they are often defending the intelligibility of *value tracking* (which evolution might support). When the Debunker attacks "moral truth," they are often attacking the authority of *normative obligation* (which evolution undermines).
  *   If the debate is about **values**, the Realist has the stronger hand (evolution aligns with some goods).
  *   If the debate is about **obligations**, the Debunker has the stronger hand (evolution explains the *feeling* of obligation, not the *fact* of it).
  Because "moral belief" conflates these two, both sides claim victory on their preferred terrain without addressing the other's.

  ### 3. The Metaphysical Presupposition: Causal vs. Non-Causal Knowledge
  The EDA implicitly assumes a **causal theory of knowledge**. It presupposes that for a belief to be justified, there must be a causal link (or a reliable counterfactual link) between the truth-maker and the belief.

  *   **Naturalist Realists** can accept this. They argue moral properties are natural properties, so evolution *could* have tracked them.
  *   **Non-Naturalist Realists** (who posit mind-independent truths that are not part of the causal order) are in a bind. The EDA is essentially a restatement of Benacerraf's Dilemma for mathematics, applied to ethics.

  **The Structural Impasse:** The Debunker argues: "You claim these truths are mind-independent and causally inert. Evolution is causal. Therefore, evolution couldn't track them." The Realist responds with "Third-Factor" explanations (e.g., "Evolution selected for survival, and survival is objectively good").
  However, the Debunker rejects the Third-Factor move by claiming it begs the question: *Why* think survival is objectively good?
  The stalemate here is metaphysical: The Debunker assumes that if moral truth isn't causally connected to belief, it's inaccessible. The Realist assumes moral truth can be accessed via rational intuition regardless of causal connection. They disagree on the **conditions of accessibility** for normative truths.

  ### 4. What Would Move the Impasse?
  Given this diagnosis, empirical findings about the modularity of moral cognition (e.g., Haidt's social intuitionism) will not solve the problem. Knowing *how* the brain produces moral judgments does not tell us whether those judgments are *justified*.

  To move the debate, one of three structural shifts must occur:

  1.  **Agreement on Epistemic Principles:** The field would need to settle whether **sensitivity** (Debunker preference) or **coherence/reliability** (Realist preference) is the correct standard for normative justification. If philosophers agreed that genealogy provides a defeater *only if* no independent rational correction is possible, the debate would shift to the efficacy of reflection (an empirical/psychological question). If they agreed that insensitivity always defeats justification, Realism would be in trouble.
  2.  **Decoupling Axiology and Deontology:** If metaethics formally separated the project of explaining *value* (which might be naturalizable) from *obligation* (which might be constructivist), the EDA would lose its "one size fits all" force. Debunkers would have to concede that values might be tracked, while Realists would have to concede that categorical "oughts" require a different warrant (perhaps pragmatic or contractual).
  3.  **Reframing the Target:** The most productive move would be to admit that the EDA is not an argument against **moral truth**, but an argument against **epistemic access**. The question isn't "Do moral truths exist?" but "Can we claim to *know* them?" This shifts the debate from metaphysics to epistemology. If Realists retreat to a claim that moral beliefs are *reasonable* rather than *knowledge-tracking*, the Debunker's attack loses its bite (since reasonableness doesn't require truth-tracking).

  ### Summary Diagnosis
  The stall is not about evidence. It is a **framework collision**.
  *   **Debunkers** are asking a **genealogical question**: "Does the origin of this belief preclude truth-tracking?" (Answer: Yes, due to insensitivity).
  *   **Realists** are answering a **normative question**: "Can this belief be vindicated by reason?" (Answer: Yes, due to reflection).

  They are literally answering different questions under the heading "Does evolution debunk morality?" The Debunker is arguing about the **reliability of the process**, while the Realist is arguing about the **warrant of the output**.

  **Verdict on the Impasse:** The impasse will only break if the participants explicitly distinguish between **axiological tracking** (where evolution might be a ally) and **deontic authority** (where evolution is a rival), and agree on whether **origin** serves as a permanent **defeater** or merely a **challenge** to be overcome by reflection. Until then, it is two ships passing in the night: one sailing on the sea of epistemology, the other on the sea of metaphysics.
