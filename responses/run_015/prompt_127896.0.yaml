      *   All prompt questions answered? (Layers, Limits, Cholera, Theory implication).

  10. **Final Polish:** Check flow and transitions between paragraphs. (Self-Correction: Make sure to explicitly mention "Year Without a Summer" and "1817 Cholera" to keep it grounded).

  *(Self-Correction during drafting)*: I need to make sure I don't imply Braudel *never* considered climate change. He did, but mostly as a slow background. The Tambora event is a "shock" to the background. I need to highlight this tension.

  *(Final Plan)*:
  1. Intro: Braudel's clock speeds.
  2. Application: Long term (Agri/Geo), Intermediate (Markets/State), Short (Eruption/Riots).
  3. Critique 1: The Volcano (Event or Structure?).
  4. Critique 2: Suffering (Structure vs. Experience).
