answer: |-
  This is a sharp pitch. You are right to be wary of the "Spandrels" recap; your editor is right that leading with 1979 philosophy of biology is a readership killer. But the core problem you've identified is not philosophical, it's *journalistic workflow*. The adaptationist default is a heuristic for speed, not truth.

  Your fellowship gives you the luxury of treating the *production of evolutionary news* as the object of study, rather than just the news itself.

  Here is an audit of your tools, a defended ordering for the six pieces, and the criteria for reshuffling the agenda.

  ### Part 1: Audit of Your Homebrew Tools

  Your instincts are methodologically sound, but the framing needs to shift from "philosophical tests" to "reporting heuristics" to satisfy your editor and serve your readers.

  **1. The Base Rate Rule $\rightarrow$ The Reference Class Requirement**
  *   **Verdict:** Valid, but statistically tricky.
  *   **Critique:** You will not get a scientist to give you a number ("30% of behavioral traits are adaptations"). They don't know, and asking for it invites made-up precision.
  *   **Refinement:** Frame this as **The Burden of the Null**. In medicine, a drug is guilty (ineffective) until proven innocent. In ev-psych reporting, adaptation is innocent (true) until proven guilty. Your tool shouldn't ask for a base rate number; it should demand the *justification for the reference class*. If a reporter claims "Humans evolved to gossip," the scientist must define the class (Primates? Mammals? Social vertebrates?) and explain why *this* trait fits the adaptive pattern of that class better than the non-adaptive pattern.
  *   **Journalistic Utility:** High. It forces the source to move from "This makes sense" to "Here is the comparative evidence."

  **2. The Lineage Swap Test $\rightarrow$ The Phylogenetic Independence Check**
  *   **Verdict:** Strongest tool. Keep this almost exactly as is.
  *   **Critique:** This effectively tests for *convergent evolution* vs. *homology* without requiring the reporter to read a phylogeny. If the story works for a wolf, a whale, and a warbler equally well based solely on "utility," it is an engineering story, not an evolutionary one.
  *   **Refinement:** Call it the **"Universal Design" Test**. If the explanation relies only on the current utility and ignores the historical constraint, it's intelligent design dressed in Darwinian clothing.
  *   **Journalistic Utility:** Very High. It's a concrete question a reporter can ask in a 15-minute interview: "Would this explanation hold if we found this trait in a non-social species?"

  **3. Function Drift $\rightarrow$ The Moving Goalpost**
  *   **Verdict:** Real phenomenon, well-documented in philosophy (Lakatosian "research programmes" protecting the hard core), but needs a sharper name for print.
  *   **Critique:** This is the immune system of bad science. When data contradicts the adaptation, the *function* is redefined to fit the data.
  *   **Refinement:** Track a single high-profile hypothesis over 10 years. Show how the definition of the "function" has shifted to accommodate null results.
  *   **Journalistic Utility:** Medium-High. It makes for a great narrative feature (the history of a bad idea), but is less useful as a daily checklist item than the first two.

  ---

  ### Part 2: The Four Upstream Questions (The Agenda)

  To change how reporters write the "daily drip," you cannot start with the biology. You must start with the incentives. The ordering below moves from **Systemic Cause** $\rightarrow$ **Epistemic Standard** $\rightarrow$ **Detection Tools** $\rightarrow$ **Human Consequence**.

  **Question 1: The Incentive Structure (Upstream)**
  *   *Why does the adaptationist default persist despite 40 years of critique?*
  *   **Status:** Genuinely open in science communication, settled in sociology.
  *   **Why First:** If you don't explain *why* scientists and PIOs produce these stories (funding, press coverage, narrative simplicity), the rest of the series looks like you're scolding individuals for a systemic problem.
  *   **Tractability:** Interview Science PIOs, journal editors, and grant officers. You don't need lab data; you need email chains and policy docs.

  **Question 2: The Null Hypothesis (Methodological)**
  *   *What should a reporter assume is true before the evidence comes in?*
  *   **Status:** Settled in biology (drift/constraint are common), open in journalism (adaptation is default).
  *   **Why Second:** This settles the "Base Rate" issue. If you establish that "History/Constraint" is the proper null, you change the burden of proof for every subsequent piece.
  *   **Tractability:** Interview meta-scientists and philosophers of biology who work with labs (e.g., folks at the Konrad Lorenz Institute or similar).

  **Question 3: Falsifiability in Real-Time (Epistemic)**
  *   *How do we spot a "Just-So Story" before it hits print?*
  *   **Status:** Open. This is where your "Lineage Swap" tool lives.
  *   **Why Third:** Now that we know *why* the stories exist (Q1) and what the null should be (Q2), we need the tools to kill the bad ones.
  *   **Tractability:** Case studies. Take 3 recent high-profile papers and apply the Lineage Swap Test retrospectively.

  **Question 4: The Cost of Error (Ethical/Practical)**
  *   *Does it actually matter if we get the evolutionary story wrong?*
  *   **Status:** Highly contested. Some say "it's just fun speculation"; others say it reinforces harmful stereotypes.
  *   **Why Fourth:** This justifies the series to the skeptic. If the error is harmless, the series is academic. If the error shapes policy or self-conception, the series is urgent.
  *   **Tractability:** Interview social scientists who use ev-psych data in policy, and critics who track the misuse of these narratives.

  ---

  ### Part 3: The Six-Piece Ordering

  Here is how you map the four questions to six features.

  **Piece 1: The Machine (Question 1)**
  *   **Title Idea:** *The Adaptation Industrial Complex.*
  *   **Focus:** Follow a press release from lab to wire service. Interview the PIO who wrote it. Ask: "Did you hedge the adaptation claim? Why/Why not?"
  *   **Goal:** Exonerate the individual reporter, indict the system. Establishes that this is a workflow problem, not a stupidity problem.

  **Piece 2: The Null (Question 2)**
  *   **Title Idea:** *Guilty Until Proven Adaptive.*
  *   **Focus:** The "Base Rate/Reference Class" argument. Profile a lab that *starts* with constraint/drift and treats adaptation as the special claim requiring extra proof.
  *   **Goal:** Shift the reader's intuition. Make "drift" sound like the rigorous default, not the boring alternative.

  **Piece 3: The Tool (Question 3)**
  *   **Title Idea:** *The Lineage Swap.*
  *   **Focus:** Operationalize your second homebrew tool. Take three recent "Why We Do X" headlines. Apply the test. Show how many fail.
  *   **Goal:** Give other journalists a checklist. This is the "service journalism" piece of the fellowship.

  **Piece 4: The Drift (Question 3 continued)**
  *   **Title Idea:** *The Moving Target.*
  *   **Focus:** A deep dive on one specific trait (e.g., "depression is an adaptation" or "ovulatory shift"). Trace how the claimed function has changed over 15 years to match new data.
  *   **Goal:** Demonstrate "Function Drift" concretely. Show that unfalsifiable stories are not science.

  **Piece 5: The Stakes (Question 4)**
  *   **Title Idea:** *The Politics of the Spandrel.*
  *   **Focus:** Human behavior specifically. When adaptive stories land on gender, race, or hierarchy, what is the downstream effect? Interview sociologists and ethicists.
  *   **Goal:** Answer the "So What?" If these were stories about beetle wings, who would care? Because they are about humans, the error has weight.

  **Piece 6: The Style Guide (Synthesis)**
  *   **Title Idea:** *A Reporter's Guide to Evolutionary Claims.*
  *   **Focus:** A manifesto. Summarize the previous five pieces into a set of guidelines for newsrooms.
  *   **Goal:** Legacy. This is the piece you send to editors when they ask, "Okay, so how do I edit this copy tomorrow?"

  ---

  ### Part 4: Reasoning for the Order

  1.  **Upstream Dependency:** You cannot ask reporters to use better tools (Piece 3) if they don't understand why the current tools are the default (Piece 1). You cannot argue for a new null hypothesis (Piece 2) until you've shown the current system is incentivized to produce the old one.
  2.  **Avoiding "Filler":** The "Is adaptationism real?" debate is filler. It was settled in the 90s. The "Why do we keep reporting it as if it isn't?" debate is open and vital. Pieces 1 and 2 avoid the filler trap by focusing on *communication* and *method*, not ontology.
  3.  **Tractability:** This order front-loads the interviews (PIOs, Editors) which are easier to schedule early. It saves the complex case studies (Pieces 3 & 4) for when you have your footing.
  4.  **Journalistic Impact:** Piece 1 hooks the industry (it's about *them*). Piece 6 closes the loop (here's how to fix it). If you put Piece 6 first, it's preachy. If you put it last, it's a solution.

  ### Part 5: Triggers for Reshuffling

  You asked what should make you reshuffle the series. Here are the pivot points:

  *   **The "Smoking Gun" Interview:** If, in Piece 1, a PIO admits, "We know it's a just-so story, but 'Adaptation' gets 3x the clicks of 'Constraint'," you move Piece 5 (The Stakes) up to Piece 2. You need to hammer the *harm* of that clickbait immediately.
  *   **The Major Retraction:** If a major ev-psych paper is retracted or heavily critiqued during your fellowship (e.g., a high-profile "gene for X" study), you pause the planned order. You drop everything to write a "Post-Mortem" using your Lineage Swap tool. This becomes the anchor for Piece 3.
  *   **The "Settled" Shock:** If you interview a leading evolutionary biologist who says, "Actually, we *don't* think drift is the null for behavior," you have to rewrite Piece 2. You need to verify if the "consensus" you think exists in biology is actually present in the sub-field you are covering. (My bet: the consensus exists in theory but not in practice).
  *   **The Editor's Pushback:** If your editor balks at Piece 2 (The Null), it means "drift" is too abstract. Pivot to **Piece 3 (The Tool)** earlier. Reporters love checklists more than philosophy. If you can show them *how* to catch the error, they care less about the theoretical null.

  ### Final Advice on the "Spandrel" Word
  Your editor is right. Don't use "Spandrel" in the headline or lede. Use it in the sidebar or the "explainer" box.
  *   **Instead of:** "The Return of the Spandrel."
  *   **Try:** "The Evolutionary Excuse." or "The Just-So Problem."
  *   **The Hook:** The story isn't about Gould and Lewontin. It's about why your morning newspaper is still lying to you about human nature, and how a 40-year-old argument holds the key to stopping it.

  This agenda treats your fellowship not as a sabbatical to think about biology, but as an investigation into the *infrastructure of scientific truth*. That is a story that sells.
