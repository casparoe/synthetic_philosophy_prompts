  You have described a phenomenon that is more insidious than Orwell's because it is immune to his cure. Orwell believed that clearing the prose would clear the thought. You have found that clear prose, honest intent, and precise definitions can still systematically annihilate reality. This is not a failure of style; it is a failure of **ontology** engineered by **infrastructure**.

  There is no single established term that captures the exact boundaries you have drawn, but there are three neighbors in political science, sociology, and the philosophy of science. I will outline them, show where they fall short, and then offer a coined term that fits the specific mechanics you described.

  ### The Nearest Established Concepts

  **1. Commensuration (Espeland & Stevens)**
  *   **The Concept:** The transformation of different qualities into a common metric to allow comparison.
  *   **Where it fits:** This perfectly describes your first instance (the shelter hearing). The commenter proposed "cash" (a transfer); the agency tracks "programs" (an intervention). To record the comment, the agency commensurated the cash into a "program category" so it could be scored on "cost per unit." The distortion arose from the necessity of comparison.
  *   **The Boundary:** Commensuration focuses on *value* and *ranking*. It explains why the cash proposal lost (it scored badly on program metrics). It does not fully explain your second instance (the hospital form). The hospital form isn't trying to compare the discharge outcome against other errors to see which is "better"; it is trying to determine *if it exists at all*. Commensuration explains the translation of value; it does not fully explain the erasure of visibility.

  **2. Infrastructural Silence / Residualization (Bowker & Star)**
  *   **The Concept:** In *Sorting Things Out*, Bowker and Star argue that classification systems inevitably produce "residual categories" (e.g., "Other"). Whatever falls there becomes invisible to the system's logic.
  *   **Where it fits:** This perfectly describes your second instance. The "discharge into bad circumstances" is not an "error" or an "event" within the schema, so it falls into the residual box. It is not suppressed; it is structurally silenced by the joints of the classification.
  *   **The Boundary:** This concept focuses on *omission*. It explains why the outcome disappears. It does not fully capture the *active translation* you describe in the first instance, where the claim is not silenced but *misrepresented* (cash becomes a program). Bowker and Star describe where things go to die; you are describing things that are kept alive but mutated.

  **3. The McNamara Fallacy**
  *   **The Concept:** A four-step cognitive bias: (1) Measure what is easy; (2) Disregard what is hard to measure; (3) Presume what is hard to measure doesn't exist; (4) Presume it isn't important.
  *   **Where it fits:** It captures the reliance on countable nouns (bed-nights, enrollments) over complex realities (housing stability, safety).
  *   **The Boundary:** The McNamara Fallacy implies a *choice* or a *hubris* on the part of the measurer. It suggests negligence. Your description is more troubling: the authors are competent, honest, and acting in good faith. The distortion is not a human error; it is a property of the medium.

  ### The Coined Term: Operational Displacement

  Since the existing terms capture the *metrics* (Commensuration) or the *silence* (Infrastructural Silence) but not the *honest distortion*, I propose the term **Operational Displacement**.

  **Definition:**
  **Operational Displacement** occurs when an administrative schema requires that all inputs be translated into the system's operational units (the things it can count, file, or act upon) in order to be recorded. The phenomenon is distinct from lying or bias because the translation is accurate *relative to the schema*, but false *relative to the reality*. The claim is not rejected; it is displaced into a category that allows it to be processed, thereby altering its nature.

  **Why this term:**
  *   **Operational:** It roots the problem in *operations* (what the agency *does*: administers, counts, files) rather than vocabulary. As you noted, the vocabulary is rich; the operations are narrow.
  *   **Displacement:** It captures the movement of the claim from its true ontological home (cash, systemic risk) to a false but legible home (program unit, internal error).

  **The Edges of the Phenomenon (Boundaries):**
  1.  **Vs. Ideology:** Ideology implies a desired outcome (e.g., "we want to hide the cost"). Operational Displacement happens even if the operator wants the truth. It is a constraint of the *form*, not the *will*.
  2.  **Vs. Framing:** Framing is strategic (a speaker chooses a frame). Operational Displacement is structural (the form chooses the frame for the speaker). You wrote the memoranda, yet the framework foreclosed your alternatives.
  3.  **Vs. Newspeak:** Newspeak deletes words to prevent thought. Operational Displacement keeps the words but strips them of their external referents. "Program" still means "Program," but the system cannot conceive of "Non-Program Assistance," so it forces the latter into the former.

  ### Answers to Your Specific Questions

  **1. Are the hearing and the hospital form the same thing?**
  Yes. They are both instances of **Operational Displacement**, but they represent the two poles of the mechanism.
  *   The **Hearing** is *Active Displacement*: The system forces the alien input (cash) into a native category (program) to process it. The claim survives but is mutated.
  *   The **Hospital Form** is *Passive Displacement*: The system lacks a native category for the input (external discharge risk), so it displaces it into the "residual" bucket. The claim survives but is neutralized.
  In both cases, the *operational capacity of the agency* (what it can fund or what it can fix internally) defines the *ontology of the problem*.

  **2. Does "awkward to express" count, or must it actively turn into a different position?**
  The concept requires that the attempt to state the position **actively turns it into a different position**.
  If the distinction is merely awkward (e.g., "I can say this, but it takes a paragraph"), the system *could* theoretically accommodate it. That is a friction cost.
  **Operational Displacement** occurs when the system *cannot* accommodate the claim without violating its own logic. In your shelter example, recording "cash" as "cash" would break the "cost per unit of service" column. To enter the data, you *must* call it a service. The distortion is not a side effect; it is the price of admission. If the claim can be recorded accurately, even clumsily, it is not Operational Displacement.

  **3. Is the phenomenon located in the vocabulary, the forms/metrics, or the habits?**
  It is located in the **forms and metrics built on top of the vocabulary**.
  You noted the vocabulary is rich and the people are fluent. The failure is not linguistic; it is **infrastructural**. The database schema, the reporting form, and the memorandum template constitute a "logic of administration" that is distinct from the "logic of the world."
  *   **Vocabulary:** Capable of truth.
  *   **Habits:** Capable of honesty.
  *   **Forms/Metrics:** Incapable of receiving the truth without translation.

  The phenomenon is properly located in the **interface between the world and the record**. It is the loss of fidelity that occurs when reality is digitized into administrative data. Orwell feared the corruption of the word; you have identified the corruption of the *field*.

  ### Summary
  You are describing **Operational Displacement**. It is not that the language bounds what can be *thought* (Sapir-Whorf), but that the **schema bounds what can be *registered***. It is distinct from ideology because it binds the bureaucrat as tightly as the subject. It is distinct from framing because it is a property of the medium, not the message. It is the cost of legibility.
