  # JOINT STATEMENT ON THE PASADENA GAME
  **Date:** October 26, 2023
  **Parties:** [Your Name] ("Extend-the-Rule") & [Friend's Name] ("Bounded-Value")

  ## PREAMBLE
  We have debated the implications of the "Pasadena Game" for two years. We recognize that our debate has stalled because we are arguing past each other regarding which layer of decision theory requires modification. This document formalizes our common ground, isolates our residual disagreement, and specifies six empirical or theoretical "cruxes" that bear on the dispute. We agree not to cite external literature in this context; the validity of these claims rests on our mutual understanding of the math and the theory, not on authority.

  ## I. AGREED CLAIMS (LOAD-BEARING)
  *We both endorse the following five claims. Denial of any claim by either party voids this agreement.*

  1.  **The Mathematical Fact:** The Pasadena Game generates a payoff series $\sum p_n u_n$ that is conditionally convergent. By the Riemann Rearrangement Theorem, the terms of this series can be reordered to sum to any real number, or to diverge to $\pm \infty$, without changing the set of payoff-probability pairs.
  2.  **The Failure of Standard Expectation:** Standard Expected Utility Theory (EUT), which ranks prospects solely by the sum $\sum p_n u_n$, cannot assign a unique, order-independent value to the Pasadena Game. Any assignment of a specific value (such as $\ln 2$) requires an extra-theoretical stipulation regarding the ordering of outcomes.
  3.  **The Forced Choice:** To restore coherence to decision-making in the presence of such games, one must adopt one of two strategies:
      *   **(A) Restrict the Domain:** Impose constraints on admissible utility functions or prospects (e.g., bounded utility) such that the expectation is always absolutely convergent.
      *   **(B) Generalize the Rule:** Retain unbounded utility but replace or augment the expectation rule with a decision principle that can handle undefined expectations (e.g., partial orderings, dominance, or relative comparisons).
  4.  **No Cost-Free Solution:** Neither strategy is free of theoretical cost. Strategy (A) forbids modeling agents who genuinely value unbounded quantities (e.g., number of lives saved). Strategy (B) sacrifices the Completeness Axiom (the ability to rank all pairs of gambles) or Linearity (the ability to sum independent gambles).
  5.  **The Counterexample Status:** The Pasadena Game is a valid counterexample to the conjunction of three claims: (1) Utilities can be unbounded, (2) Preferences must be complete, and (3) Preferences must respect standard expectation over infinite prospects. At least one of these three must be rejected.

  ## II. DISAGREEMENTS TABLE
  *This table isolates the exact residual disagreement. We agree on the math; we disagree on the theoretical repair.*

  | Issue | Residual Disagreement | Extend-the-Rule Wording (User) | Bounded-Value Wording (Friend) | Flag |
  | :--- | :--- | :--- | :--- | :--- |
  | **Locus of Error** | Where does the theory break? | The **Decision Rule** is too narrow. It assumes expectations always exist. We need a rule that works even when they don't. | The **Value Model** is too permissive. It allows utility functions that generate ill-defined expectations. We must ban them. | **Real Disagreement** (Downstream consequences differ) |
  | **Completeness** | Can we rank Pasadena vs. $0? | No. It is rationally permissible to have no preference. The relation is partial. | Yes. If we can't rank them, the utility function is invalid. A rational agent must have a price. | **Real Disagreement** |
  | **Unboundedness** | Is unbounded utility coherent? | Yes, provided we accept that some gambles have no defined value. | No. Unbounded utility inevitably leads to undefined values in infinite spaces. | **Node Adjustment** (Depends on definition of "coherent") |

  ## III. THE SIX CRUXES
  *For each test, we specify the setup, the question-begging risks, and the predictions each side makes based on their theoretical commitment.*

  ### 1. The Swap Test (Re-indexing)
  **Setup:** Consider the Pasadena Game $G$. Construct $G'$ by swapping the payoff of outcome $n=1$ with outcome $n=2$, then $n=3$ with $n=4$, etc. (Effectively rearranging the series terms).
  **Question:** Is $G$ indifferent to $G'$?
  **Question-Begging Flag:** If one assumes "Value = Sum of $p \cdot u$", then $G$ and $G'$ have different values by definition. If one assumes "Value = Set of $\{p, u\}$ pairs", they are identical. This test probes which definition we prioritize.
  **Predictions:**
  *   **Extend-the-Rule:** $G$ and $G'$ are **incomparable**. Since the expectation is undefined, there is no fact of the matter about which is better. Swapping changes the convergence properties, which matters when expectations are not absolute.
  *   **Bounded-Value:** The question is **illegitimate**. A coherent utility function would not allow $G$ to exist. If forced to model it, we must treat $G$ and $G'$ as distinct gambles with different values, proving that the "gamble" is ill-defined without an ordering.

  ### 2. The Slow Family ($s$)
  **Setup:** Game $P_s$ pays $(-1)^{n-1} \cdot 2^n / n^s$.
  **Question:** Is there a qualitative difference in rationality between $s=0.99$ (divergent) and $s=1.01$ (absolutely convergent)?
  **Question-Begging Flag:** Asking if stakes are "too high" begs the question against unbounded utility. Asking if sums "converge" begs the question against extending the rule.
  **Predictions:**
  *   **Extend-the-Rule:** **Yes, sharp difference.** $s=1.01$ has a defined expectation and can be ranked against cash. $s=0.99$ has an undefined expectation and cannot. The discontinuity is a feature of the math, not a bug in the theory.
  *   **Bounded-Value:** **No, or suspicious.** Both have unbounded stakes. If $s=0.99$ is forbidden because it breaks expectation, $s=1.01$ should be forbidden because it relies on unbounded utility which *could* break expectation under different probability distributions. The boundary at $s=1$ is arbitrary if the objection is truly about unboundedness.

  ### 3. Cap-Dominance
  **Setup:** Clamp payoffs to $[-M, M]$. Calculate Expected Value $E_M$. Observe limit as $M \to \infty$.
  **Question:** Does symmetric capping ($\pm M$) recover a stable value ($\ln 2$), and does asymmetric capping ($-M, +2M$) destabilize it?
  **Question-Begging Flag:** Assuming symmetric capping is the "neutral" way to evaluate a gamble smuggles in the answer $\ln 2$.
  **Predictions:**
  *   **Extend-the-Rule:** **Symmetric capping is an artifact.** The fact that drifting caps send the value to $\pm \infty$ proves the gamble has no robust value. Symmetric capping hides the instability; it does not resolve it.
  *   **Bounded-Value:** **Symmetric capping reveals the 'true' regularized value.** If a value depends on how you take the limit, the object is ill-posed. The sensitivity to asymmetric caps confirms that the gamble is inadmissible for a rational agent.

  ### 4. Bid–Ask Spread
  **Setup:** You own the game. What is your Selling Price? You do not own the game. What is your Buying Price?
  **Question:** Is there a single Certainty Equivalent (CE), or a spread (or no price)?
  **Question-Begging Flag:** Assuming a rational agent *must* have a single price begs the question against incomplete preferences.
  **Predictions:**
  *   **Extend-the-Rule:** **Wide Spread or No Price.** A rational agent with unbounded utility and extended rules should refuse to trade or demand a massive spread to compensate for the undefined tail risk. A single number is irrational.
  *   **Bounded-Value:** **Single Number.** If the agent is rational, their utility is bounded. Therefore, a single CE exists. If they report a spread, they are either confused or their utility function is misspecified.

  ### 5. The Hedge
  **Setup:** Take Game $G$ and a copy $-G$ (payoffs flipped).
  *   Case A: Driven by the **same** coin toss.
  *   Case B: Driven by **independent** coin tosses.
  **Question:** Is the value of the package $0$ in both cases?
  **Question-Begging Flag:** Assuming Linearity ($E[A+B] = E[A] + E[B]$) begs the question against Extend-the-Rule, as linearity fails for undefined expectations.
  **Predictions:**
  *   **Extend-the-Rule:** **Case A is $0$; Case B is Undefined.** In Case A, the payoff is identically zero. In Case B, we are summing two undefined expectations. Linearity does not hold. We should find this uncomfortable but accept it as the cost of unbounded utility.
  *   **Bounded-Value:** **Both must be $0$.** If Case B is not $0$, the valuation method is broken. This result demonstrates that unbounded utility leads to violations of basic dominance and additivity, confirming it must be banned.

  ### 6. The Many-Shot Test (Law of Large Numbers)
  **Setup:** Play $n$ independent copies of the Pasadena Game. Observe the average payoff as $n \to \infty$.
  **Question:** Does the average converge to $\ln 2$, diverge, or oscillate?
  **Question-Begging Flag:** Assuming the "Expected Value" *is* the "Long-Run Average" begs the question. For conditionally convergent series, these may not be identical.
  **Predictions:**
  *   **Extend-the-Rule:** **Oscillation/No Limit.** We predict the sample mean will not settle on $\ln 2$. This confirms that $\ln 2$ is an artifact of series ordering, not a physical long-run frequency. Expectation $\neq$ Long-Run Average here.
  *   **Bounded-Value:** **Instability.** We predict the average will not settle. This confirms that the game has no stable empirical value, and thus should not be assigned a theoretical value. (Note: If it *did* settle, Bounded-Value would claim vindication; Extend-the-Rule would claim the math was misapplied).

  ## SIGN-OFF
  *We sign this to acknowledge that our disagreement is not about the mathematics of the series, but about which axiom of decision theory is the least expensive to discard.*

  _________________________ (Extend-the-Rule)

  _________________________ (Bounded-Value)
