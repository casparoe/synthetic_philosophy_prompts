  1.  **Primary Measure:** When judging the shift from foraging to farming, which outcome matters most?
      a. The daily health, leisure, and autonomy of the individuals living through the change.
      b. The total population size, technological complexity, and long-term survival of the lineage.
      *If 1a, go to 2.*
      *If 1b, go to 4.*

  2.  **The Undo Button:** A village around 6000 BCE gets to vote on forgetting grain and going back to full foraging, knowing what we now know, but with the population it actually has by then.
      a. They should vote to switch back; life was better before.
      b. They should not; staying is preferable or inevitable.
      *If 2a, go to 3.*
      *If 2b, go to 4.*

  3.  **The Ratchet:** How did they get stuck farming in the first place?
      a. Every generation's move to slightly more farming is locally sensible and slightly raises how many people the land supports, so the option of going back shrinks a little each time, until foraging isn't on the table any more.
      b. They could have stopped at any time, but chose not to despite the costs.
      *If 3a, go to Leaf 1.*
      *If 3b, go to Leaf 2.*

  4.  **The Package:** Is "farming" one single change, or a bundle of different technologies?
      a. It is one single change; you take it all or leave it.
      b. It is a bundle; some parts are harmful, others neutral or good.
      *If 4a, go to 6.*
      *If 4b, go to 5.*

  5.  **The Split:** Which bit of the bundle is doing the damage?
      a. Cereal calories (monoculture diet).
      b. Domesticated animals (labor and disease).
      c. Storable surplus that can be taxed (enables hierarchy).
      d. None of these specifically; the harm is elsewhere.
      *If 5a, go to Leaf 7.*
      *If 5b, go to Leaf 8.*
      *If 5c, go to Leaf 9.*
      *If 5d, go to Leaf 10.*

  6.  **Climate Pressure:** Why did they adopt farming if it was one single change?
      a. Climate change or population pressure made foraging impossible; survival required farming.
      b. Foraging was still possible; farming was chosen freely.
      *If 6a, go to Leaf 3.*
      *If 6b, go to 7.*

  7.  **Legitimacy:** Is it fair to call this choice a "mistake" from our viewpoint?
      a. Yes; suffering is suffering, regardless of context.
      b. No; judging past choices by modern standards is a category error.
      *If 7a, go to 8.*
      *If 7b, go to Leaf 6.*

  8.  **Health Reality:** Did the individuals actually suffer?
      a. Yes; skeletons show disease and starvation increased.
      b. No; life expectancy and stability improved for most.
      *If 8a, go to Leaf 4.*
      *If 8b, go to Leaf 5.*

  ***

  **Leaf 1: The Golden Trap**
  *   **Position:** Determinist / Ratchet Theory.
  *   **Awkward Commitment:** Must argue that no one is to blame, even though the outcome is undesirable for the individuals living it.
  **Leaf 2: The Worst Mistake**
  *   **Position:** Strong Verdict (Revisionist).
  *   **Awkward Commitment:** Must argue that ancestors made a collective blunder despite having viable alternatives for generations.
  **Leaf 3: The Necessary Evil**
  *   **Position:** Climate Determinist (Traditional Archaeology).
  *   **Awkward Commitment:** Must argue that farming was inevitable, rendering the moral question of "mistake" moot.
  **Leaf 4: The Utilitarian Trade-off**
  *   **Position:** Long-term Good (Utilitarian).
  *   **Awkward Commitment:** Must accept that generations of actual humans suffered worse health so that future strangers could exist.
  **Leaf 5: The Progressivist**
  *   **Position:** Progressivist (Enlightenment).
  *   **Awkward Commitment:** Must deny or minimize the skeletal evidence of health decline in early agriculturalists.
  **Leaf 6: The Contextualist**
  *   **Position:** Illegitimate Comparison.
  *   **Awkward Commitment:** Must refuse to judge history morally, even when faced with clear evidence of suffering.
  **Leaf 7: The Grain Critic**
  *   **Position:** Package Splitter (Cereal Focus).
  *   **Awkward Commitment:** Must claim tuber or fruit cultivation would have avoided the hierarchy/disease associated with grains.
  **Leaf 8: The Zoonosis Critic**
  *   **Position:** Package Splitter (Animal Focus).
  *   **Awkward Commitment:** Must claim plant cultivation without livestock would not have led to similar population pressures or disease.
  **Leaf 9: The State Critic**
  *   **Position:** Package Splitter (Surplus/Political).
  *   **Awkward Commitment:** Must argue that storage alone creates kings, regardless of whether the storers are healthy or free.
  **Leaf 10: The Undefined Splitter**
  *   **Position:** Undefended / Abstract Critic.
  *   **Awkward Commitment:** Must identify a harmful element of farming that is not grain, animals, or surplus (e.g., sedentism itself), without much empirical backing.

  ***

  ### Analysis of the Logical Space

  **Empty Cells**
  *   **Leaf 10 (The Undefined Splitter)** is effectively empty in serious literature. It is **undefended**. While logically possible (e.g., arguing that "sedentism" itself is the poison regardless of diet or surplus), almost every theorist who splits the package pins the harm on one of the three concrete mechanisms in Question 5. It remains in the key only to preserve logical completeness.

  **Indistinguishable Leaves**
  *   **Leaves 7, 8, and 9 (The Package Splitters)** are empirically tangled. In the historical record, cereal calories, domesticated animals, and storable surplus almost always appear together. While the key separates them logically, a real-world respondent might find it impossible to answer Question 5 without speculation. These leaves represent **theoretical distinctions** rather than observable historical alternatives.
  *   **Leaf 1 (The Golden Trap) and Leaf 3 (The Necessary Evil)** can be hard to separate in practice. Both conclude "no fault," but Leaf 1 allows for human agency (bad choices made sensible by context) while Leaf 3 removes agency (environmental force). In conversation, these often collapse into "It wasn't a mistake."

  **Question Order Logic**
  *   **Question 1** establishes the moral metric before discussing facts. A utilitarian (1b) and a humanist (1a) will talk past each other unless sorted early.
  *   **Questions 2 and 3** handle the "agency vs. constraint" debate using your required cases.
  *   **Question 4** forces the "farming is not one thing" nuance before asking about causes.
  *   **Questions 6, 7, and 8** resolve the remaining "Collective Good" branch by testing necessity, legitimacy, and empirical health claims.

  **Constraint Check**
  *   **7-8 Questions:** There are exactly 8 numbered questions.
  *   **8-10 Leaves:** There are exactly 10 leaves.
  *   **No Position Names in Key:** Questions use concrete cases and plain claims.
  *   **Required Cases:** Undo Button (Q2), Ratchet (Q3), Package Split (Q5) are embedded verbatim or near-verbatim.
  *   **Answerable Cold:** All questions rely on intuition pumps or agree/disagree claims requiring no specialized reading.
