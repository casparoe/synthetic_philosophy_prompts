answer: |-
  The rain lashed against the office window, blurring the lights of the campus below. Bea stirred her tea, the spoon clinking against the mug, while Tariq leaned back in his chair, rubbing his temples. They had been circling the germline reconstitution case for twenty minutes.

  'Right,' Bea said, setting the spoon down. 'Let's cut the preamble. Variant One: different gametes, edited to match my actual genome exactly. Variant Two: my actual gametes, edited to change my eye colour and give me a heart condition. You say Variant One is me. I say it's a duplicate.'

  'And you say Variant Two is you,' Tariq replied, 'despite the genetic edits. That's the hard sell, Bea. You're anchoring identity to the specific material cells—the sperm and egg themselves—rather than the informational structure they carry. Why? If the developmental programme is identical in Variant One, if the resulting organism runs the same cognitive software on the same hardware architecture, why does the history of the matter matter more than the structure of the matter?'

  'Because identity isn't about similarity, it's about history,' Bea said, leaning forward. 'If I locate the essence in the specific gametes, I avoid the duplication problem. In Variant One, the causal chain begins with a different fusion event. Even if the nuclear genome is base-pair perfect, the mitochondria differ, the cytoplasmic environment differs. It's a new historical entity. In Variant Two, the historical chain is continuous with me. The edits are modifications to an existing origin, not a new origin.'

  'But that collapses under the recombination lottery,' Tariq countered. 'Your actual sperm and egg were themselves the product of meiosis. A slightly different crossover event yields a genetically distinct gamete. If you claim *this* specific sperm is essential, you're saying a microscopic shift in chromosomal shuffling creates a different person. That makes identity hostage to quantum noise. My view is cleaner: identity tracks the specific developmental programme. Variant One instantiates Alice's programme. Variant Two instantiates a modified programme. So Variant One is the closer candidate for being Alice.'

  'You're smuggling in a counterpart relation and calling it identity,' Bea said. 'If Variant One is me, then what prevents a third variant? Same genome, different uterus? Different century? You lose the constraint that stops me from being identical to everyone who shares my psychology. I need the material origin to be the bottleneck.'

  'And I need the bottleneck to be compatible with how biology actually individuates,' Tariq said. 'Consider monozygotic twinning. One zygote, total molecular state *S*, splits into two people. If the essence is in the zygote's total state at syngamy, as you seem to imply, where does the essence live when the split happens? Does one twin get the essence and the other doesn't? Or does the original person cease to exist?'

  Bea paused, tracing the rim of her mug. 'The zygote is the origin, but personhood emerges later. When twinning occurs, the original individual ceases, and two new individuals begin, both sharing the same origin history up to that point. But crucially, neither twin could have originated from a *different* zygote. The constraint holds: no person could have started from a numerically different fusion event. Twinning is a fission of an origin, not a transworld identity jump.'

  'That's a costly bullet to bite,' Tariq said. 'You're saying the original zygote dies to birth the twins. I'd rather say the identity conditions are vague there. But look, let's talk about prudential concern. If Variant One—the genome match—is walking around today, do you care about her pain as you care about your own?'

  'No,' Bea said immediately. 'I care about her as I care about a identical twin. Deeply, but not selfishly. If Variant Two—the modified biological child—is in pain, I care selfishly, because that is my history extended.'

  'But Variant One has your memories, your temperament, your vulnerabilities,' Tariq pressed. 'If identity is what grounds prudential concern, and you deny identity there, you're severing the link between psychological continuity and self-interest. That seems wrong. I argue Variant One is Alice because the properties that make Alice *Alice*—her psychological dispositions, her physical traits—are grounded in that genome. The gametes are just the delivery mechanism.'

  'The gametes are the cause, not the delivery mechanism,' Bea insisted. 'Without *these* cells, *I* do not exist. You're treating me as a pattern that can be instantiated elsewhere. I'm a historical particular.'

  They sat in silence for a moment, the rain drumming harder.

  'Here's where we might shake hands,' Tariq said slowly. 'We both agree that not every possible being with Alice's psychology is Alice. We both accept there must be a metaphysical constraint on origin to prevent infinite duplication. We disagree on whether that constraint is material or structural.'

  'Agreed,' Bea said. 'The constraint is necessary. The nature of the constraint is the dispute.'

  'So, the divergence,' Tariq said, picking up his pen. 'For me, it's this sentence: "Identity tracks the specific developmental programme rather than the material vehicle of initiation." For you, it's: "Identity tracks the specific material gametes regardless of the informational output."'

  'Precisely,' Bea said. 'But here's the variant that would make me waver. Suppose we have a third case: gradual replacement. We start with my actual zygote, but over the first hour of division, we replace every molecule with a duplicate from Variant One's gametes, one by one, preserving function throughout. If I say that's still me, I've conceded that matter doesn't matter. If I say it's not, I've conceded that continuity of matter isn't essential either.'

  Tariq nodded, writing it down. 'And for me, the swayer is this: suppose the genome in Variant One is matched perfectly, but the mitochondrial DNA is from a different species entirely, incompatible with human development unless artificially sustained. If that being is psychologically identical to me but biologically alien, is it me? If I say no, I've conceded that material origin constraints bite somewhere. If I say yes, I've detached identity from biology entirely.'

  Bea smiled, finally taking a sip of her tea. 'So we're both stuck with a boundary we can't quite draw, but we agree the cliff edge is real.'

  'The cliff edge is real,' Tariq confirmed. 'We just disagree on which side of the fence we're standing.'

  'Cheers to that,' Bea said, raising her mug. 'Same time next fortnight?'

  'Bring the teleportation cases,' Tariq said. 'I want to see you squirm.'
