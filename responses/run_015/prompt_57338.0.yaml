      *   *Marta's Specific Rule:* **Intentionality requires (1) Causal Control and (2) the absence of active opposition to the outcome.** (If Harm: Indifference suffices. If Help: Indifference or Gladness doesn't suffice unless it was a motive? Wait, V5 says "glad... though it played no part in her decision." Code: Not Intentional. This fits standard Knobe.)
