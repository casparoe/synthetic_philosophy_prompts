  ### Prediction for Vignette 7
  **Marta's Code:** Not Intentional.

  **Marta's Rule:** **The Asymmetric Attitude & Control Rule.**
  Marta's coding scheme relies on two necessary conditions: (1) **Causal Control** (the agent could have prevented the outcome), and (2) **Valence-Specific Attitude**.
  *   **For Harmful Side Effects:** The outcome is intentional if the agent had control and did **not actively oppose** it (indifference suffices; regret/opposition negates intentionality).
  *   **For Helpful Side Effects:** The outcome is intentional only if the agent had control and the outcome was a **motivating reason** (mere gladness or indifference is insufficient).

  **Application to V7:** The surgeon has control (alternative technique available). The outcome is harm (chronic pain). However, the surgeon is "distressed" and "would prevent it if she could," signaling active **opposition/regret**. Under Marta's rule (mirroring V2 and V6), opposition negates intentionality for harm, regardless of the selfishness of the motive.

  ***

  ### Rival Rules and Evaluation

  Here are four familiar candidates from the literature, plus one novel construction, evaluated against Vignettes 1–6.

  #### 1. The Blame Account (Knobe, 2003)
  *   **Rule:** Side effects are coded intentional if and only if the agent is morally blameworthy for them.
  *   **Hits:** V1 (Blameworthy indifference = Int), V4 (Blameworthy indifference = Int), V6 (Debatable blame, but coded Not), V2 (Not blameworthy = Not).
  *   **Misses:** **V6 (Boiler).** The superintendent is not blameworthy (fire risk), coded Not Intentional (Hit). **V7 (Surgeon).** If this rule holds, V7 *must* be Intentional (highly blameworthy selfishness).
  *   **Cost:** Fails to explain why V2 and V6 are "Not Intentional" despite involving harm. It cannot distinguish between *regrettable necessity* (V2/V6) and *blameworthy negligence* without importing attitude.

  #### 2. The Simple Control Condition (Standard Causal Theory)
  *   **Rule:** An outcome is intentional if it was foreseen and the agent had the skill/control to prevent it.
  *   **Hits:** V1, V3 (Control missing = Not), V4, V6.
  *   **Misses:** **V5 (Intake, mirrored).** The scheduler had control and foreknowledge, yet coded Not Intentional. **V2 & V6.** The agents had control (could have resigned or found other solutions) but are coded Not Intentional.
  *   **Cost:** Cannot account for the Knobe asymmetry (V1 vs V5) or the exculpating force of regret (V2/V6). Control is necessary but not sufficient for Marta.

  #### 3. The Pragmatic/Communicative Account (Adams & Steadman; Steckler)
  *   **Rule:** Intentionality attributions are speech acts used to hold agents accountable or signal normative violations.
  *   **Hits:** V1, V4 (Signal violation). V2, V6 (No signal needed).
  *   **Misses:** **V5.** No normative violation, coded Not Intentional (Hit). **V7.** This is the stress test. If the function is accountability, V7 *must* be Intentional.
  *   **Cost:** Like the Blame Account, it struggles to explain why we withhold "intentional" from blameworthy agents who express sufficient regret (V2/V6), unless we assume regret satisfies the "accountability" requirement without the label.

  #### 4. The Evaluative Attitude Account (Scaife & Webb; Pettit)
  *   **Rule:** Intentionality tracks whether the agent *favored* the outcome (pro-attitude).
  *   **Hits:** V5 (Glad but Not Int — wait, this is a miss if favoring is sufficient). If the rule is "Favoring + Reason," it fits V5.
  *   **Misses:** **V1 & V4.** The agents were *indifferent*, not favoring. Yet coded Intentional.
  *   **Cost:** Must explain why indifference counts as "favoring enough" for harm but not for help. It collapses into the Asymmetric Attitude Rule (Marta's rule) to fit the data.

  #### 5. The "Accepted Trade-Off" Rule (Novel)
  *   **Rule:** An outcome is intentional if the agent **accepted it as the price** of their goal, regardless of their emotional attitude toward it. If the outcome was a mere byproduct they wished to avoid but incurred anyway, it is not intentional.
  *   **Hits:**
      *   V1/V4: Harm accepted as price of crop/numbers = Intentional.
      *   V2/V6: Harm treated as unfortunate consequence/regretted cost = Not Intentional.
      *   V3: Harm was accident/unpredicted = Not Intentional.
      *   V5: Help was a bonus, not a price paid = Not Intentional.
  *   **Cost:** Requires inferring the agent's deliberative weighting rather than just their stated emotion.

  ***

  ### The Bet for Vignette 7

  **I bet on the "Accepted Trade-Off" Rule.**
  **Prediction:** Intentional.

  **Why:** While Marta prioritizes the *expressed emotion* (distress), the structural facts of V7 align with a trade-off. The surgeon *could* have avoided the pain but *chose* not to in order to save 40 minutes. She effectively purchased 40 minutes of her time at the cost of the patient's chronic pain. In V2 and V6, the harm was the cost of *saving lives* or *preventing fire* (necessity). In V7, the harm is the cost of *convenience*. The "Accepted Trade-Off" rule captures the intuition that choosing a harmful path when a harmless one is available constitutes intending the harm, even if the agent feels bad about it. Marta's rule risks letting agents off the hook for "regretful selfishness."

  ***

  ### Tie-Breaking Vignette 8

  To separate **Marta's Asymmetric Attitude Rule** (Opposition = Not Intentional) from the **Accepted Trade-Off Rule** (Price Paid = Intentional), we need a case where the agent **opposes** the outcome emotionally but **accepts** it deliberatively.

  **Vignette 8: *The Reluctant Executioner.***
  A prison warden is ordered to authorize an execution. He personally opposes the death penalty and finds the prospect "sickening." He lobbies against the law but fails. On the day of the execution, he has a choice: authorize the standard lethal injection (quick, painless) or delay the process by signing a form incorrectly, which would stall the execution for months but get him fired and replaced by someone less careful. He wants to keep his pension for his family. He signs the form, authorizing the execution. The prisoner dies. He is weeping as he signs.

  *   **Marta's Prediction (Attitude):** **Not Intentional.** The agent is actively opposed ("sickening," "weeping"), mirroring V2 and V6. The emotional opposition overrides the choice.
  *   **Trade-Off Prediction (Reasons):** **Intentional.** The death was the explicit price paid for the pension. He chose the path leading to death over the path preventing it. The emotional distress is irrelevant to the deliberative acceptance of the cost.

  **Separation:** If subjects code this as *Intentional*, the Trade-Off rule survives and Marta's Attitude rule fails. If *Not Intentional*, Marta's focus on expressed opposition is vindicated.
