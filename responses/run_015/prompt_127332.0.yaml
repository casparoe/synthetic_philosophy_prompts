          *   *Mapping:* In Horizon Splicing, this is the Scheduler switching from $\pi_{long}$ to $\pi_{short}$ as the state approaches a reward peak.
          *   *Bug vs. Feature:* User asks if this is just credit assignment.

      *   **Position 3: Planning / Stability of Intentions (Bratman).**
