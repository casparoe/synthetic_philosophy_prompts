answer: |-
  **Project Title:** The Priority of the Fitting Response: Diagnosing the Wrong Kind of Reasons in Hybrid Value Objects

  **The Question**
  Standard treatments of the Wrong Kind of Reasons (WKR) problem operate on objects where the fitting response is fixed by background agreement: the dangerous is to be feared, the admirable is to be admired. The WKR diagnostic then filters out reasons that bear on the consequences of responding rather than the features of the object (e.g., a demon threatening punishment for failing to admire him is a wrong kind of reason to admire). My project asks a determinate structural question: **Do WKR diagnostics function as a test for determining value, or only as a filter for reasons once the fitting response is already fixed?**

  I hypothesize that for objects with composite or contested value, the diagnostic returns contradictory verdicts depending on which response is selected, revealing that the distinction presupposes the very value judgment it claims to test. If correct, this means Fitting-Attitude accounts cannot use WKR diagnostics to settle disputes about what an object is; they can only filter reasons for an object once we have already decided what it is.

  **Why Existing Distinctions Leave This Open**
  Current distinctions between right and wrong kinds of reasons rely on the "Object vs. State of Affairs" test or the "Features vs. Value" test. These work on standard cases because the fitting response is held constant. They fail on **hybrid value objects** where the appropriate response is part of the dispute.

  Consider a **restored wetland**. Is the fitting response *reverence* (for its wildness) or *approval* (for its design)?
  *   If the fitting response is *reverence*, the reason "it was engineered by humans" is a Wrong Kind of Reason (it undermines the wildness required for reverence).
  *   If the fitting response is *approval*, the reason "it was engineered by humans" is a Right Kind of Reason (it bears on the design features warranting approval).

  The WKR diagnostic does not tell us which response is correct; it merely amplifies the disagreement. This distinguishes the project from my supervisor's diagnosis that this is merely the original problem in new costumes. The original problem assumes the attitude is the anchor; my project shows the anchor is drifting. It also distinguishes the project from the second reader's claim that this is general metanormative indeterminacy. The indeterminacy here is not global; it is a specific structural failure of the WKR tool when the input (the fitting attitude) is unstable. This is not conceptual engineering; it is a stress test of an existing tool's load-bearing capacity.

  **Method and Work Plan (Nine Months)**
  The argument relies on constructing and stress-testing cases where the value profile is genuinely hybrid, not merely ambiguous.

  *   **Months 1–3: Case Construction.** I will finalize three concrete hybrid cases: (1) A **conversational AI** that mimics empathy (fitting response: *trust* vs. *caution*); (2) The **restored wetland** (fitting response: *reverence* vs. *approval*); (3) A **dying craft practice** (fitting response: *preservation* vs. *museum-style admiration*). For each, I will map the competing fitting attitudes and the reasons that switch status (from RKR to WKR) depending on the attitude selected.
  *   **Months 4–6: Diagnostic Stress-Testing.** I will apply the standard WKR diagnostics (the "demon" test, the "features" test) to each case under each competing attitude. I will document where the diagnostics yield contradictory verdicts for the same reason solely based on the shift in attitude. This chapter will demonstrate that the WKR distinction cannot resolve the conflict because it operates downstream of the attitude selection.
  *   **Months 7–9: Synthesis and Implications.** I will evaluate whether the instability is a bug (requiring a revised account of value) or a feature (revealing that value must be fixed prior to reasoning). I will draft the introduction and conclusion to frame this result for the broader debate on Fitting-Attitude accounts.

  **Range of Conclusions**
  1.  **The Priority Thesis (Expected):** WKR diagnostics require a prior settlement of the fitting attitude. This implies Fitting-Attitude accounts cannot explain the *source* of value, only its *consequences*.
  2.  **The Robustness Thesis:** The diagnostics can be refined to select the attitude itself. This would require showing a "master attitude" for hybrid objects that survives the stress test.
  3.  **The Collapse Thesis:** The distinction between right and wrong kinds of reasons cannot be drawn without a determinate fitting-response profile. If the profile is contested, the distinction dissolves.

  The decision between these will turn on whether any standard diagnostic survives the case variations without circularity. If the "features" test requires us to know the value to identify the relevant features, Conclusion 1 or 3 follows.

  **Conditions for Failure**
  The project fails if:
  1.  The case variations turn out to be merely verbal ambiguities rather than normative conflicts (e.g., if "reverence" and "approval" are shown to be the same attitude under different descriptions).
  2.  I demonstrate the instability but cannot show it matters for the broader Fitting-Attitude debate (i.e., if the instability is confined to edge cases that do not threaten standard accounts).
  3.  I cannot articulate a positive alternative to the standard view, leaving the critique as a mere paradox.

  **Scope and Narrowing Strategy**
  Nine months is sufficient for this argument provided the case construction remains tight. The risk is scope creep into general metaethics. If the three cases prove too unwieldy, I will narrow the focus to **artifacts only** (the AI and the Wetland), excluding the craft practice. This preserves the core philosophical tension (design vs. nature, function vs. form) while reducing the expository load. The central claim—that the WKR distinction presupposes the fitting attitude—holds even with two robust cases. This ensures the project remains a unified investigation into the priority of the response, rather than a survey of hybrid values.
