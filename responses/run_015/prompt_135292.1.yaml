      *   *Critique:* Is 9 months realistic?
      *   *Fix:* Emphasize that this is *writing* and *synthesis* of existing philosophical work + case construction, not empirical fieldwork. The narrowing strategy is crucial here.

  6.  **Final Review against constraints:**
