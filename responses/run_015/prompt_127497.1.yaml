          *   *The "Limit" Claim:* "Because only 44% of the variance... is non-genetic, no environmental intervention could move the population mean by more than about sqrt(0.44) ≈ 0.66 standard deviations..."
          *   *Fact Check:* This is **wrong**. This is a subtle but significant error. Heritability describes *current* variance. A *new* environment (one not in the current range) can shift the mean by *any* amount, regardless of current $V_E$. The "maximum shift" logic applies to selection response ($R = h^2 S$) or perhaps prediction accuracy, but not to the potential magnitude of a novel environmental intervention. If you introduce iodine to a deficient population, IQ goes up way more than current $V_E$ suggests. The student is conflating "variance accounted for by current E" with "potential response to a new E."
          *   *Severity:* This undermines the main point of the question (which was inspired by the TA's sister's argument). The TA specifically wants to ensure students don't think $h^2$ limits intervention potential. The student gets the main point right ("high heritability is perfectly compatible with an intervention moving the whole distribution") but then adds a quantitative constraint that contradicts the main point.
          *   *Grading:* This is a conceptual error on the "limits of intervention." It's a "sophisticated-sounding but doesn't follow" error. It contradicts the PKU/Height examples they just gave. (PKU diet changes outcome from "impaired" to "normal," which is a massive shift, potentially many SDs).
          *   *Decision:* Deduct points here. It's a specific claim about intervention limits that is false. 4/5.

      *   **Part (d): Personal Heritability Index**
          *   *Question:* Index = $g_i / P_i$. Average index $\approx h^2$? Explain what's wrong.
          *   *Concept:* Heritability is a population statistic (variance ratio), not an individual proportion. Scale dependence. Mean of ratios $\neq$ ratio of means/variances.
          *   *Student:* 1. Category mistake (population vs individual). 2. Scale dependence (Celsius/Fahrenheit, zero-point blowup). 3. Mean of ratios $\neq$ ratio of variances.
          *   *Assessment:* All three points are correct and well-articulated. The scale argument is particularly strong (ratio scales vs interval scales). The statistical argument (Jensen's inequality essentially) is correct.
          *   *Grading:* 5/5.

