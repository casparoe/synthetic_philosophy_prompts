          *   *Concept:* Heritability $\neq$ Immutable. High $h^2$ compatible with large environmental shifts (PKU, height). GxE correlation (passive/active/evocative) often inflates $h^2$ estimates in twin studies because MZ share environments more if they select them based on genes.
