      *   Why is the student wrong? Assortative mating increases genetic similarity of DZ twins (parents are correlated, so DZ share more than 50% of variance). MZ are already 100%. So $r_{DZ}$ goes up *more* (relative to expectation) than $r_{MZ}$. Gap $(r_{MZ} - r_{DZ})$ shrinks. $A = 2 \times \text{gap}$. So $A$ is underestimated. Student said overestimated.
      *   Is this "course level"? The prompt says "just Falconer's formula and conceptual points." Usually, the conceptual point is "AM violates assumptions." The direction is advanced. However, since they attempted it, it must be graded. It's factually wrong. I will deduct but note it's a subtle point.

