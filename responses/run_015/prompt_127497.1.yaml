      If parents correlate ($m > 0$), DZ genetic correlation becomes $0.5(1+m)$. MZ remains 1.
      $r_{DZ} = 0.5(1+m)h^2 + c^2$.
      $r_{MZ} = h^2 + c^2$.
      Gap = $r_{MZ} - r_{DZ} = h^2 - 0.5(1+m)h^2 = h^2(1 - 0.5 - 0.5m) = h^2(0.5 - 0.5m) = 0.5 h^2 (1-m)$.
