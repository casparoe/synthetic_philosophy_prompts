      *   **Part (a): Falconer's Formula & Spousal Correlation**
          *   *Question:* Compute A, C, E using Falconer. Interpret $h^2$. Comment on spousal correlation ($r_{spouse} = 0.30$).
          *   *Standard Falconer:* $A = 2(r_{MZ} - r_{DZ})$, $C = 2r_{DZ} - r_{MZ}$, $E = 1 - r_{MZ}$.
          *   *Data:* $r_{MZ} = 0.72$, $r_{DZ} = 0.44$.
          *   *Calculations:*
