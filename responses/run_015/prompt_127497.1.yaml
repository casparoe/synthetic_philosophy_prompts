              *   *Student:* "56% of the variance... differences between people... statistically associated with additive genetic differences... in this population, in the range of environments." "Does not mean 56% of any one person's T..." "Doesn't tell you... about population mean."
              *   *Assessment:* Excellent conceptual grasp.
              *   *Extra bit:* Student mentions SNP heritability/GWAS. This is outside course scope ("no formal stats... just Falconer's"), but factually correct. Not a penalty, just extra.
              *   *Extra bit:* "If someone's T is one standard deviation above... expected breeding value is 0.56 SD." This is technically the prediction accuracy ($\sqrt{h^2}$), not $h^2$ itself. $r_{BP} = \sqrt{0.56} \approx 0.75$. The regression of Breeding Value on Phenotype is $h^2$, but the expected *value* in SD units depends on the regression coefficient. Wait, regression of $A$ on $P$ is $b_{A.P} = Cov(A,P)/Var(P) = Var(A)/Var(P) = h^2$. So if $P$ is 1 SD up, expected $A$ is $h^2$ SDs up. So 0.56 SD is actually correct for the *expected breeding value*. (Self-Correction: $P = A + E$. $Cov(A, P) = Var(A)$. $b = Var(A)/Var(P) = h^2$. So $E[A|P] = h^2 \times P$. Yes, 0.56 is correct.)
          *   *Spousal Correlation:* $r_{spouse} = 0.30$. Assortative mating.
              *   *Effect:* Assortative mating increases genetic variance in the population over generations and increases correlation between DZ twins (who share 50% of segregating genes, but if parents are correlated, DZ share more than 50% of *variance* effectively, or rather, the assumption that DZ correlation is $0.5A + C$ is violated).
              *   *Standard Intro Gen/Behavioral Gen Logic:* Assortative mating inflates DZ correlations more than MZ correlations (because MZ are already maxed at 1.0 genetic similarity, while DZ move from 0.5 towards 1.0 depending on the trait correlation between parents). If DZ goes up more than MZ, the gap $(r_{MZ} - r_{DZ})$ shrinks. Falconer's $A = 2 \times \text{gap}$. If gap shrinks, $A$ is *underestimated* by standard Falconer.
              *   *Student's Claim:* "Raises both twin correlations, but it raises the MZ correlation more than the DZ one... gap... gets inflated... estimate comes out too high."
              *   *Fact Check:* This is **wrong**. Assortative mating makes DZ twins more similar genetically than 0.5. MZ twins are already 1.0. Therefore, $r_{DZ}$ increases *proportionally more* (or the gap narrows). If the gap narrows, Falconer's $A$ is an *underestimate*. The student argues the gap inflates and $A$ is an *overestimate*.
              *   *Why?* Student thinks MZ benefits more from assortative mating. But MZ share 100% of genes regardless. DZ share ~50% *if random mating*. With assortative mating, DZ share >50%. So $r_{DZ}$ goes up relative to the random-mating expectation. $r_{MZ}$ also goes up (because population variance increases), but the *difference* $(r_{MZ} - r_{DZ})$ typically decreases.
              *   *Course Level:* Did they teach this? "Just Falconer's formula and conceptual points." Usually, the conceptual point on assortative mating is that it violates the assumption that DZ share 0.5 genetic variance, leading to biased estimates. The direction is the tricky part.
              *   *Verdict:* The calculation is perfect. The interpretation of $h^2$ is perfect. The spousal correlation direction is incorrect (a common misconception, but still incorrect).
