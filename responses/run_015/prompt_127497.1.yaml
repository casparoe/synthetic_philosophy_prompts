              *   $C = 2(0.44) - 0.72 = 0.88 - 0.72 = 0.16$. (Student: 0.16. Correct.)
              *   $E = 1 - 0.72 = 0.28$. (Student: 0.28. Correct.)
              *   Sum: $0.56 + 0.16 + 0.28 = 1.00$. (Student checks this. Correct.)
