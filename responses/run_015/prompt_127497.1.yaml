          *   $SD_A = \sqrt{h^2} SD_P$.
          *   Expected $A$ (in raw units) = $h^2 \times (P - \mu)$.
          *   Expected $A$ (in SD of T units) = $h^2 \times z_P$.
          *   So 0.56 SD of T is correct.
          *   However, often people confuse this with correlation $r_{AP} = \sqrt{h^2}$.
