      So the limit claim is false.
      Confident in the -1 for (c).

      *Final check on Part (d)*:
      Student says "mean of ratios isn't ratio of variances."
      $E[g/P] \neq E[g]/E[P]$ generally, and definitely $\neq Var(g)/Var(P)$.
      This is correct.
      Full marks.

      *Total:* 18/20.
      *Wait, one nuance on Part (a)*: The prompt asks to "comment on whether the spousal correlation... should change your numbers."
      The student says "Yes... 0.56 is an overestimate."
      Since the direction is wrong, they didn't correctly answer "in which direction."
      So -1 is appropriate.

      *Wait, one nuance on Part (c)*: The prompt asks "Would your answer change if there were gene–environment correlation?"
      Student says "It makes the case against the board member stronger."
      This is correct (rGE inflates h2, so if h2 is inflated, the argument against intervention is even weaker).
      The error is only in the "limit" sentence at the end.
      So -1 is appropriate (mostly for the limit claim).

      Okay, ready to write.
answer: |-
  **Total Grade: 18 / 20**

  **Part (a): 4 / 5**
  *   **Calculations:** Correct. $A=0.56, C=0.16, E=0.28$. Sum checks out.
  *   **Interpretation:** Excellent. You correctly identify that $h^2$ refers to variance in differences within a specific population/environment, not individual determination or population means. The regression point (expected breeding value = 0.56 SD) is technically correct ($b_{A.P} = h^2$).
  *   **Spousal Correlation:** You correctly identify that assortative mating violates the random-mating assumption of Falconer's formula. However, you have the **direction of the bias backward**. Assortative mating increases the genetic similarity of DZ twins (who share >50% of variance when parents are correlated) more than it increases MZ similarity (who are already at 100%). This *narrows* the $(r_{MZ} - r_{DZ})$ gap. Since Falconer's $A$ doubles that gap, standard Falconer formulas *underestimate* additive heritability in the presence of positive assortative mating, not overestimate it.
  *   **For Full Marks:** Correctly identify that DZ correlations are inflated relative to MZ correlations under assortative mating, leading to an *underestimate* of $A$. (Note: The GWAS comment was unnecessary but factually correct; no penalty).

  **Part (b): 5 / 5**
  *   **Concept:** Perfect. You correctly state that within-group heritability does not explain between-group mean differences.
  *   **Analogy:** The maize/soil analogy is the standard correct illustration for this concept.
  *   **Evidence:** Correctly identifies common-garden/reciprocal transplant designs as the necessary evidence.
  *   **Pooled Sample:** Correctly explains that pooling increases the total phenotypic variance ($V_P$) via the between-group component, which alters the ratio $V_A/V_P$ unpredictably without knowing the source of the mean difference.
  *   **For Full Marks:** Nothing missing.

  **Part (c): 4 / 5**
  *   **Intervention Logic:** Strong start. You correctly refute the "immutable" claim and use appropriate examples (height, PKU) to show high $h^2$ is compatible with large environmental shifts.
  *   **GxE Correlation:** Correctly note that $rGE$ often inflates twin-based heritability estimates (absorbing environmental similarity into $A$), which strengthens your argument against the board member.
  *   **The "Limit" Claim:** **Incorrect.** You state: *"no environmental intervention could move the population mean by more than about sqrt(0.44) ≈ 0.66 standard deviations."* This is a sophisticated-sounding error. Current environmental *variance* ($V_E$) limits how much individuals differ *now*, but it does not cap the potential shift in the *mean* caused by a novel environmental change not currently present in the population (e.g., eradicating a toxin, introducing a new nutrient). A new environment can shift the mean by many SDs regardless of current $V_E$. This claim contradicts your own PKU example.
  *   **For Full Marks:** Remove the claim that the magnitude of mean shift is bounded by $\sqrt{V_E}$. Acknowledge that while current $V_E$ limits prediction accuracy, it does not limit the potential effect of a new, systematic environmental intervention.

  **Part (d): 5 / 5**
  *   **Category Mistake:** Correctly identify heritability as a population statistic, not an individual proportion.
  *   **Scale Dependence:** Excellent point about ratio scales vs. interval scales (Celsius/Fahrenheit/Zero-point). This is a definitive refutation of the index.
  *   **Statistics:** Correctly note that the mean of ratios is not the ratio of variances.
  *   **For Full Marks:** Nothing missing.

  **Summary Comments for Rubric:**
  *   **Strengths:** You have a very strong conceptual grasp of what heritability is and isn't (Parts b, c, d). Your arithmetic is flawless. You successfully avoided the "individual determination" fallacy.
  *   **Weaknesses:** Two specific conceptual errors prevented a perfect score. First, the direction of bias caused by assortative mating in twin studies (Part a). Second, the belief that current environmental variance places a hard ceiling on the potential magnitude of a novel environmental intervention (Part c). The second error is particularly important given the course context: heritability estimates describe the *status quo*, not the *limits of change*.
