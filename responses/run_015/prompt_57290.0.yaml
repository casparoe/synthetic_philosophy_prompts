answer: |-
  It is a risky gambit for a prize day, but if anyone can pull it off, you can.

  ***

  Good afternoon. It is good to be back in this hall, though I see the heating still works exactly as it did when I was sitting where you are: mostly by accident. [Pause]

  I was told I have eight minutes. I know what that means in teacher time, so I shall be brief.

  You are here to celebrate success. And today, you are also here to say goodbye to something. This is the last year the school is awarding the Character Prize. The decision has been made that schools should teach subjects, not grade souls. I think there is wisdom in that. But because this is the final time, I want to tell you what this prize was trying to catch, and why it is so difficult to hold.

  Over the door of this building, there is a motto carved in stone. *Prove all things and hold fast to that which is good.* It is a King James phrase, old and heavy. But look at the first part. *Prove all things.* It implies testing. It implies that you cannot know what something is until you have pressed on it.

  Imagine you have a glass vase. It is fragile. That fragility is a fact about the glass, even when it is sitting safely on a shelf. Now, imagine you wrap that vase in bubble wrap and put it in a box. You shake the box. You drop the box. The vase does not break. [Pause]

  Did the box change the glass? No. The fragility was still there. It was simply masked. The padding did its job, and the glass remained intact. But if you took the padding away and struck it with a hammer, the truth would show itself.

  Now, imagine a different trick. Imagine a live wire. It is supposed to conduct electricity. But imagine it is rigged so that the moment something touches it, it turns itself off. You touch it to test it, and it becomes safe. The test never happens because the thing itself changes the moment the test begins. [Pause]

  These are two different kinds of hiding. One is padding. The other is a vanishing trick.

  For the last few years, this prize has gone to students who seem unbreakable. Reliable. Calm. Helpful. The recipient today is a Year 10 student who has never lost her temper, never missed a deadline, and never caused trouble. That is a remarkable record. But we must be honest about the conditions.

  School is a box. It is padded. The rules are clear, the adults are watching, and the consequences are mild. For many of you, the good behaviour we reward here is real virtue. But for some, it might be the bubble wrap. You have not been cruel because you have never been truly tempted. You have not failed because you have never been pushed to the edge of your capacity. You are wrapped in cotton wool by families who love you, and by a system designed to keep you safe. [Pause]

  There is nothing wrong with the padding. It keeps you alive. It lets you grow. But do not mistake the padding for the glass. Do not look at your school record and think you know who you are. You do not know what you are made of until the box is opened.

  I say this not to diminish the prize, but to honour the motto. *Prove all things.* If you only ever prove yourself in a sports hall, you have not proved much.

  I know this because I do the same thing in my job. I write about scientists and thinkers. I form confident opinions about them based on press releases and edited transcripts. I am judging the box, not the glass. I am looking at the padding and calling it character. It is a professional hazard, and I am as guilty of it as anyone. [Pause]

  So, to the winner today: accept this award. You have earned it within these walls. Your reliability is real, and it is useful. But take it as a promise, not a verdict. A promise that when you leave this padded room, when the padding is stripped away and the world tests you in ways we cannot simulate here, you will hope to find that the glass holds.

  Some of you will find that your kindness vanishes when you are tired. That is the wire turning off. Some of you will find your courage was always there, just waiting for the padding to be removed.

  The school is stopping this prize because it is hard to tell the difference between the mask and the metal. But you should not stop asking the question. Go out and find the circumstances that reveal you. Do not hide in the box.

  *Prove all things.* And when you have proved them, hold fast to what is good.

  Thank you. [Pause]

  ***

  **Note on the Philosophy**

  I've translated the "fink" into the "live wire" example and the "mask" into the "bubble wrap" analogy. This preserves the core distinction: the mask interferes with manifestation while the property remains intrinsic; the fink involves the property vanishing upon stimulation. A specialist might object that character isn't a simple categorical base like fragility—it's likely a cluster of dispositions, not a single property. They might also argue that "padding" (situational factors) doesn't strictly mask a disposition but rather prevents the triggering conditions entirely, which is technically a different counterfactual analysis than standard masking. I've also smoothed over the issue of whether a virtue exists if never tempted (the "never cruel" case); philosophically, that's the debate between dispositionalism and actualism, which I've sidestepped by framing it as "unknown" rather than "non-existent" to keep the tone constructive.
