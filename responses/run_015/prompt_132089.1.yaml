answer: |-
  ### Specifications for an Account of Obligations to the Dramatized Dead

  To decide this case, the ethical account must satisfy the following six requirements. Each is derived from the specific constraints of your situation (the seal, the screen time, the family rupture).

  **1. The Condition of Posthumous Harm**
  *   **Motivating Case:** The "triple asymmetry." Your father cannot feel pain, but his antecedent interests (in truth, reputation, and how his life's work is understood) can be frustrated. An account that claims the dead cannot be harmed renders your brother's objection incoherent and your sister's defense absolute.
  *   **Status:** **Non-negotiable.**
  *   **Reasoning:** Without this, there is no victim. Harm must be defined not as subjective suffering, but as the violation of interests that survived the subject. If the account cannot establish that a dead man can be wronged by a false record, it fails to address the core conflict.

  **2. The Principle of Epistemic Monopoly**
  *   **Motivating Case:** The twenty-five-year seal. For a generation, the series is not entertainment; it is the primary source material. When a dramatization becomes the *only* accessible record, it borrows the authority of history without the accountability of scholarship.
  *   **Status:** **Non-negotiable.**
  *   **Reasoning:** This distinguishes your father's case from a standard biopic. When the archive is sealed, the screen becomes the archive. The account must recognize that "fiction" changes category when it achieves a monopoly on public memory.

  **3. The Threshold of Identification**
  *   **Motivating Case:** The compressed marriage and the invented line. At what point does "based on" become "misrepresentation"? This addresses whether the character is a vessel for a theme or a representation of a person.
  *   **Status:** **Preference of Temperament.**
  *   **Reasoning:** Reasonable people differ on where the line is drawn. Some accept composite characters as necessary for narrative flow; others demand strict fidelity for named individuals. An account can function regardless of where this line is set, provided it is set consistently.

  **4. The Jurisdiction of Norms**
  *   **Motivating Case:** The 1970s professional context vs. modern dramatic expectations. Your father might have valued the exposure (his norms) but would have rejected the falsification of his professional alarm (his norms).
  *   **Status:** **Non-negotiable.**
  *   **Reasoning:** The account must prioritize the subject's own normative framework regarding their actions, not the audience's modern framework regarding what makes a "good story." To judge him by our standards of drama is to colonize his life; to judge him by his standards of professional integrity is to respect his agency.

  **5. The Efficacy of Remediation**
  *   **Motivating Case:** The proposed disclaimer or archive deposit. Does a caption reading "Some events dramatized" cure the falsification of the alarm-raising scene?
  *   **Status:** **Preference of Temperament.**
  *   **Reasoning:** Some argue a disclaimer shifts the burden of skepticism to the viewer; others argue it is invisible noise against the emotional truth of the image. An account can accept either view, but must acknowledge that remedies operating only on the living (the audience) may not discharge the debt to the dead.

  **6. The Tripartite Weight**
  *   **Motivating Case:** The conflict between the makers' expression, the audience's understanding, and the subject's integrity.
  *   **Status:** **Non-negotiable.**
  *   **Reasoning:** The account must treat all three as genuine moral claims. Dismissing the audience's right to truth reduces the work to private expression; dismissing the makers' rights reduces art to documentation; dismissing the subject's rights reduces a person to a prop.

  ***

  ### Incompatible Pairs

  You suspected that certain duties pull apart. The analysis confirms two critical incompatibilities within these requirements.

  **1. Fidelity to Anticipated Wishes vs. Fidelity to the Archival Record**
  *   **Conflict:** Your father might have welcomed the fame or the dramatic flair (Wishes), but the archive shows he did not say the line and did raise the alarm (Record).
  *   **Verdict:** **Unsatisfiable.** You cannot simultaneously honor what he might have wanted (to be a compelling character) and what he actually was (a specific historical agent). In a standard biography, you choose the Record. In a drama, you often choose the Wishes (interpreted as "he would have wanted a good show"). Under the **Principle of Epistemic Monopoly**, you must choose the Record. This breaks the standard production model.

  **2. Duty to the Subject vs. Epistemic Duty to the Audience**
  *   **Conflict:** Sometimes the truth about a person is confusing, boring, or undermines the thematic point of the disaster (e.g., if his alarm was ambiguous). A clear dramatic lie might help the audience understand the *disaster* better, even if it misrepresents the *man*.
  *   **Verdict:** **Unsatisfiable under Monopoly.** If the series is the only record, you cannot sacrifice the Subject to educate the Audience, because the Audience's education is now permanently tainted. If the series is one of many records, this trade-off is permissible.

  ***

  ### The Dinner Table Exclusion

  The single requirement that excludes the most arguments you are hearing is **The Principle of Epistemic Monopoly.**

  *   **"The dead are not harmed":** Excluded. If the show *is* the record, superseding the truth harms the legacy permanently.
  *   **"The estate's consent settles it":** Excluded. A monopoly on public memory is a public trust, not private property. The estate cannot consent to lie to the public record on behalf of the dead.
  *   **"Artistic licence settles it":** Excluded. Licence is a privilege granted when other records exist. When the archive is sealed, licence becomes censorship of the truth.
  *   **"Only the famous are fair game":** Excluded. The monopoly is created by the seal, not the fame. A minor figure under a seal is functionally equivalent to a major figure in the public sphere.
  *   **"Truth is owed to the audience and never to the subject":** Excluded. Under monopoly, truth to the audience *requires* truth to the subject. You cannot have one without the other.

  ***

  ### Counterfactual Analysis

  **If the dramatization were one among many:**
  The analysis shifts from **Fidelity** to **Non-Malice.** If the archive were open, your father's true record would be available to correct the drama. The obligation would weaken significantly. The producers would owe a duty not to defame maliciously, but they would not owe a duty of strict accuracy. The "second death" would not occur because the first record (the archive) would remain alive and accessible. The rupture in your family would be less critical because the error would be corrigible.

  **If he were a minor figure rather than the subject:**
  This makes the case **harder**, not easier, in this specific context.
  *   *Standard View:* Minor figures attract less scrutiny and thus less duty.
  *   *This Case:* Because the archive is sealed, these eleven minutes are not a fraction of his public legacy; they are the *totality* of it. A protagonist has ten hours to be nuanced; a minor character has one scene to be defined. If that one scene is a distortion, the distortion is absolute. The density of the falsehood is higher. When a minor figure is pulled into a story for professional reasons but depicted acting for personal ones (the marriage compression), the erasure of his actual agency is more complete than if he were the protagonist, whose complexity might be assumed. He is not just misremembered; he is functionally replaced.
