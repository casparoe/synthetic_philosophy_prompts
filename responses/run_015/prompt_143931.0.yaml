answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. The light is fading. Dr. Lena Vasquez and Dr. Marcus Webb sit opposite one another, a printed syllabus for the "Counterfactual Biography" pilot program resting on the table between them.*

  **Dr. Lena Vasquez:** You've read the proposal, Marcus. I see you've annotated the margins. I'm hoping those aren't entirely red ink.

  **Dr. Marcus Webb:** Mostly black, Lena. The red is reserved for things that threaten to burn the discipline down. This curriculum... it is ambitious. I will grant you that. To take a figure like Dietrich Bonhoeffer or Jane Addams and place them beside an algorithmic shadow-self who made the opposite choice? It is striking. But I fear it mistakes the nature of the historical record for a choose-your-own-adventure book.

  **Vasquez:** That is the surface critique. But look deeper at the mechanism. We aren't asking students to choose the adventure. We are asking them to witness the divergence. This is not a departure from tradition; it is a radical refinement of Plutarch. When Plutarch paired Alexander with Caesar, he wasn't suggesting Rome should imitate Macedon. He was constructing a space for *synkrisis*—a comparison intended to calibrate judgment. This curriculum simply updates the second half of the pair. Instead of a different man in a different time, we offer the same man in the same time, with one variable altered: the moral decision.

  **Webb:** But Plutarch was comparing two realities that actually occurred. That is the friction that generates heat. When you substitute the second life with an algorithmic generation, you remove the friction of reality. You are replacing history with speculation. And in doing so, you risk teaching students that morality is a matter of isolated individual choice, divorced from the material conditions that made the choice possible in the first place. If the algorithm holds the conditions "materially identical," as you claim, it is already lying. Conditions are not static backdrops; they are dynamic responses to the agent's actions.

  **Vasquez:** I understand the concern about determinism. But if we only teach the life that happened, we fall into the trap of inevitability. We look at the saint and say, "Of course they did that; look at the outcome." We confuse moral success with historical success. By introducing the counterfactual, we isolate the virtue from the consequence. We force the student to ask: Was the choice right because it worked, or was it right regardless of the outcome? Plutarch wanted us to judge the *virtue*, not the victory. This tool strips away the seduction of the happy ending.

  **Webb:** It strips away the history, Lena. You speak of isolating the virtue, but virtue does not exist in a vacuum. It is embedded in a social fabric. When you generate a Bonhoeffer who does not resist the Nazis, you aren't showing us a moral alternative; you are showing us a different person. The Bonhoeffer we know was constituted by his resistance. To imagine him otherwise is to engage in fiction, not biography. And when you present fiction as a pedagogical mirror of fact, you disable the critical faculty you claim to sharpen. You invite admiration for the "real" version and pity for the "fake" version, rather than analysis of the structures that made resistance so costly.

  **Vasquez:** But isn't that cost exactly what we want them to measure? If the algorithm shows us a Bonhoeffer who collaborates and survives to old age, versus the historical Bonhoeffer who resists and hangs, the student is forced to weigh survival against integrity. That is the triangulation. If we only study the martyr, the lesson is simply "martyrdom is noble." That is hagiography. If we study the martyr alongside the survivor, the lesson becomes "why was this price paid?" It moves the student from imitation to evaluation. Plutarch knew that seeing two lives side-by-side exposes the contours of character that a single life obscures.

  **Webb:** Plutarch also knew that *synkrisis* could be a rhetorical game. He often forced asymmetrical lives into symmetrical molds to make the comparison neat. He smoothed over the jagged edges of history to make the moral lesson land. This curriculum does the same, but with greater arrogance. Plutarch had to work with the messy evidence of two real men. Your curriculum engineers the messiness away. It suggests that moral choices are discrete switches one flips, rather than the culmination of a lifetime of social conditioning, economic pressure, and psychological drift. By focusing on the "moment of decision," you erase the long, slow build that made that decision the only one the subject felt they could make.

  **Vasquez:** I would argue the opposite. By showing that the decision *could* have been otherwise—even if only in a simulation—we restore agency to the historical subject. We refuse to let them become a monument. If we treat the historical figure as inevitable, we turn them into a statue. Statues don't teach ethics; they demand worship. The counterfactual humanizes them. It suggests that they, too, stood at a precipice. It asks the student to step into that moment not to worship the choice, but to understand the weight of it. That is the definition of moral education: not learning what to do, but learning how to weigh.

  **Webb:** But whose weights are we using? The algorithm is trained on existing data, on existing narratives. It will inevitably reproduce the biases of the archives from which it draws. If the archive says a woman's moral failure is emotional and a man's is intellectual, the counterfactual will reflect that. You are outsourcing moral triangulation to a black box. And in a secondary school setting, where students are still developing the ability to distinguish between narrative authority and historical truth, this is dangerous. You are asking them to critique a ghost.

  **Vasquez:** They are critiquing the *relationship* between the ghost and the flesh. That is the point of the exercise. The teacher's role is not to present the counterfactual as truth, but to present it as a provocation. When the student asks, "Why did the algorithm make him cowardly in this version?" the teacher says, "Look at the historical record. What pressures were there? Would cowardice have been structurally easier?" It forces an interrogation of the historical constraints that a standard biography allows them to glide over. In a standard biography, the hero overcomes the obstacle. In this curriculum, the student must analyze why the obstacle existed at all.

  **Webb:** I wish I had your faith in the classroom's ability to maintain that distinction. But consider the legacy of exemplary biography. For centuries, we told stories of great men to inspire virtue. The result was not a more ethical populace, but a more cynical one, or one obsessed with greatness rather than goodness. The problem is the form itself. Biography isolates the individual. It suggests that history is driven by moral choices of singular agents. Your counterfactual doubles down on that individualism. It says, "Here is the person. Here is their choice." It ignores that Bonhoeffer's choice was only possible because of a specific network of confessional churches, a specific theological training, a specific class privilege. If you want moral education, teach the network, not the node.

  **Vasquez:** But students do not live in networks, Marcus. They live in their own skins. They experience morality as a series of individual choices. If we tell them "it's all structural," we absolve them of the very agency we claim to value. Plutarch understood that we need faces to look at. We need narratives to inhabit. The counterfactual biography acknowledges the structural conditions—the prompt specifies they remain identical—but it insists that within those conditions, there is a margin of freedom. That margin is where ethics lives. If we remove the margin because it's hard to model, we teach determinism. And determinism is the enemy of moral responsibility.

  **Webb:** Determinism is the enemy of *blame*, perhaps. But is it the enemy of understanding? If I understand that a man stole bread because the system starved him, I have learned something about justice that I do not learn if I simply ask, "Should he have stolen?" Your curriculum asks, "Should he have stolen?" and then shows a version where he didn't. It frames the moral question as a puzzle of individual will. I want the student to ask, "Why was bread scarce?" The exemplary life, even the paired one, always directs the gaze back to the protagonist. It is a narcissistic form of history.

  **Vasquez:** It is an anthropocentric form of ethics. And ethics must be anthropocentric because humans are the agents of change. I am not suggesting we ignore the structures. I am suggesting that structures are navigated by people. To teach navigation, you must study the navigator. The counterfactual allows us to see the navigator's hand on the wheel. Without it, we just see the path the car took and assume the road forced it there. Plutarch's *Lives* survived not because they were perfect history, but because they were useful tools for thinking about power and character. This proposal seeks to make them useful again, not by copying them, but by hacking their source code.

  **Webb:** And that is where I fear the crash. Hacking the source code of biography turns it into software. It implies that a life is a set of variables that can be tweaked. But a life is a sequence of irreversible commitments. The value of the historical Bonhoeffer is not that he *could* have done otherwise, but that he *did not*, when everything in the world pushed him to. The inevitability is not a bug; it is the feature. It shows us what conviction looks like when it hardens against reality. By softening that reality with a "what if," you dilute the testimony. You turn the martyr into a case study.

  **Vasquez:** I would rather a martyr be a case study than a totem. Totems are silent. Case studies speak. If the counterfactual makes the historical choice feel less inevitable, it makes it more precious. It reminds the student that the virtue was not a property of the man, like his height or his eye color, but an action he took. That distinction is vital. If virtue is intrinsic, you either have it or you don't. If virtue is action, it is something you can practice. Plutarch wanted to create citizens, not fans. This curriculum is designed to do the same.

  **Webb:** Plutarch also wanted to create Greek citizens who understood their subordination to Rome, using the past to make sense of the present. Every biography is a technology of its time. My worry is that this technology serves a present that is obsessed with simulation over engagement. We are already drowning in deepfakes and alternate realities. To bring that into the ethics classroom... it feels like we are teaching them that truth is malleable.

  **Vasquez:** We are teaching them that truth is complex. That is not the same as malleable. The historical record is the anchor. The counterfactual is the wind against the sail. You need both to know where the ship is pointing. If we only have the anchor, we are stuck. If we only have the wind, we are adrift. I am proposing we let them feel the tension.

  **Webb:** Then perhaps the curriculum should not be called "Counterfactual Biography." That implies the biography is the truth and the rest is noise. Call it "Speculative Ethics." Do not claim the authority of the historical record for the algorithm. Let the students know they are stepping out of history to do the thinking, and then stepping back in to judge. If you blur that line, you validate the very post-truth confusion that makes moral education so difficult in the first place.

  **Vasquez:** I can accept that distinction. Transparency about the method is essential. But I stand by the utility of the comparison. If a student leaves the class understanding that moral courage is not the absence of fear, nor the guarantee of success, but the decision to act despite the availability of a safer alternative... then the fiction has served the truth.

  **Webb:** And if they leave understanding that the "safer alternative" was only safer because of privileges they do not possess, and that the "courage" was only possible because of a community we no longer see... then the history has served the justice.

  **Vasquez:** Then it seems the syllabus needs both of us in the room.

  **Webb:** *[Smiling faintly]* It seems it does. Though I shall still be marking those algorithmic sections in red.

  **Vasquez:** And I shall be grading the students on how well they argue with your red ink.
