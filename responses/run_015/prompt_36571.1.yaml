      *   *Philosophical Assessment:* Parfit did introduce prioritarianism (in "Equality or Priority?") largely in response to the leveling-down objection (LDO). The LDO states that strict egalitarianism implies it is in one respect better to make everyone worse off if it reduces inequality (even if no one benefits). Parfit presented prioritarianism as an alternative, not necessarily a "fixed version" of egalitarianism, but as a view that captures the moral intuition behind helping the worse off without the implausible commitment.
