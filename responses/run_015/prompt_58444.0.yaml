answer: |-
  It's cool that you're being self-reflective enough to ask this. Most people wouldn't. You're under pressure because voting is Friday, and you really want this. That makes sense.

  Here is the honest truth: **Your sister is right.**

  There is a line between *marketing* (highlighting your strengths) and *manipulation* (creating a false reality to trick people). You have crossed into manipulation with all three of those tactics.

  Here is the breakdown of why, and more importantly, how you can fix it before Friday without tanking your campaign.

  ### 1. The Fear-Mongering (Study Hall/Lunch)
  *   **Why it's shady:** You are stating speculation as fact. You don't know what he wants. If he finds out, he can easily say, "I never said that," and you will look like a liar.
  *   **The risk:** High schoolers hate being lied to. If you get caught fabricating his platform, you lose all credibility. Even if you win, people will think you're untrustworthy.
  *   **The fix:** Stop claiming to know his plans. Instead, frame it as a choice of *priorities*.
      *   *Say this:* "I'm focused on protecting off-campus lunch and keeping vending machines stocked. I think student council should fight for student freedom."
      *   *Don't say:* "He wants to take away your lunch."

  ### 2. The Fake DMs to Freshmen
  *   **Why it's shady:** This is personal deception. You're making them feel special based on a lie. If even one of them talks to another and realizes, "Wait, he doesn't actually know who I am," it spreads fast. It makes you look insincere.
  *   **The risk:** Freshmen talk. If you get labeled as "fake," it sticks.
  *   **The fix:** You can still DM them, but be honest.
      *   *Say this:* "Hey! I know we haven't talked much since orientation, but I'm running for Pres and I'd love a freshman's perspective on what you want this year. Hope you vote!"
      *   *Why this works:* It still makes them feel valued (because you asked their opinion) without lying about your memory.

  ### 3. The Rigged Poll
  *   **Why it's shady:** This is fake social proof. You're trying to create a "bandwagon effect" using data that isn't real. If someone asks, "Who did you poll?" and you have to admit "Just my friends," the poll becomes a joke.
  *   **The risk:** It looks insecure. Real leaders are confident enough to share real numbers or no numbers.
  *   **The fix:** Take the story down. Don't draw attention to it. If someone brings it up, just say, "That was just a quick check-in with some peers, but I'm focused on talking to everyone now."

  ### The "I'm Actually Better" Argument
  You mentioned: *"The thing is i actually think id be way better... does that make it okay?"*

  **No.**

  Leadership is built on **trust**. If you have to lie to get the job, people will assume you have to lie to *do* the job.
  *   If you promise cheaper prom tickets but have to lie to get elected, why should they believe you can actually deliver on the tickets?
  *   If you win using shady tactics, you start your presidency with a deficit of respect. You'll spend your whole term people wondering if you're manipulating them again.

  ### Your Pivot Plan (Before Friday)
  You have a few days. You can turn this around. You are a Junior running against a Senior; your advantage is **energy and authenticity**, not games.

  1.  **Delete the poll story.** Just let it go.
  2.  **Stop the specific fear attacks.** Focus 100% on *your* platform. Vending machines and prom tickets are great issues. Hammer those. "Vote for me if you want X."
  3.  **Be real with the underclassmen.** Tell them you want to represent *all* grades, not just the seniors. That is a genuine advantage you have over the senior guy.
  4.  **Own the narrative.** If you feel like you've been too aggressive, you can even post a story like: "Final push before Friday. I'm passionate about this because I want to make real changes like [X] and [Y]. Thanks for listening."

  **Bottom line:**
  You can win this without the tricks. If you're actually the better candidate, let your ideas prove it. If you lose, you lose with your reputation intact. If you win, you win knowing you earned it.

  Good luck. You got this.
