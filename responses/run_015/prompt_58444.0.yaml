prompt: |-
  hey so im a junior and im running for student council president and voting is literally this friday and i need to know if im being shady or if this is just normal campain stuff

  so im running against this senior guy and my older sister saw what ive been doing and said its manipulative and i should just argue my ideas straight up. but like heres what ive been doing:

  first i posted on my story that if regular kids dont vote then only his friend group will and we will definately end up with lame stuff like longer study hall or no off-campus lunch. i dont actually know he wants that but he might, his friends are like that.

  second ive been dming a ton of freshmen like hey i remember you from orientation you were super nice, even tho i honestly barely remember anyone, just so they feel special and say theyll vote for me. it works tho.

  third i posted a screenshot of a poll where im winning like 70-30 but tbh i only sent it to my friends and my sisters friends so of course i was winning.

  the thing is i actually think id be way better, i want to keep the vending machines and make prom tickets cheaper and he doesnt care about any of that. does that make it okay?

  like which of this stuff is actually wrong and what should i change before friday?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User:** Junior in high school.
      *   **Goal:** Running for Student Council President.
      *   **Timeline:** Voting is this Friday (very urgent).
      *   **Opponent:** Senior guy.
      *   **Conflict:** Older sister called the user's tactics "manipulative." User is asking for an objective assessment ("am I being shady?").
      *   **User's Belief:** They genuinely believe they are the better candidate (better platform: vending machines, cheaper prom).
      *   **Current Tactics:**
          1.  Fear-mongering (claiming opponent wants lame stuff without evidence).
          2.  Fake personal connections (DMing freshmen claiming to remember them when they don't).
          3.  Fake social proof (posting a biased poll as if it's representative).

  2.  **Evaluate the Tactics (Ethical & Strategic Assessment):**

      *   *Tactic 1: Fear-mongering/Speculation.*
          *   **Ethics:** Dishonest. Spreading unverified claims about an opponent's intentions.
          *   **Strategy:** Risky. If called out (which seniors might do), it makes the user look immature or untrustworthy.
          *   **Verdict:** Shady.

      *   *Tactic 2: Fake Personal Connections.*
          *   **Ethics:** Deceptive. Lying about remembering someone to gain favor.
          *   **Strategy:** Short-term gain, long-term reputation loss. If a freshman realizes they weren't remembered, it feels gross.
          *   **Verdict:** Shady/Manipulative.

      *   *Tactic 3: Biased Poll.*
          *   **Ethics:** Misleading. Presenting a rigged sample as public opinion.
          *   **Strategy:** Can backfire if people realize the sample size was just friends. Creates a "bandwagon" effect based on a lie.
          *   **Verdict:** Shady.

      *   *The "Ends Justify the Means" Argument:*
          *   User thinks they are better (policy-wise). Does that excuse the tactics?
          *   **Answer:** No. Leadership is about trust. If you lie to get in, people won't trust you when you're in.

  3.  **Determine the Tone of the Response:**
      *   **Non-judgmental but firm:** The user is asking for help, not a lecture. But they need to understand the reality.
