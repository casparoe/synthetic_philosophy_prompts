  # PREP SHEET: Rietdijk-Putnam vs. Moving Spotlight
  **Topic:** Extending the RP Argument to kill Moving Spotlight Theory (MST)
  **Goal:** Show MST inherits Presentism's privilege problem without gaining explanatory benefit.

  ---

  ## 1. Anticipated Objections (In Order of Fire)

  ### Objection A: The Metaphysicians (Epistemology vs. Ontology)
  **Who:** The metaphysicians worried about verificationism.
  **They'll say:** *"You're sliding from 'we can't detect the privileged frame' to 'there is no privileged frame.' Lorentzian SR is empirically equivalent to Einsteinian SR. Why is a metaphysically privileged 'now' (or spotlight) ontologically forbidden just because it's empirically hidden?"*
  **Your Reply:** It's not forbidden by logic, but by parsimony. A privileged structure that interacts with nothing physical is occult. If the spotlight's velocity is frame-relative, MST adds a block universe *plus* an undetectable privilege. That's a worse cost than Presentism for less gain (since MST tries to save passage).
  **🚩 Soft Spot:** You can't logically prove verificationism. If they dig in on "metaphysical reality exceeds physical structure," you have no knockout blow, only an appeal to theoretical virtue (parsimony).

  ### Objection B: The Presentists (The "Same Boat" Defense)
  **Who:** The two presentists who know Andromeda.
  **They'll say:** *"Wait, you're arguing against us, but this hurts you too. If MST needs a privileged foliation to define the spotlight's 'position,' doesn't it inherit the exact same Rietdijk-Putnam contradiction we do? Why is our position worse than yours?"*
  **Your Reply:** Because MST claims to accommodate the block universe while saving passage. If the passage requires a privileged foliation, you've conceded the block (defeating Presentism) but kept the ugly privilege. You get the worst of both worlds: the ontological bloat of the block + the arbitrariness of Presentism.
  **🚩 Soft Spot:** If they concede they *already* accept a privileged foliation (neo-Lorentzian presentism), your argument just collapses into "MST is as bad as Presentism," which doesn't kill MST, it just levels the playing field.

  ### Objection C: The GR Expert (The "SR is Fake" Defense)
  **Who:** The GR person.
  **They'll say:** *"This whole debate is artifacts of Minkowski space. In a realistic GR spacetime, there's often no global simultaneity surface at all. Your argument relies on global inertial frames which don't exist. MST can just ride on cosmic time in FLRW metrics."*
  **Your Reply:** RP is a consistency check on the *local* structure of spacetime. If MST fails in SR (the local tangent space of GR), it requires new physics to patch it globally. Relying on FLRW cosmic time makes 'now' contingent on cosmological matter distribution, which is metaphysically weird for 'passage.'
  **🚩 Soft Spot:** This is your weakest physics ground. If they argue that SR is not fundamental, your reliance on SR simultaneity looks like fighting the last war.

  ### Objection D: The Category Error (The "Velocity of Time" Attack)
  **Who:** The sharpest metaphysician in the room.
  **They'll say:** *"You keep talking about the spotlight's 'velocity.' The spotlight doesn't move *through* spacetime like a particle. It indexes a property of 'presentness.' Asking for its frame-relative velocity is a category mistake. It moves at 1 second per second along every worldline."*
  **Your Reply:** If it moves at 1s/s along *every* worldline, you need a rule for synchronizing those worldlines to define a global "now." That synchronization is exactly what RoS destroys. Without it, the spotlight fragments.
  **🚩 Soft Spot:** **DANGER ZONE.** Defining the "speed of passage" is notoriously difficult. If they argue passage is primitive and non-kinematic, your velocity argument looks like a strawman.

  ---

  ## 2. The Prayer Question
  **The Question:** *"Can you define the 'velocity of the spotlight' without presupposing the very temporal metric you're trying to explain? If the spotlight defines time, what does it move relative to?"*
  **Why you pray they skip it:** This attacks the coherence of your central premise. If the "sliding" of the spotlight is metaphorical rather than literal, your argument that it requires a frame-relative velocity ($v$) collapses. You are treating a metaphysical index as a kinematic object. If they pin you on defining $v_{spotlight}$ in coordinate-independent terms, you will stall.

  ---

  ## 3. Honesty Check: Where You Are Vulnerable

  ### What would actually change your mind?
  If someone points you to a formulation of MST that uses **Covariant Becoming**. If there is a way to define the "advancement of the spotlight" using only invariant proper time along worldlines without requiring a global simultaneity slice (e.g., a "fragmentalist" MST), your RP extension fails. Specifically, if **Skow (2009)** or **Fine (2005)** have a defense that decouples "passage" from "global foliation," you need to read it before Tuesday.

  ### Where is the reasoning shakiest?
  **The move from "Relativity of Simultaneity" to "Velocity of the Spotlight."**
  RP works against Presentism because Presentism says *only* simultaneous events exist. MST says *all* events exist, but one set is *privileged*.
  *   **The Gap:** You are assuming the privilege must be defined by a hyperplane of simultaneity that moves. But an MST proponent can argue the privilege is defined by **causal structure** or **entropy gradients**, which are frame-invariant.
  *   **The Risk:** If "now" is defined by local causal cones or thermodynamic arrows rather than SR simultaneity planes, RoS doesn't touch the spotlight. You are assuming MST must use Einstein simultaneity for the spotlight's position. They don't have to.

  ---

  ## 4. Tactical Advice for the Room
  1.  **Don't fight the GR person on cosmology.** Concede that global simultaneity is messy in GR. Pivot back to: "But the *local* special relativity limit still holds. If passage is real, it must be real locally. Does the spotlight slide locally?"
  2.  **Isolate the Presentists.** Make them admit that if they accept a privileged foliation to save Presentism, they are effectively Lorentzians. If they are Lorentzians, ask why MST is worse. (Your goal is to show MST is *redundant*, not necessarily false).
  3.  **Watch the Metaphysicians.** If they say "Ontology > Physics," stop arguing physics. Switch to "Theoretical Virtues." Argue that a theory requiring undetectable structure is bad metaphysics, regardless of physics.

  **Final Note:** Your strongest line is that MST tries to have its cake (Block Universe) and eat it too (Passage). RP shows the "eating it too" part requires the same magic as Presentism. Keep the focus on the **cost of privilege**, not the impossibility of it.
