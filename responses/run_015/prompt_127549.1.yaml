answer: |-
  The practice rests on a hybrid theory that disguises a substantive moral claim within an administrative contract. Formally, the obligation arises from the **receipt of collectively funded transfers**. By claiming, you enter a contract where subsistence is exchanged for compliance. However, the *content* of that compliance—labor rather than, say, community service or training—presupposes the second view: that the **fact of being able to work** creates a normative duty to do so. The third view, **sorting under imperfect information**, is merely the operational justification for the *design* of the rules (logging activities, sanctions), not the source of the duty itself. A state that blamed nobody could use screening mechanisms, but it could not justify demanding labor specifically without invoking the norm that capable adults ought to work.

  Regarding presuppositions versus comfortable accompaniments: A purely incentive- or screening-based justification *could* generate activity logs and sanctions, but it struggles to justify the specific harshness and the private profit element. If the goal were solely screening, unpaid placements would be public "make-work" designed to test willingness without subsidizing private capital; allowing private employers to keep the output presupposes a **disciplinary view of labor** that goes beyond screening. It treats the claimant's time as a resource owed to the economy, not just a signal owed to the state. The exemptions for pensioners and the idle rich do not undermine reciprocity; they define its boundary. Pensioners have prepaid via contributions; the idle rich do not claim. Reciprocity binds only the transaction of claiming. However, the incoherence of treating placements as work for duty but not for wages is not a bug but a feature: it reveals the activity is **ritual submission**, not economic exchange. A purely economic view would demand wages; a purely disciplinary view demands only compliance.

  If rival views substituted the current hybrid:
  1.  **Pure Screening (Benevolent Planner):** Sanctions would be reversible and focused on re-engagement. Hardship relief would be automatic. Unpaid work would never generate private profit, as that distorts the screening signal.
  2.  **Pure Desert (Work Ethic):** Means-testing would vanish. The obligation to work would apply to the idle rich and pensioners alike, as idleness itself is the vice, not the claim on funds.
  3.  **Pure Reciprocity (Insurance):** Benefits would be contributory, based on past tax payments rather than current need. Workfare would be public service (paying back the specific collective pot) rather than private placement.

  The practice cannot survive without the link between money and behavior.

  \answer{Support is contingent on enforced labor market compliance.}
