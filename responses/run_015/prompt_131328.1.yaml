  2.  **Deconstruct the Phrase ("Choice Architecture is Never Neutral"):**
      *   *Origin:* Thaler & Sunstein's *Nudge* theory.
      *   *Core Meaning:* Any arrangement of options influences decision-making. There is no "do nothing" option.
      *   *User's 5 Points:*
          1.  Trivial layout claim (physical necessity).
          2.  Causal claim (behavioral impact).
          3.  Welfare claim (winners/losers).
          4.  Epistemic/signaling claim (norms).
          5.  Sludge vs. Nudge (friction).

  3.  **Drafting the Breakdown (Iterative Process):**

      *   **Claim 1: The Trivial Layout Claim (Physical Necessity)**
          *   *Idea:* You *have* to put food somewhere. You can't have a cafeteria without spatial arrangement.
