          *   *Debate Relevance:* Weak. Just because you *must* arrange it doesn't mean *this specific* arrangement is better. It refutes "do nothing," but not "keep current layout."
          *   *Smuggling:* Used to conflate "inevitable arrangement" with "justified intervention."

      *   **Claim 2: The Causal Claim (Behavioral Impact)**
