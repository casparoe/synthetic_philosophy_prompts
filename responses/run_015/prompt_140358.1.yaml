prompt: |-
  I want a diagnosis of the debate about the doing/allowing distinction, and in particular about its most contested instance, the moral difference between killing and letting die. Not a verdict, and not a survey: I already know the standard positions and the standard cases, and that is partly my problem.

  Here is what I mean by stalled. Both sides agree on the paradigm data. Nearly everyone who thinks there is a distinction thinks the surgeon who cuts up the healthy visitor is doing something worse, and harder to justify, than the official who fails to divert the trolley; nearly everyone who denies the distinction has a stock of matched pairs in which every candidate explanatory difference has been controlled away and the intuitive asymmetry survives anyway. The asymmetry is reported as one of the most robust and cross-culturally widespread moral intuitions we have, and also as one of the hardest to state in a form that does not collapse under the next cleverly engineered case. That combination — maximum intuitive grip, maximum theoretical fragility, decades of clever people, no convergence — is what I want explained.

  I have two hypotheses, which I offer as hypotheses. The first is that this is not one disagreement but three stacked inside one label: a question about where the extension of the distinction falls (which cases count as doing, which as allowing), a separate question about whether falling on one side of that line has any independent moral significance, and a third question about what would explain the significance if it exists — causation, counterfactual dependence, the agent's intentions, the rights of the patient, the cost to the agent, what the agent's will expresses about her character. My suspicion is that the most famous exchanges look like failures of argument but are actually participants answering different questions from this list, and that a paper which settles one of them is read as having failed to settle the others. If that is right, I would like the three questions prised apart and told which of them is actually load-bearing.

  The second hypothesis concerns the extensional question, and this is where I would like you to work hardest. I think a large family of cases shows that the extension of the distinction is hostage to something that looks morally inert. Consider a matched pair. In the first, a patient's infusion pump is built to shut off at a fixed time unless a nurse resets it; a nurse who wants the patient dead does nothing, the pump stops, the patient dies. In the second, a structurally identical pump is built to run continuously unless someone presses a stop button; a structurally identical nurse with the same motive presses it at the same moment, and the patient dies. Hold fixed what each agent foresees, what each desires, the certainty of the outcome, the triviality of the cost of preventing it, and the causal sequence from that moment on. The only remaining difference is which physical state of the device is its resting state — which state it occupies if nobody does anything. Call these default-flip pairs, and note how many real cases have this shape: do-not-resuscitate orders and their inverse, fail-safe versus fail-deadly engineering, opt-out versus opt-in consent regimes, the difference between a life-support machine the hospital switches off and one it declines to restart.

  If the doing/allowing verdict flips on that difference alone, then either the distinction is tracking something far thinner than its defenders claim — an artifact of engineering convention, institutional default, or statistical normality — or it is tracking something real about baselines and intervention, and the defender should say what that is and why a designer's choice of default can carry moral weight. There is a third possibility: the moral bookkeeping is being done at the wrong time, and the real doing happened earlier, at the point where someone chose the default, which would make the distinction an artifact of looking at a single time slice of a longer agency. And there is a fourth: these cases reveal that the distinction has no stable extension at all, only a family of dimensions along which cases grade continuously, so that the appearance of a binary line is an artifact of the paradigm cases.

  I would also like you to test the normative question against aggregation. Ten thousand agents each fail to send a cheap text message, and ten thousand distinguishable strangers die, one per agent; one agent kills ten thousand. Where does the distinction go when the omissions are collected and the killings are collected? My sense is that the answer depends on whether the asymmetry is being understood as an agent-relative constraint on what each of us may do, which resists aggregation, or as a claim about how bad outcomes are, which does not — and that these are different questions being asked under one heading.

  So: is this a verbal dispute, a substantive one, several substantive ones with a shared name, a distinction that is real but doing pluralistic and ineliminable work, or an ill-posed question that has survived because it is useful in law, medicine, and moral psychology for reasons independent of its philosophical defensibility? Is there a hidden empirical question doing the work — about the provenance of the intuition, about whether verdicts in default-flip pairs really do flip, about whether the distinction's extension is learned from local institutional practice — and if so, would answering it settle anything or only relocate the argument? I want the diagnosis argued from what each side actually claims and from the case families above rather than asserted, and I want you to say what, given your diagnosis, would count as progress: a distinction that dissolves one of the three questions, a no-go result showing that no assignment of cases to doing and allowing can satisfy the desiderata both sides accept, an experiment on default-flip pairs, a replacement taxonomy, or an argument that no progress should be expected and that the trench warfare is the appropriate response to the question.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Deconstruct the Request:**

      *   **Topic:** The doing/allowing distinction, specifically killing vs. letting die.
      *   **Constraint 1:** No verdict (don't say which side is right).
      *   **Constraint 2:** No survey (don't just list standard positions/cases like Foot, Thomson, Quinn, etc., as the user knows them).
      *   **Core Problem:** The debate is "stalled." High intuitive grip + high theoretical fragility + no convergence despite decades of work.
      *   **User's Hypothesis 1:** It's actually *three* stacked questions (Extension, Normative Significance, Explanation) being conflated. Need to prise them apart and identify the load-bearing one.
      *   **User's Hypothesis 2:** The *extension* is hostage to morally inert factors (default-flip pairs: pump stops vs. pump runs, opt-in vs. opt-out). Need to work hardest here. Analyze the implications (artifact of convention vs. baselines vs. earlier agency vs. continuous dimensions).
      *   **Additional Test:** Aggregation (10k omissions vs. 1 killing). Distinguish agent-relative constraints vs. outcome badness.
      *   **Goal:** A diagnosis of *why* the debate is stalled. Is it verbal? Substantive but pluralistic? Ill-posed but useful? Empirical?
      *   **Requirement:** Say what would count as *progress* based on the diagnosis.
      *   **Tone:** Analytical, rigorous, philosophical, avoiding standard textbook summaries.

  2.  **Analyze Hypothesis 1 (The Three Questions):**

      *   *Question A (Extension):* What counts as doing vs. allowing? (The metaphysics/semantics of action).
      *   *Question B (Normativity):* Does the distinction *matter* morally? (The ethical weight).
      *   *Question C (Explanation):* *Why* does it matter? (Rights, causation, intentions, etc.).
      *   *Diagnosis:* The user is likely right that conflation causes the stall. Defenders of the distinction often argue from Extension (intuitions about cases) to Normativity, while critics attack Explanation (showing causation/intention doesn't align) to deny Normativity.
      *   *Load-bearing:* It's almost certainly Question B (Normativity). If the answer to B is "No independent weight," A and C become irrelevant. If B is "Yes," then A becomes critical. The stall happens because people fight over A (cases) to settle B, without agreeing on the link between A and B.

  3.  **Analyze Hypothesis 2 (Default-Flip Pairs):**

      *   *The Case:* Pump stops unless reset (omission) vs. Pump runs unless stopped (commission). Same outcome, same intent, same causal chain from the decision point.
      *   *The Problem:* If the moral verdict flips based on the machine's default state, the distinction tracks *convention* or *engineering design*, not deep moral reality.
      *   *Implication 1 (Artifact):* The distinction is morally shallow. It tracks statistical normality or legal baselines.
      *   *Implication 2 (Baselines):* Maybe baselines *are* morally relevant (expectations, entitlements). But who sets the baseline?
      *   *Implication 3 (Earlier Agency):* The "doing" happened when the default was set. The current agent is just inheriting a moral situation. This shifts the locus of evaluation.
      *   *Implication 4 (Continuum):* There is no binary line.
      *   *Diagnosis:* This is the strongest evidence for the "stall." It shows the *Extension* is unstable. If Extension is unstable, Normativity cannot rest on it securely. This suggests the distinction is not a natural kind but a *functional tool* dependent on context.

  4.  **Analyze the Aggregation Test:**

      *   *Scenario:* 10k omissions (1 death each) vs. 1 commission (10k deaths).
      *   *Conflict:* Agent-relative constraints (I shouldn't kill) resist aggregation. Outcome-based views (10k deaths is worse) demand aggregation.
      *   *Diagnosis:* This confirms the suspicion that "Normative Significance" is actually two different questions: (1) Is the *act* worse? (2) Is the *outcome* worse? The debate stalls because one side talks about agent integrity/constraints, the other about victim welfare/outcomes.

  5.  **Synthesize the Diagnosis:**

      *   *The Core Issue:* The debate is stalled because it treats a *multi-dimensional functional heuristic* as a *binary metaphysical fact*.
      *   *The Conflation:* Participants treat the Extension (A) as the ground for the Normativity (B), but the Extension is context-dependent (default-flips), and the Normativity is split between agent-constraints and outcome-evaluation (aggregation).
      *   *The "Hidden" Empirical Question:* It's not just about intuition provenance; it's about *baseline setting*. Who has the authority to set the default? That's a political/legal question disguised as a metaphysical one.
      *   *Verdict on the Debate:* It is not merely verbal, but it is *categorally confused*. It tries to solve a normative problem (B) using a descriptive tool (A) that is itself normatively loaded (defaults).

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. State the thesis: The stall is due to a category error regarding the *function* of the distinction.
      *   *Section 1: Prising Apart the Three Questions (Hypothesis 1).*
          *   Confirm the user's suspicion.
          *   Identify the load-bearing question: Normativity (B).
          *   Explain why Extension (A) fails to support it (due to Hypothesis 2).
          *   Explain why Explanation (C) is often a post-hoc rationalization.
      *   *Section 2: The Default-Flip Problem (Hypothesis 2).*
          *   This needs the most work.
          *   Analyze the "morally inert" factor. It's not inert; it's *normatively loaded prior to the act*.
          *   Discuss the "Earlier Agency" option. This is crucial. The moral weight shifts to the *institution* or *designer*.
          *   Conclusion on this point: The distinction is not about the *act* but about the *context of entitlement*.
      *   *Section 3: The Aggregation Test.*
          *   Show how this splits the Normative question.
          *   Agent-relative constraint vs. Impartial outcome.
          *   This explains why critics (consequentialists) and defenders (deontologists) talk past each other.
      *   *Section 4: The Diagnosis.*
          *   Is it verbal? No.
          *   Is it substantive? Yes, but pluralistic.
          *   Is it ill-posed? Yes, in its current binary form.
          *   It is a *proxy* for disputes about entitlements and baselines.
      *   *Section 5: What Counts as Progress?*
          *   Not a new case. Not a new intuition pump.
          *   Progress = Acknowledging the distinction is *derivative*, not *foundational*.
          *   Progress = Shifting focus to "Baseline Justification."
          *   Progress = Accepting a multi-dimensional taxonomy instead of a binary.

  7.  **Refining the Argument (Self-Correction during drafting):**

      *   *Check:* Did I avoid giving a verdict on whether killing is worse than letting die? *Yes.* I am diagnosing the debate, not joining it.
      *   *Check:* Did I address the "default-flip" deeply? *Yes,* need to emphasize that the "inert" physical state is actually a crystallized prior moral decision.
      *   *Check:* Did I address the aggregation point? *Yes,* link it to the agent-relative vs. outcome distinction.
      *   *Tone Check:* Ensure it sounds like a philosophical diagnosis, not a textbook summary. Use terms like "normative load," "baseline entitlement," "category error."

  8.  **Final Polish:** Ensure the structure matches the user's specific requests (Hypothesis 1, Hypothesis 2, Aggregation, Diagnosis, Progress). Make sure the "load-bearing" question is clearly identified. (It is the Normative one, but specifically *which kind* of normativity).

      *   *Key Insight:* The "doing/allowing" distinction is often a placeholder for "violation of negative right" vs. "failure to fulfill positive right." The default-flip cases show that what counts as negative/positive depends on institutional setup. Therefore, the debate is actually about *institutional legitimacy*, not individual action metaphysics.

      *   *Progress:* A "no-go" result for the binary metaphysical view. A shift to "Baseline Ethics."

  9.  (Final Review against constraints): No survey of Foot/Quinn/etc. No verdict on the morality of killing. Focus on the *structure of the disagreement*.

      *   *Okay, ready to write.*
answer: |-
  Your diagnosis of the stalemate is precise: the debate persists not because the data is ambiguous, but because the conceptual machinery is trying to do too many different jobs at once. The "doing/allowing" distinction is treated as a single philosophical tool, but it is actually a composite of metaphysical, normative, and explanatory claims that come apart under pressure.

  Here is the diagnosis of the stalemate, structured around your two hypotheses and the aggregation test, followed by a determination of what would count as progress.

  ### 1. Prising Apart the Three Questions (Hypothesis 1)

  You are correct that the debate conflates three distinct inquiries. The stalemate arises because participants treat a settlement on one as a settlement on all.

  1.  **The Extension Question (Metaphysical/Semantic):** What are the truth conditions for "X did Y" vs. "X allowed Y"? Is it causal intervention? Counterfactual dependence? Volitional movement?
  2.  **The Normative Question (Ethical):** Does falling on one side of that extension line carry independent moral weight? (i.e., Is killing *intrinsically* harder to justify than letting die, ceteris paribus?)
  3.  **The Explanatory Question (Foundational):** If there is weight, what bears it? (Rights, intentions, causation, agency?)

  **The Load-Bearing Question:**
  The load-bearing question is **The Normative Question**.

  The debate stalls because defenders of the distinction often argue from *Extension* (intuitions about specific cases) to *Normativity*, while critics argue from *Explanation* (the lack of a consistent metaphysical ground) to deny *Normativity*.

  *   **Defenders** say: "Your intuition in the Trolley case shows there is a normative difference."
  *   **Critics** say: "Your inability to define 'doing' without circularity in the Pump cases shows there is no metaphysical ground, therefore no normative difference."

  This is a non-sequitur on both sides. One can have a stable normative distinction with a fuzzy extension (e.g., "cruelty"), and one can have a precise metaphysical distinction with no normative weight (e.g., "wearing blue"). The stalemate persists because both sides assume that if the *Extension* is unstable (as your default-flip pairs suggest), the *Normativity* must collapse.

  However, the Normative Question is itself ambiguous. It asks: "Is the act worse?" But this hides a further split: Is it worse *for the agent* (a constraint on agency) or worse *for the world* (a state of affairs)? This ambiguity is what the aggregation test exposes.

  ### 2. The Default-Flip Problem (Hypothesis 2)

  This is the critical failure point for the Extension Question, and it explains the theoretical fragility you noted.

  In the pump cases (stop unless reset vs. run unless stopped), the physical difference is indeed morally inert *in isolation*. A switch position is not a moral category. If the verdict flips based solely on this, the distinction is tracking **conventional baselines**, not natural kinds of action.

  There are four interpretations of this, and the debate stalls because participants silently oscillate between them:

  1.  **The Artifact View:** The distinction is morally shallow. It tracks statistical normality or engineering convention. (This leads to nihilism about the distinction).
  2.  **The Baseline View:** The distinction tracks *entitlements*. The "default" state represents what the patient is entitled to expect. If the pump defaults to "off," the patient has no claim to the flow; if "on," they do. (This makes the distinction real but derivative of prior rights assignments).
  3.  **The Earlier Agency View:** The moral "doing" occurred when the default was set. The nurse is merely inheriting a moral situation created by the hospital, the manufacturer, or the legislature. (This shifts the locus of evaluation from the individual act to the institutional structure).
  4.  **The Continuum View:** There is no binary line. "Doing" and "Allowing" are poles on a spectrum of causal involvement and normative expectation.

  **Diagnosis of the Stall:**
  The debate is stalled because the **Extension Question is hostage to the Baseline View**, but participants argue as if they are discussing the **Artifact View**.

  When a defender says, "Turning off the machine is killing," and a critic says, "Not turning it on is letting die," they are not disagreeing about the physics of the switch. They are disagreeing about *who had the authority to set the default*. The "morally inert" physical state is actually a crystallized prior moral decision.

  Therefore, the doing/allowing distinction is not a tool for evaluating the *immediate act*; it is a proxy for evaluating the *legitimacy of the background expectations*. The stalemate exists because philosophers are trying to solve a problem of **institutional legitimacy** (who sets the baseline?) using a vocabulary of **individual action metaphysics** (did he move his hand?).

  The "maximum intuitive grip" comes from paradigm cases where the baseline is uncontroversial (a healthy visitor has a right not to be cut). The "maximum theoretical fragility" comes from cases where the baseline is contested (does a patient have a right to continuous ventilation?). The intuition survives because we are sensing the baseline dispute, not the action distinction.

  ### 3. The Aggregation Test

  Your aggregation test (10,000 omissions vs. 1 killing of 10,000) confirms that the **Normative Question** is actually two different questions masquerading as one.

  *   **Interpretation A (Agent-Relative Constraint):** "I am forbidden to kill." This resists aggregation. 10,000 agents each omitting to save is 10,000 minor failures (or perhaps no failures, if there is no duty to save). 1 agent killing 10,000 is a monumental violation. The distinction holds firmly here.
  *   **Interpretation B (Impartial Outcome):** "10,000 deaths is worse than 1 death." This demands aggregation. If the outcome is what matters, the distinction between doing and allowing collapses under the weight of the body count.

  **Diagnosis:**
  The debate stalls because Defenders are usually arguing for Interpretation A (the integrity of the agent, the constraint against violation), while Critics are arguing against Interpretation B (the badness of the outcome).

  *   The Critic says: "How can 10,000 deaths be less bad than 1?" (Attacking Outcome Badness).
  *   The Defender says: "How can I be permitted to violate a right to prevent violations?" (Defending Agent Constraints).

  They are not disagreeing about the facts; they are disagreeing about the *locus of moral evaluation*. The label "doing/allowing" is being used to cover both the *constraint on the agent* and the *status of the victim*. When these come apart in aggregation cases, the single label fractures.

  ### 4. Overall Diagnosis: What Kind of Dispute Is This?

  This is not a verbal dispute, nor is it a single substantive dispute. It is a **category error regarding the function of the distinction.**

  The doing/allowing distinction is treated as a **foundational metaphysical truth** that generates normative force.
  In reality, it is a **derivative heuristic** that summarizes prior normative commitments about baselines and entitlements.

  *   **Is it ill-posed?** Yes, in its current binary form. It asks for a metaphysical line where there is only a normative gradient.
  *   **Is it useful?** Yes, but not for the reasons philosophers claim. It is useful in law and medicine because those fields *set the baselines*. In law, the statute defines the default. In medicine, the standard of care defines the default. The distinction works there because the "inert" factors (institutional rules) are fixed. In philosophy, where baselines are contested, the distinction wobbles.
  *   **Is there a hidden empirical question?** Yes. It is not about the provenance of intuition, but about **baseline sensitivity**. If you tested subjects on default-flip pairs, you would likely find that verdicts flip *unless* the subject perceives the default as "unnatural" or "manipulated." The empirical work would show that the intuition tracks *perceived legitimacy of the setup*, not the physics of the act. Answering this would not settle the normative debate, but it would relocate it to the justification of defaults.

  ### 5. What Counts as Progress?

  Given this diagnosis, standard philosophical moves (new cases, refined definitions of causation) will not work. They are treating the symptom, not the disease. Progress requires one of the following four shifts:

  1.  **A No-Go Result for the Binary:** A formal demonstration that no assignment of cases to "doing" and "allowing" can satisfy the desiderata of both stability (across default-flips) and normative significance (across aggregation). This would force the abandonment of the binary taxonomy.
  2.  **Baseline Justification Theory:** A shift in focus from the *act* to the *setup*. Progress would look like a theory that explains when a default state (pump runs vs. pump stops) is morally legitimate. If we can justify the baseline, the doing/allowing verdict follows automatically. The distinction becomes a downstream output, not an upstream input.
  3.  **Splitting the Normative Question:** Explicitly separating the **Agent-Relative Constraint** (where the distinction is robust but non-aggregating) from the **Outcome Evaluation** (where the distinction collapses). A paper that successfully argues "The distinction matters for rights-violation but not for outcome-ranking" would dissolve much of the trench warfare.
  4.  **Replacement Taxonomy:** Moving from "Doing vs. Allowing" to a multi-dimensional vector: *Causal Intervention, Normative Expectation, Agent Intent, and Cost of Prevention.* Progress would be a model that predicts moral verdicts based on the weighting of these dimensions, acknowledging that "doing" is just a cluster concept that sometimes correlates with wrongness but does not constitute it.

  **Recommendation:**
  The most productive path is **#2 (Baseline Justification)**. The "default-flip" cases reveal that the moral weight lies in the *choice of the default*, not the *deviation from it*. The debate is stalled because it focuses on the deviation (the nurse's act) while ignoring the source of the norm (the hospital's policy).

  If you treat the doing/allowing distinction as a **proxy for disputed entitlements**, the stalemate dissolves. The question is no longer "Is killing worse than letting die?" but "Who had the right to set the pump to 'stop'?" That is a harder political and institutional question, but it is the one the cases are actually asking. The philosophical debate has stalled because it tries to answer that institutional question using individual metaphysics. Progress requires admitting that the distinction is not about the agent's relation to the victim, but about the institution's relation to the baseline.
