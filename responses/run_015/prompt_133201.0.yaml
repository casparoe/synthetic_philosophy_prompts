answer: |-
  Based on the record provided, your colleague operates as a **Nietzschean Instrumentalist**. Her implicit rule is that historical practice is valid *only* insofar as it functions as a lever for present vitality—either by inspiring action (Monumental) or breaking chains of injustice (Critical). She rejects history that functions as a tomb (Antiquarian preservation without purpose) or a narcotic (Aesthetic immersion without political aim).

  Here is the analysis of how she would read the AI-assisted reconstruction project, the analogs from her record, and the follow-up case required to isolate her true criterion.

  ### 1. Diagnosis of the AI Project
  She would likely read this project as a **Category Error** (specifically, a life-draining Antiquarianism masquerading as Critical history).

  *   **Why:** While the project recovers "excluded voices" (which sounds Critical), it explicitly disavows a "present reformist agenda." To your colleague, recovering voices without leveraging them for present change is not justice; it is hoarding. It mirrors her condemnation of the **immersive reenactment**: both offer granular, affective access to the past ("inhabit their ancestors' daily lives" vs. "emotional intensity") but lack a "present political aim." She explicitly described such history as that which "drains rather than activates life."
  *   **Nietzschean Frame:** She views this as **Antiquarianism** (preserving the past for its own sake) disguised as **Critical** history. Because it refuses the *act* of criticism (reform), it fails the test of "serving life."

  ### 2. Closest Analog in Prior Verdicts
  The closest analog is the **immersive historical reenactment of past suffering**.

  *   **Similarities:** Both prioritize *experiential granularity* (inhabiting lives/emotional intensity) over *narrative utility*. Both explicitly lack a *present political aim*.
  *   **Verdict:** She condemned the reenactment for draining life. She will likely condemn the AI project for the same reason: it generates empathy or knowledge without converting that energy into present agency.
  *   **Secondary Analog:** The **archive of a dead industry**. Like the archive, the AI project prioritizes "granular detail" and "fragmentary records" over the "streamlined narrative" she endorses. She rejected the archive for having "no guiding narrative"; the AI project similarly lacks a guiding *political* narrative.

  ### 3. Plausible Rules and Predictions
  There are two competing hypotheses for her underlying logic. Here is what each predicts for the AI project:

  *   **Hypothesis A: Instrumental Orientation (The "Lever" Rule)**
      *   *Rule:* History is good if it produces present political/moral action; bad if it does not.
      *   *Prediction:* **Reject.** The AI project explicitly lacks a reformist agenda. Therefore, it fails to activate life, regardless of whose voices are recovered.
  *   **Hypothesis B: Inclusive Recovery (The "Voice" Rule)**
      *   *Rule:* History is good if it expands the moral imagination by recovering marginalized perspectives; bad if it reinforces exclusion.
      *   *Prediction:* **Accept.** The project recovers "erased personal narratives" and "excluded voices." This aligns with her approval of demolishing exclusionary myths, assuming she values the *content* (inclusion) over the *function* (action).

  *Given her condemnation of the reenactment (which likely had emotional/moral weight but no aim), Hypothesis A is the stronger fit.*

  ### 4. The Follow-Up Case
  To definitively reveal whether her criterion is **Instrumental Orientation** (ends-based) or **Formal Mode** (means-based), propose the following variation:

  **The Case:** The *same* AI-reconstructed narratives are deployed explicitly as **evidentiary support for a present reparations bill**, framing the granular details of daily life as proof of systemic expropriation requiring material redress.

  **What This Reveals:**
  *   **If she Endorses it:** Her criterion is **Instrumental Orientation**. The addition of a "present political aim" (reparations) redeems the "granular/archival" method. It proves she objected to the *lack of action* in the original proposal, not the *method of recovery*.
  *   **If she Rejects it:** Her criterion is **Formal Mode** (specifically, **Narrative Streamlining**). She may argue that "granular detail" and "inhabiting ancestors" are inherently antiquarian or draining forms, even when used for justice. She prefers the "streamlined civic narrative" (Verdict 1) over "fragmentary records" (AI Project). This would reveal that she values **political efficiency** (history as a clear tool) over **historical texture** (history as complex experience), viewing the latter as an obstacle to action even when the cause is just.

  **Summary:** She is likely to reject the initial AI project as a category error (Antiquarianism without reverence, Critical history without action). The reparations follow-up will tell you if she believes *any* history can serve life if the cause is just (Instrumental), or if only *streamlined* history can serve life, regardless of the cause (Formal).
