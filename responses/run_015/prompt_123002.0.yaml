prompt: |-
  I'm taking an upper-division metaphysics course this term, and we've spent the last two weeks on fatalism—specifically the classic Damascus narrative in which a man, told he will meet Death in Damascus, flees to Samarra and finds Death waiting there with an appointment for him all along. Our instructor kept pressing the distinction between epistemic foreknowledge and logical or metaphysical necessity, but several students in the seminar kept treating the story as if it were a cautionary tale about poor itinerary planning rather than a paradox about the efficacy of evasion. To clarify my own thinking, I'd like you to write a sustained satirical piece in the form of a deadpan, official embassy travel advisory and security briefing for visitors to Damascus—approximately 600 words, formatted with numbered bureaucratic sections and sub-clauses. The voice should be that of an over-formal government memo that takes fatalist logic with absolute literal seriousness: include invented regulations such as a "Counterfactual Evasion Permit," a "Foreknowledge Disclosure Form," and a "Modal Itinerary Review," with dedicated sections on "Avoidance Protocols," "The Samarra Contingency," and "Visitor Liability for Self-Defeating Flight." The satire should exaggerate real philosophical features—particularly the conflation of knowing the future with the future being unavoidable, and the way fleeing one location can inadvertently satisfy the very prediction one sought to escape—so that a reader familiar with the fatalism debate recognizes the logic being pushed to absurdity, while the document remains readable as a straight-faced advisory with no winking or breaking of character. Please do not include bibliographies, citations, reading lists, or references to named living scholars; invented officials and regulations are welcome. End your response with a one-sentence summary on its own line stating the advisory's core recommendation for travelers.
