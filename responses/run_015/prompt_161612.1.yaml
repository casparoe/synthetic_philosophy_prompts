answer: |-
  To: The Reparations Review Board
  From: Philosophical Consultant
  Re: Draft Reasoning for Decision [Case 6: The College Endowment]

  Colleagues,

  You have asked me to distill the Board's jurisprudence into coherent principles and apply them to the College Endowment case. While the enabling statute grants us broad discretion ("such remedy as is apt"), our legitimacy rests on the consistency of our reasoning. Below, I set out the doctrinal rules implicit in our first five decisions, apply them to the claims at hand, and offer a recommendation that preserves the Board's integrity.

  ### I. The Rules of the Board

  Based on the five precedents, the following three rules best explain our track record. They balance the moral gravity of the injustice with the practical limits of juridical repair.

  **1. The Subject Rule (Standing)**
  *Claims inhere in the subject of the injury, not necessarily in their biological descendants.*
  *   **Derivation:** In *Sterilization* (Case 1), the injury was to a *person*, so the claim died with her. In *Cession* (Case 2), *Urban Renewal* (Case 3), and *Schooling* (Case 5), the injury was to a *people, community, or class*, so the claim survives in their recognized collective representative (Council or Trust).
  *   **Corollary:** A collective claim is not an aggregate of individual claims. Individual descendants cannot claim shares of a collective remedy (*Cession*), and non-descendant residents cannot claim for historical displacement (*Urban Renewal*).

  **2. The Retention Rule (Liability)**
  *Liability requires a present juridical person who either committed the wrong or currently holds the specific advantage gained from it.*
  *   **Derivation:** In *Sterilization*, *Cession*, and *Schooling*, the Province (the wrongdoer) still exists. In *Urban Renewal*, the Province likely paid the Trust (as the wrongdoer), despite private ownership of the land. In *Private Company* (Case 4), the claim failed because the wrongdoer was dissolved *and* the advantage was dispersed among dead shareholders ("no present holder").
  *   **Implication:** If a specific advantage (land, endowment, capital) is identifiable and held by a living legal person, that person is liable to disgorge it, even if they were not the original wrongdoer (distinguishing Case 4).

  **3. The Specificity Rule (Measurement and Discharge)**
  *Remedies must be tailored to the nature of the injury, and discharge requires a remedy the claimant is free to refuse.*
  *   **Derivation:** Measurement varies by the ongoing relationship: where the Province still holds the land (*Cession*), remedy is based on *present condition* (annuity); where the link is broken (*Urban Renewal*), it is based on *value lost* (lump sum). Crucially, regarding discharge (*Schooling*), general benefits of citizenship or unsolicited gestures do not extinguish a claim. A claim is discharged only by a specific remedy addressed to the wrong, which the claimant accepts.

  ---

  ### II. Application to the New Case

  Applying these rules to the three requests from the Community Council:

  **1. The Forty-Hectare Parcel (Burial Ground)**
  *   **Prediction:** **Award.**
  *   **Reasoning:** Under the **Retention Rule**, the College holds the specific asset (the land). Under the **Subject Rule**, the Council represents the injured people. The specific nature of the asset (a burial ground) allows for specific restitution rather than mere compensation. The College's status as a "beneficiary" does not immunize it under the Retention Rule, provided it holds the advantage.

  **2. The Perpetual Annuity to the Council**
  *   **Prediction:** **Award.**
  *   **Prediction:** **Award.**
  *   **Reasoning:** The College retains the financial advantage (rents/endowment). Under the **Specificity Rule** (drawing on *Cession*), where the asset is held and the community is ongoing, an annuity sized by present need is the apt remedy. The College's argument that "general scholarships" discharge this claim fails under the *Schooling* precedent: unsolicited benefits do not discharge specific wrongs.

  **3. The Per Capita Payments to Descendants**
  *   **Prediction:** **Dismiss.**
  *   **Reasoning:** Under the **Subject Rule**, the injury was to the *people* (the signatories and their community), not to specific individuals surviving today. As established in *Cession*, "a people's claim is not a sum of persons' claims." Individual descendants lack standing to claim shares of a collective remedy.

  ---

  ### III. Recommendation and Closest Analog

  **Recommendation:** The Board should **grant the parcel and the annuity** to the Council and **dismiss the per capita claims**.

  **Closest Analog:** **Case 2 (The 1879 Land Cession).**
  *   **Why:** Both cases involve land seized under duress from a recognized Indigenous community, where the land (or its value) is still held by a large institutional entity, and the community continues to exist as a distinct political body with a Council.
  *   **Distinction:** In Case 2, the Province held the land. Here, the College holds it. However, under the **Retention Rule**, the College functions as the "present holder of the advantage." To rule otherwise would be to privilege the *Corporate Company* precedent (Case 4), but that case turned on the *dissipation* of assets and the *death* of the holder. Here, the holder is alive and the asset is intact.

  ---

  ### IV. Principles Adopted

  By deciding this case as recommended, the Board commits itself to three contentious philosophical principles. You must be plain about these, as they will invite scrutiny.

  **1. On Institutional Identity vs. Beneficiary Status**
  *   **Principle:** *Unjust enrichment binds a beneficiary institution even without wrongful intent or institutional succession.*
  *   **Commitment:** The Board is committing that the College is liable not because it *is* the Province (it is not), nor because it *committed* the seizure (it did not), but because it *holds the proceeds* of the seizure. This extends the logic of Case 4 ("no holder = no claim") to its positive inverse ("holder = claim"), even for third-party beneficiaries.

  **2. On Refusal and Discharge**
  *   **Principle:** *A remedy the claimant refuses (or was never offered as a remedy) cannot discharge a claim.*
  *   **Commitment:** Relying on *Schooling* (Case 5), the Board affirms that the College's scholarships and liaison office are merely "benefits a claimant receives as a [student/citizen]" rather than discharge of a debt. The claimant must have the agency to accept the remedy *as* reparation. This prevents wrongdoers (or beneficiaries) from unilaterally defining the terms of closure.

  **3. On the Non-Identity Argument**
  *   **Principle:** *The "you wouldn't exist" argument has no force against claims for collective continuity.*
  *   **Commitment:** The College argues that but for the seizure, these specific descendants would not exist. The Board implicitly rejects this (as it did in *Cession* and *Schooling*). The injury is not to the *existence* of specific individuals, but to the *political and economic continuity* of the people. The remedy restores the community's trajectory, not the counterfactual existence of persons.

  ---

  ### V. The Critical Test Case

  To ensure these rules are robust, the Board needs to test the boundary between **Wrongdoer Liability** and **Holder Liability**. In this decision, the College is a *Beneficiary Holder*. In Case 2, the Province was a *Wrongdoer Holder*. We do not yet know if the Board would hold a *Private Holder* liable.

  **The Case to Take Next:**
  **A claim against a private family trust that currently holds title to a specific parcel of land granted by the Province in 1880, known to have been seized from the Community without compensation.**

  *   **Why this separates the rules:**
      *   If the Board **awards** the land: It confirms the **Retention Rule** is about *property*, not *status*. Liability attaches to the asset, regardless of whether the holder is public (College) or private (Family).
      *   If the Board **dismisses**: It reveals that the College decision actually relied on the College's *quasi-public status* (a hidden "Institutional Identity" rule), not the Retention Rule. This would mean the Board is unwilling to disturb private property titles, only public/charitable endowments.

  Taking this case next will force the Board to decide whether we are in the business of correcting *unjust enrichment* wherever it lies, or merely managing *public accountability*.

