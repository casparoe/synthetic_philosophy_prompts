  # HANDOUT: TAXONOMY OF "WESTERN VALUES"
  **Session Motion:** *This House Believes "Western Values" Doesn't Name Anything Real.*

  ## PART I: THE DECISION TREE
  *Follow the concrete cases. Answer Yes/No based on your intuition about how the phrase is actually used. The label on the arrow is the theoretical claim that splits the path.*

  **NODE 1: The Japanese Liberal Case**
  *Case:* A modern Japanese citizen champions free speech, secular law, and individual rights, but has no historical or genetic link to Europe. Do they possess "Western Values"?
  *   **NO** → **Claim: Values require historical lineage.** → **LEAF A: The Genealogical/Descent View**
  *   **YES** → **Claim: Values are portable norms.** → Go to Node 2.

  **NODE 2: The Global Adoption Case**
  *Case:* Imagine every nation on earth (China, Iran, Brazil) adopts these exact norms tomorrow. Does the label "Western Values" become a lie/oxymoron?
  *   **YES** → **Claim: Values require civilizational exclusivity.** → **LEAF B: The Contrastive View**
  *   **NO** → **Claim: Values are universalizable.** → Go to Node 3.

  **NODE 3: The Hypocritical Regime Case**
  *Case:* An elected European government systematically restricts press freedom. Do proponents of "Western Values" stop using the phrase to describe this government, or do they use it *more* to defend it?
  *   **USE IT MORE (Phrase survives violation)** → **Claim: Phrase is performative, not descriptive.** → Go to Node 4.
  *   **STOP USING IT (Phrase withdrawn)** → **Claim: Phrase tracks factual reality.** → Go to Node 5.

  **NODE 4: The Rallying Cry Case**
  *Case:* A politician uses the phrase to justify a war. Are they signaling "We are the Good Guys" (moral claim) or "We are Us" (tribal claim)?
  *   **"We are Us" (Tribal)** → **Claim: Utterance signals team membership.** → **LEAF C: The Self-Ascriptive View**
  *   **"We are Good" (Moral)** → **Claim: Utterance functions as praise.** → **LEAF D: The Honorific View**

  **NODE 5: The Radical Dissident Case**
  *Case:* A philosopher within the West argues that "human rights" are a colonial myth. Are they undermining "Western Values" or participating in their highest tradition?
  *   **PARTICIPATING** → **Claim: The tradition includes its own negation.** → **LEAF E: The Tradition-of-Self-Criticism View**
  *   **UNDERMINING** → **Claim: The tradition is a positive doctrine.** → Go to Node 6.

  **NODE 6: The Checklist Case**
  *Case:* Is there a fixed list of tenets (e.g., free markets, free speech, Christianity) that defines the term?
  *   **YES** → **Claim: Values are a specific doctrinal list.** → **LEAF F: The List/Content View**
  *   **NO** → **Claim: Values are structural or procedural.** → Go to Node 7.

  **NODE 7: The Treaty Case**
  *Case:* Are "Western Values" identical to the legal constitutions of Western states, or to their military alliances (NATO/AUKUS)?
  *   **Legal Constitutions** → **Claim: Values are institutional architecture.** → **LEAF G: The Institutional/Procedural View**
  *   **Military Alliances** → **Claim: Values are geopolitical bloc markers.** → **LEAF H: The Geopolitical Bloc View**

  ---

  ## PART II: THE LEAVES (POSITIONS)
  *Each leaf includes its "Awkward Commitment" (the price of holding this view) and the "Killer Cross-Ex" (the question that collapses it).*

  **LEAF A: The Genealogical/Descent View**
  *   **Awkward Commitment:** You must admit that a perfect liberal democracy in Tokyo is "less Western" than an illiberal one in Paris.
  *   **Killer Cross-Ex:** "If the values are good, why does the bloodline matter more than the outcome?"

  **LEAF B: The Contrastive View**
  *   **Awkward Commitment:** You cannot wish for the rest of the world to adopt these values without destroying the category itself.
  *   **Killer Cross-Ex:** "Are you defending these values, or are you just defending a border?"

  **LEAF C: The Self-Ascriptive View**
  *   **Awkward Commitment:** The phrase has no truth condition; a tyrant can claim it as validly as a democrat if they claim the identity.
  *   **Killer Cross-Ex:** "If 'Western Values' just means 'Our Team,' why pretend it's a moral argument?"

  **LEAF D: The Honorific View**
  *   **Awkward Commitment:** The phrase is essentially a compliment sticker that can be peeled off and stuck on anything the speaker likes.
  *   **Killer Cross-Ex:** "If the term is just praise, why do you get angry when critics point out the hypocrisy?"

  **LEAF E: The Tradition-of-Self-Criticism View**
  *   **Awkward Commitment:** You must count those who want to abolish the West as the most loyal Westerners.
  *   **Killer Cross-Ex:** "If the tradition is self-critique, at what point does the critique become suicide?"

  **LEAF F: The List/Content View**
  *   **Awkward Commitment:** You must defend every item on the list (e.g., free markets) even when they contradict each other (e.g., equality).
  *   **Killer Cross-Ex:** "Which item on the list is disposable, and who gets to decide?"

  **LEAF G: The Institutional/Procedural View**
  *   **Awkward Commitment:** You reduce profound cultural claims to dry legal tech, ignoring the spirit that animates the laws.
  *   **Killer Cross-Ex:** "If the institutions remain but the people lose faith in them, are the values still there?"

  **LEAF H: The Geopolitical Bloc View**
  *   **Awkward Commitment:** You admit the phrase is a euphemism for NATO interests, not a moral system.
  *   **Killer Cross-Ex:** "If NATO dissolved tomorrow, would 'Western Values' cease to exist?"

  ---

  ## PART III: THE GHOSTS (EMPTY COMBINATIONS)
  *Theoretical positions the tree's logic allows, but which nobody actually occupies.*

  1.  **The Self-Critical Genealogist (Leaf A + Leaf E):** Claims values require bloodline *but* also require hating one's ancestors.
      *   *Status:* **Incoherent.** You cannot ground authority in lineage while simultaneously grounding authority in the rejection of that lineage.
  2.  **The Honorific Institutionalist (Leaf D + Leaf G):** Claims the phrase is just empty praise *but* also points to specific legal constitutions as the definition.
      *   *Status:* **Unattractive.** If it's just praise, the specific institutions don't matter; if institutions matter, it's not just praise.
  3.  **The Universal Contrastivist (Leaf B + Node 2 "No"):** Claims the term depends on being *not-East* (Contrastive) but also works if the East adopts it (Universal).
      *   *Status:* **Incoherent.** A boundary marker cannot function if the boundary is erased.
  4.  **The Moral Geopolitician (Leaf H + Node 4 "Moral"):** Claims the phrase marks a military alliance *but* insists it is a universal moral truth.
      *   *Status:* **Unmapped.** Realists admit it's strategy; Idealists admit it's morals. Nobody successfully argues it is *both* without cynicism.

  ---

  ## PART IV: LIMITATIONS
  *Flagged Indistinguishability:*
  **Leaf C (Self-Ascriptive) and Leaf D (Honorific).**
  *Why:* In the heat of debate, "We are Us" (Ascriptive) and "We are Good" (Honorific) function identically: both immunize the speaker from factual counter-evidence. Node 4 attempts to split them, but a skilled speaker will conflate tribal loyalty with moral superiority to evade the distinction.
