answer: |-
  # Procedure for Evaluating Individual Invitations

  **Context:** This procedure operationalizes the commitment to open inquiry while acknowledging the paradox of tolerance. It distinguishes between state suppression and private programming, prioritizes platform harm over content harm, acknowledges vagueness in borderline cases, and assigns standing to those who bear the costs of tolerance.

  **Timeline:** All steps must be completed within five business days to allow two days for justification drafting.

  ### I. Ordered Questions and Decision Points

  **Question 1: Mission Fit (Content vs. Inquiry)**
  *   **Question:** Does the proposed talk constitute an inquiry compatible with evidence-based discourse, or does it reject the premises of evidence-based inquiry itself?
  *   **Sufficient Answer:** A review of the abstract and recent public statements. If the speaker explicitly rejects the validity of peer review, empirical evidence, or rational debate as methods for determining truth, the answer is **No**.
  *   **Decision:**
      *   **No:** Return **Decline**. Publish reason: "The proposal rejects the evidentiary standards required for our series' mission of open inquiry."
      *   **Yes:** Proceed to Question 2.

  **Question 2: Platform Harm Assessment**
  *   **Question:** Does hosting this speaker confer legitimacy (credentialing) or audience aggregation that causes tangible harm which counter-speech cannot remedy?
  *   **Sufficient Answer:** Specific evidence that the speaker's presence will be used to validate harassment, violence, or the systematic exclusion of others from inquiry, distinct from the offensiveness of the content.
  *   **Decision:**
      *   **High Harm Identified:** Proceed to Question 5 (Mitigation).
      *   **Low/No Harm Identified:** Proceed to Question 3.

  **Question 3: Cost-Bearer Standing**
  *   **Question:** Have representatives of groups disproportionately affected by this talk submitted a formal objection regarding Platform Harm?
  *   **Sufficient Answer:** A written statement received within 48 hours of notification detailing specific platform harms (e.g., "This venue will be cited to justify discrimination against X group").
  *   **Decision:**
      *   **Objection Received:** Triggers **Full Committee Values Question**. All four members must vote. A majority is required to Host.
      *   **No Objection:** Proceed to Question 4.

  **Question 4: The Penumbra Rule (Vagueness)**
  *   **Question:** Is this a clear case of harm or a borderline case where reasonable people disagree?
  *   **Sufficient Answer:** Committee consensus on whether the harm is obvious or debatable.
  *   **Decision:**
      *   **Borderline:** The committee **openly exercises authority** to close the gap. We do not pretend to discover a pre-existing fact. The published justification must state: "While compatible with open inquiry, this talk does not align with our current programming priorities regarding community impact."
      *   **Clear:** Proceed to Question 5.

  **Question 5: The Ladder of Responses (Mitigation)**
  *   **Question:** Can the Platform Harm be mitigated by changing the format rather than declining the invitation?
  *   **Sufficient Answer:** A concrete plan (e.g., mandatory respondent, structured Q&A, no solo podium) that disrupts credentialing while allowing content exposure.
  *   **Decision:**
      *   **Yes:** Return **Host with Modifications**.
      *   **No:** Return **Decline**. Publish reason: "The platform harm associated with this event cannot be mitigated through format changes."

  ### II. The Anti-Laundrying Check (Mirror Test)

  **Constraint:** Before any **Decline** decision is finalized, the committee must apply the Mirror Test.
  *   **Test:** "Would we decline a speaker advocating the *opposite* viewpoint using identical reasoning?"
  *   **Failure Condition:** If the reason for declining relies on the specific political valence of the speech rather than the method or platform harm, the test fails.
  *   **Remedy:** If the test fails, the committee must revert to **Host** or rewrite the justification to reflect a viewpoint-neutral principle (e.g., "rejects evidence" rather than "rejects our values").

  ### III. Application to Cases

  **Case 1: The Epidemiologist**
  *   **Analysis:**
      *   *Q1 (Mission):* Borderline. He has peer-reviewed work but now claims a cover-up. This attacks the institution of science itself.
      *   *Q2 (Platform Harm):* High. His credentials are being used to shield misinformation that undermines public trust in health infrastructure. Counter-speech often fails against "cover-up" claims because evidence is framed as part of the conspiracy.
      *   *Q3 (Cost-Bearers):* Public health advocates would likely object.
      *   *Q5 (Mitigation):* Difficult. A respondent cannot easily fix the credentialing harm of a "whistleblower" narrative.
      *   *Mirror Test:* Would we ban someone claiming agencies *overstated* risks? No, unless they also claimed fraud without evidence. The harm here is the specific claim of *deliberate deception* by institutions required for inquiry.
  *   **Procedure Output:** **Decline.**
  *   **Justification:** "While the speaker has prior credentials, his current claims reject the validity of the peer-review institutions necessary for open inquiry. Hosting would confer legitimacy on misinformation that undermines the infrastructure of public health science."

  **Case 2: The Evolutionary Biologist**
  *   **Analysis:**
      *   *Q1 (Mission):* Yes. Research on population differences is a valid scientific inquiry.
      *   *Q2 (Platform Harm):* Low. The prompt states he has made no political claims. The harm is speculative (future misuse) rather than tangible (current credentialing for discrimination).
      *   *Q3 (Cost-Bearers):* Faculty object. They trigger a **Full Committee Values Question**.
      *   *Q4 (Penumbra):* This is a borderline case. The committee must exercise authority openly.
      *   *Mirror Test:* Would we ban a scientist finding *no* differences? No. Banning this speaker based on the *content* of the findings violates viewpoint neutrality.
  *   **Procedure Output:** **Host.**
  *   **Statement of Unliked Outcome:** The procedure mandates hosting this speaker. Because he has not made political claims and his research falls within scientific inquiry, declining him constitutes viewpoint discrimination that fails the Mirror Test. The procedure protects unpopular science unless it crosses into explicit advocacy for exclusion. You indicated you would not like this answer; the procedure yields it anyway to preserve the integrity of the "open inquiry" commitment.

  **Case 3: The Neo-Nazi**
  *   **Analysis:**
      *   *Q1 (Mission):* No. Ideologies based on racial supremacy inherently reject the equal standing of participants required for inquiry.
      *   *Q2 (Platform Harm):* High. Credentialing hate speech normalizes exclusion and violence.
      *   *Mirror Test:* Would we ban an open-borders advocate? No. Advocacy for inclusion does not destroy the conditions of inquiry; advocacy for exclusion does.
  *   **Procedure Output:** **Decline.**
  *   **Justification:** "The speaker's ideology rejects the equal standing of participants required for open inquiry. Platforming this view undermines the safety and inclusivity necessary for our series to function."

  ### IV. What This Procedure Cannot Do

  1.  **Guarantee Safety:** It cannot prevent protests or physical disruption; it only governs our invitation status.
  2.  **Resolve Deep Philosophical Disputes:** It cannot determine if the Biologist's science is *correct*, only if it is *permissible* within the series.
  3.  **Eliminate Regret:** It forces the committee to own the cost of tolerance (hosting the Biologist) or the cost of exclusion (declining the Epidemiologist). It does not remove the moral burden of the decision.
  4.  **Predict Future Misuse:** It cannot perfectly anticipate how a speaker's words will be weaponized later; it relies on current evidence of platform harm.

  \answer{Whether the specific act of platforming undermines the conditions necessary for future open inquiry.}
