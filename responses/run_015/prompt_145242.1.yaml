      *   *Log:* A visible whiteboard where departures are noted.

  6.  **Evaluating the User's Two Ideas:**

      *   *Idea 1 (Weak Stakes):* Assigning some participants as "leaving soon." *Verdict:* Yes, include this. It highlights the Licence Gradient. Those with less stake might break rules more easily (less to lose) or less (don't care). It reveals who feels bound by the collective.
      *   *Idea 2 (Sealed Card):* Naming a personal rule. *Verdict:* Yes, but modify. Read it only if they broke a rule in the game that matched it. It connects the game to real life without being too confessional.

  7.  **Drafting the Plan (Iterative Process):**

      *   *Timeline:* 100 mins is tight.
          *   0-15: Setup & Code Writing.
          *   15-60: Incidents (5 incidents x 5 mins + transition).
          *   60-85: Debrief & Mapping.
          *   85-100: Closing & Jargon.
