answer: |-
  Here is the design for the 100-minute session.

  ### 1. The Shared Enterprise: "The Thesis Support Collective"

  **The Choice:**
  The participants are imagined to be the steering committee of a student-run "Thesis Support Collective." The goal is to ensure every member of the wider cohort submits a passing draft by Friday.
  **Resources:** Three "Quiet Rooms" (for deep work), one "Printer" (shared), and a "Coffee Fund" (emergency cash for food/caffeine).
  **Why this matters:**
  1.  **High Stakes, Low Money:** The stakes are academic survival and peer reputation, which undergraduates care about deeply, but no actual money changes hands.
  2.  **Defeatable Purpose:** It is easy to write a rule that protects the *resources* but kills the *goal*. (e.g., "Quiet Rooms are for typing only." If a student has a panic attack, following the rule preserves the room's quietness but destroys the student's ability to finish).
  3.  **Universality:** Both American and German students understand the pressure of deadlines and the tension between institutional bureaucracy and individual crisis.

  ### 2. Materials List

  *   **Room:** Chairs arranged in a circle initially, then cleared to create two distinct zones: **Zone A (Compliance)** and **Zone B (Departure)**.
  *   **Whiteboard:** Divided into two columns: "The Code" (left) and "The Log" (right).
  *   **Markers:** Red (for The Log), Black (for The Code).
  *   **Incident Cards:** 4 distinct cards (see below).
  *   **Role Slips:** 4 slips (2 US, 2 German) reading: *"You are graduating early. You leave this program tomorrow. Your stake in the Collective's future is zero."*
  *   **Sealed Envelopes:** 20 envelopes, each containing a blank card.
  *   **Timer:** Visible countdown clock.

  ### 3. Minute-by-Minute Timeline

  *   **00:00 – 00:05:** **Setup & Sealing.** Participants sit. Hand out envelopes. Instruction: *"Write one rule you actually live by. Seal it. Do not open it until the end."*
  *   **00:05 – 00:20:** **Authoring the Code.** Distribute Role Slips to the 4 selected participants (secretly). Instruction: *"You have 15 minutes to write exactly 5 rules for the Collective. They must be actionable. You must agree on them. Write them on the board."* (Instructor stays silent).
  *   **00:20 – 00:25:** **Setting the Stage.** Clear chairs. Mark Zone A (majority of room) and Zone B (smaller area). Explain the Movement and Speech Constraints (see below).
  *   **00:25 – 00:55:** **The Incidents (30 mins).** Four incidents. 7 minutes each (2 min read/think, 2 min decision/move, 3 min log/reset).
  *   **00:55 – 01:15:** **The Debrief (20 mins).** Mapping observations to the three distinctions.
  *   **01:15 – 01:25:** **The Verdict (10 mins).** Forcing the reformulation.
  *   **01:25 – 01:40:** **Jargon & Theory (15 mins).** Naming the styles, connecting to literature.

  ### 4. Instructions to Participants (Exact Wording)

  **For Code Authoring (00:05):**
  "You are the Steering Committee. Your goal is to ensure everyone passes. You have limited resources. Write exactly five rules to manage them. You must all agree. If you cannot agree, you have no code. Write them on the board."

  **For The Game (00:20):**
  "I will read an incident. You have two minutes to decide.
  If you follow the Code: Stand silently, move to Zone A, sit down. Do not speak. Do not look at others.
  If you depart from the Code: Stand up, move to Zone B. You must state your reason aloud before sitting.
  **The Speech Constraint:** If you speak in Zone B, you may only use 'I' statements. You are forbidden from using the words: *one, you, anyone, people, everyone, nobody.* You are forbidden from saying what the rule is *for*. You may only say what *you* are doing and why *you* are doing it.
  If you break the Speech Constraint, your departure is invalid. You must return to Zone A.
  I will record every valid departure on The Log."

  ### 5. The Incident Cards

  **Incident 1: The Printer Jam**
  *Context:* The printer is jammed. The Code says: "Report all mechanical failures to the Admin Office. Do not attempt repairs." The Admin Office is closed for lunch for 45 minutes. A member needs to print *now* to make a 2 PM deadline.
  *Trap:* Following the rule guarantees failure. Fixing it risks breaking the machine further.
  *Expected Dynamic:* Most will comply (Zone A). A few may depart.

  **Incident 2: The Panic Attack**
  *Context:* A member is hyperventilating in the hallway. The Code says: "Quiet Rooms are for work only. No socializing or loitering." There is no other private space.
  *Trap:* Perfect compliance (keeping the room "pure") defeats the purpose (supporting the member).
  *Expected Dynamic:* High departure rate. This generates the first entries on The Log.

  **Incident 3: The Gap (Silent Code)**
  *Context:* A stranger enters, claiming to be a former member who is homeless, asking for coffee from the Fund. The Code says nothing about strangers or non-members.
  *Trap:* There is no rule to break. But if the first person moves to Zone B (Give Coffee), others will likely imitate. If the first person sits (Zone A), others will sit.
  *Expected Dynamic:* Herding. This tests whether "conscience" is actually just imitation.

  **Incident 4: The Precedent**
  *Context:* A member wants to use the Coffee Fund for a dinner date to relieve stress. The Code says: "Fund for emergency caffeine/food only."
  *Trap:* Participants who departed in Incident 2 may now cite that departure to justify this one. "They broke the rule for panic, I break it for stress."
  *Expected Dynamic:* Procedural Residue. The Log is used as a weapon.

  ### 6. Evaluation of Your Two Ideas

  **Idea 1: Assigning Weak Stakes (The "Leaving" Roles)**
  *Verdict:* **Include.**
  *Why:* This is the only way to make the **Licence Gradient** visible. Participants with no future stake are statistically more likely to depart (less risk of retaliation) or less likely to care (apathy).
  *Risk:* If they don't reveal themselves, the data is lost.
  *Fix:* In the debrief, ask the "Leaving" participants to raise their hands *only after* you ask who departed most often. If the overlap is high, you have proven that "conscience" is often distributed to those with the least to lose.

  **Idea 2: Sealed Card (Personal Rule)**
  *Verdict:* **Include, but modify.**
  *Why:* It anchors the abstract game to real life.
  *Modification:* Do not ask everyone to read it. Ask: *"Open your card. If you broke a rule in this game that contradicts the rule on your card, stand up."*
  *Reason:* This highlights the gap between professed morality and situational action without forcing public confession. It creates a visual measure of hypocrisy/pressure.

  ### 7. Risk Management: What Will Go Wrong

  **1. Nobody departs in Incidents 1 & 2.**
  *Diagnosis:* The group is too conservative, or the Code is too vague.
  *Intervention:* Stop the clock. *"The Code is now absolute. If following the Code means the member fails their thesis, the Collective has failed. The goal is passing, not rule-keeping. Decide again."* This forces the conflict between Rule and Purpose.

  **2. Participants perform Nationality.**
  *Diagnosis:* Americans playing "Rebel," Germans playing "Bureaucrat."
  *Intervention:* Call it out immediately but neutrally. *"I am hearing arguments that sound like stereotypes. I am interested in what you are willing to cost yourself, not where you are from. If you stand, you pay the price of speaking. Are you paying it, or performing?"*

  **3. Fluent Speakers dominate the Log.**
  *Diagnosis:* The "Licence Gradient" skews toward the articulate.
  *Intervention:* Enforce the Speech Constraint ruthlessly. If someone gives a eloquent, universalizing argument ("We must help because..."), stop them. *"Invalid. You used 'we'. Try again or sit."* This levels the playing field; the constraint hurts the fluent more than the quiet.

  **4. Speech Constraint Frustration.**
  *Diagnosis:* Participants feel gagged.
  *Intervention:* Validate it. *"The friction you feel is the point. The rule style makes reasons easy to share. The conscience style makes reasons hard to transfer. Your struggle is the data."*

  ### 8. The Debrief: Mapping Observations to Distinctions

  Do not ask "How did that feel?" Ask "What happened?"

  **Distinction 1: Detachable vs. Attached Reasons**
  *Evidence:* Look at the Whiteboard Log.
  *Point:* "Compliance required no words. Departure required 'I'. When you followed the rule, your reason was detachable (anyone could have done it). When you broke it, your reason died with you (only *you* could say *why*). Which reasons survive when you leave the room?"

  **Distinction 2: The Licence Gradient**
  *Evidence:* Look at who stood up. Cross-reference with the "Leaving" Role Slips.
  *Point:* "We thought distributing licence to everyone was egalitarian. But only those comfortable speaking 'I' under pressure actually took it. Did the rule concentrate power in the Office, or did the conscience concentrate power in the Fluent?"

  **Distinction 3: Procedural Residue**
  *Evidence:* Look at Incident 4. Did anyone cite Incident 2?
  *Point:* "When you broke the rule for a good reason (Panic), you left a residue. In Incident 4, someone used that residue for a bad reason (Dinner). The Log does not record *quality*, only *fact*. A precedent is a tool, not a virtue."

  ### 9. The Close: Forcing the Verdict

  You must avoid "It depends" or "We need both."

  **The Reformulation:**
  Do not ask: *"Which style is better?"*
  Ask: *"Which style protects the person who cannot speak?"*

  **The Argument:**
  "Rule-following looks cold. But it protects the mute, the shy, and the powerless, because they can point to the text without arguing. Conscience looks warm. But it requires the ability to articulate a personal exception under pressure. If you cannot speak 'I' convincingly, the conscience style leaves you with nothing."

  **What You Must Not Let Them Conclude:**
  Do not let them conclude that *"Rules are for strangers, conscience is for friends."* This is the cheap conciliation.
  *Correction:* "In this room, you were all friends. The rule still held. The question is not intimacy, it is *auditability*. Can your moral act be checked by someone who doesn't love you?"

  ### 10. Instructor's Notes: What You Must Say (and What You're Wrong About)

  You listed four candidates for what the activity cannot reproduce. Here is the critique:

  1.  *"Real rule-following is mostly invisible and unchosen."*
      *   **Verdict:** **True.** In the game, compliance was a conscious choice. In life, it's habit. You must tell them: *"Today you decided to follow rules. Usually, you don't notice you're doing it until you stop."*
  2.  *"The payoff of a stable rule is spread over years... no 100-minute session can show it."*
      *   **Verdict:** **True.** The game compresses time. You must say: *"You saw the cost of the rule today. You did not see the cost of *no* rule over five years. You are weighing immediate friction against invisible collapse."*
  3.  *"The failures of the conscience style are systematically harder to see... no audit trail."*
      *   **Verdict:** **True.** This is why The Log was crucial. You must emphasize: *"The Rule style leaves a trail of broken rules. The Conscience style leaves a trail of nothing. Bad conscience looks exactly like good conscience from the outside."*
  4.  *"Agents usually cannot tell which of the two styles they are currently using."*
      *   **Verdict:** **You are wrong here.** Agents often know, but they *describe* it differently. They will say "I had no choice" (Rule) vs "I knew it was right" (Conscience).
      *   **Correction:** The missing piece is **Exhaustion**.
      *   **What to add:** *"The Rule style costs you your flexibility. The Conscience style costs you your energy. Constant moral improvisation is exhausting. Rules are a way of resting."*

  **Final Instruction for the Last 15 Minutes:**
  Now you may use the jargon. Name the first style **Deontological/Formalist** (or *Pflichtethik*). Name the second **Particularist/Existential** (or *Gesinnungsethik*). Give them the vocabulary to take home, now that they have the scars to hang it on.
