      *   **Context:** Binational summer school (US/German undergrads), 100 minutes, middle of a module.
      *   **Topic:** Contrast between two folk-moral styles (Rule-based vs. Situation-based/Conscience-based).
      *   **Goal:** Experiential learning. Participants must *hit* three distinctions (Detachable vs. Attached Reasons, Licence Gradient, Procedural Residue) through action, not lecture. No jargon until the last 15 mins.
      *   **Core Mechanism:** Participants write a code for a shared enterprise, then face incidents requiring decisions. Compliance = silent movement. Departure = standing + speaking (strict "I-sentence" constraint, no universalizing terms). Departures logged visibly.
      *   **Specific Requirements:**
          *   Choose the shared enterprise (must have a point that can be defeated by perfect rule-following).
          *   Create incident cards.
          *   Minute-by-minute timeline.
          *   Materials list.
          *   Exact instructions.
          *   Speech constraint rules.
          *   Evaluate two ideas: (1) Assigning weak stakes (leaving soon), (2) Sealing a card with a personal rule.
          *   Debrief plan: Map observations to the three distinctions, avoid "it depends" conciliation, force a reformulation of the verdict.
          *   Risk Management: What if no one departs? Nationality performance? Dominant speakers? Speech constraint frustration?
          *   Instructor's Role: What *must* the instructor say? What can't the activity show? (Invisibility of rules, long-term payoff, audit trails, self-knowledge).

  2.  **Deconstruct the Three Distinctions:**

      *   *Detachable vs. Attached Reasons:* Rules allow reasons to be swapped (anyone can cite the rule). Conscience requires personal ownership ("I feel," "I need"). The speech constraint forces Attached Reasons for departures.
      *   *Licence Gradient:* Who gets to break the rule? Rules concentrate it (office/authority). Conscience distributes it (everyone). But in practice, only the articulate/confident will speak up. The activity needs to show who feels entitled to stand up.
      *   *Procedural Residue:* A broken rule becomes a precedent. The "Log" of departures is crucial here. Later participants can cite earlier departures ("X did it, so I can").

  3.  **Designing the Shared Enterprise:**

      *   *Criteria:* Needs a clear purpose, needs rules that can be followed perfectly but defeat the purpose, needs social stakes (not financial).
      *   *Idea:* A "Community Kitchen" or "Shared Study Space"?
      *   *Selection:* **The "Quiet Study & Resource Hub."**
      *   *Why:* It balances order (quiet, resource availability) with human need (helping a distressed friend, urgent deadline). It's relatable to students.
