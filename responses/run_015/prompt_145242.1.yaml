          2.  Friend in crisis. Rule: "Quiet Rooms for work only." Option: Let them cry in there.
          3.  *The Gap:* Someone brings a dog. (No rule about animals).
          4.  *The Precedent:* Someone cites Incident 2 to justify breaking Incident 1.
          5.  *The Trap:* Rule: "All drafts submitted by 5 PM." A student is 1 min late due to a verified emergency. Rule says reject. Purpose (support) defeated.

  8.  **Refining the Debrief:**

      *   Must avoid "It depends."
      *   Must force a choice: "Which system produces better *people* vs. which produces better *outcomes*?" Or "Which system survives *bad actors*?"
      *   Mapping:
          *   Speech constraint struggle -> Attached Reasons.
          *   Who stood up? -> Licence Gradient.
          *   The Log usage -> Procedural Residue.

  9.  **Risk Management:**

      *   *No one departs:* Instructor must intervene. "The code is now law. If the code kills the project, the project dies." Raise stakes.
      *   *Nationality Performance:* Call it out gently. "Are you doing 'German' or are you doing 'You'?"
      *   *Dominant Speakers:* The speech constraint limits them. The Log limits them (only one citation per incident?).
      *   *Speech Constraint Frustration:* Acknowledge it. "The friction is the data."

  10. **Instructor's "Must-Say" List:**

      *   Rules are invisible usually.
      *   Conscience leaves no audit trail.
      *   The "It depends" cop-out is forbidden.

  11. **Review against Constraints:**

