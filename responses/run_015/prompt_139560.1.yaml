  1.  **Stay:** Keep Old Preferences + 50 Points.
  2.  **Go:** Get New Preferences + Unknown Points (60-100).
  3.  **Escape Hatch (Cost 15 points):** You Go (get New Preferences + Points), BUT you are allowed to answer Verdict 2 ("Was this good for the person who chose?") as "Yes" automatically, OR you get to keep your Old Preference card for the scoring calculation.
  *Let's simplify for flow:*
