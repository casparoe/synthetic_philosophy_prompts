answer: |-
  ### I. The Logical Space

  To generate the classification cells without using theoretical labels, the instrument relies on four load-bearing distinctions. These are the structural joints of the tree.

  1.  **The Source of Uncertainty:** Is the disagreement about *what is the case* (empirical facts with moral consequences) or *what matters* (competing moral standards)?
      *   *Function:* Filters out readers who are not actually facing moral uncertainty but rather empirical uncertainty.
  2.  **The Currency of Choice:** Is the primary goal to *produce the best outcome* (axiological) or to *avoid acting wrongly* (deontic)?
      *   *Function:* Separates those who weigh harms/benefits from those who weigh permissions/forbiddances.
  3.  **The Aggregation Principle:** When views conflict, do you *combine their weight* (hedging) or *follow the most probable winner* (maximizing credence)?
      *   *Function:* **This is the heavy lifter.** It does the most work in separating "Moral Expected Value" types from "My Favorite Theory" types and Risk-Averse types.
  4.  **The Comparability of Stakes:** If you aggregate, can you say one view's "very bad" is worse than another view's "somewhat bad," or are they incommensurable?
      *   *Function:* Distinguishes between those who can scale values across theories and those who must treat views as ordinal rankings only.

  ***

  ### II. The Positions (Leaves)

  The following twelve outcomes represent the terminal nodes of the tree. Each includes the standard name (where confident) and the single most awkward commitment required to hold the view.

  1.  **Moral Expected Value:** Aggregates expected performance across the moral views one holds.
      *   *Awkward Commitment:* Must sometimes perform an action you believe is 99% likely to be wrong to avoid a 1% chance of catastrophe.
  2.  **My Favorite Theory:** Says to act on whatever one actually believes is most likely correct and not to hedge.
      *   *Awkward Commitment:* Must ignore severe harms predicted by minority views you take seriously.
  3.  **Maximin:** A pessimistic or risk-averse view that gives lexical or near-lexical weight to avoiding the worst outcome.
      *   *Awkward Commitment:* Paralyzed by extremely unlikely worst-case scenarios (e.g., refusing to drive for fear of killing a pedestrian).
  4.  **Proportionalism:** A compromise or proportional-satisfaction view that splits or mixes rather than maximises.
      *   *Awkward Commitment:* Must waste resources on options you believe are useless simply to honor a minority view.
  5.  **Subjective Rightness:** A view aimed at not acting wrongly or not being blameworthy rather than at producing the best outcome.
      *   *Awkward Commitment:* Might require ignoring likely consequences to maintain a clean moral record.
  6.  **Objectivism:** A leaf for the reader who thinks the entire problem is spurious because there is nothing here to be uncertain about.
      *   *Awkward Commitment:* Makes moral deliberation feel like guessing a hidden fact rather than reasoning.
  7.  **Unnamed (Vice-Theoretic):** A leaf for the reader who thinks hedging is itself a vice.
      *   *Awkward Commitment:* Punishes caution in high-stakes situations as a character flaw.
  8.  **Unnamed (Deontic Absolutist):** A view where a constraint forbidden by any credible view cannot be overridden.
      *   *Awkward Commitment:* Allows preventable disasters to avoid personal moral contamination.
  9.  **Unnamed (Group Delegator):** Allocates a shared budget by following the majority view of the group.
      *   *Awkward Commitment:* Requires minorities to act against their own moral judgment for the sake of cohesion.
  10. **Unnamed (Group Proportional):** Allocates a shared budget across people who disagree by splitting the funds.
      *   *Awkward Commitment:* Requires revealing private doubts to the group to justify the split.
  11. **Unnamed (Option Keeper):** A view where you can now cheaply preserve an option in case you later come to hold a view you currently reject.
      *   *Awkward Commitment:* Delays action indefinitely to keep future paths open.
  12. **Contextualist:** A view where the rule changes depending on the stakes or the type of decision.
      *   *Awkward Commitment:* No stable rule for when stakes change; vulnerable to framing effects.

  ***

  ### III. The Diagnostic Material (The Tree)

  *Instructions for the Reader: Answer each question based on your immediate reaction to the case. Do not worry about consistency yet; follow the path that matches your verdict.*

  **Node 1: The Source of Uncertainty**
  *Case:* You are deciding whether to fund a medical treatment. You are unsure if the patient is a biological human being or a sophisticated android. If human, treatment is mandatory. If android, treatment is waste.
  *Question:* Is your uncertainty about *what the patient is* (fact) or *what duties you owe to the patient* (value)?
  *   **If Fact:** Go to **Leaf 6 (Objectivism)** [Note: For this instrument, empirical uncertainty is treated as outside the scope of moral uncertainty; if they insist this is moral uncertainty, they sort to Objectivism/Spurious].
  *   **If Value:** Proceed to Node 2.

  **Node 2: The Currency (Deontic vs. Axiological)**
  *Case:* You are 90% sure stealing a drug is *permissible* to save a life, but 10% sure it is *forbidden* regardless of consequences. Every view agrees saving the life is *better*.
  *Question:* Does the 10% view's claim that it is **forbidden** stop you, even if the outcome is better?
  *   **Yes (Forbidden trumps):** Proceed to Node 3 (Deontic Branch).
  *   **No (Outcome trumps):** Proceed to Node 5 (Axiological Branch).

  **Node 3: Deontic Aggregation**
  *Case:* You have three moral views. View A (80%) says Lying is Bad but Permissible. View B (20%) says Lying is Forbidden.
  *Question:* Do you refrain from lying because View B says it is forbidden, or do you lie because View A says it is permissible?
  *   **Refrain:** Go to **Leaf 8 (Deontic Absolutist)**.
  *   **Lie:** Proceed to Node 4.

  **Node 4: Blameworthiness vs. Rightness**
  *Case:* You lie to save a life. You believe you did the right thing, but you worry you might be blameworthy for risking the forbidden.
  *Question:* Is your main goal to ensure the *act* is right, or to ensure *you* are not blameworthy?
  *   **Act is Right:** Go to **Leaf 5 (Subjective Rightness)**.
  *   **Not Blameworthy:** Go to **Leaf 7 (Unnamed - Vice-Theoretic)** [If they think worrying about blame is the only thing that matters].

  **Node 5: The Aggregation Principle (Heavy Lifter)**
  *Case (Tiny-Credence):* You are 99% sure donating to Charity A is the best thing to do. But 1% sure that Charity A triggers a catastrophe that destroys the world. Charity B is safe but does little good.
  *Question:* Do you donate to A (maximize expected good) or B (avoid the worst case)?
  *   **Donate to B:** Proceed to Node 6 (Risk/Branch).
  *   **Donate to A:** Proceed to Node 8 (Scaling/Branch).

  **Node 6: Risk Aversion**
  *Case:* You face a 50% chance of saving 10 lives and a 50% chance of saving 0 lives, versus a 100% chance of saving 4 lives.
  *Question:* Do you take the sure 4 lives to avoid the risk of 0?
  *   **Yes (Avoid Risk):** Go to **Leaf 3 (Maximin)**.
  *   **No (Take Risk):** Proceed to Node 7.

  **Node 7: Splitting**
  *Case (Splitting Case):* You have $1000. View X (50%) says give all to Food. View Y (50%) says give all to Art. You can give $500 to each.
  *Question:* Do you split the money to satisfy both views partially?
  *   **Yes:** Go to **Leaf 4 (Proportionalism)**.
  *   **No:** Go to **Leaf 2 (My Favorite Theory)**.

  **Node 8: Scaling and Comparison**
  *Case (Scaling Case):* View X (50%) says Option 1 is *slightly* better than Option 2. View Y (50%) says Option 2 is *vastly* better than Option 1.
  *Question:* Do you pick Option 2 because View Y's "vastly" outweighs View X's "slightly"?
  *   **Yes:** Proceed to Node 9.
  *   **No (Incommensurable):** Go to **Leaf 12 (Contextualist)**.

  **Node 9: Option Preservation**
  *Case:* You can act now for a good outcome, or pay a small cost to wait and decide later when you understand your values better.
  *Question:* Do you pay to wait?
  *   **Yes:** Go to **Leaf 11 (Option Keeper)**.
  *   **No:** Proceed to Node 10.

  **Node 10: Group vs. Self**
  *Case (Shared Budget):* You manage a club budget. Half the members believe in View X, half in View Y. They disagree on how to spend.
  *Question:* Do you split the budget to respect the members, or spend it all on what you think is right?
  *   **Split:** Go to **Leaf 10 (Group Proportional)**.
  *   **Spend on Right:** Go to **Leaf 9 (Group Delegator)**.

  **Node 11: Final Aggregation Check**
  *Case:* You have aggregated the views, compared the scales, and rejected splitting. You are maximizing across views.
  *Question:* Is there any case where you would stop aggregating?
  *   **No:** Go to **Leaf 1 (Moral Expected Value)**.
  *   **Yes:** Go to **Leaf 12 (Contextualist)**.

  *(Note: Moral Status Case is integrated into Node 1. Shared Budget is Node 10. Option Preservation is Node 9.)*

  ***

  ### IV. Four Shorter Things

  **1. Empty Cells (Unoccupied Combinations)**
  *   **Aggregates Value but Refuses Scaling:** This combination is logically **incoherent**. If you aggregate across views (add them up), you must implicitly assume their units are comparable. If you cannot compare scales, you cannot aggregate.
  *   **Deontic Absolutist who Aggregates:** This is **unattractive** and rarely occupied. If a constraint is absolute (forbidden), it cannot be weighed against other views. A reader who claims to hold this usually collapses into *My Favorite Theory* upon probing.

  **2. Indistinguishable Leaves**
  *   **My Favorite Theory vs. Objectivism:** The tree cannot separate these if the reader claims 100% confidence in their view.
      *   *Fix:* Add a follow-up question: "If new evidence reduced your confidence to 80%, would your action change?" If yes, they are My Favorite Theory. If no, they are Objectivists.
  *   **Moral Expected Value vs. Contextualist:** Both may aggregate in high-stakes cases.
      *   *Fix:* Use the Scaling Case (Node 8). A Contextualist will hesitate to compare "slightly" vs "vastly" across theories; an Expected Value theorist will not.

  **3. Multi-Verdict Leaves (Scoring Patterns)**
  *   **Leaf 1 (Moral Expected Value)** requires a pattern across several verdicts rather than a single path. To score this, the reader must say "Yes" to Aggregation (Node 5), "Yes" to Scaling (Node 8), and "No" to Splitting (Node 7).
      *   *Scoring Recommendation:* Do not treat this as a simple branch. Assign +1 point for each "Aggregative" verdict. If the score is 3/3, sort to Leaf 1. If 2/3, sort to Contextualist.
  *   **Leaf 4 (Proportionalism)** also requires a pattern: "Yes" to Splitting, but "No" to Risk Aversion.

  **4. Mis-Sorting Risks**
  *   **The "It Depends" Reader:** A reader who answers "It depends on the stakes" at the Scaling Node (Node 8) will be mis-sorted as Contextualist, even if they are actually a sophisticated Expected Value theorist who recognizes measurement error.
      *   *Recommendation:* Add a "You are not sorted by this tree" leaf for readers who select "It depends" more than twice. This captures the **Pragmatist** who rejects the theoretical framework of the handout.
  *   **The Aggregative Intuitionist:** A reader might produce the aggregative verdict (Donate to A in Node 5) for non-aggregative reasons (e.g., "B is cowardly").
      *   *Recommendation:* At Node 5, add a "Why?" prompt. If the reason is "Avoiding cowardice" rather than "Calculating risk," branch to **Leaf 7 (Vice-Theoretic)** instead of Leaf 1. Do not drop the distinction; it reveals the underlying moral psychology.
