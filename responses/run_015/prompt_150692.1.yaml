      *   *Core Problem:* Standard Bayesianism assigns $P(T) = 1$ for all logical truths $T$. But agents are computationally bounded. They can't know all consequences of their axioms immediately.
      *   *Logical Induction Solution:* Assign probabilities $P_n(\phi)$ to sentences $\phi$ at time $n$.
      *   *Criterion:* The "Logical Induction Criterion." A market is logically inductive if no *polynomial-time* trading strategy can make unbounded profit against it.
      *   *Traders:* Algorithms that buy/sell shares in sentences based on current prices and logical relationships discovered so far.
      *   *Outcome:* In the limit, prices become calibrated, respect logical consistency (eventually), and learn patterns (e.g., "statements of form X tend to be true").

  3.  **Drafting the Translation (Iterative Process):**

      *   *Strict Bayesian/Logical Omniscience:* In user's vocab, this is like an estimator with zero bias but infinite variance/computational cost, or rather, a model that assumes the "true parameter" is known instantly. It's a model misspecification where the "model" assumes infinite compute.
      *   *Announced Prices:* These are point estimates (probabilities) for a sequence of binary parameters (truth values of sentences). Not i.i.d. data, but a sequence of estimates $\hat{\theta}_n$.
      *   *The Trader:* This is the tricky part. It's not just a test statistic. It's an *adversarial* model-checking procedure. It's like a specific alternative hypothesis that tries to exploit systematic errors in the estimator.
      *   *No Unbounded Profit:* This is akin to "no arbitrage." In scoring rule terms, it means the cumulative log-loss (or Brier score) doesn't diverge negatively relative to the trader's strategy. It implies calibration.
      *   *In the Limit:* Consistency. $P_n(\phi) \to 1$ if $\phi$ is true. But the rate is not specified (and can't be, generally).

      *   *User Hypothesis 1 (Theorems as Noisy Instrument):* "Noise in the detector." This is a strong analogy. The "truth" is fixed (parameter), the "observation" is the proof (data arrival). The uncertainty is epistemic/computational, not aleatoric. *Verdict:* Fair, but needs nuance about the "noise" being computational delay, not stochasticity.
      *   *User Hypothesis 2 (Traders as Computable Tests):* "Calibrated w.r.t every computable test." This is very close. The betting framing adds *adaptivity*. The trader sees the price *before* betting. This is like post-selection inference or adaptive data analysis. *Verdict:* The betting framing captures the *adversarial/adaptive* nature better than a static scoring rule.

      *   *Residue Report:*
          *   No i.i.d.: Correct. The sequence of theorems is deterministic, just revealed over time.
          *   Error bars: Epistemic (compute) vs. Aleatoric (measurement).
          *   Reflexivity: Traders see prices. Standard stats usually assumes fixed estimator vs. fixed data. This is game-theoretic.
          *   Rate-less limits: A major pain point for a experimentalist. In physics, a limit without a rate is often physically meaningless. In logic, it's unavoidable (Gödel).

  4.  **Refining the Vocabulary Mapping:**
      *   *Prices:* Sequence of estimators $\hat{p}_t$ for parameters $\theta \in \{0,1\}$.
