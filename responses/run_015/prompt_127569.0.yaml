  | **1** | Process (4) | Inherent (3) / Delegated (6) | Hostile (10) / Critical (7) |
  | **2** | Process (4) | Neutral (1) | Feminist (8) / Critical (7) |
  | **3** | Constructivist (5) | Critical (7) | Neutral (1) |
  | **4** | Hostile (10) | Neutral (1) | Postphenom (9) / Delegated (6) |
  | **5** | Constructivist (5) | Autonomous (2) | **Scale Emergent** (5/9) |
  | **6** | Constructivist (5) | Process (4) | Neutral (1) |
