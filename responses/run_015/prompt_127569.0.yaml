answer: |-
  # Part 1: The Logical Space & Tree

  To sort the ten theoretical positions without using their names, we establish four binary distinctions. Each position occupies a unique coordinate in this space, though some coordinates are crowded (collapsed leaves) and some are empty.

  ### The Four Separating Questions
  1.  **The Subversion Test:** If users actively try to defeat the artifact's bias, does the bias hold?
      *   *Fixed:* The design wins; resistance is costly or impossible.
      *   *Fluid:* The users win; the design is merely a suggestion.
  2.  **The Substitution Test:** If we achieve the same function with different materials or code, does the political problem vanish?
      *   *Material:* No; the physical arrangement itself encodes the order.
      *   *Intent:* Yes; the politics was in the creator's head, not the thing.
  3.  **The Origin Test:** Where did the injustice begin?
      *   *Production:* In the ownership, labor, or rules of making.
      *   *Deployment:* In the function, scale, or moment of use.
  4.  **The Exit Test:** Does refusing or removing the artifact solve the problem?
      *   *Removal:* Yes; the artifact is a harm that should not exist.
      *   *Redesign:* No; we need the function, but the relations must be rewritten.

  ### The Map of Positions
  | Position | Subversion | Substitution | Origin | Exit |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Neutral Instrument** | Fluid | Intent | Deployment | Removal |
  | **2. Autonomous Driver** | Fixed | Material | Deployment | Removal |
  | **3. Inherently Political** | Fixed | Material | Deployment | Redesign |
  | **4. Process/Development** | Fluid | Intent | Production | Redesign |
  | **5. Social Constructivist** | Fluid | Intent | Deployment | Redesign |
  | **6. Delegated Relations** | Fixed | Material | Deployment | Redesign |
  | **7. Critical Theory** | Fluid | Material | Production | Redesign |
  | **8. Feminist STS** | Fixed | Material | Production | Redesign |
  | **9. Postphenomenology** | Fixed | Material | Deployment | Redesign |
  | **10. Hostile Design as Harm**| Fixed | Material | Deployment | Removal |

  ### Unoccupied Cells (Theoretical Gaps)
  *   **Fixed / Intent / Production / Removal:** *Incoherent.* If the bias is in the intent/production but the object is fixed against subversion, the object itself is the barrier; removal becomes the only option, shifting it to "Hostile Design."
  *   **Fluid / Material / Deployment / Removal:** *Unattractive.* If the material is bias-free (fluid) but the politics emerge at deployment, removal is usually disproportionate to the risk; redesign is preferred.
  *   **Fixed / Intent / Deployment / Redesign:** *Unexplored.* A view where the designer's intent locks the outcome, but the object itself is not to blame, yet we must redesign the object anyway. Defensible, but rarely argued.

  ### Collapsed Leaves (Indistinguishable in this Instrument)
  *   **Critical Theory (7) vs. Feminist STS (8):** Both locate politics in production and demand redesign. This instrument cannot separate them without asking specifically about *gendered* ergonomics versus *class* hierarchy. To pry them apart, you would need a case involving care work or bodily safety specifically.
  *   **Autonomous Driver (2) vs. Postphenomenology (9):** Both see the artifact as fixed and material. The difference is whether the tech *drives* history (2) or *mediates* moral perception (9). A 4-minute quiz cannot distinguish "driving change" from "shaping perception."
  *   **Inherently Political (3) vs. Delegated Relations (6):** Nearly identical in practice. Separation requires asking if the artifact *is* a social relation (6) or merely *requires* one (3).

  ---

  # Part 2: The Diagnostic Instrument

  **Instructions:** Read each scenario. Choose the verdict that best matches your gut reaction. There are no right answers.

  **1. The Geofenced Scooter**
  A city approves e-scooters that automatically slow to walking speed inside three low-income neighborhoods. The operator says it is an insurance requirement; tenants say it restricts movement.
  *   A. The scooter is just a vehicle; the politics are in the insurance contract and the city's zoning laws.
  *   B. The firmware itself is a barrier; a scooter that cannot go fast is not a scooter, it is a gate.
  *   C. The problem is that the neighborhood was singled out; the same software in a rich area would be fine.

  **2. The Learning Thermostat**
  In a shared house, a smart thermostat learns the schedule of the tenant who adjusts it most often, keeping the others cold.
  *   A. It's a bad algorithm; it should be programmed to average everyone's input.
  *   B. It's a household dispute; the device just reveals who is dominant in the kitchen.
  *   C. The device assumes one schedule matters; it should be reset to manual for everyone.

  **3. The Shift-Drop App**
  A hospital app lets nurses drop a shift instantly but forbids them from offering it to a specific colleague, forcing them into a general pool.
  *   A. This protects fairness; it stops cliques from hoarding good shifts.
  *   B. This breaks solidarity; it prevents workers from helping each other directly.
  *   C. The app is neutral; management's policy on how the pool is filled is what matters.

  **4. The Remote Webcam**
  A school-issued laptop allows an administrator to turn on the webcam remotely without the light turning on.
  *   A. This is a surveillance tool; it should be physically removed or taped over.
  *   B. This is a security feature; the politics depend on whether the school is trustworthy.
  *   C. This changes the relationship; the student is no longer a user but a subject, regardless of intent.

  **5. The Cooperative Delivery Platform (Scale Case)**
  A driver-owned app lets members rate each other's punctuality. Individually, it's helpful feedback. At city scale, it creates a panic where no one dares be late.
  *   A. The tool is fine; the problem is the competitive pressure of the market they operate in.
  *   B. The rating feature is the problem; remove it, and the cooperation returns.
  *   C. The politics only exist because everyone uses it; individually, the button is harmless.

  **6. The Open-Source Tool**
  A software tool is built and governed entirely by the people who use it, yet it develops strict rules that exclude beginners.
  *   A. The code reflects the community; if the community is exclusionary, the tool will be too.
  *   B. The governance structure is flawed; it needs new rules to protect newcomers.
  *   C. The tool is neutral; beginners just need to learn the existing standards.

  **7. The Low Overpasses (Omission Case)**
  A city plans a bridge with low clearance. Engineers say it saves money. Critics say it will stop buses from passing. Historical records are unclear if a past builder intended to block buses or just cut costs.
  *   A. If the intent wasn't racist, the bridge is just a bridge; the bus route is a policy choice.
  *   B. A bridge that stops buses is a political act, regardless of who built it or why.
  *   C. The harm is what it prevents (bus access), not what it forces cars to do; fix the clearance.

  **8. The Tomato Harvester (Uncertainty Case)**
  A new machine harvests tomatoes faster but bruises them, requiring large canneries nearby. Small farmers might fail, but food might get cheaper.
  *   A. The machine dictates the farm size; you cannot have small farms with this harvester.
  *   B. The machine is a tool; farmers can choose to grow different crops or sell fresh.
  *   C. The risk is unknown; we should wait to see if the small farmers actually fail before judging.

  **9. The Self-Checkout Aisle**
  A supermarket replaces cashiers with kiosks. Customers scan their own goods.
  *   A. It transfers labor from the worker to the customer; the machine is a manager.
  *   B. It offers speed for those who want it; the politics are in who chooses to use it.
  *   C. It removes human interaction; the store becomes a warehouse, not a shop.

  **10. The Smart Doorbell**
  A doorbell records video and automatically shares footage with a local police network if a crime is reported nearby.
  *   A. It makes neighborhoods safer; the police partnership is a policy choice, not a design flaw.
  *   B. It turns every home into a police outpost; the sharing feature should be deleted.
  *   C. It changes how residents see their neighbors; they become suspects to be monitored.

