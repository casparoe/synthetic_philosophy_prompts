  | **9** | Critical (7) | Neutral (1) | Postphenom (9) |
  | **10** | Neutral (1) | Hostile (10) | Postphenom (9) |

  *(Note: Numbers in parentheses refer to the 10 Positions in Part 1.)*

  ### Result Profiles (The Leaves)
  Calculate which Position number appears most frequently in the user's selections.

  *   **Mostly 1 (Neutral):** *The Toolsmith.* You believe artifacts are instruments. Politics belongs to the users.
      *   *Consequence to swallow:* You must accept that a gun and a feather are morally identical until pulled.
  *   **Mostly 2 (Autonomous):** *The Determinist.* You believe technology drives history.
      *   *Consequence to swallow:* You must accept that human resistance is largely futile against technical progress.
  *   **Mostly 3 or 6 (Inherent/Delegated):** *The Architect.* You believe design encodes social order.
      *   *Consequence to swallow:* You must accept that changing society requires changing hardware, not just laws.
  *   **Mostly 4 or 5 (Process/Constructivist):** *The Organizer.* You believe politics is in the making or the community agreement.
      *   *Consequence to swallow:* You must accept that a perfectly built tool can still be unjust if the team is wrong.
  *   **Mostly 7 or 8 (Critical/Feminist):** *The Rewriter.* You believe hierarchy is built-in but can be coded differently.
      *   *Consequence to swallow:* You must accept that you cannot simply "remove" the tech; you must seize the means of production.
  *   **Mostly 9 (Postphenom):** *The Mediator.* You believe tools change how we perceive morality.
      *   *Consequence to swallow:* You must accept that you never make a decision alone; the tool is always voting with you.
  *   **Mostly 10 (Hostile Design):** *The Saboteur.* You believe some designs are harms to be removed.
      *   *Consequence to swallow:* You must accept that some conveniences are not worth having and should be destroyed.

  ### Tie-Break Rule
  If tied between **Neutral (1)** and any other: Default to the other. (The "Null Hypothesis" of neutrality is the default state; evidence is required to move away from it).
  If tied between **Critical (7)** and **Feminist (8)**: Report as "The Rewriter" (Collapsed Leaf).
  If tied between **Inherent (3)** and **Delegated (6)**: Report as "The Architect" (Collapsed Leaf).

