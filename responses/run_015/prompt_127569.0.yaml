  # Part 4: Editor's Note

  **To:** Interactives Desk
  **From:** [Your Name]
  **Re:** Politics of Artifacts Diagnostic

  **Load-Bearing Questions:**
  Questions **1 (Scooter)**, **4 (Webcam)**, and **7 (Overpasses)** are doing 80% of the sorting.
  *   **Q1** separates the "Neutral/Contract" view from the "Material/Firmware" view.
  *   **Q4** separates the "Removal/Harm" view from the "Redesign/Mediation" view.
  *   **Q7** isolates the "Intent" variable (due to the contested history clause). If a reader chooses Option A here, they are almost certainly a Neutral Instrumentalist regardless of other answers.

  **The "Unanswerable" Question:**
  Expect complaints on **Question 5 (Co-op Delivery)**. Readers will struggle to distinguish between "the tool causes the panic" and "the market causes the panic." This is intentional; it is the only question that tests for *emergent* politics (scale) versus *structural* politics. If a reader flags this, they are likely sitting on the fence between **Constructivist** and **Autonomous** positions.

  **Collapsed Leaves:**
  The scoring key groups **Critical Theory** and **Feminist STS** together, as well as **Inherently Political** and **Delegated Relations**. The text accompanying the results should note that these distinctions exist but require a longer interview to separate. Do not attempt to split them in the algorithm; the noise will outweigh the signal.

  **Print Flowchart:**
  For the print edition, simplify the flowchart to three branches:
  1.  **Is the bias in the User or the Object?** (Split Q1, Q7, Q8)
  2.  **Can the User defeat the bias?** (Split Q2, Q3, Q6)
  3.  **Should the Object be Removed or Rewritten?** (Split Q4, Q10)
  This reduces the 10 leaves to 4 printable quadrants, which maps cleanly to the "Result Profiles" in the Scoring Key.
