  ### Analysis of the Baseline Slide

  You have identified a genuine and persistent inconsistency in bioethical reasoning, specifically within the debate over the therapy-enhancement distinction. While the philosophical tension you describe is well-documented—most notably in critiques of Norman Daniels' framework of "normal species functioning"—there is **no single established fallacy name** for this specific rhetorical maneuver of swapping between the three baselines (historical, statistical, environmental) to preserve the "therapy" classification.

  In philosophical literature, this is often discussed under the header of **"The Problem of Normal Functioning"** or the **"Reference Class Problem"** in ethics. However, these describe the *conceptual difficulty*, not the *rhetorical tactic* of sliding between them to win an argument. Your observation isolates the mechanism used to shield the therapy/enhancement boundary from criticism.

  #### Distinction from Known Concepts
  1.  **Equivocation:** Standard equivocation relies on lexical ambiguity (e.g., using "light" to mean both "not heavy" and "photonic"). Your observed phenomenon is conceptual rather than lexical. The word "normal" or "baseline" isn't changing meaning so much as the *criteria for measurement* are being swapped without announcement. It is more structural than linguistic.
  2.  **Motte-and-Bailey:** In a Motte-and-Bailey, an arguer advances a controversial claim (the Bailey) and retreats to a defensible one (the Motte) when challenged. The baseline slide is subtly different: it is not necessarily a retreat from criticism, but a **proactive selection of convenience**. The arguer does not necessarily retreat to a "safe" baseline; they select the baseline that yields the desired classification for each specific case, maintaining the illusion of a consistent principle ("we only support therapy") while changing the principle's definition.

  #### Proposed Terminology
  Since no specific term exists for this tripartite sliding mechanism, I propose the term **"Normative Baseline Sliding."** This captures the shifting of the normative standard (the "ought") used to define the descriptive baseline (the "is").

  ### Boundary Conditions
  *   **Applies:** When an arguer classifies Intervention A as therapy using Baseline X (e.g., historical) and Intervention B as enhancement using Baseline Y (e.g., statistical) without providing a principled reason for why Baseline X applies to A but not B.
  *   **Does Not Apply:** When an arguer explicitly adopts one baseline (e.g., "We define therapy strictly as restoring species-typical function") and consistently applies it, even if it means classifying some restorative interventions (like restoring a unique individual talent lost) as enhancement. Consistency negates the slide.

