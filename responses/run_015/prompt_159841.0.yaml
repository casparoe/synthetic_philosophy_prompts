answer: |-
  ### Part 1: The Logical Space (The Branch Questions)

  These seven questions are designed to be answered in sequence. Some answers terminate the path (yielding a leaf); others force you deeper. They are phrased for a student holding a specific case in mind, not a theory.

  **Q1. The Tax Roll Case:** Look at the parish roll where entries for landless cottagers stop dead in 1750, while landholders continue. Is that blank space **missing data** (the cottagers died or left) or **data itself** (the system stopped counting them)?
  *   *A: Missing Data* → **Go to Leaf 1**
  *   *B: Data Itself* → **Go to Q2**

  **Q2. The Mechanism:** If the system stopped counting them, did the records once exist and get **destroyed/hidden** (someone burned the ledger), or were they **never written** because the ledger had no column for "cottager"?
  *   *A: Destroyed/Hidden* → **Go to Q3**
  *   *B: Never Written* → **Go to Q3**
      *(Note: See "The Supervisor's Objection" below for why these paths may collapse later.)*

  **Q3. The Line-Item Case:** Look at the colonial inventory where an enslaved person is listed as property, not a speaker. Does appearing as a line item count as **having a presence** in the archive, or is it **another form of silence**?
  *   *A: Having a Presence* → **Go to Leaf 2**
  *   *B: Another Silence* → **Go to Q4**

  **Q4. Quantitative Gaps:** In the tax roll, the sequence numbers jump from 400 to 450 with no explanation. Can you use the **math of that gap** to estimate how many people are missing, or is the gap too qualitative for numbers?
  *   *A: Use the Math* → **Go to Leaf 3**
  *   *B: Too Qualitative* → **Go to Q5**

  **Q5. Reading Traces:** You read the tax collector's notes to find what he had to **assume** about the cottagers to write his totals. Does this recover **the cottagers themselves**, or does it only describe **the collector's mindset**?
  *   *A: Describes the Collector* → **Go to Leaf 4**
  *   *B: Recovers the Cottagers* → **Go to Q6**

  **Q6. Elite Parity:** Look at the Estate Correspondence where a noble family never mentions their debts. Do you apply the **same suspicion** to this elite silence as you did to the cottagers' silence, or do **different rules apply**?
  *   *A: Different Rules (Elite silence is private; Subaltern silence is structural)* → **Go to Leaf 5**
  *   *B: Same Rules (All silence is produced by power)* → **Go to Q7**

  **Q7. The Remedy:** To fix this problem, should we **write better histories** (imaginative reconstruction, flagged as theory) or **build new archives** (change who records the present)?
  *   *A: Write Better Histories* → **Go to Leaf 6**
  *   *B: Build New Archives* → **Go to Leaf 7**

  *(Note: To reach 8-10 leaves, we split Q2's outcomes in the mapping phase, as the epistemic outcome differs slightly even if the evidentiary limit is similar.)*

  ***

  ### Part 2: The Leaves (Positions)

  Here are the 8 terminal positions generated by the logical space above. I have mapped them to the answer keys (e.g., 1-B-2-A...).

  **Leaf 1: The Positivist**
  *   **Path:** Q1-A (Silence is Missing Data).
  *   **Core Claim:** Silence is an absence of evidence, not evidence of absence. If they aren't there, they aren't history.
  *   **Awkward Commitment:** You must admit that history is exclusively the biography of the paperwork that survived.
  *   **Worst Case:** The Tax Roll (cannot explain why cottagers vanish while landholders remain without assuming mass death).

  **Leaf 2: The Empiricist-Revisionist**
  *   **Path:** Q1-B → Q2-A/B → Q3-A (Line Item = Presence).
  *   **Core Claim:** Being counted, even as property, is a form of agency/visibility. We can aggregate these line items to find the population.
  *   **Awkward Commitment:** You must treat being listed as a cow in an inventory as functionally similar to signing a petition.
  *   **Worst Case:** The Colonial Court (erases the ontological violence of being objectified).

  **Leaf 3: The Cliometrician**
  *   **Path:** Q1-B → Q2-A/B → Q3-B → Q4-A (Quant Gaps Admissible).
  *   **Core Claim:** The shape of the silence (missing sequences, totals) allows statistical inference about the unrecorded population.
  *   **Awkward Commitment:** You treat human lives as variables in an equation where the primary data is known to be corrupted.
  *   **Worst Case:** The Estate Correspondence (qualitative family dynamics resist sequence-number analysis).

  **Leaf 4: The Archival Skeptic**
  *   **Path:** Q1-B → Q2-A/B → Q3-B → Q4-B → Q5-A (Traces = Record Description).
  *   **Core Claim:** We can only know the archive, not the world. Reading traces tells us about the tax collector, not the cottager.
  *   **Awkward Commitment:** You surrender the possibility of ever writing history about the subaltern, only history about their oppressors.
  *   **Worst Case:** The Tax Roll (makes the cottagers permanently unknowable, which feels like conceding to the erasure).

  **Leaf 5: The Subalternist**
  *   **Path:** Q1-B → Q2-B → Q3-B → Q4-B → Q5-B → Q6-A (Different Rules for Elite).
  *   **Core Claim:** Elite silence is privacy; subaltern silence is structural violence. They require different hermeneutics.
  *   **Awkward Commitment:** You must defend a methodological dualism that risks making "subaltern history" a separate, unequal discipline.
  *   **Worst Case:** The Estate Correspondence (if you apply "structural violence" reading to elite debt silence, you might over-politicize private shame).

  **Leaf 6: The Microhistorian**
  *   **Path:** Q1-B → Q2-A → Q3-B → Q4-B → Q5-B → Q6-B → Q7-A (Epistemic Fix).
  *   **Core Claim:** We can recover the person through imaginative reconstruction based on traces, provided we flag it as theory.
  *   **Awkward Commitment:** You are writing fiction that is methodologically distinct from fiction only by your footnotes.
  *   **Worst Case:** The Colonial Court (imaginative reconstruction of an enslaved person's interiority from an inventory risks profound ventriloquism).

  **Leaf 7: The Archival Activist**
  *   **Path:** Q1-B → Q2-B → Q3-B → Q4-B → Q5-B → Q6-B → Q7-B (Institutional Fix).
  *   **Core Claim:** The gap cannot be filled epistemically; it must be fixed institutionally by changing who creates records now.
  *   **Awkward Commitment:** You offer no history of the past, only a policy proposal for the future.
  *   **Worst Case:** The Tax Roll (does not help the student write their dissertation on 1750).

  **Leaf 8: The Structuralist (The "Legibility" Position)**
  *   **Path:** Q1-B → Q2-B (Never Written) → Q3-B → Q4-B → Q5-B → Q6-B → Q7-A (but focused on System).
  *   **Core Claim:** The object of study is not the missing people, but the "legibility threshold" itself. The silence *is* the history.
  *   **Awkward Commitment:** You claim to study the poor while explicitly refusing to make claims about the poor.
  *   **Worst Case:** The Colonial Court (hard to maintain when facing a specific named individual in the inventory).

  ***

  ### Part 3: Analysis of the Instrument

  #### 1. The Supervisor's Objection (Suppression vs. Legibility)
  You asked me to flag if the **Q2 Branch** (Destroyed vs. Never Written) actually separates conclusions.
  *   **The Collapse:** In terms of *epistemic access* (Leaf 4, 6, 7, 8), these branches collapse. Whether the record was burned (Suppression) or never created (Legibility), the historian today faces the same void. You cannot recover the data either way without speculative inference.
  *   **The Divergence:** They only separate on **political attribution** and **remedy**.
      *   If **Suppression (Q2-A)**: The villain is an agent (the state, a person). The remedy is justice/recovery. (Leads toward Leaf 6).
      *   If **Legibility (Q2-B)**: The villain is a structure (the category system). The remedy is systemic change. (Leads toward Leaf 7 or 8).
  *   **Verdict:** The tree keeps them separate to force the student to choose a *cause*, but I have marked **Leaf 6** and **Leaf 8** as adjacent. If a student chooses Q2-A but ends up at Leaf 8, they are being incoherent (you can't study the "legibility threshold" if the records were legible and then burned).

  #### 2. Unoccupied/Incoherent Combinations
  There are logical combinations in this space that no serious historian occupies. I have pruned these from the Leaves above, but they exist in the raw logic:
  *   **The "Magical Realist" (Q1-B → Q4-A → Q5-B):** Believes silence is data, rejects quantitative gaps, but believes traces recover the person *without* imaginative reconstruction. *Why Unoccupied:* Incoherent. If you reject quant and accept traces, you are doing qualitative reconstruction (Leaf 6). If you reject reconstruction, you can't recover the person.
  *   **The "Elite Exceptionalist" (Q1-A → Q6-A):** Believes cottager silence is "missing data" (they died) but elite silence is "structural" (they hid debts). *Why Unattractive:* Methodological hypocrisy. It assumes subalterns are transparent until proven otherwise, and elites are opaque until proven otherwise.
  *   **The "Passive Activist" (Q1-B → Q7-B → Q2-A):** Wants to build new archives (Q7-B) because records were destroyed (Q2-A). *Why Unexplored:* If records were destroyed, the fight is usually legal/forensic (find the hidden cache). If you want to build *new* archives, you usually admit the old ones were structurally blind (Q2-B).

  #### 3. The Line-Item Distinction
  I placed the **Line-Item Question (Q3)** as a mandatory gatekeeper after the Mechanism question.
  *   **Why here?** It tests whether the student conflates "visibility" with "voice."
  *   **Decision:** It deserves its own branch because it splits the **Empiricist-Revisionists (Leaf 2)** from everyone else. If you treat the inventory entry as "presence," you skip the entire "Silence as Evidence" debate (Q4, Q5). You just count the bodies. This is a major methodological fork that shouldn't be buried inside "Mechanism."

  #### 4. Where the Leaves Blur
  *   **Leaf 6 (Microhistorian) and Leaf 8 (Structuralist):** These are the messiest neighbors. Both read traces (Q5-B). Both apply same rules to elites (Q6-B).
      *   *Distinction:* Leaf 6 uses the trace to write a biography of the person. Leaf 8 uses the trace to write a biography of the *system that obscured the person*.
      *   *Risk:* Students often slide from 6 into 8 without noticing they have stopped making claims about the human subject.
  *   **Leaf 4 (Archival Skeptic) and Leaf 7 (Archival Activist):** Both admit we cannot know the past people.
      *   *Distinction:* Leaf 4 stays in the seminar room (we can only know the archive). Leaf 7 goes to the funding agency (we must change the archive).
      *   *Risk:* Leaf 4 can look like cowardice; Leaf 7 can look like avoiding the historical work.

  ### Instructions for the Seminar
  1.  **Handout:** Give the students **Part 1** only. Ask them to circle their answers for their specific research project.
  2.  **Mapping:** Have them trace their line to a Leaf in **Part 2**.
  3.  **Discussion:** Ask the students who landed on **Leaf 6** and **Leaf 8** to swap papers. Ask them to find the sentence where their partner stopped writing about the *person* and started writing about the *structure*.
  4.  **The Trap:** Watch for students who answer **Q1-A** (Missing Data) but then try to argue **Q5-B** (Recovering the person). This is the most common first-year error: claiming the silence is accidental, then treating the silence as a puzzle to be solved. The tree forces them to admit that if it's just missing data, there is no puzzle, only a gap.
