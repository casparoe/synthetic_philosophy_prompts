      *   **Constraints:** No lecture, no citations/reading lists, American English, specific format (4 sections with paragraph counts).
      *   **The Stack:**
          1.  Deontological constraints are absolute in ordinary contexts (no weighing rights vs. aggregate good).
          2.  There's a "threshold" at the extreme (e.g., human extinction) where constraints become *pro tanto* (not absolute). Claims this isn't rule-utilitarianism because the shift is structural.
          3.  Paradox of deontology is a framing error. In catastrophic cases, refusing to violate is heroic, not blameworthy. But if you violate because you believed it necessary, you're still culpable (wrongness lives in the act).
          4.  Moral knowledge is fallible/humble. Negligent false belief doesn't excuse you.
          5.  Deontology is about structure of practical reasoning, not outcomes. Yet explanations for why framing is wrong point to consequentialist echoes (rotting social world, trust breaking down).

  2.  **Analyze the Tensions:**

      *   **Tension A: (1) & (2) vs. (3).**
          *   (1) says constraints are absolute (ordinary). (2) says threshold makes them *pro tanto* (extreme).
          *   (3) says if you violate in catastrophic cases, you're *culpable* because wrongness lives in the act.
          *   *Conflict:* If (2) is true (threshold deontology), then violating the constraint in a catastrophic case (above threshold) is *permitted* or even *required*. If it's permitted/required, why is the agent culpable (3)? (3) suggests the act remains wrong ("wrongness lives in the act") even if necessary. This is a classic "dirty hands" problem. But (2) says the constraint becomes *pro tanto*, implying it can be overridden. If it's overridden, is it still wrong? (3) says yes. (2) implies it might not be (since it's no longer absolute).
          *   *Severity:* High. This strikes at the coherence of the threshold view. If the constraint is overridden, is the act wrong? If yes, why override it? If no, why culpable?

      *   **Tension B: (5) vs. (1) & (2).**
          *   (5) says deontology is about structure/reasoning, not outcomes. But the justification for the constraint (why framing is wrong) relies on outcomes (trust breaking down, rotting social world).
          *   *Conflict:* This is the classic "consequentialization of deontology" worry. If the *reason* for the rule is consequentialist (social rot), then isn't the view fundamentally consequentialist? (1) claims no weighing against aggregate good, but (5) admits the justification relies on bad outcomes (just broader ones).
          *   *Severity:* Medium-High. It threatens the self-identification as a deontologist. If the grounding is consequentialist, it's indirect consequentialism.

      *   **Tension C: (3) & (4).**
          *   (3) says if you violate because you believed it necessary, you're still culpable (wrongness in act).
          *   (4) says moral knowledge is fallible, but negligent false belief doesn't excuse.
          *   *Conflict:* These actually seem consistent. (4) supports (3). If you negligently believe it's okay, you're culpable. (3) says even if you sincerely believe it's necessary, you're culpable.
