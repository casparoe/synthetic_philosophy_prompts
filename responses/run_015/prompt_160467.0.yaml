      *   *Best Consistent Argument:* Treat it like Case 2 (Riot) but with Case 5 (Regiment) sensitivity. The *event* (displacement) is real (supported by records), the *mode* (the Walk) is symbolic.
      *   *Wait, the Grazing Claim:* This is the elephant in the room. The Commission rules on monuments/text, not land rights. But the Walk supports the claim.
