answer: |-
  Here is a reconstruction of the commission's implicit jurisprudence, applied to the Annerdale case, followed by an assessment of where your precedents actually break down.

  ### I. The Reconstructed Jurisprudence
  Looking at the six prior rulings, the Commission is not applying a single standard of "truth." It is balancing **Epistemic Authority** (what we can know) against **Social Function** (what the memory *does*). Three rules emerge from the minutes:

  **1. The Verification Rule (Precedents 1, 3, 4)**
  *Documentary or physical evidence overrides oral tradition, unless the documentary record is structurally incapable of capturing the event.*
  *   **Why:** In *Carrowmore* (1), the record (muster rolls) existed and contradicted the story (novel). In *Treaty* (4), the instrument corrected the plaque. In *The Bend* (3), the record was silent (no administration), so oral memory + archaeology became the authoritative record.
  *   **Threshold:** The record must be competent to speak to the event. If the record is silent due to administrative absence, memory fills the vacuum.

  **2. The Proportionality Rule (Precedents 2, 5, 6)**
  *The remedy must match the social harm of the error versus the social cost of correction.*
  *   **Why:** In *Twelve Days* (2), the error (violence vs. petition) was factual, but the memory served a civic function (origin of self-gov). Correction was minimal (one sentence). In *Regiment* (5), the error (liberators vs. reprisals) involved moral harm to victims. The memorial was moved, not destroyed, balancing respect for descendants with historical honesty. In *Long Summer* (6), no historical claim was made, so no jurisdiction existed.
  *   **Threshold:** If the memory is "load-bearing" for community identity but factually flawed, contextualize rather than erase. If the memory actively obscures victimhood, relocate or reframe.

  **3. The Adversarial Caveat (Precedent 3 & 5 combined)**
  *Records produced by the victors or administrators in a coercive context do not automatically invalidate community memory of suffering.*
  *   **Why:** *The Bend* (3) accepts memory over silence because the state wasn't there to record. *Regiment* (5) accepts the commander's report *against* the memory, but notes the descendants' objection. The Commission acknowledges that official records can be morally incomplete even if factually accurate.
  *   **Threshold:** When the record is one-sided, the burden of proof shifts. The record must be corroborated or shown to be free of structural bias to override memory of trauma.

  ---

  ### II. Application to Annerdale
  The Annerdale case is the first time these rules collide. You have a **Verification** conflict (Record says 2 families walked; Memory says all), a **Proportionality** spike (Identity + Legal Rights), and an **Adversarial** complication (Records are from the evictors).

  Here are the three options generated by prioritizing these rules differently:

  **Option A: The "Carrowmore" Ruling (Prioritize Verification)**
  *   **Logic:** The archive exists. It is specific (poor-law registers, burgess minutes). It contradicts the core claim (the Walk). The Factor's prior dishonesty taints the *compensation* dispute, not necessarily the *logistics* register.
  *   **Precedent:** Closest to *Carrowmore* (1). The story is a later consolidation of a complex event into a single mythic journey.
  *   **Outcome:** The Commission rules the Walk is historically inaccurate. The ritual may continue as folklore, but it cannot be presented as historical reenactment. The grazing-rights claim loses the Commission's implicit stamp of historical approval.
  *   **Risk:** Destroys the "load-bearing" identity function. Ignores the Adversarial Caveat.

  **Option B: The "Twelve Days" Ruling (Prioritize Proportionality)**
  *   **Logic:** The core truth (displacement/clearance) is supported by the records. The specific mechanism (walking vs. cart) is a detail. The Walk is central to identity.
  *   **Precedent:** Closest to *Twelve Days* (2).
  *   **Outcome:** The Walk continues. A permanent panel is installed at the start/end point noting the archival findings (that most were shipped, only two families walked). The narrative shifts from "The Walk of 1799" to "The Displacement of 1799–1802."
  *   **Risk:** Doesn't fully address the Adversarial Caveat. The coastal society will argue this validates a lie used for legal claims.

  **Option C: The "Bend" Exception (Prioritize Adversarial Caveat)**
  *   **Logic:** The records are produced by the evictors. They have a motive to minimize the scale and cruelty of the removal (hence the Factor's prior lies). Oral tradition preserves the *experience* of the removal (the hardship of the journey), which the administrative record ignores. The "Walk" is a composite memory of the trauma, not a bus manifest.
  *   **Precedent:** Closest to *The Bend* (3), treating the oral tradition as a counter-archive to the biased estate papers.
  *   **Outcome:** Memory accepted as authoritative regarding the *experience* of displacement. The Walk is validated as a true commemoration of the event, despite the logistical discrepancies.
  *   **Risk:** Undermines the Verification Rule. Opens the Commission to accusations of privileging emotion over data.

  ---

  ### III. Prediction vs. Prescription

  **What the Commission Will Do:**
  They will choose **Option B (The "Twelve Days" Compromise)**.
  *   **Reasoning:** It is the path of least resistance. It acknowledges the new archive (satisfying the historians and the coastal society) without destroying the ritual (satisfying the hill families). It treats the "Walk" as a symbolic container for the "Clearance," similar to how the "Riot" plaque was kept despite the lack of violence.
  *   **Confidence:** High. Commissions rarely choose total erasure (Option A) for living traditions, and Option C is too radical a departure from the evidentiary standard in Case 1.

  **What the Commission Should Do (for Consistency):**
  They should choose **Option B, but with the reasoning of Option C.**
  *   **Reasoning:** To be consistent with *The Bend* (3) and *Regiment* (5), they must explicitly acknowledge the **bias of the archive**. A simple addendum (Option B) implies the Record is neutral and the Memory is slightly wrong. That contradicts *The Bend*, where silence allowed memory to rule. Here, the record is *present but hostile*.
  *   **The Fix:** The ruling should state that the Walk is historically valid *as a commemoration of forced displacement*, which the records confirm occurred, even if the *logistics* are disputed by the displacers' own ledgers. The panel should not just say "Records show 2 families walked." It should say "Records kept by the Estate show 2 families walked; oral tradition maintains the hardship of the journey. The clearance itself is undisputed."
  *   **Why:** This protects the grazing claim's core premise (we were cleared) without validating the specific forensic claim (we walked 90 miles) that the archive contradicts. It separates the *moral truth* (we were victims of clearance) from the *forensic truth* (how we got to the coast).

  ---

  ### IV. The Tipping Point: What Separates the Rules?
  You asked what evidence or future case would separate these rules. The precedents underdetermine this case because we don't know where the Commission draws the line on **Archival Hostility**.

  **The Separating Evidence:**
  You need to know if the Factor's prior lie (understating households in the compensation dispute) was about the **logistics of removal** or just the **headcount for payment**.
  *   **Scenario 1:** If the Factor lied about the *number of people* to save money, but the *method* (cart vs. walk) was recorded neutrally for logistics, the Record wins on the Walk. (Leads to Option B).
  *   **Scenario 2:** If the Factor lied about the *method* to make the removal look more humane/ordered (e.g., billing for carts that weren't used), then the Record is demonstrably fraudulent regarding the journey. (Leads to Option C).

  **The Separating Future Case:**
  You need a case where the **Documentary Record exists, is adversarial, and is proven accurate, yet contradicts a trauma memory.**
  *   *Current Gap:* In *Regiment* (5), the record was accurate (commander's report) and memory lost (contextualized). In *The Bend* (3), the record was silent and memory won.
  *   *The Missing Link:* A case where the record says "We moved them gently by cart" (adversarial), the memory says "We were marched at gunpoint" (trauma), and independent evidence (e.g., a neutral third-party diary) proves the **record lied**.
  *   **Principle:** If the Commission rules that Memory wins *only* when the Record is silent (Case 3), they are saying **Archival Presence > Oral Tradition**, regardless of bias. If they rule Memory wins when the Record is *proven biased* (Annerdale), they are saying **Archival Integrity > Archival Presence**.
  *   **Your Decision:** You need to ask the Commission: *Does the mere existence of a document outweigh its provenance?* If yes, Annerdale memory falls. If no, Annerdale memory stands.

  ---

  ### V. Critique of the Setup
  You asked me to be honest about whether you've set the problem up badly. There is a structural flaw in the Options Paper as you've described it.

  **1. The "Grazing Rights" Elephant**
  The Commission rules on *commemoration* (plaques, walks, texts). The Annerdale Walk is being used as *evidence* in a legal tribunal for land rights.
  *   **The Problem:** By ruling on the Walk, the Commission is effectively ruling on the grazing claim, which is outside its jurisdiction.
  *   **The Risk:** If they validate the Walk (Option C), they are interfering in a legal property dispute. If they invalidate it (Option A), they are destroying a community's leverage.
  *   **Recommendation:** Your options paper must explicitly **sever the commemorative ruling from the legal utility.** The Commission should state: *"We rule on the historical accuracy of the commemoration, not the legal validity of the rights claim."* If you don't draw this line, the Commission is acting as a shadow land court.

  **2. The "Silent vs. One-Sided" Gap**
  You noted the gap between "record is silent" (Case 3) and "record is one-sided" (Annerdale). This is the weakest link in your precedent chain.
  *   **The Issue:** Case 3 relies on archaeology (bodies). Annerdale relies on... the Factor's credibility. You don't have "bodies" for the Walk. You have a he-said/she-said between a Ledger and a Song.
  *   **The Fix:** You need to frame the "Walk" not as a forensic claim (did feet touch this road?) but as a **composite memory**. In history, "The Retreat from Moscow" happened, even if not every soldier walked every step.
  *   **Advice:** Don't let the Commission get bogged down in "Did they walk?" Frame it as "Does this ritual accurately commemorate the *Clearance*?" The records prove the Clearance. The Walk commemorates the Clearance. The logistics are secondary. This allows you to use Precedent 2 (Riot) without falling into Precedent 1 (Mural).

  **3. Confidence Level**
  *   **High Confidence:** The Commission will choose the Compromise (Option B). They are risk-averse.
  *   **Medium Confidence:** The "Adversarial Caveat" is the right lens for consistency, but the Commission may lack the spine to apply it against a physical archive.
  *   **Low Confidence:** Whether the Factor's prior lie is sufficient to taint the logistics register. This is the evidentiary weak spot. If the lawyers on the commission dig into that, the whole "biased record" argument collapses.

  **Final Word:**
  Your options paper should not ask "Which is true?" It should ask "What is the function of this memory, and does the archive destroy that function?" If the function is "We were cleared," the archive supports it. If the function is "We walked," the archive destroys it. Your job is to tell the Commission which function they are protecting. I suspect they want to protect the former while acknowledging the latter. Write the options to force them to choose that distinction.
