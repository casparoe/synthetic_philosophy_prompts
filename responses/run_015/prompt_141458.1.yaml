answer: |-
  You must acknowledge in the talk that compute is currently concentrated, or the military historian will dismantle your nuke ranking before you reach the Q&A.

  **Early Concessions (First Two Minutes of Q&A)**
  Volunteer these before they're used as weapons against you. It disarms the postgrads and shows you've thought about the edges of your own argument.
  1.  **Concede Velocity:** Admit that software updates faster than physical printing. Your point isn't about the speed of the *tool*, but the speed of *institutional adoption*.
  2.  **Concede Compute Concentration:** Acknowledge that training frontier models currently looks like the Manhattan Project. Your counter is that inference (using the tech) is democratising faster than training ever did.
  3.  **Concede Scope:** State clearly that your test is for *historical* analogies. If AI breaks the human bottleneck entirely, your framework expires. That's a feature, not a bug.

  **Objections Ordered by Damage**

  **1. The "Compute is Uranium" Objection**
  *   **Who:** The Military Historian.
  *   **Phrase:** "You argue nuclear tech was gated by state-sized know-how, but frontier AI requires compute clusters worth hundreds of millions, accessible only to firms with state ties. Isn't compute the new uranium, making the nuclear analogy the strongest one?"
  *   **Reply:** "That's the strongest counter, and today it holds water. But in logistics, you watch where the bottleneck moves. Uranium enrichment never got cheaper or easier; it stayed hard. Compute efficiency tends to improve, and cloud access means you can rent power without owning the plant. The nuclear analogy assumes the bottleneck stays fixed at 'production'. I'm arguing the bottleneck shifts to 'integration'. If compute stays state-gated forever, you're right, and the nuke analogy wins. But history shows hardware costs usually fall, whereas regulatory friction stays high. I'm betting on the friction, not the hardware."
  *   **Soft Spot:** You're betting on a trend (hardware democratisation) that isn't guaranteed. If chip exports tighten further, their point stands.
  *   **Historical Flag:** [The claim that uranium enrichment never got easier is generally accepted, but specific cost trajectories are complex.]

  **2. The "Software Speed Compresses Time" Objection**
  *   **Who:** A Working Developer.
  *   **Phrase:** "Printing press effects waited on literacy and distribution. AI updates over the air. Doesn't that compress the 'waiting around' you described, making the timeline short regardless of the bottleneck?"
  *   **Reply:** "Think of it like warehouse software. You can push an update overnight, but if the pickers don't trust it or the insurance company hasn't signed off, productivity doesn't change. The model updates fast, but the liability, hiring, and workflow changes move at human speed. With print, you had to learn to read. With AI, you have to learn to trust the output in high-stakes environments. That institutional friction is the real timeline, not the software release cycle."
  *   **Soft Spot:** Institutional adoption *is* faster now than in the 15th century. You're assuming modern bureaucracy is as slow as early modern literacy campaigns, which might be optimistic for your timeline.
  *   **Historical Flag:** [Literacy rates remained low for centuries after Gutenberg, but exact timelines vary by region.]

  **3. The "Non-Human Gatekeeper" Objection**
  *   **Who:** A Philosophy/STS Postgrad.
  *   **Phrase:** "Your test asks who the gatekeepers are. What if the gatekeeper is the alignment filter or the model itself deciding what to output, rather than a human institution?"
  *   **Reply:** "Even if the model filters the output, a human set the filter. In logistics, the scanner decides what goes in the box, but a manager programmed the scanner. The gatekeeper shifts from the printer to the platform policy team, but it's still a human decision upstream. Unless the model is choosing its own objectives without human input, the 'who' is still a person or a company."
  *   **Soft Spot:** If models become agentic enough to bypass their own filters or rewrite their own goals, the human link breaks. You're assuming human oversight remains in the loop.

  **4. The "Distribution Network" Objection**
  *   **Who:** The Print Historian.
  *   **Phrase:** "The internet isn't the printing press. Distribution is near-zero cost now. Doesn't that break the literacy and distribution bottleneck you're relying on?"
  *   **Reply:** "Distribution of bits is cheap, but distribution of trust isn't. With print, the bottleneck was getting the book. Now, the bottleneck is knowing which prompt works and which output is safe. We're moving from a scarcity of information to a scarcity of verification. The gatekeepers aren't the ones shipping the books anymore; they're the ones certifying the truth. That's still a bottleneck, just a different one."
  *   **Soft Spot:** 'Trust' is harder to measure than 'books printed'. It's a softer metric to hang an argument on.

  **The One You Hope Nobody Asks**

  **Recursive Self-Improvement**
  *   **Who:** Anyone who's read too many alignment blogs (likely a Dev or Postgrad).
  *   **Phrase:** "What happens when AI lifts the bottleneck itself by designing better chips or writing better code without humans? Your test relies on human gatekeepers."
  *   **Reply:** "Then the analogy breaks, and we're in new territory. My test is for comparing AI to human history. If AI leaves human history behind by removing the human bottleneck, my framework expires. I'd take that as a signal to stop looking at history and start looking at safety engineering, because the social science analogues no longer apply."
  *   **Soft Spot:** This admits your entire talk becomes irrelevant exactly when the risk might be highest. It's an honest answer, but it undermines your authority on the subject if the room believes recursive improvement is imminent.
