  *   **Mathematical Derivations ($f_{kelly}, f_{med}, f_{EV}$):** **100% Confidence.** These are closed-form solutions for binary bets.
  *   **Binomial Median Calculation ($n=5, p=0.55$):** **100% Confidence.** The cumulative probabilities are easily verified by hand and show a unique median at $k=3$.
  *   **Wealth Separation (>2%):** **100% Confidence.** $1.10592 / 1.07811$ is robustly above 1.02.
  *   **Philosophical Interpretation (Kelly robustness vs. Median fragility):** **90% Confidence.** While the horizon-dependence of median maximization is a standard critique, there are niche defenses regarding "goal-reaching" probabilities that I have sidelined for clarity.
  *   **Least Sure Claim:** The **"Realistic"** nature of $n=5$. While I have framed it as a quarterly project cycle, real firms often view opportunities as a continuous flow. If a critic argues that no rational firm fixes $n$ so rigidly that they cannot adjust $f$ after the first project, the practical force of the example diminishes, even if the mathematical contradiction remains. I am least sure that this specific constraint ($n=5$) survives contact with actual operational flexibility without modification.
