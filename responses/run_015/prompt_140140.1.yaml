answer: |-
  ### The Scenario: Five Projects, One Quarter

  A boutique quantitative firm has identified **five** independent, non-divisible investment opportunities for the coming quarter ($n=5$). Each opportunity requires committing a fixed fraction $f$ of the firm's current working capital. Based on back-testing, the firm estimates a **55% probability of success** ($p=0.55$) for each venture. A successful venture returns the stake plus an equal profit (doubling the stake), while a failure loses the stake entirely. The firm must choose a single sizing fraction $f \in [0,1]$ to apply to all five opportunities, with no capital injected or withdrawn mid-quarter. The goal is to determine the optimal $f$ under three competing rationalities.

  ### (a) The Three Verdicts

  We calculate the terminal wealth $W_5 = W_0 (1+f)^k (1-f)^{5-k}$, where $k$ is the number of successes.

  1.  **The Kelly Criterion (Maximize Expected Log Wealth):**
      *   **Quantity:** $E[\ln(W_5/W_0)] = 5 [p \ln(1+f) + (1-p) \ln(1-f)]$.
      *   **Optimal Stake:** The standard solution for even-money bets is $f^* = 2p - 1$.
      *   **Verdict:** $f_{kelly} = 2(0.55) - 1 = \mathbf{0.10}$ **(10%)**.
      *   **Resulting Median Wealth:** At $f=0.10$, we evaluate wealth at the median outcome (derived below as $k=3$): $1.10^3 \times 0.90^2 = \mathbf{1.0781}$.

  2.  **The Median Criterion (Maximize Median Terminal Wealth):**
      *   **Quantity:** The 50th percentile of the terminal wealth distribution. Since wealth is monotonic in $k$, this is wealth at the median number of wins, $m$.
      *   **Determining $m$:** We sum binomial probabilities for $n=5, p=0.55$:
          *   $P(k=0) = 0.45^5 \approx 0.0185$
          *   $P(k=1) = 5(0.55)(0.45^4) \approx 0.1128$
          *   $P(k=2) = 10(0.55^2)(0.45^3) \approx 0.2757$
          *   Cumulative $P(k \le 2) \approx 0.4070$. Since this is $< 0.5$, the median is not 2.
          *   $P(k=3) = 10(0.55^3)(0.45^2) \approx 0.3369$. Cumulative $P(k \le 3) \approx 0.7439$.
          *   The unique median number of wins is **$m=3$**.
      *   **Optimal Stake:** Maximize $(1+f)^3 (1-f)^2$. Setting the derivative to zero yields $f = \frac{2m}{n} - 1$.
      *   **Verdict:** $f_{med} = \frac{2(3)}{5} - 1 = \mathbf{0.20}$ **(20%)**.
      *   **Resulting Median Wealth:** $1.20^3 \times 0.80^2 = \mathbf{1.1059}$.
      *   **Separation:** $1.1059 / 1.0781 \approx 1.0258$. The median outcome is **2.58% higher** than under Kelly.

  3.  **The Expectation Criterion (Maximize Expected Terminal Wealth):**
      *   **Quantity:** $E[W_5] = W_0 [p(1+f) + (1-p)(1-f)]^5 = W_0 [1 + f(2p-1)]^5$.
      *   **Optimal Stake:** Since $2p-1 > 0$, this is linear and increasing in $f$.
      *   **Verdict:** $f_{EV} = \mathbf{1.00}$ **(100%)**.
      *   **Note:** This sits at the boundary, distinct from the interior solutions of Kelly and Median.

  ### (b) The Feature Doing the Work

  Your hunch is correct: the divergence is driven by the **skew of the binomial distribution** over a short horizon.

  Kelly maximizes the *geometric mean* growth rate, which relies on the probability-weighted average of outcomes (the mean win rate $p$). Median maximization relies on the *most typical* path (the median win count $m$). In a binomial distribution with $p > 0.5$, the skew is negative (the left tail of losses is longer than the right tail of wins). This pulls the mean $np$ below the median $m$.

  *   Mean wins: $np = 5 \times 0.55 = 2.75$.
  *   Median wins: $m = 3$.

  Because the "typical" outcome (3 wins) is more optimistic than the probability-weighted average (2.75 wins), the median-maximizer bets more aggressively. The general expression for the median-optimal stake in this binary setup is:
  $$ f_{med} = \frac{2m}{n} - 1 $$
  where $m$ is the median of $\text{Bin}(n,p)$. Whenever $m > np$, $f_{med} > f_{kelly}$.

  ### (c) Removing the Feature

  To close the gap, we must align the median win count with the mean win count. This occurs asymptotically as $n \to \infty$, or coincidentally when $np$ is an integer and the distribution is symmetric enough around it.

  **Variant:** Increase the horizon to **$n=20$** (keeping $p=0.55$).
  *   Mean wins: $np = 11$.
  *   Median wins: For $n=20, p=0.55$, the median is also 11 (Cumulative $P(k \le 10) \approx 0.41$, $P(k \le 11) \approx 0.59$).
  *   Here $m = np$.
  *   $f_{kelly} = 0.10$.
  *   $f_{med} = \frac{2(11)}{20} - 1 = 0.10$.

  **Why:** As $n$ grows, the Law of Large Numbers forces the distribution to concentrate around the mean. The skewness proportional to $1/\sqrt{n}$ vanishes. The "typical" path and the "average" path converge, restoring the coincidence between Kelly and Median criteria.

  ### (d) Honest Assessment

  This example establishes a **real but fragile disagreement**. It is not an artifact of rounding; the 2.58% gain in median wealth is mathematically exact for this horizon. However, it highlights a critical weakness in Median Maximization: **horizon dependence**.

  If the firm discovers a 6th opportunity mid-quarter, the Kelly stake remains 10% (myopic optimality). The Median stake, however, may jump discontinuously. For $n=6, p=0.55$, the median wins $m$ remains 3 (Cumulative $P(k \le 3) \approx 0.55$). The new median stake would be $f = 2(3/6) - 1 = 0.00$. The optimal strategy would collapse from 20% to 0% simply because the horizon extended by one round.

  **Which criterion to adopt?** A geometric rationalist should adopt **Kelly**. The Median defense—that it guarantees a better outcome in the "middle" case—fails to compose. It treats the decision problem as a single-shot bundle rather than a compounding process. The Kelly rule is the only one that maximizes the long-run growth rate regardless of when you stop. The Median rule optimizes for a specific destination, making it vulnerable to "horizon arbitrage" where the optimal bet size oscillates wildly with the countdown clock.

  ### (e) Closing

  For the practitioner sizing a real bet, this matters because optimizing for the median of a fixed horizon can silently saddle you with a negative expected growth rate if the horizon extends unexpectedly, whereas Kelly ensures your wealth compounds positively whenever you have an edge.

