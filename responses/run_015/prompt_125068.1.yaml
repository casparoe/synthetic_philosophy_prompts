answer: |-
  ### Where the argument breaks

  The false step is claiming attainable-range normalization is "forced by the mathematics." VNM uniqueness entails that *some* calibration is needed for comparison, but it does not dictate *which* calibration. Your method imposes a specific ethical weight: it treats a person's total stake in the decision as the denominator for their welfare. This is a substantive ethical choice, not a mathematical necessity. Trivially true: VNM scales are affine. False: Menu dependence is a discretization artifact; it is a structural violation of Independence of Irrelevant Alternatives (IIA). True only on an unearned reading: That fixing min/max exhausts the "freedom" in a normatively neutral way. It exhausts the *degrees of freedom*, but the *location* of those anchors is an informational/ethical input, not a logical deduction. You have conflated solving an identification problem with solving an evaluation problem.

  ### What affine uniqueness does and does not entail

  Affine uniqueness means the numerical representation contains no *intrinsic* information about interpersonal magnitude. It does not entail that interpersonal comparisons are metaphysically impossible or meaningless; rather, the VNM framework itself is informationally impoverished regarding them. The representation theorem maps preferences over lotteries to real numbers. It guarantees consistency within an agent, not across agents. To compare, you need additional data or assumptions external to the preference ordering (e.g., neurophysiological data, extended sympathy, or ethical conventions). The "impossibility" is not that we cannot define a comparison, but that preference data alone cannot generate one. Distinguishing "silent" from "impossible" is crucial: the former invites additional axioms (like Measurability and Comparability conditions in Social Choice), while the latter suggests a conceptual dead-end. The scale is interval, not ratio. While ratios of differences are invariant within a person, they are not across persons without a bridge principle. Consequently, claiming comparisons are "ill-formed" confuses the map with the territory. The utility function is a model of preference, not the welfare itself. If welfare has a common metric, VNM merely fails to capture it without augmentation. Your tool assumes the latter is solved by convention, but the convention itself carries ethical weight equivalent to choosing a social welfare function.

  ### Attainable-range normalization: what it buys and what it costs

  The menu-dependence you observed is a structural feature, not an artifact. By defining the unit of utility as the range of the *current feasible set*, you make utility contingent on the choice set. This violates the Independence of Irrelevant Alternatives (IIA). If a utopian but infeasible option were added, everyone's normalized utility would shrink, altering trade-offs between realistic options. More critically, this scheme redistributes weight based on stakes. A person with a wide range of outcomes (high stakes) gets a larger "unit" of utility, meaning a given absolute change in their welfare counts for *less* in the sum than the same change for a person with a narrow range (low stakes). This penalizes individuals facing high-variance policies. If Policy X risks ruin for Person A but offers modest gains for Person B, normalization shrinks A's losses relative to B's gains because A's range is wider. The scheme systematically biases against protecting those with the most to lose. Conversely, if the "worst" outcome is catastrophic for one person but mild for another, normalizing both to 0 equates their disaster levels. You are implicitly adopting a specific form of relative utilitarianism. This is a defensible ethical stance, but it is not a mathematical cleanup. It converts cardinal utility into a measure of *proportion of potential gain/loss*, which is distinct from welfare intensity. The IIA violation is the price of making the unit dependent on the menu.

  ### Is interpersonal comparison impossible? What the impossibility results say

  Arrow's Impossibility Theorem assumes ordinal, non-comparable utilities. It does not prove interpersonal comparison is impossible; it proves that *without* it (and other conditions), no SWF exists. Sen's work demonstrates that enriching the informational base to include cardinal unit comparability or level comparability escapes Arrow's result. The "impossibility" in your context is not a theorem banning comparison, but the lack of empirical observability. Stated-preference lotteries reveal $u_i$ only up to affine transformation. There is no behavioral test within standard decision theory to verify if my "1 util" equals your "1 util." However, Social Choice theory (e.g., d'Aspremont and Gevers) classifies SWFs based on informational assumptions. If you *assume* full cardinal unit comparability, Utilitarianism is characterized. If you assume only ordinal comparability, other rules apply. The theorems do not rule out making the assumption; they rule out deriving the result *without* it. Your tool makes the assumption via normalization, but must acknowledge it as an axiom, not a derivation. The impossibility results establish that you cannot have everything: if you want a complete social ordering satisfying weak equity and Pareto, you must accept either interpersonal comparability or a dictatorship. Since you reject dictatorship, you must explicitly accept the comparability axiom.

  ### Comparability versus aggregation

  Securing comparability does not entail summation. Comparability ensures that the vector of utilities $(u_1, \dots, u_n)$ has invariant meaning across transformations. Aggregation is the rule mapping that vector to a social ranking. Summation (Utilitarianism) is just one such rule. One could have fully comparable utilities but adopt a Prioritarian rule (summing concave transformations), a Leximin rule (maximin), or a Nash Social Welfare function (product). Treating "comparable" and "additive" as a single requirement conflates measurement with evaluation. You can measure height comparably without deciding that the "best" group is the one with the greatest sum of heights. Your normalization secures a form of unit comparability, but the decision to sum is a separate ethical commitment to neutrality and risk neutrality at the social level. Even with fixed units, one might argue that a unit of utility for the worse-off matters more. Comparability allows you to make that trade-off consistently; it does not dictate that the trade-off rate must be one-to-one.

  ### A defensible procedure for the tool

  Do not use the feasible set for normalization. Fix anchors externally (e.g., "death" = 0, "perfect health" = 1, or a standard basket of goods). This removes menu dependence. Acknowledge that equating units across persons is an ethical axiom, not a mathematical fix. Explicitly document that the tool implements Relative Utilitarianism (if keeping range norm) or Classical Utilitarianism (if fixing external anchors). Allow the user to select the aggregation rule (Sum vs. Prioritarian) separately from the utility measurement. The mathematics cannot choose the anchors or the aggregation rule; these must be policy choices made by the organization's leadership. The tool should output sensitivity analyses showing how rankings change under different normalizations or aggregation rules, rather than presenting one "mathematically forced" ranking. Transparency about the ethical axioms is the only way to defend the tool against the charge of arbitrariness. The "snag" is resolved not by better math, but by clearer governance.
