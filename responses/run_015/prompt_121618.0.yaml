answer: |-
  You have a very sharp eye for aesthetic history. You've basically rediscovered a tension that has driven philosophy of art for the last 200 years.

  Here is the breakdown of the philosopher, the name of the pattern, and whether your skepticism about noise and silence holds up.

  ### 1. The Old Philosopher
  The philosopher you are thinking of is almost certainly **Arthur Schopenhauer** (late 18th/early 19th century).

  In *The World as Will and Representation*, he argues exactly what you described. He says painting, sculpture, and literature are copies of "shadows" (physical objects in the world). But music? He claims music skips the shadows entirely. It is a direct copy of the **Will** (the underlying, chaotic, driving force of reality itself).

  For Schopenhauer, music doesn't represent "sadness" (a human emotion); it represents the *structure* of sadness itself, without needing a sad person to exist. Nietzsche picked this up later, calling music "Dionysian" (raw reality) vs. the "Apollonian" (ordered images).

  ### 2. Is There a Name for This Pattern?
  There isn't one single catchy phrase, but in aesthetics, this is usually discussed under **Metaphysical Aesthetics** or the **Hierarchy of the Arts**.

  The specific logical move you identified—stripping away representation to get closer to truth—is often called the **Via Negativa** (the negative way) applied to art. It's borrowed from theology: you can't describe God by saying what He *is*, only by saying what He *is not*.

  So, the argument goes:
  *   Painting = Removes silence (adds image).
  *   Tonal Music = Removes noise (adds order).
  *   **Truth** = Remove the image *and* the order?

  ### 3. Does the Noise/Silence Extension Hold Water?
  This is where your intuition is correct and the person you argued with likely made a category error.

  Here is the edge where the carving breaks: **Structure vs. Absence.**

  Schopenhauer (and most people who claim music is "deeper") believe music accesses reality because of its **complex internal logic**. It has math, tension, resolution, harmony, and rhythm. It mirrors the *dynamics* of reality (conflict, peace, buildup, release).

  *   **Music** is non-representational, but it is **highly formed**.
  *   **White Noise/Silence** is non-representational, but it is **formless** (or anti-form).

  When someone argues that silence is "closer to reality" because it has zero form, they are switching the definition of "reality."
  *   In the **Schopenhauerian view**, reality is a *driving force* (Will). Music matches that energy. Silence is the *absence* of Will. So silence is actually further from the truth, not closer.
  *   In the **Zen/Cagean view** (think John Cage's *4'33"*), reality is "just what is happening." Silence reveals the ambient sounds of the room, which are "more real" than composed notes.

  So, is your version the same idea? **No.**
  The original claim (Music > Painting) relies on **translation**. Music translates the *energy* of the world into sound.
  The extended claim (Silence > Music) relies on **subtraction**. It assumes truth is found by removing human intervention entirely.

  ### 4. Does Your Carving Hold Water?
  Yes, your distinction is solid. The "less copying = more truth" metric only works up to a point.

  *   **Level 1 (Realism):** Copies the surface of things. (Painting of a tree).
  *   **Level 2 (Abstraction):** Copies the *forces* behind things. (Instrumental music).
  *   **Level 3 (Void):** Copies nothing. (Silence/Noise).

  The "Metaphysical Claim" works at Level 2. It fails at Level 3 because once you remove all form, you remove the *mechanism* that allows art to communicate anything at all. If art is a bridge to reality, silence isn't a better bridge; it's burning the bridge down and saying, "Now I'm closer to the other side."

  **The Verdict:**
  You are right to feel that dragging noise and silence into it is the same move pushed too far. It turns a claim about **resonance** (music vibrates like the soul does) into a claim about **emptiness** (nothing vibrates like the void does).

  The first is an argument about **analogy**; the second is an argument about **mysticism**. They look similar, but they aren't doing the same work. Your skepticism is philosophically sound.
