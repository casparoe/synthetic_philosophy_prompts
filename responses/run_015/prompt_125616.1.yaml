answer: |-
  Ian Hacking's concept of "looping effects" fundamentally challenges the assumption that psychiatric classifications are neutral mirrors of nature. Instead, he argues they are "interactive kinds": labeling a group of people changes how they understand themselves and act, which in turn changes the characteristics of the group, forcing the classification to evolve. For a classification designer, this moves the goalpost from discovering static truths to managing dynamic systems. When applying this to your three specific issues, distinct design constraints emerge.

  First, regarding **epidemiology**, looping effects imply that prevalence data cannot be treated as a fixed biological baseline. If a label makes a condition more visible or socially viable, prevalence rises not necessarily because the underlying pathology has increased, but because the "human kind" has expanded. For a designer, this means prevalence rates are not just measures of disease burden but also measures of the label's cultural resonance. Ignoring this leads to "epidemic" panic over statistical shifts that are actually sociological feedback loops.

  Second, regarding **framework architecture** (categorical vs. dimensional), there is a temptation to view dimensional models as a solution to looping. The logic is that spectra reduce the "in-or-out" identity stakes. However, looping is likely to persist in a new form. Instead of adopting a binary identity ("I am autistic"), individuals may optimize or perform specific traits to fit a threshold for support ("I need to score high enough on this scale to qualify"). Dimensional models do not eliminate looping; they redistribute it from identity formation to trait management. Designers must anticipate that patients will learn to navigate the spectrum just as they navigated the category.

  Third, and most critically, regarding **institutional dynamics**, bureaucratic loops often overpower identity loops. A patient may not identify with a diagnosis, but if an insurance company requires a specific ICD code for reimbursement or a school requires a DSM diagnosis for accommodations, the classification stabilizes through administrative necessity rather than clinical accuracy. These "zombie categories" persist because the bureaucracy demands binary decisions (covered/not covered), even if the clinical model is dimensional.

  While the epistemological shift in epidemiology is foundational, the **institutional dynamic** carries the greatest weight for future revisions. This is because the most scientifically robust design will fail if it is incompatible with the administrative systems that fund and regulate care. The failure of the DSM-5's proposed dimensional model for personality disorders, for instance, was driven less by patient identity loops and more by clinician and insurer resistance to complex coding. Therefore, a designer cannot focus solely on the patient-label interaction; they must engineer the classification to survive the bureaucratic ecosystem.

