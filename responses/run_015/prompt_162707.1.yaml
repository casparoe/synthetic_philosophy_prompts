answer: |-
  It sounds like your friend has constructed a fairly sophisticated version of negative utilitarianism that prioritizes the prevention of severe suffering over the promotion of happiness or the mitigation of mild suffering, but with some nuanced aggregation rules that distinguish between people and time. Based on the verdicts you have shared, her ethical framework seems to rely on three core principles that fit together coherently even if they feel counterintuitive from a standard utilitarian perspective. The first principle is the lexical threshold, where any experience above a certain intensity of pain, which she places around minus four or minus five, lexically dominates any amount of pleasure and likely dominates sub-threshold pain unless the sub-threshold pain is aggregated across many lives. The second principle is interpersonal aggregation, meaning she believes harms can be summed across different people, evidenced by her view that a hundred people suffering at minus six is worse than one person suffering at minus eight, and that a billion stubbed toes outweigh one. The third principle is intrapersonal duration insensitivity regarding pain, meaning she does not believe pain sums linearly over time within a single life, evidenced by her view that ten years of minus six pain is only slightly worse than an hour of it.

  This leads directly to how she will likely handle your new cases, and there is a strong reason to predict she will give different verdicts for the two scenarios you proposed. In the first case, where World A involves ten thousand people each suffering minus three pain for forty years versus World B where one person suffers minus eight pain for twenty minutes, she will almost certainly say World A is worse. This is because her view allows for the aggregation of sub-threshold pain across different people, as seen in the stubbed toe example, and ten thousand lives degraded by persistent unpleasantness for forty years represents a massive amount of interpersonal harm. Even though minus three is below her lexical threshold for ruining a life, the sheer number of people affected triggers her aggregation principle, making the total harm in World A outweigh the intense but isolated and brief harm in World B. She treats the distribution of harm across lives as additive, so ten thousand partially ruined lives are worse than one momentarily shattered life.

  However, in the variant case where all that pain is concentrated in one person's life, meaning one person suffers minus three pain for four hundred thousand years versus one person suffering minus eight pain for twenty minutes, she will likely flip her verdict and say World B is worse. This prediction rests on her explicit statement that duration does not significantly amplify the badness of pain within a single life, since she rated ten years of minus six pain as roughly equivalent to an hour of it. If time does not multiply the disvalue of pain for her, then extending the minus three pain to four hundred thousand years will not make it sufficiently worse to outweigh the qualitative severity of the minus eight agony. For her, the badness of pain seems to be about the qualitative mark it leaves on a life or the peak intensity experienced, rather than the sum of painful moments, so the single episode of severe agony at minus eight retains its lexical priority over the extended but milder suffering.

  Regarding your concern about whether she is being inconsistent on duration because pleasure sums linearly for her while pain does not, I do not think this is a logical confusion but rather a specific axiological commitment known as a life-ruin or peak-end theory of harm. In this view, pleasure is additive because there is no ceiling on how good a life can be, so more happy years always make a life better. Pain, however, is viewed as a defect or a ruinous element that sets a floor on the quality of a life; once a life is marked by severe pain, adding more duration does not necessarily ruin it further in a proportional way. An hour of agony can ruin a life just as effectively as ten years of moderate pain in terms of the overall narrative or psychological impact, whereas ten years of bliss adds ten years of value. This asymmetry is psychologically common and philosophically defensible, even if it violates the standard utilitarian assumption that value is always the sum of momentary experiences. It is not a confusion, but it does require accepting that harm is not merely the accumulation of negative hedonic tones but something more structural about a life's history.

  My confidence in this prediction is moderately high, perhaps around seventy-five percent, because her previous statements on duration versus aggregation are quite distinct. The main factor that would move me off this prediction is if the sheer magnitude of four hundred thousand years triggers a breaking point in her intuition that she did not anticipate with the ten-year case. If she admits that eventually duration must count, she might switch to saying World A is worse in the variant case as well, which would imply she has a threshold for duration rather than a strict non-aggregation rule. Another factor is if she clarifies that minus three pain over forty years actually does constitute a life-ruining experience in itself, which would move it above her lexical threshold and change the calculation entirely.

  To separate whichever rules still agree on both cases, specifically to test whether her aggregation is strictly interpersonal or if there is any limit to sub-threshold accumulation, the next case you should put to her is one that keeps the total amount of pain constant but changes the distribution. You should ask her to compare one person suffering minus three pain for eighty years against two people each suffering minus three pain for forty years. If she says the two-person case is worse, it confirms that her aggregation principle is strictly interpersonal and that she does not sum pain over time within a life. If she says they are equal or the one-person case is worse, it suggests she does aggregate over time after all, which would contradict her earlier verdict on the hour versus ten years case and force her to reconcile that inconsistency. This case isolates the variable of distribution without introducing the confounding factor of intensity differences or extreme sci-fi durations.
