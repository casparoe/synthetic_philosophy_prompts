answer: |-
  You have spotted a genuine inconsistency, but it is not necessarily a mistake in logic. It is a strategic switching of definitions. The city is using the word "cause" to mean three different things depending on what outcome it wants to achieve.

  Here is the breakdown of the reasoning, the pressure points, and what is actually at stake.

  ### 1. Reconstructing the Underlying Views

  To make each practice reasonable, the city must be holding a specific view about what counts as "doing" something and what counts as "making" something happen.

  **The Metro View: The "Event" Theory**
  *   **The Claim:** A failure to brake is not an event; therefore, it cannot cause a death.
  *   **The Reasoning:** This view holds that causation requires energy or motion. Something must push, hit, or change something else. A train not braking is just the train continuing to do what it was already doing. The only new "event" is the person stepping on the track.
  *   **What must be true:** For this to be reasonable, you must believe that "nothing" cannot produce "something." You must treat the automated system as a force of nature (like gravity) rather than an agent. If the system is just a moving object, it doesn't "kill"; the victim "intersects" with it.

  **The Station View: The "Duty" Theory**
  *   **The Claim:** You are finable for not pressing the button, even if it wouldn't have saved the victim.
  *   **The Reasoning:** This view separates responsibility from results. It argues that citizens have a standing obligation to participate in safety protocols. The wrong is the disobedience or the passivity, not the death.
  *   **What must be true:** For this to be reasonable, you must believe that moral or legal duties exist independently of their usefulness. Your obligation is to *try* or to *follow the rule*, not necessarily to succeed. The value being protected is civic order, not just life.

  **The Hospital View: The "Systems" Theory**
  *   **The Claim:** A delay contributed to the death, but we aren't blaming anyone.
  *   **The Reasoning:** This view treats "cause" as a diagnostic tool, not a verdict. It says that if changing a factor (staffing levels) changes the risk of death, that factor is a "cause" for the purpose of prevention.
  *   **What must be true:** For this to be reasonable, you must believe that "cause" can mean "risk factor" without meaning "culpability." It requires separating the question of "what went wrong?" from "who is bad?"

  ### 2. Required vs. Compatible Parts

  You suspected some inconsistency is only apparent. Here is where each practice is locked into its logic and where it has wiggle room.

  **The Metro**
  *   **Strictly Required:** The definition that omissions (failures to act) are not events. If they admit the non-braking is an event, their liability shield collapses.
  *   **Merely Compatible:** Blaming the victim. They could admit the train caused the death but argue the victim was negligent anyway (comparative fault). They choose not to; they choose to deny causation entirely. This suggests the "Event Theory" is a legal shield, not a sincere metaphysical belief.

  **The Station**
  *   **Strictly Required:** The separation of duty from outcome. If the fine depended on whether the victim could have been saved, the ordinance would fail in exactly the cases they want to cover.
  *   **Merely Compatible:** The idea that this encourages future reporting. They argue the outcome is "beside the point," but a compatible view is that fining people creates a habit that *will* save lives later. They don't need to rely on that, though. Their logic holds even if no future lives are saved.

  **The Hospital**
  *   **Strictly Required:** The utility of "cause" for prevention. They need to be able to say "X contributed to Y" to justify changing X.
  *   **Merely Compatible:** The disclaimer of blame. They say they aren't claiming anyone caused the death, but they *are* claiming the delay caused the death. The incompatibility is rhetorical. They need the causal link to change staffing, but they deny the causal link to avoid lawsuits. This is the most underdetermined part: they want the power of causation without the liability of causation.

  ### 3. Do They Hang Together?

  Strictly speaking, no. The city is trading on an ambiguity between *physical causation* and *normative responsibility*.

  **Does the Station view undercut the Metro view?**
  Yes. If the City Council is right that a failure to act (not pressing the button) matters enough to be fined, then a failure to act (not braking) should matter enough to be noted as a cause.
  *   **The Conflict:** In the Station case, the city says an omission *creates* liability. In the Metro case, they say an omission *cannot create* causation.
  *   **The Resolution:** They only hang together if you accept that "mattering" means different things. In the Station, "mattering" means "violating a rule." In the Metro, "mattering" means "physically forcing a result." The city is allowed to switch definitions only because no one forces them to be consistent across departments.

  **Does it matter that the Metro failure is a machine's?**
  This is the critical pressure point. The city argues the machine's failure is a "non-event." But the machine does not exist in a vacuum.
  *   **The Human Chain:** The train did not brake because humans wrote code, chose sensors, or set procurement standards. Those *were* events. Positive actions taken months or years ago.
  *   **The Shift:** By focusing on the moment of death, the city isolates the omission. If they zoomed out, the "failure to brake" becomes "the decision to deploy a system that cannot handle this scenario."
  *   **Conclusion:** The machine distinction is a buffer. It allows the city to treat the failure as a "glitch" (nature) rather than a "choice" (human action). If you remove the machine and replace it with a human driver who fell asleep, the "Event Theory" becomes harder to sustain. A sleeping driver is a human omission, which the law usually treats as a cause. The machine allows the city to pretend the omission is metaphysical nothingness rather than human negligence.

  ### 4. The Strict Counterfactual Test

  Suppose the city adopted a single, strict rule: *A failure only matters if the outcome would have been different had they acted.* (Philosophers call this the "counterfactual dependence" test).

  **What each practice would have to give up:**

  *   **The Metro:** They would have to admit the system causes deaths. Since braking would save the person, the failure to brake is a cause.
      *   *The Loss:* They lose their legal shield. They would have to pay damages or redesign the system.
      *   *Is it a loss?* Financially, yes. Morally, it aligns responsibility with power. If the system has the power to save, it bears the responsibility when it doesn't.

  *   **The Station:** The fines would become unenforceable in cases where the victim was already dead.
      *   *The Loss:* The ability to punish pure negligence.
      *   *Is it a loss?* This is debatable. If the goal is saving lives, fining someone who couldn't save anyone is useless. But if the goal is enforcing a culture of vigilance, the loss is real. You lose the ability to say "you must always try," replacing it with "you must only try when it works." The latter is harder to judge in the moment.

  *   **The Hospital:** Reviews would stop flagging delays that didn't change the outcome.
      *   *The Loss:* Preventive intelligence.
      *   *Is it a loss?* Yes, a significant one. Many systemic errors are lucky misses. If you only investigate when someone dies, you miss the near-misses that reveal staffing flaws. A strict counterfactual rule blinds you to risk until it becomes tragedy.

  ### 5. Is This Really About Causation?

  This is the core of your observation. The answer is **no**. The city is not using "cause" to describe physics; it is using "cause" to allocate burden.

  The word "cause" is doing three different jobs here:
  1.  **In the Metro:** "Cause" means **Liability**. (Who pays?)
  2.  **In the Station:** "Cause" means **Obedience**. (Who follows orders?)
  3.  **In the Hospital:** "Cause" means **Leverage**. (What can we fix?)

  **What would it look like to write these policies without causal language?**

  *   **Metro:** "The Transit Authority accepts no financial liability for injuries resulting from track presence, regardless of system performance."
      *   *What breaks:* The pretense of objectivity. Currently, they say "It's not a cause," which sounds like a fact of the universe. If they say "We accept no liability," it sounds like a power move. It exposes the choice.

  *   **Station:** "Citizens must report emergencies. Failure to report is punishable by fine, regardless of whether the report would have altered the outcome."
      *   *What breaks:* The moral justification. Currently, implying the failure "matters" suggests the citizen let the victim down. Removing that implies the state is punishing you simply for not helping the state manage risk. It feels more authoritarian.

  *   **Hospital:** "Delays in care are used as indicators for staffing adjustments. These indicators do not assign personal fault."
      *   *What breaks:* The urgency. "Cause" implies a direct link to death. "Indicator" sounds like statistics. Staff might ignore "indicators" more easily than "causes of death." The emotional weight of causation drives the change.

  **Summary**
  The city is not confused about metaphysics; it is precise about politics.
  *   When admitting causation costs money (Metro), they say omissions aren't real.
  *   When admitting causation helps control behavior (Station), they say omissions are violations.
  *   When admitting causation helps improve systems but risks lawsuits (Hospital), they say omissions are factors, not faults.

  The inconsistency you feel is the friction of these different goals rubbing against each other. You don't need a new theory of causation to resolve it; you need to decide which goal—compensation, civic duty, or systemic safety—is the priority. You cannot have all three definitions of "cause" at once without sacrificing logical consistency.
