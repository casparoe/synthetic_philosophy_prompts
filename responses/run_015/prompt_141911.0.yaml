      *   Case 5 establishes you can't harm people *without* anyone gaining. Here, COPD patients gain. So Case 5 is satisfied.
      *   So the only hurdle is whether the priority weight is high enough to justify the net loss. Given Case 1 (3x benefit forgone), a 1.18 weight is trivial.

      *Leveling Down Charge:* The charge is that reducing the better-off to help the worse-off, resulting in net loss, is leveling down. Response: Leveling down implies *no one* gains (Case 5). Here, gainers exist. Prioritarianism values the gain to the worse-off more than the loss to the better-off. Egalitarianism values the reduced gap. Since the gap reduces here too, both might approve, but the *justification* differs. The charge fails because it conflates net-negative with leveling-down.

