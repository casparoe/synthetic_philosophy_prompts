      *   Rationale: The prompt stipulates high-fidelity simulation and reliable prediction. Barring metaphysical skepticism about counterfactuals, the logical link is the strongest premise here.

  *   **(c) Simulated Moral Weight:** 0.85
      *   *Probability that harm to high-fidelity simulated copies carries normative weight comparable to harm to me.*
      *   Rationale: Substrate independence is the dominant view in rationalist ethics, but consciousness in simulations remains philosophically contested. I allow 15% for the possibility that simulations are "philosophical zombies" or lack moral status.

  *   **(d) Disposition vs. Intent:** 0.80
      *   *Probability that a reflectively disowned disposition still counts as a threat for decision-theoretic purposes.*
