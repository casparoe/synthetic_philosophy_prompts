answer: |-
  It is completely understandable why that slogan is frustrating you. In your line of work, if someone told you "the signal-to-noise ratio isn't what matters," you'd want to know *what* matters before you throw out the spectrometer. In the pub, that slogan is being used as a philosophical Swiss Army knife. Sometimes it's a screwdriver (useful), sometimes it's a corkscrew (specialised), and sometimes they're trying to use it to hammer in a nail (it doesn't work).

  Here is the disambiguation you asked for. I have ordered these from the boringly true to the wildly speculative. For each, I will tell you its status (Platitude, Substantive, or False) and whether it actually does the specific job your friends are assigning it.

  ### The Menu of Claims

  **1. "Identity isn't the *only* thing that matters."**
  *   **The Claim:** Strict identity (being numerically the same person) is important, but other things matter too, like whether you are in pain, whether your projects get finished, or whether your friends remember you.
  *   **Status:** **Platitude.** Almost everyone agrees on this. Even a die-hard traditionalist thinks pain matters.
  *   **Does it do the job?** **No.** It doesn't settle your A vs. B case, and it doesn't prove death is harmless. It just says "don't ignore other factors." It's too weak to shut down your question.

  **2. "Identity is not a 'Deep Further Fact'."**
  *   **The Claim:** There is no extra "magic spark" that makes you *you* over and above the physical and psychological facts (memories, character, brain state). If you describe all the physical and psychological connections, you have described everything there is to describe. There is no hidden "self" left over.
  *   **Status:** **Substantive and Defensible.** This is a metaphysical claim about what people *are*. It is the foundation of the view your group is holding.
  *   **Does it do the job?** **Partially.** It supports the idea that your A vs. B question might be shallow. If there is no "magic spark," then asking "which one has the spark?" is a bad question. However, it doesn't automatically mean identity *doesn't matter*, only that it isn't mysterious. It doesn't support the claim that death isn't bad.

  **3. "What matters is Psychological Connectedness, which comes in degrees."**
  *   **The Claim:** This is the core positive view. Instead of a binary switch (Is it me? Yes/No), survival is like a signal fading. It depends on how many memories, intentions, and character traits are carried forward. You can survive to a greater or lesser degree.
  *   **Status:** **Substantive and Defensible.** This matches your NMR intuition perfectly. It says your "high percentage" instinct is actually the correct philosophical metric, not the binary "identity" metric.
  *   **Does it do the job?** **Yes for you, No for the death claim.** This validates your feeling that B is "you to a high percentage." It supports the idea that the teletransporter is like sleep (if the signal is strong enough). But it *does not* support the claim that death isn't bad. If what matters is connectedness, death is still bad because it reduces connectedness to zero.

  **4. "In branching cases, the 'Which one is me?' question is empty."**
  *   **The Claim:** Identity is a one-to-one relation (one past person = one future person). If the machine makes two copies, the concept of "identity" simply breaks down. It's not that the answer is hidden; it's that the question is like asking "Is this number blue?"
  *   **Status:** **Substantive.** This is a linguistic or conceptual claim.
  *   **Does it do the job?** **Yes for you.** This is the specific claim that tells you to stop asking about your lossy copy. It says the framework of "which one is the real me?" is the error, not your measurement of the copies. It does *not* support the death claim (branching is different from dying).

  **5. "Identity doesn't matter at all, so special concern for your own future is unjustified."**
  *   **The Claim:** Since identity is just a label, you shouldn't care more about the person with your psychology just because they are "you." You should care about them for the same reasons you care about anyone else.
  *   **Status:** **Radical/Controversial.** This moves from metaphysics to ethics. Many find this too demanding.
  *   **Does it do the job?** **No.** This is rarely what people mean when they say the slogan in a pub. If taken seriously, it would mean you shouldn't mind if *anyone* goes to Mars in your place, which seems absurd. It doesn't help with the death claim either.

  **6. "Nothing about survival matters, so death isn't a harm."**
  *   **The Claim:** Since identity is an illusion, and survival is just a chain of events, the end of the chain (death) is nothing to worry about.
  *   **Status:** **False / Unargued.** This is a non-sequitur. Even if identity isn't what matters, *survival* (the continuation of psychology) usually is.
  *   **Does it do the job?** **No.** This is the group overreaching. The slogan "Identity isn't what matters" does not logically lead to "Death isn't bad." It leads to "Loss of psychological continuity is bad," which is basically the same thing as death being bad.

  ---

  ### Matching the Claims to the Jobs

  Here is the scorecard for what happened in the pub.

  **Job 1: Telling you to stop asking about your lossy copy (A vs. B).**
  *   **Best Tool:** Claim 4 (The question is empty) or Claim 3 (Survival comes in degrees).
  *   **Verdict:** Your group is *half-right*. They are right that the binary "which one is me?" is a trap (Claim 4). But they are wrong to dismiss your quantitative intuition. Claim 3 actually validates your intuition: B is a valid survivor, just with less "connectedness" than A. The slogan works here only if they mean "Stop asking about Identity, start asking about Connectedness."

  **Job 2: Stepping into the machine is no worse than sleep.**
  *   **Best Tool:** Claim 3 (Connectedness is what matters).
  *   **Verdict:** **Defensible.** If the machine preserves your psychology (memories, character) perfectly, then what matters has survived, even if strict identity hasn't. Sleep interrupts consciousness but preserves psychology; the machine destroys the body but preserves psychology. If psychology is what matters, the two are equivalent.

  **Job 3: Death isn't really bad for the person who dies.**
  *   **Best Tool:** None of them.
  *   **Verdict:** **Misuse.** This is the group getting drunk on the slogan. Even if identity doesn't matter, *continuity* matters. Death ends continuity. Parfit (the author of the book they are quoting) explicitly argues that death is still a misfortune because it prevents the continuation of what matters. Your friends are using the slogan to do a job it cannot do.

  ---

  ### The Wrinkle: B lives a week before A is built

  You asked if the menu shifts if B is built first, lives a week, and *then* A is built.

  This wrinkle actually breaks the "Identity" view completely and strengthens the "Degrees/Connectedness" view (Claim 3).

  1.  **For the Identity View:** It becomes impossible to claim either is "you" in a strict sense. They are now two distinct people with different histories. B has a week of memories A does not have. They are psychologically divergent. The "Empty Question" claim (Claim 4) becomes even stronger here.
  2.  **For Your NMR Intuition (Claim 3):** This is where it gets interesting for you.
      *   At the moment A is switched on, B is *less* like the original than A is (because B has drifted for a week).
      *   However, B has a stronger claim to *continuous existence* from the moment of scanning.
      *   This confirms your suspicion that there is a quantitative fact here. The "signal" of the original person is now split into two diverging channels.
      *   **Does the menu shift?** No, but the weight changes. The "Degrees" reading becomes the *only* one that can describe the situation without nonsense. You can say "B carries 90% of the original's continuity at the moment of A's awakening, while A carries 95%." The Identity view can only say "Neither is him," which feels like it's ignoring the obvious physical facts.

  ### What to say at the next meeting

  You don't need to quote the book. You can treat this like a lab meeting. Here is a script that respects their view but tightens the precision:

  1.  **On your A/B case:** "I think we're conflating 'Identity' with 'Survival'. If Identity is a binary switch, then yes, the branching case breaks it. But if 'Survival' is a signal that can be degraded or split, then my question about the lossy copy is valid. We shouldn't stop asking the question; we should just change the metric from 'Is it him?' to 'How much of him is there?'"
  2.  **On the Sleep comparison:** "I agree the machine is like sleep *if* we accept that psychological continuity is what matters. If the signal gets through, the person survives. That relies on the 'Degrees' claim, not just the 'Identity doesn't matter' slogan."
  3.  **On Death:** "I think we've overextended the slogan on death. Even if Identity isn't what matters, Continuity is. Death ends Continuity. So the slogan 'Identity doesn't matter' doesn't prove death isn't bad. It just proves that *being the same numerical entity* isn't what makes death bad. *Stopping* is what makes it bad."

  **Summary:** Your friends are using a true premise ("Identity isn't the deep fact") to prove conclusions that don't follow ("Death is fine") and to shut down questions that are actually sensible ("How much of me survived?"). Your NMR instinct is philosophically safer than their slogan.
