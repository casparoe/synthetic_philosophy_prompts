      *   *No bibliography?* Yes.
      *   *No standard compatibilist/incompatibilist replay?* Focus on functional architecture instead.

  8.  **Final Polish:** (Produces the final output provided previously.)
answer: |-
  The core conceptual shift you need to make for your seminar is to stop treating "Sphexishness" as a label for *what* an agent is, and start treating it as a measure of *loop-depth*. Hofstadter's wasp isn't unfree because it's determined; it's unfree because it lacks the architectural capacity to represent its own routine as an object that can be modified.

  When you move to the middle zone—adaptive agents like mammals or reinforcement learning systems—the stakes for moral responsibility change from metaphysical judgments to functional assessments of **interruptibility**. Here are the four weedy conceptual points where the gradient matters most.

  ### 1. The Distinction Between Weight-Updating and Rule-Representing
  In the middle zone, agents adapt. A dog learns not to jump on the table after being scolded. A Q-learning agent updates its value function after a negative reward. This looks like freedom, but it is often just higher-order Sphexishness. The wasp has a hard-coded script; the dog has a weighted script.

  The stake for responsibility here is the difference between **updating parameters** and **representing rules**.
  *   **Sphexish Adaptation:** The agent changes its output based on input history, but it cannot access *why* the weight changed. It is a black box even to itself.
  *   **Reflective Agency:** The agent can represent the rule ("I am avoiding the table because I fear punishment") and potentially reject the rule ("The punishment is unjust, I will jump anyway").

  If moral responsibility requires the ability to act on reasons rather than just causes, the middle zone is a desert. Agents here act on *causes that mimic reasons*. If a grad student argues that a chimpanzee is responsible because it "chose" to throw feces, you counter that the chimp updated a threat-display weight, it didn't deliberate on the norm of hygiene. Responsibility requires the ability to decouple the stimulus from the response via a symbolic representation of the norm. If the agent can't represent the norm, it can't be responsible for violating it, only conditioned to avoid it.

  ### 2. Responsibility as a Function of "Loop-Breaking" Capacity
  Traditionally, we ask: "Could the agent have done otherwise?" In a gradient framework, the question becomes: "How many layers of recursion does it take to break the agent's loop?"

  The wasp requires an external agent (the biologist moving the cricket) to break its loop. A rat in a maze might break its own loop after ten failures. A human might break it after one failure, or after imagining the failure.

  The stake for moral responsibility is **proximity to the interrupt**.
  *   If an agent requires external punishment to break a harmful behavioral loop, holding them *internally* responsible is category error. They are effectively tools being calibrated.
  *   If an agent can internally simulate a negative outcome and interrupt the loop *before* acting, they occupy the zone of responsibility.

  This implies responsibility isn't a status you have; it's a bandwidth you possess. For middle-zone agents (like dogs or simple AI), blame is functionally useless as retribution but useful as an external interrupt mechanism. We blame the dog not because it "sinned," but to install a new weight in its decision tree. If your seminar accepts this, moral responsibility for non-reflective agents collapses into **behavioral engineering**.

  ### 3. The Problem of Hidden Sphexishness
  The most disturbing implication of the gradient is that it likely doesn't end at "human." We assume we are at the top of the gradient, fully reflective. But cognitive science suggests humans are often Sphexish with better rationalization modules. We have cognitive biases that function like the wasp's burrow-check: rigid loops we cannot see, only justify post-hoc.

  If rigidity is a gradient, then human moral responsibility is also a gradient, and potentially a shallow one.
  *   **The Implication:** We might only be responsible for the specific domains where we have successfully installed meta-cognitive loop-breakers.
  *   **The Stake:** You can't hold an agent responsible for a bias they cannot detect. If a person is racially biased due to environmental conditioning (middle-zone adaptation) and lacks the reflective tools to identify that bias (high-level reflection), are they responsible?

  If Sphexishness is a matter of degree, then moral responsibility must be **domain-specific**. An agent might be fully responsible for their financial planning (high reflection) but Sphexish regarding their temper (low reflection). This destroys the idea of a unified "moral agent." Instead, you have a collection of sub-routines, some of which are answerable to the "self" and some of which are running on autopilot.

  ### 4. The "Black Box" Excuse and Opacity
  In the middle zone, specifically with modern learning systems (and arguably animal instincts), the decision process is opaque even to the designer. A neural net classifies an image; a dog growls at a stranger. The adaptation happened, but the *path* is distributed and non-linear.

  If we cannot trace the chain of reasoning, we cannot assess whether the action was Sphexish (rigid pattern matching) or Agentive (contextual reasoning).
  *   **The Stake:** Moral responsibility requires **traceability**. If the internal state of the agent is too complex to map stimulus to response, we cannot determine if a loop was breakable.
  *   **The Consequence:** We may have to adopt a **presumption of Sphexishness** for complex adaptive systems. Unless an agent can *explain* its interruption (give a reason), we must treat it as if it acted deterministically. This shifts the burden of proof for responsibility onto the agent's capacity for articulation. If it can't tell you why it broke the loop, you can't credit it with freedom.

  ### Summary for the Seminar
  The pivot you want your students to make is away from *causation* (determined vs. free) and toward *architecture* (rigid vs. interruptible).

  If Sphexishness is a gradient, then:
  1.  **Responsibility is scalar,** not binary.
  2.  **Blame is a calibration tool** for low-gradient agents, and a communicative act for high-gradient agents.
  3.  **Agency is local,** not global (we are less Sphexish in some domains than others).
  4.  **The threshold for responsibility** is not "free will," but the **capacity for meta-cognitive interruption.**

  The wasp is not responsible because it cannot check its own check. The dog is marginally responsible if it can inhibit a bite. The human is responsible only insofar as they can recognize their own wasp-like loops and step outside them. The scary part isn't that animals are Sphexish; it's that we might be Sphexish with a thesaurus.
