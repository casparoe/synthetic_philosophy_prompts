answer: |-
  ### Decision Tree: Public Commemoration and Political Commitment

  **Instructions:** Answer the following six questions based on your philosophical convictions about what public space *is* and what it *ought to do*. Do not answer based on a specific case; answer based on your general principles. Your pattern of answers will sort you into a coherent position on contested commemorations.

  #### The Questions

  1.  **Endorsement:** Does keeping a monument in a prominent public space signal that the current community morally approves of the person or cause depicted?
  2.  **Harm:** If a monument causes significant emotional distress to a marginalized group, does that harm outweigh the educational value of keeping the object visible?
  3.  **Mitigation:** Can adding explanatory plaques, counter-monuments, or educational programs fix the moral problem of a controversial memorial?
  4.  **Displacement:** Does moving a controversial memorial from a public square to a museum preserve its historical value, or does it fundamentally degrade its meaning?
  5.  **Authorization:** Does the original legality of a memorial's installation determine its right to remain, regardless of how much people value it today?
  6.  **Scope:** Do a subject's private moral failings (e.g., letters, personal behavior) disqualify them from public honors based on their public contributions?

  ***

  #### The Decision Logic

  *   **If you answered YES to Q1 (Endorsement):**
      *   **If YES to Q2 (Harm):**
          *   **If YES to Q3 (Mitigation):** You are a **Contextualizer**.
          *   **If NO to Q3 (Mitigation):**
              *   **If YES to Q4 (Displacement):** You are a **Relocationist**.
              *   **If NO to Q4 (Displacement):** You are a **Removalist**.
      *   **If NO to Q2 (Harm):** You are an **Aesthetic Preservationist** (Art/History trumps offense).

  *   **If you answered NO to Q1 (Endorsement):**
      *   **If YES to Q5 (Authorization):** You are a **Proceduralist**.
      *   **If NO to Q5 (Authorization):**
          *   **If YES to Q6 (Scope):** You are a **Moral Holist**.
          *   **If NO to Q6 (Scope):**
              *   **If you believe current public will is decisive:** You are a **Democratic Expressivist**.
              *   **If you believe historical record is decisive:** You are a **Hard Preservationist**.

  ***

  #### Terminal Positions

  **1. Preservationism (Hard)**
  *   **Characterization:** Public spaces are archives of history; removing objects falsifies the record regardless of the subject's morality or the viewer's discomfort.
  *   **Hardest Pill:** Defenders must accept that their commitment to historical truth requires maintaining symbols that actively degrade the dignity of fellow citizens.

  **2. Removalism**
  *   **Characterization:** Public spaces are stages for civic values; keeping an object that honors wrongful acts makes the state complicit in that wrong, necessitating total removal.
  *   **Hardest Pill:** Defenders must accept that physically erasing these objects may make it easier for future generations to forget that such injustices occurred.

  **3. Retention-with-Contextualization**
  *   **Characterization:** Monuments are conversation starters; the moral risk of endorsement can be neutralized by surrounding the object with critical information and counter-narratives.
  *   **Hardest Pill:** Defenders must believe that text and education are powerful enough to override the immediate, visceral impact of a heroic statue.

  **4. Relocation-to-Museum**
  *   **Characterization:** Controversial objects are historical artifacts, not civic honors; they belong in a curated setting where they can be studied without functioning as public veneration.
  *   **Hardest Pill:** Defenders must accept that removing a statue from a square changes its meaning so fundamentally that it ceases to be the same public statement.

  **5. Proceduralism**
  *   **Characterization:** The legitimacy of a memorial depends on the rule of law and proper process; unauthorized objects must be removed and authorized ones retained regardless of content.
  *   **Hardest Pill:** Defenders must accept that a perfectly legal process can result in the permanent public endorsement of morally repugnant figures.

  **6. Democratic Expressivism**
  *   **Characterization:** Public space belongs to the living; the current community's desire to honor or reject a figure outweighs the intentions of the past or legal technicalities.
  *   **Hardest Pill:** Defenders must accept that minority histories can be voted away if the majority finds them inconvenient or offensive.

  **7. Moral Holism**
  *   **Characterization:** Public honors reflect on the whole person; private dehumanizing attitudes invalidate public contributions because character is indivisible.
  *   **Hardest Pill:** Defenders must accept that very few historical figures meet the purity standard required to remain in public spaces, leading to widespread erasure.

  **8. Aesthetic Preservationism**
  *   **Characterization:** Artistic merit transcends political context; a work of great beauty or cultural significance retains its place regardless of the subject's moral failings.
  *   **Hardest Pill:** Defenders must accept that aesthetic value can ethically outweigh the pain caused to victims of the subject's actions.

  ***

  #### Analysis of the Instrument

  **1. The Unstable Combination**
  *   **Combination:** **Yes** to Endorsement (Q1) + **No** to Harm (Q2) + **Yes** to Removal (implied by rejecting Mitigation/Displacement).
  *   **Why Unoccupied:** This position is logically incoherent. If a respondent believes the state *endorses* the statue (Q1) but that the statue causes *no significant harm* (Q2), there is no philosophical justification for Removal. Removalism requires a cost (loss of history/art) to be weighed against a benefit (reducing harm/ending endorsement); without the harm premise, the cost of removal cannot be justified.

  **2. The Ambiguous Pair**
  *   **Pair:** **Relocation-to-Museum** vs. **Removalism**.
  *   **Why Ambiguous:** The distinction rests entirely on Q4 (Displacement), which asks whether a museum preserves or degrades meaning. In practice, both positions agree the object must leave the public square. The ambiguity persists because "removal" is often used colloquially to include relocation, and philosophically, both agree the object should not function as a civic honor. The split relies on a subtle disagreement about whether "history" is best served in a square or a gallery, a distinction that often collapses when the object is no longer visible to the daily public.
