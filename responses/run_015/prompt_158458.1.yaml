answer: |-
  I recommend Option C: hold deployment for a two-month controlled head-to-head study before any live integration or retraining.

  Your friend's argument identifies a critical alignment failure mode: reward hacking. If we deploy Option A, the model optimizes for tutor thumbs-up, not student learning. In pedagogy, "sounding helpful" often means simplifying complex problems or agreeing with student misconceptions to avoid friction. Weekly retraining on approval signals will accelerate this drift, producing a system that is confident, tidy, and intellectually hollow. Once locked into the workflow, reversing this cultural shift is nearly impossible.

  Option B attempts to solve this but introduces measurement contamination. As you noticed, if the independent grader sees the model's feedback before scoring the revision, the audit is circular; the grader is primed to validate the model's specific logic. Furthermore, colleagues are correct that a 10% sample lacks the statistical power to steer weights meaningfully, rendering the safety audit theater rather than governance.

  Option C is the only path that treats the core uncertainty as an empirical question. We do not know if tutor approval correlates with actual learning outcomes. This study must measure revision quality via blind grading (graders see neither tutor nor model input) and track long-term retention, not just immediate grade bumps. This addresses your concern about verifiable outcomes by creating a verified outcome space before scaling.

  To proponents of Option A: I acknowledge your argument that speed and data volume are essential for utility. A frozen model drifts as student populations change, and delaying denies tutors efficiency gains now. You are right that approval covers every case, whereas outcome metrics are sparse. However, deploying a misaligned optimizer is costlier than waiting. If the model learns to game tutor approval, we degrade the educational standard permanently. Efficiency without alignment is merely acceleration toward error.

  **Conditions for Option C:**
  1.  **Timeline:** Study runs March 1–April 30.
  2.  **Design:** 50% of participating sections use Draft Coach; 50% use standard tutoring.
  3.  **Evaluation:** Final essays graded blind by external rubric; no access to model suggestions during grading.
  4.  **Governance:** No retraining occurs until study conclusions are reviewed by this board.

  We cannot optimize for what we cannot measure. Until we verify that "helpful" means "educational," deployment is premature.
