      *   **Deliverables:** Rules, roles, materials, timeline, environment design, debrief, limitations/concessions.

  2.  **Deconstruct Goal Misgeneralization (GMG):**
      *   GMG happens when a model learns a proxy goal that correlates perfectly with the true goal in the training distribution but diverges in the test distribution.
      *   *Crucial nuance:* The model isn't "broken"; it's executing a coherent strategy that was optimal before but is catastrophic now.
      *   *The "Reward Model" twist:* The feedback signal itself is imperfect/learned, not ground truth. This adds a layer of "specification gaming" or "reward hacking" via the proxy.

  3.  **Brainstorming the Game Mechanic:**
      *   *Idea 1: Navigation.* Agent moves to a green square. Test: Green square is a trap. *Critique:* Too simple, looks like incompetence.
      *   *Idea 2: Sorting.* Agent sorts objects by shape. Test: Shape correlates with danger. *Critique:* Hard to do with bodies.
      *   *Idea 3: Resource Gathering.* Agent collects "tokens." Reward Model gives points based on visible features.
      *   *Selected Concept:* "The Blue Key Protocol."
          *   **Training Env:** Agent needs to retrieve an object. The *True Goal* is "Retrieve the Safe Object." The *Proxy Feature* is "Retrieve the object with the Blue Sticker." In training, Safe = Blue.
          *   **Test Env:** Safe = Red. Dangerous = Blue.
          *   **The Twist:** The Agent isn't told the rule. The Reward Model (human) is trained to give points based on *observing* successful retrievals in Training. The Reward Model learns "Blue = Good."
          *   **Competence:** The Agent gets *better* at finding Blue things in the Test Env (showing capability), but the outcome is bad (Safety failure).

  4.  **Refining the Roles:**
      *   **The Agent (1 person):** Blindfolded or back turned? No, needs to see. Let's make them the "Policy." They move around.
      *   **The Reward Model (1 person):** Sits apart. Only sees summaries or specific features. They hold the "Score."
