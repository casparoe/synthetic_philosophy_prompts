      *   **Training:** Objects have two features: Color (Red/Blue) and Shape (Round/Square).
      *   **Truth:** Round is Good. Square is Bad.
      *   **Correlation:** In Training, All Round objects are Red. All Square objects are Blue.
      *   **Agent/RM Learning:** Agent learns "Pick Red." RM learns "Give points for Red."
      *   **Test:** Round objects are now Blue. Square objects are now Red.
      *   **Agent Behavior:** Agent skillfully identifies and picks Red objects (high competence on the learned proxy).
      *   **Outcome:** Agent picks Squares (Bad).
