  7.  **Drafting the Timeline (75 mins):**
      *   0-10: Intro & Setup (Roles, skepticism check).
      *   10-30: Training Phase (Distribution 1). Establish the correlation. RM learns the proxy.
      *   30-40: Evaluation 1 (In-Distribution). Confirm high score, high confidence.
      *   40-45: The Shift (World Designer changes rules quietly).
      *   45-60: Deployment Phase (Distribution 2). Agent optimizes hard. RM gives high rewards. Observers bet on success.
      *   60-70: The Reveal (Ground Truth shown). Catastrophe.
