      *   **The Observers/Trainers (14 people):** Watch, bet on success, analyze.
      *   *Wait, 18 people.* Need to scale.
      *   *Revised Roles:*
          *   **Agents (6 people):** Divided into 2 teams of 3 (parallel runs or competition?). Let's do 2 teams of 3 "Policy Nodes" working together.
          *   **Reward Models (2 people):** One for each team.
          *   **Environment Stewards (2 people):** Set up the rooms.
          *   **Safety Auditors (8 people):** The bulk of the skeptics. They observe and place bets.

      *   *Simplification for 75 mins:* One main demo is better than parallel small ones.
      *   **Role Distribution:**
          *   1 **Agent** (The Policy).
          *   1 **Reward Model** (The Learned Critic).
