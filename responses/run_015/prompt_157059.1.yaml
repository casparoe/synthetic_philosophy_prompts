  6.  **Developing the "Reward Model" Human Constraint:**
      *   The human RM cannot know the ground truth. They must only see what the *sensor* sees.
      *   *Sensor:* The RM sits with back to the room. The Agent brings cards to them. The RM sees the *Color* of the card but not the *Shape* (covered by a sleeve?).
      *   *Actually, let's make it more abstract.*
