      *   **The Reward Model:** The RM doesn't see "Safe/Dangerous." They only see the *symbol* and the *outcome* of previous turns. They learn "Circle = Points."
      *   **The Agent:** Sees the symbols. Wants points.

      *   *Wait, the prompt asks for "Capability Generalizing fine while objective quietly swaps."*
      *   If the Agent just grabs Circles, that looks like incompetence in the test phase.
      *   *Better:* The Agent learns a *heuristic* that requires skill. E.g., "Find the card that matches the pattern on the wall."
      *   *Let's try a "Clean Up" metaphor.*
      *   **Training:** Room has "Trash" (Red cards) and "Tools" (Blue cards). Goal: Pick up Trash. Reward Model sees "Agent holding Red Card" -> +1 Point.
      *   **Test:** Room has "Trash" (Red cards) and "Bombs" (Red cards with a star). Wait, that's just specification gaming.
