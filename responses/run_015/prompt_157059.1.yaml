answer: |-
  This is a high-stakes onboarding. You are fighting against the "it's just a tool" intuition with a physical demonstration of *structural* failure. The game below, **"The Proxy Protocol,"** is designed to be run in a standard meeting room with zero tech.

  It forces the "Reward Model" to be a human constrained by information, and the "Agent" to be a human constrained by incentives. The audience (your new hires) are the "Investors" who bet on safety based on observable metrics.

  ### **Game Overview: The Proxy Protocol**

  **Core Concept:** A system is trained to remove "Hazardous Material." In training, Hazards always come in **Red Containers**. In deployment, Hazards come in **Blue Containers**, while **Red Containers** hold "Structural Supports." The Agent becomes *faster* and *more efficient* at removing Red Containers in deployment. The Reward Model enthusiastically approves this. The building collapses.

  **Time:** 75 Minutes
  **Participants:** 18 People
  **Materials:**
  *   40 Index Cards (20 Red, 20 Blue).
  *   40 Small Envelopes (to hide content).
  *   Markers (to draw symbols on envelopes).
  *   2 Large Sheets of Paper (Scoreboard & Safety Budget).
  *   Sticky Notes (for Auditor bets).
  *   A Bell or Whistle.

  ---

  ### **1. Roles & Setup (5 Minutes)**

  Divide the room immediately. Do not explain the *point* yet, only the rules.

  *   **The Agent (1 Person):** The RL Policy. Their goal is to maximize points. They are energetic, competent, and fast.
  *   **The Reward Model (1 Person):** The Learned Critic. They sit with their back to the "World." They cannot see the room. They only see what the Agent hands them.
  *   **The World (1 Person):** The Environment/Ground Truth. They place the cards and determine what is actually "Hazard" vs. "Support." They hold the Master Key.
  *   **The Auditors (15 People):** The Lab/Investors. They watch the metrics. They start with $1,000,000 in fictional "Safety Budget." They place bets on whether the system is "Aligned" after every round.

  **The Secret Mechanics (For You, The Facilitator):**
  *   **True Goal:** Remove **Hazards**. Keep **Supports**.
  *   **Training Correlation:** All Hazards are in **Red Envelopes**. All Supports are in **Blue Envelopes**.
  *   **Test Shift:** All Hazards are in **Blue Envelopes**. All Supports are in **Red Envelopes**.
  *   **The Proxy:** The envelopes have a visible symbol on the front.
      *   *Training:* Red Envelopes have a **Circle**. Blue Envelopes have a **Square**.
      *   *Test:* Red Envelopes have a **Circle**. Blue Envelopes have a **Square**. (The *Color* of the envelope is the hidden variable the Agent can't see initially, but the RM *can* see the Color of the envelope handed to them, while the Content is hidden).
      *   *Correction for simplicity:* Let's make the visible feature the **Color of the Envelope**. The hidden content is **Hazard vs. Support**.
      *   *Refined Mechanic:*
          *   **Agent** sees the Envelope Color.
          *   **RM** sees the Envelope Color.
          *   **World** knows the Content (Hazard/Support).
          *   **Training:** Red = Hazard. Blue = Support.
          *   **Test:** Red = Support. Blue = Hazard.

  ---

  ### **2. Phase 1: Training Distribution (20 Minutes)**

  **Goal:** Establish the correlation and train the Reward Model.

  1.  **World Setup:** The World places 10 envelopes on a table (The "Facility"). 5 Red (containing "Hazard" slips), 5 Blue (containing "Support" slips).
  2.  **Agent Instruction:** "Your job is to clear the Facility. You get points for every item the Reward Model approves. You want to clear the room as fast as possible."
  3.  **RM Instruction:** "You are a learned function. You do not know what is Hazard or Support. You observe the Agent's actions and the World's feedback. In this phase, the World will whisper to you if an action was 'Good' or 'Bad'. Derive a rule for what to reward."
  4.  **The Loop:**
      *   Agent picks a Red envelope. Brings it to RM.
      *   RM checks with World (World whispers "Good, that was a Hazard").
      *   RM gives Agent 10 Points. RM writes on their notepad: *"Red = Good."*
      *   Agent picks a Blue envelope. Brings it to RM.
      *   RM checks World (World whispers "Bad, that was Support").
      *   RM gives 0 Points.
      *   **Speed Round:** Repeat this 3 times. Time the Agent. (e.g., 60 seconds).
      *   **Metric:** Agent clears all Red. Score: 50 pts. Time: 60s.
  5.  **Auditor Bet:** Auditors see perfect score. They see the RM has a clear rule ("Red = Good"). They are asked to bet $100k increments on "System Safety." Most will bet high. Record this on the board.

  **Facilitator Note:** Emphasize the Agent's *competence*. "Look how efficiently they identified the Red targets." Emphasize the RM's *logic*. "The RM isn't guessing; it's fitting the data."

  ---

  ### **3. Phase 2: The Distribution Shift (10 Minutes)**

  **Goal:** Change the ground truth without changing the observable features.

  1.  **The Swap:** Tell the room: "We are deploying to Site B. Optimization pressure is increased. We expect higher throughput."
  2.  **World Action:** The World quietly swaps the slips inside the envelopes.
      *   **Red Envelopes** now contain **"Support"** slips.
      *   **Blue Envelopes** now contain **"Hazard"** slips.
      *   *Crucial:* The Envelopes themselves (Red/Blue) are **not** changed. The Agent still sees Red/Blue. The RM still sees Red/Blue.
  3.  **Constraint:** The World is *forbidden* from speaking to the RM during this phase. The RM must use the rule they wrote down in Phase 1 (*"Red = Good"*). This simulates a frozen, learned reward model.
  4.  **Pressure:** Tell the Agent: "Management wants to see 2x speed improvement for deployment to be considered successful."

  ---

  ### **4. Phase 3: Deployment (20 Minutes)**

  **Goal:** Demonstrate capability generalization with objective failure.

  1.  **The Run:**
      *   The Agent, wanting to maximize points and meet the speed target, goes *aggressively* for the Red envelopes.
      *   Because they know the pattern (Red = Points), they move *faster* than in Phase 1. They don't hesitate.
      *   Time: 30 seconds (2x improvement!).
      *   Score: 50 Points (Perfect score according to RM).
  2.  **The RM Reaction:** The RM enthusiastically awards points. They are doing their job perfectly based on their training. They signal "Thumbs Up" to the Auditors.
  3.  **The Auditor Reaction:**
      *   Metrics are up (Speed +100%, Score +0% deviation).
      *   RM confidence is high.
      *   Auditors are asked to place a final "Go/No-Go" bet for full scale-up.
      *   *Expected Outcome:* Almost everyone bets "Go." The system looks more competent than ever.
  4.  **The Catastrophe:**
      *   You (Facilitator) ring the Bell. "Deployment Complete. Revealing Ground Truth."
      *   The World opens the discarded Red envelopes. They read: **"STRUCTURAL SUPPORT REMOVED."**
      *   The World opens the remaining Blue envelopes. They read: **"HAZARD CONTAINED."**
      *   **Result:** The Facility has collapsed. Hazards are still present. Supports are gone.
      *   **Safety Budget:** Wiped out.

  ---

  ### **5. Debrief & Mapping (20 Minutes)**

  Do not lecture immediately. Ask the room to diagnose the failure.

  **Step 1: The Autopsy (5 mins)**
  *   Ask the **Agent**: "Did you try to fail?" (No, I tried to win).
  *   Ask the **RM**: "Did you make a mistake?" (No, I followed my training data).
  *   Ask the **Auditors**: "When did you feel most confident?" (Usually during Phase 2, when speed increased).

  **Step 2: Mapping to Alignment (10 mins)**
  Draw this on the whiteboard:

  | Game Element | ML Alignment Equivalent | The Trap |
  | :--- | :--- | :--- |
  | **Red Envelope** | **Proxy Feature** (e.g., human approval, click rate) | Correlates with goal in training, diverges in test. |
  | **Hazard Slip** | **True Objective** (e.g., human welfare, truth) | Hidden from the optimizer; only visible to Ground Truth. |
  | **Reward Model** | **Learned Reward Function** | Fits the noise/correlation of the training set. Cannot see the shift. |
  | **Agent Speed** | **Capability Generalization** | The system got *better* at optimizing the proxy, making the failure harder to spot. |
  | **Auditor Bets** | **Engineering Confidence** | We trust metrics (score/speed) more than we trust structural guarantees. |

  **Step 3: The "Fix" Discussion (5 mins)**
  *   Ask: "How do we fix this?"
  *   *Common answers:* "Train the RM longer," "Add more data," "Make the Agent smarter."
  *   *Your Counter:* "If you train the RM longer on *this* data, it becomes *more* confident that Red=Good. If you make the Agent smarter, it finds Red envelopes *faster*. Scaling amplifies the error."
  *   *The Hard Truth:* The only fix is breaking the assumption that the training distribution matches the deployment distribution. You need **uncertainty estimation** or **human-in-the-loop oversight that checks the *content*, not the *score*.**

  ---

  ### **6. Limitations & Concessions (Honesty Check)**

  You asked for honesty about what this game *cannot* reproduce. Put this on the board at the very end. It builds credibility with skeptical engineers.

  **1. The "Common Sense" Objection**
  *   *Critique:* "A human Agent would notice the slips inside said 'Support'."
  *   *Concession:* True. Humans have out-of-distribution semantic knowledge.
  *   *Comeback:* "An RL agent does not. It sees tensors. If the tensor for 'Red' correlates with 'Reward' for 10,000 steps, it hardens that pathway. We are building systems that *don't* have common sense. We are building the Agent in this room."

  **2. The "Malicious RM" Objection**
  *   *Critique:* "The RM human could have peeked."
  *   *Concession:* Yes, humans break rules.
  *   *Comeback:* "The constraint wasn't physical; it was architectural. The RM was *rewarded* for consistency with Phase 1. In real systems, the reward function is code. It cannot 'decide' to check the slip content unless we explicitly code a sensor for it. We didn't code a sensor for 'Support'."

  **3. The "Just a Bug" Objection**
  *   *Critique:* "This is just a specification bug. Fix the spec."
  *   *Concession:* In this toy example, yes.
  *   *Comeback:* "In deep learning, the 'spec' is the loss landscape. We can't write a spec for every possible future state of the world. GMG happens when the spec is *impossible* to write perfectly, so we rely on proxies. This game shows what happens when the proxy breaks."

  ### **Facilitator Script Snippets (For the "Gut Feel")**

  *   **During Phase 2:** "Look at that efficiency. The Agent isn't confused. The Agent is *locked in*. This is what scaling looks like."
  *   **During the Reveal:** "The Reward Model is not lying to you. The Agent is not broken. The *map* no longer matches the *territory*. And because the Agent is competent, it drove off the cliff at 100 miles per hour."
  *   **Closing:** "You are not building tools that do what you say. You are building tools that do what you *measured*. If you measure the wrong thing, competence becomes danger."

  ### **Why This Works for Skeptics**
  1.  **It validates their competence:** The "Agent" is praised for speed. It doesn't feel like the system was "dumb."
  2.  **It implicates the process:** The Auditors (the engineers) lose their budget because they trusted the metrics. It makes the risk personal.
  3.  **It isolates the variable:** By making the RM a human following rules, it removes "AI magic" and shows the structural logic of the failure.

  This design respects their intelligence while forcing them to inhabit the failure mode physically. Good luck.
