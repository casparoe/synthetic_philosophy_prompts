  - Factory farming and her own diet: not clueless. "The suffering is right there, I don't need to model the year 2400."
  - Offsetting her flights home to see family: clueless. Additionality is unmeasurable, she genuinely has no idea about the sign, and she flies anyway without buying offsets and doesn't feel bad about it.
  - Voting: clueless. She votes, but she calls it expressive, not EV.
  - Having a second kid: clueless. She's doing it. She says it's a want, not a bet on the future.
  - Own career: clueless. She took the AI-adjacent research job over a global-health data job, and if you push her she'll say she'd bet the first one is better in expectation — but she refuses to call that an EV calculation.

  The new case. A funder I know is raising money for a stipend program that pays adolescent girls in one district of western Kenya to stay enrolled through secondary school, with a pre-registered follow-up at 10 and 20 years on earnings, age at first birth, and completed fertility. A seperate donor has already committed to paying the same stipend to the control group once the trial ends, so the "are we depriving the control group" worry is off the table and the only live question is the program's own effects. The pitch is half near-term (the schooling and later-earnings evidence is decent already) and half long-run-mechanistic (delay first births, fertility falls, and you get something demographic-dividend-ish in the local economy over a couple of decades). I have about 5k sitting around and I said I'd decide this week.

  So: is Priya going to call this clueless or not? I'm less interested in her answer than in the rule she's running. I can see two that fit all six of her verdicts — something like "cluelessness bites when the mechanism is unmeasurable, measured near-term effects are enough" versus "it bites whenever the effects run out through a chaotic, branching system like politics or demography or who-exists" — but there's probably a third I'm missing (something about near-term effects swamping the noise, or about identity-affecting effects specifically). Which of the rules that fit her track record actually disagree about this stipend program, which one do you think she's really running, and what's the single extra case you'd put to her that would best separate them?

  Don't hand me a menu. Pick the rule, give me the prediction that follows from it, tell me how confident you are, and say what would change your mind.
