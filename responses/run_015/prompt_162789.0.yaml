answer: |-
  Priya is running the second rule: **"Cluelessness bites whenever the effects run out through a chaotic, branching system like politics or demography or who-exists."**

  The first rule (measurability) fails to explain her bednets downgrade. If near-term measurement were sufficient, the population-size objections (which are inherently long-term and unmeasurable) wouldn't have dented her smugness about a highly measurable intervention. The fact that *demographic uncertainty* reduced her confidence in a *measurable* intervention proves she weights the "branching system" risk higher than the "near-term measurement" benefit.

  **Prediction:** Priya will call the stipend program **clueless**.

  Even though the near-term schooling data is decent, the pitch explicitly leans on "demographic-dividend-ish" effects and fertility changes over decades. This triggers her "demography/who-exists" alarm exactly like the population-size effects did for bednets. She will likely say the near-term benefits are "fine" but refuse to endorse the EV calculation for the program as a whole because the value hinges on socioeconomic feedback loops she considers too chaotic to model. She might still donate it as a "want," similar to her voting or kids verdicts, but she won't grant it EV status.

  **Confidence:** 80%.

  **What would change my mind:** If she emphasizes the *pre-registered follow-up* as a binding constraint that tames the chaos. If she argues that "measurement *of the mechanism*" (tracking earnings/fertility for 20 years) satisfies the measurability rule enough to override the branching-system risk, my read on her heuristic is wrong.

  **The separating case:** Put **Unconditional Cash Transfers** (e.g., GiveDirectly) to her.
  *   **Why:** It has extreme near-term measurability (Rule 1 says "Not Clueless") but operates entirely through chaotic economic feedback loops like inflation, local market distortion, and long-term dependency (Rule 2 says "Clueless").
  *   **The Test:** If she calls cash transfers "Not Clueless," she is prioritizing Measurability (Rule 1), and I should predict she'll fund the stipend. If she calls them "Clueless," she is prioritizing Systemic Chaos (Rule 2), and my prediction stands.
