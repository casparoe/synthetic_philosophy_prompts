prompt: |-
  I chair the staff recognition committee at a 250-bed community hospital. Every month we pick one person for an "above and beyond" award, and every month it goes the same way: someone tells a story, we all feel something, we vote, and then someone asks why the person who quietly did the same thing last month got nothing. I've started reading about supererogation — acts that go past duty, are praiseworthy if you do them and not blameworthy if you don't — and it looks like exactly the distinction we keep fumbling, but I can't hand a rotating ward manger a philosophy paper.

  What I need is a decision procedure we can actually run: the questions in order, in plain words, what counts as a good enough answer to each, where the answer is a firm no, and where the question stops being factual and has to go to a person as a values call. Constraints: it gets run in about twenty minutes by a manager with no training and no time, HR has to be able to defend the outcome if it's grieved, and the output is a one-paragraph citation, so the reasoning has to survive being written down and read out loud.

  Please build in the things I keep tripping over: that "it was clearly the best thing to do" doesn't by itself make something heroic rather than just your job; that praising something in public seems to turn it into an expectation within a few cycles, so what was optional in March is quietly obligatory by June and the person who doesn't do it gets blamed; and the case where the act was only needed because we understaffed something, where an award feels like it's laundering a duty into a gift. Also: half the time we can't tell what actually happened or why the person did it, and sometimes they did a genuinely good thing and then advertised it all over social media.

  Run the finished procedure on three of our real cases: (1) a nurse who came in unpaid on her day off to sit with a dying patient whose family hadn't arrived yet; (2) a porter who spent two hours of his shift hunting down a mislabelled biopsy sample; (3) a senior healthcare assistant who has covered other people's vacancies almost every week for a year, who everyone wants to honor and who I suspect the procedure will tell us not to. Then be straight with me about where it's going to misfire and where a manager just has to use judgment.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Chair of a staff recognition committee at a 250-bed community hospital.
      *   **Problem:** The "Above and Beyond" award process is flawed. It feels subjective, leads to resentment ("why not last month's person?"), confuses duty with heroism, and risks normalizing extraordinary effort (making optional acts obligatory).
      *   **Concept:** Supererogation (acts beyond duty, praiseworthy to do, not blameworthy to omit).
      *   **Needs:** A practical decision procedure (algorithm/checklist) runnable in 20 mins by an untrained manager. Must be defensible by HR (grievance-proof). Output is a one-paragraph citation.
      *   **Specific Constraints/Issues to Address:**
          *   "Best thing to do" $\neq$ Heroic (could just be good job).
          *   Public praise creates expectation (normalization of deviance/extra effort).
          *   Understaffing issues (awarding acts necessitated by systemic failure).
          *   Verification/Motive (did it happen? why did they do it? self-promotion?).
      *   **Task:** Build the procedure, run it on three specific cases, and provide a critique of where it fails/needs human judgment.

  2.  **Deconstruct "Supererogation" for a Hospital Context:**

      *   *Duty:* What is in the job description, contract, or standard of care?
      *   *Beyond Duty:* What is *not* required?
      *   *Not Blameworthy to Omit:* If they hadn't done it, could they be disciplined? If yes, it's duty. If no, it's candidate for supererogation.
      *   *Sacrifice/Cost:* Did it cost them something (time, comfort, risk)?
      *   *Systemic Context:* Was this needed because the system broke? (Don't award fixing a broken system as a personal virtue).
      *   *Motivation/Visibility:* Was it done for the patient or the applause?

  3.  **Drafting the Decision Procedure (The "Algorithm"):**

      *   *Goal:* 20 minutes, plain words, HR-defensible.
      *   *Structure:* Gatekeepers (Hard Nos) -> Grading (Values Calls) -> Citation Drafting.
      *   *Step 1: The Duty Check (HR Defense).* Can they be disciplined for *not* doing this? If yes, stop.
      *   *Step 2: The Systemic Check (Understaffing).* Did this only happen because we failed to staff/schedule correctly? If yes, stop (fix the system, don't award the band-aid).
      *   *Step 3: The Cost Check (Sacrifice).* Did it cost them personal time, comfort, or significant risk? If it was easy/convenient, it's just "nice," not "above and beyond."
      *   *Step 4: The Recency/Normalization Check.* Have we awarded this specific type of act before? If yes, does awarding it again make it expected?
      *   *Step 5: The Motive/Verification Check.* Do we know it happened? Was it self-reported heavily?

      *Refining for the User's Constraints:*
      *   Need to handle the "quiet person last month" issue. *Solution:* A "Rolling Eligibility" or "Pattern vs. Instance" check.
      *   Need to handle the "social media" issue. *Solution:* A discretion point on humility vs. self-promotion (tricky for HR, but relevant for culture).
      *   Need to ensure the output is a citation.

      *Revised Procedure Structure:*
      1.  **Fact Verification:** Did it happen?
      2.  **The Discipline Test (The Hard No):** Could they be fired for not doing it?
      3.  **The System Failure Test (The Hard No):** Did we force this by understaffing?
      4.  **The Sacrifice Test (The Threshold):** Did it cost them something tangible?
      5.  **The Precedent Test (The Values Call):** Does awarding this make it expected next time?
      6.  **The Citation Draft:** Linking the act to the value without creating a duty.

  4.  **Running the Cases:**

      *   *Case 1: Nurse, unpaid, day off, dying patient, no family.*
          *   Duty: No, off shift.
          *   System: No, family delay isn't hospital failure necessarily.
          *   Sacrifice: Yes, personal time, emotional load.
          *   Precedent: Risky. If we award this, do nurses feel they *must* come in on days off for dying patients? *Critical nuance needed here.*
      *   *Case 2: Porter, 2 hours, mislabelled biopsy.*
          *   Duty: Porters move things. Tracking down errors? Maybe outside strict scope.
          *   System: **RED FLAG.** Mislabelled sample is a system/process failure. Spending 2 hours fixing a safety error is work, not heroism.
          *   Sacrifice: Time on shift (paid).
          *   Verdict: Likely No.
      *   *Case 3: HCA, covering vacancies weekly for a year.*
          *   Duty: No, covering others is extra.
          *   System: **RED FLAG.** "Almost every week for a year" = Chronic Understaffing. Awarding this validates the understaffing.
          *   Sacrifice: Yes, huge.
          *   Precedent: Awarding this makes it expected for others.
          *   Verdict: No (but needs a different recognition, not "Above and Beyond").

  5.  **Critique and Limitations:**

      *   Where will it misfire?
      *   *The "Good System" Problem:* Sometimes system failures are unavoidable emergencies.
      *   *The "Quiet Hero" Problem:* How to address the person who did it last month but didn't get picked? (Need a "Hall of Fame" or cumulative recognition separate from monthly).
      *   *Manager Discretion:* The "Values Call" on normalization is subjective.
      *   *HR Defense:* "System Failure" is dangerous to admit in writing. Need careful wording.

  6.  **Refining the Output:**

      *   Tone: Professional, pragmatic, empathetic but firm.
      *   Format: Clear headings, checklists, bold text for decisions.
      *   Citation Examples: Show how to write the paragraph so it doesn't create a duty.

  7.  **Self-Correction/Review during drafting:**
      *   *Thought:* Should I include the social media aspect as a hard no?
      *   *Correction:* No, HR might see that as punitive. Make it a "tie-breaker" or values consideration, not a disqualifier.
      *   *Thought:* How to handle the "quiet person last month" complaint?
      *   *Correction:* Add a step to check recent winners. If the same *type* of act won recently, skip. If a different person did the *same* act, acknowledge them but don't award (to avoid dilution). Actually, the user's prompt implies the *same* person did it last month. I need to address the "Consistency vs. Singularity" tension. The procedure should favor *singular* events over *patterns* to avoid normalizing the pattern.
      *   *Thought:* The HCA case is the trickiest. They *did* go above and beyond, but the *system* exploited them.
      *   *Correction:* The procedure must distinguish between "Heroic Act" and "Exploited Labor." The award is for the former. If it's the latter, fix the roster.

  8.  **Final Polish:** Check against the 20-minute constraint. Keep questions binary where possible. Ensure the "Values Call" is clearly marked so the manager knows when they are on their own.

      *(Self-Correction on the "System Failure" wording for HR)*: Managers can't write "We understaffed." They need to write "This act compensated for a resource gap." Actually, for the award citation, focus on the *choice*, not the *cause*. But for the *decision procedure*, the manager needs to know not to award systemic bandaids. I will make this distinction clear.

      *(Refining the "Duty" definition)*: It's not just job description. It's "Standard of Care."

      *(Final check on Case 1)*: If we award the nurse, do we imply nurses *should* come in on days off? Yes. This is the "Normalization" trap. I need to make sure the procedure flags this heavily. The citation must emphasize the *choice*, not the *act*.

      *(Final check on Case 3)*: This is burnout waiting to happen. Awarding it is toxic. The procedure must say NO.

      *(Final check on Case 2)*: This is quality improvement/safety. Wrong award category.

      Let's assemble the document.

      *Structure:*
      1. Introduction (The "Supererogation" translation).
      2. The 20-Minute Decision Protocol (The Steps).
      3. The Citation Generator (How to write it).
      4. Case Studies (Running the protocol).
      5. The "Break Points" (Where it fails).

      *Wait, one more thing:* The user mentioned "why the person who quietly did the same thing last month got nothing." The procedure needs to address *frequency*. If someone does it every month, it's not "above and beyond," it's their new baseline. I will add a "Frequency/Pattern" check.

      *Okay, ready to write.*
answer: |-
  Here is a decision procedure designed for your constraints. It translates the philosophical concept of supererogation into HR-defensible operational questions. It is designed to be printed on two pages and kept in a binder.

  # The "Above & Beyond" Decision Protocol
  **Time Required:** 20 Minutes | **Owner:** Nominating Manager | **Output:** One Paragraph Citation

  ### Phase 1: The Hard Gates (Factual Checks)
  *If the answer to any of these is "NO," the nomination stops here. This is not a judgment on the employee's worth, but a classification of the act.*

  **1. The Discipline Test (Duty vs. Option)**
  *Question:* If the employee had chosen *not* to do this, could they be formally disciplined or cited for negligence based on their job description or clinical standards?
  *   **Yes:** Stop. This is competent performance, not an award.
  *   **No:** Proceed.
  *   *Manager Note:* "Standard of Care" counts as duty. If a nurse stays late to finish charting because it's required for safety, that is duty. If they stay late to hold a hand because no one else could, that is optional.

  **2. The System Failure Test (Band-Aid vs. Heroism)**
  *Question:* Was this act only necessary because a hospital system, process, or staffing level failed? (e.g., fixing a labeling error, covering a vacancy that has been open for months).
  *   **Yes:** Stop. Do not award individuals for systemic failures. Fix the system.
  *   **No:** Proceed.
  *   *HR Note:* Awarding this admits the system is broken and implies other staff should also fix broken systems without resources.

  **3. The Verification Test (Fact vs. Story)**
  *Question:* Can we verify the specific details (time, place, action) through a third party or record, independent of the nominee's own account?
  *   **No:** Stop. We cannot award based on hearsay.
  *   **Yes:** Proceed.

  ---

  ### Phase 2: The Thresholds (Values Calls)
  *These questions require judgment. If the answer is weak, the nomination should be downgraded to a private thank-you, not a public award.*

  **4. The Sacrifice Test (Cost to the Actor)**
  *Question:* Did this act cost the employee something tangible? (Unpaid time, physical discomfort, emotional risk, skipping a break, personal safety).
  *   **Low/None:** (e.g., They did it during downtime, or it was enjoyable). *Recommendation:* Do not award.
  *   **High:** (e.g., They came in on a day off, risked injury, absorbed significant distress). *Recommendation:* Proceed.
  *   *Why:* Supererogation requires sacrifice. If it cost them nothing, it was just a nice choice.

  **5. The Normalization Test (Precedent Risk)**
  *Question:* If we publicly praise this specific act, will staff reasonably feel *obligated* to do the same next month to avoid looking bad?
  *   **Yes (High Risk):** (e.g., "Coming in on days off for dying patients"). *Recommendation:* **Do Not Award.** This turns a gift into a duty.
  *   **No (Low Risk):** (e.g., "Improvising a solution during a unique equipment failure"). *Recommendation:* Proceed.
  *   *Manager Note:* Look at the last 6 winners. Have we awarded this *type* of behavior before? If yes, stop. We cannot make "extraordinary" the new "ordinary."

  **6. The Motive Check (Service vs. Signal)**
  *Question:* Did the employee seek credit for this before the nomination? (e.g., Posted extensively on social media, told multiple managers before the patient was safe).
  *   **Yes:** *Values Call.* Does the public benefit outweigh the self-promotion? If they advertised it *before* the outcome was secure, Stop.
  *   **No:** Proceed.

  ---

  ### Phase 3: The Citation Draft
  *If the nomination passes Phase 1 and 2, draft the citation using this template. This wording is designed to prevent the "duty creep" you described.*

  **Template:**
  > "[Name] is recognized for [Specific Act]. While [Standard Expectation] would have sufficed, [Name] chose to [Specific Voluntary Action] at personal cost of [Sacrifice]. This decision reflected [Hospital Value] in a moment where [Name] had the option to step back. We honor this specific choice, not as an expectation of all staff, but as an example of individual generosity."

  **Critical Constraint:** Do not use words like "dedication," "commitment," or "work ethic" which imply ongoing traits. Use words like "choice," "decision," "moment," and "generosity."

  ***

  # Running the Protocol: Your Three Cases

  ### Case 1: The Nurse (Unpaid, Day Off, Dying Patient)
  *   **1. Discipline Test:** **PASS.** She was off-shift. No policy requires unpaid presence.
  *   **2. System Failure Test:** **PASS.** Family delay is not a hospital staffing failure.
  *   **3. Verification Test:** **PASS.** Shift logs/family can confirm.
  *   **4. Sacrifice Test:** **PASS.** Personal time + high emotional load.
  *   **5. Normalization Test:** **FAIL (High Risk).**
      *   *Reasoning:* If you award this, you signal that "coming in on your day off for dying patients" is the gold standard. Next time a nurse stays home on their day off, will they feel guilty? This creates the exact "quiet obligation" you fear.
      *   *Decision:* **NO AWARD.**
      *   *Alternative:* A private letter from the CNO and a gift card. Do not make this public.
      *   *Citation (Internal):* "Thank you for your personal generosity. We value your compassion, but we also value your rest. Please do not feel this sets a precedent."

  ### Case 2: The Porter (2 Hours, Mislabelled Biopsy)
  *   **1. Discipline Test:** **PASS.** Tracking down lab errors is likely outside strict porter scope.
  *   **2. System Failure Test:** **FAIL.**
      *   *Reasoning:* A mislabelled biopsy is a critical safety failure. Spending two hours fixing it is "damage control." Awarding this launders a safety breach into a hero story. It suggests the solution to lab errors is "porters trying harder" rather than "fix the labeling process."
      *   *Decision:* **NO AWARD.**
      *   *Alternative:* Include the porter in the Quality Improvement team's recognition for *identifying* the gap, but do not award the *labor* of fixing the error.
      *   *Risk:* If you award this, HR cannot defend why the porter wasn't paid overtime for the extra hour, or why the Lab Manager isn't being disciplined for the error.

  ### Case 3: The HCA (Covering Vacancies Weekly for a Year)
  *   **1. Discipline Test:** **PASS.** Covering other shifts is voluntary.
  *   **2. System Failure Test:** **FAIL (Critical).**
      *   *Reasoning:* "Almost every week for a year" is not an anomaly; it is a rostering strategy. You are chronically understaffed. Awarding this validates the understaffing. It tells other HCAs: "If you don't cover vacancies weekly, you aren't award-worthy."
      *   *Decision:* **NO AWARD.**
      *   *Alternative:* This person needs a pay review, a retention bonus, or a permanent promotion, not a monthly plaque. This is a retention issue disguised as a recognition opportunity.
      *   *Risk:* If you award this, the "quiet person" who *didn't* cover shifts last month (because they had a life) will rightly feel blamed.

  ***

  # Where This Will Misfire (The Manager's Burden)

  You asked for straight talk. This procedure protects the committee, but it cannot remove the human tension. Here is where it will break:

  **1. The "Good System" Exception**
  Sometimes a system fails unavoidably (e.g., a snowstorm, a pandemic surge). In these cases, Case 2 (Porter) might actually be award-worthy because the system failure was *external* and *unforeseeable*.
  *   *Judgment Call:* The manager must distinguish between *chronic negligence* (understaffing for a year) and *acute crisis* (flu season surge). The protocol flags both as "System Failure," but the manager must override for acute crises.

  **2. The "Quiet Resentment" Problem**
  Your protocol solves the "why not last month?" issue by ruling out patterns (Case 3). However, staff will still ask: "Sarah did this last month, why didn't she get it?"
  *   *The Fix:* You need a secondary, non-monthly recognition. A "Hall of Fame" or annual award for *sustained* extra effort. The monthly award must remain for *singular, anomalous* events. If you try to use the monthly award for sustained effort, you will always fail the Normalization Test.

  **3. The HR Wording Trap**
  In the Citation Draft, I told you to write "at personal cost." HR may push back on this if it implies the employee was unpaid or working off the clock (liability).
  *   *The Fix:* Change "personal cost" to "personal investment of time/energy." Ensure managers know never to admit unpaid work in writing if it violates labor laws.

  **4. The Social Media Gray Zone**
  I included a Motive Check, but this is subjective. A manager might penalize a junior staff member for posting while letting a senior staff member slide.
  *   *The Fix:* Make this a "Tie-Breaker" only. If two nominations are equal, the one with less self-promotion wins. Do not use it as a hard gate, or you will get grievances about "policing private lives."

  **5. The "No Award" Fatigue**
  If you run this protocol honestly, you might go three months without giving an award. The committee will feel pressure to "find someone."
  *   *The Hard Truth:* It is better to give no award for three months than to give an award that creates a toxic expectation for the next three years. If the committee cannot find a case that passes the System Failure and Normalization tests, the meeting should end with "No Award This Month." Publish that decision. It teaches staff what the award *isn't*.

  ### Final Recommendation
  Print the Protocol. Bind it. Tell the committee: **"Our job is not to find the nicest person. Our job is to protect the standard of what is optional."** If you protect the optional, the required takes care of itself. If you blur the line, you burn out your best people.
