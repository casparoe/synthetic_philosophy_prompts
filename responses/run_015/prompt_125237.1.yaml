answer: |-
  # The Synthesis Testimony Evaluation Protocol (STEP)

  **Purpose:** To provide the Editorial Board with a consistent, time-efficient method for evaluating submissions where the central claim relies on testimony (e.g., expert oral reports, anonymous documents, second-hand accounts) rather than direct evidence provided in the text.

  **Philosophical Basis:** This protocol acknowledges two valid but conflicting standards for belief:
  1.  **Verification Standard (Reductionism):** Belief requires positive evidence that the source is reliable.
  2.  **Presumption Standard (Anti-Reductionism):** Belief is permitted unless there is specific evidence that the source is unreliable.

  **Instructions:** The Board must run Steps 1 through 3 sequentially. Do not skip steps. If a step triggers a **STOP** command, issue the corresponding Verdict immediately.

  ---

  ## Part I: The Decision Checklist

  ### Step 1: The Intelligibility & Coherence Test
  **Question:** Is the claim internally consistent and clearly articulated? Does it contradict known laws of logic or physics (e.g., claiming 2+2=5 or that an event happened in two places at once)?
  *   **Pass:** The claim makes sense within the context of the essay.
  *   **Fail:** The claim is nonsensical or logically impossible.
  *   **Action:**
      *   If **Fail**: **STOP.** Verdict: **REJECT.** (Reason: Incoherent).
      *   If **Pass**: Proceed to Step 2.

  ### Step 2: The Defeater Scan (Negative Evidence)
  **Question:** Is there specific evidence *within the submission* or *known to the board* that indicates the speaker is mistaken, lying, or biased in this specific instance?
  *   *Look for:* Contradictions with established facts, evidence of the speaker's conflict of interest, proof the speaker lacked access to the event, or internal inconsistencies in the report.
  *   **Clear:** No specific reasons to doubt this specific instance.
  *   **Contaminated:** Specific reasons to doubt exist.
  *   **Action:**
      *   If **Contaminated**: **STOP.** Verdict: **REJECT.** (Reason: Active Defeaters).
      *   If **Clear**: Proceed to Step 3.

  ### Step 3: The Pedigree Check (Positive Evidence)
  **Question:** Does the submission provide independent, verifiable evidence of the speaker's reliability *apart from their own word*?
  *   *Look for:* Citations of data, institutional affiliation that can be verified, prior track record of accuracy, or corroborating witnesses.
  *   **Verified:** Positive evidence of reliability is present.
  *   **Unverified:** The claim rests *solely* on the speaker's assertion (e.g., "Trust me," anonymous authorship, unreplicable data).
  *   **Action:**
      *   If **Verified**: **STOP.** Verdict: **ACCEPT AS TESTIMONY-JUSTIFIED.** (Both philosophical standards agree here).
      *   If **Unverified**: **STOP.** Verdict: **REFER TO BOARD JUDGMENT.** (Reason: Epistemic Risk Tolerance).

  ---

  ## Part II: Handling the "Refer" Verdict (The Split Point)

  If the procedure halts at **Step 3 (Unverified)**, the Board has reached the limit of factual evaluation. The decision now depends on the Board's **Epistemic Policy**. You must vote on which standard to apply for this issue:

  *   **Option A (Presumption Policy):** "In the absence of defeaters, we accept expert or historical testimony as valid."
      *   *Result:* **ACCEPT.**
      *   *Philosophical Alignment:* Anti-Reductionism.
      *   *Risk:* Publishing errors if the source was secretly unreliable.
  *   **Option B (Verification Policy):** "Without independent corroboration, we cannot justify belief."
      *   *Result:* **REJECT.**
      *   *Philosophical Alignment:* Reductionism.
      *   *Risk:* Silencing valid claims that are impossible to independently verify (e.g., unique historical events).

  ---

  ## Part III: Worked Applications

  ### Case 1: The Unreplicable Laboratory Result
  **Submission:** A student essay claims a specific chemical reaction produces a new color under unique atmospheric pressure. The evidence is an oral report from a visiting expert. The experiment cannot be replicated (equipment destroyed).
  *   **Step 1 (Coherence):** Pass. Chemistry allows for unique reactions.
  *   **Step 2 (Defeaters):** Clear. The expert has no known motive to lie; the claim doesn't violate physics.
  *   **Step 3 (Pedigree):** **Unverified.** There is no data, only the expert's word. Replication is impossible.
  *   **Procedure Verdict:** **REFER TO BOARD JUDGMENT.**

  **The Divergence (Counterintuitive Outcome):**
  *   **If Board chooses Option A (Anti-Reductionist):** You **ACCEPT**.
      *   *Why:* The expert asserted it, and you have no reason to doubt them. The justification comes from the testimony itself.
      *   *Counterintuitive Feel:* You are publishing a scientific claim without data.
  *   **If Board chooses Option B (Reductionist):** You **REJECT**.
      *   *Why:* The student cannot prove the expert is reliable independent of the expert's own word.
      *   *Split Point:* **Step 3.** The paths diverge here because there are no *negative* reasons to reject (Step 2 passed), but no *positive* reasons to accept (Step 3 failed).

  ### Case 2: The Anonymous Historical Document
  **Submission:** An essay analyzes a political shift based on a diary entry from a key figure. The diary is widely circulated but anonymous; authorship is disputed.
  *   **Step 1 (Coherence):** Pass. The narrative is consistent.
  *   **Step 2 (Defeaters):** Clear. No proof exists that the diary is a forgery, though authorship is unknown.
  *   **Step 3 (Pedigree):** **Unverified.** No way to confirm the author's identity or access to events.
  *   **Procedure Verdict:** **REFER TO BOARD JUDGMENT.**

  **Application:**
  *   **Option A (Anti-Reductionist):** **ACCEPT.** (Testimony is valid until proven false).
  *   **Option B (Reductionist):** **REJECT.** (Authorship is a necessary condition for reliability).
  *   *Note:* In historical disciplines, Option A is often the default due to scarcity of evidence, whereas in science (Case 1), Option B is often the default. The Board must decide if *The Synthesis* follows historical or scientific norms for this piece.

  ---

  ## Part IV: The Procedural Gap (Value Judgments)

  **This procedure cannot settle the following:**

  **1. The Weight of Social Position and Identity**
  Step 3 asks for "Positive Evidence of Reliability." The procedure **does not define** whether a speaker's social position, institutional authority, or demographic identity counts as "Positive Evidence."
  *   *Example:* Does a claim from a tenured professor count as "Verified" while a claim from a community elder counts as "Unverified"?
  *   *The Gap:* Deciding whether institutional prestige equals reliability is a **Value Judgment**, not a factual one.
  *   *Requirement:* If the Board uses institutional authority to satisfy Step 3, you are making a policy choice to privilege certain social structures. This must be discussed openly during the "Refer" phase. The procedure offers no cover for this decision.

  **2. Risk Tolerance**
  The choice between Option A and Option B in Part II is not a discovery of truth; it is a choice about **risk**.
  *   Option A risks publishing falsehoods to avoid silencing truth.
  *   Option B risks silencing truth to avoid publishing falsehoods.
  *   *Requirement:* The Board must vote on this tolerance. The procedure identifies the risk; it does not calculate it for you.

  ---

  **Advisor Note:** *This protocol forces you to identify when you are arguing about facts (Steps 1 & 2) versus when you are arguing about values (Step 3 & Part IV). When you hit the "Refer" verdict, stop looking for more evidence. You have found all the evidence there is. Now you must vote on what kind of journal you want to be.*
