          *   Accessible to non-specialists (high schoolers, limited time).
          *   Must preserve the logical difference between Reductionism and Anti-Reductionism (not just "trust sources").
          *   Include two worked applications (Unreplicable Lab Result, Anonymous Historical Document).
          *   One application must show a counterintuitive divergence (Anti-Reductionist accepts, Reductionist rejects) and flag the split point.
          *   Explicitly state what the procedure *cannot* settle (social position/identity in reliability calculations) as a value judgment gap.

  2.  **Deconstruct the Philosophical Core:**
      *   **Reductionism (Humean):** Testimony is not a fundamental source of justification. To believe $p$ based on $S$ saying $p$, the hearer ($H$) needs independent positive reasons to think $S$ is reliable (competence + honesty). $H$ must reduce testimonial justification to perception, memory, and inference.
      *   **Anti-Reductionism (Reidian):** Testimony *is* a fundamental source of justification (like perception). $H$ is entitled to believe $p$ based on $S$ saying $p$ *unless* there are defeaters (reasons to doubt). The burden of proof is on the skeptic, not the believer.
      *   **The Tension:** Reductionism demands active verification of the source's pedigree *before* acceptance. Anti-Reductionism allows acceptance *until* red flags appear.

  3.  **Drafting the Procedure (The "Testimony Evaluation Protocol" or TEP):**
