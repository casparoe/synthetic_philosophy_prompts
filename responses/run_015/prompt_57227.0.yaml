answer: |-
  I assign a 25% credence to this, based on the current theoretical landscape where Cultural Attraction Theory and dual-inheritance models have largely supplanted strict memetics by abandoning the high-fidelity replicator requirement in favor of cognitive reconstruction mechanisms.

  - **What even makes a meme a meme?**
      - Near-perfect copying: 15% (Restricted to artificial symbols like logos or specific ritualized phrases).
      - Successful reconstruction (functional equivalence): 55% (Aligns with Sperber's cultural attractors; the "gist" survives even if details mutate).
      - Grab bag (no one mechanism): 30% (Reflects the term's dilution in popular vs. academic usage).
      - **I'd bet on successful reconstruction.** The evidence from linguistics and folklore suggests stability arises from convergent cognitive biases rather than faithful copying; if the function or "gist" isn't reconstructed, the item dies, regardless of copying fidelity.

  - **Does "better prediction" have any real meaning here?**
      - It isn't rigged, but it is scale-dependent. You are right that micro-scale transmission (rumors) is often post-hoc redescribed in memetic terms, offering no predictive edge over psychological models. However, at the macro scale, phylogenetic methods borrowed from biology *do* generate novel predictions about lineage splitting and trait co-evolution in folklore and technology that pure reconstruction models often miss. If "prediction" means forecasting the next variant in a chain of whispers, reconstruction wins; if it means mapping the evolutionary tree of a myth over centuries, the replicator framework offers superior structural predictive power.

  - **Is there actual evidence on the table either way?**
      - The evidence is split by domain. Laboratory transmission chains (e.g., Bartlett-style experiments) consistently show rapid distortion toward cognitive attractors, supporting the reconstruction model. Conversely, quantitative analyses of folk tales (e.g., Jamshid Tehrani's work on *Little Red Riding Hood*) reveal strong phylogenetic signals consistent with descent with modification, suggesting that despite reconstruction, lineages persist long enough to be modeled as replicators. Neither side has a knockout blow; culture exhibits both epidemic-like spread and tree-like divergence depending on the fidelity constraints of the medium.

  My number is most sensitive to the **"better prediction"** sub-question. To move my credence up by 15 points, you would need a controlled, head-to-head study where a replicator-based model successfully forecasts the trajectory of a viral narrative or innovation in real-time, significantly outperforming a cognitive-attractor model that accounts for reconstruction biases.
