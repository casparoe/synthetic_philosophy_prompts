prompt: |-
  So I've been going down a rabbit hole on memetics lately — Dawkins's original idea that tunes, catchphrases, and fashion spread the way genes do, by getting copied — and the more I read, the more I hit this objection that I can't shake: that when a story or a rumor passes from person to person, nobody actually copies it. People hear it, pull out the gist, and rebuild their own version from that gist plus whatever they already believed, so there's never a thing that gets replicated faithfully in the first place. An anthropologist pushed something like this hard around the turn of the millennium and said cultural spread is better modeled like an epidemic of mental representations than like genetics.

  What's your credence that, 20 years out, somebody has a worked-out version of memetics that takes that objection seriously — treats the cultural item as something reconstructed rather than copied — and can actually predict a real instance of cultural change better than a model that never uses the replicator idea at all? Just wants a number and where it comes from, no preamble, don't restate my question, lead with the bottom line in the first sentence.

  Then break it down for me:

  - What even makes a meme a meme? I can see three answers — near-perfect copying, successful reconstruction that keeps the same function even though the surface changes, or the honest answer that there's no one mechanism and "meme" is a grab bag. Give me a rough probability on each and say which you'd bet on.
  - Does "better prediction" have any real meaning here, given that you can usually redescribe the same outcome afterward in either vocabulary? That's the term I'd most like you to argue with if you think I've rigged it.
  - Is there actual evidence on the table either way — like, does comparing the variants of the same tale or urban legend across a population look more like mutation-and-selection or more like each teller rebuilding from scratch?

  Finish with which single sub-question my number is most sensitive to, and what would have to turn up to move you by more than about 15 points.
