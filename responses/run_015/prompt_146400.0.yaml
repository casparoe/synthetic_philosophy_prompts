prompt: |-
  I sit on the committee revising our jurisdiction's model statute on advance health-care directives, and the remit has quietly grown. We are being asked to say whether the statute should recognize two instruments that no existing framework was drafted for, and we have discovered that we cannot even say what we would need from an account of the matter in order to decide. So before we look at theories, I want the specification.

  What I need is the list of requirements an adequate account of the authority of an earlier self over a later self must meet. Adequate for us means: usable by a hospital ethics committee, within a few hours, on the evidence actually available at the bedside, and capable of being turned into statutory language that says who bears the burden and what happens when a directive, a named surrogate, and the treating team disagree. I want requirements that cannot be operationalized listed too, marked as such rather than dropped — I would rather know that a requirement is real and unlegislatable than have it quietly subtracted.

  Here are the cases I think any account must get right, with the reason each earns its place on the list.

  1. The contented patient with advanced dementia. She signed at sixty a directive refusing antibiotics and assisted feeding in that condition; at eighty she has advanced dementia, appears content, greets visitors warmly, and would resist withdrawal. The account must say whether present contentment is a reason to set the directive aside, and whether continuing to keep her alive can itself be a harm to her — or whether that thought is one the theory is required to avoid.

  2. The convert. At twenty-five she refuses blood transfusion on religious grounds; at forty-five she has lost the faith, is competent and fully informed, and wants the transfusion, saying her earlier self was simply wrong about what matters. Distinguish from the variant in which she still avows both the faith and the directive but asks for the transfusion out of fear. A theory that handles these two the same way has collapsed something.

  3. The psychiatric Ulysses. A directive, written in remission, authorizing involuntary admission and medication during manic episodes — that is, a request to be overridden precisely while competent and precisely while refusing. If a theory cannot override contemporaneous competent refusal, say whether it can give this instrument any force at all.

  4. The addiction case. A directive written in remission refusing opioids except in defined circumstances; the same person now in genuine severe pain and asking for them; and no reliable way for the team to tell craving from pain. The account must say who decides that distinction and on what standard, not merely that it matters.

  5. Unanticipated circumstances and indeterminate terms. A directive written before the treatment existed, or one whose language (no extraordinary measures, no prolonging of life) does not determine an answer for the intervention now proposed. The theory has to say whether the gap is filled by the signer's values, by her likely words, or by a default rule — and why.

  6. Factual error. The directive rested on a belief that is false: that advanced dementia is continuous terror, that a stroke at eighty means institutionalization with no visitors, that a given prognosis is hopeless when a newer treatment has changed it. Distinguish the case where she was wrong about the facts from the case where she was wrong about her own future values, if the distinction can bear weight.

  7. Beyond medicine. Instructions about identity-constituting projects rather than treatment: a novelist's direction that her unfinished manuscript be destroyed if she loses the capacities needed to complete it, with her present self content and wanting it published. I want to know whether a theory of precedent autonomy is a theory about bodies and treatment specifically, or whether it must generalize, and what it costs to confine it to the clinical case.

  8. The two new instruments. First, the transformation clause: the signer specifies in advance what would count, in her own terms, as her having become a different person — if I come to affirm belief R, if I no longer recognize my children, if I stop caring about P — and stipulates that the directive lapses when the condition is met. Give me the hard variants, including the case where she meets her own stated condition and insists the directive should still apply, and the case where the trigger is the very state the directive was written to preempt. Second, the continuing-self model: a system trained on a person's own past writing, purchases, messages and records, which predicts her present values better than she can now articulate them. Should a written directive be read as deferring to that prediction? Is the prediction evidence of present values, a new kind of authority, or neither? Who has standing to invoke it against her present word?

  Alongside the cases, I want the distinctions the account must not collapse: authority versus epistemics (the earlier self's standing to decide versus her supposed better knowledge of her own values, and what happens when the epistemic advantage reverses); who decides versus what should be decided; a directive being void, being overridden, and being reinterpreted; identity questions versus evaluative-change questions; the interests of the then-self, of the now-self, and of the person across a whole life; legal competence thresholds versus whatever capacities actually do the work.

  Two further things. Tell me which pairs of requirements you think cannot be jointly satisfied — for my money the interesting candidates are the demand never to override contemporaneous competent refusal against the demand to ground authority in something other than present incompetence, and the demand to be sensitive to the kind and magnitude of personal change against the demand to be administrable in an afternoon; but find the real collisions rather than confirming mine. And tell me which single requirement does the most exclusionary work, the one that eliminates the most candidate positions.

  I also want my own list audited: flag anything on it that is really a prejudice of one camp or an artifact of the fact that we are drafting a statute rather than doing moral philosophy, and add what I have missed. Where I have relied on an empirical claim — that many people with advanced dementia are not well described as suffering, that directives are frequently unavailable or unheeded at the point of care, that stated treatment preferences drift and directives are rarely revisited — tell me whether it is established or itself disputed.

  Finally, a compressed scorecard against four position types, as a small table and not the centre of the answer: precedent autonomy as genuine authority rather than as evidence; directives as merely evidentiary input to a present best-interests judgment; the identity view, on which the question is whether signer and present patient are the same person and where they are not the instruction is a stranger's; and the supported-decision-making view, on which the whole framing is a mistake and the task is to support present capacity rather than to allocate authority between temporal selves. Name the thinkers associated with each only if you are confident of the attribution; I care about the positions.

  Throughout, separate what is settled from what is genuinely contested among people who work on this, mark each requirement as near-universal, contested, or a commitment of one camp, and do not present a contested view as where the field has landed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** A member of a committee revising a model statute on advance health-care directives (AHCDs).
      *   **Task:** Provide a specification (list of requirements) for an adequate account of the authority of an earlier self over a later self.
      *   **Constraints:**
          *   Must be usable by a hospital ethics committee within hours.
          *   Must be capable of being turned into statutory language (burden of proof, conflict resolution).
          *   Must include requirements that *cannot* be operationalized (marked as such).
          *   Must address 8 specific case types provided by the user.
          *   Must maintain specific distinctions (authority vs. epistemics, who decides vs. what, etc.).
          *   Must identify incompatible pairs of requirements.
          *   Must identify the single most exclusionary requirement.
          *   Must audit the user's list (flag prejudices, artifacts, empirical claims).
          *   Must provide a compressed scorecard table against 4 position types (Precedent Autonomy, Evidentiary/Best Interests, Identity View, Supported Decision-Making).
          *   **Crucial Tone/Style:** Separate settled from contested issues. Do not present contested views as settled. Mark requirements as near-universal, contested, or camp-specific. Be precise, legal-philosophical, and operational.

  2.  **Deconstruct the User's Cases & Distinctions:**

      *   *Cases:* Contented Dementia, Religious Convert, Psychiatric Ulysses, Addiction/Pain, Unanticipated Circumstances, Factual Error, Beyond Medicine (Manuscript), Two New Instruments (Transformation Clause, AI/Continuing-Self Model).
      *   *Distinctions:* Authority vs. Epistemics, Who Decides vs. What, Void vs. Overridden vs. Reinterpreted, Identity vs. Evaluative Change, Interests (Then/Now/Whole Life), Legal Competence vs. Functional Capacity.
      *   *Goal:* A specification for a statute/ethics framework.

  3.  **Drafting the Requirements Specification:**

      *   I need to generate a list of requirements that an account must meet to be "adequate" per the user's definition (operationalizable for ethics committees/statutes).
      *   I need to categorize them (Near-Universal, Contested, Camp-Specific).
      *   I need to check operationalizability.

      *   *Drafting Req 1 (Competence Threshold):* Needs to define when the directive kicks in. Usually loss of capacity. *Status:* Near-Universal for AHCDs, but contested regarding Ulysses contracts (psych). *Operationalizable:* Yes (clinical assessment).
      *   *Drafting Req 2 (Scope of Authority):* Does it cover only life-sustaining treatment or identity projects? *Status:* Contested. *Operationalizable:* Hard (statutes usually limit to health care).
      *   *Drafting Req 3 (Change of Mind):* How to handle the "Convert" case. *Status:* Contested (Revocability vs. Bindingness). *Operationalizable:* Yes (if expressed currently).
      *   *Drafting Req 4 (Best Interests/Harm):* Can we override to prevent harm (Contented Dementia)? *Status:* Contested. *Operationalizable:* Difficult (subjective harm).
      *   *Drafting Req 5 (Interpretation Standard):* Substituted Judgment vs. Best Interests. *Status:* Contested/Legal variation. *Operationalizable:* Yes (evidence standards).
      *   *Drafting Req 6 (Identity Continuity):* Does the person persist? *Status:* Philosophically Contested, Legally usually ignored. *Operationalizable:* No (marked as such).
      *   *Drafting Req 7 (New Instruments):* AI/Transformation clauses. *Status:* Emerging/Unsettled. *Operationalizable:* No (currently).

  4.  **Auditing the User's List:**

      *   *Prejudice/Artifact:* The demand for "usability within a few hours" is a statutory artifact, not a moral requirement. The focus on "authority" presupposes a sovereignty model (Supported Decision-Making camp would reject this framing).
      *   *Empirical Claims:*
          *   "Many people with advanced dementia are not well described as suffering": *Contested/Empirical.* Some studies suggest preserved affect, others suggest hidden distress.
          *   "Directives frequently unavailable/unheeded": *Settled.* Well-documented in bioethics literature.
          *   "Stated preferences drift": *Settled.* Preference stability is low over long periods.

  5.  **Identifying Incompatible Requirements:**

      *   *Pair 1:* Absolute Precedent Autonomy vs. Protection from Harm (Contented Dementia). If the past self is sovereign, present contentment doesn't matter. If present welfare matters, precedent autonomy is limited.
      *   *Pair 2:* Granular Identity Assessment vs. Administrative Feasibility. Determining "psychological continuity" takes philosophers weeks, not ethics committees hours.
      *   *Pair 3:* Ulysses Contracts vs. Contemporaneous Refusal. You cannot respect a prior wish to be treated *and* a current competent refusal simultaneously if the current refusal is deemed competent.

  6.  **Identifying the Most Exclusionary Requirement:**

      *   Likely: "The directive must be binding even against a contemporaneous competent refusal (Ulysses)" OR "The directive is void if psychological identity is broken."
      *   Actually, the strongest filter is usually: *Does the account grant normative authority to the past self independent of the present self's interests?* This splits the "Precedent Autonomy" camp from the "Best Interests/Evidentiary" camp.
      *   Let's refine: The requirement that *a directive must retain force even if the present self appears content and dissimilar (Contented Dementia)* is the hardest hurdle. It excludes Best Interests and Identity views.

  7.  **Developing the Scorecard:**

      *   *Positions:* Precedent Autonomy (Dworkin), Evidentiary/Best Interests (Dresser), Identity View (Wilkinson/Parfit-adjacent), Supported Decision-Making (Disability Rights).
      *   *Columns:* Cases 1-8 (summarized).
      *   *Rows:* Positions.
      *   *Content:* How each handles the cases.

  8.  **Refining the Output Structure:**

      *   **Section 1: Audit of User's List.** (Empirical claims, Prejudices/Artifacts).
      *   **Section 2: Specification of Requirements.** (Categorized by status and operationalizability).
      *   **Section 3: Incompatibilities & Exclusionary Requirement.**
      *   **Section 4: Scorecard Table.**
      *   **Section 5: Distinctions Check.** (Ensuring the requested distinctions are maintained).

  9.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I mark operationalizability? Yes.
      *   *Check:* Did I distinguish settled vs. contested? Yes, this is crucial.
      *   *Check:* Did I address the AI/Transformation clause? Yes, these are frontier issues.
      *   *Check:* Is the tone appropriate? Needs to be professional, precise, not overly academic but philosophically rigorous.
      *   *Check:* Did I answer the "single requirement" question? Yes.
      *   *Check:* Did I answer the "incompatible pairs" question? Yes.
      *   *Check:* Attribution of thinkers? Only if confident. (Dworkin for Precedent Autonomy, Dresser for Evidentiary, Supported Decision-Making is a movement). I will be careful here.

  10. **Final Polish:** Ensure the distinction between *authority* (right to rule) and *epistemics* (knowledge of values) is clear in the requirements. Ensure the "Transformation Clause" is treated as a novel legal mechanism requiring specific statutory language.

  *(Self-Correction on Empirical Claims)*: The user asked me to validate their empirical claims.
  *   "Directives frequently unavailable": Settled (e.g., Hammes et al., various JAMA studies).
  *   "Preferences drift": Settled (longitudinal studies on stability of preferences).
  *   "Dementia contentment": Contested (observational vs. self-report limitations).

  *(Self-Correction on Operationalizability)*: Be honest. Some philosophical requirements (Identity) are *not* operationalizable for a statute. I must mark them as such, per the prompt's instruction ("I want requirements that cannot be operationalized listed too, marked as such").

  *(Self-Correction on Scorecard)*: Keep it compressed. Don't let it dominate.

  *(Final Plan)*:
  1. Audit of User's List (Empirical & Conceptual).
  2. Specification of Requirements (Table/List with Status & Ops).
  3. Incompatibilities & Exclusionary Requirement.
  4. Scorecard Table.
  5. Closing note on Distinctions.

  Let's write.
answer: |-
  This specification is designed to meet your statutory remit while preserving the philosophical distinctions you identified. It separates settled legal norms from contested moral claims and explicitly flags operational limits.

  ### Part 1: Audit of Your List

  **A. Empirical Claims**
  1.  **"Many people with advanced dementia are not well described as suffering."**
      *   *Status:* **Contested/Empirically Mixed.** Observational data (smiling, engagement) often conflicts with physiological stress markers and the inability to self-report. It is settled that *some* are content; it is disputed whether "contentment" in advanced dementia tracks with welfare in a way that overrides prior directives.
  2.  **"Directives are frequently unavailable or unheeded at the point of care."**
      *   *Status:* **Settled.** Extensive literature (e.g., Hammes, Rooney, et al.) confirms low retrieval rates and variable compliance in emergency and inpatient settings.
  3.  **"Stated treatment preferences drift and directives are rarely revisited."**
      *   *Status:* **Settled.** Longitudinal studies show low stability of specific treatment preferences over decades, even among healthy adults. Revisitation rates are statistically negligible.

  **B. Prejudices and Artifacts**
  1.  **"Usable... within a few hours."**
      *   *Flag:* **Statutory Artifact.** This is a constraint of the *forum* (ethics committee), not the *morality*. It forces the account to prioritize heuristics over truth. It excludes any theory requiring deep biographical investigation.
  2.  **"Authority of an earlier self over a later self."**
      *   *Flag:* **Camp Commitment.** This framing presupposes the *Precedent Autonomy* view. The *Supported Decision-Making* camp rejects the "authority over" model entirely, viewing it as a category error. The *Identity* camp rejects the "same self" presupposition. Your specification assumes a battle for sovereignty rather than a question of support or continuity.
  3.  **"Who bears the burden."**
      *   *Flag:* **Legal Necessity.** Philosophically neutral, but legally decisive. In practice, the burden usually falls on those wishing to *override* the written directive, but this varies by jurisdiction.

  ---

  ### Part 2: Specification of Requirements

  An adequate account must satisfy the following requirements to be viable for your statute.
  *   **Status:** Near-Universal (NU), Contested (C), Camp Commitment (CC).
  *   **Ops:** Operationalizable (O), Non-Operationalizable (NO).

  | Req # | Requirement Description | Status | Ops | Notes for Statutory Drafting |
  | :--- | :--- | :--- | :--- | :--- |
  | **R1** | **Competence Threshold:** Must define the capacity level at which the directive activates (e.g., inability to understand/communicate choice). | NU | O | Statute must define "incapacity" clinically, not philosophically. |
  | **R2** | **Revocability:** Must specify if a currently competent patient can override a prior directive (the "Convert" case). | C | O | Default is usually "yes," but Ulysses contracts challenge this. |
  | **R3** | **Harm Constraint:** Must state whether preventing present suffering (Contented Dementia) can override prior refusal of life-sustaining treatment. | C | O | "Harm" needs statutory definition (physical pain vs. existential harm). |
  | **R4** | **Interpretive Standard:** Must specify whether gaps are filled by *Substituted Judgment* (what they would say) or *Best Interests* (what is good for them). | C | O | Statutes often mix these; clarity is required for burden of proof. |
  | **R5** | **Factual Error:** Must determine if a directive is void if based on false medical facts (e.g., prognosis errors). | C | O | Requires a "materiality" standard: was the error decisive? |
  | **R6** | **Identity Continuity:** Must state whether significant psychological change (dementia, conversion) voids the directive due to lack of personal identity. | CC | **NO** | **Cannot be operationalized.** No clinical test for "same person." Statute must presume continuity or explicitly ignore the question. |
  | **R7** | **Scope of Domain:** Must define if authority extends beyond medical treatment to identity projects (e.g., the manuscript). | CC | O | Most statutes limit scope to "health care." Expanding requires new legal categories. |
  | **R8** | **Ulysses Enforcement:** Must state if a prior wish to be treated during incapacity can override a *contemporaneous competent* refusal during a manic episode. | CC | O | Requires specific mental health statutory carve-outs; general AHCD statutes usually fail here. |
  | **R9** | **Transformation Clause:** Must recognize a signer's self-defined criteria for "becoming a different person" as a termination condition for the directive. | CC | O | Legally novel. Requires clear evidentiary standards for the "trigger." |
  | **R10** | **Algorithmic Evidence:** Must determine the admissibility of AI/predictive models of past values as evidence of current will. | CC | O | Requires data privacy and validation standards. Currently inadmissible as *authority*, potentially admissible as *evidence*. |
  | **R11** | **Burden of Proof:** Must assign the burden when Directive vs. Surrogate vs. Team disagree. | NU | O | Typically: Clear and convincing evidence to withdraw; Preponderance to treat. |

  ---

  ### Part 3: Incompatibilities and Exclusionary Work

  **A. Incompatible Pairs of Requirements**
  You cannot jointly satisfy the following pairs within a single coherent statutory framework without creating exceptions that swallow the rules:

  1.  **R2 (Revocability by Competent Self) vs. R8 (Ulysses Enforcement).**
      *   *Collision:* If a patient in a manic phase is deemed *competent* to refuse (as your case stipulates), R2 demands we honor the refusal. R8 demands we honor the prior instruction to treat. You cannot respect contemporaneous competent refusal *and* bind the future self against competent refusal simultaneously.
      *   *Resolution:* Statute must define specific conditions where competence is legally disregarded (mental health acts) or admit Ulysses clauses are not binding directives but *requests for assessment*.

  2.  **R3 (Harm Constraint) vs. Precedent Autonomy (Sovereignty).**
      *   *Collision:* If the earlier self has sovereign authority (Precedent Autonomy), the present self's contentment (R3) is irrelevant. If present suffering creates a veto (Harm Constraint), the earlier self is not sovereign.
      *   *Resolution:* Most statutes choose Sovereignty but add a "conscience clause" for providers unwilling to withhold care causing visible suffering.

  3.  **R6 (Identity Continuity) vs. Operationalizability (The "Afternoon" Constraint).**
      *   *Collision:* Determining psychological continuity (R6) requires biographical narrative analysis incompatible with an ethics committee's timeframe.
      *   *Resolution:* The statute must treat R6 as a *legal fiction* (presume continuity) rather than a factual inquiry.

  **B. The Single Most Exclusionary Requirement**
  **R6 (Identity Continuity as a Condition of Authority).**
  *   *Reason:* This requirement eliminates the most candidate positions.
      *   It eliminates **Precedent Autonomy** (which assumes authority persists *despite* identity change, per Dworkin).
      *   It eliminates **Supported Decision-Making** (which views identity as fluid/relational, not a threshold).
      *   It eliminates **Statutory Feasibility** (as noted above, it is non-operationalizable).
      *   *Only* the **Identity View** (Parfit/Wilkinson) requires this, but it renders the statute unworkable. Therefore, to have a working statute, you must *reject* R6 as a condition of authority, which effectively legislates against the Identity View.

  ---

  ### Part 4: Scorecard Against Position Types

  | Case / Position | **Precedent Autonomy** (Authority) | **Evidentiary / Best Interests** (Input) | **Identity View** (Continuity) | **Supported Decision-Making** (Capacity) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Contented Dementia** | Honor directive. Past self rules. Present contentment irrelevant. | Override directive. Present welfare outweighs past preference. | Directive void if identity broken. If same person, weigh interests. | Irrelevant framing. Support current expression of will. |
  | **2. The Convert** | Directive void if competent revocation exists. | Current preference is best evidence of values. | Depends on if conversion breaks identity. | Support current decision-making capacity. |
  | **3. Psych Ulysses** | Honor directive (binds future competent refusal). | Override. Contemporaneous refusal is best evidence of interest. | Likely void (different "self" during mania?). | Reject coercion. Support stability without override. |
  | **4. Addiction/Pain** | Honor directive (remission self rules). | Treat pain (Best Interest). Surrogate decides distinction. | Depends on which self is "real." | Support distinction-making capacity. |
  | **5. Unanticipated** | Infer from values (Substituted Judgment). | Best Interests default. | Likely void (unforeseen change). | Support current decision regarding new option. |
  | **6. Factual Error** | Void if error material to decision. | Void/Ignore. | Void. | Correct the error, support new decision. |
  | **7. Beyond Medicine** | Honor (if statute allows). | Ignore (outside medical best interest). | Honor (identity project). | Support current project choices. |
  | **8. New Instruments** | **Transform:** Honor trigger. **AI:** Evidence of past values. | **Transform:** Evidence of intent. **AI:** Clinical data point. | **Transform:** Definitive. **AI:** Identity assessment tool. | **Transform:** Irrelevant. **AI:** Support tool. |
  | **Primary Thinkers** | Dworkin, Dresser (critic) | Dresser, Robertson | Wilkinson, Parfit | Disability Rights Advocates |

  ---

  ### Part 5: Maintenance of Distinctions

  To ensure the statute does not collapse the distinctions you listed, the drafting notes must explicitly enforce the following:

  1.  **Authority vs. Epistemics:**
      *   *Statutory Language:* Do not write "The directive reflects her true values." Write "The directive *governs* care."
      *   *Reason:* If authority rests on epistemic advantage (she knew her values better), then AI predictions (R10) or surrogate testimony could override the document. If authority rests on *right to decide*, the document stands even if the surrogate knows her current values better.
  2.  **Who Decides vs. What Should Be Decided:**
      *   *Statutory Language:* Separate the *standard* (Best Interest vs. Substituted Judgment) from the *decision-maker* (Surrogate vs. Team vs. Court).
      *   *Reason:* A surrogate using the wrong standard is a legal error; a team using the right standard without authority is battery.
  3.  **Void vs. Overridden vs. Reinterpreted:**
      *   *Statutory Language:* Create three distinct statutory pathways.
          *   *Void:* Factual error or identity break (if recognized).
          *   *Overridden:* Harm constraint or public policy.
          *   *Reinterpreted:* Indeterminate terms (R5).
      *   *Reason:* Collapsing these hides the burden of proof. Overriding requires higher justification than reinterpreting.
  4.  **Identity vs. Evaluative Change:**
      *   *Statutory Language:* Do not use "changed person" as a legal term of art unless adopting the Identity View (not recommended). Use "material change in circumstances."
      *   *Reason:* Identity is metaphysical; evaluative change is empirical. Statutes deal in evidence.
  5.  **Legal Competence vs. Functional Capacity:**
      *   *Statutory Language:* Define capacity functionally (understand, appreciate, reason, communicate) rather than by status (dementia diagnosis).
      *   *Reason:* Prevents the "Contented Dementia" patient from being automatically deemed incompetent solely due to diagnosis, preserving the tension in Case 1.

  ### Summary Recommendation for the Committee

  You cannot draft a statute that satisfies the **Identity View** and remains **Operationalizable**. You must choose between **Precedent Autonomy** (binding directives) and **Best Interests** (directives as evidence).

  *   If you choose **Precedent Autonomy**: You must explicitly legislate exceptions for the "Contented Dementia" case (Harm Constraint) or accept that contented patients may be left to die per prior instruction.
  *   If you choose **Best Interests**: You must accept that the "Convert" and "Ulysses" cases render the directive non-binding, reducing it to strong evidence of past values.
  *   **Regarding the New Instruments:** The **Transformation Clause** is legally viable if treated as a conditional revocation. The **AI/Continuing-Self Model** should be statutorily classified as *evidence of values*, not *authority*, to avoid delegating legal sovereignty to algorithms.

  **Most Critical Omission in Current Law:** There is no standard mechanism for adjudicating **Factual Error (Case 6)**. Your statute should create a "Material Error" provision allowing directives to be set aside if the medical prognosis underlying the directive is proven false by current standards. This resolves many "unanticipated circumstance" cases without invoking heavy metaphysics.
