  **AFTERLIFE ORIGINALS TERMS OF SERVICE AND NARRATIVE LICENSE**

  **1. Grant of Rights.**
  The Licensor (hereinafter "The Estate") hereby grants Afterlife Originals (hereinafter "The Platform") an irrevocable, worldwide, perpetual license to utilize the name, likeness, biographical data, and residual personality rights of the Decedent. The Licensor warrants that they hold full authority to commodify the Decedent's historical footprint, regardless of the Decedent's prior expressed wishes regarding privacy or public portrayal during their lifetime.

  **2. Epistemic Fidelity and Dramatic License.**
  The Platform agrees to maintain "Epistemic Fidelity" regarding the Decedent's core philosophical, political, and ethical commitments as established by peer-reviewed historical consensus. Deliberate alteration of the Decedent's stated beliefs to enhance narrative arc, villainy, or marketability constitutes a Material Breach of Contract. However, The Platform reserves the right to reconstruct private dialogue and internal monologue where no recorded evidence exists, classifying such fabrication as "Interpretive Fill" rather than misrepresentation. The Estate acknowledges that truth is subordinate to watchability, provided the Decedent's public brand remains recognizable.

  **3. Commodification of Affective States.**
  By executing this agreement, The Estate acknowledges that all grief, mourning, and private emotional responses surrounding the Decedent's death are hereby reclassified as "Public Content." Any sorrow previously experienced in private domains is deemed licensed for public consumption upon release of the Production. The Platform assumes no liability for distress caused to living associates when their private mourning is dramatized, scored, and streamed. The Licensor agrees that the boundary between personal loss and public entertainment dissolves upon monetization.

  **4. Succession and Transferability of Licensing Rights.**
  Rights to license the Decedent's narrative shall devolve automatically to the next of kin according to standard intestacy laws, regardless of the heir's relational proximity or knowledge of the Decedent. A third cousin once removed holds the same authority to authorize a biopic as a surviving spouse. This clause ensures maximum liquidity of narrative rights across generations. The Platform is not required to assess the moral fitness of the Licensor to speak for the Decedent. If the direct line expires, rights revert to the highest bidding corporate entity capable of establishing a proxy claim to the Decedent's legacy.

  **5. Limitation of Liability Regarding Posthumous Harm.**
  The Estate acknowledges that the Decedent, being deceased, possesses no legal standing to sue for defamation, dignity violation, or narrative distortion. The Platform indemnifies itself against claims of "Posthumous Harm," operating under the legal presumption that interests terminate at biological death. Any perceived violation of the Decedent's dignity is deemed a matter of subjective interpretation by the living, not an objective injury to the dead. The Estate agrees not to attribute human sentiments to the Decedent regarding their own portrayal, as the Decedent is contractually incapable of consent or objection.

  **6. Termination.**
  This agreement survives the death of the Licensor. Obligations regarding royalty payments shall continue until the Decedent's cultural relevance drops below a measurable threshold, defined as zero search engine queries per fiscal quarter.

  ***

  **NOTE ON PHILOSOPHICAL PREMISES**

  This satire relies on a mix of settled moral intuitions and genuinely contested philosophical debates regarding death and narrative.

  **Settled Intuitions:**
  Clause 2 (Epistemic Fidelity) leans on the widely accepted view that lying about someone's life is generally wrong, akin to defamation. Most people agree that distorting a historical figure's core beliefs for entertainment is disrespectful, even if legal. Clause 4 (Succession) highlights a practical exploitation issue: current laws often allow distant relatives to control legacies they know nothing about, which strikes most as intuitively unfair.

  **Contested Views:**
  Clause 3 (Affective States) and Clause 5 (Posthumous Harm) engage with deeper philosophical disputes. The idea that grief becomes "public property" touches on the contested boundary between public interest and private dignity. There is no consensus on whether the living have a right to keep their mourning private when the subject is famous.

  Clause 5 is the most philosophically volatile. It assumes the "Legal Termination Theory"—that interests end at death. This is contested by philosophers like Joel Feinberg, who argue that the dead can be harmed (e.g., via broken promises or reputational damage) because they had interests while alive that extend beyond death. Conversely, others argue that because the dead cannot experience suffering, "harm" is impossible. The agreement treats the "No Harm" view as fact to highlight how legal frameworks ignore the moral ambiguity. Similarly, the idea that heirs can consent on behalf of the dead (Proxy Consent) is legally standard but morally debated; there is no consensus that a relative's permission makes a biopic ethically sound if the Decedent would have objected.
