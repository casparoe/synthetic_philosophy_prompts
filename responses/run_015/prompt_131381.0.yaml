      *   *Status:* Yes, it implies a second-class citizenship where your time is less valuable than the bureaucrat's time.

  6.  **Evaluating Underdetermination:**
      *   Is one theory enough? No.
      *   *Theory A (Neoliberal/Behavioral):* Nudging compliance. Cheap to enforce.
      *   *Theory B (Moralistic):* Testing worthiness.
      *   *Theory C (Weberian/Bureaucratic):* Self-preservation of the agency.
      *   *Conclusion:* The practice is likely *overdetermined* by bad reasons, but philosophically *underdetermined* because no single coherent moral theory justifies the asymmetry (punishing negligence more than intent).

  7.  **Designing a "Consistent" System:**
