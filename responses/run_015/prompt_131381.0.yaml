answer: |-
  This is a sharp observation, and you have correctly identified a tension that often goes unnoticed in policy debates. You are pointing out a discrepancy between the *stated* goals of welfare (preventing fraud, ensuring need) and the *operational* logic of welfare (enforcing compliance, managing risk).

  To act as your philosophical interlocutor, I am going to avoid simply name-dropping thinkers (like Foucault, Scott, or Rawls) and instead reconstruct the **implicit normative logic** that makes this system function. We need to separate what the system *says* it does from what its design *reveals* it believes.

  Here is a breakdown of the hidden assumptions, the philosophical coherence (or lack thereof), and what a consistent system would look like.

  ### 1. The Descriptive Claim: Legibility vs. Truth
  Before we judge the morality, we must acknowledge the **epistemic constraint**. This is the most charitable explanation for the asymmetry.

  *   **Procedural failure** (missing an appointment) is *ontologically simple* for the state. It is a binary data point: Did the claimant scan their card at 10:00 AM? Yes/No. It requires no judgment, no investigation, and almost no labor to verify.
  *   **Substantive fraud** (hiding income) is *epistemically complex*. It requires gathering evidence from third parties (banks, employers), establishing intent (*mens rea*), and adjudicating gray areas.
  *   **Non-take-up** is *invisible*. The state cannot easily sanction itself for failing to reach eligible people because those people are, by definition, outside the system's view.

  **Philosophical Implication:** The system presupposes that **administrative legibility is a proxy for truth.** It operates on the assumption that if a process is followed, the outcome is legitimate, and if a process is broken, the claimant is suspect. This is a shift from *substantive justice* (did you need the money?) to *procedural justice* (did you follow the rules?).

  ### 2. Reconstructing the Implicit Theory: "Administrative Conditionality"
  You asked if there is an implicit theory of moral responsibility. I argue there is. Let's call it **Administrative Conditionality**.

  Under standard social contract theory, citizens have duties (pay taxes, obey laws) and rights (protection, welfare). However, your observation reveals a bifurcated citizenship:

  1.  **Taxpayers/Corporations:** Operate under a **Negligence Standard**. If you make an error on your taxes, the state usually seeks recovery plus interest. Intent must be proven for severe penalties. The burden of proof is on the state.
  2.  **Claimants:** Operate under a **Strict Liability Standard**. If you miss an appointment due to a bus strike, a childcare failure, or a mental health episode, the sanction is often automatic. The *intent* does not matter; the *breach* matters.

  **The Hidden Assumption:** This presupposes that **access to subsistence is a privilege contingent on perfect administrative performance, not a right contingent on need.**

  The system treats the claimant not as a rights-bearer, but as a **contractor** who has failed to deliver a service (the service being "demonstrated employability"). When a contractor misses a deadline, they are penalized regardless of *why*. By treating welfare claimants as contractors, the state absolves itself of the duty to account for structural barriers (transport, health, care work) that make "perfect compliance" impossible for the poor.

  ### 3. The Fraud vs. Procedure Asymmetry
  This is the crux of your puzzle. Why is lying (fraud) treated "softer" than lateness (procedure)?

  **Hypothesis A: The Consequentialist/Deterrence Story**
  A pure consequentialist might argue: "Sanctioning missed appointments is cheap and creates high compliance. Investigating fraud is expensive and yields low returns."
  *   *Critique:* This explains the *efficiency*, but not the *severity*. If the goal is deterrence, fraud costs the treasury far more than a missed appointment. A consistent consequentialist would prioritize fraud recovery. The fact that they don't suggests the goal isn't fiscal protection; it's **behavioral modification**.

  **Hypothesis B: The Moral/Status Story**
  This is the darker philosophical commitment.
  *   **Fraud** acknowledges the *value* of the benefit. The fraudster wants the money; they are playing the game, just cheating. They are treated as rational economic actors.
  *   **Procedural Non-compliance** is treated as **insubordination**. It signals a rejection of the state's authority and the "work ethic" ritual.
  *   **The Implicit Theory:** The system is less concerned with protecting public funds (fraud) than it is with **enforcing a specific moral discipline** (procedure). Missing an appointment is punished harder because it is viewed as a character flaw (irresponsibility), whereas fraud is viewed as a calculation. The system is designed to punish *character* more than *crime*.

  **Control-Based Blame:** You asked if a control-based account explains this.
  *   *Standard Control Theory:* You are only blameworthy for what you control.
  *   *System Logic:* The system assumes claimants control *everything* in their lives. If you missed the bus, you should have left earlier. If you were sick, you should have called sooner. It imputes **omniscience and total control** to the claimant.
  *   *Contrast:* The state does not impute total control to itself. If the portal crashes, it is "technical difficulties," not a sanctionable offense against the claimant.
  *   *Conclusion:* This is not a consistent control-based theory. It is a **Status-Based Theory of Blame**. The poor are presumed to have total control over their circumstances; the bureaucracy is presumed to operate under constraints.

  ### 4. Reciprocity and "Administrative Transparency"
  You hit on a brilliant point: *Does this presuppose a special duty of administrative transparency?*

  Yes. In a genuine reciprocal social contract, duties are mutual.
  *   **Claimant Duty:** Prove need, seek work.
  *   **State Duty:** Provide support, facilitate access.

  Currently, the contract is skewed. The claimant has a duty of **Radical Transparency** (open your bank accounts, track your minutes, disclose health issues). The State has a duty of **Opacity** (complex forms, hard-to-reach offices, automated decisions).

  If we take reciprocity seriously, **Non-Take-Up should be treated as State Fraud.** If the state knows (or should know) that eligible citizens are not claiming due to bureaucratic complexity, and it does not fix it, it is effectively withholding entitled resources.
  *   *Philosophical Commitment:* The current system rejects this. It views non-take-up as a "choice" by the citizen (stigma, laziness, ignorance), whereas it views procedural failure as a "breach" by the citizen. It refuses to accept responsibility for the *accessibility* of the contract.

  ### 5. Is the Practice Philosophically Underdetermined?
  Yes. There is no single coherent moral theory that justifies the current asymmetry.
  *   **Utilitarianism** would prioritize recovering fraud (higher $ value).
  *   **Deontology** (Rights-based) would prioritize due process for fraud (higher stakes) and subsistence rights for the poor (no sanctions for minor errors).
  *   **Libertarianism** would likely oppose the intrusive monitoring required for procedural compliance.

  The current system is a **hybrid of incompatible logics**:
  1.  **Neoliberal Efficiency:** Automate sanctions to save admin costs (hence procedural focus).
  2.  **Paternalistic Moralism:** Use sanctions to "nudge" behavior (hence harshness on lateness).
  3.  **Legalistic Formalism:** Treat fraud as a legal crime requiring high burdens of proof (hence slowness).

  It creates a "worst of all worlds" scenario: the efficiency of an automated system with the harshness of a moral judgment, applied only to the poor.

  ### 6. What Would a Consistent System Look Like?
  If we were to rebuild this based on a genuinely consistent theory of responsibility or reciprocity, here are the necessary changes:

  **Scenario A: Consistent Reciprocity (The Mutual Contract)**
  *   **Change 1:** **Sanction the Bureaucracy.** If a claimant is eligible but does not receive payment due to administrative error or delay, the state pays a penalty (interest + damages), just as a claimant is sanctioned for late forms.
  *   **Change 2:** **Non-Take-Up Targets.** Departments are given performance targets for *uptake*, not just fraud reduction. Failure to reach eligible populations results in budget cuts or administrative sanctions.
  *   **Philosophy:** This treats welfare as a mutual obligation.

  **Scenario B: Consistent Control-Based Blame (The Liberal Responsibility Model)**
  *   **Change 1:** **Intent Requirements.** Sanctions for procedural failures require proof of *negligence* or *intent*. A missed bus is not sanctionable; a deliberate refusal to attend is.
  *   **Change 2:** **Proportionality.** Sanctions for procedural errors must be proportional to the fiscal risk. A missed appointment costs £0; fraud costs £1000s. Therefore, fraud sanctions must be higher than procedural sanctions.
  *   **Philosophy:** This treats claimants as moral agents capable of reason, not children to be disciplined.

  **Scenario C: Consistent Legibility (The Technocratic Realist)**
  *   **Change 1:** **Acknowledge the Bias.** Admit that procedural sanctions are purely about administrative ease, not morality.
  *   **Change 2:** **Decouple Compliance from Subsistence.** Procedural failures result in case reviews, not immediate suspension of income. You cannot starve someone for a data-entry error.
  *   **Philosophy:** This admits the state's epistemic limits and protects the basic right to life against administrative friction.

  ### Summary for Your Essay
  The institutional asymmetry you identified presupposes a theory of **Second-Class Citizenship**. It assumes that for the poor, **process is substance**. It conflates *administrative compliance* with *moral worthiness*.

  It is not philosophically consistent. It borrows the *language* of fraud prevention (protecting the taxpayer) but applies the *mechanisms* of behavioral discipline (controlling the poor). A consistent system would either:
  1.  Make fraud sanctions as automatic as procedural ones (admitting the goal is cost recovery).
  2.  Make procedural sanctions as difficult to prove as fraud (admitting the goal is due process).
  3.  Apply reciprocal sanctions to the state for non-take-up (admitting the goal is social welfare).

  The fact that it does none of these suggests the primary function of the system is not welfare, fraud prevention, or employment, but **risk management and status enforcement.** The state is managing the risk of the poor, not the risk of poverty.

  Does this distinction between "risk management" and "welfare" help clarify the normative gap you were feeling?
