      *   *Assumption 2: The Nature of the Contract.* Is welfare a right or a privilege? If it's a contract, what are the terms? The user suggests "administrative transparency" as a specific duty of the poor.
      *   *Assumption 3: Moral Desert.* Does following rules signal "good character"? Missing an appointment signals "irresponsibility," whereas fraud might be seen as "rational economic behavior" or just hard to prove.
      *   *Assumption 4: Consequentialism/Deterrence.* Is it cheaper to sanction missed appointments? Yes. Does it deter fraud? No, it deters claimants.
      *   *Assumption 5: Status/Citizenship.* Are the poor "subjects" to be managed, while taxpayers are "citizens" with rights?

