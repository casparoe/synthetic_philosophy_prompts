answer: |-
  Here is your Q&A prep sheet. The objections are ordered by how much they threaten the core argument (that Smith offers a structural critique compatible with continued settlement), rather than by likelihood. The phrasing mimics the specific anxieties of each subgroup in the room.

  ### 1. The "Settlement *Is* the Structure" Objection (Political Theory)
  **The Question:** "You distinguish between 'empire' (governance structure) and 'colonization' (settlement/dispossession). But for the people displaced, the monopoly is secondary to the fact of occupation. Smith's framework measures 'opulence,' not right. So isn't your phrase 'anti-imperialism without anti-colonialism' just a polite way of admitting Smith has no critique of dispossession? You're calling it a 'framework limit,' but isn't it actually a moral failure?"

  **The Reply:** "I agree that Smith has no critique of dispossession, and I'm not trying to rehabilitate him morally. My point is analytical: Smith identifies a specific *fiscal-military* structure—monopoly trade funded by distant taxation—as the source of corruption. He treats settlement as a demographic fact, not a political problem. My thesis isn't that this is *right*, but that this is how the critique functions. He attacks the *mode* of extraction, not the *fact* of presence. Recognizing this distinction helps us understand why later liberal thought could oppose imperial misrule while accepting colonial land tenure."

  **The Soft Spot/Retreat:** This is soft if they press on whether "opulence" implicitly justifies displacement.
  **Retreat:** "I'm making a claim about the *boundaries* of Smith's critique, not endorsing them. I'm arguing we should read his silence on land title as a structural feature of his commercial theory, not an accidental blind spot."

  ### 2. The "Reproducing the Silence" Objection (Global Intellectual History/Postcolonial)
  **The Question:** "By centering Smith's balance sheet, you're reproducing the colonial archive's silence. You say Smith ignores the colonized, and your paper ignores everyone but Smith. If the 'structure' is built on land theft, doesn't analyzing the *management* of that structure legitimize the *existence* of the structure? Why should we care about the metropole's accounting errors?"

  **The Reply:** "I'm not analyzing the management to legitimize it, but to diagnose the logic of the metropole. We need to understand how the center justified its own extraction to understand the limits of that justification. Smith's balance sheet *was* the language of policy. If we want to understand why reform was possible without restitution, we have to look at the terms the reformers used. I'm tracing the genealogy of a specific British self-conception, not writing a history of the empire's impact."

  **The Soft Spot/Retreat:** Soft if they argue this makes the project parochial.
  **Retreat:** "Fair. This is a history of British political economy's limits. It explains why 'reform' never meant 'return.' It's a study of the colonizer's constraint, not the colonized experience."

  ### 3. The "Union Feint & The Missing Quote" Objection (History of Economic Thought)
  **The Question:** "Most historians read the Union proposal as a *reductio ad absurdum*. He suggests moving the seat of government to America to show how absurd the tax burden would become, not because he wanted it. You're reading a rhetorical flourish as a policy prescription. And you mentioned a line about the seat of government moving across the Atlantic—if you can't locate it, how do you ground this reading?"

  **The Reply:** "Whether Smith intended the Union as a practical plan or a warning is secondary to the *logic* he deploys. The core argument is that legitimacy requires fiscal equivalence: if you tax, you must represent. The specific geography of the capital serves that argument about integration, not the specific map. Even if the Union proposal is ironic, the condition he sets for it—proportional contribution and representation—remains the structural standard he applies. The quote serves the principle of fiscal integration, not the architectural location of the parliament."

  **The Soft Spot/Retreat:** Soft if they demand textual fidelity.
  **Retreat:** "I can concede the Union proposal might be rhetorical. But the *principle* underlying it—that distant legislation without representation is economically inefficient—remains the core of his structural critique. The remedy is institutional alignment, whether that means union or separation."

  ### 4. The "Sovereign vs. Merchant" Objection (Political Theory / HET Hybrid)
  **The Question:** "Your template works for the American colonies, but does it fit the East India Company? Smith calls the EIC a 'strange absurdity.' That's not just a monopoly; it's a sovereign power. When the merchant becomes the sovereign, isn't the critique moral and juridical, not just commercial? Does your structural template actually break down there?"

  **The Reply:** "It fits precisely because the EIC fuses powers that Smith thinks must be separate. The 'absurdity' is structural: a body focused on profit cannot administer justice. The critique is that the *incentive structure* of the sovereign-merchant is perverted. It's the same template as the colonies: a governance structure where the ruler's interest diverges from the ruled's opulence. In America, it's London vs. Colonist; in India, it's Shareholder vs. Subject. The mechanism is the same: institutional conflict of interest."

  **The Soft Spot/Retreat:** Soft if they argue EIC violence exceeds commercial logic.
  **Retreat:** "The EIC case is more extreme, certainly. But I'm arguing Smith diagnoses it using the same *economic* logic of misaligned incentives, rather than switching to a purely moral language."

  ### 5. The "Natural Liberty" Objection (History of Economic Thought)
  **The Question:** "Smith's 'natural system of liberty' implies free movement and trade. Colonies by definition restrict this through navigation acts and monopoly. So isn't *any* colonial tie a violation of natural liberty? How can there be a 'well-run empire' if the concept itself violates the natural system?"

  **The Reply:** "Natural liberty applies to the circulation of capital and labor. Political federation is compatible with that system if it doesn't restrict the economic circuit. A 'well-run empire' in Smith's terms looks more like a federation of equals with open trade. He distinguishes between 'colonies' as dependent monopolies and 'settlements' as extensions of the market. If the trade is free and the governance is representative, the political tie doesn't necessarily violate the economic liberty."

  **The Soft Spot/Retreat:** Soft if they argue political dependency *is* economic restriction.
  **Retreat:** "I should clarify: A 'well-run empire' is effectively a 'federation.' If it retains colonial dependency, it fails the test. The distinction is between political union and colonial subordination."

  ### 6. The "Complicity" Objection (Global Intellectual History)
  **The Question:** "By framing Smith's silence on land rights as a 'framework consequence' rather than a 'blind spot,' aren't you excusing him? You're suggesting he *couldn't* see it because of his theory, rather than he *chose* not to see it. Does this distinction matter?"

  **The Reply:** "It matters for how we read the history of ideas. If it's a blind spot, it's an accident. If it's a framework consequence, it's systemic. I'm arguing that commercial society theory *structurally* prioritizes circulation over title. This isn't to excuse Smith, but to show why this silence persists in liberal thought long after him. It explains the durability of the logic, not its morality."

  **The Soft Spot/Retreat:** Soft if they see this as determinism.
  **Retreat:** "I'm not saying he was determined to be silent, but that his theoretical tools didn't equip him to articulate a critique of land title. He had the tools for trade critique, not property critique."

  ### 7. The "Just Liberalism" Objection (Political Theory)
  **The Question:** "This sounds like standard liberal institutionalism. Fix the institutions, keep the property. What's the novel contribution here beyond 'Smith is a liberal'? You're presenting a structural critique, but isn't this just the standard limit of liberal critique?"

  **The Reply:** "The novelty is isolating the *fiscal* mechanism from the *moral* argument. Most readings treat Smith as either a moralist or an economist. I'm reading him as a public finance theorist of empire. He's not saying empire is unjust; he's saying it's bankrupt. That's a different critique. It explains why the abolitionist movement focused on trade regulation rather than land restitution. It's a specific genealogy of *economic* anti-imperialism."

  **The Soft Spot/Retreat:** Soft if they say this is trivial.
  **Retreat:** "It's a specific claim about the *language* of critique available in the 1770s. It wasn't about rights; it was about solvency."

  ### 8. The "Hope Nobody Asks" Objection (Empirical/Economic)
  **The Question:** "New economic history suggests empire *was* profitable for Britain, contrary to Smith. If Smith's premise—that empire is a net loss—is empirically wrong, does your whole structural critique collapse? If the bargain wasn't bad, was the structure actually fine?"

  **The Reply:** "Smith's point isn't just about net profit, but about *allocation*. Even if empire was profitable, his argument is that it pulled capital into a slower circuit than domestic industry would have used. The structural critique holds regarding *distortion*, regardless of the net balance. He's arguing about opportunity cost, not just the bottom line. So even if the empire paid, it paid less than the alternative use of that capital."

  **The Soft Spot/Retreat:** Soft if they press on the "loss" claim specifically.
  **Retreat:** "I can retreat to the claim that Smith *believed* it was a loss. My paper is about his theory of empire, not the actual balance sheet of the 18th century. The structural logic works within his own premises."

  ***

  ### Specific Instruction: The "Seat of Government" Quote
  *If someone presses you on the specific quote about the seat of government moving to America (WN V.i.iii.92 is the usual reference, but don't cite it if you aren't sure):*

  **The Move:** Do not try to verify the text in the room. Pivot to the *function* of the claim.
  **Script:** "The specific location of the capital is less important than the principle of fiscal equivalence he's illustrating. Whether he meant it literally or hypothetically, the argument is that political union requires shared burden. If the burden shifts to America, the seat of power must follow. That logic drives the critique, regardless of whether he envisioned a parliament in Philadelphia or London."

  ### General Advice for the 15 Minutes
  *   **Don't Ramble:** When nervous, you tend to over-explain. Use the "Reply" scripts above as anchors. Say the first sentence, pause, then continue.
  *   **Own the Limits:** You don't need to defend Smith against the Postcolonial critics. Agree with them that Smith is limited, then pivot back to *why* understanding those limits matters for your thesis.
  *   **The "Retreat" is Safety:** If an objection lands hard, use the "Retreat" note. It's better to narrow your thesis than to defend an indefensible point. Say: "That's a fair pushback. I might be overstating the 'well-run' possibility. Let me narrow the claim to..."
