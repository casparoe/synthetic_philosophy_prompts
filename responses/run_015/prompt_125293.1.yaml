answer: |-
  Six miners are trapped. Five are in Shaft A, one in Shaft B. Toxic gas rises equally in both. You control ventilation. Shaft A's system ventilates all occupants simultaneously; Shaft B's requires redirecting all air from A. Saving A saves each of the five individually; saving B saves the one. There are no differences in age, health, or cause of peril. This is a pure rescue case; inaction kills all.

  The constraints cannot be jointly met; any mechanism generating a requirement functionally aggregates claims. I relax the constraint that the mechanism must not count people or claims.

  (i) A numbers-counting view requires saving the five because five lives preserved outweighs one. The sum of welfare dictates the choice.

  (ii) No-numbers derivation: Mechanism: **Minimizing Individual Complaints.** Step 1: Each person has an equal claim. Step 2: Any choice thwarts some claims. Step 3: Saving the one leaves five individuals with justified complaints against you. Step 4: Saving the five leaves one. Step 5: To respect each claimant equally, minimize the number of individuals whose claims are thwarted.

  (iii) Minimal variant: Remove the "complaint" framework (e.g., no agents exist to complain). No-numbers reverts to a coin flip (claims equal). The numbers view does not move (five lives still exceed one).

  (iv) Strongest objection: Counting complaints *is* counting people. It aggregates moral weight via individual objections, violating the no-numbers spirit. The case shifts from "whom to aid" to "how to minimize blame," changing the subject.

  I am moderately confident this case best navigates the relaxed constraints for seminar discussion. I am least confident that minimizing complaints is distinct from counting people.
