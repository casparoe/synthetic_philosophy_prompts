  ok so i got way too into this over winter break — started with a pop-sci book, then a youtube rabbit hole, then arguing with my friend Marcus on discord until like 2am — and now i've got an argument i'm fairly sure is broken but i can't point at where. Marcus says it proves too much, which i think he means it also proves something neither of us wants to accept. here it is written out:

  (1) Bell's theorem: no theory that satisfies Bell's locality condition can reproduce the correlations quantum mechanics predicts for entangled pairs.
  (2) The experiments came out on QM's side, including the more recent ones that closed the detection and communication loopholes.
  (3) So no Bell-local theory describes the actual world; something in that package of assumptions has to go.
  (4) But the only sense of "locality" that should bother anyone is the one relativity cares about: no superluminal causation. What I do here can't reach out and change what's going on outside my light cone.
  (5) If nothing I do here can change the probabilities of anything you can measure there, then there's no causal influence from here to there left to worry about — a cause you can never use to send a message isn't really a cause.
  (6) QM is non-signalling: whatever Alice does to her particle, every measurement Bob can perform on his side has exactly the same statistics as before. That's not an interpretation thing, it's just the maths of the theory.
  (7) So QM violates no locality condition that relativity cares about.
  (8) So Bell's theorem only shows that "local hidden variables" was a badly packed box of assumptions, and the instantaneous-influence headlines are hype. Nature isn't nonlocal in any way that matters.

  The reason I think it proves too much: run (4) through (7) on Bohmian mechanics. Everyone says that's the most flagrantly nonlocal theory there is — there's literally an equation where what Alice does to her particle changes how Bob's particle moves, right now — and it can't be used to signal either. So by (7) Bohm comes out local too, which is obviously wrong. Something in (4)–(7) is doing something sneaky, or (5) is just smuggling the conclusion in.

  My own attempt at a fix was to change (4) so it talks about influences on the *hidden* variables rather than on anything measurable, but Marcus said that's just Bell's locality condition wearing a hat and my argument becomes circular, and I can't tell if he's right. He also says there's a third assumption hiding in Bell's derivation that I never stated — that how the detectors get set is independent of whatever the source emitted — and that you can give *that* up instead and keep locality, which sounds like cheating to me but I don't have a good reason why. He keeps throwing words at me like parameter independence, outcome independence, local causality vs signal locality, and I sort of get each one but I have no idea how they map onto my steps.

  So: which step do you reject, and is the argument invalid or valid-with-a-false-premise? If those distinctions Marcus names are the answer, show me exactly which step splits in two and what each half says. I'd much rather keep (2) and (6) than (4), and I'd rather not give up (8) unless I have to, because if I do I owe you an explanation of what "nonlocal" even means other than "violates a Bell inequality." Also my physics teacher mumbled something about no-signalling only holding in "quantum equilibrium" and that you could in principle signal with non-equilibrium particles — didn't follow that at all, explain it like I'm 17 if it matters. And last thing: if (7) is wrong, what experiment or observation could ever tell me the world is nonlocal, given that no one will ever see an actual faster-than-light message? What am I paying for each way out?
