      *   **Xunzi:** *Xing* is bad (selfish, profit-seeking, envious). Goodness is *wei* (artificial effort). Requires *Li* (ritual/propriety) and *Fa* (law) imposed from outside (Sages/Teachers). Without structure, chaos ensues.
      *   **Golding's *Lord of the Flies*:** Often read as Hobbesian (state of nature is nasty/brutish). But the user wants nuance. The boys aren't demons initially; they degrade.

  3.  **Map Characters/Events to Philosophies:**
      *   **Ralph & The Conch:** Ralph tries to establish order. The conch assemblies are a form of *Li* (ritual). You hold the conch, you speak. This mirrors Xunzi's need for external structure to curb impulse. However, Ralph also wants rescue (civilization), which could be seen as nurturing the "good" sprout of responsibility.
      *   **Jack:** Represents unchecked desire (hunting, power, paint). Fits Xunzi's view of innate nature (profit, envy, hate). But also, Jack creates *his own* ritual (the hunt, the dance, the offering to the Beast). This complicates Xunzi—it's not just "no ritual," it's "bad ritual" vs. "good ritual."
      *   **Simon:** The mystic/saint. Helps littluns (compassion sprout). Sees the truth (wisdom sprout). He doesn't need external rules; his goodness is internal. He fits Mencius perfectly. His death is the tragedy—the environment crushes the sprout before it can grow.
      *   **Piggy:** Reason/Intellect. Represents the "teacher" aspect of Xunzi (advocating for the conch/rules). His death signifies the destruction of the external mechanism for goodness.
