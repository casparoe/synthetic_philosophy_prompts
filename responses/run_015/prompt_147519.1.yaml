  4.  **Address the Tension/ Nuance:**
      *   **Beyond Good/Bad:** The novel isn't just "people are evil." It's about how fragile morality is.
      *   **Peer Pressure/Environment:** Mencius says environment matters (King Xuan's ox), but Golding emphasizes the *mob* mentality. The sprouts (Simon) can be actively extinguished by the collective fear. Xunzi says rituals fix nature, but Golding shows rituals (the hunt dance) can also channel nature into violence.
      *   **The "Beast":** Internal vs. External. Simon realizes the beast is them. This aligns with both: Xunzi (nature is bad) and Mencius (failure to cultivate leads to beastliness).
      *   **Moral Development:** Mencius/Xunzi focus on individual cultivation or sage kings. Golding highlights *peer dynamics* and *fear*. Fear overrides ritual (conch breaks) and drowns sprouts (Simon killed).

