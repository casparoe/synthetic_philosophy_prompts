answer: |-
  **TO:** Data Standards Committee
  **FROM:** [Your Name], Backend Engineering
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation: Taxonomic Data Model & Species Definition Strategy

  **Bottom Line Up Front**
  We cannot hardcode a single definition of "species" into our primary key without breaking either scientific integrity or public trust. I recommend a **Hybrid Model**: we adopt a **Default Authority** for all public-facing counts (satisfying grant stability) but re-architecture the backend to store **Versioned Taxon Concepts** (satisfying scientific accuracy). This allows us to publish a single stable number today while retaining the ability to recalculate historical data when taxonomy changes tomorrow.

  **The Stakes**
  Our counts trigger state grants and corporate reports. If we change how we count, money moves. If we refuse to change how we count when science advances, we fund the wrong things. Our current schema (`observation.species_id`) assumes a species is a static bucket. It is not. Upstream checklists split lumps and lump splits regularly. A rigid schema forces us to choose between lying about stability or confusing our users with fluctuating data.

  **The Core Concept: Lineage vs. Label**
  We need to shift how we model a species in the database. Currently, we treat a species like a **folder**: an organism belongs in it if it matches a list of traits (definition). When science changes the traits, we have to move the files. This breaks history.
  Instead, we should treat a species like a **git branch** or a family lineage. It is a continuous historical thing. The "name" is just a label attached to the branch at a specific point in time. By storing the lineage connection rather than just the label, we preserve the history of the observation even if the scientific name changes, splits, or merges later. We are storing the *relationship*, not just the *category*.

  **Addressing Field Programs' Concerns**
  The Head of Field Programs is right: a count that changes when you change the concept looks like a "mood," not data. Grant reviewers and the public need stability. If we publish "Concept-Tagged Counts" directly to the dashboard, we invite confusion and lose credibility.
  *   **What they get right:** Trust requires a single source of truth for the headline number.
  *   **The cost of swallowing it:** We must accept that our "Default Number" will occasionally be scientifically outdated until the Default Authority updates. We are trading immediate scientific precision for institutional stability. We mitigate this risk by storing the granular data internally, allowing us to issue corrected reports if a grant audit requires it, without changing the public headline daily.

  **Technical Recommendation & Schema**
  We will implement a **Default Authority + Provenance** model.

  1.  **Schema Change:**
      *   Keep `observations` table mostly intact for read performance.
      *   Introduce `taxon_concepts` table (stores name, authority, version, parent_id).
      *   Introduce `observation_taxon_links` (join table). An observation links to one *default* concept for display, but can link to multiple *alternative* concepts for provenance.
      *   **Public API:** Returns only the `is_default=true` concept count.
      *   **Internal/Partner API:** Exposes concept versioning for auditors.

  2.  **Ingestion Decision Rules:**
      *   **Primary Authority:** We designate one upstream checklist (e.g., IUCN or State List) as the "Default."
      *   **Conflict Resolution:** If an incoming observation matches multiple concepts (e.g., a split vs. lump):
          1.  Map to the Default Authority's current version.
          2.  Store the alternative mapping in `observation_taxon_links` with a `confidence_score`.
          3.  Flag records where Default Authority differs from Genetic/Field consensus for manual review by the committee quarterly.
      *   **Metagenomics:** Bacteria/viral data will be tagged with a `concept_type = 'phylogenetic'` and excluded from the "Default Species Count" until a unified standard exists, preventing category errors in headline numbers.

  **Rollout Timeline (End of Quarter)**
  *   **Weeks 1-2:** Finalize schema migration plan. Select Default Authority (Vote required).
  *   **Weeks 3-5:** Update ingestion pipeline to write to `taxon_concepts` and `links` tables. Maintain legacy `species_id` view for backward compatibility.
  *   **Weeks 6-7:** Backfill existing data. Run parallel counts (Old vs. New Model) to quantify variance for the Board.
  *   **Week 8:** Freeze. Deploy new model. Publish "Methodology Note" alongside dashboards explaining the Default Authority version.

  **The Ask**
  I am requesting a vote to proceed with the **Hybrid Model (Default Authority + Versioned Provenance)**.
  1.  Do we agree to decouple the public headline number from the internal scientific record?
  2.  Do we agree to designate [Proposed Authority] as the Default for Q1?

  This approach protects the grant money by providing stability, protects the science by preserving data fidelity, and protects the engineering team from having to rewrite the schema every time taxonomy evolves.

  Please review so we can finalize the vote in Thursday's meeting.
