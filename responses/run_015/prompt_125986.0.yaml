  Consider a joint digital repository managed by two researchers, Alice and Bob. The system's governance protocol is designed to be minimally liberal: Alice is granted decisive authority over any pair of system states that differ only in her own visibility status, and Bob is granted decisive authority over any pair that differ only in his.

  They are asked to submit preference orderings over three feasible configurations: **Alice-Only**, **Bob-Only**, and **Both-Visible**.

  Alice submits: **Alice-Only** $\succ$ **Bob-Only** $\succ$ **Both-Visible**.
  Bob submits: **Both-Visible** $\succ$ **Alice-Only** $\succ$ **Bob-Only**.

  The system processes the rights. On the pair {**Bob-Only**, **Both-Visible**}, only Alice's status changes, so she is decisive; she prefers **Bob-Only**, so the system ranks **Bob-Only** $\succ$ **Both-Visible**. On the pair {**Both-Visible**, **Alice-Only**}, only Bob's status changes, so he is decisive; he prefers **Both-Visible**, so the system ranks **Both-Visible** $\succ$ **Alice-Only**.

  By transitivity, the system concludes **Bob-Only** $\succ$ **Alice-Only** and assigns the repository to Bob.

  The punchline, naturally, is that the system functioned perfectly: by rigorously respecting their individual liberties to determine their own participation, it successfully enforced the one outcome that both agents had explicitly agreed was Pareto-inferior to the alternative.
