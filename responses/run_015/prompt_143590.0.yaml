answer: |-
  ### Design Sketches

  Before settling on the final workshop structure, I considered three different mechanisms to generate the cognitive effects you described.

  **1. The "Visual Sort" (Abstract Shapes)**
  Participants receive a deck of cards featuring abstract, ink-blot style shapes. They are asked to sort them into piles of "similar" items and name each pile. Later, they are shown a new shape and asked if it belongs.
  *Why I set it aside:* While this isolates the variable of "novelty" well, it is too cold for a pub setting. Visual similarity often feels like a perceptual trick rather than a conceptual one. It rarely triggers the *defensive* posture required to demonstrate "hardening"; people don't fight hard over the essence of a squiggle.

  **2. The "Definition Draft" (Linguistic)**
  Participants are taught a nonsense word (e.g., "A *flim* is...") accompanied by three example sentences. They are then asked to write a strict definition of "flim" and grade new sentences against it.
  *Why I set it aside:* This leans too heavily on explicit rule-making. It encourages participants to act like logicians rather than natural thinkers. It risks becoming a writing exercise, which slows the pace and distances them from the intuitive, gut-level categorisation you want them to observe in themselves.

  **3. The "Split-Seed Taxonomy" (Selected)**
  Participants act as xenobiologists classifying the behaviour of a newly discovered creature. Crucially, half the room receives a different "first sighting" (Seed) than the other half, though the subsequent data pack is identical. They must group the behaviours, name the category, and defend their classification against a borderline case.
  *Why this works:* It creates an immediate, empirical divergence in the room based solely on the *first* example encountered (demonstrating Centrality). The narrative context (animal behaviour) invites intuitive judgment rather than logical analysis, making the "Hardening" (when they name the behaviour) feel more significant and defensible.

  ***

  ### Workshop Design: The Zorblat Protocol

  **Title:** The Zorblat Protocol
  **Time:** 90 minutes
  **Participants:** 12 adults (split into two groups of 6, or three tables of 4 with two tables sharing a condition)
  **Materials:**
  *   12 Envelopes (6 marked 'A', 6 marked 'B').
  *   Inside each envelope: 1 'Seed Card' (different for A and B) + 12 'Data Cards' (identical for all) + 1 'Challenge Card' (kept back by you) + 3 blank slips of paper.
  *   Pens.
  *   A whiteboard or flipchart for the debrief.

  #### The Materials (Preparation Notes)
  You need to create short, evocative descriptions of fictional creature behaviours. Keep them vague enough to be interpretable.
  *   **Seed Card A:** "Observation 1: A Zorblat strikes another Zorblat sharply on the snout. The second Zorblat retreats." (Implies *Aggression/Dominance*).
  *   **Seed Card B:** "Observation 1: A Zorblat presses its snout firmly against another's. The second Zorblat remains still." (Implies *Greeting/Bonding*).
  *   **The 12 Data Cards (Identical for all):** Ambiguous actions. E.g., "Baring teeth," "Pushing with the shoulder," "Touching foreheads briefly," "Standing very close," "Making a loud noise," "Sharing a food item."
  *   **The Challenge Card (For you only):** "A Zorblat strikes another on the snout, but both are smiling and making a purring sound." (Fits Seed A physically, but contradicts the 'Aggression' essence; or fits 'Ritual' name but stretches the Seed).

  #### The Minute-by-Minute Shape

  **00:00 – 00:10: Arrival & Framing**
  *   Welcome everyone. Pour drinks.
  *   **Script:** "Tonight we aren't discussing the text directly. We're going to run a simulation. You are a team of researchers. You have no prior knowledge of the subject matter. Your job is simply to organise data. There are no right answers, only consistent ones."
  *   Hand out the envelopes. **Crucial:** Tell them *not* to open them until you say so. Ensure Group A (Tables 1 & 2) and Group B (Table 3) are seated separately enough not to compare cards immediately.

  **00:10 – 00:30: Phase 1 — The Sort**
  *   **Instruction:** "Open your envelope. Take out the top card (The Seed). Read it. This is your *Reference Case*. Now take out the pack of 12 Data Cards. Your task is to sort them into two piles: 'Same Kind' as the Reference, and 'Different Kind'."
  *   **Constraint:** "Do not discuss the *meaning* of the words yet. Go with your gut. Does this feel like the same sort of thing as the first card?"
  *   Let them work. Circulate. If they ask "What is a Zorblat?", say "It doesn't matter. Look at the action."
  *   *Observation:* Watch how they handle the ambiguous cards. Group A will likely sort "Pushing" into 'Same Kind' (Aggression). Group B will likely sort "Touching foreheads" into 'Same Kind' (Bonding).

  **00:30 – 00:45: Phase 2 — The Hardening (Naming & Ruling)**
  *   **Instruction:** "Look at your 'Same Kind' pile. You have just created a category. I want you to do two things on the blank slips."
      1.  "Give this category a **Name**. (e.g., 'The Glimp', 'Hostility', 'Greeting')."
      2.  "Write a **Rule**. If a new behaviour appeared, how would you know if it belongs in this pile? Write a definition."
  *   **Script:** "Once you have written the name and the rule, the category is fixed. You cannot change it."
  *   *Note:* This is the moment of *Hardening*. By writing the name and rule, they transition from "these feel similar" to "this is what this *is*."

  **00:45 – 01:00: Phase 3 — The Stretch**
  *   **Instruction:** "I am now introducing a new piece of evidence." (Hand out the **Challenge Card** to everyone).
  *   **Task:** "Does this new card belong in your category? You must vote Yes or No. You must justify your vote using the **Rule** you wrote, not your gut feeling."
  *   **Discussion:** Let them argue within their tables.
  *   *Expected Outcome:* Group A (Aggression Seed) might reject it because "They are smiling" violates the aggression essence, even if the physical action matches the Seed. Group B might reject it because "Striking" violates the bonding essence. They will struggle to fit the new case without breaking their Rule or their attachment to the Seed.

  **01:00 – 01:30: The Debrief (Mapping the Experience)**
  *   Bring the room together. Ask Group A to share their Category Name and Rule. Ask Group B to share theirs.
  *   **Reveal:** "You all had the same 12 Data Cards. But your categories are different. Why?"
  *   **Elicit:** They will realise it was the *first card* (The Seed).
  *   **Connect to Theory (Now you can speak):**
      1.  **Analogy as Engine:** "You didn't check the Data Cards against a dictionary definition of 'Aggression'. You checked them against the *Seed Card*. You asked: 'Is this *like* that first one?' That is analogy. You mapped the new case onto the old case."
      2.  **Centrality:** "The first example became the centre of gravity. You stretched the later examples to fit the first one, rather than finding a middle ground. The Seed anchored the category."
      3.  **Hardening:** "When I asked you to write the Name and the Rule, something shifted. Before that, the category was fluid. After naming it, you defended it. You treated your analogy as if it were a definition. You couldn't see the analogy anymore; you only saw the Rule."
  *   **Closing:** "Hofstadter and Sander argue this isn't just a game trick. This is how we think about 'Justice', 'Art', and 'Freedom'. We anchor on a famous case, name it, and then stretch reality to fit the name."

  ***

  ### Predictable Pitfalls & Handling

  **1. The "Logic Trap"**
  *   **What happens:** One participant (often with a technical background) tries to find a literal, physical rule immediately (e.g., "It's about snout contact"). They dominate the table.
  *   **Handling:** Intervene gently during Phase 1. "Remember, go with your gut feeling of similarity, not a forensic analysis. If it *feels* like the first one, put it in the pile."

  **2. The "Collusion"**
  *   **What happens:** Group A and Group B talk to each other before the reveal, spoiling the divergence.
  *   **Handling:** Frame the activity as "Independent Research Teams." Physically separate the tables if possible. If they talk, acknowledge it in the debrief: "Even knowing others might have different data, did you feel your rule was the *only* sensible one?" (This actually reinforces the Hardening point).

  **3. The "Boredom Dip"**
  *   **What happens:** Sorting 12 cards can drag if the descriptions are too similar.
  *   **Handling:** Keep the text on the cards punchy (max 15 words). Keep the music low but present. If energy dips, call "Time" at 15 minutes even if they haven't finished. The pressure aids the intuitive (analogical) response over the analytical one.

  ***

  ### A Frank Statement of Limitations

  There is one part of the Hofstadter/Sander thesis this exercise cannot deliver, and you must simply say it out loud in the debrief.

  **The Limitation:** The exercise makes the *process* of categorisation visible, but it cannot make the *unconscious* nature of it fully felt. Because you gave them instructions ("Sort these"), they were aware they were categorising. In real life, we don't feel ourselves categorising; we just feel we are *seeing things as they are*.

  **What to say:** "Tonight, you knew you were building a category. In the real world, you don't know. You think you are seeing the truth of the object, not the shadow of your first example. The hardest part of the theory isn't that we use analogies; it's that we are convinced we aren't."

  **The "Hardening" Gap:** You might find some participants resist the idea that their Rule was just a post-hoc justification. They will insist the Rule *guided* them.
  **How to handle:** Don't argue. Point to the divergence between Group A and Group B. "If the Rule guided you, why did two groups with the same Data Cards write different Rules? The Rule didn't come first. The Seed did."
