  **MEMORANDUM**

  **TO:** State Board of Health Standards & Diagnostic Coding Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Diagnostic Code Proposal: Ecological Grief Dysfunction (EGD)
  **VOTE DATE:** Tuesday, October 31, 2023

  ### **Executive Summary & Recommendation**

  We are voting next Tuesday on whether to adopt a new diagnostic code for **Ecological Grief Dysfunction (EGD)**. This condition is characterized by severe HPA-axis dysregulation linked specifically to mourning climate-related loss.

  **Recommendation:** **APPROVE WITH CONDITIONS.**

  We should not approve this as a standalone, open-ended diagnosis. Instead, we should adopt it as a **specifier code** contingent on a new diagnostic threshold. This approach validates the biological reality of the suffering without falling into the trap of medicalizing rational moral distress.

  ### **The Philosophical Stalemate**

  We are currently stuck between two standard positions in the philosophy of medicine:

  1.  **The Naturalist View:** They argue that if the HPA axis is dysregulated (elevated cortisol, sleep architecture collapse, immune suppression), it is a biological dysfunction, full stop. The cause (climate loss) doesn't change the physiology.
  2.  **The Normativist View:** They argue that grief over actual, catastrophic loss is a *rational* response. By coding this, we risk pathologizing a sane reaction to an insane world. We turn a political/existential crisis into a pill-managed individual disorder.

  Both sides are right, which is why a simple "Yes" or "No" vote is insufficient. A flat "Yes" invites the normativist critique that we are medicating sadness. A flat "No" ignores the naturalist evidence that these patients are physically ill, not just sad.

  ### **The Solution: An Allostatic-Meaning Hybrid Threshold**

  To bridge this gap, I propose we adopt the code only if the diagnosis meets an **"Allostatic-Meaning Hybrid" threshold**. This prevents the medicalization of rational sadness by requiring two concurrent criteria for coverage:

  1.  **Allostatic Failure (The Naturalist Requirement):** Objective biomarkers must show physiological breakdown (e.g., flattened cortisol diurnal rhythm, inflammatory markers) that exceeds the range of normal stress response. Sadness alone is not enough.
  2.  **Collapsed Life-Project (The Normativist Safeguard):** Clinical assessment must demonstrate that the grief has resulted in a specific *existential paralysis*—the inability to formulate a viable future narrative. This distinguishes EGD from general depression or acute grief. It acknowledges that the "dysfunction" lies in the rupture between the organism and its perceived future.

  **Why this works:** It ensures we are only covering cases where the *capacity to function* has broken down biologically and narratively, not just cases where a patient is correctly alarmed by climate data.

  ### **Proposed Diagnostic Criteria (Draft)**

  *   **Code:** EGD-24 (Specifier for Adjustment/Mood Disorders)
  *   **Criterion A:** Evidence of chronic allostatic load (HPA-axis dysregulation) verified by lab work or validated somatic symptom scale.
  *   **Criterion B:** Documented inability to maintain life goals or future orientation directly attributed to ecological loss (the "collapsed project").
  *   **Exclusion:** Does not apply to transient distress or political activism-related stress without somatic compromise.

  ### **Implementation Timeline**

  If we vote to approve this conditional framework on Tuesday, here is a realistic rollout schedule:

  *   **Nov 2023 – Jan 2024 (Criteria Finalization):** Workgroup meets with endocrinologists and psychiatrists to finalize the biomarker thresholds for Criterion A.
  *   **Feb 2023 – Apr 2024 (Provider Education):** Webinars and guidance documents for insurers and providers to prevent code misuse (i.e., stopping it from becoming a "dumpster code" for general anxiety).
  *   **May 1, 2024 (Go-Live):** Code becomes active for billing and coverage.
  *   **Nov 2024 (Review):** Board reviews utilization data to ensure the "hybrid threshold" is effectively filtering out simple grief.

  ### **Next Steps**

  On Tuesday, I move we vote to **Approve EGD-24 as a conditional specifier**, contingent on the adoption of the Allostatic-Meaning Hybrid Threshold described above.

  This allows us to treat the sick without silencing the sane.

