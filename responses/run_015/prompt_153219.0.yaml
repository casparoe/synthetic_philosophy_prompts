answer: |-
  ### The Session Plan: 75 Minutes

  **Carrying Example:** The **Orphan Sort**.
  **Why:** It is the only candidate that forces the students to generate criteria actively rather than receiving them passively. The Bodoni/Futura comparison is static; the Squint test is perceptual (psychology); Drawing from memory is subjective. The Sort requires them to *judge identity* without labels, which immediately triggers the question: "On what basis am I grouping these?" It physically instantiates *Latitude* (the 'a's in the piles look different) and *Contrast Budget* (the 'a' matches the 'd' in the pile). *The Counterfeit* is introduced later as a refinement of the Sort's logic.

  **The Exclusions (Marked at Minute 0):**
  Open the session by drawing a triangle on the whiteboard with vertices: **History**, **Perception**, **Design**.
  Say: "History tells us how the 'a' arrived at this shape. Perception tells us how the eye reads it. We are not doing those things today. We are standing at the third point: Design. We are asking what the mark *must be* to function as an 'a' in a system. If you ask me about reading speeds or 15th-century scribes, I will tell you: 'That is a different triangle.' We are bracketing those to isolate the design constraint."

  ---

  ### 00–05: Introduction & The Question
  State the single question: **"What makes every 'a' an 'a'?"**
  Clarify what this is *not*: It is not "how do I draw a nice 'a'?" and it is not "which 'a' is best?"
  Write the question on the board. Do not erase it.

  ### 05–20: The Orphan Sort (Activity)
  **Setup:** 9 pairs of students. Each pair receives an envelope with 12 glyphs.
  **Content:** The 12 glyphs are **six 'a's and six 'd's**, drawn from **six different typefaces** (one 'a' and one 'd' from each face).
  *Crucial Selection:* Ensure the faces vary wildly (e.g., one blackletter, one geometric sans, one humanist serif, one script-like, one high-contrast, one monoline). Ensure that in at least two cases, the 'a' of Face X resembles the 'd' of Face Y.
  **Instruction:** "Sort these 12 glyphs into six piles. Each pile must contain the two glyphs that belong to the same typeface. You are not told which is 'a' or 'd'. You are not told the names of the faces."
  **Constraint:** They must finish in 10 minutes.
  **Why this works:** To pair them, they cannot rely on "what an 'a' looks like" (Latitude). They must rely on "which 'a' belongs with which 'd'" (Contrast Budget).

  ### 20–35: Debrief & Defusing Checklist/Platonic Misconceptions
  **Action:** Ask one pair to project their piles (hold them up). Ask another pair if they sorted differently.
  **Likely Outcome:** Most will pair correctly, but some pairs will be ambiguous.
  **Misconception 1: Checklist Essentialism.**
  *When it arises:* Students explain their sorting by saying, "This one has a tail, so it goes with this one."
  *Defusal Point (Minute 25):* Point to a single-storey 'ɑ' and a double-storey 'a' that were correctly paired with their respective 'd's. Ask: "These two 'a's share no anatomical features. One has a tail, one has a loop. If 'a-ness' were a checklist of parts, these could not both be 'a'. Yet you paired them. What was the rule?"
  *Goal:* Break the idea that identity is a sum of parts.

  **Misconception 2: Platonic Ideal.**
  *When it arises:* A student says, "This 'a' is the 'real' one, the other is a variation."
  *Defusal Point (Minute 30):* Gather all six 'a's from the correct piles and lay them on the table. "Look at this set. Is there a centre? Is there a 'true' 'a' here, or are they all equally 'a'?" Force the admission that the blackletter 'a' is as much an 'a' as the Futura 'a'.
  *Goal:* Establish *Latitude* as disconnected. There is no continuous morph from one to the other that stays 'a' all the way.

  ### 35–50: The Hinge (Preventing the Collapse into Convention)
  **The Crisis:** Now that they accept *Latitude* (an 'a' can be anything), the room will tilt toward **Misconception 3: Arbitrary Convention**. ("If it can be anything, it's just agreement. We could swap 'a' and 'o' if we wanted.")
  **The Pre-requisite:** You must have already secured the success of the Sort. They *were* able to pair the 'a' and 'd' correctly without labels.
  **The Move:** Pick up one correct pair ('a' + 'd'). Swap the 'a' with an 'a' from a different pile that is visually similar but systemically wrong.
  **Ask:** "I have swapped this 'a' into this pile. The shape is passable. The reader would read it as 'a'. Why does this pile now feel broken?"
  **Introduce *Contrast Budget*:** "The 'a' is not defined by its shape. It is defined by the space it leaves for the 'd', the 'o', and the 'n'. It is defined by *not being them*."
  **Defusal:** "It is not arbitrary. If you swap 'a' and 'o', the system collapses because the distinction budget is exhausted. The necessity comes from the *neighbour*, not the *shape*."
  **Why this secures the Hinge:** It shifts the locus of identity from *intrinsic properties* (which are disconnected) to *relational properties* (which are necessary). The question survives because the constraint is real, even if the shape is not fixed.

  ### 50–60: The Counterfeit
  **Introduction:** Now that they understand the system, introduce **Misconception 4: Reader Recognition/Psychology**. ("If the reader reads it, it is an 'a'.")
  **Activity:** Show a printed word (e.g., "bad") set in a specific face. Remove the 'a'. Offer three replacements:
  1.  The correct 'a' from the face.
  2.  A generic 'a' from a different face (visually close).
  3.  **The Counterfeit:** A glyph drawn to satisfy all anatomical checklists of an 'a' (bowl, stem, spur) but with the wrong contrast logic or terminal angle for *this* face.
  **Ask:** "Which one is the 'a' of this face?"
  **Defusal:** Students will say #3 is readable, so it should work. You say: "It reads as 'a', but it is not *this* 'a'. It is a counterfeit. It satisfies the dictionary definition but breaks the law of this country."
  **Goal:** Distinguish between *legibility* (psychology) and *identity* (design logic). The Counterfeit proves that "reading correctly" is not sufficient for "being the letter."

  ### 60–70: The Final Diagnostic Task
  **Task:** "The Boundary Draw."
  **Materials:** Give each student a sheet with a single 'd' and a single 'o' printed in a specific, idiosyncratic typeface (e.g., high contrast, specific terminal angle).
  **Instruction:** "Draw the 'a' that belongs to these two neighbours. Do not draw a 'good' 'a'. Draw the *last possible 'a'* before it becomes a 'd' or an 'o' in this system."
  **Time:** 8 minutes drawing, 2 minutes collect.
  **Why this diagnoses:**
  *   **Fluent but Empty Answer:** They draw a generic 'a' and simply match the stroke weight. They will say tomorrow: "It's about the system," but their drawing shows they think the system is just "style" (weight/contrast). They treated the constraint as cosmetic.
  *   **Answer that has Landed:** They struggle. Their 'a' might look weird in isolation. They will have adjusted the *aperture* to match the 'o', and the *terminal* to match the 'd'. They understood that the 'a' is a negotiation between its neighbours.
  *   **What to look for next morning:** Look at the relationship between the drawn 'a's counter and the provided 'o's counter. If they match, the question landed. If they just match weight, they learned the slogan.

  ### 70–75: Close
  Collect the drawings.
  Return to the Whiteboard Question: "What makes every 'a' an 'a'?"
  Do not answer it.
  Say: "If you found the answer today, you drew the wrong letter. Keep the question. It is the only tool you have that stops you from copying."
  Dismiss.

  ---

  ### Summary of Misconception Defusal Order

  1.  **Checklist Essentialism** (Minute 25): Defused *during* Sort Debrief by showing disconnected anatomy in correct pairs.
  2.  **Platonic Ideal** (Minute 30): Defused *immediately after* by displaying the full range of correct 'a's side-by-side.
  3.  **Arbitrary Convention** (Minute 40): Defused *at the Hinge* by using the failed swap to prove systemic necessity (Contrast Budget).
  4.  **Psychology/Recognition** (Minute 55): Defused *by the Counterfeit* example, distinguishing "readable" from "belonging."

  ### Why the Other Examples Were Rejected
  *   **Bodoni-beside-Futura:** Static. Invites aesthetic comparison ("which is better") rather than ontological inquiry ("what makes it an 'a'").
  *   **Squint-or-Blur:** Focuses on the *viewer's* limitation, not the *designer's* constraint. Leads to the Psychology misconception.
  *   **Draw-from-memory:** Too subjective. Validates the Platonic Ideal (everyone draws their "inner 'a'").

  ### The Refusal of Philosophy/History/Perception
  Mark this refusal not as ignorance, but as **methodological discipline**.
  "When we talk about what an 'a' *is*, we are tempted to ask what the eye *sees* (Perception) or how the letter *evolved* (History). Those are valid questions, but they are not *design* questions. If we answer with 'because readers know it,' we surrender our agency to psychology. If we answer with 'because scribes wrote it,' we surrender to history. We are designers. We must find the answer in the mark and its system. We are bracketing the other two to see if the design can stand on its own."
