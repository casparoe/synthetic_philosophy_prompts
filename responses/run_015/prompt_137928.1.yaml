  **MEMORANDUM**

  **TO:** Full Board, Kestrel Basin Water Authority
  **FROM:** Science and Engineering Subcommittee
  **DATE:** 5 September 2024
  **SUBJECT:** Recommendation on Paleochannel Investigation Funding

  **Bottom Line**
  The Subcommittee recommends obligating $3.5 million for the stripped-down investigation design prior to the 30 September lapse date, conditioned on General Counsel confirming that the statutory "weight of the evidence" standard permits expected-value weighting rather than a most-likely-world rule. We advise against the full-scale design due to excessive regulatory trigger risk, and against immediate capital commitment without study due to legal vulnerability. This path balances fiduciary duty to ratepayers with statutory compliance, preserving option value while minimizing the probability of costly state curtailment.

  **Reasoning**
  The decision rests on three interacting constraints: the value of information, the statutory standard of proof, and the regulatory consequences of public findings.

  *Value of Information and Good's Theorem*
  Baseline analysis indicates Option C (pipeline) yields an expected net present value (NPV) of $48 million. The proposed investigation offers a gross expected value of $63 million by allowing us to switch to Option A (recharge) if connection is confirmed. Theoretically, information cannot reduce expected value if the decision-maker is free to act optimally on what they learn (Good's theorem). However, this theorem assumes the agent remains free to ignore the information if it does not improve the outcome. Our situation breaks this assumption in two ways.

  First, the statutory standard. If "weight of the evidence" is interpreted as selecting the best option for the *most probable* state (most-likely-world reading), we are forced to choose Option B in the inconclusive branch, yielding $43 million rather than the optimal $49 million (Option C). This constraint breaks the "free to optimize" assumption of Good's theorem, rendering some information potentially harmful. We urge the Board to adopt the expected-value reading, which aligns with utility maximization and preserves the positive value of the study.

  Second, and more critically, the public record. Under basin curtailment rules, any published finding short of a clean negative triggers a state determination costing ratepayers an estimated $40 million in present value. Here, the Authority is not free to respond optimally because the State Engineer binds our hands based on our public filings. When an agent cannot respond freely to evidence, a less discriminating experiment can be strictly superior to a more discriminating one (a consequence of Blackwell's theorem on information ordering). Informativeness is a design variable, not an intrinsic good.

  *Design Selection*
  The full-scale design ($6 million) triggers curtailment with 0.64 probability, imposing an expected regulatory cost of $25.6 million. This swamps the $15 million information gain. The stripped-down design ($3.5 million) reduces the trigger probability to 0.31 (expected cost $12.4 million) while staff confirm it sacrifices negligible decision value. Netting these figures, the stripped design offers a marginal expected gain over the baseline, whereas the full design guarantees a substantial loss. We therefore reject the full design.

  *The University Partner Proposal*
  A colleague suggested commissioning the work through a university partner under a research permit to keep findings off the public record. We recommend rejecting this. While it规避s the trigger risk, it exposes the Authority to liability under public records laws if the funding source is traced, and permanently damages public trust if perceived as evasion. The legal risk of non-compliance outweighs the regulatory risk of disclosure. Transparency is a constraint we cannot design around without exceeding our legal authority.

  *The NGO Counterargument*
  An NGO representative has argued that selecting a study design to avoid inconvenient findings constitutes the deliberate manufacture of uncertainty, damaging scientific integrity. This charge has merit if our sole mandate were epistemic truth. However, our mandate is decision-making under statutory and regulatory constraint. We are not hiding truth; we are managing the consequences of truth imposed by external actors. Choosing a coarser instrument to avoid disproportionate penalty is not uncertainty manufacture; it is prudent risk management consistent with our fiduciary duty. Nevertheless, we acknowledge this tension. If the Board views scientific transparency as lexically prior to ratepayer cost, this recommendation fails.

  *Objective Function*
  Finally, the sign of this conclusion turns on what the Authority maximizes. Our purpose clause names both reliable supply at least cost and protection of instream uses. The curtailment trigger transfers wealth from ratepayers to downstream irrigators and the estuary. If the Board values instream protection sufficiently high, the trigger cost is not a loss but a mission achievement. We have modeled the trigger as a cost ($40 million) because staff estimates focus on ratepayer impact. If the Board reweights the objective function to prioritize instream gains over ratepayer costs, the full investigation becomes viable despite the financial hit. We proceed here assuming balanced weighting.

  **What Would Have to Be True for This to Be the Wrong Call**
  This recommendation is sensitive to three variables. First, the curtailment cost estimate. If the true cost to ratepayers exceeds $70 million (the upper staff estimate), even the stripped design yields negative expected value, and we should decline investigation and build Option C. Second, the statutory interpretation. If General Counsel mandates the most-likely-world reading, the value of the inconclusive branch drops by $5.5 million, eroding the margin for error and potentially making the no-study baseline superior. Third, the objective function. If the Board determines that instream beneficial uses outweigh ratepayer costs such that the curtailment trigger is a net positive, the full-scale investigation becomes the optimal choice for maximizing ecological benefit. Absent these shifts, the stripped-down investigation remains the robust choice.
