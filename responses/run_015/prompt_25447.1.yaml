answer: |-
  Your intuition is spot-on. Your friend's summary is actually quite good for a quick overview—it captures the spirit and the major conclusions of the book accurately. However, in doing so, it glosses over a crucial philosophical distinction that your aesthetics professor will almost certainly care about.

  You identified the exact friction point: **the slide from Tolstoy's *definition* of art to his *evaluation* of art.**

  Here is a breakdown of what your friend got right, where the nuance is missing, and how Tolstoy would likely correct the phrasing.

  ### 1. What Your Friend Got Right
  Your friend nailed the core "Infection Theory."
  *   **The Definition:** Tolstoy explicitly rejects the idea that art is about beauty, form, or mimesis (representation). He defines it functionally: Art is a human activity where one person consciously transmits a feeling they have experienced to others, who then "catch" that feeling.
  *   **The Term:** Yes, he calls this **"infection."** If you read a poem and feel nothing, Tolstoy says it isn't art, no matter how beautiful the words are.
  *   **The Moral Turn:** It is accurate that Tolstoy judges art based on the *content* of the feeling. He argues that the "religious consciousness" of his time (which he interprets as Christian universal brotherhood) is the metric for value.
  *   **The Self-Repudiation:** It is true that Tolstoy condemns most of the Western canon (including Shakespeare, Beethoven, and his own *War and Peace*) as "bad art" or "counterfeit art" because he believes they cater to upper-class ennui rather than universal unity.

  ### 2. The Subtle Error: Definition vs. Evaluation
  This is where your hesitation is justified. Your friend writes: *"if it doesn't do that [make you a better person], it's not really art, or at least not good art."*

  Tolstoy is actually inconsistent on this point, which makes it tricky, but there is a technical distinction in his argument that your friend collapses.

  **The Technical Definition (Descriptive):**
  For Tolstoy, the *mechanism* of art is infection. Theoretically, a piece of propaganda, a pornographic novel, or a patriotic war song **is art** if it successfully infects the audience with a feeling. It fulfills the functional definition.

  **The Moral Evaluation (Normative):**
  Tolstoy then argues that because art is a vital tool for human progress, it *ought* to transmit feelings that unite humanity.
  *   **Good Art:** Transmits feelings of brotherhood/unity (Christian religious consciousness).
  *   **Bad Art:** Transmits feelings of lust, pride, or exclusivity (upper-class feelings).
  *   **Counterfeit Art:** Imitates art without genuine feeling (craftsmanship without infection).

  **The Correction:**
  Tolstoy would push back on the phrase "not really art." He would say: *"It is art, but it is bad art, and therefore harmful."*
  However, because Tolstoy is so radical, he often rhetorically strips "bad art" of the title "Art" (capital A) to emphasize its danger. He wants to say that if it doesn't serve the religious purpose of the time, it is a **counterfeit**.

  **Why this matters for your course:**
  In aesthetics, the distinction between **Is** (ontology) and **Ought** (axiology) is huge.
  *   **Friend's view:** Art = Good Morality. (If it's immoral, it's not art).
  *   **Tolstoy's nuanced view:** Art = Infection. Good Art = Infection + Right Morality.
  *   **The Problem:** By merging them, Tolstoy makes it impossible to analyze the *form* of a work independently of its *message*. Your professor will likely want you to notice that Tolstoy sacrifices aesthetic autonomy for moral utility.

  ### 3. What Tolstoy Would Push Back On
  If you read the full text, there are two specific nuances your friend's summary misses that Tolstoy would insist upon:

  **A. "Makes you a better person" is too vague.**
  Your friend summarizes Tolstoy's moral criterion as "making you a better person." Tolstoy would find this too individualistic and modern.
  For Tolstoy, art is not about self-improvement; it is about **union**. The goal of art is to destroy the separation between individuals. The "religious consciousness" isn't just "be nice"; it is the specific realization that human welfare lies in brotherhood. Art is a tool of social cohesion. If a work makes you feel *isolated* in your pleasure (even if it's a "good" pleasure), Tolstoy rejects it.

  **B. The "Ordinary People" Criterion.**
  Your friend notes that Tolstoy criticizes art that "only appeals to the upper classes." This is true, but the reason is specific. Tolstoy argues that **universality** is a test of sincerity.
  If a feeling is genuine and fundamental to human life, *everyone* should be able to understand it. If a poem requires a degree in literature or a specific class background to "get," Tolstoy argues the feeling isn't genuine—it's artificial. So, accessibility isn't just a political preference for Tolstoy; it's an epistemological test for whether the art is "real."

  ### 4. Summary for Your Notes
  If I were condensing this for an aesthetics exam, I would tweak your friend's summary to look like this:

  1.  **Definition:** Art is the intentional transmission of feeling via "infection." (Beauty and form are irrelevant).
  2.  **Criteria for Infection:** Sincerity, individuality, and clearness.
  3.  **Evaluation:** Art is judged by the *religious consciousness* of the age. In Tolstoy's time, this means Christian brotherhood.
  4.  **The Conflict:** Tolstoy conflates the *capacity* to infect with the *moral value* of the infection. He classifies art that transmits "bad" feelings (division, lust, pride) as "counterfeit" or "bad" art, effectively arguing that art has a moral obligation.
  5.  **Result:** Most elite culture is rejected not because it lacks skill, but because it lacks universal accessibility and moral unity.

  ### Verdict
  Your friend is **85% accurate**. They captured the spirit and the conclusions perfectly. The missing 15% is the philosophical rigor regarding the definition of art versus the evaluation of art.

  Your intuition that the definition ("transmits feeling") and the evaluation ("makes you better") are being slid together is the exact critique most philosophers level against Tolstoy. If you point out in class that *"Tolstoy seems to want to define art descriptively as infection, but then normatively restricts it to moral infection,"* you will likely get an A on that part of the discussion.
