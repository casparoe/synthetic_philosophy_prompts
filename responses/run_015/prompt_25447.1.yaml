prompt: |-
  I'm taking an aesthetics course and we've been going through Tolstoy's "What is Art?" — well, excerpts from it anyway, the thing is like 200 pages and we're only reading chunks. My friend who took the same course last semester gave me his notes, and he summarized Tolstoy's view like this:

  "Tolstoy defines art as the communication of emotion from artist to audience. The artist feels something, embodies it in a work, and the audience catches the feeling — he calls this 'infection.' So for Tolstoy, what makes something art isn't beauty or form or representation, it's whether it successfully transmits a feeling. And since he thought the best feelings to transmit were religious ones — specifically Christian feelings of brotherhood and universal love — he concluded that most of what we call great art, including his own novels, is bad art, because it only appeals to the upper classes and doesn't transmit morally good feelings to ordinary people. Basically he's saying art is good if it makes you a better person, and if it doesn't do that, it's not really art, or at least not good art."

  Something about this feels a bit off to me, especially the slide from 'transmits feeling' to 'makes you a better person,' and I'm not sure my friend is keeping Tolstoy's defintion of art seperate from his evaluation of art. But I haven't read the whole thing and my friend is usually pretty careful. Can you go through his summary and tell me what's accurate, what's subtly wrong, and what Tolstoy himself would push back on?
