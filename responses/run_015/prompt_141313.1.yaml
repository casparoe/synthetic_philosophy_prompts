answer: |-
  # DECISION TREE: DOES MORAL PSYCHOLOGY TRACK TRUTH?

  **Starting Assumption:** *Moral Foundations Theory (MFT) is descriptively accurate.* (Conservatives respond broadly across Care, Fairness, Loyalty, Authority, Sanctity, Liberty; Liberals concentrate on Care, Fairness, Liberty).

  **Instruction:** Answer the following case-based questions. Follow the arrows to your epistemic position.

  ---

  ### NODE 1: The Flag-Toilet Case (Ontology)
  *A man cleans his toilet with a national flag in private. He feels no harm was done and no one was treated unfairly, but he feels deep revulsion.*
  **Q:** Is this revulsion *evidence* that a moral boundary was crossed, or merely a causal fact about his psychology?
  *   **(A) Evidence:** It signals a moral truth he perceives. → **Go to Node 2**
  *   **(B) Causal Fact:** It signals nothing but his evolutionary programming. → **Go to Node 5**

  ### NODE 2: The Family Firm Case (Binding Status)
  *A CEO hires a less-qualified cousin over a more-qualified stranger.*
  **Q:** Does the "Loyalty" intuition here track a genuine *reason* for action, or is it an evolutionary heuristic for group cohesion?
  *   **(A) Genuine Reason:** Loyalty creates real moral obligations. → **Go to Node 3**
  *   **(B) Heuristic:** Loyalty is functional "glue," not moral truth. → **Go to Node 4**

  ### NODE 3: The Village Burial Case (Coverage vs. Sensitivity)
  *A village insists on burying its dead within 24 hours (Authority/Sanctity). Liberals call it superstition; Conservatives call it respect.*
  **Q:** Does the conservative responsiveness to this intuition mean they have **coverage** of a moral domain liberals miss, or does liberal **sensitivity** to harm/fairness mean they are better calibrated?
  *   **(A) Coverage:** More foundations = seeing more of the moral landscape. → **LEAF 1**
  *   **(B) Calibration:** Fewer foundations = less distortion by noise. → **LEAF 2**

  ### NODE 4: The Battle Standard Case (Noise vs. Function)
  *Soldiers die for a flag (Binding). If this is just an evolutionary heuristic...*
  **Q:** Is the liberal narrowness epistemically superior (less delusion), or is the conservative breadth functionally superior (more stability)?
  *   **(A) Less Delusion:** Broad responsiveness is mostly noise/error. → **LEAF 3**
  *   **(B) More Stability:** Broad responsiveness is adaptive fitness. → **LEAF 4**

  ### NODE 5: The Origin Story Case (Symmetry)
  *We know evolution shaped **all** these intuitions (Care and Binding alike).*
  **Q:** Does this genealogical explanation undermine the justification for *both* sides equally?
  *   **(A) Yes:** It debunks all moral claims symmetrically. → **LEAF 5**
  *   **(B) No:** It leaves room for non-intuitive justification. → **Go to Node 6**

  ### NODE 6: The Council Case (Institutional Role)
  *If we cannot trust intuitions as premises...*
  **Q:** Do we use the psychology to design *institutions* that check bias, rather than to decide first-order ethics?
  *   **(A) Yes:** Psychology informs procedure, not truth. → **LEAF 6**
  *   **(B) No:** Psychology offers no normative guidance at all. → **LEAF 7**

  ---

  ### THE LEAVES (Named Positions)

  **LEAF 1: Moral Pluralist Realism**
  *   **Epistemic Claim:** The "wide-sensitivity" psychology is epistemically **better**. Conservatives see genuine moral reasons (Loyalty, Authority, Sanctity) that Liberals are blind to.
  *   **Awkward Commitment:** Must defend some traditional hierarchies or purity norms as objectively binding, even when they conflict with individual autonomy.

  **LEAF 2: Calibrated Individualism**
  *   **Epistemic Claim:** The "wide-sensitivity" psychology is epistemically **worse**. Binding foundations are cultural distortions; Liberal narrowness is a feature (calibration), not a bug.
  *   **Awkward Commitment:** Must explain why the "blind" side (Conservatives) often maintains more stable societies if they are morally myopic.

  **LEAF 3: Liberal Rationalist**
  *   **Epistemic Claim:** Binding foundations are evolutionary noise. Liberals are closer to raw reason; Conservatives are more deluded by tribal heuristics.
  *   **Awkward Commitment:** Must treat deep social bonds (family, nation) as morally secondary to abstract fairness, risking social alienation.

  **LEAF 4: Evolutionary Pragmatist**
  *   **Epistemic Claim:** Truth is the wrong metric; fitness is the right one. Conservative psychology is "right" because it sustains groups, not because it tracks moral facts.
  *   **Awkward Commitment:** Must admit that if a lie (e.g., divine sanction) sustains the group, it is pragmatically "better" than the truth.

  **LEAF 5: Global Error Theory**
  *   **Epistemic Claim:** Evolutionary debunking is symmetric. Neither side is "right"; both are pushing buttons shaped by fitness, not truth.
  *   **Awkward Commitment:** Cannot consistently claim that *their own* conclusion (Error Theory) is true, as their own reasoning is also evolved.

  **LEAF 6: Procedural Institutionalism** *(The User's View)*
  *   **Epistemic Claim:** Psychology tells us nothing about **who is right**, but tells us how to structure **deliberation**. We build institutions to balance the biases.
  *   **Awkward Commitment:** Must sometimes enforce outcomes that violate participants' own stated intuitions (e.g., forcing a Sanctity-focused agent to accept a Fairness-based ruling) to maintain the system.

  **LEAF 7: Quietist Skepticism**
  *   **Epistemic Claim:** Psychology undermines intuition, and no procedure can fix it. We should suspend moral judgment in political design.
  *   **Awkward Commitment:** Makes political action impossible; reduces governance to pure power dynamics without normative justification.

  ---

  ### META-ANALYSIS (For the Moderator)

  **1. Indistinguishable Leaves**
  *   **Leaf 5 (Global Error Theory)** and **Leaf 7 (Quietist Skepticism)** are practically inseparable in a political context. Both result in the suspension of first-order moral claims.
  *   *Status:* **Merely Unexplored.** The distinction is metaphysical (do moral facts exist?) rather than practical (how do we govern?), making it hard to separate empirically.

  **2. Unoccupied Combination**
  *   **Combination:** Answer **(B) Heuristic** at Node 2 (Binding is just glue) BUT Answer **(A) Coverage** at Node 3 (Therefore Conservatives see more moral truth).
  *   *Status:* **Incoherent.** If Binding foundations are merely evolutionary heuristics (Node 2B), they cannot provide "coverage" of the *moral* domain (Node 3A). They provide coverage of the *adaptive* domain. No serious theorist occupies this slot.

  **3. The Counterfactual Question**
  *   *Would the tree look different if Liberals were "broad" and Conservatives "narrow"?*
  *   **Answer:** **No.** The tree structure relies on the epistemic value of "breadth" vs. "narrowness," not the sociological labels. If the empirical finding flipped, the *names* attached to the leaves would swap (e.g., "Liberal Rationalist" becomes "Conservative Rationalist"), but the **epistemic positions** (Pluralist Realism, Error Theory, Procedural Institutionalism) remain identical. The logic of the tree is invariant to the demographic distribution.
