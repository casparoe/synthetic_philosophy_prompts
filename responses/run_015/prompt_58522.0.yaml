answer: |-
  Here is a ready-to-go example for your study group. It uses a "kinked" budget constraint to force the two solutions apart, with arithmetic that fits on a phone screen.

  ### The Story: The Pop-Up Shop Liquidation
  Lex and Max are cofounders shutting down their pop-up retail shop. They need to split the remaining assets: **Cash** (which Lex values more for rent) and **Inventory** (which Max values more for their next venture). If they fail to agree, the landlord seizes everything, so the **Disagreement Point is (0, 0)**. The feasible deals form a kinked line: they can liquidate inventory for cash easily at first, but after a certain point, they have to sell prime stock at a steep discount. Specifically, the maximum Cash Lex could get is **$120k** (if Max gets 0), and the maximum Inventory Value Max could get is **$80k** (if Lex gets 0). However, the tradeoff "breaks" at the point **(40, 70)**:
  *   **Segment 1:** From (0, 80) to (40, 70).
  *   **Segment 2:** From (40, 70) to (120, 0).
  *(Units are thousands of dollars of value.)*

  ### The Math (Do this on the board)

  **1. Kalai-Smorodinsky (KS)**
  KS ignores the shape of the frontier and draws a straight line from the fallback (0,0) to the "Dream Point" (120, 80).
  *   **Slope of KS Line:** $80 / 120 = 2/3$. Equation: $y = \frac{2}{3}x$.
  *   **Find Intersection:** We know the deal must be on the frontier. Since the KS line is steeper than Segment 1, it punches through to Segment 2.
  *   **Equation of Segment 2:** Connects (40, 70) and (120, 0). Slope = $\frac{0-70}{120-40} = -\frac{70}{80} = -0.875$.
      Equation: $y - 0 = -0.875(x - 120) \Rightarrow y = -0.875x + 105$.
  *   **Solve:** $\frac{2}{3}x = -0.875x + 105$.
      $(\frac{2}{3} + \frac{7}{8})x = 105 \Rightarrow (\frac{16+21}{24})x = 105 \Rightarrow \frac{37}{24}x = 105$.
      $x = 105 \times \frac{24}{37} \approx \mathbf{68.1}$.
      $y = \frac{2}{3}(68.1) \approx \mathbf{45.4}$.
  *   **KS Deal:** **($68.1k, $45.4k)**

  **2. Nash Bargaining Solution (NBS)**
  Nash maximizes the product of gains: $P = x \cdot y$. Since the KS calculation showed we are on Segment 2, we maximize along that line.
  *   **Maximize:** $P = x(-0.875x + 105) = -0.875x^2 + 105x$.
  *   **Vertex Formula ($x = -b/2a$):** $x = \frac{-105}{2(-0.875)} = \frac{105}{1.75} = \mathbf{60}$.
  *   **Find y:** $y = -0.875(60) + 105 = -52.5 + 105 = \mathbf{52.5}$.
  *   **Nash Deal:** **($60k, $52.5k)**

  ### Why They Separate
  The gap is **$8.1k** in Lex's favor under KS, versus **$7.5k** more for Max under Nash.
  *   **The Cause:** The **Kink** at (40, 70). This kink caps Max's "Dream Point" at 80 instead of the 105 that Segment 2 would allow if extended to the y-axis.
  *   **KS** is dragged toward Lex because the kink artificially lowers Max's maximum possible claim (the denominator in the KS ratio). It cares about the *unreachable* corner (0, 80).
  *   **Nash** ignores the unreachable corner. It only cares about the *local slope* of the active segment (Segment 2). It finds the most "efficient" product on the line actually available.

  ### If You Smooth It Out
  If you round the kink into a smooth curve connecting (0, 80) and (120, 0), the **Nash point stays roughly at (60, 52.5)** because the local slope there hasn't changed much. However, the **KS point stays anchored to the (120, 80) ideal**, so the gap remains. The divergence isn't just about the kink; it's that KS cares about the *bounds* of the feasible set, while Nash cares about the *shape* of the frontier at the solution.

  ### The "Die-Hard Nash Fan" Complaint
  A Nash purist will tell you this example is rigged because KS violates **Independence of Irrelevant Alternatives (IIA)**. They'll argue: *"Why should Lex get more money just because Max's maximum inventory value was capped at 80 by the kink? That (0, 80) option was never going to be chosen anyway! Nash ignores that unreachable dream point and focuses only on the tradeoff rates where the deal actually happens."*
  *   **Is that fair?** It depends. If you believe bargaining is about "proportional satisfaction" relative to your best-case scenario, KS is fair. If you believe it's about "efficiency and threat power" on the margin, Nash is fair.
