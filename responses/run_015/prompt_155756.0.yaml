  5.  **Developing the Definition & Boundaries:**

      *   **Name:** Let's call it **"Pragmatic Reference Class Selection" (PRCS)** for the sake of the discussion, while noting it lacks a canonical label.
      *   **Definition:** The strategic selection of a valid reference class to align statistical output with a normative goal, where the validity of the class is uncontested but its *relevance* is contested.
