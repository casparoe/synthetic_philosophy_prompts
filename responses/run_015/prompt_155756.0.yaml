answer: |-
  There is no single, canonical term in the literature that captures the full configuration you describe: the coexistence of multiple valid reference classes, combined with a systematic, purpose-driven shift in which class is privileged, executed openly without accusation of dishonesty.

  However, the phenomenon sits at the intersection of three established domains: the **Reference Class Problem** (statistics/philosophy), **Motivated Reasoning** (psychology), and **Macro- vs. Micro-allocation** (bioethics).

  If you require a label to facilitate discussion on your committee, the most precise descriptive term is **"Normative Reference Class Selection."** While the *Reference Class Problem* describes the statistical ambiguity, adding "Normative" captures your specific insight: that the resolution of the ambiguity is driven by the ethical or administrative goal (withholding vs. granting) rather than by new data.

  Below is a careful definition of the concept, followed by the three distinctions you requested.

  ### 1. The Core Concept: Normative Reference Class Selection

  **Definition:** A decision-making configuration in which a single case legitimately belongs to multiple overlapping reference classes with divergent frequency distributions, and the selection of the governing class is determined not by statistical superiority, but by the normative implications of the resulting probability.

  **Theoretical Anchor:** This is a pragmatic extension of Hans Reichenbach's **Reference Class Problem** (1949). Reichenbach noted that any individual event belongs to infinite classes, and we lack a principled rule for selecting the "correct" one. Standard statistical advice is to choose the *narrowest* class for which reliable data exists (the "requirement of total evidence").

  **Your Observation's Contribution:** You have identified that in clinical practice, the "requirement of total evidence" is often suspended in favor of a **"requirement of normative fit."**
  *   **Goal:** Restrict resource/deny intervention.
  *   **Strategy:** Select the *broadest* reliable class (maximizes statistical stability, minimizes individual exception).
  *   **Goal:** Authorize intervention/override patient refusal.
  *   **Strategy:** Select the *narrowest* reliable class (maximizes individual specificity, minimizes population averaging).

  This is not merely "cherry-picking" (see Distinction 1) because the alternatives are acknowledged. It is a recognized, institutionalized method of resolving the Reference Class Problem by deferring to the *purpose* of the calculation rather than the *properties* of the data.

  ### 2. Distinction from Ordinary Cherry-Picking

  **Cherry-Picking (Data Suppression):**
  *   **Mechanism:** The speaker presents *only* the statistic that supports their view and conceals the existence of alternative valid groupings.
  *   **Epistemic Status:** Deceptive. It relies on the audience believing the presented number is the *only* number.
  *   **Correction:** Revealed by producing the hidden data.

  **Normative Reference Class Selection (Data Prioritization):**
  *   **Mechanism:** The speaker acknowledges the other groupings ("Yes, the overall rate is 6%, but for runners it is 3%") but argues that the alternative grouping is *less relevant* to the decision at hand.
  *   **Epistemic Status:** Argumentative. It relies on the audience accepting a hierarchy of relevance (e.g., "Physiology trumps demographics" or "Policy trumps physiology").
  *   **Correction:** Cannot be corrected by more data, because all data is admitted. It can only be corrected by challenging the *priority rule* (e.g., "Why does physiology trump demographics in this specific context?").

  **Boundary Case:** If a speaker claims the 3% figure is the *only* true figure and the 6% figure is "wrong," they have crossed into cherry-picking or error. If they admit the 6% is true for the population but argue it is *inapplicable* to this decision, they are engaging in Normative Reference Class Selection.

  ### 3. Distinction from Plain Reversal Under Partitioning

  **Plain Reversal (Statistical Stalemate):**
  *   **Mechanism:** Two parties present different valid reference classes (e.g., Simpson's Paradox scenarios).
  *   **Outcome:** The disagreement remains unresolved because both numbers are acknowledged as correct. The conclusion is usually "we cannot know the true risk."
  *   **Function:** Descriptive. It highlights uncertainty.

  **Normative Reference Class Selection (Decision Resolution):**
  *   **Mechanism:** Two parties present different valid reference classes.
  *   **Outcome:** The disagreement is resolved by selecting the class that aligns with the desired action. The conclusion is "we know the risk *for the purpose of this decision*."
  *   **Function:** Prescriptive. It resolves uncertainty by aligning probability with policy.

  **Boundary Case:** In a purely academic epidemiological review, this would be a Plain Reversal. In a clinical committee, it becomes Normative Selection the moment the probability is linked to a specific action (approve/deny). The "shift in grain" you observed is the mechanism by which the group escapes the stalemate of Plain Reversal.

  ### 4. The Legitimate Version: Macro- vs. Micro-Allocation

  You asked if there is a version of this move that is entirely legitimate. **Yes.** In bioethics and health economics, this is the distinction between **Macro-allocation** and **Micro-allocation**.

  **The Legitimate Shift:**
  *   **Context A (Budgeting/Policy):** When deciding whether to fund a service or staff a unit, the hospital acts as an insurer or public health body. The relevant moral unit is the *population*.
      *   *Correct Grain:* Broad reference classes.
      *   *Justification:* Fairness across the system requires stable, aggregate predictions. Using narrow classes here would lead to budgetary instability and inequity (favoring those with rare, favorable traits).
  *   **Context B (Bedside Care):** When deciding whether to proceed with a procedure for a specific patient, the physician acts as a fiduciary. The relevant moral unit is the *individual*.
      *   *Correct Grain:* Narrowest reliable reference class.
      *   *Justification:* The duty of care is to *this* patient. Using broad classes here commits the **Ecological Fallacy** (assuming the group average applies to the individual).

  **The Illegitimate Move (The Phenomenon You Observed):**
  The dysfunction arises when the grain is shifted *within* the same context to win an argument, or when the logic of one context is smuggled into the other without declaration.
  *   **Example of Illegitimacy:** Using the broad "population risk" (Macro logic) to deny a specific patient's requested treatment (Micro decision) without acknowledging that the shift prioritizes system efficiency over individual benefit.
  *   **Example of Illegitimacy:** Using the narrow "exceptional runner" risk (Micro logic) to justify allocating disproportionate resources to a specific patient (Macro decision) without acknowledging the cost to the system.

  **Why It Feels Uncanny:**
  The discomfort you feel likely stems from the fact that your committee is likely tasked with **Micro-allocation** (clinical risk review), but the members are implicitly importing **Macro-allocation** logic (system risk management) when they want to withhold care. They are using population-level evidence to solve individual-level ethical problems.

  ### Summary for Committee Use

  If you wish to name this dynamic in your meetings to make it discussable, you might say:

  > "We are encountering **Normative Reference Class Selection**. We all agree on the data, but we are selecting different reference classes based on whether we are prioritizing system-level stability (broad classes) or individual-level precision (narrow classes). We need to explicitly agree on whether this decision is a **Macro-allocation** (policy) or **Micro-allocation** (bedside) decision, because the legitimate grain of the data changes depending on that answer."

  This frames the disagreement not as a dispute over facts (which you cannot solve), nor as a dispute over honesty (which is accusatory), but as a dispute over the **level of moral analysis**, which is a solvable procedural question.
