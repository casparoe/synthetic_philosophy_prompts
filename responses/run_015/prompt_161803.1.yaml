answer: |-
  There is no canonical technical term in epistemology or decision theory for this specific configuration. It is a structural pathology of Bayesian decision-making that falls under the broad rhetorical umbrella of **Special Pleading**, but that label is too coarse for your purposes. It is distinct from standard biases because it operates within the algebra of a single expected-value calculation rather than across the selection of evidence.

  For your chapter, I propose the label **Asymmetric Scenario Conditioning**.

  ### Definition: Asymmetric Scenario Conditioning

  **Asymmetric Scenario Conditioning** occurs when a skeptical or speculative hypothesis ($H$) is admitted into an expected-value calculation to modify the probability term ($P$) of a specific option, but is systematically withheld from modifying the value term ($V$), the probability terms of alternative options, or the causal structure of the outcome space, without independent justification for the asymmetry.

  It takes two primary forms:

  1.  **The Deflationary Form:** $H$ is treated as epistemically "live" sufficiently to reduce the probability of a long-term payoff (e.g., "the simulation might end"), but is treated as "inert" regarding the magnitude of the payoff (e.g., "the number of beings remains fixed") and regarding alternative options (e.g., "short-term aid is not subject to the same termination risk").
  2.  **The Oscillating Form:** $H$ is treated as "live" to deflate Option A, but treated as "inert" or "live in a different way" to inflate Option B (e.g., "we must perform for the simulators"), with no account given for why the epistemic status of $H$ shifts between the two evaluations.

  **The Diagnostic Condition:**
  To diagnose Asymmetric Scenario Conditioning rather than principled reasoning, you must find that the agent fails to propagate the implications of $H$ through the **entire decision matrix**. If $H$ is true, it constitutes a state of the world. In a coherent model, conditioning on a state of the world must update all dependent variables (probabilities, values, causal pathways) for all available actions. If $H$ updates only the variables that reduce the target EV, while leaving constant the variables that might increase it or reduce the alternative EVs, the conditioning is asymmetric.

  ---

  ### Distinctions from Related Concepts

  You requested distinctions from five specific lookalikes. Here is how Asymmetric Scenario Conditioning differs from each:

  **1. Motivated Reasoning / Confirmation Bias**
  *   **The Lookalike:** An agent selects evidence that supports a desired conclusion.
  *   **The Difference:** Motivated reasoning is a psychological diagnosis about *which premises are selected*. Asymmetric Scenario Conditioning is a structural diagnosis about *how a single admitted premise is processed*. An agent can be perfectly unbiased in accepting $H$ as relevant, yet still commit this error by failing to compute the full consequences of $H$ within the calculation. It is an error of propagation, not selection.

  **2. Pascal's Mugging**
  *   **The Lookalike:** Worry that tiny probabilities of enormous payoffs dominate decision-making.
  *   **The Difference:** Pascal's Mugging concerns the *magnitude* of the inputs (tiny $P$, huge $V$). Asymmetric Scenario Conditioning concerns the *dependency* of the inputs on a hypothesis. A Pascal's Mugging case can be calculated symmetrically (fully accepting the hypothesis). Asymmetric Scenario Conditioning can occur even with moderate probabilities and values; the error is that $H$ is used as a scalpel to cut down one term while leaving the rest of the equation untouched.

  **3. Debunking Arguments (and Self-Undermining Objections)**
  *   **The Lookalike:** An argument that undermines the grounds for believing the conclusion (e.g., "If evolutionary theory is true, we can't trust our reasoning").
  *   **The Difference:** Debunking arguments target the *justification for the belief domain itself*. Asymmetric Scenario Conditioning accepts the hypothesis as true (or sufficiently probable) for the sake of argument but restricts its ontological consequences. It does not say "We can't know if we are in a sim"; it says "Assume we are in a sim, apply that to the risk of termination, but do not apply it to the number of beings at stake."

  **4. Undercutting vs. Rebutting Defeaters**
  *   **The Lookalike:** Classifying how evidence defeats a claim (attacking the link vs. attacking the conclusion).
  *   **The Difference:** The defeater distinction classifies the *logical relation* between evidence and belief. Asymmetric Scenario Conditioning classifies the *deployment* of a belief within a utility function. One can have a valid undercutting defeater for a long-term project and still commit this error if one fails to apply the same defeater to the short-term alternative or fails to update the value of the outcome under the defeated condition.

  **5. Substantive Risk Claims**
  *   **The Lookalike:** The claim "Simulations are likely to be shut down early."
  *   **The Difference:** This is the most crucial distinction. The substantive claim is a premise. Asymmetric Scenario Conditioning is the *usage pattern* of that premise. It is entirely valid to argue that $H$ implies a high hazard rate. It is Asymmetric Scenario Conditioning to argue that $H$ implies a high hazard rate for the long-term project, but implies no hazard rate for the short-term project, and implies no change to the population size of the future, without deriving those latter claims from $H$.

  ---

  ### Boundary Cases: Principled vs. Opportunistic

  To diagnose the opportunistic version (the error) rather than the principled version (valid reasoning), look for the following four boundary conditions.

  **1. The Principled Time-Horizon Discount (Not an Instance)**
  *   **Scenario:** The agent argues that termination risk accumulates over time. Therefore, a 1,000-year project is discounted more than a 1-year project.
  *   **Why it is Principled:** The hypothesis ($H$ = "termination risk exists") is applied symmetrically to the *time-profile* of all options. The discount function is derived from the hazard rate implied by $H$. The value term ($V$) is not adjusted because the hypothesis does not structurally alter the value of a life, only the probability of it occurring.
  *   **Diagnostic:** The discount applies to *all* time-sensitive options, not just the one being criticized.

  **2. Symmetric Adjustment (Not an Instance)**
  *   **Scenario:** The agent argues: "If we are in a simulation, the future might be shorter ($P$ goes down), *but* there may be many identical simulations running ($V$ goes up because $N$ beings are affected), *and* our actions might influence the base reality ($Causal Pathway$ shifts)."
  *   **Why it is Principled:** The hypothesis is treated as a world-state. All variables dependent on that world-state are updated. The net EV might go up, down, or stay the same, but the calculation respects the internal logic of $H$.
  *   **Diagnostic:** The agent explicitly calculates the "Simulation Multiplier" on the value side to offset the "Termination Risk" on the probability side.

  **3. Hypothesis Deployed Only to Raise Stakes (Not an Instance, but risky)**
  *   **Scenario:** The agent argues: "We should donate now because if we are in a simulation, the simulators are watching and will reward virtue."
  *   **Why it is Principled (conditionally):** If the agent applies this probability weight to *all* moral actions consistently, it is a coherent (if speculative) theological/decision-theoretic model.
  *   **Diagnostic:** It becomes Asymmetric Scenario Conditioning if the agent uses "Simulators are watching" to boost Charity A, but ignores "Simulators might turn us off" to discount Long-term Project B, despite both relying on the same epistemic footing of $H$.

  **4. The Bad Reason for Asymmetry (The Opportunistic Version)**
  *   **Scenario:** The agent argues: "We should discount the long-term project because the simulation might end, but we don't discount the short-term project because it happens too fast for the simulation to end, and we don't increase the value because we don't know how many sims there are."
  *   **Why it is Opportunistic:** This relies on an asymmetry in *ignorance*. It uses the possibility of $H$ to generate risk (where ignorance favors caution) but uses the ignorance of $H$'s details to block upside (where ignorance would favor expectation neutrality or wide priors).
  *   **Diagnostic:** The agent treats the *negative* implications of $H$ as robust derivations and the *positive* or *neutral* implications of $H$ as requiring proof they do not possess. This is a burden-of-proof asymmetry.

  ---

  ### The Symmetric Outcome: Transfer vs. Elimination

  You asked: *When the hypothesis is applied symmetrically, does the dampening of far-future fanaticism survive at all, or does it turn out to have been transferring the fanaticism somewhere else?*

  If Asymmetric Scenario Conditioning is corrected and the hypothesis is applied symmetrically, the dampening of fanaticism generally **does not survive**. Instead, the fanaticism is **transferred**.

  Here is the structural reason why:

  1.  **The Probability Discount:** Symmetric application acknowledges that if $H$ (Simulation) is true, the probability of a standard, biological, $10^{50}$-year future drops significantly (due to termination risk or computational limits). This attacks the "Long Future" premise.
  2.  **The Value Multiplier:** However, $H$ typically implies that our reality is one of many. If we are in a simulation, there is likely a base reality running many such simulations. If our actions affect the *runners* of the simulation (or if the simulation is a test case for base-reality policy), the *value* of our actions is no longer confined to the beings in our simulation. It scales to the beings in the base reality or the number of parallel simulations.
  3.  **The Causal Relocation:** In the standard longtermist view, impact propagates forward in time within our light cone. Under symmetric $H$, impact propagates *upward* (to simulators) or *outward* (to parallel instances).
  4.  **The Result:** The Expected Value calculation ($EV = P \times V$) often remains astronomical. The $P$ of a standard future drops, but the $V$ (scope of affected beings across the multiverse/sim-cluster) rises, or the $P$ of influencing the simulators remains high enough to sustain high stakes.

  **Conclusion:** Asymmetric Scenario Conditioning is often used intuitively to try to "deflate" longtermist conclusions. However, correcting the asymmetry usually reveals that the skeptical scenario does not reduce the *demandingness* of the ethics; it merely changes the *mechanism*. The "fanaticism" (the commitment to sacrificing present resources for astronomical expected future value) survives, but it is no longer about ensuring the survival of humanity for $10^{50}$ years; it is about ensuring the simulation is not terminated or that the simulators are favorably impressed.

  Therefore, the configuration you are isolating is not just a calculation error; it is often a failed attempt to use skepticism to escape the structural implications of expected-value maximization. When the calculation is fixed, the escape route closes.
