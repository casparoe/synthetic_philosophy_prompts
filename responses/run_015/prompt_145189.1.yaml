  *(Self-Correction during drafting)*: I need to be careful not to dismiss moral hedging entirely. The user likes (4). I should distinguish between *sensible* hedging (MacAskill style) and Dev's *extreme* hedging. Dev's version is "lexicographic" or "minimum threshold" regardless of probability, which is the issue.

