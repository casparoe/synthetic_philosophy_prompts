      *   *Is Step 3 wrong?* It's a category error. Interpersonal compromise is Pareto improvement. Moral hedging is Expected Value maximisation. They look similar mathematically but differ ontologically.
      *   *Decision:* Attack Step 5 primarily, but note that Step 3 masks the error. Step 5 removes the probability weighting which is essential for Expected Utility.
      *   *British English Check:* Ensure spelling (colour, favour, realise) and idiom (mad, rubbish, pub, flatmate) are consistent. Avoid Americanisms.

  7.  **Final Polish:**
