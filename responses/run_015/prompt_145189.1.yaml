      *   "What does rejecting it cost?" (Loses the 'pure concavity' drive, must reintroduce probability).
      *   "Is there a version that survives?" (Yes, standard moral hedging weighted by credence).

  8.  *(Self-Correction on Step 6c)*: This is also a failure of the "shared pool" assumption. If the other person's moral view is "kill all X," and you are X, there is no shared pool. The lemma assumes a positive-sum game. Monsters often imply zero-sum or negative-sum. I should mention this.

