answer: |-
  You are quite right to feel that conclusion (6) is properly mad. It is the sort of thing that sounds profound at 2 a.m. in the pub but collapses under the light of day. You do not have to choose between accepting the utility of compromise and retaining your sanity. Dev has constructed a sorites paradox out of game theory and moral philosophy, and while the first few steps are robust, the chain snaps cleanly at step (5), with step (3) doing a great deal of heavy lifting to hide the breakage.

  Here is the diagnosis of where the argument goes wrong, why it looks seductive, and what you can salvage from the wreckage.

  ### The Broken Step: (5)

  The primary error lies in step (5). This is the claim that "the slice a view is owed doesn't shrink just because you're confident it's false."

  **Why it looks fine:**
  It appeals to a very sensible intuition: epistemic humility. We know we might be wrong. It feels virtuous to say, "Even if I'm 99% sure I'm right, I should respect the 1% chance I'm not." Dev dresses this up in the language of concavity. Since concavity drives the surplus in the original lemma, he argues that concavity should drive the allocation *regardless* of probability. It feels like a robust safeguard against dogmatism.

  **Why it is wrong:**
  It conflates *risk aversion* with *probability weighting*. In standard decision theory (and in the working paper you mentioned regarding your flatmate's lemma), the reason you split the pool is that you are maximising *expected utility*. Expected utility is the product of two things: the value of the outcome (utility) and the likelihood of that outcome obtaining (probability/credence).

  Concavity explains why you prefer a sure £50 to a 50% gamble on £100. It does not explain why you would prefer a sure £50 to a 0.1% gamble on £1,000,000. If you ignore the probability (the credence), you are no longer maximising expected value; you are maximising something else entirely—perhaps "minimum regret" or "presence of representation."

  By decoupling the allocation from the credence, Dev is arguing that the *structure* of the value function overrides the *evidence* for the value function. If you assign a moral theory a 0.1% credence, but grant it a "standing slice" comparable to a 50% theory because of concavity, you are effectively treating a 1-in-1000 chance as a 1-in-2 chance for the purposes of resource allocation. That is not hedging; that is delusion.

  **The cost of rejecting it:**
  You lose the "pure concavity" drive. You must admit that credence matters. This means the "hedge ratio" is not a flat minimum for every conceivable view, but a function of probability. You cannot claim that concavity *alone* solves moral uncertainty; it must work in tandem with Bayesian updating.

  ### The Concealed Category Error: (3)

  Step (3) is the enabler. It claims that disagreeing with another person is "structurally the same kind of problem" as being uncertain which moral view is true.

  **Why it looks fine:**
  In both cases, you have a fixed budget and competing claims. In both cases, putting all your eggs in one basket feels risky. Mathematically, the equations look remarkably similar (weighted sums of utility functions).

  **Why it is wrong:**
  This is a category error between *interpersonal* and *intrapersonal* aggregation.
  *   **Interpersonal (The Working Paper):** Two agents exist simultaneously. If you fight, one wins and one loses. If you compromise, *both* can be made better off relative to the conflict baseline. The surplus is real because both utility functions are "active" in the world.
  *   **Intrapersonal (Moral Uncertainty):** Only one moral theory can be true (generally). If Utilitarianism is true, then satisfying Kantianism is not just "less efficient"; it is literally creating no moral value (or negative value). There is no "surplus" to be had between truth and falsehood in the same way there is between two hungry people. You are not compromising between two agents; you are gambling on which agent actually exists.

  **The cost of rejecting it:**
  You lose the neat symmetry between negotiation and conscience. You have to treat moral hedging as a form of *decision-making under uncertainty*, not as a *negotiation with possible selves*. This makes the maths slightly less elegant but much more accurate.

  ### The "Monsters" Problem: (6c)

  Finally, we must address the claim that you should never refuse to compromise, even with those who want to do "straightforwardly monstrous" things.

  **Why it looks fine:**
  It follows from the "always a split" logic. If there is always a concave surplus, there is always a deal better than war.

  **Why it is wrong:**
  The split-surplus lemma relies on a **positive-sum game**. It assumes there is a shared pool to split. If your interlocutor's moral view is "You should be enslaved," the feasible set of outcomes does not include "We both get half of what we want." Their utility function is likely predicated on your loss. In game theory terms, the negotiation set is empty. You cannot split a pie if the other party's goal is to burn the bakery.

  **The cost of rejecting it:**
  You must accept that some conflicts are zero-sum or negative-sum. Compromise is a virtue only when the other party accepts the legitimacy of your existence and claims.

  ### What Survives?

  You do not need to burn the working paper. A sane version of the split-surplus lemma looks like this:

  1.  **Keep (1) and (2):** Concavity creates gains from trade between *actual* agents with *actual* conflicting interests. Compromise is often rational for selfish, risk-averse agents.
  2.  **Modify (4):** Hedging under moral uncertainty is sensible, *but* it must be weighted by credence. You hedge because you aren't sure, not because concavity grants rights to falsehoods.
  3.  **Reject (5):** A view with 0.1% credence does not get a "seat at the table" in proportion to its concavity; it gets a slice proportional to its probability. If the probability is negligible, the slice is negligible.
  4.  **Qualify (6c):** Compromise is only required when the other party's goals are compatible with a positive-sum outcome.

  ### The Verdict

  Dev has taken a lemma about **risk aversion** and disguised it as a lemma about **tolerance**.

  Concavity tells you to diversify your portfolio; it does not tell you to invest in companies you are certain are fraudulent just because "you might be wrong about the fraud."

  If you reject step (5), you save yourself from spending your twenties honouring garbage views. The cost is that you lose the rhetorical flourish of saying "concavity demands tolerance." Instead, you must say, "Probability demands humility, and concavity demands prudence." It is less poetic, but it keeps you out of trouble.

  So, buy Dev a pint to apologise for ruining the argument, but tell him he's banned from applying game theory to ethics until he's read up on Bayesian credence. The split-surplus lemma survives, but only for people who actually exist, not for ghosts in the machine.
