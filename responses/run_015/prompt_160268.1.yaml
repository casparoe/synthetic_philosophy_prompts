      *   **Goal:** Run a compressed, rigged *Nomic*-style game to make abstract concepts *felt*.
      *   **Key Concepts to Emerge:**
          1.  Need for a fixed point (foundation).
          2.  Hierarchy/Tiers (mutable vs. entrenched vs. inviolate) and "jurisdiction moves" (changing a rule's tier without changing text).
          3.  Paradoxes as exploits (instrumental, not theoretical).
      *   **Specific Mechanics to Include/Adapt:**
          *   Janus Clause (self-validating proposals).
          *   Provisional Rules (retroactive dissolution).
          *   Three Tiers (Mutable, Entrenched, Inviolate).
          *   Transmutation Rule (changing tiers).
          *   Rotating Clerk (adjudicator).
          *   Private Mandates (scoring based on final state, not just voting).
      *   **Constraints:** No jargon ("inviolate," "self-amendment") during play. One-page initial ruleset.
      *   **Deliverables:** Initial Ruleset, Mandate Cards, Turn Order/Timeline, Adjudication Mechanics, Derailment Prevention, Debrief Guide, Limitations Note.
      *   **Specific Warning:** Last year, a student proposed "I win" and ended the game in 12 minutes. Need to prevent this.

  2.  **Deconstruct the Game Design:**
      *   *Problem:* 18 students is too many for a single *Nomic* turn cycle in 90 minutes. If everyone proposes once, that's 18 turns. Even at 3 minutes/turn, that's 54 minutes just for proposals, plus debate, voting, and adjudication.
      *   *Solution:* Team play or simultaneous phases? No, *Nomic* relies on sequential logic. Better to limit the number of *active* proposers or run parallel tracks.
      *   *Better Solution:* Divide into 3 "Factions" of 6 students. Each faction acts as a single voting bloc/proposer. This reduces turns from 18 to ~6-9. It also encourages internal debate within factions about strategy.
      *   *Wait, the prompt implies individual mandates:* "private mandate cards so everyone has something to protect." If they are in factions, how do they score individually?
      *   *Compromise:* Keep individuals, but limit the number of *proposal opportunities*. Or, use a "Market" style where proposals are submitted on index cards and processed in batches.
      *   *Best Approach for 90 mins:* 18 students is a lot. Let's try to keep them individual but constrain the *scope*. Actually, the "I win" problem suggests unrestricted rule-making. The ruleset needs to be *rigged* to prevent immediate game-ending moves.
      *   *Revised Structure:* 3 Rounds of Proposals. Each student gets 1 proposal total? No, too slow.
      *   *Revised Structure:* 3 Teams of 6. Each team shares a "Mandate" but has individual roles? No, prompt says "private mandate cards."
      *   *Okay, let's stick to the prompt's constraints but optimize for time.* 18 students. 90 minutes.
      *   *Math:* 15 min Intro/Rules. 45 min Game. 30 min Debrief.
      *   *Game Time:* 45 minutes. If everyone proposes, it's impossible.
      *   *Fix:* **The "Legislative Session" Model.** Proposals are written on index cards and submitted to the Clerk. The Clerk selects 6-8 to bring to the floor. This prevents the "I win" instant kill because the Clerk can rule a proposal "out of order" if it doesn't follow procedure (and we can rig the procedure).
      *   *Actually, better:* **Factions with Individual Scoring.** Divide into 3 Houses (6 students each). They draft proposals together. This speeds up negotiation. They vote as a bloc? No, that kills the "majority" mechanic.
      *   *Decision:* **Divide into 3 Factions of 6.** Each faction gets 2 Proposal Slots total. Voting is individual (to allow betrayal). This ensures ~6 proposals max. This fits the time.
      *   *Wait, prompt says:* "private mandate cards so everyone has something to protect."
      *   *Okay, I will design the mandates so they are faction-aligned but individually held.*
      *   *Preventing the "I Win" Move:* The initial ruleset must explicitly forbid rules that end the game or assign victory conditions *unless* passed through a specific high-tier procedure. Or, simpler: The Clerk has the authority to rule proposals "non-justiciable" if they don't pertain to the governance structure.
      *   *Better:* Make the *goal* of the game (the mandates) secret until the end. If they don't know what "winning" looks like, they can't propose "I win." They think they are building a legal system, not playing a game to a score. The score is revealed in debrief.
      *   *Wait, prompt says:* "you score for how well the final ruleset matches your mandate." If they don't know the mandate, they can't play strategically.
      *   *Compromise:* The mandates are specific rule states (e.g., "Rule 3 must be Mutable"). They don't know *victory points* exist, just that they have an objective.
      *   *Preventing "I Win":* The Initial Ruleset must define the *scope* of legislation. "Proposals must amend, repeal, or create rules regarding the governance of this Seminar." A proposal saying "Student X Wins" is out of scope.

  3.  **Drafting the Initial Ruleset (The "Constitution"):**
      *   Needs to be 1 page.
      *   Needs 3 Tiers (without using those words).
      *   Needs a Clerk.
      *   Needs the Janus/Provisional mechanics embedded or available.
      *   *Tier 1 (Foundations):* Cannot be changed. (Actually, prompt says "single inviolate rule").
      *   *Tier 2 (Entrenched):* Needs 2/3 vote.
      *   *Tier 3 (Ordinary):* Needs 1/2 vote.
      *   *Transmutation:* How to move rules between tiers.
      *   *The "I Win" Block:* Rule 1 must define the *purpose* of the rules. "These rules govern the seminar procedure only."

  4.  **Drafting the Mandates:**
      *   Need 18 unique but overlapping cards.
      *   Some want stability (keep Tier 1).
      *   Some want flexibility (make everything Tier 3).
      *   Some want specific clauses (Janus).
      *   Some want the Clerk to have power.

  5.  **Adjudication & The Clerk:**
      *   Clerk rotates every 15 mins? Or per proposal?
      *   Prompt says "rotating clerk whose default ruling a majority can override."
      *   *Crisis Point:* What if the proposal is *about* the Clerk's authority?
      *   *Solution:* The "Shadow Clerk." The TA acts as the Supreme Court but only intervenes if the system collapses.
      *   *Dispute:* If the Clerk's authority is challenged, the vote to override the Clerk requires a 2/3 majority (Entrenched procedure).

  6.  **Timeline:**
      *   0-15: Setup & Rules.
      *   15-60: Play (3 Rounds).
      *   60-90: Debrief.

  7.  **Addressing the "I Win" Exploit:**
      *   Explicitly forbid "Victory Conditions" in the initial rules.
      *   TA acts as "Registrar" who validates proposals before they hit the floor. If a proposal says "I win," Registrar says "Out of order: violates Rule 1 (Scope)."

  8.  **Debrief:**
      *   Map the chaos to Hart/Kelsen.
      *   Highlight the "Fixed Point."
      *   Highlight the "Jurisdiction Move."
      *   Highlight the "Janus/Paradox."
      *   Acknowledge limitations (this is a game, real law has violence/monopoly on force).

  9.  **Refining the Mechanics (Self-Correction):**
      *   *Issue:* 18 students voting on every proposal takes too long.
      *   *Fix:* Show of hands is fast.
      *   *Issue:* Writing proposals takes time.
      *   *Fix:* Pre-printed templates on index cards. "I propose to [Action] Rule [Number]."
      *   *Issue:* The Janus Clause needs to be discoverable, not just given.
      *   *Fix:* Include a "Legislative Tool Kit" handout or allow them to invent procedures as long as they pass the current rules.
      *   *Wait, prompt says:* "Two devices I've been playing with... you should build in or replace." I should build them in as *available options* in the initial ruleset so they can use them.
      *   *Refinement:* Make the Janus Clause a specific *type* of amendment available in the initial rules.

  10. **Final Polish:**
      *   Tone: Practical, authoritative but open.
      *   Formatting: Clear sections for the TA.
      *   Check against constraints: No projector, 1 page rules, no jargon during play.

  *(Self-Correction on the "I Win" scenario)*: The prompt specifically mentions last year a guy proposed "I win" and it ended. I need to make sure the *Initial Ruleset* prevents this structurally.
  *Strategy:* Rule 1 defines the "Domain." Rule 2 defines "Validity." If a proposal falls outside the Domain, it is Void. The Clerk enforces this. If the Clerk is bribed/overruled, the TA (as the "State") steps in. I will instruct the TA to be the "Registrar" who stamps proposals *before* they are read. This creates a bottleneck that stops nonsense.

