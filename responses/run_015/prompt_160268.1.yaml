answer: |-
  Here is a complete run-sheet for the 90-minute session. It is designed to be printed and handed to you, with the ruleset ready to photocopy.

  ### 1. The Initial Ruleset (The "Charter")
  *Print this on a single sheet, double-sided if needed. Hand one to every student.*

  **THE SEMINAR CHARTER (Version 1.0)**

  **I. SCOPE & AUTHORITY**
  1.  **Domain:** These rules govern only the procedure of this seminar session. They cannot assign grades, victory, or expulsion. Any proposal claiming to do so is **Void**.
  2.  **The Clerk:** One student serves as Clerk. They interpret these rules. Their ruling stands unless **Overridden**.
  3.  **Override:** To Override a Clerk, a simple Majority (50% + 1) of present students must vote "Override."

  **II. THE THREE TIERS**
  Rules are printed on **White** (Ordinary), **Yellow** (Entrenched), or **Red** (Anchor) cards.
  4.  **White Rules:** Changed by **Majority Vote**.
  5.  **Yellow Rules:** Changed by **Super-Majority** (2/3 of present students).
  6.  **Red Rules:** **Cannot be changed.** (Currently, only Rule 1 is Red).

  **III. LEGISLATIVE TOOLS**
  7.  **Transmutation:** A proposal may change a rule's Tier (e.g., White to Yellow). This requires a **Super-Majority**.
  8.  **Emergency Decree (Provisional):** A proposal may take effect *immediately* upon submission. If it is not ratified by vote within 10 minutes, it dissolves as if it never existed. Actions taken under it remain valid unless reversed.
  9.  **Conditional Adoption (Janus):** A proposal may specify its own passing threshold (e.g., "This passes if 50% agree, OR if 3 specific students agree"). The *higher* threshold applies until the rule passes.

  **IV. PROCEDURE**
  10. **Submission:** Proposals must be written on Index Cards and signed. The Clerk accepts or rejects them *before* reading.
  11. **Debate:** 2 minutes per proposal.
  12. **Voting:** Show of hands. Abstentions count as "No."
  13. **Rotation:** The Clerk role rotates every 15 minutes to the student to their left.

  ***

  ### 2. Mandate Cards (Private Objectives)
  *Print and cut. Shuffle and deal one to each student. Tell them: "This is your private instruction. Do not show it to anyone. At the end, you will check if this is true. If it is, you get a point."*

  *   **Stability (6 cards):** At the end, at least one Rule must be Red (Anchor).
  *   **Flexibility (6 cards):** At the end, no Rules may be Yellow (Entrenched). All must be White or Red.
  *   **Power (3 cards):** At the end, the Clerk must have the power to Veto a vote without Override.
  *   **Chaos (3 cards):** At the end, at least one Rule must contain a Conditional Adoption (Janus) clause.

  *(Note: These mandates are mutually incompatible. This guarantees conflict.)*

  ***

  ### 3. Timeline & Turn Order (90 Minutes)

  **00:00 – 00:15: Setup & Briefing**
  *   Hand out **Charter** and **Mandate Cards**.
  *   **Crucial Script:** "You are legislators. Your goal is to leave this room with a legal system you can live with. You have private objectives. You may lie about them. You may form alliances. The game ends when I say time is up. The 'winner' is whoever best satisfies their card."
  *   **Appoint First Clerk:** Pick the student most likely to try to break the game (usually the one who smirked at "Rule 1"). This gives them responsibility immediately.
  *   **Start the Clock.**

  **00:15 – 00:55: The Legislative Session (40 Mins)**
  *   **Phase 1 (15 mins):** Open Floor. Students submit Index Cards. Clerk filters. Vote.
  *   **Phase 2 (15 mins):** Clerk Rotates. Introduce a "Crisis": Tell them "The University requires a rule on Attendance." They must legislate this using their current system.
  *   **Phase 3 (10 mins):** Final Rush. Allow **Emergency Decrees** (Provisional Rules) to encourage risky, retroactive moves.

  **00:55 – 01:30: The Debrief (35 Mins)**
  *   Stop play immediately. Do not resolve pending votes.
  *   Collect Mandates. Tally satisfaction on the whiteboard.
  *   Discussion (see Debrief Guide below).

  ***

  ### 4. Adjudication Mechanics (For You)

  **The "Registrar" Role (You)**
  Do not sit out. Sit at the front with the Index Cards.
  *   **The Filter:** All proposals must pass through *your* hands before reaching the Clerk.
  *   **The "I Win" Block:** If a student writes "I win" or "Game Over," stamp it **VOID**. Cite **Rule 1 (Domain)**. Hand it back. Say: "Out of scope. Try again." Do not explain why until the debrief.
  *   **The Clerk Crisis:** If a proposal targets the Clerk's authority (e.g., "The Clerk is fired"), the *current* Clerk rules on it. If they recuse themselves, *you* act as Temporary Clerk for that vote only.
  *   **The Paradox:** If a proposal creates a logical loop (e.g., "This rule is false"), allow it. Let the Clerk struggle. Only intervene if the room becomes physically agitated.

  **Derailment Steering**
  *   **If they stall (no proposals):** Announce: "A motion to Adjourn is now on the floor. If it passes, the game ends and no mandates are scored." (Threat of mutual destruction usually sparks activity).
  *   **If they agree too easily:** Whisper to the "Chaos" mandate holders: "You're losing."
  *   **If the Clerk is tyrannical:** Remind them Rule 3 (Override) exists. If they forget, ask: "Is there a motion to Override?"

  ***

  ### 5. Debrief Guide (Mapping Play to Theory)

  *Do not lecture. Ask questions based on what happened.*

  **1. The Fixed Point (The Rule of Recognition)**
  *   *Watch for:* The moment someone tried to change Rule 1 (The Red/Anchor rule).
  *   *Ask:* "When someone tried to delete Rule 1, why did it fail? Was it because the rule said so, or because you all agreed to stop them?"
  *   *Point:* A legal system needs a "Rule of Recognition"—a social fact, not just a written rule, that identifies what counts as law. Without the Red tier, the White tier has no foundation.

  **2. The Jurisdiction Move (Hierarchy)**
  *   *Watch for:* Proposals that changed a rule from Yellow to White (or vice versa) without changing the text.
  *   *Ask:* "Did anyone change a rule's *status* without changing its *words*? Why is that harder than just rewriting the text?"
  *   *Point:* Constitutional law vs. Statutory law. Changing *who* can change the rule is more fundamental than changing the rule itself.

  **3. The Exploit (Paradox as Tool)**
  *   *Watch for:* Use of the **Janus Clause** (Conditional Adoption) or **Emergency Decree**.
  *   *Ask:* "Did anyone use the Emergency Decree? Did you act on a rule that might not exist later? How did that feel?"
  *   *Point:* Self-reference isn't a puzzle; it's a loophole. Lawyers use retroactivity and conditional validity to bypass obstacles. The paradox is a feature, not a bug.

  **4. The Limitation (What the Game Missed)**
  *   *Honest Note:* "This game assumed you would follow the rules. In the real world, if 15 of you decided to ignore the Clerk, the Clerk has no police force. Law rests on rules, but it *survives* on monopoly of force. We simulated the logic of law, not the violence that backs it."

  ***

  ### 6. Predictable Failures & Fixes

  **Failure 1: The "I Win" Exploit (Recurrence)**
  *   *Risk:* A student argues Rule 1 is just a White rule in disguise.
  *   *Fix:* If they vote to change Rule 1's color from Red to White, allow the vote. But if it passes, **you** declare the session "Void" due to collapse of authority.
  *   *Script:* "You have successfully dissolved the legal order. We are now in a state of nature. Class is dismissed." (Bluff. They will panic and restore the rule).

  **Failure 2: The Clerk Bottleneck**
  *   *Risk:* The Clerk takes 5 minutes to read one card.
  *   *Fix:* Enforce the 2-minute Debate limit strictly. Use a visible timer on your phone.

  **Failure 3: Mandate Secrecy**
  *   *Risk:* Students share mandates immediately, forming blocs that stall the game.
  *   *Fix:* Remind them: "Mandates are private. If you are caught showing your card, you are disqualified." (Even if you don't enforce this, the threat slows collusion).

  **Failure 4: The Janus Confusion**
  *   *Risk:* They don't understand the Janus Clause (Rule 9).
  *   *Fix:* Keep a "Precedent Board" on the whiteboard. If someone successfully uses Rule 9, write "PRECEDE: Janus Valid" on the board. Students love exploiting established precedent.

  ### TA Cheat Sheet (Keep this in your pocket)

  *   **Goal:** Make them feel the *anxiety* of legal uncertainty, not the joy of winning.
  *   **Key Moment:** When a Provisional Rule dissolves retroactively. Ask: "Is the action you took under that rule now illegal?" (Let them argue).
  *   **Key Moment:** When the Clerk rotates. Ask: "Does the law change because the person interpreting it changed?"
  *   **Ending:** Do not declare a winner. Ask: "Who satisfied their mandate?" Count hands. Say: "Good. Next week we read Hart. Bring this feeling with you."
