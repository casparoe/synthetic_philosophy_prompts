  *Strategy:* **The "Committee" System.** Divide into 3 Committees of 6. Each Committee drafts *one* proposal per round. There are 3 Rounds. Total 9 Proposals. This is manageable. Voting is still individual (to allow cross-committee alliances). This balances speed with individual agency.

