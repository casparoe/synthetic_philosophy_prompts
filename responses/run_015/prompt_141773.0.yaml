      *   *The "Delay Bridge":* This proves the vagueness. If I can dial from 1 to 2 subjects smoothly, "number of subjects" isn't a natural kind.
      *   *The "Lockstep":* This proves the hardware/software distinction.
      *   *Actionable Advice:* Stop trying to count. Start mapping the *degree* of integration across specific domains (visual, motor, narrative).

  8.  **Final Polish:** Check against all constraints.
