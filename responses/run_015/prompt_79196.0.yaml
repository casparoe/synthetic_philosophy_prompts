answer: |-
  ### The Effective Altruism Critique Decision Tree

  **Node 1: The Root Fork**
  When you object to this commitment, which fundamental picture do you believe is flawed?
  *   **A.** My picture of **what I can actually know** is wrong. (Go to Node 2)
  *   **B.** My picture of **what I owe others** is wrong. (Go to Node 3)
  *   **C.** My picture of **the good** is wrong. (Go to Node 4)

  ---

  **Node 2: The Epistemic Branch (Knowledge)**
  Is the problem that our tools for measuring good are inaccurate, or that using these tools changes what we try to do?
  *   **A.** The tools are inaccurate; we **measure the wrong things**.
      *   **Leaf 1: The Measurability-Bias Critique.**
          *   *Hardest Commitment:* Defenders must accept that we might be confidently wrong about what actually helps people.
  *   **B.** The tools are restrictive; **only measurable things get funded** in the first place.
      *   **Leaf 2: The Narrowing Critique.**
          *   *Hardest Commitment:* Defenders must accept that important problems will be ignored simply because they are hard to count.

  ---

  **Node 3: The Practical Branch (Obligation)**
  Is the moral problem with how the donor earns and gives money, or with the organizations that receive it?
  *   **A.** The problem is with the **professionalised institutions**.
      *   **Leaf 3: The Institutional Critique.**
          *   *Hardest Commitment:* Defenders must accept that professional charities may prioritize their own survival over the actual good they claim to serve.
  *   **B.** The problem is with **earning to give**. (Go to Node 3b)
      *   **Node 3b:** Is the worry that your specific job doesn't matter, or that the money itself is tainted?
          *   **i.** Your labour is **replaceable** by someone else.
              *   **Leaf 4: The Replaceability Objection.**
                  *   *Hardest Commitment:* Defenders must accept that your personal passion for your job is morally irrelevant.
          *   **ii.** The objection is about **what the donated money ends up funding** (via its source).
              *   **Leaf 5: The Earning-to-Give Critique.**
                  *   *Hardest Commitment:* Defenders must accept that making money in this system may be too morally dirty to donate.

  ---

  **Node 4: The Political Branch (The Good)**
  Does private giving harm society by relieving the state of duty, or by letting donors pick the future?
  *   **A.** Private giving **displaces public provision**.
      *   **Leaf 6: The Displacement Critique.**
          *   *Hardest Commitment:* Defenders must accept that we should delay saving lives now to fight for systemic change later.
  *   **B.** The movement's funding structure **quietly decides which questions get researched**.
      *   **Leaf 7: The Agenda-Setting Critique.**
          *   *Hardest Commitment:* Defenders must accept that wealthy donors should not have more say over research than the public.

  ***

  ### Analysis of the Tree Structure

  **1. Inseparable Pair**
  The tree cannot fully separate **Leaf 4 (Replaceability)** and **Leaf 5 (Earning-to-Give/Complicity)**. In practice, if one argues that a donor's income is morally tainted (Leaf 5), the question of whether their labour is replaceable (Leaf 4) often becomes secondary; conversely, if the labour is replaceable, the harm of the income source is sometimes argued to be diluted. Critics often hold both views simultaneously, arguing that high-earning careers are both morally compromising *and* socially unnecessary.

  **2. Unoccupied Combination**
  There is a combination of answers that nobody occupies: **Affirming the Epistemic Critique (We cannot know effectiveness) while Affirming the Practical Obligation (You still owe a fixed share).**
  *   **Reason:** This view is **incoherent**. One cannot have a specific moral duty to maximize a value ("effectiveness") that one simultaneously claims is impossible to identify. If you cannot know what is effective, you cannot owe a duty to fund the "most effective" charities.

  **3. The Moot Answer**
  If a participant answers **Node 2 (Epistemic)** with a radical version of **Option A ("We cannot know effectiveness at all")**, the rest of the tree becomes moot. If knowledge is impossible, debates about moral obligations (Node 3) or societal goals (Node 4) regarding *effective* charity collapse, as the premise of the commitment is destroyed.

  ***

  ### Mapping to Named Positions

  While the tree is built from arguments rather than people, the leaves correspond to common positions in the literature:

  *   **Leaf 1 (Measurability-Bias):** Often associated with critics who argue that quantitative metrics (like QALYs) miss qualitative aspects of well-being.
  *   **Leaf 3 (Institutional):** Aligns with sociological critiques of the "non-profit industrial complex" or bureaucratic bloat.
  *   **Leaf 5 (Earning-to-Give):** Corresponds to deontological or virtue-ethics objections to working in harmful industries (e.g., finance) to fund charity.
  *   **Leaf 6 (Displacement):** Matches political economy arguments that philanthropy undermines the welfare state or democratic accountability.
