          *   *Verdict:* Accurate representation of the *problem*, though it simplifies the debate on how to assign priors to known facts.

      *   *Sentence 3:* "This is why old evidence appears to pose a fatal difficulty: Einstein's account of Mercury's perihelion was tested against orbital measurements that astronomers had possessed for decades, yet we regard those very measurements as strong confirmation."
