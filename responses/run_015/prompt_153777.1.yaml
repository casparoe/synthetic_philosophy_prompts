      *   Check constraints: No reading list. 3-year timeline. No archives.

      *(Self-Correction during drafting)*: I initially thought about putting Detection first. But if you detect something that turns out to be benign creative reuse, you've wasted time. You need a hypothesis about *harm* first. So (c) is definitely upstream of (b). But (c) can't be abstract philosophy; it must be empirical case studies of failure. I will frame (c) as "Empirical Normativity."

      *(Refining the "Formal Mapping" critique)*: The user specifically mentioned avoiding essentialism. Formal mapping often *requires* fixing meanings to map them. This directly contradicts their constraint. I need to highlight this tension.

      *(Final Plan)*:
      1.  Validate "Intensional Bleed."
      2.  Rank: 1. Normative/Consequential (c), 2. Detection/Markers (b), 3. Formal Mapping (a).
      3.  Defend based on tractability and leverage.
      4.  Specify evidence that would reorder them.

  9.  **Final Review against constraints:**
