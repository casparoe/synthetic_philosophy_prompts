answer: |-
  Your term "intensional bleed" is sharp. It captures the specific mechanism (leakage of semantic content) better than the standard "conceptual metaphor" or "analogy" literature, which often focuses on the cognitive benefit rather than the ontological cost.

  If I were advising a grad student with three years, no special archives, and a goal of influencing how scientists police their own language, here is the defended ordering of your three options.

  ### The Ranking

  1.  **Priority 1: (c) Deciding whether slippages are damaging or creative (Normative/Consequential Evaluation).**
  2.  **Priority 2: (b) Figuring out how to detect bleed before it becomes invisible (Operational Detection).**
  3.  **Priority 3: (a) Finding formal ways to map home vs. borrowed domains (Formal Mapping).**

  ### The Defense

  **1. Why (c) is Upstream (The "So What?" Problem)**
  You cannot build a detector (b) or a map (a) until you know what you are looking *for*. The philosophy of science is currently split between those who view metaphor as constitutive of theory (good/inevitable) and those who view it as a source of category errors (bad/confusing).
  *   **Tractability:** A grad student cannot solve this theoretically. However, they *can* solve it empirically within a microdomain. Instead of arguing about "essentialism," the student should trace specific instances of bleed to specific outcomes. Did the use of "yield point" in organizational theory lead to a failed intervention? Did the use of "entropy" in information theory obscure a thermodynamic constraint?
  *   **Leverage:** Scientists do not care about semantic purity; they care about predictive failure. If the student can demonstrate that intensional bleed correlates with methodological error or non-replicability in specific sub-fields, that is the only argument that will change policing behavior.
  *   **Risk:** If the student skips this and goes straight to detection, they risk flagging benign creative reuse as "error," which scientists will rightly ignore.

  **2. Why (b) is Second (The "How To" Problem)**
  Once you have established that *some* bleed is damaging (from step 1), you need a way to identify it without reading every paper ever written.
  *   **Tractability:** This is the most feasible "product" for a 3-year thesis. The student can develop a set of **heuristic markers** rather than a formal algorithm. For example: "Does the borrowed term retain its boundary conditions?" "Is there a measurement protocol attached to the borrowed term, or is it purely descriptive?"
  *   **Leverage:** This gives scientists a checklist. It moves the conversation from "this is philosophically impure" to "this lacks operational closure."
  *   **Dependency:** This depends on (c). You need to know what "damage" looks like to tune the detector. If you detect bleed that turns out to be heuristically useful, your detector has a high false-positive rate and loses credibility.

  **3. Why (a) is Last (The "Essentialism Trap")**
  You explicitly noted a desire to avoid smuggling in essentialism. Formal mapping is the fastest way to violate that constraint.
  *   **Tractability:** Low. To formally map a "home domain," you must fix the meaning of the term in that domain. But technical terms drift even within their home domains (e.g., "stress" in materials science has evolved). Spending three years trying to define the "true" yield point is a philosophical quagmire that yields no empirical return.
  *   **Leverage:** Low. Scientists view formal semantic maps as external impositions. They operate on operational definitions, not philosophical maps. A map that says "Organization X is not Metal Y" is less useful than a warning that "Organization X cannot be tested like Metal Y."
  *   **Dependency:** This is downstream of everything. You only need a formal map if you've proven the bleed is harmful (c) and you have a way to spot it (b), and now you need to adjudicate a dispute. That is a rare edge case, not a research priority.

  ### Evidence That Would Shift the Ranking

  This ordering is contingent on what the student finds in the first 12 months. Here is what would force a reorder:

  **1. Evidence that would elevate (a) Formal Mapping:**
  If the student finds that the *primary* source of conflict is not methodological failure, but **incommensurability in collaboration**. If materials scientists and sociologists are trying to co-author models and cannot align their equations because their definitions of "stress" are mathematically incompatible, then formal mapping becomes urgent.
  *   *Signal:* Interdisciplinary grants failing specifically due to definition mismatches, not empirical failure.

  **2. Evidence that would elevate (b) Detection:**
  If the student finds that the damage (c) is already well-documented and agreed upon, but **ubiquitous**. If everyone agrees "resilience" is misused in ecology, but it keeps happening because there's no quick way to flag it in peer review, then detection becomes the bottleneck.
  *   *Signal:* High citation of "warning papers" that are ignored because the error is too subtle to catch in standard review.

  **3. Evidence that would demote (c) Normative Evaluation:**
  If the student finds that **successful theories rely on bleed**. If the most robust models in a field *require* intensional bleed to function (e.g., using fluid dynamics for traffic flow, knowing traffic isn't a fluid), then the normative project shifts from "policing error" to "managing fiction."
  *   *Signal:* High-performing models that explicitly violate home-domain constraints but predict accurately.

  ### Summary Advice for the Student

  Tell them to treat "intensional bleed" not as a semantic error, but as an **operational hazard**.

  Don't start by defining the terms (a). Start by finding a corpse (c). Find a case where a borrowed term led to a dead end, a failed prediction, or a wasted grant. Once you have the corpse, work backward to see what markers (b) were present in the text before the failure occurred.

  If they can produce a taxonomy of "Fatal Bleed" vs. "Productive Bleed" based on empirical outcomes, they will have more impact on scientific policing than a thousand papers on semantic mapping. The leverage lies in connecting language to **failure modes**, not to truth conditions.
