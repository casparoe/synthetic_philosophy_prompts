  1.  **Case 1 is the smoking gun:** She explicitly distinguishes the Indicative ("assertable," "informative," "revise around it") from the Counterfactual ("false," "nearest candidates"). She does not call the Indicative "true." This suggests a fundamental category difference, not just a modal base shift.
  2.  **Case 7 confirms the split:** Her refusal to assign probabilities to conditionals generally, despite assigning truth values to Counterfactuals (Case 1), implies she denies propositionhood to Indicatives (Adams/Edgington style) while retaining it for Counterfactuals.
  3.  **Case 1 "Candidates":** The plural "candidates" strongly points to Lewis (set of worlds) over Stalnaker (unique world), which dictates the False verdict on (v).

  **On the truth value of (iii):**
  She will say (iii) has a **determinate truth value (False)** that we cannot discover *epistemically*, but which is fixed by the causal structure and similarity metrics of the world. She called the Watchman CF "false" even though we were certain the watchman *did* start the fire (making the antecedent false). This shows she believes CFs have truth conditions independent of our knowledge of the antecedent's actual truth.

