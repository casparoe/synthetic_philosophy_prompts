answer: |-
  There is no single, canonical term in logic, sociology, or critical theory that captures this *exact* rhetorical configuration (where inclusion is reinterpreted as evidence of exclusion via the *cost* of entry). However, the move is a composite of several well-established concepts.

  The closest existing frameworks are:

  1.  **The Self-Sealing Argument (Logic/Philosophy):** A claim that is unfalsifiable because any evidence presented against it is reinterpreted as evidence for it. (e.g., "The system is biased." "But we funded X." "The fact that X had to fight to be funded proves the bias.")
  2.  **Hegemonic Capture (Political Theory):** Derived from Gramsci, this describes how a dominant ideology sets the "common sense" terms of debate. Marginalized ideas must translate themselves into the dominant language (e.g., quantification) to be heard. The *need* to translate is the evidence of hegemony.
  3.  **Legibility (James C. Scott):** In *Seeing Like a State*, Scott argues institutions only support what they can measure ("make legible"). The "elaborate forecasting models" you mention are tools of legibility. The critic is arguing that the *requirement* of legibility is itself the exclusionary mechanism.

  ### Relation to Established Tropes

  *   **Tokenism:** Tokenism focuses on the *outcome* (a superficially diverse group to ward off critique). Your scenario focuses on the *process* (the structural friction required to enter). Tokenism asks, "Is X present?" This critique asks, "What did X have to become to be allowed in?"
  *   **"The Exception Proves the Rule":** The original legal maxim (*exceptio probat regulam in casibus non exceptis*) means an exception confirms the rule exists in non-exceptional cases. The critic's move is a structural variation: **The *effort* required to create the exception proves the *rigidity* of the rule.**
  *   **Confirmation Bias:** Confirmation bias is a cognitive error in an *individual*. This rhetorical move is a *structural* critique. It is not necessarily a fallacy; the critic may be correctly identifying a systemic barrier. Calling it "confirmation bias" would dismiss the structural claim as a psychological error.

  ### Proposed Coinage: "The Epistemic Surcharge"

  Since no precise term exists, I propose: **The Epistemic Surcharge.**

  **Definition:** A structural dynamic wherein a system's inclusion of a non-conforming element is interpreted not as evidence of openness, but as proof of exclusionary bias, because the element was required to pay an additional "tax" of justificatory labor (e.g., complex modeling, translation into dominant metrics) to gain entry.

  **Boundary Conditions:**
  *   **Must involve a cost:** Mere exclusion is not a surcharge. There must be an included outlier.
  *   **Must involve epistemic labor:** The cost must be rhetorical, analytical, or conceptual (e.g., building a model), not just financial.
  *   **Interpretive flip:** The inclusion must be actively reinterpreted by the critic as confirmation of the barrier, rather than its removal.

  ### Confidence and Uncertainty

  **Confidence Level:** **85%**

  **Specific Distinction/Uncertainty:**
  I am least certain about the boundary between **"The Epistemic Surcharge"** and the concept of **"Co-optation"** within Critical Theory (specifically Frankfurt School or Žižekian ideology critique).
  *   **Co-optation** usually implies the system absorbs dissent to *neutralize* it (making it harmless).
  *   **The Epistemic Surcharge** implies the system absorbs dissent in a way that *reveals* its bias (making the bias visible).
  *   While distinct in theory, in practice, critics often use these interchangeably. There may be a niche term in **Critical University Studies** or **Science and Technology Studies (STS)** regarding "metric fixation" that captures this specifically, but it is not standardized across general discourse. I am confident no *common* English idiom exists, but a specialized sociological term may exist in a subfield I cannot definitively rule out without access to proprietary academic databases.
