answer: |-
  Your hypothesis is sharp, and your ceramics anecdote cuts right to the bone of the matter. You have correctly identified that the standard formulation of the puzzle (the "modal argument") often smuggles in assumptions about what determines a statue's identity that your teacher's splat disproves.

  Here is the diagnosis you asked for: what the fight is actually about, why the sides talk past each other, and whether progress is possible.

  ### 1. The Diagnosis: It is a fight about "Ontological Freedom"
  You asked if the fight is about whether something new can start existing just because people treat matter a certain way. **Yes.** But to be precise, it is a fight about **Grounding**.

  The core disagreement is not about the clay. Both sides agree the clay exists. The disagreement is about whether human intention and social practice have the metaphysical power to generate *new conditions of identity* on top of physical matter.

  *   **Side A (The Constitution View / Distinctness):** They argue that when an artist intends to make a statue, they create a new object that *rides on top of* the clay. This new object has its own rules (it cannot be squashed). Your ceramics example actually helps them if they refine their view: The "splat statue" survives the squashing *because the artistic intention redefined the statue's identity conditions*. For this side, human intention is **ontologically creative**. It carves new objects out of the world that weren't there before.
  *   **Side B (The Monist View / Identity):** They argue that human intention is **descriptively creative** but ontologically empty. You can *call* the splat a sculpture, but you haven't created a new *thing*. You've just applied a label to the clay. For this side, the world's inventory of objects is fixed by physics (atoms, molecules, lumps). "Statue" is a functional role the clay is playing, not a separate entity.

  So, you are right: the fight is about whether our concepts can change what *exists*, or only how we *talk* about what exists.

  ### 2. Why They Never Switch (The Theoretical Virtues Clash)
  You noted that nobody ever switches sides. This is because the debate isn't driven by evidence; it's driven by competing **theoretical virtues**. Each side is optimizing for a different philosophical value, and you cannot maximize both simultaneously.

  **Side A optimizes for Common Sense and Modal Logic.**
  *   **What they say:** "It makes sense to say the statue is destroyed if I squash it, even if the clay remains. Leibniz's Law (if $x=y$, they share all properties) demands they are different."
  *   **The Cost:** They must accept **Coincident Objects**. They have to say two distinct things (Statue and Lump) occupy the exact same space at the exact same time made of the exact same atoms. This violates the intuition that "two things can't be in one place."
  *   **Why they don't switch:** To switch, they would have to deny that statues can be destroyed while their matter survives, which feels like denying reality.

  **Side B optimizes for Parsimony and Physics.**
  *   **What they say:** "We shouldn't multiply entities beyond necessity. Physics says there is only clay here. To say there is also a 'statue' is magical thinking."
  *   **The Cost:** They must accept **Counter-Intuitive Identity**. They have to say that if you squash the statue, the statue *still exists* (because the clay exists), it's just no longer "statue-shaped." Or, they have to say the statue ceased to exist when the clay was squashed, which implies the clay also ceased to exist (since they are identical).
  *   **Why they don't switch:** To switch, they would have to accept "spooky" coincident objects, which feels like bad metaphysics.

  Your ceramics example exposes that Side B's "physicalist" intuition is actually vulnerable to social context. If the splat is the art, the "statue" *did* survive the squashing. This forces Side B to admit that "statue" isn't even a physical description, it's a status. But they still won't admit it's a separate *object*.

  ### 3. Is it a Verbal Fight?
  There is a serious diagnosis, championed by philosopher Eli Hirsch, that this is a case of **Quantifier Variance**.

  This theory suggests that Side A and Side B mean different things by the word "exists."
  *   Side A uses a "liberal" quantifier: "There exists an object" means "There is a coherent concept applied to matter."
  *   Side B uses a "restrictive" quantifier: "There exists an object" means "There is a bounded collection of atoms."

  If this is true, they aren't disagreeing about the world; they are disagreeing about language. They both agree on all the physical facts (the clay is here, the artist called it art, if you squash it the art continues/ends depending on rules). They just disagree on whether to use the word "object" for the art-status.

  **However,** most philosophers reject the idea that it is *merely* verbal. Why? Because the consequences spill over. If Side A is right, then there are literally twice as many things in the room as Side B thinks. That affects how we count, how we understand causation, and how we understand persistence. It's not just a dictionary dispute; it's a structural dispute about reality.

  ### 4. The Honest Answer on Progress
  Is the debate stuck for good? **Yes, but with a caveat.**

  It is stuck in the sense that there will never be a "knockout argument." There is no experiment you can run on the clay to see if there is one object or two. The disagreement is about the **framework** used to interpret the facts, not the facts themselves. As long as philosophers value "logical consistency with modal intuitions" (Side A) and "physicalist parsimony" (Side B) equally, the deadlock remains.

  **However, progress has happened in the following way:**
  We have moved from asking "Which side is right?" to "What do we lose if we pick a side?"

  1.  **We now know the price of admission.** We know that if you want to save the intuition that statues can be destroyed while clay survives, you must pay the price of accepting coincident objects. If you want to avoid coincident objects, you must pay the price of saying statues survive squashing (or that they are identical to clay).
  2.  **We have integrated Social Ontology.** Your ceramics insight is now part of the formal debate. Philosophers like Amie Thomasson argue that artifacts are "ontologically dependent" on human intentions. This is a middle ground: The statue isn't a separate physical substance (satisfying Side B), but it is a real object whose existence conditions are determined by social norms (satisfying Side A).

  **The Verdict:**
  The debate is **bedrock**. It rests on fundamental intuitions about what "existence" means that cannot be argued for without circularity.
  *   If you feel that "existence" is a property of the physical world independent of us, you will be a Monist (Side B).
  *   If you feel that "existence" includes the structures we impose on the world to make it intelligible, you will be a Constitutionalist (Side A).

  Your hypothesis is correct: the fight is about whether human treatment creates reality. But don't expect it to be solved. The only way to "win" is to explicitly state which theoretical virtue (Parsimony vs. Intuition) you are willing to sacrifice. Most philosophers eventually pick a side not because they proved the other wrong, but because one cost became too high for them to pay.
