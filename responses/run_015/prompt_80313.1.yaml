      *   *Limit Step:* "...and at a limit ordinal $\lambda$ set $x_\lambda = \sup \{ x_\alpha : \alpha < \lambda \}$, which exists because... every chain in P has an upper bound." -> **Major Error.** Zorn's Lemma hypothesis says every chain has an *upper bound*, not necessarily a *least upper bound* (supremum). An upper bound exists, but it might not be unique, and it might not be *the* supremum. To define the sequence by recursion, you need a specific value for $x_\lambda$. Just knowing *an* upper bound exists isn't enough to define a function $x_\lambda$ without making *another* choice.
      *   *The "Choice" at Limits:* The student implicitly assumes the upper bound is unique or canonical. It's not. To fix this, one usually needs to use AC *again* (or a well-ordering of $P$) to pick the upper bound at limit stages, or formulate the recursion differently (e.g., using a choice function on the set of upper bounds of chains).
      *   *Contradiction Argument:* "The sequence is strictly increasing... range is a chain... has an upper bound u... u = x_alpha for some alpha..." -> **Major Error.** This assumes the sequence stops or that the range is a set of size $|P|$. If the recursion goes on through all ordinals (as implied by the notation), the range is a proper class, which can't be a subset of $P$. If the recursion stops, *why* does it stop? The standard proof argues that the process must stop before exhausting the cardinality of $P$ (Hartogs number argument), otherwise you embed the ordinals into $P$, which is impossible. The student claims $u = x_\alpha$ for some $\alpha$, which assumes the sequence covers $P$ or terminates within $P$'s cardinality without justification.
      *   *Conclusion:* "Hence P has a maximal element." -> **Correct conclusion, flawed derivation.**

