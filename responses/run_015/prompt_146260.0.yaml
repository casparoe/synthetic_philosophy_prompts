answer: |-
  This is a sharp observation of a tension that sits at the heart of cause prioritization, particularly within the Effective Altruism (EA) framework. You have identified a reasoning pattern that functions as a **self-sealing heuristic**, often preventing novel interventions from ever passing the initial screen.

  There is no single, canonical Latin name for this specific fallacy in the philosophical literature, but it is widely recognized in economics and decision theory under a few overlapping labels. The most precise conceptual anchor is the **Efficient Market Hypothesis (EMH) applied to altruism**, often colloquially referred to as the **"No Low-Hanging Fruit" argument**. When used fallaciously as you describe, it functions as a form of **Status Quo Bias** disguised as epistemic humility, or an **Argument from Silence** regarding market actors.

  Here is a breakdown of the epistemic pattern, how to distinguish it from valid reasoning, and how to draw its boundaries.

  ### 1. Naming the Pattern

  While there isn't one standardized term, you will find this reasoning discussed under three main headers:

  *   **The Efficient Altruism Hypothesis:** This is the direct analogue to the financial Efficient Market Hypothesis. It posits that the "market" for doing good is sufficiently competitive and informed that all high-expected-value opportunities are already exploited. If an opportunity remains, the market has implicitly priced it as low-value or high-risk.
  *   **The Low-Hanging Fruit Objection:** The claim that obvious, tractable, important problems are solved first by governments, markets, or other philanthropists. Therefore, anything remaining must be high-hanging (intractable).
  *   **Adverse Selection (in Cause Space):** This is the economic term you mentioned. It suggests that the "causes" available for new entrants are the ones that previous actors selected *against*.

  However, when this reasoning is used to dismiss a proposal *without identifying a specific mechanism* for the neglect, it crosses into a fallacy best described as **The Intractability Inference from Neglect**.

  ### 2. Distinguishing from Valid Bayesian Updating

  You asked how to distinguish this from a legitimate Bayesian update on others' private information. The distinction lies in the **priors regarding actor competence and incentives.**

  **Valid Bayesian Update:**
  *   **Premise:** "Actor X is rational, well-informed, and incentivized to solve Problem Y."
  *   **Observation:** "Actor X has not solved Problem Y."
  *   **Inference:** "There is likely a hidden constraint (technical or institutional) preventing X from solving Y."
  *   **Requirement:** You must have evidence that Actor X *should* have acted if the opportunity were real. (e.g., "Governments spend billions on heart disease; they haven't funded this specific cheap diagnostic. Why?")

  **The Fallacious Pattern (The Self-Sealing Move):**
  *   **Premise:** "The aggregate of all actors represents a rational optimizer."
  *   **Observation:** "No one has solved Problem Y."
  *   **Inference:** "Problem Y is intractable."
  *   **Failure:** This assumes **omnicompetence** of the status quo. It ignores **coordination failures**, **misaligned incentives**, and **information asymmetries**.
      *   *Example:* A regulatory fix might be tractable but neglected because the benefits are diffuse (public good) while the costs are concentrated (industry lobbying). The "market" didn't miss it because it was hard; it missed it because the incentives were broken. Inferring "intractability" from this is an error.

  ### 3. Distinguishing from Adverse Selection

  Adverse selection is a valid concern, but it is often misapplied to create the circularity you noted.

  *   **Valid Adverse Selection:** "The causes remaining are the ones others rejected. Therefore, the *average* quality of remaining causes is lower than the *average* quality of all causes." (This is statistically true).
  *   **The Fallacy:** "Therefore, *this specific* cause is low quality."
  *   **The Missing Variable:** **Comparative Advantage.** Even if a cause was rejected by others (adverse selection), it might be tractable *for you* due to unique capabilities, risk tolerance, or time horizons.
      *   *Example:* A long-termist project might be neglected by governments (short election cycles) and corporations (quarterly returns). Adverse selection says "others rejected this." But that rejection signal is noise regarding *your* tractability if you have a 100-year time horizon. Treating their rejection as evidence of intrinsic difficulty is an **ecological fallacy**.

  ### 4. Addressing the Circularity (The "Heads I Win, Tails You Lose" Structure)

  You identified the core frustration:
  1.  **If adopted:** "It's not neglected, so low priority."
  2.  **If neglected:** "It's probably intractable, so low priority."

  This is a **Motivated Stopping Rule**. It creates a **Pareto-Optimality Presupposition**: it assumes the current allocation of resources is locally optimal. If you assume the world is already optimized, *no* intervention can pass the ITN test.

  This is not a feature of the ITN framework; it is a misuse of it. The ITN framework is designed to find **inefficiencies**. If you use the *existence* of the inefficiency (neglect) as proof that it *cannot be fixed* (intractability), you have rendered the framework useless.

  ### 5. Drawing Boundaries: The "Mechanism Test"

  To prevent this reasoning from becoming a conversation-stopper, you can apply a strict boundary condition. You should distinguish between **Neglect as a Signal** vs. **Neglect as a Verdict**.

  **The Rule:** Neglect is a *signal to investigate the cause of neglect*, not a *verdict on tractability*.

  You can classify the reasoning into two buckets:

  **A. Epistemically Responsible Skepticism (Valid)**
  *   "This looks tractable and neglected. However, given that capable actors haven't done it, we must hypothesize *why* before proceeding."
  *   **Action:** Search for the **Causal Story of Neglect**.
      *   Is it an information gap? (We know something they don't).
      *   Is it a coordination failure? (Requires collective action).
      *   Is it an incentive mismatch? (Benefits are public, costs are private).
      *   Is it a value difference? (They don't care about this outcome as much as we do).
  *   *If you find a mechanism:* The tractability score remains high (the blocker is solvable).
  *   *If you find no mechanism:* Only *then* do you downgrade tractability based on the "hidden difficulty" prior.

  **B. The Self-Sealing Heuristic (Invalid)**
  *   "This looks tractable and neglected. Because it is neglected, there must be a hidden difficulty."
  *   **Action:** Downgrade tractability immediately without identifying the blocker.
  *   **Why it fails:** It treats the *absence of evidence* (of people working on it) as *evidence of absence* (of tractability), without accounting for systematic blind spots in the "market" of altruism.

  ### Summary for Your Exercises

  When you encounter this move in prioritization discussions, you can name it as an **unwarranted application of the Efficient Market Hypothesis**.

  To resolve it, insist on the **Mechanism Requirement**:
  > "We can treat neglect as evidence of hidden difficulty *only if* we assume the actors ignoring this cause are rational, informed, and aligned with our goals. If we can identify a reason why they are *not* (e.g., short-termism, coordination problems, value divergence), then the neglect does not downgrade tractability. Without a specific hypothesis for the blocker, we cannot use neglect to infer intractability."

  This breaks the circularity. It allows for the possibility that the world is *not* efficient (allowing high ITN scores) while maintaining epistemic humility (requiring a story for *why* the inefficiency exists).
