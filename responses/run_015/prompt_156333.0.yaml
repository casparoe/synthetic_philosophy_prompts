  2.  **Deconstruct the Legal/Logical Problems:**

      *   **The Paradox of Sovereignty:** The members are the sovereign body. They can change the rules. If they can change the rules, they can change the rule that says "you can't change this rule." Therefore, absolute entrenchment is logically impossible within a self-governing body unless the body ceases to be self-governing (e.g., hands power to an external court).
