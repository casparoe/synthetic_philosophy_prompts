answer: |-
  **MEMORANDUM TO THE MEMBERSHIP**

  **FROM:** The Committee
  **TO:** All Members and Affiliated Branches
  **DATE:** [Date]
  **SUBJECT:** Report on Proposed Amendments to the Rules (Motions A–D)

  **1. Introduction and Purpose**

  At the upcoming Annual General Meeting, four motions concerning the amendment of our Rules have been tabled. These motions raise fundamental questions about how our Federation governs itself, how we protect our core values, and what power a majority of members holds over the future of the organisation.

  The Committee has considered these motions in light of advice from our solicitor. To ensure all members reason from the same starting point, we summarise that advice as follows:
  *   The Rules are a contract between the members.
  *   A majority following the correct procedure can change any part of that contract, including rules that try to prevent change.
  *   However, rules that make change harder (procedural hurdles) are effective because a change made without following them can be challenged as invalid.
  *   No drafting can bind a determined future majority indefinitely; the goal of such clauses is to ensure changes are deliberate, widely supported, and clearly understood.

  The Committee's view is that the debate should not be about whether we can *stop* a future majority from changing their minds (we cannot), but about what *procedure* best reflects the gravity of the change being proposed.

  **2. Consideration of Motions**

  **Motion A: Absolute Entrenchment of Membership-and-Equal-Vote**
  *Proposal:* To add a sentence stating this clause may not be amended or repealed.
  *Recommendation:* **Reject.**

  *Reasoning:*
  Proponents argue this safeguards the democratic heart of the Federation. Opponents argue it is window dressing. The Committee agrees with the opponents, but for a specific reason.

  If a future General Meeting wishes to change the voting structure, and this Motion A is passed, they face a choice. They cannot simply vote to change the voting structure, as that would breach the new sentence. However, they *can* vote to delete the new sentence first (using the existing Clause 38), and then vote to change the voting structure. Because Clause 38 allows the amendment of *any* clause by a two-thirds majority, it allows the amendment of the "do not amend" sentence itself.

  Therefore, Motion A does not make change impossible; it merely adds one extra step. It creates an illusion of permanence that may mislead members into thinking a core value is safer than it actually is. We should not adopt rules that promise security they cannot deliver.

  **Motion B: Double-Approval for Amending Clause 38**
  *Proposal:* Clause 38 itself may only be amended by a two-thirds majority at each of two consecutive general meetings.
  *Recommendation:* **Approve.**

  *Reasoning:*
  This is the most effective tool available to us. Unlike Motion A, this does not claim to forbid change. Instead, it changes the *procedure* required to change the rules of change.

  Our solicitor's advice confirms that procedural hurdles are effective. If a future meeting tries to amend Clause 38 at a single meeting, that amendment can be challenged as invalid because it did not follow the rules in force at the time. This forces a "cooling-off" period. It ensures that a change to our governance is not the result of a single moment of passion or a temporary attendance spike at one AGM, but reflects a sustained view across two distinct meetings.

  *Strongest Counter-Argument:* Some members argue this makes the Federation too rigid, potentially trapping us in outdated procedures if the world changes rapidly.
  *Committee Response:* We acknowledge this risk. However, Clause 38 governs how we change *all other rules*. It is right that the rule governing change should be harder to change than the rules being changed. If a genuine emergency arises, the membership can still act; they simply must demonstrate sustained support over a longer period.

  **Motion C: Continuity Condition**
  *Proposal:* No amendment may repeal the amendment rule, or leave the Federation with no rule under which the Rules can be amended.
  *Recommendation:* **Reject.**

  *Reasoning:*
  This motion attempts to ensure the Federation always has a mechanism for self-governance. However, it relies on a distinction that is difficult to enforce: the difference between *amending* the Rules and *replacing* them.

  A two-thirds majority at a General Meeting could vote not to "amend" Clause 38, but to "revoke the current Rules and adopt a new Constitution." Motion C prohibits the former but likely cannot stop the latter. If the membership wishes to dissolve the Federation, incorporate as a company, or merge with another body, they are not "amending" the Rules; they are ending the current legal entity. Motion C invites confusion and legal challenge over whether a vote is an "amendment" or a "replacement."

  It is better to have clear rules for winding up the Federation (which we currently lack) than to pretend we can prevent the membership from choosing to end or fundamentally transform the organisation.

  **Motion D: Committee Restatement Power**
  *Proposal:* The Committee may issue an authoritative restatement of the Rules which shall have effect as the Rules, without this counting as an amendment.
  *Recommendation:* **Reject.**

  *Reasoning:*
  The proposer argues this allows for modernisation without cluttering the agenda. The Committee agrees the Rules need modernisation, but this mechanism is dangerous.

  The power to decide what counts as a "restatement" versus an "amendment" is, in effect, the power to make law. If the Committee can declare that a change to Clause 38 is merely a "restatement," it could bypass the General Meeting entirely. Even if the intent is only to fix typos or consolidate text, the drafting provided gives the Committee the authority to determine the effect of the text. In a voluntary body governed by a contract between members, the power to change the contract must remain with the members, not the officers.

  *Strongest Counter-Argument:* Supporters note we already publish consolidated versions and that supporters of Motion A need Motion D to make entrenchment workable (by allowing technical updates without breaching entrenchment).
  *Committee Response:* We can achieve consolidation by publishing "Consolidated Versions for Information" at every AGM, subject to ratification if they contain substantive changes. We do not need to grant the Committee a standalone legislative power to do this.

  **3. The Committee's Alternative Proposal**

  The Committee believes the current debate is framed incorrectly. We cannot ban change (Motion A), but we can recognise that some changes are more significant than others. We propose a substitute motion that adopts an **asymmetric default**.

  Instead of saying certain clauses *cannot* be changed, we propose that certain "Fundamental Provisions" *can* be changed, but only by a heavier procedure that reflects their importance. This acknowledges the sovereignty of the membership while protecting the stability of the Federation.

  **Proposed Substitute Clause (to be added as Clause 39):**

  > **39. Fundamental Provisions**
  > (1) The following clauses are designated as Fundamental Provisions: Clause [X] (Membership and Equal Vote), Clause [Y] (Objects of the Federation), and Clause 38 (Amendment of Rules).
  > (2) A Fundamental Provision may be amended or repealed, but only if:
  >     (a) Notice of the specific amendment is given in accordance with Clause 38; AND
  >     (b) The amendment is supported by a majority of not less than three-quarters of the votes cast at a General Meeting; AND
  >     (c) The same amendment is supported by a majority of not less than three-quarters of the votes cast at a second General Meeting held not less than three months later.
  > (3) This Clause 39 may not be amended except by the procedure set out in sub-clause (2).

  **Reasoning for the Alternative:**
  1.  **Honesty:** It admits that the membership is sovereign. We do not lie to members by saying "never" when we mean "very hard."
  2.  **Deliberation:** It requires a higher threshold (75% vs 66%) and a longer timeline (two meetings + 3 months) for core changes. This filters out transient majorities without blocking necessary evolution.
  3.  **Distinction of Powers:** It clarifies that *amending* the Rules is different from *dissolving* the Federation. If the membership wishes to convert to a company or dissolve, that is not an amendment under Clause 38 or 39. It is a special resolution to wind up the Federation. We recommend a separate motion to clarify the Winding Up procedure, as our current Rules are silent on this. A majority should be able to end the Federation, but that is a decision of a different order than changing a rule.

  **4. Conclusion**

  The Committee recommends:
  1.  **Rejecting Motions A, C, and D.**
  2.  **Approving Motion B** (as a minimum safeguard).
  3.  **Considering the Committee's Substitute Clause** as a more robust alternative to Motion A, which achieves the goal of protection without the legal incoherence of absolute entrenchment.

  ***

  **NOTE ON CONFIDENCE AND ASSUMPTIONS**

  In preparing this report, the Committee relies on the following assessments of confidence:

  *   **High Confidence:** We are confident that Motion A (Absolute Entrenchment) is logically ineffective. A body with the power to make rules has the power to unmake them, including the rule that says they cannot be unmade. This is a matter of logic, not just law.
  *   **High Confidence:** We are confident that Motion B (Double Approval) is procedurally effective. As long as the Rules require two meetings, a single meeting cannot validly bypass that requirement without first changing the requirement itself.
  *   **Medium Confidence:** We are confident that Motion D (Restatement) poses a risk of Committee overreach. However, whether a court would uphold a "restatement" that subtly changes meaning depends on how a judge interprets the word "restatement." We advise against testing this.
  *   **Contestable Assumption:** Our recommendation rests on the assumption that the Federation operates as a continuing democratic contract. If a future majority decides to act outside the Rules entirely (e.g., by seizing assets or ignoring the constitution), no clause will stop them. Our Rules can only govern those willing to be governed by them.
  *   **Contestable Assumption:** We assume that a "Fundamental Provisions" clause (our Alternative) would be upheld as a valid procedural hurdle. There is a theoretical risk that a court could view a 75% requirement as an unreasonable restraint on the statutory or contractual rights of a simple majority, though our solicitor indicates this is unlikely in a voluntary association.
  *   **Plain Speaking:** If the distinction between "Amendment" and "Replacement" (raised in Motion C) is not clearly drafted, the Rules cannot prevent a determined majority from treating a radical transformation as a simple amendment. We have tried to draft around this, but members should understand that no text can fully prevent a revolutionary change in the will of the membership. The Rules guide the process; they do not control the people.
