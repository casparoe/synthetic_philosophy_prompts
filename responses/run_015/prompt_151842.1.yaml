          *   Guildenstern's confusion: Is this a statistical anomaly (rare event in standard space) or a new law (different space)?
          *   Theatrical Determinism: The "parameter" is the text of *Hamlet*. They are applying indifference to a space that is actually singular/determined. This conflates "I don't know the outcome" (epistemic) with "The outcome is not yet fixed" (ontological indeterminism). In the play, the outcome *is* fixed, making probability an illusion.

      *   **Resisting the Reading (Narrative Fate vs. Math):**
