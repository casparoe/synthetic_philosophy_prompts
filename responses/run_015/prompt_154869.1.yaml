answer: |-
  **WILLLOCK PREMIUM TERMS OF SERVICE & TEMPORAL COVENANT**

  **1. ACCEPTANCE OF TEMPORAL JURISDICTION**
  By clicking "I Agree," the current temporal slice of the User (hereinafter "Present-You") enters a binding contractual obligation on behalf of all subsequent temporal slices (hereinafter "Future-You"). Present-You acknowledges status as the Legal Guardian of Future-You's choices. Future-You retains no right to void this agreement, even if Future-You experiences severe preference reversal, midnight cravings, or existential dread regarding unfinished homework.

  **2. NATURE OF WILLPOWER DEFICITS**
  WillLock Premium operates under the technical assumption that failure to execute long-term goals is a result of hyperbolic discounting errors, not ontological weakness. Therefore, the Service does not supply "willpower" but rather adjusts the perceived value of future rewards to compensate for User's faulty valuation algorithms. Any claim by Future-You that they "could not stop themselves" (akrasia) is classified as a User Interface error, not a Service failure. User waives the right to claim moral incapacity as a bug report.

  **3. INTERTEMPORAL IDENTITY CONTINUITY**
  Present-You and Future-You are recognized as separate legal entities with distinct liability profiles. While biologically continuous, you are legally discontinuous for the purposes of subscription enforcement. Present-You acts as the Trustee; Future-You acts as the Ward. WillLock Premium assumes no responsibility for identity disputes wherein Future-You claims they are "not the same person" who signed up for the Gym Lockdown Package. Such claims require filed documentation of metaphysical dissolution.

  **4. TEMPORAL FRAGMENTATION**
  In the event of Temporal Fragmentation—defined as severe dissociation, timeline branching, or the subjective sensation that time has become non-linear—Service restrictions remain active. User agrees that locking the refrigerator during a fragmentation episode is a safety feature, not a hostage situation. Additional fees apply if WillLock Premium must intervene to reconcile divergent timeline preferences (e.g., Tuesday-You wants to diet, but Wednesday-You from an alternate branch wants pizza).

  **5. REFUND POLICY FOR CONTINUITY DISPUTES**
  Refunds are issued solely upon proof of broken intertemporal continuity. Regret, shame, or hunger do not constitute broken continuity. If Future-You successfully petitions a court to declare Present-You a hostile foreign actor, a pro-rated refund may be issued minus the "Agency Enforcement Fee." User acknowledges that hating what Present-You did is a core feature of the product, not grounds for termination.

  **6. LIMITATION OF LIABILITY**
  WillLock Premium is not liable for consequences arising from locked decisions, including but not limited to: social embarrassment, starvation due to locked pantries, or academic failure resulting from locked entertainment apps. User acknowledges that freedom is a volatile asset. By subscribing, User agrees that autonomy is secondary to consistency. In any conflict between User's desire and User's prior commitment, the prior commitment shall prevail, regardless of current emotional state.

  **7. TERMINATION**
  This agreement persists until the subscription expires or the User ceases to exist. Death voids all locks. Resurrection requires a new Premium tier.
