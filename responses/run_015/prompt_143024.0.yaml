answer: |-
  Here is the analysis you requested. I will commit to specific readings and judgments rather than surveying the literature.

  ### Part 1: A Menu of Theses for "Greedy Reductionism"

  The phrase comes from Daniel Dennett, but it has drifted into general philosophical slang. Here are three distinct theses it could be expressing, arranged from trivial to radical.

  **1. The Methodological Thesis (Premature Closure)**
  *   **The Claim:** A reduction is greedy if it attempts to explain a higher-level phenomenon *directly* in terms of the lowest level (physics) while ignoring the indispensable intermediate levels (neuroscience, psychology, sociology).
  *   **Status:** This is a substantive and defensible charge, but it is **not true of every reduction worth the name**. Good reductionism often bridges levels (e.g., thermodynamics to statistical mechanics). Greedy reductionism tries to skip the bridge.
  *   **Coherence:** Coherent. It criticizes the *strategy* of explanation, not the *truth* of physicalism.

  **2. The Eliminative Thesis (Ontological Erasure)**
  *   **The Claim:** A reduction is greedy if it concludes that because $X$ is made of $Y$, $X$ does not *really* exist (only $Y$ exists). It claims the lower level usurps the existence of the higher level.
  *   **Status:** This is **false of most successful reductions**. We do not say tables don't exist because they are atoms; we say tables *are* atoms arranged table-wise. If "greedy reductionism" means eliminativism, it is a specific ontological stance, not a necessary feature of reduction.
  *   **Coherence:** Coherent, but controversial. Many philosophers (including Dennett) argue this is a mistake. Patterns are real even if they are constituted by lower-level parts.

  **3. The Normative Thesis (Explanatory Blackmail)**
  *   **The Claim:** A reduction is greedy if it uses the lower-level description to invalidate the *normative practices* (blame, praise, deliberation) that depend on the higher-level description, while continuing to rely on those practices implicitly.
  *   **Status:** This is the **radical** reading. It asserts that you cannot have it both ways: you cannot say "choice is an illusion" and then hold people responsible. If you reduce choice to computation but keep talking about "decisions," you are being greedy with the concept of choice.
  *   **Coherence:** This is the most potent version. It collapses into incoherence only if the speaker is a consistent eliminativist who refuses to use normative language at all.

  ### Part 2: Did the Accusation Land in Your Debate?

  I judge that the accusation **did not land logically, but it landed rhetorically.**

  Here is why: The first speaker argued that agency is neural computation and the feeling of freedom is a tracking mechanism. This is a *compatibilist* or *illusionist* stance.
  *   If the speaker meant agency is *real* but physical (compatibilism), the charge of greedy reductionism is **false**. They are not reducing agency *away*; they are reducing it *to* something else.
  *   If the speaker meant agency is an *illusion* (illusionism), the charge is **substantive**. They are claiming the lower level (physics) explains why we *think* we have agency, thereby removing the need for actual agency.

  The room treated the reply as a point scored because most people intuitively feel that "nothing but neural computation" threatens the reality of choice. However, simply shouting "greedy reductionism" is not an argument; it is a label. For the point to truly land, the second speaker needed to add: *"If agency is just computation, you cannot account for the normative force of deliberation. You are borrowing the authority of 'choice' while denying its existence."* Without that extra step, the slogan is just a way of saying, "I don't like that explanation."

  **Verdict:** The accusation only works if you accept the **Normative Thesis (3)** from the menu above. If you accept that higher-level patterns (like "agency") are real patterns despite being physical, the accusation fails.

  ### Part 3: Judging Your Test

  Your test: *A reduction is greedy only if the reducing story cannot be re-employed in the other places where the reduced notion was successfully doing work.*

  **I recommend you keep this test.** It is excellent.

  1.  **Does it track anything real?** Yes. It tracks the distinction between *eliminative reductionism* (which fails your test) and *integrative reductionism* (which passes it). If I reduce "heat" to "mean kinetic energy," I can still use "heat" in cooking and engineering. That reduction is well-fed. If I reduce "belief" to "neural firing" and then say we can no longer predict behavior using beliefs, that reduction is greedy.
  2.  **What kind of fault is greed?** On your test, greed is a fault in **utility**, which implies a fault in **ontology**. If a concept stops working in the contexts where it was essential, it suggests the reduction has failed to capture the *reality* of the thing, not just the word. It suggests the reductionist has explained away the *phenomenon* rather than the *nature* of the phenomenon.
  3.  **Confidence:** I am **confident** this aligns with Dennett's own view. He argues that higher-level patterns (like beliefs or agency) are "real patterns" if they allow for successful prediction and explanation. If the reduction destroys that predictive power, it is bad science (greedy).

  ### Part 4: The Symmetry Worry

  You asked: *Is there a mirror-image vice (greedy anti-reductionism), and do the slogans retain content?*

  **Yes, there is a mirror image.**
  "Greedy anti-reductionism" is the insistence that a higher-level phenomenon *cannot* be explained by lower levels, often positing a "skyhook" (a miraculous or unexplained lever) to keep it afloat. Vitalism (life requires a special "force") is the classic example. It is "greedy" because it demands explanatory privilege for the higher level without paying the cost of connecting it to the rest of reality.

  **Do the slogans retain content?**
  Yes, but **only within a naturalist framework.**
  *   If you believe the universe is fundamentally physical, then "greedy reductionism" warns you not to lose the forest for the trees, and "skyhook" warns you not to invent magic to save the forest.
  *   If you are a dualist (mind is not physical), then *all* reductionism looks greedy to you, and *all* talk of cranes looks insufficient.

  **My Commitment:** The vocabulary is **not empty**, but it is **loaded**. It presupposes that the world is one thing (naturalism) that can be described at many levels. If you accept that presupposition, the terms do real work: "Greedy reductionism" identifies explanations that are *too simple to be true* (they lose data), and "Skyhook" identifies explanations that are *too complex to be true* (they add magic).

  ### Summary of Commitments

  1.  **Meaning:** Adopt the **Normative Thesis**. Greedy reductionism is not just reducing $X$ to $Y$; it is reducing $X$ to $Y$ in a way that makes our essential practices regarding $X$ (blame, deliberation) unintelligible.
  2.  **The Debate:** The accusation was **rhetorically effective but logically incomplete**. It relied on the audience assuming agency cannot be computational. It did not prove the first speaker wrong; it only highlighted the cost of their view.
  3.  **Your Test:** **Keep it.** It correctly identifies that a successful ontology must preserve the utility of the concepts it reduces. Greed is a pragmatic failure that reveals an ontological error.
  4.  **Symmetry:** The terms have content, but they are **weapons for naturalists**. They police the boundary between "emergent complexity" (cranes) and "magic" (skyhooks), and between "real patterns" (well-fed) and "elimination" (greedy).

  **Confidence Markers:**
  *   **Confident:** Dennett's definition of "Real Patterns" supports your test. The existence of "greedy anti-reductionism" (vitalism/mysterianism) is historically settled.
  *   **Judgment Call:** Whether the accusation "landed" in your specific debate depends on the unspoken premises of your society. I judge they presuppose agency requires non-physics, which is why the slogan worked.
  *   **What would change my mind:** If you can show a case where a reduction *failed* your test (destroyed utility) but was still scientifically accepted as true (e.g., if quantum mechanics made "solidity" unusable but we kept it), then your test would need refinement. Currently, I do not think such a case exists.
