      *   *On the User's Test:* I should validate this. It aligns with Dennett's "Real Patterns" view. It's a pragmatic test for ontology.
      *   *On the Debate:* I should be honest. The reply "That's greedy reductionism" is a slogan, not an argument. It only works if the audience already values the higher-level description (agency) as *real* and not just *illusory*. If the audience thinks agency *must* be non-physical to be real, the charge sticks. If they think agency can be physical, it doesn't. Given the room "scored a point," they likely presuppose agency needs more than computation.
