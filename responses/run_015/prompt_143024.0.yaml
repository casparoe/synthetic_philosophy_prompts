  2.  **Deconstruct "Greedy Reductionism":**
      *   *Origin:* Daniel Dennett, *Darwin's Dangerous Idea*.
      *   *Standard Meaning:* It's not reduction *per se* that's bad, but reduction that denies the existence or causal efficacy of the higher-level phenomenon *prematurely* or *eliminatively* when a functional explanation is still needed. It's "greedy" because it wants to claim *all* the explanatory credit for the lower level, leaving nothing for the higher level.
      *   *The Debate Context:* Speaker A: Agency is just neural computation; feeling of freedom is an illusion/tracking. Speaker B: That's greedy reductionism.
      *   *The Problem:* If reductionism is true, is it *greedy*? Or is "greedy reductionism" just a slur for "reductionism I dislike"?

  3.  **Drafting the Menu (Theses of Greedy Reductionism):**
      *   *Level 1 (Trivial):* Reductionism that is false. (Too easy).
      *   *Level 2 (Methodological):* Reductionism that skips levels of explanation needed for practical understanding. (e.g., explaining chess by physics).
      *   *Level 3 (Eliminative):* Reductionism that claims the higher-level thing *does not exist* (eliminativism) rather than *is constituted by* the lower-level thing.
      *   *Level 4 (Explanatory Blackmail):* Reductionism that claims because X is made of Y, Y explains everything about X, including normative features (blame, meaning) which Y cannot support.

  4.  **Evaluating the Menu:**
      *   *Level 1:* Trivial. Not a specific charge.
      *   *Level 2:* Substantive. Good for science, maybe not ontology.
      *   *Level 3:* Substantive. This is usually what people mean.
      *   *Level 4:* The "Defective" charge. If agency is needed for blame, and physics doesn't support blame, reducing agency to physics destroys blame. If you keep blame but deny the ground for it, that's greedy.

  5.  **Addressing the Debate Context:**
