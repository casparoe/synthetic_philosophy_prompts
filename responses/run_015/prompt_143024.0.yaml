      *   *My Commitment:* The charge likely *didn't* land logically, but it *did* land rhetorically. Why? Because "greedy reductionism" is often used to protect normative practices. But strictly speaking, calling something "greedy reductionism" isn't an argument unless you show *what* is being greedily explained away that *must* remain.

  6.  **Evaluating the User's Test:**
      *   *User's Test:* Reduction is greedy if it can't re-employ the reduced notion in law/psychology/etc. If it lets you keep using "belief/choice," it's "well-fed."
      *   *Analysis:* This is actually very close to Dennett's own view (Instrumentalism/Compatibilism). Dennett hates *eliminative* reductionism but loves *non-greedy* reductionism.
      *   *Verdict:* This is a *good* test. It tracks the distinction between *elimination* vs. *integration*. It makes greed a fault in *utility/pragmatics*, not just ontology.
      *   *Refinement:* It's not just about "using" the word, but whether the *normative force* survives. Can you blame someone if they are just neurons? If yes, well-fed. If no, but you still blame, then greedy.

  7.  **Evaluating the Symmetry Worry:**
      *   *Worry:* Is there "greedy anti-reductionism"? (Refusing to look for lower-level mechanisms).
      *   *Analysis:* Yes. Vitalism is greedy anti-reductionism (life force is magic). Dualism can be.
      *   *Do slogans retain content?* Yes, but they are weaponized. "Greedy reductionism" attacks those who destroy useful higher-level patterns. "Skyhook" attacks those who refuse to build from the bottom.
      *   *Verdict:* The vocabulary works, but only if you accept that *both* levels (physical and functional) are real. If you are a hard physicalist, anti-reductionism is always wrong. If you are a dualist, reductionism is always wrong. The terms assume a naturalist framework.

  8.  **Synthesizing and Committing:**
