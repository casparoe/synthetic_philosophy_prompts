          *   *Audience:* Multi-layered.
              1.  *External (Primary):* USSR (deterrence/capability).
              2.  *External (Secondary):* Non-aligned nations (ideological appeal).
              3.  *Internal:* Taxpayers/Congress (legitimacy/funding).
