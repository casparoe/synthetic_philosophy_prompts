  7.  **Final Polish:** Ensure the voices sound distinct. The bacteriologist should sound pragmatic/skeptical of theory. The ornithologist should sound worried about bureaucracy. The philosophers should sound precise.

      *(Self-Correction during drafting)*: Make sure the "Windowed Cohesion" doesn't sound like just "temporal slicing." It needs to be about *process* visibility. Also, ensure the conservation angle is highlighted since the user mentioned it specifically.

      *Refining the "Dreaded Question":* It should be the one that exposes the regulatory nightmare. If a species is only a species at a 100-year window, but the law requires a static list, how do you write the regulation?

