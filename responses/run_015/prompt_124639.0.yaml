prompt: |-
  hey — I've got a 20 minute talk next month and then a 40 minute q&a, and the q&a is the part I'm actually nervous about. The room is a joint session: mostly bacterial genome taxonomists (the kind who cluster genomes by average nucleotide identity and think "species" is a filing convention for prokaryotes that horizontal transfer makes a joke of), four or five mycologists who spend their lives with fungi whose sexual and asexual stages historically got names of their own, three museum ornithologists who care about type specimens and about names not turning over every decade, and two philosophers of biology — one a fairly committed pluralist, one who holds that species are individuals/lineages rather than kinds.

  The thesis I'm defending is what I've been calling windowed cohesion: a species taxon is real, but only relative to a cohesion window — you fix a timescale (how many generations you're asking about) and a tolerance for gene flow and ecological drift, and only then does "is this one species or two?" have an answer, so the same group of organisms can genuinely be one species at a decadal window and several at a millenial one. I want to argue that isn't a defect: it's why pluralism is right, and why conservation law should index its units to a management horizon instead of pretending to carve nature at a joint. The argument leans on two cases — obligately asexual lineages where cohesion is basically shared descent plus shared niche, and a ring-species-ish case where gene flow is fine locally around the ring but not globally.

  So: draft me the prep sheet. Eight or so objections, in the order they'll actually come, each phrased the way that particular person would put it, with who's raising it, how much damage it does, a two-minute-ish reply, and a note on where the reply is soft. Also what I should concede up front before anyone asks, and the one question I'm hoping nobody asks. No references needed, I've read the stuff. And flag how confident you are in each call — especially which one you're least sure I'll really get.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **Task:** Create a prep sheet for a 20-minute talk + 40-minute Q&A.
      *   **Topic:** "Windowed Cohesion" theory of species (species are real relative to a timescale/cohesion window).
      *   **Audience:** Mixed bag: Bacterial genome taxonomists (ANI, HGT skeptics of species), Mycologists (dual nomenclature, complex life cycles), Museum Ornithologists (type specimens, stability), Philosophers of Biology (Pluralist vs. Individual/Lineage).
      *   **Thesis:** Species taxa are real but relative to a cohesion window (timescale + tolerance). Pluralism is a feature, not a bug. Conservation law should index units to management horizons.
      *   **Cases:** Obligate asexuals (descent + niche), Ring species (local vs. global gene flow).
      *   **Deliverables:** ~8 objections (ordered by likelihood), phrased by specific audience members, damage assessment, 2-min reply, soft spots, upfront concessions, the "dreaded question," and confidence flags.
      *   **Tone:** Professional, strategic, realistic, slightly informal (as requested: "hey", "draft me").

  2.  **Deconstruct the Audience & Their Likely Grievances:**
      *   *Bacterial Taxonomists:* Think species are arbitrary bins. HGT makes tree-thinking hard. ANI is the gold standard. They will hate "timescale" if it implies vertical descent is primary.
      *   *Mycologists:* Deal with pleomorphy (one fungus, two names). Practical identification matters. They might like the flexibility but worry about stability.
      *   *Ornithologists:* Care about stability for laws (ESA, etc.). Type specimens are anchors. They will hate the idea that a species name changes validity based on the "window."
      *   *Philosopher (Pluralist):* Likely an ally, but might push on *why* pluralism is metaphysically acceptable.
      *   *Philosopher (Individual/Lineage):* The main adversary. Species are historical individuals, not classes/kinds defined by parameters. "Windowed" sounds like operationalism, not ontology.

  3.  **Brainstorming Objections (aiming for 8):**
      1.  *Ontological Status:* (Lineage Phil) You're making species into operational tools, not real things.
      2.  *Bacterial HGT:* (Bacteriologist) Cohesion via gene flow doesn't work for us. Is your window just empty for prokaryotes?
      3.  *Stability/Law:* (Ornithologist) Conservation law needs fixed units. You can't have a species be protected today and not tomorrow because we changed the window.
      4.  *The "Sharp Line" Problem:* (Pluralist Phil) If it's a window, where do you draw the edges? Isn't this just vagueness dressed up?
      5.  *Asexuals:* (Mycologist/Bacteriologist) You mentioned asexuals. If cohesion is gene flow, how do they fit? (Wait, user said they *will* argue asexuals via descent+niche). Let's make this about the *definition* of cohesion.
      6.  *Ring Species:* (General/Ornithologist) Ring species are the classic breakdown. Does your window just say "it depends"? That's trivial.
      7.  *Type Specimens:* (Ornithologist) Where does the type specimen sit in a windowed taxonomy?
      8.  *Predictive Power:* (Bacteriologist/Phil) If the category shifts, what predictions can I make about genotype/phenotype?

      *Refining the Order:* Q&A usually starts with clarifications, then moves to specific technical attacks, then broad philosophical hammering.
      1.  Clarification/Triviality (Phil Pluralist)
      2.  Bacterial/HGT challenge (Bacteriologist)
      3.  Conservation/Stability (Ornithologist)
      4.  Asexual Cohesion (Mycologist/Bacteriologist)
      5.  Ontological Reality vs. Operationalism (Phil Lineage)
      6.  Ring Species Specifics (Ornithologist/General)
      7.  Type Specimen Anchoring (Ornithologist)
      8.  The "So What?" / Predictive Power (Bacteriologist)

  4.  **Drafting the Content (Iterative refinement):**

      *   *Concessions:* Need to admit that this makes nomenclature harder. Need to admit that "window" selection isn't purely objective.
      *   *Dreaded Question:* Something that collapses the distinction between "windowed cohesion" and "just saying it's vague." Or a legal impossibility.
      *   *Confidence:* I need to be honest. The Philosophical Lineage objection is the hardest to deflect without conceding the main point.

  5.  **Fleshing out the Replies:**
      *   *Strategy:* Validate the concern, pivot to the "management horizon" utility, distinguish between *naming* (stable) and *unit definition* (functional).
      *   *Tone:* Respectful but firm on the core thesis.

  6.  **Review against Constraints:**
