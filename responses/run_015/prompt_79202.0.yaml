  # Project Proposal: The Localization Bottleneck in AI Debate

  **Applicant:** [Your Name]
  **Project Title:** Beyond Length: Empirical Limits of Flaw Localization in AI Safety Debate
  **Duration:** 6 Months

  ### The Core Question
  AI Debate proposes that two models can convince a human judge of truths beyond the judge's direct verification capacity (potentially scaling from NP to PSPACE). The prevailing objection is *obfuscation*: a dishonest model hides a false step within a argument too long for the honest model to dissect.

  This project tests a sharper hypothesis: **Length is not the binding constraint; localizability is.** The project seeks a determinate answer to: *Do there exist critical flaws in high-stakes domains (math, code, policy) that are irreducibly global, such that no short sub-claim reveals the error, or where the search cost to localize the flaw exceeds the debate turn budget?*

  If every flaw can be localized to a checkable sub-claim, Debate scales. If some flaws are inherently global or prohibitively expensive to locate, Debate has a hard ceiling regardless of judge competence or argument length.

  ### Why Obvious Replies Fail
  Standard counter-arguments do not address the localization bottleneck:
  *   **"Get a Better Judge":** If a flaw requires holding fifty steps in working memory simultaneously to detect a contradiction (a global flaw), a smarter judge still hits cognitive bandwidth limits. The issue is not verification power, but context window.
  *   **"Give the Honest Side More Time":** If the search space for the flaw is combinatorial (e.g., checking all pairs of steps), additional time may not suffice within a fixed turn structure. The search cost may outpace the verification speed.
  *   **"Cap the Argument Length":** Shortening a dense argument does not make global flaws local. A bug arising from the interaction of two modules remains invisible if each module's code is inspected in isolation, regardless of total line count.

  ### Methodology & Timeline
  As a journalist, I will not produce formal proofs. I will produce a structured taxonomy of errors via expert elicitation and controlled case studies.

  *   **Months 1–2: Theoretical Grounding & Expert Interviews.**
      *   Conduct 15–20 interviews with AI safety researchers (Anthropic, OpenAI, independent) focusing on Debate protocols.
      *   Goal: Map the current consensus on "obfuscation." Identify the specific mathematical or computational assumptions being made about flaw decomposition.
  *   **Months 3–4: Constructing Test Cases.**
      *   Collaborate with three domain experts (one mathematician, one software engineer, one policy analyst) to construct "undebatable" claims.
      *   **Case A (Math):** A proof where a definition drifts subtly between Step 1 and Step 10. Locally valid, globally contradictory.
      *   **Case B (Code):** A race condition bug that only manifests when Module A's state interacts with Module B's timing. Neither module contains the bug in isolation.
      *   **Case C (Narrative):** A policy claim supported by five selectively cited sources. The claim is falsified only by the conjunction of all five with a sixth omitted source.
  *   **Months 5–6: Human Judging Trials & Write-Up.**
      *   Run structured debates using these cases with human judges (graduate students).
      *   Measure: Can the honest debater point to a single localized claim that convinces the judge? Or does the judge require full context to see the error?
      *   Deliverable: A long-form article for publication + a technical appendix documenting the test cases and judging outcomes.

  ### Deliverables: Writing vs. Research
  *   **The Writing:** A 4,000-word feature article arguing that AI safety research is optimizing for the wrong bottleneck (length vs. localization), aimed at a technical audience (e.g., *Logic Magazine*, *Astral Codex Ten*).
  *   **The Research:** A public "Taxonomy of Non-Localizable Flaws." This will not be a peer-reviewed theorem, but a documented set of counter-examples where Debate protocols fail empirically. This serves as a stress-test for safety teams relying on Debate for oversight.

  ### Failure Conditions
  The project fails if:
  1.  **Triviality:** The constructed test cases are easily localized by honest debaters in pilot trials, suggesting the "global flaw" intuition was wrong.
  2.  **Verification Failure:** Human judges cannot verify the localized flaws even when pointed out, indicating the problem is judge competence, not localization.
  3.  **Consensus:** Expert interviews reveal the field has already definitively solved or discarded the localization question (making the reporting redundant).

  ### Test Case Specifics
  To ensure bite, the cases will be pre-validated:
  1.  **The Definition Drift:** A proof where "convergence" is used in the topological sense in Lemma 1 and the metric sense in Lemma 5. The error is invisible unless both lemmas are compared directly.
  2.  **The Module Interaction:** A Python script where Data Handler X assumes input is sanitized, and Processor Y assumes input is raw. The bug exists only in the handoff.
  3.  **The Selective Conjunction:** A claim that "All studies show X is safe." Five studies are cited. Each actually says "X is safe *under condition Z*." The debater omits Z. The flaw is not in any single citation, but in the aggregated implication.

  ***

  ### AI Assessment: Confidence & Uncertainty

  **Confidence in the Central Bet:** **High (85%)**
  You are correct that "length" is often a proxy for a deeper structural problem. In complex systems (code, math, policy), errors frequently arise from *interactions* rather than *components*. If Debate relies on decomposing problems into independent sub-claims, it inherently struggles with emergent properties that only exist in the conjunction of those claims. Shifting the frame from "how long" to "how local" is a robust journalistic and analytical move.

  **Least Sure Element:** **The "Search Cost" Variable**
  I am least sure about the second half of your hypothesis: *that the honest debater cannot find the localization cheaply.*
  While non-local flaws likely exist (the "global" problem), proving that an honest AI *cannot find them* within a budget is harder than proving the flaws exist. An AI might have pattern-matching capabilities that allow it to spot definition drift or module mismatches without exhaustive search, even if a human judge couldn't. You may find that flaws are global for *humans*, but localizable for *models*. Distinguishing between "hard for humans to verify" and "hard for models to find" will be the trickiest part of your reporting.
