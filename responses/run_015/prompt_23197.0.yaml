      *   *Disjunctivism:*
          *   *Pros:* Saves Direct Realism. Explains why perception justifies belief better than hallucination. Aligns with the user's intuition.
          *   *Cons:* Hard to explain *why* they feel the same if they are different kinds. Can seem like a linguistic trick ("No, they're just different!"). Needs to account for neural similarity.

  5.  **Drafting the Response:**
