      *   *Correction:* Make sure to distinguish between the *Epistemic Pessimist* (You can't know) and the *Normative Pessimist* (You shouldn't believe/act). In SP terms: "Signal unrecoverable" vs. "Architecture violation."

  9.  **Final Structure:**
      *   Intro: Acknowledge the interface.
