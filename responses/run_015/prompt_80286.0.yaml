  # Decision Tree: The Badness of Human Extinction

  **Starting Stipulation:** Human extinction is bad, and its badness is **not** exhausted by the deaths of the people who die in the extinction event. (You accept that there is a further loss beyond the harm to the dying generation).

  **Instructions:** Follow the branches by answering the questions based on your intuitions about the four cases provided in your seminar materials.
  *   **Case 1:** Last human dies, artifacts remain, no one ever experiences anything again.
  *   **Case 2:** Humanity extinct, but a posthuman successor species inherits our culture and values.
  *   **Case 3:** Aliens visit later and genuinely enjoy our art and literature.
  *   **Case 4:** Total well-being in the universe is exactly the same as it would have been had humanity continued (e.g., replaced by equally happy aliens).

  ---

  ### **Node 1: The Successor Question (Case 2)**
  **If a posthuman successor species inherits our values and culture, is the badness of human extinction largely resolved?**

  *   **YES** (Value lies in the continuation of consciousness/culture, not biological humanity)
      *   Go to **Node 2A**.
  *   **NO** (Value lies specifically in *humanity* or *our* lineage)
      *   Go to **Node 2B**.

  ---

  ### **Node 2A: The Valuer Question (Case 1)**
  *(Reached if Successors mitigate the loss)*
  **If no conscious being ever experiences the remnants of civilization, is value still lost?**

  *   **NO** (Value requires a subject to experience or value it)
      *   **LEAF: The Relational/Valuer View**
      *   *Most Awkward Commitment:* If all consciousness in the universe ceased, the destruction of the Pyramids would be no worse than the erosion of a random hill.
  *   **YES** (Value inheres objectively in the cultural pattern or achievement itself)
      *   **LEAF: The Impersonal Cultural View** *(Added Position)*
      *   *Most Awkward Commitment:* A museum of human art floating in an empty, lifeless universe retains its full value forever.

  ---

  ### **Node 2B: The Substitution Question (Case 4)**
  *(Reached if Successors do not mitigate the loss)*
  **If the universe contains the same total well-being generated by non-human beings, is human extinction still a specific loss?**

  *   **NO** (The badness is exhausted by the loss of aggregate well-being/lives)
      *   **LEAF: The Future-People / Foreclosed Possibilities View**
      *   *Most Awkward Commitment:* Replacing humanity with a different species of equal happiness negates the tragedy of our extinction.
  *   **YES** (Human survival has value independent of aggregate well-being comparisons)
      *   Go to **Node 3**.

  ---

  ### **Node 3: The Victim Question (Case 3 & Introspection)**
  *(Reached if Human Survival is uniquely valuable)*
  **Who is primarily wronged by extinction: the living who lose their context, or the unborn who lose their existence?**

  *   **THE LIVING** (Our current projects lose meaning without a human future)
      *   **LEAF: Scheffler's "Afterlife" Conception**
      *   *Most Awkward Commitment:* Your love for your children is partially irrational if you believe they will die childless, because your life's meaning depends on a collective future you won't see.
  *   **THE UNBORN** (Future humans have a claim or right to exist)
      *   **LEAF: The Deontological Claim to a Future**
      *   *Most Awkward Commitment:* We owe existence to specific future individuals who cannot exist to claim that right or be harmed by its violation.

  ---

  ### **Seminar Notes & Logical Constraints**

  **Excluded Positions (By Stipulation):**
  *   **The Deaths-Only View:** Must give up the intuition that the end of the human lineage is a tragedy distinct from the sum of individual deaths.
  *   **The Extinction-Is-Not-Bad View:** Must give up the core premise that the disappearance of humanity is a normative loss for the universe.

  **Unoccupied Combinations:**
  *   **Successor = YES + Substitution = YES:** This combination is logically unstable. If a posthuman successor mitigates the loss (Successor=YES), you have admitted biological humanity is not unique; therefore, alien substitution should also mitigate the loss (Substitution=YES). Occupying this node implies valuing "culture" over "biology" in Case 2, but "biology" over "culture" in Case 4.

  **Indistinguishable Leaves:**
  *   **Scheffler's "Afterlife" vs. Deontological Claim:** The four cases provided cannot fully separate these leaves, as both require human survival and reject alien substitution. The distinction rests on theoretical grounds (meaning of current life vs. rights of future people) rather than divergent intuitions about the specific cases.

  **Guidance for Students:**
  *   If you found yourself hesitating between **Relational** and **Future-People**, ask yourself: "If aliens enjoyed our art (Case 3), would that save the value?" (Relational says Yes; Future-People says No, because *our* people are still gone).
  *   If you found yourself hesitating between **Scheffler** and **Deontological**, ask yourself: "If we could ensure a future humanity exists, but they would live miserable lives, should we still do it?" (Deontological might say Yes/Right-based; Scheffler might say No/Meaning-based).
