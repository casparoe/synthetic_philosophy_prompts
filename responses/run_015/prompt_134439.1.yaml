      *   *Section 2 (Modes of History):* Explain that recovering an unarchived past naturally leans toward *Critical* history. Warn against turning it into *Monumental* history (heroic workers vs. villainous owners).
      *   *Section 3 (Epistemic Status):* The ledger's value is in its ability to disrupt the "monumental" narrative. It doesn't need institutional authority to be "true" in the critical sense, but it cannot claim to be the *whole* truth.
      *   *Conclusion:* Summarize the methodological implication (embrace the fragmentary nature).

  7.  **Draft the JSON:**
      *   *interpretation_of_distortion:* Structural/Instinctual. Power defines what is memorable.
      *   *application_to_fragmentary_record:* It functions as Critical History (judging the past) rather than Monumental (glorifying). Risk is inverting the myth.
      *   *epistemic_status_of_ledger:* It is a tool of disruption, not a new foundation. Valid as critique, precarious as fact without context.
      *   *unresolved_residue:* How to prevent the counter-narrative from hardening into a new dogma (new monumental history).

  8.  **Refine and Review:**
      *   *Check against constraints:* Did I give generic archival advice? No. Did I focus on Nietzsche? Yes. Is the JSON correct? Yes.
      *   *Tone:* Philosophical, analytical, respectful of the user's ethical concern.
      *   *Nuance:* Ensure I don't say Nietzsche *solves* the problem, but rather *frames* it. Nietzsche is skeptical of "objective history." The user's worry about "inverting bias" is very Nietzschean.

      *(Self-Correction during drafting)*: I need to be careful not to imply Nietzsche believes in "objective truth" that the ledger reveals. For Nietzsche, all history is interpretation. The ledger is a *different* interpretation that serves life (justice) better than the official one. The key is avoiding the *dogmatism* of the official record.

      *(Refining Question 1)*: Nietzsche sees it as a function of the "plastic power" of a culture. It's systemic. The victors don't need to plot; their success naturally eclipses the losers.
      *(Refining Question 2)*: If the past had no recognition, it cannot be "Monumental" in the traditional sense. It must be "Critical" (destroying the illusion of the official story).
      *(Refining Question 3)*: The ledger is "true" insofar as it breaks the paralysis caused by the official lie. Its status is functional, not absolute.

  9.  **Final Polish:** Check JSON syntax. Ensure the explanation flows logically into the JSON. (Proceed to generate output).

      *Wait, one nuance check:* The user asks if the counter-narrative is "doomed." Nietzsche would say it's only doomed if it tries to be *objective* or *monumental*. If it accepts its role as *critical*, it succeeds. I need to make sure this distinction is clear.

      *Another nuance:* The user asks about "institutional authority." Nietzsche is deeply skeptical of institutions. He would argue institutional authority is exactly what corrupts history into monumental propaganda. So the *lack* of institutional authority might actually be a strength for *critical* history, though a weakness for *antiquarian* preservation.

