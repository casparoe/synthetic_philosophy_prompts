  2.  **Deconstruct Nietzsche's *On the Advantage and Disadvantage of History for Life*:**
      *   *Core Thesis:* History must serve *life*. Too much history paralyzes action; too little makes us barbaric. We need three modes: Monumental (inspiration for great deeds), Antiquarian (preservation/reverence for origins), Critical (judgment/condemnation to break chains of the past).
      *   *Monumental History:* Focuses on great moments/figures. Danger: It generalizes, ignores context, and creates false continuities to justify present power or ambition. It makes the past look like a prelude to the present.
      *   *Antiquarian History:* Focuses on preserving the past for its own sake. Danger: It becomes mummification, revering everything old regardless of value, stifling new growth.
      *   *Critical History:* Focuses on judging and condemning the past to break its hold on the present. Danger: It can become destructive, severing roots entirely.
      *   *Preservation/Asymmetry:* Nietzsche argues that the "monumental" is often constructed by those in power to legitimize themselves. The "dust" of history isn't accidental; it's the result of what was deemed worthy of memory. The "injustice" of the past is often buried by the success of the present.

  3.  **Address Question 1: Intentional vs. Systemic Distortion:**
      *   *Nietzsche's View:* Nietzsche is rarely a conspiracy theorist in the modern sense. He focuses on *will to power* and *instincts*. The distortion isn't necessarily a smoke-filled room conspiracy by specific "victors" (though they benefit). It is *systemic* to how culture creates value. Institutions preserve what serves the *current* concept of life/culture.
      *   *Application:* The town histories aren't necessarily lying maliciously; they are engaging in "monumental history" that serves the current landowners' legitimacy. The exclusion of the cooperative's records is a structural feature of how the "winning" culture defines what is memorable. It's an *organic* exclusion based on what serves the present power structure, not necessarily a specific intentional act of forgery, but an intentional act of *selection*.

  4.  **Address Question 2: Monumental/Critical Distinction for Unarchived Past:**
      *   *The Problem:* Monumental history requires "great deeds" recognized by the culture. If the cooperative was erased, it has no "monumental" status.
      *   *Critical History:* This is the key for the user. Critical history *judges* the past to free the present. Using the ledger to condemn the official narrative is an act of Critical History.
      *   *The Risk:* If the user simply glorifies the workers to match the glorification of the owners, they are creating a *counter-monumental* history. This falls into the same trap (myth-making).
      *   *Nietzsche's Requirement:* To avoid the trap, the history must serve *life* (truth/justice in the present), not just invert the power dynamic. It must acknowledge its own fragmentary nature.

  5.  **Address Question 3: Epistemic Status of the Ledger:**
      *   *Preservation Asymmetry:* Nietzsche suggests that "truth" in history is not about objective completeness (which is impossible) but about what serves life.
      *   *The Ledger:* Its lack of institutional status doesn't make it false, but it makes it "dangerous" to the current order. Its epistemic status is *critical*. It is a tool for judgment, not necessarily a foundation for a new "official" truth.
      *   *Implication:* The ledger proves the *injustice* of the archive, not necessarily the absolute economic success of the mill. Its value lies in breaking the "false continuity" of the official story.

  6.  **Synthesize and Draft the Explanation:**
