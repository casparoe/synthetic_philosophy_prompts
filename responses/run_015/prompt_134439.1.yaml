answer: |-
  ### Nietzsche's Framework and the Archive of the Vanquished

  Your dilemma touches the core of Nietzsche's concern in *On the Advantage and Disadvantage of History for Life*. Nietzsche is not primarily concerned with historical accuracy in the positivist sense (i.e., assembling facts to create a perfect mirror of the past). He is concerned with how the *use* of history affects the vitality and justice of the present. When you ask if your work is legitimate historiography or merely inverted bias, you are asking a Nietzschean question: Does this interpretation serve "life" (justice, truth, future possibility), or does it merely serve a new form of idolatry?

  Here is an analysis of your situation through the specific lens of Nietzsche's three modes of history and his concept of preservation.

  #### 1. Intentional Distortion vs. Systemic Asymmetry
  Nietzsche treats the distortion of history primarily as a **systemic effect of institutional control**, though one driven by the instincts of those in power. In his analysis of "monumental history," he argues that great moments of the past are connected across time by "bridges" built by the present. Those who hold power (the families who bought the land) naturally construct bridges that lead to themselves.

  This is not necessarily a conspiracy of specific individuals to forge documents (though that may happen). Rather, it is an organic process where the "plastic power" of a culture digests the past. The official town histories are engaging in monumental history: they select deeds (the "inefficient collective") that justify the current order (private ownership). The exclusion of the cooperative's records is a structural feature because the archive serves the *continuity* of the current power structure. For Nietzsche, the "victors" do not need to intentionally erase the ledger; their success ensures that only records validating their success are copied, revered, and integrated into the "monumental" narrative. The ledger vanished not because it was hunted, but because it ceased to be useful to the life of the town as defined by the new owners.

  #### 2. Monumental vs. Critical History for the Unarchived
  This is the crux of your methodological worry. **Monumental history** requires recognized greatness; it looks for heroes to emulate. Since the cooperative workers were systematically excluded from recognition, they cannot easily be the subjects of monumental history without fabricating a myth. If you assemble the ledger fragments to portray the workers as flawless martyrs and the owners as pure villains, you are indeed creating a **counter-monumental history**. You would be inverting the bias but retaining the structure: using the past to create a simplified idol for the present.

  However, Nietzsche offers **critical history** as the alternative. Critical history does not seek to glorify; it seeks to *judge and condemn* the past in order to break its chain over the present. Because the cooperative's past lacks institutional recognition, your use of the ledger is inherently critical. You are not trying to build a statue of the workers (monumental); you are using the ledger to put the official narrative on trial (critical).

  Nietzsche warns that critical history is dangerous because it involves "smashing" the past. But in your case, the "smashing" is directed at the *false continuity* of the official record. If you frame your account not as "The True Glory of the Workers" but as "Evidence of the Systemic Erasure of the Cooperative," you remain within the critical mode. You avoid the trap of inverted bias by acknowledging that the ledger is a fragment of a suppressed reality, not a new foundation for a religion of labor.

  #### 3. The Epistemic Status of the Recovered Ledger
  If the harm is structural (rooted in preservation asymmetry), the epistemic status of the ledger changes. In a positivist framework, a document without provenance or institutional validation is "suspect." In a Nietzschean framework, **the ledger's lack of institutional integration is precisely what grants it critical value.**

  The official records are "contaminated" by their service to power (monumental function). The ledger, having been excluded from that service, offers a perspective that was *dangerous* to the prevailing order. Its epistemic status is not that of an "objective fact" that solves the mystery, but that of a **disruptive witness**. Nietzsche argues that we need history to live, not to know. The ledger allows the present to live more justly by breaking the paralysis of the official lie.

  However, Nietzsche would warn you against claiming the ledger provides the "whole truth." Because it is fragmentary and shorthand, it cannot support a new monumental narrative. Its status is **provisional and polemical**. It validates the *possibility* of the alternative, proving that the official narrative is a construction, not a destiny. It shifts the burden of proof back onto the institutional archive.

  ### Summary of the Methodological Implication
  Nietzsche's argument suggests your work is legitimate *if* you resist the urge to turn the cooperative into a new monument. You must accept that your account will remain fragmentary and critical. You are not restoring the past for its own sake (antiquarian), nor are you building a shrine to the workers (monumental). You are wielding the ledger as a hammer to break the false necessity of the official history (critical). The lack of institutional framework is not a failure of your history; it is the subject of it.

