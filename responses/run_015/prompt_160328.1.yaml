answer: |-
  Assign individual culpability only when the clinician's action originated from their own uncoerced reasoning and capacity for care, irrespective of whether the outcome could have been prevented.

  **The Procedure**

  **Step 1: Check for Physical or Forcing Constraints.**
  Determine if deviation was physically impossible or blocked by a functioning hard stop (e.g., software lock, locked protocol).
  *   **Evidence:** Incident report, IT logs, protocol documents.
  *   **Decision:** If yes, route to **System Track**. Stop.
  *   **Note:** This handles *forcing functions*. If the system did the intervening, the clinician lacked control.

  **Step 2: Check for Capacity Impairment.**
  Determine if the clinician's capacity to judge or act was severely compromised by system-induced factors (e.g., extreme fatigue, excessive interruptions, lack of critical information, staffing shortages).
  *   **Evidence:** Shift logs, interruption records, staffing rosters, incident narrative.
  *   **Decision:** If yes, route to **System Track**. Stop.
  *   **Note:** This handles *ommissions* and *fatigue*. If capacity is eroded by the environment, the action does not flow from full agency.

  **Step 3: Check for Agency and Endorsement.**
  Determine if the action flowed from the clinician's own judgment, habit, or choice, even if shaped by culture. Ask: Did the clinician endorse this way of working, or were they manipulated/coerced into it against their professional will?
  *   **Evidence:** Testimony, prior training records, culture surveys.
  *   **Decision:** If the action was uncoerced and endorsed (even if habitual), proceed to Step 4. If the clinician was manipulated (e.g., threatened) or lacked consciousness of the act due to system-induced automatism, route to **System Track**.
  *   **Note:** This handles *gradual shaping* and *Frankfurt-style cases*. If the habit is owned by the clinician, they are responsible even if deviation felt effortless.

  **Step 4: Check for Gross Deviation.**
  Determine if the judgment or action was a gross violation of accepted standards or a reasonable error within professional discretion.
  *   **Evidence:** Clinical guidelines, expert testimony.
  *   **Decision:** If gross violation, route to **Clinician Track**. If reasonable error or justified deviation, route to **System Track**.
  *   **Note:** This handles *flicker cases*. Even if the outcome was fixed, if the clinician chose a grossly substandard path when a standard path was available to their judgment, they are culpable.

  **Regulator Statement Protocol**
  If routing to **Clinician Track**, you must record: *"The clinician had a meaningful alternative."*
  *   **Definition:** In this context, "meaningful alternative" means "the capacity to exercise professional judgment aligned with standards," not necessarily the ability to change the outcome.
  *   **When to Refuse:** If Step 3 confirms the clinician lacked ownership of the action (e.g., genuine manipulation) but Step 4 suggests a violation, do not sign the finding. Escalate to the Board as a values call regarding coercion vs. culpability.
  *   **Drafting:** "The clinician had a meaningful alternative: the capacity to exercise professional judgment aligned with standards in the actual sequence of events."

  **Case Applications**

  **(a) Nurse Infusion Error.**
  *   **Step 1:** Barcode scanner disabled (System constraint).
  *   **Step 2:** Three interruptions + second nurse pulled (Capacity impairment).
  *   **Result:** **System Track.**
  *   **Rationale:** Capacity was overwhelmed by environmental constraints; action did not flow from unimpaired agency.

  **(b) Resident Non-Escalation.**
  *   **Step 1:** No hard stop.
  *   **Step 2:** Hour 26 of 28-hour shift (Capacity impairment via fatigue).
  *   **Result:** **System Track.**
  *   **Rationale:** Duty hour violations impaired cognitive capacity to escalate; omission reflects system failure on shift limits.

  **(c) Consultant Checklist Deviation.**
  *   **Step 1:** No hard stop.
  *   **Step 2:** No capacity impairment noted.
  *   **Step 3:** Deliberate choice based on judgment (Agency present).
  *   **Step 4:** Judgment deemed reasonable at the time (Not gross deviation).
  *   **Result:** **System Track.**
  *   **Rationale:** Action flowed from agency, but reasonable professional error is not culpable; the checklist process requires redesign to accommodate justified deviation.

  **Panel Resistance Analysis**
  The panel is most likely to reject the **System Track finding for Case (c)**.
  *   **Why:** Panels suffer from outcome bias. A catastrophic outcome makes "reasonable judgment" feel insufficient to non-philosophers. They will perceive the deliberate skipping of a safety checklist as inherently culpable, regardless of the reasonableness of the justification.
  *   **Why This Is Not a Defect:** The procedure protects necessary clinical discretion. If clinicians are punished for reasonable deviations that happen to fail, they will cease to deviate even when necessary, rigidity increasing long-term risk. The resistance highlights the tension between safety protocols and professional judgment, which is a values call the procedure correctly assigns to System redesign rather than individual discipline.

  **Explicit Limitations**

  1.  **Evidence of Mental State:** The procedure depends on knowing *why* the clinician acted. Incident reports rarely capture internal reasoning. When evidence is unavailable, assume System Track unless gross negligence is obvious.
  2.  **Hindsight Bias:** Step 4 (Reasonableness) is vulnerable to knowing the outcome. Panelists must explicitly bracket the outcome when judging the decision quality at the time.
  3.  **Counterfactual Interveners:** The procedure cannot distinguish an actual intervener from a counterfactual one after the fact. If a clinician claims "I would have been stopped," treat this as a System Track indicator regarding culture, not a factual claim about specific individuals.
  4.  **Values Calls:** The definition of "gross deviation" vs. "reasonable error" is not purely factual. When the panel splits 2-2, this is a values call. Do not force consensus. Escalate to the Board to define the threshold of acceptable risk for that unit.
  5.  **Gradual Shaping:** Distinguishing between "owned habit" and "systemic manipulation" is difficult. If the culture is toxic enough to reshape judgment, the System Track is appropriate even if the clinician feels responsible. Do not punish acculturation unless the clinician actively resisted correction.
