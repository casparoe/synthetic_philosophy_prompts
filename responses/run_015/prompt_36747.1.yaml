answer: |-
  To whom it may concern, and specifically to ourselves for the record, this document serves as the formalization of a disagreement that has persisted across two years of weekly coffee meetings between a philosopher of physics and a physicist. We have decided to stop sniping and begin an adversarial collaboration, and the purpose of this memo is to nail down exactly where we stand, what we share, and where we diverge, without the usual rhetorical fog that accumulates around quantum foundations. We are both tired of the conversation looping back to the same起点 without progress, and we are both tired of caricature, specifically the recurring claim that the epistemic view amounts to thinking the theory is about nothing at all. We want a document we can both sign, not because we agree on the conclusion, but because we agree on the map of the disagreement.

  There is a substantial bedrock of technical agreement that we want to state clearly before addressing the interpretation, because too often the debate skips over the formalism to get to the metaphysics. We both affirm that the quantum formalism generates probabilities through the Born rule and that these probabilities are confirmed by experiment to an extraordinary degree of precision. We agree that nonorthogonal states can never be perfectly distinguished in a single shot, which is a fundamental constraint on what information can be extracted from a system. We agree that different preparations can produce the same statistics for specific measurement sets while the formalism still assigns them different states, highlighting the gap between operational data and state assignment. Most importantly, neither of us doubts quantum mechanics as a predictive machine. We are not skeptics looking to overthrow the theory; we are trying to understand what the theory is telling us about the world it predicts so successfully. We agree that the mathematics works, and we agree that any interpretation must recover these operational features without contradiction.

  The disagreement lies in what the quantum state represents relative to that formalism. To ensure neither of us feels misrepresented, we state the disagreement twice. From the perspective of the physicist in this collaboration, the quantum state is psi-ontic, meaning the state vector corresponds directly to a physical reality existing independently of observation, such that distinct quantum states describe distinct physical conditions of the system. From the perspective of the philosopher in this collaboration, the quantum state is psi-epistemic, meaning the state vector represents a state of information, knowledge, or belief held by an agent, such that distinct quantum states can describe the same underlying physical reality due to overlapping knowledge states. We explicitly reject the summary that the epistemic view claims the theory is about nothing; rather, it claims the theory is about the constraints on what agents can know and predict, which is a substantive claim about the world even if it denies the state vector is a physical object.

  We have identified three specific cruxes where our disagreement concentrates, and for each we record the evidence we would accept and our predictions about how future developments will bear on the issue. The first crux concerns the no-go theorems, specifically the 2012 Pusey-Barrett-Rudolph result. The physicist holds that this theorem rules out psi-epistemic models by showing that distinct quantum states must correspond to disjoint ontic states, provided one accepts the assumption of preparation independence. The philosopher holds that the theorem leans on preparation independence, which is effectively the thing being fought about, and therefore the result does not settle the matter but rather shifts the burden to defending that assumption. We jointly count as evidence bearing on this any experimental or theoretical work that tests the viability of preparation independence in correlated systems. The physicist predicts that relaxing preparation independence will require conspiratorial correlations that are physically implausible and thus the psi-ontic view will remain the only viable option. The philosopher predicts that relaxing preparation independence will open a legitimate space for psi-epistemic models that are no more conspiratorial than accepted features of quantum nonlocality, thus keeping the epistemic view alive.

  The second crux is whether the state of a single, individual system means anything without reference to ensembles or to an agent holding expectations. The physicist says yes, arguing that a single system possesses a state regardless of whether it is measured or part of a ensemble, and denying this smuggles in the conclusion that the state is merely informational. The philosopher says that assigning a state to a single system without reference to an ensemble or agent is category error, and that insisting otherwise smuggles in the conclusion that the state is ontic. We jointly count as evidence bearing on this any future formulation of quantum mechanics that can derive the Born rule without assuming the state of an individual system as a primitive. The physicist predicts that such a formulation will still require an individual state variable to function. The philosopher predicts that such a formulation will derive the appearance of individual states from relational or statistical principles alone.

  The third crux involves Wigner's-friend kind of setups, where two agents in good standing assign different states to the same system. The question is whether that embarrasses the ontic view or the epistemic view more. The physicist worries that if the state is real, two contradictory states cannot both be true, suggesting a need for objective collapse or many worlds to resolve the contradiction. The philosopher argues that if the state is information, two agents having different information is unproblematic and expected. We jointly count as evidence bearing on this any experimental realization of extended Wigner's friend scenarios that violate inequalities derived from observer-independent facts. The physicist predicts that these experiments will ultimately show that one observer's account must be privileged or that facts are relative to worlds, preserving a form of ontology. The philosopher predicts that these experiments will confirm that facts are relative to observers, validating the epistemic or relational view without requiring multiple worlds.

  Finally, we acknowledge the growing suspicion that some stretch of our dispute is really just verbal, specifically regarding the word real. We agree to specify exactly which part is verbal and why. The physicist uses real to mean mind-independent existence, such that the state exists even if no agent ever interacts with it. The philosopher uses real to mean robustly inferable structure, such that the state is real if it plays an indispensable role in inference, even if it is not a material object. We agree that if the dispute were purely about this definition, we could dissolve it, but we also agree that the definition drives the metaphysics, so we cannot simply stipulate it away. The physicist believes that if the state is not mind-independent, it is not a fundamental part of physics. The philosopher believes that if the state is not epistemic, quantum mechanics violates reasonable norms about information and causality. We record our prediction that clarifying this definition will not end the argument but will clarify that the disagreement is about whether physics should prioritize mind-independent ontology or normative constraints on inference.

  We sign this not to end the argument, but to ensure that when we argue next week over coffee, we are arguing about the same thing. We commit to updating this document if evidence shifts our predictions, and we commit to acknowledging when the other side has made a point that lands. We are done with talking past each other. We want the truth, or at least the clearest possible map of why we cannot find it.
