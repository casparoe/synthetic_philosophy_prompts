      *   Discuss Colleague 2: Maximizing lives. Fits the Black split. Fits Red/Green (life > limb). LDO point: Colleague 2 claims LDO refutes Prioritarianism. This is a philosophical error. LDO refutes Egalitarianism. Prioritarianism avoids LDO. But Colleague 2 is right that the protocol looks more like maximization with a severity constraint.
