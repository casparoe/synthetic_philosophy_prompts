          *   Delayed/Minor (Green): Walking wounded (treated last, even for minor fixes).
          *   Expectant (Black): Unsurvivable given resources (comfort care only, passed over).
          *   (Implied Fourth): Usually "Delayed" (Yellow), but the prompt focuses on the contrast between Immediate, Minor, and Expectant.
      *   **The Conflict:** Three colleagues have different interpretations of the ethical underpinnings.
          *   Colleague 1: It's Prioritarianism (benefit matters more the worse off the person is).
          *   Colleague 2: It's Utilitarianism/Maximizing Lives Saved (Prioritarianism refuted by Levelling-Down Objection; Expectant abandoned to save more).
          *   Colleague 3: Comparative Prioritarianism (weight based on rank in severity ordering, applies to losses too).
      *   **The Questions to Answer:**
          *   What does the protocol *strictly presuppose* about distributive value vs. what does it merely *fit with*?
          *   Does priority track badness, benefit size, or saveability threshold?
          *   Do the expectant and walking wounded settle this distinction?
          *   Does the rule rest on comparative facts about other casualties or individual facts?
          *   Does the Levelling-Down Objection (LDO) reach Colleague 1's view (standard Prioritarianism)?
