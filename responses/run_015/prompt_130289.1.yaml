          *   Track badness, benefit size, or saveability? (Saveability is the gatekeeper; benefit size/badness sorts the rest).
          *   Do expectant/walking wounded settle which? (Yes, Expectant refutes pure prioritarianism; Walking Wounded refutes pure first-come-first-served or ease-of-treatment).
