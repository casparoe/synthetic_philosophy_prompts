      *   **Point 1: Labor vs. Gap.** Distinguish Fricker's "gap" from the user's "asymmetry." Introduce Kristie Dotson's *Contributory Injustice* (wilful hermeneutical ignorance) as a key reference. The user is describing *hermeneutical domination*.
      *   **Point 2: Ryle.** Validate the move but warn about the "logical" vs. "social" distinction. Suggest framing it as *ontological violence* or *categorial imperialism*.
      *   **Point 3: TI vs. HI.** Clarify the distinction (credibility vs. intelligibility/control).
