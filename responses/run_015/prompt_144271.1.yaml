  **News Peg**
  Following last week's discussion on moral psychology, a leaked internal memo from Veridical Solutions suggests the Knobe effect is no longer just academic fodder. The firm proposes monetizing the asymmetry in intentionality judgments. Below is an excerpt from their client guidance on attribution management, obtained by this column.

  ***

  **CONFIDENTIAL // CLIENT GUIDANCE MEMO 44-B**
  **TO:** Regional Account Directors
  **FROM:** Strategy & Cognitive Operations
  **DATE:** October 14
  **SUBJECT:** Deployment of Attribution Management Protocols

  **1.0 Market Opportunity**
  Recent developments in experimental philosophy offer a stable lever for reputation repair. The target phenomenon involves a specific asymmetry in how stakeholders assign intentionality. In the baseline case, a chairman approves a program to increase profit. He is told the program will affect the environment. He states he does not care about the environment either way, only the profit. When the environment is harmed, respondents say he intentionally brought about the change. When the environment is helped by the very same indifference, respondents say he did not.

  **2.0 Theoretical Positioning**
  Our competitors at Normative Dynamics LLC argue this asymmetry reflects a judgment about rule-breaking rather than a fact about the concept of intentionality at all. They propose editing the accusation wording to reduce norm-violation salience. We rebut this. While we concede their data shows minute changes in how the question is framed move the numbers, framing is secondary to valence. The stakeholder's judgment is driven by the moral quality of the outcome, not the syntactic structure of the inquiry. We cannot change the client's aims, as the effect persists regardless of stated indifference. Therefore, we must manage the description of the outcome.

  **3.0 Worked Case Study: Project AEGIS**
  Client: Global Pharma Inc.
  Scenario: Launch of proprietary algorithm optimizing supply chains.

  *3.1 The Harm Trap*
  In the initial rollout, the algorithm reduced waste but increased local traffic congestion. Client aims were purely fiscal. Despite no desire to congest roads, foresight by itself convicts the client. Stakeholders labeled the congestion intentional because the outcome was negative. Attribution Management requires re-describing the congestion as an unavoidable physical constraint rather than a side effect of policy.

  *3.2 The Help Deficit*
  In the secondary rollout, the algorithm reduced traffic congestion while increasing profit. Client genuinely aimed at the good outcome. However, because the profit motive was visible, stakeholders refused credit for the congestion reduction, labeling it unintentional. Aiming at a good outcome is insufficient if the profit motive obscures the aim. Credit for a good side effect appears to require visible evidence of aiming.

  **4.0 Legibility Protocols**
  To resolve the Help Deficit, Veridical Solutions now sells costly public rituals whose sole function is to make an aim legible. For Project AEGIS, this involved a CEO resignation and reappointment ceremony focused solely on traffic metrics. Note that the ritual now routinely costs more than the harm it was commissioned to offset. The financial loss signals that the aim was not profit-driven, thereby satisfying the stakeholder's requirement for moral credit.

  **5.0 Fee Schedule**
  Services are billed according to the cognitive load required to shift attribution.
  *   **Tier 1: Control Group Retainer** (Basic monitoring)
  *   **Tier 2: Experimental Condition Premium** (Active description management)
  *   **Tier 3: Full Knobe Surcharge** (Legibility Protocols and ritual execution)

  **6.0 Compliance Note**
  This document outlines standard operating procedure. In the event of an audit, Veridical Solutions does not assert that this guidance was created with the aim of influencing public perception. We cannot confirm this memo was authored intentionally to alter stakeholder judgment. Any resemblance to strategic manipulation is a side effect of compliance.
