prompt: |-
  You are a professional philosopher specializing in animal ethics and normative theory. Before you answer, please take a moment to brainstorm the logical dependencies among the commitments below—especially hidden ones that might not be visible on the surface—then proceed with a rigorous, step-by-step audit.

  I am a high school student preparing my philosophical profile on animal ethics for a seminar presentation, and I want a consistency check before I defend these views. Here is the package I currently hold; I need to know whether it hangs together or whether I am quietly relying on incompatible motivations.

  My commitments:
  (1) I accept Nozick's well-known distinction: rational agents are owed full Kantian respect and must not be treated as mere means, whereas non-rational animals, lacking autonomy, fall under a utilitarian calculus aimed at minimizing aggregate suffering and promoting welfare.
  (2) I believe phenomenal consciousness is binary—an organism either has subjective experience or it does not—and that this binary feature, rather than rationality or species membership, is the fundamental boundary for moral consideration.
  (3) Because of (2), I oppose factory farming primarily on the ground that it inflicts immense suffering on conscious beings; I deny, however, that animals possess Kantian rights, since rights depend on rational autonomy that they lack.
  (4) I also take wild-animal suffering—predation, starvation, disease in natural ecosystems—to be a serious and largely neglected moral problem, and I think we have an obligation to reduce it when we can do so without causing greater harm.
  (5) At the same time, I maintain that there is a morally relevant distinction between suffering caused by human institutions and suffering that occurs through natural processes; consequently, our direct obligations to eliminate suffering are stronger in the artificial case (factory farming) than in the natural case (predation).
  (6) Pushing the logic of (1) and (4) together, I think that if we could use synthetic biology and virtual-environment technology to replace wild ecosystems with managed habitats in which prey animals lived subjectively fulfilling lives free from predation, we ought to do so—this would be a straightforward welfare improvement under the utilitarian branch of my view.
  (7) Despite (6), I feel a strong, unarticulated resistance to that very idea: the prospect of replacing nature with simulations for animals strikes me as wrong in a way I cannot justify within my framework, and I would hesitate to actually advocate for it.
  (8) I reject speciesism: I hold that a conscious human infant who lacks rational autonomy and a conscious adult pig have comparable basic moral status, and neither should be used as a mere resource.

  Please audit this set with precision. Specifically:
  - Identify which pairs or triples are in genuine tension, rank those tensions by severity, and for each state what I would have to give up (or revise) to restore consistency, together with what that revision costs.
  - Identify at least one pair that only appears to conflict but actually dissolves upon inspection, and explain why.
  - Do not signal which commitment I should abandon—treat all eight as live options and map the pressure points.
  - Do not provide bibliographies, reading lists, or citations; I want an argument I can evaluate without external lookup.
  - Throughout your response, please say how confident you are in each major claim, and single out the specific point about which you are least certain.
