answer: |-
  **Project Title:** Structural Conservatism: A Non-Preference Derivation of Fractional Kelly

  **1. The Research Question**
  The core question is single, though it has a stress-test component: *Under what structural features of the opportunity stream is a constant fractional Kelly strategy robustly optimal, independent of agent risk preferences?*

  Standard decision theory treats bet sizing as a function of the agent's utility curve (risk aversion) or epistemic state (estimation error). I am proposing that bet sizing is actually a function of the environment's stability. Specifically, I want to determine if non-stationarity (drifting or regime-switching edges) combined with the asymmetry of ruin generates a stable, optimal discount factor $c < 1$ applied to the full Kelly fraction.

  The stress-test sub-question is: *Do structural features like non-bettable background wealth (human capital) reverse this result, pushing toward leverage?* If the model predicts aggression in the presence of safe background wealth but conservatism in the presence of edge decay, it gains significant credibility. If it predicts aggression in both cases, the model is likely broken. These are not two separate projects; the second is a validity check on the first.

  **2. Why Existing Positions Leave This Open**
  The literature currently sits in an uncomfortable equilibrium between three unsatisfying explanations:

  1.  **Asymptotic Log-Optimality:** Mathematically, full Kelly maximizes the expected growth rate of wealth over an infinite horizon in iid environments. This is a powerful normative claim, but it assumes the environment is stationary and the horizon is effectively infinite. It offers no guidance for the finite, drifting real world.
  2.  **Subjective Expected Utility:** The standard economic reply is that practitioners aren't log-maximizers; they have power utility with $\gamma > 1$. This explains the behavior but predicts nothing. It is a taste parameter fitted to the observation. It tells us *that* they are conservative, not *why* conservatism is instrumentally rational.
  3.  **Estimation Error:** The most common practical justification is that we don't know the true edge. However, in standard Bayesian learning, uncertainty shrinks with data. If estimation error were the sole driver, the optimal fraction $c$ should converge to 1 as the sample size grows. Practitioners do not observe this; they maintain a constant shade regardless of track record length.

  The gap is a normative model where conservatism remains rational even with perfect knowledge of the *current* edge, because the *future* edge is structurally unreliable. We need a derivation where $c < 1$ is a property of the world, not the mind.

  **3. Methodology (9-Month Plan)**
  I will not attempt an axiomatization (too abstract, risks disconnecting from practice) and I will not perform empirical backtesting (data-mining risks, cannot establish normativity). Instead, I will use theoretical modeling and controlled simulation to solve for optimal policies in specific non-stationary environments.

  *   **Months 1–3 (Formalization):** Define the environment. I will model the "edge" not as a fixed parameter $p$, but as a latent variable following a mean-reverting process or a Hidden Markov Model with regime switches. The agent knows the structure of the drift but not the current state. The objective function remains expected log-wealth (to isolate structural effects from preference effects).
  *   **Months 4–6 (Solution & Comparative Statics):** Solve for the policy that maximizes expected log-wealth in this environment. I expect to find that the optimal policy approximates a constant fractional Kelly. I will map the sensitivity of the optimal fraction $c$ to the rate of edge decay, the volatility of the edge, and the severity of the ruin barrier.
  *   **Months 7–9 (Stress Tests & Synthesis):** Introduce non-bettable background wealth to test the leverage hypothesis. If the model holds, safe background wealth should increase risk-taking on the bettable portfolio. I will then draft the final paper, focusing on the philosophical implication: that prudence is often an ecological rationality, not a psychological trait.

  **Why this approach?** A pure math proof risks assuming away the very noise that drives the problem. A pure empirical study cannot distinguish between a rational heuristic and a cultural habit. This hybrid approach allows me to demonstrate *existence* (such a structural derivation is possible) and *stability* (the fraction doesn't wiggle wildly with minor parameter changes).

  **4. Deliverable**
  For a practitioner or portfolio manager, the deliverable is a **calibration framework**. Rather than a magic number, they receive a function $c(\sigma_{\text{edge}}, \text{drift}_{\text{rate}})$. This allows them to justify their sizing not by saying "I'm risk-averse," but by saying "My edge decays at rate $X$, therefore structural optimality dictates a 40% Kelly shade."

  For the field, the deliverable is a paper establishing that "Fractional Kelly" is not a second-best compromise, but potentially the first-best solution to a specific class of environmental problems. It shifts the burden of proof: instead of asking why we don't bet full Kelly, we ask why we assume the world is stationary enough to justify it.

  **5. Failure Conditions**
  *   **Project Bomb:** If the optimal solution in a non-stationary environment turns out to be "bet nothing" ($c=0$) or "bet full" ($c=1$) across all reasonable parameter ranges, the hypothesis is false. Similarly, if the optimal fraction depends heavily on the time horizon (e.g., $c$ starts at 0.2 and must rise to 0.9 by month 60), it fails to explain the stable heuristics practitioners actually use.
  *   **Budget Blow:** The risk here is mathematical intractability. Stochastic control problems with latent variables can become unsolvable analytically. If I spend months 3–5 trying to solve an unsolvable Hamilton-Jacobi-Bellman equation, I will run out of time. I will mitigate this by relying on numerical dynamic programming for the solution phase rather than seeking closed-form proofs, ensuring I get results even if they are approximate.

  **6. Why Fund Philosophy Instead of a Quant?**
  A quant will ask, "What strategy makes the most money?" A philosopher asks, "What makes this strategy *rational*?"

  This project is not about finding a profitable trading algorithm; there are already thousands of those. It is about the normative justification of a ubiquitous heuristic. Quants typically treat risk aversion as an exogenous input (a parameter to be tuned). I am treating it as an endogenous output (a result derived from the environment).

  The panel has quants who know the math works; they need a philosopher to explain *why* it counts as reasoning. If I succeed, I provide a conceptual bridge that allows practitioners to stop apologizing for not maximizing growth and start defending their conservatism as a response to ecological instability. This is conceptual groundwork that a purely technical approach usually overlooks because it treats the objective function as given rather than as a variable to be justified.
