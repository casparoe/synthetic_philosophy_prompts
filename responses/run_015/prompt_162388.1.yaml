      *(Refining the "Abandonment" point)*: The blog says he abandoned the apparatus *for economics*. This is actually quite defensible. He didn't use the formal logic of the *Treatise* in the *General Theory*. He used rhetoric and psychology. So, in terms of *methodology*, the blog is right. In terms of *philosophical underpinning*, the blog is wrong. I need to make this distinction clear.

      *(Least Sure Point)*: I will select the precise nature of 'conventions'. Whether Keynes viewed them as 'arbitrary' is debatable. He viewed them as fragile, but 'arbitrary' implies no reason, whereas conventions evolve for a reason (stability).

