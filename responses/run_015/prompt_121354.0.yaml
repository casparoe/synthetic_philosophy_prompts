prompt: |-
  I've been meeting with a small interdisciplinary group—mostly philosophers and a couple of computer scientists—where we've kept circling back to a tension that feels undertheorized. On one side is the narrow formulation of the alignment problem: can we build systems that reliably do what we intend, leaving aside whether our intentions are morally correct? On the other side is the broader value-alignment view, which holds that because human intentions are fragmentary, context-dependent, and distributed across stakeholders, any attempt to formalize intent already smuggles in normative commitments about whose preferences count. To make the discussion sharper, we've started using a working distinction—specification fragility—to describe the risk that a system optimized for an explicit objective will stabilize around the syntactic form of that objective rather than the tacit norms the specifiers actually rely on, especially when those norms conflict across users. I'm not asking for a literature review, a bibliography, or any list of readings; I'm asking you to act as if you were advising this group on where to direct limited conceptual energy over the next few years. Among the open conceptual questions that bear on whether intent alignment can be cleanly separated from value alignment—questions about the ontology of goals, about corrigibility and the dynamics of human feedback, about multi-agent specification, about whether preference aggregation is even a coherent prerequisite—which two or three strike you as most upstream and tractable for philosophers rather than machine-learning engineers? Please defend your ordering: what makes one question depend on another, what evidence over the next few years would move it up or down your list, and which popular lines of work you think are overrated because resolving them wouldn't actually change whether the narrow alignment problem is coherent. Write this as continuous prose, without headings, bullet points, bold text, or tables, in the manner of a long, careful letter. Finally, be explicit about where your reasoning is most vulnerable—identify the specific argument or finding that, if it turned out differently, would lead you to reorder your priorities or abandon the distinction altogether.
