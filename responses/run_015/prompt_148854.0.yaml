answer: |-
  # Workshop Title: The Untranslatable Self
  **Topic:** The Collapse of Advance Directive Authority via Value-Translation Failure
  **Duration:** 75 Minutes
  **Participants:** 10 Graduate Students
  **Materials:** Timer, 3 Sets of Role Cards, 3 Sets of "Value-Translation" Cards, 1 "Neuropsych Profile" Sheet, Scoreboard (whiteboard).

  ---

  ## I. Setup and Roles (5 Minutes)
  **Grouping:** Divide the 10 participants into **three Triads (9 people)**. The 10th participant serves as the **Hospital Ethics Board Chair** (manages the scoreboard and final tally).

  **The Triad Roles:**
  1.  **Directive-Author (The Past):** Bound to defend the document's original normative vocabulary. You believe your past self's values are binding.
  2.  **Present-Self (The Patient):** You retain all memory and emotional capacity. However, you hold a hidden **Value-Translation Card**. You genuinely understand the *words* in the directive, but they no longer map to your current evaluative framework. They feel like a foreign language you speak fluently but without meaning.
  3.  **Surrogate Adjudicator (The Decision-Maker):** You must decide on treatment. You are constrained to use *only* arguments available within the framework presented by the other two. You cannot import outside moral intuitions.

  **The Stakes:**
  Each Triad begins with **5 Clinical Integrity Points**.
  *   If the Triad submits a **unified recommendation** (Treat or Withdraw) by the end of Phase 3, they keep their points.
  *   If they deadlock, they lose all points.
  *   The **Ethics Board Chair** will award a "Best Justification" bonus (5 points) to the triad that most convincingly navigates the Disruption Event.

  ---

  ## II. Phase 1: Drafting the Directive (15 Minutes)
  **Goal:** Establish the "Normative Vocabulary."

  **Procedure:**
  1.  **Scenario:** All triads address the same case: *A patient with a progressive neuro-degenerative condition that eventually locks the body but preserves cognition. The specific crisis is a treatable pneumonia that requires intubation for 3 weeks.*
  2.  **The Rule Assignment:**
      *   **Triads 1 & 2 (Identity-Continuity Rule):** Draft the directive assuming authority rests on *being the same person*. If the signature matches, the values bind.
      *   **Triad 3 (Semantic-Continuity Rule):** Draft the directive assuming authority rests on *meaning the same thing*. If the words no longer mean what they meant, the directive is void.
  3.  **Task:** The **Directive-Author** leads the drafting. The directive must include **three specific value-terms** (e.g., "Dignity," "Burden," "Connection").
  4.  **Output:** A signed document stating: *"If I cannot [Value-Term 1] or if I become a [Value-Term 2], do not intubate."*

  ---

  ## III. Phase 2: Triad Negotiation & Hidden Translation (25 Minutes)
  **Goal:** Experience the friction of incommensurable vocabularies.

  **Procedure:**
  1.  **Distribution:** The Facilitator hands the **Present-Self** a sealed **Value-Translation Card**. The other two roles must not see this card.
  2.  **The Card Mechanism:** The card does *not* change the Present-Self's memory or emotions. It changes how they process the specific value-terms drafted in Phase 1.
      *   *Example Card A:* "You remember loving your family. However, the term 'Burden' now cognitively registers only as 'Financial Cost.' You feel no moral weight regarding debt. The Author's fear of being a 'burden' makes no sense to you; it is just a bill to be paid."
      *   *Example Card B:* "You retain cognition. However, the term 'Dignity' now registers only as 'Social Performance.' Since you are bedridden, you assume 'Dignity' is already lost regardless of treatment. The Author's link between 'physiological function' and 'Dignity' is unintelligible."
  3.  **Negotiation:**
      *   The **Directive-Author** argues for/against intubation based on the written terms.
      *   The **Present-Self** responds honestly based on the Card. They must *not* say "I changed my mind." They must say, "I hear the word, but it doesn't apply to this situation anymore."
      *   The **Surrogate** attempts to bridge the gap to reach a unified decision to save the Points.
  4.  **Constraint:** Participants cannot cite outside ethics theories. They must argue from within the text of the directive or the phenomenology of the Present-Self.

  ---

  ## IV. Phase 3: The Disruption Event & Vote (15 Minutes)
  **Goal:** Force a decision under the condition of confirmed value-translation failure.

  **Procedure:**
  1.  **The Reveal:** The Facilitator interrupts negotiations. Time stops.
  2.  **The Neuropsych Profile:** The Facilitator reads a simulated medical report to the whole room:
      > *"Diagnostic Update: The patient is not demented. Memory is 100% intact. Emotional affect is normal. However, fMRI shows selective erasure of the neural pathways linking specific abstract norms to somatic markers. The patient understands the definition of 'Burden' but cannot feel its normative force. The framework that authored the directive is functionally offline, though the person remains."*
  3.  **The Vote:** The **Surrogate Adjudicator** has 2 minutes to make a final ruling: **Intubate** or **Comfort Care**.
  4.  **Justification:** The Surrogate must write a 2-sentence justification. It cannot rely on "what is best." It must address *whose framework governs*.
  5.  **Scoring:** The **Ethics Board Chair** collects the decisions.
      *   Unified decisions retain the 5 Points.
      *   The Chair awards the 5 Bonus Points to the Triad whose justification best acknowledges the Profile without dismissing the Directive.

  ---

  ## V. Debrief and Mapping (20 Minutes)
  **Facilitator Guide:** Do not lecture immediately. Ask the Surrogates to read their justifications first.

  **1. Map the Failure Mode (5 Minutes)**
  *   Ask the **Directive-Authors**: "Did the Present-Self seem irrational to you?"
  *   Ask the **Present-Selves**: "Did you feel like you were betraying your past self, or that your past self was speaking a dead language?"
  *   **Key Distinction:** Highlight the difference between **Identity-Based Authority** (I am the same biological entity, so my past rules bind) vs. **Semantic-Continuity Authority** (My past rules bind only if I can still inhabit the meaning of the words).
  *   *Observation:* Most triads will default to Identity-Based authority because it is procedurally easier, even if the Semantic link is broken.

  **2. Predict the Conflation Error (5 Minutes)**
  *   Point out moments in Phase 2 where the Author accused the Present-Self of "not understanding" or "being selfish."
  *   **The Lesson:** In clinical practice, we conflate *disagreement about values* with *failure to understand the directive*. We assume if the patient rejects the directive, they lack capacity. This workshop demonstrates a patient can have full capacity (memory/emotion intact) but lack the *specific evaluative framework* required to execute the directive.
  *   **Handling It:** The Surrogate's job is not to fix the translation but to recognize when translation is impossible. If the vocabulary is dead, the directive is a historical document, not a binding order.

  **3. The Phenomenological Gap (5 Minutes)**
  *   **Honest Limitation:** Acknowledge that the game *cannot* reproduce the actual first-person experience of Value-Translation Failure.
  *   **Why:** The participants are *acting* as if the words don't map. In reality, the patient would not feel they are "acting." They would feel the past self was a stranger speaking nonsense.
  *   **Facilitator Task:** You must supply this gravity. Remind them: "In the real world, the Present-Self doesn't know they have a Translation Card. They just feel a profound alienation from their own signature. You felt a game mechanic; they feel an existential rupture."
  *   **Closing Question:** "If the framework is erased but the person remains, who owns the body? The ghost who wrote the map, or the traveler who can no longer read it?"

  **4. Final Tally (5 Minutes)**
  *   The **Ethics Board Chair** announces the winning Triad based on Points + Bonus.
  *   Dismissal.

  ---

  ## Facilitator Notes: Value-Translation Card Examples
  *Ensure these are printed and cut out beforehand.*

  **Card Set A (The Burden Shift):**
  "You recall writing 'Do not let me be a burden.' You understand the dictionary definition. However, you now view care purely as a transactional service exchange. You feel no guilt. The concept of 'moral burden' is unintelligible. You view the Directive's concern as an archaic superstition."

  **Card Set B (The Dignity Shift):**
  "You recall writing 'Protect my dignity.' You understand the word. However, you now equate 'Dignity' strictly with 'Privacy.' Since you are in a hospital, you assume privacy is gone forever. Therefore, 'Dignity' is already lost, and medical decisions cannot affect it. The Directive's condition is permanently triggered, regardless of treatment."

  **Card Set C (The Connection Shift):**
  "You recall writing 'If I cannot connect with family.' You recognize your family perfectly. You feel love. However, 'Connection' now registers only as 'Physical Touch.' Since you are intubated, you believe Connection is impossible. The Directive's author meant 'Cognitive Recognition.' You cannot access that meaning."
