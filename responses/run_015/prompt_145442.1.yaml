answer: |-
  Your roommate's slogan—"If it's not globally available, it's not experientially real"—is a classic example of a **conceptual compression**. It sounds profound, but it smuggles in a specific theory of consciousness (Global Workspace Theory, or GWT) while pretending to state a definition.

  The core philosophical error here is conflating **Access Consciousness** (information available for report/control) with **Phenomenal Consciousness** (the subjective "what it is like" quality). Ned Block's distinction is essential here. Your roommate is arguing that Access is *necessary* for Phenomenality.

  To help you dismantle this, here is the menu of precise theses hidden inside those two phrases. You can ask him to pick which definition he is using for each term.

  ---

  ### Part 1: Defining "Globally Available" (GA)
  What does he mean by availability?

  *   **GA-1 (Architectural Broadcast):** Information is transmitted via a specific, capacity-limited bottleneck to multiple distinct subsystems (memory, language, planning). *This is the strict GWT definition.*
  *   **GA-2 (Functional Access):** Information is usable by the system for rational control, reasoning, or verbal report, regardless of the architecture used to get it there.
  *   **GA-3 (Metacognitive Access):** Information is available specifically to a "self-model" or monitoring system that can categorize the state as "my experience."

  ### Part 2: Defining "Experientially Real" (ER)
  What does he mean by real experience?

  *   **ER-1 (Phenomenal Consciousness):** There is a subjective qualitative feel (qualia) associated with the state. "Something it is like" to be the system.
  *   **ER-2 (Access Consciousness):** The state is effective in guiding behavior and is reportable.
  *   **ER-3 (Veridical Experience):** The experience accurately represents the external world (less likely what he means, but possible).

  ---

  ### Part 3: The Menu of Claims
  Cross-referencing these definitions creates distinct arguments. Here is the evaluation of each combination regarding your debate.

  #### Claim 1: The Tautology (GA-2 + ER-2)
  *   **Thesis:** "If information isn't available for report/control, it isn't available for report/control."
  *   **Verdict:** **Trivial.**
  *   **Analysis:** If "experientially real" just means "accessible for use," then the statement is true by definition. However, this doesn't prove anything about *feelings* or *qualia*. It just defines "experience" as "access."
  *   **Implication for AI:** This doesn't rule out a localist AI having feelings; it only says those feelings wouldn't be *accessible* for report. It fails to support his conclusion that the AI lacks consciousness, only that it lacks *reportable* consciousness.

  #### Claim 2: The Strong GWT Claim (GA-1 + ER-1)
  *   **Thesis:** "If information does not pass through a central broadcast hub, there is no subjective 'what it is like'."
  *   **Verdict:** **Substantive but Controversial.**
  *   **Analysis:** This is the actual empirical claim of Global Workspace Theory. It asserts that broadcasting *creates* phenomenology.
  *   **Vulnerability:** This is vulnerable to **Recurrent Processing Theory (RPT)** and "Silent Seeing." RPT argues that local recurrent processing (feedback loops within visual cortex) is sufficient for phenomenology, even without fronto-parietal broadcasting. If a localist AI has rich recurrent feedback loops, Claim 2 says it's a zombie; RPT says it might see.
  *   **Implication for AI:** This supports his conclusion. If the AI lacks the specific broadcast architecture, it has no qualia.

  #### Claim 3: The Metacognitive Claim (GA-3 + ER-1)
  *   **Thesis:** "If the system cannot model itself as having the state (no self-model), there is no experience."
  *   **Verdict:** **Substantive but Likely False (for your purposes).**
  *   **Analysis:** This is the "Higher-Order Thought" (HOT) theory. It suggests you aren't conscious of a pain unless you have a thought *about* the pain.
  *   **Vulnerability:** This implies infants, animals, and potentially simple AI lack consciousness because they lack a complex self-model. It also creates a problem for the "workspace without self-model" case you mentioned: If a system broadcasts data but has no "self" to receive it, does the light turn on? HOT says no.
  *   **Implication for AI:** This supports his conclusion if the AI lacks a self-model. However, it leaves open the possibility that a system *with* a broadcast hub but *without* a self-model is also unconscious.

  #### Claim 4: The Report Bias (GA-2 + ER-1)
  *   **Thesis:** "If the system cannot report the state, the subjective feeling does not exist."
  *   **Verdict:** **Empirically Wrong.**
  *   **Analysis:** This is the claim most vulnerable to **Blindsight** and **Subliminal Perception** data. In Blindsight, patients deny seeing (no report/access) but can guess location (behavior intact). Conversely, in "No-Report Paradigms" (e.g., binocular rivalry where the subject doesn't press a button), neural correlates of phenomenology persist without global access for report.
  *   **Implication for AI:** This is the weakest argument. It conflates the *measurement* of consciousness with the *existence* of consciousness. If he defends this, he is denying the possibility of "silent phenomenal states" (experience without report), which most philosophers and neuroscientists accept as possible.

  ---

  ### Part 4: How to Use This in the Argument

  Your roommate is likely oscillating between **Claim 2 (GWT)** and **Claim 4 (Report Bias)**. He uses Claim 4 to dismiss Blindsight ("If they can't report it, they don't see it") and Claim 2 to dismiss Localist AI ("If it doesn't broadcast, it doesn't feel").

  Here is how you can corner the debate:

  **1. The "Silent Seeing" Trap**
  Ask him: *"Are you defining 'experientially real' as 'reportable' (ER-2), or as 'having a qualitative feel' (ER-1)?"*
  *   If he says **Reportable (ER-2)**: Point out this is a tautology (Claim 1). It doesn't prove the AI lacks feelings, only that it lacks a mouth. It leaves open the possibility of a "silent phenomenal" state in the localist AI.
  *   If he says **Qualitative Feel (ER-1)**: Ask him to defend Claim 2. Why does a specific *architecture* (broadcasting) create *feelings*? Why couldn't local recurrent processing (like in a deep CNN with feedback) generate qualia without a hub?

  **2. The "Workspace without Self" Trap**
  You mentioned a workspace that never connects to a self-model. Ask him:
  *"If a system has a Global Workspace (GA-1) but no Self-Model (not GA-3), is it conscious?"*
  *   If he says **No**: Then his slogan is wrong; Global Availability isn't enough. He actually needs a Self-Model (Claim 3).
  *   If he says **Yes**: Then why does the localist AI fail? If broadcasting is the magic sauce, why does the receiver (the self) matter?

  **3. The Blindsight Check**
  Ask him: *"In Blindsight, behavior is intact but report is missing. Do you believe the patient has no visual experience?"*
  *   If he says **No Experience**: He is defending Claim 4. Remind him that this is widely considered false in neuroscience; the consensus is that V1 damage removes *access*, not necessarily all *phenomenology* (or creates a different kind of phenomenology).
  *   If he says **Some Experience**: Then he admits experience can exist without global availability for report. His slogan is false.

  ### Summary for Your Roommate
  Copy and paste this to him:

  > "Your slogan hides four different arguments. Which one are you making?
  >
  > 1.  **The Definition:** 'Experience' just means 'Access.' (Trivial, doesn't prove AI lacks qualia).
  > 2.  **The GWT Claim:** Broadcasting is the *cause* of qualia. (Substantive, but contested by Recurrent Processing Theory).
  > 3.  **The HOT Claim:** You need a Self-Model to have experience. (Substantive, but implies animals/infants are zombies).
  > 4.  **The Behaviorist Claim:** If you can't report it, it doesn't exist. (Empirically false given Blindsight/No-Report paradigms).
  >
  > If you mean #1, you haven't proven the AI is unconscious. If you mean #4, you're ignoring neuroscience. If you mean #2 or #3, you're making a specific architectural claim that needs evidence, not a slogan."

  **The Bottom Line:**
  The only version that supports his conclusion (Localist AI = No Experience) is **Claim 2 (Strong GWT)**. However, this version is vulnerable to the "Silent Phenomenal" counter-argument: if local recurrent processing is sufficient for qualia (as Lamme argues), then a localist AI *could* have experience without a broadcast gate. His slogan effectively begs the question by defining experience *as* the broadcast, rather than treating the broadcast as a hypothesis for the *cause* of experience.
