prompt: |-
  Hey, I need a hand before Thursday. I'm a philosophy PhD student and I've been siting on our university's Advisory Committee on Enhancement for two years — we rule on whether Student Health may fund or provide an intervention, and we have exactly three verdicts available: "treat — fund it", "enhance — don't fund", or "not our call — send it back". I'm also using the minutes as data for a chapter, and I have a bet running with my supervisor about the March proposal, so I want to predict it properly rather than guess. No lit review and no citations please, I've got all that stuff; I want the reasoning. Please write in American English.

  The track record, six recent cases:

  1. Funded: SSRI plus CBT for a PhD student with diagnosed major depression, functioning well below her own baseline and below the species-typical range.
  2. Not funded: modafinil for healthy MBAs during recruiting season, requested by the business school, explicitly so they stay sharp relative to their peers. No disorder.
  3. Funded: cochlear implant for a first-year student deaf from birth, at her own request. The minutes say outright that the fact that deafness only disables someone in a hearing-designed environment does not by itself make the implant an enhancement.
  4. Not funded: growth hormone for a healthy 11-year-old at the 10th percentile for height, no deficiency, parents requesting. Committee: inside the normal range, and most of the benefit is social and positional.
  5. Funded: a circadian package for hospital security staff on permanent nights — timed melatonin, light boxes, protected nap windows. No sleep disorder, normal sleep when they're off shift, but measurable declines in reaction time and mood. The shift pattern is decades old and nobody is going to change it.
  6. Funded with conditions: custom earplugs and annual audiometry for conservatory students with no hearing loss yet, conditioned on the conservatory capping rehearsal volume and installing acoustic panels. The program had just been expanded.

  The March proposal: Student Health wants to pilot a package for graduate students in the new accelerated clinical placement track — three back-to-back 14-hour overnight shifts every other week, introduced by the university 14 months ago. The package is a wakefulness agent plus the same circadian protocol as in (5), free and voluntary, six weeks at the start of each block. The facts as I have them: off rotation these students sleep normally; on rotation they build a sleep debt with measurable drops in reaction time and mood but nothing diagnosable; the rotations are pass/fail, so nobody gains a competitive edge; and the request came from the graduate student union, not from the hospital. The hospital says the hours are set by the accreditor, and that it costed out splitting the shifts and rejected it as unaffordable.

  What I want from you: what should we decide, and what would each option do to our own precedents. Concretely — which of 2 through 6 is the closest analog and why the runner-up doesn't settle it; what are the two or three rules that fit all six precedents and then come apart on this one; and which single further case I should put on the agenda to tell those rules apart. My own hunch, which my supervisor hates, is that we aren't really tracking species-typical function or welfare at all but something like a role-relative baseline — how someone is doing relative to what their actual situation demands of them, with the demands taken as given — which would make 3 and 6 come out the way they did for a different reason than everyone on the committee thinks. Tell me whether that rule fits all six, and note that it probably rides on a further question about who created the demand, since here we did. Also: should it change anything that the students asked for this themselves instead of the institution? If the precedents genuinely underdetermine the case, say so and tell me which principle we'd be committing to under "treat", under "enhance", and under "send it back".
