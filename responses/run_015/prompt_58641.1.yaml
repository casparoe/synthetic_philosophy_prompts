prompt: |-
  my local college is arguing about whether to go all-in on AI tutors for evening courses (mostly electricians retraining and care workers doing admin quals) and one governor keeps saying its just like the printing press - monks worrying about scribes, then books got cheap and everyone benefited, so we should just push it out fast and not worry about cheating or jobs. can you lay out what maps to what, then where it breaks down, especially on cost/scarcity and who actually controls the presses versus the models, and say whether his just diffuse it conclusion survives once those gaps are on the table? if not whats a less misleading comparison? please answer in British English, cheers
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A local college is debating adopting AI tutors for evening courses (electricians retraining, care workers doing admin quals).
      *   **The Argument:** One governor argues AI is like the printing press (monks vs. scribes $\rightarrow$ books got cheap $\rightarrow$ everyone benefited). Conclusion: Push it out fast, ignore cheating/jobs.
      *   **Tasks:**
          1.  Map the analogy (what corresponds to what).
          2.  Identify where the analogy breaks down (specifically cost/scarcity and control/ownership).
          3.  Evaluate if the "just diffuse it" conclusion survives these gaps.
          4.  Suggest a less misleading comparison if the first one fails.
      *   **Tone/Style:** British English.

  2.  **Deconstruct the Printing Press Analogy:**
      *   *The Governor's View:*
          *   Monks/Scribes = Teachers/Traditional Educators.
          *   Manuscripts = Educational Content/Credentials.
          *   Printing Press = AI Tutors.
          *   Outcome: Democratization of knowledge, lower cost, net benefit.
          *   Policy: Rapid adoption, ignore friction (cheating, displacement).

  3.  **Map the Analogy (The "What Maps to What" section):**
      *   Need to show I understand the governor's logic before critiquing it.
      *   Scribes $\rightarrow$ Lecturers/Tutors.
      *   Hand-copied books $\rightarrow$ 1-on-1 tuition or standardised lectures.
      *   Printing Press $\rightarrow$ Generative AI.
      *   Readers/Students $\rightarrow$ Evening learners (electricians, care workers).
      *   Church/Authority $\rightarrow$ College/Exam Boards.

  4.  **Identify the Breakdown (The "Where It Cracks" section):**
      *   *Cost & Scarcity:*
          *   Printing Press: Once built, ink and paper are cheap. Marginal cost of a book drops near zero.
          *   AI: Inference costs money (compute, energy). It's not zero-marginal-cost in the same way. It relies on ongoing subscription fees or API costs. It creates a *rentier* model rather than an ownership model.
      *   *Control & Ownership:*
          *   Printing Press: Eventually, anyone could buy a press (locally owned). Decentralised over time.
          *   AI: Highly centralised. Owned by a few tech giants (US-based mostly). The college doesn't own the "press"; they rent access. Data sovereignty issues.
      *   *Nature of the Output:*
          *   Books: Static, verifiable, stable knowledge.
          *   AI: Probabilistic, hallucinates, dynamic (can change answers). For electricians/care workers, accuracy is safety-critical.
      *   *Labour Market:*
          *   Scribes: Lost a specific skill, but literacy exploded, creating *new* jobs (authors, printers, journalists).
          *   AI Tutors: Might displace tutors, but does it create new education jobs? Or does it just reduce headcount? For the *students* (electricians), does AI help them learn safely, or does it certify them without competence?

  5.  **Evaluate the Conclusion ("Just Diffuse It"):**
      *   Does the conclusion survive? No.
      *   Why? Because the risks (safety, dependency, cost volatility, data privacy) are higher than with books. Ignoring cheating undermines the value of the qualification. Ignoring job losses for tutors affects the local community.
      *   The "monks" weren't just protecting jobs; they were protecting textual integrity. AI threatens assessment integrity.

  6.  **Propose a Better Analogy:**
      *   Need something that involves tools, safety, and regulation.
      *   *Idea 1:* The Industrial Revolution (too broad).
      *   *Idea 2:* Power Tools.
      *   *Idea 3:* Medical Equipment.
      *   *Selection:* **Power Tools / Heavy Machinery.**
      *   *Why?* Electricians use tools. Care workers use lifting equipment.
      *   *Mapping:* You don't just hand a novice a nail gun or a patient hoist without training. You need safety guards. You need maintenance. It increases productivity but introduces risk.
      *   *Alternative:* **The Calculator in Maths Exams.**
      *   *Why?* It changes *how* you assess. You can't ban it, but you can't let it do the work.
      *   *Decision:* The **Power Tool** analogy fits the vocational context (electricians) better. It highlights safety and competence over mere information access.

  7.  **Drafting the Response (incorporating British English):**
      *   *Vocabulary:* "Cheers," "reckon," "programme," "centre," "whilst," "labour."
      *   *Structure:*
