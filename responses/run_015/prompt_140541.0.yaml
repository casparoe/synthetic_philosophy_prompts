order claim produces a regress, a contradiction, or nothing worse than the benign self-exemption that any contextualist needs; what I'll call the toleration gap, whether non-absolutism about truth yields intellectual toleration or nonviolence in belief on its own, or whether that popular reading needs an extra normative premise the texts do not obviously supply; and, underneath all of these, whether anekāntavāda even names a single stable doctrine across its sources rather than a family of loosely related ones, which would cap how confident any reconstruction can be. A number and one line of justification for each, then say how they combine — I'd especially like to know which terms are not independent, since several look like they move together — and then tell me which single term your headline number is most sensitive to.

