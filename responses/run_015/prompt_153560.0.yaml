  2.  **Deconstruct the Analogy (Brainstorming/Correspondence Table):**
      *   *Driver Case:* Absent-minded driver, route home, traffic signals, "waking up" at driveway, consciousness (or lack thereof), responsibility.
      *   *Autopilot Case:* Autopilot computer, flight plan, sensors, human pilot (engaging system), retaking control, subjective experience (none).
      *   *Mapping:*
          *   Autopilot Computer $\rightarrow$ Driver's Subconscious/Procedural Systems.
          *   Pre-programmed Flight Plan $\rightarrow$ Habitual Route/Schema.
          *   Sensor Array $\rightarrow$ Driver's Sensory Perception (Vision, Proprioception).
          *   Human Pilot (Engaging System) $\rightarrow$ Driver's Prior Intention (leaving work, deciding to go home).
          *   Retaking Manual Control $\rightarrow$ "Waking up" at driveway.
          *   Missing Conscious State $\rightarrow$ Phenomenal Consciousness during the drive.

  3.  **Identify Fracture Points (Critical Analysis):**
      *   *Embodied Intentionality:* The driver isn't just processing data; they are *in* the world. Merleau-Ponty's "body schema." The autopilot is distinct from the plane; the driver *is* the car-driver system in a phenomenological sense.
      *   *Error Correction/Plasticity:* Autopilots follow rigid logic (if X, then Y). Drivers handle novel obstacles (a ball rolling into the street, a detour) without "waking up." This implies high-level cognitive monitoring without phenomenal awareness, or a different *kind* of awareness.
      *   *Homeostasis/Affect:* Drivers have stakes. Fear, boredom, urgency. Autopilots have no skin in the game. This affects moral responsibility.
      *   *Normative Structure:* We blame the pilot for *engaging* the autopilot in bad conditions. Do we blame the driver for *entering* the habitual state? Usually, no. We hold them responsible for the driving itself (e.g., if they hit someone while absent-minded). This suggests the "automatic" state doesn't absolve agency.

  4.  **Hidden Commitments:**
      *   *Design Intentionality:* The autopilot has goals *given* by engineers. The driver has intrinsic goals.
      *   *External Programming:* Autopilot code is static (until updated). Driver habits are dynamic, learned, and self-reinforcing.
      *   *Lack of Learning:* Autopilots don't learn from the specific landing in real-time to change their core architecture. Drivers do (habituation).

  5.  **Assess the Conclusion:**
      *   The students argue: Consciousness is irrelevant to responsibility.
      *   Counter-argument: Responsibility tracks *guidance control* (Fischer & Ravizza), not just phenomenal consciousness. The driver retains guidance control even without phenomenal awareness. The autopilot has *no* control, only causal determination. Therefore, the analogy fails to prove consciousness is irrelevant; it proves that *phenomenal* consciousness might be distinct from *agential* control. But since the driver has control and the autopilot doesn't, we can't equate them to dismiss responsibility.

  6.  **Propose a Better Analogy:**
      *   *Skilled Musician (Jazz Improvisation):* High skill, low reflective consciousness, but deeply agential and responsive. Captures the "flow" state better than "automation."
      *   *Sleepwalking:* Captures the lack of consciousness, but fails on responsibility (we don't blame sleepwalkers).
      *   *Selection:* The Skilled Musician/Athlete in "Flow." It preserves agency while minimizing reflective consciousness.

