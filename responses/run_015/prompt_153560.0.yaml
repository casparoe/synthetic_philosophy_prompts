  *(Final check on Conclusion)*: Does consciousness matter? The analogy suggests it doesn't. My analysis should show that *phenomenal* consciousness might not be needed for *control*, but *agency* is still present in the driver (unlike the autopilot), so responsibility remains. The students' leap from "autopilot has no responsibility" to "driver has no responsibility" is the weak link.

