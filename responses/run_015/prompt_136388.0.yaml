  2.  **Deconstruct the Framing (Authoritative Assent & Proportional Accountability):**
      *   *Authoritative Assent:* Voting isn't just "I want X" or "I support democracy." It's "I authorize this collective decision." This implies responsibility for the outcome.
      *   *Proportional Accountability:* If I vote, does my voice actually count towards the final policy mix? If the system is gerrymandered, rigged, or dominated by money such that my vote changes nothing *and* the winner doesn't reflect the aggregate will, the "co-authorship" is a lie.
