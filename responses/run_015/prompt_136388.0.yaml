answer: |-
  **Title:** The Conditions of Co-Authorship: Authoritative Assent and the Contingent Duty to Vote

  **Introduction**

  The standard literature on the ethics of voting often finds itself trapped in a binary oscillation. On one side stands the instrumentalist, who calculates the probability of a single ballot altering an election outcome and, finding it negligible, concludes that voting is irrational or morally optional. On the other stands the expressivist, who argues that voting is a ritual of civic solidarity, valuable regardless of its causal efficacy. Both accounts, however, fail to capture the specific normative texture of democratic participation. The instrumentalist ignores the symbolic weight of authorization, while the expressivist risks reducing voting to an empty gesture that can legitimize unjust outcomes simply by participating in them.

  To resolve this impasse, we must adopt the framing of *authoritative assent*. This concept posits that casting a vote is not merely registering a preference or performing a ritual, but performing a minimal act of co-authorship in collective decisions. This act carries normative weight only when the electoral system exhibits *proportional accountability*—that is, when the translation of votes into policy outcomes does not systematically nullify or dilute the preferences of participants who act in good faith. On this view, the moral status of voting depends jointly on the voter's intentions and on whether the institutional context preserves the reciprocal link between assent and result. This essay argues that a qualified moral duty to vote for the lesser evil holds precisely under conditions of proportional accountability. Where such accountability is absent due to structural distortion, the duty dissolves, and abstention or refusal becomes the ethically coherent response.

  **The Failure of Instrumental and Expressive Accounts**

  The instrumental argument against voting rests on the "paradox of voting": in a large-scale election, the likelihood of a single ballot being decisive is statistically vanishing. If the moral obligation to vote derives solely from the capacity to prevent harm or secure good outcomes through causal leverage, then no such obligation exists for the individual voter. However, this view misunderstands the nature of democratic authority. Democracy is not a market mechanism where influence is purchased in proportion to marginal utility; it is a system of collective authorization. To reduce voting to causal efficacy is to ignore that the legitimacy of the government rests on the *aggregate* act of assent, not the pivotality of the individual.

  Conversely, the expressive argument contends that voting affirms democratic values independently of the outcome. While this rescues voting from the paradox of pivotality, it introduces a different moral hazard: complicity. If voting is merely an expression of solidarity, one could theoretically vote for a morally objectionable candidate to "support the process," thereby laundering the candidate's authority through one's own civic participation. In scenarios where every candidate is morally flawed, pure expressivism offers no guidance on how to distinguish between responsible participation and unjustified complicity in wrongdoing. It treats the ballot as a badge of membership rather than a tool of governance.

  **Authoritative Assent and Proportional Accountability**

  The framework of authoritative assent bridges this gap by linking the internal intention of the voter to the external reality of the institution. To vote is to say, "I accept this process as a legitimate means of generating binding rules, and I accept responsibility for the outcome." This is a claim of co-authorship. However, co-authorship implies a degree of control. If an architect signs off on a building but the builders ignore the blueprints and construct something dangerous, the architect's signature is not an act of authorship; it is a fraud.

  Similarly, in a democracy, the voter's assent is morally binding only if the system respects the *proportional accountability* of that assent. This does not strictly require a proportional representation electoral system, though such systems often facilitate it. Rather, it requires that the aggregate will of the voters translates into policy outcomes without systematic nullification. If a voting bloc consistently votes for a platform that is subsequently ignored due to the influence of money, gerrymandering, or unresponsive elites, the link between assent and result is severed. In such contexts, the voter is not a co-author but a prop in a theatrical display of legitimacy.

  Therefore, the moral weight of the vote is contingent. It is not an inherent duty of citizenship, but a reciprocal obligation triggered by institutional integrity. When the institution honors the vote, the citizen owes the institution their participation to sustain the collective project. When the institution dishonors the vote, the citizen owes it nothing but scrutiny.

  **The Lesser Evil and the Problem of Complicity**

  This framework provides a rigorous method for evaluating the "lesser evil" dilemma. In elections where all candidates are morally objectionable, the instrumentalist sees no point (since the margin of harm reduction is small per vote), and the expressivist sees a duty to participate regardless. The authoritative assent model asks a different question: *Does voting for the lesser evil constitute a meaningful act of damage limitation within a system that respects our agency?*

  If proportional accountability is present, voting for the lesser evil is an act of responsible co-authorship. It acknowledges that while the available options are flawed, the mechanism for selecting them is functional enough that the aggregate preference will constrain the winner's behavior. Here, the voter accepts partial responsibility for the lesser evil's administration to prevent the greater evil, operating under the assumption that their continued engagement preserves the leverage to demand better options in the future. The "dirtiness" of the hands is justified by the reality of the co-authorship; the voter is actively steering a flawed ship rather than abandoning it to a worse captain.

  However, if proportional accountability is absent, voting for the lesser evil transforms into unjustified complicity. If the electoral system is structurally distorted such that the winner will govern identically regardless of the margin, or if the "lesser evil" is structurally bound to enact harmful policies due to external pressures (e.g., corporate donors, geopolitical constraints) that the vote cannot alter, then the ballot does not limit harm. It merely legitimizes it. In this scenario, casting a vote is an act of false authorship. It signals consent to a process that is known to be unresponsive. Under authoritative assent, one cannot be morally obligated to authorize a lie.

  **Structural Distortion and the Dissolution of Duty**

  The critical test of this theory lies in its application to structurally distorted electoral systems. Many modern democracies suffer from significant deficits in proportional accountability: extreme gerrymandering that renders general elections moot, campaign finance regimes that allow wealth to veto popular policy, or electoral colleges that disconnect the popular will from executive power.

  In these contexts, the moral duty to vote becomes illusory. If a voter knows that their demographic is systematically diluted, or that the policy platform they assent to will be nullified by a minority veto, the condition of reciprocal link is broken. To vote in such a system is not to exercise co-authorship but to participate in one's own marginalization. Here, abstention or protest voting is not an act of civic apathy, but a morally superior form of engagement. It is a refusal to grant authoritative assent to a system that does not deserve it. By withholding the legitimacy that voting confers, the citizen exposes the deficit in accountability.

  This does not imply a permanent nihilism. The duty to vote is suspended, not abolished. It awaits the restoration of proportional accountability. The ethical burden, therefore, shifts from the individual voter to the structural architects of the democracy. It is not the citizen's failure to vote that degrades democracy; it is the degradation of democracy that releases the citizen from the duty to vote.

  **Conclusion**

  The question of whether there is a moral duty to vote in large-scale elections cannot be answered by looking at the ballot in isolation. It requires an examination of the machinery that counts it. By adopting the framework of authoritative assent, we see that voting is a claim of co-authorship that demands a reciprocal link of proportional accountability.

  Consequently, we must defend a definite, conditional conclusion: A qualified duty to vote for the lesser evil holds precisely under conditions of proportional accountability. In such systems, voting is an act of responsible stewardship over collective power, even when the options are flawed. However, in structurally distorted systems where proportional accountability is absent or severely weakened, the duty is illusory. In those cases, casting a vote amounts to unjustified complicity in a sham of self-governance. There, the ethically defensible act is the refusal to vote, serving as a testament that democratic legitimacy is earned through responsiveness, not demanded through ritual. The moral imperative is not simply to vote, but to ensure that the vote means something.
