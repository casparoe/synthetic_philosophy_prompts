      *   *Can (1) be quarantined?* Only if you distinguish "perception by a mind" (ontological) from "phenomenal consciousness" (qualitative). Berkeley tends to identify them. The User needs to drive a wedge between *esse est percipi* (existence depends on mind) and *esse est sentiri* (existence involves feeling).
