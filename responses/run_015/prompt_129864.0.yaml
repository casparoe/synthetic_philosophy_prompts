  1.  **Deconstruct the User's Package:**

      *   **(1) Berkeley's Master Argument (Strong Form):** To be is to be perceived (*esse est percipi*). Attempting to conceive of an unperceived object makes it perceived (by the conceiver). Therefore, nothing exists independently of all perception.
