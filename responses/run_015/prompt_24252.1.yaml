  (d) **Closest Analog and Dependency**
  **Call 4 (Prawn Harvest)** is the closest analog regarding the *welfare status* of the animal. It establishes the precedent that crustaceans may be harvested and killed without stunning based on the view that they do not feel pain. **Call 5 (Lobster Transport)** is the closest analog regarding the *slaughter method* (boiling), but its rejection was explicitly decoupled from the boiling itself ("even if we grant that the boiling itself is quick").
  *   **Dependency:** If the panel is running **Taxonomic Dualism**, Call 4 controls, predicting approval. If the panel is running **Total Duration of Stress**, Call 5 controls the *method* logic (boiling is okay) while Call 4 controls the *species* logic (brief handling is okay), also predicting approval. If the panel shifts to a **Precautionary Principle** due to the pain split, Call 3 (Trout Ice-slurry) becomes the analog for "conscious death without stunning," predicting rejection.

