  The past calls underdetermine the outcome because the panel has not consistently resolved the crustacean pain uncertainty. Call 4 resolved it by exemption; Call 2 resolved similar uncertainty by flagging.
  *   **If the panel approves:** They are adopting the principle that **taxonomic exemption overrides pain uncertainty** for crustaceans, solidifying Call 4 as the governing precedent over Call 2's precautionary flag.
