  (a) **Apparent Rules**
  The panel's six prior calls suggest a primary rule of **Taxonomic Welfare Dualism**: vertebrates (salmon, trout, catfish) are accorded protection against conscious suffering and stress (Calls 1, 3, 6), requiring stunning or anesthesia, whereas crustaceans (prawns, lobsters) are exempt from stunning requirements based on a presumption of insentience regarding pain (Call 4). However, a secondary rule applies to crustaceans: **Pre-Slaughter Stress Minimization**. While pain during slaughter may be exempted, prolonged stress prior to slaughter is not (Call 5 rejects lobsters due to transport stress, not the boiling itself). Call 2 (CO2) adds a nuance that uncertainty about aversive reflexes warrants a "flag" but not necessarily rejection if the method is otherwise effective.

  (b) **Alternative Rules**
  An alternative rule that fits all six calls is **Total Duration of Conscious Stress**. Under this rule, any practice is approved if the duration of conscious stress is minimized, regardless of taxonomy.
  *   Fits 1, 6: Stress minimized via stunning/anesthesia.
  *   Fits 3: Rejected because alertness (stress) duration was long.
  *   Fits 4: Approved because handling was "brief."
  *   Fits 5: Rejected because transport was "long."
  *   Fits 2: Approved but flagged because duration was "slower" than percussion.
  This rule explains the outcomes without requiring a hard taxonomic split, relying instead on a utilitarian calculation of stress time.

  (c) **Predictions for the Crab Case**
