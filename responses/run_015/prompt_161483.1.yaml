  6.  **Addressing Specific Constraints & Risks:**
      *   *Risk: Someone solves the long chain.* Mitigation: Make the chain *long enough* (20 steps) but the time *short enough* (5 mins). Or make it a "search" problem in a graph that looks dense.
      *   *Risk: "Can't Tell" spamming.* Mitigation: Penalty for "Can't Tell" if it turns out to be derivable? No, that punishes caution. Better: Reward "Confidence." Or simply highlight in debrief that "Can't Tell" is the rational response, but LO says it's wrong.
      *   *Risk: Spotting the rephrase.* Mitigation: Use natural language variations that aren't obvious synonyms. "A is taller than B" vs "B is shorter than A" is too easy. "The successor of the predecessor of X is X" vs "X is identical to X". Let's use the genealogy example: "X is an ancestor of Y" vs "Y is a descendant of X".
      *   *Risk: Awareness shouting.* Mitigation: Validate them! "Exactly! You weren't aware of the proposition."
      *   *Friend's "Normative" Move:* To make this pay rent, the scoring criteria must be presented as the *definition of knowledge* for the game. If they fail, they "don't know." If the friend argues "But they *should* have known," point to the empty candy bowl. "If Knowledge = Should, then Knowledge is useless for describing behavior."

  7.  **Developing the Content (The Codex):**
      *   Domain: **The Kingdom of Syntax.**
      *   Facts: 20 statements about relations (e.g., "The Duke owes the Baron," "If A owes B and B owes C, A owes C").
      *   Queries:
          1.  *Chain:* Duke -> ... -> Peasant. (Resource bound).
          2.  *Tautology:* "The Duke owes the Duke" (if reflexive) or something logically true but not in text.
          3.  *Frame:* "A owes B" vs "B is owed by A".
          4.  *Awareness:* "The Duke is rich." (Not in text, requires external assumption, or a hidden rule on the back of the page). Let's go with a hidden rule on the back of the page that only half get. No, user said "background fact half the room wasn't given." Okay, hand out two versions of the booklet (Red/Blue). Red has Fact X, Blue doesn't. Both get queried on Fact X's consequence.

  8.  **Structuring the Debrief:**
      *   Map Game Moments to LO components.
      *   Address the Friend's objection directly using the game data.
