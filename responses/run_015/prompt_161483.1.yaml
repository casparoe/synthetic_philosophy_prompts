  9.  **Refining the "Payoff Scheme" for the Friend:**
      *   The user wants the friend's "normative" move to pay rent *during* the activity.
      *   *Idea:* In Round 2, announce a "Normative Bonus." If you answer based on what you *should* have known (even if you guessed), you get points. But how to verify?
      *   *Better Idea:* The "Audit." After the game, pick one player (the Friend). Ask him to justify his "Unknown" answers using the normative standard. If he says "I should have known," ask him to derive it *now* on the board. If he takes time, he proves resource bounds matter. If he can't, he proves it's not just resources.
      *   *Best Idea:* The "Ideal Score." Calculate everyone's score based on Logical Closure. Show that the "Ideal Score" is 100% for everyone. Then show actual scores are 60%. The gap is the "Omniscience Debt." Ask the friend: "Is this debt irrationality, or is the metric wrong?"

  10. **Final Polish:**
      *   Ensure tone is appropriate (academic but playful).
