  **MEMORANDUM**

  **TO:** Publications and Ethics Committee, Ridgeway Endangered Language Archive
  **FROM:** [Your Name]
  **DATE:** 12 February 2024
  **SUBJECT:** Decision Memo: Tsemak Corpus Publication Strategy

  **RECOMMENDATION**
  I recommend we **publish a gloss explicitly labelled as one manual among several with a review clause.** We will deliver the grant requirement by 31 March to secure funding for the Heritage Council's Saturday school, but we will frame the lexicon as a "Working Version 1.0" rather than a fixed canonical authority. This approach balances the community's urgent material needs against the linguistic integrity Marta defends, while mitigating the ethical risk of locking in potentially arbitrary glosses.

  **Context and Stakes**
  The stakes are immediate and material. Our national heritage grant requires an "authoritative Tsemak–English reader and lexicon" by 31 March. Failure to deliver results in the reversion of remaining funds, directly cancelling the materials budget for the Tsemak Heritage Council's Saturday-school programme. We have three surviving speakers, all elderly. Delaying to resolve theoretical disputes effectively chooses to prioritize philosophical purity over community resource security. We cannot afford to lose this funding.

  **Marta's Position and Conflict of Interest**
  Marta's refusal to sign off on a canonical glossary is not merely obstructionist; it rests on a robust philosophical argument regarding the indeterminacy of translation. She argues that behavioral evidence (what speakers say and do) cannot uniquely determine meaning (whether a word refers to a "rabbit" or a "rabbit-stage"). She is correct that empirical data underdetermines theory. However, while multiple translation manuals can be empirically adequate, the school requires one functional tool to teach children.

  Regarding her monograph contract: we must handle this transparently. Marta benefits professionally from highlighting this indeterminacy. I propose we acknowledge her expertise but require that the Committee, not Marta, assumes final responsibility for the publication decision. This separates her intellectual contribution from the institutional authority of the Archive. We should not dismiss her principle, but we must not allow it to veto community needs.

  **The Heritage Council's Proposal**
  The Council suggests selecting the manual that yields the greatest number of true English sentences when applied to the corpus. While pragmatic, this does not solve the problem Marta identifies. As Marta notes, rival manuals can account for all true sentences equally well while differing in meaning. A "truth-maximising" rule ensures empirical adequacy, not semantic uniqueness. Therefore, this rule does not break the theoretical tie. However, we should accept the Council's intent: they need a usable text, not a philosophical treatise. We will adopt their utility focus without claiming it resolves the linguistic indeterminacy.

  **The Lock-In Counter-Argument**
  The strongest argument against my recommendation is the "lock-in" effect. One committee member rightly notes that printing any version, regardless of footnotes, creates authority. Once printed, this glossary becomes the source for worksheets, machine-learning scrapers, and future dictionaries. A disclaimer in the introduction may not prevent users from treating the text as definitive. This is a serious ethical risk. If we publish "Version 1.0," users may still treat it as *the* dictionary.

  To mitigate this, we must couple the print run with a digital archive commitment. We will publish the primary gloss for the school, but we will also deposit Marta's alternative transcriptions and notes in the open-access digital archive alongside the printed text. This ensures future researchers see the variability. We cannot undo the lock-in entirely, but we can ensure the door remains open for revision.

  **Action Plan and Timeline**
  To meet the 31 March deadline, we must adhere to the following schedule:

  *   **15 February:** Committee vote on this memo.
  *   **20 February:** Marta finalizes the "Working Version" manuscript with the required disclaimer language regarding indeterminacy.
  *   **1 March:** Heritage Council reviews the layout for school usability.
  *   **15 March:** Final files sent to print.
  *   **31 March:** Delivery to grant administrators and Heritage Council.

  **Conclusion**
  We are navigating a conflict between theoretical accuracy and practical survival. By publishing a labelled manual with a review clause, we acknowledge that translation is imperfect without depriving the Tsemak community of the resources they need to sustain their language. We save the funding, respect Marta's expertise without yielding to paralysis, and remain honest about the limitations of our own authority.

  Please review this recommendation before Thursday's meeting. I look forward to discussing the specific wording of the disclaimer.
