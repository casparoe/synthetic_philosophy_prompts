answer: |-
  Here is the breakdown. I'm going to treat norms as equilibrium selection devices. The question isn't "what is moral?" but "what enforcement mechanism sustains the cooperative equilibrium without generating excessive policing costs or perverse selection?"

  ### Part 1: Candidate Principles (The Reject Pile)

  Before settling on the one I defend, here are three natural candidates that fail your specific tension (Speeding vs. Citations vs. Handwashing).

  **Candidate 1: The Direct Harm Principle**
  *   *Definition:* Enforce tightly only if the specific instance of violation causes measurable harm to a specific individual.
  *   *Why it fails:* It dies on **Handwashing** and **Citations**. In your examples, a single instance of skipped handwashing or a sloppy citation causes no *immediate, observable* harm to a specific customer or grader. Yet you want them enforced. This principle is too atomistic; it ignores systemic risk and institutional integrity.

  **Candidate 2: The Visibility (Legibility) Principle**
  *   *Definition:* Enforce tightly only if the violation is easily observable by peers or victims.
  *   *Why it fails:* It dies on **Handwashing**. You want this enforced most strictly, yet it is invisible to the customer. If you tie enforcement to visibility, you get zero compliance in the kitchen. Conversely, it might over-enforce **Bins/Lawn**, which are highly visible but low-stakes.

  **Candidate 3: The Consent Principle**
  *   *Definition:* Enforce tightly only if the affected parties did not consent to the risk/interaction.
  *   *Why it fails:* It struggles with **Speeding**. By using the road, I implicitly consent to the traffic system. It also struggles with **Citations**. The grader consents to read the essay. This principle can't distinguish between *assumed risk* (driving) and *betrayal of trust* (plagiarism/hygiene).

  ***

  ### Part 2: The Defended Principle

  I defend **The Verification Gap Principle**.

  **The Core Mechanism:**
  Norm tightness should scale inversely with the beneficiary's ability to verify compliance, and directly with their reliance on that compliance for safety or truth.

  **The Formula:**
  $$ \text{Enforcement Tightness} \propto \frac{\text{Reliance on Compliance}}{\text{Ability to Verify Compliance}} $$

  **The Clauses:**

  1.  **The Institutional Trust Clause (High Reliance / Low Verification):**
      *   *Mechanism:* When a beneficiary *must* rely on a provider for safety or truth but *cannot* verify it without prohibitive cost, the rule must be **Tight** and enforcement must be **Institutional** (not social).
      *   *Motivating Cases:* **Handwashing** (Customer relies on safety, can't see kitchen); **Citations** (Grader relies on academic integrity, can't fact-check every claim).
      *   *Verdict:* Enforce to the hilt. The "harm" isn't the single instance; it's the decoupling of the signal (the essay/meal) from the reality (truth/hygiene). If this decouples, the institution collapses.

  2.  **The Asymmetric Risk Clause (High Reliance / High Verification):**
      *   *Mechanism:* When a violation imposes immediate costs on non-consenting others who *can* see the violation, the rule should be **Tight** but enforcement can be **Social**.
      *   *Motivating Cases:* **Queue-jumping**, **Loud Music**, **Dog off-leash**.
      *   *Verdict:* Sanction hard. The victim can identify the violator, so social shaming/sanctioning is low-cost and effective.

  3.  **The Negligible Drift Clause (Low Reliance / High Verification):**
      *   *Mechanism:* When the harm is aesthetic or probabilistic with low stakes, and verification is easy, the rule should be **Loose**. Tight enforcement here triggers **Sorting Drift** (your half-baked idea #2): it selects for petty compliance rather than actual value.
      *   *Motivating Cases:* **Bins/Lawn**, **Speeding (10 over, empty)**.
      *   *Verdict:* Tolerate. Enforcing these creates "rule-worshippers" without increasing safety or welfare.

  4.  **The Legibility Constraint (Your half-baked idea #1):**
      *   *Mechanism:* Legibility determines *who* enforces, not *if*.
      *   *Application:* If a rule is vital (Handwashing) but illegible to peers, enforcement *must* shift to institutions (health inspectors) rather than neighbors. If you rely on social enforcement for illegible rules, you get paranoia and false accusations.

  **Reconciling Your Tension:**
  *   **Speeding (Empty Road):** Reliance is near zero (no other drivers). Verification is high (visible). Falls under *Negligible Drift*. Tolerate.
  *   **Citations:** Reliance is High (degree value). Verification is Low (grader can't check everything). Falls under *Institutional Trust*. Punish.
  *   **Handwashing:** Reliance is High (health). Verification is Low (invisible). Falls under *Institutional Trust*. Enforce strictly (via inspections, not customer complaints).

  ***

  ### Part 3: Verdicts on New Cases

  1.  **Mandatory cameras-on for internal remote meetings:**
      *   *Analysis:* Reliance is Low (audio/screenshare usually suffice for work). Verification is High (you can see if they are there). Privacy cost is High.
      *   *Verdict:* **Loose / Do Not Enforce.** This triggers Sorting Drift. It selects for employees with good backgrounds/lighting, not productive workers. It solves a verification problem (are they at the desk?) that shouldn't exist in a results-oriented culture.

  2.  **Households required to clear snow off the pavement:**
      *   *Analysis:* Reliance is High (pedestrian safety/fall risk). Verification is Low (ice is hard to see, especially at night; pedestrians can't verify "effort," only result). Risk is Non-consensual (passersby didn't choose to walk there).
      *   *Verdict:* **Tight / Enforce.** This fits the *Asymmetric Risk* clause. The pedestrian is vulnerable and cannot monitor the ice quality.

  3.  **Using your phone in a hospital waiting room:**
      *   *Analysis:* Reliance is High (patients need quiet for recovery/stress). Verification is High (noise is audible).
      *   *Verdict:* **Tight / Social Enforcement.** This is a classic *Asymmetric Risk* case. The violator gains a small benefit (entertainment) while imposing a diffuse cost on vulnerable people. Social shaming ("tut-tutting") is appropriate here.

  ***

  ### Part 4: The Honest Mismatch & Overturn

  **Which of your verdicts my principle can't save:**
  **Tipping.**
  You say: *"Shouldn't be expected at all, and I resent that it is."*
  My Principle says: If tipping is the wage mechanism, it is an **Institutional Trust** issue. The customer relies on the staff being paid, but cannot verify the wage. If the norm is "loose" (optional), the system decouples (staff aren't paid).
  *   *The Mismatch:* My principle implies that within the current system, the norm *must* be tight (expected) to maintain the labor equilibrium, or the system collapses. It cannot be "loose" and functional. Your resentment is correct, but the game-theoretic move isn't to loosen the norm (which hurts workers), it's to abolish the norm and replace it with a service charge (institutional fix).

  **The one verdict I would overturn:**
  **Citations ("Still punish").**
  *   *My Overturn:* I agree the rule must be **Tight**, but I reject the mechanism **"Punish."**
  *   *Why:* In the *Verification Gap* framework, the goal of the citation norm is **Truth Maintenance**, not **Compliance Selection**. Punishment (grade deduction) selects for students who are good at avoiding penalties, not necessarily good at research. It encourages "citation stuffing" (defensive citing) rather than accurate citing.
  *   *Correction:* The enforcement mechanism should be **Rejection/Correction**, not Punishment. If the citation is sloppy, the work is "unverified" and cannot be accepted until fixed. Punishing a harmless error creates Sorting Drift toward bureaucracy. The rule is tight (you *must* cite), but the sanction is restorative (fix it), not punitive (lose points), unless malicious intent (plagiarism) is detected.

  ***

  ### Part 5: Integrating Your Half-Baked Ideas

  You were right to trust your gut on these; they are necessary constraints on the main principle.

  1.  **Bystander Legibility:** I have baked this into **Clause 4**. Legibility doesn't determine *validity*, it determines *enforcement jurisdiction*.
      *   *Legible Violations* (Loud music, Queue jumping) $\rightarrow$ Social Enforcement (cheap, fast).
      *   *Illegible Violations* (Handwashing, Citations) $\rightarrow$ Institutional Enforcement (audits, inspections).
      *   *Danger:* If you try to enforce illegible rules socially (e.g., neighbors accusing each other of bin violations based on hunches), you generate toxicity.

  2.  **Sorting Drift:** I have baked this into **Clause 3 (Negligible Drift)**.
      *   Rules that survive past their utility (Bins, Lawn, maybe Speed Limits on empty roads) become "loyalty tests."
      *   Enforcing them tightly selects for people who value rule-following over actual community welfare.
      *   *Mechanism:* Sunset clauses on norms. If a rule's *Reliance* score drops (e.g., lawn length no longer affects property values or pest control), enforcement must automatically loosen.

  **Final Summary:**
  Don't ask "Is this rule harmful?" Ask "Who relies on this, and can they check it?"
  *   If they rely and can't check $\rightarrow$ **Institutional Tightness** (Handwashing, Citations).
  *   If they rely and can check $\rightarrow$ **Social Tightness** (Queueing, Noise).
  *   If they don't really rely $\rightarrow$ **Looseness** (Bins, Lawn, Empty Road Speeding).
