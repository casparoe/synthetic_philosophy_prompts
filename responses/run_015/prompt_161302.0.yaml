answer: |-
  You have put your finger on one of the sharpest splinters in the philosophy of physics. It is a genuine problem, not a confusion on your part. The experts who specialise in the arrow of time (notably Huw Price, David Albert, and Sean Carroll) wrestle with precisely this structure.

  You are correct that it is not simple *begging the question* (petitio principii). In classic circularity, a single argument uses its conclusion as a premise. What you have found is a **systemic interdependence**: two distinct explanatory frameworks, each stable on its own, but mutually reliant when stacked.

  Here are the three nearest established concepts, followed by a coinage that fits your specific description best.

  ### 1. Coherentism (Epistemology)
  This is the philosophical position that beliefs are justified not by resting on a foundational "floor" (foundationalism), but by how well they hang together with other beliefs.
  *   **How it fits:** It describes the structure you see: entropy explains records, records justify the initial condition, the initial condition explains entropy. It is a web, not a ladder.
  *   **How it differs:** Coherentism is usually a *defence*. Philosophers who adopt this say, "Yes, it circles, but that is how all justification works." You mentioned someone gave you this answer ("it's fine"). You rejected it because it feels too quick. Coherentism explains the *shape*, but it does not validate the *physics*. It tells you why the argument might be acceptable, not why it is true.
  *   **Verdict:** Describes the topology, but sidesteps the physical unease.

  ### 2. The Problem of the Criterion (Epistemology)
  Formulated clearly by Roderick Chisholm, this asks: To know which beliefs are true, we need a method. To know which method is reliable, we need true beliefs. Which comes first?
  *   **How it fits:** This captures your "no floor" sensation perfectly. To identify the Past Hypothesis (low entropy start), we need records. To trust records, we need the Past Hypothesis (entropy gradient). We cannot pick one without the other.
  *   **How it differs:** This is usually about general knowledge (how do we know anything?), whereas your case is specific to *temporal asymmetry*. However, the logical skeleton is identical.
  *   **Verdict:** Captures the "no floor" anxiety better than Coherentism.

  ### 3. The Archimedean Fallacy (Philosophy of Time)
  This term is championed by the philosopher Huw Price. An "Archimedean point" is a place to stand outside a system to move it. Price argues that physicists often assume they can stand outside time to impose an initial condition, while simultaneously using time-bound records to find it.
  *   **How it fits:** This is the specific critique of the move you are describing in the context of time. It highlights that we are *inside* the system we are trying to measure. We are using time-bound tools (records) to measure time's boundary.
  *   **How it differs:** This names the *error* of assuming we have a view from nowhere, rather than naming the logical loop itself. However, it is the most precise tool for your specific trade of time and records.
  *   **Verdict:** The best fit for the physics context.

  ### The Coinage: The Thermodynamic-Epistemic Loop
  Since none of the above perfectly capture the *mechanism* of the swap (trading a physical law for an epistemic tool), I propose this term for the specific move you have isolated.

  **Definition:** A reciprocal explanatory dependence where a physical asymmetry (thermodynamics) is used to validate an epistemic asymmetry (records/memory), which is in turn used to posit the boundary condition required for the physical asymmetry.

  **Edges and Boundaries:**
  *   **What counts as the same move:** Any argument where the *evidence* for a time-asymmetric law relies on the *existence* of time-asymmetric records, while the *existence* of those records relies on the law.
  *   **What doesn't count:** Standard calibration. If I calibrate my tape machine using a signal generator, that is not a loop. The generator is independent of the tape. If I calibrate the machine using a tape recorded on that same machine without external reference, that *is* the loop.
  *   **One phenomenon or two?** Your two cases (physics vs. psychology) are **one phenomenon**. Memory is simply a biological record. A photograph, a fossil, and a neural pathway are all "bunched-up structures" (low entropy local states) created by entropy dissipation. The logic is identical.

  ### The Test: Independent Calibration
  You asked for a test to separate a "bad version" from an "honest one." In your trade, you know the difference between a reference tape and a copy.

  **The Test:** Does the argument claim the Past Hypothesis is *derived* from records, or *postulated* to make sense of records?

  *   **The Bad Version (Hidden Loop):** Claims we *know* the universe started low-entropy *because* we see old records (rocks, light), while simultaneously claiming records only exist *because* entropy increases from a low start. This pretends the loop is a line. It claims independent access where there is none.
  *   **The Honest Version (Open Postulate):** Admits that the Past Hypothesis is a **posit**. It says: "We observe records. To make sense of them, we must *postulate* a low-entropy boundary. We cannot prove this boundary independently of the records, so we treat it as a law-like constraint."

  **Why the distinction matters:**
  In tape restoration, if you assume the tape is faithful to prove the machine is aligned, and assume the machine is aligned to prove the tape is faithful, you cannot find the azimuth error. You must introduce an external standard.
  In cosmology, we have no "external standard" outside the universe. Therefore, the honest physicist must admit the Past Hypothesis is a *brute fact* or a *postulate*, not a *discovery* derived from the records.

  ### Summary
  The move you have spotted is a **Thermodynamic-Epistemic Loop**.
  It is a specific instance of **The Problem of the Criterion**, occurring within the **Archimedean Fallacy**.
  It is not merely begging the question; it is a **systemic circularity** that is unavoidable unless one admits the boundary condition is a postulate, not a conclusion.

  Your instinct that "you always patch one claim with another and never get to stand on dry land" is the definition of **Coherentism**. But in physics, we usually demand **Foundationalism** (dry land). The unease you feel is the friction between wanting a foundation and having only a web. The honest answer is to admit the web is all we have, and stop pretending one strand is the anchor.
