      *   *The Ethics of Biography:* Do the dead have rights? Can you harm someone who doesn't exist? (The "No Subject" problem). If harm exists, is it to their reputation (legacy) or their memory (survivors)?
      *   *Shaffer's Intent:* Shaffer knew it was fiction. He called it a "fantasia on themes." The play is framed as Salieri's confession/memory. It's subjective truth, not objective history.
      *   *The Film:* Milos Forman's version cemented these myths in pop culture.
      *   *The Conflict:* Artistic truth (emotional/dramatic) vs. Historical truth (factual).
      *   *Resistance:* Does *Amadeus* care about ethics? Or does it argue that Genius *transcends* ethics? Salieri tries to judge God/Mozart, but fails. Maybe the play argues that *narrative* is the only immortality, regardless of accuracy.

  3.  **Structuring the Argument:**
      *   **Introduction:** Hook with the tension between the masterpiece and the lie. Define the central ethical dilemma (posthumous harm). State the thesis: *Amadeus* does not merely exploit the dead; it actively dramatizes the violence of narrative itself, ultimately suggesting that legacy is a battlefield where truth is the first casualty, thereby resisting a simple ethical judgment in favor of a metaphysical one.
      *   **Section 1: The Problem of Posthumous Harm.** Philosophical grounding. Can you wrong the dead? (Feinberg, etc.). Distinguish between harming the *subject* (impossible?) vs. harming their *interests/legacy*. Apply to Mozart/Salieri.
      *   **Section 2: Shaffer's Artistic Defense (Subjective Truth).** The play is framed as Salieri's memory. It's a confession, not a documentary. The "lie" is the point. Salieri is an unreliable narrator. This mitigates the ethical charge against the *author*, but shifts it to the *character*.
      *   **Section 3: The Film and Cultural Memory.** The film loses some of the play's metatheatricality. It solidifies the myth. This is where the "indirect harm" (audience belief) becomes real. The erosion of historical nuance.
      *   **Section 4: Resistance to Ethical Frameworks.** This is the crucial pivot. Does the play care about being "fair"? No. It cares about the nature of Genius and God. Mozart is a vessel, not a man. Salieri is a priest of mediocrity. The work argues that Art consumes Life. To demand ethical treatment of the characters is to miss the point of the work's theology.
      *   **Conclusion:** Summarize. The "wrong" is real but necessary for the art. *Amadeus* forces us to choose between the comfort of fact and the terror of artistic truth.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *(Self-Correction during drafting)*: I need to make sure I don't just list historical inaccuracies. The prompt asks about *moral obligations*. I need to keep the focus on ethics.
      *   *(Refining the "Posthumous Harm" concept)*: Use the distinction between "ante-mortem persons" and "post-mortem remains." Joel Feinberg's work on posthumous harm is relevant here (interests can survive death).
      *   *(Refining the "Resistance" aspect)*: The prompt asks where the critic must admit the work *resists* the framework. This means acknowledging that *Amadeus* might be saying "Ethics don't matter compared to Genius." I need to highlight Salieri's final absolution. He becomes the patron saint of mediocrities. The play validates his narrative, even if it's a lie. That's the ethical transgression.

  5.  **Developing the Argument on "Resistance":**
