      *   The play ends with Salieri winning (he gets the fame/memory). Mozart dies in a pauper's grave. The narrative *enacts* the injustice it depicts.
      *   Therefore, the work doesn't illustrate the ethical dilemma; it *performs* the violence of storytelling.

