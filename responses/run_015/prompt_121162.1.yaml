answer: |-
  The enduring power of Peter Shaffer's *Amadeus*—both the 1979 play and Milos Forman's 1984 film adaptation—rests on a paradox: it is a masterpiece built upon a lie. By framing Antonio Salieri as a mediocrity consumed by lethal envy and suggesting Wolfgang Amadeus Mozart was poisoned by his rival, Shaffer created a dramatic myth that has successfully colonized historical memory. This raises a profound ethical question regarding the dramatization of real lives: Do we owe the dead truth? When artistic license overwrites historical record, does it constitute a moral wrong against the subjects themselves, or is the harm merely indirect, corroding the audience's grasp of reality?

  To answer this, one must navigate the tension between the philosophical problem of posthumous harm and the work's own artistic self-awareness. Ultimately, a rigorous reading suggests that *Amadeus* does not merely exploit the dead for drama; rather, it dramatizes the violence of narrative itself. However, there comes a point where the critic must admit the work resists ethical frameworks entirely, positing that the immortality of art supersedes the moral rights of the biographical subject.

  ### The Ontology of Posthumous Harm

  The primary ethical charge against *Amadeus* is that it commits a "representational harm" against Mozart and Salieri. But can one wrong a person who no longer exists? In moral philosophy, this is the problem of posthumous interests. Joel Feinberg argued that while the dead cannot suffer, they retain an interest in how their lives are remembered. To defame the dead is to violate the projects and reputation they cultivated while alive.

  If we accept this, Shaffer's fabrication is ethically fraught. Mozart, though scatological and irreverent, was a diligent professional, not the puerile "Ass" of Shaffer's text. Salieri was a respected teacher and rival, not a murderer. By reducing them to archetypes (the Divine Fool and the Envious Priest), *Amadeus* strips them of their human complexity.

  However, the "wrong" here is complicated by the medium. In the play, Shaffer includes a note describing the work as a "fantasia on themes." It is framed explicitly as Salieri's memory, filtered through the bitterness of an old man in an asylum. The play is a confession, not a documentary. Here, the ethical burden shifts. If the audience understands they are watching a subjective monologue, the "lie" is diegetic—it belongs to Salieri, not Shaffer. The harm is contained within the fiction.

  The film, however, complicates this. Forman's adaptation, with its lush realism and lack of theatrical brechtian distancing, presents the narrative as objective history. It is here that the indirect harm resides. The erosion of public historical understanding is a tangible social cost. When a fictional narrative becomes the dominant cultural memory, it displaces the truth, denying the dead their actual legacy. This is not a harm Mozart feels, but it is a harm done to *history*, and by extension, to the living who rely on history to understand human potential.

  ### The Conflict Between Narrative License and Legacy

  Does *Amadeus* dramatize the conflict between license and legacy, or does it exploit it? To a degree, it does the former. The play is deeply self-aware about the construction of memory. Salieri constantly addresses the "Spectators," acknowledging his role as a narrator shaping his own myth. He admits to exaggerating his own villainy to make the story compelling. In this sense, the work is a meta-commentary on how history is written by the survivors, not the victims. Mozart dies silent; Salieri lives to tell the tale. The play acknowledges that legacy is a contest of narrative endurance, not factual accuracy.

  Yet, there is an exploitative edge that cannot be ignored. Shaffer utilizes the cultural capital of Mozart's name to lend weight to a story that fundamentally disparages him. The genius of the music is used to validate the fiction of the man. We forgive the caricature because the *Requiem* is real. This creates an ethical asymmetry: the work consumes Mozart's actual genius to fuel Salieri's fictional grievance.

  ### Where the Work Resists the Ethical Framework

  However, the most challenging aspect of *Amadeus* for the ethical critic is where the work refuses to play by the rules of moral accountability. A standard ethical critique assumes that art should strive for fairness or truthfulness regarding real people. *Amadeus* implicitly argues that Art is a theological force that operates beyond human ethics.

  This resistance is most visible in the work's theology of Genius. In *Amadeus*, Mozart is not portrayed as a human being with rights, but as a vessel for God's voice. Salieri's tragedy is not that he murdered a man, but that he tried to destroy a divine manifestation. Within the logic of the play, the factual accuracy of Mozart's personality is irrelevant because his humanity is irrelevant; he is an instrument. To demand ethical treatment of Mozart the *man* is to miss the point of Mozart the *voice*.

  Furthermore, the ending resists moral justice. Salieri does not get punished in a way that satisfies ethical retribution. He survives, he confesses, and he becomes immortal as the "patron saint of mediocrities." He wins. He succeeds in binding his name to Mozart's for eternity. If the ethical framework suggests that lying about the dead is a transgression that should be corrected or lamented, *Amadeus* suggests that such transgressions are the price of immortality. The work posits that narrative power is the only truth that lasts.

  The critic must admit that *Amadeus* is not interested in protecting the reputation of the dead. It is interested in the terror of creation. When Salieri says, "All over the world there are countless obscure men... who are the absolute, unacknowledged masters of the world," he is claiming a victory of narrative over fact. The play validates his claim. By giving Salieri the final, haunting monologue, Shaffer allows the liar to have the last word.

  ### Conclusion: The Necessity of the Wrong

  So, does *Amadeus* constitute a wrong? Yes, if one views biography as a contract of truth. It inflicts representational harm by flattening complex lives into dramatic opposites. But to stop there is to treat the work as a history textbook rather than a tragedy.

  The honest critic must acknowledge that *Amadeus* resists the ethical framework of "do no harm" because its central thesis is that Genius *does* harm. It harms the mediocre (Salieri) by revealing their limitations, and it harms the vessel (Mozart) by consuming his life for its output. Shaffer's fabrication is not a careless error; it is a thematic necessity. The "poisoning" is a metaphor for how the world treats genius—slowly, jealously, and destructively.

  Therefore, the harm to Mozart and Salieri is real, but it is subsumed by the work's metaphysical argument. *Amadeus* forces us to confront an uncomfortable truth: that our memory of the past is always a fiction constructed by the present. To demand ethical purity from a work about the brutality of artistic creation is to misunderstand the nature of the beast. The work does not illustrate the ethical dilemma; it enacts it. It sacrifices the historical dead to serve the living audience, proving Salieri's point: in the end, the story matters more than the man. We are left with the disquieting realization that we prefer the beautiful lie to the mundane truth, making us complicit in the very erasure the play depicts.
