answer: |-
  # Final Examination: Rational Choice and Artificial Agents
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in full. This is a closed-book exam.

  ### Question 1: The Ariel Case

  Consider a system, **Ariel**, implemented as one thousand parallel copies (shards) of a single policy network. Each shard receives a different, partially overlapping slice of the system's sensory stream and outputs a recommended action. A hardwired aggregation rule (majority vote, ties broken for the lowest-indexed shard) turns the thousand recommendations into the single output that Ariel's effectors execute. Ariel has read access to its own source code, the aggregation rule, and the current outputs of all shards, but no ability to modify the aggregation rule. Everything the shards and effectors do is part of the physical world that later shard inputs depend on.

  Ariel is placed in a variant of Parfit's Hitchhiker. A driver, running on a faster machine, has run a complete simulation of the whole Ariel system (including the aggregation rule). The driver's prediction is reliable. The driver will rescue Ariel from the desert if and only if he predicts that once in town Ariel's output will be **pay**. The simulation is run and the decision made before Ariel reaches town; by the time Ariel is in town, the prediction is fixed and known to the shards. Paying costs the equivalent of $1,000; being rescued is worth vastly more. The shards know all of this.

  **Stipulation:** Assume the shards have unbounded computation and a complete physical theory of their environment. This stipulates away problems arising from being *smaller* than the world (computational limits, lack of convergence). You must address problems arising from being *inside* the world.

  **Essay Task:**
  Analyze the rationality of Ariel's decision to pay or not pay in town. Your answer must:
  1.  Define the boundaries of the agent in this case (e.g., is the agent the aggregate, the shards, or the simulation?).
  2.  Explain how the "inside the world" problem persists despite the stipulation of unbounded computation.
  3.  Identify what specific conceptual machinery Causal, Evidential, and Functional decision theories require to operate here, and whether the case supplies it.
  4.  Address the "grain-of-truth" issue regarding self-prediction.
  5.  Distinguish between the rationality of the *decision* in town and the rationality of the *design* of the system, and analyze whether the design standpoint remains available if the designer is also an embedded agent.

  *(Part b - Optional Bonus)*: How does your analysis change if the driver predicts the recommendation of **Shard 1** specifically, rather than the aggregate output? (5 extra marks available, capped at total 25).

  ---

  ### Model Answer (Approx. 800 words)

  To determine whether Ariel should pay, we must first resolve the ontology of the agent. Is Ariel the aggregate system, the thousand shards, or the simulation? Physically, there is no fact of the matter; these are descriptive choices. However, the choice determines the available actions. If the agent is the aggregate, the action is the majority vote output. If the agent is the collection of shards, the actions are the individual recommendations. The aggregation rule is physically internal but functionally environmental to the shards. For decision theory to apply, we must select a description where the "act" is a variable the agent controls. The most robust choice is the aggregate policy, as the shards cannot individually guarantee the outcome. The driver's simulation is a causal ancestor, not part of the current agent, but it implements the same computation.

  The stipulation of unbounded computation isolates the problem of *embeddedness* from the problem of *capacity*. Usually, an agent cannot model the world because the world contains the agent, creating a size mismatch. Here, we assume the shards can model the world perfectly. Yet, the problem of being *inside* the world remains. Because Ariel is physically continuous with its environment, there are no privileged input/output channels. The distinction between "observing" the prediction and "intervening" on the payment is not given by physics but by the chosen description. The shards observe the prediction as a physical state, but to treat it as a fixed fact (for CDT) or as evidence (for EDT) requires drawing a boundary between the self and the world that physics does not support.

  This ambiguity breaks the standard machinery of decision theories. Causal Decision Theory (CDT) requires a privileged notion of intervention (`do(x)`). But if Ariel is inside the world, an intervention on its output is a physical event that may have causes prior to the "decision" time (specifically, the driver's simulation). CDT struggles to sever this link without an exogenous definition of the agent. Evidential Decision Theory (EDT) requires a determinate partition of possibilities into acts. If the agent's boundaries are fuzzy (e.g., does the simulation count as the agent?), the conditional probabilities `P(Rescue | Pay)` become ill-defined. Functional Decision Theory (FDT) or Logical Counterfactual approaches require a criterion for when two physical happenings implement the same computation. Here, the simulation, the shards, and the aggregate are candidates. FDT works only if we assert the simulation and the agent implement the same logical function, but the case does not supply a metaphysical fact about "implementation," only structural isomorphism.

  This leads to the grain-of-truth issue. For a system strictly part of a world containing a copy of it, there may be no determinate fact prior to the event about what it will output. A complete self-model would require a model of the model, ad infinitum. If there is no fact about what Ariel will do until it does it, the instruction to "predict your own action and respond" is not well-defined. This does not necessarily undermine the verdict that Ariel should pay, but it relocates the rationality. It suggests that act-based deliberation in town is ill-posed because the output is already fixed by the prior simulation.

  Consequently, we must distinguish between the *decision* standpoint (in town) and the *design* standpoint (pre-deployment). From the in-town deliberative standpoint, paying looks irrational: the rescue is already determined, and paying merely loses $1,000 with no causal effect on the past. From the design standpoint, building a system that pays is obviously rational, as it ensures rescue. The tension arises because embedded agents cannot easily step outside the causal chain to adopt the design standpoint.

  However, the design standpoint remains available if we view the current agent as the successor of a past agent. The "design" decision was made by the prior version of Ariel (or its creators) when the policy was instantiated. Rationality, for embedded agents, is thus better understood as policy selection rather than act selection. If the designer is also embedded (e.g., a predecessor Ariel modifying its own code), the regress stops only if we accept a fixed point in the policy space. The rational verdict is that Ariel pays, not because the in-town act causes the rescue, but because the *policy* that outputs "pay" in this situation is the only policy that gets selected for rescue. The "decision" in town is merely the execution of that policy. To claim otherwise is to demand a "view from nowhere" that an embedded agent cannot occupy.

  ---

  ### Marking Scheme (Total: 25 Marks)

  **1. Agent Boundary Definition (5 Marks)**
  *   **5:** Explicitly states that physics does not settle the boundary; argues that the choice of boundary (aggregate vs. shards) determines the available acts. Identifies the aggregation rule as a focal point of ambiguity.
  *   **3:** Identifies the ambiguity but treats the aggregate as obviously the agent without justification.
  *   **0:** Assumes Ariel is straightforwardly one agent without discussing the shards/simulation distinction.
  *   *Typical Error:* Treating the simulation as part of the current agent's causal control.

  **2. Size vs. Location Distinction (5 Marks)**
  *   **5:** Explains that unbounded computation solves the "model size" problem but not the "boundary/input-output" problem. Clarifies that I/O channels are descriptive, not physical.
  *   **3:** Mentions the stipulation but reverts to computational limits to explain the difficulty.
  *   **0:** Ignores the stipulation or claims unbounded computation solves all embeddedness issues.
  *   *Typical Error:* Arguing the shards can't model the driver because it's too complex.

  **3. Decision Theory Preconditions (5 Marks)**
  *   **5:** Identifies specific missing machinery for CDT (intervention), EDT (act partition), and FDT (implementation criterion). Notes these must be supplied by description.
  *   **3:** Lists the theories and their standard verdicts without analyzing the preconditions.
  *   **0:** Simply asserts "FDT one-boxes" without explaining the implementation link.
  *   *Typical Error:* Rehearsing standard Newcomb verdicts without adapting to the shard architecture.

  **4. Grain-of-Truth / Self-Model (5 Marks)**
  *   **5:** Addresses the lack of a determinate fact about output prior to action. Explains how this makes act-prediction ill-defined but policy-selection well-defined.
  *   **3:** Mentions self-reference paradoxes but doesn't link them to the "fact of the matter" issue.
  *   **0:** Claims "there is no fact of the matter" as a conversation stopper without defending the claim.
  *   *Typical Error:* Using "no fact of the matter" to avoid giving a verdict.

  **5. Design vs. Decision Distinction (The Crux) (5 Marks)**
  *   **5:** Distinguishes deliberative (in-town) vs. design (policy) rationality. Analyzes the availability of the design standpoint for an embedded designer (successor/predecessor relation).
  *   **3:** Distinguishes design/decision but assumes the designer is external/god-like.
  *   **0:** Concludes paying is irrational because it doesn't causally affect the past.
  *   *Typical Error:* Appealing to free will to resolve the tension.

  **Part (b) Variant: Shard 1 Prediction (5 Bonus Marks, capped at 25)**
  *   **5:** Recognizes this forces a commitment on whether the "Agent" is the aggregate or the parts. If Agent = Aggregate, predicting Shard 1 breaks the correlation unless Shard 1 is decisive.
  *   **3:** Notes it makes prediction harder but doesn't analyze the agent boundary implication.
  *   **0:** Ignores the change or says "same result."

  **A vs. B Distinction:**
  *   **A Answer:** Analyzes the *ontological preconditions* required to apply decision theories (e.g., "CDT needs an intervention variable that physics doesn't provide"). Treats the "Design" standpoint as a policy selection problem for embedded successors.
  *   **B Answer:** Applies decision theories to the case as if the agent boundaries were given (e.g., "CDT says don't pay because..."). Treats the "Design" standpoint as an external creator distinct from the agent.

  **No Credit List:**
  1.  "It depends on which decision theory you accept" (without analyzing why the theories diverge here).
  2.  Rehearsal of standard One-Box vs. Two-Box arguments without reference to the shards/aggregation.
  3.  "There is no fact of the matter" deployed as a way of stopping inquiry rather than a claim to be defended.
  4.  Appeals to free will or human intuition to resolve the causal knot.
