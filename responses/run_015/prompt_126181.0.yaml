      *   **Goal:** Create a list of desiderata (requirements) for a theory of the demos boundaries that is practical enough to be written into a constitution for binding referendums (including secession/merger).
      *   **Specific Cases to Cover:** Undocumented residents, cross-border commuters, non-resident citizens, children, prisoners, future generations, affected foreigners (emissions/sanctions).
      *   **User's Proposed Requirements to Test:** (1) Self-induced-affectedness filter (no counting people you forcibly affected), (2) Who-counts-the-counters (administrative control shouldn't determine the demos).
      *   **Key Task:** Identify which desiderata are incompatible (impossibility result), identify the single most damaging requirement, and provide a confidence assessment/epistemic flagging.
      *   **Constraints:** No citations (fill in readings themselves), keep weight on criteria, distinguish non-negotiables from preferences, be explicit about confidence levels.

  2.  **Deconstruct the "Insolubility" Claim:**
      *   The tutor's point is likely Whelan's or Dahl's: To decide *who* decides, you need a prior decision rule, which itself needs a demos. It's a regress.
      *   The user wants to treat this not as a shrug but as a *theorem*: "Here is what we want, here is why we can't have it all."
      *   To do this, I need to formalize the "wants" (desiderata) rigorously.

  3.  **Drafting the Desiderata (The Specification):**
      *   *Constraint:* Must be usable by an electoral commission. This implies operationalizability.
      *   *Constraint:* Must handle high-stakes boundary changes (secession/merger).
      *   *Constraint:* Must handle the specific cases listed.

      *   *Candidate 1: Normative Congruence.* The boundary should match the moral reason for democracy (e.g., protection of interests, subjection to coercion).
      *   *Candidate 2: Operational Determinacy.* The commission must be able to draw a list by a deadline. (User suspects this might be a prejudice).
      *   *Candidate 3: Non-Circularity / Independence.* The rule shouldn't rely on the output of the very process it defines (Whelan's point).
      *   *Candidate 4: Anti-Manipulation.* (User's "who-counts-the-counters"). The rule shouldn't allow the current incumbents to rig the electorate.
      *   *Candidate 5: Moral Agency/Reciprocity.* Voters must be capable of participating (excludes some future people/children?).
      *   *Candidate 6: Dynamic Stability.* The demos shouldn't dissolve immediately after forming.
      *   *Candidate 7: The "Self-Induced" Filter.* (User's specific request).

      *   *Refining the List:* I need to categorize them into Non-Negotiable (NN) and Contested/Preference (CP).
      *   *NN1: Non-Circularity (The Whelan Constraint).* The rule must be statable without presupposing the demos.
      *   *NN2: Anti-Manipulation (The "Who Counts the Counters").* Incumbents can't define the electorate to guarantee victory.
      *   *NN3: Operationalizability.* Must yield a list (even if fuzzy, it must be actionable).
      *   *CP1: Unique Determinacy.* Every person is either clearly In or Out. (User suspects this is a prejudice).
      *   *CP2: Moral Completeness.* All affected interests must be represented.
      *   *CP3: Moral Exclusivity.* Only those subject to coercion are included.

  4.  **Testing the User's Specific Requirements:**
      *   *(1) Self-Induced Affectedness:* Crucial for imperialism/occupation cases. If I invade you, you are "affected," but including you in *my* demos to vote on *your* annexation is perverse. This seems NN for legitimacy.
      *   *(2) Who-Counts-the-Counters:* Crucial for gerrymandering the electorate. If residency defines the demos, but the state defines residency, the state picks the demos. This seems NN.

  5.  **Identifying the Impossibility Result (The "Trap"):**
      *   The user guesses: "Demos authorizes itself" vs. "No body certifies its own constituency."
      *   My analysis: It's deeper. It's about *Operationalizability* vs. *Normative Correctness* vs. *Non-Circularity*.
      *   The real clash is between **Operational Determinacy** (we need a list by Tuesday) and **Non-Circular Independence** (the list can't depend on prior political decisions).
      *   Why? Because any factual criterion (residency, birth, coercion) requires an administrative interpretation. That administration is a political body. If that body is the *current* demos, we have circularity. If it's an external body, where did *it* get legitimacy?
      *   Also, **Unique Determinacy** clashes with **Moral Completeness** (Affected Interests). Affectedness is a spectrum; voting is binary. You can't have a binary list that perfectly captures a scalar moral reality without arbitrary cut-offs.

  6.  **Selecting the "Knockout" Requirement:**
      *   Which single requirement kills the standard theories?
      *   *Non-Circularity (Independence)* is the heavy hitter. It kills "The People Constitute Themselves" (obviously circular). It hurts "All Affected" (who decides who is affected? The current demos?). It hurts "All Subjected" (who decides what counts as subjection?).
      *   Actually, **Operationalizability without Incumbent Veto** is the specific killer. Most theories work in the abstract but fail when an Electoral Commission has to apply them without the current government being able to tweak the definition to win.

  7.  **Addressing the Cases:**
      *   *Undocumented:* Affected/Subjected? Yes. Citizen? No.
      *   *Commuter:* Affected in both?
      *   *Non-resident Citizen:* Affected? Maybe. Subjected? Tax/Law yes, daily life no.
      *   *Children/Prisoners:* Capacity vs. Subjection.
      *   *Future People:* Affected yes, Agency no.
      *   *Foreigners (Emissions):* Affected yes, Subjected no.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the tutor's point but reframe it as an impossibility theorem based on conflicting desiderata.
      *   **Section 1: The Specification (Desiderata).** List them, mark NN vs. CP, explain the case behind each. Test the user's two specific requirements here.
      *   **Section 2: The Impossibility Result.** Show which constraints clash. Focus on the tension between *Independence* and *Operationalizability*.
      *   **Section 3: The Knockout Requirement.** Identify the one that does the most damage (likely Non-Circularity/Independence applied operationally).
      *   **Section 4: Scorecard.** Briefly apply to the three standard answers.
      *   **Section 5: Confidence & Epistemic Flags.** Be honest about where I'm smuggling in liberal democratic assumptions.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* The user asked to test "Unique Determinacy." I should argue that dropping this (allowing probabilistic or weighted membership) doesn't actually solve the circularity problem, it just hides it. So I will mark it as CP but note that keeping it doesn't save the theory.
      *   *Correction on "Who Counts the Counters":* This is essentially an *Independence* constraint. I need to make sure I distinguish it from Non-Circularity. Non-circularity is logical; Independence is institutional.
      *   *Confidence Check:* I need to be careful not to present my own liberal egalitarianism as neutral. I must flag that "Anti-Manipulation" assumes manipulation is bad (democratic value) but also assumes there is a "true" demos to manipulate *against*.
      *   *Future People:* This is a strong test for "All Affected." If we include them, how? If we exclude them, is it democratic? I should note this tension in the desiderata.

  10. **Final Polish:** Ensure tone is seminar-appropriate (rigorous, critical, not didactic). Ensure all constraints of the prompt are met (no citations, specific cases covered, confidence flags).

  *(Self-Correction on the Impossibility Theorem)*: The strongest impossibility result here isn't just circularity. It's that **Normative Accuracy** (getting the moral boundary right) requires **Discretionary Judgment** (interpreting "affected" or "subjected"), but **Democratic Legitimacy** requires that Discretionary Judgment not be held by the Incumbents. But who else holds it? An external arbiter lacks democratic legitimacy. This is the trilemma. I will frame the impossibility around this.

  *(Refining the "Knockout")*: The requirement that does the most work is **Institutional Independence** (a specific version of Non-Circularity). It kills the "Constitutive" view instantly and puts immense pressure on the "Affected/Subjected" views because they require an arbiter of facts that is politically neutral.

