answer: |-
  This is the right move. Treating the "insolubility" claim as a theorem derived from conflicting desiderata is much more productive than treating it as a metaphysical mystery. You are asking for the *specification* of the boundary problem before the *solution*.

  Below is the specification list, the impossibility result, and the confidence assessment you requested.

  ### Part 1: The Specification (Desiderata List)

  To be written into a constitution for an Electoral Commission to apply in high-stakes boundary cases (secession, merger), a theory of the demos must satisfy the following. I have distinguished between **Non-Negotiable (NN)** requirements (without which the process ceases to be democratic or lawful) and **Contested Preferences (CP)** (which reflect specific normative commitments).

  #### 1. The Non-Circularity Constraint (NN)
  *   **Definition:** The rule for determining membership cannot presuppose the existence of the very body it is defining.
  *   **Case:** If the rule is "the demos decides who is in the demos," you cannot hold the first election to decide the boundary of the first election.
  *   **User's "Who-Counts-the-Counters":** This is a specific institutional instantiation of Non-Circularity. If the current registry holders (incumbents) define the criteria, they can alter the registry to alter the outcome.
  *   **Verdict:** **NN.** Without this, the boundary decision is merely an act of power by the prior group, not a democratic constitution of a new group.

  #### 2. Operational Determinacy (NN)
  *   **Definition:** The criterion must yield a actionable list of names/IDs by a statutory deadline.
  *   **Case:** An Electoral Commission cannot run a referendum on "everyone whose interests are significantly impacted to a degree > X." They need a binary check: ID number Yes/No.
  *   **Verdict:** **NN.** A theory that cannot be administered by a bureaucracy within a timeframe is not a constitutional rule; it is a philosophical poem.

  #### 3. The Anti-Imperialism Filter (NN)
  *   **Definition:** (Your "Self-Induced Affectedness"). A state cannot claim jurisdiction over a population for the purpose of *including* them in a vote simply by virtue of having forcibly imposed costs upon them.
  *   **Case:** If State A sanctions or occupies Region B, the people of B are "affected." If A says "therefore you must vote in our referendum on whether we annex you," that legitimizes the coercion.
  *   **Verdict:** **NN.** Including this is necessary to prevent democratic theory from laundering conquest.

  #### 4. Normative Congruence (CP)
  *   **Definition:** The boundary drawn by the rule should match the underlying moral justification for democracy (e.g., if democracy is about protecting interests, the boundary should match interests; if about coercion, it should match subjection).
  *   **Case:** If we exclude long-term undocumented residents who are fully subject to local law and tax, we violate the "all-subjected" principle. If we include non-resident citizens who haven't lived there in 20 years, we violate the "community of fate" principle.
  *   **Verdict:** **CP.** This is where the "All-Affected" vs. "All-Subjected" fight lives. It is a substantive moral claim, not a procedural necessity.

  #### 5. Unique Determinacy (CP)
  *   **Definition:** For every human being, the rule must yield a binary In/Out status. No probabilities, no weighted votes, no "associate membership."
  *   **Case:** You suspect this is a prejudice. You are right. It is an administrative convenience dressed up as ontology.
  *   **Verdict:** **CP.** We *could* write a constitution that says "affected foreigners get 0.5 votes" or "future generations are represented by a guardian." Insisting on binary membership is a preference for Westphalian clarity over moral nuance.

  #### 6. Capacity for Agency (CP)
  *   **Definition:** Members of the demos must be capable of forming and expressing a political will.
  *   **Case:** This excludes children, the severely cognitively disabled, and (problematically) future people.
  *   **Verdict:** **CP.** Excluding children is standard but theoretically shaky (they are subjected/affected). Excluding future people is practically necessary but normatively disastrous for long-term infrastructure/emissions decisions.

  ---

  ### Part 2: The Impossibility Result

  You asked for the subset of desiderata that cannot be jointly satisfied. The trap is not merely between "self-authorization" and "external certification." It is a trilemma between **Non-Circularity**, **Operational Determinacy**, and **Normative Congruence**.

  **The Argument:**
  1.  **Normative Congruence** requires interpreting complex moral facts (e.g., "Is this commuter *sufficiently* affected?" "Is this sanction *coercive* enough to count as subjection?").
  2.  **Operational Determinacy** requires these facts to be adjudicated by a specific body (an Electoral Commission or Court) by a deadline.
  3.  **Non-Circularity** requires that this adjudicating body not be the incumbent demos (otherwise they pick their own voters).

  **The Conflict:**
  If you empower an external body (e.g., a UN panel, a Supreme Court of non-elected judges) to determine who is "affected" or "subjected" to satisfy **Operational Determinacy**, you violate **Non-Circularity** in a deeper sense: you have subjected the new demos to an authority they did not authorize. The *boundary* of the demos is now determined by an undemocratic entity.

  If you leave the determination to the incumbent administration to satisfy **Operational Determinacy**, you violate the **Anti-Imperialism Filter** and **Non-Circularity** (the "Who-Counts-the-Counters" problem).

  If you insist on pure **Non-Circularity** (the people must define themselves), you lose **Operational Determinacy** (you cannot hold the vote until the people define themselves, but they can't define themselves until they vote).

  **Conclusion:** You cannot have a boundary rule that is morally accurate (Congruence), administratively executable (Determinacy), and democratically self-originating (Non-Circularity). One must break.

  ---

  ### Part 3: The Knockout Requirement

  The single requirement that does the most work in knocking out otherwise popular answers is **Non-Circularity (specifically the Institutional Independence variant).**

  *   **Why it kills "The People Constitute Themselves":** This is the obvious one. It is logically incoherent as a boundary rule for a *first* decision.
  *   **Why it kills "All-Affected Interests":** To apply this, someone must measure "affectedness." If the current state measures it, they can exaggerate or minimize effects to include/exclude voters (violating Anti-Imperialism/Independence). If an external body measures it, the demos is not self-determining.
  *   **Why it kills "All-Subjected":** Same problem. Who defines "subjection"? If the state defines the laws that create subjection, and then uses that subjection to define the voters who validate the laws, the circle is closed.

  **Why Unique Determinacy is a Red Herring:**
  Dropping Unique Determinacy (allowing weighted votes or fluid membership) does not solve the circularity. It just makes the manipulation harder to see. An Electoral Commission still has to decide *who* gets the 0.5 vote vs the 1.0 vote. The power to weight is the power to exclude.

  ---

  ### Part 4: Scorecard Against Standard Answers

  | Theory | Fails Which Desideratum? | Why it fails the Constitutional Test |
  | :--- | :--- | :--- |
  | **All-Affected Interests** | **Operational Determinacy** & **Non-Circularity** | "Affectedness" is infinite and scalar. An Commission cannot draw a binary line without arbitrary cut-offs. Who sets the cut-off? If the state does, it's rigged. |
  | **All-Subjected (Coercion)** | **Anti-Imperialism Filter** | States can manipulate the *degree* of coercion to manipulate the demos. Also fails on future people (they are affected by waste, but not "subjected" to law in a enforceable way). |
  | **Constitutive (Self-Definition)** | **Non-Circularity** | Logically impossible for a founding moment. Requires a prior demos to validate the procedure of self-constitution. |

  ---

  ### Part 5: Confidence & Epistemic Flags

  Here is where I am smuggling in substantive theory, and where I am confident.

  **High Confidence (The Logical Trap):**
  *   **The Trilemma:** I am highly confident that Non-Circularity, Determinacy, and Congruence are in tension. This is a structural feature of any rule-following system. To apply a rule, you need an interpreter. If the interpreter is inside the system, it's circular. If outside, it's heteronomous.
  *   **Unique Determinacy is a Preference:** I am confident this is a administrative prejudice. Democracies could theoretically function with stochastic representation or weighted voting based on stake. The insistence on "one person, one vote" within a binary boundary is a historical artifact, not a logical necessity.

  **Medium Confidence (The Normative Claims):**
  *   **Anti-Imperialism Filter:** I am defending this as NN, but it relies on a specific theory of legitimacy (that coercion undermines consent). A realist might argue "might makes right" and say if you can enforce the vote, the boundary is valid. I am assuming liberalism is true here.
  *   **Operational Determinacy:** I am assuming the goal is a *state* constitution. If you are designing a transnational network, you might not need a binary list. But for a binding referendum with a deadline, this is NN.

  **Low Confidence / High Risk of Smuggling:**
  *   **Capacity for Agency:** I marked this as CP, but it does heavy lifting. Excluding children and future people is standard, but if the justification for democracy is "protection of interests," excluding those with the highest stakes (future generations) is inconsistent. I am deferring to current practice here, not logic.
  *   **The "External Arbiter" Problem:** I argue that an external arbiter violates Non-Circularity. But one could argue that *constitutional courts* are external arbiters that are accepted in democracies. The counter-argument is that courts derive authority from the constitution, which derives authority from the demos... which brings us back to the start. I am assuming the "infinite regress" critique holds water against courts, which is debatable.

  **What Would Change My Mind:**
  *   **If you accept "Graded Membership":** If you convince me that a constitutional commission can assign "voting weights" based on quantifiable affectedness (e.g., tax records + carbon footprint), you might solve Operational Determinacy without binary exclusion. But you still face the "Who calculates the weight?" problem.
  *   **If you accept "Random Selection":** If the boundary is drawn by lot from the global population (sortition), you solve Non-Circularity (no one chooses the choosers) but you violate Normative Congruence (the demos has no shared fate).

  **Final Advice for the Seminar:**
  Don't argue that the problem *has* a solution. Argue that the tutor's "insoluble" claim is actually a **theorem** derived from the incompatibility of **Non-Circularity** and **Operational Determinacy**. The task isn't to solve the boundary problem, but to choose which desideratum we are willing to violate. Most liberal democracies quietly violate **Non-Circularity** (by letting incumbent states define residency) and call it "pragmatism." Your job is to force them to admit that trade-off.
