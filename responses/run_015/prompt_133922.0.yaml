  Dependency order (~120 words)
  Start with existence as resisting disorder. Systems must maintain boundaries to survive physical decay. To do this, they need an internal model of causes behind sensory data. This model generates constant expectations. When data violates expectations, surprise occurs. Surprise threatens stability. Therefore, systems must minimize surprise. They do this by updating models (perception) or changing data (action). This loop creates purpose without intent. Finally, introduce free energy as the mathematical bound on surprise, not energy itself. This sequence ensures editors see agency as emergent from error minimization, not magic. Crucially, this avoids homunculi. Each step necessitates the next: stability requires modeling, modeling requires error correction, correction defines behavior. The very clear logic flows from thermodynamics to cognition without jumping scales.

  The carrying example (~100 words)
  Imagine a tidal gauge built to withstand storm surges. It adjusts exposure based on predicted waves. If a surge violates its model, it risks damage (surprise). To minimize this, it updates its wave model (perception) or moves to sheltered water (action). It requires water height sensors and hydraulic actuators. The teleological trap is saying the gauge "wants" safety. Instead, say its structure persists only if it minimizes surprise. Those that didn't adjust broke. The surviving gauge looks purposeful, but it's just physics filtering out high-error states. It strictly embodies true prediction without a mind. This illustrates the core mechanism clearly.

  Misconception map (~130 words)
  First, when introducing thermodynamics, kill 'free energy is literal heat.' Clarify it's information theoretic surprise, not caloric burn. Confusing them undermines the information theory foundation completely. Second, during the modeling phase, kill 'predictions are conscious guesses.' Emphasize these are sub-personal physiological expectations, like reflexes, not editorial hunches. Editors must see this as automated regulation, not deliberate thought. Third, when discussing error correction, kill 'error signals are bad news.' Explain error is the fuel for learning, not failure. If you wait until the end to address these, the mental models will have already calcified. Address 'heat' before biology, 'conscious' before cognition, and 'bad news' strictly before action. This order prevents anthropomorphizing the system too early. Ensure each correction lands before the next concept builds upon it. Proper sequence timing is critical.

  The check (~50 words)
  Ask: "If a newsroom stops publishing stories contradicting its audience's worldview to minimize backlash, is it minimizing free energy successfully? Why?" This tests understanding of long-term model accuracy versus short-term error suppression. It forces application of the survival constraint to their work without jargon. Answering requires distinguishing existence from comfort.

  What to skip (~60 words)
  Do not put the variational free energy equation on the board. It invites math anxiety and distracts from conceptual logic. Skip detailed neuroanatomy like layer-specific cortical connections. Treat active and perceptual inference as two sides of the same coin. Keep focus on the logical necessity of error minimization, not the mathematical proof. The editors need the lens, not the calculus.
