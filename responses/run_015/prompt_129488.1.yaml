          1.  Numbered list of 6–8 agreed-upon claims (facts about the cases, shared principles).
          2.  Disagreements table (Neutral statement, Swamper wording, Finitist wording, The Crux, Shared Evidence/Argument, Predictions).
          3.  Address verbal disputes (if any).
          4.  Tone: Readable for an 11th grader, explain technical terms.
          5.  Specific Content: The Cascade (1 annoying afternoon vs. 1-in-a-billion chance of infinite happy lives), The Slow Bleed (10 billion years of great lives), The Horizon Rule (truncating time by centuries to compare).

  2.  **Deconstruct the Ethical Problem:**
      *   **The Cascade:** Cost = 1 annoying afternoon. Benefit = $10^{-9}$ chance of $\infty$ utility. Expected Utility (EU) = $\infty$.
      *   **The Slow Bleed:** Cost = ? (Presumably similar or negligible compared to the benefit). Benefit = $10^{10}$ years of great lives (Finite but huge).
      *   **The Conflict:** Standard Expected Utility Theory (EUT) suggests $\infty > \text{Finite}$. So Cascade > Slow Bleed. This feels counterintuitive (Pascal's Wager style problem).
      *   **Swamper Position:** Infinity dominates. Any non-zero chance of infinite good outweighs finite costs. Comparing two infinities requires a different method (like the Horizon Rule).
      *   **Finitist Position:** Infinity breaks decision theory. We should focus on finite outcomes. Infinite payoffs shouldn't hold finite choices hostage. Slow Bleed > Cascade (because it's *guaranteed* huge good vs. *unlikely* infinite good).
      *   **The Horizon Rule:** A proposed tie-breaker for infinite vs. infinite. Truncate time at centuries. If one leads from point $X$ onwards, it wins. If they flip-flop, it's a tie.

  3.  **Drafting the Agreed Claims (6-8 items):**
      *   Need to establish common ground on facts and shared values.
      *   1. Definition of The Cascade (Cost/Benefit).
      *   2. Definition of The Slow Bleed (Finite but massive good).
      *   3. Agreement that infinite good is *better* than finite good *if* probabilities were equal/certain (conceptual agreement).
      *   4. Agreement that the annoying afternoon is morally relevant (not negligible).
      *   5. Agreement that the Horizon Rule is a coherent method for comparing infinite streams (even if they disagree on when to use it).
      *   6. Agreement that decision theory shouldn't lead to absurdity (both think their view avoids absurdity).
      *   7. Agreement on the probability (1 in a billion is small but non-zero).
      *   8. Commitment to continue dialogue (meta-claim).

  4.  **Drafting the Disagreements Table:**
      *   *Disagreement 1: The Priority of Infinity.*
          *   Neutral: How to weigh infinite vs. finite outcomes.
          *   Swamper: Infinity lexicographically dominates.
          *   Finitist: Finite goods determine choice when infinity is improbable.
          *   Crux: Does mathematical infinity map directly to moral value?
          *   Evidence: Pascal's Mugging scenarios.
          *   Prediction: Swampers say ignore the mugger if probability is too low? No, Swampers say pay if infinity is on the line. Finitists say refuse.
      *   *Disagreement 2: The Slow Bleed vs. Cascade.*
          *   Neutral: Which option is morally required?
          *   Swamper: Press Cascade (Expected Value is infinite).
          *   Finitist: Choose Slow Bleed (Robust finite good).
          *   Crux: Risk tolerance regarding infinite value.
          *   Evidence: The "St. Petersburg Paradox" logic.
      *   *Disagreement 3: Application of the Horizon Rule.*
          *   Neutral: When does the Horizon Rule apply?
          *   Swamper: Only when comparing Infinite vs. Infinite.
          *   Finitist: Use it (or similar truncation) to compare Infinite vs. Finite too.
          *   Crux: Can you truncate an infinite possibility to make it comparable to a finite one?
      *   *Verbal Dispute Check:* Is "Value" being used differently? Yes. Swampers mean "Mathematical Expected Value." Finitists mean "Practical Moral Weight."

  5.  **Refining Tone and Accessibility:**
      *   Avoid heavy jargon (e.g., "lexical priority," "discount rates").
      *   Explain terms like "Expected Value" or "Lexical Dominance."
      *   Keep it respectful. The goal is reconciliation.
      *   Ensure the "Horizon Rule" is explained clearly in the agreement section.

  6.  **Review against Constraints:**
      *   6-8 claims? Yes.
      *   Table format? Yes.
      *   Neutral statements + Camp wording? Yes.
