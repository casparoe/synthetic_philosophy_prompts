      *Revised Plan for Fiction Analogy:* The problem isn't that it's charming. It's that fiction is a *closed* system. Life is *open*. In a novel, the author guarantees the hinge. In life, nothing guarantees "I have two hands" except my continued interaction with the world. If I lose my hands, the hinge breaks. In a novel, the text doesn't change.

      *Revised Plan for Holism:* This is the Quinean attack. If the center of the web holds firmer than the edges, but can still move, why call it a different *kind* of knot?

      *Confidence:* I am most confident that the Holism objection is the strongest philosophical threat. I am least confident about the precise psychological disanalogy in the fiction case (since cognitive science of fiction is debated).

