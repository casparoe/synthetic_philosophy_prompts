  7.  **Refining the "Fatal" vs. "Conceded" distinction:**
      *   A committed hinge theorist (like Moyal-Sharrock) *concedes* hinges change. They argue they change via *revolution* not *revision*.
      *   *My counter:* If the mechanism of change looks like evidence accumulation (e.g., we went to the moon), then the "no evidence" claim is weakened.
      *   *Decision:* I will mark the "Collapse into Holism" as the most dangerous. A hinge theorist *claims* they don't concede this, but logically they might have to. I will frame it as: "If you concede X, your view loses its distinctive bite."

  8.  **Final Polish:**
