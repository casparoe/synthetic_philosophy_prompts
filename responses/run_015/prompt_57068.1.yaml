  Three siblings (Ann, Ben, Cal) manage a family trust with three assets: House (H), Business (B), and Art (A). Holding any one or two assets yields profit; holding all three triggers catastrophic tax liability, bankrupting the trust (Utility: 0). Holding none is safe but boring (Utility: 10). Holding one or two is optimal (Utility: 20). Each sibling values a different asset most but prefers any gain to status quo. Exchange rates are fixed: Ann trades 1 unit of "Support for Keeping H" for 1 unit of "Support for Keeping B" from Ben; Ben trades 1 unit "Support for Keeping B" for 1 unit "Support for Keeping A" from Cal; Cal trades 1 unit "Support for Keeping A" for 1 unit "Support for Keeping H" from Ann. They negotiate sequentially, unaware the others will continue trading after they stop.

  Trade 1 (Ann & Ben): Keep H & B. Utility rises 10→20 for both; Cal unaffected locally (still 10). Trade 2 (Ben & Cal): Keep B & A. Utility rises 20→20 (neutral) for Ben, 10→20 for Cal; Ann unaffected locally. Trade 3 (Cal & Ann): Keep A & H. Utility rises 20→20 for Cal, 10→20 for Ann. Final State: H, B, A all kept. Trust bankrupts. All Utilities drop to 0. Everyone is worse off than the start (10), despite every signed swap offering a local strict improvement or neutrality for signatories based on marginal asset value.

  **Ledger Walk:**
  1.  **Start:** (None). Utility: A=10, B=10, C=10.
  2.  **Trade 1 (A&B):** Add H, B. Marginal gain for A&B (10→20). C indifferent to H/B alone (10). Signed by A&B.
  3.  **Trade 2 (B&C):** Add A. Marginal gain for C (10→20). B stays high (20). Signed by B&C.
  4.  **Trade 3 (C&A):** Confirm H, A. Marginal gain for A (20→20 neutral/positive). C stays high. Signed by C&A.
  5.  **End:** (H, B, A). Interaction effect triggers bankruptcy. Utility: A=0, B=0, C=0.

  **Single Feature:**
  The work is done by **non-separable preferences** (context-dependent utility). The value of an asset depends on the combination held, not the marginal unit. Each sibling defends their pairwise rate because, *ceteris paribus*, acquiring the asset is good. They get caught in the loop because pairwise trades treat issues as independent goods when they are actually complements/substitutes in a bundle. Rational agents can have defensible marginal rates while missing the global interaction curve.

  **Stripping the Feature:**
  If you force everyone onto one consistent, separable scale (linear utility), the loop vanishes. Agents would value the bundle directly, refusing the third trade once the bankruptcy threshold is visible, or demanding compensation for the systemic risk.

  **Defender's Attack:**
  A defender of moral trade would argue this is a **market design failure**, not a failure of moral trade theory. The theory assumes trades occur on the *relevant unit of value*. If preferences are non-separable, the relevant unit is the *bundle*, not the individual issue. Trading issues sequentially violates the condition for Pareto efficiency.

  **Verdict:**
  **The defender escapes.** This is not a genuine counterexample to the core logic of moral trade, but a demonstration of its preconditions. The Pareto defense holds *if* trades are made on the complete bundle of interdependent values. The scenario breaks the pitch only by exploiting a category error (trading issues instead of bundles) that a sophisticated application of moral trade would prohibit. The failure lies in the agents' segmentation of the problem, not the principle of voluntary exchange itself.
