prompt: |-
  I'm a software engineer with no formal philosophy background; I think in terms of source repositories, build pipelines, compiled artifacts, runtime state, deterministic execution paths, dependency injection, legacy code constraints, container identity, error logs, and stack-trace attribution. Restate Sartre's position that human beings have no predetermined essence — that existence comes first and we constitute ourselves through choice — together with his idea of radical freedom and his concept of bad faith, in which a person denies that freedom by treating herself as if she were a fixed object with an unchangeable nature. Do this using only the vocabulary of software systems: initialization parameters, build-time versus run-time properties, state mutation, non-deterministic branching, configuration management, deterministic replay, dependency graphs, and error ownership versus external attribution. For each component, report whether it translates cleanly, whether it requires distorting the engineering concept, or whether it lacks any counterpart in systems design. Then provide the residue analysis: does what fails to translate point to a genuine phenomenon that software metaphors cannot capture, or does it reveal that the philosophical claim is less precisely defined than it appears? I do not need citations, biographical details, or a survey of the literature.
