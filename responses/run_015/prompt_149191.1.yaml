answer: |-
  Right. You're walking into a room where half the audience thinks metaphysics is a disease and the other half thinks truth is a weapon. Your thesis—that unreliable narration requires a mind-independent normative horizon—is bold, but it invites fire from both flanks. They smell realism smuggling, and they won't hesitate to call you out.

  Here are the three objections you'll face, ordered by how much damage they can do to your credibility and argument. I've phrased each in the vocabulary your audience will use (analytic first, then the theorists), followed by how to handle them.

  ### 1. The 'Implied Author' Reduction
  **Damage Level:** Critical. This offers a rival explanation that makes your transcendental claim unnecessary. If they can explain unreliability without leaving the text, your 'normative horizon' looks like metaphysical excess.

  *   **How they'll phrase it:**
      *   *The Analytics:* 'Why posit a mind-independent frame? We can account for unreliability via the norms of the *implied author*. The discrepancy is internal to the work's structure, not a gap between text and world. You're violating ontological parsimony.'
      *   *The Theorists:* 'You're reifying the "implied author" as a stable centre. That construct is just the text's own ideological closure. You don't need an external horizon; you just need the text's internal coherence.'
  *   **What to concede:** Grant that we don't need a *thick* moral realism. You aren't claiming the reader needs to know the *Truth* with a capital T, only that they need a standard not generated by the narrator.
  *   **The reply that must land:** 'The implied author isn't a voice; it's a reconstruction. To reconstruct the implied author's norms as *corrective* rather than just *different*, the reader must already possess a normative standard external to the narrator's voice. Otherwise, you don't have unreliability; you just have two competing voices. The "gap" you posit internally is actually the external horizon doing its work.'
  *   **Where it's softest:** You risk circularity. If they press you on where the reader gets this standard (education? culture? intuition?), you might be forced to admit it's socially contingent, which undermines the "mind-independent" claim.

  ### 2. The 'Hegemonic Norm' Critique
  **Damage Level:** High. This attacks the nature of your norm. If the norm is just power, it isn't mind-independent, and your transcendental argument collapses into historical contingency.

  *   **How they'll phrase it:**
      *   *The Analytics:* 'Your "minimal standard" looks suspiciously like the dominant moral intuitions of the contemporary reader. That's not transcendental; it's empirical and local.'
      *   *The Theorists:* 'This "horizon" is just hegemonic discourse masquerading as universality. You're mistaking the norms of your specific social formation for a mind-independent frame. It's power in disguise.'
  *   **What to concede:** Acknowledge that the *content* of the norm is historically situated. Don't die on the hill that "murder is wrong" is a timeless truth accessible to all.
  *   **The reply that must land:** 'I'm arguing about the *structure* of the judgement, not the *content* of the norm. Even if the norm is contingent, the *act* of identifying unreliability requires the reader to treat that norm as valid *for the purpose of the reading*. The transcendental claim is about the stance required to experience irony, not the metaphysical status of the value itself.'
  *   **Where it's softest:** Phenomenology isn't metaphysics. Just because the reader *feels* they are accessing a valid norm doesn't mean there *is* one. They may press you on whether you're describing reading or prescribing it.

  ### 3. The 'Conceptual Disguise' Dismissal
  **Damage Level:** Moderate. This doesn't refute you, but it dismisses you as naive. It undermines your standing as a philosophical interlocutor.

  *   **How they'll phrase it:**
      *   *The Analytics:* 'This isn't a transcendental argument; it's conceptual analysis in a fancy coat. You've simply defined "unreliable narration" to include "external normative frame". That's a verbal stipulation, not a discovery.'
      *   *The Theorists:* 'You're essentialising a reading practice. You're turning a historical way of reading into an ahistorical condition of possibility.'
  *   **What to concede:** Admit that it looks like a definition. Don't try to claim you've discovered a new law of the universe.
  *   **The reply that must land:** 'It's an inference to the best explanation. We observe that irony collapses into ambiguity when no external standard is available. The "normative horizon" explains why some texts sustain irony and others dissolve into noise. It explains the practice, not just the definition.'
  *   **Where it's softest:** They might produce counter-examples—texts where unreliability is sustained precisely because norms are ambiguous. If you can't account for those, your "best explanation" looks weak.

  ### The Question You're Praying Nobody Asks
  **'Does this mean your own novels rely on you being morally right?'**

  This is the trap. They will pivot from the abstract to the personal to see if you're arrogant enough to claim your fiction accesses these mind-independent norms.

  *   **How to handle it:** Do not defend your books. Do not claim moral authority.
  *   **The Reply:** 'No. It means my novels rely on the *reader* having a normative frame. Whether I succeed in engaging it is a separate matter. In fact, if my novels are any good, they should trouble that horizon, not just confirm it. The argument is about the condition of reading, not the virtue of the writer.'
  *   **Why:** This keeps the focus on the philosophy of literature rather than your biography. It turns a potential ego-check into a reinforcement of your thesis: the norm exists regardless of whether the author satisfies it.

  Keep your chin up. They respect a novelist who knows their limits better than one who pretends to be a metaphysician. Stick to the phenomenology of reading, and don't let them drag you into heavy metaphysics unless you're ready to bleed. Good luck on Tuesday.
