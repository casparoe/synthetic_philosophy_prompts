answer: |-
  ### Activity Design: The Reconstruction Protocol

  #### 1. Setup and Materials
  *   **Room:** U-shape or 4 distinct tables. Whiteboard visible to all.
  *   **Materials:**
      *   20 Index cards (heavy stock).
      *   20 Pens.
      *   1 Timer (visible).
      *   4 "Team Instruction" packets (sealed envelopes).
      *   4 "Rating" slips.
      *   Whiteboard markers.
  *   **Pre-Session Prep:**
      *   Write the **Master Profile** on 4 identical cards (or have the Volunteer write it at the start).
      *   Prepare the 4 Team Instruction packets with the Hidden Parameters (Order + Tie-Break).

  #### 2. Roles
  *   **The Architect (12 participants):** Split into 4 teams of 3. They perform the operations on the profile.
  *   **The Subject (1 participant):** Writes the Master Profile at the start. Then sits silently (can join a team as an observer but cannot speak or write).
  *   **The Facilitator (You):** Timekeeper and rule-enforcer.
  *   **The Observers (3 participants):** If using 16 total (1 Subject + 12 Architects = 13), the remaining 3 can rotate or join teams to make teams of 4. *Correction for 16 pax:* 1 Subject + 15 Architects. 4 Teams of 4 Architects. The Subject floats or sits centrally.
      *   *Refined Role Count:* 1 Subject (Silent Author), 15 Architects (4 Teams of 3 + 1 Team of 4? No, 16 total).
      *   *Best Split:* 4 Teams of 4. In each team, 1 person is designated "Scribe," 3 are "Architects." The **Subject** is a separate role.
      *   *Wait, 16 people total.* 1 Subject leaves 15. 15 does not divide by 4.
      *   *Adjustment:* 4 Teams of 4. **One** of the 16 is the Subject. The other 15 are Architects. One team will have 3 Architects, the others 4. Or, simpler: **4 Subjects.** Each team gets a *different* subject, but the *text* of the profile is standardized (they copy a template).
      *   *Decision for Hypothesis Integrity:* To test "Order" and "Tie-Break," the input must be identical. I will use **1 Subject** who writes the profile. The remaining 15 participants form **4 Teams** (three teams of 4, one team of 3). The Subject sits in the middle.
      *   *Wait, Prompt says:* "Split the room into teams of four."
      *   *Strict Compliance:* 16 Participants. 4 Teams of 4.
      *   *Solution:* **4 Subjects.** Each team has 1 Subject and 3 Architects. The Subjects are instructed to write the *exact same profile* from a template provided by the Facilitator on the whiteboard. This ensures input identity while keeping team sizes at 4.
      *   *Risk:* Subjects might write differently.
      *   *Mitigation:* Facilitator provides the *text* on the whiteboard. Subjects copy it onto their team's card. This counts as "authored by a participant" (they physically wrote it) but ensures identity.

  #### 3. The Three Operations (Card Text)
  *   **Operation A (Info):** "Write down three facts about her situation she currently denies or ignores. Add them to the profile."
  *   **Operation B (Conflicts):** "Find two wants that fight each other. Delete or change one so they no longer fight."
  *   **Operation C (Settlement):** "Read the new text silently for two minutes. If a want fades, cross it out. If a new want appears, write it in."

  #### 4. Hidden Parameters (Sealed Envelopes)
  *   **Team 1:** Order A → B → C. Tie-Break: "Keep it Recognizable."
  *   **Team 2:** Order B → A → C. Tie-Break: "Keep it Recognizable."
  *   **Team 3:** Order A → B → C. Tie-Break: "Maximize Cleanliness."
  *   **Team 4:** Order B → A → C. Tie-Break: "Maximize Cleanliness."

  #### 5. Timeline (110 Minutes)
  *   **0-10:** Intro. No theory. Explain rules. Forbidden words list on whiteboard.
  *   **10-25:** Profile Creation. 4 Subjects copy the template text from the whiteboard onto index cards. They sign the bottom. They then go silent.
  *   **25-35:** Team Formation. Distribute Sealed Envelopes. Teams open and read constraints.
  *   **35-80:** Work Phase (45 mins). Teams apply operations in order. Facilitator circulates, ensuring forbidden words are not spoken.
  *   **80-100:** Readout & Rating (20 mins). Teams read final profile. Subject writes a "Recognition Score" (0-10) on a slip.
  *   **100-110:** Debrief (10 mins). Reveal hidden parameters. Discuss divergence. Introduce forbidden concepts.

  #### 6. Debrief Map
  *   **Non-commutation:** Compare Team 1 & 2 (Same Tie-Break, Different Order). If scores/profiles differ, order mattered.
  *   **Laundering:** Ask Team 3/4 (Max Cleanliness) what they deleted. Did they delete a desire because it was "irrational" or because it was "messy"?
  *   **Successor:** Look at Recognition Scores. If Team 3/4 has low scores, they built a stranger, not a refined subject.

  #### 7. Failure Modes
  *   **Teams finish early:** They will start chatting. *Fix:* Require them to produce *intermediate* drafts for each step, not just a final result.
  *   **Subjects feel attacked:** *Fix:* Emphasize the profile is a *character*, even if based on self.
  *   **Forbidden words slipped:** *Fix:* Gentle bell chime. Reset the sentence.

  #### 8. Limitations
  *   **Convergence:** Real idealization theory often claims preferences *converge* under ideal conditions. This exercise guarantees *divergence* because the "Tie-Break" rules force different endpoints. You must explain this: "In theory, truth converges. In this game, your rules diverged."
  *   **Thin Profiles:** Real people are deeper than index cards. The "Successor" problem is amplified by the lack of depth.

  #### 9. Success Check
  *   **Observable Criterion:** Teams 3 & 4 (Max Cleanliness) receive significantly lower Recognition Scores from their Subjects than Teams 1 & 2 (Recognizable), despite Teams 3 & 4 claiming their profile is "better."

  #### 10. Scaling
  *   **8 Participants:** 2 Teams. Team 1 (Order A, Recognizable), Team 2 (Order B, Cleanliness). Harder to isolate variables, but core tension remains.
  *   **30 Participants:** 6 Teams. Add Order C (C → A → B). Increases data points for Non-commutation.

