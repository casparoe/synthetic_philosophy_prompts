answer: |-
  Moral Foundations Theory is a map of psychological disagreement, not a compass for moral truth. Its proper utility lies not in adjudicating who is correct, but in diagnosing whether a given political dispute is amenable to rational resolution or merely requires political bargaining. If we grant the empirical picture your mate favours—that conservatives utilise a wider range of foundational intuitions than liberals—it remains a category error to infer normative authority from psychological prevalence. The theory distinguishes between disagreements within a shared moral language, where argument and evidence apply, and disagreements between distinct moral languages, where *modus vivendi* is the only sensible goal.

  To see why this sorting function is the theory's ceiling rather than its floor, consider the two types of conflict you outlined. When both parties recognise a foundation but weigh it differently, such as fairness conceived as equality versus fairness conceived as proportionality, we are dealing with a conceptual or empirical dispute. We can analyse the consequences of each distribution, measure outcomes against shared goals, and potentially demonstrate that one interpretation undermines the very concept of fairness both seek. Here, the psychology confirms a shared premise, allowing reason to do its work. However, when one side registers a foundation—say, sanctity—and the other feels nothing but confusion, there is no shared premise from which to reason. To argue with someone who feels no visceral revulsion at flag desecration is not to enlighten them; it is to speak a language they do not speak. In these instances, the lesson of the psychology is pragmatic: stop trying to win the argument and start designing institutions that allow both parties to live together despite the incompatibility.

  Your first objection concerns the charge that claiming someone 'does not register' a foundation is itself a moral judgement smuggled in as psychology. It is crucial to maintain the distinction between the *capacity* for a sentiment and the *validity* of that sentiment. To state that a liberal does not experience a sanctity-based intuition is a descriptive claim about their phenomenological response to stimuli, akin to noting someone does not enjoy spicy food. It becomes a smuggled judgement only if one assumes that experiencing the intuition is a necessary condition for moral competence. MFT, properly understood, describes the distribution of moral tastes; it does not validate the menu. To move from 'they do not feel this' to 'they ought to feel this' requires a normative premise that the psychology itself cannot supply. Without that extra step, the observation remains neutral regarding who is morally correct.

  Your mate's second objection, comparing the liberal to a colour-blind person who must be corrected rather than negotiated with, fails because it relies on a dubious analogy between moral intuition and sensory perception. Colour vision tracks mind-independent properties of light wavelengths; if you lack it, you are missing information about the physical world. Moral foundations, however, are not perception organs for mind-independent moral truths; they are evolutionary heuristics for solving specific social adaptive challenges, such as coalition formation or hierarchy maintenance. A heuristic is not a truth-tracking device in the same sense as a retina. Consequently, lacking a specific heuristic is not necessarily a deficit; it may be an immunity. If the 'sanctity' foundation sometimes leads to harmful purity spirals or the oppression of outsiders, then lacking that intuition might be a feature rather than a bug. To say the liberal is morally blind assumes that the conservative's intuitions map onto moral reality, but MFT offers no evidence for that mapping, only for the existence of the intuitions themselves.

  Therefore, the theory cannot support your mate's demand for deference. If the liberal lacks a 'moral sense' for authority, it does not follow that authority is objectively morally salient; it follows only that the conservative is psychologically predisposed to value it. Recognising this distinction prevents us from wasting energy on unresolvable cultural clashes while preserving the space for rational debate where our moral languages overlap. The value of the psychology is not in telling us who wins, but in telling us which fights are worth having as arguments and which are merely differences in temperament that require political compromise.
