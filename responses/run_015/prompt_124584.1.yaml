  5.  **Drafting the Marking Scheme:**
      *   5 points x 4 marks = 20.
      *   Point 1: Classic Ring analysis (social sanction).
      *   Point 2: Open Ledger analysis (reputation vs. act).
      *   Point 3: Clean Slate analysis (internal sanction/character).
      *   Point 4: The Socratic Collision (Action vs. State).
      *   Point 5: The Verdict (Circularity vs. Metaphysical Claim).
      *   *Differentiation:* A grades challenge the coherence of the Clean Slate ring. B grades accept the ring and try to find external consequences.
      *   *Negative Constraints:* No marks for summarizing Book II plot, no marks for defining justice without referencing the rings.

  6.  **Review against Constraints:**
