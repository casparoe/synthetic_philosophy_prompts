          2.  Analysis of Rings: Classic (removes social fear), Open Ledger (removes agent-specific shame, tests social order), Clean Slate (removes internal psychic cost).
          3.  The Crux: Clean Slate attacks the City-Soul analogy. If actions don't affect the soul, is justice intrinsic?
          4.  Socratic Defense: Can Socrates say the action *itself* is the disorder? Or is the stipulation impossible?
          5.  Conclusion: The Clean Slate ring forces Socrates to argue that unjust action *just is* psychic disorder, making the ring metaphysically impossible, not just physically magic.
      *   *Word Count:* Aim for 800ish.
