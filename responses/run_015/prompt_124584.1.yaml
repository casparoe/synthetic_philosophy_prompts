      *   **Key Tool:** Three ring variants:
          1.  Classic Ring of Gyges (Invisibility).
          2.  Open Ledger Ring (Invisibility + Public Knowledge of Acts, but not Agent).
          3.  Clean Slate Ring (Invisibility + Zero Psychological Residue/Character Change).
