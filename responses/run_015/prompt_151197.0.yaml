  4.  **Evaluate Severity and Consistency:**

      *   *Severity 1 (Critical):* (2) vs. (3). This is the heart of the user's worry ("am I helping myself to something in (2) and (4) that (3) rules out?"). Strict Popperism does not allow "right but early" if the "early" excuse is formulated post-hoc to explain away failure.
      *   *Severity 2 (High):* (4) vs. (3). Is "endogenous tech" a legitimate theoretical refinement or an immunizing stratagem? In Lakatosian terms, is it a progressive or degenerating shift?
      *   *Severity 3 (Medium):* (1) vs. (4). This is manageable if distinguishing between *specific predictions* (falsified) and *general principles* (vindicated).
      *   *Severity 4 (Low):* (2) vs. (5). This is a weighting issue. Can be resolved by clarifying "grading."

  5.  **Drafting the Audit (Iterative Process):**

