      *   **Tension D: (2) vs. (5) - The "Right but Early" vs. "Predictive Failure Weights Heavier" Conflict.**
          *   (5) says: Predictive failure is the heavy weight.
          *   (2) says: Ignore/pardon predictive failure because it was "early."
