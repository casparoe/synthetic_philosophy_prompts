          *   (3) says: If predictions fail and you add conditions (like "temporary masking"), you're saving face (ad-hoc).
          *   (2) says: It's okay if predictions fail temporarily because conditions masked the mechanism.
          *   *Conflict:* (2) sounds exactly like the "rescue hypothesis" condemned in (3). Claiming the Green Revolution was just a "temporary mask" looks like protecting the core Malthusian axiom from falsification.

      *   **Tension B: (1) vs. (4) - The "Falsified" vs. "Vindicated" Conflict.**
          *   (1) says: Malthus was falsified by data.
          *   (4) says: Malthus is vindicated by modern models (with a tweak).
          *   *Conflict:* Can a theory be both falsified (1) and vindicated (4)? Yes, if "Malthus" refers to different things (specific prediction vs. structural logic). But this needs careful handling to avoid equivocation.

      *   **Tension C: (4) vs. (3) - The "Endogenous Tech" vs. "Ad-Hoc Rescue" Conflict.**
