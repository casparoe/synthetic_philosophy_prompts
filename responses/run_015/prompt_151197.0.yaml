      *   (4) *Theoretical Claim:* Modern ecological carrying-capacity models vindicate Malthus *structurally*, provided technology is treated as *endogenous* (inside the system) rather than exogenous.
      *   (5) *Evaluative Claim:* Long-run predictive failure weighs heavier than structural analogy when grading a theory.

  3.  **Identify the Tensions/Conflicts:**

