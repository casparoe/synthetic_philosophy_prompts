answer: |-
  ### 1. Exam Question

  **Question 4 (25 Marks)**

  Standard wild animal suffering (WAS) arguments often focus on the balance of pleasure and pain within existing populations. Consider instead the following argument based on **Trophic Replacement Asymmetry (TRA)**:

  > "Natural ecosystems rely on high-turnover predation cycles. Destroying a habitat kills current occupants (acute suffering), but it also prevents the conception of future replacements who would have undergone these cycles (prevented chronic suffering). Because non-existence precludes suffering, the prevention of future trophic cycles outweighs the cost of current death."

  Critically evaluate this claim. Does the Trophic Replacement Asymmetry successfully sustain the conclusion that habitat destruction is welfare-positive (net-good), or does the calculus collapse when you model ecosystem replacement and displacement properly? Your answer must engage directly with the mechanics of TRA rather than general appeals to biodiversity or intrinsic value.

  ***

  ### 2. Model Answer

  The argument from Trophic Replacement Asymmetry (TRA) attempts to bypass standard environmental intuitions by applying a negative utilitarian calculus to ecosystem dynamics. It posits that habitat destruction is not merely a truncation of life but a interruption of a suffering-generating machine. To evaluate whether TRA sustains the claim that destruction is net-good, we must analyze the weighting of acute versus chronic suffering, the metaphysics of replacement, and the spatial dynamics of displacement.

  Proponents of TRA rely on the asymmetry between existence and non-existence. In a stable ecosystem, high mortality rates (predation, starvation, disease) are coupled with high birth rates. Individual A dies, but Individual B is born to occupy the niche, undergoing similar suffering. If habitat destruction eliminates the niche, Individual A dies now, but Individual B is never conceived. If the suffering inherent in the life-cycle of B outweighs the suffering of A's premature death, destruction appears welfare-positive. This logic holds weight if one accepts that preventing a life of net-negative welfare is morally equivalent to relieving existing suffering.

  However, the calculus collapses when modeling the *quality* of death. TRA assumes the suffering of destruction (burning, crushing, starvation via habitat loss) is comparable to or less than the suffering of natural trophic cycles. This is empirically dubious. Habitat destruction often induces panic, prolonged starvation, and exposure—suffering that may be more intense than a swift predation event. If the acute suffering of destruction exceeds the chronic suffering of the prevented life cycles, the net-good claim fails immediately. The asymmetry only works if the "cost" of destruction is low relative to the "savings" of non-existence.

  Furthermore, TRA often models ecosystems as closed systems, which leads to a second failure point: displacement. Animals rarely remain stationary during habitat destruction; they migrate. If destroying Habitat X forces populations into Habitat Y, the suffering is not prevented but displaced and potentially compounded. Habitat Y may have higher competition density, increasing starvation and conflict suffering. In this model, TRA does not eliminate future trophic cycles; it compresses them into smaller areas, potentially increasing the suffering per unit area. The "prevention of replacement" only holds if the animals die rather than migrate. If they migrate, the asymmetry vanishes because the future sufferers (Individual B) still exist, now under worse conditions.

  Finally, there is the issue of ecosystem resilience. Many ecosystems regenerate. If destruction is temporary (e.g., logging followed by regrowth), the trophic cycles pause rather than cease. The "prevented suffering" is merely deferred. For TRA to justify destruction as net-good, the destruction must be permanent enough to prevent the recurrence of the niche. Temporary destruction incurs the acute suffering cost without securing the long-term benefit of non-existence for future replacements.

  In conclusion, while Trophic Replacement Asymmetry identifies a neglected variable in WAS ethics—the moral relevance of preventing future sufferers via niche elimination—it fails to sustain the claim that habitat destruction is net-good. It underestimates the intensity of destruction-induced death, ignores the displacement of suffering into adjacent ecosystems, and overlooks ecosystem regeneration. The asymmetry exists conceptually, but empirically, the costs of destruction likely outweigh the welfare savings of prevented existence.

  ***

  ### 3. Marking Scheme

  **Total: 25 Marks**

  | Conceptual Move | Marks | Typical Mistake |
  | :--- | :---: | :--- |
  | **1. Accurate Reconstruction of TRA**<br>Student clearly defines TRA as the trade-off between current death vs. preventing future replacement suffering (non-identity logic). | 5 | Confusing TRA with standard biodiversity loss arguments or ignoring the "replacement" mechanism entirely. |
  | **2. Intensity Comparison (Acute vs. Chronic)**<br>Student analyzes whether death by destruction is morally worse than death by predation/starvation within the cycle. | 5 | Assuming all death is equal in suffering cost, or ignoring the phenomenology of habitat destruction. |
  | **3. The Non-Existence Condition**<br>Student engages with the claim that preventing conception is the only way TRA yields welfare gains (vs. migration). | 5 | Failing to distinguish between animals dying vs. animals moving (treating displacement as prevention). |
  | **4. Displacement/Spillover Modeling**<br>Student considers whether destroyed populations migrate to worse habitats, compounding suffering rather than eliminating it. | 5 | Treating the habitat as a closed system and ignoring spatial displacement effects. |
  | **5. Coherent Normative Verdict**<br>Student provides a clear conclusion on whether TRA saves the "net-good" claim, consistent with their previous analysis. | 5 | Sitting on the fence without justification, or contradicting their own analysis in the conclusion. |
