answer: |-
  Your proposed reading is philosophically robust and pedagogically necessary, but it risks conflating the precondition of thought with the mechanics of reasoning. You are correct that the standard taxonomy (Frame, Ramification, Qualification) presupposes a conceptual scheme that Funes lacks. By positioning Borges's story as an illustration of the "Generality Problem"—the requirement that situations be typed before persistence can be assessed—you rescue the text from being merely a metaphor for memory overload. However, this reading succeeds only if you treat Funes not as a solution to the frame problem, but as a demonstration of its impossibility without prior abstraction. The story earns its place on the syllabus, but only if you prevent students from mistaking a phenomenological description for a computational architecture.

  Regarding the three moments you selected, they form a coherent argument for the primacy of abstraction. The numbering system is the strongest evidence for your thesis. When Funes assigns unique names like "Maximo Perez" to 7013 and "The Nine" to 7014, he rejects place-value notation because place-value requires treating distinct tokens as instances of the same type (the digit '7' in different positions). For Funes, every number is a unique individual. This is not a failure of storage; it is a failure of syntax. Without variables, there is no logic, and without logic, there is no frame problem because there is no inference to restrict.

  The incident with the dog is equally critical. Funes's irritation that the dog seen in profile bears the same name as the dog seen from the front reveals that identity conditions are not given but constructed. In standard AI terms, the frame problem assumes we can identify object $O$ at $t_1$ and $t_2$. Funes shows that this identification is already an act of violence against the particularity of experience. If every perceptual snapshot is a unique world, nothing persists, and the question of what changes becomes meaningless. Finally, the narrator's reflection that "to think is to forget" provides the normative claim your seminar needs. It asserts that cognition is essentially lossy compression. If you present these three moments sequentially, you demonstrate that the frame problem is downstream of concept possession: you cannot filter relevance until you have created the categories that make relevance possible.

  This leads to your question about relevance. Funes suffers from neither too much relevance nor too little; he suffers from the absence of a similarity space. Relevance is a relation between a goal and a feature within a category. If every feature is unique and every goal is situated in a unique context, the metric for relevance collapses. Describing this as "everything is equally relevant" is misleading because equality implies a common measure. For Funes, nothing is relevant because nothing is comparable. This distinction matters for the frame problem because it suggests that relevance filters are not independent modules (as some modular theories of mind might suggest) but are emergent properties of the conceptual scheme itself. You cannot solve the frame problem by adding a filter to a Funes-like system; you must first break the system's fidelity.

  The ending, where Funes dies young, is often misread as a cautionary tale about memory capacity. Your reading correctly identifies it as a claim about the frame problem's existential cost. Funes does not die because his brain is full; he dies because he is immobilized by the density of the present. If every moment is unique, planning is impossible because the future cannot be modeled using past data. This is not merely about exhaustion; it is about the inability to navigate time. The frame problem is fundamentally about temporal projection—assuming the future resembles the past enough to act. Funes cannot project, so he cannot act, so he cannot survive. The story claims that biological viability depends on cognitive error.

  Your worry about Funes's paralysis is well-founded but manageable. It is true that the practical frame problem usually arises in the context of action (the robots blowing up). Funes is physically inert. However, his paralysis is not just physical; it is cognitive. He is paralyzed by the inability to generalize. If you lean into the "qualification problem" pun—that every action requires infinite qualifications to be safe—you risk trivializing the argument. Instead, argue that his physical immobility is the somatic expression of his cognitive state. He cannot move because moving requires assuming the ground will hold, the air will breathe, and the body will obey. For Funes, each of these is a unique fact requiring unique verification. He is not an agent who fails to solve the frame problem; he is a subject for whom the conditions of agency never obtain. This makes him a limit case rather than a standard agent, which is precisely why he is useful: he shows what happens when the background assumptions of agency are removed.

  This brings us to the comparison with Dennett's robots. The robot thought experiments are structural; they show how a system crashes when it lacks heuristics. Borges provides the phenomenological interior of that crash. The robots show the *that*; Funes shows the *what it is like*. This is not a sentimental extra; it is a necessary correction to the functionalist tendency to treat the frame problem as merely an engineering bottleneck. The robots imply that if we just build the right filter, the problem vanishes. Funes suggests the problem is constitutive of finite life. The robot breaks because of a bug; Funes suffers because of a truth. Including the story prevents students from viewing the frame problem as a technical glitch to be patched rather than a fundamental condition of embodied cognition. It forces them to confront the fact that "solving" the frame problem might require becoming less rational, not more.

  However, here is where your reading breaks. By framing this as the "Generality Problem," you risk importing a specific philosophical baggage (perhaps Evansian) that Borges does not sustain. Borges is writing about memory and time, not necessarily concept possession in the analytic sense. If you push the reading too hard, you reduce the story to a parable for cognitive science, ignoring its literary engagement with infinity and identity. The story is not *about* the frame problem; it is *compatible* with a frame problem reading. If you present it as the definitive illustration of the Generality Problem, students may miss the ambiguity that makes the story rich. Funes is also a figure of tragic omniscience, not just a failed reasoner.

  Furthermore, there is a danger in suggesting that relevance is merely a by-product of similarity classes. While Funes supports the claim that abstraction precedes relevance filtering, it does not follow that all relevance is derived from static classes. Dynamic relevance tracking might exist independently of broad conceptual types. Funes represents the extreme pole of zero abstraction; most cognitive systems operate in a middle ground where relevance is negotiated, not just filtered. Using Funes to argue that "the interesting work is in the theory of concepts" might lead students to neglect the architectural problems of real-time inference. The frame problem is not only about what concepts we have, but how we manipulate them under time pressure. Funes has no time pressure because he does nothing; the robots have too much. The truth lies in the action between them.

  Verdict: The story earns its place on the syllabus, but not as a replacement for the technical literature. It should be used to bracket the discussion. Begin with Funes to establish the precondition of abstraction, then move to the robots and logic to show how that abstraction is implemented (or fails) in action. If you present Funes as the solution to the relevance problem, you will mislead your students. If you present him as the limit case that defines the boundary of where the frame problem begins, you will deepen their understanding of why the problem exists at all. The omission of his physical agency is not fatal; it is the story's specific contribution. It isolates the cognitive bottleneck from the mechanical output. Use it to show that before we worry about what changes when we act, we must worry about how we know what we are acting upon. That is the genuine generality problem, and Borges owns it.
