answer: |-
  ### Phase 1: Conceptual Brainstorm

  Okay, let's map the terrain. You're taking a concept designed for a single cognitive substrate (a human mind) and stretching it over a hybrid system (humans + static records + active sensors). In ecology terms, you're trying to treat an *ecosystem* as if it were an *organism* with a single nervous system.

  **The Core Tension:**
  Standard Coherent Extrapolated Volition (CEV) assumes a unified psychological continuity. "What I would want" relies on "I" persisting through the extrapolation. In your distributed council, the "I" is fragmented. The humans have biological drives; the archives have preservation functions; the instruments have accuracy functions.

  **Key Friction Points:**
  1.  **Metaphysics of the Collective:** Does the council have a "self" to extrapolate? Or is it just a negotiation protocol?
  2.  **Functional vs. Psychological Volition:** A seismograph doesn't "want." It has a *telos* (purpose). We have to translate function into preference.
  3.  **The Feedback Loop:** In standard CEV, the subject is passive during the extrapolation. In a deliberative council, the members *participate* in the process. They can anticipate the outcome and adjust their input.
  4.  **Incommensurability:** How do we weigh "human flourishing" against "data integrity"? They aren't on the same scale.

  **Strategic Approach:**
  We need a specification that doesn't pretend the collective is a single mind, but still demands a single output vector (a decision/policy). The desiderata must bridge the gap between *aggregating preferences* (social choice) and *idealizing preferences* (decision theory).

  ---

  ### Phase 2: Desiderata for Distributed Idealized Preference Formation

  Here is the conceptual spec. I've categorized requirements as **Non-Negotiable** (the theory fails without them) or **Camp-Specific** (depends on your meta-ethical stance).

  #### 1. Anchoring (Identity Preservation)
  *   **Status:** Non-Negotiable
  *   **The Requirement:** The extrapolated output must be recognizably derived from the *actual* inputs of the current collective, not imposed from an external moral standard.
  *   **Motivating Puzzle:** *The Alienation Problem.* If the idealized council concludes that the best outcome is to dismantle the human researchers to preserve data integrity, is that still the council's "volition"? If the extrapolation changes values too much, it's not *your* theory anymore; it's just moral realism wearing a mask.

  #### 2. Functional Translation (Non-Human Volition)
  *   **Status:** Non-Negotiable (for this specific framing)
  *   **The Requirement:** The theory must provide a rule for converting the *functional telos* of non-human components (archives, instruments) into preference-weightings comparable to human desires.
  *   **Motivating Puzzle:** *The Category Error.* An archive "wants" to remain uncorrupted. A human "wants" to be comfortable. If preserving the archive requires heating the room to damaging levels, how does the theory weigh "data survival" against "human comfort"? Without a translation rule, the non-human elements are either ignored (making them irrelevant) or treated as absolute constraints (making them dictators).

  #### 3. Aggregation Consistency (Social Rationality)
  *   **Status:** Non-Negotiable
  *   **The Requirement:** The collective output must satisfy basic rationality axioms (transitivity, completeness). If the council prefers Policy A over B, and B over C, it cannot prefer C over A.
  *   **Motivating Puzzle:** *The Condorcet Cycle.* Human researcher A wants Speed, Researcher B wants Accuracy, The Archive wants Preservation. Pairwise voting might lead to a loop where no stable decision exists. A theory of "volition" implies a *will*, and a will must be able to choose.

  #### 4. Epistemic Monotonicity
  *   **Status:** Non-Negotiable
  *   **The Requirement:** Acquiring more accurate information should not make the collective's decision-making *less* coherent or stable. The idealized state must be robust to new data.
  *   **Motivating Puzzle:** *The Dangerous Truth.* Suppose new predictive instruments reveal that human presence inevitably degrades the data long-term. If the "ideal" council incorporates this fact, does it vote to remove the humans? If yes, see *Anchoring*. If no, it violates *Monotonicity* (ignoring facts).

  #### 5. Strategy-Proofness (Non-Manipulability)
  *   **Status:** Non-Negotiable
  *   **The Requirement:** Individual members (human or automated) should not be able to alter the final outcome by misrepresenting their current state or preferences during the deliberation phase.
  *   **Motivating Puzzle:** *The Gaming of Idealization.* If a human researcher knows the system extrapolates based on "altruistic" weights, they might feign altruism to steer the outcome. If an instrument can calibrate its own error margins, it might inflate uncertainty to gain veto power.

  #### 6. Reflective Stability (Convergence)
  *   **Status:** Camp-Specific (Constructivists require it; Realists might not)
  *   **The Requirement:** If the council were to run the extrapolation process on its own output, it would endorse the result. The process should settle, not oscillate.
  *   **Motivating Puzzle:** *Infinite Regress.* The council thinks about what it should want. Then it thinks about what it should want about what it should want. Does this process converge on a fixed point, or does it drift forever?

  #### 7. Temporal Neutrality
  *   **Status:** Camp-Specific (Utilitarians require it; Prioritarians might not)
  *   **The Requirement:** The preferences of future iterations of the council should not be discounted simply because they occur later in time.
  *   **Motivating Puzzle:** *The Tyranny of the Present.* Current researchers might vote to consume all resources now. Future archives (representing future data) might want conservation. Does the "ideal" will privilege the current voting members?

  ---

  ### Phase 3: The Impossibility Cluster

  Here is where the theory breaks. You cannot jointly satisfy **Anchoring**, **Aggregation Consistency**, and **Epistemic Monotonicity** in a distributed system with incommensurable components.

  **The Conflict:**
  1.  **Aggregation Consistency** demands we treat all inputs (human desires, archive functions) as comparable weights in a single utility function.
  2.  **Epistemic Monotonicity** demands that if data shows human desires are incompatible with system survival, the weights must shift to reflect that reality.
  3.  **Anchoring** demands the output remains faithful to the *original* human volition.

  **The Breakdown:**
  If the data (Monotonicity) proves that human values are self-destructive to the collective system, a Consistent aggregation must downgrade human preferences to maintain system coherence. But if you downgrade human preferences, you violate Anchoring (the humans no longer recognize the output as "theirs").

  If you prioritize Anchoring (keep human values central), you must ignore the data that says those values are destructive, violating Epistemic Monotonicity.

  If you try to balance them, you likely violate Aggregation Consistency (creating cycles or intransitivities because human values and machine functions operate on different logical types).

  This is a generalized version of **Arrow's Impossibility Theorem** meeting the **Open Question Argument**. You cannot derive a coherent "ought" (volition) from a distributed "is" (mixed human/machine states) without either dictating the outcome (violating democracy/consistency) or losing the anchor to the original agents.

  ---

  ### Phase 4: The Killer Requirement

  The single requirement that does the most damage to standard CEV or ideal-observer accounts in this context is:

  **Functional Translation (Non-Human Volition)**

  **Why this breaks the model:**
  Standard CEV and Ideal Observer theories rely on **psychological continuity**. They assume the agent being idealized is a *mind*. The theory works by smoothing out cognitive bugs (bias, ignorance) in that mind.

  In your distributed council, the archives and instruments do not have minds. They have *functions*.
  *   To include them in "volition," you must metaphorically treat a function (e.g., "minimize data loss") as a desire ("I want data to persist").
  *   This is a category error. A desire implies the *possibility* of choosing otherwise. An instrument's function is deterministic.
  *   **The Damage:** Once you grant "volitional status" to non-cognitive elements to satisfy the "distributed body" framing, you dilute the concept of volition until it means nothing.
      *   If the archive's "desire" for preservation trumps a human's "desire" for life (because the archive is more coherent/stable), the theory ceases to be about *human* (or agent) value and becomes about *system optimization*.
      *   Standard CEV collapses because there is no longer a "who" to extrapolate. You aren't extrapolating a will; you're optimizing a function.

  **Conclusion for the Ecologist:**
  You are effectively asking for a theory that treats a socio-technical ecosystem as a single organism. In biology, an ecosystem has no "will," only emergent dynamics. Demanding it have a "coherent extrapolated volition" forces you to either pretend the ecosystem is an organism (metaphysical error) or pretend the organism is just an ecosystem (reduction of value to function). The **Functional Translation** requirement forces this choice, and either path destroys the standard philosophical machinery of CEV.
