prompt: |-
  hey — retired field ecologist here, recently got into philosphy and i'm trying to wrap my head around value theory. please act like a professional philosopher of decision theory and think carefully, maybe start with a quick brainstorm, before you answer. i'm not asking for citations or a reading list; i just want the conceptual spec.

  so here's a niche framing: imagine we need a theory of "coherent extrapolated volition" not for a single person but for a distributed deliberative body — like an interdisciplinary science council that includes human researchers, long-term data archives, and predictive instruments — and we want to know what that collective "would want" if it were more informed, more coherent, and stripped of cognitive biases. write the full desiderata list: what must any adequate theory of collective idealized preference formation actually deliver? for each requirement, give the motivating case or puzzle behind it (e.g., temporal drift in values, aggregation across agents with incommensurable goals, non-manipulability, consistency with revealed preferences, handling of partial information, distinction between "what we want" and "what we want to want"). flag which ones are non-negotiable and which are camp-specific preferences. then tell me which subset looks jointly unsatisfiable — maybe coherence with full information conflicts with non-manipulability? — and identify the single requirement that does the most damage to standard CEV or ideal-observer accounts. keep it concrete; no need to name-check obscure papers.
