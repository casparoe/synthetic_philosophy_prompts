  **TO:** All Academic Staff and Research Fellows
  **FROM:** Foundations Steering Group
  **DATE:** 14 September
  **SUBJECT:** Mandatory Migration to Intuitionistic Core v1.0 (Effective Michaelmas)

  Following a strategic review of our foundational stack, the Department announces a compulsory migration from Classical to Intuitionistic foundations, effective Michaelmas Term. This realignment ensures our output remains computationally meaningful and future-proofed. All staff must adapt their workflows to the new kernel. Please review the following technical specifications and change-management protocols.

  **1. Legacy Compatibility and Translation Layers**
  To facilitate transition, a Gödel-Gentzen double-negation compatibility layer is available. This wrapper allows legacy classical proofs to run in the new environment by translating propositions into their double-negated forms. Staff should note that this layer is not universal; certain classical deliverables will fail to compile without manual refactoring. While many theorems remain accessible via this translation, reliance on legacy semantics is deprecated. Users expecting a one-click migration are advised that significant proof engineering may be required to restore previous functionality.

  **2. Deprecation of Excluded Middle**
  The Law of Excluded Middle (LEM) is hereby deprecated. It is not refuted, but it is no longer enabled by default. Users may note that the double negation of excluded middle (¬¬(P ∨ ¬P)) still ships with the core package, and triple negation collapses to single negation (¬¬¬P → ¬P). However, direct case-splitting on P ∨ ¬P is no longer supported without a constructive witness. Workflows relying on non-constructive existence claims will require adjustment to meet new compliance standards.

  **3. Enhanced Deliverables: Witnesses and Disjunction**
  A key feature of the upgrade is the enforced Disjunction and Existence Property. Henceforth, every existence proof must return a witness object. Existential theorems will now arrive with a constructed example attached, ensuring all outputs are operationally valid. Similarly, disjunctions (P ∨ Q) require a flag indicating which disjunct holds. This ensures transparency, though it may increase proof overhead and延长 delivery timelines for abstract entities.

  **4. Real Analysis and Continuity Protocols**
  Decidable equality on the Reals has been removed due to incompatibility with the new kernel. It is replaced by a positive apartness relation (#). Consequently, the semantic environment now enforces continuity: every total function on the reals comes out continuous. The Intermediate Value Theorem survives only in its approximate form; exact roots are no longer guaranteed deliverables. Truth-table semantics are unsupported. Staff working in analysis must update their definitions to accommodate apartness rather than equality.

  **5. Optional Licences and Add-ons**
  The Fan Theorem is available as an optional licence to be installed separately, depending on your compactness requirements. Staff should exercise extreme caution with the Axiom of Choice add-on. Please be advised that, per Diaconescu's theorem, enabling Choice will quietly restore the Law of Excluded Middle, potentially voiding your intuitionistic compliance certification. This conflict is a known architectural constraint.

  **6. Supported Distributions**
  The Department supports three mutually incompatible builds. Users must select one during initialization:
  *   **Brouwerian:** Includes choice sequences; validates continuity of all total functions.
  *   **Bishop-style:** Common core; avoids strong continuity claims but restricts classical results.
  *   **Russian (Markov):** Includes Markov's Principle; differs on decidability assumptions.
  Cross-build collaboration is not supported. Theorems proved in one distribution may not import cleanly into another. Each build carries different baggage regarding choice sequences and classical theorem validity.

  **7. Known Issues**
  Users may encounter weak counterexamples generated by the creating subject. These are documented features rather than bugs, though they may obstruct certain classical expectations. If you experience uncertainty regarding the truth value of open problems, this is expected behaviour within the new system.

  For support, submit a ticket with a constructed witness of your problem. Tickets lacking algorithmic content will not be processed.

  **Foundations Steering Group**
  *University Mathematics Department*
