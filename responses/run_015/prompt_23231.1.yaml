      *   Step-by-Step Adjudication (Round 1, 2, 3).
      *   The "Missing Middle" (What both missed).
      *   Conclusion/Verdict.

  8.  *(Self-Correction during drafting)*: Make sure to explicitly answer "who's right at each step." I will use headings for clarity.

      *   *Round 1:* Alex is conceptually right; Jordan is psychologically right.
      *   *Round 2:* Alex is logically right; Jordan is epistemically right.
      *   *Round 3:* Alex is right on moral worth; Jordan is right on moral luck/negligence.
      *   *Missing:* Overdetermination, Quality of Will, Rightness vs. Worth.

  9.  **Final Polish:** Check against the prompt requirements. "Careful adjudication," "who's right at each step," "point out anything both are missing."

      *   *Wait, one nuance:* Jordan says "makes moral worth a matter of intention alone, which is too subjective." Alex says "outcome-only... is clearly worse." Actually, in modern ethics, "Moral Worth" *is* largely about the agent's state (intentions/will), whereas "Rightness" is about the act. Jordan is conflating worth with rightness slightly. I should clarify that.

      *   *Another nuance:* Jordan's point about "entanglement" is actually a specific philosophical argument (the opacity of motivation). Alex's response about "vagueness" is a standard defense of conceptual boundaries.

