answer: |-
  I need to start with a crucial clarification: **there is no recognized regulatory mechanism or legal statute known as the "micro-burden pooling exemption."** This term does not appear in U.S. administrative law (e.g., TSCA, OSHA, Clean Air Act) or in standard regulatory policy literature.

  It sounds like you may be describing a **philosophical thought experiment** or a conflation of several distinct regulatory concepts (such as *de minimis* risk thresholds, the distinction between individual vs. population risk, or the "significant risk" standard established in *Industrial Union Dept. v. American Petroleum Institute*).

  However, the **philosophical tension you've identified is very real**, even if the specific label is not. Regulatory agencies often do seem to toggle between aggregating small harms (in climate policy) and prioritizing the protection of individuals from severe harms (in occupational safety or toxic torts).

  Here is an analysis of the philosophical commitments presupposed by the dynamic you described, and whether there is a consistent theory underlying it.

  ### 1. The Philosophical Commitments of the "Chemical" Scenario
  If an agency bans a chemical because it might blind *one* worker, while allowing a chemical that gives *millions* a headache, it presupposes a **Non-Aggregative** or **Threshold Deontological** view of harm.

  *   **Rights as Side Constraints:** This approach treats severe bodily integrity violations (blindness) as rights violations. In this framework, rights are "trumps" (to use Dworkin's term). You cannot aggregate a million minor welfare losses to justify violating one person's right to bodily integrity.
  *   **The Separateness of Persons:** This aligns with John Rawls' criticism of utilitarianism. It assumes that suffering is *not* fully fungible across persons. The loss to the one worker is not cancelable by the distributed gains (or avoided headaches) of the millions.
  *   **Identifiable Victim Effect:** Psychologically and legally, we treat "statistical deaths" differently than "identified victims." If the worker is specific, the "Rule of Rescue" kicks in. However, in regulatory policy, this usually applies to *individual risk* (e.g., OSHA's mandate to ensure no single worker faces a significant risk) vs. *population risk*.

  ### 2. The Philosophical Commitments of the "Climate" Scenario
  When the same agency uses Cost-Benefit Analysis (CBA) for climate regulations, multiplying small discomforts across billions, it presupposes a **Utilitarian** or **Welfarist** view.

  *   **Fungibility of Suffering:** This assumes a headache in Person A is mathematically equivalent to a headache in Person B, and that $N \times \text{small harm}$ can outweigh a large cost to a specific industry.
  *   **Kaldor-Hicks Efficiency:** The goal is overall social welfare maximization. If the aggregate benefit (avoided climate damage) exceeds the aggregate cost (regulatory burden), the rule is justified, regardless of distribution.

  ### 3. Is There a Consistent Theory?
  You asked if there is a consistent view that licenses both, or if they are contradictory. There are three ways to interpret this:

  #### A. The "Statutory Mandate" Explanation (Pragmatic, not Philosophical)
  The most likely real-world explanation is that there is **no consistent philosophical theory**. Instead, there is **legislative fragmentation**.
  *   **OSHA/TSCA:** Often operate under statutes that mandate protecting workers from "significant risk" regardless of cost (or with cost only as a secondary factor). The Supreme Court (in the *Benzene* case) ruled that agencies must find a significant risk to *individuals* before regulating.
  *   **EPA/Climate:** Often operate under statutes (like Executive Order 12866) that explicitly mandate Cost-Benefit Analysis.
  *   **Verdict:** The inconsistency isn't philosophical; it's bureaucratic. Congress gave different agencies different mathematical instructions.

  #### B. The "Severity Threshold" Explanation (Threshold Deontology)
  One could argue for a consistent philosophical view called **Threshold Deontology**.
  *   **Theory:** Small harms (headaches) are fungible and aggregable. However, once a harm crosses a certain threshold of severity (blindness, death, loss of autonomy), it becomes non-aggregable.
  *   **Consistency:** This licenses both practices. Climate change involves billions of small-to-moderate welfare losses (fungible, so we sum them). A chemical causing blindness is a catastrophic individual rights violation (non-fungible, so it vetoes the policy).
  *   **Problem:** This raises the question: *Where is the threshold?* Why is blindness a veto but a migraine isn't? This view relies on a qualitative distinction between types of harm, not just quantity.

  #### C. The "Epistemic Uncertainty" Explanation
  *   **Theory:** We aggregate climate harms because the models are probabilistic and distributed. We ban the chemical causing blindness because the harm is **irreversible** and **concentrated**.
  *   **Consistency:** This isn't about moral fungibility but about **risk management**. A headache is reversible; blindness is not. A distributed climate risk allows for adaptation; a specific toxic exposure might not.
  *   **Verdict:** This suggests the agency isn't weighing *moral worth* differently, but weighing *uncertainty and irreversibility*.

  ### 4. Conclusion: Is Suffering Fungible?
  To answer your core question: **Yes, the agency is presupposing contradictory things about whether suffering is fungible across persons.**

  *   In the **Climate Domain**, they treat suffering as **fungible**. Your discomfort is a unit of negative utility that can be summed with mine to justify a policy.
  *   In the **Chemical/Worker Domain** (as you described it), they treat suffering as **non-fungible**. The worker's blindness is a distinct moral event that cannot be washed out by the aggregate comfort of the population.

  **The Philosophical Implication:**
  This inconsistency mirrors the central debate in modern moral philosophy between **Contractualism** (Scanlon) and **Utilitarianism** (Sumner/Sunstein).
  *   **Contractualism:** A policy is unjust if a single person could reasonably reject it based on the severe burden placed on them, even if it benefits the majority. (Fits the Chemical Ban).
  *   **Utilitarianism:** A policy is just if it maximizes net welfare, even if it burdens a few significantly. (Fits the Climate CBA).

  **Final Verdict:**
  If an agency truly operates this way, they are engaging in **contextual moral pluralism**. They are implicitly arguing that *the type of regulatory context dictates the moral math.* In occupational safety, the individual is the unit of analysis (Rights-based). In climate policy, the population is the unit of analysis (Utilitarian).

  While this might be pragmatically necessary given different laws, philosophically, it is unstable. It suggests that the moral value of your headache depends entirely on which bureaucratic silo is regulating the source of the headache.
