answer: |-
  Your nagging feeling is well-founded. The blog post you read captures the *vibe* of Updateless Decision Theory (UDT) but stumbles significantly on the mechanics and the reasoning. It mixes a technically accurate mathematical description with a layman's explanation that contradicts it.

  Here is a breakdown of the specific claims, categorized by how a proponent of UDT (or a decision theorist familiar with the literature) would view them.

  ### 1. "UDT is a decision theory that says you shouldn't update your beliefs once you've observed the world."
  **Verdict: Subtle Mischaracterization / Misleading Simplification**

  *   **Why it's misleading:** This phrasing suggests a UDT agent ignores evidence (e.g., "I see a tiger, but I won't update my belief that tigers are dangerous"). That is not what UDT says.
  *   **The UDT view:** A UDT agent *does* use observations. However, it does not use observations to *re-evaluate its strategy*.
      *   **Standard Theory (CDT/EDT):** Observe world $\rightarrow$ Update beliefs $\rightarrow$ Choose best action.
      *   **UDT:** Choose best *policy* (a function mapping all possible observations to actions) based on your *prior* beliefs $\rightarrow$ Observe world $\rightarrow$ Execute the action the policy dictates for that observation.
  *   **The nuance:** You don't update your *goal* or your *strategy* based on new information; you only use the information to index into the strategy you already committed to. The blog post makes it sound like you remain ignorant, when actually you are just pre-committed.

  ### 2. "Before you act, you treat your decision process as a function and ask what the expected outcome would be if that function output a particular action."
  **Verdict: Accurate**

  *   **The UDT view:** This is the core mathematical insight of UDT. You are not choosing an *action* (e.g., "One-box"); you are choosing a *program* or *policy* (e.g., "If I see a box A and B, choose A; if I see only box B, choose B").
  *   **Why it matters:** By optimizing the function rather than the immediate action, you account for the fact that other entities (like predictors or copies of yourself) might be simulating or reasoning about that function.

  ### 3. "The predictor is trying to guess what you'll do, but since you're just a deterministic function, it can't really predict you, so you one-box..."
  **Verdict: Plain Wrong**

  *   **The Error:** This reasoning is backward. If you are a deterministic function, you are *easier* to predict, not harder. If your behavior is random, you are harder to predict.
  *   **The UDT view:** The reason you one-box in Newcomb's Problem is not because the predictor *fails* to predict you. It is because the predictor *succeeds* in predicting your source code.
      *   In UDT, you acknowledge that your decision and the predictor's prediction are logically correlated because they both depend on the same mathematical truth (your decision algorithm).
      *   By choosing the policy "Always One-Box," you make it true that the predictor (who simulated that policy) predicted "One-Box," and therefore put the million dollars in the box.
      *   The blog post implies a magical freedom from prediction; UDT implies an acceptance of logical determinism.

  ### 4. "Basically, UDT is standard Bayesian decision theory with the belief-updating step deleted."
  **Verdict: Technically Descriptive, but Pragmatically Dangerous**

  *   **The UDT view:** Mathematically, this is roughly correct. UDT maximizes expected utility relative to the **prior** probability distribution, whereas Causal Decision Theory (CDT) maximizes expected utility relative to the **posterior** (updated) distribution.
  *   **The Risk:** As with Claim 1, this sounds like "ignore data." A better summary is: "UDT is Bayesian decision theory where you optimize your **policy** using the prior, rather than optimizing your **action** using the posterior."
  *   **Why proponents endorse it:** This "updatelessness" solves time-inconsistency problems. If you update your beliefs, you might later want to precommit to things you no longer want to do. By sticking to the prior, you remain trustworthy to your past self (and others simulating your past self).

  ### 5. "UDT is only useful for Newcomb-type problems and not for real decisions."
  **Verdict: Disputed (and likely False in the context of AI Alignment)**

  This claim depends entirely on the distorted views presented earlier. If you think UDT is just "ignoring evidence to win parlor tricks," then of course it seems useless for real life. However, if you understand the actual mechanics, the claim falls apart.

  **Why UDT proponents argue it *is* for real decisions (especially in AI):**

  1.  **Precommitment and Credibility:** In human negotiations, being the kind of person who keeps promises even when it's no longer immediately beneficial is useful. UDT formalizes this. An AI using UDT doesn't need to build external commitment devices; its decision theory *is* the commitment device.
  2.  **Acausal Trade:** This is the big one for AI alignment. If two superintelligent AIs meet, they might not be able to communicate or enforce contracts. However, if they both run UDT, they can reason: "If I cooperate, my source code outputs 'cooperate'. The other AI is simulating my source code. Therefore, they will also cooperate." This allows cooperation without causal contact.
  3.  **Self-Modification:** An AI that expects to modify its own code in the future needs a decision theory that tells it to modify into something that will act optimally later. CDT agents often fail this (they might choose to blind themselves to avoid bad news). UDT agents are stable under self-modification.

  **Why the blog post claims it's useless:**
  The author likely subscribes to the view that "logical correlations" (like the predictor in Newcomb's problem) don't exist in the real world. They view the world as purely causal. If you believe the universe contains no Newcomb-like predictors, no logical twins, and no simulations, then UDT collapses into CDT. However, in AI alignment, we assume AIs *will* be able to read each other's code or simulate each other, making Newcomb-like problems the norm, not the exception.

  ### Summary for your understanding

  *   **What the post got right:** UDT involves optimizing a policy function based on a prior.
  *   **What the post got wrong:** It implies UDT agents ignore observations (they don't, they just don't let observations change their policy) and it garbled the logic of Newcomb's problem (determinism aids prediction, it doesn't hinder it).
  *   **The "Real Decisions" Claim:** This follows from the **distorted** parts. If you think UDT is just "magic for Newcomb's problem," it seems useless. If you see it as "how to handle logical correlations and precommitments," it is arguably *more* important for AI than for humans.

  **Recommendation:** If you want a clearer explanation, look for resources that distinguish between **Action-Optimization** (CDT/Evidential) and **Policy-Optimization** (UDT). The "Updateless" part refers to the optimization step, not the information-gathering step.
