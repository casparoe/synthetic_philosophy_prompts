answer: |-
  ### (1) Exam Question

  **Course:** PHI 505 – Advanced Topics in Formal Epistemology
  **Assessment:** Take-Home Final
  **Time Limit:** 40 Minutes
  **Word Limit:** 900 Words Maximum

  **Question: The Red Shirt Variants**

  Consider two hypotheses about the world, $H$ (Heads) and $T$ (Tails). A fair coin determines which is true, so the objective prior probability is $P(H) = P(T) = 0.5$. You are an observer who has just woken up. You do not know which hypothesis is true, but you observe that you are wearing a red shirt.

  Two anthropic principles are under consideration:
  *   **SSA (Self-Sampling Assumption):** Reason as if you are a random sample from the set of all observers in your reference class. Your evidence updates the prior based on the *fraction* of observers in each hypothesis who share your evidence.
  *   **SIA (Self-Indication Assumption):** Reason as if you are a random sample from all *possible* observers. You should weight each hypothesis by the *total number* of observers it contains before conditioning on your specific evidence.

  Analyze the following two variants. In both, calculate the posterior probability of $H$ given you are wearing a red shirt ($R$), under both SSA and SIA. Assume the reference class for SSA initially includes all observers (Red and Blue).

  *   **Variant A:** If $H$, 10 observers are created (10 Red, 0 Blue). If $T$, 1000 observers are created (10 Red, 990 Blue).
  *   **Variant B:** If $H$, 10 observers are created (1 Red, 9 Blue). If $T$, 1000 observers are created (100 Red, 900 Blue).

  **Task:**
  1.  Provide the arithmetic for the SSA and SIA posteriors for both variants.
  2.  Explain how changing the SSA reference class to "Red-Shirted Observers Only" alters the SSA verdicts.
  3.  Discuss whether these variants resolve the "Presumptuous Philosopher" objection (that SIA unjustifiably favors larger worlds) or merely relocate the controversy.

  ***

  ### (2) Model Answer

  **Variant Analysis**
  In both variants, the coin prior is 1:1. Let $N_H$ and $N_T$ be the total observers in $H$ and $T$. Let $n_H(R)$ and $n_T(R)$ be the number of red-shirted observers.

  **Variant A:**
  *   **SSA:** We condition on the fraction of observers who are Red.
      $P(R|H) = 10/10 = 1$. $P(R|T) = 10/1000 = 0.01$.
      Likelihood ratio $H:T$ is $100:1$. Posterior $P(H|R) \approx 0.99$.
  *   **SIA:** We weight by total observers ($N$), then condition on fractions.
      Prior weights: $H \propto 10$, $T \propto 1000$ (Ratio 1:100).
      Likelihoods (fraction of total): $P(R|H) = 1$, $P(R|T) = 0.01$.
      Posterior weights: $H = 10 \times 1 = 10$; $T = 1000 \times 0.01 = 10$.
      Ratio 1:1. Posterior $P(H|R) = 0.5$.

  **Variant B:**
  *   **SSA:**
      $P(R|H) = 1/10 = 0.1$. $P(R|T) = 100/1000 = 0.1$.
      Likelihood ratio 1:1. Posterior $P(H|R) = 0.5$.
  *   **SIA:**
      Prior weights: $H \propto 10$, $T \propto 1000$ (Ratio 1:100).
      Likelihoods: $P(R|H) = 0.1$, $P(R|T) = 0.1$.
      Posterior weights: $H = 10 \times 0.1 = 1$; $T = 1000 \times 0.1 = 100$.
      Ratio 1:100. Posterior $P(H|R) \approx 0.01$.

  **Reference Class Sensitivity**
  SSA is hostage to the reference class. If we narrow the class to "Red-Shirted Observers," the Blue observers vanish from the denominator.
  In **Variant A**, there are 10 Red in $H$ and 10 Red in $T$. The ratio becomes 1:1. SSA now matches SIA's 50/50 verdict.
  In **Variant B**, there is 1 Red in $H$ and 100 Red in $T$. The ratio becomes 1:100. SSA now matches SIA's Tails-favoring verdict.
  This demonstrates that SSA's divergence from SIA in the "All Observers" class stems entirely from how they treat observers *without* your evidence (the Blue shirts). SSA treats their existence as diluting your probability; SIA treats their existence as boosting the hypothesis prior.

  **The Presumptuous Philosopher**
  The Presumptuous Philosopher (PP) objection claims SIA allows us to infer a vast universe merely from our existence. These variants show this slogan is imprecise. In Variant A, SIA does *not* favor the big world ($T$); the "SIA boost" for $T$ is exactly cancelled by the low probability of being Red in $T$. SIA only favors the big world in Variant B, where the proportion of observers with your evidence is constant across hypotheses.

  Do these variants settle the PP worry? No, they relocate it. The disagreement is no longer about whether existence favors big worlds *simpliciter*, but about whether the existence of observers *different from you* (the Blue shirts) should be evidentially relevant. SSA says yes (they dilute you); SIA says no (they only boost the prior). Since both principles yield extreme confidence in one variant or the other (SSA in A, SIA in B), neither escapes the charge of presumptuousness entirely. The core dispute remains: is the "prior boost" of SIA a correction for selection effects, or an illegitimate inflation of big-world probabilities? The arithmetic shows the mechanisms trade places, but the philosophical tension persists.

  ***

  ### (3) Marking Scheme (20 Marks)

  **1. SIA Arithmetic & Cancellation Logic (5 Marks)**
  *   **5:** Correctly calculates SIA posteriors for both variants (A=50/50, B=1:100 Tails). Explicitly notes that in A, the prior boost (100x) cancels the likelihood penalty (1/100).
  *   **Error:** Calculating SIA as simply "favoring Tails" in both cases without showing the cancellation in Variant A.

  **2. SSA Arithmetic & Fractional Reasoning (5 Marks)**
  *   **5:** Correctly calculates SSA posteriors for both variants (A=100:1 Heads, B=50/50). Correctly identifies likelihoods as fractions of total observers ($n/N$).
  *   **Error:** Treating SSA likelihoods as absolute numbers (e.g., comparing 10 Red vs 10 Red in Var A without dividing by total $N$).

  **3. Reference Class Sensitivity (5 Marks)**
  *   **5:** Correctly derives that narrowing SSA to "Red Only" makes SSA match SIA's likelihood structure (A becomes 50/50, B becomes 1:100). Identifies that the initial SSA/SIA divergence is driven by the status of Blue observers.
  *   **Error:** Claiming narrowing the reference class makes no difference to SSA, or failing to recalculate the ratios based on the new class size.

  **4. Presumptuous Philosopher Diagnosis (5 Marks)**
  *   **5:** Argues that the PP worry is relocated, not solved. Notes that both principles yield extreme confidence in one variant (SSA in A, SIA in B). Identifies the core dispute as the evidential relevance of observers without your specific evidence.
  *   **Error:** Concluding that Variant A "refutes" SIA or Variant B "refutes" SSA, rather than recognizing the structural symmetry of the presumptuousness charge.
