answer: |-
  Let us rename them to strip away your initial bias. Nadia holds *The Covenant of Dwelling*: the moral unit is the shared space, and virtue lies in maintaining boundaries without unnecessary violence. Marcus holds *The Calculus of Suffering*: the moral unit is the individual organism, and virtue lies in minimising net negative experience.

  In its strongest form, Nadia's Covenant argues that pest control is a political act, not a biological one. She is not managing a population; she is negotiating a border. Her strongest objection to Marcus is that his view is solipsistic regarding the human context: by focusing entirely on the insect's interiority, he ignores the reality that the infestation is a violation of the residents' sovereignty. To her, a dead cockroach in the open is a breach of contract; it signifies a failure of exclusion. Marcus's Calculus, strengthened, argues that boundaries are moral fictions. A wall does not change the moral weight of a death. His strongest objection to Nadia is that her view is anthropocentric hygiene: she cares about *seeing* less death, not *less death happening*. She prioritises the technician's conscience over the animal's fate.

  The epistemic asymmetry you describe—the visible spray versus the hidden bait—is the hinge of the scene. Nadia treats visibility as moral data; if she does not see the corpse, she has not killed. Marcus must argue that this is a category error. The work this asymmetry should do is limited to the human psychology of the technician, not the morality of the act. However, there is a real distinction here: a spray causes panic and exposure before death; a bait causes sickness in the dark. Nadia's preference for proofing avoids both. Marcus would concede that proofing is superior only if the displaced insects find viable habitat elsewhere. If proofing simply starves them in the walls, it is a slower, more anxious death than the poison. Nadia's view risks becoming a rationalisation of cleanliness, but Marcus's view risks becoming a tyranny of abstract numbers where the method matters less than the spreadsheet. The distinction between doing and allowing is real for Nadia because she lives in the building too; for Marcus, it is irrelevant because the cockroach does not know the difference between a sealed crack and a sprayed floor.

  The ecology complication—the revolving door of the ducts—hurts Marcus more than Nadia. If the carrying capacity remains fixed, killing today invites recruits tomorrow. For Marcus, this potentially negates the welfare benefit; you have inflicted death without reducing future suffering, perhaps even increasing the total body count over time as new cohorts arrive to fill the void. For Nadia, this is irrelevant. Her Covenant is about the *current* terms of sharing. She is not responsible for the universe's carrying capacity, only for the integrity of this specific wall. The replacement rate wrecks Marcus's hope of a permanent welfare solution, reducing his intervention to a temporary palliative. Nadia's view remains untouched because her goal is not population reduction per se, but the restoration of human dominion over the immediate space.

  This leads to the growth regulators (IGRs), where the disagreement sharpens. Nadia loves them because they produce silence and thinning without carnage. Marcus must confront the non-identity problem: is a cockroach that never exists better off than one that dies? This turns entirely on whether a cockroach life in a London duct is net positive or negative. If the life is suffering-heavy (predation, starvation, poison), preventing it is a mercy. If it contains moments of successful foraging and mating, preventing it is a loss. Nadia bypasses this; preventing the life is simply preventing the conflict. Marcus cannot bypass it. He must wager on the quality of an alien consciousness. If he believes their lives are wretched, IGRs are humane. If he believes existence itself is a good, IGRs are a subtle genocide. Nadia handles this easily; Marcus stalls on the metaphysics of insect joy.

  Finally, the sentience wager. Nadia's indifference is her shield: she treats them as agents of damage, not subjects of experience. This makes her view robust but potentially barbaric. Marcus's view scales with credence; if insects are insentient automatons, his Calculus collapses into nonsense. Is this a scandal? It is certainly a vulnerability. But Nadia's indifference is also a vulnerability: if they *are* sentient, she is committing atrocities while polishing her boots. Marcus's uncertainty is a moral feature, not a bug; it forces him to acknowledge the limit of his knowledge. Nadia's certainty is a moral blindfold.

  **Verdict**

  Marcus's *Calculus of Suffering* is the stronger position, though it is the harder one to live with. Nadia's *Covenant of Dwelling* is socially functional and psychologically sustainable for a technician, but it is ultimately a defence of human comfort dressed up as ethics. It locates the moral problem in the visibility of death rather than the reality of it. Marcus is right that the wall does not matter to the roach; only the experience matters. If there is even a non-zero chance of sentience, the burden of proof lies on the killer to justify the suffering, not on the biologist to prove the pain. Nadia's view collapses if insects feel; Marcus's view merely adjusts its weightings.

  **Condition for Change**

  I would change my mind if it were proven definitively that German cockroaches possess no capacity for nociception or distress, reducing them to biological machinery; in that case, Nadia's focus on the human relationship becomes the only moral game left in town.
