      *   *Section 1: The Implicit Theory.* Name it. "Procedural Authorization Theory." It's a legalistic fiction of control. It treats agency as a function of *permission architecture* rather than *cognitive architecture*. It aligns with the "Principle of Alternatives" in moral philosophy (you are responsible if you could have done otherwise), but operationalizes "could have" as "had a UI button to stop it."
