  6.  **Refining the Philosophical Terminology:**

      *   Use terms like *locus of control*, *moral luck*, *vicarious liability*, *functionalism*.
      *   Ensure the distinction between *causal responsibility* (who caused it) and *moral responsibility* (who is to blame) is clear. The current system conflates them via the veto.
