  She will treat the origin of the moral disposition as a "thinning" factor similar to Eve's reputational concern. Priya A's enrollment was an exercise of moral agency (even if motivated partly by shame/CV), whereas Priya B's was an exercise of compliance. Since your supervisor ruled that Gita (alien imposition) has *no* worth, she treats the *source* of the motivation as relevant to worth, not just the current psychological state. However, because Priya B is now integrated (unlike Gita), she retains *some* worth, unlike Gita. Priya A ranks higher because the genealogy of her virtue is agential.

  ### 2. Candidate Rules (The Shape of the Principle)

  There are three rules that fit the seven prior verdicts but diverge on Priya.

  **Rule 1: Synchronic Guidance (The "Current State" View)**
  *   **Principle:** Worth is determined solely by what guides the agent *at the time of action*. If the agent is guided by the right-making feature and the motivation is integrated (not alien), history is irrelevant.
  *   **Prediction:** Priya A = Priya B. (Both are currently guided by need and value their disposition).
  *   **Fit:** Fits Ana, Ben, Cleo, Eve, Femi, Ismail. *Struggles with Gita:* Requires explaining Gita's "no worth" purely via current alienation. Since Priya B is *not* alienated, this rule forces A = B.

  **Rule 2: Diachronic Integrity (The "Genealogy" View)**
  *   **Principle:** Worth requires guidance by the right-making feature, *and* the disposition to be so guided must originate in the agent's own will (or at least not be imposed against it). The history of the will constrains the worth of the act.
  *   **Prediction:** Priya A > Priya B. (A's disposition was chosen; B's was imposed).
  *   **Fit:** Fits all seven. Explains Gita (imposition + alienation = 0). Explains Eve (mixed motive at time of act = thin). Explains Cleo > Ben (effortful alignment > natural alignment).

  **Rule 3: Motive Purity (The "Overdetermination" View)**
  *   **Principle:** Worth is diminished by any non-moral cause in the explanatory chain of the action, whether at the time of acting or the time of formation.
  *   **Prediction:** Priya A > Priya B, but both are very low (near Eve).
  *   **Fit:** Fits Ana and Eve well. *Struggles with Cleo:* Cleo's attention is "entirely governed by the colleague's predicament," yet she has high worth. This rule risks making Cleo's overcoming of her upbringing a "non-moral cause" interfering with purity.

  ### 3. The Most Likely Rule: Diachronic Responsiveness

  Your supervisor is almost certainly running **Rule 2 (Diachronic Integrity)**.

  **The Argument:**
  The clue is her comment that *"acting for the right reasons is doing more work than people notice."* On a Synchronic view (Rule 1), "acting for the right reason" is a snapshot: does the reason *now* match the good? That is the standard view she implies is doing *less* work than people notice. For the phrase to do *more* work, the "reason" must include the *authority* by which the agent holds it.

  In **Gita**, the reason was right (return property), but the authority was external (hypnosis). Verdict: No worth.
  In **Priya B**, the reason is right (owner's need), but the authority of the disposition is external (compulsory degree). Verdict: Diminished worth.
  In **Priya A**, the reason is right, and the authority of the disposition is internal (voluntary enrollment). Verdict: Higher worth.

  She distinguishes Priya B from Gita because Priya B is now *integrated* (she values the change), whereas Gita found the urge *foreign*. But she distinguishes Priya B from Priya A because the *formation* of the will in B was not an exercise of moral agency. Your supervisor treats moral worth as a measure of **moral agency in alignment with the good**, not just **good outcomes caused by right-seeming thoughts**.

  **Location of Worth:**
  On this rule, worth is located in **the act**, but the *magnitude* of that worth is a function of **the history of the will**. The act is the locus, but the act's moral weight is modulated by how the agent came to be the sort of person who performs it. This explains why Eve's worth is "thinner" (mixed motive at time of act) and why Priya B's is thinner than A's (mixed/coerced motive at time of formation).

  ### 4. The Adjudicating Case

  To settle this definitively in your chapter (and confirm her rule before you write), put her this case:

  **The Case of Priya C (The False Memory):**
  > Priya C is exactly like Priya B: the placement was compulsory, she thought it a waste of time, she completed it only to avoid a penalty. However, due to a quirk of memory (or perhaps she was told incorrectly by an advisor), she *believes* she chose the placement voluntarily to improve herself. She has the same durable responsiveness, the same integration, and the same current motivation as A and B.

  **The Question:**
  > Does Priya C have the worth of Priya A (High) or Priya B (Low)?

  **Why this settles it:**
  *   **If she says A (High):** She is a **Subjective Diachronic** theorist. What matters is the agent's *narrative* of their agency. (This fits the "agent's own description" caveat in your prompt, though she said guidance matters *more* than description).
  *   **If she says B (Low):** She is an **Objective Diachronic** theorist. The actual history of the will matters, regardless of the agent's belief. This is the stronger version of Rule 2 and fits the Gita verdict best (Gita's lack of worth wasn't just because she felt alienated, but because the urge *was* foreign).
  *   **If she says A = B = C:** She is a **Synchronic** theorist. History is irrelevant; only current integration matters. This would force you to rewrite the Gita interpretation in your chapter.

  **My Prediction:** She will say **Priya C has the worth of Priya B (Low).**
  This confirms that "acting for the right reasons" requires the reason to be *actually* rooted in the agent's autonomous will, not just *believed* to be. It validates the "Diachronic Integrity" rule and secures your argument that moral worth tracks the genealogy of the will, not just its current state.

  ### Summary for your Chapter
  You can write your 900 words on the basis that your supervisor's view is a **Diachronic Responsiveness Account**. Moral worth requires:
  1.  **Guidance:** The action must be explained by the right-making feature (rules out Ana, Ismail).
  2.  **Non-Deviance:** The guidance must cause the act non-accidentally (rules out Femi).
  3.  **Integration:** The motivation must be owned by the agent, not alien (rules out Gita).
  4.  **Agency in Formation:** The disposition to be so guided must originate in the agent's will, not external coercion (distinguishes Priya A from Priya B).

  This allows you to argue that worth is not a snapshot property of an action, but a historical property of an agent's relationship to the good.
