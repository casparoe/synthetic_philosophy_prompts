answer: |-
  You have stumbled into one of the most famous problems in political philosophy. You aren't lost; you've just found the "Family vs. Equality" paradox that philosophers like Harry Brighouse, Adam Swift, and Elizabeth Anderson have built careers on. (Brighouse and Swift literally wrote a book called *Family Values* arguing exactly against your step 5).

  The good news is that you do not need to burn your case. You just need to stop trying to be a **Strict Luck Egalitarian** and start being a **Democratic Egalitarian**.

  Here is the exit, which step to kill, and how to spin it in-round.

  ### 1. Which step do you kill?
  **You need to modify Premise (2) and Premise (4).**

  You want to keep (1) (Luck is morally arbitrary) and (6) (Family intimacy is sacred). The contradiction arises because (2) claims all advantages are *relevantly similar*, and (4) claims justice requires eliminating *all* of that difference.

  If you keep (2) and (4) as written, you are logically forced into Stalinism/Plato's *Republic*. If you modify them, you save the case.

  ### 2. How to fix Premise (2): Why Money *Is* Special
  You said you don't have a good answer for why money is special. Here is the answer you need. It relies on **fungibility** and **political power**, not just "luck."

  *   **The Argument:** A bedtime story is a *constitutive good* of a relationship. It creates a bond. It cannot be transferred to anyone else. A $200k wire transfer is *fungible social power*. It can be converted into political influence, exclusionary housing, superior legal counsel, and monopoly market access.
  *   **The Distinction:** Justice is concerned with the **Basic Structure of Society** (laws, economy, political rights), not the **Internal Life of the Family**.
      *   When a dad reads a story, it affects the *child*.
      *   When a dad wires $200k, it affects the *market and the polity*. It allows that child to outbid others for scarce positional goods (houses in good school districts, internships, lobbying).
  *   **The Fix:** Change (2) to: *"While many advantages are unearned, only fungible financial capital allows for the accumulation of dynastic **power** that undermines democratic equality. Love and stories do not scale into political domination; money does."*

  **Cost in Round:** You have to concede that you aren't trying to equalize *everything*, only *economic power*. This is actually a strength. It makes you look moderate and defensible rather than totalitarian.

  ### 3. How to fix Premise (4): The Swap Test is a Diagnostic, Not a Mandate
  Your "Swap Test" is brilliant, but you are using it as a **prescriptive** tool (what the state must *do*) rather than a **diagnostic** tool (where the state must *invest*).

  *   **The Argument:** The Swap Test reveals the *deficit* public policy needs to fill. It does not mandate the *ceiling* private behavior must hit.
  *   **The Fix:** Justice requires that the state ensure the kid with the bad parents lands on a **floor**, not that the kid with the good parents is chopped down to a **ceiling**.
  *   **Why this saves (6):** We don't need to ban bedtime stories to satisfy justice. We need to ensure that the kid *without* bedtime stories gets high-quality early childhood education, tutoring, and mentorship that compensates for the deficit.

  **Cost in Round:** You move from "Equality of Outcome/Advantage" to "Sufficientarianism" (everyone gets enough to compete). This is a slight weakening of your rhetoric, but it makes your solvency much higher. Judges prefer a plan that works over a principle that is pure but impossible.

  ### 4. Is your partner's "Level Up" swerve a dodge?
  It is only a dodge if you frame it as "We won't tax the rich, we'll just help the poor." That loses your revenue solvency.

  **The Real Answer:** It is a **"Level Up AND Cap the Ceiling"** strategy.
  *   **Level Up:** Use public funds to close the "Swap Gap" for the disadvantaged (public pre-K, better schools).
  *   **Cap the Ceiling:** Use inheritance tax to prevent the *conversion* of wealth into dynastic political power.

  Your partner is right that the Swap Test points toward public investment. But you are right that without the tax, the rich will always out-spend the state. You need **both**.

  **Does (4) survive?** Yes, if you rephrase it: *"The Swap Test measures the **obligation of the state** to compensate for bad luck, not the **permission of the state** to intrude on family intimacy."*

  ### 5. How to argue this in the round (The Script)
  When the opponent reads your old logic back to you (which they will, because it's a great trap), here is your response:

  > "Our opponent is arguing that unless we equalize *every* advantage, including bedtime stories and genetics, we shouldn't equalize *any* economic advantage. This is a false dilemma.
  >
  > We distinguish between **intimate goods** and **fungible capital**.
  >
  > 1.  **Intimate goods** (love, stories, values) are essential to the definition of a family. Regulating them destroys the very institution that raises citizens. We reject that.
  > 2.  **Fungible capital** (inheritance, real estate, stocks) is not essential to parenting. You can love your child deeply without leaving them a $10 million trust fund that allows them to buy political influence.
  >
  > Our 'Swap Test' isn't a mandate to ban parenting. It's a metric for **public obligation**. It tells us how much the state must invest in public education and child welfare to ensure that being born to poor parents doesn't condemn you to poverty.
  >
  > The inheritance tax funds that 'Level Up.' It prevents the wealthy from converting unearned luck into permanent dynastic power, while leaving the family bond intact. We don't need to abolish the family to tax the estate."

  ### Summary of Changes
  1.  **Keep (1):** Luck is unjust.
  2.  **Modify (2):** Money is uniquely dangerous because it converts to *power*, unlike love/stories.
  3.  **Modify (4):** The Swap Test defines the *state's duty to the poor*, not the *state's right to police the rich's parenting*.
  4.  **Keep (6):** Family integrity is a side-constraint on policy.

  **Debate Cost:** You lose the "purity" of radical luck egalitarianism. You gain "feasibility" and "liberal democratic consistency." In 95% of rounds, that is a trade-up. You stop looking like you want to abolish the family and start looking like you want to save democracy from oligarchy.

  You didn't argue yourself into a corner; you argued yourself into a PhD dissertation. Now just trim the footnotes.
