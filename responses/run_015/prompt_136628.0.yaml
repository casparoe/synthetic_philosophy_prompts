          *   *Nuance:* It conflates the "wrong kind of reasons" problem (often about fitting attitudes) with the "moral motivation" problem (Stocker/Williams). While related, they aren't identical. The prompt asks about WKR *in ethics*, and then asks about Stocker/Williams. The student treats WKR *as* the Stocker/Williams problem. This is a potential conflation.

      *   *Claim 2:* "The classic case is visiting a sick friend in hospital: if you go only because you judge it to be your duty, then something has gone wrong, since the proper motivation should be affection or concern for the friend."
          *   *Assessment:* This is Stocker's example (1976 "The Schizophrenia of Modern Ethical Theories"). It is accurately described.

      *   *Claim 3:* "This is not the same as morality being too demanding, because that objection complains about the quantity or difficulty of moral requirements, whereas here the issue is qualitative—certain motives are out of place regardless of how easy the action is."
          *   *Assessment:* This distinction is sharp and correct. Overdemandingness is about *cost* to the agent; WKR/Motivation is about the *nature* of the motive. Good distinction.

