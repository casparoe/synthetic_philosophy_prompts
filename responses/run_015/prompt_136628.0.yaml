      *   *Claim 6:* "Bernard Williams makes a related point with his example of a husband who saves his drowning wife: if he acts because it is the right thing to do rather than because she is his wife, he has one thought too many."
          *   *Assessment:* Accurate summary of Williams's "Persons, Character, and Morality" example.

