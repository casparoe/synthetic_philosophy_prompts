      *   *Section 3: The Sacrifices.* Be honest. Grace's irritation is prejudice. Dwayne's Novel is the hardest trade-off (State competence vs. Individual liberty).
      *   *Section 4: New Cases.* Apply the principle.
      *   *Section 5: Pension/Grant.* Distinguish Insurance vs. Investment.

  9.  **Refining the "Dwayne" Problem:**
      *   Why does the user think volunteering counts but a novel doesn't?
      *   Hypothesis: Volunteering is *verifiable* social contribution. A novel is *speculative*.
      *   Principle adjustment: Conditions must verify *current* social utility or *active search* for paid utility. Self-development is a luxury the insurance pool doesn't fund.
      *   *Honesty Check:* I need to tell the user that to keep the Dwayne verdict, they must accept that the state is not a patron of the arts, which might feel harsh.

  10. **Refining the "Ravi" Problem:**
