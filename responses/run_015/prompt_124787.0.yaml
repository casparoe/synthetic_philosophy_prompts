      *   *Grace (TV):* Draft Part 1 says "not judge how well you use your time." Buying a TV is use of money/time. User feels irritation but says "nobody's business." Draft supports "nobody's business." The irritation is the outlier.
      *   *Sunil (Admin Error vs. Refusal):* Draft Part 3 covers "conditions must be known/met." Missing appointment due to wrong address = couldn't meet condition. Refusing job = chose not to meet. Draft supports distinguishing these. User agrees.

  4.  **Identify the Core Tension:**
      *   The main friction is between *Liberty/Autonomy* (state shouldn't judge time use) and *Reciprocity/Contribution* (Dwayne should work, volunteering counts but novel doesn't).
      *   The user's intuition on Dwayne suggests a "Social Contribution" or "Reciprocity" principle, whereas the Draft Principle is largely "Insurance/Entitlement."
      *   The user's intuition on Marta suggests "Care Work counts as Contribution."
      *   The user's intuition on Ravi suggests "Procedural Justice/Epistemic Humility" (State shouldn't punish when it lacks knowledge).

  5.  **Develop the Repaired Principle:**
      *   Need to bridge the gap between "Insurance" and "Civic Obligation."
      *   *Clause 1 (The Basis):* It's not just insurance; it's a *Social Contract*. You get support if you are *unable* to contribute via paid work OR if you are contributing via recognized social value (care, volunteering).
      *   *Clause 2 (The Condition):* Conditions must be *reasonable* and *within control*. (Covers Sunil/Marta/Ravi).
