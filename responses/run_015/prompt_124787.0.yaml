      *Final review of Ravi:* Ravi is worse because the State is *wrong* about the facts. Marta the State is *right* about the facts (she can physically work) but *wrong* about the morality (she cares for mother). Ravi is a failure of *knowledge*. Marta is a failure of *values*. The principle should prioritize Knowledge failures as more egregious.

