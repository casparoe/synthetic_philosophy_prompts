      *   Marta: State demands something incompatible with care.
      *   Ravi: State *thinks* it's demanding something possible, but it isn't (due to medical lag).
      *   Principle: State culpability is higher when it ignores its own epistemic limits (Ravi) than when it applies a rigid rule (Marta). Or, simply, Ravi is *unable*, Marta is *unwilling* (but for good reason). The principle should prioritize *Capacity* over *Willingness*.

  11. **Final Polish:** Ensure the tone is appropriate for a bright 17-year-old. Not too academic, but not dumbed down. Use the structure requested.

      *(Self-Correction during drafting)*: I need to make sure I don't just agree with the user. The prompt asks me to tell them which verdicts they might have to abandon. I need to be critical. The Grace irritation is the obvious one. The Dwayne distinction is the substantive one.

      *(Check on Pension/Grant)*: Pension is usually contributory (National Insurance). Student grant is often means-tested or tuition based. The "Insurance" model fits Pension well. It fits Student Grant less well (it's an investment in future productivity). I should highlight this distinction.

