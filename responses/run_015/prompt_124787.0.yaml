      *   *Dwayne (Quit to write novel):* Draft Part 1 says state can't judge "how well you use your time." Writing a novel is time use. So state shouldn't sanction? But user says sanction is *fine*. **Conflict.** The draft principle protects Dwayne; the user wants to sanction him.
      *   *Dwayne (Volunteering):* User says volunteering should count, novel shouldn't. Draft Part 1 doesn't distinguish these (both are "time use"). **Conflict.**
      *   *Aisha (Fraud):* Draft Part 2 handles this well. Fraud is distinct. User agrees.
