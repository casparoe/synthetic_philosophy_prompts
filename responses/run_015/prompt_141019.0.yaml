answer: |-
  The server room hummed with the specific, low-frequency anxiety of a Derby industrial park at 3:45 AM. Outside, the M1 was a dark river of haulage trucks; inside, the air conditioning kept the racks at a constant, dry chill. Iman sat at her console, watching the telemetry for Client 44-B, a die-casting plant in Sheffield.

  Priya slid her chair over, the wheels squeaking on the linoleum. She held a tablet like a warrant.

  "Look at the residual plot," Priya said.

  Iman looked. It was a straight line. In their line of work, a straight line was more suspicious than a jagged mess. They sold 'causal twins'—digital shadows that ingested vibration, heat, and acoustic data to predict bearing failures before they happened. A perfect prediction rate was statistically impossible.

  "Eleven months," Priya said. "Zero false positives. Zero false negatives."

  "Which model?"

  "Gamma-7. But look at the input stream." Priya tapped the screen, bringing up the metadata logs. "The UUIDs are scrambled. Since the update last August, Gamma-7 has been ingesting data from the cooling pumps, the packaging arms, and the conveyor belts interchangeably. It's been reading the temperature of a motor and predicting the failure of a hydraulic press. It's been tracking nothing anyone can name."

  Iman took a sip of tea. It had gone cold twenty minutes ago. "And it hasn't put a foot wrong."

  "It's impossible," Priya said. She was vibrating with the energy of someone who has found a loose thread in a sweater and intends to pull it until the whole thing unravels. "There has to be a latent variable. Some ambient frequency in the building structure that affects all the machines. Or maybe the data isn't actually scrambled, maybe the hash function is colliding in a way that preserves the signal."

  "Or maybe the habit holds," Iman said.

  Priya sighed, rubbing her temples. "Iman, don't start."

  "I'm just saying. The cotton burns when it touches the fire. Usually. Sometimes the model works even when the inputs are wrong. The sequence repeats."

  "This isn't theology, it's engineering," Priya said, sharp but not unkind. "If we tell the client their safety net is running on garbage data, they panic. If we don't, and it stops working tomorrow, they sue. We need to know *why* it works. 'God's habit' isn't a root cause analysis. It's a re-description of the problem that charges you nothing and solves nothing. It stops the inquiry."

  Iman leaned back. She hadn't prayed in fifteen years. She didn't go to the mosque, she didn't fast, she didn't ask for intercession. But she was an occasionalist. It was a structural thing for her. Fire didn't burn cotton; God burned the cotton at the occasion of the fire touching it. Cause and effect were just the rhythm of a will that didn't need to consult itself. To Priya, the world was a clockwork mechanism waiting to be mapped. To Iman, it was a series of discrete moments stitched together by expectation.

  "It's not that I don't want to know," Iman said. "It's that looking for a mechanism where there isn't one is just another kind of habit."

  "There is a mechanism," Priya insisted. "There's always a mechanism. If Gamma-7 is predicting failures based on scrambled IDs, there is a physical correlation in the real world we haven't measured yet. Maybe it's the voltage fluctuation in the grid. Maybe it's the shift patterns of the operators. If we find it, we can replicate it. We can sell it to everyone."

  "And if you don't find it?"

  "Then we're selling magic. And I don't sell magic. I sell reliability." Priya stood up and paced the small length of the office. "You check the pressure gauges, don't you? You verify the alerts. You act as if the code causes the prediction."

  "I do," Iman said. "Because that is the habit. When the gauge reads high, the pipe bursts. When the code flags red, the bearing seizes. I check them because that is what happens next."

  "But you don't think the gauge *makes* the pipe burst."

  "No."

  Priya stopped pacing. She looked at Iman, really looked at her, in the way people do at 4 AM when the fatigue strips away the professional veneer. "That's terrifying, Iman. It means nothing is connected. It means we're just waiting for the next thing to happen."

  "It means we aren't responsible for the connection," Iman said. "Just the observation."

  Priya laughed, a short, dry sound. "Tell that to the liability insurance. If the twin misses a failure because the input is scrambled, the firm is liable. Causality is the only thing that keeps us out of court. We need to prove that A leads to B so we know when it won't."

  "Ticket 8940," Iman said, turning back to her screen. "That's the one for the data mismatch."

  Priya frowned. "You're filing it?"

  "It's the habit of the firm," Iman said. "When a bug is found, a ticket is filed. Then the developers look at it. Then they fix it, or they don't. Then the model works, or it doesn't."

  "If you file that, they'll patch the ID shuffle. They'll force Gamma-7 to read the correct sensors." Priya's voice dropped. "And if the hidden variable isn't in those sensors, the model breaks. The perfect run ends."

  "Then it ends," Iman said. Her hand hovered over the enter key.

  This was the moment, presumably. The point where metaphysics dictated action. If Iman truly believed that causes were illusions, did she have an obligation to preserve the miracle? If the model worked by accident, was that accident a gift to be protected, or an error to be corrected?

  Priya watched her hand. "If you file that, you're killing the golden goose because you don't care how it lays the egg."

  "I care that it's an egg," Iman said. "Not how it got there."

  "That's lazy."

  "It's honest."

  Iman pressed enter. The ticket number generated. *Ticket 8940: Critical Data Integrity Mismatch - Gamma-7.* Status: *Open.*

  Priya exhaled, a long hiss of air. She looked disappointed, but also relieved. The mystery was now a task. The unknowable was now a JIRA ticket. "You know," Priya said, sitting back down, "the devs are going to hate this. They'll have to roll back the update."

  "They will do what they do," Iman said.

  "And you? What will you do?"

  "Check the pressure gauges," Iman said. "Drink tea. Wait for the sun."

  Priya shook her head, a small smile finally breaking through her frustration. "You're impossible. You know that? You believe in a God who micromanages every electron, but you won't even bet on the model staying accurate for one more week."

  "I don't bet," Iman said. "I observe."

  The server hum seemed to deepen as the cooling fans kicked up. On the screen, the status of Ticket 8940 changed to *Assigned*. Somewhere in a different time zone, a developer would wake up and see that their code was lying. They would fix the connection. They would align the cause with the effect. Gamma-7 would start reading the correct sensors. And then, perhaps, it would stop predicting the failures perfectly. The magic would vanish, replaced by a sturdy, explainable, 85% accuracy rate.

  Priya pulled up a new dashboard. "Alright. Let's look at Client 12. They're showing vibration spikes in the turbine."

  "Show me," Iman said.

  They worked for another hour. They traced the vibration to a misaligned coupling. They drafted an alert. They drank fresh tea. At 5:30 AM, the sky outside the window began to turn the colour of bruised steel. The night shift was ending.

  Priya packed her bag. "You coming to breakfast? There's a new place on the A52. Full English."

  "In a bit," Iman said. "I want to watch the handover."

  "Suit yourself." Priya paused at the door. "For the record. If I find the hidden variable... if I prove there's a physical reason Gamma-7 worked..."

  "I'll be happy for you," Iman said.

  "You won't change your mind."

  "No."

  Priya nodded. "See you tomorrow, Iman."

  "See you tomorrow."

  The door clicked shut. Iman was alone with the servers. She looked at the graph for Gamma-7. The line was still straight. It would be straight until the patch was deployed. Then it would likely jag. The habit would shift.

  She didn't pray. She didn't thank anyone. She simply checked the pressure gauge on her monitor. It held steady. She took it as it was, one moment following another, without promise, without mechanism, just the dry, reliable rhythm of things happening because they happened. She finished her tea, stood up, and turned off the monitor.
