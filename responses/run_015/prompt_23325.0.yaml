prompt: |-
  I'm taking a decision theory course this semester and I keep goin in circles on the Kelly criterion, so I'd like you to write an essay that actually settles a specific question for me instead of just re-explaining what Kelly betting is (I alreayd get the basic formula, I promise). The question I want addressed: should the Kelly criterion be understood as a genuine norm of rationality for someone making repeated bets with a known edge, or is it just the strategy that happens to be optimal for a particular (logarithmic) utility function, with no special normative status of its own?

  Please weigh the main arguments on both sides and actually argue, not just list them. On the "it's a norm of rationality" side, I'm thinking of the asymptotic-growth-rate result (that Kelly maximizes the long-run growth rate of wealth, and that systematically deviating from it is, in some sense, dominated in the long run) and the point that, because you always bet a fraction of your current bankroll, Kelly betting never literally goes to zero. On the other side, I'm thinking of the "it just assumes log utility" objection, the worry that the growth-rate result only really makes sense in the limit of infinitely many bets, and the fact that Kelly betting is still volatile enough to carry a real probability of large drawdowns.

  One more thing I'm confused about that I'd really like the essay to address: I keep hearing that you should bet some fraction of Kelly rather than full Kelly, and I never quite know whether that's supposed to be about risk aversion (I just don't like the variance) or about the fact that my estimate of the edge is uncertain (so that betting full Kelly when I overestimate the edge can be worse than betting less). I think those are different justifications and I'd like the essay to sort them out. And please don't end on a non-committal note -- I want you to defend a verdict, and a qualified one like "Kelly is a norm of rationality only for agents who care about long-run growth and can make many bets" is fine, as long as you actually commit.
