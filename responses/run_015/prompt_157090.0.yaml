answer: |-
  hey — great idea for a workshop. moving past the care/justice binary is exactly where the field needs to go, especially when we're talking about policy and strangers. below is a quick brainstorm on the conceptual tensions, followed by the decision tree instrument you asked for. i've kept the branch labels descriptive (no author names until the leaves) and embedded the diagnostic cases so participants answer based on intuition rather than theory recall.

  ### quick brainstorm: the conceptual splits

  before handing out the sheet, here's the logic behind the cuts. we're trying to isolate where people think the "moral magic" of care happens.

  *   **particularity vs. portability:** is care a thing that dies when the people aren't in the same room, or can it survive translation into rules/roles?
  *   **affect vs. action:** is care defined by how i feel (emotional labor) or what i do (structural provision)?
  *   **scalability:** if feelings are required, can human attention stretch infinitely, or is there a hard cap?

  ***

  ### the sorting instrument: care extension decision tree

  **instructions:** read the scenario, pick the answer that matches your gut, and follow the arrow.

  **START HERE**
  **case 1:** a nurse rotates every 4 hours. patient safety is maintained, charts are perfect, but no single nurse knows the patient's life story.
  **q1:** is care essentially indexed to particular face-to-face relationships, or can it be 'ported' through social roles and institutions?
  *   **(a)** it's indexed to face-to-face. without the specific relationship, the "care" is just technical maintenance. → **go to leaf 1**
  *   **(b)** it can be ported. the role of "nurse" carries the obligation regardless of who fills it. → **go to q2**

  **q2:** (for those who said "portable")
  **case 2:** a state agency distributes aid via an algorithm. recipients get what they need to survive, but no human ever reviews their file.
  **does fulfilling care require emotional labor (worry, empathy, attentiveness), or can structural provisions alone satisfy it?**
  *   **(a)** structural provisions alone are enough. if the need is met reliably, care has happened. → **go to leaf 2**
  *   **(b)** emotional labor is required. someone, somewhere, has to be attentive to the need for it to count as care. → **go to q3**

  **q3:** (for those who said "emotional labor required")
  **case 3:** a welfare bureaucrat manages 5,000 cases. she wants to be attentive to all of them.
  **if emotional labor is required, does it hit an 'attention ceiling' that makes care non-scalable?**
  *   **(a)** no ceiling. we can cultivate generalized attentiveness that scales to institutions. → **go to leaf 3**
  *   **(b)** yes ceiling. human attention is finite; you can't genuinely care for 5,000 strangers. → **go to leaf 4**

  ***

  ### the leaves: positions & awkward commitments

  here's where everyone lands. i've included the standard label you'd recognize, plus the "awkward commitment" — the thing they have to defend when pushed.

  **leaf 1: particularist relational care (noddings-style)**
  *   **path:** care is face-to-face only.
  *   **awkward commitment:** you have to tell the donor sending money overseas that they aren't actually caring, just sending checks, because they'll never meet the recipient.

  **leaf 2: political structural care (tronto-style)**
  *   **path:** care is portable + structure alone is enough.
  *   **awkward commitment:** you have to say a冷漠 (cold) algorithm distributing food stamps is an act of care, even if nobody involved feels anything.

  **leaf 3: integrated scalable care (held-style)**
  *   **path:** care is portable + emotion required + emotion is scalable.
  *   **awkward commitment:** you have to claim a nurse *does* emotionally connect with every patient even on a 10-minute shift, or that "institutional attentiveness" is a feeling state comparable to personal love.

  **leaf 4: [empty branch] the impossible bureaucrat**
  *   **path:** care is portable + emotion required + emotion is NOT scalable.
  *   **status:** **FLAGGED AS EMPTY.** logically possible, but nobody defends it.
  *   **awkward commitment:** you believe institutions can care, but only if the bureaucrat cries about each client, which means the institution must fail at scale to be moral. (usually, people who land here realize their contradiction and move to leaf 1).

  ***

  ### facilitator notes & flags

  **1. the empty branch (leaf 4)**
  make sure to point out leaf 4 during the debrief. it's the "trap" door. if someone lands here, they're arguing that care *can* be institutionalized but *cannot* be scaled. since institutions exist to scale, this view collapses. it's a useful spot for people to realize they actually hold a particularist view (leaf 1) but want to sound policy-relevant.

  **2. indistinguishable pairs**
  **flag:** leaf 1 (particularist) and leaf 4 (empty branch) are practically indistinguishable in outcome.
  both end up skeptical that distant strangers receive "care" from institutions. the only difference is metaphysical: leaf 1 says institutions *can't* carry care; leaf 4 says they *could* but humans are too limited to do it. in a policy workshop, these two will vote the same way (usually toward localism), so don't waste too much time splitting them unless you're doing metaphysics.

  **3. tone check**
  keep the discussion on the "awkward commitments." that's where the friction is. if someone lands on leaf 2 (tronto), ask them if they'd call a well-functioning prison "careful" if it fed inmates reliably. that usually tests the limits of the "structure alone" claim.

  hope this works for the seminar. let me know if you need a handout version formatted differently.
