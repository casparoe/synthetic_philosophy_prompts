      *   *Conclusion:* Summarize.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, on Case 1:* If the hemispheres act independently, Descartes is in trouble. He claims the mind is *whole* in the whole body and *whole* in any part. But he also says it functions *primarily* through the pineal. If the pineal is midline and intact, he'd say the mind is one. The "alien hand" is just mechanical. This fits his Beast-Machine doctrine applied to the non-dominant hemisphere.
      *   *Wait, on Case 3:* Descartes distinguishes living bodies from dead ones by heat and motion (animal spirits). If synthetic neurons maintain this, it's a living body. If the soul is infused by God at conception, does it stay during replacement? Descartes doesn't have a theory of soul *transfer*. He assumes union. If the union is maintained functionally, the soul remains. But if the user implies the end state is *purely* mechanical (no soul), Descartes would say "If it thinks, it has a soul." He wouldn't accept a thinking thing without a soul.
