      *   *Case 2 (Distributed AI):* Focus on the Pineal/Unity requirement. Language is a sign, but unity of consciousness is the metaphysical requirement. No "here" = no mind. It's a beast-machine.
      *   *Case 3 (Gradual Replacement):* Focus on the Real Distinction. Mind isn't tissue. Body is a machine. As long as the machine functions to support the union, the mind stays. The danger is the "thinking machine" label. Descartes would insist a soul *must* be there if thinking occurs, regardless of substrate.
