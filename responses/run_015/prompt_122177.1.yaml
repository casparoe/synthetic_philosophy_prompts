  The Osaka Swarm's "rewriting subroutines" feature is sophisticated, but to her, it likely looks like **very fast pheromones**. If the information has to leave Unit A to get to Unit B, they are separate. If the information flows *within* the system without crossing a "self" boundary, it is a mind.

  ### 3. The Crucial Test Case

  To split **Principle B (Plasticity)** from **Principle C (Unitary Ontology)**, you need a case that has real-time rewiring but is clearly a collection of distinct organisms.

  **The Case:** **A "Fused" Ant Colony.**
  Imagine a genetically engineered ant colony where the ants' nervous systems can physically dock and merge synapses when they touch, creating a temporary, continuous neural web across the colony that allows for real-time plasticity and global error correction, but the ants remain distinct bodies with separate digestive/reproductive systems.

