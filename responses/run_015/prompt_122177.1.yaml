  To stay consistent with her **Slime Mold (Yes)** vs. **Ant Colony (No)** distinction, she must treat the Osaka Swarm as a **No**. The Slime Mold is a mind because it is *one cell*. The Ant Colony is not because it is *many animals*. The Osaka Swarm is *many machines*. The sophistication of the software does not bridge the ontological gap between "One Thing" and "Many Things."

  **Advice for the debate:** Don't argue about the *complexity* of the swarm (she'll dismiss it as complex reflexes). Argue about the *boundary*. Ask her: "If we glued the robots together so they shared power and data cables, removing the wireless gap, does it become a mind?" If she says yes, she's a Continuity theorist. If she says no, she's an Ontology theorist. Either way, the wireless swarm loses.
