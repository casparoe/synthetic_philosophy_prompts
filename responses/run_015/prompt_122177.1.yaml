  ### 2. The Rule She Is Actually Using

  **She is running Principle C (Unitary Ontology), enforced by Principle A (Substrate Continuity).**

  **Why?**
  The Slime Mold is the "smoking gun." If she were a functionalist (caring only about problem-solving), Ants and Slime Molds would be equal. If she cared only about plasticity (Principle B), she might be swayed by the Osaka Swarm.

