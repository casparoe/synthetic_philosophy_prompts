answer: |-
  ### Case A

  In the winter of 1795, Sir Arthur Pendennis, a Yorkshire squire of unblemished local reputation, terminated the tenancy of the Hodge family to consolidate their scattered strips into a single enclosed pasture for sheep. Sir Arthur knew the Hodges would lose their livelihood and likely fall into destitution, as there was no other work in the valley; he had heard the local agrarian radicals denounce enclosure as theft, but he dismissed them as dangerous fanatics who did not understand economic necessity. His motive was not personal gain but the long-term security of the estate, which he believed would ultimately support more labourers through increased efficiency. He acted in accordance with the advice of his stewards and the practice of every neighbouring landowner, viewing the action as a painful but neutral administrative duty. In the moral vocabulary available to him, the action fell under the description of 'improvement' and 'prudent management'; while he possessed concepts for 'cruelty' and 'injustice', these were understood to apply only to actions motivated by malice or violations of explicit law, neither of which were present here.

  ### Case B

  In the winter of 1795, Sir Arthur Pendennis, a Yorkshire squire of unblemished local reputation, terminated the tenancy of the Hodge family to consolidate their scattered strips into a single enclosed pasture for sheep. Sir Arthur knew the Hodges would lose their livelihood and likely fall into destitution, as there was no other work in the valley; he had heard the local agrarian radicals denounce enclosure as theft, but he dismissed them as dangerous fanatics who did not understand economic necessity. His motive was not personal gain but the long-term security of the estate, which he believed would ultimately support more labourers through increased efficiency. He acted in accordance with the advice of his stewards and the practice of every neighbouring landowner, viewing the action as a painful but neutral administrative duty. In the moral vocabulary available to him, the action fell under the description of 'improvement' and 'prudent management'; however, the Hodge father had saved Sir Arthur's life during the American war, a fact widely known in the county, and Sir Arthur possessed a robust local concept of 'ingratitude' which denoted the betrayal of a specific debt of honour, yet he chose to prioritise the lease terms over this obligation.

  ***

  ### Analysis of the Defence

  **Case A: The Defence Succeeds (Agent is Blameless)**
  *   **CU (Conceptual Unavailability):** Holds. The agent lacks the concept of "structural exploitation" or "housing rights." The harm is not formulable as a *wrong* in his conceptual scheme, only as a misfortune.
  *   **EU (Evidential Unavailability):** Holds. There is no evidence accessible to him that the enclosure will cause net harm (he believes it will help the valley long-term), and no inquiry available would reveal modern economic data on displacement.
  *   **PS (Peer-Saturation):** Holds. Every neighbouring landowner is doing this; his conduct is at the median.
  *   **BD (Bridging-Description):** **Fails to obtain.** There is no local thick term that picks out this action as wrong. 'Cruelty' requires malice; 'Injustice' requires law-breaking. The action is described as 'Improvement'.
  *   **Verdict:** The "Man of his Time" defence succeeds. We cannot blame Sir Arthur for failing to access concepts or evidence he did not have, nor for conforming to peer norms where no local moral vocabulary condemned the act. He is historically situated and blameless.

  **Case B: The Defence Fails (Agent is Blameworthy)**
  *   **CU:** Holds. Same as A. He lacks modern concepts of rights.
  *   **EU:** Holds. Same as A. He believes the economic necessity is real.
  *   **PS:** Holds. Same as A. Everyone else is enclosing land and enforcing leases.
  *   **BD:** **Obtains.** The agent possesses the thick concept 'Ingratitude' (betrayal of a debt of honour). This concept is available in his vocabulary, applies to the facts (the life-saving service), and applying it with ordinary care would have led him to refrain (or make an exception). He avoided applying it for self-serving reasons (prioritising the lease over the debt).
  *   **Verdict:** The "Man of his Time" defence fails. Although he is situated in 1795, he failed by the lights of 1795. He had the moral resources to see the wrong ('Ingratitude') but chose not to use them. We are licensed to blame him not for being a bad 21st-century person, but for being a bad 18th-century person.

  **The Single Feature Doing the Work**
  The contrast turns entirely on **BD (Bridging-Description Availability)**.
  *   **If BD is removed from B:** If we stipulate Sir Arthur had no concept of 'Ingratitude' or 'Debt of Honour' (perhaps the culture was purely contractual), Case B collapses into Case A. The defence would succeed, and the blame would vanish.
  *   **If BD is added to A:** If we stipulate that 'Improvement' was locally understood as a thick term for 'Theft' (conceptually available), Case A collapses into Case B. The defence would fail.
  *   **Survival of Contrast:** The contrast survives only so long as the local moral vocabulary distinguishes between "standard economic action" (A) and "betrayal of specific personal debt" (B).

  ***

  ### The Anachronism Objection

  **The Objection**
  "The strongest students will argue that BD smuggles anachronism in through the back door. In Case B, you are blaming the agent for failing to prioritise a local thick concept ('Ingratitude') over a competing local norm ('Prudent Management' or 'Property Rights'). However, the mere *availability* of the concept 'Ingratitude' does not prove it was *authoritative*. If the agent's society generally accepted that Property Rights trump Debts of Honour in economic contexts (as suggested by PS), then blaming him for choosing Property is imposing *our* hierarchy of values, not his. We are effectively saying, 'You should have cared more about Honour than your peers did.' This replicates the error of CU: we are judging him by a moral framework (where Honour > Property) that he had no reason to occupy, even if the word 'Honour' existed in his dictionary."

  **Does it sink Case B?**
  It threatens to sink the *moral force* of the blame, reducing it to a trivial aesthetic critique ("He was tacky") rather than a moral one ("He was wrong"). If 'Ingratitude' was a concept everyone acknowledged but nobody acted upon in economic disputes, then PS (Peer-Saturation) actually undermines BD. If the median agent acknowledges the term but ignores it, then applying it with "ordinary care" would *not* have led them to refrain. The definition of BD requires that applying the concept *would* lead to refraining. If the social reality is that the concept is rhetorically available but practically inert, BD does not actually obtain.

  **Rebuilding the Case**
  To survive this, Case B must be rebuilt to show that the hierarchy of values was not merely theoretical but socially enforced. We need to show that agents who *did* prioritise Honour over Property in similar contexts were praised, not mocked.
  *   **Revision:** Add a detail to Case B that a neighbouring squire, faced with the same choice, *did* waive the lease due to the war service, and was publicly commended for it by the community.
  *   **Effect:** This secures BD. It proves that applying the concept *would* have led to refraining (because it did for the neighbour) and that doing so was consistent with being a "man of his time." It isolates Sir Arthur's failure as a personal moral failure within his own framework, rather than a demand that he adopt a framework his peers rejected. This removes the anachronistic charge: we are not asking him to be modern; we are asking him to be as good as his best contemporary peer.
