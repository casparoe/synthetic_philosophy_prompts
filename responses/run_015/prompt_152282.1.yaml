prompt: |-
  hey so ive been trying to wrap my head around this low-impact ai thing. people say you can avoid side effects without fully specifying human values—just compare the world-state with the ai to the world-state without it using some trajectory-divergence metric, and penalize big differences. but i keep thinking: doesnt picking which variables go into that divergence measure already smuggle in value judgments? and isnt the counterfactual baseline itself a hidden normative claim about what counts as "unchanged"?

  can you write me an exam essay prompt for like an advanced seminar that asks whether "avoid side effects" can be defined without a full value specification, using this specific trajectory-divergence framing? make it so students cant just summarize the low-impact literature—they have to deal with the formal problem that any metric needs both a feature-space and a baseline, and both are value-laden.

  then give me a model answer of about 600 words, and a marking scheme. the scheme should seperate A answers from B answers: A's must hit that (1) feature selection is normative, (2) the counterfactual baseline assumes a privileged "normal" world, and (3) formalizing impact just relocates the value problem rather than solving it. also list the common mistakes that should lose marks, like treating divergence as purely objective or confusing side-effect avoidance with utility maximization.

  im not an academic, just someone who read a couple papers and got stuck. keep the tone casual and dont ask for citations or anything—i want this for a study group, not a real university.
