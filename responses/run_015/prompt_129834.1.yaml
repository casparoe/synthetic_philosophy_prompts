answer: |-
  This is a classic philosophical stalemate. Your friend is using a single sentence to do three different jobs: describing the world, defining truth, and prescribing behavior. When you push back on one, she retreats to another.

  Here is the menu of five distinct readings of "morality is relative." I have evaluated each on defensibility, whether it blocks cross-cultural judgment, whether it's what regular people mean, and how it handles moral progress.

  ### 1. Descriptive Relativism (The Empirical Claim)
  **The Claim:** Different cultures have different moral codes. There is no empirical consensus on what is right.
  *   **Defensible?** Yes. This is an observable fact. Some cultures value individual autonomy; others value communal harmony.
  *   **Does it block judgment?** No. This is the "Is-Ought" gap. Just because people *disagree* about the shape of the earth doesn't mean there isn't a fact of the matter. Disagreement doesn't prove there is no truth.
  *   **Do regular people mean this?** Often, yes, but they treat it as a premise for a conclusion it cannot support.
  *   **Moral Progress?** Yes. Progress is simply a change in consensus.
  *   **What would strengthen this reading?** If anthropological data showed *zero* overlap in moral intuitions across any human groups (which is false; all cultures prohibit unprovoked murder of in-group members, for example).
  *   **Where this reasoning might fail:** It assumes that deep disagreement implies incompatible truth-conditions. It might be that cultures share universal values (e.g., "promote well-being") but disagree on the *facts* of how to achieve them (e.g., "caste promotes order" vs. "equality promotes order").

  ### 2. Metaethical Truth Relativism (The Truth Claim)
  **The Claim:** Moral propositions do not have absolute truth values. "Slavery is wrong" is neither true nor false simpliciter; it is only "true-for-Culture-A" or "false-for-Culture-B."
  *   **Defensible?** Highly controversial. It makes moral disagreement impossible. If I say "Slavery is wrong" and you say "Slavery is right," we aren't contradicting each other; we are both speaking truth relative to our own frameworks.
  *   **Does it block judgment?** Yes. If truth is framework-bound, an outsider's judgment is literally category error, like criticizing a chess piece for not moving like a checkers piece.
  *   **Do regular people mean this?** Rarely. It requires a sophisticated (and often counter-intuitive) view of truth.
  *   **Moral Progress?** No. You can only have "framework drift." You cannot say the new framework is *better*, only that it is *different*. Claiming it is better smuggles in a trans-framework standard.
  *   **What would strengthen this reading?** If we could formalize a logic where contradictory statements are simultaneously valid without collapsing into nonsense.
  *   **Where this reasoning might fail:** It risks self-refutation. Is the claim "All truth is relative" itself relatively true? If yes, it doesn't apply to cultures that believe in universal truth. If no, then there is at least one universal truth.

  ### 3. Indexical Relativism (The Semantic Claim)
  **The Claim:** Moral terms are context-dependent, like "tall," "left," or "I." "Stealing is wrong" really means "Stealing is wrong relative to the moral standards of the speaker's community."
  *   **Defensible?** Plausible. It explains why we feel our morals are binding on us but not necessarily on others.
  *   **Does it block judgment?** Weakly. I can still judge you. I am saying, "Relative to my framework, your actions are wrong." It doesn't stop me from acting on that judgment or trying to convert you.
  *   **Do regular people mean this?** No. When people say "It's wrong," they usually mean it's wrong *full stop*, not "wrong-for-me."
  *   **Moral Progress?** Yes, but locally. A culture can progress relative to its own prior goals (e.g., "We value health; this new norm improves health").
  *   **What would strengthen this reading?** If moral language consistently behaved like indexicals in syntax (e.g., if we naturally said "It is wrong *here*" the way we say "It is raining *here*").
  *   **Where this reasoning might fail:** It dissolves the force of moral argument. If I'm just reporting my framework's settings, why argue? Yet we *do* argue, suggesting we think we are accessing something shared.

  ### 4. Non-Cognitivism / Expressivism (The Linguistic Claim)
  **The Claim:** Moral statements aren't descriptions of reality at all. "Slavery is wrong" is not a fact-claim; it is an emotional expression, like "Boo slavery!" or a command, "Don't enslave!"
  *   **Defensible?** Defensible. It avoids the problem of finding "moral facts" in the universe.
  *   **Does it block judgment?** No. I can still say "Boo!" at your culture. In fact, it encourages judgment, as morality becomes purely about projecting attitudes.
  *   **Do regular people mean this?** No. Regular people think they are describing reality, not just venting emotions.
  *   **Moral Progress?** Yes, as persuasion. Progress is getting more people to say "Boo!" to the same things. It doesn't require universal truth, just shared sentiment.
  *   **What would strengthen this reading?** If moral statements failed logical tests (e.g., if you couldn't use them in conditionals like "If stealing is wrong, then teaching stealing is wrong").
  *   **Where this reasoning might fail:** The "Frege-Geach" problem. Moral language functions logically like factual language. If "wrong" just means "boo," complex moral reasoning breaks down.

  ### 5. Normative Relativism (The Tolerance Principle)
  **The Claim:** We *ought* not to judge or interfere with other cultures. (This is a moral rule itself).
  *   **Defensible?** Only if you accept a universal value of tolerance or autonomy.
  *   **Does it block judgment?** Yes, by fiat. It forbids the act of judging.
  *   **Do regular people mean this?** **Yes.** This is almost always the punchline. They use metaphysical claims (1-4) to support this normative conclusion.
  *   **Moral Progress?** Only if progress is defined as increasing tolerance.
  *   **What would strengthen this reading?** If it could be shown that cross-cultural judgment consistently leads to worse outcomes than non-interference.
  *   **Where this reasoning might fail:** **Self-Contradiction.** This is the big one. To say "No one should judge other cultures" is itself a universal moral judgment. It violates its own rule. It smuggles in a universal standard (tolerance) to argue against universal standards.

  ---

  ### The "Moral Progress" Problem
  You asked if any version allows for real moral progress without smuggling.

  **The Verdict:** No.
  If you are a strict relativist (Reading 2), "progress" is incoherent. You can have *change*, but not *improvement*. To say a culture improved (e.g., abolished slavery) is to say it moved closer to a standard. If that standard is internal to the culture, what if the culture valued power over well-being? Then slavery might be "progress."
  If you say "But well-being is the metric," you have just smuggled in a universal standard (Reading 1 or 5).
  Most people who claim relativism actually hold a **Hybrid View**: They believe moral *foundations* are relative, but *human flourishing* provides a universal metric for judgment. They just don't admit it.

  ### Where My Reasoning Might Fail (And Yours)
  1.  **The Framing of "Outsider":** I have assumed "outsider" means "someone from a different culture." But if there are universal human needs (biology, psychology), we are all "insiders" to the human condition. If caste systems cause psychological harm universally, an outsider isn't judging a culture; they are judging a health hazard. My analysis might fail if I treat cultures as hermetically sealed boxes rather than overlapping human groups.
  2.  **The Self-Refutation Trap:** I flagged Normative Relativism as self-refuting. However, a sophisticated relativist might argue, "I am not saying judging is *universally* wrong, only that *my* framework values tolerance, and I invite you to adopt it." This avoids contradiction but loses its force as a command to you. My reasoning fails if I assume your friend is making a universal claim when she might be making a persuasive one.
  3.  **The "Smuggling" Accusation:** I claim progress requires smuggling universals. But a relativist could argue progress is purely pragmatic: "This norm works better for *our* specific goals." My reasoning fails if "better for specific goals" counts as legitimate progress without needing universal validity.

  ### How to Use This With Your Friend
  She is likely using **Descriptive Relativism** (we differ) to prove **Normative Relativism** (therefore don't judge).
  *   **The Counter:** "You are moving from 'people disagree' to 'no one is right.' That doesn't follow. People disagreed on medicine, but germ theory was still true."
  *   **The Trap:** If she says "You can't impose your values," ask: "Is 'not imposing values' a value you are imposing on me?"
  *   **The Progress Check:** Ask: "Did your culture make progress by allowing women to vote? If yes, what standard did you use to measure that improvement? If it was just 'change,' why was it good?"

  This separates the menu for her. She has to pick which dish she's eating, and most of them don't serve the conclusion she wants.
