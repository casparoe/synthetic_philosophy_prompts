          *   Progress? Persuasion, not truth-discovery.
          *   Mind changer: If moral arguments behave like scientific facts.
          *   Failure point: Frege-Geach problem (embedding in conditionals).

      *   *Reading 5: Normative Relativism (The Tolerance Principle).*
