      *   *Nuance:* Grice might reply that $meaning_{nn}$ is a general capacity, while CP is specific to conversation. I need to counter that in conversation, $meaning_{nn}$ *cannot* be fixed without CP-like assumptions. (e.g., Reference assignment often requires assuming relevance).
      *   *Terminology:* Use standard terms ($meaning_{nn}$, CP, Maxims, Reflexive Intention).
      *   *Tone:* Respectful but critical. "Pressing a tension" rather than "destroying Grice."

  8.  **Final Polish:** Ensure the flow is logical.
      *   Intro: The foundational tension.
      *   Part I: The burden of $meaning_{nn}$.
