  1.  **Analyze the Request:**
      *   **Topic:** Grice's account of conversational implicature.
      *   **Task:** Argue *against* Grice's foundation. Specifically, argue that "speaker meaning" (non-natural meaning, $meaning_{nn}$) is the wrong basis for implicature.
      *   **Key Problem to Highlight:** The intention-based definition of speaker meaning requires the audience to recognize the intention to be recognized. This creates a circularity or under-determination problem when combined with the Cooperative Principle (CP) and Maxims. The CP/Maxims seem to presuppose the common ground about intentions they are supposed to generate.
      *   **Goal:** Sketch a non-circular account of implicature.
      *   **Context:** A colloquium talk (needs to be rigorous, philosophical, persuasive, and structured for an academic audience).

  2.  **Deconstruct Grice's Framework:**
      *   *Speaker Meaning ($meaning_{nn}$):* S means something by x iff S intends to produce an effect in A by getting A to recognize this intention. (Reflexive intention).
      *   *Conversational Implicature:* What is conveyed beyond what is said, derived from the assumption that S is observing the CP and Maxims.
      *   *The Calculation:* S said $p$; there is no reason to think S is flouting maxims; S could not be doing this unless they thought $q$; S knows I know this; therefore $q$.

  3.  **Identify the Tension (The "Gap"):**
      *   Grice builds implicature on top of speaker meaning.
      *   But speaker meaning *itself* relies on mutual recognition of intentions.
      *   Implicature calculation *also* relies on mutual recognition of intentions (specifically, the intention to be cooperative).
      *   *The Circularity:* To understand what is *said* (via speaker meaning), I need to recognize your intention. To understand what is *implicated*, I need to assume you are being cooperative (which is an intention). But how do I know you intend to be cooperative *before* I've fully grasped your speaker meaning? If the CP is the bridge, does the CP rely on the very intentional structure it's supposed to explain?
      *   *The Under-determination:* If I haven't established the basic communicative intention ($meaning_{nn}$), how can I invoke the Maxims? If I have established it, what work is left for the Maxims to do regarding the *communicative* nature of the act?

  4.  **Develop the Argument (Step-by-Step):**

      *   **Point 1: The Reflexivity of $meaning_{nn}$.**
          *   Grice's definition: $S$ means $nn$ that $p$ by uttering $x$ iff $S$ intends $A$ to believe $p$, and intends $A$ to recognize this intention, and this recognition is the reason for $A$'s belief.
          *   Problem: This requires a high level of mind-reading *before* communication is established. It assumes the "common ground" of intentionality is already solved.

      *   **Point 2: The Role of the CP and Maxims.**
          *   The CP assumes participants are engaged in a cooperative exchange.
          *   The derivation of implicature starts with "S has said $p$."
          *   To get to "S has said $p$" (in the Gricean sense), we need $meaning_{nn}$.
          *   So, we need to recognize S's intention to mean $p$.
          *   But recognizing that intention often *depends* on assuming cooperation (disambiguation, reference fixation).
          *   *The Trap:* We need cooperation to fix meaning, but we need fixed meaning to calculate implicature based on cooperation.

      *   **Point 3: The Circularity/Under-determination Charge.**
          *   If $meaning_{nn}$ is the foundation, it already contains the seed of the CP (the intention to be understood).
          *   If the CP is distinct, it comes too late (after meaning is fixed).
          *   If the CP is part of meaning fixation, then $meaning_{nn}$ isn't the foundation; the CP is.
          *   Grice treats the CP as a normative overlay on top of a pre-existing capacity for $meaning_{nn}$. But in practice, $meaning_{nn}$ in conversation is *constituted* by normative expectations (the CP).
          *   Therefore, basing implicature on $meaning_{nn}$ is building a house on a foundation that already includes the roof.

  5.  **Sketching a Non-Circular Account:**
      *   Need to decouple "communicative success" from "reflexive intention recognition."
      *   Look towards *normative* or *commitment-based* accounts (e.g., Brandom, MacFarlane) or *signaling game* approaches (e.g., Lewis, Skyrms) that don't require full-blown Gricean intentions at step 1.
