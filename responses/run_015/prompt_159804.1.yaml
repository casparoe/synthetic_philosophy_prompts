prompt: |-
  My old roomate, who took a political philosophy class in college, tried to explain Kant's Perpetual Peace to me over coffee the other day. He said something like: 'Kant's plan for everlasting peace has three main parts. First, every state has to have a republican constitution, which basically means a modern liberal democracy where the people elect the government and the executive is checked by the legislature. Second, those states have to join a federation of free states, which is basically an early version of the United Nations or even a world government that can enforce international law and stop aggressors. Third, everyone gets cosmopolitan right, meaning open borders: anyone can travel or move to another country and claim the status of a guest. Put those together and peace is guaranteed, because republics/democracies don't fight each other and global trade makes war unprofitable, so nature or history is on the side of peace and perpetual peace becomes inevitable once we set up the right institutions.' I dont know enough Kant to tell where he's gone wrong. I'm inclined to believe the bit about republics being less warlike, but the 'world government' part sounds off to me.

  Can you go through that summary and tell me what a careful Kant person would accept, what they'd sigh at as a common simplification, and what Kant explicitly denies? I'm especially unsure about two things: is it fair to describe the federation of free states as a world government / UN with enforcement power, and is 'open borders and a right to be a guest' a fair gloss on cosmopolitan right / universal hospitality? Also, does the conclusion that perpetual peace is inevitable once trade is global actually follow from the accurate parts of the summary, or is that an overstatement? Please separate what's accurate, what's a simplification, and what's just wrong, and don't give me a reading list or citations.

  Oh, and a wrinkle I've been mulling: suppose the league in question isn't Kant's ideal voluntary federation but a provisional one that lets non-republican states join as long as they accept a no-first-strike rule and submit to economic sanctions rather than war. Using the corrected view, would Kant count that as the real pacific federation, or would he say it's just another treaty that ends one war? Again, no citations, just the reasoning.
