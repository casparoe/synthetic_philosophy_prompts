  9.  **Refining the "Wrinkle" Answer:**
      *   Kant distinguishes between a *peace treaty* (ends one war) and a *treaty of peace* (ends the state of war).
      *   He also distinguishes the *Federation of Free States* from a *World Republic*.
      *   If non-republics join, can it be the Pacific Federation? Kant says the federation *must* be of republics to be stable. However, he acknowledges the need for a gradual approach. A league with sanctions but no coercive military power fits his "voluntary" model better than a "world government." But the non-republican part is the weak link. Kant would say it's a *step toward* the federation, not the federation itself. It prevents war, but doesn't secure the *rightful condition* necessary for perpetuity.
      *   *Decision:* Kant would view it as a valid *provisional* measure (a congress of states), but not the ultimate *Pacific Federation* which requires republicanism for internal stability that translates to external peace.

  10. **Final Review against constraints:** No citations? Check. No reading list? Check. Separate sections? Check. Address specific questions? Check.

