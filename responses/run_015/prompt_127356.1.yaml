answer: |-
  This is a classic dispute in experimental philosophy, centering on what is now known as **The Knobe Effect** (or the Side-Effect Effect). You have reconstructed the dialectic very accurately. Sam represents the **Bias/Contamination View**, while Nina represents the **Competence/Normative View**.

  Here is the move-by-move breakdown, the verdict on who is right about what, and the experimental design that would actually settle the dispute.

  ### Part 1: Move-by-Move Analysis

  #### 1. The Core Asymmetry (Harm vs. Help)
  *   **The Data:** People say the chairman *intentionally* harmed the environment, but did *not intentionally* help it, despite identical mental states (indifference) and identical foresight.
  *   **Sam's Take:** Moral outrage is contaminating a descriptive concept. We want to blame him, so we retroactively fit the mental state to the blame.
  *   **Nina's Take:** The concept of "intentional" is inherently normative. It asks: "Did the agent relate to this outcome in a way that violates/aligns with expectations?" Indifference to harm is a violation; indifference to help is not.
  *   **Referee Call:** **Nina is stronger here.** If Sam were right, we would expect the effect to disappear when people are given time to think or when the stakes are low. But the effect is robust, immediate, and resistant to debiasing. This suggests it's not a "glitch" (bias) but a "feature" (competence).

  #### 2. The Universality Argument (Kids & Cross-Cultural)
  *   **Sam:** If kids and other cultures show this, it proves the bias is hardwired.
  *   **Nina:** If it's universal, it proves the concept functions this way everywhere.
  *   **Referee Call:** **Draw, but favors Nina.** Sam assumes universality implies "primitive bias." Nina assumes universality implies "functional design." However, Sam's claim that this is "bad news for philosophy" relies on the assumption that philosophical concepts *must* be morally neutral. Nina challenges that assumption. If our concept of agency is inherently moral, then philosophy needs to adjust, not discard the intuition.

  #### 3. The New Case (Legal Duty to Help)
  *   **The Setup:** Chairman has a *duty* to help. He helps as a side effect. He is indifferent.
  *   **Sam:** This is rigged. You added morality explicitly, so of course moral judgment drives the result. It doesn't explain the *original* case.
  *   **Nina:** This isolates the variable. The original case had a background norm (don't harm). This case makes the background norm explicit (must help). If intentionality tracks the *norm* rather than the *valence*, ratings should go up.
  *   **Referee Call:** **Nina wins this round.** Sam's objection that it's "rigged" misses the point of a control case. The question is: What is the active ingredient? Is it **Good/Bad** (Valence) or **Required/Forbidden** (Norm)?
      *   If Sam is right (Valence), a "Good" outcome should never be rated as highly intentional as a "Bad" one, regardless of duty.
      *   If Nina is right (Norm), a "Required" outcome should be rated as more intentional than a "Permitted" one, regardless of valence.

  ### Part 2: The Verdict

  **Who is right about what?**

  1.  **Sam is right that morality is involved,** but wrong that it is a **contamination.** He treats "intentional action" as if it should be a purely mechanical description (like "the ball moved left"). But agency isn't mechanical; it's social.
  2.  **Nina is right about the mechanism,** but slightly imprecise on the definition. She says "intentionally" flags answerability. Technically, you can be answerable for negligence (unintentional). A more precise formulation of her view is: **"Intentionally" tracks whether the agent treated the side effect as a relevant reason for action.**
      *   In the Harm case, the agent *should* have treated the harm as a reason to stop. He didn't. That deviation makes the harm intentional.
      *   In the Help case, the agent *need not* treat the help as a reason. He didn't. That conformity makes the help unintentional.
  3.  **On the New Case:** Empirical studies (e.g., by Knobe, Pettit, and others) have actually run variations of this. When a side effect is **obligatory**, people are significantly more likely to call it intentional than when it is merely permitted. This supports Nina's **Normative Expectation Theory** over Sam's **Moral Valence Theory**.

  **The Bottom Line:** The folk concept of intentional action is not morally neutral. Sam is correct that this disrupts traditional philosophy that assumes neutrality. But Nina is correct that this isn't a bug; it's how the concept works. It tracks **normative expectations**, not just **moral goodness**.

  ### Part 3: How to Settle It (The Experiment)

  To definitively settle this, you need to **decouple Moral Valence (Good/Bad) from Normative Status (Required/Forbidden).**

  Sam thinks Valence drives the judgment. Nina thinks Normative Status drives the judgment. You need a 2x2 factorial design.

  #### The Design
  You need four versions of the Chairman case. You must keep the Chairman's mental state identical in all four (indifference: "I don't care about X, only profit").

  | Condition | Outcome Valence | Normative Status | Vignette Detail |
  | :--- | :--- | :--- | :--- |
  | **1. Standard Harm** | Bad | Forbidden | Program harms env. (Standard Knobe) |
  | **2. Standard Help** | Good | Permitted | Program helps env. (Standard Knobe) |
  | **3. Obligatory Help** | Good | **Required** | Chairman is *legally required* to help env. Program helps. |
  | **4. Obligatory Harm** | Bad | **Required** | Chairman is *legally required* to harm env. (e.g., quarantine burn) Program harms. |

  *Note: Condition 4 is the "Poison Pill." It's hard to construct naturally, but essential. Imagine a general ordered to burn a field to stop a plague, knowing it kills rare birds.*

  #### The Questions
  Do not just ask "Did he do it intentionally?" (This conflates the dependent variable with the mechanism). Ask three separate questions on a 1-7 scale:
  1.  **Intentionality:** "Did the chairman intentionally [bring about the outcome]?"
  2.  **Blame/Praise:** "How much blame/praise does the chairman deserve?"
  3.  **Reason-Responsiveness:** "Did the chairman treat the outcome as a reason for his decision?"

  #### The Predicted Patterns

  **If Sam is Right (Moral Valence Hypothesis):**
  *   **Pattern:** Bad outcomes will always get higher intentionality scores than Good outcomes.
  *   **Prediction:** Condition 1 (Bad) > Condition 4 (Bad) ≈ Condition 3 (Good) > Condition 2 (Good).
  *   **Logic:** It doesn't matter if it was required or forbidden. If it's Bad, it looks intentional. If it's Good, it doesn't.

  **If Nina is Right (Normative Expectation Hypothesis):**
  *   **Pattern:** Violating a norm (Forbidden) will get higher intentionality scores than Following a norm (Required).
  *   **Prediction:** Condition 1 (Forbidden) > Condition 3 (Required) **AND** Condition 4 (Forbidden) > Condition 2 (Permitted).
  *   **Crucial Test:** Compare Condition 3 (Obligatory Help) vs. Condition 4 (Obligatory Harm).
      *   If Sam is right, Condition 4 (Bad) should be much higher than Condition 3 (Good).
      *   If Nina is right, the gap should narrow significantly, or Condition 3 should rise to meet Condition 4, because in both cases the agent is acting under a constraint they claim to ignore.

  #### The "Smoking Gun" Result
  The result that would settle the debate is **Condition 3 (Obligatory Help).**

  *   **If people say "Not Intentional":** Sam wins. Moral goodness overrides normative duty. The concept is valenced.
  *   **If people say "Intentional" (or significantly higher than Standard Help):** Nina wins. Normative expectation overrides moral goodness. The concept tracks reasons/expectations.

  *Existing Literature Hint:* Studies that have approximated this (e.g., *Guglielmo & Malle, 2010*; *Knobe, 2010*) suggest that when the help is obligatory, intentionality ratings **rise significantly**. This suggests Nina is right: the asymmetry isn't about Good vs. Evil; it's about **Deviance vs. Conformity** to expectations.

  ### Summary for Your Friends
  Tell Sam: "You're right that morality is in the driver's seat, but wrong that it's a crash. It's the engine."
  Tell Nina: "You're right that it's about norms, but be careful not to reduce 'intentional' to 'responsible.' We need to show the norm changes the *action description*, not just the blame."

  **The Referee's Ruling:** Run the **Obligatory Help** case. If intentionality ratings spike, Nina takes the title. If they stay flat, Sam keeps it. My money is on Nina.
