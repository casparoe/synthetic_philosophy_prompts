      *   **Task:** Referee the debate between Idris and Rowena.
      *   **Specific Instructions:**
          *   Go through the exchange move by move (1-6).
          *   Say who is right about what at each point.
          *   Be explicit where a move is partly right but does less work than claimed.
          *   Identify what both are missing (the distinction/background assumption that reframes the disagreement).
          *   Separate settled consensus from genuinely contested issues (do not present contested positions as consensus).
          *   Flag where reasoning is based on the described cases rather than established facts.
          *   No references/further reading.

  2.  **Analyze the Debate (Move by Move):**

      *   **Move 1 (Idris - The Quiet Swap):**
          *   *Argument:* Synonymous substitution in sperm DNA $\rightarrow$ qualitatively indistinguishable organism $\rightarrow$ same person. Therefore, specific gamete identity doesn't matter, only the qualitative outcome.
          *   *Assessment:* This relies on the intuition that qualitative indistinguishability implies numerical identity (or at least that the difference is metaphysically irrelevant). This challenges the *necessity* of the *specific* material gamete.
          *   *Verdict:* Idris is right that this is a strong intuitive counterexample to a *rigid* material origin essentialism. However, he assumes qualitative indistinguishability entails identity (or same personhood), which is exactly what the essentialist denies. He begs the question against the essentialist who holds that *origin* fixes identity, not qualitative profile.

      *   **Move 2 (Rowena - The Transitivity Reply):**
          *   *Argument:* Different DNA = Different Zygote. Identity is transitive. The actual adult comes from the actual zygote. Idris assumes the conclusion (that the person is the same) in the description.
          *   *Assessment:* Rowena correctly identifies that Idris is assuming a qualitative criterion of identity over a historical/origin one. She defends the standard Kripkean line: origin is constitutive, not evidential.
          *   *Verdict:* Rowena is right that Idris's description presupposes the falsity of origin essentialism. However, she risks making the thesis trivial ("it's different because it's different") if she doesn't explain *why* the origin matters metaphysically.

      *   **Move 3 (Idris - The Quiet Edit):**
          *   *Argument:* Repair machinery fixes the mutation immediately. Qualitative difference vanishes instantly. Rowena's transitivity argument would rule them distinct even if the difference is erased immediately. Also, brings in fission/fusion indeterminacy to challenge the "earliest stage" fixation.
          *   *Assessment:* The "Quiet Edit" strengthens the intuition that the difference is negligible. The fission/fusion point is a separate (though related) issue about indeterminacy of identity.
          *   *Verdict:* Idris is right that if the difference is erased immediately, the intuition that they are *different people* becomes harder to swallow. He is partly right about fission/fusion challenging determinate identity, but this might be a category error (modal identity vs. temporal indeterminacy). Rowena can concede indeterminacy in fission without conceding modal flexibility in origin.

      *   **Move 4 (Rowena - The Threshold/Proxy Reply):**
          *   *Argument:* Fission/fusion is about identity through time; origin essentialism is about modal profile. The continuum (sorites-style) doesn't matter because identity isn't a matter of degree. No threshold needed.
          *   *Assessment:* This is a robust defense of essentialism. Essentialism is all-or-nothing. The lack of a "principled line" in qualitative similarity is expected if identity is not based on similarity.
          *   *Verdict:* Rowena is right that origin essentialism does not require a threshold of qualitative similarity. She correctly distinguishes temporal identity conditions from modal origin conditions. Idris's sorites worry misses the mark if identity is non-qualitative.

      *   **Move 5 (Idris - The Delayed Twin/Proxy Argument):**
          *   *Argument:* Clones (SCNT) have same genome but are different people. Therefore, genome isn't sufficient. What matters is causal/historical embedding. Gamete thesis is just a proxy for this deeper causal history.
          *   *Assessment:* This shifts the ground from *material* origin (gametes) to *causal/historical* origin. It concedes essentialism but changes the *essence*.
          *   *Verdict:* Idris is right that genome sameness $\neq$ person identity (clones are distinct). He is right that "gamete" might be a proxy for "unique historical origin." However, he claims this drops the gamete thesis. Kripkeans can accept clones are distinct *because* they have different origins (different events), so this doesn't necessarily refute gamete essentialism, just refines it.

      *   **Move 6 (Rowena - The Account Demand):**
          *   *Argument:* If gametes are a proxy, define the proxy. It must deliver standard verdicts (different parents = different person) without reducing everything to causal history (since some causal variations don't matter).
          *   *Assessment:* This demands a positive theory. If Idris says "it's causal history," he needs to specify *which* parts of causal history.
          *   *Verdict:* Rowena is right to demand specificity. "Causal history" is too vague. The challenge is to distinguish relevant from irrelevant causal variations (e.g., time of conception vs. substance of conception).

  3.  **Synthesize the "Missing Piece":**
      *   What is the core disagreement? It's about the *ground* of essentialism.
      *   Idris thinks essentialism must be grounded in qualitative significance or a specific causal structure that allows for micro-variations.
      *   Rowena thinks essentialism is a brute metaphysical fact about *this* substance vs. *that* substance.
      *   *The Missing Distinction:* **Substance Essentialism vs. Sortal/Functional Essentialism.** Or, more precisely, **Constitutive Essentialism (the stuff) vs. Historical Essentialism (the event).**
      *   Actually, a better reframing is **The Source of Necessity.** Is it the *material* (the sperm/egg particles) or the *event* (the fertilization event)?
      *   Idris argues for a functional/causal view (what the gamete *does*). Rowena argues for a particularist view (which gamete *it is*).
      *   The missing background assumption is whether biological identity tracks *material continuity* or *historical genesis*.
      *   Also, the distinction between **Intrinsic** properties (DNA sequence) and **Extrinsic/Relational** properties (being produced by *this* sperm). Kripke leans relational/historical. Idris leans intrinsic/qualitative.
      *   *Refinement:* The key missing distinction is between **Origin as Material Constitution** vs. **Origin as Historical Event**. Idris attacks the Material view (swap the atoms/DNA). Rowena defends the Historical view (this specific event). But Kripke is often read as Historical. If Rowena defends "This Sperm" as a particular, she aligns with Kripke. If Idris says "Same DNA/Function," he attacks the Material necessity.
      *   *Better Reframing:* **Haecceitism.** Rowena is implicitly a haecceitist (this-ness matters independent of qualities). Idris is an anti-haecceitist (supervenience on qualities). The debate is fundamentally about Haecceitism.

  4.  **Drafting the Report (incorporating constraints):**
      *   *Tone:* Professional, analytical, neutral referee.
      *   *Structure:* Move-by-Move Analysis, Overall Assessment, The Missing Distinction, Consensus vs. Contested.
      *   *Constraint Check:* Flag reasoning from cases. Don't claim consensus where none exists.

      *(Self-Correction during drafting)*: I need to be careful not to say Kripke *definitely* meant X. Kripke's view is interpreted in various ways. I must state that the *interpretation* is contested.
      *   Move 1: Idris assumes supervenience of identity on qualitative properties. Contested.
      *   Move 2: Rowena assumes transitivity and distinctness of zygotes. Standard logic, but the application to persons is the contested bit.
      *   Move 3: Fission point is a bit of a red herring regarding modal essentialism, but valid regarding indeterminacy.
      *   Move 4: Rowena is strong here on the "no threshold" point.
      *   Move 5: Idris conflates genome with origin. Clones have different origins.
      *   Move 6: Rowena wins the burden of proof point.

      *Missing Distinction:* Haecceitism vs. Qualitative Supervenience. Or, Material vs. Historical Origin. Let's go with **Haecceitism** as the deep metaphysical fault line, manifested as **Material vs. Historical** specification of origin.

      *Consensus Check:*
      *   Settled: Clones are not the original person. Fission creates indeterminacy (mostly agreed).
      *   Contested: Whether origin essentialism is true at all. Whether it relies on material or historical facts. Whether haecceities exist.

  5.  **Final Polish:** Ensure the "flagging" of case-based reasoning is clear. Ensure I don't sound like I'm solving metaphysics, but refereeing the argument structure.

