      *   **Brainstorming Key Distinctions:**
          *   *Intention vs. Foresight:* The core of DDE.
          *   *Direct vs. Indirect Agency:* Who is the moral author?
          *   *Delegation vs. Personal Culpability:* How responsibility travels up the chain.
          *   *Scale vs. Kind:* Is nuclear different because it's bigger, or because it's inherently indiscriminate?

      *   **Reconstructing the Implicit Theory:**
          *   The current system seems to operate on a "Threshold Theory." Below the threshold (conventional), standard *jus in bello* (proportionality, distinction) applies via delegation. Above the threshold (nuclear), the stakes are existential, so authority must be absolute.
          *   *The Philosophical Commitment:* It presupposes that nuclear war is a *sui generis* political act, not merely a military one. By requiring Presidential authorisation, it acknowledges that the moral burden is too heavy for a general.
          *   *DDE Connection:* In conventional war, we claim civilian deaths are *foreseen but unintended*. In nuclear war, given the blast radius and fallout, claiming they are "unintended" is philosophically bankrupt. The protocol admits this by making the ultimate moral agent (the President) own the decision explicitly.

      *   **Anscombe vs. The Protocol:**
          *   Anscombe argued Truman was a murderer because he *intended* the destruction of civilian centres to break will.
          *   Does the current protocol agree? By keeping the nukes locked until the President speaks, it implicitly admits: "This act is so morally fraught that only the sovereign can commit it."
          *   However, it doesn't necessarily accept Anscombe's *prohibition*. It accepts her *attribution of guilt*. It says, "If this happens, the President is guilty," not "This must not happen."
