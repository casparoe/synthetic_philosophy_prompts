prompt: |-
  I'm a journalist covering science and ideas, and I was chating with friends about nuclear command protocols — specifically the instutional split where nuclear weapons stay under positive control (the President must personally authorise every use) while conventional airstrikes run through delegated rules of engagement that leave proportionality calls to field commanders. It struck me that this isn't just logistics; it hides a philosophy of moral agency in plain sight. So I want you to act as a professional philosopher specialising in ethics of war and institutional reasoning, think carefully, and maybe start with a quick brainstorm of the key distinctions — intention versus foresight, direct versus indirect agency, delegation versus personal culpability — before you answer the main thing. Take the practice I just described and ask what philosophical commitments it presupposes about blameworthiness and the doctrine of double effect. Does it quietly assume something like Anscombe's view that Truman's direct authorisation of the Hiroshima and Nagasaki bombings made him a murderer because you can't intentionally kill innocents as a means to an end? Or can the split be explained without that — say, by treating nuclear weapons as categorically different in scale rather than in moral structure? Reconstruct the implicit theory, say whether it's coherent or just politically convenient, point out any inconsistencies (for instance, if a President personally signs off on a nuclear strike knowing civilians will die, is that structurally different from Truman's decision, or does the framework just paper over the same intentional killing with beurocratic distance?), and tell me what would have to change in military ethics if we actually took Anscombe's protest seriously rather than treating it as decorative outrage. Please write in British English, don't just list philosophers, and dig into the logic of the practice itself.
