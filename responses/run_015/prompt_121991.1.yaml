  # SEMINAR HANDOUT: TAXONOMY OF THE ANTHROPOCENE
  **Course:** Philosophy of Science 504 | **Audience:** Graduate Seminar (n=15)
  **Topic:** Logical Space of Anthropocene Formalization

  ## I. DECISION TREE STRUCTURE

  The following taxonomy sorts competing positions on the Anthropocene based on ontological commitments regarding stratigraphic boundaries and epistemic commitments regarding authority. Navigate the tree by answering the split-claims at each node.

  **NODE 1 (Ontological Threshold):** Does the designation 'Anthropocene' require a discrete, globally synchronous stratigraphic marker (GSSP) to be scientifically valid?
  *   **YES:** Proceed to Node 2 (Formalist Path).
  *   **NO:** Proceed to Node 5 (Informalist Path).

  **NODE 2 (Stratigraphic Durability):** Must the chosen marker possess *predictive durability* (persisting distinctly in the rock record for >10,000 years) to validate the epoch, rather than merely describing past deposition?
  *   **YES:** Proceed to Node 3 (Future-Proofing).
  *   **NO:** Proceed to Node 4 (Descriptive Recovery).

  **NODE 3 (Diachronic Authority):** Does the legitimacy of the epoch classification depend on the deciding scientific body being *contemporaneous* with the onset of the stratigraphic signal?
  *   **YES:** **LEAF 1 [Unoccupied: The Contemporaneity Constraint]**
  *   **NO:** **LEAF 2 [The Great Acceleration View]**

  **NODE 4 (Onset Timing):** Is the primary stratigraphic signal located *after* the year 1500 CE?
  *   **YES:** **LEAF 3 [The Orbis View]**
  *   **NO:** **LEAF 4 [The Deep Time View]**

  **NODE 5 (Normative Status):** If no GSSP is required, should the term nevertheless be formally ratified as a geological epoch by the International Commission on Stratigraphy (ICS)?
  *   **YES:** **LEAF 5 [Unoccupied: The Normative Formalist]**
  *   **NO:** Proceed to Node 6 (Governance).

  **NODE 6 (Institutional Authority):** Does the ICS retain exclusive authority to define the usage of the term, even in its informal capacity?
  *   **YES:** **LEAF 6 [The Anti-Formalist View]**
  *   **NO:** **LEAF 7 [The Democratic Geoscience View]**

  ***

  ## II. LEAF POSITIONS AND COMMITMENTS

  **LEAF 1: The Contemporaneity Constraint (Unoccupied)**
  *   **Position:** Requires a GSSP and predictive durability, but insists only scientists living at the onset can validate it.
  *   **Diagnosis of Emptiness:** **Incoherent.** Geology is inherently retrospective; this position demands a temporal impossibility (prophecy or time travel) for validation, rendering the category unusable by definition.
  *   **Awkward Commitment:** "We cannot know if we are in a new epoch until we are dead and judged by descendants."

  **LEAF 2: The Great Acceleration View**
  *   **Position:** Requires a GSSP (e.g., radionuclides) and predictive durability, validated retrospectively by modern stratigraphers.
  *   **Awkward Commitment:** "Human history prior to 1950 is geologically negligible compared to the persistence of plutonium."

  **LEAF 3: The Orbis View**
  *   **Position:** Requires a GSSP but accepts descriptive recovery of biotic/atmospheric shifts (e.g., 1610 CO₂ dip) without demanding million-year durability.
  *   **Awkward Commitment:** "A temporary dip in atmospheric carbon constitutes a more definitive human marker than its subsequent permanent rise."

  **LEAF 4: The Deep Time View**
  *   **Position:** Requires a GSSP but accepts descriptive recovery of early anthropogenic signals (e.g., methane, agriculture) millennia ago.
  *   **Awkward Commitment:** "The Holocene is a fictional category that ended before written history began."

  **LEAF 5: The Normative Formalist (Unoccupied)**
  *   **Position:** Rejects the necessity of a GSSP but still demands formal ICS ratification of the term.
  *   **Diagnosis of Emptiness:** **Unattractive/Pragmatically Inconsistent.** Seeking formal status while rejecting the formal criteria (GSSP) undermines the authority of the ratifying body, offering no strategic advantage over Leaf 6.
  *   **Awkward Commitment:** "Stratigraphers should vote to formalize a term that fails the criteria for formalization."

  **LEAF 6: The Anti-Formalist View**
  *   **Position:** Rejects GSSP necessity and ICS ratification, but maintains that scientific bodies should guide the term's informal usage.
  *   **Awkward Commitment:** "The term is politically vital but must remain scientifically second-class to preserve its utility."

  **LEAF 7: The Democratic Geoscience View**
  *   **Position:** Rejects GSSP necessity, ICS ratification, and ICS monopoly on definition, advocating for shared authority with affected communities.
  *   **Awkward Commitment:** "Indigenous oral histories hold equal epistemic weight to mass spectrometry in defining geological time."

  ***

  ## III. NOTES ON DISTINCTIONS

  **Diachronic Authority (Node 3):** This branch isolates the epistemic privilege of the present. Standard geology assumes retrospective classification is superior (Leaf 2); Leaf 1 explores the niche claim that only observers witnessing the transition can validate it. This leaf is currently unoccupied because it contradicts the methodological naturalism of stratigraphy.

  **Predictive Power vs. Descriptive Coherence (Node 2):** This split distinguishes positions that view the Anthropocene as a permanent future stratum (Leaf 2) from those viewing it as a description of past human impact (Leaves 3 & 4).

  **Leaf Collapse Check:** No leaves in this taxonomy collapse. While Leaf 6 (Anti-Formalist) and Leaf 7 (Democratic) both reject formal ratification, they are logically distinct at Node 6 regarding *who* constitutes the epistemic authority (exclusive scientific body vs. shared interdisciplinary/community body). While rhetorically similar in their rejection of the ICS, they diverge on the governance of scientific language.
