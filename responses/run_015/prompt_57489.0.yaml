  Here's a thinking process that leads to the suggested preparation sheet:

  1.  **Analyze the Request:**
      *   **Context:** A presentation at a European social choice workshop (approx. 25 people).
      *   **Audience:** Mostly mathematical economists (aggregation, inequality, axiomatics), a few philosophers of economics (VNM utility meaning/comparability), one prioritarian (population ethics), some experimentalists. *No* Savagean decision theorists, *no* interest in metaethics.
      *   **Task:** Create a preparation sheet for the Q&A period.
      *   **Thesis:** Harsanyi's Aggregation Theorem doesn't prove utilitarianism because it lacks interpersonal utility calibration. The "Transposition Premise" (extended utility = individual utility numerically) is hidden. Proposal: Weaken Pareto Indifference to "Calibrated Pareto Indifference" using a common reference lottery to fix affine scales. This allows non-linear (prioritarian/rank-dependent) aggregations.
      *   **Requirements:**
          *   8-10 objections, ordered by damage potential.
          *   Tagged by subgroup (Axiomatizers, Philosophers, Experimentalists, Prioritarian).
          *   Phrased in their specific vocabulary.
          *   2-minute reply for each.
          *   Candid note on the "soft spot" of the reply.
          *   Identify fatal vs. inconvenient objections.
          *   Advice on concessions to buy credibility.
          *   Identify the single reply that *must* land.
          *   Identify the "hope nobody asks" question (likely about subjective beliefs/calibration definition).
          *   Flag objections the audience won't actually raise (over-preparation).
          *   **Crucial:** Self-assessment of confidence, specifically checking if attributions to Sen, Weymark, or Prioritarians are accurate or reconstructed.

  2.  **Deconstruct the Thesis & Audience:**
      *   *Thesis Strength:* It challenges a canonical result (Harsanyi) by pointing out a hidden normalization assumption. It proposes a technical fix (calibration lottery).
      *   *Thesis Weakness:* Calibration lotteries are notoriously difficult to define interpersonally. If beliefs differ, a "common lottery" isn't common. If utilities are VNM, they are unique only up to affine transformation *individually*. Forcing a common anchor might violate the spirit of subjective expected utility if beliefs vary.
      *   *Audience Vibe:* Mathematical economists care about independence of axioms, non-vacuity, and representation uniqueness. Philosophers care about the *meaning* of the utility numbers. Experimentalists care about behavioral realism. The Prioritarian cares about risk attitudes and the veil of ignorance.
      *   *Constraint:* No metaethics. Keep it technical/axiomatic.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Fatal):* The Calibration Lottery problem with heterogeneous beliefs. If agents have different subjective probabilities, a "common lottery" isn't evaluated the same way. This kills the "Calibrated Pareto" condition. *Target:* Axiomatizers/Philosophers.
      *   *Objection 2 (Fatal/Severe):* Uniqueness/Representation Class. Does this actually generate a unique social welfare functional? Or does it just allow *anything*? If the class is too broad, the theorem is vacuous. *Target:* Axiomatizers.
      *   *Objection 3 (Severe):* The "Transposition" is still there. You claim to remove it, but fixing the zero and unit via a lottery *is* a transposition assumption. You haven't escaped Harsanyi; you've just moved the normative load. *Target:* Philosophers of Economics.
      *   *Objection 4 (Moderate):* Pareto is too strong/weak. If you weaken Pareto, do you lose the normative force? Why should we accept Calibrated Pareto? *Target:* Axiomatizers.
      *   *Objection 5 (Moderate):* Prioritarian/Risk. Harsanyi's Veil of Ignorance *is* the calibration. Your calibration lottery duplicates the risk attitude of the observer, conflating risk and equity. *Target:* The Prioritarian.
      *   *Objection 6 (Moderate):* Observability. How do we find this lottery empirically? *Target:* Experimentalists.
      *   *Objection 7 (Minor):* Sen's critique. You're still doing welfarism. *Target:* Philosophers (but audience knows Sen).
      *   *Objection 8 (Minor):* Weymark's generalized utilitarianism. You claim to include prioritarianism, but Weymark already did this without your calibration. *Target:* Axiomatizers.
      *   *Objection 9 (Minor/Unused):* Savagean foundations. (Request says nobody cares, so flag this as "don't prepare").
      *   *Objection 10 (Minor):* Metaethics. (Request says nobody cares, flag as "don't prepare").

      *Refining the "Fatal" assessment:* The belief heterogeneity issue is the technical killer for VNM frameworks. If the calibration lottery relies on objective probabilities but agents have subjective ones, the axiom is ill-defined. If it relies on subjective ones, they won't agree on the evaluation. This needs to be the "Hope nobody asks" but also the top damage objection if asked.
      *Refining the "Weymark/Sen" attributions:* I need to be careful here. Sen criticizes Harsanyi for conflating moral preferences with personal preferences. Weymark shows that Harsanyi + cardinal unit comparability = Utilitarianism. If the user claims Weymark insists on *more* than the theorem delivers, that's accurate (Weymark says you need CUC).
      *Refining the "Prioritarian":* Prioritarians (like Otsuka or Voorhoeve) often argue that the Veil of Ignorance models risk, not equity. If the user's calibration lottery fixes risk attitudes, it might block prioritarianism rather than enable it.

  4.  **Developing Replies & Soft Spots:**
      *   For the Belief Heterogeneity (Fatal): Reply must distinguish between *objective* reference prospects (physical states) vs. subjective evaluation. Soft spot: If agents disagree on the physics, it breaks.
      *   For the "Moved Normative Load" (Severe): Reply must admit the load exists but argue it's *transparent* rather than hidden. Soft spot: Transparency doesn't make it less controversial.
      *   For the Vacuity/Representation (Severe): Reply must show the class is constrained (e.g., excludes dictatorship). Soft spot: Might still be too broad to be useful.

  5.  **Structuring the Sheet:**
      *   Follow the prompt's specific ordering and formatting requirements.
      *   Ensure the tone is professional, concise, and tailored to the specific subgroups.
      *   Include the "Concessions," "Must Land," "Hope Nobody Asks," and "Don't Prepare" sections.
      *   Include the Self-Assessment at the end.

  6.  **Review against Constraints:**
      *   8-10 objections? Yes.
      *   Ordered by damage? Yes.
      *   Tagged by subgroup? Yes.
      *   2-minute reply? Yes (summarized).
      *   Soft spot noted? Yes.
      *   Fatal vs. Inconvenient identified? Yes.
      *   Concessions advice? Yes.
      *   "Hope nobody asks" included? Yes.
      *   "Won't raise" flagged? Yes.
      *   Self-assessment on Sen/Weymark accuracy? Yes.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't accidentally introduce Savagean language (states of the world vs. outcomes) since the prompt says the audience isn't Savagean. Stick to VNM lotteries.
      *   *Correction:* Ensure the distinction between "Calibrated Pareto" and standard Pareto is clear in the replies.
      *   *Correction:* Check the Weymark attribution. Weymark (1991) "A Reconsideration of the Harsanyi-Sen Debate" is the key text. He argues Harsanyi needs CUC (Cardinal Unit Comparability) to get Utilitarianism. The user's thesis aligns with this but proposes a specific mechanism for CUC. I need to make sure the objection reflects Weymark's actual point (that Harsanyi *lacks* CUC) rather than implying Weymark thinks Harsanyi *has* it.
      *   *Correction:* Check Sen. Sen's "Interpersonal Aggregation and Partial Comparability" (1970) and "Plural Utility" (1980). Sen argues Harsanyi assumes more comparability than stated. The objection should reflect that the user's "calibration" is just restating the need for comparability without solving the *justification* problem.

  8.  **Finalizing the Output:** (Proceeding to generate response based on these thoughts).
answer: |-
  # PREPARATION SHEET: Q&A STRATEGY
  **Workshop:** European Social Choice (Annual)
  **Audience:** 25 (Mostly Axiomatic Economists, 2-3 Phil-Econ, 1 Prioritarian, Few Experimentalists)
  **Topic:** Harsanyi, Transposition, and Calibrated Pareto Indifference

  ## I. CONCESSIONS TO BUY CREDIBILITY (First 5 Minutes)
  *   **Concede to the Axiomatizers:** Acknowledge immediately that "Calibrated Pareto" is a stronger informational requirement than standard Pareto Indifference *if* the calibration lottery is not naturally salient. Do not claim you have "solved" interpersonal comparison; claim you have *localized* the normative assumption to a specific axiom (Calibration) rather than hiding it in the interpretation of the representation.
  *   **Concede to the Philosophers:** Admit that the "reference prospects" (best/worst case) require a shared understanding of outcomes. If you claim these are purely subjective, you invite the belief-heterogeneity objection. Frame them as *publicly observable states* to preempt this.
  *   **Why:** This signals you understand the technical cost of your move. It prevents them from spending 10 minutes proving you know VNM theory is about affine transformations. You know; you're proposing a restriction on the admissible transformations.

  ## II. THE SINGLE REPLY THAT MUST LAND
  **The Question:** "Does your calibration condition actually restrict the social welfare functional, or does it just redefine the utility scales such that any SWF can be represented?"
  **The Reply:** "It restricts the *admissible transformations* of the individual utility functions, not the SWF form directly. By fixing the zero and unit via a common lottery, we move from Non-Comparability to Cardinal Unit Comparability (CUC). Under CUC, the Harsanyi linearity result holds *only if* we maintain Strong Pareto. By weakening Pareto to Calibrated Pareto, we allow non-linear aggregations (like prioritarianism) *without* violating the representation theorem. The restriction is real: it rules out dictators who ignore the calibration anchor, and it rules out aggregations sensitive to arbitrary affine shifts."
  **Why:** If you fail to convince them the class of functionals is properly constrained (i.e., not "everything"), the theorem is vacuous. This is the mathematical core of the paper.

  ## III. OBJECTIONS ORDERED BY DAMAGE POTENTIAL

  ### 1. The Heterogeneous Beliefs Objection (Fatal)
  *   **Subgroup:** Axiomatizers / Phil-Econ
  *   **Phrasing:** "Your calibration lottery relies on individuals evaluating a 'common' prospect at the 'same' probability. In a VNM framework, probabilities are subjective. If agents hold different subjective beliefs about the reference lottery, your Calibrated Pareto axiom is ill-defined. If you assume objective probabilities, you've exited the VNM framework. Is your representation class vacuous once we allow heterogeneous priors?"
  *   **2-Minute Reply:** "I define the reference prospects as *physical states* with objectively known frequencies (e.g., a draw from a public urn), not subjective events. VNM allows for objective risk. The axiom applies to the domain of acts where probabilities are common knowledge. I am not solving the Savagean problem of subjective belief aggregation; I am solving the VNM problem of utility scale aggregation under risk."
  *   **Soft Spot:** If they press that *no* real-world prospects are objectively agreed upon, your axiom becomes empirically empty. You are relying on an idealization that may be too strong for the "social" part of social choice.
  *   **Verdict:** **FATAL.** If you cannot defend the coherence of the calibration lottery under heterogeneous beliefs, the axiom collapses.

  ### 2. The "Moved Normative Load" Objection (Severe)
  *   **Subgroup:** Philosophers of Economics
  *   **Phrasing:** "You criticize Harsanyi for hiding the 'transposition premise.' But your calibration lottery *is* a transposition premise. You are assuming that the utility difference between the best and worst prospect is *identical* for all persons. That is a substantive ethical claim about the equalizability of welfare ranges, not a neutral calibration. Have you really reduced the normative load, or just made it more explicit?"
  *   **2-Minute Reply:** "I have not reduced the load; I have *disclosed* it. Harsanyi's readers assume utilitarianism follows from rationality alone. My theorem shows utilitarianism follows from rationality *plus* a specific calibration assumption. By isolating this assumption in a distinct axiom, we allow for the possibility of rejecting calibration while accepting rationality, which Harsanyi's original formulation obscures."
  *   **Soft Spot:** You must admit you haven't "solved" the justification problem. If you claim this makes the calibration *easier* to justify, they will pounce. Stick to "transparency."
  *   **Verdict:** **SEVERE.** If you claim this solves the ethical justification, you lose the philosophers. If you claim it clarifies the structure, you survive.

  ### 3. The Vacuity of the Representation Class (Severe)
  *   **Subgroup:** Axiomatizers
  *   **Phrasing:** "You claim your class contains utilitarianism and prioritarianism. But if you weaken Pareto sufficiently to allow prioritarianism, do you not also allow arbitrary rank-orderings that violate anonymity? What independent axioms restrict your class to ethically plausible functionals, other than the calibration itself?"
  *   **2-Minute Reply:** "Calibrated Pareto combined with Anonymity and Continuity restricts the class to symmetric, continuous functionals. The calibration fixes the scale, Anonymity fixes the weighting structure. Without calibration, Anonymity is undefined across different affine scales. With it, we recover a well-defined subset of generalized utilitarian forms."
  *   **Soft Spot:** You need to be sure your proof actually guarantees Anonymity works post-calibration. If the calibration is person-specific in practice, Anonymity fails.
  *   **Verdict:** **SEVERE.** If the class is too broad, the theorem is mathematically trivial.

  ### 4. The Prioritarian's Risk/Equity Conflation (Moderate)
  *   **Subgroup:** The Prioritarian
  *   **Phrasing:** "Prioritarianism distinguishes between risk aversion over a single life and equity aversion across lives. Your calibration lottery uses risk to fix the scale. Doesn't this conflate the observer's risk attitude with the equity weighting? You might be deriving prioritarianism only by building risk aversion into the calibration."
  *   **2-Minute Reply:** "The calibration fixes the *units* of measurement (the meter stick), not the *weighting* of the units. A prioritarian can accept the calibration of the meter stick (utility differences) while applying a concave transformation to the *sum* of those calibrated utilities. The calibration lottery establishes comparability; the social functional determines the equity weighting."
  *   **Soft Spot:** Distinguishing the "meter stick" from the "weighting function" is subtle. If your calibration lottery involves risk aversion, it might implicitly set the curvature of the utility function, precluding separate equity curvature.
  *   **Verdict:** **MODERATE.** Manageable if you keep the distinction between *measurement* and *aggregation* sharp.

  ### 5. Weymark's Generalized Utilitarianism (Moderate)
  *   **Subgroup:** Axiomatizers
  *   **Phrasing:** "Weymark (1981) already showed that dropping linearity yields generalized utilitarianism without needing your specific calibration lottery. What does your 'Calibrated Pareto' add that Weymark's cardinal unit comparability assumption does not already cover?"
  *   **2-Minute Reply:** "Weymark *assumes* Cardinal Unit Comparability (CUC) as a property of the information environment. I provide an *axiomatic foundation* for CUC within the preference framework. Weymark takes the scale as given; I derive the conditions under which the scale can be treated as given via a choice-theoretic anchor."
  *   **Soft Spot:** This is a "contribution" claim. If they feel your derivation is trivial, they will dismiss it as re-inventing the wheel.
  *   **Verdict:** **MODERATE.** You need to prove the derivation is non-trivial.

  ### 6. Observability of Reference Prospects (Inconvenient)
  *   **Subgroup:** Experimentalists
  *   **Phrasing:** "In the lab, subjects rarely agree on what constitutes a 'best' or 'worst' case, even with instructions. If your axiom requires consensus on reference prospects, isn't it descriptively false for any heterogeneous population?"
  *   **2-Minute Reply:** "This is a normative theory, not a descriptive model. The axiom specifies the conditions for *justified* aggregation, not *actual* behavior. However, experimental work on 'anchoring' suggests that providing focal points (like your reference lottery) increases agreement on scales. The theory predicts where agreement *should* lead, not where it currently is."
  *   **Soft Spot:** They care about descriptive truth. You must firmly pivot back to normativity without sounding dismissive.
  *   **Verdict:** **INCONVENIENT.** They won't kill the paper, but they will note the empirical gap.

  ### 7. Sen's "Moral Preferences" Critique (Inconvenient)
  *   **Subgroup:** Philosophers of Economics
  *   **Phrasing:** "Sen argues Harsanyi fails because it derives 'ought' from 'is' (preferences). Your calibration still relies on individual preferences over lotteries. How does fixing the scale escape Sen's charge that rational preferences do not yield ethical conclusions?"
  *   **2-Minute Reply:** "I agree with Sen that preferences alone do not yield ethics. That is why I introduce the Calibration axiom as a *normative* constraint on the aggregation rule, not a description of individual rationality. The theorem shows: *If* you accept Calibration, *then* you must accept this class of SWFs. It clarifies the necessary ethical input, rather than claiming to derive ethics from rationality alone."
  *   **Soft Spot:** You are conceding Sen's main point. Ensure you don't sound like you're ignoring it.
  *   **Verdict:** **INCONVENIENT.** The audience knows Sen. Acknowledging him disarms the critique.

  ### 8. Independence of Axioms (Inconvenient)
  *   **Subgroup:** Axiomatizers
  *   **Phrasing:** "Is Calibrated Pareto independent of Strong Pareto? If I assume Strong Pareto, does Calibration add anything, or is it redundant?"
  *   **2-Minute Reply:** "It is independent. Strong Pareto ranks lotteries based on individual preferences. Calibrated Pareto ranks them based on preferences *normalized* to a common scale. One can satisfy Strong Pareto but violate Calibrated Pareto if individual scales are not aligned with the reference lottery."
  *   **Soft Spot:** Requires a concrete counter-example in your head. If you fumble the example, you look unprepared.
  *   **Verdict:** **INCONVENIENT.** Technical check. Have the example ready.

  ### 9. The "Dictatorship" Worry (Inconvenient)
  *   **Subgroup:** Axiomatizers
  *   **Phrasing:** "You claim to rule out dictatorship. But if the calibration lottery is defined by a specific individual's reference points, doesn't that individual become a 'scale dictator'?"
  *   **2-Minute Reply:** "The reference prospects are public and anonymous (e.g., 'the best outcome available in the society'). No single individual dictates the anchor. The axiom requires *all* individuals to agree on the ranking of the anchor."
  *   **Soft Spot:** If "best outcome" is subjective, the person with the most extreme definition dominates. See Objection 1.
  *   **Verdict:** **INCONVENIENT.** Clarify the public nature of the anchor.

  ### 10. Dynamic Consistency (Inconvenient)
  *   **Subgroup:** Axiomatizers
  *   **Phrasing:** "If the calibration lottery changes over time as the 'best/worst' prospects shift, does your SWF satisfy dynamic consistency?"
  *   **2-Minute Reply:** "The calibration is relative to the feasible set at the time of judgment. Like a price index, it updates. This may violate intertemporal consistency, but that is a feature of using relative scales, not a bug."
  *   **Soft Spot:** Economists hate violating dynamic consistency. Be prepared to defend why it's acceptable here.
  *   **Verdict:** **INCONVENIENT.** Niche technical point.

  ## IV. STRATEGIC FLAGS

  ### The Question You Hope Nobody Asks
  **"What if individuals have different subjective beliefs about the calibration lottery?"**
  *   **Why:** This is Objection 1. If they press this hard, you must admit the framework assumes **Common Priors** over the reference prospects. If you admit this, the Axiomatizers will note that assuming Common Priors is a massive assumption that does much of the heavy lifting, potentially more than the utility calibration.
  *   **Defense:** "The theorem is formulated in a VNM environment with objective risk. Extending to Savagean subjective probability is a separate project. For social choice under risk, common priors on the anchor are a standard idealization."

  ### Objections You Are Braced For But They Won't Raise
  *   **Savagean Foundations:** You noted the audience isn't interested. Do not bring up subjective states unless forced.
  *   **Metaethics:** You noted they don't care. Do not defend the *truth* of utilitarianism, only the *structure* of the theorem.
  *   **Sen's "Positional Objectivity":** While Sen is cited, the specific workshop crowd is more technical. They will focus on the *axioms*, not the philosophical implications of positionality. Don't over-prepare a philosophical defense of Sen; prepare a technical acknowledgment.

  ## V. SELF-ASSESSMENT OF THIS SHEET

  **Confidence in Ordering:** High. The belief heterogeneity issue (Obj 1) is the standard technical killer for interpersonal comparison mechanisms in VNM frameworks. The "Moved Load" (Obj 2) is the standard philosophical killer.
  **Confidence in Fatal/Inconvenient Verdicts:** High. If the calibration lottery is ill-defined (Obj 1), the math breaks. If the class is vacuous (Obj 3), the theorem is useless. These are fatal. The rest are "costs of doing business."
  **Confidence in Attributions (Sen/Weymark/Prioritarian):**
  *   **Weymark:** I am **85% confident**. Weymark's central point is that Harsanyi requires CUC to get Utilitarianism. Your thesis aligns with this. The objection phrased above assumes Weymark might view your "calibration" as just a restatement of CUC. This is accurate to his structural critique.
  *   **Sen:** I am **90% confident**. Sen's critique is that Harsanyi conflates moral and personal preferences. The objection above frames this as "preferences don't yield ethics." This is the core of Sen's "Plural Utility" and "Interpersonal Aggregation" work.
  *   **Prioritarian:** I am **75% confident**. This is the riskiest attribution. "Prioritarianism" (Parfit/Otsuka/Voorhoeve) is a specific view about weighting well-being. Some prioritarians accept Harsanyi's veil but interpret it differently. The objection assumes the Prioritarian in the room cares about the *risk/equity distinction*. This is standard in the literature (e.g., Voorhoeve & Otsuka 2008), but if the specific attendee is a "Harsanyi-style Prioritarian," they might not raise this.
  *   **Least Sure Claim:** The reply to **Objection 4 (Prioritarian Risk/Equity)**. Distinguishing between the "calibration of the unit" and the "curvature of the aggregation" is technically possible but subtle. If your calibration lottery *itself* involves risk (e.g., a 50/50 chance of best/worst), and individuals are risk-averse, the "unit" of utility already contains curvature. A Prioritarian might argue you cannot separate the *measurement* of utility from the *attitude toward risk* in a VNM framework. If they press that **VNM utility *is* risk attitude**, your claim that you are just "fixing the scale" without "fixing the curvature" becomes very hard to defend mathematically. **Watch this space.** If they ask about the curvature of the utility function vs. the social weighting function, tread carefully.
