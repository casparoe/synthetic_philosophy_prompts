      *   *This is the most honest implementation.* It admits the simulation is mental.
      *   *Wait, if I score it assuming they chose the same, then DC and CD are impossible.*
      *   *Yes! That IS superrationality.* In the superrational model, DC and CD are logically impossible outcomes because the agents are identical.
      *   *So:* Round 2 Payoff Table only has CC and DD rows.
      *   *Instruction:* "Write C or D. We will assume your partner wrote the same thing. If you write C, you get the CC payoff. If you write D, you get the DD payoff."
      *   *This removes the temptation to free-ride (DC).*
      *   *This perfectly models the math.*
      *   *Does it feel like a game?* Yes, because they still *want* to defect to get the DD payoff if they think everyone else will cooperate (wait, no).
      *   *If the rule is "We assume they match you," then choosing D gives DD. Choosing C gives CC.*
      *   *Since CC > DD, rational agents choose C.*
      *   *This works.* It forces the logic.
      *   *But will they feel the tension?* The tension comes from doubting the premise. "Do I trust the referee? Do I trust the premise?"
      *   *Okay, let's refine:* Don't remove the DC/CD possibility on the sheet, but instruct them that *logically* those boxes are empty.
      *   *Better:* Just tell them: "For this round, your payoff is determined by matching. If you Cooperate, we assume they Cooperate. If you Defect, we assume they Defect."
      *   *This is the cleanest translation of the math to a party game.*

  6.  **Addressing the "What could go wrong" (Risk Management):**
      *   *Risk 1:* Everyone defects in Round 2 anyway because they don't buy the premise.
      *   *Risk 2:* Everyone cooperates in Round 1 anyway (too nice a group).
      *   *Risk 3:* They feel tricked.
      *   *Mitigation:* Emphasize the "Thought Experiment" aspect. Make the points matter (leaderboard).

  7.  **Structuring the Debrief:**
      *   Connect Round 1 to Causal Decision Theory (CDT).
      *   Connect Round 2 to Evidential/Timeless Decision Theory (TDT/EDT).
