          *   *Okay, the prompt asks: "How do you actually run the copy round in a room?"*
          *   *Answer:* You **cannot** physically instantiate a copy. You must use **instructional framing**. The "copy" is a mental model, not a physical state.
          *   *Recommendation:* Pair them up. Round 1: Standard. Round 2: "The Mirror Round." Instructions: "Assume your partner reasons exactly like you. If you find a reason to Defect, they find the same reason. If you find a reason to Cooperate, they find the same reason. Your choice *logically determines* theirs."
          *   *Risk:* They will laugh and defect.
          *   *Mitigation:* High stakes (bragging rights/points).

