  *— Sceptic in Soho*

  **Dear Sceptic,**
  It is not a utility function; it is the shape of time. To ask why log is to ask why gravity pulls down. Anyone reaching for an expected value has simply failed to find the repetition. Trust the geometry. The universe does not care about your linear preferences. We are merely measuring the slope of existence.
  *— Dr. Ergo*

  What I am satirising (about 200 words)
  The piece targets the metaphysical stretch required to make ergodicity economics universally prescriptive. The real vulnerability is the Reappearance Rule: claiming every one-off decision is actually repeated across heirs or multiverse branches functions as a motte-and-bailey defence. It allows proponents to claim the rigour of physics while dodging the reality of finite lives. Defenders would argue that structural similarity is sufficient for repetition and that survival is the prerequisite for all other values. They insist that without avoiding ruin, no other utility matters. I suggest this conflates mathematical necessity with ethical priority, turning a risk management tool into a moral absolutism that ignores specific human contexts. By treating the growth rate as the sole objective, the theory dismisses the value of specific outcomes, such as housing or culture, unless they contribute to the infinite horizon. The satire highlights how a theory designed to protect agents from ruin can itself become ruinous to their actual lives by demanding they live for the trajectory rather than the moment.

  Where I have taken liberties (about 180 words)
  I exaggerated the Treasury's adoption of the Time-Average Standard to establish the column's authority and imply state-enforced ergodicity. I also leaned on a contested reading where ergodicity economists completely deny utility theory, whereas many simply derive it from growth dynamics rather than rejecting it outright. One point deliberately left out is the distinction between consumption and investment; Dr. Ergo treats all wealth as compounding capital, ignoring that humans must eat. Including consumption would weaken the joke, as it necessitates a discount rate that breaks the infinite horizon assumption required for the satire to hold. Furthermore, I ignored the practical difficulties of calculating geometric means in real-time markets. The column presents the Kelly fraction as easily knowable, whereas in practice, edge estimation is the primary source of error. This simplification allows the focus to remain on the philosophical absurdity of the Reappearance Rule rather than the technical challenges of implementation.
