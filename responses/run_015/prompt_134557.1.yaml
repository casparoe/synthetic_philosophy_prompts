answer: |-
  # Teaching Plan: Ontological Foundations of Lewisian Modal Realism
  **Session Duration:** 75 Minutes
  **Target Audience:** Advanced Undergraduates (Quinean/semantics background; no prior Lewis)

  ## I. Mandatory Omissions (Scope Boundaries)
  *To prevent conceptual overload and category errors, the following doctrines must be explicitly withheld until subsequent sessions.*

  1.  **Counterpart Theory:**
      *   *Justification:* Introducing trans-world identity criteria now conflates the ontology of *worlds* with the ontology of *individuals*. Students must grasp that worlds are concrete before grappling with how individuals relate across them. Premature introduction invites the "modal parts" error.
  2.  **Modal Parts (Worm Theory/Stage Theory):**
      *   *Justification:* Suggesting an individual is partly present in multiple worlds undermines the "Isolation" constraint. It implies a unity that contradicts spatiotemporal disjointness.
  3.  **Ontology of Properties/Relations Across Worlds:**
      *   *Justification:* Questions regarding natural properties or cross-world similarity metrics presuppose the existence of the relata (the worlds). This is secondary to establishing the reality of the relata.
  4.  **Analysis of Counterfactuals:**
      *   *Justification:* This is the *application* of the theory, not the *metaphysical foundation*. Focusing on truth-conditions distracts from the ontological commitment required to make those conditions non-vacuous.

  ---

  ## II. The Carrying Example: "Alice's Divergent Path"
  *A single scenario to be maintained throughout the session to test conceptual stability.*

  **Scenario:** Alice, a philosopher in our world ($W_@$), reflects on the proposition: "I could have been a lawyer."

  **Required Features:**
  1.  **Causal Closure:** The "Lawyer-Alice" scenario must be described as a causally closed system. Events in that scenario explain each other without reference to $W_@$.
  2.  **Qualitative Similarity, Numerical Distinctness:** The example must emphasize that the lawyer in the other scenario is *qualitatively* similar to Alice (same origin, same memories up to the divergence point) but must not be identified *as* Alice.
  3.  **Representational Contrast:** The example must allow for two descriptions:
      *   (A) A set of propositions describing a lawyer-Alice (Ersatz).
      *   (B) A flesh-and-blood person living a life in a concrete universe (Lewisian).
  4.  **Deliberate Lack of Trans-World Identity:** The narrative must never imply Alice "went" there or "split." There is no shared substance.
  5.  **Deliberate Lack of Epistemic Access:** Alice in $W_@$ cannot observe, signal, or verify the existence of Lawyer-Alice through empirical means.

  ---

  ## III. Conceptual Dependency Sequence
  *The order of introduction is strict. Later concepts collapse without the prior establishment of earlier ones.*

  ### Phase 1: Concreteness (Minutes 0–20)
  **Dependency:** Must establish that possible worlds are of the same ontological category as the actual world before discussing their separation.
  **Instructional Move:**
  1.  Invoke Quinean "What is there?" criterion. If we quantify over possible worlds in semantics, are they abstract sets or concrete universes?
  2.  Use **Alice's Divergent Path**. Contrast the *description* of Lawyer-Alice (abstract, truth-bearing) with the *existence* of Lawyer-Alice (concrete, flesh-and-blood).
  3.  **Constraint:** Assert that for Lewis, the "possibility" is not a description *of* our world, but a concrete universe *alongside* our world.
  4.  **Goal:** Students must accept that $W_{lawyer}$ is made of the same "stuff" as $W_@$ (spacetime, matter, energy) to proceed.

  ### Phase 2: Spatiotemporal Isolation (Minutes 20–40)
  **Dependency:** Concreteness must be secured before explaining why we don't perceive other concrete worlds.
  **Instructional Move:**
  1.  Problem: If $W_{lawyer}$ is concrete, why is it not here?
  2.  Define "World" as a maximal spatiotemporally connected sum of individuals.
  3.  Apply to **Alice**: Alice ($W_@$) and Lawyer-Alice ($W_{lawyer}$) share no spatiotemporal distance. There is no "north" or "future" where Lawyer-Alice resides. They are *causally isolated*.
  4.  **Constraint:** Do not invoke magical barriers. Isolation is definitional: if they were connected, they would be one world.
  5.  **Goal:** Students must understand that "possible" does not mean "hidden part of this universe," but "disconnected concrete universe."

  ### Phase 3: Indexical Actuality (Minutes 40–60)
  **Dependency:** Concreteness and Isolation must be secured before explaining why we call *our* world "actual" without privileging it ontologically.
  **Instructional Move:**
  1.  Problem: If $W_{lawyer}$ is just as concrete as $W_@$, why is $W_@$ the "actual" one?
  2.  Define "Actual" as an indexical term (like "here," "now," "I").
  3.  Apply to **Alice**: When Alice says "I am actual," she means "I am in *this* world." When Lawyer-Alice says "I am actual," she means "I am in *that* world."
  4.  **Constraint:** Do not suggest "actual" means "real." Both are real; only one is *here*.
  5.  **Goal:** Students must grasp that "actual" picks out a relation between a speaker and a world, not an intrinsic property of the world itself.

  ---

  ## IV. Misconception Defusal Map
  *Specific intervention points to prevent category errors.*

  | Misconception | Defusal Point | Strategy |
  | :--- | :--- | :--- |
  | **1. Modal Realism is Everettian Physics** | **During Phase 1 (Concreteness)** | **Distinction:** Everettian branches are parts of a single quantum state within *one* spacetime manifold. Lewisian worlds are distinct spacetime manifolds. <br>**Intervention:** Explicitly state: "This is not a hypothesis about quantum mechanics. It is a metaphysical thesis about the quantifier domain. Physics describes *this* world; modal realism describes the plurality of worlds." |
  | **2. Actuality is an Intrinsic Property** | **During Phase 3 (Indexicality)** | **Distinction:** Intrinsic properties (mass, shape) travel with the object. Indexical properties (here, actual) depend on the speaker's location. <br>**Intervention:** Ask: "If you teleport to $W_{lawyer}$, does $W_{lawyer}$ become actual?" (Answer: Yes, for you, because 'actual' tracks 'here'). "Did $W_{lawyer}$ change intrinsically?" (Answer: No). This proves 'actual' is not intrinsic. |
  | **3. Concrete Worlds are Causally Accessible** | **During Phase 2 (Isolation)** | **Distinction:** Concrete does not imply accessible (cf. regions of the universe beyond our light cone, but stronger). <br>**Intervention:** Reinforce the definition of "Spatiotemporal." If there is no path through spacetime connecting Alice and Lawyer-Alice, there is no causal access. "Concrete" means 'made of spacetime,' not 'reachable from here.' |

  ---

  ## V. Diagnostic Closing Question
  *To be administered in the final 15 minutes. This question is designed to fail students who rely on slogans ("Actual is indexical!") without understanding the ontological implications.*

  **Question:**
  "Consider an inhabitant, Bob, residing in $W_{lawyer}$. Bob asserts: 'Only my world exists; all other worlds are merely fictional stories.'
  From our perspective in $W_@$, Bob's claim that other worlds are 'fictional' is false (because they are concrete). However, is Bob's claim that 'Only my world is actual' **true** or **false**?

  Explain your answer by distinguishing between the **ontological status** of $W_{lawyer}$ relative to $W_@$ and the **semantic reference** of the word 'actual' when used by Bob versus when used by us. Do not use the word 'indexical' in your explanation."

  **Grading Criteria for Comprehension:**
  *   **Slogan Repetition (Fail):** "It is true because actual is indexical." (Does not explain *why* indexicality permits this truth value).
  *   **Category Error (Fail):** "It is false because both worlds are actual." (Misses the point that 'actual' functions as a demonstrative).
  *   **Genuine Comprehension (Pass):** The student must articulate that Bob's statement is **true** *relative to Bob's context* because 'actual' functions as a demonstrative picking out the speaker's immediate environment. However, this truth does not negate the **ontological parity** of $W_@$. The student must show that "actual" does not mean "ontologically privileged" but rather "contextually selected." If they understand that Bob is right *semantically* but would be wrong *ontologically* if he meant "Only my world is real," they grasp the distinction.
