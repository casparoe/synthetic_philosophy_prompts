          *   *Assessment:* This is the standard operational definition (Ramsey/de Finetti). It's mostly correct, though it simplifies the buy/sell condition (usually it's buying *or* selling, or setting a price where you are indifferent). It's acceptable for an upper-level summary.

      *   *Claim 2:* "The Dutch book theorem, proved by de Finetti in the 1930s and anticipated by Ramsey, states that an agent's credences violate the probability axioms if and only if a bookie can offer her a finite set of bets, each individually acceptable at her stated prices, whose net payoff is a loss in every possible world..."
          *   *Assessment:* Accurate statement of the theorem (Ramsey-de Finetti theorem). Mentions "if and only if" (coherence = probabilism). Mentions "finite set" (important distinction).

