answer: |-
  In a communal pottery workshop struggling to replicate a lost azure glaze, two master artisans propose competing methods to govern the firing process. Mara's programme asserts the hard core that color stability is purely a function of oxygen levels; she risks a bold, counter-intuitive prediction that starving the kiln of oxygen at peak heat will produce a flawless azure, and upon testing, the kiln yields the first perfect batch in decades. Conversely, Jon's programme holds the hard core that the glaze requires the potter's meditative focus; when his batches crack or discolor, he preserves this core by appending auxiliary claims to his protective belt—blaming the humidity, then the clay source, then the time of day—never anticipating a successful firing in advance but only rationalizing failures after they occur.

  Under Lakatos's criteria, Mara's programme is classified as progressive because it retains its hard core (chemical determinism) while adjusting its protective belt (oxygen timing) to generate a novel fact: the successful creation of the azure glaze through oxygen starvation, a result not previously observed or expected by tradition. Jon's programme is classified as degenerating because, while it also protects its hard core (meditative causation), its protective belt adjustments (humidity, clay, time) are purely ad hoc; they are introduced only after failures to immunize the core from refutation, without ever yielding a new, successful prediction. The specific novel fact separating them is the empirical success of the oxygen-starvation technique, which Mara anticipated and Jon's framework could only explain away as irrelevant once it happened.

  The structural feature carrying the weight of this distinction is the temporal direction of the auxiliary hypothesis relative to the evidence—specifically, the capacity to predict novel facts versus the capacity to merely accommodate known ones. If you remove this feature and treat post-hoc accommodation as equal to prior prediction, the distinction between a growing body of knowledge and a static dogma collapses; both programmes would appear equally valid since both can technically "explain" any outcome given enough belt adjustments. An advocate of Jon's degenerating programme could reply that their adjustments are not ad hoc defensive maneuvers but reasonable refinements within a positive heuristic, arguing that "meditative focus" is a complex variable that naturally requires elaboration as one encounters new environmental interactions, and that identifying humidity or clay as interfering factors represents a deepening understanding of how focus interacts with the physical world rather than a desperate patch to save a falsified theory.
