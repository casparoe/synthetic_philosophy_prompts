      *   *Check:* Is the distinction between prediction convergence and hypothesis ranking clear? This is crucial. SI predicts well eventually, but doesn't necessarily rank current finite hypotheses consistently across UTMs.
      *   *Check:* Did I avoid citations? Yes.
      *   *Check:* Is the argument self-contained? I need to briefly define the prior without assuming too much, but the prompt says I can assume basic setup. I will keep definitions tight.

  5.  **Final Polish:**
      *   Strengthen the "tipping point" example.
      *   Clarify the distinction between asymptotic convergence (where U doesn't matter much) and finite sample inference (where U matters a lot).
      *   Ensure the conclusion lands on the "machine-relative feature" vs "normative principle" distinction.

  6.  (Mental Outline of the text to be generated)
      *   Intro: The seductive slogan vs. the technical reality.
      *   The Mechanism: Prefix machines and the definition of the prior.
      *   The Invariance Illusion: Additive constants vs. Multiplicative probabilities.
      *   The Regime of Ambiguity: Why asymptotic convergence doesn't save the normative claim.
      *   The Nature of "Simplicity": Encoding density vs. ontological parsimony.
      *   Conclusion: SI as a consistency constraint for a specific reasoner, not a universal law.

