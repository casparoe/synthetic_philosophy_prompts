          *   This sum is dominated by the shortest program, but the "noise" of longer programs depends on $U$.
          *   This reinforces that the "simplicity" is about the density of descriptions in the language, not the ontological simplicity of the hypothesis.

      *   **Normative Implications for Bounded Agents:**
