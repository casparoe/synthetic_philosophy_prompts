          *   *Side B (Mechanism/Homology):* Reviewers demand conserved circuits and molecular details for mechanistic claims. Behavioral match alone isn't enough. This looks like Identity Theory or Mechanism-Constitutive views.
          *   *Side C (Exclusions):* Organoids/simulations aren't treated as having mental states. Fish/insect "beliefs" are doubted.
      *   **The Task:** Reconstruct the *implicit philosophy of mind* governing this practice.
      *   **Specific Questions:**
