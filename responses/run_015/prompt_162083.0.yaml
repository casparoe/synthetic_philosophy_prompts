answer: |-
  This is a sophisticated dissection of the normative architecture underlying neuroscience policy. You have identified a tension that is rarely articulated: the gap between the *ethical attribution* of mental states (for severity classification) and the *epistemic validation* of mental states (for translational relevance).

  Here is a reconstruction of the implicit philosophy, an evaluation of your proposed "Homology Rule," and a mapping of the alternatives, followed by an epistemic status report.

  ### 1. Reconstructing the Implicit Philosophy: Regulatory Dualism

  Your intuition that the practice looks Functionalist is correct regarding **severity**, but incorrect regarding **validity**. The system is not operating on a single metaphysics of mind. It is operating on a **Pragmatic Dualism** that splits the concept of "mental state" into two regulatory distinct categories:

  1.  **Moral Patienthood (Severity):** Here, the practice employs a **Behavioral Functionalism** (or arguably, a "Cambridge Property" view). If a system exhibits the causal role of pain (nociception, avoidance, facial coding, trade-offs with other motivations), it is treated *as if* it is in pain for the purpose of regulation.
      *   *Philosophical Commitment:* Weak Multiple Realizability. The substrate does not matter for *moral protection*; the functional profile suffices to trigger the precautionary principle.
      *   *Why:* The cost of a false negative (failing to protect a sentient being) is ethically catastrophic.
  2.  **Translational Validity (Mechanism):** Here, the practice employs a **Realizer Functionalism** or a soft **Identity Theory**. A "depression model" in a mouse is not evidentially equivalent to human depression unless the *realizing physical state* (the circuit, the molecular pathway) is conserved.
      *   *Philosophical Commitment:* Mechanism-Constitutive Individuation. The identity of the state depends partly on *how* it is implemented, not just *what* it does.
      *   *Why:* The cost of a false positive (assuming a drug works because behavior matches, when mechanisms differ) is financially and scientifically catastrophic (the "valley of death" in drug development).

  **Is this inconsistent?**
  Metaphysically, yes, if one assumes "pain" refers to a single natural kind. Pragmatically, no. The institution is not trying to solve the Mind-Body Problem; it is managing two different risk profiles.
  *   **Severity Side:** Risk = Suffering. Mitigation = Over-attribution of mind based on behavior.
  *   **Mechanism Side:** Risk = Failed Translation. Mitigation = Under-attribution of equivalence based on behavior alone.

  **Does the severity side pull against the mechanism side?**
  Yes. The severity side says, "The mouse's grimace is enough to prove suffering." The mechanism side says, "The mouse's grimace is not enough to prove *human-relevant* depression."
  *   **Unified Theory?** The only theory that unifies them is **Pragmatic Instrumentalism**. The institution treats mental state attributions not as truth-claims about ontology, but as tools for specific regulatory ends. "Pain" in the IACUC protocol is a different operational variable than "Pain" in the grant mechanism aim, even if they share a label.

  ### 2. Evaluating the "Homology Rule"

  You propose: *A finding counts as evidence about human psychology only if the mechanism is identified and shown to be homologous.*

  **Is this an application of the practice's logic or a betrayal?**
  It is a **radicalization of the validity side** and a **betrayal of the welfare side.**

  *   **Application:** It aligns perfectly with the mechanism-hunting impulse. It admits that current behavioral neuroscience is often "black box" modeling, which fails if the boxes are built differently. It forces the system to admit that behavioral homology without structural homology is merely analogy, not identity.
  *   **Betrayal:** It undermines the severity framework. If mental states are individuated by their neural mechanisms (Identity Theory), then you cannot justify a severity band for a rat based on facial coding alone. You would need to verify the rat has the *human* pain circuit. Since we cannot do that without invasive procedures (which increase severity), the rule creates a paradox.

  **Consequences of the Homology Rule:**
  1.  **Collapse of the Pipeline:** Most current behavioral models (learned helplessness, forced swim test) would lose evidential weight immediately, as their homology to human psychiatric conditions is disputed.
  2.  **The Organoid Trap:** As you noted, this pushes toward human-based systems (organoids, microphysiological systems). If the rule is "Human Psychology requires Human Mechanisms," then a human neuronal organoid becomes the *only* valid model.
  3.  **The Ethical Cliff:** Once you move to human organoids, the **Welfare Functionalism** of the severity side kicks back in. If you require human hardware for validity, you must confront whether that human hardware supports moral status. The current system avoids this by keeping the "mind" in the mouse (where we accept behavioral proxies for welfare) and the "human benefit" abstract. The Homology Rule forces the "human mind" into the dish, at which point the institution must decide if the dish is a subject or an object.

  **Verdict:** The Homology Rule is what an **Identity Theorist** wants. Adopting it forces the institution to abandon its pragmatic ambiguity and choose a metaphysics. It is a betrayal of the *current equilibrium*, which relies on that ambiguity to function.

  ### 3. What Would Change Under Alternatives?

  #### Scenario A: Strict Identity Theory (Type-Physicalism)
  *Thesis: Mental State M = Neural State N. If N is not conserved, M is not present.*

  *   **Stop Doing:**
      *   Assigning human-equivalent severity bands to rodents based solely on behavior. (A mouse cannot feel "human anxiety" if it lacks the human anterior cingulate architecture).
      *   Using behavioral proxies for welfare without neural confirmation.
      *   Assuming cross-species translatability of psychiatric conditions without circuit-level homology.
  *   **Start Doing:**
      *   Treating human-derived organoids with extreme ethical caution (potentially equal to human subjects if the neural hardware is sufficiently complex).
      *   Abandoning invertebrate models for anything other than basic cellular biology (no "fly memory" or "worm learning" as psychological models).
      *   Shifting funding heavily toward computational modeling and human in-vitro systems.

  #### Scenario B: Strict Functionalism (Multiple Realizability All the Way Down)
  *Thesis: Mental State M = Causal Role C. Substrate is irrelevant.*

  *   **Start Doing:**
      *   Granting moral status to insects, cephalopods, and potentially advanced AI if they exhibit the functional profile of pain/agency.
      *   Accepting behavioral equivalence in rodents as sufficient evidence for human efficacy (if the input-output profile matches, the mental state is the same, regardless of circuit).
      *   Treating organoids and simulations as potential moral patients immediately upon exhibiting functional complexity, regardless of biological substrate.
  *   **Stop Doing:**
      *   Privileging mammalian models over non-mammalian models based on phylogeny alone.
      *   Demanding molecular homology for translational claims (if the function is the same, the drug should work, or the model is invalid for other reasons).

  #### Scenario C: Underdetermined Practices (Compatible with All Views)
  These parts of your current practice do not reveal a philosophical commitment because they are methodological, not metaphysical:
  *   **The 3Rs (Replacement, Reduction, Refinement):** An Identity Theorist supports this to save human-relevant hardware; a Functionalist supports it to save moral patients.
  *   **Randomization and Blinding:** Required for statistical validity regardless of what the variables *mean*.
  *   **Analgesia Administration:** Both views agree that if there is a *probability* of pain, one should mitigate it (Identity Theorist: to protect the hardware; Functionalist: to protect the experience).
  *   **Prospective Review:** The act of review itself is neutral; only the *criteria* of review reveal the philosophy.

  ### 4. Epistemic Status: Consensus vs. Contention

  Here I distinguish between philosophical consensus, contested theory, and empirical unknowns.

  **Settled / Near-Unanimous Consensus:**
  *   **Multiple Realizability (MR) is Coherent:** It is widely accepted in philosophy of mind that MR is logically possible and poses a significant problem for strict Type-Identity Theory. (Putnam, Fodor).
  *   **The Hard Problem Remains:** There is no consensus on how physical processes generate subjective experience (qualia). Therefore, *any* policy attributing "pain" or "anxiety" to non-verbal organisms is necessarily inferential, not observational.
  *   **Homology vs. Analogy:** It is settled that behavioral similarity without structural homology is analogy, not identity. The dispute is whether analogy is *sufficient* for the policy goals.

  **Contested / Disputed:**
  *   **Does Animal Behavior Confirm Functionalism?** [My Analysis]: Some philosophers argue that the success of cross-species psychology supports Functionalism. Others argue it merely supports the conservation of basic affective systems (Panksepp's view), not higher cognition. There is no consensus that rodent behavior proves MR of *human* mental states.
  *   **The Status of Homology:** Is homology a metaphysical constraint (the state *is* the circuit) or an evidential constraint (the circuit is the best *proof* of the state)? [My View]: Your institution treats it as evidential for grants but metaphysical for welfare. This is the source of the friction.
  *   **Organoid Consciousness:** There is zero consensus. Some argue organoids lack the architecture for integration (Global Workspace); others argue we cannot rule it out.

  **Empirical Bottom-Outs (Where Philosophy Stops):**
  *   **Neural Conservation:** We do not know the exact degree of conservation between rodent and human affective circuits. (e.g., Is the rodent homolog of the human subgenual cingulate functionally equivalent?) This is an empirical neuroscience question, not a philosophical one.
  *   **Necessary and Sufficient Conditions for Consciousness:** We do not have a validated Neural Correlate of Consciousness (NCC). Without this, we cannot empirically settle the Identity vs. Functionalist debate in policy.
  *   **Predictive Validity:** We do not know the statistical failure rate of drugs that pass behavioral tests but fail mechanistic homology checks, versus those that pass both. (Though the high failure rate in CNS drug trials suggests behavioral matching is insufficient).

  ### Summary Recommendation

  Your institution is currently running on **Pragmatic Dualism**: Functionalist enough to protect animals, Reductionist enough to demand mechanistic rigor for human claims.

  *   **The Homology Rule** forces a choice. It aligns with the scientific rigor side but breaks the ethical framework. If you adopt it, you must simultaneously upgrade the ethical status of human-derived models (organoids) because you are admitting they are the only things that truly model human minds.
  *   **The Inconsistency** you feel is real, but it is a feature, not a bug. It allows the system to function without resolving the Mind-Body problem.
  *   **My View:** [Analytical Conclusion] The Homology Rule is philosophically more honest but practically disruptive. It exposes the hidden metaphysical debt the system owes. If you implement it, you must prepare for the ethical consequences of creating "human mind" models in vitro. The current system keeps the "mind" in the animal (where we have welfare laws) and the "human" in the abstraction (where we have no laws). The Homology Rule brings the "human" into the lab bench, and the regulations are not ready for that.
