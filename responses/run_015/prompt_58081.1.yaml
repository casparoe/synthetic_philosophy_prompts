answer: |-
  You two hit on one of the oldest deadlocks in political philosophy. It's not just you; philosophers have been arguing about this baseline problem for centuries. The reason neither of you is budging is that you are starting from two different axioms about what ownership actually is.

  Here is the breakdown of the baseline issue, an analysis of your three examples, and why the distinction matters for the taxation debate.

  ### The Baseline Problem: Ownership-First vs. Rule-First

  The core disagreement is about when property rights begin.

  **Your Friend's View (Ownership-First):**
  He believes property rights are "pre-political." This means you own yourself and your labor naturally, before any government exists. Therefore, any taking without your specific consent is a violation of that natural right. To him, the law doesn't create ownership; it just protects it. If the law violates it, the law is wrong.
  *   **The Logic:** Me -> My Labor -> My Money -> State Takes It (Theft).

  **Your View (Rule-First):**
  You are arguing that property rights are "legal constructs." Ownership is defined by the rules of the society you live in. If the rules say 20% of income belongs to the collective for infrastructure, then you never owned that 20% to begin with.
  *   **The Logic:** Society Rules -> Define Ownership -> You Keep What's Left -> State Takes Its Share (Not Theft).

  **Why he called you circular:**
  When you said, "It's not stealing because the rules say taxes are okay," he heard: "It's not illegal because the law says it's legal." That is circular. He wants a moral reason why the rules are justified, not just a legal one.

  ### Analyzing the Three Cases

  Here is how those examples break down across commonsense, legal, and moral frameworks.

  #### 1. The Mugger (Friend's Example)
  *Scenario:* A stranger takes $100 at gunpoint, buys you a $20 sandwich, and leaves.
  *   **Legal Sense:** Definitely theft and assault. The benefit (sandwich) is irrelevant to the crime.
  *   **Commonsense:** Theft. No one asked for the transaction.
  *   **Moral Sense:** Violation of autonomy. You were treated as a means to an end, not a person with choices.
  *   **Verdict:** **Theft.**
  *   **Relevance to Tax:** Your friend uses this to say the state is an illegitimate actor. The problem with this analogy is that a mugger offers no ongoing protection or framework for you to earn the $100 in the first place.

  #### 2. The Apartment Building (Your Example 1)
  *Scenario:* You move into an apartment. You know rent includes upkeep. You don't sign a separate upkeep contract, but you sign a lease.
  *   **Legal Sense:** Not theft. It is a contractual obligation. Occupancy implies acceptance of the terms.
  *   **Commonsense:** Not theft. You knew the price of admission.
  *   **Moral Sense:** Consensual. You had the option to live elsewhere.
  *   **Verdict:** **Not Theft.**
  *   **Relevance to Tax:** This is the "Social Contract" argument. You live in the country, you benefit from the roads/courts/military, so you pay the "rent" (tax). The weakness here is that unlike an apartment, you can't easily "move out" of your country (citizenship is harder to quit than a lease).

  #### 3. The Desert Pond (Your Example 2)
  *Scenario:* A guy fences off the only water source in a desert and charges $5 to drink.
  *   **Legal Sense:** Complicated. If he owns the land, legally he might be allowed to fence it. However, many legal systems have exceptions for "necessity" or eminent domain.
  *   **Commonsense:** Feels like extortion. Even if legal, it feels wrong because there is no alternative.
  *   **Moral Sense:** Coercive. Consent isn't real if the alternative is death.
  *   **Verdict:** **Morally Theft/Extortion (Legally Dependent).**
  *   **Relevance to Tax:** This highlights the monopoly problem. The government is the only provider of "security" and "law." If you can't opt out, is your consent real? This is where your friend's argument gains strength.

  ### Where Taxation Fits

  Taxation sits somewhere between the **Apartment** and the **Desert Pond**.

  *   **It's like the Apartment** because you generally know the tax laws before you earn the money, and you receive services (roads, schools, defense) in return. If you view citizenship as a voluntary association, this isn't theft.
  *   **It's like the Desert Pond** because the government has a monopoly on force. You cannot easily opt out of the system without going to great cost (emigrating), and you cannot negotiate the rate.

  ### How to Fix the "Circular" Argument

  To stop your friend from dismissing your point as circular, you need to shift from "It's legal so it's right" to "Ownership requires a system to exist."

  Try saying this:
  *"You're saying taxation is theft because I owned the money before the taxman arrived. But I can't own that money without the system the taxman protects. Without courts to enforce contracts, police to stop thieves, and a currency the state stabilizes, that money is just paper or digital numbers with no value. So, the 'ownership' of the money is created by the same system that taxes it. You can't use the system to claim ownership while denying the system's right to sustain itself."*

  ### The Bottom Line

  *   **Your Friend** is arguing from **Natural Rights**. (Morality comes before laws.)
  *   **You** are arguing from **Legal Positivism**. (Morality regarding property is defined by laws.)

  Neither of you is wrong; you just disagree on the source of authority.
  *   If you believe rights exist before governments, he wins (Taxation is theft).
  *   If you believe rights are granted/protected by governments, you win (Taxation is dues).

  In commonsense terms, most people land in the middle: It's not theft if the government is democratic and the money is used for public goods (Apartment), but it becomes theft-like if the government is corrupt or confiscatory (Desert Pond/Mugger).

  Tell him to stop looking at the taking and start looking at what makes the money valuable in the first place. That might get you out of the weeds.
