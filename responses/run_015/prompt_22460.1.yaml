answer: |-
  **TO:** Data Platform Council
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Resolution of "Active User" Definition Discrepancy

  ### Executive Summary

  The Data Platform Council is asked to vote on a recommendation to **deprecate the standalone metric "Active Users"** and replace it with two distinct, named metrics: **Monthly Logged-In Users (MLIU)** and **Monthly Core Active Users (MCAU)**.

  This decision resolves the current reporting conflict between Growth and Product. It acknowledges that both teams are measuring real phenomena correctly but are using a single label to answer two different business questions. This memo outlines the reasoning, validates the strategic value of the Growth team's perspective, and proposes an implementation plan to align executive reporting.

  ### Context & Root Cause Analysis

  For the past two months, executive reporting has featured conflicting "Active User" numbers.
  *   **Growth Team:** Defines Active User as *any login within 30 days.*
  *   **Product Team:** Defines Active User as *any core action (e.g., comment posted) within 30 days.*

  Our investigation confirms there is **no factual disagreement** regarding the underlying data. Both teams agree on who logged in and who posted. The conflict is purely semantic: we have allowed one label ("Active User") to perform two incompatible jobs.

  "Active" is a state of being, but in SaaS, it can mean "Present" (Growth) or "Valuable" (Product). Until we distinguish these, executive trust in our data platform will continue to erode.

  ### Steelman: The Case for a Single Definition (Growth Model)

  Before proposing a split, we must rigorously consider the alternative: selecting one definition as the canonical "Active User" to preserve executive simplicity. The strongest case exists for adopting the **Growth Team's definition (Login = Active)** as the single source of truth.

  **1. Cognitive Load & Simplicity:**
  Executives operate best with a single north-star metric for health. Maintaining two metrics introduces complexity and requires narrative explanation every quarter. A single metric reduces friction in board decks and all-hands meetings.

  **2. Alignment with Acquisition & Funnel Health:**
  From a Growth perspective, a login *is* a success. It represents a successful reactivation, a marketing win, or a habit formation. If we declare a user "inactive" because they logged in but didn't post, we risk devaluing the work of the Growth team. They optimize for frictionless entry; if the definition of "Active" requires high effort (posting), it disincentivizes lowering barriers to entry, which is crucial for top-of-funnel expansion.

  **3. Leading Indicator vs. Lagging Indicator:**
  Logins often precede core actions. A user may log in three times before feeling comfortable enough to post. By counting only posters, we may be lagging in detecting a resurgence in traffic. The Growth definition captures the *potential* for value, whereas the Product definition captures *realized* value. For a company prioritizing rapid scale, capturing potential (logins) is often the more sensitive signal.

  **Why We Are Not Proceeding With This Option:**
  While the Growth definition is valid for *acquisition* reporting, adopting it as the *sole* company-wide definition of "Active" creates a dangerous blind spot. If we report 100k "Active Users" based on logins, but only 10k are posting, executives may believe the business is healthy while retention quietly collapses. A single metric cannot simultaneously measure **Reach** and **Value**. Hiding the gap between logins and core actions protects no one.

  ### Recommendation: Split and Rename

  The Council should vote to **retire the term "Active Users"** for official executive reporting and adopt the following two metrics:

  1.  **Monthly Logged-In Users (MLIU):**
      *   *Definition:* Unique users with at least one session in the last 30 days.
      *   *Owner:* Growth Team.
      *   *Business Question:* "How large is our reachable audience?"
  2.  **Monthly Core Active Users (MCAU):**
      *   *Definition:* Unique users completing a core value action (e.g., post, share, purchase) in the last 30 days.
      *   *Owner:* Product Team.
      *   *Business Question:* "How many users are deriving value?"

  **Rationale:**
  This approach validates both teams without forcing a compromise that dilutes accuracy. It signals to the executives that we have matured beyond vanity metrics. It allows the Growth team to showcase audience expansion (MLIU) while allowing the Product team to showcase product stickiness (MCAU).

  Crucially, this creates a new, valuable derived metric for the Council to monitor: **The Value Conversion Rate (MCAU / MLIU).** This ratio tells us if our growth is high-quality. If MLIU grows but MCAU stays flat, we have a product problem. If MCAU grows but MLIU stays flat, we have a growth problem. This turns a conflict into a diagnostic tool.

  ### Implementation Plan

  1.  **Dashboard Update:** Data Platform Engineering will update the Executive Dashboard by [Date + 2 weeks] to reflect the new metric names. The legacy "Active User" field will be deprecated.
  2.  **Communication:** The Council Chair and I will meet with the CFO and CEO to explain the change *before* the next board cycle. We will frame this as an upgrade in data fidelity, not a correction of an error.
  3.  **Team Incentives:** We will review OKRs to ensure neither team is penalized by the rename. Growth OKRs should reference MLIU; Product OKRs should reference MCAU.

  ### Vote Request

  I move that the Council adopt the **Split and Rename** recommendation.

  *   [ ] Approve
  *   [ ] Reject
  *   [ ] Abstain

  ***

  **Note to Council:**
  I anticipate pushback regarding the "complexity" of two metrics. Please be prepared to reinforce that **confusion is more expensive than complexity.** Executives can handle two numbers; they cannot handle two conflicting versions of the same number. This decision restores trust in the platform.
