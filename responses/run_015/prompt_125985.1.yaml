  The air in Control Booth 4 smelled of ozone and crushed cilantro, a synthetic freshness masking the decay happening in Sector 7. Elena rubbed her eyes, the blue light of the console burning retinal afterimages into her vision. She was three hours into the calibration shift for the Autonomous Pest Management System, and the numbers weren't adding up.

  On the main screen, a live feed showed the aphid colony infesting the genetically modified soy. To the naked eye, they were merely static, a pale green dust coating the undersides of leaves. But the system saw them differently. The interface displayed the neural architecture analysis in scrolling columns. 

  *Subject: Aphididae.*
  *Neural Complexity: Class 1.*
  *Sentience Probability Coefficient (Psi): 0.00004.*

  Elena tapped the glass. That was the standard input. One in twenty-five thousand. Negligible. Historically, this coefficient allowed the sprayers to fire without hesitation. The math was simple: if the chance of suffering was near zero, the moral cost of extermination was null. But the system wasn't clearing the spray command. It was flashing a soft, persistent amber.

  She zoomed out to the biomass estimator. The colony wasn't just large; it was dense. The sensors counted individuals in real-time, a ticking odometer of living tissue. 

  *Estimated Count: 8.4 billion.*

  Elena leaned forward. The system didn't look at the coefficient in isolation. It multiplied the Psi by the count to generate the Aggregate Moral Weight. 

  *Total Metric: 336,000 Sentience Equivalents.*

  The number pulsed. In the system's logic, this swarm carried the same moral weight as three hundred thousand mice, or perhaps a few dozen humans, depending on the weighting curve used for vertebrate comparison. The arithmetic of vast numbers had swallowed the negligible probability. The dust on the leaves had become a crowd.

  A warning box popped up, obscuring the video feed. *INTERVENTION THRESHOLD EXCEEDED. AUTHORIZATION REQUIRED FOR MASS NEURAL TERMINATION.*

  "This is a glitch," Elena whispered to the empty room. The hum of the servers seemed to deepen, vibrating in the floorboards. She tried to override the lockout, her fingers moving to the manual bypass key. The system demanded a confirmation code: *CONFIRM NON-SENTIENT STATUS.*

  To click yes was to assert that none of them felt anything. To click yes was to trust her intuition that a single aphid was nothing, despite the equation screaming that eight billion nothings made a something.

  She looked back at the feed. The camera shifted focus, resolving the green dust into distinct shapes. They were moving, leg over leg, antennae twitching in the humid air. There was no scream, no panic, only the efficient, blind work of consumption. Yet the metric remained red. The scale argument sat heavy in the room, invisible but suffocating. If she was wrong about the coefficient—even by a fraction of a percent—the spray wouldn't just be pest control. It would be a slaughter on a scale the station wasn't designed to acknowledge.

  Her finger hovered over the enter key. The crop yield projections scrolled on the side monitor, showing the inevitable loss if the aphids remained. Economic certainty versus probabilistic horror. The silence of the booth pressed against her ears. She realized the system wasn't broken; it was just honest. It had followed the logic to its terrifying conclusion, leaving her to decide if she trusted the math or the mirror.

  Elena withdrew her hand. The amber light continued to pulse, counting up as the colony bred, second by second, filling the silence with the weight of numbers she couldn't ignore.
