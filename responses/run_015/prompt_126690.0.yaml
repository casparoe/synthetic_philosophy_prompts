      *   It is a **Mechanism-Entanglement Constraint**.
      *   *Rule:* A model with false assumptions is permissible for policy analysis if and only if: (1) The false assumption is not the *causal channel* through which the policy operates, OR (2) There is independent empirical evidence that the policy intervention renders the false assumption functionally true (e.g., via selection or behavioral change) *in the specific context of the prediction*.
