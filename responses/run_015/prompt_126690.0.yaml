answer: |-
  Based on the paper trail you have collected, your supervisor is not operating under a single, monolithic philosophy of science (like strict Friedmanite instrumentalism), nor is she demanding strict descriptive realism. Instead, she is applying a **Causal Relevance Constraint with an Entanglement Clause**.

  Here is the diagnosis of her rule, the prediction for your council presentation, and the experimental design that will settle the matter.

  ### 1. The Rule: Causal Relevance & Entanglement

  Your supervisor distinguishes between assumptions that are **causally inert** regarding the specific output in question and assumptions that are **causally load-bearing**.

  *   **The Principle:** A false assumption is permissible if and only if the causal mechanism driving the *specific prediction* does not rely on the truth of that assumption, or if the false assumption is functionally equivalent to the true mechanism at the level of aggregation required (the "Selection" case).
  *   **The Entanglement Clause:** A false assumption becomes objectionable when the policy intervention targets the very variable that the assumption falsifies. If the policy works *by* changing $X$, and the model assumes $X$ is already at its limit or behaves ideally, the model cannot score the policy.

  **Why the other two rules fail to fit her record:**
  *   **Friedmanite Instrumentalism:** Fails the *Unitary Household* and *Allocation Rule* cases. A Friedmanite would say, "If the unitary household model predicts the allowance effect, use it." Your supervisor rejects it because the mechanism (income pooling) is false and entangled with the policy. She cares *why* the model works, not just *that* it works.
  *   **De-idealization (Robustness):** Fails the *Selection* case. In the industry entry model, firms do *not* maximize profits. Relaxing the assumption toward truth (making them markup rule-users) changes the micro-foundations entirely. She accepts this only because a *different* true mechanism (selection) sustains the result. Pure de-idealization would require the profit-maximization assumption to be approximately true, which it isn't.

  ### 2. The Verdict: A Split Decision

  She will likely give you a **split verdict** for the two outputs of the same model.

  **Output A: Total Catch Number**
  *   **Verdict:** **Permissible.**
  *   **Reasoning:** This maps to the **Pendulum** and **Selection** precedents. The total catch is driven primarily by biological stock dynamics and aggregate effort limits, which the model gets right (8 seasons out-of-sample). The micro-behavior of individual vessels (stickiness vs. mobility) aggregates out. The false assumption (perfect mobility) is causally inert for *total* catch, provided total effort is constrained.
  *   **Closest Analogue:** The **Pendulum** case. Friction is false, but the period prediction holds because the dominant causal force (gravity/length) is modeled correctly.

  **Output B: Fleet Consolidation under ITQs**
  *   **Verdict:** **Objectionable.**
  *   **Reasoning:** This maps to the **Unitary Household** and **Allocation Rule** precedents.
      1.  **Entanglement:** The ITQ reform is designed to work *by* making effort mobile and profit-responsive. Your model assumes this behavior is *already* perfect. You cannot use a model that assumes the reform has already happened to score the effects of the reform.
      2.  **Causal Load:** The prediction of consolidation depends entirely on the mobility assumption. The ABM shows that when you relax this assumption (introducing stickiness), the result changes drastically.
      3.  **Mechanism Mismatch:** Unlike the "Selection" case, you do not yet have evidence that ITQs will induce a selection process that mimics the representative vessel. The ABM suggests customary norms will persist ("thin trading"), meaning the mechanism in the model (instant arbitrage) is not isomorphic to the mechanism in the target (socially constrained trading).
  *   **Closest Analogue:** The **Unitary Household** case. There, the model assumed income pooling (false) to predict the effect of changing the allowance recipient (policy). Here, the model assumes perfect mobility (false) to predict the effect of inducing mobility (policy). In both, the falsity is entangled with the policy variable.

  ### 3. The Decisive Test Case

  You have access to a neighboring fishery with post-ITQ data. This allows you to move from a philosophical argument to an empirical adjudication of her rule. You need to construct a test that distinguishes between **Instrumental Luck** (Friedman) and **Causal Isomorphism** (Her Rule).

  **The Experiment:**
  1.  **Calibration:** Calibrate *both* the Representative Vessel Model (RVM) and the Agent-Based Model (ABM) on the neighboring fishery's **pre-ITQ** data (where both should fit historical catch/effort).
  2.  **Projection:** Run both models forward into the **post-ITQ** period of the neighboring fishery.
  3.  **Comparison:** Compare the models' predictions on **Fleet Consolidation** (number of active vessels, concentration of quota) against the actual observed data.

  **How to Interpret the Results for Your Supervisor:**

  *   **Scenario 1: The RVM predicts consolidation accurately; the ABM overestimates stickiness.**
      *   **Implication:** This proves that in the presence of ITQs, the "Selection/Mobility" mechanism *does* kick in and washes out the individual stickiness. The false assumption becomes functionally true via the policy intervention.
      *   **Supervisor's Reaction:** She should accept the RVM for your fishery. This turns the case into the **Selection** precedent. The mechanism is effectively real at the population level under the policy regime.

  *   **Scenario 2: The ABM predicts consolidation accurately; the RVM overestimates it.**
      *   **Implication:** This proves that customary norms persist despite ITQs. The false assumption (perfect mobility) remains false and is causally load-bearing.
      *   **Supervisor's Reaction:** She will reject the RVM for consolidation. This confirms the **Unitary Household** precedent. The model gets the answer wrong because it relies on a mechanism (instant arbitrage) that the target system lacks.

  *   **Scenario 3: Both models predict total catch well, but diverge on consolidation (as expected).**
      *   **Implication:** This validates the **Split Verdict**. It demonstrates that the false assumption is causally inert for biological outcomes (Catch) but causally relevant for socio-economic outcomes (Consolidation).
      *   **Supervisor's Reaction:** This is the strongest evidence for the **Causal Relevance Constraint**. It shows she isn't anti-model, but anti-entanglement.

  ### Recommendation for the Council Presentation

  Do not present the consolidation number from the Representative Vessel Model as a fact. Present it as an **upper bound** based on a "frictionless benchmark."

  Explicitly state: *"This model assumes perfect mobility. Historical data shows this is false. However, ITQs are designed to increase mobility. Therefore, this model represents the maximum theoretical consolidation if the policy succeeds perfectly in altering behavior. For a lower bound, we look to this Agent-Based calibration..."*

  This framing respects her **Mechanism Requirement** (you acknowledge the mechanism is false) while satisfying the Council's need for numbers (you provide a benchmark, akin to her accepted **Zero-Transaction Cost** lab benchmark). It protects you from her referee-report persona while utilizing your supervisor's own philosophical consistency to bolster your credibility.
