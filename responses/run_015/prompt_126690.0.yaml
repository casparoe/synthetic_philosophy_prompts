      *   *Prediction:* She will allow the model for **Total Catch** (mechanism of stock growth is independent of vessel behavior details, akin to Pendulum Period). She will reject the model for **Fleet Consolidation** (mechanism of effort allocation is the very thing being modeled falsely, akin to Unitary Household/Allocation Rule).

  5.  **Formulate the Rule:**
      *   It's not pure Instrumentalism (she rejects successful benchmarks for policy).
