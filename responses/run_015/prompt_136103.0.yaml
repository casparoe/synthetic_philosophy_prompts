answer: |-
  ### Standard of Adequacy for a Norm of Assertion

  The following specifications define the adequacy conditions for any proposed norm of assertion, given the job description provided. Each requirement includes the motivating consideration and its status regarding negotiability.

  **1. The Correctness/Permissibility Distinction**
  *   **Requirement:** The theory must distinguish the conditions under which an assertion is *correct* (successful relative to its aim) from the conditions under which it is *permissible* (blameless to utter).
  *   **Motivation:** Warranted false assertions seem permissible (not blameworthy) but incorrect (failed aim); lying seems impermissible but might arguably be correct if true by accident.
  *   **Status:** **Non-Negotiable.** (Whether a single rule generates both or two separate rules do is **Negotiable**).

  **2. Explanatory Power (The Appeal)**
  *   **Requirement:** The norm must explain the specific reactive attitudes associated with assertion: the awkwardness of Moorean paradoxes, the propriety of the challenge "How do you know?", and the pressure to retract upon learning falsity.
  *   **Motivation:** These are the distinctive phenomenological and dialectical features of the practice; a norm that does not vindicate them fails to capture the phenomenon.
  *   **Status:** **Non-Negotiable.**

  **3. Non-Procedural Status**
  *   **Requirement:** The norm must not function as a first-personal decision procedure for the speaker.
  *   **Motivation:** Speakers often assert without reflecting on norms; requiring access to the norm's satisfaction conditions conflates the standard of assessment with the psychology of production.
  *   **Status:** **Non-Negotiable** (per your job description).

  **4. Broad Coverage (Generality)**
  *   **Requirement:** The norm must apply to hedged assertions, vague/moral/aesthetic content, future-directed assertions, deference-based assertions, and outputs of composite/AI speakers.
  *   **Motivation:** Assertion is not limited to flat, factual reports by single human minds; a theory limited to the central case is incomplete.
  *   **Status:** **Non-Negotiable.**

  **5. Boundary Maintenance**
  *   **Requirement:** The norm must distinguish assertion from neighboring speech acts (guessing, supposing, joking, conceding) without collapsing them.
  *   **Motivation:** Lottery propositions and selfless assertions test the boundary; the norm must not classify all confident guessing as assertion nor all assertion as guessing.
  *   **Status:** **Non-Negotiable.**

  **6. Fault vs. Incorrectness**
  *   **Requirement:** The theory must allow for an assertion to be incorrect without the speaker being blameworthy (and vice versa).
  *   **Motivation:** To accommodate warranted false assertions (incorrect but blameless) and lucky true guesses (correct but blameworthy/reckless).
  *   **Status:** **Non-Negotiable.**

  **7. Factivity**
  *   **Requirement:** Truth (or a factive state like Knowledge) is required for an assertion to be correct.
  *   **Motivation:** The strong intuition that asserting falsehoods is a failure of the act, regardless of evidence.
  *   **Status:** **Negotiable.** (This is the primary flashpoint between Truth/Knowledge norms and Justified Belief norms).

  **8. Accessibility**
  *   **Requirement:** A speaker can normally tell whether they satisfy the norm at the time of speaking.
  *   **Motivation:** If the norm is opaque to the speaker, it seems unable to guide the practice or explain the propriety of challenges.
  *   **Status:** **Negotiable.** (Tension with Factivity and Externalism; weakened by Requirement 3).

  **9. Unity**
  *   **Requirement:** A single normative formulation applies across all content types and speaker types (human, AI, composite).
  *   **Motivation:** Theoretical elegance and the intuition that "assertion" names a single kind of act regardless of content.
  *   **Status:** **Negotiable.** (Tension with Coverage regarding AI/Deference).

  ***

  ### Incompatibilities and Recommendations

  **The Trilemma: Factivity, Accessibility, Unity**
  Your suspicion is well-founded. There is a tension between:
  1.  **Factivity:** Correctness requires Truth/Knowledge.
  2.  **Accessibility:** The speaker can normally tell if they satisfy the norm.
  3.  **Unity:** One norm covers all cases (including skeptical scenarios and AI).

  *   **Conflict:** If the norm is Factive (Knowledge/Truth), Accessibility is threatened by skepticism and Gettier cases (one cannot be certain one is not mistaken). If the norm is Accessible (Justified Belief), Factivity is lost (false assertions can be "correct"). If Unity is maintained across AI/Deference, the epistemic state required (Belief/Knowledge) may not exist for the speaker (e.g., a press office or AI).
  *   **Recommendation:** Drop **Accessibility** as a strict requirement for the norm's definition.
  *   **Cost:** The norm becomes an external standard of assessment rather than an internal guide. It explains why we *were* wrong to assert, but not necessarily how to avoid it in the moment without relying on heuristics.
  *   **Verdict:** The resulting list is **still worth having**. Since Requirement 3 (Non-Procedural) is already Non-Negotiable, sacrificing Accessibility creates no functional deficit for the theory's job. It preserves Factivity (capturing the failure of falsehood) and Unity (preserving the concept's stability).

  **Secondary Tension: Unity vs. Coverage (AI/Composite)**
  *   **Conflict:** A norm defined by individual epistemic states (e.g., "S must know p") fails for composite speakers (Press Office) or AI where "knowledge" or "belief" is metaphorical.
  *   **Recommendation:** Maintain Unity but interpret the epistemic condition functionally. The "speaker" is the source of the information, and the "state" is the reliability of that source, not necessarily a mental state.
  *   **Verdict:** Do not drop Unity; instead, broaden the metaphysics of the speaker to satisfy Coverage.

  ***

  ### Desiderata vs. Prejudices

  You asked to separate genuine requirements from theoretical prejudices.

  *   **Constitutive Rule vs. Evaluative Standard:** **Prejudice.** Whether the norm *constitutes* the act (no norm, no assertion) or merely *evaluates* it (assertion exists, norm judges it) does not affect the norm's ability to meet the Job Description.
  *   **Single Norm vs. Correctness + Permissibility:** **Prejudice.** It is a genuine requirement to distinguish the *concepts* (Requirement 1), but insisting they derive from a *single sentence* is stylistic. Two rules are legitimate if they track the distinction accurately.
  *   **Assertion as Expression of Belief:** **Prejudice.** While assertion often expresses belief, the norm should govern the *act*, not the *expression*. Requiring the norm to vindicate this expression excludes cases of selfless assertion or professional reporting where belief is suspended.
  *   **Non-Circularity (Not leaning on the epistemic notion):** **Desideratum (Weak).** It is preferable if the norm illuminates assertion without presupposing the very notion (e.g., Knowledge) it is sometimes used to analyze. However, if the goal is only to norm assertion, circularity is less damaging.
  *   **The Single Largest Excluder:** **Factivity (Requirement 7).** Insisting that Truth or Knowledge is required for *correctness* excludes the entire family of Justified/Reasonable Belief norms, which are otherwise popular for satisfying Accessibility and handling Warranted False Assertions.

  ***

  ### Comparative Table

  | Requirement | Knowledge Norm | Truth Norm | Justified Belief Norm | Contextualist / Hybrid |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Correctness/Permissibility Distinction** | Pass (Know=Correct, Excuse=Permissible) | Pass (True=Correct, Reasonable=Permissible) | Fail (Often conflates justification with correctness) | Pass (Varies by context) |
  | **2. Explanatory Power (Moore, Challenge, Retract)** | Pass (Explains "How do you know?" directly) | Partial (Explains retraction, less so challenge) | Partial (Explains challenge, weak on retraction) | Pass (Explains variance in challenges) |
  | **3. Non-Procedural Status** | Pass (Externalist compatible) | Pass (Externalist compatible) | Pass (Internalist compatible) | Pass |
  | **4. Broad Coverage (AI, Hedged, Deference)** | Uncertain (AI "knowledge" is metaphorical) | Pass (AI output can be true/false) | Fail (AI/Composite lack "belief") | Uncertain (Depends on context parameters) |
  | **5. Boundary Maintenance** | Pass (Distinguishes guessing from knowing) | Fail (True guessing counts as correct assertion) | Pass (Distinguishes reckless from reasonable) | Pass |
  | **6. Fault vs. Incorrectness** | Pass (Warranted false is blameless but incorrect) | Pass (Warranted false is blameless but incorrect) | Fail (Warranted false is often "correct") | Pass |
  | **7. Factivity** | Pass | Pass | Fail | Uncertain (Depends on context) |
  | **8. Accessibility** | Fail (Knowledge is not always transparent) | Fail (Truth is not always transparent) | Pass (Justification is usually accessible) | Pass (Standards shift to accessibility) |
  | **9. Unity** | Fail (Struggles with AI/Composite speakers) | Pass (Truth applies universally) | Fail (Belief requires a mind) | Fail (Explicitly rejects unity) |
