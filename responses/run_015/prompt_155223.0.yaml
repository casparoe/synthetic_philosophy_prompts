answer: |-
  Here are the desiderata for a theory of social construction, strictly constrained by your requirements, followed by the tension analysis, the assessment of your invented distinction, the legitimacy check, and the brief evaluation of existing accounts.

  ### I. The Desiderata List

  **1. The Non-Triviality Constraint**
  The theory must distinguish socially constructed kinds from brute physical kinds without denying the reality of the latter.
  *   **Welded Case:** It must explain why *DNA sequences* and *height* are not socially constructed (despite being measured by social tools), while simultaneously accounting for the *planet* borderline case: it must specify whether the IAU vote constructed the *kind* "planet" or merely refined the *concept* applied to a brute physical object. If the theory says the vote constructed the planet, it fails; if it says the vote constructed the *status* of the object within a regulatory framework, it passes.

  **2. The Causal Efficacy Requirement**
  The theory must explain how a kind can be ontologically dependent on human attitudes yet retain independent causal power over those same humans.
  *   **Welded Case:** It must account for *money*: a *money* bill is physically paper, yet its constructed status causes physical movements (goods changing hands, people working). The theory cannot say money is "just an idea" (which denies its causal force) nor "just a physical object" (which denies its construction). It must explain the mechanism of the force.

  **3. The Asymmetry of Volition (Opt-Out) Condition**
  The theory must explain why membership in some constructed kinds is subject to individual declaration, while membership in others is coercively assigned regardless of individual attitude.
  *   **Welded Case:** It must resolve the *race vs. gender* asymmetry. If both are constructed, why can an individual often *self-verify* into a gender category (in specific social contexts) but cannot *opt-out* of a racial category (e.g., passing or declaring oneself out of a race does not stop racialization by others)? The theory must identify the structural constraints that block volition in one case but not the other.

  **4. The Dynamic Stability (Looping) Clause**
  The theory must accommodate kinds where the act of classification alters the properties of the classified, potentially changing the extension of the kind over time.
  *   **Welded Case:** It must handle *psychiatric and personality kinds*. If people classified as "depressed" change their behavior in response to the classification, the *property* being tracked shifts. The theory must explain whether the kind remains the *same kind* through this shift, or if the construction creates a moving target that invalidates longitudinal study.

  **5. The Boundary Vagueness & Shift Provision**
  The theory must account for extensions that shift under social pressure without explicit legislative or definitional decision.
  *   **Welded Case:** It must explain *whiteness* or *dialect vs. language*. The extension of "white" has changed over centuries without a single vote redefining it. The theory must distinguish between *constructing a kind* and *drifting application of a concept*. If every shift in usage constitutes a new construction, the theory collapses into "everything is."

  **6. The High-Stakes Consistency Rule**
  The theory must ensure that the ontological status of the kind does not undermine the normative stakes of its application in life-or-death contexts.
  *   **Welded Case:** It must preserve the reality of *refugee status* and *unemployment statistics*. If "constructed" implies "optional" or "unreal," then denying refugee status becomes merely a semantic dispute rather than a material harm. The theory must clarify that *constructed* does not mean *false* or *revocable at will by the classifier*.

  **7. The Ontological Categorization Mandate**
  The theory must explicitly distinguish between the *Kind*, the *Concept*, the *Property*, and the *Fact*, and specify which of these is constructed.
  *   **Welded Case:** It must solve the *level problem* for *disability*. Is the *kind* "disabled person" constructed, or only the *concept* used to group them, or only the *social property* of "needing accommodation"? If the theory claims the *property* of needing accommodation is constructed, it risks implying the physical impairment is irrelevant. It must locate the construction precisely to avoid blurring kind vs. property.

  **8. The Anchoring Specification**
  The theory must specify the relationship between the constructed kind and any non-social properties it tracks.
  *   **Welded Case:** It must differentiate *race* (often *Anchored* to phenotype/geography, imperfectly) from *currency value* (currently *Floating*, tracking no commodity) from *marital status* (*Self-Verifying*, the classification creates the legal reality). It must state whether a kind can migrate between these states (e.g., money moving from Anchored [gold] to Floating [fiat]).

  ---

  ### II. Tension Analysis & Trade-offs

  **1. Jointly Unsatisfiable Pairs**
  *   **Non-Triviality vs. Coverage:** You cannot strictly rule out *DNA* (Non-Triviality) while maintaining that *Race* is constructed (Coverage), if Race is defined partly by genetic ancestry. If construction requires "no biological basis," Race falls out. If construction allows "biological basis interpreted socially," then *Height* (biological basis interpreted socially via norms) risks falling in.
  *   **Descriptive vs. Action-Guiding:** A theory that describes *what construction is* (Descriptive) cannot logically entail *what we ought to do about it* (Action-Guiding) without an additional normative premise. The "magic wand" error arises from demanding the ontology do the work of the ethics.

  **2. The Requirement to Drop**
  *   **Drop:** The strong version of **Desideratum 3 (Normative Implication)**.
  *   **Reason:** Demand that the theory tell us *whether* to abolish/reform is a category error. Ontology reveals the structure of reality; ethics reveals the value.
  *   **Cost:** The theory becomes less politically "useful" in the immediate sense. It stops being a magic wand. However, this is a feature, not a bug: it prevents the "construction = abolition" fallacy. It forces the group to do the ethical work separately.

  **3. The "Killer" Requirement**
  *   **Requirement:** **Desideratum 3 (Asymmetry of Volition).**
  *   **Why:** This knocks out the majority of "soft" constructivist accounts (e.g., "gender is a performance," "race is a mindset"). These accounts fail to explain why I cannot simply stop performing or change my mindset to escape the causal consequences of the kind. Any theory that treats construction as primarily *individual belief* fails to explain the *coercive* nature of constructed kinds like Race or Money. It forces the theory to account for *power* and *structure*, not just *ideas*.

  ---

  ### III. Assessment of Your Invented Distinction

  **Anchored / Floating / Self-Verifying**
  *   **Does an adequate theory have to take a stand?** Yes, but it does not need to adopt your *terminology*. It must, however, account for the *phenomena* these terms describe. A theory that treats all construction as "Floating" (purely stipulative) fails the *Anchored* cases (Race/Disability). A theory that treats all construction as "Anchored" fails the *Self-Verifying* cases (Refugee Status/Marriage).
  *   **Migration:** Kinds *can* move between categories over time. *Money* is the paradigm case of Anchored $\to$ Floating. *Gender* may be moving from Anchored (biological sex) toward Self-Verifying (self-ID) in specific jurisdictions.
  *   **Simultaneity:** A kind can be Anchored for one purpose and Self-Verifying for another. (e.g., *Disability* is Anchored for medical treatment, Self-Verifying for legal accommodation claims).
  *   **Verdict:** This is not a bad re-description; it is a necessary typology of *dependence relations*. The literature often obscures this under "realism vs. nominalism." Your triad is more granular and practically useful for the cases you listed.

  ---

  ### IV. Legitimacy Check

  **1. The Abolition Requirement**
  *   *Demand:* "If K is constructed, the theory should say what abolishing K would consist in."
  *   *Verdict:* **Partial Category Error.**
  *   *Reasoning:* Ontology describes conditions of existence. Politics describes conditions of cessation. However, for *Status-Function* kinds (Money, Marriage), the kind *is* the practice. Abolishing the practice *is* abolishing the kind. For *Anchored* kinds (Race), abolishing the *concept* does not abolish the *physical correlates* or the *social treatment*.
  *   *Ruling:* The theory must specify *what kind of thing* K is, which *implies* what abolition would look like, but it should not be required to prescribe *whether* abolition is possible or desirable.

  **2. The Reflexivity Requirement**
  *   *Demand:* "The theory should say what happens to K when the claim that K is constructed becomes widely believed."
  *   *Verdict:* **Legitimate and Necessary.**
  *   *Reasoning:* This is a second-order *Looping Effect*. If people believe "Money is fake," the value collapses. If people believe "Race is constructed," racialization may lessen or intensify (via backlash). A theory of social kinds that ignores the causal impact of *the theory itself* is incomplete. It must predict its own obsolescence or reinforcement.

  ---

  ### V. Brief Evaluation of Three Accounts

  **1. Collective-Acceptance / Status-Function (e.g., Searle)**
  *   **Performance:** Fails **Asymmetry of Volition**. It implies that if we stop accepting money, it ceases to function, but cannot explain why an individual cannot opt-out of *Race* even if they reject the concept. It handles *Money* well (Paradigm) but struggles with *Refugee Status* (which is imposed, not accepted).
  *   **Verdict:** Too consensus-based; ignores power/coercion.

  **2. Political-Definition / Ameliorative (e.g., Haslanger)**
  *   **Performance:** Excels at **Normative Implication** and **High-Stakes Consistency**. It explicitly defines kinds (like Gender/Race) in terms of oppression to guide political action.
  *   **Verdict:** Risks failing **Non-Triviality** and **Ontological Categorization**. By defining kinds *by* their political purpose, it risks making the truth of the kind dependent on the success of the politics, blurring Is/Ought.

  **3. Looping / Interactive Kinds (e.g., Hacking)**
  *   **Performance:** Excels at **Dynamic Stability** and **Reflexivity**. It perfectly captures *Psychiatric Kinds* and the **Reflexivity Requirement**.
  *   **Verdict:** Struggles with **Causal Efficacy** for non-human kinds. *Money* does not "loop" in the same way a depressed person does. It is less effective at explaining the static, coercive weight of *Institutional Kinds* (Borders, Law) compared to *Human Kinds*.
