answer: |-
  **Project Title:** Licensing the "Right but Early": Epistemic Criteria for Suspended Judgment in Long-Run Forecasting

  **1. Statement of the Question**
  When a long-run quantitative prediction fails to materialize within its specified window, under what epistemic conditions is the verdict "right but early" rationally available? Specifically: can we operationalize criteria that distinguish between (a) **Dormancy** (the trigger threshold remains uncrossed), (b) **The Cassandra Dividend** (the prediction was successfully averted by policy action), and (c) **Mechanism-Swap** (the original causal mechanism was abandoned while retaining the vocabulary)?

  The project seeks to determine if these categories can be defined such that they yield determinate verdicts on historical cases (e.g., Malthusian traps, Limits to Growth, Peak Oil) without relying on hindsight bias or sociological factors. If a universal metric is impossible, the secondary question is: what specific variables does the verdict depend on? (Hypothesis: It tracks the *independence of the trigger variable* from the *auxiliary hypotheses used to save the model*.)

  **2. Why Existing Resources Do Not Settle This**
  Current frameworks for evaluating scientific predictions fail to resolve the "right but early" problem because they lack granularity for the *unresolved window*.

  *   **Lakatosian Research Programmes:** The distinction between "progressive" and "degenerating" problem shifts is a post-hoc classification. It provides a vocabulary for describing the outcome but offers no ex-ante rate for how much "protective belt" adjustment is permissible before a theory is deemed degenerate. It cannot distinguish a legitimate refinement from a mechanism-swap in real time.
  *   **Bayesian Updating:** Standard updating treats a missed date as a likelihood reduction. It lacks a built-in penalty for *moving the goalposts*. A model that predicts $X$ at $t_1$, then $X$ at $t_2$ after $t_1$ passes, can maintain high posterior probability if the prior is sufficiently sticky, even if the mechanism has quietly changed. It does not account for the "cost" of modifying auxiliary hypotheses.
  *   **Forecasting Scoring Rules:** Metrics like Brier scores or calibration curves require resolution. They are silent on the status of a forecast that is technically still "open" but has missed its initial anchor. They cannot score the *quality of the delay*.

  **3. Methodology and Approach**
  The project will proceed in four integrated workstreams over six months (part-time).

  *   **Workstream A: Taxonomy Construction (Months 1–2)**
      I will code a small-N set of historical forecast failures (Malthus, Limits to Growth, Simon-Ehrlich, Peak Oil) against the three categories (Dormancy, Cassandra, Mechanism-Swap). The coding will not rely on the ultimate truth of the prediction, but on the *structure of the defense* offered by proponents at the time of the miss.
      *   *Deliverable:* A decision tree for classifying "rescues."

  *   **Workstream B: The Credibility Cost of Postponement (Months 2–4)**
      I will investigate whether a principled "penalty function" exists for timeline slippage. If a model predicts a threshold breach at $t$ and it occurs at $t+n$, does the model retain its original weight?
      *   *Test:* I will compare the *ex-ante* specified sensitivity of the model to the *ex-post* adjustment. If the trigger variable (e.g., resource stock) is independently measurable, the cost of postponement should be low (Dormancy). If the trigger is re-specified (e.g., from "physical scarcity" to "economic scarcity"), the cost should be high (Mechanism-Swap).
      *   *Goal:* To determine if the "cost" is a function of the *observability of the trigger* independent of the model's output.

  *   **Workstream C: Near-Miss Analysis (Months 3–5)**
      Instead of waiting for the global case to resolve, I will probe sub-global units where the ceiling actually bound. For example, if the global Malthusian trap didn't trigger, did it trigger in specific regions or periods where population density hit the theorized threshold?
      *   *Rationale:* This isolates *Dormancy* from *Mechanism-Swap*. If the mechanism holds locally but not globally, the theory may be scale-dependent rather than wrong. If it fails locally where the threshold was crossed, the mechanism is likely degenerative.

  *   **Workstream D: The Hindcast Check (Months 5–6)**
      I will run the finished framework as if it were 1800, 1900, 1975, and 2000. Using only information available at those dates, I will apply the taxonomy and credibility cost rules to see if the framework licenses the verdicts we now accept as historically accurate.
      *   *Guardrail:* This prevents the framework from being a rationalization of current beliefs. If the framework classifies a historically "false" theory as "Dormant" in 1975, but that theory is now considered debunked, the framework fails.

  **4. Deliverables**
  1.  **Journal Article:** A theoretical and historical analysis proposing the "Dormancy vs. Dividend vs. Swap" taxonomy and the results of the hindcast validation. Target: *Philosophy of Science*, *Studies in History and Philosophy of Modern Physics*, or *Futures*.
  2.  **Policy Memo:** A "Rescue Protocol" for institutions issuing long-run forecasts (e.g., climate adaptation units, fiscal watchdogs). This protocol will recommend pre-registering:
      *   Which auxiliary variables can be adjusted without invalidating the core forecast.
      *   The maximum permissible timeline slip before a forecast is considered withdrawn.
      *   Criteria for distinguishing policy success (Cassandra) from model error.

  **5. Honest Appraisal: Risks and Scope**

  **What Counts as Failure?**
  *   **Taxonomy Collapse:** If, upon coding the cases, it turns out that "Mechanism-Swap" and "Dormancy" are indistinguishable without knowing the future outcome, the project fails to provide a real-time diagnostic. (Mitigation: The article would then pivot to proving this indistinguishability is a structural feature of long-run forecasting, which is still a valuable negative result).
  *   **Arbitrary Penalty:** If the "Credibility Cost" cannot be motivated by anything other than stipulation (e.g., "we decide a 10-year slip costs 50% credibility"), the theoretical contribution weakens. I need to find a principled link between cost and *independent measurability*.
  *   **Sociological Override:** If the hindcast shows that historical verdicts were decided by non-epistemic factors (e.g., who had tenure, political alignment) rather than evidential weight, the normative framework will have no purchase on actual practice.

  **Scope Cuts (If Time Runs Short)**
  If the six-month part-time window proves too tight, I will cut **Workstream B (Formal Credibility Cost Modeling)** first.
  *   *Why:* This is the most mathematically demanding section and carries the highest risk of stalling on arbitrary stipulations.
  *   *Consequence:* The article would become a qualitative/philosophical analysis of the taxonomy and hindcast, rather than a formal epistemic model. The Policy Memo would shift from a quantitative "protocol" to a qualitative "checklist." This preserves the core insight (the taxonomy and the hindcast validation) while sacrificing the attempt to quantify the "cost" of a save.

  **Dependency Check**
  If the verdict ultimately "depends on the case," this proposal argues that the dependency tracks **the independence of the trigger variable**.
  *   *High Independence:* (e.g., physical temperature, measurable ore grades) $\rightarrow$ Verdict leans toward **Dormancy** (Right but Early).
  *   *Low Independence:* (e.g., "economic scarcity," "social collapse" defined by the model's own outputs) $\rightarrow$ Verdict leans toward **Mechanism-Swap** (Degenerative).
  The project succeeds if it can demonstrate that this dependency is robust across the test cases.
