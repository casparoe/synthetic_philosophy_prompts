answer: |-
  This is a classic boundary problem in democratic theory: the "boundary problem" (who decides who decides?) meets the "all-affected principle" (who should decide?). Your Commission's track record reveals a tension between **formal legal status** and **functional social integration**.

  Here is the analysis of your precedents, the implicit rules governing them, and the recommendation for Riverside.

  ### 1. Decoding the Precedents: What is the Implicit Rule?

  You asked if the rule is *all-affected-interests*, *coercion*, or *life mainly lived here*. Looking at your eight verdicts, **All-Affected-Interests** and **Coercion** are falsified.
  *   **Commuters** are affected by city traffic/economy and coerced by city laws while working, yet they are **NO**.
  *   **Absentee Owners** are affected by zoning/taxes, yet they are **NO**.
  *   **Farmworkers** are coerced by city laws while in employer housing, yet they are **NO**.

  The rule that best fits all eight verdicts is **"Domicile + Duration + Voluntary Integration."**
  *   **Green Card (YES):** Long duration, voluntary residence.
  *   **Homeless (YES):** Physical presence is their "domicile," regardless of property ownership.
  *   **Students (YES):** 9 months is sufficient duration *if* they register (signaling voluntary intent to integrate).
  *   **Jail <1 Year (YES):** Short-term involuntary presence does not sever prior community ties.
  *   **Jail >1 Year (NO):** Long-term incarceration implies a severing of community ties (or civil death).
  *   **Farmworkers (NO):** 5 months is insufficient duration; visa ties imply lack of voluntary integration.
  *   **Commuters (NO):** Lack of "domicile" (sleeping elsewhere).
  *   **16 Year Olds (NO):** Legal capacity constraint (separate from residence).

  **The Strongest Predictor:** Where do you sleep, and for how long?
  *   If you sleep here for most of the year (Green Card, Homeless, Students, Jail <1yr) $\rightarrow$ **YES**.
  *   If you sleep elsewhere (Commuters, Absentee) or only temporarily (Farmworkers) $\rightarrow$ **NO**.

  ### 2. The Riverside Case: Closest Analog and Verdict

  **Closest Analog:** The **Commuter** case is the red herring; the **Green Card** case is the true analog.
  You noted the "earnings tax" argument is closed off by the Commuter precedent. You are correct. Paying the earnings tax is not sufficient for eligibility (Commuters pay it and get **NO**). However, Riverside residents differ from Commuters in the one variable that consistently predicts **YES**: **They sleep here.**

  Riverside residents are functionally identical to your **Green Card** voters. They live there permanently, send kids to city schools, and use city utilities. The only difference is a legal line on a map drawn by the county, not the city.

  **The Two Competing Rules:**
  There are two rules that fit your eight old verdicts equally well but diverge on Riverside:

  1.  **Rule A (Functional Residency):** "Voting rights belong to those whose daily life and physical presence are centered in the city, regardless of technical incorporation status."
      *   *Fits Old 8:* Yes (explains Homeless/Students vs. Commuters/Farmworkers).
      *   *Riverside Verdict:* **Full Ballot.** (They live here, sleep here, life is here).
  2.  **Rule B (Formal Jurisdiction):** "Voting rights belong only to those currently subject to the city's full police power and zoning authority within incorporated limits."
      *   *Fits Old 8:* Yes (All YES cases were physically inside limits; all NO cases were either outside or transient).
      *   *Riverside Verdict:* **Nothing.** (Sheriff polices them, not City; Mayor doesn't govern them *yet*).

  **Recommendation:**
  To be consistent with your *own* track record, you should choose **Rule A (Full Ballot)**.
  Why? Because your Commission has historically prioritized **physical presence and duration** over **legal formalism**.
  *   You let **Homeless** people vote without fixed addresses (formalistic hurdle removed).
  *   You let **Jail** inmates vote if under a year (legal coercion ignored in favor of community tie).
  *   You let **Students** vote despite transient status (contractual housing ignored in favor of presence).

  If you deny Riverside residents the vote based on an incorporation line, you contradict the spirit of the Homeless and Student precedents. You would be elevating a legal boundary above the "life mainly lived here" standard you applied to the Green Card holders.

  ### 3. The "Annexation Only" Option: Ad Hoc or Defensible?

  You asked if limiting them to the annexation measure commits you to a different *demos* for every decision.

  **It is Ad Hoc relative to your precedents.**
  Your past eight cases established a **Status** (Voter vs. Non-Voter), not a **Menu** (Voter for X, Non-Voter for Y).
  *   If you allow them to vote on Annexation but not Mayor, you are implicitly adopting the **All-Affected-Interests** principle *only for this case*.
  *   But you rejected All-Affected-Interests for Commuters (who are affected by the Mayor's economic policy) and Absentee Owners (affected by the Mayor's zoning).
  *   **The Contradiction:** If Riverside residents are "affected enough" to vote on Annexation, why aren't Commuters "affected enough" to vote on a Business Tax measure? Why aren't Absentee Owners "affected enough" to vote on Zoning?

  **Is it Defensible?**
  It is defensible in political theory (the "all-subjected" principle), but it is **inconsistent with your Commission's history.** It creates a "fluid demos" that your previous rulings explicitly rejected in favor of a fixed franchise. If you take this path, you must acknowledge you are overturning the "Status" model established by the Green Card/Commuter dichotomy.

  ### 4. Strategic Recommendation

  **Grant the Full Ballot.**
  *   **Reasoning:** It aligns with the "Sleep/Duration" heuristic that successfully predicted 8/8 prior cases. It treats the incorporation line as a technicality, similar to how you treated "fixed address" for the homeless.
  *   **Risk:** It invites legal challenge from the County (since they police the area).
  *   **Mitigation:** Frame the ruling not as "expanding the city" but as "recognizing de facto residency."

  **If you must compromise:**
  If the Commission fears the legal overreach of a Full Ballot, the **Annexation Only** vote is the second-best option, *but* you must write the opinion carefully. You must argue that Annexation is a *constitutive* act (deciding who is in the demos) rather than a *legislative* act (deciding policy). This distinguishes it from the Mayoral race. However, be warned: this opens the door for future groups to demand issue-specific voting (e.g., "Let commuters vote on the earnings tax rate"), which fragments your franchise rules.

  ### 5. The Next Case on the Docket

  To distinguish between **Rule A (Functional Residency)** and **Rule B (Formal Jurisdiction)**, you need a case where Physical Presence and Legal Authority are decoupled *inside* the city limits.

  **Proposed Case:** **Residents of a Federal Enclave or Military Base within City Limits.**
  *   *Scenario:* A large federal military base or post office sits inside the city. Residents live there year-round (Functional Residency = YES). However, they are policed by federal officers, not city police, and are exempt from certain city zoning/taxes (Formal Jurisdiction = NO).
  *   *Why this works:*
      *   If you vote **YES**, you cement **Rule A** (Life lived here trumps legal jurisdiction).
      *   If you vote **NO**, you cement **Rule B** (Legal subjection is required, even if they sleep here).
      *   This cleanly separates the Riverside logic (Outside limits, inside life) from the Jail/Commuter logic.

  **Summary:** Your history shows you value **where people live** over **where they pay taxes** or **what legal lines say**. Riverside residents live there. Consistency demands they vote on the full ballot. Anything less treats them like Commuters (who sleep elsewhere) rather than Green Card holders (who live here).
