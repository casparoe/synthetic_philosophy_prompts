answer: |-
  Reading *Pretty Woman* (1990) through the lens of sex-work policy reveals that the film is not merely a romance, but a specific ideological argument about labor, vulnerability, and salvation. The narrative architecture relies on the **invisibility of labor rights** to function. If Vivian Ward had the protections afforded under the New Zealand decriminalization model, the plot would collapse. If the story adhered to the Nordic Model's logic consistently, Edward would be a criminal. If it followed the German/Dutch legalization model, the relationship would be a bureaucratic contract rather than a fairy tale.

  The film ultimately functions as a **Nordic Model fantasy** disguised as a rom-com: it posits that the only "happy ending" for a sex worker is exit, facilitated by a benevolent buyer, while rendering structural labor protections invisible to preserve the myth of individual rescue.

  ### 1. The Nordic Fantasy: Exit as the Only Victory
  The Nordic Model (criminalizing the buyer, decriminalizing the seller) is predicated on the idea that prostitution is inherently exploitative and that demand is the root evil. The goal is not safer work, but *no work*.

  *   **Edward as the "Good Buyer":** Edward Lewis fits the Nordic ideal of the reformed john. He doesn't just stop buying sex; he removes the worker from the market entirely. His arc is one of moral redemption through cessation of demand.
  *   **The Ladder Scene:** The climax is not Vivian gaining independence; it is Edward "rescuing" her from the apartment (the workplace). In policy terms, this is an "exit program" personalized.
  *   **The Erasure of Labor:** By framing the solution as marriage (economic dependence on the buyer), the film validates the Nordic premise that sex work is incompatible with dignity. Vivian cannot be a dignified sex worker; she must become a non-worker.

  ### 2. The Regulatory Void: Hotel Management vs. German/Dutch Legalization
  In Germany and the Netherlands, legalization creates a regulated environment: licensed brothels, mandatory health checks, and taxation. The state acts as the manager.

  *   **The Hotel Manager (Mr. Thompson):** The Regent Beverly Wilshire acts as an unlicensed, privatized brothel manager. Thompson enforces rules (dress codes, conduct), but his authority is discretionary, not legal. He protects Vivian only because Edward is a high-value client.
      *   *Policy Parallel:* In a legalized system, Thompson's protection would be codified in venue licensing. In the film, it is paternalistic. If Edward hadn't been wealthy, Thompson likely would have ejected Vivian (as he initially threatens to).
  *   **The "Week" Contract:** The initial agreement ($3,000 for a week) is a verbal handshake. In a legalization model, this would be a taxable contract with defined scope. In the film, the ambiguity creates the romantic tension. When Edward wants to extend the deal, it's a negotiation of feelings, not terms. The lack of formal contract keeps Vivian vulnerable to scope creep (e.g., attending the polo match, which was not in the original "job description").

  ### 3. The Decriminalization Gap: What New Zealand Fixes
  New Zealand's Prostitution Reform Act (2003) treats sex work as labor. Workers have occupational health and safety rights, can unionize, and can sue for breach of contract. This model highlights exactly what is missing in Vivian's life.

  *   **The Necklace Incident:** Edward snaps the jewelry box on Vivian's fingers when she refuses to answer a question about her past.
      *   *NZ Lens:* This is workplace violence and assault. Vivian would have legal recourse, could file a grievance, and could terminate the contract without penalty.
      *   *Film Lens:* This is a moment of emotional breakthrough. Her pain humanizes her to Edward. The lack of legal recourse forces her to rely on emotional labor to de-escalate the abuse.
  *   **Kit De Luca:** Vivian's roommate represents the failure of the unregulated market. She is injured (beaten by a client) and has no recourse.
      *   *Peer Networks:* Under decriminalization, peer support networks are formalized to screen clients and share safety info. In the film, Kit and Vivian are isolated. Kit's tragedy serves as the "stick" to Edward's "carrot," reinforcing the idea that the *only* safety is leaving the industry, not improving it.
  *   **The Polo Match:** Vivian is humiliated by Edward's associates.
      *   *NZ Lens:* Sex workers are protected from discrimination. While social stigma exists, legal personhood allows them to navigate public spaces without the threat of being "exposed" as a legal violation.
      *   *Film Lens:* Her vulnerability is the point. The humiliation proves she doesn't belong in his world *as a worker*. She must be transformed (new clothes, new manners) to be accepted.

  ### 4. The Structural Necessity of Absence
  The prompt asks if the absence of brothels, peer organizers, or labor inspectors is just Hollywood, or structurally necessary. **It is structurally necessary for the rescue narrative.**

  *   **If Vivian had a Union Rep:** When Edward snaps her fingers, she calls her rep. The romance dies. The power dynamic equalizes. Edward is no longer a savior; he's a client in trouble.
  *   **If there were Labor Inspectors:** The hotel would be scrutinized. Edward's corporate raiding (the other plot line) might even clash with labor rights, making him the villain rather than the hero.
  *   **If Sex Work was Normalized Labor:** The class fantasy collapses. The movie relies on the stigma of prostitution to create the barrier Edward must overcome. If Vivian were simply a contractor, the "Pretty Woman" transformation is unnecessary. The film needs her to be "fallen" so she can be "raised."

  ### 5. Edward's Transformation: Red Herring or Solution?
  Edward's personal transformation is a **red herring** regarding the institutional question.

  *   **Individual Morality vs. Systemic Change:** Edward learns to treat Vivian with respect. He stops treating her like an object. This suggests that the problem with sex work is "bad men," not the structure of the industry.
  *   **The Kit Counter-Argument:** The film inadvertently proves this wrong through Kit. Edward changes, but the market doesn't. Kit is still beaten. Vivian is safe only because she is *exceptional* and chosen by a billionaire. The vast majority of workers (like Kit) remain unprotected.
  *   **The Policy Verdict:** Edward's redemption solves nothing for the industry. It validates the Nordic Model's focus on individual morality while obscuring the Decriminalization Model's focus on systemic safety.

  ### Conclusion
  *Pretty Woman* is a Nordic Model fable wrapped in the aesthetics of a romance. It argues that the "buyer" holds all the power to grant safety, dignity, and exit. By rendering labor rights invisible—no contracts, no safety regulations, no peer networks—the film makes collective policy solutions impossible to imagine.

  Vivian's safety depends entirely on Edward's benevolence, not her rights. The film's silence on brothels, unions, and inspectors is not just a Hollywood omission; it is an ideological requirement. To acknowledge sex work as *work* (NZ Model) would be to acknowledge that Vivian doesn't need a prince; she needs a contract. And a woman with a contract doesn't need to be rescued; she needs to be paid. The fairy tale requires her to be powerless so that his power can be framed as love.
