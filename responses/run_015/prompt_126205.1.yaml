prompt: |-
  Read Pretty Woman through the lens of sex-work policy — the Nordic model, German/Dutch legalization, and NZ decriminalization. Vivian's arc is literally "buyer rescues worker," which sounds like a Nordic-model fantasy: demand is the problem, exit is the win. But look closer — she has no contract, no peer backup when Kit gets hurt, no way to complain except through Edward's social capital. Does that invisibilty of labor rights illustrate what NZ-style decriminalization tries to fix (brothel rules, peer networks, legal personhood)? Or does the romance just hide those institutions?

  Map the key scenes — the polo match humiliation, the bathrobe/necklace negotiation, the hotel manager stepping in — onto what each model actually does: criminalize buyers, license brothels, treat it as labor with occupational health rules. Where does the fairy-tale rescue structure make collective/policy solutions invisible by design? And does Edward's personal transformation actually answer the institutional question, or is it a red herring? The film never shows a brothel, a peer organizer, or a labor inspector — is that absence just Hollywood, or structurally necessary?
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Deconstruct the Prompt:**
      *   **Subject:** *Pretty Woman* (1990 film).
      *   **Lens:** Sex-work policy models (Nordic, German/Dutch Legalization, NZ Decriminalization).
      *   **Core Argument:** Vivian's arc ("buyer rescues worker") resembles the Nordic model fantasy (exit is win), but lacks labor rights (contract, peer support, legal recourse).
      *   **Key Questions:**
          *   Does the invisibility of labor rights illustrate what NZ decriminalization tries to fix?
          *   Does romance hide these institutions?
          *   Map key scenes (polo, bathrobe/necklace, hotel manager) to policy models.
          *   Where does the "rescue structure" make collective solutions invisible?
          *   Does Edward's transformation answer the institutional question or act as a red herring?
          *   Is the absence of brothels/peers/inspectors just Hollywood or structurally necessary?

  2.  **Analyze the Policy Models:**
      *   **Nordic Model (Sweden, etc.):** Criminalize the buyer, decriminalize the seller. Goal: End demand, encourage exit. *Film parallel:* Edward "saving" Vivian from the life.
      *   **Legalization/Regulation (Germany/Netherlands):** State-licensed brothels, mandatory health checks, taxation. Goal: Control and contain. *Film parallel:* The hotel acts as a pseudo-brothel manager, but without the regulation.
      *   **Decriminalization (New Zealand):** Sex work is work. Labor laws apply, contracts enforceable, health & safety standards, right to refuse clients. Goal: Harm reduction, worker agency. *Film parallel:* What's missing. Vivian has no contract, no safety net.

  3.  **Analyze the Film Scenes through the Lens:**
      *   **The Street Pickup:** Unregulated market. High vulnerability.
      *   **The "Business Deal" (Week for $3k):** Verbal contract, unenforceable. No HR department.
      *   **The Polo Match:** Social stigma. Vivian is exposed as "other." In a decrim model, her profession wouldn't necessarily be a moral stain, but here it's a class barrier.
      *   **The Bathrobe/Necklace Incident:** Edward snaps the jewelry box on her fingers. Abuse of power. In a NZ model, this is workplace harassment/assault with legal recourse. Here, it's romantic tension.
      *   **The Hotel Manager (Mr. Thompson):** He protects her, but based on *Edward's* status, not her rights. He's a proxy for regulation, but it's paternalistic, not legal.
      *   **Kit's Injury/Death:** The danger of the street. No peer network to protect her.
      *   **The Rescue (Ladder out the window):** Individual salvation vs. structural change.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. *Pretty Woman* is often read as romance, but it's a labor negotiation disguised as love. Introduce the three policy models. State the thesis: The film's "rescue" narrative relies on the *absence* of labor rights, making the Nordic fantasy of "exit" the only viable option, thereby obscuring the viability of decriminalization.

      *   **The Nordic Fantasy (Exit as Victory):** Focus on Edward as the "Good Buyer" who stops buying. The goal is to remove Vivian from the market, not improve the market. This aligns with the Nordic Model's philosophy (demand is the problem).
          *   *Scene:* The final ladder scene. She doesn't become a CEO; she becomes a wife (dependent).

      *   **The Regulatory Void (Germany/Dutch vs. Reality):** The hotel acts as an unlicensed brothel.
          *   *Scene:* Mr. Thompson. He enforces rules (don't steal, dress code) but offers no protection unless Edward wills it.
          *   *Comparison:* In Germany, there'd be a contract. Here, the "week" deal is shaky. The necklace snap is a violation of bodily autonomy that would be an OHS (Occupational Health and Safety) breach in a regulated environment.

      *   **The Decriminalization Gap (New Zealand Model):** This is the strongest critique. What *should* have happened?
          *   *Rights:* Right to refuse (she almost refuses the polo match).
          *   *Recourse:* When Edward hurts her hand, she cries. In NZ, that's a grievance. Here, it's foreplay for emotional intimacy.
          *   *Peer Support:* Kit. Kit dies. In a decrim model, peer networks reduce violence. Vivian is isolated.
          *   *Argument:* The film *cannot* show NZ-style decrim because it would kill the romance. If Vivian had a union rep, she wouldn't need Edward.

      *   **The Structural Necessity of Absence:** Why are there no brothels or inspectors?
          *   If sex work were normalized labor, the class fantasy collapses. Edward isn't saving a "fallen woman"; he's dating a contractor. The stigma is the engine of the plot.
          *   Edward's transformation is a red herring. He becomes a "good man," but the system remains predatory for everyone else (Kit).

      *   **Conclusion:** Summarize. The film is a Nordic Model fable wrapped in rom-com tropes. It argues that individual morality (Edward) solves structural exploitation, rendering policy irrelevant. The "happily ever after" requires the erasure of sex work, not the improvement of sex workers' rights.

  5.  **Refining and Polishing:**
      *   *Tone:* Analytical, critical, academic but accessible.
      *   *Check:* Did I map the specific scenes requested? (Polo, Necklace, Hotel Manager). Yes.
      *   *Check:* Did I address the "red herring" question? Yes.
      *   *Check:* Did I address the "structurally necessary" absence? Yes.
      *   *Nuance:* Ensure I don't just bash the movie but use it as a text to analyze policy implications. Make sure the distinction between Legalization (state control) and Decriminalization (worker control) is clear.

  6.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe compare the hotel to a Dutch brothel.
      *   *Correction:* No, the hotel is more like a gray market. A Dutch brothel would have health checks. The hotel has discretion. Stick to the idea that the hotel manager acts as a *proxy* for authority without the legal backing.
      *   *Emphasis:* Make sure to highlight Kit. Her fate is the counter-narrative to Vivian's luck. It proves the system is deadly without structural change.

  7.  **Final Review:** Does this answer the prompt's specific question about whether the absence is Hollywood or structural? *Verdict:* It's structurally necessary for the specific "rescue" genre. If labor rights existed, the rescue isn't needed.

