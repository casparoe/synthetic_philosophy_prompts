prompt: |-
  What do you think David Lewis—given his commitment to Humean supervenience, his best-system account of laws, and his rejection of primitive modal connections—would have said about the post-2000 revival of dispositional essentialism? Specifically, consider the view that fundamental properties are essentially powers (for instance, that charge is essentially disposed to repel like charges), so that lawlike regularities are grounded in the intrinsic nature of properties rather than in global patterns of categorical distribution. Would Lewis have regarded this as a notational variant of his own framework with modal predicates added, or as a genuine rival that violates Humean supervenience? Respond in one paragraph of no more than 180 words, without citing specific texts or papers; reason only from the philosophical commitments he is known to have held.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Subject:** David Lewis's potential reaction to the post-2000 revival of dispositional essentialism (DE).
      *   **Key Lewisian Commitments:** Humean supervenience (HS), Best-System Account (BSA) of laws, rejection of primitive modal connections (no necessary connections between distinct existences).
      *   **Key DE Claim:** Fundamental properties are essentially powers (e.g., charge essentially repels), grounding laws in intrinsic natures rather than global patterns.
      *   **Question:** Would Lewis see this as a notational variant or a genuine rival violating HS?
      *   **Constraints:** One paragraph, max 180 words, no specific text citations, reason only from known commitments.

  2.  **Deconstruct Lewis's Position vs. Dispositional Essentialism:**
      *   **Lewis (Humean):** The world is a mosaic of local qualitative facts. Laws supervene on this mosaic (BSA). Properties are categorical (qualitative), not inherently modal. No necessary connections between distinct existences. Modality is analyzed via possible worlds (modal realism), not built into actual properties.
      *   **Dispositional Essentialism:** Properties have essences that are modal/dispositional. Laws flow from these essences. There are necessary connections between properties and their manifestations.
      *   **Conflict:** DE directly contradicts HS. HS says everything supervenes on the arrangement of local qualities. DE says the local qualities *themselves* carry modal force/necessary connections that dictate global regularities. DE rejects the Humean mosaic in favor of a world where properties are inherently "pointing" to their manifestations.
      *   **Lewis's Likely Reaction:** He would see it as a genuine rival, not a variant. It violates the core tenet of HS (no necessary connections). It inverts the direction of explanation (Lewis: mosaic -> laws; DE: properties -> laws/mosaic). He famously argued against necessary connections in "New Work for a Theory of Universals" and elsewhere.

  3.  **Drafting the Response (incorporating constraints):**
      *   *Goal:* Argue Lewis would see it as a genuine rival violating HS.
      *   *Reasoning:* HS requires the world to be a mosaic of categorical facts. DE builds modality into the facts themselves.
      *   *Word Count Check:* Keep it tight.

      *Draft 1:*
      Lewis would unequivocally regard dispositional essentialism as a genuine rival that violates Humean supervenience, not merely a notational variant. His framework demands that the world consists entirely of a mosaic of local, categorical qualities, where laws and modality supervene on global patterns of distribution rather than grounding them. Dispositional essentialism inverts this explanatory direction by positing that intrinsic properties possess essential powers, thereby establishing necessary connections between distinct existences. For Lewis, such necessary connections are metaphysically intolerable, as they violate the Humean principle that there are no modal constraints on the recombination of fundamental qualities. By embedding modal force directly into the nature of properties, dispositional essentialism rejects the supervenience base upon which Lewis's best-system account relies. Consequently, he would view this revival as a direct assault on the core Humean insight that reality is free of primitive modal ties, forcing a choice between his sparse ontology of categorical qualities and an ontology where properties inherently dictate their own manifestations across possible worlds.

