answer: |-
  There is no single, canonical lexical item in contemporary philosophy that precisely designates this specific structural asymmetry. While the components of the manoeuvre are well-named—the *genetic fallacy*, *special pleading*, *ideology critique*, and *transcendental argumentation*—the specific configuration of deploying genealogy offensively while blocking it defensively via a selectively applied principle lacks a dedicated term. It is typically subsumed under the broader category of **Special Pleading** or discussed descriptively within critical theory as the **"Paradox of Ideology Critique"** (the problem of how the critic escapes the ideological conditioning they diagnose in others). However, these labels are either too broad (Special Pleading applies to any unjustified exemption) or too contextual (The Paradox of Critique refers to the theoretical problem, not the argumentative manoeuvre itself).

  To capture the precise conceptual carving you request, I propose the term **Genealogical Exceptionalism**.

  ### **Term: Genealogical Exceptionalism**

  **Definition:**
  *Genealogical Exceptionalism* is an argumentative asymmetry in which an agent employs genealogical debunking to undermine the normative authority of an opponent's commitments while simultaneously immunizing their own core commitments against the same genealogical scrutiny. This immunization is achieved by invoking a distinction between genesis and justification (or a claim to transcendental status) that is structurally available to the opponent but selectively denied to them without independent warrant.

  ### **Necessary Conditions**
  For a manoeuvre to qualify as *Genealogical Exceptionalism*, four conditions must be met simultaneously:

  1.  **Offensive Genealogy:** The agent actively traces an opponent's normative commitment ($V_O$) to a contingent, non-truth-tracking origin (e.g., psychological resentment, class interest, historical accident) and treats this origin as undermining the validity of $V_O$.
  2.  **Defensive Immunization:** When the agent's own core commitment ($V_S$) is subjected to analogous genealogical tracing, the agent blocks the debunking inference.
  3.  **Asymmetric Principle:** The block relies on a principled distinction (e.g., "genesis does not equal justification" or "this value is a precondition of agency") that is *not* applied to $V_O$.
  4.  **Lack of Independent Warrant:** The agent fails to provide a neutral, independent criterion for why $V_S$ possesses the exempting property (e.g., transcendental status) while $V_O$ does not, other than the fact that $V_S$ is their own commitment. The distinction is stipulated rather than demonstrated.

  ### **Conceptual Boundaries and Differentiations**

  To ensure precise delimitation, *Genealogical Exceptionalism* must be distinguished from adjacent phenomena where the structural asymmetry is either absent or justified.

  **1. Versus Ordinary Special Pleading**
  *   **Adjacency:** Both involve exempting oneself from a standard applied to others.
  *   **Distinction:** Ordinary Special Pleading is often crude ("I am exempt because I am the leader"). *Genealogical Exceptionalism* is sophisticated; it uses *epistemic principles* (the genesis/justification gap) as the shield. It belongs to a specific subclass of special pleading where the exemption is masked as a methodological necessity. If the exemption is openly admitted as a preference without epistemic cover, it is merely Special Pleading. If it claims epistemic necessity without warrant, it is *Genealogical Exceptionalism*.

  **2. Versus Hypocrisy**
  *   **Adjacency:** Both involve a mismatch between treatment of self and other.
  *   **Distinction:** Hypocrisy is primarily behavioral or moral (failing to practice what one preaches). *Genealogical Exceptionalism* is *epistemic* and *meta-normative*. One can be perfectly consistent in one's behavior while committing this manoeuvre. The fault lies not in violating a moral rule one advocates, but in applying inconsistent standards of *validation* to moral rules.

  **3. Versus Motte-and-Bailey**
  *   **Adjacency:** Both are defensive rhetorical strategies.
  *   **Distinction:** The Motte-and-Bailey involves shifting the *content* of a claim between a bold position (Bailey) and a defensible one (Motte) when attacked. *Genealogical Exceptionalism* keeps the *content* of the value stable but shifts the *criteria of evaluation*. It does not retreat to a weaker claim; it insists on the same strong claim but changes the rules of evidence to protect it.

  **4. Versus Legitimate Transcendental Argumentation**
  *   **Adjacency:** Both claim certain values are immune to empirical debunking because they are preconditions of reasoning.
  *   **Distinction:** A legitimate transcendental argument demonstrates that *any* agent engaging in the critique must presuppose the value in question (universal scope). *Genealogical Exceptionalism* asserts this status *only* for the speaker's specific conception of the value, while allowing the opponent's conception to remain contingent. If the speaker can show that the opponent *also* necessarily presupposes $V_S$ to make their critique, the manoeuvre is valid. If they claim $V_S$ is transcendental for *them* but merely psychological for the *opponent*, it is *Genealogical Exceptionalism*.

  **5. Versus The Genetic Fallacy**
  *   **Adjacency:** Both involve reasoning about origins.
  *   **Distinction:** The Genetic Fallacy is the claim that origin *always* determines validity. *Genealogical Exceptionalism* is more subtle: it claims origin determines validity *for you*, but not *for me*. It is not a confusion of genesis and justification; it is a selective application of their separation.

  ### **Summary of the Conceptual Carving**
  *Genealogical Exceptionalism* is not merely bias; it is a structural inconsistency in the *economy of justification*. It occupies the specific niche where **meta-ethical skepticism** is weaponized against an opponent but suspended for the self via an unjustified appeal to **meta-ethical realism** or **transcendental privilege**. It is the claim to stand outside the historical stream when evaluating one's own anchors, while insisting everyone else is swept along by the current.
