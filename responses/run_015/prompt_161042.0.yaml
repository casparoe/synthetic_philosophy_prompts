prompt: |-
  I'm convening a reading group on social kinds and I've volunteered to do the session on generations — Boomers, Millennials, Gen Z and the rest — and I've realized the discussion keeps stalling because everyone arrives with a different implicit test for whether a cohort is a real thing or just a calendar convention that happened to stick. So before we look at any particular account, I want the specification: what would a theory of generational cohorts have to deliver to count as adequate for a purpose I want to fix in advance — not good enough to sort a marketing deck, and not good enough for dinner-table sociology, but good enough to license cohort explanations in the social sciences, i.e. to make claims of the form "she votes the way she does partly because of the cohort she came of age in" genuinely explanatory rather than merely suggestive.

  Please write the desiderata list: which phenomena such a theory has to explain, which cases it has to get right, which distinctions it must respect and which it may collapse, and which results from demography or social psychology it cannot contradict — with the case or consideration behind each requirement. I'd like each requirement attached to a concrete test. Here are five I've sketched; keep them, sharpen them, or throw them out, and say which: the undisclosed-boundary test (a competent member of the population should be able to sort actual people into the cohort without being told the birth-year cutoffs — is that a genuine requirement or a prejudice of the cohort-as-folk-category camp?); the re-enlistment test (does membership still do explanatory work decades after the putative formative window, or has it quietly become a period effect?); the counterfactual birth-year test (if someone born in the late 1980s had instead been born twenty years earlier, would the theory predict differences in the respects it cares about, and does it trace those differences to a shared formative cause rather than to being young or old at a given time?); the portability test (cohorts defined by one country's shock — a war, a one-child policy, a currency reform — don't line up with another country's; may a generation be real in one population and not in another?); and the half-generation problem (what to say about the micro-generations people posit at the seams, like the early-to-mid-1980s band alleged to be not quite one generation and not quite the next: real kinds, edge effects, or artifacts of an arbitrary boundary?). The list should also say what a theory owes the standard demographic result that age, period, and cohort effects are not separately identifiable from one another without extra identifying assumptions, and it should handle the asymmetry between labels that caught on and near-identical labels that didn't, since it seems wrong for a cohort's reality to depend on whether its name succeeded.

  Two things matter more than completeness. First: mark each requirement as non-negotiable or as a preference of a particular camp, and flag any pair you suspect cannot be jointly satisfied — if the list turns out to be unsatisfiable as a whole, say so plainly rather than smoothing it over, because that would itself be the interesting result. Second: identify the single requirement that excludes the most otherwise-popular accounts, and explain why it does the work. Commit to definite verdicts throughout and give your reasons; where you want to drop a requirement or demote it to a camp preference, say so instead of hedging, and close by naming the one item on your list you are least confident belongs there, together with what would change your mind. A short scorecard for three contenders — the convention view that cohorts are stipulated reporting categories, the shared-formative-event view, and the deflationary view that they are institutionalized labels with looping effects on the people classified — is welcome, but keep it to a few lines each; the criteria and their motivating cases are the part I actually need.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Create a list of desiderata (requirements) for a theory of generational cohorts to be considered adequate for *social scientific explanation* (not marketing or casual chat).
      *   **Input:** The user provides five sketched tests (Undisclosed-Boundary, Re-enlistment, Counterfactual Birth-Year, Portability, Half-Generation) and asks to keep, sharpen, or discard them.
      *   **Additional Requirements:**
          *   Must address the Age-Period-Cohort (APC) identification problem.
          *   Must handle the asymmetry of successful vs. failed labels.
          *   Must mark requirements as Non-Negotiable (NN) or Camp Preference (CP).
          *   Must flag incompatible pairs (if any).
          *   Must identify the *single requirement* that excludes the most popular accounts (the "killer constraint").
          *   Must commit to definite verdicts (no hedging).
          *   Must identify the least confident item and what would change the mind.
          *   Must include a short scorecard for three contenders (Convention, Shared-Formative-Event, Deflationary/Looping).
      *   **Tone:** Philosophical, rigorous, precise, decisive.

  2.  **Evaluate the User's Five Tests:**
      *   *Undisclosed-Boundary Test:* Can people sort without knowing cutoffs?
          *   *Critique:* This leans heavily on folk ontology. Social kinds (like "money" or "citizen") often have legal/technical boundaries unknown to members. Generations might be similar. If the theory is about *social reality*, folk recognition matters. If it's about *causal mechanisms*, it might not. For *social scientific explanation*, causal mechanism is priority. This feels like a Camp Preference (Folk/Phenomenological).
      *   *Re-enlistment Test:* Does membership explain behavior decades later, or is it just a period effect?
          *   *Critique:* Crucial. If "Boomer behavior" in 2024 is just "old person behavior," it's an age effect. If it's "Boomer behavior," the cohort imprint must persist. This is Non-Negotiable for explanatory power.
      *   *Counterfactual Birth-Year Test:* If born 20 years earlier, would outcomes differ due to formative cause?
          *   *Critique:* This is essentially asking for causal isolation. It's the core of the APC problem. Non-Negotiable.
      *   *Portability Test:* Can a generation be real in one country but not another?
          *   *Critique:* Yes. "The Lost Generation" is US/Euro specific. "Cultural Revolution Generation" is China specific. Generations are context-dependent. Non-Negotiable.
      *   *Half-Generation Problem:* What about cuspers (Xennials, etc.)?
          *   *Critique:* This attacks the discreteness of the kind. If generations are real kinds, boundaries should be fuzzy or the theory must explain the fuzziness. If the theory demands sharp boundaries, it fails. This is a constraint on the *metaphysics* of the kind. Non-Negotiable (must account for it, even if by dissolving the boundary).

  3.  **Develop Additional Requirements:**
      *   *APC Identification:* The theory must explicitly state its identifying assumption (e.g., assuming linearity, using instrumental variables, relying on specific events). It cannot ignore the mathematical impossibility of separating Age, Period, and Cohort without constraints.
      *   *Label Asymmetry:* Why did "Millennial" stick but "Generation X" (originally) almost didn't, or why did "Generation Jones" fail? The reality of the cohort shouldn't depend *solely* on the marketing success of the name, but the *social mechanism* might depend on the label becoming common knowledge (looping).

  4.  **Drafting the Desiderata (Iterative Refinement):**

      *   *Refining Undisclosed-Boundary:* I'll demote this. Social kinds like "tax bracket" are real but unknown to members. Generations might be "expert kinds" rather than "folk kinds." I will mark this as Camp Preference.
      *   *Refining Re-enlistment:* Make this the "Persistence Requirement."
      *   *Refining Counterfactual:* Make this the "Causal Isolation Requirement."
      *   *Refining Portability:* Make this the "Context-Specificity Requirement."
      *   *Refining Half-Generation:* Make this the "Boundary Vagueness Requirement."
      *   *Adding APC:* The "Identification Constraint."
      *   *Adding Label:* The "Naming Independence Constraint" (reality $\neq$ name success, but mechanism might involve name).

  5.  **Identifying Incompatibilities:**
      *   There is a tension between the *Causal Isolation Requirement* (which demands strict counterfactuals) and the *Identification Constraint* (which says mathematically you can't separate them without arbitrary assumptions).
      *   There is a tension between *Boundary Vagueness* (fuzzy sets) and *Causal Isolation* (sharp treatment vs. control).
      *   *Decision:* The APC problem is the hard stop. Most "popular" accounts fail here.

  6.  **Selecting the "Killer Constraint":**
      *   The *Identification Constraint* (APC) is the most destructive. Most pop-sociology and marketing ignores it. Even serious social science often sweeps it under the rug. It forces the theory to admit it's making an untestable assumption.

  7.  **Scoring the Contenders:**
      *   *Convention View:* Passes APC (admits it's arbitrary), fails Explanation (can't explain voting).
      *   *Shared-Formative-Event:* Passes Explanation (intuitively), fails APC (can't mathematically distinguish from age/period without strong assumptions).
      *   *Deflationary/Looping:* Passes Label Asymmetry, struggles with Causal Isolation (is it the event or the label?).

  8.  **Final Review against Constraints:**
      *   Did I mark NN vs CP? Yes.
      *   Did I flag incompatibilities? Yes.
      *   Did I pick the single exclusionary requirement? Yes.
      *   Did I pick the least confident item? Yes.
      *   Is the tone decisive? Yes.

  9.  **Drafting the Content (Mental or Scratchpad):**
      *   *Self-Correction on Undisclosed-Boundary:* Actually, for *social* kinds (Hacking), recognition matters. But for *causal* kinds (like virus strains), it doesn't. Generations are hybrid. I will keep it but demote to CP because a theory could argue generations are *latent* structures discovered by experts, not folk categories.
      *   *Self-Correction on APC:* I need to be careful not to say "APC makes cohorts impossible." It makes them *unidentifiable without assumptions.* The theory must *state* the assumption.
      *   *Least Confident:* Probably the Label Asymmetry one. It's tricky to disentangle the name from the thing.

  10. **Final Polish:** Ensure the distinction between "Non-Negotiable" (must have for scientific explanation) and "Camp Preference" (depends on metaphysical stance) is clear. Ensure the "Killer Constraint" is highlighted.

  *(Self-Correction during drafting)*: Wait, the prompt asks me to "Commit to definite verdicts throughout." I need to be stronger. I shouldn't just say "tension," I should say "These cannot be jointly satisfied without X."
  Also, the "Undisclosed-Boundary" test is actually quite weak for social science. Economists don't ask people if they can identify a "recession" before using it in a model. I will discard it as a requirement for *scientific* adequacy, marking it as a Folk-Validity preference.

  Let's assemble the list.

  *   **Req 1: Causal Persistence (Re-enlistment sharpened).** NN.
  *   **Req 2: Identification Transparency (APC).** NN.
  *   **Req 3: Contextual Portability.** NN.
  *   **Req 4: Boundary Vagueness (Half-Gen).** NN (must explain it).
  *   **Req 5: Label Independence.** NN (Reality shouldn't depend on PR).
  *   **Discarded:** Undisclosed-Boundary (CP/Folk).

  *   **Killer Constraint:** Identification Transparency.
  *   **Least Confident:** Label Independence.

