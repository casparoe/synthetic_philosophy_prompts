answer: |-
  This is a fantastic angle. You have the exact kind of biological literacy that most philosophers of mind lack, which gives you license to press hard on the "selection" mechanism without being dismissed as ignorant of the theory. Millikan's view (*Language, Thought, and Other Biological Categories*) relies heavily on a specific notion of "Proper Function" (selected effect function), and biologists often find the leap from "selected effect" to "semantic content" to be the shakiest bridge in the whole project.

  Here are ten questions designed to leverage your background while hitting the philosophical pressure points you requested. Each includes a "Follow-up" designed to prevent the guest from retreating into standard jargon.

  ### 1. The "Selection Fixing Content" Problem (Required)
  **Question:** "In the lab, when we talk about selection, we're talking about differential reproductive success of phenotypes over generations. But teleosemantics claims that this history *constitutes* the content of a current mental state. My worry is that selection acts on the *mechanism's survival*, not on the *truth* of its output. Can you walk me through the precise mechanism where a history of reproductive success transforms into a norm of truth? How does 'survival' become 'accuracy'?"

  **Follow-up:** "If I hear you right, you're saying the content is whatever condition was *necessary* for the ancestor's survival. But selection is notoriously coarse-grained. If a frog's detector survived because it caught flies, but also incidentally caught BB pellets without penalty in the ancestral environment, why is the content 'fly' and not 'fly-or-BB'? How does selection prune the disjuncts?"

  ### 2. The Misrepresentation Problem (Required)
  **Question:** "This is the classic worry, but I want to frame it biologically. If a mechanism's content is defined by its Proper Function (what it was selected to do), then when it fires, it seems to be doing exactly what it exists to do. If a perceptual system fires in the presence of a predator, it's performing its function. If it fires in the absence of a predator (a false positive), isn't that just a different kind of performance? How do you get *error* out of a system that is defined solely by what it *should* do?"

  **Follow-up:** "You'll likely appeal to 'Normal Conditions'—conditions under which the mechanism historically performed its function. But biologically, 'Normal' is just a statistical average of the past. If a system fails in a way that is statistically rare but physically determined, why is that a *semantic* failure rather than just a causal breakdown? Where is the line between a broken leg and a false belief?"

  ### 3. Dispositional vs. Historical Functions (Required)
  **Question:** "I've read your critique of dispositional accounts of function—the idea that a heart's function is just what hearts *do*. You argue this collapses into circularity because it can't account for malfunction. But in molecular genetics, we often define function dispositionally: a promoter's function is to initiate transcription. If it mutates and doesn't, we say it lost its function, not that it's 'misrepresenting.' Why does the mental case *require* a historical etiology when the molecular case seems to get by with current causal role?"

  **Follow-up:** "Suppose we clone a mammal today, and due to a random mutation, its visual cortex has a novel disposition that never existed in the lineage, but it works perfectly well in its current environment. On your view, does this system lack content because it lacks the selection history? If so, aren't we making content dependent on genealogy rather than current utility?"

  ### 4. The Grain of Selection (The "Qua" Problem)
  **Question:** "Selection rarely selects for a single, specific variable. It selects for a cluster of correlated traits. In teleosemantics, we say a frog's visual state represents 'fly.' But the selection pressure was likely for 'nutritious moving thing.' How do you determine the *grain* of the content? Why isn't the content 'food' or 'moving black dot'? What fixes the specific identity conditions of the representation when the selection pressure is always a messy cluster of environmental factors?"

  **Follow-up:** "If you say the content is fixed by the specific explanation of why the mechanism persisted, aren't we relying on the *philosopher's* description of the selection pressure rather than the biology itself? Doesn't this make content relative to how we describe the evolutionary history, rather than an intrinsic property of the organism?"

  ### 5. Novelty and Derived Proper Functions
  **Question:** "Humans represent things that never existed in our Environment of Evolutionary Adaptedness—quantum mechanics, stock markets, Twitter feeds. Millikan handles this with 'Derived Proper Functions,' where new mechanisms are built from old ones. But at some point, the chain of selection has to ground out. How far can we stretch the 'selected for' requirement before it becomes a metaphor? Are we saying my belief in 'inflation' is backed by the same biological normativity as my belief in 'predator'?"

  **Follow-up:** "If the content of 'inflation' relies on a chain of learning mechanisms that were selected for, doesn't that make the content incredibly unstable? If my learning mechanism was selected for spatial navigation, but I use it to learn economics, have I misrepresented economics by biological standards?"

  ### 6. The Normativity of "Malfunction"
  **Question:** "You argue that teleosemantics naturalizes normativity—it explains how an 'ought' arises from an 'is.' But in biology, a 'malfunction' is usually just a deviation from a type that reduces fitness. It's descriptive. In semantics, a 'false belief' is normative; it *ought* not to be held. How do you bridge the gap from 'this mechanism reduces fitness' to 'this belief is incorrect'? Why is fitness failure the same thing as truth failure?"

  **Follow-up:** "Consider a belief that is false but increases fitness (a beneficial delusion). Teleosemantics seems forced to say this is a 'good' malfunction or perhaps even veridical if the function is survival rather than truth. Does your view force us to say that adaptive falsehoods are actually *true* representations because they fulfill the biological function?"

  ### 7. Internalism vs. Externalism (The Twin Earth Pressure)
  **Question:** "Teleosemantics is radically externalist. Content depends on the history of the lineage, not just the current internal state. If I have a molecule-for-molecule duplicate of myself on Twin Earth, but their ancestors were selected for different environmental pressures, you'd say we have different beliefs. From a neurobiological perspective, this is strange. The causal power is in the head. Why should the 'meaning' depend on a historical ghost that has no current causal influence on the neuron's firing?"

  **Follow-up:** "If history fixes content, then psychology becomes impossible because we can't observe selection history in real-time. We can only observe current structure and function. Are you conceding that teleosemantics is a metaphysical claim that has no predictive power for actual cognitive science?"

  ### 8. Learning and Plasticity
  **Question:** "In complex organisms, the 'representational mechanism' isn't a fixed circuit like a frog's bug detector; it's a plastic learning system. The selection happened on the *capacity to learn*, not the specific content learned. Does this shift the burden of content fixation from phylogenetic history to ontogenetic history? If so, does teleosemantics collapse into a causal theory of reference for learned beliefs?"

  **Follow-up:** "If the content of a learned belief is fixed by the history of the *learning mechanism*, then two people with different learning histories could have different contents for the same concept 'dog.' Does this lead to a radical individualism where communication is biologically impossible because our selection histories differ?"

  ### 9. The Molecular Analogy (Leveraging Your Background)
  **Question:** "In my field, we talk about signaling pathways. A ligand binds a receptor, and we say the cell 'recognizes' the signal. But we don't attribute *misrepresentation* to the cell if a drug mimics the ligand. We just call it agonism. Why does the nervous system get a semantic description while the immune system gets a causal description? Is there a hard line where biological signaling becomes mental representation, or is teleosemantics trying to semanticize all of biology?"

  **Follow-up:** "If you say the difference is the complexity of the consumer system, aren't we just drawing an arbitrary line? If a bacterium's chemotaxis is governed by selected effects, does the bacterium have 'false beliefs' about glucose gradients? If not, why does the frog get beliefs but the bacterium doesn't?"

  ### 10. The "So What?" (Theoretical Utility)
  **Question:** "Let's step back. Functionalism and causal theories of mind don't require heavy evolutionary history. They work with current causal roles. What does teleosemantics *buy* us that these simpler theories don't? Is the ability to ground misrepresentation worth the metaphysical baggage of essentializing traits by their history? If we can explain behavior without invoking 'selected content,' is teleosemantics an explanation or just a story we tell?"

  **Follow-up:** "If a future AI has no biological selection history but behaves exactly like a human, teleosemantics says it has no mind/content. Is this a feature or a bug of your theory? Are you willing to accept biological chauvinism as the cost of solving the misrepresentation problem?"

  ### Advice for the Interview
  *   **On the "History vs. Disposition" question:** Philosophers love to argue that dispositions are circular (a function is what it does, so malfunction is impossible). Your job is to press that in *biology*, we identify function by structure and current causal role all the time without knowing the history. Ask him why mind is special.
  *   **On "Selection Fixing Content":** This is the weakest link in Millikan's chain. Selection is blind; it doesn't "know" what truth is. If he appeals to "Normal Conditions," press him on who defines "Normal." Is it the philosopher or the environment?
  *   **Tone:** You are the "empirical check." You aren't attacking the logic; you are attacking the biological plausibility. Use phrases like *"In the wet lab, we see..."* or *"From a population genetics standpoint..."* to ground your challenges.
