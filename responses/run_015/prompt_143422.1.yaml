answer: |-
  # Desiderata for a Doing/Allowing Distinction in Hybrid Clinical Systems

  To function within an institutional ethics framework governing hybrid human-algorithmic systems (e.g., automated ventilation protocols, algorithmic triage), a theory of the doing/allowing distinction must satisfy the following desiderata. These criteria are designed to ensure the theory is actionable, legally defensible, and morally coherent in environments where agency is distributed across biological and digital actors.

  ## I. Desiderata on Case Coverage
  *The theory must yield intuitively and normatively stable verdicts on the following paradigmatic cases.*

  1.  **Direct Physical Intervention:**
      *   **Case:** A physician manually turns off a ventilator following a family request.
      *   **Requirement:** The theory must classify this as a **Doing** (active termination), regardless of whether the outcome (death) is identical to natural cessation. It must account for the causal immediacy of the physical act.
      *   **Status:** **[Non-Negotiable]**. Legal and moral traditions universally treat direct physical termination as distinct from passive allowance, even if the moral permissibility is debated.

  2.  **Authorization of Automated Execution:**
      *   **Case:** A physician authorizes a protocol where an algorithm withholds ventilation if a risk score exceeds a threshold. The algorithm executes the withholding.
      *   **Requirement:** The theory must **not** automatically classify the resulting death as a "Doing" by the physician simply because they authorized the system. It must distinguish between setting the *conditions* for action and the *execution* of the action.
      *   **Status:** **[Non-Negotiable]**. If every automated outcome is classified as a direct "doing" by the human authorizer, the distinction collapses, rendering the concept useless for risk assessment and liability.

  3.  **Failure to Rescue (Machine-Assigned):**
      *   **Case:** A monitoring algorithm is assigned to detect distress. It fails to flag a crisis. The physician, relying on the system, does not intervene.
      *   **Requirement:** The theory must distinguish between an **Omission that Violates a Duty** (negligence in oversight) and an **Allowing of Natural Course** (system failure beyond reasonable anticipation). It must assess whether the duty to rescue was successfully delegated.
      *   **Status:** **[Non-Negotiable]**. Institutional ethics requires differentiating between systemic failure and individual negligence.

  4.  **Redirection of Scarce Resources:**
      *   **Case:** A triage algorithm assigns the last ventilator to Patient A; Patient B dies.
      *   **Requirement:** The theory must classify the death of Patient B as **Allowing** (letting die via resource scarcity) rather than **Killing** (active deprivation), provided the allocation criteria were neutral and not targeted at Patient B's demise.
      *   **Status:** **[Non-Negotiable]**. Triage relies on the moral asymmetry between killing and letting die to remain permissible under emergency standards.

  ## II. Desiderata on Conceptual Integrity
  *The theory must maintain specific conceptual boundaries to prevent moral confusion.*

  1.  **Causal Contribution vs. Normative Responsibility:**
      *   **Requirement:** The theory must not equate being a *cause* with being *responsible*. A programmer may be a causal link in a fatal algorithm, but not normatively responsible for a specific clinical death if the deployment was outside their control.
      *   **Status:** **[Non-Negotiable]**. Conflating causation with blame leads to "moral crumple zones" where individuals are held liable for structural inevitabilities.

  2.  **Intending vs. Foreseeing:**
      *   **Requirement:** The theory must accommodate the distinction between aiming at a death (e.g., euthanasia) and foreseeing it as a side effect (e.g., palliative sedation or risk-based withholding).
      *   **Status:** **[Camp-Specific Preference]**. This is central to Doctrine of Double Effect (DDE) frameworks (Deontological/Catholic) but is often rejected by Consequentialists who view intent as irrelevant to outcome. However, for *institutional* policy, this distinction is practically **[Non-Negotiable]** for legal compliance in many jurisdictions.

  3.  **Individual vs. Distributed Agency:**
      *   **Requirement:** The theory must not force a "single agent" model onto a distributed system. It must allow for *shared doing* or *structural doing* where the "act" emerges from the interaction of human intent, code, and institutional constraints.
      *   **Status:** **[Non-Negotiable]**. Hybrid systems are ontologically distributed; a theory demanding singular agency will fail to describe reality.

  4.  **Duty-Violating Omission vs. Natural Course:**
      *   **Requirement:** The theory must distinguish between *not saving* (when there is no duty) and *letting die* (when there is a duty but it is forgone). In hybrid systems, this depends on whether the automation validly assumed the duty.
      *   **Status:** **[Non-Negotiable]**. This is the core of the doing/allowing distinction in medical law.

  ## III. Desiderata on Empirical Adequacy
  *The theory must remain consistent with findings from moral psychology and organizational cognition.*

  1.  **Representation of Causal Role:**
      *   **Finding:** Humans in "human-in-the-loop" systems often experience **attenuated agency**; they perceive themselves as monitors rather than actors, even when they hold veto power.
      *   **Requirement:** The theory cannot assign "Doing" status based solely on the *capacity* to intervene if the cognitive architecture of the system systematically inhibits the *representation* of that capacity.
      *   **Status:** **[Non-Negotiable]**. A theory that ignores cognitive reality will fail to guide behavior or assign fair blame.

  2.  **Automation Bias and Diffusion of Responsibility:**
      *   **Finding:** Agents systematically over-trust algorithmic outputs and diffuse responsibility across the "system."
      *   **Requirement:** The theory must account for **culpable ignorance**. If an agent *should* have recognized the algorithmic error but didn't due to complacency, the "Allowing" may shift to a negligent "Doing" (via prior omission).
      *   **Status:** **[Non-Negotiable]**. Essential for maintaining professional standards of care.

  ## IV. Classification of Desiderata: Non-Negotiable vs. Camp-Specific

  | Desideratum | Classification | Rationale |
  | :--- | :--- | :--- |
  | **No Automatic Authorizer Liability** | **Non-Negotiable** | Essential for the viability of medical AI. If authorizing a tool makes one liable for all specific outputs as "killings," innovation halts and defensive medicine prevails. |
  | **Bodily Motion as Necessary for "Doing"** | **Camp-Specific** | **Traditionalist/Physicalist.** This preference must be **rejected** for hybrid systems. Code execution is functionally equivalent to bodily motion in clinical outcomes. Insisting on muscle movement renders the theory obsolete. |
  | **Intent Matters (Intending vs. Foreseeing)** | **Hybrid** | Philosophically camp-specific (Deontological), but **Institutionally Non-Negotiable** in many legal frameworks (e.g., murder vs. manslaughter vs. natural death). |
  | **Singular Causal Attribution** | **Camp-Specific** | **Individualist.** Must be **rejected**. Hybrid systems require a model of distributed causation. |
  | **Duty-Based Omission Analysis** | **Non-Negotiable** | Institutional ethics are inherently duty-based (fiduciary relationship). |

  ## V. Consistency Analysis: Joint Unsatisfiability

  There is a critical tension within these desiderata that renders a subset **jointly unsatisfiable** under traditional metaphysical models.

  **The Conflict:**
  1.  **Desideratum I.2 (Authorization):** Requires that the human authorizer is *not* the direct "doer" of the specific automated act.
  2.  **Desideratum II.3 (Distributed Agency):** Requires that the "act" is not attributed to a single agent but emerges from the system.
  3.  **Desideratum IV (Duty-Based Omission):** Requires that we identify *who* violated a duty to determine if an omission was culpable.

  **The Unsatisfiable Subset:**
  If a theory demands **Precise Agent-Level Causation** (a camp-specific preference often implicit in legal liability) *combined with* **Distributed Agency** (Non-Negotiable Desideratum II.3), it creates a paradox.
  *   In a distributed system, the specific causal chain leading to death may pass through code weights, data biases, and institutional protocols that no single human fully controls or understands.
  *   If the theory insists on pinpointing a specific human "doer" for every death (to satisfy legal liability norms), it contradicts the reality of distributed execution.
  *   **Resolution:** The theory must abandon the requirement for *singular* human causation in favor of **shared normative responsibility**. It must accept that some deaths in hybrid systems are "Structural Allowings" where no individual "Did" the killing, yet the institution bears responsibility. If the framework insists on finding an individual killer for every algorithmic death, the desiderata are unsatisfiable.

  ## VI. Brief Assessment of Existing Theoretical Accounts

  1.  **Causal Accounts (e.g., Quinn, Foot):**
      *   *Performance:* **Poor.** These theories often rely on physical chains of events. They struggle with Desideratum I.2 (Authorization) because the causal chain leads back to the programmer/authorizer. They risk collapsing the distinction by making the authorizer the cause of all downstream events. They also fail Desideratum II.3 by seeking singular causal agents.
  2.  **Normative-Role Accounts (e.g., Scheffler, Institutional Duty):**
      *   *Performance:* **Strong.** These focus on the violation of specific duties. They handle Desideratum I.3 (Failure to Rescue) well by asking "Was there a duty to override?" They accommodate Desideratum II.1 (Causal vs. Normative) by decoupling blame from pure causation. However, they struggle with Desideratum I.4 (Resource Redirection) if the duty to save is absolute.
  3.  **Counterfactual-Dependency Accounts:**
      *   *Performance:* **Mixed.** These ask "Would the patient have died if the agent hadn't acted?" In hybrid systems, this is difficult. If the algorithm would have acted anyway (due to hard-coding), the human's failure to intervene shows no counterfactual dependency. This risks exonerating negligent overseers (violating Desideratum III.2). It handles Distributed Agency (II.3) better than causal accounts but can be too granular for institutional policy.

  **Conclusion:** An adequate framework must prioritize **Normative-Role** criteria over strict **Causal** criteria, explicitly rejecting the "Bodily Motion" constraint. It must accept that in hybrid systems, the "Doing/Allowing" distinction is not a metaphysical fact about the world, but a normative tool for assigning **degrees of responsibility** across a network, rather than locating a singular moral author of death.
