answer: |-
  Dear Colleague,

  It is always a pleasure to hear that your graduate students are pushing back with arguments of this caliber, and I must say your student has constructed a fascinating puzzle that touches on some of the deepest tensions in realist ontology. The argument she has sketched, this co-instantiation looping, is a clever variation on classic regress problems that have haunted metaphysics for centuries, and it is understandable why it feels difficult to unwind at first glance. The intuition driving it is powerful: if we posit entities to explain sharing, do we not merely create more things that need explaining? However, I believe your instinct about a scope slip is precisely correct, and the argument fails not because realism is impossible, but because it conflates two distinct ontological categories regarding how universals relate to complexes. To resolve this, we need to slow down and examine the transition from the existence of a fact to the instantiation of a universal within that fact, because that is where the logical machinery jams.

  Let us walk through the chain together to see where the tension resolves. The first step posits that if a universal is present in two particulars, there is a structural fact of that co-presence. This is generally acceptable to a realist who believes in states of affairs; if redness is in apple one and apple two, there is a truthmaker for the claim that redness is shared. The second step claims that this fact contains the universal. Again, this is standard fare for immanent realism; facts are complexes composed of particulars and universals. The trouble begins in the third step, where she argues that because the fact contains the universal, the universal is instantiated within the fact. This is the critical slide, and it rests on an equivocation between being a constituent of a complex and being instantiated by a subject. When we say a universal is instantiated in a particular, we mean the particular exemplifies the property. But a fact is not a particular in the same sense; it is not a substrate that bears properties, but rather a unity formed by the bearing of properties. To say the fact contains the universal is to say the universal is part of the structure of the fact, not that the fact itself is another instance of the universal.

  Consider the distinction more closely. If we have a brick wall, the bricks are constituents of the wall. But the wall does not therefore instantiate brickness in the same way a clay lump instantiates brick-shape before firing. The wall is made of bricks, but the wall is not a brick. Similarly, a state of affairs is composed of a particular and a universal, but the state of affairs does not itself instantiate that universal. If it did, we would indeed face the exponential explosion your student describes, because every fact would become a new particular requiring its own property instance, leading to an infinite regress. But there is no ontological requirement to treat facts as property-bearing substrates. They are the results of instantiation, not the subjects of it. By rejecting the third step, we block the loop. The universal is present in the particular, and it is present in the fact as a constituent, but it is not instantiated by the fact. This preserves the numerical identity of the universal across the original particulars without generating new instances.

  You asked what rejecting this step costs us, and it is a fair question because no metaphysical move is free. The primary cost is that we must maintain a strict categorical distinction between particulars and facts. We cannot allow our ontology to flatten out so that facts are just another kind of particular. If we treat facts as particulars, the student's argument succeeds, and we are forced into nominalism or a very strange form of realism where every truth generates a new property instance. So, we must commit to the view that instantiation is a non-symmetric relation that only runs from particulars to universals, or perhaps from particulars to states of affairs, but never from states of affairs back to universals in a way that generates new instances. This does not force us to accept mysterious uninstantiated universals hovering in a Platonic heaven, because the universal is still fully present in the original particulars. It remains immanent. Nor does it require us to give up the idea that facts have internal structure; in fact, it requires us to affirm that structure precisely to explain why the universal is there without being re-instantiated. The structure of the fact explains the presence of the universal without triggering a new round of instantiation.

  There is also the worry your student raised about whether this applies to relations or resemblance nominalism. If we are nominalists and say two particulars resemble each other, is there a fact of resemblance? If so, does that fact resemble the particulars? The realist has an easier time here because the universal is the same entity in each place, so the fact of co-instantiation is just the universal doing its job. The nominalist actually has a harder time avoiding this regress because if resemblance is a relation, it seems to require its own instance. However, for the realist, the solution remains the same: the relation is a constituent of the fact, not instantiated by it. The cost here is simply vigilance against category mistakes. We must be careful not to reify our truthmakers into new subjects of predication. When we say it is a fact that U is in a and b, we are not saying there is a new thing F that has U; we are saying there is a complex entity whose constituents include U, a, and b. The unity of that complex is provided by the instantiation relation itself, not by a further fact.

  Ultimately, the argument proves too much because it assumes that any presence of a universal counts as an instantiation. But instantiation is a specific technical notion in metaphysics, denoting the tie between a substrate and a property. Presence within a composite is not instantiation. If we accept this distinction, the exponential explosion vanishes. The universal is multiplied in terms of its occurrences in different facts, but not in its own identity. It remains one and the same entity shared across the particulars. This allows us to keep the core realist intuition that shared properties are genuinely shared without collapsing into a nominalism of tropes. The student's argument is a valuable stress test because it forces us to clarify the ontology of facts, but it does not dismantle realism. It merely reminds us that we cannot treat the containers of truth as if they were themselves the subjects of truth in the same way. I hope this helps you unwind the knot for your seminar; it is a sophisticated objection that deserves a sophisticated distinction, and I suspect your student will appreciate the rigor of the response.
