      *   *Clarification:* Ensure I distinguish between the universal being *in* the fact versus the fact *having* the universal.
      *   *Flow:* Start with appreciation, move to the diagnosis of the category mistake, explain why step 3 fails, discuss the implications for fact structure, and conclude with the viability of realism.
      *   *Word Choice:* Avoid technical jargon where possible, or explain it. Use "state of affairs" interchangeably with "fact" if needed for clarity, but stick mostly to the student's terminology.
      *   *Length:* Needs to be substantial enough to cover the reasoning thoroughly but not rambling.

  7.  **Final Review against constraints:**
