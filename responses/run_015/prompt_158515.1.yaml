answer: |-
  You have constructed a very sharp objection that hits on one of the most common misunderstandings of deflationism. You are absolutely right to suspect an equivocation.

  The specific equivocation is between **semantic content** (metaphysical weight) and **logical utility** (expressive power).

  To save your intuition in (1) without accepting the overkill conclusion in (7), you should **drop (or radically modify) Step (4).**

  Here is the breakdown of why (4) is the weak link, how to fix the argument, and what the cost is.

  ### 1. The Equivocation: Content vs. Work
  Your suspicion in the final paragraph is correct. Deflationists agree that "true" adds no *substantive* content (it doesn't name a metaphysical glue that binds words to the world), but they vehemently deny that it does no *work*.

  **Step (4) claims:** *If "truth" isn't a real property, talk of truth is empty repetition.*

  This is false. Consider the word "therefore." It adds no factual content to a sentence. "It is raining; therefore, the ground is wet" contains the same facts as "It is raining; the ground is wet." But "therefore" does immense logical work: it signals an inference.

  Deflationists argue "true" is a **logical device**, not a descriptive adjective. Its "work" is **expressive utility**.

  **Example of the work "true" does:**
  Without the word "true," you cannot generalize.
  *   **With "true":** "Everything the witness said is true."
  *   **Without "true":** "If the witness said snow is white, snow is white; and if the witness said grass is green, grass is green; and if the witness said..." (ad infinitum).

  You need the word "true" to quantify over propositions. It allows you to endorse claims without repeating them. So, (4) is false: "True" is not empty repetition; it is a tool for **anaphora** (referring back to previous statements) and **generalization**.

  ### 2. Re-evaluating Step (5) and (6)
  Your climate science example is interesting, but a deflationist would argue it highlights a pragmatic confusion, not a logical flaw in deflationism.

  **Step (5) claims:** *People can reject "P is true" without rejecting P.*

  **The Deflationist Counter:** If someone says, "I accept CO2 traps heat, but I deny it is *true* that CO2 traps heat," the deflationist says this person is **misusing the word "true."**

  They are treating "true" as if it means "certified by authority" or "beyond doubt." But in the deflationary sense, "true" is just a disquotational device.
  *   If you accept $P$, you are logically committed to "$P$ is true."
  *   If you deny "$P$ is true," you are logically committed to denying $P$.

  If someone tries to split them, they aren't proving deflationism false; they are proving that people often confuse the logical predicate "true" with the sociological concept of "official truth." Step (6) follows from this: Deflationism *does* predict that rejecting "$P$ is true" means rejecting $P$ **at the level of logical coherence.** The fact that people are psychologically capable of inconsistency doesn't falsify the logical theory.

  ### 3. Which Step to Drop?
  **Drop Step (4).**

  Replace it with:
  > **(4*)** Even if "truth" isn't a substantive property, it performs essential logical work (generalization, endorsement, and anaphora) that makes language usable.

  **And modify Step (6):**
  > **(6*)** Deflationism predicts that *logically*, accepting $P$ entails accepting "$P$ is true." Apparent cases where people separate them involve a confusion about the meaning of the word "true."

  ### 4. What is the Cost?
  If you keep (1) and fix (4), you remain a deflationist. But there is a cost to this view, which explains why your argument felt so compelling in the first place.

  **The Cost: Explanatory Power**
  If truth is just a grammatical loop, you cannot use "truth" to **explain** things.

  *   **Inflationist (Step 7):** "The satellite navigation worked *because* its map was **true**." (Truth is a property that causes success).
  *   **Deflationist:** "The satellite navigation worked *because* the terrain **is** as the map says."

  The deflationist has to paraphrase away the word "truth" every time they want to explain why a belief succeeded. This feels clunky. It makes "truth" useless for epistemology (the study of knowledge). You can't say "We seek truth" as a goal; you can only say "We seek to believe $P$ when $P$."

  Many philosophers (like Putnam or Alston) argue this cost is too high. They say truth *must* be a substantive property (like correspondence or coherence) because it plays a causal role in the success of our actions.

  ### 5. Summary of the Fix
  You don't need to abandon deflationism. You just need to distinguish between **metaphysics** and **utility**.

  1.  **Keep (1):** "True" adds no metaphysical content. (It's not a "thing").
  2.  **Reject (4):** "True" still does logical work (It's a "tool").
  3.  **Reject (7):** You don't need a "thick property" to explain the utility of the word.

  **The Verdict:**
  Your argument successfully proves that **Naïve Deflationism** (the idea that "true" is *merely* redundant) is false. But it does not disprove **Sophisticated Deflationism** (the idea that "true" is a logical operator with expressive utility but no metaphysical weight).

  If you want to keep your intuition that "snow is white is true" is just "snow is white," stick with sophisticated deflationism (look up **Paul Horwich's Minimalism** or **Dorothy Grover's Prosententialism**). They accept your (1) but explain away your (3) without needing your (7).
