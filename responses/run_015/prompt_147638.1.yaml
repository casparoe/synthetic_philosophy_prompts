      *   *Implication 2: The Value of the Struggle.* Perhaps the *effort* to purify motives has worth, even if perfect purity isn't reached. The vigilance itself is a moral virtue.
      *   *Implication 3: Self-Regard isn't Monolithic.* There's a difference between "I want praise" (vanity) and "I want to be a good person" (integrity). The latter might be compatible with moral worth.
      *   *Implication 4: The Threat of Moral Self-Indulgence.* By focusing on one's own purity, one might become morally self-absorbed, caring more about one's own soul than the library's patrons.
