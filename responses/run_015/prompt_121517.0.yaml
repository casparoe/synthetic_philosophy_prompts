answer: |-
  **ALDERGROVE DATA RELEASE PROTOCOL (ADRP)**
  **Version 1.0 | Governance Board Operational Guide**

  **Purpose:** To resolve release requests where Charter Clause L (Personal Sphere) and Clause P (Unanimity) generate conflicting directives.
  **Time Allocation:** 45 minutes for Screening and Escapes; 45 minutes for Decision and Paragraph Drafting.
  **Authority:** This protocol supersedes standard voting procedures when the Screening Test (Step 1) is positive.

  ---

  ### STEP 1: THE SCREENING TEST
  *To be administered by the Chair at the start of deliberation. All answers must be recorded in the minutes.*

  **Q1. Is the Status Quo (No Release) a valid option on the table?**
  *   [ ] Yes
  *   [ ] No → **STOP.** Apply Ordinary Voting Rules. (Sen configurations require a cycle involving the Status Quo).

  **Q2. Have at least two distinct Member Clinics asserted a "Sphere Claim"?**
  *   *Definition:* A Clinic states its preference is based *solely* on the inclusion or exclusion of its **own** patients' records, regardless of the research outcome or other clinics' participation.
  *   [ ] Yes
  *   [ ] No → **STOP.** Apply Ordinary Voting Rules.

  **Q3. Is there a Unanimous Board Preference that violates a Sphere Claim?**
  *   *Definition:* All Board members (including the objecting Clinics) agree that Option X is better than Option Y, but respecting a Sphere Claim requires choosing Y over X.
  *   [ ] Yes
  *   [ ] No → **STOP.** Apply Ordinary Voting Rules.

  **RESULT:** If **YES** to all three, you are in a **Charter Conflict**. Proceed to Step 2. Do not vote. Voting in a Charter Conflict yields agenda-dependent results (as seen in Spring [Year]).

  ---

  ### STEP 2: THE ESCAPE SEQUENCE
  *Apply these escapes in order. The first escape that resolves the conflict dictates the decision. Do not skip to later escapes to avoid the cost of earlier ones.*

  #### ESCAPE 1: OPTION EXPANSION (The "Third Way")
  **Trigger:** The conflict arises because the only options are "Release A," "Release B," or "None."
  **Action:** The Board must ask: *Can the request be split, safeguarded, or enclaved?*
  *   Can we release A's data into a secure enclave while B's goes public?
  *   Can we release a synthetic version of A's data?
  *   Can we delay A's data for 12 months while releasing B's now?
  **Judgment Point:** The Board must judge technical feasibility. This cannot be inferred from preferences.
  **Outcome:** If a new Option Z is created that satisfies the Sphere Claims (A feels protected, B feels included) and satisfies Unanimity (Science is served), select Z.
  **If No:** Proceed to Escape 2.

  #### ESCAPE 2: THE MEDDLESOMENESS FILTER (Defining the Sphere)
  **Trigger:** A Clinic's "Sphere Claim" depends on what *another* Clinic does.
  **Action:** Apply the **Constant-Self Test** to the objecting Clinic.
  *   *Instruction:* "Hold the objecting Clinic's data status constant (e.g., 'In'). Change the other Clinic's data status (from 'In' to 'Out'). Does the objecting Clinic's preference change?"
  *   **If Yes:** The claim is **Not Protected** by Clause L. It is a standard preference subject to Clause P (Unanimity).
  *   **If No:** The claim is **Protected** by Clause L.
  **Outcome:** Re-calculate the conflict. If the filter removes one Sphere Claim, the conflict may dissolve into a standard Unanimity decision.
  **If Conflict Remains:** Proceed to Escape 3.

  #### ESCAPE 3: CLAUSE PRIORITY (L Over P)
  **Trigger:** Valid Sphere Claims (Clause L) conflict with Unanimous Preference (Clause P).
  **Action:** **Clause L overrides Clause P.**
  *   *Instruction:* Identify the option that respects the Protected Sphere Claims, even if it violates the Unanimous Preference of the Board.
  *   *Rationale:* The Charter grants Clinics sovereignty over their data. Scientific efficiency (Pareto) is secondary to Data Sovereignty.
  **Outcome:** Select the option that satisfies the Liberal Rights.
  **Note:** This may result in selecting a scientifically inferior option (e.g., an underpowered study) or the Status Quo.
  **If Conflict Remains (Clash of Liberties):** Proceed to Escape 4.

  #### ESCAPE 4: THE PRIORITY LADDER (Clash of Liberties)
  **Trigger:** Two Clinics claim Protected Sphere status over the **same** data pair (e.g., a merged registry) or their Protected Claims create a cycle ($A \succ B$, $B \succ C$, $C \succ A$).
  **Action:** Apply the **Rotating Seniority Rule**.
  *   *Instruction:* The Clinic with Seniority (based on years in the Trust) prevails. Seniority rotates annually by lottery.
  **Outcome:** The Senior Clinic's Sphere Claim is treated as Protected. The Junior Clinic's claim is treated as a standard preference.
  **Judgment Point:** The Board must verify the Seniority List. This is administrative, not philosophical.

  #### ESCAPE 5: STATUS QUO DEFAULT
  **Trigger:** All else fails, or the Board cannot agree on the application of Escapes 1-4 within 45 minutes.
  **Action:** Select **No Release**.
  **Rationale:** In the absence of a clear authority to override a Protected Sphere, the Trust lacks the mandate to act. Inaction is a decision, not a failure.

  ---

  ### STEP 3: THE PUBLIC PARAGRAPH
  *The decision must be defended in the Annual Report. Use the following templates. Do not deviate. Do not mention "cycles," "impossibility," or "voting theory."*

  **Template A (Escape 1 Used):**
  > "The Board approved a modified release structure. By [enclaving/delaying/splitting] the data, the Trust honored Clinic [Name]'s commitment to patient privacy while enabling the research cohort. This demonstrates the Trust's capacity to engineer technical safeguards that align scientific goals with member sovereignty."

  **Template B (Escape 3 Used - L Over P):**
  > "The Board selected [Option] despite a unanimous preference for [Alternative]. Under Charter Clause L, Member Clinics retain final authority over the inclusion of their own patient records. The Board's duty is to uphold the Charter's protection of member sovereignty, even when doing so constrains the aggregate research potential of the federation."
  > *(Note: This admits the scientific cost. Do not apologize for it.)*

  **Template C (Escape 5 Used - Status Quo):**
  > "The Board did not authorize release. The request triggered conflicting provisions within the Charter regarding data sovereignty. In the absence of a clear mandate to override a Member Clinic's protected sphere, the Trust defaulted to the status quo. This preserves the Trust's legitimacy with its member base."

  ---

  ### OPERATIONAL NOTES ON JUDGMENT AND LIMITS

  1.  **Irreducible Judgment:** The **Meddlesomeness Filter (Escape 2)** requires judgment. Determining whether a preference is "about own data" or "about others' data" is not mechanical. The Board must avow this judgment in the minutes, though the Public Paragraph uses Template B.
  2.  **Partial Information:** If a Clinic refuses to rank options ("We will not discuss Option Y"), treat silence as **Status Quo Preference**. If they claim a Sphere Right but refuse to specify the boundary, the claim is invalid. Rights require definition.
  3.  **Decoy Options:** If a new option appears only during the vote and was not in the original request, it is a Decoy. Ignore it. Option Expansion (Escape 1) must be proposed *before* the Screening Test.
  4.  **What This Procedure Cannot Do:** It cannot produce a "Best Science" outcome if that outcome violates a valid Clause L claim. It cannot reconcile relational privacy claims with atomistic Charter language without overriding one. It cannot prevent the Annual Assembly from overturning the decision (but it provides the text to defend it).

  ---

  ### APPLICATION TO TEST CASES

  #### CASE 1: THE MERGED REGISTRY (Two Clinics, One Sphere)
  **Scenario:** Clinics M1 and M2 share a registry. Both claim Clause L rights over the In/Out decision for that registry.
  **Screening:** Q2 is problematic. Are these two spheres or one?
  **Procedure Application:**
  1.  **Escape 1 (Expansion):** Can the registry be split technically? If no...
  2.  **Escape 2 (Meddlesomeness):** Both claims pass the Constant-Self Test (each claims rights over "their" patients, even if stored together).
  3.  **Escape 3 (Priority):** L vs P is not the issue. The issue is L vs L.
  4.  **Escape 4 (Ladder):** This is a **Clash of Liberties**. The spheres are not disjoint. The Charter assumes disjoint spheres.
  **Decision:** Apply the **Priority Ladder**. Senior Clinic decides.
  **Public Paragraph:** Must use a modified Template C.
  > "The Board did not authorize release. The Charter assigns data sovereignty to Member Clinics. In the case of the Merged Registry, two Clinics hold overlapping sovereignty claims. The Charter does not provide a mechanism to adjudicate overlapping spheres. To avoid setting a precedent that erodes Clause L for either party, the Trust defaulted to the status quo."
  **Concession:** You must admit the Charter has a gap. Do not pretend the Ladder solved it philosophically; admit it is a tie-breaker.

  #### CASE 2: THE RELATIONAL OBJECTION (Clinic C vs. Clinic D)
  **Scenario:** Clinic C says: "My records In ONLY IF D's records Out." (Conditional Preference). Clinic D and all others prefer "C In, D In."
  **Screening:** Q2 (Sphere Claim).
  **Procedure Application:**
  1.  **Escape 2 (Meddlesomeness Filter):** Apply the Constant-Self Test to C.
      *   Hold C's data **In**.
      *   Change D's data from **In** to **Out**.
      *   Does C's preference change? **Yes.** (C prefers "C In/D Out" over "C In/D In").
      *   **Verdict:** C's claim is **Meddlesome**. It is not a Protected Sphere Claim under Clause L. It is a standard preference.
  2.  **Escape 3 (Priority):** Since C's claim is not Protected, Clause P (Unanimity of all *other* members + D) applies.
  3.  **Decision:** Release "C In, D In." Override C.
  **Public Paragraph:** Template B (modified).
  > "The Board authorized release including records from Clinics C and D. Clinic C raised an objection conditional on the participation of Clinic D. Under Charter Clause L, personal sphere protections apply only to the inclusion or exclusion of a Clinic's own records, independent of others. As Clinic C's objection was relational, it was adjudicated under Clause P (Unanimity), which favored inclusion."
  **The Unpalatable Cost:**
  *   **To Patient Representatives:** This procedure explicitly rejects "Relational Privacy." It tells the community that their protocol (no data sharing with specific partners) is not protected by the Charter's Liberal Clause.
  *   **To You (The Philosopher):** You asked to keep Clause L over Clause P. To keep Clause L *workable*, you must define the "Sphere" narrowly (atomistically). If you allow relational conditions into Clause L, *every* preference becomes a sphere claim (Gibbard's Paradox), and the Trust becomes paralyzed.
  *   **The Choice:** You are committed to the **Narrow Reading**.
  *   **Cost:** You sacrifice the moral intuition that privacy is relational (which the patient reps hold) to save the decision procedure from paralysis. You must avow this in the Board meeting: *"To protect the right of Clinics to control their own data, we cannot allow them to veto the data of others. To do otherwise would grant every Clinic a veto over the entire Trust."*

  ### FINAL DIRECTIVE
  If the Board asks why Clause P (Unanimity) was violated in the original A/B case but Clause L (Relational) was violated in Case 2:
  **Answer:** "In the A/B case, the objection was about **Own Data** (Protected). In Case 2, the objection was about **Other Data** (Unprotected). The procedure distinguishes these to prevent total gridlock. The cost is that Clinic C's community protocol is not enforceable under the current Charter."

  **End of Protocol.**
