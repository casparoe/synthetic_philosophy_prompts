      *   *Wrinkle 2 Detail:* Legitimacy. The calculation argument says "you can't calculate the efficient allocation without prices". It doesn't say "the efficient allocation is the moral one". So it is silent on legitimacy.

      *   *Final Polish:* Ensure the distinction between the "planner" (foundry internal committee) and the "market" (inter-firm) is clear. The foundry is a planned economy in miniature. It worked. Why? Because it sold into a market. This supports the Embedded thesis.

      *   *British English Check:* "Programme" (not program), "organisation", "centralised", "colour" (if needed), "whilst", "amongst". Ensure spelling consistency.

      *   *Structure:*
