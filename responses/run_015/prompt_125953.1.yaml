      *   *Thinking about the "Planner":* In this case, the "planner" is the foundry capacity allocation committee. They don't use internal prices for every wafer start usually; they use schedules. But they respond to external prices.
      *   *Thinking about "Accounting":* Did the foundry know the opportunity cost? Yes, via external offers.
