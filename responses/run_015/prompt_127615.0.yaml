answer: |-
  # Joint Statement on Letter Identity: The 'a' Collaboration

  ### 1. Agreed Claims
  1. Visual similarity correlates with identification speed but does not guarantee identity.
  2. **(Schema Concession)** Contextual support can override geometric deviation sufficient to identify a mark as 'a' despite zero feature overlap with standard forms.
  3. Production history affects judgment: a perfect 'a' shape generated by random noise is categorized differently than one generated by agency.
  4. Reader uptake is not infallible; consensus can be wrong about historical identity.
  5. **(Allography)** When 'a' and 'ɑ' appear in the same text as stylistic alternates, they instantiate one functional unit despite distinct forms.
  6. **(System Concession)** No single geometric feature (e.g., the counter) is present in every valid 'a' across all possible scripts and styles.
  7. Readers store probabilistic expectations of form rather than rigid templates.
  8. **(Templates)** These stored expectations are necessary for rapid recognition but can be overridden by systemic context.
  9. **(Divergence)** Production intent and reader uptake can come apart; when they do, communication fails even if identity is assigned.
  10. Letter identity is more stable than shape identity across transformations (size, rotation, medium).
  11. Exposure expands the range of forms accepted as 'a' without changing the functional role.
  12. Both form degradation and contextual removal can destroy 'a'-hood.

  ### 2. Disagreements Table

  | Issue | Schema Camp Claim | System Camp Claim | Type of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **The Permuted Typeface** | The shapes are 'e's functioning as 'a's; the letter is fundamentally a form-class. | The shapes are 'a's because they occupy the 'a' slot; the letter is fundamentally a functional slot. | Genuine |
  | **The Orphan Glyph** | Identity is determined by morphological resemblance to the schema cluster; 40% agreement indicates borderline form. | Identity is indeterminate without a contrasting system to establish role; the split proves context is missing, not form is borderline. | Genuine |
  | **"Same Letter"** | Meaning: Same form-type (historical/geometric lineage). Stakes: If true, the permuted book is gibberish made of 'e's. | Meaning: Same functional token (interchangeable in code). Stakes: If true, the permuted book is valid text made of 'a's. | Verbal |
  | **Invented Script** | These are not 'a's; they are new letters analogous to 'a' because they lack geometric lineage. | They are 'a's in new clothing; the structural role makes them 'a's regardless of shape. | Genuine |
  | **Child's Mark (Intent 'a', Read 'u')** | It is a 'u' because form dictates uptake; intent cannot rescue a failed schema. | It is a failed 'a' because intent dictates identity; uptake error does not change the letter produced. | Genuine |

  ### 3. Cruxes and Pre-registered Predictions

  1.  **The Permuted Typeface:** A book set entirely in a typeface where the 'a' slot outputs the standard 'e' shape.
      *   **Schema Prediction:** Reading speed will remain statistically slower than standard text even after 200 pages due to persistent form-conflict interference.
      *   **System Prediction:** Reading speed will match standard text fluency once the system is learned, as functional slot access bypasses form mismatch.
  2.  **The Orphan Glyph:** A glyph generated by an 'a' routine shown in isolation to 100 readers (40 say 'a', 60 say 'o').
      *   **Schema Prediction:** The 40/60 split confirms the glyph is a borderline case of the 'a' form-schema; identity is probabilistic based on geometry.
      *   **System Prediction:** The split confirms identity is undefined without context; adding contrastive letters will force 100% consensus on one identity.
  3.  **Invented Script:** A new script with 26 elements structurally isomorphic to Latin, sharing no shapes.
      *   **Schema Prediction:** Users will learn these as new letters (Alpha-1, Alpha-2), not as 'a' and 'b'; translation will require a lookup step.
      *   **System Prediction:** Users will spontaneously map them to 'a' and 'b'; translation will be immediate due to structural identity.
  4.  **Child's Mark (Intent 'a', Read 'u'):** A child draws a 'u' shape intending 'a'; readers say 'u'.
      *   **Schema Prediction:** Observers will correct the child ("That's a 'u'"); the mark's identity is 'u' regardless of intent.
      *   **System Prediction:** Observers will praise the attempt ("Good 'a'"); the mark's identity is 'a' based on the production system used.
  5.  **The Swapped Font:** A font where 'a' and 'b' shapes are swapped globally.
      *   **Schema Prediction:** Readers will report reading 'b's where 'a's are expected; form overrides convention initially.
      *   **System Prediction:** Readers will report reading 'a's where 'a's are expected; convention overrides form immediately.

  ### 4. What Would Move Us

  **Schema Camp:** We would relinquish the claim that form is constitutive if the Permuted Typeface case shows zero cognitive cost after training. If the brain accesses the 'a' role directly without processing the 'e' shape as an interference pattern, then form is merely evidential, not essential.

  **System Camp:** We would relinquish the claim that role is sufficient if the Invented Script case shows users cannot map the structural isomorphs to 'a' without explicit translation rules. If structural identity cannot bypass form learning, then the visual schema is a necessary condition for letter identity.

  **Joint Settlement:** Both sides agree that a neurocognitive measure showing distinct processing pathways for form-classification versus role-assignment would settle the matter. If neural data shows form-processing is shut off during fluent reading of the Permuted Typeface, System wins. If form-processing remains active and inhibitory, Schema wins. Until then, we maintain the distinction between *letter-as-shape* and *letter-as-slot* as a productive tension rather than a resolved definition.
