answer: |-
  Your diagnosis of the situation is remarkably precise. You have correctly identified that the friction is not generated by a lack of shared facts, nor by a simple semantic confusion regarding the phrase 'equal opportunity'. Rather, you are encountering a collision between two distinct moral ontologies. To put it plainly: you and your friend are not arguing about how to tune the engine of society; you are arguing about what the vehicle is for and who owns the chassis.

  Here is a diagnosis grounded in the assertions you have outlined, followed by an assessment of whether this impasse is resolvable.

  ### The Diagnosis: Ontology and Priority

  **1. The Metaphysics of the Family vs. The Topology of Power**
  Your friend's position rests on a specific metaphysical claim: that the family constitutes a trans-temporal moral agent. In this view, 'personhood' is not coterminous with the biological life of an individual but extends through the lineage. Consequently, capital is not merely a resource held by an individual, but the material embodiment of the family's ongoing project. To restrict the bequest is to intervene in the continuity of that agent. It is treated as a violation of integrity, akin to censoring a person's speech, because the wealth is viewed as an extension of the family's will through time.

  Your position, conversely, treats the family not as a metaphysical unity but as a mechanism within a political topology. You assert that 'continuity' is a legal fiction utilised to legitimise the accumulation of power. By framing the issue through 'opportunity-set non-dominance', you are arguing that inherited capital functions as private government. It allows one group to dictate the terms of social cooperation to others, not through force, but through the structural constriction of alternatives.

  Therefore, this is not merely a dispute about property rights versus freedom. It is a disagreement about what kind of entity is entitled to protection. Your friend prioritises the *associational unit* (the dynasty) as the primary bearer of rights. You prioritise the *civic individual* (the citizen) as the primary bearer of rights, viewing the dynasty as a potential threat to that status.

  **2. Partiality vs. Impartiality**
  Beneath the structural arguments lies a clash of bedrock intuitions regarding moral scope. Your friend's argument relies on the moral permissibility, indeed the necessity, of partiality. The claim is that we owe more to our kin than to strangers, and that this duty extends beyond the grave. This is a particularist ethic.

  Your argument relies on an impartialist ethic. The concept of 'non-dominance' requires that no citizen be subject to the arbitrary will of another. From this vantage point, the specific emotional bonds within a family cannot justify a structural outcome that diminishes the freedom of unrelated third parties.

  You are not answering different questions under a single heading; you are answering the same question ('Is this just?') using incompatible moral currencies. Your friend is counting in units of *fidelity and continuity*; you are counting in units of *equality and independence*.

  ### The Assessment of Resolvability

  You asked whether a conceptual distinction, a formal model, or an empirical finding could move this disagreement. The honest answer is that it is unlikely, and here is why.

  **1. Empirical Findings**
  You noted that you both accept the same empirical picture: that wealth concentrates, mobility is constrained, and taxes alter distribution. Since you agree on the mechanics of the machine, data regarding mobility elasticities will not help. Even if you produced evidence that inheritance tax completely neutralised opportunity hoarding, your friend could reply that the moral cost of violating intergenerational agency remains too high. Conversely, if evidence showed inheritance tax had little effect on mobility, you might argue for it on principle anyway, while your friend would argue it is unnecessary oppression. The facts are not the lever here.

  **2. Formal Models**
  A formal model of intergenerational agency might clarify the logical consistency of your friend's position, or a model of opportunity sets might refine your definition of domination. However, models are tools for optimisation given a set of values. They cannot adjudicate between the value of familial continuity and the value of civic non-domination. To use a model to solve this would be to beg the question by programming one set of values into the objective function.

  **3. Conceptual Distinctions**
  There is one conceptual distinction that might soften the edges, though it will not resolve the core conflict: the distinction between *ownership* and *stewardship*.
  If your friend views wealth as absolute ownership, their right to dispose of it is near-total. If they could be persuaded to view it as stewardship of a family line that exists *within* a society, the obligation to the wider structure might gain traction. However, given their commitment to 'intergenerational personhood', they are likely to view stewardship as subordinate to the family's survival.
  Similarly, if you could acknowledge a limited right of 'familial self-preservation' that does not tip into domination, you might find a middle ground. But if you view any significant accumulation as inherently dominative, no concession is possible.

  ### The Verdict: Stable Deadlock

  You should expect a permanent deadlock, but this need not be viewed as a failure of reasoning. It is a feature of a pluralistic society grappling with the limits of liberalism.

  Liberalism attempts to balance individual liberty with civic equality. Your friend is pulling on the liberty strand (specifically, the liberty of association and disposition). You are pulling on the equality strand (specifically, the equality of status and power). These two values are in genuine tension. There is no 'view from nowhere' that can definitively prove one outweighs the other.

  The impasse is 'structurally stuck' because it mirrors a structural tension in political philosophy itself. To resolve it would require one of you to abandon a foundational commitment: either that families have a right to perpetuate themselves materially, or that citizens have a right to be free from the structural dominance of private capital. Neither of these is easily surrendered, nor should they be.

  **Recommendation**
  Do not attempt to 'solve' the disagreement. Instead, shift the terms of the engagement. Acknowledge that you are defending two different goods that are both legitimate but mutually limiting. The conversation should move from 'who is right' to 'where is the tragic trade-off?'.
  *   Admit that restricting bequests does curtail a form of familial liberty.
  *   Ask your friend to admit that unrestricted bequests does curtail a form of civic freedom.

  Once you both acknowledge that the cost of your own preferred policy is the infringement of a genuine good held by the other, the conversation may cease to be a circle and become a negotiation. You will not agree on the principle, but you might agree on a compromise that minimises the damage to both values. Until then, you are speaking different moral languages, and no amount of vocabulary will translate the soul of one into the grammar of the other.
