answer: |-
  Your hypothesis is astute and aligns with the most sophisticated meta-theoretical readings of the debate (such as those by Wil Waluchow, Gerald Postema, and Nigel Simmonds). The "immovability" you perceive is not a failure of argumentation but a symptom of a **methodological incommensurability**. Hart and Fuller are not merely disagreeing about the extension of the concept "law"; they are disagreeing about the *purpose* of legal theory itself.

  Here is an analysis of the structure of the disagreement, the nature of the concealed divergences, and the prospects for resolution.

  ### 1. Structural Diagnosis: Misalignment of Questions
  You suggest Hart offers a "descriptive sociology" while Fuller offers an "account of practical reason." This is the crux of the matter. The disagreement is primarily a **misalignment of explanatory questions**, which manifests as a verbal dispute but carries substantive weight.

  *   **Hart's Question (The Observer's View):** "What are the necessary social facts that allow us to identify a normative system as a *legal* system distinct from other forms of social control (like morality or custom)?"
      *   **Goal:** Clarity of identification. Hart wants a concept of law that allows us to say, "This is law, but it is too wicked to be obeyed."
      *   **Method:** Conceptual analysis of social rules (primary/secondary) and the Rule of Recognition.
      *   **Status of Morality:** Contingent. Morality is external to the criteria of validity.

  *   **Fuller's Question (The Participant's View):** "What are the necessary conditions under which a system of rules can successfully function as a *means of governing human conduct*?"
      *   **Goal:** Fidelity and Integrity. Fuller wants a concept of law that explains why law creates a moral obligation of fidelity.
      *   **Method:** Teleological/Functional. Law is defined by its *end* (subjecting conduct to rules).
      *   **Status of Morality:** Necessary (Procedurally). The "internal morality" is constitutive of the activity of lawmaking.

  **The Misalignment:** Hart is analyzing law as a **product** (a system of valid rules), whereas Fuller is analyzing law as a **process** (the activity of subjecting conduct to rules). Because they define the *genus* differently, their criteria for the *species* inevitably clash. Hart asks, "Does this system have the pedigree of law?" Fuller asks, "Does this system perform the function of law?"

  ### 2. Verbal vs. Substantive: The Stakes of the Label
  Is the dispute merely verbal? If they were simply arguing over whether to apply the word "law" to a Nazi decree, it would be a semantic triviality. However, the dispute is **substantive** because the label "law" is not inert; it carries normative force.

  *   **The Normative Drag:** In ordinary discourse and judicial practice, calling something "law" suggests a *prima facie* obligation to obey.
      *   **Hart's Risk:** By separating law and morality, Hart fears we lose the critical stance ("This is law, but it is iniquitous"). He worries Fuller's view blinds us to the reality of power.
      *   **Fuller's Risk:** By linking law and morality, Fuller fears we grant illegitimate authority to tyrannical regimes ("If it's law, it commands fidelity"). He worries Hart's view encourages "fidelity to iniquity."

  *   **The Concealed Disagreement on Guidance:**
      You ask whether there is a disagreement about whether legal norms must be capable of guiding action in a morally loaded sense. **Yes.**
      *   **Hart:** Guidance is causal/psychological. A command guides if it alters behavior through the threat of sanction or social pressure. A secret, retroactive law can still "guide" behavior (by making people fearful), even if it fails fairness tests.
      *   **Fuller:** Guidance is rational/agential. Law guides only if it provides a framework that allows agents to plan their lives. A secret, retroactive law cannot guide because it makes compliance logically impossible. For Fuller, the capacity to guide is a *moral* claim on the subject; if the system cannot guide, it forfeits its claim to authority.

      This reveals the deeper metaphysical split: Hart views the subject as an object of social control; Fuller views the subject as a responsible agent deserving of reciprocity.

  ### 3. Why Empirical Study Won't Resolve It
  You mention the empirical question of whether immoral regimes can endure. An empirical study would likely show that regimes violating Fuller's eight principles can indeed persist (e.g., Nazi Germany, Stalinist Russia).
  *   **Hart's Reaction:** "I told you so. These were legal systems, albeit wicked ones."
  *   **Fuller's Reaction:** "They were systems of brute force masquerading as law. They failed *as law*, even if they succeeded *as power*."

  Empirical stability is irrelevant to Fuller's normative claim. Fuller is not making a prediction about regime survival; he is making a claim about the *integrity of the legal form*. Therefore, sociological data cannot bridge the gap between Hart's descriptive validity and Fuller's functional legitimacy.

  ### 4. Prospects for Resolution or Dissolution
  Given this diagnosis, how do we move forward? There are three paths, ranked from least to most promising.

  **A. Sharper Conceptual Distinction (The "Soft Positivist" Turn)**
  Some theorists (like Waluchow or Coleman) have attempted to incorporate Fuller's insights into positivism by arguing that a Rule of Recognition *could* incorporate moral principles (Incorporationism). However, this does not solve the Hart-Fuller impasse because Hart's core claim is that morality is *not necessarily* part of validity. Fuller's claim is that procedural morality *is necessarily* part of validity. This approach softens the edges but leaves the central methodological clash intact.

  **B. Reformulation of the Central Question (The "Functionalist" Synthesis)**
  The most productive path is to accept your hypothesis: we must reformulate the question. Instead of asking "What is law?" (which invites essentialism), we should ask: **"Under what conditions does a normative system generate a moral obligation of fidelity?"**
  *   This shifts the debate from *ontology* (existence of law) to *normativity* (force of law).
  *   It allows us to agree with Hart that a Nazi decree might be "valid" within that system's own terms (sociological fact), while agreeing with Fuller that it generates no moral obligation for the citizen (normative failure).
  *   This approach is seen in the work of **John Finnis** (who argues Hart describes a "central case" poorly) and **Joseph Raz** (who argues law claims authority but may fail to achieve it). Raz bridges the gap by admitting law *claims* to guide morally (aligning with Fuller) but insisting it can fail to do so while remaining law (aligning with Hart).

  **C. Acceptance of Bedrock Intuitions (The "Quietist" Conclusion)**
  Ultimately, you are correct that the disagreement rests on bedrock intuitions about authority.
  *   **Hart's Intuition:** Liberty is best protected by clear distinctions. We must be able to identify law without moral debate to effectively criticize it.
  *   **Fuller's Intuition:** Authority is best protected by reciprocity. Law is a cooperative venture, and without moral constraints on the process, the venture collapses.

  We should expect no final "proof" that one side is right because they prioritize different political values (Clarity vs. Integrity).

  ### Conclusion
  Your diagnosis is correct. The stall is not empirical, nor is it merely verbal. It is a **methodological divergence regarding the point of jurisprudence**. Hart seeks a tool for **critical clarity** (separating what is from what ought to be), while Fuller seeks a theory of **political obligation** (explaining why law binds conscience).

  **Resolution Strategy:**
  Do not attempt to prove one definition of "law" correct. Instead, adopt a **dual-aspect theory**:
  1.  **Systemic Validity (Hart):** Use Hart's criteria to identify when a state is operating a coercive normative system. This helps in sociological analysis and historical classification.
  2.  **Normative Force (Fuller):** Use Fuller's criteria to evaluate whether that system commands moral fidelity. This helps in judicial reasoning and civil disobedience.

  The impasse dissolves when we stop asking "Is it law?" and start asking "Is it a legal system, and does it deserve our allegiance?" This preserves Hart's warning against confusing law with morality while preserving Fuller's insight that law without morality is merely organized violence.
