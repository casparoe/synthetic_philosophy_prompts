answer: |-
  Dear Colleague,

  It is a pleasure to collaborate with you on this module, and given your background in metrology and mine in philosophy, this draft aims to bridge the gap between formal theory and experimental practice. Below I have set out the question text exactly as it should appear on the paper, followed by the model answer I would accept, and finally the marking scheme we should apply. I have kept the formatting plain so you can copy it directly into the exam folder without needing to strip out styles.

  The text for the question paper should read as follows. You are given three scenarios involving an agent deciding whether to act on a state of the world theta which can be Good or Bad with prior probability 0.5. The agent can Choose Act or Pass. Payoffs for Act are 10 if Good and minus 10 if Bad. Payoff for Pass is 0. In all cases a signal Y is available at zero cost. Case One: The measurement perturbs the system. If the agent observes Y, the state becomes Bad with probability 1 regardless of the prior. The signal Y perfectly reveals the state after perturbation. Case Two: The observation decision is evidence. The state is Good with probability 0.9 if the agent chooses Not to Observe, but Good with probability 0.1 if the agent chooses to Observe. The signal Y perfectly reveals the state. Case Three: Ignorance is valuable. The payoffs are as in the baseline, but if the agent observes Y, the payoff for Act is reduced by 5 regardless of the state. For each case calculate the expected utility of Observing versus Not Observing. State whether Good's theorem is violated. Explain why the theorem holds or fails in each instance, referring to the assumptions of the standard proof. Finally, explain why the value of information is strictly ex ante and state the condition under which the value of a signal is exactly zero.

  The model answer I propose is as follows and should be treated as the standard for full marks. In Case One the expected utility of Not Observing is 0 because the agent Passes given the risk, or if they Act blindly it is 0. If they Observe, the state becomes Bad with probability 1. The signal reveals Bad. The agent Passes. Payoff is 0. However, if the perturbation forces the state to Bad even if they Act, the value is negative relative to the unperturbed state. Specifically, if observing forces theta to Bad, the expected utility of the observation strategy is minus the cost of perturbation. Here the signal is free but the act of measuring changes the distribution over theta. Good's theorem is not violated because the theorem assumes the distribution over states is independent of the decision to observe. The candidate must identify that this is an intervention, not a conditioning event. The proof relies on P theta given Act and Observe being equal to P theta given Act, which fails here.

  In Case Two the prior probability of Good depends on the decision to Observe. If the agent does not Observe, P Good is 0.9. Expected utility of Act is 8. Expected utility of Pass is 0. Agent Acts. Utility 8. If the agent Observes, P Good is 0.1. Signal reveals state. If Good, Act yields 10. If Bad, Pass yields 0. Expected utility is 0.1 times 10 plus 0.9 times 0 which is 1. Observing yields 1. Not Observing yields 8. Observing reduces expected utility. This looks like a violation but it is not a failure of the mathematics. It is a failure of the assumption that the state distribution is act-independent. The standard proof maximises over a single distribution P theta. Here the distribution shifts based on the choice to observe. This is a Newcomb-like problem where the observation is evidentially correlated with the state. The candidate must state that the theorem assumes causal independence between the observation decision and the state, or that the proof breaks at the step where the expectation is taken over a fixed prior.

  In Case Three the utility function itself depends on knowledge. The baseline utility is 10 or minus 10. With observation, utility is reduced by 5. If the agent Observes, they know theta. If Good, Act yields 10 minus 5 equals 5. If Bad, Pass yields 0 minus 5 equals minus 5. Expected utility is 0.5 times 5 plus 0.5 times minus 5 which is 0. If Not Observing, Agent Acts. Expected utility 0. Here Observing yields 0, Not Observing yields 0. If the penalty were higher, Observing would be worse. Good's theorem assumes the utility function depends only on the state and the action, not on the information state itself. If knowledge enters the utility function directly, the theorem does not apply unless the information state is included in the outcome description. The candidate must note that the problem specification violates the theorem's scope, not the theorem itself.

  Regarding the ex ante guarantee, the theorem states that before seeing the signal, the expected utility of having the signal is at least as high as not having it. Once the signal is realised, the agent may update to a posterior where the optimal action yields less utility than the prior optimal action would have yielded had they remained ignorant. For example, a warning of a disaster lowers expected utility conditional on the warning, but the ex ante value of the warning is positive because it allows avoidance. The value of a signal is exactly zero when the signal never changes the optimal action. This occurs when the optimal action is the same for every possible realisation of the signal. This is the condition of action-independence.

  The marking scheme is structured out of twenty marks and should be applied strictly to observable moves in the script. Five marks are allocated to Case One. Award two marks for correctly calculating that the perturbation lowers the expected utility of the observation strategy compared to the non-perturbed baseline. Award two marks for explicitly stating that Good's theorem assumes the state distribution is invariant to the observation decision. Award one mark for distinguishing intervention from conditioning. The characteristic blunder here is to claim the theorem is false because the utility dropped, without noting the causal perturbation. Five marks are allocated to Case Two. Award two marks for calculating that Not Observing yields higher expected utility due to the correlation. Award two marks for identifying that the proof fails because the prior distribution over states is not fixed across the decision to observe. Award one mark for mentioning that this violates the act-independence assumption. The characteristic blunder is to attribute this to causality without specifying the distributional shift. Five marks are allocated to Case Three. Award two marks for calculating the expected utility with the knowledge penalty. Award two marks for stating that the utility function must be expanded to include the information state for the theorem to hold. Award one mark for clarifying that the theorem is not mathematically false but misapplied. The characteristic blunder is to say the agent is irrational for wanting ignorance. Five marks are allocated to the general questions. Award two marks for explaining the ex ante nature of the guarantee versus ex post realisation. Award two marks for stating the zero value condition is when no signal reading changes the action. Award one mark for coherence and clarity. The characteristic blunder is to claim the ex post utility must always be higher.

  An answer that states and proves Good's theorem using Jensen's inequality but never engages with the three cases or the computations is to receive a bare pass of eight marks out of twenty. This reflects knowledge of the theory but failure to meet the learning outcome of application. No marks should be awarded for the case-specific sections if the candidate does not attempt the arithmetic. If the arithmetic is correct but the theoretical explanation is missing, award half marks for that section. If the candidate confuses ex ante and ex post value, deduct the two marks allocated for that specific move. We should not make holistic judgements on writing style but tick off these specific moves. I hope this draft serves our purpose well and I look forward to your thoughts.

  Yours sincerely,

  Your Colleague
