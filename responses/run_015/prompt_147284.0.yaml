      *   On one hand, they operate in different domains (ethics vs. legal liability). Law often requires predictability and equality before the law (formalism), while ethics might require sensitivity to nuance.
      *   On the other hand, if the ethics service recommends X based on narrative, and the legal office flags X as high liability based on a checklist ignoring narrative, there is tension.
      *   However, does it undermine *coherence*? Not necessarily. They serve different masters (moral rightness vs. legal safety). The friction highlights the difference between the moral particularist view and legal formalism. It might actually reinforce the ethics service's need for particularism if the legal checklist is seen as morally blind.
      *   But, if the hospital administration conflates the two, the ethics service might be marginalized.
      *   *Argument:* The coexistence does not logically undermine the ethics service's coherence because the domains of evaluation differ (moral appropriateness vs. legal risk). However, it creates practical friction. The ethics service's coherence relies on the claim that moral truth is not reducible to legalistic checklists. The legal office's existence actually validates the ethics service's distinct role: if ethics were just a checklist, the legal office could do it. The difference preserves the ethics service's unique value proposition.

  6.  **Describe Changes for a Generalist Ethics Service:**
      *   If the service were built on explicit generalist commitments (e.g., principlism), it would need to prioritize consistency.
      *   Identical cases (in relevant moral features) must yield identical judgments.
      *   Principles (autonomy, beneficence) would be used as decisive arbiters when they conflict (via a hierarchy or weighting system).
