  1.  **Analyze the Request:**
      *   **Scenario:** A clinical ethics consultation service has a charter forbidding the use of general moral principles (autonomy, beneficence, justice, etc.) as decisive. Recommendations must come from narrative texture and relational dynamics. Identical feature-sets can yield opposite judgments based on context.
      *   **Contrast:** The hospital's legal risk office uses an identical algorithmic checklist for all cases, treating feature-identical situations identically and ignoring narrative texture.
      *   **Questions to Address:**
          1.  What theory of moral reasoning does the ethics charter presuppose? (Strong moral particularism vs. complex generalism?)
          2.  Reconstruct the implicit view.
          3.  Distinguish what the practice strictly requires from what it merely accommodates.
          4.  Assess whether the coexistence of the risk office's procedure undermines the ethics service's coherence.
          5.  Describe what a hospital ethics service built on explicit generalist commitments would have to change in its daily operation.
      *   **Format Constraints:** Continuous prose only. No headings, bullet points, bold text, or tables. Write like a letter or email.

  2.  **Deconstruct the Ethical Position:**
      *   The charter explicitly forbids invoking general moral principles as *decisive*.
      *   It requires recommendations to emerge *solely* from narrative texture and relational dynamics.
      *   It allows identical feature-sets to yield opposite judgments based on lived context.
      *   This sounds very much like Moral Particularism (specifically the version associated with Jonathan Dancy), which argues that moral reasons do not have a general form and that the valence of a reason can change depending on the context (holism of reasons).
      *   However, the prompt asks if a "sufficiently complex generalism" could license the same resistance to formalization. A sophisticated generalist (like a rule-utilitarian or a nuanced principlist) might argue that the rules are so complex and context-dependent that they *look* like particularism, but ultimately rely on underlying general truths.
      *   But the charter says principles cannot be *decisive*. This leans heavily towards strong particularism. If generalism were true, principles would ultimately ground the decision, even if mediated by context. The charter seems to reject the grounding role of principles.
      *   *Decision:* The charter presupposes strong moral particularism. It treats principles as at best heuristic summaries, not justificatory foundations.

  3.  **Reconstruct the Implicit View:**
      *   The view is that morality is inherent in the specifics of the situation, not imposed from above by abstract laws. The "right" action is determined by the unique configuration of relationships and stories, not by subsuming the case under a universal rule.
      *   This implies a holism of reasons: a factor that counts in favor of an action in one case (e.g., patient refusal) might count against it in another, depending on the narrative background (e.g., coercion vs. authentic choice).

  4.  **Distinguish Requirements vs. Accommodations:**
      *   *Strictly Requires:* The prohibition on using principles as trump cards or decisive justificatory endpoints. The allowance for inconsistent outcomes across structurally similar cases if the narrative differs. The primacy of the specific relationship over abstract duty.
      *   *Merely Accommodates:* It doesn't necessarily forbid *mentioning* principles, just using them as decisive. It doesn't forbid consistency, but doesn't demand it based on feature-identity. It accommodates the idea that principles might emerge as patterns *after* the fact, but not dictate *before* the fact.

  5.  **Assess Coexistence with Legal Risk Office:**
      *   The legal office uses an algorithmic checklist (generalist/formalist). It treats feature-identical situations identically.
