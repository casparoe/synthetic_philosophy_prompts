prompt: |-
  Consider a clinical ethics consultation service whose charter explicitly forbids consultants from invoking general moral principles—autonomy, beneficence, justice, or any derivative rule—as decisive in particular cases, requiring instead that every recommendation emerge solely from the narrative texture and relational dynamics unique to that patient and family, with identical feature-sets permitted to yield opposite judgments if the lived context differs. Meanwhile, the same hospital's legal risk office applies an identical algorithmic checklist to determine liability exposure across all cases, treating feature-identical situations identically and treating differences in narrative texture as legally irrelevant. What theory of moral reasoning does the ethics charter presuppose: must it be moral particularism in the strong sense that moral reasons have no general form, or can a sufficiently complex generalism license the same resistance to formalization? Reconstruct the implicit view, distinguish what the practice strictly requires from what it merely accommodates, assess whether the coexistence of the risk office's procedure undermines the ethics service's coherence, and describe what a hospital ethics service built on explicit generalist commitments would have to change in its daily operation. Please respond in continuous prose only, with no headings, bullet points, bold text, or tables, the way one would write a letter or email.
reasoning: |-
