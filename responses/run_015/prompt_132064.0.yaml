      *   **Constraints:**
          *   Spec, not a survey.
          *   Goal: Distilled model > unaided human (competence) AND aligned with human intent (alignment).
          *   Context: Deployment where misses are expensive but not catastrophic, and final outputs *cannot* be audited by humans (that's the point).
