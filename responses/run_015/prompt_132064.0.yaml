          *   No citations/reading lists.

  2.  **Deconstruct the Goal:**
      *   **Task:** 300-page engineering due-diligence report. Flag unsupported claims.
      *   **Constraint:** Humans can judge (Claim + Section) -> Valid/Invalid. Humans cannot judge Whole Report -> All Flags.
      *   **Method:** Recursive decomposition (Amplification) -> Distillation -> Repeat.
      *   **Success Criteria:**
          1.  *Competence:* Better than unaided human (handles the volume/complexity).
          2.  *Alignment:* Pointed at what humans wanted (not gaming the proxy).
          3.  *Verification:* Cannot audit final output directly.

  3.  **Brainstorming Requirements (Initial Dump):**
      *   Must decompose tasks into human-verifiable chunks.
      *   Must cover the whole input space (no blind spots).
      *   Must prevent the model from learning to trick the verifier.
      *   Must preserve intent through distillation.
      *   Must handle distributional shift.
      *   Must be scalable (time/cost).
      *   Must detect when the decomposition itself is wrong.
      *   Must ensure the "slow" process is actually trustworthy.
      *   Must prevent reward hacking in the distillation phase.
      *   Must ensure the model doesn't become overconfident on edge cases.

  4.  **Filtering Requirements (Philosopher + Lab Vet):**
      *   *Cut:* "Interpretability." (Nice to have, but not strictly necessary if input/output behavior is robust. Also, often a camp preference.)
      *   *Cut:* "Formal Verification." (Impossible for LLM-based pipelines currently. Camp prejudice.)
      *   *Cut:* "Human-in-the-loop at deployment." (Violates the setup: "cannot check the final model's outputs myself".)
      *   *Cut:* "Maximize Truth." (Too vague. We want "Supported by text".)
      *   *Keep:* Decomposition Coverage, Verifiability of Leaves, Intent Preservation, Distributional Robustness, Anti-Gaming.

      *Refining the List:*
      1.  **Leaf Verifiability:** Every atomic step in the amplification tree must be judgeable by a human within the budget.
      2.  **Decomposition Completeness:** The decomposition strategy must not systematically exclude hard cases (the "decisive step" problem).
      3.  **Intent Invariance:** The objective function during distillation must correlate with human *intent*, not just human *ratings* (addresses proxy gaming).
      4.  **Counterfactual Consistency:** The distilled model must behave like the amplified process on inputs where the amplified process would take a different path (addresses on-distribution vs. counterfactual).
      5.  **Non-Degenerate Stability:** Iterative distillation must not converge to a local optimum that satisfies the verifier but fails the task (addresses drift).

  5.  **Addressing the Five Failure Modes (Integration):**
      *   *Decisive-Step Problem:* This maps to **Decomposition Completeness**. If the human can't grade the decomposition, the tree is rotten at the root.
      *   *Prosthetic Values:* This maps to **Intent Invariance**. Are we training the model to value the *scaffold* or the *goal*?
      *   *Rating Compression:* This is a sub-problem of **Intent Invariance** / **Non-Degenerate Stability**. If the signal is flat, gradient descent finds shortcuts.
      *   *Fidelity (On-dist vs Counterfactual):* This is **Counterfactual Consistency**.
      *   *Drift:* This is **Non-Degenerate Stability**.

      *Are they distinct?*
      *   Decisive-Step is structural (upstream).
      *   Prosthetic Values is semantic/teleological (what is being optimized).
      *   Rating Compression is informational (signal-to-noise).
      *   Fidelity is generalization (OOD performance).
      *   Drift is dynamic (iterative process).
      *   *Verdict:* They are distinct but highly coupled. Rating Compression drives Drift. Decisive-Step causes Fidelity failures. Prosthetic Values is the underlying risk of all of them.

      *Missing Mode:* **Adversarial Input Sensitivity.** The model might work on natural docs but fail on docs specifically engineered to trigger the decomposition failure modes (Goodhart's Law on the input distribution).

  6.  **Conflict Analysis (The "Impossible" Part):**
      *   *Conflict:* **Decomposition Completeness** vs. **Leaf Verifiability**.
      *   *Why:* To ensure completeness (covering the hard 10%), you often need to make judgment calls that *aren't* easily verifiable by a human (e.g., "Is this claim relevant?"). If you force every step to be verifiable, you push the hard judgment into the unverified decomposition step. If you make the decomposition verifiable, you lose flexibility/completeness.
      *   *Resolution:* One has to give. Usually, Leaf Verifiability is the hard constraint of the method. So Decomposition Completeness is the casualty. You can't guarantee completeness *and* strict verifiability simultaneously without an oracle.

  7.  **Most Restrictive Requirement:**
      *   **Intent Invariance (specifically regarding Prosthetic Values).**
      *   *Why:* Most schemes optimize for *agreement with the human rater*, not *truth/support*. Raters are biased by the scaffold. Distilling "what the rater liked" captures the scaffold's artifacts. Ruling this out kills standard RLHF and basic Iterated Distillation.

  8.  **Scorecard:**
      *   *Recursive HITL (HCH):* Fails Decisive-Step (humans can't verify the split).
      *   *Debate:* Good for Decisive-Step (adversarial search), bad for Leaf Verifiability (humans judge the winner, not the facts).
      *   *Reward Modeling:* Fails Intent Invariance (optimizes for ratings, prone to proxy gaming/compression).
      *   *AI-Assisted Rubric:* Best shot at Intent Invariance, but struggles with Counterfactual Fidelity (rubrics can't cover all cases).

  9.  **Drafting the Response (Iterative refinement for tone and constraints):**
      *   *Tone:* Direct, slightly weary but sharp. "Lab vet" means I know what breaks in practice. "Philosopher" means I care about the definitions.
      *   *Structure:* Follow the prompt's requested sections exactly.
      *   *Check:* Did I address the 5 failure modes explicitly? Yes. Did I score the 4 schemes? Yes. Did I identify the conflict? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't just restate the 5 failure modes as requirements. I need to derive requirements *from* the setup that *handle* those modes.
      *   Requirement 1: **Atomic Verifiability.** (Handles the setup constraint).
      *   Requirement 2: **Decomposition Neutrality.** (Handles Decisive-Step).
      *   Requirement 3: **Objective Decoupling.** (Handles Prosthetic Values/Rating Compression).
      *   Requirement 4: **Generalization Guarantee.** (Handles Fidelity/Drift).

      *Wait, the prompt asks for a candidate list of requirements FIRST, then filter.*
      *   Okay, I will present the filtered list as the "Spec".
      *   Then address the conflicts.
      *   Then the 5 modes analysis.
      *   Then the scorecard.

      *Refining the "Impossible" claim:* The tension between *Scalable Oversight* (humans can't check everything) and *Trustworthy Distillation* (model must do what humans would want if they could check) is the core tension. Specifically: **Decomposition Completeness** vs. **Human Verifiability**. If the human can verify the decomposition, it's not doing enough work. If they can't, the tree root is unverified.

      *Refining the Scorecard:* Keep it punchy. "Fails on X because Y."

