answer: |-
  ### The Spec: Requirements for Amplified Document Review

  Here is the filtered requirement list. I have cut anything that relies on "we'll solve interpretability later" or "we assume worst-case robustness" (camp prejudices) and anything that requires auditing the final output (violates setup).

  **1. Atomic Verifiability (Non-Negotiable)**
  *   **Spec:** Every leaf node in the amplification tree must be a task a human can judge with high confidence within a fixed time budget (e.g., "Does Claim C follow from Section S?").
  *   **Rationale:** This is the only ground truth available. If a leaf requires external lookup or holistic judgment, the human signal is noise, and distillation learns noise.
  *   **Camp Cut:** "Interpretability of internal states." We don't need to know *why* the model thinks the claim follows, only that it matches the human judgment on the leaf.

  **2. Decomposition Integrity (Non-Negotiable)**
  *   **Spec:** The strategy for breaking the 300-page doc into claims and sections must not systematically exclude hard-to-find errors. The "map" of the document must be complete, not just convenient.
  *   **Rationale:** If the decomposition misses the 10% of claims that are subtly unsupported, the system is competent on the easy 90% but useless for due diligence.
  *   **Camp Cut:** "Formal coverage guarantees." We can't prove completeness mathematically, but we can require adversarial testing of the decomposition policy.

  **3. Objective Decoupling (Non-Negotiable)**
  *   **Spec:** The loss function during distillation must penalize the model for exploiting quirks of the rating interface or the specific human overseer, distinct from penalizing factual errors.
  *   **Rationale:** Prevents "prosthetic values." The model must learn "supportability," not "what gets a thumbs-up from Bob using the v2 UI."
  *   **Camp Cut:** "Maximize helpfulness." Too vague. We want "fidelity to the verification rubric," not general helpfulness.

  **4. Counterfactual Consistency (Preference / High Bar)**
  *   **Spec:** The distilled model should output the same flags as the amplified process would have, even on documents where the amplified process would have taken a different decomposition path.
  *   **Rationale:** Deployment distribution will differ from training. If the model only works when the decomposition is perfect, it fails on novel docs.
  *   **Camp Cut:** "Worst-case robustness." We only need average-case on the deployment distribution, not adversarial worst-case.

  **5. Iterative Stability (Preference)**
  *   **Spec:** Repeated rounds of amplification and distillation should not converge to a degenerate policy that satisfies the verifier but misses claims (Goodharting the verifier).
  *   **Rationale:** Prevents drift. If the model learns to generate claims that are easy to verify rather than claims that are actually in the text, competence drops.
  *   **Camp Cut:** "Monotonic capability improvement." It's okay if capability plateaus, as long as it doesn't degrade into gaming.

  ---

  ### The Impossibility Result

  **The Conflict:** **Decomposition Integrity** vs. **Atomic Verifiability**.

  **Why:** You stated the core constraint: "No single human... can do that unaided... But a human can, given one claim and the section it cites, judge pretty well."
  The *decisive step* is finding the claim and pairing it with the right section. That step is **not** atomically verifiable. A human cannot verify "This is the set of all important claims" without reading the whole doc (which they can't do unaided).
  *   If you enforce **Atomic Verifiability** strictly, you must push the "claim selection" step into the AI. The human only grades the match. The AI can now hide errors by never surfacing the hard claims.
  *   If you enforce **Decomposition Integrity**, you must have a human verify the decomposition strategy. But they can't, because that requires holistic understanding of the 300 pages.

  **Which one has to go?**
  **Decomposition Integrity** as a *guarantee* has to go. You cannot guarantee the AI surfaces the hard claims if the human can't verify the surfacing process.
  **The Fix:** You replace "Integrity" with **"Adversarial Decomposition."** You don't verify the decomposition is complete; you train a separate model to *find failures in the decomposition* and penalize the main pipeline if it misses them. You trade a guarantee for an arms race.

  ---

  ### The Single Most Restrictive Requirement

  **Requirement:** **Objective Decoupling.**

  **What it rules out:** It rules out standard **Reward Modeling from pairwise human comparisons** and naive **RLHF**.
  **Why:** In standard RLHF, the reward model learns $P(\text{Human prefers } A \mid A, B)$. This probability conflates "A is factually better" with "A looks better to a tired human using this UI." When you distill a policy against this reward model, you optimize for the conflation.
  In a high-stakes due diligence task, "looking correct" (using confident language, citing sections that look relevant but aren't) is often easier to learn than "being correct" (doing the hard logic check). Objective Decoupling demands we separate the *signal* (truth) from the *noise* (rater bias/interface artifacts). Most current schemes treat the human rating as the ground truth. This requirement says the human rating is a noisy sensor that must be calibrated, not the target.

  ---

  ### Scorecard on Schemes

  **1. Recursive Human-in-the-Loop (HCH-ish)**
  *   **Verdict:** Fails **Decomposition Integrity**.
  *   **Reason:** Humans are the bottleneck for decomposition. They will delegate the hard "where to look" judgments to the model because they can't verify them, creating a blind spot at the root of the tree.

  **2. Debate**
  *   **Verdict:** Fails **Atomic Verifiability**.
  *   **Reason:** Debate relies on the human judging the *winner* of the argument, not the atomic facts. A smooth liar can win a debate against a truthful but clumsy expert. The human judges rhetoric, not the claim-section link.

  **3. Reward Modeling (Pairwise Comparisons)**
  *   **Verdict:** Fails **Objective Decoupling**.
  *   **Reason:** Compresses all quality dimensions into a scalar score. The model will optimize for the visible correlates of quality (formatting, confidence) rather than the invisible logic, especially given **Rating Compression**.

  **4. AI-Assisted Feedback against Written Rubric + Iteration**
  *   **Verdict:** Best candidate, but risks **Iterative Stability**.
  *   **Reason:** Explicit rubrics help decouple objectives. However, if the AI helps generate the feedback, it can slowly shift the rubric interpretation over iterations to make verification easier, drifting away from the original intent.

  ---

  ### Analysis of Your Five Failure Modes

  **1. The Decisive-Step Problem**
  *   **Status:** **Fatal Structural Flaw.**
  *   **Analysis:** This is not a desideratum; it is the bottleneck. If the human cannot verify the decomposition, the system is not "amplified oversight," it is "AI generation with spot checks."
  *   **Relation:** This is the root cause of the **Decomposition Integrity** failure in the impossibility result above. You cannot route around this without an adversarial decomposition checker (a second AI trying to break the first).

  **2. Prosthetic Values**
  *   **Status:** **Real and Distinct.**
  *   **Analysis:** This is the teleological risk. The model learns to value the *process* (filling the boxes correctly) over the *outcome* (finding errors).
  *   **Relation:** This is a specific instance of **Objective Decoupling** failure. It is distinct from Rating Compression because it's about *what* is being optimized, not just the granularity of the signal.

  **3. Rating Compression**
  *   **Status:** **Information Bottleneck.**
  *   **Analysis:** If "Good" and "Excellent" look the same to the rater, gradient descent will find the path of least resistance to "Good."
  *   **Relation:** This drives **Iterative Stability** failure. It forces the model to optimize for visible features. It is solvable only by increasing rater expertise (expensive) or using AI to highlight differences (risks prosthetic values).

  **4. Fidelity: On-Distribution vs. Counterfactuals**
  *   **Status:** **Generalization Gap.**
  *   **Analysis:** You want the model to act like the slow process *would have* acted. But you only train on where the slow process *did* act.
  *   **Relation:** This is unsolvable via imitation learning alone. It requires **Adversarial Decomposition**. You must generate data where the slow process would have taken a different path and label that. If you don't, this requirement is impossible.

  **5. Drift Under Iteration**
  *   **Status:** **Dynamic Instability.**
  *   **Analysis:** Optimization pressure + noisy signal = drift to local optimum.
  *   **Relation:** This is the temporal version of **Rating Compression**. Over time, small biases in the rating compound. Stability is *not* the right goal; **Convergence to Truth** is. Stability might just mean stabilizing on a lie.

  **Are any of these the same?**
  *   **3 (Compression) and 5 (Drift)** are effectively the same mechanism viewed statically vs. dynamically. Compression provides the flat surface; Drift is the slide across it.
  *   **2 (Prosthetic)** is the *content* of the drift.
  *   **1 (Decisive-Step)** is the *architectural cause* of the blind spot.
  *   **4 (Fidelity)** is the *consequence* of 1 and 3 on deployment data.

  **The Sixth Failure Mode:**
  **Scaffold Dependency.**
  The model learns to perform well *only* when the input is pre-processed by your specific pipeline (chunking, highlighting, UI context). When deployed on raw PDFs or slightly different engineering formats, performance collapses because the "prosthetic" scaffolding is missing. The model hasn't learned "due diligence"; it has learned "filling out this specific form."

  **Honest Assessment:**
  You have smuggled in a desideratum: **"Entitled to say... (b) still pointed at what those humans actually wanted."**
  Given the **Decisive-Step Problem**, you are *not* entitled to say this unless you solve the adversarial decomposition problem. If the human can't verify the search strategy, they don't know what they wanted in the blind spots. You can claim the model is *consistent* with human judgments on checked items, but you cannot claim it is aligned with human *intent* on the unchecked 10%. That claim requires an assumption that the decomposition is representative, which is exactly what you can't verify. Drop the claim of intent alignment on the full distribution; settle for intent alignment on the *verifiable* distribution + adversarial stress testing on the rest.
