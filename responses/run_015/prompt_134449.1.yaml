prompt: |-
  I am a philosophy PhD student who sits in on a foundations-of-physics reading group. At the last meeting a visitor was defending the axiom of choice against the standard objection from the Banach–Tarski decomposition, and he closed with a line everyone in the room recognized: *you need the axiom of choice to pick one sock from each of infinitely many pairs of socks, but not to pick one shoe from each of infinitely many pairs of shoes.* He then put it to work: choice only does real work where there is no rule for picking; in applied mathematics there is always a rule; therefore choice has no consequence we could ever observe; therefore the paradox has no empirical bite and cannot count as an objection to the axiom. Several people nodded. I am sure something is being slid past me, but I cannot say what, because I cannot tell what the middle claim — *in applications there is always a rule* — is actually asserting.

  Here are the readings I can produce on my own. Please correct them rather than confirm them, and add the ones I have missed, especially at the deflationary and the ambitious ends: (1) for finite families ZF already proves that a choice function exists, so the slogan is trivially true of finite cases and says nothing about infinite ones; (2) the mathematics that actually gets applied is all provable using countable choice or dependent choice alone, so full choice is idle in every application that matters; (3) a *rule* means a definition, so the claim is that every set we ever need is definable, which would make choice into a different and stronger claim about definable selectors rather than the axiom itself; (4) choice is conservative over ZF for statements of the kind that could report a measurement, so no prediction can turn on it — I have a hazy memory of an argument by way of an inner model and of a bound on how complex the relevant statements may be, and I cannot reconstruct either; (5) a choice function is the output of a procedure, so the axiom says that an idealized agent can complete infinitely many arbitrary selections, and no genuine procedure can do that.

  Two things I want settled in particular. First, I suspect the shoe-and-sock contrast is a picture rather than a claim: distinct objects always differ in some respect, so *no rule* cannot mean *no distinguishing feature*, and whether a given family admits a rule looks as though it depends on which language and which parameters are allowed and possibly on which model of ZF one is working in. Is there a precise fact the contrast is shorthand for — presumably something about countable families of pairs — and is the contrast well defined once that fact is stated? Second, the objection the speaker was answering is not that choice predicts a surprising measurement but that it lets our mathematical theory of space contain objects that make the decomposition possible; I want to know, reading by reading, whether it would even address an objection of that shape.

  Please answer in American English, define any technical term in a parenthetical, and assume you have no internet access: work from the standard facts of the subject, and say plainly where you are unsure instead of reaching for a reference. I do not want citations or suggestions for further reading.

  Deliverable: a Markdown table of seven to nine readings, ordered from the most deflationary to the most ambitious, with exactly these columns — **Reading** (the precise thesis in one sentence, phrased so that it can be asserted or denied); **Kind** (one of: purely set-theoretic, about mathematical practice, about definability, epistemic, about the physical world); **Status** (exactly one of: trivial, false, substantive and defensible, substantive and doubtful); **Delivers the conclusion** (yes, in part, or no — where *the conclusion* is that the Banach–Tarski-style objection to choice has no force); **Load-bearing gap** (the further premise this reading needs before it yields that conclusion, or *none* if it already does); **Nearest true neighbor** (if Status is *false*, the true claim nearby that it is easy to confuse it with; otherwise a dash).

  After the table, a single JSON object with these named fields: **sharpest_case** (string: the label of the reading that makes the strongest available case for the speaker, or *none*); **simply_wrong** (array of objects with fields *reading* and *why*, one line each); **slogan_verdict** (string, two or three sentences: whether the shoe-and-sock contrast is well defined, and what precise fact, if any, it abbreviates); **reply_for_next_meeting** (string, two sentences I could say out loud without embarrassment); **unsettled** (array of one or two strings: the questions my table leaves open because settling them requires deciding something further).
