answer: |-
  **MEMORANDUM: DESIDERATA FOR AN ETHICAL THEORY OF PEST CONTROL**

  **1. Purpose and Assumptions**
  Your optimisation target—action-guidance under deep uncertainty with immediate deadlines—is correct for *advisory* functions. A theory that requires perfect information is useless here. However, optimising *only* for immediate usability risks encoding short-termism. The theory must bridge the gap between the urgent decision (spray now?) and the systemic context (why is the pest here?).

  *Sentience & Declines Clause:* We assume a precautionary principle regarding insect sentience: nociception is sufficiently probable that large-scale suffering counts morally, even if consciousness is uncertain. We accept insect decline data as factual background constraints. We proceed without resolving the metaphysics of consciousness.

  **2. The Desiderata**
  An adequate theory must satisfy the following requirements:

  *   **A. Proportionality of Stakes:** Must distinguish between defence of life/health (malaria, shelter bedbugs) and convenience/cosmetics (ornamentals, patio ants). Human survival weights heavily, but does not automatically trump all insect welfare.
  *   **B. Modality of Harm:** Must differentiate between killing and sub-lethal harm. A regime that sterilises or chronically poisons may create more aggregate suffering than a quick kill. Non-lethal levers (mating disruption) are not morally free passes.
  *   **C. Demographic Consequences:** Must account for vacancy compensation. If killing adults triggers a population boom via released resources, the intervention may increase total lives lived and died (and total suffering) rather than reducing them.
  *   **D. Non-Target Accountability:** Must weigh collateral damage to pollinators and natural enemies. A 'successful' kill that destroys predator populations causing secondary pest resurgence is ethically negative.
  *   **E. Temporal & Evolutionary Horizon:** Must evaluate regimes, not just acts. Repeated spraying inducing resistance (the chemical treadmill) or irreversible gene drives changes the moral calculus from 'one-off' to 'permanent alteration'.
  *   **F. Attribution of Necessity:** Must acknowledge counterfactual pests. If the outbreak exists only due to monoculture or global shipping, the moral burden is higher than if the pest is a brute fact of nature. We cannot claim 'defence' against a threat we manufactured.
  *   **G. Decision under Uncertainty:** Must yield a verdict with limited data. It cannot require lab tests before acting. It must handle low credence in sentience multiplied by vast numbers (the 'expected value' problem).
  *   **H. No Moral Licence:** Past good deeds (e.g., habitat restoration) do not offset current gratuitous harm. Each intervention requires independent justification.

  **3. Critical Analysis**

  **Non-Negotiable vs. Prejudicial**
  *   **Non-Negotiable:** *Decision under Uncertainty (G)* and *Proportionality of Stakes (A)*. If the theory cannot be used by a farmer on a Tuesday, it is not guidance; it is philosophy. If it treats ornamental aphids like malaria vectors, it is morally blind.
  *   **Prejudicial:** *Attribution of Necessity (F)*. Ecological holists will demand this; human-priority consequentialists may view it as irrelevant to the immediate suffering at hand. Insisting on it may paralyse decision-making in existing agricultural systems.

  **Incompatible Pairs**
  *   **Individual Welfare (B/C) vs. Ecosystem Integrity (D/E).** Sometimes preserving the ecosystem (e.g., stopping an invasive species) requires massive individual killing. Sometimes saving individuals (no spray) collapses the ecosystem (pest resurgence).
  *   **Resolution:** The theory must prioritise *prevention of irreversible harm*. Ecosystem collapse is usually irreversible; individual insect death is not. However, mass suffering is also a harm. The theory must weigh *severity* against *permanence*.

  **The Knockout Requirement**
  *   **Attribution of Necessity (F)** does the most work in knocking out otherwise popular views.
  *   *Why:* Standard public-health consequentialism ignores *why* the vector is there. Virtue ethics might focus on the farmer's character but ignore the supply chain. Requirement F forces the agent to acknowledge that 'pest control' is often 'damage control for poor design'. It blocks the justification of "we must spray" when the answer is "we should not have planted this monoculture." It shifts the burden of proof onto the creator of the vulnerability.

  **4. Scorecard Against Candidate Theories**

  | Theory | Performance | Critique |
  | :--- | :--- | :--- |
  | **Sentience-First Welfare Consequentialism** | **Poor** | Fails on *Demographic Consequences (C)* and *Uncertainty (G)*. Calculating aggregate suffering across millions of insects with unknown sentience is computationally impossible for a farmer. Risks paralysis. |
  | **Ecological Holism** | **Mixed** | Strong on *Non-Target (D)* and *Regimes (E)*. Fails *Proportionality (A)*. Often treats individual suffering as morally negligible compared to system stability, which is unacceptable for disease vectors. |
  | **Human-Priority Public-Health Consequentialism** | **Good (Immediate)** / **Bad (Systemic)** | Excellent on *Uncertainty (G)* and *Stakes (A)*. Fails *Attribution (F)* and *Temporal Horizon (E)*. Justifies the chemical treadmill because it solves the immediate human problem, ignoring long-term resistance and ecological debt. |
  | **Virtue / Relationship View** | **Mixed** | Strong on *Regimes (E)* and *Attribution (F)*. Weak on *Uncertainty (G)*. "What would a virtuous farmer do?" is too vague for a Tuesday deadline. Risks becoming aesthetic rather than ethical. |

  **Recommendation:** Adopt a hybrid framework. Use *Human-Priority* for immediate triage (disease vs. nuisance), constrained by *Holistic* rules of thumb (no broad-spectrum during bloom, rotate modes of action) to satisfy *Temporal* and *Non-Target* requirements. Treat *Attribution of Necessity* as a strategic goal for the Board, not a veto for the farmer in the field.
