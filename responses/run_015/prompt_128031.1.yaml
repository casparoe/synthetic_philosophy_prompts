      *   *Emergentist Dualism:* Keeps distinctness + efficacy. Sacrifices closure (usually).
      *   *Eliminativism:* Keeps closure. Sacrifices mental efficacy (by denying the mental).

  6.  **Identifying the "Change of Mind" Condition:**
