prompt: |-
  I teach an upper-level undergraduate seminar on federalism and multilevel governance: 24 students, one 75-minute session. They have already read the standard statements of subsidiarity (the EU's, the German Basic Law's necessity test, and the Swiss constitutional version), so I do not want anything that restates them.

  Design a simulation that makes them feel one difficulty the reading slides past. Subsidiarity tells you to presume in favour of the smaller unit, but it does not say who gets to apply that presumption, and every candidate allocator — the union, the member units themselves, a court, a constituent convention — has an interest in the answer, because allocating competences is itself the most centralising power there is. I want them to run into this rather than hear it: they should spend the first part of the session arguing about which level should decide some concrete policy, and only later discover that the disagreement underneath was about who decides that question. Ideally I do not say the phrase "who decides who decides" until after they have tried to write a rule.

  Concretely: six regional delegations of four, each with a written brief giving it (i) a local preference that diverges from the union median on some issue, (ii) a spillover it imposes on or suffers from its neighbours, and (iii) at least one issue on which it would prefer union-wide rules — so that every delegation has a reason to want localism for itself and centralisation for others. Give me the policy domain, the six briefs, a scoring scheme using points or legitimacy tokens rather than money, a timeline with minute marks, and, the part I care most about, the moment where I hand them a ballot asking only who decides who decides and they have to draft a workable rule on the spot, with the moves I should have ready for the proposals they will predictably produce.

  Then a debrief that maps moments in the session onto the distinction between subsidiarity as a presumption about outcomes and as a rule about authority, says what will predictably go wrong the first time I run it, and is frank about which feature of the problem the simulation cannot reproduce and I will have to supply in discussion.
reasoning: |-
  Here's a thinking process that leads to the suggested simulation design:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level undergraduates (24 students).
      *   **Context:** Seminar on federalism/multilevel governance (75 mins).
      *   **Prior Knowledge:** They know standard subsidiarity texts (EU, German, Swiss).
      *   **Goal:** Create a simulation where they *experience* the "who decides who decides" problem (the meta-competence issue) rather than just hearing about it.
      *   **Key Constraint:** Do not reveal the core problem ("who decides") until the end. They must argue policy first, then realize the procedural bottleneck.
      *   **Structure:**
          *   6 regional delegations (4 students each).
          *   Specific briefs: Local preference diverging from union median, spillovers (impose/suffer), and at least one issue preferring union-wide rules (hypocrisy/strategic centralization).
          *   Scoring: Points/legitimacy tokens (no money).
          *   Timeline: Minute-by-minute for 75 mins.
          *   The "Turn": A ballot asking *who decides*, requiring them to draft a rule.
          *   Instructor Moves: Anticipate student proposals and have counter-moves ready.
          *   Debrief: Map experience to theory (outcome vs. authority), predict failures, admit simulation limitations.

  2.  **Determine the Policy Domain:**
      *   Needs to be tangible, have clear spillovers, and allow for variation in local preference.
      *   *Idea 1: Environmental Regulation.* Good for spillovers, but maybe too abstract for "local preference."
      *   *Idea 2: Taxation.* Too technical.
      *   *Idea 3: Digital Data Privacy/Platform Regulation.* Very current, clear spillovers (data flows across borders), clear local cultural differences.
      *   *Idea 4: Public Health/Sanitation.* Classic spillovers.
      *   *Selection:* **Digital Content Moderation & Data Localization.** It allows for cultural divergence (free speech vs. hate speech), economic spillovers (tech companies operate across borders), and security concerns (data sovereignty). Let's simplify it for a 75-minute class to **"Cross-Border Data & Content Standards."**

  3.  **Design the Delegations (The Briefs):**
      *   Need 6 regions. Let's call them States A-F.
      *   Each needs:
          1.  *Local Preference:* Distinct from the Union Median.
          2.  *Spillover:* They hurt neighbors or get hurt by neighbors.
          3.  *Centralization Wish:* Something they want the Union to do (to trap others).
      *   *Union Median:* Moderate regulation, free data flow, standard liability.
      *   *State A (The Libertarian Tech Hub):* Wants low regulation, free data flow. *Spillover:* Hosts harmful content that spreads to others. *Centralization Wish:* Wants Union to ban other states from blocking data flows (prevents protectionism).
      *   *State B (The Conservative Cultural Protector):* Wants high censorship of "immoral" content. *Spillover:* Blocks data, fragmenting the market. *Centralization Wish:* Wants Union-wide minimum moral standards (forces A to comply).
      *   *State C (The Privacy Fortress):* Wants strict data localization. *Spillover:* Increases costs for everyone else. *Centralization Wish:* Wants Union-wide privacy standard (if it matches theirs).
      *   *State D (The Security Hawk):* Wants backdoor access for police. *Spillover:* Weakens encryption for everyone. *Centralization Wish:* Union-wide security protocol (forces others to weaken encryption).
      *   *State E (The Economic Populist):* Wants to tax digital giants heavily. *Spillover:* Companies leave, reducing tax base elsewhere. *Centralization Wish:* Union-wide digital tax (prevents race to the bottom).
      *   *State F (The Swing State/Union Loyalist):* Mostly aligns with Union Median but has a specific niche industry. *Spillover:* Suffers from fragmentation. *Centralization Wish:* Harmonization to reduce compliance costs.

      *Refinement for Symmetry:* To make the "who decides" tension sharper, every state needs to feel the pain of centralization on their *priority* issue but the pain of decentralization on their *spillover* issue.
      *   Let's simplify the policy to **"Algorithmic Transparency & Content Removal."**
      *   *Issue 1: Speed of Removal.* (Fast vs. Deliberate).
      *   *Issue 2: Data Localization.* (Local servers vs. Cloud).
      *   *Issue 3: Liability.* (Platform liable vs. User liable).

      *Revised Briefs Strategy:*
      *   All states want *their* preference to prevail locally.
      *   All states suffer if *neighbors* do something different (spillover).
      *   All states want the Union to lock in *one specific aspect* that benefits them, while keeping discretion on their priority aspect.

  4.  **Develop the Scoring System:**
      *   No money. Use "Legitimacy Tokens" or "Sovereignty Points."
      *   Score based on:
          1.  Policy Outcome (Did you get your law?).
          2.  Spillover Mitigation (Did neighbors stop hurting you?).
          3.  Procedural Victory (Did you get to decide?).
      *   Actually, keep it simple for 75 mins. Score = **Policy Satisfaction - Compliance Cost.**
      *   If Union decides: High compliance cost for outliers, low spillover.
      *   If State decides: Low compliance cost, high spillover risk.

  5.  **Drafting the Timeline (75 Minutes):**
      *   0-5: Intro & Grouping.
      *   5-20: Phase 1 (Internal Strategy). Read briefs, decide stance.
      *   20-45: Phase 2 (Negotiation). Try to agree on a Union Policy.
      *   45-50: The Crisis. Instructor halts negotiation. No agreement reached (engineered).
      *   50-60: Phase 3 (The Meta-Rule). Ballot on *who decides*. Drafting the rule.
      *   60-70: Voting & Reveal.
      *   70-75: Debrief Start.

  6.  **The "Turn" (Who Decides):**
      *   Students will try to write a policy. Instructor stops them: "You can't agree on the policy. You must agree on the *process*."
      *   Options: Union Majority? Unanimity? Court? Rotating Chair?
      *   Instructor Moves: If they pick Union Majority, point out tyranny of majority. If Unanimity, point out veto power/paralysis. If Court, ask "which law do they apply?"

  7.  **Debrief Design:**
      *   Connect to Subsidiarity.
      *   Subsidiarity = Outcome presumption (smaller is better).
      *   Simulation Reality = Authority question (who applies the presumption?).
      *   Limitations: Simulation lacks historical context, real coercion, and long-term iteration.

  8.  **Refining the Materials (Self-Correction during drafting):**
      *   *Critique:* Is 20 minutes enough for negotiation?
      *   *Fix:* Make the briefs very clear about the "Red Line."
      *   *Critique:* Will they actually get stuck?
      *   *Fix:* The briefs must be mutually incompatible on at least one dimension to guarantee deadlock in Phase 2.
      *   *Critique:* How to handle 4 students per group?
      *   *Fix:* Assign roles within the delegation (Minister of Tech, Minister of Trade, Legal Counsel, Prime Minister) to ensure engagement.

  9.  **Final Polish:**
      *   Ensure the tone is academic but actionable.
      *   Make sure the "Instructor Moves" are specific scripts.
      *   Check the timing strictly. 75 minutes flies.

  *(Self-Correction on Policy Domain)*: "Digital Data" might be too complex for a quick sim. Let's go with **"Environmental Standards for Industrial Runoff."** It's classic federalism.
      *   *Why?* Physical spillovers are easier to grasp than digital ones. Upstream/Downstream dynamics are intuitive.
      *   *Revised Plan:* 6 States along a River System.
      *   *Issue:* Permissible pollution levels & Monitoring enforcement.
      *   *Spillover:* Upstream pollutes, Downstream suffers.
      *   *Centralization Wish:* Downstream wants Union standards. Upstream wants Local control.
      *   *Twist:* Every state is Upstream of someone and Downstream of someone (circular or networked).
      *   *Actually, let's stick to the prompt's request for "diverging from union median" and "spillover."* A River model is good, but a **"Cross-Border Transport & Safety"** model might be more symmetrical.
      *   *Decision:* Let's go with **"Autonomous Vehicle (AV) Safety & Liability Standards."**
      *   *Reasoning:* High tech (fits undergrads), clear safety vs. innovation trade-off, clear cross-border operation (spillover), clear liability issues.
      *   *States:* 6 Regions.
      *   *Conflict:* Safety strictness vs. Innovation speed.
      *   *Spillover:* Cars cross borders. Different rules = accidents or trade barriers.

      *Wait, the prompt asks for specific brief elements:* (i) local preference diverging from union median, (ii) spillover, (iii) issue preferring union-wide rules.
      *   Let's create the 6 briefs based on AVs.

      *Wait, one more check:* The prompt emphasizes the *allocator* problem. The simulation needs to force them to realize that agreeing on the policy is impossible without agreeing on who has the right to set it.
      *   Okay, I will structure the negotiation so they *think* they are negotiating policy, but the Instructor will reveal that any policy agreement is non-binding without a procedural ratification.

      *Let's finalize the "Who Decides" Ballot.* It needs to be stark.
      *   Option A: Union Commission (Majority Vote).
      *   Option B: Council of States (Unanimity).
      *   Option C: Independent Tribunal (Judicial Review).
      *   Option D: Status Quo (Each decides).

      *Instructor Moves:* I need to be ready to show why each fails the subsidiarity test they read about.

      *Debrief:* Must explicitly map to the "presumption vs. authority" distinction.

      *Let's write it.*

      *(Final thought on Timing)*: 75 minutes is tight.
      *   0-5: Setup.
      *   5-15: Group Prep.
      *   15-35: Policy Negotiation (Intentionally difficult).
      *   35-40: Instructor Intervention (The Twist).
      *   40-55: Procedural Negotiation (Who Decides).
      *   55-65: Vote & Score.
      *   65-75: Debrief.
      *   *Correction:* Need more time for the "Who Decides" drafting. Cut Policy Negotiation to 15 mins. They won't solve it anyway.

      *(Final thought on Scoring)*: Use "Sovereignty Chips."
      *   Start with 10 each.
      *   Lose chips if policy hurts you.
      *   Lose chips if you compromise sovereignty.
      *   Goal: End with most chips.

      *Let's assemble the briefs.*
      *   Union Median: Moderate safety, mutual recognition.
      *   State 1 (Innovator): Low safety, high speed. Spillover: Unsafe cars enter neighbors. Wants Union ban on safety checks (prevents barriers).
      *   State 2 (Safety First): High safety. Spillover: Blocks cars from neighbors. Wants Union minimum safety floor.
      *   State 3 (Liability Hawk): Strict liability for makers. Spillover: Makers move elsewhere. Wants Union liability cap.
      *   State 4 (Liability Dove): No liability for makers. Spillover: Victims sue in other states. Wants Union victim compensation fund.
      *   State 5 (Data Sovereign): Data must stay local. Spillover: Breaks AV networks. Wants Union data free-flow.
      *   State 6 (Infrastructure): Road standards vary. Spillover: Confusion. Wants Union infrastructure fund.

      *Wait, to make the "Who Decides" point hit harder, the briefs should explicitly state:* "You suspect other states will cheat on any agreement unless enforced by X."
      *   No, that gives it away.
      *   Better: "You prefer Local Control on Issue X, but you need Union Action on Issue Y."
      *   This creates the hypocrisy/complexity that makes a simple policy vote impossible.

      *Okay, ready to generate.*
answer: |-
  # Simulation: The Competence Trap
  **Course:** Federalism & Multilevel Governance (Upper-Level Undergraduate)
  **Time:** 75 Minutes
  **Students:** 24 (6 Delegations of 4)
  **Policy Domain:** Autonomous Vehicle (AV) Safety & Liability Standards

  ## 1. Learning Objective
  To demonstrate that subsidiarity is not merely a presumption about *policy outcomes* (local vs. central), but a conflict over *meta-competence* (who has the authority to apply the presumption). Students will experience that every allocator of competence has a vested interest in the allocation, making a neutral application of subsidiarity impossible.

  ## 2. Materials & Setup
  *   **Room:** 6 clusters of tables.
  *   **Handouts:**
      1.  **Delegation Briefs** (6 distinct versions, see below).
      2.  **Union Context Sheet** (Defines the "Union Median" and current gridlock).
      3.  **Sovereignty Ledger** (Scorecard for each student).
      4.  **The Constitutional Ballot** (Distributed at Minute 40).
  *   **Props:** 100 "Legitimacy Tokens" (poker chips or paper slips) per delegation.

  ## 3. The Scoring Scheme (Sovereignty Ledger)
  Students do not trade money. They manage **Legitimacy Tokens**.
  *   **Starting Endowment:** 10 tokens per delegation.
  *   **Policy Gain:** +3 tokens if the final rule matches your "Local Preference."
  *   **Spillover Loss:** -2 tokens for every other delegation whose policy harms you (defined in brief).
  *   **Centralization Cost:** -1 token for every competence you cede to the Union (regardless of outcome).
  *   **Procedural Victory:** +5 tokens if the final "Who Decides" rule gives your delegation veto power or agenda-setting control.

  *Winning Condition:* The delegation with the most tokens wins. Individual students within the winning delegation get a small grade bonus.

  ## 4. The Timeline (75 Minutes)

  | Time | Phase | Activity | Instructor Role |
  | :--- | :--- | :--- | :--- |
  | **00-05** | **Briefing** | Distribute briefs. Explain tokens. Emphasize: *"Your goal is to maximize your tokens. You may negotiate treaties."* | Neutral Facilitator. |
  | **05-20** | **Phase 1: Strategy** | Delegations read briefs internally. Assign roles (Minister of Trade, Legal Counsel, etc.). Calculate red lines. | Circulate. Answer clarifying questions only. |
  | **20-40** | **Phase 2: Policy Negotiation** | Open floor. Delegations propose Union-wide AV standards. Try to agree on a *Policy Treaty*. | **Silent Observer.** Take notes on who argues for "local rights" vs. "union standards." |
  | **40-45** | **The Turn** | **Stop Negotiation.** Announce gridlock. Distribute **The Constitutional Ballot**. | Shift to **Constitutional Designer**. |
  | **45-60** | **Phase 3: Meta-Rule** | Delegations must now agree on *who decides* the policy. Draft the procedural rule. | **Provocateur.** Challenge feasibility of their procedural rules (see "Instructor Moves"). |
  | **60-65** | **Voting** | Final vote on the Procedural Rule. Calculate scores based on the outcome. | Tally Keeper. |
  | **65-75** | **Debrief** | Connect simulation to subsidiarity theory. | Lecturer. |

  ---

  ## 5. Delegation Briefs (Confidential)
  *Note to Instructor: The "Union Median" is Moderate Safety Standards + Mutual Recognition of Licenses.*

  **Delegation 1: The Innovator (Silicon Valley analogue)**
  *   **Local Preference:** Minimal safety testing. Speed to market is priority. (Diverges from Union Median).
  *   **Spillover Suffered:** If neighbors ban your cars, you lose market access.
  *   **Spillover Imposed:** Your less-tested cars crash in neighbor states, causing political backlash there.
  *   **Centralization Wish:** You want the Union to **ban states from blocking data flows** needed for AVs. (You need local discretion on safety, but Union protection on data).

  **Delegation 2: The Safety Fortress (Nordic analogue)**
  *   **Local Preference:** Extreme safety testing. Zero tolerance for risk. (Diverges from Union Median).
  *   **Spillover Suffered:** Unsafe cars from State 1 enter your roads and crash.
  *   **Spillover Imposed:** You block State 1's cars, angering their industry.
  *   **Centralization Wish:** You want a **Union-wide Minimum Safety Floor**. (You want Union power to force State 1 to be safer, but keep right to go stricter).

  **Delegation 3: The Liability Hawk (Consumer Protection analogue)**
  *   **Local Preference:** Strict liability for manufacturers. Victims sue easily.
  *   **Spillover Suffered:** Manufacturers move to State 4 to avoid your laws, reducing your tax base.
  *   **Spillover Imposed:** Victims from State 4 cross border to sue in your courts, clogging your system.
  *   **Centralization Wish:** You want **Union-wide Liability Caps**. (Paradoxically, you want to lock in a cap to prevent a "race to the bottom" that hurts your manufacturers, even if you prefer strict liability locally).

  **Delegation 4: The Liability Dove (Industry Lobby analogue)**
  *   **Local Preference:** No manufacturer liability. Users assume risk.
  *   **Spillover Suffered:** Your citizens injured in State 3 cannot get compensation.
  *   **Spillover Imposed:** Your cheap insurance attracts manufacturers away from State 3.
  *   **Centralization Wish:** You want **Union-wide Victim Compensation Fund**. (You want the Union to pay victims so you don't have to change your liability laws).

  **Delegation 5: The Data Sovereign (Security analogue)**
  *   **Local Preference:** All AV data must be stored on local servers.
  *   **Spillover Suffered:** AV networks break because data cannot cross borders.
  *   **Spillover Imposed:** Your firewall slows down navigation for neighbors' cars.
  *   **Centralization Wish:** You want **Union-wide Security Certification**. (You want the Union to certify your servers as "secure" so neighbors stop complaining, but keep local storage rules).

  **Delegation 6: The Swing State (Median voter analogue)**
  *   **Local Preference:** Union Median (Moderate Safety).
  *   **Spillover Suffered:** Fragmentation. You are surrounded by incompatible regimes (1, 2, 5).
  *   **Spillover Imposed:** None significant.
  *   **Centralization Wish:** You want **Harmonization**. (You are the natural coalition builder, but you distrust State 1 and 2 equally).

  ---

  ## 6. The Turn (Minute 40)
  **Instructor Script:**
  *"Stop. Look at your tokens. Look at the clock. You have been negotiating policy for 20 minutes. Most of you have not signed a treaty. Why? Because State 1 wants local safety rules, but State 2 needs central safety rules. State 3 wants local liability, State 4 wants central funds.
  You cannot agree on the *what* because you cannot agree on the *who*.
  I am confiscating your Policy Proposals. They are void.
  Here is **The Constitutional Ballot**. You have 15 minutes to draft a single rule that answers only this question: **Who has the authority to set AV standards?**"*

  **The Constitutional Ballot Options (They must draft the specifics):**
  1.  **Union Commission:** Proposes law, passed by Majority Vote of States.
  2.  **Council of States:** Law passes only by Unanimity.
  3.  **Judicial Tribunal:** Courts decide if a local law violates "Subsidiarity."
  4.  **Status Quo:** Each state decides; disputes settled by bilateral treaties.

  ## 7. Instructor Moves (Anticipating Student Proposals)
  *Students will try to write procedural rules that secretly rig the policy outcome. You must expose this.*

  **If they propose "Union Majority Vote":**
  *   **Move:** Turn to State 2 (Safety). *"If the Union votes by majority, State 1 and 4 can outvote you. Your safety standards will be lowered. Does your brief allow this?"*
  *   **Point:** Majority rule centralizes competence permanently. Subsidiarity is lost.

  **If they propose "Unanimity (Veto Power)":**
  *   **Move:** Turn to State 6 (Swing). *"State 1 can veto any safety rule. State 2 can veto any market access rule. Nothing will ever pass. Is paralysis a valid governance strategy?"*
  *   **Point:** Unanimity preserves localism but kills collective action.

  **If they propose "Judicial Tribunal (Courts decide)":**
  *   **Move:** *"Excellent. A neutral arbiter. But what text do they apply? If the Constitution says 'Protect Subsidiarity,' does the Judge presume for State 1 or the Union? Who appoints the Judges?"*
  *   **Point:** Courts are not neutral; their appointment and interpretive mandate are political choices.

  **If they propose "Rotating Authority" (Each state decides for 1 year):**
  *   **Move:** *"State 1 holds the pen next year. They will write a law legalizing unsafe cars that you have to accept. Are you willing to risk that?"*
  *   **Point:** Time-sharing competence creates uncertainty and regulatory churn.

  ---

  ## 8. Debrief (Minute 65-75)

  **Part 1: The Experience (5 mins)**
  *   Ask: *"In Phase 2, how many of you argued for 'Local Control' because you truly believed it was better, versus because it benefited your brief?"* (Show of hands).
  *   Ask: *"In Phase 3, was it harder to agree on the Rule than the Policy? Why?"*

  **Part 2: Mapping to Theory (5 mins)**
  *   **Subsidiarity as Outcome:** The texts you read (EU, German, Swiss) describe a *presumption*. "If local works, keep it local."
  *   **Subsidiarity as Authority:** The simulation revealed the *allocator*. Who checks if "local works"?
      *   If the Union checks, they will find "local doesn't work" (Centralization bias).
      *   If the State checks, they will find "local works fine" (Decentralization bias).
      *   If the Court checks, they depend on who appointed them.
  *   **The Core Insight:** Allocating competence is the most centralizing power of all. You cannot use subsidiarity to solve the subsidiarity problem.

  **Part 3: Simulation Limitations (Frank Admission)**
  *   **What this missed:**
      1.  **Iteration:** In reality, states learn to trust each other over decades. This was one-shot.
      2.  **Coercion:** The Union usually has a budget or army to enforce compliance. Here, you only had tokens.
      3.  **Identity:** Students acted as rational agents. Real federalism involves national identity, history, and emotion which makes compromise harder (or easier) than rational calculation.
  *   **Takeaway:** When you read the German Basic Law's "necessity test," ask: *Who administers the test?* That is the real political battle.

  ---

  ## 9. Predictable Failures & Mitigation
  *   **Failure:** Students agree on policy too quickly in Phase 2.
      *   **Mitigation:** During circulation (Min 25), whisper to State 1 and State 2: *"Your brief says this is a red line. Do not compromise on safety standards."* Force the deadlock.
  *   **Failure:** Students refuse to engage with the "Who Decides" ballot, treating it as a vote on policy again.
      *   **Mitigation:** Reject any proposal that mentions "Safety" or "Liability." Demand purely procedural language (e.g., "Voting thresholds," "Appointment mechanisms").
  *   **Failure:** One student dominates the delegation.
      *   **Mitigation:** The Brief assigns specific roles (Minister, Legal, etc.). Require all four signatures on the final treaty.

  ## 10. Instructor Prep Checklist
  *   [ ] Print 6 sets of Briefs (color-coded by State).
  *   [ ] Prepare 600 Legitimacy Tokens (or equivalent).
  *   [ ] Whiteboard setup: Columns for each State to track token counts publicly.
  *   [ ] Timer visible to all students.
  *   [ ] Script for "The Turn" memorized (timing is critical).
