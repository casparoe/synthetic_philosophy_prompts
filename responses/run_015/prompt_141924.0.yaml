answer: |-
  ### Part 1: Brainstorming Candidate Notions

  Here are the primary concepts from philosophy, psychology, and design that approach your phenomenon, evaluated against your four constraints (Featurelessness, Systemic Dependence, Normativity, Acquired Competence).

  1.  **Family Resemblance (Wittgenstein)**
      *   *The Idea:* Concepts are held together by a network of overlapping similarities, not a single common essence.
      *   *Fit:* Explains the lack of necessary physical features (stroke count, bowls).
      *   *Break:* You explicitly note there are *no* overlapping measurable features even between pairs. Wittgenstein usually implies *some* chain of similarity exists. More critically, Family Resemblance describes *categorization*, not *normativity*. It explains why a cookie can be an 'a', but not why a cookie 'a' can be *ugly* or *lazy*. It lacks the "standard" component.

  2.  **Prototype Theory (Rosch, Psychology)**
      *   *The Idea:* We categorize by comparing instances to a "best example" (prototype). Degrees of membership explain grading (good vs. bad).
      *   *Fit:* Excellent fit for the "good/bad" grading and the ability to recognize new instances.
      *   *Break:* Prototypes are usually statistical averages of features. You state there is no common skeleton or feature to average. Also, standard Prototype Theory is often individualistic; it struggles to explain the *systemic dependence* (why the 'a' changes when the 'o' changes) unless the prototype includes contextual data, which complicates the model.

  3.  **Structuralism (Saussure, Linguistics/Semiotics)**
      *   *The Idea:* Meaning (or identity) is derived from difference within a system. A sign is defined by what it is *not* (its neighbors).
      *   *Fit:* Perfectly explains the "dependence on neighbors" (stencil 'a' needs the sentence; 'a' shifts when 'o' shifts).
      *   *Break:* Structuralism is abstract and relational. It explains the *slot*, but not the *perceptual immediacy*. It doesn't explain why a specific shape *fills* the slot well or poorly (the aesthetic norm). It treats the signifier as arbitrary, whereas your "good/bad" judgment suggests the form matters intrinsically, not just conventionally.

  4.  **Functional Kind (Philosophy of Biology/Art)**
      *   *The Idea:* An object is a member of a kind if it performs a specific function (e.g., a heart pumps blood; a chair supports sitting).
      *   *Fit:* Explains the "cookie" and "shadow" cases (if it functions as a label, it's an 'a'). Explains normativity (a "good" 'a' performs the reading function fluently; a "bad" one hinders it).
      *   *Break:* Functional kinds usually allow for "broken" members (a broken heart is still a heart). In your workshop, a "wrong" 'a' might cease to be an 'a' entirely. The boundary between "bad member" and "non-member" is blurrier here than in standard functional kinds. Also, it doesn't fully capture the *visual* immediacy of the recognition.

  5.  **Enactivism / Sensorimotor Theory (Noë, O'Regan)**
      *   *The Idea:* Perception is a skill; we recognize things by knowing how we would interact with or make them.
      *   *Fit:* Explains the "scrawl" and the "acquired competence" (literacy is a motor skill).
      *   *Break:* Struggles with the "cookie" or "shadow" where no motor action is possible or intended. It also doesn't easily account for the *systemic* constraints (why the 'a' must change if the 'o' changes) unless the motor program includes the whole alphabet.

  6.  **Social Kind (Searle, Institutional Fact)**
      *   *The Idea:* Things exist as such only because of collective agreement (e.g., money, borders).
      *   *Fit:* Explains the "acquired" nature and the stability of judgment (it's not up for negotiation).
      *   *Break:* Social kinds feel *negotiated*. Your students' judgment felt *discovered* ("confused rather than having different tastes"). Social Kind theory implies arbitrariness; your phenomenon feels constrained by the visual system, not just social rule.

  ### Part 2: Diagnosis and Selection

  **Is this one phenomenon or a bundle?**
  It is a **single, tight phenomenon**, but it is hybrid. You cannot separate the *identity* (is it an 'a'?) from the *value* (is it a good 'a'?) because the identity is constituted by the *potential for value*. An 'a' is a thing *designed to be read*. If it fails too badly at that design, it loses its identity. The "boundary" and the "standard" are two sides of the same coin: **fitness for a systemic role.**

  **The Best Fit:**
  None of the established terms fit perfectly.
  *   *Family Resemblance* misses the normativity.
  *   *Prototype* misses the structural dependency.
  *   *Functional Kind* misses the perceptual immediacy.
  *   *Structuralism* misses the aesthetic quality.

  **The Coined Term:**
  I propose we call this a **Typonomic Kind**.
  *(From Greek *typos* [impression/figure] + *nomos* [law/custom/norm].)*

  **Definition:**
  A **Typonomic Kind** is a perceptual category where:
  1.  **Identity is Systemic:** Membership is determined not by intrinsic physical features, but by the object's capacity to occupy a specific structural slot within a learned system of differences (the alphabet).
  2.  **Normativity is Constitutive:** The "goodness" of an instance is not an added aesthetic judgment but a measure of how fluently it performs its systemic role (legibility/distinctness).
  3.  **Recognition is Competence-Based:** Identification requires internalized mastery of the system (literacy), not just sensory processing.

  In short: An 'a' is not a shape; it is a **normative role in a visual system.**

  ### Part 3: Differentiation

  Here is how **Typonomic Kind** differs from the near-misses you listed:

  *   **Vs. Family Resemblance:** Family Resemblance implies a chain of similarities. Typonomic Kind implies a **shared destination**. The scrawl and the cookie share no features, but they both successfully *arrive* at the same functional slot in your mental alphabet. The link is not overlap, but *equivalence of effect*.
  *   **Vs. Prototype/Average:** A prototype is a "central image." A Typonomic Kind has no central image. It has a **central Function**. You can be far from the "average shape" but still be a perfect 'a' if you fulfill the structural role (e.g., a highly stylized 'a' that contrasts perfectly with its neighbors).
  *   **Vs. Conventional Rule (Traffic Sign):** A stop sign is arbitrary; a red octagon *could* have been a blue circle. A Typonomic Kind is **constrained by perception**. You cannot make a "good" 'a' out of a straight vertical line, because the visual system will not sustain the distinction from 'l' or 'I'. The "law" (*nomos*) is not just social agreement; it is an agreement *with human vision*.
  *   **Vs. Memorized Template:** A template matches pixel-to-pixel. Typonomic recognition is **invariant**. It ignores material, scale, and texture. It matches *relational structure* (openings, closures, weights) relative to the system, not absolute geometry.

  ### Part 4: Testing Against Hard Cases

  Here is how the **Typonomic Kind** account handles your specific edge cases:

  **1. The New Material/Dimension Case**
  *   *Scenario:* An 'a' rendered in a material or dimension nobody has ever used before (e.g., a 4D light projection).
  *   *Prediction:* If the projection sustains the **structural distinctions** required by the alphabet (it looks distinct from the 'o' and 'b' in that medium), it will be recognized as an 'a'.
  *   *Why:* Because the Kind is defined by *systemic role*, not material history. If the "light 'a'" creates the same *difference* in the reader's mind as a ink 'a', it is a member.
  *   *Failure Condition:* If the material makes the distinction impossible (e.g., the light bleeds so 'a' looks like 'o'), it fails to be an 'a', regardless of intent.

  **2. The Context-Dependent Flip**
  *   *Scenario:* A shape that flips between 'a' and 'o' depending on surroundings.
  *   *Prediction:* This is the **definitive proof** of Typonomic Kind. The shape itself is ambiguous; the *Kind* is resolved by the system.
  *   *Why:* Identity is systemic. In a sentence, the "slot" demands an 'a'. The visual system coerces the shape into the slot. This confirms the identity is not in the ink, but in the **relation between ink and system**.

  **3. The Unreadable Script**
  *   *Scenario:* A letter from a script you cannot read (e.g., Georgian to an English speaker).
  *   *Prediction:* You see a shape, but you do not see a **Typonomic Kind**. You cannot judge it as "good" or "bad" in the specific sense, only "pretty" or "ugly" (aesthetic) or "clumsy" (craft).
  *   *Why:* You lack the *nomos* (the law/system). Without the internalized alphabet, there is no functional slot to occupy. You cannot judge "legibility" if you cannot read. This confirms the "Acquired Competence" pillar.

  **4. The Deliberately Bad 'a'**
  *   *Scenario:* A skilled designer makes an 'a' that is clearly an 'a' but clearly a failure (e.g., uneven weight, awkward counter).
  *   *Prediction:* It remains a member of the Kind, but a **degenerate** one.
  *   *Why:* Typonomic Kinds allow for "sickness." A heart that pumps poorly is still a heart. An 'a' that reads poorly is still an 'a', provided it doesn't collapse into another letter. The "badness" is a measurement of **functional friction**. It is an 'a' that resists being read.

  **5. The Alien Alphabet**
  *   *Scenario:* An entire invented alphabet built on a different principle (e.g., no 'a' slot, or a circular logic).
  *   *Prediction:* Your recognition mechanism will **fail to latch**. You will try to force the shapes into your Latin Typonomic Kinds (seeing 'a's where there are none), or you will see them as mere patterns.
  *   *Why:* Typonomic Kinds are **system-relative**. There is no universal 'a'. There is only 'a'-in-Latin. If the system doesn't have the slot, the Kind cannot exist for you.

  ### Part 5: Falsification and Evidence

  **What would count as evidence against this account?**

  1.  **Universal Recognition:** If you showed your "cookie 'a'" or "shadow 'a'" to a literate adult who speaks a language with a completely disjoint script (e.g., monolingual Mandarin speaker with no exposure to Latin alphabet) and they *instantly* recognized it as 'a' without learning. This would prove the Kind is innate or geometric, not systemic/acquired.
  2.  **Feature Necessity:** If you could find a single physical feature (e.g., "must have a counter") that *every* agreed-upon 'a' possesses, and every 'non-a' lacks. This would collapse the Typonomic Kind back into a Classical Definition. (You suspect this is impossible, and I agree).
  3.  **Dissociation of Value and Identity:** If designers consistently agreed that a specific shape was a "perfectly good 'a'" (high aesthetic/functional score) but "not really an 'a'" (identity failure), or vice versa ("definitely an 'a'" but "perfectly good"). In Typonomic Kinds, identity and functional value are linked. If they can be fully severed, the account fails.
  4.  **Context Independence:** If a stencil 'a' was identified as 'a' with 100% consistency *even when isolated* from its family, by everyone, without hesitation. Your observation that it reads as a 'c' or 'o' in isolation is strong evidence *for* the Typonomic account. If future testing showed context doesn't matter, the "Structural" part of the definition is wrong.

  ### Summary

  You are describing a **Typonomic Kind**.
  It is not a shape, but a **license to read**.
  The "boundary" is the limit of that license (does it still allow reading?).
  The "standard" is the ease of that reading (how fluently does it work?).
  It is featureless because the *role* is abstract, even if the *instances* are physical.
  It is normative because the role has a *telos* (purpose).
  It is acquired because the *system* is cultural.

  You are not teaching students to draw shapes; you are teaching them to **inhabit a structural slot** with varying degrees of competence. That is why they agree on the "good" ones: they are all measuring the same friction against the same system.
