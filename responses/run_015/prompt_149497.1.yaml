answer: |-
  There is no single, canonical term in decision theory or psychology that captures *exactly* this rhetorical move in the way "Cobra Effect" or "Motte-and-Bailey" does. However, you have correctly identified that it is a composite of several well-documented biases, welded together into a specific institutional habit.

  The closest established concepts are **Ambiguity Aversion** (preferring known risks to unknown risks), **Omission Bias** (judging harm by action as worse than harm by inaction), and the **Precautionary Principle** (often applied one-sidedly).

  But none of these quite capture the *epistemic* sleight-of-hand you're describing: the claim that uncertainty makes Option A un-rankable against Option B, while Option B is treated as rankable despite identical uncertainty.

  If you need a label to use in the room to name the dynamic, the most precise term is **Epistemic Grandfathering**.

  Here is the breakdown of why this fits, where the concept comes from, and the boundaries you asked for.

  ### 1. The Diagnosis: Three Biases in a Trench Coat
  Your committee's move is not one bias, but three working in concert. Recognizing the components helps dismantle the argument.

  *   **Ambiguity Aversion (The Ellsberg Paradox):** People prefer to bet on an urn with 50 red/50 black balls (known risk) than an urn with an unknown ratio (ambiguity), even if the expected value is identical. Your committee treats the "audited" program as the known urn, even though the *long-term* balls are unknown for both.
  *   **Omission Bias (The Action/Inaction Asymmetry):** This explains why the objection flips when you propose *stopping* funding. Harm caused by *funding* a new thing (commission) feels riskier than harm caused by *continuing* a failing thing (omission). The "unknown knock-on effects" are treated as a threat only when they are triggered by *change*.
  *   **Shifting the Burden of Proof:** This is the rhetorical engine. The incumbent program is granted **Epistemic Immunity**: it is assumed safe/effective until proven otherwise. The new program must prove safety/efficacy. The "we can't predict the future" argument is a tool to enforce this burden. It says: "The new proposal must resolve long-term uncertainty to be funded; the old proposal does not."

  ### 2. The Name: Epistemic Grandfathering
  In regulation, a "grandfather clause" allows old systems to operate under old rules while new systems must meet stricter standards.

  **Definition:** **Epistemic Grandfathering** occurs when uncertainty is treated as a disqualifying risk for novel interventions, but as a neutral background condition for incumbent interventions, solely due to their incumbency.

  It is distinct from *Status Quo Bias* because it claims to be about *knowledge* (we don't know the effects) rather than *preference* (we like the current state). It is distinct from general *Cluelessness* because it is applied asymmetrically.

  ### 3. The Load-Bearing Part: The Optimizer's Curse
  You hit the nail on the head regarding the estimates.
  *   **The Reality:** Both options have high variance in their 10-year outcomes.
  *   **The Move:** The committee applies a **Variance Discount** to the new option (due to the Optimizer's Curse: high uncertainty means high chance of over-estimation) but *fails to apply the same discount* to the incumbent's long-term projection.
  *   **The Error:** They are comparing the new option's *projected* long-term value (which is uncertain) against the incumbent's *observed* short-term value (which is certain), while pretending the incumbent's long-term value is equally certain.

  ### 4. Where Does It Stop? (Boundary Conditions)
  You asked where this logic should logically dissolve. If the move were truly epistemic (about knowledge) rather than psychological (about comfort), it would vanish under these conditions. If it persists, it is pure Status Quo Bias.

  **Case A: The incumbent is only one year old.**
  *   **Does the move apply?** No.
  *   **Why:** Epistemic Grandfathering relies on the *perception* of stability. A one-year track record provides receipts, but it does not establish a "baseline of normalcy." If the committee deploys the "unknown long-term effects" veto against a new challenger when the incumbent is also effectively new, they are admitting the uncertainty is symmetric. The argument collapses.

  **Case B: Both options have real data behind them.**
  *   **Does the move apply?** No, it mutates.
  *   **Why:** If the new proposal is a replication of a program run successfully elsewhere, the "unknown effects" argument loses force. The move shifts from "we can't know" to "we don't know *here*." If they still block it, they are arguing for **Contextual Specificity** (what worked there won't work here). This is a valid argument, but it is no longer about *cluelessness*; it is about *external validity*.

  **Case C: The intervention is reversible (can back out in two years).**
  *   **Does the apply?** Absolutely not.
  *   **Why:** This is the kill shot. The "unknown 10-year knock-on effects" argument relies on the premise of **irreversibility** or **path dependence**. If you can audit and stop in two years, the "long-term uncertainty" is capped. You are no longer betting on a 10-year black box; you are buying a 2-year option to learn. If the committee uses the long-term uncertainty veto on a reversible grant, the move is intellectually bankrupt. It is fear disguised as prudence.

  ### 5. How to Interrupt the Move
  Since you don't have a canonical label, you have to describe the mechanism. When the move arises, try this:

  1.  **Force Symmetry:** "We agree we can't model the 10-year effects of the new proposal. Can we model the 10-year effects of the incumbent? If not, we are equally clueless about the long term for both. We should discount both, or neither."
  2.  **Highlight Reversibility:** "Is this grant irreversible? If we can audit in 18 months and stop, does the 10-year uncertainty still matter? Or are we paying for the *option* to find out?"
  3.  **Name the Burden:** "It feels like we are asking the new proposal to prove it won't have bad long-term effects, while we assume the incumbent won't. Given we have no data on the incumbent's long-term effects either, should we apply the same standard of proof to both?"

  ### Summary
  You are seeing **Epistemic Grandfathering**: the selective application of uncertainty as a penalty. It is powered by **Ambiguity Aversion** and protected by **Omission Bias**. It is rational only insofar as the incumbent has a *proven* track record of *stopping* negative effects, but it becomes irrational when used to veto the *potential* of the new while ignoring the *unknowns* of the old.

  If the intervention is reversible, the argument is invalid. If the incumbent is new, the argument is weak. If the argument persists anyway, it is not epistemic caution; it is **Status Quo Bias wearing a lab coat.**
