answer: |-
  ### Brainstorming: Mapping the Conceptual Space

  Before settling on a definitive explanation, we must disentangle the overlapping layers of moral evaluation. The core tension lies between the *deontic* status of an act (is it permitted/required?) and the *aretaic* status of the agent (is she virtuous/praiseworthy?). To navigate this, I will map three specific conceptual contrasts that often generate confusion.

  1.  **Motivating Reasons vs. Right-Making Features:**
      *   *Right-Making Features:* These are objective facts that render an action morally correct (e.g., "the child is suffering," "the promise was made").
      *   *Motivating Reasons:* These are the psychological states that actually move the agent to act (e.g., "I want to help," "I fear punishment").
      *   *Interaction:* For an action to have moral worth, the motivating reasons must appropriately track the right-making features. If the right-making feature is "need," but the motivating reason is "profit," the action conforms to duty but lacks worth. The gap between these two is where "accidentalrightness" occurs.

  2.  **Moved by Moral Rightness *as Such* vs. Moved by Underlying Features:**
      *   *Rightness as Such:* Acting because one recognizes the act as "duty" or "morally obligatory" (a high-level moral concept).
      *   *Underlying Features:* Acting directly in response to the non-moral values that ground the duty (e.g., kindness, pain, fairness) without necessarily categorizing them as "moral."
      *   *Interaction:* A common error is thinking one must think "This is my duty" to have moral worth. However, a person who helps simply because they see suffering (the underlying feature) often displays *more* moral worth than someone who helps only because a rule commands it. The distinction prevents moral fetishism; we value the concern for the victim, not just the concern for the moral law.

  3.  **Non-Accidental Correctness vs. Mere Coincidence:**
      *   *Coincidence:* The action aligns with what is right, but the agent's motive had no reliable connection to that rightness (luck).
      *   *Non-Accidental:* The action flows from a stable disposition or motive that reliably targets the right-making features.
      *   *Interaction:* Moral worth requires a non-accidental link. If a shopkeeper charges fair prices only because he fears a health inspector (coincidence with honesty), he gets no moral credit. If he does it because he values fairness (non-accidental), he does. This distinction filters out luck from moral evaluation.

  ***

  ### Systematic Explanation: Moral Conformity vs. Moral Worth

  As an advanced student, you are likely familiar with the basic distinction between an action being *right* (it is what ought to be done) and an action being *good* (it stems from a good will). However, the friction arises when we analyze complex human psychology. An action has **moral worth** only when the agent performs the right action *because* it is right, or more precisely, because of the features that make it right. If the action is right merely by coincidence or for non-moral reasons, it possesses **mere conformity**.

  To clarify this, we must look beyond the outward behavior and examine the "because" in the agent's psychology. We are asking: What explains the success of this action? Was it the agent's grasp of moral value, or was it something else?

  Let us apply this framework to the three cases provided.

  #### Case 1: The Night-Shift Nurse
  **The Scenario:** The nurse stays late to comfort a patient. She recognizes the patient's vulnerability (a right-making feature). However, she also knows this earns supervisor praise, and she enjoys that praise.
  **Analysis:**
  This case introduces the problem of **mixed motives**. Rarely do humans act from a single, pure impulse. The critical question is whether the self-interested motive (praise) displaces the moral motive (care) or merely accompanies it.
  *   **Conformity vs. Worth:** The action is certainly right. Does it have moral worth? Yes, typically philosophers would grant this moral worth.
  *   **Why:** The presence of a self-interested motive does not automatically negate moral worth, provided the moral motive is *sufficient* on its own. If the nurse would have stayed even without the prospect of praise (because the vulnerability demanded it), the action is non-accidentally right. The desire for praise is an additive bonus, not the explanatory cause of the moral success.
  *   **The Distinction's Work:** Here, the distinction between *motivating reasons* and *right-making features* is crucial. The right-making feature is the patient's vulnerability. The nurse is moved by this feature. The fact that she is *also* moved by praise does not sever the link between her action and the moral value. She is not merely coinciding with the right thing; she is responding to the need.

  #### Case 2: The Shopkeeper
  **The Scenario:** The shopkeeper charges fair prices during a shortage. He does not do this out of concern for customers, nor out of prudence (profit), but because he internalized a rigid rule of "honest dealing" from upbringing. He follows it rigidly even when he "does not see the point."
  **Analysis:**
  This case tests the limit of **motivation by rightness as such** versus **underlying features**.
  *   **Conformity vs. Worth:** The action is right (fair pricing). Does it have moral worth? This is highly contested, but a nuanced view suggests it lacks *full* moral worth.
  *   **Why:** While the shopkeeper is not acting for profit (which would be mere conformity), he is acting from a kind of blind habit or conditioning. He follows a rule but is disconnected from the *value* the rule protects (fairness, customer welfare). By admitting he "does not see the point," he severs the connection between his motive and the right-making features.
  *   **The Distinction's Work:** This highlights the contrast between being moved by *moral rightness* (the rule) versus the *underlying features* (fairness/need). A virtuous agent understands *why* honesty is required. This shopkeeper treats the moral rule like a traffic law—something to be obeyed without understanding its purpose. While better than a dishonest shopkeeper, he lacks the moral understanding that grants full credit. He is non-accidentally doing the right thing (due to habit), but the psychological connection to the *good* is attenuated. He is morally reliable, but not necessarily morally wise.

  #### Case 3: The Bystander
  **The Scenario:** A bystander rescues a drowning child. The motive is a mix: genuine concern for the child (sufficient on its own) AND a desire to appear heroic (also operative).
  **Analysis:**
  This case complicates the assessment through **overdetermination**.
  *   **Conformity vs. Worth:** The action is right (saving a life). Does it have moral worth? Yes, but it is complicated.
  *   **Why:** Overdetermination occurs when multiple motives are each sufficient to produce the action. If the concern for the child was sufficient to cause the rescue, the presence of the desire for heroism does not negate the moral worth. The action is non-accidentally right because the moral motive was strong enough to carry the weight of the action alone.
  *   **The Distinction's Work:** This forces us to refine what "done for the right reasons" means. It does not mean "done *only* for the right reasons." It means the right reasons were *effective*. However, the presence of the heroic desire might diminish the *degree* of praiseworthiness compared to a rescuer who felt no desire for glory. The distinction helps us see that while the action is fully creditable as a moral act, the agent's character might be slightly less pristine than one without the vanity. The moral motive tracked the right-making feature (the child's life), ensuring the act wasn't luck, even if the agent's psychology was crowded.

  ### Complications: Luck, Overdetermination, and Motivation

  These cases reveal why the distinction between conformity and worth is necessary for a robust moral psychology.

  **1. The Problem of Luck (Non-Accidental vs. Coinciding)**
  If we judged morality solely on outcomes, the Shopkeeper and a truly virtuous shopkeeper would be identical. But morality is also about agency. If the Shopkeeper had been raised by thieves, he might be exploiting the shortage. His current honesty is partly a matter of lucky upbringing. By distinguishing *moral worth*, we acknowledge that while his action is good, his *agency* is less engaged than someone who understands and chooses the good. The distinction filters out the luck of conditioning from the credit due to the agent.

  **2. The Problem of Overdetermination (Mixed Motives)**
  The Nurse and Bystander cases show that moral worth is not an all-or-nothing property destroyed by impurity. If we required motives to be pure (only one reason, and it must be moral), almost no human action would have moral worth. The distinction allows us to say: "The action has moral worth because the moral motive was sufficient," while acknowledging, "The agent is not a saint because they also wanted praise." This preserves the objectivity of the act's value while allowing for gradations in character evaluation.

  **3. Motivation by Rightness vs. Right-Making Features**
  This is perhaps the most subtle point. If we insist that agents must act *because it is their duty* (motivation by rightness as such), we risk excluding compassionate people who act spontaneously on behalf of others without consulting a moral rulebook. The Nurse does not necessarily think, "It is my duty to stay." She thinks, "This patient is scared." The latter is the *right-making feature*.
  The distinction clarifies that moral worth attaches to responsiveness to value (suffering, need, fairness), not necessarily responsiveness to moral concepts. The Shopkeeper fails not because he lacks emotion, but because he is responsive to a *rule* while being blind to the *value*. The Nurse succeeds because she is responsive to the *value* (vulnerability), even if she also likes praise.

  ### Conclusion: Praiseworthiness and Moral Credit

  Why do we labor over these fine-grained distinctions? What hangs on them?

  The stakes involve the difference between evaluating **states of affairs** and evaluating **persons**.
  *   **Permissibility and Requiredness** are concerned with the *action*. We need these concepts to coordinate social life, enforce laws, and ensure basic welfare. For these purposes, the Shopkeeper and the Virtuous Merchant are functionally equivalent; both charge fair prices. The world is better off with either.
  *   **Praiseworthiness and Moral Credit** are concerned with the *agent*. These concepts allow us to distinguish between a well-oiled machine (or a conditioned animal) and a moral person.

  When we assign moral worth, we are identifying who is a reliable partner in moral cooperation. The Nurse and the Bystander are reliable because their motives track moral values; even if they are imperfect, their connection to the good is robust. The Shopkeeper is reliable only so long as his conditioning holds.

  Ultimately, the distinction between an action merely turning out right and having moral worth protects the idea that morality is about *relationship* and *understanding*, not just output. It ensures that moral credit is reserved for those who engage with the moral landscape through an appreciation of value, rather than those who merely collide with the right outcome by accident, habit, or self-interest. It allows us to say that while we may accept the Shopkeeper's goods, we trust the Nurse with our lives.
