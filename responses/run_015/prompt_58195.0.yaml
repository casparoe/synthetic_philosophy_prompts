  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in ethics and moral psychology.
      *   **Task:** Explain the difference between an action merely turning out to be morally right (conformity) and having moral worth (done for the right reasons).
      *   **Target Audience:** Advanced undergraduate (knows basics of duty, consequences, virtue, but confused by fine-grained distinctions).
      *   **Structure:**
          1.  Short brainstorming section mapping conceptual space (must include three specific contrasts).
          2.  Systematic explanation using three specific invented cases (Nurse, Shopkeeper, Bystander).
          3.  Discussion of complications (overdetermination, mixed motives, luck).
          4.  Conclusion on praiseworthiness/moral credit vs. permissibility/requiredness.
      *   **Constraints:** No bibliography or reading list. Focus on conceptual analysis.

  2.  **Brainstorming & Conceptual Mapping (Mental Draft):**
      *   *Core Distinction:* Right Action (Deontic status) vs. Moral Worth (Aretaic status).
      *   *Contrast 1: Motivating Reasons vs. Right-Making Features.*
          *   Motivating Reason: Why the agent acted (psychological state).
          *   Right-Making Feature: What makes the act objectively good (e.g., relieving pain).
          *   Interaction: To have moral worth, the motivating reason must track the right-making feature.
      *   *Contrast 2: Moved by "Rightness" vs. Moved by "Underlying Features".*
          *   Kantian view: Must act *from duty* (concept of rightness).
          *   Virtue/Intuitionist view: Can act from kindness/need directly without moralizing.
          *   Interaction: Does one need to think "This is my duty" or just "This person is suffering"?
      *   *Contrast 3: Non-accidental vs. Coinciding.*
          *   Luck: Did the agent hit the target by chance or skill/intention?
          *   Interaction: Moral worth requires a non-accidental connection between motive and outcome.
      *   *Cases:*
          *   Nurse: Mixed motives (care + praise). Is care sufficient?
          *   Shopkeeper: Rigid rule following without understanding the "why" (honesty vs. prudence). Kant's example variant.
          *   Bystander: Overdetermination (save child + look heroic). Does the bad motive taint the good one?

  3.  **Drafting the Brainstorming Section:**
      *   Need to make this distinct from the main explanation but integral to the reasoning process.
      *   Explicitly label the three required contrasts.
      *   Ensure the tone is professional yet accessible.

  4.  **Developing the Systematic Explanation (The Core):**
      *   *Introduction:* Define "Right Action" vs. "Moral Worth." Use the terms "conformity to duty" vs. "action from duty" (Kantian echo) but broaden to include virtue ethics nuances.
      *   *Case 1: The Night-Shift Nurse.*
          *   Action: Staying late.
          *   Motives: Care (good) + Praise (self-interested).
          *   Analysis: The care motive is sufficient. The praise motive is present but doesn't negate the care. This is *overdetermination*.
          *   Verdict: Likely has moral worth because the right-making feature (vulnerability) motivated the act, even if accompanied by other motives.
      *   *Case 2: The Shopkeeper.*
          *   Action: Fair pricing.
          *   Motives: Rigid rule internalization, no understanding of the point.
          *   Analysis: This is tricky. It looks like duty, but is it *understanding* the duty? If he doesn't see the point (fairness/welfare), is it just habit?
          *   Comparison: Kant's honest merchant. If he does it *only* because it's a rule he was taught, without grasping the moral value, does it have worth?
          *   Verdict: Contested. Strict Kantians might say yes (if the rule represents duty). Virtue ethicists might say no (lack of phronesis/understanding). I need to take a stance or explain the tension. Let's lean towards the idea that *blind* adherence lacks the full depth of moral worth compared to understanding *why*. However, to distinguish from mere conformity, we need to see if the rule *is* a moral rule. The prompt says "internalized a strict rule... follows it rigidly even when he does not see the point." This suggests a lack of connection to the right-making features. I will argue this limits moral worth.
      *   *Case 3: The Bystander.*
          *   Action: Rescue.
          *   Motives: Concern (sufficient) + Heroism (operative).
          *   Analysis: Similar to the nurse but the "heroism" motive is more morally ambiguous than "praise."
          *   Key Issue: Overdetermination. If the concern *would have been sufficient*, the act is non-accidental regarding the moral good.
          *   Verdict: Has moral worth, though perhaps "tainted" or less pure than if heroism were absent. The key is that the moral motive was *sufficient*.

  5.  **Addressing Complications:**
      *   *Overdetermination:* When multiple motives suffice. Does the bad one cancel the good one? (No, if the good one is sufficient).
      *   *Mixed Motives:* Rarely do we act from one pure motive. Moral worth is compatible with human complexity.
      *   *Luck:* The Shopkeeper case touches on luck (being raised right vs. choosing right). The distinction ensures we credit the agent's agency, not just lucky outcomes.
      *   *Motivation by Rightness vs. Right-Making Features:* Crucial distinction. One doesn't need to think "I am doing the Right Thing" (moral self-consciousness) to have moral worth. One can just respond to "suffering" (the feature). This solves the "self-congratulatory moralist" problem.

  6.  **Conclusion:**
