answer: |-
  1. Thesis and conceptual framing

  The reconstructed occasionalist position asserts that created entities lack intrinsic causal efficacy, yet natural regularities remain robust and real. Al-Ghazālī's doctrine is not a denial that fire burns cotton, but a denial that fire possesses the power to burn. Instead, regularities are sustained by direct divine concurrence, wherein God creates the effect simultaneously with the created occasion. Central to this view is the notion of concurrence-based counterfactuals. These are modal truths regarding what would occur under specific conditions, grounded not in mechanistic connections between creatures, but in the stable consistency of the Divine Will. When we claim that burning would not have occurred without fire, this counterfactual is true because God consistently wills burning upon the occasion of fire, not because fire necessitates burning by its own nature. This framework preserves the truth of causal statements while relocating their metaphysical foundation from the created order to the divine act.

  2. The core argument

  This reconstructed occasionalism relocates rather than eliminates the regularities science studies. Contemporary interventionist accounts of explanation define causation in terms of stable counterfactual dependencies: if one were to intervene to change the putative cause, the effect would change accordingly. Occasionalism satisfies this requirement perfectly. If a scientist removes the fire, the burning ceases, not because a creaturely power was extinguished, but because the occasion for divine concurrence has been removed. The dependency is real and manipulable, ensuring that empirical inquiry remains viable. The scientist tracks the patterns of divine habit, which are sufficiently stable to support prediction and control.

  This view must be distinguished sharply from both Humean regularism and dispositionalist metaphysics. Humean regularism denies necessary connections entirely, reducing causation to constant conjunctions observed in the past. Occasionalism, conversely, affirms genuine necessity but locates it in the Divine Will rather than nature. There is a real connection between fire and burning, guaranteed by God's consistent decree, avoiding the skepticism inherent in pure regularity theories. Conversely, dispositionalism attributes irreducible causal powers to objects themselves. Occasionalism rejects this ontological inflation. It argues that positing intrinsic powers is metaphysically redundant when a single divine agent can sustain all effects. By utilizing the interventionist framework, occasionalism demonstrates that scientific practice requires only modal robustness and predictive stability. It does not require that the objects of study possess independent productive capacities. Thus, science describes the consistent manners in which God acts upon the creation, rather than the autonomous interactions of created substances. The regularities are objective features of the world, grounded in the reliability of divine concurrence rather than creaturely autonomy.

  3. Objections and replies

  A standard objection holds that occasionalism makes science impossible by severing the link between observation and underlying reality. If fire does not truly burn, why study fire? The reply relies on the interventionist criterion: science aims at identifying invariant generalizations useful for manipulation. Since divine concurrence is consistent, the generalizations hold. The impossibility objection confuses ontological production with explanatory utility. Occasionalism preserves the latter even while revising the former.

  A second serious worry is that occasionalism renders natural properties explanatorily redundant. If God causes the burning, why posit fire at all? Why not create burning spontaneously? The response is that created occasions individuate divine action. God's will is universal, but specific effects require specific occasions to determine their particularity. Fire specifies *which* effect God produces at a given moment, even if it does not *produce* the effect itself. Natural properties are not idle; they serve as the specific conditions that trigger distinct modes of divine concurrence. Without fire, the specific instance of burning associated with combustion would not occur, even if God could create burning elsewhere. Thus, created things retain a functional role in the metaphysical architecture, distinguishing this view from a collapse into pure voluntarism where nature is entirely arbitrary. The structure of creation matters because God chooses to act according to a consistent wisdom that respects the occasions provided by created things.

  4. Bottom line

  This argument demonstrates that occasionalism is compatible with modern scientific practice when explanation is understood interventionally. Science tracks stable dependencies, which occasionalism secures through consistent divine concurrence. The most significant remaining cost is the theological commitment required to ground the necessary connections in a Divine Will rather than natural mechanisms. However, the argument succeeds in removing the primary obstacle to taking occasionalism seriously: the claim that it necessitates skepticism about natural regularities. By relocating causal power rather than denying causal order, the view remains metaphysically distinct yet empirically adequate.
