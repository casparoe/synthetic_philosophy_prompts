          Start with the context. I've been thinking about ELK. The standard setup involves a predictor and a reporter. The worry is the reporter optimizing for human approval rather than truth. Most solutions try to make the human-approval strategy unavailable. But this assumes the model's latent state is fully translatable into human concepts. If the model sees things we can't describe, faithfulness and legibility are incompatible. So the proposal is to reframe ELK not as truth elicitation but as lossy compression with a distortion budget defined by downstream decisions.

          Why existing methods fail: They assume a ground truth exists in human terms. If the model knows about quantum states of the diamond but we only know "diamond there/not there," forcing human-legibility throws away info. If the thrown-away info correlates with danger (e.g., diamond is about to disintegrate), the reporter is safe but useless. Constraining complexity doesn't help if the *concept* itself is missing from our ontology.

          The plan: Three months. Month 1: Build toy environments. A grid world where the "diamond" has hidden properties (color, velocity, structural integrity) that the predictor sees but the human observer definition ignores. Train two reporters that match on human-checkable data but diverge on latent states. Month 2: Analyze the divergence. Measure the "aliasing." Is the disagreement describable? If Reporter A says safe and Reporter B says unsafe, can we explain why in human terms? If not, it's pure aliasing. Month 3: Decision tasks. Define a set of actions (call guards, do nothing). Test if the aliasing leads to different optimal actions. Quantify the distortion budget required to keep action safety above a threshold.

