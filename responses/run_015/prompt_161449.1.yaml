      - No bold? Yes.
      - No tables? Yes.
      - No citations? Yes.
      - Length? Looks about right. ~1000 words.
      - Tone? Professional email.

      *Final check:* Did I include the specific diagnostic about two reporters agreeing on human-checkable cases? Yes. Did I include the failure condition about moving the bump? Yes. Did I include the month-by-month? Yes.

