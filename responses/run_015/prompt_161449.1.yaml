      Let's write.

      *Drafting...*
      Dear Program Officer, I am writing to propose a three-month independent grant to investigate a specific structural ambiguity in the Eliciting Latent Knowledge problem. The standard setup assumes a predictor trained on sensor streams and a reporter tasked with describing the underlying state, with the primary failure mode being the reporter optimizing for human approval rather than truth. Most current proposals attempt to make the human-approval strategy structurally unavailable by constraining the reporter or penalizing complexity. My concern is that these approaches quietly assume the target is a faithful, human-legible restatement of the model's latent state. If the model's world-model is richer than the space of concepts we can articulate, then no reporter can be both fully faithful and legible to us. In that regime, the difficulty is not deception but lossy compression. I propose to reframe the objective from asking for the truth to asking for a translation with an explicit distortion budget relative to a specified class of decisions. The core question is which features of the latent state must survive translation for the report to be safe to act on, and how we can detect when we have compressed away too much.

      The reason existing constrain-the-reporter approaches do not settle this, even granting they work technically, is that they optimize for consistency with human checks rather than fidelity to the latent structure. If the model perceives hazards that lack human vocabulary, forcing the reporter to speak only in human terms discards precisely the information needed for safety. A reporter could be perfectly honest in human concepts while omitting a catastrophic risk simply because that risk has no name in our ontology. Constraining complexity does not solve this because the missing concept might be simple in the model's space but inexpressible in ours. Therefore, solving ELK requires distinguishing between benign compression, where lost details do not affect safety-critical decisions, and dangerous aliasing, where distinct latent states map to the same human report but warrant different actions. My proposal focuses on building diagnostics to measure this aliasing directly.

      Over the first month, I will construct toy environments where the ground truth is known to the experimenter but partially hidden from the human observer definition. I will use a grid world where a valuable object has hidden properties like structural integrity or velocity vectors that the predictor sees but the human labeler ignores. I will train two reporters that agree on every human-checkable case but are architected or regularized differently to encourage divergence off-distribution. The goal is to generate pairs of reporters that are indistinguishable on the training distribution but map latent states to human reports differently when the environment shifts. This setup allows me to isolate the compression artifact from the deception artifact, as both reporters are equally constrained by human feedback but may resolve ambiguities differently.

      During the second month, I will analyze the disagreements between these reporters off-distribution to determine if the divergence is expressible in human terms. If Reporter A says the vault is safe and Reporter B says it is unsafe, I need to know if there is a human-legible feature they are disagreeing about, or if the disagreement is an aliasing artifact with no description in our ontology. I will measure the dimensionality of the latent space required to resolve the disagreement versus the dimensionality of the human report space. If the disagreement is pervasive and inexpressible, it suggests the standard problem statement is asking for something incoherent. I will quantify this by measuring the mutual information between the reporter disagreement and the hidden latent variables that were excluded from the human definition. This provides a metric for how much safety-relevant information is being discarded by the requirement of legibility.

      In the third month, I will tie these findings to decision tasks to evaluate the distortion budget. I will define a set of actions, such as calling guards or evacuating, and calculate the expected utility of acting on each reporter's output. The aim is to determine if there exists a compression scheme that keeps decision safety above a threshold despite the loss of latent fidelity. If the utility drops sharply when forcing human-legibility, then the distortion budget is exceeded, and we cannot trust the system without expanding our ontology. The deliverable from this work will be a diagnostic protocol for translation risk. This protocol would allow someone deciding whether to trust a system to run two divergent reporters on off-distribution inputs and measure whether their disagreement correlates with high-stakes decision errors. It shifts the verification burden from proving truthfulness to proving that the lossy compression is safe for the intended use case.

      There are two primary possible conclusions here. The optimistic conclusion is that aliasing is rare and localizable, meaning that standard ELK approaches are sufficient because the human concept space covers almost all safety-relevant latent features. The pessimistic conclusion is that aliasing is pervasive and inexpressible, meaning that we cannot verify safety without accessing the model's latent ontology directly. What decides between them is the empirical measurement of the mutual information between reporter disagreement and hidden hazards in the toy setups. If I find that reporters consistently disagree on safety-critical cases in ways humans cannot describe, the field needs to pivot from eliciting knowledge to expanding human ontology or accepting opaque oversight.

      I must also state an honest failure condition for this proposal. It is possible that this reframe just moves the bump under the rug. Defining the class of decisions and the acceptable distortion budget might be as hard as defining truth itself. If the distortion budget depends on knowing the latent state to verify that no safety-critical info was lost, then I have not solved the verification problem, I have merely renamed it. Additionally, if the toy models fail to capture the complexity of real-world latent spaces, the diagnostics might yield false negatives. I will treat the project as a failure if I cannot define a distortion budget that is computable without access to the ground truth latent state, since that access is unavailable in the real deployment scenario. Despite this risk, determining whether the problem is one of deception or inherent incompressibility is a prerequisite for knowing whether to build better reporters or better human ontologies. I believe this three-month investigation will provide the clarity needed to direct future alignment resources effectively.

      Sincerely,
      [My Name]

