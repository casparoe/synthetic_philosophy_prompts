      *   *Failure Condition:* What if the distortion budget is just as hard to define as the truth?
      *   *Closing:* Sign-off.

  4.  **Drafting - Writing the Content (Iterative refinement for flow and constraints):**

      *   *Constraint Check:* No bullets, no bold, no headings. Continuous prose.
