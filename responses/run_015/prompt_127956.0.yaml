answer: |-
  Here is your Q&A prep sheet. It is designed to be printed on one side of a single page for quick reference during the session.

  ### **Strategic Concessions & "Kill Shots"**

  *   **What to give away in the first two minutes:** Concede immediately that in **two-player games**, your correlation-robust procedure collapses to standard IEMDS/Rationalizability. Do not waste time defending a distinction that doesn't exist there. Say: *"The independence assumption is invisible in two-player games, which is why textbooks get away with it. My argument starts strictly at N=3."* This disarms the "triviality" objection before it forms.
  *   **The reply that must land (The Kill Shot):** When the epistemic theorists press you on type structures, your core defense is: **"Common Belief in Rationality (RCBR) does not imply Independent Beliefs."** If you let them convince the room that independence is a *consequence* of rationality rather than an *additional structural assumption*, the paper dies. You must hold the line that independence is a restriction on the type space (e.g., a product structure on conjectures), not a requirement of rationality.
  *   **The Question You Hope Nobody Asks:** *"Can you provide a counterexample where your 'best-response-anchored' hybrid procedure fails order-independence in a 4-player game or with infinite strategy spaces?"* (You have a conjecture and a 3x3x3 check, but no general proof. If they press for a proof sketch and you don't have the monotonicity condition fully worked out for $N>3$, you will look like you're selling a bug as a feature.)

  ---

  ### **Q&A Prep Sheet (8 Objections)**

  #### **1. The Epistemic Theorist (The "Characterization" Strike)**
  **Objection:** "You've defined a procedural elimination rule, but you haven't given us an epistemic characterization. What is the type structure that generates this? Is this just Dekel-Fudenberg (1990) independence assumptions repackaged? Without a RCBR-style theorem, this is just an algorithm, not a foundation."
  **Reply:** "You're right that the epistemic conditions are the next step. Procedurally, I'm isolating the independence assumption that textbooks hide. Dekel-Fudenberg characterize the *outcome* of independent rationalizability. My contribution is highlighting that the *procedure* of IEMDS implicitly enforces that independence, and offering a correlation-robust alternative that matches standard Rationalizability. The type structure would require a universal type space without the product-measure restriction on conjectures."
  **Soft Spot:** You don't have the formal type-space theorem ready. If they press for the specific belief hierarchy condition (e.g., "Is it common belief in rationality *and* independence?"), admit you are currently working on the mapping to the universal type space.

  #### **2. The Epistemic Theorist (The "Known Result" Check)**
  **Objection:** "Pearce (1984) and Bernheim (1984) already distinguished correlated from independent rationalizability. Textbooks might be sloppy, but what is the *theoretical* novelty here beyond reminding us that correlation matters in N>2 games?"
  **Reply:** "The literature distinguishes the *solution concepts*, but the pedagogy of IEMDS presents it as a belief-free dominance procedure. My first contribution is exposing that 'mixed dominance' in iteration smuggles in beliefs. My second, novel contribution is the **best-response-anchored hybrid**. Standard rationalizability can be huge; standard IEMDS can be empty or too small. My hybrid keeps strategies that are best responses *and* not dominated by other survivors. I conjecture this restores order-independence where iterated weak dominance fails."
  **Soft Spot:** The novelty of the "hybrid" procedure rests on the order-independence conjecture. If they doubt the conjecture, the "novelty" shrinks.

  #### **3. The Decision Theorist (The "Ontology" Trap)**
  **Objection:** "When you say 'mixed strategy' in your elimination rule, what is it? Is it an objective randomization device (an act), or is it a subjective belief I hold about you? If it's a belief, why call it a strategy? If it's an act, why does correlation of *others* affect *your* randomization?"
  **Reply:** "In this context, a mixed strategy in the elimination check serves as a **witness for dominance**. It's an act available to the player. However, the *elimination* decision relies on whether that act is a best response to a belief. The correlation issue arises in the belief about opponents ($S_{-i}$), not in my own randomization. I treat the mixed strategy as a tool to test if a pure strategy is redundant given some belief structure."
  **Soft Spot:** If they push on whether the player *can* randomize (ontological commitment), you might get stuck. Stick to the "witness for dominance" framing.

  #### **4. The Decision Theorist (The "Normativity" Challenge)**
  **Objection:** "Strict dominance is normative (you *shouldn't* play it). Best-response rationality is descriptive (you *won't* play it if you have that belief). You're mixing them. Why should a rational agent adhere to your hybrid rule?"
  **Reply:** "Strict dominance is robust to any belief. Best-response anchoring ensures we don't eliminate strategies that are rational under *some* reasonable belief about survivors. The normativity comes from the dominance part; the correlation-robustness ensures we aren't imposing arbitrary independence constraints on the agent's epistemic state. It's a 'rationality without unnecessary restrictions' argument."
  **Soft Spot:** Blending normative and descriptive criteria is always philosophically messy. If they argue that "rationality requires independence," you need to fall back on the RCBR argument.

  #### **5. The Behavioral Experimentalist (The "Cognitive Load" Attack)**
  **Objection:** "You're assuming players can form correlated conjectures over two other players' strategy profiles. Do you have any evidence subjects can do this? Level-k models usually assume independent reasoning about each opponent. This looks computationally intractable."
  **Reply:** "I'm not claiming subjects *always* correlate. I'm claiming the **solution concept** shouldn't rule it out a priori. In experiments with focal points or communication, subjects do correlate (e.g., 'we both play the salient equilibrium'). My procedure allows for that possibility. Standard IEMDS forbids it even if the context supports it."
  **Soft Spot:** You don't have experimental data. If they demand a design, offer: *"A 3-player coordination game where P1's payoff depends on P2-P3 matching. Test if P1 plays the correlation-dependent strategy."*

  #### **6. The Behavioral Experimentalist (The "Depth" Question)**
  **Objection:** "How many rounds of this elimination do you expect real people to run? If your correlation-robust set is larger, doesn't that just make the prediction less useful for behavior?"
  **Reply:** "A larger prediction set is more honest about the epistemic assumptions. If standard IEMDS predicts a unique outcome only by assuming independence, and subjects don't assume independence, the standard model is falsified. My procedure might predict a set, but it's the *correct* set given only RCBR. For behavior, you can layer level-k on top of my correlated baseline."
  **Soft Spot:** Admitting the prediction set is larger weakens the "applied" utility. You must sell "accuracy" over "precision."

  #### **7. The Political Scientist (The "So What?" Test)**
  **Objection:** "I build models of voting or coalition formation with 3+ players. Why should I care if I use your procedure instead of standard IEMDS? Does it actually change the policy conclusions?"
  **Reply:** "Yes, in coalition settings. If parties believe opponents' actions are correlated (e.g., ideological blocs), they play differently than if they view them as independent noise. Standard IEMDS might eliminate a 'coalition-builder' strategy because it's not a best response to independent votes, but it *is* a best response to correlated bloc voting. Your model might falsely predict instability where my procedure predicts a stable coalition."
  **Soft Spot:** You need a concrete example ready. If you don't have a applied paper using this, they may view it as purely theoretical.

  #### **8. The General Technical (The "Order Independence" Trap)**
  **Objection:** "You claim your hybrid procedure is order-independent. Iterated weak dominance isn't. What property guarantees monotonicity here? You only showed 3x3x3."
  **Reply:** "The survivor operator is monotone because we only eliminate if a strategy is dominated *by a survivor*. We never bring back eliminated strategies. The 'anchoring' prevents the path-dependency of weak dominance where eliminating A makes B dominant, but eliminating B makes A dominant. I have the proof for 2-players and computational verification for 3. The general proof is current work."
  **Soft Spot:** **This is the danger zone.** If they ask for the specific monotonicity condition and you hedge, you lose credibility. Be honest: *"The proof relies on the set of dominating mixtures shrinking monotonically. I am confident but it is a conjecture for general N."*

  ---

  ### **Technical Flag: Your Running Example**

  **Verdict:** Your three-player effort game works **only if** the payoff function is non-separable.
  *   **Requirement:** $u_1(a_1, a_2, a_3)$ cannot be written as $f(a_1, a_2) + g(a_1, a_3)$.
  *   **Specific Structure:** You need a term like $a_1 \cdot (a_2 \cdot a_3)$ or an indicator $\mathbb{1}(a_2 = a_3)$.
  *   **Why:** If payoffs are additively separable across opponents, $E[u] = E[f(a_1, a_2)] + E[g(a_1, a_3)]$. In that case, correlation between $a_2$ and $a_3$ drops out of the expectation, and your distinction vanishes even in 3-player games.
  *   **Action:** Explicitly state in the talk: *"My argument requires payoff interdependence between the opponents. If P2 and P3 affect P1 additively, correlation doesn't matter. I am focusing on games with strategic complements/substitutes between opponents."* If you don't say this, an epistemic theorist will construct a separable game and prove your distinction null.

  ### **Final Advice**
  You are walking into a room that knows the Dekel-Fudenberg/Pearce literature better than you do. Do not try to out-theorem them on the independence/correlation distinction. **Own the pedagogical critique and the hybrid procedure.** Your value add is not "Correlation exists" (they know that), but "Textbooks hide this, and here is a procedure that fixes it while maintaining order independence." Stick to that lane.
