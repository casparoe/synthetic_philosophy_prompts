      *   *Constraint:* 8-10 Questions. Concrete scenarios. 2-3 options each.
      *   *Requirement:* Must cover the 5 specific cases requested.

      *   *Q1: The Benevolent Manager (Republican vs. Negative).*
          *   Scenario: Boss can fire you anytime, but never does.
          *   Options: Free (nothing happened) / Unfree (they could have) / Depends on contract.
