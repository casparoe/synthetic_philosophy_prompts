      *   *Axis A: Source of Constraint.* Is it only *other people* interfering? Or does *nature/circumstance* count? (Distinguishes Negative/Republican from Positive/Capability).
      *   *Axis B: Nature of Interference.* Is it actual *blocking*? Or just the *power* to block? (Distinguishes Negative from Republican).
      *   *Axis C: Locus of Will.* Is it about *external* obstacles only? Or does *internal* psychology count? (Distinguishes External views from Self-Mastery views).
      *   *Axis D: Standard of Will.* Is it *what you want*? Or *what you should want*? (Distinguishes Endorsement Self-Mastery from Rational/True Interest Self-Mastery).

      *Mapping the Leaves:*
      1.  **Plain Nobody-Blocking (Negative):** External only + Actual Blocking + Wants don't matter (just absence of coercion).
      2.  **No-Arbitrary-Power (Republican):** External only + Power to Block (even if unused) + Status matters.
      3.  **Self-Mastery/Endorsement (Internal 1):** Internal counts + What you endorse.
      4.  **Self-Mastery/True Interest (Internal 2):** Internal counts + Objective Good/Reason.
      5.  **Capability/Ability (Positive):** External + Nature/Circumstance counts + Resources matter.
      6.  **The Mix:** Usually Negative + Republican (care about blocking *and* status) or Negative + Capability.
      7.  **Incoherent:** E.g., Caring about arbitrary power but not actual blocking, while ignoring internal states but caring about resources? (Need to define this carefully).

      *Refining the Separation of Self-Mastery (3) vs. Capability (5):*
      *   *Self-Mastery:* Focuses on the *source* of action (is it *me* driving?). A rich person addicted to heroin lacks self-mastery.
      *   *Capability:* Focuses on the *feasibility* of action (can I *get* there?). A sober poor person lacks capability.
      *   *Separator Case:* The "Rich Addict" vs. The "Sober Pauper."
          *   Rich Addict: Has money (Capability high), but controlled by urge (Self-Mastery low).
          *   Sober Pauper: Has will (Self-Mastery high), but no money (Capability low).
      *   *Quiz Strategy:* Need a question where money is present but will is weak, vs. money absent but will is strong.

