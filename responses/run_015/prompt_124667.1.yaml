      *   **Context:** A pub discussion group (non-philosophers), practical focus, previous confusion on liberty concepts (Berlin, Pettit).
      *   **Goal:** A sorting quiz (8-10 questions) to clarify what participants *actually* mean by "freedom."
      *   **Constraints:**
          *   No jargon (positive, negative, republican, domination).
