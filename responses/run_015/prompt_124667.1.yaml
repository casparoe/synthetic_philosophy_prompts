answer: |-
  # The "What Do You Mean By Free?" Pub Quiz

  **Host Instructions:**
  Read each scenario out loud. Give everyone a minute to mark their sheet. Don't discuss the answers until the end. If someone says "It depends," tell them to skip that question (don't mark any symbol). At the end, tally the symbols to find your "Freedom Type."

  **The Logical Map (Read this to the group first):**
  Before we start, know that we're testing three big switches in how we think about freedom:
  1.  **The Wall:** Does freedom break only when a *person* stops you? Or does *circumstance* (money, nature, fear) count too?
  2.  **The Hand:** Does it matter if someone *actually* hits you? Or is it enough that they *could* hit you whenever they want?
  3.  **The Head:** Is freedom about what you can do out there? Or is it about what's going on in here (your will, your health, your true interests)?

  ---

  ## The Quiz

  **1. The Kind Boss**
  You work a shift job. Your manager has the legal right to fire you instantly, for no reason, with no appeal. However, she is very kind, has never fired anyone, and gives you all the hours you want.
  *   **A.** You are free. She hasn't actually done anything to stop you. **[🛑]**
  *   **B.** You are unfree. You have to stay on her good side just in case. **[⛓️]**
  *   **C.** You are free. You chose this job and can quit if you want. **[💪]**

  **2. The Vote You Lost**
  Your local community votes on a rule that bans loud music after 10 PM. You voted against it, but the majority won. You really want to play drums at midnight.
  *   **A.** You are unfree. The rule physically stops you playing. **[🛑]**
  *   **B.** You are free. You had a say in the process, so the rule isn't master over you. **[⛓️]**
  *   **C.** You are unfree. The rule stops you doing what you genuinely want. **[🧠]**

  **3. The Locked Door Inside**
  You live alone. The front door is unlocked, there are no guards, and you have bus fare. But you have a crippling fear of leaving the house. You sit on the couch all day, wishing you could go out.
  *   **A.** You are free. Nothing external is blocking you. **[🛑]**
  *   **B.** You are unfree. Your own mind is the prison. **[🧠]**
  *   **C.** You are unfree. You lack the practical ability to function. **[💪]**

  **4. The Happy Servant**
  A person voluntarily signs a lifetime contract to serve a wealthy patron. They are fed, housed, and say sincerely, "This is what I want. I love serving."
  *   **A.** They are free. They got exactly what they wanted. **[🧠]**
  *   **B.** They are unfree. No human should be a servant, regardless of what they say. **[🎯]**
  *   **C.** They are free. No one is forcing them to stay. **[🛑]**

  **5. The Algorithm**
  A scheduling app at work cuts your hours randomly. There is no human manager doing this; it's just code optimizing for efficiency. You can't plan your life, but no person is targeting you.
  *   **A.** You are free. No person is dominating you. **[🛑]**
  *   **B.** You are unfree. The company built a system that holds power over you. **[⛓️]**
  *   **C.** You are unfree. You lack the resources to resist the system. **[💪]**

  **6. The Addict and The Pauper**
  Person A is wealthy but addicted to a drug; they spend all their money on it and hate that they do, but can't stop. Person B is very poor but has no addictions; they want to start a business but have no capital.
  *   **A.** Person A is less free. They are a slave to their own urges. **[🧠]**
  *   **B.** Person B is less free. They lack the means to act. **[💪]**
  *   **C.** Both are equally free/unfree. It's about external blocking, not internal or money. **[🛑]**

  **7. The Mountain vs. The Guard**
  Case 1: A massive mountain blocks your path to the next valley.
  Case 2: An armed guard blocks your path to the next valley.
  *   **A.** Only Case 2 makes you unfree. Nature isn't an oppressor. **[🛑]**
  *   **B.** Both make you unfree. You can't get to the valley in either case. **[💪]**
  *   **C.** Case 2 is worse. The guard represents a master. **[⛓️]**

  **8. The Forced Health Check**
  The government forces you to stop smoking. You love smoking, you know the risks, and you don't care. They do it for your own good.
  *   **A.** You are less free. They violated your will. **[🧠]**
  *   **B.** You are more free. They helped you act on your true long-term interest. **[🎯]**
  *   **C.** You are less free. They interfered with your choices. **[🛑]**

  ---

  ## Scoring Key

  Count up your symbols. Write the totals here:

  *   **🛑 (Stop):** ______
  *   **⛓️ (Chain):** ______
  *   **🧠 (Brain):** ______
  *   **💪 (Arm):** ______
  *   **🎯 (Target):** ______

  *(Note: If you skipped questions because of "It depends," just tally what you have. If you have fewer than 5 total marks, the result is unreliable.)*

  ---

  ## Results: What's Your Freedom?

  Find your highest score below. If you have a tie, read the **Hybrids** section. If you have three or more symbols tied, read **The Scatter**.

  ### 1. Mostly 🛑 (The "Leave Me Alone" View)
  **Plain Negative Liberty.**
  To you, freedom is simple: Is another human being physically stopping me? If the door is open, you're free. If no one is pointing a gun, you're free.
  *   **On the Algorithm:** You're free. Code isn't a person.
  *   **On the Happy Servant:** They're free. They chose it.
  *   **Blind Spot:** You might ignore how poverty or fear can trap people just as effectively as a lock.

  ### 2. Mostly ⛓️ (The "No Masters" View)
  **Republican Liberty.**
  To you, freedom is about status. It doesn't matter if the boss is kind; if they *can* fire you on a whim, you aren't free. Freedom means living without arbitrary power over your head.
  *   **On the Algorithm:** You're unfree. The company holds the power, even if hidden in code.
  *   **On the Democratic Law:** You're free, provided you had a real say in the vote.
  *   **Blind Spot:** You might focus so much on power dynamics that you ignore internal struggles or pure lack of resources.

  ### 3. Mostly 🧠 (The "Be Your Own Boss" View)
  **Internal Self-Mastery.**
  To you, freedom is psychological. If you are controlled by fear, addiction, or impulses you don't endorse, you aren't free—even if the world is open to you.
  *   **On the Happy Servant:** They are free, *if* they truly endorse it. If they are deluded, they aren't.
  *   **On the Forced Health Check:** You are less free. Your will was overridden.
  *   **Blind Spot:** A rich, disciplined person is "free" to you, even if they choose to do nothing.

  ### 4. Mostly 🎯 (The "Know What's Good" View)
  **Rational/True Interest Liberty.**
  To you, freedom is acting on your *real* interests, not just your whims. If someone forces you to be healthy or educated, they might actually be making you freer, even if you hate it.
  *   **On the Happy Servant:** Unfree. Servitude is bad for you, regardless of your happiness.
  *   **On the Forced Health Check:** You are *more* free. You are being aligned with your true good.
  *   **Blind Spot:** This view can justify forcing people to do things "for their own good," which feels dangerous to the others.

  ### 5. Mostly 💪 (The "Can Actually Do It" View)
  **Capability/Positive Liberty.**
  To you, freedom is about genuine ability. "You can leave" isn't true if you have no shoes, no money, or no nerve. Freedom requires the power to act.
  *   **On the Algorithm:** Unfree. The system limits your actual capacity to live.
  *   **On the Mountain:** Unfree. A mountain stops you just as dead as a guard.
  *   **Blind Spot:** This requires a lot of resources to guarantee. It blurs the line between "freedom" and "ability."

  ---

  ## Hybrids & Ties

  **🛑 + ⛓️ Tie (The "Rights" Mix)**
  You care about both actual interference and the power structure. You want to be left alone, but you also want legal protections against arbitrary power. This is a very common, stable liberal view.

  **🧠 + 💪 Tie (The "Empowerment" Mix)**
  You think freedom is both internal (willpower) and external (resources). You believe we need to fix society *and* help people master themselves. Hard to achieve, but ambitious.

  **🛑 + 🧠 Tie (The "Tension")**
  *Warning:* These two often fight. 🛑 says "Only external blocks count." 🧠 says "Internal blocks count." If you scored high on both, you likely switch definitions depending on the case. You think the Agoraphobic is unfree (🧠), but the Smoker should be left alone (🛑). This isn't incoherent, but it means you don't have one single rule.

  **🎯 + 🛑 Tie (The "Contradiction")**
  *Warning:* This is hard to hold together. 🛑 says "Don't touch me." 🎯 says "Force me to be good." If you chose both, you probably want to be left alone yourself, but think others should be forced to be healthy. Watch out for hypocrisy in debate.

  ---

  ## The Scatter (3+ Symbols Tied)
  **The Case-by-Caser.**
  You don't have a theory; you have intuitions. You judge each situation on its own merits. Philosophers might call this "incoherent," but in the pub, it's probably the most sensible position. You recognize that "freedom" means different things in different contexts.

  ---

  ## The Tiebreaker Question
  *(Use this only if two people have the exact same top score and you know they disagree.)*

  **Scenario:** You are locked in a comfortable room. You are asleep. You do not know you are locked in. The door is bolted from the outside.
  *   **A.** You are free. Nothing is stopping you *right now*. (Matches 🛑)
  *   **B.** You are unfree. Someone holds the key. (Matches ⛓️)
  *   **C.** You are unfree. You cannot leave if you wake up. (Matches 💪)

  *Ask them to pick one verbally. This usually forces the "Negative" people to split from the "Republican/Capability" people.*

  ---

  ## Host's Cheat Sheet: Separating the Hard Cases

  **1. Separating Self-Mastery (🧠) from Capability (💪)**
  *   **The Separator:** Question 6 (Addict vs. Pauper).
  *   **Why:** 🧠 cares about *who is driving* (the urge vs. the self). 💪 cares about *whether the car moves* (money vs. no money).
  *   **If they collapse:** If someone says both the Addict and Pauper are equally unfree, they are likely a **Hybrid (🧠+💪)** or a **Scatter**.

  **2. Separating Republican (⛓️) from Capability (💪)**
  *   **The Separator:** Question 5 (The Algorithm).
  *   **Why:** ⛓️ sees a *master* (the company/coder). 💪 sees a *barrier* (lack of control/resources).
  *   **The Overlap:** These two often agree on outcomes (the worker is unfree) but disagree on *why*. The quiz cannot fully separate them without asking "Why?" verbally. **Flag this to the group:** "If you scored high on Chains and Arms, you agree on the problem, but argue over whether it's about Power or Resources."

  **3. The "Incoherent" Leaf**
  *   **Definition:** Scoring high on **🛑 (External Only)** AND **🧠 (Internal Matters)**.
  *   **Verdict:** This is logically tense. You can't say "Only humans block freedom" and "My fear blocks freedom" without shifting definitions.
  *   **Is it defended?** Yes, Isaiah Berlin tried to hold both, but admitted they can conflict. It's not "wrong," but it requires nuance. Tell the group: "You're in good company (Berlin), but be ready for the others to point out when you switch definitions."
