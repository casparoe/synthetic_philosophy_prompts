          *   Include a tiebreaker question.
          *   No footnotes/further reading.
      *   **Target "Leaves" (Outcomes):**
          1.  Negative Liberty (Nobody blocking you).
          2.  Republican Liberty (No arbitrary power/domination).
          3.  Internal Self-Mastery (Acting on endorsed desires).
          4.  Rational/True Interest Self-Mastery (Overruling endorsed desires for "real" good).
          5.  Positive/Capability Liberty (Genuine ability/resources/nerve).
          6.  A "Mix" leaf (common hybrid).
          7.  Handle incoherent/unappealing combinations.
      *   **Required Cases:**
          *   Benevolent Master/Manager (power exists but unused).
          *   Democratic Rule (voted on, still restricts).
          *   Internal Block (can't bring self to act).
