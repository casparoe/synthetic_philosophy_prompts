  # Reference Class Decision Tree

  **Root Question:** Do you think reference-class selection should happen outside the view or inside it?

  ├── **Outside** (Selection rules must be blind to case details)
  │   │
  │   └── **Question:** If multiple classes fit (e.g., "all startups" vs. "AI startups"), how do you choose the base rate?
  │       │
  │       ├── **Leaf 1:** Pick the broadest class available.
  │       │   *(Stance: Naive Outside-Viewism)*
  │       │   └── **Awkward Commitment:** You must predict a nuclear startup's success using the base rate of all small businesses, ignoring industry specifics.
  │       │
  │       ├── **Leaf 2:** Average all plausible classes equally.
  │       │   *(Stance: Reference-Class Averaging)*
  │       │   └── **Awkward Commitment:** You must treat "all US companies" and "tech startups founded in 2023" as equally informative votes.
  │       │
  │       └── **Leaf 3:** Pick the class with the longest historical track record.
  │       │   *(Stance: Lindy-Outside)*
  │       │   └── **Awkward Commitment:** You must ignore relevant new data categories if older, broader data exists.
  │
  └── **Inside** (Selection uses case-specific details)
      │
      └── **Question:** Once you have a base rate, how do you combine it with your specific case details?
          │
          ├── **Leaf 4:** Trust the narrowest class that matches the details.
          │   *(Stance: Inside-View Selection)*
          │   └── **Awkward Commitment:** You must ignore the 90% failure rate of restaurants if your specific concept feels unique enough to qualify for a narrower class.
          │
          ├── **Leaf 5:** Weight classes by how likely your details are under each class.
          │   *(Stance: Full Bayesian Model Averaging)*
          │   └── **Awkward Commitment:** You need to calculate the likelihood of your specific features occurring under every possible reference class before forecasting.
          │
          ├── **Leaf 6:** Adjust the base rate but penalize distance from it exponentially.
          │   *(Stance: Lindy-Modest Weighting)*
          │   └── **Awkward Commitment:** You must shrink your confident inside-view prediction toward the mean even if your model says otherwise.
          │
          └── **Leaf 7:** Only use base rates to cap extreme inside-view confidence.
              *(Stance: Outside View as Sanity Check)*
              └── **Awkward Commitment:** You treat base rates as speed bumps rather than steering wheels, only intervening when your model looks crazy.

  ***

  ### Notes on Gaps & Overlaps

  **Empty Combinations:**
  *   **"Pure Outside View with No Class Selection":** This is incoherent. You cannot have an outside view without selecting *a* class to look outside at; even "everything" is a class selection.

  **Indistinguishable Leaves:**
  *   **Leaf 5 (Bayesian) vs. Leaf 6 (Lindy-Modest):** In practice, these often produce identical forecasts. Leaf 5 derives the shrinkage mathematically from likelihoods, while Leaf 6 imposes it as a heuristic penalty, but without knowing the agent's internal likelihood calculations, you can't tell them apart from the output alone.
