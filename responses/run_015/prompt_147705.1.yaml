answer: |-
  # ACQUISITIONS PROTOCOL 7.4: INFERENCE VALIDATION FOR UNPROVENANCED ASSEMBLAGES

  **Purpose:** To determine if physical assemblages justify attributing specific beliefs or institutional practices to makers, absent excavation data.
  **Grounding:** Peircean semiotics applied to material culture (Indexical, Symbolic, Institutional).
  **Constraint:** Analysis restricted to physical properties of the assemblage only.

  ---

  ## I. THE DECISION PROCEDURE

  ### Step 1: Indexical Baseline (The Trace Check)
  *   **Objective:** Distinguish intentional deposition from random loss or utilitarian discard.
  *   **Physical Test:** Analyze micro-wear, fracture mechanics, and residue distribution across the assemblage.
  *   **Pass Criteria:**
      *   Wear patterns are inconsistent with claimed/obvious function (e.g., sharp edges on "cutting" tools show no polish).
      *   Fracture patterns indicate force application inconsistent with accidental breakage (e.g., single-point impact on rim vs. crush damage).
      *   Residue is absent where function dictates presence (e.g., cooking vessels with no lipid traces).
  *   **Fail Criteria:** Wear and residue align perfectly with optimal utilitarian use and accidental loss.
  *   **Break Point:** If **Fail**, inference stops. **Result: Utilitarian Discard.** No belief/institution warranted.

  ### Step 2: Symbolic Encoding (The Form Check)
  *   **Objective:** Identify manufactured forms that prioritize representation over function.
  *   **Physical Test:** Measure metric standardization, material cost vs. durability, and morphological deviation from functional optima.
  *   **Pass Criteria:**
      *   High metric consistency (low coefficient of variation) exceeding technical necessity.
      *   Use of materials disproportionately costly for the function (e.g., jade axe for woodcutting).
      *   Miniaturization or exaggeration rendering the object non-functional.
  *   **Fail Criteria:** Form follows function with high variability consistent with individual craftsmanship.
  *   **Break Point:** If **Fail**, inference stops. **Result: Individual Craft Variation.** No institutional norm warranted.

  ### Step 3: Institutional Regularity (The Constraint Check)
  *   **Objective:** Detect cross-object constraints implying enforced norms.
  *   **Physical Test:** Compare objects across the assemblage for combinatorial rules (e.g., Object A always appears with Object B; never with C).
  *   **Pass Criteria:**
      *   Strict grouping rules (e.g., sets of 5, specific pairings).
      *   Spatial clustering within the assemblage suggesting curated collection rather than accumulation.
      *   Standardization maintained across different material batches (implying a central template).
  *   **Fail Criteria:** Random association of objects; high variability in grouping.
  *   **Break Point:** If **Fail**, inference stops. **Result: Personal Hoard/Collection.** No systemic practice warranted.

  ### Step 4: Semantic Attribution (The Belief Leap)
  *   **Objective:** Assign specific social meaning (e.g., "Hierarchy," "Ritual," "Trade").
  *   **Physical Test:** None. This step maps physical constraints to social theory.
  *   **Pass Criteria:** [VALUE-LADEN JUDGMENT] The curator selects the social model that best fits the constraints.
  *   **Flag:** **CRITICAL VULNERABILITY.** This step is not factual. It is an interpretive act subject to modern bias.
  *   **Break Point:** If the curator cannot agree on a single model without external ethnographic data. **Result: Ambiguous Practice.**

  ---

  ## II. CASE APPLICATIONS

  ### Case (i): Deliberately Shattered Vessels in a Pit (No Domestic Residue)
  *   **Step 1 (Indexical):** **PASS.** Fracture analysis shows fresh-break deposition (no weathering on shards). Absence of lipid residue confirms non-domestic use.
  *   **Step 2 (Symbolic):** **PASS.** Destruction is the "function." The form (vessel) is negated to create the deposit.
  *   **Step 3 (Institutional):** **PASS.** If the pit contains multiple vessels shattered in identical modes (e.g., all struck on the rim), this implies a prescribed method of destruction.
  *   **Step 4 (Attribution):** **FORCED DECISION.**
      *   *Inference:* Ritual Termination or Votive Offering.
      *   *Conflict:* None. Destruction without use is universally coded as non-utilitarian.
      *   *Deferral:* We defer on *which* deity or event. The procedure validates "Ritual Practice" but not specific theology.
  *   **Acquisition Verdict:** **Accept.** Warrants attribution of "Ritual Deposition Practice."

  ### Case (ii): Identical Standardized Weights Distributed Across Separate Structures
  *   **Step 1 (Indexical):** **PASS.** Wear facets on contact points indicate use, but lack of corrosion suggests careful storage.
  *   **Step 2 (Symbolic):** **PASS.** Metric precision exceeds necessity for rough barter. The "symbol" is the abstract value unit.
  *   **Step 3 (Institutional):** **PASS.** Identical mass across separate structures implies a central authority enforcing the standard. Individual makers do not accidentally produce identical masses across distances.
  *   **Step 4 (Attribution):** **FORCED DECISION.**
      *   *Inference:* Centralized Redistribution or Taxation System.
      *   *Conflict:* Market Exchange vs. State Control.
      *   *Deferral:* The procedure proves *enforcement*, but not *purpose*. It could be temple tithe or state tax.
  *   **Acquisition Verdict:** **Accept.** Warrants attribution of "Centralized Economic Norm."

  ### Case (iii): Cluster of Miniature, Non-Functional Tools in a Burial Context
  *   **Step 1 (Indexical):** **PASS.** Zero use-wear. Burial context (inferred from association with bone/ochre within the assemblage) indicates deposition, not loss.
  *   **Step 2 (Symbolic):** **PASS.** Miniaturization renders tools non-functional. They represent the *idea* of labor.
  *   **Step 3 (Institutional):** **PASS.** If the tools are graded by size (small, medium, large) within the cluster, this implies a sequence.
  *   **Step 4 (Attribution):** **VALUE-LADEN JUDGMENT REQUIRED.**
      *   *Physical Data:* Graded sizes + Non-functional + Burial.
      *   *Procedure Output:* The physical constraint implies a **sequence of status or capability**.
      *   *Conflict:* The data suggests **Hierarchy/Apprenticeship** (graded access to labor roles). However, modern curatorial preference favors **Non-Hierarchical/Communal** interpretations (e.g., "toys for the afterlife" or "symbolic equality").
      *   *Forced Decision:* The procedure *forces* the Hierarchical inference. Standardization of *grades* implies differentiation. To claim "equality" requires ignoring the metric variance in the tool sizes.
      *   *Deferral:* We must defer to the physical evidence over the ideological preference.
  *   **Acquisition Verdict:** **Accept with Caveat.** Catalog as "Evidence of Labor Stratification." Do not catalog as "Toys" unless metric variance is proven random (which Step 3 rejected).

  ---

  ## III. RELIABILITY AND FALSIFICATION

  ### What Would Change My Mind?
  I would abandon or reorder the Indexical/Symbolic/Institutional framework if presented with evidence that **Standardization arises from Cognitive Universals rather than Social Enforcement.**

  *   **Specific Argument:** If experimental archaeology demonstrates that unconnected individuals, given the same raw materials and no communication, produce the *exact* metric standardizations seen in Case (ii) or (iii) due to ergonomic or cognitive constraints, then Step 3 (Institutional Regularity) fails. It would mean "Constraint" does not equal "Norm."
  *   **Specific Evidence:** A control group of isolated modern knappers producing identical "institutional" patterns without coordination.

  ### Vulnerability of Reasoning
  The reasoning is most vulnerable at the transition from **Step 3 (Constraint)** to **Step 4 (Attribution)**.

  1.  **The Equifinality Trap:** Physical regularity (Step 3) can result from coercion (hierarchy) OR intense consensus (egalitarian dogma). The physical object records the *rule*, but not the *power dynamic* behind the rule.
  2.  **The Projection Bias:** In Case (iii), the procedure forces a hierarchical inference because "grading" implies ranking. However, if the culture viewed the grades as "stages of spiritual growth" accessible to all, it is not hierarchical in a socio-economic sense. The procedure conflates *differentiation* with *stratification*.
  3.  **The Unprovenanced Blindspot:** Without stratigraphy, we cannot confirm the "Burial" context in Case (iii) physically. We rely on the *association* within the box. If the bones and tools were mixed by a looter, Step 1 is compromised. The procedure assumes the assemblage integrity is intact, which is the weakest link in unprovenanced acquisitions.

  **Final Directive:** Proceed with acquisitions only if Step 3 is passed. Step 4 interpretations must be labeled "Hypothetical Social Model" in all public-facing materials to acknowledge the value-laden leap.
