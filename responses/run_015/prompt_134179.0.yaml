answer: |-
  Here is the specification for a theory of personal survival. This is not a summary of existing theories, but a requirements document based on the intuitions and logical constraints any viable account must address.

  ### Part 1: The Desiderata (The Spec)

  An adequate theory of personal survival must provide truth conditions for the statement *"Person A at $t_1$ is the same surviving entity as Person B at $t_2$."* To be robust, it must satisfy the following six desiderata.

  #### 1. The Transitivity Requirement
  *   **Definition:** If A survives as B, and B survives as C, then A survives as C. Identity is a transitive relation; survival, if it is to be identity, must be too.
  *   **Motivating Case:** **The Gradual Synthetic Swap.** You replace 10% of neurons with silicon. Then another 10%. If Stage 0 is you, and Stage 1 is Stage 0, and Stage 2 is Stage 1... Stage 10 (fully synthetic) must be you.
  *   **Crucial Distinction:** **Chain of Continuity vs. Direct Similarity.** Stage 10 might share no matter or specific memory states with Stage 0, but they are linked by the chain. A theory cannot allow the chain to break arbitrarily.
  *   **Constraint Type:** **Hard Constraint.** (Logical necessity if survival = identity).

  #### 2. The Uniqueness (Non-Branching) Constraint
  *   **Definition:** There cannot be two distinct entities at $t_2$ that are both identical to the single entity at $t_1$. One person cannot become two people in the strict sense of identity.
  *   **Motivating Case:** **Fission / Split-Brain.** If your hemispheres are separated and put into two bodies, both wake up claiming to be you. Intuitively, they are two distinct people. If identity is what matters, you cannot be *both* of them simultaneously, because they are not identical to each other.
  *   **Crucial Distinction:** **One Survivor vs. Two Survivors.** A theory must explain why fission results in death (for the original) or why "identity" is the wrong metric. It cannot say "You are both" without violating logic.
  *   **Constraint Type:** **Hard Constraint.** (Logical necessity of distinctness).

  #### 3. The Tolerance (No Sharp Boundary) Constraint
  *   **Definition:** Existence cannot depend on a microscopic or instantaneous change. There is no single nanosecond or single neuron swap where "you" cease to exist and a "copy" begins.
  *   **Motivating Case:** **The Sorites of Silicon.** In your gradual swap case, if replacing 50% preserves you, replacing 51% must also preserve you. If the theory posits a sharp cutoff (e.g., "At 54% silicon, you die"), it violates the intuition that metaphysical status doesn't hinge on arbitrary thresholds.
  *   **Crucial Distinction:** **Vagueness vs. Epistemicism.** The theory must either accept vague identity (controversial) or explain why we can't know the cutoff (epistemicism).
  *   **Constraint Type:** **Camp Preference.** (Some accept sharp cutoffs, but most find them implausible).

  #### 4. The Intrinsicness Constraint
  *   **Definition:** Whether I survive should depend on facts about *me* and my successor, not on extrinsic events happening elsewhere in the universe.
  *   **Motivating Case:** **Teletransportation with a Glitch.** In Parfit's teleporter, you are scanned, destroyed, and rebuilt on Mars. If the scanner malfunctions and doesn't destroy the Earth body, are you the Mars person? If survival depends on whether the Earth body was destroyed (an extrinsic fact), then your survival on Mars depends on events light-minutes away.
  *   **Crucial Distinction:** **Internal Relation vs. External History.** Does survival supervene on the physical/psychological connection, or on the historical uniqueness of that connection?
  *   **Constraint Type:** **Camp Preference.** (Psychological theorists often violate this to save Uniqueness; Animalists usually respect this).

  #### 5. The Causal Connectivity Requirement
  *   **Definition:** Similarity is not enough. The later stage must be caused by the earlier stage in the right way.
  *   **Motivating Case:** **Swampman.** A lightning strike destroys you and simultaneously arranges molecules in a swamp to create a molecule-for-molecule duplicate with your memories. He thinks he is you. But he is not you, because there is no causal link.
  *   **Crucial Distinction:** **Surviving vs. Being Duplicated.** A theory must distinguish between a continuation of a life and the creation of a perfect replica.
  *   **Constraint Type:** **Hard Constraint.** (Almost universally accepted; distinguishes survival from replication).

  #### 6. The "What Matters" Decoupling
  *   **Definition:** The theory must specify whether "survival" (prudent concern for the future) is co-extensive with "identity" (strict numerical sameness).
  *   **Motivating Case:** **Fission Again.** If you fission into Lefty and Righty, strict identity says you are neither (because you can't be two). But intuitively, you should care about *both* Lefty and Righty as much as you care about normal survival.
  *   **Crucial Distinction:** **Identity vs. Survival Relation.** This allows a theory to say "Identity is lost, but what matters in survival is preserved."
  *   **Constraint Type:** **Camp Preference.** (Reductionists like Parfit accept this; Non-Reductionists reject it).

  ---

  ### Part 2: Hard Constraints vs. Camp Preferences

  To build the theory, you must decide which of the above are non-negotiable laws of logic and which are metaphysical bets.

  **Hard Constraints (Logic & Metaphysics):**
  1.  **Transitivity:** If $A=B$ and $B=C$, then $A=C$. You cannot waive this without changing the definition of "identity."
  2.  **Causal Connectivity:** Without causation, you have duplication, not survival.
  3.  **Non-Contradiction:** You cannot be identical to X and not identical to X in the same respect at the same time.

  **Camp Preferences (Metaphysical Commitments):**
  1.  **Spatiotemporal Continuity (Animalism):** Requires the physical organism to persist continuously.
      *   *Fails:* Teletransportation, Gradual Silicon Swap (if matter is replaced).
      *   *Succeeds:* Swampman (rejects him), Fission (says original dies).
  2.  **Psychological Continuity (Lockean/Parfitian):** Requires memory/character/causal psychological links.
      *   *Fails:* Intrinsicness (in fission cases), Transitivity (in fission cases).
      *   *Succeeds:* Teletransportation, Gradual Silicon Swap.
  3.  **Vague Identity:** Accepts that "A is B" can be indeterminate.
      *   *Fails:* Classical Logic (requires modification).
      *   *Succeeds:* Tolerance Constraint (No Sharp Boundary).

  ---

  ### Part 3: The Impossibility Proof (Your Hunch)

  You suspected that **"Branching is impossible" (Uniqueness)** and **"Gradual replacement preserves identity" (Tolerance/Transitivity)** cannot both hold under strict identity. You are correct. This is the **Fission Paradox**.

  Here is the argument demonstrating the joint unsatisfiability of the core desiderata under the assumption that Survival = Strict Identity.

  **The Setup:**
  1.  Assume **Survival = Identity** (The Simple View).
  2.  Assume **Transitivity** (Hard Constraint).
  3.  Assume **Uniqueness** (One person cannot become two).
  4.  Assume **Tolerance/Continuity** (Gradual change preserves identity).

  **The Scenario:**
  1.  **Stage 0:** Person A exists.
  2.  **Stage 1:** A undergoes a fission event (e.g., brain hemispheres separated). Two beings emerge: **Lefty (L)** and **Righty (R)**.
  3.  **Continuity Claim:** By the Tolerance/Continuity constraint, the process from A to L is continuous and causally connected. Therefore, **$A = L$**.
  4.  **Continuity Claim:** Similarly, the process from A to R is continuous and causally connected. Therefore, **$A = R$**.
  5.  **Transitivity:** If $A = L$ and $A = R$, then **$L = R$**.
  6.  **Observation:** L and R are two distinct people occupying different spaces, doing different things. Therefore, **$L \neq R$**.
  7.  **Contradiction:** $L = R$ and $L \neq R$.

  **The Implication:**
  You cannot satisfy Transitivity, Uniqueness, and Continuity simultaneously if Fission is possible. You must drop one.

  **Option A: Drop Uniqueness (Accept Branching Identity).**
  *   *Cost:* Violates classical logic. You are claiming one entity is numerically identical to two distinct entities.
  *   *Pro:* Saves the intuition that you survive in both branches.

  **Option B: Drop Continuity (The "Sharp Cutoff").**
  *   *Cost:* Violates Tolerance. You must claim that at the exact moment of fission, A ceases to exist, even though the physical/psychological process was smooth up to that point.
  *   *Pro:* Saves Logic and Uniqueness.
  *   *Con:* Makes survival depend on extrinsic factors (whether a branch occurred), violating Intrinsicness.

  **Option C: Drop "Survival = Identity" (The Parfitian Move).**
  *   *Cost:* Admit that "Identity" is not what matters.
  *   *Solution:* A survives as L and A survives as R in the sense of **Relation R** (psychological continuity + causality), but strict Identity does not hold.
  *   *Result:* $A \neq L$ and $A \neq R$ (strictly), but A's survival interests are preserved in both.
  *   *Pro:* Resolves the contradiction without violating logic or Tolerance.
  *   *Con:* Requires accepting that you are not a "further fact" beyond physical/psychological continuity.

  ### Conclusion on the Spec

  If you demand a theory where **Survival is Strict Identity**, the spec is **jointly unsatisfiable** in a universe where Fission (branching) is physically possible.

  To make the spec satisfiable, you must modify Desideratum 1 (Transitivity) or Desideratum 2 (Uniqueness) by decoupling them from "What Matters."

  **The Winning Specification:**
  An adequate theory must adopt **Option C**. It must define survival not as numerical identity, but as a **non-branching psychological/biological continuity relation** *for practical purposes*, while admitting that in branching cases, identity fails but "what matters" is preserved doubly.

  If you refuse Option C, you are forced into **Option B**, which requires accepting that in your Gradual Silicon Swap, there *is* a sharp cutoff point where you die, even if no one (including you) can detect it. This satisfies logic but violates the phenomenological intuition of the Swap.

  **Final Verdict:** You can have Logical Consistency + Uniqueness, OR you can have Tolerance + Continuity. You cannot have all four (Logic, Uniqueness, Tolerance, Continuity) in a branching universe. The "Gradual Synthetic Swap" works only if Fission is impossible. If Fission is possible, the Gradual Swap implies that at some point prior to fission, you were already vulnerable to ceasing to exist via branching, which undermines the security of the gradual swap itself.
