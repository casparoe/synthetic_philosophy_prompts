answer: |-
  **Correction:** Your statement of the criterion is slightly loose; Dennett requires that the pattern description be *significantly* shorter than the brute data (sub-linear growth of description length relative to data), not merely that savings grow. If the description length grows linearly with the data (even with a constant offset), the pattern is not "real" in the robust sense.

  **The Case**
  Consider a high-precision gyroscopic camera stabilizer used in broadcast helicopters. Over a one-hour flight, the system makes millions of micro-adjustments to three motor axes to maintain a level horizon despite turbulence. Engineers successfully predict these adjustments by ascribing to the system the belief that "the horizon is tilted at angle $\theta$" and the desire "to minimize $\theta$." These ascriptions converge among independent observers and each belief-desire pair predicts adjustments on at least two axes (pitch and roll). However, because turbulence is chaotic, the value of $\theta$ must be specified with high precision for every time-step to predict the motor output accurately; the bit-cost of specifying the belief state grows linearly with the duration of the flight, offering only a constant-factor compression over logging the motor outputs directly. The design stance, citing the fixed PID control algorithm, compresses without bound. Furthermore, during extreme gusts, the motors hit physical saturation limits; the design stance predicts the resulting lag correctly, while the intentional stance, assuming optimal rational adjustment, predicts a correction that fails to occur.

  **Analysis**
  For the next move, the intentional stance predicts a clockwise yaw because it ascribes the belief "horizon is left-tilted" (covering both yaw and roll corrections). The design stance predicts the same yaw because the error signal exceeds the proportional threshold.
  *Bookkeeping:* If the flight data is $N$ bits, the intentional description requires specifying $\theta$ for each interval, totaling $\approx N - C$ bits (saving only the header). The design description is the algorithm code, size $K$ (constant). As $N \to \infty$, $K \ll N - C$.
  *Load-bearing Feature:* The **granularity of the required belief attribution**. The intentional stance only works if $\theta$ is specified precisely; coarse beliefs ("tilted left") fail prediction.
  *Collapse:* If you remove the precision requirement (allowing coarse beliefs), the intentional stance loses predictive success (fails to beat chance on micro-adjustments). If you remove the chaotic environment (making $\theta$ predictable), the intentional description compresses (becomes a real pattern).

  **Dennettian Reply & Verdict**
  A Dennettian would argue that if the intentional stance requires specifying states as complex as the physical data, it is merely a *notation change*, not a genuine stance; the "beliefs" are not real patterns because they don't reduce complexity. They would concede this is not a counterexample but a boundary case where the intentional stance is *useful* for humans but *ontologically shallow* compared to the design stance. The verdict is that this is **not a counterexample**; it confirms Dennett's view that predictive success alone is insufficient without compression. The system is a tool, not an agent, because its "beliefs" do not abstract away from the physical noise.
