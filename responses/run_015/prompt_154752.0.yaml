      *   **Address the "Squeeze" Fear:** Clarify that NBS *does* reward better outside options (disagreement points). So the user's fear that NBS punishes tech development is incorrect regarding $d$.
      *   **The Real Reason for KS in Climate:**
          1.  **Incentivizing Frontier Expansion (IM):** If a country develops tech that expands the *feasible set* of global abatement, KS ensures they capture some of that value. NBS might not (due to IIA/curvature issues).
          2.  **Equity/Proportionality:** KS aligns with "equal sacrifice" or "proportional gain" norms common in climate justice (CBDR). NBS is more utilitarian.
          3.  **Independence of Irrelevant Alternatives (IIA):** NBS satisfies IIA, KS does not. In climate, "irrelevant alternatives" (unrealistic policy options) might matter for fairness perceptions. KS allows the solution to change if the *range* of possibilities changes, even if the final deal is the same.
