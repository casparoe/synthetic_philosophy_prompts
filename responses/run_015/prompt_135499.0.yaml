  9.  *(Self-Correction during drafting)*: I need to be careful not to dismiss the brother's source entirely (it sounds like it might be from someone like Plomin or Pinker), but point out where the *application* is wrong. The passage itself is actually mostly standard behavioral genetics boilerplate, but the brother's *inference* is the problem. Wait, looking closely at the passage... Sentence 1 is technically wrong ("due to genes rather than environment"). Sentence 4 contradicts the brother's conclusion. I need to highlight that contradiction.

  10. **Final Polish:** Ensure clear headings and actionable advice at the end. (Proceed to generate output).

  *(Self-Correction on Gender Gap)*: Be careful here. Some studies show small biological differences, but the *reading* gap is heavily confounded by behavior/referral. Don't overstate, but acknowledge the complexity.

