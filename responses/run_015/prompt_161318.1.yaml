  2.  **Sociological Shift:** If the majority of working set theorists shifted from a pluralistic view to a Universist view (or vice versa), the "pragmatic" rightness would shift. Currently, the Multiverse view has gained significant traction in the last 15 years.
  3.  **Inconsistency Proof:** If PFA were proven inconsistent with ZFC + Large Cardinals, Riley's position would collapse. Conversely, if Ultimate $L$ were shown to be incompatible with Large Cardinals, the main Pro-CH program would fail.

  **Where are my point-by-point ratings most likely to fail?**
