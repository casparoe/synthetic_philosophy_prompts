  *   **Justification:** Riley correctly notes that the Multiverse view doesn't dissolve the question for a Universist; it just relocates it to "which universe is standard?" This is a valid philosophical counter. However, the claim that small forcing preserving large cardinals "cuts against" Jordan's point is slightly confused; Jordan was arguing that large cardinals don't settle CH, not that they are destroyed by forcing. Riley is talking past Jordan slightly here, but the core Universist rebuttal holds.

  **Turn 6 (Jordan)**
