answer: |-
  **Workshop Proposal: Stacked Performatives & Digital Felicity**
  **Duration:** 3 Days
  **Format:** Intensive Seminar / Working Group

  **The Exact Question**
  When a single digital utterance performs multiple institutional jobs at once (notifying, binding, disclaiming), does this layered structure break Austin's felicity conditions, or do we just need to tweak the framework?

  **Why Standard Accounts Don't Cover It**
  Austin and Searle mostly treat misfires and abuses as singular events. Like, a bet is off, or the marriage vow doesn't count. But look at digital institutional messages—automated contract updates, AI moderation notices, TOS change emails. One utterance often does several jobs simultaneously. It notifies you, binds you to new terms, and disclaims liability all in the same breath.

  The classic framework assumes a unified intention and uptake, but algorithmic messaging splits that up. If the "notify" part works but the "bind" part misfires (maybe you never saw it, or the bot got the procedure wrong), does the whole speech act collapse? Or do we have partial felicity? Standard theory doesn't really have a handle on this simultaneity or the idea that one text might be felicitous on one layer and infelicitous on another.

  **Method**
  We aren't trying to rewrite *How to Do Things with Words*. Instead, we'll do close-reading of a small set of real platform messages (5-10 examples). We'll take things like Instagram ban notices, Uber contract updates, or automated copyright strikes and run them against Austin's conditions (conventional procedure, appropriate participants, correct execution, etc.). We'll look for where the layers conflict.

  **Success vs. Failure**
  *   **Success:** We map out where the friction is. Maybe we identify a new category of "partial misfire" specific to automated institutional talk. Or we prove Austin holds up surprisingly well despite the complexity. We leave with a solid outline for a paper.
  *   **Failure:** We get stuck on definitions or try to solve the whole philosophy of language in 72 hours. Also failure if we can't find enough clear examples where the layers actually contradict each other rather than just being vague.

  **Scope Check (3 Days)**
  This is tight, so we need to be realistic.
  *   **Day 1:** Refresh Austin/Searle basics + select corpus of messages.
  *   **Day 2:** Apply felicity conditions to the texts. Identify the "stacks."
  *   **Day 3:** Draft findings. Decide if the framework needs tweaking or breaking.

  We won't produce a final theory, just a collaborative zine piece or paper draft. The goal is to figure out if this is a real problem or just a category error.

  Let me know if this works. I'll add the refs later.
