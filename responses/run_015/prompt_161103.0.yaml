prompt: |-
  I'm a PhD student in organismal biology, and this term our lab started a small reading group on the adaptationism disputes. We opened with the 1979 Gould–Lewontin spandrels paper, and a visiting morphologist spent most of that first session arguing about whether the architectural term they borrowed is even the right one for the structure they described — which should give you a sense of the level of pedantry we operate at. Last week I presented a draft chapter arguing that an exaggerated, energetically costly tail ornament in the lek-breeding bird I work on functions as an antipredator signal. At the end, a senior postdoc — who favours a byproduct/constraint story about the same trait, and who had been quiet through the whole talk — said "well, that's just a just-so story," and the room moved on. I can't tell whether he was making a methodological complaint, a complaint about the unobservability of the past, or just a fancy way of saying he wasn't convinced, and those are very different complaints for me to answer. I also don't want to spend the next meeting rebutting a reading of the phrase he didn't intend.

  For what it's worth, here is what I actually have: convergent gains of the ornament in four independent lineages in my phylogeny, each of which co-occurs with a visually hunting predator absent from the ranges of their ornamentless sister taxa; removal experiments showing a current survival cost to bearing it and a current detection benefit; and an optimality model showing the ornament's dimensions sit near a predicted aerodynamic optimum — though the model ignored an allometric constraint that a colleague has since pointed out could produce the same dimensions, and I have not yet run a drift-plus-constraint null against my comparative data. So some of the things that phrase might mean are probably blocked by evidence I already have, and at least one or two of them are not, and I'd like to know which is which.

  What I want from you is a menu, not an essay. Please lead with your bottom line in the first sentence — what, if anything, the charge comes to in this exchange — and then give the readings: the distinct precise theses "that's just a just-so story" could be expressing when it's used this way (about testability in principle vs. in practice, about whether the story was constructed after the fact or predicted in advance, about whether alternatives and nulls were considered, about whether the trait's current use is being conflated with the reason it originally evolved, about whether an optimality story ignores constraints, and whatever else belongs on the list), each stated sharply enough that I could see whether it applies to my case. For each, say whether it is a platitude, a substantive and defensible methodological demand, or actually false; whether it would genuinely support dismissing my hypothesis in that meeting rather than merely lowering confidence in it; and whether my evidence blocks it. Then tell me which of those readings, if that is what he meant, would also sink his own byproduct alternative — since his story is a historical claim too — and what single study I could run that both of us would have to accept as bearing on the crux. Don't point me to papers or give me a reading list; I have library access, and what I need is the logical map. Please write in American English.
