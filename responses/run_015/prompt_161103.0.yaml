answer: |-
  The charge is almost certainly a substantive methodological demand that you have not adequately ruled out non-adaptive null models, specifically regarding constraints and drift, rather than a claim that your hypothesis is untestable in principle.

  ### The Menu of Readings

  **1. The Untestability Thesis**
  *   **Thesis:** Historical claims about trait origin are inherently untestable because the past is unobservable, making any narrative speculative.
  *   **Classification:** False.
  *   **Impact:** Would justify dismissing the hypothesis entirely.
  *   **Blocked by your evidence:** Yes. Comparative phylogenetics and experimental removal allow for inference of historical causes via present traces.
  *   **Sinks Postdoc:** Yes. His byproduct story is also a historical claim about origin.

  **2. The Post Hoc Rationalization Thesis**
  *   **Thesis:** The hypothesis was constructed to fit known data rather than predicting novel facts, making it vulnerable to confirmation bias.
  *   **Classification:** Substantive and defensible methodological demand.
  *   **Impact:** Lowers confidence but does not justify dismissal; accommodation is weaker evidence than prediction.
  *   **Blocked by your evidence:** Partially. Your optimality model predicts dimensions, but the antipredator narrative appears constructed after observing the trait and predators.
  *   **Sinks Postdoc:** Yes. His constraint story is also being proposed after observing the trait dimensions.

  **3. The Missing Null Model Thesis**
  *   **Thesis:** You have not quantitatively compared the adaptation hypothesis against a specific null model (e.g., drift plus allometric constraint).
  *   **Classification:** Substantive and defensible methodological demand.
  *   **Impact:** Lowers confidence; justifies withholding acceptance until the analysis is run.
  *   **Blocked by your evidence:** No. You explicitly admitted you have not yet run a drift-plus-constraint null against your comparative data.
  *   **Sinks Postdoc:** Yes, conditionally. If he has not quantitatively modeled the constraint to show it explains the data better than drift, his alternative is equally unsupported.

  **4. The Utility-vs-Origin Thesis**
  *   **Thesis:** You are conflating the trait's current utility (antipredator) with the historical reason for its evolution (which could be sexual selection).
  *   **Classification:** Substantive and defensible methodological demand.
  *   **Impact:** Lowers confidence in the historical claim; restricts conclusion to current function.
  *   **Blocked by your evidence:** Partially. Removal experiments prove current utility; phylogenetic co-occurrence suggests historical link, but lek-breeding context leaves sexual selection as a viable confounder.
  *   **Sinks Postdoc:** No. His story is specifically about origin/constraint, not current utility.

  **5. The Ignored Constraint Thesis**
  *   **Thesis:** Your optimality model is invalid because it ignores biological constraints (allometry) that could produce the same phenotype without selection.
  *   **Classification:** Substantive and defensible methodological demand.
  *   **Impact:** Lowers confidence in the optimality claim; supports the alternative hypothesis.
  *   **Blocked by your evidence:** No. You acknowledged the colleague's point about the allometric constraint.
  *   **Sinks Postdoc:** No. This reading directly supports his byproduct/constraint alternative.

  **6. The Circularity Thesis**
  *   **Thesis:** The only evidence for the function is the existence of the trait itself (e.g., "it exists, so it must be useful").
  *   **Classification:** False.
  *   **Impact:** Would justify dismissing the hypothesis entirely.
  *   **Blocked by your evidence:** Yes. You have independent evidence (predator distribution, removal experiments, convergent phylogenetics).
  *   **Sinks Postdoc:** Yes. If he has no independent evidence for the constraint beyond the trait's existence, his story is equally circular.

  ### The Crux Study

  **Phylogenetic regression of ornament residuals against predator presence.**
  Construct a phylogenetic comparative model where you regress ornament dimensions against body size to generate residuals (removing the allometric constraint), then test whether those residuals correlate with the presence of visually hunting predators across your taxa. If the residuals correlate with predators, the allometric constraint alone cannot explain the trait variation, forcing the postdoc to model a constraint that predicts the specific residual variation rather than just the mean dimensions.
