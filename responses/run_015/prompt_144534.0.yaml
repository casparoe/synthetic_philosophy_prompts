  **Scenario**
  A marine biology consortium has spent fifty years classifying vent microbes using the predicate "Phot-Positive," defined operationally by a standard spectrometer reading that has successfully guided sample collection across all surveyed sites (all shallower than 3000 meters). All observed Phot-Positive microbes possess the genetic marker "Seq-7," and the community has entrenched "Phot-Positive" through decades of successful projection in grant proposals and field guides. A new expedition targets vents at 4000 meters, where biochemistry indicates the spectrometer reading is caused not by Seq-7 metabolism but by a distinct, high-pressure symbiont that lacks Seq-7. The existing data confirms both "All sampled microbes are Phot-Positive" and "All sampled microbes are Seq-7," yet the predicates diverge on the untested deep samples: the entrenched predicate projects Phot-Positivity (and thus implies the presence of the spectrometer signature), while the natural-kind predicate projects Seq-7 (which implies a negative spectrometer reading at that depth).

  **Analysis**
  This case forces a divergence because **Entrenchment** licenses projecting "Phot-Positive" based on its history of successful use in the community's linguistic and practical habits, whereas **Naturalness** licenses projecting "Seq-7" based on its alignment with the underlying causal mechanism (genetic metabolism) rather than the instrumental symptom. The structural feature doing the work is **Indicator-Essence Decoupling**: the entrenched predicate tracks a reliable indicator that is nomologically connected to the natural kind only within the observed range of background conditions (depth/pressure), functioning as a hidden disjunction (Seq-7 in shallow water OR Symbiont-X in deep water). If this feature is removed—if the indicator were causally necessary for the kind—the case degenerates into ordinary confirmation where both responses agree; if the threshold were arbitrary (like a calendar date) rather than mechanistic, it degenerates into the standard "Grue" puzzle with no scientific plausibility. The Entrenchment response comes out worse in this scenario because it mandates a false prediction based on historical habit; the strongest line of attack against it is that **conservative projection is epistemically blind to theory change**, rendering it incapable of correcting systematic error when background conditions shift beyond the training set of past projections.

  | Response | Predicate it licenses projecting | Feature of the case it keys on | Strongest objection available to it |
  | :--- | :--- | :--- | :--- |
  | **Entrenchment** | Phot-Positive | History of successful past usage and linguistic habit within the community. | It is insensitive to causal mechanisms, guaranteeing error when instrumental correlates decouple from natural kinds. |
  | **Naturalness** | Seq-7 | Alignment with underlying causal powers and biological essence (carving nature at the joints). | It presupposes epistemic access to "real" kinds that is itself an inductive gamble, risking circularity. |
