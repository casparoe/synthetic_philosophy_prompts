  6.  **Addressing Constraints & Failure Modes:**

      *   *Constraint 1 (No Jargon):* Strict enforcement.
      *   *Constraint 2 (Perceptual):* Use a high-saturation green square for 60 seconds to induce a red afterimage on a white background.
