      3.  **Authority (Fact):** "I claim the Glow changed, physics didn't." (Fact status fails because only I know, making it unfalsifiable).

      *Let's build the Ledger Card.*
      Fields: Claim, Settlement Condition, Adjudicator, Outcome.

