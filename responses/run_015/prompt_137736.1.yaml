answer: |-
  # Activity Design: The Settlement Ledger

  **Session Title:** The Ledger of Subjective Claims
  **Duration:** 90 Minutes (3 Rounds × 20 min + 30 min Debrief)
  **Participants:** 15 Adults
  **Materials:** Projector, screen, index cards (3 per person), pens, bowl of chocolate chips (approx. 10 per person), whiteboard, marker.
  **Forbidden Vocabulary (Until Debrief):** Qualia, phenomenal, consciousness, experience, feeling, sensation, inverted spectrum, zombie, Mary, intrinsic, private, ineffable.
  **Allowed Vocabulary:** The Glow, The Target Property, Report, Claim, Settlement, Criterion, Physics, Behavior.

  ---

  ## Part 1: Setup & Rules (00:00 – 00:05)

  **Facilitator Script:**
  "Welcome. For the next hour, we are running a betting market on a specific property of perception we will call **'The Glow.'** You will make claims about The Glow. To win chips, your claims must be *settled*. A claim is settled only if there is an agreed-upon procedure to determine if it was true or false after the fact. If you cannot agree on a settlement procedure, the bet is void, and the House takes a tax.

  We are not discussing physics. We are not discussing brain states. We are discussing The Glow. You may define The Glow however you like, but you must be able to bet on it.

  **The Rules:**
  1.  **Stakes:** You start with 10 chips. You may bet 1 chip per claim.
  2.  **Settlement:** Every bet requires a written 'Settlement Condition.' If the condition cannot be executed, the bet is void, and you lose 1 chip to the House.
  3.  **Vocabulary:** Do not use words related to brain science or metaphysics. Stick to 'The Glow,' 'Reports,' and 'Observations.'
  4.  **The Spoiler Rule:** If anyone names the philosophical concept underlying this game before the debrief, they must stand in the corner for 5 minutes. We play the game first."

  **Board Setup:**
  Draw a table on the whiteboard:
  | Round | Bets Placed | Bets Settled | Voids (House Tax) |
  | :--- | :--- | :--- | :--- |
  | 1 | | | |
  | 2 | | | |
  | 3 | | | |

  ---

  ## Part 2: Round 1 – Stability (Intra-Subject Time) (00:05 – 00:25)

  **Goal:** Force the definition of The Glow to become relational rather than intrinsic via temporal drift.
  **Perceptual Manipulation:** Color Afterimage.

  **Procedure:**
  1.  **Stimulus (5 min):** Project a high-saturation Cyan square (Hex #00FFFF) on a black background. Instruct participants to stare at a small black dot in the center. Do not look away.
  2.  **The Bet (5 min):** Distribute Index Card Type A.
      *   *Prompt:* "Make a claim about whether The Glow you perceive *now* is the **Same Type** as The Glow you perceived 2 minutes ago."
      *   *Options:* [SAME] or [DIFFERENT].
      *   *Requirement:* You must write a **Settlement Condition**. How will we verify this in 5 minutes?
  3.  **Adjudication (5 min):** Participants swap cards with a partner. The partner acts as Adjudicator.
      *   *Constraint:* The Adjudicator cannot read the Claimant's mind. They can only check the Settlement Condition.
  4.  **Silence Note:** During the 5-minute staring phase, the room must be silent. The Facilitator watches for eye movement. If someone looks away, note it privately; do not interrupt.

  **Index Card Type A (Text):**
  > **CLAIM:** The Glow at T1 is [ SAME / DIFFERENT ] from The Glow at T2.
  > **SETTLEMENT CONDITION:** (e.g., "I will raise my hand if...", "I will match it to a swatch...")
  > **ADJUDICATOR:** _______________
  > **OUTCOME:** [ PASS / FAIL / VOID ]

  **Facilitator Action:**
  Collect the cards. Tally the "VOIDs" on the board.
  *Expected Failure:* Participants will write "I will remember." The Adjudicator will object: "Memory is not a settlement condition." Participants will then try "I will discriminate it against a standard."
  *The Wall:* If they use discrimination, The Glow is defined by the *relationship* between the subject and the standard, not an intrinsic property of the Glow itself. If they stick to "I just know," the Adjudicator voids the bet (uncheckable).

  ---

  ## Part 3: Round 2 – Alignment (Inter-Subject Space) (00:25 – 00:45)

  **Goal:** Force the definition of The Glow to become public rather than private via cross-subject comparison.
  **Perceptual Manipulation:** Shared Stimulus.

  **Procedure:**
  1.  **Stimulus (2 min):** Project a complex image (e.g., a checkerboard shadow illusion or a multicolored fractal).
  2.  **The Bet (8 min):** Distribute Index Card Type B. Participants pair up.
      *   *Prompt:* "Make a claim about whether your partner's Glow is the **Same Type** as your Glow."
      *   *Requirement:* Write a **Settlement Condition** that the *partner* can verify without accessing your head.
  3.  **Adjudication (5 min):** Pairs attempt to settle.
  4.  **Silence Note:** During the pairing, the Facilitator circulates. If a pair is arguing metaphysics, interrupt with: "Write the condition. Can you check it? Yes or No."

  **Index Card Type B (Text):**
  > **CLAIM:** Partner's Glow is [ SAME / DIFFERENT ] from My Glow.
  > **SETTLEMENT CONDITION:** (e.g., "We both use the word 'Red'", "We both pick the same swatch")
  > **PARTNER SIGNATURE:** _______________
  > **OUTCOME:** [ PASS / FAIL / VOID ]

  **Facilitator Action:**
  Tally the "VOIDs" on the board.
  *Expected Failure:* To settle, they must rely on behavior (language, pointing). This makes The Glow a functional/behavioral property, stripping it of Privacy. If they insist on Privacy ("Only I know my Glow"), the bet is Void (uncheckable by partner).

  ---

  ## Part 4: Round 3 – Authority (The Silent Swap) (00:45 – 01:05)

  **Goal:** Force the choice between First-Person Authority and Fact-Status.
  **Perceptual Manipulation:** None (Projector Off).

  **Procedure:**
  1.  **Setup (2 min):** Turn off the projector. Room is lit normally.
  2.  **The Bet (8 min):** Distribute Index Card Type C.
      *   *Prompt:* "Claim: The Glow is present right now."
      *   *Constraint:* There is no external stimulus. There is no partner check. Only you know.
      *   *Requirement:* Write a **Settlement Condition**. Who adjudicates?
  3.  **Adjudication (5 min):** Participants submit cards to the Facilitator. The Facilitator acts as the "House."
  4.  **Silence Note:** This round will generate tension. Participants will realize they are writing checks they can cash themselves. Maintain silence. Let them feel the weight of being the sole authority.

  **Index Card Type C (Text):**
  > **CLAIM:** The Glow is [ PRESENT / ABSENT ] right now.
  > **SETTLEMENT CONDITION:** (e.g., "I say so", "My pulse rate", "I write it down")
  > **ADJUDICATOR:** [ SELF / HOUSE / OTHER ]
  > **OUTCOME:** [ PASS / FAIL / VOID ]

  **Facilitator Action:**
  Tally the "VOIDs" on the board.
  *The Wall:* If Adjudicator = SELF, the claim is unfalsifiable (not a fact). If Adjudicator = HOUSE, the House has no access (claim is Void).
  *The Number:* The Board should now show a high Void rate in Round 3 compared to Round 1.

  ---

  ## Part 5: Debrief & Mapping (01:05 – 01:30)

  **Goal:** Reveal the argument, map the walls, and acknowledge limitations.

  **01:05 – 01:10: The Reveal**
  **Facilitator:** "Look at the board. In Round 1, you struggled to define 'Same' over time. In Round 2, you struggled to define 'Same' across people. In Round 3, you struggled to define 'Fact' without an observer.
  The word we were forbidden from using is **Qualia**. Specifically, the philosophical posit that experience has properties that are **Intrinsic, Private, Ineffable, and Immediately Apprehensible.**"

  **01:10 – 01:20: Mapping the Walls**
  Write the four properties on the board. Ask the group to map the rounds.
  *   **Round 1 (Time):** You found that to settle 'Same,' you needed a discrimination test. This makes the property **Relational**, not **Intrinsic**. *Load-bearing property: Intrinsic.*
  *   **Round 2 (Space):** You found that to settle 'Match,' you needed public behavior. This makes the property **Public**, not **Private**. *Load-bearing property: Private.*
  *   **Round 3 (Authority):** You found that if you are the sole authority, the claim cannot be wrong. This makes it a **Decree**, not a **Fact**. *Load-bearing property: Immediately Apprehensible.*

  **Discussion:** "Which property did you surrender first to keep the game going?" (Usually Privacy or Intrinsic). "What did surrendering it cost you?" (It turned The Glow into a functional disposition or a behavioral report).

  **01:20 – 01:25: Handling Escape Routes**
  Anticipate and address the three standard retreats:
  1.  **Retreat to Function:** "Okay, it's just discrimination." *Response:* Then it's not a private inner object; it's a capacity. The 'Glow' is dissolved into doing.
  2.  **Retreat to Authority:** "My report is incorrigible." *Response:* Then it's not a claim about the world. It's a noise you make. We can't bet on noises, only on predictions.
  3.  **Retreat to Ineffability:** "It can't be described." *Response:* Then it can't be used in reasoning. It drops out of the rationality project.

  **01:25 – 01:30: Limitations (Crucial)**
  **Facilitator:** "This activity demonstrates a **conceptual squeeze**. It shows that the *concept* of Qualia, as a bundle of those four properties, cannot sustain a settlement condition.
  **It does not prove:**
  1.  **The Hard Problem:** It does not explain *why* there is experience at all.
  2.  **The Knowledge Argument:** It does not address Mary the Color Scientist (what she learns upon release).
  3.  **Metaphysics:** It does not prove physicalism is true. It only proves that *talking* about private facts is incoherent.
  You can still believe experience exists. You just cannot treat it as a 'fact' in a ledger without changing what you mean by 'fact' or 'experience.' That is the end of the session."

  ---

  ## Part 6: Contracts & Scoring Rules

  **The Ledger Card (General Template)**
  *(Print on Index Cards)*
  > **CLAIM ID:** _______
  > **PROPERTY:** The Glow
  > **ASSERTION:** _________________________________________________
  > **SETTLEMENT CONDITION:** (Must be executable by a third party)
  > ___________________________________________________________________
  > **ADJUDICATOR:** [ Self / Partner / House ]
  > **STAKE:** [ 1 Chip ]
  > **RESULT:** [ Win (+1) / Loss (-1) / Void (-1 Tax) ]

  **Scoring Rule:**
  *   **Win:** Claim matches outcome determined by Settlement Condition. (+1 Chip)
  *   **Loss:** Claim contradicts outcome. (-1 Chip)
  *   **Void:** Settlement Condition was impossible to execute or relied on forbidden access (mind-reading). (-1 Chip Tax to House Bowl).

  **Deadlock/Dissolution Rule:**
  "If a pair cannot agree on a Settlement Condition within 3 minutes, the bet is automatically Void. The Facilitator will mark the card. Do not argue the philosophy; mark the card and move on."

  ---

  ## Part 7: Predicted Failure Modes & Repairs

  **1. The Spoiler (Names the game early)**
  *   *Symptom:* Participant says, "This is about qualia eliminativism," in Round 1.
  *   *Repair:* Facilitator points to the corner. "Thank you. Please stand there for 5 minutes. You may observe but not speak. The rest of you, continue defining 'The Glow'."
  *   *Rationale:* Preserves the discovery process for the other 14 participants.

  **2. The Skeptic (Declares everything unverifiable)**
  *   *Symptom:* Participant refuses to bet, claiming "No one can verify The Glow."
  *   *Repair:* "You are correct that it is hard. However, the game rule is: No Bet = No Play. If you do not submit a card with a condition, you pay the House Tax (1 chip) for inactivity. You can either try to define a condition or lose chips silently."
  *   *Rationale:* Forces them to engage with the *attempt* to verify, which generates the friction needed for the argument.

  **3. The Physicalist (Proposes neural measurement)**
  *   *Symptom:* "Settlement condition: fMRI scan of V4."
  *   *Repair:* "We have no fMRI. We have index cards. If your condition requires equipment not in the room, it is Void. Propose a condition using only people in this room."
  *   *Rationale:* Forces the problem back into the interpersonal space where privacy becomes a barrier.

  **4. The Solipsist (Collapses into Other Minds)**
  *   *Symptom:* "I can never know if Round 2 works because I am not them."
  *   *Repair:* "Treat the other participant as a Black Box. You do not need to know *if* they have The Glow. You only need to settle if their *Output* matches your *Rule*. Can you write a rule for the Output?"
  *   *Rationale:* Shifts focus from metaphysical certainty to operational settlement, which is the core of the activity.

  ---

  ## Part 8: Facilitator Notes on Silence & Tension

  *   **During Staring (Round 1):** Do not break silence even if people fidget. The discomfort of fixation mirrors the conceptual discomfort coming later.
  *   **During Pairing (Round 2):** If a pair gets loud, approach and whisper: "Write the condition. If you can't write it, you can't bet."
  *   **During The Swap (Round 3):** This is the critical moment. When participants realize they are adjudicating themselves, the room will go quiet. Let it stay quiet. Do not fill the air. The realization must land internally.
  *   **The Board Tally:** Update the board visibly after each round. Use a red marker for "Voids." The visual growth of the "Void" column is the numerical proof of the collapse.

  ---

  ## Part 9: Frank Limitations (For Facilitator Eyes Only)

  **What this activity DOES:**
  *   Demonstrates that the *language game* of qualia breaks down under settlement pressure.
  *   Shows that "Private Fact" is an oxymoron in a betting context.
  *   Forces participants to choose between being right (private) and being useful (public).

  **What this activity DOES NOT DO:**
  *   **It does not disprove Experience:** Participants will still feel pain and see red. This activity does not claim those don't exist. It claims they cannot function as *premises in a public argument* without translation.
  *   **It does not solve the Hard Problem:** It does not explain why the discrimination feels like anything. It sidesteps the "Why" to focus on the "How we talk about it."
  *   **It does not address the Knowledge Argument:** Mary in the black-and-white room is not addressed. A participant *will* raise this in debrief.
      *   *Response:* "Mary's case relies on the idea that there is a fact she doesn't know. This activity suggests that if she can't settle a bet on it, it's not a 'fact' in the propositional sense. Whether that satisfies you is the remaining philosophical work."

  **Final Facilitator Warning:**
  You cannot argue them into the conclusion. The activity must generate the friction. If you explain the point before Round 3, you ruin the data. Trust the Ledger. If the Voids pile up, the board speaks for you.
