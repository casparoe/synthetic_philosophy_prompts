      *   05-25: Round 1 (Drift).
      *   25-45: Round 2 (Match).
      *   45-65: Round 3 (Swap).
      *   65-90: Debrief.

  9.  **Refining the "Collapse Visible as a Number":**

      *   Board Tally: "Settled Bets" vs "Voided Bets."
      *   Goal: Show that as the rounds progress, "Voided" increases because criteria become impossible to agree on without contradicting the definition of the property.
      *   Better: A "Coherence Score." Start at 100%. Deduct points for every time a settlement rule contradicts a previously held axiom of the property.
      *   Best: The "Settlement Ledger." Total bets placed vs. Total bets successfully adjudicated. Round 3 should result in 0% adjudication if they stick to the definition, or 100% if they abandon the definition.

  10. **Writing the Content:**

      *   *Tone:* Precise, facilitator-focused, rigorous.
      *   *Handouts:* Need text for the Ledger Cards.
      *   *Facilitator Notes:* Crucial for managing the silence and the "spoilers."

