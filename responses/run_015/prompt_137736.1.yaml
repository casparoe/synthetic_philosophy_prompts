  7.  **Debrief Structure:**

      *   Map Round 1 to Intrinsic/Relational.
      *   Map Round 2 to Privacy/Public.
      *   Map Round 3 to Authority/Fact.
      *   Identify the load-bearing property (usually Privacy or Immediate Apprehensibility).
      *   Discuss escape routes.
