      *   *Team Roles:* Explicitly map the Historian, Philosopher, Statistician to the tasks.

  7.  **Final Polish:**
      *   Make sure to answer the specific prompt requirements: "Defend a specific ordering," "Upstream/Downstream," "Change priority conditions," "Which is wheel-spinning."
      *   Ensure the tone is decisive ("If I were funding...").
      *   Check the "Reference Class Elasticity" concept integration.

      *(Self-Correction during drafting)*: I initially thought about putting "Modern vs. Agrarian" first. But you can't test if they are the same class if you haven't defined the class properties (endpoints) consistently. So Endpoint Definition *must* be first. However, to avoid wheel-spinning, the definition work must be tied to *variance in base rates*. If changing the definition from "conquest" to "admin collapse" doesn't change the base rate much, the problem is smaller. If it changes from 5% to 50%, it's critical. So the first project is *measuring the elasticity*, not just defining the rules.

      *Revised Priority 1:* Quantify Reference Class Elasticity (How much do base rates shift under different endpoint definitions?).
      *Revised Priority 2:* Structural Break Analysis (Agrarian vs. Modern).
      *Revised Priority 3:* Feature Stability (Fiscal/Demographic).

      *Wheel-spinning:* Purely normative definitions of "Empire" (Philosophy without Stats) and Mechanism hunting (Feature B) before Class Validation.

