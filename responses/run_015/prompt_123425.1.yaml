      *   *Priority 1:* **Sensitivity Analysis of Endpoint Definitions.** (Not just "formalizing rules," but testing how much the base rate *wiggles* when you change the rule). This tackles the "Elasticity" problem directly.
      *   *Priority 2:* **Structural Equivalence Test (Modern vs. Agrarian).** Don't assume they are the same. Test for it.
