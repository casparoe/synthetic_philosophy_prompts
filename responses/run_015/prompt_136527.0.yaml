answer: |-
  This is a precise and subtle distinction you are drawing. It requires separating the *incentive* to gather information from the *production* of information, and separating the *accuracy* of a signal from its *grounding*. You are describing a dynamic process of decay that masquerades as stability.

  I will proceed by testing three candidate concepts against your pattern. I will measure them against your two specific constraints: (1) the persistence of accuracy despite the loss of grounding (the latency), and (2) the non-production of private information (rather than the suppression of existing information).

  ### Candidate 1: The Grossman-Stiglitz Paradox
  This is the economic baseline you already identified. It states that if a price perfectly reveals all information, no agent has an incentive to pay the cost to become informed; but if no one is informed, the price cannot reveal information. Thus, a fully efficient market is an impossible equilibrium.

  *   **What it captures:** It captures the *incentive structure*. It correctly identifies that the success of the aggregate (the price) undermines the motive for the individual input (the inquiry). It validates your intuition that this is a problem of economic rationality applied to epistemology.
  *   **What it leaves over:** It is an equilibrium claim, not a dynamic one. It says "this state cannot hold," whereas you are describing "this state holds deceptively for a long time." Grossman-Stiglitz implies that if information gathering stops, informativeness collapses immediately. Your pattern describes a system where informativeness *coasts* on momentum, residue, or incidental production. It misses the **latency**. It also does not distinguish between *ignoring* information and *not producing* it; it treats "uninformed" as a binary state, not a process of atrophy.
  *   **Verdict:** This explains *why* the decay starts, but not *how* it survives undetected.

  ### Candidate 2: Informational Cascades (Herding)
  This is the standard social epistemology model. An individual observes the actions of predecessors and infers that they possess private information. Eventually, the weight of public action outweighs the individual's private signal, and they rationally ignore their own information to follow the crowd.

  *   **What it captures:** It captures the *social reliance* on the aggregate. It explains why an individual might rationally choose to trust the price/forecast over their own judgment.
  *   **What it leaves over:** As you noted, cascades require agents to *have* private signals and then *discard* them. Your case is about the signal never being generated. Furthermore, cascades are typically fragile; they "burst" when a defector reveals the truth. Your phenomenon is robust; it does not burst when someone defects, because there is no truth to reveal. The failure is not a conflict between public and private belief, but an absence of private belief.
  *   **Verdict:** This explains the *social pressure*, but misidentifies the *epistemic content*.

  ### Candidate 3: The Tragedy of the Commons (Applied to Information)
  Information is often treated as a public good. If the price aggregates everyone's knowledge, the knowledge becomes non-excludable. Rational agents will free-ride on the information produced by others. If everyone free-rides, the public good (the flow of new information) is not produced.

  *   **What it captures:** It captures the *production failure*. It frames the independent inquiry as a resource that is under-invested in because the benefits are socialized while the costs are private.
  *   **What it leaves over:** The Tragedy of the Commons usually implies a direct degradation of the resource itself (the pasture is overgrazed). In your case, the resource (the price/forecast) does not degrade immediately. It remains accurate. The "commons" here is not the current accuracy, but the *future reliability*. Standard Tragedy models do not account for the **inertial accuracy**—the fact that the system continues to yield value long after the investment has stopped.
  *   **Verdict:** This explains the *resource depletion*, but misses the *masking of the depletion*.

  ### The Leftover and the Coinage

  None of these concepts capture the specific combination of **incentivized non-production** plus **inertial accuracy**.
  *   Grossman-Stiglitz misses the time lag.
  *   Cascades miss the non-production.
  *   Tragedy of the Commons misses the masking.

  The phenomenon you are describing is a specific kind of structural rot where the output remains valid while the input mechanism dies. It is distinct because the system does not fail when it loses its grounding; it fails only when the environment changes enough that the residue is no longer sufficient.

  I propose we call this **Epistemic Hollowing**.

  #### Definition
  **Epistemic Hollowing** is the process by which a successful information aggregate (a price, a forecast, a ranking) reduces the incentive for independent information production among its contributors, leading to a state where the aggregate retains accuracy via inertia, residue, or incidental input, while losing its grounding in deliberate inquiry.

  The core feature is the **Grounding Lag**: the temporal gap between the cessation of independent inquiry and the observable loss of accuracy. During this lag, the system is epistemically hollow: it functions as if it is grounded, but it is merely coasting.

  #### Edges of the Concept

  To ensure this concept has sharp boundaries, we must distinguish cases that are clearly *in* from those that are clearly *out*.

  **Cases Clearly IN (Epistemic Hollowing):**
  1.  **Freight Pricing (Your Case):** The price remains accurate because past inquiries are still relevant or because a few operators check for their own operational needs, not for the market. The market price is hollow because the marginal trader no longer checks.
  2.  **Credit Rating Agencies (Pre-2008):** Ratings remained high for a while because they were based on historical models and residual data, even as the incentive for analysts to deeply audit the underlying assets vanished (or was conflicted). The accuracy of the rating lagged behind the rot of the assets.
  3.  **Algorithmic Search Rankings:** A search engine ranks pages based on links. If users stop creating new content because they trust the existing top results to be sufficient, the index becomes hollow. It remains "accurate" regarding what *was* good, but loses contact with what *is* good, until a query reveals the gap.

  **Cases Clearly OUT (Not Epistemic Hollowing):**
  1.  **Pluralistic Ignorance (The Hiring Committee):** As you described, the information exists privately but is suppressed. This is *Epistemic Suppression*, not Hollowing. The beam is solid, but no one admits it.
  2.  **Goodhart's Law:** When a measure becomes a target, it ceases to be a good measure. This involves *strategic distortion* of the input. In Hollowing, the input isn't distorted; it is *absent*.
  3.  **External Shock:** If a war breaks out and grain prices spike, causing the model to fail, that is not Hollowing. That is a change in the underlying reality. Hollowing is endogenous; the decay comes from the success of the aggregate itself.
  4.  **Grossman-Stiglitz Equilibrium:** If the market simply stops trading because no one wants to pay for info, that is the GS result. Hollowing requires the market to *continue trading* and *continue appearing accurate* while the knowledge base evaporates.

  #### Relation to the Familiar Results

  You asked how this relates to the familiar result about prices revealing everything (Grossman-Stiglitz) and herding.

  **Vs. Grossman-Stiglitz:**
  Grossman-Stiglitz is a **boundary condition**. It says, "You cannot reach 100% efficiency." Epistemic Hollowing is the **trajectory** toward that boundary. It describes the road along which the market travels as it becomes *more* efficient. It says, "As you approach 100% efficiency, you become increasingly fragile, but you will not know it until the environment shifts." GS is the cliff; Hollowing is the erosion of the path leading to it.

  **Vs. Informational Cascades:**
  Cascades are about **conflict**. There is a tension between private signal and public action. Hollowing is about **absence**. There is no tension because the private signal is null. In a cascade, the system is brittle (one defector breaks it). In Hollowing, the system is ductile (it bends and stretches, remaining accurate, until it snaps).

  **Vs. Reflexive Predictions:**
  A reflexive prediction changes the outcome (e.g., predicting a bank run causes the run). Epistemic Hollowing does not necessarily change the outcome (the grain supply is what it is). It changes the **relationship to the outcome**. The map remains accurate, but the cartographers have stopped walking the terrain.

  ### Summary of the Shape

  The shape of this idea is a **hollow cylinder**.
  *   **Outer Wall:** The public aggregate (price, forecast). It remains smooth and intact.
  *   **Inner Void:** The independent inquiry. It has been eaten away.
  *   **The Glue:** Inertia and incidental data. This holds the wall up for a time.
  *   **The Failure Mode:** Not a burst (like a cascade), but a collapse under load (when a new variable appears that the residue cannot account for).

  You are identifying a specific vulnerability in social epistemology: **Accuracy is not a proof of grounding.** We tend to assume that if a system is right, it must be connected to reality. Epistemic Hollowing demonstrates that a system can be right simply because reality hasn't changed enough to expose the disconnection. This makes the concept vital for risk assessment in any domain where we rely on aggregated wisdom.
