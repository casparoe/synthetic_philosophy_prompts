answer: |-
  Henry Sidgwick sits rigidly in a velvet armchair as a translucent figure coalesces before him, rattling chains and emitting a low, mournful moan. Sidgwick does not flinch; he opens a notebook and adjusts his spectacles.

  "Before we discuss whether you refute materialism," Sidgwick says, pen poised, "you must survive the three methods of practical reason. First, Egoism: Does your manifestation promote my own greatest good? Frankly, the draft you've created is detrimental to my constitution, so you score poorly there."

  The spirit pauses, looking hopeful. "But the general good?"

  "Second, Utilitarianism," Sidgwick continues. "If belief in your kind deters crime through fear of post-mortem sanctions, the aggregate happiness of society might rise. So, functionally, you have potential utility."

  The ghost puffs up, glowing brighter. "Then you accept my ontology?"

  "Not necessarily," Sidgwick says, turning the page. "We must apply the Intuitionist test. For your existence to serve as a foundation for ethical reasoning, it must be a self-evident truth, clear, precise, and mutually consistent. But look at you." Sidgwick gestures at the ghost's flickering edges. "You are vague. You are empirically noisy. You lack the logical coherence required of a first principle."

  "I'm a haunting, not a syllogism!" the spirit wails.

  "Precisely," Sidgwick replies, standing up and closing the notebook. "And since you cannot be intuited with Cartesian certainty, I must conclude you are ethically negligible. Do come back when you are more self-evident."
