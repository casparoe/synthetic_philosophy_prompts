answer: |-
  Dear Sir,

  I find your analogy both striking and instructive, though I must caution that the instrumental framing carries with it certain risks if pushed too far. You suggest that the shift from the participant stance to the objective stance resembles a calibration adjustment, a lowering of gain when the signal becomes too noisy to carry meaningful information. There is much in this that accords with my own view, particularly insofar as it captures the idea that neither stance is absolute and that the transition between them is governed by practical exigencies rather than metaphysical insight. If we understand the social machinery to which you refer as the framework of human relationships itself, then yes, both attitudes are adjustments within that framework, and neither grants us a privileged view of the universe from outside it. The objective attitude is not the stance of one who has seen the truth of determinism and thereby ascended to a higher rational plane; it is merely the stance of one who finds it necessary, for whatever reason, to suspend the ordinary demands of interpersonal engagement.

  However, I must press a distinction regarding the purpose of the instrument. In your field, the aim of calibration is presumably the accurate representation of some external fact. In the moral life, the reactive attitudes are not primarily instruments for data collection or for the measurement of some independent variable called free will. They are constitutive of the relationships themselves. When I feel resentment toward you for a slight, I am not merely registering a datum about your moral status; I am engaging with you as a moral agent, demanding a certain kind of recognition. To view the reactive attitudes as merely susceptible to noise is to suggest that their primary function is cognitive, whereas I would insist their primary function is relational. They are the natural expressions of our involvement in one another. When we adopt the objective attitude, we are not simply filtering out noise to get a clearer reading; we are stepping out of the relationship of mutual recognition and treating the other as an object to be managed, cured, or trained.

  This distinction matters greatly for your question about whether the objective attitude is a higher or more rational moral standpoint. If the shift were merely a matter of improving the accuracy of our moral measurements, one might be tempted to say that the objective stance is superior because it is less distorted by emotional interference. But this is precisely the error I wish to combat. The objective attitude is not superior; it is simply different, and it is often humanly impossible to sustain it universally. To view all human beings objectively, to see all their actions as mere events to be managed rather than expressions of will to be resented or thanked, would be to abandon the very thing that makes us human. It would be to live in a world without love, anger, or gratitude. Thus, your analogy reinforces my view only if we understand that the calibration is not toward some ideal of metaphysical accuracy, but toward the practical necessities of living together. We lower the gain not because the signal is false, but because the channel of communication is temporarily broken or because the interlocutor is incapable of using it.

  Consider the cases I have often cited: the child, the mentally disturbed, the man under extreme strain. When we adopt the objective attitude toward them, we do not do so because we have discovered they are determined in a way that others are not. We do so because the ordinary conditions of interpersonal relationship are not met. It is a practical accommodation, not a theoretical discovery. Your physicist's eye sees this as a change in operational range, and in that sense, you are correct. But you must not suppose that the operational range of the reactive attitudes is limited by the truth of determinism. The truth of determinism, if it is a truth at all, applies equally to all human actions. It does not apply more to the madman than to the sane man. Therefore, the shift in attitude cannot be justified by a shift in metaphysical belief. It is justified by the practical impossibility of maintaining the participant stance in certain conditions.

  So, to answer your direct question: the instrumental framing reinforces my view that both attitudes are context-dependent adjustments of the same underlying social machinery, provided we do not interpret that machinery as designed to track metaphysical freedom. It undermines the claim that the objective attitude is a higher moral standpoint only if we recognize that the objective attitude is itself a human tool, limited and partial, just as the reactive attitudes are. Neither gives us the view from nowhere. Neither escapes the human condition. We are not judges standing outside the universe; we are participants within it. The objective attitude is a retreat from participation, sometimes necessary, sometimes humane, but never a final solution to the problem of how to live. It is a way of coping when the demands of participation become too great or when the other party cannot meet them. It is not a revelation of the true nature of things.

  I appreciate the precision you bring to this discussion. It is often useful to have the structures of our ordinary life examined by those accustomed to examining the structures of the physical world. But do not let the elegance of the instrument metaphor obscure the fact that the reactive attitudes are not merely tools we pick up and put down at will. They are part of our nature. We can modify their expression, we can suspend them by policy, but we cannot wish them away without ceasing to be the kind of creatures we are. The objective attitude is a policy; the reactive attitudes are a fate. We choose to be objective; we find ourselves resentful. This asymmetry is crucial. If your calibration adjustment implies a symmetrical choice between two settings, I must correct you. We slide into the reactive stance by virtue of our humanity; we climb into the objective stance by an effort of will or necessity. That effort does not make us wiser; it makes us distant.

  I hope this clarifies my position without dismissing the value of your comparison. There is a rigor in your thinking that I find congenial, even if our subjects differ. I look forward to your further reflections on whether this naturalistic account of responsibility can satisfy the demand for justice, or whether justice itself is merely another feature of the social machinery we cannot do without.

  Yours sincerely,

  P. F. Strawson
