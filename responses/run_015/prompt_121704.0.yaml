  ### 5. Triviality and Costs

  **Does the Shift Rule escape Triviality?**
  *   **Yes, regarding Lewis (1976):** Lewis's proof relies on the assumption that $Cr(A \to B) = P(B|A)$. The Shift Rule defines $Cr(A \to B) = P_{A^*}(B)$. Since Imaging ($P_{A^*}$) is not Conditionalization ($P(\cdot|A)$), the algebraic steps in Lewis's proof fail. Specifically, Imaging does not satisfy the Law of Total Probability in the same way: $P_{A^*}(B) \neq P(A)P_{A^*}(B|A) + P(\neg A)P_{A^*}(B|\neg A)$.
  *   **No, regarding Hájek (1989/1994):** Hájek showed that triviality results can be generated for Imaging if you assume conditionals embed freely and obey certain logical equivalences (like Import-Export).
  *   **The Escape Hatch:** You must deny **Import-Export** ($ (A \to (B \to C)) \equiv ((A \land B) \to C) $). Your Case (vii) already suggests you are comfortable with logical anomalies. The Shift Rule naturally violates Import-Export because shifting by $A$ then $B$ is not the same as shifting by $A \land B$ (the order of causal breaks matters).

  **What do you give up?**
  1.  **Classical Truth Conditions:** You cannot say $A \to B$ is simply true or false at a world. It is true at $w$ iff $B$ is true at the closest $A$-world $w_A$. But since "closest" depends on your causal model (which might vary by agent), the proposition expressed is context-sensitive.
  2.  **The Law of Total Probability:** You cannot calculate the probability of a conditional by summing over a partition in the standard way.
  3.  **Modus Ponens:** As seen in (vii), high credence in $A$ and $A \to B$ does not guarantee high credence in $B$ if the conditional involves a shift that alters the probability of $B$ independently of $A$'s truth.

