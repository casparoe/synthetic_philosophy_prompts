  4.  **Sacrifice Verdict (iii)** for the strict *indicative* case (classify it as subjunctive/deliberative) to maintain consistency with (ii), OR argue that (ii) is the loose talk and (iii) is the strict causal semantics. Given your embedding data (vii), the **Causal Imaging** route (sacrificing ii) is theoretically more robust for a unified logic, even if it contradicts some linguistic intuitions.
  5.  Explicitly deny Import-Export to avoid Hájek's triviality.

