  **"If it has a name"**
  No single canonical noun like "Moloch" exists, but the dynamic is extensively mapped in Design Theory and Disability Studies. It is the shift from **Universal Design** to **Reasonable Accommodation**. In policy literature, it overlaps with **"Sludge"** (behavioral friction) and critiques of **"Digital by Default"** strategies. You are describing the **residualization of access**: when a universally available good becomes a specialized accommodation upon request. The politics aren't in the new tool, but in the reclassification of the old standard from "public utility" to "special favor." The mechanism is well-understood in equity auditing. It is a specific form of passive exclusion driven by benign neglect, where optimization for the majority degrades the baseline for the minority.

  **"Nearest misses"**
  1. **The Digital Divide:** This focuses on asset ownership (who has smartphones). Your pattern is about service architecture (who bears the cost of *not* having them). Closing the divide might mitigate harm, but doesn't fix the structural demotion. If everyone has a phone but the battery dies, the fallback is still hostile. The divide is a gap; your pattern is a cliff. The new artifact is better for everyone, which confuses the Divide analysis.
  2. **Winner's "Do Artifacts Have Politics?":** You correctly identified the difference. Winner (and the Moses essay) argues politics are *embedded* in the artifact's function (low bridges block buses). Here, the artifact functions neutrally; the politics are in the **withdrawal of support** for the alternative. It's politics by subtraction, not addition. The bridge is built low *to* exclude; your app is built high, leaving others below.
  3. **Administrative Sludge:** (Sunstein/Reisch). This is the closest mechanism. Sludge is friction that discourages access. However, Sludge usually describes bureaucracy generally (tax forms). Your pattern is specific: the *demotion* of a previously frictionless legacy path.
  **Best Fit:** The **Universal Design vs. Accommodation** framework. Universal Design makes environments usable by all without adaptation. Accommodation requires individuals to request modifications. Your cases show systems moving from Universal (paper maps for all) to Accommodation (paper maps for those who ask). This explains the stigma: accommodations mark you as "other," transforming a right into a favor.

  **"The carve"**
  For this phenomenon to exist, four conditions must hold:
  1. **Prior Universality:** The legacy method was previously available to everyone as a default without special request. It was part of the standard service envelope.
  2. **Demotion, Not Ban:** The legacy method remains technically available but is reclassified as an exception, accommodation, or special request. It is not illegal, just inconvenient.
  3. **Asymmetric Friction:** Accessing the legacy method now incurs significantly higher transaction costs (time, travel, stigma, cognitive load) than the new default. The "price" of the old service has risen via friction.
  4. **Invisible Harm:** The designers frame the change as neutral improvement because the majority benefits, treating the increased cost to the minority as an externality rather than a design feature. The harm is invisible in the new system's metrics.
  If the old way is simply gone, it's obsolescence. If the old way remains equally easy, it's choice expansion. This is specifically **access residualization**, where the burden of compatibility shifts from the provider to the user. Intent is irrelevant; the outcome is structural exclusion. The justification is always efficiency or modernization, which masks the distributional shift.

  **"Edge cases"**
  1. **Humiliation:** Yes, it's central. Moving from Universal to Accommodation inherently creates a "supplicant" dynamic. You must identify as needy to access the old right. If the fallback is private (mail) vs public (office), the stigma varies, but the burden shift remains. The humiliation confirms the status change.
  2. **Good Fallback:** If the mailed timetable arrives in 2 days but is *higher quality*, is it still this? Yes, if the *immediacy* was part of the original universal service. Loss of temporal access is still access loss. Convenience is a feature of access.
  3. **Addition without Displacement:** If the app exists but paper maps stay on the wall, it is **not** this phenomenon. The politics require the **withdrawal** of the universal default. Mere addition is neutral; demotion is political. The harm lives in the removal of the easy path. If both exist, the user retains agency. The loss of agency is the political injury.

  **"What to call it"**
  **Term:** **Access Residualization**.
  **Gloss:** The process of demoting a universal service to a special accommodation, hiding exclusion behind friction and stigma. It captures the shift from "provided for all" to "provided for those who struggle," making inequality a side effect of optimization. Use this when arguing that "available" does not mean "accessible."
