answer: |-
  ### Brainstorming: Types of Reasons for Following Conventions

  Before formulating a principle, we must distinguish the different normative "forces" at play in your examples. A convention might command our attention for four distinct reasons:

  1.  **Moral Reasons:** These concern harm, rights, fairness, and dignity. If violating a norm hurts someone (US tipping), treats them as a mere means, or exploits a cooperative scheme (cutting a queue), the reason to follow it is moral.
  2.  **Prudential Reasons:** These concern self-interest. You follow the norm to avoid a fine, social awkwardness, or inefficiency. If you don't tip in the US, you might be confronted; if you hang back in Italy, you might not get coffee. This is about cost/benefit, not right/wrong.
  3.  **Legal Reasons:** These concern statutory authority. A rule is binding because the state says so. Jaywalking in Germany is illegal; the moral weight comes only if we believe we have a duty to obey the law *as such*.
  4.  **Merely Coordinative Reasons:** These concern solving collaboration problems where the specific choice matters less than everyone making the *same* choice (e.g., driving on the right vs. left). If the coordination breaks down, everyone loses, but following the norm doesn't inherently protect a right or prevent harm—it just keeps the system running.

  Your intuition suggests that some conventions shift from *coordinative* or *prudential* into the *moral* realm. The challenge is to identify the trigger for that shift.

  ### The Principle: Valid Cooperative Reliance

  The principle that best captures your verdicts is the **Principle of Valid Cooperative Reliance**.

  **Statement:**
  *A visitor has a moral obligation to follow a local convention if and only if that convention functions as a **stable, mutually recognized cooperative scheme** upon which others **legitimately rely** for their welfare, dignity, or fair treatment.*

  This principle has three necessary conditions:
  1.  **Stability (Validity):** The local community must generally uphold the norm. If locals routinely ignore it, it is not a valid scheme.
  2.  **Recognition:** The norm must be understood by participants as the governing rule of interaction.
  3.  **Reliance:** Others must count on your compliance to secure a morally salient benefit (wages, dignity, fairness, order).

  ### Applying the Principle to Your Verdicts

  1.  **US Tipping (Decent Service):**
      *   *Stability:* High (expected norm).
      *   *Reliance:* Servers rely on tips for welfare (living wage).
      *   *Verdict:* **Moral Obligation.** Violating it harms welfare. (Matches your view).
  2.  **Japan Tipping:**
      *   *Stability:* High (strict no-tip norm).
      *   *Reliance:* Workers rely on the norm to maintain professional dignity and pride in fixed pricing.
      *   *Verdict:* **Moral Obligation (to not tip).** Violating it disrespects dignity. (Matches your view).
  3.  **Germany Jaywalking:**
      *   *Stability:* High (locals obey even without cars).
      *   *Reliance:* The community relies on universal compliance to maintain a culture of safety and rule-of-law trust.
      *   *Verdict:* **Moral Obligation.** Violating it is "free-riding" on the civic trust others maintain. (Matches your view).
  4.  **London Tube Queue:**
      *   *Stability:* High (strict queuing).
      *   *Reliance:* Passengers rely on the order for fair access.
      *   *Verdict:* **Moral Obligation.** Cutting is stealing a place (unfairness). (Matches your view).
  5.  **Hospital Waiting (Silent Line):**
      *   *Stability:* High (implicit mutual understanding).
      *   *Reliance:* Patients rely on arrival order for fair treatment.
      *   *Verdict:* **Moral Obligation.** Cutting is fraud on the implicit contract. (Matches your view).
  6.  **Chaotic Bus Boarding:**
      *   *Stability:* Low (no queue norm exists).
      *   *Reliance:* No one expects order; everyone expects jostling.
      *   *Verdict:* **No Moral Obligation.** It is merely coordinative/prudential. (Matches your view).
  7.  **Supermarket Express Lane:**
      *   *Stability:* Low (locals routinely ignore it).
      *   *Reliance:* Because locals ignore it, no one can legitimately rely on it being kept clear.
      *   *Verdict:* **No Serious Moral Wrong.** The norm is invalid due to non-compliance. (Matches your view).

  ### Application: The Italian Coffee Bar

  **The Case:** A visitor in Italy notices locals crowd the counter and shout orders rather than forming a line. Is there a moral obligation to crowd?

  **Analysis using Valid Cooperative Reliance:**
  1.  **Stability:** Yes. The "crowd and shout" method is the stable local norm.
  2.  **Recognition:** Yes. The barista and customers understand this as the method of transaction.
  3.  **Reliance:** This is the critical filter. Do others *rely* on you crowding for their **welfare, dignity, or fairness**?
      *   *Fairness:* Unlike the London queue, the Italian bar norm is not typically "first to arrive, first served" in a linear sense. It is often "first to attract attention, first served." Hanging back does not steal someone else's place; it merely yields your own.
      *   *Welfare/Dignity:* Does hanging back harm the barista? It might cause slight inefficiency if you step forward late, confusing the flow. However, this is a minor coordinative friction, not a harm to livelihood or dignity.
      *   *Expectation:* The barista expects you to engage to be served, but does not necessarily expect you to be aggressive.

  **Verdict:**
  There is **no moral obligation** to crowd and shout. There is a strong *prudential* and *coordinative* reason to do so (otherwise you will not get coffee, or you will slow down the transaction), but failing to do so does not wrong anyone. You are not stealing a spot (as in London), nor harming a wage (as in the US), nor insulting a dignity (as in Japan). You are simply opting out of an efficiency game.

  Therefore, it is acceptable to hang back and wait politely, provided you do not disrupt the flow when you do order. Your politeness is not a moral virtue here, just as the locals' crowding is not a moral vice; it is simply a different coordination equilibrium.

  ### Evaluation: Complexity and Tensions

  Does this principle save your pattern without cost? Mostly, but there is one point of tension that adds complexity.

  **The Cost of Complexity:**
  The principle requires you to assess the *validity* and *reliance* of a norm before acting. This is cognitively demanding for a visitor. You cannot simply ask "Is there a rule?" You must ask "Is this rule actually upheld by others, and do they rely on it for something morally significant?" This turns moral decision-making into a sociological investigation.

  **The Potential Verdict Overturn:**
  To make the principle philosophically robust, I must flag the **Germany Jaywalking** verdict as the most precarious.
  *   **The Tension:** Your intuition is that jaywalking on an empty street is a *moral* wrong (breaking shared trust). However, under strict moral scrutiny, if no one is harmed and no one is treated unfairly (since no one is waiting), the "wrong" is abstract.
  *   **The Adjustment:** To save this verdict, my principle relies on the idea of **"Free-Riding on Civic Institutions."** You are benefiting from a culture of order (safe streets, predictable traffic) without contributing to it.
  *   **The Overturn:** If you reject the idea that "undermining a culture of rule-following" is a *moral* harm equivalent to stealing a place in line, then you must overturn the Germany verdict. You would have to reclassify it as a **Civic Duty** (legal/political obligation) rather than a **Moral Obligation** (interpersonal right/wrong).
  *   **Recommendation:** I suggest keeping your verdict but acknowledging that it rests on a specific view of citizenship: that we owe it to our fellow citizens to uphold the *system* of rules, even when individual violations cause no immediate harm. If you are not willing to accept that "system maintenance" is a moral duty, then the Germany case must be downgraded from "morally wrong" to "civically irresponsible."

  **Summary:**
  Your intuitions are consistent under the **Principle of Valid Cooperative Reliance**. Conventions become moral obligations only when they are stable, recognized, and relied upon for welfare, dignity, or fairness. The Italian coffee bar case falls short on the "Reliance" condition (no fairness/welfare stake), making it a matter of prudence, not morality. The only friction point is whether maintaining abstract social trust (Germany) counts as a moral duty, which requires accepting a "free-rider" argument.
