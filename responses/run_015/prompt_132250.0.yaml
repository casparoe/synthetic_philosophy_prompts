prompt: |-
  You are an expert in moral philosophy with a focus on practical reason and social norms. Before you answer, please take a moment to brainstorm: distinguish the different kinds of reasons—moral, prudential, legal, and merely coordinative—that might explain why someone should follow a local convention.

  I have no formal training in philosophy, but I have been thinking on my own about whether everyday conventions—tipping, queuing, jaywalking—create genuine moral obligations, especially for visitors who did not grow up with them. I want to know whether there is one principle that captures my gut reactions across cases, or whether I am just being inconsistent.

  Here are my verdicts:

  - In the United States, leaving no tip after genuinely poor service feels acceptable, but leaving none after decent service feels like a moral failure, not mere cheapness, because I know servers depend on tips for a living wage.
  - In Japan, leaving a tip feels wrong—almost insulting—even though it gives the worker extra money. So following the local no-tip norm seems morally required, not just polite.
  - In Germany, jaywalking when no cars are present still feels morally wrong in a distinctive way, as if one is breaking a shared trust rather than merely breaking a law. As a visitor, doing it seems worse than violating some arbitrary local rule.
  - In a London Tube queue, pushing past others feels like stealing their place; but in a bus boarding in another city where there is no line and everyone jostles, hanging back politely does not feel morally superior—just inefficient.
  - In a hospital waiting room with no numbers or staff, everyone silently knows the arrival order. Cutting that invisible line feels like fraud. By contrast, in a supermarket with an "express lane" sign that locals routinely ignore, using it with too many items feels like breaking a rule, yet not like a serious moral wrong.

  There is tension here: some conventions feel like invisible contracts that bind visitors (tipping for wages, silent queues, jaywalking as shared trust), while others feel like pure coordination tools that generate no moral duty (bus boarding, ignored express lanes).

  Please state the most precise principle you can that captures all or most of these verdicts, then apply it to a case I have not listed: a visitor in Italy notices that locals at a coffee bar never form a line but instead crowd the counter and shout their orders. Is there a moral obligation to crowd with them, or is it acceptable to hang back and wait politely?

  Be explicit about whether your principle saves the pattern only at the cost of complexity, and if it forces me to overturn one of my verdicts, identify exactly which one and why. Do not provide bibliographies, reading lists, or citations—just reason through the cases directly.
