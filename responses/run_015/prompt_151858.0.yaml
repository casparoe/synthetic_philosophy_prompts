answer: |-
  This is a precise and valuable phenomenological observation. You have identified a gap between the *normative logic* of attitudes (what philosophy says should ground them) and the *psychological mechanics* of attitudes (how they are actually built in high-stakes relational repair).

  Here is the carving you asked for. I will address your three questions in order, then provide the confidence assessments and defeaters, marking contested philosophical terrain as we go.

  ### 1. Is there a name for this shape?

  There is no single settled term that captures the specific combination of *causal efficacy* and *normative defect* you describe, but the phenomenon sits squarely within a debate known as **The Wrong Kind of Reason (WKR) Problem**.

  In meta-ethics and epistemology, a distinction is drawn between:
  *   **Reasons of the Right Kind (RKR):** Considerations that bear on the *fittingness* of the attitude (e.g., evidence for belief, trustworthiness for trust).
  *   **Reasons of the Wrong Kind (WKR):** Considerations that bear on the *benefits of having* the attitude (e.g., a reward for believing, business survival for trusting).

  Standard philosophical orthodoxy (e.g., Parfit, Kolodny) holds that WKRs cannot generate the attitude itself; they can only generate a desire to have it. This aligns with your "belief case" (the junior manager cannot actually believe the system will work just because it helps him).

  However, your data from mediation suggests that for *reactive attitudes* (trust, gratitude, admiration), WKRs **can** causally generate the state, but they leave a specific residue. Since the existing literature mostly argues that WKRs *fail* to produce the state, it lacks a specific label for when they *succeed but corrupt*.

  **The Carving:**
  I propose we call this **"Instrumentalized Alienation."**

  *   **What it is:** A state where an attitude (trust, gratitude) is successfully instantiated via instrumental reasoning (WKR), resulting in a functional psychological disposition that mimics the genuine attitude, but lacks the correct normative grounding.
  *   **What it is not:** It is not "pretense" (the brother actually feels reliance); it is not "self-deception" (he knows why he is doing it); it is not "bad faith" in the Sartrean sense (he is not lying to himself about his freedom).
  *   **Where its edges lie:** The edge is marked by **reflective stability**. A genuine attitude survives reflection on its grounds. An instrumentally alienated attitude dissolves or weakens when the instrumental ground is made salient (as you noted: "Whenever the reason was made salient... it partly dissolved").

  **Why the "Belief Case" fails but the "Trust Case" works:**
  Belief has a "mind-to-world" direction of fit. To believe *p* is to take *p* to be true. You cannot take *p* to be true *because it is useful*; that is a different mental state (hope, acceptance, or policy).
  Trust, however, has a "world-to-mind" or constitutive element. Trust is partly a *commitment* to rely. Commitments can be willed. Therefore, you can "will" the reliance for instrumental reasons, and over time, the affective component (the feeling of trust) catches up to the behavioral commitment. This is why the brother arrives at "something recognisably like trust." It is real, but it is **prosthetic**. It functions, but it is experienced as external to the core relationship.

  ### 2. Is this the same phenomenon as the belief case?

  **Verdict:** No. It is structurally distinct, though they share a family resemblance regarding "wrong-kind reasons."

  **The Difference:**
  The difference lies in **Doxastic Involuntarism vs. Emotional Voluntarism.**
  *   **Belief:** Most philosophers (and your senior colleague's case) accept that belief is involuntary regarding its grounds. You cannot believe at will. Therefore, the WKR creates a fracture that prevents the state from existing at all. You get "acting as if."
  *   **Trust/Gratitude:** These are "reactive attitudes" (P.F. Strawson's term). While they have cognitive components, they are also dispositions of the will and affect. Contemporary work by **Victoria McGeer** on "scaffolding trust" argues that trust can be cultivated strategically to *make* someone trustworthy.

  In your trust case, the instrumental reason acts as a **scaffold**. It holds the structure up until the affective reality can fill it. The "compromise" you detect is that the scaffold remains visible. The brother says, "I have to *make* myself trust you." That "make" indicates the attitude is not flowing naturally from the object (the sister's trustworthiness) but is being pushed by the subject (the brother's will).

  **The Resentment Factor:**
  You noted the sister "flinched... the sort of thing a person can be resented for." This is crucial. In the belief case, no one is resentful because no relationship is at stake. In the trust case, trust is a **second-personal demand** (Stephen Darwall's concept). To trust someone for the sake of the firm is to treat them as a means to the firm's end, rather than as a partner worthy of trust in themselves. The sister flinches because she recognizes she is being *used* to sustain the trust, rather than *invited* into it.

  ### 3. Why is forgiveness different?

  **Verdict:** Your intuition is likely correct, but not because forgiveness is immune to instrumentalization. It is because forgiveness is often defined **therapeutically** (self-regarding) whereas trust is defined **relationally** (other-regarding).

  **The Carving:**
  *   **Trust** is inherently **bilateral**. It makes a claim on the other ("I rely on you"). If the ground for that reliance is "the firm needs it," the other person feels reduced to a tool.
  *   **Forgiveness** is often framed as **unilateral**. "I forgive you to free *myself* from resentment." This definition (common in therapy and restorative justice) makes the instrumental reason ("because resentment was making me ill") a **Right Kind of Reason** for *that specific definition* of forgiveness.

  If forgiveness is defined as "the overcoming of resentment for the sake of the self's peace," then doing it for health is fitting. If trust is defined as "reliance based on perceived goodwill," doing it for business survival is unfitting.

  **The Mistake Check:**
  However, there is a contested view here. Some philosophers (e.g., **Charles Griswold**) argue that "hollow forgiveness" (forgiving without the offender's repentance, solely for self-help) is not actually forgiveness, but rather "letting go." If your clients are achieving "letting go," the instrumental reason is valid. If they are claiming full normative forgiveness (restoring the moral relationship) while using instrumental reasons, they may be suffering from the same "Instrumentalized Alienation" as the trust case, but they lack the vocabulary to detect the fragility. The fragility might show up later as a return of resentment, which is often misdiagnosed as "the work wasn't deep enough" rather than "the grounds were wrong."

  ***

  ### Confidence Levels and Defeaters

  Here I mark the confidence in each verdict and what would overturn it. I also indicate where philosophical consensus breaks down.

  #### Verdict 1: The concept is "Instrumentalized Alienation" (a variant of the WKR problem).
  *   **Confidence:** **Moderate (60%).**
  *   **Why not higher:** Philosophy has not settled on a phenomenology of "successful but defective" attitudes. Most WKR literature assumes failure of the attitude, not corruption of it.
  *   **What would change my mind:** If empirical psychology showed that the "fragility" you observe is actually just standard extinction curves for conditioned responses, unrelated to the *reasons* given. If the trust dissolves simply because the sister re-offends or time passes, regardless of whether the "firm" reason is mentioned, then the "normative defect" is a story we tell, not a psychological reality.
  *   **Contested Territory:** Whether "reasons" are causal mechanisms or normative justifications. If reasons are just causes, there is no "Wrong Kind," only "Effective" and "Ineffective." Your observation relies on the normative view (that some reasons are the *wrong sort* even if effective).

  #### Verdict 2: This is distinct from the belief case (due to voluntarism).
  *   **Confidence:** **High (85%).**
  *   **Why not higher:** Some "pragmatic encroachment" epistemologists argue that practical stakes *do* affect belief justification. If they are right, the belief case might be more like the trust case than standard orthodoxy allows.
  *   **What would change my mind:** A case where a manager *actually believes* a system will work solely because their job depends on it, without any evidence, and that belief is stable under reflection. If you find a "belief" that behaves like your "trust" (causally effective, real, but fragile/compromised), then the distinction between doxastic and emotional attitudes collapses.
  *   **Contested Territory:** **Doxastic Voluntarism.** Can we choose beliefs? Most say no. If future research shows we can "cultivate" belief like we cultivate trust, the distinction vanishes.

  #### Verdict 3: Forgiveness is different because it is self-regarding (therapeutic) vs. other-regarding (relational).
  *   **Confidence:** **Low/Moderate (50%).**
  *   **Why not higher:** This depends entirely on the definition of forgiveness, which is fiercely contested. If your clients are engaging in "hollow forgiveness," they *are* experiencing Instrumentalized Alienation, they just haven't hit the breaking point yet.
  *   **What would change my mind:** Longitudinal data showing that instrumentally motivated forgiveness collapses under reflection just like trust does. If, five years later, the clients who forgave "to be free of it" report that the forgiveness feels "fake" or "transactional" when discussed, then forgiveness is not different; it just has a longer fuse.
  *   **Contested Territory:** **The Normativity of Forgiveness.** Is forgiveness a duty (owed to the repentant) or a gift (given by the victim)? If it is a duty, instrumental reasons are the Wrong Kind. If it is a gift/therapy, instrumental reasons are the Right Kind. Your field (restorative justice) often blends these, which creates the confusion.

  ### Summary of the "Carving"

  You are observing the friction between **Normative Fittingness** (is this attitude appropriate to the object?) and **Psychological Causality** (does this reason produce the state?).

  *   **Belief:** Causality fails. You cannot believe for utility.
  *   **Trust:** Causality succeeds, but Normative Fittingness fails. The state exists but is alienated.
  *   **Forgiveness:** Causality succeeds. Normative Fittingness is ambiguous because the definition of the act shifts between "moral restoration" (other-regarding) and "emotional release" (self-regarding).

  **Proposed Term for your Practice:**
  If you need a term to use with clients to name this shape without jargon, I suggest **"Prosthetic Trust."**
  *   *Definition:* Trust that functions mechanically but lacks the neural connection to the other person's character.
  *   *Boundary:* It works for transactions (running the firm) but fails for intimacy (the sister flinches).
  *   *Usage:* "We have built a prosthetic trust here. It allows the business to walk, but it doesn't feel like your own limb. To make it flesh, we need to find reasons grounded in her, not the firm."

  This respects your observation that the state is *real* (it walks) but *compromised* (it's not flesh).
