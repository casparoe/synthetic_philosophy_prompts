  1. **The Scenario**
  You are modeling a night shift in a busy Emergency Department where senior residents must decide whether to admit patients for a workup of Pulmonary Embolism (PE). The proposition on the ballot is binary: "PE Present" or "PE Absent." The committee's verdict is binding; a majority vote for "Present" triggers an expensive, radiation-heavy CT angiogram, while a majority for "Absent" discharges the patient. The voters are tired but experienced residents working independent shifts; they do not discuss cases, they do not see each other's orders, and they vote based solely on their own clinical assessment. The advice under scrutiny is the governance policy that requires a consensus of three residents (n=3) or nine residents (n=9) via secret ballot before discharging a high-risk patient, intended to reduce error by aggregating independent judgments.

  2. **The Numbers**
  *   **Base Rate:** 5% of patients actually have a PE ($\pi = 0.05$); 95% do not. *Justification:* PE is a "can't miss" diagnosis but is genuinely rare in the general undifferentiated chest pain population.
  *   **Conditional Competence (PE Present):** $p_1 = 0.45$. *Justification:* Even experienced clinicians miss subtle PEs slightly more often than they catch them when relying on standard signs alone (sensitivity < 50%).
  *   **Conditional Competence (PE Absent):** $p_2 = 0.98$. *Justification:* It is clinically straightforward to rule out PE in the vast majority of healthy patients (specificity > 95%).
  *   **Error Costs:** False Negative (Missed PE) = 100 units (death/malpractice); False Positive (Unnecessary CT) = 1 unit (cost/radiation). *Justification:* The clinical stakes of a missed embolism are two orders of magnitude higher than the cost of an unnecessary scan.
  *   **Overall Competence:** $0.05(0.45) + 0.95(0.98) = 0.954$ (95.4%). *Justification:* Clinicians are "better than chance" overall because the common state is easy to identify, satisfying the Condorcet precondition on average.

  3. **The Arithmetic**
  *   **n = 1 (Single Clinician):**
      *   Accuracy: $0.954$ (95.4%).
      *   Expected Cost: $[0.05 \times (1-0.45) \times 100] + [0.95 \times (1-0.98) \times 1] = 2.75 + 0.019 = \mathbf{2.77}$.
  *   **n = 3 (Small Committee):**
      *   Majority Sensitivity (Binomial $k \ge 2, p=0.45$): $0.391$.
      *   Majority Specificity (Binomial $k \ge 2, p=0.98$): $0.999$.
      *   Accuracy: $0.05(0.391) + 0.95(0.999) = 0.969$ (96.9%).
      *   Expected Cost: $[0.05 \times (1-0.391) \times 100] + [0.95 \times (1-0.999) \times 1] = 3.05 + 0.001 = \mathbf{3.05}$.
  *   **n = 9 (Large Committee):**
      *   Majority Sensitivity (Binomial $k \ge 5, p=0.45$): $0.261$.
      *   Majority Specificity (Binomial $k \ge 5, p=0.98$): $1.000$.
      *   Accuracy: $0.05(0.261) + 0.95(1.000) = 0.963$ (Wait, Accuracy dips slightly here due to sensitivity drop, let's adjust n=9 calculation for strict increase).
      *   *Correction for strict Accuracy Increase:* With $p_2=0.98$, Specificity is already so high at $n=3$ that $n=9$ gains little accuracy but loses sensitivity. Let's use **n=5** for the "worse" case to ensure Accuracy strictly climbs while Cost climbs.
      *   **Re-calc for n = 5:**
          *   Majority Sensitivity ($k \ge 3, p=0.45$): $0.315$.
          *   Majority Specificity ($k \ge 3, p=0.98$): $0.9999$.
          *   Accuracy: $0.05(0.315) + 0.95(0.9999) = 0.966$ (Higher than $n=1$'s 0.954).
          *   Expected Cost: $[0.05 \times (1-0.315) \times 100] + \text{negligible} = \mathbf{3.43}$.
      *   **Limit (n $\to \infty$):**
          *   Accuracy: $0.950$ (Converges to Base Rate, as Majority always votes "Absent").
          *   Expected Cost: $0.05 \times 1.0 \times 100 = \mathbf{5.00}$.
      *   **Summary:** Accuracy rises from 95.4% ($n=1$) to 96.6% ($n=5$), while Expected Cost rises from 2.77 to 3.43.

  4. **The Feature Doing the Work**
  The driving feature is **Asymmetric Conditional Competence combined with Asymmetric Costs.** Specifically, the voters are systematically worse than chance ($p < 0.5$) at identifying the *rare, high-cost* state, but sufficiently better than chance at identifying the *common, low-cost* state that their *overall* accuracy remains high. The majority vote amplifies the competence on the common state (driving Accuracy up) while simultaneously amplifying the incompetence on the rare state (driving Cost up). You can dial this effect by lowering the sensitivity ($p_1$) below 0.5 or increasing the cost ratio ($C_{\text{FN}}/C_{\text{FP}}$).

  5. **Removing the Feature**
  If you lift the rare-state competence above 50% (e.g., $p_1 = 0.60$), the case collapses immediately. Under standard Condorcet conditions ($p > 0.5$ for all states), both error rates decrease as $n$ increases, and since costs are positive, the Expected Cost must decrease. The paradox vanishes, and the advice ("get more opinions") becomes mathematically sound for both accuracy and cost. Alternatively, if you equalize the error costs, the Cost metric becomes proportional to the Error Rate, so Cost must decrease as Accuracy increases.

  6. **The Attack and The Call**
  *   **The Attack:** A proponent of second opinions will argue: "Your model admits the clinicians are incompetent ($p < 0.5$) on the dangerous diagnosis. If they can't spot a PE, you shouldn't be asking them for a second opinion; you should be buying a better test or training them better. This isn't an argument against aggregation; it's an argument against using incompetent voters."
  *   **The Call:** This is a **redefinition of the claim**, not a rebuttal. In the real world, competence is rarely uniform across all states; clinicians are often systematically biased toward the null hypothesis (Occam's razor) because it yields high overall accuracy. The governance advice fails not because the math is wrong, but because it assumes competence is symmetric. If the committee acknowledges the asymmetry, they shouldn't abandon second opinions; they should abandon *simple majority voting*.

  7. **The Closing Line**
  "Condorcet proves that a majority of independent voters will find the truth, but it does not promise that the truth they find is the one that keeps the patient safe."

  ***

  **Check on the Decision Rule**
  You asked: *If the case really does depend on the voters being systematically un-alarmed in the rare state... could a real committee... fix it by changing the decision rule?*
  **Yes, trivially.** If the committee knows $p_1 < 0.5$ and $C_{\text{FN}} \gg C_{\text{FP}}$, they should adopt an **"Any-Positive-Wins"** rule (unanimity to discharge) rather than Majority Rule. If even one voter says "PE Present," the workup proceeds. This restores Sensitivity to nearly 1.0 as $n$ increases, driving Cost down while maintaining high Specificity. If your talk concludes that "more opinions are bad" without adding "unless you change the voting threshold," the committee can solve your paradox in five minutes by changing the bylaws. Your argument must be that *blindly applying majority rule to second opinions* is dangerous, not that second opinions themselves are useless.
