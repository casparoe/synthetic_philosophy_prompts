answer: |-
  **TO:** The Trustees of the Marchmont Trust
  **FROM:** [Your Name]
  **DATE:** 14 March
  **SUBJECT:** Recommendation on the Small-Grants Allocation Mechanism

  **Purpose**
  This paper recommends a decision on the Director of Programmes' proposal to replace the small-grants outcomes metric with an AI-assisted endorsement procedure. Our current metric (cost-per-sustained-engagement) is broken. It incentivises gaming (e.g., counting text messages as engagement) and excludes organisations working with the most chaotic young people who cannot guarantee twelve-month outcomes. We are funding what is easy to measure, not what is most needed. However, the proposed solution carries significant risks regarding bias, opacity, and auditability.

  **The Proposal**
  The Director proposes abolishing the ranking metric. Applications would be anonymised (retaining region, amount, activity) and processed by a language model trained on our past twelve years of decisions and written reasons. The model would score applications based on whether they resemble grants we have previously endorsed. A further wrinkle suggests applications be described as they would appear in a future annual report (ex-post framing) to encourage honest assessment. The officer and duty trustee would then review the top band.

  **The Case for Rejection**
  Those opposing this proposal argue that we should repair the current metric rather than introduce a black box. Their strongest case rests on three points. First, **historical bias**: a model trained on our past decisions will learn to replicate our past errors, including the very gaming incentives we now wish to escape. If we previously favoured 'safe' bets, the model will penalise risky, high-need work. Second, **adversarial gaming**: applicants will quickly learn to write for the model, not for the mission. We have already seen applications written in a style that appears machine-optimised. Third, **auditability**: without individual monitoring, we have no ground truth. If we replace a failed proxy (the metric) with an unmeasurable one (the model score), we cannot verify if we are doing better. We may simply be flying blind with a more sophisticated instrument.

  **The 'Approval vs. Goal' Framing**
  One trustee has framed this as a choice between 'approval-directed' systems (doing what the trustees would like) and 'goal-directed' systems (optimising a specific target). This framing earns its keep insofar as it clarifies the mechanism: the metric was goal-directed (optimise the number), while the model is approval-directed (mimic the trustee). However, it does not solve the validity problem. If trustee approval was historically corrupted by the metric, the approval-directed model inherits that corruption. The distinction explains *how* the model works, but not *whether* it is safe to use without guardrails.

  **Solving the Monitoring Problem**
  The third worry (lack of ground truth) is the most serious. We cannot monitor 200 small grants individually; our capacity does not allow it. However, we cannot evaluate a new system without *some* data. I propose we treat monitoring not as a universal requirement, but as an audit function. We must allocate a specific portion of the small-grants budget (or operational budget) to conduct deep-dive monitoring on a random sample of awarded grants. This creates a 'control group' of truth. If the model endorses grants that fail in the deep-dive sample, we know the model is drifting. Without this, we are indeed replacing a failed proxy with an unmeasurable one.

  **Recommendation**
  We must move away from the current metric, but we cannot adopt the proposal as it stands. I recommend we **Adopt Subject to Conditions**. This allows us to test the endorsement procedure while mitigating the risks of bias and opacity.

  **Motion for Vote**
  *That the Board approves the pilot of the Endorsement Procedure for the small-grants stream, subject to the following conditions:*

  1.  **Duration:** The procedure operates as a pilot for 24 months, commencing 1 April 2024.
  2.  **Ground Truth Audit:** 10% of successful applications (selected randomly) will be subject to full monitoring (site visits and outcome verification) funded by a reallocation of 5% of the small-grants budget. A report comparing model scores against actual outcomes will be presented to the Board annually.
  3.  **Human Veto:** The duty trustee and programme officer retain absolute veto power over the top band. No grant is awarded solely on the model's score.
  4.  **Bias Review:** An external technical auditor will review the model's weighting of regions and activity types by 31 March 2025 to ensure it is not systematically excluding high-need cohorts.

  **Conclusion**
  The current system is failing our beneficiaries by excluding the hardest-to-help. The proposed model offers a way to reintroduce human judgement at scale, but it is not a magic wand. By voting for this motion, we acknowledge the risk but insist on evidence. We move from a system we know is broken to one we are capable of fixing.

  **Action Required**
  Please vote to Accept or Reject the Motion above.
