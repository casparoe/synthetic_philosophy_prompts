      *   Did I avoid inventing numbers? I will use ranges and cite the order of magnitude.

  12. **Self-Correction on "Information is Physical":** Make sure to distinguish between "information requires a substrate" (trivial) and "information processing has thermodynamic consequences" (Landauer). The slogan bridges these.

  13. **Final Polish:** Check clarity on the difference between *logical* irreversibility and *thermodynamic* irreversibility. This is the crux of Suspicion 2.

