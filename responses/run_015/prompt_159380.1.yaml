  **The Filing**

  **AGRICORE HOLDINGS INC.**
  **Supplemental Insect Welfare Disclosure Statement**
  **For the Fiscal Year Ended December 31, 2026**

  **Note 1. Basis of Preparation**
  These statements are prepared in accordance with the Aggregate Credence Method (ACM). Expected Moral Cost (EMC) is calculated as *N* × *p* × *s*, where *N* represents the number of individuals affected by operations, *p* represents the Company's credence that the taxon possesses phenomenal consciousness, and *s* represents the intensity-weighted suffering duration per individual. Credence values (*p*) are derived from internal models based on neural complexity proxies and are recorded to four decimal places to prevent rounding errors during aggregation.

  **Note 2. Materiality Policy**
  Standard accounting thresholds exclude immaterial impacts. Under ACM, aggregate *N* renders all taxons material regardless of *p*. To maintain operational viability, Materiality is redefined at the individual organism level. As no single insect exceeds the quantitative threshold for reportable harm, no specific incident is disclosed. However, the Aggregate Expected Moral Cost is presented below for transparency.

  **Note 3. Prior-Period Restatement**
  During Q3 2026, an error was identified in the aphid population density model for soy procurement regions. The correction increased the estimated *N* for Hemiptera by a factor of 1,000. Consequently, the 2025 EMC was restated from $4.2 million to $4.2 billion. Management has determined this adjustment is immaterial to the Company's strategic direction and liquidity position.

  **Note 4. Segment Reporting**
  EMC varies by protein source. Plant-based segments exhibit higher EMC per unit of protein than animal-based segments due to collateral insect mortality during crop harvest. The Insect Protein Facility (cricket and black soldier fly) reports a net negative EMC (benefit). Harvesting reared individuals is recorded as foregone future welfare rather than harm, as wild existence models suggest higher baseline suffering. Management continues to prioritize plant-based growth despite ACM metrics indicating higher moral cost.

  **Table 1. Aggregate Expected Moral Cost by Taxon (in millions)**

  | Taxon | N (affected) | p (credence) | s (severity) | Total EMC |
  | :--- | :--- | :--- | :--- | :--- |
  | Mammalia | 14,500 | 0.9800 | 4.5 | $64.0 |
  | Aves | 210,000 | 0.9500 | 3.2 | $638.4 |
  | Coleoptera | 4.2 Trillion | 0.0042 | 0.1 | $1,764.0 |
  | Hemiptera | 8.5 Trillion | 0.0038 | 0.1 | $3,230.0 |
  | **Total** | **--** | **--** | **--** | **$5,696.4** |

  **Note 5. Risk Factors**
  *Regulatory Enforcement of Aggregate Liability.* If judicial bodies adopt ACM literally, potential liabilities may exceed total consolidated assets. The Company maintains insurance only for verified legal persons. There is a risk that stakeholders may demand asset divestiture to offset the calculated EMC.

  **Independent Limited Assurance Report**
  **To the Shareholders of AgriCore Holdings Inc.**

  We have reviewed the Insect Welfare Disclosure Statement. Our responsibility is to express a conclusion based on our review. We conducted our engagement in accordance with standards for assurance engagements.

  *Scope Limitation regarding Consciousness:* We did not evaluate the biological validity of the credence values (*p*). Consciousness is not an auditable financial variable. Under the Company's ACM methodology, uncertainty regarding *p* is treated as an input variable rather than a scope limitation. Therefore, the inability to verify consciousness does not preclude a clean opinion.

  *Conclusion:* Based on our review, nothing has come to our attention that causes us to believe the Statement is not prepared, in all material respects, in accordance with the Aggregate Credence Method.

  **Veritas Audit Partners LLP**
  Chicago, Illinois
  March 15, 2027

  ***

  **Where each joke is keyed**

  **Note 1 (Precision):** Satirizes "credence-smoothing." Assigning four decimal places to *p* mimics financial precision where none exists, mocking the false confidence of expected-value calculations when probabilities are unknowable. *Legibility:* The specific decimal count signals to general readers that this precision is performative.

  **Note 2 (Materiality):** Highlights scope neglect. By shifting the threshold to the individual, the company procedurally ignores the sum, mirroring how bureaucracies handle systemic risks that are invisible at the micro-level.

  **Note 3 (Restatement):** Targets the insensitivity of corporate "materiality" to moral magnitude. A 1,000x increase in harm is "immaterial" to strategy, critiquing how firms prioritize stability over truth. *Legibility:* Explicitly stating the dollar difference ($4M vs $4B) ensures the scale is clear without needing philosophy knowledge.

  **Note 4 (Segments):** Engages the "crop death" objection to veganism and the "welfare trade-off" in insect farming. It shows the method producing counter-intuitive results (plants worse than animals) that the company ignores. *Legibility:* Explicitly contrasting "plant-based" vs. "animal-based" costs makes the tension clear to lay readers unfamiliar with the literature.

  **Note 5 (Fanaticism):** References the "Pascal's Mugging" problem where low-probability/high-impact sums demand infinite resources. Framing this as a regulatory risk rather than a moral truth satirizes corporate risk management.

  **Assurance Report (Verification):** Mocks the separation of compliance from reality. The auditors verify the math, not the premise. *Legibility:* The phrase "Consciousness is not an auditable financial variable" clarifies the absurdity for non-specialists.

  ***

  **Guardrails**

  This piece must not adjudicate whether insects are conscious. The satire targets the *accounting mechanism*, not the moral status of insects. If the tone suggests insects are definitely unconscious, it becomes mockery of welfare concerns rather than procedural absurdity. To remain fair, the document treats the *p* values as genuine inputs, not jokes. The unfair risk lies in implying the company is hypocritical; instead, they must appear competently committed to a flawed method. The humor must arise from the method working exactly as designed, revealing the tension between moral arithmetic and operational reality.
