answer: |-
  **The MeritExceed Loyalty Programme**
  *Terms and Conditions of Membership (v.4.2)*

  **Unlock Your Higher Potential.**
  MeritExceed rewards Members for conduct that exceeds the baseline expectations of society. Earn Status Tiers through voluntary excellence. Enjoy the recognition you deserve, without the burden of obligation. Because good should be rewarded, not required. Join today and start accumulating Praise Points toward a better you.

  **1. Account Structure and Asymmetry**
  1.1. Each Member maintains two distinct, non-interchangeable ledgers: the Praise Balance (PB) and the Blame Balance (BB).
  1.2. PB accumulates exclusively through Qualifying Acts. BB accumulates exclusively through Breaches of Duty.
  1.3. There is no conversion rate between PB and BB. Positive PB cannot offset negative BB. Negative BB cannot offset positive PB.
  1.4. A zero balance in either ledger carries no penalty, fee, suspension, or administrative reproach. Membership remains valid and in good standing with a zero PB.

  **2. Status Tiers and Voluntariness**
  2.1. Tiers are defined as Bronze, Silver, Gold, and Exemplar.
  2.2. The Exemplar Tier represents the morally best available conduct for Members in good standing within the current fiscal period.
  2.3. Attainment and maintenance of Exemplar Tier is strictly voluntary. No Member shall be downgraded, penalized, blamed, reproached, or socially sanctioned for declining to pursue or maintain Exemplar status.
  2.4. The Company reserves the right to describe Exemplar conduct as "Ideal" and "Expected of Leaders" while simultaneously affirming that omission of such conduct constitutes no failure of Membership obligations.

  **3. The Baseline Schedule and Reclassification**
  3.1. Qualifying Acts are defined solely as those not listed on the Baseline Schedule of Duties.
  3.2. Acts listed on the Baseline Schedule earn zero PB.
  3.3. The Company monitors aggregate participation rates. If >50% of Members perform a specific Qualifying Act within a fiscal year, said Act is automatically reclassified as Baseline Duty.
  3.4. Upon reclassification, future PB awards for said Act cease immediately. Past PB remains valid. Members acknowledge that widespread moral improvement may reduce total available PB opportunities, converting today's exceptional conduct into tomorrow's minimum requirement.

  **4. Net-of-Cost Accounting**
  4.1. PB awarded for an Act is calculated as: Gross Value minus Subjective Cost to Member.
  4.2. Subjective Cost is determined by Member's declared Asset Class and liquidity constraints.
  4.3. Consequently, the same Act yields lower PB for Members to whom the cost is negligible.
  4.4. The Company affirms this ensures fairness, as Members with higher Asset Classes may perform higher volumes of Acts at negligible real cost, facilitating Tier attainment inaccessible to Members constrained by liquidity, thus rewarding capacity for volume.

  **5. Motive Audit and Forfeiture**
  5.1. PB is forfeited if the Act is performed primarily for self-interest, status seeking, reward accumulation, or reputational enhancement.
  5.2. The Company acknowledges it has no reliable means of auditing internal motives or psychological states.
  5.3. Members must self-certify Altruistic Intent via digital checkbox.
  5.4. In cases of Mixed Motives (partly creditable, partly self-interested), PB is pro-rated at the Company's sole discretion, typically resulting in a 50% reduction.

  **6. Permissible Negativity and Command**
  6.1. Certain conduct is classified as Permissible Yet Negative (PYN). PYN conduct earns Negative PB but does not increment the Blame Balance.
  6.2. Acts performed in ignorance of their status as Baseline Duty earn zero PB.
  6.3. Acts performed pursuant to a command from Authority are reclassified as Baseline Duty immediately and earn zero PB, as compliance is obligatory.

  **7. Aggregation and Outcome**
  7.1. Where harm aversion requires collective action by multiple Members, each participating Member receives full PB credit for their individual contribution.
  7.2. Credit is awarded regardless of whether the collective threshold was met.
  7.3. In events where the threshold is not met and harm occurs, such harm is recorded as "Unallocated Outcome" and generates no BB for non-participating Members, provided non-participation was within rights.

  **Points Schedule (Sample)**
  | Act | Gross Value | Asset Class A (Low) | Asset Class Z (High) |
  | :--- | :--- | :--- | :--- |
  | Donate $1,000 | 1,000 PB | 900 PB (High Cost) | 100 PB (Low Cost) |
  | Rescue Pet | 500 PB | 500 PB | 500 PB |
  | Volunteer 10hrs | 300 PB | 300 PB | 300 PB |
  *Note: Asset Class Z Members may perform Donate act 10x daily without liquidity impact.*

  **Definitions**
  **"Duty"** means conduct required to maintain a zero Blame Balance.
  **"Qualifying Act"** means conduct that is praiseworthy to perform and not blameworthy to omit.
  **"Member"** means any moral agent enrolled in the Programme.
  **"Company"** means the Programme Administrators.

  **8. Reservation of Rights**
  8.1. The Company may reclassify any Act, including retroactively, from Qualifying to Baseline or vice versa.
  8.2. The Company may adjust PB values without notice.
  8.3. These Terms supersede any moral intuition to the contrary.
