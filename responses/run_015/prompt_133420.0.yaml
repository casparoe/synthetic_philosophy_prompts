answer: |-
  ### I. Disciplined Mapping

  Here is the Argentine sequence mapped onto the bilateral-commitment model.

  **1. The Self-Amnesty (Law 22.924, September 1983)**
  *   **Promisor:** The Incoming Democratic Government (anticipated).
  *   **Promisee:** The Military Junta.
  *   **Consideration:** Handover of power.
  *   **Third Parties:** Victims / Civil Society.
  *   **Breach:** Prosecution (which occurred immediately upon Alfonsín's inauguration).
  *   **Status:** **Model Failure.** There was no second party to the promise. The Junta acted unilaterally. The incoming government never accepted the consideration; it treated the law as null *ab initio*. This was not a bargain; it was a failed unilateral shield.

  **2. The Full Stop & Due Obedience Laws (1986–1987)**
  *   **Promisor:** The Alfonsín Administration / Congress.
  *   **Promisee:** The Rebel Military Factions (*Carapintadas*).
  *   **Consideration:** Forbearance from renewed coup / cessation of uprisings (Easter Week 1987). *Note: Not handover, as power had already changed hands in 1983.*
  *   **Third Parties:** Victims (whose claims were statutorily barred).
  *   **Breach:** Reopening of cases (2003 Annulment / 2005 Supreme Court Ruling).
  *   **Status:** **Model Fit.** This fits the commitment structure: the state traded justice for stability against an active coercive threat.

  **3. The Menem Pardons (1989–1990)**
  *   **Promisor:** The Executive (Menem).
  *   **Promisee:** Convicted Junta Members & Guerrilla Commanders.
  *   **Consideration:** "National Reconciliation" (termination of ongoing political polarization and military discontent).
  *   **Third Parties:** Victims.
  *   **Breach:** Judicial nullification of pardons (2000s) and subsequent imprisonment.
  *   **Status:** **Partial Fit.** Bilateral in form (Executive to Convicts), but the consideration was diffuse ("peace") rather than a specific transfer of power or cessation of specific violence.

  ### II. What the Model Explains Well

  1.  **The Latency of Impunity:** The model explains why the effective amnesties (1986–87) did not occur at the transition (1983). In the bilateral-commitment logic, amnesty is purchased only when the threat is credible. In 1983, the military was defeated and discredited (Falklands); they had no leverage. By 1987, the *Carapintadas* demonstrated renewed coercive capacity. The model correctly predicts amnesty follows the resurgence of threat, not necessarily the handover itself.
  2.  **Punishment Preceding Impunity:** The model accommodates the sequence where trials occur *before* amnesty. If the goal is finality, the incoming government may attempt punishment first. When punishment triggers a commitment failure (coups), amnesty is purchased to restore the equilibrium. The 1985 Trial of the Juntas was an attempt to secure finality through law; when that failed to pacify the military, the 1986–87 laws purchased finality through bargain.
  3.  **Symmetry:** The Menem pardons covered both the Juntas and the Guerrilla commanders. The bilateral model predicts this symmetry even when the moral record is asymmetric. To secure a bargain that ends the "contest over the past," the promisee (the military) requires a deal that appears neutral enough to be politically defensible, or one that neutralizes the opposing armed faction (Montoneros/ERP) to remove the military's justification for intervention.

  ### III. Where the Model Misdescribes

  1.  **The Nature of the Transition:** The model assumes a pact. Argentina 1983 was a collapse. The military did not negotiate terms; they surrendered. The self-amnesty was a desperate unilateral act, not a term of handover. The model cannot account for transitions where one side lacks the leverage to demand a bargain at *t=0*.
  2.  **The Status of Victims:** The model defines victims as "subject matter." In Argentina, victims became litigants. The *Abuelas de Plaza de Mayo* and *HIJOS* were not passive objects of the bargain; they sustained the pressure that eventually broke it. The model treats the third party as static, whereas in Argentina, the third party was the engine of the model's eventual collapse.
  3.  **The Self-Amnesty:** As noted in the mapping, the model requires a promisor and promisee. The 1983 self-amnesty had no promisee. It treats the law as a contract when it was a fiat.

  ### IV. Testing the Revisions

  Here I test your three revisions against the Argentine sequence and the contrasting South African case (TRC/conditional immunity at transfer).

  **1. The Duress Revision**
  *   *Theory:* Concessions extracted under threat are voidable.
  *   *Argentina:* Fits perfectly. The 1987 laws were passed days after the Easter Rebellion. The 2005 Supreme Court ruling explicitly cited the "coercive context" of the *Carapintadas* uprisings as grounds for unconstitutionality.
  *   *South Africa:* Fits poorly. The TRC was a negotiated settlement (CODESA). While violence was ongoing, it was a mutual hostage situation rather than one side holding a gun to the legislature's head. Applying duress here risks invalidating the foundational bargain of the new democracy.
  *   *Prediction:* Amnesties granted during active insurrection will be reversed; amnesties granted during negotiated settlements will hold.
  *   *Post-2003 Check:* Argentine courts did cite coercion. However, they also cited international law. Duress alone does not explain why the pardons held for 15 years before being voided.

  **2. The Intertemporal Revision**
  *   *Theory:* A polity cannot bind its successor; amnesty cannot deliver finality.
  *   *Argentina:* Explains the 2003 annulment. A 1986 Congress cannot bind a 2003 Congress.
  *   *South Africa:* The TRC process was embedded in the Constitution (a higher binding constraint). Yet, political will shifted regardless.
  *   *Prediction:* All amnesties are inherently temporary. Beneficiaries should know this and value them less.
  *   *Post-2003 Check:* If beneficiaries knew this, why did the military accept the 1987 laws? They likely discounted the future heavily (survival now vs. risk later). This revision explains the *reopening*, but not the *acceptance*.

  **3. The Moratorium Revision**
  *   *Theory:* Amnesty is a purchase of time. Finality is not the goal; delay is. Reopening is not breach, but expiry.
  *   *Argentina:* Best fit. The military bought 20 years of safety. By 2005, the officers were elderly, the political cost of defense was high, and the balance of forces had shifted. The "term" expired when the military lost political capacity.
  *   *South Africa:* The TRC bought time for the 1994 election and the consolidation of the ANC state. Once the state was secure (late 90s/early 00s), the need for the moratorium faded, though the TRC findings remain.
  *   *Prediction:* Amnesties last as long as the beneficiaries retain coercive leverage. When leverage fades, prosecutions resume without normative crisis.
  *   *Post-2003 Check:* This aligns with the empirical reality. The prosecutions resumed not because the law magically changed, but because the *Carapintadas* were politically dead.

  **Verdict on Revisions:**
  The **Moratorium Revision** is the least *ad hoc*. It does not require a normative legal doctrine (Duress) that might destabilize other transitions, nor a structural impossibility (Intertemporal) that makes the initial bargain irrational. It treats amnesty as a lease on impunity rather than a title deed. It predicts the Argentine sequence: the lease expired when the tenant (the military) lost the power to enforce it.

  **The Duress *Reductio*:**
  You ask if the Duress revision invalidates nearly every amnesty ever granted. **Yes.** The commitment problem *is* a threat. If the threat is sufficient to necessitate the amnesty, it is almost by definition sufficient to constitute duress in a legal sense. If we accept the Duress revision, we must accept that almost all transitional amnesties are legally voidable.
  *   **Is this a *reductio*?** Yes. It renders the mechanism self-canceling. If the only way to solve the commitment problem is voidable, the problem is unsolvable by law.
  *   **Conclusion:** We should not accept it as a general doctrine. It is useful descriptively (explaining why Argentina annulled the laws) but dangerous normatively (it suggests no transition bargain is secure).

  ### V. The Silence

  The model is silent on the **expressive and evidentiary work** of the 1990s.

  1.  **Truth Trials (*Juicios por la Verdad*):** In the late 90s, courts allowed proceedings where the object was establishing facts, not assigning criminal liability (since amnesty blocked punishment). The bilateral-commitment model has no vocabulary for this. The bargain was supposed to secure "finality" (an end to the contest). These trials *continued* the contest without imposing penalties. They were neither punishment nor amnesty.
  2.  **Escraches:** Public shaming campaigns by *HIJOS* operated outside the law. The model accounts for state actors (Promisor/Promisee). It cannot account for social movements enforcing censure when the state bargain forbids it.
  3.  **The Function of the Gap:** You ask whether a model with this gap can be the right account. **No.**
      *   If the purpose of transitional justice were solely the management of coercive power (the ceasefire), your model suffices.
      *   But if the purpose includes the construction of a historical record or the restoration of civic trust, the model fails. It treats the "contest over the past" as something to be *ended*. In Argentina, the contest was *transformed*. The amnesty stopped the prisons from filling, but it did not stop the narrative from being written.
      *   The model explains the **ceasefire**, but it cannot explain the **history**. Since the Argentine case shows that the history (Nunca Más, truth trials) persisted despite the ceasefire, a model that ignores this is incomplete. It explains the *power* transition, but not the *justice* transition.

  **Final Verdict:** The bilateral-commitment model accurately describes the *mechanics* of the Argentine amnesties (specifically 1986–90) as purchases of stability under threat. However, it fails to predict the *durability* of those amnesties (hence the Moratorium revision is superior to the static model) and fails to account for the non-punitive justice mechanisms that kept the "contest over the past" alive during the period of impunity. It is a model of power, not of law or memory.
