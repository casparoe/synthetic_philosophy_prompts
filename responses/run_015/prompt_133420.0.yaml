      *   *Moment 2: Full Stop & Due Obedience (1986-1987).*
          *   Promisor: Alfonsín/Congress.
          *   Promisee: Military (rebelling).
          *   Consideration: Cessation of uprisings (forbearance from coup), *not* handover (already happened).
          *   Third Parties: Victims.
          *   Breach: Reopening cases (which happened in 2003/05).
      *   *Moment 3: Menem Pardons (1989-1990).*
