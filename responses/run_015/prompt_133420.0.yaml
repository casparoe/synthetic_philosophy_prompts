      *   *Threat-Driven:* Emerged under specific military rebellions (Carapintadas).
      *   *Punishment Preceded:* Trials happened *before* amnesty. Model usually assumes amnesty *instead* of trials, but if the goal is "finality," maybe punishment was tried, failed to secure finality, so amnesty was bought.
      *   *Symmetry:* Menem pardoned both sides (Military & Montoneros). Fits the "bilateral bargain" logic (neutralizing the conflict) even if moral asymmetry exists.

  5.  **Step 3: Where it Misdescribes:**
      *   *1983 Collapse:* No bargain occurred at the transition. The model assumes a handover bargain; Argentina had a collapse.
      *   *Victims:* They are treated as subject matter, but in Argentina, they became active litigants (truth trials, escraches). The model renders them passive.
      *   *Self-Amnesty:* No promisor/promisee dynamic. It was a unilateral shield that was immediately discarded.

  6.  **Step 4: Testing the Three Revisions:**
      *   *Revision 1: Duress (Voidable if under threat).*
          *   *Argentina:* Fits 1986/87 perfectly (guns in the room). Explains why 2003 annulment felt legitimate (removing coerced consent).
          *   *South Africa:* TRC was negotiated (CODESA). Less clear duress, more mutual hostage-taking. Duress doctrine might invalidate SA too if "threat of continued violence" counts.
          *   *Prediction:* Amnesties granted during active instability will be reversed when stability returns.
      *   *Revision 2: Intertemporal Constraint (Cannot bind successors).*
          *   *Argentina:* Explains why 1986 laws didn't stop 2003 Congress. But if beneficiaries *know* this, why accept the deal? They accepted it because it bought *time* (see Revision 3).
          *   *South Africa:* NC clause in Constitution tried to bind successors. Still, political will shifted.
          *   *Prediction:* All amnesties are inherently temporary.
      *   *Revision 3: Moratorium (Purchase of time).*
          *   *Argentina:* Fits best. Military bought 20 years of safety. By the time laws fell, they were too old or the political cost of defense was too high.
          *   *South Africa:* TRC bought immediate stability for the 1994 election.
          *   *Prediction:* Amnesties decay as power balances shift. Reopening is not breach, but expiry.
      *   *Comparison:* Moratorium is least ad hoc because it accepts the empirical reality of the 20-year gap without needing a normative legal doctrine (Duress) or a structural impossibility (Intertemporal).
      *   *Post-2003 Check:* The Moratorium model predicts reopening when the military loses political capacity. This happened. The Duress model predicts reopening because the law was "void." This also happened (Supreme Court cited coercion).

  7.  **Step 5: The Duress *Reductio*:**
      *   If duress invalidates amnesty, does it invalidate *all* amnesty?
      *   Most transitions involve some threat of violence (the "commitment problem" itself implies a threat).
      *   *Verdict:* It is a *reductio*. If the threat necessary to trigger the amnesty also voids it, the mechanism is self-canceling. We must accept that some coercion is constitutive of the transition, not an vitiating factor.

  8.  **Step 6: The Silence (Expressive/Evidentiary):**
      *   The model focuses on *coercion* and *finality*.
      *   It cannot account for "Truth Trials" (Juicios por la Verdad) where no punishment was sought, only facts.
      *   It cannot account for *Escraches* (public shaming).
      *   *Verdict:* A model that ignores the *meaning-making* aspect of transitional justice is incomplete. It explains the *ceasefire*, but not the *history*. If the purpose of TJ is also truth/memory, the bilateral-commitment model is insufficient.

  9.  **Drafting the Response:**
