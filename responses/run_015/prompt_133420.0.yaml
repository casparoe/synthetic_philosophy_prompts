      *   **Goal:** Finality (end to contest over the past).
      *   **Key Constraint:** Incoming gov cannot bind successors; amnesty is the price for transfer.

  3.  **Step 1: Disciplined Mapping (The Argentine Sequence):**
      *   *Moment 1: Junta Self-Amnesty (Law 22.924, Sept 1983).*
          *   Promisor: Incoming Democracy (anticipated)? No, it's unilateral.
          *   Promisee: Military.
          *   Consideration: Handover? (Stipulated by user: collapse, not pact).
