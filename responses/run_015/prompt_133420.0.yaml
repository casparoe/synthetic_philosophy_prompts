      *   **Task:** Run the Argentine sequence (1976-2013) through this model to test its validity.
      *   **Constraints:** Do *not* survey transitional justice literature. Stick to the user's defined model and facts. Provide a mapping, a verdict, test three specific revisions against Argentina and South Africa, evaluate the "duress" implication, and identify silences regarding expressive/evidentiary work.
