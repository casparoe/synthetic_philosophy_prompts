      *   *Check:* Is the distinction between 'verdict', 'procedure', and 'design' norms utilised? Yes, integrate this into the diagnosis.
      *   *Refinement on Q1:* Make sure to highlight that 'compliance' without 'computation' implies the norm is about the *state of the world* (outcome) not the *state of the mind* (process). The Feasibility Camp denies this is what 'rationality' means for agents.
      *   *Refinement on Q2:* Emphasise the "New Riddle of Induction" aspect. How do we know the heuristic will track tomorrow?
