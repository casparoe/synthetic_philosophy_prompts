answer: |-
  This is an exceptionally well-posed impasse. It is rare to find a reading group that has distilled the tension between ideal theory and bounded agency so precisely, and your hypothesis that multiple questions are being run together under the single label 'rationality' is almost certainly correct. However, the persistence of the argument suggests that merely labelling the questions will not dissolve the dispute, because the camps disagree on which of those questions deserves the honorific 'rationality' in the first place.

  Here is a diagnosis of the stalemate, addressing your three specific questions.

  ### 1. The Computing/Complying Distinction

  You ask whether the distinction between the hardness of *computing* a verdict and the hardness of *complying* with it does the work you intend, or whether it begs the question. The short answer is that it largely begs the question against the feasibility camp, though it does so in a philosophically illuminating way.

  The distinction presupposes an **extensional** conception of the norm: that the norm is defined entirely by the mapping from inputs to correct outputs (the verdict), irrespective of the internal state or procedure of the agent. On this view, if an agent's output matches the ideal verdict, they have complied, regardless of whether they calculated it via Bayesian updating or a gut heuristic. This is the natural home of the correctness camp.

  The feasibility camp, however, operates with an **intensional** or **procedural** conception of the norm. For them, 'rationality' is not merely a property of the relation between an agent and the world; it is a property of the agent's deliberative machinery. If 'ought' implies 'can', and 'can' implies 'feasible computation', then a norm that cannot be computed is not a norm that exists for the agent. To tell a feasibility proponent that one can 'comply without computing' is to tell them that the norm is about the *outcome* rather than the *reasoning*. They will reply that you have changed the subject from 'rationality' (a virtue of the thinker) to 'accuracy' (a virtue of the belief).

  Therefore, the computing/complying distinction does not bridge the gap; it marks the boundary. It is useful only insofar as it forces the correctness camp to admit that they are defending an externalist standard of assessment, while the feasibility camp is defending an internalist standard of guidance. The distinction does not resolve the conflict because the conflict is precisely about whether rationality is a standard of assessment or a guide to action. If you utilise this distinction, you must be prepared to argue that 'rationality' is ambiguous between 'being in a correct state' and 'arriving at a state via correct processes'. Until that ambiguity is explicitly ratified by both sides, the distinction will feel to the feasibility camp like a sleight of hand that defines away their objection.

  ### 2. The Failure of the Tracking Defence

  The tracking defence—that an agent may satisfy the ideal norm via a cheap surrogate that happens to agree with the ideal on actual instances—is indeed unstable, but not primarily for the reason you suspect. You worry that verifying the tracking is intractable. While true, this is an epistemic problem for the *theorist*, not necessarily a metaphysical problem for the *agent*. The deeper failure is modal and attributive.

  The tracking defence relies on a contingent empirical claim: that the distribution of problems the agent actually faces is a 'easy' subset of the logical space. This makes the agent's rationality dependent on the benevolence of their environment. If the heuristic tracks the ideal only because the world is kind, then the agent is not rational; they are merely lucky.

  Consider the modal robustness required for normativity. If we say an agent is rational, we usually imply they would continue to be so under slight counterfactual variations of their situation. The tracking defence struggles here. If the environment shifts slightly such that the cheap surrogate diverges from the ideal, does the agent suddenly become irrational? If the answer is 'yes', then rationality is not a property of the agent's constitution, but of the agent-environment fit. If the answer is 'no', then the ideal norm was not actually the standard being applied; the standard was 'use the heuristic'.

  Consequently, the tracking defence fails on the **attribution of competence**. It cannot distinguish between an agent who understands the ideal and is reliably right, and an agent who is blindly following a rule that works for now. To save the defence, one would need a principled account of the 'ecological validity' of the surrogate—essentially, a theory of why the world is structured such that the hard problems do not arise. Without this, the tracking defence collapses into a claim that the ideal norm is irrelevant, and the real norm is 'do what works'. But 'do what works' is exactly the feasibility position, just disguised. The correctness camp wants the ideal to remain the standard of correctness even when the heuristic fails; the tracking defence undermines this by making the ideal's authority contingent on the heuristic's success.

  ### 3. Diagnosis and Prospects for Progress

  **The Diagnosis**
  This is not a merely verbal dispute, nor is it ill-posed. It is a **hybrid stalemate** consisting of a bedrock conceptual clash overlaid upon a hidden empirical vacuum.

  1.  **Conceptual:** The bedrock clash is between **normativity as guidance** (feasibility) and **normativity as evaluation** (correctness). These are genuinely competing functions. A standard that cannot guide cannot fulfil the first function; a standard that is lowered to match capacity cannot fulfil the second. Both sides are correct about the function they prioritise, and they are talking past each other because they assume their function is the primary one for the term 'rationality'.
  2.  **Empirical:** The hidden disagreement concerns the **structure of the instance space**. The feasibility camp assumes worst-case scenarios are relevant because they define the bounds of the system. The correctness camp (via the tracking defence) assumes worst-case scenarios are irrelevant because they are ecologically rare. The third faction (asymptotic vs. finite) is attempting to point at this empirical gap but is doing so via a technical objection that misses the philosophical point: finite problems can still be intractably large.

  **What Counts as Progress?**
  You should not expect a theoretical proof that resolves the normative clash, because it is not a logical contradiction; it is a divergence in theoretical aims. However, you can expect progress by shifting the terrain from abstract complexity to **ecological complexity**.

  *   **Conceptual Progress:** The group should explicitly adopt your tripartite distinction (verdict, procedure, design) but go further. They should agree to use different vocabulary. Let 'Ideal Rationality' denote the verdict-norm (correctness camp) and 'Bounded Rationality' denote the procedure-norm (feasibility camp). The dispute then shifts to: 'When we blame someone for being irrational, which concept are we invoking?' This dissolves the verbal friction.
  *   **Formal Progress:** The most fruitful technical avenue is not average-case complexity in the abstract, but **smoothed complexity** or **parameterised complexity** relative to specific environmental constraints. If the group can model the 'actual instances' not as arbitrary inputs but as outputs of a specific generative process (e.g., the structure of the physical world, or social interaction), they can determine if the 'hard' cases are indeed measure zero. This moves the debate from 'is it computable?' to 'is it computable *given the world we actually inhabit*?'
  *   **Empirical Progress:** The tracking defence requires an empirical programme. It demands evidence that human heuristics do, in fact, track the ideal on the distribution of problems humans face. Without this, the correctness camp is positing a 'pre-established harmony' between human cognition and normative truth that looks suspiciously like magic.

  **Should you expect progress?**
  Yes, but not of the sort that declares a winner. The persistence of the argument is evidence that the question is doing work: it is forcing a negotiation between our ideals and our capacities. The progress lies in recognising that 'rationality' is a cluster concept. In contexts of institutional design and AI safety, the feasibility camp wins (you cannot build what cannot be computed). In contexts of logical consistency and semantic evaluation, the correctness camp wins (truth is not relative to processing speed).

  The stalemate will only break when the group stops asking 'Which theory is true?' and starts asking 'For what purpose is this theory being deployed?' If the purpose is to critique an agent's reasoning process, feasibility constraints are internal to the norm. If the purpose is to evaluate the accuracy of a belief state, they are external. Until the purpose is specified, the word 'rationality' will continue to oscillate between these two poles, and the argument will recur in recognisably the same shape.
