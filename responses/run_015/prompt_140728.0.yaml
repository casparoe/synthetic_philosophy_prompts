          *   *Correctness Camp:* Standards of correctness are independent of capacity. Intractability affects excuse/implementation, not truth. One can comply without computing (tracking defence).
          *   *Third Faction:* Ill-posed because complexity is asymptotic, agents are finite.
      *   **User's Hypothesis:** Three distinct questions (verdict, procedure, design norms) + distinction between computing vs. complying. Worry about the instability of the "tracking defence" (verifying tracking is hard/empirical).
      *   **Task:** Provide a *diagnosis* of the stalemate (not a verdict, not a survey, no reading list/citations). Use British English.
      *   **Specific Questions to Answer:**
          1.  Does the computing/complying distinction do the work intended, or does it beg the question?
          2.  Where exactly does the tracking defence fail?
          3.  What would count as progress (and is progress expected)?

  2.  **Deconstruct the Stalemate:**
      *   The core tension is between *ideal theory* (what is right) and *non-ideal theory* (what agents can do).
      *   The Feasibility Camp treats rationality as essentially *action-guiding*. If it can't guide, it's not a norm for us.
      *   The Correctness Camp treats rationality as essentially *evaluative*. It's a standard against which performance is measured, regardless of ability to hit it.
      *   The User's "computing/complying" distinction attempts to bridge this by saying you can hit the standard without calculating it.
      *   The "Third Faction" (asymptotic vs. finite) is a category error objection, but often a deflection.

  3.  **Address Question 1: The Computing/Complying Distinction:**
      *   *User's hope:* It separates the standard from the method, allowing the Correctness Camp to keep the standard while acknowledging computational limits.
      *   *Risk:* It assumes the norm is defined by the *output* (extensionality) rather than the *process* (intensionality).
      *   *Diagnosis:* It likely *does* beg the question against the Feasibility Camp. The Feasibility Camp argues that for beings like us, the norm *just is* a procedure. If the norm is "maximise expected utility," and you can't compute it, the Feasibility Camp says "That's not the norm for you." The Correctness Camp says "That is the norm, you just failed."
      *   *Nuance:* The distinction works only if one accepts an externalist view of rationality (outcome-based). If rationality is internalist (reasoning-based), computing *is* complying. So the distinction presupposes the Correctness Camp's metaphysics of norms.

  4.  **Address Question 2: The Tracking Defence Failure:**
      *   *The Defence:* I don't need to compute the ideal; I just need a heuristic that matches it on actual cases.
      *   *User's Worry:* Verifying the match is hard.
      *   *Diagnosis:* The failure isn't just epistemic (we can't verify it); it's *modal*. The tracking defence relies on a contingent fact about the world (the distribution of problems we face is easy/subset of hard problems).
      *   *The Pivot:* The Correctness Camp needs to claim the agent is rational *even if* the environment changes. If the heuristic fails in a slightly different environment, was the agent irrational before?
      *   *Core Failure:* It shifts the locus of normativity from the agent's mind to the environment's structure. It makes rationality luck-dependent. If the heuristic works only because the world is kind, is the agent rational, or just lucky? The Feasibility Camp pounces here: if you rely on the world being kind, your norm is "fit the world," not "maximise utility."
      *   *Empirical Gap:* Nobody knows the distribution of "real instances." This makes the tracking defence empirically hollow without a specific ecological theory.

  5.  **Address Question 3: Progress and Diagnosis of the Stalemate:**
      *   *Type of Stalemate:* It's not merely verbal. It's a "bedrock clash" about the function of normativity (guidance vs. evaluation) *combined* with a hidden empirical disagreement (structure of the environment).
      *   *Is it ill-posed?* The asymptotic objection (Third Faction) is weak. Finite but large numbers behave asymptotically. However, the *application* of worst-case to specific human contexts is often loose.
      *   *What counts as progress?*
          *   *Conceptual:* Explicitly separating Evaluative Norms (ideal) from Deliberative Norms (action-guiding). Acknowledging they might come apart.
          *   *Formal:* Average-case analysis or smoothed complexity *relative to a specified distribution*. Not just "average case" in the abstract, but "average case for *this* ecology."
          *   *Empirical:* Psych/behavioural data on what heuristics humans actually use and where they fail.
      *   *Expectation:* Don't expect a "solution" that satisfies both camps completely, because they want different things from the word 'rationality'. Expect progress in dissolving the confusion by assigning different terms to the different concepts.

  6.  **Drafting the Response (incorporating British English and Tone):**
      *   *Tone:* Academic, precise, sympathetic but critical, avoiding colloquialisms. Use British spelling (normative, formalise, programme, defence, etc.).
      *   *Structure:*
          *   Introduction: Acknowledge the sophistication of the setup.
          *   Diagnosis of the Stalemate: It's a category clash + empirical void.
          *   Q1 (Computing/Complying): It begs the question (extensional vs. intensional).
