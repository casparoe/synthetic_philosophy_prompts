  # Joint Statement on the Topography of Liberty

  **Issued by the Negative-Liberty and Republican-Liberty Working Group**

  Following a period of adversarial collaboration, the undersigned theorists issue this joint statement to map the structural convergences and divergences between the negative-liberty tradition (freedom as non-interference) and the republican-liberty tradition (freedom as non-domination). We acknowledge that while our normative commitments often overlap, our conceptual analyses of liberty differ in ways that yield distinct diagnostic judgments about political institutions. This document records our points of consensus regarding the architecture of the debate and specifies the precise locus of our remaining disagreements through shared test cases.

  ### I. Points of Conceptual Convergence

  1.  **The Social Nature of Liberty:** Both parties agree that political liberty is not a metaphysical property of the will, but a social status determined by the relationship between an agent and other agents (including the state). Liberty is contingent upon the distribution of power and the constraints placed upon it.
  2.  **Interference and Domination:** Both parties agree that *interference* consists in the actual obstruction or coercion of an agent's choices, whereas *domination* consists in the structural capacity of one agent to interfere in the choices of another. We agree these are distinct phenomena: one is an event, the other is a condition of dependency.
  3.  **The Paradigm of Slavery:** Both parties agree that the master-slave relation represents a paradigmatic instance of unfreedom. We agree that the master holds arbitrary power over the slave and that the slave lacks a secure status against the master's will.
  4.  **The Definition of Arbitrariness:** Both parties agree that power is *arbitrary* when it is exercised (or exercisable) at the discretion of the power-holder without being constrained by rules, norms, or procedures that track the interests and voice of the affected party. We agree that arbitrariness is a distinct moral and political evil, regardless of our disagreement on whether it constitutes unfreedom *per se*.
  5.  **The Value of Law:** Both parties agree that the rule of law is generally conducive to liberty. We agree that laws which constrain the discretionary power of officials reduce the likelihood of interference and enhance the security of agents, even if we disagree on whether such laws constitute freedom itself or merely protect it.

  ### II. Points of Residual Disagreement and Diagnostic Tests

  | Crux of Disagreement | Negative-Liberty Formulation of the Disagreement | Republican-Liberty Formulation of the Disagreement | Concrete Test Scenario | Predictions on Liberty Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Status of Unexercised Power**<br>*(Does capacity alone diminish freedom?)* | "Freedom is compromised **only when** an external agent actually interferes with, or credibly threatens to interfere with, my choices. A mere capacity for interference, if known to be benign or unexercised, leaves my freedom intact." | "Freedom is compromised **whenever** an external agent retains the arbitrary capacity to interfere with my choices, regardless of whether they exercise it. Dependency on another's will is itself a loss of freedom." | **The Benevolent Master:**<br>A slave owner possesses full legal authority to punish or restrain their slave at whim. However, the owner is personally benevolent, never interferes with the slave's movements, and has a verified history of allowing the slave to act without constraint. | **Negative-Liberty:** The slave is **free** (to the extent that no interference occurs).<br><br>**Republican-Liberty:** The slave is **unfree** (because they remain subject to arbitrary power). |
  | **2. The Sufficiency of Safeguards vs. Legal Basis**<br>*(Does practical security eliminate domination if legal arbitrariness remains?)* | "Freedom is secured **when** interference is practically impossible due to institutional safeguards, costs, or norms. The existence of a theoretical legal right to interfere is irrelevant if the probability of actual interference is negligible." | "Freedom is secured **only when** the legal basis for arbitrary interference is removed. Practical safeguards are insufficient if the authority to interfere arbitrarily remains legally intact, as the status of the citizen remains insecure." | **The Revocable Right:**<br>Citizens hold a formal right to practice a religion. However, an unaccountable state office retains the unreviewable legal authority to revoke this right without justification or appeal. The office has never exercised this authority, and political culture makes it highly unlikely they will. | **Negative-Liberty:** The citizens are **free** (because the right is currently enjoyed and not interfered with).<br><br>**Republican-Liberty:** The citizens are **unfree** (because their enjoyment of the right depends on the discretion of an unaccountable power). |
