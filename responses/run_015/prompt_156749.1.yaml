answer: |-
  **Project Title:** The Broadcasting Gap: Decoupling Access and Phenomenality in Global Workspace Theory
  **Duration:** 6 Months
  **Format:** Intensive Conceptual Workshop Series (Remote/Hybrid)
  **Principal Investigator:** [Your Name]

  ### 1. Executive Summary
  Global Workspace Theory (GWT) is the leading functionalist account of how the brain processes information. It claims to explain *Access Consciousness* (information available for reporting and reasoning) via a mechanism of "global broadcasting." However, there is a persistent suspicion that GWT proponents smuggle in *Phenomenal Consciousness* (what it feels like to have that information) by assuming that broadcasted information automatically comes "tagged" to a subjective point of view.

  This 6-month workshop aims to rigorously test this suspicion. We will attempt to conceptually separate the mechanism of broadcasting from the mechanism of phenomenal tagging. Our goal is not to solve the Hard Problem of consciousness, but to clarify the architectural claims of GWT. We ask: **Can we model an architecture where information is globally available to all modules but lacks any mechanism binding it phenomenally to a subject?**

  If we can, GWT stands as a valid theory of Access alone. If we cannot, it suggests GWT has never truly distinguished Access from Phenomenality. This project moves beyond abstract intuition-pumping by constructing a functional case study to stress-test the theory.

  ### 2. The Problem: The Packaged Deal
  Current debates in consciousness studies (specifically between proponents of GWT and proponents of Phenomenal Distinction) often talk past one another.
  *   **Side A (GWT/Dehaene style):** Argues that broadcasting *is* the key to consciousness. When info is global, we can report it, and it feels like something.
  *   **Side B (Block style):** Argues that you can have access without phenomenality (or vice versa).

  The friction arises because both sides often treat "broadcasting" and "subjective binding" as a packaged deal. They assume that if a signal reaches the global workspace, it necessarily arrives "for someone." This proposal identifies a hidden move: **Phenomenal Tagging.** We suspect that standard GWT models implicitly assume that global availability includes a "point of view" tag without explaining how that tag is generated or attached.

  This workshop addresses the gap. We are not asking if GWT is true empirically; we are asking if the *conceptual architecture* holds together when we try to pull the two threads apart.

  ### 3. Methodology: Conceptual Engineering + Artificial Case Study
  This is not an empirical neuroscience project. We will not be scanning brains or running behavioral trials. Nor is this a traditional seminar where participants read papers and discuss them. This is a **working group focused on construction.**

  **Phase 1: Conceptual Isolation (Months 1-2)**
  We will define the terms of engagement. We need a strict operational definition of "Broadcasting" (information availability) that explicitly excludes "Tagging" (subjective binding). We will map the standard GWT arguments to identify exactly where the "tag" is usually slipped in.

  **Phase 2: The Artificial System Case Study (Months 3-4)**
  This is the core deliverable. We will design a functional architecture of a hypothetical cognitive system.
  *   **The Constraint:** The system must have modules that can send and receive global signals (Access).
  *   **The Challenge:** We must design it so that there is *no* component or process that could plausibly be interpreted as a "subject" or "point of view" receiving that data.
  *   **The Test:** Does this system still count as having Access Consciousness? Or does the lack of a "subject" mean the information isn't truly "accessible" in the way humans mean it?

  **Phase 3: Stress Testing & Reporting (Months 5-6)**
  We will invite external critics to attack the model. If they can show that our "Access without Tagging" model secretly relies on a hidden subject, the project validates the critique that GWT conflates the two. If the model holds, we have successfully carved nature at a joint that previous debates missed.

  ### 4. Why This Approach?
  Why not just do more neuroscience or pure philosophy?

  *   **Vs. Neuroscience:** Empirical data cannot settle this specific question. You can scan a brain and see broadcasting, but the scan cannot tell you if that broadcasting is accompanied by phenomenality or if the "subject" is an illusion. Neuroscience tells us *what* happens; it doesn't clarify the *conceptual categories* we use to describe it.
  *   **Vs. Pure Intuition-Pumping:** Traditional philosophy often relies on "zombie" thought experiments. These are too vague. By building a structured artificial case study (even if only on paper), we force the logic to be explicit. You can't hide a "smuggled tag" in a functional diagram as easily as you can in a paragraph of prose.

  This approach treats the theory like software architecture. We are checking if the code compiles without the "phenomenal" library.

  ### 5. Deliverables and Outcomes
  **Success Looks Like:**
  1.  **A Functional Diagram:** A publicly available schematic of the "Broadcast-without-Tag" architecture.
  2.  **A Position Paper:** A concise document (approx. 10-15 pages) stating clearly whether GWT explains Access independently of Phenomenality based on the model's performance.
  3.  **Workshop Proceedings:** A summary of the objections raised and how the model was adjusted to meet them.

  **Failure Looks Like:**
  1.  **Conceptual Collapse:** We find that every time we try to remove the "tag," the system loses the ability to report or use the information, meaning Access and Phenomenality are functionally inseparable in this framework. (Note: This is a *productive* failure, as it answers the research question, but it risks stalling the workshop if participants view it as a dead end).
  2.  **The Hard Problem Trap:** The discussion drifts into "but what is it like to be the system?" If we spend more than two sessions debating the metaphysics of experience rather than the functional architecture, we have failed to stick to the scope.

  ### 6. Feasibility and Risk Assessment (The 6-Month Reality Check)
  **Is 6 months enough?**
  Yes, but only if we are disciplined. This timeline is sufficient for conceptual modeling and a working group sprint. It is *not* sufficient for solving the Hard Problem of Consciousness.

  **Risk: Collapsing into the Hard Problem**
  There is a high risk that participants will argue that "Access without Phenomenality" is incoherent by definition.
  *   *Mitigation:* We will enforce a functionalist constraint. We are not asking if the system *feels*; we are asking if the system can *report and route* information without a central binding mechanism. We must agree to bracket the "what it is like" question and focus on the "how it works" question.

  **Risk: Scope Creep**
  It is tempting to bring in Integrated Information Theory (IIT) or Higher-Order Theories.
  *   *Mitigation:* The workshop charter will explicitly limit comparison to GWT. We are stress-testing one specific architecture, not comparing all theories of mind.

  ### 7. Budget Overview
  *   **Facilitator Stipend:** For project management and synthesis of the final model.
  *   **Participant Honorariums:** To attract high-quality philosophers and cognitive scientists who can commit to the construction phase, not just attendance.
  *   **Documentation:** Professional diagramming and editing of the final case study to ensure it is accessible to both philosophers and cognitive scientists.

  ### 8. Conclusion
  Global Workspace Theory is the workhorse of modern consciousness science. If its core mechanism conflates Access and Phenomenality, a significant portion of current research is categorically confused. This workshop offers a low-cost, high-leverage intervention. By building a model that forces the two apart, we will either validate GWT's scope or expose a fundamental category error. We aren't promising to explain consciousness; we are promising to clean up the tools we use to talk about it.
