answer: |-
  **The Diagnosis**
  Your hypothesis that this is a verbal disagreement stemming from conflated questions is too neat. It assumes Douglass maintained a stable distinction between "text" and "practice" that scholars simply missed. I argue the disagreement is substantive because it concerns the evolution of Douglass's legal hermeneutics, not merely his rhetorical focus. The scholars are not just arguing about which question Douglass was answering; they are arguing about whether he believed the Constitution *could* be read differently over time. If the shift was purely strategic (your "as-applied" register), his legal reasoning should remain thin, serving only moral ends. If the shift was genuine (the "as-written" change), his later legal arguments should demonstrate a robust, independent interpretation of clauses he previously dismissed. The debate persists because Douglass's public writings blend moral urgency with legal claim-making, making it difficult to isolate whether his legal theory drove his politics or vice versa.

  **Douglass's Words and Situation**
  The biographical context supports a substantive shift rather than a mere dual-register strategy. In the Garrisonian phase, Douglass refused to vote because he believed the Constitution's legal machinery was inherently corrupt. After 1851, he not only claimed the text was clean but argued it provided specific federal powers to abolish slavery. This is not just contrasting ideal vs. real; it is claiming new legal affordances. In the 1852 Oration, he does shame the nation's practice, but he also appeals to the Founders' intentions as a binding legal standard. By 1860 in Glasgow, he is dissecting clauses like the Three-Fifths Compromise with legalistic precision, arguing they were intended to limit slavery's power, not expand it. This suggests he didn't just separate text from practice; he re-engineered his understanding of the text to make it a usable weapon within the Union. The break with Garrison was not just about audience; it was about the viability of political action, which required a Constitution that could bear the weight of law, not just moral aspiration.

  **What Would Count as Progress**
  The hypothetical private letter would not settle the debate; both camps would absorb it. The "changed mind" camp would cite it as proof that his legal reading was a political expedient. The "continuity" camp would cite it as proof that he always held the ideal separate from the legal reality, confirming your dual-register theory. Real progress requires analyzing the internal consistency of his later legal arguments. Do his later speeches engage with counter-arguments about the Constitution's pro-slavery clauses with genuine rigor, or does he dismiss them with rhetoric? If his later legal reasoning stands up to scrutiny independent of his moral goals, it suggests a genuine intellectual evolution. If it collapses without his moral fervor, it suggests instrumentalization. The key is not finding his private doubt, but determining whether his public legal theory became autonomous from his moral philosophy.
