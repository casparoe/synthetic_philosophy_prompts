answer: |-
  This is a sophisticated impasse, and your suspicion is well-founded: you are not stalled on an empirical question, nor merely on semantics. You are stalled on a **meta-ethical category error** regarding the source of normativity.

  Specifically, your group is conflating **instrumental rationality** (coherence of means to ends) with **substantive rationality** (validity of the ends themselves), while operating under conflicting assumptions about whether moral reasons are internal (mind-dependent) or external (mind-independent).

  Here is a diagnosis of the structure of the disagreement, an evaluation of the conceptual tools you proposed, and a suggestion for how progress might actually look.

  ### 1. Diagnosis: The Structural Impasse

  The disagreement is not factual, nor is it purely verbal. It is a **normative bedrock disagreement disguised as a psychological classification.**

  **The Category Error:**
  In standard decision theory (the rationalist background), a "bias" is defined as a systematic deviation from the axioms of rational choice (e.g., transitivity, independence) *given a set of preferences*. Preferences themselves are treated as exogenous inputs.
  In moral philosophy, however, preferences are often the *object* of evaluation.
  *   **Camp A (Preferences)** is operating with a **Humean/Internalist** model of reasons: A reason must be grounded in the agent's subjective motivational set. If proximity-weighting is a stable feature of that set, it constitutes a reason. To call it a "bias" is to impose an external standard that has no grip on the agent.
  *   **Camp B (Biases)** is operating with a **Rationalist/Externalist** model of reasons: Reasons exist independently of the agent's psychology (e.g., the badness of suffering is objective). Proximity-weighting obscures this objective landscape. Therefore, it is a cognitive error, analogous to miscalculating a probability.

  **Why it stalls:**
  You cannot resolve this empirically because "bias" in Camp B's usage is a *normative* label, not a *descriptive* one. In cognitive psychology, the conjunction fallacy is a bias because it violates the laws of probability (logic). In morality, proximity-weighting is only a "bias" if it violates the laws of *ethics*. Since you disagree on the laws of ethics (Agent-Relative vs. Agent-Neutral), you disagree on the baseline against which "deviation" is measured.

  ### 2. The Circularity Worry

  Your worry that "any attempt to 'debias'... smuggles in a competing normative weighting" is correct and fatal to the current framing.

  To classify a psychological pattern as a **bias**, you need a **normative baseline**.
  *   If the baseline is **Impartial Maximization**, then temporal discounting is a bias.
  *   If the baseline is **Contractualist Reasonableness**, then temporal discounting might be a legitimate constraint (e.g., "it is unreasonable to demand I care about strangers in 300 years as much as my children today").

  When Camp B calls proximity a "bias," they are implicitly asserting that Impartiality is the correct baseline. When Camp A calls it a "preference," they are asserting that Agent-Relativity is the correct baseline. Arguing about the label "bias" is just a proxy war for arguing about the baseline. This makes the distinction between preference and bias in the moral domain **derivative, not foundational.** It collapses because the criterion for distinguishing them is the very thing you are debating.

  ### 3. Evaluating Conceptual Distinctions

  You asked if distinctions like *corrigibility* or *first/second-order* commitments could move the debate. They can clarify, but they cannot resolve the bedrock conflict.

  **A. First-Order Preferences vs. Second-Order Commitments**
  *   *The Move:* Distinguish between what agents want (1st order) and what they want to want (2nd order). If agents reflectively endorse proximity-weighting, Camp A wins.
  *   *The Limit:* Many rationalists (Camp B) argue that reflective endorsement is also subject to error. An agent can reflectively endorse a view that is objectively wrong (e.g., a reflective racist). If moral reasons are external, 2nd-order endorsement does not validate a preference. This distinction helps identify *alienation* (when I feel my bias is not me), but it doesn't solve the *validity* question.

  **B. Corrigibility vs. Stability**
  *   *The Move:* Biases are resistant to information; preferences change with information. If I explain scope neglect and you change your mind, it was a bias. If you don't, it's a preference.
  *   *The Limit:* This relies on the assumption that "full information" leads to impartiality. Camp A argues that "full information" includes understanding the phenomenological reality of agent-relative constraints. If a fully informed agent still discounts the future, Camp B calls it a "fundamental moral error," while Camp A calls it a "fundamental moral fact." Corrigibility tests only reveal *consensus*, not *truth*.

  **C. Idealized Preferences (The Rationalist Standard)**
  *   *The Move:* What would the agent prefer under idealized conditions (no cognitive limits, full vividness)?
  *   *The Limit:* As you noted, "idealization" often smuggles in impartiality. If "ideal conditions" include a Veil of Ignorance, you have already built Camp B's conclusion into the premise. If "ideal conditions" preserve the agent's identity, you lean toward Camp A.

  ### 4. Is the Stall Inevitable?

  The stall is inevitable **only if** you insist on using the single label "Rationality" to cover both *epistemic/instrumental coherence* and *moral validity*.

  In the natural sciences, the baseline (logic/reality) is independent of the observer. In ethics, the relationship between the observer and the baseline is the central philosophical problem. As long as Camp B treats moral reasons like laws of physics (discoverable, agent-neutral) and Camp A treats them like laws of aesthetics or prudence (constituted by agent-relation), you will talk past one another.

  ### 5. Pathways to Progress

  Since empirical data and formal decision theory cannot bridge this gap (Hume's Guillotine), progress requires **meta-ethical explicitness** or **reframing**.

  **Option 1: Meta-Ethical Explicitness (The "Baseline" Audit)**
  Stop asking "Is this a bias?" and start asking "Under which theory of reasons does this count as a bias?"
  *   Ask Camp B: "What is the independent truth-maker that makes proximity an error? Is it a Platonic form? A requirement of universalizability?"
  *   Ask Camp A: "If this is a preference, does it hold even if it leads to collectively self-defeating outcomes (e.g., tragedy of the commons)?"
  *   *Goal:* Acknowledge that "Bias" is a theory-laden term. You may find you are actually debating **Internalism vs. Externalism**. Resolving that (or agreeing to disagree on it) dissolves the "bias vs. preference" stalemate.

  **Option 2: Domain Distinction (Prudence vs. Morality)**
  Distinguish between **Prudential Rationality** (what is good *for* the agent) and **Moral Rationality** (what the agent ought to do).
  *   Temporal discounting might be a *bias* in Prudence (it harms the agent's future self).
  *   Proximity-weighting might be a *feature* in Morality (it defines the agent's special obligations).
  *   *Goal:* This allows Camp B to claim victory on the "rationality" front (it's irrational for your own welfare) while Camp A claims victory on the "morality" front (it's permissible to prioritize kin). This splits the question rather than forcing a binary choice.

  **Option 3: Functional Reframing (The "Error Theory" Compromise)**
  Adopt an **Error Theory** or **Fictionalist** stance for the sake of the discussion.
  *   Agree that evolutionarily, these are *adaptive heuristics* (Camp A's descriptive claim).
  *   Agree that normatively, they fail the test of *impartial justification* (Camp B's normative claim).
  *   *Goal:* Instead of fighting over whether it *is* a bias, agree on a conditional: "If we accept impartiality as the goal, these are biases. If we accept agent-relative integrity as the goal, these are preferences." The debate then shifts to **which goal is prioritized in this specific context** (e.g., public policy vs. personal life), rather than which description is metaphysically true.

  ### Recommendation

  The most productive move is to **abandon the term "bias" for the moral domain** unless accompanied by a specified normative baseline.

  Propose to your group that you are not debating psychology, but **the scope of the "Ideal Observer."**
  *   Does the Ideal Observer have a location in time and space? (If yes, proximity is a preference. If no, it's a bias.)
  *   Does the Ideal Observer have personal relationships? (If yes, partiality is a preference. If no, it's a bias.)

  This reframes the stalemate from "What are humans like?" (which you agree on) to "What is the status of the Ideal?" (which is the actual disagreement). This moves the debate from a confused mix of psychology and ethics into clear meta-ethics, where the disagreement can be properly located, even if not resolved.
