answer: |-
  Here is a complete plan for your 75-minute section. It is designed to be run solo, requires minimal tech, and forces the students to confront the tension between *substrate* and *organization* through betting and consistency checks rather than abstract debate.

  ### Activity Title: The Consciousness Wager

  **Core Mechanic:** Students start with 10 "Qualia Points" (QP). They wager QP on whether a hypothetical system possesses the property of "Caring" (having experience) after undergoing specific modifications. Points are not awarded for being "right" (there is no right answer), but for **consistency** and **persuasion** during the debrief.

  **Materials:**
  *   **The Brain:** A clear glass bowl containing 100 large blue marbles ("Careenium").
  *   **The Swap:** A bag of 100 large red marbles ("Simmballs").
  *   **The Black Box:** An opaque shoebox labeled "Functional Equivalent."
  *   **The Paste:** A Ziploc bag containing blue sand or crushed blue chalk ("Ground Careenium").
  *   **The Specs:** Two envelopes. Envelope A: "Test Log (Past Inputs)." Envelope B: "Mathematical Proof (All Possible Inputs)."
  *   **Voting:** 18 index cards (Green side = "It Cares," Red side = "It's a Zombie").
  *   **Stakes:** A bag of candy (e.g., Hershey's kisses). 1 QP = 1 piece of candy at the end.

  ---

  ### Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Distribute cards & 10 QP (tokens/paper). Explain the "Caring" predicate. |
  | **05-45** | **The Wager** | Run the 4 Cases. Students vote/wager privately, then reveal. |
  | **45-60** | **The Audit** | Small group discussion: Defend inconsistencies. |
  | **60-75** | **Debrief** | Map intuitions to vocabulary (Functionalism, Substrate, Causal Exclusion). |

  ---

  ### Rules & Payoff Scheme

  1.  **The Predicate:** We are not judging "intelligence." We are judging **"Caring."** Does it feel like something to be this system? Does it experience pain/joy?
  2.  **The Wager:** Before each case is revealed, you must place a bet (1-5 QP) on Green (Cares) or Red (Zombie).
  3.  **The Audit (Scoring):**
      *   **Consistency Bonus:** If your votes across Case 1 and Case 2 are logically consistent with a principle you can articulate in the Audit phase, keep your wagered points.
      *   **Persuasion Bonus:** In the Audit phase, if you convince a peer to change their vote based on your reasoning, you steal 1 QP from the house (you get extra candy).
      *   **Loss:** If you vote randomly or cannot explain *why* you voted that way during the Audit, you lose the wagered points.
      *   *Note:* This prevents "guessing." They must commit to a reason.

  ---

  ### The 4 Cases (Scripted for the Facilitator)

  *Do not use the words "Functionalism," "Substrate," "Implementation," or "Realization." Use "Stuff," "Pattern," "Job," "Material."*

  **Case 1: The Slow Swap (Grain Sensitivity)**
  *   **Action:** Hold the Bowl (100 Blue). Say: "This is a healthy mind. It Cares." Take one Blue out, put one Red in. "One neuron replaced. The behavior is identical." Repeat this physically 5 times while talking. "Now imagine we continue this over 10 years until every Blue is gone."
  *   **Question:** "When the last Blue is gone, does the system still Care?"
  *   **Trap:** If they say Yes, they accept functional equivalence. If they say No, they must identify *when* the light went out (the Sorites problem).

  **Case 2: The Black Box (Grain/Block Sensitivity)**
  *   **Action:** Reset the Bowl to 100 Blue. "Now, we don't swap one by one. We scoop out 50 Blues (half the brain) and dump them in the trash." Pick up the **Opaque Shoebox**. "We insert this Box. It is wired to the remaining 50 Blues. It guarantees the exact same outputs for the same inputs as the 50 Blues we removed."
  *   **Question:** "Does the system (50 Blues + Box) Care?"
  *   **Trap:** CS majors usually say Yes here. Goo-diggers say No. If they said Yes to Case 1 but No to Case 2, they are sensitive to the *grain* of replacement (continuity vs. block swap).

  **Case 3: The Paste (Organization vs. Quantity)**
  *   **Action:** Hold the **Bag of Blue Sand**. "We take 100 Blues. We do not replace them. We just crush them into dust and spread them evenly across the room. Same mass. Same chemical stuff. Zero organization."
  *   **Question:** "Does this dust Care?"
  *   **Trap:** Almost everyone says No. This forces the concession that *organization* matters, not just stuff. This undermines the hardline "Goo" position.

  **Case 4: The Counterfactual (Robustness)**
  *   **Action:** Hold **Two Opaque Boxes**. "Both boxes behave exactly like the 50 Blues from Case 2 on every test we have run so far."
      *   Hold up **Envelope A**: "Box A has passed every test we've thrown at it for 10 years."
      *   Hold up **Envelope B**: "Box B comes with a mathematical proof that it *must* behave identically on all physically possible inputs, even ones we haven't tested."
  *   **Question:** "Is there a difference in Caring between Box A and Box B?"
  *   **Trap:** If they say B Cares but A doesn't (or B is *more* real), they are admitting that **counterfactual robustness** (the pattern's stability) is the causal factor, not the history or the testing.

  ---

  ### The Audit (Small Group Discussion)

  1.  Split into 3 groups of 6.
  2.  **Task:** Compare your betting slips. Find a disagreement.
  3.  **Prompt:** "One of you bet Green on Case 2, one bet Red. You cannot leave this discussion until one of you convinces the other, OR you jointly agree on exactly *which rule* makes the difference (e.g., 'It's okay to replace parts, but not all at once')."
  4.  **Your Role:** Circulate. Listen for phrases like "It's just simulating" vs. "It's actually doing it." Do not correct them yet.

  ---

  ### The Debrief (Last 15 Minutes)

  *Now you introduce the vocabulary. Map their specific betting behavior to the philosophical concepts.*

  **1. Map the Cases:**
  *   **Case 1 & 2 (The Grain):** "Those of you who accepted the Slow Swap but rejected the Black Box: You aren't worried about the *stuff* (since the stuff is gone in both). You are worried about the **continuity of the process**. You think the *history* matters."
  *   **Case 3 (The Paste):** "Those who rejected the Paste: You admitted that **structure** does the work. The goo is just the fuel. This is the first step toward Functionalism."
  *   **Case 4 (The Counterfactual):** "Those who distinguished the Two Boxes: You believe **modal robustness** (what the system *would* do) is real. You think the *pattern* has causal power, not just the physics."

  **2. The Core Tension (Causal Exclusion):**
  *   Draw two layers on the whiteboard.
      *   **Bottom Layer:** "The Physics" (Marbles, Electrons, Goo).
      *   **Top Layer:** "The Pattern" (Logic, Function, Care).
  *   **The Question:** "In Case 2 (Black Box), if the system Cares, what is doing the work? Is the *Pattern* pushing the electrons around? Or are the *Electrons* pushing each other around, and the Pattern is just a story we tell about it?"
  *   **The Vocabulary:**
      *   **Substrate/Realization:** The marbles/electrons.
      *   **Functionalism:** The view that the Pattern is what matters (Case 2 & 4 Yes).
      *   **Biological Naturalism:** The view that only the Goo can do the work (Case 2 No).
      *   **Epiphenomenalism/Exclusion:** The worry that if the Physics does all the work, the Pattern (the Mind) is just a shadow riding on top.

  **3. The Payoff:**
  *   Ask for a show of hands: "Who kept all their points?"
  *   Distribute candy based on QP held.
  *   **Final Note:** "If you felt frustrated that Case 1 and Case 2 should be the same but *felt* different, that is the exact feeling of the Mind-Body Problem. The physics says they are identical. Your intuition says they are not. Philosophy lives in that gap."

  ---

  ### Predictable Failures & Mitigations

  **1. The "CS/Engineering" Sweep:**
  *   **Prediction:** They will say "Obviously Case 2 works, it's the same function. Who cares about the goo?" and blaze through.
  *   **Mitigation:** Hit them hard on **Case 4**. Ask: "If Box A and Box B are physically identical *right now*, but Box B has a proof and Box A doesn't, how does the *proof* change the physics inside the box?" If they say the proof matters, they are admitting magic (non-physical facts affecting physical reality). If they say it doesn't matter, ask why we trust AI safety proofs. Force them to confront the **counterfactual** nature of function.

  **2. The "Goo Digger":**
  *   **Prediction:** "It's made of metal, it can't feel. Only biology cares."
  *   **Mitigation:** Use **Case 1 (Slow Swap)**. "You agreed the person cared at swap #1. At what swap number did they die? Swap 50? Swap 99?" Force them to identify a magical threshold. If they can't, their "Goo" position is unstable.

  **3. The "Skeptic/Refuser":**
  *   **Prediction:** "This is silly. Marbles aren't brains. I won't play."
  *   **Mitigation:** Assign them the role of **"Auditor General."** Their job is not to bet, but to write down the *exact contradiction* they hear in other students' arguments. Give them double candy if they find a logical inconsistency in the group discussion. This validates their skepticism while keeping them engaged.

  **4. The "Simulation" Confusion:**
  *   **Prediction:** Students will confuse "Simmball" with "Video Game Simulation." They will think the Black Box is running a *model* of a brain, rather than *being* a functionally equivalent brain part.
  *   **Mitigation:** Be precise with language. "This box is not simulating a neuron for a scientist to look at. This box *is* the neuron in the network. It takes the voltage, it outputs the voltage. It is embedded in the causal chain."

  ---

  ### Honest Limitation: What This Activity Cannot Do

  **The Causal Exclusion Argument.**
  The activity successfully reveals *where* students draw the line (Stuff vs. Pattern). It successfully makes them feel the tension between Case 1 and Case 2.
  *However*, it cannot reproduce the **metaphysical worry** that the Pattern *cannot* cause anything because the Physics is causally closed.
  *   **Why:** In the game, the Black Box *does* cause outputs. The students see the causal work happening.
  *   **The Gap:** They won't naturally feel the worry that "If the electrons did the work, the 'Function' is just a label."
  *   **Your Job:** You must supply this in the Debrief. You have to explicitly state: "You voted that the Pattern matters. But physics says only mass and charge push things around. If the Pattern isn't mass or charge, how does it push?"
  *   **Don't hide this:** Acknowledge that the game shows their *intuitions*, but the lecture next week will attack whether those intuitions are *metaphysically possible*.

  ### Why This Works for Your Constraints
  1.  **Solo Facilitation:** You control the props; they only vote and discuss.
  2.  **No Jargon:** The terms "Function" and "Substrate" are banned until the end. They experience the *concept* first.
  3.  **Grain Sensitivity:** The contrast between Case 1 (iterative) and Case 2 (block) is the centerpiece.
  4.  **Stakes:** The candy/QP system forces them to commit, reducing passive listening.
  5.  **Discovery:** They generate the inconsistency (e.g., "I accept the swap but not the box"); you just name it at the end.
