answer: |-
  You are not overthinking it. You have identified a very specific, very common dialectical move in modal metaphysics, particularly in debates surrounding Kripkean essentialism, philosophy of mind (zombie arguments), and material constitution.

  There is no single, canonical Latin name for this (like *ad hominem*), but in contemporary analytic metaphysics, it is usually diagnosed as a failure to distinguish **epistemic possibility** from **metaphysical possibility**, often facilitated by **sliding between primary and secondary intensions** (a framework developed by David Chalmers).

  However, since you need a term to use in seminar to point out the *dialectical behavior* (the moving of goalposts while claiming identity), I propose we call this **"Conceivability Creep."**

  Here is the breakdown of the phenomenon, the technical machinery behind it, how to name it, and how to distinguish it from the fallacies you mentioned.

  ### 1. The Technical Diagnosis: Why It Happens
  The person making the argument is exploiting a gap between **how we identify a concept** and **what the concept actually is.**

  *   **The Move:** When you challenge the physical properties of the "ice table" (e.g., ice is brittle), they treat those properties as *accidental* (contingent features that could be otherwise).
  *   **The Reality (per Kripke):** If "ice" rigidly designates frozen H₂O, then its molecular structure is *essential*. You cannot conceive of ice with different bonds without conceiving of a *different substance* that merely looks like ice.
  *   **The Mechanism:** They are switching between:
      1.  **Primary Intension (Epistemic):** "Whatever plays the role of the clear, cold solid in the actual world." (Under this description, yes, you can imagine it being strong).
      2.  **Secondary Intension (Metaphysical):** "H₂O in a frozen state." (Under this description, no, you cannot imagine it being strong without changing chemistry).

  By tweaking the background (gravity, bonds), they are trying to keep the *Primary Intension* satisfied while claiming they are talking about the *Secondary Intension*.

  ### 2. Proposed Name: "Conceivability Creep"
  Since there isn't a standard label for the *dialectical pattern* (as opposed to the metaphysical error), **Conceivability Creep** fits best.

  **Definition:** *Conceivability Creep* occurs when an arguer preserves the conceivability of a scenario by incrementally modifying the essential or background properties of the objects involved, while insisting that the referent of the concept remains identical throughout the modifications.

  **The Edges of the Concept:**
  *   **It is not just "Imagination":** It specifically involves a claim about *metaphysical possibility* derived from that imagination.
  *   **It is not "Theory Rescue":** In empirical science, ad hoc rescue saves a hypothesis from data. Here, the "data" is modal intuition, and the "hypothesis" is the identity of the object.
  *   **The Key Feature:** The insistence on **Identity Preservation**. They aren't saying, "Okay, this is a new thing, Ice*." They are saying, "This is still *ice*."

  ### 3. Distinguishing It from Other Fallacies

  You were right to sense it isn't quite Equivocation or Motte-and-Bailey. Here is the granularity:

  #### Vs. Equivocation
  *   **Equivocation:** Deliberately (or accidentally) using Word X in Sense A, then switching to Sense B to win the point. (e.g., "Faith" as trust vs. "Faith" as belief without evidence).
  *   **Conceivability Creep:** The arguer insists they are using **Sense A the whole time**. They claim the *definition* hasn't changed, only the *world* around the object has. They are fighting over what is essential to the definition, not swapping definitions openly.
  *   **The Difference:** Equivocation is a semantic switch; Conceivability Creep is a metaphysical smuggling operation.

  #### Vs. Motte-and-Bailey
  *   **Motte-and-Bailey:** Arguer makes a controversial claim (Bailey). When attacked, they retreat to a trivial, defensible claim (Motte). When the attack stops, they claim the Motte proves the Bailey.
  *   **Conceivability Creep:** There is no retreat to a "safer" position. They stay in the controversial position ("Ice tables are possible") but **reshape the position** to make it defensible ("Ice tables are possible *if* we tweak bonds"). They don't admit the position changed; they claim *your objection* was based on a narrow view of the world.
  *   **The Difference:** Motte-and-Bailey involves two distinct claims. Conceivability Creep involves one claim that silently mutates.

  #### Vs. No True Scotsman
  *   **No True Scotsman:** "No Scotsman puts sugar on porridge." "But Angus is a Scotsman and does." "Well, no *true* Scotsman..."
  *   **Conceivability Creep:** This is almost the inverse. It's "This is Ice." "But Ice breaks." "Well, this is Ice *with stronger bonds*."
  *   **The Difference:** Scotsman excludes counterexamples to protect a generalization. Creep *includes* counterexamples by modifying the essence to protect a possibility claim.

  ### 4. How to Counter It in Seminar
  If you want to stop the Creep, you need to force the **Essentialist Fix** before the conceivability test begins.

  **The Move:**
  > "Before we test if it's conceivable, we need to fix the **rigid designator**. Are we conceiving of 'the stuff that looks like ice' (descriptive) or 'frozen H₂O' (essential)?
  >
  > If it's H₂O, you can't tweak the bonds without changing the substance. If you tweak the bonds, you aren't conceiving of an ice table; you're conceiving of a **qualitative duplicate** of a wood table that looks like ice. You've proved qualitative duplicates are possible, not that ice tables are possible."

  **The Label to Use:**
  > "I think you're engaging in **Conceivability Creep**. You're preserving the intuition by changing the essence of the object. You're not conceiving of *ice* behaving like wood; you're conceiving of *wood* disguised as ice."

  ### Summary
  *   **Technical Term:** Sliding between Primary and Secondary Intensions / Confusing Epistemic and Metaphysical Possibility.
  *   **Dialectical Label:** **Conceivability Creep**.
  *   **Core Error:** Treating essential properties as accidental background conditions to save a modal intuition.
  *   **The Fix:** Force them to lock down the essence (the rigid designator) *before* they start imagining scenarios.

  You are spotting a genuine structural weakness in how people use conceivability arguments. It's the standard move of someone who wants the conclusion of a possibility claim without paying the metaphysical cost of essentialism. Naming it "Conceivability Creep" should give your seminar the vocabulary to call it out when it happens.
