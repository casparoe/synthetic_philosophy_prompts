prompt: |-
  I am a PhD student in philosophy of language, and I will be moderating the question period at a colloquium whose speaker is a defender of epistemicism about vagueness. The speaker's aim is not merely to defend epistemicism, but to argue that it is more plausible than supervaluationism, especially once we distinguish epistemic indeterminacy from semantic indeterminacy. I would like you to draft eight to ten questions that test the view rather than invite a summary of it. Please include at least one question on the objection that sharp cutoffs sound absurd and why epistemicism is supposed to make that objection harmless rather than answer it; one on the margin-for-error principle and how it explains our ignorance of where the cutoff is without making the cutoff unknowable in principle; one on higher-order vagueness and whether epistemicism simply pushes the problem up a level; one on how the view differs from supervaluationism about whether borderline cases are false, neither true nor false, or true under some precisifications; and one on the practical consequences for law or ethics, where a sharp cutoff seems to generate arbitrary outcomes. For each question, add a brief follow-up keyed to the most likely reply the speaker will give, so that I can press the point if the answer is too quick.

  The questions should be substantive enough to show that I know the literature, but not so technical that they assume a particular version of epistemicism. I would also like at least one question that forces the speaker to say what would count as evidence against the view, not merely an argument that supervaluationism has its own problems.
reasoning: |-
  Here's a thinking process that leads to the suggested questions:

