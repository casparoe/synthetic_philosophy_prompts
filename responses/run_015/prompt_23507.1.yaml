answer: |-
  Here are ten substantive questions designed for a philosophy colloquium Q&A. They are framed to be respectful but pressing, assuming familiarity with the core debates (Williamson, Keefe, Sorensen, etc.) without locking the speaker into a single formal model. Each includes a follow-up probe designed to prevent a standard deflection.

  ### 1. The "Absurdity" of Sharp Cutoffs
  **Question:** A common pre-theoretic reaction to epistemicism is that positing a sharp boundary between, say, bald and non-bald is metaphysically or conceptually absurd. You've suggested that epistemicism aims to make this objection harmless rather than answering it directly by explaining away the intuition. But if the intuition arises from our grasp of the concepts themselves, doesn't explaining it away imply our conceptual grasp is systematically misleading? How do you reconcile the claim that we understand the meaning of 'bald' with the claim that we are radically mistaken about its logical structure?

  *   **Follow-up:** *If the speaker replies that intuition is not a reliable guide to metaphysical reality:* "Granted, intuition isn't infallible. But if our linguistic intuitions fail us this drastically regarding the basic logic of our own predicates, what remains of the method of cases in philosophy of language? Is there any phenomenological data that *could* count against epistemicism if this intuition is dismissed?"

  ### 2. The Margin-for-Error Principle and Unknowability
  **Question:** Epistemicists often rely on a Margin-for-Error Principle to explain why we cannot know the location of the sharp cutoff: knowledge requires safety, and beliefs about the boundary cannot be safe. But does this render the cutoff unknowable merely *contingently* (due to our cognitive limitations) or *in principle* (due to the nature of knowledge itself)? If it is the latter, does the cutoff retain its status as a fact of the matter, or does it become a limit of thought?

  *   **Follow-up:** *If the speaker argues it is unknowable in principle due to safety conditions:* "If safety conditions make the boundary unknowable in principle, doesn't that functionally mimic the supervaluationist's 'indeterminacy'? What is the substantive gain of calling it 'epistemic' if the accessibility conditions are identical to those of a truth-value gap?"

  ### 3. Higher-Order Vagueness
  **Question:** One motivation for non-epistemic views is higher-order vagueness: the idea that there is no sharp line between the clear cases and the borderline cases. Epistemicism seems to preserve classical logic by positing a sharp line between 'definitely F' and 'not definitely F'. Does this not simply push the problem up a level? Why should we find a sharp boundary at the level of 'definiteness' any more plausible than a sharp boundary at the level of 'F'?

  *   **Follow-up:** *If the speaker argues that higher-order vagueness is also just ignorance:* "If we are ignorant of the boundary between 'definitely' and 'not definitely', does that not undermine the explanatory power of the 'definitely' operator? If we can't locate the scope of our knowledge, how does the operator help us model our actual linguistic behavior?"

  ### 4. Comparison with Supervaluationism (Truth Values)
  **Question:** You argue epistemicism is more plausible than supervaluationism. A key difference is that supervaluationism treats borderline claims as neither true nor false (or indeterminate), while epistemicism insists they are strictly true or false. Supervaluationists argue this captures the "penumbral connections" between vague terms better than epistemicism. If epistemicism forces us to say a borderline sentence is true, do we lose the ability to explain why it seems inappropriate to assert it, compared to the supervaluationist explanation that it lacks a truth value?

  *   **Follow-up:** *If the speaker replies that assertibility comes apart from truth (e.g., via knowledge norms):* "If assertibility comes apart from truth this radically in vague contexts, does classical logic still do the work you claim it does? If we can't assert the true disjunct of an instance of Excluded Middle, in what sense have we preserved the utility of classical logic for natural language?"

  ### 5. Practical Consequences in Law and Ethics
  **Question:** In legal and ethical contexts, we often rely on vague terms like 'adult', 'person', or 'reasonable'. If epistemicism is true, there is a precise moment where a person becomes an adult, even if we can't know it. This seems to generate arbitrary outcomes in borderline cases where the law must decide. Does epistemicism imply that legal vagueness is a defect to be eliminated by precise stipulation, or is there room for vagueness in the law even if natural language is sharp?

  *   **Follow-up:** *If the speaker argues legal vagueness is distinct from natural language vagueness:* "If legal vagueness is distinct, does that mean epistemicism doesn't actually apply to the domains where precision matters most? If natural language has sharp cutoffs but the law shouldn't rely on them, how do we translate the natural language statute into legal practice without importing that arbitrary sharpness?"

  ### 6. Falsifiability and Evidence
  **Question:** I'd like to ask about the empirical constraints on the view. Epistemicism is often criticized for being compatible with any linguistic data, since any appearance of indeterminacy is interpreted as ignorance. What specific linguistic or phenomenological evidence would count *against* epistemicism? If we cannot imagine a scenario where we would abandon the view, is it functioning as a metaphysical stipulation rather than a theory of language?

  *   **Follow-up:** *If the speaker suggests that failure to explain competence would count against it:* "But epistemicism claims to explain competence via partial knowledge. Is there a specific pattern of linguistic error or hesitation that your model cannot accommodate? If the theory absorbs all data by positing hidden facts, how is it preferable to a view that takes the indeterminacy at face value?"

  ### 7. Supervenience and Use
  **Question:** Meaning is generally thought to supervene on usage. If our usage of a term like 'tall' is fluid and lacks a sharp pattern, how does the meaning acquire a sharp boundary? Epistemicism seems to require that meaning does not fully supervene on use, or that use is sharper than it appears. Which horn of this dilemma do you prefer, and what fixes the reference if use does not?

  *   **Follow-up:** *If the speaker argues use is sharper than we think (hidden precision in practice):* "If use is sharper than we think, does that imply there are facts about our linguistic behavior we are unaware of? How do we access these facts to verify the theory, if our own introspection and observation of others suggest fluidity?"

  ### 8. Communication and Competence
  **Question:** If speakers are ignorant of the extensions of their own predicates, how is successful communication possible? When I say 'meet me when it gets dark', and you agree, we seem to coordinate successfully. If there is a sharp cutoff we both don't know, aren't we relying on a shared ignorance? How does epistemicism explain coordination without shared knowledge of the boundary?

  *   **Follow-up:** *If the speaker argues we coordinate on 'safe' zones away from the boundary:* "But much of our interesting discourse happens near the boundaries (e.g., ethical dilemmas, legal disputes). If coordination fails there, does epistemicism imply that genuine disagreement in borderline cases is impossible, since one party is simply mistaken about a fact?"

  ### 9. Logic and Validity
  **Question:** You argue that epistemicism preserves classical logic, unlike supervaluationism which invalidates certain inferences (like conditional proof or reductio in certain contexts). But is preserving classical validity worth the cost if the premises involve vague terms we cannot verify? Is there a sense in which supervaluationism captures a 'logic of assertibility' that is more useful for reasoning than the 'logic of truth' epistemicism preserves?

  *   **Follow-up:** *If the speaker insists truth is the only norm of assertion:* "Even if truth is the norm, if we cannot distinguish true vague claims from false ones, does the logic of truth become practically inert? Does epistemicism risk making logic a purely theoretical virtue with no application to actual reasoning processes?"

  ### 10. Epistemic vs. Semantic Indeterminacy
  **Question:** Your talk distinguishes epistemic indeterminacy from semantic indeterminacy. However, if the semantic facts (the meaning) fix a sharp boundary, but our access is blocked, the functional role of the term in our language game looks identical to a term with semantic indeterminacy. Is the distinction between 'epistemic' and 'semantic' indeterminacy substantive here, or is it merely a disagreement about whether to model the gap in the world or in our head?

  *   **Follow-up:** *If the speaker argues the distinction matters for bivalence and logic:* "If the only cash value of the distinction is the preservation of bivalence, but bivalence has no impact on our actual practices of verification or assertion, is the debate merely verbal? What hangs on the distinction other than loyalty to classical logic?"
