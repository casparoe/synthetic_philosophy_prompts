  Recommendation: Award Programme Grant [ID] to the Halvorsen Group at reduced scale for 24 months, contingent on a successful mid-term review focused on experimental adjudication.

  Reasons:
  The committee acknowledges the profound theoretical divergence between the applicants and the field's dominant model. We note the previous rejection (7–4) and the external review concern that the proposal is unassessable by current standards. However, treating "unassessable by current standards" as a mark of profundity is a failure mode; conversely, treating it as disqualification ignores the reported anomaly. The existence of performance recovery despite abolished ensemble reactivation demands resolution. Funding this application is not an endorsement of the applicants' theoretical vocabulary, nor does it rest on the speculation that paradigms inevitably shift toward heterodoxy. We have no track record of picking winners, and this decision is not a bet on the Halvorsen group being right. Rather, it is an investment in a structured mechanism to force adjudication where none currently exists. The proposed "interface experiment," co-designed with a mainstream PI, offers a rare opportunity to generate data interpretable by both camps. A five-year commitment is unjustified given the incommensurability risk; a 24-month window allows sufficient time to execute the interface experiment without precluding future allocation to steady-state research.

  Conditions and Dates:
  Funding commences [Date]. A mandatory review occurs at month 24.
  *Criteria for Success (Money well spent even if applicants are wrong):* The interface experiment is completed and pre-registered outcomes are published. The anomaly is either resolved within the standard model or clearly delineated as a boundary condition. Crucially, the project must yield shared measurement protocols that allow the "engagement" vocabulary to generate testable predictions accessible to mainstream assays.
  *Criteria for Failure (Money wasted even if applicants are right):* The group fails to operationalize their vocabulary into measurable outcomes. If, after 24 months, the theory remains purely descriptive without predictive leverage or if the collaboration yields no data compelling enough to force mainstream engagement, the funding has failed to advance scientific adjudication.

  Consideration of the Alternative:
  The strongest consideration against this motion is the denial of renewal to the mainstream group, which produces steady, reliable work aligning with current evidentiary standards. Funding certainty supports cumulative progress and maintains the field's productive output. However, reliability without resolution of known anomalies leads to stagnation. The mainstream model already accommodates the anomaly as a puzzle; the Halvorsen group treats it as a falsification. Ignoring this friction preserves comfort but halts progress. By limiting funding to 24 months, we mitigate the risk to the broader portfolio while acknowledging that a field unable to test its own boundaries is failing its primary function. The motion prioritizes the capacity for adjudication over theoretical safety.
