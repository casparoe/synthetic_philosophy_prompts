      **Reasons:** The committee recognizes the significant theoretical divergence between the applicants and the field's dominant model. We note the previous rejection (7–4) and the external review concern that the proposal is unassessable by current standards. However, one external review correctly identifies that the field's inability to adjudicate the claim is not equivalent to the claim being weak. The existence of the reported anomaly—recovery of performance despite abolished ensemble reactivation—demands resolution. Funding this application is not an endorsement of the applicants' theoretical vocabulary, nor does it rest on the speculation that paradigms inevitably shift toward heterodoxy. Rather, it is an investment in a structured mechanism to force adjudication where none currently exists. The proposed "interface experiment," co-designed with a mainstream PI, offers a rare opportunity to generate data interpretable by both camps. A five-year commitment is unjustified given the incommensurability risk; a 24-month window allows sufficient time to execute the interface experiment without precluding future allocation to steady-state research.

      **Conditions and Dates:** Funding commences [Date]. A mandatory review occurs at month 24.
