  ### Preliminary Analysis and Stipulations

  Before assigning a number, I need to disentangle the epistemic conditions from the metaphysical structure of the causal systems in question. The proposition $P$ makes a claim about the *frequency* of solvability (roughly a third of cases) for agents with *specific limitations* (non-ideal, feasible computation).

  **Candidate Sub-questions and Directional Pressure:**

  1.  **The Metaphysical Frequency of Washout:** How often do social/causal systems exhibit "regression to the mean" or attractor stability versus "butterfly effect" sensitivity?
      *   *Push Up:* Social institutions have inertia; cultural values change slower than technology; demographic trends are sticky. This suggests Washout is common.
      *   *Push Down:* Technological singularities, value drift, or existential risks represent flow-through points where small changes alter the trajectory of civilization permanently. If these are common in the "large-scale" set, Flow-through dominates.
      *   *Pressure:* This is the primary driver. If Washout is rare, $P$ is likely false unless the Robust Sign Rule saves us in Flow-through cases.

  2.  **The Integrability of Value (Heavy Tails):** Even if a system is Flow-through-dominated, does the expected value exist?
      *   *Push Up:* Real-world utility is bounded by physical constraints (number of conscious beings, energy available). This truncates the tails, making EV calculable.
      *   *Push Down:* If we assign non-zero probability to infinite or near-infinite value scenarios (e.g., simulation hypotheses, infinite futures), the EV may be undefined or dominated by low-probability high-impact events, making the "sign" unknowable.
      *   *Pressure:* This threatens the "Robust Sign Rule." If the admissible set of distributions includes one with a positive infinite tail and one with a negative infinite tail, the rule yields no verdict.

  3.  **The Non-Ad-Hocness of the Robust Sign Rule:** Can we constrain the set of admissible distributions without simply smuggling in the conclusion?
      *   *Push Up:* Principles like Maximum Entropy or constraints based on physical conservation laws provide objective bounds on "arbitrary concentration."
      *   *Push Down:* Reasonable priors about social dynamics vary wildly (e.g., Marxist vs. Liberal vs. Accelerationist models). If "reasonable" is broad, the intersection of signs is empty.
      *   *Pressure:* If the rule is too permissive, it never yields a sign. If too restrictive, it's ad-hoc.

  4.  **Epistemic Feasibility for Non-Ideal Agents:** Can *we* distinguish Washout from Flow-through cases without needing the "completed science" excluded by the prompt?
      *   *Push Up:* Historical data and comparative politics allow us to identify stable attractors (e.g., democracies tend to persist).
      *   *Push Down:* Complexity theory suggests prediction horizons are fundamentally limited by computation bounds we cannot exceed.
      *   *Pressure:* Even if the world is Washout-dominated, if we can't *know* it is, $P$ is false.

  **Ambiguities and Stipulations:**

  *   **"Know":** I stipulate this means achieving a justified credence of at least 0.9 that the sign is positive (or negative), derived from the Robust Sign Rule applied to feasible evidence. It excludes lucky guesses.
  *   **"Escapable" (excluding cheap victories):** I stipulate this means the long-run component of the value *must* be significant enough that ignoring it could flip the sign, yet the agent can still determine the sign. This is a strict reading; it prevents $P$ from being true merely because short-term benefits are huge.
  *   **"Large-Scale":** I will restrict the reference class to policy interventions currently debated in high-stakes normative contexts (e.g., climate geoengineering, AI governance, global health structural reforms), excluding minor regulatory tweaks.
  *   **"Roughly a third":** I treat this as a threshold $> 0.30$.

  **Commitment:** Under these stipulations, the exclusion of "cheap victories" significantly lowers the probability of $P$. If the long-run matters enough to potentially flip the sign, it is usually because the system is sensitive (Flow-through). If the system is insensitive (Washout), the long-run usually doesn't flip the sign (making it a "cheap victory" or irrelevant). Navigating this narrow channel—where the long-run matters *and* is predictable—is difficult.

