  $\text{Pr}(\text{Rate} > T) \approx \text{Pr}(Z > \frac{0.33 - 0.326}{0.15}) \approx \text{Pr}(Z > 0.027) \approx 0.49$.
  However, I have a second-order skepticism that my model is too optimistic about "Epistemic Access" ($c_4$). If I downweight $c_4$ to 0.4 based on philosophical skepticism about social prediction:
  $S_{case\_adjusted} = (0.4 \times 0.4) + (0.6 \times 0.21 \times 0.4) = 0.16 + 0.05 = 0.21$.
  If $S_{case}$ is 0.21, $\text{Pr}(\text{Rate} > 0.33)$ is very low.
  Balancing the optimistic model (0.49) and the skeptical adjustment (0.10), I land at **0.35**.

  ### 4. Sensitivity Analysis

  The answer swings most on **$c_1$ (Washout Frequency)**.

  *   **Why:** In the arithmetic, $c_1$ determines the weight of the first term (which is larger per unit probability) and reduces the weight of the second term (which is heavily discounted by the product of $c_2, c_3, c_4$). A 10% increase in $c_1$ increases $S_{case}$ by roughly 0.05 (direct) minus the loss in the second term. A 10% increase in $c_4$ only increases $S_{case}$ by roughly 0.03.
  *   **Evidence Needed:** Empirical historical analysis of "counterfactual stability." We need case studies where a major policy intervention occurred, and we can retrospectively assess whether the *long-run* value sign (50+ years later) correlated with the *near-term* value sign. If we find that in most historical regulatory regimes, the long-run value sign matched the short-term sign despite intervening chaos, $c_1$ moves up. If we find that long-run effects frequently inverted short-term intentions (e.g., interventions that helped short-term but caused institutional collapse later), $c_1$ moves down.

  ### 5. Diagnosis of Disagreement (0.25 vs. 0.7)

  The disagreement between you (0.25) and your colleague (0.7) most likely lives in **$c_1$ (Washout Frequency)**, specifically regarding the interpretation of "social inertia."

  *   **Your View (0.25):** You likely interpret "large-scale" interventions as frequently triggering **Flow-through** dynamics (tipping points, value drift, technological lock-in). You probably suspect that when the long-run *matters* (i.e., isn't a cheap victory), it is precisely because the system is sensitive to initial conditions, which implies Flow-through. Thus, for you, the set of cases where "long-run matters" and "Washout holds" is nearly empty.
  *   **Colleague's View (0.7):** They likely believe that **Washout** is the default state of social systems due to institutional resilience and homeostatic feedback loops. They probably view "Flow-through" scenarios (singularities, total value drift) as tail risks that do not dominate the *expected* value comparison for the bulk of policy cases. They may also be counting "cheap victories" as escapable cluelessness, whereas your stipulation explicitly excludes them.
  *   **Why this one:** Disagreements on $c_2$ (Heavy Tails) or $c_3$ (Decision Rules) are usually technical and resolvable via formal modeling. Disagreements on $c_4$ (Feasibility) are usually about resources. The gap between 0.25 and 0.7 is too large for those; it reflects a fundamental divergence in **social ontology**: is history chaotic (Flow) or path-dependent but stable (Washout)?

  **Residual Substantive Disagreement:** If we standardized the definition of "Washout," the residual disagreement would be about the **exclusion of cheap victories**. Your colleague might argue that if the near-term sign is robust, the cluelessness is "escaped" even if the long-run is unknown (because the near-term swamps it). You stipulate this out. If your colleague includes those cases, their 0.7 is defensible; if they exclude them, their credence should drop closer to yours.
