prompt: |-
  I help run a volunteer open-source project — around 3,000 members, everything governed by one mutable document — and for the last couple of years anyone can propose a change to it as a plain-text diff, which passes if it gets whatever the document currently says it needs (usually 2/3 of active members). The twist, and the reason I'm writing: the rules about how rules change are inside the document too, so they get changed as well, and we keep ending up in situations where nobody can tell what the document now says. Last month someone passed, under the old 2/3 rule, an amendment requiring unanimity for all future amendments — and then couldn't get a single typo fix through, with half the group arguing the unanimity rule is void because it was enacted by a procedure it itself declares inadequate, and the other half saying that's just what amending the amendment rule means. A month earlier a cleanup motion passed by simple majority that deleted every rule containing the word restrict, which took out a clause labelled permanent, amendable only by 4/5, and also deleted the sentence defining active member, so we're not even sure who was entitled to vote on it. And we currently have two precedence clauses in force: an older one saying the section it sits in overrides anything added later, and a newer one saying the most recently added rule wins. Apparently there's some game and maybe a philosophy literature about this (Nomic?) but I've never read any of it, and I don't want references or a reading list — I can't look anything up and neither can my moderators, so everything has to be in the procedure itself.

  What I want is a review procedure my moderation team can actually run: the ordered set of tests to apply to any proposed diff before it goes to a vote, what counts as a satisfactory answer to each test, which tests end in a flat reject as malformed, and which ones hand the decision to a human because it's a values call rather than a question of fact. Realistic constraints: rotating volunteers with no logic or law background, about fifteen minutes per proposal, and the output is a few sentences of justification in the thread. Please keep it honest about where a step is doing real work and where it's just forcing us to write down a choice we'd otherwise make silently. The failure modes I'd want it to cover, because these are the ones that keep biting us: rule identity — we number rules and amend them in place, so after a diff is it rule 17 or rule 17-prime, and when is a change so extensive that it's really a repeal-and-replace, and why should we care; priority and precedence conflicts, including clauses that claim precedence over later or earlier rules; entrenchment, i.e. whether a clause saying this cannot be amended or only by 4/5 is genuinely binding or is just text an ordinary majority can delete; self-consuming and self-modifying rules, like sunsets, one-shot rules, and rules that rewrite themselves when triggered; definitional feedback, where a rule changes what counts as a member, a quorum, a majority, or a valid rule at all; and irreversibility — deletes, merges and redefinitions that destroy information, where we couldn't get back to the prior state even if everyone agreed they wanted to (we do have git history, so this isn't about losing the text, it's about whether the community can actually return to a prior normative state). Then say plainly what the procedure cannot settle even in principle.

  Please also run it on three live-ish proposals so I can see how it behaves. First: a proposal that redefines active member to include people who have only read the forum in the last 90 days, and wants those people counted toward the quorum for the vote on that very proposal. Second: a contributors' rights section stating it may only be amended by a 4/5 vote, with no change to the amendment rule itself — I'm personally in favour of this one and assume it's fine, so if your procedure says it does nothing like what we think it does, say that straight and don't soften it; that's the answer I most need. Third: a spam emergency rule banning one specific tactic that deletes itself after thirty days, plus a seperate housekeeping rule saying any rule unchanged for two years is automatically repealed — which, as far as I can tell, would eventually eat the amendment rule itself. If any of these should be split into two proposals or rewritten rather than rejected, show me the rewrite; and if the honest answer in some case is this is a decision about who has power, not a decision about drafting, tell me that too, because I'd rather know that than pretend the checklist settled it.
reasoning: |-
  Here's a thinking process that leads to the suggested review procedure and analysis:

  1.  **Analyze the Request:**
      *   **Context:** A volunteer open-source project (~3,000 members) governed by a single mutable document (a "constitution" or "charter").
      *   **Current Problem:** The rules about changing rules are inside the document. This leads to paradoxes, confusion about validity (e.g., unanimity rule passed by 2/3 vote), precedence conflicts (older vs. newer rules), and definitional feedback loops (who counts as a member).
      *   **Goal:** A practical review procedure for a moderation team (rotating volunteers, no legal/logic background, ~15 mins per proposal).
      *   **Output:** An ordered set of tests, criteria for pass/fail/human decision, justification text, and an honest admission of limitations.
      *   **Specific Failure Modes to Cover:** Rule identity (amend vs. replace), priority/precedence, entrenchment (supermajority requirements), self-consuming/modifying rules, definitional feedback, irreversibility.
      *   **Constraint:** No external references (like Nomic literature), everything must be self-contained in the procedure.
      *   **Task:** Create the procedure *and* apply it to three specific test cases.
      *   **Tone:** Honest, practical, direct (don't soften bad news), acknowledging where the procedure is just forcing a recorded choice vs. solving a logical problem.

  2.  **Deconstruct the Core Problem:**
      *   The project is suffering from *legal indeterminacy* caused by *self-reference* and *recursive rule changes*.
      *   The "Unanimity Paradox" (passed by 2/3, requires unanimity) is a classic Kelsenian/Hartian legal theory problem (Grundnorm).
      *   The "Cleanup Disaster" (deleting "active member" definition) shows a lack of dependency tracking.
      *   The "Precedence Conflict" (old vs. new) shows a lack of a clear hierarchy of norms.
      *   *Crucial realization:* A checklist *cannot* solve logical paradoxes. It can only flag them for human decision or enforce a strict hierarchy *before* the vote happens. The procedure needs to act as a "gatekeeper" to prevent incoherent states from being voted on, rather than trying to interpret incoherent states after the fact.

  3.  **Drafting the Review Procedure (The "Gatekeeper Protocol"):**
      *   *Constraint:* 15 minutes, non-experts. Needs to be binary where possible, "escalate" where necessary.
      *   *Step 1: Syntax & Clarity.* Is it readable? (Basic hygiene).
      *   *Step 2: Rule Identity.* Is this an amendment or a repeal? (Addresses the "Rule 17 vs 17-prime" issue).
      *   *Step 3: Dependency Check.* Does this break definitions needed to vote? (Addresses the "active member" deletion).
      *   *Step 4: Entrenchment Check.* Does this violate an existing supermajority requirement? (Addresses the "permanent clause" deletion).
      *   *Step 5: Precedence Check.* Does this conflict with an existing precedence clause? (Addresses the old vs. new rule conflict).
      *   *Step 6: Self-Reference/Paradox Check.* Does this change the rules for *this* vote? (Addresses the "quorum redefinition" issue).
      *   *Step 7: Irreversibility/Sunset Check.* Does this delete the ability to change rules later? (Addresses the "amendment rule repeal" issue).
      *   *Decision Logic:* Fail = Reject. Pass = Vote. Escalate = Human decision (values call).

      *Refining the "Honesty" Constraint:* I need to explicitly state where the checklist is just making the mod team pick a side (e.g., "Is this a repeal?"). The checklist doesn't know the answer; it forces the mods to declare it.

  4.  **Developing the Test Cases:**

      *   **Case 1: Redefining "Active Member" for the current vote.**
          *   *Issue:* Definitional feedback / Self-reference.
          *   *Procedure Application:* Step 6 (Self-Reference).
          *   *Outcome:* Likely Reject or Split. You can't change the voter eligibility *for the vote happening now* without a bootstrap problem.
          *   *Honest Take:* This is a power grab. The procedure should flag it as "Changing the referee mid-game."

      *   **Case 2: Contributors' Rights (4/5 amendment requirement).**
          *   *Issue:* Entrenchment.
          *   *User Expectation:* "I assume it's fine."
          *   *Procedure Application:* Step 4 (Entrenchment).
          *   *Honest Take:* If the main Amendment Rule says "Everything needs 2/3," can a sub-clause say "This part needs 4/5"? Logically, a later 2/3 vote could override the 4/5 clause unless the 4/5 clause is *in* the Amendment Rule. This is the "Unanimity Paradox" lite. The procedure must admit this doesn't legally bind a future 2/3 vote unless the *Amendment Rule itself* is changed to recognize sub-entrenchment.
          *   *Verdict:* It creates a false sense of security. Needs rewrite to amend the Amendment Rule, not just the section.

      *   **Case 3: Spam Emergency (Sunset) + Housekeeping (Auto-repeal).**
          *   *Issue:* Self-consuming rules / Irreversibility.
          *   *Procedure Application:* Step 7 (Irreversibility).
          *   *Honest Take:* The Housekeeping rule eating the Amendment Rule is a catastrophic failure mode. The Emergency rule is fine. They interact badly.
          *   *Verdict:* Split them. Exempt the Amendment Rule from Housekeeping.

  5.  **Refining the Procedure for "Realism":**
      *   Volunteers can't do logic proofs.
      *   Need a "Traffic Light" system (Green, Yellow, Red).
      *   Need a specific "Escalation Path" for the Yellow lights (Values Calls).
      *   Need to address the "Rule Identity" problem specifically (Amend vs. Replace).

  6.  **Writing the Response:**
      *   *Introduction:* Acknowledge the gravity. This is a "Constitutional Crisis" simulator.
      *   *The Procedure:* "The Pre-Vote Sanity Check." 7 Steps.
      *   *The Logic:* Explain *why* each step exists (mapping to the failure modes).
      *   *The Limitations:* Be brutally honest. A checklist cannot resolve a paradox; it can only prevent it from being voted on.
      *   *The Test Cases:* Run them through the steps.
      *   *The "Hard Truths":* Specifically address the user's assumption about Case 2 (it's not fine) and the power dynamics in Case 1.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex for 15 minutes?
      *   *Fix:* Simplify the language. Use "Yes/No" questions.
      *   *Critique:* Did I address the "Rule 17 vs 17-prime" issue?
      *   *Fix:* Ensure Step 2 explicitly asks about Rule ID retention.
      *   *Critique:* Did I address the "Unanimity Paradox"?
      *   *Fix:* In the limitations section, explain that the procedure prevents the *vote*, but cannot solve the philosophical problem if the vote already happened.
      *   *Critique:* Case 2 analysis needs to be sharp. The user thinks it's fine. It's not. I need to explain *why* a sub-rule entrenchment is weak without top-level support.
      *   *Critique:* Make sure I don't recommend external reading (Nomic, etc.) as per prompt instructions.

  8.  **Final Polish:** Check tone. Ensure it sounds like a tool for moderators, not a philosophy essay. (The prompt asks for "honest about where a step is doing real work and where it's just forcing us to write down a choice".)

  *(Self-Correction on Case 2)*: If the Amendment Rule says "All changes require 2/3", and someone proposes "Section X requires 4/5", and it passes 2/3... is it valid? Under the current chaotic system, yes. Under a coherent system, no, because the 2/3 rule overrides the 4/5 rule unless the 2/3 rule *allows* for 4/5 exceptions. I must make this clear. The procedure must flag this as a "Conflict with Amendment Rule."

  *(Self-Correction on Case 1)*: Redefining "active member" for the *current* vote. This is a "Bootstrap Paradox." The procedure must reject this because the validity of the vote cannot depend on the outcome of the vote.

  *(Self-Correction on Case 3)*: The Housekeeping rule eating the Amendment Rule. This is "Irreversibility." The procedure must flag this as a "Critical Risk."

  9.  **Final Output Structure:**
      *   Preamble (The Philosophy of the Checklist).
      *   The Procedure (The 7-Step Sanity Check).
      *   The Limitations (What this cannot do).
      *   The Test Cases (Applied analysis).
      *   Closing Advice.

  (Proceed to generate response based on this thought process.)
answer: |-
  This is a constitutional crisis simulation. You are describing a system that has lost its "Rule of Recognition"—the fundamental standard that tells you which rules are valid. A checklist cannot solve logical paradoxes (like a rule that invalidates the method used to create it), but it can prevent them from being voted on.

  Your moderators are not judges; they are traffic cops. Their job is not to decide what is *just*, but to decide if the car is drivable before it enters the intersection.

  Here is the **Pre-Vote Sanity Check**. It is designed for a 15-minute review by a non-expert. It forces the team to make specific declarations rather than vague intuitions.

  ### The Pre-Vote Sanity Check

  **Instructions:** For every proposed diff, the moderation team must answer these 7 questions in order. If any answer is **NO**, the proposal is rejected as malformed. If any answer is **MAYBE**, it escalates to a "Values Call" (see below). If all are **YES**, it proceeds to vote.

  **1. The Identity Test (Rule Integrity)**
  *   **Question:** Does this diff preserve the Rule ID number of the target rule, or does it explicitly declare a repeal and new number?
  *   **Criteria:** **YES** if it keeps the number for edits or explicitly states "Repeal Rule X, Enact Rule Y" for replacements. **NO** if it changes the text so drastically that the original intent is unrecognizable but keeps the number (stealth replacement).
  *   **Why:** Prevents "Rule 17-prime" confusion. Forces you to admit when you are killing a rule rather than fixing it.
  *   **Action:** NO = Reject.

  **2. The Dependency Test (Definitions)**
  *   **Question:** Does this diff delete or alter a definition (e.g., "Active Member," "Quorum") that is required to calculate the validity of *this* vote or any currently pending vote?
  *   **Criteria:** **YES** if the definition remains stable for the duration of the current voting period. **NO** if the vote relies on a definition the vote itself is changing.
  *   **Why:** Prevents definitional feedback loops (changing the referee mid-game).
  *   **Action:** NO = Reject.

  **3. The Hierarchy Test (Entrenchment)**
  *   **Question:** Does this diff violate a voting threshold explicitly stated in the *Amendment Rule* section (e.g., trying to pass a 4/5 requirement with a 2/3 vote)?
  *   **Criteria:** **YES** if the vote count meets the threshold in the Amendment Rule. **NO** if the proposal claims a higher threshold for itself without first amending the Amendment Rule to allow sub-thresholds.
  *   **Why:** A sub-clause cannot bind the parent clause unless the parent clause allows it. This prevents the "Unanimity Paradox."
  *   **Action:** NO = Reject.

  **4. The Precedence Test (Conflicts)**
  *   **Question:** Does this diff explicitly state which existing precedence clause it obeys (e.g., "This rule supersedes Section 1" or "Subject to Section 1")?
  *   **Criteria:** **YES** if it cites the specific rule it overrides or submits to. **NO** if it is silent on conflict with existing precedence clauses.
  *   **Why:** Prevents the "Old vs. New" war. Forces the author to pick a fight or surrender.
  *   **Action:** NO = Reject.

  **5. The Sunset Test (Self-Consumption)**
  *   **Question:** Does this diff contain a clause that deletes rules automatically (e.g., "repealed after 30 days" or "unused rules deleted")?
  *   **Criteria:** **YES** if it explicitly lists Rule IDs that are *exempt* from this deletion (specifically the Amendment Rule and Definitions). **NO** if it creates a mechanism that could delete the ability to make rules.
  *   **Why:** Prevents accidental suicide of the governance system.
  *   **Action:** NO = Reject.

  **6. The Irreversibility Test (Information Loss)**
  *   **Question:** Does this diff merge, delete, or redefine a rule in a way that makes it impossible to reconstruct the prior state using only the document (ignoring Git history)?
  *   **Criteria:** **YES** if the text retains enough context to revert logically. **NO** if it destroys the semantic meaning (e.g., deleting "Active Member" without a replacement).
  *   **Why:** Git saves the text, but not the *authority*. If you delete the definition of who can vote, you can't vote to restore it.
  *   **Action:** NO = Reject.

  **7. The Clarity Test (Readability)**
  *   **Question:** Can a member read the resulting document and determine their obligations without referencing external discussions or prior versions?
  *   **Criteria:** **YES** if the document stands alone. **NO** if it requires knowledge of the diff to understand the current state.
  *   **Why:** Prevents "hidden law."
  *   **Action:** NO = Reject.

  ---

  ### The "Values Call" Escalation
  If the team answers **MAYBE** to any of the above (e.g., "Is this really a stealth replacement?"), or if the proposal passes all tests but feels dangerous:
  *   **Procedure:** The proposal is paused. The moderators must write a 3-sentence statement: *"This proposal passes technical checks but creates a power shift regarding [X]. We are flagging this for community awareness, not blocking it."*
  *   **Honesty:** This step does not solve the problem. It forces the moderators to admit they are making a political choice, not a procedural one. It shifts the burden of the "Values Call" to the voters, but ensures they are warned.

  ---

  ### What This Procedure Cannot Settle
  You asked for honesty about limitations. This checklist cannot fix the following, even in principle:

  1.  **The Validity of the Checklist Itself:** If the community votes to delete this review procedure, it is gone. This procedure only works as long as the community agrees to honor it. It is a social contract, not a logical proof.
  2.  **The "Grandfather" Paradox:** If a rule was passed 2 years ago that violates these checks (like your "Unanimity" rule), this checklist cannot invalidate it retroactively. It can only block *new* proposals that rely on it. You will have two conflicting validities until the old rule expires or is explicitly repealed.
  3.  **The "Who Guards the Guardians" Problem:** If the moderation team colludes or becomes incompetent, this checklist is just paper. It relies on the moderators answering "NO" when it is unpopular to do so.

  ---

  ### Live Proposal Analysis

  Here is how the Sanity Check handles your three scenarios.

  #### Proposal 1: Redefining "Active Member" for the Current Vote
  *   **Text:** Redefines "Active Member" to include forum readers (90 days). Counts them toward quorum for *this* vote.
  *   **Step 2 (Dependency Test):** **NO.**
      *   *Reasoning:* The validity of the vote depends on the definition of "Active Member." Changing the definition *during* the vote changes the denominator of the quorum while the numerator is being counted. This is a bootstrap paradox.
      *   *Result:* **Rejected as Malformed.**
      *   *Required Rewrite:* The proposal must state: "This definition change takes effect *after* the conclusion of this vote." The current vote must use the *old* definition.
      *   *Honest Take:* This is a power grab. The author wants to dilute the voting pool to ensure passage. The checklist stops this not because it's "unfair," but because it makes the vote mathematically undefined.

  #### Proposal 2: Contributors' Rights (4/5 Amendment Requirement)
  *   **Text:** Adds a section stating "This section may only be amended by 4/5 vote." Does not change the main Amendment Rule (currently 2/3 for everything).
  *   **Step 3 (Hierarchy Test):** **NO.**
      *   *Reasoning:* Your main Amendment Rule says "All changes require 2/3." A sub-clause cannot override the parent rule unless the parent rule allows sub-clauses to set higher bars. If this passes with 2/3, a future group can amend it with 2/3, ignoring the 4/5 claim. The 4/5 claim is legally toothless without changing the Amendment Rule.
      *   *Result:* **Rejected as Malformed.**
      *   *Required Rewrite:* You must amend the *Amendment Rule* itself to say: "Most changes require 2/3, except Section X which requires 4/5."
      *   *Honest Take:* You assumed this was fine. It is not. It creates a false sense of security. It tells the community "This is protected" when it is not. Passing this creates a lie in the document. The checklist forces you to actually entrench it at the top level, which requires a harder fight. This is a values call disguised as drafting; the checklist forces the values call into the open.

  #### Proposal 3: Spam Emergency (Sunset) + Housekeeping (Auto-Repeal)
  *   **Text:** Rule A bans spam, deletes self in 30 days. Rule B deletes any rule unchanged for 2 years.
  *   **Step 5 (Sunset Test):** **NO** (for Rule B).
      *   *Reasoning:* Rule B ("delete unchanged rules") has no exemption list. The Amendment Rule is likely unchanged for long periods. Rule B will eventually delete the Amendment Rule.
      *   *Result:* **Rejected as Malformed.**
      *   *Required Rewrite:* Split into two proposals.
          *   Proposal 3a (Spam): Passes Step 5 (it deletes only itself).
          *   Proposal 3b (Housekeeping): Must be rewritten to say: "Deletes any rule unchanged for 2 years, *excluding* Rule 1 (Definitions), Rule 2 (Amendments), and Rule 3 (Precedence)."
      *   *Honest Take:* Rule A is fine. Rule B is a "logic bomb." Combining them hides the bomb inside a helpful cleanup motion. The checklist forces them apart so the community sees the risk of Rule B in isolation.

  ### Summary of Advice

  1.  **Adopt the Checklist Immediately:** Do not wait for a vote to adopt the checklist. As the current moderation team, declare this the "Standard Operating Procedure for Vote Validation." If challenged, argue that you are not changing the rules, but clarifying the *process* of administering them.
  2.  **Fix the "Unanimity" Mess First:** Before processing new proposals, you must resolve the "Unanimity Rule passed by 2/3" paradox. The Checklist cannot fix this. You need a "Reset Proposal": A motion that explicitly repeals the Unanimity Clause *using the original 2/3 rule*, acknowledging the contradiction. It will be controversial, but leaving it creates a permanent veto point.
  3.  **Accept the Friction:** This procedure will make passing rules harder. That is the point. Your current system allows rules to be passed faster than they can be understood. You are trading speed for stability.
  4.  **The "Values Call" is Your Shield:** When moderators are pressured to pass a toxic but technically valid proposal, use the "Values Call" escalation. It allows you to say, "We aren't blocking this, but we are formally warning you that this changes the power structure." It protects the team from blame while alerting the community.

  This system does not guarantee truth. It guarantees that when you lie, you do it on the record.
