      *   **Geriatrician (G):** G2 (Specific Proxy/Conditional) and G6/G7 (Binding the Earlier Self/Complex Will). G relies on the idea that autonomy includes the right to set conditions for when a directive applies.
      *   **Lawyer (L):** L2 (Bad Proxy/Epistemic) and L3/L4 (Authority/Policy Ratchet). L relies on the idea that ADs must be stable to function as legal/ethical shields against third-party bias, and that subjective metrics undermine that stability.

