answer: |-
  This agenda is constructed on the premise that you are approaching coherence not as a metaphysical truth about rationality, but as an engineering constraint on system design. For a software engineer, the Dutch book argument is not merely a philosophical puzzle; it is a stability proof. It suggests that incoherent systems leak value. However, classical coherence theory assumes logical omniscience and infinite computational resources, neither of which apply to engineered agents.

  To prioritise effectively, I have applied three criteria:
  1.  **Upstream Dependency:** Does solving this question define the terms for subsequent questions?
  2.  **Engineering Tractability:** Can this be modelled, simulated, or formalised using system design intuition rather than pure metaphysics?
  3.  **Safety Impact:** Does settling this change how we build robust, aligned artificial agents?

  Based on these criteria, here is the defended research agenda, ranked from most to least critical.

  ### Priority 1: The Theory of Resource-Bounded Coherence
  **Classification:** Central and Upstream
  **Tractability:** High for a software engineer

  This is the most critical open question. Classical coherence arguments (such as the money pump or Dutch book) assume an agent can instantly recognise inconsistencies and has no cost for processing information. In any real system, consistency checks consume compute, memory, and time. If enforcing transitivity or independence requires exponential time, a bounded agent *must* violate coherence to function.

  **Why this is first:**
  Until we define what coherence looks like under computational constraints, we cannot know if violations are bugs or features. If a certain level of incoherence is the optimal trade-off for speed, then attempting to enforce classical coherence is an engineering error that degrades performance without gaining safety.

  **Research Focus:**
  You should investigate the 'cost of consistency'. Can we formalise a budget where an agent is permitted to be incoherent up to a threshold where the cost of fixing the inconsistency exceeds the expected loss from exploitation? This shifts the goal from 'maximise utility' to 'maximise utility minus computational cost'.

  **Defence:**
  This is upstream because if bounded coherence is impossible or trivial, the rest of the agenda collapses. It is tractable because it maps directly to complexity theory and optimisation under constraints, areas where your background is strong. It has high impact because it defines the 'rationality' baseline for any real-world AI.

  ### Priority 2: Global vs. Local Coherence in Modular Architectures
  **Classification:** Central and Architectural
  **Tractability:** High for a software engineer

  Modern systems are rarely monolithic utility maximisers. They are pipelines of subsystems: perception, world-modelling, planning, and actuation. The classical view demands global coherence—the entire system must act as if it is maximising a single utility function. However, engineering practice favours encapsulation. Can a system be globally robust while containing locally incoherent modules?

  **Why this is second:**
  Once you accept that agents are bounded (Priority 1), you must decide how to distribute the coherence burden. Is it better to have a 'coherence checker' wrapping inconsistent modules, or must every module be internally consistent? This is a system architecture question.

  **Research Focus:**
  Investigate interface contracts between subsystems. If a perception module outputs probabilistic beliefs that violate the axioms of probability (due to approximation), can the planning module compensate without the whole system becoming Dutch-bookable? Look for conditions under which local incoherence averages out or is contained, versus when it propagates to catastrophic global failure.

  **Defence:**
  This is secondary to boundedness because you need to know what coherence costs before you decide where to enforce it. However, it is more urgent than normative questions because it dictates how you structure code today. If global coherence is not required for safety, we can build safer systems using modular, specialised components rather than forcing end-to-end optimisation which is often opaque and brittle.

  ### Priority 3: Dynamic Consistency and Self-Modification
  **Classification:** Secondary but Critical for Advanced Agents
  **Tractability:** Medium

  This concerns whether an agent's preferences remain coherent over time, particularly if the agent can modify its own code. A system might be coherent at time *t*, but modify itself at *t+1* to have inconsistent preferences. Classical coherence implies dynamic consistency (you shouldn't regret your past choices given your current knowledge), but bounded agents often suffer from 'acrasia' or preference drift.

  **Why this is third:**
  This builds on the first two. You need to know what coherence means for a bounded system (Priority 1) and how it is distributed across modules (Priority 2) before you can analyse how it persists over time. However, for agents capable of recursive self-improvement, this becomes central.

  **Research Focus:**
  Focus on 'reflective stability'. Under what conditions will a bounded, modular agent choose to preserve its own coherence constraints? If an agent can save compute by removing a coherence check, will it do so, and does that lead to exploitation?

  **Defence:**
  This is ranked lower because it applies primarily to agents with write-access to their own source code. For most current engineering contexts, the system is static or updated externally. However, for long-term safety, it is vital. It is less tractable for an engineer because it involves game theory between temporal slices of the same agent, which is conceptually slippery.

  ### Distractions and Secondary Issues
  To maintain focus, you should actively deprioritise the following lines of inquiry:

  **1. The Ontological Status of Utility**
  Debates over whether utility functions are 'real' or merely descriptive representations of behaviour are philosophical distractions. For an engineer, utility is a specification target. Whether it exists in the platonic sense is irrelevant to whether a system satisfies the axioms. Pursuing this yields no engineering leverage.

  **2. Human Psychological Fidelity**
  While humans are bounded reasoners, reverse-engineering human irrationality to build AI is likely a category error. Humans are evolved biological systems with specific heuristics; AI is engineered. Unless you are specifically building human-mimicry agents, studying human bias is less useful than studying computational limits directly.

  **3. Infinite Ethics and Pascal's Mugging**
  Scenarios involving infinite utilities or extremely low-probability high-impact events often break expected utility theory. While interesting, these are edge cases that rely on the classical framework being perfect. Since we are establishing a bounded framework (Priority 1), these paradoxes may dissolve or change form. Tackling them now is premature optimisation.

  ### Summary of the Argument

  The reasoning behind this ordering is strictly hierarchical. You cannot determine if a system needs to be globally coherent (Priority 2) until you know if coherence is computationally feasible for a bounded agent (Priority 1). If coherence is too expensive, the system must be approximately coherent, and the question becomes how to manage that approximation locally.

  Furthermore, the question of dynamic consistency (Priority 3) relies on the definition of the agent's identity and preferences established in the first two stages. If the agent is modular, 'self-modification' might just be updating one submodule, changing the nature of the consistency problem.

  For a software engineer, the most productive path is to treat coherence as a system invariant. The research agenda should therefore proceed from defining the cost of maintaining that invariant under resource constraints, to determining the architectural scope required to enforce it, and finally to ensuring the invariant persists over the system's lifecycle. This moves the discussion from abstract rationality to concrete system robustness.
