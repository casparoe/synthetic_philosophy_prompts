answer: |-
  Friends, colleagues, neighbors, and guests.

  We stand today in a building that pretends to be neutral. It is made of glass and steel and concrete, materials that suggest transparency and permanence. We call this an Institute. We speak of "inauguration," a word that implies a beginning, a clean break from what came before. But anyone who has walked the halls of history knows that there are no clean breaks. There is only the layering of sediment, the overwriting of text, the construction of new rooms around old ghosts.

  I am a novelist. My trade is in lies that tell the truth. For years, I have written about cities that refuse to bury their dead. In my books, the monuments are more honest than the archives because the stone admits it is a monument, while the archive claims to be merely a record. I have been asked to speak here because this building is, in essence, a monument to a specific problem. It houses four galleries. They are adjacent, yet they are structurally unequal. One room holds the meticulous confessions of Germany's postwar conscience. Another holds the fractured, bifurcated narratives of Japan's war memory. A third holds the suppressed archives of the Armenian experience in Turkey. The fourth holds the dismantled statues of the American Lost Cause.

  To place these things side by side is to invite a charge of false equivalence. I am here to tell you that if you expect this Institute to equate these sufferings, you will be disappointed. If you expect it to harmonize them into a chorus of global grief, you will be angry. The German regime of truth is not the Turkish regime of truth. The silence of a survivor in Anatolia is not the silence of a grandson of a Confederate soldier in Virginia. To treat them as variations on a single theme is an insult to the particularity of the pain.

  However, to refuse to compare them is to retreat into a polite pluralism that says, "Each culture remembers in its own way, and who are we to judge?" That is a luxury we cannot afford. That is the logic of the isolated silo, the logic that allows jurisdiction to operate without scrutiny.

  We are here to study not the content of the memory, but the architecture of the remembering. We are here to examine the tension between two forces that are constantly at war within these walls. I call them *Mnemonic Jurisdiction* and *Mnemonic Inheritance*.

  Mnemonic Jurisdiction is the claim of the state to own the past. It is the law that dictates what can be taught in schools. It is the urban planning decision to place a memorial here rather than there. It is the court ruling that defines a crime, or the treaty that declares a war finished. Jurisdiction seeks coherence. It wants the past to be organized, cataloged, and ultimately, resolved. It wants to build a gallery where the exhibit has a beginning, a middle, and an end. Jurisdiction wants to close the case so that the present can function without the burden of the dead.

  Mnemonic Inheritance is what escapes that control. It is the unscripted transmission of trauma through family silence. It is the folklore that contradicts the textbook. It is the object kept in a drawer, the name whispered at a dinner table, the dream that repeats across three generations. Inheritance does not care about legal finality. It does not care about the coherence of the nation-state. It is messy, emotional, and often irrational. It is the stain on the floor that the janitor cannot scrub away.

  The central argument of this Institute, and the argument I ask you to carry with you, is this: Jurisdiction and Inheritance are not partners. They are antagonists. Every act of Jurisdiction tends to displace Inheritance. Every act of Inheritance undermines the coherence that Jurisdiction demands.

  Look at the German gallery. Here, Jurisdiction has attempted a remarkable feat. The state has taken ownership of the guilt. It has built a landscape of contrition. Laws forbid the denial of the Holocaust; curriculums mandate the study of the perpetrator. This is Jurisdiction attempting to sanitize the Inheritance, to replace the silence of the fathers with the speech of the state. But listen to the Inheritance. It is found in the private shame that no law can legislate away, in the family names that were changed, in the psychological weight that sits on a generation that did not light the fires but must live in the ash. The state says, "We remember." The family asks, "What did *you* do?"

  Now, walk to the Japanese gallery. Here, Jurisdiction is bifurcated. The state sponsors peace museums that emphasize victimhood—the bomb, the fire—while simultaneously honoring the war dead at shrines that obscure the cause of the war. The Jurisdiction is split, offering two official maps for the same territory. The Inheritance lives in the confusion of the grandchildren, who inherit both the narrative of the atomic tragedy and the silence regarding the occupation of neighbors. The state does not seek to resolve the guilt as Germany does; it seeks to manage the ambiguity. The Inheritance suffers the friction of that ambiguity.

  Consider the Turkish gallery. Here, Jurisdiction is enforced amnesia. It is the law that criminalizes the mention of 1915. It is the erasure of place names. It is the curriculum that teaches a homogeneous history. Jurisdiction here acts as a wall. But Inheritance is water; it seeps through the cracks. It is the Armenian name that a family still knows but does not speak. It is the deed to a house that no longer exists, kept in a tin box. The harder the Jurisdiction pushes down, the more pressurized the Inheritance becomes. It does not disappear; it goes underground, becoming more potent, more dangerous to the state's narrative.

  And finally, the American gallery. Here, we see Jurisdiction in flux. For a century, the Jurisdiction of the South was the statue in the town square. It was the law of segregation. It was the textbook that called the war a "conflict of ideals." Now, the Jurisdiction is shifting. Statues are being dismantled. They are brought here, to this room. But notice: removing the statue is an act of Jurisdiction, just as erecting it was. The state is trying to manage the memory by removing the offending object. But the Inheritance remains in the soil. It is in the neighborhood boundaries that still hold, in the family stories of resistance and of defiance, in the unhealed wound that does not need a bronze general to remain open. The statue is gone, but the Jurisdiction of the landscape remains.

  Why, then, do we compare them? If these regimes of truth are incompatible, why house them in the same building?

  We compare them not to rank the suffering, but to understand the mechanism of power. If we treat each case as entirely unique, we fall into the trap of thinking that memory is merely a cultural preference, a matter of taste. We allow the officials in this room to think that Turkey's denial is just "their way" of doing things, or that America's statues are just "our heritage."

  No. By placing them side by side, we reveal the structural anatomy of Mnemonic Jurisdiction. We see that whether the state is confessing, splitting, denying, or removing, it is always trying to do the same thing: it is trying to govern the dead so it can govern the living.

  To the historians and archivists in the room: I know your fear. You fear that comparison dilutes specificity. You fear that putting the Armenian archives next to the Confederate statues suggests a moral equation. I assure you, it does not. The equation is not in the suffering; it is in the struggle. Your work here is to protect the specificity of the Inheritance against the smoothing hand of Jurisdiction. Do not let this Institute become a place where the state comes to certify its own memory. Your role is to be the friction. When the state says "We have remembered," you must show what has been forgotten. When the state says "This is resolved," you must show where the inheritance is still bleeding.

  To the municipal officials, donors, and neighbors: I know your hope. You hope this building will bring closure. You hope that by studying memory, we can move past it. You want to know why we cannot just let each group remember in their own way. The answer is that memory is not private. It is the ground we walk on. When Jurisdiction suppresses Inheritance, it does not create peace; it creates instability. A society built on enforced amnesia is a society built on a fault line. A society built on romanticized defeat is a society waiting for the next war.

  You need to understand that comparison is not an insult to particular suffering. It is the only way to diagnose the health of the public square. If we do not compare, we cannot see how Jurisdiction operates. We cannot see how the law, the curriculum, and the city plan are used to organize grief. If we retreat into pluralism, we surrender the past to the highest bidder. We allow the state to claim that its version of events is the only one that matters because it is the only one that is "official."

  This building is not a mausoleum. It is not a place to put the past to rest. It is a laboratory for a conflict that will not end. The structural inequality of the galleries is intentional. It reminds us that the playing field is not level. The German archives are voluminous; the Armenian archives were scattered and suppressed. The Japanese narratives are contested in the highest courts; the Confederate statues were removed by municipal order, often under duress.

  We must not try to fix this inequality. We must study it.

  The danger of this Institute is that it will become an act of Mnemonic Jurisdiction itself. It is a building. It has a budget. It has a board of directors. It will produce reports. It will try to make sense of the chaos. In doing so, it risks displacing the very Inheritance it claims to house. It risks turning the scream into a specimen.

  I urge you to resist this. Let the galleries remain unequal. Let the silences remain silent. Do not try to curate the trauma into a coherent narrative. If you walk out of here today feeling comfortable, if you feel that we have "honored" everyone equally, then we have failed. We have succeeded only if you feel the tension. We have succeeded if the historian feels the pressure of the state, and the official feels the instability of the ground beneath them.

  Mnemonic Inheritance will always undermine Mnemonic Jurisdiction. The child will always ask the question the textbook cannot answer. The object found in the attic will always contradict the official report. The ghost will always return to the house that was built to exclude it.

  This Institute cannot stop that. It should not try. Its purpose is to provide a space where that antagonism can be witnessed without being immediately suppressed. It is a place where we admit that the state does not own the dead. The dead belong to the living who carry them, often against the will of the law.

  We are not here to bury the past. We are here to admit that it is unburiable. The cities I write about, the cities you live in, they are all necropolises. We walk on layers of the unacknowledged. The difference is whether we admit it.

  Germany admits it and tries to manage it. Japan manages it by splitting it. Turkey denies it. America is currently fighting over how to remove the evidence of it.

  None of these are solutions. They are strategies of survival for the state. But for the human being, for the descendant, for the citizen, the only way forward is through the friction.

  So, let us open these doors. Let us walk into the unequal rooms. Let us not look for the similarities in the pain, but look for the similarities in the power. Look at how the law tries to shape the grief. Look at how the grief refuses to be shaped.

  If you are a historian, protect the fragment. If you are an official, accept the instability. If you are a neighbor, listen to the silence of the person next to you.

  We are building an archive of the conflict between the law and the blood. It will not be a comfortable place. It will not be a quiet place. But it must be an honest one.

  The dead are not buried. They are waiting. And they are not waiting for our judgment. They are waiting for our acknowledgment that we do not own them.

  Thank you.
