answer: |-
  1. Suppose a neural recorder reconstructs a narrative you do not recognize. Is the recording false?
     - Yes (Only Report Truthful): Go to 2.
     - No (Memory Fallible): Go to 3.

  2. Suppose a lucid dreamer signals with eye movements from within REM. Did the counting happen *during* the signal?
     - No (Waking Impression): **Malcolm**. (Awkward: Lucid signals are merely coincidental bodily movements.)
     - Yes (Concurrent Experience): Go to 7.

  3. Suppose a patient enacts a punch while asleep but later denies having dreamt it. Did they dream it?
     - No (No Dream Without Report): **Orthodox (Strict)**. (Awkward: Must deny behavioral evidence of sleep experience.)
     - Yes (Unconscious Dream): Go to 4.

  4. Suppose you dream of a cat but do not recall its color. Was there a fact about the color then?
     - No (Indeterminate Content): **Dennett**. (Awkward: Denies the intuition of a fully formed private show.)
     - Yes (Determinate Content): Go to 5.

  5. Suppose you are awakened mid-dream and your report breaks off mid-action. Was the dream interrupted?
     - No (Instant Cease): **Undefended**. (Awkward: Posits experience but denies temporal continuity.)
     - Yes (Continuous Process): Go to 6.

  6. Suppose you dream a long journey but sleep only five minutes. Was the experience compressed?
     - No (Meaningless Claim): **Undefended**. (Awkward: Accepts experience but denies temporal metric.)
     - Yes (Real Duration): **Orthodox (Standard)**. (Awkward: Commits to private facts inaccessible even to neuroscience.)

  7. Suppose you resume a dream later in the same sleep. Is it the same dream?
     - No (Fragmented): **Constitutive (Fragmented)**. (Awkward: Experience exists but is created by disjointed reports.)
     - Yes (Continuous): **Constitutive (Continuous)**. (Awkward: Experience exists but is defined by waking narration.)

  **Commentary**
  This instrument mis-sorting risk lies in the "Orthodox (Strict)" leaf; many common-sense realists accept unconscious dreams, collapsing them into the Dennett/Orthodox (Standard) path. Malcolm and Dennett are cleanly separated at Node 1 (Authority vs. Fallibility) and Node 4 (Determinacy). No leaves are indistinguishable, though Constitutive (Fragmented) and (Continuous) differ only on resumption intuitions. The "Undefended" leaves occupy logical space no major philosopher defends, serving as foils. If Malcolm and Dennett collapsed, it would be on Node 1 if one argued memory is fallible but reports constitute truth; the Neural Recorder case prises them apart by forcing a choice between third-person data and first-person authority.
