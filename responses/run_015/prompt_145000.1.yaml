answer: |-
  Good morning, everyone. It's a privilege to welcome you to this workshop. I know we have a room split between those who have spent years wrestling with Spinoza's Latin and those who spend their weekends wrestling with university administration. That is exactly where we need to be. Because Spinoza isn't just writing about metaphysics or ancient Hebrews; he is writing about how we live together when power is uneven.

  We often hear that Spinoza is a democrat. And he is. He argues that democracy is the most natural form of government. Why? Because it comes closest to the state of nature. In a democracy, no one transfers their natural right to a sovereign so completely that they cease to be a citizen. Everyone remains, roughly, under their own power. The collective decision is just the sum of individual powers aligned by reason.

  But there is a tension here that we need to face immediately. Spinoza's democracy isn't universal. He explicitly excludes anyone not *sui juris*—not under their own power. In his context, this meant servants, dependents, and foreigners. He argues that if your livelihood depends entirely on another, your vote isn't truly yours. You are an instrument of someone else's will. For the philosophers in the room, this is a textual fact. For the organizers in the room, this sounds like the history of every exclusionary voting law ever written.

  This brings me to us. Specifically, to this student center.

  We like to say this center runs on direct democracy. Every member gets a vote. But as many of you know, there is an inside joke about our "open" voting system. Technically, every ballot is counted. But administratively, those votes are weighted by an algorithm based on "institutional loyalty metrics." If you volunteer for admin committees, your vote counts for more. If you organize protests, it counts for less.

  So, here is the Spinozist question for this workshop: Is this algorithmic weighting a form of democratic rationality, or is it monarchy disguised as consultation?

  On one hand, you could argue this is very Spinozist. Spinoza worries about the mob. He wants a state guided by reason, not passion. Maybe the administration argues that "loyalty" is a proxy for "commitment to the common good." They are filtering out the noisy passions to ensure the center remains stable and rational. They are trying to ensure the voters are truly *sui juris*, independent enough to understand the institution's needs.

  But I think this misunderstands what Spinoza means by power. For Spinoza, power isn't obedience. Power is the capacity to act and to think. A system that weights voice based on loyalty isn't filtering for reason; it is filtering for compliance. It treats dissent not as a contribution to collective rationality, but as a defect in citizenship.

  When Spinoza excludes dependents, he does so because he believes their will is subsumed by a master. When this algorithm weights votes by loyalty, it effectively says that those who challenge the institution are dependents of their own anger, while those who serve the institution are the only independent actors.

  This leads me to a verdict. This setup is not Spinozist democracy. It is monarchy disguised as consultation.

  In a Spinozist democracy, the goal is to maximize the *potentia*—the power of acting—of the multitude. Conflict and disagreement are necessary friction to arrive at rational agreement. By dampening the votes of the critical voices, the algorithm doesn't produce a more rational outcome; it produces a quieter one. It creates a sovereign power that listens only to its own echo. That is not the natural equality Spinoza describes. That is a sovereign treating the multitude as subjects whose input is only valid when it confirms the sovereign's existing will.

  So, as we move into the panels, I hope we don't just ask what Spinoza said about democracy. I hope we ask what Spinoza would say about us. When we claim to be democratic, are we building collective power, or are we just weighting the votes of the loyal?

  Spinoza teaches us that freedom isn't given; it is constructed through the equal power of thinking beings. Let's spend the next two days figuring out how to build that here, without the algorithm.

  Thank you.
