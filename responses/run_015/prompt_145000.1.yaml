      *   *Democracy as Natural:* In the *Theological-Political Treatise* (TTP) and *Political Treatise* (TP), Spinoza argues democracy minimizes the transfer of natural right because everyone remains roughly equal. It's the most natural because it aligns individual power with collective power.
      *   *The Multitude:* Not everyone counts. Only those *sui juris* (under their own power). Dependents (women, servants, foreigners in his context) are excluded because their reason/will is supposedly subsumed by others.
      *   *Rationality vs. Headcount:* Spinoza isn't a simple majoritarian. The goal is freedom and rationality. A mob isn't necessarily democratic in the Spinozist sense if it's driven by passion rather than reason. The state aims to increase the power of acting (*potentia agendi*).
