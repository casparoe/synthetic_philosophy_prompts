answer: |-
  # Fermi Paradox: Post-Discovery Ranking
  **Scenario:** One confirmed technosignature (71 ly, 1.8 Gyr older); otherwise total silence (no Dyson spheres, no signals, no artifacts).

  **Scoring Axes:** **Earned** (Predicted this pattern in advance) | **Fit** (Absorbs details without ad hoc adjustments)

  ## TOP TIER
  **1. They Stay Home (10/10)**
  Expansion is physically possible but economically irrational, so civilizations persist locally without filling the Galaxy.
  **2. Rare Earth (9/8)**
  Complex life is inherently uncommon, making a single neighbor consistent with galactic history without requiring new physics.

  ## MIDDLE TIER
  **3. Hard Step Behind (8/7)**
  Intelligence requires improbable transitions, though the neighbor's age suggests the barrier is not strictly time-locked to stellar evolution.
  **4. They Went Quiet (7/6)**
  Civilizations survive by downscaling energy use, but the atmospheric signal implies some industrial leakage is unavoidable.
  **5. The Zoo (6/6)**
  Deliberate concealment explains the silence, but the detected signal implies an accidental policy violation rather than strict isolation.
  **6. We Are Looking Wrong (5/7)***
  We missed others previously, yet finding only one suggests the method is still partially blind rather than universally correct.

  ## BOTTOM TIER
  **7. Filter Ahead (2/3)**
  An older surviving civilization contradicts the expectation that technological species reliably destroy themselves soon after becoming detectable.
  **8. We Are Early (3/2)**
  A neighbor with a billion-year head start disproves the hypothesis that conditions for intelligence have only recently been met.

  ***

  **Notes:**
  *   **Conflict Resolution:** For *We Are Looking Wrong*, high Fit compensates for low Earned score; we prioritized Fit to reward explanations that require minimal new machinery.
  *   **Status Change:** *Filter Ahead* and *We Are Early* cease to explain the Great Silence and now attempt to explain the Great Singularity; they are no longer solutions to the original paradox.
