answer: |-
  **Workshop Title:** The Obligation Gap: Decoupling Betterness from Ought in Infinite Ethics

  **Abstract:**
  Infinite ethics debates typically stall at the axiological level: we argue over whether infinite outcomes are comparable, often resorting to exotic mathematics or embracing scepticism. This workshop proposes a diagnostic shift. The problem may not be that we cannot rank infinite outcomes (axiology), but that ranking them fails to generate action-guiding obligations (practical reason). We will explore the hypothesis that infinite structures sever the link between "A is better than B" and "You ought to choose A," not because value vanishes, but because practical reason requires a determinacy that open-ended populations withhold.

  ---

  ### 1. The Precise Question
  Can we coherently separate 'better-than' relations from 'ought-to-do' relations in infinite contexts, and does this distinction dissolve standard paradoxes without requiring new axiological mathematics?

  Specifically: If we grant that Outcome A is axiologically superior to Outcome B in an infinite setting, does it follow that an agent is obligated to bring about A? Or does the infinite nature of the population create an "obligation gap" where comparative value exists but practical reason lacks the closure required to issue a command?

  ### 2. Why Existing Approaches Leave This Open
  Current literature generally bifurcates into two camps, both of which overlook the practical reason bottleneck:
  *   **The Maximizers:** Attempt to repair the 'better-than' relation using hyperreals, domination principles, or spatiotemporal expansions. They assume that if we can fix the math of comparison, the 'ought' will follow automatically. They leave open why a fixed comparison should guide action in a causally diluted infinite context.
  *   **The Sceptics:** Argue that infinite comparisons are impossible or meaningless, leading to axiological nihilism. They leave open the possibility that value remains intact even if comparison is difficult, and they fail to address why practical reason specifically (rather than value theory) is the point of failure.

  Both approaches assume the bridge between value and obligation is intact. This workshop challenges the bridge itself.

  ### 3. Session Structure (90 Minutes)
  **Part I: The Diagnostic Shift (20 mins)**
  *   Brief presentation sketching the distinction between *Axiological Ranking* (is A > B?) and *Deontic Closure* (does A > B imply I must do A?).
  *   Argument: Practical reason requires "closure" (a definitive endpoint for deliberation). Infinite populations introduce structural open-endedness (e.g., causal dilution, unbounded side effects) that prevents closure, even if ranking is possible.

  **Part II: Stress-Testing the Distinction (45 mins)**
  *   Interactive application of the framework to two classic cases:
      1.  **The Infinite Paralysis:** If the universe is infinite, my actions change only a finite amount of value. Does the 'better-than' relation hold for my specific action? If yes, why does the 'ought' vanish?
      2.  **The Spatial/Temporal Expansion:** Saving 10 people vs. 5 people in a universe that already contains infinite people.
  *   Participants break into small groups to determine if the "Obligation Gap" explains their intuitions better than axiological scepticism.

  **Part III: Failure Conditions & Scope (25 mins)**
  *   Group discussion on when this framework fails (see below).
  *   Summary of scope: We are not solving infinite ethics; we are relocating the problem from value theory to the theory of practical reason.

  ### 4. Failure Conditions
  This proposal fails if:
  *   **The Collapse:** Participants demonstrate that 'better-than' conceptually entails 'ought' (internalism), making the separation incoherent. If one cannot logically hold "A is better but I shouldn't do it," the distinction collapses.
  *   **The Redundancy:** The "Obligation Gap" turns out to be just axiological scepticism in disguise. If the reason we lack an 'ought' is simply because we lack a determinate 'better,' we haven't moved the goalposts; we've just renamed the problem.
  *   **The Determinacy Premise:** It turns out practical reason does *not* require closure. If agents can be rationally obligated to act even in structurally open-ended contexts (e.g., "do the best you can, even if 'best' is undefined"), the core mechanism of the argument breaks.

  ### 5. Honest Scope
  In 90 minutes, we cannot resolve the mathematical complexities of infinite set theory in ethics. Nor can we definitively prove the nature of practical reason.
  *   **Achievable:** Establishing the plausibility of the 'Obligation Gap' as a distinct category of problem.
  *   **Not Achievable:** Providing a complete normative theory for infinite agents.
  *   **Goal:** To shift the burden of proof. Instead of asking "How do we compare infinities?", participants leave asking "What conditions must hold for a comparison to generate an obligation?"

  ---

  ### Confidence Assessment & Uncertainty

  **Confidence in Framing: High**
  The proposal is philosophically coherent and addresses a genuine stagnation in the literature. Relocating the problem from axiology to practical reason is a robust move that avoids the mathematical quagmires that usually bog down these workshops. It offers a fresh heuristic for participants to use immediately.

  **Area of Least Certainty: The Requirement for Determinacy**
  I am least sure about the premise that *practical reason requires closure/determinacy*.
  *   **The Risk:** Some theories of rational choice allow for "vague" obligations or "do your best" maxims in the absence of determinate optimality. If practical reason can tolerate indeterminacy (e.g., "It is permissible to choose either, though one is better"), then the infinite structure doesn't break obligation; it just weakens it.
  *   **Implication:** If practical reason *doesn't* need closure, the "Obligation Gap" might not exist. The workshop needs to treat this premise as a hypothesis to be tested in Part II, rather than an established fact.
