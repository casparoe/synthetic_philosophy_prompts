  | State | Probability | $H$ (Rare) | $\neg H$ (Common) | Total |
  | :--- | :--- | :--- | :--- | :--- |
  | **$E \land F$** (Wing & Tail) | $0.475$ | $0.4275$ | $0.0475$ | **$0.475$** |
  | **$E \land \neg F$** (Wing, No Tail) | $0.025$ | $0.0225$ | $0.0025$ | **$0.025$** |
  | **$\neg E \land F$** (No Wing, Tail) | $0.025$ | $0.0025$ | $0.0225$ | **$0.025$** |
  | **$\neg E \land \neg F$** (No Wing, No Tail) | $0.475$ | $0.0475$ | $0.4275$ | **$0.475$** |
