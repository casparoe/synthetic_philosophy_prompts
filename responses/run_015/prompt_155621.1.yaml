  1.  **Update $E$:** She is quite sure about the wing. Target confidence **$P'(E) = 0.95$**.
  2.  **Update $F$:** She is quite sure the tail is *not* there (perhaps the blur obscured it, or she realized what she saw was a shadow). Target confidence **$P'(F) = 0.15$**.
      *(Note: Both targets are within your 0.05–0.95 constraint.)*

