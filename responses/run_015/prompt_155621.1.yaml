  ### Independence Check

  You hypothesized that if $E$ and $F$ were independent, the order wouldn't matter. **You are correct.**

  If we change the prior so that $P(E \land F) = P(E)P(F) = 0.25$ (and adjust the other cells to match), the "drag" disappears.
  *   Updating $E$ no longer changes $P(F)$.
  *   Updating $F$ no longer changes $P(E)$.
  *   The conditional probabilities $P(H|E)$ and $P(H|F)$ remain unaffected by the other update.
  *   **Result:** The final $P(H)$ is identical ($\approx 0.71$) regardless of order.
  *   **Conclusion:** Correlation between the evidence propositions is the *necessary condition* for the order to matter.

