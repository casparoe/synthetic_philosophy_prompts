  **Scenario**
  In a mid-sized accounting firm, there is exactly one person officially registered as "The Department Head" in the company bylaws, Elena, who is currently on medical leave. During her absence, her subordinate, Marcus, has been performing all head duties, and an internal memo circulated weeks ago informally instructing staff to "direct all approvals to Marcus." Neither the bylaws nor the HR system have been updated to reflect Marcus's temporary authority. During a routine audit, a senior accountant says to a colleague, gesturing toward a signed ledger on Marcus's desk, "The Department Head signed off on these figures." The untutored verdict is that the accountant spoke truly; the figures were approved by the person functioning as the head. However, Elena (the unique official satisfier) did not sign them; Marcus (the referent) did.

  **Show Your Work**

  *   **Russellian Proposition:** $\exists x (Head(x) \land \forall y (Head(y) \rightarrow y=x) \land Signed(x))$.
      *   **Truth Value:** **False**.
      *   **Reason:** There is exactly one official Department Head (Elena), and she did not sign the figures. The quantificational condition binds the predicate to the unique satisfier of the description, not the person the speaker had in mind.
  *   **Singular (Referential) Proposition:** $Signed(Marcus)$.
      *   **Truth Value:** **True**.
      *   **Reason:** The description was used to pick out Marcus. The proposition is singular about him, and he did sign the figures. The failure of the description to fit him (he is not the *official* head) is irrelevant to the truth of the singular claim.
  *   **Feature Doing the Work:** **The gap between semantic satisfaction and speaker reference.** The unique satisfier of the description (Elena) is distinct from the object referred to by the speaker (Marcus).
  *   **If You Delete It:** If you eliminate the gap (i.e., Marcus is also the official Head), the description fits the referent. Both theories then evaluate whether *that* person signed. The truth values converge (both True), and the philosophical dispute evaporates. If you eliminate the uniqueness (no official Head), it becomes an empty description case, which tests existence presuppositions rather than the referential/attributive split.
  *   **Strongest Russellian Reply:** **Kripke's Pragmatic Defense.** The Russellian argues that the speaker *did* say something false (semantic reference = Elena), but successfully *communicated* something true (speaker reference = Marcus). The intuition that the speaker "said something true" conflates what is literally said with what is pragmatically conveyed. The accountant lied or spoke loosely, but was understood correctly; this explains the untutored verdict without abandoning Russell's semantics.

  **Constraint Relaxation Note**
  I have relaxed the constraint that **"the speaker is neither confused nor badly informed about the object they mean."** This relaxation is unavoidable. For the truth-values to split, the referent must differ from the unique satisfier. If the speaker is sincere and speaking literally, they must believe the referent *is* the satisfier. Therefore, they must be mistaken about the satisfaction conditions (here, the official bylaws vs. functional role). This distinguishes the case from the classic "Martini" example not by removing error, but by making the error **institutional/testimonial** (relying on the memo) rather than **perceptual** (misseeing water as martini), showing the problem lies in the semantics of descriptions themselves, not just in fallible senses.
