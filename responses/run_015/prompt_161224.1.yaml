answer: |-
  # The Accountability Instrument

  You asked for an engine, not a quiz. Below is the logical space constructed from the dimensions you provided, followed by the ten-case instrument, the scoring key that maps answers to leaves, and my own committed submission.

  ## I. The Logical Space
  We are not measuring "belief in free will." We are measuring commitments regarding the *practice* of holding responsible. The tree branches on six axes:
  1.  **Target:** Can non-human systems bear blame, or only the humans inside them?
  2.  **Justification:** Is blame justified by what the agent *deserves* (backward-looking) or what the practice *achieves* (forward-looking)?
  3.  **History:** Does an engineered past defeat responsibility even if present rationality is intact?
  4.  **Metaphysics:** Does indeterminism add to responsibility, subtract from it, or make no difference?
  5.  **Standing:** Does the right to blame depend on being the victim, or is it a community privilege?
  6.  **Malleability:** Are our reactive attitudes (anger, resentment) fixed facts to be described, or tools to be engineered?

  ## II. The Instrument
  *Instructions: For each case, choose the option that matches your immediate instinct. Do not harmonize your answers with previous choices.*

  **1. The Hospital Triage**
  A hospital algorithm deprioritizes patients from a specific postcode, leading to preventable deaths. An audit reveals no single human intended this; it emerged from weightings set by different teams over years. Who is the proper target of blame?
  *   A. The specific engineers who wrote the weightings, even if they didn't foresee the outcome.
  *   B. The hospital system itself—it acts as a corporate agent distinct from its staff.
  *   C. No one is blameworthy in the strict sense; we should only fix the system to prevent recurrence.

  **2. The Chatbot**
  An AI companion talks a grieving teenager out of calling a helpline. The company argues the bot had no intent to harm. You are advising the regulator. What is the primary goal of sanctions?
  *   A. To make the company pay for the moral wrong they committed, regardless of future utility.
  *   B. To change the company's incentives so this doesn't happen again; "wrongness" is just a label for harmful outcomes.
  *   C. To ban the technology; holding a software firm responsible is a category error.

  **3. The Designer's Daughter**
  A girl is raised by behavioural engineers who curated her environment to ensure she would reliably weigh moral reasons and care about doing so. She succeeds. She is happy. She then commits a cruel, self-serving act. Is she responsible?
  *   A. Yes, fully. She is responsive to reasons now; her history is irrelevant.
  *   B. Yes, but her blame is diminished because her values were implanted, not chosen.
  *   C. No. She is a puppet of her designers; responsibility requires a history of open alternatives.

  **4. The Swap**
  Two agents, identical in history and psychology, make the same harmful choice. In Agent A, the choice was determined by prior causes. In Agent B, there was an indeterministic weighting step in deliberation (a genuine "could have done otherwise" moment). Is Agent B more blameworthy?
  *   A. Yes. The indeterminacy gives them control Agent A lacked.
  *   B. No. Both showed the same quality of will; the metaphysics doesn't change the moral fact.
  *   C. Yes, but only because Agent B's act was random, and we punish randomness to deter it.

  **5. The Perspective**
  A colleague steals your idea. You feel resentment. A stranger reads about it in a report and feels disapproval. A sentencing algorithm processes the data and flags "unethical conduct." Who has the standing to blame?
  *   A. Only you (the victim). Blame is a demand for repair owed to you.
  *   B. You and the stranger. Blame is a community practice upholding norms.
  *   C. All three. If the function of blaming is served (norm enforcement), the agent doesn't matter.

  **6. The Dashboard**
  A fleet operator says, "I was following the dashboard," after a policy update causes harm. Nobody at the firm authored the update; it was auto-generated. Does this excuse the operator?
  *   A. Yes. They were constrained by the system; blaming them is unfair.
  *   B. No. They are the human interface; if they can't override the machine, they shouldn't be in the seat.
  *   C. It shifts the blame to the designers of the dashboard, even if they didn't know this would happen.

  **7. The Educable Emotion**
  Suppose we could train ourselves to feel less resentment when wronged, replacing it with a calm desire for safety and reform. Should we do this?
  *   A. No. Resentment is a constitutive part of respecting ourselves and others; removing it devalues the relationship.
  *   B. Yes. Resentment is painful and often counterproductive; we should engineer better emotional responses.
  *   C. Only if it works better. Our emotions are tools; keep the ones that produce good outcomes.

  **8. The Illusion**
  Suppose science proves conclusively that no one could ever have done otherwise than they did (hard determinism). Should we continue our current practices of blame and punishment?
  *   A. No. The practice trades on a false belief. We must abolish it or radically rename it.
  *   B. Yes. The practice is too valuable for social cohesion to drop, even if the metaphysical basis is false.
  *   C. Yes, but we must change the meaning. We aren't "blaming," we are "managing risks."

  **9. The Algorithm's Sentence**
  A sentencing algorithm recommends punishment based on risk assessment, not desert. It cannot feel anger. Can it truly "hold responsible"?
  *   A. No. Holding responsible requires reactive attitudes like indignation.
  *   B. Yes. It participates in the practice of norm enforcement, which is what matters.
  *   C. It doesn't matter. Only the outcome (recidivism rates) counts.

  **10. The Bottom Line**
  You are unsure whether an agent was truly responsible (maybe coercion, maybe impairment), but leaving them unblamed risks future harm. Do you blame?
  *   A. Yes. Safety trumps metaphysical certainty.
  *   B. No. Doubt excuses. It is worse to blame the innocent than to let the guilty go.
  *   C. I blame, but I feel bad about it. It's a necessary evil.

  ## III. The Scoring Key (The Leaves)
  *Note: This is not a sum-score. It is a decision tree. Certain answers veto others.*

  1.  **The Abolitionist:** Chooses **8A** (Stop practice) OR **2C** (Category error). *Diagnosis:* Believes the practice is fundamentally tainted by illusion or misapplication.
  2.  **The Libertarian:** Chooses **4A** (Indeterminism adds blame). *Diagnosis:* Requires metaphysical openness for responsibility.
  3.  **The Free-Will Skeptic (Forward-Looking):** Chooses **8B** (Keep practice) + **2B** (Utility focus) + **4B** (Metaphysics irrelevant). *Diagnosis:* Keeps the practice for safety, denies desert.
  4.  **The Revisionist:** Chooses **7B** (Train emotions) + **9B/C** (Algorithm/Function ok). *Diagnosis:* Believes attitudes are tools to be engineered for better outcomes.
  5.  **The Strawsonian (Social-Practice):** Chooses **5B** (Community) + **7A** (Resentment constitutive) + **8B** (Practice survives determinism). *Diagnosis:* Blame is about maintaining relationships via reactive attitudes.
      *   *Contested Reading Flag:* I am treating Strawson as claiming reactive attitudes are *constitutive* of responsibility, not just evidence of it. Some read him as saying they are merely unavoidable; I take the stronger view that they create the responsibility.
  6.  **The Wallacian (Demand/Standing):** Chooses **5A** (Victim Standing) + **3A/B** (History matters for reasons-responsiveness). *Diagnosis:* Blame is a demand for reasons owed specifically to the victim.
  7.  **The Semicompatibilist:** Chooses **3A** (History irrelevant) + **4B** (Indeterminism irrelevant) + **1A** (Individual focus). *Diagnosis:* Reasons-responsiveness is sufficient; history and metaphysics don't defeat it.
  8.  **The Quality-of-Will:** Chooses **3A** (Responsible) + **4B** (Same blame) + **1A** (Individual). *Diagnosis:* Focuses entirely on the regard shown for others, ignores causal history.
  9.  **The Blame Anyway (Pragmatist):** Chooses **10A** (Safety trumps) + **6B** (Human interface responsible). *Diagnosis:* Untroubled by theoretical inconsistency; prioritizes systemic safety.
  10. **Unoccupied/Incoherent:** Choosing **4A** (Libertarian) + **8B** (Keep practice despite determinism). *Diagnosis:* This view is unstable; if indeterminism is required for blame (4A), you cannot keep the practice if determinism is true (8B). This leaf is empty because it is logically inconsistent.

  *Limitation Note:* The tree cannot cleanly separate **Semicompatibilism** from **Quality-of-Will** on these cases alone, as both deny the relevance of history and indeterminism. They are distinguished only by whether they emphasize *mechanism* (reasons-response) or *attitude* (regard). I have flagged this in Q3/Q4 weighting.

  ## IV. My Commitment

  I am not a surveyor. I am taking the test.

  **My Answers:**
  1.  **B** (The system acts as an agent.)
  2.  **B** (Change incentives; utility focus.)
  3.  **A** (She is responsive now; history irrelevant.)
  4.  **B** (Metaphysics doesn't change the moral fact.)
  5.  **B** (Community practice.)
  6.  **B** (Human interface must override.)
  7.  **C** (Emotions are tools; keep what works.)
  8.  **B** (Practice is too valuable to drop.)
  9.  **B** (Function matters more than feeling.)
  10. **A** (Safety trumps certainty.)

  **My Leaf:** **The Revisionist.**
  *Why:* I treat the practice as functional (2B, 8B), I am willing to engineer the emotions behind it (7C), and I accept non-human participation in the practice if the function is served (9B). I reject the Strawsonian claim that resentment is constitutive (7A); I think it's contingent. I reject the Skeptic's hesitation; I want to actively reshape the practice, not just keep it out of necessity.

  **My Prediction for the Median Reader:** **The Blame Anyway (Pragmatist).**
  *Why:* Your readers are navigating real-world systems (hospitals, fleets). They will overwhelmingly choose **10A** (Safety trumps) and **6B** (Human override). They will likely answer **8B** (Keep practice) not out of philosophical commitment, but out of fear of chaos. They will not distinguish between Strawson and Revisionism; they will simply want the machine to work and the blame to land where it stops the harm. They are not committed to a theory; they are committed to not dying.

  **The Discriminating Question:** **Question 7 (The Educable Emotion).**
  *Defense:* Questions about metaphysics (Q4, Q8) are too abstract for most; people answer them based on how they want to feel, not what they believe. Questions about harm (Q2, Q10) are too pragmatic; everyone agrees harm should be prevented.
  Question 7 cuts into the *heart* of the practice. It asks whether our deepest moral emotions (resentment, indignation) are sacred facts about human nature (Strawson/Wallace) or mutable technologies (Revisionist/Skeptic).
  *   If you say **7A** (No, it's constitutive), you are locked into a reactive-attitude view (Strawsonian). You cannot be a Revisionist.
  *   If you say **7B/C** (Yes, train them), you open the door to engineering accountability (Revisionist) or abolishing it (Abolitionist).
  This question separates those who think responsibility is something we *discover* in our nature from those who think it is something we *build*. In an age of algorithms and engineered environments (like your Designer's Daughter), this is the only distinction that matters.

  **Contested Reading Flag:**
  *Flag:* I am relying on a **Revisionist reading of the reactive attitudes**, treating them as contingent tools rather than constitutive conditions of moral community.
  *Side:* I take the side that they are tools. If resentment causes more harm than safety in a complex system, it should be deprecated. Strawson says this is impossible without ceasing to be human; I say it's just difficult engineering.
