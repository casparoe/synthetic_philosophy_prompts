answer: |-
  Here is a principle designed to repair your Underdetermination Test (UT) while accommodating the bulk of your verdicts. It requires you to overturn or refine exactly two of your intuitions (Cases 6 and 7), but it preserves the core insight that intervals represent a specific kind of epistemic state.

  ### The Principle: Meta-Reliability Admissibility

  **Statement:**
  Your credence in hypothesis $H$ is a sharp value $p$ if and only if your evidence identifies a **unique admissible probability function** $P$ such that $P(H)=p$. Your credence is an interval $[l, u]$ if and only if your evidence supports a **set of admissible functions** $\mathcal{P}$ whose convex hull is $[l, u]$.

  **The Repair Clause:**
  A probability function $P$ is *admissible* only if it is consistent with both:
  1.  **First-Order Evidence:** The data regarding $H$ itself.
  2.  **Second-Order Reliability:** Your assessment of the *source's* reliability, where "reliability" is inversely proportional to the **unexplained dispersion** among peer sources.

  **Decision Rule:**
  Your doxastic state (the interval) is distinct from your decision rule.
  *   **Reversible/Low Stakes:** Act on any $P \in \mathcal{P}$ (e.g., the centroid).
  *   **Irreversible/High Stakes:** Act on the **Maximin** criterion (optimize for the $P \in \mathcal{P}$ that yields the worst expected utility).

  ---

  ### Application to Your Cases

  This principle validates your UT for Cases 1–3 but modifies it for the social and pragmatic cases.

  **Cases 1–3 (Ellsberg, Known Bias, Unknown Coin):**
  *   **Verdict:** **Accommodated.**
  *   **Reasoning:** In 1 and 2, the chance structure is known (First-Order Evidence is complete). There is only one admissible function. In 3, the lack of provenance means any bias is admissible (Second-Order Reliability is null). The interval is $[0, 1]$.

  **Cases 4–6 (The Modeller Asymmetry):**
  *   **Verdict:** **Accommodated (with a caveat for Case 6).**
  *   **Reasoning:**
      *   **Case 4:** The dispersion (0.20, 0.45, 0.70) is itself Second-Order Evidence that the system is complex or data is sparse. No single model is uniquely admissible. The interval is the hull $[0.20, 0.70]$.
      *   **Case 5:** Removing a model removes a function from $\mathcal{P}$. The hull shrinks. This is standard set logic.
      *   **Case 6 (The Problem):** You say adding a precise modeller $[0.30, 0.34]$ does *not* narrow your interval. Under Meta-Reliability, this is rational **only if** you treat the *precision* of the new modeller as a negative reliability signal. If three peers disagree widely, a fourth claiming high precision is likely overfitting or hallucinating certainty. Their function is **inadmissible** not because the value is wrong, but because the *confidence* is unsupported by the consensus dispersion.
      *   **Cost:** You must accept that in high-uncertainty contexts, **precision is evidence of unreliability.** If you believe the fourth modeller is genuinely more skilled (independent of the consensus), you *must* narrow the interval. If you don't, you are effectively saying their precision is noise.

  **Case 7 (Dilation/The Gauge):**
  *   **Verdict:** **Partial Overturn Required.**
  *   **Reasoning:** You say you would pay to avoid opening the envelope (pragmatic) but that declining evidence is epistemically irrational (epistemic). Meta-Reliability agrees with the **epistemic** verdict.
      *   Opening the envelope updates your Second-Order Reliability. If "Calibrated," $\mathcal{P}$ shrinks. If "Uncalibrated," $\mathcal{P}$ widens.
      *   **Dilation** occurs when *every* possible outcome of the test leads to a wider (or equal) interval than your current state. In Imprecise Probability theory, paying to avoid information *is* rational to preserve optionality (Maximin).
      *   **Correction:** You should not call declining evidence "epistemically irrational" if your decision rule is Maximin. However, if your goal is *truth-tracking*, you must open the envelope. The principle forces you to choose: are you optimizing for **safety** (pay to avoid) or **accuracy** (open envelope)? You cannot have both. I recommend overturning the verdict that paying is rational *if* the information is free and costless to process; it suggests a flaw in the decision rule, not the belief.

  **Case 8 (Stakes):**
  *   **Verdict:** **Accommodated.**
  *   **Reasoning:** This is the strongest feature of the principle. Your doxastic state (the interval $[0.30, 0.60]$) remains identical. What changes is the **Decision Rule**.
      *   Low stakes: Use the mean (0.45). Indifferent between A and B.
      *   High stakes: Use the lower bound (0.30). Option A fails the threshold. You must choose B or gather evidence.
      *   This explains why "flipping a coin" is fine in one case but not the other without changing your belief.

  **Case 9 (Laundering/Calibration):**
  *   **Verdict:** **Accommodated.**
  *   **Reasoning:** Scoring regimes provide **new Second-Order Evidence**. Over years, you learn that your midpoint predictions correlate with frequencies. This collapses the set $\mathcal{P}$ to a singleton (or near-singleton). The interval disappears not because of administrative fiat, but because the *evidence* (your track record) now supports a unique admissible function. It is genuine learning, not laundering.

  ---

  ### Verdicts to Overturn

  To keep this principle lean, you must concede two points:

  1.  **Case 6 (The Precise Expert):** You cannot maintain that adding a credible expert *never* narrows the interval. If the expert's precision is independently verified (e.g., they have a better model, not just a tighter number), the interval *must* shrink. Your intuition holds only if "precision amidst disagreement" is treated as a heuristic for "overconfidence." **Cost:** You lose the absolute asymmetry between removal and addition.
  2.  **Case 7 (Paying to Avoid Info):** You must concede that if the information is free, paying to avoid it is **pragmatically rational but epistemically costly**. If your charter requires epistemic rationality, you must open the envelope. The "dilation" feeling is a conflict between safety and accuracy. **Cost:** You must admit that sometimes rational agents *should* accept a wider interval to gain truth.

  ---

  ### Verdicts on New Scenarios

  **1. The Panel Grows (10 Modellers in [0.30, 0.35]):**
  *   **Verdict:** The interval **shrinks**.
  *   **Reasoning:** The "unexplained dispersion" (Second-Order Evidence) has vanished. The consensus indicates that the uncertainty was resolvable. The set $\mathcal{P}$ collapses toward the cluster. The original three outliers are now down-weighted for reliability.
  *   **Threshold:** The interval shrinks when the weight of the consensus outweighs the weight of the outliers in your reliability metric. There is no hard number, but a 10:3 ratio with tight clustering is sufficient to narrow.

  **2. The Gauge Case (50/50 instead of 90/10):**
  *   **Verdict:** Dilation is **stronger**; the urge to pay to avoid info increases.
  *   **Reasoning:** With 90/10, your current interval is dominated by the "Calibrated" state. With 50/50, your current state is a true mixture. Learning "Uncalibrated" destroys your decision-making power half the time. The principle predicts you are *less* justified in ignoring the envelope (higher epistemic value) but *more* justified in fearing the outcome (higher pragmatic risk).

  **3. Scoring Regime Switched Off:**
  *   **Verdict:** **Intervals return (widen).**
  *   **Reasoning:** Without scoring, you lose the Second-Order Evidence of your own calibration. You revert to the prior state of uncertainty regarding your own reliability. The "genuine improvement" in Case 9 was dependent on the feedback loop. Without it, you drift back to Meta-Reliability uncertainty.

  ---

  ### Where This Reasoning is Most Likely Wrong

  **The Vulnerability: The Definition of "Reliability"**
  The principle hinges on **Second-Order Reliability**. I have defined this heuristically as "inversely proportional to unexplained dispersion."
  *   **The Counter-Case:** Imagine a field where truth is *always* counter-intuitive and experts *always* disagree (e.g., early-stage quantum mechanics). High dispersion might be the *signal* of a healthy field, not a sign of unreliability. In this case, narrowing the interval because experts converge (Case 10 Modellers) might be **groupthink**, not learning.
  *   **What Would Change My Mind:** If you can show me a case where **consensus narrowed the interval but led to systematic error**, while **dispersion preserved accuracy**, I would have to abandon the "Dispersion as Uncertainty" clause.
  *   **The Argument:** If "dispersion" is actually a feature of the *world* (ontic vagueness) rather than our *knowledge* (epistemic uncertainty), then narrowing the interval via consensus is a falsehood. Your Case 9 suggests you believe the uncertainty is epistemic (calibratable). If you believe the uncertainty is ontic (the levee *really* has no single probability), then intervals should never collapse, and Case 9 is indeed "laundering."

  **Recommendation:**
  Adopt the **Meta-Reliability Principle**. It separates belief from action (solving Case 8), treats intervals as sets of reliable models (solving Cases 1–5), and accounts for learning (Case 9). Accept that Case 6 requires a reliability check, not a blanket rule, and that Case 7 involves a trade-off between safety and truth, not a paradox.
