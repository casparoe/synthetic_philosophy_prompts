      *   *Feature 1 vs. Feature 2 & 3:* Feature 1 looks deontological (individual rights/taxon integrity), while 2 & 3 look consequentialist/utilitarian (maximize persistence/diversity). This isn't necessarily an ontological conflict; it's a normative tension.
