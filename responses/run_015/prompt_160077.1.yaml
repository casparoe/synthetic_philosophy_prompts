answer: |-
  This is a sophisticated question that cuts to the heart of conservation philosophy. You have identified real tensions, but I must begin by addressing your final instruction regarding whether the question is confused.

  ### 1. The Category Constraint: Units of Selection vs. Units of Value

  Your question asks what **unit of selection** the conservation regime presupposes. I must flag this as a category error, though a productive one.

  *   **The Confusion:** Conservation policy is a normative framework (what we *ought* to preserve), whereas units of selection are descriptive evolutionary mechanisms (what *does* replicate). A regulatory regime does not need to commit to a biological reality about how evolution works to commit to a moral priority about what matters.
  *   **The Correction:** The practice does not presuppose a *unit of selection* (e.g., that species are replicators undergoing species selection). It presupposes a **unit of value** and a **unit of management**.
      *   *Unit of Value:* What is the "thing" we care about persisting? (The lineage? The gene pool? The ecological function?)
      *   *Unit of Management:* What is the practical handle we can pull? (Individuals? Populations? Habitats?)

  The four features you list are consistent if we view the implicit theory not as "Species are individuals undergoing selection," but as **"Lineages are the primary objects of moral concern, managed via population genetics to ensure continuity."**

  With that correction in place, here is the breakdown of the implicit theory.

  ---

  ### 2. Presuppositions, Fits, and Underdetermination

  Here I distinguish what the practice *requires*, what it *accommodates*, and where it is *silent*.

  #### Feature 1: Taxon-Level Protection (Individual killing is an offense)
  *   **Strict Presupposition:** **Taxa are real enough to be legal subjects.** The law requires that "Species X" is a coherent entity distinct from "Species Y" such that killing a member of X is categorically different from killing a member of Y. It presupposes **essentialism** (or at least operational realism) regarding taxonomic boundaries.
  *   **Comfortable Fit:** **Species-as-Individuals (Ghiselin/Hull).** If a species is a spatiotemporally localized individual (a lineage), killing a member is damaging that individual. It also fits **Deontological Ethics** regarding species integrity.
  *   **Underdetermined:** This does *not* presuppose **Species Selection**. We can value a lineage without believing it is a unit of evolution. It also does not prove organisms lack moral status; the law protects the organism *because* it instantiates the taxon, not necessarily because the organism is morally negligible.

  #### Feature 2: Incidental Take Permits (Population viability > Individual life)
  *   **Strict Presupposition:** **Persistence trumps sanctity.** The ultimate good is the continuation of the taxon, not the life of the constituent organism. This is a consequentialist commitment.
  *   **Comfortable Fit:** **Utilitarianism.** It fits any view where the "greater good" is defined as taxon survival.
  *   **Underdetermined:** This is neutral regarding biological levels. A gene's-eye view (maximize allele persistence) and a group-level view (maximize population stability) both license sacrificing individuals for the whole.

  #### Feature 3: Pedigree Management (Genes > Individuals)
  *   **Strict Presupposition:** **Genetic Diversity is the currency of value.** The "health" of the conservation unit is measured in heterozygosity and founder representation, not individual welfare.
  *   **Comfortable Fit:** **Gene's-Eye View (Dawkins).** Managing for mean kinship looks like managing for allele survival.
  *   **Underdetermined:** It does *not* require that genes are the only unit of selection. It only requires that genetic variation is the **proxy for evolutionary potential**. A population geneticist (Wright/Fisher) and a gene-centrist (Dawkins) would run the same breeding program. The practice manages *populations* to save *genes*, without committing to which is the "real" replicator.

  #### Feature 4: The Gene Flow Flip (Purity vs. Rescue)
  *   **Strict Presupposition:** **Adaptive Context Matters.** Genetic material is not inherently good or bad; its value depends on the ecological context and the immediate threat profile (inbreeding vs. outbreeding depression).
  *   **Comfortable Fit:** **Evolutionary Significant Units (ESUs).** This fits the view that we are conserving *adaptive potential* and *historical trajectory*, not just DNA.
  *   **Underdetermined:** This is the most pragmatically underdetermined feature. It relies on risk assessment timelines (short-term swamping vs. long-term extinction) rather than a fixed ontology of what a species "is."

  ---

  ### 3. Counterfactuals and Consistency

  #### If we adopted a strict Gene's-Eye View:
  *   **Practice Change:** You are correct. We would likely stop listing named taxa and start listing **Units of Adaptive Potential** or specific **Functional Alleles**.
  *   **Consequence:** Taxon boundaries would dissolve. If a hybrid swarm contains the adaptive alleles necessary for future evolution, the "pure" parental taxon would lose protection. Conservation would become "allele banking."
  *   **Why we don't do this:** It is administratively impossible (we can't sequence every locus) and morally counterintuitive (the public values "tigers," not "tiger alleles").

  #### If we adopted a strict Multi-Level/Group-Functional View:
  *   **Practice Change:** We would protect **Ecological Roles**.
  *   **Consequence:** A taxon whose members persist in captivity or in a fenced reserve but no longer perform their ecosystem function (a "zombie taxon") would lose protection. Conversely, a hybrid population that successfully fills the niche might gain it.
  *   **Why we don't do this:** It risks "functional extinction" accepting. We value the *history* (the lineage) as much as the *function*.

  #### Is Feature 4 (Gene Flow) Inconsistent?
  *   **Verdict:** **No, it is consistent under a "Lineage Viability" view.**
  *   **Reasoning:** The goal is the persistence of the lineage's *capacity to evolve*.
      *   *When population is large:* The threat to capacity is **swamping** (loss of local adaptation). Therefore, block gene flow.
      *   *When population is small:* The threat to capacity is **stasis/death** (inbreeding depression, mutational meltdown). Therefore, encourage gene flow.
  *   **Coherent View:** The unit being protected is the **Long-Term Evolutionary Potential (LTEP)** of the lineage. Purity protects LTEP when diversity is high; Introgression protects LTEP when diversity is low. The "object" is the future trajectory, not the current genetic snapshot.

  ---

  ### 4. Confidence and Methodology Flags

  Per your request, I am separating settled reconstruction from inference and contestation.

  **1. Contested vs. Settled (Philosophical Biology):**
  *   *Settled:* There is no consensus in philosophy of biology that conservation practice *must* align with a specific unit of selection. Most philosophers of conservation (e.g., Sahotra Sarkar, Maureen O'Malley) argue conservation is a **decision-theoretic** process, not an ontological one.
  *   *Contested:* Whether "Species-as-Individuals" is the best metaphysical account of species. I have used it as a "Comfortable Fit" above, but many systematists still prefer Species-as-Classes. My reconstruction does not depend on this being settled, only that the *law* treats them *as if* they are individuals.

  **2. Inference vs. Statutory Reality:**
  *   *Inference:* I am inferring that the "euthanasia of healthy animals" in Feature 3 is a core commitment. In reality, this is highly controversial and often hidden. The *contraception* based on mean kinship is the stronger evidence for the genetic-commitment.
  *   *Inference:* I am inferring the "Lineage Viability" view is the coherent glue. This is my reconstruction. The actual policymakers may simply be acting pragmatically without a unified theory. If they are acting pragmatically, the "inconsistency" is real, but it is a bureaucratic inconsistency, not a philosophical one.

  **3. Critique of Your Question's Premise:**
  *   **The Conflation:** You asked if the practice presupposes a unit of *selection*. As noted in Section 1, this is the primary confusion. The practice presupposes a **Unit of Persistence**.
  *   **The Manufactured Inconsistency:** Feature 1 (Individual protection) and Feature 2/3 (Individual sacrifice) are not ontologically inconsistent; they are **lexically ordered**. The law says: "Protect the individual *unless* doing so threatens the taxon." This is a standard threshold deontology, not a conflict of biological levels.
  *   **The Real Tension:** The genuine tension is not between levels of selection, but between **Historical Value** (purity, ESUs, Feature 4a) and **Forward-Looking Value** (resilience, rescue, Feature 4b). Your working group is likely struggling with how much weight to give the *past* (evolutionary history) vs. the *future* (evolutionary potential).

  ### Summary for your Working Group
  If you need to write this down: Do not argue that the rules presuppose a specific biological unit of selection. Argue that the rules presuppose **Lineage Continuity** as the primary value.
  *   **Feature 1 & 2** establish the Lineage as the legal subject.
  *   **Feature 3** establishes Genetic Diversity as the mechanism of continuity.
  *   **Feature 4** establishes Context as the regulator of that mechanism.

  The theory is not "Species are Individuals." The theory is "Evolutionary Processes must be kept open."
