          *   *Feature 2 (Incidental Take):* Strict presupposition = Population viability > Individual life. Fits = Utilitarianism/Consequentialism. Underdetermined = Compatible with gene-centric or group-centric views as long as persistence is the goal.
          *   *Feature 3 (Pedigree Management):* Strict presupposition = Genetic diversity is the currency of value. Fits = Gene's-eye view (Dawkins) OR Population Genetic view (Wright). *Crucial:* It does *not* require altruism at the gene level, just management *of* genes.
          *   *Feature 4 (Gene Flow):* Strict presupposition = Local adaptation and distinctness have value. Fits = Ecological Species Concept or Evolutionary Significant Units (ESUs). Underdetermined = The "flip" is pragmatic, not ontological.
