  *(Self-Correction during final review)*: I need to make sure I don't just say "You're wrong about selection." I need to explain *why* the practice looks like selection theory but is actually management theory. The "Implicit Theory" is likely a "Lineage Persistence" theory, which borrows from multiple biological concepts without committing to one evolutionary ontology.

