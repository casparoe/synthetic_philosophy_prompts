answer: |-
  ### 1. Dependency Structure (The Logical Flow)

  Do not teach this chronologically (Clifford then James). Teach it **problem-first**. The students need to feel the tension before they meet the philosophers.

  1.  **The Definition of Belief & Evidence (0–5 mins):**
      *   *Prerequisite:* Students must distinguish between *hope/wish* and *belief*. Belief claims to represent reality.
      *   *Why:* If belief is just a feeling, there is no ethics to discuss. It must be a claim about truth that guides action.
  2.  **The Default Rule (Clifford's Principle) (5–15 mins):**
      *   *Prerequisite:* Acceptance that beliefs lead to actions that affect others.
      *   *Why:* Establish the baseline duty. We are custodians of the "common stock of knowledge."
  3.  **The Problem of Insufficient Evidence (15–20 mins):**
      *   *Prerequisite:* Acknowledgement that in some high-stakes cases, evidence runs out *before* a decision is required.
      *   *Why:* This creates the gap Clifford cannot fill. If evidence were always available, James would have no work to do.
  4.  **The Exception Condition (James's "Genuine Option") (20–35 mins):**
      *   *Prerequisite:* Understanding that withholding belief is *itself* a choice with consequences.
      *   *Why:* This justifies the "right to believe." It is not a license; it is a necessity imposed by the structure of the decision.
  5.  **The Conflict Point (35–45 mins):**
      *   *Prerequisite:* Both positions are now charitable.
      *   *Why:* Now you can locate the exact disagreement: Is the risk of error (Clifford) worse than the risk of losing the truth (James)?

  ---

  ### 2. The Carrying Example

  **Do not rely solely on Clifford's Ship-Owner.**

  *   **Why it is insufficient:** The Ship-Owner is a case of *negligence*, not *insufficient evidence*. The ship-owner *could* have checked the vessel. It makes Clifford look like a common-sense safety inspector and James look like he is defending negligence. It fails to capture James's core claim: that some truths *only* become accessible if you believe them first.
  *   **The Replacement Example: "The Startup Co-Founder"**
      *   **Scenario:** You are asked to join a friend as a co-founder of a high-risk startup. The market data is ambiguous (inconclusive evidence). If you join, you must invest all your savings and reputation (Momentous). If you don't join, the startup likely fails because they need your specific skills (Forced). You have no way to know if it will succeed without trying (Evidence is inherently incomplete).
      *   **How it illuminates Clifford:** Believing you will succeed without proof risks financial ruin for you and your family, and if you fail, you contribute to a culture of reckless entrepreneurship (harm to the "common stock").
      *   **How it illuminates James:** Withholding belief (waiting for more data) guarantees the startup fails. The truth of "this business can succeed" is *created* by the belief and action. To demand more evidence is to ensure the negative outcome.
      *   **Pedagogical Move:** Run this single scenario through both filters. Ask: "At what point does Clifford's duty to investigate become James's paralysis?"

  ---

  ### 3. Misconception Management

  Here is exactly when the students will drift and how to correct it in real-time.

  | Misconception | When it Crystallizes | Preemptive Strike (Script/Action) |
  | :--- | :--- | :--- |
  | **"Clifford is just a dogmatic skeptic."**<br>(Students think Clifford wants us to believe *nothing*.) | **Minute 10:** When you state his principle ("wrong always, everywhere..."). | **Strike:** Immediately link his principle to *action*, not just thought. Say: "Clifford isn't saying 'believe nothing.' He is saying 'believe proportionally to evidence so your actions don't harm society.' He is a consequentialist, not a skeptic." |
  | **"James thinks you can believe whatever you want."**<br>(Students think James offers a free pass for delusion.) | **Minute 25:** When you introduce the "Will to Believe." | **Strike:** Before explaining James's permission, list his constraints on the board (Live, Forced, Momentous). Say: "James is not giving you a license for fantasy. He is describing a specific trap where skepticism is just as risky as faith. If the option isn't 'Genuine,' Clifford wins." |
  | **"The whole debate is really about religion."**<br>(Students reduce it to 'faith vs. atheism'.) | **Minute 35:** When discussing the "religious hypothesis." | **Strike:** Explicitly bracket religion. Say: "James uses religion as his primary example, but the *mechanism* applies to the Startup case we just discussed. If you reduce this to theology, you miss the epistemic rule about human decision-making under uncertainty." |

  ---

  ### 4. Final Assessment Question

  Do not ask "Who do you agree with?" This encourages side-picking without understanding.

  **Ask this:**
  > "Describe a situation where Clifford and James would **agree** on what you should do, and a situation where they would **disagree**. What specific feature of the situation triggers the disagreement?"

  *   **Why this works:** To answer this, they must identify the boundary condition (the presence or absence of a "Genuine Option" / sufficient evidence). If they say "They agree on the Ship-Owner, but disagree on the Startup," they understand the structure. If they say "They disagree on everything," they missed the nuance.

  ---

  ### 5. What to Openly Refuse to Cover

  You have 50 minutes. You must explicitly tell students what you are cutting to manage their expectations and prevent confusion.

  1.  **The Meta-Ethics of Evidentialism:**
      *   *Refusal:* "We are not asking today *why* evidence is good. We are taking it as given that evidence matters, and asking *when* we are allowed to move without it."
      *   *Why:* First-years cannot handle the justification of epistemic norms alongside the application of them. It leads to infinite regress.
  2.  **The Taxonomy of "Live/Dead/Forced/Momentous":**
      *   *Refusal:* "We will use the concept of a 'Genuine Option' as a bundle. We are not memorizing James's four definitions separately."
      *   *Why:* This becomes semantic pedantry. The philosophical weight is on the *necessity* of the choice, not the labeling of the choice.
  3.  **Contemporary Bayesian Updates:**
      *   *Refusal:* "We are not doing probability math today."
      *   *Why:* James and Clifford are arguing about *normative permission*, not statistical calculation. Introducing Bayes' theorem suggests the problem is mathematical rather than ethical/pragmatic.
  4.  **Specific Theological Doctrines:**
      *   *Refusal:* "We are not evaluating religious claims themselves."
      *   *Why:* This triggers personal defenses. Keep the focus on the *ethics of the belief formation*, not the *content of the belief*.

  **TA Tip:** Write the "Exclusion List" on the corner of the board at the start of class. It signals control over the material and prevents students from feeling like the discussion is shallow because you ignored the "big questions."
