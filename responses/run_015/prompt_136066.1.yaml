answer: |-
  **Exam Question**

  Benjamin Franklin's method for moral perfection involves rotating through thirteen virtues, focusing on one per week while tracking faults in a grid. Critics argue this piecemeal approach is conceptually confused because virtues are interdependent (e.g., Justice requires Temperance); isolating them may prevent true moral development. Furthermore, Franklin admitted he never mastered "Order," and modern psychology warns of "moral self-licensing," where improving in one area encourages neglect in others.

  Write an essay evaluating Franklin's method. Does the interdependence of virtues and the risk of self-licensing undermine his project, or does his specific tracking system defend against these charges? In your response, address whether Franklin's failure to achieve perfection invalidates the scheme or redefines it as long-term practice.

  ***

  **Model Answer**

  Franklin's moral perfection project is frequently dismissed because virtues appear interdependent; one cannot truly be Just without also being Temperate. Critics argue that isolating virtues for weekly focus fractures moral character. However, this objection misunderstands Franklin's pragmatic goal. He is not aiming for the metaphysical unity of virtue found in classical ethics, but rather behavioral modification through habit formation. The weekly rotation is not isolation; it is prioritization. By focusing cognitive attention on one virtue, the agent heightens awareness of specific behaviors without negating obligations to others.

  The tracking grid is the crucial defense against the interdependence objection. Franklin does not ignore the other twelve virtues during a focus week; he records faults in all of them daily. The grid ensures holistic monitoring even during piecemeal practice. If a student focuses on "Industry" but fails at "Silence," the grid captures the fault. This prevents the virtues from being truly siloed. The method acknowledges that while habits are built incrementally, moral life is simultaneous. The rotation manages cognitive load, allowing the agent to tackle specific weaknesses while the grid maintains accountability for the whole character.

  Regarding Franklin's failure with "Order," this does not undermine the method but clarifies its purpose. Franklin admits he never achieved perfection, particularly with Order, due to external circumstances and ingrained habit. This acknowledges human limitation. The method is asymptotic; the value lies in the progression toward improvement, not the attainment of a saintly state. If perfection were required for success, the project would be useless. His struggle shows the method is a tool for lifelong practice, not a quick fix. The failure validates the need for continuous tracking rather than proving the system broken.

  Modern concerns about moral self-licensing—where doing good allows later bad behavior—are also mitigated by the tracking system. Licensing often works subconsciously ("I was good yesterday, so I can slack today"). Franklin's explicit accounting makes this trade-off visible. If you mark a fault, you cannot pretend it didn't happen. The grid enforces accountability across the whole cycle, not just the focus week, disrupting the psychological mechanism of licensing by forcing conscious acknowledgment of regressions.

  Finally, this differs significantly from Aristotelian *hexis*. Aristotle sees virtue as a unified state of character developed through practical wisdom (*phronesis*). Franklin sees virtues as discrete habits useful for social success and happiness. Therefore, the interdependence objection relies on an Aristotelian framework that Franklin rejects. His method works because it treats morality as a skill set to be managed, not a unified essence to be realized. The rotation allows manageable incrementalism, the grid ensures holistic monitoring, and the admitted failures prove the system's honesty about human nature. Franklin's scheme succeeds not as a path to sainthood, but as a technology of self-improvement.

  ***

  **Marking Scheme (25 Marks Total)**

  | Criterion | Marks | A Answer Requirement | B Answer Typical Miss |
  | :--- | :---: | :--- | :--- |
  | **1. Interdependence Objection** | 5 | Clearly articulates that virtues rely on one another (e.g., Justice needs Temperance) and isolating them risks conceptual confusion. | Describes the virtues but fails to explain *why* separating them is philosophically problematic. |
  | **2. Piecemeal Defense & Grid** | 5 | Defends rotation as cognitive focus (not isolation) and explicitly uses the tracking grid as evidence of holistic monitoring. | Praises the grid as "organized" but fails to explain how it solves the interdependence problem specifically. |
  | **3. The "Order" Failure** | 5 | Interprets Franklin's failure with Order as evidence of realistic long-term practice rather than project invalidation. | Treats the failure as a simple contradiction or weakness without discussing the asymptotic nature of the project. |
  | **4. Moral Self-Licensing** | 5 | Counters licensing by explaining how explicit tracking prevents unconscious entitlement to neglect other virtues. | Mentions licensing but fails to connect it to the mechanism of the tracking book/grid. |
  | **5. Aristotelian Distinction** | 5 | Distinguishes Franklin's pragmatic habit-building from Aristotelian unified character (*hexis*) to justify the piecemeal approach. | Treats Franklin's ethics as identical to virtue ethics generally without noting the pragmatic/behavioral divergence. |
