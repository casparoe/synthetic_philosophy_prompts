answer: |-
  This is a sharp observation, and you are right to feel that the existing labels are either too narrow (focusing only on the luck) or too broad (focusing only on the bias). You have identified a specific *mechanism* of social evaluation that bridges action theory and institutional sociology.

  To answer your primary question directly: **No, there is no single established term that captures the whole loop.** The literature splits this phenomenon across three silos: moral luck (ethics), action individuation (metaphysics), and the halo/horns effect (psychology). Your insight is that these are not separate errors but stages in a single justificatory process.

  Here is the carving you asked for.

  ### 1. The Two Components: Are They One Thing?

  You asked whether the "relocation of voluntariness" (the metaphysical shift) and the "sideways travel" (the generalization) are the same phenomenon.

  **They are distinct mechanisms, but they are causally locked.**

  *   **Component A (The Metaphysical Move):** This is a shift in **Action Individuation**. In the "failure" case, the action is individuated *coarsely* (e.g., "undertaking the reform"); in the "success" case, it is individuated *finely* (e.g., "signing the memo on Tuesday"). This is not just describing the same act differently; it is changing *what counts as the act* to which responsibility attaches.
  *   **Component B (The Sociological Move):** This is **Trait Generalization**. Once the act is individuated coarsely ("undertaking the reform"), it maps onto a character trait ("reckless" or "visionary"). Character traits, by definition, are cross-situational. If someone is "reckless," they are reckless in budgeting, hiring, and driving.

  **The Link:** The sideways travel (B) is only licensed by the relocation (A). If you keep the action description fine-grained ("he signed the memo"), you cannot infer a general trait. You can only call him "unlucky." To justify the sideways distrust, the community *must* first shift the grain of the action description to something broad enough to imply a character flaw.

  So, they are not the same thing, but they form a **single justificatory circuit**. The metaphysical shift creates the ontological space for the sociological bleed.

  ### 2. Nearest Established Concepts (and Why They Miss)

  *   **Moral Luck (Nagel/Williams):**
      *   *Fit:* High. Both deal with outcome-dependence.
      *   *Miss:* Nagel's "two drivers" case assumes the *act* is identical (both drove drunk); only the *blame* differs. In your cases, the *description of the act* changes to match the blame. Your phenomenon is **meta-moral luck**: it's the luck of how your action is individuated by observers.
  *   **Outcome Bias (Psychology):**
      *   *Fit:* High. Judging the decision by the result.
      *   *Miss:* Outcome bias explains *that* the judgment shifts, but not *how* it is rationalized. It doesn't account for the metaphysical work done to protect the judgment (the redescription).
  *   **Action Individuation (Anscombe/Davidson):**
      *   *Fit:* Medium. Deals with fine vs. coarse descriptions.
      *   *Miss:* This is usually a metaphysical inquiry into what actions *are*, not a normative inquiry into how descriptions are weaponized post-hoc to stabilize status.
  *   **The Halo/Horns Effect:**
      *   *Fit:* High on the sideways travel.
      *   *Miss:* Purely psychological. It doesn't explain the *normative justification* ("he aims too high") used to bridge the gap.

  ### 3. The Coinage: **Justificatory Grain-Shifting**

  If you want a term to use in your department meeting that captures the whole pattern, I propose **Justificatory Grain-Shifting**.

  **Definition:** *A post-hoc evaluative practice wherein the granularity of an agent's action description is adjusted (coarsened for failure, refined for success) to align moral judgment with outcomes, thereby licensing the attribution of global character traits that justify unrelated sanctions or rewards.*

  **Why this term?**
  *   **Justificatory:** It highlights that the shift isn't accidental; it serves to protect the initial outcome-based intuition.
  *   **Grain:** It references the metaphysics of action (fine vs. coarse individuation).
  *   **Shifting:** It captures the motion—the goalposts move.

  ### 4. Edge Cases: When is Redescription Legitimate?

  You asked when re-describing conduct more broadly is legitimate rather than symptomatic of this pattern. Your guess ("whether the agent would have accepted it in advance") is very close to the mark.

  **The Test of Ex Ante Endorsement:**
  Grain-shifting is illegitimate when the broader description was *not* available to the agent as a practical reason at the time of acting.

  *   **Legitimate:** A colleague proposes a curricular reform saying, "This is a risky gamble to save the department." If it fails, calling it "a reckless gamble" is legitimate. They individuated the act coarsely *ex ante*. The grain matches their intention.
  *   **Illegitimate (The Pattern):** A colleague proposes a reform saying, "This addresses the specific enrollment dip in 19th-century courses." If it fails, and critics call it "a reckless overhaul of the whole curriculum," that is Grain-Shifting. The agent did not sign up for the coarse description.

  **The Edge Case of "Negligent Broadness":**
  Sometimes, an agent *should* have recognized the broader description. If someone drives drunk, they may say "I just drove home," but society says "You endangered everyone." Here, the coarse description ("endangering everyone") is legitimate because it is a *foreseeable consequence* that carries normative weight, even if the agent didn't intend it.
  *   *Distinction:* In your departmental examples, the "broader" description (e.g., "won't listen to advice") is often a *characterological* frame, not a *consequential* frame. Legitimate broadening cites consequences; illegitimate broadening cites character.

  ### 5. A Case Where the Pattern is Absent

  You asked for a case where the surface features are there (luck, different outcomes) but the pattern is absent.

  **The "Just Culture" Protocol (Aviation/Medicine):**
  In high-reliability organizations, there is a strict protocol for error analysis.
  *   *Scenario:* Two pilots make the same procedural error. One lands safely (luck); one crashes (bad luck).
  *   *Absence of Pattern:* In a mature "Just Culture," both are evaluated on the *deviation from procedure*, not the outcome. The action is individuated finely ("deviated from checklist step 4").
  *   *No Sideways Travel:* The pilot who crashed is not deemed "untrustworthy with finances." The judgment is contained to the specific competency.
  *   *Why:* The institutional rules *forbid* outcome-dependent individuation. The "grain" is fixed by the protocol, not the result.

  ### 6. The Asymmetry: Is It Essential?

  You noted that the unflattering version survives debunking, while the flattering one collapses when luck is pointed out.

  **This asymmetry is not essential to the logic, but it is essential to the *social function* of the mechanism.**

  *   **Logic:** Logically, both are equally fallacious. If success is luck, "bravery" is a fiction. If failure is luck, "recklessness" is a fiction.
  *   **Social Function:** The mechanism exists to manage institutional risk.
      *   **Negative Stickiness:** It is safer for the department to keep the "reckless" label on the failed reformer. It justifies excluding them from future committees (risk mitigation). Debunking the label increases institutional risk.
      *   **Positive Fragility:** It is dangerous for the department to keep the "brave" label on the successful reformer if it was luck. It encourages further gambling. Debunking the label *reduces* institutional risk.

  So, the asymmetry is a feature of **institutional self-preservation**, not the metaphysics of action. The pattern *could* exist symmetrically (a "Hero Cult" where the lucky person is immune to criticism), but in professional/academic settings, the negative stickiness dominates because the cost of false positives (trusting a incompetent person) is higher than the cost of false negatives (ignoring a competent one).

  ### Summary for Your Department Meeting

  If you want to intervene in this pattern on Monday, here is the script:

  > "We are engaging in **Justificatory Grain-Shifting**. We are letting the outcome decide whether we describe [Colleague's] act as 'making a specific decision' or 'having a reckless character.' Unless [Colleague] described the act broadly *before* the outcome was known, shifting the grain now is just a way to rationalize our hindsight bias. And if we don't fix the grain, we shouldn't let the judgment bleed into unrelated areas like hiring or budgeting."

  This gives you the metaphysical precision (grain), the ethical critique (justificatory), and the practical constraint (ex ante description) to stop the slide.
