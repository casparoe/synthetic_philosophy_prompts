      *   **Continuity Critic:** Believes methods are parasitic on background consensus. Consensus is revisable (e.g., Hittites, Norse). Mainstream fails too (Piltdown, Hitler Diaries). Label tracks institutional power as much as method.
      *   **Common Ground:** Both care about truth/evidence. Both acknowledge failures on both sides. Both acknowledge some claims are worse than others.
