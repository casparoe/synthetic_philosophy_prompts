      *   *Disagreement Type:* Empirical (data), Conceptual (definition), Verbal (labeling).

  5.  **Drafting Section 3: Cruxes & Analysis (Verbal vs. Substantive):**
      *   Identify the verbal dispute: The definition of "pseudohistory." Is it a methodological category or a sociological label?
      *   Identify the substantive dispute: How much weight to give prior probability vs. new evidence. Base rates of forgery vs. discovery.
      *   Self-Critical Analysis: Where did I bias towards one side? Probably in defining "method."

  6.  **Developing the Alcoutim Case Application:**
