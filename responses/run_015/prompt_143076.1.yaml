answer: |-
  To move beyond the introductory caricature where Creon represents Hart's positivism and Antigone embodies Fuller's natural law, we must dissect the specific juridical failures in the text rather than mapping characters onto theorists. Creon's edict does not merely fail because it is substantively immoral (which Hart would admit is still "law"), but because it collapses under Fuller's *internal* morality of law. Fuller's eight canons require generality, promulgation, and congruence between declared rule and official action; Creon's decree is a bill of attainder targeting specific individuals (Polyneices vs. Eteocles), violating the canon of generality. Furthermore, the edict lacks congruence: when the Guard reports the symbolic burial, Creon threatens the guards with death not for breaking a clear procedure, but for failing to produce a culprit, turning the legal system into a mechanism of terror rather than governance. This suggests Creon isn't a Hartian positivist maintaining order, but a tyrant failing Fuller's threshold for a functioning legal system altogether.

  Antigone's position complicates the Fuller alignment often assigned to her. While she appeals to morality, she invokes "unwritten and unfailing statutes of heaven," which directly violates Fuller's canon of promulgation—law must be known to be followed. Here, she inadvertently validates Hart's warning that merging law and morality introduces uncertainty; her "higher law" is intuitive and inaccessible to public verification, making it a poor standard for civic order. In her opening exchange with Ismene, Ismene acts as the reluctant positivist, noting the practical impossibility of compliance ("we must obey... whether this is sound or not"), highlighting Hart's point that legal obligation exists independently of moral approval. Antigone's rejection of this is not a Fullerian procedural critique but a radical substantive override, risking the anarchy Hart feared when validity is collapsed into individual moral conviction.

  The tension sharpens in the Guard's report and the clash with Haemon. The Guard's fear of punishment despite his innocence exposes the breakdown of congruence between rule and enforcement; the law is no longer a guide for conduct but a tool for arbitrary power. Haemon's argument that "no city belongs to just one man" appeals to the sociological foundation of law that Hart acknowledges in his "minimum content of natural law"—law must align with human survival and social acceptance to persist. Creon's refusal to listen demonstrates a failure not just of morality, but of the systemic stability Hart himself deems necessary for law to function long-term. Yet the play resists reducing to either philosopher: Creon's legalism leads to ruin, but Antigone's moral absolutism leads to death and leaves the city in limbo without resolving the burial crisis through procedure. The tragedy lies in the insufficiency of both pure validity and pure morality without practical wisdom.

  Summary: The play forces us to confront the human carnage that abstract jurisprudence treats as mere theoretical collateral.
