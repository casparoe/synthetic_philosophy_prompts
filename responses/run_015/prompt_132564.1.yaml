answer: |-
  The rain battered the cafe window, blurring the London streetlights into streaks of amber. Inside, Jules stirred their tea, the spoon clinking against the china with a rhythmic precision that seemed to irritate Mara.

  'You're selling a shadow,' Jules said finally, setting the spoon down. 'Your workshop slides look like Stoicism, you quote Epictetus, but you've removed the engine. Without the Logos, without a providential cosmos, the dichotomy of control is just a hollow shell.'

  Mara leaned back, crossing her arms. She had spent the day teaching corporate leaders how to manage anxiety, and she had little patience for metaphysical nitpicking. 'People don't need an engine, Jules. They need to drive. When a client is having a panic attack because their merger might fail, they don't need a lecture on cosmic fate. They need to know what they can actually do.'

  'But that's precisely the point,' Jules countered, leaning forward. 'For Epictetus, the line between what is "up to us" and what isn't wasn't drawn based on utility. It was ontological. Only our moral choice—*prohairesis*—is truly up to us because only that aligns with the divine reason within. When you strip away the benevolent order of Nature, why should anyone accept that external events are "indifferent"? Without a god ensuring things work out for the best, accepting powerlessness isn't wisdom. It's just resignation.'

  Mara shook her head. 'You're assuming acceptance requires faith. It doesn't. It requires bandwidth.'

  'Bandwidth?'

  'Yes. Mental bandwidth,' Mara said, tapping the table. 'Look, take health. You teach that health is "preferred indifferent" because the cosmos doesn't guarantee it. I teach that health is outside your direct control because you can do everything right and still get ill. The practical boundary is the same. But my reason doesn't require them to believe in Zeus. It requires them to stop wasting agential focus on variables they cannot command.'

  Jules sighed, analysing her over the rim of the cup. 'But why draw the line *there*? That's my question. If there's no cosmic nature dictating what belongs to the self, the boundary becomes arbitrary. Why is your reputation "outside" your control? In a secular world, you can influence reputation. You can manage PR, network, build brand equity. By telling a client it's "not up to them", you aren't teaching them Stoicism. You're telling them to give up.'

  'I'm telling them not to anchor their self-worth to it,' Mara corrected sharply. 'If I tell them reputation is controllable, they will try to manipulate outcomes. They will lie, they will stress, they will compromise their integrity to force a result. By categorising it as external, I'm protecting their integrity. I'm saying: "Focus your energy on your own behaviour, not the world's reaction."'

  'But that's a pragmatic heuristic, not a philosophical truth,' Jules insisted. 'And heuristics break under pressure. When tragedy strikes—real tragedy, not a failed merger—your secular dichotomy collapses. If the universe is chaotic and indifferent, why be virtuous? Why not just grab what you can? Epictetus had an answer: because you are a fragment of God. You have no answer other than "it feels nicer".'

  'It feels nicer isn't nothing, Jules,' Mara said, her voice softening. 'It's everything. When someone is grieving, telling them the universe is ordered can feel like gaslighting. Telling them, "You cannot control the death, but you can control how you honour the memory," gives them a foothold. It's about agential focus. If I can direct their attention to where their power actually lies, I don't need to promise them a benevolent fate.'

  'You're relabelling powerlessness as wisdom,' Jules argued, though their tone had lost its edge. 'You're asking them to limit their sphere of concern based on what's comfortable, not what's true. If the universe is chaotic, then nothing is truly "outside" our control in the Stoic sense; everything is just a battle of causality. By drawing a line at "influence", you're creating a safe space, not a truthful one.'

  'Maybe safety is what's required,' Mara said. 'Philosophy used to be a way of life. Now, for most people, it's a toolkit. I'm not claiming to save their souls. I'm trying to help them sleep at night. If using the dichotomy as a behavioural filter reduces cortisol and improves decision-making, does the metaphysical backbone matter?'

  'It matters because without it, you're just doing cognitive behavioural therapy with Greek fancy dress,' Jules said, a small smile appearing. 'You want the resilience without the responsibility of the worldview. You want the calm of the sage without the belief that the sage is cooperating with destiny.'

  'Perhaps,' Mara conceded, picking up her coffee. 'Or perhaps the destiny was always just a story to help people accept the calm. If the tool works without the manual, do we really need to force people to read the whole book?'

  Jules looked out at the rain, considering this. 'Epictetus would say you're using the weapon without the armour. You might strike anxiety down, but when life strikes back, you'll be exposed.'

  'Maybe,' Mara said. 'But until then, I'd rather they be able to fight at all.'

  Jules nodded slowly, picking up the spoon again. 'A pragmatic truce, then. But don't call it Stoicism. Call it what it is: secular resilience.'

  'Call it whatever keeps them coming back,' Mara replied. 'Just don't expect me to stop using the dichotomy.'

  'Nor I to stop analysing why it holds,' Jules said. 'Cheers.'

  'Cheers.'
