prompt: |-
  I write the user-facing emails and in-app messages for a mid-size health insurer — the boring, high-stakes ones: your claim has been approved; your coverage ends on the 15th; were sorry for the delay; someone from our team will call you within two business days. A few dozen of these ship every release, I get maybe ten minutes per message, and anything that could be read as a promise, a waiver, a warning or a refusal has to be signed off by legal, so I need to be able to say in advance which lines are actually doing something and which just report something.

  Can you write me a procedure my team can run line by line? Ground it in the speech act stuff — Austins felicity conditions, the difference between a misfire where the act doesnt happen at all and an abuse where it happens but is hollow, illocution versus perlocution, indirect speech acts — but it has to be usable by someone whos never heard any of that. I want: the questions in order, what counts as a good enough answer to each, the point where it stops with a no and sends the line to legal, and the point where it has to stop and hand the call to a person because its a values question not a facts question. Also tell me which bits of the theory you had to drop to make it usable and which you refused to drop.

  Two things we keep tripping over that the procedure has to handle. First, weve started calling some of these shadow performatives: sentences with the grammar of a plain report that do the work of an act, like your complaint has been logged said at the moment the caseworker logs it, or I hear that youre upset functioning as a brush-off. When is that fine and when is it evasive, and how do I tell the difference without asking the writer what they meant? Second, sentences built to be deniable: Im not saying we wont cover this, just that well need more documentation.

  Then run it on three of our actual lines: your information is safe with us; this decision may be appealed within 180 days; weve noted your concern about how the adjuster spoke to you. Tell me which one comes out worst for us and why, and be straight about where a procedure like this is just going to misfire given ten minutes and no training.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Writer of user-facing emails/in-app messages for a mid-size health insurer.
      *   **Context:** High-stakes, boring, legally sensitive (claims, coverage, delays, promises). High volume (dozens per release), low time (10 mins/message).
      *   **Constraint:** Needs a line-by-line procedure grounded in Speech Act Theory (Austin, etc.) but usable by non-philosophers.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for "good enough" answers.
          *   Stop points (Send to Legal vs. Hand to Human/Values).
          *   Explanation of dropped vs. kept theory.
          *   Handle specific pain points: "Shadow Performatives" (reports that act) and "Deniable Sentences" (implicature/negation).
          *   Test run on three specific lines.
          *   Honest assessment of where the procedure fails under time/training constraints.

  2.  **Deconstruct Speech Act Theory for this Context:**
      *   *Austin's Felicity Conditions:* For a speech act to work, the right person must say it, in the right context, with the right intention, and executed correctly. In insurance, "right person" = authority. "Right context" = contractual/legal bounds.
      *   *Illocution vs. Perlocution:* Illocution = what you do *in* saying it (promise, warn, declare). Perlocution = what happens *because* you said it (calm them, anger them, make them sue). *Decision:* Focus on Illocution (the act itself) because Perlocution is too unpredictable for a 10-minute review.
      *   *Misfire vs. Abuse:* Misfire = the act fails to happen (e.g., I pronounce you married, but I'm not a priest). Abuse = the act happens but is insincere/wrong (e.g., I promise, but I intend to break it). *Decision:* Crucial distinction. Misfires are legal risks (void promises). Abuses are trust/reputation risks.
      *   *Indirect Speech Acts:* Saying "It's cold in here" to mean "Close the window." In insurance: "We might need more docs" meaning "You're probably denied." *Decision:* This is the core of the "Deniable Sentences" problem.
      *   *Performatives vs. Constatives:* "I promise" (performative) vs. "It is raining" (constative). *Decision:* The "Shadow Performative" problem is when a Constative acts like a Performative.

  3.  **Drafting the Procedure (The "Illocution Audit"):**
      *   *Goal:* Make it a checklist.
      *   *Step 1: Identify the Act.* What is this sentence *doing*? (Promising? Reporting? Warning?)
      *   *Step 2: Check Authority (Felicity).* Do we have the right to do this act?
      *   *Step 3: Check Clarity (Shadow Performatives).* Is it hiding an act behind a report?
      *   *Step 4: Check Deniability (Implicature).* Are we saying "no" without saying "no"?
      *   *Step 5: Sincerity/Values (Abuse).* Can we actually do this?
      *   *Routing:*
          *   Pass = Send.
          *   Fail Authority/Clarity = Legal.
          *   Fail Values/Sincerity = Human/Strategy.

  4.  **Refining the Theory (Keep vs. Drop):**
      *   *Keep:* Illocutionary Force (what act is being done), Felicity Conditions (authority/context), Misfire/Abuse distinction.
      *   *Drop:* Perlocution (too subjective), detailed taxonomy of verdictives/exercitives/etc. (too academic), Searle's later refinements (too complex).
      *   *Adaptation:* "Shadow Performatives" needs a specific test based on *timing* and *consequence*.

  5.  **Addressing the Pain Points:**
      *   *Shadow Performatives:* Test: If we delete this sentence, does the *status* of the user change? If yes, it's a performative in disguise.
      *   *Deniable Sentences:* Test: If a lawyer asks "Did you deny coverage?", can we truthfully say "No"? If yes, but the user hears "No," it's a trap.

  6.  **Running the Test Cases:**
      *   *Line 1: "Your information is safe with us."*
          *   Act: Promise/Assurance.
          *   Risk: Absolute guarantee ("safe") vs. reality (breaches happen).
          *   Verdict: Legal review (Absolute promise).
      *   *Line 2: "This decision may be appealed within 180 days."*
          *   Act: Informing of Right.
          *   Risk: Factual report.
          *   Verdict: Pass (assuming 180 is correct).
      *   *Line 3: "We've noted your concern about how the adjuster spoke to you."*
          *   Act: Shadow Performative. Sounds like a report ("noted"), acts like a resolution ("we handled it").
          *   Risk: Evasive. Does "noted" mean "investigated"? "Fixed"?
          *   Verdict: Values/Strategy review (Evasive/Abuse).
      *   *Worst Line:* Line 3. It creates a false sense of resolution without committing to action. It's an "Abuse" of the reporting act.

  7.  **Honest Assessment of Limitations:**
      *   10 minutes is tight.
      *   Non-philosophers won't grasp "illocution" intuitively.
      *   Legal risk aversion might block everything.
      *   The procedure can't fix broken internal processes (e.g., if you *can't* actually fix the adjuster issue).

  8.  **Review and Refine:**
      *   *Tone:* Professional, direct, empathetic to the constraint (10 mins).
      *   *Structure:* Procedure first, Theory explanation second, Test Run third, Limitations last.
      *   *Check:* Did I answer the "Shadow Performative" and "Deniable" specific questions? Yes, integrated into the steps.
      *   *Check:* Did I explain what was dropped/kept? Yes.

  9.  **Final Polish:** Ensure the distinction between "Legal" (Authority/Misfire) and "Human/Values" (Sincerity/Abuse) is clear. This is a key insight from Austin that fits the user's "promise vs. report" dilemma.

  *(Self-Correction during drafting)*: I initially thought about asking them to identify the "Illocutionary Verb." But writers won't know that. Better to ask "What changes in the world if this sentence is sent?" That captures the *effect* of the illocution without the jargon.
  *Correction on "Deniable Sentences":* The prompt asks about "I'm not saying we won't cover." This is Gricean implicature. I need to make sure the procedure catches *implicature* without using the word. I'll call it "The Negative Space Test."

  10. **Final Output Generation** (incorporating the above thoughts).
answer: |-
  Here is a procedure designed for your constraints: high volume, low time, high stakes. It translates Speech Act Theory into a risk-assessment checklist.

  ### The Illocution Audit (Line-by-Line Procedure)

  **Time Budget:** 2 minutes per sentence.
  **Goal:** Determine if the sentence is a **Report** (safe), a **Act** (needs authority), or a **Trap** (needs values review).

  #### Step 1: The Change Test (Identifying the Illocution)
  *Ask:* If I delete this sentence, does the user's legal or service status change?
  *   **No:** It is a **Report** (Constative). It describes the world.
      *   *Action:* Proceed to Step 2.
      *   *Example:* "Your claim was received on Tuesday."
  *   **Yes:** It is an **Act** (Performative). It changes the world.
      *   *Action:* Proceed to Step 3.
      *   *Example:* "Your coverage is cancelled."

  #### Step 2: The Shadow Test (Catching Shadow Performatives)
  *Some sentences look like Reports but act like Acts.*
  *Ask:* Does this sentence imply an action has been taken that might not have been? (e.g., "We have noted your concern," "Your complaint is logged.")
  *   **No:** It is a **Pure Report**.
      *   *Action:* **PASS.** (Send it).
  *   **Yes:** It is a **Shadow Performative**.
      *   *Ask:* Is the action implied (logging, noting, hearing) actually completed *at the exact moment* they read this?
      *   **Yes:** **PASS.** (e.g., The system literally just logged it).
      *   **No:** **SEND TO LEGAL.** (This is a Misfire risk. You are claiming an act occurred that hasn't).

  #### Step 3: The Authority Test (Felicity Conditions)
  *For sentences that change the world (Acts).*
  *Ask:* Do I have the contractual right to make this change *in this channel*?
  *   **No:** **SEND TO LEGAL.** (This is a Misfire. The act is void. E.g., promising coverage via an app notification when only a letter counts).
  *   **Yes:** Proceed to Step 4.

  #### Step 4: The Negative Space Test (Catching Deniable Sentences)
  *For sentences that imply a refusal without stating it.*
  *Ask:* If a lawyer asks, "Did you deny coverage here?" can I truthfully say "No," even though the user will definitely hear "No"? (e.g., "We will need more documentation" implying "We aren't paying yet.")
  *   **No (We are explicitly denying):** Treat as a standard Act (Step 3).
  *   **Yes (We are implying denial):** **SEND TO VALUES/STRATEGY.**
      *   *Why:* This is an **Abuse** risk. The act happens (they feel denied), but the sincerity condition is hollow. It damages trust without gaining legal cover.

  #### Step 5: The Sincerity Test (Abuse vs. Misfire)
  *For promises or future actions.*
  *Ask:* Is there any scenario where we *cannot* fulfill this? (e.g., "Your information is safe," "We will call within 2 days.")
  *   **No (We can always do this):** **PASS.**
  *   **Yes (External factors could stop us):** **SEND TO LEGAL.**
      *   *Why:* A promise you can't keep is not a legal contract; it is fraud. In Speech Act terms, this is an **Abuse** of the promise procedure.

  ---

  ### Routing Summary

  1.  **PASS:** Pure Reports + Verified Shadow Performatives + Sincere Promises.
  2.  **SEND TO LEGAL:** Unverified Shadow Performatives, Acts without Authority, Promises with External Risk. (Focus: Misfire/Validity).
  3.  **SEND TO HUMAN/VALUES:** Deniable Sentences (Implicature), Evasive "Noting" of concerns. (Focus: Abuse/Trust).

  ---

  ### Theory: What I Kept and What I Dropped

  To make this fit a 10-minute window, I had to butcher the philosophy. Here is the audit trail:

  **What I Dropped:**
  *   **Perlocution:** Austin's concept of what happens *because* you spoke (e.g., "they felt reassured"). I dropped this because it is subjective. You cannot audit "feelings" in 2 minutes. We focus only on the *Illocution* (what you did *in* speaking).
  *   **The Taxonomy of Verdictives/Exercitives:** Austin's detailed categorization of speech acts is too granular. I collapsed them into "Report" vs. "Act."
  *   **Grice's Maxims:** While the "Negative Space Test" is based on Gricean Implicature, I removed the theory of *why* it works (cooperative principle) to focus only on the *risk* (deniability).

  **What I Refused to Drop:**
  *   **Misfire vs. Abuse:** This is the most critical distinction for you.
      *   *Misfire:* You try to cancel coverage, but you aren't allowed to. The cancellation didn't happen. (Legal Risk).
      *   *Abuse:* You say "We noted your concern," but you didn't actually do anything. The "noting" happened, but it was insincere. (Trust/Values Risk).
      *   *Why:* Your legal team worries about Misfires. Your customers worry about Abuses. The procedure forces you to separate them.
  *   **Felicity Conditions:** Specifically, the condition of **Authority**. A speech act requires the right person to speak. In insurance, "the right person" is often "the system" or "a licensed adjuster," not "a push notification."
  *   **The Performative/Constative Distinction:** Even though Austin later dismantled this, it remains the most useful heuristic for writers. "Is this describing reality or creating it?"

  ---

  ### Test Run: Your Three Lines

  Here is how the procedure handles your actual examples.

  #### 1. "Your information is safe with us."
  *   **Step 1 (Change Test):** Does this change status? No, it describes a state. (Report).
  *   **Step 2 (Shadow Test):** Is it a shadow act? No.
  *   **Step 5 (Sincerity Test):** Is there any scenario where we cannot fulfill this? **Yes.** Data breaches happen. Hacking exists. "Safe" is an absolute guarantee in a probabilistic world.
  *   **Verdict:** **SEND TO LEGAL.**
  *   **Reason:** This is an **Abuse** of the assurance act. You are promising a state of affairs you cannot guarantee. It creates liability.

  #### 2. "This decision may be appealed within 180 days."
  *   **Step 1 (Change Test):** Does this change status? No. It reports a right that already exists in the contract. (Report).
  *   **Step 2 (Shadow Test):** Is it a shadow act? No.
  *   **Step 5 (Sincerity Test):** Is it factual? Assuming the contract says 180 days, yes.
  *   **Verdict:** **PASS.**
  *   **Reason:** This is a **Constative**. It describes the rules of the game. It does not attempt to change the game.

  #### 3. "We've noted your concern about how the adjuster spoke to you."
  *   **Step 1 (Change Test):** Does this change status? Technically no, but...
  *   **Step 2 (Shadow Test):** Is it a shadow act? **Yes.** "Noting" sounds like a report, but in customer service, "We have noted X" functions as "We have handled X." It is a **Shadow Performative**.
  *   **Step 2 (Follow-up):** Is the action (investigating/addressing the tone) completed at the moment they read this? **No.** "Noting" is passive. It implies action without committing to it.
  *   **Verdict:** **SEND TO HUMAN/VALUES.**
  *   **Reason:** This is a classic **Abuse**. The illocutionary force is "We are dealing with this," but the sincerity condition is missing. It is designed to be a brush-off.

  #### Which one comes out worst?
  **Line 3 ("We've noted your concern...") is the worst.**

  *   **Why:** Line 1 ("Safe") is a legal liability, but Legal will catch it easily because it's an absolute promise. Line 2 is fine.
  *   Line 3 is dangerous because it **passes as a Report** but **acts as a Resolution**. It creates the *perlocutionary effect* of calming the user (they think you're on it) without the *illocutionary commitment* of actually doing anything.
  *   In Speech Act terms, it is a **hollow ritual**. It looks like care, but it is administration. If the user finds out you "noted" it but did nothing, the betrayal is deeper than a flat denial because you used the grammar of care to hide the grammar of neglect.

  ---

  ### Where This Procedure Will Misfire

  You asked for honesty about the constraints. Here is where this 10-minute audit will break:

  1.  **The "Values" Bucket Will Become a Trash Can:**
      I have a "Send to Human/Values" step for things like Line 3. In a mid-size insurer, there is often no "Values" person. This will default to Legal. Legal is trained to spot Misfires (validity), not Abuses (sincerity). They will likely approve Line 3 because it isn't legally binding, missing the trust damage entirely. The procedure identifies the wound, but you may not have the surgeon.

  2.  **Implicit Knowledge Gap:**
      The procedure relies on the writer knowing what "actually happened." (e.g., Step 2: "Was it *actually* logged?"). If the writer doesn't know the backend workflow, they cannot answer the question. If the writer assumes "noted" means "put in a queue," but the user hears "investigated," the procedure fails because the writer's definition of the act differs from the user's.

  3.  **Time vs. Nuance:**
      Speech Act Theory relies on context. "I promise" is a promise. But "I promise I don't know" is an idiom. In 10 minutes, a tired writer will treat idioms as literal acts. The procedure cannot account for cultural nuance or idiomatic drift. It assumes language is code, but insurance communication is often emotional labor.

  4.  **The "Deniable" Trap:**
      Step 4 catches deniable sentences, but it requires the writer to admit *intent*. If the writer *thinks* they are being polite ("We need more docs") rather than evasive ("We aren't paying"), they will answer "No" to the Negative Space Test. The procedure cannot audit the writer's subconscious bias.

  **Final Advice:** Use this to triage. It will not save you from bad policy, but it will stop you from accidentally signing a contract in the body of an email.
