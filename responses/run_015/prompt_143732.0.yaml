  ### BRAINSTORMING / WORKING NOTES
  *(Do not circulate)*

  **The Core Tension:**
  We are stuck between two bad options. Option A: The "View from Nowhere." We pretend relationships don't exist once the paperwork ends. This is a lie, as my friend points out. It privileges the stranger over the expert. Option B: The "View from Somewhere." We admit relationships persist and try to manage them. This risks turning every committee meeting into a therapy session or a courtroom cross-examination of everyone's friendships and feuds.

  **The Friend's Confucian Point:**
  He's right about the "Recusal Ratchet." If we keep expanding recusal to cover every past interaction, eventually only people who know nothing about the field can judge the grants. That lowers the quality of decision-making. He's also right about negative partiality. The current rules assume bias is always *for* someone. But bias is often *against* someone. A rival who wants to see you fail is a bigger conflict of interest than a mentor who wants to see you succeed. The mentor usually wants you to succeed *on merit* so their reputation holds. A rival might want you to fail *regardless of merit*. Our current forms don't catch the rival.

  **The "Declared Partiality" Idea (User's Proposal):**
  I like the spirit. It treats bias as data rather than disqualification. But the "weighting/offset" mechanism is administrative poison.
  *Problem 1:* If Reader A's score counts for 0.5 because they are a mentor, and Reader B's counts for 1.0 because they are neutral, Reader A will feel silenced and Reader B will feel overburdened.
  *Problem 2:* How do you calculate the offset? If a mentor gives a 9/10, is that actually a 7/10? Who decides the conversion rate?
  *Problem 3:* It requires public shaming. "I am declaring I am biased." Most faculty won't do it honestly if it diminishes their vote.
  *Verdict:* Kill the math. Keep the disclosure. Use disclosure to trigger *discussion*, not score adjustment. If a tie is declared, the chair must ensure the group explicitly discusses that proposal's merits independent of the score.

  **The Specific Complaint:**
  We cannot rescind the award. The reader followed the written rule. To punish her now is *ex post facto* justice. It destroys trust in the committee more than the favoritism does. The runner-up will be angry, but if we change the rules retroactively, *everyone* becomes vulnerable.
  *Strategy:* Uphold the award. Censure the reader privately for "poor judgment regarding the spirit of the policy." Apologize to the runner-up for the *appearance* of impropriety, not the outcome.

  **The New Rule:**
  We need a statute of limitations. "Current" is too loose. "Forever" is too tight. Five years is standard for tenure clocks and grant lookbacks. Let's use five years.
  We must add "Adversarial Relationships." Hard to define, but necessary. "Known personal animosity" is the phrase.

  **Honoring the Friend:**
  The memo cannot just say "We considered Confucian ethics and decided on bureaucracy." It needs to say: "The critique that total impartiality is a fiction is correct. However, in a public distribution of funds, the *appearance* of impartiality is a functional requirement, even if philosophically incomplete." Give his argument the weight of a tragic necessity, not a correction of an error.

  ***

  ### MEMORANDUM

  **TO:** University Senate
  **FROM:** Committee on Conflicts of Interest
  **DATE:** October 10
  **SUBJECT:** Adjudication of Fellowship Complaint and Recommended Policy Revisions

  **EXECUTIVE SUMMARY**

  The Committee recommends that the funded status of the fellowship award in question remain unchanged, as no existing policy was violated. However, we recommend immediate censure of the reader involved for failure to uphold the spirit of the committee's standards. Regarding future policy, we recommend replacing the current "Current Relationship" standard with a "Five-Year Lookback" standard, expanding disclosure requirements to include adversarial relationships, and rejecting score-weighting in favor of mandatory deliberative disclosure.

  **1. ADJUDICATION OF THE LIVE COMPLAINT**

  **The Facts:** A panel reader scored a proposal submitted by a former doctoral advisee (relationship ended six years prior). The reader did not recuse herself. Under the policy active at the time of review, recusal was only mandatory for family, financial interests, and *current* supervisory relationships.

  **The Decision:** The Committee votes to uphold the award.

  **The Reasoning:**
  To rescind the award based on a rule that did not exist at the time of judgment would constitute *ex post facto* punishment. This would set a precedent that committee decisions are unstable and subject to retroactive rule changes. This undermines the security of all future awards. The reader acted within the letter of the law.

  However, acting within the letter of the law is not sufficient for maintaining trust. The reader's decision to participate, while permissible, violated the normative expectation of distance required for public confidence. We will issue a formal letter of censure to the reader, noting that while she was technically compliant, her judgment regarding the *appearance* of impropriety was flawed.

  **Message to the Runner-Up:**
  We will meet with the complaining faculty member personally. We will acknowledge that the outcome creates an appearance of favoritism that damages the fellowship's prestige. We will apologize for the committee's failure to anticipate this loophole. We will not offer financial compensation, as the competition was conducted according to the rules, but we will guarantee that their proposal receives a formal review summary from the Chair to ensure their work was evaluated on merit by the remaining readers.

  **2. RECOMMENDED POLICY REVISIONS (EFFECTIVE SPRING CYCLE)**

  We propose the following changes to the Conflict of Interest Policy for all internal research competitions:

  *   **A. The Five-Year Rule:** Recusal is now mandatory for any supervisory relationship (advisor/advisee) that existed within the past five years. This creates a bright line that balances expertise with distance.
  *   **B. The Adversarial Clause:** Recusal is now mandatory for "known personal animosity or active professional rivalry." This must be self-declared. This addresses the previously unregulated risk of negative bias.
  *   **C. Managed Disclosure (Replacing "Declared Partiality"):** We considered a proposal to allow readers to declare ties and have their scores mathematically weighted or offset by neutral readers. We reject the weighting mechanism. It creates a two-tier voting system that discourages honest disclosure and complicates tabulation. Instead, we adopt **Mandatory Deliberative Disclosure**. If a reader has a tie that falls outside the mandatory recusal window (e.g., a collaborator from seven years ago), they must declare it. Their score stands, but the Chair is required to lead a specific discussion on that proposal to ensure the score is grounded in the text, not the relationship.

  **3. PHILOSOPHICAL GROUNDING AND DISSENTING CONSIDERATIONS**

  In drafting these revisions, the Committee engaged deeply with the theoretical underpinnings of "recusal." We owe it to the Senate to explain why we chose these specific boundaries, particularly regarding the argument that our current system is philosophically flawed.

  **The Critique of the "Stranger Ideal"**
  A significant portion of our deliberation focused on the argument that the standard recusal model relies on a false premise: that the ideal evaluator is a stranger with no history. This view holds that relationships create duties that do not simply vanish when a degree is conferred. By forcing a mentor to pretend they are a stranger to a former student, we are not creating fairness; we are creating a fiction. We are asking them to lie about their capacity to judge the work.

  Furthermore, this critique argues that by constantly expanding recusal rules to ensure "purity," we create a "Recusal Ratchet." We push out the people with the most knowledge (mentors, collaborators) and leave the judging to those with the least knowledge. Simultaneously, we ignore the people with the most dangerous bias: those who actively dislike the applicant. A stranger might be indifferent; a rival might be malicious. Our old rules policed love but ignored hate.

  **Why We Chose Procedural Impartiality**
  The Committee accepts the strength of this critique. It is true that a mentor often has a *better* understanding of the work's significance than a stranger. It is also true that negative partiality is a greater risk than positive partiality.

  However, we are not writing policy for a village or a private guild; we are writing for a public research university distributing state-adjacent funds. In this context, **legitimacy depends on visibility.**

  Even if a mentor *could* judge more accurately than a stranger, the public and the student body cannot see the nuance of that judgment. They see the relationship. In a context of scarcity (only eight awards), the appearance of a closed loop is corrosive. We cannot ask the community to trust that a mentor's bias is "benign" or "knowledgeable." We must prioritize the *process* over the *epistemic advantage*.

  We rejected the "Declared Partiality" weighting system because it attempts to solve a trust problem with mathematics. Telling a community "We accounted for the bias by discounting the score by 20%" does not build trust; it admits the bias while trying to hide behind a formula.

  **The Compromise**
  Our new policy attempts to split the difference.
  1.  **We acknowledge the Ratchet:** By setting a five-year limit rather than a "forever" ban, we allow experts with recent knowledge to serve once a reasonable cooling-off period has passed.
  2.  **We acknowledge Negative Partiality:** By adding the Adversarial Clause, we admit that bias is not just about favoring friends.
  3.  **We acknowledge the Fiction:** By requiring "Mandatory Deliberative Disclosure" for ties outside the recusal window, we force the relationship into the room. The mentor does not have to pretend to be a stranger. They must say, "I know this work," and then the group must verify the score together.

  This is not a perfect solution. It sacrifices some expertise for the sake of public trust. It sacrifices the nuance of role-based ethics for the clarity of administrative rules. But it is the only system that allows us to distribute funds without requiring the community to believe in the moral perfection of the judges.

  **4. TIMELINE AND IMPLEMENTATION**

  *   **October 15:** Senate vote on policy revision.
  *   **November 1:** Interim guidance issued to all College Deans for Spring Fellowship cycle.
  *   **Spring Cycle:** New disclosure forms distributed. Panel Chairs briefed on "Mandatory Deliberative Disclosure" protocol.

  **Recommendation:** The Committee moves to adopt the Five-Year Lookback and Adversarial Clause immediately, with the understanding that this policy will be reviewed in three years to assess its impact on panel expertise and applicant diversity.

  Respectfully submitted,

  [Your Name]
  Junior Faculty Representative
  Senate Committee on Conflicts of Interest
