prompt: |-
  hi so im in this biology club at school and we're putting together a booth for the science fair where people answer a few questions and then get told "your theory of life is: ___". i want it to be an actual sorter, not one of those quiz-site things that asks "are viruses alive? yes/no" and then slaps a label on you.

  what i want: 8 or 9 questions, each one a concrete borderline case, with three options each (alive / not alive / the question is badly asked or it's a matter of degree), plus a scoring key mapping answer patterns onto the real positions. the leaves i want to be able to hand people are: the self-maintaining view (you're alive if you do work to keep yourself going, held far from equilibrium, with a boundary you maintain yourself), the heredity-plus-variation view (alive if you're part of something that can evolve by selection), a view where what matters is belonging to a lineage rather than what the individual thing can do on its own, a substrate-neutral view (chemistry isn't required, code that copies itself with variation counts), and a deflationary view where the word just doesn't cut nature at a joint and demanding yes or no is the mistake.

  but build it from the logical space instead of from that list. i want the questions first and then the named views located inside the space, and its fine if a combination of answers turns out to have nobody in it — just tell me whether that combination is incoherent, unattractive, or merely unexplored. also flag any two of my leaves your quiz can't actually separate, because i think the deflationary one is definately going to swallow everything and i don't know what to do about that.

  the split i care most about is whether metabolism matters at all or whether copying-with-variation is the whole story, since that's what decides the virus case, so give me at least two cases that press exactly on that seam.

  cases you have to use (i made some of these up because the textbook ones are boring): a mule; a seed that's been in a drawer for 200 years doing basically nothing but could still sprout; a protein that just forces other proteins into its own shape; a tumor evolving inside one person's body that will die with them; a molecule inside a cell that gets copied whenever the cell divides and does nothing else; a robot that can assemble a copy of itself out of parts it finds, but whose copies always come out exactly identical; a program on a computer that copies itself with typos and competes with other programs for processor time, and gets wiped every night when the lab reboots the machine; a candle flame; a line of human cells kept going in dishes for decades; and a cell we assembled in a lab whose genome was written on a computer and whose ancestors were never alive.

  keep the wording so a 9th grader who's never heard of any of these theories can just answer. no citations or reading lists, i only need the instrument itself. and at the end tell me how confident you are in the whole thing and single out the one claim you're least sure about — like which leaf or which case you'd expect an actual biologist to tell me i got wrong.
