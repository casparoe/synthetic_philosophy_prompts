answer: |-
  # The "What is Life?" Sorter

  **Instructions for Booth Staff:**
  Hand this sheet to the visitor. Tell them: *"There are no right answers. We are mapping your intuition, not testing your biology knowledge. If a question feels like it's missing information or forcing a yes/no where there isn't one, pick the third option."*

  Once they return it, use the **Scoring Key** below to determine their "Theory of Life" leaflet.

  ---

  ## The 9 Cases

  **1. The Mule**
  A mule is a healthy animal that eats, breathes, and moves, but it is sterile. It cannot have babies.
  *   **Alive**
  *   **Not Alive**
  *   **Tricky / Bad Question**

  **2. The Deep-Time Seed**
  A seed sits in a drawer for 200 years. It does not breathe, grow, or use energy. But if you plant it, it sprouts. While it is in the drawer, is it alive?
  *   **Alive**
  *   **Not Alive**
  *   **Tricky / Bad Question**

  **3. The Shape-Shifting Protein**
  A protein molecule enters a cell and forces other proteins to twist into its same shape. It makes more of itself, but it has no DNA and uses no energy of its own.
  *   **Alive**
  *   **Not Alive**
  *   **Tricky / Bad Question**

  **4. The Evolving Tumor**
  A tumor grows inside a person. The cells inside it mutate and compete (evolve), but when the person dies, the tumor line ends forever. It has no future.
  *   **Alive**
  *   **Not Alive**
  *   **Tricky / Bad Question**

  **5. The Passenger Molecule**
  A snippet of DNA inside a cell gets copied every time the cell divides. It does nothing else. It doesn't help the cell; it just hitches a ride.
  *   **Alive**
  *   **Not Alive**
  *   **Tricky / Bad Question**

  **6. The Copying Robot**
  A robot finds parts and builds a perfect copy of itself. The copy is exactly identical. There are no mistakes or changes ever.
  *   **Alive**
  *   **Not Alive**
  *   **Tricky / Bad Question**

  **7. The Digital Program**
  A computer program copies itself with small typos. The copies compete for processor time. The better ones survive. But the computer is made of silicon, not carbon.
  *   **Alive**
  *   **Not Alive**
  *   **Tricky / Bad Question**

  **8. The Candle Flame**
  A flame takes in fuel, releases energy, maintains a shape, and moves. But it does not have DNA and does not copy itself.
  *   **Alive**
  *   **Not Alive**
  *   **Tricky / Bad Question**

  **9. The Lab-Made Cell**
  Scientists write a genome on a computer, build it chemically, and put it into an empty cell shell. It wakes up and divides. But it has no living ancestors.
  *   **Alive**
  *   **Not Alive**
  *   **Tricky / Bad Question**

  ---

  ## Scoring Key (For Booth Staff)

  **Step 1: Check for the "Deflationary" View**
  Count how many times they chose **"Tricky / Bad Question"**.
  *   **If 6 or more:** Their leaf is **The Deflationary View**.
      *   *Why:* They believe "Life" is a fuzzy human word that doesn't match the messy real world.
      *   *Note:* If they picked "Tricky" on the easy ones (like the Flame) but "Yes/No" on the hard ones, they might just be unsure. Use your judgment.

  **Step 2: If they have 5 or fewer "Tricky" answers, tally the "Yes (Alive)" votes for these specific groups:**

  *   **Group A (Chemistry & Energy):** Questions 2 (Seed), 3 (Protein), 8 (Flame).
  *   **Group B (History & Lineage):** Questions 4 (Tumor), 9 (Lab Cell).
  *   **Group C (Information & Code):** Questions 6 (Robot), 7 (Program).

  **Step 3: Determine the Dominant View**

  *   **The Self-Maintaining View**
      *   *Pattern:* Said **Alive** to **Seed (Q2)** AND **Mule (Q1)**. Said **Not Alive** to **Program (Q7)** AND **Protein (Q3)**.
      *   *Logic:* Life is about keeping yourself going and fighting decay. If you don't eat/breathe (Seed) or aren't made of stuff (Program), you aren't alive.
      *   *Leaflet:* "You believe life is a fire that keeps itself burning. It's about the work you do to stay far from equilibrium."

  *   **The Heredity-Plus-Variation View**
      *   *Pattern:* Said **Alive** to **Program (Q7)** OR **Protein (Q3)**. Said **Not Alive** to **Robot (Q6)** (because it has no variation/typos).
      *   *Logic:* Life is about evolution. If you can copy yourself with changes, you are alive. If you copy perfectly (Robot) or can't evolve, you are just a machine.
      *   *Leaflet:* "You believe life is a process of evolution. It doesn't matter what you are made of, only that you can change and adapt over time."

  *   **The Lineage View**
      *   *Pattern:* Said **Not Alive** to **Lab Cell (Q9)**. Said **Alive** to **Mule (Q1)** AND **Tumor (Q4)**.
      *   *Logic:* Life is a historical chain. You must come from living parents. A lab-made cell is a fake start; a mule is real because its parents were real.
      *   *Leaflet:* "You believe life is a family tree. To be alive, you must belong to an unbroken chain of ancestors stretching back to the beginning."

  *   **The Substrate-Neutral View**
      *   *Pattern:* Said **Alive** to **Program (Q7)**. Said **Alive** to **Lab Cell (Q9)**.
      *   *Logic:* Matter doesn't matter. Code is life whether it's in DNA or Silicon. Origin doesn't matter, function does.
      *   *Leaflet:* "You believe life is a pattern, not a substance. If the logic of life is present, the chemistry doesn't matter."

  *   **Unexplored / Incoherent Combinations**
      *   *If they said Alive to Flame (Q8) but Not Alive to Seed (Q2):* This is logically unstable (Fire has metabolism but no genetics; Seed has genetics but no metabolism). Hand them the **Deflationary** leaflet with a note: *"Your intuition suggests 'Life' might mean different things in different contexts."*
      *   *If they said Alive to Robot (Q6) but Not Alive to Program (Q7):* This is rare (Accepting perfect copying but rejecting evolving code). Hand them the **Self-Maintaining** leaflet, as they likely value the physical construction over the information.

  ---

  ## Limitations & Notes for the Club

  **1. The "Deflationary Swallow"**
  The Deflationary View is the hardest to isolate. A student who answers "Tricky" to everything because they *don't know the science* will get the same result as a philosopher who believes the category "Life" is invalid.
  *   *Fix:* Booth staff should ask a follow-up: *"Did you pick 'Tricky' because you weren't sure, or because you think the question is impossible to answer?"*

  **2. Leaves We Can't Fully Separate**
  *   **Heredity vs. Substrate-Neutral:** These two are very close. If someone says the Digital Program is Alive (Substrate-Neutral), they almost always accept the Heredity view too. The only way to separate them is if someone says *"Evolution matters, but it must be biological DNA."* This quiz flags that in **Group C**, but it's a fine line.
  *   **Self-Maintaining vs. Lineage:** These usually agree on everything except the **Lab-Made Cell (Q9)**. If a visitor skips that question or picks "Tricky," you cannot tell these two views apart.

  **3. The Metabolism vs. Copying Seam**
  You asked to press on this seam. **Question 3 (Protein)** and **Question 7 (Program)** do the heavy lifting here.
  *   If they say the Protein is Alive but the Seed (dormant) is Not: They prioritize *activity* (Metabolism).
  *   If they say the Protein is Alive but the Robot (no typos) is Not: They prioritize *evolution* (Heredity).

