answer: |-
  Here is a draft for the interactive quiz, designed to be copy-pasted directly into your CMS. It follows your constraints: no jargon in the questions, intuitive scenarios, and a scoring key that maps to the philosophical positions while flagging the blurry lines.

  ***

  # Quiz: So You Think You're a Physicalist?

  **Instructions:** There are no right or wrong answers here. We aren't testing your science knowledge; we're testing your intuitions. Read each scenario and pick the option that feels most true to you. At the end, we'll tell you which philosophical camp your gut belongs to.

  ### 1. The Classic Exit
  Mary is a brilliant scientist who knows every physical fact about how humans see color. But she has lived her whole life in a black-and-white room. One day, she walks outside and sees a red tomato. What just happened in her mind?
  *   **A.** She discovered a new fact about the universe that wasn't in her textbooks.
  *   **B.** She didn't learn a fact; she just gained a new ability, like learning to ride a bike.
  *   **C.** She didn't learn anything new about the world, but she's now experiencing the old facts in a new way.
  *   **D.** Nothing significant happened. If she really knew *everything* physical, she already knew exactly what that moment would be like.

  ### 2. The Taste Test
  Imagine a man named Dave. He grew up eating flavorless nutrient paste but memorized every chemical fact about how taste buds work. He finally eats a lemon. Is Dave's situation the same as Mary's?
  *   **A.** Yes. Just like Mary, he discovers something about reality that chemistry left out.
  *   **B.** Yes, but it's a skill. He can now recognize "sour" in a way he couldn't before.
  *   **C.** It's similar, but taste feels more "bodily" than vision. Still, he's just accessing physical data differently.
  *   **D.** No. If he knew all the physical facts, he could have simulated the taste perfectly in his head. He learns nothing.

  ### 3. The Pain Variation
  Now imagine a person who knows every nerve signal involved in touching a hot stove but has a condition that prevents them from feeling pain. They finally touch a hot stove. Does this prove physicalism (the idea that everything is physical stuff) is false?
  *   **A.** Yes. The "ouch" is a real thing that exists over and above the nerve signals.
  *   **B.** No. They just learned how to react to the signals, not a new fact about the signals.
  *   **C.** No. They have the same data, but now it's "live" data instead of "theoretical" data.
  *   **D.** No. The "ouch" is just the nerve signal. If they knew the signal, they knew the pain.

  ### 4. The Forgetful Scientist
  Mary sees the red tomato. She says, "Ah, so *that's* what red is!" Then, she immediately gets amnesia about the experience (though she keeps her science knowledge). She sees a red tomato again tomorrow. Does she learn the same thing twice?
  *   **A.** Yes. She keeps discovering a new fact that her science books never contained.
  *   **B.** No. She has to re-calibrate her recognition skills, like forgetting how to swim and relearning.
  *   **C.** Sort of. She has to re-activate the specific mental file for that experience.
  *   **D.** No. If she truly knew the physical facts the first time, she shouldn't have been able to forget the experience in the first place.

  ### 5. The Letter Home
  While still in the black-and-white room, Mary tries to write a letter to her future self explaining what red looks like, using only her physics knowledge. Can she do it?
  *   **A.** No. There are words for the experience that she literally does not have yet.
  *   **B.** No. She can write instructions on how to recognize it, but not describe the thing itself.
  *   **C.** She can write it, but her future self won't "feel" the meaning until they step outside.
  *   **D.** Yes. If she knows all the physical facts, she has all the words needed to describe it.

  ### 6. The Achromat Variation
  What if the person stepping out of the room isn't Mary, but a congenital achromat (someone physically incapable of seeing color) who somehow has all Mary's neuroscience knowledge? They step out and still see only gray. Is the result the same?
  *   **A.** No. Mary learned a fact; the achromat is just biologically blocked from accessing it.
  *   **B.** No. Mary gained a skill; the achromat lacks the hardware to perform the skill.
  *   **C.** It's the same. Both are trying to access a mode of experience that requires specific biological access.
  *   **D.** It's the same. Neither learns anything new about the universe, only one gets the sensory input.

  ### 7. The Robot Scanner
  A perfect robot scans Mary's brain the exact moment she sees the red tomato. It records every atom and electron. Does the robot know what it's like to see red?
  *   **A.** No. The robot has the data, but it doesn't have the *experience*.
  *   **B.** No. The robot could simulate the behavior, but it hasn't practiced the skill of seeing.
  *   **C.** Yes, but only if the robot processes that data through a system designed to experience it.
  *   **D.** Yes. If the scan is perfect, there is no leftover "experience" that the robot is missing.

  ### 8. The "So What?"
  Let's say Mary does learn something new when she sees the tomato. Does this mean science is broken?
  *   **A.** Yes. Science deals in physical facts, so if there's a non-physical fact, science is incomplete.
  *   **B.** No. Science explains the body; "what it's like" is just a skill the body has.
  *   **C.** No. Science explains the world; the "new thing" is just how humans grasp the world.
  *   **D.** No. Because she didn't actually learn anything new. Science covers everything.

  ***

  ## Scoring Key

  Tally up which letter you chose most often. (If you have a tie, read both descriptions).

  **Mostly A: The Property Dualist**
  *   **The Verdict:** You believe Mary learns a **New Fact**.
  *   **The Position:** You think there are truths about the universe (like what red *feels* like) that cannot be found in a physics textbook, no matter how thick the book is. To you, the mind isn't just a biological machine; it generates properties that are fundamentally different from matter.
  *   **The Trouble:** You have to explain where these non-physical facts come from and how they interact with the physical brain without breaking the laws of physics.

  **Mostly B: The Ability Theorist**
  *   **The Verdict:** You believe Mary gains **Know-How**.
  *   **The Position:** You are a physicalist, but you think "knowledge" comes in different flavors. Mary didn't learn a new *truth* (propositional knowledge); she learned a *skill* (ability knowledge). She can now recognize, imagine, and remember red. It's like knowing every fact about swimming vs. actually jumping in the pool.
  *   **The Trouble:** Critics argue Mary seems to learn something true ("*This* is red"), not just how to do something.

  **Mostly C: The Phenomenal Concept Strategist**
  *   **The Verdict:** You believe Mary gains a **New Mode of Access**.
  *   **The Position:** You are a physicalist. You think the *fact* about red is physical, but the *concept* Mary uses to grasp it is unique. Before, she knew "red" via scientific concepts (wavelengths, neurons). Outside, she knows "red" via experience. It's the same world, same facts, just a new file format.
  *   **The Trouble:** It's notoriously hard to explain exactly what a "phenomenal concept" is without accidentally sounding like a Dualist (Option A).

  **Mostly D: The Deflationary Physicalist (Type A)**
  *   **The Verdict:** You believe Mary Learns **Nothing New**.
  *   **The Position:** You bite the bullet. You argue that if Mary *truly* knew every physical fact, she would already know exactly what seeing red is like. The idea that she learns something new is an illusion caused by our limited imaginations. Experience *is* physical processing, full stop.
  *   **The Trouble:** This requires telling Mary (and most readers) that their intuition—that they just learned something—is flat-out wrong.

  **Mixed / Contradictory Answers: The Unoccupied Logical Space**
  *   **The Verdict:** You found a spot on the map nobody lives on.
  *   **The Position:** If you chose combinations like **A** (She learns a new fact) and **D** (Science is complete/She learned nothing), you've stumbled into a logical contradiction.
  *   **Why it's interesting:** Philosophers generally avoid this space. For example, claiming "She learns a new *physical* fact" contradicts the setup that she already knew *all* physical facts. Or claiming "She learns nothing new" but "Science is still incomplete" makes it hard to say what science is missing. If you landed here, your intuition might be more nuanced than the current categories allow—or you might just be keeping the philosophers on their toes.

  ***

  ## A Note for the Comments (The Honesty Clause)

  *Editor's Note: If you're emailing us to say "I'm mostly B but also a little C," you're in good company. This quiz is designed to separate broad intuitions, but in the academic literature, the line between the **Ability Hypothesis (B)** and the **Phenomenal Concept Strategy (C)** is famously blurry. Both are physicalist attempts to save the data, and both rely on distinguishing between "knowing that" and "knowing how" or "knowing via experience." If your results split between these two, you essentially agree that Physicalism is true, but you're haggling over the mechanism. That's where the real seminar is.*
