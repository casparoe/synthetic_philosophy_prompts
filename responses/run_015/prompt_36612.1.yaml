      *   **Honesty Clause:** Flag which positions the quiz can't distinguish.

  2.  **Deconstruct the Philosophical Positions (for the Scoring Key):**
      *   *Physicalist (Type A/Deflationary):* Mary learns nothing new. The "what it's like" is an illusion or just identical to the physical facts she already had.
      *   *Physicalist (Type B/Phenomenal Concepts):* Mary learns no new *fact* about the world, but gains a new *concept* or way of accessing the old facts. (Same facts, new grasp).
      *   *Physicalist (Ability Hypothesis):* Mary gains a skill (imagining, recognizing), not propositional knowledge.
      *   *Dualist (Property Dualist):* Mary learns a new fact about reality that wasn't in the physical book. Physicalism is false.
      *   *Unoccupied:* Maybe someone who thinks she learns a new fact but it's still physical? (Contradictory). Or someone who thinks the achromat case is different from the Mary case in a specific way.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: The Classic.* Needs to establish the baseline. Mary steps out, sees red.
