      *(Self-Correction during drafting)*: I need to be careful with the "Unoccupied" category. It shouldn't just be "random answers." It should be a specific combination that implies a view nobody holds (e.g., "She learns nothing new" BUT "She cannot explain it to her past self"). Actually, a better unoccupied space is: "She learns a new physical fact" (contradicts the setup that she knows *all* physical facts). I will frame the scoring to catch people who deny the premise while accepting the conclusion.

