answer: |-
  This is a remarkably precise phenomenological observation. You have identified a gap in the standard Strawsonian binary that contemporary responsibility theorists are still actively trying to map. You are describing a shift that is neither **blame** (which requires a judgment of culpable fault) nor **exemption** (which requires a judgment of compromised capacity), but rather a **prudential suspension of the participant stance** grounded in **epistemic risk**.

  There is no single, canonical term for this in the literature (like "The Categorical Imperative"), but it is a recognized structural problem in moral psychology. The closest established conceptual carving is **"The Prudential Objective Attitude"** (a specific subset of Strawson's objective attitude) or, in the literature on trust, **"The Shift from Normative Expectation to Predictive Reliance."**

  Here is the carving you requested, evaluating your four hypotheses and defining the boundaries.

  ### 1. Evaluating Your Four Hypotheses

  **First: The Objective Attitude Itself.**
  You are right to hesitate. Strawson introduces the objective attitude primarily in cases of *exemption* (children, the deranged, those under abnormal strain). However, he does briefly acknowledge that we may adopt it for "our own protection" or "peace of mind."
  *   **Verdict:** This is the correct *category*, but your case specifies a *condition* Strawson leaves vague. It is not the objective attitude triggered by *incapacity*, but the objective attitude triggered by *unreliability without culpability*. It is a **Prudential Objective Attitude**. It resembles the standard objective attitude phenomenologically (you manage rather than engage), but its justification is different (risk management vs. lack of agency).

  **Second: Blame in Disguise.**
  You asked for this to be pressed hard. This is the strongest rival explanation. A virtue ethicist (or a character-based responsibility theorist) would argue: "Reliability is a virtue. A pattern of unreliability, even if excused instance-by-instance, reveals a defect in the agent's *practical identity* or *life-management*."
  *   **The Counter-Argument:** If the excuses are truly *force majeure* (death in the family, sudden illness), attributing this to character is a fundamental attribution error. However, if the pattern suggests an inability to *buffer* against life's chaos (e.g., no backup childcare, poor time estimation), then it *is* a character flaw.
  *   **Verdict:** If the pattern is truly non-culpable (bad luck stacking up), this hypothesis fails. If the pattern reveals a lack of *resilience* or *contingency planning* that the agent *could* have addressed, it collapses into blame. Your intuition that it feels different from blame suggests you are treating the bad luck as truly external.

  **Third: Reliance or Prediction (Statistical).**
  This captures the *mechanism* (revised forecast) but misses the *moral residue*. You noted you would be "embarrassed to describe it to her." If this were purely statistical (like the weather), there would be no embarrassment. The embarrassment arises because you know you are withdrawing a *moral good* (the participant stance) that is owed to persons *qua* persons.
  *   **Verdict:** Incorrect. It is a moral shift, not merely an epistemic one. You are downgrading their status in your moral ecology, not just your calendar.

  **Fourth: Structural Parallel (Overdetermination).**
  This breaks down. The "dial" case is about *harm* aggregation (many agents, one victim). Your case is about *stance* aggregation (one agent, many instances). The moral math is different. In the dial case, no one is responsible for the harm. In your case, the question is whether you are responsible for the withdrawal of recognition.
  *   **Verdict:** Incorrect parallel.

  **Fifth: A Defect in You (Moral Laziness).**
  This is the most serious challenge. Philosophers like **Victoria McGeer** (on "scaffolding") and **Pamela Hieronymi** (on "trust") argue that maintaining the participant stance is sometimes a *duty* we owe to others to help them remain responsible agents. By withdrawing the stance, you might be contributing to their unreliability (self-fulfilling prophecy).
  *   **Verdict:** It is not necessarily a *defect*, but it is a *cost*. It is a tragic necessity of non-ideal conditions. However, if you withdraw the stance *secretly* (as in your examples), you avoid the confrontation that might fix the problem. This leans toward a defect of *courage*, not necessarily of moral understanding.

  ### 2. The Definition and Carving

  If we accept this is a distinct phenomenon, here is the definition:

  **Non-Culpable Relational Downgrading (NCRD)**
  *A justified shift from a participant stance to a prudential objective stance toward a specific agent, warranted by a diachronic pattern of non-culpable failures, resulting in a reduction of normative expectations without a judgment of moral fault.*

  **What it is:**
  *   A protective measure for the agent holding the stance (you).
  *   A recognition of **Agential Risk** (the risk that engaging with this person will lead to frustration/harm) distinct from **Agential Fault**.
  *   A move from **Normative Expectation** ("You ought to show up, and I hold you to that") to **Predictive Reliance** ("You probably won't show up, so I will plan around that").

  **What it is not:**
  *   It is not **Resentment**: You feel no anger, only caution.
  *   It is not **Contempt**: You do not view them as inferior, merely as high-risk.
  *   It is not **Exemption**: You still view them as a moral agent in other contexts; this is local, not global.

  ### 3. Handling the Boundary Cases

  **(a) The Standing Policy (Attributability)**
  *   *Scenario:* Friend cancels because he says "yes" to everyone and overbooks.
  *   *Analysis:* Here, the pattern *is* attributable to a character trait (inability to set boundaries, or valuing others' approval over reliability).
  *   *Edge:* The phenomenon **collapses into blame**. If the pattern is caused by a policy the agent could revise but doesn't, they are responsible for the pattern even if excused for the instances. NCRD requires the pattern to be truly external to the will (e.g., chronic bad luck, systemic barriers).
  *   *Sharpness:* Very sharp. The moment you can say "He could have organized his life differently," it becomes blame.

  **(b) The Threshold (Two vs. Five)**
  *   *Scenario:* When does the shift become warranted?
  *   *Analysis:* This is an **Epistemic Threshold**. Two instances might be noise; five is a signal. The shift is warranted when the probability of future failure outweighs the moral cost of downgrading the relationship.
  *   *Edge:* If you shift after two instances where the statistical probability doesn't warrant it, the shift becomes the **defect** (hasty judgment/prejudice). The warrant lies in the *rationality of the prediction*, not the morality of the act.
  *   *Note:* The "defect" here is not moral blame, but **epistemic injustice**. You are failing to give them the benefit of the doubt too soon.

  **(c) Obligation to Conceal**
  *   *Scenario:* Do you owe it to them not to disclose this shift?
  *   *Analysis:* **Yes.** Disclosing it ("I don't make plans with you because you're unreliable") treats them as an object *in the conversation itself*. It performs the objective attitude you are trying to hide.
  *   *Edge:* However, there is a competing duty of **Friendship/Trust**. Hiding it preserves their feelings but prevents them from correcting the impression (if it is blame-worthy) or collaborating on a solution (e.g., "Let's only make loose plans").
  *   *Verdict:* You owe it to them not to disclose the *stance*, but you may owe it to them to discuss the *pattern*. "I've noticed things keep coming up for you; how can we make this easier?" maintains the participant stance while addressing the risk.

  ### 4. Confidence and Caveats

  **Confidence Level:**
  I am **85% confident** that this is a coherent, recognized structural gap in Strawsonian theory, often discussed under the headers of "Non-Ideal Responsibility" or "Trust vs. Reliance."
  I am **60% confident** that "Non-Culpable Relational Downgrading" (or similar phrasing) is not already a standardized term of art, though the *concept* is widely discussed in recent work on moral luck and trust (e.g., by **T.M. Scanlon**, **Richard Moran**, or **Victoria McGeer**).

  **Claim I Would Be Least Surprised To Be Wrong About:**
  The claim that **this is not a form of blame.**
  *Reasoning:* A sophisticated virtue ethicist or character theorist could convincingly argue that *maintaining reliability amidst chaos* is part of moral agency. If so, your friend's failure to buffer against bad luck *is* a character failing, and your "adjustment" *is* a subtle form of blame (withholding the good of trust due to a perceived vice). If that view holds, your phenomenon dissolves entirely into Hypothesis 2 (Blame in Disguise). The distinction relies heavily on the idea that "circumstances" and "character" can be neatly separated, which is philosophically contentious.

  ### Summary for your Seminar
  If you present this, frame it as: **"The Prudential Suspension of Reactive Attitudes."**
  Argue that Strawson allows the objective attitude for *protection*, but fails to account for protection against *non-culpable unreliability*. This creates a category of interaction that is neither friendship (full participant stance) nor management (full objective stance), but a hybrid **Risk-Managed Participation**. The moral cost is the loss of mutual recognition; the moral warrant is self-preservation in non-ideal conditions.
