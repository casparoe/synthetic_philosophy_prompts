  ### The Pizza Detour

  You're driving a delivery shift for a new app that pays based on successful drops. There are two identical-looking apartment complexes off the highway, separated by a construction zone with temporary signs that look exactly the same. Complex 1 is a wrong address (wasted gas, payoff 0). Complex 2 is the correct customer (big tip, payoff 10). If you miss both, you end up at the next town's depot where you can still drop the pizza but it's cold and you get a smaller fee (payoff 8). You're zonked out on autopilot and can't tell the complexes apart when you see an exit. The night before, you set a rule on your phone: "When I see an exit, I'll flip a weighted coin to decide whether to keep driving." To maximize your total expected pay over the whole trip, your phone calculates you should keep driving almost every time (say, 90% chance). But when you're actually staring at the exit ramp, doing the math from that specific moment tells you that you should probably just get off now.

  ***

  ### Unpacking the Numbers

  Here is why the math actually splits, using the payoffs from the story: **Wrong (0)**, **Right (10)**, **Miss Both (8)**.

  **1. The Night Before (Ex Ante)**
  You want to maximize the total trip value. You only get the big payoff (10) if you pass the first exit *and* take the second.
  *   If you always exit immediately ($p=0$), you get 0.
  *   If you always drive past ($p=1$), you miss both and get 8.
  *   The sweet spot is balancing the chance to hit Complex 2 against the risk of missing both. With these numbers, the math says you should continue with probability **$p = 1$** (Always Continue). Why? Because the penalty for missing both (8) is so much better than the penalty for the wrong house (0), you should risk driving past the first one to hunt for the 10.
  *   **Plan:** "Keep driving."

  **2. At The Exit (Ex Post)**
  Now you are at an exit. You don't know which one it is, but you *do* know your own plan ($p=1$).
  *   Because your plan was "Always Continue," you know you would never have stopped at Complex 1.
  *   Therefore, if you are at an exit, logic dictates you **must** be at Complex 2.
  *   If you are at Complex 2, Exiting gives you 10, and Continuing gives you 8.
  *   **Calculation:** $10 > 8$.
  *   **Action:** "Get off now."

  **The Detail Doing All the Work**
  The split is caused by **strategy-dependent beliefs**. Your probability of being at the second exit isn't fixed; it depends on the very rule you set the night before. By planning to "mostly keep driving," you make it more likely that any exit you encounter is the second one. This creates a loop: the plan that maximizes the *start* of the trip (Drive Past) creates the beliefs at the *middle* of the trip that make you want to break the plan (Exit).

  **The Tweak That Fixes It**
  Make the exits **distinguishable**. If Complex 1 has a blue sign and Complex 2 has a red sign, your belief about "which exit am I at?" no longer depends on your driving strategy. You simply look at the sign. The Ex Ante and Ex Post perspectives collapse back into agreement because you have perfect information at the node.

  **Your Roommate's Best Counter-Argument**
  > "This is rigged because you're assuming the driver is rational enough to calculate optimal probabilities but stupid enough to ignore a GPS. In real life, I'd just set my navigation to 'Avoid Highways' or look at the street name, which breaks the 'indistinguishable' rule the whole puzzle relies on."
