  1. This project asks whether the wrong of a revealed, aesthetically indistinguishable forgery constitutes a residual institutional harm, rather than merely a deception or loss of causal contact. Current philosophical accounts remain insufficient because they prioritise individual perceptual failure or historical lineage, thereby overlooking the corruption of the collective provenance-tracking systems that stabilise objects within public records.

  2. The research will employ a conceptual analysis of institutional practices, examining how museums and markets constitute objects as stable nodes within a public record. This approach deliberately eschews empirical art history or psychological study to focus strictly on the normative structures governing authentication and archival integrity.

  3. Success entails demonstrating that epistemic pollution persists within the archival system even when all viewers possess full knowledge of the object's inauthenticity. Conversely, failure would result if the analysis proves that institutional harm collapses entirely into individual deception once the forgery is publicly revealed.

  4. The primary output will be a policy framework outlining ethical protocols for managing revealed forgeries within permanent collections to mitigate systemic epistemic damage. This document will offer curators and registrars a philosophical justification for retaining or reclassifying objects that compromise the integrity of provenance chains.

  5. Whilst a comprehensive metaphysics of institutional objects exceeds this timeframe, the project will realistically establish a foundational taxonomy of institutional harms specific to authentication systems. This limited scope ensures a rigorous argument is completed without overextending into broader sociological critiques of the art market.
