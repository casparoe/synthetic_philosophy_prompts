answer: |-
  # SYMPOSIUM PREP SHEET: NARRATIVE ENTAILMENT & RORTY'S LIMITS

  ## I. THE LITERARY THEORISTS (The Mimetic Objection)
  **The Objection:** "You treat the novel as a closed syntactic system. By prioritizing internal 'entailment' over reference, you sever the tether between fiction and the phenomenological weight of human experience. If the novelist is only accountable to narrative coherence, you reduce the form to a solipsistic language game. Where is the ethical accountability to the world the novel purportedly represents?"

  *   **Vocabulary:** Mimesis, referentiality, phenomenological fidelity, ethical accountability, world-disclosure.
  *   **Real Force:** High emotional resonance. It appeals to the common intuition that novels matter because they tell us something *about life*, not just about themselves.
  *   **Rhetorical Function:** To paint you as a formalist who has forgotten why people read fiction.
  *   **Upfront Concession:** In your opening, concede that readers *experience* novels as mimetic and that this experience is vital to the form's cultural value. Do not deny the *effect* of reference.
  *   **The Reply (< 2 mins):**
      "I am not denying that novels disclose worlds or that readers experience them mimetically. My claim is about the *labor* of the writer, not the reception of the reader. When I write a character, I cannot simply 'redescribe' their motivation at will in chapter ten without breaking the arc established in chapter one. That resistance feels like truth. It feels like I am *finding* the character, not making them. Rorty says we only make. I am saying that in long-form narrative, the 'making' generates constraints so rigid they function indistinguishably from 'finding.' The ethical accountability remains, but it is an accountability to the internal logic of the life you've simulated, which is the only way to be accountable to the reader's experience of that life."
  *   **Weakness in Reply:** You risk sounding like you are reducing human experience to "internal logic." If they press on whether "internal logic" can truly carry ethical weight without external reference, you may look coldly formalist.

  ## II. THE ANALYTIC PHILOSOPHERS (The Incoherence Objection)
  **The Objection:** "You use the term 'entailment.' In logic, entailment is truth-preserving. If narrative structures have truth-conditions sufficient to generate entailment, you have smuggled representationalism back in. You cannot claim antirepresentationalism while relying on normative structures that function as truth-conditions. You are either a closet realist or your argument is self-undermining."

  *   **Vocabulary:** Truth-conditions, semantic content, propositional attitude, normative force, category mistake.
  *   **Real Force:** High logical force. This is the most dangerous objection. If "entailment" requires truth values, and you deny truth values (Rorty), you are contradicting yourself.
  *   **Rhetorical Function:** To force you into a binary: admit you are a realist or admit your terminology is sloppy.
  *   **Upfront Concession:** Concede that you are borrowing logical terminology for pragmatic description. Acknowledge you are not defining a new logic, but describing a *phenomenology of constraint*.
  *   **The Reply (< 2 mins):**
      "I am not proposing a new logic; I am describing a functional equivalence. When I say 'entailment,' I do not mean semantic truth-preservation in a propositional sense. I mean *narrative inevitability*. If a character acts out of established nature, certain consequences follow. If I violate this, the reader rejects the fiction. This normative force regulates my writing exactly as a truth-condition regulates a statement. My point is precisely that Rorty's distinction collapses *in practice*. Whether we call it 'truth' or 'coherence' matters less than the fact that the writer is bound by it. I am not a closet realist; I am a pragmatist pointing out that some habits of speech bind us so tightly they become indistinguishable from facts."
  *   **Weakness in Reply:** The distinction between "functional equivalence" and "identity" is thin. If it walks like a truth-condition and quacks like a truth-condition, the Analytic philosopher will insist it *is* a truth-condition, forcing you to abandon Rorty entirely.

  ## III. THE RORTY SCHOLARS (The Ironist Autonomy Objection)
  **The Objection:** "You assume the ironist wants total freedom. Rorty never claimed redescription is unconstrained. Constraints are tools adopted for specific purposes. Narrative coherence is just one such tool. You are treating a locally adopted technique as a metaphysical limit. The ironist knows the constraint is contingent and can drop the novel form if it becomes too binding."

  *   **Vocabulary:** Contingency, final vocabulary, redescription, irony, metaphysics, tools.
  *   **Real Force:** High textual fidelity. They know Rorty better than you do. They will argue you are attacking a straw man of "radical freedom."
  *   **Rhetorical Function:** To marginalize your critique as a misunderstanding of neopragmatism.
  *   **Upfront Concession:** Concede that Rorty acknowledges social and linguistic contingencies. Agree that the ironist knows their vocabulary is not "God's eye."
  *   **The Reply (< 2 mins):**
      "The issue is not whether the ironist *knows* the vocabulary is contingent, but whether they can *swap* it mid-stream. In a philosophical essay, I can change my final vocabulary in the next paragraph. In a three-hundred-page novel, I cannot. The temporal extension of narrative locks the vocabulary in place. The 'tool' ceases to be something I hold and becomes something that holds me. My charge is that Rorty underestimates the inertia of long-form redescription. It's not a metaphysical limit, it's a material one. The ironist is free to stop writing, but not to write freely once the arc is set. That inertia dissolves the finding/making distinction because the 'making' hardens into 'finding' over time."
  *   **Weakness in Reply:** A committed Rortyan can simply say, "Then the novel is a bad tool for the ironist." They can sacrifice the novel to save the philosophy. You need to argue why the novel is a *privileged* site for this critique, which you haven't fully established.

  ## IV. THE QUESTION YOU HOPE NOBODY ASKS
  **"If the functional force of narrative entailment is identical to representational truth-conditions, what practical work is left for your antirepresentationalism to do? Why does it matter if we call it 'finding' or 'making' if the constraint is the same?"**

  *   **Why this is dangerous:** It renders your thesis philosophically idle. If the outcome is the same (the writer is bound), then Rorty's distinction might be irrelevant, but so is your critique of it. It suggests you are fighting a verbal battle rather than a substantive one.
  *   **Preparation:** You must argue that the *label* changes the *anxiety* of the writer. If I think I am "making," I feel responsible for the coherence. If I think I am "finding," I feel responsible to the "truth." The collapse means the writer bears *both* burdens simultaneously.

  ## V. YOUR SOFTEST POINT: "NARRATIVE ENTAILMENT STRUCTURES"
  **The Vulnerability:** This term is the linchpin of your argument, but it is the least defined. It risks being dismissed as a metaphor masquerading as a mechanism.
  *   **The Attack:** They will ask: "Is this just psychology? Is it just convention? Or is it structural?" If it's psychology, it's not philosophical. If it's convention, it's historical, not necessary. If it's structural, you are a formalist.
  *   **Active Defense Strategy:** Do not try to define it logically. Define it *temporally*.
      *   *Say:* "It is not a logical structure; it is a temporal one. It is the accumulation of commitments over reading-time. A statement entails nothing; a sequence of statements entails consequences. My term refers to the debt incurred by earlier pages that must be paid by later ones."
      *   *Why this works:* It moves the debate from "What is truth?" to "What is time?" It grounds the constraint in the physical act of writing and reading, which is harder to dismiss as metaphysics.

  ## VI. STRATEGIC OPENING (First 3 Minutes)
  *   **Do:** State clearly that you are a novelist speaking about *practice*, not a philosopher speaking about *theory*. This grants you immunity from pure logical nitpicking (you are reporting from the field) while validating your authority on the "making" of fiction.
  *   **Do:** Explicitly state: "I am not arguing that Rorty is wrong about language generally, but that the novel is a specific technology where his distinction breaks down." This prevents the Rorty scholars from defending general pragmatism.
  *   **Don't:** Do not claim you have solved the problem of truth. Claim you have identified a site where the problem dissolves.
  *   **Don't:** Do not apologize for using philosophical terms. Own them, but frame them as tools you have appropriated for the workshop.
