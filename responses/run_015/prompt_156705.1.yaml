          *   **Constraint:** No bibliography, reading list, or citations.

  2.  **Deconstruct the Thesis & Audience Dynamics:**
      *   *Thesis Core:* Writing fiction isn't just "making" (Rorty); it's constrained by internal logic ("entailment") that feels like "finding" (truth). Therefore, Rorty's dichotomy fails in fiction.
      *   *Literary Theorists:* They value the novel's connection to reality/human condition. They fear "language games" detach art from life.
      *   *Analytic Philosophers:* They value logical precision. They see "entailment" as a logical term implying truth-preservation. If you use it, you're doing representational logic, contradicting Rorty/Pragmatism.
      *   *Rorty Scholars:* They value the *ironist* who knows their vocabulary is contingent. They will say constraints are self-imposed tools, not metaphysical chains.

  3.  **Drafting Section 1: Literary Theorists (Mimetic Loss)**
      *   *Vocabulary:* Mimesis, referentiality, phenomenological fidelity, ethical accountability, world-disclosure.
      *   *Objection:* You reduce the novel to a closed system. Where is the human experience?
      *   *Force:* High emotional/resonant force. Low logical force (since the thesis is about form, not content).
      *   *Concession:* Admit fiction *feels* mimetic and that readers expect it.
      *   *Reply:* The constraint isn't about the *world*, it's about the *work*. But the work *is* the experience.
      *   *Weakness:* Risks sounding formalist and cold.

  4.  **Drafting Section 2: Analytic Philosophers (Incoherence/Smuggling)**
      *   *Vocabulary:* Truth-conditions, semantic content, propositional attitude, normative force, category mistake.
      *   *Objection:* "Entailment" implies logical consequence based on truth values. You can't have entailment without representation. You're a closet realist.
      *   *Force:* High logical force. This is the dangerous one.
      *   *Concession:* Admit the terminology is borrowed from logic.
      *   *Reply:* It's *functional* equivalence, not ontological identity. It *acts* like truth without *being* truth.
      *   *Weakness:* The distinction between "acting like" and "being" is thin.

  5.  **Drafting Section 3: Rorty Scholars (Ironist Autonomy)**
      *   *Vocabulary:* Contingency, final vocabulary, redescription, irony, metaphysics, tools.
      *   *Objection:* You think the ironist wants *no* constraints. We know constraints exist; they are chosen tools. You're attacking a straw man.
      *   *Force:* High textual fidelity to Rorty.
      *   *Concession:* Admit Rorty acknowledges constraints of community/utility.
      *   *Reply:* In long-form narrative, the constraints *choose you*. You can't just swap vocabularies mid-stream without breaking the arc. The "tool" becomes a "master."
      *   *Weakness:* Rorty could say "then stop writing that story."

  6.  **Drafting Section 4: The "Hope Nobody Asks" Question**
      *   *What undermines the thesis?* If the constraints are just psychological or conventional, they aren't "structural." If they are structural, are they universal?
      *   *Best Candidate:* "Is this just a problem of *bad* writing?" If a truly great ironist novel exists that defies entailment, the thesis falls. Or, "Does this apply to non-narrative poetry?" (Too easy).
      *   *Better Candidate:* "If narrative entailment functions *identically* to truth conditions, what is the practical difference? Why keep the pragmatist label?" This hits the core utility of the argument.

  7.  **Drafting Section 5: The Softest Point (Narrative Entailment Structures)**
      *   *Vulnerability:* Is "narrative entailment" just a metaphor? How do you define it rigorously without slipping into logic (Analytic worry) or metaphysics (Rorty worry)?
      *   *Defense:* Ground it in the *temporal* experience of reading, not logical syntax.

  8.  **Review and Refine:**
