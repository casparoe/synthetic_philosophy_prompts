answer: |-
  Good evening. For those who don't know me, I'm one of [Advisor's Name]'s former advisees. For those who do know me… I'm still one of [Advisor's Name]'s former advisees. That doesn't really expire.

  We have a unique crowd tonight. About half of you are evolutionary biologists, and the other half are family and friends who just want to know why we're all shouting about "selection" instead of eating. I promise to keep the jargon to a minimum. Although, given who we're honoring, I suspect even the family has picked up a thing or two about the Price equation over the years.

  [Advisor's Name] spent thirty years defending multilevel selection. For the biologists in the room, you know what that means. For everyone else: she spent three decades arguing that life isn't just about the selfish gene. She argued that context matters. That the group is real. That you can't understand the organism if you ignore the ecosystem it lives in.

  She was often asked to settle the great debate: What is the true unit of selection? Is it the gene? The individual? Or the group?

  I actually asked her that question yesterday, while we were prepping for this talk. She looked at me, dry as ever, and said, "Stop worrying about the units. Just make sure the toast has a clear beginning and end."

  But I think I've solved it. If the "selfish gene" theory were the whole truth, this room wouldn't exist. If we were merely vehicles optimizing our own genetic fitness, we would all be at home, resting, maximizing our own survival probabilities. We wouldn't be here, celebrating someone else's retirement.

  And if the "individual" were the only unit that mattered, I'd be using this time to talk about my own research.

  But we are here. Together. Which suggests that for tonight, at least, the data is conclusive. The unit of selection… is the group.

  [Advisor's Name] always told us that the mathematical equivalence between kin and group selection was just "bookkeeping," not a deeper truth. She cared about the biology, not just the ledger. So, I've taken the liberty of balancing her books.

  On the debit side: Thirty years of departmental meetings. Countless revisions on grant proposals. And an infinite amount of time correcting our misuse of the word "altruistic."

  On the credit side: The papers, yes. The awards, certainly. But mostly, the people.

  She didn't just teach us theory. She ran her lab like a multilevel selection model. She let us compete as individuals, sure. But she selected for the group. She made sure that when one of us succeeded, the whole lab rose. She proved that cooperation isn't just a nice sentiment; it's a viable strategy.

  To the family here: Thank you for sharing her with us. We know that "retirement" in academia is often just a change of venue for the work. But I hope, for her sake, that the selection pressure lowers just a bit. I hope the only thing she has to select from now on is the wine list.

  [Advisor's Name], you taught us that the group is real. You taught us that the math is just bookkeeping, but the people are the truth. Looking around this room, I'd say your hypothesis has been robustly tested. And the results are significant.

  Please raise your glasses.

  To the genes, for getting us here. To the individuals, for doing the work. But mostly, to the group, for keeping us together.

  To [Advisor's Name].
