answer: |-
  Two participants sit at a kitchen table, heads stabilized on a rest, fixating a central dot on a laptop screen while a grating drifts upward for sixty seconds. Both receive identical retinal input, but Participant A is told by a trusted confederate that the motion is generated by a mechanical motor (stable), while Participant B is told it is generated by a human hand attempting to stay still (variable). Immediately following adaptation, both face a static grating and hold a key down for as long as the illusory downward motion persists. Halfway through a second adaptation block, the confederate returns and admits the labels were swapped; the duration of the key-hold shifts within seconds to align with the new label, tracking the participants' reported confidence in the confederate rather than the cumulative exposure time to the stimulus.

  **The Joint:** I chose the **locus of the rapid update** as the single joint. Both sides must agree the key-hold duration changed instantly upon retraction. The disagreement rests entirely on whether that update modified the sensory adaptation state itself (penetration) or merely the decision criterion for releasing the key (encapsulation). This forces the debate away from whether *anything* changed (which the data shows) to *what kind* of state changed, isolating the definition of the perceptual boundary.

  **Verdicts:**
  *   **Pro-Penetration:** The instant shift in key-hold duration, tracking confidence rather than exposure, proves the belief directly modulated the sensory fatigue mechanism. Since no new optical data arrived to wash out the adaptation, the only cause for the change in the illusion's strength was the cognitive update, meaning cognition altered the sensory representation.
  *   **Encapsulation/Modularity:** The key-hold is a voluntary motor action governed by a decision rule ("release when motion feels gone"). Belief altered the threshold for satisfying that rule (response bias), not the underlying sensory signal. The illusion's intensity remained constant; the participant simply decided to stop reporting it sooner based on the new information.
  *   **Predictive Processing:** The distinction is category error. The brain minimizes prediction error using all available priors, including testimony. The "sensory state" is already a best-guess inference incorporating the belief. There is no separate "raw" sensation to be penetrated; the update *is* perceptual inference.

  **The Feature Doing the Work:** The **retraction speed coupled with confidence tracking**. This rules out slow perceptual learning or habituation, forcing the explanation to be either immediate sensory modulation or immediate decision bias.

  **If Removed:** Without the retraction test, the case collapses into standard perceptual learning or priming. The modularist could argue the belief merely guided attention during the initial exposure, creating a skill difference rather than a penetrative one.

  **Modularist Escape:** "The measure is contaminated." Even a button press requires a judgment about when the experience meets a criterion. Signal Detection Theory demonstrates that response bias ($c$) can shift independently of sensitivity ($d'$). The participant didn't experience less motion; they just required less evidence to claim the motion had stopped because they expected it to be weaker. This is a post-perceptual adjustment, not a perceptual one.

  **Penetrationist Reply:** "The boundary is porous." If the decision criterion updates instantly based on testimony without new sensory evidence, the system responsible for setting that criterion is functionally part of the perceptual processing stream. To label it 'post-perceptual' is merely to draw an arbitrary line around a mechanism that behaves like perception. If cognition drives the output indistinguishably from sensory input, the modularity claim is empty.

  **Honest Assessment:** This case does not settle the question; it **relocates it one step back**. We lack a phenomenometer to measure experience independent of behavior. Every measure of "what it was like" requires a report or action, which invites the modularist to posit a decision stage. The debate ultimately hinges on a philosophical definition of where "perception" ends, not on an empirical observation, because any observation must pass through the very cognitive systems under dispute.
