answer: |-
  **The Lock & Key, 11:30 PM**

  **Mara:** [Takes a long pull of lager] So, let me get this straight. You're saying the Silent Grid is a case of *joint action*? Thousands of people, none of whom know each other, most of whom don't even know what the batteries are doing, just chasing a cheaper tariff?

  **Leo:** I'm saying it's a case of *structural jointness*. Your flatmate's phrase is brilliant, by the way. 'Structural jointness without mental overlap.' It cuts the knot. You mentalists are still stuck in the nineteenth century, obsessed with the interior life.

  **Mara:** Oh, here we go. The interior life is rather the point, Leo. If I'm pushing a car with you, I need to know you're pushing. I need to intend that *we* push. If I'm pushing my end and you're pushing yours because a sign told you to, and neither of us knows the other exists, we aren't acting together. We're just two cogs turning near each other.

  **Leo:** But in the Silent Grid, the cogs are locked. That's the thing. The AI coordinates the discharge. If Household A doesn't discharge, Household B has to discharge more, or the frequency drops. Their actions are counterfactually dependent. I'm only doing my bit *because* the structure ensures you're doing yours. That interdependence is out there in the world, not in our skulls.

  **Mara:** Interdependence isn't enough. If I walk down the street and the traffic lights coordinate me and the oncoming car so we don't crash, are we walking jointly? No. We're regulated individuals. In the Grid, the homeowners are just sources of capacity. They haven't committed to a *we*. They've committed to a bill discount.

  **Leo:** Committed to the discount, yes, but by doing so, they've subscribed to the mechanism. Look, take Wikipedia. Ten thousand editors. Do you think the bloke fixing typos in the 'History of Slavery' article has a shared we-intention with the bloke coding the server architecture in San Francisco?

  **Mara:** They share a goal. They know they're contributing to an encyclopedia. There's mutual awareness of the project, even if they don't know each other personally.

  **Leo:** Do they, though? Or do they just know they're editing a wiki? Some are vandals, some are ideologues, some are bots. The 'jointness' of Wikipedia isn't in their heads; it's in the edit history and the moderation protocols. The structure *makes* it a joint action by filtering out the noise. The Silent Grid is the same. The AI is the moderator. It ensures the output is coherent. Why does the glue have to be psychological?

  **Mara:** Because without the psychological glue, there's no one to hold responsible. That's the test, Leo. Responsibility. If the Grid fails catastrophically—blackout, hospital generators fail—who do we blame?

  **Leo:** The utility company. The algorithm designers.

  **Mara:** Exactly! You blame the architects. You don't blame the *collective*. If it were genuine joint action, the collective would be the agent. But in your Silent Grid, the 'group' is a phantom. It has no voice, no capacity to deliberate, no shared commitment to uphold if things go south. If I defect from a genuine joint action, I let *you* down. In the Grid, if I unplug my battery, I just break a contract. I haven't betrayed a partner, because I didn't know I had one.

  **Leo:** That's a narrow view of betrayal. I'd say I've betrayed the system that sustains us all. But look, you're assuming responsibility requires a handshake. In modern society, responsibility is often structural. If I pollute the river, I've harmed the community, even if I never met the people downstream. The normative force comes from the impact, not the mutual acknowledgement.

  **Mara:** But that's moral responsibility, not the metaphysics of action. We're talking about whether *we* did something, not whether *I* did something bad to *you*. If there's no 'we' in the room, there's no joint action. There's just aggregated individual action that looks pretty from a distance. It's a flock of birds, Leo. The flock doesn't decide to turn; the birds follow rules.

  **Leo:** But human flocks are different because the rules are normative, not just instinctual. The homeowners *ought* to let the battery discharge. That 'ought' is binding them together. It's an institutional fact. You're clinging to this idea that for a 'we' to exist, everyone has to be thinking about the 'we'. That works for a string quartet. It doesn't work for a tax system.

  **Mara:** A tax system is an institution, not an action.

  **Leo:** Paying tax is an action! Mass tax compliance is a massive joint action that funds the state. Do you think every taxpayer has a we-intention regarding the NHS? Half of them are grumbling about it the whole time. They pay because the structure compels them. Yet, without that mass coordination, the NHS collapses. The jointness is in the functional integration.

  **Mara:** I'd say tax compliance is parallel individual action coerced by law. The joint action happens in Parliament, where the representatives actually deliberate as a 'we'. The populace is just the substrate. In the Silent Grid, the homeowners are the substrate. The AI is the Parliament. So the joint action is happening, but it's happening *between the machines*, or between the operators. The people are just peripherals.

  **Leo:** [Laughs] Peripherals? That's rich. You're reducing human agents to hardware because they aren't consciously humming the team song. Look, the point of my position is that we need to account for how large-scale cooperation actually works. If you insist on mutual awareness, you can't explain how complex societies function. The cognitive load is too high. I can't hold a we-intention with six million other Londoners, but we do act together to keep the city running.

  **Mara:** You don't act together with six million people. You act within a framework that allows you to act alongside them. There's a difference between 'social order' and 'joint action'. Your flatmate's phrase—structural jointness—is probably a description of social order. But don't call it joint action. That implies a shared agency that isn't there.

  **Leo:** But why does the label matter? If the outcome is coordinated, normatively constrained, and functionally integrated, what do you gain by withholding the term 'joint action'?

  **Mara:** I gain clarity on where the normativity lives. If it's in the structure, then changing the action means changing the code or the law. If it's in the minds, changing the action means persuasion. If we treat the Grid as joint action, we might think we can appeal to the homeowners' sense of duty. But we can't. They don't feel it. They're just customers. If we misdiagnose the metaphysics, we mess up the politics.

  **Leo:** [Pauses, swirls his pint] Okay. That's a fair point. If we pretend there's a communal spirit where there isn't one, we risk cynicism. But conversely, if we insist there's no 'we' unless they feel it, we might fail to build structures that allow cooperation without requiring constant emotional labour. Maybe the Silent Grid is the future. We can't all be in a string quartet.

  **Mara:** Maybe. But don't expect me to toast to the algorithm.

  **Leo:** I'll toast to the flatmate, then. 'Structural jointness.' It's a bugger to refute, even if you're wrong.

  **Mara:** [Clinks glass] She's right that it sticks. But I'm still right that it's not a 'we'.

  **Leo:** We'll see. Next round's on the 'collective'.

  **Mara:** Don't push it.
