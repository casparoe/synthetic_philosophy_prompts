          2.  Tension Audit (grouped by severity).
          3.  The Single Revision.
          4.  Novel Architecture Assessment.
          5.  Epistemic Honesty section (integrated or separate? Request says "mark how confident... say where reasoning likely to fail". I will integrate confidence markers into the audit and have a summary section for empirical claims).
          6.  Actually, request says: "mark how confident you are in each verdict... tell me what would change your mind". I will append a specific section for this to ensure it's explicit.
          7.  British English check.

      *   *Wait, one more check on (4) vs (5).*
          *   (4) says "When a clinician explains... the more... the better."
          *   (5) says "Patient's own account... authoritative."
          *   If patient says "I am not a machine," and clinician says "But you are, it's kinder," (5) is violated by (4).
          *   This is a strong tension.

      *   *One more check on (1) vs (7).*
          *   (1) Members are altered by classification.
          *   (7) Protagonist discovers condition in realist sense, not acquiring costume.
