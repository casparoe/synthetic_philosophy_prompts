prompt: |-
  i'm doing a formal epistemology module this term and our seminar leader wants us to hand in a one-page 'where I stand' on the justification for probabilism, so I'd like an audit of my position before I commit it to paper. Roughly where I've landed:

  (1) the synchronic Dutch book argument for probabilism basically works — if your credences break the probability axioms then there's a package of bets you'd each accept that loses you money whatever happens;
  (2) I don't like the accuracy / scoring-rule arguments (Brier and friends) — the choice of scoring rule looks arbitrary to me, and I'd rather have an argument that doesn't smuggle in a measure of accuracy;
  (3) it can be rational to have imprecise credences, a range rather than a point, when the evidence is thin, ambiguous, or pulling two ways at once;
  (4) when I'm actually forced to act — set a price, take a bet, choose — it's fine to sharpen to any point in that range, and rationality doesn't pick out which one;
  (5) conditionalization is the right update rule, and the diachronic 'Dutch strategy' argument is a decent argument for it;
  (6) I'm not worried that all this makes me assign 1 to every logical truth, because I read the whole thing as constraining betting dispositions rather than describing some inner belief state.

  I'd of thought (3) and (4) were obviously compatible, but now I'm not sure, and I'm also stuck on whether (1) survives the fact that in real life you should normally refuse a bet offered by someone who knows more than you.

  Anyway: which of these really pull against each other, which only look like they do, and what's the cheapest fix each time? Rank the tensions by severity rather than flagging them all as equally bad, say for each what has to give and what it costs me, and then tell me which single revision would clean up the most. Keep it under 500 words, no preamble, lead with the ranking. And somewhere in there say what would change your mind — which argument would make you drop a different commitment instead, or where your diagnosis is most likely to be wrong.
