  1. The institutional practice and the philosophical puzzle it raises
  The university employs a tripartite system: a vague honor code defining plagiarism as unacknowledged appropriation; detection software imposing sharp similarity thresholds (15% and 30%); and a Borderline Review Board mandated to assign workable classifications rather than determine truth. The philosophical puzzle arises from the friction between the honor code's open texture and the software's binary precision. While the code admits vagueness, the software implies a sharp boundary exists. However, the Board's mandate denies the existence of a discoverable fact in the middle range, treating classifications as administrative stipulations. Furthermore, the quinquennial audit recalibrates thresholds based on shifting citation conventions, not empirical misconduct data. This suggests the boundary is not a hidden fact waiting to be uncovered, but a moving convention. The tension lies in reconciling the metaphysical indeterminacy admitted by the Board with the ontological sharpness implied by the software's percentages. This structure creates a unique administrative ontology where guilt is sometimes a fact and sometimes a decision.

  2. Reconstruction of the implicit theory of vagueness
  This system presupposes a **Supervaluationist** account of vagueness, operationalized through institutional conventionalism. Under epistemicism, a sharp boundary exists but is unknown; here, the Board is explicitly forbidden from seeking the "true" boundary, and the audit treats cutoffs as conventions, not facts. This strictly entails that the boundary is genuinely indeterminate until precisified. The honor code establishes the core clear cases (positive and negative), while the 15-30% range represents the penumbra where truth values gap. The Board functions as the precisifying agent, selecting an admissible sharpening of the concept based on citation norms and intent. The audit's reliance on shifting conventions rather than misconduct data confirms that truth conditions for plagiarism are relative to communal standards, not mind-independent facts.

  Crucially, specific institutional features strictly entail this view while others merely fit. The Board's written mandate—to assign a classification rather than determine occurrence—entails indeterminacy. If plagiarism were a fact of the matter, refusing to determine it would be abdication. Similarly, the audit's methodology entails conventionalism; recalibrating based on citation norms implies the boundary is constituted by these norms. Conversely, the detection software's sharp outputs merely fit the theory comfortably. They provide a mechanistic way to identify the penumbra without claiming the percentage itself constitutes the crime. The software identifies the zone of indeterminacy, while the Board resolves it.

  If the view were epistemic, the Board's refusal to judge truth would be incoherent. The system assumes that in the borderline zone, there is no fact to be found, only a decision to be made. Therefore, the practice treats vagueness as a lack of truth-conditions in the penumbra, resolved only by contextual precisification. The "finality" of Board decisions underscores this: one cannot appeal a misclassification because, within the penumbra, there is no correct classification prior to the Board's stipulation. The boundary is created by the judgment, not discovered by it. This aligns with supervaluationism, where a statement is true only if true on all admissible precisifications; the Board selects the relevant precisification for the administrative context. The quinquennial audit ensures these precisifications remain admissible within the evolving academic community, treating the cutoff as a mutable convention rather than a static reality. Consequently, the system rejects the epistemicist notion of a hidden sharp line, embracing instead a constructivist view where administrative necessity drives the precisification of vague norms.

  3. Coherence check: tensions among the honor code, the software thresholds, and the Board's mandate
  There is an apparent tension between the honor code's vagueness and the software's sharpness. The software implies that 15.01% is categorically different from 14.99%, suggesting an epistemic or realist boundary. However, the Board's mandate resolves this by treating the software's output as a heuristic trigger rather than a metaphysical claim. The tension is managed, not eliminated. The software creates a procedural boundary, while the Board acknowledges the conceptual indeterminacy. Coherence holds only if administrators understand the percentages as screening tools, not definitions of guilt. The honor code's openness allows this flexibility, but risks perceived unfairness if the software's sharpness is misunderstood as law.

  The Board's conventionalism is the glue. By grounding decisions in citation norms rather than textual matching, it decouples the administrative action from the software's false precision. However, a residual tension remains: students may perceive the software's cutoff as the "real" rule. If the system claims the boundary is conventional, yet punishes based on software triggers above 30%, it risks inconsistency. The automatic hearing for >30% assumes a sharp boundary exists there, contradicting the Board's handling of the 15-30% range. To be fully coherent, the >30% rule should also be framed as a presumption of misconduct rather than automatic guilt, acknowledging that even high similarity can be non-plagiaristic (e.g., quotes). The current practice relies on a pragmatic compromise that works administratively but falters philosophically at the upper threshold. It implicitly treats the upper bound as epistemic (we know it's plagiarism) while treating the middle bound as supervaluationist (we must decide). This hybrid approach is stable only so long as the software rarely misclassifies clear cases, but it remains theoretically fractured.

  4. Rival substitution and institutional redesign
  If we replaced the presupposed view with **Epistemicism**, the institution would treat the boundary as sharp but hidden. The Board's role would shift from stipulating classifications to investigating facts. They would be required to determine whether plagiarism *really* occurred in the middle range, rather than assigning workable labels. The "no appeal on misclassification" rule would become unjustifiable, as there would be a fact of the matter to get wrong. The quinquennial audit would need to seek empirical data on student misconduct to find the true threshold, rather than tracking citation conventions.

  However, the practice is philosophically underdetermined in specific areas. The software thresholds (15% and 30%) could remain identical under both theories. Under epistemicism, they are best-guess heuristics for the hidden line; under supervaluationism, they are triggers for precisification. The honor code's vague language also fits both; it defines the concept without locating the boundary. Minor adjustments would suffice to switch theories: changing the Board's mandate from "classification" to "fact-finding" and altering the audit's data source. The structural machinery (software, thresholds, hearings) is compatible with either view, provided the justificatory narrative changes. The current system chooses conventionalism for administrative ease, but could adopt epistemicism if it prioritized retributive justice over procedural efficiency. Ultimately, the physical infrastructure of integrity administration is theory-neutral; only the normative instructions to the Board and auditors reveal the underlying metaphysics. This suggests the university could pivot theories without costly technological overhaul, merely by rewriting the Board's charter and audit protocols to reflect a search for truth rather than consensus.

  5. The AI-paraphrase case and points of underdetermination
  Consider AI-generated text paraphrasing a source, scoring 18%. Under the reconstructed supervaluationist framework, this falls into the Board's conventionalist category. Since 18% is in the penumbra, there is no fact of the matter until the Board precisifies. They must check current citation conventions regarding AI. If conventions do not yet require AI disclosure, the overlap might be classified as "workable" (no penalty). If conventions shift, it becomes plagiarism. It is not dismissed (below 15%) nor automatic disciplinary (above 30%), placing the burden entirely on the Board's interpretation of norms.

  This reveals a limit: the system relies on human convention updates, which lag behind technological change. The quinquennial audit is too slow for AI evolution. The practice assumes conventions are stable enough to calibrate thresholds, but AI destabilizes the concept of "authorship" itself. The Board may struggle to find an "admissible precisification" when the community disagrees on AI norms. Thus, the system works for traditional plagiarism but risks arbitrariness when the underlying conventions are in flux, exposing the fragility of conventionalist vagueness management in rapid technological shifts. The 18% score triggers review, but without settled conventions, the Board's stipulation becomes legislative rather than adjudicative, potentially violating the principle that rules should be known in advance.
