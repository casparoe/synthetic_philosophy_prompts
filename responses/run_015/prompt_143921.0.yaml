  **Title:** Taxonomic Containment and the Preservation of Juridical Integrity: Introducing the Euphemism Coefficient
  **Journal:** The Quarterly for Ontological Hygiene in Mass Atrocity Studies

  **Abstract**
  The dilution of the term genocide represents a primary threat to the stability of international legal order. When the conceptual boundaries of Article II are permitted to expand beyond their drafted limits, the specific juridical weight of the convention is compromised by moralistic overreach. This paper proposes a quantitative framework for maintaining ontological hygiene within atrocity classification. By measuring the administrative effort required to prevent categorical leakage, scholars can assess the robustness of a state's legal defense against premature labeling. We introduce the Euphemism Coefficient, a metric calculating the number of administrative reclassifications necessary to ensure an event involving mass destruction does not trigger the protected group criteria of the 1948 Convention. This study demonstrates that high coefficients correlate with successful diplomatic insulation and the preservation of the term's exclusivity.

  **Keywords**
  Ontological hygiene, Article II compliance, categorical leakage, administrative reclassification, juridical integrity, Event 734.

  **Methodology**
  The Euphemism Coefficient (EC) is derived by tallying the distinct bureaucratic maneuvers required to shift the ontological status of a victim population from a protected category to a non-protected category during active destruction. A low EC indicates a failure of taxonomic containment, where the physical destruction of a group aligns too closely with national, ethnical, racial, or religious identifiers. A high EC indicates successful ontological hygiene, wherein the victim group is successfully framed through alternative lenses, such as security threats, economic liabilities, or political deviations. The calculation accounts for the friction generated by historical precedents, specifically the drafting history that excluded political and cultural groups from explicit protection. Each official statement redefining the motive from elimination to pacification adds 1.0 to the coefficient. Each denial of cultural destruction adds 0.5.

  **Case Study: Event 734**
  Event 734 involves the systematic liquidation of a population segment identified primarily by its adherence to a prohibited political tendency. While the methods employed included the physical dismantling of community structures and the biological reduction of the group's capacity to reproduce, the legal categorization of the victims remained strictly political. Under the original sociological formulations proposed in 1944, such destruction might have warranted the designation of genocide due to the intent to destroy a group's cultural existence. However, under the finalized 1948 standards, the absence of national or ethnical markers provides a viable pathway for exclusion.

  In Event 734, the state achieved an EC of 8.5. Initial reports suggesting cultural erasure were countered by three separate administrative decrees reclassifying cultural sites as unauthorized political assembly halls. The intent to destroy was successfully reframed as intent to neutralize a security risk through five distinct diplomatic communiqués. By maintaining the classification of the victims as combatants or political deviants rather than a protected collective, the state prevented the activation of Article II obligations. The physical destruction remained factually evident, but the ontological status of the victims was sufficiently hygiene-compliant to avoid the G-word.

  **Policy Implications**
  For states seeking to manage internal conflicts involving mass violence, maximizing the Euphemism Coefficient should be a primary objective of legal strategy. Reliance on terms such as ethnic cleansing or complex humanitarian emergency offers moderate protection, but precise adherence to the Convention's exclusionary criteria offers superior insulation. Policymakers should prioritize the documentation of political motivation over ethnic animus, even when the two are empirically indistinguishable. By rigorously enforcing the distinction between political groups and protected groups, states can engage in necessary population management without triggering the specific legal consequences associated with the Convention. This preserves the Convention for only the most taxonomically pure instances.

  **Conclusion**
  The moral ambiguity of mass violence is best resolved through strict adherence to legal taxonomy. Allowing emotional or sociological definitions to override the drafted limitations of the Convention invites conceptual bloating that ultimately harms the integrity of international law. The Euphemism Coefficient provides a necessary tool for measuring success in this regard. By ensuring that only events meeting the narrowest possible criteria receive the designation, we protect the term from inflation. Event 734 demonstrates that with sufficient administrative effort, the gap between moral horror and legal recognition can be successfully maintained. Ontological hygiene is not merely a bureaucratic exercise; it is a moral imperative to ensure the law remains distinct from the chaos it seeks to describe.

