answer: |-
  Here is the translation, the residue report, and the settlement on the geometric mean dispute, rendered in the language of the track and the book.

  ### Part I: The Translation Table

  Your friend is playing a game where the currency is "truth" and the bankroll is "credence." You play a game where the currency is "cash" and the bankroll is "capital." Here is how her ledger maps to yours.

  | Epistemologist's Term | Bettor's Translation |
  | :--- | :--- |
  | **Credence Function ($c$)** | **Portfolio Allocation.** If there are $N$ mutually exclusive outcomes, your credence $c_i$ is the fraction of your bankroll you allocate to outcome $i$. You must allocate 100% ($\sum c_i = 1$). |
  | **Possible World / Outcome** | **Settlement State.** The specific result that clears the bets. |
  | **Truth Value (0 or 1)** | **Payoff Condition.** The ticket pays out if the outcome matches reality; otherwise, it expires worthless. |
  | **Proper Scoring Rule** | **Payoff Schedule.** The function determining your return based on your allocation and the settlement. |
  | **Expected Accuracy** | **Expected Utility.** The weighted average of the payoff schedule across all possible settlement states. |
  | **Rationality** | **Optimal Strategy.** The allocation that maximizes Expected Utility. |
  | **Bayesian Updating** | **Rebalancing.** Adjusting your portfolio allocation upon receiving new information (odds movement) to restore optimality. |
  | **Probabilism ($\sum c = 1$)** | **Budget Constraint.** You cannot bet more than your bankroll, and you cannot leave cash on the table if the market is efficient. |

  #### The Log Score vs. The Growth Rate
  **Is it literally the growth rate?** Yes, structurally and mathematically.

  If you treat your credences as bet fractions in a "complete market" (you bet on every horse in the race), and the odds are "fair" (payoff for horse $i$ is $1/c_i$), then if horse $i$ wins, your wealth multiplier is $c_i \times (1/c_i) = 1$. That's a wash.

  To make the Log Score match Kelly, you must view the **Log Score itself as the utility function over wealth.**
  *   **Log Score:** $S(c, \text{true}) = \log(c_{\text{true}})$.
  *   **Kelly Criterion:** Maximizes $E[\log(W_{\text{final}})]$.
  *   **The Link:** If you allocate your bankroll proportional to your credences ($f_i = c_i$) on mutually exclusive outcomes, and the event $i$ occurs, your new bankroll is proportional to $c_i$. Your log-wealth change is $\log(c_i)$.
  *   **Conclusion:** Maximizing Expected Log Score *is* maximizing Expected Log Growth. Your friend is advocating for a Kelly bettor who treats "accuracy" as the wealth. She is arguing for Log-Utility without admitting she's talking about money.

  #### The Brier Score vs. The Payoff Scheme
  **What is the Brier Score on your side?**
  The Brier Score is $-(c - \text{outcome})^2$.
  *   **Translation:** This corresponds to a **Quadratic Utility Function** over wealth.
  *   **The Bet:** Imagine a contract where you are penalized by the square of the distance between your stake and the winner. If you bet 90% on a loser, you take a massive hit. If you bet 10% on a winner, you take a small hit.
  *   **The Risk:** Unlike Log Wealth (Kelly), Quadratic Utility allows for **negative wealth**. In your framework, you can go bust and owe the house. In hers, you can have "negative accuracy" (or rather, the score just drops without bound).
  *   **Verdict:** The Brier Score is a bet with a different risk profile. It punishes overconfidence less severely than Log (Log goes to $-\infty$ at 0; Brier is finite at 0), but it doesn't protect you from ruin. It's a "sucker's game" compared to Log if you care about survival, because it doesn't inherently enforce the non-negativity constraint of a bankroll.

  ---

  ### Part II: The Residue Report

  Here is what gets lost in translation. I have marked whether the gap is a **Hole** (the framework literally cannot express the concept) or a **Clarity Issue** (the concept is expressible but reveals the other framework is vaguer than it thought).

  #### 1. From Her Framework to Yours (Epistemology $\to$ Betting)

  | Claim | Translation Issue | Verdict |
  | :--- | :--- | :--- |
  | **"Accuracy is intrinsically valuable."** | You view accuracy as instrumental (means to wealth). She views it as constitutive (the end itself). You can model her preference, but you cannot justify it without a bankroll. | **Clarity Issue.** Her claim is essentially an axiom: "I like truth." You can't refute it, but you can point out it's a preference, not a derivation. |
  | **"Rationality is synchronic (one-shot)."** | Kelly requires a sequence to justify the "almost sure" convergence of growth. She claims you should maximize expected accuracy even if you die tomorrow. | **Hole.** Your framework cannot justify a one-shot bet without a utility function over outcomes. If she refuses to define utility over outcomes (money), she has no engine for the one-shot case other than intuition. |
  | **"Credences on unresolvable propositions."** | You need settlement to collect. She scores credences on propositions that may never be verified (e.g., "The universe is infinite"). | **Hole.** Your framework requires cash-out. Hers requires truth-conditions. She can score the bet; you can't collect the winnings. |

  #### 2. From Your Framework to Hers (Betting $\to$ Epistemology)

  | Claim | Translation Issue | Verdict |
  | :--- | :--- | :--- |
  | **"Log is privileged because of multiplicativity."** | She chooses Log because it satisfies axioms like "Additivity" or "Information Gain." You choose it because money multiplies and you can't bet negative. | **Clarity Issue.** Her justification is mathematical elegance; yours is physical survival. Yours is more robust. She has to *stipulate* Log; you *derive* it from the nature of compounding. |
  | **"No bankroll, no accuracy."** | She speaks of accuracy as a free-floating metric. You cannot define "growth" or "edge" without a stake. | **Hole.** She cannot translate "accuracy" into your terms without introducing a "cognitive bankroll," which is metaphorical. You can point out that without skin in the game, "accuracy" is just a scoreboard with no prize. |
  | **"Ruin is forbidden."** | Log score goes to $-\infty$ if credence is 0 and event happens. Brier does not. You avoid 0 probabilities to avoid ruin. | **Clarity Issue.** She might allow 0 credence (dogmatism) with Brier. You know that's bankruptcy. This exposes that Brier is a weaker normative constraint for survival. |

  ---

  ### Part III: The Settlement (Geometric Mean vs. Expected Log)

  **The Dispute:** She proposed maximizing the **Geometric Mean of Accuracy** across possible outcomes (weighted by credence) to avoid the "long-run" implication of Expected Log. You said this collapses into **Expected Log Accuracy**.

  **The Verdict:** **You are right.** It collapses.

  **The Math:**
  Let $A_i$ be the accuracy score in world $i$, and $p_i$ be your credence (probability) for world $i$.
  She wants to maximize the Geometric Mean ($GM$):
  $$ GM = \prod_{i} (A_i)^{p_i} $$
  Take the logarithm of the objective function (which preserves the maximum):
  $$ \log(GM) = \log\left( \prod_{i} (A_i)^{p_i} \right) = \sum_{i} p_i \log(A_i) $$
  $$ \log(GM) = E[\log(A)] $$
  Maximizing the Geometric Mean is mathematically identical to maximizing the Expected Log Score.

  **Does this leave her with anything genuine?**
  No. She tried to use the Geometric Mean to smuggle in a "one-shot" justification that feels less like averaging over time (Expected Value) and more like a property of the distribution. But because the optimization problem is identical, the normative implications are identical.

  *   **If she accepts Log:** She inherits the "long-run" justification (Kelly growth) whether she likes it or not, because that is the only pragmatic story that makes sense of why we maximize $E[\log]$.
  *   **If she rejects the long-run:** She has no justification for why the Geometric Mean is the correct aggregate measure. Why not the Arithmetic Mean (Brier)? Why not the Harmonic Mean? The only reason to pick Geometric Mean is *because* it corresponds to multiplicative growth over time.

  **The Final Word for Your Friend:**
  Tell her this: "You tried to dress up Expected Log Utility in a Geometric Mean suit to hide the fact that you're betting on a sequence. But the math doesn't lie. If you maximize Geometric Mean Accuracy, you are implicitly valuing credences as if they were bankroll fractions compounding over time. You don't get to claim the safety of the Log Score without accepting the logic of the Kelly Criterion. If you want a one-shot justification, you can't use Log or Geometric Mean. You have to use Brier. But if you use Brier, you're allowing for ruin. So pick your poison: either admit you're a bettor thinking in the long run, or admit your one-shot framework allows for bankruptcy."
