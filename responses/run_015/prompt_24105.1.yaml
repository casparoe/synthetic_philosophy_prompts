answer: |-
  This is a fantastic question, and you have hit on one of the most famous knot-tangles in modern philosophy of language and logic. Your confusion is well-founded: the standard pop-philosophy summary of Lewis's result is often oversimplified to the point of error.

  Here is the plain-English breakdown of what Lewis actually proved, why the Suppositional Theory is still very much alive, and how you can frame this in your piece without getting it wrong.

  ### 1. The Setup: Adams' Thesis
  To understand Lewis, you have to understand what he was attacking. In the 1960s and 70s, philosopher Ernest Adams proposed a very intuitive idea, now called **Adams' Thesis** (or "The Equation"):

  > The probability of the indicative conditional *"If A, then B"* is equal to the conditional probability of *B given A*.
  >
  > **$P(\text{If } A \text{ then } B) = P(B|A)$**

  This matches our intuition perfectly. If I say, "If it rains, the match will be cancelled," my confidence in that statement seems to depend entirely on how likely I think the match is to be cancelled *given* that it rains.

  ### 2. What Lewis Actually Proved (The Triviality Result)
  In his 1976 paper, David Lewis did **not** prove that Adams' Thesis is false. He did **not** prove that rational people can't hold these beliefs.

  **Lewis proved that you cannot hold three things simultaneously:**
  1.  **The Equation:** $P(\text{If } A \text{ then } B) = P(B|A)$.
  2.  **Standard Probability Theory:** Beliefs follow the standard rules of probability (Kolmogorov axioms).
  3.  **Truth-Conditionality:** The conditional *"If A then B"* is a standard **proposition**. (Meaning: It describes a state of affairs in the world that is either True or False, just like "It is raining" or "The match is cancelled".)

  Lewis showed that if you assume the conditional is a standard proposition (3) and you apply standard probability rules (2) to it, then The Equation (1) can only hold in trivial cases (where your probabilities are all 0 or 1). In any realistic scenario involving uncertainty, the math breaks.

  **The "Triviality" name comes from the result:** If you force these three constraints together, the only possible probability functions are "trivial"—you can't be uncertain about anything. You must be 100% sure or 100% unsure about everything.

  ### 3. Where Your Understanding Went Slightly Off
  You wrote: *"...your probability function stops being closed under conditioning, so a perfectly rational person becomes irrational the moment they learn anything new."*

  This is the common misconception. Lewis didn't show that an *agent* becomes irrational upon learning. He showed that the *logical system* collapses. It's not that you update badly; it's that there is no possible world where a proposition exists that satisfies the Equation across different states of belief.

  You also wrote: *"...everyone now agrees the probability of the conditional has to be some separate thing from the conditional probability."*

  This is also not quite right. Many philosophers still agree with The Equation ($P(\text{If } A \text{ then } B) = P(B|A)$). What they gave up was the idea that the conditional is a **proposition** with a truth value.

  ### 4. How the Suppositional Theory Survives
  The Suppositional Theory (championed by philosophers like Dorothy Edgington and Jonathan Bennett) is not ignoring Lewis. It is built specifically to dodge his bullet.

  **The Suppositional Move:**
  They accept The Equation. They accept Standard Probability. **But they reject Truth-Conditionality.**

  They argue that *"If A then B"* does not describe a fact. It does not have a truth value. It is not a proposition. Therefore, Lewis's proof doesn't apply to it, because Lewis's proof requires the conditional to be a proposition.

  **The Analogy:**
  *   **Truth-Conditional View:** "If it rains, the match is cancelled" is like a map. It depicts a specific territory. It is either an accurate map (True) or an inaccurate map (False). Lewis proved you can't make a map that works the way we want conditionals to work.
  *   **Suppositional View:** "If it rains, the match is cancelled" is not a map. It is a **compass instruction**. It tells you how to navigate your beliefs *if* you suppose the rain. It doesn't claim to be "true" in the world; it claims to be "assertible" or "reasonable" given your current information.

  By saying conditionals don't have truth conditions (they aren't True/False), the Suppositionalists render Lewis's triviality result irrelevant. Lewis proved you can't have a *truth-conditional* probability of conditionals equal to conditional probability. Suppositionalists say, "Exactly! That's why they aren't truth-conditional."

  ### 5. Is the Suppositional Theory a Corpse?
  Absolutely not. It is a live, dominant option, though it has rivals.

  *   **Camp A (Truth-Conditionalists):** They try to save the idea that conditionals are propositions. To do this, they usually have to modify the semantics (e.g., Robert Stalnaker's possible worlds semantics) or accept that the meaning of "if" shifts depending on context (contextualism). They often have to weaken The Equation slightly to avoid Lewis's result.
  *   **Camp B (Suppositionalists/Expressivists):** They say Lewis was right about propositions, so conditionals must not be propositions. They keep The Equation intact. This is currently very popular in linguistics and cognitive science because it aligns well with how humans actually process uncertainty (Bayesian reasoning).

  ### 6. Journalistic Takeaways for Your Piece
  If you want to capture the state of play accurately, here is the narrative arc:

  1.  **The Intuition:** It feels obvious that the probability of "If A then B" is just $P(B|A)$. (Adams' Thesis).
  2.  **The Obstacle:** David Lewis proved mathematically that if "If A then B" is a standard fact about the world (a proposition), this intuition is impossible. (Triviality).
  3.  **The Fork in the Road:** Philosophers had to choose:
      *   **Option 1:** Keep "If" as a fact, but admit the probability isn't exactly $P(B|A)$. (Hard sell, violates intuition).
      *   **Option 2:** Keep the probability as $P(B|A)$, but admit "If" isn't a standard fact/proposition. (The Suppositional Theory).
  4.  **The Current Consensus:** Most contemporary work leans toward Option 2. The "Triviality Result" didn't kill the Equation; it killed the idea that conditionals are simple truth-apt propositions.

  ### Summary for your notes:
  *   **Lewis did not kill** the idea that $P(\text{If } A \text{ then } B) = P(B|A)$.
  *   **Lewis killed** the idea that $P(\text{If } A \text{ then } B) = P(B|A)$ **AND** "If A then B" is a True/False proposition.
  *   **The Suppositional Theory survives** by denying that "If A then B" is a True/False proposition.
  *   **Status:** The Suppositional Theory is a live, leading contender, not a refuted corpse.

  If you frame it as "Lewis showed conditionals can't be standard facts, so we treat them as rules for belief," you will be on solid ground.
