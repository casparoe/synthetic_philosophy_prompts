prompt: |-
  I'm a science-and-ideas journalist working on a piece about the probability of conditionals, and I keep hitting a wall that I think I'm misunderstanding, so I'd rather check than publish something wrong.

  My working understanding is that Lewis's 1976 triviality result is basically the end of the story: if you try to say that the probability of the indicative conditional "if A then B" just is the conditional probability of B given A, then your probability function stops being closed under conditioning, so a perfectly rational person becomes irrational the moment they learn anything new. That sounds like a knockout blow, and I'm pretty sure thats why everyone now agrees the probability of the conditional has to be some separate thing from the conditional probability.

  But then I keep running into people defending the "suppositional" theory, which sounds like it says exactly the thing Lewis supposedly killed — namely that the probability of "if A then B" is P(B|A). So what am I missing? Is the suppositional theory just ignoring Lewis, is there a loophole in the result I don't know about, or is Lewis's result actually about something more specific than I think and the two sides are just talking past each other? I'd love a plain-English account of what the triviality result actually rules out, and whether the suppositional theory is a live option or a corpse.
