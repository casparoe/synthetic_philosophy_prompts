          *   *Diagnosis:* You can't have it both ways. If the *reason* lying is worse is the lack of epistemic resource for the hearer, then the moral status *must* depend on the hearer's ability to access resources.
          *   *Revision:* Give up (3). The normative status of the *interaction* depends on the hearer, even if the semantic content doesn't. Or, give up (2) as the *sole* explanation.
