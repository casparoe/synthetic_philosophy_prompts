      *   *(5) The Oath Case:* In high-stakes normative contexts (oath), the moral distinction collapses (Lying = Misleading), even if legal distinction holds.
      *   *(6) The Murderer Case:* In hostile/unjust contexts, the prohibition on lying dissolves (Lying is okay).

