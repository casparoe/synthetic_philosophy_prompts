          *   *Diagnosis:* Is the Court case "ceteris paribus"? The institutional duty changes the normative landscape. But if (2) is the *best explanation* (epistemic resource), the court case should still show a difference (since the truth is technically available in the evasive answer). If you say they are equal in court, you are admitting a *non-epistemic* factor (institutional duty) can override the epistemic factor.
          *   *Revision:* Qualify (1). It holds *absent specific institutional duties of candor*.
          *   *Cost:* Weakens the universality of (1). Suggests (2) isn't the whole story; sometimes duty trumps epistemic generosity.

      *   **Rank 3 (Low/Apparent): (2) vs. (6).**
          *   *Problem:* Does the murderer forfeit the right to the epistemic resource?
          *   *Diagnosis:* This dissolves if stated precisely. The duty to provide epistemic resources is owed to rights-bearers. Murderers forfeit this right in this context.
          *   *Revision:* None needed, just clarification. The "owe" in (6) matches the "leave him" in (2).
