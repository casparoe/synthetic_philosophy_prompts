answer: |-
  There is no single, canonical term in the philosophical literature that isolates this specific configuration of argumentative moves. The phenomenon is typically discussed as a subset of the **"Problem of Heterogeneous Bads"** (or "Problem of Heterogeneous Values") within pluralistic consequentialism, or under the broader umbrella of **"Incommensurability Objections"** to lexical views. However, these established terms describe the general difficulty of comparing different qualitative values; they do not specifically name the *asymmetric* deployment of commensurability standards (incommensurable across valence, commensurable across harm-types) that you have identified.

  To distinguish this from related logical errors:
  1.  **Vs. Category Mistake:** A category mistake attributes a property to a thing that cannot logically possess it (e.g., "pain weighs five pounds"). The pattern you describe does not claim suffering *is* pleasure, but rather assumes a *metric* exists between different suffering-types without demonstrating it. It is an error of measurement assumptions, not ontological classification.
  2.  **Vs. Scope Ambiguity:** Scope ambiguity implies a term (like "lexical") shifts definition mid-argument. Here, the definition of "lexical" remains stable (a threshold beyond which quantity cannot compensate); the error lies in the *domain of application*. The proponent assumes the lexical threshold established in Domain A (physical pain) automatically governs Domain B (existential dread) without justifying the bridge.
  3.  **Vs. General Incommensurability:** General incommensurability asserts that two values cannot be compared at all. The pattern you observe is more specific: it asserts *selective* commensurability. It claims Value and Disvalue are incommensurable (to protect the lexical priority of suffering), while simultaneously claiming Disvalue-Type-1 and Disvalue-Type-2 *are* commensurable (to allow ranking among harms). This creates a structural tension: if the qualitative gap between pain and pleasure is unbridgeable, the qualitative gap between pain and dread requires explanation to be bridgeable.

  Because this specific asymmetry lacks a standard name, I propose the following coinage to capture the structural mechanics of the argument:

  **Asymmetric Lexical Homogenization**

  This term captures the two essential components:
  1.  **Asymmetric:** It highlights that commensurability is applied unevenly (denied between valences, affirmed within disvalue).
  2.  **Lexical Homogenization:** It describes the act of treating qualitatively distinct forms of suffering as a uniform ("homogenized") substrate capable of sustaining a single lexical hierarchy, despite the lack of an inter-dimensional metric.

  \answer{Asymmetric Lexical Homogenization: The unjustified assumption that heterogeneous forms of disvalue share a common metric sufficient for lexical ranking, while simultaneously denying a common metric between disvalue and value.}
