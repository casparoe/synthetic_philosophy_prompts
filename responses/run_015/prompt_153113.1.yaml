answer: |-
  # Teaching Plan: The Erosion of Internal Modeling in AI-Assisted Reasoning

  **Session Duration:** 90 Minutes
  **Target Audience:** Intelligent non-specialists (regular LLM users, no technical/philosophical background)
  **Objective:** To distinguish between *extending* reasoning and *outsourcing* judgment, and to demonstrate how the latter replaces internal mental models with proxy models.

  ---

  ## I. The Preliminary Idea: Generative vs. Recognitive Competence
  **Dependency:** This concept must be established in the first 15 minutes. Without it, the distinction between extension and outsourcing is unintelligible.

  **The Concept:**
  You must establish that **understanding is not the possession of a correct answer, but the possession of the generative structure required to reconstruct that answer.**
  *   **Receptive/Recognitive Competence:** The ability to look at a solution and agree it looks correct (verification).
  *   **Generative Competence:** The ability to start from zero and derive the solution (construction).

  **Instructional Move:**
  Do not define this abstractly. Ask the group: *"If you lost your notes on how to file your taxes, could you reconstruct the logic from memory, or would you only know the forms look familiar?"*
  *   **Goal:** Secure agreement that "knowing what looks right" is cognitively distinct from "knowing how to make it right." This gap is where the erosion happens.

  ---

  ## II. The Anchor Scenario: "The Constrained Itinerary"
  **Dependency:** Introduced immediately after the Preliminary Idea (Minutes 15–45). This scenario carries the entire session.

  **The Scenario:**
  The group is asked to plan a 3-day trip to a foreign city with four specific, conflicting constraints (e.g., Museum A is only open Tuesday; Restaurant B requires a 24-hour booking; Hotel C is 45 minutes from the train station; Meeting D is fixed at 10:00 AM on Day 2).
  *   **Condition A (Extension):** The participants draft the itinerary themselves, using AI only to check train times or opening hours.
  *   **Condition B (Outsourcing):** The participants feed all constraints into the AI and accept the generated itinerary, only checking that the constraints appear to be met.

  **Required Properties of the Scenario:**
  1.  **High Interdependency:** Changing one variable (e.g., lunch time) breaks another (e.g., museum entry). This forces a mental model of the *system*, not just the *steps*.
  2.  **Verifiable Outcome:** It is easy to see if the plan "works" (did you make the meeting?). This tempts the "verification is understanding" misconception.
  3.  **Opaque Derivation:** The AI's reasoning for *why* it ordered events X, Y, and Z is not immediately visible, only the schedule itself.
  4.  **Low Technical Barrier:** No coding or specialized jargon is required to understand the constraints.

  **Properties It Must Lack:**
  1.  **Emotional Stakes:** Do not use medical or legal advice; this triggers fear rather than cognitive analysis.
  2.  **Subjective Quality:** Do not use creative writing; "better" is too subjective. The itinerary is either feasible or it is not.

  ---

  ## III. The Explanatory Arc & Misconception Management
  **Dependency:** This section runs from Minutes 45–75. It builds the argument using the scenario.

  ### Phase 1: The Distinction (Minutes 45–60)
  Compare Condition A and Condition B.
  *   **Extension:** In Condition A, the AI is a lookup table. The *user* holds the causal model of the day (e.g., "I put the museum first because the restaurant is far away").
  *   **Outsourcing:** In Condition B, the *system* holds the causal model. The user holds a **Proxy Model**.
  *   **Definition of Proxy Model:** A mental map not of the territory (the city/constraints), but of the tool (what the AI is likely to suggest).

  ### Phase 2: Head Off Misconceptions (Minutes 60–75)
  You must intervene at these precise points to prevent the argument from collapsing into familiar tropes.

  **Misconception 1: "If I can verify the output, I understand it."**
  *   **Predictable Origin:** During Phase 1, when participants argue that checking the itinerary against the constraints proves they understand the plan.
  *   **Precise Intervention:** Immediately point out that verification is *retrospective*, while modeling is *prospective*. Ask: *"If the train strikes and you must change one thing, do you know which other three things will break?"* If they cannot answer without asking the AI again, they possess verification, not a model.

  **Misconception 2: "This is the same as using a calculator or Google Search."**
  *   **Predictable Origin:** When defining "Outsourcing." Participants will argue we have always outsourced arithmetic to calculators without losing math skills.
  *   **Precise Intervention:** Distinguish **Computation** from **Synthesis**. A calculator performs a low-level operation you explicitly command (2 + 2). An LLM performs high-level synthesis you implicitly delegate (the logic of the itinerary).
  *   **The Pivot:** *"When you use a calculator, you still decide which numbers to multiply. When you outsource judgment, you are asking the tool to decide which numbers matter."*

  **Misconception 3: "Efficiency is the only metric that counts."**
  *   **Predictable Origin:** Towards the end of Phase 2. Participants will argue that if the AI does it faster, the loss of the model is an acceptable trade-off.
  *   **Precise Intervention:** Acknowledge efficiency but reframe the cost. The cost is not time; the cost is **resilience**. *"You are trading the ability to function when the tool is unavailable or wrong."*

  ---

  ## IV. Deliberate Exclusions
  **Dependency:** State these boundaries at the start of Phase 1 (Minute 45) to keep the group focused on the cognitive mechanism rather than peripheral debates.

  1.  **AI Accuracy:** Do not discuss whether the AI is hallucinating or correct. The erosion happens even if the AI is 100% correct.
  2.  **AI Sentience/Architecture:** Do not discuss how the LLM works (weights, transformers) or whether it "thinks." Focus strictly on the *user's* cognitive state.
  3.  **Policy/Regulation:** Do not discuss copyright, privacy, or societal regulation. This is a session on individual cognitive hygiene.

  ---

  ## V. The Final Assessment Question
  **Dependency:** Posed at Minute 80. Allow 10 minutes for silent reflection and discussion.

  **The Goal:** The question must not allow for a vague "AI is bad" answer. It must force them to identify the specific mechanism of erosion (the replacement of the internal model with the proxy model).

  **The Question:**
  > "Think of a task where you now use AI to produce the first draft or initial plan. If the AI produced a solution that was **internally consistent and satisfied all your stated constraints, but was based on a false assumption about how the world works**, how would you detect that error? Specifically, what part of your own knowledge would you have to consult to catch it, and do you still possess that knowledge, or do you now only possess the knowledge of how to prompt the AI?"

  **Success Criteria:**
  *   **Failure:** Answers focusing on "I would check facts" or "I would use another AI." (This indicates reliance on the proxy).
  *   **Success:** Answers that identify a specific gap in their own generative competence. (e.g., *"I wouldn't catch it, because I no longer know the underlying rules, only the output format."*)

  ---

  ## VI. Summary of Dependency Order
  1.  **Establish Generative vs. Recognitive Competence** (Prerequisite for understanding "modeling").
  2.  **Introduce Constrained Itinerary Scenario** (Concrete ground for the abstract concept).
  3.  **Define Extension vs. Outsourcing** (Using the scenario to illustrate the difference).
  4.  **Introduce Proxy Model Concept** (Naming the erosion mechanism).
  5.  **Intervene on Misconceptions** (Verification, Calculator, Efficiency) *as they arise* during the definition phase.
  6.  **State Exclusions** (Keep focus on cognition, not tech/policy).
  7.  **Pose Final Assessment Question** (Test for internalization of the erosion mechanism).
