answer: |-
  Good morning, and welcome.

  To our students joining us from the Netherlands and Japan, to the teachers guiding them, to the parents here supporting this exchange, and to the graduate students studying the very words we are about to use: thank you for being here.

  Standing at this podium, I am aware of a specific challenge. In some cultures, a good speaker gets straight to the point. Clarity is kindness. In others, a good speaker reads the air, ensuring harmony is kept before truth is spoken. Ambiguity is kindness.

  So, for the next four minutes, I will try to do both. I will state my questions clearly, but I will not force your answers.

  We are gathered to talk about pragmatics—how we use language in real life. Specifically, we are looking at the "white lie." We all know the moment. Someone asks, "How are you?" You are tired, or stressed, or unhappy. But you say, "I'm fine."

  Traditionally, we might call this a deception. You are saying something that is not factually true. But I want to propose a different way to see it. When you say "I'm fine," you are not just hiding the truth. You are performing a kind of temporary social reality. You are building a small, shared bubble where, for this moment, everything *is* fine. You are co-constructing a space where the conversation can happen without the weight of your exhaustion crushing the other person's day.

  This brings us to a difficult question. Is this bubble immoral?

  For our friends from cultures that value directness, this bubble might look like inauthenticity. If we value being "real," then hiding our true state feels like a failure of character. Why pretend?

  For our friends from cultures that value harmony, this bubble might look like necessary social glue. If we value "wa," or peace, then burdening others with our raw truth feels like a failure of empathy. Why hurt?

  I am not going to answer this for you today. If I did, I would be violating the spirit of both groups. I would be too direct for some, and too presumptuous for others.

  Instead, I want to ask you to watch how we build these realities this weekend. When we smooth over a conflict, are we lying? Or are we protecting the relationship so that truth can be heard later? When we are brutally honest, are we being authentic? Or are we prioritizing our own clarity over another's comfort?

  To the linguists in the room, you will see the face-work involved. To the parents and students, you will feel the emotional weight of it.

  My hope is that by Friday, we won't just understand each other's languages. We will understand the architecture of the bubbles we live in. We will see whether those bubbles are walls that keep us apart, or shelters that keep us safe.

  Let's begin the work. Thank you.
