          *   *For Japanese:* Polite phrasing, emphasis on shared learning, avoiding absolute judgments.
          *   *For Linguists:* Use terms like "pragmatics," "social reality," "face," but explain them simply.
          *   *For Parents:* Keep it grounded in everyday experience.

  4.  **Drafting - Iteration 1 (Mental Outline):**
