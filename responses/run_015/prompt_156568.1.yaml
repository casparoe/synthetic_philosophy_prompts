      *   **Time:** Friday (implied upcoming).
      *   **Topic:** Dutch directness vs. Japanese indirectness, white lies, morality of politeness.
      *   **Key Concept:** White lies as performing a "temporary social reality" (e.g., saying "I'm fine" creates a bubble where we are fine).
      *   **Constraint 1 (Structural):** The speech itself must navigate being direct enough for Dutch attendees but indirect enough for Japanese attendees (meta-pragmatic performance).
      *   **Constraint 2 (Audience):** Linguists/pragmaticians should catch references, parents/non-experts shouldn't get lost.
      *   **Constraint 3 (Length):** About 4 minutes (approx. 500-600 words spoken at a normal pace).
      *   **Constraint 4 (No Citations):** No wifi, so no references/reading list.
      *   **Constraint 5 (Internal Consistency):** Check for contradictions arising from the direct/indirect tension.

  2.  **Deconstruct the Meta-Pragmatic Challenge:**
      *   *Dutch Expectation:* Get to the point, be honest, don't waste time, value authenticity ("doe normaal").
      *   *Japanese Expectation:* Read the air (*kuuki wo yomu*), value harmony (*wa*), avoid confrontation, use ambiguity (*aimai*).
      *   *The Balancing Act:* I need to state my thesis clearly (for the Dutch) but frame it as an invitation to explore rather than a declaration of truth (for the Japanese). I need to be honest about the tension without causing loss of face.
      *   *The "White Lie" Concept:* Framing politeness not as deception but as co-constructing a social reality. This appeals to the pragmatics students (face theory, common ground) without alienating parents (common experience).

  3.  **Drafting - Section by Section:**

      *   **Welcome (The Hook):** Acknowledge everyone. Validate the distance traveled (physical and cultural).
      *   **The Tension (The Core):** Address the Dutch/Japanese communication styles.
          *   *Strategy:* State the difference clearly (Direct) but frame it as complementary strengths (Indirect/Harmonious).
      *   **The Concept (White Lies/Reality):** Introduce the "temporary social reality" idea.
          *   *Strategy:* Use a concrete example ("I'm fine"). Explain the function.
      *   **The Question (Morality):** Ask if this is immoral.
          *   *Strategy:* Don't answer definitively. Leave it open for the workshop. This satisfies the Japanese preference for consensus-building and the Dutch preference for critical inquiry.
