  6.  **Refining the Language (Pragmatics & Consistency):**
      *   *Avoid Contradiction:* I cannot say "Directness is best" then "Indirectness is best." I must say "Both construct reality differently."
      *   *Linguist Nods:* Mention "context," "construction," "face."
