      *   *Refining the "Parrot" Definition:* Ensure it's clear that "Stochastic Parrot" is a claim about *internal state/semantics*, not *external performance*.

  7.  **Final Review:** Does this look like something two philosophers could sign? It needs to be rigorous enough for a grad course. The "Crux" column needs to be sharp. The "Predictions" need to be divergent.

      *(Self-Correction on the "Harm" point)*: The prompt says the SPT holds "deploying them as if they understood is a genuine harm." The Functionalist might not agree that it *is* a harm, but they can agree that the *question* of harm is distinct from the *question* of understanding. I will phrase the joint claim to reflect that the *evaluation* of harm is a separate normative inquiry, even if the SPT thinks the metaphysical status drives the normative status. Actually, looking closer at the prompt: "the separate question of whether deploying the models is harmful stays live even if the two sides never resolve the understanding question." Okay, I will make sure they agree that policy decisions shouldn't wait for metaphysical resolution.

      *(Self-Correction on Verbal/Substantive)*: I need to be careful not to dismiss the dispute as *merely* verbal. Functionalists think the verbal definition *is* the substantive reality. SPTs think the definition points to a missing substance. I will characterize it as a "partially verbal dispute with substantive downstream consequences."

  8.  **Final Polish:** Check the voice. It should sound like a consensus document. "We, the undersigned..."

      *(Final check on the Table)*: Ensure the "Predictions" column clearly shows the divergence.
      *   Test: Systematicity. F: Pass implies understanding. SPT: Pass implies better statistics.
      *   Test: Grounding. F: Multimodal input counts as grounding. SPT: Still just correlation between modalities.

