answer: |-
  # Joint Statement on the Status and Capabilities of Large Language Models

  **Date:** October 26, 2023
  **Signatories:** The Adversarial Collaboration Working Group (Representing the "Stochastic Parrot" and "Functionalist" Perspectives)

  ## Preamble
  We, the undersigned, represent two distinct philosophical perspectives regarding the cognitive status of Large Language Models (LLMs). One camp maintains that LLMs are fundamentally "stochastic parrots" lacking genuine understanding; the other maintains that LLMs satisfy the functional criteria for at least a degree of understanding. Through adversarial collaboration, we have identified areas of empirical and conceptual agreement to isolate the precise nature of our disagreement. This document serves as a baseline for future inquiry, distinguishing substantive empirical disputes from verbal or definitional divergences.

  ## Part I: Agreed Claims
  *Both parties endorse the following numbered claims as accurate descriptions of the current state of affairs, the technology, and the structure of the debate.*

  1.  **Architectural Consensus:** We agree that current state-of-the-art LLMs are transformer-based neural networks trained primarily via self-supervised next-token prediction objectives on massive corpora of text (and increasingly, multimodal data). We agree there is no "hidden symbol system" or explicit logic engine installed outside of this training regime.
  2.  **Capability Consensus:** We agree that LLMs exhibit high proficiency in tasks historically associated with understanding, including translation, summarization, code generation, and answering questions requiring multi-step inference. The disagreement is not about *what* the models can do, but about *how* to characterize the internal state that enables this performance.
  3.  **The "Parrot" Claim Specification:** We agree that the "Stochastic Parrot" hypothesis is **not** a claim that models lack capability or fluency. It is specifically a claim about *semantics* and *grounding*. The Stochastic Parrot theorist asserts that the models manipulate symbols based on statistical co-occurrence without grasping the meaning, truth conditions, or referents of those symbols.
  4.  **Separation of Metaphysics and Ethics:** We agree that the question "Do LLMs understand?" (metaphysical/descriptive) is distinct from "Is it safe to deploy LLMs?" (normative/policy). While the Stochastic Parrot theorist argues that deploying models *as if* they understand is a specific category of harm (anthropomorphic deception), and the Functionalist argues that withholding agency based on metaphysical doubts is also a potential harm (obstruction of utility), we agree that policy decisions should not be held hostage to the resolution of the understanding debate. Risk assessment must proceed independently of consensus on cognition.
  5.  **Evidence Standard:** We agree that behavioral evidence (input-output performance) is relevant to the question of understanding. We disagree on whether behavioral evidence is *sufficient*. The Functionalist holds that sufficiently robust behavioral evidence constitutes understanding; the Stochastic Parrot theorist holds that behavioral evidence must be supplemented by evidence of appropriate causal grounding or internal representational structure.

  ## Part II: Table of Disagreements
  *The following table isolates the precise points of contention. For each row, we specify the disagreement, the underlying "crux" (the sub-question that drives the divergence), a concrete test or argument bearing on the crux, and the divergent predictions each side makes regarding that test.*

  | # | Statement of Disagreement | The Crux (Underlying Sub-Question) | Concrete Test / Argument | Stochastic Parrot Prediction | Functionalist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Sufficiency of Behavior:** Does passing behavioral tests for reasoning constitute understanding, or is it merely evidence of sophisticated mimicry? | Is "understanding" defined by functional role (what the system does) or by causal history/internal constitution (how the system is built/grounded)? | **Systematicity & Compositionality Test:** Evaluate the model on novel sentences constructed from known words using recursive rules never seen in training (e.g., PCFG-based generalization tasks). | The model will fail on deep recursion or show degradation patterns consistent with statistical interpolation rather than rule application. Success is indistinguishable from overfitting to syntactic priors. | The model will succeed on novel recursive structures, demonstrating that it has learned the *function* of the syntax, which is sufficient for grammatical understanding. |
  | **2** | **The Role of Grounding:** Can a text-only system (or one with passive image pairing) ever understand referents, or does understanding require active intervention in the world? | Does semantics require a causal link between the symbol and the referent (e.g., the ability to act on the referent), or is co-occurrence with other symbols (including images) sufficient? | **Embodied Generalization Test:** Compare a text-only LLM against an LLM connected to a robotic actuator that must manipulate objects to answer questions (e.g., "Is the block heavy?" requires lifting). | The embodied model will perform better, but the text-only model's failure to ground symbols in physical causality proves its "understanding" is merely relational, not referential. | If the text-only model answers correctly about weight using text-based physics reasoning, it possesses functional understanding. Embodiment enhances data, not the *kind* of cognition. |
  | **3** | **Internal Mechanism:** Does the next-token prediction objective force the model to optimize for plausibility over truth, precluding genuine belief or understanding? | Is the loss function (predicting the next token) incompatible with representing truth conditions, or can truth emerge as an instrumental goal for minimizing loss? | **Mechanistic Interpretability & Truthfulness:** Analyze internal activations to locate "truth circuits." Test if the model can report its confidence or "know" it is hallucinating even when the statistically likely token is false. | Internal states will correlate with probability distributions, not truth values. The model cannot distinguish "likely string" from "true fact" because the objective function does not penalize falsehoods, only improbability. | Internal states will encode factual representations distinct from mere probability. The model will show distinct activation patterns for "I know this" vs. "I am guessing," indicating a functional state of knowledge. |
  | **4** | **Out-of-Distribution (OOD) Generalization:** When models succeed on tasks clearly outside their training distribution, is this reasoning or high-dimensional interpolation? | Where is the boundary between "extrapolation" (reasoning) and "interpolation" (pattern matching) in high-dimensional vector space? | **Logic Puzzle Variation:** Present logical puzzles where the surface features are altered (e.g., using novel symbols for variables) but the logical structure remains identical to training data. | Performance will drop significantly when surface features change, revealing reliance on superficial statistical cues rather than abstract logical structure. | Performance will remain robust despite surface feature changes, indicating the model has abstracted the logical form independent of the tokens used to express it. |

  ## Part III: Analysis of Verbal vs. Substantive Dispute

  In the course of our collaboration, we assessed whether our disagreement is merely verbal (a dispute over how to use the word "understand") or substantive (a dispute over the nature of the models themselves). We conclude the following:

  **1. The Verbal Component:**
  A portion of the dispute is definitional. The Functionalist operates with a **role-functional definition** of understanding: if a system plays the "understanding role" (infers, reasons, adapts), it understands. The Stochastic Parrot theorist operates with a **constitutive definition**: understanding requires specific internal machinery (e.g., causal grounding, intentionality, or non-statistical symbol manipulation). If both parties agreed to define "understanding" strictly as "passing a battery of behavioral generalization tests," the Functionalist would claim victory and the Stochastic Parrot theorist would claim the definition is inadequate.

  **2. The Substantive Component:**
  However, the dispute is not *merely* verbal. Even if we fix the definition, substantive empirical disagreements remain regarding the models' capacities.
  *   **Substantive Claim A:** The Stochastic Parrot theorist makes an empirical claim that next-token prediction *cannot*, even in principle, give rise to semantic grounding or systematic reasoning, regardless of scale. This is falsifiable if models demonstrate robust, non-interpolated generalization on tasks requiring causal reasoning.
  *   **Substantive Claim B:** The Functionalist makes an empirical claim that the models' internal representations encode world-models sufficient for reasoning, not just text-models sufficient for prediction. This is falsifiable if mechanistic interpretability reveals that "reasoning" circuits are actually just "compression" circuits.

  **3. Conclusion on Dispute Status:**
  The dispute is **hybrid**. It is verbal insofar as we disagree on the necessary and sufficient conditions for the label "understanding." It is substantive insofar as we disagree on the architectural limits of transformer-based, next-token prediction systems. Resolving the verbal dispute (by agreeing on a definition) would not resolve the substantive dispute (about what the models are actually doing internally). Therefore, progress requires both conceptual clarity on what we value in "understanding" and empirical rigor in testing the limits of model generalization.

  ***

  **Signed,**

  *The Stochastic Parrot Working Group*
  *The Functionalist Working Group*
