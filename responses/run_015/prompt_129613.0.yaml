answer: |-
  You have correctly identified that this is not a biological disagreement, but a metaphysical one. You and your friend are not fighting about facts; you are fighting about **ontology** (what kind of thing "life" is) and **modality** (how we use possibility to define reality).

  There is no single common English word for this specific pattern, but in philosophy of biology and metaphysics, the structure you have noticed has a precise diagnosis. It is a combination of **Sortal Ambiguity** and **Vehicle-Process Decoupling**, resolved via **Dispositional Classification**.

  Here is the breakdown of the terms, why "cluster concept" was unsatisfying, and how to apply this to your test cases.

  ### 1. The Name of the Phenomenon: Vehicle-Process Decoupling
  Your observation that "the object and the activity can come apart" is the core insight. In metaphysics, this is a mismatch between **Substance Ontology** (things that exist) and **Process Ontology** (events that happen).

  *   **The Easy Cases:** In a dog, the "vehicle" (the physical body) and the "process" (metabolism, growth) are co-located and continuous.
  *   **The Hard Cases:** You are encountering **Vehicle-Process Decoupling**.
      *   **Temporal Decoupling:** The seed. The vehicle exists, but the process is paused.
      *   **Spatial/Structural Decoupling:** The virus. The vehicle exists, but the process requires an external engine (the host cell).
      *   **Lineage Decoupling:** The mule/cell line. The process continues, but the historical link to the origin vehicle is broken or sterile.

  When you argue, you are trying to force a **Process** (living) into a **Sortal** category (a "kind" of thing).

  ### 2. The Name of the Move: Dispositional Classification
  You noticed that you classify based on "what the thing would do under different conditions." In philosophy, this is classifying by **Dispositional Properties** (or **Modal Properties**) rather than **Categorical Properties**.

  *   **Categorical:** What is true *now*? (The seed is not metabolizing. The virus is not replicating.)
  *   **Dispositional:** What *would* happen if...? (The seed *would* grow if planted. The virus *would* replicate if injected.)

  Your argument persists because one of you is prioritizing **Categorical** criteria (current metabolism) and the other is prioritizing **Dispositional** criteria (potential heredity/growth). There is no name for the *argument* itself other than **Semantic Indecision**, but the *move* you are making is **Dispositional Attribution**.

  ### 3. Why "Cluster Concept" Didn't Satisfy You
  You rejected "cluster concept" because it describes the *symptoms* (we swap criteria) but not the *cause* (why do we swap?).

  The sophisticated version of this is the **Homeostatic Property Cluster (HPC)** theory (proposed by Richard Boyd). It explains *why* the criteria swap:
  *   Properties (metabolism, heredity, boundary) cluster together because there is an underlying causal mechanism (evolution/biochemistry) that keeps them together.
  *   In "easy" cases, the mechanism is visible, so the cluster holds tight.
  *   In your "hard" cases (dormancy, viruses), the underlying mechanism is **obscured or interrupted**.
  *   Because the mechanism is hidden, the cluster frays. You swap criteria because you are guessing at the hidden mechanism. One of you weights "metabolism" higher; the other weights "heredity" higher.

  So, "cluster concept" is the *logic*, but **Vehicle-Process Decoupling** is the *trigger* that breaks the cluster.

  ### 4. Applying the Account to Your Test Cases
  If we accept **Vehicle-Process Decoupling** as the source of the ambiguity, and **Dispositional Classification** as the method of resolution, here is how the cases should fall out:

  **A. The Candle Flame**
  *   **Status:** **Not Borderline (Not Alive).**
  *   **Why:** A flame has a process (oxidation) and a "boundary" (the shape), but it lacks a **Vehicle** with **Dispositional Heredity**. It does not carry a blueprint for making new flames. It is a pure process without a replicating vehicle. It fails the Dispositional test immediately.

  **B. The Mule**
  *   **Status:** **Alive (but Evolutionary Dead End).**
  *   **Why:** This is a **Lineage Decoupling**. The mule has full metabolic process and a vehicle. It fails the "reproduction" criterion categorically. However, under Dispositional Classification, we look at the *system* it belongs to. It is part of a living lineage (horses/donkeys), even if it is a terminus.
  *   **Verdict:** It is alive because the *vehicle* is sustaining the *process*, even if the process cannot extend the lineage further. Calling it "less alive" is a category error; it is "less evolutionary," which is different.

  **C. The Cell Line (HeLa)**
  *   **Status:** **Alive (New Individual).**
  *   **Why:** This is **Vehicle Separation**. The original organism died, but the *process* found a new vehicle (the culture).
  *   **Verdict:** Under Dispositional Classification, the cells *would* divide if fed. They carry the heredity. The fact that the original "owner" died is irrelevant to the ontological status of the cells. They are a distinct, living asexual lineage now.

  **D. The Computer Virus**
  *   **Status:** **Not Borderline (Not Alive).**
  *   **Why:** This is a **Metaphorical Decoupling**. It has heredity (code) and replication, but it lacks a **Physical Vehicle** subject to thermodynamic constraints.
  *   **Verdict:** Life, as we define it, is a physical process resisting entropy. A computer virus is a logical pattern. Unless you are a substrate-independent functionalist (believing life can exist in any medium), this is a metaphor, not a borderline case.

  ### 5. What Would Break the Carving?
  You asked what case would break this account rather than just be a hard call.

  **The Breaker Case: The Perfect Molecular Zombie.**
  Imagine a being that is molecule-for-molecule identical to a human. It metabolizes, it grows, it has a boundary. But it lacks **Dispositional Heredity**. Its DNA is chemically inert; it *cannot* replicate, not because of a mutation (like the mule), but because the chemical code is structurally incapable of unzipping, even though it looks identical.
  *   **Categorical View:** It is alive (it metabolizes).
  *   **Dispositional View:** It is not alive (it *cannot* evolve/reproduce, even hypothetically).
  *   **The Break:** If you and your friend disagree on this, your argument is not about biology. It is about whether **Life is a Thermodynamic State** (current metabolism) or an **Informational Process** (future heredity).

  ### Summary
  *   **The Pattern:** **Vehicle-Process Decoupling**.
  *   **The Move:** **Dispositional Classification** (relying on Counterfactuals).
  *   **The Metaphysical Error:** **Sortal Ambiguity** (treating "Life" as a permanent Kind rather than a temporary Phase).
  *   **The Resolution:** Stop asking "Is it alive?" (Noun). Start asking "Is the living process currently coupled to this vehicle?" (Verb).

  If you use this framework, you won't solve the argument (because you still have to decide how much weight to give disposition vs. category), but you will stop arguing about facts and start arguing about definitions, which is where the fight actually is.
