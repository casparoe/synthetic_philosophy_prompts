answer: |-
  Two institutional economists are hiking through a utopian commune that's currently collapsing. They see a crowd of philosophers standing in a tight circle, guarding a sign that reads "JUSTICE."

  "Why are they hoarding that?" asks the junior economist.

  "They think Justice is a common-pool resource," says the senior. "Rivalrous and non-excludible. They're afraid if too many people stand on the concept at once, the grass gets trampled. They're rationing definitions to prevent overgrazing."

  The junior economist laughs. "But Justice is a pure public good. It's non-rivalrous. You can't deplete an abstraction by using it. My understanding doesn't reduce your supply."

  "Tell them that," says the senior.

  The junior steps forward. "Hey! You can't overgraze an idea! It's non-rivalrous! Everyone can use it simultaneously without depletion!"

  The head philosopher lowers his guard, looking relieved. "So... if I invoke Justice repeatedly, it doesn't wear out?"

  "No!"

  "And since it's non-excludible, you can't stop me from benefiting from it even if I don't help define it?"

  "Technically, no."

  "Wonderful," says the philosopher, turning to the crowd. "Stop conserving! Everyone just assume someone else is doing the work of enforcement while we reap the benefits."

  The junior economist watches the commune dissolve into chaos. "They understood the distinction."

  "Yes," says the senior, turning back to the trail. "They realized the tragedy was never about the grass. It was about who pays for the fence."
