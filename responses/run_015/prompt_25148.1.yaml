      *   (8) Virtual Currency Scam (Earned only): *Wrong, but less serious.* (Labor/Time vs. Cash).

  3.  **Synthesize the Pattern (Drafting Principles):**
      *   *Hypothesis 1: Real World Value.* (Fits 2, 4, 7. Struggles with 1, 6, 8). If it's just about cash, 1 and 6 shouldn't matter much. But the user says they *do* matter.
      *   *Hypothesis 2: Sentience/Consciousness.* (Fits 4, 5. Struggles with 1, 2, 6, 7, 8). Objects aren't sentient, but their loss hurts sentient people.
      *   *Hypothesis 3: Human Investment + Social Meaning.* This looks promising.
          *   (1) Hours (Investment) + Game Economy (Social).
