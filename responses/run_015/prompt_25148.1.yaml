          *   *Tension:* Why is stealing a sword (Case 1) seemingly more robustly "real" than stealing earned currency (Case 8)? Usually, currency is *more* fungible/valuable than a specific sword.
          *   *Possible Resolution:* The sword represents *identity* and *achievement* (Extended Agency), whereas currency is just *potential*. Or, the user might be inconsistent here.
          *   *Another Tension:* Case 3 (Leak) vs Case 2 (Delete). The principle holds (destruction of object vs. violation of right), but the user needs to accept that "loss of control" is a distinct category of harm, not just "less destruction."
