      *   (3) Art Leak: Loss of control (agency), but object remains. *Fits distinction.*
      *   (4) VR Groping: Psychological impact (phenomenology), Social violation. *Fits.*
      *   (5) NPC Kill: No human agency invested in the NPC, no social witness. *Fits.*
      *   (6) Memorial: High emotional investment, Deep Social Meaning. *Fits (and explains why it's worse than the sword).*
      *   (7) Currency (RMT): Direct Economic link (Real World Agency). *Fits.*
      *   (8) Currency (Earned): Time investment, but weaker Economic link. *Fits (explains why it's less serious than 7).*

