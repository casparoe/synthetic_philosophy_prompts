answer: |-
  Good evening everyone. Looking around this room, I am struck by the fact that we are gathered here from two very different worlds, yet we are all united by the same person. On one side, we have family who know Ms. Drake as an aunt and a sister, and on the other, we have students and neighbors who know her as a teacher and a partner in local work. Usually, at a retirement dinner, people talk about how well someone played on a team or how loyal they were to a cause, but if you know Ms. Drake, you know that kind of language would not quite fit her. For thirty years, she taught us that there is a force in the world, a kind of gravity of the collective, that tries to pull our judgment downward whenever we pledge too much loyalty to a group. She believed that when we let a party or a movement do our thinking for us, we lose the ability to see the people standing right in front of us. She never joined a political party not because she didn't care, but because she cared too much to let any machine dull her vision.

  To her family here tonight, who might have wondered why she always stayed independent or refused to pick a side in the way everyone else did, I hope you can hear this as a testament to how much she loved you. Her refusal to be swept up by the crowd was not a form of distance; it was a way of making sure she had enough clear sight to see you as individuals. When she listened to a niece talk about school or a nephew talk about work, she was not filtering them through a platform or an ideology. She was giving them the gift of her own unclouded attention. She protected her own mind so that she could be fully present for the people she loved, rather than being partially owned by an abstraction. That is why she could be so deeply involved in politics for decades without ever becoming hardened or cynical. She was fighting for people, not for power.

  To those of us who marched with her or sat in her classroom, we know that this stance required a quiet kind of courage. It is much easier to march in lockstep than it is to walk alone while surrounded by allies. She taught us that true civics is not about winning arguments for a side, but about preserving the human capacity to tell the truth. She never asked us to follow her, but to think for ourselves, even when that meant disagreeing with her. That is a rare gift in a teacher and an even rarer gift in a friend. She showed us that you can serve a community without surrendering your soul to it. Now, as she steps into retirement, she is finally releasing herself from the weight of public expectation entirely. She has spent thirty years resisting the gravity that pulls us all down, and now she earns the right to float. So let us raise a glass not to her loyalty to a group, but to her fidelity to her own conscience and to the individuals she has served so well. To Ms. Drake, may your future be light, may your judgment remain your own, and may you enjoy the freedom of belonging to no one but yourself.
